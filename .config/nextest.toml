experimental = ["setup-scripts"]

# one PostgreSQL server per run; each test then copies a template database on it instead of starting a server of its own
[scripts.setup.postgres]
command = "tools/postgres-fixture/nextest-postgres.sh"
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.default]
# the dashboard browser test needs Node, Chromium and a built bundle, so only tools/dashboard/browser-check.sh runs it
default-filter = "not package(betterlite-dashboard-browser)"
# a hung test fails after 10 minutes instead of holding a CI job until its 120-minute limit
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.scripts]]
filter = "rdeps(betterlite-postgres-fixture)"
setup = "postgres"

# CI's task part reports up to 20 failing tests in one fix round instead of stopping at the first
[profile.task]
fail-fast = { max-fail = 20 }
