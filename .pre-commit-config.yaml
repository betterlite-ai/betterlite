minimum_prek_version: "0.4.9"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^(\.development/schema/|tools/oracle/cases/)|/fixtures/|/fuzz/(corpus|artifacts)/

repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      # Codex keeps .codex/ and Claude keeps .claude/ read-only for their agents, and these two fixers open every file for writing
      # rustfmt ends every .rs file, and an empty one as a single newline that this fixer would strip again
      - id: end-of-file-fixer
        exclude: ^\.(codex|claude)/|\.rs$|/fuzz/corpus/
      - id: trailing-whitespace
        exclude: ^\.(codex|claude)/|/fuzz/corpus/

  - repo: local
    hooks:
      - id: no-file-start-comments
        name: no file-start comments
        entry: >-
          awk 'FNR==1{j=0} !j&&NF{sub(/^[ \t]+/,""); if(/^\/[\/*]/||(/^#/&&!/^#[![]/)){print FILENAME": file starts with a comment";e=1} j=1} END{exit e}'
        language: system
        types: [text]
        exclude: (^|/)Cargo\.lock$|\.md$|^LICENSE$
      # parallel tasks add dependencies to the same manifests; in name order they rarely touch the same gap
      - id: sorted-dependencies
        name: dependency tables in name order
        entry: >-
          env LC_ALL=C awk 'FNR==1{t=0} /^\[/{t=/dependencies\]$/; p=""; next} !NF{p=""} t&&/^[A-Za-z0-9_-]/{k=$0; sub(/[ .=].*/,"",k); if(p!=""&&k<p){print FILENAME": "k" goes before "p; e=1} p=k} END{exit e}'
        language: system
        files: (^|/)Cargo\.toml$
      - id: no-tests-in-implementation
        name: implementation files carry no test code
        entry: >-
          awk '/#\[test\]|#\[cfg\(test\)\]/{print FILENAME": test code inside implementation";e=1} END{exit e}'
        language: system
        files: ^(crates|tools|\.development/gate)/([^/]+/)?src/.*\.rs$
        exclude: /tests(\.rs$|/)
      - id: tests-file-self-gates
        name: a tests.rs opens with its gate
        entry: >-
          awk 'FNR==1&&$0!="#![cfg(test)]"{print FILENAME": missing leading #![cfg(test)]";e=1} END{exit e}'
        language: system
        files: ^(crates|tools|\.development/gate)/([^/]+/)?src/(.*/)?tests\.rs$
      - id: ast-grep
        name: ast-grep rules
        entry: ast-grep scan
        language: system
        types_or: [rust, python]
      - id: typos
        name: typos
        entry: typos
        language: system
        types: [text]
        exclude: ^\.development/
      - id: fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        exclude: ^\.development/gate/
        require_serial: true
      - id: zizmor
        name: zizmor
        entry: zizmor --offline
        language: system
        files: ^\.github/(workflows/[^/]+|actions/[^/]+/action)\.ya?ml$
      - id: ruff-helpers
        name: ruff on the oracle Python helpers
        entry: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers
        language: system
        files: ^tools/oracle/helpers/.*\.py$
        pass_filenames: false
      - id: basedpyright-helpers
        name: basedpyright on the oracle Python helpers
        entry: uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
        language: system
        files: ^tools/oracle/helpers/.*\.py$
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]
        priority: 100
      - id: nextest
        name: cargo nextest
        entry: cargo nextest run --workspace --locked --no-tests=warn
        language: system
        pass_filenames: false
        stages: [pre-push]
        priority: 101
      - id: deny
        name: cargo deny
        entry: cargo deny --locked check
        language: system
        files: (^|/)(Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false
        stages: [pre-push]
        priority: 101
      - id: shear
        name: cargo shear
        entry: cargo shear
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]
        priority: 101
