[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = ["RUSTSEC-2024-0449"]

[licenses]
version = 2
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
  { crate = "native-tls", use-instead = "rustls" },
  { crate = "sqlx", use-instead = "tokio-postgres" },
  { crate = "betterlite-server", wrappers = ["betterlite", "betterlite-oracle"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
