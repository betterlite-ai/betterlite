[graph]
all-features = true
# reqwest with rustls pulls in webpki-root-certs (CDLA-Permissive-2.0) for wasm32 only, so checks cover the targets betterlite ships; add a target here before shipping a build for it
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = ["RUSTSEC-2024-0449"]

[licenses]
version = 2
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "CDLA-Permissive-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# the older version of each crate that had two in Cargo.lock when duplicates became an error (B3078 and B3450 add the last four); drop an entry once that version leaves the lock
skip = [
  "aead@0.5.2",
  "aes@0.8.4",
  "base64@0.22.1",
  "block-buffer@0.10.4",
  "cipher@0.4.4",
  "cpufeatures@0.2.17",
  "crypto-common@0.1.6",
  "digest@0.10.7",
  "fallible-iterator@0.2.0",
  "hashbrown@0.12.3",
  "hashbrown@0.16.1",
  "hmac@0.12.1",
  "http@0.2.12",
  "http-body@0.4.6",
  "inout@0.1.4",
  "miniz_oxide@0.8.9",
  "sha2@0.10.9",
  "syn@2.0.119",
  "universal-hash@0.5.1",
  "untrusted@0.7.1",
  "getrandom@0.2.17",
  "getrandom@0.3.4",
  "rand@0.9.5",
  "rand_core@0.9.5",
  "bit-vec@0.8.0",
  "synstructure@0.13.2",
  "block-padding@0.3.3",
  "cbc@0.1.2",
]
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
  { crate = "native-tls", use-instead = "rustls" },
  { crate = "sqlx", use-instead = "tokio-postgres" },
  { crate = "reqwest", wrappers = ["betterlite-http", "betterlite-oracle", "betterlite-guardrails"] },
  { crate = "betterlite-server", wrappers = ["betterlite", "betterlite-oracle"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
