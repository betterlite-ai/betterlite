query($owner: String!, $name: String!, $endCursor: String) {
  repository(owner: $owner, name: $name) {
    pullRequests(states: MERGED, first: 50, after: $endCursor) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        number
        baseRefName
        headRefName
        createdAt
        mergedAt
        additions
        deletions
        changedFiles
        commits(first: 1) {
          totalCount
          nodes {
            commit {
              authoredDate
            }
          }
        }
        timelineItems(itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT], first: 1) {
          filteredCount
          nodes {
            ... on AddedToMergeQueueEvent {
              createdAt
            }
          }
        }
      }
    }
  }
}
