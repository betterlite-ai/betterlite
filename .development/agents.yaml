worktrees: ../betterlite-worktrees
vendors:
  - id: openai
    limit_markers: ["You've hit your usage limit"]
    max_parallel: 12
  - id: anthropic
    limit_markers: ["You've hit your", "Not logged in", "Can't reach the API server"]
    max_parallel: 16
    max_writers: 12
runners:
  - id: codex-worker
    vendor: openai
    program: codex
    args: [exec, -c, 'service_tier="default"', --model, "{model}", -c, "model_reasoning_effort=\"{effort}\"", --sandbox, workspace-write, -c, sandbox_workspace_write.network_access=true, -c, sandbox_workspace_write.exclude_slash_tmp=true, -c, "web_search=\"live\"", -c, "approval_policy=\"never\"", --dangerously-bypass-hook-trust, --json, --output-schema, "{schema}", -o, "{output}", -c, "sandbox_workspace_write.writable_roots={writable_roots}", --cd, "{worktree}", "-"]
    resume: [exec, resume, -c, 'service_tier="default"', --model, "{model}", -c, "model_reasoning_effort=\"{effort}\"", -c, 'sandbox_mode="workspace-write"', -c, sandbox_workspace_write.network_access=true, -c, sandbox_workspace_write.exclude_slash_tmp=true, -c, "web_search=\"live\"", -c, "approval_policy=\"never\"", --dangerously-bypass-hook-trust, --json, --output-schema, "{schema}", -o, "{output}", -c, "sandbox_workspace_write.writable_roots={writable_roots}", "{session}", "-"]
    output: file
  - id: codex-reviewer
    vendor: openai
    program: codex
    args: [exec, -c, 'service_tier="default"', --model, "{model}", -c, "model_reasoning_effort=\"{effort}\"", --sandbox, read-only, -c, "web_search=\"live\"", -c, "approval_policy=\"never\"", --ephemeral, --output-schema, "{schema}", -o, "{output}", --cd, "{worktree}", "-"]
    output: file
  - id: claude-worker
    vendor: anthropic
    program: claude
    args: [-p, --model, "{model}", --effort, "{effort}", --append-system-prompt-file, "{instructions}", --permission-mode, acceptEdits, --settings, "{sandbox_settings}", --allowedTools, Read, Edit, Write, Glob, Grep, WebSearch, WebFetch, --disallowedTools, Agent, --output-format, json, --json-schema, "{schema_text}", --strict-mcp-config]
    resume: [-p, --resume, "{session}", --model, "{model}", --effort, "{effort}", --append-system-prompt-file, "{instructions}", --permission-mode, acceptEdits, --settings, "{sandbox_settings}", --allowedTools, Read, Edit, Write, Glob, Grep, WebSearch, WebFetch, --disallowedTools, Agent, --output-format, json, --json-schema, "{schema_text}", --strict-mcp-config]
    output: claude-json
  - id: claude-reviewer
    vendor: anthropic
    program: claude
    args: [-p, --model, "{model}", --effort, "{effort}", --append-system-prompt-file, "{instructions}", --allowedTools, "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)", Read, Glob, Grep, WebSearch, WebFetch, --disallowedTools, Edit, Write, Agent, --output-format, json, --json-schema, "{schema_text}", --no-session-persistence, --strict-mcp-config]
    output: claude-json
roles:
  worker:
    instructions: roles/worker.md
    ladder:
      - runner: codex-worker
        model: gpt-6-luna
        effort: medium
        attempts: 1
        timeout_minutes: 45
      - runner: claude-worker
        model: claude-sonnet-5-5
        effort: high
        attempts: 2
        timeout_minutes: 180
      - runner: claude-worker
        model: claude-opus-5-5
        effort: high
        attempts: 2
        timeout_minutes: 180
      - runner: codex-worker
        model: gpt-6-astra
        effort: high
        attempts: 1
        timeout_minutes: 120
  reviewer:
    instructions: roles/reviewer.md
    ladder:
      - runner: claude-reviewer
        model: claude-sonnet-5-5
        effort: high
        attempts: 1
        timeout_minutes: 30
      - runner: codex-reviewer
        model: gpt-6-astra
        effort: high
        attempts: 1
        timeout_minutes: 30
  security_reviewer:
    instructions: roles/reviewer.md
    ladder:
      - runner: claude-reviewer
        model: claude-opus-5-5
        effort: high
        attempts: 1
        timeout_minutes: 45
      - runner: codex-reviewer
        model: gpt-6-astra
        effort: xhigh
        attempts: 1
        timeout_minutes: 45
  parity_reviewer:
    instructions: roles/parity-reviewer.md
    ladder:
      - runner: claude-reviewer
        model: claude-opus-5-5
        effort: high
        attempts: 1
        timeout_minutes: 45
      - runner: codex-reviewer
        model: gpt-6-astra
        effort: xhigh
        attempts: 1
        timeout_minutes: 45
  planner:
    instructions: roles/planner.md
    ladder:
      - runner: codex-worker
        model: gpt-6-astra
        effort: xhigh
        attempts: 1
        timeout_minutes: 60
      - runner: claude-worker
        model: claude-sonnet-5-5
        effort: high
        attempts: 1
        timeout_minutes: 60
policy:
  review_by_other_vendor: true
  max_worker_attempts: 6
  limit_retry_minutes: 30
  max_parallel: 8
  overflow: true
  max_fix_turns: 2
  max_review_rounds: 3
  max_blocked_reports: 2
  max_hook_blocks: 6
  writable:
    - "{git_common_dir}"
    - "{home}/.cargo/registry"
    - "{home}/.cargo/git"
    - "{home}/.cargo/advisory-dbs"
    - "{home}/.cache/prek"
    - "{home}/.cache/uv"
