id: B3799
title: Vigil analysis retries and sanitized output
description: >-
  Build Vigil Guard analysis requests, transient retries and output construction for text/tool payloads.
  Preserve metadata clamping, sanitized-text fallback and backend failure classification.

  Implement the Vigil Guard guardrail helper functions that perform analysis, retries, metadata collection,
  block-reason construction and sanitized output building. The guardrail sends text and tool-call arguments
  to the Vigil Guard `/v1/guard/analyze` endpoint with a bearer token and metadata, retries once on transient
  failures (429, 502, 503, 504, connection timeouts), and applies the returned decision (ALLOWED, SANITIZED,
  BLOCKED) to update inputs. When sanitization is requested, replace texts and tool-call arguments with the
  returned sanitizedText or outputText, falling back to the original if neither is present. When blocked,
  build a reason from blockMessage, decisionReason, or the categories list, truncated to 500 characters.

  Collect metadata from request_data and its nested metadata/litellm_metadata dicts, pulling only from the
  allowlist: model, model_group, provider, region, deployment, user, user_id, session_id, conversation_id,
  request_id, tenant_id, org_id. Clamp string values to 500 characters, arrays to 10 items, exclude booleans,
  and add litellm_call_id when present. Preserve the order of metadata allowlist fields and the first
  non-None value found across sources.

  Build the output by comparing texts and tool-call lists before and after sanitization. If both are unchanged,
  return the input verbatim (logs as "allow"). If either changed, return only texts, images, tools and
  tool_calls, dropping structured_messages to prevent stale unsanitized payloads from reaching the model.

  Extract text and arguments from tool calls by accessing the function.arguments field (strings only).
  Update tool calls by reconstructing the function dict with the new arguments and preserving other fields.

  Define the request and response types, the metadata allowlist, value-clamping limits (500 string chars,
  10 array items, no booleans), valid-decision enum ("ALLOWED", "SANITIZED", "BLOCKED"), transient HTTP
  status codes (429, 502, 503, 504), and the /v1/guard/analyze endpoint path. Use httpx error types to
  classify transient failures: ConnectError, ConnectTimeout, ReadTimeout, RemoteProtocolError, and the
  LiteLLM Timeout exception. Preserve the 10-second default timeout with 5-second connect timeout.

