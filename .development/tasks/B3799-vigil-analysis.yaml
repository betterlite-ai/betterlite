dod:
  - text: Vigil Guard type definitions (VigilGuardGuardrailConfigModel with api_base, api_key, and ui_friendly_name) exist and deserialize from LiteLLM's field names.
    proof: [config-types-exist]
  - text: The _AsyncPostHandler protocol matches the LiteLLM handler signature and is callable with url, headers, json payload and timeout.
    proof: [handler-protocol-exists]
  - text: _analyze sends a POST to /v1/guard/analyze with bearer authorization and full mode, returning the parsed analysis dict from the response.
    proof: [analysis-oracle]
  - text: _post_with_retry retries once on transient failures (429, 502, 503, 504, connection errors, timeouts) and succeeds or raises on the second attempt.
    proof: [retry-oracle]
  - text: _is_transient correctly identifies httpx connection, timeout and status errors plus LiteLLM Timeout as transient.
    proof: [transient-oracle]
  - text: _handle_backend_failure applies fail_open/fail_closed policy and either returns output via _build_output or raises GuardrailRaisedException.
    proof: [failure-oracle]
  - text: _build_output returns the input verbatim when texts and tool_calls are unchanged, or returns only texts/images/tools/tool_calls when changed.
    proof: [output-oracle]
  - text: _tool_call_arguments extracts (index, arguments) tuples from the function.arguments field of each tool call.
    proof: [tool-extraction-oracle]
  - text: _set_tool_call_arguments reconstructs a tool call with updated function.arguments while preserving other fields.
    proof: [tool-update-oracle]
  - text: _collect_metadata gathers values from the metadata allowlist in request_data and nested dicts, using the first non-None value per field and adding litellm_call_id.
    proof: [metadata-oracle]
  - text: _clamp_metadata_value truncates strings to 500 chars, arrays to 10 items, excludes booleans and returns None for empty arrays.
    proof: [clamp-oracle]
  - text: _extract_call_id retrieves litellm_call_id from logging_obj.litellm_call_id, request_data.litellm_call_id or request_data.metadata.litellm_call_id.
    proof: [call-id-oracle]
  - text: _build_block_reason returns blockMessage or decisionReason if present, or a comma-separated categories list, truncated to 500 characters, or "Blocked by policy".
    proof: [block-reason-oracle]
  - text: _resolve_sanitized_text returns sanitizedText or outputText from the analysis, or the original text if neither is present.
    proof: [sanitize-oracle]

