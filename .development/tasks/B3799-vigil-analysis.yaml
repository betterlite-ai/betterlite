oracle_cases: []

deviations:
  - what: "Metadata allowlist field order and first non-None value precedence follow LiteLLM exactly: fields are checked in the order listed (model, model_group, provider, region, deployment, user, user_id, session_id, conversation_id, request_id, tenant_id, org_id), and the first source that provides a non-None value for each field is used."
    why: "The metadata collection behavior must preserve LiteLLM's field precedence and ordering to ensure consistent behavior across implementations."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/vigil_guard/vigil_guard.py#L418-L442"
  - what: "Metadata string values are clamped to 500 characters, array items are limited to 10, and boolean values are excluded from metadata entirely."
    why: "These limits prevent unbounded metadata from being sent to Vigil Guard and ensure compatibility with the service's payload constraints."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/vigil_guard/vigil_guard.py#L35-L37"

out_of_scope:
  - "VigilGuardGuardrail class constructor, initialization and configuration resolution (belongs to B104 guardrail framework contracts)"
  - "apply_guardrail main orchestration method that calls these helpers (depends on B104 framework orchestration)"
  - "get_config_model and get_supported_event_hooks static methods (depend on B104 guardrail base class)"
  - "Guardian base class features like guardrail_name, event_hook and logging callbacks (belong to B104)"

pitfalls:
  - "Metadata sources are checked in order: request_data itself first, then request_data.metadata, then request_data.litellm_metadata. The first non-None value per field stops the search; later sources for the same field are ignored."
  - "The _is_transient check distinguishes httpx.HTTPStatusError status codes (transient if in the set 429/502/503/504) from other httpx exceptions (all transient) and the special LiteLLMTimeout (also transient)."
  - "When texts or tool_calls are unchanged (content matches original), return the entire input dict verbatim to log as 'allow' rather than 'mask'. This requires value equality, not identity comparison."
  - "Tool call arguments are JSON strings; _set_tool_call_arguments updates the function.arguments field in the tool call dict, not the parsed arguments object. Preserve the tool_id, id and index fields."
  - "The endpoint path is /v1/guard/analyze relative to api_base (no trailing slash added). Bearer authorization uses the api_key with 'Bearer ' prefix. Content-Type is always application/json."
  - "Block reason truncation happens after selection, not before: collect all candidates first, then truncate the chosen one to 500 characters."
  - "Sanitized text fallback tries sanitizedText first, then outputText, then returns the original text. Both keys are optional in the analysis response."
  - "The default timeout is 10 seconds for the request and 5 seconds for the connection. Preserve both when timeout is None, or use the provided timeout for the request with min(timeout, 5.0) for connect."

review_level: security

budget:
