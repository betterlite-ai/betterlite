id: B1400
title: xAI OAuth token records and refresh
description: >-
  Add xai_tokens to betterlite-openai for unattended use of an existing xAI OAuth login.
  Own XAIOAuthAuthenticator.__init__, get_api_base, get_access_token, _client,
  _ensure_token_dir, _read_auth_file, _write_auth_file, _is_expired, _discover,
  _validate_xai_endpoint, _exchange_token, _build_auth_record, _refresh_tokens and
  should_use_xai_oauth, together with their token/discovery records and exception types.
  B1401 consumes these operations for interactive login. Resolve XAI_OAUTH_TOKEN_DIR
  to ~/.config/litellm/xai_oauth, XAI_OAUTH_AUTH_FILE to auth.json and OAuth base from
  XAI_OAUTH_API_BASE, XAI_API_BASE, then https://api.x.ai/v1. Preserve the default path
  spelling for existing installations. Config owns environment expansion; use_xai_oauth
  is a litellm_params flag defaulting false, whose Python truthiness is retained at the
  compatibility boundary. Introduce config test xai_oauth_settings loading each variable
  and the deployment flag through B002, including explicit values and unset defaults.

  Use an injected filesystem, clock and B173 transport. Missing, unreadable, non-object
  or malformed auth JSON acts as no login; an absent or unconvertible expires_at is expired,
  including the exact 120-second early-refresh boundary. After acquiring the owned refresh
  lock, reread the file before exchanging a token. Discovery uses the fixed auth.x.ai
  well-known URL with Accept application/json and requires both endpoints. Permit only
  HTTPS x.ai or dot-delimited subdomains, including endpoints restored from disk. Exchange
  form fields using client ID b1a00492-073a-47ea-816f-4c329264a828. Retain the old refresh
  token when omitted by renewal; missing access/refresh tokens fail. expires_in uses a
  truthy value converted to integer or 3600, and token_type defaults Bearer.

  Match directory mode 0700 and exclusive, no-follow 0600 temporary-file creation, JSON
  write, flush, fsync, replace, then chmod; chmod failures only diagnose, while write
  failures remove the temporary file and preserve their cause. Keep credentials secret
  in every record and diagnostic. Implement bounded decode_xai_oauth for auth, discovery
  and token-response bytes, and fuzz/replay all three tagged inputs. Register helper
  xai_oauth_tokens for expiry, endpoint validation and record construction; Python calls
  the pinned methods with a supplied clock, never performs network IO. Adjacent tests
  exercise actual refresh orchestration with scripted transport and temporary files,
  including two callers observing one successful refresh and failures before replacement.
  Counted 229 nonblank/noncomment lines in these methods and declarations; reserve 290
  implementation, 235 tests/config, 130 adapters and 105 parser/wiring lines, cap 800.
scope:
