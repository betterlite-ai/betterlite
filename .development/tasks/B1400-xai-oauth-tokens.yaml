    - crates/betterlite-openai/Cargo.toml
    - crates/betterlite-openai/src/{lib,error,xai_tokens}.rs
    - crates/betterlite-openai/src/xai_tokens/**
    - crates/betterlite-openai/fuzz/Cargo.toml
    - crates/betterlite-openai/fuzz/fuzz_targets/xai_oauth.rs
    - crates/betterlite-openai/fuzz/corpus/xai_oauth/**
    - crates/betterlite-config/src/{lib,config,settings,model,env,providers,tests}.rs
    - crates/betterlite-config/src/providers/xai.rs
    - crates/betterlite-config/src/providers/xai/**
    - crates/betterlite-config/src/providers/xai/oauth.rs
    - crates/betterlite-config/src/providers/xai/oauth/**
    - crates/betterlite-config/src/tests/xai_oauth.rs
    - crates/betterlite-config/src/tests/xai_oauth/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/xai_oauth*
    - tools/oracle/src/helpers/openai/xai_oauth_tokens.rs
    - tools/oracle/src/helpers/openai/xai_oauth_tokens/**
    - tools/oracle/helpers/xai_oauth_tokens.py
    - tools/oracle/helpers/xai_oauth_tokens/**
    - tools/oracle/cases/helpers/xai-oauth-tokens/**
    - tools/oracle/fuzz/corpus/helper_case/xai_oauth_tokens*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/oauth.py#L24-L75
    why: Fixed issuer/client constants, token records and named failures.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/oauth.py#L123-L152
    why: File location, base selection and lock-then-reread refresh sequence.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/oauth.py#L206-L292
    why: Durable replacement, permissive read fallback, expiry and endpoint restrictions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/oauth.py#L345-L422
    why: Form exchange, refresh-token preservation and opt-in predicate.
dod:
  - text: Refresh reads the latest on-disk token and retains the source expiry and replacement ordering.
    proof: [xai-token-tests]
  - text: Endpoint validation and token record defaults agree with the pinned OAuth helpers.
    proof: [oracle, xai-token-python, xai-token-seeds]
  - text: OAuth deployment and environment settings survive the real config loader.
    proof: [xai-token-config]
  - text: Malformed auth files and network JSON exercise the bounded production decoder.
    proof: [xai-token-corpus]
checks:
  optional: [mutants]
  commands:
    - id: xai-token-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^xai_tokens::/) - test(replays_xai_oauth_corpus)'
      why: Reread races, secret formatting and failed replacement are observable without contacting xAI.
    - id: xai-token-config
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(xai_oauth_settings)'
      why: The OAuth flag and all three OAuth environment variables must resolve through Config.
    - id: xai-token-python
      run: test -f tools/oracle/helpers/xai_oauth_tokens.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: The reference adapter must call the real token helpers with strictly typed fixtures.
    - id: xai-token-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/xai_oauth_tokens*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::openai::xai_oauth_tokens::/)'
      why: Newly added seeds must select call.xai_oauth_tokens and reject another operation tag.
    - id: xai-token-corpus
      run: test -f crates/betterlite-openai/fuzz/fuzz_targets/xai_oauth.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/xai_oauth)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_xai_oauth_corpus)'
      why: Auth-file fallback and response parse failures must share the fuzzed decoder.
oracle_cases:
  - tools/oracle/cases/helpers/xai-oauth-tokens/expiry-skew-boundary.yaml
  - tools/oracle/cases/helpers/xai-oauth-tokens/missing-and-invalid-expiry.yaml
  - tools/oracle/cases/helpers/xai-oauth-tokens/endpoint-domain-boundary.yaml
  - tools/oracle/cases/helpers/xai-oauth-tokens/refresh-fallback.yaml
  - tools/oracle/cases/helpers/xai-oauth-tokens/zero-and-invalid-lifetime.yaml
  - tools/oracle/cases/helpers/xai-oauth-tokens/missing-access-token.yaml
deviations: []
out_of_scope:
  - B1401 owns login, _CallbackHandler.do_GET/log_message, _CallbackServer, _pkce_pair, _start_callback_server, _build_authorize_url and _wait_for_callback in oauth.py.
  - B036 turns XAIOAuthError into the chat/Responses authentication envelope; CLI command registration remains B151.
pitfalls:
  - 'The oracle helper for this task is pre-registered as xai_oauth_tokens in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/xai_oauth_tokens.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/xai_oauth_tokens.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A stored token_endpoint needs the same x.ai suffix validation as a discovered endpoint.
  - expires_in equal to zero falls back to 3600 rather than producing an immediately expired record.
  - The second auth-file read happens under the refresh lock and can avoid the network exchange entirely.
budget: {max_changed_lines: 800, max_new_expects: 0}
review_level: security
