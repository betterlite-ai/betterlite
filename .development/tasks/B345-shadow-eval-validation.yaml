id: B345
title: Shadow evaluation request and access validation
description: Add the typed shadow-evaluation request model and pure validation service for B356's endpoint
  handlers. Resolve configured router arms, baseline/judge models and key/team/user targets through B051/B052/B060.
  Enforce direction-specific model scope and reject judge/candidate overlap before any work is queued.
  Keep Decimal budgets and explicit target kinds throughout, and fuzz the management request parser. This
  part creates no jobs and runs no judge calls. Use the existing Rust crate boundaries from B004 and B008;
  integrate through the server when the provider dispatcher or callbacks live in another core crate. This
  task's source slices are the linked ranges, not a port of their Python classes. Add the listed oracle
  cases and the matching adapters to B301's component runner where state is not observable over HTTP;
  adapters call production logic and never reproduce it. Use deterministic candidate sets or supplied
  random samples for comparisons, and separate seeded distribution tests for random choices. Extend the
  existing config_yaml fuzz target and committed corpus for every newly accepted config form; unsupported
  keys still fail by full path. Add a cargo-fuzz target shadow_eval_request under crates/betterlite-server/fuzz
  and a normal replays_the_shadow_eval_request_corpus test using the production parser. Keep the implementation,
  adapters and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/shadow-eval-validation/**
  - tools/oracle/src/router_probes/shadow-eval-validation/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/shadow_eval_validation.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/auto_router_endpoints.py#L329-L513
  why: Target bounds, direction and budget request validation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L970-L1173
  why: Admin roles, model scopes and judge collision checks.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(shadow_eval_validation)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-server/fuzz/fuzz_targets/shadow_eval_request.rs && test -n "$(ls -A
      crates/betterlite-server/fuzz/corpus/shadow_eval_request)" && cargo nextest run --locked -p betterlite-server
      --no-tests=fail -E 'test(replays_the_shadow_eval_request_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/shadow-eval-validation/admin-writer-required.yaml
- tools/oracle/cases/routing/shadow-eval-validation/dedupe-targets.yaml
- tools/oracle/cases/routing/shadow-eval-validation/one-to-hundred-targets.yaml
- tools/oracle/cases/routing/shadow-eval-validation/unknown-key-team-user.yaml
- tools/oracle/cases/routing/shadow-eval-validation/forward-only-model-scope.yaml
- tools/oracle/cases/routing/shadow-eval-validation/reverse-baseline-required.yaml
- tools/oracle/cases/routing/shadow-eval-validation/judge-candidate-collision.yaml
- tools/oracle/cases/routing/shadow-eval-validation/decimal-budget-validation.yaml
deviations: []
out_of_scope:
- Starting, listing or stopping jobs (B356).
- Shadow traffic duplication and judging (B118).
pitfalls:
- Equal strings in key, team and user target namespaces are different targets.
- A judge cannot also be a candidate in any sampled team's resolved pool.
- B118 owns the evaluation runtime; do not duplicate it in route validation.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
