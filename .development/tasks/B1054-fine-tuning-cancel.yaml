id: B1054
title: Fine-tuning cancellation HTTP route
description: >-
  Register POST /v1/fine_tuning/jobs/{fine_tuning_job_id:path}/cancel and
  /fine_tuning/jobs/{fine_tuning_job_id:path}/cancel in server::api::fine_tuning_cancel. Own the complete
  handler at endpoints.py:495-638. B003/B732 authenticate; B1021 checks the original managed job id;
  B004 common pre-call runs acancel_fine_tuning_job; B1019 detects encoded ids; B1141 provides ordered
  finetune_settings lookup and cancellation SDK. Supply B004's resolved-model execution seam for the
  router branch, rather than calling a later API composer. B012 owns hooks/status submission and B2400
  handle_exception_on_proxy. No route parses query custom_llm_provider despite the docstring advertising it.

  Honor the README no-paid-tier decision: remove only premium_user gating. Preserve MIT managed-id
  behavior and mark it below pending Max. Use B1100 read_raw_json_body for the body, recovering {} on any
  decode failure; parsed non-object bodies still fail when queried. There is no new decoder. 123 owned
  nonblank/non-comment lines budget 160 code, 170 tests, 160 HTTP fixtures and 45 corpus/wiring, 535 total.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/fine_tuning_cancel.rs
  - crates/betterlite-server/src/api/fine_tuning_cancel/**
  - crates/betterlite-server/fuzz/corpus/request_body/fine-tuning-cancel-*
  - tools/oracle/cases/api/fine-tuning-cancel/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/fine_tuning_endpoints/endpoints.py#L495-L638
  why: Both path-converter aliases, managed-id validation order, body-only provider selection and hook/header effects are in one handler.
dod:
- text: >-
    cancel_aliases_and_body_provider posts {custom_llm_provider:azure} for ft_a on both aliases with
    finetune_settings=[{custom_llm_provider:azure,api_base:<mock>,api_key:sk-az,api_version:2024-08-01-preview}].
    Expect one Azure POST ending /fine_tuning/jobs/ft_a/cancel and 200 returned cancelled job. Path id with
    slash is captured whole. Query ?custom_llm_provider=azure alone is ignored; with finetune_settings=[]
    request data has no provider and SDK defaults openai. Body id cannot overwrite the path id. Config
    match overlays pre-call data; its provider field, not the requested selector itself, enters SDK kwargs.
  proof: [cancel-route-tests, oracle, new-cases]
- text: >-
    cancel_body_fallback_and_config_errors sends malformed/empty JSON with configured [] and gets the
    OpenAI default path; parsed [] or null fails at .get and returns 500,internal_server_error,param=null,
    code="500". Unset finetune_settings gives the same envelope with source message="fine_tuning_config is not set, set it on your config.yaml file.".
    A selected provider missing from configured list returns null config and still calls default OpenAI.
    Native null SDK response yields 400,internal_server_error,param=null,code="400", source message
    "Invalid request, No litellm managed file id or custom_llm_provider provided.".
  proof: [cancel-route-tests, oracle, body-corpus]
- text: >-
    cancel_managed_job_validation sets require_managed_files=true and raw ft_a: 400,
    internal_server_error,param=null,code="400", source message="Raw provider fine-tuning job ids cannot be used when require_managed_files is enabled in litellm_settings. Use the LiteLLM managed fine-tuning job id returned when the fine-tuning job was created.".
    Unified id with absent ownership hook yields 500,internal_server_error,param=null,code="500",
    message="Managed resource ownership validation is unavailable.". Default false proceeds. For a detected
    unified id and no router, return 500,internal_server_error,param=null,code="500", message source
    {error:"LLM Router not initialized. Ensure models added to proxy."}. A resolved-model executor success
    adds hidden unified_finetuning_job_id but does not rewrite public response.id.
  proof: [cancel-route-tests, oracle]
- text: >-
    cancel_hooks_headers_and_errors verifies success hook runs after SDK and replaces only a non-null
    LiteLLMFineTuningJob result; other return types are ignored. Then enqueue status=success with
    litellm_call_id or "" and build B004 headers from hidden model_id/cache_key/api_base default "" and
    principal allowed_model_region default "". Failures invoke failure hook with current data, log and
    pass B2400 converter: provider 404 becomes 404,internal_server_error,param=null,code="404"; provider
    429 likewise internal_server_error,code="429". Both aliases reject missing/invalid auth before these
    hooks with 401,authentication_error,param=null,code="401". Success content type is application/json.
  proof: [cancel-route-tests, oracle]
checks:
  optional: []
  commands:
  - id: cancel-route-tests
    why: cancellation aliases bypass source validation, hooks or body-only provider selection
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_cancel::tests::/) - test(/::replays_corpus$/)'
  - id: new-cases
    why: cancel is not exercised through authenticated proxy HTTP
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/fine-tuning-cancel)"
  - id: body-corpus
    why: malformed versus non-object cancellation bodies have no decoder regression input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/request_body/fine-tuning-cancel-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/api/fine-tuning-cancel/cancel-aliases-and-body-provider.yaml
- tools/oracle/cases/api/fine-tuning-cancel/cancel-body-fallback-and-config-errors.yaml
- tools/oracle/cases/api/fine-tuning-cancel/cancel-managed-job-validation.yaml
- tools/oracle/cases/api/fine-tuning-cancel/cancel-hooks-headers-and-errors.yaml
deviations:
- what: >-
    Ordinary authenticated users can cancel jobs in betterlite. MIT LiteLLM with premium_user=false
    returns 500 internal_server_error,code="500" with its "Only premium users can use this endpoint" message.
  why: README Decisions removes enterprise license gates. Exercise parity after setting the reference premium flag only, without installing enterprise code, and keep a separate deviation case for the default.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/fine_tuning_endpoints/endpoints.py#L536-L538
- what: Managed jobs keep MIT behavior for now, including raw-id 400 and missing-ownership-hook 500 when require_managed_files=true.
  why: Max has not decided the managed-files/batches policy; this does not install its enterprise hook.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1062-L1118
out_of_scope:
- B088 owns create/retrieve/list HTTP handlers; B1141 owns config and complete cancellation SDK functions. Remove fine_tuning/main.py coverage from this route entry.
- B004 owns resolved-model execution and common headers; B1100 owns raw JSON decoding and B2400 exception mapping.
pitfalls:
- The advertised provider query parameter is never read by cancel.
- Missing provider config match falls through to the SDK's openai default, while an unset configuration raises.
- Every caught HTTPException is converted to internal_server_error, even when its status is 400.
review_level: security
budget:
  max_changed_lines: 640
  max_new_expects: 0
