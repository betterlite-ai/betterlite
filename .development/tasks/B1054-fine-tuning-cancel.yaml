id: B1054
title: Fine tuning cancel
description: >-
  Implement fine-tuning config/provider selection and cancel operation/route with B052 auth and file credential
  resolution. Bind the source finetune_settings section and default provider fields exactly; add only those config
  keys implemented here. The top-level key is finetune_settings (runtime fine_tuning_config), default None or a
  list of provider records; resolve os.environ/ values through B002.


  Implement crates/betterlite-server/src/api/fine_tuning_cancel.rs, crates/betterlite-core/src/api/fine_tuning_cancel.rs.
  Use FineTuningCancelInput and FineTuningCancelResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/fine_tuning/jobs/{fine_tuning_job_id:path}/cancel; POST /fine_tuning/jobs/{fine_tuning_job_id:path}/cancel.
  Each alias is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts
  its child factories without re-registering their methods/paths.


  Route input projections: data.litellm_call_id (absent '').


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:593 status_code=400, exception_detail=FastAPI detail string; endpoints.py:570
  status_code=500, exception_detail=FastAPI detail object. Compare the actual source status, error type, param and
  code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions cancel_route_auth, route_aliases, auth_missing, auth_invalid under
  api::fine_tuning_cancel::tests. Each named function drives production code and asserts its case result; use named
  rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-server::api::fine_tuning_cancel::decode_fine_tuning_cancel(bytes:
  &[u8], limits: &ApiLimits), for bounded HTTP JSON body; called by the production axum extractor. Place its implementation
  in crates/betterlite-server/src/api/fine_tuning_cancel.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-server/fuzz/fuzz_targets/fine_tuning_cancel.rs passes arbitrary bounded bytes to that
  exact decoder; api::fine_tuning_cancel::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/fine_tuning_endpoints/endpoints.py: cancel_fine_tuning_job (L507-L638). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 116 owned nonblank/non-comment/non-docstring Python lines (123 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 136 implementation,
  64 behavior tests, 48 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 346 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B010 (Provider framework, provider
  resolution and parameter mapping), B171 (Direct helper oracle and URL path encoding), B1020 (File credentials),
  B1087 (Api boundaries), B518 (OpenAI fine-tuning jobs), B732 (Typed authentication principals and grant resolution),
  B855 (Authenticated request admission and budget handoff), B756 (Authentication header selection and mode dispatch),
  B1021 (File upload options), B1019 (File routing ids), B1141 (Fine tuning cancel call and settings), B003 (HTTP
  server, health routes and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces
  and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
