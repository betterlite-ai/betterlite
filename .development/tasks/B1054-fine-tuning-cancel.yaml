checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::fine_tuning_cancel::/)
      - test(/::replays_corpus$/)'
  - id: case-cancel-route-auth
    why: the cancel-route-auth behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_cancel::tests::cancel_route_auth($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_cancel::tests::route_aliases($|::)/)'
  - id: case-auth-missing
    why: the auth-missing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_cancel::tests::auth_missing($|::)/)'
  - id: case-auth-invalid
    why: the auth-invalid behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_cancel::tests::auth_invalid($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/fine_tuning_cancel)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/fine_tuning_cancel.rs && grep -qF "decode_fine_tuning_cancel"
      crates/betterlite-server/fuzz/fuzz_targets/fine_tuning_cancel.rs && cargo nextest run --locked -p betterlite-server
      --no-tests=fail -E 'test(/^api::fine_tuning_cancel::tests::replays_corpus$/)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/fine-tuning-cancel)"
