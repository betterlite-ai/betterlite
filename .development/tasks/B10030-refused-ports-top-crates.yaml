references: []
dod:
- text: >-
    No test or oracle helper in these crates frees a port it then expects to be refused, and the oracle helpers'
    refused endpoints keep their guard alive while the case runs.
  proof: [no-dropped-port, oracle]
- text: The tests in every changed test module pass.
  proof: [top-tests]
checks:
  optional: []
  commands:
  - id: top-tests
    why: A test in a changed module broke.
    run: cargo nextest run --locked -p betterlite -p betterlite-cli -p betterlite-oracle-guardrails -p betterlite-server --no-tests=fail -E 'test(/^(agent_setup::tests::listing|b3767::tests|b3771::tests|b3778::tests|cache_settings_test::tests|cli::tests|commands::chat::tests|commands::keys::tests::generate_tests|commands::teams::tests|commands::tests|coord_redis_boot::tests|diagnostic_commands::tests|mcp::outbound_credentials::client_credentials::token_post::tests|mcp::outbound_credentials::token_endpoint::tests::http|middleware::redis_request_batch::tests|redis_cache_wiring::tests|spend_cache_update::tests|sso_pkce::tests|startup_input::tests)::/)'
  - id: no-dropped-port
    why: A test or helper still drops a listener soon after reading its port and then uses the freed port.
    run: '! git grep -h -B8 -E "drop\((listener|socket)\);" -- crates/betterlite crates/betterlite-cli crates/betterlite-server tools/oracle/src/helpers/guardrails | grep -F local_addr'
