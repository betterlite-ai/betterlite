deviations: []
out_of_scope:
- The lower crates; B10029 moves those.
- The code under test and the helpers' answers. Only how a refused address is made changes.
pitfalls:
- '`let _ = RefusedPort::bind()` drops the guard on the same line. Bind it to a name that lives until the request has failed, for example `let refused = RefusedPort::bind().unwrap();`.'
- In b8215.rs and b3752/endpoint.rs the guard has to outlive the function that builds the URL, so it travels in the returned value next to the URL, as Endpoint::Silent carries its listener. Map a bind error to the helper's existing OSError failure.
- If a site in scope drops a listener for another reason (it stops a server the test already used), it is not this pattern. Leave it, say so in the report, and the no-dropped-port check then needs the architect.
review_level: standard
budget:
  max_changed_lines: 150
  max_new_expects: 0
