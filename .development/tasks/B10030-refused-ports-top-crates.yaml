id: B10030
title: Server, CLI, binary and oracle helpers hold the ports they expect to be refused
description: >-
  Move the top crates and the oracle guardrail helpers onto the port guards from B10028. Tests in 8 betterlite-server
  files, 6 betterlite-cli files and 2 betterlite files, and 3 test files of the oracle guardrails helpers, get a
  "dead" address by binding 127.0.0.1:0, reading the port and dropping the listener, then expect a connection to
  it to fail. Once dropped, the port is free, and any test that binds port 0 at the same moment can get it. The
  request then reaches that test's server and takes the reply it queued. That is how
  fetches_userinfo_with_the_issued_bearer_token went red in
  https://github.com/betterlite-ai/betterlite/actions/runs/44835631936 (B10028 has the details).


  Two oracle helpers do the same outside tests. tools/oracle/src/helpers/guardrails/b8215.rs start_mock returns a
  dead URL when the case scripts no answer, and tools/oracle/src/helpers/guardrails/b3752/endpoint.rs builds
  Endpoint::Refused from a dropped listener while its Endpoint::Silent already keeps its listener. Both keep a
  betterlite_test_ports::RefusedPort alive for as long as the URL is in use, the way Silent keeps its listener; the
  oracle guardrails package lists betterlite-test-ports under [dependencies], since its helpers are not tests.


  Each test site holds a RefusedPort for as long as the request may go out and uses its address. A local helper
  that only produced the dead address goes, and its callers hold the guard; a helper that also builds something
  keeps that job and takes or returns the guard with it. Each changed crate lists betterlite-test-ports under
  [dev-dependencies].
