id: B3455
title: Vertex RAG corpus creation and multipart upload
description: >-
  Build LiteLLM's VertexAIRAGIngestion in betterlite-core as module `rag::vertex_ingestion`
  (crates/betterlite-core/src/rag/vertex_ingestion.rs). B3451 owns the shared ingestion state and the abstract
  `store` contract in `rag::ingestion`; read crates/betterlite-core/src/rag/ingestion.rs first and reuse its state
  type, its store trait and its result tuple, and do not redefine them. This task is the Vertex provider: a struct
  `VertexIngestion` that holds B3451's ingestion state plus two injected ports and implements B3451's store trait.
  The module does no HTTP and no token work itself. B3460 later builds the two ports: the token port on
  B1302's credential cache and the HTTP port on B173's pooled client.

  Ports, declared here as small async traits with typed requests. `PortError` holds the lower failure as its source
  and its message. `VertexTokenPort::access_token` takes the optional credentials (a secrecy value) and the project
  and returns the bearer token (secrecy value) plus the resolved project. It stands for `_ensure_access_token`
  with custom_llm_provider "vertex_ai". `VertexRagHttp` has three methods, each with a timeout and the bearer
  token, and each returns the status and the body bytes: `post_json(url, body_bytes, timeout)` sends header
  Content-Type application/json; `get(url, timeout)` sends only Authorization; `post_multipart(url, metadata_json,
  filename, file_bytes, file_content_type, timeout)` sends a form with a part "metadata" (no filename, content type
  application/json) and a part "file", plus header X-Goog-Upload-Protocol: multipart. All three send
  `Authorization: Bearer <token>`. A non-2xx status is not a port error: the module reads the status itself.

  Construction (vertex_ai_ingestion.py L80-L94). The vector store options are B3450's `VertexAIVectorStoreOptions`
  in betterlite-config (crates/betterlite-config/src/rag/document/ingest.rs), already merged with any stored
  credential by B3451. Resolve the project, location and credentials through B1301's getters in betterlite-vertex
  (safe_get_vertex_ai_project, get_vertex_ai_location, safe_get_vertex_ai_credentials: aliases vertex_project then
  vertex_ai_project, vertex_location then vertex_ai_location, vertex_credentials then vertex_ai_credentials, then
  settings and VERTEXAI_* env). Location falls back to "us-central1" when the getter gives nothing. Read B1301's file
  for the exact names and input type; if a getter takes a different input than the options record, build that input
  here. `supports_existing_file_id` keeps B3451's default false, and `existing_file_id` is ignored by store. The embed
  step does nothing and returns None (Vertex embeds when a file joins a corpus); expose it as a method that always
  returns None.

  Store (L109-L157), in this order. 1. No project: return `VertexIngestionError::MissingProject` with the message
  "vertex_project is required for Vertex AI RAG ingestion. Set it in vector_store config." before any port call.
  2. corpus id = options vector_store_id; empty counts as absent. When absent, create a corpus named the ingest name,
  else "litellm-rag-corpus" (empty name also falls back), with options.description. 3. When file_content is non-empty
  (empty bytes do NOT upload, unlike OpenAI's store), filename is non-empty and the corpus id is non-empty: upload and
  return the new file id. Otherwise the file id is None. 4. Return (corpus id, file id). Any error returns at once;
  a corpus created in step 2 is not removed when the upload fails.

  Base URL. Use `get_vertex_base_url(location)` from B1305 (betterlite-vertex model_urls); an invalid location is
  `VertexIngestionError::Location` carrying that error. This task adds the betterlite-vertex dependency to
  crates/betterlite-core/Cargo.toml (betterlite-vertex has no betterlite dependencies, so there is no cycle) and lets Cargo.lock follow. API version is v1beta1 everywhere.

  Create corpus (L159-L244, L246-L312). Get a token from the port, then POST
  `{base}/v1beta1/projects/{project}/locations/{location}/ragCorpora` with a 60 second timeout. Body is JSON with
  camelCase keys: `displayName` always; `description` only when non-empty; `vectorDbConfig` only when non-empty.
  When options.embedding_model is non-empty, vectorDbConfig is a copy of options.vector_db_config (the passthrough
  JSON object, empty when absent) with the key `ragEmbeddingModelConfig` set to
  `{"vertexPredictionEndpoint": {"endpoint": <embedding_model>}}`, replacing any key of that name. A status other
  than 200 or 201 is `CreateCorpus` with the message "Failed to create RAG corpus: " plus the body text. The body is
  a long-running operation. When `done` is true, the corpus id is `response.name`, or "" when missing; "" then
  behaves as an absent id in step 3, so store returns ("", None). Otherwise poll operation `name` (default ""):
  GET `{base}/v1beta1/{operation_name}`, 60 second timeout, the same token (no refresh between polls), at most 30
  attempts. Status other than exactly 200 is `Poll` with "Failed to poll operation: " plus body text. If `done`: when
  the key `error` is present (even null) fail with "Operation failed: " plus the error as compact JSON; else take
  `response.name`, and when empty fail with "No corpus name in operation response: " plus the operation as compact
  JSON; otherwise return the name. If not done, sleep 2 seconds (after every not-done attempt, including the last)
  and try again. After 30 attempts fail with "Operation timed out after 30 attempts". Use `tokio::time::sleep` so
  tests run with the paused clock.

  Upload (L314-L413). Get a token again, then POST `{base}/upload/v1beta1/{corpus id}/ragFiles:upload` with a 300
  second timeout. Metadata JSON uses snake_case keys here: `rag_file` is `{"display_name": filename}` plus
  `description` set to options.file_description when non-empty; `upload_rag_file_config` is present only when
  chunking_strategy.chunk_size or chunk_overlap is nonzero, and is
  `{"rag_file_transformation_config": {"rag_file_chunking_config": {"fixed_length_chunking": {...}}}}` holding
  `chunk_size` and `chunk_overlap` only for the nonzero ones. Unlike the import path, no 1024 default applies. The
  file part content type is the given one, else "application/octet-stream" (empty also falls back). The chunking
  strategy is B3451's state value; sizes that were never sent are absent (B5134 made them Option). A status other
  than 200 or 201 is `Upload` with "Failed to upload file: " plus the body text. On success the file id is
  `ragFile.name`, else top-level `name`, else "". If the body is not a JSON object, or `ragFile` is present but not an
  object, log a warning and return the literal "uploaded" instead of failing.

  Logging stays as in Python: debug lines for the request URL and body ("Creating RAG corpus", "Request body",
  "Create corpus response", "Polling operation", "Operation not done yet, attempt N/30", "Created RAG corpus",
  "Uploading file to RAG corpus", "Metadata", "Upload complete. File ID"), error lines for the three failed-status
  messages, and the warning "Could not parse upload response". The token never appears in a log line or Debug text.

  Oracle helper. Add helper cases that replay `VertexAIRAGIngestion.store` against scripted HTTP. Python side:
  construct the class from the case's options, patch `get_async_httpx_client` in the ingestion module with a fake
  client whose post and get record url, json or files, headers and timeout and return the scripted status and body,
  patch `_ensure_access_token` to return a fixed token and project, and patch `asyncio.sleep` to record its delay.
  Rust side: the same script drives scripted ports. Both sides project the ordered requests (method, url, JSON body
  or the multipart metadata plus file part filename, size and content type, header names, timeout, sleeps) plus the
  returned tuple or the error message. The token appears as present only. The skeleton creates the helper operation
  named after this task id; the worker writes the adapter files and the case files listed in scope.

  Native tests live in `rag::vertex_ingestion::tests` and use scripted ports with `#[tokio::test(start_paused =
  true)]` for polling. The Python file has 492 lines. The owned code (init, embed, store, _create_rag_corpus,
  _poll_operation, _upload_file_to_corpus) is about 215 nonblank, non-comment lines. Allow 270 implementation, 260
  tests, 130 adapters and 80 case and corpus lines.

scope:
  paths:
    - crates/betterlite-core/src/rag/vertex_ingestion.rs
    - crates/betterlite-core/src/rag/vertex_ingestion/**
    - crates/betterlite-core/Cargo.toml
    - Cargo.lock
    - tools/oracle/cases/helpers/vertex-rag-store/**
    - "tools/oracle/fuzz/corpus/helper_case/vertex_rag_store-*"
    - tools/oracle/helpers/b3455.py
    - tools/oracle/helpers/b3455/**
    - tools/oracle/src/helpers/core_ops/b3455.rs
    - tools/oracle/src/helpers/core_ops/b3455/**
  lint_tables: false

