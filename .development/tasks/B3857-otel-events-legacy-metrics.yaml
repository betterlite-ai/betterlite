  optional: []
  commands:
    - id: metric-recording-tests
      why: Legacy metric recording behavior tests fail, do not exist, or assertions were not accepted
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_metrics::/)'
    - id: inference-details-events-tests
      why: Inference-details event tests fail, do not exist, or assertions were not accepted
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^inference_details::/)' && grep -q 'fn _emit_inference_details_event\|fn _build_inference_details_attrs' crates/betterlite-logging/src/otel/legacy_metrics.rs
    - id: legacy-events-tests
      why: Legacy per-message/per-choice content event tests fail, do not exist, or assertions were not accepted
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^legacy_content_events::/)' && grep -q 'gen_ai.content.prompt\|gen_ai.content.completion' crates/betterlite-logging/src/otel/legacy_metrics.rs
    - id: request-io-tests
      why: Request/response/stream content projection tests fail, do not exist, or assertions were not accepted
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^request_io::/)' && grep -q 'fn request_input\|fn response_output\|fn stream_output' crates/betterlite-logging/src/otel/content_projections.rs
    - id: helper-python
      why: The independently invoked MIT helper semantics must match the production functions
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3857::/)'
    - id: helper-case-corpus
      why: Oracle helper cases and corpus must replay with the new metric recording and content projection decoders
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/metric-recording/ "tools/oracle/fuzz/corpus/helper_case/metric-recording-*")" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
