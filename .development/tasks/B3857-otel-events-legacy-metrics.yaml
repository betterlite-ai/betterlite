id: B3857
title: OTel content events and legacy metric recording
description: >-
  Record legacy GenAI histograms and inference-detail events with the configured metric-attribute filter. Supply the request/response/stream content projections used when Langfuse captures root-span input and output.

  Implement metric recording for operation duration, token usage, cost and streaming latency (TTFT, TPOT, response duration) with the metric-attribute filter: include/exclude lists read from config.attributes or callback_settings.otel.attributes, validated against VALID_METRIC_ATTRIBUTE_NAMES. Never include gen_ai.token.type (the structural token-usage discriminator). Filter resolution is lazy, reading callback_settings only when config.attributes is None and callback_name is None/"otel". Unbilled calls (per is_unbilled_non_inference_call_from_params) skip token-usage and TPOT recording, a user-visible metric drop that preserves spend accuracy. Time-to-first-token measures streaming requests (api_call_start_time to completion_start_time). Time-per-output-token divides generation time by completion_tokens (completion_start_time to end_time for streaming, api_call_start_time to end_time for non-streaming). Response duration measures api_call_start_time to end_time (pure LLM API latency). Timestamp converters handle datetime, float/int seconds, and ISO strings; missing times fall back to now() or duration_s as applicable.

  Emit both semantic log events depending on semconv opt-in state. When OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental is active (the opt-in path, lines 1906-1914), emit a single consolidated gen_ai.client.inference.operation.details event with operation name, provider, and input/output messages (when _capture_in_event() is true). When the opt-in is false (the default path, lines 1916-1975), emit legacy per-message gen_ai.content.prompt and per-choice gen_ai.content.completion events with role/id/finish_reason attributes and content inclusion gated on _capture_in_event(). Both paths serialize messages/choices to JSON and bind to the inference span via parent context. Log events use OTel SDK's LogRecord type (location varies across SDK versions: opentelemetry.sdk._logs before 1.39.0, opentelemetry.sdk._logs._internal after 1.39.0).

  Supply four content projection functions for Langfuse root-span input/output: request_input (user/system messages as JSON turns), response_output (ModelResponse/ResponsesAPIResponse/Anthropic message choices), stream_output (relayed stream chunks, below), and helpers _system_turns/_user_turns. B8250's Langfuse root stamp is their only caller.

  stream_output assembles a finished stream through a port, because the two assemblers it needs sit in crates that depend on betterlite-logging: B3669 builds assemble_anthropic_sse_stream in betterlite-server and B2227 builds stream_chunk_builder in betterlite-streaming, so this crate can call neither. Declare in content_projections `pub trait StreamOutputAssembler: Send + Sync` with `assemble_sse(&self, frames: &[Vec<u8>]) -> Option<OtelModelValue>` and `assemble_chat(&self, chunks: &[OtelModelValue], messages: Option<&[OtelModelValue]>) -> Option<OtelModelValue>`; each returns the assembled chat ModelResponse as a JSON object, or None when assembly fails. OtelModelValue is otel::model::utils::coercion's value type. Also declare `pub enum RelayedChunk` with Raw(Vec<u8>) for an unparsed SSE frame (a text frame as its UTF-8 bytes), Chat(OtelModelValue) for a ModelResponseStream chunk, Completed(OtelModelValue) for a ResponseCompletedEvent holding its response, and Other(OtelModelValue) for any other typed chunk. The signature is `stream_output(chunks: &[RelayedChunk], data, assembler: &dyn StreamOutputAssembler) -> Option<String>`, where data is the same request data request_input reads. It follows request_io.py L69-L90: no chunks give None. One Raw chunk anywhere makes the stream raw (LiteLLM's is_raw_sse_stream), and then only the Raw frames, in arrival order, go to assemble_sse. When every chunk is Chat, the chunk values and the request's messages (None when absent or null) go to assemble_chat. Otherwise the response of the last Completed chunk is used. A ModelResponse from either port method is projected the way response_output projects a ModelResponse, a completed response the way it projects a ResponsesAPIResponse, and a None from the port or a stream without a Completed chunk gives None. B110 builds the production assembler over B3669 and B2227 and B8250 passes it in, so this task names nothing either of them builds in production code.

  Tests in a stream_output module use a fake assembler that records the frames, chunks and messages it was given and returns a fixed ModelResponse or None: raw frames mixed with Chat and Completed chunks reach assemble_sse alone and in order, assemble_chat is never called for a raw stream, absent and null messages both reach assemble_chat as None, the last of two Completed chunks wins, and an empty slice or a None from the port gives None. The oracle helper implements the port for its cases: assemble_chat calls B2227's stream_chunk_builder with the chunks and messages, mapped through serde, and returns None on its error. The helper's stream_output input accepts typed chunks only (chat, completed, other), never raw frames, so its assemble_sse returns None and no raw-frame case runs here; B110's native boot test covers the Anthropic SSE path with the production assembler.
