dod:
  - text: Metric metadata keys METRIC_METADATA_KEYS and VALID_METRIC_ATTRIBUTE_NAMES (gen_ai.operation.name, provider.name, system, request.model, framework, hidden_params plus metadata.<key> variants) are defined.
    proof: [metric-recording-tests]
  - text: OTELMetricAttributeFilter dataclass with include_list/exclude_list is defined; _build_metric_attribute_filter accepts Filter/dict/invalid and returns Filter; _resolve_metric_attribute_filter returns (include, exclude) tuples.
    proof: [metric-recording-tests]
  - text: _ensure_metric_attribute_filter resolves config.attributes once per handler, with fallback to proxy callback_settings.otel.attributes when callback_name is None/"otel" and attributes is None; caches result.
    proof: [metric-recording-tests]
  - text: _filter_metric_attributes calls _metric_attribute_allowed for each key; unknown names are silently dropped, not errored (source behavior).
    proof: [metric-recording-tests]
  - text: _record_metrics records operation_duration_histogram (common_attrs from operation/provider/model/framework and filtered metadata), token_usage_histogram (input/output type attributes per usage if response_obj and not unbilled), cost_histogram (if cost present).
    proof: [metric-recording-tests]
  - text: _record_metrics calls record_ttft_metric, record_tpot_metric, record_api_latency_metric with common_attrs and skips token-usage and TPOT recording when is_unbilled_non_inference_call_from_params returns true.
    proof: [metric-recording-tests]
  - text: record_ttft_metric (was _record_time_to_first_token_metric, renamed for 30-char limit) records streaming requests only (stream==true) from api_call_start_time to completion_start_time; skips on missing/unparseable times.
    proof: [metric-recording-tests]
  - text: record_tpot_metric (was _record_time_per_output_token_metric, renamed for 30-char limit) divides generation time (completion_start_time to end_time for streaming, api_call_start_time to end_time for non-streaming) by completion_tokens; skips if unbilled.
    proof: [metric-recording-tests]
  - text: record_api_latency_metric (was _record_response_duration_metric, renamed for 30-char limit) records api_call_start_time to end_time; returns early if api_call_start_time is missing.
    proof: [metric-recording-tests]
  - text: _to_timestamp static method converts datetime.timestamp(), int/float to float, parses ISO strings with or without microseconds; returns None on parse failure.
    proof: [metric-recording-tests]
  - text: _otel_log_types() imports SeverityNumber and resolves LogRecord from opentelemetry.sdk._logs (OTEL < 1.39.0) or opentelemetry.sdk._logs._internal (OTEL >= 1.39.0).
    proof: [metric-recording-tests]
  - text: _emit_semantic_logs emits the consolidated inference-details event when _gen_ai_semconv_latest_experimental is true; returns early if enable_events is false.
    proof: [inference-details-events-tests]
  - text: _emit_inference_details_event emits a single gen_ai.client.inference.operation.details event with serialized input/output messages only when _capture_in_event() is true, bound to the inference span.
    proof: [inference-details-events-tests]
  - text: The default (non-opt-in) _emit_semantic_logs path emits per-message gen_ai.content.prompt events (one per message, role/id/finish_reason attributes, content gated on _capture_in_event()) and per-choice gen_ai.content.completion events (index/finish_reason, content gated on _capture_in_event()).
    proof: [legacy-events-tests]
  - text: request_input normalizes system/instructions keys plus messages/input field into a list of (role, content) turns and returns JSON-serialized or None.
    proof: [request-io-tests]
  - text: response_output handles ModelResponse (tuple of choice.message), ResponsesAPIResponse (.output field), and Anthropic messages (validates _AnthropicMessage schema) and returns JSON-serialized or None.
    proof: [request-io-tests]
  - text: stream_output dispatches chunks via is_raw_sse_stream (Anthropic SSE, calls assemble_anthropic_sse_stream) or all-ModelResponseStream (calls stream_chunk_builder on messages) or ResponseCompletedEvent (last chunk's .response); returns response_output() or None on failure.
    proof: [request-io-tests]
