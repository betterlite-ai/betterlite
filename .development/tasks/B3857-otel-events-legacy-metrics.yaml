deviations:
  - what: Timestamp parsing handles datetime, float/int seconds, and ISO strings with microsecond fallback; differs from some Python datetime libraries that require strict format.
    why: Multiple time formats appear in LiteLLM payloads (datetime objects from inference, float seconds from metrics, ISO strings from external sources); unified parsing reduces error handling at call sites.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L1711-L1729
  - what: OTEL LogRecord import location varies by SDK version (opentelemetry.sdk._logs before 1.39.0, opentelemetry.sdk._logs._internal after 1.39.0); _otel_log_types() bridges the difference at runtime.
    why: The LogRecord class moved as part of SDK reorganization; runtime discovery allows the integration to work with both versions without bumping the minimum OTEL SDK.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L1865-L1881
out_of_scope:
  - Metric filter configuration loading and environment resolution (B002)
  - Histogram/meter creation and provider initialization (B3868)
  - Inference span/parent context acquisition (B3847)
  - safe_set_attribute and primitive-type casting (B3844)
  - is_unbilled_non_inference_call_from_params (B188)
  - safe_dumps JSON serialization (B192)
  - stream_chunk_builder (B2227); stream_output reaches it only through StreamOutputAssembler.assemble_chat, and the oracle helper's port calls it
  - Anthropic SSE detection and assembly (B3669 owns is_raw_sse_stream and assemble_anthropic_sse_stream in betterlite-server); stream_output reaches assembly only through StreamOutputAssembler.assemble_sse
  - The production StreamOutputAssembler over B3669 and B2227 (B110), and handing it to stream_output (B8250)
  - Message and choice transforms (B3845); legacy attribute dispatch (B3856)
  - _capture_in_event predicate (B3854)
  - drop_none and json_or_none serialization helpers (B3845)
pitfalls:
  - "Function names record_ttft_metric (18 chars), record_tpot_metric (18 chars), record_api_latency_metric (24 chars) must stay under 30 characters per rules; the originals _record_time_to_first_token_metric (34) and _record_time_per_output_token_metric (36) were too long."
  - "Unbilled calls skip token-usage and TPOT recording (is_unbilled_non_inference_call_from_params returns true); the missing metrics are user-visible and intentional (preserve spend accuracy), not a data loss bug."
  - "Streaming requests measure TTFT from api_call_start_time to completion_start_time (first token arrival); non-streaming requests return early and do not record TTFT (no first-token boundary)."
  - "Time-per-output-token uses completion_start_time for streaming (time after first token) but api_call_start_time for non-streaming (total time); both divide by completion_tokens."
  - "Response duration (api_call_start_time to end_time) is the only metric that spans both streaming and non-streaming paths; TTFT is streaming-only."
  - "LogRecord timestamp must be in nanoseconds (_to_ns); SeverityNumber.INFO is the standard level for semantic log events."
  - "The _emit_semantic_logs method has two branches: semconv opt-in (lines 1906-1914 calls _emit_inference_details_event, one consolidated event) and default (lines 1916-1975, per-message/per-choice legacy events). The default branch runs by default since OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental is false unless explicitly set."
  - "Inference-details event name is a single constant _INFERENCE_DETAILS_EVENT_NAME, not a per-message/per-choice template; both branches use one event name and emit once per request."
  - "Per-message prompt events carry role (from message['role'], default 'user') and conditionally id (from message['id'] if role=='tool'); per-choice completion events carry index (choice index), finish_reason, and role (from message.role, default 'assistant')."
  - "Content capture (_capture_in_event()) gates both the attrs['gen_ai.prompt'/'message.content'] attribute and the body copy; drop_none removes null/None attributes before emit."
  - "is_raw_sse_stream is any(), not all(): one str or bytes frame among typed chunks makes the whole stream raw, and _joined_sse_stream then drops the typed chunks, so assemble_sse gets only the Raw frames and assemble_chat is never tried."
  - "_completed_response walks reversed(chunks), so the last ResponseCompletedEvent wins when a stream carries two, and a Responses stream without response.completed renders nothing."
  - "Both port methods return a ModelResponse, so their result goes through response_output's ModelResponse branch (each choice's message without null fields), never the Anthropic-message fallback that type: message gates."
review_level: standard
