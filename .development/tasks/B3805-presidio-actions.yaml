oracle_cases: []

deviations:
  - what: validate_environment raises an error if either PRESIDIO_ANALYZER_API_BASE or PRESIDIO_ANONYMIZER_API_BASE is missing; it does not fall back to a default service.
    why: LiteLLM requires both URLs to be explicitly configured. betterlite preserves this fail-closed behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L282-L294

out_of_scope:
  - "async_pre_call_hook, logging_hook, async_logging_hook, async_post_call_success_hook and streaming hooks: owned by lifecycle tasks."
  - "_is_anthropic_message_response, _process_anthropic_response_for_pii, _process_response_for_pii, _mask_output_response: owned by B3806 (response transformations)."
  - "_mask_buffered_model_response_stream, _stream_apply_output_masking, _stream_pii_unmasking, async_post_call_streaming_iterator_hook: owned by B3807 (streamed masking)."
  - "apply_guardrail, update_in_memory_litellm_params: owned by lifecycle/application tasks."
  - "get_supported_event_hooks, __init__: owned by lifecycle tasks."
  - "Example Presidio fixture (example_presidio_ad_hoc_recognizer.json): owned by the lifecycle task that loads ad-hoc recognizers."

pitfalls:
  - "Numbered tokens must be applied in reverse text order (from end to beginning) to prevent earlier replacements from shifting the offsets of later detections."
  - "The pii_tokens dict is stored in request_data.metadata.pii_tokens, which must be created if it does not exist; a missing metadata dict also needs initialization."
  - "Truncated token fallback only checks the end of the text; a token prefix at the beginning is never considered a valid match."
  - "The minimum overlap for truncation matching is min(20, len(token) // 2); this prevents false matches when tokens share common prefixes."
  - "An empty analyze_results list (no detections) returns the original text without calling the anonymizer."
  - "Blocked entity exceptions are raised before calling the anonymizer; the anonymizer is never called for blocked content."
  - "A missing pii_entities_config means no entities are blocked, even if analyze_results contains matches."

review_level: standard

budget:
  max_changed_lines: 1000
  max_new_expects: 0
