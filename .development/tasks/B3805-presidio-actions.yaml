dod:
  - text: validate_environment resolves PRESIDIO_ANALYZER_API_BASE and PRESIDIO_ANONYMIZER_API_BASE from environment or passed arguments, appending trailing slashes and defaulting to http:// for schemeless URLs, raising an error if either URL is missing.
    proof: [validate-environment]
  - text: _post_presidio_anonymize POSTs the anonymizer request with text and analyzer_results, validates HTTP status < 400 and content-type is application/json, and returns the parsed response body or raises on error.
    proof: [post-anonymize]
  - text: _finalize_presidio_anonymize_simple returns the anonymizer's output text directly, counting anonymized entities per type.
    proof: [finalize-simple]
  - text: _finalize_presidio_anonymize_numbered_tokens builds numbered placeholders (PERSON_1, EMAIL_2, etc.), stores original text in request_data.metadata.pii_tokens, applies replacements in reverse text order to preserve offsets, and counts anonymized entities.
    proof: [finalize-numbered]
  - text: anonymize_text calls _post_presidio_anonymize and delegates to the appropriate _finalize_* function based on output_parse_pii, returns the original text if analyze_results is empty, and sanitizes exceptions.
    proof: [anonymize-text]
  - text: raise_exception_if_blocked_entities_detected raises BlockedPiiEntityError if pii_entities_config is set and any detected entity type has action BLOCK.
    proof: [raise-blocked]
  - text: check_pii calls analyze_text, filters results by score and deny list, checks for blocked entities, calls anonymize_text, and updates guardrail logging information with entity counts and status.
    proof: [check-pii-orchestration]
  - text: check_pii returns the anonymized text and preserves mock_redacted_text override behavior when set.
    proof: [check-pii-mock]
  - text: _unmask_pii_text replaces numbered tokens with their original values and handles tokens truncated by max_tokens using a fallback minimum overlap of min(20, len(token) // 2).
    proof: [unmask-tokens]
  - text: _unmask_pii_text only checks for truncated tokens at the end of the text.
    proof: [unmask-truncation]
  - text: get_presidio_settings_from_request_data extracts PresidioPerRequestConfig from request_data.metadata.guardrail_config, returning None if metadata or guardrail_config is missing.
    proof: [get-presidio-settings]

