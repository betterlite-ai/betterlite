id: B3805
title: Presidio entity actions and reversible tokens
description: >-
  Implement Presidio anonymizer integration with entity action detection, anonymized
  text finalization, and reversible numbered token replacements. Build analyzer-result
  filtering and block exception raising; orchestrate PII detection, blocking, and
  masking with per-request settings. Preserve request-local token maps for unmasking,
  calling the anonymizer before replacing results with sequentially numbered placeholders,
  and truncated-token fallback matching.

  Key behavior: validate_environment resolves PRESIDIO_ANALYZER_API_BASE and
  PRESIDIO_ANONYMIZER_API_BASE environment variables, appending trailing slashes
  and defaulting to http:// for schemeless URLs. _post_presidio_anonymize POSTs
  analysis results to the anonymizer endpoint with timeout handling. anonymize_text
  calls the anonymizer once and returns either the original anonymized text or
  reconstructed text with numbered placeholders (PERSON_1, EMAIL_2, etc.) stored
  in request_data.metadata.pii_tokens; tokens are applied in reverse text order
  to prevent offset shifting. check_pii orchestrates the full flow: analyze text,
  filter by score and deny list, raise GuardrailRaisedException if blocked entities
  are detected, anonymize the text, and return either simple or numbered results.
  _unmask_pii_text replaces numbered tokens and handles truncation fallback (minimum
  20-character overlap or half the token length, whichever is smaller).
  get_presidio_settings_from_request_data extracts per-request config from
  request_data.metadata.guardrail_config.

scope:
