    why: _finalize_presidio_anonymize_numbered_tokens builds numbered placeholders, stores original text in pii_tokens, applies replacements in reverse order
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L839-L873
