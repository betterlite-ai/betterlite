id: B862
title: Membership budget merge-patch persistence
description: >-
  Implement the distinct membership patch, member creation and general-entity budget helpers. The
  patch mapper reads exclude_unset and maps max_budget_in_team to max_budget, plus tpm_limit, rpm_limit,
  budget_duration, allowed_models, temp_budget_increase and temp_budget_expiry unchanged. Explicit
  null is retained, absent fields omitted, top-level tuples become lists without recursive conversion.
  Meaningful limit fields are max_budget, soft_budget, max_parallel_requests, tpm_limit, rpm_limit,
  model_max_budget, budget_duration, allowed_models, temp_budget_increase and temp_budget_expiry.
  Only None and an empty LIST are unset: zero, false, '', {}, and a tuple are meaningful at this helper.

  _upsert_budget_and_membership uses the caller's existing tx and never starts/commits its own. Empty
  patch does nothing. A sent budget_duration computes B2317 reset time, or clears reset_at for null,
  before DB access. existing_budget_id is shared only when non-null and equal to team default or in
  supplied shared_budget_ids. temp_only means the resulting write-data keys are a subset of the two
  temp fields; a duration adds reset_at and is never temp-only. For a private existing budget read the
  row (missing becomes {}), merge the patch, disconnect membership if no meaningful limits remain,
  otherwise update that budget with updated_by=caller.user_id or ''. A missing row with meaningful
  values attempts UPDATE and propagates its failure; it is not silently created. Disconnect neither
  deletes nor changes the old budget row.

  For a shared/default row or no existing budget, read the source ONLY when shared and not temp-only.
  Create data has audit actors caller.user_id or '', copies only set meaningful-limit fields, then
  applies patch. Carry source budget_reset_at when duration was not sent; do not restart an inherited
  window on unrelated edits. Omit a null reset_at from CREATE. With no meaningful limit, disconnect
  only for an existing id and non-temp-only patch; otherwise return without writes. With a limit,
  CREATE budget including team_membership, then UPSERT membership on (user_id,team_id), connecting the
  new budget in both create and update arms. A tx failure rolls back only under the caller's transaction;
  never mutate the shared row or promise a new transaction around unrelated callers.

  Member creation resolves an optional BudgetWriteTx, otherwise B725 BudgetRepository. Move the
  two-line _budget_table (management_helpers/utils.py L116-L117) and its minimal _PrismaBudgetRecord/
  _PrismaBudgetTable contract (L58-L71) here, below B1227 add_new_member; no reverse dependency on
  B1227. B1227's larger MemberWriteTx structurally supplies this budget port. Explicit limit means
  max_budget_in_team IS NOT NONE OR allowed_models IS NOT NONE, so zero and [] create private rows.
  Without explicit limits, a non-null default id and no duration reads it and returns it only if found.
  With a duration and default id, clone that default or return None if missing. No default/limits/
  duration returns None; otherwise CREATE with the provided non-null limit fields and, for a non-null
  duration, a newly computed reset_at. Audit names here use caller.user_id OR litellm_proxy_admin_name.

  Clone only max_budget, soft_budget, max_parallel_requests, tpm_limit, rpm_limit, model_max_budget,
  budget_duration and allowed_models, skipping None and empty lists (not {} or zero). A non-null
  duration override replaces the inherited one. Compute reset_at only for a truthy resulting duration,
  starting at clone time; never carry the default's reset timestamp in this creation helper. It differs
  deliberately from clone-on-update above. Read then create through the same supplied tx connection.

  handle_budget_for_entity extracts all B720 BudgetTable fields from model_dump(exclude_none=True)
  or the supplied mapping; budget_duration_cleared defaults False and reinserts duration=null only
  with an existing id. With no existing id, explicit data.budget_id wins without lookup, else nonempty
  budget data is validated as BudgetTable, serialized by B124 jsonify_object, and CREATED directly
  through B725 with caller/admin audit actors. This path does not call /budget/new's guards. Empty
  data returns None. With an existing id, nonempty budget fields first call B829 update_budget on the
  OLD id, then return a different explicit data.budget_id if present, else keep the old id. A caller's
  later relink can fail after that budget update; this helper has no transaction or link write. Preserve
  model-vs-mapping null handling and validation errors, not a fictitious atomic replace-budget action.


  Build the production member_budget_patch module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/common_utils.py:
  _prisma_value (L488-L489; 2 source lines), member_budget_patch (L492-L501; 10 source lines), _is_set_budget_value
  (L504-L509; 6 source lines), _has_meaningful_budget_limit (L512-L515; 4 source lines), _upsert_budget_and_membership
  (L518-L636; 106 source lines). litellm/proxy/management_helpers/utils.py: handle_budget_for_entity (L180-L264;
  62 source lines), _clone_team_default_budget_for_member (L283-L333; 41 source lines), _resolve_member_budget_id
  (L336-L390; 50 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Register only member_budget_patch, _prisma_value and meaningful-limit predicates as pure B856
  Management::models operations. Persistence uses native Postgres tests with POSTGRES_TEST_URL, else
  B860 testcontainers. Execute source SQL effects against independently seeded rows and inject faults
  between CREATE/UPSERT and budget-update/relink. Named transaction_reused proves no extra connection
  checkout when a caller holds locks. Route owners test B829's HTTP mapping; no helper calls a route.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  The original eight functions contain 226 nonblank noncomment lines excluding docstrings; the lowered
  helper adds two lines plus its small port declarations. Allow 260 production, 370 tests, 70 adapters
  and 35 wiring lines, 735 within 800. Typed inputs use B859 decoding; this adds no parser.
