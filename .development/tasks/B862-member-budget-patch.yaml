pitfalls:
  - 'The oracle helper for this task is pre-registered as member_budget_patch in the server group. Replace the stub Op in tools/oracle/src/helpers/server/member_budget_patch.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/member_budget_patch.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Clone-on-update carries an unchanged reset window; clone-on-member-creation starts a fresh one.
  - allowed_models=[] is an explicit creation limit but not a meaningful remaining limit during patching.
  - General-entity relinking updates the old budget before returning the new id.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
