dod:
  - text: 'Postgres cases empty_patch_no_reads, duration_reset_before_read, private_update_actor,
      missing_private_update_fails, disconnect_keeps_budget, shared_row_never_updated,
      shared_id_set_clone, temp_only_skips_source, temp_clear_keeps_shared_link,
      patch_carries_reset_window, duration_clear_omits_create_reset, create_then_membership_upsert,
      transaction_reused, create_then_upsert_failure_rolls_back, explicit_empty_models_creates,
      missing_default_returns_none, clone_restarts_window, clone_skips_empty_lists,
      explicit_entity_budget_wins, entity_direct_create_skips_route_guards,
      entity_update_old_before_relink and duration_cleared_only_for_existing prove the write contract.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Implement the owned behavior and ordered failure effects; named tests: absent_keeps, null_clears,
      shared_default_clone, temporary_only_inherits, carried_window, no_limits_disconnect, postgres_pinned_rows,
      postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^member_budget_patch::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/member_budget_patch.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/member-budget-patch-*")"
        && grep -rlq "member_budget_patch" tools/oracle/fuzz/corpus/helper_case/member-budget-patch-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/member_budget_patch::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/member_budget_patch::tests::postgres_failure_effects$/)'
