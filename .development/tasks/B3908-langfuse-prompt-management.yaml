id: B3908
title: Langfuse prompt management and completion callbacks
description: >-
  Implement Langfuse prompt management and success/failure callback wrappers in crates/betterlite-logging,
  composing lower-level services to handle prompt selection, compilation, optional-parameter projection, and
  logged event dispatching. Preserve cached REST-client initialization distinct from the shared export channel
  and per-request logger selection. Retain LRU cache sizing (10 items) on the REST client factory to prevent
  duplicate initialization overhead. Implement success and failure logging callbacks that wrap async dispatch
  through injected logger selection, sanitize optional parameters and completion callback, and cache returned
  trace IDs for service correlation. Warn at startup if Langfuse is configured both globally and per-request.
  When prompt management is requested without a prompt_id, skip it; when a fetch fails, do not block the request
  (return the original messages, model and params). Log callback failures and handle the async bridge from sync
  context through the provided run_async_function utility.

scope:
  paths:
    - Cargo.toml
    - crates/betterlite-logging/src/langfuse_prompt_management.rs
    - crates/betterlite-logging/src/langfuse_prompt_management/**
  lint_tables: false

references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_prompt_management.py#L50-L110
    why: "langfuse_client_init factory with LRU caching and _remember_trace_id cache storage"
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_prompt_management.py#L114-L190
    why: "LangfusePromptManagement.__init__, integration_name, _get_prompt_from_id, _compile_prompt, _get_optional_params_from_langfuse"
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_prompt_management.py#L192-L305
    why: "async_get_chat_completion_prompt, should_run_prompt_management, _compile_prompt_helper, async_compile_prompt_helper"
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_prompt_management.py#L307-L364
    why: "log_success_event, log_failure_event, async_log_success_event, async_log_failure_event with callback wrapping"

dod:
  - text: "langfuse_client_init initializes a REST client through build_langfuse_client with LRU cache of size 10, checking Langfuse version and TTL validity before creation, returning the same client for identical credential+host combinations."
    proof: [client-init-tests]
  - text: "_remember_trace_id extracts the trace_id from logged events and stores it in the trace ID cache when the litellm_call_id is a string."
    proof: [trace-id-caching-tests]
  - text: "LangfusePromptManagement inherits from LangFuseLogger, PromptManagementBase and CustomLogger, acquiring both REST client and tracing channel at initialization."
    proof: [initialization-tests]
  - text: "integration_name returns 'langfuse'."
    proof: [integration-name-tests]
  - text: "_get_prompt_from_id calls langfuse_client.get_prompt with optional label and version parameters."
    proof: [prompt-fetch-tests]
  - text: "_compile_prompt transforms a prompt client's compiled output (string or list) into a list of AllMessageValues, converting strings to system messages."
    proof: [prompt-compilation-tests]
  - text: "_get_optional_params_from_langfuse extracts the config dict from a prompt client, filtering out the 'model' key."
    proof: [optional-params-tests]
  - text: "async_get_chat_completion_prompt delegates to get_chat_completion_prompt from the PromptManagementBase contract."
    proof: [sync-async-delegation-tests]
  - text: "should_run_prompt_management returns false if prompt_id is None, else fetches the prompt to validate it exists and returns true, swallowing fetch exceptions."
    proof: [prompt-validation-tests]
  - text: "_compile_prompt_helper retrieves the prompt from a dynamic-credential client, compiles it with variables, extracts optional params and model, and returns a PromptManagementClient struct."
    proof: [compilation-helper-tests]
  - text: "async_compile_prompt_helper delegates to _compile_prompt_helper."
    proof: [async-compilation-tests]
  - text: "log_success_event calls run_async_function to bridge to async_log_success_event with all arguments."
    proof: [success-event-tests]
  - text: "log_failure_event calls run_async_function to bridge to async_log_failure_event with all arguments."
    proof: [failure-event-tests]
  - text: "async_log_success_event selects a logger through get_langfuse_logger_for_request, calls log_event_on_langfuse, stores the returned trace ID through _remember_trace_id, and catches exceptions with verbose_logger and handle_callback_failure."
    proof: [success-logging-tests]
  - text: "async_log_failure_event selects a logger, extracts status message from standard_logging_object or exception, calls log_event_on_langfuse with level='ERROR', stores the trace ID, and handles exceptions like success."
    proof: [failure-logging-tests]
  - text: "Dynamic credential clients are initialized with allow_env_credentials=false when langfuse_host is supplied in dynamic_callback_params, else allow_env_credentials=true."
    proof: [dynamic-credentials-tests]

