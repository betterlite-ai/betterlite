oracle_cases: []

deviations:
  - what: "LRU cache size for REST clients is fixed at 10 items, matching the pinned commit's lru_cache(maxsize=10)."
    why: "Betterlite's caching layer preserves the pin's overhead-prevention strategy without requiring a per-client configuration."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_prompt_management.py#L50"
  - what: "Callback exceptions are logged via verbose_logger and handle_callback_failure is called with callback_name='langfuse'; exceptions do not propagate."
    why: "LiteLLM's same error handling in callbacks: failures do not block the request, they are logged for debugging."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_prompt_management.py#L329-L333"

out_of_scope:
  - "B3900 owns version/TTL checks, resolve_langfuse_credentials, warn_if_upstream_langfuse_configured, mock helpers, configured_release, and deployment environment."
  - "B3903 owns acquire_langfuse_tracing and the LangfuseTracing interface."
  - "B3904 owns build_langfuse_client and get_prompt from LangfuseApiClient."
  - "B3907 owns get_langfuse_logger_for_request logger selection and log_event_on_langfuse event dispatch."
  - "B173 owns HTTPHandler client construction for HTTP requests."
  - "B198 owns run_async_function bridge from asyncify.py; this task calls it to execute async callbacks from sync context."
  - "B254 owns StandardLoggingPayload and StandardCallbackDynamicParams contracts."
  - "B3931 owns CustomLogger.handle_callback_failure for callback error counting."
  - "B3945 owns DynamicLoggingCache.set_cache and the in_memory_dynamic_logger_cache instance."
  - "PromptManagementBase.get_chat_completion_prompt contract; this task implements the async override that delegates to it."
  - "ServiceTraceIDCache.set_cache for trace ID storage; this task calls it through _remember_trace_id."

pitfalls:
  - "LRU cache on langfuse_client_init must use cache key with all six parameters (public_key, secret, secret_key, host, flush_interval, allow_env_credentials) so dynamic credentials with allow_env_credentials=false never collide with environment fallback clients."
  - "allow_env_credentials=false must be set when dynamic_callback_params contains a langfuse_host, preventing environment variable reading for keys; else allow_env_credentials=true."
  - "should_run_prompt_management must return false before attempting to fetch when prompt_id is None; it must also catch and suppress exceptions on fetch, returning false on error."
  - "_compile_prompt must distinguish string output (converted to a system message) from list output (cast and returned); the prompt client's compile() is called with variables unpacked."
  - "_get_optional_params_from_langfuse filters the 'model' key from config but preserves all other keys; empty dicts are valid."
  - "async_log_success_event and async_log_failure_event must construct in_memory_dynamic_logger_cache per-call; they do not retain it across requests."
  - "Both async event functions must call _remember_trace_id after dispatch, extracting trace_id from the LangfuseLoggedEvent dict."
  - "handle_callback_failure is called inside exception handlers and must not raise; it updates internal counter state."
  - "run_async_function is imported from asyncify.py and called synchronously to execute async functions from sync callbacks; exception handling is on the async path."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 2
