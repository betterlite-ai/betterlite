id: B385
title: Compaction history partition and fit inputs
description: 'Implement CompactionHistory, tool-pair partitioning, token budget, compactor model selection
  and portable/native summary input over B010 messages and B013 facts. Preserve protected system context
  and complete tool-call/result pairs. Return a typed summary request for B336; do not call a provider.
  Implement the owned native service in crates/betterlite-router/src/compaction_history.rs. Add ProbeOperation::CompactionHistory
  in tools/oracle/src/router_probes/mod.rs and the corresponding B385 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/context_compaction.py:
  _unavailable (L173-L176), _blocks (L179-L181), _tool_ids (L184-L202), _history (L205-L232), _count (L235-L241),
  _budget (L244-L263), _compactor_model (L266-L297), _native_prefix (L300-L314), _compactor_input (L339-L357),
  _portable_history (L390-L413). Implement these behaviors through the typed Rust services above; synchronous
  facades and structural accessors reuse the same primitive instead of separate ports.'
