id: B10067
title: Env credential login switch
description: >-
  LiteLLM's is_env_credential_login_enabled (login_utils.py L170-L183) says whether a UI login with UI_USERNAME and UI_PASSWORD, or the master key when UI_PASSWORD is unset, can still succeed. Two callers need it: B788's password login picks its "invalid credentials" message with it, and B4448's readiness details report it as show_env_credential_login_warning, so the Admin UI shows its banner only while that login path is open. This task builds the function and the two general_settings keys it reads, so B4448 no longer waits for the whole password login task.


  The setting. Config section env_credential_login in betterlite-config, crates/betterlite-config/src/sections/env_credential_login.rs with its tests in env_credential_login/tests.rs. The stub file, its `pub mod` line and its entry in the sections! list are on main already. It reads general_settings.disable_env_credential_login into `env_login_disabled: bool` and general_settings.disable_password_login_when_sso_enabled into `sso_blocks_password_login: bool`, both false by default and both reachable as config.sections.env_credential_login. LiteLLM declares both keys as `bool | None` (ConfigGeneralSettings) and tests them with `is True`, so only a YAML true sets a flag: an absent key, null, false, a string such as "true" and a number all leave it false. load_config resolves an os.environ/ reference before anything reads general_settings, so a reference reads as the flag its variable names. sections/model_visibility.rs already reads model_list_healthy_only this way (a bool, a reference read through betterlite_env::flag, anything else off, an unset variable a MissingEnvironment error), so match its behavior. B788's own config section no longer parses either key and reads them from here.


  The check. Module env_credential_login in betterlite-server, crates/betterlite-server/src/env_credential_login.rs with its tests in env_credential_login/tests.rs, an empty stub lib.rs already declares. `pub const fn is_enabled(settings: &Settings, sso_provider_ready: bool) -> bool`, where Settings is the config section's: false when env_login_disabled is true; false when sso_blocks_password_login is true and sso_provider_ready is true; true otherwise. sso_provider_ready is the answer of LiteLLM's is_sso_provider_fully_configured (auth_utils.py L1493-L1508), which B881 builds in betterlite-auth over its own config section and the SAML runtime capability. The caller computes it and passes it in, so this task has no dependency on B881: B788 already calls B881's predicate for its SSO gate, and B4448 receives it from its ReadinessSources. Name the function is_enabled and not after LiteLLM, since is_env_credential_login_enabled is 31 characters and the rules stop names at 30; put LiteLLM's name in the one-line comment above it.


  Tests. sections::env_credential_login::tests loads complete YAML through B002's Loader with an injected environment: loads_both_flags, flags_default_off (no general_settings block, and the block without either key), only_literal_true (false, null, "true", "True" and 1 for each key) and flags_from_environment (an os.environ/ reference set to true and to false, and an unset variable). env_credential_login::tests in betterlite-server covers the four combinations of the two flags with SSO ready and not ready. Add config_yaml corpus seeds named env-credential-login-* for B002's existing decoder, one with both keys true, one with string and number values, and one with os.environ/ references.


  Oracle. Helper cases on the b10067 operation, a list of calls, each with a general_settings object (either key absent, true, false or null) and sso_provider_ready, answering one bool per call. For each call the Python side removes the twelve SSO variables (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET, MICROSOFT_TENANT, GENERIC_CLIENT_ID, GENERIC_CLIENT_SECRET, GENERIC_AUTHORIZATION_ENDPOINT, GENERIC_TOKEN_ENDPOINT, GENERIC_USERINFO_ENDPOINT, SAML_IDP_METADATA_URL, SAML_IDP_METADATA_XML) from os.environ, sets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET to made-up values when sso_provider_ready is true, calls the public litellm.proxy.auth.login_utils.is_env_credential_login_enabled with the general_settings dict, and puts the environment back afterwards. The Rust side builds the section's Settings from the same call and calls is_enabled. Add an env-credential-login-* seed to the helper_case corpus.
scope:
  paths:
    - crates/betterlite-server/src/env_credential_login.rs
    - crates/betterlite-server/src/env_credential_login/**
    - crates/betterlite-config/src/sections/env_credential_login.rs
    - crates/betterlite-config/src/sections/env_credential_login/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/env-credential-login-*
    - tools/oracle/cases/helpers/env-credential-login/**
    - tools/oracle/fuzz/corpus/helper_case/env-credential-login-*
    - tools/oracle/helpers/b10067.py
    - tools/oracle/helpers/b10067/**
    - tools/oracle/src/helpers/server/b10067.rs
    - tools/oracle/src/helpers/server/b10067/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_utils.py#L170-L183
    why: Owned. is_env_credential_login_enabled and the order of its two checks.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L3147-L3157
    why: disable_password_login_when_sso_enabled, typed bool or None, default None.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L3177-L3188
    why: disable_env_credential_login, typed bool or None, default None.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L1493-L1508
    why: is_sso_provider_fully_configured, which the caller evaluates for sso_provider_ready (B881 builds it).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_utils.py#L155-L167
    why: Call sites in B788, _admin_credentials_match reading disable_env_credential_login and _invalid_credentials_message calling the check.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L1679-L1683
    why: Call site in B4448, _show_env_credential_login_warning.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5748-L5788
    why: _check_for_os_environ_vars resolves an os.environ/ reference in general_settings, and get_secret turns "true" into a boolean.
dod:
  - text: is_enabled is false when disable_env_credential_login is set, false when disable_password_login_when_sso_enabled is set and an SSO provider is fully configured, and true in every other combination.
    proof: [behavior-tests, oracle, helper-python]
  - text: Both keys load through the production config loader, off by default, on only for a YAML true or an os.environ/ reference whose variable reads as true, and off for null, false, other strings such as "true" and numbers.
    proof: [config-tests, config-corpus]
  - text: The helper cases agree with LiteLLM for both flags with SSO ready and not ready, and the new helper seed replays through the shared parser.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: The env credential check ignores a flag or the SSO readiness.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^env_credential_login::tests::/)'
    - id: config-tests
      why: A disable flag is not loaded, loads from a non-boolean value or ignores an os.environ/ reference.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::env_credential_login::/) - test(replays_the_config_yaml_corpus)'
    - id: config-corpus
      why: No new env-credential-login config seed carries the keys, or the config replay fails.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/env-credential-login-*")" &&
        grep -rlq "disable_env_credential_login" crates/betterlite-config/fuzz/corpus/config_yaml/env-credential-login-* &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: The b10067 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10067.py tools/oracle/helpers/b10067)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10067 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/env-credential-login-*")" &&
        grep -lE 'b10067"?:' tools/oracle/fuzz/corpus/helper_case/env-credential-login-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-server --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/env-credential-login/flags-off-keeps-env-login.yaml
  - tools/oracle/cases/helpers/env-credential-login/env-login-disabled.yaml
  - tools/oracle/cases/helpers/env-credential-login/sso-gate-needs-ready-provider.yaml
deviations: []
out_of_scope:
  - "_admin_credentials_match, _invalid_credentials_message, authenticate_user with its SSO gate and every other function in login_utils.py: B788, which reads both flags from this section and calls is_enabled."
  - "is_sso_provider_fully_configured, has_user_setup_sso and the SSO environment variables: B881. This task takes its answer as an argument."
  - "show_env_credential_login_warning and the readiness details body: B4448. The production ReadinessSources that answers sso_provider_ready: B8540."
pitfalls:
  - "An SSO provider with only a client id is not fully configured, so disable_password_login_when_sso_enabled alone keeps env login enabled until the provider has its secret (and the tenant or endpoints it needs)."
  - "disable_env_credential_login wins on its own, whatever SSO looks like; check it first, as LiteLLM does."
  - "disable_password_login_when_sso_enabled is 39 characters, so the Rust field gets a short name with a serde rename, and the Python TypedDict keeps the key with an `# ast-grep-ignore: no-long-names` line, as tools/oracle/helpers/b10015.py does."
  - "The Python helper changes os.environ for each call; restore it after the call, or the next call and the next case in the same LiteLLM process see the old SSO variables."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
