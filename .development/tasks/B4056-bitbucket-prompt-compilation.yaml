    why: BitBucketPromptManager class declaration, __init__, integration_name property, prompt_manager property, and get_prompt_template method.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L325-L383
    why: _parse_prompt_to_messages method with case-insensitive role prefix detection and blank-line handling.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L411-L506
    why: should_run_prompt_management, _compile_prompt_helper, and async_compile_prompt_helper methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/__init__.py#L1-L63
    why: Imports/globals, set_global_bitbucket_config function, prompt_initializer, and registry declarations.
dod:
  - text: BitBucketPromptManager.__init__ accepts bitbucket_config and optional prompt_id; does not construct BitBucketTemplateManager during initialization.
    proof: [bitbucket-compiler-init-tests]
  - text: integration_name property returns "bitbucket".
    proof: [bitbucket-compiler-init-tests]
  - text: prompt_manager property lazily constructs BitBucketTemplateManager on first access if not already set, passing bitbucket_config and prompt_id to the constructor.
    proof: [bitbucket-compiler-lazy-tests]
  - text: get_prompt_template renders an already-loaded template from prompt_manager.prompts and returns (rendered_prompt, metadata), or raises ValueError with exact message "Prompt template '{prompt_id}' not found" if missing.
    proof: [bitbucket-compiler-get-template-tests, bitbucket-compiler-get-template-missing]
  - text: should_run_prompt_management returns true when prompt_id is not None, false otherwise.
    proof: [bitbucket-compiler-gate-tests]
  - text: _compile_prompt_helper raises ValueError if prompt_id is None, loads the prompt if not already in prompt_manager.prompts by calling _load_prompt_from_bitbucket, parses rendered template into messages, projects five optional parameters, and returns PromptManagementClient with template_messages and optional_params.
    proof: [bitbucket-compiler-compile-tests]
  - text: >-
      _compile_prompt_helper wraps all exceptions raised during loading/parsing in ValueError with message
      "Error compiling prompt '{prompt_id}': {e}".
    proof: [bitbucket-compiler-exception-wrap-tests]
  - text: _compile_prompt_helper projects exactly five optional parameters (temperature, max_tokens, top_p, frequency_penalty, presence_penalty), checking `if param in prompt_metadata` to include null values.
    proof: [bitbucket-compiler-params-tests]
  - text: async_compile_prompt_helper accepts the same parameters and delegates to _compile_prompt_helper.
    proof: [bitbucket-compiler-async-tests]
  - text: _parse_prompt_to_messages parses rendered template with case-insensitive role detection (System:, User:, Assistant:), skips blank lines, accumulates content under each role, and returns list of messages.
    proof: [bitbucket-compiler-parse-tests]
  - text: >-
      _parse_prompt_to_messages wraps a non-empty template with no role prefix into single message with role "user" and full stripped template as content.
    proof: [bitbucket-compiler-parse-no-prefix]
  - text: _parse_prompt_to_messages returns empty list when template is blank or whitespace-only.
    proof: [bitbucket-compiler-parse-blank]
  - text: set_global_bitbucket_config accepts a dict and stores it for runtime retrieval.
    proof: [bitbucket-compiler-global-tests]
  - text: prompt_initializer accepts PromptLiteLLMParams and PromptSpec, extracts bitbucket_config from litellm_params, raises ValueError("bitbucket_config is required for BitBucket prompt integration") if missing, and returns BitBucketPromptManager.
    proof: [bitbucket-compiler-init-tests]
  - text: prompt_initializer_registry maps SupportedPromptIntegrations.BITBUCKET.value to prompt_initializer function.
    proof: [bitbucket-compiler-registry-tests]
