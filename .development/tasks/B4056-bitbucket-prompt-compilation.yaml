deviations:
  - what: "BitBucketPromptManager.__init__ accepts bitbucket_config and optional prompt_id but does not construct BitBucketTemplateManager; construction is deferred until the prompt_manager property is accessed."
    why: LiteLLM uses lazy property initialization to avoid constructing HTTP clients until actually needed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L226-L233
  - what: "get_prompt_template does not load missing prompts; it only renders already-loaded templates and raises ValueError for missing ids."
    why: Loading deferred to _compile_prompt_helper separates concerns between template rendering and compilation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L235-L265
  - what: "Role prefixes (System:, User:, Assistant:) are detected case-insensitively (via lowercasing), while message role fields output lowercase role names."
    why: LiteLLM's implementation matches on line.lower().startswith('system:') and outputs role field with 'system', 'user', 'assistant' in lowercase.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L341-L350
  - what: "Blank lines (stripped empty) do not contribute to message content and do not trigger role transitions in _parse_prompt_to_messages."
    why: LiteLLM skips blank lines entirely during parsing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L335-L338
  - what: >-
      _parse_prompt_to_messages wraps a non-empty template with no role prefix into a single message with role "user" and content being the full stripped template.
    why: LiteLLM's fallback treats unprefixed non-empty templates as single user messages using the whole template.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L379-L381
  - what: "_parse_prompt_to_messages returns empty list when template is blank or whitespace-only, not a user message with empty content."
    why: LiteLLM skips blank lines and returns empty list if nothing remains after stripping.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L379-L382
  - what: "Optional parameters (temperature, max_tokens, top_p, frequency_penalty, presence_penalty) are included if present in metadata, including null values."
    why: LiteLLM checks `if param in prompt_metadata` to include values even when None.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L461-L470
  - what: "prompt_label and prompt_version parameters are part of the signature for interface compatibility but are never used."
    why: LiteLLM includes these for parity with other backends, but BitBucket uses only prompt_id and prompt_variables.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L425-L432
out_of_scope:
  - "Function: BitBucketPromptManager.pre_call_hook, post_call_hook, get_available_prompts, reload_prompts. Owner: source defines these but they are not part of the open-source completion path. B4058 owns the actual completion-hook adapters."
  - "Function: BitBucketPromptManager.get_chat_completion_prompt, async_get_chat_completion_prompt. Owner: B4058. These are upper completion-hook adapters that call PromptManagementBase orchestration."
  - "Module: BitBucketTemplateManager, BitBucketClient file fetching, template rendering. Owner: B4055."
pitfalls:
  - "BitBucketPromptManager.__init__ accepts bitbucket_config and optional prompt_id but never constructs BitBucketTemplateManager. The property access defers construction until the prompt_manager property is first accessed."
  - "get_prompt_template does not call _load_prompt_from_bitbucket; it only renders templates already in prompt_manager.prompts. Missing templates raise ValueError with exact message `Prompt template '{prompt_id}' not found`."
  - "_compile_prompt_helper loads missing prompts by calling _load_prompt_from_bitbucket if prompt_id is not in prompt_manager.prompts, but get_prompt_template never does."
  - "Role prefixes are matched case-insensitively: line.lower().startswith('system:'), line.lower().startswith('user:'), line.lower().startswith('assistant:'), but the message role field is always the literal lowercase 'system', 'user', or 'assistant', regardless of how the prefix was capitalized in the template."
  - "_parse_prompt_to_messages skips blank lines entirely (line.strip() empty). A blank line does not contribute content or create a role transition."
  - "_parse_prompt_to_messages returns a single-item list with role 'user' and full content if no role markers exist and the template is not empty. For empty/whitespace-only templates, it returns an empty list."
  - "The five optional parameters (temperature, max_tokens, top_p, frequency_penalty, presence_penalty) are included if present in metadata, even with null/None values. The check is `if param in prompt_metadata`, not `if param and prompt_metadata.get(param)`."
  - "_compile_prompt_helper wraps any exception raised during prompt loading or parsing in ValueError with message 'Error compiling prompt '{prompt_id}': {e}'."
  - "prompt_initializer_registry maps SupportedPromptIntegrations.BITBUCKET.value (the string value, not the enum) to the initializer function. Access via integration_name as a string key."
  - "prompt_initializer extracts bitbucket_config from litellm_params and raises ValueError with message 'bitbucket_config is required for BitBucket prompt integration' if missing."
  - "Label and version parameters in _compile_prompt_helper are part of the signature for interface compatibility with other backends but are never consumed."
review_level: standard
