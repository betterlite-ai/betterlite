id: B4056
title: Bitbucket prompt compilation and initialization
description: >-
  Build BitBucketPromptManager as a compiler for Bitbucket-hosted prompts, with lazy template
  loading, role parsing and optional parameter projection. The manager construction takes
  bitbucket_config and optional prompt_id but does not construct BitBucketTemplateManager until
  the prompt_manager property is accessed. Implement should_run_prompt_management to gate on
  prompt_id, _compile_prompt_helper and async_compile_prompt_helper to load missing prompts from
  Bitbucket, render templates with variables, parse rendered content into messages by role
  prefix, and extract five optional parameters from metadata into PromptManagementClient. After
  rendering the template with supplied variables, message parsing detects role prefixes
  (System:, User:, Assistant:) case-insensitively and normalizes them to lowercase in output,
  while five optional model parameters (temperature, max_tokens, top_p, frequency_penalty,
  presence_penalty) are extracted from metadata and included when present, preserving null
  values. Build the prompt_initializer
  to construct managers from litellm_params and prompt_spec, and register it in
  prompt_initializer_registry under SupportedPromptIntegrations.BITBUCKET. Build
  set_global_bitbucket_config for runtime config updates. Preserve lazy template manager
  construction, case-insensitive role detection with lowercase output, five-parameter null-value
  inclusion, and ignored label/version inputs. The initializer extracts bitbucket_config from
  litellm_params, raising ValueError if missing.
