id: B1056
title: Assistant thread SDK creation and retrieval
description: >-
  Implement all four complete thread functions at assistants/main.py:526-835 in core::api::assistant_threads.
  B520 supplies OpenAI thread calls, B687 Azure calls, B176 control extraction, B010 GenericLiteLLMParams, B174 async provider
  resolution, B011 async error mapping and B2487 resource settings. Thread creation accepts required
  provider and nullable messages,metadata,tool_resources,client; retrieval requires provider/thread_id and
  nullable client. Preserve that tool_resources is accepted but never forwarded by either branch.
  B2401 AssistantThreads executes the real sync/async wrappers through mock HTTP, not helper projections.

  Use B2487's OpenAI/Azure credentials and timeout (600-second fallback), already loaded by Config.
  Create reads acreate_thread from kwargs without removing it; get pops aget_thread. Neither validates
  nonboolean flags, and provider methods select async only for true. A null provider return passes
  through unchanged. The 265 nonblank/non-comment source lines include thread examples; allow 195 code,
  150 tests, 85 adapters, 130 fixtures and 40 corpus/wiring, 600 total. B520 owns external response decoding.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/assistant_threads.rs
  - crates/betterlite-core/src/api/assistant_threads/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/assistant_threads.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/assistant_threads.py
  - tools/oracle/cases/sdk-http/assistant-threads/**
  - tools/oracle/fuzz/corpus/sdk_http_case/assistant-threads-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L526-L835
  why: Whole create/get wrappers reveal dropped tool_resources, asymmetric flag removal and Azure client/token branches.
dod:
- text: >-
    thread_create_drops_tool_resources sends provider=openai,messages=[{role:user,content:hello}],
    metadata={tag:x},tool_resources={file_search:{vector_store_ids:[vs_a]}}. Both SDK modes POST /v1/threads
    with messages and metadata only, OpenAI-Beta=assistants=v2. Null messages/metadata are omitted by B520;
    []/{} remain. The same tool_resources omission holds on Azure. Mock {id:thread_a,object:thread,
    created_at:1,metadata:{tag:x},tool_resources:{}} returns through B520's Thread conversion.
  proof: [thread-tests, oracle, python-adapter]
- text: >-
    thread_retrieve_uses_id calls both modes with thread_a, expects GET /v1/threads/thread_a and the
    mock Thread record. Other kwargs do not become query/body fields; there is no managed file/store
    lookup. Native test gives provider result null and expects null rather than create_assistants' internal
    error. Async copy_context reaches execution and coroutine results are awaited exactly once.
  proof: [thread-tests, oracle, python-adapter]
- text: >-
    thread_settings_and_azure_client exercises OpenAI and Azure base/key/version chains from B2487,
    including request overrides and environment fallback. Default timeout=600, timeout=0/request_timeout=4->4,
    "7.5"->7.5, structured openai/azure timeout retained and max_retries forwarded. OpenAI organization is
    request/global/OPENAI_ORGANIZATION; Azure gets B176 litellm_params. In both create and retrieve Azure
    discards isinstance(OpenAI) clients including AzureOpenAI, but not an AsyncOpenAI instance via that check.
    AZURE_AD_TOKEN=env-token is used only with extra_body=null; omission/{} yields null; body-token is popped
    from {azure_ad_token:body-token} and wins. Compare outbound auth and api-version with static key absent
    in bearer cases; the extra-body map itself is not a thread request body.
  proof: [thread-tests, oracle, python-adapter]
- text: >-
    thread_flags_and_provider_errors sends acreate_thread/aget_thread=1 or "true" to synchronous
    wrappers and expects the synchronous provider method, without flag-validation errors. null/false also
    select sync; true selects async. Native capture confirms create retains its flag in kwargs/control
    preparation and get removes its flag. Unsupported anthropic raises BadRequestError,400,
    type/param/code=null,message="LiteLLM doesn't support anthropic for 'create_thread'. Only 'openai' is supported."
    or the get_thread variant. Mock HTTP 404 with type=invalid_request_error,param=thread_id,code=missing
    remains NotFoundError,404 with those fields synchronously; async uses B011 with model="",completion_kwargs={}
    and mapped type/param/code=null. Commit a seed for each operation/mode in B2401's corpus.
  proof: [thread-tests, oracle, python-adapter, sdk-corpus]
checks:
  optional: []
  commands:
  - id: thread-tests
    why: thread SDK calls accidentally forward tool resources or change flags and Azure credentials
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_threads::tests::/) - test(/::replays_corpus$/)'
  - id: python-adapter
    why: thread creation/retrieval is not checked via the pinned SDK and mock HTTP
    run: test -f tools/oracle/sdk_http/assistant_threads.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: thread operation inputs have no newly committed decoder cases
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/assistant-threads-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/assistant-threads/thread-create-drops-tool-resources.yaml
- tools/oracle/cases/sdk-http/assistant-threads/thread-retrieve-uses-id.yaml
- tools/oracle/cases/sdk-http/assistant-threads/thread-settings-and-azure-client.yaml
- tools/oracle/cases/sdk-http/assistant-threads/thread-flags-and-provider-errors.yaml
deviations: []
out_of_scope:
- B1055/B1130 own assistant definition SDKs, B1057 messages and the run SDK split belongs below B089. B1086 registers thread HTTP handlers.
- B2487 owns settings loading and non-finite timeout policy. B520/B687 own thread records, provider serialization and beta headers.
pitfalls:
- tool_resources never reaches either thread-create provider method.
- Thread async flags accept nonboolean values without the validation performed by assistant-definition wrappers.
- A provider null result is returned as null by these wrappers.
review_level: security
budget:
  max_changed_lines: 680
  max_new_expects: 0
