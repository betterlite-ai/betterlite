id: B1056
title: Assistant threads
description: >-
  Implement create/retrieve thread operations with typed messages, metadata and tool_resources. Reuse managed-file
  mappings for attachments and keep configured assistant provider credentials distinct from caller metadata.


  Implement crates/betterlite-core/src/api/assistant_threads.rs. Use AssistantThreadsInput and AssistantThreadsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions thread_create_messages, thread_tool_resources, thread_retrieve, thread_not_found
  under api::assistant_threads::tests. Each named function drives production code and asserts its case result; use
  named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.api_base
  defaults to None; env.OPENAI_BASE_URL defaults to unset (None); env.OPENAI_API_BASE defaults to unset (None);
  litellm_settings.organization defaults to None; env.OPENAI_ORGANIZATION defaults to None; litellm_settings.api_key
  defaults to None; litellm_settings.openai_key defaults to None; env.OPENAI_API_KEY defaults to unset (None); env.AZURE_API_BASE
  defaults to unset (None); litellm_settings.azure_key defaults to None; env.AZURE_OPENAI_API_KEY defaults to unset
  (None); env.AZURE_API_KEY defaults to unset (None); litellm_settings.api_version defaults to None; env.AZURE_API_VERSION
  defaults to unset (None); env.AZURE_AD_TOKEN defaults to unset (None). No environment reads occur outside betterlite-config.
  Test api::assistant_threads::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::AssistantThreads in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {assistant_threads: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/assistants/main.py: acreate_thread (L526-L554); litellm/assistants/main.py: create_thread
  (L557-L690); litellm/assistants/main.py: aget_thread (L693-L726); litellm/assistants/main.py: get_thread (L729-L835).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 245 owned nonblank/non-comment/non-docstring Python lines (265 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 265 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 75 config tests/seeds and
  30 wiring; 572 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B1019 (File routing ids), B1020 (File credentials), B1087 (Api boundaries), B520
  (OpenAI thread and message operations), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
