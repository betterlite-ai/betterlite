checks:
  optional:
  - mutants
  commands:
  - id: case-tag-split-every-byte
    why: The tag-split-every-byte behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::reasoning_stream_cases::case_[0-9]+_tag_split_every_byte$/)'
  - id: case-reasoning-and-text
    why: The reasoning-and-text behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::reasoning_stream_cases::case_[0-9]+_reasoning_and_text$/)'
  - id: case-unterminated-tag-flush
    why: The unterminated-tag-flush behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::reasoning_stream_cases::case_[0-9]+_unterminated_tag_flush$/)'
  - id: case-plain-text-prefix
