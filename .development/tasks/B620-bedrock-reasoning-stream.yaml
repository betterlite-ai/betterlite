id: B620
title: Bedrock runtime reasoning-tag and choice decoding
description: >-
  Add ReasoningTagState for runtime models that emit <reasoning> tags inside visible content. Preserve partial opening/closing
  tags across chunks, prefix flush at EOF and simultaneous reasoning/text deltas. The parameter refusal tables are
  metadata supplied to runtime request preparation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/chat_completions/transformation.py:
  chat_completions_params_refused_for L68-L77; chat_completions_params_refused_while_reasoning L80-L88; _without_params
  L91-L92; chat_completions_reasoning_efforts_refused_for L98-L111; without_refused_reasoning_effort L114-L118;
  non_string_reasoning_effort L121-L130; _held_close_tag_prefix L133-L141; ReasoningTagSplitter.feed L156-L168;
  ReasoningTagSplitter._feed_start L170-L175; ReasoningTagSplitter._feed_reasoning L177-L184; ReasoningTagSplitter.flush
  L186-L190; _split_streamed_content L193-L200; split_reasoning_tag L203-L212; BedrockRuntimeChatCompletionsStreamingHandler.__init__
  L218-L225; BedrockRuntimeChatCompletionsStreamingHandler.chunk_parser L227-L240; AmazonBedrockRuntimeChatCompletionsConfig.transform_response
  L450-L487.


  Reuse split_bedrock_region_path from B2203 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse bedrock_model_is_openai_gpt from B598 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: tag_split_every_byte: In reasoning phase, emit text up to the first </reasoning>; retain
  only the longest trailing proper prefix of that close tag between fragments. Crossing the close enters after_close,
  discards all leading Unicode whitespace from subsequent fragments until nonwhitespace content arrives, then emits
  all later text unchanged. Test every split boundary of both tags and multibyte text without splitting a Unicode
  scalar inside the string parser. Nested/repeated tags after the first close remain visible content. reasoning_and_text:
  After B504 parent chunk parsing, maintain an independent splitter per choice.index, processing duplicate indexes
  sequentially. A finish_reason other than None, including empty string, flushes that choice. Append nonempty extracted
  reasoning to existing delta.reasoning_content (falsey existing value becomes empty). Set delta.content when extracted
  content is nonempty or original delta.content is not None, preserving None for a content-less delta. Keep all
  other chunk fields and unrelated choices unchanged. unterminated_tag_flush: flush always clears pending and enters
  content. Pending text in reasoning phase is emitted as reasoning; pending text in every other phase is emitted
  as content. A partial opening tag at EOF is visible; a partial closing tag at EOF remains reasoning. _split_streamed_content
  treats None content as empty, feeds before flushing, and flushes only for finished=True; repeated flushes emit
  nothing. plain_text_prefix: ReasoningTagSplitter starts phase=start,pending=empty. Only exact <reasoning> at offset
  zero starts reasoning; buffer partial opening prefixes across fragments. Any mismatch emits the full pending prefix
  plus current text as content and permanently enters content. Leading whitespace and <think> therefore remain visible.
  Empty fragments preserve pending state. non_string_effort: Missing or None reasoning_effort and every string produce
  an empty malformed set. Every other value, including bool,number,list,dict, produces {reasoning_effort}. For B598
  GPT-family models, unless the raw effort is exactly none, refuse the intersection of present input keys with temperature,top_p,frequency_penalty,presence_penalty,logprobs,top_logprobs,
  even when their values are None. Non-GPT models and explicit none return no reasoning-active refusals. model_refused_fields:
  Normalize model through B2203 split_bedrock_region_path. Match case-sensitive substrings and union all matching
  families: openai.gpt-oss refuses logit_bias; xai. refuses frequency_penalty,presence_penalty. xai. also refuses
  string reasoning_effort=none; no other effort string is refused by this table. _without_params copies all fields
  except the supplied set; without_refused_reasoning_effort returns the original mapping unless a string exactly
  matches a refused value, then removes only reasoning_effort. buffered_thinking_split: Call B038 parent buffered
  response conversion, then B206 set_provider_response_headers_in_hidden_params before inspecting choices. Preserve
  raw headers under _hidden_params.headers; additional_headers combines processed B206 response headers with any
  existing mapping values winning. For every nonstream Choices whose message.content is a string, run the same splitter
  with finished=True; append nonempty reasoning to existing reasoning_content, and always assign the returned visible
  content. Empty reasoning becomes None but its matched tags and post-close whitespace still disappear in this runtime
  path, unlike B616. Preserve nonstring content and streaming choices unchanged.


  decode_reasoning_delta is the production incremental tag decoder over already decoded UTF-8 string fragments;
  B504/B038 own transport/SSE/JSON decoding. Its fuzz target converts input to valid Unicode fragments at the shared
  byte boundary and exercises the actual state machine, including partial tags and EOF, without installing a second
  response JSON decoder. Raw invalid UTF-8 remains the prerequisite decoder's error.


  Implement crates/betterlite-bedrock/src/reasoning_stream.rs with adjacent tests under reasoning_stream/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function reasoning_stream_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): tag_split_every_byte, reasoning_and_text, unterminated_tag_flush, plain_text_prefix, non_string_effort,
  model_refused_fields, buffered_thinking_split. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_reasoning_stream* using HelperCase: kind:
  helper and the externally tagged bedrock_reasoning_stream variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_reasoning_stream that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_reasoning_delta consumes UTF-8 response fragments containing split reasoning tags
  in crates/betterlite-bedrock/src/reasoning_stream.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_reasoning_stream.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_reasoning_stream.
  The adjacent test replays_the_bedrock_reasoning_stream_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 164 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 245 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
