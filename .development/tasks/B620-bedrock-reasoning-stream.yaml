    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::reasoning_stream_cases::case_[0-9]+_model_refused_fields$/)'
  - id: case-buffered-thinking-split
    why: The buffered-thinking-split behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::reasoning_stream_cases::case_[0-9]+_buffered_thinking_split$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_reasoning_stream.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_reasoning_stream*")"
      && grep -lq 'bedrock_reasoning_stream' tools/oracle/fuzz/corpus/helper_case/bedrock_reasoning_stream* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_reasoning_stream$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_reasoning_stream)"
      && grep -q 'decode_reasoning_delta' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_reasoning_stream.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_reasoning_stream_corpus$/)'
