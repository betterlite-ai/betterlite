pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_reasoning_stream in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/reasoning_stream.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_reasoning_stream.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Runtime tag splitting removes an empty reasoning block, while the Moonshot caller preserves it.
- A missing reasoning_effort still activates the GPT reasoning-parameter refusal set.
