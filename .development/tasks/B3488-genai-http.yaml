id: B3488
title: Execute native GenAI HTTP requests
description: >-
  Build the sync and async HTTP handlers for native Google GenAI generation calls, handling request construction, extra headers and body overlay, client selection with matching mode support, and response transformation. Construct authenticated native requests with provider-supplied headers and API base, overlay caller-supplied extra headers and extra_body after provider preparation, make POST requests with optional streaming, and select between response transformation (non-streaming) or the native streaming iterator (streaming). Return stream response metadata through hidden_params before the first event to the client, and preserve matching-mode client selection (sync client for sync calls, async client for async calls). When upstream fails, use the shared error handler to normalize the status, type, param and code. Logging.pre_call happens after header/body construction and before the request goes to the provider.

  The shared error handler is B2402's `BaseLLMHTTPHandler._handle_error`, used without reimplementation. The streaming iterators from B3487 take the response object and construct chunks incrementally; this handler supplies their hidden_params dictionary before the iterator is returned, with model_id from model_info or the request model parameter (never from a logging method), api_base, cache_key, response_cost and additional_headers from process_response_headers. The handlers are methods on the BaseLLMHTTPHandler singleton; callers pass both provider config and the request/context data. Preserve the sync handler's direct response object return for non-streaming calls, and the async handler's return type annotation as a union of the async streaming iterator or response class. Call B173's public HTTP client API without touching betterlite-http's internal files directly.

