deviations:
  - what: >-
      betterlite-core/src/api/genai_http.rs constructs hidden_params metadata with model_id sourced from model_info.get("id") if present, otherwise from the request model parameter, never from a logging.get_router_model_id() method. If model_info lacks an "id" field and the model parameter is absent or empty, model_id defaults to an empty string.
    why: The logging object's get_router_model_id method is a proxy-level routing artifact not available at HTTP request time in a native implementation. Betterlite constructs model_id from locally available request data instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L303-305

out_of_scope:
- B3480 owns the native operation contract and provider-specific auth/transform methods.
- B3487 owns both GoogleGenAIGenerateContentStreamingIterator and AsyncGoogleGenAIGenerateContentStreamingIterator constructors; this task passes the response and metadata to their constructors.
- B173 provides HTTP client pool selection and methods; this task calls its public API without modifying betterlite-http internals.
- B206 provides process_response_headers; this task applies it to the native response headers for hidden_params.
- B249 provides Logging.pre_call; this task invokes it during HTTP handler execution.
- B2402 provides BaseLLMHTTPHandler._handle_error; this task delegates all HTTP exceptions to it.
- B1368 owns GoogleGenAI provider-specific implementations of auth, URL, and request/response transforms.
- Retries and fallbacks for HTTP errors.

pitfalls:
- The sync client is retrieved with _get_httpx_client only when the caller does not supply one; the async variant uses get_async_httpx_client with the provider enum. Both preserve SSL verification settings from litellm_params.
- extra_headers and extra_body overlay must occur after provider config produces headers and data, so caller values take precedence over defaults.
- The streaming iterator must be constructed immediately after the POST request succeeds, before the response object is held; the iterator takes ownership of the open response stream.
- hidden_params.model_id is derived from model_info["id"] or the model request parameter, not from a logging method; this deviates from LiteLLM's optional get_router_model_id fallback and must be recorded as a deviation.
- Pre-call logging takes an empty string for api_key; the full request dict is passed under complete_input_dict, not unpacked as individual parameters.

