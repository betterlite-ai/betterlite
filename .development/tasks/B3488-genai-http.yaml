- text: The sync and async handlers construct and send authenticated native generate_content requests with correct header and body overlay order.
  proof: [oracle]
- text: Streaming responses are returned as iterators from B3487 with pre-stream hidden_params before the first SSE event reaches the client.
  proof: [behavior-tests, stream-tests]
- text: Non-streaming responses are transformed through the provider's transform_generate_content_response contract.
  proof: [oracle]
- text: The hidden_params metadata includes model_id from model_info or the request model name, api_base, empty cache_key/response_cost, and headers processed through B206.
  proof: [behavior-tests]
- text: HTTP errors are caught and passed through B2402's _handle_error for consistent error transformation.
  proof: [oracle]
- text: Pre-call logging is invoked with the complete request dict, api_base and headers before transport.
  proof: [behavior-tests]
- text: Matching-mode client selection retains sync/async pooling through B173's public API without directly touching betterlite-http's internal files.
  proof: [behavior-tests]

