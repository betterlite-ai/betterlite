id: B737
title: Team and access-group auth lookup
description: >-
  Implement team ID, team alias and access-group reads in auth_team_lookup. Organization and project
  lookups remain B879's. Reject a missing DB before attempting even a warm cache. Team ID reads use
  team_id:<id>, B724 TeamRepository with B735 grant relations, B736's DB-read throttle and B734 cache
  writes. check_db_only skips the cache and selects the writer; check_cache_only misses are HTTP 404
  with detail.error, but check_db_only takes precedence when both flags are true. A successful DB
  answer without a row raises the distinct TeamNotFoundError, also 404; throttled reads, repository
  failures and cache-write failures become ordinary HTTP 404 with the create-via-/team/new detail.
  Do not erase this exception-class distinction before B757 translates it at the HTTP boundary.

  Load an absent object_permission through B735 only when object_permission_id is truthy. A normal
  read logs the failure at DEBUG and keeps the team; a writer read propagates it into the outer 404.
  Cache the team before updating last_db_access_time; a failed cache write must not advance that time.
  An alias lookup uses team_alias:<alias>, find_many with grant relations, 404 for no matches and
  400 for multiple matches (suggest team_id_jwt_field). Permission enrichment failures are DEBUG
  and ignored. Cache alias first, then team_id, both with DEFAULT_IN_MEMORY_TTL; a failure of the
  second write leaves the first. Other alias errors log an exception and become 500 detail.error.

  Access-group reads use access_group_id:<id> and B726 AccessGroupRepository. check_db_only bypasses
  cache and uses the writer. An absent row is always 404 detail.error; an infrastructure or cache-write
  failure logs ERROR and is 503 with string detail 'Access group policy is unavailable' on the writer,
  otherwise 404 detail.error. Preserve existing HTTPException values. B734 owns access-group cache TTL.


  Injected port instead of a reverse dependency on B804: TeamProvisioner::create(TeamSeed)->Result<TeamRow,AuthError>;
  B804 implements management-equivalent provisioning, B053 registers it, and uninstalled team_id_upsert
  fails startup. The port receives only team_id and a PROXY_ADMIN principal, matching new_team's
  synthetic HTTP request; B804 owns all creation writes and their order. The helper oracle replaces
  this collaborator with a recording callable and never invokes the FastAPI handler. Test the real
  provisioner in B804's HTTP suite. No secret is stored by this lookup.


  Build the production auth_team_lookup module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  TeamNotFoundError.__init__ (L3136-L3140; 5 source lines), _get_team_db_check (L3144-L3165; 18 source
  lines), _get_team_object_from_user_api_key_cache (L3172-L3241; 59 source lines), _get_team_object_from_cache
  (L3244-L3254; 11 source lines), get_team_object (L3257-L3316; 52 source lines), get_access_object (L3349-L3416;
  58 source lines), get_team_object_by_alias (L3420-L3526; 88 source lines).


  Consume B735's DEFAULT_IN_MEMORY_TTL integer environment setting (default 5 seconds); its import-time
  int conversion rejects nonintegers, with no fallback. It controls both alias cache writes and the
  DB-read throttle through db_cache_expiry. B735 owns loader acceptance; this task tests consumption.


  Add the auth_team_lookup operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-team-lookup-*
  seed to B171 helper_case, which already owns this decoder.


  Run repository integration cases against POSTGRES_TEST_URL, falling back to testcontainers when it
  is unset. Read-only helper fixtures record cache keys, write order, writer selection and diagnostics.


  Team/access-group inputs are typed IDs and rows. Missing provisioning remains a failed configured
  dependency; it must never be replaced by an enterprise-only creation hook or a fabricated team.


  Sizing: 291 nonblank, noncomment pinned source lines; allow 270 production, 300 behavior/Postgres
  tests, 90 helper adapters and 40 wiring lines, 700 changed lines within a 750-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
