pitfalls:
  - 'The oracle helper for this task is pre-registered as auth_team_lookup in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/team_lookup.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/auth_team_lookup.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - check_db_only does not bypass _should_check_db; a recent DB read can still produce the ordinary team 404.
  - Alias cache writes do not use _cache_team_object, so their TTL is DEFAULT_IN_MEMORY_TTL rather than the team-cache policy.
