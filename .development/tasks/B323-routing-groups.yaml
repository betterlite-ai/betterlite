id: B323
title: Routing groups, priority tiers and reasoning capabilities
description: 'Add typed routing_groups that materialize B302 candidates without duplicating provider definitions.
  Implement validation and scoped strategy selection, including priority-group order, then expose aggregate
  supported reasoning efforts from B013 metadata and B010 capability mappings. Keep absent capability
  provenance distinct from an explicitly empty supported set. Wire group selection into B016 and the B019
  selector enum. Configuration boundary keys introduced or consumed here: routing_groups. Pinned declaration
  defaults: routing_groups=None. Resolve env values once in betterlite-config, never in router code. Implement
  the owned native service in crates/betterlite-router/src/routing_groups.rs. Add ProbeOperation::RoutingGroups
  in tools/oracle/src/router_probes/mod.rs and the corresponding B323 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_utils/reasoning_effort_capability.py:
  _bare_model_entry (L53-L63), _declared_effort_flags (L66-L73), declared_reasoning_efforts (L76-L87),
  declared_reasoning_efforts_for_model (L90-L103), nearest_declared_reasoning_effort (L110-L122), _supports_none_reasoning_effort
  (L125-L137), deployment_is_catalog_mapped (L140-L153), resolve_supported_reasoning_efforts (L156-L198),
  intersect_supported_reasoning_efforts (L201-L212). Implement these behaviors through the typed Rust
  services above; synchronous facades and structural accessors reuse the same primitive instead of separate
  ports. Function coverage in litellm/router_utils/routing_groups.py: apply_routing_group_priority (L8-L17),
  validate_routing_strategy (L23-L35), parse_routing_groups (L38-L100). Implement these behaviors through
  the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
