deviations: []
out_of_scope:
- Auto-router tier classification (B021).
pitfalls:
- Priority routing is a group policy, not a sixth global selector.
- Unknown group members are future catalog references in the pin, not discarded deployments.
- Reasoning off is not a rung on the increasing-effort ladder.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
