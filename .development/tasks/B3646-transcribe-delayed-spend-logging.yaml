dod:
  - text: operation_from_target returns the text after the last "." of x-amz-target, the empty string for a missing header, and the whole value when it has no ".".
    proof: [operation-tests, helper-oracle, helper-python]
  - text: is_priced_job_start is true only for the operation StartTranscriptionJob and reads the upstream request header, case-insensitively.
    proof: [operation-tests, helper-oracle, helper-python]
  - text: The sync handler writes model "transcribe/<operation>", custom_llm_provider "transcribe" and response_cost into the kwargs and into the logging object's model_call_details, adds standard_logging_object built with status "success", and returns the result text as a pass-through response object.
    proof: [handler-tests]
  - text: When building the payload fails, the handler logs the error and returns the result and the original kwargs untouched, while the model_call_details write stays done.
    proof: [handler-fallback-tests]
  - text: The scheduled task prices the job with the job name from the request body (empty when it is not a string), the region from the upstream host, the rate and the started job from the response body.
    proof: [schedule-tests]
  - text: The scheduled task dispatches exactly once with the priced cost in response_cost, the received cache_hit and the handler's kwargs, and dispatches nothing when the rate is missing, the region is not valid or the pricer fails.
    proof: [schedule-tests, schedule-failure-tests]
  - text: With max_pending jobs in flight a new task skips the pricer, charges transcribe_max_job_cost and still dispatches.
    proof: [limits-tests]
  - text: TranscribeLogger::production builds one one-permit download semaphore and passes that same semaphore to every pricing call.
    proof: [wiring-tests]
  - text: Helper oracle cases for the operation name and the priced-start test agree with LiteLLM.
    proof: [helper-oracle, helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: operation-tests
      why: the operation name is cut at the wrong dot, a missing header is not empty, or a non-start operation counts as priced
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::transcribe_logging::tests::operation_/)'
    - id: handler-tests
      why: the sync handler misses a kwargs or model_call_details write, the model name, or the standard_logging_object
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::transcribe_logging::tests::handler_/)'
    - id: handler-fallback-tests
      why: a payload failure escapes, changes the returned kwargs, or undoes the model_call_details write
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::transcribe_logging::tests::fallback_/)'
    - id: schedule-tests
      why: the scheduled task passes the wrong job name, region, rate or cost, or dispatches the wrong fields or a wrong number of times
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::transcribe_logging::tests::schedule_/)'
    - id: schedule-failure-tests
      why: a missing rate, a bad region or a failed pricer still dispatches spend, or a failed dispatch panics
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::transcribe_logging::tests::failure_/)'
    - id: limits-tests
      why: the in-flight cap is missing, or a full queue drops the spend instead of charging the maximum
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::transcribe_logging::tests::limits_/)'
    - id: wiring-tests
      why: the production logger does not share one one-permit download semaphore across pricing calls
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::transcribe_logging::tests::wiring_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3646)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3646 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3646/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/transcribe_logging-*")" &&
        grep -lE '^[[:space:]]+b3646:' tools/oracle/fuzz/corpus/helper_case/transcribe_logging-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: helper-oracle
      why: the helper cases are missing or betterlite and LiteLLM disagree on them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/transcribe-logging)" &&
        grep -rlE '^[[:space:]]+b3646:' tools/oracle/cases/helpers/transcribe-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/transcribe-logging

oracle_cases:
  - tools/oracle/cases/helpers/transcribe-logging/operation-prefixed-target.yaml
  - tools/oracle/cases/helpers/transcribe-logging/operation-missing-target.yaml
  - tools/oracle/cases/helpers/transcribe-logging/operation-nested-dots.yaml
  - tools/oracle/cases/helpers/transcribe-logging/operation-no-dot.yaml
  - tools/oracle/cases/helpers/transcribe-logging/priced-start-job.yaml
  - tools/oracle/cases/helpers/transcribe-logging/priced-other-operation.yaml
  - tools/oracle/cases/helpers/transcribe-logging/priced-missing-target.yaml

deviations:
  - what: Cost is exact Decimal (the rate times the rounded-up seconds from B3645), and it is converted to f64 only when written into the kwargs map and the payload, instead of a Python float product.
    why: Money is Decimal in betterlite, and the f64 conversion at the boundary can differ from Python's float product in the last digit.
  - what: At most 10,000 pricing tasks (MAX_PENDING_PRICING_JOBS) run at once. A job that arrives with the limit reached is charged the maximum (28800 seconds at the rate) at once without polling, and a warning is logged.
    why: rules.yaml bounded-inputs forbids unbounded work per request, and LiteLLM's task set has no limit. Charging the maximum keeps the spend row, in line with the fail-closed rule B3645 uses.
  - what: A request host with fewer than two labels, or a region label with characters outside a-z, 0-9 and "-", logs an error and ends the task without spend, where LiteLLM raises an IndexError (or passes any text on) inside the task.
    why: The region is put into the signed Transcribe and S3 URLs. The route builds the host from configuration, so a bad value cannot occur in normal use, and this check keeps a bad value away from the signer.
  - what: An Err from the pricer or the dispatcher is logged at error level and the task ends, instead of an unretrieved asyncio exception.
    why: Rust has no unobserved task exceptions; the error line is the equivalent.

out_of_scope:
  - "Everything in L1-L351 of the handler file (operation list, cost lookup, eligibility, admin gate, bucket policy, owner tag, job access check, cost helpers, started_transcription_job and the record types) belongs to B3644 and is called here."
  - "Polling, media measurement, the signed job lookup, the S3 media probe and price_transcription_job_live (L354-L576) belong to B3645. This task calls price_transcription_job_live from LiveJobPricer."
  - "The PassThroughLogDispatch trait itself (the Protocol at L124-L135) is B3605's PassThroughLogDispatch. This task only takes it as Arc<dyn PassThroughLogDispatch>."
  - "The success path that decides when to call transcribe_passthrough_handler (success_handler.py L323-L336) is B3606 and the early return that calls schedule_priced_job_logging (L461-L476) is B3607."
  - "The Transcribe route in llm_passthrough_endpoints.py (L1612 on) calls the B3644 policy functions and the B3645 job lookup; it is not changed here, and no HTTP oracle case belongs to this task because no route reaches this code yet."
  - "Building the TranscribeRates implementation over the model cost catalog and the LiveJobPricer dependency bundle is wiring that B102 does when it builds the logger once."

pitfalls:
  - "The operation name comes from the upstream REQUEST header x-amz-target, not from a response header, and the model name is 'transcribe/' plus that name, so a missing header gives the model 'transcribe/' with nothing after it."
  - "transcribe_passthrough_handler writes model, custom_llm_provider and response_cost into the logging object's model_call_details before the payload is built, so a payload failure still leaves those three values set while the returned kwargs stay unchanged."
  - "The fallback result keeps the original text as a pass-through response object, but the fallback kwargs have no model, custom_llm_provider, response_cost or standard_logging_object."
  - "TranscriptionJobName that is not a string becomes the empty string, which the pricer then polls; it is not an error."
  - "A missing cost-map rate ends the task with only an error log, so no spend row exists for that job. This is the one place where the delayed path drops a job instead of charging the maximum."
  - "The synchronous handler is called by B3606 with response_cost 0 for the non-start operations, and the delayed task calls the same function with the priced cost; both must go through the same code."
  - "The download semaphore has one permit and is held by B3645 across the download and the length read. Creating a new semaphore per pricing call would let several tasks download at once, so the logger creates it once."
  - "The cache_hit passed to the dispatcher is the value the task received, but B3605's default dispatcher ignores it (it always sends false); do not fix that here."
  - "The region is the second label of the host, so 'transcribe.cn-north-1.amazonaws.com.cn' gives cn-north-1, not the suffix."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
