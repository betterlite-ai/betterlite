id: B7877
title: Python vector_store_files functions
description: >-
  A vector store holds files, and `litellm.vector_store_files.create(vector_store_id=..., file_id=...)` attaches one. The
  package has twelve functions: `create`, `list`, `retrieve`, `retrieve_content`, `update`, `delete` and an `a` twin of each.
  The provider work is Rust (B1072 create and list, B1073 retrieve, B1074 update and delete, B1111 provider choice).


  Native side, the family `vector_files`: `src/vector_files.rs` with `register` that adds `NativeVectorFileSession` and
  `NativeVectorFileError`; methods `create`, `list`, `retrieve`, `retrieve_content`, `update`, `delete` and `a` twins, each
  `(payload_text, blobs)`. Conversion is in `src/vector_files/convert.rs`, tests `request_*` and `error_*`. The architect writes
  the `lib.rs` lines.


  Python side, `python/betterlite/vector_store_files/main.py` and `__init__.py`, with the export list at the pin. Every
  parameter after `*` is keyword only: `create(*, vector_store_id, file_id, attributes=None, chunking_strategy=None,
  extra_headers=None, extra_query=None, extra_body=None, timeout=None, custom_llm_provider=None, **kwargs)`, `list(*,
  vector_store_id, after, before, filter, limit, order, extra_headers, extra_query, timeout, custom_llm_provider)`,
  `retrieve` and `retrieve_content` with `vector_store_id`, `file_id`, `extra_headers`, `timeout`, `custom_llm_provider`,
  `update` with `attributes` and `extra_body`, and `delete`. A test compares signatures for all twelve. Sync functions accept
  the flag named like their twin (`acreate=True`, `alist=True`, and so on) and return a coroutine. `_ensure_provider` (L35)
  turns a missing provider into the default and `_prepare_registry_credentials` (L39) merges the registry key: both are Rust
  and Python passes `custom_llm_provider` unchanged. Results are the vector store file classes from B167.
