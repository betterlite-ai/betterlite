dod:
- text: All twelve functions keep LiteLLM's signatures, including the keyword-only marker.
  proof: [vsf-signature]
- text: Create, list, retrieve, retrieve_content, update and delete give the same objects as LiteLLM against one server.
  proof: [vsf-calls]
- text: Each sync function returns a coroutine under its flag, and the `a` names are coroutine functions.
  proof: [vsf-async]
- text: A provider error keeps its class and cause, and `client` raises `UnsupportedCallArgument`.
  proof: [vsf-error]
- text: The native register function and conversion have tests without an interpreter.
  proof: [vsf-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: vsf-signature
    why: A keyword is refused or allowed positionally.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_store_files.py -k signature
  - id: vsf-calls
    why: An object reads back different.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_store_files.py -k calls
  - id: vsf-async
    why: The flag or coroutine is wrong.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_store_files.py -k async
  - id: vsf-error
    why: Error class or client check is wrong.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_store_files.py -k error
  - id: vsf-native
    why: A field changes on the way.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^vector_files::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Strict typing has to hold for the file calls.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`client` is refused with `UnsupportedCallArgument`."
  why: A Python HTTP client can't drive the Rust one (B158).
- what: This task has no helper oracle cases.
  why: pytest compares both packages against one local server.
out_of_scope:
- "`_ensure_provider` and `_prepare_registry_credentials` belong to B1111 and B1062."
- "litellm/vector_store_files/utils.py (`VectorStoreFileRequestUtils`) belongs to B1071."
pitfalls:
- "`list` and `retrieve` have no `extra_body`, and `retrieve` has no `extra_query`; only `create` and `update` take a body. Keep each signature as it is."
- "`retrieve_content` is not a prefix of `retrieve`, so a flag named `aretrieve` must not trigger the content call."
- "`filter` shadows a builtin name in `list`; keep the name, as callers pass it by keyword."
- "`attributes` holds scalars only, and None is not sent, but an empty dict is."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
