id: B259
title: Token schema formatting and model normalization
description: >-
  Implement token_counter.py openai_tokenizer_encoding_name, uses_legacy_message_accounting and _fix_model_name
  (663-690), plus every function-definition formatter 954-1051. Use B193 catalog membership and B195 pinned encoding
  names; preserve property order, description lines, required markers, indentation, enum rendering and missing-array-items
  errors. Format OpenAI function, Anthropic input_schema and Gemini declaration shapes without counting them here.
  Return typed values/errors from bounded input, not a general JSON schema validator. HF acquisition and family
  fallback remain the open B195 decision and are not extended here. Budget 220 formatting/normalization, 100 adapters,
  260 tests, 70 fuzz/replay and 50 wiring (700 total). Add the token_tool_format cargo-fuzz target, call the production
  parser, and commit/replay malformed and boundary seeds. Write the behavior rstest functions token_formatting_behavior_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. Register helper operations token_formatting in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-tokenizer/Cargo.toml
  - crates/betterlite-tokenizer/src/lib.rs
  - crates/betterlite-tokenizer/src/error.rs
  - crates/betterlite-tokenizer/src/tools.rs
  - crates/betterlite-tokenizer/src/tools/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/tokenizer/token_formatting.rs
  - tools/oracle/src/helpers/tokenizer/token_formatting/**
  - tools/oracle/helpers/token_formatting.py
  - tools/oracle/helpers/token_formatting/**
  - tools/oracle/cases/helpers/token-formatting/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-tokenizer/fuzz/**
  - crates/betterlite-tokenizer/src/selection.rs
  - crates/betterlite-tokenizer/src/selection/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L663-L690
  why: Catalog-based model normalization and encoding names.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L954-L1051
  why: Tool definition formatting and provider shape normalization.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
- text: The outside-byte parser has its target and newly committed production replay corpus.
  proof:
  - token-tool-format-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/::token_formatting_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'token_formatting' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: token-tool-format-corpus
    why: the required new behavior or its evidence is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/token_tool_format)"
      && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/token_tool_format.rs && test -n "$(ls -A crates/betterlite-tokenizer/fuzz/corpus/token_tool_format)"
      && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(replays_the_token_tool_format_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/token-formatting/azure-name.yaml
- tools/oracle/cases/helpers/token-formatting/unknown-model.yaml
- tools/oracle/cases/helpers/token-formatting/legacy-accounting.yaml
- tools/oracle/cases/helpers/token-formatting/tool-schema.yaml
- tools/oracle/cases/helpers/token-formatting/tool-declarations.yaml
- tools/oracle/cases/helpers/token-formatting/required-and-enums.yaml
- tools/oracle/cases/helpers/token-formatting/nested-types.yaml
- tools/oracle/cases/helpers/token-formatting/missing-array-items.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B196 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as token_formatting in the tokenizer group. Replace the stub Op in tools/oracle/src/helpers/tokenizer/token_formatting.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/token_formatting.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
