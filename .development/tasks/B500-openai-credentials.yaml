- text: >-
    key and organization precedence: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-credentials/key-and-organization-precedence.yaml.
  proof:
  - case-key-and-organization-precedence
  - oracle
  - helper-python
- text: >-
    base url before api base: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-credentials/base-url-before-api-base.yaml.
  proof:
  - case-base-url-before-api-base
  - oracle
  - helper-python
- text: 'empty organization: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-credentials/empty-organization.yaml.'
  proof:
  - case-empty-organization
  - oracle
  - helper-python
- text: 'openai host boundary: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-credentials/openai-host-boundary.yaml.'
  proof:
  - case-openai-host-boundary
  - oracle
  - helper-python
- text: >-
    regional data residency: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-credentials/regional-data-residency.yaml.
  proof:
  - case-regional-data-residency
  - oracle
  - helper-python
- text: New openai_credentials seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: OPENAI_BASE_URL is accepted by the config loader with the documented default and precedence.
  proof:
  - config-openai-base-url
  - config-corpus
- text: OPENAI_API_BASE is accepted by the config loader with the documented default and precedence.
  proof:
  - config-openai-api-base
  - config-corpus
- text: OPENAI_ORGANIZATION is accepted by the config loader with the documented default and precedence.
  proof:
  - config-openai-organization
  - config-corpus
- text: Unrelated unsupported config still fails with its complete field path.
  proof:
  - config-unknown-key
- text: credential identity isolation holds at this task’s owned boundary.
  proof:
  - credential-identity-isolation
- text: secret safe failure holds at this task’s owned boundary.
  proof:
