checks:
  optional:
  - mutants
  commands:
  - id: case-key-and-organization-precedence
    why: Resolve api_key then litellm.api_key then litellm.openai_key then OPENAI_API_KEY; organization then litellm.organization
      then OPENAI_ORGANIZATION then None. Empty strings fall through; this resolver does not trim whitespace.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_key_and_organization_precedence$/)'
  - id: case-base-url-before-api-base
    why: Both get_openai_credentials and main._resolve_openai_api_base resolve api_base then litellm.api_base then
      OPENAI_BASE_URL then OPENAI_API_BASE then https://api.openai.com/v1, preserving trailing slashes and query
      strings. Exercise each truthy source and falsey fallthrough against both entry points.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_base_url_before_api_base$/)'
  - id: case-empty-organization
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-credentials/empty-organization.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_empty_organization$/)'
  - id: case-openai-host-boundary
    why: is_openai_backed_api_base accepts api.openai.com and dot-delimited subdomains, rejects suffix lookalikes
      and missing hostnames; this predicate does not require HTTPS and malformed URL parser errors propagate.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_openai_host_boundary$/)'
  - id: case-regional-data-residency
    why: Only custom_llm_provider=openai with eu.api.openai.com or us.api.openai.com yields eu or us; compare case-insensitive
      hosts and explicit ports, global/foreign hosts, absent/malformed URLs and other providers returning None.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_regional_data_residency$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_credentials.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_credentials*")"
      && grep -lq 'openai_credentials' tools/oracle/fuzz/corpus/helper_case/openai_credentials* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_credentials$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-openai-base-url
    why: The OPENAI_BASE_URL setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_credentials_config_cases::case_[0-9]+_loads_openai_base_url$/)'
      && grep -lq 'OPENAI_BASE_URL' crates/betterlite-config/fuzz/corpus/config_yaml/openai_credentials*
  - id: config-openai-api-base
    why: The OPENAI_API_BASE setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_credentials_config_cases::case_[0-9]+_loads_openai_api_base$/)'
      && grep -lq 'OPENAI_API_BASE' crates/betterlite-config/fuzz/corpus/config_yaml/openai_credentials*
  - id: config-openai-organization
    why: The OPENAI_ORGANIZATION setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_credentials_config_cases::case_[0-9]+_loads_openai_organization$/)'
      && grep -lq 'OPENAI_ORGANIZATION' crates/betterlite-config/fuzz/corpus/config_yaml/openai_credentials*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_credentials_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/openai_credentials*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_credentials_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_credentials_secret_safe_failure$/)'
