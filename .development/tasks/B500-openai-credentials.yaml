id: B500
title: OpenAI credential and endpoint settings
description: >-
  Extend B004 credential resolution only with OPENAI_BASE_URL, OPENAI_API_BASE, OPENAI_ORGANIZATION, host classification
  and data residency. api_base precedence is explicit, litellm.api_base, OPENAI_BASE_URL, OPENAI_API_BASE, then
  the B004 https://api.openai.com/v1 default; organization is explicit, litellm.organization, OPENAI_ORGANIZATION,
  then absent. The existing api_key chain is explicit, litellm.api_key, litellm.openai_key, OPENAI_API_KEY. SDK
  module values arrive from litellm_settings as injected values; no production global reads.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/data_residency.py:
  infer_openai_data_residency L23-L39. litellm/llms/openai/common_utils.py: is_openai_backed_api_base L51-L53; get_openai_credentials
  L358-L377.


  Implement crates/betterlite-openai/src/credentials.rs with adjacent tests under credentials/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation openai_credentials in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function credentials_cases in betterlite-openai with these exact named cases (one per oracle file):
  key_and_organization_precedence, base_url_before_api_base, empty_organization, openai_host_boundary, regional_data_residency.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_credentials* using HelperCase: kind: helper
  and the externally tagged openai_credentials variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_credentials that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/openai/credentials.rs
  and its loader wiring: OPENAI_BASE_URL, OPENAI_API_BASE, OPENAI_ORGANIZATION. Module-level settings enter litellm_settings;
  deployment settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified
  above and in the linked branches; existing key owners remain unchanged. Write config rstest openai_credentials_config_cases
  with named cases loads_openai_base_url, loads_openai_api_base, loads_openai_organization, plus rejects_unrelated_key.
  Each loads case calls the real config loader with that key and asserts the resolved value, default, precedence
  and secret redaction where applicable. Seed B002 config_yaml with new openai_credentials* files for every key;
  reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone openai_credentials_credential_identity_isolation in betterlite-openai for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone openai_credentials_secret_safe_failure in betterlite-openai for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 39 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 75 production lines, 141 behavior/config-test lines, 75 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 34 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 350 planned, 400 maximum changed lines.
