    why: The callback and alerting role gates.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L18991-L19079
    why: /config/callback/delete.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L19081-L19139
    why: Alias normalization and the hidden runtime callback rules.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L19141-L19307
    why: /get/config/callbacks.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L19309-L19333
    why: /config/yaml.
dod:
  - text: /config/callback/delete refuses, removes, saves, audits and answers like LiteLLM.
    proof: [callback-config-tests]
  - text: /get/config/callbacks lists configured and visible runtime callbacks with LiteLLM's alias, hiding and redaction rules.
    proof: [callback-config-tests]
  - text: The alert destinations resolve stored then process env values and apply the admin and non-admin gates.
    proof: [callback-config-tests]
checks:
  optional: []
  commands:
    - id: callback-config-tests
      why: a callback config route differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^callback_config::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "Mounting the routes and their HTTP oracle cases: B8675."
  - "Audit log: B8594. Config read and save: B8380. The add_deployment port: B8611 (B8613 implements it over B8381's DeploymentSync). resolve_fields and the descriptors: B4140. Sensitive callback keys: B2304."
pitfalls:
  - The delete compares the lower-cased name against stored names without lower-casing them.
  - Configured names are alias-normalized before runtime rows are compared, so a configured opentelemetry hides a runtime otel.
  - mask_sensitive_keys for admins is not the same as REDACTED for viewers; admins see partly masked values.
  - "This task builds process_callback (callback_utils.py L692, called by get_config at proxy_server.py L19199 and L19202) and the _types.py records CallbackDelete (L2565) and AllCallbacks (L3986); no other task builds them."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
