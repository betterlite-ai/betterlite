id: B10092
title: Invitation link row creation
description: >-
  LiteLLM creates an invitation link row in one helper, create_invitation_for_user in litellm/proxy/management_helpers/user_invitation.py, and two places call it: POST /invitation/new (B8599) and the invitation email's link builder, which B4023 reaches through its `InvitationCreator` port. B797 owned the helper next to /user/delete, so B8599 waited on all of user deletion and its seventeen other dependencies for these 36 lines. This task builds the helper and the port's implementation on their own.


  Layout. Module user_invitation in betterlite-server, crates/betterlite-server/src/user_invitation.rs, an empty stub the crate's lib.rs already declares. Add submodules under user_invitation/ as you need, with the tests in user_invitation/tests.rs (or files under user_invitation/tests/). SQL is plain tokio-postgres through B700's PostgresStore with `$n` parameters only, the way crates/betterlite-logging/src/key_invitation_email/link.rs reads the same table.


  The row. `InvitationRecord` is LiteLLM's InvitationModel (_types.py L3955): id, user_id, is_accepted, accepted_at (optional), expires_at, created_at, created_by, updated_at and updated_by, with the datetimes as chrono `DateTime<Utc>`. It derives Serialize and Deserialize with those field names, so B8599's invitation routes read and answer this one type. The table's timestamp columns are `TIMESTAMP(3)` without a zone: bind and read them as NaiveDateTime and take them as UTC.


  The helper. `create_invitation_for_user(store: Option<&PostgresStore>, user_id: &str, actor_user_id: Option<&str>, proxy_admin_name: &str) -> Result<InvitationRecord, InvitationError>`. user_id is InvitationNew.user_id, actor_user_id is the caller's UserAPIKeyAuth.user_id, and proxy_admin_name is LiteLLM's litellm_proxy_admin_name, the constant "default_user_id", passed in by the caller. Steps in LiteLLM's order: no store is InvitationError::NoDatabase. Take now once in UTC; expires_at is now plus seven days. The actor is actor_user_id when it is Some and not empty, otherwise proxy_admin_name, matching Python's `or`. Insert one row into "LiteLLM_InvitationLink" with id a new uuid v4 text (Prisma's `@default(uuid())` is made by the client; the column has no default), user_id, created_at = updated_at = now, expires_at, created_by = updated_by = the actor, and is_accepted and accepted_at left to their column defaults (false and NULL). Return the inserted row from `RETURNING`, so the record shows the stored millisecond values. Do not look the user up first.


  Errors. `InvitationError` (thiserror) with NoDatabase, UserMissing and Insert(DbError), each with `status()` and `message()`, the text LiteLLM puts in its `{"error": ...}` detail. NoDatabase is 400 with B8410's CommonProxyErrors::DbNotConnectedError text. A foreign key violation (DbError::SqlState with SqlState::FOREIGN_KEY_VIOLATION, on any of the three constraints) is UserMissing, 400 with "User id does not exist in 'LiteLLM_UserTable'. Fix this by creating user via `/user/new`." Every other insert failure is Insert, 500 with the database error's own text. B8599 decides how a route turns these into its answer through handle_exception_on_proxy; this module does not.


  The port. `InvitationLinks { store: PostgresStore, proxy_admin_name: String }` implements B4023's `betterlite_logging::key_invitation_email::link::InvitationCreator` with `type Error = InvitationError`. `create_for_user(user_id)` calls create_invitation_for_user with that user as both the invitee and the actor, since LiteLLM's Slack link builder passes `UserAPIKeyAuth(user_id=recipient_user_id)`, and returns `InvitationId(record.id)`. Binding it into B4023 at startup is B8891's step.


  Tests on real Postgres through betterlite-postgres-fixture's PostgresFixture with the baseline catalogs applied, as crates/betterlite-server/src/agent_rows/tests/support.rs does; insert the LiteLLM_UserTable rows each case needs. Names start with invitation_: the seven-day expiry and equal created_at and updated_at, the stored defaults (is_accepted false, accepted_at None, a parseable uuid id), the actor choice for Some(id), Some("") and None, no store, an unknown invitee, an unknown actor (the created_by constraint gives the same 400), another insert failure (a database without the table) as 500, and the port writing a row whose created_by and updated_by are the recipient and returning its id.
scope:
  paths:
    - crates/betterlite-server/src/user_invitation.rs
    - crates/betterlite-server/src/user_invitation/**
  lint_tables: false
