dod:
  - text: A created row expires seven days after its created_at, has created_at equal to updated_at, a uuid id, is_accepted false and no accepted_at, and the record returned is the stored row.
    proof: [invitation-tests]
  - text: created_by and updated_by are the caller's user id, or the proxy admin name when it is None or empty.
    proof: [invitation-tests]
  - text: No store is 400 with the DB not connected text, any foreign key violation is 400 with the /user/new text, and another insert failure is 500 with the database error text.
    proof: [invitation-tests]
  - text: InvitationLinks implements B4023's InvitationCreator, writing a row with the recipient as the actor and returning its id.
    proof: [invitation-tests]
checks:
  optional: []
  commands:
    - id: invitation-tests
      why: The invitation row, its actor, its errors or the InvitationCreator implementation differ from LiteLLM's helper.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_invitation::tests::(.*::)?invitation_/)'
oracle_cases: []
deviations:
  - what: A 500 from a failed insert carries the Postgres driver's error text, not Prisma's.
    why: betterlite talks to Postgres without Prisma, so Prisma's message does not exist. Status and the error key stay as LiteLLM has them.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/user_invitation.py#L41-L49
out_of_scope:
  - "POST /invitation/new, /invitation/info, /invitation/update and /invitation/delete, their access checks and handle_exception_on_proxy: B8599, which calls this helper and answers InvitationRecord."
  - "Mounting the invitation routes and their HTTP oracle cases: B8670. The helper writes the database and reads proxy_server globals, so it has no helper case."
  - "construct_user_invitation_link and the invitation email: B4023. Binding InvitationLinks into B4023 at startup: B8891."
  - "Deleting a user's invitation rows during /user/delete: B797."
pitfalls:
  - "All three of user_id, created_by and updated_by reference LiteLLM_UserTable, so an actor with no user row, the proxy admin name included, fails with the same /user/new 400 as an unknown invitee."
  - "Python's `user_id or litellm_proxy_admin_name` treats an empty string like None; Some(\"\") must fall back to \"default_user_id\"."
  - "Prisma made the id on the client; the column is TEXT NOT NULL without a default, so an insert that leaves id out fails with a not-null violation."
  - "Take now once: created_at, updated_at and the expiry all come from the same instant, and TIMESTAMP(3) keeps milliseconds, so compare the returned row, not the local value, in tests."
  - "LiteLLM matches the Prisma text \"Foreign key constraint failed on the field\"; the driver reports SQLSTATE 23503 instead, so match the code, not a message."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
