id: B966
title: Chat results and chunk records in Messages format
description: >-
  Implement every output/usage/chunk method in adapters/transformation.py L1345-L1766 in
  betterlite-core::api::messages_chat_output. B1117 supplies signature and compaction projections, B571 filters
  empty unsigned thinking and normalizes tool ids, B216 parses/repairs tool JSON, B963 extracts refusals, B968
  supplies PolyfillResult and B068 owns get_web_search_requests_from_usage/get_web_search_requests. Inject that
  last read-only usage accessor until B068 is implemented; never reconstruct cost calculation in the adapter.

  Content conversion visits every choice, but the final stop reason comes from the first choice. Usage picks
  the first positive integral candidate, excluding booleans, and subtracts cache read/write counts from prompt
  tokens with a floor at zero. Reuse parsed decimal numeric values instead of introducing floats. Stream
  chunk translation is a pure record operation here; B977 owns driving the live stream.

  HelperCall::MessagesChatOutput invokes the pinned methods with actual ModelResponse/StreamingChoices objects.
  Capture warning/error effects from B216 and use B198's deterministic UUID seam for missing tool ids. Preserve
  absent versus null fields and compare generated content, usage and terminal deltas. Tool arguments use B216's
  existing bounded decoder and fuzz corpus; these methods introduce no byte parser. Count 368 nonblank/non-comment
  lines; budget 305 implementation, 190 tests, 170 fixtures, 90 adapters and 35 wiring, 790 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/messages_chat_output.rs
  - crates/betterlite-core/src/api/messages_chat_output/**
