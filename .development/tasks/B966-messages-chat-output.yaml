  why: Own complete response content, finish-reason, usage precedence and polyfill aggregation methods.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L1618-L1766
  why: Own block selection and delta projection as complete methods; the iterator remains with B977.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L126-L153
  why: B068's direct callee reads server_tool_use from mapping or attribute shape without calculating a price.
dod:
- text: >-
    ordered_response_content emits per choice compaction blocks, thinking/redacted blocks, text, refusal text,
    then tool_use. Empty unsigned thinking drops; signed empty thinking remains; null thinking becomes "" and
    null signature remains null. Redacted null data becomes "". Nonempty thinking_blocks suppress reasoning_content
    fallback, even if all those blocks later drop; otherwise reasoning_content=why becomes thinking with signature=null.
    Empty text is emitted without compaction, but suppressed alongside compaction; null text is omitted.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    tool_output_recovery restores a mapped long function name and converts id=functions.Bash:0__thought__sig
    to functions_Bash_0. Nonstream signature comes only from provider_specific_fields.thought_signature, becoming
    provider_specific_fields.signature; the id suffix alone does not populate it. Missing id normalizes to tool_use_id.
    Arguments {"x":1} decode to an object; empty/null becomes {}; truncated {"x":1 repairs with a warning naming
    the tool and context="Anthropic pass-through adapter". Arguments={"x": nope} cannot be repaired and raise
    ValueError with no status/type/param/code; the diagnostic starts "Failed to parse tool call arguments",
    names the tool and context, and ends "Arguments: {\"x\": nope}".
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    finish_and_refusal_precedence maps stop,length,tool_calls,content_filter,refusal,unknown to
    end_turn,max_tokens,tool_use,refusal,refusal,end_turn. Refusal text forces refusal unless first finish=length.
    Exactly one compaction content block wins over all stop reasons. Empty choices yield content=[]/end_turn;
    missing or empty model becomes unknown-model. Preserve response.id, type=message, role=assistant,
    stop_sequence=null and stop_details=null unless refusal, which adds {type:refusal,category:null,explanation:text-or-null}.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    cache_creation_token_precedence selects cache_read_input_tokens then _cache_read_input_tokens then
    prompt_tokens_details.cached_tokens; cache creation selects cache_creation_input_tokens then
    _cache_creation_input_tokens then prompt_tokens_details.cache_creation_tokens then cache_write_tokens.
    Zero,negative,true,"3",1.5 are skipped; integral 3.0 counts as 3. With prompt_tokens=100,read=20,creation=30,
    completion_tokens=7, emit input_tokens=50,output_tokens=7 and both cache counters. Counts exceeding prompt
    tokens floor input_tokens at 0; absent/zero cache fields are omitted, not emitted as zero. Null token totals become 0.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    web_search_and_iterations takes positive server_tool_use.web_search_requests=2 before prompt detail count=9;
    zero/invalid server count falls back to positive detail count. Missing/nonpositive counts omit server_tool_use.
    Polyfill iterations=[] still adds a final {type:message,input_tokens:50,output_tokens:7} iteration; null iterations
    omits the field. Existing summary iterations precede that final record; polyfill compaction is inserted first,
    and nonempty applied_edits becomes context_management.applied_edits while an empty list is omitted.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    stream_block_selection prioritizes a first tool call with function over text/refusal, then nonempty text/refusal,
    then typed thinking blocks, then reasoning_content only when thinking_blocks is absent. Tool start has input={},
    missing name="", and missing id uses the injected UUID. id=t__thought__sig yields id=t and signature=sig.
    Empty choices return an empty text block; a present empty thinking_blocks attribute suppresses reasoning fallback.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    stream_delta_precedence combines tool arguments within a choice into input_json_delta, choosing that over
    signatures, then thinking, then text plus refusal. A later choice's tool_calls resets accumulated partial_json;
    tool calls with no arguments still emit partial_json="". Thinking and signature together produce signature_delta
    only, leaving splitting to B975. Texts a,b and refusals x,y become text_delta text=abxy. Nonstring thinking
    or signature fails with a typed validation error corresponding to the pinned assertion, never a Rust panic.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    terminal_chunk_projection uses finish_reason=stop to emit message_delta with stop_reason=end_turn and usage
    from response.usage first, then _hidden_params.usage, then input_tokens=0/output_tokens=0. Truthy applied_edits
    is attached only to the terminal record. Nonterminal input with index=4 emits content_block_delta index=4.
    A direct zero-choice call fails as an internal error matching the source IndexError; B977 handles choiceless
    usage before calling it, so do not synthesize a terminal delta here.
  proof: [behavior-tests, oracle, helper-python]
- text: The result helper and new fixtures compare all projections independently, including generated-id normalization.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: output content, usage or terminal chunk rules lack tests beside production code
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_output::/)'
  - id: helper-python
    why: output comparison cannot run typed pinned response methods
    run: test -f tools/oracle/helpers/messages_chat_output.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: result projection has no helper decoder coverage
    run: grep -qE '^[[:space:]]+messages_chat_output:' tools/oracle/fuzz/corpus/helper_case/messages_chat_output-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no new result or chunk cases exist
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-chat-output)"
