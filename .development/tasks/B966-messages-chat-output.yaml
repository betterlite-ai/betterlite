id: B966
title: Messages chat output
description: >-
  Translate chat content, stop reasons, token/cache/web-search usage and streamed deltas into native Anthropic records.
  Separate usage-delta conversion from whole-response construction and retain source positive-value fallback ordering.


  Implement crates/betterlite-core/src/api/messages_chat_output.rs. Use MessagesChatOutputInput and MessagesChatOutputResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions tool_use_stop_reason, cache_creation_token_prec_7df2, reasoning_signature_output,
  web_search_count, refusal_content, stream_tool_input_delta under api::messages_chat_output::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesChatOutput in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_chat_output: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_openai_content_to_anthropic
  (L1345-L1430); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_openai_finish_reason_to_anthropic
  (L1432-L1441); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._positive_int
  (L1444-L1451); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._first_positive_usage_value
  (L1454-L1459); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._first_positive_prompt_tokens_detail_value
  (L1462-L1474); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._get_cache_read_input_tokens
  (L1477-L1481); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._get_cache_creation_input_tokens
  (L1484-L1490); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._get_web_search_request_count
  (L1493-L1501); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_openai_usage_to_anthropic_usage_delta
  (L1504-L1526); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_openai_usage_to_anthropic_usage
  (L1529-L1533); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_openai_response_to_anthropic
  (L1535-L1616); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_streaming_openai_chunk_to_anthropic_content_block
  (L1618-L1676); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_streaming_openai_chunk_to_anthropic
  (L1678-L1727); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_streaming_openai_response_to_anthropic
  (L1729-L1766). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 359 owned nonblank/non-comment/non-docstring Python lines (368 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 379 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 647 total within the 650-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B171 (Direct helper oracle and URL path
  encoding), B958 (Messages errors), B1087 (Api boundaries), B1117 (Messages content primitives), B963 (Messages
  options). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.
