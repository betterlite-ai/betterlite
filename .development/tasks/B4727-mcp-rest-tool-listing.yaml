dod:
  - text: >-
      _create_tool_response_objects creates a list of tool response objects enriched with
      server_id and alias from the MCPServer record.
    proof: [tool-listing-tests]
  - text: >-
      _list_server_tools fetches raw tools from a single upstream server without applying
      allowed_tools/disallowed_tools filter or per-key tool permissions.
    proof: [tool-listing-tests]
  - text: >-
      _get_tools_for_single_server optionally applies allowed_tools/disallowed_tools and
      per-key tool permissions; admin-only apply_tool_filters=false skips both gates.
    proof: [tool-listing-tests]
  - text: >-
      fetch_pinnable_tool_catalog removes existing pins and overrides, fetches upstream
      tools, scans the served description view, and returns only surviving tools with original
      upstream descriptions and schemas.
    proof: [tool-listing-tests, tool-listing-oracle]
  - text: >-
      _list_tools_for_single_server resolves server_id from UUID/name/alias within allowed
      set, reports distinct missing-server/denied/IP-filtered errors, and returns error dict
      on upstream exception.
    proof: [tool-listing-tests]
  - text: >-
      Single-server requests relay truthful HTTP status (502/504 for upstream faults, 403 for
      access/IP denied); a missing server in the allowed set returns the 200 error-dict shape
      matching LiteLLM. Multi-server aggregate uses legacy error-dict shape.
    proof: [tool-listing-tests, tool-listing-oracle]
  - text: >-
      Partial aggregates only report partial_failure when errors occur and no tools survive;
      per-server outcomes preserve individual server results.
    proof: [tool-listing-tests, tool-listing-oracle]
  - text: >-
      GET /mcp-rest/tools/list accepts server_id, mcp_server_name, toolset_name and admin-only
      include_disabled_tools filters; rejects virtual-tool clients, resolves effective auth on
      toolset.
    proof: [tool-listing-tests, tool-listing-oracle]
  - text: >-
      OAuth credential prefetch only occurs when at least one allowed server uses OAuth2 v1
      resolution.
    proof: [tool-listing-tests]
  - text: >-
      Every default, header, config key, error status/type/message and HTTP status code a
      user can observe is in a named case with literal input and outcome.
    proof: [tool-listing-tests, tool-listing-oracle]
  - text: Every mutant in tool listing/filtering logic is caught by a test.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: tool-listing-tests
      why: >-
        Tool response enrichment, allowed_tools/per-key filtering, single-server resolution,
        IP filtering, error handling, partial failure detection or aggregate response shape
        is missing or fails on edge cases.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^api::mcp_rest_tools::/)'
    - id: tool-listing-oracle
      why: >-
        Tool listing responses, HTTP statuses, error shapes or per-server outcome tracking
        deviate from LiteLLM behavior.
      run: >-
        cargo run --locked -p betterlite-oracle -- --self-check
        tools/oracle/cases/helpers/mcp-rest-tools

oracle_cases: []

deviations:
  - what: Single-server 502/504 upstream faults relay their truthful HTTP status instead of wrapped in error dict.
    why: Single-server requests require truthful status so clients can retry or handle upstream outages; only the multi-server aggregate uses legacy error-dict compatibility.
  - what: IP filtering reports 403 with "ip_filtering" error tag and server IP restriction message.
    why: Clients need distinct IP filtering errors to offer guidance about available_on_public_internet configuration.

out_of_scope:
  - Manager _get_tools_from_server, ID/name lookup and server resolution functions (part of Q2 manager leaves).
  - filter_server_ids_by_ip_with_info, filter_tools_by_allowed_tools, filter_tools_by_key_team_permissions (Q2 manager).
  - scan_tool_descriptions, apply_description_overrides, get_server_prefix (Q4 catalog/OpenAPI leaves).
  - classify_list_exception, list_fault_http_status, outcome_wire_value, _aggregate_server_key (Q4 catalog/OpenAPI).
  - MCPUpstreamAuthError.to_http_exception, get_request_base_url (Q4 catalog/OpenAPI).
  - reject_disallowed_mcp_client, get_virtual_tool_definitions, build_effective_auth_contexts (Q6 shared proxy/auth).
  - MCPRequestHandler header extraction methods (part of B4726).
  - Authentication, authorization and role checks (Q6 shared proxy/auth).

pitfalls:
  - Admin-only include_disabled_tools must check user_api_key_has_admin_view to prevent non-admins from bypassing filters.
  - Single-server requests (server_id set) must relay the truthful HTTP exception status; the multi-server aggregate uses error-dict compatibility only when server_id is None.
  - Partial failure reports partial_failure only when errors occur AND no tools survive; a successful fetch from one server with failures on others keeps error=None.
  - OAuth credential prefetch checks _v1_resolved_oauth2_server_ids to avoid unnecessary DB round-trips on requests without OAuth2 MCP servers.
  - IP filtering must check before allowed-server resolution and report with the distinct "ip_filtering" error tag.
  - The pinning fetch must remove existing pins and overrides before fetching the upstream catalog so the scan operates on the live description view.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
