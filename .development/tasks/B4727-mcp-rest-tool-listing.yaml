id: B4727
title: MCP REST tool listing and pinnable catalog fetching
description: >-
  Build GET `/mcp-rest/tools/list` REST endpoint and the shared upstream catalog fetch used by
  management pinning. The endpoint lists tools from accessible MCP servers with per-key team and
  allowlist filtering, supports admin-only unfiltered catalog viewing, and handles partial failures
  when upstream requests reach some servers but not others.

  `_create_tool_response_objects` enriches tool responses with server_id and alias so REST clients
  can map internal server_name to user-facing alias without needing access to the mcp_routes-gated
  server listing.

  `_list_server_tools` fetches the raw tool list from a single upstream server without applying
  filters; `_get_tools_for_single_server` wraps it with optional allowed_tools/disallowed_tools
  filtering and per-key tool permissions. The admin-only configuration view skips both; every
  runtime path applies both gates so callable tools stay filtered.

  `fetch_pinnable_tool_catalog` prepares a server's tool catalog for admin pinning by removing
  existing pins and overrides before fetching, scanning the live description view, and returning
  only tools that survive the scan. Pinned tools record original upstream descriptions/schemas.

  `_list_tools_for_single_server` handles single-server requests: resolves server_id from UUID/name/
  alias within allowed_server_ids, checks IP filtering when appropriate (distinct missing-server,
  denied-server and IP-filtered errors), fetches tools, and returns an error dict on exception.

  The main `list_tool_rest_api` endpoint accepts server_id, mcp_server_name or toolset_name filters.
  When no filter is specified it returns an aggregate listing from all allowed servers, reporting
  `partial_failure` only when errors occur and no tools survive; per-server outcomes track results
  for visibility. Single-server requests relay the truthful HTTP status (502/504 upstream faults
  must not masquerade as 200 with an error dict). The endpoint rejects virtual-tool clients in
  non-search contexts, supports admin-only include_disabled_tools to bypass filters, and resolves
  effective auth when a toolset name is given.

