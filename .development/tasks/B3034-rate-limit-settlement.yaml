deviations:
  - what: >-
      Refund failures are logged as WARNING (not ERROR) when the original rejection already decided
      the request outcome; the caller will not retry based on a failed refund since the OVER_LIMIT
      or fallback response takes precedence.
    why: A refund is best-effort cleanup; the caller cares about the admission decision, not refund success.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L2347-L2353
  - what: >-
      In-memory fallback on Lua failure uses the same _atomic_check_and_increment_in_memory implementation
      that replaces all descriptor processing, not a partial retry. This avoids ambiguity about which
      counters incremented in Redis before the failure.
    why: Window and counter state in Redis becomes ambiguous after a Lua timeout/OOM; restarting all descriptors
      in-memory ensures consistency.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L2181-L2207

out_of_scope:
  - atomic_check_and_increment_by_n dispatch to _atomic_check_and_increment_in_memory and its logic belong to B3033 (in-memory fallback path).
  - Window storage, Redis slot grouping, and cache read/write operations belong to B3032.
  - Descriptor atomic payload construction and Lua response decoding belong to B3033.
  - Token counter adjustment scripts and token increment operations belong to B3037.
  - Fail-closed rate-limit enforcement decision logic (RateLimitUnverifiableError) belongs to B3031.
  - Redis script registration and the check_and_increment_by_n_script object belong to B3055 (handler construction).
  - Provider resolution and rate-limit error wrapping belong to B3030.
  - Cache transport (async_get_cache, async_set_cache) and batch-result settlement callbacks await external ownership.

pitfalls:
  - Counter indices from Lua are 1-based; per_counter_meta arrays are 0-based; subtract 1 when indexing into metadata.
  - Window identity (window_key, counter_key, window_start) must be extracted consistently from Lua replies; window_start is serialized as string in responses.
  - Refund extraction from batch values uses stride-2 iteration over keys (window_key, counter_key) and values (window_start, ...); ensure pair indices align.
  - Pipelined batch gathering captures exceptions per group; a single group's exception does not prevent other groups from being read.
  - The fail-closed helper _reject_if_rate_limit_unverifiable raises a 503 error and should only be called after best-effort refunds complete.
  - Refund script calls must include both window_key and counter_key even though the script uses only one; window_key identifies the window identity for consistency.
  - Best-effort refunds must not raise; failures are logged and the original rejection response stands.

