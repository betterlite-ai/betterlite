dod:
  - text: atomic_check_and_increment_by_n validates descriptors/increments lengths match and filters empty groups before dispatch.
    proof: [entry-point-validation-tests]
  - text: atomic_check_and_increment_by_n dispatches to _atomic_lua_per_descriptor when check_and_increment_by_n_script is present, else locks and calls _atomic_check_and_increment_in_memory.
    proof: [script-dispatch-tests]
  - text: _atomic_lua_per_descriptor calls _pipeline_scripts to batch all descriptor payloads and attempts pipelined settlement if all results are present.
    proof: [pipelined-settlement-tests]
  - text: _atomic_lua_per_descriptor loops sequentially on pipelined failure, executing one Lua call per descriptor and tracking applied refunds.
    proof: [sequential-loop-tests]
  - text: _atomic_lua_per_descriptor refunds all applied groups on OVER_LIMIT (second+ descriptor) and returns the over-limit response without further increments.
    proof: [rollback-on-over-limit-tests]
  - text: _atomic_lua_per_descriptor refunds all applied groups on Lua exception, logs the failure with script name and applied count, calls fail-closed helper, and falls back to in-memory enforcement.
    proof: [rollback-on-exception-tests]
  - text: _atomic_lua_per_descriptor returns early for single-descriptor success without waiting for remaining loop iterations.
    proof: [single-descriptor-optimization-tests]
  - text: _settle_pipelined_descriptor_groups gathers all batch results with asyncio.gather return_exceptions=True and builds per-group responses.
    proof: [pipelined-gather-tests]
  - text: _settle_pipelined_descriptor_groups refunds all applied groups if any group returns OVER_LIMIT and returns that over-limit response.
    proof: [pipelined-rollback-over-limit-tests]
  - text: _settle_pipelined_descriptor_groups refunds all applied groups if any group raises an exception, logs the failure, calls fail-closed helper, and falls back to in-memory.
    proof: [pipelined-rollback-exception-tests]
  - text: _settle_pipelined_descriptor_groups returns single successful response for len(responses)==1 and aggregated OK for multiple.
    proof: [pipelined-response-aggregation-tests]
  - text: _pipelined_group_response converts BaseException replies to the exception itself and catches decode failures from _build_atomic_response.
    proof: [group-response-exception-tests]
  - text: _counter_refunds_from_atomic_response extracts (window_key, counter_key, window_start, increment) tuples from Lua raw values with 2*index stride.
    proof: [refund-extraction-tests]
  - text: _counter_refunds_from_batch_values builds refunds from alternating window_key/counter_key pairs and window_start values, filtering None.
    proof: [batch-refund-extraction-tests]
  - text: _refund_counter_increments iterates refunds and calls window_guarded_token_increment_script with negative increment and window_start.
    proof: [refund-script-call-tests]
  - text: _refund_counter_increments logs failures without raising when a refund script call fails (best-effort behavior).
    proof: [refund-failure-logging-tests]
  - text: Every default, failure mode, refund strategy, and window identity a user can observe is in a named oracle case with input and outcome.
    proof: [oracle-cases-tests]

