id: B3034
title: Rate-limit descriptor settlement and rollback
description: >-
  Build cross-descriptor settlement and atomicity-preserving rollback for rate-limit counter increments.
  Implement two execution paths: sequential (one Lua call per descriptor on a loop, refunding prior descriptors
  on OVER_LIMIT or script failure) and pipelined (all descriptors in one batch, refunding all applied
  descriptors if any fails or returns OVER_LIMIT). Preserve window identity checks, fail-closed behavior,
  and best-effort refunds using the WINDOW_GUARDED_TOKEN_INCREMENT_SCRIPT from B3037.

  atomic_check_and_increment_by_n is the entry point, dispatching to either _atomic_lua_per_descriptor
  (two paths: sequential loop with early stop, pipelined gather with rollback) or in-memory fallback
  when Redis is unavailable. On OVER_LIMIT from any descriptor, all applied increments are refunded
  (subtracted) so Redis returns to pre-call state. Lua failures mid-loop trigger best-effort refunds,
  then fall back to in-memory enforcement with locked critical section across all descriptors.

  _counter_refunds_from_atomic_response extracts window_start and increment amounts from successful
  Lua replies for later refund operations. _counter_refunds_from_batch_values builds refunds from
  pipelined batch replies for descriptors that incremented before any rejection. _refund_counter_increments
  applies each refund by calling the window-guarded decrement script, accepting failures (logged as
  warnings) since the rejection decision already stands. _pipelined_group_response handles individual
  group replies (success, exception, decode failure) from batch gather; a group's exception is its own
  failure on that descriptor only.

  Depends on B3031 for _as_counter_values (reply converter), _reject_if_rate_limit_unverifiable (fail-closed
  helper), and TypedDicts (RateLimitResponse, RateLimitStatus, CounterRefund, AtomicCounterMeta);
  B3032 for _pipeline_scripts (batch executor); B3033 for _build_descriptor_atomic_payload, _build_atomic_response,
  _atomic_check_and_increment_in_memory; B3037 for WINDOW_GUARDED_TOKEN_INCREMENT_SCRIPT (token decrement
  on refund); B393 for log_redis_failure.

