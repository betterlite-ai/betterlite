  - url: https://www.rfc-editor.org/rfc/rfc8414
    why: Authorization server metadata.
  - url: https://www.rfc-editor.org/rfc/rfc7009
    why: Token revocation, always 200 for a known client.

dod:
  - text: The authorization server document has LiteLLM's keys in order, with named and root forms for the endpoints and the three issuer forms, and the bare path is not registered here.
    proof: [root-tests, oracle]
  - text: openid_configuration adds jwks_uri and the signing algs only with a signer, and jwks_json returns the key set with max-age from the signer or the empty set with max-age 60.
    proof: [root-tests, oracle]
  - text: POST /token sends gateway client ids without a path name to aggregate_token and everything else to the exchange flow, with 404 when no server is found.
    proof: [root-tests]
  - text: /revoke and /introspect call B4676's functions and /introspect requires the virtual key first.
    proof: [root-tests, oracle]
  - text: OauthFlowsImpl forwards each port method to the flow module that owns it, with no logic of its own.
    proof: [root-tests]

checks:
  optional: []
  commands:
    - id: root-tests
      why: the discovery, JWKS, token routes or the flows wiring have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_root::/)'

oracle_cases:
  - tools/oracle/cases/http/mcp-oauth-root/discovery-named-server.yaml
  - tools/oracle/cases/http/mcp-oauth-root/discovery-standard-and-legacy-paths.yaml
  - tools/oracle/cases/http/mcp-oauth-root/discovery-unknown-server.yaml
  - tools/oracle/cases/http/mcp-oauth-root/openid-configuration-no-signer.yaml
  - tools/oracle/cases/http/mcp-oauth-root/jwks-empty.yaml
  - tools/oracle/cases/http/mcp-oauth-root/token-missing-field.yaml
  - tools/oracle/cases/http/mcp-oauth-root/token-unknown-server.yaml
  - tools/oracle/cases/http/mcp-oauth-root/revoke-unknown-client.yaml
  - tools/oracle/cases/http/mcp-oauth-root/introspect-no-key.yaml

deviations: []

out_of_scope:
  - "State and sealed codes: B7530. DCR and register flows: B7531. Authorize and token exchange flows: B7532. The OauthFlows trait and the /v1/mcp/server/oauth routes: B4719."
  - "Gateway token logic (aggregate_token, revoke_refresh_token, introspect_gateway_token): B4676. The bare /.well-known/oauth-authorization-server route: B4678."
  - "The faults package behind FaultRenderer: B7970. The /callback, /authorize, POST /register, /authorize/flow and /authorize/complete routes: B7971. The protected resource routes, fetch_upstream_oauth_protected_resource and the aggregate authorization server route: B7972."

pitfalls:
  - A duplicate route panics axum at startup, so check the router builds with every task's routes merged.
  - The issuer uses the path name only when the request had one; a name resolved from the single server keeps the bare base issuer.
  - jwks_json returns 200 with an empty key set when no signer exists, never 404.
  - openid_configuration appends its two keys after the document keys, it does not sort.
  - /introspect checks the key before reading the form, so a request with no key and no form is 401, not 422.
  - Success bodies from the flows keep the no-cache headers; a route must not replace the header map.

review_level: security

budget:
  max_changed_lines: 1100
  max_new_expects: 0
