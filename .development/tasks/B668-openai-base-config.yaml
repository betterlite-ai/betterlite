pitfalls:
- 'The oracle helper for this task is pre-registered as openai_base_config in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/base_config.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_base_config.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The catalog predicate splits on the first responses/ occurrence anywhere in the name, whereas the o-series predicate
  splits on the last slash.
- OpenAIUnknownModelConfig selection uses type(self) is OpenAIConfig, so inheritance alone must not grant reasoning_effort.
- Authorization merging is case-sensitive at this Python seam; normalizing header names before applying the caller
  overlay changes the oracle result.
- Metadata filtering happens before the 16-key cutoff, so hidden_params and non-string values must not consume slots.
