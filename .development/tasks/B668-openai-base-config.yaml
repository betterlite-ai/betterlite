    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_base_config_cases::case_[0-9]+_catalog_user_only$/)'
  - id: case-old-gpt-response-format-drop
    why: The old-gpt-response-format-drop behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_base_config_cases::case_[0-9]+_old_gpt_response_format_drop$/)'
  - id: case-unknown-reasoning-effort
    why: The unknown-reasoning-effort behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_base_config_cases::case_[0-9]+_unknown_reasoning_effort$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_base_config.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_base_config*")"
      && grep -lq 'openai_base_config' tools/oracle/fuzz/corpus/helper_case/openai_base_config* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_base_config$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_base_config)"
      && grep -q 'decode_base_chat_response' crates/betterlite-openai/fuzz/fuzz_targets/openai_base_config.rs &&
      cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_base_config_corpus$/)'
