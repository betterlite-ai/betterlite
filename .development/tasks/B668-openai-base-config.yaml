id: B668
title: OpenAI base chat parameter policy
description: >-
  Build the shared OpenAIConfig and OpenAIGPTConfig base parameter policy in betterlite-openai before chat callers
  and model-specific policy extensions. Supply the base allowlist and pure model-family tag selector; model-family
  transforms remain injected callers, avoiding a dependency from this base policy back to B502 or B504.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/chat/gpt_5_transformation.py:
  AzureOpenAIGPT5Config.is_model_gpt_5_model L37-L39. litellm/llms/openai/openai.py: OpenAIConfig.__init__ L154-L172;
  OpenAIConfig.get_config L175-L176; OpenAIConfig.get_supported_openai_params L178-L200; OpenAIConfig._gpt_config_for_model
  L202-L205; OpenAIConfig._map_openai_params L207-L212; OpenAIConfig._transform_messages L214-L215; OpenAIConfig.map_openai_params
  L217-L252; OpenAIConfig.get_error_class L254-L259; OpenAIConfig.transform_request L261-L270; OpenAIConfig.transform_response
  L272-L298; OpenAIConfig.validate_environment L300-L313; OpenAIConfig.get_model_response_iterator L315-L325; OpenAIChatCompletionResponseIterator.chunk_parser
  L329-L336. litellm/llms/openai/chat/gpt_transformation.py: OpenAIGPTConfig.__init__ L118-L137; OpenAIGPTConfig.get_config
  L140-L141; OpenAIGPTConfig.get_supported_openai_params L143-L185; OpenAIGPTConfig.is_openai_catalog_model L188-L193;
  OpenAIGPTConfig._map_openai_params L195-L217; OpenAIGPTConfig.map_openai_params L219-L231; OpenAIUnknownModelConfig.get_supported_openai_params
  L833-L834. litellm/llms/openai/common_utils.py: OpenAIError.__init__ L57-L84. litellm/utils.py: add_openai_metadata
  L10292-L10324; _add_path_to_api_base L10197-L10232. litellm/llms/openai/chat/gpt_audio_transformation.py: OpenAIGPTAudioConfig.is_model_gpt_audio_model
  L33-L36. litellm/llms/openai/chat/o_series_transformation.py: OpenAIOSeriesConfig.is_model_o_series_model L117-L124.
  litellm/llms/openai/chat/gpt_5_transformation.py: is_gpt_reasoning_series_name L70-L72; OpenAIGPT5Config.is_model_gpt_5_model
  L86-L87.


  Callers include utils.py:4956-4961, o_series_transformation.py:52, gpt_5_transformation.py:232 and gpt_audio_transformation.py:29.
  Keep user only for catalog models, omit response_format for gpt-4 and gpt-3.5-turbo-16k, and let the unknown-model
  policy add reasoning_effort in this base task; base selection returns an enum, never invokes the dependent family
  mapper.


  Take catalog membership and feature flags as an injected small capability record, so this foundational policy
  does not depend on B193 or B004. Concrete catalog loading remains B193. Create betterlite-openai with minimal
  request/response DTO dependencies here; B004 later adds chat execution. The base forwarding hooks accept prepared
  typed inputs and caller-supplied projections rather than importing their later implementations.


  Named case contracts: o_series_routing: Strip the last provider prefix, require length > 1, o followed by a digit
  and membership in open_ai_chat_completion_models; unknown o-shaped names fall through. gpt5_routing: Match gpt-5
  or gpt-6 anywhere in the model, excluding gpt-5-chat in the final slash-delimited component; compare prefixed
  and unknown catalog names. audio_routing: Require the original complete model name in the chat catalog and the
  substring audio; do not strip provider prefixes for this predicate. catalog_user_only: Only chat/text catalog
  members receive user, including names containing responses/ whose suffix is checked. unknown_reasoning_effort:
  Only exact OpenAIConfig selects OpenAIUnknownModelConfig for noncatalog models and adds reasoning_effort; AzureAIStudioConfig
  and other subclasses retain the GPT allowlist. base_parameter_allowlist: Preserve frequency_penalty, logit_bias,
  logprobs, top_logprobs, max_tokens, max_completion_tokens, modalities, prediction, n, presence_penalty, seed,
  stop, stream, stream_options, temperature, top_p, tools, tool_choice, function_call, functions, max_retries, extra_headers,
  parallel_tool_calls, audio, web_search_options, service_tier, safety_identifier, prompt_cache_key, prompt_cache_retention
  and store; unsupported keys are omitted while existing optional_params survive. base_auth_override: Authorization
  defaults to Bearer {api_key}, including Bearer None; caller headers override that exact key. base_projection_forwarding:
  Before JSON conversion, call injected PostCallSink with raw response text and set the logging response_headers
  to raw headers; then call ChatResponseProjection with the decoded response, response headers and hidden_params.headers.
  Verify ordering even when JSON conversion fails. Stream conversion uses the injected typed stream projection;
  projected errors propagate. base_request_overlay: Optional parameters overlay model/messages in the outgoing body;
  the base message hook is identity and non-None constructor settings survive get_config. openai_error_defaults:
  OpenAIError retains status, headers and body; absent request is POST https://api.openai.com/v1 and absent response
  uses the supplied status and that request. metadata_filter_limit: None stays None; retain only string-valued entries,
  stringify keys, omit hidden_params and retain the first 16 surviving entries in insertion order; return an independent
  map, including empty input. overlapping_api_base_path: Parse api_base as httpx.URL, split nonempty base and ending
  path segments, select the first suffix/prefix overlap, and combine them with exactly one leading slash; no overlap
  appends all segments. Preserve the original query entries/order and fragment after path rewriting. This is a shared
  primitive used by Azure URL helpers and other providers; it does not append or recognize /v1 on its own. azure_gpt5_route_predicate:
  Azure GPT-5 selection accepts the shared is_gpt_reasoning_series_name result or the substring gpt5_series anywhere
  in the model, without catalog membership. Preserve case sensitivity; this predicate is reused by B2230 and B532.


  Write standalone Rust test openai_base_config_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_base_config_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Shared provider base helper implementations are B2202: use its owned primitives directly when called by these
  ranges. Do not reintroduce a dependency on B010/B016 for these small helpers.


  PostCallSink is the base forwarding interface supplied by B249 at composition. The test sink records text and
  response headers without importing B249 into this lower task, just as ChatResponseProjection is supplied by B004.
  B004 owns decoding; invoking the projection must occur after the post-call effect.


  Implement crates/betterlite-openai/src/openai_base_config.rs with adjacent tests under openai_base_config/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_base_config_cases in betterlite-openai with these exact named cases (one per oracle
  file): o_series_routing, gpt5_routing, audio_routing, catalog_user_only, old_gpt_response_format_drop, unknown_reasoning_effort,
  base_parameter_allowlist, base_auth_override, base_projection_forwarding, base_request_overlay, openai_error_defaults,
  metadata_filter_limit, overlapping_api_base_path, azure_gpt5_route_predicate. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_base_config* using HelperCase: kind: helper
  and the externally tagged openai_base_config variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_base_config that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Inject a ChatResponseProjection callback accepting the already decoded response record, response headers and hidden_params.headers;
  B004 supplies convert_to_model_response_object and its decoder. Inject typed stream record projection for ModelResponseStream;
  B005 supplies stream decoding. Base forwarding never decodes bytes and adds no provider fuzz target. B171 owns
  the shared HelperCase parser.


  Budget from 366 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 315 production lines, 290 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 765 planned, 775 maximum changed lines.
scope:
  paths:
  - crates/betterlite-openai/src/lib.rs
  - crates/betterlite-openai/Cargo.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/openai/base_config.rs
  - tools/oracle/src/helpers/openai/base_config/**
  - tools/oracle/helpers/openai_base_config.py
  - tools/oracle/helpers/openai_base_config/**
  - tools/oracle/cases/helpers/providers/openai-base-config/**
  - tools/oracle/fuzz/corpus/helper_case/openai_base_config*
  - Cargo.toml
  - crates/betterlite-openai/src/error.rs
  - crates/betterlite-openai/src/openai_base_config.rs
  - crates/betterlite-openai/src/openai_base_config/**
  lint_tables: false
