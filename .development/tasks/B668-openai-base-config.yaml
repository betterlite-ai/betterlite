id: B668
title: OpenAI base chat parameter policy
description: >-
  Build the shared OpenAIConfig and OpenAIGPTConfig base parameter policy in betterlite-openai before chat callers
  and model-specific policy extensions. Supply the base allowlist and pure model-family tag selector; model-family
  transforms remain injected callers, avoiding a dependency from this base policy back to B502 or B504.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/openai.py: OpenAIConfig.__init__
  L154-L172; OpenAIConfig.get_config L175-L176; OpenAIConfig.get_supported_openai_params L178-L200; OpenAIConfig._gpt_config_for_model
  L202-L205; OpenAIConfig._map_openai_params L207-L212; OpenAIConfig._transform_messages L214-L215; OpenAIConfig.map_openai_params
  L217-L252; OpenAIConfig.get_error_class L254-L259; OpenAIConfig.transform_request L261-L270; OpenAIConfig.transform_response
  L272-L298; OpenAIConfig.validate_environment L300-L313; OpenAIConfig.get_model_response_iterator L315-L325; OpenAIChatCompletionResponseIterator.chunk_parser
  L329-L336. litellm/llms/openai/chat/gpt_transformation.py: OpenAIGPTConfig.__init__ L118-L137; OpenAIGPTConfig.get_config
  L140-L141; OpenAIGPTConfig.get_supported_openai_params L143-L185; OpenAIGPTConfig.is_openai_catalog_model L188-L193;
  OpenAIGPTConfig._map_openai_params L195-L217; OpenAIGPTConfig.map_openai_params L219-L231; OpenAIUnknownModelConfig.get_supported_openai_params
  L833-L834. litellm/llms/openai/common_utils.py: OpenAIError.__init__ L57-L84.


  Callers include utils.py:4956-4961, o_series_transformation.py:52, gpt_5_transformation.py:232 and gpt_audio_transformation.py:29.
  Keep user only for catalog models, omit response_format for gpt-4 and gpt-3.5-turbo-16k, and let the unknown-model
  policy add reasoning_effort in this base task; base selection returns an enum, never invokes the dependent family
  mapper.


  Take catalog membership and feature flags as an injected small capability record, so this foundational policy
  does not depend on B193 or B004. Concrete catalog loading remains B193. Create betterlite-openai with minimal
  request/response DTO dependencies here; B004 later adds chat execution. The base forwarding hooks accept prepared
  typed inputs and caller-supplied projections rather than importing their later implementations.


  Implement crates/betterlite-openai/src/openai_base_config.rs with adjacent tests under openai_base_config/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_base_config in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_base_config_cases in betterlite-openai with these exact named cases (one per oracle
  file): o_series_routing, gpt5_routing, audio_routing, unknown_model_routing, catalog_user_only, old_gpt_response_format_drop,
  unknown_reasoning_effort. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream
  request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_base_config* using HelperCase: kind: helper
  and the externally tagged openai_base_config variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_base_config that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_base_chat_response consumes base OpenAIConfig raw response JSON bytes in crates/betterlite-openai/src/openai_base_config.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_base_config.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_base_config.
  The adjacent test replays_the_openai_base_config_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 295 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 315 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 601 planned, 625 maximum changed lines.
