id: B548
title: Azure native passthrough preparation and logging
description: >-
  Add AzurePassthroughPlan and typed response/stream logging projection for configured native paths. Preserve model-router
  body-model inference, foreign deployment handling and api-version removal rules. B101/B103 own route registration
  and raw forwarding; this leaf plan never authorizes an arbitrary caller URL.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/passthrough/transformation.py:
  _relayed_messages L38-L43; logged_responses_stream L55-L63; is_azure_body_model_inference_endpoint L72-L76; azure_router_model_in_endpoint
  L79-L83; foreign_azure_deployment L86-L96; without_api_version L99-L102; AzurePassthroughConfig.is_streaming_request
  L106-L107; AzurePassthroughConfig.get_complete_url L109-L140; AzurePassthroughConfig.validate_environment L142-L155;
  AzurePassthroughConfig.get_api_base L158-L161; AzurePassthroughConfig.get_api_key L164-L167; AzurePassthroughConfig.get_base_model
  L170-L171; AzurePassthroughConfig.get_models L173-L174; AzurePassthroughConfig.logging_non_streaming_response
  L176-L207; AzurePassthroughConfig.handle_logging_collected_chunks L209-L231.


  B101 owns RelayShape, logged_relay_shape, replace_path_segment and strip_leading_model_segment; B103 owns OpenAIPassthroughLoggingHandler._build_complete_streaming_response.


  Reuse OpenAIResponsesAPIConfig.parse_terminal_event_from_stream_chunks from B508 (litellm/llms/openai/responses/transformation.py);
  its implementation remains with that prerequisite.


  Reuse BaseAzureLLM._base_validate_azure_environment from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse BaseAzureLLM._get_base_azure_url from B2200 (litellm/llms/azure/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse OpenAIGPTConfig.__init__ from B668 (litellm/llms/openai/chat/gpt_transformation.py); its implementation
  remains with that prerequisite.


  Named case contracts: body_model_inference_endpoint: Reject any endpoint containing a path-segment openai/deployments/<nonempty
  segment>; otherwise strip slashes and accept exact or slash-suffixed responses,chat/completions,completions,embeddings,images/generations,audio/speech.
  is_streaming_request uses bool(request_data.stream), not a strict boolean check. router_model_in_path: Split endpoint
  on / and return the first part exactly matching router_models only when at least two parts exist; no case folding
  for router matching. foreign_deployment: Extract the first deployment path segment; exact model_group match is
  local, otherwise compare served_models case-insensitively using Python casefold. Return an unknown deployment
  verbatim; no callback is needed when no deployment or exact group match. api_version_removal: Resolve base from
  explicit or AZURE_API_BASE only, else Exception Azure api base not found. Use B101 replacement of model_group
  path segments and strip leading actual model. A truthy request-query api-version removes every exact api-version
  from configured base, then overrides params version; empty caller version leaves existing base version. B2200
  builds the final URL; return it plus original resolved base. responses_stream_log: For slash-normalized endpoint
  ending the Responses relay suffix, B508 parses terminal events; only a found terminal changes logging.call_type
  to the Responses relay call type and returns the whole terminal event. Other non-chat streams return None. messages_relay_log:
  Chat stream logging delegates B103 _build_complete_streaming_response; supply relayed request messages only when
  RelayedCallDetails validation succeeds and request_data exists, otherwise None. nonstream_usage: For endpoint
  containing chat/completions use B668 chat response projection with user content no-message-pass-through-endpoint,
  blank api_key and empty optional/litellm params; otherwise call B101 logged_relay_shape(OPENAI_RELAY_SHAPES).
  passthrough_auth_inputs: get_api_key is explicit or AZURE_API_KEY only; get_base_model is identity and get_models
  delegates to the inherited model-info owner. Validation overwrites params.api_key with the positional value even
  when None, then delegates B2200, so its global fallback may apply.


  Write standalone Rust test azure_passthrough_credential_identity_isolation in betterlite-azure: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test azure_passthrough_secret_safe_failure in betterlite-azure: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-azure/src/passthrough.rs with adjacent tests under passthrough/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_passthrough in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function passthrough_cases in betterlite-azure with these exact named cases (one per oracle file):
  body_model_inference_endpoint, router_model_in_path, foreign_deployment, api_version_removal, responses_stream_log,
  messages_relay_log, nonstream_usage, passthrough_auth_inputs. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_passthrough* using HelperCase: kind: helper
  and the externally tagged azure_passthrough variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_passthrough that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 145 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 180 production lines, 220 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 590 planned, 600 maximum changed lines.
