checks:
  optional:
  - mutants
  commands:
  - id: case-body-model-inference-endpoint
    why: Reject any endpoint containing a path-segment openai/deployments/<nonempty segment>; otherwise strip slashes
      and accept exact or slash-suffixed responses,chat/completions,completions,embeddings,images/generations,audio/speech.
      is_streaming_request uses bool(request_data.stream), not a strict boolean check.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_body_model_inference_endpoint$/)'
  - id: case-router-model-in-path
    why: Split endpoint on / and return the first part exactly matching router_models only when at least two parts
      exist; no case folding for router matching.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_router_model_in_path$/)'
  - id: case-foreign-deployment
    why: Extract the first deployment path segment; exact model_group match is local, otherwise compare served_models
      case-insensitively using Python casefold. Return an unknown deployment verbatim; no callback is needed when
      no deployment or exact group match.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_foreign_deployment$/)'
  - id: case-api-version-removal
    why: Resolve base from explicit or AZURE_API_BASE only, else Exception Azure api base not found. Use B101 replacement
      of model_group path segments and strip leading actual model. A truthy request-query api-version removes every
      exact api-version from configured base, then overrides params version; empty caller version leaves existing
      base version. B2200 builds the final URL; return it plus original resolved base.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_api_version_removal$/)'
  - id: case-responses-stream-log
    why: For slash-normalized endpoint ending the Responses relay suffix, B508 parses terminal events; only a found
      terminal changes logging.call_type to the Responses relay call type and returns the whole terminal event.
      Other non-chat streams return None.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_responses_stream_log$/)'
  - id: case-messages-relay-log
    why: Chat stream logging delegates B103 _build_complete_streaming_response; supply relayed request messages
      only when RelayedCallDetails validation succeeds and request_data exists, otherwise None.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_messages_relay_log$/)'
  - id: case-nonstream-usage
    why: For endpoint containing chat/completions use B668 chat response projection with user content no-message-pass-through-endpoint,
      blank api_key and empty optional/litellm params; otherwise call B101 logged_relay_shape(OPENAI_RELAY_SHAPES).
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_nonstream_usage$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_passthrough.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_passthrough*")"
      && grep -lq 'azure_passthrough' tools/oracle/fuzz/corpus/helper_case/azure_passthrough* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_passthrough$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-passthrough-auth-inputs
    why: get_api_key is explicit or AZURE_API_KEY only; get_base_model is identity and get_models delegates to the
      inherited model-info owner. Validation overwrites params.api_key with the positional value even when None,
      then delegates B2200, so its global fallback may apply.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_passthrough_auth_inputs$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_passthrough_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_passthrough_secret_safe_failure$/)'
