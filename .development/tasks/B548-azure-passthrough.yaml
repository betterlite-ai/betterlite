checks:
  optional:
  - mutants
  commands:
  - id: case-body-model-inference-endpoint
    why: The body-model-inference-endpoint behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_body_model_inference_endpoint$/)'
  - id: case-router-model-in-path
    why: The router-model-in-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_router_model_in_path$/)'
  - id: case-foreign-deployment
    why: The foreign-deployment behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_foreign_deployment$/)'
  - id: case-api-version-removal
    why: The api-version-removal behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_api_version_removal$/)'
  - id: case-responses-stream-log
    why: The responses-stream-log behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_responses_stream_log$/)'
  - id: case-messages-relay-log
    why: The messages-relay-log behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_messages_relay_log$/)'
  - id: case-nonstream-usage
    why: The nonstream-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_nonstream_usage$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_passthrough.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_passthrough*")"
      && grep -lq 'azure_passthrough' tools/oracle/fuzz/corpus/helper_case/azure_passthrough* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_passthrough$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
