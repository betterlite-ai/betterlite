out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Preserve model-router body-model inference, foreign deployment handling and api-version removal rules.
- The deployment lookbehind regex cannot be copied into Rust regex; parse the deployment path segment instead.
- Removing api-version must reproduce httpx.URL query reserialization, not byte-splice the original query.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: standard
