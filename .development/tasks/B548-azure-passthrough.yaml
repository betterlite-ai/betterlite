  - oracle
  - helper-python
- text: 'router model in path: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-passthrough/router-model-in-path.yaml.'
  proof:
  - case-router-model-in-path
  - oracle
  - helper-python
- text: 'foreign deployment: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-passthrough/foreign-deployment.yaml.'
  proof:
