checks:
  optional:
  - mutants
  commands:
  - id: case-invoke-agent
    why: Dispatch B652 request and B2209 trace/event reply with injected fixture frames; preserve service=bedrock,
      session ID and its fake streaming behavior.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_agent_dispatch_cases::case_[0-9]+_invoke_agent$/)'
  - id: case-agentcore-json
    why: Dispatch B653 preparation and B654 buffered JSON/SSE response; retain ARN endpoint and selected JWT versus
      signed headers.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_agent_dispatch_cases::case_[0-9]+_agentcore_json$/)'
  - id: case-agentcore-stream
    why: Dispatch B655 live line stream with B653 inputs; cover both SSE and JSON two-chunk fallback, preserving
      leaf errors.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_agent_dispatch_cases::case_[0-9]+_agentcore_stream$/)'
  - id: case-claude-platform-chat
    why: Dispatch B656 chat with B2211 resolved workspace settings and Anthropic request/reply behavior.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_agent_dispatch_cases::case_[0-9]+_claude_platform_chat$/)'
  - id: case-claude-platform-messages
    why: Dispatch B656 native Messages with its different header precedence and model-prefix stripping.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_agent_dispatch_cases::case_[0-9]+_claude_platform_messages$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_agent_dispatch.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_agent_dispatch*")"
      && grep -lq 'bedrock_agent_dispatch' tools/oracle/fuzz/corpus/helper_case/bedrock_agent_dispatch* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_agent_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_agent_dispatch_unsupported_operation$/)'
