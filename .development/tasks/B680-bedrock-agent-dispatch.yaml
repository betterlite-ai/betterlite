- 'The oracle helper for this task is pre-registered as bedrock_agent_dispatch in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/bedrock_agent_dispatch.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_agent_dispatch.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
