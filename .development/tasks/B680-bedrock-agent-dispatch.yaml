id: B680
title: Bedrock agent and Claude Platform composition
description: >-
  Install InvokeAgent, AgentCore and Claude Platform request/stream operations through the Bedrock dispatcher. Route
  claude_platform to B656, agent to B652 and agentcore request/response/stream to B653-B655, preserving errors and
  signed destination selection.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Install these completed leaf operations: B652 Bedrock InvokeAgent requests and B2209 trace replies; B653 Bedrock
  AgentCore invocation preparation; B654 Bedrock AgentCore JSON and SSE replies; B655 Bedrock AgentCore streaming
  adapters; B656 Bedrock Claude Platform workspace routes. Each dispatch fixture must reach its leaf with a fake
  transport and assert the resulting request or reply; accept already normalized settings and reuse leaf errors.


  Named case contracts: invoke_agent: Dispatch B652 request and B2209 trace/event reply with injected fixture frames;
  preserve service=bedrock, session ID and its fake streaming behavior. agentcore_json: Dispatch B653 preparation
  and B654 buffered JSON/SSE response; retain ARN endpoint and selected JWT versus signed headers. agentcore_stream:
  Dispatch B655 live line stream with B653 inputs; cover both SSE and JSON two-chunk fallback, preserving leaf errors.
  claude_platform_chat: Dispatch B656 chat with B2211 resolved workspace settings and Anthropic request/reply behavior.
  claude_platform_messages: Dispatch B656 native Messages with its different header precedence and model-prefix
  stripping.


  Each named composition case uses separate fixture rows for its operations, invokes the existing native dispatcher
  and then the actual leaf prepare/send/project functions, and asserts captured upstream request and returned typed
  result. Include a leaf failure per family to detect accidental error rewriting. This composition reads no new
  config/env values and registers no HTTP route; defaults, headers, warnings and parsers remain with the named leaves.


  Implement crates/betterlite-provider/src/bedrock_agent_dispatch.rs with adjacent tests under bedrock_agent_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_agent_dispatch_cases in betterlite-provider with these exact named cases (one per
  oracle file): invoke_agent, agentcore_json, agentcore_stream, claude_platform_chat, claude_platform_messages.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_agent_dispatch* using HelperCase: kind:
  helper and the externally tagged bedrock_agent_dispatch variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_agent_dispatch that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone bedrock_agent_dispatch_unsupported_operation in betterlite-provider for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 155 production lines, 210 behavior/config-test lines, 130 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 535 planned, 550 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
