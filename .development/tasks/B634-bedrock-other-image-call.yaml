deviations: []
out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- 'litellm/llms/bedrock/image_generation/image_handler.py: BedrockImageGeneration.get_config_class L66-L74 is B633,
  below image execution and pricing callers.'
- 'Function ownership inventory litellm/llms/bedrock/image_generation/image_handler.py: BedrockImageGeneration.get_config_class
  L65-L74 belong to B633.'
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_other_image_call in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/other_image_call.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_other_image_call.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Guardrail options are popped after body serialization, so a header can also remain in the payload.
- The synchronous fallback client ignores this method's timeout argument, while the asynchronous fallback client
  receives it.
