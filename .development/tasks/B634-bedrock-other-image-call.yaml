id: B634
title: Bedrock image generation execution
description: >-
  Execute Bedrock image generation via typed signed Invoke requests and map results with image_models. Preserve
  extra-header extraction, model-family selection, optional params and upstream status; do not introduce file downloads
  to return URL mode.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_generation/image_handler.py:
  BedrockImageGeneration.image_generation L76-L139; BedrockImageGeneration.async_image_generation L141-L188; BedrockImageGeneration._extract_headers_from_optional_params
  L190-L203; BedrockImageGeneration._prepare_request L205-L292; BedrockImageGeneration._get_request_body L294-L310;
  BedrockImageGeneration._transform_response_dict_to_openai_response L312-L345.


  Decode the provider-specific JSON reply at this HTTP boundary before delegating B633 record transformations; the
  OpenAI image reply decoder expects a different body shape.


  Reuse AmazonNovaCanvasConfig._is_nova_model from B633 (litellm/llms/bedrock/image_generation/amazon_nova_canvas_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AmazonStability3Config._is_stability_3_model from B633 (litellm/llms/bedrock/image_generation/amazon_stability3_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AmazonTitanImageGenerationConfig._is_titan_model from B633 (litellm/llms/bedrock/image_generation/amazon_titan_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: image_family_dispatch: Use B633 get_config_class in both request and response paths: Titan
  substring first, Nova second, Stability 3 third, otherwise Stability 1. The same original model selects both transformations
  even when optional model_id changes the invoked deployment. Convert its request TypedDict to a plain mapping and
  preserve all B633 mutation/error behavior. image_runtime_url: Prepare before selecting sync/async transport. Call
  B595 _get_boto_credentials_from_optional_params with original options/model and B590 bedrock_bearer_token(api_key),
  B591 get_bedrock_invoke_provider, then B591 get_bedrock_model_id. Select the B591 proxy_endpoint_url, unlike B631
  embeddings, and append /model/{modelId}/invoke without stripping an existing slash. Keep that endpoint_url as
  the transport target even if prepared.url differs. signed_json_body: Build B633 body before header extraction,
  serialize once as UTF-8 JSON bytes, and sign those bytes through B595 get_request_headers with default Content-Type=application/json
  overlaid by extra_headers. Use returned headers but transport prepared_request.endpoint_url/body. B249 pre_call
  input=prompt, api_key empty, and additional_args contains complete_input_dict,api_base=proxy_endpoint_url,headers.
  Test B595 bearer and explicit non-AWS Authorization precedence on this call path. extra_headers_outside_body:
  After the body has already been built and serialized, pop guardrailIdentifier and guardrailVersion from the mutated
  options and add x-amz-bedrock-guardrail-identifier and x-amz-bedrock-guardrail-version for non-None values, including
  empty strings; these headers override identical extra-header keys. Because extraction is late, Stability 1/3 and
  Nova may retain these fields in the already-built body, while Titan ignores them. Assert both body and headers
  rather than claiming guardrail fields are always removed from the body. base64_image_result: After successful
  transport, if logging_obj is non-None B249 post_call gets prompt, empty api_key, raw response.text and complete_input_dict;
  debug logs raw model_response: %s with response text. decode_bedrock_image_reply parses JSON. JSON null raises
  ValueError Error in response object format, got None; malformed JSON propagates its decoder error. B633 transformation
  mutates data on the supplied model_response; ignore its return value and return the original response record.
  Preserve ordered base64 results even when response_format requests URL. image_http_error: Both transport paths
  raise_for_status, translate HTTPStatusError to B682 BedrockError preserving status,text,headers,response, and
  timeout to status408 message Timeout error occurred. Other transport failures and downstream decoder/transform
  errors propagate without that translation; failed HTTP responses do not run post_call here. image_transport_selection:
  Only aimg_generation literally True selects async. Sync accepts only an HTTPHandler or creates B173 default client
  without passing the timeout argument; async receives only a matching AsyncHTTPHandler and otherwise creates B173
  BEDROCK client with params timeout, including None. Preparation/signing runs before this async dispatch and is
  shared with sync. Compatible supplied clients retain their own timeout behavior.


  Outside-byte boundary: decode_bedrock_image_reply consumes Bedrock image-generation HTTP response JSON bytes,
  including JSON null and nonobject values in crates/betterlite-bedrock/src/image_call.rs or its scoped child module.
  Use that production decoder from the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_image_reply.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_bedrock_image_reply_corpus
  that checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Write standalone Rust test image_call_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test image_call_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/image_call.rs with adjacent tests under image_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_call_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  image_family_dispatch, image_runtime_url, signed_json_body, extra_headers_outside_body, base64_image_result, image_http_error,
  image_transport_selection. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_call* using HelperCase: kind:
  helper and the externally tagged bedrock_other_image_call variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_image_call that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 237 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 270 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 705 planned, 725 maximum changed lines.
