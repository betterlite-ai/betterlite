  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/image_call.rs
  - crates/betterlite-bedrock/src/image_call/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/other_image_call.rs
  - tools/oracle/src/helpers/bedrock/other_image_call/**
  - tools/oracle/helpers/bedrock_other_image_call.py
  - tools/oracle/helpers/bedrock_other_image_call/**
  - tools/oracle/cases/helpers/providers/bedrock-other-image-call/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_call*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_image_reply.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_image_reply/**
  lint_tables: false
