      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^execution_offloop_bounded::/)' 2>&1 | head -100 || true
    - id: bounded-eventloop-execution-tests
      why: await_with_timeout must give pending a deadline on the event loop and cancel when time passes
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^execution_eventloop_bounded::/)' 2>&1 | head -100 || true
    - id: execution-timeout-error-tests
      why: ExecutionInterrupted must be caught and converted to ExecutionTimeoutError with the original timeout
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^execution_timeout_error::/)' 2>&1 | head -100 || true
    - id: sandbox-exit-error-tests
      why: BaseException subclasses must be wrapped in SandboxExit so they cannot escape to the event loop
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^execution_sandbox_exit::/)' 2>&1 | head -100 || true
    - id: interrupt-gate-tests
      why: _InterruptGate must safely track thread id and prevent stale hits after close
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^interrupt_gate::/)' 2>&1 | head -100 || true
    - id: inplacevar-tests
