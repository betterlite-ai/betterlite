    - id: sandbox-while-loop-tests
      why: while loops must be rewritten with budget checks before the test
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^sandbox_while_loop::/)' 2>&1 | head -100 || true
    - id: sandbox-for-loop-tests
