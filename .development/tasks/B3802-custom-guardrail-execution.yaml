      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^deadline_context::/)' 2>&1 | head -100 || true

oracle_cases: []
deviations:
  - what: CPython thread interruption via ctypes.pythonapi.PyThreadState_SetAsyncExc is the fallback when code swallows cancellation.
    why: Robust bounded execution requires a mechanism to interrupt code stuck in a native call; the implementation choice (ctypes, subprocess limits, safe-fork style, or rejection of blocking calls entirely) is deferred as U7.

out_of_scope:
  - "B3801 owns get_custom_code_primitives, which is included in build_sandbox_globals. RestrictedPython library integration and its specific guards are external dependencies."
  - "RestrictedPython AST node rewriting details beyond AsyncAwareTransformer extensions. compile_restricted is a library call, not a betterlite implementation."
  - "Event loop integration details beyond what await_with_timeout and call_off_loop_with_timeout provide; Tokio spawning and task management stay with the guardrail dispatcher."
  - "Custom execution framework initialization, guardrail configuration, and result handling (B3803 builds those with the compilation boundary)."
  - "Production logging, metrics and observability around execution; this module logs only stuck threads after interruption attempts fail."

pitfalls:
  - compile_sandboxed rejects imports, exec, eval and class definitions outright via RestrictedPython; catching SyntaxError is the only way to know why.
  - Budget checks happen at loop entry and per-item, not for infinite recursion; deeply nested function calls will not be interrupted until a loop or iteration is reached.
  - ExecutionInterrupted is a BaseException, not Exception, so sandboxed code's bare except clauses cannot swallow it; only except BaseException catches it.
  - _InterruptGate.interrupt uses ctypes.pythonapi which is not portable; the runtime mechanism requires an architect decision.
  - Long-running C calls (regex, network, crypto) run past the deadline until they return; the timeout is advisory at that point, not guaranteed.
  - Daemon worker threads started by call_with_timeout and call_off_loop_with_timeout will be terminated on process exit; cleanup is not guaranteed.
  - The deadline context variable is set per-call and not thread-safe across concurrent guardrail executions in the same worker thread context.
  - await_with_timeout creates a new Task in a copied context, so thread-local state changes in _contain are not visible to the caller.

review_level: standard
