    why: ExecutionTimeoutError and SandboxExit exception types, deadline context variable and wall-clock budget checking.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/custom_code/bounded_execution.py#L73-L161
    why: _InterruptGate for thread-safe interrupt targeting and _start_worker thread spawning.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/custom_code/bounded_execution.py#L163-L231
    why: call_with_timeout for sync code, call_off_loop_with_timeout for off-loop async, and await_with_timeout for event-loop futures.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/custom_code/sandbox.py#L42-L84
    why: AsyncAwareTransformer extending RestrictedPython with async support and while-loop budget injection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/custom_code/sandbox.py#L103-L157
    why: _inplacevar_ for augmented assignments, _build_sandbox_builtins, build_sandbox_globals and compile_sandboxed.

dod:
  - text: compile_sandboxed accepts valid guardrail source and returns bytecode; raises SyntaxError on invalid syntax or forbidden constructs (import, exec, dunder access).
    proof: [sandbox-compilation-tests]
  - text: build_sandbox_globals returns a dict with RestrictedPython guards (_getattr_, _getitem_, _getiter_, _write_, _inplacevar_, _budget_ok_), primitives and safe builtins.
    proof: [sandbox-globals-tests]
  - text: Async def, await, async for and async with are allowed by AsyncAwareTransformer; class definitions, imports and exec remain forbidden.
    proof: [sandbox-async-compilation-tests]
  - text: Every while loop body is guarded by _budget_ok_() so the loop stops at the deadline; the rewrite preserves the original test condition.
    proof: [sandbox-while-loop-tests]
  - text: >-
      Every for loop and comprehension checks the budget per item through _getiter_ (budgeted_iter).
      A for loop or comprehension running past the deadline raises ExecutionInterrupted, surfaced as ExecutionTimeoutError at the call boundary.
      Example: for x in range(1000000) running past deadline raises ExecutionInterrupted mid-iteration.
    proof: [sandbox-for-loop-tests]
  - text: call_with_timeout runs fn on a worker thread and returns the result or raises ExecutionTimeoutError if the deadline passes; worker thread id is tracked in _InterruptGate.
    proof: [bounded-sync-execution-tests]
  - text: call_off_loop_with_timeout runs fn on a worker thread and awaits without blocking the event loop; same deadline/interrupt mechanism applies.
    proof: [bounded-offloop-execution-tests]
  - text: await_with_timeout awaits a pending future on the event loop with a deadline; cancels and raises ExecutionTimeoutError when the deadline passes.
    proof: [bounded-eventloop-execution-tests]
  - text: ExecutionInterrupted caught at the code boundary becomes ExecutionTimeoutError with the original timeout value.
    proof: [execution-timeout-error-tests]
  - text: SandboxExit wraps BaseException subclasses so they cannot stop the event loop; message includes exception type and value.
    proof: [sandbox-exit-error-tests]
  - text: _InterruptGate tracks thread id safely with a lock; interrupt returns false if the gate is closed, preventing stale thread id hits.
    proof: [interrupt-gate-tests]
  - text: _inplacevar_ implements augmented assignment (+=, -=, etc.) by dispatching through operator module; raises SyntaxError for unsupported operators.
    proof: [inplacevar-tests]
  - text: _past_deadline returns true when the deadline context variable is set and monotonic time has passed it; used internally for budget checking.
    proof: [deadline-context-tests]

