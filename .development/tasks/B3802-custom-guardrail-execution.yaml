id: B3802
title: Custom guardrail compilation and execution deadlines
description: >-
  Build the RestrictedPython compilation boundary and bounded execution lifecycle for custom guardrail code.
  The sandbox compiler accepts user-supplied guardrail source and transforms it with AsyncAwareTransformer,
  which extends RestrictedPython to permit async def, await, async for and async with nodes while keeping
  all security restrictions for attribute access, dunder names, imports and dangerous builtins.
  Every while loop is rewritten to call _budget_ok_() before each test, every for loop and comprehension
  checks the budget per item through _getiter_, and all execution paths raise ExecutionInterrupted when
  the deadline passes.

  Compile custom code once and cache the bytecode; recompilation on every call is the anti-pattern.
  compile_sandboxed returns a CodeType; calling it raises SyntaxError on syntax errors or forbidden
  constructs. build_sandbox_globals returns the execution globals dict, including primitives, RestrictedPython
  guards and the budget functions.

  For synchronous guardrail code: call_with_timeout runs the code on a worker thread and waits from sync context,
  intercepting ExecutionInterrupted as ExecutionTimeoutError. The worker sets its thread id in _InterruptGate
  and a polling loop calls PyThreadState_SetAsyncExc to inject ExecutionInterrupted when the wall-clock deadline passes.
  After the deadline, a thread still running is logged as stuck (in a C call, for example) but the caller gets its
  timeout on schedule.

  For async guardrail code: call_off_loop_with_timeout runs the code on a worker thread and awaits without blocking
  the event loop. The same deadline and interrupt mechanisms apply. When a task is cancelled before the worker finishes,
  spawn a daemon thread to keep interrupting it so its exit is guaranteed.

  For awaiting a pending future on the event loop itself: await_with_timeout gives the pending a task, sets the deadline
  in a context variable, and cancels the task repeatedly if it reaches the deadline without finishing. The task's
  _contain coroutine catches ExecutionInterrupted as ExecutionTimeoutError and converts other BaseException subclasses
  (SystemExit, etc.) to SandboxExit so they cannot stop the event loop.

  Preserve the 1-second interrupt grace period, 50-millisecond polling interval, and shared deadline context variable.
  The source's CPython interruption via ctypes.pythonapi is the fallback when code swallows cancellation; the runtime
  mechanism requires an architect decision before implementation (U7).

scope:
