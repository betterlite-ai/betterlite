id: B3751
title: Akto mirroring payloads and transport
description: >-
  Implement Akto guardrail's double-encoded MIRRORING payload construction for HTTP traffic mirroring,
  account/VXLAN identifier defaults, HTTP POST transport to /api/http-proxy, response parsing including
  the distinction between malformed JSON errors and valid non-object JSON (which permits the request),
  unreachable fallback policy, and background fire-and-forget data ingestion.


  Configuration carries: `akto_base_url` (required, reads AKTO_GUARDRAIL_API_BASE), `akto_api_key` (required,
  reads AKTO_API_KEY), `akto_account_id` (optional, default "1000000", reads AKTO_ACCOUNT_ID),
  `akto_vxlan_id` (optional, default "0", reads AKTO_VXLAN_ID), `unreachable_fallback` (fail_closed or
  fail_open, default fail_closed), and `guardrail_timeout` (optional, default 5 seconds). HTTP headers
  include Authorization (API key) and Content-Type (application/json).


  Payload construction uses the MIRRORING format with double-encoding at requestPayload and responsePayload
  fields; inner JSON bodies are wrapped as `json.dumps({"body": json.dumps(actual_body)})` to match Akto's
  CLI hook format. Extract client IP from x-forwarded-for or x-real-ip proxy headers, handling comma-separated
  lists by taking the first value. Build request path from metadata.user_api_key_request_route, defaulting to
  /v1/chat/completions. Include user_id and team_id tags extracted from litellm_metadata or metadata dicts.


  Response parsing extracts guardrailsResult.Allowed (default true) and Reason (empty string default) from
  the JSON response. Preserve the distinction between response.status_code != 200 (error), malformed JSON
  (JSONDecodeError raised to caller), and valid non-object or non-dict data (returns allowed=true,
  reason=""). Scope paths are the guardrails module. Background ingestion uses fire-and-forget asyncio
  tasks with proper tracking to prevent leaks.
scope:
  paths:
    - crates/betterlite-guardrails/src/akto.rs
    - crates/betterlite-guardrails/src/akto/**
    - crates/betterlite-guardrails/Cargo.toml
    - tools/oracle/cases/guardrails/akto/**
    - crates/betterlite-config/src/sections/akto_mirroring.rs
    - crates/betterlite-config/src/sections/akto_mirroring/**
  lint_tables: false
references:
