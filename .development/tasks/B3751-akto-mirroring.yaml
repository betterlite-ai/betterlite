deviations:
  - what: Akto error messages use betterlite's own wording in failure scenarios, not LiteLLM's exact text.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status codes unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/akto/akto.py#L375-L379
out_of_scope:
  - Lifecycle hook entry points (apply_guardrail decorator, async_pre_call_hook, async_post_call_success_hook
    wrapper logic); B107 orchestrates when Akto guardrails are invoked.
  - The check-versus-ingest lifecycle decision (whether to combine guardrails=true with ingest_data=true);
    B107 controls that behavior.
  - Other guardrail providers (AIM, Cisco, etc.); each gets its own task.
pitfalls:
  - >-
    Double-encoding must be applied consistently: `json.dumps({"body": json.dumps(actual_body)})` for both
    request and response payloads, not single-encoded.
  - Account and VXLAN defaults are string values "1000000" and "0", not integers.
  - >-
    Client IP extraction must handle comma-separated x-forwarded-for values by taking only the first element
    after stripping whitespace.
  - >-
    Malformed JSON response (JSONDecodeError) must be raised to the caller; valid non-object JSON must return
    `(allowed=true, reason="")`, not raise.
  - >-
    Background ingestion tasks must be added to self.background_tasks and unregistered on completion via
    add_done_callback, to prevent AsyncIO warnings or resource leaks.
  - Fire-and-forget ingestion must not re-raise errors to the caller; errors are logged only.
  - >-
    The unreachable_fallback policy uses exact string values: "fail_open" and "fail_closed", not boolean.
  - >-
    akto_api_key must never be logged or shown in Debug output; mark the field as SecretString and use it only
    in the Authorization header.
review_level: security
budget:
  max_changed_lines: 700
  max_new_expects: 1
