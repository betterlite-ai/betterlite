    why: The complete AktoGuardrail class with __init__, build_akto_payload, send_request, handle_guardrail_response, handle_unreachable, fire_and_forget_request and apply_guardrail.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/akto.py
    why: The AktoConfigModel with akto_base_url, akto_api_key, akto_account_id, akto_vxlan_id and unreachable_fallback fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_guardrail.py
    why: The CustomGuardrail base class and the log_guardrail_information decorator.
dod:
  - text: >-
      Akto payload uses double-encoding for requestPayload and responsePayload fields, with inner
      bodies wrapped as `json.dumps({"body": json.dumps(...)})` to match CLI hook format.
    proof: [oracle]
  - text: >-
      Account and VXLAN IDs default to "1000000" and "0" when not set, reading from AKTO_ACCOUNT_ID
      and AKTO_VXLAN_ID environment variables.
    proof: [akto-tests]
  - text: >-
      Response parsing returns (allowed, reason) tuple, extracting guardrailsResult.Allowed and Reason
      from JSON, with sensible defaults on missing fields.
    proof: [akto-tests]
  - text: >-
      Malformed JSON in response body raises JSONDecodeError; valid non-object/non-dict JSON returns
      (allowed=true, reason="").
    proof: [akto-tests]
  - text: Unreachable Akto service follows fail_open/fail_closed policy, logging appropriately for each mode.
    proof: [akto-tests]
  - text: Background fire-and-forget ingestion tasks are tracked and cleaned up to prevent leaks.
    proof: [akto-tests]
  - text: >-
      Client IP is extracted from x-forwarded-for or x-real-ip headers, handling comma-separated values
      by taking the first element.
    proof: [akto-tests]
  - text: >-
      Configuration loads akto_base_url (required, AKTO_GUARDRAIL_API_BASE env), akto_api_key (required,
      AKTO_API_KEY env), akto_account_id (optional, AKTO_ACCOUNT_ID env, default "1000000"), akto_vxlan_id
      (optional, AKTO_VXLAN_ID env, default "0"), unreachable_fallback (optional, default fail_closed), and
      guardrail_timeout (optional, default 5).
    proof: [akto-tests, config-load]
checks:
  optional: []
  commands:
    - id: akto-tests
      why: the akto guardrail tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails -p betterlite-server --no-tests=fail -E 'test(/akto_guardrail/)'
    - id: config-load
      why: the Akto configuration does not load from files or environment
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/akto.*config/)'
