id: B545
title: Azure realtime protocol and HTTP sessions
description: >-
  Add AzureRealtimeConnect and GA/beta protocol selection, configured region/deployment URLs and HTTP session/call/transcription-session
  preparation. Expose a provider event-normalizer seam for B084; its websocket pump owns forward_messages scheduling.
  Preserve Azure authentication/header shape and exception-close mapping.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/realtime/handler.py:
  azure_realtime_protocol_for_client L42-L52; _ProxyClientWebSocket.send_text L58-L58; _ProxyClientWebSocket.close
  L60-L60; AzureOpenAIRealtime.get_auth_headers L65-L77; AzureOpenAIRealtime._construct_url L79-L131; AzureOpenAIRealtime.async_realtime
  L133-L202. litellm/llms/azure/realtime/http_transformation.py: AzureRealtimeHTTPConfig.get_api_base L11-L12; AzureRealtimeHTTPConfig.get_api_key
  L14-L15; AzureRealtimeHTTPConfig.get_complete_url L17-L20; AzureRealtimeHTTPConfig.validate_environment L22-L32;
  AzureRealtimeHTTPConfig.get_realtime_calls_url L34-L37; AzureRealtimeHTTPConfig.get_transcription_session_url
  L39-L42; AzureRealtimeHTTPConfig.get_realtime_calls_headers L44-L47.


  Use B1004 close_after_upstream_handshake_refusal and BaseRealtimeHTTPConfig, B1005 client_sent_openai_beta_realtime_header
  and B1006/B1008/B1009 RealTimeStreaming state/relays. HTTP api-version defaults to 2024-12-17.


  Test the default-cap 1009 outcome as a Rust-only deviation case; oracle frame fixtures below the cap still compare
  directly.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Add the Rust-only message_cap_closes_1009 case for the documented 16 MiB default and the explicit environment
  override.


  Named case contracts: beta_realtime_deployment_query: Beta appends /openai/realtime with URL-encoded api-version
  and deployment model, plus truthy intent; no OpenAI-Beta header is sent upstream. In async_realtime missing api_base
  None raises ValueError api_base is required for Azure OpenAI calls; missing api_version None raises api_version
  is required for Azure OpenAI calls only for beta. ga_realtime_url: Replace https:// with wss:// only; do not rewrite
  http:// or trim trailing slash/path/query. Append /openai/v1/realtime; include requested model only when intent
  is not transcription and query_params is None or has a model key. Ignore its model value and all arbitrary query
  keys; append truthy intent. api_key_versus_token: Handshake uses only truthy api-key, otherwise only Authorization:
  Bearer <truthy azure_ad_token>. With neither, ValueError Missing Azure credentials for the realtime endpoint.
  Set an api_key, or configure Azure AD auth (azure_ad_token, tenant_id/client_id/client_secret, or a managed identity);
  this occurs before the connection try. client_beta_protocol: A nonempty string configured_protocol wins verbatim;
  otherwise intent=transcription forces GA, else B1005 client beta header chooses beta versus GA. Construction treats
  GA/V1 case-insensitively; all other configured values select beta. calls_and_transcription_headers: HTTP environment
  validation copies headers then overwrites api-key with key-or-empty and Content-Type=application/json; ephemeral-call
  headers contain only api-key=<ephemeral key>. The websocket transport forwards the shared SSL context unchanged,
  unlike B528 False-to-True adaptation. handshake_error: InvalidStatus calls B1004 close_after_upstream_handshake_refusal
  with upstream status. Other exceptions best-effort send B1004 realtime_error_event(Internal server error,error_type=server_error),
  then close1011 reason Internal server error; suppress failures from either send or close. Missing base/version/credentials
  errors are outside this catch. http_version_2024_12_17: HTTP base resolves explicit,litellm.api_base,AZURE_API_BASE,empty;
  HTTP key resolves explicit,litellm.api_key,AZURE_API_KEY,empty (not azure_key/AZURE_OPENAI_API_KEY). Strip trailing
  slashes and append /openai/realtime/client_secrets, /calls or /transcription_sessions with api-version from explicit,AZURE_API_VERSION,2024-12-17;
  litellm.api_version is not read.


  Reuse B528 for the REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES loader and its configured value; this consumer adds
  no second config field or loader test. The named behavior cases still test the configured value at this call boundary.


  Implement crates/betterlite-azure/src/realtime.rs with adjacent tests under realtime/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation azure_realtime in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_cases in betterlite-azure with these exact named cases (one per oracle file): beta_realtime_deployment_query,
  ga_realtime_url, api_version_query, api_key_versus_token, client_beta_protocol, calls_and_transcription_headers,
  handshake_error, http_version_2024_12_17. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_realtime* using HelperCase: kind: helper
  and the externally tagged azure_realtime variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_azure_realtime that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone azure_realtime_message_cap_closes_1009 in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 165 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 230 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 40 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 630 planned, 650 maximum changed lines.
