deviations:
- what: >-
    Websocket messages are capped at 16 MiB by default; REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES overrides the
    cap. LiteLLM defaults this variable to None, allowing unlimited frames; excess messages close with websocket
    code 1009.
  why: Bounded external buffers are required; this names the visible default difference rather than assuming LiteLLM
    already caps messages.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L336-L339
out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- 'litellm/llms/azure/realtime/handler.py: forward_messages L31-L39 have no caller at the pin; do not port them.'
pitfalls:
- Preserve Azure authentication/header shape and exception-close mapping.
