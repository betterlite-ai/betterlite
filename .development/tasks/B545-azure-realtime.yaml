  - mutants
  commands:
  - id: case-beta-realtime-deployment-query
    why: Beta appends /openai/realtime with URL-encoded api-version and deployment model, plus truthy intent; no
      OpenAI-Beta header is sent upstream. In async_realtime missing api_base None raises ValueError api_base is
      required for Azure OpenAI calls; missing api_version None raises api_version is required for Azure OpenAI
      calls only for beta.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_beta_realtime_deployment_query$/)'
  - id: case-ga-realtime-url
    why: Replace https:// with wss:// only; do not rewrite http:// or trim trailing slash/path/query. Append /openai/v1/realtime;
      include requested model only when intent is not transcription and query_params is None or has a model key.
      Ignore its model value and all arbitrary query keys; append truthy intent.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_ga_realtime_url$/)'
  - id: case-api-version-query
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-realtime/api-version-query.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_api_version_query$/)'
  - id: case-api-key-versus-token
    why: 'Handshake uses only truthy api-key, otherwise only Authorization: Bearer <truthy azure_ad_token>. With
      neither, ValueError Missing Azure credentials for the realtime endpoint. Set an api_key, or configure Azure
      AD auth (azure_ad_token, tenant_id/client_id/client_secret, or a managed identity); this occurs before the
      connection try.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_api_key_versus_token$/)'
  - id: case-client-beta-protocol
    why: A nonempty string configured_protocol wins verbatim; otherwise intent=transcription forces GA, else B1005
      client beta header chooses beta versus GA. Construction treats GA/V1 case-insensitively; all other configured
      values select beta.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_client_beta_protocol$/)'
  - id: case-calls-and-transcription-headers
    why: HTTP environment validation copies headers then overwrites api-key with key-or-empty and Content-Type=application/json;
      ephemeral-call headers contain only api-key=<ephemeral key>. The websocket transport forwards the shared SSL
      context unchanged, unlike B528 False-to-True adaptation.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_calls_and_transcription_headers$/)'
  - id: case-handshake-error
    why: InvalidStatus calls B1004 close_after_upstream_handshake_refusal with upstream status. Other exceptions
      best-effort send B1004 realtime_error_event(Internal server error,error_type=server_error), then close1011
      reason Internal server error; suppress failures from either send or close. Missing base/version/credentials
      errors are outside this catch.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_handshake_error$/)'
  - id: case-http-version-2024-12-17
    why: HTTP base resolves explicit,litellm.api_base,AZURE_API_BASE,empty; HTTP key resolves explicit,litellm.api_key,AZURE_API_KEY,empty
      (not azure_key/AZURE_OPENAI_API_KEY). Strip trailing slashes and append /openai/realtime/client_secrets, /calls
      or /transcription_sessions with api-version from explicit,AZURE_API_VERSION,2024-12-17; litellm.api_version
      is not read.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_http_version_2024_12_17$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_realtime.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_realtime*")"
      && grep -lq 'azure_realtime' tools/oracle/fuzz/corpus/helper_case/azure_realtime* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_realtime$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_realtime_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/azure_realtime*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: message-cap-closes-1009
    why: The message cap closes 1009 invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_realtime_message_cap_closes_1009$/)'
