- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/realtime/http_transformation.py#L11-L47
  why: Own AzureRealtimeHTTPConfig.get_api_base, AzureRealtimeHTTPConfig.get_api_key, AzureRealtimeHTTPConfig.get_complete_url,
