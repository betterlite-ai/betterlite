id: B4685
title: MCP semantic tool index and request filtering
description: >-
  Implement SemanticMCPToolFilter in betterlite-server::mcp::semantic_filter, a stateful
  service that builds and maintains a semantic router index of MCP tools and filters available
  tools based on embedding similarity to user queries. The filter runs as an optional hook that
  reduces context window consumption when multiple MCP servers are connected.

  SemanticMCPToolFilter holds enabled (bool), embedding_model (string), top_k (int, default 10),
  similarity_threshold (f64, default 0.3), and a tool_router (optional semantic-router instance).
  It is initialized with these parameters and builds a router asynchronously from the MCP registry
  on startup (build_router_from_mcp_registry). Tool information is extracted as (name, description)
  tuples; descriptions default to name when absent.

  build_router_from_mcp_registry fetches all MCP tools from the global registry (no auth checks)
  in parallel, converts them to semantic-router Routes with tool name, description, and similarity
  threshold, builds a SemanticRouter with LiteLLMRouterEncoder, and logs the count. It handles
  failures: logs and continues on per-server failures; returns early if no tools are found; if
  encoding setup fails, logs the error and sets tool_router to None, re-raising encoding errors
  after logging.

  _ensure_tools_indexed runs asynchronously on each request to index any request-time tools
  the startup build never saw (tools from authenticated servers requiring per-user credentials
  that were filtered out at startup). It checks efficiently (single pass, no allocation) for
  missing tools; if none are missing, returns immediately. If missing tools exist, acquires a
  lock, re-checks, then async-adds missing tools to the router. Embedding errors here raise
  and are scoped to the calling request (no shared error state).

  filter_tools(query, available_tools, top_k=None) returns the filtered tools list, ordered by
  semantic similarity and limited to top_k. Early returns when disabled, no tools available,
  no query, or context window error occurred during build. Calls _ensure_tools_indexed, then
  queries the router with route_filter=available_names for semantic matches. Returns all tools
  on match failure. Converts router results to tool names, looks them up by exact name, then by
  suffix match (tolerating client-side namespace prefixes from MCP), returns tools in router order,
  and deduplicates by object identity. On context window error during filtering, raises
  ToolFilterContextWindowError with the embedding model name, stage (build or request-time
  indexing), and original error message. On other failures, logs and returns all tools without
  raising.

  extract_user_query(messages) iterates messages in reverse, finds the last message with role=user,
  extracts content as a string. If content is a string, returns it. If content is a list of blocks
  (dicts or values), concatenates text blocks (extracting "text" from dicts, converting others to
  string) with spaces. Returns empty string if no user message is found.

  _is_context_window_error(error: Option<Exception>) returns true if the exception tree contains
  ContextWindowExceededError or a string match on context-window-exceeded (from exception_mapping_utils).
  It traverses the exception cause chain; an error that is None returns false.

  ToolFilterContextWindowError is a custom exception. Initialize with embedding_model
  (string), stage (string naming where the error occurred: "the MCP tool descriptions during
  semantic router build" or "the user query or the MCP tool descriptions being indexed"), and
  original_error (string). The message format is: "MCP semantic tool filtering could not run:
  embedding model '{embedding_model}' exceeded its context window while embedding {stage}. The
  request was blocked instead of silently passing all tools through. Switch to an embedding model
  with a larger context window, or disable semantic tool filtering."

  _name_matches_canonical(client_name: str, canonical: str) -> bool returns true if client_name
  refers to the canonical MCP tool name, handling client-side namespace prefixes. Returns true if
  names are equal. Returns false if canonical does not contain MCP_TOOL_PREFIX_SEPARATOR. Returns
  false if client_name is not longer than canonical. Returns false if client_name does not end
  with canonical. Returns true if the separator before canonical in client_name is _ or -, else
  false. This match tolerates prefixes like "client_alias_canonical" when canonical is
  "server_tool", preserving the client-facing name in the returned tool.

  _tool_map is a dict keying tool name strings to tool objects (MCPTool from mcp SDK or OpenAI
  function dict). It is built once at startup and indexed lazily with request-time tools.
  _index_sync_lock is an async lock guarding concurrent adds during request-time indexing, so
  one request's missing tools don't corrupt the index.

  Errors: ToolFilterContextWindowError when embedding overflows context window during
  build or request filtering; no other exceptions propagate (failures log and return all tools).
  Warnings are issued when no tools are found in the registry, when a server fails to return
  tools, when the router cannot be built, or when filtering fails but is not a context window
  overflow.

