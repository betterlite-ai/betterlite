dod:
  - text: SemanticMCPToolFilter is initialized with embedding_model, top_k (default 10), similarity_threshold (default 0.3) and enabled (bool).
    proof: [filter-init, filter-tests]
  - text: build_router_from_mcp_registry fetches all MCP tools from the global registry in parallel without auth checks, converts to routes, builds a semantic router, and logs the tool count.
    proof: [filter-tests, build-router-parallel]
  - text: build_router_from_mcp_registry handles per-server failures gracefully, returning early if no tools are found or setting tool_router to None if encoding fails.
    proof: [filter-tests, build-router-failure]
  - text: _extract_tool_info returns (name, description) tuple from MCPTool or OpenAI dict, defaulting description to name when absent.
    proof: [filter-tests]
  - text: _ensure_tools_indexed efficiently checks for missing tools (single pass, no allocation), acquires a lock only if missing tools exist, then async-adds them to the router.
    proof: [filter-tests, ensure-indexed-efficient]
  - text: _ensure_tools_indexed handles embedding errors by raising ToolFilterContextWindowError and scoping other errors to the calling request without shared state.
    proof: [filter-tests, ensure-indexed-errors]
  - text: filter_tools returns filtered tools ordered by semantic similarity, limited to top_k, with early returns for disabled filter, no tools, or no query.
    proof: [filter-tests, filter-main-flow]
  - text: filter_tools calls route_filter=available_names to semantic router and deduplicates results by object identity.
    proof: [filter-tests]
  - text: filter_tools raises ToolFilterContextWindowError with embedding model, stage and original error on context window overflow.
    proof: [filter-tests, filter-context-error]
  - text: filter_tools logs and returns all tools on non-context-window failures without raising.
    proof: [filter-tests, filter-graceful-fail]
  - text: extract_user_query iterates messages in reverse, finds last user message, extracts string or concatenates text from list blocks with space separator.
    proof: [filter-tests, extract-query-order]
  - text: _name_matches_canonical returns true for exact match or when client_name suffix-matches canonical with _ or - separator, preserving client-facing names.
    proof: [filter-tests, name-match-canonical]
  - text: _get_tools_by_names looks up tools by exact name, then by suffix match with shortest-name preference, returns tools in router order and deduplicates by identity.
    proof: [filter-tests]
  - text: _is_context_window_error traverses exception cause chain for ContextWindowExceededError or context-window string match, returning false for None.
    proof: [filter-tests]
  - text: ToolFilterContextWindowError message includes embedding model, stage and original error text with recovery advice.
    proof: [filter-tests]
  - text: New oracle helper operation for semantic filter integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: filter-init
      why: SemanticMCPToolFilter initialization or fields are missing.
      run: grep -qE 'struct SemanticMCPToolFilter|pub struct SemanticMCPToolFilter' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'enabled.*bool|embedding_model|top_k|similarity_threshold' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: filter-tests
      why: Semantic filter tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::semantic_filter::tests::/) - test(/replays_the_/)'
    - id: build-router-parallel
      why: build_router_from_mcp_registry does not fetch tools from servers in parallel.
      run: grep -qE 'build_router_from_mcp_registry' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'join_all|futures|parallel' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: build-router-failure
      why: build_router_from_mcp_registry does not handle failures gracefully.
      run: grep -qE 'continue|return|warn|log' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'if no tools|if.*empty' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: ensure-indexed-efficient
      why: _ensure_tools_indexed does not check for missing tools efficiently or does not skip when none exist.
      run: grep -qE '_has_tools_missing_from_index|_ensure_tools_indexed' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'return.*if' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: ensure-indexed-errors
      why: _ensure_tools_indexed does not scope embedding errors or does not raise context window errors.
      run: grep -qE '_ensure_tools_indexed' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'ToolFilterContextWindowError|raise|scoped' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: filter-main-flow
      why: filter_tools does not implement main filtering flow with early returns.
      run: grep -qE 'fn filter_tools|async fn filter_tools' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'if.*enabled|if.*available|if.*query' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: filter-context-error
      why: filter_tools does not raise ToolFilterContextWindowError on context window overflow.
      run: grep -qE 'ToolFilterContextWindowError' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'embedding_model|stage' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: filter-graceful-fail
      why: filter_tools does not log and return all tools on non-context-window failures.
      run: grep -qE 'filter_tools' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'error\(|return available_tools' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: extract-query-order
      why: extract_user_query does not iterate messages in reverse or does not concatenate text blocks.
      run: grep -qE 'extract_user_query' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'rev\(\)|reversed' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: name-match-canonical
      why: _name_matches_canonical does not match client prefixes with _ or - separator.
      run: grep -qE '_name_matches_canonical' crates/betterlite-server/src/mcp/semantic_filter.rs && grep -qE 'ends_with|suffix|separator.*_.*-' crates/betterlite-server/src/mcp/semantic_filter.rs
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4685.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/semantic-filter-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

