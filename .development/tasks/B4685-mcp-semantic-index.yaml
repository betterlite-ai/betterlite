deviations:
  - what: SemanticMCPToolFilter is initialized with a LiteLLM Router instance for embedding calls, rather than a direct embedding client.
    why: betterlite's router already owns embedding dispatch to all providers. Passing the router reuses its caching and request tracking instead of adding a separate embedding client.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/semantic_tool_filter.py#L53-L75
  - what: Context window errors from embedding during build or request-time indexing are raised as ToolFilterContextWindowError with recovery advice, blocking the request instead of silently passing all tools.
    why: Silent fallback would hide performance regressions and tool selection degradation when context overflows. Operators need visibility to switch embedding models or disable filtering.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/semantic_tool_filter.py#L286-L335
  - what: "\"tool_router is None\" means the startup build of the semantic index failed (logging the error), so filter_tools returns all tools without attempting to match. No context window error was stored; that is a separate condition."
    why: Startup failures are logged separately. If build fails, filtering cannot work and must degrade gracefully. Context window overflow is a specific case that raises.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/semantic_tool_filter.py#L299-L301
  - what: _ensure_tools_indexed uses an async lock to guard concurrent adds of request-time tools, preventing races when multiple requests arrive for authenticated servers before indexing completes.
    why: betterlite may run multiple concurrent requests. The lock ensures the tool map and router remain consistent when one request adds tools another request is querying.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/semantic_tool_filter.py#L224-L259

out_of_scope:
  - Hook registration and request preprocessing; the hook that calls filter_tools comes in B4686.
  - MCP server discovery, tool fetching and tool expansion; those come from B4680 and B4683.
  - Configuration loading; this task receives parameters at initialization and raises on invalid inputs.
  - Tool invocation and execution; tool matching is for filtering only, not execution.
  - The semantic-router library itself; B327 owns the router infrastructure and this task uses it.

pitfalls:
  - "_name_matches_canonical allows both _ and - as separators because clients use either regardless of MCP_TOOL_PREFIX_SEPARATOR configuration. A check for separator in canonical prevents false matches on unrelated names that happen to end the same way."
  - "_ensure_tools_indexed acquires a lock only after checking for missing tools. The check is allocation-free (single pass) and the lock is released as soon as new tools are added."
  - "build_router_from_mcp_registry fetches from every server without auth checks, so request-time indexing (_ensure_tools_indexed) adds authenticated tools later. Mixing startup and request-time tools requires careful error scoping so one user's embedding failure does not affect others."
  - "Context window errors have two stages: build (startup, shared error state) and request-time indexing (per-request, no shared state). Both must raise ToolFilterContextWindowError with the appropriate stage name."
  - "Deduplication in _get_tools_by_names uses object identity (id() in Python, pointer equality in Rust) to prevent returning the same tool twice when multiple canonical names alias the same tool object."
  - "filter_tools returns all tools on match failure (semantic router returns no matches), not an empty list. This preserves functionality when the semantic index degrades."

review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
