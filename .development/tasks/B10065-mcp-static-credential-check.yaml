id: B10065
title: MCP static credential check
description: >-
  A static-mode MCP server (auth_type api_key, bearer_token, token, authorization or basic) must not reach its upstream without a usable credential in a header its mode reads; otherwise a misconfigured server connects unauthenticated and the upstream's 401 vanishes into an empty tool list. LiteLLM runs one check from outbound_credentials/adapter.py for this in two places: prepare_mcp_client before a server's first request (B4667) and every OpenAPI tool call before its request is built (B4683). This task builds that check, so the OpenAPI tools no longer wait for the whole credential resolver.


  Layout. Module static_credential in betterlite-mcp: crates/betterlite-mcp/src/static_credential.rs, with its tests in static_credential/tests.rs. The file is an empty stub that lib.rs declares, beside B4667's outbound_credentials. It uses what main already has: McpAuthType and strip_auth_scheme in betterlite_mcp::credentials (B4741) and CredError in credential_contracts::errors (B4650).


  validate_static_credential(auth_type: McpAuthType, headers: &BTreeMap<String, String>, upstream_token_header: Option<&str>, static_header_names: &[String]) -> Result<(), CredError>. headers has the type of credentials::Request's headers, which prepare_request_auth fills, and B4683 hands in its merged tool-call headers. A mode outside the five static ones returns Ok without reading anything. For a static mode the default header is "X-API-Key" for api_key and "Authorization" for the other four. The slots are the lowercased names of upstream_token_header (or the default header when it is None), the default header, "Authorization", and for api_key alone every name in static_header_names. Each header whose lowercased name is a slot counts, with its value trimmed, and one usable value is enough. With none the answer is CredError::Misconfigured naming the mode's config spelling, for example "api_key requires a usable upstream credential".


  Whether a value is usable is LiteLLM's _usable_credential_value, private here, with the rules in this order. An empty value is not. For api_key, any header other than authorization is. A bare scheme word (bearer, basic, token or apikey, in any case) is not. For api_key in authorization, a first word of bearer, token or apikey needs a credential after it: strip_auth_scheme with that word, trimmed, must not be the same word again in any case, and any other first word falls through to the last rule. For bearer_token and token, strip_auth_scheme with "Bearer" or "token", trimmed, must be non-empty and not that word again. For basic, the value must split on its first whitespace run into exactly two parts, the first "basic" in any case, and the second must be strict base64 (Python's b64decode with validate=True: no characters outside the alphabet, correct padding) whose bytes, trimmed of ASCII whitespace, contain a colon. Anything else is usable, which covers authorization mode.


  This task parses no outside bytes of its own: the header values come from config and from the prepared request, and the base64 crate the workspace already uses does the decoding.


  Oracle. Helper cases on the b10065 operation; no route reaches this code yet, and the MCP manager that calls prepare_mcp_client adds the HTTP cases. The Python adapter calls the pinned validate_static_credential with MCPAuth(auth_type), the case's headers, upstream_token_header and static_header_names and reports ok or the CredError tag; the Rust side reports the same from the result. Cases never compare the error text.
scope:
  paths:
    - crates/betterlite-mcp/src/static_credential.rs
    - crates/betterlite-mcp/src/static_credential/**
    - tools/oracle/cases/helpers/static-credential/**
    - tools/oracle/fuzz/corpus/helper_case/static-credential-*
    - tools/oracle/helpers/b10065.py
    - tools/oracle/helpers/b10065/**
    - tools/oracle/src/helpers/mcp/b10065.rs
    - tools/oracle/src/helpers/mcp/b10065/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/adapter.py#L392-L447
    why: Owned. _STATIC_MODES, _usable_credential_value and validate_static_credential with its slot set.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/adapter.py#L450-L460
    why: Call site. prepare_mcp_client runs the check on the prepared request and raises through raise_public, in B4667's code.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/openapi_to_mcp_generator.py#L509-L521
    why: Call site. Each OpenAPI tool call runs the check on its merged headers, in B4683's code.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L96-L108
    why: strip_auth_scheme, which B4741 already ported; it returns the value unchanged when no credential follows the scheme.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp.py#L41-L53
    why: The MCPAuth values, whose config spelling the refusal names.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/unit/proxy/_experimental/mcp_server/outbound_credentials/test_adapter.py#L44-L75
    why: LiteLLM's own cases for the check, a good base for the helper cases.
dod:
  - text: A mode outside the five static ones passes whatever the headers hold.
    proof: [static-tests, oracle, helper-python]
  - text: api_key takes any non-empty value outside Authorization, an admin static header included, and in Authorization refuses a bare scheme word and a scheme word followed by itself.
    proof: [static-tests, oracle, helper-python]
  - text: bearer_token and token need a credential after their own scheme word, and authorization takes any value that is not a bare scheme word.
    proof: [static-tests, oracle, helper-python]
  - text: basic needs the basic word and strict base64 of text that holds a colon.
    proof: [static-tests, oracle, helper-python]
  - text: Only slot headers count, compared in lowercase with trimmed values, and static header names count for api_key alone.
    proof: [static-tests, oracle, helper-python]
  - text: A refusal is CredError::Misconfigured and names the mode.
    proof: [static-tests, oracle, helper-python]
  - text: The b10065 adapter passes the strict Python checks and a new helper seed names the operation.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: static-tests
      why: The slot, scheme, basic or non-static mode tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^static_credential::tests::/)'
    - id: helper-python
      why: The b10065 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10065.py tools/oracle/helpers/b10065)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10065 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/static-credential-*")" &&
        grep -lE 'b10065"?:' tools/oracle/fuzz/corpus/helper_case/static-credential-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-mcp --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/static-credential/non-static-modes.yaml
  - tools/oracle/cases/helpers/static-credential/api-key-slots.yaml
  - tools/oracle/cases/helpers/static-credential/api-key-authorization-schemes.yaml
  - tools/oracle/cases/helpers/static-credential/bearer-and-token.yaml
  - tools/oracle/cases/helpers/static-credential/basic-values.yaml
  - tools/oracle/cases/helpers/static-credential/authorization-mode.yaml
deviations: []
out_of_scope:
  - "prepare_mcp_client, raise_public and every other function in outbound_credentials/adapter.py: B4667, which calls this check from prepare_mcp_client."
  - "The OpenAPI tool call that runs this check on its merged headers and returns OpenApiToolError::Credential: B4683."
  - "strip_auth_scheme and McpAuthType: B4741, on main. CredError: B4650, on main."
pitfalls:
  - "In Authorization under api_key, \"Bearer token\" is usable because its credential is \"token\", while \"Bearer Bearer\" is not; under X-API-Key the same \"Bearer Bearer\" is usable, since only the authorization header gets the scheme checks."
  - "\"Custom Custom\" in Authorization under api_key is usable: only bearer, token and apikey as the first word trigger the repeated-word test."
  - "static_header_names count only for api_key, so a bearer_token server whose static header apikey holds a key still fails the check."
  - "\"Basic dXNlcg==\" decodes to user with no colon and is not usable, and the bare base64 of user:pass without the Basic word is not usable either."
  - "A header present twice under different letter cases is two values here, and either one being usable passes; don't collapse them before checking."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
