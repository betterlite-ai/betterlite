deviations:
  - what: The Responses and Anthropic shape readers are one function over JSON values, and the Responses side reads a non-string name or arguments the way the Anthropic side does (None and empty).
    why: LiteLLM declares the Responses chunk as a TypedDict with a string name and arguments, so a declared input reads the same on both sides, and docs/compatibility.md leaves the undeclared inputs to Python.
  - what: Conversion errors from the Responses converters propagate as a typed error instead of a raw Python exception.
    why: Each fallible module owns a thiserror enum (rule typed-errors); the HTTP result of a failing request is decided by the handler tasks that call these helpers.
out_of_scope:
  - "B3671 owns the Responses process_input_messages, _apply_guardrailed_texts, _extract_guardrail_inputs, _written_back_request_fields, _patched_request_fields, _patch_or_convert_request_fields, _RequestFields, _ExtractedInputs, scannable_instructions, _input_item_role, extract_request_tool_names, get_structured_messages, _apply_guardrailed_tools_to_data, _extract_input_text_and_images, _apply_guardrail_responses_to_input, process_output_response, _write_tool_call_rewrites_to_output and the output extraction and write-back helpers. They call this task's provenance and shape helpers."
  - "B3672 owns the Responses process_output_streaming_response, _deliver_ended_stream_tool_call_rewrites, _tool_call_ids_by_item_id, _tool_call_event_call_id, _write_tool_call_item, _write_event_field, the stream event sync and spread helpers, the scan key, the ended-stream check and the tool call payload and event type constants. They call this task's tool_call_rewrite and undeliverable reason."
  - "B3673 owns the Responses block events, the blocked payload types, the open item state helpers, _next_stream_sequence_number, ResponseOutputEnvelope and ResponsesStreamChunk, and the Anthropic block continuation and SSE event helpers."
  - "B3674 owns the Anthropic write-back helpers (_write_back_system_block, _write_back_message_text, _rewritten_tool_use_input, _write_back_tool_use, _apply_guardrail_responses_to_input, _apply_guardrail_tool_calls_to_input, _write_back_structured_messages and the system hoisting and folding helpers). They use this task's targets and shapes."
  - "B3675 owns the Anthropic process_input_messages, the text, image and tool_result extractors, extract_request_tool_names, process_output_response and the output extraction helpers. B3676 owns the Anthropic streaming and SSE rewrite helpers (_SSEFieldRewrite and its rewriters)."
  - "The Anthropic typing helpers _as_str_mapping, _content_block_at, _ModelDumpBlock, _TextAttrBlock, _WritableMessage and _as_writable only narrow Python types and have no Rust counterpart."
  - "The model_dump and getattr branches of _tool_call_output_item_mapping, _last_message_role and _returned_tool_call_shape read Python objects beyond the declared JSON shapes; docs/compatibility.md leaves them out."
  - "B909 owns transform_responses_api_input_to_messages and B917 owns convert_chat_completion_messages_to_responses_api; this task only calls them."
  - "B3663 owns stream_item_field, stream_item_fingerprint and stream_item_items."
pitfalls:
  - A function_call that follows assistant text or another function_call joins that assistant message, so provenance marks its message tainted and a guardrail edit to it cannot be written back to one item.
  - The role carried into the next item is the last role seen, so an item that converts to zero messages (for example an empty-content item) does not reset it.
  - Provenance converts with an empty request, so `instructions` never contribute a message here; B3671 passes the messages without the instruction row and offsets by one itself.
  - "`item_rewrite_field` treats `type: null` like a missing type, because LiteLLM reads it with `.get`, and a typed item with an unknown string type has no rewrite field."
  - "`rewritten_input_item` takes only the one field from the converted item, so a guardrail that changes a row's role does not change the item's `type` or `call_id`."
  - 'A returned tool call with `"arguments": null` fails validation, since the field is a string with an empty default and null is not a string. The whole returned list is then ignored, not just that call.'
  - "`post_guardrail_tool_call_shapes` returns early with no warning when nothing was scanned, so a guardrail that adds calls to an empty scan is ignored silently."
  - "`tool_call_rewrite` stores None for an unchanged name on purpose: the writer then leaves the item's `name` alone and only replaces `arguments` (or `input` for `custom_tool_call`)."
  - "The undeliverable reason text must name the missing call ids sorted and joined by a comma and a space, because the pipeline executor puts the text in its log."
  - "The Anthropic reader accepts a missing name or arguments as None and empty without a warning, unlike the Responses reader, which warns and falls back; keep the two call sites on their own behavior."
  - "`is_client_tool_use` requires an object `input`; a tool_use block whose input is a string or null is skipped by the scan and so is never rewritten."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 3
