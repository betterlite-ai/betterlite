id: B3670
title: Native request provenance and tool rewrite identity
description: >-
  Build the pure helpers that the Responses and Anthropic guardrail handlers share
  for two jobs: telling a tool call before a guardrail from the same call after it,
  and finding which raw Responses input item each chat message came from. The
  handler tasks (B3671 to B3676) call these helpers and never reimplement them.
  Nothing here talks to a guardrail, a provider or the network.

  Tool call identity goes in crates/betterlite-server/src/guardrails/tool_call_identity.rs.
  `ToolCallShape { name: Option<String>, arguments: String }` derives Clone, Debug,
  PartialEq and Eq, because the handlers decide "was this call rewritten" by comparing
  the shape before the guardrail with the shape after it. `tool_call_shapes(tool_calls:
  &[serde_json::Value]) -> Vec<ToolCallShape>` reads `function.name` (a string, else
  None) and `function.arguments` (a string, else empty) from each call and never fails.
  A call that is not an object, or has no `function` object, becomes
  `ToolCallShape { name: None, arguments: "" }`. The Responses and Anthropic handlers
  both have a private `_tool_call_shapes`; they are one function here.
  `post_guardrail_tool_call_shapes(returned: Option<&[serde_json::Value]>, pre:
  &[ToolCallShape], guardrail_name: Option<&str>) -> Vec<ToolCallShape>` returns `pre`
  unchanged when `pre` is empty (no warning). Otherwise it returns `pre` and logs one
  warn-level event when `returned` is `None` or has a different length, and again when
  any returned call fails validation. A returned call is valid when it is an object
  with a `function` object whose `name` is a string or null (or missing) and whose
  `arguments` is a string (or missing, which means empty). Other keys are ignored. One
  invalid call drops the whole returned list back to `pre`, so `"arguments": null`
  counts as invalid. `tool_call_rewrite(before, after) -> ToolCallShape` keeps `after`'s
  name only when it differs from `before`'s name, else None, and always keeps `after`'s
  arguments. `undeliverable_tool_call_rewrite_reason(call_ids: &[String],
  tool_call_item_count: usize, post_guardrail_tool_call_count: usize,
  unresolved_argument_event: bool, rewritten_call_ids: &BTreeSet<String>,
  event_call_ids: &BTreeSet<String>) -> Option<UndeliverableRewriteReason>` is a typed
  enum with a Display text. It checks in this order and returns the first hit: some
  tool call items have no call_id; a call_id repeats; the guardrail returned a
  different number of calls than there are call ids; a tool call argument event names an
  item_id that no output_item event introduced; a rewritten call_id appears in no stream
  event (the text lists the missing ids sorted and joined by ", "). The enum is this
  module's error type and lives in its own file with `thiserror`.

  Request provenance goes in
  crates/betterlite-server/src/guardrails/responses_translation/input_provenance.rs.
  It answers: for a Responses `input` list and the chat messages converted from it,
  which message came from which item, and which messages cannot be traced to one item.
  `input_item_provenance(raw_input: &[serde_json::Value], expected_messages:
  &[ChatMessage]) -> Result<Option<InputProvenance>, InputProvenanceError>` where
  `ChatMessage` is the message type B909's converter returns, and
  `InputProvenance { item_for_message: BTreeMap<usize, usize>, tainted: BTreeSet<usize> }`.
  It returns `Ok(None)` when any item is not a JSON object. Otherwise it converts every
  item alone with B909's input-to-messages function (its tests call it `message_inputs`;
  pass an empty request, so no instructions, and replay_reasoning false), and converts
  the whole list. If the whole conversion is not equal to `expected_messages` (typed
  equality, message by message), it returns `Ok(None)`. Then it groups items into units
  with `provenance_unit_bounds`: item 0 starts a unit, and so does any later item
  unless it is a `function_call` or `custom_tool_call` item and the last known message
  role before it is "assistant". The last known role is the role of the last message of
  the nearest earlier item that produced any message, so an item that produces no
  message passes the earlier role along. A tool call that follows assistant output joins
  that assistant message, so its unit has more than one item. A one-item unit uses its
  alone conversion; a longer unit is converted as a slice of `raw_input`. If the unit
  messages joined together are not equal to the whole conversion, return `Ok(None)`.
  The result maps every message of a one-item unit to that item's index in
  `item_for_message`, and puts every message of a longer unit in `tainted`. Conversion
  failures from B909 propagate as `InputProvenanceError::Conversion` with `#[source]`;
  they are never turned into `Ok(None)`.

  The same file holds the per-item predicates and the item patch.
  `item_rewrite_field(item: &serde_json::Map<String, Value>) -> Option<&'static str>`:
  an item with no `type` (or `type: null`) rewrites "content" if the key `content` is
  present, else nothing; a `type` that is not a string rewrites nothing; `function_call_output`
  and `custom_tool_call_output` rewrite "output"; `message` rewrites "content"; every
  other type rewrites nothing. `rewritten_input_item(item, rewritten: &Value) ->
  Result<Option<Map<String, Value>>, InputProvenanceError>` returns `Ok(None)` when the
  item has no rewrite field or `rewritten` is not an object. If the item's field and
  `rewritten.content` are both strings it returns a copy of the item with that field set
  to the new string. Otherwise it converts `[rewritten]` back to Responses input items
  with B917's chat-to-Responses conversion, requires exactly one resulting object,
  takes that object's value for the same field, and returns a copy of the original item
  with the field replaced. A missing or null converted value gives `Ok(None)`.
  `is_tool_call_item(item)` is true for an object whose `type` is `function_call` or
  `custom_tool_call`. `tool_call_output_item_mapping(item) -> Option<&Map>` and
  `is_tool_call_output_item(item)` accept the same two types. The constants
  `TOOL_CALL_ITEM_TYPES` and `PATCHABLE_ITEM_FIELDS` (`function_call_output` to
  "output", `custom_tool_call_output` to "output", `message` to "content") are
  `pub(super)` here, and the streaming task reads `TOOL_CALL_ITEM_TYPES` from this
  file. `last_message_role(messages) -> Option<&str>` returns the last message's role
  when it is a string.

  The Anthropic request types go in
  crates/betterlite-server/src/guardrails/anthropic_translation/scan_targets.rs. They
  say where a scanned piece of text or a scanned tool call sits in the request, so a
  rewrite can be written back to the same place. `MessageTextTarget` is an enum:
  `MessageContent { msg_idx }`, `ContentBlockText { msg_idx, content_idx }`,
  `ToolResultString { msg_idx, content_idx }`, `ToolResultBlockText { msg_idx,
  content_idx, block_idx }`. `InputWriteBackTarget` is `SystemString`,
  `SystemBlockText { block_idx }` or `Message(MessageTextTarget)`. `ToolUseInputTarget
  { msg_idx, content_idx }`. `ScannedText { text: String, target: InputWriteBackTarget }`,
  `ScannedToolCall { tool_call: serde_json::Value, target: ToolUseInputTarget }` and
  `ExtractedInput { scanned: Vec<ScannedText>, images: Vec<String>, tool_calls:
  Vec<ScannedToolCall> }` with `ExtractedInput::empty()` for LiteLLM's
  `EMPTY_EXTRACTED_INPUT`. All derive Clone, Debug, PartialEq, Eq (Eq only where the
  fields allow it). `is_client_tool_use(block: &Map<String, Value>) -> bool` is true
  when `type` is "tool_use", `id` and `name` are strings and `input` is an object.
  A tool_use block without an object `input` is not scanned.

  Raw Responses items and guardrail-returned rows are JSON that betterlite does not
  model, so `serde_json::Value` is allowed at those boundaries only, one `#[expect]`
  per module with its reason (the budget below allows three). Tool call chunks and
  guardrail rows are read through `stream_item_field` from B3663 where LiteLLM does.

  Tests live in `tests.rs` of each module. Name them so the filters below match:
  `provenance_*`, `rewrite_field_*`, `rewritten_item_*`, `item_predicate_*` in
  input_provenance; `shape_*`, `post_guardrail_*`, `rewrite_*`, `undeliverable_*` in
  tool_call_identity; `target_*`, `extracted_input_*`, `client_tool_use_*` in scan_targets.
scope:
