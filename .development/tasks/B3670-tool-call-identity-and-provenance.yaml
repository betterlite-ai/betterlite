dod:
  - text: >-
      input_item_provenance maps each message from a one-item unit to its item index, puts
      messages of a multi-item unit in tainted, and returns None when an item is not an
      object or when the whole conversion differs from the expected messages.
    proof: [provenance-tests, oracle]
  - text: >-
      A function_call or custom_tool_call item that follows assistant output starts no
      new unit (its message is tainted), and one that follows a tool message or a user
      message does start one. An item that produces no message passes the earlier role on.
    proof: [provenance-unit-tests, oracle]
  - text: >-
      A conversion error from the Responses converter propagates as a typed error and is
      never reported as an untraceable input.
    proof: [provenance-error-tests]
  - text: >-
      item_rewrite_field returns content for an untyped item with a content key, output
      for the two tool output types, content for message, and nothing for any other or
      non-string type.
    proof: [rewrite-field-tests, oracle]
  - text: >-
      rewritten_input_item swaps a string field for a string, converts other rewritten rows
      through the chat-to-Responses converter, and returns None for a non-object rewrite, a
      type with no rewrite field, a conversion with other than one item, or a null value.
    proof: [rewritten-item-tests, oracle]
  - text: >-
      is_tool_call_item, tool_call_output_item_mapping and is_tool_call_output_item accept
      exactly function_call and custom_tool_call objects, and last_message_role returns
      only a string role of the last message.
    proof: [item-predicate-tests]
  - text: >-
      tool_call_shapes reads name and arguments from objects, with a non-string name as None
      and a non-string or missing arguments as empty, and never fails on a non-object call.
    proof: [shape-tests, oracle]
  - text: >-
      post_guardrail_tool_call_shapes returns the pre-guardrail shapes, with a warning,
      for a missing or different-length returned list and for any invalid returned call,
      and returns the validated shapes otherwise. An empty pre list returns early with no
      warning.
    proof: [post-guardrail-tests, oracle]
  - text: >-
      tool_call_rewrite keeps the new name only when it changed and always keeps the new
      arguments.
    proof: [rewrite-tests, oracle]
  - text: >-
      undeliverable_tool_call_rewrite_reason returns the first of its five checks in
      LiteLLM's order, lists missing call ids sorted, and returns None when all pass.
    proof: [undeliverable-tests, oracle]
  - text: >-
      The Anthropic target, scanned text, scanned tool call and extracted input types
      exist with LiteLLM's fields, ExtractedInput::empty has no entries, and
      is_client_tool_use requires tool_use, a string id, a string name and an object input.
    proof: [scan-target-tests, oracle]
checks:
  optional: []
  commands:
    - id: provenance-tests
      why: provenance maps, the null results or the typed equality check are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::input_provenance::tests::provenance_(maps|null)/)'
    - id: provenance-unit-tests
      why: unit bounds for tool call items, or the carried role, are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::input_provenance::tests::provenance_unit/)'
    - id: provenance-error-tests
      why: a converter error is swallowed as an untraceable input
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::input_provenance::tests::provenance_error/)'
    - id: rewrite-field-tests
      why: the rewrite field choice by item type is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::input_provenance::tests::rewrite_field_/)'
    - id: rewritten-item-tests
      why: the patched item for string and converted content is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::input_provenance::tests::rewritten_item_/)'
    - id: item-predicate-tests
      why: the tool call item predicates or the last role read are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::input_provenance::tests::item_predicate_/)'
    - id: shape-tests
      why: tool_call_shapes tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::tool_call_identity::tests::shape_/)'
    - id: post-guardrail-tests
      why: the returned-call validation and fallback tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::tool_call_identity::tests::post_guardrail_/)'
    - id: rewrite-tests
      why: the name-only-when-changed rewrite tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::tool_call_identity::tests::rewrite_/)'
    - id: undeliverable-tests
      why: the order of the five undeliverable checks is not tested
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::tool_call_identity::tests::undeliverable_/)'
    - id: scan-target-tests
      why: the Anthropic target types or the client tool_use test are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::anthropic_translation::scan_targets::tests::/)'
    - id: helper-cases-added
      why: the helper cases for this task were not added on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/guardrail-request-provenance)"
