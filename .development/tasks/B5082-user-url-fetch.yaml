id: B5082
title: SSRF-checked fetch of user-supplied URLs
description: >-
  LiteLLM downloads URLs that arrive in requests (image and file URLs, RAG file_url, guardrail http_request, PointFive presigned URLs) through safe_get and async_safe_get in litellm/litellm_core_utils/url_utils.py. Each hop resolves the host, refuses private and cloud-internal addresses unless the admin allowlisted the host, pins plain HTTP to the checked IP and follows redirects by hand. Build the same thing in a new betterlite-http module, crates/betterlite-http/src/user_url.rs and user_url/**, so B5083 (media), B227 (Bedrock images) and the other callers can fetch user URLs the way LiteLLM does. This replaces B009's old "user-URL downloads are unavailable" plan (Max, 2026-10-31).


  Settings. Add the config section user_url_policy (crates/betterlite-config/src/sections/user_url_policy.rs and user_url_policy/**). LiteLLM keeps two module globals, user_url_validation (default True) and user_url_allowed_hosts (default []), at litellm/__init__.py L330-331. litellm_settings sets them raw through the generic setattr branch (proxy_server.py L6620-6628), and the fetch code reads user_url_validation by Python truthiness, so false, null, 0, "" and an empty list or mapping turn validation off and any other value, the string "false" included, keeps it on. general_settings is applied after that through _apply_ssrf_general_settings (L4847-4858, called at L6879): user_url_allowed_hosts replaces the list whenever the key is present (null means an empty list), and user_url_validation goes through _normalize_user_url_validation (L4839-4844): null changes nothing, a string goes through str_to_bool (strip, lowercase, "true" or "false", anything else changes nothing) and any other value through Python bool(). os.environ/ references resolve the way the rest of the config does. The section exposes the final flag and host list as config.sections.user_url_policy.


  validate_url(url) returns the URL to connect to and the Host header, or an SSRF error with LiteLLM's exact text. Split the URL with the rules of Python's urllib.parse.urlparse, not WHATWG: the scheme must be http or https ("URL scheme '{scheme}' is not allowed"), the hostname is lowercased and must be non-empty ("URL has no hostname"), and the effective port is the explicit port or 443 for https and 80 otherwise. The Host header is the hostname, bracketed when it holds ":", plus ":{port}" only when the port differs from the scheme default. Resolve the hostname with the system getaddrinfo (port, IPPROTO_TCP, any family); a resolver error gives "DNS resolution failed for '{host}': {error}" and an empty answer "No addresses found for '{host}'". Unless the host is allowlisted, every resolved address is checked and the first blocked one fails with "URL targets a blocked address ({ip}). If this is a legitimate internal service, add the host to `user_url_allowed_hosts` in litellm_settings." For https with ssl_verify not false (B172's setting), return the URL unchanged. Otherwise rebuild it with the first resolved address as host (bracketed for IPv6), the explicit port only if the URL had one, and the original path, params and query, dropping the fragment and any userinfo.


  An address is blocked when it doesn't parse, or when, after unwrapping an IPv4-mapped IPv6 address, it is not global by the tables of Python 3.13's ipaddress module (the Python the oracle runs) or is multicast, or falls in 168.63.129.16/32 or 192.0.0.0/24. The allowlist matches when "{host}" or "{host}:{port}" (IPv6 bracketed) equals an entry lowercased with trailing dots stripped; empty entries are skipped. An allowlisted host is still resolved and still pinned for plain HTTP; only the address check is skipped.


  fetch (safe_get and async_safe_get, one async function here) takes a client from B173, the URL and the caller's headers. When validation is off it sends one GET that follows redirects the way httpx does (at most 20) with no checks. When it is on, it loops at most 10 times: validate_url, GET the returned URL with the caller's headers plus Host set to the returned header and redirects off, return the response when its status is not 3xx, and otherwise join the Location header against the URL before rewriting the way httpx.URL.join does (Python's urllib.parse.urljoin over the httpx-normalized URLs). The returned response is B173's streamed response with its body unread, so each caller sets its own size limit. An empty or missing Location on a 3xx fails with "Redirect response has no Location header", and a tenth 3xx fails with "Too many redirects". Errors keep two kinds apart, because callers answer them differently: SSRF errors with the texts above, and URL parse errors (an unclosed IPv6 bracket, a port that isn't a number or is out of range) that LiteLLM raises as a plain ValueError.


  Tests. user_url::tests::validate_url_matches_litellm covers schemes, no host, Host header forms, https kept, http and ssl_verify-off rewrite, userinfo, fragment and allowlist forms. user_url::tests::blocked_addresses_follow_python_313 walks the IPv4 and IPv6 tables, both exception networks, IPv4-mapped addresses and multicast. user_url::tests::redirect_hops_are_validated and user_url::tests::unvalidated_fetch_follows_redirects run against a local server on 127.0.0.1 with 127.0.0.1 allowlisted. sections::user_url_policy::tests::settings_follow_litellm_precedence loads both settings from litellm_settings and general_settings. Add a cargo-fuzz target user_url over the URL splitter with a committed corpus. The skeleton gives this task the helper operation b5082. Its input is either `{call: validate_url, url, user_url_allowed_hosts, ssl_verify}`, where the Python side sets litellm.user_url_allowed_hosts and litellm.ssl_verify for the call and restores them after, or `{call: blocked_ip, addresses: [...]}`, which returns one _is_blocked_ip boolean per address.
scope:
  paths:
    - crates/betterlite-http/src/user_url.rs
    - crates/betterlite-http/src/user_url/**
    - crates/betterlite-http/Cargo.toml
    - crates/betterlite-http/fuzz/Cargo.toml
    - crates/betterlite-http/fuzz/fuzz_targets/user_url.rs
    - crates/betterlite-http/fuzz/corpus/user_url/**
    - crates/betterlite-config/src/sections/user_url_policy.rs
    - crates/betterlite-config/src/sections/user_url_policy/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/user-url-*
    - tools/oracle/cases/helpers/user-url/**
  lint_tables: false
references:
