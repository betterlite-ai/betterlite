  - mutants
  commands:
  - id: case-nova-default-purpose-dimensions
    why: The constructor is a no-op; supported params contain only dimensions, which maps to embedding_dimension.
      Build schemaVersion=nova-multimodal-embed-v1 and taskType SINGLE_EMBEDDING or SEGMENTED_EMBEDDING according
      to async_invoke_route. Copy inference params, remove output_s3_uri, then dimensions wins over embedding_dimension
      and overwrites embeddingDimension; when dimensions wins, leave a simultaneous embedding_dimension untouched.
      Insert embeddingPurpose=GENERIC_INDEX and embeddingDimension=3072 only when keys are absent, preserving explicit
      None and falsey values. Preserve other inference keys in singleEmbeddingParams or segmentedEmbeddingParams.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_default_purpose_dimensions$/)'
  - id: case-nova-text-image-audio-video
    why: When none of text,image,video,audio is present, plain strings including https URLs become text.value with
      truncationMode=END; s3:// strings become text.source.s3Location.uri with truncationMode=END. Lowercase image/,video/,audio/
