  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/nova_embeddings.rs
  - crates/betterlite-bedrock/src/nova_embeddings/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_other_nova_embeddings.rs
  - tools/oracle/src/helpers/bedrock_other_nova_embeddings/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_other_nova_embeddings.py
  - tools/oracle/cases/helpers/providers/bedrock-other-nova-embeddings/**
