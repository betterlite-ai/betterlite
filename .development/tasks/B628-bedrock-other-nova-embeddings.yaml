      Preserve all remaining commas in payload. Only image format jpg is rewritten to jpeg; accept an empty format/payload
      and arbitrary payload bytes represented as text.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_data_url_jpg$/)'
  - id: case-nova-explicit-media-input
    why: Presence of any text,image,video,audio key suppresses input inference even when its value is None, and
      multiple explicitly supplied modalities are retained. Do not parse a malformed data URL in this branch or
      validate S3 descriptors.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_explicit_media_input$/)'
  - id: case-nova-async-output-s3-required
    why: Async mode alone creates segmentedEmbeddingParams; wrap only when model_id is truthy. Percent-decode the
      model using B171 URI decoding, and only if it then starts async_invoke/ remove every occurrence of that substring.
      Require a truthy output_s3_uri whose stripped value is nonempty, else ValueError output_s3_uri is required
      for async invoke requests. Preserve surrounding whitespace and non-S3 strings when nonempty. Emit modelId,modelInput,outputDataConfig.s3OutputDataConfig.s3Uri.
      The removed inference output_s3_uri never substitutes for the argument.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_async_output_s3_required$/)'
  - id: case-nova-result-index-token-estimate
    why: For each response, an embeddings list takes precedence over direct embedding, including an empty list;
      skip entries lacking embedding. Otherwise use direct embedding if present; ignore responses with neither.
      Flatten retained vectors to contiguous indices/object=embedding/model unchanged. Estimate each listed vector
      from truncatedCharLength//4 by key presence, otherwise len(embedding)//4; direct vectors always use length.
      Preserve malformed field errors rather than inventing token validation. Usage prompt_tokens and total_tokens
      equal the sum; completion_tokens uses the shared Usage default. Count image key presence in batch singleEmbeddingParams,
      falling back to segmentedEmbeddingParams only when the first key is absent, without unwrapping modelInput.
      Include image_count details only when positive.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_result_index_token_estimate$/)'
  - id: case-nova-invocation-arn
    why: Async replies always contain one index-0 object=embedding with an empty vector and zero prompt/total usage.
      Store response.get(invocationArn, empty string) in HiddenParams._invocation_arn, preserving explicit None,
      and preserve model. Do not expose an invented embedding_job_id object string.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_invocation_arn$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_nova_embeddings.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_nova_embeddings*")"
      && grep -lq 'bedrock_other_nova_embeddings' tools/oracle/fuzz/corpus/helper_case/bedrock_other_nova_embeddings*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_nova_embeddings$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: Outside bytes lack replay through the actual decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/nova_data_url)"
      && grep -q 'parse_nova_data_url' crates/betterlite-bedrock/fuzz/fuzz_targets/nova_data_url.rs && cargo nextest
      run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_nova_data_url_corpus$/)'
