- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/embed/amazon_nova_transformation.py#L35-L353
  why: >-
    Own AmazonNovaEmbeddingConfig.__init__, AmazonNovaEmbeddingConfig.get_supported_openai_params, AmazonNovaEmbeddingConfig.map_openai_params,
    AmazonNovaEmbeddingConfig._parse_data_url, AmazonNovaEmbeddingConfig._transform_request, AmazonNovaEmbeddingConfig._wrap_async_invoke_request,
    AmazonNovaEmbeddingConfig._transform_response, AmazonNovaEmbeddingConfig._transform_async_invoke_response. Other
    functions in this file remain with the owners listed below.
