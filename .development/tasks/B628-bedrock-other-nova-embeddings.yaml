      holding the untouched payload; unknown MIME types become text containing the entire original data URL. No
      base64 decoding or network access occurs.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_text_image_audio_video$/)'
  - id: case-nova-data-url-jpg
    why: 'parse_nova_data_url requires a case-sensitive data: prefix and a comma; otherwise raise ValueError Invalid
      data URL format: {first_50_characters}... or Invalid data URL format (missing comma): {first_50_characters}....
