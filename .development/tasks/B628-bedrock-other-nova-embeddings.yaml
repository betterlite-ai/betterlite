checks:
  optional:
  - mutants
  commands:
  - id: case-nova-default-purpose-dimensions
    why: The nova-default-purpose-dimensions behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_default_purpose_dimensions$/)'
  - id: case-nova-text-image-audio-video
    why: The nova-text-image-audio-video behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_text_image_audio_video$/)'
  - id: case-nova-data-url-jpg
    why: The nova-data-url-jpg behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_data_url_jpg$/)'
  - id: case-nova-explicit-media-input
    why: The nova-explicit-media-input behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_explicit_media_input$/)'
  - id: case-nova-async-output-s3-required
    why: The nova-async-output-s3-required behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_async_output_s3_required$/)'
  - id: case-nova-result-index-token-estimate
    why: The nova-result-index-token-estimate behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_result_index_token_estimate$/)'
  - id: case-nova-invocation-arn
    why: The nova-invocation-arn behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_embeddings_cases::case_[0-9]+_nova_invocation_arn$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_nova_embeddings.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_nova_embeddings*")"
      && grep -lq 'bedrock_other_nova_embeddings' tools/oracle/fuzz/corpus/helper_case/bedrock_other_nova_embeddings*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_nova_embeddings$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
