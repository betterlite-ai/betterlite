out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_other_nova_embeddings in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/other_nova_embeddings.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_other_nova_embeddings.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An explicitly present empty embeddings list suppresses a direct embedding in the same Nova response.
- An output_s3_uri inside inference parameters is removed but never used as the async wrapper argument.
