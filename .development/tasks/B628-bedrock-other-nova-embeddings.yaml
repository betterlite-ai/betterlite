id: B628
title: Bedrock Nova multimodal embeddings
description: >-
  Add NovaEmbeddingRequest/Reply with SINGLE_EMBEDDING and SEGMENTED_EMBEDDING variants, default embeddingPurpose=GENERIC_INDEX
  and embeddingDimension=3072. Preserve data-URL format extraction, S3 source descriptors, async invoke wrapper,
  ordered result indexing and usage approximation exactly as source. An S3 descriptor is forwarded to AWS, not fetched
  by this mapping task.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/amazon_nova_transformation.py:
  AmazonNovaEmbeddingConfig.__init__ L35-L36; AmazonNovaEmbeddingConfig.get_supported_openai_params L38-L41; AmazonNovaEmbeddingConfig.map_openai_params
  L43-L51; AmazonNovaEmbeddingConfig._parse_data_url L53-L84; AmazonNovaEmbeddingConfig._transform_request L86-L205;
  AmazonNovaEmbeddingConfig._wrap_async_invoke_request L207-L239; AmazonNovaEmbeddingConfig._transform_response
  L241-L317; AmazonNovaEmbeddingConfig._transform_async_invoke_response L319-L353.


  Named case contracts: nova_default_purpose_dimensions: The constructor is a no-op; supported params contain only
  dimensions, which maps to embedding_dimension. Build schemaVersion=nova-multimodal-embed-v1 and taskType SINGLE_EMBEDDING
  or SEGMENTED_EMBEDDING according to async_invoke_route. Copy inference params, remove output_s3_uri, then dimensions
  wins over embedding_dimension and overwrites embeddingDimension; when dimensions wins, leave a simultaneous embedding_dimension
  untouched. Insert embeddingPurpose=GENERIC_INDEX and embeddingDimension=3072 only when keys are absent, preserving
  explicit None and falsey values. Preserve other inference keys in singleEmbeddingParams or segmentedEmbeddingParams.
  nova_text_image_audio_video: When none of text,image,video,audio is present, plain strings including https URLs
  become text.value with truncationMode=END; s3:// strings become text.source.s3Location.uri with truncationMode=END.
  Lowercase image/,video/,audio/ MIME prefixes create that modality with format equal to the lowercased second slash
  component and source.bytes holding the untouched payload; unknown MIME types become text containing the entire
  original data URL. No base64 decoding or network access occurs. nova_data_url_jpg: parse_nova_data_url requires
  a case-sensitive data: prefix and a comma; otherwise raise ValueError Invalid data URL format: {first_50_characters}...
  or Invalid data URL format (missing comma): {first_50_characters}.... Split only the first comma, strip data:,
  and take metadata before the first semicolon, without requiring ;base64. Preserve all remaining commas in payload.
  Only image format jpg is rewritten to jpeg; accept an empty format/payload and arbitrary payload bytes represented
  as text. nova_explicit_media_input: Presence of any text,image,video,audio key suppresses input inference even
  when its value is None, and multiple explicitly supplied modalities are retained. Do not parse a malformed data
  URL in this branch or validate S3 descriptors. nova_async_output_s3_required: Async mode alone creates segmentedEmbeddingParams;
  wrap only when model_id is truthy. Percent-decode the model using B171 URI decoding, and only if it then starts
  async_invoke/ remove every occurrence of that substring. Require a truthy output_s3_uri whose stripped value is
  nonempty, else ValueError output_s3_uri is required for async invoke requests. Preserve surrounding whitespace
  and non-S3 strings when nonempty. Emit modelId,modelInput,outputDataConfig.s3OutputDataConfig.s3Uri. The removed
  inference output_s3_uri never substitutes for the argument. nova_result_index_token_estimate: For each response,
  an embeddings list takes precedence over direct embedding, including an empty list; skip entries lacking embedding.
  Otherwise use direct embedding if present; ignore responses with neither. Flatten retained vectors to contiguous
  indices/object=embedding/model unchanged. Estimate each listed vector from truncatedCharLength//4 by key presence,
  otherwise len(embedding)//4; direct vectors always use length. Preserve malformed field errors rather than inventing
  token validation. Usage prompt_tokens and total_tokens equal the sum; completion_tokens uses the shared Usage
  default. Count image key presence in batch singleEmbeddingParams, falling back to segmentedEmbeddingParams only
  when the first key is absent, without unwrapping modelInput. Include image_count details only when positive. nova_invocation_arn:
  Async replies always contain one index-0 object=embedding with an empty vector and zero prompt/total usage. Store
  response.get(invocationArn, empty string) in HiddenParams._invocation_arn, preserving explicit None, and preserve
  model. Do not expose an invented embedding_job_id object string.


  Outside-byte boundary: parse_nova_data_url consumes untrusted data-URL text from an embedding request, preserving
  source string slicing and first-comma splitting in crates/betterlite-bedrock/src/nova_embeddings.rs or its scoped
  child module. Use that production decoder from the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/nova_data_url.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_nova_data_url_corpus
  that checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Implement crates/betterlite-bedrock/src/nova_embeddings.rs with adjacent tests under nova_embeddings/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function nova_embeddings_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): nova_default_purpose_dimensions, nova_text_image_audio_video, nova_data_url_jpg, nova_explicit_media_input,
  nova_async_output_s3_required, nova_result_index_token_estimate, nova_invocation_arn. Each case exercises its
  named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_nova_embeddings* using HelperCase:
  kind: helper and the externally tagged bedrock_other_nova_embeddings variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_nova_embeddings that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 236 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 255 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 50 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
