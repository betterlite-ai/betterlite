dod:
  - text: The five run handlers send LiteLLM's method, body, query and timeout, with cancel posting `{}` and list and get sending no timeout.
    proof: [eval-run-http-tests]
  - text: Each run handler logs pre_call with LiteLLM's input and additional_args, list_runs under the `params` key.
    proof: [eval-run-http-tests]
  - text: POST and DELETE replies at 400 or above go through `_handle_error`, GET replies go to the transform, all through B9370's eval_exchange.
    proof: [eval-run-http-tests]
checks:
  optional: []
  commands:
    - id: eval-run-http-tests
      why: a run handler sends the wrong method, body, query or timeout, logs the wrong fields, or converts the wrong replies
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::eval_run_http::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The run operations that call these handlers: B3424 (create_run, list_runs) and B3425 (get_run, cancel_run, delete_run)."
  - "eval_exchange, the shared send, log and error step: B9370."
  - "_handle_error: B2402. The pooled client: B173. pre_call logging: B249. The run transforms: B3420 and B523."
pitfalls:
  - "transform_cancel_run_request and transform_delete_run_request both return a body; cancel_run_handler posts `{}` in its place and delete_run_handler sends none, so never forward the transform's body."
  - "list_runs logs the query as `params` and leaves out complete_input_dict, unlike list_evals; a shared helper that always writes complete_input_dict breaks the logged shape."
  - "The cancel URL ends in `/cancel` because transform_cancel_run_request appends it; the proxy route that leads here is POST /v1/evals/{eval_id}/runs/{run_id} without the suffix."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
