id: B9764
title: Cover skill registration and search-tool forms through the proxy
description: >-
  Add approximately 550 lines of HTTP cases for the retained skills and search-tools pages.
  These are two compact CRUD consumers, with all production logic already allocated.
  B9090 imports their components, source-parsing helpers and tests; do not build /skills
  endpoints for a page that actually manages Claude Code marketplace plugins.

  Skills inventory. ClaudeCodePluginsPanel GET /claude-code/plugins?enabled_only=false
  reads plugins[],total and each name,source,version,description,author,category,keywords,
  enabled,domain,namespace. SkillSelector uses the same false default. B993 owns this
  read; reuse B9735's search-and-skill-options case. AddPluginForm POST /claude-code/plugins
  sends {name:trimmed_name,source,version?,description?,author?:{name,email?,url?},category?,
  keywords?:[...],domain?,namespace?}. Preserve the parsed source variants
  {source:github,repo}, {source:url,url}, {source:git-subdir,url,path} and
  {source:archive,url,sha256?}, with the archive digest lowercased by the UI. The component
  invalidates the list after success, and does not install or download the plugin. DELETE
  /claude-code/plugins/{pluginName} sends no body and likewise triggers a reload. Both
  writes are B992's. There are networking helpers for enable/disable but no caller in
  these covered components at the pin, so add neither those requests nor their cases.

  Search inventory. GET /search_tools/list has no query/body, returns search_tools[]
  with search_tool_id,search_tool_name,litellm_params,search_tool_info,is_from_config and
  created/updated timestamps; reuse the same B9735 case. GET
  /search_tools/ui/available_providers reads providers[].provider_name,ui_friendly_name.
  POST /search_tools and PUT /search_tools/{id} both send the wrapper
  {search_tool:{search_tool_name,litellm_params:{search_provider,api_key},
  search_tool_info?:{description}}}. An empty description is omitted. DELETE
  /search_tools/{id} has no body. The write response is used only for success before
  reloading the list. POST /search_tools/test_connection sends
  {litellm_params:{search_provider,api_key}} and reads status,message,error_type,
  test_query,results_count; an HTTP 200 can carry status:error. B3275 builds these six
  methods and B8673 mounts them. The page does not call GET /search_tools/{id}.

  SearchToolTester POST /v1/search/{search_tool_name} sends {query,max_results:5}, reading
  results[].url,title,snippet; measured latency and history live in the client. B8275 owns
  this route and the /search/{name},/v1/search,/search aliases; B8634 mounts it. Only the
  named /v1 spelling is a request from this page. Exercise a populated result after create
  and edit, then delete. Select tavily and set TAVILY_API_BASE to the local upstream
  mock; B8021's adapter appends /search. The page body still contains only
  search_provider and api_key. Do not add api_base to a supposedly exact form request.
  Assert the test_connection upstream query is test with max_results=1, while the tester
  supplies the user's query and 5. Credential masking applies to list/get, not the create
  response; preserve B3275's actual behavior rather than promising stricter redaction.

  All these calls use the configured gateway auth header, default Authorization Bearer,
  and JSON writes use application/json. Use B860 database fixtures and HTTP setup, with
  valid names/source URLs that never cause downloads. Compare admin success and an
  ordinary user's denied mutation, plus the search connection's error-status-in-200 body.
  Keep status, type/param/code when present, content-type and stable list fields; mask
  only captured/generated IDs, timestamps and unstable human messages.

  No matching skill/search HTTP case exists on disk. B992/B993 have future general
  marketplace cases, B8673 future metadata/no-database/error cases and B8634 future
  search routes, but none supplies the page's source variants and wrapped CRUD plus
  named test sequence. Concurrent B091 plans a config-override lifecycle and Perplexity
  connection cases with caller extras; those do not pin this Tavily form's exact field
  omissions and max_results=5 tester request. B9735's shared list scenario is planned
  and is reused here.
scope:
