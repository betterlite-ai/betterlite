    why: Plugin listing and creation use marketplace routes, with enabled_only=false.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L7363-L7388
    why: Plugin deletion has no request body.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L5008-L5101
    why: Search management wrappers and connection request.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L6873-L6914
    why: Named search execution sends max_results with the user's query.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py#L277-L459
    why: Dependency-owned plugin create and list decorators and projections.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py#L727-L770
    why: Existing deletion route.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/search_endpoints/search_tool_management.py#L135-L475
    why: List, create, update and delete are B3275, including response masking differences.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/search_endpoints/search_tool_management.py#L555-L707
    why: Connection test and provider metadata decorators.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/search_endpoints/endpoints.py#L17-L240
    why: B8275's four named and body-selected search aliases.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/tavily/search/transformation.py#L49-L94
    why: Existing Tavily adapter supports TAVILY_API_BASE, keeping the form body unchanged.
dod:
  - text: Skill source variants survive registration, false-filter listing and deletion through the existing marketplace endpoints.
    proof: [skill-search-cases, oracle]
  - text: Search provider metadata, wrapped form writes, connection-test results and named query execution match the retained page's contract.
    proof: [skill-search-cases, oracle]
checks:
  optional: []
  commands:
    - id: skill-search-cases
      why: Marketplace helpers and isolated search errors do not prove the forms' actual HTTP bodies.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/skills-search)"
oracle_cases:
  - tools/oracle/cases/ui/skills-search/plugin-source-create-list-delete.yaml
  - tools/oracle/cases/ui/skills-search/provider-and-wrapped-form-lifecycle.yaml
  - tools/oracle/cases/ui/skills-search/connection-result-and-named-query.yaml
  - tools/oracle/cases/ui/skills-search/nonadmin-write-boundaries.yaml
  - tools/oracle/cases/ui/management-selectors/search-and-skill-options.yaml
deviations: []
out_of_scope:
  - B992/B993 keep every marketplace function, B3275/B8673 all management behavior and B8275/B8634 the search call pipeline.
  - All skills/search-tools page functions, selectors and tests are retained by B9090, including unused enable/disable helpers with no caller here at the pin.
  - Provider signing, external plugin installation and agent skill invocation belong to their existing provider/agent tasks, not to these forms.
pitfalls:
  - Skill creation submits source=url for a generic repository URL, not an invented git discriminator.
  - The search form wraps its payload in search_tool, while connection testing uses litellm_params at the top level.
  - A search connection error can have HTTP status 200 and must still render as an error.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
