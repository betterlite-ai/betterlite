id: B561
title: Foundry agent replies and SSE events
description: >-
  Add AgentMessage/AgentEvent decoding and OpenAI response projection. Preserve first assistant text selection,
  citations/index relocation, hidden thread id and gpt-3.5-turbo local token-count fallback with warning. Incremental
  stream parsing consumes existing SSE framing; it must yield before later events and release upstream on cancellation.
  AgentMessage is the reply record exposed by agent_requests; this decoder is independent of run execution, which
  invokes it after polling.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/agents/handler.py:
  AzureAIAgentsHandler._extract_content_from_messages L158-L175; AzureAIAgentsHandler._transform_annotations L177-L210;
  AzureAIAgentsHandler._build_model_response L212-L256; AzureAIAgentsHandler.acompletion_stream L554-L620; AzureAIAgentsHandler._process_sse_stream
  L622-L710.


  Named case contracts: assistant_first_text: Scan data in order for the first assistant text block; return its
  value (default empty string) and annotations immediately, even when that text is empty. Missing matches return
  empty content and None annotations. citation_index_relocation: Falsey annotations become None; copy url_citation
  and fill only missing nested start_index/end_index from top-level keys. Existing nested values including None
  win; other annotation types pass unchanged and order is stable. thread_id_metadata: Replace choices with one index=0
  assistant message and finish_reason=stop; set requested model and hidden thread_id, preserving other hidden keys;
  annotations use None when empty. token_count_warning: Call B196 twice with model=gpt-3.5-turbo (messages for prompt,
  text plus count_response_tokens=True for reply), sum usage; an exception logs Failed to calculate token usage:
  <error> and retains any existing usage rather than synthesizing zero. message_delta_stream: Trim each incoming
  line; event: replaces current_event and data: parses each line independently. Ignore invalid JSON and nontext/empty
  text deltas; emit one assistant chunk per nonempty text item with index=0, finish_reason=None, chat.completion.chunk,
  supplied model, one stable chatcmpl-<8 hex> id and integer created time. run_terminal_stream: thread.created records
  id. thread.message.completed accumulates every text annotation without deduplication. Run terminal/error event
  names are ignored. Only data:[DONE] emits one stop chunk with content=None and all collected annotations, attaches
  truthy thread_id then returns; EOF without DONE emits no terminal chunk. split_sse_event: Exercise network-split
  UTF-8 lines through B005 framing while retaining the pinned line-based semantics: no multiline data concatenation
  and current_event persists across blank lines. stream_thread_payload: Streaming always POSTs the B559 create-thread-and-run
  URL with assistant_id and stream=true. Only falsey thread_id adds thread.messages with user/system converted to
  user; a truthy existing id is neither sent nor used to add messages. instructions is retained by key presence;
  ssl_verify defaults None and timeout is not passed. stream_status_failure: Only 200/201 stream responses are accepted;
  otherwise await/read bytes, decode UTF-8 and raise AzureAIAgentsError with the raw status and Streaming request
  failed: <body>.


  Write standalone Rust test agent_results_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test agent_results_secret_safe_failure in betterlite-foundry: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B2202. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-foundry/src/agent_results.rs with adjacent tests under agent_results/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agent_results_cases in betterlite-foundry with these exact named cases (one per oracle file):
  assistant_first_text, citation_index_relocation, thread_id_metadata, token_count_warning, message_delta_stream,
  run_terminal_stream, split_sse_event, stream_thread_payload, stream_status_failure. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_agent_results* using HelperCase: kind:
  helper and the externally tagged foundry_agent_results variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_agent_results that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_agent_event consumes Foundry agent stream data bytes in crates/betterlite-foundry/src/agent_results.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_agent_results.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_agent_results.
  The adjacent test replays_the_foundry_agent_results_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 211 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 250 production lines, 220 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines.
