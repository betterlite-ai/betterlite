      passed.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_stream_thread_payload$/)'
  - id: case-stream-status-failure
    why: 'Only 200/201 stream responses are accepted; otherwise await/read bytes, decode UTF-8 and raise AzureAIAgentsError
      with the raw status and Streaming request failed: <body>.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_stream_status_failure$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_secret_safe_failure$/)'
