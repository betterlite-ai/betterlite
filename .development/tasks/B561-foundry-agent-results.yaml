    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_split_sse_event$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_agent_results.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_agent_results*")"
      && grep -lq 'foundry_agent_results' tools/oracle/fuzz/corpus/helper_case/foundry_agent_results* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_agent_results$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_agent_results)"
      && grep -q 'decode_agent_event' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_agent_results.rs && cargo
      nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_agent_results_corpus$/)'
