id: B561
title: Foundry agent replies and SSE events
description: >-
  Add AgentMessage/AgentEvent decoding and OpenAI response projection. Preserve first assistant text selection,
  citations/index relocation, hidden thread id and gpt-3.5-turbo local token-count fallback with warning. Incremental
  stream parsing consumes existing SSE framing; it must yield before later events and release upstream on cancellation.
  AgentMessage is the reply record exposed by agent_requests; this decoder is independent of run execution, which
  invokes it after polling.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/agents/handler.py:
  AzureAIAgentsHandler._extract_content_from_messages L158-L175; AzureAIAgentsHandler._transform_annotations L177-L210;
  AzureAIAgentsHandler._build_model_response L212-L256; AzureAIAgentsHandler.acompletion_stream L554-L620; AzureAIAgentsHandler._process_sse_stream
  L622-L710.


  Implement crates/betterlite-foundry/src/agent_results.rs with adjacent tests under agent_results/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation foundry_agent_results in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agent_results_cases in betterlite-foundry with these exact named cases (one per oracle file):
  assistant_first_text, citation_index_relocation, thread_id_metadata, token_count_warning, message_delta_stream,
  run_terminal_stream, split_sse_event. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and captured
  upstream request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_agent_results* using HelperCase: kind:
  helper and the externally tagged foundry_agent_results variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_agent_results that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_agent_event consumes Foundry agent stream data bytes in crates/betterlite-foundry/src/agent_results.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_agent_results.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_agent_results.
  The adjacent test replays_the_foundry_agent_results_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 211 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 235 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 506 planned, 525 maximum changed lines.
