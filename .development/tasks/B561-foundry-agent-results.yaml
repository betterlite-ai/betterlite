  commands:
  - id: case-assistant-first-text
    why: Scan data in order for the first assistant text block; return its value (default empty string) and annotations
      immediately, even when that text is empty. Missing matches return empty content and None annotations.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_assistant_first_text$/)'
  - id: case-citation-index-relocation
    why: Falsey annotations become None; copy url_citation and fill only missing nested start_index/end_index from
      top-level keys. Existing nested values including None win; other annotation types pass unchanged and order
      is stable.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_citation_index_relocation$/)'
  - id: case-thread-id-metadata
    why: Replace choices with one index=0 assistant message and finish_reason=stop; set requested model and hidden
      thread_id, preserving other hidden keys; annotations use None when empty.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_thread_id_metadata$/)'
  - id: case-token-count-warning
    why: 'Call B196 twice with model=gpt-3.5-turbo (messages for prompt, text plus count_response_tokens=True for
      reply), sum usage; an exception logs Failed to calculate token usage: <error> and retains any existing usage
      rather than synthesizing zero.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_token_count_warning$/)'
  - id: case-message-delta-stream
    why: 'Trim each incoming line; event: replaces current_event and data: parses each line independently. Ignore
      invalid JSON and nontext/empty text deltas; emit one assistant chunk per nonempty text item with index=0,
      finish_reason=None, chat.completion.chunk, supplied model, one stable chatcmpl-<8 hex> id and integer created
      time.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_message_delta_stream$/)'
  - id: case-run-terminal-stream
    why: thread.created records id. thread.message.completed accumulates every text annotation without deduplication.
      Run terminal/error event names are ignored. Only data:[DONE] emits one stop chunk with content=None and all
      collected annotations, attaches truthy thread_id then returns; EOF without DONE emits no terminal chunk.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_run_terminal_stream$/)'
  - id: case-split-sse-event
    why: 'Exercise network-split UTF-8 lines through B005 framing while retaining the pinned line-based semantics:
      no multiline data concatenation and current_event persists across blank lines.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::agent_results_cases::case_[0-9]+_split_sse_event$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_agent_results.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_agent_results*")"
      && grep -lq 'foundry_agent_results' tools/oracle/fuzz/corpus/helper_case/foundry_agent_results* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_agent_results$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_agent_results)"
      && grep -q 'decode_agent_event' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_agent_results.rs && cargo
      nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_agent_results_corpus$/)'
  - id: case-stream-thread-payload
    why: Streaming always POSTs the B559 create-thread-and-run URL with assistant_id and stream=true. Only falsey
      thread_id adds thread.messages with user/system converted to user; a truthy existing id is neither sent nor
