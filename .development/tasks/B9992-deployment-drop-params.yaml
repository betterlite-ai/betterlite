id: B9992
title: Per-deployment drop_params reaches the provider adapters
description: >-
  A deployment's litellm_params.drop_params and additional_drop_params never reach a provider call. In LiteLLM the
  router copies the deployment's litellm_params and spreads them under the request's own kwargs (router.py
  L3722-L3756), so a deployment value applies unless the request sets its own. completion keeps both in
  non_default_params (main.py L5406, through get_non_default_completion_params at utils.py L10239-L10240) and passes
  them to get_optional_params (main.py L5642). There additional_drop_params removes the named params
  (pre_process_non_default_params, utils.py L4281-L4337, called at L4494-L4501), and drop_params drops an unsupported
  param instead of raising (utils.py L4529-L4531).


  In betterlite the config parses both: crates/betterlite-config/src/sections/drop_params.rs L62-L91 fills
  DropPolicySettings.deployments by model_list position. Nothing outside betterlite-config reads that list.
  ChatDeployment in crates/betterlite-openai/src/chat/deployment.rs L70-L86 has no field for it.
  Deployment::from_chat in crates/betterlite-provider/src/prepared/deployment.rs sets drop_params: None (L52), and
  Deployment has no additional_drop_params field. chat_fields in crates/betterlite-provider/src/prepared/body.rs
  (L28-L63) filters the known params by the supported list only, so neither the request's nor the deployment's
  additional_drop_params removes anything. B010 logged this as a deviation until the owner of ChatDeployment adds the
  fields (docs/deviations/B010.yaml L38-L44). A user sees two differences: on the OpenAI path a deployment's
  additional_drop_params names are still sent, and after B9986 an anthropic/ deployment with drop_params true answers
  UnsupportedParams where LiteLLM drops the param.


  The chat deployment. ChatDeployment gains pub drop_policy: DeploymentDropPolicy, the
  betterlite_config::sections::drop_params type. resolve_with sets DeploymentDropPolicy::default(), and every
  ChatDeployment literal in the test files in scope does the same. chat_deployments in
  crates/betterlite-server/src/server/chat_setup.rs copies config.sections.drop_params.policy.deployments at the same
  index into chat.drop_policy, next to prefix_provider.


  The provider deployment. Deployment gains pub additional_drop_params: Vec<String>. from_chat sets drop_params to
  deployment.drop_policy.drop_params.map(DropParams::Flag) and additional_drop_params to the policy's list.
  from_params sets an empty list: its only production caller, build_deployment in openai_dispatch/compose.rs, never
  passes one. Every Deployment literal in the test files in scope sets an empty list.


  The OpenAI path. chat_fields takes a new argument additional_drop_params: &[String], the deployment's list. The
  call's list is the request's additional_drop_params when the request sends a list, otherwise the deployment's, as
  the router's kwargs order gives. Remove those names from the known params before the supported filter. The chat
  request builders in openai_dispatch.rs and aiohttp_openai_dispatch.rs pass &deployment.additional_drop_params, and
  chat_body in openai_dispatch/compose.rs passes an empty list, so only the request's own list applies there.


  The Anthropic path. In crates/betterlite-provider/src/anthropic_dispatch/gateway/parameters.rs, B9986's
  ParameterPolicy takes drop_params from the request when it sets one and from deployment.drop_params otherwise, then
  ORs the proxy-wide flag in, as LiteLLM checks litellm.drop_params or the call's value. additional_drop_params is the
  request's list when it sends one, otherwise deployment.additional_drop_params.


  Tests. Add the test function a_deployment_drop_policy_reaches_its_chat_deployment to
  crates/betterlite-server/src/server/chat_setup/tests.rs: a config with two deployments, the second with
  drop_params true and additional_drop_params [temperature], gives the second those values and the first the
  default. Write rstest function from_chat_drop_policy_cases in the new child module
  crates/betterlite-provider/src/prepared/tests/drop_policy.rs, declared by mod drop_policy; in prepared/tests.rs,
  with named cases flag_copied, list_copied and default_unset. Add Family::DeploymentDropParams to
  openai_dispatch_cases as case deployment_additional_drop_params, in the new child module
  openai_dispatch/tests/deployment_drop_params.rs: with the deployment list [temperature], a loopback upstream gets
  top_p and no temperature, and with a request list [top_p] it gets temperature and no top_p. Add the named cases
  anthropic_provider_deployment_drop_params (a deployment with drop_params true sends a logit_bias request without
  logit_bias) and anthropic_provider_request_drop_params_wins (the request's drop_params false over the deployment's
  true answers OperationError::UnsupportedParams) to anthropic_dispatch_cases.
