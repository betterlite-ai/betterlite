references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L3722-L3756
  why: _acompletion copies the deployment's litellm_params and spreads them under the request's kwargs.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5406
  why: completion keeps drop_params and additional_drop_params in non_default_params.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5642
  why: completion passes them to get_optional_params.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4281-L4337
  why: pre_process_non_default_params removes the additional_drop_params names from the OpenAI and the
    provider-specific params.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4466-L4531
  why: get_optional_params normalizes drop_params and drops an unsupported param instead of raising when it is true.
dod:
- text: >-
    setup carries the policy: chat_deployments gives each ChatDeployment the drop_params and additional_drop_params of
    its model_list entry.
  proof:
  - setup-policy
- text: >-
    from_chat carries the policy: Deployment::from_chat copies the flag and the list.
  proof:
  - from-chat
- text: >-
    openai drops: a deployment's additional_drop_params names are not sent, and a request list replaces the
    deployment's.
  proof:
  - openai-drops
- text: >-
    anthropic drops: a deployment's drop_params true drops an unsupported param, and a request's false wins over it.
  proof:
  - anthropic-drops
- text: >-
    nothing regresses: chat setup, the prepared deployment, the OpenAI, aiohttp and Anthropic dispatch and every
    module with a ChatDeployment or Deployment literal keep passing.
  proof:
  - regressions
checks:
  optional:
  - mutants
  commands:
  - id: setup-policy
    why: chat_deployments does not copy a model_list entry's drop policy to its ChatDeployment.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::tests::a_deployment_drop_policy_reaches_its_chat_deployment$/)'
  - id: from-chat
    why: Deployment::from_chat drops the deployment's flag or list.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::from_chat_drop_policy_cases::/)'
  - id: openai-drops
    why: The OpenAI chat body still carries a name the deployment or the request drops.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_deployment_additional_drop_params$/)'
  - id: anthropic-drops
    why: The Anthropic call ignores the deployment's drop_params, or the deployment's value wins over the request's.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_(deployment_drop_params|request_drop_params_wins)$/)'
  - id: regressions
    why: The new ChatDeployment or Deployment field, or the chat_fields argument, broke a test that builds one.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::from_chat_drop_policy_cases::case_[0-9]+_list_copied$/)' && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^prepared::/) | test(/::openai_dispatch_cases::/) | test(/^aiohttp_openai_dispatch::/) | test(/^anthropic_dispatch::/) | test(/^provider::tests::/) | test(/^operation::/) | test(/^embedding_rerank_providers::/) | test(/^vertex_embedding_binding::/)' && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^chat::/) | test(/^completion_chat_bridge::/) | test(/^text_completion_execution::/)' && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^dispatch::/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::/) | test(/^routes::completions::/) | binary(text_streaming)'
oracle_cases: []
deviations: []
out_of_scope:
- >-
  The OpenAI path keeps dropping an unsupported known param without raising, whatever drop_params says; that is
  chat_fields' behavior since B010, and this task changes only which names it removes.
- >-
  The 422 resend is gated by the proxy-wide flag only (B9988); a deployment's drop_params does not turn it on there
  either.
pitfalls:
- >-
  Dispatched runs cannot compile. Search for ChatDeployment { and for Deployment { followed by drop_params: before
  handing in, since a missed literal only shows in CI. The scope lists every literal file on main; B9988 and B9986 add
  fields to the same literals first.
- >-
  File sizes. Every file stays at or under 300 lines. crates/betterlite-provider/src/prepared/deployment.rs is 291 on
  main and B9988 and B9986 each add a field; if this task's lines do not fit, move the from_params value parsers
  (text, seconds, retries, drop_params, affinity_header) into the child module prepared/deployment/parse.rs.
  chat_setup.rs is 270 on main and grows in B9988 and B9990, so the copy stays at two lines.
- >-
  DropParams has Flag and Text variants. from_chat only ever builds Flag; the Anthropic step reads Text through
  normalize_drop_params as from_params already does.
budget:
  max_changed_lines: 600
  max_new_expects: 0
review_level: standard
