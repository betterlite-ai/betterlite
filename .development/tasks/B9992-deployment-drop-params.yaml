id: B9992
title: Deployment drop_params and the unsupported-param check reach the adapters
description: >-
  A deployment's litellm_params.drop_params and additional_drop_params never reach a provider call, and the OpenAI
  chat path never runs LiteLLM's unsupported-param check. In LiteLLM the router copies the deployment's
  litellm_params and spreads them under the request's own kwargs (router.py L3722-L3756), so a deployment value
  applies unless the request sets its own. completion keeps both in non_default_params (main.py L5406, through
  get_non_default_completion_params at utils.py L10239-L10240) and passes them to get_optional_params (main.py
  L5642). There additional_drop_params removes the named params (pre_process_non_default_params, utils.py
  L4281-L4337, called at L4494-L4501). Then, for every provider, OpenAI included, the supported list plus
  allowed_openai_params goes to _check_valid_arg (utils.py L4543-L4561), and an unsupported param raises
  UnsupportedParamsError with status 400 unless drop_params is true, when it is dropped (L4529-L4537).


  In betterlite the config parses both values: crates/betterlite-config/src/sections/drop_params.rs L62-L91 fills
  DropPolicySettings.deployments by model_list position. Nothing outside betterlite-config reads that list.
  ChatDeployment in crates/betterlite-openai/src/chat/deployment.rs L70-L86 has no field for it.
  Deployment::from_chat in crates/betterlite-provider/src/prepared/deployment.rs sets drop_params: None (L52), and
  Deployment has no additional_drop_params field. chat_fields in crates/betterlite-provider/src/prepared/body.rs
  (L28-L63) keeps a known param only when the supported list names it, so an unsupported param is dropped without
  an error, allowed_openai_params is ignored, and neither the request's nor the deployment's additional_drop_params
  removes anything. B010 logged the missing fields as a deviation until the owner of ChatDeployment adds them
  (docs/deviations/B010.yaml L38-L44). A user sees three differences: an OpenAI deployment answers 200 where LiteLLM
  answers 400 for an unsupported param, a deployment's additional_drop_params names are still sent, and after B9986
  an anthropic/ deployment with drop_params true answers 400 where LiteLLM drops the param.


  The chat deployment. ChatDeployment gains pub drop_policy: DeploymentDropPolicy, the
  betterlite_config::sections::drop_params type. resolve_with sets DeploymentDropPolicy::default(), and every
  ChatDeployment literal in the test files in scope does the same. chat_deployments in
  crates/betterlite-server/src/server/chat_setup.rs copies config.sections.drop_params.policy.deployments at the same
  index into chat.drop_policy, next to prefix_provider.


  The provider deployment. Deployment gains pub additional_drop_params: Vec<String>. from_chat sets drop_params to
  deployment.drop_policy.drop_params.map(DropParams::Flag) and additional_drop_params to the policy's list.
  from_params sets an empty list: its only production caller, build_deployment in openai_dispatch/compose.rs, never
  passes one. Every Deployment literal in the test files in scope sets an empty list.


  One check for both paths. B9986's gateway/parameters.rs builds a ParameterPolicy and calls B9989's
  map_listed_parameters for Anthropic. Move that part into pub(crate) fn listed_parameters(fields:
  &IndexMap<String, JsonValue>, supported: &[&'static str], model: &str, deployment: &Deployment) ->
  Result<ParameterMapping, OperationError> in prepared/body.rs, beside chat_request_fields, and call it from both
  paths instead of keeping two copies. It reads the policy from the fields without removing them: drop_params is the
  request's value when it sends one, otherwise deployment.drop_params read through normalize_drop_params, ORed with
  B9988's deployment.global_drop_params; additional_drop_params is the request's list when it sends one, otherwise
  deployment.additional_drop_params; allowed_openai_params is the request's. It builds ChatParameters from the fields
  without the names in RESERVED_PARAMETER_NAMES and returns map_listed_parameters(supported, model,
  CallType::ChatCompletion, &parameters, &policy), with every ParameterError as B9986's OperationError::Parameters.
  The Anthropic step keeps its own handling of extra_headers, extra_body and the mapping, and the runtime's
  global_drop_params field goes away, since deployment.global_drop_params carries the same value.


  The OpenAI path. chat_fields takes a new argument deployment: &Deployment. Before the partition it calls
  listed_parameters on the params B9989's chat_request_fields returns, with the supported list it already computes, so an unsupported param answers
  OperationError::Parameters with ParameterError::Unsupported, the 400 B9986's server arm gives. The body then keeps a
  known param when the supported list or the request's allowed_openai_params names it and the call's
  additional_drop_params does not. The chat request builders in openai_dispatch.rs and aiohttp_openai_dispatch.rs
  pass their deployment, and chat_plan in openai_dispatch/compose.rs passes the Deployment it builds on to chat_body.


  Tests. Add the test function a_deployment_drop_policy_reaches_its_chat_deployment to
  crates/betterlite-server/src/server/chat_setup/tests.rs: a config with two deployments, the second with
  drop_params true and additional_drop_params [temperature], gives the second those values and the first the
  default. Write rstest function from_chat_drop_policy_cases in the new child module
  crates/betterlite-provider/src/prepared/tests/drop_policy.rs, declared by mod drop_policy; in prepared/tests.rs,
  with named cases flag_copied, list_copied and default_unset. Add these cases to openai_dispatch_cases, each a Family
  variant with its function in the new child module openai_dispatch/tests/drop_params.rs, against a loopback
  upstream: deployment_additional_drop_params (with the deployment list [temperature] the upstream gets top_p and no
  temperature, and with a request list [top_p] it gets temperature and no top_p), openai_unsupported_param (a gpt-4
  deployment and response_format answer OperationError::Parameters with ParameterError::Unsupported and nothing is
  sent), openai_unsupported_param_dropped (the same request with drop_params true is sent without response_format)
  and openai_allowed_param (the same request with allowed_openai_params [response_format] is sent with it). Add the
  named cases anthropic_provider_deployment_drop_params (a deployment with drop_params true sends a logit_bias request
  without logit_bias) and anthropic_provider_request_drop_params_wins (the request's drop_params false over the
  deployment's true answers OperationError::Parameters with ParameterError::Unsupported) to anthropic_dispatch_cases.
