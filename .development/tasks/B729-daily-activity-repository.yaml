id: B729
title: Execute daily activity reports and recover key metadata
description: >-
  Build betterlite-db::daily_activity_repository from the complete 311-line source file. Own
  its narrow database/token protocols as native typed interfaces, row adapters, _metadata_tags,
  _daily_rows_table, _next_export_cursor and every DailyActivityRepository method. Use B700's
  query/chunked-IN primitives, B714's database routing, B727/B728's builders and B2312's records.
  The constructor requires both the database and a DailyActivityProxyReads implementation;
  the interface is B2312's and the higher-level implementation is injected by B074. There is no
  dependency back into that caller or a duplicate proxy recovery algorithm.

  _query logs only the SQL's first nonblank line, stripped of leading opening parentheses and
  surrounding whitespace, with "DailyActivityRepository query: %s". It forwards the exact SQL
  and ordered binds through db.query_raw, returns an empty tuple for None, otherwise preserves
  result order. Database errors propagate. All builders supply nonempty SQL. B714 keeps raw
  queries on the writer while typed table reads use its normal reader/degraded routing; do not
  force every metadata/table read onto the writer or add a report-wide transaction.

  aggregated builds the grouping query and, only when include_entity_breakdown is true, the
  entity query, then starts both reads concurrently. Validate grouping rows before entity rows
  after collection. Omitted entity breakdown is None; an executed query with no rows is an empty
  tuple. distinct_api_keys is the FIRST nonnull value in grouping result order, including zero,
  or zero if none exists. Do not sum/max all copies or infer it from the number of returned keys.
  Failure propagates with no partial report; the reads do not share a repeatable-read snapshot.

  search_keys, model_top_keys and cache_leakage_keys each require limit in 1..100 before building
  or querying, raising ValueError "limit must be between 1 and 100" otherwise. These read the
  static USAGE_KEY_SEARCH_MAX, USAGE_MODEL_TOP_KEYS_MAX and USAGE_CACHE_LEAKAGE_KEYS_MAX,
  all 100; no env parsing/default fallback exists. search_keys validates the complete KeySpendRow
  before returning only api_key strings; missing metrics still fail. The other two return validated
  KeySpendRows. key_page delegates validation to B727, takes total_api_keys from the first row
  (missing/None or no rows means zero), and removes every row whose api_key is missing or None
  before validating page rows. Empty-string keys survive. A malformed count or a malformed
  retained row fails instead of returning a partial page; later count columns do not override the first.

  export_rows uses static USAGE_EXPORT_BATCH_SIZE=1000, starts with after=None, fetches and
  validates a whole batch before yielding any row, then yields in query order. A batch shorter
  than 1000 terminates, including zero; exactly 1000 requires another query even if the next is
  empty. Construct the next cursor from the LAST yielded row: api_key for daily_with_keys,
  model for daily_with_models, user_id for daily_with_users, empty string for daily; nullable
  or empty group values become empty string. Retain its date/entity_id. Never encode or decode
  a client cursor here. A later query/validation failure propagates after already-yielded rows;
  it cannot retract them. Dropping the consumer stops further page requests. No snapshot is held
  across pages, so rows committed later may enter later cursor ranges.

  key_metadata returns an empty mapping immediately for an empty key set, without touching the
  database or recovery port. Otherwise query active tokens with B700's find_many_in, build an
  immutable token-to-metadata map, and query deleted tokens ONLY for missing keys. Duplicate
  active rows would use the last supplied row. Active lookup failures propagate and skip later
  steps. Deleted lookup exceptions instead warn "Could not read deleted verification token
  metadata: %s" and return no deleted rows; cancellation is not swallowed. Group deleted records
  by token and select max(deleted_at), with the first encountered row winning equal timestamps.
  Active rows always win over archived rows; no sorting or deduplication of metadata tags is added.

  _metadata_row copies token/key_alias/team_id/user_id, initializes user_email=None, uses the
  supplied key_exists flag and extracts metadata.tags. _metadata_tags accepts only a list of
  strict strings; nonlists, a JSON-looking string, or ANY invalid list element produce an empty
  tuple without warning. A valid list keeps order, duplicates and empty strings. It is a typed
  projection, not JSON decoding. Pass resolved active/deleted rows, the ORIGINAL full frozenset
  and the unchanged optional SpendLogsWindow to recover_key_metadata even when all keys resolved.
  Return that port's mapping unchanged; unresolved entries are not fabricated locally. Port errors
  propagate. The port may enrich existing rows, so do not skip it just because active lookup succeeded.

  daily_rows dispatches all six DailyActivityTable variants to their exact typed table. Reuse
  B727's date extension. Its WHERE has inclusive adjusted dates, entity_ids whenever not None
  including empty arrays, nonempty exclusions with a null-retaining OR, truthy model only and
  api_keys whenever not None including empty arrays. It does NOT remove PTU sentinel rows.
  Run count and find_many concurrently using identical predicates, skip=(page-1)*page_size,
  take=page_size, order date descending then id ascending; return count and ordered rows.
  There is no local pagination clamp/default or transaction. B074 validates public page inputs;
  internal negative/overflow arithmetic must produce a typed failure rather than panic. Count
  and rows can legitimately observe different committed states. Do not transform daily rows
  through an aggregate adapter or silently remove null/invalid rows.

  B860 Postgres fixtures use POSTGRES_TEST_URL when present and testcontainers otherwise;
  an explicit empty/bad URL or failed container is a failure. Exercise all six tables, real active/
  deleted tokens, users and numeric/date/null data. Compare representative B727/B728 query results
  with independently executed pinned SQL on the same seeded data, including all metric columns,
  grouping masks, top-key truncation and empty-page counts. Isolate failures at active lookup,
  deleted lookup, report query and later export page; verify the warning/recovery order, absence
  of writes and usable connections afterward. Barrier tests demonstrate independent count/row
  reads and no export snapshot, without assuming deterministic unordered SQL output.

  Only _metadata_tags, _metadata_row and _next_export_cursor enter the daily_activity_repository
  helper oracle; Python calls those source functions with typed records. All database orchestration
  is tested against real Postgres, not an effectful helper that substitutes fake SQL results.
  No new outside-byte parser or fuzz target exists: SQL rows use B700's codec, helper inputs B171.
  The source has 271 nonblank noncomment lines including imports/contracts. Allow 265 native
  code, 380 tests, 70 pure adapters and 35 wiring, 750 within 800, divided into query, export and
  metadata modules with adjacent tests.
scope:
  paths:
    - crates/betterlite-db/src/daily_activity_repository.rs
    - crates/betterlite-db/src/daily_activity_repository/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - tools/oracle/src/helpers/daily_activity_repository.rs
    - tools/oracle/helpers/daily_activity_repository.py
    - tools/oracle/src/helpers/management/database.rs
    - tools/oracle/helpers/management/database.py
    - tools/oracle/cases/helpers/daily-activity-repository/**
    - tools/oracle/fuzz/corpus/helper_case/daily-activity-repository-*
  lint_tables: false
