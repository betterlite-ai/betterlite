    why: Narrow interfaces, strict tag filtering, six table bindings, cursor projection and query logging.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/daily_activity_repository.py#L154-L223
    why: Concurrent rollups, repository-only limit maxima, placeholder removal and export batching.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/daily_activity_repository.py#L225-L311
    why: Active/deleted failure asymmetry, recovery call and nontransactional daily-row pagination.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L2170-L2176
