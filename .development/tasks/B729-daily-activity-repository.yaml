dod:
  - text: 'Pure cases name tags_nonlist_empty, tags_mixed_list_drops_all, tags_order_duplicates_empty,
      metadata_fields_and_exists_flag, metadata_email_initially_null,
      cursor_uses_last_row, cursor_each_export_group and cursor_null_group_becomes_empty.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Query cases name query_debug_first_line_only, query_none_is_empty, raw_writer_table_reader_routing,
      aggregated_entity_query_optional, aggregate_queries_concurrent,
      first_nonnull_distinct_count_including_zero, invalid_grouping_before_invalid_entity,
      all_three_limits_one_hundred_and_reject, search_validates_discarded_metric_fields,
      key_page_first_count_only, key_page_missing_null_count_zero,
      key_page_null_key_placeholder_removed, key_page_empty_key_retained and malformed_retained_row_fails.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Real SQL cases name postgres_all_six_daily_tables, postgres_grouping_metrics_and_masks,
      postgres_ptu_totals_and_global_top_keys, postgres_entity_counts_and_null_groups,
      postgres_key_page_empty_and_past_end, postgres_literal_search_active_deleted,
      postgres_model_and_leakage_ranking, postgres_four_export_types,
      postgres_active_null_metadata_no_archive_fallback and postgres_daily_row_filters_and_order.
      Compare pinned SQL output rather than an expected result computed by production code.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Metadata cases name empty_keys_skip_database_and_port, active_failure_stops_recovery,
      archived_lookup_only_missing, newest_deleted_record_selected,
      equal_deletion_time_first_row_wins, deleted_failure_warns_then_recovers,
      deleted_cancel_propagates, active_metadata_precedes_archive,
      recovery_receives_full_set_and_window, all_resolved_still_calls_recovery,
      recovery_result_returned_unchanged and recovery_error_propagates.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Streaming/concurrency cases name export_short_batch_stops,
      export_exact_thousand_fetches_empty_page, export_batch_validated_before_yield,
      export_later_error_keeps_prior_yields, dropped_export_stops_queries,
      postgres_export_sees_later_commits, postgres_count_and_rows_need_not_share_snapshot,
      daily_rows_sentinel_retained, pagination_arithmetic_checked and postgres_reads_never_write.'
    proof: [behavior-tests, postgres-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Every repository path must assert its own result, validation and failure ordering.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^daily_activity_repository::/)'
    - id: postgres-tests
      why: Require actual SQL result, recovery and concurrent-read cases with fatal fixture setup errors.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/daily_activity_repository::.*postgres_/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/daily_activity_repository::.*deleted_failure_warns_then_recovers$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/daily_activity_repository::.*export_later_error_keeps_prior_yields$/)'
    - id: helper-python
      why: Only the three pure projections are compared through source helpers.
      run: test -f tools/oracle/helpers/daily_activity_repository.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Require new projection seeds before replaying the existing helper-envelope decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/daily-activity-repository-*")" && grep -rlq daily_activity_repository tools/oracle/fuzz/corpus/helper_case/daily-activity-repository-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/daily-activity-repository/strict-tag-list.yaml
  - tools/oracle/cases/helpers/daily-activity-repository/metadata-fields.yaml
  - tools/oracle/cases/helpers/daily-activity-repository/last-row-cursor.yaml
deviations: []
out_of_scope:
  - types/repositories/__init__.py is empty at the pin; no initializer or re-export behavior is required.
  - B074 owns daily_activity_routes.py and common_daily_activity.py route authorization,
    request pagination, CSV streaming, metadata enrichment and spend-log fallback queries.
  - B727/B728 own SQL construction; B2312 owns the records, enum mappings and recovery interface.
pitfalls:
  - A malformed tag list loses every tag; filtering out just the bad element changes the source result.
  - Deleted-token read errors warn and continue, but active-token errors prevent any recovery attempt.
  - A full 1000-row export batch needs another read; stopping at a full batch truncates valid exports.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
