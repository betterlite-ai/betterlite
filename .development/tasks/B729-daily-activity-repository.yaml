id: B729
title: Execute daily activity reports and recover key metadata
description: >-
  Implement DailyActivityRepository using the two query-builder services and typed rows. Recover active/deleted
  key aliases and metadata tags, expose date rollups and cursor pages, and preserve missing/deleted-key
  behavior. Query counts are bounded and tenant filters reach every query.


  Build the production daily_activity_repository module in betterlite-db; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/daily_activity_repository.py:
  _QueryRaw.__call__ (L58-L58; 1 source lines), _DailyActivityDatabase.litellm_dailyuserspend (L67-L67;
  1 source lines), _DailyActivityDatabase.litellm_dailyteamspend (L70-L70; 1 source lines), _DailyActivityDatabase.litellm_dailytagspend
  (L73-L73; 1 source lines), _DailyActivityDatabase.litellm_dailyorganizationspend (L76-L76; 1 source
  lines), _DailyActivityDatabase.litellm_dailyenduserspend (L79-L79; 1 source lines), _DailyActivityDatabase.litellm_dailyagentspend
  (L82-L82; 1 source lines), DailyActivityDatabase.db (L87-L87; 1 source lines), _metadata_tags (L98-L105;
  8 source lines), _daily_rows_table (L108-L124; 17 source lines), _next_export_cursor (L127-L138; 12
  source lines), DailyActivityRepository.__init__ (L142-L144; 3 source lines), DailyActivityRepository._query
  (L146-L152; 7 source lines), DailyActivityRepository.aggregated (L154-L174; 21 source lines), DailyActivityRepository.search_keys
  (L176-L181; 6 source lines), DailyActivityRepository.key_page (L183-L191; 9 source lines), DailyActivityRepository.model_top_keys
  (L193-L204; 12 source lines), DailyActivityRepository.cache_leakage_keys (L206-L210; 5 source lines),
  DailyActivityRepository.export_rows (L212-L223; 12 source lines), DailyActivityRepository._active_token_rows
  (L225-L226; 2 source lines), DailyActivityRepository._deleted_token_rows (L228-L233; 6 source lines),
  DailyActivityRepository.key_metadata (L235-L262; 28 source lines), DailyActivityRepository._metadata_row
  (L265-L275; 11 source lines), DailyActivityRepository.daily_rows (L277-L311; 35 source lines).


  Add the daily_activity_repository operation under B856 Management::database. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a daily-activity-repository-* seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This task owns the outside-byte boundary daily_activity_repository::decode_daily_activity_cursor(&[u8])
  -> Result<TypedValue,DecodeError> for untrusted export cursor and JSON metadata tags. Production calls
  this decoder before its typed policy functions; the cargo-fuzz target daily_activity_repository calls
  that same function. Seed valid, truncated, malformed, duplicate-field and limit-boundary inputs and
  add daily_activity_repository::tests::replays_the_daily_activity_repository_corpus. Reuse B002 limits
  for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string decoder cap bytes
  at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or fetching URLs. B710
  owns crates/betterlite-db/fuzz; depend on it and register this decoder target without recreating the
  workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 202 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  202 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 496 changed lines estimated within a 500-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
