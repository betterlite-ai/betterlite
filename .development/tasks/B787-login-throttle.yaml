id: B787
title: Distributed login throttling and source grouping
description: >-
  Implement LoginThrottle with B126 atomic Redis scripts and bounded local fallback counters. Preserve
  source/group and user-pair keys, IPv6 /64 grouping, longest CIDR override precedence and block timing.
  Defaults are 10 failed source attempts, 60-second window, 300-second block; zero source override exempts
  that source from both pair and source limiting. Match source max counter/block capacities 20000/10000
  and warning-only fallback on Redis outage. Pair limit is max(source_limit // 2, 1); an undeclared trusted_proxy_ranges
  disables cross-username source limiting with a warning; LITELLM_DISABLE_LOGIN_RATE_LIMIT defaults false.

  Own the constants, two Lua scripts and _Keys/Block/LoginThrottle/LoginAttempt records as well
  as the methods below. general_settings.max_failed_login_attempts_per_source defaults 10,
  failed_login_window_seconds 60, failed_login_block_seconds 300, and
  max_failed_login_attempts_per_source_overrides is absent. _positive_int uses int(str(value)):
  absent/null keeps the default silently; booleans, fractional floats, malformed strings and
  values below 1 warn and use the default. Integer strings with whitespace are accepted.
  Only an override whose stripped string is exactly 0 exempts both scopes; 0.0 and false do not.
  Cases positive_integer_settings, null_setting_silent, invalid_integer_warns and
  exact_zero_override cover real config loading, not an invented startup-failure rule.

  trusted_proxy_ranges is absent by default. A comma-separated string is split and stripped;
  iterable entries are stringified and stripped. Invalid outer shapes warn; any invalid/blank
  network entry warns and makes the entire topology unknown. [] explicitly means direct clients
  and enables source limiting; empty string is one invalid entry. B743 resolve_client_ip receives
  use_forwarded_for=bool(valid ranges) and their CIDRs. Missing resolution uses literal unknown
  and disables only source scope. Cases topology_absent_vs_empty_list,
  topology_blank_or_malformed_entry, topology_wrong_shape, trusted_forwarded_source and
  missing_source_pair_only pin the distinction. The source-off warning function is memoized once;
  the per-worker warning is memoized per num_workers string and is invoked by startup/B899,
  not from_request itself. warning_cache_keys proves both warning frequencies.

  Parse addresses with IPv4-mapped IPv6 normalized to IPv4. CIDRs use strict=false, so host bits
  are accepted; malformed override ranges warn and skip, invalid override mappings warn and use
  default, invalid client addresses use default. Only matching ranges evaluate override values.
  Precedence is longest prefix, then zero exemption, then larger limit for equivalent networks.
  Pair allowance is max(floor(source/2),1) even when cross-user source counting is off. Bucket
  IPv6 by /64, IPv4 by normalized address, invalid input by its literal string. Cases
  mapped_ipv6_is_ipv4, host_bits_normalized, override_bad_mapping, override_unmatched_value_ignored,
  equivalent_range_ties and odd_limit_floor cover these branches.

  Keys are login_fail:{<group>}:user:<sha256(casefold(username).utf8)>,
  login_fail:{<group>}:block:user:<hash>, login_fail:{<group>}:source and
  login_fail:{<group>}:block:source, all in one Redis cluster slot. Do not trim usernames before
  Unicode casefold/hash. Cases unicode_pair_hash, username_spaces_distinct and cluster_slot_keys
  pin every literal. Resolve LITELLM_DISABLE_LOGIN_RATE_LIMIT once per process via B002's secret
  boolean setting (trimmed case-insensitive true/false, other strings null); only true disables.
  disabled_attempt_no_effects and disabled_setting_cached verify no reads/counts/clears in the
  LoginAttempt API, including exemptions. Direct record_failure is not itself the enable gate.

  attempt checks blocks before credentials, combining local and Redis TTLs by per-scope maximum.
  Source scope wins when enabled, even if its TTL is shorter than the pair's. Local expiry is
  ceil(expiry-now), clamped to zero; Redis TTL <=0 is unblocked. Refusal warns and raises 429
  auth_error,param username,code 429 with Retry-After as a decimal string and a retry-later message.
  Cases local_shared_maximum, source_precedes_longer_pair, ttl_rounding_and_expiry and
  blocked_attempt_error_shape compare timing, warning and complete exception fields.

  Failure accounting increments pair first; block only when count > limit. An already blocked
  pair or the failure that first blocks it never increments source. The Lua script sets a count
  expiry only when TTL<0; local fallback increments through B125 and refreshes that count's TTL.
  Block TTL is fixed, not extended by blocked attempts. Cases limit_plus_one_blocks,
  triggering_pair_failure_not_charged_to_source, redis_fixed_vs_local_sliding_window and
  blocked_failure_does_not_extend pin these differences. failed logs a new block but does not
  raise 429; the NEXT attempt does. succeeded deletes only pair counter in Redis then local,
  retaining pair block, source block and source count; success_preserves_blocks_and_source covers it.

  Catch only RedisError, RedisCircuitBreakerOpenError, OSError and asyncio.TimeoutError during
  TTL reads, failure scripts and pair-counter deletion, warning each time and using local state.
  Do not swallow malformed Lua return tuples or invalid local expiry values: validation errors
  propagate. Cases redis_failure_classes_fall_back, redis_success_does_not_mirror_local,
  redis_clear_failure_still_clears_local and malformed_store_reply_propagates cover each operation.
  Test actual B126 Lua execution plus B125's bounded local eviction (20000 counters,10000 blocks).


  Build the production login_throttle module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/login_throttle.py:
  LocalStore.get_cache (L69-L69; 1 source lines), LocalStore.set_cache (L71-L71; 1 source lines), LocalStore.increment_cache
  (L73-L73; 1 source lines), LocalStore.delete_cache (L75-L75; 1 source lines), _rate_limit_disabled (L106-L107;
  2 source lines), warn_login_counters_are_per_worker (L111-L118; 8 source lines), warn_source_login_limit_is_off
  (L122-L128; 7 source lines), declared_proxy_ranges (L131-L141; 10 source lines), _configured_range_entries
  (L144-L158; 15 source lines), _positive_int (L161-L172; 12 source lines), _int_setting (L175-L176; 2
  source lines), _override_limit (L179-L183; 5 source lines), _parse_address (L186-L194; 9 source lines),
  _parse_network (L197-L202; 6 source lines), _precedence (L205-L207; 3 source lines), _source_limit (L210-L235;
  25 source lines), user_limit_for (L238-L240; 3 source lines), source_group (L243-L250; 8 source lines),
  LoginThrottle.from_request (L287-L310; 24 source lines), LoginThrottle._keys (L312-L320; 9 source lines),
  LoginThrottle.attempt (L322-L336; 15 source lines), LoginThrottle._active_block (L338-L347; 10 source
  lines), LoginThrottle._shared_block_ttls (L349-L358; 10 source lines), LoginThrottle._local_block_ttls
  (L360-L361; 2 source lines), LoginThrottle._local_block_ttl (L363-L367; 5 source lines), LoginThrottle.record_failure
  (L369-L384; 16 source lines), LoginThrottle._local_bump (L386-L394; 9 source lines), LoginThrottle.clear_pair
  (L396-L403; 8 source lines), LoginThrottle._warn_redis (L405-L410; 6 source lines), LoginThrottle.refused
  (L413-L420; 8 source lines), LoginAttempt.succeeded (L428-L431; 4 source lines), LoginAttempt.failed
  (L433-L445; 13 source lines).


  The settings and warning behavior above are consumed by the production config loader; do not
  add a request-time environment reader. B899 owns login HTTP integration and its 429 response.


  Add the login_throttle operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a login-throttle-*
  seed to B171 helper_case, which already owns this decoder.


  betterlite-config::login_throttle tests load all five general_settings keys and the disable env
  value, including topology normalization, override ordering and the named warning/default branches.
  Seed the existing config_yaml corpus with these values. Reuse B743 IP parsing and B002 config
  decoding; malformed parsed Lua/local-store replies are typed collaborator errors, not a new byte parser.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: the 258 function lines omit owned Lua/data declarations; reserve 335 production including
  those declarations, 315 behavior/Redis tests, 65 helper adapters, 30 wiring and 50 config lines,
  795 changed lines within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
