out_of_scope:
  - B743 owns request client-IP resolution and trusted-forwarding parsing, B125 bounded local
    cache operations, B126 Redis execution, B002 resolved settings and B899 login HTTP routes.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Local fallback refreshes count expiry on every failure while the Redis Lua window is fixed.
  - A successful sign-in clears the pair counter but cannot clear an existing block.
