id: B1213
title: Stored model effective fields and credential selectors
description: >-
  Build effective stored/decrypted model fields, clear semantics, credential-name validation and member-router
  strategy constraints. Inject MemberRouterWrite policy for B378 and PTU enabled input from B068; unavailable
  configured policy is a startup error. Remove premium tuning-quota checks without inventing a quota.
  Typed DB row/table protocols are native repository interfaces, not duplicate wrapper types.


  Build the production model_effective_fields module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  _ProxyModelRow.model_id (L179-L179; 1 source lines), _ProxyModelRow.model_name (L182-L182; 1 source
  lines), _ProxyModelRow.model_info (L185-L185; 1 source lines), _ProxyModelRow.model_dump_json (L187-L187;
  1 source lines), _ProxyModelTable.find_unique (L191-L191; 1 source lines), _ProxyModelTable.find_many
  (L193-L193; 1 source lines), _ProxyModelTable.create (L195-L195; 1 source lines), _ProxyModelTable.update
  (L197-L199; 3 source lines), _ProxyModelTable.delete (L201-L201; 1 source lines), _ProxyModelTable.delete_many
  (L203-L203; 1 source lines), _TxModelTables.query_raw (L209-L209; 1 source lines), _TransactionFactory.__call__
  (L214-L214; 1 source lines), _ExistingModelRow.litellm_params (L233-L233; 1 source lines), _ExistingModelRow.model_dump_json
  (L235-L235; 1 source lines), _TeamRow.models (L240-L240; 1 source lines), _TeamRow.model_dump (L242-L242;
  1 source lines), _TeamLookupTable.find_unique (L246-L246; 1 source lines), _TeamTable.update (L250-L252;
  3 source lines), _proxy_model_table (L255-L256; 2 source lines), _repo_team_table (L259-L260; 2 source
  lines), _db_team_table (L263-L264; 2 source lines), _model_alias_table (L267-L268; 2 source lines),
  get_db_model (L271-L278; 6 source lines), _strategy_router_write_violation (L281-L326; 45 source lines),
  _raise_on_strategy_router_write_violation (L329-L341; 13 source lines), _stored_credential_name (L344-L352;
  9 source lines), _raise_on_invalid_credential_name (L355-L386; 32 source lines), _effective_complexity_router_config
  (L408-L437; 30 source lines), _effective_model (L440-L456; 17 source lines), _effective_complexity_router_params
  (L459-L468; 10 source lines), _member_auto_router_marker_for_update (L471-L487; 17 source lines), _decrypted_model
  (L490-L496; 7 source lines), _tuning_candidate (L499-L505; 7 source lines), _raise_on_tuning_quota_violation
  (L508-L517; 10 source lines), _raise_if_rate_limits_required_but_missing (L681-L706; 25 source lines),
  _explicitly_cleared_ptu_fields (L712-L724; 12 source lines), _merged_ptu_model_info (L727-L738; 11 source
  lines), _raise_if_ptu_cost_attribution_disabled (L741-L764; 22 source lines), _validate_ptu_model_info
  (L767-L780; 12 source lines).


  general_settings.enforce_rpm_tpm_on_model_add=false; when enabled require the source RPM/TPM combination
  at model creation/update. No direct environment reads in server code.


  Add the model_effective_fields operation under B856 Management::models. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a model-effective-fields-* seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::model_effective_fields::tests::loads_settings, defaults_and_precedence and
  invalid_value_fallback. Each must call the production B002 config loader, set every listed key/env binding,
  assert the resulting typed value is consumed by this component, and exercise the specified warning/ignore/error
  branch. A grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml
  with the actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 315 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  315 production, 139 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 599 changed lines estimated within a 600-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
