id: B934
title: Responses compact SDK call
description: >-
  Implement the whole acompact_responses and compact_responses functions in betterlite-core
  api/responses_compact_call. Resolve model/provider with B931, construct generic parameters with
  B010 and look up the provider config through B157. Compact never falls back to chat. B905
  collects and filters Responses optional parameters, with allowed_openai_params fixed to null;
  B206 normalizes the request's drop_params value. Restore encrypted item IDs with B904 before
  B2418 executes HTTP and encode the returned typed response ID with the same B904 service.

  The async wrapper detects a provider for error mapping, sets acompact_responses=true, preserves
  context and awaits a coroutine returned by the sync implementation. Its preliminary provider
  lookup gets api_base=null from the nonexistent local base_url; full resolution later uses the
  supplied generic parameters. B174 owns the resolver, B247 logging, B500 residency inference,
  B185/B186 mapped exceptions and B198 REQUEST_TIMEOUT (default 6000). Sync mode pops the marker
  using is True, overlays locals with kwargs, then maps options. Log optional parameters plus
  litellm_call_id and inferred data_residency. extra_query is ignored; extra_body reaches B2418
  but is unused. No prompt-management, managed-file mapping or mock-response shortcut runs here.

  Drive SdkHttpCall::ResponsesCompact through B2401 with production SDK calls and the mock
  provider. Native tests in api::responses_compact_call::tests cover ordered logging and typed
  dependency outcomes. B509 owns JSON decoding downstream. Count 155 owned nonblank/non-comment
  lines; estimate 175 implementation, 125 tests, 85 fixtures, 85 adapters and 25 wiring, 495
  changed lines within 540.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_compact_call.rs
  - crates/betterlite-core/src/api/responses_compact_call/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/responses_compact.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/responses_compact.py
  - tools/oracle/cases/sdk-http/responses-compact/**
  - tools/oracle/fuzz/corpus/sdk_http_case/responses-compact-*
  - Cargo.lock
  - tools/oracle/helpers/b934.py
  - tools/oracle/helpers/b934/**
  - tools/oracle/src/helpers/core_ops/b934.rs
  - tools/oracle/src/helpers/core_ops/b934/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L2080-L2279
  why: Complete compact SDK wrappers and their option filtering, timeout, logging and encrypted-ID handoff.
dod:
- text: >-
    compact_model_and_encrypted_items sends model=openai/gpt-4o,input containing a B904 encoded
    encrypted-content item ID, instructions=short and previous_response_id=resp_previous. Both
    modes POST /v1/responses/compact with model=gpt-4o, the original provider item ID and the
    supplied instructions/previous response. Mock response id=resp_compact,output=[] is encoded
    to provider=openai,model_id=deployment_a,response_id=resp_compact when metadata supplies
    deployment_a. The async wrapper does not nest the encoding. A responses/ routing prefix
    is removed by B931 after provider resolution, not passed as part of the upstream model.
  proof: [compact-ids, oracle, python-adapter]
- text: >-
    compact_optional_parameters sends temperature=0.2 in kwargs, instructions=short and
    extra_query={trace:ignored},extra_body={model:ignored}. The mock receives the supported
    temperature and instructions, no trace query and no model override. With a provider that
    reports temperature unsupported, default drop_params rejects via B905 before HTTP; true
    drops it, and "false" normalizes false. allowed_openai_params=[temperature] does not bypass
    this compact call's fixed null allowed list. Null optional values are omitted. Native rows
    assert unknown kwargs are filtered by B905 instead of copied into the provider body.
  proof: [compact-options, oracle, python-adapter]
- text: >-
    compact_timeout_and_residency passes timeout=null,0,7: transport receives 6000,6000,7 by
    default; injected REQUEST_TIMEOUT=17 changes the first two to 17. B198 tests loader errors.
    Logging for provider=openai,api_base=https://eu.api.openai.com/v1 records data_residency=eu,
    the us host records us and the default host records null through B500. Context call-a and
    mapped options survive async handoff. Only acompact_responses=true selects the async path.
  proof: [compact-context]
- text: >-
    compact_native_support_required gives provider=anthropic with no native config and expects
    zero requests, cause "COMPACT responses is not supported for anthropic", SDK APIConnectionError,
    status=500,type=null,param=null,code=null. A scripted resolver yielding provider=null uses
    cause "custom_llm_provider is required but passed as None" with the same classification.
    Mock 401 {error:{message:bad key,type:invalid_api_key,param:null,code:invalid_api_key}} yields
    AuthenticationError,status=401,type=null,param=null,code=null; its upstream body is not copied
    into the SDK exception. Error messages follow the shared redaction deviation.
  proof: [compact-errors, oracle, python-adapter]
- text: New compact SDK corpus seeds select the public operation and exercise its HTTP adapter in both modes.
  proof: [sdk-corpus, oracle, python-adapter]
checks:
  optional: []
  commands:
  - id: compact-ids
    why: compaction sends encoded item IDs upstream or nests response IDs
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_compact_call::tests::compact_model_and_encrypted_items($|::)/)'
  - id: compact-options
    why: compact permits an unsupported option or forwards ignored extras
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_compact_call::tests::compact_optional_parameters($|::)/)'
  - id: compact-context
    why: residency, call context or zero-timeout fallback is omitted
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_compact_call::tests::compact_timeout_and_residency($|::)/)'
  - id: compact-errors
    why: absent native support falls through to a chat completion
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_compact_call::tests::compact_native_support_required($|::)/)'
  - id: python-adapter
    why: the compact SDK fixture never reaches its actual provider handler
    run: test -f tools/oracle/sdk_http/responses_compact.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: compact SDK calls have no newly added typed input seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/responses-compact-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/responses-compact/compact-model-and-encrypted-items.yaml
- tools/oracle/cases/sdk-http/responses-compact/compact-optional-parameters.yaml
- tools/oracle/cases/sdk-http/responses-compact/compact-native-support-required.yaml
deviations:
- what: Compact local failures keep their SDK status/class but expose bounded redacted messages instead of Python tracebacks.
  why: B184/B187 own the shared public diagnostics contract; exact local cause literals remain tested.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2692-L2709
out_of_scope:
- B1078/B932 own create, B931 shared helpers, B1116 delete/cancel, B933 reads, B955 interception and B943 websocket entry points in main.py.
- B2418 performs compact HTTP; B509 builds the provider compact body/URL and parses its response.
- B939 owns compact proxy registration and authentication, independently of the SDK HTTP cases here.
pitfalls:
- compact passes allowed_openai_params=null even if the caller supplied that kwarg.
- The async preliminary resolver reads base_url from locals, where no such named argument exists.
- Compaction restores encrypted item IDs but does not invoke create's prompt or managed-file mapping helpers.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
