  L27-L43; AzureOpenAIO1Config._get_o_series_only_params L45-L68; AzureOpenAIO1Config.should_fake_stream L70-L98;
  AzureOpenAIO1Config.transform_request L103-L116 belong to B532.'
- 'Function ownership inventory litellm/llms/azure_ai/common_utils.py: AzureFoundryModelInfo.__init__ L165-L166
  belong to B2220.'
