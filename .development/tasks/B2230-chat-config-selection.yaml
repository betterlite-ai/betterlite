out_of_scope:
- Concrete provider constructors and transform methods remain with their existing provider tasks; the caller supplies
  the closed constructor projection and consumes this selected tag. B038 owns JSON provider loading and create_config_class,
  supplied through the named JSONProviderProjection rather than called upward from this lower selection stage. B2231
  owns Bedrock selection. Other ProviderConfigManager factories remain their API-family owners; public SDK aliases
  are B157.
