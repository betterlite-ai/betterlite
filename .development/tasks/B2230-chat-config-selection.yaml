id: B2230
title: Shared chat config selection
description: >-
  Provide the closed chat-config selection stage below parameter queries, provider composition and passthrough logging.
  Return a ConfigSelection tag plus constructor arguments, preserving the source class-versus-instance distinction
  for OpenAI o-series. The constructor call is an explicit caller-owned seam: providers construct the selected existing
  adapter, and this task never imports the executable provider dispatcher or copies a leaf constructor. Oracle adapters
  execute ProviderConfigManager while capturing the selected factory/class and arguments with fixture constructors.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/utils.py: ProviderConfigManager.get_provider_image_variation_config
  selection L9399-L9408. litellm/utils.py: ProviderConfigManager._build_provider_config_map selection L8452-L8625;
  ProviderConfigManager._get_azure_config selection L8628-L8642; ProviderConfigManager._get_azure_ai_config selection
  L8645-L8649; ProviderConfigManager._get_vertex_ai_config selection L8652-L8671; ProviderConfigManager._get_bedrock_config
  selection L8674-L8678; ProviderConfigManager._get_cohere_config selection L8681-L8687; ProviderConfigManager._get_sail_chat_config
  selection L8690-L8693; ProviderConfigManager._get_langgraph_config selection L8696-L8700; ProviderConfigManager._get_langflow_config
  selection L8703-L8707; ProviderConfigManager.get_provider_chat_config selection L8710-L8765. litellm/llms/azure/chat/o_series_transformation.py:
  AzureOpenAIO1Config.is_o_series_model L100-L101. litellm/llms/azure_ai/common_utils.py: AzureFoundryModelInfo.get_azure_ai_route
  L168-L191; get_azure_ai_config_for_model selection L311-L343. litellm/llms/cohere/common_utils.py: CohereModelInfo.get_cohere_route
  L67-L83.


  Named case contracts: openai_family_selection: For provider OPENAI first use B668 o-series predicate and return
  the OpenAIOSeriesConfig class tag without construction; then B668 GPT-5 predicate returns the GPT-5 instance tag;
  then a noncatalog model selects OpenAIUnknownModelConfig. Otherwise use the generic OPENAI table entry OpenAIGPTConfig.
  Catalog membership and family flags use B668, including responses/ handling and gpt-5-chat exclusion. azure_detection_selection:
  AZURE bypasses the generic table and uses truthy base_model or model. is_o_series_model is a case-sensitive substring
  test for o1, o3, o4 or o_series/ anywhere, with no catalog gate. If false, B668 GPT-5 predicate selects AzureOpenAIGPT5Config,
  else AzureOpenAIConfig. base_model affects Azure detection only, not the model argument passed into the other
  model-aware factory entries. factory_table: Build/cache the provider-to-factory table once (initial state None);
  every literal mapping below has a named factory_table row. The needs_model flag is True only for AZURE_AI, VERTEX_AI,
  BEDROCK, COHERE and COHERE_CHAT; pass the original model positionally for those and no arguments for all other
  entries. Preserve selected factory identity, not only a broad provider-family tag. foundry_selection: get_azure_ai_route
  first tests case-sensitive agents/ anywhere. Otherwise lower-case model containing model_router/, model-router/,
  model-router or model_router returns model_router; all others default. For config selection model_router wins
  and selects AzureModelRouterConfig; otherwise case-insensitive claude selects AzureAnthropicConfig, else AzureAIStudioConfig.
  An agents route has no dedicated config branch and can still select Claude/default here, unlike main.py agent
  dispatch. vertex_selection: Case-sensitive gemini substring selects VertexGeminiConfig; then claude selects VertexAIAnthropicConfig;
  then gpt-oss selects VertexAIGPTOSSTransformation. Otherwise a vertex_mistral_models catalog member selects CodestralTextCompletionConfig
  if it contains codestral, else VertexAIMistralConfig; a vertex_ai_ai21_models member selects VertexAIAi21Config;
  the fallback is VertexAILlama3Config. cohere_and_bedrock_selection: Cohere/cohere_chat use get_cohere_route: any
  case-sensitive v1/ substring selects CohereChatConfig, otherwise CohereV2ChatConfig. Bedrock delegates B2231.
  The Sail, LangGraph and LangFlow helpers select SailChatConfig, LangGraphConfig and LangFlowConfig without arguments.
  json_fallback_precedence: A Python-table entry always wins over a JSON provider, even if construction later fails.
  Only absent table entries consult the caller-supplied B038 JSONProviderProjection: exists false returns None;
  exists true plus missing record raises ValueError Provider {provider.value} not found; a record requests the existing
  B038 create_config_class constructor with no arguments. Selection does not parse JSON or install a runtime trait-object
  registry. image_variation_config_selection: Choose OpenAIImageVariationConfig for OPENAI, TopazImageVariationConfig
  for TOPAZ, otherwise None; model does not affect the branch. Return a config tag with caller-supplied concrete
  construction, like the chat selector.


  The exact table is OPENAI -> OpenAIGPTConfig (); ANTHROPIC -> AnthropicConfig (); AZURE_AI -> _get_azure_ai_config
  (model); VERTEX_AI -> _get_vertex_ai_config (model); BEDROCK -> _get_bedrock_config (model); COHERE -> _get_cohere_config
  (model); COHERE_CHAT -> _get_cohere_config (model); DEEPSEEK -> DeepSeekChatConfig (); TENCENT -> TencentChatConfig
  (); GROQ -> GroqChatConfig (); BEDROCK_MANTLE -> BedrockMantleChatConfig (); A2A -> A2AConfig (); BYTEZ -> BytezChatConfig
  (); DATABRICKS -> DatabricksConfig (); XAI -> XAIChatConfig (); ZAI -> ZAIChatConfig (); LAMBDA_AI -> LambdaAIChatConfig
  (); INCEPTION -> InceptionChatConfig (); LLAMA -> LlamaAPIConfig (); TEXT_COMPLETION_OPENAI -> OpenAITextCompletionConfig
  (); SNOWFLAKE -> SnowflakeConfig (); CLARIFAI -> ClarifaiConfig (); ANTHROPIC_TEXT -> AnthropicTextConfig ();
  VERTEX_AI_BETA -> VertexGeminiConfig (); CLOUDFLARE -> CloudflareChatConfig (); SAGEMAKER_CHAT -> SagemakerChatConfig
  (); SAGEMAKER_NOVA -> SagemakerNovaConfig (); SAGEMAKER -> SagemakerConfig (); FIREWORKS_AI -> FireworksAIConfig
  (); FRIENDLIAI -> FriendliaiChatConfig (); WATSONX -> IBMWatsonXChatConfig (); WATSONX_TEXT -> IBMWatsonXAIConfig
  (); EMPOWER -> EmpowerChatConfig (); MINIMAX -> MinimaxChatConfig (); GITHUB -> GithubChatConfig (); COMPACTIFAI
  -> CompactifAIChatConfig (); GITHUB_COPILOT -> GithubCopilotConfig (); CHATGPT -> ChatGPTConfig (); GIGACHAT ->
  GigaChatConfig (); RAGFLOW -> RAGFlowConfig (); CUSTOM -> OpenAILikeChatConfig (); CUSTOM_OPENAI -> OpenAILikeChatConfig
  (); OPENAI_LIKE -> OpenAILikeChatConfig (); AIOHTTP_OPENAI -> AiohttpOpenAIChatConfig (); HOSTED_VLLM -> HostedVLLMChatConfig
  (); LLAMAFILE -> LlamafileChatConfig (); LM_STUDIO -> LMStudioChatConfig (); GALADRIEL -> GaladrielChatConfig
  (); REPLICATE -> ReplicateConfig (); HUGGINGFACE -> HuggingFaceChatConfig (); TOGETHER_AI -> TogetherAIChatConfig
  (); OPENROUTER -> OpenrouterConfig (); NADIR -> NadirConfig (); VERCEL_AI_GATEWAY -> VercelAIGatewayConfig ();
  EDENAI -> EdenAIChatConfig (); FAL_AI -> FalAIChatConfig (); COMETAPI -> CometAPIConfig (); DATAROBOT -> DataRobotConfig
  (); GEMINI -> GoogleAIStudioGeminiConfig (); AI21 -> AI21ChatConfig (); AI21_CHAT -> AI21ChatConfig (); AZURE_TEXT
  -> AzureOpenAITextConfig (); NLP_CLOUD -> NLPCloudConfig (); OOBABOOGA -> OobaboogaConfig (); OLLAMA_CHAT -> OllamaChatConfig
  (); DEEPINFRA -> DeepInfraConfig (); PERPLEXITY -> PerplexityChatConfig (); MISTRAL -> MistralConfig (); CODESTRAL
  -> MistralConfig (); NVIDIA_NIM -> NvidiaNimConfig (); CEREBRAS -> CerebrasConfig (); BASETEN -> BasetenConfig
  (); VOLCENGINE -> VolcEngineConfig (); TEXT_COMPLETION_CODESTRAL -> CodestralTextCompletionConfig (); TEXT_COMPLETION_INCEPTION
  -> InceptionTextCompletionConfig (); SAMBANOVA -> SambanovaConfig (); MARITALK -> MaritalkConfig (); VLLM -> VLLMConfig
  (); OLLAMA -> OllamaConfig (); PREDIBASE -> PredibaseConfig (); TRITON -> TritonConfig (); PETALS -> PetalsConfig
  (); SAP_GENERATIVE_AI_HUB -> GenAIHubOrchestrationConfig (); FEATHERLESS_AI -> FeatherlessAIConfig (); NOVITA
  -> NovitaConfig (); NEBIUS -> NebiusConfig (); WANDB -> WandbConfig (); DASHSCOPE -> DashScopeChatConfig (); QWENCLOUD
  -> QwenCloudChatConfig (); QWEN_AI_PLATFORM -> QwenAIPlatformChatConfig (); MODELSCOPE -> ModelScopeChatConfig
  (); MOONSHOT -> MoonshotChatConfig (); DOCKER_MODEL_RUNNER -> DockerModelRunnerChatConfig (); V0 -> V0ChatConfig
  (); MORPH -> MorphChatConfig (); LITELLM_PROXY -> LiteLLMProxyChatConfig (); GRADIENT_AI -> GradientAIConfig ();
  NSCALE -> NscaleConfig (); HEROKU -> HerokuChatConfig (); OCI -> OCIChatConfig (); HYPERBOLIC -> HyperbolicChatConfig
  (); OVHCLOUD -> OVHCloudChatConfig (); AMAZON_NOVA -> AmazonNovaChatConfig (); LANGGRAPH -> _get_langgraph_config
  (); SAIL -> _get_sail_chat_config (); LANGFLOW -> _get_langflow_config (); GDC -> GDCGeminiConfig (). The class/constructor
  symbols are output data for this task; no hidden default normalization may occur at the selection boundary. Native
  constructor invocation stays at the caller after it receives the tag, with errors propagated in source order.


  Implement crates/betterlite-context/src/chat_config_selection.rs with adjacent tests under chat_config_selection/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_config_selection_cases in betterlite-context with these exact named cases (one per
  oracle file): openai_family_selection, azure_detection_selection, factory_table, foundry_selection, vertex_selection,
  cohere_and_bedrock_selection, json_fallback_precedence, image_variation_config_selection. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/chat_config_selection* using HelperCase: kind:
  helper and the externally tagged chat_config_selection variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_chat_config_selection that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 340 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 315 production lines, 260 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 725 planned, 725 maximum changed lines.
