id: B3780
title: Noma legacy scan policy and mutations
description: >-
  Build the legacy prompt/response scan service for Noma, including verdict precedence, sensitive-data-only
  anonymization and in-place message replacement. The guardrail integrates with Noma's AI-DR API at
  POST /ai-dr/v2/prompt/scan to check content, apply decisions and optionally anonymize results.

  Extract text from user messages and LLM responses using the Responses API transformation from B917, call the Noma API,
  and return the response. The POST request includes Authorization and X-Noma-Request-ID HTTP headers; x-noma-context
  is a field in the JSON body with applicationId, ipAddress, userId, sessionId and requestId built from request metadata,
  user auth and defaults.

  aggregatedScanResult in the response is true for unsafe (block), false for safe. When aggregatedScanResult=true and only
  sensitiveData detectors have result=true, allow anonymization if enabled; otherwise block. When aggregatedScanResult=false,
  apply anonymization if an anonymizedContent version exists and anonymization is enabled.

  Implement verdict precedence: sensitiveData failures allow anonymization; all other detectors enforce blocks. In monitor_mode,
  log verdicts without blocking or modifying content. Otherwise apply the verdict: block with status 400 and error details, or
  return anonymized content if available. On API failure, block if block_failures is set; otherwise allow and log.

  Include NomaGuardrailConfigModel and NomaV2GuardrailConfigModel type definitions with api_key, api_base, application_id,
  use_v2 and monitor_mode fields, matching LiteLLM's config models (api_base defaults to https://api.noma.security/).
  Both models provide ui_friendly_name() methods returning "Noma Security" and "Noma Security v2".
scope:
  paths:
    - crates/betterlite-guardrails/src/noma_scan_policy.rs
    - crates/betterlite-guardrails/src/noma_scan_policy/**
  lint_tables: false
references:
