    - crates/betterlite-openai/src/fireworks_ai_text_completion.rs
    - crates/betterlite-openai/src/fireworks_ai_text_completion/**
    - crates/betterlite-openai/src/fireworks_ai_responses.rs
    - crates/betterlite-openai/src/fireworks_ai_responses/**
    - tools/oracle/cases/helpers/fireworks-ai-completion-responses/**
    - "tools/oracle/fuzz/corpus/helper_case/fireworks_ai_completion_responses-*"
    - tools/oracle/helpers/b5832.py
    - tools/oracle/helpers/b5832/**
    - tools/oracle/src/helpers/openai/b5832.rs
    - tools/oracle/src/helpers/openai/b5832/**
  lint_tables: false
