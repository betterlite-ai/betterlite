dod:
  - text: Text completion params, the four extra_body steps and the request body match LiteLLM.
    proof: [fw-completion-tests, oracle, helper-python]
  - text: Responses auth, URL and capability flags match LiteLLM.
    proof: [fw-responses-tests, oracle]
  - text: Instruction folding follows the leading, closing and developer rules and keeps non-text items in the input.
    proof: [fw-responses-tests, oracle]
  - text: The delete result reads the decoded id from the request path.
    proof: [fw-responses-tests, oracle]
  - text: The new helper cases replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: fw-completion-tests
      why: A completion param or extra_body step is missing.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_text_completion::/)'
    - id: fw-responses-tests
      why: Responses auth, URL, folding, delete result or capability flags are missing.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_responses::/)'
    - id: helper-python
      why: The strict oracle adapter lint or type checks fail.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5832.py)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Newly added cases are absent or do not replay.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/fireworks_ai_completion_responses-*")" &&
        grep -lE '^[[:space:]]+b5832:' tools/oracle/fuzz/corpus/helper_case/fireworks_ai_completion_responses-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/completion-params.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/completion-extra-body.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/completion-template-kwargs.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/completion-guided.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/completion-request.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/responses-auth-and-url.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/responses-instruction-folding.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/responses-closing-assistant.yaml
  - tools/oracle/cases/helpers/fireworks-ai-completion-responses/responses-delete-result.yaml
deviations: []
out_of_scope:
  - B6070 owns FireworksAIMixin, the key chain and session affinity; B6071 owns effort_from_chat_template_kwargs, translate_guided_params and the strip list; B6072 owns the chat wire side.
  - B2237 owns the prompt projection and the text config selector (get_provider_text_completion_config); B507 owns the base Responses request transform and input check; B1138 owns DeleteResponseResult.
  - B2454 and B8310 own the HTTP execution, the routes and the dispatch wiring for these configs, including the HTTP oracle cases.
  - FireworksAIResponsesAPIConfig inherits every method not listed here from the OpenAI Responses config (B506 to B509).
pitfalls:
  - Text completion copies a listed key even when its value is null, where the chat map skips null values.
  - The chat_template_kwargs step reads the body after the move step, so a top-level reasoning_effort or thinking in optional_params always blocks the kwargs effort.
  - Text completion removes response_format, reasoning_effort and thinking from the top level and puts them in extra_body, so the sent body has them under extra_body only.
  - An instruction item is hoisted only when it is plain text; a system item with an image part stays in the input and, if it was developer, is renamed to system.
  - When the last non-instruction item is an assistant message, system and developer items after it are not hoisted.
  - A developer item that is converted keeps only role, content and type, so any other key on it is lost.
  - The "instructions" key is removed and re-added last only when its final value is not None, so an explicit null instructions disappears from the request.
  - The delete result id comes from the last path segment of the request URL, percent-decoded, not from the response body.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
