id: B5832
title: Fireworks AI text completion and Responses API transforms
description: >-
  Build fireworks_ai_text_completion and fireworks_ai_responses in betterlite-openai (crates/betterlite-openai/src/ with a folder
  for each), the last part of the Fireworks AI provider folder. They port FireworksAITextCompletionConfig from
  litellm/llms/fireworks_ai/completion/transformation.py and FireworksAIResponsesAPIConfig with its module helpers from
  litellm/llms/fireworks_ai/responses/transformation.py. B6070 built the shared auth and header helpers, B6071 the chat option
  helpers, B6072 the chat wire side. Both modules are pure, read no env var and make no HTTP call: the caller passes api_key,
  api_base and a FireworksEnv value from B6070 (the key variables and FIREWORKS_API_BASE; an empty value counts as unset).


  Text completion. The supported list is max_tokens, logprobs, echo, temperature, top_p, top_k, frequency_penalty, presence_penalty,
  n, stop, response_format, stream, user. map_openai_params copies each listed key of non_default_params into optional_params in order,
  null values included (unlike chat). map_extra_body_params starts from a copy of extra_body when it is a map, else an empty map, and
  runs four steps. (1) Strip: truncate_prompt_tokens, prompt_truncate_len and every B6071 NIM_VLLM_STRIP_PARAMS key are removed, with a
  debug log of the sorted names. (2) Move: for response_format, reasoning_effort and thinking, a non-None value in optional_params
  is written into the body, replacing any extra_body value (debug log). (3) chat_template_kwargs: when present it is removed from the
  body; a non-map value is dropped with a log; keys outside the effort keys are logged; B6071 effort_from_chat_template_kwargs gives
  the effort; with no effort the body is returned; reasoning_effort or thinking already in the body or in optional_params means the
  kwargs are ignored (log); B2221 supports_reasoning false drops them (log); otherwise reasoning_effort is added. (4) Guided: B6071
  translate_guided_params(body, optional_params) runs, guided_json, guided_grammar and guided_choice are removed from the body, and the
  one response_format entry it returns, if any, is added. The result is optional_params without extra_body, response_format,
  reasoning_effort and thinking, plus extra_body when the body is non-empty. transform_text_completion_request returns
  {model: B2222 resolve_resource_name(model), prompt: B2237 prompt projection of the messages, then every translated entry}.


  Responses. custom_llm_provider is fireworks_ai, supports_native_websocket and supports_native_file_search are false.
  validate_environment resolves the key (given key, then the env chain) or fails with MissingApiKey; headers start as Content-Type
  "application/json", then the caller headers override, then Authorization "Bearer {key}" overrides all; session affinity is applied
  from the params' litellm_session_id and litellm_metadata (read as metadata). get_complete_url is (api_base or FIREWORKS_API_BASE or
  "https://api.fireworks.ai/inference/v1") with trailing "/" trimmed plus "/responses". transform_responses_api_request validates the
  input with B507's input check, then folds instruction items. When the "instructions" param is a string or None, the item folding
  applies; when it is anything else, instructions stay as given and only developer items are converted. Folding: a string input is
  untouched. For a list, roles are read per item (None when there is no string role). The leading block is the run of items from the
  start whose role is system or developer. The closing start is len(items), unless the last item outside the leading block is an
  assistant item, in which case it is that index plus one. Hoist candidates are indices below the closing start that are in the leading
  block or have role developer. A candidate is folded only when its content is a string, or a list whose every part is an input_text
  with a string text (texts joined by "\n\n", empty texts skipped). New instructions are the old instructions and the folded texts joined by
  "\n\n" with empty chunks skipped, or None when that is empty; with nothing folded, instructions stay as they were. Remaining items with
  role developer become {role: system, content, type: message} (other keys dropped). The params keep every key except instructions in
  order, then instructions last when it is not None. The model becomes resolve_resource_name(model) and the rest goes to B507's
  transform_responses_api_request. transform_delete_response_api_response takes the request URL path, percent-decodes its last segment
  and returns B1138 DeleteResponseResult {id, object "response", deleted true}.


  Helper cases (helper b5832) call the pinned config methods with fixed ids and the local model map. LiteLLM size: 156 completion and
  152 responses lines, 308 in all.
scope:
