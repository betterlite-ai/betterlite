deviations:
  - what: >-
      Metric recording guarded against ValueError with once-only ERROR log follows LiteLLM exactly,
      including the _metric_filter_error_logged flag to suppress repeated logging of the same filter error.
    why: >-
      Operator-fixable configuration errors should surface once, not spam logs while the request
      continues (guarded in try/except). Other recording failures are debug-only.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L362-L379
  - what: >-
      Detached spans on credential or project routes root their own traces with a link back to the request
      trace instead of parenting into it. Service-name-only routes stay parented to the default backend.
    why: >-
      Credential or project rerouting to a different backend would fragment the trace across
      accounts (tenant missing parent, operator holding child). Detaching and linking preserves
      correlation without fragmentation. Service-name changes only the Resource on the same backend.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/plumbing/routing.py#L122-L147

out_of_scope:
  - RequestIdentity parsing and baggage promotion; owned by B3841.
  - Span emitter, dedup cache, attribute mapping, and error stamping; owned by B3847.
  - OTel config, exporter construction, and destination contracts; owned by B3842 and B3848.
  - GenAIMetricRecorder construction and lifecycle; owned by B3869 (the callback that builds it calls _guarded_record here).
  - Provider assembly and legacy initialization; owned by B3868.
  - Span role definitions and semantic vocabulary; owned by B3840.
pitfalls:
  - >-
      MCP tool-call and list-tools have no pre_call carrier — they open and close in the
      success/failure callbacks, not in async_log_success_event. The _emit_mcp_* methods pop
      any stray LLM carrier for the same call id (from a mis-fired pre_call) so it's not closed
      as a phantom LLM span.
  - >-
      The open-call map evicts the oldest carrier on overflow, but the call itself may still
      reach _close_llm_call later with a payload — the deferred emission path handles it.
      Only calls that evict and never close go unexported.
  - >-
      route_for holds the provider atomically in the lock (increments open_span_counts), so
      a concurrent eviction can't shut it down between selection and the caller's span start.
      The provider must be released exactly once when the span closes.
  - >-
      Credential headers REPLACE the exporter's static headers; project headers APPEND
      (with comma separators and percent-encoding on values). Mixing a typo'd or unavailable
      exporter kind (falling back to console) with credential headers would strand the span
      on the operator's console, never reaching the tenant backend — only detach if the
      exporter is genuinely OTLP-capable.
  - >-
      Retired drained providers are kept open until all their spans close (tracked in
      open_span_counts). A release that drops the count to 0 must check _retired and shut
      the provider down OUTSIDE the lock (shutdown may block on network flush).
  - >-
      tenant_service_name reads only from auth_metadata (key/team config), never from
      client-supplied dynamic_params. The service name determines the dataset/service traces
      land in (e.g. Honeycomb routes datasets by it), so routing it to caller-controlled
      values would violate isolation.
  - >-
      Both success and failure async callbacks call _close_llm_call via their _emit_* paths.
      The pop(call_id) in _close_llm_call dedups: whichever fires first removes the carrier
      and closes the span; the second sees None and returns.
  - >-
      start_time_ns is None for deferred spans; _finish_carrier uses carrier.start_time_ns
      if the carrier exists, falling back to the param start_time. Deferred spans opened by
      close use the true pre_call time, not the async callback's wall time.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
