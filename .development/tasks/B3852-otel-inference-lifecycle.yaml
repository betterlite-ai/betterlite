dod:
  - text: >-
      log_pre_api_call opens an LLM-call span at the pre_call boundary when the ambient parent
      is recordable, storing the routed provider in the carrier. When no recordable parent exists
      (thread-pool worker), only start_time_ns is recorded and the async callback creates the span deferred.
      Synthetic proxy-gate logs (is_no_upstream_call) skip span creation entirely.
    proof: [lifecycle-pre-call-tests]
  - text: >-
      The open-call map uses call_id for idempotent storage; retried calls keep the first span.
      Overflow eviction (past _OPEN_CALLS_MAX) drops the oldest carrier and releases its provider,
      but does not prevent deferred emission of that call if it later closes with a payload.
    proof: [lifecycle-open-calls-tests]
  - text: >-
      async_log_success_event and async_log_failure_event dispatch to MCP handlers (_emit_mcp_tool_call,
      _emit_mcp_list_tools) which return true to skip the LLM-call path, or fall through to _close_llm_call
      for LLM-only calls. Success records metrics; failure records failure metrics.
    proof: [lifecycle-dispatch-tests]
  - text: >-
      _record_metrics calls _guarded_record which runs the recorder.record(). A ValueError from
      otel.attributes filter is logged once at ERROR and then suppressed on all later calls.
      Other exceptions are logged at debug. _record_failure_metrics skips synthetic proxy-gate logs.
    proof: [lifecycle-metrics-tests]
  - text: >-
      _close_llm_call pops the carrier (dedup), and when no carrier exists, checks (is_no_upstream_call
      or not upstream_started or no payload) to decide whether to emit via deferred path. A no-carrier
      call with (upstream_started + payload) emits deferred; otherwise nothing.
    proof: [lifecycle-llm-close-tests]
  - text: >-
      _finish_carrier on a live opened span stamps attributes and ends the span. On a deferred
      (no opened span), _finish_carrier routes afresh, seeds identity baggage, emits the span,
      and releases the new routed provider.
    proof: [lifecycle-finish-tests]
  - text: >-
      _emit_mcp_tool_call pops any stray LLM carrier for the call id, routes, seeds baggage,
      and emits a CLIENT span once (deduped). Links to the MCP transport span context and
      to the request root (if detached). Releases the provider.
    proof: [lifecycle-mcp-tool-tests]
  - text: >-
      _emit_mcp_list_tools emits an MCP list-tools CLIENT span once, with the same routing,
      baggage, and linking behavior as tool calls.
    proof: [lifecycle-mcp-list-tests]
  - text: >-
      _seed_identity_baggage uses promoted_baggage to filter identity values and metadata to
      allowlists (baggage_promoted_keys, baggage_metadata_keys, baggage_team_metadata_keys),
      then sets the baggage on the context via set_request_baggage.
    proof: [lifecycle-baggage-tests]
  - text: >-
      TenantTracerCache routes by (credential_headers, project_headers, endpoint, service_name)
      with an LRU ordered dict, capping at _MAX_CACHED_PROVIDERS. A routed provider increments
      open_span_counts atomically in the lock and is held until release.
    proof: [cache-routing-tests]
  - text: >-
      Evicted providers with open_span_counts > 0 are retired (added to _retired OrderedDict).
      On release when counts hit 0, retired providers are shut down (force-flush + stop).
      Retired is capped at _MAX_RETIRED_PROVIDERS; overflow shuts down the oldest.
    proof: [cache-eviction-tests]
  - text: >-
      TenantRoute.detached is true when routed provider exports to a DIFFERENT backend
      (credential or project routing), false for service-name-only routing (same backend).
      A callback with destination_backends() returns unrouted regardless of credential/project.
    proof: [cache-detach-tests]
  - text: >-
      _credential_headers returns dynamic_otlp_headers when the cache's owned exporter
      is OTLP/HTTP or gRPC (_credential_routable). Otherwise warns once and returns no headers.
      _project_headers returns project_routing_headers only for OTLP/HTTP exporters.
    proof: [cache-transport-tests]
  - text: >-
      _routed_config copies the config, rewriting owned exporters' headers. Credential headers
      REPLACE the exporter's static headers. Project headers APPEND (comma-separated, percent-encoded
      on the value) except for gRPC exporters (project headers HTTP-only).
    proof: [cache-header-tests]
checks:
  optional: []
  commands:
    - id: lifecycle-pre-call-tests
      why: log_pre_api_call must open spans at boundary when parent is recordable and defer when not.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::pre_call::/)'
    - id: lifecycle-open-calls-tests
      why: Open-call storage must be idempotent, evict on overflow, and allow deferred emission after eviction.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::open_calls::/)'
    - id: lifecycle-dispatch-tests
      why: Success/failure events must dispatch to MCP or LLM paths, with MCP returning true to skip LLM.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::dispatch::/)'
    - id: lifecycle-metrics-tests
      why: Metrics must record on success/failure with guarded error handling (once-only ERROR on ValueError).
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::metrics::/)'
    - id: lifecycle-llm-close-tests
      why: LLM close must dedup on call id and emit deferred only when upstream_started + payload signal.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::llm_close::/)'
    - id: lifecycle-finish-tests
      why: Finish must stamp attributes on opened spans and emit deferred spans with baggage seeding.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::finish::/)'
    - id: lifecycle-mcp-tool-tests
      why: MCP tool calls must emit whole (deduped), pop stray carriers, and release routed providers.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::mcp_tool::/)'
    - id: lifecycle-mcp-list-tests
      why: MCP list-tools must emit whole with same routing and baggage behavior as tool calls.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::mcp_list::/)'
    - id: lifecycle-baggage-tests
      why: Identity baggage must be filtered to allowlists and seeded on context before emission.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger::lifecycle::baggage::/)'
    - id: cache-routing-tests
      why: TenantTracerCache must route by (headers, endpoint, service) and hold providers atomically.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::plumbing::tenant_cache::routing::/)'
    - id: cache-eviction-tests
      why: Cache must evict LRU on overflow, retire drained providers, and shut down overflow retirees.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::plumbing::tenant_cache::eviction::/)'
    - id: cache-detach-tests
      why: Detached flag must be true for credential/project routes and false for service-name-only or destination_backends.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::plumbing::tenant_cache::detach::/)'
    - id: cache-transport-tests
      why: Transport checks must allow credentials on OTLP/HTTP and gRPC, project headers on HTTP only.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::plumbing::tenant_cache::transport::/)'
    - id: cache-header-tests
      why: Header rewriting must replace credentials and append project headers (percent-encoded), except gRPC.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::plumbing::tenant_cache::headers::/)'
    - id: helper-python
      why: The independently invoked MIT helper semantics must match the production functions.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3852::/)'
    - id: helper-case-corpus
      why: Oracle helper cases and corpus must replay with the new inference lifecycle decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/inference-lifecycle)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

