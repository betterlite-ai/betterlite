id: B3852
title: OTel V2 inference lifecycle and tenant tracer cache
description: >-
  Open and close exactly one inference/MCP span for each call, including error and
  cancellation paths, and release each provider lease after span closure. Route per-request
  credentials/projects through a bounded tenant tracer cache while preserving detached-trace
  links and destination overrides.

  The inference lifecycle routes calls through a bounded LRU tenant cache (256 cached providers,
  64 retained drained providers), opening an LLM-call span at the pre_call boundary when an
  ambient parent exists, or deferring creation to async close when the context is unavailable
  (thread-pool workers). The open-call map (10k entries) holds carriers from pre_call to close;
  eviction happens on overflow and does not prevent deferred emission. MCP tool calls and
  list-tools reach the callbacks with no pre_call carrier, so they are emitted whole (not
  opened/closed separately). Success/failure paths both close any open carrier (dedup on
  call id), and metric recording runs guarded against ValueError from bad otel.attributes
  filters — a once-only ERROR log followed by silent suppression on later calls.

  TenantTracerCache keyed by (credential_headers, project_headers, endpoint, service_name)
  builds and reuses per-request providers, applying dynamic OTLP headers from request
  params or key/team config, project-routing headers (Phoenix), and per-request service-name
  overrides. Detached routes (credential/project-scoped) root their own traces with a link
  back to the request root; service-name-only routing stays parented to the default backend.
  Credentials REPLACE the exporter's static headers; project headers APPEND to preserve
  backend auth. Owned exporters (spec.owner == callback_name) receive routing; others pass
  through unchanged. Evicted providers with open spans are drained (retired) until all spans
  close, then shut down; a quarter-cache cap on retirees bounds thread accumulation.

