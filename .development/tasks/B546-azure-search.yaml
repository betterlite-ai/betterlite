id: B546
title: Azure web search via Responses
description: >-
  Implement AzureSearchRequest/Reply with model/tool selection, citation-to-search result mapping, max_results normalization
  and native Entra-token minter injection. Retain billed-result metadata for B068 without calculating prices. Use
  catalog data supplied by callers; credentials stay in resolved settings.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/search/transformation.py:
  _unwrap_error_detail L122-L141; _snippet L144-L157; _citation_results L160-L178; _valid_max_results L181-L188;
  _requested_max_results L191-L201; _capped L204-L205; _search_tool L250-L261; _default_entra_token_minter L264-L267;
  BingGroundingSearchConfig.__init__ L271-L273; BingGroundingSearchConfig.ui_friendly_name L276-L277; BingGroundingSearchConfig.validate_environment
  L279-L296; BingGroundingSearchConfig._auth_header L298-L313; BingGroundingSearchConfig._mint_entra_token L315-L328;
  BingGroundingSearchConfig.get_complete_url L330-L346; BingGroundingSearchConfig.transform_search_request L348-L376;
  BingGroundingSearchConfig.transform_search_response L378-L405; BingGroundingSearchConfig._upstream_error L407-L412;
  BingGroundingSearchConfig._priced L414-L425; BingGroundingSearchConfig.get_error_class L427-L438.


  Reuse get_azure_ad_token_provider from B677 (litellm/secret_managers/get_azure_ad_token_provider.py); its implementation
  remains with that prerequisite.


  Named case contracts: search_request_web_tool: With truthy BING_GROUNDING_CONNECTION_ID send type=bing_grounding
  and bing_grounding.search_configurations=[{project_connection_id,count:<positive integer max_results when valid>}];
  otherwise type=web_search with user_location={type:approximate,country:<uppercase>} only for string country, including
  empty. Exclude None fields. Drop search_domain_filter/max_tokens_per_page; connection mode ignores country. scope_token_header:
  Explicit truthy api_key becomes api-key. Otherwise B091 trusted-destination server credential resolution uses
  BING_GROUNDING_TOKEN bound to BING_GROUNDING_PROJECT_ENDPOINT, then B677 mints scope https://ai.azure.com/.default.
  Mint failures become ValueError with the no-credential advice, all token/env names and underlying error. Return
  copied headers overlaid with auth and Content-Type=application/json; a preexisting opposite auth header is not
  removed. citation_snippets: Only output type=message, content type=output_text, annotations type=url_citation
  with truthy URL produce results. First URL occurrence wins in first-seen order, title defaults empty, date/last_updated=None.
  Snippet is the stripped current-line text before a valid start_index (else end of text), taking its last300 characters;
  empty claim falls back to the first300 text characters. max_results_invalid_default: Accept positive int max_results,
  rejecting bool, non-int and <=0; invalid/missing means no server count hint and no response cap. Built-in web_search
  never sends count; response cap reads optional_params only when it is Mapping. empty_search_response: Require
  output in the parsed envelope; ignore extra fields, default nested type/text to empty and content/annotations
  to empty tuples. Failed status always raises502 with error.message or the grounded search failed. Incomplete with
  no cited results raises502 the grounded search was incomplete: <reason-or-unknown reason>; incomplete with results
  succeeds. Other empty outputs succeed. nested_upstream_error: Unwrap outer error.message JSON and then optional
  inner message JSON; invalid layers retain their original text. Strip trailing periods/spaces and form Grounding
  with Bing Search: <detail>. See https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/bing-grounding
  for details. Preserve supplied status/headers; schema failure uses raw status and response does not match the
  Foundry Responses API schema: <validation error>. search_settings: Require truthy BING_GROUNDING_PROJECT_ENDPOINT
  unless explicit api_base resolves; trim trailing slashes and append /openai/v1/responses only when that suffix
  is absent. Missing endpoint raises ValueError with its name and https://<account>.services.ai.azure.com/api/projects/<project>
  example. Require BING_GROUNDING_MODEL for request transformation or ValueError naming it and example gpt-4.1.
  Join query lists with one space. search_response_price: Return object=search and capped results. Without truthy
  BING_GROUNDING_CONNECTION_ID set _hidden_params.additional_headers.llm_provider-x-litellm-response-cost=0.0; connection
  mode leaves cost-map ownership to B068.


  Load BING_GROUNDING_PROJECT_ENDPOINT, BING_GROUNDING_MODEL, BING_GROUNDING_CONNECTION_ID, BING_GROUNDING_TOKEN
  through betterlite-config, with injected environment lookup and the defaults/precedence stated here. Deployment
  inputs use litellm_params and global inputs use litellm_settings. Add config rstest azure_search_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Write standalone Rust test azure_search_credential_identity_isolation in betterlite-azure: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test azure_search_secret_safe_failure in betterlite-azure: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B2202. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-azure/src/search.rs with adjacent tests under search/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function search_cases in betterlite-azure with these exact named cases (one per oracle file): search_request_web_tool,
  scope_token_header, citation_snippets, max_results_invalid_default, max_results_cap, empty_search_response, nested_upstream_error,
  search_settings, search_response_price. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_search* using HelperCase: kind: helper
  and the externally tagged azure_search variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_search that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_grounding_reply consumes Responses grounding reply/error JSON bytes in crates/betterlite-azure/src/search.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_search.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_search.
  The adjacent test replays_the_azure_search_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 241 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 245 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 50 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
