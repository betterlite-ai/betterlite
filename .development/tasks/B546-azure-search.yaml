out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_search in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/search.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_search.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Citation deduplication retains the first result, not the last, despite building a dictionary from reversed citations.
- Response pricing rereads the connection setting, so the fixture must keep the same configured mode during request
  and reply.
