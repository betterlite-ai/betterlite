  - mutants
  commands:
  - id: case-search-request-web-tool
    why: The search-request-web-tool behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_search_request_web_tool$/)'
  - id: case-scope-token-header
    why: The scope-token-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_scope_token_header$/)'
  - id: case-citation-snippets
    why: The citation-snippets behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_citation_snippets$/)'
  - id: case-max-results-invalid-default
    why: The max-results-invalid-default behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_max_results_invalid_default$/)'
  - id: case-max-results-cap
    why: The max-results-cap behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_max_results_cap$/)'
  - id: case-empty-search-response
    why: The empty-search-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_empty_search_response$/)'
  - id: case-nested-upstream-error
    why: The nested-upstream-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_nested_upstream_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_search.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_search*")"
      && grep -lq 'azure_search' tools/oracle/fuzz/corpus/helper_case/azure_search* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_search$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_search)"
      && grep -q 'decode_grounding_reply' crates/betterlite-azure/fuzz/fuzz_targets/azure_search.rs && cargo nextest
      run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_search_corpus$/)'
