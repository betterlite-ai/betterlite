id: B546
title: Azure web search via Responses
description: >-
  Implement AzureSearchRequest/Reply with model/tool selection, citation-to-search result mapping, max_results normalization
  and native Entra-token minter injection. Retain billed-result metadata for B068 without calculating prices. Use
  catalog data supplied by callers; credentials stay in resolved settings.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/search/transformation.py:
  _unwrap_error_detail L122-L141; _snippet L144-L157; _citation_results L160-L178; _valid_max_results L181-L188;
  _requested_max_results L191-L201; _capped L204-L205; _search_tool L250-L261; _default_entra_token_minter L264-L267;
  BingGroundingSearchConfig.__init__ L271-L273; BingGroundingSearchConfig.ui_friendly_name L276-L277; BingGroundingSearchConfig.validate_environment
  L279-L296; BingGroundingSearchConfig._auth_header L298-L313; BingGroundingSearchConfig._mint_entra_token L315-L328;
  BingGroundingSearchConfig.get_complete_url L330-L346; BingGroundingSearchConfig.transform_search_request L348-L376;
  BingGroundingSearchConfig.transform_search_response L378-L405; BingGroundingSearchConfig._upstream_error L407-L412;
  BingGroundingSearchConfig._priced L414-L425; BingGroundingSearchConfig.get_error_class L427-L438.


  Reuse get_azure_ad_token_provider from B677 (litellm/secret_managers/get_azure_ad_token_provider.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-azure/src/search.rs with adjacent tests under search/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation azure_search in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function search_cases in betterlite-azure with these exact named cases (one per oracle file): search_request_web_tool,
  scope_token_header, citation_snippets, max_results_invalid_default, max_results_cap, empty_search_response, nested_upstream_error.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_search* using HelperCase: kind: helper
  and the externally tagged azure_search variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_search that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_grounding_reply consumes Responses grounding reply/error JSON bytes in crates/betterlite-azure/src/search.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_search.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_search.
  The adjacent test replays_the_azure_search_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 241 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 536 planned, 550 maximum changed lines.
