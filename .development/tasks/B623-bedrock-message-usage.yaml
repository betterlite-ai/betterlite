id: B623
title: Bedrock Messages terminal usage promotion
description: >-
  Add native MessageUsageState merging message_start cache counts and message_stop invocation metrics into the correct
  message_delta without dropping terminal events. Preserve unmodified event fields and the actual single-pending-delta
  overwrite behavior; this task transforms parsed event records.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeMessagesConfig._merge_message_start_cache_into_delta_usage L857-L875; AmazonAnthropicClaudeMessagesConfig._promote_message_stop_usage
  L878-L952; AmazonAnthropicClaudeMessagesStreamDecoder._chunk_parser L956-L991.


  Named case contracts: start_cache_into_delta: _merge_message_start_cache_into_delta_usage does nothing for a falsey
  start snapshot. For cache_creation_input_tokens,cache_read_input_tokens and cache_creation, copy the start value
  only when the delta key is absent and the start value is not None. Preserve explicit delta None/0 and arbitrary
  start value types; do not copy input_tokens/output_tokens here. stop_metrics_promoted: The decoder pops amazon-bedrock-invocationMetrics
  from every event even when its value is falsey. For truthy metrics, map only present inputTokenCount->input_tokens,
  outputTokenCount->output_tokens, cacheReadInputTokenCount->cache_read_input_tokens and cacheWriteInputTokenCount->cache_creation_input_tokens,
  without coercion. An existing usage dict wins for every key, including explicit None; a non-dict existing usage
  is discarded. Preserve all other fields, including inference-region fields; do not synthesize zeros for absent
  metric keys. existing_delta_usage: Hold message_delta without yielding it. A second consecutive message_delta
  overwrites and discards the earlier pending delta, matching the source. On message_stop with a pending delta,
  copy stop cache creation/read counts by key presence even if None, copy non-None stop input_tokens unchanged when
  a Python int (including bool) else 0, then fill missing cache values from the start snapshot. Never promote stop
  output_tokens or cache_creation breakdown directly; existing delta values or the start snapshot supply those.
  missing_stop_metrics: message_start snapshots only a dict message.usage with a shallow copy; a later start lacking
  a dict usage leaves the previous snapshot intact. Flush a pending delta before yielding each start, any other
  dict event, or any non-dict item, without merging start cache values on those flushes. Stop without a pending
  delta passes through. At EOF only, merge start cache fields into the pending delta before yielding it. cache_creation_details:
  A present cache_creation key on the pending delta blocks the start snapshot even when None; otherwise the start
  breakdown is copied as-is. Do not invent a cache breakdown from invocation metrics or copy message_stop.cache_creation.
  Preserve stop usage and metrics-derived event fields after promotion. event_order_after_promotion: With a pending
  delta and a stop, yield the updated delta first and the original stop second. Assign merged usage only when truthy;
  otherwise leave the pending event's existing usage unchanged. Other events and byte/model chunks remain in source
  order except consecutive deltas deliberately overwrite as above. The helper does not add an SSE envelope or own
  cancellation.


  Implement crates/betterlite-bedrock/src/message_usage.rs with adjacent tests under message_usage/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_message_usage in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function message_usage_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  start_cache_into_delta, stop_metrics_promoted, existing_delta_usage, missing_stop_metrics, cache_creation_details,
  event_order_after_promotion. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_message_usage* using HelperCase: kind:
  helper and the externally tagged bedrock_message_usage variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_message_usage that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 115 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 145 production lines, 210 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 480 planned, 500 maximum changed lines.
