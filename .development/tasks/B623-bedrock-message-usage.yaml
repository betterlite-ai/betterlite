  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/message_usage.rs
  - crates/betterlite-bedrock/src/message_usage/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_message_usage.rs
  - tools/oracle/src/helpers/bedrock_message_usage/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_message_usage.py
  - tools/oracle/cases/helpers/providers/bedrock-message-usage/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_message_usage*
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py#L857-L991
  why: >-
    Own AmazonAnthropicClaudeMessagesConfig._merge_message_start_cache_into_delta_usage, AmazonAnthropicClaudeMessagesConfig._promote_message_stop_usage,
    AmazonAnthropicClaudeMessagesStreamDecoder._chunk_parser. Other functions in this file remain with the owners
