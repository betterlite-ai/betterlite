dod:
- text: >-
    start cache into delta: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-usage/start-cache-into-delta.yaml.
  proof:
  - case-start-cache-into-delta
  - oracle
  - helper-python
- text: 'stop metrics promoted: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-usage/stop-metrics-promoted.yaml.'
  proof:
  - case-stop-metrics-promoted
  - oracle
  - helper-python
- text: 'existing delta usage: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-usage/existing-delta-usage.yaml.'
  proof:
  - case-existing-delta-usage
  - oracle
  - helper-python
- text: 'missing stop metrics: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-usage/missing-stop-metrics.yaml.'
  proof:
  - case-missing-stop-metrics
  - oracle
  - helper-python
- text: >-
    cache creation details: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-usage/cache-creation-details.yaml.
  proof:
  - case-cache-creation-details
  - oracle
  - helper-python
- text: >-
    event order after promotion: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-usage/event-order-after-promotion.yaml.
  proof:
  - case-event-order-after-promotion
  - oracle
  - helper-python
- text: New bedrock_message_usage seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-start-cache-into-delta
    why: The start-cache-into-delta behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_usage_cases::case_[0-9]+_start_cache_into_delta$/)'
  - id: case-stop-metrics-promoted
    why: The stop-metrics-promoted behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_usage_cases::case_[0-9]+_stop_metrics_promoted$/)'
  - id: case-existing-delta-usage
    why: The existing-delta-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_usage_cases::case_[0-9]+_existing_delta_usage$/)'
  - id: case-missing-stop-metrics
    why: The missing-stop-metrics behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_usage_cases::case_[0-9]+_missing_stop_metrics$/)'
  - id: case-cache-creation-details
    why: The cache-creation-details behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_usage_cases::case_[0-9]+_cache_creation_details$/)'
  - id: case-event-order-after-promotion
    why: The event-order-after-promotion behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_usage_cases::case_[0-9]+_event_order_after_promotion$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_message_usage.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_message_usage*")"
      && grep -lq 'bedrock_message_usage' tools/oracle/fuzz/corpus/helper_case/bedrock_message_usage* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_message_usage$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
