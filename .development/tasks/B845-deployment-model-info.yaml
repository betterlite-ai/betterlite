dod:
  - text: 'refresh_model_metadata covers snapshot_eight_workers, invalid_one_does_not_stop_others,
      debug_not_warning_on_failure, empty_refresh_invalidates, credential_overlay_before_resolution,
      four_provider_allowlist, absent_base_wildcard_and_clientside_skips, dynamic_key_fallback,
      extra_headers_then_headers, lowercase_explicit_authorization_wins, invalid_header_values,
      empty_discovery_no_write, missing_id_no_write, replacement_during_request_no_write,
      resize_delete_set_invalidate_order and discovery_ttl_six_hundred.'
    proof: [behavior-tests]
  - text: 'listing_metadata covers stale_or_wrong_cache_record, equal_id_different_identity,
      configured_nonnull_suppresses_discovery, explicit_null_allows_discovery, ordered_cost_key_dedup,
      base_model_fallback, unknown_and_expanded_name_absent, widest_group_limits,
      one_deployment_configured_limits, malformed_bool_nan_infinity_limits, numeric_string_float_limits,
      zero_negative_limits, blank_or_nonstring_mode_and_display and original_whitespace_preserved.'
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: 'router_metadata_merge covers resolved_id_replaces_supplied, unknown_id_retains_supplied,
      missing_deployment_error, malformed_params_error_and_id, base_model_none_precedence,
      nonazure_resolved_model_overrides_base, azure_positive_input_or_context_fallback_debug,
      azure_zero_stub_or_output_only_error_continues, wildcard_same_id_and_bad_candidate,
      provider_prefix_once, model_lookup_none_or_error, configured_false_zero_empty_win,
      source_metadata_unmodified, raw_lookup_identity, group_by_indexed_id,
      custom_builtin_base_combinations, each_lookup_failure_swallowed,
      no_custom_id_no_discovery, numeric_strings_and_shallow_nested_merge,
      absent_prices_become_null and explicit_zero_or_null_price_key_present.'
    proof: [behavior-tests, oracle]
  - text: native_huggingface_metadata_uses_local_assets_only returns absent max_tokens without a local asset and makes no Hugging Face request.
    proof: [behavior-tests]
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^deployment_model_info::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/deployment_model_info.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/deployment-model-info-*")"
        && grep -rlq "deployment_model_info" tools/oracle/fuzz/corpus/helper_case/deployment-model-info-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
