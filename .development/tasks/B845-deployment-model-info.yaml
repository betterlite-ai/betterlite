id: B845
title: Deployment model info and configured limits
description: >-
  Implement deployment_model_info in betterlite-router over B844's catalog indexes. Own the refresh,
  discovered-info and listing/configured-limit methods at router.py L10350-L10548, the overloaded
  get_router_model_info and get_model_info/get_model_group/get_deployment_model_info at L10664-L10907,
  and DiscoveredDeploymentModelInfo/DeploymentModelListingInfo at types/router.py L702-L723. These
  immutable records hold deployment identity plus limits, and ordered cost-map keys plus optional
  input/output limits. B2306 owns credential selection, including the team public-name helper.

  Refresh snapshots model_list and distributes its iterator among eight workers. One deployment's
  validation/provider/network error logs debug Could not refresh deployment model info and does not
  stop the others. Invalidate model-group metadata after all workers finish, even with an empty
  snapshot. Overlay B2306's resolved credentials on deployment params before B174 provider resolution.
  Discover only hosted_vllm, openai, text-completion-openai and openai_like; skip absent api_base, a star
  in the resolved model, and truthy use_clientside_credentials. Use params.api_key or the dynamic key.
  Select truthy extra_headers, then headers, then an empty mapping; validate string keys/values and
  lowercase names before overlaying authorization=Bearer <key>. Explicit Authorization wins. Call
  B038.get_openai_compatible_model_info with B173's supplied or pooled OpenAI client and B125's memory
  cache. B038 owns the configured /v1/models request, five-second timeout and response decoding.

  Empty discoveries, missing IDs and a deployment replaced during the request do not update the cache.
  Identity is the actual catalog record, not merely an equal ID or equal contents. For a current result
  set capacity=max(current deployment count,1), delete its old entry, store the result and invalidate
  model-group metadata. Initialize discovery storage with that capacity and TTL 600 seconds, twice
  MODEL_INFO_REFRESH_SECONDS=300. B124 owns startup scheduling. Reads reject wrong record types and
  stale identities, exposing discovered fields only where configured model_info is absent or None.
  A malformed but non-null configured limit suppresses discovery before later coercion drops it.

  get_model_listing_info performs exact model-name index lookup without pattern expansion, scanning
  every deployment in the group. Overlay configured non-null fields on discovery. Choose each row's
  truthy model_info.base_model, params.base_model, then params.model; retain nonempty strings and
  deduplicate in configuration order. Take the largest input/output limit after B206.coerce_token_limit:
  bools, malformed strings, NaN and infinity disappear; numeric strings and finite floats use int
  semantics; zero and negative integers remain valid. Unknown names return None. In contrast,
  get_configured_token_limits reads one B844-selected deployment, returning (None,None) if unknown.
  Mode and display_name also read one row: require a string with nonempty stripped content but return
  the original untrimmed value.

  get_router_model_info replaces a supplied deployment only when an explicit id resolves. Missing
  deployment raises ValueError Deployment not found. Invalid litellm_params raises ValueError
  Deployment missing valid litellm_params. Got: <type>, deployment_id: <id-or-unknown>. Resolve
  base_model from model_info then params only when the former is None. Non-Azure providers nevertheless
  use the resolved model, overriding base_model. For Azure with no base, log debug when the azure/
  cost entry has positive max_input_tokens, max_tokens or input_cost_per_token; otherwise log error
  with the source base_model advice and cost-tracking URL, then continue. Stub membership and positive
  output price alone do not qualify. Non-Azure wildcard models use B367's first expanded match with
  the same deployment ID, silently skipping malformed candidates. Prefix the provider only if absent
  and call B2225.get_model_info. None returns immediately and lookup exceptions propagate. Otherwise
  deep-copy the cached result, overlay discovery, then configured non-null fields. Preserve false,
  zero and empty values without mutating the shared catalog result.

  get_model_info returns the original indexed deployment or None; get_model_group returns its
  same-name group through B844 or None. get_deployment_model_info separately tries a custom cost entry
  by ID, a built-in entry by model name, and the custom entry's non-null base_model, swallowing each
  lookup failure. Discovery participates only if the custom ID exists in the cost map. Merge base
  defaults into custom values, then custom over built-in using B157._update_dictionary: skip null
  overrides, convert numeric strings and shallow-merge nested maps. Return whichever sources exist,
  or None. B157.cost_map_omits_token_price reads raw custom/built-in/base entries; when at least one
  exists and none contains either token-price key, set both prices to None. An explicitly present
  zero or null price key defeats that rule. B193 supplies the raw catalog and B205 ModelInfo fields;
  do not use the B013 umbrella as the runtime metadata owner.

  Pure projections use deployment_model_info under B856's models dispatch and B171's helper parser.
  The Python adapter calls pinned methods with fixture catalog/cache state; compare values, complete
  ValueError messages, debug/error events and input immutability. Refresh is effectful: Rust tests
  call the real B038 transport against a local mock, including request headers and failure isolation.
  No new byte decoder or config loader is introduced. Keep B2219's current local-only Hugging Face
  behavior, recorded as a deviation below, until Max resolves downloads.

  Method ranges contain 369 nonblank, noncomment lines including overloads/docstrings. The immutable
  records and cache initialization add 22. Allow 330 production, 330 tests, 90 adapters and 40 wiring
  lines, 790 within 800. Separate refresh, listing and merge children keep Rust files below 300 lines.
