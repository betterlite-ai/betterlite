id: B7891
title: Python decisions, SystemOne and sandbox functions
description: >-
  This task adds `decisions`, `adecisions` (litellm/decisions/main.py and call.py), `systemone`, `asystemone` (litellm/systemone/main.py), and the sandbox functions `acreate_sandbox`, `arun_code`, `adelete_sandbox`, `acode_interpreter_tool`, with `register_sandbox_tools`, `resolve_sandbox_tool` and `clear_sandbox_tools` of litellm/sandbox/sandbox_tools.py. Rust runs the calls (B3513 provider list, B3515 decisions and SystemOne entry points, B3519 sandbox dispatch and tool registry).


  Native side, the family `decision_calls`: `src/decision_calls.rs` with `register` that adds `NativeDecisionSession` and `NativeDecisionError`, and `src/decision_calls/convert.rs` with tests `request_*` and `error_*`. The sandbox tool registry lives in the native session object and not in a module global. The architect writes the `lib.rs` line.


  Python side, `python/betterlite/decisions/main.py`, `systemone/main.py`, `sandbox/main.py`, `sandbox/sandbox_tools.py` and the three `__init__.py` files. `decisions(model, input, questions, safety_identifier, api_key, api_base, timeout, custom_llm_provider, extra_headers, **kwargs)` and `systemone(model, state, questions, ...)` keep their signatures and return the typed responses of B167. `acreate_sandbox(provider, template, timeout, allow_internet_access, api_key, api_base, **kwargs)`, `arun_code(provider, container, code, api_key, **kwargs)`, `adelete_sandbox` and `acode_interpreter_tool(provider, code, template, timeout, api_key, api_base, **kwargs)` return `ContainerHandle` or `CodeExecutionResult`. `supported_decisions_providers()` (call.py L88) is exposed too. The private prepare helpers are not. Python objects that cannot cross to Rust (`client`, `shared_session`) raise `UnsupportedCallArgument` from B158.
scope:
