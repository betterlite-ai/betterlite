dod:
- text: Every function keeps LiteLLM's name and parameters, and a keyword LiteLLM refuses is refused here.
  proof: [decisions-signature]
- text: "Decisions, SystemOne and the sandbox functions return the same results as LiteLLM against one local server, and the registry functions give the same lookups."
  proof: [decisions-calls]
- text: A provider error keeps its class and cause, and an unsupported Python object raises `UnsupportedCallArgument`.
  proof: [decisions-errors]
- text: The native register function and conversion have tests without an interpreter.
  proof: [decisions-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: decisions-signature
    why: A caller's keyword is accepted or refused wrongly.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_decisions.py -k signature
  - id: decisions-calls
    why: A result differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_decisions.py -k calls
  - id: decisions-errors
    why: An error class or message changes.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_decisions.py -k 'error or unsupported'
  - id: decisions-native
    why: A field changes on the way.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^decision_calls::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Strict typing has to hold for these calls.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: The sandbox tool registry is held by the native session and not in a module global.
  why: The rules forbid module-level state. A `register_sandbox_tools` call and a later `resolve_sandbox_tool` through the same default session still agree.
- what: This task has no helper oracle cases.
  why: The functions call a native session, so pytest compares both packages against one local server.
out_of_scope:
- "Provider execution belongs to B3513, B3515 and B3519."
- "The harness sandbox exports that LiteLLM loads lazily in sandbox/__init__.py are not part of this entry."
pitfalls:
- "Passing both an OpenAI-format and a SystemOne-format field to one call raises the error of `reject_other_format` (call.py L340), and Rust raises it."
- "The sandbox functions are async only. There is no sync twin."
- "`acode_interpreter_tool` creates, runs and deletes in one call, so a failure in the run still deletes the sandbox."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
