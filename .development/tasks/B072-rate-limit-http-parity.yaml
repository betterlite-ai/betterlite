deviations: []
out_of_scope:
  - "B072 owns integration tests only; every referenced live implementation stays with its existing owner, and no new LiteLLM function is ported."
  - "v3 records, constants, protocols, fail-closed policy, key helpers, stash helpers, _as_counter_values, _get_current_time and the typed replacement of _call_id_from_callback_kwargs: B3031."
  - "v3 __init__, _get_batch_rate_limiter, get_rate_limiter_for_call_type and _resolve_model_group_alias_via_proxy_router: B5660; the batch algorithm is B1047."
  - "v3 _is_redis_cluster, both sliding-window functions, keyslot_for_redis_cluster, _pipeline_scripts, _group_keys_by_hash_tag, _batch_get_counter_values and both counter-read functions: B3032."
  - "v3 atomic payload construction, atomic-response construction, local atomic evaluation and CHECK_AND_INCREMENT_BY_N_SCRIPT: B3033; atomic_check_and_increment_by_n, descriptor Lua invocation, pipelined settlement and all descriptor-group refund functions: B3034."
  - "v3 gauge reads/statuses, _check_parallel_request_gauges, local acquisition, every parallel-slot release/defer/mirror function and the gauge scripts: B3035; is_cache_list_over_limit, _execute_redis_batch_rate_limiter_script, _refund_later_pipelined_groups, should_rate_limit and _collect_windowed_keys_and_gauges: B3036."
  - "v3 token scripts, token increment/defer functions, both window-guarded increment functions, reservation-aware increments, _build_reservation_aware_tpm_ops and both project reservation-op builders: B3037."
  - "v3 RateLimitedModel.limit_in is B3031; _rate_limited_model, organization/key/team/project model descriptors, all key-owns/inherited-model predicates and project I/O descriptors: B3038."
  - "v3 tag lookup/descriptor helpers, MCP key/team descriptors, agent registry/id/session helpers and agent/session/tag descriptor builders: B3039."
  - "v3 _should_enforce_rate_limit, _get_enforced_limit, _is_dynamic_rate_limiting_enabled, _create_rate_limit_descriptors and _check_model_has_recent_failures: B3040."
  - "v3 _parse_output_cap_value, no_max_tokens_output_floor, embedding/native-request detection and translation, all output-cap/candidate helpers and every token/audio/Responses/rerank input estimate helper: B3041."
  - "v3 reserve_tpm_tokens, _refund_reserved_tokens, reserve_io_tokens and enforce_project_io_token_quota_for_frame: B3042; _reserve_project_io_tokens_or_raise: B3043."
  - "v3 usage extraction/filtering, aggregate-only fallback, rerank and I/O usage resolution, get_rate_limit_type and _recovered_partial_usage_tokens: B3044; _build_io_token_reservation_ops, _collect_tpm_scope_targets and _build_success_event_pipeline_operations: B3045."
  - "v3 header merge/mirroring, logging success/failure, disconnect release, both post-call hooks and _handle_batch_enqueued_post_call: B3046; _handle_rate_limit_error and provider/priority utilities: B3030, with the auth-side provider projection in B2327."
  - "v3 _build_request_rate_limit_descriptors, _release_request_capacity_when_admitted, request_capacity and async_pre_call_hook: B3055."
  - "v3 _create_pipeline_operations L4193-L4217 has no caller at the pin: a checkout-wide rg finds only its definition; do not build it or add a helper case."
  - "Legacy constructor, verbose/error/minute/cache-object helpers and check_key_in_limits: B3047; _response_total_tokens and success/failure/header callbacks: B3048; async_pre_call_hook: B3049; legacy get_internal_user_object has no caller at the pin."
  - "All dynamic_rate_limiter.py functions: B3050. In dynamic_rate_limiter_v3.py, construction, settings, priority, saturation and descriptor helpers are B3051, _check_rate_limits and async_pre_call_hook are B3052, and response/success hooks are B3053. All max_iterations_limiter.py functions and TTL config: B3054."
  - "Default proxy-hook construction, selection, registration and callback adapters: B8399. Named dynamic adapters and their shared hook/logger instance: B8749. Request preparation and call metadata: B8802/B8805; chat and Messages handover: B8803/B8804."
  - "Realtime disconnect dispatch: B2400, called by B1125; stream cleanup: B8605/B8633. Compaction invocation/metadata are B2432/B971, while its quota-charge operation is B3045/B3046 and spend settlement is B8481."
  - "Server composition and existing area mounts are B8610 and their area tasks, including B8626, B8701 and B8728 for MCP; none is mounted again here. Management setup handlers remain B055/B804 and authentication remains its existing owners."
pitfalls:
  - "The default parallel limiter and dynamic_rate_limiter_v3 share request-local stash state in LiteLLM, so integration tests must preserve hook order rather than allocate one stash per callback."
  - "Dynamic priority admission and headers read team priority first, but success token accounting reads user_api_key_auth_metadata.priority, so using one unified priority would change charging."
  - "A stream's wire headers are fixed before its final usage arrives, so verify settlement with a later request instead of expecting final quota values to appear retroactively."
  - "Generated key values differ between the two proxy databases, so only secret captures may carry them into later Authorization headers."
  - "B3055's existing four HTTP cases remain its files; this task runs them but must not rewrite them or use --self-check as parity evidence."
  - "B9250's case directory is a dependency input to this final suite, so new legacy or dynamic cases and their fixes belong to B9250 rather than this task's writable directory."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
