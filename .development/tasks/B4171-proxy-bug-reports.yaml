dod:
  - text: Credential-like keys are filtered based on name matching the allowlist parts (key, keys, secret, secrets, token, password, passwd, credential, credentials, url, uri, dsn, host, hosts, base, endpoint, cert, pem, salt) after splitting on underscore, except key_management_system which is always included.
    proof: [credential-filter-tests]
  - text: Boolean values format as lowercase true/false; strings format only if they are in the known-values set and not credential-like keys; other types are skipped.
    proof: [credential-filter-tests]
  - text: Model list providers are extracted from litellm_params.model prefixes, deduplicated, sorted ascending and returned as a single comma-separated list.
    proof: [credential-filter-tests]
  - text: safe_config_lines returns an immutable ordered tuple with general_settings, litellm_settings, cache_params, router_settings, guardrails and model_list lines in that order, with no duplicates or blanks.
    proof: [credential-filter-tests]
  - text: build_proxy_bug_report calls build_bug_report with surface='proxy' and config_lines from safe_config_lines, returning a BugReport with exception type and frames preserved.
    proof: [safe-proxy-config-tests]
  - text: build_proxy_environment_report calls build_environment_report with surface='proxy' and config_lines from safe_config_lines, returning an EnvironmentReport.
    proof: [safe-proxy-config-tests]
  - text: GET /debug/report requires authentication through user_api_key_auth.
    proof: [report-route-tests]
  - text: GET /debug/report returns HTTP 403 Forbidden for authenticated non-admin users.
    proof: [report-route-tests]
  - text: GET /debug/report returns HTTP 200 with an EnvironmentReport for proxy admins.
    proof: [report-route-tests]
  - text: The EnvironmentReport returned by /debug/report matches the format from build_proxy_environment_report with safe_config_lines output.
    proof: [report-route-tests]
checks:
  optional: []
  commands:
    - id: credential-filter-tests
      why: Credential key filtering, value rendering or config line assembly fails or does not exist
      run: cargo nextest run --locked -p betterlite-reporting --no-tests=fail -E 'test(/^safe_proxy_config::tests::/) - test(/replays_the_/)'
    - id: safe-proxy-config-tests
      why: build_proxy_bug_report or build_proxy_environment_report is missing or does not integrate with B4170
      run: cargo nextest run --locked -p betterlite-reporting --no-tests=fail -E 'test(/^safe_proxy_config::tests::/) - test(/replays_the_/)'
    - id: report-route-tests
      why: The /debug/report route is missing, does not authenticate, does not check admin status, or returns wrong types
      run: cargo gate run B4171 --only oracle
oracle_cases:
  - tools/oracle/cases/debug/report/admin-access.yaml
  - tools/oracle/cases/debug/report/non-admin-403.yaml
  - tools/oracle/cases/debug/report/unauthenticated.yaml
deviations:
  - what: Configuration is read from a typed snapshot parameter, not loaded by the route. The proxy's running config and general_settings are passed in at startup by the caller.
    why: betterlite separates config loading (B002) from debug reporting. This route reports what is running, not what is in a file.
  - what: Known-name sets for litellm and router modules are built once at startup using AST parsing over module source, not by importing at runtime.
    why: Native Rust cannot execute Python imports. Startup parsing of LiteLLM's module-level constants is lightweight and avoids runtime overhead.
  - what: Provider enum values are extracted from a static constant list, not from a provider registry. betterlite has no provider dispatch yet.
    why: Decoupling safe config formatting from provider discovery keeps this module stable and reusable.
out_of_scope:
  - Configuration loading and validation. B002 owns config parsing; this task reports the snapshot that was loaded.
  - Request dispatch and other debug routes. GET /memory-usage, /debug/asyncio-tasks and others are owned by B4173 and B4174.
  - The exporter's get_finished_spans callable used by GET /otel-spans. B4174 owns that route; the exporter is a dependency.
  - Custom secrets manager operations and other config dependencies referenced but not owned by B002.
  - Caller wiring for build_proxy_bug_report in proxy exception paths (proxy_server.py, utils.py, common_request_processing.py). This function is built here; the callers that invoke it at error time depend on this part.
pitfalls:
  - >-
    Credential-like key filtering is case-insensitive and substring-based on the parts: key, keys, secret, secrets, token, password, passwd, credential, credentials, url, uri, dsn, host, hosts, base, endpoint, cert, pem, salt.
    A key like "user_password_hash" contains "password", so it is filtered even though the full name is not in the allowlist.
    The exception key_management_system is matched exactly, not as a substring.
  - Boolean values are safe under credential-like keys; strings are not. A credential.use_ssl = true is included, but credential.api_key = "openai" is not.
  - Model list provider extraction splits on the first forward slash and does not lowercase. If a deployment's litellm_params.model is "GPT-4/Claude", the provider is "GPT-4".
  - The frozen known-values set must be static and baked in at compile time. Do not reload it per route call or per config change.
  - Proxy admin status is checked through is_proxy_admin from B1018. If that callable changes ownership or interface, update the reference here.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
