    - crates/betterlite-reporting/src/safe_proxy_config/**
    - crates/betterlite-server/src/debug_routes.rs
    - crates/betterlite-server/src/debug_routes/**
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/debug/report/**
