id: B4171
title: Allowlisted proxy configuration reports
description: >-
  Add crates/betterlite-reporting's safe_proxy_config module to filter and format the running proxy's configuration
  for debugging, preserving credential-key filtering and the proxy-admin-only 403 branch.
  Register GET /debug/report in betterlite-server, wired through the authentication pipeline to return an EnvironmentReport
  when the authenticated principal is a proxy admin, otherwise HTTP 403.

  The configuration snapshot reads the proxy's runtime config state but does not load config here; accept a typed snapshot
  parameter instead of depending on a configuration umbrella.
  Filter out credential-like keys by name (key, keys, secret, secrets, token, password, passwd, credential, credentials, url, uri, dsn, host, hosts, base, endpoint, cert, pem, salt),
  except for the static string enum key_management_system which may appear even under credential-like keys.
  Boolean values are allowed under credential-like keys; strings are not.
  Preserve ordering and the provider deduplication in model lists: sort providers ascending and return them once.
  Known values are read-only LiteLLM constants: provider names, cache types, guardrail hooks, KMS types, logging callbacks and routing strategies.
  config_lines returns only known keys whose values are known or safe booleans, formatted as lowercase bool (true/false),
  comma-separated lists inside brackets, or bare strings from the known-values set.
  Skip any value that does not match those rules, including strings that look like credentials (any substring of a credential key in any part after splitting on underscore).
  For model_list, extract every deployment's provider prefix (the part before the first slash in litellm_params.model)
  and return one line with all unique providers sorted.

  The safe_config_lines function takes a runtime config snapshot (Mapping[str, object]) and general_settings snapshot,
  validates their JSON structure with pydantic TypeAdapters, and returns an immutable tuple of formatted lines for each
  supported section: general_settings, litellm_settings, litellm_settings.cache_params, router_settings, guardrails
  and model_list, in that order, with no blank lines.
  Reuse the known-name sets from build_environment_report without importing Python modules at runtime; snapshot them as static data.
  Use ast parsing to extract module-level names from the litellm and litellm.router modules at startup,
  then freeze the results in a const.

  Register the route as GET /debug/report with no schema in include_in_schema.
  The route requires authentication through B052's user_api_key_auth.
  Only proxy admins (verified via is_proxy_admin from B1018) can read this route; other authenticated principals
  get HTTP 403 Forbidden with a message naming the permission.
  The route returns the EnvironmentReport built by calling build_proxy_environment_report, which calls safe_config_lines
  with a snapshot of the proxy's running configuration and general_settings.

  Review as security-sensitive and test the route through the booted server.
scope:
