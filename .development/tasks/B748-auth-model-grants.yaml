id: B748
title: Agent model ceilings and fallback authorization
description: >-
  Enforce agent ceilings and invoke B886's resolved-model policy before router fallbacks. For a falsey
  model, missing token or falsey agent_id, the ceiling check returns True without agent lookup. Use
  managed_agent_policy first; a managed policy resolves all managed ceilings and never calls the
  unmanaged resolver. Otherwise a None unmanaged ceiling means no restriction. Resolve team aliases
  through B747 once, then intersect every ceiling in order. Empty ceiling.models explicitly denies
  with 403 agent_model_access_denied, param model, code 403 and the safe model-access message; keep
  the internal diagnostic 'agent <id> access groups grant no models' separate. Nonempty ceilings
  pass sorted model names, object_type=agent, team_id and B747 key aliases to _can_object_call_model.

  Caller restrictions skip falsey model/missing token or absent agent_caller_auth. Load the caller
  team first. When present, run B886 can_team_access_model before B887 member-model scope with the
  caller auth, forwarding key aliases from the original agent token, then return without loading a
  user. Otherwise load caller user and run B886 can_user_call_model if present. Loader/policy errors
  propagate; no broad fallback silently widens the caller's model grant.

  Own an AgentAccessSource port with managed policy, managed/unmanaged ceilings, caller auth and
  caller team/user reads corresponding to those six MIT collaborators in B141's agent auth module.
  B141 installs its implementation when agent routes are composed; B732 supplies it to these checks.
  A configured agent without that service is an initialization error, not an empty ceiling. Native
  recording-port tests prove lookup order; actual agent registry storage remains B141's responsibility.

  general_settings.enforce_fallback_model_access defaults false. Disabled enforcement returns True
  without extracting a token; enabled internal requests with no auth context also return True.
  Source extracts user_api_key_auth from metadata first, then litellm_metadata, skipping invalid
  Pydantic shapes. betterlite retains that projection only in its source-comparison adapter and uses
  authenticated AuthContext in production, as declared below. With a token, call B886
  can_key_call_resolved_model with llm_model_list=None. A ProxyException returns False silently;
  any other error WARNs 'Skipping fallback to model=...: authorization lookup failed' and returns
  False without replacing the original provider error. A completed check returns True. B310 consumes
  this predicate; do not import the router fallback orchestrator back into authentication.


  Build the production auth_model_grants module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _check_agent_access_group_model_access (L4546-L4585; 38 source lines), _check_agent_caller_model_access
  (L4594-L4640; 47 source lines). litellm/proxy/auth/fallback_model_access.py: is_model_authorized_for_token
  (L31-L44; 14 source lines), _token_in_metadata (L47-L51; 5 source lines), _user_api_key_auth_from_request
  (L54-L62; 9 source lines), _enforced_by_general_settings (L65-L68; 3 source lines), RouterFallbackAccessCheck.__call__
  (L81-L87; 7 source lines).


  general_settings.enforce_fallback_model_access=false; true reruns the effective entity policy for each
  resolved fallback target.


  Add the auth_model_grants operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-model-grants-*
  seed to B171 helper_case, which already owns this decoder.


  Agent chat requests use B732's installed AgentAccessSource and compare the safe 403 envelope while
  retaining private diagnostics internally. Fallback cases assert a boolean and ordered lookup/log
  effects; a refused fallback must not overwrite the original provider failure.


  B860 fixtures use POSTGRES_TEST_URL or testcontainers with agent callers having a narrower team
  grant than the agent itself; a broad agent grant must not erase that caller ceiling.


  B002 loader tests fallback_access_default_false, fallback_access_enabled and invalid_fallback_bool
  assert the actual boolean conversion/rejection, then call production admission. There is no env
  precedence or invalid-value fallback. Seed the nested general_settings key. The Python operation
  injects is_enforced instead of calling _enforced_by_general_settings with proxy_server globals.


  The source comparison adapter alone decodes legacy metadata auth shapes; production consumes the
  authenticated context and typed ceilings. It must never grant access from client-supplied metadata.


  Sizing: 123 source lines; allow 170 production/port, 255 tests, 80 adapters, 65 wiring and 50 config,
  620 within 700. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: fallback_uses_auth_context and forged_metadata_cannot_grant.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Server wiring tests live under betterlite-server::auth::auth_model_grants::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
