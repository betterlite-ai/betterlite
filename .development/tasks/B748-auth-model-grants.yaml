dod:
  - text: 'Agent cases: missing_model_token_agent_skips, managed_beats_unmanaged,
      unmanaged_none_unrestricted, empty_ceiling_denies_403, all_ceilings_intersect,
      team_alias_before_ceiling, sorted_models_and_key_aliases, caller_absent_skips,
      caller_team_before_membership, caller_team_skips_user, caller_user_fallback,
      missing_caller_user_skips and caller_lookup_error_propagates. Compare named helper rows
      and the real HTTP denial envelope, keeping internal messages out of responses.'
    proof:
      - behavior-tests
  - text: 'Fallback cases: disabled_skips_token, enabled_without_token_allows,
      metadata_before_litellm_metadata, invalid_metadata_tries_second,
      resolved_policy_without_model_list, proxy_denial_silent_false,
      lookup_failure_warns_false and fallback_success_true. Native cases
      fallback_uses_auth_context and forged_metadata_cannot_grant exercise the deliberate identity source.'
    proof: [behavior-tests, helper-python, oracle]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: 'Native fallback_uses_auth_context and forged_metadata_cannot_grant prevent caller metadata from changing the authenticated token.'
    proof:
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(/^(auth::)?auth_model_grants::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_model_grants.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-model-grants-*")"
        && grep -rlq "auth_model_grants" tools/oracle/fuzz/corpus/helper_case/auth-model-grants-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::auth_model_grants::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-model-grants-*")"
        && grep -rlq "enforce_fallback_model_access" crates/betterlite-config/fuzz/corpus/config_yaml/auth-model-grants-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_model_grants::tests::/)
        - test(/replays_the_/)'
