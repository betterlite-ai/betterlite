    - packaging/helm/betterlite-helm/templates/hpa.yaml
    - packaging/helm/betterlite-helm/templates/keda.yaml
    - packaging/helm/betterlite-helm/templates/poddisruptionbudget.yaml
    - packaging/helm/betterlite-helm/templates/ingress.yaml
    - packaging/helm/betterlite-helm/templates/servicemonitor.yaml
    - packaging/helm/betterlite-helm/templates/tests/test-connection.yaml
    - packaging/helm/betterlite-helm/templates/tests/test-env-vars.yaml
    - packaging/helm/betterlite-helm/templates/tests/test-servicemonitor.yaml
    - packaging/helm/betterlite-helm/tests/hpa_tests.yaml
    - packaging/helm/betterlite-helm/tests/keda_tests.yaml
    - packaging/helm/betterlite-helm/tests/pdb_tests.yaml
    - packaging/helm/betterlite-helm/tests/ingress_tests.yaml
    - packaging/helm/betterlite-helm/tests/servicemonitor_tests.yaml
  lint_tables: false
references:
