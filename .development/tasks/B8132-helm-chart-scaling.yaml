    why: Metric list and the ContainerResource switch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/keda.yaml#L1-L58
    why: ScaledObject, prometheus triggers and the serverAddress failure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/poddisruptionbudget.yaml
    why: PDB precedence and default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/ingress.yaml#L1-L64
    why: Version-dependent apiVersion, class and pathType rules.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/servicemonitor.yaml
    why: Endpoint port switch and namespace default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/tests/test-connection.yaml
    why: Connection test pod.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/tests/test-servicemonitor.yaml
    why: ServiceMonitor test pod.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/tests/hpa_tests.yaml#L1-L144
    why: Behaviors to cover in the HPA suite.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/tests/keda_tests.yaml#L1-L106
    why: Behaviors to cover in the KEDA suite.
dod:
  - text: The HPA renders only when enabled with the cpu, memory, requests and tokens metrics and the ContainerResource switch.
    proof: [hpa-suite]
  - text: The ScaledObject renders only for keda without the HPA, builds both prometheus triggers and fails without serverAddress.
    proof: [keda-suite]
  - text: The PDB, the Ingress for old and new cluster versions, and the ServiceMonitor render as described.
    proof: [pdb-suite, ingress-suite, monitor-suite]
  - text: The three Helm test pod templates render with the hook annotation, and the ServiceMonitor test pod only when serviceMonitor.enabled.
    proof: [test-pods]
  - text: The chart lints and renders with the CI values.
    proof: [chart-lint]
checks:
  optional: []
  commands:
    - id: hpa-suite
      why: an HPA behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/hpa_tests.yaml
    - id: keda-suite
      why: a KEDA behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/keda_tests.yaml
    - id: pdb-suite
      why: a PDB behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/pdb_tests.yaml
    - id: ingress-suite
      why: an Ingress behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/ingress_tests.yaml
    - id: monitor-suite
      why: a ServiceMonitor behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/servicemonitor_tests.yaml
    - id: test-pods
      why: a Helm test pod template is missing
      run: |-
        test -f packaging/helm/betterlite-helm/templates/tests/test-connection.yaml &&
        test -f packaging/helm/betterlite-helm/templates/tests/test-env-vars.yaml &&
        test -f packaging/helm/betterlite-helm/templates/tests/test-servicemonitor.yaml &&
        grep -q 'helm.sh/hook.*test' packaging/helm/betterlite-helm/templates/tests/test-connection.yaml
    - id: chart-lint
      why: the chart does not lint or render with the new templates
      run: test -f packaging/helm/betterlite-helm/templates/ingress.yaml && sh packaging/helm/tests/helm_checks.sh lint packaging/helm/betterlite-helm packaging/helm/betterlite-helm/ci/test-values.yaml
oracle_cases: []
deviations:
  - what: The HPA and KEDA queries still use the metric names litellm_requests_per_second, litellm_tokens_per_second, litellm_proxy_total_requests_metric_total and litellm_total_tokens_metric_total.
    why: betterlite keeps LiteLLM's Prometheus metric names so existing dashboards and adapters work (B3886 owns them).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/keda.yaml#L36-L48
  - what: The env test pod checks EXAMPLE_ENV instead of DD_ENV, DD_SERVICE and USE_DDTRACE.
    why: The native server has no ddtrace.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/tests/test-env-vars.yaml
out_of_scope:
  - Values, helpers, Secrets and ConfigMap belong to B8130; Deployment, Job and Services belong to B8131.
  - The chart README belongs to B152.
pitfalls:
  - >-
    The ingress template writes into .Values.ingress.annotations with set for old clusters; use a deepCopy so a render does not change values seen by other templates.
  - >-
    When autoscaling.enabled and keda.enabled are both true, only the HPA renders; the Deployment leaves out replicas when either one is on.
  - >-
    The AverageValue and threshold numbers go through toJson and trimAll so 0.5 and "0.5" both print as the quoted string "0.5".
  - >-
    The ServiceMonitor path ends with a slash (/metrics/) on purpose; the proxy redirects /metrics without it.
  - >-
    helm unittest cannot know the cluster version unless the suite sets capabilities.majorVersion and minorVersion, so the old-version ingress cases must set them.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
