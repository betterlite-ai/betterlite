id: B8132
title: Single-deployment chart scaling, ingress and monitoring
description: >-
  Add the scaling and exposure templates of the betterlite-helm chart (values and helpers come from B8130, the Deployment from B8131): templates/hpa.yaml, templates/keda.yaml, templates/poddisruptionbudget.yaml, templates/ingress.yaml, templates/servicemonitor.yaml, and the three Helm test pod templates under templates/tests/. Use betterlite.fullname, betterlite.labels and betterlite.selectorLabels; do not edit helpers or values.
  hpa.yaml renders an autoscaling/v2 HorizontalPodAutoscaler named <fullname> only when autoscaling.enabled. Metrics: a cpu Resource metric at autoscaling.targetCPUUtilizationPercentage (a ContainerResource metric on the proxy container when collector.enabled and collector.scaleOnProxyContainerCpu are both true), a memory Resource metric when targetMemoryUtilizationPercentage is set, and Pods metrics litellm_requests_per_second and litellm_tokens_per_second with an AverageValue (written as a quoted string) when targetRequestsPerSecond or targetTokensPerSecond is set. behavior is copied from autoscaling.behavior when set.
  keda.yaml renders a KEDA ScaledObject (keda.sh/v1alpha1) named <fullname> only when keda.enabled and not autoscaling.enabled. It writes pollingInterval, cooldownPeriod, min and max replica counts, an optional fallback (failureThreshold default 3, replicas default keda.maxReplicas), the user triggers, and two prometheus triggers built from keda.prometheus.requestsPerSecond and tokensPerSecond with queries over litellm_proxy_total_requests_metric_total and litellm_total_tokens_metric_total, selected by namespace and job (job is <fullname>, or <fullname>-metrics when metricsServer.enabled). The render fails with "keda.prometheus.serverAddress is required when keda.prometheus.requestsPerSecond or tokensPerSecond is set" when a threshold is set without the address. advanced.restoreToOriginalReplicaCount and the optional horizontalPodAutoscalerConfig.behavior come from values.
  poddisruptionbudget.yaml (policy/v1, only when pdb.enabled): minAvailable wins over maxUnavailable, and maxUnavailable: 1 is the default when neither is set. ingress.yaml (only when ingress.enabled) picks apiVersion by the cluster version (networking.k8s.io/v1 from 1.19, v1beta1 from 1.14, else extensions/v1beta1), writes ingressClassName from 1.18 or the kubernetes.io/ingress.class annotation before it, tls, and one rule per host and path with pathType only from 1.18, backend service <fullname> on service.port. servicemonitor.yaml (only when serviceMonitor.enabled): selector from betterlite.selectorLabels, namespaceSelector defaulting to the release namespace, one endpoint on port "metrics" when metricsServer.enabled else "http", path /metrics/, interval, scrapeTimeout, scheme http and relabelings.
  The Helm test pods (annotation helm.sh/hook: test) are templates/tests/test-connection.yaml (a busybox pod that retries wget of /health/readiness on the Service for 30 attempts), templates/tests/test-env-vars.yaml (checks the EXAMPLE_ENV value from envVars) and templates/tests/test-servicemonitor.yaml (a kubectl pod that checks the ServiceMonitor port, path, interval and scheme; renders only when serviceMonitor.enabled). The kubectl image comes from the values key test.kubectlImage that B8130 defines; read it and do not edit values.yaml.
scope:
