id: B8042
title: Load a Python object from a config string (get_instance_fn)
description: >-
  Every Python hook in config.yaml is a string like `custom_callbacks.proxy_handler_instance`, and LiteLLM turns it into an
  object in `get_instance_fn`. This task ports that function and its two helpers into `crates/betterlite-pyhost`, on top of
  B8040's `PythonHost` and B8041's handles. It owns litellm/proxy/types_utils/utils.py. The caller in B165 supplies the
  config path and the downloader.


  `instance_ref`: `InstanceRef::parse(value: &str) -> Result<InstanceRef, LoadError>` splits the string. A value starting with
  `s3://` or `gcs://` is `Remote { storage, bucket, object_key, module_path, instance_name }`, otherwise it is `Local {
  module_name, instance_name }`, split at the last dot (`a.b.c` is module `a.b`, name `c`). A local string with no dot gives
  module "" and name equal to the whole string, exactly as `value.split(".")` does in the source, and loading it fails later
  at import with the same ImportError text. Remote parsing, in this order: bucket and path split on the first `/`, and a
  value with no `/` after the bucket is `Invalid URL format: {url}. Expected: {storage}://bucket-name/path/to/module.instance`.
  A path ending in `.py` is the error that tells the user to drop the extension and shows
  `{storage}://{bucket}/{path without .py}.instance_name (e.g., {storage}://{bucket}/{path without .py}.proxy_handler_instance)`.
  A path with no dot is `Invalid module specification in {url}. Expected: path/to/module.instance_name`. The object key is
  `{module_path}.py`, where `module_path` is everything before the last dot. Copy the texts from the source (L98-L121) byte
  for byte. `parse` is the decoder for untrusted config text, so a cargo-fuzz target `instance_ref` in the crate's fuzz
  folder feeds it arbitrary UTF-8 and must never panic, with a replay test over its corpus.


  `instance_loader`: `InstanceLoader::new(host, fetcher: Arc<dyn ModuleFetcher>)` and `load(&self, value, config_file_path:
  Option<&Path>) -> Result<LoadedObject, LoadError>`. For a local reference with a config path, the module file is
  `{dirname(config_file_path)}/{module_name split on dots, joined}.py`. If that file exists it is executed as a module named
  `module_name` with `importlib.util.spec_from_file_location` and `exec_module`, without being added to `sys.modules`
  (the source does not add it either). Otherwise the module is imported with `importlib.import_module` from `sys.path`.
  Then `getattr(module, instance_name)` gives the object. An ImportError while doing this is rewritten to `Could not
  import {instance_name} from {module_name}` with the original as `#[source]`, only when both names are non-empty, and
  passes through otherwise. A missing attribute is `LoadError::Python(PythonError)` holding the AttributeError, as in the
  source. `LoadedObject` holds a `Py<PyAny>` and the original string, and gives a `CallableHandle` through `handle()`.


  Remote modules are the documented operator feature and only allowed from config load. A remote value with
  `config_file_path` of None is the ValueError text `Remote module loading (s3://, gcs://) is only permitted from the
  config-file load path. Register the module under ``litellm_settings`` in your config.yaml instead.` (the double backticks
  are in the source). With a config path: parse, create an `OwnedTempDir`, call `fetcher.fetch(storage, bucket, object_key,
  local_path)`, execute the file under the name `module_path`, get the instance, and always delete the file. Any failure in
  this flow, including parsing, becomes `ImportError`-class `LoadError::Remote { url, source }` with the text `Failed to load
  custom logger from {url}: {cause}`. A failed fetch reads `Failed to download {object_key} from {storage} bucket {bucket}`.
  `ModuleFetcher` is a trait in this crate with `fetch(&self, request: &ModuleRequest) -> Result<(), FetchError>`. The
  implementation over B4143's `download_python_module` is B165's, so this crate stays free of the server crate.


  `return_check`: `check_literal_true_return(handle_or_none)` ports `validate_custom_validate_return_type`. None gives None.
  Otherwise `typing.get_type_hints(fn)` is read, the `return` entry must equal `typing.Literal[True]`, and anything else is
  `TypeError` text `Custom validator must be annotated to return Literal[True], got {return_type}`. Use Python's repr of the
  hint in the message, obtained by calling `repr` in the interpreter.
