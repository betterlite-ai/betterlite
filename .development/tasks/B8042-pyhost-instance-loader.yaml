deviations:
- what: A remote module is fetched through B4143's downloader, which returns a typed error where LiteLLM's download returns False.
  why: The cause stays attached. The text a user reads is unchanged.
- what: Modules are imported with the interpreter that pyo3 linked, so hook dependencies are installed into that interpreter.
  why: The proxy embeds its interpreter instead of running inside the one that started LiteLLM.
- what: The AttributeError for a missing instance name carries Python's own text, which the oracle does not compare.
  why: The text comes from the runtime (docs/compatibility.md).
out_of_scope:
- B4143 owns download_python_file_from_s3, download_python_file_from_gcs and the credential flow. This task only calls them through the ModuleFetcher trait.
- B165 owns the fetcher implementation and every call site of get_instance_fn in proxy_server.py, callback_utils.py, guardrail_registry.py, tool_registry.py and pass_through_endpoints.py.
- _download_gcs_file_wrapper (L185-L197) only turns an exception into False and logs it. B4143's typed error replaces it.
pitfalls:
- The source builds the file path from `module_name.split(".")` joined with the OS separator. A module name with `..` segments or a leading dot must not escape the config folder, so refuse any empty segment with the ImportError text before touching the disk.
- The file-next-to-config branch is taken only when the config path is given and the file exists, and a user module that does `import sibling` still resolves through sys.path, so B8040's module_dirs must hold the config folder.
- '`exec_module` runs user code with the GIL held. Run the whole load through the WorkTracker, with a long deadline, so a module that blocks at import does not stall a Tokio thread.'
- The remote temp file is named by the temp folder, but the module is executed under `module_path` (for example `loggers/custom_callbacks`), as the source does. Do not use the temp file's name.
- The `.py` check in the remote path happens before the dot check, so `bucket/mod.py` gets the extension message and not the "Invalid module specification" one.
- Do not log the module text. The source logs the file contents of S3 downloads at debug level, and hooks can hold secrets.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
