dod:
- text: InstanceRef::parse splits local and remote references like the source and returns each URL error text unchanged.
  proof: [ref-tests, oracle]
- text: A local reference loads from a file next to config.yaml when that file exists, and otherwise from sys.path, and a missing module gives the "Could not import X from Y" text.
  proof: [loader-tests, oracle]
- text: A remote reference without a config path is refused with the source's text, and with one it fetches into an owned temp file, executes it, returns the instance and removes the file, also on failure.
  proof: [remote-tests, oracle]
- text: A failed fetch reads "Failed to download ... from ... bucket ..." inside the "Failed to load custom logger from" wrapper.
  proof: [remote-tests]
- text: The return check accepts a function annotated Literal[True], and refuses other annotations and none, with the source's text.
  proof: [return-tests, oracle]
- text: The instance_ref fuzz target exists and its corpus replays.
  proof: [instance-ref-corpus]
- text: The oracle adapter passes strict lint and type checks.
  proof: [helper-python]
- text: This task adds the crates it uses to crates/betterlite-pyhost/Cargo.toml, and no unused one.
  proof: [ref-tests]
checks:
  optional: []
  commands:
  - id: ref-tests
    why: Reference parsing tests are missing or a text differs.
    run: >-
      cargo nextest run --locked -p betterlite-pyhost --no-tests=fail
      -E 'test(/^instance_ref::/) - test(replays_the_instance_ref_corpus)'
  - id: loader-tests
    why: Local loading tests (file next to config, sys.path, import rewrite) are missing.
    run: cargo nextest run --locked -p betterlite-pyhost --no-tests=fail -E 'test(/^instance_loader::/)'
  - id: remote-tests
    why: Remote loading tests with a stub fetcher are missing.
    run: cargo nextest run --locked -p betterlite-pyhost --no-tests=fail -E 'test(/^remote_module::/)'
  - id: return-tests
    why: Return annotation tests are missing.
    run: cargo nextest run --locked -p betterlite-pyhost --no-tests=fail -E 'test(/^return_check::/)'
  - id: instance-ref-corpus
    why: The fuzz target or its corpus is missing or fails.
    run: >-
      test -f crates/betterlite-pyhost/fuzz/fuzz_targets/instance_ref.rs &&
      grep -q 'name = "instance_ref"' crates/betterlite-pyhost/fuzz/Cargo.toml &&
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-pyhost/fuzz/corpus/instance_ref)" &&
      cargo nextest run --locked -p betterlite-pyhost --no-tests=fail -E 'test(replays_the_instance_ref_corpus)'
  - id: helper-python
    why: The oracle adapter fails strict lint or type checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b8042)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b8042 &&
      uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b8042/pyrightconfig.json
