deviations:
  - what: A target whose container has the right type but whose index or inner object is missing returns a typed `TargetMissing` error and the request fails. LiteLLM raises IndexError, KeyError or TypeError there.
    why: The guardrail's rewrite would otherwise be lost and the unredacted text sent on; failing the request is what LiteLLM does in practice, now with a named error. The caller maps it to the same 500 LiteLLM returns.
  - what: The hoisted prompt is recognised by value equality only. LiteLLM also matches by object identity.
    why: Rust has no shared object identity for JSON rows, and an identical object is always equal, so the result is the same for every row that LiteLLM matches by identity.
  - what: "`translate_to_openai` returns the request half of the B967 result and drops the tool name map."
    why: LiteLLM's handler never reads the map from this call.
out_of_scope:
  - "B3675 owns the Anthropic process_input_messages, the text, image and tool_result extractors, extract_request_tool_names, process_output_response and the output extraction helpers, and with them get_structured_messages, _extract_top_level_system_text and _extract_midturn_system_text. It decides which write-back path runs and calls this task's functions."
  - "B3676 owns the Anthropic streaming and SSE rewrite helpers (_SSEFieldRewrite and its rewriters). B3673 owns the Anthropic block continuation and SSE event helpers."
  - "B3670 owns the Anthropic scan targets, ScannedText, ScannedToolCall, ExtractedInput, is_client_tool_use and the shared tool call shape helpers. This task uses them."
  - "B3663 owns unappliable_request_rewrite, merge_guardrailed_scoped_messages, merge_returned_tools_into_request_tools and scoped_structured_message_indices. process_input_messages, in B3675, calls them."
  - "The Anthropic typing helpers _as_str_mapping, _content_block_at, _ModelDumpBlock, _TextAttrBlock, _WritableMessage and _as_writable only narrow Python types and have no Rust counterpart."
  - "B967 owns translate_anthropic_to_openai, B180 owns anthropic_messages_pt and B224 owns group_tool_exchanges. This task only calls them."
  - "The tools conversion in process_input_messages (AnthropicConfig._map_tool_helper and the tools merge) belongs to B3675 with the rest of that function."
pitfalls:
  - "`write_back_system_block` counts only blocks whose `type` is \"text\", but the scan that produced `SystemBlockText { block_idx }` numbered every block with a string `text` in the hoisted chat row. Keep both rules as they are; do not unify them."
  - "A `ToolResultString` target overwrites `content[content_idx].content` whatever it held before, including an array, because LiteLLM only checks that the outer `content` is an array."
  - "Tool call rewrites are checked for every changed call before any is written. One call with `\"arguments\": \"[]\"` or an empty string makes the whole request fail with the unappliable-rewrite error, so earlier good rewrites must not be applied first."
  - "A returned tool call list of a different length is ignored without a warning on this side, unlike the Responses side. The after shapes then equal the scanned ones, so nothing is rewritten."
  - "The tool call write-back compares whole shapes, so a returned call with a missing `function.name` has name None, differs from a named original, and counts as rewritten. `write_back_tool_use` then keeps the block's name because a None name is never written."
  - "When the one leading row is the unchanged hoisted prompt, `data.system` must stay byte for byte what the client sent (a string stays a string, `cache_control` stays), because folding rebuilds it as an array of text blocks."
  - "`include_existing_system` is true only when there was no hoisted prompt. With a hoisted prompt the old system is already inside the structured rows, so folding it again would duplicate it."
  - "A system row is dropped, not converted, when `preserve_system_messages` is false. That flag is true only when the client's request had a mid-turn system row, so a plain request never gets system rows in `messages`, which Anthropic rejects."
  - "Each tool exchange group is passed to `anthropic_messages_pt` on its own, not the whole run, so two separate user turns are not merged by one call."
  - "The placeholder turn is added only when every converted row is a system row, and it comes from converting an empty message list, not from a hard-coded string. Use B180's output as it is."
  - "The `cache_control` strip touches only blocks whose `type` is \"thinking\" and only in rows whose `content` is an array; text blocks keep their breakpoints."
  - "`defer_systems_inside_tool_exchanges` runs `group_tool_exchanges` over the non-system rows only, so the group indexes must be mapped back to positions in the full list before the walk."
review_level: standard
