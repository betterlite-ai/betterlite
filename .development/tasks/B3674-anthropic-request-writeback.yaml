id: B3674
title: Anthropic guardrail request writeback
description: >-
  Build the functions that put a guardrail's answer back into an Anthropic Messages
  request. Three kinds of answer come back: rewritten texts (one string per scanned
  piece of text), rewritten tool calls, and a whole rewritten list of chat-format
  structured messages. The input scan task (B3675) decides which of the three paths
  runs and calls these functions. Nothing here calls a guardrail, a provider or the
  network. Every function edits the request body it is given, a
  `serde_json::Map<String, Value>`, and returns a typed `Result`.

  Plain write-back goes in
  crates/betterlite-server/src/guardrails/anthropic_translation/write_back.rs. The
  scan targets, `ScannedText`, `ScannedToolCall` and the shape helpers come from B3670;
  use them as they are. `write_back_system_block(system: &mut Value, block_idx: usize,
  response: &str)` does nothing unless `system` is an array. It counts only blocks that
  are objects with `type` equal to "text", and sets `text` on the one at `block_idx` among
  those. An index past the end is ignored. `write_back_message_text(message: &mut
  Map<String, Value>, target: &MessageTextTarget, response: &str) -> Result<(), WriteBackError>`
  reads `content`; a missing or null `content` returns Ok with no change. Per target:
  `MessageContent` sets `content` only when it is a string; `ContentBlockText` sets
  `content[content_idx].text` when `content` is an array; `ToolResultString` sets
  `content[content_idx].content` when `content` is an array (whatever the old value was);
  `ToolResultBlockText` sets `content[content_idx].content[block_idx].text`. When the
  container type does not fit the target (a string target against an array, an array
  target against a string), nothing changes. When the container fits but the index or
  the inner object is missing, return `WriteBackError::TargetMissing` naming the target.
  LiteLLM raises IndexError or TypeError there and the request fails, so a rewrite is
  never dropped silently.

  `rewritten_tool_use_input(arguments: &str) -> Option<Map<String, Value>>` returns the
  parsed JSON object, and None for anything that is not valid JSON or not an object
  (an array, a string, null, an empty string). `write_back_tool_use(message, target:
  &ToolUseInputTarget, shape: &ToolCallShape, rewritten_input: Map<String, Value>)`
  finds `content[content_idx]`; if `content` is not an array or the block is not an
  object it returns without a change. Otherwise it sets the block's `input` to
  `rewritten_input` and sets `name` only when `shape.name` is Some and differs from the
  block's current `name`. Do not use B3670's `tool_call_rewrite` here: that is the
  Responses rule, and this side compares and writes the whole `after` shape.

  `apply_guardrail_tool_calls_to_input(messages: &mut [Value], scanned_tool_calls:
  &[ScannedToolCall], pre_guardrail_tool_calls: &[ToolCallShape], returned_tool_calls:
  Option<&[Value]>, guardrail_name: Option<&str>) -> Result<(), ApplyError>` builds the
  after shapes with B3670's `tool_call_shapes`, over the returned calls when they are
  present and the same count as `pre_guardrail_tool_calls`, otherwise over the scanned
  originals (so a wrong-length answer changes nothing and logs nothing). It pairs
  scanned call, before and after in order and stops at the shortest of the three. A pair
  whose before and after shapes differ is a rewrite, and its `after.arguments` must pass
  `rewritten_tool_use_input`. If any rewrite fails that test, return the B3663
  `UnappliableRequestRewrite` error (its constructor `unappliable_request_rewrite(guardrail_name)`
  turns None into "unknown") and write nothing at all, not even the earlier good
  rewrites. Otherwise write every rewrite with `write_back_tool_use` into
  `messages[target.msg_idx]`. `apply_guardrail_responses_to_input(data: &mut Map<String,
  Value>, responses: &[String], scanned: &[ScannedText]) -> Result<(), WriteBackError>`
  pairs responses with scanned texts and stops at the shorter list. `SystemString`
  sets `data.system` only if it is currently a string; `SystemBlockText` calls
  `write_back_system_block`; a `Message` target calls `write_back_message_text` on
  `data.messages[msg_idx]`, with `messages` taken as empty when it is not an array, so an
  index then gives `TargetMissing`.

  Structured write-back goes in
  crates/betterlite-server/src/guardrails/anthropic_translation/structured_write_back.rs.
  It is used when the guardrail returns a full `structured_messages` list in chat format.
  The rows are JSON the guardrail may have changed freely, so they stay
  `serde_json::Value`. `is_system(message)` is true for an object whose `role` is a string
  equal to "system" after lowercasing. `is_hoisted_top_level_system(message, hoisted:
  Option<&Value>)` is false when `hoisted` is None, else true when the two values are
  equal. `translate_to_openai(data: &Map<String, Value>)` calls B967's
  `translate_anthropic_to_openai` on a copy of `data` with mid-turn system rows preserved
  (LiteLLM passes `preserve_midturn_system=True`), keeps the request half of the result and
  drops the tool name map. `hoisted_top_level_system_message(data)` returns None when
  `data.system` is missing or empty (null, "", []). Otherwise it runs `translate_to_openai`
  on `{model: data.model or "", messages: [], system: data.system}` and returns the first
  message of the result, or None. B3675 calls both `translate_to_openai` and
  `hoisted_top_level_system_message` and never reimplements them.

  `openai_system_message_to_anthropic(message) -> Option<Map<String, Value>>` turns a
  chat system row into the client's Anthropic-shaped row `{role: "system", content: ...}`.
  A string `content` gives the row only when it is not empty. An array `content` keeps the
  blocks that are objects with `type` "text" and a non-empty string `text`, each rebuilt as
  `{type, text}` plus a deep copy of `cache_control` when it is truthy (non-null, non-empty),
  and gives the row only when at least one block survives. Any other `content` gives None.
  `fold_leading_systems_into_top_level(data, leading_systems: &[Value],
  include_existing_system: bool)` rebuilds `data.system` as an array: first the existing
  system (a non-empty string becomes one text block, an array is copied as it is, anything
  else gives nothing; all of it only when `include_existing_system` is true), then, for
  each leading row that is an object and converts with the function above, its blocks (a
  string content becomes one text block). If the array has anything in it, set
  `data.system` to it; otherwise remove the `system` key.
  `defer_systems_inside_tool_exchanges(messages: &[Value]) -> Vec<Value>` keeps a system
  row from splitting a tool call from its results. It runs the B224 `group_tool_exchanges`
  (betterlite-prompts, anthropic_history) over the rows that are not system rows,
  maps each group of two or more to the original index of its first row and of its last
  row, then walks all rows in order with `open_end` starting at -1. A system row at an
  index below `open_end` is held back. Every other row sets `open_end` to its group's
  last index when it starts a group, is emitted, and then, if its index is at or past
  `open_end`, the held rows are emitted right after it. Rows still held at the end are
  emitted last. `open_end` is never reset, which is harmless because it only ever
  compares against later indexes.

  `write_back_structured_messages(data: &mut Map<String, Value>, structured_messages:
  &[Value], hoisted_system_message: Option<&Value>, preserve_system_messages: bool) ->
  Result<(), StructuredWriteBackError>` follows this order. (1) `model` is `data.model` as
  a string, else "". (2) Reorder with `defer_systems_inside_tool_exchanges`. (3) The
  leading system rows are the rows before the first non-system row (all rows if there is
  none). `hoisted_in_leading` is true if any leading row is the hoisted prompt. (4) If
  there are leading system rows and not (exactly one leading row and it is the hoisted
  prompt), call `fold_leading_systems_into_top_level` with `include_existing_system` true
  only when `hoisted_system_message` is None. When the one leading row is the unchanged
  hoisted prompt, `data.system` is left exactly as the client sent it. (5) Walk the rest
  with a `run` of non-system rows. A non-system row joins the run. A system row first
  converts and clears the run. Then, if the hoisted prompt has not been dropped yet and
  this row is it, the row is dropped and the flag is set (the flag starts as
  `hoisted_in_leading`). Otherwise, when `preserve_system_messages` is true, the row goes
  through `openai_system_message_to_anthropic` and is appended when that gives Some; when
  it is false the row is dropped. (6) Convert the last run. To convert a run, split it
  with `group_tool_exchanges` and call B180's `anthropic_messages_pt` on each group
  separately with the model and provider "anthropic", appending every result. (7) If no
  converted row is a non-system row, append the result of `anthropic_messages_pt` on an
  empty list (the placeholder user turn it returns). (8) Remove `cache_control` from every
  block with `type` "thinking" in any converted row whose `content` is an array. (9) Set
  `data.messages` to the converted rows. The prompts crate has its own `Json` type; it
  derives serde, so move rows between the two with serde and do not write a new
  converter module. A conversion failure propagates as `StructuredWriteBackError::Conversion`
  with `#[source]`.

  Cargo: betterlite-server does not depend on betterlite-core, betterlite-prompts or
  betterlite-guardrails today. Add the ones this task imports to
  crates/betterlite-server/Cargo.toml (B3670 adds betterlite-core for B909's converter; the
  one for B967 is the same crate, so whichever task merges second finds the line there).
  None of those crates depends on betterlite-server, so no cycle forms.

  Each module that can fail owns its error enum in its own file with `thiserror`:
  `WriteBackError` and `ApplyError` in write_back/error.rs, `StructuredWriteBackError` in
  structured_write_back/error.rs. Tests live in `tests.rs` of each module and are named so
  the filters below match: `system_block_*`, `message_text_*`, `tool_use_*`, `tool_calls_*`,
  `responses_to_input_*` in write_back; `hoisting_*`, `system_conversion_*`, `fold_*`,
  `defer_*`, `structured_*`, `conversion_error_*` in structured_write_back.
