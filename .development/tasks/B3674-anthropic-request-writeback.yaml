dod:
  - text: >-
      write_back_system_block changes only the nth text block of an array system prompt, and
      ignores a string system value, a missing index and non-text blocks when counting.
    proof: [system-block-tests, oracle]
  - text: >-
      write_back_message_text writes each of the four targets to its own place, does nothing
      for null content or a container that does not fit the target, and returns a typed error
      when the container fits but the index or inner object is missing.
    proof: [message-text-tests, oracle]
  - text: >-
      apply_guardrail_responses_to_input writes the system string only over a string, pairs
      responses and scanned texts to the shorter list, and sends message targets to the right
      message.
    proof: [responses-to-input-tests, oracle]
  - text: >-
      rewritten_tool_use_input accepts only a JSON object, and write_back_tool_use replaces
      the block input and renames the block only when the new name is present and different.
    proof: [tool-use-tests, oracle]
  - text: >-
      apply_guardrail_tool_calls_to_input ignores a returned list of the wrong length, writes
      only pairs whose shape changed, and writes nothing and returns the unappliable-rewrite
      error when any changed call has arguments that are not a JSON object.
    proof: [tool-calls-tests, oracle]
  - text: >-
      hoisted_top_level_system_message returns the first translated message for a non-empty
      string or block system prompt and None for a missing or empty one.
    proof: [hoisting-tests, oracle]
  - text: >-
      openai_system_message_to_anthropic keeps only non-empty text blocks, copies a truthy
      cache_control and returns None for an empty string or no surviving block.
    proof: [system-conversion-tests, oracle]
  - text: >-
      fold_leading_systems_into_top_level puts the existing system first only when asked,
      turns a string into one text block and removes the system key when nothing is left.
    proof: [fold-tests, oracle]
  - text: >-
      defer_systems_inside_tool_exchanges holds a system row that sits inside a tool call and
      its results until the exchange ends, and emits rows still held at the end last.
    proof: [defer-tests, oracle]
  - text: >-
      write_back_structured_messages leaves data.system alone when the one leading row is the
      unchanged hoisted prompt, folds changed leading system rows into it otherwise, drops the
      hoisted prompt once, keeps other system rows only when preserve_system_messages is true,
      adds the placeholder turn when no non-system row remains and strips cache_control from
      thinking blocks.
    proof: [structured-tests, oracle]
  - text: >-
      A conversion failure inside write_back_structured_messages returns the typed conversion
      error and leaves data.messages as it was.
    proof: [structured-error-tests]
