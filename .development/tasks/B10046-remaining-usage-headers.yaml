id: B10046
title: IO token and remaining usage rate-limit headers
description: >-
  B847's remaining-usage and response-header code calls two small LiteLLM helpers that B019 used to own: build_io_token_rate_limit_headers in io_token_rate_limit_check.py and apply_remaining_usage_headers in add_retry_fallback_headers.py. At the pin their only callers are Router.get_remaining_model_group_usage (router.py L11342) and Router.set_response_headers (router.py L11394), both B847's, and B019's reservation, reconcile and refund code calls neither. This task builds the two helpers on their own, so B847 waits on this small task instead of all of B019.


  Layout. Module remaining_usage_headers in betterlite-router, crates/betterlite-router/src/remaining_usage_headers.rs with its tests in remaining_usage_headers/tests.rs. The file is an empty stub its parent declares. Define `pub type RemainingUsage = IndexMap<String, i64>`, the dict[str, int] that get_remaining_model_group_usage returns; B847 starts from the map this task builds and adds the ordinary token and request headers to it.


  The IO header builder. `build_io_token_rate_limit_headers(limits: IoLimits, current_itpm: Option<i64>, current_otpm: Option<i64>, now: SystemTime) -> RemainingUsage`, where IoLimits is B365's io_token_reservations::limits::IoLimits with its itpm and otpm fields. Take the reset once, with B365's io_token_reservations::clock::seconds_until_minute_reset(now), before either limit is looked at, and use that one value on both sides. When itpm is set, insert x-ratelimit-limit-input-tokens (the limit), then x-ratelimit-remaining-input-tokens (the limit minus the current usage, with None counted as 0, and never below 0), then x-ratelimit-reset-input-tokens (the reset). When otpm is set, insert the three output-token headers the same way and in the same order after them. A limit that is None adds none of its headers, so two None limits give an empty map. Subtract with saturating arithmetic, since Python ints never overflow. The caller passes the reading of its own injected clock (B365's IoClock); this function never reads the system clock.


  The merge. `apply_remaining_usage_headers(additional_headers: &mut AdditionalHeaders, remaining: &RemainingUsage)`, where AdditionalHeaders is betterlite_models::call_helpers::headers::AdditionalHeaders, the IndexMap<String, Json> that B016's ensure_additional_headers hands out. Walk the remaining map in order and insert each entry as a JSON integer (Json::Number from the i64) only when its key is absent. A key already in the map keeps its value, a null one included, so headers a provider or an earlier step set win over the computed ones. LiteLLM also skips a None value; a RemainingUsage value is always an integer, so that test has no Rust counterpart.


  Oracle. The b10046 helper runs one function per case: build, with the two limits, the two usages and the instant as epoch seconds, or apply, with a header object and a remaining map. The Python side calls LiteLLM's two functions directly. For build it patches get_utc_datetime on the io_token_rate_limit_check module with the case's instant, as tools/oracle/litellm/probes/io_token_reservations.py does at L105, so the reset is fixed. The Rust side passes the same instant as a SystemTime. Add helper_case corpus seeds named remaining-usage-headers-*.


  Tests in remaining_usage_headers::tests, names starting with io_headers_ for the builder and merge_ for the merge: both limits with input usage above its limit (remaining 0) and no output usage (remaining equals the limit), input only, output only, neither, a zero limit, the reset at second 0 (60) and second 59 (1) of a minute, the header order, a present key with a value and a present key with null both kept, and inserted keys following the remaining map's order. There is no fuzz target: both functions take typed values.
scope:
  paths:
    - crates/betterlite-router/src/remaining_usage_headers.rs
    - crates/betterlite-router/src/remaining_usage_headers/**
    - tools/oracle/cases/helpers/remaining-usage-headers/**
    - tools/oracle/fuzz/corpus/helper_case/remaining-usage-headers-*
    - tools/oracle/helpers/b10046.py
    - tools/oracle/helpers/b10046/**
    - tools/oracle/src/helpers/router/b10046.rs
    - tools/oracle/src/helpers/router/b10046/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/io_token_rate_limit_check.py#L719-L738
    why: Owned. build_io_token_rate_limit_headers, its header names, order, floor at 0 and shared reset.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/io_token_rate_limit_check.py#L69-L71
    why: seconds_until_minute_reset, already on main as B365's clock::seconds_until_minute_reset; called once per build.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/add_retry_fallback_headers.py#L179-L185
    why: Owned. apply_remaining_usage_headers, insert only when the key is absent.
dod:
  - text: The IO builder writes the limit, remaining and reset headers for each configured side in LiteLLM's order, counts a None usage as 0, floors remaining at 0, emits headers for a zero limit and none for a None limit.
    proof: [io-headers-tests, oracle, helper-python]
  - text: Both reset headers carry one seconds_until_minute_reset value taken from the instant passed in, 60 at second 0 and 1 at second 59.
    proof: [io-headers-tests, oracle]
  - text: The merge inserts only absent keys, keeps a present key with a value or with null, and follows the remaining map's order.
    proof: [merge-tests, oracle, helper-python]
  - text: New remaining-usage-headers seeds for b10046 replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: io-headers-tests
      why: An IO header is missing, misnamed, out of order, not floored, or its reset differs between the two sides.
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^remaining_usage_headers::tests::io_headers_/)'
    - id: merge-tests
      why: A computed header replaces one already present, or a missing one is not inserted.
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^remaining_usage_headers::tests::merge_/)'
    - id: helper-python
      why: The b10046 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10046.py tools/oracle/helpers/b10046)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10046 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/remaining-usage-headers-*")" &&
        grep -lE '^[[:space:]]+b10046:' tools/oracle/fuzz/corpus/helper_case/remaining-usage-headers-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/remaining-usage-headers/io-both-limits-floored.yaml
  - tools/oracle/cases/helpers/remaining-usage-headers/io-input-only-minute-end.yaml
  - tools/oracle/cases/helpers/remaining-usage-headers/io-output-only.yaml
  - tools/oracle/cases/helpers/remaining-usage-headers/io-zero-limit.yaml
  - tools/oracle/cases/helpers/remaining-usage-headers/io-no-limits.yaml
  - tools/oracle/cases/helpers/remaining-usage-headers/merge-present-keys-win.yaml
deviations: []
