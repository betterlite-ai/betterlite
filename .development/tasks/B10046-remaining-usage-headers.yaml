  - "Router.get_remaining_model_group_usage, Router.set_response_headers, the IO and ordinary usage counter reads and the unfloored x-ratelimit-remaining-tokens and -requests headers: B847, the only caller of both functions."
  - "litellm/router_utils/pre_call_checks/io_token_rate_limit_check.py: B365 owns set_io_token_rate_limit_request_kwargs (L48-L62), get_io_token_rate_limit_request_kwargs (L65-L66), seconds_until_minute_reset (L69-L71), get_deployment_io_token_limits (L74-L89), deployment_has_io_token_limits (L92-L94), _get_cache_keys (L97-L106), _estimate_input_tokens (L109-L122), _model_max_output_tokens (L125-L133), _resolve_max_tokens (L136-L153), _get_usage_tokens (L156-L177), _extract_response_usage (L180-L183), _usage_is_present (L186-L200), _resolve_reconcile_usage_tokens (L203-L234), _stash_reservation_in_metadata (L237-L258), _extract_reservation (L261-L269), _as_mutable_mapping (L272-L274), _reservation_channels (L277-L290), _read_reservation_from_kwargs (L293-L297), _clear_reservation_from_kwargs (L300-L309), _reservation_value (L312-L322), _rate_limit_error (L325-L343), _sync_increment_with_rollback (L346-L367), _increment_with_rollback (L370-L394), io_token_pre_call_check (L397-L456) and async_io_token_pre_call_check (L459-L525)."
  - "litellm/router_utils/pre_call_checks/io_token_rate_limit_check.py: B019 owns io_token_reconcile_success (L528-L576), async_io_token_reconcile_success (L579-L637), io_token_refund_failure (L640-L661), refund_stale_reservation_before_retry (L664-L688) and async_io_token_refund_failure (L691-L716)."
  - "litellm/router_utils/add_retry_fallback_headers.py: B366 owns _routing_header_mapping (L26-L31), _header_string (L34-L38), complexity_router_decision_headers (L41-L68) and replace_complexity_router_headers (L71-L80); B311 owns HiddenParamsAsyncIteratorWrapper (L83-L105); B016 owns prepare_response_for_header_attachment (L108-L115), response_has_hidden_params (L118-L121), ensure_response_additional_headers (L124-L131), apply_response_model_id (L134-L144), response_total_token_count (L167-L176), _write_hidden_params (L212-L216) and _ensure_additional_headers_dict (L219-L225); B338 owns apply_quality_router_decision_headers (L147-L164); B2202 owns _normalize_hidden_params (L188-L193) and get_hidden_params_dict (L196-L209); B398 owns get_fallback_error_info (L228-L238), _coerce_error_dicts (L241-L242), get_fallback_errors_from_headers (L245-L258), _add_headers_to_response (L261-L281) and add_fallback_headers_to_response (L301-L334); B017 owns add_retry_headers_to_response (L284-L298)."
pitfalls:
  - "LiteLLM tests each limit with `is not None`, so an itpm or otpm of 0 still writes its three headers, with remaining 0."
  - "The input and output reset headers share the one seconds_until_minute_reset value taken before either limit is checked; reading the clock per side can split them across a minute edge."
  - "Only x-ratelimit-remaining-input-tokens and x-ratelimit-remaining-output-tokens are floored at 0; B847's x-ratelimit-remaining-tokens and x-ratelimit-remaining-requests can go negative, so no shared clamp belongs here."
  - "apply_remaining_usage_headers tests key presence, so an x-ratelimit-* key already holding null still blocks the computed value."
  - "io_token_rate_limit_check.py imports get_utc_datetime from litellm.utils at L26, so the b10046 Python helper patches the name on io_token_rate_limit_check; patching litellm.utils leaves the reset on the wall clock."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
