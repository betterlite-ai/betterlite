id: B247
title: Per-call logging state and callback eligibility
description: >-
  Implement Own Logging.__init__, set_response_timing_metrics, update_environment_variables/update_from_kwargs/update_messages,
  _is_sync_litellm_request, should_run_logging, claim_async_success_log, has_run_logging, should_run_callback and
  correlation-context restore methods. Use request-owned state and explicit context guards. no-log suppresses ordinary
  callbacks while retaining internal proxy bookkeeping; enterprise callback controls are excluded, not read or copied.
  Budget 280 logic/types, 120 Rust/Python adapters, 300 tests and 60 wiring (760 total). Write the behavior rstest
  functions b247_behavior_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure
  in the DoD; corpus replay tests have separate names. Register helper operations logging_state in tools/oracle/src/helpers/mod.rs
  and tools/oracle/helpers/dispatch.py; each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/lib.rs
  - crates/betterlite-logging/src/error.rs
  - crates/betterlite-logging/src/logging_state.rs
  - crates/betterlite-logging/src/logging_state/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/logging-state/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
