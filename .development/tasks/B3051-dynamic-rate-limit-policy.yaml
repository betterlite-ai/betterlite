id: B3051
title: Dynamic priority allocation and saturation policy
description: >-
  Build priority normalization, shared default pools, saturation reads and descriptor generation
  for saturation-aware dynamic rate limiting. Implement priority weight calculation with LITELLM_LICENSE
  compatibility fallback, model saturation queries against the v3 limiter's Redis counters, and
  priority-based rate-limit descriptors that enforce strict limits only when saturated.

  Ownership includes:

  - Configuration helpers: _get_priority_settings returns the PriorityReservationSettings instance
    (never None); _is_latin1_encodable checks if a string value fits in HTTP headers (all chars < 256).

  - Settings and thresholds: Default priority weight is 0.25, saturation threshold is 0.50,
    saturation-cache TTL is 60 seconds. The README's stale 0.5/0.8/tracking_multiplier description
    is reconciled: actual defaults are 0.25/0.50/60. Betterlite skips LITELLM_LICENSE gate entirely
    (no-paid-tier decision).

  - Priority resolution: priority_from_key_dict (30 chars max) checks team metadata first, then
    falls back to key metadata, returning the priority string or None if absent.

  - Priority weight computation: _get_priority_weight resolves the float weight for a given priority
    by delegating to convert_priority_to_percent (B3030), with fallback to default_priority.

  - Weight normalization: _normalize_priority_weights (26 chars) handles over-allocation by computing
    all priority percentages, dividing each by the total if it exceeds 1.0, and logging the mapping.

  - Priority allocation: _get_priority_allocation (24 chars) returns (priority_weight, priority_key)
    tuple: for explicit priorities, a unique pool key (e.g., "model:priority_name"); for default
    priority, a shared pool key (e.g., "model:default_pool").

  - Saturation detection: _check_model_saturation (22 chars) queries v3 limiter's cache keys for
    both RPM and TPM counters (using create_rate_limit_keys from B3031), reads their current
    values without incrementing, computes saturation ratios, and returns the max (0.0–1.0+);
    on error, fails open with 0.0 saturation.

  - Saturation cache helper: saturation_value_from_cache (30 chars max) reads the counter from
    DualCache with configurable TTL from saturation_check_cache_ttl.

  - Saturation cache TTL: _get_saturation_check_cache_ttl returns the TTL from settings (60 seconds).

  - Descriptor builders: priority_based_descriptors (30 chars max) applies normalized weights to model
    capacity, generating model-specific RPM/TPM limits; model_tracking_descriptor (30 chars max)
    builds a tracking-only descriptor with the same RPM/TPM for saturation queries.

  - Handler class _PROXY_DynamicRateLimitHandlerV3 with __init__ taking internal_usage_cache and
    time_provider, and update_variables(llm_router) method.

  Direct dependencies: B002 loads litellm_settings.priority_reservation and priority_reservation_settings;
  B732 supplies UserAPIKeyAuth and authenticated context; B846 supplies Router.get_model_group_info;
  B3030 supplies convert_priority_to_percent; B3031 supplies create_rate_limit_keys and typed
  descriptor records. Saturation cache async writes await a concrete external owner.

