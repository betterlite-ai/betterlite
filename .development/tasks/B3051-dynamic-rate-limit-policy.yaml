deviations:
  - what: "When LITELLM_LICENSE is unset, betterlite always applies convert_priority_to_percent and computes
      the configured priority weight; it does not gate priority allocation behind the license check."
    why: "Betterlite follows the no-paid-tier decision: priority allocation is enabled by default without
      requiring enterprise licensing. LiteLLM at the pinned commit (lines 131-138) only logs an error and
      uses default_priority when the license is absent; it only applies convert_priority_to_percent in the
      else branch when the license is present. Betterlite removes that conditional gate entirely, making
      priority-based descriptors available regardless of license status. This is an intentional policy
      divergence that extends priority functionality to MIT users."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/dynamic_rate_limiter_v3.py#L131-L138"

out_of_scope:
  - Rate-limit checking, descriptor enforcement, and counter updates belong to B3052 (dynamic admission).
  - Success logging and header generation belong to B3053 (dynamic callbacks).
  - Token increment operations and post-call accounting belong to B3037/B3046 (token adjustments/callbacks).
  - Saturation cache writes and Redis batch registration await external owner (question 1 in outline).
  - resolve_model_group_alias delegation is B302; this task uses the injected get_model_group_info call.
  - CustomLogger base class and logging infrastructure are pre-existing proxy utilities.

pitfalls:
  - priority_from_key_dict must check team_metadata first; team priority always overrides key priority,
      even if both are present.
  - saturation_value_from_cache is asynchronous; callers must await it; the returned value is a string
      (from Redis) or None, requiring int() or float() conversion before ratio computation.
  - _check_model_saturation returns 0.0 (not None or False) on any exception; callers should treat this
      as "assume not saturated" for fail-open behavior.
  - _normalize_priority_weights returns the un-normalized dict if sum <= 1.0, avoiding unnecessary copies;
      callers must check return value, not assume normalization happened.
  - model_tracking_descriptor uses high_limit_multiplier=1 by default (tracking only, same as enforcement
      limits); callers may override with >1 for loose tracking-only behavior.
  - LITELLM_LICENSE check is removed from betterlite's _get_priority_weight; equality fixtures must not
      expect the error log when license is absent, unlike unlicensed LiteLLM.

review_level: standard
