dod:
  - text: _get_priority_settings returns the shared PriorityReservationSettings instance (never None),
      with lazy-loaded fallback for type narrowing.
    proof: [priority-settings-tests]
  - text: _is_latin1_encodable returns true only when all characters in the string have ord() < 256.
    proof: [encoding-tests]
  - text: priority_from_key_dict (30 chars max) checks user_api_key_dict.team_metadata.get("priority")
      first, then falls back to user_api_key_dict.metadata.get("priority"), returning the value
      or None if both are absent.
    proof: [priority-resolution-tests]
  - text: >-
      _get_priority_weight with priority=None and priority_reservation present returns default_priority;
      with priority="key_a" in reservation returns convert_priority_to_percent(reservation["key_a"], model_info);
      with priority="unknown" returns default_priority.
    proof: [priority-weight-tests]
  - text: >-
      _normalize_priority_weights computes {key: convert_priority_to_percent(v, model_info)} for all
      keys in priority_reservation; if sum > 1.0, returns {key: value/total} normalized; else returns
      un-normalized weights.
    proof: [normalization-tests]
  - text: >-
      _get_priority_allocation with explicit priority returns (weight_from_normalized, "model:priority_name");
      with default/missing priority returns (default_priority, "model:default_pool").
    proof: [allocation-tests]
  - text: >-
      _check_model_saturation queries v3_limiter.create_rate_limit_keys("model_saturation_check", model, "requests")
      and "tokens" types, reads current counter values via saturation_value_from_cache, computes
      current/capacity ratios, returns max(rpm_saturation, tpm_saturation, 0.0); on any exception
      returns 0.0.
    proof: [saturation-tests]
  - text: >-
      saturation_value_from_cache (30 chars max) calls internal_usage_cache.async_get_cache with key,
      TTL from _get_saturation_check_cache_ttl, local_only=false, returning string value or None.
    proof: [cache-read-tests]
  - text: >-
      _get_saturation_check_cache_ttl returns _get_priority_settings().saturation_check_cache_ttl
      (60 seconds by default).
    proof: [ttl-tests]
  - text: >-
      priority_based_descriptors (30 chars max) returns list of RateLimitDescriptor with key="priority_model",
      value=priority_key, rate_limit={requests_per_unit, tokens_per_unit, window_size} computed
      from normalized_weights applied to model_info limits; empty list if priority_reservation absent.
    proof: [descriptor-tests]
  - text: >-
      model_tracking_descriptor (30 chars max) returns RateLimitDescriptor with key="model_saturation_check",
      value=model, rate_limit={requests_per_unit: (rpm * multiplier or None), tokens_per_unit: (tpm * multiplier
      or None), window_size} using passed high_limit_multiplier (default 1).
    proof: [descriptor-tests]
  - text: _PROXY_DynamicRateLimitHandlerV3.__init__ receives internal_usage_cache (DualCache) and optional
      time_provider callable, constructs InternalUsageCache wrapper, constructs _PROXY_MaxParallelRequestsHandler_v3
      with both parameters.
    proof: [handler-init-tests]
  - text: _PROXY_DynamicRateLimitHandlerV3.update_variables(llm_router) stores the Router instance for
      get_model_group_info calls.
    proof: [handler-init-tests]
  - text: Every default, env var, config key and limit a user can observe is in a named case with literal
      input and outcome.
    proof: [cases-tests]

checks:
  optional: []
  commands:
    - id: priority-settings-tests
      why: _get_priority_settings must return non-None PriorityReservationSettings with correct defaults
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::settings(::|$)/)'
    - id: encoding-tests
      why: _is_latin1_encodable must correctly identify encodable characters
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::encoding(::|$)/)'
    - id: priority-resolution-tests
      why: priority_from_key_dict must resolve from team then key metadata
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::resolution(::|$)/)'
    - id: priority-weight-tests
      why: Priority weight calculation must handle present/absent/unknown priorities and fallback to default
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::weight(::|$)/)'
    - id: normalization-tests
      why: Weight normalization must scale down priorities when sum exceeds 1.0
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::normalization(::|$)/)'
    - id: allocation-tests
      why: Allocation must return correct pool key and weight for explicit vs. default priorities
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::allocation(::|$)/)'
    - id: saturation-tests
      why: Saturation check must query Redis counters and compute max ratio correctly
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::saturation(::|$)/)'
    - id: cache-read-tests
      why: saturation_value_from_cache must read from DualCache with correct TTL
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::cache(::|$)/)'
    - id: ttl-tests
      why: TTL getter must return configurable saturation_check_cache_ttl value
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::ttl(::|$)/)'
    - id: descriptor-tests
      why: Descriptor builders must apply weights correctly and include all required fields
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::descriptors(::|$)/)'
    - id: handler-init-tests
      why: Handler initialization must construct v3 limiter and store router correctly
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_priority::handler(::|$)/)'
    - id: cases-tests
      why: Oracle cases verify priority allocation, saturation detection and descriptor generation
      run: cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/dynamic_priority -k 'b3051'

