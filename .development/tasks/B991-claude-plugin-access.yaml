checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::claude_plugin_access::/)
      - test(/::replays_corpus$/)'
  - id: case-marketplace-enabled-plugins
    why: the marketplace-enabled-plugins behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_plugin_access::tests::marketplace_enabled_plugins($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_plugin_access::tests::route_aliases($|::)/)'
  - id: case-auth-missing
    why: the auth-missing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_plugin_access::tests::auth_missing($|::)/)'
  - id: case-auth-invalid
    why: the auth-invalid behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_plugin_access::tests::auth_invalid($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/claude_plugin_access)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/claude_plugin_access.rs && grep -qF "decode_claude_plugin_access"
      crates/betterlite-server/fuzz/fuzz_targets/claude_plugin_access.rs && cargo nextest run --locked -p betterlite-server
      --no-tests=fail -E 'test(/^api::claude_plugin_access::tests::replays_corpus$/)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/claude-plugin-access)"
