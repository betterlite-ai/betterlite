id: B991
title: Claude plugin access
description: >-
  Define Claude marketplace/plugin records, source URL validation, marketplace projection and skill grant predicates
  using B052 principals and B051 records. URLs are manifest metadata only; validate HTTPS/git source forms without
  fetching them and require proxy-admin authority for plugin mutation.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-server/src/api/claude_plugin_access.rs, crates/betterlite-core/src/api/claude_plugin_access.rs.
  Use ClaudePluginAccessInput and ClaudePluginAccessResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /claude-code/marketplace.json. Each alias is exercised through
  the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without re-registering
  their methods/paths.


  Extraction uses the typed path/query/body records named by the owned handler signatures.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): claude_code_marketplace.py:171 status_code=500, exception_detail=FastAPI detail object. Compare
  the actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions marketplace_enabled_plugins, route_aliases, auth_missing, auth_invalid
  under api::claude_plugin_access::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-server::api::claude_plugin_access::decode_claude_plugin_access(bytes:
  &[u8], limits: &ApiLimits), for json.loads input plugin.manifest_json or '{}' at litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py:129.
  Place its implementation in crates/betterlite-server/src/api/claude_plugin_access.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/claude_plugin_access.rs passes arbitrary
  bounded bytes to that exact decoder; api::claude_plugin_access::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: get_marketplace
  (L91-L174). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 59 owned nonblank/non-comment/non-docstring Python lines (76 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 79 implementation,
  64 behavior tests, 48 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 289 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B726 (Managed
  resources and transaction repositories), B858 (Typed managed-resource and analytics rows), B732 (Typed authentication
  principals and grant resolution), B855 (Authenticated request admission and budget handoff), B756 (Authentication
  header selection and mode dispatch), B1018 (MIT resource owner compatibility), B1140 (Claude plugin and skill
  policy), B003 (HTTP server, health routes and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management
  oracle namespaces and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
