    why: video_remix_handler, with the _is_async hand-off, client choice, header and URL steps, pre_call and the POST with timeout.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L7653-L7734
