id: B3334
title: Video remix and listing transport
description: >-
  Build the HTTP handlers for video remix and video list in betterlite-core, module `api::video_remix_list_transport`.
  They are the four LiteLLM methods video_remix_handler, async_video_remix_handler, video_list_handler and async_video_list_handler.
  Each handler takes a `BaseVideoConfig` (B3331), the provider name, the call's litellm params, the logging object (B249) and the optional
  extra headers, extra body or extra query, timeout, client and api_key. Create the typed error enum `VideoRemixListTransportError` in this module;
  it wraps B2402's transport error conversion, so a failure inside the try block is turned into the provider's error class the same way LiteLLM's `_handle_error` does.

  Remix does these steps in order. Pick the client: use the supplied one only when it has the right mode (sync for the sync path, async for the async path),
  otherwise take a pooled one from B173 built with `ssl_verify` from the litellm params (default none); the async pool is keyed by the provider name,
  and an unknown provider name fails here, before the try block, so it is not converted by the provider error class. Call `validate_environment`
  with api_key set to the argument or else the params' api_key, headers set to the extra headers or an empty map, and model set to the empty string.
  Then update the returned headers with the extra headers again. Call `get_complete_url` with model empty, the params' api_base and the params.
  Call `transform_video_remix_request` to get `(url, data)`. Call logging `pre_call` with input = the prompt, api_key empty,
  and additional_args holding complete_input_dict = data, api_base = url, headers and video_id. Then POST `data` as JSON with the timeout argument,
  and return `transform_video_remix_response` (raw response, logging object, provider name). The send and the response conversion are both inside the
  try block, so a conversion error also goes through error conversion. The sync handler returns the async handler's future when `_is_async` is true.

  List differs from remix in four ways that must stay. First, validate_environment gets only the api_key argument, never the params' api_key;
  no caller passes the argument, so the provider config falls back to its own env lookup. Second, pre_call has input = the empty string and
  additional_args holds only api_base = url, headers and params. Third, it sends a GET with the returned params as the query and no timeout, although
  the public timeout argument exists. Fourth, the sync handler is not a separate implementation: it runs the async handler to completion
  (LiteLLM uses asyncio.run), and it does not forward api_key and it ignores a supplied sync client; the async handler then takes the supplied client only
  if it is an async one. The list response is whatever `transform_video_list_response` returns (a JSON object with the provider's page).

  The delete handler `async_video_delete_handler` is in the same file and is not built, see out_of_scope.

  Tests use a local mock server and a fake `BaseVideoConfig` with recording methods. Name the rstest functions `remix_transport_behavior`,
  `list_transport_behavior` and `transport_error_behavior`, with one named case per DoD item. The task changes no wire format, so there is no fuzz target.
scope:
