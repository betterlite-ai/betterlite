id: B4807
title: Watsonx Orchestrate credentials and A2A record conversion
description: >-
  Build WXO configuration extraction, credential-keyed token caching and the pure A2A/WXO projections.
  Keep authentication and record constructors below the run executor so stream fallback reuses the same
  credentials and shapes. WXO accepts two authentication modes through litellm_params: cp4d (default,
  requires username, cache key hashes auth_mode, cp4d_host, username and api_key, expiration is absolute
  Unix epoch seconds, subtract 60s before monotonic caching) and ibm_cloud (cache key hashes auth_mode,
  cp4d_host, empty username, api_key, expiration is duration in seconds, subtract 60s before monotonic
  caching). IBM Cloud token endpoint is https://iam.cloud.ibm.com/identity/token; CP4D uses
  {cp4d_host}/icp4d-api/v1/authorize. Cache storage must be bounded and injected. Required litellm_params:
  cp4d_host (no default), instance_id (no default), wxo_agent_id (no default), api_key (no default);
  optional: username (none, required for cp4d mode), auth_mode (default cp4d), thread_id (none). Extract
  user message text from A2A params.message.parts[*].text where part.kind is null, empty, or "text".
  Project WXO run results through priority: last_message.content[0].text, result.data.message.content[0].text,
  results as raw string. Build A2A non-streaming SendMessageResponse with kind="message", unique messageId,
  agent role. Emit fake streaming with task(submitted)/status-update(working)/artifact-update chunks/status-update(completed,final)
  events, 50-character default chunks, 10ms default delays, always at least one artifact even for empty text,
  event IDs use UUID4. Token response decoding (IBM Cloud IAM and CP4D authorize JSON) is a named function
  with fuzz-target and corpus coverage.
scope:
  paths:
  - Cargo.toml
  - deny.toml
  - crates/betterlite-a2a/src/watsonx_credentials.rs
  - crates/betterlite-a2a/src/watsonx_credentials/**
