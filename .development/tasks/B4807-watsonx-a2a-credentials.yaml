deviations:
- what: "betterlite uses injected UUID4 and clock sources instead of native time.monotonic, time.time and uuid4()."
  why: "For testability and consistency with B198 clock injection across the A2A protocol."
- what: "Token cache storage is injected as a constructor parameter (bounded cache trait), not a module-level dict."
  why: "To support multiple independent instances and test isolation, and to enforce cache bounds."
out_of_scope:
- Run submission and polling (B4808), which calls token retrieval and result extraction.
- Signed AgentCore requests (B4804), Pydantic AI submission (B4806) and AgentCore response parsing (B4804).
- A2A completion message building and metadata handling (B4803), which consumes transformed responses.
- Providers other than watsonx_orchestrate.
pitfalls:
- "IBM Cloud IAM and CP4D authorize responses are untrusted JSON from external HTTP endpoints; decode_wxo_token_response parses bytes with validated error handling."
- "CP4D expiration is absolute Unix epoch timestamp in seconds, not duration. IBM Cloud returns duration in seconds. Both subtract 60 seconds before storing expiration in monotonic-based cache."
- "Cache key must hash auth_mode, host, username and api_key in order. Missing username becomes empty string in hash; omitting it causes cache misses across cp4d/ibm_cloud modes."
- "WXO result extraction tries three locations in order: last_message.content[0].text, result.data.message.content[0].text, results as raw string. Empty string stops at first match, not all three. Missing content list/text field returns empty string."
- "Token caching uses monotonic time for TTL checks. Expiration time stored as monotonic time plus wall-time difference, not as absolute timestamp."
- "Fake streaming chunks must split on Python character boundaries, never on UTF-8 byte boundaries; a multi-byte character positioned across chunk-size boundary must not be split."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 3
