dod:
- text: Token response decoder function decode_wxo_token_response consumes untrusted bytes from IBM Cloud IAM
    and CP4D authorize JSON responses, parsing and extracting access_token/token field without panic.
  proof:
  - watsonx-token-fuzz-corpus
- text: A cargo-fuzz target at crates/betterlite-a2a/fuzz/fuzz_targets/watsonx_token_response.rs calls the
    token decoder, seeded with valid/malformed/truncated IBM Cloud and CP4D response corpus files.
  proof:
  - watsonx-token-fuzz-corpus
- text: replays_the_watsonx_token_response_corpus test parses every corpus file without a panic.
  proof:
  - watsonx-token-fuzz-corpus
- text: CP4D and IBM Cloud bearer token retrieval matches LiteLLM on request body, response parsing, expiration
    handling (absolute vs duration) and 60-second cache buffer subtraction.
  proof:
  - oracle
- text: Token cache key includes auth_mode, cp4d_host, username and api_key in that hash input order, missing
    username defaults to empty string before hashing.
  proof:
  - oracle
- text: Cache storage is bounded; cached tokens with expired TTL are evicted on every token fetch.
  proof:
  - watsonx-cache-bounds
- text: Configuration extraction validates all four required params (cp4d_host, instance_id, wxo_agent_id, api_key)
    are present, username required for cp4d mode, auth_mode defaults to cp4d, thread_id optional.
  proof:
  - oracle
- text: Text extraction from A2A params joins multiple part.text values with spaces, skips parts where kind
    is not null/empty/"text".
  proof:
  - oracle
- text: WXO result text extraction tries last_message.content[0].text first, then result.data.message.content[0].text,
    then results raw string, returns empty string if all fail.
  proof:
  - oracle
- text: A2A message response has kind="message", role="agent", unique messageId per call, list format parts.
  proof:
  - oracle
- text: Fake streaming emits task(submitted)/status-update(working)/artifact-update chunks/status-update(completed,final)
    in that order, at least one artifact even for empty text, delays between events except after last artifact.
  proof:
  - watsonx-fake-streaming
- text: Chunk size defaults to 50 characters, delay defaults to 10ms, both are configurable.
  proof:
  - oracle
- text: Fake streaming chunks split on Python character boundaries, never on UTF-8 byte boundaries; multi-byte
    UTF-8 characters positioned across chunk boundaries are not split or corrupted.
  proof:
  - watsonx-multibyte-streaming
- text: Every mutant in token cache TTL calculation, token response decoding and fake streaming event building
    is caught by a test.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: watsonx-token-fuzz-corpus
    why: token response fuzz target or its corpus is missing, or replaying the corpus fails
    run: >-
      test -f crates/betterlite-a2a/fuzz/fuzz_targets/watsonx_token_response.rs && test -n "$(ls -A crates/betterlite-a2a/fuzz/corpus/watsonx_token_response)"
      && cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(replays_the_watsonx_token_response_corpus)'
  - id: watsonx-cache-bounds
    why: token cache is unbounded or stale tokens are not evicted
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_credentials::.*cache/)'
  - id: watsonx-fake-streaming
    why: fake streaming events are malformed or sequence is incorrect
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_transform::.*streaming/) - test(replays_the_watsonx_token_response_corpus)'
  - id: watsonx-multibyte-streaming
    why: fake streaming does not handle multi-byte UTF-8 character boundaries correctly
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_transform::.*multibyte/)'
  - id: a2a-tests
    why: the A2A provider or transformation tests fail or do not exist
    run: cargo nextest run --locked -p betterlite-a2a -p betterlite-http --no-tests=fail
