deviations:
  - what: Completion entry point (litellm.acompletion) is not owned by this task. The bridge holds a
      seam that accepts the function by name from vars(litellm)["acompletion"] to delay the dependency
      until dispatch time. An unresolved caller, awaiting assignment in architect question 3.
    why: A2A provider tasks (B4804, B4806, B4808) dispatch through this bridge to any provider.
      Owning the completion entry would create a cycle since B4809 sits below them. The seam delays
      the dependency while allowing compilation. Document the blocker until assigned.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/litellm_completion_bridge/handler.py#L113-L118
  - what: >-
      merge_agent_headers (case-insensitive header merging) and merge_a2a_session_into_litellm_params
      (session ID scoping) are both inlined in this task to avoid external task dependencies.
    why: Both functions are called from within A2A dispatch (merge_agent_headers in completion_bridge,
      merge_a2a_session_into_litellm_params in langflow_config) but their real owners were not yet
      assigned to leaf tasks (B098 and B050 have no files). Inlining them here avoids task cycles and
      dependency blocking while the architect assigns their ownership.

out_of_scope:
  - Tool invocation and execution logic; those belong to provider-specific tasks (B4804, B4806, B4808).
  - Message transformation from A2A to OpenAI format; owned by B4803 (A2ACompletionBridgeTransformation).
  - OpenAI response to A2A transformation; owned by B4803.
  - Event creation (task, status, artifact); owned by B4803.
  - Provider config base class and interface; owned by B4803.
  - Bedrock AgentCore handler; owned by B4804.
  - Pydantic AI handler; owned by B4806.
  - Watsonx Orchestrate handler; owned by B4808.
  - Completion function (litellm.acompletion) and its selection logic; owned by the unassigned execution port (architect question 3).

pitfalls:
  - _build_completion_params must strip exactly the frozenset of agent-only params before passing
    to litellm.acompletion. Missing even one causes the completion call to fail with unexpected parameter.
  - Model prefix check uses startswith() on '{provider}/' to detect if the model already includes a provider,
    avoiding double-prepending (e.g., "bedrock/agentcore" must not become "bedrock/bedrock/agentcore").
  - Forward metadata precedence is message > params > configured extra_body.metadata; apply in that order
    so message metadata overrides params metadata, and both override defaults.
  - LangFlow config must call merge_a2a_session_into_litellm_params before handler dispatch to scope sessions
    per authenticated key. Omitting this breaks session isolation.
  - LangFlow config must pass _skip_a2a_provider_routing=True to prevent recursive provider selection loops
    (bridge → LangFlow → bridge → LangFlow ...). Omitting this causes infinite recursion.
  - Streaming handler must accumulate text from all chunks before emitting artifact. If text is empty,
    do not emit artifact event. Do not replay a chunk after the stream ends.
  - Provider selector uses model substring check for bedrock ("agentcore" in model); a model like
    "bedrock-with-agentcore-support" will match, which is the intended LiteLLM behavior.
  - Agent extra headers are merged with case-insensitive key handling (inlined merge_agent_headers).
    Header names are preserved as-is in the merge output (no normalization).
  - The completion bridge is a static collection; _acompletion is a seam that captures litellm.acompletion
    dynamically to delay the import. Avoid storing it as a module-level global.
  - A2A_USER_API_KEY_HASH_PARAM ("litellm_a2a_user_api_key_hash") must match the value defined in this task
    (B4809 supplies the constant, B4802 references it as a declaration dependency).

