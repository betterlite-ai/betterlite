id: B4809
title: A2A completion dispatch and LangFlow session routing
description: >-
  Build the A2A completion bridge handler that dispatches requests to specialized provider
  configs (Bedrock AgentCore, Pydantic AI, Watsonx Orchestrate, LangFlow) or falls back to
  generic litellm.acompletion. Implement the provider selector and keep LangFlow's recursive
  session-scoping loop with skip-routing at this layer.

  A2ACompletionBridgeHandler is a static-method collection taking (request_id, params, litellm_params,
  api_base, agent_extra_headers) and returning A2A response dicts (non-streaming) or async
  iterators of response dicts (streaming). _build_completion_params strips agent-only metadata
  (is_public, agent_name, agent_id, agent_card_params, agent_card_path, litellm_a2a_user_api_key_hash),
  transforms A2A message to OpenAI messages, applies forward metadata (message metadata > params metadata
  > configured extra_body.metadata), builds the full model string by prepending custom_llm_provider
  if model does not already start with provider/, and merges agent_extra_headers over static headers
  using case-insensitive header merging (inlined from merge_agent_headers). Non-streaming calls the
  selected provider config's handle_non_streaming or falls through to litellm.acompletion, transforms
  the response to A2A format, and returns the dict. Streaming yields task event (submitted), status
  update (working), accumulates all choice-zero text from the completion stream, emits artifact event
  if text is nonempty, emits final status update (completed, final=true), and returns. Provider selection
  is by custom_llm_provider and optional model substring; unknown or None returns None from the selector
  and completion runs. The selector returns PydanticAIProviderConfig for "pydantic_ai_agents",
  BedrockAgentCoreA2AConfig when custom_llm_provider is "bedrock" and model contains "agentcore",
  LangFlowA2AConfig for "langflow", and WatsonxOrchestrateA2AConfig for "watsonx_orchestrate".
  LangFlow config merges A2A contextId as a session ID (inlined from merge_a2a_session_into_litellm_params)
  then calls handle_non_streaming/handle_streaming with _skip_a2a_provider_routing=True to prevent
  routing loops. Both merge_agent_headers and merge_a2a_session_into_litellm_params are inlined to
  avoid task dependencies on functions not yet assigned to a leaf task.

