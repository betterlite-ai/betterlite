  - tools/oracle/cases/helpers/oci-chat/supported-params-by-vendor.yaml
  - tools/oracle/cases/helpers/oci-chat/map-params-unsupported-and-drop.yaml
  - tools/oracle/cases/helpers/oci-chat/map-params-n-one-and-max-retries.yaml
