dod:
  - text: Parameter support lists, mapping, dropping and the unsupported-param errors match LiteLLM for both vendors.
    proof: [oci-chat-tests, oci-chat-python, oci-chat-seeds]
  - text: Request payloads match for GENERIC and COHERE, including serving mode, token cap rules, reasoning effort, tool choice and response format.
    proof: [oci-chat-tests, oci-chat-python, oci-chat-seeds]
  - text: Response and error handling and the SSE decoder produce the same results, and arbitrary bytes never panic the decoders.
    proof: [oci-chat-tests, oci-chat-python, oci-chat-seeds, oci-chat-corpus]
checks:
  optional: [mutants]
  commands:
    - id: oci-chat-tests
      why: parameter mapping, payload building or stream decoding behavior is missing
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^oci_chat::/) - test(replays_oci_chat_bytes_corpus)'
    - id: oci-chat-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5843)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5843 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5843/pyrightconfig.json
    - id: oci-chat-seeds
      why: new OCI chat cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/oci_chat-*")" &&
        grep -lE '^[[:space:]]+b5843:' tools/oracle/fuzz/corpus/helper_case/oci_chat-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: oci-chat-corpus
      why: the byte decoder fuzz target or its fresh replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-provider/fuzz/fuzz_targets/oci_chat_bytes.rs &&
        grep -q 'name = "oci_chat_bytes"' crates/betterlite-provider/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/oci_chat_bytes)" &&
        cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_oci_chat_bytes_corpus)'
