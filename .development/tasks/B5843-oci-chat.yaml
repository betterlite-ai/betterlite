deviations:
  - what: The oci_signer option is not supported; credentials are always manual user, fingerprint, tenancy and key.
    why: See B5940. The check for a signer in validate_environment is dropped with it.
  - what: A bad JSON body, a failed JSON decode of a chunk and a body that does not fit its type give a fixed message prefix without the Python exception text.
    why: The Python message comes from json and pydantic.
  - what: The user-agent version in validate_environment is the constructor argument litellm/1.105.1 until the architect decides.
    why: A Rust gateway has no LiteLLM package version to report.
out_of_scope:
  - B5940 owns oci_common, B5941 owns the embedding config and B5942 owns every function in chat/cohere.py and chat/generic.py.
  - The two get_*_custom_stream_wrapper methods send the HTTP request; B8330 owns those calls, the client choice and the signing call order, and calls this module only for the 300 second timeout, the status check and the decoder.
  - B2232 owns the shared stream assembly that the CustomStreamWrapper base class provides; this task only returns what the decoder saw.
  - B8330 owns reading the OCI_* environment variables, the _complete_oci dispatch and the HTTP oracle cases.
pitfalls:
  - The chat serving mode is compared exactly, so "dedicated" in lower case is an error here while the embedding config accepts it.
  - maxTokens becomes maxCompletionTokens only for GENERIC vendors, never for Cohere, and the first of max_tokens or max_completion_tokens present wins and never writes both.
  - A missing cap is filled under the key that was chosen (maxCompletionTokens for openai. models), not always under maxTokens.
  - map_openai_params merges optional_params over non_default_params, and unsupported keys inside optional_params also raise or drop.
  - The Cohere n=1 case is skipped silently but n=2 with drop_params false is OciError 400.
  - tool_choice strings are matched in lower case, so Auto and AUTO work, but a function name is kept with its original case.
  - A Cohere response format with json_schema keeps only its schema value and never sets name or isStrict.
  - The decoder treats any apiFormat other than the exact string COHERE as GENERIC, so a missing apiFormat takes the GENERIC path.
  - The SSE splitter yields a data line only at a newline or at the end, so a chunk split inside a JSON line must wait for the next read.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
