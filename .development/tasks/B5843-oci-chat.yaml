  - tools/oracle/cases/helpers/oci-chat/request-generic-dedicated-and-bad-mode.yaml
  - tools/oracle/cases/helpers/oci-chat/request-cohere-preamble-and-history.yaml
  - tools/oracle/cases/helpers/oci-chat/max-tokens-default-and-completion-tokens-key.yaml
  - tools/oracle/cases/helpers/oci-chat/reasoning-effort-case.yaml
  - tools/oracle/cases/helpers/oci-chat/tool-choice-normalization.yaml
  - tools/oracle/cases/helpers/oci-chat/response-format-normalization.yaml
  - tools/oracle/cases/helpers/oci-chat/missing-credentials-and-empty-messages.yaml
