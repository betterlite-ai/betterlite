id: B5843
title: OCI chat config, request payload and SSE stream decoding
description: >-
  Add oci_chat in betterlite-provider for litellm/llms/oci/chat/transformation.py. It is the last
  part of the OCI provider. B5940 (oci_common) supplies OciError, credentials, signing, URLs and
  OciServingMode. B5942 (oci_chat_wire) supplies the wire types, the message and tool adapters, and
  the response and chunk parsers. This task owns OCIChatConfig, the helpers above it and the stream
  wrapper. Credentials and the base URL are plain arguments: take B5940's OciCredentials and the
  optional api_base, never read the environment or a config section. Also define OciCompletionPayload
  (compartmentId, servingMode, chatRequest as the GENERIC or the Cohere request from B5942) here,
  since litellm/types/llms/oci.py has no port of its own.

  Parameter maps. Build the two maps exactly as in __init__: GENERIC maps stream to isStream,
  max_tokens and max_completion_tokens to maxTokens, temperature, tools, frequency_penalty to
  frequencyPenalty, logprobs to logProbs, logit_bias to logitBias, n to numGenerations,
  presence_penalty to presencePenalty, reasoning_effort to reasoningEffort, seed, stop, tool_choice
  to toolChoice, top_p to topP and response_format to responseFormat. These keys are known and
  unsupported: max_retries, top_logprobs, modalities, prediction, stream_options, function_call,
  functions, extra_headers, parallel_tool_calls, audio, web_search_options. The Cohere map changes
  stop to stopSequences, marks tool_choice, n, reasoning_effort, logprobs and logit_bias
  unsupported and adds top_k to topK. get_supported_openai_params lists the supported keys of the
  vendor's map in map order. get_vendor_from_model strips a leading oci/ (any case), takes the text
  before the first dot, lower-cased, and returns COHERE for cohere and GENERIC otherwise.

  map_openai_params(non_default_params, optional_params, model, drop_params) walks the merged dict
  (optional_params after non_default_params, so the second wins). An unsupported key is skipped for
  max_retries, skipped for n when the value is None or 1, skipped when drop_params is true, and
  otherwise OciError 400 "param `<key>` is not supported on OCI". A supported key is stored under
  its OCI name, and response_format is also kept under its OpenAI name. A key not in the map is kept
  under its own name. drop_params is a plain bool argument; B175 resolves the litellm.drop_params
  global and passes the result.

  Request building. validate_environment returns OciError 400 for empty messages, OciError 401 with
  the source message when user, fingerprint, tenancy, compartment id or both key sources are missing,
  then B5940's validate_oci_environment. get_complete_url is the B5940 base URL plus
  /20231130/actions/chat. transform_request needs a compartment id (OciError 400), reads
  oci_serving_mode (exact ON_DEMAND or DEDICATED, default ON_DEMAND, anything else is OciError 400;
  DEDICATED uses oci_endpoint_id and falls back to the model name). For Cohere it needs a user
  message (OciError 400), joins the text of all system messages with newlines into
  preambleOverride when non-empty, sends the last user message as message and the rest from B5942
  as chatHistory. For GENERIC it sends B5942's messages with apiFormat set to the vendor value.
  The optional params come from get_optional_params: walk the vendor's map; the first OpenAI key
  present in optional_params, else the OCI name, fills the target once; maxTokens is renamed
  maxCompletionTokens for GENERIC models where model_uses_max_completion_tokens is true (a model
  starting with openai. unless it starts with openai.gpt-oss, otherwise B2221's reasoning capability
  lookup for provider oci; an oci/ prefix is stripped first); a missing token cap is filled with
  4096; reasoningEffort is upper-cased and DISABLE becomes NONE; tools go through the vendor's B5942
  adapter. normalize_tool_choice turns the strings auto, none, required and any (any casing) into
  {"type": AUTO|NONE|REQUIRED}, any other string into {"type": "FUNCTION", "name": the string},
  and a dict into the flat form with the OciError 400 messages for a missing type, an empty
  function name and an unknown type. normalize_response_format maps text to TEXT, any other type for Cohere to
  JSON_OBJECT with the schema value of json_schema when present, json_schema (GENERIC) to JSON_SCHEMA with name (default response),
  description, schema and isStrict from strict, and any other type to its upper-case form with JSON
  becoming JSON_OBJECT. Keep the OciError wording from lines 138 to 229.

  Responses and streams. transform_response parses the body (the raw JSON-decode step is
  decode_chat_body over bounded bytes): a non-object is OciError "Invalid response format from OCI"
  and an object with a non-null error key is OciError with that value as text, both with the HTTP
  status. It then calls B5942's COHERE or GENERIC handler and stores the response headers in the
  hidden additional_headers. The stream decoder holds two flags, cohere_tool_calls_emitted and
  cohere_text_emitted, splits incoming text on newlines across reads (a data: line is kept
  after trimming, other lines are dropped, a trailing partial line is kept at the end), and for each
  data: line returns None for [DONE], OciError 500 "Chunk cannot be parsed as JSON" for bad JSON,
  and otherwise B5942's COHERE handler when apiFormat is COHERE and the GENERIC handler for any
  other value. After a Cohere chunk the flags are set once a choice has tool calls or non-empty
  content. The decoder reports, for the returned choices, whether any delta had tool calls and the
  last finish reason, so the stream assembly of B2232 can set the same state. Streaming constants:
  timeout 300 seconds, and a non-200 status is OciError with that status and the body text. The
  HTTP posts themselves belong to B8330. get_error_class is OciError with the status and message.

  Plan 330 lines of module code, 180 of tests and fixtures, 90 of oracle adapters and 52 of
  fuzz and replay. The remaining source is 652 nonblank, noncomment lines.
scope:
  paths:
    - crates/betterlite-provider/src/oci_chat.rs
    - crates/betterlite-provider/src/oci_chat/**
    - crates/betterlite-provider/fuzz/Cargo.toml
    - crates/betterlite-provider/fuzz/fuzz_targets/oci_chat_bytes.rs
    - crates/betterlite-provider/fuzz/corpus/oci_chat_bytes/**
    - tools/oracle/cases/helpers/oci-chat/**
    - "tools/oracle/fuzz/corpus/helper_case/oci_chat-*"
    - tools/oracle/helpers/b5843.py
    - tools/oracle/helpers/b5843/**
    - tools/oracle/src/helpers/provider/b5843.rs
    - tools/oracle/src/helpers/provider/b5843/**
  lint_tables: false
