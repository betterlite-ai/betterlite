      run: grep -q -r "struct ContentFilterGuardrailConfig" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records && grep -q -r "struct BlockCodeExecGuardrailConfig" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records && grep -q -r "struct HideSecretsGuardrailConfig" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records
    - id: ui-names-present
      why: The ui_friendly_name implementations are missing or incorrect
      run: grep -q -r '"LiteLLM Content Filter"' crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records && grep -q -r '"Block Code Execution"' crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records && grep -q -r '"Hide Secrets"' crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records
