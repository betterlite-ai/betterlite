      run: grep -q -r "CategoryFileData" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records && grep -q -r "ConditionalCategoryConfig" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records
