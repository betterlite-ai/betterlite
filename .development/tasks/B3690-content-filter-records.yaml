    - id: code-action-type-exists
      why: CodeBlockActionTaken type is missing
      run: grep -q -r "CodeBlockActionTaken" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records
    - id: category-config-exists
      why: ContentFilterCategoryConfig type is missing or incomplete
      run: grep -q -r "struct ContentFilterCategoryConfig" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records && grep -q -r "enabled" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records && grep -q -r "severity_threshold" crates/betterlite-config/src/sections/content_filter_records.rs crates/betterlite-config/src/sections/content_filter_records
    - id: category-types-exist
