    why: "ConditionalCategoryConfig, CompiledPatternEntry, _PatternExtraLookup, _CategoryConfigView and CategoryFileData TypedDict definitions"

dod:
  - text: Rust serde types for ContentFilterGuardrailConfig, BlockCodeExecGuardrailConfig and HideSecretsGuardrailConfig exist in betterlite-config and deserialize from LiteLLM's field names and structures.
    proof: [config-types-exist]
  - text: All three ui_friendly_name methods are present and return the correct strings ("LiteLLM Content Filter", "Block Code Execution", "Hide Secrets").
    proof: [ui-names-present]
  - text: Detection union types (PatternDetection, BlockedWordDetection, CategoryKeywordDetection, CompetitorIntentDetection, CodeBlockDetection) exist and their variants match LiteLLM's type definitions.
    proof: [detection-types-exist]
  - text: CodeBlockActionTaken (literal union of "block", "allow", "log_only") is defined and matches LiteLLM's type.
    proof: [code-action-type-exists]
  - text: ContentFilterCategoryConfig with fields category, enabled (default true), action (BLOCK/MASK), severity_threshold (default medium), category_file exists and matches LiteLLM's structure.
    proof: [category-config-exists]
  - text: CategoryFileData and intermediate category/pattern types (ConditionalCategoryConfig, CompiledPatternEntry, _PatternExtraLookup, _CategoryConfigView) are defined and match LiteLLM's structure.
    proof: [category-types-exist]
  - text: All types have test coverage for deserialization from valid configurations.
    proof: [config-types-tests]

