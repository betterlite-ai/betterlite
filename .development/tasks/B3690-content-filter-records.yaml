id: B3690
title: Content filter and built-in guardrail configuration records
description: >-
  Add typed representations for content filter detections, competitor intent results, and the three built-in guardrail configuration models to betterlite-config so they can be embedded in guardrail initialization and configuration.

  Build Rust serde types matching the LiteLLM types at the pinned commit:
  - ContentFilterGuardrailConfig: regex pattern matching and category-based detection configuration with traditional keywords, category lists, severity thresholds and optional competitor intent configuration. Maps from LiteLLM's LitellmContentFilterGuardrailConfigModel.
  - BlockCodeExecGuardrailConfig: fenced code block detection with language list, action (block/mask), confidence threshold and execution-intent flags. Maps from LiteLLM's BlockCodeExecutionGuardrailConfigModel.
  - HideSecretsGuardrailConfig: secret detection configuration with optional detect-secrets plugin overrides. Maps from LiteLLM's HideSecretsGuardrailConfigModel; the executable initializer is an enterprise-import branch outside this entry.

  Also define the low-level input records and detection types:
  - ContentFilterDetection: union of PatternDetection, BlockedWordDetection, CategoryKeywordDetection and CompetitorIntentDetection for logged match details.
  - CodeBlockDetection and CodeBlockActionTaken for code block execution logging: detection output with language, confidence, action taken and evidence.
  - ContentFilterCategoryConfig: pydantic model for category configuration with enabled/action/severity_threshold/category_file fields.
  - ConditionalCategoryConfig, CompiledPatternEntry, _PatternExtraLookup, _CategoryConfigView (internal intermediate types for category loading and pattern compilation).
  - CategoryFileData: parsed YAML category file with keywords, exceptions, severity inheritance and phrase patterns.

  The three ui_friendly_name implementations return "LiteLLM Content Filter", "Block Code Execution" and "Hide Secrets" respectively. Do not copy the base GuardrailConfigModel schema from LiteLLM; B104 must settle the boundary and own that type definition. These records are data contracts consumed by category loading and pattern compilation; they construct nothing final.

scope:
