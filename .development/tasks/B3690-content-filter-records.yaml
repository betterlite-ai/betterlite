      why: Type tests do not exist or do not pass
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::content_filter_records::config_types::/)'

oracle_cases: []

deviations:
  - what: "LiteLLM's category file schema includes phase_patterns (regex phrases for paraphrases), inherit_from (inheritance chains), and exceptions (substring exemptions). The schema maps fields to lowercase and merges YAML/JSON sources; betterlite defines the same field names for serde mapping."
    why: "The structure is read from configuration files; matching LiteLLM's field names ensures the configuration keeps working across the two implementations."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L145-L156"

out_of_scope:
  - "GuardrailConfigModel base class (belongs to B104)"
  - "ContentFilterAction and BlockedWord contracts (belong to B104)"
  - "CodeBlockDetection executable logging and accumulation logic (belongs to B3701)"
  - "Category loading logic (belongs to B3692)"
  - "Pattern compilation and matching (belongs to B3693 and later)"

pitfalls:
  - "LiteLLM uses Python TypedDict for detection records with total=False fields, which are all optional in Rust. Map these to serde with #[serde(default)] and Option<T> carefully to distinguish required from optional."
  - "The ui_friendly_name methods in LiteLLM are static methods returning string literals; port them as const fn or static strings in Rust to match the intention."
  - "ContentFilterCategoryConfig has enabled (default true) and severity_threshold (default medium) with specific literal variants (BLOCK, MASK for action; high/medium/low for severity); ensure defaults deserialize correctly."
  - "CompetitorIntentResult and CompetitorIntentEvidenceEntry in litellm_content_filter.py are TypedDict with type/key/value/match fields that carry union types; ensure the evidence list deserializes correctly from nested JSON."
  - "ConditionalCategoryConfig uses Sequence[str] in LiteLLM; it does not have a serde implementation, so Rust must use Vec<String> with appropriate defaults for missing fields."
  - "CodeBlockActionTaken is a literal union type (block | allow | log_only), not a model struct; it belongs alongside CodeBlockDetection in the detection type enum."
  - "Rust identifier names must not exceed 30 characters; use ContentFilterGuardrailConfig, BlockCodeExecGuardrailConfig, HideSecretsGuardrailConfig, not the full LiteLLM class names."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
