    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L278-L283

  - what: >-
      Azure Blob cache backend initialization.
    why: >-
      AzureBlobCache is owned by B4351. B4299 raises CacheTypeNotSupportedError("cache type 'azure-blob'
      is owned by B4351") when that type is selected.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L284-L288

  - what: >-
      The native cache runtime (_native_cache) is not integrated.
    why: >-
      Native cache integration requires the Rust-bridge ResponseCacheRuntime implementation, which is outside
      the scope of this task. The Python backends are sufficient for production use.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L42-L43

