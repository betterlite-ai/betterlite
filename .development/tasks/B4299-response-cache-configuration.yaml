  - Cache request normalization and hit retrieval (B4300).
  - Response cache envelopes and reads (B4297).
  - Embedding cache writes (B4298).
  - Batch cache operations and dual-tier logic (B4293, B4294, B4295).
  - Cache settings endpoints and management routes (B4306, B4307, B4308, B4309).
  - Semantic embedding routing and input limits (B4310).
  - >-
    Redis cluster mode (not yet owned by any task file), Redis semantic cache backend (owned by B4382),
    Valkey semantic cache backend (backlog B128, not yet split into a task), Qdrant semantic cache backend
    (owned by B4383), S3 cache backend (owned by B4350), GCS cache backend (backlog B127, not yet split into a task),
    and Azure Blob cache backend (owned by B4351).
  - Native Rust backend integration (blocker F).

pitfalls:
  - >-
    REDIS_CLUSTER_NODES is expected as valid JSON (an array of node objects). If it is malformed or set to the string "[]",
    json.loads will fail; provide a clear error message including the environment variable value and the exception.
    Alternatively, if redis_startup_nodes are not explicitly provided and REDIS_CLUSTER_NODES is set, raise an
    unsupported-type error immediately without attempting to parse it.

  - >-
    The namespace parameter is applied directly to RedisCache.namespace after construction; verify that RedisCache
    supports this attribute assignment and that it is only applied to Redis instances, not to other backends.

  - >-
    GCP parameters (gcp_service_account, gcp_ssl_ca_certs) are never used in this task since cluster mode is not
    supported; they must not appear in constructor signatures or initialization logic.

  - >-
    Callback registration checks for "cache" in the callback lists before adding it; ensure the callback manager
    is initialized before this code runs (it is created in litellm/__init__.py).

  - >-
    The semantic_cache_scope parameter defaults to SemanticCacheScope.KEY.value; do not fall back to a string
    default if the enum is not recognized, validate it strictly.

