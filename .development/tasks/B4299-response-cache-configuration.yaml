dod:
  - text: >-
      Cache.__init__ initializes the backend from the type parameter or uses _backend if provided.
      Supported backend types are constructed: InMemoryCache (LOCAL), RedisCache (REDIS, single-node only),
      and DiskCache (DISK). Unsupported types raise a CacheTypeNotSupportedError with the message
      naming the task id that will implement that backend (e.g., "cache type 'redis_semantic' is owned by B4320").
    proof: [cache-backend-tests, behavior-tests]

  - text: >-
      When the cache type is REDIS and redis_startup_nodes is not provided, the environment
      is checked for REDIS_CLUSTER_NODES through betterlite-config. If found, a CacheTypeNotSupportedError
      is raised stating that Redis cluster mode is owned by B4320. No redis_startup_nodes parameter
      is passed to RedisCache constructor.
    proof: [cache-backend-tests, behavior-tests]

  - text: >-
      The Cache instance registers "cache" with litellm.input_callback, success_callback, and
      _async_success_callback through the callback manager exactly once per instance, checking for
      existing registrations first.
    proof: [cache-callback-tests, behavior-tests]

  - text: >-
      The Cache instance stores type, namespace, ttl, mode (defaulting to default_on), supported_call_types,
      and semantic_cache_scope (defaulting to SemanticCacheScope.KEY.value). When type is LOCAL and
      default_in_memory_ttl is provided, ttl is set to that value. When type is REDIS and
      default_in_redis_ttl is provided, ttl is set to that value. A namespace is applied to RedisCache
      instances after construction.
    proof: [cache-backend-tests, behavior-tests]

  - text: >-
      The ping, delete_cache_keys, and disconnect methods delegate to the backend's async methods
      where available. The _supports_async method returns true.
    proof: [cache-lifecycle-tests, behavior-tests]

  - text: >-
      enable_cache creates and assigns a new Cache instance to litellm.cache when it is None,
      registering callbacks. update_cache creates a new Cache instance and assigns it to litellm.cache
      unconditionally, overwriting any previous instance. disable_cache removes "cache" from input_callback,
      success_callback, and _async_success_callback (ignoring ValueErrors), and sets litellm.cache to None.
    proof: [cache-module-tests, behavior-tests]

  - text: >-
      All three module-level functions call print_verbose with status and configuration messages.
    proof: [cache-module-tests, behavior-tests]

checks:
  optional: [mutants]
  commands:
    - id: cache-backend-tests
      why: the backend initialization or env loading fails or is missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^backend_construction::/)'

    - id: cache-callback-tests
      why: callback registration fails or is missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^callback_registration::/)'

    - id: cache-lifecycle-tests
      why: lifecycle methods (ping, delete, disconnect, _supports_async) fail or are missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^cache_lifecycle::/)'

    - id: cache-module-tests
      why: module functions (enable_cache, update_cache, disable_cache) fail or are missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^cache_module_functions::/)'

    - id: behavior-tests
      why: behavior tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-cache -p betterlite-config --no-tests=fail

oracle_cases: []

deviations:
  - what: >-
      Redis cluster initialization with REDIS_CLUSTER_NODES environment variable.
    why: >-
      RedisClusterCache constructor is not yet owned by any task file. The cluster_kwargs branch
      (litellm/caching/caching.py L190-219) belongs to B4299 but the implementation is blocked pending
      extraction of cluster-mode backend owners. B4299 raises CacheTypeNotSupportedError("cache type 'redis' with
      cluster mode is not yet implemented") when REDIS_CLUSTER_NODES is detected in the environment and
      redis_startup_nodes is not explicitly provided.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L191-L219

  - what: >-
      Redis semantic search cache backend initialization.
    why: >-
      RedisSemanticCache is owned by B4382. B4299 raises CacheTypeNotSupportedError("cache type 'redis-semantic'
      is owned by B4382") when that type is selected.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L220-L231

  - what: >-
