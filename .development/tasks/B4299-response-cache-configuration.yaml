id: B4299
title: Configure response cache backends and callback lifecycle
description: >-
  Build Cache.__init__ with support for supported backend types from owned dependencies:
  in-memory (default), Redis (single-node only), and disk. When an injected _backend is provided,
  use it directly; otherwise select and initialize the backend by type.
  Unsupported types (Redis cluster with REDIS_CLUSTER_NODES, Redis semantic search, Valkey semantic search,
  Qdrant semantic search, S3, GCS, Azure Blob) are owned by separate task ids (B4320+, B4350+, B4380+)
  and raise a clear error indicating which task will implement that backend.

  Register "cache" with the callback manager for input_callback, success_callback, and
  async_success_callback only once per Cache instance, reusing existing registrations.

  Load REDIS_CLUSTER_NODES as JSON through betterlite-config's environment lookup when
  redis_startup_nodes are not explicitly provided, but raise an error when cluster mode
  is selected (the cluster backend is not yet owned). For single-node Redis, pass GCP service
  account and SSL CA certs only if provided. Store the cache type, namespace, TTL, cache mode,
  and supported call types; apply default_in_memory_ttl for LOCAL type and default_in_redis_ttl
  for REDIS type. Apply a provided namespace to RedisCache instances.

  Implement ping, delete_cache_keys, and disconnect methods that delegate to the backend's
  async methods where available. The _supports_async method returns true (all backends now
  support async). Implement module-level enable_cache() and update_cache() functions that
  create/replace the litellm.cache instance with the specified configuration and register
  callbacks. Implement disable_cache() to remove the cache from callbacks and set litellm.cache
  to None. All three functions log with print_verbose and handle callback registration idempotently.

