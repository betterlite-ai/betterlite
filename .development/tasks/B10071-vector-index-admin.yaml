id: B10071
title: Vector store index admin gate and lifecycle check
description: >-
  Creating, changing or deleting a vector store index is for proxy admins only. vector_store_endpoints/utils.py decides that in four small functions at L40-L99: _is_proxy_admin, assert_proxy_admin_for_vector_store_index_management, _suffix_after_index_name and _is_vector_store_index_lifecycle_request. This task builds those four and nothing else from the file. B1060's store access checks short-circuit on the admin predicate, B1061's endpoint grant checks call the lifecycle check and the admin gate, and the index routes call the gate before they touch the database.


  Layout. Module vector_index_admin in betterlite-auth: crates/betterlite-auth/src/vector_index_admin.rs with its tests in vector_index_admin/tests.rs, and the lifecycle check in vector_index_admin/lifecycle.rs with its tests in vector_index_admin/lifecycle/tests.rs. lib.rs already declares the module over an empty stub file. The code lives in betterlite-auth because UserAPIKeyAuth keeps user_role pub(crate) there and no public reader of it exists (B2314's user_api_key_has_admin_view also admits proxy_admin_viewer, so it is not this check). betterlite-auth already holds vector store authorization reads (auth_resource_grants, B749), and betterlite-core, where B1060 and B1061 live, already depends on it; no Cargo.toml changes.


  1. auth_is_proxy_admin(auth: &UserAPIKeyAuth) -> bool is LiteLLM's _is_proxy_admin: true only when user_role is proxy_admin. Write it as one exhaustive match over UserRole with no wildcard arm, the shape user_api_key_has_admin_view has in crates/betterlite-auth/src/resolved_key/auth.rs: a new role then fails the build until someone decides whether it administers indexes. B1060 calls it for its two admin short circuits and B1061 for its two admin bypasses, so none of them compares the role on its own.


  2. IndexOperation is an enum with Create, Delete, Update and List, displayed as "create", "delete", "update" and "list" (LiteLLM's operation literal; its default is create, and callers here always pass one). IndexAdminError is this module's error enum with one variant, NotProxyAdmin(IndexOperation), whose message is "Only proxy admins can <operation> vector store indexes. Contact your LiteLLM administrator.". require_index_admin(auth: &UserAPIKeyAuth, operation: IndexOperation) -> Result<(), IndexAdminError> is assert_proxy_admin_for_vector_store_index_management: Ok for a proxy admin, else NotProxyAdmin with the operation. Callers turn the error into LiteLLM's HTTPException, status 403 with that message as detail; it carries no error type, param or code.


  3. is_index_lifecycle_request(method: &str, path: &str, index_name: &str) -> bool is _is_vector_store_index_lifecycle_request, in lifecycle.rs. A method other than "POST", "PUT", "DELETE" or "PATCH" (exact strings) gives false. Then the suffix after the index name (_suffix_after_index_name, private here): the text after the first occurrence of "/indexes/" followed by the literal index name whose next character is the end of the path, "/" or "?"; None when there is no such occurrence. A suffix that starts with "/docs" gives false at once (document operations). An empty suffix or one that starts with "?" gives true (the index itself). Otherwise, and when there is no suffix, the path is cut at its first "?", every trailing "/" is trimmed, and the answer is true only for POST on a path that then ends with "/indexes" (create at the service level). Everything else is false. No regex is needed.


  Oracle. No route reaches this code yet, so the helper operation b10071 compares the gate and the lifecycle check with LiteLLM. Its input names the function: for the gate, a user_role (a LitellmUserRoles value or null) and an operation; for the lifecycle check, the method, path and index name. The Rust side builds the auth with UserAPIKeyAuth::construct from a dict holding user_role. The Python adapter builds LiteLLM's UserAPIKeyAuth with that role, calls assert_proxy_admin_for_vector_store_index_management and catches HTTPException, and calls _is_vector_store_index_lifecycle_request with keyword arguments. The answer is whether the gate passed with the status of the refusal, or the boolean.

