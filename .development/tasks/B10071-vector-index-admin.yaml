dod:
  - text: >-
      auth_is_proxy_admin is true for proxy_admin and false for proxy_admin_viewer, org_admin, internal_user and no role;
      require_index_admin passes a proxy admin and refuses everyone else with NotProxyAdmin, whose message names create, delete, update or list as LiteLLM's does.
    proof: [admin-tests, helper-case-corpus, helper-python, helper-tests, oracle]
  - text: >-
      is_index_lifecycle_request is true for POST, PUT, DELETE and PATCH on /indexes/<name> and /indexes/<name>?x=1 and for POST on /indexes and /indexes/?x=1;
      it is false for GET, for /indexes/<name>/docs/search and /indexes/<name>/docsanything, for a trailing slash after the name, for "axb" when the name is "a.b",
      and for /indexes/name2 when the name is "name", and it finds the name at a later occurrence when an earlier one is followed by another character.
    proof: [lifecycle-tests, helper-case-corpus, helper-python, helper-tests, oracle]
  - text: The b10071 helper cases exist for the gate and the lifecycle check, survive the corpus replay and match LiteLLM.
    proof: [helper-case-corpus, helper-python, helper-tests, oracle]

checks:
  optional: []
  commands:
    - id: admin-tests
      why: the admin predicate admits the wrong role or the gate refuses with the wrong operation
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^vector_index_admin::tests::/)'
    - id: lifecycle-tests
      why: an index create, update or delete is not recognized, or a document call is taken for one
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^vector_index_admin::lifecycle::tests::/)'
    - id: helper-tests
      why: the b10071 adapter does not call the production gate and lifecycle check
      run: cargo nextest run --locked -p betterlite-oracle-auth --no-tests=fail -E 'test(/^b10071::/) - test(/replays_the_/)'
    - id: helper-python
      why: tools/oracle/helpers/b10071.py is missing or fails ruff or basedpyright
      run: test -f tools/oracle/helpers/b10071.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added vector-index-admin helper case reaches the shared parser
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/vector-index-admin-*')" && grep -qE '^[[:space:]]+b10071:' tools/oracle/fuzz/corpus/helper_case/vector-index-admin-* && cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-auth --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

