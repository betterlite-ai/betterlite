out_of_scope:
  - "_normalize_litellm_params, _object_permission_allows_vector_store, _get_object_permission_for_id, can_user_access_vector_store, _is_vector_store_granted, _team_auth_context, _vector_store_auth_contexts, _is_vector_store_granted_to_any and filter_listable_vector_stores: B1060, which calls auth_is_proxy_admin."
  - "get_litellm_managed_vector_store, assert_user_can_access_vector_store and assert_user_can_access_vector_store_id: B10014."
  - "_does_endpoint_match, check_vector_store_permission, is_allowed_to_call_vector_store_endpoint and is_allowed_to_call_vector_store_files_endpoint: B1061, which calls all three public functions here."
  - "The index create and list routes and the pass-through index create, with their 403 envelopes: the route tasks that own them (B1067, B3624)."

pitfalls:
  - LiteLLM's admin check accepts proxy_admin only, so proxy_admin_viewer is refused here although user_api_key_has_admin_view admits it.
  - "_suffix_after_index_name relies on the lookahead (?=$|[/?]) and the regex crate has none; scan the occurrences of \"/indexes/<name>\" with match_indices, because re.search moves on past an occurrence the lookahead rejects, so \"/indexes/name2/indexes/name\" matches the second one."
  - The index name is escaped in LiteLLM (re.escape), so compare it as a literal; "a.b" must not match "axb".
  - A "/docs" suffix returns false before the POST rule runs, and a suffix like "/" or "/other" falls through to it; only a path that ends in "/indexes" after the query cut and the trim is a create.
  - Python's rstrip("/") removes every trailing slash, so POST "/azure_ai/indexes///" is a create; trim all of them, not one.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
