id: B2303
title: Shared stored-secret and bearer-token codecs
description: >-
  Implement encrypt_decrypt_utils.py in a small betterlite-secrets crate below authentication,
  repositories and callback configuration. Own every function in that file, including the bearer
  primitives previously assigned to B1223 and the stored-value/map helpers previously assigned to B061.
  Export a concrete StoredCipher with injected secrets, algorithm, randomness and diagnostics. No
  dependency on B052, B061, B124 or callback registration is permitted: those consumers call this codec.
  Use maintained cryptographic crates, not handwritten ciphers, with the repository dependency review.
  Own the shared CALLBACK_VAR_ENCRYPTED_PREFIX literal litellm_enc:: from callback_utils.py L47
  here as well, so callback transforms and database re-encryption share it without depending on
  one another. B2304 retains the private alias and callback slot selection.

  Resolve LITELLM_SALT_KEY first, falling back to the master key only when the env value is absent;
  an empty string is a real key. A truthy new_encryption_key overrides that selection for stored writes,
  but an empty override falls back. SHA-256 of the UTF-8 key is the 32-byte cipher key; changing to a
  different KDF would break existing rows. general_settings.encryption_algorithm defaults to
  xsalsa20-poly1305. Only a string equal to aes-256-gcm ignoring case selects AES; whitespace is not
  stripped. Unknown/non-string values and unavailable settings use legacy encryption without warning.
  Resolve through B002, including reload snapshots, while retaining the source fallback rather than
  inventing a startup rejection for this recognized setting.

  Stored legacy values are URL-safe base64 of NaCl SecretBox output: 24-byte nonce, 16-byte MAC and
  ciphertext. AES values are v2:gcm: plus padded URL-safe base64 of a 12-byte nonce, ciphertext and
  16-byte tag, with no AAD. Detect that prefix on READ regardless of the current write algorithm.
  Legacy reads try URL-safe decoding first and standard base64 only if the first decode raises;
  preserve Python's permissive nonalphabet handling. A raw empty legacy byte buffer decrypts to an
  empty string after key setup. encrypt_value_helper leaves non-string values unchanged with a debug
  diagnostic, and propagates string-encryption errors. It does not supply plaintext fallback.

  decrypt_value_helper also leaves non-string values unchanged. The key argument is a diagnostic field
  name, never the cipher key. On failure, exception_type=debug emits one debug diagnostic and returns
  the original value only when return_original_value=true, otherwise None. The default error mode
  first emits the unable-to-decrypt debug message; return_original_value=true then returns the input
  without an exception log, while false emits the detailed exception diagnostic and returns None.
  Include the field name, salt-change advice and permanent-salt documentation link, without exposing
  values. decrypt_if_encrypted_with uses its explicit key, returns None for errors AND for legacy
  inputs decoding to no bytes (including empty string and *), and otherwise returns the plaintext.

  Bearers always use AES-GCM regardless of the stored-value algorithm. encrypt_bearer_token requires a
  string salt/master secret, otherwise ValueError asks to set LITELLM_SALT_KEY or a master key. Prefix
  bytes are AAD and the ciphertext follows that prefix as unpadded base64url. Decryption rejects a
  missing string key or wrong prefix before decoding, restores padding, validates the base64 alphabet
  strictly and returns None for bad length, tag, key, prefix AAD or UTF-8. No bearer-decryption failure
  emits a diagnostic. Preserve interoperability with B1223's litellm_login_ prefix.

  encrypt_secret_map returns literal {} for an empty map without encryption. Otherwise encode the
  entire string-to-string map as JSON, encrypt once and JSON-quote the ciphertext string. decode_secret_map
  returns None for None, accepts a strict plaintext string map, and treats a string beginning after
  leading whitespace with { or a quote as JSON before applying the stored map-or-ciphertext union.
  Other strings are raw ciphertext. Decrypt through the debug/return_original_value=false path and
  require a strict JSON string map. Validation failures become SecretMapDecodeError with
  "Cannot decode encrypted MCP <key>; check LITELLM_SALT_KEY", without embedding the value. Preserve
  the difference between an empty map, null, invalid JSON and a successfully decrypted empty map.

  Only diagnostics differ: never print the non-string input value in encrypt_value_helper's debug
  message. native_secret_diagnostics_redact_values covers structured values and error formatting.
  Native decode limits cap encoded ciphertext/map input at 1048576 bytes and JSON depth at 64; map
  limit failures use SecretMapDecodeError, bearer limit failures return None and stored scalar decoding
  follows its existing failure return policy. Test these deviations outside equality cases.

  Add one secret_codec helper operation to B171's existing dispatch. Python calls the pinned helpers
  with restored globals and deterministic random bytes for test vectors; Rust calls production code.
  Cross-decrypt both implementations, compare wire format and failure/log sequence, and do not merely
  round-trip each codec against itself. The new crate owns fuzz/secret_value, invoking the same bounded
  scalar, bearer and map decoding entry points used in production; replay malformed, wrong-key,
  empty, legacy-standard-base64, AES, prefixed-bearer and byte/depth-limit seeds.

  The file has 183 nonblank, noncomment lines including docstrings. Allocate 240 implementation,
  230 tests, 90 helper adapters, 70 config, 70 fuzz and 55 crate/wiring lines, 755 within 800.
scope:
  paths:
    - Cargo.toml
    - Cargo.lock
    - crates/betterlite-secrets/Cargo.toml
    - crates/betterlite-secrets/src/**
    - crates/betterlite-secrets/fuzz/Cargo.toml
    - crates/betterlite-secrets/fuzz/fuzz_targets/secret_value.rs
    - crates/betterlite-secrets/fuzz/corpus/secret_value/**
    - crates/betterlite-config/src/secret_codec.rs
    - crates/betterlite-config/src/secret_codec/**
    - crates/betterlite-config/src/loader.rs
    - crates/betterlite-config/src/raw.rs
    - crates/betterlite-config/tests/**
    - crates/betterlite-config/src/resolve.rs
    - crates/betterlite-config/src/types.rs
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/fuzz/corpus/config_yaml/secret-codec-*
    - tools/oracle/src/helpers/secrets.rs
    - tools/oracle/src/helpers/secrets/secret_codec.rs
    - tools/oracle/src/helpers/secrets/secret_codec/**
    - tools/oracle/helpers/dispatch.py
    - tools/oracle/helpers/secret_codec.py
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/secret-codec/**
    - tools/oracle/fuzz/corpus/helper_case/secret-codec-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/callback_utils.py#L47-L48
    why: The public stored-callback marker belongs below both B2304 and B730; its private alias stays with B2304.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/encrypt_decrypt_utils.py#L15-L123
    why: Own algorithm/key resolution, AES helpers and bearer envelope.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/encrypt_decrypt_utils.py#L126-L252
    why: Own legacy secretbox, value helpers and their distinct failure policies.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/encrypt_decrypt_utils.py#L255-L289
    why: Own encrypted MCP map encoding and strict migration-compatible decoding.
dod:
  - text: 'wire_interop cases cover legacy_nonce_mac_layout, aes_prefix_nonce_tag_layout,
      legacy_standard_base64, permissive_legacy_decode, empty_legacy_bytes, algorithm_switch_reads_old,
      string_encrypt_failure, non_string_passthrough, decrypt_debug_policy, decrypt_error_policy,
      explicit_key_probe_empty_rejected, bearer_aad, bearer_unpadded_base64, bearer_missing_secret,
      bearer_bad_prefix_base64_length_tag_utf8 and bearer_error_silent.'
    proof: [behavior-tests, oracle, helper-python, helper-corpus]
  - text: 'secret_maps covers empty_map_unencrypted, whole_map_encrypted_once, plaintext_map,
      json_plaintext_map, json_quoted_ciphertext, raw_ciphertext, leading_whitespace, null_map,
      wrong_value_type, malformed_json and bad_ciphertext_error_redaction.'
    proof: [behavior-tests, oracle]
  - text: 'Loader tests salt_before_master, absent_salt_uses_master, empty_salt_kept,
      truthy_new_key_override, default_legacy_algorithm, aes_casefold_without_trim,
      unknown_algorithm_legacy and algorithm_reload_consumed prove the configured values reach the codec.'
    proof: [config-tests, config-corpus, behavior-tests]
  - text: native_secret_diagnostics_redact_values and secret_input_limits prove the documented differences;
      the production decode entry points are also the fuzz target and corpus replay entry points.
    proof: [behavior-tests, parser-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Cross-language wire/failure or secret handling tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-secrets --no-tests=fail -E 'test(/^secret_codec::tests::/) - test(replays_the_secret_value_corpus)'
    - id: config-tests
      why: The real loader misresolves cipher keys or the selected write algorithm.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^secret_codec::tests::/)'
    - id: config-corpus
      why: No new secret-codec config seed reaches the existing decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/secret-codec-*')" && grep -rlq encryption_algorithm crates/betterlite-config/fuzz/corpus/config_yaml/secret-codec-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: The independent pinned-code codec adapter is missing or untyped.
      run: test -f tools/oracle/helpers/secret_codec.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-corpus
      why: A newly added secret_codec operation has no production HelperCase seed.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/secret-codec-*')" && grep -rlq secret_codec tools/oracle/fuzz/corpus/helper_case/secret-codec-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: Secret decoding lacks its registered fuzz target or executable corpus replay.
      run: test -f crates/betterlite-secrets/fuzz/fuzz_targets/secret_value.rs && grep -q secret_value crates/betterlite-secrets/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-secrets/fuzz/corpus/secret_value)" && cargo nextest run --locked -p betterlite-secrets --no-tests=fail -E 'test(replays_the_secret_value_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/secret-codec/legacy-and-aes-vectors.yaml
  - tools/oracle/cases/helpers/secret-codec/key-and-algorithm-selection.yaml
  - tools/oracle/cases/helpers/secret-codec/scalar-failure-policies.yaml
  - tools/oracle/cases/helpers/secret-codec/bearer-envelope.yaml
  - tools/oracle/cases/helpers/secret-codec/stored-map-shapes.yaml
deviations:
  - what: Non-string encryption diagnostics include the type but omit the supplied value.
    why: secrets-stay-secret forbids the source debug message from printing potentially sensitive structures.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/encrypt_decrypt_utils.py#L142-L146
  - what: Encoded secret inputs over 1048576 bytes or map JSON deeper than 64 are rejected through the
      decoder's existing failure outcome before unbounded allocation.
    why: bounded-inputs requires a finite boundary; ordinary compatible ciphertext formats remain unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/encrypt_decrypt_utils.py#L273-L289
out_of_scope:
  - B061 owns credential routes, credential migration and app_crypto/credential_accessor; it calls this codec.
  - B1223 owns session JSON payloads, expiry policy and invalid-session redaction above the bearer codec.
  - Callback-field selection and its encryption-failure passthrough belong to B2304.
pitfalls:
  - A bearer prefix is authenticated AAD, while the stored v2:gcm marker is only a format selector.
  - The permissive legacy decoder and strict bearer decoder cannot share one base64 acceptance policy.
  - Empty raw legacy ciphertext decrypts to empty text, but decrypt_if_encrypted_with must reject it.
budget:
  max_changed_lines: 1900
  max_new_expects: 0
review_level: security
