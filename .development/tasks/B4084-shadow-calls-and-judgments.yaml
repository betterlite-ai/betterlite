deviations:
  - what: The A/B coin comes from an injected `PositionCoin`, a uniform random source in production, instead of a call to Python's `random.random()`.
    why: Tests and oracle runs need a fixed coin; the distribution a user sees is the same, a fair coin per judge call.
  - what: The router and the judge model are reached through injected traits, not the proxy's global router.
    why: betterlite keeps no module-level state; LiteLLM's `default_router_provider` reads a proxy global (B4080 owns that note).
  - what: The 8,000, 24,000 and 2,000 character caps count Unicode characters, as Python slicing does, and never cut inside a character.
    why: Rust strings slice by bytes; counting characters keeps the prompt identical to LiteLLM's for non-ASCII chat.
out_of_scope:
  - "Arm choice, budget gates, the loop over arms and the attempt outcome for each exit: B4085."
  - "Active job loading, sampling and attempt rows: B4083."
  - "Chat text reader, call cost reader, failure detail, judge reply shape, empty-reply error, routing decision readers and the ShadowResponse, JudgeVerdict and CallFailure records: B4081 owns them, this task calls them."
  - "parse_json_verdict, extract_text_from_content, judge_target and judge_acompletion: B4080."
  - "Forwardable metadata (`forward`, `Origin`, `Forwarding`): B188."
  - "Request normalization and the shadow_params the caller builds: B4082."
  - "Router.acompletion itself: no task owns a Rust router call API at the pin of this plan; this task only declares the `ShadowRouter` trait it needs."
pitfalls:
  - "A shadow call that returns an empty reply still billed: the failure keeps the call cost, so job spend never undercounts."
  - "A router error cannot know a call cost, so cost is 0, but the routing classifier may have billed already: read `classifier_cost` from the metadata the router wrote back to."
  - "The router call takes the sanitized metadata map by mutable reference and reads the routing decision after the call; passing a copy loses `routed_model` and the tier."
  - "Both calls forward identity only (`Forwarding::Detached`); copying the parent's full metadata would carry the real call's routing decision and logging payload into a call that outlives it."
  - "The judge dispatch needs the team id from `user_api_key_team_id` as an argument; without it a team-only judge model resolves as a public name and the call is declined."
  - "`confidence` accepts any JSON number, but the verdict must still have `preference` exactly `A`, `B` or `tie`: lower-case `a` fails validation and becomes an unparseable-verdict failure, so the lower-casing in `unmask_preference` never sees it from this path."
  - "A reply with `content: null` reads as the empty string and then fails JSON parsing, so it is an unparseable-verdict failure and still carries the judge cost."
  - "The conversation budget is never zero: replies are capped at 8,000 characters each and the tool text at 2,002 with its separator, so at least 5,998 characters remain; keep the LAST budget characters of the conversation, not the first."
  - "Messages whose `content` is null are skipped, but a message with empty-string content is kept and prints `USER: `."
  - "Tool definitions show name and description only; do not forward parameter schemas, and do not count the header in the caps differently: the 2,000 limit applies to the whole text including `Tools available to both responses:`."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
