dod:
  - text: With no router the shadow call returns the failure `no router configured on this pod`, and the router is not called.
    proof: [router-call-tests]
  - text: The router call gets the target model, a copy of the messages, detached shadow-origin metadata, zero retries, no fallbacks and every shadow param.
    proof: [router-call-tests]
  - text: A router error gives a `shadow router call failed:` failure with cost 0 and the classifier cost already in the metadata.
    proof: [router-call-tests]
  - text: An empty reply gives the empty-reply failure that keeps the call cost and classifier cost; a non-empty reply gives a ShadowResponse whose model falls back from the response model to the routing decision to the empty string.
    proof: [router-call-tests]
  - text: The judge sees the replies in coin order and the verdict is unmasked back to real, shadow or tie for both coin results.
    proof: [judge-call-tests, unmask-tests]
  - text: The judge call sends the system prompt, the budgeted user prompt, temperature 0, 4096 max tokens, the strict response format and judge-origin metadata with the forwarded team id.
    proof: [judge-call-tests, response-format-oracle]
  - text: A dispatch error gives a `judge call failed:` failure with cost 0.
    proof: [judge-call-tests]
  - text: A reply that is not valid JSON, not an object, lacks a field, has another preference or a non-number confidence gives an `unparseable judge verdict:` failure with the reply shape and the billed cost.
    proof: [judge-call-tests]
  - text: Confidence outside 0..1 is clamped on the returned verdict.
    proof: [judge-call-tests]
  - text: The tool text, judge prompt and unmask helpers match LiteLLM on the oracle cases, including the character caps and keeping the end of a long conversation.
    proof: [prompt-tests, unmask-tests, helper-oracle]
  - text: The response format constant equals LiteLLM's `type_to_response_format_param(PairwiseVerdict)` output.
    proof: [response-format-oracle]
checks:
  optional: []
  commands:
    - id: router-call-tests
      why: the shadow call tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_calls::router_call::/)'
    - id: judge-call-tests
      why: the judge call tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_calls::judge_call::/)'
    - id: prompt-tests
      why: the tool text and judge prompt tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_calls::judge_prompt::/)'
    - id: unmask-tests
      why: the unmask tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_calls::unmask::/)'
    - id: helper-oracle
      why: the prompt and unmask helpers differ from pinned LiteLLM
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/shadow-calls)" && cargo build --locked -p betterlite-oracle && target/debug/betterlite-oracle tools/oracle/cases/helpers/shadow-calls
    - id: response-format-oracle
      why: the response format constant is missing or differs from pinned LiteLLM
      run: test -f tools/oracle/cases/helpers/shadow-calls/pairwise-response-format.yaml && cargo build --locked -p betterlite-oracle && target/debug/betterlite-oracle tools/oracle/cases/helpers/shadow-calls/pairwise-response-format.yaml
