id: B4084
title: Execute shadow calls and blind pairwise judgments
description: >-
  Build the two outbound calls of a shadow evaluation in betterlite-server, in a new module `shadow_calls`: the shadow call that sends the sampled conversation through the arm nobody was served, and the blind pairwise judge call that compares the real reply with the shadow reply. Both return a typed outcome and never raise for a provider fault: a provider or parse fault becomes a `CallFailure` value that carries any cost the call still billed. The caller (B4085) turns the outcome into an attempt row.

  Shadow call. `call_router_shadow(target_model, messages, shadow_params, parent_metadata)` returns `Result<ShadowResponse, CallFailure>` (use B4081's two record types). It takes the router through an injected `ShadowRouter` trait with one async method `acompletion` and a `ShadowRouterProvider` that returns `Option<Arc<dyn ShadowRouter>>` at call time, because the router is created lazily. With no router it returns `CallFailure` with the exact error `no router configured on this pod`. Otherwise it builds the call metadata with `betterlite_logging::logging_privacy::internal::forward(parent_metadata, Origin::ShadowEvalRouter, Forwarding::Detached)` (B188), which keeps only the caller identity and stamps `internal_call_origin`. The router call gets `model=target_model`, a copy of `messages`, that metadata, `num_retries=0`, `fallbacks=[]`, and then every entry of `shadow_params` (the sampled request's own sampling params and tools). The router may write a routing decision back into the same metadata map, so the call receives it mutably and it is read after the call. If the router call errors, return `CallFailure` with error `shadow router call failed: ` plus B4081's failure detail text, cost 0 and `classifier_cost` from B4081's decision classifier cost reader on the metadata (a classifier can bill before the model call fails). On success take the reply text with B4081's chat text reader. The served model is the response's `model` if it is non-empty, else the metadata routing decision's `routed_model`, else the empty string. When the text is empty return `CallFailure` with B4081's empty-reply error, `cost` from B4081's call cost reader (the empty reply still billed) and the classifier cost. Otherwise return `ShadowResponse` with the text, served model, B4081's routed tier, the call cost and the classifier cost.

  Judge call. `call_judge(judge_model, messages, real_text, shadow_text, tools, parent_metadata)` returns `Result<JudgeVerdict, CallFailure>`. A position-bias coin decides which reply is A: `real_is_a` is true when `random.random() < 0.5`. Take the coin from an injected `PositionCoin` trait (`fn real_is_a(&self) -> bool`) so tests are deterministic; production uses a uniform random source. `response_a` is the real text when `real_is_a`, else the shadow text, and `response_b` is the other one. The conversation text is one line per message that has non-null `content`, in order, as `ROLE: text`, with the role upper-cased (a missing role reads `user`) and the text from B4080's `extract_text_from_content`, joined with a newline. Judge metadata comes from `forward(parent_metadata, Origin::ShadowEvalJudge, Forwarding::Detached)`. The judge messages are a system message with `PAIRWISE_JUDGE_SYSTEM_PROMPT` (copy the text byte for byte, including the two-line JSON shape at the end) and a user message from `judge_user_prompt(conversation, response_a, response_b, tool_definitions_text(tools))`. Dispatch with B4080's `judge_acompletion` using the router from the provider, the team id from `forwarded_team_id(parent_metadata)`, `temperature=0`, `max_tokens=JUDGE_MAX_OUTPUT_TOKENS` (4096), `response_format=PAIRWISE_JUDGE_RESPONSE_FORMAT` and the judge metadata. A dispatch error returns `CallFailure` with error `judge call failed: ` plus the error text and cost 0. When B4080 reports the judge target as `nothing`, treat it as a dispatch error with that same prefix. Parse the reply: take `choices[0].message.content` (null reads as the empty string), run B4080's `parse_json_verdict`, and validate the object as `PairwiseVerdict`: `preference` must be exactly `A`, `B` or `tie` and `confidence` must be a number, both required, extra keys ignored. A reply with no choices, no message, bad JSON or a failed validation returns `CallFailure` with error `unparseable judge verdict: ` plus the parser or validation message, then `; ` plus B4081's judge reply shape text, and `cost` from the call cost reader (the judge billed). On success return `JudgeVerdict` with `preference` from `unmask_preference(verdict.preference, real_is_a)`, `confidence` clamped to 0..1 and the call cost.

  Pure helpers, all exposed as `pub(crate)` functions so they can be tested and compared against LiteLLM on their own. `unmask_preference(raw, real_is_a)` trims and lower-cases `raw`; `a` gives `real` when `real_is_a` else `shadow`, `b` gives `shadow` when `real_is_a` else `real`, anything else gives `tie`. `tool_definitions_text(tools)` returns the empty string unless `tools` is a JSON array; it skips string entries, uses each entry's `function` object, else its `custom` object, else the entry itself, and renders one line `- {name}: {description}` with `unnamed` and `no description` when missing or empty, then returns `Tools available to both responses:` plus a newline plus the lines joined by a newline, cut to 2,000 characters (count characters, not bytes). No lines means the empty string. `judge_user_prompt(conversation, a, b, tool_definitions)` cuts each reply to 8,000 characters, builds `prefix` as the tool text plus two newlines (empty when there is no tool text), gives the conversation `24000 - len(a) - len(b) - len(prefix)` characters and keeps the END of the conversation, and returns `{prefix}Conversation:\n{conversation tail}\n\nResponse A:\n{a}\n\nResponse B:\n{b}\n\nWhich response is better?`. `forwarded_team_id(metadata)` returns `user_api_key_team_id` only when it is a non-empty string.

  `PAIRWISE_JUDGE_RESPONSE_FORMAT` is the exact value LiteLLM's `type_to_response_format_param(PairwiseVerdict)` returns (`type: json_schema`, `json_schema.name: PairwiseVerdict`, `strict: true`, and the strict schema with `additionalProperties: false`, both fields required, `preference` as an `enum` of `A`, `B`, `tie` and `confidence` as a `number`). Write it as a constant in Rust and prove it against the Python function with an oracle case; do not port pydantic.

  Out of this task: choosing arms, gating budgets, writing attempt rows, and the loop over arms (B4085); the job and attempt storage (B4083); response readers, cost and failure text (B4081, used here).
