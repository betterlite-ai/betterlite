id: B3883
title: Prometheus request budget lookups
description: >-
  Resolve per-request budget records from carried snapshots (provided in the auth context)
  first, and fall back to pinned cache/database lookups second. Preserve cache-only key
  reads (check_cache_only=true), normal cached user/team reads through the shared
  UserApiKeyCache interface, organization budget joins through get_org_object, and customer
  cache misses that emit nothing.

  The four async functions handle per-entity per-request budget metric emission after
  a deployment call completes:

  _set_team_budget_metrics_after_api_request calls _assemble_team_object to construct
  a LiteLLM_TeamTable with accumulated spend (prior spend + response_cost) and budget
  details, then delegates to _set_team_budget_metrics (owned by B3882) to emit the actual
  gauge updates. When a TeamBudgetSnapshot is carried, use its budget_reset_at directly;
  otherwise fetch team info via get_team_object and read budget_reset_at, filling max_budget
  from carried value only if the fetched max_budget is None.

  _set_org_budget_metrics_after_api_request uses the carried OrgBudgetSnapshot when present,
  reading its spend and max_budget directly with budget_reset_at explicitly set to None
  (not carried). When no snapshot, call get_org_object with include_budget_table=True and
  extract max_budget and budget_reset_at from org_info.litellm_budget_table; then delegate
  to _set_org_budget_metrics (owned by B3882). Skip silently (return) when org_id is None
  or the database client is None.

  _set_customer_budget_metrics_after_api_request is gated by two litellm config keys: when
  litellm.enable_end_user_cost_tracking_prometheus_only is not True (default None) OR
  litellm.disable_end_user_cost_tracking is True (default None), return immediately without
  any lookup. When enabled, read the cache-only path: call user_api_key_cache.async_get_cache
  with end_user_cache_key(end_user_id) and type LiteLLM_EndUserTable. On cache miss, return
  without emitting (cache-miss behavior preserved). On hit, read spend from cached_customer.spend
  (add response_cost), read max_budget from cached_customer.litellm_budget_table.max_budget,
  but always pass budget_reset_at=None to _set_customer_budget_metrics (owned by B3882),
  never reading budget_reset_at from the cached budget table even when present. Also expose
  _get_default_customer_budget, which looks up the default customer budget by litellm.max_end_user_budget_id,
  returning None on error or when the id is None.

  _set_api_key_budget_metrics_after_api_request calls _assemble_key_object to construct
  a UserAPIKeyAuth with accumulated spend and budget details, then delegates to _set_key_budget_metrics
  (owned by B3882). When a KeyBudgetSnapshot is carried, use its budget_reset_at directly.
  Otherwise, call get_key_object with check_cache_only=True to read from cache only
  (skipping database); read budget_reset_at from the fetched key_object if present. Always
  return a UserAPIKeyAuth object with spend filled and budget_reset_at set (from carried or
  fetched key, or None).

  _assemble_user_object mirrors _assemble_team_object: construct a LiteLLM_UserTable with
  accumulated spend and budget details. When a UserBudgetSnapshot is carried, use its
  budget_reset_at and user_alias directly; fill max_budget from carried value only if
  the fetched max_budget is None. Otherwise call get_user_object with check_db_only=False
  (cache-first behavior, not db-only) and user_id_upsert=False. Read budget_reset_at,
  user_email and user_alias from the fetched user_info when present, always returning a
  LiteLLM_UserTable object with all fields set or None.

  Each function returns early with silent failures (returning/no-op when gauge metrics
  are NoOpMetric or required identifiers are None), never raising exceptions from database
  or cache operations; a debug log records skipped lookups.

