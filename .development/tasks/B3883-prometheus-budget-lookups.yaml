deviations:
  - what: Key object assembly calls get_key_object with check_cache_only=True to skip database lookups.
    why: LiteLLM's key lookup always performs cache-only reads in metrics context to avoid the latency spike
      documented in _assemble_user_object's comment. Betterlite enforces the same constraint in key assembly.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4366-L4372
  - what: Customer budget metrics read only from cache and skip silently on cache miss, emitting no gauge update.
    why: LiteLLM implements the same cache-only read with miss behavior for customer/end-user budget metrics,
      preserving the precondition that end-user identity must be present in the request context.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4200-L4209
  - what: Customer budget metrics are disabled by default when litellm.enable_end_user_cost_tracking_prometheus_only
      is None (default) or litellm.disable_end_user_cost_tracking is True (default). The lookup is skipped
      when the compound gate _customer_budget_metrics_enabled() returns false.
    why: Customer budget metrics require opt-in through cost-tracking settings, with two config keys controlling
      the behavior. By default, both are falsy (None or False), disabling the entire customer budget path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L161-L162
  - what: Customer budget cache-hit path always passes budget_reset_at=None to the setter, never reading it
      from cached_customer.litellm_budget_table. Team/org/user/key paths read budget_reset_at from the
      fetched object.
    why: LiteLLM explicitly hardcodes budget_reset_at=None for the customer cache hit path (line 4216),
      unlike team/user/org which read it from the fetched object. This is not a bug; the customer budget
      table may not expose reset time from the end-user cache view.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4211-L4217
  - what: Org budget metrics after request set budget_reset_at to None when using a carried snapshot,
      not carried.budget_reset_at.
    why: LiteLLM explicitly passes budget_reset_at=None to _set_org_budget_metrics when the request carries
      an org snapshot, differentiating org handling from user/team which preserve carried.budget_reset_at.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4093-L4100

out_of_scope:
  - Gauge metric emission and label construction; that is owned by B3882. The helper
    functions `_customer_budget_gauges_are_noop()` (prometheus.py:4230) and
    `_customer_budget_metrics_enabled()` (prometheus.py:161), which gate the per-request
    lookups at line 4190, are owned by B3882.
  - Authorization, billing rate calculation or budget enforcement; this task only reads values.
  - Async orchestration and callback registration; that is in B111.
  - Configuration loading of cache settings, database retry policies or timeouts.

pitfalls:
  - >-
    Customer budget metrics are disabled by default because both litellm.enable_end_user_cost_tracking_prometheus_only
    (default None) and litellm.disable_end_user_cost_tracking (default None) are falsy. The entire customer lookup
    is skipped unless both conditions enable it. Most deployments emit no customer budget metrics.
  - >-
    Customer budget cache-hit path always passes budget_reset_at=None, never reading it from the cached budget
    table. Do not assume the customer path mirrors team/user/org behavior; budget_reset_at is explicitly None.
  - >-
    Calling get_user_object with check_db_only=True was found to cause huge latency increases and CPU spikes
    in production. The call must use check_db_only=False for cache-first behavior.
  - >-
    Team and user assembly fill max_budget from the database only when the current value is None; this preserves
    the priority: carried value > database value. Do not overwrite a non-None value.
  - >-
    Org budget assembly with carried snapshot explicitly sets budget_reset_at=None (not carried), differentiating
    it from team/user behavior. The call to _set_org_budget_metrics always passes budget_reset_at=None in the
    carried path.
  - >-
    Customer budget metrics read from cache only; there is no fallback to database/get_end_user_object. A cache miss
    returns silently without emitting any gauge.
  - >-
    Default customer budget lookup reads litellm.max_end_user_budget_id, which may be None or unset. Always check
    before attempting the lookup.
  - >-
    All five functions log at debug level on error, never raising exceptions from cache/database operations.
    Exceptions are caught, logged, and the function returns with partial/no emission.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
