dod:
  - text: Team budget metrics after request use carried snapshot's budget_reset_at directly when present,
      otherwise fetch via get_team_object and read from team_info.budget_reset_at, filling max_budget
      only when the current max_budget is None.
    proof: [team-budget-lookups]
  - text: Team object assembly returns a LiteLLM_TeamTable with accumulated spend (prior spend + response_cost)
      and all budget fields populated from carried snapshot or database fetch.
    proof: [team-budget-lookups]
  - text: Org budget metrics after request with carried snapshot set spend to carried.spend + response_cost,
      max_budget to carried.max_budget, and budget_reset_at to None (not carried).
    proof: [org-budget-lookups]
  - text: Org budget metrics after request without carried snapshot fetch via get_org_object with
      include_budget_table=True and extract max_budget and budget_reset_at from litellm_budget_table,
      returning early when org_id is None or when prisma_client is None.
    proof: [org-budget-lookups]
  - text: Customer budget metrics after request check litellm.enable_end_user_cost_tracking_prometheus_only
      and litellm.disable_end_user_cost_tracking (defaults None) before any lookup; when either guard fails,
      return without fetching. When enabled, read only from cache via user_api_key_cache.async_get_cache
      with end_user_cache_key, skip silently on cache miss (no emission), read max_budget from
      cached_customer.litellm_budget_table, and add response_cost to cached_customer.spend before delegating
      to _set_customer_budget_metrics with budget_reset_at=None (never from budget_table).
    proof: [customer-budget-lookups, customer-config-gate, customer-budget-reset-at-none]
  - text: _get_default_customer_budget reads litellm.max_end_user_budget_id, returns None when the id
      is None or on lookup error, and otherwise returns the _JoinedBudgetRow via BudgetRepository.table.find_unique.
    proof: [customer-default-budget]
  - text: API key budget metrics after request with carried snapshot use carry.budget_reset_at directly,
      otherwise call get_key_object with check_cache_only=True and read budget_reset_at from key_object
      when present, returning a UserAPIKeyAuth with accumulated spend always set.
    proof: [key-budget-lookups]
  - text: Key object assembly returns a UserAPIKeyAuth with accumulated spend (prior spend + response_cost)
      and budget_reset_at populated from carried snapshot or cache-only fetch (never database).
    proof: [key-budget-lookups]
  - text: User budget metrics after request with carried snapshot use carried.budget_reset_at and
      carried.user_alias directly, and fill max_budget only when the fetched max_budget is None.
    proof: [user-budget-lookups]
  - text: User object assembly with no carried snapshot calls get_user_object with check_db_only=False
      (cache-first, not db-only) and user_id_upsert=False, returning a LiteLLM_UserTable with budget_reset_at,
      user_email and user_alias populated from fetched user_info when present.
    proof: [user-budget-lookups]
  - text: >-
      Each of the four per-request functions returns early (no-op) when the gauge metric is a NoOpMetric,
      when the required identifier (user_api_team, org_id, end_user_id, user_api_key, user_id) is None,
      and logs at debug level on cache/database errors without raising.
    proof: [budget-lookup-early-returns]
  - text: >-
      Customer budget metrics are gated by two config keys with AND logic: the lookup is skipped when
      litellm.enable_end_user_cost_tracking_prometheus_only is not True (default None) OR
      litellm.disable_end_user_cost_tracking is True (default None). Both default to None, disabling
      customer budget metrics by default.
    proof: [customer-config-gate]
  - text: >-
      Customer budget cache-hit path always passes budget_reset_at=None to the setter, never reading it
      from cached_customer.litellm_budget_table even when the value is present. This is distinct from
      team/user/org paths which read budget_reset_at from the fetched object.
    proof: [customer-budget-reset-at-none]

