dod:
- text: ProxyStreamHooks forwards the two flags, the iterator wrap, the chunk hook, the failure hook and the deferred logging fire to B8390, B6370, B8394 and B8395, converting Chunk, Bytes and Text items both ways in their places without losing hidden params, so raw frames reach the guardrails.
  proof: [generator-port-tests]
- text: ResponsesErrorStates hands out a fresh B937 state per stream, and the builder passes B8611's RouterView as the keepalive router, or None when no router is held.
  proof: [generator-port-tests]
- text: stream_generator builds a working generator with azure_router_check, the B10023 keepalive setting and the B8602 expose flag.
  proof: [generator-port-tests]
checks:
  optional: []
  commands:
  - id: generator-port-tests
    why: a hook adapter, the error state source, the keepalive router, the router check or the builder is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::stream_generator::/)'
oracle_cases: []
deviations: []
out_of_scope:
- "The generator, the chunk helpers and the keepalive resolver: B8604, B8602 and B8603. The hooks behind the ports: B8390, B6370, B8394, B8395 and B937."
- "The StreamCleanup implementation, the stream snapshot and the chat route that uses the builder: B8633."
- "The KeepaliveRouter implementation and its B844 lookups: B8611's RouterView. The stale-id rule that never falls back to the model group: B8603."
pitfalls:
- 'B8390 names the per-chunk predicate needs_per_chunk_streaming_hook while the port method is needs_per_chunk_hook; map the names, do not add a second predicate.'
- 'B8395''s failure hook pops litellm_logging_obj and standard_logging_object from its map, so pass a clone or the generator''s later cleanup sees a stripped request.'
- 'A Bytes item must reach B6370''s wrapper as Bytes and a Text item as Json(Text): passing either around the wrapper hides an Anthropic or Google frame from every guardrail, and turning Bytes into Text makes the Anthropic adapter skip it.'
- 'GuardrailValue::Object is a BTreeMap, so a Chunk comes back with its keys sorted; the oracle compares SSE data as parsed JSON (tools/oracle/src/http.rs L136-L148), so only the order changes.'
- 'RouterCheck is a plain fn pointer, so azure_router_check cannot capture config; if B562''s function needs B2230 settings, read them inside the function from its own crate, not from a closure.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
