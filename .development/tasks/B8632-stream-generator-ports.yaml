id: B8632
title: SSE data generator ports and builder
description: >-
  B8604 builds `SseDataGenerator<Key>` (crates/betterlite-server/src/sse_data_generator.rs), LiteLLM's async_data_generator, against ports it declares: `StreamHooks<Key>`, `ErrorStateSource` and `StreamErrorState`, and B8603's `KeepaliveRouter`, plus three constructor values, the global keepalive setting, `expose_fallback_errors` and the `RouterCheck`. This task implements the hook and error-state ports over the real code, passes B8611's RouterView as the KeepaliveRouter, and adds one builder that the streaming routes call. Code goes in crates/betterlite-server, module `app::inference::stream_generator` (crates/betterlite-server/src/app/inference/stream_generator.rs and stream_generator/: hooks.rs, error_state.rs, tests.rs). Add `betterlite-foundry = { path = "../betterlite-foundry" }` to crates/betterlite-server/Cargo.toml for B562. Every name stays at 30 characters or fewer.


  `ProxyStreamHooks` implements `StreamHooks<Key>` over `state.shared.proxy_logging` (B8399's ProxyLogging, added to Shared by the foundation part B8612). `Key` is the authenticated caller type that B8394's chunk hook takes as its user_api_key_dict. needs_iterator_wrap and needs_per_chunk_hook return B8390's `needs_iterator_wrap` and `needs_per_chunk_streaming_hook` predicates (crates/betterlite-server/src/guardrails/callback_caps/caps.rs) for the callbacks ProxyLogging holds. wrap_iterator calls B6370's `ProxyStreamWrapper::wrap` (guardrails/proxy_stream_wrapper/chain.rs). That wrapper streams B10169's guardrail `StreamItem` (betterlite_core::guardrails::streaming_rewrite::shapes), so convert every generator item on the way in and back on the way out, each in its place. Going in, a `stream_chunks::StreamItem::Chunk` becomes `Json(Object)` of its body with `_hidden_params` set from `hidden`, `Bytes` becomes `Bytes` and `Text` becomes `Json(Text)`. Coming out, `Json(Object)` becomes a Chunk with `_hidden_params` moved back into `hidden` and the ChunkKind of the latest Chunk that went in (Plain when none did, as a guardrail's own dict is), `Bytes` becomes `Bytes`, `Json(Text)` becomes `Text`, and any other Json value is a StreamFailure with kind Other that names it. Raw frames go through the guardrails and never around them, since LiteLLM's iterator hook gets the bytes of a /v1/messages or Google stream (streaming_iterator.py L375, google_endpoints/endpoints.py L109-L112). A wrapper error becomes a StreamFailure with kind Other and the error's message. chunk_hook calls B8394's `post_call_streaming_chunk(data, response, user_api_key_dict, str_so_far)` (guardrails/post_call_hooks/chunk.rs) with the same conversion. failure_hook calls B8395's `post_call_failure_hook` (failure_hook/hook.rs) on a clone of the request data, since that hook removes litellm_logging_obj and standard_logging_object from the map it gets; build its error from the StreamFailure (message, type, param and status code) and map its error back to a StreamFailure. fire_deferred_stream_logging calls B6370's `serve_log::fire(request_data)`.


  `ResponsesErrorStates` implements `ErrorStateSource`: new_state returns a fresh B937 `ResponsesStreamErrorState` (betterlite-core api::responses_stream_errors) built with the system clock and UUID source B937 takes, wrapped in an adapter that implements `StreamErrorState` by passing the item's chunk JSON to observe_chunk and the failure's fields to format_failure. This task writes no KeepaliveRouter of its own: B8611's `RouterView` already implements B8603's `KeepaliveRouter` over B844's get_deployment and get_model_list. The builder calls `state.shared.router_views.current()` (B8610's `Arc<RouterViews>`) once per stream and passes the view as the generator's `Arc<dyn KeepaliveRouter>`.


  Values. The router check is a plain function `azure_router_check(model: &str) -> bool` in this module that calls B562's is_model_router_call in crates/betterlite-foundry/src/model_router.rs with the model name and no hidden params, and it is passed as B8602's `RouterCheck`. The global keepalive setting is read from B10023's `assistant_keepalive` section (config.sections.assistant_keepalive, LiteLLM's litellm_settings.sse_keepalive_ping_interval_seconds, default none), an `Option<PingSetting>` already (B10023 moved B7324's type into that section), passed on as is. `expose_fallback_errors` is `config.sections.fallback_errors.expose_to_caller` from B8602.


  Builder. `stream_generator(state: &ServerState, cleanup: Arc<dyn StreamCleanup<Key>>) -> SseDataGenerator<Key>` builds the generator with ProxyStreamHooks, ResponsesErrorStates, the router view (None when current() finds no router, as LiteLLM's llm_router is None), the three values and the cleanup the caller passes, since the cleanup holds per-request logging (B8633 builds it). Tests in stream_generator/tests.rs drive the generator from the builder with scripted item streams and check that a per-chunk hook from a configured callback edits the chunk, that the iterator wrap runs when a callback asks for it, that a Chunk, a Bytes and a Text item come back from the wrapper in their places with their kinds and hidden params, that a failure reaches the failure hook with an unchanged request map on the caller's side, that a Responses error state formats a failure, that the generator gets no keepalive router when the handle holds none and B8611's view when it holds one, and that azure_router_check answers true for "model-router" and false for "gpt-4o". The chat route proves the generator over HTTP in B8633.
