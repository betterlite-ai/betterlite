id: B872
title: Native database fault classification
description: >-
  Implement DbFault classification from SQLSTATE and preserved transport causes. Distinguish permanent
  schema/data errors, deadlocks, read-only transactions, unavailable services and reconnectable transport
  failures. B1217 reads the outage policy and B757 builds fallback identities; this module reads no
  configuration and grants no access. Keep connection, infrastructure, data and transport predicates
  separate. Connection accepts DB_CONNECTION_ERROR_TYPES, DBLookupDeadlineExceeded, EngineConnectionError
  and no_db_connection ProxyException. Infrastructure excludes DataError, UniqueViolationError,
  ForeignKeyViolationError, MissingRequiredValueError, RawQueryError, TableNotFoundError and
  RecordNotFoundError, but accepts transport, other PrismaError and no_db_connection. Base DataError
  is an exact-type test, excluding its subclasses; P1001 can still be a base data error.

  Transport accepts the transport types, ClientNotConnectedError, HTTPClientClosedError and
  no_db_connection. Only PrismaError messages additionally recognize "can't reach database server",
  "cannot reach database server", "can't connect", "cannot connect", "connection error",
  "connection closed", "timed out", "timeout", "connection refused", "network is unreachable",
  "no route to host" and "broken pipe", case-insensitively. Preserve those categories in the Python
  oracle; native driver errors use typed causes, not arbitrary text matching. Deadlocks require a
  Prisma error plus P2034 or the phrases "deadlock detected", "40p01", "write conflict or a deadlock".
  Read-only recognition likewise requires PrismaError and quoted 25006 or "read-only transaction".
  SQLSTATE extraction accepts only DataError: prefer a string meta.code, otherwise extract the first
  five uppercase alphanumeric characters in the exact PostgresError connector format. Non-Prisma
  engine-internal failures require a traceback module starting prisma.engine. A permanent fault is
  infrastructure that is neither connection nor transport. _exception_types drops non-exception classes.

  call_with_db_reconnect_retry returns the first read immediately on success. Retry only transport
  failures admitted by retry_safe_error_types (None admits all), and only with an available reconnect
  collaborator. Resolve each timeout independently from explicit argument, then client attribute, then
  2 seconds for reconnect or 0.1 seconds for lock acquisition; bools, strings and mocks fall back,
  while numeric values pass through. Warn before reconnect, forwarding reason and both timeouts.
  False reconnect rethrows the first error; raised reconnect warns again and retains the first error
  with the reconnect failure as cause. True reconnect invokes a fresh read exactly once; its result
  or error escapes without another reconnect. No SQL write or transaction is introduced.


  Build the production database_faults module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/exception_handler.py:
  _batch_postgres_sqlstate (L47-L51; 5 source lines), PrismaDBExceptionHandler.is_database_connection_error
  (L85-L112; 24 source lines), PrismaDBExceptionHandler.is_database_infrastructure_error (L115-L149; 32
  source lines), PrismaDBExceptionHandler.is_prisma_data_error (L152-L172; 18 source lines), PrismaDBExceptionHandler.is_database_transport_error
  (L175-L215; 39 source lines), PrismaDBExceptionHandler.is_prisma_error (L218-L221; 3 source lines),
  PrismaDBExceptionHandler.is_deadlock_error (L224-L237; 13 source lines), PrismaDBExceptionHandler.postgres_sqlstate
  (L240-L251; 11 source lines), PrismaDBExceptionHandler.is_read_only_transaction_error (L254-L263; 9
  source lines), PrismaDBExceptionHandler.is_prisma_engine_internal_error (L266-L292; 24 source lines),
  PrismaDBExceptionHandler.is_permanent_database_fault (L352-L365; 13 source lines), _coerce_timeout (L445-L451;
  7 source lines), _DBReconnectClient.attempt_db_reconnect (L460-L466; 7 source lines), call_with_db_reconnect_retry
  (L469-L590; 102 source lines), _exception_types (L54-L62; 8 source lines).


  Add the database_faults operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a database-faults-*
  seed to B171 helper_case, which already owns this decoder.


  Sizing: 183 nonblank, noncomment source lines after removing docstrings; allow
  250 production, 250 behavior tests, 80 helper adapters and 30 wiring lines, 610 within a 625-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  This component performs no SQL: test its cache/sink or SQLSTATE/transport inputs directly with typed
  collaborators. Real database execution belongs to B713-B715 and the mutation/repository owners; no fake
  Postgres row or rollback test is required here.
