dod:
  - text: 'Classify with rstest cases connection_allowlist, infrastructure_data_exclusions,
      base_data_exact_type, p1001_base_data, transport_keyword_matrix, unrelated_message_not_transport,
      deadlock_code_and_phrases, read_only_code_and_phrase, meta_code_precedes_batch,
      malformed_meta_batch_fallback, batch_uppercase_five_chars, nondata_no_sqlstate,
      engine_traceback_origin, known_prisma_not_engine_internal, permanent_excludes_transient
      and exception_classes_only.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'Exercise read_success, data_no_reconnect, unsafe_transport_no_replay, absent_reconnect,
      timeout_argument_attribute_defaults, timeout_bool_string_fallback, numeric_timeout_passthrough,
      reconnect_warning_arguments, reconnect_false_preserves_first, reconnect_raise_chains_first,
      retry_success and retry_failure_no_loop with ordered effects in the helper oracle.'
    proof: [behavior-tests, oracle, helper-python]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/database_faults.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-faults-*")"
        && grep -rlq "database_faults" tools/oracle/fuzz/corpus/helper_case/database-faults-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
