dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: permanent_fault_no_retry,
      data_error_not_outage, deadlock_sqlstate, allow_outage_flag.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/database_faults.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-faults-*")"
        && grep -rlq "database_faults" tools/oracle/fuzz/corpus/helper_case/database-faults-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_faults::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-faults-*")"
        && grep -rlq "allow_requests_on_db_unavailable" crates/betterlite-config/fuzz/corpus/config_yaml/database-faults-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/database-faults/permanent-fault-no-retry.yaml
  - tools/oracle/cases/helpers/database-faults/data-error-not-outage.yaml
  - tools/oracle/cases/helpers/database-faults/deadlock-sqlstate.yaml
  - tools/oracle/cases/helpers/database-faults/allow-outage-flag.yaml
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - 'litellm/proxy/db/exception_handler.py: B1217 owns _exception_chain (L29-L36), _database_service_unavailable_errors
    (L39-L44), PrismaDBExceptionHandler.should_allow_request_on_db_unavailable (L71-L82), PrismaDBExceptionHandler.is_database_service_unavailable_error
    (L295-L349), PrismaDBExceptionHandler.database_unavailable_message (L368-L381), PrismaDBExceptionHandler.service_unavailable_proxy_exception
    (L384-L390), PrismaDBExceptionHandler.find_database_service_unavailable_error_in_chain (L393-L403),
    PrismaDBExceptionHandler.is_database_service_unavailable_error_in_chain (L406-L419), PrismaDBExceptionHandler.handle_db_exception
    (L422-L435).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - A data error is not a connection outage and must never enable the restricted fallback token.
budget:
  max_changed_lines: 625
  max_new_expects: 0
review_level: security
