id: B872
title: Native database fault classification
description: >-
  Implement DbFault classification from SQLSTATE and preserved transport causes. Distinguish permanent
  schema/data errors, deadlocks, read-only transactions, unavailable services and reconnectable transport
  failures. Preserve allow_requests_on_db_unavailable=false as a typed policy input; the authenticated
  fallback identity is owned by B757. Do not emulate Prisma exception names using arbitrary substring
  matching.


  Build the production database_faults module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/exception_handler.py:
  _batch_postgres_sqlstate (L47-L51; 5 source lines), PrismaDBExceptionHandler.is_database_connection_error
  (L85-L112; 24 source lines), PrismaDBExceptionHandler.is_database_infrastructure_error (L115-L149; 32
  source lines), PrismaDBExceptionHandler.is_prisma_data_error (L152-L172; 18 source lines), PrismaDBExceptionHandler.is_database_transport_error
  (L175-L215; 39 source lines), PrismaDBExceptionHandler.is_prisma_error (L218-L221; 3 source lines),
  PrismaDBExceptionHandler.is_deadlock_error (L224-L237; 13 source lines), PrismaDBExceptionHandler.postgres_sqlstate
  (L240-L251; 11 source lines), PrismaDBExceptionHandler.is_read_only_transaction_error (L254-L263; 9
  source lines), PrismaDBExceptionHandler.is_prisma_engine_internal_error (L266-L292; 24 source lines),
  PrismaDBExceptionHandler.is_permanent_database_fault (L352-L365; 13 source lines), _coerce_timeout (L445-L451;
  7 source lines), _DBReconnectClient.attempt_db_reconnect (L460-L466; 7 source lines), call_with_db_reconnect_retry
  (L469-L590; 102 source lines), _exception_types (L54-L62; 8 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): allow_requests_on_db_unavailable=False.


  Add the database_faults operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a database-faults-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::database_faults::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 315 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  315 production, 148 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 608 changed lines estimated within a 625-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  This component performs no SQL: test its cache/sink or SQLSTATE/transport inputs directly with typed
  collaborators. Real database execution belongs to B713-B715 and the mutation/repository owners; no fake
  Postgres row or rollback test is required here.
