id: B1141
title: Fine-tuning cancellation and provider configuration
description: >-
  Own complete cancel/acancel_fine_tuning_job in core::api::fine_tuning_cancel_call and complete
  set_fine_tuning_config/get_fine_tuning_provider_config in server::api::fine_tuning_provider_config.
  B518/B542 execute OpenAI/Azure cancellation, B010 builds GenericLiteLLMParams, B012 owns @client and
  B2487 supplies resource settings/timeout policy. Add FineTuningCancel to B2401 for SDK HTTP and
  FineTuningProviderConfig to B171 for pure ordered config lookup. These are separate adapters.

  Top-level finetune_settings defaults null, accepts an ordered list and resolves immediate string values
  starting os.environ/ through B002. Null setter leaves an existing configuration intact. Replace Python
  globals with an injected snapshot shared by Config and route lookup. Required job id has no default;
  custom_llm_provider=openai, extra_headers/extra_body=null. The 149 owned function lines plus one config
  initializer budget 210 implementation, 165 tests, 135 adapters, 110 fixtures and 70 config/corpus/wiring, 690
  total. Reuse B002/B171/B2401 decoders and B518 response records, without adding a parser.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/fine_tuning_cancel_call.rs
  - crates/betterlite-core/src/api/fine_tuning_cancel_call/**
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/fine_tuning_provider_config.rs
  - crates/betterlite-server/src/api/fine_tuning_provider_config/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/fine_tuning_provider_config.rs
  - crates/betterlite-config/fuzz/corpus/config_yaml/finetune-settings-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/fine_tuning_cancel.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/fine_tuning_cancel.py
  - tools/oracle/src/helpers/core_ops/fine_tuning_cancel_call.rs
  - tools/oracle/src/helpers/core_ops/fine_tuning_cancel_call/**
  - tools/oracle/helpers/fine_tuning_cancel_call.py
  - tools/oracle/helpers/fine_tuning_cancel_call/**
  - tools/oracle/cases/sdk-http/fine-tuning-cancel/**
  - tools/oracle/cases/helpers/fine-tuning-provider-config/**
  - tools/oracle/fuzz/corpus/sdk_http_case/fine-tuning-cancel-*
  - tools/oracle/fuzz/corpus/helper_case/fine-tuning-provider-config-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/fine_tuning/main.py#L333-L481
  why: Whole cancellation wrappers support OpenAI/Azure, preserve context and discard public extras.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/fine_tuning_endpoints/endpoints.py#L28-L59
  why: The setter resolves shallow secret references and lookup returns the first matching provider.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6951-L6953
  why: Startup reads finetune_settings, not fine_tuning_config.
dod:
- text: >-
    cancel_job_sdk sends ft_a in both modes and expects POST /v1/fine_tuning/jobs/ft_a/cancel without caller
    extras; mock status=cancelled and all job fields return. Azure sends api-version and B542 maps
    canceling/canceled->cancelled. Only OpenAI receives the supplied client. True-only async flag and copied
    context reach execution. Timeout null/0 falls back to 600, timeout=0/request_timeout=5->5,"7.5"->7.5;
    structured OpenAI/Azure timeout is preserved and max_retries passes through. B2487's base/key/organization/
    version precedence is observed at HTTP. The reassigned Azure extra_body drops azure_ad_token; no token
    or public extra_headers/extra_body reaches provider payload or auth from these arguments.
  proof: [cancel-tests, oracle, sdk-python]
- text: >-
    cancellation_unsupported_provider tries vertex_ai and null. No HTTP; BadRequestError,400,
    type/param/code=null, source message="LiteLLM doesn't support vertex_ai for 'create_batch'. Only 'openai' is supported."
    (null formats None), response body="Unsupported provider",method=create_thread. Invalid timeout="bad"
    fails before dispatch. Mock provider 404 maps to NotFoundError,404,type/param/code=null through B011's
    decorated SDK boundary; this is not the proxy's internal_server_error envelope.
  proof: [cancel-tests, oracle, sdk-python]
- text: >-
    finetune_config_order_and_secrets sets [{custom_llm_provider:azure,api_key:os.environ/AZURE_TEST},
    {custom_llm_provider:azure,api_key:second}] with AZURE_TEST=first. Lookup returns the complete first map
    with key=first. Nested secret references and strings not beginning os.environ/ are untouched. Non-dict
    list elements are stored; lookup reaching one raises source AttributeError instead of skipping it.
    Missing provider returns null; [] is configured-but-empty; set null preserves an existing list. Wrong
    top-level shape raises ValueError "invalid fine_tuning config, expected a list is not a list"; lookup
    before setup raises ValueError "fine_tuning_config is not set, set it on your config.yaml file.".
  proof: [config-behavior, oracle, helper-python]
- text: >-
    loads_finetune_settings loads unset/null,[],two provider entries and shallow secret references through
    production Config, then queries the resulting state. Scalar/map instead of list fails startup naming
    finetune_settings and the validation reason; accepted fields are not reported unsupported. Add config,
    helper and SDK seeds and keep credentials out of diagnostics.
  proof: [config-loader, config-corpus, operation-corpora]
checks:
  optional: [mutants]
  commands:
  - id: cancel-tests
    why: cancellation defaults and provider dispatch are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::fine_tuning_cancel_call::tests::/) - test(/::replays_corpus$/)'
  - id: config-behavior
    why: config lookup loses order, null-set behavior or secret resolution
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_provider_config::tests::/) - test(/::replays_corpus$/)'
  - id: config-loader
    why: the actual finetune_settings key is not accepted by Config
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::fine_tuning_provider_config::tests::loads_finetune_settings($|::)/)'
  - id: sdk-python
    why: cancellation lacks an independent pinned SDK execution
    run: test -f tools/oracle/sdk_http/fine_tuning_cancel.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: helper-python
    why: config cases lack an independently called source helper
    run: test -f tools/oracle/helpers/fine_tuning_provider_config.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: config-corpus
    why: no new config input covers finetune_settings
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/finetune-settings-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: operation-corpora
    why: one new operation has no parser seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/fine-tuning-provider-config-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/fine-tuning-cancel-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus) | test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/fine-tuning-cancel/cancel-job-sdk.yaml
- tools/oracle/cases/sdk-http/fine-tuning-cancel/cancellation-unsupported-provider.yaml
- tools/oracle/cases/helpers/fine-tuning-provider-config/finetune-config-order-and-secrets.yaml
deviations: []
out_of_scope:
- B1052 owns SDK create, B1053 reads, B2487 timeout capability/settings and its finite-duration deviation.
- B088 and its split own create/read HTTP routes; B1054 cancellation HTTP. This task registers no routes.
pitfalls:
- 'The oracle helper for this task is pre-registered as fine_tuning_cancel_call in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/fine_tuning_cancel_call.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/fine_tuning_cancel_call.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- finetune_settings=null leaves previous configuration intact.
- Lookup returns the first matching provider and can fail on an earlier non-dict entry.
- vertex_ai appears in the cancellation annotation but has no dispatch branch.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
