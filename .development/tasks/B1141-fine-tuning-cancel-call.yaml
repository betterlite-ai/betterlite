id: B1141
title: Fine tuning cancel call and settings
description: >-
  Implement native fine-tuning cancellation and finetune_settings provider resolution below all fine-tuning routes;
  stored file-ID resolution stays in their route adapters.


  Implement crates/betterlite-core/src/api/fine_tuning_cancel_call.rs. Use FineTuningCancelCallInput and FineTuningCancelCallResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions fine_tuning_config_default, cancel_job, cancel_job_missing under api::fine_tuning_cancel_call::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): finetune_settings
  defaults to None or provider-record list; os.environ/NAME resolves through the supplied environment; litellm_settings.api_base
  defaults to None; env.OPENAI_BASE_URL defaults to unset (None); env.OPENAI_API_BASE defaults to unset (None);
  litellm_settings.organization defaults to None; env.OPENAI_ORGANIZATION defaults to None; litellm_settings.api_key
  defaults to None; litellm_settings.openai_key defaults to None; env.OPENAI_API_KEY defaults to unset (None); env.AZURE_API_BASE
  defaults to unset (None); litellm_settings.api_version defaults to None; env.AZURE_API_VERSION defaults to unset
  (None); litellm_settings.azure_key defaults to None; env.AZURE_OPENAI_API_KEY defaults to unset (None); env.AZURE_API_KEY
  defaults to unset (None). No environment reads occur outside betterlite-config. Test api::fine_tuning_cancel_call::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FineTuningCancelCall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {fine_tuning_cancel_call: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/fine_tuning/main.py: acancel_fine_tuning_job (L334-L368); litellm/fine_tuning/main.py:
  cancel_fine_tuning_job (L372-L481); litellm/proxy/fine_tuning_endpoints/endpoints.py: set_fine_tuning_config (L32-L46);
  litellm/proxy/fine_tuning_endpoints/endpoints.py: get_fine_tuning_provider_config (L50-L59). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 141 owned nonblank/non-comment/non-docstring Python lines (148 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 161 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 75 config tests/seeds and
  30 wiring; 450 total within the 450-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B011 (Exception
  types and provider error mapping), B518 (OpenAI fine-tuning jobs), B002 (Load LiteLLM config.yaml into typed config),
  B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
