oracle_cases: []

deviations:
  - what: Failed decryption of global env vars logs a warning and clears the value (sets to empty string).
    why: LiteLLM drops undecryptable global values to prevent sending ciphertext upstream; betterlite matches this behavior to avoid credential leaks.
  - what: Failed decryption of credentials returns the original encrypted value unchanged via return_original_value=true.
    why: LiteLLM's credentials fallback preserves the value, allowing callers to handle or retry; betterlite preserves this for forward compatibility.
  - what: _blank_to_none returns None for None input, not an error.
    why: Request payloads may include explicit None/null values; the normalizer must accept them to preserve client intent.
out_of_scope:
  - _mcp_server_table_actions (table-accessor factory belongs with B4711 table access and lock handling).
  - _verification_token_table_actions (no caller at the pin in production code).
  - _team_table_actions (no caller at the pin in production code).
  - _readable_mcp_servers (row decoding and secret-map error handling belong with B4711 server reads).
  - _db_find_user_env_var_rows (DB find helper belongs with B4711 table access).
  - NewMCPServerRequest and UpdateMCPServerRequest types are defined elsewhere (Q1).
  - MCPCredentials type is defined elsewhere (Q1).
pitfalls:
  - Global env var encryption uses the key "mcp_global_env_var"; credentials use field names as keys. Mixing them produces silent decode failures.
  - exclude_unset=true requires the original request's fields_set() to avoid overwriting stored values with defaults. Callers must pass fields_set or let the function read it from the request.
  - The alias field assignment by validate_and_normalize_mcp_server_payload marks alias as set even when the caller omitted it; the normalizer must drop it again if the original request did not include it.
  - Token-exchange columns in the Prisma schema are plaintext (identifiers/URLs, not secrets); values lift without encryption and must not be re-encrypted on rotation.
  - Client rotation (client_id/client_secret change) only clears minted tokens, not the new client fields themselves; a caller that provides partial credentials (e.g., only client_id) must build the merge before calling encrypt_credentials.
review_level: security

budget:
