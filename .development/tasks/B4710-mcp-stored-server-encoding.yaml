dod:
  - text: >-
      The blank_to_none helper converts whitespace-only and empty strings to None,
      with a case for non-string inputs.
    proof: [mcp-encoding-tests]
  - text: >-
      credential_auth_class collapses true_passthrough and oauth_delegate to
      "client_forwarded", else returns auth_type unchanged.
    proof: [mcp-encoding-tests]
  - text: >-
      drop_stale_minted_tokens drops access_token, refresh_token, expires_in when
      client_id or client_secret changes, preserving unchanged fields.
    proof: [mcp-encoding-tests]
  - text: >-
      is_global_env_var_scope returns true for scope values other than "user"
      (including None and missing scope), false only for explicit "user".
    proof: [mcp-encoding-tests]
  - text: >-
      encrypt_global_env_var_values encrypts scope=global env var values in place;
      per-user placeholders are left as-is.
    proof: [mcp-encoding-tests]
  - text: >-
      decrypt_global_env_var_values decrypts scope=global values in place, logs
      a warning and clears undecryptable values, accepts both MCPEnvVar models
      and plain dicts.
    proof: [mcp-encoding-tests]
  - text: >-
      decrypt_returned_row_env_vars parses JSON strings back to lists and calls
      decrypt_global_env_var_values, handles non-list and non-dict payloads
      gracefully.
    proof: [mcp-encoding-tests]
  - text: >-
      prepare_mcp_server_data with exclude_unset=true only includes
      caller-provided fields, special-cases alias and allowed_tools, handles JSON
      map field nulls, lifts token-exchange columns, encrypts credentials and
      env_vars, encrypts static_headers secret map, always writes is_byok=false
      on create.
    proof: [mcp-encoding-tests]
  - text: >-
      prepare_mcp_server_data with exclude_unset=false excludes None values, sets
      alias and is_byok if missing, serializes all JSON fields the same way.
    proof: [mcp-encoding-tests]
  - text: >-
      encrypt_credentials encrypts nine secret fields (auth_value, client_id,
      client_secret, client_private_key, aws_access_key_id,
      aws_secret_access_key, aws_session_token), leaves non-secret fields
      unchanged.
    proof: [mcp-encoding-tests]
  - text: >-
      credentials_blob_to_dict parses JSON strings or converts dicts to mutable
      dicts, handles parse errors gracefully.
    proof: [mcp-encoding-tests]
  - text: >-
      decrypt_credentials decrypts the same nine secret fields using the global
      salt key, returns the mutated dict.
    proof: [mcp-encoding-tests]
  - text: >-
      Every default, env var, config key, error, and warn-and-drop path a user
      can observe is in a named case with literal input and outcome.
    proof: [mcp-encoding-tests]
  - text: Every mutant in the encoding functions is caught by a test.
    proof: [mutants]
