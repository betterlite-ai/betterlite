id: B4710
title: MCP stored server encoding and secret fields
description: >-
  Build MCP server database encoding and credential/global-environment encryption in betterlite-db.
  LiteLLM's db.py module handles encrypted storage of MCP server configurations, particularly
  credentials and environment variables. This task ports the core encoding logic: preparing server
  data for storage, encrypting/decrypting credentials, handling global vs. per-user environment
  variables, and managing the different behaviors when decryption fails.

  Credentials (OAuth client IDs/secrets, API keys, auth values) are encrypted at rest with the
  global salt key. Global environment variables (scope != "user") are also encrypted, while
  per-user placeholders (scope == "user") are stored as-is. Failed decryption of global env vars
  logs a warning and clears the value so ciphertext is never sent upstream. Credentials tolerate
  silent failures and forward the original value.

  The `_prepare_mcp_server_data` function normalizes request payloads for create and partial update:
  exclude_unset preserves field presence during updates, explicit null clears stored values, and
  legacy token-exchange columns lift values from the credentials blob and strip them on write,
  ensuring the read-time fallback only serves pre-current-code rows. Blank values become None for
  sparse storage.

  When clients rotate the OAuth client (client_id/client_secret change), stale minted tokens
  (access_token, refresh_token, expires_in) are dropped so an old app's credentials never ride
  forward. Client-forwarded auth types (true_passthrough and oauth_delegate) share one stored
  credential shape, while cross-class changes (e.g., oauth2 row becoming a BYOK row) discard
  the old credentials entirely.
