id: B557
title: Foundry native Responses and Decisions
description: >-
  Add Foundry Responses and Decisions endpoint overrides over the shared OpenAI types and decision IR. Preserve
  configured API base requirements, host-specific authentication and absence of native websocket support. B080/B099
  install the corresponding public endpoints.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/responses/transformation.py:
  _responses_url L18-L22; AzureAIResponsesAPIConfig.custom_llm_provider L27-L28; AzureAIResponsesAPIConfig.validate_environment
  L30-L41; AzureAIResponsesAPIConfig.supports_native_websocket L43-L44; AzureAIResponsesAPIConfig.get_complete_url
  L46-L53. litellm/llms/azure_ai/decisions/transformation.py: AzureAIDecisionsConfig.missing_api_base_message L18-L19;
  AzureAIDecisionsConfig.get_complete_url L21-L24.


  Reuse AzureFoundryModelInfo.get_api_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AzureFoundryModelInfo.get_api_key from B549 (litellm/llms/azure_ai/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse api_key_header_for_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse get_azure_ai_auth_headers from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: foundry_responses_url: Resolve base through B549 or raise ValueError api_base is required
  for the Azure AI Foundry Responses API. Set the api_base parameter or the AZURE_AI_API_BASE environment variable.
  Split nonempty path segments; if first two are api,projects retain the first3 segments, else discard path; append
  openai/v1/responses and remove query, retaining fragment. Provider is azure_ai and native websocket support=False.
  responses_auth: Resolve params.api_key/base through B549 model-info accessors, choose host-specific api-key versus
  Authorization and allow Entra fallback; copy caller headers then overlay auth and Content-Type=application/json.
  Inherit request/response reasoning and status filtering from B544, not just the OpenAI base. decisions_route:
  Foundry Decisions inherits B099 BaseDecisionsConfig (SystemOne wire/IR), not B524 OpenAI decision conversion.
  Keys/base use AZURE_AI_API_KEY/AZURE_AI_API_BASE. Strip the optional trailing /api/projects/<project> plus optional
  /openai/v1,/openai,/models,/v1 suffix, then append /providers/microsoft/v1/systemone, removing query and fragment.
  Missing-base diagnostic is Missing AZURE_AI_API_BASE - set AZURE_AI_API_BASE or pass api_base, e.g. https://<resource>.services.ai.azure.com.


  Write standalone Rust test foundry_responses_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test foundry_responses_secret_safe_failure in betterlite-foundry: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-foundry/src/responses.rs with adjacent tests under responses/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation foundry_responses in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function responses_cases in betterlite-foundry with these exact named cases (one per oracle file):
  foundry_responses_url, responses_auth, missing_base, no_native_websocket, decisions_route. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_responses* using HelperCase: kind: helper
  and the externally tagged foundry_responses variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_foundry_responses that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 35 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 100 production lines, 175 behavior/config-test lines, 95 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 395 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-foundry/Cargo.toml
  - crates/betterlite-foundry/src/lib.rs
  - crates/betterlite-foundry/src/error.rs
  - crates/betterlite-foundry/src/responses.rs
  - crates/betterlite-foundry/src/responses/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/foundry_responses.rs
  - tools/oracle/src/helpers/foundry_responses/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/foundry_responses.py
  - tools/oracle/cases/helpers/providers/foundry-responses/**
  - tools/oracle/fuzz/corpus/helper_case/foundry_responses*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/responses/transformation.py#L18-L53
  why: Own _responses_url, AzureAIResponsesAPIConfig.custom_llm_provider, AzureAIResponsesAPIConfig.validate_environment,
    AzureAIResponsesAPIConfig.supports_native_websocket, AzureAIResponsesAPIConfig.get_complete_url. Other functions
    in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/decisions/transformation.py#L18-L24
  why: Own AzureAIDecisionsConfig.missing_api_base_message, AzureAIDecisionsConfig.get_complete_url. Other functions
    in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/decisions/transformation.py#L8-L16
  why: Exact suffix regex, SystemOne path and environment declarations.
