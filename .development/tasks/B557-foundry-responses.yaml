deviations: []
out_of_scope:
- B026 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Responses preserves the first project path while Decisions strips a trailing project path; they cannot share one
  endpoint normalizer.
- The Responses URL helper keeps a fragment even while clearing query, unlike Decisions which clears both.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: security
