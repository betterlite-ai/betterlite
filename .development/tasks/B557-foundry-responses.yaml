id: B557
title: Foundry native Responses and Decisions
description: >-
  Add Foundry Responses and Decisions endpoint overrides over the shared OpenAI types and decision IR. Preserve
  configured API base requirements, host-specific authentication and absence of native websocket support. B080/B099
  install the corresponding public endpoints.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/responses/transformation.py:
  _responses_url L18-L22; AzureAIResponsesAPIConfig.custom_llm_provider L27-L28; AzureAIResponsesAPIConfig.validate_environment
  L30-L41; AzureAIResponsesAPIConfig.supports_native_websocket L43-L44; AzureAIResponsesAPIConfig.get_complete_url
  L46-L53. litellm/llms/azure_ai/decisions/transformation.py: AzureAIDecisionsConfig.missing_api_base_message L18-L19;
  AzureAIDecisionsConfig.get_complete_url L21-L24.


  Reuse AzureFoundryModelInfo.get_api_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AzureFoundryModelInfo.get_api_key from B549 (litellm/llms/azure_ai/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse api_key_header_for_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse get_azure_ai_auth_headers from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains
  with that prerequisite.


  Implement crates/betterlite-foundry/src/responses.rs with adjacent tests under responses/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation foundry_responses in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function responses_cases in betterlite-foundry with these exact named cases (one per oracle file):
  foundry_responses_url, responses_auth, missing_base, no_native_websocket, decisions_route. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_responses* using HelperCase: kind: helper
  and the externally tagged foundry_responses variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_foundry_responses that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 35 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 70 production lines, 90 behavior/config-test lines, 75 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 260 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-foundry/Cargo.toml
  - crates/betterlite-foundry/src/lib.rs
  - crates/betterlite-foundry/src/error.rs
  - crates/betterlite-foundry/src/responses.rs
  - crates/betterlite-foundry/src/responses/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/foundry_responses.rs
  - tools/oracle/src/helpers/foundry_responses/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/foundry_responses.py
  - tools/oracle/cases/helpers/providers/foundry-responses/**
  - tools/oracle/fuzz/corpus/helper_case/foundry_responses*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/responses/transformation.py#L18-L53
  why: >-
    Own _responses_url, AzureAIResponsesAPIConfig.custom_llm_provider, AzureAIResponsesAPIConfig.validate_environment,
    AzureAIResponsesAPIConfig.supports_native_websocket, AzureAIResponsesAPIConfig.get_complete_url. Other functions
    in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/decisions/transformation.py#L18-L24
  why: Own AzureAIDecisionsConfig.missing_api_base_message, AzureAIDecisionsConfig.get_complete_url. Other functions
    in this file remain with the owners listed below.
dod:
- text: 'foundry responses url: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-responses/foundry-responses-url.yaml.'
  proof:
  - case-foundry-responses-url
  - oracle
  - helper-python
- text: 'responses auth: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-responses/responses-auth.yaml.'
  proof:
  - case-responses-auth
  - oracle
  - helper-python
- text: 'missing base: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-responses/missing-base.yaml.'
  proof:
  - case-missing-base
  - oracle
  - helper-python
- text: 'no native websocket: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-responses/no-native-websocket.yaml.'
  proof:
  - case-no-native-websocket
  - oracle
  - helper-python
- text: 'decisions route: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-responses/decisions-route.yaml.'
  proof:
  - case-decisions-route
  - oracle
  - helper-python
- text: New foundry_responses seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-responses-url
    why: The foundry-responses-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_foundry_responses_url$/)'
  - id: case-responses-auth
    why: The responses-auth behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_responses_auth$/)'
  - id: case-missing-base
    why: The missing-base behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_missing_base$/)'
  - id: case-no-native-websocket
    why: The no-native-websocket behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_no_native_websocket$/)'
  - id: case-decisions-route
    why: The decisions-route behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_decisions_route$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_responses.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_responses*")"
      && grep -lq 'foundry_responses' tools/oracle/fuzz/corpus/helper_case/foundry_responses* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_responses$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/foundry-responses/foundry-responses-url.yaml
- tools/oracle/cases/helpers/providers/foundry-responses/responses-auth.yaml
- tools/oracle/cases/helpers/providers/foundry-responses/missing-base.yaml
- tools/oracle/cases/helpers/providers/foundry-responses/no-native-websocket.yaml
- tools/oracle/cases/helpers/providers/foundry-responses/decisions-route.yaml
deviations: []
out_of_scope:
- B026 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Preserve configured API base requirements, host-specific authentication and absence of native websocket support.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: standard
