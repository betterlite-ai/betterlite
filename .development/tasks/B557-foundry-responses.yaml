checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-responses-url
    why: Resolve base through B549 or raise ValueError api_base is required for the Azure AI Foundry Responses API.
      Set the api_base parameter or the AZURE_AI_API_BASE environment variable. Split nonempty path segments; if
      first two are api,projects retain the first3 segments, else discard path; append openai/v1/responses and remove
      query, retaining fragment. Provider is azure_ai and native websocket support=False.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_foundry_responses_url$/)'
  - id: case-responses-auth
    why: Resolve params.api_key/base through B549 model-info accessors, choose host-specific api-key versus Authorization
      and allow Entra fallback; copy caller headers then overlay auth and Content-Type=application/json. Inherit
      request/response reasoning and status filtering from B544, not just the OpenAI base.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_responses_auth$/)'
  - id: case-missing-base
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-responses/missing-base.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_missing_base$/)'
  - id: case-no-native-websocket
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-responses/no-native-websocket.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_no_native_websocket$/)'
  - id: case-decisions-route
    why: Foundry Decisions inherits B099 BaseDecisionsConfig (SystemOne wire/IR), not B524 OpenAI decision conversion.
      Keys/base use AZURE_AI_API_KEY/AZURE_AI_API_BASE. Strip the optional trailing /api/projects/<project> plus
      optional /openai/v1,/openai,/models,/v1 suffix, then append /providers/microsoft/v1/systemone, removing query
      and fragment. Missing-base diagnostic is Missing AZURE_AI_API_BASE - set AZURE_AI_API_BASE or pass api_base,
      e.g. https://<resource>.services.ai.azure.com.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_decisions_route$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_responses.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_responses*")"
      && grep -lq 'foundry_responses' tools/oracle/fuzz/corpus/helper_case/foundry_responses* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_responses$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_responses_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_responses_secret_safe_failure$/)'
