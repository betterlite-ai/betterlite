id: B1065
title: Vector-store SDK retrieve and list
description: >-
  Implement complete retrieve/aretrieve/list/alist in core::api::vector_store_read. B174 resolves provider
  names, B010 selects config, B2485 performs the HTTP read, B012 logs and B011 maps failures. Register VectorStoreRead in
  B2401, with real SDK calls against OpenAI mock HTTP. Retrieve requires vector_store_id. List defaults
  after/before=null,limit=20,order=desc; extras, timeout and provider default null. Only null provider uses
  openai. A slash invokes get_llm_provider and passes its api_type into provider config selection.
  No registry lookup happens here. REQUEST_TIMEOUT is the existing B002 float setting (6000 seconds);
  null/zero timeout falls back to it even though the read transport does not forward timeout to GET.

  Own 246 nonblank/non-comment physical lines at main.py:493-775, including decorators and all four
  wrappers. Share mode-independent preparation; retain async context, true-only flags and awaitable result
  handling. Allow 200 implementation, 120 tests, 85 adapters, 105 cases and 65 settings/corpus/wiring lines,
  575 total. Inputs are already parsed B1131 records; reuse config/SDK decoders and do not create another parser.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_store_read.rs
  - crates/betterlite-core/src/api/vector_store_read/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/**
  - crates/betterlite-config/src/api/vector_store_read.rs
  - crates/betterlite-config/src/api/vector_store_read/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-read-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/vector_store_read.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/vector_store_read.py
  - tools/oracle/cases/sdk-http/vector-store-read/**
  - tools/oracle/fuzz/corpus/sdk_http_case/vector-store-read-*
  - tools/oracle/helpers/b1065.py
  - tools/oracle/helpers/b1065/**
  - tools/oracle/src/helpers/core_ops/b1065.rs
  - tools/oracle/src/helpers/core_ops/b1065/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/main.py#L493-L775
  why: Retrieve and list retain different option records, but share provider resolution and exception mapping.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L576-L576
  why: Timeout fallback is an environment-loaded float, not a hard-coded client timeout.
dod:
- text: >-
    retrieve_preserves_record calls both modes with vs_a and mock 200 {id:vs_a,object:vector_store,name:notes,
    status:completed,file_counts:{total:2,completed:2}}. Expect GET /v1/vector_stores/vs_a and that record.
    extra_query={after:ignored} and extra_body={name:ignored} do not enter the request. A registry containing
    a different credential is never consulted; caller api_key determines Authorization. Log model=null,
    optional_params={vector_store_id:vs_a},litellm_params={litellm_call_id:null} before the handler.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    list_defaults_and_cursors calls without arguments and expects GET /v1/vector_stores?limit=20&order=desc.
    after="",before=vs_z,limit=0,order=asc retains all four query values. Explicit null limit/order omits
    both, and unsupported order=sideways is forwarded without local validation. Mock {object:list,data:[],
    first_id:null,last_id:null,has_more:false} is preserved. List logs all four option fields, including nulls.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    read_provider_failures uses provider null->openai; empty/unknown names fail enum resolution with no HTTP;
    vertex_ai/rag_api passes provider=vertex_ai,api_type=rag_api to configuration. Known unsupported anthropic
    raises source ValueError "Vector store retrieve is not supported for anthropic" or "Vector store list is
    not supported for anthropic", mapped to APIConnectionError,500,type/param/code=null. Mock HTTP 404 yields
    NotFoundError,404,type/param/code=null in either mode. A supplied mode-matched client and request context
    reach transport; true flags choose async while 1/"true" do not. Compare source messages but ignore
    betterlite wording under the common error decision.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    loads_read_timeout loads REQUEST_TIMEOUT unset=6000,"4.5"=4.5 and invalid "bad" as config failure.
    Native handler capture sees null/0->configured timeout and 3->3; no upstream GET receives this override.
    Commit seeds for the existing config loader and vector_store_read SDK case decoder.
  proof: [read-tests, config-tests, config-corpus, sdk-corpus]
checks:
  optional: [mutants]
  commands:
  - id: read-tests
    why: retrieve or pagination loses its source defaults and provider routing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_read::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: read timeout cannot be loaded and overridden through the production config
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::vector_store_read::tests::loads_read_timeout($|::)/)'
  - id: config-corpus
    why: the environment input has no committed regression case
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-read-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: python-adapter
    why: the read comparison lacks an independently executed SDK path
    run: test -f tools/oracle/sdk_http/vector_store_read.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: no new read-case seed exercises the tagged operation
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-store-read-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/vector-store-read/retrieve-preserves-record.yaml
- tools/oracle/cases/sdk-http/vector-store-read/list-defaults-and-cursors.yaml
- tools/oracle/cases/sdk-http/vector-store-read/read-provider-failures.yaml
deviations: []
out_of_scope:
- B1064 owns create/search and the mock/executor helpers; B1066 owns update/delete. B2485 owns complete GET transport functions.
- B527 and the selected provider config own URL/response transforms; B158-B161 own package exports. HTTP routes are B1068.
pitfalls:
- extra_query never reaches the transport, so it cannot override list's default limit=20.
- A registry entry does not supply retrieve/list credentials, unlike search.
- Passing timeout=0 chooses REQUEST_TIMEOUT rather than disabling a timeout.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
