deviations:
  - what: Reasoning output is capped at 12,000 characters in betterlite, preserving LiteLLM behavior from estimator.py:159.
    why: Truncation happens on return, protecting against oversized token usage in downstream operations.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/roi_calculator/estimator.py#L159

out_of_scope:
  - "B3150 owns ROISettings validators and ROIPullEvidence; this task consumes them without modification."
  - "B3152 owns SourceError and GitHub client; this task imports SourceError as an error-contract dependency."
  - "B3153 owns GitHub.evidence and pull collection; this task consumes ROIPullEvidence records."
  - "B394 owns extract_classifier_json; this task calls it through betterlite-router::capability_forecast."
  - "B2221 owns supports_none_reasoning_effort; this task calls it through betterlite-models::model_capability_predicates."
  - "Actual completion implementation from the gateway; CompletionCaller is an injected callback contract."

pitfalls:
  - "estimator_options with empty models tuple must return {} not reasoning_effort: the `if models and all(...)` guard exists so a falsy truth condition returns the default, not the reasoning-enabled value."
  - "metadata field in ROICompletionRequest is required, not optional; every estimate request carries tags=(\"litellm-roi-estimator\",) and litellm_roi_estimator=true with exact literal values."
  - "cache_context hashes a tuple of (version, model, prompt, contract, options dict); all must be JSON-serializable and in this exact order."
  - "_validate_completion uses from_attributes=True to accept response objects that may not be pure Pydantic instances from the callback."
  - "incomplete_metadata flag on pull evidence gates the estimator; a pull with missing files or commits is never sent to the model."
  - "Reasoning output is truncated to 12,000 characters on return, not stored; the cap happens after successful validation."
  - "Each configured estimator model is a tuple (name, provider); provider is None for default, or a concrete provider string for overrides."
  - "The evidence JSON is serialized with exclude_unset=True; only fields explicitly set appear in evidence, preserving NotRequired distinctions."
  - "extract_classifier_json may return a JSON-escaped string or a complete object; always parse the result as ROIEstimatorResult, not as a string."
  - "The RESPONSE_CONTRACT is appended to estimator_prompt on every estimate call; do not duplicate it in the prompt itself or the system message will be oversized."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
