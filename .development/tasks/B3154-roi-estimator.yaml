id: B3154
title: Estimate engineering effort from pull request metadata
description: >-
  Build crates/betterlite-server::roi_estimator around an injected completion callback, with typed
  completion/evidence/result models in crates/betterlite-roi. The estimator consumes validated
  ROISettings and ROIPullEvidence from B3150, calls a CompletionCaller protocol implementation
  (supplied by B3161 at the gateway), extracts JSON and hours from the response, and returns a
  typed ROIEstimate record.

  The estimator gates evidence at 160,000 characters and refusal to score pulls with incomplete
  metadata: the estimate returns status "needs_review" with null hours and a reason string when
  GitHub did not provide all file or commit metadata, or when the evidence exceeds the character
  limit. For valid evidence, the estimator constructs an exact system message (estimator_prompt plus
  RESPONSE_CONTRACT), a JSON-formatted user message with pull/commit/file metadata, and a completion
  request with the configured estimator model, temperature=0, max_tokens=1200, response_format
  type "json_object", and reasoning_effort "none" only when all configured models support it.

  Every completion request carries metadata as a required field with exact literals:
  metadata={"tags": ("litellm-roi-estimator",), "litellm_roi_estimator": true}. The completion
  response is validated as ROICompletionResponse, parsed with extract_classifier_json from B394
  to handle optional JSON blocks, and deserialized into ROIEstimatorResult, which validates that
  hours are finite and nonnegative and reasoning is not empty. Completed estimates include status
  "estimated", the parsed hours and reasoning (truncated to 12,000 characters), model name,
  evidence_source "pr_metadata", effort_basis "without_ai", and cached false. HTTP failures, parse
  errors, validation errors and incomplete responses are caught and raised as SourceError with
  message "The estimator did not return valid hours and reasoning. Check the selected model and prompt."

  The cache context is a SHA256 of the estimator version, configured model, configured prompt,
  response contract and estimator options, used by B3156 to identify and reuse previously estimated
  pulls. estimator_options returns {"reasoning_effort": "none"} when all available models support it
  via B2221's supports_none_reasoning_effort; an empty models tuple returns {} (not reasoning_effort
  "none"). _configured_models returns the passed models tuple unchanged when not None, otherwise
  substitutes (estimator_model, None). cache_context produces a consistent SHA-256 hash independent
  of pull evidence.

