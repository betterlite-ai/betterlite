dod:
  - text: CompletionCaller is an injected async callback that takes ROICompletionRequest and returns object; Estimator is constructed with settings, complete callback and optional models tuple.
    proof: [estimator-types]
  - text: metadata_evidence converts ROIPullEvidence into ROIEstimatorEvidence with title, body, changes, files and commits tuples; all TypedDicts and records preserve exact LiteLLM field names.
    proof: [metadata-evidence]
  - text: "estimator_options returns {\"reasoning_effort\": \"none\"} only when all configured models support it via supports_none_reasoning_effort from B2221."
    proof: [estimator-options-all-support]
  - text: "estimator_options returns {} (not reasoning_effort \"none\") when models tuple is empty."
    proof: [estimator-options-empty-tuple]
  - text: _configured_models returns the passed models tuple unchanged when not None, otherwise substitutes (estimator_model, None).
    proof: [configured-models]
  - text: cache_context returns a SHA256 hexdigest of version, estimator model, prompt, RESPONSE_CONTRACT and estimator options, deterministic and independent of pull evidence.
    proof: [cache-context]
  - text: Estimator.estimate gates evidence at 160,000 characters and checks ROIPullEvidence.incomplete_metadata; returns status "needs_review" with null hours and reason when gating fails.
    proof: [estimate-gating]
  - text: Estimator.estimate constructs a system message of prompt plus RESPONSE_CONTRACT, user message of JSON-serialized evidence, and request with exact model, temperature 0, max_tokens 1200, json_object response format and conditional reasoning_effort.
    proof: [estimate-request]
  - text: "Estimator.estimate sets metadata to exactly {\"tags\": (\"litellm-roi-estimator\",), \"litellm_roi_estimator\": true} with exact literal values."
    proof: [estimate-metadata]
  - text: Estimator.estimate validates the response as ROICompletionResponse, extracts JSON from choice.message.content using extract_classifier_json from B394, and parses it as ROIEstimatorResult.
    proof: [estimate-parsing]
  - text: ROIEstimatorResult.validate_hours checks isfinite and nonnegative; validate_reasoning checks non-empty stripped content; strict mode forbids extra fields.
    proof: [result-validation]
  - text: Estimator.estimate returns status "estimated" with model, evidence_source "pr_metadata", effort_basis "without_ai", cached false, and reasoning truncated to 12,000 characters on success.
    proof: [estimate-success]
  - text: 'HTTP errors, parse failures, validation failures and incomplete responses are caught and raised as SourceError with exact message "The estimator did not return valid hours and reasoning. Check the selected model and prompt."'
    proof: [estimate-error]

checks:
  optional: []
  commands:
    - id: estimator-types
      why: CompletionCaller protocol or Estimator struct is missing or incorrectly defined
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimator_init_fields($|::)/) - test(/replays_the_/)'
    - id: metadata-evidence
      why: metadata_evidence function is missing or does not preserve exact field mapping from ROIPullEvidence
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::metadata_evidence($|::)/) - test(/replays_the_/)'
    - id: estimator-options-all-support
      why: "estimator_options does not return {\"reasoning_effort\": \"none\"} when all models support it"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimator_options_all_support($|::)/) - test(/replays_the_/)'
    - id: estimator-options-empty-tuple
      why: "estimator_options returns reasoning_effort for empty models tuple instead of empty dict {}"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimator_options_empty_tuple($|::)/) - test(/replays_the_/)'
    - id: configured-models
      why: _configured_models does not return models unchanged when not None, or does not substitute default correctly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::configured_models($|::)/) - test(/replays_the_/)'
    - id: cache-context
      why: cache_context does not produce consistent SHA256 hash or includes wrong fields
      run: cargo nextest run --locked -p betterlite-roi --no-tests=fail -E 'test(/^estimator::cache_context($|::)/) - test(/replays_the_/)'
    - id: estimate-gating
      why: evidence gating does not cover 160,000 character or incomplete metadata paths
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimate_gating($|::)/) - test(/replays_the_/)'
    - id: estimate-request
      why: request construction does not verify exact prompt, temperature, max_tokens or reasoning_effort
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimate_request($|::)/) - test(/replays_the_/)'
    - id: estimate-metadata
      why: "completion request metadata does not have exact tags tuple (\"litellm-roi-estimator\",) and litellm_roi_estimator bool true"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimate_metadata($|::)/) - test(/replays_the_/)'
    - id: estimate-parsing
      why: response parsing does not verify extract_classifier_json usage or response validation
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimate_parsing($|::)/) - test(/replays_the_/)'
    - id: result-validation
      why: ROIEstimatorResult validation does not cover finite/nonnegative hours and non-empty reasoning
      run: cargo nextest run --locked -p betterlite-roi --no-tests=fail -E 'test(/^estimator::result_validation($|::)/) - test(/replays_the_/)'
    - id: estimate-success
      why: complete estimate tests do not verify status, model, evidence_source, effort_basis and reasoning truncation
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimate_success($|::)/) - test(/replays_the_/)'
    - id: estimate-error
      why: error handling does not verify SourceError is raised on HTTP/parse/validation failures with exact message
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator::estimate_error($|::)/) - test(/replays_the_/)'
    - id: behavior-tests
      why: the required behavior tests fail or the filter selects no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_estimator_behavior($|::)/) - test(/replays_the_/)'

