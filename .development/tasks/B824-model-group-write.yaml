id: B824
title: Model access-group create, update and delete routes
description: >-
  Expose /access_group/new, list, info, update and delete through ModelAccessGroupStore. Preserve source
  model selection, name changes, per-deployment updates and administrator checks, distinguishing this
  model-name grouping API from /v1/access_group resource grants.


  Build the production model_group_write module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_access_group_management_endpoints.py:
  create_model_group (L574-L712; 111 source lines), list_access_groups (L720-L762; 35 source lines), get_access_group_info
  (L770-L821; 43 source lines), update_access_group (L829-L975; 121 source lines), delete_access_group
  (L983-L1085; 82 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /access_group/new -> create_model_group;
  GET /access_group/list -> list_access_groups; GET /access_group/{access_group}/info -> get_access_group_info;
  PUT /access_group/{access_group}/update -> update_access_group; DELETE /access_group/{access_group}/delete
  -> delete_access_group. For each route send a typed successful request, an invalid or missing target,
  and a caller lacking that route permission through B001 HttpCase against the running pinned MIT proxy
  and betterlite. Public login/session routes instead prove bad credentials or invalid/expired codes.
  Compare status, response model including null/absent fields, error type/param/code, content-type, redirect/cookie
  headers and litellm-changed-by where read. Do not reduce endpoint checks to direct helper invocations.
  handle_exception_on_proxy controls management error mapping; keep source partial writes visible in fixture
  inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 392 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  392 production, 151 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 608 changed lines estimated within a 625-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
scope:
