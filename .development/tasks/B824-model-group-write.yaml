id: B824
title: Model access-group create, update and delete routes
description: >-
  Build model_group_write around B823's deployment-tag operations. Own create_model_group L574-L712,
  update_access_group L829-L975 and delete_access_group L983-L1085 in
  model_access_group_management_endpoints.py. Register POST /access_group/new,
  PUT /access_group/{access_group}/update and DELETE /access_group/{access_group}/delete at their
  decorators L569, L824 and L978. Compose B2341's list/info registrations once. These routes have B052
  authentication but no local administrator check, management wrapper or handle_exception_on_proxy.
  B832 supplies NewModelGroupRequest/Response, UpdateModelGroupRequest and DeleteModelGroupResponse;
  both selection lists default to null. There is no rename field and no handler-owned configuration.

  Create logs its requested name and models, then rejects falsey/whitespace-only access_group with
  HTTPException 400 detail.error="access_group is required and cannot be empty". Keep whitespace in
  accepted names. Create and update require a nonempty model_names or model_ids list, else 400 with
  "Either model_names or model_ids must be provided and non-empty". IDs take precedence when both
  lists are nonempty, while the response echoes both original lists including nulls. Names-only calls
  B823._missing_models_after_read_through and rejects missing names with 400 "Model(s) not found: <names
  joined by comma-space>". Preserve order and duplicates. Create does this before its missing-database
  500 "Database not connected. Cannot create access group."; update checks database first and uses
  "Database not connected.". Cases create_name_whitespace, selection_defaults_and_id_precedence,
  missing_names_in_order and create_update_validation_precedence cover each combination.

  Create reads the complete group map, returns 409 "Access group '<name>' already exists. Use PUT
  /access_group/<name>/update to modify it." for an exact duplicate, then tags selected deployments
  sequentially through B823. Update first checks the group map for exact existence (404 "Access group
  '<name>' not found"), then validates names, loads ALL database deployments and strips the group
  sequentially before tagging the requested selection. Config-only deployments are not written.
  An unreadable unrelated row can stop the stripping loop. models_updated counts tagging results,
  not stripped rows. No transaction undoes prior stripping/tagging on failure. Cases duplicate_exact_name,
  update_missing_before_model_validation, update_strip_then_tag, update_count_excludes_removals,
  unreadable_unrelated_row and partial_tag_failure establish the ordering and surviving rows.

  Delete checks the database, reads the group map and uses the same exact-name 404. It strips all DB
  deployments first, counts removed pairs, then calls B823._delete_model_access_group_budget_row,
  retaining the shared BudgetTable row. Only after that does it reload. A budget-delete failure can
  strand a budget for an already untagged group; do not move deletion ahead of stripping. Return 200
  {access_group,models_updated,message:"Access group '<name>' deleted successfully"}, not 204.
  Cases delete_strips_before_budget, delete_shared_budget_survives, delete_budget_failure_keeps_strips
  and delete_response cover this lifecycle.

  Each successful write phase takes B841.live_model_ids_snapshot AFTER database changes, awaits
  B841.clear_cache even for zero changed rows, then calls B823._raise_http_if_reload_degraded_serving
  with before/written_models/access_group/still_desired/live_after. Update merges stripped pairs then
  updated pairs by ID, with updated names winning and first insertion order retained. Creation passes
  tagged pairs; deletion passes removed pairs. Preserve B823's degraded-serving HTTP error and all
  committed rows. Log success only after that verdict. Cases snapshot_after_writes, reload_zero_changes,
  update_verdict_pair_merge and degraded_reload_preserves_writes verify inputs, effects and log order.

  The separate update/delete existence try blocks rethrow HTTPException and wrap other exceptions as
  500 detail.error="Failed to check access group existence: <exception>" without their own error log.
  Each main operation try also preserves HTTPException, but logs other exceptions and wraps them as
  500 "Failed to create access group: <exception>", "Failed to update access group: <exception>" or
  "Failed to delete access group: <exception>". Failures before these try blocks stay outside that
  mapping. Cases existence_exception_mapping, operation_exception_mapping and pre_try_failures_escape
  compare status, detail, type/param/code presence and log behavior. HTTP cases run through B001 on
  booted proxies; middleware_role_policy covers actual B052 auth rather than an invented handler guard.

  B860-backed row/effect tests select POSTGRES_TEST_URL, with testcontainers only when the variable is
  absent, and fail on connection errors. Keep implementation files below 300 lines. The three functions
  own 314 nonblank/noncomment source lines including examples; allow 300 implementation, 350 tests and
  75 registration lines, 725 within the 750-line gate. Typed request parsing stays with B003/B832;
  this orchestration introduces neither credentials nor a new byte decoder.
scope:
  paths:
    - crates/betterlite-server/src/model_group_write.rs
    - crates/betterlite-server/src/model_group_write/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/app.rs
    - tools/oracle/cases/management/model-group-write/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_access_group_management_endpoints.py#L569-L712
    why: Creation decorator, selection precedence and local exception mapping.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_access_group_management_endpoints.py#L824-L1085
    why: Update/delete decorators, sequential stripping and post-write reload verdicts.
dod:
  - text: All named request, response, existence and selection cases match through the three real routes,
      with B2341 read routes composed only once.
    proof: [behavior-tests, oracle]
  - text: The named write-order, reload-input, exception and retained-row cases run on Postgres and fail
      if an extra transaction, cache call or catch changes the pinned effects.
    proof: [behavior-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Model-group orchestration tests are absent or source ordering changed.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E
        'test(/^model_group_write::tests::/) - test(/replays_the_/)'
oracle_cases:
  - tools/oracle/cases/management/model-group-write/create-name-whitespace.yaml
  - tools/oracle/cases/management/model-group-write/selection-defaults-and-id-precedence.yaml
  - tools/oracle/cases/management/model-group-write/missing-names-in-order.yaml
  - tools/oracle/cases/management/model-group-write/create-update-validation-precedence.yaml
  - tools/oracle/cases/management/model-group-write/duplicate-exact-name.yaml
  - tools/oracle/cases/management/model-group-write/update-missing-before-model-validation.yaml
  - tools/oracle/cases/management/model-group-write/update-strip-then-tag.yaml
  - tools/oracle/cases/management/model-group-write/update-count-excludes-removals.yaml
  - tools/oracle/cases/management/model-group-write/unreadable-unrelated-row.yaml
  - tools/oracle/cases/management/model-group-write/partial-tag-failure.yaml
  - tools/oracle/cases/management/model-group-write/delete-response.yaml
  - tools/oracle/cases/management/model-group-write/delete-shared-budget-survives.yaml
  - tools/oracle/cases/management/model-group-write/degraded-reload-preserves-writes.yaml
  - tools/oracle/cases/management/model-group-write/middleware-role-policy.yaml
deviations: []
out_of_scope:
  - B823 owns the declarations and model-group data/reload-verdict helpers at L65-L566 of
    model_access_group_management_endpoints.py; B2341 owns list L720-L762 and info L770-L821.
  - B825 owns budget handlers L1093-L1244; B832 owns API schemas; B841 implements the reload itself.
pitfalls:
  - Updating a group can remove every old grant before a later invalid model ID fails.
  - Deletion counts changed deployment rows and leaves the linked shared budget record intact.
budget:
  max_changed_lines: 750
  max_new_expects: 0
review_level: security
