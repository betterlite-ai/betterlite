id: B921
title: Execute the chat-to-Responses bridge
description: >-
  Implement api::response_chat_dispatch for every function in the bridge handler, including
  validation, sync/async execution, stream collection, cached-result handling and provider
  post-processing. Compose B918 request mapping, B919 results, B920 streaming, B1078 sync
  Responses and B932 async Responses. B010 supplies MockResponseIterator, B005 the stream
  wrapper, B012 logging, B2230 chat-config selection and B2202 its default post-processing.
  Use typed constructor inputs for response/config objects; validation still reports the
  same missing/wrong-type fields at the SDK boundary. This layer decodes no bytes.

  Extend B2401 with response_chat_dispatch and capture both sync and async requests to
  the mock provider. Nonstreaming calls that receive a stream must actually consume that
  HTTP stream. Unit tests may inject completed/cached result variants to cover dispatch
  branches, but provider execution cases must not stub responses()/aresponses(). The
  handler contains 330 nonblank/non-comment lines. Budget 310 implementation, 180 tests,
  155 HTTP fixtures, 115 adapters and 30 wiring: 790 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/response_chat_dispatch.rs
  - crates/betterlite-core/src/api/response_chat_dispatch/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/response_chat_dispatch.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/response_chat_dispatch.py
  - tools/oracle/cases/sdk-http/response-chat-dispatch/**
  - tools/oracle/helpers/b921.py
  - tools/oracle/helpers/b921/**
  - tools/oracle/src/helpers/core_ops/b921.rs
  - tools/oracle/src/helpers/core_ops/b921/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/handler.py#L1-L396
  why: Entire handler preserves validation order, prefix restoration, sync/async client difference and all stream branches.
dod:
- text: >-
    bridge_input_validation removes or gives the wrong type to each required field in
    order model,custom_llm_provider,messages,optional_params,litellm_params,headers,
    model_response,logging_obj. The first invalid field raises ValueError "<field> is required"
    and makes zero provider requests; SDK projection has no status/type/param/code on the
    direct handler exception. Empty string model/provider,empty list messages and empty
    dict options/headers are accepted by this validator. encoding is optional and defaults null.
  proof: [dispatch-tests, oracle, dispatch-adapter]
- text: >-
    prefixed_provider_execution sends model=gpt-4o-mini,provider=openai,user hello,
    api_key=sk-test to exactly one POST /v1/responses with Bearer sk-test and Responses
    input from B918. The SDK receives model=openai/gpt-4o-mini and custom_llm_provider=openai,
    overwriting conflicting sanitized kwargs without duplicate arguments; the provider
    receives model=gpt-4o-mini. Mock response resp_a with text hi becomes chat id=resp_a,
    model=gpt-4o-mini,content=hi via B919. completion(acompletion=true) uses the async path
    only for boolean true. Sync passes client to B918; async omits it, so client=null there.
  proof: [dispatch-tests, oracle, dispatch-adapter]
- text: >-
    stream_flag_and_collection injects outer stream=true only when optional_params has
    no stream key; existing false or null is retained. _resolve_stream_flag uses the
    optional value unless null, then SDK stream default false, and finally bool conversion.
    optional stream=false plus litellm_params.stream=true makes B918 request a provider
    stream but this handler collect it to a final chat response. Capture SSE text hi and
    response.completed; both sync/async fully drain it and use completed_response.response.
    EOF without that object raises ValueError "Stream ended without a completed response".
  proof: [dispatch-tests, oracle, dispatch-adapter]
- text: >-
    collected_response_coercion keeps a ResponsesAPIResponse, constructs a dict normally,
    and falls back to model_construct when dict validation fails. A string payload raises
    ValueError "Unexpected responses stream payload". Existing nonempty hidden parameters
    win per key over stream hidden parameters; absent/empty/non-dict maps are replaced by
    a copy. The defensive "Stream completed response is invalid" guard is unreachable
    with the closed coercion result, so it is not a new user-facing failure path.
  proof: [dispatch-tests]
- text: >-
    streaming_result_dispatch returns a direct ResponsesAPIResponse through B919 even
    when stream=true. A direct ModelResponse passes through when false and uses B010's
    MockResponseIterator when true. A cached_response CustomStreamWrapper bypasses B920
    translation but still receives post-processing. Ordinary streams use B920 with
    sync_stream=true/false matching the entry mode, then B005 wrapping. Capture two
    provider chunks split inside JSON and verify the translated text remains hi with one
    stable ID, one terminal finish reason and no duplicate content; cancellation closes
    the mock connection through the underlying B005/B010 stream owner.
  proof: [dispatch-tests, oracle, dispatch-adapter]
- text: >-
    post_stream_and_failure selects provider config with the unprefixed model and provider
    enum. ValueError/KeyError during selection or no config returns the stream unchanged;
    other errors propagate. A present config's post_stream_processing return value is
    returned verbatim. Provider 401 with error message=bad key,type=invalid_api_key,
    code=invalid_api_key,param=null makes one request at retries=0 and preserves B011's
    AuthenticationError,status=401,body/type/param/code null and declared message policy.
  proof: [dispatch-tests, oracle, dispatch-adapter]
checks:
  optional: []
  commands:
  - id: dispatch-tests
    why: execution dispatch drops validation, result variants or stream collection semantics
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_dispatch::/)'
  - id: dispatch-adapter
    why: the bridge lacks independently captured SDK provider requests
    run: test -f tools/oracle/sdk_http/response_chat_dispatch.py && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/response-chat-dispatch)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/sdk-http/response-chat-dispatch/bridge-input-validation.yaml
- tools/oracle/cases/sdk-http/response-chat-dispatch/prefixed-provider-execution.yaml
- tools/oracle/cases/sdk-http/response-chat-dispatch/stream-flag-and-collection.yaml
- tools/oracle/cases/sdk-http/response-chat-dispatch/streaming-result-dispatch.yaml
- tools/oracle/cases/sdk-http/response-chat-dispatch/post-stream-and-failure.yaml
deviations: []
out_of_scope:
- B1078/B932 own Responses SDK preparation and provider execution; B918/B919/B920 own transformations, B005/B010 transport iteration and cleanup.
- Provider-specific post_stream_processing implementations remain with their provider tasks; this handler invokes the selected typed config seam.
- B158-B161 own Python coroutine/event-loop facades; this task preserves observable sync/async behavior in its native execution modes.
pitfalls:
- The request builder ORs stream flags, but this handler resolves an explicit false differently and may need to drain a stream.
- The async path does not pass client to transform_request although the sync path does.
- Completed Responses objects bypass stream wrapping even when the caller requested streaming.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
