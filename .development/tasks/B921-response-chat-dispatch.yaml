id: B921
title: Response chat dispatch
description: >-
  Wire chat calls backed by a native Responses provider through B014. Resolve bridge direction once, build request
  and stream/nonstream response using the split converters, and expose the existing logging/context result seam
  without a second terminal log.


  Implement crates/betterlite-core/src/api/response_chat_dispatch.rs. Use ResponseChatDispatchInput and ResponseChatDispatchResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions native_responses_chat_dispatch, stream_chat_dispatch, provider_error_once,
  previous_response_forwarding under api::response_chat_dispatch::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponseChatDispatch in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_chat_dispatch: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/completion_extras/litellm_responses_transformation/handler.py: _restore_routing_prefix
  (L28-L30); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler.__init__
  (L34-L38); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler._resolve_stream_flag
  (L41-L45); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler._is_preformatted_cached_chat_stream
  (L48-L51); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler._coerce_response_object
  (L54-L75); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler._collect_response_from_stream
  (L77-L90); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler._collect_response_from_stream_async
  (L92-L105); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler.validate_input_kwargs
  (L107-L155); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler.completion
  (L157-L257); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler.acompletion
  (L259-L353); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler._completed_response_as_stream
  (L355-L372); litellm/completion_extras/litellm_responses_transformation/handler.py: ResponsesToCompletionBridgeHandler._apply_post_stream_processing
  (L375-L393). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 332 owned nonblank/non-comment/non-docstring Python lines (337 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 352 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 584 total within the 590-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B918 (Response chat request), B919 (Response chat result), B920
  (Responses to chat stream), B1087 (Api boundaries). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
