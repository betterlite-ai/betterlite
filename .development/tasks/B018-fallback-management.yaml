id: B018
title: Fallback management API and persistent configuration
description: Serve POST /fallback and GET/DELETE /fallback/{model} using B309's typed plans and B066's
  settings persistence. Reuse B052 authorization and B051's existing schema; no new schema or table is
  needed. Persist before publishing the new immutable router snapshot, and retain the old snapshot when
  the write fails. Use B300 scenarios for create/read/replace/delete sequences and B301 adapters with
  a typed repository fixture when database setup is not expressible as an HTTP case. Keep the three fallback
  categories independent and include parser fuzzing for the management request body. Use the existing
  Rust crate boundaries from B004 and B008; integrate through the server when the provider dispatcher
  or callbacks live in another core crate. This task's source slices are the linked ranges, not a port
  of their Python classes. Add the listed oracle cases and the matching adapters to B301's component runner
  where state is not observable over HTTP; adapters call production logic and never reproduce it. Use
  deterministic candidate sets or supplied random samples for comparisons, and separate seeded distribution
  tests for random choices. Extend the existing config_yaml fuzz target and committed corpus for every
  newly accepted config form; unsupported keys still fail by full path. Add a cargo-fuzz target fallback
  under crates/betterlite-server/fuzz and a normal replays_the_fallback_corpus test using the
  production parser. Keep the implementation, adapters and tests within 800 changed lines; fixtures and
  oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/fallback-management/**
  - tools/oracle/src/router_probes/fallback_management/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/fallback_management.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/fallback_management_endpoints.py#L42-L204
  why: Create/update validation and database requirement.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/fallback_management_endpoints.py#L207-L357
  why: Read and delete contracts.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/router_settings_endpoints.py#L1-L67
  why: Fallback request and response types.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the fallback_management prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(fallback_management)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-server/fuzz/fuzz_targets/fallback.rs && test -n "$(ls -A crates/betterlite-server/fuzz/corpus/fallback)"
      && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_fallback_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/fallback-management/create-read-replace-delete.yaml
- tools/oracle/cases/routing/fallback-management/three-independent-types.yaml
- tools/oracle/cases/routing/fallback-management/unknown-primary.yaml
- tools/oracle/cases/routing/fallback-management/unknown-target.yaml
- tools/oracle/cases/routing/fallback-management/self-fallback.yaml
- tools/oracle/cases/routing/fallback-management/storage-disabled.yaml
- tools/oracle/cases/routing/fallback-management/write-failure-keeps-live-state.yaml
- tools/oracle/cases/routing/fallback-management/unauthenticated.yaml
deviations: []
out_of_scope:
- General settings API (B066/B023).
- Budget or role changes.
pitfalls:
- A write requires STORE_MODEL_IN_DB and a database; an in-memory-only API would not match the pin.
- Do not assume every error uses the inference error envelope; management detail bodies have their own
  cases.
- Scope is limited to server adapters over the B051/B066 repository interfaces.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
