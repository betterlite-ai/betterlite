pitfalls:
  - Both memory partitions share literal Redis keys; adding a key-object Redis prefix would break cross-worker auth sharing.
  - A failed typed cache read leaves the bad value in place and can log again on the next read.
  - The auth membership key orders team before user, while the reservation key orders user before team.
