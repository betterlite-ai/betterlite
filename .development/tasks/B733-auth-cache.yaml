dod:
  - text: 'Literal cases name bare_lower_hex_only, uppercase_prefix_newline_and_length_not_key,
      hex_management_id_uses_key_partition, permission_link_and_row_keys, tag_keys_and_overflow,
      access_group_keys_counter_and_overflow, project_keys_and_counter,
      end_user_keys_registry_and_overflow, membership_auth_and_reservation_keys,
      no_permission_and_no_membership_sentinels and delimiters_and_empty_ids_not_escaped.
      TTL/copy cases name management_ttl_only_none_falls_back, copy_clears_exactly_four_fields,
      copy_original_unchanged, copy_keeps_trusted_markers and copy_preserves_nested_values.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Payload cases name raw_false_zero_empty_retained, typed_none_silent,
      matching_model_identity_retained, malformed_dict_warning_then_error,
      scalar_hit_error_without_codec_warning, invalid_entry_not_evicted,
      codec_nonvalidation_error_propagates, model_dump_same_memory_and_redis,
      typed_serialization_fails_before_write and resolved_key_exclusions_survive_dump.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Native backend cases name two_memory_partitions_shared_redis, independent_eviction,
      constructor_defaults_delegated, settings_update_ordinary_then_key,
      ttl_none_keeps_previous_zero_updates, max_size_none_resets_both,
      attach_once_without_backfill, local_only_and_options_forwarded,
      none_key_serializes_before_forwarding, sync_write_never_batches,
      async_batch_only_numeric_ttl_option, batch_bool_ttl_accepted,
      queued_write_not_repeated_or_awaited, absent_batch_direct_write,
      single_delete_partition_and_result, batch_delete_attempts_both_empty_groups,
      batch_delete_first_partition_error_after_both, batch_delete_cancel_propagates,
      batch_write_serializes_all_before_mutation, batch_write_key_partition_first,
      batch_write_preserves_duplicates, batch_write_skips_empty_partition,
      key_partition_failure_skips_other and later_partition_failure_keeps_key_write.'
    proof: [behavior-tests]
  - text: 'Production config cases name fallback_env_default_60, fallback_env_override,
      fallback_env_bad_or_empty_fails_startup, fallback_env_zero_negative_kept,
      gateway_memory_ttl_default_60, user_ttl_updates_both_tiers,
      user_ttl_none_leaves_defaults, user_ttl_zero_negative_fractional,
      malformed_user_ttl_fails, max_size_default_none_maps_200,
      max_size_positive_integral_coercion, max_size_zero_negative_fractional_rejected and
      nonfinite_or_unrepresentable_ttl_rejected. Corpus seeds use the actual general_settings keys.'
    proof: [config-tests, config-corpus]
  - text: 'Decoder/native deviation cases name auth_cache_payload_over_byte_limit,
      auth_cache_payload_over_depth_limit, malformed_bytes_become_typed_miss,
      duplicate_fields_use_shared_decoder, caller_markers_not_promoted and
      cache_diagnostics_redact_payload_and_key. Replay uses the production decoder.'
    proof: [behavior-tests, parser-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_cache::/)
        - test(replays_the_auth_cache_corpus)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_cache.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-cache-*")"
        && grep -rlq "auth_cache" tools/oracle/fuzz/corpus/helper_case/auth-cache-* && cargo nextest run
        --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_cache::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-cache-*")"
        && grep -rlq "user_api_key_cache_ttl" crates/betterlite-config/fuzz/corpus/config_yaml/auth-cache-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/auth_cache.rs && grep -q "auth_cache" crates/betterlite-auth/fuzz/Cargo.toml
        && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-auth/fuzz/corpus/auth_cache)"
        && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(replays_the_auth_cache_corpus)'
