id: B733
title: Typed key and management-object caches
description: >-
  Implement auth_cache in betterlite-auth over B125 DualCache/InMemoryCache/CacheCodec and B126 Redis.
  Own user_api_key_cache.py and the shallow cache copy at auth_checks.py L3970-L3978. Reuse B2314's
  resolved-key records; there is no principal resolver, SQL access, key hashing or response-cache
  namespace transformation here. Both in-memory partitions share the same Redis client and literal
  keys. Select the key-object partition only for a full match of 64 lowercase ASCII hex characters;
  uppercase, prefixes, newlines, wrong lengths and hashed-jwt- values use the ordinary partition.
  A raw 64-hex management identifier also selects the key partition; do not infer object type instead.

  Construct two DualCaches with independent memory stores, the same optional Redis and the same
  supplied TTLs. Reuse B125's constructor truthiness and defaults, including default capacity 200 and
  max item size 1024 KiB for each fresh memory store. in_memory_cache_for exposes the selected store
  to prefetch and invalidation. Update TTL/capacity and attach Redis on ordinary then key partition;
  None TTL leaves a previous setting unchanged, zero updates it, None capacity resets to 200.
  Redis attachment is a no-op for None or an already attached client, changes the TTL only when a
  new client is attached with a nonnull TTL, and never backfills existing memory. Preserve independent
  eviction; ordinary-object churn cannot evict key objects. Underlying expiry, item-size refusal,
  Redis failures and request batching remain B125/B126 behavior, not a second implementation.

  Sync and async reads pass local_only=false by default, trace context and extra cache options to
  the selected backend. Without model_type return the raw cached payload, including false/zero/empty
  values. With model_type, a None miss returns silently; all other payloads pass through B125 CacheCodec.
  That codec returns an existing matching model unchanged, validates dictionaries, warns on a model
  ValidationError and returns None, and returns None silently for other payload kinds. If decoding
  returns None after a nonnull hit, this wrapper additionally logs ERROR naming get_cache or
  async_get_cache and the requested model, then returns a miss. Do not evict or repair that entry.
  A malformed dict therefore produces warning then error; a scalar produces only error. Other codec
  exceptions propagate. Native diagnostics retain these severities and order but redact payloads
  and sensitive cache-key contents.

  Every write serializes through CacheCodec before contacting either tier. With model_type, matching
  models dump directly; dictionaries/other BaseModels validate before dumping, and other scalar values
  pass through. Without it, BaseModels dump in JSON mode while other values remain unchanged. This
  deliberately gives memory and Redis the same representation and preserves B2314 serialization
  exclusions. Invalid model serialization fails before any write. A None key still goes through
  serialization and is forwarded to the ordinary backend; do not classify or hash it.

  async_set_cache first removes model_type from options. It can use async_set_cache_pre_call only
  with a nonnull key, local_only=false, no options except ttl, and ttl absent/None/int/float (including
  Python bool). Any other option or nonnumeric TTL uses the ordinary async write. A nonnull pre-call
  BatchResult means queued: return None without a second write or waiting for its eventual result.
  No active batch yields None and falls through to direct writing. Memory visibility and deferred
  Redis delivery follow B125. Sync writes never select this request-pipeline path.

  Single sync/async/pre-call deletes route to one partition and retain the backend result. Batch
  deletion partitions keys without deduplicating or reordering within each group, invokes BOTH
  groups concurrently even when empty, waits for both outcomes and raises the first BaseException
  in key-partition then ordinary-partition order, not completion order. One failure cannot suppress
  the other invalidation. External cancellation still propagates. Batch writes instead serialize
  ALL entries first with model_type=None, then await the nonempty key group and only then the
  nonempty ordinary group. Preserve duplicates and within-group order, forward local_only/options,
  skip empty groups, and do not roll back an earlier successful partition if a later one fails.
  A key-group failure prevents the ordinary write; a serialization failure prevents both.

  Keep every shared key literal: user_object_permission_id:{user_id}, object_permission_id:{id},
  tag:{name}, tag_registry, model_access_group:{name}, model_access_group_registry,
  spend:model_access_group:{name}, project_id:{id}, spend:project:{id}, end_user_id:{id},
  end_user_restricted_registry, {team_id}_{user_id} for membership auth and
  team_membership:{user_id}:{team_id} for reservation. Do not escape delimiters, trim empty IDs or
  merge the two membership forms; ambiguous concatenations remain compatible. Preserve sentinels
  __user_no_mcp_permission__, __tag_registry_overflow__, __model_access_group_registry_overflow__,
  __end_user_restricted_registry_overflow__ and __no_team_membership__, distinct from a cache miss.
  Implement trivial key construction at callers or through an enum match rather than one-line wrappers.

  get_management_object_ttl returns any nonnull default_in_memory_ttl, including zero or negative;
  only None/missing uses DEFAULT_MANAGEMENT_OBJECT_IN_MEMORY_CACHE_TTL. That env var is int() at
  import, default 60; empty/noninteger input stops startup, with no fallback and no positivity clamp.
  In betterlite-config also support general_settings.user_api_key_cache_ttl=None and
  user_api_key_cache_max_size=None. B124 creates the gateway cache with memory TTL 60; a configured
  nonnull user_api_key_cache_ttl is float-converted and updates BOTH memory and Redis defaults.
  Malformed TTL fails config loading; zero/negative/fractional values are retained, while nonfinite
  or unrepresentable durations get the native checked-duration error. max_size uses the source
  positive integer field: None resets 200, positive integer/coercible integral values pass, zero,
  negative and nonintegral values fail. These settings do not rename the fallback env var or turn
  it into a YAML key. B124 owns startup installation and database-sourced settings precedence,
  including its warn-and-ignore invalid DB max-size path; this task supplies the typed cache settings.

  _copy_user_api_key_auth_for_cache copies the model without revalidating, then clears exactly
  budget_reservation, budget_throttle_pct, parent_otel_span and request_route. It leaves the original
  untouched and retains all other fields, including trusted server markers and carried snapshots.
  The source copy is shallow: do not round-trip JSON and thereby strip trusted fields or change
  nested data. Native ownership may safely share immutable nested records across the two copies.

  Use the auth_cache helper for key/sentinel/TTL/copy/codec projections and deterministic in-memory
  typed-read logging; it does not fake a FastAPI route or a Redis server. Native recording-backend tests prove partition ordering and
  failure behavior against the actual wrapper. decode_cached_auth consumes Redis payload bytes
  through the B125/B126 JSON boundary and requested typed model, then applies the same miss/logging
  policy; cap input at 1048576 bytes and depth 64. Create the auth fuzz workspace here with this
  real decoder target, seed malformed/truncated/scalar/duplicate-field/provenance/limit inputs,
  and replay its corpus separately from behavior tests. Duplicate fields retain the underlying
  JSON decoder semantics. No additional database fixture is needed.

  The cache file has 253 nonblank noncomment lines excluding docstrings; add nine copy lines and
  exclude the unused three-line flush override. Allow 225 production, 305 tests, 85 helper adapters,
  65 config, 65 decoder/fuzz and 35 manifests/wiring, 780 within 800. Keep partition routing, typed
  payloads, key formats and cache-copy logic in separate source files below 300 lines.
