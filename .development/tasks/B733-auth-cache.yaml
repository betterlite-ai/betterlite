deviations:
  - what: Redis auth payloads over 1048576 bytes or JSON depth 64 become a typed cache miss with an error diagnostic.
    why: Bound decoding of external cache data; the source wrapper does not impose these byte/depth limits.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/user_api_key_cache.py#L175-L206
  - what: Auth-cache config rejects nonfinite or unrepresentable TTLs at startup instead of retaining Python float values.
    why: Native checked expiry arithmetic cannot represent NaN/infinity; finite zero and negative values still pass.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6709-L6718
  - what: Cache validation diagnostics omit payload values and sensitive key contents while retaining warning/error order and model names.
    why: Source validation exceptions and arbitrary cache keys can expose credentials; native diagnostics keep secrets redacted.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/cache_pydantic_utils.py#L81-L90
