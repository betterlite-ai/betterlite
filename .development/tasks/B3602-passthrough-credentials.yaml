deviations:
  - what: "Region extraction is provider-specific: AssemblyAI checks for \"eu\" in api_base; other providers return None. This is not extensible per-provider at this task boundary."
    why: LiteLLM's implementation only handles AssemblyAI; future providers would require a task to expand the region logic.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_endpoint_router.py#L314-L327

out_of_scope:
  - B002 owns environment and secret resolution through the config loader; this task calls get_secret_str and receives credential values.
  - B174 owns provider identity resolution (litellm.get_llm_provider); this task calls it to determine provider from model.
  - B844 owns Router.get_model_list and its deployment index; this task iterates the result.
  - B124 owns CredentialAccessor.get_credential_values and shared proxy infrastructure; this task assumes it is provided.
  - The router instance itself and its lifecycle are managed by the proxy server layer, not this credential module.
  - get_vector_store_credentials has no caller at the pin; the vector-store-registry task owns litellm.vector_store_registry.get_litellm_managed_vector_store_from_registry that it would call.

pitfalls:
  - "Vertex credential comparison requires identity-based equality: two deployments storing credentials under the same key (as JSON or string) are treated as agreeing even if they differ on other fields. Untyped deserialization of vertex_credentials from credential_values as either string or dict is fragile; non-string, non-dict values silently become None."
  - "Model name aliases split on the last \"/\": \"models/gemini-2.0\" becomes \"gemini-2.0\". The path splitting is provider-agnostic; providers with different path conventions still match on the last component."
  - "Deployment order matters: the first matching deployment's credentials are returned without checking whether later deployments also match. This preserves LiteLLM's behavior but can hide configuration mistakes."
  - "Region extraction for AssemblyAI checks substring containment (\"eu\" in api_base); other regions are not detected, and non-AssemblyAI providers never extract region."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
