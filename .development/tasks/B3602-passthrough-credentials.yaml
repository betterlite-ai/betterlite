id: B3602
title: Pass-through provider credential lookup
description: >-
  Build typed deployment and environment credential lookup in the pass-through
  server module, preserving provider matching, deployment order and Vertex
  project/location defaults. Resolve environment values through betterlite-config;
  never search unrelated deployment identities after an explicit match fails.

  The PassthroughEndpointRouter class serves as a credential resolver for
  pass-through endpoints. It accepts a LiteLLM Router and reads deployments
  flagged `use_in_pass_through` to locate API keys and Vertex credentials
  by provider name, region and model. Lookups check deployment configuration
  credentials first (through the CredentialAccessor), fall back to litellm_params,
  then fall back to environment variables when no deployment matches.

  For standard API keys, `get_credentials` takes a provider and optional region,
  returns the matching deployment's api_key or the environment variable
  `{PROVIDER}_API_KEY`. Deployments match when their configured model resolves
  to the requested provider and the api_base region (if present) matches.
  Provider matching uses B174's get_llm_provider; region extraction for
  AssemblyAI checks for "eu" in the api_base.

  For Vertex, `get_vertex_credentials_from_router_deployments` returns a
  VertexPassThroughCredentials record with project, location and credentials.
  When a model is named, return the matching deployment's record. Without a model,
  accept only if all Vertex deployments agree on a single project/location/credential
  combination; return None if two deployments disagree (guessing would mint a
  token for one project then send another's model). The default_vertex_config and
  deployment_key_to_vertex_credentials map preserve Vertex defaults set via
  `set_default_vertex_config` or `add_vertex_credentials`.

  Deployment-matching uses the literal model_name, the litellm_params model,
  and the last component after "/" in the litellm_params model (e.g.
  "publisher/model-name" matches "model-name"). Stored credential values
  override litellm_params when present; absent keys fall back to litellm_params.
  Credential records parsed from litellm_credential_name check for
  vertex_credentials as either string or dict; reject other types.

  Defaults and fallbacks: `_get_default_env_variable_name_passthrough_endpoint`
  returns `{PROVIDER}_API_KEY` by uppercase provider name (e.g.,
  `ASSEMBLYAI_API_KEY`). Vertex environment variables read from
  DEFAULT_VERTEXAI_PROJECT, DEFAULT_VERTEXAI_LOCATION and
  DEFAULT_GOOGLE_APPLICATION_CREDENTIALS when set_default_vertex_config receives
  None or os.environ/ prefixed values. `_credential_identity` serializes dicts as
  sorted JSON for comparison; string credentials use themselves. `_get_str_value`
  returns None for non-string values, enabling safe extraction from untyped dicts.

  Build in crates/betterlite-server as the pass_through_credentials module
  with the PassthroughEndpointRouter class and typed credentials resolution.
  This module is consumed by other pass-through tasks and exposes its
  public methods through the server library. Keep this lower than provider-
  and route-specific tasks so they can depend on it without circular deps.

