dod:
  - text: >-
      Standard credentials for single-provider, single-region requests resolve from
      matching deployments or fallback to environment variables in the correct order.
    proof: [credential-resolution-tests, oracle]
  - text: >-
      Deployments match by provider (resolved via B174), api_base region and
      model name aliases; unmatched requests never fall through to unrelated deployments.
    proof: [deployment-matching-tests, oracle]
  - text: >-
      Vertex credential lookup returns a matching deployment when model is named,
      a unanimous default when all Vertex deployments agree, and None when they disagree.
    proof: [vertex-credential-tests, oracle]
  - text: >-
      get_vertex_credentials resolves credentials by project-location deployment_key,
      returning the stored credentials on key hit, falling back to default_vertex_config
      on key miss, and returning default_vertex_config when project_id or location is None.
    proof: [vertex-credentials-by-project-location, oracle]
  - text: >-
      Stored credentials from CredentialAccessor override litellm_params; absent keys
      safely fall back without panicking on non-string or non-dict values.
    proof: [credential-accessor-tests, oracle]
  - text: >-
      Default Vertex config is set from environment or provided dict, with os.environ/
      prefix resolution; it is used when no deployment-specific creds are stored.
    proof: [vertex-default-config-tests, oracle]
  - text: >-
      Credential identity comparison preserves dict/string distinction for Vertex
      credential matching; two deployments with the same dict or string identity
      are treated as holding the same credential.
    proof: [credential-identity-tests]

checks:
  optional: []
  commands:
    - id: credential-resolution-tests
      why: Credentials do not resolve from deployments or environment in the correct order.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_credentials::tests::credential_resolution(::|$)/)'
    - id: deployment-matching-tests
      why: Deployments match on wrong criteria or lookups do not respect provider boundaries.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_credentials::tests::deployment_matching(::|$)/)'
    - id: vertex-credential-tests
      why: Vertex credential lookup returns wrong records or fails to detect disagreement.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_credentials::tests::vertex_credentials(::|$)/)'
    - id: vertex-credentials-by-project-location
      why: get_vertex_credentials does not resolve by deployment_key or does not fall back correctly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_credentials::tests::vertex_credentials_by_project_location(::|$)/)'
    - id: credential-accessor-tests
      why: CredentialAccessor values are not applied correctly or override logic fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_credentials::tests::credential_accessor(::|$)/)'
    - id: vertex-default-config-tests
      why: Default Vertex config is not set, persisted or used as fallback.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_credentials::tests::vertex_default_config(::|$)/)'
    - id: credential-identity-tests
      why: Credential identity does not correctly identify matching dicts or strings.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_credentials::tests::credential_identity(::|$)/)'

