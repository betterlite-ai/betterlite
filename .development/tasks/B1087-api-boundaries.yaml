checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::/) - test(/::replays_corpus$/)'
  - id: case-json-at-cap
    why: the json-at-cap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::tests::json_at_cap($|::)/)'
  - id: case-json-over-cap
    why: the json-over-cap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::tests::json_over_cap($|::)/)'
  - id: case-event-at-cap
    why: the event-at-cap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::tests::event_at_cap($|::)/)'
  - id: case-event-over-cap
    why: the event-over-cap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::tests::event_over_cap($|::)/)'
  - id: case-items-at-cap
    why: the items-at-cap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::tests::items_at_cap($|::)/)'
  - id: case-items-over-cap
    why: the items-over-cap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::tests::items_over_cap($|::)/)'
  - id: deviation-tests
    why: the documented compatibility difference lacks a native assertion
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::api_boundaries::tests::compatibility_deviations($|::)/)'
oracle_cases: []
deviations:
- what: API JSON inputs are capped at 16 MiB, provider events at 1 MiB and collected items at 65536; overflows return
    the typed limit errors named in the description.
  why: The bounded-inputs rule requires finite memory use where these pinned family implementations lack uniform
    caps; file/audio byte streams and batch JSONL stay incremental.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L300-L532
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
pitfalls:
- A single event over 1 MiB returns event_too_large; the 16 MiB JSON request cap does not replace this streaming
  event cap.
- Guard checked counts before allocation and treat cap+1 as overflow without truncating an input collection.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 0
