id: B1087
title: Api boundaries
description: >-
  Define ApiLimits and checked JSON/event/item guards below API modules. ApiLimits is max_json_bytes=16777216, max_event_bytes=1048576
  and max_items=65536. Reuse B198 deadlines/B206 metadata and B014 dispatch; file/audio and batch JSONL remain streamed.


  This task introduces no byte decoder and no fuzz target. Arithmetic/length guards take already known sizes. Test
  exact cap and cap+1 for each limit: JSON overflow 413 invalid_request_error/body/request_too_large; provider event
  overflow 502 bad_gateway/stream/event_too_large; request collection overflow 400 invalid_request_error/input/too_many_items.
  Domain decoders own fuzz/replay later.


  Implement crates/betterlite-core/src/api/api_boundaries.rs. Use ApiBoundariesInput and ApiBoundariesResult with
  typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Define ApiLimits here.


  Write adjacent tests.rs behavior functions json_at_cap, json_over_cap, event_at_cap, event_over_cap, items_at_cap,
  items_over_cap under api::api_boundaries::tests. Each named function drives production code and asserts its case
  result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  This task owns the declarative types/tooling boundary named above, not additional LiteLLM callables. Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 0 owned nonblank/non-comment/non-docstring Python lines (0 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 110 implementation,
  76 behavior tests, 0 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 216 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B014 (Call dispatch across providers and call
  types, shared settings and helpers), B198 (Injected call context and shared settings), B206 (Common call metadata
  and response helpers). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api/api_boundaries.rs
  - crates/betterlite-core/src/api/api_boundaries/**
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - Cargo.toml
  - Cargo.lock
  - crates/betterlite-core/src/api/limits.rs
  - crates/betterlite-core/src/api/limits/**
  - crates/betterlite-core/src/operation.rs
  - crates/betterlite-core/src/operation/**
  - crates/betterlite-core/src/dispatch.rs
  - crates/betterlite-core/src/dispatch/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L300-L361
  why: Shared dependency/call-site context; ownership is only the callable list above.
dod:
