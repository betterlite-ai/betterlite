dod:
  - text: The PKCE check accepts the S256 digest of the verifier, rejects a wrong or non-ASCII challenge without failing, and compares in constant time.
    proof: [support-tests, oracle]
  - text: A missing master key or an invalid signing configuration answers 500 before any grant is looked at, and every ReloadUserFailure, ProxyCredentialMintFailure and SubjectTokenRefusal maps to its own status, error and text.
    proof: [support-tests, oracle]
  - text: An authorization code grant checks the form, the verifier length, the sealed code, expiry, client and redirect binding, the resource scope and PKCE in LiteLLM's order with each message.
    proof: [grants-tests, oracle]
  - text: A valid code with no audience returns the session pair with a 3600 second access token, and a code with the proxy_api audience returns the proxy credential body with the minted key, user, team and a refresh token bound to the minted team.
    proof: [issuer-tests, grants-tests, oracle]
  - text: The single-use claim comes after the live user reload and the credential mint, so a transient 503 or a mint refusal does not burn the code, and a replayed code or refresh token is 400 invalid_grant while an unavailable record is 503.
    proof: [issuer-tests, grants-tests, oracle]
  - text: The refresh grant rejects a missing, invalid or other-client token and a resource conflict, rotates the pair for the same principal, and burns the old token.
    proof: [grants-tests, oracle]
  - text: A resource sent with a scoped code or refresh token must resolve to the sealed server or the grant is invalid_target, an unscoped grant ignores it, and a proxy_api grant requires the proxy API resource.
    proof: [grants-tests, issuer-tests, oracle]
  - text: The token exchange grant checks the client (401), the subject token fields, the subject token type list and the requested type, then returns the proxy credential with issued_token_type and no single-use claim.
    proof: [grants-tests, issuer-tests, oracle]
  - text: Revocation burns a live refresh token of the right client, answers 200 for everything else, refuses an unknown client with 401 and answers 503 when the burn cannot be recorded.
    proof: [revoke-tests, oracle]
  - text: Introspection answers active false for foreign, tampered, expired, burned-refresh and deactivated-user tokens, 503 for an unavailable record or database, and the full active body with optional claims for a live token.
    proof: [introspect-tests, oracle]
  - text: Unknown grant types answer 400 unsupported_grant_type with the three-grant text.
    proof: [grants-tests, oracle]
checks:
  optional: [mutants]
  commands:
    - id: support-tests
      why: The shared reply, PKCE and failure mapping tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_token::support::tests::/)'
    - id: issuer-tests
      why: The grant issuer tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_token::issuer::tests::/)'
    - id: grants-tests
      why: The token verb and grant tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_token::grants::tests::/)'
    - id: revoke-tests
      why: The revocation tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_token::revocation::tests::/)'
    - id: introspect-tests
      why: The introspection tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_token::introspection::tests::/)'
    - id: helper-python
      why: The helper adapter is missing or fails strict Python checks.
      run: test -f tools/oracle/helpers/b4676.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4676 operation reaches the shared helper case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-gateway-token-*')" && grep -rlq b4676 tools/oracle/fuzz/corpus/helper_case/mcp-gateway-token-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
