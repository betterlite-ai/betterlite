id: B4676
title: "MCP gateway token grants, revocation and introspection"
description: >-
  Build the token half of the MCP gateway's own OAuth front door (LiteLLM's gateway_dcr_flow.py from _pkce_verifier_matches to the end of the file) in crates/betterlite-mcp, new module gateway_token. It covers the aggregate token verb with its three grants (authorization_code, refresh_token, RFC 8693 token exchange), POST /revoke (RFC 7009) and POST /introspect (RFC 7662) as pure functions. B4674 owns the constants, sealed models, OauthError, the port traits, open_sealed and the single-use guard in module gateway_dcr. B4675 (module gateway_authorize) seals the auth code this task opens and owns is_proxy_api_resource and resolve_scoped_resource_server in its scope submodule. Import all of those, never copy them. Session tokens come from B4652 (mint_session_token, open_session_token, SessionPrincipal, OpenedSessionToken, SessionTokenKind, SessionSigningKeys, SESSION_ISSUER, SESSION_REFRESH_TTL_SECONDS and the SessionPrefix checks) and B4653 (open_session_refresh_bearer, resolve_session_signing_keys, SessionSigningConfigError).


  Nothing here touches axum, a clock, a random source or a global. A route parses the form and passes plain values in. Every function returns a TokenReply and the route turns it into an HTTP response. The routes (POST /token and POST /{mcp_server_name}/token for gateway client ids, POST /revoke, POST /introspect behind the virtual-key dependency) belong to the umbrella and to B7321, so this task has helper cases only. The real implementations of the ports (live user reload, proxy credential minting, IdP subject token proof) are B4658 and B4663 and are wired at the composition root; this task only calls the B4674 traits.


  Submodules, each with a tests.rs beside it. The test modules are named in the checks.


  support. TokenReply is an enum: Json { status: u16, body: a typed serde struct, headers } for success and Error(OauthError) from B4674. Every Json reply carries B4654's TOKEN_NO_CACHE_HEADERS. The bodies are typed structs: SessionPairBody { access_token, token_type "Bearer", expires_in, refresh_token }, ProxyCredentialBody { access_token, token_type "Bearer", expires_in, refresh_token, user_id, team_id: Option (serialized as null when absent, not omitted), issued_token_type: Option (omitted when absent) }, RevokedBody (an empty object, serialized as {}) and IntrospectionBody (see introspection). SigningSetup is an enum the route builds: NoMasterKey, Invalid(SessionSigningConfigError) and Ready(SessionSigningKeys); the route gets it from B4653's resolve_session_signing_keys. signing_refusal(setup) turns the first two into 500 server_error "the gateway has no master key configured" and 500 server_error "the gateway session signing configuration is invalid". SessionEntropy is a trait with one method returning Result<[u8; 16], Unspecified> (the jti source mint_session_token wants); the composition root supplies a random-backed one and tests supply fixed bytes. pkce_verifier_matches(code_verifier, code_challenge) hashes the verifier with SHA-256 after replacing every non-ASCII character with "?" (Python's encode("ascii", "replace")), encodes the digest as base64url without padding, and compares it to the challenge bytes in constant time (a different length is false, never an error); use ring's digest and constant_time or the subtle crate, no hand-written compare. reload_failure_error(failure) maps B4674's ReloadUserFailure: unavailable 503 temporarily_unavailable with DB_UNAVAILABLE_DESCRIPTION, faulted 503 temporarily_unavailable with DB_FAULTED_DESCRIPTION, unresolvable 500 server_error "the gateway is not configured to resolve users", no_active_key 400 invalid_grant "the user for this grant is no longer active". subject_refusal_error(refusal) maps SubjectTokenRefusal: temporarily_unavailable is 503, unsupported_grant_type and invalid_request are 400, each with the refusal's own description. mint_failure_error(failure) maps ProxyCredentialMintFailure: not_a_member 400 invalid_grant "the user is no longer a member of the team this grant was issued for", team_required 400 invalid_grant "this user belongs to a team; sign in again and pick the team for this credential", and the four reload failures through reload_failure_error. The match on each enum is exhaustive with no wildcard arm.


  issuer. GrantIssuer is built per request from: the SigningSetup keys, the resource (Option), base_url, now, and the ports as generic parameters (ReloadUser, MintProxyCredential, a SingleUseGuard from B4674). Its entry issue(principal, claim_key, claim_ttl_seconds, replayed_message) branches on principal.audience. No audience is the session pair: reload_user first (a failure goes through reload_failure_error), then the single-use claim through B4674's claim_refusal with the replayed error 400 invalid_grant and replayed_message, then both tokens are minted (access with SessionTokenKind::Session, refresh with SessionTokenKind::Refresh, both for the same principal) and the reply is 200 SessionPairBody with expires_in equal to the access token's expires_at minus now in whole seconds (3600 at the pin). A mint failure after the claim is 500 server_error "failed to mint the session credential"; the claim is not rolled back. Audience proxy_api is the proxy credential: proxy_api_target_refusal first, then mint_proxy_credential(user_id, team_id) (a MintProxyCredential failure goes through mint_failure_error), then the claim, then ProxyCredentialBody. The refresh token in that body is minted for the principal with its team_id replaced by the minted credential's team_id, so a renewal keeps the team the user consented to; access_token is the minted key, expires_in and user_id and team_id come from the minted credential. The reload for a proxy credential happens inside the mint port, so the issuer does not call reload_user on that path. proxy_api_target_refusal is None when resource is None or is_proxy_api_resource(base_url, resource) holds, else 400 invalid_target "resource does not match the proxy API this grant was issued for". exchange(subject_token, client_id, context) is the RFC 8693 tail: proxy_api_target_refusal, then exchange_subject_token(subject_token, context) (a refusal goes through subject_refusal_error), then a principal of the identity's user_id and team_id with the client id and audience proxy_api, then mint_proxy_credential, then the same ProxyCredentialBody with issued_token_type B4674's ACCESS_TOKEN_TOKEN_TYPE. There is no single-use claim on the exchange path, on purpose.


  grants. aggregate_token(setup, form, ports, registry, cipher, now) is async and returns TokenReply. Order: signing_refusal (NoMasterKey or Invalid, before anything else, so even an unknown grant_type gets the 500 on a misconfigured gateway); then build the issuer; then dispatch on grant_type: "authorization_code", "refresh_token", B4674's TOKEN_EXCHANGE_GRANT_TYPE; anything else is 400 unsupported_grant_type "grant_type must be authorization_code, refresh_token, or urn:ietf:params:oauth:grant-type:token-exchange" (the token-exchange name is always in the text, even when the gateway cannot exchange). form is a struct of borrowed Option<&str> fields: grant_type, code, redirect_uri, client_id, code_verifier, refresh_token, resource, subject_token, subject_token_type, requested_token_type. Authorization code grant, checks in this order: code, redirect_uri or code_verifier missing or empty gives 400 invalid_request "code, redirect_uri, and code_verifier are required"; verifier length outside MIN_CODE_VERIFIER_LENGTH to MAX_CODE_VERIFIER_LENGTH (count code points) gives 400 invalid_request "code_verifier must be 43 to 128 characters (RFC 7636)"; open_sealed(code, GATEWAY_AUTH_CODE_PREFIX, GatewayAuthCode) failing gives 400 invalid_grant "the authorization code is invalid"; now (whole seconds) >= exp gives 400 invalid_grant "the authorization code has expired"; client_id or redirect_uri differing from the sealed ones gives 400 invalid_grant "the authorization code was issued to a different client"; resource_conflicts_with_scope gives 400 invalid_target "resource does not match the scope this code was issued for"; a failed pkce_verifier_matches gives 400 invalid_grant "PKCE verification failed". Then issue with a principal of the code's user_id, the request client_id, and the code's resource_server_id, audience and team_id, claim key B4674's code-used prefix plus the code jti, claim ttl = exp minus now seconds plus CLAIM_TTL_BUFFER_SECONDS, replayed message "the authorization code was already used". Refresh grant: an absent or empty refresh_token is 400 invalid_request "refresh_token is required"; B4653's open_session_refresh_bearer with the request client_id not returning SessionRefreshOpened is 400 invalid_grant "the refresh token is invalid for this client"; resource_conflicts_with_scope against the opened principal's resource_server_id gives 400 invalid_target "resource does not match the scope this token was issued for"; then issue with the opened principal, claim key B4674's refresh-used prefix plus the token jti, ttl SESSION_REFRESH_TTL_SECONDS plus CLAIM_TTL_BUFFER_SECONDS, replayed message "the refresh token was already used". The rotated refresh token keeps the old principal, so scope, audience and team survive a refresh. Token exchange grant: a client_id that fails is_gateway_dcr_client_id or does not open with open_gateway_dcr_client is 401 invalid_client "unknown or malformed client_id" (401 here, 400 in the authorize half); a missing or empty subject_token or subject_token_type is 400 invalid_request "subject_token and subject_token_type are required"; a subject_token_type outside SUBJECT_TOKEN_TYPES is 400 invalid_request "subject_token_type must be one of " plus the sorted types joined by ", "; a requested_token_type that is present and not ACCESS_TOKEN_TOKEN_TYPE is 400 invalid_request "requested_token_type must be urn:ietf:params:oauth:token-type:access_token"; then issuer.exchange. resource_conflicts_with_scope(base_url, registry, resource, sealed_resource_server_id) is false when either is None; else it resolves resource with B4675's resolve_scoped_resource_server and is true when that gives None or a server whose server_id differs from the sealed one. An unscoped grant ignores resource entirely.


  revocation. revoke_refresh_token(token, client_id, setup, guard, cipher, now) is async. Order: unknown or malformed client_id is 401 invalid_client "unknown or malformed client_id"; then signing_refusal; then, only when open_session_refresh_bearer opens the token for this client, burn it with guard.claim on B4674's refresh-used prefix plus the jti and ttl SESSION_REFRESH_TTL_SECONDS plus CLAIM_TTL_BUFFER_SECONDS; an unavailable outcome is 503 temporarily_unavailable with CLAIM_UNAVAILABLE_DESCRIPTION. Every other case, including a garbage token, an expired token, a token of another client, an access token and an already burned token, is 200 with RevokedBody and TOKEN_NO_CACHE_HEADERS, so revocation reveals nothing about the token.


  introspection. introspect_gateway_token(token, setup, reload_user, guard, now) is async. Order: signing_refusal, but a bad signing config here answers 500 server_error with the error's own text (see deviations); a token that is neither is_session_token nor is_session_refresh_token is the inactive reply (200, body {"active": false}); the matching open_session_token (kind Session or Refresh) failing for any reason is inactive; a refresh token is then looked up with guard.peek on B4674's refresh-used prefix plus the jti, where unavailable is 503 temporarily_unavailable with CLAIM_UNAVAILABLE_DESCRIPTION and claimed is inactive; then reload_user for the principal's user: unavailable and faulted answer 503 through reload_failure_error, unresolvable and no_active_key are both inactive (not 500 and not 400); a live user gives the active body. IntrospectionBody keys come out in this order: active true, iss SESSION_ISSUER, sub (user id), client_id, jti, iat, exp, kind ("session" or "session_refresh"), then token_type "Bearer" only for kind session, team_id, resource_server_id and audience, each only when set. The route's virtual-key dependency is not part of this task.


  Helper adapter. The Python side builds a Starlette Request from a scope the case supplies, sets a fixed master key and salt key, registers synthetic MCPServer objects in a fresh manager for the scoped cases, patches the module's datetime so now is the case's clock, uses a real in-memory DualCache as the guard store, and passes fake reload_user, mint_proxy_credential and exchange_subject_token functions whose answers the case lists. A case may first mint a client id, an auth code or a refresh token with LiteLLM's own functions (a setup step in the case), so the token call receives a value that opens. The helper reports status, headers and the response body, but replaces every token string by what it opens to (principal, kind, iat, exp), because signatures and jti values differ run to run. The Rust side maps the same case to the functions above with a fixed SessionEntropy.
