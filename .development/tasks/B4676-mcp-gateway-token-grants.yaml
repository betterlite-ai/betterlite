deviations:
  - what: The signing keys, the clock, the jti source, the single-use authority, the cipher, the server registry and the request base URL are passed in. LiteLLM reads master_key, the settings, datetime.now, secrets and the proxy cache inside each function.
    why: betterlite keeps no module state, so cases fix the clock and entropy and compare what the tokens open to, never the signed strings.
  - what: When the signing configuration is invalid, introspection answers 500 server_error with the text of SessionSigningConfigError ("mcp_session_token_signing is misconfigured" and the like). LiteLLM answers with the Python error's detail string, which can embed a library exception message.
    why: Typed errors have no free-form detail, and the library message is not part of the contract. Status and error code are unchanged.
  - what: A failure to mint a token (a signing fault, a token over the size limit, a failed random source) answers 500 server_error "failed to mint the session credential" in every case. LiteLLM checks only that the result is a MintedSessionToken.
    why: B4652 returns a typed MintError, and the same single answer keeps the wire text identical.
out_of_scope:
  - "gateway_dcr_flow.py constants, models, OauthError, sealing, register_aggregate_client, the port traits (ReloadUser, MintProxyCredential, ExchangeSubjectToken), the refusing defaults, supported_grant_types, ClaimOutcome, claim_refusal and the single-use guard with peek: B4674."
  - "register, authorize, the connect flow, consent, is_proxy_api_resource, resolve_scoped_resource_server and the discovery document: B4675."
  - "Session token minting, opening and claims: B4652. open_session_refresh_bearer and signing key resolution: B4653."
  - "The routes /token, /{mcp_server_name}/token, /revoke and /introspect in discoverable_endpoints.py, and the server-level token exchange branch of token_endpoint: the umbrella B137 and B7321."
  - "_reload_active_user_by_id and mint_proxy_credential: B4658. exchange_idp_subject_token: B4663."
pitfalls:
  - "aggregate_token checks the master key and the signing config before it looks at grant_type, so a bad config answers 500 even for an unknown grant, and a missing code answers 400 only on a healthy gateway."
  - "The single-use claim is the last gate. The live user reload (session pair) or the proxy credential mint (proxy_api audience) runs first, so a database 503 or a team_required refusal never burns a still-valid code or refresh token."
  - "The session pair path reloads the user itself, but the proxy_api path does not: the mint port does the reload, and calling both would double the database lookups."
  - "The claim for an auth code lasts exp minus now plus 60 seconds, not a fixed time, so a 300 second manual-delivery code is covered for its whole life."
  - "A refresh rotation keeps the old principal unchanged, but for a proxy credential the new refresh token carries the team_id the credential was minted for, which can differ from the one in the old token."
  - "code_verifier length counts characters, yet the hash is taken after replacing each non-ASCII character with a single '?', so a verifier of 43 emoji is length-valid and then fails PKCE, never a panic."
  - "The invalid_client for a token exchange is 401, while the same text from the authorize half is 400."
  - "The exchange grant is dispatched even when the gateway has no IdP exchange configured; then B4674's RefuseSubjectToken answers 400 unsupported_grant_type 'this gateway is not configured to exchange IdP tokens', and the grant name stays in the unsupported_grant_type text of other grants."
  - "Revocation ignores a token of the wrong family or another client and still answers 200 with {}; only the client check (401) and an unrecordable burn (503) are errors."
  - "Introspection treats unresolvable and no_active_key as inactive, while unavailable and faulted are 503; a refresh token is peeked before the user reload, and an access token is never peeked."
  - "Introspection does not strip a Bearer prefix and tests the llm_session_ and llm_srefresh_ prefixes literally, so 'Bearer llm_session_...' is inactive."
  - "team_id in the proxy credential body is JSON null when the credential has no team, while resource_server_id and audience are left out of the introspection body when unset."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
