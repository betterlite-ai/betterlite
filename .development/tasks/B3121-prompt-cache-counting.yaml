dod:
  - text: cache_scope returns a hex digest of the sha256 hash of the scope tuple (caller_key_hash, deployment_id, provider_key, model, anthropic_version).
    proof: [cache-scope-test]
  - text: "count_prompt_tokens calls the native Anthropic /count_tokens endpoint with a 15-second timeout, returning the input token count or None on any provider/validation failure."
    proof: [count-prompt-tokens-test]
  - text: "count_cache_plan counts tokens for every breakpoint in the cache plan, rejects thinking blocks when the model does not support thinking cache preservation, and returns CountedPromptCachePlan or UnsupportedCachePlan."
    proof: [count-cache-plan-test]
  - text: "resolve_prediction_target only accepts Anthropic deployments with public endpoints (api.anthropic.com), rejecting unsupported_deployment_configuration when extra options exist."
    proof: [deployment-config-extra-option]
  - text: "resolve_prediction_target rejects unsupported_provider_endpoint when api_base is not public (e.g. custom endpoint or non-anthropic.com domain)."
    proof: [endpoint-non-public]
  - text: "resolve_prediction_target rejects unsupported_provider when custom_llm_provider is not anthropic or model resolution fails."
    proof: [provider-not-anthropic]
  - text: "resolve_prediction_target rejects unsupported_provider_credentials when api_key is None, empty, or an OAuth key via is_anthropic_oauth_key."
    proof: [credentials-missing-or-oauth]
  - text: "resolve_baseline_target accepts both public and configured Anthropic endpoints, used for observation baseline validation, returning the same UnsupportedPredictionTarget variants."
    proof: [resolve-baseline-test]
  - text: "supported_prediction_headers rejects anthropic-beta and enforces anthropic-version == DEFAULT_ANTHROPIC_API_VERSION (2023-06-01)."
    proof: [headers-test]
  - text: "supported_baseline_recipient checks that the request URL matches the native messages URL and x-api-key matches the target's api_key."
    proof: [baseline-recipient-test]
