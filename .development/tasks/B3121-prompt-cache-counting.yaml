id: B3121
title: Resolve native cache prediction targets and count prompt boundaries
description: >-
  Build the native Anthropic cache prediction target resolver and token counter service in `betterlite-anthropic`,
  distinguishing public-endpoint prediction from configured-endpoint baseline paths.
  Resolve provider credentials and identity from existing credential and model crates, inject the messages URL builder,
  and count prompt tokens within a 15-second timeout using the native provider counting endpoint.
  Reuse B3120's parsed plans and observational data to construct counted breakpoints with both fingerprint families.

  The module exports `cache_scope` to hash the scope tuple (caller_key_hash, deployment_id, provider_key, model, anthropic_version)
  and the `TokenCounter` protocol for async token counting.
  `count_prompt_tokens` calls the provider's native count_tokens endpoint with 15-second timeout, returning None on any failure.
  `count_cache_plan` counts tokens for each breakpoint in a cache plan, returning counted records or an unsupported reason.
  `resolve_prediction_target` resolves a deployment to native Anthropic info for public-endpoint prediction.
  `resolve_baseline_target` allows configured endpoints for baseline-event observations.
  `supported_prediction_headers` and `supported_baseline_recipient` filter requests by Anthropic-specific headers and URL paths.

scope:
  paths:
    - crates/betterlite-anthropic/src/cache_prediction_targets.rs
    - crates/betterlite-anthropic/src/cache_prediction_targets/**
  lint_tables: false
