oracle_cases: []
deviations:
  - what: "count_prompt_tokens uses the injected TokenCounter protocol instead of directly importing Anthropic counting internals."
    why: "Inversion of control prevents circular imports between betterlite-anthropic and the core provider integration; callers inject the counting implementation."
  - what: "UnsupportedPredictionTarget reasons are enumerated (unsupported_deployment_configuration, unsupported_provider_endpoint, unsupported_provider, unsupported_provider_credentials) instead of returning an error string."
    why: "Typed errors allow callers to distinguish recovery paths and log meaningful context without pattern matching on text."
  - what: "cache_scope hashes the full deployment context in one digest instead of storing components separately."
    why: "A single hash ensures consistency across cache observations and avoids exposing credential material in intermediate values."
out_of_scope:
  - Observing and storing cache evidence; that belongs to B3122.
  - Pricing cache scenarios or routing; that belongs to B3123 and B3124.
  - Serving cache predictions via HTTP; that belongs to B3125.
  - "Thinking cache preservation capability definition; this task only rejects counting when the capability check returns unsupported. The capability check itself delegates to model metadata resolution (B174, B2219, B2220)."
pitfalls:
  - "The 15-second timeout applies to the entire count_prompt_tokens call, not per-request to the provider. Use tokio::time::timeout with a Duration, not a per-connection timeout."
  - "count_cache_plan uses asyncio.gather in LiteLLM to count breakpoints in parallel. Use tokio::join! or futures::future::join_all in Rust, not sequential awaits."
  - "Thinking cache support check: call _positions (owned by B3120) to detect thinking blocks in the prompt. If thinking blocks are present, resolve the model metadata via B2219's resolver to read the supports_thinking_cache_preservation field of the returned record. Reject the count if the field is false."
  - "api_base may be None (environment-resolved) or an explicit URL; AnthropicModelInfo.get_api_base normalizes both. Pass the result to _messages_url, which builds the full /v1/messages path."
  - "OAuth keys (is_anthropic_oauth_key check) must be rejected for native prediction because they are not API keys and cannot hit the count_tokens endpoint."
  - "DEFAULT_ANTHROPIC_API_VERSION is defined in the pass_through module from LiteLLM; import it or hardcode the 2023-06-01 literal exactly as LiteLLM uses it."
  - "supported_prediction_headers must reject anthropic-beta entirely and enforce anthropic-version exactly. Case-insensitive header names are required."
  - "resolve_baseline_target allows configured endpoints for baseline observation validation, while resolve_prediction_target rejects them for public-only prediction."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
