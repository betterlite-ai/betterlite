pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_other_canvas_results in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/other_canvas_results.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_other_canvas_results.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A truthy images list suppresses provider error fields before falsey image entries are filtered.
- The provider decoder wraps errors using the upstream status even when that status is 200.
