checks:
  optional:
  - mutants
  commands:
  - id: case-canvas-images-array
    why: Parse JSON before checking HTTP status. At status exactly 200, use response_data.get(images) or []; truthy
      image entries become ordered ImageObject(b64_json=value,url=None,revised_prompt=None), while falsey entries
      are skipped. Construct a fresh ImageResponse, retaining shared default creation/object/usage fields; no upstream
      size, usage, created or model metadata is copied. Ensure hidden_params.additional_headers exists.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_images_array$/)'
  - id: case-canvas-error-object
    why: 'After parsing, every status other than 200 raises B635/B682 error with that status, original headers and
      Nova Canvas image edit error: {response_data}. At 200, presence of errors plus falsey images raises the same
      prefix with response_data[errors], including empty errors or None. Otherwise choose truthy message then error;
      when truthy and images falsey, stringify nonstrings and raise the same prefix. A truthy images container suppresses
      both error branches even if all entries will be skipped. Do not inspect finish_reasons.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_error_object$/)'
  - id: case-canvas-empty-images
    why: After removing falsey entries, an empty data list raises B635/B682 error with original HTTP status and
      headers and exact message Nova Canvas image edit returned no images. This can be an error with status200.
      Error priority is non-200 body, errors-key, message/error, then empty filtered image list.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_empty_images$/)'
  - id: case-canvas-malformed-reply
    why: 'decode_canvas_reply failure raises B635/B682 with original status/headers and Error parsing Nova Canvas
      image edit response: {decoder_error}. Only raw JSON decoding is caught: parsed null/array/other malformed
      shapes fail at their later field accesses without this wrapper. Preserve this distinction from the B638 outer
      decoder, which may reject malformed JSON/null before the provider transform.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_malformed_reply$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_canvas_results.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_results*")"
      && grep -lq 'bedrock_other_canvas_results' tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_results*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_canvas_results$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_other_canvas_results)"
      && grep -q 'decode_canvas_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_canvas_results.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_other_canvas_results_corpus$/)'
  - id: case-canvas-response-cost
    why: B068 looks up get_model_info(model,custom_llm_provider=bedrock), defaults absent output_cost_per_image
