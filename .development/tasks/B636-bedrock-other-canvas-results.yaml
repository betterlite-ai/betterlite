checks:
  optional:
  - mutants
  commands:
  - id: case-canvas-images-array
    why: The canvas-images-array behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_images_array$/)'
  - id: case-canvas-error-object
    why: The canvas-error-object behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_error_object$/)'
  - id: case-canvas-response-usage
    why: The canvas-response-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_response_usage$/)'
  - id: case-canvas-result-size
    why: The canvas-result-size behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_result_size$/)'
  - id: case-canvas-empty-images
    why: The canvas-empty-images behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_empty_images$/)'
  - id: case-canvas-malformed-reply
    why: The canvas-malformed-reply behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::canvas_results_cases::case_[0-9]+_canvas_malformed_reply$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_canvas_results.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_results*")"
      && grep -lq 'bedrock_other_canvas_results' tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_results*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_canvas_results$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_other_canvas_results)"
      && grep -q 'decode_canvas_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_canvas_results.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_other_canvas_results_corpus$/)'
