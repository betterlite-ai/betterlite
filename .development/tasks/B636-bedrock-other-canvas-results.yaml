  - tools/oracle/src/helpers/bedrock_other_canvas_results.rs
  - tools/oracle/src/helpers/bedrock_other_canvas_results/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_other_canvas_results.py
  - tools/oracle/cases/helpers/providers/bedrock-other-canvas-results/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_results*
