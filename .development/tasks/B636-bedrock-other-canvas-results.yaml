id: B636
title: Bedrock Nova Canvas edit results
description: >-
  Add CanvasEditReply normalization, preserving images/errors and the shared ImageResponse defaults. Reuse exact
  typed image response models and keep multiple image results ordered; tests include provider filter/error variants
  and optional field absence.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_edit/amazon_nova_canvas_image_edit_transformation.py:
  BedrockAmazonNovaCanvasImageEditConfig.transform_image_edit_response pre-cost branch L387-L455 and return L466-L466.


  B068 owns the catalog cost lookup/multiplication at L456-L464, including swallowing lookup and conversion errors;
  call that helper and retain its optional response-cost metadata without reconstructing the algorithm here.


  Named case contracts: canvas_images_array: Parse JSON before checking HTTP status. At status exactly 200, use
  response_data.get(images) or []; truthy image entries become ordered ImageObject(b64_json=value,url=None,revised_prompt=None),
  while falsey entries are skipped. Construct a fresh ImageResponse, retaining shared default creation/object/usage
  fields; no upstream size, usage, created or model metadata is copied. Ensure hidden_params.additional_headers
  exists. canvas_error_object: After parsing, every status other than 200 raises B635/B682 error with that status,
  original headers and Nova Canvas image edit error: {response_data}. At 200, presence of errors plus falsey images
  raises the same prefix with response_data[errors], including empty errors or None. Otherwise choose truthy message
  then error; when truthy and images falsey, stringify nonstrings and raise the same prefix. A truthy images container
  suppresses both error branches even if all entries will be skipped. Do not inspect finish_reasons. canvas_empty_images:
  After removing falsey entries, an empty data list raises B635/B682 error with original HTTP status and headers
  and exact message Nova Canvas image edit returned no images. This can be an error with status200. Error priority
  is non-200 body, errors-key, message/error, then empty filtered image list. canvas_malformed_reply: decode_canvas_reply
  failure raises B635/B682 with original status/headers and Error parsing Nova Canvas image edit response: {decoder_error}.
  Only raw JSON decoding is caught: parsed null/array/other malformed shapes fail at their later field accesses
  without this wrapper. Preserve this distinction from the B638 outer decoder, which may reject malformed JSON/null
  before the provider transform. canvas_response_cost: B068 looks up get_model_info(model,custom_llm_provider=bedrock),
  defaults absent output_cost_per_image to 0, skips None, and sets llm_provider-x-litellm-response-cost to the price
  times the retained image count. Lookup/conversion exceptions are swallowed; successful images remain. Test omitted
  price, None, nonnumeric price and multiple retained images through the shared cost helper; no size-based price
  or usage is invented.


  Implement crates/betterlite-bedrock/src/canvas_results.rs with adjacent tests under canvas_results/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function canvas_results_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): canvas_images_array, canvas_error_object, canvas_empty_images, canvas_malformed_reply, canvas_response_cost.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_results* using HelperCase:
  kind: helper and the externally tagged bedrock_other_canvas_results variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_canvas_results that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Outside-byte boundary: decode_canvas_reply consumes Nova Canvas JSON reply bytes in crates/betterlite-bedrock/src/canvas_results.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_canvas_results.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_other_canvas_results.
  The adjacent test replays_the_bedrock_other_canvas_results_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 60 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 100 production lines, 185 behavior/config-test lines, 85 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 450 planned, 450 maximum changed lines.
