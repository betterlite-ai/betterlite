id: B829
title: Budget create, patch and inspection routes
description: >-
  Build betterlite-server::budget_api with POST /budget/new, /budget/update, /budget/info and
  /budget/delete, and GET /budget/settings and /budget/list. Own all six functions in
  budget_management_endpoints.py L35-L362. B052 authenticates the routes; use B725 BudgetRepository,
  B124 request contracts, B2314 user_api_key_has_admin_view, B732 principals, B861 validate_budget_duration,
  B1224 validate_model_max_budget, B2317 get_budget_reset_time and B124 jsonify_object. There is no
  management effects decorator or route-level license branch. Dependencies supply typed inputs and
  decoding; this task introduces no parser. Monetary values are Decimal with the pinned SQL types.

  BudgetNewRequest's budget_id, max_budget, soft_budget, max_parallel_requests, tpm_limit, rpm_limit,
  tpd_limit, budget_duration, model_max_budget and budget_reset_at default to None. Create first
  requires a database (500 with CommonProxyErrors.db_not_connected_error), then rejects negative or
  non-finite max_budget and soft_budget (400 detail.error naming the field), validates duration and
  a nonempty model_max_budget. ValueError from model-budget validation becomes 400 detail.error;
  empty model maps skip that validation. No soft_budget<max_budget check exists. When reset_at is
  None and duration is not, calculate the initial future reset with B2317. Exclude null fields from
  the insert, preserving zero and empty maps, and set created_by and updated_by to user_id or
  litellm_proxy_admin_name ("default_user_id"). Omitted budget_id uses the database UUID default.
  Only UniqueViolationError is converted to 400 "Budget with id '<id>' already exists."; other
  repository errors propagate. Return the created row.

  Update requires a database then a non-null budget_id (400 "budget_id is required"), applies the
  same numeric/duration/model checks and serializes only explicitly set fields. An omitted reset_at
  is recomputed when duration is non-null, cleared when duration is explicitly null, and untouched
  if duration was omitted. Explicit reset_at, including null, always wins. Write updated_by even
  for an otherwise empty patch and return the updated row. Neither new nor update has an additional
  role check inside the handler; retain the authentication middleware's actual route policy.

  Info without a database returns 500 "No db connected". An empty budgets list returns 400 with
  the "Specify list of budget id's to query" diagnostic; otherwise return find_many with budget_id
  in the list. Missing ids are absent from the result, duplicates do not duplicate rows and no
  request-order guarantee is added. Settings and list use 400 for a missing database and 400 for
  callers lacking admin view ("Admin-only endpoint. Not allowed to access this.", followed by role).
  Admin-view includes the shared role predicate's viewer/admin flags. Settings returns the eight
  fields in BudgetNewRequest declaration order: max_budget and soft_budget as "Float",
  max_parallel_requests, tpm_limit, rpm_limit and tpd_limit as "Integer", budget_duration as "String"
  and model_max_budget as "Object". Each ConfigList has the source field_description, None default,
  stored_in_db=true and the row value or null. An unknown budget still returns all eight descriptors
  with null values. List returns all rows without adding sorting or pagination.

  Delete checks database (500) before requiring exactly PROXY_ADMIN (400 for any other role, even
  admin-view). Delete by data.id and return the deleted row. Keep database foreign-key and unknown-row
  failures; do not invent linked-row cleanup. All explicit errors above are HTTPException detail
  bodies, without error.type/param/code. There is no handle_exception_on_proxy call. Compare status,
  content-type and body through the booted HTTP servers; ignore only diagnostic wording. B124's
  server exception handlers govern propagated repository errors, including service unavailability.

  B860 supplies separate pinned Postgres fixtures using POSTGRES_TEST_URL in CI or testcontainers
  locally; failure to provision fails tests. postgres_budget_rows verifies create defaults, actor
  fallback, every update presence combination, Decimal values and returned/deleted rows.
  postgres_budget_failures proves duplicate create and rejected validation make no writes and tests
  actual linked/unknown deletion constraints. Route cases use real B052 keys with admin, viewer and
  ordinary-user roles. For finite validation unreachable through strict JSON, named native cases
  reject_nonfinite_max and reject_nonfinite_soft feed the typed validation boundary.

  The functions contain 192 executable/declaration lines excluding blanks, comments and docstrings.
  Estimate 205 production, 285 tests and 65 route/fixture wiring lines, 555 within a 600-line budget.
scope:
  paths:
    - crates/betterlite-server/src/budget_api.rs
    - crates/betterlite-server/src/budget_api/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/budget-api/**
    - tools/oracle/helpers/b829.py
    - tools/oracle/helpers/b829/**
    - tools/oracle/src/helpers/server/b829.rs
    - tools/oracle/src/helpers/server/b829/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/budget_management_endpoints.py#L35-L202
    why: Own create/update including decorators, numeric validation and presence-aware reset writes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/budget_management_endpoints.py#L205-L362
    why: Own info/settings/list/delete, with their distinct database and permission statuses.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2042-L2079
    why: Budget field defaults, descriptor text and order, and request shapes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1892-L1919
    why: HTTPException keeps the detail envelope instead of a ProxyException envelope.
dod:
  - text: The named HTTP cases cover all six routes, defaults, explicit clears, invalid budgets and the actual role policy.
    proof: [oracle, behavior-tests]
  - text: postgres_budget_rows and postgres_budget_failures assert persisted values and failures against the pinned schema.
    proof: [postgres-tests]
  - text: reject_nonfinite_max and reject_nonfinite_soft preserve validation even when callers bypass HTTP JSON decoding.
    proof: [behavior-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Fail unless the budget routes' behavior tests exist and pass.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^budget_api::tests::/) - test(/replays_the_/)'
    - id: postgres-tests
      why: Exercise real budget rows and database constraints, rather than a mocked repository.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^budget_api::tests::postgres_budget_rows$/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^budget_api::tests::postgres_budget_failures$/)'
