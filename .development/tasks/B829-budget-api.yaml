deviations: []
out_of_scope:
  - B732 owns the request contracts; B861 and B1224 own duration and per-model validation internals.
  - B2317 resolves timezone and budget_reset_time; this handler consumes its clock/settings service.
pitfalls:
  - budget_reset_at=null suppresses duration-based recomputation on update, but triggers computation on create.
  - A missing budget in /budget/settings yields descriptors with stored_in_db=true, not a 404.
budget:
  max_changed_lines: 600
  max_new_expects: 0
review_level: security
