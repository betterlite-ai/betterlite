dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: new_budget, patch_null_versus_zero,
      budget_info, budget_settings_fields, linked_delete, list_budget, unauthorized_budget.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^budget_api::tests::/)
        - test(/replays_the_/)'
