dod:
  - text: Credential-free preview, full-query summaries, first-50 samples and Decimal JSON match the booted LiteLLM routes.
    proof: [preview-tests, new-http-cases, oracle]
  - text: Manual export selects the live first registered instance or a request-local stored-settings logger, preserves validation and service-error boundaries, and reaches delivery.
    proof: [export-tests, new-http-cases, oracle]
  - text: The application composes all twelve FinOps methods once under key auth, preserves role distinctions and child settings behavior, and creates no aliases or scheduler.
    proof: [composition-tests, existing-route-tests, new-http-cases, oracle]
  - text: Real inference requests invoke the existing Lago, OpenMeter and PointFive adapters with correct attribution/redaction while exporter failures preserve the client response.
    proof: [callback-integration-tests, new-http-cases, oracle]
  - text: The production preview/export body decoder rejects malformed bytes without panics and replays newly committed valid and invalid inputs.
    proof: [decoder-tests, export-body-corpus]
checks:
  optional: []
  commands:
    - id: preview-tests
      why: A preview queries settings, totals only its sample, invents total_tokens or loses numeric and nullable fields.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_exports::tests::preview_/)'
    - id: export-tests
      why: Export chooses a new or stale logger, changes the window or limit, loses an error, or returns before delivery finishes.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_exports::tests::export_/)'
    - id: composition-tests
      why: The real application omits or duplicates a route, bypasses key auth, grants viewers export permission or splits the live logger state.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::spend::finops::tests::mount_/)'
    - id: callback-integration-tests
      why: A configured metering callback is a no-op, receives the wrong identity or redaction, or holds the HTTP response while flushing.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::spend::finops::tests::callback_/)'
    - id: existing-route-tests
      why: Composition changes the existing settings handlers or their use of the shared registration view.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-server/src/app/spend/finops.rs crates/betterlite-server/src/app/spend/finops)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::/) + test(/^finops::vantage_routes::/)'
    - id: decoder-tests
      why: The handler decoder changes defaults, conflates null with omission or rejects a well-typed service-level error case during parsing.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_exports::tests::decode_/)'
    - id: export-body-corpus
      why: The production request decoder has no fuzz target, no new seed, or a failing corpus replay.
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/vantage_export_body.rs &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/vantage_export_body)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_exports::tests::replays_the_vantage_export_body_corpus$/)'
    - id: new-http-cases
      why: No new booted-proxy FinOps case was added or a mutable handler was tested through a helper adapter.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/finops-composition)" &&
        grep -rlq '^kind: http$' tools/oracle/cases/http/finops-composition &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/http/finops-composition
