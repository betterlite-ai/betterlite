id: B073
title: Complete Vantage export routes and compose FinOps HTTP behavior
description: >-
  Finish the billing umbrella with the remainder of vantage_endpoints.py: the registered
  logger lookup at L56-L63, POST /vantage/dry-run at L357-L445, including its nested JSON
  projection, and POST /vantage/export at L448-L518. These contain 120 nonblank,
  non-comment lines after removing docstrings. B3077 already registers the four Vantage
  settings routes and B3076 the six CloudZero routes. This task supplies the two missing
  handlers in betterlite-server::finops::vantage_exports, with VantageExportError in that
  module, and composes all three routers in app::spend::finops. Reuse B3079's
  vantage_endpoints request/response models, B3060's FOCUS query, B3061's transformer,
  B3065's summary operations, B3066/B3067's export service and B3075's settings access.
  Do not build an OpenAI billing client; every organization_costs.py function belongs to
  B1712 and these endpoints never call it.

  The architect installs the shared call sites and contracts recorded in the planner
  report before dispatch. B3067 supplies a live VantageLoggers view of registered concrete
  exporter instances, shared by the startup scheduler, settings deletion and this task;
  B8610 exposes that same Arc as shared.vantage_loggers. It preserves B189's callback-list
  order and de-duplication, including instances in success/failure lists. Its snapshot is
  not B8749's BaseLogger named vantage: that object intentionally has no export method.
  The handler clones the first registered VantageLogger from the view on each request,
  releases the view's lock before awaiting, and returns None when the view is empty.
  Do not construct a substitute logger on lookup, cache a stale first instance in route
  state, register a temporary export logger, or create a second scheduler. If the agreed
  shared contract is absent, report the missing prerequisite instead of editing its owner.

  Both handlers take the caller from the existing B052 authentication layer and require
  exactly PROXY_ADMIN; PROXY_ADMIN_VIEW_ONLY may read settings but may not preview or
  export. Preserve the source's 403 detail object for a denied role and its order before
  any settings, database or delivery work. Body decoding uses B3079's declared types:
  VantageDryRunRequest.limit defaults to 500 and accepts explicit null; that default is
  not a maximum. VantageExportRequest defaults limit, start_time_utc and end_time_utc to
  None. No export config key or environment variable is introduced here. Implement
  decode_vantage_export_body(operation, bytes) over the existing serde models, with a
  closed operation enum for preview/export; the actual handlers and the fuzz target call
  this same decoder. Retain the server's body/header bounds and deadlines and the normal
  validation error shape rather than axum's default text rejection. Fuzz arbitrary bytes
  for both operations, including truncated JSON, invalid UTF-8, nested input, absent/null
  limits, invalid dates and a one-sided valid date. A one-sided date is a valid decoded
  request whose export service rejects it, not a JSON validation failure.

  Dry-run goes directly to get_usage_data(limit), then transform, without constructing an
  export engine or destination, reading Vantage settings or requiring either credential.
  Return at most the first 50 raw rows and first 50 normalized rows, in the query's order;
  summary covers the whole limited query, not the samples. Its fields are total_records
  from normalized length, total_spend from raw spend, total_tokens from raw total_tokens,
  and unique_teams/unique_models from raw team_id/model. Reuse B3065's missing-column and
  null handling, including null as a distinct value in a present unique-count column.
  The real FOCUS SELECT does not include total_tokens, so that summary is zero even when
  prompt_tokens and completion_tokens are positive. Do not synthesize a new column.
  Both samples are [] for an empty result and all summary counts/totals are zero. Keep
  money as Decimal, emit JSON numbers rather than decimal strings, and preserve the
  child transform's nullable fields, tag strings and timestamps without adding floats.
  Return message "Vantage dry run export completed successfully.", status "success",
  dry_run_data containing usage_data, normalized_data and summary, and the same summary
  again at the response top level.

  Actual export prefers the first registered logger even when stored settings are absent,
  stale or unreadable. Only when no instance exists, await B3075's decrypted settings;
  an empty settings object gives 404, while database absence or decryption failure keeps
  the settings service's 500. Construct a request-local B3067 logger with api_key,
  integration_token and base_url from the settings and its existing environment fallback:
  VANTAGE_API_KEY and VANTAGE_INTEGRATION_TOKEN have no default, VANTAGE_BASE_URL defaults
  to https://api.vantage.sh, VANTAGE_EXPORT_FREQUENCY to hourly, and an absent interval
  remains unset. These values come from the child's config view, never a server env read.
  Await export_usage_data with the three request fields unchanged. No bounds means the
  all-data path; both bounds use the explicit inclusive query window; one bound alone
  raises the service error. Do not apply the scheduled hourly window to a manual export.
  Successful completion, including no rows to upload, returns message "Vantage export
  completed successfully", status "success", dry_run_data null and summary null. Re-emit
  service HTTP errors unchanged; convert other export/query/transform failures to the
  source's handled 500 detail object, with betterlite's own wording. This includes a
  negative limit and one-sided time window after their earlier prerequisites succeed.

  In app/spend/finops.rs expose mount(router, state). Build the route inputs over
  shared.db, shared.http, shared.vantage_loggers and the existing resolved config, and
  merge B3076's router, B3077's router and vantage_exports::routes once each inside the
  normal key-auth layers. The complete paths are GET/PUT /cloudzero/settings,
  POST /cloudzero/init, POST /cloudzero/dry-run, POST /cloudzero/export,
  DELETE /cloudzero/delete, GET/PUT /vantage/settings, POST /vantage/init,
  POST /vantage/dry-run, POST /vantage/export and DELETE /vantage/delete. There are no
  /v1, /openai/v1 or provider-prefixed aliases. Neither B8610's area aggregator nor the
  existing MCP mounts registers these paths; B8662's spend-area hook calls this mount.
  Register only the two new routes in vantage_exports::routes, never repeat a child's
  .route call in mount. The skeleton declares the two modules; parent module files and
  the area hook are not this task's scope.

  Add kind: http oracle cases through the actual booted proxy. Use B860's independent
  Postgres databases, seeded roles and B9260's typed daily-spend fixtures
  for populated previews; keep fixture data identical on both sides. Include default,
  null, zero and negative limits; more than 50 rows with totals beyond the sample;
  nullable team/model values; positive token columns with total_tokens absent; and an
  organization/key-alias join. Assert the two summary copies are equal. Exercise preview
  without Vantage credentials, registered-logger precedence over conflicting DB settings,
  missing settings, missing database, stored-secret decryption failure, empty export,
  explicit inclusive bounds and upstream delivery failure. Vantage destination config
  points only to the local fixture server; record the multipart CSV request, integration
  token and filename for the bounded-window success. Compare multipart fields and file
  bytes without treating its generated MIME boundary as semantic. Build settings
  transcripts that initialize, view as admin/viewer, partially update, export and delete;
  verify new exports re-read the live registration view after deletion while an already
  bound scheduled job retains its handle. Re-run B3076/B3077's existing route tests too.

  CloudZero composition cases drive its six existing methods with the proper roles,
  no-field update, missing settings and missing database, plus empty preview/export and
  init-update-delete transcripts; keep its environment-based preview construction and
  stored-credential manual export distinct. Native mount tests verify twelve method/path
  registrations without collisions against the real application and rejection of the
  invented aliases. Error comparisons keep HTTP status, content-type and the actual
  envelope: these handlers emit {detail:{error:...}}, with no invented type/param/code.
  Ignore only /detail/error for their wording. Authentication ProxyExceptions retain
  /error/type, /error/param and /error/code and ignore only /error/message. Preserve
  validation detail locations and codes, ignoring only individually unstable wording.

  The metering children had no booted HTTP coverage. Add chat-completion cases for the
  existing lago, openmeter and pointfive callback names through B8742/B8745/B3074, using
  openai/gpt-4o behind an alias finops-chat. Include success, streaming completion and
  provider failure, and prove a refused exporter connection does not change the client
  result. Use fixed dummy credentials and loopback exporter URLs, never real vendors.
  Lago uses LAGO_API_BASE, LAGO_API_KEY, LAGO_API_EVENT_CODE and LAGO_API_CHARGE_BY
  (default end_user_id); OpenMeter uses OPENMETER_API_KEY, OPENMETER_API_ENDPOINT
  (default https://openmeter.cloud), OPENMETER_EVENT_TYPE (default litellm_tokens) and
  OPENMETER_TRUST_REQUEST_USER (default true). Case fixtures override those endpoints;
  these are existing keys, not new settings. For PointFive use POINTFIVE_API_KEY and
  POINTFIVE_API_URL and the existing litellm_settings.pointfive_params view; its pinned
  defaults are batch_size 1000, flush_interval 300, max_batch_bytes 8388608 and
  max_upload_retries 3. Explicitly set batch_size 1 in the flush case.

  Native application tests under app::spend::finops::tests drive real HTTP requests with
  recording outbound transports because the HTTP oracle's inference upstream is not a
  second asynchronous callback collector. Assert Lago end-user/team/key-user attribution,
  OpenMeter trusted-request versus key-bound subject, and PointFive success/failure
  redaction and asynchronous batch delivery without holding the response open. Observe
  production dispatch and the catalog's retained instances, not hand-made callback
  events. Close the application and drain the owned tasks before inspecting delivery;
  a timeout or missing delivery fails the test. The HTTP cases prove the client contract,
  while these native tests prove callbacks are actually invoked. Export scheduling,
  S3/GCS/Mavvrik delivery and billing-recorder middleware remain with their existing
  owners; there is no new HTTP endpoint for a scheduler tick. Allow roughly 450-650
  production/decoder/composition lines plus adjacent tests and case files, within the
  fixed 1500-line source budget. No oracle helper may call these global-state handlers.
scope:
  paths:
    - crates/betterlite-server/src/finops/vantage_exports.rs
    - crates/betterlite-server/src/finops/vantage_exports/**
    - crates/betterlite-server/src/app/spend/finops.rs
    - crates/betterlite-server/src/app/spend/finops/**
    - crates/betterlite-server/fuzz/fuzz_targets/vantage_export_body.rs
    - crates/betterlite-server/fuzz/corpus/vantage_export_body/**
    - tools/oracle/cases/http/finops-composition/**
  lint_tables: false
