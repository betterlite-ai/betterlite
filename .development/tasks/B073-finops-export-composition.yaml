deviations: []
out_of_scope:
  - "vantage_endpoints.py _VantageConfigRow.param_value, _config_table, _set_vantage_settings, _get_vantage_settings, is_vantage_setup_in_db, is_vantage_setup_in_config and is_vantage_setup are B3075; that entry covers this file."
  - "vantage_endpoints.py get_vantage_settings, update_vantage_settings, init_vantage_settings and delete_vantage_settings are B3077; their registration and mutation order are reused, not rewritten."
  - "organization_costs.py provider_billing_get, _utc_midnight, _bucket_day, fetch_openai_daily_costs and its nested fetch_from, with all response records, are B1712; B073 has no caller of that client."
  - "FocusLogger.dry_run_export_usage_data (focus_logger.py L107-L110) has no caller at the pin; its only call to FocusExportEngine.dry_run_export_usage_data (export_engine.py L47-L66) is consequently unreachable, so neither wrapper is built."
  - "FOCUS query/transform/summary/export services stay with B3060, B3061, B3065 and B3066; VantageLogger construction, typed registration storage and scheduling methods stay with B3067; credential persistence and encryption stay with B3075/B1600."
  - "All cloudzero_endpoints.py route functions are B3076 and settings/setup helpers are B3075; CloudZero transformation, delivery and scheduling remain B3069, B3070 and B3071."
  - "Vantage/CloudZero request and response classes are B3079; caller authentication is B052 and callback-list filtering/removal is B189, each retaining its own covered source files."
  - "S3/GCS delivery is B3062, Mavvrik delivery/catch-up is B3063/B3068, Vantage batching is B3064, and startup's scheduler registrations are B8372; do not start these jobs again from the mount."
  - "Lago/OpenMeter logger functions are B3072 with catalog adapters B8745; PointFive payload/upload functions are B3073 and logger/catalog functions B3074; this task adds HTTP composition evidence only."
  - "BillingMetricsRecorder is B3078; B8680 owns the edge middleware and gateway accumulator handoff, and B8374 owns recorder shutdown; no enterprise-package branch or paid-license mechanism is added here."
  - "B8610 owns Shared and the area aggregator, B8662 owns app/spend.rs, and B9260 owns the daily-spend fixture extension; the architect installs shared field/call-site glue, module declarations and fuzz-target registration recorded in the planner report."
pitfalls:
  - "The real FOCUS SELECT omits total_tokens, so adding prompt_tokens and completion_tokens would silently change /vantage/dry-run's total_tokens from zero."
  - "Vantage preview never calls FocusLogger.dry_run_export_usage_data or FocusExportEngine.dry_run_export_usage_data and must work without VANTAGE_API_KEY or VANTAGE_INTEGRATION_TOKEN."
  - "The 500 preview limit is a default query limit, the 50 sample size is a response bound, and neither caps an explicitly supplied positive limit."
  - "A first registered VantageLogger takes precedence over unreadable or changed stored settings, and a temporary fallback logger must never become registered."
  - "DELETE /vantage/delete removes instances only from litellm.callbacks, so an instance remaining in another callback list can still be selected and an already-bound job is not cancelled."
  - "The preview success message ends in a period while the actual-export success message does not."
  - "An unsupported /v1/vantage/export alias must remain absent even though the underlying API otherwise uses OpenAI-style authentication."
  - "B8749's BaseLogger proves the vantage callback name is accepted but cannot stand in for the concrete export instance shared with B8372."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
