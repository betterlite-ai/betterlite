id: B1100
title: Shared request body decoding
description: >-
  Implement the proxy request body cache and JSON/media-type boundary used before auth and again by route extraction.
  Keep repaired JSON, opaque audio and OTLP branches distinct; pass an immutable RequestFacts value to auth and
  reuse the same parsed body after it.


  Implement crates/betterlite-server/src/api/request_body.rs, crates/betterlite-core/src/api/request_body.rs. Use
  RequestBodyInput and RequestBodyResult with typed nested records; inject only the clock, repositories, transports
  and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient
  environment or duplicate credential resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): http_parsing_utils.py:213 type='invalid_request_error', param='request_body', code=status.HTTP_400_BAD_REQUEST;
  http_parsing_utils.py:239 type='invalid_request_error', param='request_body', code=status.HTTP_400_BAD_REQUEST;
  http_parsing_utils.py:262 type='invalid_request_error', param='request_body', code=status.HTTP_400_BAD_REQUEST.
  Compare the actual source status, error type, param and code; ignore only error wording except in message-extraction
  tests.


  Write adjacent tests.rs behavior functions cached_body_single_read, repair_small_json, repair_over_threshold,
  opaque_audio_body, otlp_body_preserved, invalid_json_body under api::request_body::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.MAX_REQUEST_BODY_SIZE_TO_REPAIR_MB
  defaults to 1 MiB. No environment reads occur outside betterlite-config. Test api::request_body::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-server::api::request_body::decode_request_body(bytes: &[u8],
  limits: &ApiLimits), for Content-Type plus bounded request body bytes, using the shared parsed-body cache. Place
  its implementation in crates/betterlite-server/src/api/request_body.rs and call it from the actual boundary. The
  cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/request_body.rs passes arbitrary bounded bytes to
  that exact decoder; api::request_body::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  Register HelperCall::RequestBody in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {request_body: <typed input>}; operation is
  only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and Python
  invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered diagnostics/effects,
  never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/common_utils/http_parsing_utils.py: _normalize_media_type (L66-L70); litellm/proxy/common_utils/http_parsing_utils.py:
  _is_form_content_type (L73-L81); litellm/proxy/common_utils/http_parsing_utils.py: is_json_content_type (L84-L86);
  litellm/proxy/common_utils/http_parsing_utils.py: _parse_binary_body (L160-L168); litellm/proxy/common_utils/http_parsing_utils.py:
  is_otlp_trace_request (L171-L172); litellm/proxy/common_utils/http_parsing_utils.py: _read_request_body (L175-L280);
  litellm/proxy/common_utils/http_parsing_utils.py: is_opaque_audio_pass_through_request (L283-L288); litellm/proxy/common_utils/http_parsing_utils.py:
  read_raw_json_body (L291-L300); litellm/proxy/common_utils/http_parsing_utils.py: _safe_get_request_parsed_body
  (L303-L309); litellm/proxy/common_utils/http_parsing_utils.py: get_client_requested_model (L312-L316); litellm/proxy/common_utils/http_parsing_utils.py:
  _safe_get_request_query_params (L319-L328); litellm/proxy/common_utils/http_parsing_utils.py: _safe_set_request_parsed_body
  (L331-L340); litellm/proxy/common_utils/http_parsing_utils.py: rewrite_request_model (L343-L358); litellm/proxy/common_utils/http_parsing_utils.py:
  _safe_get_request_headers (L361-L387). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 164 owned nonblank/non-comment/non-docstring Python lines (190 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 184 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 38 wiring; 553 total within the 560-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B171 (Direct helper oracle and
  URL path encoding), B1087 (Api boundaries), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
