checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail
      -E 'test(/^api::request_body::/) - test(/::replays_corpus$/)'
  - id: case-cached-body-single-read
    why: the cached-body-single-read behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::cached_body_single_read($|::)/)'
  - id: case-repair-small-json
    why: the repair-small-json behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::repair_small_json($|::)/)'
  - id: case-repair-over-threshold
    why: the repair-over-threshold behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::repair_over_threshold($|::)/)'
  - id: case-opaque-audio-body
    why: the opaque-audio-body behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::opaque_audio_body($|::)/)'
  - id: case-otlp-body-preserved
    why: the otlp-body-preserved behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::otlp_body_preserved($|::)/)'
  - id: case-invalid-json-body
    why: the invalid-json-body behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::invalid_json_body($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::request_body::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/request-body-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/request_body)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/request_body.rs && grep -qF "decode_request_body" crates/betterlite-server/fuzz/fuzz_targets/request_body.rs
      && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/request_body.py && uv run --locked --project tools/oracle/litellm ruff check
      tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/request_body-*)"
      && grep -qE "^[[:space:]]+request_body:" tools/oracle/fuzz/corpus/helper_case/request_body-* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/request-body)"
  - id: case-stub-routes-not-found
    why: router() does not merge the stub routes, or a merged stub answers anything but the Not Found fallback
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::tests::stub_routes_answer_not_found($|::)/)'
