out_of_scope:
- 'litellm/proxy/common_utils/http_parsing_utils.py: B1102 owns resolve_inference_model L32-L63, get_tags_from_request_body
  L618-L651, populate_request_with_path_params L654-L699, _add_vector_store_id_from_path L702-L734.'
- 'litellm/proxy/common_utils/http_parsing_utils.py: B1101 owns _unqualified L89-L94, _union_members L97-L102, _numeric_form_type
  L105-L115, numeric_form_fields L118-L131, _numeric_form_value L134-L140, coerce_numeric_form_fields L143-L157,
  check_file_size_under_limit L390-L450, get_form_data L453-L467, convert_upload_files_to_file_data L470-L512, get_request_body
  L515-L527, extract_nested_form_metadata L530-L615.'
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- 'The oracle helper for this task is pre-registered as request_body in the server group. Replace the stub Op in tools/oracle/src/helpers/server/request_body.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/request_body.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- http_parsing_utils.py:376 emits the diagnostic 'Unexpected cached request headers type - %s'; retain its level
  and fallback instead of turning it into a hard error.
- http_parsing_utils.py:327 emits the diagnostic 'Unexpected error reading request query params - %s'; retain its
  level and fallback instead of turning it into a hard error.
- >-
  The 560-line estimate covers the request body work only. The 114 route stubs, the 58 state slots, their registry
  lines and the ServerState wiring add about 1940 lines outside it.
- >-
  A stub routes function or Slot constructor has a one-line body because it is a placeholder its owner replaces,
  not a wrapper to inline. Do not prefill a stub with its owner's paths, handlers or fields.
- Router::merge panics when two routers register the same method and path, so an empty stub router registers nothing.
review_level: security
budget:
  max_changed_lines: 3450
  max_new_expects: 1
