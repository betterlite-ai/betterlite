checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::speech_provider_contract::/)
      - test(/::replays_corpus$/)'
  - id: case-speech-provider-capabilities
    why: the speech-provider-capabilities behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_provider_contract::tests::speech_provider_capabilities($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/speech_provider_contract.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/speech_provider_contract-*)"
      && grep -qE "^[[:space:]]+speech_provider_contract:" tools/oracle/fuzz/corpus/helper_case/speech_provider_contract-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/speech-provider-contract)"
oracle_cases:
- tools/oracle/cases/helpers/speech-provider-contract/speech-provider-capabilities.yaml
deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- Within BaseTextToSpeechConfig.get_complete_url\'s api_base is None branch, preserve raise ValueError('api_base
  is required') and its nested guards.
- 'The source field dict_body: dict[str, Any] is part of the wire/default contract; preserve its omission and explicit-value
  cases.'
