id: B1135
title: Text-to-speech provider contract
description: >-
  Define TextToSpeechRequestData and all BaseTextToSpeechConfig methods in
  betterlite-provider::api::speech_provider_contract, with request records in betterlite-openai. The declared
  request keys are dict_body,ssml_body,headers, all optional; the docstring's text_body is not a declared field.
  These are typed transformation results, not a new request parser. Required provider methods expose supported
  params, option/voice mapping, validation, URL and binary request/response conversion. The no-op constructor
  needs no runtime wrapper. map_openai_params defaults voice=None,drop_params=false,kwargs={} at its interface;
  avoid shared mutable defaults in Rust while retaining per-call behavior.

  get_config examines only own class attributes, excluding names beginning __ or _abc, functions,builtins,
  classmethods,staticmethods and None. It preserves ordinary single-underscore attributes, properties and callable
  objects. The inherited validation body returns {}; inherited URL body rejects only api_base=None. Error
  conversion raises B2202's BaseLLMException preserving status,message,headers. Concrete providers may override
  these bodies; the tests invoke finite subclasses, not network clients. Register speech_provider_contract in
  B171 helper dispatch. Source ownership is 105 nonblank/non-comment lines including abstract documentation;
  budget 100 interface/default code, 110 tests, 75 cases, 90 adapters and 25 wiring, 400 lines.
scope:
  paths:
  - crates/betterlite-provider/src/api.rs
  - crates/betterlite-provider/src/api/**
  - crates/betterlite-provider/src/api/speech_provider_contract.rs
  - crates/betterlite-provider/src/api/speech_provider_contract/**
  - crates/betterlite-provider/src/operation.rs
  - crates/betterlite-provider/src/operation/**
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/speech_provider_contract.rs
  - crates/betterlite-openai/src/api/speech_provider_contract/**
  - tools/oracle/src/helpers/provider/speech_provider_contract.rs
  - tools/oracle/src/helpers/provider/speech_provider_contract/**
  - tools/oracle/helpers/speech_provider_contract.py
  - tools/oracle/helpers/speech_provider_contract/**
  - tools/oracle/cases/helpers/speech-provider-contract/**
  - tools/oracle/fuzz/corpus/helper_case/speech_provider_contract-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/text_to_speech/transformation.py#L25-L143
  why: Own speech request keys, class-attribute filtering, mapping defaults, URL validation and base error construction.
dod:
- text: >-
    speech_request_contract keeps {},{dict_body:{}},{ssml_body:"<speak>hello</speak>"},{headers:{x:y}} and
    combined dict_body/ssml_body records as supplied; the TypedDict adds no exclusivity validation or default
    body. Mapping receives voice=None,drop_params=false,kwargs={} when omitted; explicit voice="",true and
    kwargs={x:1} remain distinguishable. Abstract methods are required dispatch members, not silently successful
    empty response implementations.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    speech_class_configuration supplies own speed=0,enabled=false,label="",_private=1,__hidden=2,_abc_hidden=3,
    absent=None,method,classmethod,staticmethod,property,callable-object and inherited voice. Expect only speed,
    enabled,label,_private,property,callable-object. Helper projection tags descriptors and never executes them.
    Two instances do not mutate one another's mapping kwargs; inherited class values remain excluded.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    speech_base_url_and_error invokes inherited validation with headers={Authorization:secret}: expect {}.
    get_complete_url(None) raises ValueError("api_base is required"), while "" and https://mock/speech are
    returned unchanged. get_error_class("slow",429,{retry-after:2}) raises BaseLLMException retaining message,
    status=429 and headers. No HTTP error type,param,code is invented by this provider contract.
  proof: [behavior-tests, oracle, helper-python]
- text: Added speech_provider_contract seeds and fixtures compare the concrete base bodies independently.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Request representations and class/default methods must be tested in both leaf and provider crates.
    run: cargo nextest run --locked -p betterlite-provider -p betterlite-openai --no-tests=fail -E 'test(/^api::speech_provider_contract::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: Base speech methods require a checked independent Python adapter.
    run: test -f tools/oracle/helpers/speech_provider_contract.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The helper must parse the speech_provider_contract tag and descriptor fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/speech_provider_contract-*)" && grep -qE '^[[:space:]]+speech_provider_contract:' tools/oracle/fuzz/corpus/helper_case/speech_provider_contract-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Speech class filtering is distinct from the chat base's filter and needs its own fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/speech-provider-contract)"
oracle_cases:
- tools/oracle/cases/helpers/speech-provider-contract/speech-request-contract.yaml
- tools/oracle/cases/helpers/speech-provider-contract/speech-class-configuration.yaml
- tools/oracle/cases/helpers/speech-provider-contract/speech-base-url-and-error.yaml
deviations: []
out_of_scope:
- B2202 owns BaseLLMException. B1083/B1084 own SDK speech calls and provider-specific tasks own concrete transforms; every declaration in this referenced base file is assigned here.
pitfalls:
- 'The oracle helper for this task is pre-registered as speech_provider_contract in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/speech_provider_contract.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/speech_provider_contract.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- text_body appears in documentation but not TextToSpeechRequestData; do not invent that public field.
- A single leading underscore is retained by get_config; only __ and _abc prefixes are filtered.
- The empty api_base string is valid to the base method even though None raises.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 1
