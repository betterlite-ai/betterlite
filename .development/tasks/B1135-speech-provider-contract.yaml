id: B1135
title: Speech provider contract
description: >-
  Define the typed text-to-speech provider operation and optional parameter mapping before speech execution and
  the chat-audio bridge.


  Implement crates/betterlite-core/src/api/speech_provider_contract.rs, crates/betterlite-provider/src/api/speech_provider_contract.rs.
  Use SpeechProviderContractInput and SpeechProviderContractResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions speech_provider_capabilities under api::speech_provider_contract::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::SpeechProviderContract in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {speech_provider_contract: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/llms/base_llm/text_to_speech/transformation.py: BaseTextToSpeechConfig.__init__ (L38-L39);
  litellm/llms/base_llm/text_to_speech/transformation.py: BaseTextToSpeechConfig.get_config (L42-L58); litellm/llms/base_llm/text_to_speech/transformation.py:
  BaseTextToSpeechConfig.get_supported_openai_params (L61-L64); litellm/llms/base_llm/text_to_speech/transformation.py:
  BaseTextToSpeechConfig.map_openai_params (L67-L77); litellm/llms/base_llm/text_to_speech/transformation.py: BaseTextToSpeechConfig.validate_environment
  (L80-L90); litellm/llms/base_llm/text_to_speech/transformation.py: BaseTextToSpeechConfig.get_complete_url (L93-L104);
  litellm/llms/base_llm/text_to_speech/transformation.py: BaseTextToSpeechConfig.transform_text_to_speech_request
  (L107-L123); litellm/llms/base_llm/text_to_speech/transformation.py: BaseTextToSpeechConfig.transform_text_to_speech_response
  (L126-L134); litellm/llms/base_llm/text_to_speech/transformation.py: BaseTextToSpeechConfig.get_error_class (L136-L143).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 96 owned nonblank/non-comment/non-docstring Python lines (123 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 116 implementation,
  46 behavior tests, 12 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 302 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B1087 (Api boundaries). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
