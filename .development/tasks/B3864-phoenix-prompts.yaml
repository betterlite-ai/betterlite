id: B3864
title: Phoenix prompt retrieval and compilation
description: >-
  Implement Phoenix prompt retrieval and compilation for the Arize Phoenix integration.
  Fetch versioned prompts from the Arize Phoenix API, parse and cache templates locally,
  render them with Mustache-style variable substitution, and expose the prompt-manager
  interface used by the shared prompt dispatcher.

  The integration supplies configuration through B002 (api_key from PHOENIX_API_KEY,
  api_base from config), uses B173's HTTPHandler for outbound requests, and depends on
  G3's CustomPromptManagement base class. Build URL sanitization that rejects path
  traversal characters (/\\#?) and .. sequences, refusing the request with a descriptive
  error rather than munging the identifier. Implement a Jinja2 sandboxed template environment
  matching the LiteLLM hardening: variable delimiters {{ }}, block delimiters {% %},
  autoescape for HTML/XML, and ImmutableSandboxedEnvironment to prevent attribute traversal
  attacks. Cache fetched templates locally in a dictionary by prompt version ID. Parse
  metadata from the API response (model_name, temperature, max_tokens, invocation_parameters)
  and merge provider-specific parameters from nested openai/anthropic blocks. Render
  templates with supplied variables and return message lists paired with resolved metadata
  and optional parameters (temperature, max_tokens, frequency_penalty, presence_penalty, top_p).
  The prompt_initializer registry function in __init__.py validates api_key and api_base,
  constructs the manager, and returns it as the CustomPromptManagement instance for the
  dispatcher. Preserve the exact error messages from LiteLLM for authentication failures
  (401, 403, 404), distinguishing "Access denied", "Authentication failed" and "Not found"
  cases in exception text.
