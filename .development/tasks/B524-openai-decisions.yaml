id: B524
title: OpenAI Decisions intermediate representation
description: >-
  Introduce typed DecisionRequest/DecisionReply and the decision intermediate representation needed by provider
  adapters. Keep choice, score, predicates, instructions, one-option detection and round-trip conversion as explicit
  variants; export the IR for Foundry reuse. B099 supplies the public route.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/decisions/transformation.py:
  _ir_input L57-L60; _ir_question L63-L85; openai_request_to_ir L88-L93; _text_field L96-L97; _instructions L100-L101;
  _predicate_instructions L104-L111; _openai_question L114-L143; _openai_input L146-L153; _has_one_option L156-L163;
  ir_to_openai_request L166-L174; _level_label L177-L180; _ir_answer L183-L208; openai_response_to_ir L211-L226;
  _openai_choice_answer L229-L241; _openai_score_answer L244-L256; _openai_answer L259-L268; ir_to_openai_response
  L271-L290; OpenAIDecisionsConfig.get_default_api_base L297-L298; OpenAIDecisionsConfig.resolve_api_base L300-L307;
  OpenAIDecisionsConfig.resolve_api_key L309-L310; OpenAIDecisionsConfig.transform_decisions_request L312-L318;
  OpenAIDecisionsConfig.parse_response L320-L321. litellm/llms/base_llm/decisions/transformation.py: decisions_text
  L59-L60.


  Named case contracts: choice_question_roundtrip: Choice preserves ordered values/descriptions; None instructions
  default to Which choice best fits the input?, but an empty string stays empty. Non-null name/description/safety_identifier
  use decisions_text; omit None fields. score_question_roundtrip: Score instructions default to Which level best
  fits the input?; stringify level labels with decisions_text. Response-to-IR uses the original question label when
  a probability index is in range, otherwise its returned label. predicate_instructions: Convert non-string DecisionsJSON
  using json.dumps, retaining its spaces/ASCII escapes and JSON true/null spellings. Predicate instructions join
  non-null base instructions and each non-null criterion as Answer <answer> when: <text> with two newlines; empty
  result defaults to Is this true of the input?. single_option: Any choice with fewer than two choices or score
  with fewer than two levels returns UnsupportedDecisionsRequest reason OpenAI needs at least 2 choices or levels
  on every choice or score question; this includes zero options. Predicates do not trigger the rule. decision_answer_alignment:
  Response-to-IR iterates questions: missing or mismatched answer types become refusal; extra answers are ignored.
  IR-to-response instead zip(strict=True) raises ValueError on either length mismatch; mismatched variants become
  OpenAIRefusalAnswer. decision_probability_order: Rebuild choice probabilities in original option order using B099
  systemone_choice_key and score probabilities in level-index order; missing entries default 0.0 and duplicate incoming
  keys use the last probability. decision_usage_model: Preserve input/output/cached/cache-write/reasoning tokens;
  total_tokens is input+output. IR-to-response uses response.model or requested_model. Input strings become state;
  message sequences preserve order and dump exclude_none=True. decision_settings: Resolve api_base then litellm.api_base
  then OPENAI_BASE_URL then OPENAI_API_BASE then https://api.openai.com using truthiness. Key chain is api_key,
  litellm.api_key, litellm.openai_key, OPENAI_API_KEY; absence remains None. B099 request_model is identity; parsing
  validates the OpenAI response adapter before conversion.


  B099 owns DecisionsIR/OpenAI decision wire records, systemone_choice_key and the base request_model method; depend
  on its backlog entry even before its file lands. B500/B129 supply config and secret resolution.


  Implement crates/betterlite-openai/src/decisions.rs with adjacent tests under decisions/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation openai_decisions in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function decisions_cases in betterlite-openai with these exact named cases (one per oracle file):
  choice_question_roundtrip, score_question_roundtrip, predicate_instructions, single_option, missing_text_field,
  decision_error, decision_answer_alignment, decision_probability_order, decision_usage_model, decision_settings.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_decisions* using HelperCase: kind: helper
  and the externally tagged openai_decisions variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_openai_decisions that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 225 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 230 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 675 planned, 675 maximum changed lines.
