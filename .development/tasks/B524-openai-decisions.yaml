  - tools/oracle/src/helpers/openai_decisions.rs
  - tools/oracle/src/helpers/openai_decisions/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/openai_decisions.py
  - tools/oracle/cases/helpers/providers/openai-decisions/**
  - tools/oracle/fuzz/corpus/helper_case/openai_decisions*
  lint_tables: false
