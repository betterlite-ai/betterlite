  why: Own decisions_text. Other functions in this file remain with the owners listed below.
dod:
- text: >-
    choice question roundtrip: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-decisions/choice-question-roundtrip.yaml.
  proof:
  - case-choice-question-roundtrip
  - oracle
  - helper-python
- text: >-
    score question roundtrip: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-decisions/score-question-roundtrip.yaml.
  proof:
  - case-score-question-roundtrip
  - oracle
  - helper-python
- text: 'predicate instructions: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-decisions/predicate-instructions.yaml.'
  proof:
  - case-predicate-instructions
  - oracle
  - helper-python
- text: 'single option: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-decisions/single-option.yaml.'
  proof:
  - case-single-option
  - oracle
  - helper-python
- text: 'missing text field: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-decisions/missing-text-field.yaml.'
  proof:
  - case-missing-text-field
  - oracle
  - helper-python
- text: 'decision error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-decisions/decision-error.yaml.'
  proof:
  - case-decision-error
  - oracle
  - helper-python
- text: New openai_decisions seeds parse as the intended call variant and replay through the shared production parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-choice-question-roundtrip
    why: The choice-question-roundtrip behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::decisions_cases::case_[0-9]+_choice_question_roundtrip$/)'
  - id: case-score-question-roundtrip
    why: The score-question-roundtrip behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::decisions_cases::case_[0-9]+_score_question_roundtrip$/)'
  - id: case-predicate-instructions
    why: The predicate-instructions behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::decisions_cases::case_[0-9]+_predicate_instructions$/)'
  - id: case-single-option
    why: The single-option behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::decisions_cases::case_[0-9]+_single_option$/)'
  - id: case-missing-text-field
    why: The missing-text-field behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::decisions_cases::case_[0-9]+_missing_text_field$/)'
  - id: case-decision-error
    why: The decision-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::decisions_cases::case_[0-9]+_decision_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_decisions.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_decisions*")"
      && grep -lq 'openai_decisions' tools/oracle/fuzz/corpus/helper_case/openai_decisions* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_decisions$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
