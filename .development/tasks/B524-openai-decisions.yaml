pitfalls:
- 'The oracle helper for this task is pre-registered as openai_decisions in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/decisions.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_decisions.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- One-option detection uses length < 2 and therefore rejects an empty list too.
- Python json.dumps stringification distinguishes a boolean choice from a similarly spelled text choice; reuse systemone_choice_key
  instead of Rust debug formatting.
