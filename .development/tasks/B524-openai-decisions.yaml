  why: >-
    Own _ir_input, _ir_question, openai_request_to_ir, _text_field, _instructions, _predicate_instructions, _openai_question,
    _openai_input, _has_one_option, ir_to_openai_request, _level_label, _ir_answer, openai_response_to_ir, _openai_choice_answer,
    _openai_score_answer, _openai_answer, ir_to_openai_response, OpenAIDecisionsConfig.get_default_api_base, OpenAIDecisionsConfig.resolve_api_base,
    OpenAIDecisionsConfig.resolve_api_key, OpenAIDecisionsConfig.transform_decisions_request, OpenAIDecisionsConfig.parse_response.
    Other functions in this file remain with the owners listed below.
