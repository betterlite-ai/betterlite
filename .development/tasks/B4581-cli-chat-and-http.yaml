dod:
  - text: >-
      chat resolves a model before opening a session: a GET /models failure (a non-2xx status,
      a transport error, or a body with no "data" field) prints "Warning: Could not fetch
      models list: {error}" and falls back to an empty list; a "data" that parses but isn't an
      array falls back to an empty list with no message at all; either way the picker still
      offers a plain-text prompt for a model name. With models, the picker shows a comfy-table
      "Available Models" table capped at 200 rows, accepts an index or a name, defaults a blank
      answer to index 1, re-prompts on an out-of-range index and cancels on end of input. An
      empty pick exits the whole command at startup but is a silent no-op from "/model".
    proof: [chat-models]
  - text: >-
      The main loop dispatches "/help", "/clear", "/history", "/save <name>", "/load <name>",
      "/quit", "/exit" and "/q" the way chat.py's dispatcher does (exact match for most, prefix
      match only for /save and /load), while a separate nine-prefix-or-empty check decides
      whether a line reaches the conversation at all; a line that matches the outer check but
      not the dispatcher (for example one starting with "/quitnow") is silently dropped instead
      of becoming a chat message.
    proof: [chat-commands]
  - text: >-
      /save and /load go through the injected conversation-file port, append ".json" to a name
      that doesn't already end with it, print "Usage: /save <filename>" or "Usage: /load
      <filename>" with no second word, "File not found: {filename}" for a missing load target,
      and fall back to the system message alone (or an empty history) on any other load
      failure, never touching the current history on a usage error.
    proof: [chat-commands]
  - text: >-
      The chat completions request carries model, messages and stream: true, plus temperature
      always and max_tokens only when given, and never top_p, n, presence_penalty,
      frequency_penalty or user. Its response is read as a byte stream, buffers a line split
      across two reads before decoding it, skips an empty or non-"data:" line, ends the stream
      on a trimmed "[DONE]" payload, skips a payload that fails to parse as JSON, and otherwise
      writes a non-empty delta content fragment immediately with no trailing newline.
    proof: [chat-stream, chat-stream-corpus]
  - text: >-
      An HTTP error during the stream prints "Error: HTTP {status}" then the body's
      error.message (or "Unknown error" when the body parses but lacks it) or the raw body
      text when it doesn't parse as JSON; any other error prints "Error: {error}"; either way
      the turn ends with no reply and the main loop prints "Error: No content received from the
      model", never ending the session.
    proof: [chat-stream]
  - text: >-
      The welcome line, help text and history view keep chat.py's wording, listed commands and
      order as plain lines with no color, box border or markup; the welcome line shows
      "unlimited" only when --max-tokens was not given.
    proof: [chat-session]
  - text: >-
      Reaching end of input at the per-turn prompt prints "Chat session ended." and ends the
      session normally; Ctrl+C there or during a streamed reply has no handling at all and lets
      the process end through the OS default action instead of printing a message.
    proof: [chat-session]
  - text: >-
      http request parses -H "key:value" headers (a usage error naming any entry with no
      colon), tries --json first when given (a usage error naming any parse failure), falls
      back to trying --data as JSON and then as a raw string when --json was not given, and
      sends --json's value over --data's when both are given.
    proof: [http-request-build]
  - text: >-
      http request's method is parsed into http::Method, and its uri joins onto the
      shared client's stripped base_url with every leading "/" removed, not just one; a
      user-supplied -H "Authorization:..." header is overwritten by the shared client's own
      Bearer header whenever a key is configured.
    proof: [http-request-build]
  - text: >-
      A successful http request prints the parsed response as pretty JSON; an HTTP error calls
      commands.rs's shared error printer and returns Aborted; any other error returns a variant
      whose text the root prints as one stderr line with exit 1.
    proof: [http-request-errors]
checks:
  optional: []
  commands:
    - id: chat-models
      why: the model-fetch and picker tests are missing or a fetch failure, an empty list, the table or the index/name/default/cancel behavior differs from the description
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::chat::.*tests::models_/)'
    - id: chat-commands
      why: the special-command tests are missing or a dispatch, the nine-prefix skip gate, or /save, /load or /model differs from the description
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::chat::.*tests::commands_/)'
    - id: chat-stream
      why: the streaming tests are missing or the request body, the line buffering, the per-line decode or either error path differs from the description
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::chat::.*tests::stream_/) - test(replays_the_stream_line_corpus)'
    - id: chat-stream-corpus
      why: the stream_line fuzz target or its corpus is missing, so the per-line decoder has no fuzz coverage
      run: >-
        test -f crates/betterlite-cli/fuzz/fuzz_targets/stream_line.rs && test -n
        "$(ls -A crates/betterlite-cli/fuzz/corpus/stream_line)" && cargo nextest run --locked
        -p betterlite-cli --no-tests=fail -E 'test(replays_the_stream_line_corpus)'
    - id: chat-session
      why: the welcome line, help, history or the end-of-input and Ctrl+C behavior differs from the description
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::chat::.*tests::session_/)'
    - id: http-request-build
      why: header, --json/--data or method/uri handling is missing or differs from the description
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::http::.*tests::request_build_/)'
    - id: http-request-errors
      why: the success or error output path is missing or differs from the description
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::http::.*tests::request_error_/)'
oracle_cases: []
deviations:
  - what: >-
      When both --data and --json are given to http request, betterlite always sends --json's
      value and ignores --data, instead of requests' own rule (a truthy data value wins over
      json, but an empty-string data value doesn't, since requests checks "if not data").
    why: >-
      That precedence is an accident of the requests library's own body-encoding branch, not
      something LiteLLM declares, and nothing sends both flags on one call on purpose; one
      deterministic rule beats porting a Python truthiness check docs/compatibility.md already
      puts outside the contract.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/http_client.py#L76-L91
  - what: >-
      chat's welcome message, help text and history view print as plain lines: the wording, the
      listed commands and the order stay chat.py's, but the color, the box border around the
      welcome and help panels, and rich's inline markup are gone, and the Available Models
      table is drawn with comfy-table instead of rich's Table.
    why: >-
      Matches the plain, uncolored convention this family's other tables already use (B4579,
      B4580); nothing a person reads depends on color or a box border, and chat has no
      --format json escape hatch the way the table commands do, so the content itself is
      unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/chat.py#L174-L184
  - what: >-
      Ctrl+C has no handling anywhere in chat: it ends the process through the OS's default
      SIGINT action at the per-turn prompt and during a streamed reply alike, instead of
      printing "Chat session ended." or "Chat session interrupted." and returning normally.
      Reaching end of input still ends the session with "Chat session ended." and a normal
      exit, since that needs no signal handling.
    why: >-
      Both of chat.py's Ctrl+C messages exist only because Python's default signal handler
      turns SIGINT into a raised exception that console.input() and the chat loop already
      catch; Rust installs no such handler by default. Trapping a real OS signal around an
      interactive-only command isn't wire format, a header, a status code or a config default
      a script depends on, and the injected terminal port already covers the one case that
      doesn't need a signal (end of input) through its own return value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/chat.py#L189-L193
out_of_scope:
  - >-
    Client, ChatClient, HTTPClient and ModelsManagementClient as importable Python classes stay
    B169's reference (the M12 Python package); this task builds the Rust equivalent of only the
    requests chat.py and http.py send, on the shared client B4580 builds.
  - >-
    UnauthorizedError's 401-specific text and redaction (exceptions.py) is not built: chat.py's
    model fetch and stream calls catch it through the same broad except branch as every other
    error, with no 401-specific message of its own.
  - The CLI context values base_url and api_key and the config file they come from are B4560's.
  - >-
    crates/betterlite-cli/src/commands.rs declares the chat and http modules and holds the
    shared client and shared HTTP-error printer this task's requests go through; B4580 owns
    that file.
  - The main CLI entry point and command registration are B134's.
  - >-
    commands::models (the "models" command group) is a different concern from chat's own
    internal GET /models call for its picker, and stays B4578's.
pitfalls:
  - >-
    The outer loop's skip gate checks startswith against all nine command prefixes, but the
    dispatcher only matches most of them exactly and only /save and /load by prefix, so
    "/quitnow" or "/modeling" matches the outer gate, dispatches to nothing, and is silently
    dropped instead of being sent as a chat message.
  - >-
    A /models response whose call succeeds but whose "data" field isn't a JSON array prints no
    warning at all and just falls back to an empty list; only a transport failure, a non-2xx
    status, or a response with no "data" field at all prints the "Warning: Could not fetch
    models list" line.
  - >-
    /model mid-session stays on the current model with no message at all on a blank or
    cancelled pick, while the same blank-or-cancelled pick at startup exits the whole command;
    both share the same picker and only differ in how the caller reacts to no pick.
  - >-
    chat's own stream-error printer reads only the body's error.message field (with an
    "Unknown error" default), not the whole body the way commands.rs's shared HTTP-error
    printer does for every other command module; don't reuse that shared printer here.
  - >-
    A streamed reply's HTTP error or any other error during the read ends only that one turn;
    the main loop then prints "Error: No content received from the model" next and keeps the
    session going, so neither error path ever ends the chat session.
  - >-
    StreamResponse::body_stream can split a line, or even the "data: " prefix, across two chunks;
    buffer a partial line until a newline completes it before handing it to the per-line
    decoder, which the fuzz target and corpus exercise but line-reassembly across chunk
    boundaries does not, so a hand-written test must cover a line split across two feeds.
  - >-
    A user-supplied -H "Authorization:..." header on http request is overwritten by the shared
    client's own Bearer header whenever an api_key is configured, because HTTPClient applies
    the caller's headers first and sets Authorization afterward only when a key is present.
  - >-
    http's uri joins onto base_url with every leading "/" stripped, not just one:
    str.lstrip("/") removes all of them, so "//foo" joins as "{base}/foo", not "{base}//foo".
  - >-
    --json's parse accepts any JSON value, not only an object: --json "123" sends the request
    body as the bare number 123, and the same is true of --data once it falls through to being
    parsed as JSON.
  - >-
    deny.toml lets only betterlite-http, betterlite-oracle and betterlite-guardrails depend on
    reqwest, so this task's Cargo.toml change never adds reqwest. The client, StreamResponse and
    http::Method all come through B4580's shared client, betterlite-http and the http crate
    B4580 adds.
