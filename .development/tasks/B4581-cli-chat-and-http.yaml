id: B4581
title: CLI interactive chat and HTTP request commands
description: >-
  Build the chat command and the http command group of betterlite-cli in Rust, ported from
  LiteLLM's litellm/proxy/client/cli/commands/chat.py and http.py. chat lives in
  crates/betterlite-cli/src/commands/chat.rs and chat/**, http in
  crates/betterlite-cli/src/commands/http.rs and http/**. chat is a single clap::Args struct
  (model as an optional positional argument, --temperature/-t a float defaulting to 0.7,
  --max-tokens an optional integer, --system/-s an optional string) and a
  run_chat_command(args, cli_context, client, terminal, conversation_store) -> Result<(), ChatError>
  function; http is a clap::Subcommand enum with one Request variant (method and uri as
  positional arguments, --data/-d and --json/-j as optional strings, --header/-H repeatable)
  and a run_http_command(command, cli_context, client, stdout, stderr) -> Result<(), HttpError>
  function. Both take B4560's CliContext (base_url, api_key) and the shared client B4580's
  commands.rs builds around betterlite-http's ProxiedClient; neither opens its own client or re-reads base_url/api_key from anywhere
  else. chat takes two more injected ports instead of touching a real terminal or the
  filesystem directly: one for reading a line of input and writing output (a read that signals
  end of input the way EOF does, a write for a full line, and a write for a fragment with no
  trailing newline, for the streamed content), and one for saving and loading a conversation
  file. Tests inject fakes for both, so none of chat's tests open a real terminal or write to
  the real filesystem.

  LiteLLM's Client, ChatClient, HTTPClient and ModelsManagementClient
  (litellm/proxy/client/__init__.py, chat.py, http_client.py, models.py) are B169's Python
  client package; this task ports only the requests chat.py and http.py actually send, built on
  B4580's shared client, not those classes' full surface. ChatClient always sends
  Content-Type: application/json (set as a header next to the serde_json body bytes, since
  betterlite-http builds reqwest without its json feature) and Bearer
  only when a key is given; its completions_stream POSTs {base}/chat/completions with model,
  messages and stream: true, plus temperature whenever chat.py has a value (it always does,
  since --temperature defaults to 0.7) and max_tokens only when --max-tokens is given.
  top_p, n, presence_penalty, frequency_penalty and user are declared by ChatClient but chat.py
  never supplies them, so this task never sends them. The response body is read as a byte
  stream, not buffered into one Vec: the response ProxiedClient::execute returns goes into
  betterlite-http's StreamResponse, and StreamResponse::body_stream yields each chunk as it's
  read (betterlite-http already builds reqwest with its stream feature, so this task changes no
  reqwest feature). ChatClient's timeout is 600 seconds, and requests applies it to the connect
  and to each read, not to the whole reply, so the stream request carries no whole-request
  timeout; tokio::time::timeout bounds the wait for the response head and for each next chunk
  at 600 seconds instead. GET /models and http request use B4580's 30-second request timeout.
  A chunk of bytes from the stream can split a line, or even the "data: " prefix, in half, so
  the port buffers a partial line in memory until a newline completes it before handing that
  complete line to the per-line decoder; requests' iter_lines() does this invisibly to chat.py.
  For each complete line: an empty line is skipped, a line that doesn't start with "data: " is
  skipped, the literal payload "[DONE]" (after trimming it) ends the stream, and any other
  payload is parsed as JSON; a payload that isn't valid JSON is skipped, not an error (chat.py
  silently continues past a JSON decode failure). A parsed chunk's first choice's delta content,
  when present and non-empty, is appended to the turn's reply and written immediately as a
  fragment with no trailing newline, the way console.print(content, end="") plus a flush does;
  nothing else in the chunk is read. This per-line decode is a parser of bytes from outside
  (a provider's or a gateway's streamed response reaches it unchanged), so it needs its own
  cargo-fuzz target: a new fuzz_targets/stream_line.rs and [[bin]] entry in the existing
  crates/betterlite-cli/fuzz/Cargo.toml (already a cargo-fuzz package with two targets from
  B4573 and B4590), feeding arbitrary bytes to the public decode function, with a committed
  seed corpus under crates/betterlite-cli/fuzz/corpus/stream_line/ and a test named
  replays_the_stream_line_corpus that replays every file in it.

  chat() resolves a model before building the chat client: with no MODEL argument, it sends
  GET {base}/models through the shared client (Bearer when a key is given, no body) and reads
  the typed response the way ModelsManagementClient.list() declares it, a JSON object with a
  "data" array of model objects carrying an id and an owned_by string. Any failure reaching
  that point (a non-2xx status, a transport error, or a response with no "data" field at all)
  prints "Warning: Could not fetch models list: {error}" to stderr, with betterlite's own
  error text, and falls back to an empty list; a response whose "data" parses but isn't a JSON
  array (an object, a string, a number, a bool or null) falls back to an empty list too, but
  prints nothing at all, since _get_available_models's own isinstance check for that case sits
  outside its try/except. With models available, chat shows a comfy-table "Available Models"
  table (Index, Model ID, Owned By columns, at most the first 200 rows, with a line noting how
  many more there are past that) and prompts to pick one by index or type a model name; leaving
  the prompt blank picks index 1 (_select_model's Prompt.ask default), an out-of-range index
  re-prompts with a message naming the valid range, and reaching end of input cancels the pick
  (prints a cancelled message, returns no model). With no models available, it prompts for a
  model name directly instead; an empty answer there also counts as no model picked. When the
  initial pick comes back empty, chat prints "No models available or could not fetch models
  list." or "No model selected. Exiting." as chat.py does and the whole command returns without
  entering its loop. Mid-session, the "/model" command repeats the same picker but reacts
  differently to an empty pick: it just stays on the current model with no message at all,
  where the startup picker exits the whole command.

  The welcome message, help text and conversation history print as plain lines, not rich's
  colored, boxed panels: the wording, the listed commands and their order stay chat.py's, only
  the color, the box border and the markup are gone. The welcome line states the model, the
  temperature and the max-tokens value (or "unlimited" when none was given); help lists every
  "/" command; history numbers each turn and labels it System, You or Assistant, truncating an
  assistant turn past 100 characters with a trailing "...". The main loop reads one line at a
  time through the injected terminal port; reaching end of input there prints "Chat session
  ended." and ends the loop the same way chat.py's except (EOFError, KeyboardInterrupt) at that
  one read does. Special commands: "/quit", "/exit" and "/q" end the session with "Chat session
  ended."; "/help" shows help; "/clear" empties the history (keeping the system message, when
  one was given, as the sole entry); "/history" shows it; "/save <name>" and "/load <name>"
  save and load the history as JSON through the injected conversation-file port, appending
  ".json" to a name that doesn't already end with it; "/model" offers the picker. _save_conversation
  and _load_conversation only ever look at the first two whitespace-split words of the input
  line, so "/save a b c" still saves to "a.json"; a line that's just "/save" or "/load" with no
  second word prints "Usage: /save <filename>" or "Usage: /load <filename>" and does nothing
  else; a load whose file doesn't exist prints "File not found: {filename}" and otherwise
  returns the system message alone (or an empty history, with no system message) rather than
  touching the current history; any other load or save failure prints "Error saving
  conversation: {error}" or "Error loading conversation: {error}". Separately, before any of
  this special-command handling decides whether to run it, chat() also checks whether the raw
  input text starts with one of nine prefixes ("/quit", "/exit", "/q", "/help", "/clear",
  "/history", "/save", "/load", "/model") or is empty, and when it does, skips adding that line
  to the conversation and skips sending it, regardless of whether the dispatch above actually
  recognized it as one of its own commands. A normal line (one that isn't empty and doesn't
  start with any of those nine prefixes) is appended to the history as a user turn and sent.

  Any error inside the stream read (an HTTP error status or anything else, including a
  transport failure) ends that one turn without ending the session: an HTTP error prints
  "Error: HTTP {status}" to stderr, then the body's error.message field when the body parses
  as JSON and has one (defaulting to "Unknown error" when it parses but that field is missing),
  or the raw body text when it doesn't parse as JSON at all; any other error prints
  "Error: {error}". Either way the turn produces no reply, so the main loop's own check for an
  empty reply then prints "Error: No content received from the model" and goes on to the next
  prompt. This error-printing belongs to chat.rs alone: it reads a narrower shape than the
  shared HTTP-error printer commands.rs exposes for the other command modules (just
  error.message, not the whole body), so chat.rs does not call that shared printer.

  Ctrl+C gets no handling anywhere in this task: reaching end of input (handled above) still
  ends the session the documented way, but an interrupt at the input prompt or during a
  streamed reply just lets the process end through the OS's default SIGINT action, instead of
  printing "Chat session ended." or "Chat session interrupted." the way Python's default signal
  handler (turned into a raised exception console.input() and the outer loop already catch)
  lets chat.py do. See deviations.

  http is a group with one subcommand, request METHOD URI. Headers from repeated -H
  "key:value" entries split on the first colon and trim both sides; an entry with no colon is a
  usage error naming it. --json, when given, must parse as JSON (any JSON value, not only an
  object) or it's a usage error naming the parse failure; that parsed value becomes the request
  body. --data, when given and --json wasn't, is tried as JSON first (again, any JSON value)
  and sent as that value when it parses, or sent as the original string when it doesn't; this
  never errors. When both --data and --json are given, --json's value is sent and --data is
  ignored (see deviations). The request body is genuinely unmodeled JSON, not a shape this
  command can declare, so it is the one typed-wire passthrough field this task needs, with an
  #[expect] that says why; the response body (parsed JSON, printed back pretty, two-space
  indent, trailing newline, matching the convention B4579 already set for this family) is the
  second. method is parsed into http::Method, the type reqwest re-exports; uri joins onto the shared client's
  already-stripped base_url the way HTTPClient.request builds its URL: base_url + "/" + uri
  with every leading "/" on uri removed, not just one (Python's str.lstrip('/') strips all of
  them). The shared client, per B4580, already adds Authorization: Bearer {api_key} when a key
  is given; it does this after any headers this command passes in for the request, so a
  user-supplied "-H Authorization:..." header is silently overwritten by the real key whenever
  one is configured, matching HTTPClient.request's own header-then-Bearer order. A successful
  request prints the parsed response body as pretty JSON to stdout. An HTTP error status calls
  the same shared HTTP-error-printing function commands.rs exposes for the rest of this crate
  ("Error: HTTP {status}" to stderr, then the body as JSON when it parses or the raw text when
  it doesn't) and returns the Aborted error variant; any other error (a bad method token, a
  transport failure) returns a variant whose text the root prints as one line on stderr with
  exit 1, the way an uncaught Python exception would already exit 1 with a traceback.
scope:
  paths:
    - crates/betterlite-cli/Cargo.toml
    - Cargo.lock
    - crates/betterlite-cli/src/commands/chat.rs
    - crates/betterlite-cli/src/commands/chat/**
    - crates/betterlite-cli/src/commands/http.rs
    - crates/betterlite-cli/src/commands/http/**
    - crates/betterlite-cli/fuzz/Cargo.toml
    - crates/betterlite-cli/fuzz/fuzz_targets/stream_line.rs
    - crates/betterlite-cli/fuzz/corpus/stream_line/**
  lint_tables: false
