id: B3043
title: Admit project input-output token reservations
description: >-
  Build _reserve_project_io_tokens_or_raise to enforce separate project input-token and output-token limits (ITPM/OTPM) on completion and embedding requests. This function orchestrates precise-input estimation, output capping and IO token reservation, refunding the preceding combined-TPM reservation and releasing concurrency slots on rejection to keep the request stash consistent.

  The function examines only descriptors marked as PROJECT_ITPM_DESCRIPTOR_KEY or PROJECT_OTPM_DESCRIPTOR_KEY. For non-dict request data, it returns early without side effects. It reads the minimum configured OTPM limit to bound output estimation (the implicit cap prevents unbounded response generation from overshooting the budget before post-call accounting runs).

  Estimation calls _estimate_input_and_output_tokens (early termination using the implicit floor on output) and _estimate_precise_input_tokens (async-offloaded, as the outline names offload_token_count as a dependency open to assignment), then passes both to reserve_io_tokens. The function stores itpm/otpm reserved token counts and their per-scope, per-window identities in the request stash: (counter_key, window_start, backend) tuples that post-call reconciliation uses to adjust actual usage.

  On OVER_LIMIT from the IO reservation, the function refunds the combined-TPM reservation (stored by its caller in tpm_reservation_scopes/tpm_reservation_amount) by calling _refund_reserved_tokens, then releases the concurrency slot acquired earlier (via _release_stashed_parallel_slot). It marks the stash.reservation_released=True so post-call failure hooks don't refund the combined-TPM reservation a second time. Finally it calls _handle_rate_limit_error with the IO response to raise the limiter error.

  On successful reservation, merge IO response statuses into the stored rate_limit_response (or store the IO response itself if none is stored yet) so response/logging headers carry both windowed and IO limits. Log the precise reserved amounts and model identity for observability.

  The function reserves project IO tokens unconditionally whenever project ITPM/OTPM descriptors are present. The config key LITELLM_TPM_TOKEN_RESERVATION_ENABLED (default true, case-insensitive) only gates the caller's combined-TPM reservation and skip_tpm_check behavior, not this function's IO reservation.
