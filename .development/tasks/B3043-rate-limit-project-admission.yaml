dod:
  - text: Project IO token descriptors are filtered from the full descriptor list and examined for presence.
    proof: [project-admission-tests]
  - text: Non-dict request data returns early without claiming the stash or calling downstream functions.
    proof: [project-admission-tests]
  - text: Input and output tokens are estimated via the B3041 functions and passed to reserve_io_tokens.
    proof: [project-admission-tests]
  - text: On OVER_LIMIT response, combined-TPM is refunded when tpm_reservation_amount > 0, concurrency is released, and reservation_released=True is set.
    proof: [project-admission-tests]
  - text: Stash stores itpm_reserved_tokens, itpm_reserved_scopes and itpm_reserved_windows when ITPM amount > 0.
    proof: [project-admission-tests]
  - text: Stash stores otpm_reserved_tokens, otpm_reserved_scopes and otpm_reserved_windows when OTPM amount > 0.
    proof: [project-admission-tests]
  - text: Successful IO response statuses are merged into the stored rate_limit_response, or the IO response itself is stored if no prior response exists.
    proof: [project-admission-tests]
  - text: Observability logging includes reserved amounts and model identity.
    proof: [project-admission-tests]
  - text: Oracle cases cover non-dict data, missing IO descriptors, successful ITPM reservation, successful OTPM reservation, joint ITPM+OTPM reservation, over-limit with TPM refund, and over-limit with no TPM refund.
    proof: [project-admission-oracle]
