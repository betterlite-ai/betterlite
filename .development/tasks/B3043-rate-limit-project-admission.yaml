deviations:
  - what: "Request data that is not a dict is treated as having no project IO limits: the function returns early without claiming the stash or examining descriptors."
    why: LiteLLM's function guards on isinstance(data, dict) and returns; betterlite enforces the same boundary to maintain compatible rate limiting behavior for non-standard request formats.
out_of_scope:
  - The estimation functions themselves (B3041 owns them), token reservation (B3042), error handling (B3030), stash access (B3031), and concurrency release (B3035).
  - Offload execution model for _estimate_precise_input_tokens; the outline marks offload_token_count as an open dependency.
  - Cache transport for window-identity storage; the outline marks post-call batch transport as an open dependency.
pitfalls:
  - "Refunding combined-TPM must check tpm_reservation_amount > 0 to avoid refunding a zero or nonexistent reservation, and must set stash.reservation_released=True before raising the error so post-call failure hooks do not refund the same reservation again."
  - "Window identities are filtered by counter_key substring ('model_per_project_itpm' for ITPM, 'model_per_project_otpm' for OTPM) to exclude unrelated windows from the batch response."
  - "io_response.get('reservation_windows', frozenset()) may return an empty sequence; both scopes and window identities must handle empty lists gracefully."
  - "Storing scopes as frozenset() of tuples (key, value) and window_identities as frozenset() of tuples (counter_key, window_start, backend) ensures immutability and consistent post-call access."
  - "The implicit output cap is applied before reservation, not after. A hard cap prevents unbounded responses from overshooting the budget during generation, so it must be called even if the reservation succeeds."
  - "Merging IO response statuses into the stored rate_limit_response maintains header values from both windowed RPM/TPM and project IO limits; storing the IO response directly when none is stored yet ensures statuses reach logging callbacks."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 2
