  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/cooldown_handlers.py#L350-L370
    why: The cooldown caller of the team sibling count.
dod:
  - text: A model name is recognized by name, deployment id, alias or routing group, and not by a wildcard alone.
    proof: [catalog-recognized]
  - text: The team sibling count ignores blocked deployments and needs both team fields, and the team mapping keeps the name or falls back to the public name.
    proof: [catalog-team]
  - text: Resolved provider models keep list order and skip empty ones, and a wildcard access group is found through the pattern router.
    proof: [catalog-resolved, catalog-access-group]
  - text: Order levels prefer the pre-routing selection and skip deployments without an order.
    proof: [catalog-order-levels]
  - text: The fallback reachability check follows LiteLLM's order of tests and prefers request values over router values.
    proof: [catalog-can-fall-back]
  - text: "`messages_can_fall_back` reads B8440's `config.sections.weighted_failover.enabled` and answers true when it is set, right after the fallbacks-off test."
    proof: [catalog-can-fall-back]
checks:
  optional:
  - mutants
  commands:
  - id: catalog-recognized
    why: An alias or a deployment id is refused, or a wildcard counts.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^catalog_queries::tests::recognized_/)'
  - id: catalog-team
    why: A blocked sibling keeps a team model out of cooldown, or the public name is lost.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^catalog_queries::tests::team_/)'
  - id: catalog-resolved
    why: An empty provider model is returned or the order changes.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^catalog_queries::tests::resolved_/)'
  - id: catalog-access-group
    why: A wildcard access group is missed.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^catalog_queries::tests::access_group_/)'
  - id: catalog-order-levels
    why: The order levels read the wrong group.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^catalog_queries::tests::order_levels_/)'
  - id: catalog-can-fall-back
    why: Frames are held back when no fallback can run, or released when one can.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^catalog_queries::tests::can_fall_back_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "B302 owns the catalog and aliases, B323 routing groups, B844 the model list and deployment lookup, B847 access groups and cached group info, B307 the blocked filter, B309 the fallback request helpers, B306 the fallback group lookup and B399 the content policy check."
  - "The callers wire these queries in: B312 (Messages stream fallback), B363 (routing plugins), B940, B6460 and B3880 (proxy gates) and the cooldown wiring for B369."
  - "Router.routing_group_has_alternatives is not in this task; its owner is named in B016's inventory."
pitfalls:
  - "`team_model_has_alternatives` counts siblings after the blocked filter, so two deployments with one paused give false."
  - "`map_team_model` with no model name returns the deployment's public name, not the internal `model_name`, when both are set."
  - "`messages_can_fall_back` reads `fallbacks` from the request before the router, so a request that sends an empty `fallbacks` list hides the router's list and gets false."
  - "The order level skip starts at the first level when `_target_order` is absent, so a request with two levels and no target can still fall back."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
