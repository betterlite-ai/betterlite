id: B598
title: Bedrock model capabilities and route selection
description: >-
  Implement BedrockRoute selection from exact explicit route prefixes, model catalog flags and raw request requirements.
  Return closed route tags without constructing or invoking another provider. Reuse B2203 model normalization and
  B596 trusted metadata ownership. Preserve request filtering before route choice and source fallback to invoke;
  B690 owns Mantle endpoint settings and other capability predicates.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  get_bedrock_tool_name L753-L766; is_bedrock_application_inference_profile_arn L796-L802; without_bedrock_route_prefix
  L817-L818; _model_cost_entry L837-L839; _bedrock_price_map_entries L842-L846; _bedrock_price_map_flag L849-L850;
  _price_map_entry_lists_endpoint L853-L855; _openai_gpt_version L858-L862; bedrock_runtime_chat_completions_is_default
  L865-L878; bedrock_runtime_chat_completions_serves_tools_with_reasoning L881-L888; bedrock_runtime_chat_completions_enforces_response_format
  L891-L898; bedrock_model_is_openai_gpt L901-L903; _response_format_needs_converse L922-L931; bedrock_request_needs_converse
  L934-L967; _chat_completions_unless_converse_needed L970-L975; bedrock_route_for_request L978-L989; BedrockModelInfo.get_api_base
  L1273-L1277; BedrockModelInfo.get_api_key L1280-L1284; BedrockModelInfo.validate_environment L1286-L1296; BedrockModelInfo.get_models
  L1298-L1299; BedrockModelInfo.get_bedrock_route L1347-L1414; BedrockModelInfo._explicit_converse_route L1417-L1421;
  BedrockModelInfo._explicit_claude_platform_route L1424-L1428; BedrockModelInfo.get_claude_platform_model L1431-L1435;
  BedrockModelInfo.map_claude_platform_auth_params L1438-L1449; BedrockModelInfo._model_has_route_prefix L1473-L1486;
  BedrockModelInfo._explicit_mantle_route L1489-L1493.


  Reuse bedrock_request_metadata_is_owned from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Named case contracts: explicit_route_prefixes: Check route tokens in this priority order: invoke/,claude_platform/,converse_like/,converse/,agent/,agentcore/,async_invoke/,openai/,mantle/.
  A token matches startswith or immediately after any slash, not bare substring; priority is mapping order, not
  earliest token position in model. bedrock_mantle/ must not match mantle/. Each explicit token returns its route
  without request fallback checks. Explicit chat_completions/ is checked after all of those and may fall back to
  converse. gpt_runtime_default_capability: Parse version with (^|[./])openai\.gpt-(\d{1,3})(?!\d)(?:\.(\d{1,3})(?!\d))?;
  missing minor=0, no end anchor after major/minor, gpt-oss fails. Version >=(5,6) and any exact supported_endpoints
  list/tuple containing /v1/chat/completions selects default native route. Check catalog keys in order original,
  B2203 routing-stripped, B2203 region-stripped (duplicates allowed); non-None malformed entries raise validation
  errors, not silently ignored. Feature flags require literal True, not truthiness. bedrock_model_is_openai_gpt
  simply tests version parse, including earlier/future versions. converse_only_request_fields: Any non-None guardrailConfig,performanceConfig,serviceTier,requestMetadata,outputConfig,thinking,additionalModelRequestFields,top_k,stop,model_id
  forces native-chat fallback to converse, including false/empty values. B596 operator metadata ownership also forces
  fallback even if no values resolve. Only evaluate fallback when request_params supplied; None stays chat_completions.
  response_format_needs_converse: None/text mapping stays native. Nondict response_format stays native only with
  supports_bedrock_runtime_chat_completions_response_format literal True. Dict requires type=json_schema plus presence
  of json_schema key (value mayNone) and that same flag. Every other dict including json_object/empty/json_schema
  without key falls back to converse. tools_with_reasoning: With no truthy tools or functions, no tools fallback.
  Otherwise native remains only if supports_bedrock_runtime_chat_completions_tools_with_reasoning literal True or
  reasoning_effort exactly string none; missing/None/other effort uses converse. Empty tools/functions do not trigger
  this check. additional_drop_before_route: bedrock_route_for_request removes all exact additional_drop_params keys
  from raw request into a new mapping before route selection, including stop/model_id/tools/reasoning_effort. Mapping
  and transport must consume the same route result. Do not mutate original request or apply OpenAI mapping before
  this decision. catalog_and_unknown_route: After explicit routes, replace first bedrock/ occurrence anywhere and
  check leading nova-2/ or nova/ ->converse. Any substring :application-inference-profile/ ->converse. Then default
  native GPT check. Then B2203 base/routing-stripped ids in litellm.bedrock_converse_models ->converse; otherwise
  regex (^|[./])openai\. on base id ->converse; unknown ->invoke without error. Preserve nova/ARN and cross-region/throughput
  effects through B2203 cases. route_helpers_and_workspace_keys: without_bedrock_route_prefix replaces every converse/
  then chat_completions/ occurrence, not just a leading prefix. get_claude_platform_model removes first claude_platform/
  anywhere. _explicit_converse_route,_explicit_claude_platform_route,_explicit_mantle_route use the same segment-boundary
  predicate. map_claude_platform_auth_params copies workspace_id,aws_workspace_id,anthropic_workspace_id whenever
  present including None/empty and overwrites optional values, leaving unrelated keys untouched. model_info_passthrough:
  get_api_base/api_key return the supplied value unchanged including None/empty, with no environment defaults. validate_environment
  returns headers unchanged, get_models returns[]. Token-counter factory belongs to B641 so this lower route task
  never depends on a counter that uses its routes. reverse_tool_name_lookup: get_bedrock_tool_name checks exact
  key in litellm.bedrock_tool_name_mappings.cache_dict and returns stored value when present, otherwise input unchanged;
  no sanitization or fallback name here. Inject the shared parsed tool-name mapping as per-call context; producer
  ownership stays with message conversion.


  Implement crates/betterlite-bedrock/src/model_routes.rs with adjacent tests under model_routes/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function model_routes_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  explicit_route_prefixes, gpt_runtime_default_capability, converse_only_request_fields, response_format_needs_converse,
  tools_with_reasoning, additional_drop_before_route, catalog_and_unknown_route, route_helpers_and_workspace_keys,
  model_info_passthrough, reverse_tool_name_lookup. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_model_routes* using HelperCase: kind:
  helper and the externally tagged bedrock_model_routes variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_model_routes that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 250 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 275 production lines, 275 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 690 planned, 700 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/model_routes.rs
  - crates/betterlite-bedrock/src/model_routes/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/model_routes.rs
  - tools/oracle/src/helpers/bedrock/model_routes/**
  - tools/oracle/helpers/bedrock_model_routes.py
  - tools/oracle/helpers/bedrock_model_routes/**
  - tools/oracle/cases/helpers/providers/bedrock-model-routes/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_model_routes*
  lint_tables: false
