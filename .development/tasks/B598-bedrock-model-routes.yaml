    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_model_routes.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_model_routes*")"
      && grep -lq 'bedrock_model_routes' tools/oracle/fuzz/corpus/helper_case/bedrock_model_routes* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_model_routes$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
