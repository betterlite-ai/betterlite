id: B598
title: Bedrock model capabilities and route selection
description: >-
  Add BedrockRoute selection over catalog capabilities, explicit route prefixes, request-only Converse requirements,
  Mantle endpoint settings and model-name normalization. Return closed route/config tags; leaf routing never executes
  another provider. Consume BEDROCK_MANTLE_API_BASE from B690 resolved settings. Preserve unknown-model/cache-point
  permissiveness and metadata-driven strict-tools/effort ceilings with source fallback diagnostics.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  get_bedrock_tool_name L753-L766; is_bedrock_application_inference_profile_arn L796-L802; without_bedrock_route_prefix
  L817-L818; _model_cost_entry L837-L839; _bedrock_price_map_entries L842-L846; _bedrock_price_map_flag L849-L850;
  _price_map_entry_lists_endpoint L853-L855; _openai_gpt_version L858-L862; bedrock_runtime_chat_completions_is_default
  L865-L878; bedrock_runtime_chat_completions_serves_tools_with_reasoning L881-L888; bedrock_runtime_chat_completions_enforces_response_format
  L891-L898; bedrock_model_is_openai_gpt L901-L903; _response_format_needs_converse L922-L931; bedrock_request_needs_converse
  L934-L967; _chat_completions_unless_converse_needed L970-L975; bedrock_route_for_request L978-L989; BedrockModelInfo.get_api_base
  L1273-L1277; BedrockModelInfo.get_api_key L1280-L1284; BedrockModelInfo.validate_environment L1286-L1296; BedrockModelInfo.get_models
  L1298-L1299; BedrockModelInfo.get_token_counter L1317-L1324; BedrockModelInfo.get_bedrock_route L1347-L1414; BedrockModelInfo._explicit_converse_route
  L1417-L1421; BedrockModelInfo._explicit_claude_platform_route L1424-L1428; BedrockModelInfo.get_claude_platform_model
  L1431-L1435; BedrockModelInfo.map_claude_platform_auth_params L1438-L1449; BedrockModelInfo._model_has_route_prefix
  L1473-L1486; BedrockModelInfo._explicit_mantle_route L1489-L1493.


  Reuse bedrock_request_metadata_is_owned from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-bedrock/src/model_routes.rs with adjacent tests under model_routes/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_model_routes in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function model_routes_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  explicit_route_prefixes, gpt_runtime_default_capability, converse_only_request_fields, response_format_needs_converse,
  tools_with_reasoning, additional_drop_before_route, cross_region_model_normalization, throughput_suffix. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases
  use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_model_routes* using HelperCase: kind:
  helper and the externally tagged bedrock_model_routes variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_model_routes that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 257 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 509 planned, 525 maximum changed lines.
