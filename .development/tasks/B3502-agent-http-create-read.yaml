id: B3502
title: Send managed-agent create list and get requests
description: >-
  Build the outbound HTTP calls that create an agent, list agents and get one agent by name, in the new module betterlite_http::interactions::agents_create_read (crates/betterlite-http/src/interactions/agents_create_read.rs).
  LiteLLM's AgentsHTTPHandler has six request methods; this task owns create_agent, list_agents and get_agent, each with a sync and an async form. Delete and list-versions belong to B3503, which uses its own module.
  The Rust form has no _is_async switch. Write one blocking function and one async function per operation (create_agent and async_create_agent, list_agents and async_list_agents, get_agent and async_get_agent). The shared client resolution comes from B3492's base module: the blocking form calls its sync client resolver, the async form calls its async client resolver, and both pass the optional caller-supplied client first. Error conversion also comes from B3492's handle_error, called with the agents config; never rebuild it here.
  All six functions take the agents config (B1392's Studio agent config, behind the same trait B3501 selects), the litellm params, the logging object, optional extra headers and an optional timeout. Create also takes the agent name and an optional extra_body map, list takes neither, get takes the agent name.
  Create flow: headers = config.validate_environment(extra headers or an empty map, params); url = config.get_complete_url(params.api_base, params); data = config.transform_create_request(name, params); then every key of extra_body replaces the same key in data (dict update, so the caller wins). Call logging pre_call with input = name, api_key = "" and additional_args holding complete_input_dict = data, api_base = url and headers. POST url with headers, json = data and timeout = the caller's timeout, or the global request_timeout (REQUEST_TIMEOUT env var, default 6000 seconds, owned by B198) when the caller gave none. Any error goes through handle_error with the agents config and is returned as that value. On success call post_call with original_response = the response text and additional_args holding only complete_input_dict = data, then return config.transform_create_response(response, name).
  List flow: headers as above; (url, params) = config.transform_list_request(params.api_base, params); pre_call with input = "list_agents", api_key = "" and additional_args holding only api_base = url and headers; GET url with headers and the query params; errors through handle_error; post_call with the response text and empty additional_args; return config.transform_list_response(response). The timeout argument is accepted and then ignored: the GET carries no timeout, so the client default applies.
  Get flow: same as list, except (url, params) = config.transform_get_request(name, params.api_base, params), pre_call input = name, and the result is config.transform_get_response(response, name). Its GET also carries no timeout.
  The call order inside each function is fixed: resolve the client first, then validate_environment, then URL building, then pre_call, then the request. A failing validate_environment therefore still creates the client and never logs.
  The module is a thin transport layer. It does not pick the provider (B3501), build bodies or parse responses (B1392), or create the logging object (B3501). It must not call a provider crate directly; it sees only the config trait object.
