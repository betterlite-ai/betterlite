dod:
  - text: create_agent and async_create_agent build headers, URL and body through the config, let extra_body keys replace body keys, and return the config's transformed create response.
    proof: [agent-create-tests]
  - text: Create sends the caller's timeout, or the request_timeout default of 6000 seconds when none is given, and logs pre_call and post_call with the exact input and additional_args described.
    proof: [agent-create-tests]
  - text: list_agents and async_list_agents GET the URL and query params from transform_list_request with no timeout, log input "list_agents", and return transform_list_response.
    proof: [agent-list-tests]
  - text: get_agent and async_get_agent GET the URL and query params from transform_get_request, log the agent name as input, and return transform_get_response with the name.
    proof: [agent-get-tests]
  - text: A transport status error in any of the six functions is converted by handle_error with the agents config, and no post_call is logged for it.
    proof: [agent-create-tests, agent-list-tests, agent-get-tests]
  - text: A caller-supplied client is used as is, and without one the sync form resolves a sync client and the async form an async client, both through B3492's base module.
    proof: [agent-client-tests]
