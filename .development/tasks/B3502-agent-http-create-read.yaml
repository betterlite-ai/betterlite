oracle_cases: []
deviations:
  - what: Each operation is a blocking function plus an async function, with no _is_async flag and no function that returns either a value or a coroutine.
    why: Rust has no dynamic return type of that kind; B3504 picks the form from the caller's acreate_agent, alist_agents or aget_agent flag.
  - what: The async functions accept an optional async client, which LiteLLM's dispatcher never forwards.
    why: LiteLLM's async_* methods already have a client parameter, and the dispatcher drops it only by omission; no caller at the pin supplies one, so a direct async call keeps the parameter.
out_of_scope:
  - "delete_agent, async_delete_agent, list_agent_versions, async_list_agent_versions and the agents_http_handler singleton: B3503 owns them in its own module."
  - "Provider selection, header merging and the logging object: B3501."
  - "The transform_* methods, validate_environment and get_complete_url bodies: B1392."
  - "_handle_error, _sync_client and _async_client: B3492."
  - "The public create_agent, list_agents and get_agent entry points that read acreate_agent, alist_agents and aget_agent from kwargs: B3504 and B3505."
pitfalls:
  - Only create passes a timeout (timeout or request_timeout); list and get call GET with url, headers and params only, so a timeout argument there has no effect.
  - extra_body is applied with dict update, so a key such as "name" in extra_body replaces the transformed body value.
  - post_call after create carries additional_args {complete_input_dict}, but list and get pass an empty additional_args; do not add api_base or headers there.
  - pre_call for list uses the literal input "list_agents", while create and get use the agent name.
  - validate_environment gets headers = extra_headers or {}, so None and an empty map behave the same.
  - get_agent passes the name to transform_get_request and again to transform_get_response; losing the second one changes the returned id.
  - The error from a failed request is returned through handle_error, which only converts httpx HTTPStatusError; connection and timeout errors pass through unchanged.
  - LiteLLM's _is_async dispatcher calls the async method without the client argument, so a sync client given to create_agent is never used on the async path.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
