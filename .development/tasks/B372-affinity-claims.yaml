deviations:
- what: The affinity byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/deployment_affinity_check.py#L93-L346
out_of_scope:
- B324 owns final integration and the remaining functions listed in its implementation boundary.
- 'litellm/router_utils/pre_call_checks/deployment_affinity_check.py: B324 owns: warn_on_unknown_model_group_affinity_flags
  (L45-L60), DeploymentAffinityCheck.__init__ (L74-L91), DeploymentAffinityCheck.async_filter_deployments
  (L348-L476), DeploymentAffinityCheck.async_pre_call_deployment_hook (L478-L617).'
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
