id: B372
title: Affinity identity and atomic pin claims
description: 'Implement AffinityKey and AffinityPin, caller-key hashing, model-map identity and local/shared
  first-writer claims. Preserve legacy string pins, TTL refresh and local fallback on Redis outage. Use
  B360 atomic operations and B052 identity; fuzz persisted pin bytes before typed decoding and never expose
  keys. Implement the owned native service in crates/betterlite-router/src/affinity_claims.rs. Add ProbeOperation::AffinityClaims
  in tools/oracle/src/router_probes/mod.rs and the corresponding B372 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/caching/affinity_cache.py:
  set_local_affinity_pin (L50-L53), _legacy_pin_matches (L56-L59), claim_affinity_pin_in_memory (L62-L78),
  _decode_pin (L81-L85), claim_affinity_pin (L88-L125). Implement these behaviors through the typed Rust
  services above; synchronous facades and structural accessors reuse the same primitive instead of separate
  ports. Function coverage in litellm/router_utils/pre_call_checks/deployment_affinity_check.py: DeploymentAffinityCheck._get_effective_flags
  (L93-L112), DeploymentAffinityCheck._looks_like_sha256_hex (L115-L122), DeploymentAffinityCheck._hash_user_key
  (L125-L137), DeploymentAffinityCheck._get_model_map_key_from_litellm_model_name (L140-L165), DeploymentAffinityCheck._get_model_map_key_from_deployment
  (L168-L199), DeploymentAffinityCheck._get_stable_model_map_key_from_deployments (L202-L224), DeploymentAffinityCheck._shorten_for_logs
  (L227-L230), DeploymentAffinityCheck.get_affinity_cache_key (L233-L235), DeploymentAffinityCheck.get_session_affinity_cache_key
  (L238-L244), DeploymentAffinityCheck._get_session_id_from_metadata_dict (L247-L251), DeploymentAffinityCheck._iter_metadata_dicts
  (L254-L265), DeploymentAffinityCheck._first_metadata_value (L268-L270), DeploymentAffinityCheck.get_user_key_from_request_kwargs
  (L273-L291), DeploymentAffinityCheck._get_session_id_from_request_kwargs (L294-L299), DeploymentAffinityCheck._get_marker_session_affinity_ttl
  (L302-L311), DeploymentAffinityCheck._pinned_model_id (L314-L322), DeploymentAffinityCheck._set_local_pin
  (L324-L325), DeploymentAffinityCheck._claim_pin (L327-L329), DeploymentAffinityCheck._claim_pin_in_memory
  (L331-L335), DeploymentAffinityCheck._find_deployment_by_model_id (L338-L346). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. Bound the affinity outside-byte parser to 1048576 bytes before decoding;
  on excess use its typed invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback
  path).'
scope:
