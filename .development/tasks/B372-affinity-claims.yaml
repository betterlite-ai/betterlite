  why: Implementation boundary verified against the pinned checkout.
dod:
- text: Write tests named affinity_claims_behaviors and affinity_claims_boundaries under affinity_claims::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - affinity-claims-behaviors
  - affinity-claims-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-router/fuzz/corpus/affinity/affinity-claims-valid.json and crates/betterlite-router/fuzz/corpus/affinity/affinity-claims-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target affinity and normal replays_the_affinity_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - affinity-claims-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: affinity-claims-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::affinity_claims_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: affinity-claims-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::affinity_claims_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/affinity_claims.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/affinity_claims.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-router/fuzz/corpus/affinity/affinity-claims-valid.json && test -f crates/betterlite-router/fuzz/corpus/affinity/affinity-claims-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/affinity
      | grep -Fq "/affinity-claims-" && test -f crates/betterlite-router/fuzz/fuzz_targets/affinity.rs && cargo nextest
      run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_affinity_corpus)'
