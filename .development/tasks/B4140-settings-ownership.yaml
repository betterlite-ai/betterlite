id: B4140
title: Resolve settings provenance and enforce config ownership
description: >-
  Build a settings-resolution module in betterlite-config with typed provenance
  tracking, absent-versus-null semantics, and config ownership enforcement.
  Implement SettingsStore as a typed mapping that reconciles YAML config values,
  stored database rows (from five sections: general_settings, router_settings,
  litellm_settings, environment_variables, ui_settings), and runtime overrides.
  Track whether each setting came from config (owns it, read-only), database,
  environment, a default, or is unset, so callers never couple to config
  implementation details. Implement FieldDescriptor with per-field precedence
  and separate empty-value policies for alerting (empty DB means cleared) and
  SSO (empty DB means absent). Supply fixed descriptor tables for alerting
  (email, Slack, Teams) with SMTP defaults 587 (port) and True (TLS). Enforce
  that a key declared in the config file cannot be changed by database writes
  or runtime updates; raise ConfigOwnedKeyError with the exact message a user
  sees. Support the pass_through_endpoints resource-list exception (read from
  database only) and ten UI-row aliases that map to ui_settings. Clear runtime
  keys only for those changed in a database update (ignore unchanged rows) and
  preserve config-owned keys through database reloads. Return a plain mapping
  to handlers without exposing internal state. The module exports SettingsStore,
  FieldDescriptor, FieldSource, resolve_fields, config_ownership_message,
  source_for, and coerce_bool (the boolean normalizer for reload paths); no HTTP
  handler dependency or B120 composition coupling.
scope:
  paths:
    - crates/betterlite-config/src/sections/settings.rs
    - crates/betterlite-config/src/sections/settings/**
  lint_tables: false
references:
