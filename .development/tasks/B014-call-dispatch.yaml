id: B014
title: Shared call dispatch and core integration
description: >-
  Compose betterlite-core's single-call pipeline and adapt existing server routes to it, using the existing chat
  and embedding implementations. Define exhaustive request/result enums for chat and embedding, preserving incremental
  streams as a distinct result form. Sequence supported settings/context, provider resolution/parameter preparation,
  pre-call rules, transport, response validation, error mapping and terminal logging exactly once; provide the statically
  dispatched executor B201 needs. Reuse B206's common metadata helpers and B207's route catalog, keeping route recognition
  separate from executable support. The huge main.py/utils.py/init modules also contain routing, caches, spend,
  guardrails and Python wrappers owned by existing backlog tasks; this part covers only the common orchestration
  boundary and existing route integration. Add real-server lifecycle tests and run HTTP regression cases for both
  operations, including stream cancellation and batch execution. Register every entry in the core-stubs check list
  up front. An entry is a request variant and a result variant in operation.rs, a module
  crates/betterlite-core/src/operation/<module>.rs with its request and result types, and a module
  crates/betterlite-core/src/dispatch/<module>.rs whose execute function the dispatch.rs arm calls. Chat and
  embedding are the real entries. The other seventeen are stubs: each execute answers DispatchError::NotBuilt naming its
  entry, and each stub module has an adjacent tests.rs whose call_dispatch_tests_behavior case asserts that error.
  TextStream carries the text_completion request type, so B202's route can send a requested stream before B203
  lands. Every match on the request or result enum has one arm per entry that only calls into that entry's module,
  with no wildcard arm. B202, B015, B080, B082, B3343, B3344, B3345, B6360, B7430 and B8692 then replace only their own stubs and stub tests; B203 also adds
  the bridge selection to dispatch/chat.rs and dispatch/text_completion.rs. None of them edits dispatch.rs or
  operation.rs. Keep the pipeline in betterlite-core above B198 leaf context/AWS types. Write the behavior rstest
  functions call_dispatch_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure
  in the DoD; corpus replay tests have separate names. Budget 300 dispatch, 280 tests and 100 server wiring (680
  total); the seventeen stubs, their tests and their registry lines add about 620 lines outside it.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/dispatch.rs
  - crates/betterlite-core/src/dispatch/**
  - crates/betterlite-core/src/operation.rs
  - crates/betterlite-core/src/operation/**
  - crates/betterlite-server/Cargo.toml
  - crates/betterlite-server/src/server.rs
  - crates/betterlite-server/src/tests.rs
  - crates/betterlite-server/src/routes/chat.rs
  - crates/betterlite-server/src/routes/chat/streaming.rs
  - crates/betterlite-server/src/routes/chat/streaming/tests.rs
  - crates/betterlite-server/src/routes/chat/tests.rs
  - crates/betterlite-server/src/routes/chat/tests/stream/tests.rs
  - crates/betterlite-server/src/routes/embeddings.rs
  - crates/betterlite-server/src/routes/embeddings/tests.rs
  - tools/oracle/helpers/b014.py
  - tools/oracle/helpers/b014/**
  - tools/oracle/src/helpers/oracle/b014.rs
  - tools/oracle/src/helpers/oracle/b014/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L1913-L1990
  why: common_processing_pre_call_logic
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L2461-L2530
  why: base_process_llm_request
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L3625-L3700
  why: _handle_llm_api_exception
dod:
- text: >-
    Every executable call type reaches the shared pipeline and the listed HTTP cases retain upstream/client parity.
  proof:
  - oracle
  - call-dispatch-tests
- text: >-
    Lifecycle order, typed errors, rules and terminal logging occur once, including streamed failure/cancellation
    and batch calls.
  proof:
  - call-dispatch-tests
- text: Unknown operations fail before HTTP and concurrent per-call state remains isolated.
  proof:
  - call-dispatch-tests
- text: >-
    Every entry in the core-stubs list has its request and result variants, an operation module and a dispatch
    module, and each of the seventeen stubs answers DispatchError::NotBuilt in its own call_dispatch_tests_behavior case.
  proof:
  - core-stubs
  - call-dispatch-tests
checks:
  optional:
  - mutants
  commands:
  - id: call-dispatch-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-core -p betterlite-server --no-tests=fail -E 'test(/::call_dispatch_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: core-stubs
    why: a planned core entry has no variant or module file, so its task would have to edit dispatch.rs or operation.rs
    run: |-
      while read -r variant module; do
        test -f "crates/betterlite-core/src/operation/$module.rs" && test -f "crates/betterlite-core/src/dispatch/$module.rs" && grep -qw "$variant" crates/betterlite-core/src/operation.rs && grep -qE "^(pub(\([a-z]+\))? )?mod $module;" crates/betterlite-core/src/operation.rs && grep -qE "^(pub(\([a-z]+\))? )?mod $module;" crates/betterlite-core/src/dispatch.rs || { echo "core entry $variant ($module) is not registered"; exit 1; }
      done <<'EOF'
      Chat chat
      Embedding embedding
      TextCompletion text_completion
      TextStream text_stream
      Moderation moderation
      Responses responses
      ImageGeneration image_generation
      ImageEdit image_edit
      VideoGeneration video_generation
      VideoList video_list
      VideoStatus video_status
      VideoContent video_content
      VideoRemix video_remix
      VideoCreateCharacter video_create_character
      VideoGetCharacter video_get_character
      VideoEdit video_edit
      VideoExtension video_extension
      LlmPassthrough llm_passthrough
      ContainerCall container_call
      EOF
oracle_cases:
- tools/oracle/cases/chat/openai-basic.yaml
- tools/oracle/cases/chat/openai-stream.yaml
- tools/oracle/cases/chat/upstream-429.yaml
- tools/oracle/cases/embeddings/string-input.yaml
deviations: []
out_of_scope:
- Retries/fallbacks/router scheduling are B016-B022; caches B125-B128; spend/budgets M4; guardrails M6.
- Python global settings, import machinery, batch wrappers and response object methods are B157-B167.
- Endpoint-specific schemas and routes outside the two implemented operations stay in their endpoint tasks.
- >-
  The text-completion, text-stream, moderation, Responses and image entries are only stubs here; B202, B203, B015,
  B080 and B082 fill them and add their regression cases, with no dependency on those tasks here.
pitfalls:
- The provider framework must remain below core so adapters do not call back into the orchestration layer.
- A route table match is metadata, not proof the server installed that route.
- Do not reintroduce two independent logging/error pipelines when moving existing handlers into core.
- The 680-line budget covers dispatch, tests and server wiring but not the seventeen stubs, their tests and their registry lines.
- >-
  A stub execute is not an async fn, since an async fn without an await fails clippy::unused_async; it returns
  std::future::ready(Err(...)) so its owner can make it async later without touching the dispatch.rs arm.
review_level: standard
budget:
  max_changed_lines: 2150
  max_new_expects: 0
