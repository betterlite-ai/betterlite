    why: Iterator hookup, the unused message converter and the error class.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/a2a/chat/streaming_iterator.py#L12-L108
    why: Chunk parsing, the error object, the empty-chunk fallback and the finish reasons.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/a2a/common_utils.py#L18-L63
    why: A2AError and convert_messages_to_prompt.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/a2a/common_utils.py#L148-L163
    why: The Entra hop predicate and resolve_a2a_hop_auth_header.
  - url: https://a2a-protocol.org/latest/specification/
    why: JSON-RPC methods message/send and message/stream and the message and task shapes.
dod:
  - text: Registry resolution fills api_base, api_key and headers only for the missing values, merges the other agent params and sets the fake-stream pair when the card has no streaming.
    proof: [a2a-chat-tests, oracle]
  - text: The Entra agent path takes its key from the Entra token and drops its stored authorization header.
    proof: [a2a-chat-tests]
  - text: The request body is a message/send or message/stream JSON-RPC call with the joined conversation and the blocking flag only for non-streaming.
    proof: [a2a-chat-tests, oracle]
  - text: Replies map to one stop choice, a JSON-RPC error becomes A2AError with the reply status, and a bad body becomes the parse error.
    proof: [a2a-chat-tests, oracle]
  - text: Stream chunks carry text, finish on completed, failed or done, raise on an error object and fall back to an empty chunk.
    proof: [a2a-chat-tests, oracle]
  - text: The module adds no copy of B2210's text extraction.
    proof: [a2a-no-text-copy]
checks:
  optional: []
  commands:
    - id: a2a-chat-tests
      why: the a2a_chat behavior tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^a2a_chat::/)'
    - id: a2a-no-text-copy
      why: the module must call B2210's extractor and the module must exist
      run: test -s crates/betterlite-provider/src/a2a_chat.rs && ! grep -rq 'fn extract_text_from_a2a' crates/betterlite-provider/src/a2a_chat.rs crates/betterlite-provider/src/a2a_chat
oracle_cases:
  - tools/oracle/cases/helpers/a2a-chat/registry-early-return.yaml
  - tools/oracle/cases/helpers/a2a-chat/registry-fills-missing.yaml
  - tools/oracle/cases/helpers/a2a-chat/registry-card-no-streaming.yaml
  - tools/oracle/cases/helpers/a2a-chat/request-send-blocking.yaml
  - tools/oracle/cases/helpers/a2a-chat/request-stream.yaml
  - tools/oracle/cases/helpers/a2a-chat/request-empty-messages.yaml
  - tools/oracle/cases/helpers/a2a-chat/response-error-key.yaml
  - tools/oracle/cases/helpers/a2a-chat/stream-chunk-finish.yaml
deviations:
  - what: Usage is estimated with betterlite's tokenizer (B196) for gpt-3.5-turbo, so counts match LiteLLM only where B196 matches tiktoken.
    why: LiteLLM calls its own token_counter, which is B196's job; the counts are whatever that task produces.
out_of_scope:
  - "llms/a2a/common_utils.py extract_text_from_a2a_message and extract_text_from_a2a_response (L66-L145) belong to B2210."
  - "llms/a2a/chat/transformation.py _openai_message_to_a2a_message (L400-L417): no caller at the pin."
  - "llms/a2a/chat/guardrail_translation/** belongs to B6163."
  - "main.py _complete_a2a and the a2a arm of the dispatch belong to B050."
  - "The agent registry itself (global_agent_registry.get_agent_by_name) belongs to B4776; this task owns only the A2aAgentLookup trait and takes an injected lookup. The adapter that implements it over AgentRegistry is server composition root wiring."
pitfalls:
  - The early return needs api_base AND api_key both not None AND headers truthy; an empty headers map still triggers the lookup.
  - A JSON-RPC "error" key raises with the HTTP status of the reply, which is usually 200, not 500; only the stream iterator uses 500.
  - transform_request reads stream from optional_params (not litellm_params), and the blocking flag is absent when streaming.
  - Messages whose text is empty are skipped by convert_messages_to_prompt, so a request of only empty messages sends an empty prompt, not an error.
  - The fake_stream pair is set only when optional_params stream is truthy and the card capabilities object exists and has a falsy streaming value; a card without capabilities keeps stream.
  - "Entra agents lose the stored authorization header in any letter case (Authorization, authorization)."
  - A chunk whose text extraction throws returns an empty unfinished chunk, never an error.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
