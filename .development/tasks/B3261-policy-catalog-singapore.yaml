checks:
  optional: []
  commands:
    - id: catalog-local-pdpa
      why: the policy_templates_backup.json file is missing, has invalid JSON, or the pdpa-singapore record is corrupted, missing required fields, or literal values are wrong
      run: |
        python3 << 'CATALOG_CHECK_PDPA'
        import json
        with open('litellm/policy_templates_backup.json', 'r') as f:
            templates = json.load(f)

        pdpa_record = None
        for t in templates:
            if t.get('id') == 'pdpa-singapore':
                pdpa_record = t
                break

        assert pdpa_record is not None, 'pdpa-singapore record not found in backup'

        required_fields = ['id', 'title', 'description', 'icon', 'iconColor',
                          'iconBg', 'guardrails', 'complexity', 'guardrailDefinitions', 'templateData',
                          'tags', 'estimated_latency_ms']
        for field in required_fields:
            assert field in pdpa_record, f'missing field: {field}'

        assert isinstance(pdpa_record['guardrails'], list) and len(pdpa_record['guardrails']) == 9, 'guardrails count wrong'
        assert isinstance(pdpa_record['guardrailDefinitions'], list) and len(pdpa_record['guardrailDefinitions']) == 9, 'guardrailDefinitions count wrong'
        assert isinstance(pdpa_record['tags'], list) and len(pdpa_record['tags']) == 3, 'tags count wrong'

        assert pdpa_record['id'] == 'pdpa-singapore', 'id value corrupted'
        assert pdpa_record['title'] == 'Singapore PDPA — Personal Data Protection', 'title value corrupted'
        assert 'Personal Data Protection Act' in pdpa_record['description'], 'description value corrupted'
        assert pdpa_record['tags'] == ['PII Protection', 'Regulatory', 'Singapore'], 'tags values corrupted'
        assert pdpa_record['icon'] == 'ShieldCheckIcon', 'icon value corrupted'
        assert pdpa_record['iconColor'] == 'text-red-500', 'iconColor value corrupted'
        assert pdpa_record['iconBg'] == 'bg-red-50', 'iconBg value corrupted'
        assert pdpa_record['complexity'] == 'High', 'complexity value corrupted'
        assert pdpa_record['estimated_latency_ms'] == 1, 'estimated_latency_ms not 1'

        guardrail_names = [g['guardrail_name'] for g in pdpa_record['guardrailDefinitions']]
        expected_names = ['sg-pdpa-pii-identifiers', 'sg-pdpa-contact-information', 'sg-pdpa-financial-data',
                         'sg-pdpa-business-identifiers', 'sg-pdpa-personal-identifiers', 'sg-pdpa-sensitive-data',
                         'sg-pdpa-do-not-call', 'sg-pdpa-data-transfer', 'sg-pdpa-profiling-automated-decisions']
        assert guardrail_names == expected_names, 'guardrail names corrupted or reordered'

        for guardrail in pdpa_record['guardrailDefinitions']:
            assert 'guardrail_name' in guardrail, 'guardrail missing name'
            assert 'litellm_params' in guardrail, 'guardrail missing litellm_params'
            params = guardrail['litellm_params']
            assert 'guardrail' in params, f'{guardrail["guardrail_name"]} missing guardrail type'
            assert 'mode' in params, f'{guardrail["guardrail_name"]} missing mode'
            assert 'patterns' in params or 'categories' in params, f'{guardrail["guardrail_name"]} missing patterns or categories'

        print('Singapore PDPA record valid and complete')
        CATALOG_CHECK_PDPA
    - id: catalog-local-mas
      why: the litellm/policy_templates_backup.json file is missing, has invalid JSON, or the mas-ai-risk-management record is corrupted, missing required fields, or literal values are wrong
      run: |
        python3 << 'CATALOG_CHECK_MAS'
        import json
        with open('litellm/policy_templates_backup.json', 'r') as f:
            templates = json.load(f)

        mas_record = None
        for t in templates:
            if t.get('id') == 'mas-ai-risk-management':
                mas_record = t
                break

        assert mas_record is not None, 'mas-ai-risk-management record not found in backup catalog'

        required_fields = ['id', 'title', 'description', 'icon', 'iconColor',
                          'iconBg', 'guardrails', 'complexity', 'guardrailDefinitions', 'templateData',
                          'tags', 'estimated_latency_ms']
        for field in required_fields:
            assert field in mas_record, f'missing field: {field}'

        assert isinstance(mas_record['guardrails'], list) and len(mas_record['guardrails']) == 5, 'guardrails count wrong'
        assert isinstance(mas_record['guardrailDefinitions'], list) and len(mas_record['guardrailDefinitions']) == 5, 'guardrailDefinitions count wrong'
        assert isinstance(mas_record['tags'], list) and len(mas_record['tags']) == 3, 'tags count wrong'

        assert mas_record['id'] == 'mas-ai-risk-management', 'id value corrupted'
        assert mas_record['title'] == 'Singapore MAS — AI Risk Management for Financial Institutions', 'title value corrupted'
        assert 'Monetary Authority of Singapore' in mas_record['description'], 'description value corrupted'
        assert mas_record['tags'] == ['Financial Services', 'Regulatory', 'Singapore'], 'tags values corrupted'
        assert mas_record['icon'] == 'ShieldCheckIcon', 'icon value corrupted'
        assert mas_record['iconColor'] == 'text-blue-600', 'iconColor value corrupted'
        assert mas_record['iconBg'] == 'bg-blue-50', 'iconBg value corrupted'
        assert mas_record['complexity'] == 'High', 'complexity value corrupted'
        assert mas_record['estimated_latency_ms'] == 1, 'estimated_latency_ms not 1'

        guardrail_names = [g['guardrail_name'] for g in mas_record['guardrailDefinitions']]
        expected_names = ['sg-mas-fairness-bias', 'sg-mas-transparency-explainability', 'sg-mas-human-oversight',
                         'sg-mas-data-governance', 'sg-mas-model-security']
        assert guardrail_names == expected_names, 'guardrail names corrupted or reordered'

        for guardrail in mas_record['guardrailDefinitions']:
            assert 'guardrail_name' in guardrail, 'guardrail missing name'
            assert 'litellm_params' in guardrail, 'guardrail missing litellm_params'
            params = guardrail['litellm_params']
            assert 'guardrail' in params, f'{guardrail["guardrail_name"]} missing guardrail type'
            assert 'mode' in params, f'{guardrail["guardrail_name"]} missing mode'
            assert 'categories' in params, f'{guardrail["guardrail_name"]} missing categories'

        print('Local MAS financial AI risk management record valid and complete')
        CATALOG_CHECK_MAS
oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or uses these catalog files. The loading function _load_policy_templates_from_local_backup is covered by B3252 which depends on this task. The route that uses both catalogs (get_policy_templates) is covered by B3253.
  - Guardrail implementations or pattern definitions referenced by these templates. The records only define policy patterns, categories, and metadata.
  - Other policy templates in the backup or published files. Those are owned by other catalog tasks.
  - Published mas-ai-risk-management record (policy_templates.json lines 2248-2378) is owned by B3260.
pitfalls:
  - The backup file must be valid JSON. Any syntax errors prevent loading; _load_policy_templates_from_local_backup returns an empty list on file-not-found but not on malformed JSON.
  - The pdpa-singapore record must contain exactly 9 guardrailDefinitions in the correct order at backup lines 2458-2688; do not reorder or omit guardrail definitions.
  - The mas-ai-risk-management record must contain exactly 5 guardrailDefinitions in the correct order at backup lines 2689-2819; do not reorder or omit guardrail definitions.
  - >-
    Each guardrailDefinitions entry must include the complete litellm_params block. For PDPA: patterns entries with pattern_type, pattern_name, action and pattern_redaction_format. For MAS: categories entries with category, category_file, enabled, action, and severity_threshold.
  - Both records must include all category_file references unchanged (litellm/proxy/guardrails/content_filter_data/policy_templates/...). These are data references, not a request to implement filters.
  - Local and published MAS records are distinct. The local version in the backup may differ from the published version; both are valid catalog entries in their respective files.
review_level: standard
