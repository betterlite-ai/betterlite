id: B3261
title: Local Singapore privacy catalog record
description: >-
  Retain the local Singapore PDPA privacy protection record in the backup catalog.
  This is pure policy catalog data with no implementation; its description references guardrail definitions that are owned by policy engine tasks, not this data task.
  Own the local pdpa-singapore record (backup lines 2458-2688) with all nine guardrailDefinitions (sg-pdpa-pii-identifiers, sg-pdpa-contact-information, sg-pdpa-financial-data, sg-pdpa-business-identifiers, sg-pdpa-personal-identifiers, sg-pdpa-sensitive-data, sg-pdpa-do-not-call, sg-pdpa-data-transfer, sg-pdpa-profiling-automated-decisions).
  Write it to `crates/betterlite-policy/assets/templates/local/pdpa-singapore.json`, a fragment file holding exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  The PDPA record covers 5 obligation areas: personal identifier collection (section 13 Consent), sensitive data profiling (Advisory Guidelines), Do Not Call Registry violations (Part IX), overseas data transfers (section 26), and automated profiling without human oversight (Model AI Governance Framework).
  Includes regex-based PII detection for NRIC/FIN, Singapore phone numbers, postal codes, passports, UEN, and bank account numbers.
  Preserve the exact field order and values from the pinned LiteLLM commit. The record includes complete litellm_params with pattern/category definitions and pattern_redaction_format or category_file references.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/local/pdpa-singapore.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L2458-L2688
    why: The complete local pdpa-singapore record in the backup file with 9 guardrailDefinitions including prebuilt patterns and category definitions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624
    why: The _load_policy_templates_from_local_backup function that loads the backup catalog file.
dod:
  - text: The local pdpa-singapore fragment holds the complete record with id "pdpa-singapore", title "Singapore PDPA — Personal Data Protection", and all 9 guardrail definitions.
    proof: [catalog-local-pdpa]
  - text: The fragment is valid JSON and holds exactly one object.
    proof: [catalog-local-pdpa]
  - text: >-
      The local PDPA record's keys are, in this order, id, title, description, icon, iconColor, iconBg, guardrails array,
      complexity, guardrailDefinitions array with 9 entries, templateData,
      tags, and estimated_latency_ms, with correct literal values.
    proof: [catalog-local-pdpa]
  - text: >-
      The local PDPA record has all 9 guardrail definitions present with correct names
      (sg-pdpa-pii-identifiers, sg-pdpa-contact-information, sg-pdpa-financial-data,
      sg-pdpa-business-identifiers, sg-pdpa-personal-identifiers, sg-pdpa-sensitive-data,
      sg-pdpa-do-not-call, sg-pdpa-data-transfer, sg-pdpa-profiling-automated-decisions).
    proof: [catalog-local-pdpa]
  - text: >-
      Literal field values are verified: PDPA title "Singapore PDPA — Personal Data Protection",
      tags ["PII Protection", "Regulatory", "Singapore"], estimated_latency_ms value 1,
      and all pattern_redaction_format and category_file references are preserved exactly from the pinned commit.
    proof: [catalog-local-pdpa]
checks:
  optional: []
  commands:
    - id: catalog-local-pdpa
      why: the local pdpa-singapore fragment is missing, is not one valid JSON object, or its keys, key order, guardrail definitions or literal values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["sg-pdpa-pii-identifiers", "sg-pdpa-contact-information", "sg-pdpa-financial-data", "sg-pdpa-business-identifiers", "sg-pdpa-personal-identifiers", "sg-pdpa-sensitive-data", "sg-pdpa-do-not-call", "sg-pdpa-data-transfer", "sg-pdpa-profiling-automated-decisions"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "pdpa-singapore"
          and .title == "Singapore PDPA " + ([8212] | implode) + " Personal Data Protection"
          and (.description | contains("Personal Data Protection Act"))
          and .icon == "ShieldCheckIcon"
          and .iconColor == "text-red-500"
          and .iconBg == "bg-red-50"
          and .guardrails == $names
          and .complexity == "High"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[].litellm_params; .guardrail == "litellm_content_filter" and .mode == "pre_call")
          and [.guardrailDefinitions[0:4][].litellm_params.pattern_redaction_format] == ["[{pattern_name}_REDACTED]", "[{pattern_name}_REDACTED]", "[{pattern_name}_REDACTED]", "[UEN_REDACTED]"]
          and all(.guardrailDefinitions[0:4][]; .litellm_params.patterns | length > 0)
          and all(.guardrailDefinitions[4:][]; (.guardrail_name | gsub("-"; "_")) as $category | [.litellm_params.categories[] | [.category, .category_file]] == [[$category, "litellm/proxy/guardrails/content_filter_data/policy_templates/\($category).yaml"]])
          and .tags == ["PII Protection", "Regulatory", "Singapore"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/local/pdpa-singapore.json
oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or uses these catalog files. The loading function _load_policy_templates_from_local_backup is covered by B3252 which depends on this task. The route that uses both catalogs (get_policy_templates) is covered by B3253.
  - Guardrail implementations or pattern definitions referenced by these templates. The records only define policy patterns, categories, and metadata.
  - Other policy templates in the backup or published files. Those are owned by other catalog tasks.
  - Published mas-ai-risk-management record (policy_templates.json lines 2248-2378) is owned by B3260.
  - Local mas-ai-risk-management record (litellm/policy_templates_backup.json lines 2689-2819) is owned by B3265.
pitfalls:
  - The fragment must be valid JSON holding one object. LiteLLM's _load_policy_templates_from_local_backup returns an empty list on file-not-found but not on malformed JSON.
  - The pdpa-singapore record must contain exactly 9 guardrailDefinitions in the correct order; do not reorder or omit guardrail definitions.
  - >-
    Each guardrailDefinitions entry must include the complete litellm_params block: patterns entries with pattern_type, pattern_name, action and pattern_redaction_format, or categories entries with category, category_file, enabled, action, and severity_threshold.
  - The record must include all category_file references unchanged (litellm/proxy/guardrails/content_filter_data/policy_templates/...). These are data references, not a request to implement filters.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
