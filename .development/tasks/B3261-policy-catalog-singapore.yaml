id: B3261
title: Local Singapore privacy and local financial AI catalog records
description: >-
  Retain the local Singapore PDPA privacy protection record and the local MAS financial AI risk management record in the backup catalog.
  These are pure policy catalog data with no implementation; their descriptions reference guardrail definitions that are owned by policy engine tasks, not this data task.
  Own the local pdpa-singapore record (backup lines 2458-2688) with all nine guardrailDefinitions (sg-pdpa-pii-identifiers, sg-pdpa-contact-information, sg-pdpa-financial-data, sg-pdpa-business-identifiers, sg-pdpa-personal-identifiers, sg-pdpa-sensitive-data, sg-pdpa-do-not-call, sg-pdpa-data-transfer, sg-pdpa-profiling-automated-decisions).
  Own the local mas-ai-risk-management record (backup lines 2689-2819) with all five guardrailDefinitions (sg-mas-fairness-bias, sg-mas-transparency-explainability, sg-mas-human-oversight, sg-mas-data-governance, sg-mas-model-security).
  The PDPA record covers 5 obligation areas: personal identifier collection (section 13 Consent), sensitive data profiling (Advisory Guidelines), Do Not Call Registry violations (Part IX), overseas data transfers (section 26), and automated profiling without human oversight (Model AI Governance Framework).
  Includes regex-based PII detection for NRIC/FIN, Singapore phone numbers, postal codes, passports, UEN, and bank account numbers. The MAS record covers fairness and bias in financial decisions, transparency and explainability, human oversight for consequential actions, data governance, and model security against adversarial attacks.
  Preserve the exact field order and values from the pinned LiteLLM commit. Both records include complete litellm_params with pattern/category definitions and pattern_redaction_format or category_file references.
scope:
  paths:
    - litellm/policy_templates_backup.json
  lint_tables: false
references:
