dod:
  - text: 'Named scheduler tests: scheduled_due_key, null_schedule_due, rotation_not_due, equality_is_due,
      auto_rotate_required, no_redis_runs, lock_denied_skips, acquired_lock_released, empty_cycle_releases,
      query_failure_releases, cleanup_before_select, cleanup_failure_continues, revoke_equality_retained,
      key_failure_continues, new_token_schedule, missing_interval_skips_write, untyped_response_skips_hook,
      internal_jobs_principal, grace_empty_to_none, missing_database_warns, setup_failure_warns,
      disabled_job_absent and shutdown_drains_rotation.'
    proof:
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: rotation_log_redaction covers a named key, unnamed token and missing token without exposing token bytes.
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_rotation::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/key_rotation::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/key_rotation::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^key_rotation::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/key-rotation-*")"
        && grep -rlq "LITELLM_KEY_ROTATION_LOCK_TTL_SECONDS" crates/betterlite-config/fuzz/corpus/config_yaml/key-rotation-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
