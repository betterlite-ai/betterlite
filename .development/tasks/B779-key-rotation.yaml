id: B779
title: Schedule automatic key rotation and expired overlap cleanup
description: >-
  Implement KeyRotationManager and register its server-owned scheduler after key regeneration routes exist.
  The job cleans expired deprecated keys, selects due keys, calls the common authorized regeneration service
  as the internal jobs principal, and continues after a per-key failure. Preserve Redis lock failure as
  a skipped cycle and ensure shutdown drains the job.

  Reuse B070's PodLockManager from the spend writer. Only a manager with Redis attempts a lock; otherwise
  every worker runs the cycle without a distributed lock. The cron lock id is litellm_key_rotation_job,
  distinct from scheduler id key_rotation_job. Clamp the lock TTL to at least 300 seconds, pass the
  manager's default reentrant behavior, warn and return on false/None acquisition, and release only an
  acquired lock in finally, including an empty result and failed query. Lock implementation and its Redis
  error logging belong to B070; do not copy them into the scheduler.

  Delete deprecated rows with revoke_at strictly before UTC now through B726 before selecting keys.
  A missing table or other cleanup error is debug-logged and swallowed. Select auto_rotate=true and
  key_rotation_at null or at/before now through B722; null schedules rotate immediately, without a
  rotation_interval filter. Query/process failures log and end the cycle; a single rotation failure
  logs and proceeds to the next key. Preserve success/failure ordering while keeping tokens out of logs.

  RegenerateKeyRequest takes token or empty string, the original alias, and grace_period or None when
  the env string is empty. B2314's internal-jobs principal sets api_key/key_alias=litellm_internal_jobs,
  team_id/team_alias/user_id=system and role PROXY_ADMIN. Call B895's regeneration service with
  litellm_changed_by=litellm_internal_jobs. Only a GenerateKeyResponse with token_id and a nonempty
  rotation_interval gets the second write: on the NEW token set rotation_count=(old count or 0)+1,
  last_rotation_at=now and key_rotation_at from B1224's interval calculator. A typed response always
  invokes B784's rotation hook after that write; a different response type invokes neither. A failed
  bookkeeping write can leave a successfully regenerated key without its new schedule and skips this hook.


  Build the production key_rotation module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/key_rotation_manager.py:
  KeyRotationManager.__init__ (L44-L46; 3 source lines), KeyRotationManager.process_rotations (L48-L111;
  48 source lines), KeyRotationManager._find_keys_needing_rotation (L113-L133; 18 source lines), KeyRotationManager._cleanup_expired_deprecated_keys
  (L135-L147; 13 source lines), KeyRotationManager._rotate_key
  (L163-L208; 35 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): LITELLM_KEY_ROTATION_LOCK_TTL_SECONDS=600;
  LITELLM_KEY_ROTATION_GRACE_PERIOD=''.


  LITELLM_KEY_ROTATION_ENABLED="false"; LITELLM_KEY_ROTATION_CHECK_INTERVAL_SECONDS=86400; LITELLM_KEY_ROTATION_LOCK_TTL_SECONDS=600
  with max(value,300). The scheduler registration is proxy_server.py:11072-11108; B779 owns its native
  equivalent. B129's str_to_bool trims and ignores case, accepts true/false, and returns None for other
  strings; only true enables scheduling. Missing DB warns and registers nothing; setup exceptions warn
  and allow startup to continue. Both integer env vars use int() at import, so empty or noninteger text
  prevents startup even when rotation is disabled. Grace-period parsing belongs to B895/B1224.


  scheduled_due_key is a Rust Postgres integration test that calls the production scheduler and the real
  B895 regeneration service. There is no helper-oracle operation: _rotate_key invokes a handler that reads
  proxy globals. The regeneration wire contract is covered by B895's HTTP corpus; this task checks job
  scheduling, warnings and database effects with injected clock/Redis failures and real Postgres rows.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::key_rotation::tests::rotation_env_defaults, rotation_true_only,
  invalid_interval_stops_startup, invalid_lock_ttl_stops_startup, lock_ttl_floor and grace_empty_to_none.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 117 nonblank, noncomment manager lines after removing the uncalled predicate, plus the 29-line
  scheduler block. Allow 160 production, 270 behavior/Postgres tests, 45 scheduler wiring and 70 config
  lines, 545 changed lines within a 600-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  rotation_log_redaction proves diagnostics retain a key name or a safe identifier without copying
  the token prefix used by LiteLLM when key_name is absent.
