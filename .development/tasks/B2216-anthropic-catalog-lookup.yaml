pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_catalog_lookup in the context group. Replace the stub Op in tools/oracle/src/helpers/context/anthropic_catalog_lookup.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_catalog_lookup.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
