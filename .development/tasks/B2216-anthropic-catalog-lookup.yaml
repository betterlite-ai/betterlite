id: B2216
title: Anthropic raw catalog capability lookup
description: >-
  Provide deterministic candidate and raw boolean lookup below Anthropic and Bedrock capability callers. Read the
  injected runtime and packaged catalogs; provider-aware resolution stays B688.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  _strip_bedrock_id_suffixes L213-L222; _strip_version_suffix L569-L574; _model_map_lookup_candidates L576-L614;
  _get_model_capability L616-L631; _get_exact_model_capability L633-L641; supports_fast_mode L643-L648.


  Named case contracts: candidate_order: Start with the original model, every matching prefix removed in order bedrock/converse/,
  bedrock/invoke/, bedrock/, vertex_ai/, then a truthy B2203 base and bedrock/base. A base-resolution exception
  adds neither. For each primary append, in order, trailing -vN(:revision) removal, trailing :revision removal,
  trailing -YYYYMMDD removal, every digit.digit changed to digit-digit, the composite dotted/version/date normalization,
  and removal from the last @ only when its index exceeds zero. Deduplicate preserving first occurrence; preserve
  case. catalog_precedence: Search all candidates in the runtime catalog before any candidate in the B193 packaged
  backup. The first actual boolean, including False, wins; strings, numbers and None do not. Any exception in candidate
  generation or an entry aborts the entire search and returns None, without warning. exact_capability: Exact lookup
  reads only the runtime key with no normalization or packaged fallback and accepts only bool. Malformed entry exceptions
  propagate here, unlike the broad lookup. fast_host_only: supports_fast_mode requires provider exactly anthropic
  and exact-key supports_fast_mode is True; aliases, Bedrock, Vertex, boolean-like values and packaged-only flags
  do not enable it.


  Implement crates/betterlite-context/src/anthropic_catalog_lookup.rs with adjacent tests under anthropic_catalog_lookup/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_catalog_lookup_cases in betterlite-context with these exact named cases (one per
  oracle file): candidate_order, catalog_precedence, exact_capability, fast_host_only. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_catalog_lookup* using HelperCase: kind:
  helper and the externally tagged anthropic_catalog_lookup variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_catalog_lookup that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 83 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 145 production lines, 170 behavior/config-test lines, 90 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 440 planned, 450 maximum changed lines.
