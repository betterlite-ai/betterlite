dod:
  - text: DotpromptManager.__init__ accepts optional prompt_directory, prompt_data (string or dict), and prompt_id; prompt_directory defaults to global setting when not provided.
    proof: [dotprompt-compilation-init-tests]
  - text: "JSON string prompt_data is decoded via serde_json::from_str; invalid JSON propagates as a serde_json::Error without wrapping."
    proof: [dotprompt-compilation-init-tests]
  - text: integration_name property returns the string "dotprompt".
    proof: [dotprompt-compilation-init-tests]
  - text: prompt_manager property lazy-loads PromptManager on first access, raising ValueError with exact message if neither prompt_directory nor prompt_data is set.
    proof: [dotprompt-compilation-init-tests]
  - text: should_run_prompt_management returns true if prompt_id is Some and PromptManager.get_prompt succeeds, returns false if prompt_id is None or if any exception occurs during lookup.
    proof: [dotprompt-compilation-eligibility-tests]
  - text: "_compile_prompt_helper raises ValueError with exact message 'prompt_id is required for dotprompt manager' when prompt_id is None."
    proof: [dotprompt-compilation-compile-tests]
  - text: _compile_prompt_helper retrieves the template with optional version, renders it with variables, converts to messages, extracts model and params, returns PromptManagementClient with completed_messages as None.
    proof: [dotprompt-compilation-compile-tests]
  - text: "Template-not-found, render and convert errors in _compile_prompt_helper are wrapped with exact message: \"Error compiling prompt '{prompt_id}': {e}\"."
    proof: [dotprompt-compilation-compile-tests]
  - text: "async_compile_prompt_helper delegates to _compile_prompt_helper, raising ValueError if prompt_id is None with exact message: 'prompt_id is required for dotprompt manager'."
    proof: [dotprompt-compilation-compile-tests]
  - text: "_convert_to_messages detects only capitalized System:, User: and Assistant: prefixes at line start, collects content until the next role, returns list of {role, content} messages."
    proof: [dotprompt-compilation-messages-tests]
  - text: If no role prefixes are found, the entire content is treated as a user message.
    proof: [dotprompt-compilation-messages-tests]
  - text: Empty messages or empty-content lines at the end are not added to the result.
    proof: [dotprompt-compilation-messages-tests]
  - text: "_extract_optional_params returns a copy of the template's optional_params field, or an empty dict if optional_params is None."
    proof: [dotprompt-compilation-params-tests]
  - text: set_global_prompt_directory sets the global prompt directory in the config.
    proof: [dotprompt-compilation-init-tests]
  - text: prompt_initializer rejects prompt_directory parameter with exact error message 'Cannot set prompt_directory when working with prompt_initializer. Needs to be a specific dotprompt file'.
    proof: [dotprompt-compilation-init-tests]
  - text: prompt_initializer uses dotprompt_content from database (via B4051's parse helper) when present and prompt_data and prompt_file are both absent.
    proof: [dotprompt-compilation-init-tests]
  - text: prompt_initializer uses nested prompt_id from params if present, else strips version from prompt_spec.prompt_id, else uses prompt_spec.prompt_id directly.
    proof: [dotprompt-compilation-init-tests]
  - text: prompt_initializer_registry maps SupportedPromptIntegrations::DotPrompt to the prompt_initializer function.
    proof: [dotprompt-compilation-registry-tests]
  - text: Every mutant in the compilation, message conversion and initializer logic is caught by a test.
    proof: [mutants]
