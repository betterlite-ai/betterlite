oracle_cases: []
deviations:
  - what: Eligibility errors during should_run_prompt_management swallow exceptions and return false instead of propagating them.
    why: LiteLLM behavior at the pinned commit; a missing prompt that causes a lookup error is treated as ineligible for compilation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dotprompt/dotprompt_manager.py#L99-L103
  - what: Model stripping removes the "dotprompt/" prefix when template.model is None, leaving only the base model name.
    why: LiteLLM behavior at the pinned commit; the model projection uses integration_name to strip the prefix.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prompt_management_base.py#L135-L139
out_of_scope:
  - "DotpromptManager.set_prompt_directory: no caller at the pin"
  - "DotpromptManager.reload_prompts: no caller at the pin"
  - "DotpromptManager.add_prompt_from_json: no caller at the pin"
  - "DotpromptManager.load_prompts_from_json: no caller at the pin"
  - "DotpromptManager.get_prompts_as_json: no caller at the pin"
  - "DotpromptManager.convert_prompt_file_to_json: no caller at the pin; the converter at B117 calls PromptManager.prompt_file_to_json directly"
  - "get_chat_completion_prompt and async_get_chat_completion_prompt: these call the base class implementation from B4050 and are tested through the completion hook dispatch in B4058"
pitfalls:
  - "DotpromptManager.prompt_manager is lazy and must check for None after construction; accessing it without checking raises ValueError with the exact message from B4051."
  - "Role-prefix detection is case-sensitive; only capitalized System:, User: and Assistant: split messages, not \"system:\", \"user:\" or mixed case."
  - "Empty lines after role markers are preserved in the message content; a message that is only whitespace is still added if current_content is non-empty."
  - "PromptManagementClient.completed_messages is set to None by _compile_prompt_helper and is populated by the B4058 orchestration layer, not here."
  - "JSON string decoding in __init__ must use serde_json::from_str; invalid JSON propagates unwrapped as a serde_json::Error, matching LiteLLM's json.loads behavior with no try/except. Only _compile_prompt_helper wraps exceptions with the \"Error compiling prompt '{prompt_id}': {e}\" literal."
  - "The nested prompt_id from params takes precedence over the stripped registry ID; test that prompt_id=\"x.v1\" with prompt_spec.prompt_id=\"y.v2\" uses \"x.v1\" from params."
