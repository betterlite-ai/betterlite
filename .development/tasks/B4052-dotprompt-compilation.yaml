id: B4052
title: Dotprompt compilation and initialization
description: >-
  Build lazy dotprompt manager construction, prompt eligibility checking, rendering-to-message conversion and compiled metadata extraction.
  Add DotpromptManager to crates/betterlite-prompts, implementing the PromptManagementClient contract from B4050.
  DotpromptManager.__init__ accepts optional prompt_directory, prompt_data JSON string or dict, and prompt_id, with prompt_directory defaulting to the global setting from betterlite-config.
  should_run_prompt_management returns true if the prompt_id exists in the prompt manager, catching lookup errors and returning false on any exception.
  _compile_prompt_helper and async_compile_prompt_helper load the versioned template, render it with variables, convert rendered text to chat messages using role-prefix parsing (System:, User:, Assistant:), extract template model and optional parameters, and return a PromptManagementClient structure.
  _convert_to_messages splits rendered content by lines, detects capitalized role prefixes at line start, collects content until the next role marker, and converts to a message dict {role, content}.
  _extract_optional_params copies the template's optional_params dict.
  prompt_initializer takes PromptLiteLLMParams and PromptSpec, rejects prompt_directory parameter (must use global), parses dotprompt_content from database if present, and constructs DotpromptManager with the nested prompt_id taking precedence over the stripped registry base.
  Export prompt_initializer and register it in the SupportedPromptIntegrations registry.
  Preserve lazy PromptManager construction, capitalized role detection only, eligibility-swallows-lookup-errors behavior, JSON string prompt_data decoding, and model stripping when template has no model.
