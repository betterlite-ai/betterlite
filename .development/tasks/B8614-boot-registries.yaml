id: B8614
title: Pass-through state for Shared and the agent config boot behind NonLlmRegistries
description: >-
  LiteLLM's load_config fills four in-memory registries from config.yaml through _init_non_llm_configs (L7046): MCP
  tools, agents, MCP servers and the vector store registry. B8590 ported that step behind the trait `NonLlmRegistries`
  with four methods, and the server reads the same registries afterwards. So each registry is made once at startup,
  filled by config boot before the listener opens, and handed to Shared. MCP and vector stores are deferred until the
  core is done (Max, 11-19), so this task builds the pass-through state and the agent part, and answers the three MCP
  and vector store methods with an error that stops startup. B9997 builds the MCP registry and B9998 the vector store
  registries later, and each replaces its stub here.


  Server side, in crates/betterlite-server/src/server_registries.rs (declared by the skeleton). `PassThroughState`
  holds the three values LiteLLM keeps at module level for pass-through routes: `credentials:
  Arc<RwLock<PassthroughEndpointRouter>>` (B3602's credential router in pass_through_credentials, behind a std RwLock
  because the set_default_vertex_config that load_config calls takes &mut self), `vertex_tokens: Arc<CredentialCache>`
  (B1302's Vertex token state, betterlite-vertex token_cache) and `routes: SharedPassThroughRoutes`, B3616's handle in
  passthrough::route_registration (an Arc of a Mutex around the route state that holds B3614's RouteTable), which
  initialize_pass_through_endpoints writes. `PassThroughState::new(...)` (pub, the binary calls it) makes all three
  empty and takes as arguments what the merged constructors need: CredentialCache::new takes a clock and a credential
  executor, and the router is a struct literal with its provider resolver, credential snapshot and environment lookup.
  B8613's startup install, B8384's database load, B8520's writes and B8640's routes all use this one value. Nothing
  here can fail, so the module has no error enum. Add no MCP or vector store type: B9997 and B9998 add their own
  `server_registries::mcp` and `server_registries::vectors` modules beside this one.


  Binary side, in crates/betterlite/src/boot_registries.rs (declared by the skeleton), error enum `BootRegistryError`
  in boot_registries/error.rs. `BootRegistries` holds `agents: Arc<AgentRegistry>` (B4776, betterlite-auth
  agent_registry), built with `pub fn new(agents: Arc<AgentRegistry>) -> Self`, and implements B8590's
  NonLlmRegistries:

  `agents` loads the config agent list into the AgentRegistry with B4776's load_agents_from_config, as LiteLLM does
  before the server starts. Its error maps into B8590's `ConfigBootError::Step { step: "agents", source }` unchanged.

  `mcp_tools`, `mcp_servers` and `vector_stores` load nothing. Each returns `ConfigBootError::Step` whose step is the
  config key as the file spells it ("mcp_tools", "mcp_servers", "vector_store_registry") and whose source is
  `BootRegistryError::NotBuilt { key }`, displayed as "{key} is set in the config, but its support is not built yet".
  This is how main's catalog stubs answer an integration that is not built (betterlite-logging
  registry/catalog/arize.rs returns CatalogError::Unavailable), so a configured MCP server or vector store stops
  startup with a message that names it. load_non_llm_configs calls each method only when its key is configured
  (is_configured), so an absent, null or empty key never reaches the stub and still boots.


  Tests: server_registries tests (in server_registries/tests.rs, names start with `pass_`) assert PassThroughState::new
  starts with no credentials, no Vertex tokens and an empty route table, and that a route written through one clone of
  `routes` is seen through another. boot_registries tests (in boot_registries/tests.rs) drive B8590's
  load_non_llm_configs with a BootRegistries over a real AgentRegistry: tests named `boot_agents_` load a config with
  two agents and assert both land in the registry, and that a bad agent entry returns its loader's error; tests named
  `boot_unbuilt_` (one per key: `boot_unbuilt_mcp_tools`, `boot_unbuilt_mcp_servers`,
  `boot_unbuilt_vector_store_registry`) set one key and assert startup fails with that key in the step and the
  message, and `boot_unbuilt_keys_left_empty` sets all three keys to empty values ([] or {}) and asserts it boots. B9997 and B9998 delete the
  `boot_unbuilt_` tests of their keys when they replace the stubs. No oracle case: a booted gateway with one of these
  keys fails before the listener opens, and the routes that read the registries are mounted by later parts.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/server_registries.rs
    - crates/betterlite-server/src/server_registries/**
    - crates/betterlite/Cargo.toml
    - crates/betterlite/src/boot_registries.rs
    - crates/betterlite/src/boot_registries/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7046-L7090
    why: _init_non_llm_configs, the four registries config boot fills; this task loads only the agents block.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2584-L2661
    why: The module globals the registries replace; each is one value per process.
dod:
  - text: PassThroughState holds one credential router, one Vertex token state and one route table handle, all empty at start and shared by every clone.
    proof: [registries-tests]
  - text: BootRegistries loads config agents into the AgentRegistry and returns the loader's error.
    proof: [boot-tests]
  - text: A config that sets mcp_tools, mcp_servers or vector_store_registry fails startup with an error naming that key, and the same keys left empty still boot.
    proof: [unbuilt-tests]
checks:
  optional: []
  commands:
    - id: registries-tests
      why: the pass-through values are not empty at start or a clone holds a different route table
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server_registries::tests::pass_/)'
    - id: boot-tests
      why: config agents are not loaded at boot, are loaded into a copy, or the loader's error is swallowed
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::tests::boot_agents_/)'
    - id: unbuilt-tests
      why: a configured MCP or vector store key is skipped instead of stopping startup, or the error does not name the key
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::tests::boot_unbuilt_/)'
oracle_cases: []
deviations:
  - what: A config that sets mcp_tools, mcp_servers or vector_store_registry stops startup with "{key} is set in the config, but its support is not built yet"; LiteLLM loads them.
    why: MCP and vector stores are deferred until the core is done (Max, 11-19). Skipping the key would drop configured MCP servers, their tools and the guardrails that name them without a trace. B9997 and B9998 remove the error for their keys.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7046-L7090
out_of_scope:
  - "Making the values at startup and passing BootRegistries to load_non_llm_configs: B8613. The Shared fields: B8610."
  - "McpRegistry, its constructor ports and the mcp_tools and mcp_servers loading: B9997. VectorStores and the vector_store_registry loading: B9998."
  - "The agent registry and its config loader: B4776. The periodic database object reload: B8384."
pitfalls:
  - An explicit null agents key skips both agents and agent_list in B8590; BootRegistries only loads what B8590 hands it and decides nothing about the keys.
  - The three unbuilt methods must return the error, never log and return Ok, since a skipped mcp_servers key drops the configured servers and the guardrails that name them.
  - The step and the message name vector_store_registry, the key the operator wrote, not the method name vector_stores.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
