dod:
- text: >-
    `quota_estimation_shapes` sends flat `{type:"response.create",input:"abcd",instructions:"efgh",max_output_tokens:7}`
    and nested `{type:"response.create",response:{input:"abcd",instructions:"efgh",max_output_tokens:7}}`; each
    returns input estimate `2` and output estimate `7`. It sends `{type:"response.create",input:"abcde"}` and gets
    `1`/`1024`, `{type:"response.create",input:[{content:"ab"},{text:"cd"}]}` and gets input `1`,
    `{type:"response.create",input:"",instructions:"",max_output_tokens:null}` and gets `0`/`1024`,
    `{type:"response.create",input:"abcd",max_output_tokens:"7"}` and gets output `1024`, and
    `{type:"response.create",input:"abcd",max_output_tokens:true}` and gets output `true`. It also sends
    `{type:"response.create",response:{},input:[{content:"abcd",id:"encitem_1"}],max_output_tokens:7}`: quota
    extraction falls back to top-level `input`/`max_output_tokens` and returns `1`/`7`, while ID restoration restores
    the top-level `encitem_1` input ID and model
    authorization treats the empty `response` dict as the nested container, inserting only `response.model:"gpt-4o"`
    when no top-level model exists.
  proof: [case-quota-estimation-shapes, oracle]
- text: >-
    `quota_frame_selection` sends `not-json`, `[1,2,3]`, `{type:"response.completed"}` and `{type:"ping"}` to two
    callbacks and records no calls; an empty callback list also records no calls. For
    `{type:"response.create",input:"abcd",max_output_tokens:7}`, both callbacks
    receive the same `user_api_key_dict`, model `gpt-4o`, input `1` and output `7` in list order; callback one raising
    an exception prevents callback two from running and propagates that exception.
  proof: [case-quota-frame-selection, oracle]
- text: >-
    `ws_event_error_and_event_sets` returns `event.error` for `{type:"error",error:{code:"E"}}`, returns null for
    `{type:"error"}`, returns `response.error` for `{type:"response.completed",response:{error:{code:"E"}}}`, and returns null for
    `{type:"response.completed"}`, `{type:"response.completed",response:[]}` and `{type:"other"}`. The helper
    exposes logged types exactly `response.created`, `response.completed`, `response.failed`, `response.incomplete`,
    `error`; failure types exactly `error`, `response.failed`; output-item types exactly
    `response.output_item.added`, `response.output_item.done`; and maskable blocks exactly `input_text`, `output_text`, `text`.
  proof: [case-ws-event-error-and-event-sets, oracle]
- text: >-
    `restore_wrapped_ids` deep-copies `{type:"response.create",input:[{id:"encitem_1",encrypted_content:"litellm_enc:x"}],
    previous_response_id:"wrapped",response:{input:[],previous_response_id:"original"}}`, sends the input list and
    previous ID through B904/B903, changes only restored `input` and `previous_response_id` fields, and leaves an object
    containing already-original values byte-equivalent in content. A nested empty `response:{}` remains a real nested
    container for the model/default policy rather than being flattened into the top level.
  proof: [case-restore-wrapped-ids, oracle]
- text: >-
    `affinity_output_item_wrap` with `encrypted_content_affinity_enabled:true`, `model_info.id:"deploy-7"` and
    `item.encrypted_content:"cipher"` returns `litellm_enc:bW9kZWxfaWQ6ZGVwbG95LTc=;cipher`; an empty string model ID
    returns `litellm_enc:bW9kZWxfaWQ6;cipher`. Added, done and arbitrary event objects take the same pure helper path.
    Missing/null `model_info`, non-string model IDs, missing/non-object items, missing/empty/non-string encrypted content,
    and affinity false/null return no replacement.
  proof: [case-affinity-output-item-wrap, oracle]
- text: >-
    `model_authorization_and_defaults` with authorized model `gpt-4o` changes flat `model:"client"` and nested
    `response.model:"client"` to `gpt-4o`, inserts a top-level model when `response` is absent, and leaves the frame
    unchanged for authorized model `null` or `""`. With `fill_missing:{temperature:0.2}`, request
    `temperature:0.5` and overrides `{temperature:0.9}`, the result is `temperature:0.9` and keeps
    `type:"response.create"`; with no defaults the same object is returned. For `response:{}`, authorization writes
    nested `response.model` and does not classify the container as absent.
  proof: [case-model-authorization-and-defaults, oracle]
- text: >-
    `request_masking_without_callbacks` returns `not-json`, `{type:"ping"}` and an unchanged response.create string
    byte-for-byte when no default/model/ID change is needed. With authorized `gpt-4o`, fill-missing
    `{temperature:0.2}` and wrapped input/previous-response IDs, it serializes the changed frame with model `gpt-4o`,
    temperature `0.2` and restored IDs even with no guardrail callback; defaults are merged before authorization and
    restoration.
  proof: [case-request-masking-without-callbacks, oracle]
- text: >-
    `request_guardrail_masking` invokes every callback in list order with `output_parse_pii:true` for flat and nested
    string `input`/`instructions`, string item `content`/`output`, and block `text` only when block type is exactly
    `input_text`, `output_text` or `text`; each returned value is the next callback's input. An image block, unknown
    block type, non-string field and missing field are unchanged. The first callback creates `request_data.metadata:{}`
    when absent, and a callback returning the same string still causes JSON serialization.
  proof: [case-request-guardrail-masking, oracle]
- text: >-
    `response_event_unmasking` receives an explicitly injected `unmask_pii_text` function, not a callback attribute.
    It returns invalid `not-json`, missing/non-object metadata, non-string/empty `pii_tokens`, no callbacks, non-string
    text, unknown events and the six done events `response.output_text.done`, `response.content_part.done`,
    `response.output_item.done`, `response.function_call_arguments.done`, `response.reasoning_summary_text.done` and
    `response.reasoning_summary_part.done` unchanged. With `pii_tokens:{"<EMAIL_ADDRESS_1>":"a@example.com"}`, only
    the first unmask function runs: completed `response.output[*].content[*].text` and the four delta events
    `response.output_text.delta`, `response.reasoning_summary_text.delta`, `response.refusal.delta` and
    `response.function_call_arguments.delta` replace tokens only when the returned text differs.
  proof: [case-response-event-unmasking, oracle]
- text: >-
    `completed_output_masking` returns `not-json`, non-`response.completed` events, missing/non-object response and
    completed events with no output text unchanged. For each output item and each output callback it calls
    `check_pii` with `output_parse_pii:false` first for string `arguments`, then `summary[*].text`, then
    `content[*].text`; only changed return values replace fields and trigger serialization, while equal return values
    leave the original response string unchanged.
  proof: [case-completed-output-masking, oracle]
- text: >-
    `non_object_masking_frames` sends `[1,2,3]` to each of `_mask_response_create`, `_unmask_response_event` with
    metadata `pii_tokens:{"<EMAIL_ADDRESS_1>":"a@example.com"}`, and `_mask_response_completed` with an output
    callback. Each masking method produces the explicit non-object policy error corresponding to LiteLLM's uncaught
    `.get("type")` AttributeError; B943 terminates forwarding/connection instead of forwarding `[1,2,3]`, and Rust
    does not panic.
  proof: [case-non-object-masking-frames, oracle]
- text: >-
    `quota_rejection` makes a callback raise `RateLimitError("quota exceeded")`; the client-send effect receives
    exactly `{"type":"error","error":{"type":"rate_limit_exceeded","message":"quota exceeded"}}`, the
    result is `false`, and the rejected frame is not forwarded. A send exception is swallowed and still returns false;
    a non-RateLimitError propagates; accepted and non-response.create frames return true.
  proof: [case-quota-rejection, oracle]
- text: >-
    The twelve named helper fixtures use `call: {responses_ws_frame_policy: ...}` and compare independently scripted
    Rust and pinned-MIT values plus ordered callback/send effects; no fixture compares a service with itself, and the
    response-event case proves the separate typed unmask function is wired.
  proof: [new-oracle-cases, helper-python, helper-corpus, oracle]
