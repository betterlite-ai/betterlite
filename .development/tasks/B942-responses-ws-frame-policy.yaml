deviations:
- link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L2148-L2159
  what: >-
    LiteLLM lets a JSON array reach `.get("type")` and leak `AttributeError` from the three masking methods;
    betterlite returns a typed non-object policy error that B943 translates into forwarding/connection termination.
  why: >-
    Rust must not panic on a valid JSON array, while the native relay still needs the same caller-visible termination
