id: B942
title: Responses ws frame policy
description: >-
  Implement per-frame Responses WebSocket model authorization, quota gates and guardrail mask/unmask transformations
  using B052/B071/B104 and typed Responses records. Restore wrapped item/container IDs before dispatch and preserve
  request defaults; a session handshake never authorizes a later model switch.


  Implement crates/betterlite-core/src/api/responses_ws_frame_policy.rs. Use ResponsesWsFramePolicyInput and ResponsesWsFramePolicyResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions later_frame_model_switch, project_quota_frame, guardrail_blocked_frame,
  restore_container_id, mask_completed_output under api::responses_ws_frame_policy::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesWsFramePolicy in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_ws_frame_policy: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/streaming_iterator.py: _extract_frame_quota_estimate_inputs (L1752-L1784);
  litellm/responses/streaming_iterator.py: _enforce_frame_project_quota (L1787-L1814); litellm/responses/streaming_iterator.py:
  _ws_event_error (L1832-L1836); litellm/responses/streaming_iterator.py: _restore_input_item_ids (L1839-L1840);
  litellm/responses/streaming_iterator.py: _restored_container_fields (L1843-L1854); litellm/responses/streaming_iterator.py:
  _restore_wrapped_ids_in_response_create (L1857-L1866); litellm/responses/streaming_iterator.py: _wrap_output_item_encrypted_content
  (L1869-L1884); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._enforce_authorized_model
  (L2101-L2126); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._with_request_defaults (L2128-L2134);
  litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._mask_response_create (L2136-L2238); litellm/responses/streaming_iterator.py:
  ResponsesWebSocketStreaming._unmask_response_event (L2265-L2328); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._mask_response_completed
  (L2330-L2408); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._enforce_or_reject_frame (L2410-L2437).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 332 owned nonblank/non-comment/non-docstring Python lines (388 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 352 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 602 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B071 (Budgets, budget resets and reservations), B104 (Guardrail framework, registry and
  guardrail API), B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B904 (Response id
  traversal), B1087 (Api boundaries), B732 (Typed authentication principals and grant resolution), B925 (Responses
  stream events), B903 (Response id codecs). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
