checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_frame_policy::/)
      - test(/::replays_corpus$/)'
  - id: case-later-frame-model-switch
    why: the later-frame-model-switch behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_frame_policy::tests::later_frame_model_switch($|::)/)'
  - id: case-project-quota-frame
    why: the project-quota-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_frame_policy::tests::project_quota_frame($|::)/)'
  - id: case-guardrail-blocked-frame
    why: the guardrail-blocked-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_frame_policy::tests::guardrail_blocked_frame($|::)/)'
  - id: case-restore-container-id
    why: the restore-container-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_frame_policy::tests::restore_container_id($|::)/)'
  - id: case-mask-completed-output
    why: the mask-completed-output behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_frame_policy::tests::mask_completed_output($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_ws_frame_policy.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_ws_frame_policy-*)"
      && grep -qE "^[[:space:]]+responses_ws_frame_policy:" tools/oracle/fuzz/corpus/helper_case/responses_ws_frame_policy-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-ws-frame-policy)"
