id: B942
title: Responses ws frame policy
description: >-
  Implement the pure policy that prepares and filters decoded native Responses WebSocket frames. It receives typed
  quota callbacks, an authenticated key record, a Presidio callback, a separate B104-supplied
  `unmask_pii_text(text, pii_tokens) -> text` function, response-ID/encrypted-content codecs, request defaults,
  the authorized model, request metadata and the client send effect. The unmask function is passed explicitly beside
  the B902 `PresidioGuardrailCallback`; it is not discovered from that callback by attribute lookup. The policy has
  no ambient state and does not own the B943 native relay or B944 managed relay.

  Preserve these pinned values and order. `_FRAME_NO_MAX_OUTPUT_TOKENS_FLOOR` is `1024` and
  `_FRAME_CHARS_PER_TOKEN_ESTIMATE` is `4`; a non-empty text total uses `max(1, total_chars // 4)`, while no text is
  `0`. A `response.create` frame uses a non-empty dict at `response` as its estimate container, but `response: {}`
  falls back to top-level fields excluding only `type`; the estimator's work stack starts with `input` then
  `instructions`, pops from the end, and appends object `content` then `text`. An `int` max_output_tokens is explicit
  (including JSON `true`, because Python `bool` is an `int`); every other value uses `1024`.

  `_enforce_frame_project_quota` ignores invalid JSON, top-level arrays, and every object whose `type` is not exactly
  `response.create`. For a valid response.create it invokes every quota callback sequentially with the unchanged
  `user_api_key_dict`, the authorized model, and the extracted input/output estimates. `_enforce_or_reject_frame`
  catches only B163 `RateLimitError`: it attempts one JSON text frame with `type="error"`,
  `error.type="rate_limit_exceeded"` and `error.message=str(error)`, swallows any send exception, returns `false`
  and drops the rejected frame. A non-RateLimitError propagates; accepted frames return `true`.

  Keep the exact event and text rules. Logged event types are `response.created`, `response.completed`,
  `response.failed`, `response.incomplete`, `error`; failure types are `error` and `response.failed`; output-item
  types are `response.output_item.added` and `response.output_item.done`; maskable block types are `input_text`,
  `output_text` and `text`; delta unmasking types are `response.output_text.delta`,
  `response.reasoning_summary_text.delta`, `response.refusal.delta` and `response.function_call_arguments.delta`;
  the six suppressed done types are `response.output_text.done`, `response.content_part.done`,
  `response.output_item.done`, `response.function_call_arguments.done`, `response.reasoning_summary_text.done` and
  `response.reasoning_summary_part.done`. Request masking calls every
  Presidio callback with `output_parse_pii=true` and masks flat/nested `input` and string `instructions`, item
  `content`/`output`, and only the three maskable block types. Output masking calls every output callback with
  `output_parse_pii=false` in arguments, summary-text, content-text order. Response-event unmasking calls only the
  first guardrail callback's explicitly supplied unmask function, walks completed output content, and replaces only
  the four delta `delta` strings.

  Implement `crates/betterlite-core/src/api/responses_ws_frame_policy.rs`, adjacent tests under
  `api::responses_ws_frame_policy::tests`, the B171 independent helper adapter and its parity fixtures. This slice
  transforms decoded records, adds no byte decoder or fuzz target, registers no HTTP route, reads no environment
  variable/config key/query parameter, performs no database write, emits no warning-and-drop diagnostic, and makes no
  provider call. No HTTP status/type/param/code case belongs here; route and connection status behavior remains with
  B941/B943/B944.

  Keep these complete owned source items together: `_FRAME_NO_MAX_OUTPUT_TOKENS_FLOOR` and
  `_FRAME_CHARS_PER_TOKEN_ESTIMATE` (L1741-L1749); `_extract_frame_quota_estimate_inputs` (L1752-L1784);
  `_enforce_frame_project_quota` (L1787-L1814); `RESPONSES_WS_LOGGED_EVENT_TYPES`,
  `RESPONSES_WS_MASKABLE_TEXT_BLOCK_TYPES`, `_RESPONSES_WS_FAILURE_EVENT_TYPES` and
  `_RESPONSES_WS_OUTPUT_ITEM_EVENT_TYPES` (L1817-L1829); `_ws_event_error` (L1832-L1836);
  `_restore_input_item_ids` (L1839-L1840); `_restored_container_fields` (L1843-L1854);
  `_restore_wrapped_ids_in_response_create` (L1857-L1866); `_wrap_output_item_encrypted_content` (L1869-L1884);
  `ResponsesWebSocketStreaming._enforce_authorized_model` (L2101-L2126), `_with_request_defaults` (L2128-L2134),
  `_mask_response_create` (L2136-L2238), `_DELTA_EVENT_TYPES` (L2240-L2248), `_OUTPUT_DONE_EVENT_TYPES`
  (L2250-L2263), `_unmask_response_event` (L2265-L2328), `_mask_response_completed` (L2330-L2408), and
  `_enforce_or_reject_frame` (L2410-L2437).

  Direct inputs are B071's project-quota callback, B104's Presidio implementation and separate unmask function,
  B163's `RateLimitError`, B171's helper protocol, B902's WebSocket/default types and Presidio callback shape,
  B903's response-ID and encrypted-item wrapper codecs, B904's encrypted input-item traversal, B925's JSON/type
  helpers and quota protocol, and B732's authenticated key record. B925 owns the source `_UnmasksPiiText` protocol
  and `_UNMASK_PII_TEXT_ATTR` declaration, but B942's Rust/native seam is the typed function passed beside the
  callback; it must not use `getattr` or invent a callback method absent from B902. Do not create a second JSON-shape
  helper or codec.

  The owned source is about 330 nonblank, non-comment, non-docstring Python lines. The implementation, focused
  behavior tests, twelve helper fixtures, adapters and wiring must fit the 800 changed-line budget.
