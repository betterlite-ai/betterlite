id: B3763
title: Compresr query projection and compression transport
description: >-
  Build Compresr's query-aware message selection, trusted API endpoint validation, and HTTP compression transport with safe failure handling. The compression request is query-aware: tool outputs are compressed against the intent of the tool call that produced them (resolved via tool_call_id), falling back to the last user message for everything else.
  Validate the api_base parameter to reject non-http(s) schemes and cloud-metadata hosts/IPs (including alternate encodings like integer IPv4, IPv4-mapped IPv6), accepting private ranges for on-prem. This is defense-in-depth, not SSRF-complete: the shared httpx client follows redirects and may re-resolve DNS.
  Compress single or batch contexts through POST to /api/compress/question-specific/ or /api/compress/question-specific/batch, sending the message content as context and the selected query; passthrough extra compression_params forwarded to the API verbatim, but never let them override context/query/inputs.
  Validate response cardinality: batch responses must return one result dict per input, aligned by position, or fail_open/fail_closed applies. When fail_open is configured, log and forward the request uncompressed; when fail_closed (the default), raise 502 with a generic error message. Keep upstream response bodies and API keys out of client-visible errors, writing full details only to server logs.
  IP and URL validation retain LiteLLM's accepted private-network deployments and its documented DNS/redirect limitations. A malformed-but-200 response must not raise when fail_open applies; defensively parse token-stat fields so error handling after a successful HTTP response does not surface as a 500.
