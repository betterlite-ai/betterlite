deviations:
  - what: betterlite parses and validates IP literals the same way LiteLLM does but names the restrictions clearly in tests rather than relying on socket layer behavior.
    why: The socket layer's implicit handling of decimal/hex/mapped IPv6 addresses is implicit; explicit tests guard against misunderstandings.
out_of_scope:
  - "Content text utilities (is_all_text_parts, merge_rewritten_text_parts, content_to_text): B3663 owns these functions. _replace_text_in_content calls them but does not reimplement them."
  - "Recovery store, retrieval planning, and tool injection: B3764 owns the recovery store; B3765 owns tool injection and message writeback."
  - "Initialization of the guardrail, configuration loading, and registration in the callback pipeline: B3765 owns initialization."
  - "The apply_guardrail body and lifecycle hook registration: B107 owns those higher-level orchestration points."
pitfalls:
  - 'The oracle helper for this task is pre-registered as compresr_transport in the guardrails group. Replace the stub Op in tools/oracle/src/helpers/guardrails/compresr_transport.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/compresr_transport.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - "Cloud-metadata IP checking must handle alternate formats. `ipaddress.ip_address(int(host, 0))` parses both decimal (e.g. \"2130706433\") and hex (e.g. \"0x7f000001\") single-integer IPv4. IPv4-mapped IPv6 addresses map to their IPv4 equivalent before the block check."
  - "Tool call intent selection walks backwards from the target message to find a matching assistant turn. Legacy function_call (non-tool_calls) is a fallback that requires name match to avoid false attribution. Both are checked together in _query_for_target."
  - "Query-aware compression joins tool name and arguments on colon; malformed argument data is stringified rather than rejecting the query."
  - "Batch cardinality checking is strict: the response must have exactly one result dict per input, in the same position. \"results\": null or results with mismatched length both trigger fail_open/fail_closed."
  - "_safe_response_text bounds the returned body to 500 chars and truncates undecodable Content-Encoding before it escapes a log line. A limit exists because malformed-but-200 responses must not raise when fail_open applies."
  - "Compressed text is written back unchanged into string content. For all-text part lists, is_all_text_parts guards against multipart content; merge_rewritten_text_parts collapses parts but preserves the cache_control breakpoint from the last part."
  - "The fail_open/fail_closed decision happens at the HTTP-failure point; a 200 response with unexpected shape is still handled by the fail policy, not by a separate \"bad shape\" path."
review_level: standard
budget:
  max_changed_lines: 500
  max_new_expects: 0
