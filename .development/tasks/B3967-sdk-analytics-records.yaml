    proof: [analytics-tests]
  - text: Lunary parse_tool_calls filters on function or custom variant and preserves type, id and function name/arguments.
    proof: [analytics-tests]
  - text: Lunary parse_messages flattens single-item lists, recurses on nested message dict, includes tool_calls in serialized output.
    proof: [analytics-tests]
  - text: LunaryLogger.__init__ enforces minimum version >= 0.1.43 and raises ImportError for outdated versions.
    proof: [analytics-tests]
  - text: Lunary log_event sends paired start/terminal track_event calls with parsed messages, usage, error and metadata.
    proof: [analytics-tests]
  - text: Lunary extra parameter stringification skips the tools key, preserving it as a list or dict while stringifying other non-primitive types; a named case exercises a tools value that is a list of dicts.
    proof: [analytics-tests]
  - text: W&B resolver builds trace trees for edit, completion and chat completion response types.
    proof: [analytics-tests]
  - text: W&B trace tree spans use ISO millisecond timestamps calculated from response created time and elapsed seconds.
    proof: [analytics-tests]
  - text: W&B resolver swallows exceptions and returns None on unknown response object type.
    proof: [analytics-tests]

