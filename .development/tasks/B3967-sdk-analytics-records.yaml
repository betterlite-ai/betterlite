deviations:
  - what: Lunary and W&B SDK calls (lunary.track_event, wandb.init, trace_tree, run.log, run.finish) require a concrete Python SDK bridge or native execution contract before dispatch.
    why: These external SDK calls are live behavior in LiteLLM but need explicit transport/execution contracts to be implemented in betterlite.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/lunary.py#L154-L179

out_of_scope: []

pitfalls:
  - Lunary parse_messages returns a string for single-element lists, not a list; this is intentional flattening.
  - Lunary extra parameter cleanup pops extra_body, user and extra_headers (keeping only Template-Id); order matters for metadata precedence.
  - Lunary extra parameter stringification at line 134 explicitly excludes the "tools" key (`if not isinstance(value, (str, int, bool, float)) and param != "tools"`), so a tools value that is a list or dict stays unchanged while other non-primitive types are converted to strings.
  - W&B resolver builds prose request/choice strings with hardcoded markdown formatting; do not substitute plain text.
  - W&B span name concatenates response['model'] with fallback 'openai', response['object'] and response['created']; all three must be present.
  - W&B results use response['choices'], not parsed choice text; build Result from choice['text'] field directly.

