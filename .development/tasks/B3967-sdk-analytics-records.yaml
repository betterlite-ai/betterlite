id: B3967
title: Lunary events and Weights and Biases trace trees
description: >-
  Build Lunary's paired start/terminal events and Weights and Biases' request/response
  trace-tree projections. Lunary sends two track_event calls per request: one at request
  start and one at completion with output/usage/error. W&B builds trace trees from request
  and response objects, supporting three request types (edit, text completion, chat completion)
  with distinct request/choice formatting.

  For Lunary, parse messages to handle string input, single-element arrays (flattened),
  and message lists with tool_calls. Parse tool_calls with custom or standard function
  variants and filter on presence of either. Parse usage tokens to a {completion, prompt}
  dict with zero-fallback. Strip extra_body, user and extra_headers except Template-Id
  from optional_params. Convert non-serializable extra parameters to strings, except the
  tools parameter which stays as-is (preserving list/dict structure).

  For W&B, implement request/response resolver for three OpenAI-compatible response objects,
  building trace trees with ISO millisecond timestamps from response created time and
  elapsed duration. Format request as prose: edit sends instruction/input, completion
  sends prompt, chat completion formats messages by role. Build results from choice text
  fields. Preserve the three resolver branches and their distinct choice handling.

  Lunary version checking uses packaging.version.Version >= 0.1.43. W&B resolver swallows
  exceptions and logs warnings, returning None on unknown response object.

