dod:
  - text: API key and connection ID credentials are stored as SecretString and never logged, displayed or included in error messages or Debug output.
    proof: [behavior-tests]
  - text: send_batched defaults operation to "replace_hourly" when the caller does not pass one, and the value flows unchanged into the payload's operation field. "sum" is accepted as an alternate.
    proof: [behavior-tests]
  - text: CloudZeroStreamer initializes with API key, connection ID, and optional user timezone, defaulting to UTC when the timezone name is unrecognized.
    proof: [behavior-tests]
  - text: send_batched skips empty DataFrames (before grouping), groups by UTC date in YYYY-MM-DD format, and sends each batch with a 30-second request timeout.
    proof: [behavior-tests]
  - text: Timestamps parse as ISO 8601 (Z suffix, ±HH:MM offset, or no offset), apply user timezone when absent, and convert to UTC.
    proof: [behavior-tests]
  - text: Records with missing or empty time/usage_start are silently skipped with no warning.
    proof: [behavior-tests]
  - text: Records with malformed or unparseable timestamps are skipped with a warning showing the timestamp and error message.
    proof: [behavior-tests]
  - text: Numeric values convert to strings with .10f precision, trailing zeros and dots stripped, and no scientific notation.
    proof: [behavior-tests]
  - text: Records failing format conversion due to missing CBF fields are skipped with a warning, and the batch is still sent.
    proof: [behavior-tests]
  - text: If all records fail conversion to API format, a POST with an empty data list is still sent (batch_data is non-empty before conversion but data_records is empty after).
    proof: [behavior-tests]
  - text: Each daily batch sends exactly one POST to the AnyCost endpoint with Bearer auth, monthly payload structure and operation field, with failure propagation stopping the send.
    proof: [behavior-tests]
  - text: Unknown timezone names fall back to UTC without panicking, and parsing falls back to current UTC when a timestamp is empty or unparseable.
    proof: [behavior-tests]
