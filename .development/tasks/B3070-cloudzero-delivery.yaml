id: B3070
title: Send CloudZero daily billing drops
description: >-
  Implement CloudZero AnyCost delivery in `betterlite-logging::finops::cloudzero`, grouping billing records by UTC date and sending each batch in a single 30-second POST to CloudZero's API.
  CloudZeroStreamer takes injected credentials (api_key and connection_id stored as SecretString, never logged), an optional user timezone, and a clock.
  The streamer consumes CBF-shaped DataFrames where each row carries fields like time/usage_start, cost/cost, resource/id. It groups records by date extracted from time/usage_start (converted to UTC), batches them by YYYY-MM-DD, and sends each day's batch with operation parameter (defaults to "replace_hourly", also accepts "sum") flowing unchanged into the payload.
  When time/usage_start is missing or empty, skip that record silently with no warning. When a timestamp is malformed and cannot be parsed, skip the record with a warning showing the timestamp and error message.
  Timestamps without timezone info are treated as user_timezone before converting to UTC. Unknown timezone names fall back to UTC without panic.
  Each record is converted to API format by iterating fields, stripping None values, converting numeric values to string with ten-decimal precision and no scientific notation (`f"{value:.10f}".rstrip("0").rstrip(".")`), and ensuring time/usage_start is in UTC ISO 8601 format with Z suffix.
  If batch_data is empty before processing, skip sending without a POST. If all records fail conversion to API format, a POST with empty data list is still sent.
  Each daily batch sends one POST to https://api.cloudzero.com/v2/connections/billing/anycost/{connection_id}/billing_drops with Authorization Bearer header, 30-second timeout, and immediate error propagation.
