deviations:
  - what: Timezone fallback uses UTC without a warning, instead of logging via the Rich console like LiteLLM does.
    why: betterlite's logging infrastructure differs from LiteLLM's console output; warnings are delegated to the caller's logging setup or tracing infrastructure, not printed inline.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/cloudzero/cz_stream_api.py#L45-L47"
  - what: Invalid-timestamp and invalid-record warnings are returned as a count or logged separately, not printed to a console stream during iteration.
    why: betterlite uses injected logger/instrumentation (tracing) rather than side-channel console output, allowing callers to control logging without coupling delivery to Rich.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/cloudzero/cz_stream_api.py#L95-L97"
  - what: The clock is injected rather than calling `datetime.now()` inline.
    why: Injected clocks enable testing without time-dependent behavior and allow callers to control fallback timestamps.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/cloudzero/cz_stream_api.py#L245"
out_of_scope:
  - CBF record transformation (covered by B3069).
  - Daily usage row querying (covered by B3060).
  - CloudZero export scheduling and configuration (covered by B3071).
  - HTTP client pooling and configuration (covered by B173).
pitfalls:
  - The Python code applies the user_timezone only when a timestamp has no offset, not when it has one; timestamps with explicit offsets should never use user_timezone.
  - 'The decimal formatting line f"{value:.10f}".rstrip("0").rstrip(".") strips trailing zeros first, then trailing dots, so 1.0 becomes "1" and 1.1000000000 becomes "1.1"; an integer-like float cannot stay as "1.0".'
  - 'The payload month_str is YYYY-MM (from the batch_date''s first day), not the batch_date itself; converting batch_date like "2025-10-15" gives month "2025-10", not "2025-10-15".'
  - Invalid records in _convert_cbf_to_api_format return None and are filtered by the caller in _prepare_batch_payload, so the batch might send fewer records than grouped; skip the record, not the batch.
  - Empty DataFrames before grouping skip sending without a POST. All-rows-fail-conversion scenarios (batch_data is non-empty but data_records is empty after conversion) still send a POST with an empty data list.
  - The HTTP timeout is 30 seconds, not milliseconds; httpx timeout units are seconds.
  - 'Bearer auth formatting is exact: "Authorization: Bearer {api_key}" with a space between Bearer and the key. Never log the api_key itself.'
  - 'The endpoint URL is https://api.cloudzero.com/v2/connections/billing/anycost/{connection_id}/billing_drops, not a typo or variant.'
review_level: security
budget:
