deviations:
  - what: >-
      HTTPException(400) detail has error and detection_message fields.
      LiteLLM uses the same fields in its detail dict; betterlite's error message text is independent of LiteLLM's.
    why: Matches LiteLLM's wire format exactly at the field level; message text differs only in content, not structure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/tool_permission.py#L823-L829
  - what: >-
      Request body modifications happen in place on the data dict parameter, matching LiteLLM's behavior.
      This means the request passed to the model is the same object that was rewritten.
    why: In-place modification matches LiteLLM's pattern and reduces allocations.

out_of_scope:
  - >-
      CustomGuardrail.should_run_guardrail implementation; owned by the guardrail base contract (B104 or similar).
      log_guardrail_information decorator; owned by the custom guardrail integration.
      add_guardrail_to_applied_guardrails_header callback utility; owned by the callback infrastructure.
  - >-
      ToolPermissionGuardrail state and configuration (rules, default_action, on_disallowed_action); loaded and managed by B3810.
  - >-
      Request body parsing and wire types (ChatCompletionToolParam, Function); provided by the wire format crate.
      UserAPIKeyAuth, DualCache, CallTypesLiteral; provided by proxy infrastructure.

pitfalls:
  - >-
      The request path skips unnamed non-function tools. Only tools with a function subobject and name are checked.
      Legacy function definitions and forced choices are checked even if unnamed.
  - >-
      tool_choice and function_call set to string values like "auto", "none", or "required" are not treated as forced selections.
      Only string tool names or objects with a nested name field trigger forced-choice checks.
  - >-
      In rewrite mode, a tool that is removed from the tools array must also be removed from the functions array independently.
      They use different naming schemes (tool_name vs function_name) so both must be filtered separately.
  - >-
      A forbidden tool_choice that is an object (not a string name) must be matched against the nested function.name, not the object itself.
      The same applies to function_call objects.
  - >-
      Rewriting happens before the applied-guardrail header mutation. The header is added only after all data modifications.
      This ensures consistent ordering and prevents the header from being added and then removed.

