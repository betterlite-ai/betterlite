id: B3812
title: Block or rewrite forbidden request tools and forced choices
description: >-
  Enforce tool permissions on chat completions requests before calling the model.
  Extract tool names from OpenAI `tools`/`tool_choice` and legacy `functions`/`function_call` fields.
  Use the decision from B3811 to check each tool's permissions.
  In block mode, raise HTTP 400 with a guardrail violation message.
  In rewrite mode, remove forbidden tool definitions from `tools` and `functions`, and change a forbidden forced choice (`tool_choice` or `function_call` set to a specific tool name) to `"none"`.

  Implement the pre_call_hook that runs before the model is called.
  Check each extracted tool name, collecting those that are denied.
  Skip the guardrail entirely if no tools are present or if the event should not run.
  Return data unchanged when no tools are forbidden.
  Rewrite the request in place when forbidden tools exist and on_disallowed_action is rewrite.
  Raise HTTPException(400) when blocked.
  Report the denial reason in the violation message if the rule has one.

  Port eight functions from LiteLLM's tool_permission.py: _check_tool_permission, _get_request_tool_name, _get_legacy_function_name, _get_named_tool_choice, _get_named_function_call, _collect_request_tools, and async_pre_call_hook.
  The function _modify_request_with_permission_errors (38 characters) exceeds the 30-character name limit and must be renamed; use a shorter name like rewrite_forbidden_tools (23 chars) or apply_permission_errors (23 chars).
  Count: **114 lines** (253-305, 606-613, 615-616, 618-626, 628-634, 636-656, 658-704, 789-838).

