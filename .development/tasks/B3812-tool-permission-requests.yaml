dod:
  - text: >-
      Named tools are extracted from tools, functions, tool_choice and function_call fields.
      Unnamed non-function tools are skipped.
      No argument patterns are evaluated on the request path.
    proof: [request-tool-extraction-tests]
  - text: >-
      Each extracted tool name is checked against permissions using B3811's decision logic.
      Tools without a matching rule use the default_action.
    proof: [request-permission-check-tests]
  - text: >-
      In block mode, a forbidden tool raises HTTP 400 with detail containing error and detection_message fields naming the denied tool and its rule_id if available.
    proof: [request-block-mode-tests]
  - text: >-
      In rewrite mode, forbidden tools are removed from the tools array and functions array.
      A forbidden tool_choice or function_call set to a specific tool name is changed to "none".
    proof: [request-rewrite-mode-tests]
  - text: >-
      Guardrail runs only when should_run_guardrail returns true.
      Returns data unchanged when no tools are present or should_run_guardrail is false.
      Returns data unchanged when all tools are allowed.
    proof: [request-early-return-tests]
  - text: >-
      The applied-guardrail header is added after all request modifications are complete, before returning.
    proof: [request-header-mutation-tests]
  - text: >-
      A request with no forbidden tools passes through unchanged.
    proof: [request-allowed-tools-tests]
  - text: >-
      Multiple forbidden tools in a single request are all removed in rewrite mode.
    proof: [request-multiple-forbidden-tests]

checks:
  optional: []
  commands:
    - id: request-tool-extraction-tests
      why: Tool names are not extracted from tools, functions, tool_choice and function_call fields
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::extraction::/)'
    - id: request-permission-check-tests
      why: Extracted tool names are not checked against permissions from B3811
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::permission_check::/)'
    - id: request-block-mode-tests
      why: A forbidden tool in block mode does not raise HTTP 400 with the correct error format
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::block_mode::/)'
    - id: request-rewrite-mode-tests
      why: Forbidden tools are not properly removed or forbidden forced choices are not changed to none in rewrite mode
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::rewrite_mode::/)'
    - id: request-early-return-tests
      why: Guardrail does not return early when no tools present or should_run_guardrail is false
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::early_return::/)'
    - id: request-header-mutation-tests
      why: Applied-guardrail header is not added after modifications
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::header_mutation::/)'
    - id: request-allowed-tools-tests
      why: An allowed tool is modified or blocked when it should pass through unchanged
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::allowed_tools::/)'
    - id: request-multiple-forbidden-tests
      why: Multiple forbidden tools are not all removed in rewrite mode
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_requests::multiple_forbidden::/)'

