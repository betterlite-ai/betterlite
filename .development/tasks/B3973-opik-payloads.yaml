deviations:
  - what: Configuration resolution reads the environment and ~/.opik.config as injected arguments to handle testing.
    why: Prevents coupling tests to the real process environment, matching B002's pattern.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opik/utils.py#L57-L81
  - what: Metadata precedence follows auth-key defaults < request-level metadata < requester metadata (proxy headers).
    why: Allows operators to set defaults, requests to override, and proxies to enforce final values.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opik/opik_payload_builder/extractors.py#L38-L72
out_of_scope:
  - >-
    extract_span_identifiers's warning path is intentional preserve-as-is behavior: unexpected span data formats log but do not fail.
  - >-
    The native Opik SDK integration (opik_client.get_client_cached, trace, span methods) is owned separately; this task builds only pure payloads.
pitfalls:
  - >-
    UUIDv7's timestamp encoding in the first 48 bits must be big-endian and millisecond-accurate for Opik's ingestion validation.
  - >-
    Configuration environment variables use the OPIK_ prefix; OPIK_URL_OVERRIDE is the literal name for the URL override, not OPIK_API_URL.
  - >-
    Metadata source priority is auth-key < request < requester, not request < auth-key.
  - >-
    Proxy header tags are JSON-decoded and appended to existing tags, not replaced; a malformed JSON header value logs a warning and leaves tags unchanged.
  - >-
    Provider normalization maps: gemini → google_ai, vertex_ai-language-models → google_vertexai, vertex_ai-anthropic_models → anthropic_vertexai, bedrock_converse → bedrock; openai, anthropic, bedrock, groq pass through unchanged.
  - >-
    Extract tags appends custom_llm_provider (the raw provider name, not normalized) to the tags list from opik_metadata, ensuring all traces and spans carry provider identification.
  - >-
    Traces are identified by the absence of a "type" field; this is the only field that distinguishes them from spans in get_traces_and_spans_from_payload.
  - >-
    Null-removal (_remove_nulls) applies to both trace and span payloads after construction: None-valued fields are stripped before delivery, so {a, b=None, c} returns {a, c}.
  - >-
    Config file lookup is always ~/.opik.config (expanded with user home), reading only the [opik] section. Missing file returns empty dict, missing section returns empty dict.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
