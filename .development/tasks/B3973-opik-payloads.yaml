id: B3973
title: Opik settings metadata and trace payload construction
description: >-
  Build Opik configuration variable resolution, UUIDv7 generation, metadata precedence handling, and trace/span payload
  construction. These functions stay below the transport layer and form the basis for B3974's batch composition.

  Configuration variable resolution follows priority order: first user-supplied value, then OPIK_* environment variables
  (with OPIK_ prefix, e.g. OPIK_URL_OVERRIDE), then ~/.opik.config [opik] section, then default. The environment and
  config-file lookups take their inputs as caller-supplied arguments (mirroring B002's constructor-injected lookup), so
  tests pass a fake map and only the binary passes the real process environment.

  UUIDv7 generation encodes Unix time in milliseconds in the first 48 bits, with version 7 in the top 4 bits of byte 6
  and variant 0b10 in the top 2 bits of byte 8, following RFC 9562. This embedded timestamp must remain correct because
  Opik's ingestion validates it.

  Metadata merges from three increasing-priority sources: auth-key defaults, request-level litellm_metadata, then
  requester-level metadata from proxy headers. Proxy headers prefixed opik_project_name/opik_thread_id/opik_tags override
  their corresponding values; opik_tags is JSON-decoded and appended to the existing tags list. A malformed JSON tags
  value logs a warning and leaves the existing tags list unmodified, no exception raised.

  Traces are distinguished from spans by the absence of a "type" field in the payload. Trace payloads contain the full
  request/response record; spans attach to an existing trace via parent_span_id or create a new trace if current_span_data
  is absent. Both trace and span payloads apply null-removal after construction to strip any fields with None values, so
  a payload dict like {key1: value, key2: None, key3: value} becomes {key1: value, key3: value} in the output.

  Extract tags appends the raw custom_llm_provider value (e.g., openai, gemini, bedrock_converse) to the tags list drawn from
  opik_metadata, ensuring every trace/span includes provider identification as a tag.

