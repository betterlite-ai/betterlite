    why: Payload type definitions.
dod:
  - text: >-
      UUIDv7 generation encodes the Unix timestamp in milliseconds in the first 48 bits, sets version 7 and variant bits
      correctly, and produces RFC 9562-compliant strings that Opik's backend accepts.
    proof: [opik-uuid-tests]
  - text: >-
      Configuration variable resolution with injected environment and config-file lookups returns user value first, then
      OPIK_* environment (e.g., OPIK_URL_OVERRIDE), then ~/.opik.config [opik] section, then default, with a missing
      variable substituting None or the default.
    proof: [opik-config-tests]
  - text: >-
      Usage object creation omits completion_tokens, prompt_tokens and total_tokens when the corresponding field is None,
      proven by a case with partial usage data producing a dict without those keys.
    proof: [opik-config-tests]
  - text: >-
      Payload classification separates traces (no "type" field) from spans (with "type" field), and both filters produce
      empty lists appropriately when the payload contains none of that type. Null values are removed from trace and span
      dicts, so a payload entry {key1, key2=None, key3} loses the key2 field in the output.
    proof: [opik-config-tests]
  - text: >-
      Metadata extraction merges auth-key defaults, request metadata, then requester metadata in priority order, with
      opik_* proxy headers (opik_project_name, opik_thread_id, opik_tags as JSON) overriding their values.
    proof: [opik-metadata-tests]
  - text: >-
      Provider normalization maps gemini to google_ai, vertex_ai-language-models to google_vertexai,
      vertex_ai-anthropic_models to anthropic_vertexai, bedrock_converse to bedrock, and preserves openai, anthropic,
      bedrock, and groq as identity mappings; unknown providers pass through unchanged.
    proof: [opik-metadata-tests]
  - text: >-
      Extract span identifiers returns (trace_id, parent_span_id) for dict, object, and None inputs, and logs a warning
      while returning (None, None) when current_span_data is neither a dict nor an object with trace_id/id attributes.
    proof: [opik-metadata-tests]
  - text: >-
      Apply proxy header overrides reads opik_tags from the header, JSON-decodes the value, and appends parsed list items
      to the existing tags list; a malformed JSON value or non-list result logs a warning and leaves tags unchanged.
    proof: [opik-metadata-tests]
  - text: >-
      Extract tags appends the raw custom_llm_provider value (e.g., openai, gemini, bedrock_converse) to the tags list,
      ensuring provider identification is always present in both trace and span payloads.
    proof: [opik-metadata-tests]
  - text: >-
      Trace and span payload construction produces type-checked records with ISO 8601 UTC timestamps (Z-suffixed), correct
      provider normalization, and payloads linked by trace_id/parent_span_id.
    proof: [opik-payload-tests]
  - text: >-
      Opik payload orchestration decides whether to create a new trace (trace_id is None in current_span_data) or attach
      to an existing one, always creates a span, and returns (optional trace_payload, span_payload).
    proof: [opik-payload-tests]
checks:
  optional: [mutants]
  commands:
    - id: opik-uuid-tests
      why: UUIDv7 generation tests fail or do not test RFC 9562 compliance
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^opik_uuid_tests::/)
        - test(/replays_the_/)'
    - id: opik-config-tests
      why: Configuration and usage object tests fail or are missing
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^opik_config_tests::/)
        - test(/replays_the_/)'
    - id: opik-metadata-tests
      why: Metadata extraction and span identifier tests fail or are missing
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^opik_metadata_tests::/)
        - test(/replays_the_/)'
    - id: opik-payload-tests
      why: Trace and span payload construction tests fail or are missing
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^opik_payload_tests::/)
        - test(/replays_the_/)'
