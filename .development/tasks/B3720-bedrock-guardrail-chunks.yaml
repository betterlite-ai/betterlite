id: B3720
title: Bedrock guardrail records and chunk reconstruction
description: >-
  Build Bedrock ApplyGuardrail and InvokeGuardrailChecks request/response typed records
  (all of them) and the pure chunk packing, splitting and reconstruction operations.
  Preserve positional masking across arbitrarily nested fragments, unknown usage counters,
  extension response fields and the contextual-grounding exclusion from chunking.

  The records cover the full type hierarchy of BedrockRequest, BedrockGuardrailResponse,
  BedrockChecksViolation and their nested structures, including qualifier metadata
  that tags content items for contextual grounding. Implement static utilities for
  content chunking: conservative bin-packing at a configurable budget chars (default
  25,000 matching AWS's text-unit quota), recursive bisection fallback when AWS
  rejects an oversized batch, and whitespace-aware text splitting to avoid severing
  words.

  Merge per-chunk responses into a single response preserving per-item output alignment:
  each content item contributes one entry to the merged outputs list even when unmasked
  (falling back to original text), so later chunks' masked text stays in its original
  global position. Group fragment chunks back to their original content items
  (supporting arbitrary nesting depth from repeated bisection), sum usage counters
  field-by-field across chunks (taking keys from responses), and select the action
  value: GUARDRAIL_INTERVENED if present anywhere, otherwise the last action, or
  absent if none reported. Do not call AWS, construct guardrails, or invoke execution
  hooks; these are building blocks consumed by higher-level operations.

