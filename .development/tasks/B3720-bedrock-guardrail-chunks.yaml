dod:
  - text: >-
      All Bedrock request/response TypedDict structures and named tuples are built
      with their pinned field names, types, and optional markers, preserving unknown
      usage counters and extension fields in merged responses.
    proof: [bedrock-records-tests, oracle]
  - text: >-
      Bin-packing groups whole content items in order into batches staying within
      a configurable budget, and bisection splits content by list length or by
      whitespace-aware text splitting at the nearest safe boundary.
    proof: [bedrock-chunking-tests, oracle, bedrock-chunking-corpus]
  - text: >-
      Merged responses align every content item (masked or unmasked) to one entry
      in the output list at its original global position, sum usage counters
      field-by-field, group arbitrary-depth fragment chunks back to original items,
      and select actions with GUARDRAIL_INTERVENED taking precedence.
    proof: [bedrock-chunking-tests, oracle, bedrock-chunking-corpus]
  - text: >-
      Whitespace boundaries avoid word severance, fragment groups support repeated
      bisection to arbitrary nesting depth, and contextual grounding qualifiers
      are carried through splits.
    proof: [bedrock-chunking-tests, oracle, bedrock-chunking-corpus]

checks:
  optional: []
  commands:
    - id: bedrock-records-tests
      why: TypedDict or named tuple field names, types or optional markers do not match the source.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^bedrock_records::tests::/)
        - test(/replays_the_/)'
    - id: bedrock-chunking-tests
      why: Chunking, merging, or grouping logic mismatches AWS's ApplyGuardrail contract or the source fallbacks.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^bedrock_chunking::tests::/)
        - test(/replays_the_/)'
    - id: bedrock-chunking-corpus
      why: The task added no new chunking seed or production helper replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock-chunking-*")"
        && grep -rlq "bin_pack\|split\|merge" tools/oracle/fuzz/corpus/helper_case/bedrock-chunking-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/bedrock_chunking.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json

