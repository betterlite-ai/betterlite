  - "Guardrail construction, credential resolution, ApplyGuardrail target preparation and signed HTTP transport: owned by B3723 (BedrockGuardrail.__init__, _load_credentials, _prepare_request, _sign_and_post)."
  - "ApplyGuardrail whole-content probe, reactive splitting, throttle retry and consolidated logging: owned by B3724 (make_bedrock_api_request, _make_apply_guardrail_request, _apply_guardrail_content_with_chunking)."
  - "InvokeGuardrailChecks request shaping, score thresholds and response handling: owned by B3725 (_chunk_texts_into_checks_messages, _build_invoke_guardrail_checks_messages, _make_invoke_guardrail_checks_request)."
  - "Native pre/during/post hooks and buffered streaming: owned by B3726 (async_pre_call_hook, async_moderation_hook, async_post_call_streaming_iterator_hook)."
