pitfalls:
  - 'The oracle helper for this task is pre-registered as bedrock_chunking in the guardrails group. Replace the stub Op in tools/oracle/src/helpers/guardrails/bedrock_chunking.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_chunking.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Whitespace splitting falls back to the raw midpoint when no safe boundary exists, which leaves multi-word denied phrases that straddle the cut unguarded.
  - Output alignment requires that every content item contribute exactly one entry to the merged outputs list, even when unmasked, so later chunks' positions are preserved.
  - A single content item can be bisected multiple times; grouping assumes fragment_group_size counts, not fixed pairs, so repeated splitting into four fragments is grouped correctly.
  - Unknown usage counter keys are summed from responses as they appear, so a new AWS counter is automatically included without code changes.

