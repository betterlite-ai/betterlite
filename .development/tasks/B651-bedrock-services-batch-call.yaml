id: B651
title: Bedrock batch status and cancellation calls
description: >-
  Execute cancel, async-invoke status and model-invocation-job status operations. Return predicted result identifiers
  without any S3 list or read. Preserve the distinct generic-config and native-handler status mappings. This provider
  call does not spawn the B086 batch scheduler.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/batches/handler.py:
  BedrockBatchesHandler.cancel_batch L115-L182; BedrockBatchesHandler._handle_async_invoke_status L185-L259; BedrockBatchesHandler._handle_model_invocation_job_status
  L262-L406.


  Reuse BedrockBatchesConfig.__init__ from B649 (litellm/llms/bedrock/batches/transformation.py); its implementation
  remains with that prerequisite.


  Named case contracts: cancel_model_job: Resolve region truthy explicit aws_region_name, then B650 ARN extraction,
  then literal us-east-1. Construct AwsAuthParams from the ten explicitly named credential arguments and call B594
  resolve_credentials via B649 config; arbitrary kwargs are ignored. Construct boto3 bedrock client with resolved
  access/secret/token, region and B650 signature_version=v4. Call stop_model_invocation_job(jobIdentifier=batch_id),
  then fetch current model-job status; do not synthesize cancelled or poll to terminal completion. retrieve_async_status:
  Call B632 _get_async_invoke_status with unchanged ARN, explicit region,logging and kwargs via B693 embedding constructor.
  Status is passed through without normalization; only exact lowercase completed/failed affect counts (total1,completed/failed0or1).
  Preserve missing required key errors and final LiteLLMBatch validation for uppercase/unknown statuses. id invocationArn,created_at
  submitTime,in_progress_at lastModifiedTime,completed_at optional endTime regardless of status,failed_at endTime
  only lowercase failed. Metadata output_file_id from nested s3Uri,failure_message falsey->empty,model_arn modelArn.
  endpoint /v1/embeddings,input_file_id empty,completion_window24h; output_file_id is metadata only. Native Rust
  uses async calls instead of Python thread/event-loop machinery without changing these results. retrieve_model_job_status:
  Resolve region and credentials as cancel, with AwsAuthParams.model_validate(kwargs) ignoring unknown fields. Call
  get_model_invocation_job(jobIdentifier=batch_id) on bedrock control plane; accept a bare job id. Map Submitted/Validating/Scheduled
  to validating, InProgress in_progress, Stopping cancelling,Stopped cancelled,Completed/PartiallyCompleted completed,Failed
  failed,Expired expired; unknown/missing -> in_progress silently. Scheduled and unknown differ deliberately from
  B649/B650 generic-config mappings. cancel_idempotent_errors: On botocore ClientError only ValidationException
  or ConflictException triggers a status lookup. Return that result only for cancelling,cancelled,completed,failed,expired;
  any other status rethrows the original error. Other error codes rethrow without lookup. The same stop_model_invocation_job
  operation is used even for an async-invoke-looking ID; there is no separate async cancellation branch. completed_output_prediction:
  Use response.jobArn default batch_id, B650 final job-id extraction and prediction from input/output nested URIs.
  Never list/read S3, including foreign buckets or completed jobs. output_file_id is predicted URI only for completed
  status, otherwiseNone; failed prediction staysNone, never falls back to a prefix. Metadata model_arn,job_arn,job_name,failure_message,input_s3_uri,output_s3_uri,output_file_uri
  use empty string for missing/falsey values as source .get/or specify. handler_counts_and_timestamps: Use B650
  numeric/datetime _to_epoch and record-count helpers. created_at from submitTime or0,in_progress_at lastModifiedTime;
  endTime becomes completed_at/failed_at/cancelled_at/expired_at only for corresponding mapped status. endpoint
  /v1/chat/completions,completion_window24h,input_file_id input URI. Preserve all B650 counts/bool/malformed-time
  cases here. logging_and_sdk_failures: When logging exists, B249 pre_call input=batch_id,api_key empty,complete_input_dict
  jobIdentifier and API base using bare job id when available; post_call captures provider response. SDK errors
  propagate. Oracle replaces boto3 client at its constructor seam and captures service/method/credentials/arguments;
  production Rust uses native HTTP/SigV4 prerequisites with matched AWS operation paths. Missing Python boto3/botocore
  import errors are SDK packaging only, owned B159, not a Rust installation instruction.


  Direct constructor/helper prerequisites used by this slice: B590. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/batch_call.rs with adjacent tests under batch_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batch_call_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  cancel_model_job, retrieve_async_status, retrieve_model_job_status, cancel_idempotent_errors, completed_output_prediction,
  handler_counts_and_timestamps, logging_and_sdk_failures. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_call* using HelperCase:
  kind: helper and the externally tagged bedrock_services_batch_call variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_batch_call that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_batch_call_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_services_batch_call_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 224 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 285 production lines, 300 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 740 planned, 750 maximum changed lines.
