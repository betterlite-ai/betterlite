  - id: case-cancel-model-job
    why: The cancel-model-job behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_call_cases::case_[0-9]+_cancel_model_job$/)'
  - id: case-cancel-async-invoke
