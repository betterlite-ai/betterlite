out_of_scope:
- B030 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- No S3 result reads occur in handler.py L115-L406. B645/B646 own generic content request/reply behavior and B1030
  composes downloads. Python boto3 import failures are B159 packaging scope; no enterprise-managed batch hook is
  installed here.
- 'Function ownership inventory litellm/llms/bedrock/batches/handler.py: _sigv4_config L36-L39; _extract_region_from_bedrock_arn
  L42-L50; _extract_job_id_from_arn L53-L57; _predict_output_file_uri L60-L79; _record_counts_from_response L82-L92;
  _to_epoch L95-L102 belong to B650.'
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_batch_call in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_batch_call.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_batch_call.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The handler comment claims its status table mirrors creation, but Scheduled is validating here and in_progress
  in the generic config.
- Cancellation tolerates only two AWS error codes, and only after a terminal-or-cancelling status lookup confirms
  idempotence.
