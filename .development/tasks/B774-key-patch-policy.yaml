id: B774
title: Key patch construction and validation
description: >-
  Implement key-update authorization and normalize object permissions in the typed request. These four
  functions read policy and entity rows but never write database rows. B894 owns patch construction,
  metadata merge and soft-budget persistence; B1224 owns custom policy evaluation.


  Build the production key_patch_policy module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _with_validated_object_permission (L2914-L2936; 23 source lines), _validate_mcp_servers_for_key_update
  (L2939-L2976; 37 source lines), _acting_as_team_admin_for_key_update (L3026-L3061; 35 source lines),
  _validate_update_key_data (L3064-L3352; 214 source lines).

  object_permission_absent returns the same request; permission_normalization copies only when B818
  returns a normalized dictionary. effective_team_lookup reloads the existing team's row through
  B737 with check_db_only=true when no team object was passed. unchanged_team_grandfathers supplies
  existing_key_row.object_permission to MCP validation when data.team_id is None/equal, but
  changed_team_drops_grandfathering supplies None. Search/vector validators receive the original
  requested dictionary, not MCP's normalized result. Their call order is MCP, search, vector.

  team_admin_bypass_false covers proxy admins, personal keys, service-account keys and self-owned
  keys: _acting_as_team_admin_for_key_update returns false before lookup. other_member_team_admin
  reloads the stored key's team, calls B800 is_team_admin and then B1200's member_key_budgets
  permission/verdict functions; rejection is 403. B1200 owns general_settings.team_admin_editable_fields
  and its member_key_budgets opt-in/default semantics; enabled_member_budget and disabled_member_budget
  exercise the consumed setting rather than adding a second loader. A non-team-admin returns false.

  validation_sequence first requires a DB (B894 HTTP 500 detail.error 'Database not connected'),
  validates finite spend and duration (B861), allowed_routes/passthrough/permissions/global-guardrail
  delegation (B892/B861), and ownership changes (B892). project_reassignment gives 400 string
  detail for a different non-null project; project_detach is detected by fields_set, including null.
  Then resolve the acting-team-admin grant, call B771 common access with caller user_id only when
  acting as team admin, and B800's /key/update team-member permission. A failed earlier check
  must prevent every later lookup; assert the named call sequence, not merely the final denial.

  budget_change_gate activates for changed non-null max_budget, any non-null spend (even unchanged),
  and presence of budget_limits or soft_budget (even null/[]). throttle_new_enable is 403 for
  non-admins only when requested true and existing metadata value is not exactly true. Then B1219
  checks end-user budget changes using B739 get_key_end_user_budget_id and B894's request projection,
  followed by B745 output/batch estimate guards. creator_and_owner_bypass requires non-null caller
  ID equal to both created_by and user_id; creator_after_reassignment cannot bypass. team_grant_bypass
  applies only after membership authorization and only for non-budget/non-project changes.
  Otherwise B783 _check_key_admin_access runs with the stored hash and route literal '/key/update
  (max_budget/spend)' for budget changes, '/key/update' otherwise.

  effective_team uses data.team_id or existing team, reloads DB-only, returns 400 when a non-admin
  supplies a nonexistent team, and calls B772 throughput checks for a found team. B800 access-group
  assignment is checked next. project_limits use explicit data.project_id when present, existing
  otherwise, and run when a project remains and models/max_budget is non-null. Explicit detach
  skips project limits. changed_org_membership runs only for non-admins changing to a non-null org.
  org_throughput_trigger is any non-null organization_id,tpm_limit,rpm_limit,tpm_limit_type,rpm_limit_type;
  metadata-only model rates do not trigger it. B879 loads the effective org, absence gives 400,
  then B772 checks limits. team_move_no_router gives 400 detail.error; team_move_no_object gives
  500 detail.error; otherwise B1219 validates the move. Finally B818 normalizes permissions in-place.
  Preserve every helper's status/detail; route owners B775/B1220 supply their auth_error envelopes.

  Helpers receive injected read-only collaborators; no FastAPI handler is invoked by the oracle.
  Named cases assert unchanged rows and request mutation independently. Database integration tests
  use POSTGRES_TEST_URL with testcontainers fallback for fresh-policy reads, never skipped tests.


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the key_patch_policy operation under B856 Management::keys. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-patch-policy-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 309 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  309 production, 340 behavior/read-order tests, 65 helper adapters and 30 wiring lines,
  744 changed lines within a 775-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  This ownership has no premium_user branch; passing the flag to B771 does not create a local
  licensing deviation. The B771 no-paid-tier behavior is tested by that dependency.
