dod:
  - text: Settings read depth, max_loops and fingerprints from kwargs with the integer, validator and list rules above, and a non-numeric depth string is an error.
    proof: [settings-tests]
  - text: The safety check returns RepeatedFingerprint before MaxLoopsExceeded with the exact texts, and the fingerprint is the sorted-key JSON of the tool calls.
    proof: [safety-tests]
  - text: The loop skips callbacks that do not override the gate, logs a gate error and moves on, and treats a false should_run as a skip.
    proof: [entry-tests]
  - text: A safety error ends the call and is not logged and skipped like a hook error.
    proof: [entry-tests]
  - text: Without a plan override the legacy async_run_agentic_loop result is returned as it is, including None.
    proof: [entry-tests]
  - text: A plan with response_override returns it, a terminating plan returns the original response, and a plan with run_agentic_loop false moves to the next callback.
    proof: [entry-tests]
  - text: Plan execution builds the follow-up model, params, filtered kwargs and litellm_metadata exactly as listed.
    proof: [followup-tests]
  - text: The post hook error keeps the earlier response, the cleanup hook always runs and its error is swallowed, and a missing patched messages error skips the cleanup hook.
    proof: [followup-tests]
  - text: The final fake stream wrap happens only for the converted stream flag at depth 0, and the port leaves a stream, a non-ModelResponse and a non-logging handle unchanged.
    proof: [fake-stream-tests]

checks:
  optional: []
  commands:
    - id: settings-tests
      why: depth, max_loops or fingerprints are read wrongly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_agentic_loop::settings::tests::/)'
    - id: safety-tests
      why: the fingerprint, the check order or an error text is wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_agentic_loop::safety::tests::/)'
    - id: entry-tests
      why: the callback loop, the gate handling or the plan branches are wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_agentic_loop::entry::tests::/)'
    - id: followup-tests
      why: the follow-up request, the hooks or the cleanup order are wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_agentic_loop::followup::tests::/)'
    - id: fake-stream-tests
      why: the fake stream wrap condition is wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_agentic_loop::fake_stream::tests::/)'

oracle_cases: []

deviations:
  - what: The follow-up call and the fake stream wrap are traits the caller supplies. LiteLLM calls litellm.acompletion and builds CustomStreamWrapper directly.
    why: This module must not import its callers, and the family composition owns the recursion. Python runs the same logic in the oracle.
  - what: Callbacks arrive as a typed list. LiteLLM skips list entries that are not CustomLogger instances at run time.
    why: Rust has no such entries, and string callbacks are resolved before this point (B248).

out_of_scope:
  - "AgenticLoopPlan, AgenticLoopRequestPatch: B4119. build_agentic_followup_kwargs and the max loops validator: B4110."
  - "The CustomLogger trait and the interception prefix helpers: B189."
  - "The Responses side of the loop (responses_agentic_execution): B2415 and B2419."
  - "The web search and code interpreter callbacks that implement the gate and the plan: B4117, B4118, B4122."
  - "The CustomStreamWrapper (B005) and MockResponseIterator (B010) types and the call site in main.py (B5656). The FakeStreamPort implementation wraps the response in B010's MockResponseIterator inside B005's CustomStreamWrapper, and B5656 passes it in when it calls the loop."

pitfalls:
  - "The two safety errors are raised outside the try block. Do not catch them with the hook error handler."
  - "A callback that overrides the plan builder never reaches async_run_agentic_loop. Only a callback without the override does."
  - "Inherited default hooks must not count as overrides. Compare against the trait's default, as B2419 does."
  - "The converted stream flag at depth above 0 wraps nothing, so the inner follow-up returns a plain response and the outer call wraps once."
  - "The metadata merge uses all interception prefixes, but the kwargs filter uses only the non-code-interpreter ones."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
