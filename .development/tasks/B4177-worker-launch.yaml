  - tools/oracle/cases/worker/granian-no-max-requests.yaml
  - tools/oracle/cases/worker/granian-no-ciphers.yaml
  - tools/oracle/cases/worker/prometheus-callback-string.yaml
  - tools/oracle/cases/worker/prometheus-callback-list.yaml
  - tools/oracle/cases/worker/prometheus-no-callback.yaml
