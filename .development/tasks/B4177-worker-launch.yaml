id: B4177
title: Alternate worker launch and metrics process preparation
description: >-
  Build backend-specific launch plans and Prometheus multi-worker directory preparation, preserving TLS-pair validation and backend warning differences.
  Hypercorn serves HTTP/1.1 and HTTP/2 over asyncio, configured with optional SSL cert/key pair and optional ciphers (ciphers only if both TLS files are present).
  Granian runs a Rust-backed ASGI server with at least one worker and optional per-worker runtime threads; unsupported features (max_requests_before_restart, ciphers) trigger warnings.
  Gunicorn uses preload to fork workers, default timeout 600 seconds, optional max_requests and jitter, conditional Prometheus cleanup callback on child exit, and fork-guard registration for native Rust pre-work.
  Prometheus callback configuration detection checks litellm_settings keys callbacks, success_callback and failure_callback for "prometheus" string or list membership.
  Multi-worker directory setup creates PROMETHEUS_MULTIPROC_DIR (environment or auto-created temp), recognizes case-insensitive env-var names, and prepares shared samples when separate metrics listener or multi-worker setup needs it.
scope:
  paths:
    - crates/betterlite-server/**
    - tools/oracle/cases/worker/**
    - tools/oracle/helpers/b4177.py
    - tools/oracle/helpers/b4177/**
    - tools/oracle/src/helpers/oracle/b4177.rs
    - tools/oracle/src/helpers/oracle/b4177/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L435-L466
    why: "_init_hypercorn_server: Hypercorn configuration, TLS setup, and asyncio serving."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L468-L516
    why: "_init_granian_server: Granian ASGI server with worker count, runtime threads, TLS, and unsupported-feature warnings."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L518-L632
    why: "_run_gunicorn_server: Gunicorn preload, workers, timeout, max_requests/jitter, child-exit callback for Prometheus cleanup, and fork reservation."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L660-L672
    why: "_prometheus_callback_configured: Detect prometheus in callbacks, success_callback or failure_callback settings."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L674-L702
    why: "_maybe_setup_prometheus_multiproc_dir: Create and wipe PROMETHEUS_MULTIPROC_DIR, recognize env-var case variants, message on auto-create vs existing."
dod:
  - text: Hypercorn server binds to the given host:port with optional SSL cert/key, applies ciphers only when both TLS files are present, and serves with asyncio.
    proof: [worker-launch-oracle]
  - text: Granian server runs with num_workers (minimum 1), optional runtime_threads, optional SSL with both files required, and warns about unsupported max_requests/ciphers.
    proof: [worker-launch-oracle]
  - text: Gunicorn server preloads the app, forks num_workers, sets 600-second default timeout, applies optional max_requests and jitter, and configures Prometheus cleanup callback when PROMETHEUS_MULTIPROC_DIR is set.
    proof: [worker-launch-oracle]
  - text: Prometheus callback detection checks all three callback settings (callbacks, success_callback, failure_callback) for the string "prometheus" or list membership.
    proof: [worker-launch-oracle]
  - text: Prometheus multiproc directory is auto-created in temp when needed, respects configured PROMETHEUS_MULTIPROC_DIR or prometheus_multiproc_dir, and is prepared for multi-process use.
    proof: [worker-launch-oracle]
  - text: Start message names the backend (Hypercorn, Granian, Gunicorn) and reports host:port, worker count (when applicable), and metrics port if separate.
    proof: [worker-launch-oracle]
  - text: Granian requires both cert and key files and raises ClickException on incomplete pairs; Hypercorn and Gunicorn silently continue without SSL if either file is missing.
    proof: [worker-launch-oracle]
  - text: Prometheus directory creation recognizes both case variants (PROMETHEUS_MULTIPROC_DIR and prometheus_multiproc_dir) and messages "Using existing" vs "Auto-created".
    proof: [worker-launch-oracle]
checks:
  optional: []
  commands:
    - id: worker-launch-oracle
      why: backend launch paths, TLS validation, Prometheus callback detection or multiproc directory setup fails or does not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^worker_launch::/)' && test -n "$(ls tools/oracle/cases/worker 2>/dev/null | head -1)"
