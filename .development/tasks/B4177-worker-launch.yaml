  - tools/oracle/cases/worker/prometheus-multiproc-existing.yaml
  - tools/oracle/cases/worker/prometheus-multiproc-case-variants.yaml
deviations:
  - what: Multi-worker modes (num_workers > 1 or OS-level process forking) are rejected at startup with exit code 2 and error code unsupported_runtime.
    why: ".development/rules.yaml rule no-subprocess forbids spawning processes in gateway code, and native async runtime replaces multi-process workers with async tasks. Single-worker native Rust equivalents for Hypercorn, Granian, and Gunicorn implement TLS, ciphers, and callback configuration as described in DoD 1-3."
  - what: Fork-guard and start_query_engine_reaper calls in gunicorn code are omitted because native Rust pools have no Prisma process to protect.
    why: B713 already decided that native execution has no Prisma fork-reaping requirement; these Python helper calls are preserved in upstream but not built here."
  - what: Ollama serve subprocess spawning in B4175's _run_ollama_serve remains unsupported; only pre-running Ollama services are accessible.
    why: "Matches the no-subprocess rule; users must start Ollama separately."
out_of_scope:
  - "start_query_engine_reaper: B713 already decided native pools need no Prisma process spawning."
  - "reserve_process_for_forking: Native Rust does not use Python multiprocessing; this gunicorn helper call has no owner and no native equivalent."
  - "wipe_directory and mark_worker_exit implementation: This task configures the Prometheus cleanup callback trigger and the multiproc directory decision logic (DoD 3 and 5 cover detection and callback registration). The actual cleanup helper functions in litellm.proxy.prometheus_cleanup remain unowned; B3887 will own them once it exists. This task's scope is the launch decision, not the cleanup operation."
  - "get_finished_spans: The installed exporter's method is outside scope; spans are gathered by the exporter, not by launch code."
pitfalls:
  - "Granian raises ClickException if one TLS file is given without the other. Hypercorn and Gunicorn silently skip SSL if either file is missing; they do not error. Ciphers are only applied when both files are present."
  - "Granian's minimum is one worker, not zero; num_workers=0 becomes 1. Gunicorn and Hypercorn accept any non-negative count but betterlite rejects multi-worker modes at startup."
  - "PROMETHEUS_MULTIPROC_DIR can be set as uppercase or lowercase env-var names; both must be checked with getenv. Existing value is reused without wiping; only new auto-created directories are wiped."
  - "Gunicorn child_exit callback is only registered when PROMETHEUS_MULTIPROC_DIR is set; no callback exists without it, so workers exiting without multiproc metrics do not call mark_worker_exit."
  - "Prometheus callback detection returns true only if the setting is the exact string 'prometheus' or a sequence containing it; a typo like 'prometheu' matches nothing."
  - "Granian warnings for unsupported options are printed once at startup; they do not affect subsequent behavior. The flags are still parsed and validated by clap, so wrong values still raise click errors before the launch code runs."
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
