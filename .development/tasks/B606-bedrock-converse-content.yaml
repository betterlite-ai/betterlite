pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_converse_content in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/converse_content.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_converse_content.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Only searchResultLocation yields normalized citations; document/page locations are skipped.
- Mixed synthetic JSON tools append their first payload to existing text; all-synthetic tools replace existing text.
