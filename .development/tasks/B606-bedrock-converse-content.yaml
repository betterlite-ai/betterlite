id: B606
title: Bedrock Converse tool content and citations
description: >-
  Add ConverseContentReply projection for text/tool names, native citations, wrapped JSON properties and synthetic
  JSON-mode tools. Preserve original tool names and citation index/text/source details using B598’s supplied reverse-map
  view (the pinned producer is B231).


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig.get_tool_call_names L2267-L2285; AmazonConverseConfig.apply_tool_call_transformation_if_needed
  L2287-L2317; AmazonConverseConfig._translate_message_content L2319-L2388; AmazonConverseConfig._transform_citations_to_annotations
  L2391-L2457; AmazonConverseConfig._unwrap_bedrock_properties L2460-L2480; AmazonConverseConfig._filter_json_mode_tools
  L2483-L2525.


  Named case contracts: reverse_tool_names: get_tool_call_names collects unique string names from both non-None
  toolSpec and function mappings, includingempty strings; toolsNone ->[]. Ordering is Pythonset order and not a
  promised API contract; canonicalize only this helper collection in oracle comparison. _translate_message_content
  uses B598 reverse-name lookup for every toolUse and original content-block index, not a dense tool index. json_mode_filter:
  Falsey json_mode or no tools returns original tools orNone. Exact function.name=json_tool_call is synthetic; no
  synthetic ->unchanged. All synthetic ->take first arguments whennon-None, B606 unwrap, replace messagecontent
  (discard previous text), return None; only this allsynthetic path debug Processing JSON tool call response for
  response_format. Mixed ->append first synthetic arguments to existingcontent-or-empty with no separator, keep
  real tools in original order, discard other synthetic outputs. Missing arguments leaves content unchanged; do
  not reindex real tools. wrapped_properties: Parse JSON; only dict with exactly one key properties unwraps its
  value and json.dumps it, even scalar/None/list. Otherwise preserve the original string byte-for-byte including
  whitespace; catch JSONDecodeError only. No schema interpretation or recursive properties unwrapping. text_with_tool_use:
  Each content block independently contributes text,toolUse,reasoningContent,citationsContent, so one block may
  contribute several. Text uses B218 _parse_content_for_reasoning; append parsed non-None text without separators,
  and append extracted reasoning block before explicit reasoningContent. Lists startNone until any qualifying block,
  preserving raw empty reasoning/citation values. No annotations conversion occurs in this helper. empty_tool_input:
  toolUse requires name,input,toolUseId; serialize input with json.dumps defaultspacing/escaping, including{} ->{}
  and None ->null, preserving missing-key failures. Return id,type=function,function{name,arguments},index=<original
  block>. Do not replace missing input with{} or generate an id for a native toolUse. content_function_recovery:
  Only when tools is notNone and message.content is notNone, parse JSON, require object type=function and name in
  collected names, build Function from the full object and a generated tool-call id, replace message.tool_calls,
  clearcontent and setfinish reason tool_calls. Every error including JSON nonobject, invalidtool schema or constructor
  error is swallowed and original message/finish reason retained. Empty tool list parses but cannot match. Inject
  id source for constructor comparison. citation_search_locations: No citation blocks ->(None,None). For each block
  concatenate string text members of list content, ignoring malformed parts; offset advances Python character count
  only for nonempty blocktext. Only list citations with dict location.searchResultLocation and integer start/end
  (bool accepted) produce url_citation. Add block offset to raw start/end without range validation; title/source
  become str(value or empty string). Ignore documentChar/documentPage/documentChunk locations. Emptytext blocks
  can still emit annotations at current offset. Return concatenated text orNone and annotations orNone.


  decode_converse_json_tool is the shared production JSON decoder for textual function recovery and properties unwrapping;
  replay valid scalar/list/object, malformed and nested properties seeds through both call paths. Their different
  catch scopes are observable and must remain in the same named cases.


  Direct constructor/helper prerequisites used by this slice: B220. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/converse_content.rs with adjacent tests under converse_content/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_content_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): reverse_tool_names, json_mode_filter, wrapped_properties, text_with_tool_use, empty_tool_input, content_function_recovery,
  citation_search_locations. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_content* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_content variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_content that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_converse_json_tool consumes JSON tool-result content bytes in crates/betterlite-bedrock/src/converse_content.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_converse_content.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_converse_content.
  The adjacent test replays_the_bedrock_converse_content_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 216 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 250 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 60 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 695 planned, 700 maximum changed lines.
