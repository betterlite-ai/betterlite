    why: _log_guardrail_information writes structured tracing to request metadata.

dod:
  - text: _count_masked_entities counts each pattern, blocked_word and category_keyword detection whose action is MASK,
      mapping names to occurrence counts. Detections with action BLOCK or any non-MASK action are skipped entirely.
      Competitor_intent detections are never counted.
    proof: [tracing-tests]
  - text: _build_match_details formats each detection into a dict with type, action_taken, detection_method and
      snippet. Patterns include pattern_name, blocked_words include keyword, categories include keyword and category,
      competitor_intent includes intent and confidence.
    proof: [tracing-tests]
  - text: _get_detection_methods returns a comma-separated sorted string of unique methods from detections (regex,
      keyword, intent) or empty string if no detections.
    proof: [tracing-tests]
  - text: _get_patterns_checked_count returns the sum of compiled_patterns, blocked_words, category_keywords and
      always_block_category_keywords lengths.
    proof: [tracing-tests]
  - text: _get_policy_templates returns a comma-separated list of policy template names from loaded_categories, using
      description or category_name fields, or None if no categories.
    proof: [tracing-tests]
  - text: _compute_risk_score returns 10.0 for guardrail_intervened status. For other statuses, it computes
      match_ratio (masked sum / patterns_checked), ratio_score (ratio * 7.0 up to 7 points), detection_score
      (min(detection count, 5) * 0.6 up to 3 points), sums them, floors to 2.0 if masked > 0, caps at 10.0,
      rounds to 1 decimal place.
    proof: [tracing-tests]
  - text: _log_guardrail_information builds a GuardrailTracingDetail record with guardrail_id/name,
      policy_template, detection_method, match_details, patterns_checked, risk_score, and optional confidence_score and
      classification from first competitor_intent detection. Calls add_standard_logging_guardrail_information_to_request_data
      with all required parameters including guardrail_status, timestamps, duration, masked_entity_count and tracing_detail.
    proof: [tracing-tests]
  - text: GuardrailTracingDetail typed record carries all tracing fields and is passed to the logging API. First
      competitor_intent detection's confidence and classification are preserved in the trace.
    proof: [tracing-tests]

checks:
  optional: []
  commands:
    - id: tracing-tests
      why: detection metrics, risk scoring or guardrail tracing functions fail or are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_filter::(detection_metrics|risk_scoring|guardrail_tracing)/)'

oracle_cases: []

deviations:
  - what: "Risk score floors to 2.0 when any entities are masked and raw score would be lower. LiteLLM uses the same
      logic and floor threshold."
    why: "Ensures detections always surface a minimum risk level when content was masked."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1634-L1638"
  - what: "GuardrailTracingDetail is a typed record instead of a dict. Structure and field names match LiteLLM's
      tracing_kw dict written to request metadata."
    why: "Type safety and clarity in a Rust codebase; serialized form is identical."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1730-L1742"

out_of_scope:
  - "ContentFilterDetection union and status type definitions (B3690)."
  - "Pattern compilation, blocked word file loading, span matching and masking (B3693)."
  - "Category loading and conditional category matching (B3692, B3694)."
  - "Text evaluation and action handling (B3695)."
  - "Competitor intent classification (B3696, B3697)."
  - "add_standard_logging_guardrail_information_to_request_data logging API (unresolved B104 callee)."
  - "Request/response filtering orchestration and exception handling (belongs to apply_guardrail and streaming hooks)."

pitfalls:
  - "Masked entity counting only includes detections with action==MASK. A pattern/blocked_word/category_keyword detection
      with action=BLOCK (or any non-MASK action) is skipped entirely and contributes nothing to masked_entity_count."
  - "Competitor_intent detections are never counted in masked_entity_count, regardless of their action field."
  - "Match details formatting preserves detection.action and detection.action_hint fields; action_taken is
      action or action_hint if action is absent."
  - "Risk score match_ratio divides by patterns_checked; if patterns_checked is zero, ratio is 0.0 and
      ratio_score is 0.0, allowing other factors to set risk."
  - "Detection methods set handles category_keyword as keyword, not category. Only pattern adds regex, competitor_intent
      adds intent, everything else adds keyword."
  - "Policy templates joins one name per loaded category (description falling back to category_name) with no filtering
      of empty strings. The 'if names else None' check only guards against an empty category dict, not empty strings."
  - "GuardrailTracingDetail confidence_score and classification come from the first competitor_intent detection only;
      later competitor_intent detections are ignored."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 1
