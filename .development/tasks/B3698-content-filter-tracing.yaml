id: B3698
title: Content filter detections and request tracing
description: >-
  Build detection metrics, match details formatting, and structured guardrail logging for the content filter.
  This task implements helpers for accumulating and reporting on detected content policy violations, including
  masked entity counts, match detail formatting, risk score calculation, and the standard guardrail information
  written to request metadata.

  Implement in betterlite-guardrails crates/betterlite-guardrails/src/content_filter/:

  - detection_metrics.rs: Helper functions to gather detection statistics. Owns _count_masked_entities
    (CF:1524-1551 LiteLLM) which counts masked patterns, blocked words and category keywords by name from
    a detection list and updates a tally dict. Owns _build_match_details (CF:1553-1575) which formats
    each detection (pattern, blocked_word, category_keyword, competitor_intent) into a detail dict with
    type, action_taken, detection_method (regex/keyword/intent), and snippet (pattern name, keyword,
    category name, or intent). Owns _get_detection_methods (CF:1577-1587) which returns comma-separated
    sorted list of methods found in detections (regex, keyword, intent or empty string). Owns
    _get_patterns_checked_count (CF:1589-1596) which sums compiled_patterns, blocked_words,
    category_keywords and always_block_category_keywords counts. Owns _get_policy_templates (CF:1598-1603)
    which returns comma-separated policy template names from loaded_categories, description or
    category_name fields, or None if empty.

  - risk_scoring.rs: Owns _compute_risk_score (CF:1605-1638 LiteLLM) which calculates a bounded 0-10
    risk score. On guardrail_intervened status, returns 10.0. Otherwise computes match_ratio
    (masked_entity_count sum divided by patterns_checked), contributing 0-7 points; detection count
    (min(detection count, 5) * 0.6) contributing 0-3 points; adds points; floors to 2.0 if any masked;
    caps at 10.0; rounds to one decimal. Risk score uses the same status type as logging (_get_status):
    success, guardrail_intervened, or guardrail_failed_to_respond.

  - guardrail_tracing.rs: Owns _log_guardrail_information (CF:1702-1754 LiteLLM) which builds
    a GuardrailTracingDetail record with guardrail_id/name, policy_template,
    detection_method, match_details (formatted by _build_match_details), patterns_checked count,
    and risk_score. Tracing detail includes the first competitor_intent classification and confidence
    if present. Calls add_standard_logging_guardrail_information_to_request_data (unresolved B104 callee)
    with guardrail_provider, guardrail_json_response (detections or exception_str), request_data,
    guardrail_status, start_time timestamp, end_time timestamp, duration (wall clock or provided override),
    masked_entity_count, and the constructed tracing_detail. On status != success, guardrail_json_response is the
    exception_str if provided, else detections list. GuardrailTracingDetail is a typed record carrying
    guardrail_id, policy_template, detection_method, match_details, patterns_checked, risk_score,
    confidence_score (optional, from first competitor_intent), classification (optional, dict of first
    competitor_intent detection).

  Types from B3690: ContentFilterDetection union (pattern, blocked_word, category_keyword, competitor_intent
  variants), GuardrailStatus literal (success, guardrail_intervened, guardrail_failed_to_respond),
  GuardrailTracingDetail typed record.

