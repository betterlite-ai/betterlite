dod:
- text: >-
    load_local_blog_posts returns a list of blog post dicts with title, description, date, and url
    fields from the bundled blog_posts.json file.
  proof: [blog-feed-helpers, oracle]
- text: >-
    fetch_rss_feed accepts a URL and optional timeout (default 5 seconds), makes an HTTP GET request
    with that timeout, returns the response text on 2xx status, and raises on network errors or non-2xx.
  proof: [blog-feed-helpers, oracle]
- text: >-
    parse_rss_to_posts accepts XML text and optional max_posts (default 1), parses the XML, extracts
    title, description, date (YYYY-MM-DD on successful RFC 2822 parse, raw text otherwise), and url
    from each <item> up to max_posts, skips items with missing title or url, returns a list of dicts.
  proof: [blog-feed-helpers, oracle]
- text: >-
    validate_blog_posts returns true if posts is a non-empty list, returns false if empty or not a list,
    and logs a warning when validation fails.
  proof: [blog-feed-helpers, oracle]
- text: >-
    get_blog_posts checks LITELLM_LOCAL_BLOG_POSTS env var (case-insensitive "true"); if set, returns
    load_local_blog_posts() immediately. Otherwise checks cache: returns cached posts if within
    BLOG_POSTS_TTL_SECONDS (3600). On cache miss, fetches from URL, parses, validates; on any exception
    logs warning and returns load_local_blog_posts(). On success, caches posts and returns them.
  proof: [blog-feed-helpers, oracle]
- text: >-
    get_blog_posts public wrapper calls the classmethod and returns the blog posts list.
  proof: [blog-feed-helpers, oracle]
- text: >-
    quick-xml crate is added to Cargo.toml and deny.toml to enable RSS XML parsing.
  proof: [dependency-check]
- text: Blog feed helper operation runs through its registered stub module and adapter
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: blog-feed-helpers
    why: blog feed helper functions must match LiteLLM behavior on all test cases
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::server::blog_feed::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: the blog feed helper adapters cannot run independently
    run: test -f tools/oracle/helpers/blog_feed.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: no added blog feed operation reaches the helper decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/blog_feed-*)" && grep -qE '^[[:space:]]+blog_feed:' tools/oracle/fuzz/corpus/helper_case/blog_feed-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: blog feed helpers add no oracle inputs
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/blog_feed)"
  - id: dependency-check
    why: quick-xml crate must be present in Cargo.toml and allowed in deny.toml
    run: grep -q 'quick-xml' Cargo.toml && grep -q 'quick-xml' deny.toml
