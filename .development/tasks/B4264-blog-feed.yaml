deviations:
- what: >-
    quick-xml is the chosen XML parsing crate for RSS parsing instead of xml.etree.ElementTree (Python).
    betterlite uses quick-xml for its performance and compatibility with Rust's type system.
  why: >-
    LiteLLM uses Python's standard library ElementTree. Rust has no direct equivalent; quick-xml is the
    most commonly used and performant crate for XML parsing and is compatible with the MIT license.
out_of_scope:
- >-
    verbose_logger in LiteLLM is a module-level logger. betterlite accepts a logger injected through the
    function interface or uses a provided logging abstraction, following the dependency injection pattern
    for testability.
- >-
    httpx client initialization and timeout handling. betterlite uses reqwest or similar HTTP client with
    explicit timeout configuration passed as a parameter.
- >-
    BLOG_POSTS_TTL_SECONDS and cache field management. betterlite uses explicit constants and field-level
    access patterns matching the same 3600-second (one hour) TTL.
pitfalls:
- 'The oracle helper for this task is pre-registered as blog_feed in the server group. Replace the stub Op in tools/oracle/src/helpers/server/blog_feed.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/blog_feed.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
    parse_rss_to_posts skips items that have either a missing title OR missing url; an item with a valid
    title and url but missing description or date is still included with empty strings for those fields.
- >-
    The date field extraction uses RFC 2822 parsing with parsedate_to_datetime; if parsing fails with any
    exception, the raw pubDate text is used as-is without further formatting, preserving the literal string.
- >-
    fetch_rss_feed raises on any non-2xx HTTP status, not just 404 or 500; the caller must catch all
    exceptions and fall back to local posts.
- >-
    The LITELLM_LOCAL_BLOG_POSTS env var check uses case-insensitive comparison with "true"; any other value
    (including "True", "FALSE", empty string, or missing) proceeds with normal fetch/cache logic.
- >-
    In-process cache is shared across all calls within the same process; concurrent updates do not use locks,
    so the cache may be overwritten without synchronization (matching LiteLLM's behavior).
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
