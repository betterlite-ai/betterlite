id: B4264
title: Blog feed cache and bundled fallback
description: >-
  Build the blog feed cache with RSS parsing and bundled JSON fallback as oracle helpers. Register
  blog_feed as a new helper operation with Rust and Python adapters. Implement six methods matching
  litellm/litellm_core_utils/get_blog_posts.py: load_local_blog_posts reads and returns posts from
  bundled blog_posts.json; fetch_rss_feed sends HTTP GET with five-second timeout and returns raw XML
  text; parse_rss_to_posts parses RSS, extracts title, description, date (YYYY-MM-DD or raw on failure),
  and url from up to max_posts items (default 1), skipping items with missing title or url;
  validate_blog_posts returns true for non-empty lists, false otherwise with a warning;
  get_blog_posts implements caching with BLOG_POSTS_TTL_SECONDS (3600) TTL, LITELLM_LOCAL_BLOG_POSTS
  env override, and fallback to bundled posts on fetch/parse failure; get_blog_posts (public wrapper)
  delegates to the class method.

  Add quick-xml crate to Cargo.toml and deny.toml to parse RSS XML. Preserve the five-second fetch
  timeout, lenient date parsing (raw text kept on failure), local-only override, one-item default limit,
  and uncached failure fallback matching LiteLLM behavior exactly. Inject HTTP client and clock;
  environment variable check and resource loading are infrastructure.
