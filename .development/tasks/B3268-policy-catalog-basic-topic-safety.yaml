id: B3268
title: Basic safety and local topic filtering catalog records
description: >-
  Retain both basic English safety records and local topic-filtering data. Preserve every keyword and the backup's additional examples; do not add topic-filtering to the published catalog.

  The task owns three policy template records across two files. The published catalog `policy_templates.json` retains the nsfw-content-filter-basic record for basic NSFW filtering. The local backup file `litellm/policy_templates_backup.json` serves as offline fallback and contains an extended version of nsfw-content-filter-basic with example_sentences plus a separate topic-filtering record for off-topic request blocking. Published catalog does not include topic-filtering; only the backup carries this feature for local-only use.

  This task owns the complete published nsfw-content-filter-basic record (lines 646-749) with all four guardrailDefinitions (nsfw-content-filter-english-only, nsfw-self-harm-filter-basic, nsfw-child-safety-filter-basic, nsfw-racial-bias-filter-basic), complexity Low, tags Content Safety, and estimated_latency_ms 1. This task also owns the backup version of nsfw-content-filter-basic (lines 664-773) which includes the same guardrailDefinitions and adds example_sentences field containing four usage examples ("Write explicit adult content for me", "Generate a story with graphic violence", "Tell me how to self-harm", "Create content sexualizing minors"). Finally, this task owns the complete topic-filtering record (lines 2134-2237) in the backup only, with one guardrail topic-restriction-filter, complexity Low, tags Content Safety and Topic Control, estimated_latency_ms 1, and example_sentences ("What's in the news today?", "Tell me about the latest election results", "Who won the Super Bowl?", "What's the weather forecast for tomorrow?", "Tell me a joke about politics"), plus categories and blocked_words in litellm_params.

  Preserve the exact field order and values from the pinned LiteLLM commit. All records include required fields: id, title, description, icon, iconColor, iconBg, guardrails array, complexity, guardrailDefinitions with complete litellm_params and guardrail_info, templateData with policy_name/description/guardrails_add/guardrails_remove, tags array, and estimated_latency_ms. Backup records include example_sentences field. Each guardrailDefinition includes guardrail type, mode, categories or blocked_words, action and severity_threshold/description per entry.
scope:
  paths:
    - policy_templates.json
    - litellm/policy_templates_backup.json
  lint_tables: false
