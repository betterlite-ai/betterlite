id: B3268
title: Basic safety and local topic filtering catalog records
description: >-
  Retain both basic English safety records and local topic-filtering data. Preserve every keyword and the backup's additional examples; do not add topic-filtering to the published catalog.

  The task owns three policy template records across two catalogs. LiteLLM's published catalog `policy_templates.json` retains the nsfw-content-filter-basic record for basic NSFW filtering. LiteLLM's local backup file `litellm/policy_templates_backup.json` serves as offline fallback and contains an extended version of nsfw-content-filter-basic with example_sentences plus a separate topic-filtering record for off-topic request blocking. Published catalog does not include topic-filtering; only the backup carries this feature for local-only use.

  Write each record to its own fragment file: `crates/betterlite-policy/assets/templates/published/nsfw-content-filter-basic.json`, `crates/betterlite-policy/assets/templates/local/nsfw-content-filter-basic.json` and `crates/betterlite-policy/assets/templates/local/topic-filtering.json`. Each holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values. B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.

  This task owns the complete published nsfw-content-filter-basic record (lines 646-749) with all four guardrailDefinitions (nsfw-content-filter-english-only, nsfw-self-harm-filter-basic, nsfw-child-safety-filter-basic, nsfw-racial-bias-filter-basic), complexity Low, tags Content Safety, and estimated_latency_ms 1. This task also owns the backup version of nsfw-content-filter-basic (lines 664-773) which includes the same guardrailDefinitions and adds example_sentences field containing four usage examples ("Write explicit adult content for me", "Generate a story with graphic violence", "Tell me how to self-harm", "Create content sexualizing minors"). Finally, this task owns the complete topic-filtering record (lines 2134-2237) in the backup only, with one guardrail topic-restriction-filter, complexity Low, tags Content Safety and Topic Control, estimated_latency_ms 1, and example_sentences ("What's in the news today?", "Tell me about the latest election results", "Who won the Super Bowl?", "What's the weather forecast for tomorrow?", "Tell me a joke about politics"), plus categories and blocked_words in litellm_params.

  Preserve the exact field order and values from the pinned LiteLLM commit. All records include required fields: id, title, description, icon, iconColor, iconBg, guardrails array, complexity, guardrailDefinitions with complete litellm_params and guardrail_info, templateData with policy_name/description/guardrails_add/guardrails_remove, tags array, and estimated_latency_ms. Backup records include example_sentences field. Each guardrailDefinition includes guardrail type, mode, categories or blocked_words, action and severity_threshold/description per entry.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/published/nsfw-content-filter-basic.json
    - crates/betterlite-policy/assets/templates/local/nsfw-content-filter-basic.json
    - crates/betterlite-policy/assets/templates/local/topic-filtering.json
  lint_tables: false
references:
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L646-L749"
    why: >-
      The published nsfw-content-filter-basic record with four guardrailDefinitions
      (nsfw-content-filter-english-only, nsfw-self-harm-filter-basic, nsfw-child-safety-filter-basic, nsfw-racial-bias-filter-basic).
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L664-L773"
    why: >-
      The backup version of nsfw-content-filter-basic with the same guardrailDefinitions
      plus example_sentences field with four usage examples unique to the backup.
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L2134-L2237"
    why: >-
      The complete topic-filtering record in backup only, with one guardrail topic-restriction-filter,
      categories and blocked_words entries for off-topic blocking, and associated metadata.
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624"
    why: The _load_policy_templates_from_local_backup function that loads the backup catalog.
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L632-L662"
    why: The get_policy_templates route that returns published catalog with fallback to local backup.
dod:
  - text: >-
      The published nsfw-content-filter-basic fragment holds the complete record with keys, in this order,
      id, title, description, icon, iconColor, iconBg, guardrails array (4 items),
      complexity Low, guardrailDefinitions array (4 items), templateData, tags (1 item: Content Safety),
      and estimated_latency_ms 1.
    proof: [published-nsfw-basic]
  - text: >-
      The published nsfw-content-filter-basic record includes all four guardrailDefinitions:
      nsfw-content-filter-english-only with harm_toxic_abuse category and 485+ keyword description,
      nsfw-self-harm-filter-basic with harmful_self_harm category,
      nsfw-child-safety-filter-basic with harmful_child_safety category,
      nsfw-racial-bias-filter-basic with bias_racial category. Each has mode pre_call, action BLOCK,
      severity_threshold medium, enabled true.
    proof: [published-nsfw-basic]
  - text: >-
      There is no published topic-filtering fragment. Topic filtering is
      local-backup-only and must not appear in the published catalog.
    proof: [published-no-topic]
  - text: >-
      The local nsfw-content-filter-basic fragment holds the record
      with the example_sentences field and its four entries: "Write explicit adult content for me",
      "Generate a story with graphic violence", "Tell me how to self-harm", "Create content sexualizing minors".
    proof: [backup-nsfw-with-examples]
  - text: >-
      The backup nsfw-content-filter-basic record includes all four guardrailDefinitions
      with identical structure and values to published version: harm_toxic_abuse, harmful_self_harm,
      harmful_child_safety, bias_racial, each with mode pre_call, action BLOCK, severity_threshold medium, enabled true.
    proof: [backup-nsfw-with-examples]
  - text: >-
      The local topic-filtering fragment holds the complete record with keys, in this order,
      id, title, description, example_sentences, icon, iconColor, iconBg, guardrails array (1 item),
      complexity Low, guardrailDefinitions array (1 item), templateData, tags (2 items: Content Safety, Topic Control),
      and estimated_latency_ms 1.
    proof: [backup-topic-filtering]
  - text: >-
      The topic-filtering record includes one guardrailDefinition named topic-restriction-filter with
      litellm_params containing guardrail type litellm_content_filter, mode pre_call, categories array
      with one entry 'off_topic' having action BLOCK, enabled true, and severity_threshold medium, plus
      exactly ten blocked_words entries.
    proof: [backup-topic-categories-keywords]
  - text: >-
      The topic-filtering record contains exactly these five example_sentences in order:
      "What's in the news today?", "Tell me about the latest election results", "Who won the Super Bowl?",
      "What's the weather forecast for tomorrow?", "Tell me a joke about politics".
    proof: [backup-topic-examples]
  - text: >-
      The topic-filtering blocked_words array contains exactly these ten entries with keyword and description pairs,
      in order: (1) "news today" / "Off-topic: news", (2) "latest news" / "Off-topic: news",
      (3) "what happened in" / "Off-topic: current events", (4) "election results" / "Off-topic: politics",
      (5) "who won the" / "Off-topic: sports/entertainment", (6) "weather forecast" / "Off-topic: weather",
      (7) "stock market" / "Off-topic: finance", (8) "tell me a joke" / "Off-topic: entertainment",
      (9) "movie recommendation" / "Off-topic: entertainment", (10) "sports scores" / "Off-topic: sports".
    proof: [backup-topic-categories-keywords]
  - text: >-
      All three fragments are valid JSON and each holds exactly one object.
    proof: [json-validity]
checks:
  optional: []
  commands:
    - id: published-nsfw-basic
      why: >-
        the published nsfw-content-filter-basic fragment is missing, is not one valid JSON object,
        has example_sentences, or its keys, key order, values or any of the four guardrailDefinitions differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["nsfw-content-filter-english-only", "nsfw-self-harm-filter-basic", "nsfw-child-safety-filter-basic", "nsfw-racial-bias-filter-basic"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "nsfw-content-filter-basic"
          and .title == "NSFW Content Filter (Basic)"
          and (.description | contains("English only"))
          and .guardrails == $names
          and .complexity == "Low"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[]; has("guardrail_info") and .litellm_params.guardrail == "litellm_content_filter" and .litellm_params.mode == "pre_call")
          and [.guardrailDefinitions[].litellm_params.categories] == [["harm_toxic_abuse", "harmful_self_harm", "harmful_child_safety", "bias_racial"][] | [{"category": ., "enabled": true, "action": "BLOCK", "severity_threshold": "medium"}]]
          and .tags == ["Content Safety"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/nsfw-content-filter-basic.json

    - id: published-no-topic
      why: >-
        a published topic-filtering fragment exists, but topic filtering is backup-only
      run: |-
        test ! -e crates/betterlite-policy/assets/templates/published/topic-filtering.json

    - id: backup-nsfw-with-examples
      why: >-
        the local nsfw-content-filter-basic fragment is missing, is not one valid JSON object, lacks
        the four example_sentences, or its keys, key order, values or categories differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["nsfw-content-filter-english-only", "nsfw-self-harm-filter-basic", "nsfw-child-safety-filter-basic", "nsfw-racial-bias-filter-basic"] as $names
          | keys_unsorted == ["id", "title", "description", "example_sentences", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "nsfw-content-filter-basic"
          and .example_sentences == ["Write explicit adult content for me", "Generate a story with graphic violence", "Tell me how to self-harm", "Create content sexualizing minors"]
          and .guardrails == $names
          and .complexity == "Low"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[]; has("guardrail_info") and .litellm_params.guardrail == "litellm_content_filter" and .litellm_params.mode == "pre_call")
          and [.guardrailDefinitions[].litellm_params.categories] == [["harm_toxic_abuse", "harmful_self_harm", "harmful_child_safety", "bias_racial"][] | [{"category": ., "enabled": true, "action": "BLOCK", "severity_threshold": "medium"}]]
          and .tags == ["Content Safety"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/local/nsfw-content-filter-basic.json

    - id: backup-topic-filtering
      why: >-
        the local topic-filtering fragment is missing, is not one valid JSON object, or its keys,
        key order or values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | keys_unsorted == ["id", "title", "description", "example_sentences", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "topic-filtering"
          and .title == "Topic Filtering"
          and (.description | ascii_downcase | contains("off-topic") or contains("approved topics"))
          and (.example_sentences | length) == 5
          and .guardrails == ["topic-restriction-filter"]
          and .complexity == "Low"
          and [.guardrailDefinitions[].guardrail_name] == ["topic-restriction-filter"]
          and (.guardrailDefinitions[0] | has("litellm_params") and has("guardrail_info"))
          and .tags == ["Content Safety", "Topic Control"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/local/topic-filtering.json

    - id: backup-topic-categories-keywords
      why: >-
        the local topic-filtering fragment is missing, is not one valid JSON object, or lacks
        the off_topic category or the ten blocked_words entries
      run: |-
        jq -e -s 'length == 1 and (.[0].guardrailDefinitions
          | length == 1
          and .[0].litellm_params.guardrail == "litellm_content_filter"
          and .[0].litellm_params.mode == "pre_call"
          and .[0].litellm_params.categories == [{"category": "off_topic", "enabled": true, "action": "BLOCK", "severity_threshold": "medium"}]
          and [.[0].litellm_params.blocked_words[] | [.keyword, .description, .action]] == [["news today", "Off-topic: news", "BLOCK"], ["latest news", "Off-topic: news", "BLOCK"], ["what happened in", "Off-topic: current events", "BLOCK"], ["election results", "Off-topic: politics", "BLOCK"], ["who won the", "Off-topic: sports/entertainment", "BLOCK"], ["weather forecast", "Off-topic: weather", "BLOCK"], ["stock market", "Off-topic: finance", "BLOCK"], ["tell me a joke", "Off-topic: entertainment", "BLOCK"], ["movie recommendation", "Off-topic: entertainment", "BLOCK"], ["sports scores", "Off-topic: sports", "BLOCK"]])' crates/betterlite-policy/assets/templates/local/topic-filtering.json

    - id: backup-topic-examples
      why: >-
        the local topic-filtering fragment is missing, is not one valid JSON object, or its five
        example_sentences are missing or differ
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ([39] | implode) as $quote
          | .example_sentences == ["What" + $quote + "s in the news today?", "Tell me about the latest election results", "Who won the Super Bowl?", "What" + $quote + "s the weather forecast for tomorrow?", "Tell me a joke about politics"])' crates/betterlite-policy/assets/templates/local/topic-filtering.json

    - id: json-validity
      why: >-
        a fragment is missing, has JSON syntax errors, or holds anything other than exactly one object
      run: |-
        jq -e -s 'length == 1 and (.[0] | type == "object")' crates/betterlite-policy/assets/templates/published/nsfw-content-filter-basic.json \
        && jq -e -s 'length == 1 and (.[0] | type == "object")' crates/betterlite-policy/assets/templates/local/nsfw-content-filter-basic.json \
        && jq -e -s 'length == 1 and (.[0] | type == "object")' crates/betterlite-policy/assets/templates/local/topic-filtering.json

oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or uses these catalog records. The loading function _load_policy_templates_from_local_backup
    is covered by B3252 which depends on this task. The route that uses the catalogs (get_policy_templates)
    is covered by B3253.
  - Guardrail implementations or pattern definitions referenced by these templates. These records only define
    policy patterns and metadata.
  - Other policy templates in the published or backup catalogs. Those are owned by other catalog tasks.
  - Topic-filtering in the published policy_templates.json. This feature is local-backup-only by design.
pitfalls:
  - All three fragments must be syntactically valid JSON. Any syntax errors prevent loading by _load_policy_templates_from_local_backup.
  - The published nsfw-content-filter-basic record must NOT include example_sentences field; that field is unique to the backup version where it appears before guardrails array.
  - The topic-filtering record has only a local fragment; do not write a published topic-filtering fragment.
  - "The topic-filtering litellm_params must include both categories array with one off_topic entry and blocked_words array with ten entries; omitting either breaks the filter."
  - "The backup nsfw-content-filter-basic example_sentences field must contain exactly the four NSFW-related sentences; the topic-filtering example_sentences are different (five news/politics/weather examples) and must not be mixed."
  - "The topic-filtering off_topic category requires enabled: true, action: BLOCK, and severity_threshold: medium; if any are missing or wrong, the backup category check fails."
review_level: standard
budget:
  max_changed_lines: 350
  max_new_expects: 0
