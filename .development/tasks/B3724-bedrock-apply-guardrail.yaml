pitfalls:
  - Probing with the whole payload first keeps single-batch requests at one call; bin-packing
    multiplies calls and latency on traffic that never had a size problem.
  - 'Size errors are recognized reactively: a too-large rejection is only discovered after
    posting, so no budget can predict when to chunk preemptively.'
  - Throttle retry must exclude size errors because retrying the same oversized content
    fails identically, wasting backoff sleeps and billed attempts at every recursion level.
  - Block logging occurs in the inner layer (_post_apply_guardrail_content) because chunking
    stops immediately; logged usage accumulates from all completed chunks.
  - AWS exception markers in 200 responses must not raise; they allow through and survive
    merge so consolidated logs record them as transient failure.
  - Contextual-grounding content is never split because grounding is scored holistically;
    bisecting it would fragment that evaluation and yield misleading scores.
  - 'The oracle helper for this task is pre-registered as bedrock_apply in the guardrails
    group. Replace the stub Op in tools/oracle/src/helpers/guardrails/b3724.rs
    with an impl Helper and write run in tools/oracle/helpers/b3724.py.'

