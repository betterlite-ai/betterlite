dod:
  - text: ApplyGuardrail is called first with the complete payload (whole-content probe);
      too-large errors trigger bin-packing only, and size errors are excluded from throttle
      retry.
    proof: [apply-tests, apply-oracle]
  - text: Per-batch responses are merged transparently; the caller sees a single logical
      result aligned to original content-item positions.
    proof: [apply-tests, apply-oracle]
  - text: Contextual-grounding content opt out of chunking entirely; a too-large error
      on grounded content is not split but raised.
    proof: [apply-tests, apply-oracle]
  - text: Throttle retry (429 only) uses exponential backoff (0.5, 1, 2 seconds) capped
      at 3 retries; exhausted retries raise 500.
    proof: [apply-tests, apply-oracle]
  - text: Policy blocks (guardrail_intervened) are logged where they occur and raise immediately;
      the logged usage includes all completed chunks plus the blocking call.
    proof: [apply-tests, apply-oracle]
  - text: AWS exception markers in 200 responses allow through (not raised) and survive
      merge; end-to-end failure is logged once with accumulated usage.
    proof: [apply-tests, apply-oracle]
  - text: Empty content is skipped without calling ApplyGuardrail; dynamic params never
      replace content or source.
    proof: [apply-tests, apply-oracle]
  - text: make_bedrock_api_request routes to InvokeGuardrailChecks (B3725) when checks
      is configured, else to ApplyGuardrail.
    proof: [apply-tests, apply-oracle]

