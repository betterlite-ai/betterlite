id: B3724
title: Bedrock ApplyGuardrail execution and retries
description: >-
  Build ApplyGuardrail's whole-content probe, reactive size splitting, capped throttle
  retry and consolidated success/failure logging, then expose the common ApplyGuardrail/checks
  dispatcher. Probe once with the complete payload first, falling back to bin-packing on
  too-large errors only; the per-batch responses merge transparently so callers see one
  logical result. Preserve allow-through behavior for AWS exception markers embedded in
  200 responses, stop immediately on policy blocks (logging them where they occur), and
  exclude size errors from throttle retry since retrying the same oversized content
  cannot succeed.

  Make ApplyGuardrail the dispatcher that checks routes to and set up the consolidated
  logging structure. Retry throttling on 429 with exponential backoff (0.5, 1, 2 seconds
  matching the source), capped low because chunking already trades one call for several
  smaller ones. Log a unified attempt record once per logical request only, including
  completed-chunk usage from earlier batches plus the blocking call's usage when a block
  stops the flow. Everything else that fails (size errors, non-throttle validation errors,
  exhausted retries) is logged exactly once as an end-to-end failure with the accumulated
  usage.

