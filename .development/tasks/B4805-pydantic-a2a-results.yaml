id: B4805
title: Pydantic AI task projection and simulated streams
description: >-
  Build completed-task text selection, direct Message projection and simulated stream events.
  Pydantic AI returns completed tasks with history and artifacts; betterlite must extract agent text
  and synthesize fake streaming events since Pydantic AI does not support streaming.

  Implement PydanticAITransformation module with three static methods for task response transformation.
  _transform_to_a2a_response converts a Pydantic AI task response to standard A2A non-streaming format:
  jsonrpc "2.0", request_id, result with kind "message", role "agent", extracted text parts and
  generated messageId. _extract_response_text searches the completed task for agent text, preferring
  artifacts first, then the last agent message in reversed history, then the message field, joining
  multi-part text with newline. fake_streaming_from_response creates A2A streaming events from the
  response: task event with status "submitted" and full history, status update "working", artifact
  update chunks (50-character chunks with 10 ms delays between), and final status "completed" with
  final flag true. Empty text produces no artifact event, unlike Watsonx.

  The four schema adapters at transformation.py:21-24 are shared between result projection and
  polling callers; they belong below both response paths so they are not duplicated. B4806 accounts
  for all remaining shared file code and entry points.

  All transformation methods are synchronous and never call external services.
  Use uuid::Uuid for ID generation and serde for JSON serialization.
  A test deserializes fixture task responses to verify shape transformation.
  Oracle cases drive transformation against LiteLLM on every input pattern.

