    why: fake_streaming_from_response emits task, status and artifact events with chunked text and configurable delays
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/providers/pydantic_ai_agents/transformation.py#L21-L24
    why: Four schema adapters (_SupportsModelDump, _SupportsPydanticDict, _STR_KEY_DICT_ADAPTER, _LIST_ADAPTER) shared with B4806

dod:
  - text: _transform_to_a2a_response converts task response to A2A format with jsonrpc "2.0", request_id and message result.
    proof: [pydantic-response-tests]
  - text: _extract_response_text tries artifacts first, then reversed history for last agent message, then message field.
    proof: [pydantic-response-tests]
  - text: _extract_response_text joins multi-part text with newline and generates fresh messageId per call.
    proof: [pydantic-response-tests]
  - text: fake_streaming_from_response emits task event with status "submitted" and full history including input message.
    proof: [pydantic-response-tests]
  - text: fake_streaming_from_response emits status event with state "working".
    proof: [pydantic-response-tests]
  - text: fake_streaming_from_response emits artifact update chunks of 50 characters with 10 ms delays between chunks.
    proof: [pydantic-response-tests]
  - text: fake_streaming_from_response emits final status event with state "completed" and final flag true.
    proof: [pydantic-response-tests]
  - text: fake_streaming_from_response counts Python characters for chunk boundaries, not UTF-8 bytes.
    proof: [pydantic-response-tests]
  - text: Empty response text produces no artifact event; task, working and completed events are emitted always.
    proof: [pydantic-response-tests]
  - text: Every oracle case for transformation matches LiteLLM on response shape, event structure and ID generation.
    proof: [pydantic-response-oracle-cases]

checks:
  optional: []
  commands:
    - id: pydantic-response-tests
      why: the Pydantic AI response transformation tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^pydantic_ai_transformation::(transform|extract|fake)/)'
    - id: pydantic-response-oracle-cases
      why: the oracle cases fail or do not exist
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/a2a/pydantic*.yaml)" && cargo nextest run --locked --no-tests=fail --package betterlite-oracle -E 'test(pydantic_ai_transformation)'

