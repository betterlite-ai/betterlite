  - tools/oracle/cases/a2a/pydantic-artifact-extraction.yaml
  - tools/oracle/cases/a2a/pydantic-history-fallback.yaml
  - tools/oracle/cases/a2a/pydantic-message-fallback.yaml
  - tools/oracle/cases/a2a/pydantic-multipart-join.yaml
  - tools/oracle/cases/a2a/pydantic-transform-response.yaml
  - tools/oracle/cases/a2a/pydantic-fake-streaming.yaml
  - tools/oracle/cases/a2a/pydantic-empty-text.yaml

deviations: []

out_of_scope:
  - Pydantic AI submission and polling; those belong to B4806.
  - Request parameter cleanup and message.kind setup; those belong to B4806.
  - Non-streaming and streaming handler implementations; those belong to B4806.
  - HTTP client and transport; those belong to B173.

pitfalls:
  - Pydantic AI response artifacts may not be dictionaries; skip non-dict artifacts and handle missing parts.
  - Text extraction reverses history to find the last agent message, preserving chronological order.
  - fake_streaming_from_response generates fresh task/context/artifact IDs per call, never reusing from response.
  - Chunk boundaries count Python characters (len(string)), not UTF-8 bytes; "é" is 1 character, not 2 bytes.
  - Empty text produces no artifact event; task, working and completed events are always emitted.
  - History may contain user messages before the first user message; extract the first user message correctly.
  - The four schema adapters handle both Pydantic v1 dict() and v2 model_dump() methods on Pydantic objects.
  - Text parts are extracted with empty fallback (""); do not emit parts if all text is absent.

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
