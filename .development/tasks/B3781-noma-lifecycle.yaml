id: B3781
title: Noma legacy lifecycle and buffered streaming
description: >-
  Build the legacy pre/during/post hooks and streaming response handling for Noma. The guardrail's lifecycle connects to request processing at three points: pre_call runs checks before the LLM call, during_call runs before tool execution, and post_call runs after receiving a response. Each hook forwards to the shared B3780 scan methods and decides to block, anonymize or allow based on the verdict.

  In monitor_mode, all hooks run checks asynchronously in the background and return immediately without blocking; checks run with the same data as blocking mode but never raise. The `_create_background_noma_check` method wraps a coroutine in `asyncio.create_task` and logs errors if the task fails to start.

  `block_failures` (default true) controls the error response when the Noma API is unreachable or returns an invalid response: if set, the hook raises; otherwise it logs the error and allows the request through.

  Implement streaming response inspection by buffering all stream chunks using `stream_chunk_builder`, assembling them into a complete ModelResponse, running the post-call scan, and replaying the original chunks or yielding chunks from the MockResponseIterator if the response was modified.

  Include the `get_supported_event_hooks` method returning [pre_call, during_call, post_call, pre_mcp_call]. Deprecation warning for the legacy 'noma' name is emitted once per process (not per instance) using a module-level guard, matching LiteLLM's _LEGACY_NOMA_DEPRECATION_WARNED flag.

  Implement the `initialize_guardrail` function in noma/__init__.py to conditionally route requests to v2 if `use_v2` is set; instantiate NomaGuardrail with constructor parameters matching the config model, register with add_litellm_callback, and return the instance. Supply `guardrail_initializer_registry` and `guardrail_class_registry` mappings for both noma and noma_v2, indexed by SupportedGuardrailIntegrations enum values.

