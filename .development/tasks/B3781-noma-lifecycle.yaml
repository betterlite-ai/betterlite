deviations:
  - what: In monitor_mode, background checks are spawned with asyncio.create_task without awaiting; the main request flow never blocks on the check result.
    why: LiteLLM creates background tasks to allow non-blocking monitoring without affecting latency.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma.py#L156-L164
  - what: The streaming hook buffers all chunks before inspection, then yields from MockResponseIterator if the response was checked; this can increase memory use for large responses.
    why: LiteLLM requires complete response assembly to inspect the full content before deciding to allow or block.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma.py#L798-L841
out_of_scope:
  - B3780 owns the shared scan methods _process_user_message_check, _process_llm_response_check, _check_user_message, _check_llm_response, and the verdict precedence logic.
  - B3782 owns NomaV2Guardrail and initialize_guardrail_v2 implementation details.
  - Framework CustomGuardrail base class, should_run_guardrail and add_standard_logging_guardrail_information_to_request_data are inherited methods.
pitfalls:
  - "The deprecation warning is module-level and emitted only once per process, not per NomaGuardrail instance. LiteLLM uses _LEGACY_NOMA_DEPRECATION_WARNED as a global flag set to True after the first warn() call."
  - "asyncio.create_task can raise RuntimeError if there is no running event loop. The background task creation must be guarded against this and log the error without raising."
  - "In monitor_mode, _check_user_message_background and _check_llm_response_background must not raise exceptions to the main flow; exceptions are logged only."
  - "block_failures controls error handling for API failures: when true, raise the exception; when false, log and allow the request to proceed. This is per-call behavior, not per-instance."
  - "stream_chunk_builder returns ModelResponse or TextCompletionResponse or None depending on the stream content. Only ModelResponse is scanned; other types and None cause the original chunks to be yielded unchanged."
  - "MockResponseIterator yields the chunks of a ModelResponse; it must be imported from litellm.llms.base_llm.base_model_iterator."
