id: B9998
title: Vector store registries for Shared, their config and database loading and the startup wiring
description: >-
  LiteLLM keeps two vector store registries as module globals, litellm.vector_store_registry and
  litellm.vector_store_index_registry, both None at import (litellm/__init__.py L1517-L1518). The vector_store_registry
  block of config.yaml creates the store registry and loads it before the server starts (_init_non_llm_configs,
  L7080-L7089), and the database loaders create either one on the first rows they read (L8872-L8913). B8614 ran config
  boot without vector stores: its BootRegistries answers the vector_store_registry key with an error that stops
  startup, B8384's sync runs nothing at the vector_stores and vector_store_indexes positions, and neither B8613 nor
  B8610 makes or holds the registries. This task builds the one value the server holds, fills it from config and the
  database the way LiteLLM does, hands it to Shared, and replaces each of those stubs.


  Server side, module `server_registries::vectors`: crates/betterlite-server/src/server_registries/vectors.rs and
  server_registries/vectors/. Add `pub mod vectors;` to server_registries.rs, which B8614 wrote. `VectorStores` holds
  B1062's store registry and index registry (read core::api::vector_store_registry for the merged type names), each an
  Option behind a std RwLock, None until a loader creates it, so a reader can still tell "no registry" from "an empty
  registry" as LiteLLM's `is None` checks do (B8641's has_store_registry and has_index_registry answer from this).
  `VectorStores::new()` (pub, the binary calls it) starts with both None. Give it read and write access that keeps the
  None case visible, for the loaders here and for B1063's tool selection, B8641's adapters and the vector store routes.
  It cannot fail, so it has no error enum.


  Config boot, in B8614's crates/betterlite/src/boot_registries.rs. BootRegistries gains `vectors: Arc<VectorStores>`,
  which BootRegistries::new takes as its last argument. The `vector_stores` stub becomes real, as L7080-L7089 do: when
  the store registry is None, create an empty one, then load the vector_store_registry list into it with B1062's config
  load. B1062's error maps into B8590's `ConfigBootError::Step` with step "vector_store_registry" and that error as
  source; entries loaded before a bad one stay, since B1062 appends one at a time. Delete B8614's
  `boot_unbuilt_vector_store_registry` test. When B9997 already replaced the MCP stubs, delete the NotBuilt variant
  too (and BootRegistryError with it when no variant is left); otherwise it stays for them. In
  docs/deviations/B8614.yaml drop vector_store_registry from the not-built row, and the row itself once no key is left.


  Database loading, in B8384's crates/betterlite/src/db_object_sync.rs. DbObjectSync gains the same
  Arc<VectorStores>, and sync_non_llm_objects runs two loaders at their LiteLLM positions, after policies and before
  mcp, each when B10054's should_load_db_object allows its kind. `init_vector_stores(db)` (vector_stores,
  L8872-L8889) reads the stores with B1062's database load over B726's repository; no rows returns and leaves the
  registry as it is, a None registry is created holding the rows, and an existing one gets each store through B1062's
  add, which keeps the first record of an id it already has. `init_vector_store_indexes(db)` (vector_store_indexes,
  L8891-L8913) does the same with B1062's index load, creating the index registry from the rows or upserting each
  index by name. Each catches its own error and logs
  "litellm.proxy.proxy_server.py::ProxyConfig:_init_vector_stores_in_db - {error}"; the index loader logs that same
  text, as LiteLLM does. Delete B8384's vector store row in docs/deviations/B8384.yaml.


  Startup, in B8613's crates/betterlite/src/lifespan.rs and lifespan/. At the registries step, make one
  `VectorStores::new()` next to the AgentRegistry and before load_non_llm_configs, and hand clones of that Arc to
  BootRegistries, to the one DbObjectSync the lifespan builds (read B8374's and B8613's merged code for where), and to
  Started as `vector_stores: Arc<VectorStores>`. In betterlite-server, B8610's StartupOutputs (server/inputs.rs) gains
  `vector_stores`, run_proxy copies it from Started, and Shared (state/shared.rs) gains `vector_stores:
  Arc<VectorStores>`, set from it in application(). Add the field to every Shared and StartupOutputs literal the tests
  in scope build. B8641's VectorRegistryAdapter and B097's RAG routes read `shared.vector_stores`.


  Tests. server_registries::vectors tests (names start with `vectors_`) assert both registries start None and a
  registry created through one clone is seen through another. boot_registries tests (in B8614's boot_registries/tests.rs, names start with `vectors_`)
  load a config with one vector store and assert the store registry now exists and holds it, and that an entry
  without vector_store_id returns B1062's error under the vector_store_registry step with the earlier entry kept.
  db_object_sync tests (names start with `vector_db_`) use in-memory repositories: empty tables leave both registries
  None, rows create them, an existing registry keeps its first record for a known id and upserts an index by name, a
  failing read is logged with LiteLLM's text and the next loader still runs, and a closed gate loads nothing. A shared
  test (`shared_vector_stores`) asserts Shared.vector_stores is Arc::ptr_eq with the StartupOutputs value, and a
  lifespan test (`handoff_vector_stores`) asserts BootRegistries, DbObjectSync and Started hold the same VectorStores.
  Counts: about 40 non-blank LiteLLM lines (the config block and the two database loaders). No oracle case: the
  routes that read the registries are mounted by the vector store and RAG route tasks, which add the cases.

  Pass-through vector adapters. B8641 writes no-vector-store adapters in crates/betterlite-server/src/app/pass_through/ports/vector.rs. Replace them with the real ones over this task's vector_stores field: VectorRegistryAdapter over B1062 (is_index, index by name) and B1063 (store by name), with has_index_registry and has_store_registry true only when that registry exists; VectorAccessAdapter with B10014's assert_user_can_access_vector_store and B1061's is_allowed_to_call_vector_store_endpoint (keep only its error) and B1060's assert_proxy_admin_for_vector_store_index_management with operation create, also backing B3623's VertexStoreAccess with B10014's get_litellm_managed_vector_store. Leave VectorProviderAdapter as B8641 wrote it: Milvus has no provider config there (has_config(Milvus) is false), so `/milvus/{endpoint}` keeps answering B3624's HTTP 500 "Unable to find Milvus vector store config." with no upstream call. B7892 replaces that Milvus arm with its MilvusProviderPorts after this task.
