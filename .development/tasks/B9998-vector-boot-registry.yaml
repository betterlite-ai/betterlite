  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L1517-L1518
    why: Both registries are None until something creates them.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7080-L7089
    why: The vector_store_registry config block creates the store registry when it is None, then loads the list.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L8243-L8262
    why: The vector_stores and vector_store_indexes positions in _init_non_llm_objects_in_db, each behind its own gate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L8872-L8913
    why: _init_vector_stores_in_db and _init_vector_store_indexes_in_db, with the empty-table return and the shared log text.
dod:
  - text: VectorStores holds both registries as None until a loader creates them, and every clone sees the same registries.
    proof: [vectors-registry-tests]
  - text: BootRegistries creates the store registry and loads vector_store_registry into it, returns B1062's error under the vector_store_registry step, and B8614's stub test is gone.
    proof: [vectors-boot-tests]
  - text: The database loaders leave the registries alone on empty tables, create them from the first rows, add stores and upsert indexes into existing ones, honour both gates and log each failure.
    proof: [vectors-db-tests]
  - text: Startup makes one VectorStores and the same Arc reaches BootRegistries, DbObjectSync, Started and shared.vector_stores.
    proof: [wiring-tests]
  - text: The existing boot, sync, lifespan, Shared and server tests still pass with the new fields.
    proof: [regressions]
checks:
  optional: []
  commands:
    - id: vectors-registry-tests
      why: a registry exists before any loader created it, or a clone holds a different registry
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server_registries::vectors::/)'
    - id: vectors-boot-tests
      why: a configured vector_store_registry still hits the stub, loads into a copy, or swallows B1062's error
      run: test -z "$(grep -rl boot_unbuilt_vector_store_registry crates/betterlite/src/boot_registries.rs crates/betterlite/src/boot_registries)" && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::tests::vectors_/)'
    - id: vectors-db-tests
      why: a database vector store loader is missing, creates an empty registry, replaces a known store, ignores its gate or stops the sync on an error
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^db_object_sync::.*::vector_db_/)'
    - id: wiring-tests
      why: startup builds a second VectorStores or Shared holds a different one than config boot and the database loaders fill
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^state::shared::tests::shared_vector_stores/)' && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^lifespan::.*::handoff_vector_stores/)'
    - id: regressions
      why: the new BootRegistries, DbObjectSync, Started, StartupOutputs or Shared field broke an existing boot, sync, lifespan, Shared, server or route test
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::tests::vectors_/)' && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::/) | test(/^db_object_sync::/) | test(/^lifespan::/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server_registries::/) | test(/^state::shared::/) | test(/^server::/) | test(/^routes::tests::/) | test(/^cost_service::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The registries, their config and database load functions, add, upsert and lookups: B1062. Tool selection over them: B1063. The vector store and RAG routes: their own tasks."
  - "The MCP registry and its loading: B9997. The other database loaders and their order: B8384."
  - "The Milvus arm of VectorProviderAdapter over MilvusProviderPorts: B7892, which runs after this task."
pitfalls:
  - The vector store loaders do nothing on an empty table; they never clear entries and never create an empty registry.
  - VectorStores::new must not create empty registries, since has_store_registry and has_index_registry answer false only while a registry is None.
  - The index loader logs the _init_vector_stores_in_db text too, as LiteLLM does; do not rename it to the index function.
  - Leaving boot_unbuilt_vector_store_registry behind keeps asserting the stub error this task removes.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
