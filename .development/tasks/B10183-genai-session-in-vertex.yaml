id: B10183
title: The GenAI SDK session, its provider config and its clients move to betterlite-vertex, and B9800's call steps take a route type
description: >-
  B7844 built everything B3489's generate content call needs around it inside betterlite-python, so only the Python package can make the call. The proxy needs the same call for the Google routes (B10178), and betterlite-server cannot depend on betterlite-python. This task moves the parts that do not touch pyo3 to a new module in betterlite-vertex, which already depends on betterlite-core and betterlite-config and which betterlite-server already depends on, so no crate cycle appears. Python keeps only the wire parse, the logging object it builds and the answer it hands to Python. Nothing changes in what a Python caller sees.


  Module. `genai::session` in betterlite-vertex: crates/betterlite-vertex/src/genai/session.rs and genai/session/ (provider.rs, clients.rs, call.rs, error.rs, tests.rs), beside B3480's genai_contract. Main already declares `pub mod session;` in genai.rs over an empty session.rs. Each item below moves from crates/betterlite-python/src/genai/ unchanged except where this text says so, and becomes `pub`; the old definition goes.

  - provider.rs takes `NativeContentConfig` with its GenerateContentProviderConfig and GenerateContentHttpConfig impls, `target`, `native_auth`, `lookup`, `native_request`, `gemini_key`, `configured_credentials` and `exposed_headers` (provider.rs L59-L250). The config gains one field, `aws: Arc<dyn AwsCredentialsSource>` (betterlite-vertex credential_sources/aws.rs L17), and `lookup` puts it in LoadDeps where it now builds `Arc::new(UnavailableAws)` (L198). `lookup` already takes five parameters, the clippy limit, so the owned parts it needs (vertex, google, clock and aws) travel in one private struct the closure in `target` (L131-L149) moves in. `UnavailableAws` (L49-L58) stays in the Python file, and the Python session passes `Arc::new(UnavailableAws)` into SessionParts, so the source is a constructor input and this task changes no credential behavior.
  - error.rs takes `GenaiConfigError` and its From impl (error.rs L15-L38). SessionError, NativeGenaiError and payload_error stay in Python, since they are pyo3 types.
  - clients.rs takes `NativeClients` with `verified_with` and its ClientSource impl (client.rs L13-L63). Its fields become `default: ProxiedClient` and `user_agent: String`, and `pub fn new(default: ProxiedClient, user_agent: String) -> Self` replaces `build`. verified_with takes the proxy policy from `self.default.policy` (betterlite-http proxy.rs L42) instead of a field of its own. The Python session keeps today's ProxyPolicy::resolve and ProxiedClient::outbound steps with their SessionError variants and passes the client to `new`.
  - call.rs takes `GenaiCall` and its `timeout` (convert.rs L20-L45) and the session's `request_of` (session.rs L194-L208) as `GenaiCall::request(&self, timeout: Option<Duration>) -> GenerateContentRequest<'_>`. timeout returns `Result<Option<Duration>, TryFromFloatSecsError>`, and Python's ConvertError::Timeout wraps that error where it calls it. GenaiCall keeps its Deserialize derive, so Python's parse still builds it from the wire text, and the proxy builds it field by field.
  - session.rs takes `Entry` with `call_type` (session.rs L48-L65), `logging_env` (logging.rs L55-L74, which now takes `sink: &'env dyn LogSink`), and `GenaiSession`, the part of GenaiCore that is not the wire: the fields environment, studio, vertex, schema, request_timeout, catalog, registry, known_model_names, custom_providers, capabilities, clients, clock and redactor (session.rs L72-L86) plus aws. `GenaiSession::new(parts: SessionParts) -> Self` takes a plain struct of those values. The session builds the registry (JSONProviderRegistry::load()), the empty name sets and the empty CatalogCapabilities the way build does today (L117-L123), so they are not in SessionParts. `config` and `resolution` (L166-L192) move as methods. `pub async fn run<Executor>(&self, request: &GenerateContentRequest<'_>, executor: &Executor, log: &mut LogContext<'_, '_>, entry: Entry) -> Result<GenerateContentAnswer<GenerateContentResponse>, GenerateContentFailure<GenaiConfigError, Executor::Error>>`, where Executor is B3489's `CompletionExecutor + Sync`, is today's deps assembly (L133-L153) followed by `dispatch` (L209-L225). The caller passes the executor, so Python passes AdapterUnavailable and the proxy passes its chat adapter.


  Python after the move. GenaiCore becomes `{ session: GenaiSession }` or is replaced by GenaiSession where the pyo3 classes hold it. `build` keeps the wire parse, the three Raw::convert calls, the litellm.api_key override (L94-L98), RequestTimeout::resolve, the redactor and the client steps, then calls GenaiSession::new with SystemClock, the bundled catalog and `Arc::new(UnavailableAws)`. `call` keeps the timeout, `logging_state`, the SilentSink, the payload_error mapping and `answered`, and calls `session.run(&request, &AdapterUnavailable, &mut log, entry)` in between. logging.rs keeps logging_state and SilentSink. Nothing stays in client.rs, so it goes with client/tests.rs and its `mod client;` line in genai.rs; its tests become the clients_ tests below.


  No module-level call counter. logging.rs mints call ids from `static NEXT_CALL` (L21) through next_call_id (L76-L79), and the rules forbid module-level state. Both go. GenaiCore holds `ids: Arc<dyn IdSource>` (betterlite-sdk call_wrapper/ports.rs L15), build sets it to completion's SystemIds (completion/ports.rs L46-L51; turn `mod ports;` in completion.rs into `pub(crate) mod ports;` so genai can reach it, and write no fourth uuid source), and logging_state takes `ids: &dyn IdSource` for litellm_call_id, function_id and the id function LoggingState::new asks for. The ids become uuid4 text, as LiteLLM's function_setup mints them; nothing reads the old betterlite-genai- prefix. logging/tests.rs's call_ids_are_distinct_and_prefixed becomes `logging_state_takes_its_ids_from_the_session`, which passes a fixed IdSource and checks the state's litellm_call_id.


  One user agent function. TlsPolicy::resolve reads LITELLM_USER_AGENT inline (crates/betterlite-config/src/tls.rs L76-L79), and betterlite-python holds three copies of that read as `fn user_agent` (genai/client.rs L64-L70, video_calls/clients.rs L67-L72, video_edits/session.rs L185-L191). Add `pub fn user_agent(environment: &BTreeMap<String, String>) -> String` to tls.rs with the same body, make resolve call it, delete the three copies and call it from the two video files and the Python genai session. The version in the fallback becomes betterlite-config's CARGO_PKG_VERSION; every crate takes the workspace version, so the text does not change.


  One tracing sink. The proxy call in B10196 needs a LogSink that writes LiteLLM's debug records to tracing, and two of the three copies of that sink sit in crates this task can reach: `TracingSink` in crates/betterlite-server/src/pass_through_logging/cohere_passthrough_logging/embedding.rs L158-L171 and crates/betterlite-provider/src/anthropic_dispatch/gateway/logging.rs L19-L31. Move it once to betterlite-logging as `pub struct TracingSink` next to LogSink in crates/betterlite-logging/src/logging_pre_post/env.rs, with the debug! call core's copy writes (level, fields, message) and its `#[cfg_attr(test, mutants::skip)]`, and point both files at it. The third copy, in crates/betterlite-core/src/api/passthrough_call/logging.rs L75-L89, sits in the folder B10164 and B10166 hold, so it stays for them.


  Route type in B9800's steps. B10178 runs the Google routes through B9800's call steps (crates/betterlite-server/src/messages_call.rs), which port route_request's generic branches and hold one messages-specific value, the ROUTE_TYPE constant (L23). Replace it with a `route_type: &'static str` field: `MessagesCallSteps::new` takes it as its first argument, and `standalone_routing(route_type, executor, dispatch)` (messages_call/standalone.rs L26) keeps it in StandaloneRouting for the not-found error at L101-L107. Every use of ROUTE_TYPE reads the field, so raise_if_required_body_param_missing and ProxyModelNotFoundError name the route the steps were built for. The UserConfig error text stays as it is. B081 builds the messages steps with "anthropic_messages", and messages_call's own tests pass that value and keep their assertions; add `steps_name_their_route_type_in_not_found`, which builds the steps with "agenerate_content" and checks the 400 detail starts with "agenerate_content: Invalid model name".


  Tests. genai/session/tests.rs takes gemini_key_reads_the_kwarg from python genai/provider/tests.rs and call_types_are_the_litellm_entry_names from session/tests.rs, and adds: `clients_keep_the_default_for_true_and_none` and `clients_build_a_new_client_for_false_and_a_path` (the ClientSource answer for ssl_verify None, true, false and a CA path, the new client carrying the user agent it was given), `request_reads_every_field` (GenaiCall::request maps each field and the timeout), `timeout_refuses_a_negative_number`, and `run_answers_the_mock_without_a_provider` (a session built from default settings with kwargs `{"mock_response": "probe"}` answers GenerateContentAnswer::Mock with "probe" in the first candidate's text, and the executor is never called). betterlite-config's tls tests gain `user_agent_reads_the_environment` and `user_agent_falls_back_to_the_crate_name`. The Python package's pytest suite for google_genai must pass unchanged.
scope:
  paths:
    - crates/betterlite-vertex/src/genai/session.rs
    - crates/betterlite-vertex/src/genai/session/**
    - crates/betterlite-python/src/genai.rs
    - crates/betterlite-python/src/genai/provider.rs
    - crates/betterlite-python/src/genai/provider/**
    - crates/betterlite-python/src/genai/client.rs
    - crates/betterlite-python/src/genai/client/**
    - crates/betterlite-python/src/genai/convert.rs
    - crates/betterlite-python/src/genai/convert/**
    - crates/betterlite-python/src/genai/session.rs
    - crates/betterlite-python/src/genai/session/**
    - crates/betterlite-python/src/genai/error.rs
    - crates/betterlite-python/src/genai/logging.rs
