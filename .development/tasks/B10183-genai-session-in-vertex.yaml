  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/main.py#L235-L301
    why: agenerate_content, the call the moved session runs; its keyword arguments are GenaiCall's fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/main.py#L393-L486
    why: agenerate_content_stream, the stream entry the session runs for Entry::AwaitStream.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/google_genai/transformation.py#L38-L300
    why: GoogleGenAIConfig, the class NativeContentConfig ports, with the auth lookup that reaches the Vertex credentials.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L142-L170
    why: get_default_headers, where LITELLM_USER_AGENT replaces the default User-Agent header.
dod:
  - text: NativeContentConfig, GenaiConfigError, NativeClients, GenaiCall, Entry, logging_env and the session's deps assembly live in betterlite-vertex's genai::session and nowhere in betterlite-python; the config takes its AWS source from its constructor.
    proof: [no-copies, session-tests]
  - text: The Python generate content functions answer as before, sync and async, streamed and not, errors included.
    proof: [python-genai, python-native]
  - text: LITELLM_USER_AGENT is read by one function in betterlite-config, and the three Python copies are gone.
    proof: [tls-tests, no-copies, python-native]
  - text: One TracingSink in betterlite-logging serves the Cohere pass-through logging and the Anthropic gateway logging.
    proof: [no-copies, sink-users]
  - text: The Python GenAI session mints its call ids through the IdSource it holds, and no module-level counter is left in genai.
    proof: [no-copies, python-native]
  - text: B9800's steps and standalone routing take the route type and name it in the not-found error, and /v1/messages chooses and answers as before.
    proof: [messages-tests]
checks:
  optional: [mutants]
  commands:
    - id: session-tests
      why: a moved part lost a branch, the clients ignore ssl_verify, the request drops a field or the session calls the executor on a mock
      run: grep -q 'fn run_answers_the_mock_without_a_provider' crates/betterlite-vertex/src/genai/session/tests.rs && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^genai::session::/)'
    - id: python-native
      why: the Python session no longer builds the moved parts the same way, or a video client lost its user agent
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^genai::/) | test(/^video_calls::/) | test(/^video_edits::/)'
    - id: python-genai
      why: a Python caller sees a different answer, stream, error or client behavior after the move
      run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_google_genai.py
    - id: tls-tests
      why: the shared user agent reads another name or falls back to other text, or resolve stopped using it
      run: grep -q 'pub fn user_agent' crates/betterlite-config/src/tls.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^tls::/)'
    - id: sink-users
      why: the Cohere pass-through logging or the Anthropic gateway logging broke when the sink moved
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::cohere_passthrough_logging::/)' && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^anthropic_dispatch::/)'
    - id: messages-tests
      why: the route type field changed what the messages steps choose or answer, or the not-found error still names anthropic_messages
      run: test -z "$(grep -n 'const ROUTE_TYPE' crates/betterlite-server/src/messages_call.rs)" && grep -q 'fn steps_name_their_route_type_in_not_found' crates/betterlite-server/src/messages_call/tests.rs crates/betterlite-server/src/messages_call/tests/*.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^messages_call::/)'
    - id: no-copies
      why: betterlite-python still defines a moved type or a call counter, or a user agent or tracing sink copy is left
      run: test -z "$(grep -rnE 'static NEXT_CALL|fn next_call_id|struct (NativeContentConfig|NativeClients|GenaiCall)\b|enum (GenaiConfigError|Entry)\b|fn (user_agent|logging_env|native_request|gemini_key|configured_credentials|exposed_headers|request_of)\(' crates/betterlite-python/src/genai crates/betterlite-python/src/video_calls/clients.rs crates/betterlite-python/src/video_edits/session.rs)" && test -z "$(grep -n 'struct TracingSink' crates/betterlite-server/src/pass_through_logging/cohere_passthrough_logging/embedding.rs crates/betterlite-provider/src/anthropic_dispatch/gateway/logging.rs)" && grep -qF 'Arc<dyn AwsCredentialsSource>' crates/betterlite-vertex/src/genai/session/provider.rs
oracle_cases: []
deviations: []
out_of_scope:
  - "The proxy's SDK call over this session and its router executors: B10196. The Google routes' GenerateContentDispatch: B10178."
  - "A production AWS credential source: B10176 builds the chain in the Python session and deletes its UnavailableAws, B10175 deletes the server's copy in vertex_embedding/executor.rs, and B10196's GoogleSdkCall passes the server's Shared.aws_credentials."
  - "TracingSink in crates/betterlite-core/src/api/passthrough_call/logging.rs L75-L89: B10164 and B10166 hold that folder; whichever lands last points it at betterlite-logging's sink."
  - "The Vertex token cache: the moved lookup still loads credentials on every call, as B7844 does."
pitfalls:
  - "Keep `AwsCredentialsSource` behind an Arc in the config, because lookup builds LoadDeps by value on every call and LoadDeps.aws is an `Arc<dyn AwsCredentialsSource>`."
  - "verified_with must keep the session's proxy policy, so a deployment with ssl_verify false still goes through HTTPS_PROXY; read it from the default client's `policy` field, not from a fresh ProxyPolicy::resolve."
  - "`env!(\"CARGO_PKG_VERSION\")` expands in the crate that holds the code, so the fallback text now comes from betterlite-config; check that crate's version is the workspace one before you rely on it."
  - "The pytest check builds the wheel first; a pyo3 class that held GenaiCore keeps its Python name, or the Python wrapper in crates/betterlite-python/python breaks."
  - "betterlite-logging's env.rs is shared by every logging caller; add the sink next to the trait and change nothing else there."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
