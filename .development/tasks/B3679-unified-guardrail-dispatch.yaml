id: B3679
title: Unified guardrail dispatch and stream emission primitives
description: >-
  Add the module `unified_dispatch` to betterlite-guardrails. It holds the pure pieces of LiteLLM's `UnifiedLLMGuardrails` that the hooks share: choosing the translation handler for a call, turning a block or an HTTP failure into the chunks a stream emits, building the synthetic delta chunk of the incremental transform, and reading flags and chunks. The hooks themselves (pre call, moderation, post call success, the streaming loops) are B3680 and B3681 and call everything here. Nothing in this task talks to a guardrail, a provider or the network, and nothing here is async.

  Types come from earlier tasks. `GuardrailValue` is from `betterlite_config::sections::guardrail_identity::item` (B3660). `GuardrailFailure` is B5471's failure enum, where `ModifyResponse` stands for LiteLLM's `ModifyResponseException`. The `BaseTranslation` trait, `StreamingScanKey` and `StreamTransformSink` are B3661's. The call type enum and `get_call_types_for_route` are B207's (betterlite-core routes). A stream item is a `serde_json::Value`: a chat chunk is an object, and a raw SSE frame is a JSON string. If B3661 fixed another item type, use B3661's and keep the same behavior.

  Files, all under crates/betterlite-guardrails/src/unified_dispatch/ and each owning its own error type if it can fail: `registry.rs`, `emit.rs`, `transform_chunk.rs`, `stream_items.rs`, `flags.rs`.

  registry.rs replaces `discover_guardrail_translation_mappings`, `load_guardrail_translation_mappings` and `get_guardrail_translation_mapping`. Nothing scans the file system. `TranslationRegistry<T: BaseTranslation>` is built from an explicit `Vec<TranslationEntry<T>>`, where `TranslationEntry<T> { call_type: <B207 call type>, translation: T, chat_completions: bool }`. `chat_completions` is true only for the OpenAI chat handler (LiteLLM maps `completion` and `acompletion` to it, and no other handler is a subclass). `TranslationRegistry::get(&self, call_type) -> Option<&TranslationEntry<T>>` returns the entry, and a later entry for the same call type replaces an earlier one, like `dict.update`. `resolve_endpoint_translation<'a, T>(registry: &'a TranslationRegistry<T>, request_route: Option<&str>, first_item: Option<&serde_json::Value>) -> Option<(CallType, &'a T)>` is `resolve_endpoint_translation`: when `request_route` is set and non-empty and `get_call_types_for_route` returns a non-empty list, the first call type wins. Otherwise the call type is inferred from `first_item` when there is one, and it is `None` when there is not. No call type, or a call type with no entry, gives `None`. `resolve_transform_call_type(registry, request_route: Option<&str>) -> Option<CallType>` is `_resolve_transform_call_type`. It needs a route, a non-empty call type list for it, and an entry for the first call type whose `chat_completions` is true. Anything else gives `None`, and the caller falls back to block only. `infer_call_type(kind: ResponseKind) -> Option<CallType>` is LiteLLM's `_infer_call_type` with no explicit call type: `ResponseKind` is an enum with `ChatCompletion` (a model response or a stream chunk), `Embedding`, `Transcription`, `Speech`, `Rerank`, `Image`, `TextCompletion`, `SendMessage` and `Other`, giving `completion`, `embedding`, `transcription`, `speech`, `rerank`, `image_generation`, `text_completion`, `send_message` and `None`. `ResponseKind::of_stream_item(item: &serde_json::Value) -> Self` is `ChatCompletion` for an object whose `object` is `chat.completion.chunk` and `Other` for everything else, because LiteLLM only types a `ModelResponseStream` as a chunk and treats bytes, strings and A2A dicts as unknown. `A2A_CALL_TYPES` is the two call types `asend_message` and `send_message`. `ensure_request_metadata(data: &mut BTreeMap<String, GuardrailValue>, user_metadata: BTreeMap<String, GuardrailValue>)` sets `litellm_metadata` to `user_metadata` only when the key is absent and `user_metadata` is not empty. The caller builds `user_metadata` with B3661's `transform_user_api_key_dict_to_metadata`.

  emit.rs. `StreamHttpError { status_code: u16, detail: HttpErrorDetail }` with `HttpErrorDetail { Text(String), Object(serde_json::Map<String, serde_json::Value>) }` stands in for FastAPI's `HTTPException`, because B5471's `GuardrailFailure::Http` holds only a string and the A2A chunk has to tell a dict detail from a text one. It implements `std::error::Error`, and Display prints the text or the JSON of the object. `handle_streaming_block(translation: &T, failure: GuardrailFailure, stream_started: bool, responses_so_far: &[serde_json::Value]) -> Result<Vec<serde_json::Value>, GuardrailFailure>` is `handle_streaming_block`. It calls the translation's `build_block_sse_chunks` with the failure, `stream_started` and the items, and returns the chunks in order. When that returns `None` it gives back `Err(failure)`, which is LiteLLM's `raise exc`. The callers set `original_response` before they call it (B3680 and B3681), so this function never touches it. `emit_streaming_http_error(call_type: Option<CallType>, error: StreamHttpError, responses_so_far: &[serde_json::Value], request_data: &BTreeMap<String, GuardrailValue>, translation: Option<&T>, stream_started: bool, responses_yielded: Option<&[serde_json::Value]>) -> Result<Vec<serde_json::Value>, StreamHttpError>` is `emit_streaming_http_error`. Order of checks: an A2A call type returns one item, the JSON-RPC error object below. Next, when `stream_started` is true and a translation is given, it calls `build_stream_error_items` with the error and with `responses_yielded` (not `responses_so_far`) as the items already sent, and returns the items when the translation gives some. Otherwise it returns `Err(error)`. `a2a_request_id(responses_so_far: &[serde_json::Value], request_data: &BTreeMap<String, GuardrailValue>) -> serde_json::Value` is `_get_a2a_request_id`. It walks the items. An object item with an `id` key returns that value (null included) at once. A string item is trimmed and parsed as JSON, and an object with an `id` key returns it, while a parse failure or any other result moves on to the next item. After the loop it reads `body` from `request_data`, or `data` when `body` is missing or empty, and an object body returns its `id`, or null when there is none. The answer is null when nothing was found. `a2a_jsonrpc_error_chunk(error: &StreamHttpError, request_id: serde_json::Value) -> serde_json::Value` returns `{"jsonrpc": "2.0", "id": request_id, "error": {"code": -32603, "message": ..., "data": {...}}}`. For an object detail, `message` is its `error` value when the key exists, else its `message` value when that exists, else the detail's JSON text. For a text detail the detail becomes `{"message": text}` first. `data` holds every key of the detail except `error` and `message`.

  transform_chunk.rs is `_build_transform_chunk`. `build_transform_chunk(input: TransformChunkInput<'_>) -> Result<Option<serde_json::Value>, StreamHttpError>`, with `TransformChunkInput { reference_chunk: &Value, mutated_text_per_choice: &IndexMap<i64, String>, emitted_text_per_choice: &mut IndexMap<i64, String>, holdback_per_choice: &IndexMap<i64, i64>, finish_reason_per_choice: &IndexMap<i64, Option<String>>, held_chars_per_choice: &mut IndexMap<i64, i64>, is_final: bool }`. If B3661 gave `StreamTransformSink` other map types, follow it, but iterate the mutated texts in the sink's own order, because that order sets the order of choices in the output. The output chunk copies `id`, `created` and `model` from the reference chunk (missing ones are null, and the serializer then makes a fresh id and time as LiteLLM's `ModelResponseStream` does), has `object` set to `chat.completion.chunk`, and its choices are objects `{index, finish_reason, delta: {content, role, tool_calls: null}}`. Two paths. With no mutated texts: on the final round, each choice in `finish_reason_per_choice` that has a reason becomes a terminator choice with `content` empty text, `role` null and that reason, and the chunk is returned when there is at least one; otherwise `None`. With mutated texts, per choice: `already` is the emitted text (empty when missing), and if the mutated text does not start with `already` the function returns `StreamHttpError { 400, Object({"error": "stream_transform_underflow", "message": ...}) }` with the exact message in the references. Otherwise `holdback` is 0 on the final round and `max(0, holdback_per_choice[idx])` (0 when missing) before it, `end = max(len(already), len(text) - holdback)`, the delta is `text[len(already)..end]` and `held_chars_per_choice[idx] = len(text) - end`. All lengths and slices count Unicode characters, never bytes. Then every mutated choice, in order: its `finish_reason` is the reason from `finish_reason_per_choice` on the final round and null before it, a choice with an empty delta and no reason is skipped, and `role` is `assistant` when the choice's emitted text is empty or missing and null otherwise. When no choice survives the function returns `None`. Only then are the emitted texts extended with the deltas, for every mutated choice. A `None` result still leaves `held_chars_per_choice` updated. An empty text as `finish_reason` counts as no reason, like `StreamingChoices`.

  stream_items.rs holds the chunk readers, each over one `&serde_json::Value`. `chunk_choices(item) -> &[serde_json::Value]` is `_chunk_choices`: the `choices` array, and an empty slice when the item is not an object, has no `choices` or has a non-array. A choice's index is its `index` when it is an integer and 0 otherwise (null counts as 0, like `index or 0`). `chunk_has_tool_calls`, `chunk_carries_text` (any choice with a non-empty string `delta.content`), `chunk_has_finish_reason` (any choice whose `finish_reason` is not null) and `is_trailing_metadata_chunk` (no choices, or a non-null `usage` with no text and no finish reason) are the same-named LiteLLM predicates. `trailing_metadata_chunks(items) -> Vec<&Value>` keeps the matching items in order. `record_finish_reasons(item, finish_reason_per_choice: &mut IndexMap<i64, Option<String>>)` stores each non-null `finish_reason` under the choice index. `tool_call_passthrough_chunk(item, finish_reason_per_choice: Option<&mut IndexMap<i64, Option<String>>>, held_choices: &BTreeSet<i64>) -> serde_json::Value` copies a tool call chunk with the text taken out: `id`, `created`, `model`, `object`, and per choice `index`, `delta {content: null, role, tool_calls}` and a finish reason. A choice whose delta has text, or whose index is in `held_choices`, and that has a finish reason, and when the map is given, stores the reason in the map and sends null in the chunk. Every other choice keeps its own reason. `held_choices(held_chars_per_choice) -> BTreeSet<i64>` is the indexes with more than zero held characters.

  flags.rs. `resolve_streaming_flag(attribute: Option<&GuardrailValue>, guardrail_config: Option<&BTreeMap<String, GuardrailValue>>, optional_params: &BTreeMap<String, GuardrailValue>, name: &str, default: &GuardrailValue) -> GuardrailValue` follows `resolve_streaming_flag`, later source wins: the default, then the guardrail's own attribute (`None` when it has none), then the key in `guardrail_config`, then the key in the callback's `optional_params`. A key that is present with a null value still wins, because LiteLLM uses `dict.get(name, previous)`. `is_redundant_scan(scan_key: Option<&StreamingScanKey>, last_scan_key: Option<&StreamingScanKey>) -> bool` is false for no key, else true when the two keys are equal or the key has nothing to scan, using B3661's equality and `has_nothing_to_scan`.

  The oracle helper for this task runs the same inputs through LiteLLM's own functions and compares results. Cases give chunks with fixed `id` and `created`, so the generated ones never differ.

