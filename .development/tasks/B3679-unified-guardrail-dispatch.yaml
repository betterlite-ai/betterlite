deviations:
  - what: The translation handlers come from an explicit `TranslationRegistry` built at startup, not from scanning the llms packages for `guardrail_translation_mappings`.
    why: The code rules forbid auto-discovery. The set of handlers is the same, and a caller lists them.
  - what: "`handle_streaming_block` and `emit_streaming_http_error` return a list of chunks, where LiteLLM yields them from an async generator."
    why: Both only call synchronous translation methods, so the caller sees the same chunks in the same order. A caller that streams sends them one by one.
  - what: A stream item that is not a JSON object has no choices, and an A2A chunk is a JSON object or string.
    why: LiteLLM reads attributes of `ModelResponseStream` objects. Rust has one JSON item type, and `object` equal to `chat.completion.chunk` marks the chat chunks.
  - what: The error detail is `HttpErrorDetail` (text or object), and the fallback message of an object detail with neither `error` nor `message` is the detail's JSON text.
    why: LiteLLM prints the Python dict repr there, and docs/compatibility.md leaves repr text out.

out_of_scope:
  - "B3680 owns async_pre_call_hook, async_moderation_hook, async_post_call_success_hook, __init__, _run_incremental_transform_stream, _emit_transform_round, _inspect_full_response_for_block, _emit_stream_tail and the _StreamTerminated signal. They call this task's functions and set `original_response` on a block before calling handle_streaming_block."
  - "B3681 owns async_post_call_streaming_iterator_hook, the buffering and sampling logic and guardrail_initializers.py. It calls resolve_streaming_flag, is_redundant_scan and resolve_transform_call_type."
  - "The _EndpointTranslation Protocol and _as_endpoint_translation only narrow Python types. B3661's BaseTranslation trait is the contract here."
  - "GUARDRAIL_NAME ('unified_llm_guardrails') has no caller at the pin, so it is not built."
  - "B5471 owns ModifyResponseException (GuardrailFailure::ModifyResponse), SensitiveDataRouteException and GenericGuardrailAPIInputs (GuardrailApiInputs). B3664 owns the GuardrailInvocation records. This task only passes them through."
  - "B207 owns get_call_types_for_route and the call type enum. B3661 owns StreamTransformSink, StreamingScanKey, BaseTranslation, build_block_sse_chunks and build_stream_error_items, and transform_user_api_key_dict_to_metadata."
  - "The per-handler translation bodies (B3667 to B3669 chat, B3670 to B3676 Responses and Anthropic) and the stream item helpers of B3663 are not rebuilt here."
  - "B010 and B1687 list discover_guardrail_translation_mappings in llms/__init__.py but no task builds it. The explicit TranslationRegistry in this task is its replacement, and B3680 or the architect's startup code fills it."
  - "The non-stream branches of _infer_call_type for Python response classes beyond ResponseKind (duck typing, subclasses) follow docs/compatibility.md and are left out."

pitfalls:
  - "`emit_streaming_http_error` passes `responses_yielded`, not `responses_so_far`, to `build_stream_error_items`. The error frame must reflect only what the client received."
  - "`emit_streaming_http_error` returns the A2A error even when the stream has not started, since the A2A branch is checked before `stream_started`."
  - "An object item with an `id` key ends the A2A id search even when the id is null, so a later item with a real id is not used."
  - "`_ensure_litellm_metadata` writes nothing when the key exists, even if its value is empty, and writes nothing when the user metadata is empty."
  - "In `build_transform_chunk` the role is `assistant` when the choice's emitted text is empty, so a choice whose first delta was an empty string gets the role again on the next chunk."
  - "`held_chars_per_choice` is updated before the function decides it has nothing to return, so a `None` result can still carry new held counts."
  - "The emitted texts are extended only for a returned chunk, and for every mutated choice, including one that was skipped for having no delta."
  - "The underflow check runs on every mutated choice before any chunk is built, so one bad choice fails the whole round and nothing is emitted."
  - "A text slice by byte offset breaks on multibyte text. Python counts code points, so use `chars()` for the length, the cut and the holdback."
  - "`tool_call_passthrough_chunk` defers a choice's finish reason only when the map is given. With no map, a choice with text still sends its reason."
  - "`is_trailing_metadata_chunk` is true for a chunk with `usage` and no text and no finish reason even when its choices array is not empty, so a usage chunk with an empty delta is replayed at the end."
  - "A stream item that is a string or bytes frame has no choices, so every predicate returns false for it except `is_trailing_metadata_chunk`, which is true."
  - "`resolve_streaming_flag` takes a present key with a null value over the lower sources. Do not use `Option::or` to merge them."
  - "The transform path is chosen from the route alone, before any chunk arrives. A request with no route never uses it, whatever the first chunk looks like."
