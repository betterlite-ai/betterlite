dod:
  - text: A route that maps to call types selects the first one, a missing route falls back to inferring from the first item, and an unmapped or unresolvable call type gives None.
    proof: [dispatch-tests, oracle-cases]
  - text: resolve_transform_call_type returns a call type only for a route whose first call type is completion or acompletion and has a chat completions entry, and None for any other route or handler.
    proof: [dispatch-tests]
  - text: infer_call_type maps each ResponseKind as the table says, and of_stream_item calls only an object with object `chat.completion.chunk` a chat completion.
    proof: [dispatch-tests]
  - text: ensure_request_metadata sets `litellm_metadata` only when absent and non-empty, and a request that already has the key keeps it.
    proof: [dispatch-tests]
  - text: handle_streaming_block returns the translation's chunks in order and gives back the failure when the translation returns None.
    proof: [emit-tests]
  - text: emit_streaming_http_error returns the A2A error object for an A2A call type, the translation's error items (built from the yielded items) only when the stream started, and gives back the error in every other case.
    proof: [emit-tests, oracle-cases]
  - text: a2a_request_id finds the id in an object item, a JSON string item, the `body` and then the `data` of the request, and gives null when none has one.
    proof: [a2a-tests, oracle-cases]
  - text: a2a_jsonrpc_error_chunk builds code -32603, takes the message from `error` then `message` then the detail text, and puts every other detail key in `data`.
    proof: [a2a-tests, oracle-cases]
  - text: build_transform_chunk emits only the new text past what was sent, keeps back the holdback characters until the final round, counts characters and not bytes, and reports the held count.
    proof: [transform-chunk-tests, oracle-cases]
  - text: build_transform_chunk returns the stream_transform_underflow 400 when a mutated text does not start with the text already sent.
    proof: [transform-chunk-tests, oracle-cases]
  - text: build_transform_chunk builds the terminator chunk on the final round when there is no text, sets role assistant only on a choice's first delta, skips choices with nothing to say and returns None when none is left.
    proof: [transform-chunk-tests, oracle-cases]
  - text: The chunk predicates and trailing metadata selection match LiteLLM on chunks with no choices, usage only, text, tool calls and finish reasons.
    proof: [stream-item-tests, oracle-cases]
  - text: tool_call_passthrough_chunk removes text, defers the finish reason of a choice that has text or is held and records it in the map, and keeps the reason of other choices.
    proof: [stream-item-tests, oracle-cases]
  - text: resolve_streaming_flag applies default, attribute, config and optional params in that order, and a present null wins, and is_redundant_scan matches LiteLLM for none, equal and empty keys.
    proof: [flag-tests, oracle-cases]
  - text: The helper adapter lints and type checks, and its new cases replay through the shared parser.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: dispatch-tests
      why: registry lookup, route and item resolution, the transform call type rule, inference or request metadata are wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^unified_dispatch::tests::dispatch_/) - test(replays_the_helper_case_corpus)'
    - id: emit-tests
      why: block chunks or the HTTP error emission rules are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^unified_dispatch::tests::emit_/)'
    - id: a2a-tests
      why: the A2A request id search or the JSON-RPC error object is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^unified_dispatch::tests::a2a_/)'
    - id: transform-chunk-tests
      why: the incremental delta chunk, its holdback, its terminator or the underflow error is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^unified_dispatch::tests::transform_chunk_/)'
    - id: stream-item-tests
      why: a chunk predicate, the trailing metadata selection or the tool call passthrough is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^unified_dispatch::tests::stream_item_/)'
    - id: flag-tests
      why: flag precedence or the redundant scan rule is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^unified_dispatch::tests::flag_/)'
    - id: oracle-cases
      why: the helper cases disagree with LiteLLM or are missing
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/unified-guardrail-dispatch)" &&
        cargo run --locked -p betterlite-oracle -- tools/oracle/cases/helpers/unified-guardrail-dispatch
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3679)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3679 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3679/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added dispatch cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/unified_dispatch-*")" &&
        grep -lE '^[[:space:]]+b3679:' tools/oracle/fuzz/corpus/helper_case/unified_dispatch-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

