id: B563
title: Foundry Anthropic chat transport
description: >-
  Add FoundryAnthropicChat as a small transport/auth override over native Anthropic mapping and stream services.
  Preserve extra_body promotion, billing-header stripping and Azure credential handling; do not copy the Anthropic
  prompt/response transformations. Attach explicit api-key to x-api-key conversion only for the native messages
  request.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/anthropic/handler.py:
  AzureAnthropicChatCompletion.__init__ L30-L31; AzureAnthropicChatCompletion.completion L33-L222. litellm/llms/azure_ai/anthropic/transformation.py:
  _promote_extra_body_to_optional_params L13-L28; AzureAnthropicConfig.custom_llm_provider L39-L40; AzureAnthropicConfig.should_strip_billing_metadata
  L42-L43; AzureAnthropicConfig.validate_environment L45-L107; AzureAnthropicConfig.transform_request L109-L136.


  Reuse BaseAzureLLM._base_validate_azure_environment from B531 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicError.__init__ from B567 (litellm/llms/anthropic/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse process_anthropic_headers from B570 (litellm/llms/anthropic/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse make_sync_call from B689 (litellm/llms/anthropic/chat/handler.py); its implementation remains with that
  prerequisite.


  Implement crates/betterlite-foundry/src/anthropic.rs with adjacent tests under anthropic/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation foundry_anthropic in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_cases in betterlite-foundry with these exact named cases (one per oracle file):
  foundry_anthropic_url, azure_key_header, entra_bearer_header, extra_body_promotion, billing_metadata_stripped,
  chat_stream_native_events. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream
  request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_anthropic* using HelperCase: kind: helper
  and the externally tagged foundry_anthropic variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_foundry_anthropic that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 268 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 493 planned, 500 maximum changed lines.
