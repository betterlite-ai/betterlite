  - mutants
  commands:
  - id: case-foundry-anthropic-url
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-anthropic/foundry-anthropic-url.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_foundry_anthropic_url$/)'
  - id: case-azure-key-header
    why: For dict params inject truthy explicit key only if api_key key is absent (present None blocks); for typed
      params fill a falsey key. B2200 resolves Azure auth. Generate B570 Anthropic headers with explicit api_key
      or empty string, then merge Azure/caller headers last, preserving x-api-key plus api-key when both exist.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_azure_key_header$/)'
  - id: case-entra-bearer-header
    why: Apply the same B2200 token precedence and failures as native Azure validation; Azure Authorization overrides
      a generated header. anthropic-version is filled as 2023-06-01 only when the exact key is absent, so empty/present
      caller values survive.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_entra_bearer_header$/)'
  - id: case-extra-body-promotion
    why: Promote only a nonempty dict extra_body, overwrite duplicate top-level options with its values, then remove
      extra_body even if it appeared inside itself. Empty/non-dict extra_body remains until post-parent cleanup
      removes extra_body/max_retries/stream_options from the body.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_extra_body_promotion$/)'
  - id: case-billing-metadata-stripped
    why: custom_llm_provider is azure_ai and should_strip_billing_metadata is true for the inherited request mapper.
      Probe B568 cache_control/computer/MCP/PDF/file-id and B570 caller anthropic-beta set; this override does not
      pass effort, eager-input, context-management or advanced-tool flags to get_anthropic_headers.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_billing_metadata_stripped$/)'
  - id: case-chat-stream-native-events
    why: Deep-copy messages/options, pop stream=None, json_mode=False and is_vertex_request=False. Only literal
      True enables async or stream branches; async stream accepts only AsyncHTTPHandler clients, sync nonstream
