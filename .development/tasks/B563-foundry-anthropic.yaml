checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-anthropic-url
    why: The foundry-anthropic-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_foundry_anthropic_url$/)'
  - id: case-azure-key-header
    why: The azure-key-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_azure_key_header$/)'
  - id: case-entra-bearer-header
    why: The entra-bearer-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_entra_bearer_header$/)'
  - id: case-extra-body-promotion
    why: The extra-body-promotion behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_extra_body_promotion$/)'
  - id: case-billing-metadata-stripped
    why: The billing-metadata-stripped behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_billing_metadata_stripped$/)'
  - id: case-chat-stream-native-events
    why: The chat-stream-native-events behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_cases::case_[0-9]+_chat_stream_native_events$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_anthropic.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_anthropic*")"
      && grep -lq 'foundry_anthropic' tools/oracle/fuzz/corpus/helper_case/foundry_anthropic* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_anthropic$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
