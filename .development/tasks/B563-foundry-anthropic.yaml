id: B563
title: Foundry Anthropic chat transport
description: >-
  Add FoundryAnthropicChat as a small transport/auth override over native Anthropic mapping and stream services.
  Preserve extra_body promotion, billing-header stripping and Azure credential handling; do not copy the Anthropic
  prompt/response transformations. The chat override retains Azure api-key and the Anthropic x-api-key simultaneously;
  the separate B564 native Messages override renames only when x-api-key is absent.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/anthropic/handler.py:
  AzureAnthropicChatCompletion.__init__ L30-L31; AzureAnthropicChatCompletion.completion L33-L222. litellm/llms/azure_ai/anthropic/transformation.py:
  _promote_extra_body_to_optional_params L13-L28; AzureAnthropicConfig.custom_llm_provider L39-L40; AzureAnthropicConfig.should_strip_billing_metadata
  L42-L43; AzureAnthropicConfig.validate_environment L45-L107; AzureAnthropicConfig.transform_request L109-L136.


  Reuse BaseAzureLLM._base_validate_azure_environment from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicError.__init__ from B567 (litellm/llms/anthropic/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse process_anthropic_headers from B570 (litellm/llms/anthropic/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse make_sync_call from B689 (litellm/llms/anthropic/chat/handler.py); its implementation remains with that
  prerequisite.


  Named case contracts: azure_key_header: For dict params inject truthy explicit key only if api_key key is absent
  (present None blocks); for typed params fill a falsey key. B2200 resolves Azure auth. Generate B570 Anthropic
  headers with explicit api_key or empty string, then merge Azure/caller headers last, preserving x-api-key plus
  api-key when both exist. entra_bearer_header: Apply the same B2200 token precedence and failures as native Azure
  validation; Azure Authorization overrides a generated header. anthropic-version is filled as 2023-06-01 only when
  the exact key is absent, so empty/present caller values survive. extra_body_promotion: Promote only a nonempty
  dict extra_body, overwrite duplicate top-level options with its values, then remove extra_body even if it appeared
  inside itself. Empty/non-dict extra_body remains until post-parent cleanup removes extra_body/max_retries/stream_options
  from the body. billing_metadata_stripped: custom_llm_provider is azure_ai and should_strip_billing_metadata is
  true for the inherited request mapper. Probe B568 cache_control/computer/MCP/PDF/file-id and B570 caller anthropic-beta
  set; this override does not pass effort, eager-input, context-management or advanced-tool flags to get_anthropic_headers.
  chat_stream_native_events: Deep-copy messages/options, pop stream=None, json_mode=False and is_vertex_request=False.
  Only literal True enables async or stream branches; async stream accepts only AsyncHTTPHandler clients, sync nonstream
  only HTTPHandler clients. Sync stream delegates B689 and stamps provider azure_ai plus B570 mapped response headers;
  async/nonstream use the inherited services. chat_failure_projection: Sync nonstream passes timeout to client construction
  and POST; exception status defaults 500, message prefers response.text over exception.text over str(error), headers
  prefer exception.headers then response.headers only when the response is truthy. Raise B567 AnthropicError without
  changing status; successful response delegates the native parent projection.


  Write standalone Rust test anthropic_chat_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test anthropic_chat_secret_safe_failure in betterlite-foundry: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B2201. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-foundry/src/anthropic.rs with adjacent tests under anthropic/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation foundry_anthropic in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_cases in betterlite-foundry with these exact named cases (one per oracle file):
  foundry_anthropic_url, azure_key_header, entra_bearer_header, extra_body_promotion, billing_metadata_stripped,
  chat_stream_native_events, chat_failure_projection. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_anthropic* using HelperCase: kind: helper
  and the externally tagged foundry_anthropic variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_foundry_anthropic that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 268 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 220 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 645 planned, 650 maximum changed lines.
