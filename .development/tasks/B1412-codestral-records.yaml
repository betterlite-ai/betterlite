id: B1412
title: Codestral FIM options, text replies and chunk decoding
description: >-
  Implement codestral_records in betterlite-openai from the complete completion
  transformation, handler response/protocol records, TextCompletionCodestralError and
  process_text_completion_response. Config defaults remain absent, including top_p/stop
  supplied only by a configured caller. The mapper supports suffix, temperature, top_p,
  max tokens, stream, seed and stop; it also maps min_tokens although that field is not
  advertised. seed becomes random_seed, max token spellings overwrite in encounter order,
  and stream only passes when literally true. Reuse B2237 text defaults/records without
  importing the executable provider dispatcher.

  For ordinary replies log post_call before checking status, require exactly HTTP 200,
  and map JSON parse failure to TextCompletionCodestralError 422. Project every choice's
  message.content to text, retaining index/finish_reason/logprobs and top-level id/created/
  model/usage/object. Do not apply the unused output_parser: ChatML marker strings survive.
  Preserve the native error's synthetic POST request URL when no request is supplied.
  For chunks, reuse B005 SSE prefix stripping, trim whitespace and return unfinished empty
  output for blank, [DONE], invalid JSON or empty choices. Validate the original stream
  object before testing choices, then use only its first choice; a non-None finish_reason
  sets is_finished and carries logprobs, including an empty-string finish reason. Keep the
  original chunk on nonempty results. Add bounded decode_codestral_reply and
  decode_codestral_chunk, a tagged codestral_record fuzz target and replay. Helper
  codestral_records calls these transformations with fixture response wrappers and records
  post_call ordering; no transport is invoked. Owned count is 111 transformation lines
  plus 107 handler record/reply lines; plan 230 code, 180 tests, 110 adapters and 100
  fuzz/wiring lines within 675.
scope:
