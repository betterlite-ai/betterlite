id: B992
title: Claude plugin write
description: >-
  Implement marketplace plugin create/update/enable/disable/delete against the pinned Prisma plugin table. Reuse
  source validation and admin checks; preserve name-conflict responses and the source order of individual record
  updates without downloading plugin contents.


  Implement crates/betterlite-server/src/api/claude_plugin_write.rs, crates/betterlite-core/src/api/claude_plugin_write.rs.
  Use ClaudePluginWriteInput and ClaudePluginWriteResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /claude-code/plugins; PUT /claude-code/plugins/{plugin_name};
  POST /claude-code/plugins/{plugin_name}/enable; POST /claude-code/plugins/{plugin_name}/disable; DELETE /claude-code/plugins/{plugin_name}.
  Each alias is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts
  its child factories without re-registering their methods/paths.


  Extraction uses the typed path/query/body records named by the owned handler signatures.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): claude_code_marketplace.py:334 status_code=400, exception_detail=FastAPI detail object; claude_code_marketplace.py:385
  status_code=500, exception_detail=FastAPI detail object; claude_code_marketplace.py:655 status_code=404, exception_detail=FastAPI
  detail object; claude_code_marketplace.py:672 status_code=500, exception_detail=FastAPI detail object; claude_code_marketplace.py:704
  status_code=404, exception_detail=FastAPI detail object; claude_code_marketplace.py:721 status_code=500, exception_detail=FastAPI
  detail object; claude_code_marketplace.py:753 status_code=404, exception_detail=FastAPI detail object; claude_code_marketplace.py:767
  status_code=500, exception_detail=FastAPI detail object. Compare the actual source status, error type, param and
  code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions plugin_create, plugin_name_conflict, plugin_update_source, plugin_disable_enable,
  plugin_delete_missing, route_aliases, auth_missing, auth_invalid under api::claude_plugin_write::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: register_plugin
  (L283-L388); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: update_plugin
  (L533-L626); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: enable_plugin
  (L634-L675); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: disable_plugin
  (L683-L724); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: delete_plugin
  (L732-L770). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 214 owned nonblank/non-comment/non-docstring Python lines (298 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 234 implementation,
  88 behavior tests, 96 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 456 total within the 460-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B726 (Managed
  resources and transaction repositories), B858 (Typed managed-resource and analytics rows), B1140 (Claude plugin
  and skill policy), B003 (HTTP server, health routes and master key auth), B756 (Authentication header selection
  and mode dispatch), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces and Postgres test
  fixture). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
