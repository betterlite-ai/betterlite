id: B982
title: Messages native call
description: >-
  Execute native Anthropic Messages through B027 and B014, selecting native/chat/Responses bridging from prepared
  deployment capabilities. Apply pre-request interceptors as closed typed outcomes and validate metadata before
  transport; B119 supplies later interceptor implementations and cannot be a dependency because it consumes this
  API.


  The dispatcher anthropic_messages_handler calls B1118 native execution. get_messages_interceptors (B987) and anthropic_messages_with_mcp
  (B988) are injected seams composed by B081 in pinned order; neither lower native execution nor this dispatcher
  imports the parent routes. Validate metadata before transport.


  MCP expansion is an injected native MessagesDispatch::Mcp outcome selected by the B081 composer, not a direct
  import of B988 from this lower dispatcher. The composer executes the MCP loop in handler.py:529-L562 order, then
  resumes the base executor with the trusted skip flag.


  Implement crates/betterlite-core/src/api/messages_native_call.rs. Use MessagesNativeCallInput and MessagesNativeCallResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions chat_bridge_selection, responses_bridge_selection, metadata_validation
  under api::messages_native_call::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.use_chat_completions_url_for_anthropic_messages
  defaults to false; env.DEFAULT_MAX_TOKENS defaults to 4096. No environment reads occur outside betterlite-config.
  Test api::messages_native_call::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesNativeCall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_native_call: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/messages/handler.py: _bridges_to_responses_api (L50-L54);
  litellm/llms/anthropic/pass_through/messages/handler.py: _responses_mode_is_lost_by_prefix_strip (L57-L70); litellm/llms/anthropic/pass_through/messages/handler.py:
  _should_route_to_responses_api (L73-L89); litellm/llms/anthropic/pass_through/messages/handler.py: _deployment_passes_through_anthropic_messages
  (L92-L102); litellm/llms/anthropic/pass_through/messages/handler.py: _deployment_supports_cache_control_ttl (L105-L106);
  litellm/llms/anthropic/pass_through/messages/handler.py: validate_anthropic_api_metadata (L411-L420); litellm/llms/anthropic/pass_through/messages/handler.py:
  anthropic_messages_handler (L423-L675). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 244 owned nonblank/non-comment/non-docstring Python lines (267 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 264 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 514 total within the 520-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B961 (Messages native prepare), B962 (Messages thinking), B963 (Messages
  options), B974 (Messages chat call), B979 (Messages native stream), B985 (Messages response call), B1087 (Api
  boundaries), B1118 (Messages native execution), B570 (Anthropic request headers and model discovery), B948 (Responses
  mcp selection), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
