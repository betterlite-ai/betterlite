id: B4417
title: Read, write, delete and verify Vault secret rotations
description: >-
  Implement Vault KV v2 secret read, write, delete and rotation operations using the authentication
  and target resolution from B4416.

  Export async_read_secret and sync_read_secret to retrieve a secret from Vault by name.
  Both check the URL-keyed body cache first, returning the cached secret value if present.
  If not cached, they build the secret target (URL, data_key, secret_name), issue a GET request
  with Vault authentication headers, parse the response JSON, cache the full response body, extract
  and return the secret value at the configured data_key. Read failures return None.

  Export _vault_secret_read_body as a simple decoder function that extracts the JSON body
  from a Vault KV v2 read response.

  Export async_write_secret to store a secret in Vault. Build the secret target, construct
  a request body with nested data containing the secret value at the data_key and optional
  description, issue a POST request with authentication headers, and return the parsed response
  JSON on success or a {"status": "error", "message": "..."} dict on failure.

  Export async_rotate_secret to change a secret name and value with verification and optional
  cleanup. Verify the current secret exists by GET; if not found (404) or other error occurs, return error.
  Write the new secret with a description noting rotation from the old name. Verify the new secret
  was created by issuing a fresh GET and comparing the retrieved value to the written value;
  if the comparison fails, return an error with redacted values in the message. If the old name
  differs from the new name, attempt to delete the old secret with default recovery window 7.
  Deletion failure logs a warning but does not fail the rotation (only the new secret's cache
  is cleared after a successful write; old secret cache is cleared only on successful deletion).
  Return the create response on success.

  Export async_delete_secret to remove a secret from Vault. Issue a DELETE request to the
  secret's URL, invalidate the body cache for that URL, and return a success dict or error dict.

  Reads cache whole response bodies by resolved URL so different data_key selections of the same
  URL share the cached body. Ordinary writes do not refresh the read cache. Deletes and successful
  rotations invalidate the source secret's cached body. All decoder functions parse their inputs
  without assumptions beyond what the JSON structure provides.

  This task does not import litellm_enterprise or use the native rust_bridge. HASHICORP_VAULT
  is pinned to Rollout.PYTHON_ONLY in litellm/rust_bridge/catalog.py, so resolve_native_provider_reader
  and resolve_native_provider_writer always return None at the pinned commit and those branches are dead code.
