deviations:
- what: >-
    Vault secret values in error messages returned to callers are redacted (replaced with placeholder text),
    not echoed verbatim. When a value mismatch is detected during rotation verification, the message shows
    that a mismatch occurred, but does not include the actual expected or retrieved values.
  why: >-
    The LiteLLM source logs and returns error messages that include secret values (lines 611-620, 629-634).
    betterlite redacts these values in accordance with the secrets rule: secrets must never appear in logs,
    error responses, or debug output that users might capture or forward. Status remains "error" and the
    fact of mismatch is communicated; only the values are hidden. This improves security without changing
    observable behavior (callers can only detect that rotation failed, not the specific values involved).
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/hashicorp_secret_manager.py#L611-L620
out_of_scope:
- >-
  Vault authentication and token caching. These are owned by B4416 (_auth_via_approle, _auth_via_tls_cert,
  _get_request_headers, cache initialization).
- >-
  Vault URL construction, namespace and mount path resolution. These are owned by B4416 (_build_secret_target,
  vault_login_namespace, vault_secret_namespace properties).
- >-
  JSON response parsing from nested Vault data structures. B4416 owns _get_secret_value_from_json_response.
- >-
  General network error handling and httpx client configuration. B173 owns the client lifecycle and base exception
  handling; this task's Vault-specific error-to-dict translation (HTTP errors become status/message dicts, timeouts
  in async_rotate_secret become the literal "Timeout error occurred" message) belongs here.
pitfalls:
- >-
  Reads cache the full response body, not individual secret values, so the cache key is the resolved URL.
  Different data_key selections from the same URL will share the cached body.
- >-
  The cache.set_cache and cache.delete_cache calls use URL strings as keys; the cache must persist the entire
  JSON response body for subsequent data_key extractions to work.
- >-
  async_rotate_secret returns the write response (from async_write_secret) on overall success, not a separate
  rotation response, even though verification and deletion also occur.
- >-
  Same-name rotation (current_secret_name == new_secret_name) updates the existing secret and does not delete it.
  The condition at line 644 must be checked before calling async_delete_secret.
- >-
  Deletion failure during rotation logs a warning message and continues; the function still returns success.
  Only the cache for the new secret is guaranteed to be cleared after successful write.
- >-
  The response parsing uses _vault_secret_read_body (owned by B4417) for read verification but uses
  _json_object_body (owned by B4416) for write and delete responses because write/delete do not return
  the nested data structure.
- >-
  All decoder functions (_vault_secret_read_body, _json_object_body) only call response.json() and do not
  validate the structure; downstream code must handle missing keys or unexpected types.
