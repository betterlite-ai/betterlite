dod:
- text: >-
    async_read_secret and sync_read_secret both check the URL-keyed cache, issue GET requests
    with B4416-supplied headers and target, parse the response as a plain JSON object via _json_object_body
    (owned by B4416), cache the full body, extract and return the value at data_key, or return None on any failure.
    The _vault_secret_read_body response parser is only used in async_rotate_secret's new-secret verification GET.
  proof:
  - vault-secret-operations-tests
- text: >-
    _vault_secret_read_body decodes a Vault KV v2 read response by calling response.json()
    and returning the parsed _VaultSecretReadResponse TypedDict without further processing.
  proof:
  - vault-secret-operations-tests
- text: >-
    async_write_secret builds the target, constructs data with secret_value at data_key and optional
    description, issues POST with signed headers, returns parsed response JSON on success,
    and returns {"status": "error", "message": "..."} dict on failure.
  proof:
  - vault-secret-operations-tests
- text: >-
    async_rotate_secret verifies the old secret exists with GET; if 404 or error, returns error dict.
    Writes the new secret; if write returns error status, returns that error. Verifies the new secret
    with a fresh GET and compares retrieved value to written value; if mismatch or error, returns error
    with redacted message. If old name differs from new name, deletes the old secret; deletion failure
    logs a warning but does not fail rotation. Returns create response on success.
  proof:
  - vault-secret-operations-tests
- text: >-
    async_rotate_secret does not delete if old and new names are the same (same-name rotation updates
    the existing secret without deletion). Cache is cleared for the new secret URL after successful write;
    cache for the old secret URL is cleared only after successful deletion.
  proof:
  - vault-secret-operations-tests
- text: >-
    async_delete_secret issues DELETE request to the secret URL, invalidates the cached body,
    returns {"status": "success", "message": "..."} dict on success, and {"status": "error", "message": "..."}
    on failure.
  proof:
  - vault-secret-operations-tests
- text: >-
    Secret read and write operations accept optional_params dict (passed to _build_secret_target),
    timeout parameter (passed to httpx client initialization), and optional description
    (async_write_secret only).
  proof:
  - vault-secret-operations-tests
- text: >-
    Read failures (non-404 HTTP errors, exceptions) return None without logging secret values.
    Write/delete/rotate failures return {"status": "error", "message": "..."} dicts with exceptions
    or error details, with secret values redacted in messages per the secrets rule.
  proof:
  - vault-secret-operations-tests
- text: >-
    async_rotate_secret catches httpx.TimeoutException at the top level and returns the literal
    {"status": "error", "message": "Timeout error occurred"}.
  proof:
  - vault-secret-operations-tests
  - rotate-timeout
