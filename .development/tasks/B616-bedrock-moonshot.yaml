id: B616
title: Bedrock Moonshot Invoke adapter
description: >-
  Add Moonshot Invoke model-id, parameter, request and response transforms over the shared typed OpenAI messages.
  Preserve reasoning extraction and model normalization; do not conflate it with the Bedrock runtime chat-completions
  path.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_moonshot_transformation.py:
  AmazonMoonshotConfig.__init__ L55-L57; AmazonMoonshotConfig.custom_llm_provider L60-L61; AmazonMoonshotConfig._get_model_id
  L63-L84; AmazonMoonshotConfig.get_supported_openai_params L86-L109; AmazonMoonshotConfig.map_openai_params L111-L132;
  AmazonMoonshotConfig.transform_request L134-L162; AmazonMoonshotConfig._extract_reasoning_from_content L164-L188;
  AmazonMoonshotConfig.transform_response L190-L245; AmazonMoonshotConfig.get_error_class L247-L249.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse AmazonInvokeConfig.__init__ from B2205 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: moonshot_model_id: Remove one leading bedrock/ and then one leading invoke/. If the remainder
  contains / and does not start with arn:, remove everything through its first slash, regardless of whether that
  component is moonshot. Never loop back; preserve ARN slashes and remaining prefixes. custom_llm_provider is bedrock.
  Initialize both B2205 AmazonInvokeConfig and the inherited B668 GPT config with the same kwargs. moonshot_request_body:
  Filter the twelve B590 AWS authentication names out of a fresh inference map, leaving original options unchanged.
  Pass the cleaned model ID and original messages/litellm_params/headers to B039 MoonshotChatConfig.transform_request.
  Required tool_choice is popped from the copy and adds user content Please select a tool to handle the current
  issue. Native text-list flattening, nontext preservation and missing-reasoning warning/placeholder remain B039;
  use its same cases through this delegate. reasoning_tag_extraction: The helper uses anchored DOTALL <reasoning>(.*?)</reasoning>\s*(.*).
  Only a tag at offset zero matches, so leading whitespace prevents extraction. It splits at the first closing tag
  and strips both captured strings; unmatched/empty inputs return None and unchanged content. After B504 inherited
  GPT response conversion, inspect every nonstream Choices with a truthy message/content. Only a truthy extracted
  reasoning string replaces message.reasoning_content and content, overwriting existing reasoning; an empty reasoning
  block leaves the original tagged content intact. moonshot_usage_finish: B504 owns the inherited buffered response
  conversion and its byte decoder. Preserve usage, finish reasons, id and metadata through the reasoning projection.
  get_error_class creates B682 BedrockError with exactly the supplied status/message/headers; this leaf adds no
  error remapping or byte parser. moonshot_supported_options: Call the B502 GPT supported-parameter implementation
  through super(MoonshotChatConfig,self), bypassing MoonshotChatConfig.get_supported_openai_params; filter only
  functions and stop, preserving order. Thus the native kimi-thinking-preview exclusion of tools/tool_choice and
  native addition of reasoning_effort do not run here. Do not turn the docstring into a different supported list.
  moonshot_parameter_mapping: Call B039 MoonshotChatConfig.map_openai_params on this Bedrock instance, so its self.get_supported_openai_params
  sees the filtered list above. Preserve its max_completion_tokens->max_tokens alias, supported-name filtering,
  reasoning-string handling and temperature rules. Catalog reasoning support removes temperature; otherwise cap
  it at 1, then raise values below 0.3 to 0.3 only when n>1. Do not add a blanket rejection for required tool_choice.


  Implement crates/betterlite-bedrock/src/moonshot.rs with adjacent tests under moonshot/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function moonshot_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  moonshot_model_id, moonshot_request_body, reasoning_tag_extraction, moonshot_usage_finish, moonshot_supported_options,
  moonshot_parameter_mapping. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_moonshot* using HelperCase: kind: helper
  and the externally tagged bedrock_moonshot variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_moonshot that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 154 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 185 production lines, 220 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 535 planned, 550 maximum changed lines.
