id: B616
title: Bedrock Moonshot Invoke adapter
description: >-
  Add Moonshot Invoke model-id, parameter, request and response transforms over the shared typed OpenAI messages.
  Preserve reasoning extraction and model normalization; do not conflate it with the Bedrock runtime chat-completions
  path.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_moonshot_transformation.py:
  AmazonMoonshotConfig.__init__ L55-L57; AmazonMoonshotConfig.custom_llm_provider L60-L61; AmazonMoonshotConfig._get_model_id
  L63-L84; AmazonMoonshotConfig.get_supported_openai_params L86-L109; AmazonMoonshotConfig.map_openai_params L111-L132;
  AmazonMoonshotConfig.transform_request L134-L162; AmazonMoonshotConfig._extract_reasoning_from_content L164-L188;
  AmazonMoonshotConfig.transform_response L190-L245; AmazonMoonshotConfig.get_error_class L247-L249.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse AmazonInvokeConfig.__init__ from B611 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Implement crates/betterlite-bedrock/src/moonshot.rs with adjacent tests under moonshot/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation bedrock_moonshot in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function moonshot_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  moonshot_model_id, moonshot_supported_options, moonshot_request_body, reasoning_tag_extraction, moonshot_usage_finish.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_moonshot* using HelperCase: kind: helper
  and the externally tagged bedrock_moonshot variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_moonshot that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 154 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 180 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 370 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/moonshot.rs
  - crates/betterlite-bedrock/src/moonshot/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_moonshot.rs
  - tools/oracle/src/helpers/bedrock_moonshot/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_moonshot.py
  - tools/oracle/cases/helpers/providers/bedrock-moonshot/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_moonshot*
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_moonshot_transformation.py#L55-L249
  why: >-
    Own AmazonMoonshotConfig.__init__, AmazonMoonshotConfig.custom_llm_provider, AmazonMoonshotConfig._get_model_id,
    AmazonMoonshotConfig.get_supported_openai_params, AmazonMoonshotConfig.map_openai_params, AmazonMoonshotConfig.transform_request,
    AmazonMoonshotConfig._extract_reasoning_from_content, AmazonMoonshotConfig.transform_response, AmazonMoonshotConfig.get_error_class.
    Other functions in this file remain with the owners listed below.
dod:
- text: 'moonshot model id: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-model-id.yaml.'
  proof:
  - case-moonshot-model-id
  - oracle
  - helper-python
- text: >-
    moonshot supported options: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-supported-options.yaml.
  proof:
  - case-moonshot-supported-options
  - oracle
  - helper-python
- text: 'moonshot request body: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-request-body.yaml.'
  proof:
  - case-moonshot-request-body
  - oracle
  - helper-python
- text: >-
    reasoning tag extraction: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-moonshot/reasoning-tag-extraction.yaml.
  proof:
  - case-reasoning-tag-extraction
  - oracle
  - helper-python
- text: 'moonshot usage finish: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-usage-finish.yaml.'
  proof:
  - case-moonshot-usage-finish
  - oracle
  - helper-python
- text: New bedrock_moonshot seeds parse as the intended call variant and replay through the shared production parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-moonshot-model-id
    why: The moonshot-model-id behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_model_id$/)'
  - id: case-moonshot-supported-options
    why: The moonshot-supported-options behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_supported_options$/)'
  - id: case-moonshot-request-body
    why: The moonshot-request-body behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_request_body$/)'
  - id: case-reasoning-tag-extraction
    why: The reasoning-tag-extraction behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_reasoning_tag_extraction$/)'
  - id: case-moonshot-usage-finish
    why: The moonshot-usage-finish behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_usage_finish$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_moonshot.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_moonshot*")"
      && grep -lq 'bedrock_moonshot' tools/oracle/fuzz/corpus/helper_case/bedrock_moonshot* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_moonshot$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-model-id.yaml
- tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-supported-options.yaml
- tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-request-body.yaml
- tools/oracle/cases/helpers/providers/bedrock-moonshot/reasoning-tag-extraction.yaml
- tools/oracle/cases/helpers/providers/bedrock-moonshot/moonshot-usage-finish.yaml
deviations: []
out_of_scope:
- B028 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Preserve reasoning extraction and model normalization; do not conflate it with the Bedrock runtime chat-completions
  path.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: standard
