out_of_scope:
- B028 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_moonshot in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/moonshot.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_moonshot.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- super(MoonshotChatConfig,self) deliberately skips the native Moonshot supported-parameter override.
- An empty <reasoning></reasoning> block remains in visible content because the caller tests the extracted string
  for truthiness.
