checks:
  optional:
  - mutants
  commands:
  - id: case-moonshot-model-id
    why: Remove one leading bedrock/ and then one leading invoke/. If the remainder contains / and does not start
      with arn:, remove everything through its first slash, regardless of whether that component is moonshot. Never
      loop back; preserve ARN slashes and remaining prefixes. custom_llm_provider is bedrock. Initialize both B2205
      AmazonInvokeConfig and the inherited B668 GPT config with the same kwargs.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_model_id$/)'
  - id: case-moonshot-request-body
    why: Filter the twelve B590 AWS authentication names out of a fresh inference map, leaving original options
      unchanged. Pass the cleaned model ID and original messages/litellm_params/headers to B039 MoonshotChatConfig.transform_request.
      Required tool_choice is popped from the copy and adds user content Please select a tool to handle the current
      issue. Native text-list flattening, nontext preservation and missing-reasoning warning/placeholder remain
      B039; use its same cases through this delegate.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_request_body$/)'
  - id: case-reasoning-tag-extraction
    why: The helper uses anchored DOTALL <reasoning>(.*?)</reasoning>\s*(.*). Only a tag at offset zero matches,
      so leading whitespace prevents extraction. It splits at the first closing tag and strips both captured strings;
      unmatched/empty inputs return None and unchanged content. After B504 inherited GPT response conversion, inspect
      every nonstream Choices with a truthy message/content. Only a truthy extracted reasoning string replaces message.reasoning_content
      and content, overwriting existing reasoning; an empty reasoning block leaves the original tagged content intact.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_reasoning_tag_extraction$/)'
  - id: case-moonshot-usage-finish
    why: B504 owns the inherited buffered response conversion and its byte decoder. Preserve usage, finish reasons,
      id and metadata through the reasoning projection. get_error_class creates B682 BedrockError with exactly the
      supplied status/message/headers; this leaf adds no error remapping or byte parser.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_usage_finish$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_moonshot.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_moonshot*")"
      && grep -lq 'bedrock_moonshot' tools/oracle/fuzz/corpus/helper_case/bedrock_moonshot* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_moonshot$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-moonshot-supported-options
    why: Call the B502 GPT supported-parameter implementation through super(MoonshotChatConfig,self), bypassing
      MoonshotChatConfig.get_supported_openai_params; filter only functions and stop, preserving order. Thus the
      native kimi-thinking-preview exclusion of tools/tool_choice and native addition of reasoning_effort do not
      run here. Do not turn the docstring into a different supported list.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_supported_options$/)'
  - id: case-moonshot-parameter-mapping
    why: Call B039 MoonshotChatConfig.map_openai_params on this Bedrock instance, so its self.get_supported_openai_params
      sees the filtered list above. Preserve its max_completion_tokens->max_tokens alias, supported-name filtering,
      reasoning-string handling and temperature rules. Catalog reasoning support removes temperature; otherwise
      cap it at 1, then raise values below 0.3 to 0.3 only when n>1. Do not add a blanket rejection for required
      tool_choice.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::moonshot_cases::case_[0-9]+_moonshot_parameter_mapping$/)'
