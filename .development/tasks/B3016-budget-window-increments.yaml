id: B3016
title: Share model-budget window increments and Redis flushing
description: >-
  Create crates/betterlite-router::budget_increment for shared window-start caching and
  batched Redis flushing of model-budget spend. When a request completes, queue its cost
  increment to Redis and update the in-memory cache immediately. Detect expired budget
  windows by comparing current time to the cached start time, reset both caches when a
  window expires, and preserve the detached-batch requeue protocol for retries after a
  failed Redis flush.

  This module lives beneath both the model-budget enforcement limiter (B3006) and the
  provider-budget assembly router callback, exposing a single spend-increment function that
  takes the already-computed response cost, spend cache key, window start-time cache key,
  budget duration and configured budget as inputs. It does not depend on cost estimation,
  deployment filtering or settlement policy.

  Preserve the existing TTL calculation: budget duration in seconds becomes the Redis TTL
  and the deadline for window expiry. Within an expired window, both the spend cache and
  the start-time cache reset to the new values. Within an active window, the remaining
  time (duration_in_seconds minus elapsed) becomes the TTL for the increment operation.
  Detached increments stay in a locked tuple across crashes; a retry attempts to merge
  them with new increments by key, summing their values.
scope:
