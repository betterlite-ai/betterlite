  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L548-L595
    why: _increment_spend_for_key orchestrates the window-start read, expiry check and increment.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L615-L633
    why: _push_in_memory_increments_to_redis and _flush_queued_increments_with_lock.
dod:
  - text: A budget window start time is read from cache or set to the current time with the duration TTL.
    proof: [budget-increment-tests]
  - text: When current time exceeds window start time plus duration, spend and start-time caches reset, and both set to new values with the full duration TTL.
    proof: [budget-increment-tests]
  - text: Within an active window, the increment operation holds the remaining time as its TTL (duration minus elapsed).
    proof: [budget-increment-tests]
  - text: Increments are queued to in-memory operations, in-memory cache is updated immediately, and the queue operation holds the exact cost as increment_value.
    proof: [budget-increment-tests]
  - text: A detached batch that cannot be flushed to Redis is requeued, merged by key with any new increments, and summed by key before a retry.
    proof: [budget-increment-tests]
  - text: A successful Redis flush clears the detached operations state and returns true; a failed flush returns false without clearing state.
    proof: [budget-increment-tests]
checks:
  optional: []
  commands:
    - id: budget-increment-tests
      why: the budget_increment module tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^budget_increment::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - Cost estimation and its fallback values; callers supply response_cost.
  - Deployment filtering and the full RouterBudgetLimiting class; this task owns only the increment and flush.
  - The periodic sync callback; B326 retains its event adapter and scheduler.
  - Budget validation and enforcement policy; this task queues increments.
pitfalls:
  - The detached_increment_operations tuple is immutable to preserve it across concurrent attempts. When operations arrive during a failed flush attempt, the requeue must merge them before clearing the detached state.
  - Remaining time for a within-window increment is ttl_seconds (the full duration) minus elapsed time (current_time - budget_start). An off-by-one or truncation error here shortens the window.
  - The Redis increment_pipeline contract is a batch operation type from B360. Do not hand-write an async loop of single increments.
  - asyncio.create_task schedules the flush as a detached task. To drain it on shutdown (B003), the flush must be added to a JoinSet or TaskTracker that the server owns.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 1
