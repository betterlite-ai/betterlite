  - tools/oracle/cases/helpers/predibase/url-and-stream-suffix.yaml
  - tools/oracle/cases/helpers/predibase/headers-and-key.yaml
  - tools/oracle/cases/helpers/predibase/reply-text-and-finish.yaml
  - tools/oracle/cases/helpers/predibase/reply-best-of-choices.yaml
