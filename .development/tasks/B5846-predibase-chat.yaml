dod:
  - text: Supported params and map_openai_params give LiteLLM's options, including the zero fixes and n to best_of with do_sample.
    proof: [predibase-tests, predibase-cases]
  - text: The request body, config defaults, URL and headers match, for plain, streaming and custom-prompt calls.
    proof: [predibase-tests, predibase-cases]
  - text: A reply gives the same content, finish reasons, extra best_of choices, usage and x- headers, and each bad reply gives the same PredibaseError status and message.
    proof: [predibase-tests, predibase-cases]
  - text: output_parser strips template tokens in LiteLLM's order.
    proof: [predibase-tests, predibase-cases]
  - text: The reply decoder rejects malformed bodies without panicking and its corpus replays.
    proof: [predibase-corpus]
  - text: New helper cases for these functions exist.
    proof: [predibase-cases]
checks:
  optional: [mutants]
  commands:
    - id: predibase-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^predibase::/) - test(replays_the_predibase_reply_corpus)'
      why: A generic OpenAI-shaped transform has no inputs/parameters body, no best_of choices and no template-token stripping.
    - id: predibase-corpus
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/predibase_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/predibase_reply)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_predibase_reply_corpus)'
      why: Reply bytes come from outside and need a fuzz target with a replayed corpus.
    - id: predibase-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/predibase)"
      why: Without new case files the oracle proof passes with nothing compared.
