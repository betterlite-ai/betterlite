deviations:
  - what: A reply whose details has tokens but no finish_reason gives PredibaseError 500 naming the missing field.
    why: Python raises KeyError there, which LiteLLM's exception mapping turns into a generic server error; a typed decoder cannot keep an untyped KeyError.
  - what: An empty PREDIBASE_API_BASE value counts as unset, so the default base URL is used.
    why: Python keeps an empty base from the environment and builds a URL that starts with a slash, which never reaches Predibase. The caller passes the resolved api_base, so this function cannot see the variable.
out_of_scope:
  - B042 owns _complete_predibase (main.py L3936-L3992), the tenant id, api base and key lookup order (tenant_id, predibase_tenant_id, PREDIBASE_TENANT_ID; PREDIBASE_API_BASE; predibase_key, PREDIBASE_API_KEY), the dispatch.rs wiring, the HTTP client calls and the HTTP oracle cases.
  - B5653 owns handle_predibase_chunk and the stream line decoding (streaming_handler.py L515-L550).
  - B177 owns custom_prompt and prompt_factory, B2204 owns map_finish_reason, B196 owns token_counter, and B2202 owns the DEFAULT_MAX_TOKENS loader.
  - get_supported_openai_params is also called from get_supported_openai_params.py L245 and map_openai_params from utils.py L4613; B668 owns those call sites and uses the functions built here.
  - "PredibaseConfig.__init__ (L51-L87) sets class-level defaults for the process; every call site is PredibaseConfig() with no arguments, so it has no caller with values at the pin. PredibaseConfig.get_config (L89-L90) is built only as the defaults described above."
  - "PredibaseChatCompletion.embedding is a no-op (pass) and has no caller."
  - The sync completion and sync streaming branches of PredibaseChatCompletion.completion have no proxy caller; the gateway always takes the async branches.
  - The bearer-key redaction for "authorization denied for" errors is in exception_mapping_utils.py, which B186 built.
  - Predibase in PROVIDERS_GLOBALLY_SUPPORT_RESPONSE_SCHEMA (utils.py L2726) is B2221's.
  - B1427 (line streaming shared with Databricks) is not used; Predibase streams through B5653's chunk handler.
pitfalls:
  - 'The oracle helper for this task is pre-registered as b5846 by the skeleton. Write its Rust and Python files as the skeleton leaves them; the registry files are not this task''s to edit.'
  - The body key is "inputs", not messages, and every option goes under "parameters"; a top-level "stream" exists only on streaming calls and is added by the caller after transform_request.
  - 'stream is removed from parameters, but do_sample, best_of, response_format and decoder_input_details stay in it.'
  - return_full_text false and details true are sent on every request unless the caller set the key, so a bare call carries three default parameters.
  - A caller header named Authorization or content-type replaces the default of that exact spelling only; other spellings sit beside it.
  - An error key in a 200 reply raises PredibaseError with status 200.
  - An empty generated_text leaves content null and does not change the finish reason, which stays stop unless details.tokens is present.
  - The extra best_of choices start at index 1, and only appear when the best_of request value is above 1, not when the reply has sequences alone.
  - Usage is counted locally with LiteLLM's token counter and is not read from the reply; a counter failure gives 0 for that part.
  - Header copy checks the lowercase name starts with "x-", so x-request-id becomes llm_provider-x-request-id.
  - output_parser trims only for the startswith test, then removes the first occurrence in the untrimmed text, so leading whitespace stays.
  - The message logprobs value on extra choices and the _logprob value on choice 0 may not appear in the serialized reply. Run the helper case first and copy what LiteLLM serializes.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
