id: B5846
title: Predibase text generation request, reply and error transforms
description: >-
  Build the predibase provider in betterlite-provider as crates/betterlite-provider/src/predibase.rs and its folder
  (add betterlite-prompts to that crate's Cargo.toml, as the watsonx text task does). Predibase serves a Hugging Face
  text-generation-inference API, so the wire format is not OpenAI-shaped. This is PredibaseConfig, PredibaseError and
  the request and error parts of PredibaseChatCompletion. Everything is a pure transform; the HTTP call and the
  main.py wiring belong to B042. Credentials and the base URL come in as plain arguments, and no config section is added
  except that max_new_tokens takes the DEFAULT_MAX_TOKENS value (env DEFAULT_MAX_TOKENS, default 4096) as an argument
  that the caller reads through B2202's loader.

  Errors. PredibaseError is a struct {status_code, message, headers}. PredibaseSetupError is an enum for the two
  ValueErrors, with LiteLLM's exact texts: "Missing Predibase Tenant ID - Required for making the request. Set dynamically
  (e.g. `completion(..tenant_id=<MY-ID>)`) or in env - `PREDIBASE_TENANT_ID`." and "Missing Predibase API Key - A call is being
  made to predibase but no key is set either in the environment variables or via params", plus a variant for a custom
  prompt dictionary entry that lacks roles, initial_prompt_value or final_prompt_value (a KeyError in Python).
  get_error_class(message, status, headers) builds a PredibaseError for any status.

  get_supported_openai_params returns, in order: stream, temperature, max_completion_tokens, max_tokens, top_p, stop,
  n, response_format. map_openai_params walks the non-default params in their given order and writes into the options
  map: temperature (0 or 0.0 becomes 0.01), top_p, stream and stop under their names, n to best_of and also
  do_sample true, max_tokens and max_completion_tokens to max_new_tokens (0 becomes 1; when both are present the later
  one wins), echo to decoder_input_details true, response_format copied as given. Any other key is ignored, with no
  drop_params check. echo is not in the supported list, but the function still maps it.

  get_config returns the class defaults that are not None: details true, max_new_tokens (the DEFAULT_MAX_TOKENS argument),
  return_full_text false. Every other field of the Python class (adapter_id, best_of, seed, top_k and so on) defaults to
  None and is never sent. transform_request: the prompt is custom_prompt (B177) over the roles, initial_prompt_value and
  final_prompt_value of custom_prompt_dict[model] when the model is a key of that dictionary, else prompt_factory(model,
  messages) with no provider name (B177). The parameters map is a copy of the options with each config default added
  only where the key is missing, then stream removed. The body is {inputs: prompt, parameters: map}. A parameter the caller
  set to false or 0 still wins over the default.

  get_complete_url: the tenant id argument is required. The base is the api_base argument when it is non-empty, else
  https://serving.app.predibase.com. The URL is {base}/{tenant_id}/deployments/v2/llms/{model} plus /generate_stream when
  the stream argument is true (or, when it is None, when options.stream is exactly true), else /generate. No slash is
  trimmed from the base. validate_environment fails with the API key error when api_key is None (an empty string passes
  and gives "Bearer "). Otherwise the headers are the defaults content-type: application/json and Authorization: Bearer
  <key>, overlaid by the caller's headers, with case-sensitive keys: a caller key Content-Type sits next to content-type,
  and a caller Authorization replaces the default.

  Streaming request. The caller that streams adds "stream": true at the top of the body, next to inputs and parameters,
  after transform_request (async_streaming does data["stream"] = True). The proxy always uses the async path, so betterlite
  has only this path: the non-stream body has no top-level stream key. A streaming call with a status other than 200
  raises PredibaseError(status, response text) with no wrapper. A non-streaming call with an HTTP error status raises
  PredibaseError(status, "HTTPStatusError - received status_code=<n>, error_message=<response text>"); any other client
  failure becomes PredibaseError 500 with the failure text. Expose both as one function over (status, body, streaming).
  Stream lines are decoded by B5653 (handle_predibase_chunk), not here.

  transform_response takes the reply bytes, status, headers, request body, options, the messages, the model name, a clock
  value for created and a TokenCounter trait object (two methods, count_messages and count_text, each returning None on
  failure; B042 wires B196's counter). It starts from the usual empty ModelResponse: one choice with finish_reason stop
  and no content. Steps in order. Body that is not JSON: PredibaseError 422 with the raw text as message. A JSON object with
  an error key: PredibaseError with str(error) and the response status (which can be 200). A JSON body that is not an
  object: 422 "'completion_response' is not a dictionary - <body>". No generated_text key: 422 "'generated_text' is not a
  key response dictionary - <body>". A non-empty generated_text sets choice 0 content to output_parser(text). When
  details has tokens: choice 0 finish_reason is map_finish_reason(details.finish_reason) (B2204), and the sum of the
  non-null token logprobs is kept on choice 0 as _logprob. best_of is options.best_of when present, else
  request.parameters.best_of, else 0; a value that is not an integer counts as 0. When best_of is above 1 and details has
  best_of_sequences, one extra choice is appended per sequence with index position+1, finish_reason through
  map_finish_reason, and a message that has the output_parser text and logprobs set to the token logprob sum (content null
  when its generated_text is empty). Usage: prompt_tokens is count_messages(messages) or 0; completion_tokens is
  count_text(choice 0 content) when content is non-empty and a tokenizer exists, else 0; total is their sum. created is the
  clock value and model is the model argument. Response headers whose lowercase name starts with "x-" are copied as
  llm_provider-<name> into the additional_headers hidden parameter.

  output_parser removes chat template tokens. For each of <|assistant|>, <|system|>, <|user|>, <s>, </s> in that order:
  if the text with surrounding whitespace trimmed starts with the token, the first occurrence in the untrimmed text is
  removed; then, if the text ends with the token (no trimming), its last occurrence is removed. Each step sees the text left
  by the earlier ones.

  decode_predibase_reply(bytes) is the typed decoder for the reply. A field of the wrong type is an error, never a default.
  A missing finish_reason when details.tokens is present is a KeyError in Python and becomes PredibaseError 500 here (see
  deviations).
