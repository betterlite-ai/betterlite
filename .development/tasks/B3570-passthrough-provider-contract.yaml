id: B3570
title: Passthrough provider contract and relay projection helpers
description: >-
  Build the lower passthrough contract and pure URL, metadata and logged-response projections
  in crates/betterlite-openai::passthrough. This module exports the trait BasePassthroughConfig
  (abstract methods is_streaming_request and get_complete_url, default implementations sign_request,
  logging_non_streaming_response, handle_collected_chunks, create_stream_collector), the trait
  PassthroughStreamCollector (methods add and build_logged_response), and the default RawBytesStreamCollector
  that joins chunks before strict UTF-8 decoding and strips empty lines.

  Also export pure functions for URL and metadata transformation: model_group_from (reads model_group
  from PassthroughMetadata in litellm_params), strip_leading_model_segment (removes the leading model
  name from a path), replace_path_segment (replaces a path segment within forward-slash boundaries using
  regex), relayed_json_object (returns parsed JSON when status is 200 and the body is a dict, otherwise
  None), relayed_body (returns parsed JSON when the body is a dict, otherwise returns response text),
  logged_relay_shape (matches the first RelayShape in the given sequence whose path_suffix the endpoint
  ends with, matched via endswith() in list order; sets logging_obj.call_type to the matched shape's
  call_type.value and returns the parsed response).

  Register oracle helper PassthroughMetadata (Pydantic model with model_group: str field, ignoring
  extra fields), RelayShape (frozen dataclass with path_suffix: str, call_type: CallTypes, parse callable),
  LoggedRelayResponse type alias (union of CostResponseTypes, RerankResponse, ResponsesAPIResponse,
  ResponsesTerminalEvent), and RELAYED_JSON_OBJECT (TypeAdapter for Mapping).

  Retain slash trimming in format_url, boundary-aware segment replacement via regex, query replacement
  using urlencode without doseq, HTTP-200-only object projection, and first suffix-match selection in
  list order before parsing. Invalid PassthroughMetadata gives an empty model_group; failed shape
  validation does not change logging_obj.call_type. Default collection joins bytes before strict UTF-8
  decoding and strips empty lines. Keep signed bytes dominant over content/data/JSON, including an empty
  signed byte string. The raw-bytes-to-lines decoder accepts arbitrary bytes split across chunks,
  including code points split at chunk boundaries.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-openai/**
    - tools/oracle/cases/passthrough-metadata/**
    - tools/oracle/helpers/b3570.py
    - tools/oracle/helpers/b3570/**
    - tools/oracle/src/helpers/oracle/b3570.rs
    - tools/oracle/src/helpers/oracle/b3570/**
  lint_tables: false
