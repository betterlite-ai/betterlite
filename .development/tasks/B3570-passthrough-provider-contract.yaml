    why: All owned functions and the PassthroughConfig trait, PassthroughStreamCollector contract, RawBytesStreamCollector and type aliases.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/base_utils.py#L43-L100
