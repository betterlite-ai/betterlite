id: B1041
title: Batch managed records
description: >-
  Keep the MIT batch-file mapping readers and the absent-managed-hook behavior. resolve_input_file_id_to_unified
  and resolve_output_file_ids_to_unified may replace raw IDs from pre-existing ManagedFileRepository rows; lookup
  failures are silently ignored. ensure_batch_response_managed_file_ids performs those two lookups before its absent-hook
  return. get_batch_from_database returns (None, None) without any database read when managed_files_obj is None;
  update_batch_in_database returns before any lookup, normalization or write. batch_cost_poller_is_active is false
  with the OSS scheduler because check_batch_cost_job is not registered, including when PROXY_BATCH_POLLING_ENABLED
  defaults true. Never fabricate a hook or schedule that enterprise job.


  The review's completed-to-complete update, safe-retirement, unchanged-status and missing-column retry branches
  lie after the absent-hook guard at common_utils.py:1478-1479. They are context only, not live implementation/tests
  under the decided OSS-only policy. Preserve pre-existing file-row lookup helpers and B726 repositories; no managed-object
  creation or status write is introduced.


  Implement crates/betterlite-core/src/api/batch_managed_records.rs. Use BatchManagedRecordsInput and BatchManagedRecordsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs functions existing_input_id_mapping, existing_output_error_id__5d60, lookup_failure_keeps_raw_id,
  ensure_no_hook_stops_afte_1794, database_get_no_hook_no_query, database_update_no_hook_n_99fb, poller_job_absent
  under api::batch_managed_records::tests; each independently drives the production result and effects described
  here. HelperCase replay remains in B171.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.PROXY_BATCH_POLLING_ENABLED
  defaults to true (only case-insensitive true enables), but absent enterprise check_batch_cost_job keeps the poller
  inactive. No environment reads occur outside betterlite-config. Test api::batch_managed_records::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This MIT slice consumes typed rows and responses. The JSON decoder at L1368 is behind the absent-hook return and
  is out of scope, so add no decoder or fuzz target here.


  Register HelperCall::BatchManagedRecords in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_managed_records: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership in litellm/proxy/openai_files_endpoints/common_utils.py: resolve_input_file_id_to_unified L1200-L1219;
  resolve_output_file_ids_to_unified L1222-L1241; ensure_batch_response_managed_file_ids L1272-L1286; get_batch_from_database
  L1324-L1351; batch_cost_poller_is_active L1396-L1425; update_batch_in_database L1444-L1479. These ranges stop
  at the absent-hook guards; excluded continuations are listed below.


  Sizing: 85 owned nonblank/non-comment/non-docstring Python lines (139 nonblank/non-comment physical lines including
  docstrings), counted over the disjoint ranges above. Estimate 105 implementation, 82 behavior tests, 84 oracle
  fixtures, 90 Rust/Python adapters, 33 config tests/seeds and 30 wiring: 424 total within the 430-line cap. No
  owned decoder/fuzz work is required.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1019 (File routing ids), B1035 (Batch
  records), B1087 (Api boundaries), B726 (Managed resources and transaction repositories), B858 (Typed managed-resource
  and analytics rows), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
