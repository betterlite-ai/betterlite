dod:
  - text: 'Context cases success_hook_precedes_validation, role_merge_order,
      user_fields_override_token_dict, admin_user_final_override, request_context_no_cache_write,
      end_user_lookup_arguments, found_user_region_and_budget, missing_row_default_only,
      default_preserves_zero, absent_id_passes_empty_to_budget, budget_error_escapes,
      other_errors_debug_drop and partial_enrichment_survives_error.'
    proof:
      - behavior-tests
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'Model cases normalize_then_alias_even_when_skipped, nonempty_config_skips_all_models,
      all_team_models_skips, primary_none_still_checks_fallbacks, primary_denial_stops,
      fallback_string_or_model_dict, fallback_nonstring_ignored, fallback_empty_string_retained,
      fallback_dedup_order, fallback_authorize_before_probe and probe_failure_stops_later_targets.'
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^key_context::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/key_context.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/key-context-*")"
        && grep -rlq "key_context" tools/oracle/fuzz/corpus/helper_case/key-context-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::key_context::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/key-context-*")"
        && grep -rlq "max_end_user_budget_id" crates/betterlite-config/fuzz/corpus/config_yaml/key-context-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::key_context::tests::/)
        - test(/replays_the_/)'
