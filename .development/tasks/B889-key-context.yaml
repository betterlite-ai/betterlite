pitfalls:
  - 'The oracle helper for this task is pre-registered as key_context in the server group. Replace the stub Op in tools/oracle/src/helpers/server/key_context.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/key_context.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - valid_token_dict can override the initially selected role, but a proxy-admin user overrides it again.
  - End-user lookup swallows HTTPException and ProxyException while propagating BudgetExceededError.
  - config != {} bypasses primary and fallback checks after normalization even when model_list is empty.
budget:
  max_changed_lines: 650
  max_new_expects: 0
review_level: security
