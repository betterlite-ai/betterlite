id: B889
title: Virtual-key end-user and fallback context
description: >-
  Finish the AuthContext of an already resolved key. _return_user_api_key_auth_obj first schedules
  B012's AUTH service success hook with route, start/end UTC times, timestamp duration and parent
  span, even if subsequent validation fails. Resolve role as explicit truthy role, B732's user role,
  then internal_user. Merge api_key/span/role first and valid_token_dict second, so the dict can
  override those initial values. A present user then overwrites user_tpm_limit, user_rpm_limit,
  user_email, user_spend, user_max_budget and user_model_max_budget. A proxy-admin user finally
  forces proxy_admin over both earlier role sources. Validate through B2314's UserAPIKeyAuth;
  no cache write occurs here. Supervise the service notification through the logging sink.

  End-user enrichment calls B739 with the token end_user_id/max_budget and metadata-selected
  budget id, plus route/span. A found row supplies allowed_model_region and B753's budget-field
  projection, then B753 updates the token. Only a missing row with a nonnull key default or global
  litellm.max_end_user_budget_id attempts resolve_default_end_user_budget. Empty-string defaults
  count as nonnull here. A found default updates the token and fills end_user_max_budget only if
  still None, preserving zero. Use empty string as the budget helper's end-user id when absent.
  Catch every exception except BudgetExceededError: debug-log and return the token and whatever
  end_user_object was already assigned, retaining any earlier mutation. BudgetExceededError escapes
  as the caller's 429 budget_exceeded/null-param/code-429 response; ordinary HTTP/Proxy errors from
  these collaborators are swallowed too. This is intentionally different from B888's safe_fetch.

  Model enforcement always runs B881's Claude normalization then router alias resolution. A config
  unequal to {} logs config.model_list (default []) and skips both primary and fallback checks;
  a list models containing all-team-models also skips them. Otherwise obtain the model via B881,
  check it with B886 if nonnull, collect B884's fallback targets, accept string targets or dicts
  with string model (including empty strings), and ignore other shapes. Deduplicate fallback names
  in first-seen order, then for each call B886 before B749.is_valid_fallback_model with user_model
  None. The latter performs its source routing probe; do not replace it with a registry lookup or
  check it before authorization. A failing primary or fallback stops all later checks. Preserve
  B886's 403 model errors and B749's routing error through the outer auth projector.


  Build the production key_context module in betterlite-auth; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _return_user_api_key_auth_obj (L3532-L3577; 43 source lines), _lookup_end_user_and_apply_budget (L3637-L3696;
  60 source lines), _enforce_key_and_fallback_model_access (L3699-L3756; 54 source lines), _fallback_target_model_name
  (L3759-L3766; 8 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.max_end_user_budget_id=None.


  Add the key_context operation under B856 Management::auth. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-context-*
  seed to B171 helper_case, which already owns this decoder.


  Install context assembly before the existing inference handler and assert the downstream caller
  fields, hook order and fallback denials. Any persisted enrichment fixture uses B860's isolated
  Postgres schemas through POSTGRES_TEST_URL or testcontainers, not a canned successful lookup.


  B739 owns loading the shared default-budget setting. Add config-loader integration cases
  key_context::tests::global_budget_id_defaults_none, configured_global_budget_id_reaches_lookup
  and empty_global_budget_id_is_not_none; use the real B002 loader and existing config_yaml corpus.
  There is no local environment override or invalid-value fallback in these owned ranges.


  Sizing: 165 nonblank, noncomment lines before excluding docstrings; allow 180 production,
  270 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring and 35 config tests,
  615 changed lines within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::key_context::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
