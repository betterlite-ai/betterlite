id: B9999
title: Guardrail request snapshot capture
description: >-
  Port LiteLLM's guardrail snapshot check, shadow_eval_logger.py L305-L362: the test for whether a guardrail that may rewrite the outbound request ran, the fingerprint of that guardrail history, and `GuardrailRequestSnapshot.capture`. The proxy's pre-call step (B1105) captures a snapshot of the request body right after the guardrails ran, and the shadow eval logger later replays a guardrail-rewritten request only from a snapshot whose guardrail history still matches (B4082's post_guardrail_kwargs, called from B118). Code goes in the new module `crates/betterlite-logging/src/guardrail_snapshot.rs` and its folder, with tests in `guardrail_snapshot/tests.rs`. It adds no config key and no environment variable, and the logging crate already has every crate it needs (serde_json, sha2, hex, indexmap, betterlite-models).


  `GuardrailRequestSnapshot` already exists on main in `betterlite_logging::callback_logger::event` (B8740): `body: IndexMap<String, Json>` and `fingerprint: String`, with `Json` from `betterlite_models::decisions`. LoggerEvent and SuccessRequest already carry it. Don't define a second struct and don't edit event.rs. Write `impl GuardrailRequestSnapshot { pub fn capture(...) }` in the new module; Rust allows an inherent impl in any module of the crate that defines the type.


  The request metadata comes in as `&serde_json::Map<String, Value>`, the shape the pre-call request data and the shadow logger's call details have. A guardrail entry is an object in the array under `standard_logging_guardrail_information`. A missing key or any value that is not an array gives no entries, and array items that are not objects are skipped.


  `NON_MUTATING_GUARDRAIL_MODES` is the six modes whose hooks never rewrite the outbound request: during_call, post_call, logging_only, during_mcp_call, post_mcp_call and realtime_input_transcription. `guardrail_is_non_mutating(entry, allowed)` reads the entry's `guardrail_mode` as one value or as an array of values, and is true only when every value is a string in `allowed`. So a missing key, null, a number, or an array that holds one non-string makes it false, and an empty array makes it true. `request_mutating_guardrail_ran(metadata) -> bool` is true when any entry is not non-mutating under the six modes; pre_call, pre_mcp_call and any mode LiteLLM adds later count as mutating, so the check fails closed.


  `request_guardrail_fingerprint(metadata) -> Option<String>` keeps, in their order, the entries that are not non-mutating under the six modes minus logging_only, serializes that list as JSON with the object keys sorted at every depth, and returns the SHA-256 digest as lowercase hex. A list with nothing left serializes as `[]` and still gets a digest, so a request with no guardrail entries has a fingerprint. Sort the keys by building the value through `BTreeMap`, not by trusting serde_json's map order. LiteLLM returns None when json.dumps raises; a serde_json value always has a JSON form, so None is left only for an error from serde_json itself.


  `GuardrailRequestSnapshot::capture(body: &Map<String, Value>, metadata: &Map<String, Value>) -> Option<Self>` returns None when request_mutating_guardrail_ran is false, or when the fingerprint is None. Otherwise it returns the fingerprint and the body converted with `serde_json::from_value` into `IndexMap<String, Json>`; a conversion error gives None the same way. LiteLLM copies the body with B2204's `independent_snapshot` so that later edits to the request never reach the snapshot. Here the snapshot owns its copy, which gives the same guarantee, so don't call into betterlite-context. A JSON body holds no live span, so the copy keeps `metadata.litellm_parent_otel_span` and `litellm_metadata.litellm_parent_otel_span` as sent, which is where LiteLLM's placeholder swap ends up too.


  Public items are `request_mutating_guardrail_ran` (B118 calls it), `request_guardrail_fingerprint` (B4082's post_guardrail_kwargs compares against it) and `capture` (B1105 calls it); the mode set and guardrail_is_non_mutating stay private to the module. No caller sees a failure from this module, so it has no error enum. No `unwrap`, no `expect`.


  Tests in `guardrail_snapshot/tests.rs` have names starting with `modes_`, `fingerprint_` and `capture_`. The oracle adapter is operation b9999, with the input tagged by `function`. `{"function": "mutating_ran", "metadata": {...}}` answers `{"result": <bool>}`. `{"function": "fingerprints_match", "first": {...}, "second": {...}}` answers `{"result": <bool>}`, true when the two metadata values give the same fingerprint. `{"function": "capture", "body": {...}, "metadata": {...}}` answers `{"result": null}` or `{"result": {"body": {...}, "fingerprint_matches": <bool>}}`, where fingerprint_matches compares the snapshot's fingerprint with request_guardrail_fingerprint of the same metadata. No answer carries a digest, because the digest text differs from LiteLLM's (see deviations). The Python side calls `_request_mutating_guardrail_ran`, `request_guardrail_fingerprint` and `GuardrailRequestSnapshot.capture` from `litellm.integrations.shadow_eval_logger` and turns the MappingProxyType body back into a dict for its answer.

