  - "_key_or_team_is_over_budget, _run_shadow_eval and _run_shadow_arm (L623-L660, L1042-L1216): B4085."
  - "independent_snapshot (core_helpers.py L566-L617): B2204; not called here, since the owned copy already matches it."

pitfalls:
  - 'An entry with no `guardrail_mode` key reads as the single value null, so it counts as mutating; only `guardrail_mode: []` passes with no modes at all.'
  - 'The fingerprint drops a narrower set than the mutating check: a `logging_only` entry never makes request_mutating_guardrail_ran true, but it stays in the fingerprint, so a logging_only guardrail that runs after capture makes the snapshot stale.'
  - 'capture asks request_mutating_guardrail_ran first, so a request whose only entries are during_call or post_call gets no snapshot even though its fingerprint exists.'
  - 'Only object keys are sorted before hashing; the entry list keeps its order, so the same two pre_call entries in swapped order give a different fingerprint.'
  - 'A string under `standard_logging_guardrail_information` is a Python Sequence, so LiteLLM walks its characters and skips each one as a non-mapping; reading any non-array value as no entries gives the same answers.'

