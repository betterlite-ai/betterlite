dod:
  - text: >-
      request_mutating_guardrail_ran is false with no entries, with a non-array guardrail information value, and when every
      entry's modes are among the six (given as one string, as an array, or as an empty array), skipping non-object items;
      it is true for pre_call, pre_mcp_call, an unknown mode, a missing guardrail_mode, null, and an array with a non-string.
    proof: [mode-tests, oracle, helper-python]
  - text: >-
      request_guardrail_fingerprint is 64 lowercase hex characters, the same for two metadata values whose kept entries
      differ only in object key order, unchanged by a post_call entry, changed by a logging_only entry, by a change inside a
      pre_call entry and by a different entry order, and the same for a missing and a non-array guardrail information value.
    proof: [fingerprint-tests, oracle, helper-python]
  - text: >-
      capture returns None when no request-mutating guardrail ran, and otherwise a snapshot whose fingerprint equals
      request_guardrail_fingerprint of the same metadata and whose body equals the given body, span keys included; editing
      the source map after capture leaves the snapshot unchanged.
    proof: [capture-tests, oracle, helper-python]
  - text: The oracle cases run the same metadata and bodies through LiteLLM and betterlite and agree.
    proof: [oracle, helper-python]

checks:
  optional: []
  commands:
    - id: mode-tests
      why: the guardrail mode tests are missing or a mode, a missing mode or a skipped entry is judged differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^guardrail_snapshot::tests::modes_/)'
    - id: fingerprint-tests
      why: the fingerprint tests are missing or the kept entries, the key sorting or the digest form differ
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^guardrail_snapshot::tests::fingerprint_/)'
    - id: capture-tests
      why: the capture tests are missing or capture keeps a snapshot it should drop, loses the body or ties it to the wrong fingerprint
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^guardrail_snapshot::tests::capture_/)'
    - id: helper-python
      why: the oracle adapter is untouched or fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b9999.py tools/oracle/helpers/b9999)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json

