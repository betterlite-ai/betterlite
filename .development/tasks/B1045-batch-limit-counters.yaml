id: B1045
title: Batch limit counters
description: >-
  Reserve enqueued tokens or increment per-window batch counters through B022/B126, using the split descriptors.
  Preserve rate-limit error fields, TPD window-aware refunds and rollback when a later quota fails; no money/token
  arithmetic uses floating point.


  Implement crates/betterlite-core/src/api/batch_limit_counters.rs. Use BatchLimitCountersInput and BatchLimitCountersResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions batch_rpm_limit, batch_tpm_limit, batch_enqueued_limit, tpd_window_refund,
  counter_partial_failure under api::batch_limit_counters::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::BatchLimitCounters in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_limit_counters: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter._reserve_batch_enqueued_tokens
  (L565-L589); litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter._raise_enqueued_limit_error (L591-L616);
  litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter._raise_rate_limit_error (L618-L717); litellm/proxy/hooks/batch_rate_limiter.py:
  _PROXY_BatchRateLimiter._check_and_increment_batch_counters (L719-L788); litellm/proxy/hooks/batch_rate_limiter.py:
  _PROXY_BatchRateLimiter._read_tpd_window_start (L790-L804); litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter._build_tpd_refund_ops
  (L806-L841). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 214 owned nonblank/non-comment/non-docstring Python lines (244 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 234 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 484 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B022 (Per-worker admission and in-flight tracking), B126 (Redis, Redis Cluster and Valkey),
  B171 (Direct helper oracle and URL path encoding), B1042 (Batch enqueued reserve), B1044 (Batch limit descriptors),
  B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
