    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_limit_counters::/)
      - test(/::replays_corpus$/)'
  - id: case-batch-rpm-limit
    why: the batch-rpm-limit behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_limit_counters::tests::batch_rpm_limit($|::)/)'
  - id: case-batch-tpm-limit
