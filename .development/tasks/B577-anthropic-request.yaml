deviations:
- what: Until Max decides request-URL downloads, betterlite never fetches request URLs. An http:// image selected
    for local inlining fails before provider transport with ImageFetchError status 400; HTTPS/provider-supported
    URL descriptors are forwarded without gateway fetching, and supplied inline bytes remain usable.
  why: Keep the current no-download behavior while the request-URL product decision remains open. Do not implement
    a downloader or implicit request-path file reads.
