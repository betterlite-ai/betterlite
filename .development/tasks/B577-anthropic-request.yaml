id: B577
title: Anthropic chat request assembly
description: >-
  Add AnthropicRequest and its prepare method, composing B180 native blocks, leading/mid-conversation system placement,
  reversible names, headers and option mapping. Preserve dummy-tool handling, metadata user-id validation and code-execution
  insertion while keeping request-scoped state immutable. Shared prompt types own existing block structs; only provider
  envelope fields are new. Native message endpoint adapters may call the exposed normalization stages separately.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig.should_strip_billing_metadata L1684-L1691; AnthropicConfig.translate_system_message L1693-L1747;
  AnthropicConfig.add_code_execution_tool L1749-L1780; AnthropicConfig._ensure_beta_header L1782-L1801; AnthropicConfig._ensure_context_management_beta_header
  L1803-L1837; AnthropicConfig.update_headers_with_optional_anthropic_beta L1839-L1875; AnthropicConfig.inlines_remote_media
  L1877-L1878; AnthropicConfig.async_transform_request L1880-L1894; AnthropicConfig.transform_request L1896-L2080.


  inline-media-only supplies an http:// image URL: the current no-download behavior is ImageFetchError status 400
  before transport. The oracle adapter intercepts the real image-fetch seam and raises that same pinned ImageFetchError;
  it must not silently accept an unverified URL as inline bytes.


  Named case contracts: leading_system_run: Split leading system run through B221; translate only that run to top-level
  system and only assign it when nonempty, retaining any configured system if none results. Direct translate_system_message
  removes every system message from its passed list; callers supply a copy. String content falsey is omitted, whitespace
  retained; list text blocks with falsey text omitted, nontext blocks projected to type/text even None. Preserve
  cache_control by key presence, from message for string content and block for list content. mid_conversation_system:
  B221 places later system messages based on B174 supports_mid_conversation_system(model,provider). B180 anthropic_messages_pt
  receives resolved provider and the resulting sequence; an exception is wrapped as AnthropicError400 with <error>\nReceived
  Messages=<messages>. Preserve source error fields and do not make another upstream call. missing_tool_definition:
  Only absent tools plus non-None messages and B2202 non-None tool_calls detection injects B2202 dummy_tool via
  B575 mapping. Present tools=[]/None suppresses injection. B573 sanitizes once here and rewrites OpenAI history;
  store nonempty reverse map only in dict litellm_params._anthropic_tool_name_map, never body options. Existing
  stale reverse map is not cleared when the new map is empty. thinking_history_warning: When thinking is non-None,
  last assistant with tool_calls lacks thinking blocks, and no assistant has nonempty thinking_blocks, only truthy
  global litellm.modify_params removes thinking and warns Dropping 'thinking' param because the last assistant message
  with tool_calls has no thinking_blocks. The model won't use extended thinking for this turn. Otherwise preserve
  it. Reuse B2202 predicates and B688 disabled-thinking policy, not copied heuristics. billing_metadata_policy:
  Base should_strip_billing_metadata=false; subclass true removes only exact leading x-anthropic-billing-header:
  text, without stripping leading whitespace or matching case-insensitively. Empty system entries are removed regardless.
  After message translation, absent advisor_20260301 tool invokes B571 advisor cleanup in drop mode; a dict tool
  of that exact type preserves history. user_id_metadata: Load B2201 global AnthropicConfig defaults only for option
  keys not already present (including None). Truthy dict litellm_params.metadata with non-None valid user_id replaces
  metadata with that one field. Then any dict metadata retains only non-None user_id without revalidating a preexisting
  option value; otherwise remove metadata. Non-dict metadata passes through; a nonstring control user_id retains
  regex TypeError behavior. container_upload_tool: Helper detects container_upload in truthy list content; any existing
  code_execution-prefixed type suppresses insertion, else append {name:code_execution,type:code_execution_20250522}.
  Assembly writes returned tools only when length>1: if tools was absent/empty and insertion yields one item, it
  is not attached. An existing nonempty tool list may be mutated and sent. optional_beta_headers: Truthy is_vertex_request
  bypasses every optional beta addition. Otherwise add compact-2026-09-04 for B568 native compaction, web-fetch-2025-09-10
  for web_fetch-prefixed tools, context-management-2025-06-27 for memory-prefixed tools; compact_20260112/compaction
  edits add compact-2026-01-12 while all other edit types add context-management-2025-06-27. Non-None output_format
  or dict output_config.format adds structured-outputs-2025-11-13 (despite the enum name). speed exactly fast adds
  fast-mode-2026-02-01; advisor_20260301 adds advisor-tool-2026-03-01. inline_media_only: For async preparation
  the B183 predicate selects only image media whose URL begins exact http:// for inlining. Never fetch it: current
  behavior is ImageFetchError400 before provider transport. HTTPS image descriptors and other unselected media remain
  provider-forwardable; already supplied inline bytes continue. Use the same rejected-fetch seam and no-download
  cases as B503/B183. beta_merge_casing_order: On each addition gather every case-insensitive anthropic-beta header
  in encounter order, split/trim/drop empty tokens, remove all casing variants, and write one lowercase anthropic-beta
  joined by comma-space with first-occurrence deduplication. Preserve unrelated headers and addition order; this
  differs from B570 unordered set construction. assembly_option_cleanup: B569 speed gate receives global drop_params
  OR literal True per-call; B688 disabled-thinking and sampling gates run at their source positions. Remove is_vertex_request/client_metadata,
  pop top_k and reapply through sampling gate only when non-None. Build model/messages first then expand optional_params,
  allowing explicit option keys to overwrite them; finally B576 applies output_config.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-anthropic/src/request.rs with adjacent tests under request/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function request_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  leading_system_run, mid_conversation_system, missing_tool_definition, thinking_history_warning, billing_metadata_policy,
  user_id_metadata, container_upload_tool, optional_beta_headers, inline_media_only, beta_merge_casing_order, assembly_option_cleanup.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_request* using HelperCase: kind: helper
  and the externally tagged anthropic_request variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_request that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 304 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 340 production lines, 285 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 775 planned, 775 maximum changed lines.
