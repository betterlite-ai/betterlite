id: B857
title: Migration drift checks and invalid-index repair
description: >-
  Implement warning-only native schema comparison against B701 SchemaContract whenever schema updates
  are disabled, including database-ahead-of-shipped-history warnings using B709 catalog names. Separately
  expose pending Lens rename and partitioned-spend-log guards and invalid-index repair under MigrationLock
  for active migration recovery. A failed or mismatching disabled-update comparison logs a warning and
  never prevents startup.


  Build the production migration_drift module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm-proxy-extras/litellm_proxy_extras/utils.py:
  ProxyExtrasDBManager.raise_if_lens_rename_pending (L630-L657; 28 source lines), ProxyExtrasDBManager.spend_logs_is_partitioned
  (L660-L702; 41 source lines), ProxyExtrasDBManager._warn_if_db_ahead_of_head (L756-L825; 54 source lines),
  ProxyExtrasDBManager._invalid_litellm_indexes (L828-L832; 5 source lines), ProxyExtrasDBManager._index_repair
  (L835-L841; 6 source lines), ProxyExtrasDBManager._repair_index (L844-L860; 16 source lines), ProxyExtrasDBManager.repair_invalid_indexes
  (L863-L926; 62 source lines), ProxyExtrasDBManager._repair_under_migration_lock (L929-L948; 20 source
  lines). litellm/proxy/db/check_migration.py: check_prisma_schema_diff_helper (L47-L108; 57 source lines),
  check_prisma_schema_diff (L111-L122; 12 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DATABASE_URL=None;
  DIRECT_URL=None.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::migration_drift::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 301 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  301 production, 151 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 532 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_native_pg_catalog_comparison_replaces_prisma_migrate_diff_and_remains.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
