id: B3003
title: Settle, resize and release budget reservations
description: >-
  Build `betterlite-auth::reservation_settlement` to finalize budget reservations after requests complete, adjusting counters to actual cost incurred. Implement reconciliation for both normal completion and cancellation paths, with idempotent settlement stamps and deferred cleanup when release fails.

  The reconciliation flow computes adjustments for every reserved counter, distinguishing between consistent counters (those whose reserved state matches expectation) and inconsistent counters (those flushed, expired or reseeded between reservation and settlement). Consistent adjustments pipeline together in one write; inconsistent counters reseed from the database and apply actual cost independently. When the caller supplies unapplied adjustments from `reconcile_budget_reservation(apply_consistent=False)`, `stamp_budget_reservation_actual_cost` records the settlement without writing, allowing the caller to batch with its own increments.

  Preserve the finalized guard making settlement idempotent; cancellation reconciles to input-token cost (already billed to the provider) rather than zero; release failure triggers invalidation as a fallback cleanup. Keep shielded cleanup that completes even when the surrounding request cancels.

  Implement extraction of reserved counter keys for parallel operations, and holder of counter-scope batch reads so every counter is read once.

