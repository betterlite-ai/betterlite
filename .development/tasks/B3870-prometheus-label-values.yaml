deviations:
  - what: litellm_in_flight_requests appears in DEFINED_PROMETHEUS_METRICS but has no entry in PrometheusMetricLabels;
      betterlite includes it in the metric vocabulary but does not emit this metric.
    why: LiteLLM defines the metric in its enum but provides no label schema for it; attempting to emit it would
      raise AttributeError at runtime. Betterlite documents the metric name without implementing emission code that would fail.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/prometheus.py#L302
  - what: Betterlite validates the caller-identity mode on every label-resolution call, reading it from config or thread-local state, not caching it at startup.
    why: LiteLLM reads and validates the mode on every call in _resolve_deployment_and_latency_caller_identity_labels;
      betterlite does the same to support dynamic config changes without restarting label logic.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/prometheus.py#L389-L408
  - what: The custom_prometheus_metadata_labels and custom_prometheus_tags are Vecs passed to get_labels at call time, not module attributes.
    why: Betterlite has no module-level mutable state; callers pass these at metric time, making the function pure and testable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/prometheus.py#L956-L1024

out_of_scope:
  - PrometheusMetricsConfig and PrometheusSettings config parsing; that is in the config loader (B002 and others).
  - The caller-identity mode set in config loading; that is in B002 (config parsing).
  - Emitting metrics or calling label methods on actual Prometheus objects; that is in B3874 and its consumers.

pitfalls:
  - get_input_sequence_length_bucket raises no exception; non-integer/negative/bool inputs silently return "unknown".
  - LabelValidationError.message reads the caller-identity setting at format time, so the message includes the
      current mode even if it changed since validation. Pass the mode as a constructor argument instead of reading it at runtime.
  - litellm_in_flight_requests is in DEFINED_PROMETHEUS_METRICS but has no labels and no metric object in PrometheusMetricLabels;
      calling get_labels on it would raise AttributeError in Python.
  - Label values with embedded quotes or backslashes must be escaped in order (backslash first), or the escaper will double-escape.
  - The 9 metrics that support caller-identity (litellm_deployment_total_requests, litellm_llm_api_latency_metric, etc.) are a fixed set; adding a new metric to the list requires changes in multiple places.
  - The INPUT_SEQUENCE_LENGTH_BUCKETS and BATCH_DURATION_BUCKETS are upper bounds; a value less than a bound falls into that bucket, so the ranges are (0, 1k], (1k, 4k], etc.
  - Caller-identity mode applies only to 9 metrics; on other metrics, api_key_alias and user_email are separate labels, both present at the same time.

