dod:
  - text: Label names are sanitized to match ^[a-zA-Z_][a-zA-Z0-9_]*$, replacing invalid characters with underscores and prepending _ if the first character is a digit.
    proof: [label-name-sanitization-tests]
  - text: Label values are escaped with backslashes and quotes, CRLF/newlines stripped, and \n converted to space, using a single str.translate pass plus one escape pass.
    proof: [label-value-sanitization-tests]
  - text: All 83 metric names are defined in DEFINED_PROMETHEUS_METRICS with correct string values.
    proof: [metric-vocabulary-tests]
  - text: UserAPIKeyLabelNames enum has all 33 label name variants with correct string values.
    proof: [label-names-tests]
  - text: >-
      MetricValidationError.message returns "Invalid metric name: " plus the metric name given.
    proof: [validation-error-tests]
  - text: LabelValidationError.message returns a base message, plus caller-identity context when the metric
      is in PROMETHEUS_DEPLOYMENT_AND_LATENCY_CALLER_IDENTITY_METRICS and an invalid label is in (api_key_alias, user_email).
    proof: [validation-error-tests]
  - text: ValidationResults.has_errors returns true iff metric_errors or label_errors is nonempty,
      and all_error_messages chains both lists with each error's message property.
    proof: [validation-error-tests]
  - text: >-
      get_input_sequence_length_bucket handles boundary values correctly; 999 tokens maps to the "0-1k" bucket,
      1000 tokens maps to the "1k-4k" bucket, 4000 tokens maps to the "4k-16k" bucket; non-int/negative/bool inputs
      return "unknown".
    proof: [input-sequence-length-bucket-tests]
  - text: Caller-identity mode is validated and applied correctly on every label-resolution call; when the mode is user_email,
      api_key_alias is replaced; when both, both labels are emitted on the 9 supported metrics.
    proof: [caller-identity-tests]
  - text: Conflicting include_labels in a raw prometheus_metrics_config (metric name + list of label strings) are detected when the mode
      is user_email and a metric requests api_key_alias on a metric that supports caller identity.
    proof: [caller-identity-tests]
  - text: UserAPIKeyLabelValues accepts unknown keys, aliases api_key_hash to hashed_api_key, and model_dump matches Pydantic output shape.
    proof: [label-values-tests]

