id: B3870
title: Prometheus label values and metric vocabulary
description: >-
  Port litellm/types/integrations/prometheus.py:1-338, 1026-1137, 1146-1162 to Rust in
  crates/betterlite-prometheus to define the metric names, label name and value sanitization,
  and the request label value record.

  Label names must comply with Prometheus regex ^[a-zA-Z_][a-zA-Z0-9_]*$. The
  _sanitize_prometheus_label_name function converts invalid characters to underscores
  and ensures the first character is a letter or underscore. Label values are strings;
  they support escaped backslashes and quotes, strip CRLF, convert \n to space, and handle
  newlines (U+2028, U+2029). The _sanitize_prometheus_label_value function builds the escaped
  output with a single translate pass plus one escape pass, avoiding chained allocations.

  Build the vocabulary of metric names and label domains. UserAPIKeyLabelNames lists 33 label
  domains (end_user, user, user_email, model, api_key_alias, team, route, etc.).
  DEFINED_PROMETHEUS_METRICS names the 83 metric types recognized by the exporter. Validation
  errors report invalid metric or label names with the metric name and the invalid labels.
  The mapping of each metric to its ordered label list is built separately in B3871 and B3872.

  The caller-identity mode (prometheus_deployment_and_latency_caller_identity, set to api_key_alias,
  user_email or both, default api_key_alias) selects which caller label appears on 9 latency and
  deployment metrics: when it is user_email, api_key_alias is replaced; when both, both are emitted.
  The mode is read and validated on every label-resolution call, not cached at startup.

  The UserAPIKeyLabelValues dataclass carries one value per domain (all optional, defaults to None).
  Its model_dump() matches the former Pydantic model_dump() shape for backwards compatibility
  with tests. Construct it with unknown keys ignored, and api_key_hash aliased to hashed_api_key
  for test compatibility. The NoOpMetric class has labels(), inc(), set() and observe() methods
  that do nothing, supporting metric collections where some metrics are disabled.

