    why: Owned. The record, table and transaction protocols and the four filter TypedDicts.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/access_group_endpoints.py#L259-L286
    why: Call sites. _teams_touching's OR filter and _require_teams_exist's id list (B821).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/access_group_endpoints.py#L317-L376
    why: Call sites. Team, key and agent reads and access_group_ids writes inside the transaction (B2340).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/access_group_endpoints.py#L513-L813
    why: Call sites. Create, update and delete with their find_unique, create, update, hasSome and delete calls (B822).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/schema.prisma#L1537-L1554
    why: The access group columns, the client-side uuid default and @updatedAt.
dod:
  - text: Access group records are created with a UUID id, read back by id, by name and newest first, updated column by column with updated_at moved, and deleted, against real Postgres.
    proof: [protocol-tests]
  - text: Team, key and agent reads match each filter LiteLLM sends, an empty list matches no rows, and set_access_group_ids writes the list and moves updated_at.
    proof: [protocol-tests]
  - text: NULL list columns read as None on every record, and writes inside a transaction the caller rolls back leave no trace.
    proof: [protocol-tests]
checks:
  optional: []
  commands:
    - id: protocol-tests
      why: An access group, team, key or agent protocol call is missing or reads or writes differently from LiteLLM's Prisma calls
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^access_group_read::protocols::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "access_group_endpoints.py: B821 owns _ResourceNames, the guards and projections (L157-L309), list_access_groups and get_access_group (L584-L613) and the GET aliases (L824-L835). B2340 owns the assignment, agent detach and cache patch helpers (L317-L500). B822 owns create_access_group (L513-L577), update_access_group (L620-L710), delete_access_group (L717-L813) and the write aliases."
  - "Opening and committing the transaction, and mapping a unique violation to an HTTP error: B822."
  - "B726's PrismaTableRepository and its config-sync wrapper: LiteLLM's transaction tables are Prisma's raw ones, so these writes publish nothing."
pitfalls:
  - "betterlite-db's resource_rows::access_group::AccessGroupTable decodes lists into Vec<String> with serde defaults, so it can't hold a stored NULL; it is the cached LiteLLM_AccessGroupTable shape B821 converts to, not this record."
  - "Prisma's hasSome is the Postgres overlap operator `access_group_ids && $1::text[]`, and `team_id IN ()` is a syntax error; use `= ANY($1)` so an empty id list returns no rows."
  - "Team rows come back in the order Postgres returns them, and B821's carrying order depends on it; adding an ORDER BY to team, key or agent reads changes B821's responses."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
