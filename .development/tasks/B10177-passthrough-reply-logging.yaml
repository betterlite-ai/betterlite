    why: NVIDIA NIM logs every full reply as a StandardPassThroughResponseObject and has no stream hook.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/passthrough/transformation.py#L234-L282
    why: Bedrock's logged reply and event stream collector, left to the adapter task.
dod:
  - text: >-
      An Azure, Azure AI, GigaChat or NVIDIA full reply with a success handler reaches dispatch_success_handlers with the provider's logged response in the SuccessResult variant LiteLLM's type maps to, and every other full reply under 400 with Other(Json::Null).
    proof: [success-tests]
  - text: An Azure or Azure AI stream flushes its built response once through B252's async_flush_passthrough, and the relay's spend_target is the call's model, provider and endpoint.
    proof: [success-tests, stream-tests]
  - text: With success None, or a status of 400 or more, nothing is logged and the reply is unchanged.
    proof: [success-tests, passthrough-tests, python-session-tests]
  - text: NoSpendCollector and the empty RelayLogging are gone, and Foundry and the NVIDIA arm share one RelayedBody conversion.
    proof: [no-copies, openai-tests, foundry-tests]
  - text: B8690's logging-state row says the object is shared and the call runs the full reply's success log, and docs/deviations/B10177.yaml has this task's rows.
    proof: [deviation-rows]
checks:
  optional: [mutants]
  commands:
    - id: success-tests
      why: a provider's logged response is lost, lands in the wrong SuccessResult variant, is logged twice, or is logged without a handler
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::passthrough_call::tests::success::/)'
    - id: passthrough-tests
      why: the shared log broke a request, stream, params, environment, AWS or error test of the call
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::passthrough_call::/)'
    - id: stream-tests
      why: B3572's relay or its flush scheduling changed while the call's sink was rebuilt
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^passthrough_stream::/)'
    - id: openai-tests
      why: the moved RelayedBody conversion answers a JSON body or a text body differently
      run: grep -q 'fn into_standard_response' crates/betterlite-openai/src/passthrough/transformation/types.rs && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^passthrough::transformation::/)'
    - id: foundry-tests
      why: Foundry's standard pass-through object changed when its conversion moved
      run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/^passthrough::/) - test(/replays_the_/)'
    - id: python-session-tests
      why: the Python session no longer builds the shared log or its call fails with the new argument
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^passthrough_calls::/)'
    - id: no-copies
      why: the drop-everything collector or Foundry's own RelayedBody match is still there
      run: test -z "$(grep -rn 'NoSpendCollector' crates/betterlite-core/src)" && test -z "$(grep -n 'RelayedBody::Text' crates/betterlite-foundry/src/passthrough/plan.rs)"
    - id: deviation-rows
      why: this task's deviations are missing, or B8690 still says the call only updates the state it is given
      run: test -s docs/deviations/B10177.yaml && test -z "$(grep -n 'only updates the state it is given' docs/deviations/B8690.yaml)"
oracle_cases: []
deviations:
  - what: >-
      A full reply's success log runs before allm_passthrough_route returns: the async handlers first, then the sync callbacks for async calls. LiteLLM's @client wrapper queues the async handler as a task and runs only the sync callbacks before it returns.
    why: >-
      No wrapper surrounds this call in betterlite and core has no logging worker for it, so the call awaits dispatch_success_handlers itself. The log cannot outlive the call, and the reply waits for the handlers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L1347-L1400
  - what: >-
      A streamed reply is logged once, by the relay's flush. LiteLLM's wrapper also hands the success handler the stream wrapper itself as soon as the call returns.
    why: >-
      With stream set to True the success handler builds no payload and no cost for that result, so the flush carries the spend in both.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L2529-L2543
  - what: >-
      The Python package's pass-through call runs no success callbacks, since its session passes no success handler.
    why: >-
      The package registers no success callbacks for its native calls (search_ocr's session builds its logging state with none), and an OwnedSuccessHandler needs the proxy's payload builder.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2190-L2207
  - what: >-
      Bedrock and Bedrock Mantle replies, Azure and Azure AI chat completions and GigaChat streams have no provider-built logged response: a full reply is logged as an unrecognized result and a stream logs nothing.
    why: >-
      B658's Bedrock plan, Azure's chat projection and stream assembly and GigaChat's chunk assembly need ports that no production code implements yet; a later task builds them.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/passthrough/transformation.py#L234-L282
out_of_scope:
  - "Production implementations of the provider logging ports: B658's BedrockPassthroughPlan selector, transform and assembler (crates/betterlite-bedrock/src/passthrough.rs L50-L57), reached through B10166's AwsPassthrough port; Azure's ChatReplyProjection and ChatStreamAssembly (crates/betterlite-azure/src/passthrough/logging.rs L33-L60 has only the no-op pair); and GigaChat's chunk assembly, where stream_chunk_builder (crates/betterlite-streaming/src/streamed_response_assembly.rs L126) is async and a collector's build_logged_response is sync. Reported to the architect."
  - "A production OwnedSuccessHandler in the server: no code builds one yet (B8610 names a future builder), so B8631 passes None."
  - "The @client failure log for a failed pass-through call."
  - "The wrapper's other post-call steps for the reply (_update_response_metadata, post_call_processing, the success deployment hook, utils.py L2144-L2196)."
  - "The three owned copies of SuccessHandler's borrowed fields (core's OwnedSuccessHandler, betterlite-logging's InteractionLoggingCallbacks and StreamLoggingCallbacks): this task uses core's and leaves any merge to a cleanup task."
pitfalls:
  - "allm_passthrough_route keeps five parameters, the rules' limit: the success handler travels inside PassthroughLog, never as a sixth argument."
  - "tokio's Mutex is not reentrant. Drop the guard run takes before the send, because the full reply log and the relay flush lock the log again."
  - "B252's async_flush_passthrough needs a Sync collector (flush.rs L43) and B3572's BoxedCollector is only Send (crates/betterlite-core/src/passthrough_stream/spend_collection.rs L17), so the StreamCollector adapter keeps the boxed collector behind a std::sync::Mutex."
  - "The flush runs on a spawned task (flush_scheduling.rs L32-L41), so RelayLogging owns all it reads: the Arc'd log and the target strings."
  - "send.rs has 282 of its 300 lines and passthrough_call.rs 245 before B10164 and B10166. The new code goes in success.rs and logged.rs, and send.rs and reply.rs only call it."
  - "Write SuccessHandler as a struct literal over OwnedSuccessHandler's fields, as job.rs L88-L98 and crates/betterlite-core/src/caching/lookup/hit.rs L201-L211 do: the rules forbid a constructor that only builds a struct."
  - "A status of 400 or more never reaches the full reply log, since answer returns Failure::Upstream first (reply.rs L31-L37)."
  - "Convert serde values with json, json_object or serde_json::to_value and never through from_str: arbitrary_precision is on in these crates."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
