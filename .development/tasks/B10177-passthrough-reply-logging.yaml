id: B10177
title: The SDK pass-through call logs its reply through the provider configs and the success handler
description: >-
  B8690's `allm_passthrough_route` in crates/betterlite-core/src/api/passthrough_call never logs a reply. `RelayLogging` (logging.rs L31-L56) is a SpendLogging sink whose two flush methods do nothing and whose spend_target is three empty strings, `NoSpendCollector` (L58-L73) drops every chunk, and `PassthroughCallConfig` (config.rs L99-L101, `type Logged = ()`) returns that collector from create_stream_collector (L150-L158) and keeps the trait's empty logging_non_streaming_response. Nothing logs a full reply after the call either: B7890's Python session (crates/betterlite-python/src/passthrough_calls/session.rs L77-L88) and B8691's router executor call the function directly, and B5368's call wrapper has no pass-through outcome (crates/betterlite-sdk/src/call_setup/correlation.rs L16-L20). In LiteLLM the call feeds every relayed chunk to the provider config's stream collector and flushes the built response to the logging object's success handler (passthrough/main.py L39-L66, L131-L149; litellm_logging.py L2703-L2716), and the @client wrapper's success log maps a full httpx reply through the provider config's logging_non_streaming_response (utils.py L2190-L2207; litellm_logging.py L2338-L2358). That logged response carries the usage the cost and the spend log read. The pieces are merged: B3572's relay calls its SpendLogging sink when the stream ends (crates/betterlite-core/src/passthrough_stream/flush_scheduling.rs L13-L42), B252's `async_flush_passthrough` and `flush_passthrough` log a collector's built response (crates/betterlite-logging/src/logging_streams/flush.rs L19-L49), B250's `dispatch_success_handlers` is _dispatch_success_logging's async and sync split (logging_success/dispatch.rs L14-L32), and the Azure, Azure AI, GigaChat and NVIDIA configs have their hooks.


  The log argument. The second parameter of `allm_passthrough_route`, `logging: &mut LoggingState`, becomes `logging: &Arc<tokio::sync::Mutex<PassthroughLog>>`; the function stays at five parameters after B10164's environment map and B10166's AWS port. `PassthroughLog { state: LoggingState, correlation: CorrelationContext, success: Option<Arc<OwnedSuccessHandler>> }` lives in a new file passthrough_call/success.rs, declared with `pub mod success;` in passthrough_call.rs. `OwnedSuccessHandler` is B4301's bundle of what B250's SuccessHandler borrows (crates/betterlite-core/src/caching/hit_callbacks/job.rs L23-L33). Like LiteLLM's one logging object, the caller, the call and the stream share it. send.rs `run` (L69-L105) locks it for record_environment, the stream flag and record_pre_call and drops the guard before the send. `success: None` means the caller has no success callbacks, and then the call logs nothing, as today.


  The config. `PassthroughCallConfig` gets `type Logged = SuccessResult` (crates/betterlite-logging/src/logging_success/types.rs L13-L19). A new file passthrough_call/logged.rs holds the two functions the config's logging_non_streaming_response and handle_collected_chunks call. Each is a match on the tag that builds the provider config the way is_streaming_request does (config.rs L103-L133), asks its hook and converts the answer. Azure (B548, crates/betterlite-azure/src/passthrough/config.rs L212-L245): `Chat(body)` is Chat, `Relay(body)` is Embeddings when the hook set the call type to aembedding and Other otherwise, `Terminal(event)` is Other. Azure AI (B566's FoundryPassthroughPlan from `foundry_plan(Object::new())`, crates/betterlite-foundry/src/passthrough/plan.rs L202-L235): `Azure(log)` converts as Azure, `Relay` as Azure's Relay, `Ocr` is Other, and `Standard(object)` goes through B3605's `PassThroughResponse::Standard` and its `From` for SuccessResult (crates/betterlite-logging/src/passthrough_logging_state/response.rs L52-L56). GigaChat (B8178, crates/betterlite-openai/src/gigachat_passthrough.rs L122-L170): `Chat` is Chat, `Embedding` is Embeddings, and `Chunks` answers None, since LiteLLM runs stream_chunk_builder on them (gigachat/passthrough/transformation.py L134-L195). NVIDIA NIM full replies only (B5837, nvidia_nim_passthrough.rs L151-L158): its RelayedBody becomes `PassThroughResponse::Standard` the same way. Bedrock and Bedrock Mantle answer None until their adapters exist (out of scope below). Watsonx and VLLM answer None, as LiteLLM's configs define neither hook. Serde values convert with logging.rs's `json` and `json_object` (L91-L107) and typed responses with serde_json::to_value, since ChatResponse, EmbeddingResponse, ResponsesTerminalEvent and OCRResponse derive Serialize.


  Call types. The Azure and Foundry hooks name the logged call type through `PassthroughLogging::set_call_type` (crates/betterlite-openai/src/passthrough/transformation/types.rs L69-L71), as LiteLLM's logged_relay_shape sets logging_obj.call_type (base_llm/passthrough/transformation.py L86-L99). success.rs implements that trait over `&mut LoggingState`, writing `RelayCallType::as_str` (types.rs L51-L60) into `state.call_type`. logged.rs wraps the logging object it is given in a recorder that forwards the call and keeps the last type, so a Relay arm can pick Embeddings.


  One RelayedBody conversion. Foundry's `standard_response` (plan.rs L238-L245) matches RelayedBody into PassThroughResponseObject, and the NVIDIA arm needs the same match. It moves once to betterlite-openai as `RelayedBody::into_standard_response(self) -> Option<PassThroughResponseObject>` in passthrough/transformation/types.rs next to the enum (L38-L41); betterlite-openai already depends on betterlite-logging. Foundry's function then reads the body and calls it, and logged.rs calls it for NVIDIA.


  The stream. The create_stream_collector override (config.rs L150-L158) and NoSpendCollector go. The trait's default RawBytesStreamCollector (crates/betterlite-openai/src/passthrough/transformation.rs L261-L278) then hands the joined lines to handle_collected_chunks, as LiteLLM's RawBytesStreamCollector does (base_llm/passthrough/transformation.py L110-L131). `RelayLogging` moves to success.rs and holds the Arc'd log and the owned model, provider slug and endpoint, so spend_target answers the call's target. send.rs `send` (L190-L227) and send/reply.rs `synthetic_stream` (L48-L87) build it from `RelayContext` (send.rs L55-L61), and RelayContext gains the log. `async_flush_collected_chunks` returns Ok at once when success is None. Otherwise it locks the log, wraps the collector in a type that implements B252's `StreamCollector` (flush.rs L9-L16) over the state's PassthroughLogging, writes B250's `SuccessHandler` from the OwnedSuccessHandler fields as job.rs L88-L98 does, and calls `async_flush_passthrough`. `flush_collected_chunks` does the same with `blocking_lock` and `flush_passthrough`. FlushError is PassthroughError, and B3572 logs it with the chunk count.


  The full reply. When the send answers a full body (send.rs L211, and reply.rs `answer`'s non-streaming branch L41-L45, both under status 400) and success is Some, a function in success.rs locks the log and asks the config's logging_non_streaming_response with the call's target, `RelayedResponse { status_code, body }`, the request data and the state's PassthroughLogging. It then awaits `dispatch_success_handlers` with `SuccessRequest { result, start_time: None, end_time: None, cache_hit: None, prefer_async_handlers: false, standard_logging_object: None, guardrail_snapshot: None }` before the call returns the reply. The result is the hook's answer, or `SuccessResult::Other(Json::Null)` when it answers None: LiteLLM's wrapper then logs the raw httpx Response, and B250 treats a Null result as neither a recognized type nor a dict (types.rs L17-L18, logging_success/recognized.rs L11-L25). The request data is the pick logging.rs `request_data` makes (L140-L146: data when it is not empty, otherwise json) as an Object, and an empty Object when json is not one. Split that function so the logged Json and the hook's Object come from one pick. A streamed reply is logged only by the flush.


  Callers. The Python session's `logging_state` (session.rs L113-L140) builds a CorrelationContext at L121 and drops it; it returns a PassthroughLog with that context and `success: None`, and `call` passes it Arc'd. B8691's executor and B8631's assembly are edited to build the shared log and pass a success handler through `passthrough_executors`.


  Tests. crates/betterlite-core/src/api/passthrough_call/tests/success.rs, declared with `mod success;` in passthrough_call/tests.rs, with recording fakes for StandardPayloadBuilder, StreamAssembler and SuccessClock in its own support, the way caching/hit_callbacks/tests/support.rs L221-L330 builds an OwnedSuccessHandler. Cases: an Azure `/embeddings` full reply logs Embeddings and leaves call type aembedding on the state; an NVIDIA full reply logs Other `{"response": body}`; a GigaChat `/chat/completions` full reply logs Chat; a VLLM full reply logs Other(Null); a 400 logs nothing; success None logs nothing and the reply is the same; an Azure `/responses` stream logs its terminal event once, after the relay ends; the relay's spend_target is the resolved model, the provider slug and the endpoint; a Bedrock stream logs nothing. The existing call tests lock the shared log to read the state. A test in passthrough/transformation/tests.rs covers into_standard_response for a JSON object and a text body.
scope:
  paths:
    - crates/betterlite-core/src/api/passthrough_call.rs
    - crates/betterlite-core/src/api/passthrough_call/**
    - crates/betterlite-openai/src/passthrough/transformation/types.rs
    - crates/betterlite-openai/src/passthrough/transformation/tests.rs
    - crates/betterlite-foundry/src/passthrough/plan.rs
    - crates/betterlite-python/src/passthrough_calls/session.rs
    - crates/betterlite-python/src/passthrough_calls/session/tests.rs
    - docs/deviations/B8690.yaml
    - docs/deviations/B10177.yaml
  lint_tables: false
