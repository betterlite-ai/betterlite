  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/main.py#L39-L66
    why: _SpendCollection builds the provider's stream collector from the logging object's model, provider and endpoint and flushes only when chunks came and nothing failed.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/main.py#L131-L149
    why: _start_flush schedules async_flush_passthrough_collected_chunks once the stream ends.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/main.py#L604-L633
    why: _async_passthrough_request returns a full reply with no hook of its own; its logging comes from the wrapper.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2190-L2207
    why: the @client wrapper's success log for the reply the call returned.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L1347-L1400
    why: _dispatch_success_logging queues the async handler and runs the sync callbacks for async calls.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L2338-L2358
    why: normalize_logging_result asks the provider pass-through config's logging_non_streaming_response for an httpx Response.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L2529-L2543
    why: the success handler swaps in a ModelResponse or EmbeddingResponse and computes cost only for recognized results, dicts and lists, and never while stream is True.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L2703-L2716
    why: flush_passthrough_collected_chunks and async_flush_passthrough_collected_chunks log the collector's built response when it is not None.
