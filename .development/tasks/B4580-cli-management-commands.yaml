id: B4580
title: CLI credential, team, user and model-group commands
description: >-
  Build credential CRUD, team discovery/key assignment, user CRUD and model-group listing. Preserve the
  inconsistent HTTP-error exit behavior of the owned commands: credentials create/delete and all teams commands
  (list, available, assign_key) print "Error: HTTP {status}" on an HTTP error, then print the body as JSON when
  it parses and the raw text when it doesn't, so a non-JSON error body never crashes the command. Credentials
  list/get, all users commands (list_users, get_user, create_user, delete_user), and model-groups list have no
  HTTP error handler; any error there prints one line to stderr and exits 1, never a backtrace. Model-groups list
  outputs to table or JSON with model_group, mode, input_cost_per_token and output_cost_per_token columns. Teams
  available differs from list: it does not raise on an HTTP error, so it exits 0 after printing the error, but it
  does raise on any other exception. List and assign_key raise on both kinds of error. The teams table always
  shows role "Member": LiteLLM never reads the real role, and betterlite matches that. Max_budget shows
  "Unlimited" only when it is null or absent; an explicit number, 0 included, shows as given. Optional
  user-field omission: create_user omits user_alias and teams from the request when not supplied; delete_user
  takes multiple user_ids as arguments. Every command takes its own flags and arguments and loads base_url/api_key
  from B4560's cli_context_values. crates/betterlite-cli/src/commands.rs, the parent module, builds the one
  shared client every command in this crate sends requests through: betterlite-http's ProxiedClient, built
  with ProxiedClient::outbound from ProxyPolicy::resolve(&ProxyTrust::default(), environment) so the *_PROXY
  and NO_PROXY variables route it the way they route requests in LiteLLM, run on a current-thread tokio
  runtime. Each request is built with client.client.request(http::Method, url), given a 30-second timeout and
  Authorization: Bearer {api_key} only when a key is given, sent with ProxiedClient::execute, and read with
  StreamResponse::buffered under a 64 MiB body cap. The base URL loses its trailing slashes first.
  The shared client also implements B4573's pkce_login::Http, the blocking transport that the PKCE login,
  logout's revocation and SSO polling take, so B134 hands this one client to every command: get and post
  block on the runtime, timeout_seconds becomes the request's timeout, HttpBody::Json goes out as its bytes
  with Content-Type: application/json, HttpBody::Form as url::form_urlencoded pairs with Content-Type:
  application/x-www-form-urlencoded, and follow_redirects false sends through a second ProxiedClient built
  without redirects, so a 3xx comes back as the HttpResponse instead of being followed. betterlite-http has
  no such constructor yet: add ProxiedClient::outbound_without_redirects to
  crates/betterlite-http/src/proxy.rs, the outbound builder plus reqwest's redirect::Policy::none(). A
  transport failure becomes a new PkceFailure::Transport variant in pkce_login/models.rs that carries
  betterlite-http's HttpError as its source.
  commands.rs also holds the shared HTTP error printing, "Error:
  HTTP {status}" to stderr then the body as JSON when it parses or the raw text when it doesn't, that
  credentials create/delete and teams list/available/assign_key call. Each command module builds its own
  request (path, query, JSON body) on top of that client; B4579 and B4578 reuse this same client instead of
  building their own. The four tables these commands print (Users, Credentials, Available Teams and Accessible
  Model Groups) are drawn with comfy-table, default features off, and carry no color.

scope:
  paths:
    - crates/betterlite-cli/Cargo.toml
    - Cargo.lock
    - crates/betterlite-cli/src/commands.rs
    - crates/betterlite-cli/src/commands/credentials.rs
    - crates/betterlite-cli/src/commands/users.rs
    - crates/betterlite-cli/src/commands/teams.rs
    - crates/betterlite-cli/src/commands/model_groups.rs
    - crates/betterlite-cli/src/pkce_login/models.rs
    - crates/betterlite-http/src/proxy.rs
  lint_tables: false
