pitfalls:
  - 'The oracle helper for this task is pre-registered as jwt_auth in the server group. Replace the stub Op in tools/oracle/src/helpers/server/jwt_auth.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/jwt_auth.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Managed-agent JWTs do not inherit administrator scope from ordinary role claims.
  - The custom validator is litellm_jwtauth.custom_validate, not general_settings.custom_validate.
