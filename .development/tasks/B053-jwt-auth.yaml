id: B053
title: Install JWT and OAuth authentication backends
description: >-
  Install JWT and OAuth AuthBackend implementations into the pipeline. Compose signature verification,
  custom validation hook, identity/admin authorization and the independent JWT team authorization service.
  For managed agents, require trusted issuer/audience, allowed inference/discovery route and successful
  identity-evidence recording; inject the B141 AgentIdentity port. Preserve source common-check ordering
  and AuthContext conversion. Reject litellm_jwtauth.custom_validate at startup until B054 installs its
  B165-backed callable; no success placeholder is permitted.


  Build the production jwt_auth module in betterlite-server; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTAuthManager.auth_builder (L2391-L2420; 30 source lines), JWTAuthManager.authenticate_jwt (L2423-L2432;
  10 source lines), JWTAuthManager.resolve_identity (L2435-L2446; 12 source lines), JWTAuthManager._resolve_claim_identity
  (L2449-L2485; 37 source lines), JWTAuthManager.user_api_key_auth_from_result (L2932-L2971; 40 source
  lines), JWTAuthManager.authorize_jwt.identity_admin (L2488-L2629; 129 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.team_id_upsert=False;
  litellm_jwtauth.user_id_upsert=False; litellm_jwtauth.scope_mappings=None; litellm_jwtauth.enforce_scope_based_access=False;
  litellm_jwtauth.custom_validate=None; litellm_jwtauth.oidc_userinfo_enabled=False.


  Add the jwt_auth operation under B856 Management::jwt. Python calls only the owned MIT helper with injected
  clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm. Rust
  invokes the production module. Compare typed values, exception status/type/param/code, ordered warnings
  and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-auth-* seed
  to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::jwt_auth::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 258 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  258 production, 148 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 586 changed lines estimated within a 600-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
