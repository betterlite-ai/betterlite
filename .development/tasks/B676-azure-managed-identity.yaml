references:
- url: https://github.com/Azure/azure-sdk-for-python/blob/azure-identity_1.26.0/sdk/identity/azure-identity/azure/identity/_credentials/managed_identity.py#L73-L151
  why: Credential behavior in the installed oracle azure-identity 1.26.0; capture its transport seam instead of
    copying its Python SDK internals.
