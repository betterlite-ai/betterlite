- url: https://github.com/Azure/azure-sdk-for-python/blob/azure-identity_1.25.2/sdk/identity/azure-identity/azure/identity/_credentials/managed_identity.py#L73-L151
  why: Credential behavior in the azure-identity 1.25.2 from the pinned LiteLLM uv.lock; capture its transport seam
