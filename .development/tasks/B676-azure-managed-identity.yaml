  - crates/betterlite-config/src/raw.rs
  - crates/betterlite-config/tests/**
  - crates/betterlite-config/src/resolve.rs
  - crates/betterlite-config/src/types.rs
  - crates/betterlite-config/src/providers.rs
  - crates/betterlite-config/src/providers/azure.rs
  - crates/betterlite-config/src/providers/azure/azure_managed_identity.rs
  - crates/betterlite-config/src/providers/azure/azure_managed_identity/**
  - crates/betterlite-config/src/tests.rs
  - crates/betterlite-config/src/tests/azure_managed_identity_config.rs
  - crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  lint_tables: false
