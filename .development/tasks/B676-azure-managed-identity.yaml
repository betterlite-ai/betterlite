checks:
  optional:
  - mutants
  commands:
  - id: case-system-assigned-imds
    why: 'GET {AZURE_POD_IDENTITY_AUTHORITY_HOST default http://169.254.169.254, stripped of leading/trailing /}/metadata/identity/oauth2/token
      with api-version=2018-02-01, resource from exactly one scope with trailing /.default removed, Metadata: true,
      x-client-SKU: MSAL.Python, x-client-Ver: 1.37.0 and injected UUID x-ms-client-request-id. No user identity
      query for system-assigned identity.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_managed_identity_cases::case_[0-9]+_system_assigned_imds$/)'
  - id: case-client-id-query
