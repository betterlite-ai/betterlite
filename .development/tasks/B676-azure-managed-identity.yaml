    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_loads_msi_secret$/)'
      && grep -lq 'MSI_SECRET' crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  - id: config-azure-pod-identity-authority-host
    why: The AZURE_POD_IDENTITY_AUTHORITY_HOST setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_loads_azure_pod_identity_authority_host$/)'
      && grep -lq 'AZURE_POD_IDENTITY_AUTHORITY_HOST' crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
