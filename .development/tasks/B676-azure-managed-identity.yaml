  paths:
  - crates/betterlite-azure/Cargo.toml
  - Cargo.toml
  - deny.toml
  - crates/betterlite-azure/src/azure_managed_identity.rs
  - crates/betterlite-azure/src/azure_managed_identity/**
  - tools/oracle/Cargo.toml
