    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_loads_identity_server_thumbprint$/)'
      && grep -lq 'IDENTITY_SERVER_THUMBPRINT' crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  - id: config-imds-endpoint
    why: The IMDS_ENDPOINT setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_loads_imds_endpoint$/)'
      && grep -lq 'IMDS_ENDPOINT' crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  - id: config-msi-endpoint
    why: The MSI_ENDPOINT setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_loads_msi_endpoint$/)'
      && grep -lq 'MSI_ENDPOINT' crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  - id: config-msi-secret
