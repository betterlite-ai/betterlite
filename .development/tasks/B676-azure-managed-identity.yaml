checks:
  optional:
  - mutants
  commands:
  - id: case-system-assigned-imds
    why: The system-assigned-imds behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_managed_identity_cases::case_[0-9]+_system_assigned_imds$/)'
  - id: case-client-id-query
    why: The client-id-query behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_managed_identity_cases::case_[0-9]+_client_id_query$/)'
  - id: case-imds-unavailable
    why: The imds-unavailable behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_managed_identity_cases::case_[0-9]+_imds_unavailable$/)'
  - id: case-token-expiry
    why: The token-expiry behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_managed_identity_cases::case_[0-9]+_token_expiry$/)'
  - id: case-workload-selection
    why: The workload-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_managed_identity_cases::case_[0-9]+_workload_selection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_managed_identity.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_managed_identity*")"
      && grep -lq 'azure_managed_identity' tools/oracle/fuzz/corpus/helper_case/azure_managed_identity* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_managed_identity$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_managed_identity)"
      && grep -q 'decode_imds_token' crates/betterlite-azure/fuzz/fuzz_targets/azure_managed_identity.rs && cargo
      nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_managed_identity_corpus$/)'
  - id: config-identity-endpoint
    why: The IDENTITY_ENDPOINT setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_loads_identity_endpoint$/)'
      && grep -lq 'IDENTITY_ENDPOINT' crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  - id: config-identity-header
    why: The IDENTITY_HEADER setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_managed_identity_config_cases::case_[0-9]+_loads_identity_header$/)'
      && grep -lq 'IDENTITY_HEADER' crates/betterlite-config/fuzz/corpus/config_yaml/azure_managed_identity*
  - id: config-identity-server-thumbprint
