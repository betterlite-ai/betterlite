id: B676
title: Azure managed-identity grant
description: >-
  Implement managed-identity environment selection and the IMDS protocol, reusing B699 hosted-environment variants
  and B530 workload federation. Inject resolved settings, transport and clock; preserve host-selection order and
  .default scope-to-resource conversion. IMDS sends Metadata=true and api-version=2018-02-01 with client_id only
  for user-assigned identity.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Endpoint selection matches the pinned ManagedIdentityCredential: IDENTITY_ENDPOINT+IDENTITY_HEADER uses Service
  Fabric when IDENTITY_SERVER_THUMBPRINT exists or App Service otherwise; IDENTITY_ENDPOINT+IMDS_ENDPOINT uses Azure
  Arc; MSI_ENDPOINT uses Azure ML with MSI_SECRET or Cloud Shell without it; complete workload identity settings
  use B530 federation; otherwise use IMDS.


  Implement crates/betterlite-azure/src/azure_managed_identity.rs with adjacent tests under azure_managed_identity/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_managed_identity in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_managed_identity_cases in betterlite-azure with these exact named cases (one per oracle
  file): system_assigned_imds, client_id_query, imds_unavailable, token_expiry, workload_selection. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_managed_identity* using HelperCase: kind:
  helper and the externally tagged azure_managed_identity variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_managed_identity that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_imds_token consumes IMDS token response bytes in crates/betterlite-azure/src/azure_managed_identity.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_managed_identity.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_managed_identity.
  The adjacent test replays_the_azure_managed_identity_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/azure_managed_identity.rs
  and its loader wiring: IDENTITY_ENDPOINT, IDENTITY_HEADER, IDENTITY_SERVER_THUMBPRINT, IMDS_ENDPOINT, MSI_ENDPOINT,
  MSI_SECRET, AZURE_POD_IDENTITY_AUTHORITY_HOST. Module-level settings enter litellm_settings; deployment settings
  enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above and in
  the linked branches; existing key owners remain unchanged. Write config rstest azure_managed_identity_config_cases
  with named cases loads_identity_endpoint, loads_identity_header, loads_identity_server_thumbprint, loads_imds_endpoint,
  loads_msi_endpoint, loads_msi_secret, loads_azure_pod_identity_authority_host, plus rejects_unrelated_key. Each
  loads case calls the real config loader with that key and asserts the resolved value, default, precedence and
  secret redaction where applicable. Seed B002 config_yaml with new azure_managed_identity* files for every key;
  reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_managed_identity_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_managed_identity_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 230 production lines, 169 behavior/config-test lines, 95 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 46 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 635 planned, 650 maximum changed lines. The production allowance includes 195 lines for the referenced
  SDK protocol that LiteLLM delegates.
