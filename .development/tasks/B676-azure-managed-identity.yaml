  - tools/oracle/src/helpers/azure/managed_identity/**
  - tools/oracle/helpers/azure_managed_identity.py
  - tools/oracle/helpers/azure_managed_identity/**
  - tools/oracle/cases/helpers/providers/azure-managed-identity/**
  - tools/oracle/fuzz/corpus/helper_case/azure_managed_identity*
  - crates/betterlite-azure/fuzz/Cargo.toml
  - crates/betterlite-azure/fuzz/fuzz_targets/azure_managed_identity.rs
  - crates/betterlite-azure/fuzz/corpus/azure_managed_identity/**
  - crates/betterlite-config/Cargo.toml
