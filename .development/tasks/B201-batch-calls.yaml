id: B201
title: Bounded batch calls and race completion
description: >-
  Add bounded batch completion helpers under betterlite-core/batch. Accept a statically injected executor over typed
  requests and B198 call contexts so B014 can supply the full single-call pipeline without duplicating it; test
  executors may synthesize results without trait-object provider registries. Cover single-model message batches,
  ordered multi-model responses and the deployments race path, preserving pinned result ordering and typed error
  outcomes. Use bounded concurrency, total batch item/byte limits and a batch deadline; retain every JoinSet task
  and cancel/join remaining work when the caller cancels or the race completes. Distinguish the models path's selection
  semantics from the deployments path using direct batch helper probes with controlled completion gates. Duplicate
  model/deployment entries must remain distinct and return a diagnostic rather than overwriting a keyed future.  Seed
  B171's shared helper_case corpus with every added operation and replay it through the common typed parser. Each
  deployment receives only its own params merged with immutable request kwargs (preserving nested request kwargs
  precedence), never previous deployments values. Keep oracle fixtures off cross-deployment inheritance; test distinct
  credentials and bases locally. The models path propagates an earlier future.result() exception instead of trying
  later models. Oracle compares selection/result only; Rust tests prove cancellation and response timing differences.
  Write the behavior rstest functions b201_batch_call_tests_behavior in adjacent tests.rs files, with a named case
  for each behavior and failure in the DoD; corpus replay tests have separate names. Register helper operations
  batch_calls in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py; each operation has its own
  Rust and Python adapter file and corpus seed. Budget 270 batch execution, 100 adapters, 310 tests and 70 wiring
  (750 total).
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-core/src/batch.rs
  - crates/betterlite-core/src/batch/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/batch-calls/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L11-L122
  why: Single-model batches preserve ordered results and exceptions.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L127-L200
  why: Different models and deployments selection branches.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L203-L256
  why: All-response filtering and order.
dod:
- text: >-
    Non-duplicate batch results, failure ordering and model/deployment selection match helper cases with deterministic
    completion gates.
  proof:
  - oracle
  - helper-python
- text: >-
    Batch size/concurrency/deadline bounds hold and cancellation/race completion joins all children with no detached
    work.
  proof:
  - batch-call-tests
- text: Duplicate entries remain distinct and the resulting diagnostic is observable.
  proof:
  - batch-call-tests
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: batch-call-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::b201_batch_call_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'batch_calls' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/batch-calls/ordered-messages.yaml
- tools/oracle/cases/helpers/batch-calls/mixed-errors.yaml
- tools/oracle/cases/helpers/batch-calls/models-input-order.yaml
- tools/oracle/cases/helpers/batch-calls/deployments-first-success.yaml
- tools/oracle/cases/helpers/batch-calls/deployments-all-fail.yaml
- tools/oracle/cases/helpers/batch-calls/all-responses-filtered.yaml
- tools/oracle/cases/helpers/batch-calls/empty-models.yaml
- tools/oracle/cases/helpers/batch-calls/models-earlier-error.yaml
deviations:
- what: Duplicate model/deployment entries are preserved, and unneeded race work is cancelled and joined.
  why: >-
    LiteLLM ThreadPoolExecutor context exit waits for every losing request, which can finish, bill and log. betterlite
    returns at the first success and cancels/joins losers, changing that timing and potential side-effect behavior;
    duplicate entries remain distinct.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L127-L200
- what: Deployments never inherit missing api_key, api_base or other fields from the previous deployment.
  why: >-
    The pinned loop rebinds kwargs and leaks prior deployment fields into the next; isolating secrets and destinations
    is required.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L165-L172
out_of_scope:
- Provider batch-job APIs are B086; this is in-process fan-out.
- The synchronous Python API surface and executor adaptation are B158/B166.
pitfalls:
- The models branch waits in input order even though its docstring says first response.
- Do not replace results with completion-order output in the ordinary batch path.
- A race winner is not permission to detach the losing requests.
- The models path future.result() raises an earlier model error instead of skipping to a later success.
- Python waits for all futures on executor-context exit; its losing work is owned, not detached.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
