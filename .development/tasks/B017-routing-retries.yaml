deviations: []
out_of_scope:
- Cross-model fallbacks and cooldown policy (B018).
- Python synchronous callable wrappers (B162).
pitfalls:
- An exhausted retry sequence raises the latest error, not the first.
- Always release or refund the previous attempt before reserving the next.
- A yielded token or tool fragment must never be replayed.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
