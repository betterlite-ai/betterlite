checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail
      -E 'test(/^api::claude_gateway_oauth::/) - test(/::replays_corpus$/)'
  - id: case-gateway-disabled-404
    why: the gateway-disabled-404 behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_gateway_oauth::tests::gateway_disabled_404($|::)/)'
  - id: case-device-authorization
    why: the device-authorization behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_gateway_oauth::tests::device_authorization($|::)/)'
  - id: case-authorization-pending
