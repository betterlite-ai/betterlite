dod:
- text: "`ocr_cost`, `ocr_batch_cost`, `vector_store_search_cost`, `rerank_cost` and `transcription_cost` give LiteLLM's pair of floats for the fixed inputs."
  proof: [cost-extra-calls]
- text: "`default_image_cost_calculator` and `default_video_cost_calculator` give LiteLLM's float for the image and video cases."
  proof: [cost-extra-media]
- text: "`batch_cost_calculator` gives LiteLLM's pair, including the half-rate fallback and the data residency uplift."
  proof: [cost-extra-media]
- text: The three processors combine and collect usage like LiteLLM, including cached-token aliases.
  proof: [cost-extra-realtime]
- text: "Both realtime handlers give LiteLLM's float, and `from betterlite.cost_calculator import completion_cost, ocr_cost` works."
  proof: [cost-extra-realtime]
- text: Each function's signature equals LiteLLM's.
  proof: [cost-extra-calls]
- text: JSON conversions for every native method parse without an interpreter, and malformed text gives an error, not a panic.
  proof: [cost-extra-native]
- text: The `_cost_extra` package and `cost_calculator.py` pass ruff and strict basedpyright.
  proof: [python-lint]
- text: >-
    This task adds every Cargo.toml dependency it uses and no unused ones.
  proof: [cost-extra-calls]
checks:
  optional: []
  commands:
  - id: cost-extra-calls
    why: A specialised call or signature differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cost_extra.py -k "ocr or rerank or vector or transcription or signature"
  - id: cost-extra-media
    why: An image, video or batch price differs.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cost_extra.py -k "image or video or batch"
  - id: cost-extra-realtime
    why: A usage processor or realtime price differs.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cost_extra.py -k "processor or realtime or module"
  - id: cost-extra-native
    why: A conversion breaks or panics.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^cost_extra::/)'
  - id: python-lint
    why: A strict type error in the extra cost package.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Returned floats come from Rust's exact decimal result.
  why: Same reason as B8063. The tests allow a relative difference of 1e-12 and name the cases where it shows.
- what: This task has no helper oracle cases.
  why: The pytest file compares both packages, and the pricing cases belong to the Rust tasks named above.
out_of_scope:
- "`cost_per_token`, `completion_cost`, `response_cost_calculator` and the small helpers around them are B8063."
- "Rust pricing for each call type is B1674, B1676, B1678, B1679, B1680, B1681 and B1689."
- "`OCRPricing` (L323) is a TypedDict, and it is declared with the OCR types of B5658."
- "`_ResponsesWsEvent` and `_ResponsesWsEventResponse` (L2862-L2870) are private pydantic models of the Rust filter."
pitfalls:
- "Several of these functions return `tuple[float, float]` as (prompt, completion), and `default_image_cost_calculator` returns one float."
- "`default_image_cost_calculator` defaults `size` to the text `1024-x-1024` with dashes, not `1024x1024`."
- "`batch_cost_calculator` falls back to half the normal rate only when no batch rate exists, so a test needs both kinds of model."
- "`combine_usage_objects` of an empty list is an error in LiteLLM, and Rust must report the same class."
- "A realtime event with no `response.usage` is skipped, not counted as zero."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
