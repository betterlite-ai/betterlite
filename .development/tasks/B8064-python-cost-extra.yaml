id: B8064
title: Python OCR, rerank, media, batch and realtime cost functions
description: >-
  Give `betterlite` the specialised cost functions of cost_calculator.py: `ocr_cost`, `ocr_batch_cost`,
  `vector_store_search_cost`, `rerank_cost`, `transcription_cost`, `default_image_cost_calculator`,
  `default_video_cost_calculator`, `batch_cost_calculator`, the three token usage processors and the two realtime
  handlers. The price rules are Rust (B1678 OCR, B1679 batch, B1680 usage aggregation, B1681 realtime sessions, B1674 images,
  B1676 audio and video, B1689 early-return charges). This task extends the native family `cost` that B8063 created with
  more methods and adds the Python functions. It builds on B8063's `NativeCost` and does not make a second one.


  Because B8063 owns `src/cost.rs`, this task owns a second native file set: `src/cost_extra.rs`, `src/cost_extra/**` and
  `python/betterlite/_native_cost_extra.pyi`, registered as the family `cost_extra`. Its functions take the same settings
  text as `NativeCost` and share nothing but that text. Methods: `ocr_cost`, `ocr_batch_cost`, `vector_store_cost`,
  `rerank_cost`, `transcription_cost`, `image_cost`, `video_cost`, `batch_cost`, `combine_usage`, `realtime_cost` and
  `realtime_transcription_cost`, each taking and returning JSON text. Conversions sit in `src/cost_extra/convert.rs` with
  tests named `cost_extra_request_` and `cost_extra_result_`. B5369 declares the `cost_extra` family in `lib.rs` and `_native.pyi` with a stub `register` that this task fills.


  Python lives in `python/betterlite/_cost_extra/` with an explicit `__all__`, and this task also writes
  `python/betterlite/cost_calculator.py`, which re-exports by name everything B8063's `_cost` and this package export, so
  `from betterlite.cost_calculator import completion_cost, ocr_cost` works. Signatures and returns follow LiteLLM exactly:
  `ocr_cost(model, custom_llm_provider, response=None, model_info=None) -> tuple[float, float]` (L2174), `ocr_batch_cost(model,
  custom_llm_provider, usage_info, model_info=None)` (L2260), `vector_store_search_cost(model, custom_llm_provider, response)`
  (L2337), `rerank_cost(model, custom_llm_provider, billed_units=None)` (L2369), `transcription_cost(model,
  custom_llm_provider, duration)` (L2403), `default_image_cost_calculator(model, custom_llm_provider=None, quality=None, n=1,
  size="1024-x-1024", optional_params=None, model_info=None) -> float` (L2407), `default_video_cost_calculator(model,
  duration_seconds, custom_llm_provider=None, model_info=None, video_resolution=None) -> float` (L2499) and
  `batch_cost_calculator(usage, model, custom_llm_provider=None, model_info=None, data_residency=None)` (L2591). A
  `model_info` argument is a plain dict and goes to Rust as JSON.


  The usage processors are Python classes over Python `Usage` objects. `BaseTokenUsageProcessor.combine_usage_objects` builds the
  merged `Usage` from Rust's JSON result, keeping the cached-token aliases the way L2713-L2762 does.
  `RealtimeAPITokenUsageProcessor.collect_usage_from_realtime_stream_results` and
  `ResponsesWebSocketTokenUsageProcessor.collect_usage_from_responses_ws_results` read events and call the usage
  transformer of B5658 for each billable event (the filter at L2862-L2882 is a Rust rule, sent as the list of events).
  `handle_realtime_stream_cost_calculation` (L2984) and `handle_realtime_transcription_cost_calculation` (L3045) return
  floats.


  Tests compare each function with LiteLLM on the local map: a Mistral OCR page count, a batch OCR usage, a vector store
  response with a priced query, a Cohere rerank unit count, a Whisper duration, `dall-e-3` and `gpt-image-1` sizes, a
  Veo duration, an OpenAI batch usage with `data_residency="eu"`, and a realtime event list with cached audio.
