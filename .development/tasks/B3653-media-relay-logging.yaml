id: B3653
title: Deepgram listen and Fal queue spend logging
description: >-
  Build the WebSocket listen and image-queue logging projections over their provider pricing
  helpers, composing B068 cost calculation. Implement deepgram_listen_passthrough_handler and
  fal_ai_passthrough_handler, extracting model identifiers, computing spend from provider pricing
  registries, and writing enriched response objects and logging state. Preserve unpriced-result
  semantics, warn when registries lack entries and avoid charging Fal status/result requests again.

  Deepgram listen receives audio WebSocket frames, sums frame durations across channels and
  collects base pricing from the registry via completion_cost. When the base pricing lookup
  fails, _audio_cost returns None; addon models that fail to price are silently dropped from
  the sum and contribute nothing. The handler extracts the model from upstream URL, calculates
  billed duration as audio seconds times channel count, computes response cost, and writes the
  cost to both response hidden params and logging object fields. Fal AI queue receives response
  body and request body; the handler extracts the model by stripping the configured queue-base
  path and selecting the component before /requests/. Cost is computed only on submission routes,
  gathering image URLs from all top-level response values and constructing an ImageResponse with
  a flat list of ImageObject entries.

  Logging object gets model, custom_llm_provider and response_cost set consistently. Both
  handlers return PassThroughEndpointLoggingTypedDict with result and kwargs carrying cost
  for the logging framework. Write helper cases executing the cost functions with mocked
  registries and test the complete handler flow including unpriced and multi-addon scenarios for
  Deepgram and Fal model extraction, submission filtering and URL collection.
