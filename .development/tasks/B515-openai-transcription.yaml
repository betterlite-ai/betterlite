pitfalls:
- 'The oracle helper for this task is pre-registered as openai_transcription in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/transcription.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_transcription.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Only the asynchronous SDK branch extracts SRT/VTT duration from a string result; applying it to sync changes hidden
  metadata.
- A JSON-decodable object with an unexpected shape is not a textual fallback even when Content-Type is text/plain.
- Whisper get_complete_url owns no global base fallback, so None produces a relative path at this seam.
