id: B515
title: OpenAI audio transcription mapping
description: >-
  Add TranscriptionRequest/Reply and multipart execution for whisper and GPT audio transcription. Represent JSON/verbose
  JSON versus textual formats as explicit reply variants; preserve timestamp granularity fields, supplied file metadata,
  optional defaults and stream-related parameters without implementing the B083 route.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/transcriptions/handler.py:
  OpenAIAudioTranscription.make_openai_audio_transcriptions_request L27-L40; OpenAIAudioTranscription.make_sync_openai_audio_transcriptions_request
  L42-L54; OpenAIAudioTranscription.audio_transcriptions L56-L148; OpenAIAudioTranscription.async_audio_transcriptions
  L150-L222. litellm/llms/openai/transcriptions/whisper_transformation.py: OpenAIWhisperAudioTranscriptionConfig.get_complete_url
  L22-L48; OpenAIWhisperAudioTranscriptionConfig.get_supported_openai_params L50-L60; OpenAIWhisperAudioTranscriptionConfig.map_openai_params
  L62-L76; OpenAIWhisperAudioTranscriptionConfig.validate_environment L78-L95; OpenAIWhisperAudioTranscriptionConfig.transform_audio_transcription_request
  L97-L114; OpenAIWhisperAudioTranscriptionConfig.get_error_class L116-L121; OpenAIWhisperAudioTranscriptionConfig.transform_audio_transcription_response
  L123-L141. litellm/llms/openai/transcriptions/gpt_transformation.py: OpenAIGPTAudioTranscriptionConfig.get_supported_openai_params
  L13-L23; OpenAIGPTAudioTranscriptionConfig.transform_audio_transcription_request L25-L39. litellm/utils.py: extract_duration_from_srt_or_vtt
  L10168-L10194.


  Whisper defaults response_format to verbose_json; GPT transcription exposes include instead of timestamp_granularities.
  Text/SRT/VTT duration extraction delegates to extract_duration_from_srt_or_vtt; compare text, SRT and VTT duration
  metadata separately.


  Named case contracts: gpt_transcription_fields: Whisper allows language,prompt,response_format,temperature,timestamp_granularities;
  GPT replaces timestamp_granularities with include. Mapping copies supported values and silently omits other non-default
  keys. upstream_error: The send wrappers rethrow original errors; async logs and rethrows without wrapping. Use
  B1001 get_audio_file_name for post-call metadata and never open a request-provided filename. whisper_default_verbose_json:
  Whisper body is model/file plus options, with response_format=verbose_json only when the key is absent; explicit
  None survives. GPT adds no response_format default. text_duration: Only the async SDK path derives _audio_transcription_duration
  from textual replies; ordinary text with no timestamp returns None. Sync textual replies become TranscriptionResponse(text=reply)
  without duration extraction. srt_duration: Match every hh:mm:ss,mmm or hh:mm:ss.mmm occurrence, compute hours*3600+minutes*60+seconds+milliseconds/1000
  and return the largest time, not merely the final matched subtitle end; use exact decimals. vtt_duration: Both
  comma and dot separators work regardless of file format; absent matching timestamps returns None, and the regex
  does not impose normal minute/second ranges. whisper_endpoint_auth: Trim base slashes, append /audio/transcriptions
  if base ends /v1 and /v1/audio/transcriptions otherwise, including an absent base becoming the relative /v1/audio/transcriptions
  path. Authorization uses explicit api_key or OPENAI_API_KEY, without module-key fallback, and overwrites caller
  Authorization. raw_transcription_headers: Both send wrappers call with_raw_response.create with data and timeout,
  preserve raw response headers for B206, and delegate response_type=audio_transcription to B004. non_json_content_type:
  On JSONDecodeError, a content-type containing application/json (case-insensitive) rethrows; other content types
  produce a text response. Parsed JSON must contain at least one TranscriptionResponse field or raises ValueError.
  model_projection: Sync hidden model uses the method model; async uses data.model with whisper-1 only when missing,
  plus custom_llm_provider=openai. Sync client construction omits shared_session while async forwards it.


  Write standalone Rust test openai_transcription_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_transcription_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-openai/src/transcription.rs with adjacent tests under transcription/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function transcription_cases in betterlite-openai with these exact named cases (one per oracle file):
  whisper_multipart, gpt_transcription_fields, timestamps_array, verbose_json_segments, text_srt_vtt_body, upstream_error,
  whisper_default_verbose_json, gpt_include, text_duration, srt_duration, vtt_duration, whisper_endpoint_auth, raw_transcription_headers,
  non_json_content_type, model_projection. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_transcription* using HelperCase: kind:
  helper and the externally tagged openai_transcription variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_transcription that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_transcription_reply consumes JSON or text/SRT/VTT response bytes with an explicit
  response-format tag in crates/betterlite-openai/src/transcription.rs (or its scoped child module). Add cargo-fuzz
  target crates/betterlite-openai/fuzz/fuzz_targets/openai_transcription.rs calling that exact production function,
  with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_transcription.
  The adjacent test replays_the_openai_transcription_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 324 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 355 production lines, 230 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 795 planned, 800 maximum changed lines.
