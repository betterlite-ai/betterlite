deviations:
  - what: The 422 body for a bad request body or query parameter uses the server's shared validation response and wording, not FastAPI's `loc` and `msg` strings.
    why: Every route in the server shares one validation response; the status code matches.
  - what: Startup validation errors are logged with the error type's wire value (`invalid_guardrail`) inside the brackets.
    why: LiteLLM formats the Python enum member; the wire value is the stable name and no client reads these log lines.
  - what: The startup table is written to a writer the caller passes (stdout in production) and not printed from inside the function.
    why: Print macros are forbidden by lint, and a writer lets a test compare the exact text.
  - what: GET /policy/list returns empty `scope` and `guardrails` for every policy and a `total_count` of 0, as LiteLLM does today.
    why: LiteLLM's list route reads summary keys the summary never sets. Parity first; the architect decides whether to fix it later (see notes).
out_of_scope:
  - "B3249 owns POST /policies/attachments/estimate-impact and its helpers (policy_resolve_endpoints.py L1-L208, L318-L425) and POST /policy/templates/test with `_test_guardrail_definitions` (endpoints.py L1123-L1265). It registers its own route in its own module."
  - "B3251 owns apply_policies, the compliance test request and POST /utils/test_policies_and_guardrails (endpoints.py L67-L380)."
  - "B3252 owns the template enrich routes and competitor helpers (endpoints.py L667-L1084 except the suggest route); B3253 owns GET /policy/templates (L607-L664) and POST /policy/templates/suggest (L1087-L1120)."
  - "B3248 owns the /policies CRUD, attachment and resolved-guardrails routes in policy_engine/policy_endpoints.py; B3244 owns the version routes; B3247 owns pipeline testing."
  - "B3240 owns resolve_policy_guardrails and resolve_inheritance_chain. B3241 owns the registries, get_matching_policies, policy_applies, get_policies_with_matching_conditions, get_attached_policies_with_reasons, resolve_guardrails_for_context and load_policies. B3243 owns sync_policies_from_db and sync_attachments_from_db. B3245 owns PolicyValidator and the validation response types."
  - "B3242 owns the response records used here (PolicyInfoResponse, PolicySummaryItem, PolicyListResponse, PolicyTestResponse, PolicyResolveRequest, PolicyMatchDetail, PolicyResolveResponse)."
  - "init_policies_sync (init_policies.py L186-L218): no caller at the pin."
  - "ProxyConfig._init_policies_in_db and the call of init_policies from config loading (proxy_server.py L7105-L7140, L8834-L8856) belong to the proxy config-loading task, not this one."
  - "The route module composition for /policy and /policies is the umbrella's (B079); this task never registers a path another task registers."
pitfalls:
  - "get_policies_summary fills `guardrails_add`, `guardrails_remove` and `policy_count`, but the list route reads `scope`, `guardrails` and `total_count`, so every list item has empty scope and guardrails and `total_count` is 0 even with policies loaded."
  - "GET /policy/info always returns an empty scope (four empty lists), even for a policy that has attachments, because the route builds `PolicyScopeResponse(teams=[], keys=[], models=[])`."
  - "POST /policy/test returns `resolved_guardrails` in set order (`list(set)` in LiteLLM), and `guardrails_added` in /policies/resolve is unordered the same way; oracle cases use at most one guardrail per policy so the comparison cannot flake."
  - "/policies/resolve needs a database handle only to answer 500 before any work: a proxy without a database cannot resolve even when config policies are loaded."
  - "The 500 `Database not connected` comes after body validation, so a bad body is 422 even with no database."
  - "force_sync runs the policy sync first and the attachment sync second; swapping them changes which policies the attachments see."
  - "get_policies_summary resolves with no context, so a policy whose condition would not match a request still lists its guardrails in /policy/list and /policy/info."
  - "validate_policy_config is called with `validate_db = prisma_client is not None`, and the validator never reads it, so a database handle changes nothing in the result."
  - "The route builds its PolicyValidator with a database handle and no router, so model-existence checks never run from /policy/validate."
  - "PolicyMatchContext and PolicyValidateRequest forbid extra fields, but PolicyResolveRequest ignores them: `{\"model\": \"x\", \"extra\": 1}` is 422 on /policy/test and 200 on /policies/resolve."
  - "init_policies loads policies even when the result has warnings, and with fail_on_error false it loads them even when it has errors."
  - "The ValueError text for a failed validation is built from `[policy_name] message` lines only, with no error type."
  - "A policy's `guardrails` that is not an object prints no add or remove line, since the printer checks for a dict before reading `add` and `remove`."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
