dod:
  - text: >-
      get_all_resolved_policies returns one ResolvedPolicy per policy name, ignores conditions when no context is given, and applies them when one is.
    proof: [inspection-tests]
  - text: >-
      get_policies_summary returns initialized false for an uninitialized registry, and otherwise the policy and attachment counts, per-policy fields
      and per-attachment fields listed in the description.
    proof: [inspection-tests]
  - text: >-
      resolve_context returns no matches as empty lists, drops policies whose conditions fail, reports matched_via and the resolved guardrails per policy,
      and sorts effective_guardrails.
    proof: [inspection-tests]
  - text: >-
      init_policies validates, logs errors and warnings, stops with `Policy validation failed with <n> error(s):` text when invalid and fail_on_error is
      true, and loads policies even with warnings or with fail_on_error false.
    proof: [startup-tests]
  - text: >-
      init_policies loads attachments only when present and non-empty, and leaves the policies loaded when the attachment step fails.
    proof: [startup-tests]
  - text: >-
      print_policies_on_startup writes the exact colored table text for policies with and without inherit, description, guardrails and model condition,
      and for attachments with each scope part, no scope part, and no attachments.
    proof: [startup-tests]
  - text: >-
      POST /policy/validate returns the validator's result with 200, treats a missing policies field or any extra field as 422, and passes validate_db
      from the database handle.
    proof: [route-tests, oracle]
  - text: >-
      GET /policy/list returns the quirky LiteLLM shape (empty scope, empty guardrails, total_count 0) and an empty result when nothing is loaded.
    proof: [route-tests, oracle]
  - text: >-
      GET /policy/info/{policy_name} answers the two 404 texts and otherwise returns the policy's own add and remove lists with its resolved guardrails
      and chain.
    proof: [route-tests, oracle]
  - text: >-
      POST /policy/test echoes the context with four keys, returns the not-initialized message, and otherwise returns matching policies and resolved
      guardrails.
    proof: [route-tests, oracle]
  - text: >-
      POST /policies/resolve answers 422 before 500 `Database not connected`, runs both syncs only when force_sync is true, and returns matched policies
      and sorted effective guardrails.
    proof: [route-tests, oracle]
  - text: >-
      The three body decoders reject malformed bytes and wrong shapes without panicking, accept unknown fields only for the resolve body, and have
      committed corpus inputs.
    proof: [request-corpus, route-tests]
checks:
  optional: []
  commands:
    - id: inspection-tests
      why: the resolved-policies map, the summary or the context resolver is missing or wrong
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^inspection::.*tests::/)'
    - id: startup-tests
      why: init_policies, its error text, its load order or the startup table text is missing or wrong
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^startup::.*tests::/)'
    - id: route-tests
      why: one of the five routes, its status mapping, its response shape or a body decoder is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_inspect_routes::/) - test(replays_the_inspect_request_corpus)'
    - id: request-corpus
      why: the request decoders have no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/inspect_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_inspect_request_corpus)'
