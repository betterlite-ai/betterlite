id: B899
title: Password login HTTP routes and cookies
description: >-
  Own POST /login, /v2/login, /v3/login and /v3/login/exchange over an injected PasswordAuthenticator
  implemented by B788. /login reads username/password form fields, returns 303 and token cookie, and maps
  throttle failures to HTML 429. /v2/login reads JSON and returns 200 JSON redirect_url/token
  plus cookie. /v3/login requires control_plane_url, returns an opaque single-use code and expires_in=60
  with no token cookie; exchange validates/consumes the code and sets the token cookie. Use B2300's
  concrete return-to resumer and cookie setter for same-origin and configured control-plane destinations.
  These four routes are public: no missing-bearer or unrelated-virtual-key authorization requirement.

  Form and JSON username/password values use Python str coercion; absent and JSON null become the literal
  None, not an extractor's missing-field error. Authenticate through B788 using B787's LoginThrottle,
  then create the UI token and encode its session JWT. The form route catches only authentication
  ProxyException code 429: HTML says Too many sign-in attempts and includes Retry-After text, default 30,
  but forwards exc.headers unchanged. It does not add a Retry-After header when the exception lacks one.
  Other authentication exceptions propagate, and failures after authentication are outside that catch.

  B124.get_custom_url prefers PROXY_BASE_URL when present, joins the active request root from its root-path
  middleware without duplication, then these routes strip trailing slashes and append /ui?login=success.
  /login first tries a truthy litellm_cp_return_to cookie through B2300. A resumed response is returned
  unchanged; an exception logs that the stale cookie was ignored and falls back to the dashboard. The
  fallback 303 sets token and clears a truthy return cookie. /v2/login returns token and redirect_url in
  JSON and sets token; it does not process the return cookie. token has Path=/, SameSite=lax, no HttpOnly,
  no explicit lifetime, and Secure only when B743's trust-aware HTTPS check says so, through B2300.

  /v3/login checks truthiness of control_plane_url before parsing credentials. Missing/empty yields 404
  not_found_error, param control_plane_url. Mint token_urlsafe(32); store login_code:<code> containing token
  and redirect_url for exactly 60 seconds in Redis if configured, otherwise the process's user_api_key_cache.
  Redis errors are not a local fallback. Return only code/expires_in=60, without a token cookie.
  Exchange has the same disabled check before JSON decoding, then rejects a falsey code with 400 auth_error
  param code. Missing, expired, used, empty or non-dict cached values give 401 auth_error param code.
  Read then delete the code before accessing its token/redirect_url fields and setting the cookie;
  these are separate cache operations, not atomic GETDEL. A malformed nonempty cached dictionary is
  consumed before its missing-field 500. Preserve this order and the concurrent redemption window.

  /v2 and /v3 keep ProxyException unchanged, convert HTTPException to auth_error with its status/detail
  and param (default string None), and convert other errors to 500 auth_error param None. Exchange keeps
  ProxyException but maps every other exception, including HTTPException, to 500 auth_error param None.
  All HTTP error cases compare status/type/param/code and ignore only message wording. Use native failure
  injection for cache and encoder failures; authentication uses the real B788 implementation.


  Build the production login_routes module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/proxy_server.py:
  login (L16913-L17003; 62 source lines), login_v2 (L17006-L17066; 52 source lines), login_v3 (L17069-L17142;
  65 source lines), login_v3_exchange (L17145-L17206; 55 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.control_plane_url=None.


  B2300 owns general_settings.control_plane_url=None acceptance; B124 owns PROXY_BASE_URL (default None),
  SERVER_ROOT_PATH (default empty string) and SERVER_ROOT_PATHS selection in get_custom_url. Route config
  tests must load these settings through their owners and verify the final redirect rather than replacing
  the URL builder with a test stub.


  Mount POST /login, /v2/login, /v3/login and /v3/login/exchange once, hidden from OpenAPI as at the pin.
  HTTP fixtures cover credentials, redirects, content-type, Location and every Set-Cookie attribute;
  none of these handlers reads litellm-changed-by or uses handle_exception_on_proxy.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed login users and password hashes for B788; requests deliberately omit Authorization. No enterprise
  package is installed. Redis-backed code exchange and local-only exchange use separate fixture workers.


  Write betterlite-config::login_routes::tests::login_url_defaults, proxy_base_override,
  request_root_not_duplicated and empty_control_plane_disables_v3.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary login_routes::decode_login_request(&[u8]) -> Result<TypedValue,DecodeError>
  for login form/JSON and exchange-code request bytes. Production calls this decoder before its typed
  policy functions; the cargo-fuzz target login_routes calls that same function. Seed valid, truncated,
  malformed, duplicate-field and limit-boundary inputs and add login_routes::tests::replays_the_login_routes_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B770 owns crates/betterlite-server/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 234 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  234 production, 310 behavior tests, 65 route/manifests/wiring, 60 decoder/fuzz and 65 config lines,
  734 changed lines estimated within a 775-line gate after moving shared return/cookie work into B2300.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: login_body_limits.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Register the public login paths without the protected-route authentication middleware or a management
  effects decorator. B056 composes this router later without registering its paths a second time.


  Depend directly on B788 and register its concrete PasswordAuthenticator and SessionIssuer when these
  login routes are mounted. B056 may aggregate the routes later, but these real HTTP cases already use
  working credential/session code; no mock authenticator or missing-registration success is allowed.
