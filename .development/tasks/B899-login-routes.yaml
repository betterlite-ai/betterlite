  - text: 'Implement the owned behavior and ordered failure effects; named tests: form_login_303, json_v2_login_200,
      throttled_html_429, throttle_default_text_only, missing_form_fields_literal_none, json_scalar_coercion,
      bad_credentials_passthrough, v2_http_error_status, v2_unexpected_500, v3_unexpected_500,
      v3_disabled_404, v3_code_60s, v3_no_token_cookie, exchange_cookie, exchange_missing_code,
      exchange_unknown_code, exchange_used_code, exchange_expired_code, exchange_bad_cached_type,
      exchange_delete_before_fields, exchange_get_delete_race, exchange_http_error_500,
      redis_failure_no_fallback, local_code_other_worker, secure_cookie_attributes,
      stale_return_to_fallback, relative_return_to, cross_origin_return_to and public_login_paths.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The production decode_login_request decoder is used by the service and its fuzz target and rejects
      malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: login_body_limits exercises the explicit byte/depth rejection before credentials reach the authenticator.
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^login_routes::tests::/)
        - test(/replays_the_/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::login_routes::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/login-routes-*")"
        && grep -rlq "control_plane_url" crates/betterlite-config/fuzz/corpus/config_yaml/login-routes-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/login_routes.rs && grep -q "login_routes"
        crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-server/fuzz/corpus/login_routes)" && cargo nextest run --locked -p betterlite-server
        --no-tests=fail -E 'test(replays_the_login_routes_corpus)'
