  - tools/oracle/cases/helpers/resource-rows/scalar-coercion-and-timestamp-boundaries.yaml
deviations: []
out_of_scope:
  - Padded one-line functions in resource_rows belong to B5094. B5094 clears the no-one-line-functions and no-padded-one-line-functions legacy lists. This task doesn't touch .ast-grep/rules/.
  - docs/deviations/B721.yaml. Its size and depth rule still matches the code after the fix, so it isn't edited.
  - check_create_guard, check_value_shape and the oracle case credential-create-wrong-shape-after-guard.yaml are right as they are. credential.rs changes only to pass the new depth argument to convert.
  - crates/betterlite-db/src/team_rows/decoder.rs checks a team row against depth 64 after decoding its nested strings in the same way. That is B859's code and not one of B721's findings.
pitfalls:
  - Only the two model row checks get MAX_JSON_DEPTH + 1, and MAX_JSON_DEPTH itself stays 64, so parse_data still rejects a decoded string or an outer envelope 65 levels deep.
  - The MAX_ROW_BYTES checks next to both model depth checks stay as they are.
  - No helper case can tell CredentialValueRequired from FieldShape, because the resource_rows helper maps every decode failure to ValidationError, so gap two is proven only by the native try_from asserts.
  - A credential row in gap two that also sets model_id passes the guard through model_id and proves nothing about credential_values, so those rows carry no model_id.
  - OptionalPayload's Default is Some of an empty Payload, so the organization row must send "model_spend":null explicitly; leaving the key out tests the {} default instead.
  - Rust's Decimal dumps a zero spend as 0 while Python's float dumps 0.0, so organization-null-model-spend.yaml ignores /value/spend with the same reason organization-and-project-fields.yaml gives.
  - 'litellm_params and model_info are dict fields, so each depth-limit string must decode to a JSON object, for example {"x": then 63 [ then 0, 63 ] and a closing } for depth 64.'
  - The access group case keeps its file and its name access_group_all_fields_and_null_lists, and only assigned_key_ids changes.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
