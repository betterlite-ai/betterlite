id: B1217
title: Database service-unavailable error projection
description: >-
  Project native typed database-unavailable causes and HTTP service-unavailable errors, traversing preserved
  error chains. Keep allow_requests_on_db_unavailable=false as policy metadata; B757 alone turns the classified
  outage into a restricted principal when enabled. Pure classification never performs a query or retries.


  Build the production database_availability module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/exception_handler.py:
  _exception_chain (L29-L36; 8 source lines), _database_service_unavailable_errors (L39-L44; 6 source
  lines), PrismaDBExceptionHandler.should_allow_request_on_db_unavailable (L71-L82; 11 source lines),
  PrismaDBExceptionHandler.is_database_service_unavailable_error (L295-L349; 45 source lines), PrismaDBExceptionHandler.database_unavailable_message
  (L368-L381; 14 source lines), PrismaDBExceptionHandler.service_unavailable_proxy_exception (L384-L390;
  7 source lines), PrismaDBExceptionHandler.find_database_service_unavailable_error_in_chain (L393-L403;
  11 source lines), PrismaDBExceptionHandler.is_database_service_unavailable_error_in_chain (L406-L419;
  12 source lines), PrismaDBExceptionHandler.handle_db_exception (L422-L435; 13 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.allow_requests_on_db_unavailable=False;
  allow_requests_on_db_unavailable=False.


  Add the database_availability operation under B856 Management::database. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a database-availability-* seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::database_availability::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 127 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  127 production, 139 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 411 changed lines estimated within a 425-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
