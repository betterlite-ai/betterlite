pitfalls:
  - 'The oracle helper for this task is pre-registered as database_availability in the db group. Replace the stub Op in tools/oracle/src/helpers/db/database_availability.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/database_availability.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A permanent inner engine fault outranks the transient outer reconnect failure when selecting the 503 explanation.
  - handle_db_exception uses the direct connection predicate, so enabling outage mode does not swallow every error classified as 503.
