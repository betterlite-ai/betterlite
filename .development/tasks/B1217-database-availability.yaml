id: B1217
title: Database service-unavailable error projection
description: >-
  Classify database outages and build their 503 projection without querying or retrying. Walk the current
  exception then cause-or-context, preferring cause, for at most 20 links (including cycles). Ignore
  BaseException-only links as classification candidates. Collect every accepted outage; choose the first
  permanent fault anywhere in the chain, otherwise the first outage, otherwise None.

  Accept B872 infrastructure, transport and Prisma-engine-internal predicates in that order, then a
  case-insensitive cached plan must not change result type substring, OSError/asyncio.TimeoutError,
  and asyncpg PostgresConnectionError/InterfaceError. An unavailable asyncpg import returns false at
  this final step. Ordinary authentication/data errors stay unclassified. Native adapters preserve
  equivalent typed causes; do not confuse stale plans with reconnectable transport failures.

  Project the source ProxyException with status/code 503, type no_db_connection and param string None. Transient
  faults get retry guidance; permanent faults identify the fault class and require deployment attention,
  without suggesting retry. If no outage is found use the supplied error to select wording. Error
  messages remain betterlite's own and the oracle ignores only /error/message.

  general_settings.allow_requests_on_db_unavailable defaults False. Booleans pass through; B129 str_to_bool
  accepts trimmed case-insensitive true/false, unrecognized strings or None become false. There is no
  top-level alias or environment binding. Non-null values that are neither booleans nor strings fail
  when the consumer tries string normalization; do not silently turn numbers/lists/maps into false.
  handle_db_exception suppresses only a direct B872 connection
  error when this setting is true; otherwise rethrow the original. It does not use the broader chain
  classifier. B757 owns fallback principals, while this helper also serves health and proxy callers.


  Build the production database_availability module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/exception_handler.py:
  _exception_chain (L29-L36; 8 source lines), _database_service_unavailable_errors (L39-L44; 6 source
  lines), PrismaDBExceptionHandler.should_allow_request_on_db_unavailable (L71-L82; 11 source lines),
  PrismaDBExceptionHandler.is_database_service_unavailable_error (L295-L349; 45 source lines), PrismaDBExceptionHandler.database_unavailable_message
  (L368-L381; 14 source lines), PrismaDBExceptionHandler.service_unavailable_proxy_exception (L384-L390;
  7 source lines), PrismaDBExceptionHandler.find_database_service_unavailable_error_in_chain (L393-L403;
  11 source lines), PrismaDBExceptionHandler.is_database_service_unavailable_error_in_chain (L406-L419;
  12 source lines), PrismaDBExceptionHandler.handle_db_exception (L422-L435; 13 source lines).


  Load the single setting through betterlite-config and pass a typed policy input to the consumer,
  preserving its accepted bool/string/null forms and its invalid-type failure branch.


  Add the database_availability operation under B856 Management::database. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a database-availability-* seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::database_availability::tests::default_false, boolean_values, trimmed_true_false,
  unrecognized_string_false and nonstring_policy_value_fails_at_consumer.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 127 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  127 production, 220 behavior tests, 65 helper adapters, 30 wiring, 0 decoder/fuzz
  and 50 config lines, 492 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
