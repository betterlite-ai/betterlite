dod:
  - text: >-
      Cases cause_precedes_context, chain_stops_at_twenty, cyclic_chain_bounded, base_exception_skipped,
      infrastructure_transport_engine, stale_plan_casefold, os_and_timeout, asyncpg_connection_interface,
      asyncpg_unavailable_false, data_error_not_outage, permanent_beats_outer_transport,
      first_transient_selected, no_outage_none, transient_retry_message, permanent_deployment_message,
      service_unavailable_envelope, enabled_direct_connection_suppressed,
      enabled_wrapped_outage_rethrown and outage_policy_off verify classification without SQL.
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_availability::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/database_availability.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-availability-*")"
        && grep -rlq "database_availability" tools/oracle/fuzz/corpus/helper_case/database-availability-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_availability::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-availability-*")"
        && grep -rlq "allow_requests_on_db_unavailable" crates/betterlite-config/fuzz/corpus/config_yaml/database-availability-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
