dod:
  - text: execute_guardrail_hook picks the unified or own hook by LiteLLM's rule and load balancing applies only with more than one deployment.
    proof: [execution-tests]
  - text: process_guardrail_callback maps MCP events, skips on a non-true gate, marks the hook as run and emits metrics with the right status.
    proof: [execution-tests]
  - text: scan_raw_request guardrails see the snapshot and their edits are dropped with a warning; parallel guardrails raise a block before a reroute.
    proof: [execution-tests]
  - text: A sensitive data route rewrites the model and metadata and stores a sticky route only when asked.
    proof: [execution-tests]
  - text: during_call_hook selects guardrails and moderation overrides like LiteLLM and runs them together.
    proof: [execution-tests]
  - text: >-
      execute_guardrail_hook calls B3664's GuardrailInvocation::begin before a callback's own hook that its LiteLLM class decorates with @log_guardrail_information, with the hook name for hook_type (PreCall, Moderation, PostCallSuccess), and finish_success with the hook's result or finish_failure with its error after it.
    proof: [execution-tests]
checks:
  optional: []
  commands:
    - id: execution-tests
      why: guardrail execution, a pre-call runner, rerouting, metrics or the during-call fan-out is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::hook_execution::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The pre_call_hook walk that calls these runners: B8393. Post-call guardrails: B8394."
  - "should_run_guardrail: B3665. The unified hooks: B3680. record_raising_guardrail: B6370. The Prometheus observation: B3878."
  - "HTTP oracle cases through the booted proxy: B8399, which wires these functions to the routes."
pitfalls:
  - The unified path writes guardrail_to_apply into the request data before the call, and the unified hook removes it; do not clear it here.
  - A guardrail with no guardrail_name still reports metrics under its class name, or "unknown".
  - SensitiveDataRoute counts as intervened, not error, in the metric status.
  - In run_parallel a fast reroute must not hide a slower block, so blocking errors are raised first.
  - during_call_hook skips a guardrail whose event_hook is unset and moderation_check is pre_call, without asking the gate.
  - "LiteLLM records a guardrail invocation only around a hook that the guardrail class decorates with @log_guardrail_information (at the pin 17 async_pre_call_hook, 7 async_moderation_hook and 12 async_post_call_success_hook methods). An undecorated own hook records nothing, so never wrap every own hook. The apply_guardrail calls on the unified path are recorded by B3680, not here."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
