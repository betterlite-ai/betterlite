id: B8392
title: Guardrail hook execution, metrics and the during-call hook
description: >-
  Port how ProxyLogging runs one guardrail: picking the unified hook or the guardrail's own hook, load balancing between guardrail deployments, recording latency metrics, and the sequential and parallel pre-call runners that pre_call_hook (B8393) calls. The during-call hook is here too, since it is only a fan-out of the same runner. Code goes in crates/betterlite-server/src/guardrails/hook_execution.rs and hook_execution/ (execute.rs, pre_call_runners.rs, sensitive_route.rs, metrics.rs, during_call.rs, tests.rs). Callbacks are B8390's `ProxyCallback` and `GuardrailCallback`; errors are B8390's `ProxyHookError`.

  execute.rs. `execute_guardrail_hook(callback, hook_type, data, user_api_key_dict, call_type, response)` (L1802-L1857): the unified path is taken when the callback's own class defines apply_guardrail, use_native_lifecycle_hooks is not set, and not (hook_type during_call and use_native_during_call_hook). On the unified path set `data["guardrail_to_apply"]` and call B3680's `UnifiedGuardrailHooks` pre_call, moderation or post_call_success; otherwise call the callback's own hook. `should_use_load_balancing(name)` (L1785-L1800) is true when the router's guardrail list holds more than one entry with that guardrail_name; `execute_with_load_balancing` (L1859-L1901) asks the router for an available deployment and fails with "No callback found for guardrail: {name}" when it has none. The router side is a `GuardrailBalancer` trait. `process_pre_call_response(response, data, call_type)` (L1768-L1783): an error is raised, a map replaces the data, a string becomes `RejectedRequest` for completion and text_completion call types and HTTP 400 `{"error": text}` for any other.

  pre_call_runners.rs. `process_guardrail_callback` (L1903-L1996): a pre_call event on an MCP call type (`MCP_GUARDRAIL_CALL_TYPES`) becomes pre_mcp_call; a gate answer that is not true skips with None; otherwise run (load balanced when the name qualifies), apply process_pre_call_response, call mark_pre_call_hook_ran, and always emit metrics with status success, intervened (SensitiveDataRoute) or error with the error's type name; an error also gets B3666's `enrich_http_exception_with_guardrail_context`. `run_sequential` (L1998-L2077) handles scan_raw_request: such a guardrail sees a fresh copy of the raw snapshot, any data it returns is dropped with the warning at L2058-L2066, and the live data is returned. `run_parallel` (L2583-L2646) awaits every guardrail, records each raising guardrail through B6370's `record_raising_guardrail`, raises the first error that does not change the request flow, and only then the first one that does.

  sensitive_route.rs. `handle_sensitive_data_route(err, data, user_api_key_dict)` (L2648-L2697): with sticky_session_routing, ask the `sensitive_data_routing` proxy hook to store the session route, or warn that it is not registered; then set `model` to route_to_model and write `sensitive_data_routing_applied`, `_original_model`, `_guardrail` and `_detection_info` into metadata.

  metrics.rs. `emit_guardrail_metrics` (L2700-L2716) forwards to B3878's guardrail observation when a Prometheus logger is configured, else does nothing. `run_guardrail_with_metrics(callback, future, hook_type, request_data)` (L2719-L2753) times the future and enriches and records a raising guardrail.

  during_call.rs. `during_call_hook(data, user_api_key_dict, call_type)` (L2925-L3030): return the data at once when there is no guardrail and no moderation override. A non-guardrail with a moderation override runs only with a user_api_key_dict. A guardrail with no event_hook and a moderation_check of pre_call is skipped; otherwise the gate decides with during_call, or during_mcp_call for call_mcp_tool. For call_mcp_tool the auth object is passed as a map. All selected hooks run together and the first error is raised. The unified moderation path needs a user_api_key_dict and no use_native_during_call_hook.
scope:
