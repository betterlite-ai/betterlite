id: B861
title: Shared management input and delegation guards
description: >-
  Implement ManagementGuards for finite Decimal spend, budget durations, per-model team limits, required
  analytics identity, administrator-only pass-through grants and guardrail opt-outs. Preserve the exact
  truthy-versus-empty checks and metadata move behavior. Omit premium-user checks and retain every non-license
  validation. Requests without a user_id cannot turn a service-account analytics query into an unfiltered
  report.


  Build the production management_guards module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/common_utils.py:
  validate_finite_spend (L13-L24; 11 source lines), validate_budget_duration (L27-L41; 13 source lines),
  validate_team_model_max_budget (L77-L123; 47 source lines), require_caller_user_id_for_non_admin (L126-L150;
  23 source lines), _check_passthrough_routes_caller_permission (L153-L177; 24 source lines), _check_disable_global_guardrails_caller_permission
  (L180-L205; 26 source lines), _set_object_metadata_field (L432-L456; 23 source lines), _update_metadata_field
  (L639-L661; 16 source lines), _update_metadata_fields (L675-L688; 12 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the management_guards operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a management-guards-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 195 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  195 production, 148 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 438 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
