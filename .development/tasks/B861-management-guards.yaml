id: B861
title: Shared management input and delegation guards
description: >-
  Implement the nine ManagementGuards helpers over B732 principals and B859 request records. None of
  them writes a database row. validate_finite_spend accepts None, zero and negative finite values;
  NaN/+inf/-inf raise HTTP 400 detail.error 'spend must be a finite number. Received: {value}'. Reject
  nonfinite input before converting to Decimal; do not accidentally add a nonnegative-spend rule.
  validate_budget_duration passes None or a string to B2317 budget_duration_error, propagating its
  exact message as detail.error with caller-supplied status_code (default 400). B2317 owns duration
  parsing, positive/overflow checks, config and fuzzing; this wrapper adds no parser.

  validate_team_model_max_budget returns immediately for None/empty map. At the pin any nonempty
  map with premium_user is not True fails 403 before field validation; omit only this paid-tier gate
  under the README decision, with native_no_license_team_budget proving the deliberate difference.
  Keep validation order per model: stripped key nonempty; max_budget non-null, finite and >=0;
  budget_duration present; validate its duration; reject non-null tpm_limit OR rpm_limit even zero.
  Errors are HTTP 400 detail.error respectively 'model_max_budget keys must be non-empty model names',
  "model_max_budget[{name!r}].max_budget must be a non-negative finite number. Received: {value}",
  "model_max_budget[{name!r}] requires a budget_duration, e.g. '1d' or '30d'", the B2317 duration error,
  and "model_max_budget[{name!r}] tpm_limit/rpm_limit are not enforced on a team; set per-model rate
  limits on the key instead". Preserve original key spelling in errors, including whitespace.

  require_caller_user_id_for_non_admin rejects ONLY None, including an admin passed directly, with
  403 detail.error 'Service-account keys cannot query user analytics. Use a user-bound key, or call
  as a proxy admin.' Empty string returns unchanged; callers own the admin bypass. Passthrough grants
  permit only exact proxy_admin (not proxy_admin_viewer); default entity='key'. A truthy top-level
  allowed_passthrough_routes fails before truthy dict metadata.allowed_passthrough_routes. Messages
  are 'Only proxy admins can set `allowed_passthrough_routes` on a {entity}.' and the same with
  `metadata.allowed_passthrough_routes`. Empty/null values and non-dict metadata do not trigger it.

  Guardrail opt-out similarly bypasses only proxy_admin. Any truthy top-level flag OR truthy metadata
  flag requests an exemption, but a stored existing_metadata.disable_global_guardrails is True permits
  a non-admin to re-send it. Stored 1 or string 'true' is insufficient for that exact-True exception.
  Otherwise 403 detail.error 'Only proxy admins can set `disable_global_guardrails` on a {entity}.'
  False/None/empty requests do not opt out and pass, even when clearing an exemption.

  _set_object_metadata_field uses metadata or {}, then assigns even None/falsy values. At the pin a
  truthy premium field invokes _premium_user_check(field_name) before mutation; omit that licensing
  call only, testing native_no_license_metadata. _update_metadata_field checks premium truthiness
  first (the source check omits the feature argument), then moves an existing NON-NULL top-level
  value into metadata, overwriting the nested value. None stays top-level and does not clear a nested
  value; false, [], {}, 0 and '' are moved and persisted. Existing non-null malformed metadata can
  fail assignment after the top-level pop; preserve that partial in-memory mutation, not a copy.
  _update_metadata_fields visits premium fields first, then ordinary fields in declaration order.

  Iterate premium fields disable_global_guardrails, guardrails, policies, tags, team_member_key_duration,
  prompts, logging, secret_manager_settings, allowed_passthrough_routes; ordinary fields model_rpm_limit,
  model_tpm_limit, model_itpm_limit, model_otpm_limit, default_estimated_output_tokens,
  default_estimated_output_tokens_per_model, mcp_rpm_limit, tag_rpm_limit, rpm_limit_type, tpm_limit_type,
  enforced_params, temp_budget_increase, temp_budget_expiry, allowed_vector_store_indexes,
  enforced_batch_output_expires_after, enforced_file_expires_after, throttle_on_budget_exceeded,
  enable_prompt_caching, end_user_budget_id. Unknown fields remain untouched. These are metadata moves,
  not secret encryption; the eventual persistence owner must protect any credential-bearing values.


  Build the production management_guards module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/common_utils.py:
  validate_finite_spend (L13-L24; 11 source lines), validate_budget_duration (L27-L41; 13 source lines),
  validate_team_model_max_budget (L77-L123; 47 source lines), require_caller_user_id_for_non_admin (L126-L150;
  23 source lines), _check_passthrough_routes_caller_permission (L153-L177; 24 source lines), _check_disable_global_guardrails_caller_permission
  (L180-L205; 26 source lines), _set_object_metadata_field (L432-L456; 23 source lines), _update_metadata_field
  (L639-L661; 16 source lines), _update_metadata_fields (L675-L688; 12 source lines).


  Compare finite spend/budget amounts through checked Decimal conversion; these guards perform no SQL.


  Add the management_guards operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a management-guards-*
  seed to B171 helper_case, which already owns this decoder.


  The nine functions contain 143 nonblank noncomment lines excluding docstrings. Allow 160 production,
  280 tests, 100 adapters and 30 wiring lines, 570 within 650. Pure parity cases use premium_user=True
  to reach MIT validation; two complete native test names prove the license deviations outside parity.
