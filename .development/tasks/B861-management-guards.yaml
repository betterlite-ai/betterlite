  - 'litellm/proxy/management_endpoints/common_utils.py: B863 owns _user_has_admin_privileges (L224-L287),
    _org_admin_can_invite_user (L290-L317), _team_admin_can_invite_user (L320-L356), admin_can_invite_user
    (L359-L429).'
  - 'litellm/proxy/management_endpoints/common_utils.py::_has_non_empty_value: no production caller at
    the pinned commit; repository-wide identifier search finds only this definition.'
  - 'litellm/proxy/management_endpoints/common_utils.py::_has_non_empty_value (L664-L672): no production
    caller at the pinned commit; repository-wide identifier search finds only this definition.'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as management_guards in the server group. Replace the stub Op in tools/oracle/src/helpers/server/management_guards.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/management_guards.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Negative finite spend passes, while a negative team max_budget fails.
  - Clearing a metadata flag requires a falsy non-null value; null leaves it unmoved.
  - An existing integer 1 does not grant the guardrail exemption allowed by literal True.
budget:
