  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_utils.py#L639-L661
    why: Own _update_metadata_field; preserve caller-visible values and failure ordering.
