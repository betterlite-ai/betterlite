    (L492-L501), _is_set_budget_value (L504-L509), _has_meaningful_budget_limit (L512-L515), _upsert_budget_and_membership
    (L518-L636).'
  - 'litellm/proxy/management_endpoints/common_utils.py: B863 owns _user_has_admin_privileges (L224-L287),
    _org_admin_can_invite_user (L290-L317), _team_admin_can_invite_user (L320-L356), admin_can_invite_user
