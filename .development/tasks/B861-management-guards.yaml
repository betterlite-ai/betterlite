deviations:
  - what: Team model budgets and truthy premium metadata fields are available without a license instead of the MIT 403 enterprise-feature error.
    why: README's no-paid-tier decision; native_no_license_team_budget and native_no_license_metadata retain every duration, finite-value and caller-permission guard.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_utils.py#L77-L123
