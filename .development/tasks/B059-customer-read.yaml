id: B059
title: Customer info, list and daily activity
description: >-
  Own resolve_customer_daily_activity_scope L500-L512, customer_daily_activity_is_admin L515-L519,
  end_user_info L534-L577, list_end_user L849-L891 and get_customer_daily_activity L906-L958 in
  customer_endpoints.py. Register GET /customer/info, /customer/list, /customer/daily/activity and
  their /end_user equivalents once with B052 auth. Legacy aliases are absent from OpenAPI. Info
  returns CustomerResponse, list returns its array, activity SpendAnalyticsPaginatedResponse.

  Info requires end_user_id as a string query parameter; B003 owns the missing-parameter422. It has
  no additional caller-specific check. A missing database raises HTTP500 with the common database
  detail.error. B830's typed adapter over B726 EndUserRepository.find_first reads user_id with both
  litellm_budget_table and object_permission included. A missing row raises404 not_found, param
  end_user_id, message End User Id=<id> does not exist in db. Convert through B830 _to_customer_response,
  dropping reverse permissions relations and budget audit fields by the typed response schema.

  List checks PROXY_ADMIN or PROXY_ADMIN_VIEW_ONLY before database availability; all other roles get
  HTTP401 detail.error Admin-only endpoint. Your user role=<role>. Authorized callers without a
  database get HTTP400 common database detail, unlike info's500. Query all rows with both relations,
  without a route sort or pagination, and convert every row through the same response helper. Info
  and list catch every exception, log their route exception, and call B124 handle_exception_on_proxy:
  existing ProxyException fields survive, HTTP errors become internal_server_error with original
  status/detail and openai_error_param, other errors use status_code or500. These helpers are called
  here, unlike routes that have their own unrelated mapping.

  Activity also permits only proxy admin/view; there is no customer-self activity branch. Its401
  admin denial precedes the database500. Defaults are end_user_ids, exclude_end_user_ids, dates,
  model and api_key absent, page=1, page_size=10. Split truthy IDs on commas without trimming or
  deduplication; empty strings become None. The scope resolver loads aliases via B700 find_many_in
  for explicit IDs, otherwise find_many(where={}); metadata maps user_id to alias including null.
  Empty tuples remain empty scopes and missing rows do not produce404. Call B074 get_daily_activity
  with litellm_dailyenduserspend, entity_id_field=end_user_id, scope IDs, aliases, exclusions and every
  filter/page argument unchanged. Activity has no local except or handle_exception_on_proxy call;
  B003 global mapping handles raised HTTP errors. All paths are reads, with no cache mutation.

  Implement customer_read in betterlite-server with files below 300 lines and adjacent tests. B860
  provisions independent Postgres schemas using POSTGRES_TEST_URL or testcontainers; B001 HttpCase
  compares complete bodies/error fields on real routes, including all aliases. Reuse B003 decoding
  and B830 response contracts, with no new parser/fuzz target. Allow 145 production, 270 table-driven
  tests and 80 wiring lines, 495 within a 550-line gate.
scope:
  paths:
    - crates/betterlite-server/src/customer_read.rs
    - crates/betterlite-server/src/customer_read/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/customer-read/**
    - tools/oracle/helpers/b059.py
    - tools/oracle/helpers/b059/**
    - tools/oracle/src/helpers/server/b059.rs
    - tools/oracle/src/helpers/server/b059/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/customer_endpoints.py#L500-L577
    why: Scope helpers, info lookup, typed response and route catch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/customer_endpoints.py#L836-L958
    why: Alias registration, list/activity permissions, defaults and distinct error handling.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8205-L8241
    why: Actual shared mapper called by info and list only.
dod:
  - text: 'Named cases: six_aliases_and_legacy_schema_visibility, info_missing_query422,
      info_no_db500, info_missing_row404_all_fields, info_relations_and_response_field_projection,
      list_admin_and_view_only, list_role_denial_before_db401, list_no_db400,
      list_all_rows_no_route_pagination, info_list_exception_log_and_mapper,
      activity_admin_and_view_only_no_self_bypass, activity_denial_before_db401,
      activity_no_db500, activity_defaults_and_filter_passthrough,
      comma_ids_preserve_spaces_empty_segments_duplicates, alias_metadata_null_missing_rows,
      empty_scope_never_all, activity_table_entity_and_exclusions,
      activity_errors_not_locally_wrapped, no_database_writes.'
    proof: [behavior-tests, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Customer read scope, response or error behavior differs from the pinned route.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^customer_read::tests::/) - test(/replays_the_/)'
oracle_cases:
  - tools/oracle/cases/management/customer-read/info-and-alias.yaml
  - tools/oracle/cases/management/customer-read/info-missing-query-and-row.yaml
  - tools/oracle/cases/management/customer-read/list-admin-view-and-denial.yaml
  - tools/oracle/cases/management/customer-read/activity-admin-view-and-self-denial.yaml
  - tools/oracle/cases/management/customer-read/activity-filter-defaults.yaml
  - tools/oracle/cases/management/customer-read/three-no-database-statuses.yaml
deviations: []
out_of_scope:
  - B830 owns customer row adapters and response projection; B831 owns updates; B829 owns budgets.
  - B074 owns activity date validation, aggregation and pagination; B700 owns find_many_in.
pitfalls:
  - Info/list locally map exceptions, but activity does not. Their missing-database statuses differ.
  - Activity's admin-only check forbids an end user reading its own activity.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
