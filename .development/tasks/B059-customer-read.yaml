id: B059
title: Customer info, list and daily activity
description: >-
  Register customer/budget routes and implement customer/end_user info/list/daily-activity aliases through
  typed rows and DailyActivityRepository. Keep source admin-versus-self activity restrictions and response
  budget fields; the original ID is the final integration point for these services.


  Build the production customer_read module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/customer_endpoints.py:
  resolve_customer_daily_activity_scope (L500-L512; 13 source lines), customer_daily_activity_is_admin
  (L515-L519; 5 source lines), end_user_info (L534-L577; 37 source lines), list_end_user (L849-L891; 36
  source lines), get_customer_daily_activity (L906-L958; 47 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Register these actual HTTP routes and aliases exactly once: GET /customer/info -> end_user_info; GET
  /end_user/info -> end_user_info; GET /customer/list -> list_end_user; GET /end_user/list -> list_end_user;
  GET /customer/daily/activity -> get_customer_daily_activity; GET /end_user/daily/activity -> get_customer_daily_activity.
  For each route send a typed successful request, an invalid or missing target, and a caller lacking that
  route permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 138 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  138 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 351 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
