id: B5109
title: Close the B3761 Cisco MCP audit gaps
description: >-
  Fix the gaps an Opus review found in B3761's Cisco AI Defense MCP helpers after it merged. All six
  findings hold against LiteLLM: three are behavior gaps and three are tests or oracle cases that
  can't fail. The work stays in betterlite-guardrails under cisco_mcp::*, with the b3761 oracle helper
  operation and cases in tools/oracle/cases/guardrails/cisco/mcp-*. No deviation is added.

  Tool-context hydration. LiteLLM's _hydrate_mcp_tool_context reads the top-level
  mcp_tool_call_metadata first. Only when that value is None does it pick one nested dict,
  `request_data.get("metadata") or request_data.get("litellm_metadata")`, and it reads
  mcp_tool_call_metadata from that dict alone
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L429-L452).
  So a non-empty metadata dict without the key hides litellm_metadata, and a top-level value that is
  set but isn't a dict ends the lookup. context.rs's tool_call_metadata skips a non-object top-level
  value and then tries metadata and litellm_metadata in turn. It fills mcp_tool_name, tool_name and
  name where LiteLLM leaves them unset. betterlite then builds an /inspect/mcp payload and calls Cisco
  where LiteLLM's _build_mcp_request_payload returns None for want of a tool name
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L361-L400).
  The fix ports the selection as written. A top-level value that isn't null is used only when it is
  an object, and any other value stops hydration. Otherwise take metadata when Json::truthy says it is
  set, else litellm_metadata, and read mcp_tool_call_metadata only from that one object.

  Text rewrite. In LiteLLM's real flow the redaction target is kwargs["original_response"]. That is the
  CallToolResult the MCP server passes to post_call
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/operations.py#L2258-L2270),
  with the hook's content list as the fallback
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L145-L173).
  _set_mcp_tool_response_text rewrites text items in place
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L531-L580).
  On a CallToolResult, hasattr(response_obj, "structured_content") is always true, because mcp 2.x
  declares the field with a None default. So LiteLLM always sets structured_content to
  {"result": text} and returns True, even when the model had no structured content or held only an
  image. On a plain dict it rewrites structured_content or structuredContent, under result when result
  is a dict and on the dict itself otherwise, and only when the key is already there. On a list of
  (key, value) pairs it replaces an existing structuredContent pair. A bare content list gets no mirror.
  LiteLLM's logging keeps a changed structured_content on the result it returns to the client
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L1633-L1695).

  B3761's convention stays. A JSON object with a content list stands for the CallToolResult model, an
  object with a non-null mcp_tool_call_response stands for MCPPostCallResponseObject, and any other
  object is a dict. redact.rs gets two things wrong. update_structured_mirror mirrors a model only when
  the key already exists, so a CallToolResult without structuredContent gets no mirror and an
  image-only result reports replaced false. And TextUpdate carries a detached content list and a
  StructuredMirror with no location. Its only appliers, the b3761 and b3757 oracle adapters, write the
  mirror at the top level and lose the result-nested, wrapped and pair-list shapes. Once the post-call
  hook is wired, the structuredContent a client reads would be missing or stale.

  The fix makes set_tool_response_text return the rewritten response next to replaced, the way
  blocking::replace_tool_response returns a ReplacedResponse for the block path. TextUpdate keeps its
  name and becomes a response plus replaced, with no content or structured_content field of its own.
  The response is a Serialize type in the input's shape: the wrapper with its inner response
  rewritten, the model object with its content items and mirror, the dict with the mirror under
  result or on itself, the pair list with its pairs, and the bare list. A model object always gets
  {"result": text} and counts as replaced. The mirror goes under structured_content when the object
  already uses that key, else under structuredContent. A dict keeps the key-exists rule.
  cisco_redaction::mcp's apply_redaction_mcp_output keeps returning Option<TextUpdate>, and
  cisco_verdict_enforcement::finalize passes it through as before. The b3757 adapter's
  rewrite_mcp_output serializes update.response instead of rebuilding the mirror, and
  apply-redaction-mcp-output.yaml keeps passing. blocking.rs's comment above
  replacement_structured_content says the SDK model only exposes camelCase fields. mcp 2.x declares
  structured_content with a camelCase alias, so the comment says that, or goes.

  Weak tests and cases. The b3761 adapter's rewrite_text in tools/oracle/src/helpers/guardrails/b3761.rs
  writes its own top-level mirror and drops content updates for objects, so the rewrite cases test the
  adapter and not the crate. It now serializes update.response and writes nothing of its own.
  mcp-blocking-response-with-string-detail.yaml and mcp-blocking-response-with-error-dict.yaml ignore
  /value/result/mcp_tool_call_response/0/text. That text is the whole JSON payload LiteLLM builds
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L175-L211),
  so both cases pass whatever payload betterlite writes. Both adapters' blocking_response now put the
  parsed payload in place of that text (json.loads in Python, serde_json::from_str in Rust), and the
  ignore comes out of both cases. context/tests.rs's hydration_populates_arguments_and_server_name
  compares mcp_arguments with arguments. With argument hydration removed both are None and it still
  passes. It now asserts that each holds the metadata's {"q": "x"}.

  The Python adapter tools/oracle/helpers/b3761.py gets three functions so cases can send the shapes
  LiteLLM sees. rewrite_model_text builds a CallToolResult with model_result, extended to build
  ImageContent for image items, and returns model_dump(exclude_none=True, by_alias=True,
  exclude={"result_type"}). rewrite_field_tuples_text turns the pairs into tuples and returns them as
  lists. rewrite_wrapped_text builds MCPPostCallResponseObject from TextContent items and
  HiddenParams() and returns model_dump(exclude_none=True, by_alias=True). The Rust Input enum maps all
  three to the one rewrite_text handler, the way normalize_model shares normalize_response.
scope:
  paths:
  - crates/betterlite-guardrails/src/cisco_mcp/context.rs
  - crates/betterlite-guardrails/src/cisco_mcp/context/tests.rs
