id: B751
title: Key budget thresholds and alert inputs
description: >-
  Implement key hard/multi-window/soft checks and budget-alert inputs. Hard checks do nothing for
  max_budget=None. Otherwise call B2321 with spend:key:<token>, fallback spend or zero and max_budget,
  schedule token_budget with token/spend/max/soft/user/team/org/email/key_alias and event_group=key,
  then test finite spend>=max_budget. The alert is scheduled even below the limit and before denial.
  B2325's throttle policy may instead set only request-local budget_throttle_pct and permit the request;
  stored RPM/TPM limits remain unchanged. Hard denial carries BudgetExceededError current_cost,
  max_budget, entity_type=key and entity_id=token. Its message uses key_alias or 'key', adding key_name
  only if it fully matches sk-\.\.\.(?:[^\s\x00-\x1f\x7f-\x9f]{4})?. Never echo a raw key_name.

  Multi-window checks iterate budget_limits in order, accepting dict or typed rows. Counter names are
  spend:key:<token>:window:<budget_duration>, with zero fallback, max budget, entity_type='Key', token,
  string duration and B2325 get_budget_window_start. A finite maximum rejects at equality; stop at
  the first failure. Throttling is not used here. Preserve the diagnostic's four-decimal spend and
  two-decimal limit formatting, with key entity fields. The stale source comment about never reseeding
  windows does not override get_current_spend's actual maintained-window lookup.

  Soft checks use token.spend, not the cross-pod reader; a truthy soft_budget and spend>=soft_budget
  DEBUG-log and schedule soft_budget without denial. Its CallInfo additionally carries team_alias.
  All alert tasks are owned by B4025's budget_alerts sink and are not awaited on the request path; capture scheduling
  order in tests and drain tasks at shutdown. No database write occurs in these checks.

  Email parsing accepts a list of trimmed nonempty strings, or a comma-separated string; tuple/other
  inputs become []. Normalize each threshold, then union global and per-key mappings, deduplicating
  recipients global-first. Empty mappings merge to None; threshold iteration order is not defined.
  Key alerts read litellm_settings.default_key_max_budget_alert_emails=None and metadata.max_budget_alert_emails.
  They require a nonnull maximum and positive nonnull token.spend. A nonempty merged map uses the
  minimum digit-only threshold, with no 1..100 validation; no numeric threshold means no alert.
  At/above the minimum percentage schedule max_budget_alert with the merged map, even beyond max budget.
  Without a map, use EMAIL_BUDGET_ALERT_MAX_SPEND_ALERT_PERCENTAGE (float env, default 0.8) and alert
  only at/above that fraction but strictly below max budget. Include owner email and all key identity
  fields, team_alias and event_group=key; only this legacy branch DEBUG-logs the threshold.

  Team-member alerts read team metadata team_member_max_budget_alert_emails. Invalid mapping input
  is silently discarded; accept only digit threshold strings of length<=3 and integer value 1..100.
  Invalid entries drop silently, not with the old invented warning. Parse recipients as above; unsupported
  values become None then []. No global email config is merged. Positive spend at/above the lowest
  threshold schedules max_budget_alert with team/user/org/email fields, event_group=team_member and
  the map; spend at/above the hard limit is still alertable.

  Temporary increases require both metadata.temp_budget_increase and temp_budget_expiry. Parse the
  latter with datetime.fromisoformat semantics, treating a naive value as UTC; only expiry>now applies.
  Missing/expired/equal expiry returns None; invalid date/type propagates. A None max budget skips
  parsing; a falsey increase keeps the original token. A truthy increase (including negative) returns
  a copy with max_budget+increase, preserving the original. B757 owns budget's default 422 envelope.


  Build the production auth_key_budgets module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _apply_budget_exceeded_throttle (L5461-L5476; 15 source lines), _virtual_key_max_budget_check (L5479-L5556;
  56 source lines), _virtual_key_multi_budget_check (L5559-L5600; 38 source lines), _virtual_key_soft_budget_check
  (L5603-L5639; 34 source lines), _parse_email_list (L5642-L5648; 7 source lines), _normalize_alert_emails
  (L5651-L5661; 10 source lines), _merge_budget_alert_email_configs (L5664-L5680; 17 source lines), _virtual_key_max_budget_alert_check
  (L5683-L5762; 72 source lines), _is_valid_alert_threshold_pct (L5769-L5770; 2 source lines), _alert_recipients
  (L5773-L5776; 4 source lines), _valid_alert_threshold_config (L5779-L5786; 8 source lines), _team_member_max_budget_alert_check
  (L5789-L5820; 32 source lines). litellm/proxy/auth/user_api_key_auth.py: _get_temp_budget_increase (L3615-L3623;
  9 source lines), _update_key_budget_with_temp_budget_increase (L3626-L3634; 9 source lines).


  Use checked finite money values for arithmetic while retaining the source's explicit isfinite
  predicate outcomes for nonfinite inputs; Decimal conversion must not invent a denial or alert.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.default_key_max_budget_alert_emails=None;
  EMAIL_BUDGET_ALERT_MAX_SPEND_ALERT_PERCENTAGE=0.8.


  Add the auth_key_budgets operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-key-budgets-*
  seed to B171 helper_case, which already owns this decoder.


  POST /v1/chat/completions tests hard/multi-window denial and temporary increases through B732
  admission with B757's budget_exceeded envelope. Assert soft-budget alerts never deny a request.


  B860 uses POSTGRES_TEST_URL or testcontainers to seed hard/soft/window limits independently;
  ordered alert records must identify the correct key without exposing a raw key_name.


  Loader cases alert_config_default_none, global_email_map_loaded, alert_fraction_default,
  alert_fraction_env_override and invalid_alert_fraction_stops_startup exercise B002 and the consumer.
  The env is parsed with float at import; empty/nonnumeric input fails, not falls back. Zero/negative
  and nonfinite fractions retain their comparison semantics with typed classifications.


  Email fields are already parsed records; do not invent JSON decoding. The actual outside-string
  decoder is parse_temp_budget_expiry(&str), shared by production and the auth_key_budgets fuzz target
  in B733's workspace. Replay ISO date-only/basic/offset/naive/fractional formats, malformed UTF-8
  at the outer boundary, invalid dates and overlong input. Cap new timestamp input at 1048576 bytes;
  there is no JSON-depth limit for a timestamp. Name the replay replays_the_auth_key_budgets_corpus.


  No premium gate surrounds these budget checks. Timestamp bounds are tested as a native decoder
  difference; ordinary expiry arithmetic and email filtering remain source-comparison cases.


  Sizing: 313 source lines; allow 260 production, 300 named table tests, 70 adapters, 55 wiring,
  45 parser/fuzz and 60 config, 790 within 800. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: expiry_input_limit.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Server wiring tests live under betterlite-server::auth::auth_key_budgets::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
