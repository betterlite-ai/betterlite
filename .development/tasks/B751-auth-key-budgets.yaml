dod:
  - text: 'Admission cases: no_max_no_io, cross_pod_hard_counter, alert_before_hard_result,
      equal_max_denied, nonfinite_max_not_denied, throttle_request_only,
      unmasked_name_not_echoed, masked_name_regex, each_call_info_field,
      window_duration_counter, window_start_forwarded, first_window_stops,
      multi_window_no_throttle, zero_soft_budget_skips, soft_uses_token_spend,
      equal_soft_alert_only and alerts_not_awaited.'
    proof:
      - behavior-tests
  - text: 'Email cases: list_and_csv_trim, nonlist_sequence_ignored, global_first_dedup,
      threshold_union, empty_merge_none, key_map_min_digit_threshold,
      invalid_key_threshold_no_alert, key_threshold_outside_range_kept,
      mapped_alert_at_or_over_max, legacy_fraction_boundary, legacy_max_excluded,
      member_invalid_map_silent, member_threshold_bounds_length, member_recipients_coercion,
      member_no_global_merge and member_positive_spend_threshold. Compare ordered scheduling
      and fields, not undefined threshold-map iteration order.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Temporary cases: both_fields_required, naive_expiry_utc, offset_expiry,
      expiry_equal_inactive, invalid_expiry_propagates, no_max_skips_parse,
      zero_increase_same_token, negative_increase_applies and increase_copies_token.
      HTTP cases assert default budget 422 and malformed-expiry auth 401; repository fixtures
      run on POSTGRES_TEST_URL or testcontainers.'
    proof: [behavior-tests, stage-wiring-tests, oracle]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The production parse_temp_budget_expiry decoder is used by the service and its fuzz target and
      rejects malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: expiry_input_limit checks the precise timestamp cap through production parsing.
    proof:
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(/^(auth::)?auth_key_budgets::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_key_budgets.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-key-budgets-*")"
        && grep -rlq "auth_key_budgets" tools/oracle/fuzz/corpus/helper_case/auth-key-budgets-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_key_budgets::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-key-budgets-*")"
        && grep -rlq "default_key_max_budget_alert_emails" crates/betterlite-config/fuzz/corpus/config_yaml/auth-key-budgets-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/auth_key_budgets.rs && grep -q "auth_key_budgets"
        crates/betterlite-auth/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-auth/fuzz/corpus/auth_key_budgets)" && cargo nextest run --locked -p betterlite-auth
        --no-tests=fail -E 'test(replays_the_auth_key_budgets_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_key_budgets::tests::/)
        - test(/replays_the_/)'
