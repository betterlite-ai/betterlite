dod:
  - text: Each of the four entry points marks its async entry key, moves generationConfig into config only when config is None, reads systemInstruction before system_instruction, and calls setup once before dispatching.
    proof: [dispatch-tests]
  - text: When setup returns no provider config, the call goes to the chat-compatibility handler (sync or async), with tools passed on every path except the sync stream entry point, and with `stream` removed from the loose fields and passed as true on both stream entry points.
    proof: [dispatch-tests]
  - text: When setup returns a provider config, the call goes to the native HTTP handler with extra_body from the native-field merge, the timeout defaulting to REQUEST_TIMEOUT for a missing or zero value, and client and litellm_metadata read from the loose fields.
    proof: [dispatch-tests]
  - text: A string mock_response makes generate_content and agenerate_content return the mock object before setup, and the two stream entry points do not return a mock (without stream in the loose fields they fail through exception mapping).
    proof: [mock-tests, oracle]
  - text: mock_generate_content_response returns LiteLLM's exact JSON, with and without a custom text.
    proof: [mock-tests, oracle]
  - text: Any failure inside an entry point is returned through exception_type with the model and provider, and the stream entry point without a provider resolves it from the model only.
    proof: [error-mapping-tests]
