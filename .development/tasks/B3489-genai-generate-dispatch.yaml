id: B3489
title: Dispatch GenAI generation and streaming calls
description: >-
  Build the four public entry points of LiteLLM's Google GenAI generation API in betterlite-core, module `api::genai::generate_content`: `generate_content`, `agenerate_content`, `generate_content_stream` and `agenerate_content_stream`, plus `mock_generate_content_response`.
  Each entry point takes one request record, `GenerateContentRequest`: model, contents, optional config (a JSON object), optional tools, extra_headers, extra_query, extra_body, optional timeout, optional custom_llm_provider, and the loose caller fields LiteLLM carries in **kwargs (a JSON object that holds `litellm_logging_obj` data, `litellm_call_id`, `mock_response`, `stream`, `client`, `litellm_metadata`, `systemInstruction`, `system_instruction`, `generationConfig` and the native top-level fields).
  The collaborators come in through one constructor-injected record, `GenerateContentDeps`: B3483's setup function (`setup_generate_content_call`, `_merge_native_request_fields`, `_mark_async_entrypoint`, `GenerateContentSetupResult`), B3486's chat-compatibility handlers, B3488's native HTTP handlers, B174's `get_llm_provider`, B185 and B186's `exception_type` mapping, and B198's default request timeout (REQUEST_TIMEOUT, 6000 seconds). This task owns only the dispatch between them; it re-implements none of them.
  Shared steps in every entry point, in this order. First mark the async entry point through B3483's helper: `generate_content` marks key `agenerate_content` with the `_is_async` flag it popped from the loose fields, and the two stream entry points mark key `agenerate_content_stream` (always true for the async one, the popped flag for the sync one). Then, when `generationConfig` is in the loose fields and `config` is None, move it into `config` (remove it from the loose fields). When `config` is already set, leave `generationConfig` in the loose fields untouched. Then call B3483's setup. Then read `systemInstruction` first and `system_instruction` second from the loose fields (an empty value falls through to the second name). Then dispatch.
  Dispatch rule: when the setup result has no provider config, hand the call to B3486's chat-compatibility handler with the setup result's `generate_content_config_dict` as config and its `litellm_params`; otherwise call B3488's native HTTP handler with model, custom_llm_provider, config dict, litellm_params, logging object and provider config (all taken from the setup result), `extra_headers`, `extra_body` from B3483's merge of native fields and the caller's extra_body, `timeout or request_timeout` (a zero or missing timeout takes the default), `client` and `litellm_metadata` (default empty object) from the loose fields, and the system instruction.
  Per entry point. `generate_content` (sync): pop `agenerate_content` (default false) as `_is_async`; if `mock_response` in the loose fields is a string, return `mock_generate_content_response(mock_response)` before setup; adapter path passes tools and `_is_async` and does not touch `stream`; native path passes `_is_async` and no `stream`. `agenerate_content`: set `agenerate_content` true in the loose fields, move `generationConfig`, resolve the provider through B174 when `custom_llm_provider` is None (so errors can be mapped), then run the same body as `generate_content` on the async path. There is no thread pool and no copied context-var scope in betterlite: B198 injects call context, so the async entry point calls the async body directly. `generate_content_stream` (sync): pop `agenerate_content_stream` as `_is_async`; no mock check; on the adapter path remove `stream` from the loose fields, pass `stream` true and do NOT pass tools; on the native path pass `stream` true and `_is_async`. `agenerate_content_stream` (async): set `agenerate_content_stream` true, mark, move `generationConfig`, resolve the provider through B174 when custom_llm_provider is None passing only the model (the `base_url` read in LiteLLM always sees None, because `local_vars` holds only the named parameters), run setup, then on the adapter path remove `stream`, call B3486's async handler with `stream` true and tools, and on the native path call B3488's async handler with `stream` true and `_is_async` true.
  `mock_generate_content_response(mock_response)` defaults to "This is a mock response from Google GenAI generate_content." and returns the JSON object with `text`, one candidate (`content.parts[0].text`, `content.role` "model", `finishReason` "STOP", `index` 0, `safetyRatings` an empty list) and `usageMetadata` promptTokenCount 10, candidatesTokenCount 20, totalTokenCount 30.
  Every failure inside an entry point goes through B185/B186's `exception_type` with the model, the custom_llm_provider as the caller gave it (the async entry points may have resolved it), the request fields as completion_kwargs and the loose fields as extra_kwargs, and the mapped error is the one returned. Errors keep their original cause attached.
