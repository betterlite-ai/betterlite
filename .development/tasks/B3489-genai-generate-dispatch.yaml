deviations:
  - what: agenerate_content calls the async body directly and does not run the sync function in a thread pool with a copied context-var scope.
    why: Rust has no thread executor step here, and B198 injects the call context that LiteLLM carries in context vars.
  - what: The adapter fallback and the native HTTP handler are injected collaborators (GenerateContentDeps), not module-level singletons.
    why: The rules require constructor wiring; LiteLLM's module-level base_llm_http_handler has no counterpart.
out_of_scope:
  - "B3483 owns GenerateContentHelper.setup_generate_content_call, GenerateContentSetupResult, _merge_native_request_fields and _mark_async_entrypoint; this task only calls them."
  - "B3486 owns GenerateContentToCompletionHandler (litellm/google_genai/adapters/handler.py); B3488 owns BaseLLMHTTPHandler.generate_content_handler."
  - "B5368 owns the @client call wrapper (logging object creation, litellm_call_id, caching, callbacks) around these functions; this task receives the logging data already in the loose fields."
  - "B3487 owns the streaming iterators in litellm/google_genai/streaming_iterator.py; B3506 owns the HTTP routes that call these entry points."
  - "litellm/google_genai/__init__.py re-exports and the lazy `from litellm.google_genai import generate_content` surface belong to B098 as an umbrella file with no logic."
pitfalls:
  - The two stream entry points never check mock_response themselves, but setup raises "Mock response should be handled by caller" for a string mock when `stream` is not set in the loose fields, so a stream call with a string mock and no stream flag fails, and with stream true it proceeds to a real provider call.
  - generate_content_stream (sync) calls the chat handler without tools, while generate_content and agenerate_content_stream pass tools; keep this difference, a fix would change what the provider sees.
  - agenerate_content_stream resolves the provider with get_llm_provider(model, api_base=local_vars.get("base_url")), and local_vars never holds base_url, so api_base is always None; pass only the model.
  - generationConfig is moved only when config is None; when config is set the key stays in the loose fields and flows on to setup and the chat handler.
  - systemInstruction wins over system_instruction by truthiness, so an empty string or null for the first falls through to the second.
  - "`timeout or request_timeout` replaces 0 as well as None, so a zero timeout becomes REQUEST_TIMEOUT (6000 seconds)."
  - The adapter paths of the stream entry points remove `stream` from the loose fields before the call and pass stream true by name; the non-stream adapter path leaves a caller-supplied `stream` in place.
  - The mock check in generate_content runs after the async marker and generationConfig move but before setup, so a mock call never needs a logging object.
review_level: standard
