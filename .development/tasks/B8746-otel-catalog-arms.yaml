id: B8746
title: Catalog arms for the OpenTelemetry family of callback names
description: >-
  Twelve callback names build an OpenTelemetry based logger, and each arm chooses between the V2 adapter and a legacy
  class owned by a different task: otel, arize, arize_phoenix, levo, agentops, langtrace, signoz, logfire, traceloop,
  langfuse_otel, weave_otel and the global newrelic logger. No logger task owns these arms, since each spans two or
  three of them. This task fills eleven of the twelve catalog modules from B8741 so the names resolve to loggers.
  agentops stays main's stub answering CatalogError::Unavailable: AgentOps fetches its JWT asynchronously at init
  (AgentOpsCallback::connect) and the catalog builder is synchronous, so B10008 (deferred) adds that arm with a startup
  fetch.


  Code goes in crates/betterlite-logging/src/registry/catalog/<name>.rs and <name>/ for the eleven names, plus
  registry/catalog/otel/phoenix_auto.rs for `_maybe_auto_initialize_arize_phoenix` (L5272-L5313). Each build returns
  an Arc<dyn CallbackLogger>. OpenTelemetryV2 implements B8740's trait through B3852, the legacy OpenTelemetry through
  B3859 and the New Relic agent logger through B3942. Arize, Phoenix, Levo, Logfire, Traceloop, Weave and Langfuse OTel
  are configurations of one of the two OpenTelemetry loggers, built by B3862, B3863 and B3910; where one is a separate
  type, implement the trait for it here by forwarding to its inner logger.


  The runtime. B8910's V2 factory needs a LoggerRuntime, and the catalog has none today. Add
  `LoggerCatalog::with_runtime(self, runtime: Arc<LoggerRuntime>) -> Self` in registry/catalog.rs; CatalogInputs keeps its
  six fields, so the struct literals in other tests stay as they are. LoggerCatalog may gain fields for the runtime, for
  the ordered list of every logger it built (LiteLLM's _in_memory_loggers, which maybe_construct_otel_v2 and B8910's
  selection read) and for the values the legacy arms share; update the counting_catalog literal in
  registry/catalog/tests.rs to match, and expose the list read-only so publication reads the same order. Nothing builds
  the exporter HttpClients (B3848's plumbing::exporters::HttpClients) outside tests yet, and the legacy arms and B10007's
  runtime both need them: add one pub function, otlp_http_clients, in registry/catalog/otel/ that builds an OtlpClient
  per signal over inputs.http's ProxyPolicy with the TLS B3842's resolve_otlp_http_tls picks. The legacy arms use it,
  and B110 calls it for the runtime. The eleven arms receive the runtime and that list through the dispatch
  in catalog.rs; every other arm keeps its `build(inputs)` signature. B10007 builds the production runtime, and B110
  calls `with_runtime` at startup, from the call site where B8742's Slot::new builds the catalog. Until a runtime is
  injected, an arm whose V2 switch is on (LITELLM_OTEL_V2 through B3842's otel_settings::FeatureFlag over inputs.env)
  returns CatalogError::Unavailable with its own name, which stops startup with an error that names the callback. It
  never falls back to the legacy logger in that case. With the switch off, the legacy path needs no runtime.


  The shared shape (arize L4710-L4737, arize_phoenix L4739-L4763, levo L4765-L4788, langtrace L4941-L4962, signoz
  L4964-L4995, langfuse_otel L5013-L5025, weave_otel L5026-L5049): first call B8910's `maybe_construct_otel_v2` for the
  name with the runtime and the ordered list; when it gives a V2 logger (B3852's OpenTelemetryV2) return it. Otherwise
  build the legacy logger: Arize and Phoenix from B3862, Levo, Logfire, Traceloop and Weave from B3863, LangfuseOtelLogger
  from B3910, the generic legacy OpenTelemetry from B3868 for langtrace and signoz with the endpoint and header each arm
  computes. langtrace requires LANGTRACE_API_KEY and signoz requires the SigNoz ingestion endpoint variable: without it
  return CatalogError::Init with LiteLLM's ValueError text, before trying V2 or checking the runtime, as the arms check it
  first. Every arm reads the environment through inputs.env, never std::env.


  otel (L4790-L4828): when LITELLM_OTEL_V2 is on (B3842's otel_v2 feature flag), build the V2 logger from
  `inputs.callback_settings["otel"]` (LiteLLM's _get_custom_logger_settings_from_proxy_server) through the runtime's
  build_otel_v2_logger; otherwise build the legacy OpenTelemetry from the same settings: copy the attributes setting into
  OpenTelemetryConfig.attributes and build B3857's metric attribute filter from that config before calling B3868's init
  (LiteLLM's __init__ L395-L415), so a bad otel.attributes returns CatalogError::Init before any provider is built or the
  logger registers. Every legacy arm builds the filter from its config the same way. Both paths then run the Phoenix auto
  start: when the Phoenix variables are set and no arize_phoenix logger exists, resolve arize_phoenix too. That needs the
  catalog, so phoenix_auto.rs returns a flag and LoggerCatalog's otel arm resolves arize_phoenix after storing otel.


  The attributes setting. Today the config layer drops callback_settings.otel.attributes: otel_settings::RawOtel declares
  no such key, and a nested value is not in callback_settings.rs's OTEL_NESTED_KEYS, so a mapping fails the load as
  unsupported. Carry it typed in betterlite-config, which cannot use betterlite-logging's OtelModelValue since logging
  depends on config: in crates/betterlite-config/src/sections/otel_settings.rs add an attributes field to RawOtel and
  `pub attributes: Option<OtelAttributes>` to Settings, where OtelAttributes holds include_list and exclude_list as
  Option<Vec<String>> (LiteLLM's OTELMetricAttributeFilter, opentelemetry.py L170-L187), and add "attributes" to
  OTEL_NESTED_KEYS in callback_settings.rs (that one entry is the only change there). In the same section add
  `pub configured_excluded_services: Option<Vec<String>>`: the top-level callback_settings.otel.excluded_services as
  written, in the CSV or list form RawOtel already reads, None when absent or null and Some even when empty, without the
  LITELLM_OTEL_EXCLUDED_SERVICES merge that excluded_services gets. Nothing here reads it; B110 hands it to B10007's
  runtime as configured_exclusions (logger.py L911-L922), and it sits in this task because the section file changes here
  anyway. Tests go in sections::otel_settings::tests with names starting metric_attributes_ and configured_exclusions_.
  In betterlite-logging, convert OtelAttributes into an OtelModelValue mapping that holds only the keys that are set, and
  build the production CallbackSettingsView (B3857's port, legacy_metrics::filter) as a struct over that value in
  registry/catalog/otel/. The legacy arms' metric recorders take it, and B110 passes the same value to B10007's runtime.


  logfire (L4884-L4903) builds the legacy OpenTelemetry with LOGFIRE_TOKEN and LOGFIRE_BASE_URL (default
  https://logfire-api.pydantic.dev). traceloop is the set_callbacks name (L4463-L4464) for B3863's Traceloop logger;
  TraceloopLogger has a private tracer field and no constructor, so add `pub fn new(tracer: SdkTracer) -> Self` in
  crates/betterlite-logging/src/otel/callbacks/traceloop.rs and change nothing else there. newrelic (L5161-L5180) is
  reached here only without a team key (B8742 asks B8655 first): V2 when maybe_construct_otel_v2 gives one, else B3942's
  New Relic agent logger.


  Tests in each <name>/tests.rs with a fake environment, and a runtime from logger_runtime's test support (its fixture()
  and fixture_disabled()) where a test needs one. Those builders are pub(crate) but sit in private modules, so change
  `mod tests;` in otel/logger_runtime.rs and `mod support;` in otel/logger_runtime/tests.rs to `pub(crate) mod` and
  nothing else in those two files; copying the fakes would trip the similarity check. Cases: the legacy path when V2 is off, the V2 path when on with a runtime, Unavailable naming the arm when V2 is on
  without a runtime, the Init error for a missing required variable, for otel that Phoenix variables also produce an
  arize_phoenix logger, and for legacy otel that an attributes setting with both include_list and exclude_list gives
  CatalogError::Init.
