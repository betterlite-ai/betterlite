dod:
  - text: Each of the twelve names builds the V2 logger when its preset is enabled and the legacy logger otherwise, reading every variable through the injected environment.
    proof: [otel-arm-tests]
  - text: langtrace and signoz without their required variable give LiteLLM's init error before any V2 attempt.
    proof: [otel-arm-tests]
  - text: otel picks V2 or legacy by LITELLM_OTEL_V2 and starts arize_phoenix when the Phoenix variables are set.
    proof: [otel-arm-tests]
checks:
  optional: []
  commands:
    - id: otel-arm-tests
      why: an arm is missing, ignores the V2 switch or skips a required variable check
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^registry::catalog::(otel|arize|arize_phoenix|levo|agentops|langtrace|signoz|logfire|traceloop|langfuse_otel|weave_otel|newrelic)::/)'
oracle_cases: []
deviations:
  - what: The otel name always gets its own legacy OpenTelemetry logger; LiteLLM returns any plain OpenTelemetry instance built earlier, so after langtrace, signoz or logfire, otel reuses that one.
    why: That reuse sends otel spans to another vendor's endpoint, which reads as a LiteLLM accident; each name keeps its own logger here.
out_of_scope:
  - "_maybe_construct_otel_v2: B3851. The loggers themselves: B3853, B3862, B3863, B3868, B3910 and B3942. The newrelic team arm: B8655."
pitfalls:
  - The langtrace and signoz arms raise before they try V2, so a missing key fails even when LITELLM_OTEL_V2 is on.
  - The arize and levo arms set OTEL_EXPORTER_OTLP_TRACES_HEADERS in the process environment; pass the header to the exporter config instead of writing the environment.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
