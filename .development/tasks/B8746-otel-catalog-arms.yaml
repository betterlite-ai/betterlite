id: B8746
title: Catalog arms for the OpenTelemetry family of callback names
description: >-
  Twelve callback names build an OpenTelemetry based logger, and each arm chooses between the V2 adapter and a legacy
  class owned by a different task: otel, arize, arize_phoenix, levo, agentops, langtrace, signoz, logfire, traceloop,
  langfuse_otel, weave_otel and the global newrelic logger. No logger task owns these arms, since each spans two or
  three of them. This task fills the twelve catalog modules from B8741 so the names resolve to loggers.


  Code goes in crates/betterlite-logging/src/registry/catalog/<name>.rs and <name>/ for the twelve names, plus
  registry/catalog/otel/phoenix_auto.rs for `_maybe_auto_initialize_arize_phoenix` (L5272-L5313). Each build returns
  an Arc<dyn CallbackLogger>. OpenTelemetryV2 implements B8740's trait through B3852, the legacy OpenTelemetry through
  B3859 and the New Relic agent logger through B3942. Arize, Phoenix, AgentOps, Levo, Logfire, Traceloop, Weave and
  Langfuse OTel are configurations of one of the two OpenTelemetry loggers, built by B3862, B3863 and B3910; where one
  is a separate type, implement the trait for it here by forwarding to its inner logger.


  The shared shape (agentops L4513-L4523, arize L4710-L4737, arize_phoenix L4739-L4763, levo L4765-L4788, langtrace
  L4941-L4962, signoz L4964-L4995, langfuse_otel L5013-L5025, weave_otel L5026-L5049): first call B3851's
  `_maybe_construct_otel_v2` equivalent for the name; when it gives a V2 logger (B3853's OpenTelemetryV2) return it.
  Otherwise build the legacy logger: Arize and Phoenix from B3862, AgentOps, Levo, Logfire, Traceloop and Weave from
  B3863, LangfuseOtelLogger from B3910, the generic legacy OpenTelemetry from B3868 for langtrace and signoz with the
  endpoint and header each arm computes. langtrace requires LANGTRACE_API_KEY and signoz requires the SigNoz ingestion
  endpoint variable: without it return CatalogError::Init with LiteLLM's ValueError text, before trying V2, as the arms
  check it first. Every arm reads the environment through inputs.env, never std::env.


  otel (L4790-L4828): when LITELLM_OTEL_V2 is on (B3853's is_otel_v2_enabled), build the V2 logger from
  `inputs.callback_settings["otel"]` (LiteLLM's _get_custom_logger_settings_from_proxy_server); otherwise build the
  legacy OpenTelemetry from the same settings. Both paths then run the Phoenix auto start: when the Phoenix variables
  are set and no arize_phoenix logger exists, resolve arize_phoenix too. That needs the catalog, so phoenix_auto.rs
  returns a flag and LoggerCatalog's otel arm resolves arize_phoenix after storing otel; add that one call to the otel
  branch of the match in catalog.rs (the only line of catalog.rs this task changes).


  logfire (L4884-L4903) builds the legacy OpenTelemetry with LOGFIRE_TOKEN and LOGFIRE_BASE_URL (default
  https://logfire-api.pydantic.dev). traceloop is the set_callbacks name (L4463-L4464) for B3863's Traceloop logger.
  newrelic (L5161-L5180) is reached here only without a team key (B8742 asks B8655 first): V2 when
  _maybe_construct_otel_v2 gives one, else B3942's New Relic agent logger.


  Tests in each <name>/tests.rs with a fake environment: the legacy path when V2 is off, the V2 path when on, the
  Init error for a missing required variable, and for otel that Phoenix variables also produce an arize_phoenix logger.
