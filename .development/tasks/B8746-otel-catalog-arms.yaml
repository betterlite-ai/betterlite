dod:
  - text: Each of the eleven names builds the V2 logger through the injected runtime when its preset is enabled and the legacy logger otherwise, reading every variable through the injected environment.
    proof: [otel-arm-tests]
  - text: With the V2 switch on and no runtime injected, each of the eleven names gives CatalogError::Unavailable naming itself and builds no legacy logger.
    proof: [otel-arm-tests]
  - text: langtrace and signoz without their required variable give LiteLLM's init error before any V2 attempt.
    proof: [otel-arm-tests]
  - text: otel picks V2 or legacy by LITELLM_OTEL_V2 and starts arize_phoenix when the Phoenix variables are set.
    proof: [otel-arm-tests]
  - text: >-
      The legacy otel arm builds the metric attribute filter from callback_settings.otel.attributes before B3868's init,
      so an attributes setting with both lists gives CatalogError::Init and registers no logger.
    proof: [otel-arm-tests]
  - text: callback_settings.otel.attributes loads as include_list and exclude_list, and the explicit excluded_services list keeps an absent key apart from an empty list.
    proof: [config-tests]
  - text: The catalog, Traceloop and config section tests that already pass keep passing with with_runtime, the Traceloop constructor and the two new config fields.
    proof: [covered-tests]
checks:
  optional: []
  commands:
    - id: otel-arm-tests
      why: an arm is missing, ignores the V2 switch or the missing runtime, or skips a required variable check
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^registry::catalog::(otel|arize|arize_phoenix|levo|langtrace|signoz|logfire|traceloop|langfuse_otel|weave_otel|newrelic)::/)'
    - id: config-tests
      why: the config layer still drops otel.attributes or folds an absent excluded_services into an empty one
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::otel_settings::tests::(metric_attributes|configured_exclusions)_/)'
    - id: covered-tests
      why: the runtime injection, the Traceloop constructor or the new config fields break tests that pass on main
      run: grep -q 'fn with_runtime' crates/betterlite-logging/src/registry/catalog.rs && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^registry::catalog::tests::/) | test(/^otel::callbacks::(.*::)?traceloop::/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::(otel_settings|callback_settings)::/)'
oracle_cases: []
deviations:
  - what: The otel name always gets its own legacy OpenTelemetry logger; LiteLLM returns any plain OpenTelemetry instance built earlier, so after langtrace, signoz or logfire, otel reuses that one.
    why: That reuse sends otel spans to another vendor's endpoint, which reads as a LiteLLM accident; each name keeps its own logger here.
  - what: >-
      With LITELLM_OTEL_V2 on, the eleven names stop startup with the unavailable-adapter error naming the callback until
      B110 injects the runtime, and agentops does so whatever the switch until B10008 lands; LiteLLM builds them.
    why: The V2 logger needs the production runtime and AgentOps needs an async startup fetch, and a silent fallback would export somewhere the operator did not configure.
  - what: >-
      A callback_settings.otel.attributes value that is not a mapping of include_list and exclude_list string lists fails
      the config load naming callback_settings.otel.attributes; LiteLLM logs the ValueError when the otel logger starts and
      runs without that logger.
    why: The config layer carries the setting typed. Both lists set, an unknown attribute name and the token type still fail at logger init as in LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L176-L187
out_of_scope:
  - "_maybe_construct_otel_v2 and the runtime type: B8910 (B3851 owns only the credential routing it uses). The production runtime and the request trace slot: B10007. The startup call to with_runtime: B110. The loggers themselves: B3853, B3862, B3863, B3868, B3910 and B3942. The newrelic team arm: B8655."
  - "The agentops arm and its startup JWT fetch: B10008."
pitfalls:
  - The langtrace and signoz arms raise before they try V2, so a missing key fails even when LITELLM_OTEL_V2 is on and no runtime is injected.
  - The arize and levo arms set OTEL_EXPORTER_OTLP_TRACES_HEADERS in the process environment; pass the header to the exporter config instead of writing the environment.
  - callback_settings.rs is also in B8655's scope; change only the OTEL_NESTED_KEYS entry so the two edits merge cleanly.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
