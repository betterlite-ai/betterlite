deviations:
  - what: Cached absence is stored as a distinct cache entry with a None value, not as an omission, so a later cache check returns None before dispatch decides its fallback.
    why: The source behavior distinguishes cache hit with None from cache miss, preserving the absence across the TTL window without network retries.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/google_secret_manager.py#L68-L73
  - what: The MIT premium-user license check is removed; betterlite does not limit this feature to paying customers.
    why: The project's no-paid-tier decision applies to all secret managers uniformly.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/google_secret_manager.py#L26-L31
out_of_scope:
  - GCSBucketBase.__init__ and sync_construct_request_headers are called but not implemented in this task; see architect question 3 for the unresolved Google storage-auth leaf owner.
  - The native provider reader (resolve_native_provider_reader) is called but owned elsewhere; it is the dispatch/Rust bridge to native implementations.
  - The request_headers returned by GCSBucketBase are used as-is; no additional header construction or Vertex token handling belongs to this task.
  - Config initialization and integration with ProxyConfig.initialize_secret_manager (owned by B4421).
pitfalls:
  - The cache distinction between "not present" and "present with None value" must be preserved; a simple get() check loses that distinction and causes repeated network requests on absent secrets.
  - The base64-decode and UTF-8-decode must succeed if payload.data is present; a malformed base64 or invalid UTF-8 should raise an error, not return partial data.
  - The GOOGLE_SECRET_MANAGER_ALWAYS_READ_SECRET_MANAGER environment variable is compared case-insensitively against the literal "true"; any other value (including "false" or "True") is treated as false, not parsed as a boolean.
  - Cache TTL expiry is checked by the cache implementation, not by this task; presence after expiry is a cache internal detail, so stale entries are re-fetched without explicit comparisons.
  - The always-read flag disables the cache check entirely, so even a cached None is bypassed; do not cache a value before checking the always-read flag.
review_level: standard
