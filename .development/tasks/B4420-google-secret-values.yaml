id: B4420
title: Fetch Google Secret Manager values with negative caching
description: >-
  Build Google Secret Manager's latest-version reader with cached absence behavior. Initialize
  GoogleSecretManager with optional refresh_interval and always_read_secret_manager parameters,
  reading GOOGLE_SECRET_MANAGER_PROJECT_ID, GOOGLE_SECRET_MANAGER_REFRESH_INTERVAL, and
  GOOGLE_SECRET_MANAGER_ALWAYS_READ_SECRET_MANAGER from environment through B002. The project ID
  is required; refresh defaults to 86400 seconds; always-read defaults to false.

  Implement get_secret_from_google_secret_manager to query the Secret Manager API. Check the native
  provider reader first via resolve_native_provider_reader. If always_read is false, consult an
  InMemoryCache by secret name. A cached value is returned immediately; a cached None signals that
  an earlier fetch failed, so return None without hitting the network. When not cached or always_read
  is true, send GET to https://secretmanager.googleapis.com/v1/projects/<project>/secrets/<name>/versions/latest:access
  with request headers from the inherited GCSBucketBase sync_construct_request_headers.

  On HTTP 200, parse the JSON response and extract payload.data. If the payload.data field is
  missing or None in the response, cache None and raise an error. If payload.data is present,
  base64-decode it, UTF-8-decode the result, cache the plaintext string, and return it.
  On non-200 status, log the error, cache None, and raise an error.

  Preserve the cache presence check after TTL expiry so a stale None entry is re-fetched
  on the next request. Remove the MIT premium-user license gate under the project's existing
  no-paid-tier decision. The SECRET_MANAGER_REFRESH_INTERVAL constant defaults to 86400 and
  is read from the same environment variable; both refresh_interval parameter and environment
  lookup apply to the cache TTL. Do not collapse cached-absent lookups into fresh network
  fetches by equality tests.
