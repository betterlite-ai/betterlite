dod:
  - text: GoogleSecretManager initializes with required GOOGLE_SECRET_MANAGER_PROJECT_ID, optional refresh interval from environment or parameter, and optional always-read flag from environment or parameter, creating an InMemoryCache with the resolved TTL.
    proof: [google-secret-manager-tests]
  - text: get_secret_from_google_secret_manager returns cached values immediately, distinguishes cached absence (None) from fresh lookups, and fetches only when cache expires or always_read is true.
    proof: [google-secret-manager-tests]
  - text: Failed HTTP requests cache None and raise errors; successful requests with missing or None payload.data cache None and raise errors; successful requests with present payload.data base64-decode, UTF-8-decode, cache, and return the plaintext.
    proof: [google-secret-manager-tests]
  - text: The native provider reader is checked first; when it returns a value, that value is used without checking the cache.
    proof: [google-secret-manager-tests]
  - text: Cache presence is checked after TTL expiry so expired None entries are re-fetched from the network on the next request.
    proof: [google-secret-manager-tests]
