dod:
  - text: >-
      logout revokes a stored credential first, stops with an error and clears nothing on RevocationUnavailable, prints the PkceFailure line and goes on, skips the request when nothing is stored, and prints LiteLLM's lines for each clear outcome with exit 0.
    proof: [session-logout]
  - text: >-
      auth print-token runs LiteLLM's checks in order, trusts the stored server unless base_url_explicit is set, takes the context key or fresh_api_key by LiteLLM's rule, writes only the key and a newline to stdout, and returns an error naming the right login command on every failure.
    proof: [session-print-token]
  - text: >-
      whoami prints LiteLLM's lines in order from the typed record, "Unknown" for an empty user field, Team ID only when set and not empty, the token age, the keychain notice, and the expiry line or the age warning.
    proof: [session-whoami]
  - text: >-
      _configure_claude_code calls configure_claude_settings with a static token and KeepModel, turns ClaudeSettingsError into an error, and prints LiteLLM's two blocks on success.
    proof: [session-configure-claude]
  - text: >-
      The secure create leaves a new or existing file at mode 0o600 before the first byte, and write_backup and read_backup round-trip a BackupRecord, with None for a missing file and an error naming the path for bad JSON, a missing field or a wrong type.
    proof: [backup-files]
  - text: >-
      restore_claude_settings writes the saved content back or removes the settings file, removes the backup only after that step succeeds, and returns the record or None.
    proof: [backup-restore]
  - text: >-
      down prints "Nothing to restore.", the Restored line or the Removed line, and returns the restore error.
    proof: [backup-down]
  - text: >-
      usable_login, key_resolved_on_the_way_in and stored_login_is_pkce answer as LiteLLM's probes do for each mix of key, context flag, freshness and refresh_token.
    proof: [backup-login-probes]
checks:
  optional: []
  commands:
    - id: session-logout
      why: the logout tests are missing or the revocation order, the stop on RevocationUnavailable or a clear outcome's lines differ from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^session::.*tests::logout_/)'
    - id: session-print-token
      why: the print-token tests are missing or a check, its order, the key choice or the stdout-only rule differs from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^session::.*tests::print_token_/)'
    - id: session-whoami
      why: the whoami tests are missing or a line, its order or the expiry and warning rules differ from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^session::.*tests::whoami_/)'
    - id: session-configure-claude
      why: the Claude Code wiring tests are missing or the configure call, its error or the printed blocks differ from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^session::.*tests::configure_claude_/)'
    - id: backup-files
      why: the backup file tests are missing or the file mode, the written JSON or the read rules differ from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^settings_backup::.*tests::backup_/)'
    - id: backup-restore
      why: the restore tests are missing or the restore branches or the order of the backup removal differ from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^settings_backup::.*tests::restore_/)'
    - id: backup-down
      why: the down tests are missing or its lines or error differ from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^settings_backup::.*tests::down_/)'
    - id: backup-login-probes
      why: the login probe tests are missing or a probe answers differently from LiteLLM's
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^settings_backup::.*tests::login_probe_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - The CLI root mounts these commands, declares the session and settings_backup modules and turns their errors into one stderr line and exit 1 (main.py); B134 covers main.py.
  - The context values and the config file they come from are B4560's.
  - The stored credential record, its file path, load and save, freshness and clear_cli_token with its outcomes are B4591's and B4592's.
  - fresh_api_key, get_stored_api_key, storage_notice, keychain_unreadable_notice, the renewal saver and reader and KEYRING_INSTALL_HINT are B4574's.
  - revoke_stored_credential, PkceFailure, RevocationUnavailable and the HTTP transport are B4573's.
  - configure_claude_settings is B4563's; claude_settings_path, configure_state_path, settings_file_owners, write_claude_settings, StaticToken, KeepModel, STARTING_MODEL_ROLE, CLAUDE_SETTINGS_PATH and BACKUP_PATH are B4562's.
  - ensure_private_dir is B192's, and reading CLI_JWT_EXPIRATION_HOURS is B1223's.
  - login and _finish_login are B4585's; up, ensure_fresh_login and the signal and exit handlers are B4577's.
pitfalls:
  - >-
    print-token is read by Claude Code as the key, so a warning from fresh_api_key, a keychain notice or any error text that reaches stdout breaks every Claude Code request; only the final key goes to stdout.
  - >-
    The issued-for-this-server check strips trailing slashes from the context base_url only, since the stored base_url was stripped when it was saved, and without base_url_explicit a mismatch is not an error.
  - >-
    restore_claude_settings removes the backup last, so a failed write or removal leaves the backup in place for the next lite down.
  - >-
    existed true with content null takes the removal branch, as LiteLLM's if and elif do; up never writes that pair, but a hand-edited backup can hold it.
  - >-
    The restore report and down use the fixed ~/.claude/settings.json, while _configure_claude_code uses claude_settings_path and so follows CLAUDE_CONFIG_DIR.
  - >-
    The expired line from the expiry check has no final period, while the one print-token returns names the command the same way but is betterlite's own text.
  - >-
    logout clears even when nothing is stored, so a machine with only a keychain entry left still gets the clear and its outcome line.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
