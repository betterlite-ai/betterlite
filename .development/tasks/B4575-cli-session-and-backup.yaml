id: B4575
title: CLI session commands and temporary settings backup
description: >-
  Build logout, token printing, identity display, login-driven Claude setup, and temporary-settings
  backup/restore primitives for betterlite-management-cli. The logout command revokes the stored
  credential on the proxy, then clears it locally, but does not fail if revocation is unavailable
  (503); token printing routes to stdout only (all diagnostics to stderr) for apiKeyHelper support,
  refreshing the token if stored as PKCE and exiting nonzero if the token has expired. The whoami
  command shows user email, ID, role, team and token age, with a warning if the keychain cannot be
  read. Login-driven Claude setup (_configure_claude_code) writes the login key to Claude Code's
  settings.json as a static token using configure_claude_settings, undoable with `lite unconfigure
  claude`. Temporary backup/restore saves the original ~/.claude/settings.json state before patching
  it, preserves whether the file existed, and restores exactly: if it existed, rewrites with original
  content; if it did not, deletes the patched copy. The up command patches settings for foreground
  interception, backing up first, installing the statusline script, and restoring on Ctrl-C or
  SIGTERM via atexit and signal handlers. The down command restores from a crashed up session.
  Helper functions branch on whether the stored login is PKCE (has refresh_token) to determine the
  right login command suggestion. All file writes use secure_create (mode 0o600 before any content),
  and backup paths are private-mode on POSIX. Transport, keychain access and clock are injected for
  testability; the module owns shared outcome and credential records from B4573 (PkceFailure,
  RevocationUnavailable). Missing: the prerequisite-1 storage owner for clear_cli_token,
  get_cli_token_file_path, is_cli_token_fresh.
scope:
  paths:
    - tools/management-cli/litellm/proxy/client/cli/commands/auth.py
    - tools/management-cli/litellm/proxy/client/cli/commands/up.py
  lint_tables: false
