id: B4575
title: CLI session commands and temporary settings backup
description: >-
  Build the session commands and the Claude Code settings backup of betterlite-management-cli in Rust, ported from LiteLLM's litellm/proxy/client/cli/commands/auth.py (logout, auth print-token, whoami and _configure_claude_code) and up.py (BackupRecord, secure_create, write_backup, read_backup, restore_claude_settings, _restore_and_report, down and the three login probes _usable_login, _key_resolved_on_the_way_in and _stored_login_is_pkce). The session code lives in tools/management-cli/src/session.rs and session/**, the backup code in tools/management-cli/src/settings_backup.rs and settings_backup/**. The auth group is a clap Subcommand enum holding print-token, and logout, whoami and down are command functions with LiteLLM's names and help texts, so the CLI root can mount them. Each command takes B4560's context values (base_url, base_url_explicit, api_key and api_key_from_token_file, the last two absent meaning None and false), B4590's SecretVault, B4573's HTTP transport, a clock and two injected writers for stdout and stderr, and returns Ok or its module's own error enum. The root prints an error's text as one line on stderr and exits 1, where LiteLLM raised click.ClickException or called sys.exit(1).

  docs/compatibility.md decides what is ported. Command names, the order of the checks, what each command sends, clears and writes, the lines printed on stdout, the exit codes and the streams stay LiteLLM's. The stored credential comes typed from B4591's loader, the Rust form of CliTokenRecord (cli_token_utils.py L86-L104): base_url, user_id, user_email and user_role are strings that default to "", timestamp a number that defaults to 0, key, expires_at and refresh_token optional, team_id an optional string (CliTokenData L80). A field of another type is that loader's error, so this task has no runtime type checks and no isinstance fallbacks. Text on stderr and in errors is betterlite's own words, as rule errors-match-litellm says, and each one still names the command that fixes it (lite login, lite login --pkce or lite logout).

  logout loads the stored credential. When there is one it revokes it first through B4573's revoke_stored_credential with a real transport. RevocationUnavailable returns an error that gives the reason, says nothing was cleared and asks to run lite logout again, and nothing is cleared (auth.py L974-L979). PkceFailure prints "Could not revoke the refresh token on the proxy ({reason}); it expires on its own." and goes on. With no stored credential no request is sent and the clear still runs. Then it clears through B4592's clear_cli_token and prints LiteLLM's lines for each outcome on stdout with exit 0: SecretErased "Logged out successfully. Authentication token cleared.", CredentialNotCleared the two lines with B4591's token file path and the detail, SecretStranded STRANDED_CREDENTIAL_MESSAGE and the unlock line, and KeyringNotInstalled, KeyringDisabled and KeyringUnreachable UNCHECKED_KEYCHAIN_MESSAGE and their second lines (auth.py L986-L1005), with B4574's install hint and B4590's DISABLE_KEYRING_ENV_VAR.

  auth print-token is Claude Code's apiKeyHelper, so stdout carries only the key and a newline, and every other outcome is an error with exit 1. The checks run in LiteLLM's order (auth.py L1018-L1060). No stored credential is an error. The credential counts as issued for this server when its base_url equals the context base_url with trailing slashes stripped; with base_url_explicit set and a different server it is an error, and without it the stored server is trusted, as LiteLLM does. A credential that B4591's freshness check calls stale and that has no refresh_token is an error. A credential whose key is None is an error carrying B4574's keychain_unreadable_notice. The key is the context api_key when the credential is issued for this server and api_key_from_token_file is true, and otherwise B4574's fresh_api_key with its saver and reader and warnings on stderr. A key that is None or "" is an error that names lite login --pkce when the credential has a refresh_token and lite login otherwise.

  whoami prints on stdout and always exits 0. With no stored credential it prints "Not authenticated. Run 'lite login' to authenticate." and stops. Otherwise it prints "Authenticated" when key is present and "Signed in, but the credential cannot be read" when it is None, then "User Email: {user_email}", "User ID: {user_id}" and "User Role: {user_role}" with "Unknown" for an empty string, then "Team ID: {team_id}" only when team_id is present and not "". The record's default for these strings is "", so an absent field and "" are the same stored value, and printing "Unknown" for it matches LiteLLM for every record of the declared type; both logins write "unknown", "cli" and "cli-user" when they know nothing better (pkce_login.py L471-L473, auth.py L934-L936). Then "Token age: {hours:.1} hours" with hours = (now - timestamp) / 3600, then B4574's keychain_unreadable_notice when key is None. With expires_at present it prints the expiry line: remaining = (expires_at - now) / 3600, at or below 0 "Key expired. Run '{login command}' again" with no final period, otherwise "Key expires in: {remaining:.1} hours" followed by ", renewed on next use" when refresh_token is present. Without expires_at, an age above the CLI expiry hours prints "Warning: Token is more than {hours} hours old and may have expired.", where the hours are the CLI_JWT_EXPIRATION_HOURS setting B1223 reads (constants.py L1749-L1752).

  _configure_claude_code(base_url, api_key) resolves the settings path with B4562's claude_settings_path from the process environment and calls B4563's configure_claude_settings with StaticToken(api_key), KeepModel, that path, configure_state_path(path) and settings_file_owners(path). A ClaudeSettingsError returns an error that says the login worked but Claude Code could not be configured, with the cause. On success it prints LiteLLM's two blocks (auth.py L804-L808) with base_url's trailing slashes stripped and B4562's STARTING_MODEL_ROLE. No apiKeyHelper is written. B4585's login calls it.

  Backup. BackupRecord holds existed (bool) and content (a JSON object or None). The secure create opens a path for writing with create and truncate and mode 0o600 (std::os::unix::fs::OpenOptionsExt::mode), then sets 0o600 on the open file before writing a byte (File::set_permissions), so an existing file with wider permissions is tightened too. write_backup calls B192's ensure_private_dir on the parent and writes {"existed": ..., "content": ...} as standard JSON through the secure create. read_backup returns None when the file doesn't exist; otherwise it reads it as a JSON object with existed a JSON bool and content an object or null, both required, other keys ignored. Invalid JSON, a missing field or a value of another type is an error that names the path and says it cannot be restored safely, and a read failure is an error that names the path. restore_claude_settings reads the backup and returns None when there is none. When existed is true and content is an object it creates the settings file's parent directories and writes content through B4562's write_claude_settings; otherwise it removes the settings file if it exists. Only then does it remove the backup, and it returns the record. Both paths default to B4562's CLAUDE_SETTINGS_PATH (~/.claude/settings.json) and BACKUP_PATH (~/.litellm/claude_settings_backup.json), not the CLAUDE_CONFIG_DIR-aware claude_settings_path (claude_settings.py L76-L78). The restore report prints "Nothing to restore.", "Restored {path} to its original contents." or "Removed {path} (it did not exist before `lite up`)." on stdout, and down runs it and returns its error. The login probes: usable_login is false for a None key and otherwise true when a stored credential exists and B4591 calls it fresh; key_resolved_on_the_way_in returns the context api_key when api_key_from_token_file is true and otherwise B4574's get_stored_api_key for the given base URL; stored_login_is_pkce is true when a stored credential has a refresh_token. B4577's ensure_fresh_login and up use them.

  Tests. Test functions live in tests.rs files under session/ and settings_backup/ with the name prefixes the checks select: logout_, print_token_, whoami_ and configure_claude_ under session, and backup_, restore_, down_ and login_probe_ under settings_backup. They use a fake SecretVault, a fake transport that records revocation and refresh calls and answers canned outcomes, a fixed clock and paths in a temp directory, so no test touches the real home directory or keychain. They compare the exact stdout bytes for the lines LiteLLM prints, assert that print-token writes nothing to stdout on every error, and assert the returned error variant for betterlite's own texts.
scope:
  paths:
    - tools/management-cli/src/session.rs
    - tools/management-cli/src/session/**
    - tools/management-cli/src/settings_backup.rs
    - tools/management-cli/src/settings_backup/**
  lint_tables: false
