    why: Aiohttp dispatch adds global OpenAI defaults before the bare adapter.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L2998-L3044
    why: Aleph Alpha's still-live dispatch and unusual key precedence.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L4909-L5042
    why: Legacy custom wire protocol and Python custom-handler dispatch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L6504-L6555
    why: Proxy embeddings retain the OpenAI fallback branch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7274-L7296
    why: Last-match custom embedding selection and its forwarded arguments.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_llm.py#L219-L231
    why: Exactly the four-way custom chat selector owned here.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6457-L6470
