id: B044
title: Install proxy forwarding and the live custom and deprecated dispatch paths
description: >-
  Complete B044 by installing LitellmProxy, AlephAlpha and Custom endpoint execution in the closed
  betterlite-provider enum. Add legacy_dispatch.rs for main.py _complete_aleph_alpha (2998-3044),
  _custom_api_first_output and _complete_custom (4909-4979) and the litellm_proxy embedding branch (6504-6555).
  Own custom_chat_llm_router in custom_llm.py; its ten CustomLLM methods and error class remain B164.
  Reuse B1500 forwarding and B1501's legacy adapter, and expose B1502-B1506's hosted skill services
  through core::skills::composition without adding skills routes or a second injection hook.

  This task builds what today's Deployment can carry: one resolved model, base and key per deployment. Deployment
  has no process settings and no record of whether the deployment set its own base or key, because
  ChatDeployment::resolve_with fills an absent base from litellm.api_base, OPENAI_BASE_URL, OPENAI_API_BASE and
  https://api.openai.com/v1, and an absent key from litellm.api_key, litellm.openai_key and OPENAI_API_KEY. B10006
  adds that seam later, with the Python custom-provider handlers, _complete_aiohttp_openai and every rule below
  that reads a process global. So every case here sets api_base and api_key on its deployment, and the adapter
  passes the deployment's own values and no globals, the way embedding_rerank_providers passes Settings::default()
  today.

  Those fallbacks would send an OpenAI key to an Aleph Alpha or proxy host, or the deployment's own key to the
  OpenAI base. So until B10006 lands, an aleph_alpha or litellm_proxy deployment whose own litellm_params leave out
  api_key or api_base, and a custom deployment that leaves out api_base, are refused at startup, never served. A
  custom deployment without a base would post its key to the OpenAI base, where LiteLLM takes litellm.api_base or
  raises at main.py L4925-L4926. The check sits in chat_deployments in
  crates/betterlite-server/src/server/chat_setup.rs, beside apply_aiohttp_defaults: after resolve_with and
  prefix_provider it asks Provider::from_deployment, and when that answers Provider::Legacy it reads the raw
  deployment.litellm_params. Legacy is a unit struct today, so make it carry which
  of the three legacy providers it is; chat_setup matches on that and never parses the slug again. An api_key or
  api_base that is absent or empty counts as missing, since LiteLLM's "or" chain and resolve_with both skip an
  empty value. The new ChatSetupError::UnbuiltChain { model_name, provider, field } reads "model_list entry
  {model_name} sets no {field}: LiteLLM's global key and base chain for {provider} is not built yet", the same
  shape as an unbuilt integration answering CatalogError::Unavailable, and component.rs already logs it under
  "failed to set up chat completions" and stops. The rstest unbuilt_chain_stops_startup in chat_setup/tests.rs
  has one case per provider and field: aleph_alpha_prefix_without_api_key, aleph_alpha_provider_without_api_base,
  litellm_proxy_prefix_without_api_base, litellm_proxy_provider_without_api_key and custom_prefix_without_api_base.
  Each loads a config through ConfigLoader that sets the other field (the custom case sets only api_key), names
  the provider by model prefix or by custom_llm_provider as the case
  says, calls chat_executor and matches the variant and its three fields. B10006 deletes the check, the variant
  and this test when it adds the chains.

  Aleph Alpha key precedence is explicit api_key, litellm.aleph_alpha_key, ALEPH_ALPHA_API_KEY,
  ALEPHALPHA_API_KEY, litellm.api_key; base is explicit, litellm.api_base, ALEPH_ALPHA_API_BASE,
  then https://api.aleph-alpha.com/complete. Load litellm_settings.aleph_alpha_key and the three environment
  variables in the proxy_custom_dispatch config section, with absent key defaults, and put both chains on its
  Settings as resolve methods that take the supplied value plus litellm.api_key or litellm.api_base as arguments,
  since config.sections.resource_sdk_settings already reads those two and no second parser may. The Aleph Alpha
  adapter calls them with Settings::default() and no globals until B10006 passes the loaded ones. Leave
  litellm_settings.custom_provider_map unread: the loader refuses it at startup as an unsupported key that names it,
  until B10006 reads it. Proxy embedding retains B006's OpenAI fallback chain after B1500 resolution, organization
  and LITELLM_DEFAULT_EMBEDDING_ENCODING_FORMAT semantics.

  The legacy custom endpoint posts to the deployment's own base (the litellm.api_base priority and the empty-base
  error are B10006's), joins message content with spaces, puts the prompt in a one-element params.prompt list and sends
  max_tokens/temperature/top_p/top_k even when null. extra_body expands last and may replace model or
  params. decode_custom_output reads bounded JSON data[0].output[0]; it stamps content, created and model
  without inventing usage. Keep the base and key choice of the Aleph Alpha and custom paths in one function each,
  so B10006 changes only those. Preserve typed causes and the B184 public error envelope.

  HTTP fixtures boot the proxy and exercise POST /v1/chat/completions and /chat/completions for proxy,
  aleph_alpha and custom deployments, plus /v1/embeddings and /embeddings for proxy. Capture upstream
  bodies/headers and downstream status, error type/param/code and headers; error cases ignore only
  /error/message with the betterlite wording reason. Use model litellm_proxy/gemini/gemini-1.5-pro to prove
  nested prefixes survive and aleph_alpha/luminous-base-control for prompt formatting. Include bearer rejection
  and provider failure. Register a pure custom_method helper only for the four-method selection table; its Python
  adapter calls custom_chat_llm_router, with a call.custom_method seed. Configuration test legacy_provider_loads_keys
  loads every Aleph Alpha key/base spelling and global through B002 and checks both resolve chains. Fuzz
  decode_custom_output and replay custom_output alongside the existing config corpus. Source ownership is about
  180 nonblank/non-comment lines; plan 200 dispatch, 180 tests, 95 adapters, 75 parser/fuzz and 90
  config/composition lines.

  B010 registers Provider::Legacy and the Legacy variants of OperationRequest, OperationResult and PreparedRequest
  as stubs in crates/betterlite-provider/src/legacy_dispatch.rs. Fill them there and leave operation.rs and
  prepared.rs as they are; provider.rs only gains the slugs that select Provider::Legacy.
