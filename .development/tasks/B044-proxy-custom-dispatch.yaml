pitfalls:
  - 'The oracle helper for this task is pre-registered as custom_method in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/custom_method.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/custom_method.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Aleph Alpha's global generic api_key comes after both provider environment spellings.
  - Every aleph_alpha and litellm_proxy deployment in a case or fixture sets its own api_base and api_key, and every custom deployment its own api_base, since one that leaves them out stops startup until B10006 lands.
  - The refusal also stops a litellm_proxy embedding deployment that LiteLLM would serve from LITELLM_PROXY_API_BASE and LITELLM_PROXY_API_KEY, then the OpenAI chain at main.py L6504-L6530. Do not carve an exception for it; B10006 lifts the refusal for both routes.
  - USE_LITELLM_PROXY and the use_litellm_proxy flags have no production caller on main (should_use_litellm_proxy is read only in tests), so a deployment forced onto the proxy that way is outside this check.
  - Reading litellm_settings.custom_provider_map in the section, even to ignore it, removes the startup error that names the key, so leave it to B10006.
review_level: security
budget:
