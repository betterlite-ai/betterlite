deviations: []
out_of_scope:
  - CustomLLMError.__init__, CustomLLM.__init__, completion, streaming, acompletion, astreaming, image_generation, aimage_generation, embedding, aembedding, image_edit and aimage_edit, plus CustomLLMItem, are B164's Python extension surface; B164 covers both custom_llm files.
  - The skills __init__.py exports have no additional algorithm; their live services are B1502-B1506, while the unused CodeExecutionHandler exports remain excluded under B1504.
  - main.py _complete_azure/_complete_azure_text are B025, _complete_azure_ai is B026, _complete_anthropic/_complete_anthropic_text are B027 and _complete_bedrock/_complete_bedrock_mantle are B028.
  - main.py _complete_vertex_ai/_complete_vertex_ai_beta are B031; _complete_xai/_complete_mistral/_complete_text_completion_codestral are B036; _complete_cohere_chat is B037.
  - main.py _complete_deepseek/_complete_heroku/_complete_groq/_complete_cometapi/_complete_bytez are B038; _complete_minimax/_complete_amazon_nova/_complete_text_completion_inception are B039.
  - main.py _complete_hosted_vllm/_complete_oobabooga/_complete_vllm/_complete_ollama/_complete_ollama_chat/_complete_triton/_complete_lemonade are B040; _complete_fireworks_ai/_complete_together_ai/_complete_replicate/_complete_huggingface/_complete_openrouter/_complete_vercel_ai_gateway/_complete_edenai/_complete_predibase/_complete_petals are B041.
  - main.py _complete_sap/_complete_oci/_complete_databricks/_complete_datarobot/_complete_sagemaker_chat/_complete_sagemaker/_complete_watsonx/_complete_watsonx_text/_complete_cloudflare/_complete_snowflake/_complete_gdc/_complete_ovhcloud are B042; _complete_gigachat/_complete_nlp_cloud/_complete_maritalk/_complete_compactifai/_complete_nadir/_complete_gradient_ai are B043.
  - main.py _complete_custom_openai and _complete_text_completion_openai are B024, except Copilot's authorization stanza owned by B045; _complete_fal_ai is B046, _complete_ragflow is B049, and _complete_a2a/_complete_langgraph/_complete_langflow are B050.
  - The main.py public facades LiteLLM/Chat/Completions/AsyncCompletions, acompletion, completion, aembedding, embedding outside the two owned branches, _resolve_dispatched_chat_response, _model_response_from_cached_dict, _transcription_response_from_cached_dict and _async_streaming remain B158.
  - B158 also retains main.py _resolve_control_options, _handle_mock_potential_exceptions, _handle_mock_timeout/_async, _sleep_for_timeout/_async, admission_input_tokens, admitted_prompt_token_counter, mock_completion, responses_api_bridge_check, _is_claude_tool_target, _without_anthropic_only_tool_keys, _drop_anthropic_only_tool_keys, _ProxyAuthHeadersProvider.get_auth_headers, _proxy_auth_headers, _build_custom_pricing_entry, _get_router_deployment_id and _register_custom_pricing_for_request.
  - The remainder of main.py's SDK functions completion_with_retries, acompletion_with_retries, responses_with_retries, aresponses_with_retries, _resolve_dispatched_text_completion_response, _resolve_pending_chat_response, atext_completion, text_completion, aadapter_completion, aadapter_generate_content, adapter_completion, moderation, amoderation, atranscription, transcription, aspeech, speech, ahealth_check, config_completion, acount_tokens and __getattr__ retain B158's facade ownership and their existing API-family implementations.
  - B500 owns main.py _is_openai_backed_api_base/_resolve_openai_api_base; B198 owns _provider_config_items/_locals_snapshot/_dispatch_metadata/_dispatch_client_http/_dispatch_client_azure/_dispatch_client_openai; B195 owns _load_default_encoding; B196 owns _load_module_encoding/_get_encoding; B2239 owns print_verbose.
  - B2227 owns main.py stream_chunk_builder, stream_chunk_builder_text_completion, _reported_cost_is_priced_by_calculator, _stream_builder_response_cost, _joined_streamed_citations, _stream_builder_model_map_cost, _set_stream_builder_response_cost, _stamp_streaming_usage_cost, _stream_choice_delta, _delta_carries_more_than_text and _simple_text_part.
pitfalls:
  - Aleph Alpha's global generic api_key comes after both provider environment spellings.
  - _complete_custom gives the global base priority over its explicit argument, unlike the neighboring providers.
  - Aiohttp's dispatcher adds /v1 through its fallback base even though the bare config's default base omits it.
  - The custom map search has no break, so duplicate provider names select the last configured handler.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
