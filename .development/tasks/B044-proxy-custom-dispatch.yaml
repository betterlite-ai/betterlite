id: B044
title: Install proxy forwarding and the live custom and deprecated dispatch paths
description: >-
  Complete B044 by installing LitellmProxy, AlephAlpha and Custom endpoint execution in the closed
  betterlite-provider enum, plus the CustomPython variant whose configured handler is loaded by B165.
  Add legacy_dispatch.rs for main.py _complete_aiohttp_openai (2390-2448), _complete_aleph_alpha
  (2998-3044), _custom_api_first_output and _complete_custom (4909-4979), _complete_custom_providers
  (4982-5042), the litellm_proxy embedding branch (6504-6555) and custom embedding branch (7274-7296).
  Own custom_chat_llm_router in custom_llm.py; its ten CustomLLM methods and error class remain B164.
  Reuse B1500 forwarding and B1501's legacy adapter, and expose B1502-B1506's hosted skill services
  through the core's operation composition without adding skills routes or a second injection hook.

  Aleph Alpha key precedence is explicit api_key, litellm.aleph_alpha_key, ALEPH_ALPHA_API_KEY,
  ALEPHALPHA_API_KEY, litellm.api_key; base is explicit, litellm.api_base, ALEPH_ALPHA_API_BASE,
  then https://api.aleph-alpha.com/complete. Load the new globals/environment through betterlite-config's
  legacy_provider module, with absent key defaults. Aiohttp selection uses B500 OpenAI base/key defaults,
  warns when B172 http2 is enabled but retains HTTP/1.1, and overwrites optional extra_headers whenever
  the explicit value is non-None. Its configured base defaults to /v1 even though B010's bare adapter
  has a different direct-call default. Proxy embedding retains B006's OpenAI fallback chain after B1500
  resolution, organization and LITELLM_DEFAULT_EMBEDDING_ENCODING_FORMAT semantics.

  The legacy custom endpoint prefers litellm.api_base over explicit api_base, requires a nonempty base,
  joins message content with spaces, puts the prompt in a one-element params.prompt list and sends
  max_tokens/temperature/top_p/top_k even when null. extra_body expands last and may replace model or
  params. decode_custom_output reads bounded JSON data[0].output[0]; it stamps content, created and model
  without inventing usage. The custom-provider map selects the last matching provider. Chat chooses the
  sync/async and stream/nonstream method by truthiness, but wraps a returned stream only for literal True.
  Empty headers fall back to litellm.headers then {}; all call context, timeout, client and credential
  fields reach the selected callable. Embedding independently selects embedding/aembedding and reports
  an unknown provider if no handler matches. Preserve typed causes and the B184 public error envelope.

  HTTP fixtures boot the proxy and exercise POST /v1/chat/completions and /chat/completions for proxy,
  aleph_alpha, custom and aiohttp_openai deployments, plus /v1/embeddings and /embeddings for proxy and
  a fixture custom handler. Capture upstream bodies/headers and downstream status, error type/param/code
  and headers; error cases ignore only /error/message with the betterlite wording reason. Use model
  litellm_proxy/gemini/gemini-1.5-pro to prove nested prefixes survive and aleph_alpha/luminous-base-control
  for prompt formatting. Include bearer rejection, missing custom base, missing handler and provider failure.
  Register a pure custom_method helper only for the four-method selection table; its Python adapter calls
  custom_chat_llm_router, with a call.custom_method seed. Configuration test legacy_provider_loads_keys
  loads every new Aleph Alpha key/base spelling and global through B002. Fuzz decode_custom_output and
  replay custom_output alongside the existing config corpus. Source ownership totals 293 nonblank/non-comment
  lines; plan 290 dispatch, 220 tests, 95 adapters, 75 parser/fuzz and 110 config/composition lines (790).
