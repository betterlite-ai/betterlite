dod:
  - text: Booted chat and embedding aliases execute the configured provider and preserve complete upstream and client error/header contracts.
    proof: [legacy-dispatch-tests, oracle]
  - text: Custom method choice and argument forwarding preserve the pinned sync/async distinction and last matching handler.
    proof: [legacy-dispatch-tests, oracle, custom-method-python]
  - text: Aleph Alpha settings use the correct precedence and do not expose keys in Debug or diagnostics.
    proof: [legacy-config-tests, legacy-config-corpus]
  - text: Custom output decoding survives malformed arrays and fuzz inputs, while hosted skill composition exposes the existing leaf services once.
    proof: [custom-output-corpus, hosted-skill-composition]
checks:
  optional: [mutants]
  commands:
    - id: legacy-dispatch-tests
      why: an installed legacy provider has no behavior tests or emits an incorrect call
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^legacy_dispatch::/) - test(replays_custom_output)'
    - id: legacy-config-tests
      why: the actual loader cannot resolve each supported Aleph Alpha source
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(legacy_provider_loads_keys)'
    - id: legacy-config-corpus
      why: no fresh configuration seed reaches the extended loader
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/legacy_provider*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: custom-method-python
      why: pure method selection lacks its Python implementation or case seed
      run: grep -qE '^[[:space:]]+custom_method:' tools/oracle/fuzz/corpus/helper_case/custom_method* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/custom_method.py tools/oracle/fixtures/proxy-custom && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: custom-output-corpus
      why: bounded data/output decoding has no added corpus or replay
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/custom_output.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/custom_output)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_custom_output)'
    - id: hosted-skill-composition
      why: hosted operations are not reachable from core composition
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^skills::composition::/)'
