dod:
  - text: Booted chat and embedding aliases for litellm_proxy, aleph_alpha and custom deployments that set their own api_base and api_key execute the configured provider and preserve complete upstream and client error/header contracts.
    proof: [legacy-dispatch-tests, oracle]
  - text: custom_chat_llm_router keeps the pinned sync/async and stream/non-stream method choice.
    proof: [legacy-dispatch-tests, oracle, custom-method-python]
  - text: Aleph Alpha settings load every spelling, resolve in the pinned precedence and do not expose keys in Debug or diagnostics.
    proof: [legacy-config-tests, legacy-config-corpus]
  - text: Custom output decoding survives malformed arrays and fuzz inputs, while hosted skill composition exposes the existing leaf services once.
    proof: [custom-output-corpus, hosted-skill-composition]
  - text: An aleph_alpha or litellm_proxy deployment whose own litellm_params leave out api_key or api_base, and a custom deployment that leaves out api_base, stop startup with ChatSetupError::UnbuiltChain naming the deployment, the provider and the missing field, for every provider and field pair, the model prefix and custom_llm_provider.
    proof: [legacy-refusal-tests]
checks:
  optional: [mutants]
  commands:
    - id: legacy-dispatch-tests
      why: an installed legacy provider has no behavior tests or emits an incorrect call
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^legacy_dispatch::/) - test(replays_custom_output)'
    - id: legacy-config-tests
      why: the actual loader cannot resolve each supported Aleph Alpha source
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(legacy_provider_loads_keys)'
    - id: legacy-config-corpus
      why: no fresh configuration seed reaches the extended loader
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/legacy_provider*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: custom-method-python
      why: pure method selection lacks its Python implementation or case seed
      run: grep -qE '^[[:space:]]+custom_method:' tools/oracle/fuzz/corpus/helper_case/custom_method* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/custom_method.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: custom-output-corpus
      why: bounded data/output decoding has no added corpus or replay
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/custom_output.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/custom_output)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_custom_output)'
    - id: hosted-skill-composition
      why: hosted operations are not reachable from core composition
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^skills::composition::/)'
    - id: legacy-refusal-tests
      why: an aleph_alpha or litellm_proxy deployment without its own key or base, or a custom one without its own base, starts and sends the OpenAI fallbacks to the wrong host
      run: for name in aleph_alpha_prefix_without_api_key aleph_alpha_provider_without_api_base litellm_proxy_prefix_without_api_base litellm_proxy_provider_without_api_key custom_prefix_without_api_base; do grep -q "case::$name" crates/betterlite-server/src/server/chat_setup/tests.rs || exit 1; done && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::tests::unbuilt_chain_stops_startup::/)'
