id: B3647
title: AssemblyAI transcript polling and spend logging
description: >-
  Poll submitted AssemblyAI transcription jobs to completion, measure their duration, and record spend without blocking the relayed response.

  Build the logging handler, typed transcript record, and polling/pricing functions. Poll the GET /v2/transcript/{transcript_id} endpoint at 10-second intervals for at most 180 attempts (30 minutes total), stopping when a job reaches completed/error status or when the response is absent.
  Use the Bearer authorization header and the transcript's audio_duration field for cost calculation.
  Get pricing via litellm.get_model_info with the speech_model, falling back to assemblyai/nano if the exact model pricing is not found.

  Retain regional URL quirks: routing returns https://api.eu.assemblyai.com while polling uses https://eu.assemblyai.com.
  Reject transcript IDs containing disallowed characters (forward slash, backslash, hash, question mark) or containing "..", and URL-encode the ID before constructing the request URL.

  Only POST requests are logged; other operations are skipped. Submit polling work through the injected async transport to avoid blocking the relayed response.
  Two unresolved framework dependencies are PassthroughEndpointRouter.get_credentials (credential lookup) and PassThroughEndpointLogging._handle_logging (the logging sink); neither may come from a B102 umbrella.
