deviations:
  - what: AssemblyAI polling and logging run asynchronously through an injected transport layer, not in the response path.
    why: Blocking on transcript completion would delay the initial relayed response to the client. betterlite matches LiteLLM's executor.submit pattern for non-blocking cost measurement.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/assembly_passthrough_logging_handler.py#L71-82
out_of_scope:
  - HTTP routing and request forwarding; this task owns polling and logging only.
  - The PassthroughEndpointRouter.get_credentials and PassThroughEndpointLogging._handle_logging framework dependencies; the architect must assign concrete owners.
pitfalls:
  - "Polling URL always uses https://eu.assemblyai.com for EU region even though routing may return https://api.eu.assemblyai.com; normalizing these would silently differ from LiteLLM."
  - "Transcript ID validation rejects multiple distinct disallowed characters; an ID containing any of /, \\, #, ? or the sequence .. must be rejected."
  - "audio_duration may be zero or absent; only present duration values produce a cost."
  - "Model pricing lookup catches exceptions from get_model_info and continues to fallback; missing pricing silently returns None, not an error."
  - "Only POST operations are logged; other HTTP methods on the same endpoint are skipped without marking the request as logged."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
