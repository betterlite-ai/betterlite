dod:
  - text: Polling stops when transcript status is completed, error, or absent, or after 180 attempts at 10-second intervals.
    proof: [relay-tests]
  - text: >-
      Disallowed transcript ID characters (/, backslash, #, ?) and ".." are rejected.
    proof: [relay-tests]
  - text: Pricing falls back to assemblyai/nano when the specific speech_model pricing is not found.
    proof: [relay-tests]
  - text: Regional URL handling returns https://api.eu.assemblyai.com when routing specifies eu.assemblyai.com, while polling uses https://eu.assemblyai.com.
    proof: [relay-tests]
  - text: The handler only processes POST requests; other methods are skipped.
    proof: [relay-tests]
  - text: Cost is calculated as audio_duration * cost_per_second when both values are present; missing audio_duration returns None.
    proof: [relay-tests]
  - text: Bearer authorization uses the API key from get_credentials with the format "Bearer <key>".
    proof: [relay-tests]
  - text: Transcript IDs are URL-encoded before being placed in the request URL.
    proof: [relay-tests]
