dod:
- text: >-
    A stream of chat chunks is written as data frames followed by data: [DONE], with the client model restamped, and DONE is left out when
    _litellm_skip_openai_stream_done is true.
  proof: [generator-tests]
- text: >-
    With the iterator wrap flag the items pass through wrap_iterator and fire_deferred_stream_logging is not called; without it they do
    not, and it is called once at the end. With the per-chunk flag every item passes chunk_hook with str_so_far None first and then the
    text so far.
  proof: [generator-tests]
- text: >-
    Fallback metadata from the response or from a later chunk is latched once, and with include_fallback_errors the fallback event is
    written once, after the first chunk that makes it pending or in place of a skipped usage artifact.
  proof: [generator-tests]
- text: >-
    With strip on, usage artifact chunks are not written; raw streams are re-framed at the delimiters, flushed at the end with a closing
    blank line, and fail past the buffer limit; non-raw bytes starting with data:, event: or : are relayed; a text item starting with
    "data: " is written after the flush and before DONE and ends the loop.
  proof: [generator-tests]
- text: >-
    A quiet upstream gets ": ping" frames at the resolved interval when a router exists or the interval is above 0, and none otherwise.
  proof: [generator-tests]
- text: >-
    A failure calls the failure hook, then writes the error frame with "None" for a missing type and param, the status as a string code,
    429 and 401 for the router messages and no DONE; an Http failure aborts the body; with responses_stream_errors the error state's frame
    and DONE are written instead, and only sse_data_frame frames pass through mark_emitted.
  proof: [generator-tests]
- text: >-
    The cleanup runs exactly once, with the source's snapshot handle, with stream_completed true after a normal end or an error frame, and
    with client_disconnected true when the body is dropped mid-stream.
  proof: [generator-tests]
checks:
  optional: []
  commands:
  - id: generator-tests
    why: the frame order, a hook gate, the fallback event, the raw relay, the pings, the failure frames or the cleanup is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^sse_data_generator::/)'
oracle_cases: []
deviations:
- what: proxy_logging_obj, llm_router, general_settings, the Responses error state and the stream cleanup reach the generator through the StreamHooks, KeepaliveRouter, ErrorStateSource and StreamCleanup ports and constructor values instead of module globals.
  why: betterlite wires dependencies through constructors; the frames a client sees are the same.
- what: The cleanup is handed to a sync port that the server runs on its own task tracker, where LiteLLM awaits it inside the generator under a cancel shield.
  why: Rust cannot await in Drop, and rules.yaml async-hygiene forbids detached tasks; the cleanup still runs once, with the same flags, after the last frame.
out_of_scope:
- "The except branch around each yield that writes `data: {e}` when sending a frame raises (L9992-L9995): a Rust stream cannot receive an exception at a yield point, so it is not built."
- "The chunk shaping and frame helpers (L9344-L9623): B8602. The keepalive helpers (L9626-L9827): B8603. select_data_generator and the AsyncDataGenerator port: B7324."
- "data_generator (L9280-L9287): no caller at the pin. async_assistants_data_generator (L9290-L9341): B089."
- "The body of _finalize_streaming_generator_cleanup and its disconnect, partial-spend billing and parallel-slot helpers in common_request_processing.py: B8605, which implements StreamCleanup; this task only calls the port. The real StreamSnapshot over the stream wrapper's collected chunks: B8633."
- "The rest of litellm/proxy/proxy_server.py: owners by area are listed in the proxy_server.py inventory head of B1216, B1125, B850, B848, B779, B899, B849 and B851."
pitfalls:
- 'The plain failure frame ends the body with no data: [DONE], but the Responses error-state path writes DONE after its frame unless _litellm_skip_openai_stream_done is true.'
- 'Without an error state an Http failure is never turned into a frame; the body aborts. With responses_stream_errors it becomes the error state''s frame.'
- 'A missing type or param becomes the four-letter text "None", not null; a param that exists but is null stays JSON null.'
- 'Text that starts with "data: " is held back as an error message and stops the loop, but bytes that start with "data:" are relayed as a frame and the loop goes on.'
- 'The raw buffer limit counts characters, not bytes (8388608), and is checked after the complete frames have been popped.'
- 'Each bytes item is decoded on its own with replacement, so a UTF-8 character split across two items becomes replacement characters, as in LiteLLM.'
- 'str_so_far is passed to the chunk hook as None while it is empty, never as "".'
- 'The keepalive wrapper is used whenever a router exists, even when the first interval is 0, because a mid-stream fallback can turn heartbeats on.'
- 'stream_completed is set before the raw flush, the kept error message and DONE, so a client that leaves during those writes is not counted as disconnected.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
