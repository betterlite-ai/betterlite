id: B3976
title: Rubrik configuration webhook transport and retry queue
description: >-
  Build Rubrik initialization, moderation clients and the bounded, retry-preserving
  logging queue. Implement the RubrikLogger class over CustomGuardrail and CustomBatchLogger,
  with configuration parsing for API keys, webhook URLs, sampling rates and batch sizes.
  Set up HTTP clients for moderation webhooks (5-second timeout, 2-second connect) and
  logging batch delivery. Implement a snapshot-based queue flush that captures a consistent
  prefix, sends it, and drains only what was successfully sent, avoiding the coupling between
  a separate queue length capture and a snapshot inside async_send_batch. Keep the bounded
  retry queue with drop-oldest backpressure at 10,000 events, warning every 60 seconds when
  overflow occurs. Support both moderation and logging webhooks through the unified JSON POST
  layer. Preserve stream flags streaming_end_of_stream_only and streaming_buffer_until_moderated
  set to true. Default event hook is post_call with default_on false. Sampling defaults to 1.0
  and clamps to [0,1]. Missing API keys warn and send requests unauthenticated. Config key lookups
  delegate to B002 for RUBRIK_API_KEY, RUBRIK_WEBHOOK_URL, RUBRIK_SAMPLING_RATE and RUBRIK_BATCH_SIZE.
