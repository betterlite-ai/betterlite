deviations:
- what: Configuration resolution reads environment and injected values through B002's lookup contract.
  why: Prevents coupling tests to the real process environment while reusing the standard config
    dependency pattern.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L220-L236
out_of_scope:
- Prompt and response moderation hooks (B3978).
- Sampled log event enqueueing and block event handling (B3977).
- Payload construction and correlation ID assignment (B3975, B3977).
- Guardrail framework integration and mode/default_on inheritance.
- Periodic flush scheduling and timer cancellation on shutdown.
- Native Rubrik SDK integration or alternative transport implementations.
- Stream chunk buffering or end-of-stream detection; streaming flags are read-only from guardrail config.
pitfalls:
- >-
  RUBRIK_SAMPLING_RATE missing env var defaults to 1.0 silently with no warning; present-but-invalid
  (non-float string) defaults to 1.0 with a warning; valid float but out-of-range clamps to [0.0, 1.0]
  with a separate warning.
- >-
  RUBRIK_BATCH_SIZE parsing accepts positive integers only; zero, negative or non-integer values
  fall back to the base CustomBatchLogger default (litellm.DEFAULT_BATCH_SIZE is 512) with a warning.
- >-
  The webhook URL preprocessing strips trailing slashes and removes "/v1" suffix, allowing webhook
  URLs to be provided with or without that segment; endpoint paths always include "/v1/..." segments.
- >-
  Moderation clients use httpxSpecialProvider.LoggingCallback and have separate timeout parameters
  (5-second timeout, 2-second connect) distinct from the logging batch client timeout, which comes
  from the per-request self.timeout override.
- >-
  The snapshot-based flush captures len(snapshot) at the time of successful POST and drains exactly
  that many items with del self.log_queue[:len(snapshot)], not len(self.log_queue); failed sends
  leave the queue untouched.
- >-
  max_queue_size enforcement with drop-oldest happens on every append; del self.log_queue[:overflow]
  removes the exact overflow count, not ceiling or rounding.
- >-
  Queue overflow warning interval uses wall-clock time (time.time()), not message count or iteration;
  the interval resets after each warning.
- >-
  Missing API keys result in a warning log but requests are sent with headers containing only
  Content-Type: "application/json", no Authorization header.
- >-
  The unified _post_json endpoint accepts Mapping[str, object] payload and dict() converts it for
  httpx.post's json= parameter; _post_to_response_moderation_endpoint wraps in {"request": ..., "response": ...} envelope.
- >-
  Both stream flags are set in __init__, not read from config; they are detect-only (streaming_end_of_stream_only)
  and buffer-until-moderated (streaming_buffer_until_moderated), both defaulting to True.
- >-
  RubrikLogger.flush_queue overrides the base implementation and requires self.flush_lock is not None;
  the lock is created by CustomBatchLogger.__init__ and passed through super().__init__(..., flush_lock=...).
