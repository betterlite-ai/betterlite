dod:
- text: Write tests named rubrik_initialization_tests and rubrik_client_setup_tests under
    rubrik_delivery::tests. The first asserts configuration parsing from environment and defaults,
    HTTP client construction with correct timeout values, stream flags set to true, and queue
    initialization. The second asserts moderation and logging endpoint URL construction from
    webhook base URL with correct path segments. Initialization with no RUBRIK_WEBHOOK_URL env var
    and null api_base parameter raises ValueError with text "Rubrik webhook URL not configured. Set RUBRIK_WEBHOOK_URL or pass api_base."
  proof:
  - rubrik-init-tests
  - rubrik-client-tests
- text: Write tests named rubrik_queue_management_tests asserting append-to-flush behavior,
    batch-size threshold triggering immediate flush, max queue overflow with drop-oldest
    backpressure, and warning interval enforcement. A full queue at cap drops oldest entries.
  proof:
  - rubrik-queue-tests
- text: Write tests named rubrik_flush_snapshot_tests asserting snapshot-based flush captures
    queue state consistently, sends the snapshot, and drains exactly the prefix that was sent.
    Snapshot contents are unchanged by mutations after capture. Failed sends retain the snapshot.
  proof:
  - rubrik-flush-tests
- text: Write tests named rubrik_json_post_tests asserting the unified POST layer sends
    correct headers (Content-Type and Authorization when API key is present), handles both
    response moderation (request/response envelope) and prompt moderation (bare request) payloads,
    and raises on non-dict responses or network failures. Missing API keys send without Authorization.
  proof:
  - rubrik-json-tests
- text: Every listed oracle case exercises initialization with various configuration sources,
    queue management including overflow and flush triggers, and JSON POST to all three endpoints.
    Cases verify endpoint URLs, Authorization headers, timeout enforcement and failure modes.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any
    or broad suppressions.
  proof:
  - probe-python
  - oracle
