pitfalls:
- 'The oracle helper for this task is pre-registered as openai_response_params in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/response_params.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_response_params.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A live map explicit supports_reasoning=false overrides the bundled set; only an absent declaration consults bundled
  defaults.
- The list from get_supported_openai_params is assembled from a set, so its ordering is not a wire contract.
- reasoning.effort object attributes participate in rejection, but only a dictionary effort participates in the
  later temperature gate.
