  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/lib.rs
  - crates/betterlite-openai/src/error.rs
  - crates/betterlite-openai/src/response_params.rs
  - crates/betterlite-openai/src/response_params/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/openai_response_params.rs
  - tools/oracle/src/helpers/openai_response_params/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/openai_response_params.py
  - tools/oracle/cases/helpers/providers/openai-response-params/**
  - tools/oracle/fuzz/corpus/helper_case/openai_response_params*
  - crates/betterlite-openai/fuzz/Cargo.toml
