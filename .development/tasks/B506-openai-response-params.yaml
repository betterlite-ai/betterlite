checks:
  optional:
  - mutants
  commands:
  - id: case-minimum-output-tokens
    why: Clamp integer max_output_tokens below 16 to OPENAI_RESPONSES_API_MIN_MAX_OUTPUT_TOKENS=16 for every model,
      retaining None/noninteger/at-least-16 values; this is a source constant, not an environment setting.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_minimum_output_tokens$/)'
  - id: case-reasoning-unsupported-drop-or-error
    why: Only provider OPENAI and a non-None requested reasoning.effort triggers capability rejection; litellm.drop_params
      or drop_params drops the entire reasoning object, otherwise UnsupportedParamsError 400 names reasoning.effort
      and supports_reasoning.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_reasoning_unsupported_drop_or_error$/)'
  - id: case-gpt5-temperature-default-effort
    why: Run GPT sampling guards only for unprefixed names or names whose first component is openai, then use B668
      GPT-family recognition. Temperature None or 1 survives; other values require supports_none and B502 explicit/default
      effort none, otherwise drop or UnsupportedParamsError 400.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_gpt5_temperature_default_effort$/)'
  - id: case-top-p-with-reasoning
    why: The presence of top_p, even None, requires the same none-effort condition on GPT reasoning models; false
      drop flags raise UnsupportedParamsError 400 and true flags remove top_p.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_top_p_with_reasoning$/)'
  - id: case-unknown-catalog-model
    why: Lookup the final slash-delimited model with provider openai; lookup exceptions permit reasoning. An explicit
      supports_reasoning value wins, otherwise consult a maxsize=1 cached bundled OpenAI reasoning-model set keyed
      by info.key.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_unknown_catalog_model$/)'
  - id: case-reasoning-summary-without-effort
    why: A reasoning mapping/object without effort bypasses the unsupported-effort guard; a dictionary is required
      for the subsequent GPT sampling guard to read effort.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_reasoning_summary_without_effort$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_response_params.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_response_params*")"
      && grep -lq 'openai_response_params' tools/oracle/fuzz/corpus/helper_case/openai_response_params* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_response_params$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_response_params)"
      && grep -q 'decode_response_capability_error' crates/betterlite-openai/fuzz/fuzz_targets/openai_response_params.rs
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_response_params_corpus$/)'
  - id: case-responses-parameter-set
    why: Supported fields are input, model, extra_headers, extra_query, extra_body, timeout and include, instructions,
      max_output_tokens, metadata, parallel_tool_calls, previous_response_id, reasoning, store, background, stream,
      temperature, text, tool_choice, tools, top_p, truncation, user, service_tier, safety_identifier, prompt, max_tool_calls,
      prompt_cache_key, prompt_cache_retention, prompt_cache_options, stream_options, top_logprobs, partial_images
      and context_management. Compare as a set; map_openai_params copies the map and does not itself filter unknown
      keys.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_responses_parameter_set$/)'
  - id: case-provider-capabilities
    why: custom_llm_provider is OPENAI; supports_native_file_search is true and encrypted agent messages are supported
      only for OPENAI/AZURE. JSON response protocol helpers directly return the supplied response.json result.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_provider_capabilities$/)'
