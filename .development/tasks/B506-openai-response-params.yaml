id: B506
title: OpenAI Responses options and reasoning gates
description: >-
  Introduce provider-local typed ResponsesOptions and the option mapper in betterlite-openai; B080 later exposes
  the public API. Model input, reasoning, text format, tool choice, max_output_tokens and passthrough fields explicitly,
  preserving omission. The pinned lower max_output_tokens bound comes from OPENAI_RESPONSES_API_MIN_MAX_OUTPUT_TOKENS=16,
  not the chat token floor. Share catalog capability lookup with reasoning_models.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/responses/transformation.py:
  _bundled_openai_reasoning_models L60-L72; _DeleteResponse.json L86-L86; _JsonObjectResponse.json L92-L92; _delete_response_body
  L95-L97; _json_object_body L100-L102; OpenAIResponsesAPIConfig.custom_llm_provider L107-L108; OpenAIResponsesAPIConfig.supports_native_file_search
  L110-L111; OpenAIResponsesAPIConfig.supports_encrypted_agent_messages L113-L114; OpenAIResponsesAPIConfig._is_gpt_5_model
  L117-L126; OpenAIResponsesAPIConfig._model_map_lookup_name L129-L130; OpenAIResponsesAPIConfig._supports_reasoning_effort_none
  L133-L137; OpenAIResponsesAPIConfig._effort_resolves_to_none L140-L151; OpenAIResponsesAPIConfig._supports_reasoning_param
  L154-L166; OpenAIResponsesAPIConfig._requests_reasoning_effort L169-L173; OpenAIResponsesAPIConfig._enforce_min_max_output_tokens
  L176-L186; OpenAIResponsesAPIConfig.get_supported_openai_params L188-L205; OpenAIResponsesAPIConfig.map_openai_params
  L207-L281.


  Reuse OpenAIGPT5Config.effort_resolves_to_none from B502 (litellm/llms/openai/chat/gpt_5_transformation.py); its
  implementation remains with that prerequisite.


  Reuse is_gpt_reasoning_series_name from B502 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-openai/src/response_params.rs with adjacent tests under response_params/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_response_params in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function response_params_cases in betterlite-openai with these exact named cases (one per oracle
  file): minimum_output_tokens, reasoning_unsupported_drop_or_error, gpt5_temperature_default_effort, top_p_with_reasoning,
  unknown_catalog_model, reasoning_summary_without_effort. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_response_params* using HelperCase: kind:
  helper and the externally tagged openai_response_params variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_response_params that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_response_capability_error consumes Responses provider capability/error response
  bytes in crates/betterlite-openai/src/response_params.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_response_params.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_response_params.
  The adjacent test replays_the_openai_response_params_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 164 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 448 planned, 450 maximum changed lines.
