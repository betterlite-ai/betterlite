  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L60-L281
  why: >-
    Own _bundled_openai_reasoning_models, _DeleteResponse.json, _JsonObjectResponse.json, _delete_response_body,
    _json_object_body, OpenAIResponsesAPIConfig.custom_llm_provider, OpenAIResponsesAPIConfig.supports_native_file_search,
    OpenAIResponsesAPIConfig.supports_encrypted_agent_messages, OpenAIResponsesAPIConfig._is_gpt_5_model, OpenAIResponsesAPIConfig._model_map_lookup_name,
    OpenAIResponsesAPIConfig._supports_reasoning_effort_none, OpenAIResponsesAPIConfig._effort_resolves_to_none,
    OpenAIResponsesAPIConfig._supports_reasoning_param, OpenAIResponsesAPIConfig._requests_reasoning_effort, OpenAIResponsesAPIConfig._enforce_min_max_output_tokens,
    OpenAIResponsesAPIConfig.get_supported_openai_params, OpenAIResponsesAPIConfig.map_openai_params. Other functions
    in this file remain with the owners listed below.
dod:
- text: >-
    minimum output tokens: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-response-params/minimum-output-tokens.yaml.
  proof:
  - case-minimum-output-tokens
  - oracle
  - helper-python
- text: >-
    reasoning unsupported drop or error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-response-params/reasoning-unsupported-drop-or-error.yaml.
  proof:
  - case-reasoning-unsupported-drop-or-error
  - oracle
  - helper-python
- text: >-
    gpt5 temperature default effort: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-response-params/gpt5-temperature-default-effort.yaml.
  proof:
  - case-gpt5-temperature-default-effort
  - oracle
  - helper-python
- text: 'top p with reasoning: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-response-params/top-p-with-reasoning.yaml.'
  proof:
  - case-top-p-with-reasoning
  - oracle
  - helper-python
- text: >-
    unknown catalog model: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-response-params/unknown-catalog-model.yaml.
  proof:
  - case-unknown-catalog-model
  - oracle
  - helper-python
- text: >-
    reasoning summary without effort: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-response-params/reasoning-summary-without-effort.yaml.
  proof:
  - case-reasoning-summary-without-effort
  - oracle
  - helper-python
- text: New openai_response_params seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_response_capability_error has newly committed malformed and boundary inputs replayed through production
    parsing.
  proof:
  - parser-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-minimum-output-tokens
    why: The minimum-output-tokens behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_minimum_output_tokens$/)'
  - id: case-reasoning-unsupported-drop-or-error
    why: The reasoning-unsupported-drop-or-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_reasoning_unsupported_drop_or_error$/)'
  - id: case-gpt5-temperature-default-effort
    why: The gpt5-temperature-default-effort behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_gpt5_temperature_default_effort$/)'
  - id: case-top-p-with-reasoning
    why: The top-p-with-reasoning behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_top_p_with_reasoning$/)'
  - id: case-unknown-catalog-model
    why: The unknown-catalog-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_unknown_catalog_model$/)'
  - id: case-reasoning-summary-without-effort
    why: The reasoning-summary-without-effort behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_params_cases::case_[0-9]+_reasoning_summary_without_effort$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_response_params.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_response_params*")"
      && grep -lq 'openai_response_params' tools/oracle/fuzz/corpus/helper_case/openai_response_params* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_response_params$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_response_params)"
      && grep -q 'decode_response_capability_error' crates/betterlite-openai/fuzz/fuzz_targets/openai_response_params.rs
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_response_params_corpus$/)'
