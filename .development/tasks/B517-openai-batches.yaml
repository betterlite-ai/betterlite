checks:
  optional:
  - mutants
  commands:
  - id: case-create-window-endpoint
    why: The create-window-endpoint behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_create_window_endpoint$/)'
  - id: case-metadata
    why: The metadata behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_metadata$/)'
  - id: case-retrieve-status-counts
    why: The retrieve-status-counts behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_retrieve_status_counts$/)'
  - id: case-cancel-batch
    why: The cancel-batch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_cancel_batch$/)'
  - id: case-list-after-limit
    why: The list-after-limit behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_list_after_limit$/)'
  - id: case-batch-error
    why: The batch-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_batches.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_batches*")"
      && grep -lq 'openai_batches' tools/oracle/fuzz/corpus/helper_case/openai_batches* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_batches$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_batches)"
      && grep -q 'decode_batch_object' crates/betterlite-openai/fuzz/fuzz_targets/openai_batches.rs && cargo nextest
      run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_batches_corpus$/)'
