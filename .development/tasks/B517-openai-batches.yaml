pitfalls:
- 'The oracle helper for this task is pre-registered as openai_batches in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/batches.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_batches.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Explicit None pagination is passed to the SDK, so an adapter that removes nulls before capture conceals the list
  behavior.
- The cancel method checks its sync client class even though create and retrieve only cast theirs.
