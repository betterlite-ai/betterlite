id: B517
title: OpenAI batch lifecycle
description: >-
  Add BatchCreate/BatchQuery/BatchObject provider methods for create, retrieve, cancel and list. Model completion_window,
  endpoint, input_file_id, metadata, status and counts explicitly; this is upstream asynchronous batch API, not
  B201 parallel synchronous completion calls.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/openai.py: OpenAIBatchesAPI.__init__
  L2038-L2039; OpenAIBatchesAPI.get_openai_client L2041-L2069; OpenAIBatchesAPI.acreate_batch L2071-L2077; OpenAIBatchesAPI.create_batch
  L2079-L2112; OpenAIBatchesAPI.aretrieve_batch L2114-L2121; OpenAIBatchesAPI.retrieve_batch L2123-L2155; OpenAIBatchesAPI.acancel_batch
  L2157-L2164; OpenAIBatchesAPI.cancel_batch L2166-L2202; OpenAIBatchesAPI.alist_batches L2204-L2212; OpenAIBatchesAPI.list_batches
  L2214-L2247.


  Implement crates/betterlite-openai/src/batches.rs with adjacent tests under batches/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation openai_batches in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batches_cases in betterlite-openai with these exact named cases (one per oracle file): create_window_endpoint,
  metadata, retrieve_status_counts, cancel_batch, list_after_limit, batch_error. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert
  both client response and captured upstream request. Existing API tasks retain route registration; this task must
  not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_batches* using HelperCase: kind: helper
  and the externally tagged openai_batches variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_openai_batches that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_batch_object consumes batch lifecycle JSON response bytes in crates/betterlite-openai/src/batches.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_batches.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_batches.
  The adjacent test replays_the_openai_batches_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 193 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 478 planned, 500 maximum changed lines.
