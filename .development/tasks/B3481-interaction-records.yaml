dod:
  - text: Interactions API response types are typed Rust structs matching LiteLLM's Pydantic models, with serde derives for JSON deserialization.
    proof: [types-tests]
  - text: Background polling never blocks, and poll tasks are tracked and cancelled on shutdown.
    proof: [polling-intervals-backoff]
  - text: A settlement gate ensures an interaction is billed or released exactly once, even when the poll task and delete path race to settle.
    proof: [settlement-exactly-once]
  - text: Every interaction status is handled correctly; requires_action is billable and terminal, in_progress and queued are pollable, and every terminal status settles the billing or reservation.
    proof: [terminal-vs-pollable]
  - text: Polling intervals double from initial to max, respecting the timeout, and give up with a warning after the timeout expires.
    proof: [polling-intervals-backoff]
  - text: A missing usage block is expected for non-terminal statuses, requires_action, failed, cancelled, incomplete and budget_exceeded, but raises a cost-tracking alarm if it is missing from completed or requires_action responses.
    proof: [usage-expected-predicate]
  - text: Deleting an interaction settles its pending poll before dispatching the delete.
    proof: [settle-before-delete-ordering]
checks:
  optional: []
  commands:
    - id: types-tests
      why: Interactions API response types deserialize and match LiteLLM's structure for all required status and content fields
      run: cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/^types::.*tests::/) and not test(/replays/)'
    - id: polling-intervals-backoff
      why: Poll intervals double from initial to maximum, respecting timeout as a hard boundary; last interval may be shorter if time runs short
      run: cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/polling.*interval/)' || cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/^polling::tests::/) and not test(/replays/)'
    - id: terminal-vs-pollable
      why: Terminal status set (completed, failed, cancelled, incomplete, budget_exceeded, requires_action) and pollable set (in_progress, queued) are correctly classified and routed to settlement or continued polling
      run: cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/^polling::tests::.*status/) and not test(/replays/)'
    - id: settlement-exactly-once
      why: Settlement gate prevents double-billing and double-release when poll task and delete path race to claim settlement under concurrent execution
      run: cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/^polling::tests::.*settlement/) and not test(/replays/)'
    - id: usage-expected-predicate
      why: Missing usage is expected for in_progress, queued, failed, cancelled, incomplete and budget_exceeded; missing usage raises an alarm for completed and requires_action
      run: cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/missing.*usage/)' || cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/^polling::tests::.*usage/) and not test(/replays/)'
    - id: settle-before-delete-ordering
      why: Delete operation fetches current state with create credentials, bills if terminal with usage, else releases reservation; settlement flag makes poll and delete mutually exclusive
      run: cargo nextest run --locked -p betterlite-interactions --no-tests=fail -E 'test(/^deletion::tests::/) and not test(/replays/)'
oracle_cases: []
deviations:
  - what: Background polling is built with explicit async tasks that must be cancelled on server shutdown, using a JoinSet the server owns.
    why: LiteLLM keeps a global dict of running polls and relies on Python GC; betterlite avoids globals and ensures cleanup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/background_cost_polling.py#L241
  - what: Polling intervals and timeouts are config values injected into polling contexts, not globals read from litellm.constants.
    why: Dependencies come in through constructors; betterlite reads config once and passes values to callers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py
  - what: Settlement uses an Arc<Mutex<bool>> flag on the logging object, not a dict entry, and settlement is claimed with a compare-and-swap to avoid subtle timing bugs.
    why: Dict mutation is not atomic; Rust's type system enforces exclusive access to the flag.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/background_cost_polling.py#L102-L111
out_of_scope:
  - The full litellm_logging.py file. This task owns only the interactions-related methods that call async_log_background_interaction_completion and track InteractionsAPIResponse objects. The logging integration is built elsewhere by a task that depends on this one.
  - Billing and budget reservation logic itself. This task only calls functions provided by the logging system to settle interactions with their final cost; the task that owns budget tracking (B3003 or later) implements the actual reservations and releases.
  - Interactions route handlers and request/response transformation. Those are owned by tasks that implement the /interactions routes and handle request validation and response assembly.
  - The admin dashboard and user-facing interactions management. Those are not part of the interactions API's internal polling logic.
pitfalls:
  - LiteLLM's _ACTIVE_POLLS is a global dict that lives for the lifetime of the process. Use a JoinSet the server owns instead, so polling tasks are cancelled cleanly on shutdown.
  - "The settlement gate _claim_settlement sets a flag if it is not already set and returns whether the claimer owns the settlement. Both the poll task and delete path can call it, and whichever claims first is solely responsible for billing or release. The flag is not atomic in Python and can be read as settled by one task while another is setting it; use a compare-and-swap or check-then-set under a lock that stays held through the write."
  - asyncio.sleep inside poll loops blocks the whole event loop in Python. Rust awaits are cooperative, so tokio::time::sleep is safe and returns control to the runtime between iterations.
  - Polling intervals double until they hit the maximum, then stay at maximum. The loop yields intervals where the elapsed time plus the next interval does not exceed the timeout, so the last interval might be smaller than the max if time runs short.
  - "A response with status requires_action means the model asked for a tool call. The caller answers by creating a new interaction with previous_interaction_id pointing at it. The first interaction is terminal and billable there; polling it again would be wrong. The proxy's success callback checks is_pollable_background_interaction, which returns false for requires_action."
  - "Missing usage is expected for in_progress, queued, failed, cancelled, incomplete and budget_exceeded, but an alarm fires if completed or requires_action arrives without it. LiteLLM checks this in a cost-tracking diagnostic that logs the issue but does not fail the call. betterlite does the same: log a warning but continue."
  - A poll that times out without reaching a terminal status logs an error if the last status it saw was not in the pollable or terminal sets (a bad state), or a warning otherwise, and releases the budget reservation.
  - "Batch polling: LiteLLM groups polls by (provider, interaction_id) so one fetch operation satisfies many poll tasks waiting for the same interaction. Do not implement batching in the initial version; each poll task fetches independently. Batching is a later optimization."
review_level: standard
budget:
