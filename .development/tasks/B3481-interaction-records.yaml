id: B3481
title: Interaction records and billing eligibility
description: >-
  Build Rust types for the Google Interactions API and the background polling and billing logic LiteLLM uses to track costs for async interactions.
  The Interactions API lets a caller create an interaction with background=true to return immediately with status in_progress and no usage block. The proxy then schedules a background poll task to fetch the interaction until it reaches a terminal status (completed, failed, cancelled, incomplete, budget_exceeded, or requires_action), and bills the call only once with the final usage.
  Build crates/betterlite-interactions as the module for all interactions logic. It reads the Interactions API response types from litellm/types/interactions/generated.py (a Pydantic auto-generated OpenAPI client) and implements the polling, billing and budget reservation release logic that litellm/interactions/background_cost_polling.py defines.
  An interaction reaching requires_action is terminal and billable, but unanswerable by the caller (the API has no resume operation). A later call with previous_interaction_id points at it and bills itself separately, so a requires_action interaction is settled and billed where it stops, not polled until timeout.
  Deleting an interaction makes every subsequent poll fail. The delete path must settle any pending poll for that interaction before dispatching the delete (fetching its state, billing if it is terminal with usage, else releasing the budget reservation), and a settlement gate makes the poll task and delete path mutually exclusive so it is billed exactly once.
  Interaction creates that return in_progress with background=true defer releasing the budget reservation until the poll task settles them (either with a success event billing the final usage, or by releasing the reservation on timeout or if the interaction terminates without billable output), so a reserved-but-unpaid interaction does not block other requests.
  A GET poll or delete that arrives while polling is live settles the background interaction immediately instead of waiting for the background task, then continues with the delete or returns its state without a usage block (polls are never billed, ever). The delete path settles the interaction before dispatching the delete, and settles it by fetching, billing if terminal with usage, else releasing. A poll that finds a terminal status with usage bills once; a poll that finds a terminal status without usage or times out releases the reservation.
scope:
  paths:
    - crates/betterlite-interactions/**
  lint_tables: false
