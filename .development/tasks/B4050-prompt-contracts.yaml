id: B4050
title: Prompt contracts and compiled result projection
description: >-
  Add prompt specification, integration contracts and compiled-result types to crates/betterlite-models.
  The prompt management system dispatches through a common interface, so these types live in the models crate
  used everywhere. Build SupportedPromptIntegrations enum, PromptSpec, PromptInfo, PromptLiteLLMParams records,
  PromptManagementClient (the compiled result), and the contracts every backend implements: integration_name property,
  should_run_prompt_management, _compile_prompt_helper (sync) and async_compile_prompt_helper methods.
  Include the utility functions: resolve_ignore_flags (merges ignore flags from request and spec),
  _get_model_from_prompt (picks model from compiled result or strips integration prefix), and post_compile_prompt_processing
  (merges compiled optional params, picks model, collects completed messages).
  Add CustomPromptManagement, a no-op backend that passes through model, messages and params unchanged and raises
  NotImplementedError on compile methods, so custom hooks can inherit it without implementing compilation.
  Include TestPromptRequest for testing prompt logic without routing.
  Preserve "development" as the default environment, false as the default for ignore flags, prompt_type="config"
  injection when not supplied, extra prompt fields via ConfigDict(extra="allow"), template-option precedence over
  request options in post_compile_prompt_processing (template params overwrite request params), and stripping
  every occurrence of the integration-name prefix from the model when the template provides no model override.
  Keep custom Python extension execution (litellm_logging, callbacks, hooks) out of scope: these types are passive.
  The PromptManagementClient.prompt_optional_params field holds optional template params. Model and param
  projection are wrapped in compile_prompt, async_compile_prompt, get_chat_completion_prompt and async_get_chat_completion_prompt
  methods, owned by B4058; this task defines the passive type only.
scope:
