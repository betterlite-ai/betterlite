id: B1136
title: Responses chat content projection
description: >-
  Project media/file content and tool-choice fields shared by chat history and request assembly without performing
  network reads.


  Implement crates/betterlite-core/src/api/response_chat_content.rs. Use ResponseChatContentInput and ResponseChatContentResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions source_success, source_failure, source_defaults under api::response_chat_content::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponseChatContent in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_chat_content: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/completion_extras/litellm_responses_transformation/transformation.py: _input_file_from_file_value
  (L206-L213); litellm/completion_extras/litellm_responses_transformation/transformation.py: _flat_responses_tool_choice
  (L265-L268); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._normalize_tool_choice_for_responses_api
  (L294-L313); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._convert_content_str_to_input_text
  (L991-L995); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._convert_content_to_responses_format_image
  (L997-L1023); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._convert_content_to_responses_format
  (L1025-L1115); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._convert_annotations_to_chat_format
  (L1278-L1311). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 162 owned nonblank/non-comment/non-docstring Python lines (169 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 182 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 396 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B183 (Bounded inline media conversion), B171 (Direct helper oracle and URL path encoding),
  B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
