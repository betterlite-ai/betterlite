id: B1136
title: Project chat content and tool choices into Responses records
description: >-
  Add api::response_chat_content for the seven complete content/file/image, tool-choice
  and annotation functions linked below. These transform decoded values and never fetch
  an image or file. Use B004 chat records and B902 Responses records with an explicit
  unknown-content variant so unfamiliar blocks retain the pinned fallback behavior.
  Register response_chat_content with B171; compare returned fields and ordered debug
  diagnostics. Object-shaped annotation fixtures select model_dump, legacy dict, unsupported
  or throwing serialization in the typed adapter, never arbitrary Python execution.
  The owned functions total 169 nonblank/non-comment lines. Plan 180 implementation,
  130 tests, 85 fixture, 80 adapter and 25 wiring lines: 500 changed lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/response_chat_content.rs
  - crates/betterlite-core/src/api/response_chat_content/**
  - tools/oracle/src/helpers/core_ops/response_chat_content.rs
  - tools/oracle/src/helpers/core_ops/response_chat_content/**
  - tools/oracle/helpers/response_chat_content.py
  - tools/oracle/helpers/response_chat_content/**
  - tools/oracle/fuzz/corpus/helper_case/response_chat_content-*
  - tools/oracle/cases/helpers/response-chat-content/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L206-L213
  why: File projection preserves only present file_id, file_data and filename keys, including nulls.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L265-L268
  why: Flat tool choice retains only type and name.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L294-L313
  why: Existing top-level names beat nested function/custom names and invalid choices pass through.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L991-L1115
  why: Whole text, image and mixed-content methods expose the role mapping and spread-order quirk.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L1277-L1311
  why: Unsupported or unserializable annotations are debug-logged and skipped independently.
dod:
- text: >-
    text_by_role maps null to one empty text block and "hi" to one text=hi block.
    user,system,developer,tool use type=input_text; assistant and unknown roles use
    output_text. Lists preserve string entries, map {type:text} with missing text to "",
    ignore non-string/non-dict entries and preserve empty lists. A top-level number 7
    becomes text="7"; a dict of unknown type with text=hello becomes text="hello".
  proof: [content-tests, oracle, content-adapter]
- text: >-
    content_passthrough preserves input_text,input_image,output_text,refusal,input_file,
    computer_screenshot,summary_text dictionaries with all fields. {type:image,url:u}
    remains type=image because the original dictionary overwrites type=input_image.
    A missing type defaults to input_text and passes the original dict unchanged.
    tool_reference disappears and logs "Chat provider:   tool_reference has no responses API equivalent; skipped".
    Pin per-item debug logs and final "Chat provider: Final converted content: %s" with the actual result.
  proof: [content-tests, oracle, content-adapter]
- text: >-
    image_and_file_fields maps image_url="https://example.test/a" to
    {type:input_image,image_url:"https://example.test/a",detail:auto} without a download.
    Nested detail=high overrides auto; empty detail does not, and empty URL is accepted.
    Missing image_url raises ValueError "Invalid image URL: None"; {url:null} raises
    "Invalid image URL: {'url': None}". A file dict copies only present file_id,file_data,
    filename, preserving null and empty values while dropping file_url and vendor keys;
    missing/non-dict file yields {type:input_file}. Input records are not mutated.
  proof: [content-tests, oracle, content-adapter]
- text: >-
    flat_tool_choice converts {type:required,extra:1} to "required" and similarly auto/none.
    For function/custom, a nonempty string top-level name wins over a nested name and
    the result has only type/name. Otherwise use a nonempty nested string name. Empty,
    nonstring or absent names preserve the entire original choice; unknown type and
    non-dict choices pass through. Test both function and custom variants.
  proof: [content-tests, oracle, content-adapter]
- text: >-
    annotation_fallback returns null for null,[] or an all-skipped list. Dict annotations
    pass unchanged; model_dump wins over dict when both exist. A serializer raising
    ValueError("broken") is skipped with "Skipping malformed annotation: %s, error: %s";
    integer 7 is skipped with "Skipping unsupported annotation type: %s". Valid neighbors
    survive in order and annotation types are not filtered to URL citations.
  proof: [content-tests, oracle, content-adapter]
checks:
  optional: []
  commands:
  - id: content-tests
    why: content defaults, choice normalization or annotation skipping differs
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_content::/)'
  - id: content-adapter
    why: the projection has no independent pinned execution
    run: test -f tools/oracle/helpers/response_chat_content.py && grep -qE '^[[:space:]]+response_chat_content:' tools/oracle/fuzz/corpus/helper_case/response_chat_content-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/response-chat-content/text-by-role.yaml
- tools/oracle/cases/helpers/response-chat-content/content-passthrough.yaml
- tools/oracle/cases/helpers/response-chat-content/image-and-file-fields.yaml
- tools/oracle/cases/helpers/response-chat-content/flat-tool-choice.yaml
- tools/oracle/cases/helpers/response-chat-content/annotation-fallback.yaml
deviations: []
out_of_scope:
- B917 owns reasoning/history and tool-call records; B918 request options; B919 response assembly; B920 streaming; B2412 SSE recovery.
- _map_responses_status_to_finish_reason L1313-L1325 has no caller at the pin and receives no implementation or cases.
- No function here downloads a request URL. B183 owns inline conversion and the current remote-fetch rejection boundary when another caller requires bytes; forwarding image_url here does not invoke it.
pitfalls:
- 'The oracle helper for this task is pre-registered as response_chat_content in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/response_chat_content.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/response_chat_content.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The image dictionary spread keeps type=image; changing it to input_image would silently fix upstream behavior.
- A missing type passes through the original dictionary without inserting the default type key.
- File URL fields are dropped here, while image URLs are forwarded unchanged without fetching.
review_level: standard
budget:
  max_changed_lines: 500
  max_new_expects: 1
