dod:
  - text: resolve_agent_access returns the managed result for a managed key, and otherwise intersects key and team access with the caller's access and then with the agent ceiling (Unrestricted own access becomes the ceiling, Restricted own access is intersected, no ceiling keeps own access).
    proof: [resolver-tests, oracle-cases]
  - text: In strict mode an Unrestricted key and team access returns Restricted(empty) and every port error propagates; in non-strict mode the same input stays Unrestricted.
    proof: [strict-tests]
  - text: is_agent_allowed uses the Restricted ids through the stable id and legacy ids of the agent, and returns true for Unrestricted access.
    proof: [allowed-tests]
  - text: is_agent_allowed for a managed target returns false when the target is disabled, has no or an inactive identity, is missing from the store while the registry says managed, or the caller auth is absent; a store failure is returned as AgentAccessError::Identity.
    proof: [managed-target-tests]
  - text: is_agent_allowed for a managed target reloads the key with check_db_only true only for a plain key (not a managed key, session token or custom auth), builds the fresh auth with requires_fresh_policy true and the original agent_caller, and answers from the strict granted ids.
    proof: [managed-target-tests]
  - text: granted_agent_ids unions the granted ids over the effective contexts and treats Unrestricted as no ids.
    proof: [listing-tests, oracle-cases]
  - text: accessible_agents returns every agent for proxy_admin, keeps non-managed agents whose raw agent_id is granted, and keeps managed agents only when is_agent_allowed says so, in the original order.
    proof: [listing-tests, oracle-cases]
  - text: managed_actor_agent_access denies when the policy or object_permission is missing, narrows the agent's own grants by every ceiling and by the caller grants, and applies the autonomous, no-user and human-grant rules.
    proof: [managed-access-tests]
  - text: verified_human_agent_grants asks for the allowed team set (Some of the team, or Some of an empty set) and unions the user's own source with the source of the given team.
    proof: [humans-tests, oracle-cases]
  - text: resolve_delegated_agent_team returns team_id for a user-level grant, team_id when it grants, the smallest granting team when no team was chosen, and TeamNotGranted (403) otherwise; allowed_team_ids only filters the granting teams.
    proof: [humans-tests, oracle-cases]
checks:
  optional: []
  commands:
    - id: resolver-tests
      why: resolve_agent_access does not combine key, team, caller and ceiling access as LiteLLM does
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_access::resolver::/) - test(/^agent_access::resolver::strict_/)'
    - id: strict-tests
      why: strict mode does not deny an Unrestricted key and team access, or swallows a port error
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_access::resolver::strict_/)'
    - id: allowed-tests
      why: is_agent_allowed does not match restricted ids through stable and legacy ids
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_access::allowed::registry_/)'
    - id: managed-target-tests
      why: is_agent_allowed for a managed target skips an admission check, reloads the key wrongly or builds the fresh auth wrongly
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_access::allowed::managed_/)'
    - id: listing-tests
      why: granted_agent_ids or accessible_agents differ from LiteLLM in union, admin or managed handling
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_access::listing::/)'
    - id: managed-access-tests
      why: managed_actor_agent_access does not narrow by ceilings, caller grants or the human rules
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_access::managed::/)'
    - id: humans-tests
      why: verified human grants or the delegated team choice differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_access::humans::/)'
    - id: oracle-cases
      why: the oracle cases are missing or the Rust answers differ from LiteLLM's on the same input
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/agent-access)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::auth::b4780::/)'
oracle_cases:
  - tools/oracle/cases/agent-access/accessible-admin-sees-all.yaml
  - tools/oracle/cases/agent-access/accessible-unrestricted-sees-none.yaml
  - tools/oracle/cases/agent-access/accessible-union-of-contexts.yaml
  - tools/oracle/cases/agent-access/human-grants-own-and-team.yaml
  - tools/oracle/cases/agent-access/human-grants-no-team-excludes-teams.yaml
  - tools/oracle/cases/agent-access/delegated-team-user-grant.yaml
  - tools/oracle/cases/agent-access/delegated-team-explicit-team.yaml
  - tools/oracle/cases/agent-access/delegated-team-smallest-team.yaml
  - tools/oracle/cases/agent-access/delegated-team-not-granted.yaml
  - tools/oracle/cases/agent-access/delegated-team-allowed-filter.yaml
deviations:
  - what: The injected resolve_ceiling, resolve_access and effective_contexts callables are replaced by the three port traits GrantSources, TargetAgents and HumanSources, passed to the resolver's constructor.
    why: betterlite wires dependencies through constructors and has no function-valued defaults that reach module globals. The same calls happen in the same order.
  - what: granted_agent_ids resolves the contexts one after another, not with asyncio.gather. When several contexts fail, the first failing context in list order is reported.
    why: The result is a union and does not depend on order. Only which error wins can differ, and gather's choice is timing-dependent anyway.
  - what: accessible_agents resolves the managed agents one after another, not concurrently.
    why: The permitted set does not depend on order.
  - what: The identity failure raised through raise_identity_failure, the 503 "Agent invocation policy is unavailable" and the 403 team error are variants of AgentAccessError with a status() method, not HTTPException values.
    why: betterlite errors are typed. The HTTP layer turns status() and the message into the same response LiteLLM sends.
  - what: Only the proxy_admin role enum value is compared in accessible_agents; LiteLLM also accepts the plain string "proxy_admin".
    why: UserApiKeyAuth.user_role is already the role enum in betterlite, so a stray string cannot reach this code.
out_of_scope:
  - "B4778 owns AgentAccess, to_stable_ids and intersect_agent_access (agent_permission_handler.py L35-L69), the access group ceiling and resolve_managed_agent_ceilings."
  - "B4779 owns the key and team grant methods and _agent_access_group_ceiling (L113-L154, L273-L487). It also owns _get_key_object_permission. The production GrantSources implementation wraps them."
  - "_get_team_object_permission, get_agent_access_groups, _get_agent_access_groups_for_key and _get_agent_access_groups_for_team: no caller at the pin."
  - "B4772 owns managed_agent_policy and the identity failure conversion. B4773 owns AgentIdentityStore, which the production TargetAgents wraps."
  - "B4679 owns reload_admitted_key, B4673 reload_admitted_user, B4671 admitted_subject_sources and B4672 build_effective_auth_contexts. The production HumanSources forwards to them."
  - "B4781 owns managed_authorization.py and the route handlers that call is_agent_allowed and accessible_agents; B855 or the JWT admission owner calls resolve_delegated_agent_team."
pitfalls:
  - accessible_agents and granted_agent_ids call resolve_agent_access without strict, and an Unrestricted answer counts as no ids. A key with no agent grant therefore lists no non-managed agents, while is_agent_allowed for the same key says true.
  - In strict resolve_agent_access, Unrestricted key and team access becomes Restricted(empty) before the caller and ceiling are looked at. Moving that check after the intersection would let a ceiling turn "everything" into a grant.
  - is_agent_allowed enters the store branch when the registry copy is managed or a database exists. A row that exists but is not identity_managed falls through to the ordinary grant check, it does not return false.
  - fresh_auth takes agent_caller from the original auth, not from the reloaded key, and sets requires_fresh_policy true. Copying from authority would drop the forwarded caller cap.
  - The key is reloaded only for a plain key. A managed key (managed_agent_policy present), a session token and a custom-auth key all use the auth as given.
  - key_hash is api_key first, then token. A key with neither skips the reload.
  - managed_actor_agent_access compares raw ids. The ceilings, the caller grants and the human grants are not mapped to stable ids, unlike resolve_agent_access.
  - A managed agent whose object_permission is an empty map is denied, the same as a missing one. Granted ids of an own-grant that is Unrestricted are empty, so a managed agent with no declared agents reaches none.
  - verified_human_agent_grants passes Some(empty set) for allowed_team_ids when there is no team_id, so no team source is admitted. Passing None would admit all of them.
  - resolve_delegated_agent_team passes None to the source reload and applies allowed_team_ids only to granting_teams. A user-level grant returns team_id even when team_id is None.
  - The smallest team is chosen only when explicit_team is false. With an explicit team that does not grant, the answer is TeamNotGranted even if other teams grant.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
