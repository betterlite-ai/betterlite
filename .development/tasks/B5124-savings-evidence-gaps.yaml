id: B5124
title: Close the B1693 savings evidence audit gaps
description: >-
  Fix the gaps an Opus review found in B1693's savings evidence readers after it merged. Three readers
  give a different answer from LiteLLM, four oracle cases can't fail on the branch their name promises,
  and three cases B1693 added have never run.

  LiteLLM's _numeric_savings returns any finite float as the recorded savings
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L473-L477).
  BaselineCostSnapshot takes any finite float at or above zero for actual_spend, actual_token_cost and
  classifier_cost
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L125-L134),
  and _recorded_token_cost adds input_cost and output_cost as floats
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L210-L229).
  Tiny float residues are normal in these fields. The spend log's autorouter_savings is a float8
  subtraction in Postgres
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/baseline_accounting.py#L240-L252),
  so values such as -2.7755575615628914e-17 come back, in exponent form or as a plain decimal with 33
  places. betterlite reads all three through B204's parse_decimal_lexeme, and it fails past
  rust_decimal's 28 decimal places. So numeric_savings returns None and the estimate reads as unknown,
  StrictDecimal rejects the whole snapshot with AmountOutOfRange, and numeric_cost_component drops the
  component so recorded_token_cost is None. The fix adds one amount reader in savings_evidence/numeric.rs.
  It rounds a finite lexeme with more than 28 places half away from zero to 28 places, in plain or
  exponent form, and reads a value below that resolution as 0. Overflow keeps today's None or
  AmountOutOfRange. numeric_savings, StrictDecimal and numeric_cost_component all use it. LiteLLM prints
  such a value with up to 33 places and a Decimal holds 28, so no oracle case can match. Rust tests prove
  it, and the rounding is a deviation.

  LiteLLM keeps cache_write_tokens and cache_creation_tokens equal. PromptTokensDetailsWrapper.__setattr__
  copies an assignment to either field into the other, and its __init__ sets cache_write_tokens from
  cache_write_tokens, else cache_creation_tokens, else an integer cache_creation_input_tokens extra key
  inside prompt_tokens_details
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1784-L1820).
  Usage.__init__ applies a top-level cache_creation_input_tokens by assigning cache_write_tokens, so the
  override reaches both fields
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1939-L1952).
  betterlite's coerce_prompt_tokens_details reads the two fields apart with a missing one as 0, ignores
  the nested cache_creation_input_tokens, and apply_cache_overrides sets only cache_write_tokens.
  _cache_token_split then reads cache_creation_tokens first
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L267-L321),
  so the baseline gets the wrong write count. For usage {prompt_tokens: 100, cache_read_input_tokens: 20,
  cache_creation_input_tokens: 10, prompt_tokens_details: {cached_tokens: 20, cache_creation_tokens: 3}}
  priced against a baseline with a zero cache read rate, LiteLLM's baseline has 10 cache writes and 90
  text tokens, and betterlite's has 3 and 97. The fix picks the write count in LiteLLM's order with
  optional reads, sets both fields to it, and makes the top-level override set both. cache_token_split
  stays as it is. Both adapters' baseline_usage output gains cache_creation_tokens, since no case can see
  that field today.

  LiteLLM's _coerce_billed_at returns datetime.fromisoformat(value.replace("Z", "+00:00")), or None on
  ValueError
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L44-L50),
  and the result picks the pricing window for prompt caching savings
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L595-L615).
  Python 3.13's fromisoformat
  (https://github.com/python/cpython/blob/v3.13.16/Lib/_pydatetime.py#L278-L478 and
  https://github.com/python/cpython/blob/v3.13.16/Lib/_pydatetime.py#L1862-L1885) finds the separator by
  position and takes any one character there. It reads the date as YYYY-MM-DD, YYYYMMDD, YYYY-Www[-D] or
  YYYYWww[D] with exact widths, the time as HH[:MM[:SS[.f or ,f]]] with colons used all or nowhere, and
  the offset as HH, HHMM, HH:MM, HHMMSS or HH:MM:SS with an optional fraction. It then rejects second 60
  (https://github.com/python/cpython/blob/v3.13.16/Lib/_pydatetime.py#L548-L562), year 0, and an offset
  of 24 hours or more. decode_billed_at tries a fixed list of chrono formats instead. It returns None for
  "2024-03-01T10:00:00,5Z" (comma fraction), "2024-W09-5T10:00:00Z" (week date),
  "2024-03-01T10:00:00+02" (hour-only offset), "2024-03-01T10:00:00+02:00:30" (offset seconds), and
  "2024-03-01T100000Z" and "20240301T10:00:00Z" (basic form on one side only). It returns a time for
  "2024-03-01T23:59:60Z" because chrono takes a leap second, and for "2024-3-1" because chrono reads
  one-digit fields. The fix ports the grammar as a small parser over chars, keeps reading a naive result
  as UTC, and uses chrono only to build the date and time from fields the parser has checked.

  Four B1693 cases can't fail on the branch their name promises. version-bool-and-unknown-status sets
  version true and status unknown together, so removing either check in
  recorded_estimated_autorouter_savings
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L480-L489)
  still gives null. snapshot-strictness-and-tuple-basis sends actual_spend true, so both sides reject the
  snapshot and the [flex, null, null] basis is never compared. injection-all-deployments-and-sibling-leg
  only sends the empty marker, while marks_gateway_injection also matches the marker against the row's
  model_id
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L395-L413).
  iso-time-z-offset-and-invalid decodes one Z string and never an explicit offset or garbage. Each is
  replaced by cases that test one branch each, under names that say which.

  B1693 also added date-only-reads-as-utc-midnight, naive-datetime-reads-as-utc and
  top-level-cache-counts-without-nested-details without listing them in oracle_cases. Main's CI runs no
  oracle case a task doesn't list, so they have never run, and as they stand they fail on the
  projections rather than on the code under test. The Python helper process gets no TZ, so the naive
  datetime _coerce_billed_at returns goes through .timestamp() in the machine's local zone, while
  LiteLLM's off-peak pricing reads a naive time as UTC
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L495-L503).
  The Python baseline_usage projection prints a missing detail count as null and the Rust side prints 0.
  LiteLLM's readers treat a missing count as 0
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L961-L967),
  and docs/compatibility.md has absent or null take the default. The fix lists the whole case folder and
  corrects both projections.

  No finding is left out. Each one checked out against LiteLLM 1.105.1 and CPython 3.13.16. The reviewer
  asked for an oracle case for the rounding, and that one becomes Rust tests and a deviation because the
  two sides can't print the same digits.
scope:
  paths:
  - crates/betterlite-models/src/savings_evidence/**
  - crates/betterlite-models/fuzz/corpus/billed_at/**
  - tools/oracle/src/helpers/models/savings_evidence.rs
  - tools/oracle/helpers/savings_evidence.py
  - tools/oracle/cases/helpers/savings-evidence/**
  lint_tables: false
