    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::request_policy_cases::case_[0-9]+_owned_empty_removes_spoofed_header$/)'
  - id: case-identity-before-client-budget
    why: Read metadata then litellm_metadata mappings, ignoring nonmappings. For allowlisted user_api_key_ fields
      in config order take first string value across sources, even empty or invalid; invalid first text blocks fallback
      to later valid value. Keep regex-valid identity pairs first, capped16. Then caller requestMetadata pairs,
