      each configured member then deduplicate by first occurrence. Any surviving configured field owns metadata
      even an unrecognized field or empty string. No allowed fields -> resolverNone and no owned header names; no
      implicit spend metadata forwarding.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::request_policy_cases::case_[0-9]+_request_metadata_owner$/)'
  - id: case-request-metadata-size-characters
