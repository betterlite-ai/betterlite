      are all nonempty strings, remove request-only aws_access_key_id,aws_secret_access_key,aws_session_token,aws_session_name,aws_profile_name,aws_role_name,aws_web_identity_token,aws_sts_endpoint,aws_external_id,aws_session_tags,aws_region_name
