id: B596
title: Bedrock trusted request metadata and SDK projection
description: >-
  Add BedrockRequestPolicy with requestMetadata ownership, configuration/auth aliases, regional metadata and live
  SDK request parameter projection. Resolve litellm_settings.bedrock_request_metadata_fields (default empty/off)
  through config; deduplicate the ordered allowlist, reserve user_api_key_ names to injected proxy identity, and
  allow spend_logs_metadata only by explicit allowlisting. Preserve the 16-pair limit, key lengths 1..256, value
  lengths 0..256, allowed character regex, invalid-pair dropping and owned-but-empty header eviction. Live SDK dynamic
  event headers become explicit request headers; FakeResponseIterator is one owned terminal response, not a second
  stream parser.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  error_response_text L59-L63; _synthesize_error_response L66-L75; merge_bedrock_aws_request_params L108-L129; get_cached_model_info
  L156-L169; _get_local_model_cost_map L173-L176; AmazonBedrockGlobalConfig.__init__ L456-L457; AmazonBedrockGlobalConfig.get_mapped_special_auth_params
  L459-L463; AmazonBedrockGlobalConfig.map_special_auth_params L465-L470; AmazonBedrockGlobalConfig.get_all_regions
  L472-L479; AmazonBedrockGlobalConfig.get_ap_regions L481-L493; AmazonBedrockGlobalConfig.get_sa_regions L495-L496;
  AmazonBedrockGlobalConfig.get_eu_regions L498-L511; AmazonBedrockGlobalConfig.get_ca_regions L513-L514; AmazonBedrockGlobalConfig.get_us_regions
  L516-L527; add_custom_header L530-L538; _get_bedrock_client_ssl_verify L541-L552; ModelResponseIterator.__init__
  L728-L730; ModelResponseIterator.__iter__ L733-L734; ModelResponseIterator.__next__ L736-L740; ModelResponseIterator.__aiter__
  L743-L744; ModelResponseIterator.__anext__ L746-L750. litellm/llms/bedrock/request_metadata.py: _is_forwardable
  L36-L37; _text_pairs L40-L43; _allowed_fields L46-L56; _metadata_sources L59-L68; _identity_pairs L71-L81; _first_text
  L84-L85; _client_pairs L88-L108; resolve_bedrock_request_metadata L111-L136; bedrock_request_metadata_is_owned
  L139-L149; bedrock_request_metadata_headers L152-L170; merge_bedrock_invoke_headers L173-L199. litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig._validate_request_metadata L316-L385.


  init_bedrock_client has no caller at the pin and is excluded; the live _get_boto_credentials/get_credentials paths
  remain in their own tasks, so no endpoint/SSL constructor case is needed here.


  Implement crates/betterlite-bedrock/src/request_policy.rs with adjacent tests under request_policy/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_request_policy in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function request_policy_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): request_metadata_owner, request_metadata_size_characters, unowned_user_metadata, auth_alias_mapping, region_groups,
  one_response_iterator, owned_empty_removes_spoofed_header, identity_before_client_budget, allowlist_duplicate_first,
  invalid_pairs_dropped. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_request_policy* using HelperCase: kind:
  helper and the externally tagged bedrock_request_policy variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_request_policy that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/request_policy.rs
  and its loader wiring: bedrock_request_metadata_fields. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest bedrock_request_policy_config_cases
  with named cases loads_bedrock_request_metadata_fields, plus rejects_unrelated_key. Each loads case calls the
  real config loader with that key and asserts the resolved value, default, precedence and secret redaction where
  applicable. Seed B002 config_yaml with new bedrock_request_policy* files for every key; reuse its parser/fuzz
  target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_request_policy_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_request_policy_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 349 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 365 production lines, 172 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 28 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 685 planned, 700 maximum changed lines.
