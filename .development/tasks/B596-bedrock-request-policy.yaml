id: B596
title: Bedrock trusted request metadata and SDK projection
description: >-
  Add BedrockRequestPolicy with requestMetadata ownership, configuration/auth aliases and trusted deployment/request
  parameter merging. Resolve litellm_settings.bedrock_request_metadata_fields (default empty/off) through config;
  deduplicate the ordered allowlist, reserve user_api_key_ names to injected proxy identity, and allow spend_logs_metadata
  only by explicit allowlisting. Preserve the 16-pair limit, key lengths 1..256, value lengths 0..256, allowed character
  regex, invalid-pair dropping and owned-but-empty header eviction. ModelResponseIterator yields one supplied response,
  not a second stream parser. add_custom_header and _get_bedrock_client_ssl_verify are called only by the unused
  init_bedrock_client and are excluded with it.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  merge_bedrock_aws_request_params L108-L129; AmazonBedrockGlobalConfig.get_mapped_special_auth_params L459-L463;
  AmazonBedrockGlobalConfig.map_special_auth_params L465-L470; ModelResponseIterator.__init__ L728-L730; ModelResponseIterator.__iter__
  L733-L734; ModelResponseIterator.__next__ L736-L740; ModelResponseIterator.__aiter__ L743-L744; ModelResponseIterator.__anext__
  L746-L750. litellm/llms/bedrock/request_metadata.py: _is_forwardable L36-L37; _text_pairs L40-L43; _allowed_fields
  L46-L56; _metadata_sources L59-L68; _identity_pairs L71-L81; _first_text L84-L85; _client_pairs L88-L108; resolve_bedrock_request_metadata
  L111-L136; bedrock_request_metadata_is_owned L139-L149; bedrock_request_metadata_headers L152-L170; merge_bedrock_invoke_headers
  L173-L199. litellm/llms/bedrock/chat/converse_transformation.py: AmazonConverseConfig._validate_request_metadata
  L316-L385.


  init_bedrock_client has no caller at the pin and is excluded; the live _get_boto_credentials/get_credentials paths
  remain in their own tasks, so no endpoint/SSL constructor case is needed here.


  Named case contracts: request_metadata_owner: litellm_settings.bedrock_request_metadata_fields defaults empty/off.
  Only list/tuple accepted; stringify each configured member then deduplicate by first occurrence. Any surviving
  configured field owns metadata even an unrecognized field or empty string. No allowed fields -> resolverNone and
  no owned header names; no implicit spend metadata forwarding. request_metadata_size_characters: Converse explicit
  requestMetadata validation raises BadRequestError400, model/provider bedrock (no param/code assigned here), first
  failing condition in source order: notdict -> requestMetadata must be a dictionary; >16 entries -> requestMetadata
  can contain a maximum of 16 items; nonstring key/value -> requestMetadata keys must be strings / requestMetadata
  values must be strings; empty/>256 key -> requestMetadata key length must be 1-256 characters; >256 value -> requestMetadata
  value length must be 0-256 characters. Then regex ^[a-zA-Z0-9\s:_@$#=/+,.-]{1,256}$ for key and {0,256} for value;
  invalid key/value -> requestMetadata key/value '<value>' contains invalid characters. Allowed: [a-zA-Z0-9\s:_@$#=/+,.-].
  Include Unicode whitespace, empty value, punctuation and exact boundary lengths; resolver filtering silently drops
  invalid pairs instead of raising these errors. unowned_user_metadata: When no caller-owned/proxy-owned/header-name
  entries, return original headers unchanged. Caller-owned derived guardrail pairs fill only names absent case-insensitively
  from original headers, including original names with empty values. Proxy-owned pairs append last and override
  exact names; all casing variants of proxy-owned original names removed. No caller dictionary mutation. auth_alias_mapping:
  The only common alias is region_name -> aws_region_name; copy value including None and overwrite optional_params
  existing value. Ignore all unrecognized non_default_params; mutate/return optional_params. No AWS acquisition
  occurs here. one_response_iterator: Both iter and aiter return self; next/anext share one is_done flag. First
  call yields exactly the original response object including None; every later sync/async call stops. Interleaving
  sync/async must not yield twice. owned_empty_removes_spoofed_header: When opted-in return owned lowercase name
  x-amzn-bedrock-request-metadata even if resolverNone, with no value. Otherwise emit canonical X-Amzn-Bedrock-Request-Metadata
  with compact JSON separators comma/colon, default Unicode escaping and stable pair order. merge_bedrock_invoke_headers
  evicts all case variants of owned names before inserting proxy-owned pairs; owned-empty cannot fall back to caller
  spoofed header. identity_before_client_budget: Read metadata then litellm_metadata mappings, ignoring nonmappings.
  For allowlisted user_api_key_ fields in config order take first string value across sources, even empty or invalid;
  invalid first text blocks fallback to later valid value. Keep regex-valid identity pairs first, capped16. Then
  caller requestMetadata pairs, then spend_logs_metadata pairs from sources only if spend_logs_metadata explicitly
  allowlisted. Retain string/string pairs only; reject client user_api_key_ prefixes case-sensitively, deduplicate
  client names first-wins, truncate remaining budget16-identity_count. Return None if empty. deployment_auth_merge:
  Merge optional_params then litellm_params so every deployment key wins including None. If deployment aws_access_key_id,aws_secret_access_key,aws_region_name
  are all nonempty strings, remove request-only aws_access_key_id,aws_secret_access_key,aws_session_token,aws_session_name,aws_profile_name,aws_role_name,aws_web_identity_token,aws_sts_endpoint,aws_external_id,aws_session_tags,aws_region_name
  absent from deployment; keep deployment-specified None/empty keys. Incomplete/empty deployment static triple does
  not strip request auth. Do not remove runtime endpoint/non-auth fields.


  Implement crates/betterlite-bedrock/src/request_policy.rs with adjacent tests under request_policy/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_request_policy in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function request_policy_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): request_metadata_owner, request_metadata_size_characters, unowned_user_metadata, auth_alias_mapping, one_response_iterator,
  owned_empty_removes_spoofed_header, identity_before_client_budget, deployment_auth_merge. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_request_policy* using HelperCase: kind:
  helper and the externally tagged bedrock_request_policy variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_request_policy that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/request_policy.rs
  and its loader wiring: bedrock_request_metadata_fields. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest bedrock_request_policy_config_cases
  with named cases loads_bedrock_request_metadata_fields, plus rejects_unrelated_key. Each loads case calls the
  real config loader with that key and asserts the resolved value, default, precedence and secret redaction where
  applicable. Seed B002 config_yaml with new bedrock_request_policy* files for every key; reuse its parser/fuzz
  target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_request_policy_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_request_policy_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 249 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 285 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 40 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 710 planned, 725 maximum changed lines.
