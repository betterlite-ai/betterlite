deviations:
  - what: A cost, decode or push failure is returned as Err and reaches B3608's router, which logs it and drops the dispatch. B3638 turns a Vertex costing failure into a warning with zero cost, so on the Vertex path that rule wins inside B3638's factory.
    why: Rust has no exceptions; for Gemini this keeps LiteLLM's rule that a failure rises and nothing is dispatched. The Vertex difference comes from B3638's own deviation, not from this task.
  - what: The Gemini handler takes the buffered response bytes and the response headers, where LiteLLM takes the httpx response object.
    why: Rust has no httpx response; the handler only reads the JSON body, and B1326 needs the headers for its error projection.
out_of_scope:
  - "B3638 owns VertexPassthroughLoggingHandler.is_interactions_route, is_vertex_interactions_route, interactions_passthrough_handler, extract_model_from_url, _get_custom_llm_provider_from_url and _create_vertex_response_logging_payload_for_generate_content. This task calls them."
  - "B3642 owns vertex_passthrough_handler and its predict, audio predict and embedding branches. B3639 owns _handle_predict_response and _handle_embed_content_response. B3641 owns batch_prediction_jobs_handler and extract_model_name_from_vertex_path."
  - "GeminiPassthroughLoggingHandler.extract_model_from_url has the same body as B3638's extract_model_from_url, so this task calls B3638's and builds no copy."
  - "B3608 owns the line conversion, the model argument source, the dispatch to these two handlers and the trait they implement. B3606 owns the route choice that reaches gemini_passthrough_handler and the adapter that calls it."
  - "B1315 owns the Gemini fragment decoder, B1326 the response decoder, B1364 the Veo create response, B582 the Anthropic chunk parser, B2227 stream_chunk_builder and B068 completion_cost."
pitfalls:
  - "The route tests are case sensitive: \"streamGenerateContent\" does not contain \"generateContent\" and \"streamRawPredict\" does not contain \"rawPredict\", so each pair needs both tests."
  - "Check for the interactions route first, then predictLongRunning, then generateContent; a path that ends in /interactions must never reach the generateContent decode."
  - "The Gemini payload factory prices with the literal provider \"gemini\" and writes the custom_llm_provider argument to kwargs; the Vertex factory prices with the argument. Do not merge them."
  - "Only the Gemini factory writes model_call_details[\"response_cost\"]; the Vertex factory leaves it out."
  - "The decoder is pushed once per line and finish is never called, so a value still open at the end of the stream is lost and not an error."
  - "A line that is not a complete JSON value flips the decoder into accumulated mode for the rest of the stream; the first lines of a pretty printed JSON array do this."
  - "A line that decodes to a non-object value is skipped in accumulated mode and does not stop the stream."
  - "The rawPredict path strips \"data: \" first and \"data:\" second, parses silently (invalid JSON gives no chunk) and gives only objects to the chunk parser; a fresh B582 state is made per call so tool indexes restart at 0."
  - "On the Vertex path the location is stored in the logging object's optional_params before the model and response work, so it is set even when no response can be built."
  - "A model passed in by B3608 wins over the URL model only when it is non-empty; an empty string falls through to the URL, and a URL without /models/ gives \"unknown\", which is still used as the model."
  - "A missing response returns empty kwargs, not the kwargs built so far, and the Vertex and Gemini error log texts differ only in the provider name."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
