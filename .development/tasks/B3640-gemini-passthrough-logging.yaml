dod:
  - text: >-
      gemini_passthrough_handler sends an interactions route to B3638's interactions handler with provider "gemini" and no location,
      and never runs the other branches for it.
    proof: [gemini-route-tests]
  - text: >-
      A predictLongRunning route builds the video object through B1364, sets the logging object's model and provider to "gemini", prices it
      with call_type "create_video", and writes response_cost to the video object, the kwargs and model_call_details.
    proof: [gemini-route-tests, gemini-payload-tests]
  - text: >-
      A generateContent route decodes the body through B1326 with the dummy message, prices it and returns the response with kwargs
      response_cost, model and custom_llm_provider; "streamGenerateContent" alone does not select this branch.
    proof: [gemini-route-tests, gemini-oracle]
  - text: A route that matches no branch returns no result and the input kwargs unchanged; a decode or cost error is returned as Err.
    proof: [gemini-route-tests]
  - text: >-
      The Gemini payload factory prices with the literal provider "gemini", sets response.id from litellm_call_id, picks the response model
      over the argument, and writes model, custom_llm_provider and response_cost to model_call_details.
    proof: [gemini-payload-tests, gemini-oracle]
  - text: >-
      Gemini collected chunks use the given model, else the URL model, build one response from the lines with a fresh decoder that is never
      finished, and return the payload factory's kwargs.
    proof: [gemini-chunks-tests, gemini-oracle]
  - text: >-
      Gemini collected chunks with no usable response (non-generate route, no lines, only empty chunks) log the exact error text and return
      no result with empty kwargs.
    proof: [gemini-chunks-tests, gemini-oracle]
  - text: >-
      A line stream that switches to accumulated mode (a JSON array split over lines) still builds the response, and a trailing partial
      value is dropped.
    proof: [gemini-chunks-tests, gemini-oracle]
  - text: >-
      Vertex collected chunks store the location from the URL in optional_params["vertex_location"], use the given model else the URL
      model, and price through B3638's factory with provider "gemini" for a generativelanguage.googleapis.com host and "vertex_ai" otherwise.
    proof: [vertex-chunks-tests, vertex-oracle]
  - text: >-
      The Vertex generateContent and streamGenerateContent routes build the response with the decoder path; rawPredict and streamRawPredict
      build it with the Anthropic chunk parser after stripping "data: " or "data:" and skipping non-object or invalid lines.
    proof: [vertex-build-tests, vertex-oracle]
  - text: >-
      A Vertex route that is neither a generate nor a rawPredict route, and a Vertex stream with no usable chunks, log the exact error text
      and return no result with empty kwargs.
    proof: [vertex-build-tests, vertex-chunks-tests, vertex-oracle]
  - text: The strict Python oracle adapter lints clean and its cases replay.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: gemini-route-tests
      why: a Gemini branch is missing, taken in the wrong order or runs for a route it should not
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::gemini_passthrough_logging::tests::route_/)'
    - id: gemini-payload-tests
      why: the Gemini payload factory prices with the wrong provider, misses an id, model or model_call_details write
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::gemini_passthrough_logging::tests::payload_/)'
    - id: gemini-chunks-tests
      why: Gemini collected chunks pick the wrong model, finish the decoder, lose the accumulated mode or return kwargs on a missing response
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::gemini_passthrough_logging::tests::chunks_/)'
    - id: vertex-build-tests
      why: the Vertex route tests, the rawPredict prefix strip or the skip rules are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_stream_collection::tests::build_/)'
    - id: vertex-chunks-tests
      why: Vertex collected chunks miss the location store, pick the wrong model or provider, or lose the error path
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_stream_collection::tests::chunks_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3640)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3640 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3640/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/passthrough_logging-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: gemini-oracle
      why: newly added Gemini helper cases are absent or betterlite and LiteLLM disagree on them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/vertex/passthrough-logging)" &&
        grep -rlE '^[[:space:]]+b3640:' tools/oracle/cases/vertex/passthrough-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/vertex/passthrough-logging
    - id: vertex-oracle
      why: newly added Vertex helper cases are absent, do not use the b3640 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/vertex/passthrough-logging)" &&
        grep -rlE 'operation": "vertex_' tools/oracle/cases/vertex/passthrough-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/vertex/passthrough-logging
