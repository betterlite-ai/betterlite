id: B3640
title: Gemini passthrough logging and Vertex stream collection
description: >-
  Build the Gemini pass-through logging handler and the Vertex collected-chunks handler in betterlite-server, in two new modules:
  gemini_passthrough_logging (crates/betterlite-server/src/pass_through_logging/gemini_passthrough_logging.rs and its folder) and vertex_stream_collection
  (crates/betterlite-server/src/pass_through_logging/vertex_stream_collection.rs and its folder). They are the Gemini and Vertex leaves of LiteLLM's
  pass-through response logging. B3606 calls the Gemini non-streaming handler. B3608 calls both stream handlers through its
  CollectedChunksHandler trait once a stream has ended. Neither module reads the network. Both reuse code that other tasks own and add
  only the glue and the order of calls below.

  Types you use and do not define. From B3608 (betterlite-logging, module passthrough_stream_logging): the trait CollectedChunksHandler
  { fn handle(&self, call: &CollectedChunksCall) -> Result<HandlerOutcome, HandlerError> }, CollectedChunksCall (logging object handle,
  url_route, request_body, endpoint_type, start_time, end_time, lines: Vec<String>, model: Option<String>), HandlerOutcome (an optional result
  and a kwargs map) and HandlerError. From B3605: the response-object enum and the typed kwargs map that HandlerOutcome holds. From
  B3638 (betterlite-vertex, vertex_relay_metadata): extract_model_from_url (the "/models/([^:]+)" rule, "unknown" when absent),
  is_interactions_route, interactions_passthrough_handler, get_custom_llm_provider_from_url and the Vertex logging payload factory
  (_create_vertex_response_logging_payload_for_generate_content). From B1304: get_vertex_location_from_url. From B1326:
  decode_generate_content and the envelope assembly it splits out. From B1315: GeminiStreamDecoder::push. From B1364: the Veo
  create-response method (transform_video_create_response). From B582: the Anthropic stream-event parser (ModelResponseIterator.chunk_parser)
  with its per-stream state. From B2227: stream_chunk_builder. From B068: the completion cost service and its completion_cost call. Read
  the merged code for the exact Rust names and signatures of these and call them. Do not copy their logic. If a function you need is not
  there yet, report it in notes and stop.

  Constructors. `GeminiPassthroughLogger::new(cost: Arc<...>)` and `VertexStreamCollector::new(cost: Arc<...>)` each take B068's cost
  service handle (the type B068 exposes for completion_cost) and keep it. No module-level state. Both structs implement
  CollectedChunksHandler. B102 builds them once and puts them in B3608's ProviderChunkHandlers (gemini and vertex slots).

  The fixed names B3606 calls. In gemini_passthrough_logging:
  `pub struct GeminiPassthroughInput<'a> { pub logging_obj: &'a <the logging object handle type of CollectedChunksCall>, pub url_route: &'a str,
  pub response_headers: &'a http::HeaderMap, pub response_body: &'a [u8], pub request_body: &'a serde_json::Map<String, serde_json::Value>,
  pub start_time: <the type of CollectedChunksCall.start_time>, pub end_time: <same>, pub kwargs: <B3605 typed kwargs map> }` and
  `impl GeminiPassthroughLogger { pub fn gemini_passthrough_handler(&self, input: GeminiPassthroughInput<'_>) -> Result<HandlerOutcome,
  GeminiPassthroughError> }`. The full path is betterlite_server::pass_through_logging::gemini_passthrough_logging::GeminiPassthroughLogger. The method is
  synchronous. response_body is the whole buffered upstream body (LiteLLM reads httpx_response.json() from it), and the dict response_body
  and the result and cache_hit arguments of LiteLLM's signature are not used by the Gemini handler, so they are not in the struct.
  GeminiPassthroughError is this module's own enum (thiserror) and must convert into HandlerError so the stream seam can return it.

  gemini_passthrough_handler, in order. (1) If B3638's is_interactions_route(url_route) is true, return B3638's
  interactions_passthrough_handler with custom_llm_provider "gemini" and vertex_location None, passing the logging object, request body,
  kwargs and times. (2) Else if the route contains "predictLongRunning" (case sensitive): model = extract_model_from_url(url_route); build
  the video object with B1364's create-response method (response bytes, model, logging object, custom_llm_provider "gemini", request_data =
  request body); set logging_obj.model = model, model_call_details["model"] = model, model_call_details["custom_llm_provider"] = "gemini"
  and logging_obj.custom_llm_provider = "gemini"; response_cost = completion_cost(video object, model, custom_llm_provider "gemini",
  call_type "create_video"); store response_cost in the video object's hidden params; set kwargs response_cost, model and
  custom_llm_provider ("gemini"); set model_call_details["response_cost"]; return the video object and the kwargs. (3) Else if the route
  contains "generateContent" (case sensitive, so "streamGenerateContent" does not match): model = extract_model_from_url(url_route); decode
  the body with B1326 (decode_generate_content, then the envelope assembly) into a chat response for that model with the single dummy
  message {"role": "user", "content": "no-message-pass-through-endpoint"}, empty optional and provider params and an empty api key;
  then run the Gemini payload factory (below) and return the chat response and the kwargs it gives back. (4) Else return no result and the
  input kwargs unchanged. A decode or cost error is returned as Err, as LiteLLM lets the exception rise.

  The Gemini payload factory, a private function in the same module and used by the handler and the stream seam:
  `create_gemini_response_logging_payload(response, model, kwargs, start_time, end_time, logging_obj, custom_llm_provider)`. It computes
  response_cost = completion_cost(response, model, custom_llm_provider "gemini", always the literal "gemini" here and not the argument).
  It sets kwargs response_cost, model and custom_llm_provider (the argument). It sets response.id = logging_obj.litellm_call_id,
  logging_obj.model = response.model when non-empty else model, model_call_details["model"] = logging_obj.model,
  model_call_details["custom_llm_provider"] = custom_llm_provider and model_call_details["response_cost"] = response_cost. It returns the
  kwargs. This one writes model_call_details["response_cost"]; Vertex's factory (B3638) does not, and you keep that difference.

  Gemini collected chunks. `impl CollectedChunksHandler for GeminiPassthroughLogger`, handle(call): kwargs start empty. model = call.model
  when it is non-empty, else extract_model_from_url(url_route). Build the complete response from call.lines (below). When that gives none,
  log at the tracing error level "Unable to build complete streaming response for Gemini passthrough endpoint, not logging..." and return
  no result with empty kwargs. Otherwise run the Gemini payload factory with custom_llm_provider "gemini" and return the response with
  those kwargs. endpoint_type and the logger argument of LiteLLM's signature are not used.

  Building the complete response from lines (Gemini). If the route contains "generateContent" or "streamGenerateContent" (two separate
  case sensitive tests; the second is needed because "streamGenerateContent" does not contain "generateContent"), create one fresh B1315
  decoder and push every line in order, one push per line, keeping what each push gives back as one optional chunk, and never call finish.
  Any other route gives no response. LiteLLM keeps a None in the parsed list, tests the list for emptiness before dropping the Nones, and
  then calls stream_chunk_builder on the non-None chunks. B2227's stream_chunk_builder returns none for an empty list, so one rule covers
  both: drop the Nones and call stream_chunk_builder, and an empty result is none. The decoder starts in valid-JSON mode and switches to
  accumulated mode on the first line that is not a complete JSON value (a bare "[" or "[{" from a non-SSE JSON array stream does this).
  A trailing partial value that never closes is lost because finish is not called; that matches LiteLLM and is covered by a test.
  A push error is returned as Err.

  Vertex collected chunks. `impl CollectedChunksHandler for VertexStreamCollector`, handle(call): kwargs start empty.
  vertex_location = get_vertex_location_from_url(url_route); when found, store it in the logging object's optional_params["vertex_location"].
  model = call.model when non-empty, else B3638's extract_model_from_url(url_route). Build the complete response (below). When none, log
  at the error level "Unable to build complete streaming response for Vertex passthrough endpoint, not logging..." and return no result
  with empty kwargs. Otherwise call B3638's Vertex payload factory with the response, model, the empty kwargs, the times, the logging
  object, custom_llm_provider = get_custom_llm_provider_from_url(url_route) ("gemini" when the host ends with
  generativelanguage.googleapis.com, else "vertex_ai") and vertex_location, and return the response with the factory's kwargs.

  Building the complete response from lines (Vertex). Route contains "generateContent" or "streamGenerateContent": the same decoder
  path as Gemini (a fresh B1315 decoder, one push per line, no finish). Else the route contains "rawPredict" or "streamRawPredict" (again
  two separate tests): create one fresh B582 stream-event state, and for each line strip a leading "data: " or else "data:" prefix, parse the
  rest as JSON, skip the line when it is not valid JSON or not an object, and give the object to B582's chunk parser; keep each result that
  is not none. A line holding only the prefix and nothing else is skipped. Any other route gives no response. Then the same
  stream_chunk_builder call. The prefix strip is two lines of code; write it inline in the loop. B005 owns the general version, but the
  Vertex path only needs this, and a parse of the stripped text is the whole check.

  Tests live in the two modules' tests folders under pass_through_logging::gemini_passthrough_logging::tests and pass_through_logging::vertex_stream_collection::tests, named by
  group (see checks). betterlite-server's Cargo.toml gains betterlite-vertex and betterlite-streaming if they are missing. Fakes stand in for the cost service and the logging object; the real B1326, B1315, B582 and B2227 functions run in the
  tests. Neither module has an HTTP route at this point, so the HTTP oracle cases come from the B3606, B3608 and B102 wiring. This task
  gets helper cases for the response building. The oracle helper b3640 calls the pinned Python static methods with a stub logging object
  (a real litellm Logging object with a fixed litellm_call_id) and returns the response's model, choices content, finish reason, usage and
  the kwargs. It never copies the algorithm. Run it with LITELLM_RUST=false and the local model cost map.
