deviations: []
out_of_scope:
  - "The classes: B9460 (Pillar), B9461 (TypeSafe), B9462 (XecGuard), B9463 (Presidio), B3795 to B3797 (Straiker) and the earlier Presidio, Pillar, TypeSafe and XecGuard parts. Their initializers: B8218 and B3681. Registry arms: B8521. Running a held guardrail: B8666. Installing callbacks: B8613. Proxy hook dispatch: B8399. Config guardrail startup: B3683."
  - "Vigil and the Prisma AIRS scan headers: B104. Straiker's v3 path needs an sk_agt_ key and Anthropic or OpenAI session envelopes; B3796's helper cases cover it."
  - "Streamed responses: B3807 (Presidio) and B3788 (Prisma AIRS) own the stream code; the streaming cases across guardrails are B8993's."
  - "XecGuard and Presidio logging_only scans: no task calls a held guardrail's logging hooks from the logging pipeline yet (see the B108 report notes)."
pitfalls:
  - "The oracle compares every captured upstream request body whole and has no ignore for it, so nothing generated may reach a vendor body. Straiker's envelope carries litellm_call_id, litellm_trace_id, the event id and the session id: send x-litellm-call-id oracle-call-1 and x-litellm-trace-id oracle-trace-1 on every Straiker request so both sides send the same values (LiteLLM honors both headers in common_request_processing.py L273-L276 and litellm_pre_call_utils.py L1560-L1571)."
  - "Pillar's payload and Straiker's context carry LiteLLM's version string; betterlite has to send the pinned LiteLLM version there, and a mismatch is a finding for B3790 or B3795."
  - "Presidio's default presidio_filter_scope is both, which adds an output mask callback that scans the answer too; a case that only means to test input must set the scope or queue the extra analyze and anonymize calls."
  - "Presidio appends / to its API bases, so the mock sees /analyze and /anonymize, never //analyze."
  - "Pillar's API key goes in a Bearer header while Onyx-style vendors put it in the path; listing authorization for Pillar is fine since the key is a fixed test value."
  - "TypeSafe skips any exchange that get_protected_indices protects, so a conversation that ends right after the tool result never reaches the service."
  - "A Straiker key starting with sk_agt_ silently moves the call to /api/v3/detect even with api_version v1."
  - "Straiker's request block uses should_wrap_with_default_message false, so the client message is the blocked_reason alone, not LiteLLM's guardrail prefix."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
