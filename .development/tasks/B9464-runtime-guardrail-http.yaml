id: B9464
title: Booted-proxy cases for the Presidio, Pillar, TypeSafe, XecGuard and Straiker guardrails
description: >-
  The Presidio, Pillar, TypeSafe, XecGuard and Straiker tasks were planned before any chat route ran a guardrail, so
  they only have helper cases or Rust tests. This task adds the booted-proxy HTTP cases that show each configured
  guardrail really runs on a chat request: B9460 to B9463 build the four classes, B3795 to B3797 build Straiker,
  B8521 registers the wire names, B8666 runs a held guardrail through its class, B8613 installs the callbacks, B8399
  runs the proxy hooks, B3683 starts the config guardrails, B8994 and B9802 put the x-pillar-* headers on the
  response, and B004 serves the chat route. It writes no code and registers no route, guardrail kind or class.
  A case that fails because a class answers differently from LiteLLM goes back to that class's task as a finding and
  is never fixed here.


  Cases go in tools/oracle/cases/guardrails/m-z-runtime-http. Use the booted-proxy case format with master key
  oracle-master, one deployment `chat` on `openai/gpt-oracle` with api_base {{upstream}} and api_key oracle-key, and
  router_settings.num_retries 0. Every guardrail endpoint is the same mock, so the ordered upstream queue holds the
  guardrail calls and the model call in the order the hooks make them. Configure each guardrail in the top-level
  `guardrails:` list and select it with the request body's `guardrails` list. Compare status, content-type,
  x-litellm-applied-guardrails where the class records it, and the error type, param and code. On an error ignore
  /error/message only where it is a string that betterlite wraps in its own words, with that reason; keep every
  structured detail field compared. Compare the upstream requests the mock captured, so a 200 cannot hide a skipped
  scan, and list the vendor headers named below in upstream_headers. Ignore generated ids and timestamps in a 200
  body with a reason, and nothing else. Use /v1/chat/completions everywhere except presidio-mask-input, which calls
  /chat/completions.


  Presidio (guardrail presidio, presidio_analyzer_api_base and presidio_anonymizer_api_base both {{upstream}}, so the
  calls go to /analyze and /anonymize; list content-type). presidio-mask-input: mode pre_call, pii_entities_config
  {PHONE_NUMBER: MASK}; the analyzer finds a PHONE_NUMBER span, the anonymizer answers the masked text, and the model
  receives it. presidio-block-entity: pii_entities_config {CREDIT_CARD: BLOCK}; the analyzer finds CREDIT_CARD and the
  client gets LiteLLM's blocked entity error with no anonymize call and no model call. presidio-restore-output: mode
  pre_call, output_parse_pii true and presidio_filter_scope input, so only the input scan and the restore callback
  exist; the anonymizer replaces the name with a token, the model answers with that token, and the client gets the
  original name back. presidio-mask-output: presidio_filter_scope output and mode post_call; the model answers first
  and the client gets the masked answer. presidio-analyzer-down: pii_entities_config set and the analyzer answers 500,
  so the request fails closed before any model call.


  Pillar (guardrail pillar, api_base {{upstream}}, api_key oracle-pillar-key, so calls go to /api/v1/protect; list
  authorization, content-type, plr_scanners and plr_evidence). pillar-block-input: on_flagged_action block, mode
  pre_call, a flagged answer with scanners and evidence; the client gets 400 with "Blocked by Pillar Security
  Guardrail" and the model is never called. pillar-monitor-headers: on_flagged_action monitor, a flagged answer with a
  session_id; the client gets 200 and compares x-pillar-flagged, x-pillar-scanners, x-pillar-evidence and
  x-pillar-session-id. pillar-mask-input: on_flagged_action mask and an answer with masked_session_messages; the
  model receives those messages. pillar-error-allow: the Pillar endpoint answers 500 and the default fallback lets the
  model answer. pillar-error-block: fallback_on_error block and a 500; the client gets 503 with "Pillar Security
  Guardrail Unavailable"; ignore only the original_error field, with the reason that it carries the HTTP client's own
  error text. pillar-post-call-block: mode post_call and on_flagged_action block; the model answers, Pillar receives
  the request messages plus the answer, flags it, and the client gets 400.


  TypeSafe (guardrail typesafe, mode pre_call, api_base {{upstream}}, api_key oracle-typesafe-key, so calls go to
  /v1/systemone; list authorization and content-type). Build a conversation with one completed tool exchange whose
  result is longer than 200 characters and that get_protected_indices does not protect (read compress.py L225 for
  which trailing messages it keeps), followed by a new user turn. typesafe-drops-stale-result: Jev answers e0 with noul
  0.05 and the model receives the tool message with LiteLLM's fixed removal text. typesafe-keeps-relevant: noul 0.9
  and the model receives the conversation unchanged. typesafe-fail-open-default: no unreachable_fallback, Jev answers
  500, and the model receives the conversation unchanged. typesafe-fail-closed: unreachable_fallback fail_closed and a
  500; the client gets 502 with {"error": "TypeSafe evaluation service returned an error"}. typesafe-short-result: the
  tool result is under 200 characters, so the only upstream call is the model's.


  XecGuard (guardrail xecguard, api_base {{upstream}}, api_key oracle-xecguard-key, so calls go to /xecguard/v1/scan
  and /xecguard/v1/grounding; list authorization and content-type). xecguard-input-unsafe: mode pre_call, the scan
  answers UNSAFE and the client gets 400 with the scan block message, guardrail_name and xecguard_response.
  xecguard-input-safe: SAFE, and the captured scan body shows model xecguard_v2, scan_type input and the three default
  policies. xecguard-grounding-unsafe: mode post_call with metadata.xecguard_grounding_documents in the request; the
  model answers, the response scan is SAFE, grounding answers UNSAFE and the client gets 400. xecguard-error-block: the
  scan answers 500 with block_on_error left at its default; the client gets 400 with "XecGuard API unreachable
  (block_on_error=True)" (ignore that error text after the colon, with the reason that it is the HTTP client's own
  message). xecguard-error-open: block_on_error false and a 500, so the model answers.


  Straiker (guardrail straiker, api_base {{upstream}}, api_key oracle-straiker-key, which has no sk_agt_ prefix, so the
  v1 webhook /api/v1/detect/webhook; max_retries 0 so one failure is one call; list authorization, content-type and
  x-straiker-webhook-format). straiker-request-blocked: mode pre_call, the webhook answers action BLOCKED with a
  blocked_reason and the client gets that reason unwrapped. straiker-allow: action NONE and the model answers.
  straiker-request-rewritten: action GUARDRAIL_INTERVENED with texts and the model receives those texts.
  straiker-response-blocked: mode post_call and BLOCKED; LiteLLM answers the response block with
  ModifyResponseException, so compare the 200 the client gets. straiker-unreachable: the webhook answers 503, the
  default unreachable_fallback is fail_closed, and the client gets "Straiker detection unavailable: ..."; ignore the
  text after the colon with the same reason.


  no-auth: a Pillar guardrail with default_on true and no Authorization header; the 401 comes before any upstream
  call.
