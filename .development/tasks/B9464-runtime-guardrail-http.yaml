dod:
  - text: Booted-proxy cases show Presidio masking input, blocking an entity, restoring tokens in the answer, masking the answer and failing closed when the analyzer is down.
    proof: [oracle]
  - text: Booted-proxy cases show Pillar blocking, monitoring with x-pillar-* headers, masking, both API error fallbacks and a post-call block.
    proof: [oracle]
  - text: Booted-proxy cases show TypeSafe dropping a stale tool result, keeping a relevant one, failing open by default, failing closed with 502 and skipping short results.
    proof: [oracle]
  - text: Booted-proxy cases show XecGuard scan and grounding blocks, the default policies and both block_on_error settings.
    proof: [oracle]
  - text: Booted-proxy cases show Straiker blocking and rewriting a request, blocking a response, allowing a request and failing closed, and an unauthenticated request is refused before any scan.
    proof: [oracle]
