id: B3607
title: Pass-through success completion and byte relay
description: >-
  Build two modules in betterlite-server: success_completion (crates/betterlite-server/src/pass_through_logging/success_completion.rs and its folder)
  and byte_relay (crates/betterlite-server/src/pass_through_logging/byte_relay.rs and its folder). success_completion is LiteLLM's
  PassThroughEndpointLogging.pass_through_async_success_handler. It runs after a pass-through response has been sent (or is being
  relayed), decides whether the call is logged at all, asks B3606 for the provider's response object, applies the per-request cost rule and
  hands the finished call to B3605's log dispatcher. byte_relay is _relay_passthrough_response_bytes: it streams the upstream body to
  the client without keeping it, then runs the same success completion with no body. B3612 (WebSocket) and B3613 (HTTP request
  lifecycle) call both. Neither module has an HTTP route yet, so the cases are helper cases and native tests.

  Inputs. `UpstreamExchange` holds what the handler reads from LiteLLM's httpx.Response: status_code (u16), response_headers
  (`http::HeaderMap`), request_method (`http::Method`; the WebSocket path uses the extension method WEBSOCKET), request_url (`url::Url`),
  request_headers (`http::HeaderMap`, the headers the proxy sent upstream) and `body: ExchangeBody`, an enum Bytes(bytes::Bytes), Text(String)
  or NotRead. Bytes is a buffered HTTP body, Text is the fixed text of the WebSocket stand-in ("WebSocket connection successful"), NotRead is
  a relayed body. `decode_response_text(headers: &http::HeaderMap, body: &ExchangeBody) -> UpstreamBodyText` follows httpx's Response.text:
  NotRead gives B3605's UpstreamBodyText::NotRead; Text gives Read(text); Bytes gives Read of the decoded bytes, where the charset is the
  `charset` parameter of Content-Type (case-insensitive, quotes stripped), an unknown label falls back to utf-8, an empty body is the empty
  string, and bytes that are not valid in the charset become U+FFFD (httpx decodes with errors="replace"). Use the encoding_rs crate for
  the labels and decoding; record the choice in prior_art. It is the one function that reads bytes from outside, so it gets the fuzz target below.

  `PassThroughRequestState { call: PassThroughCallState, payload: PassthroughStandardLoggingPayload }` is the per-request record. `call`
  is B3605's PassThroughCallState embedded as it is, never redefined: B3613 fills it with apply_upstream_reported_usage on the live
  response before it enqueues the completion. `payload` is B3600's record. `record_on_logging_object(state, logging_obj)` is the one place
  that maps the record onto the logging object's model_call_details (LiteLLM's dict): key "passthrough_logging_payload" gets the payload
  and key "response_cost" gets state.call.response_cost when it is Some. Read the merged B3604 and B3646 code for the logging object's
  model_call_details update call and use that one; do not add a second way to write to it.

  Completion input and the path choice. `CompletionInput<'a>` holds: logging_obj (the handle type B3606's ProviderLogInput declares),
  `call_log: &'a mut CallLog` (B247's per-call log; B3606's ProviderLogInput borrows it and B3642 writes to it), upstream: &UpstreamExchange,
  response_body: Option<PassThroughResponseBody> (B3606's enum: Object, List or None), url_route, result: &str, start_time, end_time (the
  time type B3606's ProviderLogInput declares), cache_hit, request_body (serde_json::Map), custom_llm_provider: Option<&str>, state: &mut
  PassThroughRequestState and kwargs (B3605's typed kwargs map). `select_completion_path(route: &CompletionRoute) -> CompletionPath` is pure.
  CompletionRoute holds url_route, custom_llm_provider, request_method and request_headers. CompletionPath is an enum in LiteLLM's
  order: TinyfishSkip, TinyfishAsyncRun, AssemblyAiSkip, AssemblyAiLog, LangfuseSkip, TranscribeSchedule, Normalize. The order is the
  if-chain at success_handler.py L428-L495, and it is not one elif chain. The TinyFish block is its own `if` and only returns in two cases:
  when should_log_request is false (TinyfishSkip), and when is_run_async_route is true (TinyfishAsyncRun). Any other TinyFish request falls
  through to the second chain, which is an if/elif/elif/else: AssemblyAI (`is_assemblyai_route` and not `is_azure_speech_route`) first, then
  Langfuse, then Transcribe (`is_transcribe_route` and the upstream request's is_priced_job_start), and Normalize otherwise. Inside the
  AssemblyAI arm a non-POST request is AssemblyAiSkip and a POST is AssemblyAiLog. The predicates are B3605's (anthropic-style route
  helpers on PassThroughEndpointLogging), B3606's is_tinyfish_route and B3646's is_priced_job_start. The TinyFish should_log_request,
  is_run_async_route and the AssemblyAI POST-only test come from B3648, B3649 and B3647 through the traits below.

  Collaborators. `EarlyExitHandlers { tinyfish: Arc<dyn TinyfishRunBilling>, assemblyai: Arc<dyn AssemblyAiRelayLogging>, transcribe: Arc<dyn
  TranscribeJobScheduler> }` are trait objects so tests inject fakes, and `EarlyExitHandlers::production(...)` builds one adapter each over
  the merged leaf code: tinyfish over B3648 (should_log_request, is_run_async_route) and B3649 (start_async_run_billing), assemblyai over B3647's
  logging handler, transcribe over B3646's TranscribeLogger::schedule_priced_job_logging. Read each leaf's public function in the merged
  code and call it; copy none of its logic. Each adapter is a short function that reshapes CompletionInput; test each one once with the
  leaf stubbed at its input. The traits are TinyfishRunBilling { should_log_request(&self, method: &http::Method, url_route: &str) -> bool;
  is_run_async_route(&self, url_route: &str) -> bool; start_async_run_billing(&self, call: TinyfishRunStart<'_>) }, AssemblyAiRelayLogging
  { should_log_request(&self, method: &http::Method) -> bool; log(&self, call: AssemblyAiCall<'_>) } and TranscribeJobScheduler {
  schedule(&self, call: TranscribeScheduleCall<'_>) }. Define the three call records here with exactly the fields LiteLLM passes: TinyFish
  gets the object body or None, the logging object, result, start_time, cache_hit and the kwargs (no end_time, no request_body); AssemblyAI
  gets the exchange, the object body or an empty object, the logging object, url_route, result, both times, cache_hit and the kwargs;
  Transcribe gets the exchange, the object body or None, the logging object, url_route, result, both times, cache_hit, request_body,
  the log dispatcher (the same one the normal path uses, `log_dispatch()` of B3605) and the kwargs and the payload (LiteLLM passes
  it as standard_pass_through_logging_payload). B3606's ProviderLogDispatcher and B3605's PassThroughEndpointLogging are passed to
  `PassThroughSuccessCompletion::new(logger, dispatcher, early_exit)` and used from it.

  The handler, `PassThroughSuccessCompletion::complete(&self, input: CompletionInput<'_>) -> Result<(), SuccessCompletionError>`, in order:
  (1) record_on_logging_object with the payload, before anything can fail; (2) select the path; TinyfishSkip, AssemblyAiSkip and LangfuseSkip
  return Ok at once; TinyfishAsyncRun calls start_async_run_billing and returns; AssemblyAiLog calls the AssemblyAI logger and returns;
  TranscribeSchedule calls the scheduler and returns, writing nothing itself; (3) Normalize builds B3606's ProviderLogInput and calls
  `ProviderLogDispatcher::normalize_llm_passthrough_logging_payload`; (4) when the response object is None it becomes
  StandardPassThroughResponseObject holding the decoded response text (decode_response_text, so an unread body gives the empty string);
  (5) call B3605's set_cost_per_request with the state, the kwargs response_cost slot and the payload's cost_per_request (take it from the typed kwargs map as
  an Option<f64>, run the function, write the slot back only when it became Some), then record_on_logging_object again so the logging
  object sees the cost; (6) hand the call to B3605's log_dispatch() with the response object, result, start_time, end_time, cache_hit
  and the kwargs plus the payload under the key standard_pass_through_logging_payload. An error from B3606 or from the dispatcher is returned
  as it is (LiteLLM has no try here, the logging worker B191 logs it). The original kwargs are replaced by the handler's kwargs after step 3, as B3606 says.

  Filling ProviderLogInput. B3606's ProviderLogInput is the handoff, and its fields were widened so B3642 and B3646 get what they read. Fill
  every field: the logging object, the response view (status_code, response_headers, decode_response_text of the body), request_method,
  request_url and request_headers from the exchange (the upstream request, never the response headers), `call_log` reborrowed from
  CompletionInput, response_body, request_body, url_route, result, start_time, end_time, cache_hit, custom_llm_provider and the
  kwargs. Read the merged B3606 code for the exact field and type names before writing; if a field is missing there, stop and report it as a blocker.

  Byte relay. `relay_response_bytes(input: RelayInput) -> RelayedBody` where RelayedBody implements `futures::Stream<Item = Result<Bytes,
  RelayError>>` and the caller (B3613) gives it to the response. RelayInput holds the upstream response body stream (the type B3611's
  non-streaming and streaming helpers return; use a boxed `Stream<Item = Result<Bytes, reqwest::Error>>` at the boundary), the exchange
  (body NotRead), request_body, url_route, start_time, the logging object, `call_log: CallLog` (owned, since the completion runs after the handler returns), custom_llm_provider, the
  PassThroughRequestState, the kwargs, `Arc<PassThroughSuccessCompletion>`, the B191 worker handle and a budget binder `Arc<dyn
  ReservationBinder>` (one method over B1719's bind function in betterlite-auth::reservation_state; read the merged name). Each chunk is
  yielded unchanged and its length is added to a bytes_relayed counter (use usize::checked_add; on overflow stop counting and keep going).
  The completion runs exactly once, when the stream ends (clean end, upstream read error or the client dropping the body). The end is
  either poll_next returning None or Some(Err), or Drop of RelayedBody, whichever comes first. If the upstream was not fully read, log
  at warn level the text "Passthrough stream for <url_route> ended before upstream body was fully relayed; <bytes_relayed> bytes were sent to the client". Then enqueue the
  completion on the B191 worker as one event with response_body None, result "", end_time now, cache_hit false and the saved request_body,
  start_time and kwargs. After a successful admission call the budget binder with the request's litellm_params. A rejected admission
  (the worker's queue is full) binds nothing, so the request-end release still returns the reservation (see deviations). Dropping the
  upstream stream closes the connection (LiteLLM's aclose). An upstream read error is yielded to the client once as RelayError::Upstream
  and still triggers the success completion, because LiteLLM's finally block logs a success row for it.

  Tests live in pass_through_logging::success_completion::tests and pass_through_logging::byte_relay::tests, named by group (see checks). Add the fuzz target
  passthrough_response_text in crates/betterlite-server/fuzz that feeds arbitrary bytes and an arbitrary Content-Type value to decode_response_text,
  with a committed corpus and the test replays_the_passthrough_response_text_corpus.
