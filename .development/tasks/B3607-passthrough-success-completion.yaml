deviations:
  - what: A rejected enqueue on the B191 logging worker (queue full) skips the reservation bind, so the request-end release returns the budget reservation.
    why: LiteLLM's worker never rejects, and binding to a callback that never runs would leak the reservation. Spend for that call is dropped either way, and the worker counts the drop.
  - what: The relay yields an upstream read error to the client as one RelayError::Upstream item and the stream ends, where Python re-raises the httpx exception from the generator.
    why: A Rust stream carries errors as items. The success completion still runs after it, as in LiteLLM's finally block.
  - what: Charset labels follow the WHATWG list from encoding_rs, not Python's codec registry. A label only Python knows (for example "utf-8-sig" spelled as a codec alias) is treated as unknown and decodes as utf-8.
    why: encoding_rs is the maintained crate for this job, and real upstreams send standard labels.
  - what: The completion runs as an async function that returns Result, and the B191 worker logs a returned error. LiteLLM lets the exception reach the worker's task.
    why: Rust has no exceptions; the error reaches the same logger at the same point.
  - what: The decoded response text is read once, before the normalize step, and handed to B3606 as UpstreamBodyText. LiteLLM decodes the body lazily when a handler asks for it.
    why: A buffered body is already in memory, so the text is the same; only the moment of the work differs.
out_of_scope:
  - "PassThroughEndpointLogging's constructor, the route tables, the log dispatch choice, _handle_logging, _safe_response_text's type, _set_cost_per_request and the route predicates that need no provider handler (success_handler.py L55-L149, L519-L594, L644-L673) belong to B3605; this task calls them."
  - "normalize_llm_passthrough_logging_payload and the five provider-handler predicates (success_handler.py L151-L410 and L595-L642) belong to B3606."
  - "_is_streaming_response, _should_buffer_passthrough_response and get_response_body belong to B3600; B3613 decides between the buffered and the relayed path."
  - "Calling apply_upstream_reported_usage, the status < 400 guard, enqueuing the buffered-path completion and reading the response (pass_through_endpoints.py L1575-L1746) belong to B3613; the WebSocket call site at L2642-L2671 belongs to B3612."
  - "The failure path of the relay (_relay_reporting_failures, _log_passthrough_upstream_failure, the error preview) belongs to B3610. This relay is only for responses that are not buffered."
  - "_own_streamed_managed_ids (pass_through_endpoints.py L2744-L2771) wraps a stream in the managed-id rewriter and reads proxy_server globals. It has no owner among B3600 to B3613 and B3613 calls it on the SSE path, so nothing here builds it."
  - "The TinyFish, AssemblyAI and Transcribe handlers (polling, billing, pricing) belong to B3648 and B3649, B3647 and B3646; this task only decides when to call them."
  - "The logging worker, its queue and its enqueue call belong to B191, and bind_budget_reservation_to_callbacks to B1719."
pitfalls:
  - "The TinyFish block is a plain `if`, not part of the chain. A TinyFish POST to /v1/automation/run (not run-async) falls through, is tested for AssemblyAI, Langfuse and Transcribe, and ends in Normalize where B3606's Tinyfish branch prices it."
  - "A Transcribe request whose x-amz-target operation is not StartTranscriptionJob is not an early exit; it takes the else branch and goes through normalize like any other route."
  - "is_priced_job_start reads the headers of the upstream request the proxy sent, not the response headers, so ProviderLogInput and the Transcribe scheduler must get request_headers from the exchange."
  - "The AssemblyAI branch returns after logging and never reaches set_cost_per_request, so payload.cost_per_request is not applied to AssemblyAI calls. The same holds for TinyFish async runs and Transcribe scheduled jobs."
  - "set_cost_per_request runs only after the normalize step, on the handler's kwargs, so a handler's own response_cost is overwritten by cost_per_request, including 0, unless the upstream reported usage."
  - "The final dispatch gets result as the caller's string (\"\" for HTTP, \"websocket_connection_successful\" for WebSocket); B3605's default dispatcher then ignores it, so do not branch on it."
  - "Step 1 writes passthrough_logging_payload before any skip, so a skipped Langfuse or TinyFish poll still leaves the payload on the logging object."
  - "The WebSocket call has custom_llm_provider None, request method WEBSOCKET and body Text, so decode_response_text must accept Text and the fallback text is \"WebSocket connection successful\"."
  - "The relay's completion runs on a dropped body too (client disconnect), so it lives in Drop as well as at the stream end, and it must run once. Drop cannot await, so it only enqueues, which the worker does without waiting."
  - "The relay passes response_body None, not an empty object, so B3606's Tinyfish adapter sees None and the Anthropic, Cohere and OpenAI adapters see an empty object."
  - "httpx decodes with errors=\"replace\" and falls back to utf-8 for an unknown charset instead of failing, so a bad Content-Type charset never makes the response text fail."
  - "The reservation bind happens in the relay's finally block even though the completion only runs later on the worker; do it right after the enqueue, not after the completion."
