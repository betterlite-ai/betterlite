  - tools/oracle/cases/server/pass-through-logging/success-completion/normalize-none-uses-response-text.yaml
  - tools/oracle/cases/server/pass-through-logging/success-completion/normalize-unread-body-empty-text.yaml
  - tools/oracle/cases/server/pass-through-logging/success-completion/cost-per-request-after-normalize.yaml
  - tools/oracle/cases/server/pass-through-logging/success-completion/cost-upstream-reported-wins.yaml
  - tools/oracle/cases/server/pass-through-logging/success-completion/dispatch-kwargs-and-payload.yaml
