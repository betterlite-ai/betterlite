dod:
  - text: select_completion_path returns the path LiteLLM takes for each route kind, including a TinyFish request that does not return early and then goes through the second chain.
    proof: [path-tests, completion-oracle]
  - text: A TinyFish route that should not be logged returns without a dispatch, and a run-async route calls start_async_run_billing with the object body or None and no end_time or request_body.
    proof: [tinyfish-tests, completion-oracle]
  - text: An AssemblyAI route logs only for POST and not for an azure_speech provider, passing an empty object when the body is not an object, and never reaches the normalize step.
    proof: [assemblyai-tests, completion-oracle]
  - text: A Langfuse route returns without a dispatch, and a Transcribe priced job start schedules the job with the normal dispatcher and writes no log itself.
    proof: [langfuse-transcribe-tests, completion-oracle]
  - text: Every other route is normalized by B3606, and a None response object becomes the pass-through response object holding the decoded response text.
    proof: [normalize-tests, completion-oracle]
  - text: The cost-per-request rule runs after normalize, an upstream-reported cost wins, and the logging object sees the final response_cost.
    proof: [cost-tests, completion-oracle]
  - text: The final dispatch carries the response object, result, both times, cache_hit, the handler's kwargs and standard_pass_through_logging_payload, and the payload is recorded on the logging object first.
    proof: [dispatch-tests, completion-oracle]
  - text: ProviderLogInput is filled with the upstream request method, URL and headers (not the response headers), call_log, the decoded response view and every other field named in the description.
    proof: [provider-input-tests]
  - text: Each early-exit adapter reshapes CompletionInput into the leaf's arguments, and an error from B3606 or the dispatcher is returned.
    proof: [adapter-tests, normalize-tests]
  - text: decode_response_text follows httpx for utf-8, a declared charset, an unknown charset, invalid bytes, an empty body and an unread body.
    proof: [text-tests, completion-oracle, response-text-corpus]
  - text: PassThroughRequestState embeds B3605's PassThroughCallState and maps the payload and cost onto the logging object.
    proof: [state-tests]
  - text: The relay yields every chunk unchanged and runs the completion once after a clean end, a read error or a client drop, with no body, an empty result and cache_hit false.
    proof: [relay-tests]
  - text: An incomplete relay logs the byte-count warning, the reservation is bound only after an accepted enqueue, and a rejected enqueue binds nothing.
    proof: [relay-tests]
  - text: The decoder survives arbitrary bytes and Content-Type values and its committed corpus replays.
    proof: [response-text-corpus]
  - text: Newly added helper cases replay through the shared helper-case parser and the strict Python adapter lints clean.
    proof: [helper-case-corpus, helper-python]
checks:
  optional: []
  commands:
    - id: path-tests
      why: the path choice order, or the TinyFish fall-through into the second chain, is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::path_/)'
    - id: tinyfish-tests
      why: the TinyFish early exits or the arguments of start_async_run_billing are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::tinyfish_/)'
    - id: assemblyai-tests
      why: the AssemblyAI POST-only exit, the azure_speech exclusion or the empty-object default is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::assemblyai_/)'
    - id: langfuse-transcribe-tests
      why: the Langfuse skip or the Transcribe scheduling is missing or logs too early
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::(langfuse|transcribe)_/)'
    - id: normalize-tests
      why: the normalize step, the response-text fallback or the error pass-through is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::normalize_/)'
    - id: cost-tests
      why: the cost-per-request step or its place after normalize is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::cost_/)'
    - id: dispatch-tests
      why: the final dispatch fields or the payload write on the logging object are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::dispatch_/)'
    - id: provider-input-tests
      why: ProviderLogInput is missing a field or gets the response headers where the request headers belong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::provider_input_/)'
    - id: adapter-tests
      why: an early-exit adapter passes the leaf the wrong arguments
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::adapter_/)'
    - id: state-tests
      why: the request state does not embed PassThroughCallState or does not map onto the logging object
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::state_/)'
    - id: text-tests
      why: response text decoding is missing a charset, fallback or empty-body rule
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::success_completion::tests::text_/) - test(replays_the_passthrough_response_text_corpus)'
    - id: relay-tests
      why: the byte relay, its once-only completion, the warning or the reservation binding is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::byte_relay::tests::relay_/)'
    - id: response-text-corpus
      why: the response text fuzz target or its fresh replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/passthrough_response_text.rs &&
        grep -q 'name = "passthrough_response_text"' crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/passthrough_response_text)" &&
        grep -q 'decode_response_text' crates/betterlite-server/fuzz/fuzz_targets/passthrough_response_text.rs &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_passthrough_response_text_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3607)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3607 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3607/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/success_completion-*")" &&
        grep -lE '^[[:space:]]+b3607:' tools/oracle/fuzz/corpus/helper_case/success_completion-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: completion-oracle
      why: newly added helper cases are absent or betterlite and LiteLLM disagree on them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/server/pass-through-logging/success-completion)" &&
        grep -rlE '^[[:space:]]+b3607:' tools/oracle/cases/server/pass-through-logging/success-completion &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/server/pass-through-logging/success-completion
