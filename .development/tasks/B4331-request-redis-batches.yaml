dod:
  - text: RequestRedisBatches shares one batch per backend within a request. Callers
      pass RedisCache instances to batch() or post_call() and receive a RedisBatch.
      Two caches with identical connection settings and namespace get the same batch;
      two caches with different settings or instances without readable settings get
      separate batches.
    proof: [request-batch-tests]
  - text: Awaiting any pending operation flushes all declared operations in the shared
      batch for that backend in one round trip. Operations on different backends flush
      independently.
    proof: [request-batch-tests]
  - text: Post-call writes flush separately, once when flush_post_call_redis_batches
      is called or at the one-second deadline after the first post_call declaration,
      whichever is earlier.
    proof: [request-batch-tests]
  - text: The deadline timer is canceled if flush_post_call_redis_batches is called
      early or if flush_all finishes the request scope without pending post-call work.
    proof: [request-batch-tests]
  - text: Nested request_redis_batch_scope contexts return the outer scope's batches,
      not nested batches.
    proof: [request-batch-tests]
  - text: drain_post_call_redis_batches flushes every RequestRedisBatches in the weak
      registry, used at shutdown.
    proof: [request-batch-tests]
  - text: The weak registry _open_post_call holds every RequestRedisBatches with pending
      post-call writes until all writes are flushed.
    proof: [request-batch-tests]
  - text: Deadline flush task owns the timer and runs through the event loop; request
      cancellation does not prevent its execution.
    proof: [request-batch-tests]
  - text: prefetched is initialized as an empty dict[str, object] keyed by consumer name, and
      calling code arms it by name and takes (pops) entries at use time. This task declares the
      field and its initialization semantics; the behavioral logic of what is stored and retrieved
      is owned by the code that uses it (B382 for routing_read prefetch, and proxy_server code for
      update_cache_read prefetch).
    proof: [request-batch-tests, prefetch-slot-semantics]
