id: B4331
title: Share request Redis batches and drain deferred writes
description: >-
  Build request-scoped batch sharing so independent Redis operations on the same backend
  within a single HTTP or WebSocket request pipeline share one batch, plus a second batch
  for post-call deferred writes (counters, token scripts, response cache) that flush
  separately.

  A request declares reads through active_request_redis_batch or post-call writes through
  active_post_call_redis_batch inside a request_redis_batch_scope context manager. The
  scope shares one RedisBatch per distinct Redis backend (identified by _backend_key, which
  compares connection settings and namespace); nested scopes join the outer scope's batches.
  Awaiting any operation in the batch flushes all pending operations in one round trip.

  Post-call writes flush once when success and failure callbacks have all run, or at
  POST_CALL_FLUSH_DEADLINE_SECONDS (1.0 second) after the first post-call declaration
  when no callback phase closes them. A call to flush_post_call_redis_batches wakes
  the deadline timer early. The drain_post_call_redis_batches function flushes every
  open post-call batch on shutdown, used when the service is stopping and needs all
  in-flight writes sent before Redis closes.

  The prefetched field (dict[str, object] keyed by consumer name) stores reads declared
  early for a consumer that runs later in the request. Calling code arms prefetch slots
  by name (proxy_server.py:3879 for _UPDATE_CACHE_PREFETCH_SLOT = "update_cache_read",
  routing_read_batch.py:122 for _PREFETCH_SLOT = "routing_read") and retrieves them
  with pop semantics at use time. This task declares the field and its init-to-empty
  semantics; B382 owns the routing_read prefetch behavior and the proxy server's
  prefetch behavior is owned by another task covering proxy_server.py. The field
  lives in RequestRedisBatches because it is request-scoped and must coordinate across
  the phases that read and consume it.

  The batch engine (RedisBatch from B4330) is unchanged; request_redis_batch_scope is
  the minimal entry point. Preserve the ContextVar-based active batch lookup, the weak
  registry of open post-call requests, the one-second deadline as a floating-point
  constant, and best-effort cleanup on deadline timeout or early flush. Use asyncio.get_running_loop().call_later
  for the deadline timer and asyncio.ensure_future for the deadline flush task, so
  timers are owned by the running event loop and survive request cancellation until
  the deadline fires.
