deviations:
  - what: The prefetched dict is managed by RequestRedisBatches but the arm/take behavioral
      logic is owned by calling code (proxy_server.py for _UPDATE_CACHE_PREFETCH_SLOT,
      routing_read_batch.py for _PREFETCH_SLOT).
    why: The field is a request-scoped communication channel between early reads and late
      consumption. RequestRedisBatches owns only the container and initialization; the tasks
      covering the calling code own the logic of what is stored and when it is consumed. B382
      owns routing prefetch behavior.
out_of_scope:
  - The behavioral logic of prefetched slot consumption. proxy_server.py:3879/3888 (_UPDATE_CACHE_PREFETCH_SLOT)
    and routing_read_batch.py:92/122/127/135 (_PREFETCH_SLOT) are owned by their respective tasks;
    B382 owns routing prefetch behavior.
  - RedisBatch construction and operation settlement. B4330 owns the batch engine;
    this task owns the request-scoped wrapper.
  - Circuit breaker, logging and failure handling. B393 owns these services.
  - Redis cache primitives, namespace management and client initialization. B4324,
    B4325 and B4326 own these services.
  - Calling request batches from proxy_server or litellm_logging. Callbacks and shutdown
    sites call this leaf.
pitfalls:
  - The deadline timer must be acquired from asyncio.get_running_loop().call_later,
    not time.sleep or a manual async sleep, so it survives request cancellation.
  - _backend_key must handle RedisCache instances without readable redis_kwargs or
    namespace attributes (test doubles) by falling back to identity comparison.
  - Weak references in _open_post_call auto-discard when a RequestRedisBatches is no
    longer held by the request; do not manually remove entries.
  - The deadline flush task is scheduled with asyncio.ensure_future, not create_task,
    so it holds a reference on the event loop even if the request is canceled.
  - cancel() on a TimerHandle is idempotent; calling it twice is safe.
  - RequestRedisBatches must not depend on B393 or B360 in the reverse direction,
    even though B393 and B360 may call request batch functions.
  - The prefetched dict is mutable and shared across request phases; calling code must
    coordinate when slots are armed (pre-admission) and when they are taken (at use) to
    avoid losing early armed values.
