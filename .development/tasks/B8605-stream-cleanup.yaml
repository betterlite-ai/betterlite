dod:
- text: >-
    With client_disconnected, the request data's metadata and litellm_params.metadata, created when missing or null, get client_disconnected
    true and the 499 error_information while their other keys stay, and the logging details get the same marks; without it nothing is marked.
  proof: [cleanup-tests, oracle, helper-python]
- text: >-
    After a recorded disconnect fire_deferred_logging is called once; with deferred logging armed there is no billing and no slot release.
  proof: [cleanup-tests]
- text: >-
    Billing that is disabled, has no logging object, has no collected chunks, gets None or an Err from assemble_partial or an Err from
    dispatch_success leads to exactly one release_on_disconnect; a successful dispatch or has_dispatched_final_stream_success true leads to
    none, and the dispatched response carries the backfilled usage.
  proof: [cleanup-tests]
- text: >-
    later_chunk_model and client_named_model match LiteLLM, and restore_partial_model puts the wrapper model back unless the builder took a
    routed model from a later chunk that the client did not ask for.
  proof: [cleanup-tests, oracle, helper-python]
- text: >-
    An unfinished stream with an active baseline cache and prompt_cache_response_complete not true invalidates it once with
    "incomplete_response" and completed true, with or without a disconnect; a finished stream or a true flag does not, and an Err from the
    slot release returns before this step.
  proof: [cleanup-tests]
- text: finalize runs run_cleanup exactly once on the tracker it was built with, and an Err from it is logged instead of lost.
  proof: [cleanup-tests]
- text: >-
    drop_fallback_errors_flag removes include_fallback_errors when config.sections.fallback_errors.expose_to_caller is false, the default,
    and keeps it when the section says true.
  proof: [cleanup-tests]
checks:
  optional: []
  commands:
  - id: cleanup-tests
    why: a disconnect mark, the deferred check, a billing branch, the single slot release, the model restore, the baseline step, the tracker run or the fallback flag drop is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^stream_cleanup::/)'
  - id: helper-python
    why: the disconnect marks and model checks have no pinned LiteLLM comparison through the b8605 helper
    run: grep -qE '^[[:space:]]+b8605:' tools/oracle/fuzz/corpus/helper_case/b8605-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/stream-cleanup/disconnect-marks.yaml
- tools/oracle/cases/helpers/stream-cleanup/partial-model-checks.yaml
deviations:
- what: A cleanup that runs with client_disconnected false never records a disconnect, where LiteLLM still asks Starlette's request.is_disconnected() whenever the stream did not complete.
  why: hyper gives a handler no way to ask whether the client left while its body is still being polled; B8604 reports a dropped body as client_disconnected, which is the case LiteLLM's probe exists for.
- what: The logging object, the stream builder, success dispatch, the baseline cache and the limiter release are reached through the RequestLogging and SlotRelease ports, and litellm.disable_streaming_logging is a constructor value.
  why: betterlite wires dependencies through constructors instead of proxy_server globals; the order of the calls and their arguments are LiteLLM's.
- what: 'An Err from a port that LiteLLM would let escape its finally block is logged at error "stream cleanup failed: {error}" by the task the tracker runs.'
  why: The cleanup runs on the server's task tracker (rules.yaml async-hygiene), so there is no generator left to raise into; the steps after the failure are skipped as in LiteLLM.
out_of_scope:
- "The response.aclose() call in the cleanup: B8604 drops the upstream item stream when its state drops, which closes it."
- "_withheld_provider_output and the budget reservation release on cancel (L269-L270 and the async_streaming_data_generator except branch): B7324 lists async_streaming_data_generator as built by no task, and this cleanup does not call them."
- "The rest of common_processing_pre_call_logic (L1913-L2100): B004 owns it and is done, and B7324 records that no task builds the shared class; only the include_fallback_errors drop is built here."
- "The rest of litellm/proxy/common_request_processing.py: B7324 builds the shared helpers and lists the owners of the remaining functions in its out_of_scope."
- "_fire_deferred_stream_logging (B6370), stream_chunk_builder (B2227), dispatch_success_handlers (B250), invalidate_baseline_cache (B342) and _arelease_max_parallel_requests_on_disconnect (B2400): this task calls them through its ports."
pitfalls:
- 'fire_deferred_logging is called after every recorded disconnect, armed or not; only the billing and the release depend on the armed answer.'
- 'has_dispatched_final_stream_success true makes billing answer true, which skips the slot release, because the end-of-stream event already released it.'
- 'Every failed billing branch must answer false so the slot is released once; releasing it as well after a successful dispatch double-decrements the limiter.'
- 'The baseline step looks at stream_completed only, so an HTTP failure with the client still there invalidates the estimate too, and a disconnect after a completed stream does not.'
- 'client_named_model falls back to `model` only when `_litellm_client_requested_model` is not a string, and has no "" fallback, unlike B8602''s client_requested_model.'
- 'error_code in the 499 marks is the string "499", and every marked object gets its own copy of error_information.'
- 'The request data is marked before fire_deferred_logging and the billing see it, so the deferred event and the partial bill carry client_disconnected.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
