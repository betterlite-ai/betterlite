  - crates/betterlite-server/Cargo.toml
  - crates/betterlite-server/src/stream_cleanup.rs
  - crates/betterlite-server/src/stream_cleanup/**
  - tools/oracle/cases/helpers/stream-cleanup/**
  - tools/oracle/helpers/b8605.py
  - tools/oracle/helpers/b8605/**
  - tools/oracle/src/helpers/server/b8605.rs
  - tools/oracle/src/helpers/server/b8605/**
  lint_tables: false
