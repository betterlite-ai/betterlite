id: B4004
title: Queue redacted Zerobus logs and refresh connection settings
description: >-
  Implement live Zerobus connection resolution and bounded callback queuing with automatic client
  refresh when settings change. Build the ZerobusLogger extending CustomBatchLogger to inherit
  its queue, flushing, and lifecycle management.

  Resolve connection parameters live from ZerobusInitParams (litellm.zerobus_params), with preference
  for configured values falling back to environment variables (ZEROBUS_SERVER_ENDPOINT, ZEROBUS_WORKSPACE_URL,
  ZEROBUS_TABLE_NAME, ZEROBUS_CLIENT_ID, ZEROBUS_CLIENT_SECRET). Secret references with os.environ/
  prefix remain unresolved when not found; missing required parameters raise ValueError with guidance.
  Extract workspace ID from the numeric first hostname label of server_endpoint (https://<workspace_id>.zerobus.<region>.<cloud>).
  Validate table_name as fully qualified with exactly two dots (catalog.schema.table).

  Cache a ZerobusIngestClient by connection; recreate it when any connection parameter changes.
  Reuse the cached client's token only while the connection remains equal. Build the client with
  an injected httpx async client from B173, preserving its timeout and pooling behavior.

  Manage async tasks explicitly: create periodic and batch flush tasks only when an event loop is running,
  store them as owned Task objects, and recreate a dead periodic task on enqueue. Query task liveness
  safely and drop the task reference on shutdown without relying on Python event-loop globals.

  Apply privacy redaction before row conversion: check should_redact_message_logging, call
  redacted_standard_logging_payload when needed, and skip events with missing or non-dict payloads.
  Convert each redacted payload to a trace_row, queue it, and drop the oldest queued rows when overflow
  occurs, but never drop during a flush (preserve in-flight rows).

  Dispatch retryable failures so B256 retains the rows; permanent failures log and drop the batch.
  Defaults are batch_size 100 and flush_interval 10 seconds. At capacity during a flush, drop the arriving
  row instead of queuing. Preserve arrivals during a flush by holding a separate _flushing flag.

