id: B052
title: Wire virtual key authentication into the server
description: >-
  Replace B003 master-key middleware with the production AuthenticationPipeline. Own user_api_key_auth
  L3433-L3529, builder preflight L1475-L1602, credential_gate L1858-L1896 and enclosing catch L2197-L2208,
  WebSocket adapters L644-L707 and internal-job adapter L3938-L3977 in user_api_key_auth.py. B2326 takes
  the lower master_and_database stage L2078-L2196 to keep this task below 800 changed lines.
  Compose B875 backend dispatch, B876 cached sessions and B855 centralized
  admission once; depend on directly called services rather than every auth helper transitively.

  First B757 stamps receive time/starts a server span, then reads a body with deferred ProxyException.
  Resolve B741 dispatched route; enter auth <route> telemetry and B2316 spend-counter batch scopes.
  Builder preflight reuses truthy received_at or UTC now, silently ignores state assignment failure,
  then runs B744 pre-DB safety before B756 key selection. Read general_settings.pass_through_endpoints
  default None; a nonnull litellm_key_header_name overrides even the earlier selected credential through
  B756 strict custom-header lookup. Lazily ensure/reuse the parent span if telemetry exists.

  In the MIT checkout enterprise_custom_auth is absent. Await an installed user_custom_auth, validate
  its result as UserAPIKeyAuth, optionally run B054 post-checks when enable_post_custom_auth_checks is
  truthy (default false), mark authenticated_by_custom_auth=true and return. A string is invalid here;
  the enterprise-only bearer-replacement path is outside the MIT implementation. B052 owns typed
  custom/post-check ports and B054 supplies them; configured uninstalled hooks fail startup by name.
  No reverse dependency on B054. Public routes return INTERNAL_USER_VIEW_ONLY before backend dispatch,
  except B756's protected metrics override; B741 handles configured additional public routes.

  After B875 dispatch, pass-through credential handling may return an auth object directly. If master
  key is None, return INTERNAL_USER with supplied string api_key and parent span, otherwise no api_key.
  This branch itself does not inspect the no-auth-dev predicate; B875 already handled enabled backends.
  With a master configured, null key raises No api key passed in.; empty key raises Malformed API Key
  passed in. Ensure Key has `Bearer ` prefix. /user/auth returns empty auth only when
  general_settings.allow_user_auth is exactly true (default false), otherwise HTTP403 with
  'allow_user_auth' not set or set to False. B876 then handles end-user fields, cached keys and master
  comparison. A nonstring master reaches HTTP500 Master key must be a valid string. Current type=<type>;
  B002 rejects such configuration at startup in normal deployments.

  Invoke B2326 for master/uncached-key resolution, preserving its stable master alias, asynchronous
  cache write and invalid-key provenance. Builder exceptions all go through B757 with the latest
  resolved identity. This boundary must preserve B2326's mutations even when validation fails.

  If builder authentication fails and the body was malformed, rethrow the original body400 after auth
  diagnostics. On success clear budget_reservation, attach the agent caller, and B855 seed destinations.
  Skip admission/reservation entirely for malformed bodies. Otherwise B855 authorizes; a recovered
  object returns immediately from inside the scopes. For the normal path close scopes before B110
  seeds identity baggage, set normalized request_route, then log/rethrow a deferred body error via B757.
  Principal projection is last: WARN and continue on failure, with no second identity read. Consumers
  must deny when principal is absent. Return the authenticated object. No database writes occur here.

  Move agent_caller.py _header L24-L26 and agent_caller_from_headers L29-L37 down here: only a truthy
  agent_id enables first case-insensitive x-litellm-user-id/x-litellm-team-id lookup; strip values and
  treat empty as absent. With neither return None, otherwise a typed AgentCaller. These headers only
  narrow access through B748 and never replace grants; B141 retains other agent services.

  WebSocket authentication constructs a GET request with original query/headers, shared state,
  scope.path default empty and optional root_path/app_root_path. The URL may carry Host input but
  route lookup uses scope.path. B1004 supplies the model request body; the default adapter uses
  query.model. Truthy Authorization takes precedence and requires exact Bearer plus space, then
  strips the token. Otherwise try truthy api-key, then the first stripped comma-separated protocol
  beginning openai-insecure-api-key.; an empty matching suffix stops the search. Missing credential
  closes1008 then HTTP403 No API key provided; malformed Authorization closes1008 then HTTP403
  Invalid Authorization header format. Call this task's root auth with Bearer <key>. Invalid-key
  provenance becomes WebSocketException1008 without another log/explicit close; other failures log
  exception, close1008 and raise HTTP403 str(error). Empty Bearer tokens reach ordinary auth failure.

  Internal jobs accept a server-owned persisted key hash through a separate typed API, never the
  external bearer path. B870 resolves before B741 route and B744 pre-DB safety. B755 validates with
  UTC now, no parent span/end-user object, end_user_id None and empty end_user_params. Clear reservation
  then B855 authorize with force_virtual_key_checks=true. Return recovered auth immediately; otherwise
  seed destinations, assign the raw route and project principal. Principal errors propagate here,
  unlike the public adapter's warning. Test that external bearer hashes remain denied.

  Implement virtual_key_auth in betterlite-server with files below 300 lines and adjacent tests. B860
  independent Postgres fixtures use POSTGRES_TEST_URL or testcontainers. B001 real HTTP cases compare
  status, complete errors and downstream-dispatch effects. B002 tests header_name_default_none,
  allow_user_auth_default_false_exact_true, post_checks_default_false and uninstalled_backend_rejected
  call its loader and replay new config_yaml seeds. No parser is added. Budget 300 production, 300
  table-driven tests, 100 wiring and 70 config lines, 770 within 800.
scope:
  paths:
    - crates/betterlite-server/src/virtual_key_auth.rs
    - crates/betterlite-server/src/virtual_key_auth/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/auth.rs
    - crates/betterlite-server/src/auth/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/fuzz/corpus/config_yaml/virtual-key-auth-*
    - tools/oracle/cases/auth/virtual-key-auth/**
    - crates/betterlite-config/src/sections/virtual_key_auth.rs
    - crates/betterlite-config/src/sections/virtual_key_auth/**
    - tools/oracle/helpers/b052.py
    - tools/oracle/helpers/b052/**
    - tools/oracle/src/helpers/server/b052.rs
    - tools/oracle/src/helpers/server/b052/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1475-L1602
    why: Preflight order, actual header/pass-through config reads and MIT custom path.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1858-L1896
    why: No-master and credential errors, actual allow_user_auth read.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L2078-L2208
    why: Master alias, DB lookup, invalid-key provenance and source hash disclosure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L3433-L3529
    why: Deferred-body precedence, admission, identity seeding and principal failure behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/auth/agent_caller.py#L24-L37
    why: Small header projection moved below the agent umbrella to avoid an auth cycle.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L644-L707
    why: WebSocket credential precedence, scope and close/error behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L3938-L3977
    why: Internal persisted-key path and principal-error propagation.
dod:
  - text: 'Named cases: receive_span_before_body_then_preflight, safety_before_credentials,
      named_header_overrides_selection, mit_custom_structured_string_and_postcheck,
      custom_before_public_route, metrics_public_override, passthrough_auth_return,
      no_master_internal_user, null_and_empty_credential_error_fields,
      user_auth_exact_true_or403, master_stage_delegation, builder_errors_keep_resolved_identity,
      malformed_body_wins_after_auth_failure, malformed_body_no_admission_or_reservation,
      recovered_admission_early_return, scopes_close_before_identity_baggage,
      deferred_body_failure_logging, principal_projection_warns_without_second_lookup,
      agent_header_casefold_first_trim_and_nonagent_ignore, concurrent_request_isolation,
      unauthorized_never_dispatches, revoked_key_no_dispatch,
      websocket_scope_defeats_host_poisoning, websocket_header_precedence_and_case,
      websocket_first_protocol_empty_stops, websocket_empty_bearer_reaches_auth,
      websocket_missing_and_malformed_close1008_http403, websocket_invalid_key_quiet1008,
      websocket_other_failure_logs_close403, internal_hash_not_external_bearer,
      internal_resolve_before_safety, internal_forced_admission_recovery,
      internal_raw_route_and_principal_error_propagates.'
    proof: [behavior-tests, oracle]
  - text: Actual loader tests and a new config_yaml seed prove each owned setting.
    proof: [config-tests, config-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Auth ordering, identity isolation or public errors differ from source.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^virtual_key_auth::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: Auth settings are ignored or an uninstalled mode is accepted.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::virtual_key_auth::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: No new auth config seed exists or replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/virtual-key-auth-*")" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/auth/virtual-key-auth/master-and-virtual-key.yaml
  - tools/oracle/cases/auth/virtual-key-auth/public-metrics-and-dev-mode.yaml
  - tools/oracle/cases/auth/virtual-key-auth/missing-malformed-and-user-auth.yaml
  - tools/oracle/cases/auth/virtual-key-auth/master-only-and-no-database.yaml
  - tools/oracle/cases/auth/virtual-key-auth/invalid-prefix-and-lookup.yaml
  - tools/oracle/cases/auth/virtual-key-auth/malformed-body-auth-precedence.yaml
  - tools/oracle/cases/auth/virtual-key-auth/agent-caller-and-request-isolation.yaml
  - tools/oracle/cases/auth/virtual-key-auth/websocket-credential-precedence.yaml
  - tools/oracle/cases/auth/virtual-key-auth/websocket-failure-closes.yaml
deviations: []
out_of_scope:
  - B2326 owns master_and_database; B875/B876 own backend/cached-session stages.
  - B054 supplies the custom/post-check ports owned here; enterprise-only bearer replacement is absent.
  - B855/B1221/B1225 own admission and reservation; B757 owns exception conversion and telemetry helpers.
pitfalls:
  - Authentication still runs for malformed bodies, but authorization and reservation must not run.
  - The master cache key is its hash; downstream identity must remain the stable master alias.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
