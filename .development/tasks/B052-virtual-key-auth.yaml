id: B052
title: Wire virtual key authentication into the server
description: >-
  Replace B003 master-key middleware with AuthenticationPipeline composed from credential extraction,
  pre-DB RequestSafety, installed backend dispatch, cached-session/admin stage and master-key/database
  validation. Preserve public and development no-master-key branches. Register existing typed stages once,
  wire model-list visibility, and never dispatch an unauthorized request. Master authentication substitutes
  LITELLM_PROXY_MASTER_KEY_ALIAS before spend logs, metrics and audit so neither the master key nor its
  hash becomes a downstream identity. Keep pass_through_endpoints rejected until B102 registers its lookup
  port.


  HTTP failures: missing and malformed key -> 401 auth_error; /user/auth with allow_user_auth=false ->
  403; master_key_only_routes with non-master credential -> 401 auth_error; no database -> 400 no_db_connection
  param null; non-sk- credential -> 401 with the JWT-disabled hint in betterlite wording. Cached expired
  admin -> 401 expired_key in B876; SCIM inactive and managed-agent mapping failures are covered in B875.
  Pin status, /error/type, /error/param and /error/code through the real server, not Python exception
  names.


  Injected port instead of a reverse dependency on B054: AuthBackend::custom(RequestContext,SecretString)->Result<AuthContext,AuthError>;
  B054 implements it after B165 is available. A configured but unregistered implementation is a named
  startup error, never a success stub.


  Build the production virtual_key_auth module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  user_api_key_auth (L3433-L3529; 63 source lines), authorize_internal_virtual_key (L3938-L3977; 39 source
  lines), _user_api_key_auth_builder.preflight (L1475-L1602; 105 source lines), _user_api_key_auth_builder.credential_gate
  (L1858-L1895; 34 source lines), _user_api_key_auth_builder.master_and_database (L2078-L2208; 110 source
  lines), user_api_key_auth_websocket_for_model (L648-L707; 44 source lines), user_api_key_auth_websocket
  (L644-L645; 2 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.pass_through_endpoints=None;
  general_settings.litellm_key_header_name=None; general_settings.allow_user_auth=False; pass_through_endpoints=None;
  litellm_key_header_name=None; enable_jwt_auth=False; allow_user_auth=False.


  general_settings.litellm_key_header_name=None and allow_user_auth=false are accepted at this stage;
  uninstalled JWT/OAuth/custom/pass-through modes still fail startup by name. general_settings.master_key
  retains B003 binding.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::virtual_key_auth::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 397 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  397 production, 178 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 690 changed lines estimated within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
