    why: Edit size and quality tables, input image tokens in usage and the byte reader.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_edit/__init__.py#L1-L11
    why: The edit config factory that ignores the model.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/__init__.py#L1-L13
    why: The generation config factory that ignores the model.
dod:
  - text: Generation params, URL, key header and request body match OpenRouterImageGenerationConfig, including pass-through of unsupported keys and the missing modalities field.
    proof: [image-tests, helper-python, oracle]
  - text: Edit params, URL, key check and the chat body with data URLs and modalities match OpenRouterImageEditConfig.
    proof: [image-tests, helper-python, oracle]
  - text: Replies give the same image objects, usage, hidden cost header, cost details and hidden model, for data URLs, plain URLs and replies with no images.
    proof: [image-tests, image-corpus, helper-python, oracle]
  - text: A body that is not JSON, or has a bad shape, gives OpenRouterError with the status and headers LiteLLM uses, and arbitrary bytes never panic.
    proof: [image-tests, image-corpus, oracle]
  - text: Every new helper case replays through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: image-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^openrouter_image::/) - test(replays_the_openrouter_image_reply_corpus)'
      why: Without these the two size tables, the usage split and the error statuses are unchecked.
    - id: image-corpus
      run: >-
        test -f crates/betterlite-openai/fuzz/fuzz_targets/openrouter_image_reply.rs &&
        grep -q 'name = "openrouter_image_reply"' crates/betterlite-openai/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openrouter_image_reply)" &&
        cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_openrouter_image_reply_corpus)'
      why: The reply body comes from the network, so the decoder needs a fuzz target and fresh seeds.
    - id: helper-python
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5830)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5830 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5830/pyrightconfig.json
      why: The Python adapter must call the pinned OpenRouter image classes directly.
    - id: helper-case-corpus
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openrouter_image-*")" &&
        grep -lE '^[[:space:]]+b5830:' tools/oracle/fuzz/corpus/helper_case/openrouter_image-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
      why: New seeds must name the b5830 operation and replay.
oracle_cases:
  - tools/oracle/cases/helpers/openrouter-image/generation-params-and-drop.yaml
  - tools/oracle/cases/helpers/openrouter-image/generation-url-key-request.yaml
  - tools/oracle/cases/helpers/openrouter-image/generation-response-data-and-url.yaml
  - tools/oracle/cases/helpers/openrouter-image/generation-usage-cost-details.yaml
  - tools/oracle/cases/helpers/openrouter-image/generation-bad-json.yaml
  - tools/oracle/cases/helpers/openrouter-image/edit-params-new-mapping.yaml
  - tools/oracle/cases/helpers/openrouter-image/edit-url-key-request.yaml
  - tools/oracle/cases/helpers/openrouter-image/edit-response-input-image-tokens.yaml
deviations:
  - what: When a reply has a bad shape (for example choices is not a list), the 500 message is the text "Error transforming OpenRouter image generation response" (or "image edit response") plus a colon and betterlite's own description of the field that failed.
    why: LiteLLM appends the text of whatever Python exception happened (an AttributeError or TypeError message), which depends on the interpreter. The status 500 and the empty headers are the same.
  - what: In the edit config, a bad usage field (for example a non-numeric prompt_tokens) also gives OpenRouterError 500, not an unwrapped Python error.
    why: LiteLLM runs the edit usage step outside its try block, so the raw TypeError reaches the proxy as a generic 500. A typed OpenRouterError with status 500 is the same code and a clearer message.
out_of_scope:
  - B6080 owns OpenRouterException (as OpenRouterError), chat, embedding, Responses and decisions for OpenRouter, and common_utils.py.
  - B5360 owns choosing the OpenRouter image config for a model; the factories here ignore the model.
  - B997 owns the image provider contracts these configs implement. B1120 owns get_image_content_type and the image input types.
  - B998 and B999 own the image generation and image edit call paths. B8311 supplies OPENROUTER_API_KEY, OPENROUTER_API_BASE and litellm.api_key from its gateway_provider_keys section and builds these configs in dispatch; no HTTP case covers them until an image route selects openrouter.
  - litellm/types/llms/openrouter.py only holds TypedDicts and is not built; nothing here needs it.
pitfalls:
  - Generation never reads OPENROUTER_API_BASE and never fails without a key. Edit reads the base env var and fails with "OPENROUTER_API_KEY is not set". They look alike and are not.
  - Generation adds no "modalities" field, but it still skips a caller option named modalities. Edit adds modalities ["image", "text"] itself.
  - A base that ends with "/chat/completions/" (trailing slash) is not recognised by generation, so it gets the suffix twice. Edit trims first, so it is recognised.
  - An unsupported generation param is kept when drop_params is false and silently dropped when true. Edit always drops it.
  - Quality "auto" gives "1K" but an unknown quality gives no image_size key at all, while an unknown size gives "1:1".
  - A data URL without a comma has b64_json null and url null, and the image object is still appended.
  - Existing data on the response passed to generation is kept and new images are appended; an empty list is replaced with a new empty list.
  - Edit text_tokens = prompt_tokens minus the input image tokens, with no floor at zero. Generation text_tokens is prompt_tokens and its image_tokens is 0.
  - The hidden model is the reply's "model" even when usage is missing, and response_cost_details is created only when cost_details is non-empty.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
