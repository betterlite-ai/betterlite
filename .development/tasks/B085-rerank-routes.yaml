checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_routes::/)
      - test(/::replays_corpus$/)'
  - id: case-rerank-route
    why: the rerank-route behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::rerank_routes::tests::rerank_route($|::)/)'
  - id: case-v1-rerank-route
