id: B085
title: Rerank routes
description: >-
  Mount POST /v2/rerank, /v1/rerank and /rerank once, with B756 authentication and B124 proxy hooks.
  Implement the complete endpoints.py handler in betterlite-server::api::rerank_routes. Decode
  its JSON object body, overwrite body.litellm_call_id with B004's resolved x-litellm-call-id,
  prepare authenticated request data with B1103, then await the pre-call hook with call_type=rerank.
  B014 route_request uses route_type=arerank and B1014 executes it. Preserve unknown body fields;
  this route does not declare query or documents as FastAPI-required fields. Do not add an HTTP
  422 schema check that runs before the SDK. Neither URL query parameters nor path aliases
  change the rerank payload.

  After success schedule update_request_status(status=success). Use B004 custom headers from
  hidden model_id,cache_key,api_base with empty-string fallbacks, response_cost with None fallback,
  allowed_model_region with empty-string fallback, request_data and additional_headers ({} when
  absent). Hidden litellm_call_id wins when truthy, otherwise use the request call id. No post-call
  success hook or response-header hook is invoked by this function. On failure await the failure
  hook, log the error, then use B003 error_status_code/openai_error_type/openai_error_param and
  ProxyException serialization; HTTPException defaults to 400 and other exceptions to 500.

  decode_rerank_route(bytes, ApiLimits) is the production boundary decoder; fuzz that exact function
  with malformed JSON, arrays, null, nested objects and limit edges. B1087 supplies limits. Native
  tests belong in api::rerank_routes::tests. B001 HTTP cases use a booted proxy and mock provider,
  with a configured master key and B1139/B856 virtual-key fixtures where required. No helper adapter.
  Own 98 nonblank/non-comment lines including decorators, excluding imports. Budget 125 handler,
  130 tests,125 HTTP fixtures,60 fuzz/replay and 30 wiring =470 lines.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/rerank_routes.rs
  - crates/betterlite-server/src/api/rerank_routes/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/fuzz/Cargo.toml
  - crates/betterlite-server/fuzz/fuzz_targets/rerank_route.rs
  - crates/betterlite-server/fuzz/corpus/rerank_route/**
  - tools/oracle/cases/rerank-routes/**
  - tools/oracle/helpers/b085.py
  - tools/oracle/helpers/b085/**
  - tools/oracle/src/helpers/server/b085.rs
  - tools/oracle/src/helpers/server/b085/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rerank_endpoints/endpoints.py#L27-L136
  why: All three decorators and the complete route, including call-id union order and failure conversion.
dod:
- text: >-
    rerank_aliases sends authenticated {model:cohere/rerank-english-v3.0,query:q,documents:[a,b]}
    separately to /v2/rerank,/v1/rerank,/rerank. Each returns 200 and the mock's results in index order
    [1,0], with one provider request and no sorting. ?top_n=1 is ignored, body top_n=1 is forwarded.
    Missing query reaches SDK validation, producing its mapped 500/internal_server_error/null/"500"
    rather than FastAPI 422; malformed JSON or a JSON array also produces 500/internal_server_error/null/"500"
    with zero provider requests. Compare message extraction on a controlled failure, not parser prose.
  proof: [behavior-tests, oracle]
- text: >-
    rerank_auth_and_hooks configures a master key; absent and invalid bearer keys return
    401/authentication_error/param="None"/code="401" with no provider request. A valid virtual key
    runs preparation then pre_call_hook(call_type=rerank), then arerank. A rejecting hook prevents
    dispatch and invokes failure logging; a successful call records status=success, with no success
    hook or response-header-hook invocation. Native spies verify this order alongside HTTP fixtures.
  proof: [behavior-tests, oracle]
- text: >-
    rerank_call_id_and_headers sends x-litellm-call-id=request-id and body litellm_call_id=spoofed;
    upstream logging sees request-id. No hidden call id returns x-litellm-call-id=request-id;
    hidden call id=provider-id returns provider-id. Empty model_id/cache_key/api_base use B004's
    empty-string handling, absent response_cost remains None, explicit cost=0 survives. A mock
    additional header x-provider-test=present reaches the client through get_custom_headers.
    Missing request call id yields one generated nonempty id reused in success and failure responses.
  proof: [behavior-tests, oracle]
- text: >-
    rerank_error_envelopes injects HTTPException 400,401,403,429 and a generic 500; expect respectively
    invalid_request_error,authentication_error,permission_error,rate_limit_error,internal_server_error,
    param=null and code="400","401","403","429","500". Supplied type=provider_error,param=query
    is retained; literal type/param="None" is normalized by B003. A ProxyException with code=409
    retains status409 rather than becoming500. Every error carries the request call id, invokes the
    failure hook once, and does not run the success-status update. Message="sentinel" remains sentinel.
  proof: [behavior-tests, oracle]
- text: New route fixtures cover every alias and newly committed bytes replay the production JSON decoder.
  proof: [new-cases, decoder-corpus, oracle]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Rerank HTTP admission, header fallback and error shape need production handler tests.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::rerank_routes::tests::/) - test(/::replays_corpus$/)'
  - id: decoder-corpus
    why: A route decoder must handle arbitrary body bytes without panics or unbounded allocation.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/rerank_route)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::rerank_routes::tests::replays_corpus$/)'
  - id: new-cases
    why: All three rerank URLs need new booted-proxy fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/rerank-routes)"
oracle_cases:
- tools/oracle/cases/rerank-routes/rerank-aliases.yaml
- tools/oracle/cases/rerank-routes/rerank-auth-and-hooks.yaml
- tools/oracle/cases/rerank-routes/rerank-call-id-and-headers.yaml
- tools/oracle/cases/rerank-routes/rerank-error-envelopes.yaml
deviations: []
out_of_scope:
- The only callable in endpoints.py is owned here; B1014/B1079 own SDK rerank execution, B1103 request enrichment and B014 dispatch.
- B004 supplies call-id resolution and custom headers; B003 owns shared error fields and ProxyException serialization; B124 proxy hooks are injected.
pitfalls:
- The route's JSON union puts the trusted call id on the right, so a body value cannot replace it.
- Rerank falls back to the request call id when hidden metadata lacks one; copying image-route behavior would lose it.
- error_status_code reads ProxyException.code as well as status_code, unlike the older audio wrapper.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
