out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
pitfalls:
- request.headers reads 'x-litellm-call-id' with default None; omission and an explicit value must not collapse
  into one case.
- endpoints.py:121 uses type=openai_error_type(e, error_status_code(e, status.HTTP_400_BAD_REQUEST)), param=openai_error_param(e),
  code=error_status_code(e, status.HTTP_400_BAD_REQUEST); preserve this envelope rather than a family-wide error
  default.
