id: B085
title: Rerank routes
description: >-
  Install all pinned rerank route aliases with B052 auth and B014 rerank variants, using typed request validation
  and the rerank-call service. Match response metadata and provider errors through B001 captures.


  Register POST /v2/rerank, /v1/rerank and /rerank. Header call id falls back to the request call id; response_cost
  is passed as None.


  Implement crates/betterlite-server/src/api/rerank_routes.rs, crates/betterlite-core/src/api/rerank_routes.rs.
  Use RerankRoutesInput and RerankRoutesResult with typed nested records; inject only the clock, repositories, transports
  and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient
  environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v2/rerank; POST /v1/rerank; POST /rerank. Each alias is exercised
  through the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without
  re-registering their methods/paths.


  Route input projections: request.headers.x-litellm-call-id (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:121 type=openai_error_type(e, error_status_code(e, status.HTTP_400_BAD_REQUEST)),
  param=openai_error_param(e), code=error_status_code(e, status.HTTP_400_BAD_REQUEST); endpoints.py:130 type=openai_error_type(e,
  error_status_code(e, 500)), param=openai_error_param(e), code=error_status_code(e, 500). Compare the actual source
  status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions rerank_route, v1_rerank_route, rerank_missing_query, rerank_provider_error,
  rerank_headers, v2_rerank_route, call_id_fallback, route_aliases, auth_missing, auth_invalid under api::rerank_routes::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-server::api::rerank_routes::decode_rerank_routes(bytes: &[u8],
  limits: &ApiLimits), for orjson.loads input body at litellm/proxy/rerank_endpoints/endpoints.py:65. Place its
  implementation in crates/betterlite-server/src/api/rerank_routes.rs and call it from the actual boundary. The
  cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/rerank_routes.rs passes arbitrary bounded bytes to
  that exact decoder; api::rerank_routes::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/rerank_endpoints/endpoints.py: rerank (L45-L136). Abstract/protocol declarations
  map to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 117 owned nonblank/non-comment/non-docstring Python lines (117 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 137 implementation,
  100 behavior tests, 120 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds
  and 38 wiring; 455 total within the 460-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B014 (Call dispatch across providers
  and call types, shared settings and helpers), B171 (Direct helper oracle and URL path encoding), B1014 (Rerank
  call), B1087 (Api boundaries), B001 (Oracle harness against the pinned LiteLLM), B1103 (Authenticated request
  preparation), B732 (Typed authentication principals and grant resolution), B855 (Authenticated request admission
  and budget handoff), B756 (Authentication header selection and mode dispatch), B1139 (Stateful HTTP oracle scenarios),
  B856 (Management oracle namespaces and Postgres test fixture). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
