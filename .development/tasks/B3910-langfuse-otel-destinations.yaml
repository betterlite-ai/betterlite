id: B3910
title: Langfuse OpenTelemetry destinations and service filtering
description: >-
  Implement Langfuse OpenTelemetry destination configuration and logger specialization in betterlite-logging,
  building on B3909's attribute setting. Add the langfuse_otel destination with US-cloud default endpoint,
  explicit host normalization, Basic authorization headers and x-langfuse-ingestion-version: 4. Resolve
  per-request credentials as a complete destination override via standard_callback_dynamic_params.
  Retain the no-op proxy-start/service-hook behavior that prevents internal-service traces reaching Langfuse.
  Implement LangfuseOtelLogger.__init__ to build OpenTelemetryConfig from environment or dynamic credentials,
  _get_langfuse_otel_host to resolve LANGFUSE_OTEL_HOST or LANGFUSE_HOST, _build_langfuse_otel_config to construct
  the OTLP endpoint and authorization, _get_langfuse_authorization_header for Basic auth encoding of public:secret,
  _build_langfuse_otel_headers for the Langfuse header set, _format_otel_headers to serialize as comma-separated string,
  construct_dynamic_otel_headers to extract dynamic credentials and return auth headers, and construct_dynamic_otel_config
  to build a complete dynamic destination override. Implement service hooks create_litellm_proxy_request_started_span,
  async_service_success_hook and async_service_failure_hook as no-ops to prevent internal traces. Direct dependencies:
  B002 for environment lookup and config injection; B3909 for set_langfuse_otel_attributes as the specialized logger's
  attribute hook; B3854 for OpenTelemetryConfig.from_env fallback and B3868 for OpenTelemetry.__init__. Export LangfuseOtelLogger
  as the specialized OpenTelemetry logger and all static configuration helpers. Every case listed under DoD exercises endpoint
  resolution, host normalization, header construction and credential override.

