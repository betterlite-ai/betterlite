deviations:
  - what: >-
      LangfuseOtelLogger.__init__ calls super().__init__() (OpenTelemetry.__init__) and _create_open_telemetry_config_from_langfuse_env
      falls back to OpenTelemetryConfig.from_env() when credentials are missing. These functions are owned by B3854 (legacy
      OTel capture policy and span annotations) and B3868 (OTel provider assembly and legacy initialization).
    why: >-
      The base OpenTelemetry provider initialization and configuration fallback are separate tasks owned by their respective
      modules. This task builds Langfuse-specific destination configuration that delegates to them through standard interfaces.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_otel.py#L34-L39

  - what: >-
      construct_dynamic_otel_headers and construct_dynamic_otel_config move team/key-scoped Langfuse credentials from
      per-request standard_callback_dynamic_params into a destination-level override. Secrets are never logged or printed
      in configuration diagnostics.
    why: >-
      Dynamic credential per-request routing enables team-specific Langfuse projects without storing credentials at init time.
      The override respects configured URL policy at the proxy layer. Secrets are treated as sensitive and never exposed in
      diagnostics or debug output.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_otel.py#L376-L421

out_of_scope:
  - B3909 owns set_langfuse_otel_attributes attribute setting and response type dispatch.
  - B3854 owns OpenTelemetryConfig and its from_env fallback; B3868 owns OpenTelemetry.__init__ and provider assembly.
  - B002 owns configuration loading and environment variable injection.
  - B173 owns HTTP client pooling (used indirectly by OpenTelemetry exporter).
  - B3901 owns trace and observation ID resolution primitives.
  - B3903 owns tracing channel and export lifecycle.

pitfalls:
  - 'LANGFUSE_CLOUD_US_ENDPOINT is the default when no explicit host is provided; EU endpoint is exported as
    documentation and does not auto-select based on deployment region.'
  - 'Host normalization checks startswith("http"), not just startswith("https"); "http://..." is left unchanged
    but "localhost" becomes "https://localhost".'
  - 'rstrip("/") removes trailing slashes from the host; "https://example.com/" becomes "https://example.com"
    before appending /api/public/otel.'
  - 'Basic authorization encodes "public_key:secret_key" (colon-separated) in base64, then prefixes "Basic "
    (uppercase B, single space).'
  - 'LANGFUSE_INGESTION_VERSION_HEADER is the string "x-langfuse-ingestion-version" (lowercase, hyphenated),
    and LANGFUSE_INGESTION_VERSION is "4" (string, not integer).'
  - '_format_otel_headers joins header key=value pairs with commas; the result is passed to OpenTelemetryConfig
    headers field, which expects a comma-separated string not a dict.'
  - 'construct_dynamic_otel_headers returns an empty dict (not None) when credentials are missing.'
  - 'construct_dynamic_otel_config returns None (not an empty config) when credentials are missing.'
  - 'Service hooks create_litellm_proxy_request_started_span, async_service_success_hook and async_service_failure_hook
    override parent methods; the first returns None and the others are async no-ops to suppress internal spans.'
  - '_create_open_telemetry_config_from_langfuse_env returns OpenTelemetryConfig.from_env() only when at least
    one credential is missing; it does not check for partial credentials (both must be absent to fall back).'

