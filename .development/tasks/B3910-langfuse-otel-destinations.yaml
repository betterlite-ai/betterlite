    - id: service-hook-span-tests
      why: service hook must return None to prevent proxy request span creation
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^langfuse_otel::tests::service_hook_span/)'
    - id: service-hook-noop-tests
      why: service hooks must be defined and handle arguments without action
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^langfuse_otel::tests::service_hook_noop/)'
    - id: oracle-langfuse-otel-dispatch
      why: endpoint resolution and credential override must match LiteLLM behavior
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/logging/langfuse-otel)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(langfuse_otel)'

