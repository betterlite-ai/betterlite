    - id: header-formatting-tests
      why: headers must serialize to comma-separated key=value format
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^langfuse_otel::tests::header_formatting/)'
    - id: dynamic-headers-tests
      why: dynamic headers must extract credentials from params and construct auth headers
