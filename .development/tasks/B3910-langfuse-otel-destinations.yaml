dod:
  - text: >-
      LANGFUSE_CLOUD_US_ENDPOINT and LANGFUSE_CLOUD_EU_ENDPOINT constants are exported with US cloud
      (https://us.cloud.langfuse.com/api/public/otel) as the default; LANGFUSE_INGESTION_VERSION_HEADER
      is "x-langfuse-ingestion-version" and LANGFUSE_INGESTION_VERSION is "4".
    proof: [constant-definitions]

  - text: >-
      LangfuseOtelLogger.__init__ constructs OpenTelemetryConfig from _create_open_telemetry_config_from_langfuse_env
      if config is None, then calls parent OpenTelemetry.__init__ with the config.
    proof: [initialization-tests]

  - text: >-
      _get_langfuse_otel_host returns LANGFUSE_OTEL_HOST if set, else LANGFUSE_HOST, else None.
      Environment variables are read in order of precedence.
    proof: [host-resolution-tests]

  - text: >-
      _create_open_telemetry_config_from_langfuse_env reads LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY;
      if both are present, calls _build_langfuse_otel_config with those keys and _get_langfuse_otel_host();
      otherwise returns OpenTelemetryConfig.from_env().
    proof: [config-creation-tests]

  - text: >-
      get_langfuse_otel_config raises ValueError if either LANGFUSE_PUBLIC_KEY or LANGFUSE_SECRET_KEY is missing,
      otherwise calls _build_langfuse_otel_config with those keys and _get_langfuse_otel_host().
    proof: [config-validation-tests]

  - text: >-
      _build_langfuse_otel_config normalizes langfuse_host by prepending "https://" if not already starting
      with "http", constructs endpoint as "{normalized_host.rstrip('/')}/api/public/otel", and uses
      LANGFUSE_CLOUD_US_ENDPOINT as default when host is None. Returns OpenTelemetryConfig with exporter "otlp_http",
      the computed endpoint, and formatted headers from _build_langfuse_otel_headers.
    proof: [endpoint-construction-tests]

  - text: >-
      _get_langfuse_authorization_header constructs "public_key:secret_key", base64-encodes it,
      and returns "Basic {encoded}" for HTTP Basic authentication.
    proof: [authorization-header-tests]

  - text: >-
      _build_langfuse_otel_headers returns dict with "Authorization" header and the constant
      LANGFUSE_INGESTION_VERSION_HEADER set to LANGFUSE_INGESTION_VERSION ("x-langfuse-ingestion-version: 4").
    proof: [header-construction-tests]

  - text: >-
      _format_otel_headers serializes a header dict to comma-separated "key=value" pairs, e.g.
      {"Authorization": "Basic ...", "x-langfuse-ingestion-version": "4"} becomes "Authorization=Basic ...,x-langfuse-ingestion-version=4".
    proof: [header-formatting-tests]

  - text: >-
      construct_dynamic_otel_headers extracts langfuse_public_key and langfuse_secret_key from standard_callback_dynamic_params,
      and if both are present, calls _get_langfuse_authorization_header and _build_langfuse_otel_headers to return auth headers;
      otherwise returns empty dict.
    proof: [dynamic-headers-tests]

  - text: >-
      construct_dynamic_otel_config extracts langfuse_public_key and langfuse_secret_key from standard_callback_dynamic_params;
      if both are present, optionally reads langfuse_host (falling back to _get_langfuse_otel_host),
      and calls _build_langfuse_otel_config. Returns None if either key is missing.
    proof: [dynamic-config-tests]

  - text: >-
      create_litellm_proxy_request_started_span returns None to prevent proxy request span creation.
    proof: [service-hook-span-tests]

  - text: >-
      async_service_success_hook and async_service_failure_hook are defined and accept arbitrary arguments,
      performing no action to prevent service event logging.
    proof: [service-hook-noop-tests]

