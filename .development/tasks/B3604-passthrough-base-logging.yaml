id: B3604
title: Pass-through base logging contract
description: >-
  Build BasePassthroughLoggingHandler abstract class with provider response transformation and cost
  bookkeeping, a lower logging contract for provider response transforms and complete-stream reconstruction
  in betterlite-logging. Keep this below provider implementations so their eventual leaves can depend on it
  without depending on B102.

  Implement llm_provider_name property returning an LlmProviders enum value for each provider.
  Implement get_provider_config method returning a BaseConfig for model transformation.

  Implement passthrough_chat_handler to transform provider responses to OpenAI format via
  provider_config.transform_response, then call build_response_logging_payload to generate
  standard logging and cost details. Return dict with "result" (ModelResponse) and "kwargs"
  (updated request context).

  Implement _get_user_from_metadata to read user from request_body via get_end_user_id_from_request_body,
  returning None if no request_body or no extracted user. This method accepts PassthroughStandardLoggingPayload.

  Implement build_response_logging_payload to compute completion_cost from the transformed response,
  write response_cost to kwargs and model_call_details["response_cost"] (marking this security-sensitive
  spend tracking), extract user from passthrough_logging_payload if present, build standard logging object
  via get_standard_logging_object_payload with status="success", and set litellm_call_id on the response.
  Catch exceptions and log them without raising, returning kwargs for robustness.

  Implement abstract method build_streaming_response for concrete providers to build a complete response
  object from accumulated chunks and a logging object. Signature: all_chunks: list[str],
  litellm_logging_obj, model: str; returns ModelResponse | TextCompletionResponse | None.

  Implement handle_collected_chunks to build complete response from chunks via build_streaming_response,
  log errors if build fails, call build_response_logging_payload with the complete response, and return
  dict with "result" and "kwargs" or with None result on build failure. This method orchestrates the
  chunk-to-complete-response path for streamed endpoints.
