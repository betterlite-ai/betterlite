deviations: []

out_of_scope:
- >-
  completion_cost is imported from litellm and owned by B068; this task calls it
  in build_response_logging_payload to compute response_cost from the transformed response.
- >-
  get_standard_logging_object_payload is imported from litellm.litellm_core_utils.litellm_logging
  and owned by B190; this task calls it in build_response_logging_payload to construct the
  standard logging object with status="success".
- >-
  get_end_user_id_from_request_body is imported from litellm.proxy.auth.auth_utils and owned by B884;
  this task calls it in _get_user_from_metadata to extract end_user_id from the request body.
- >-
  PassthroughStandardLoggingPayload is a TypedDict imported from litellm.types.passthrough_endpoints
  and owned by B3600; this task accepts it as a parameter in _get_user_from_metadata and accesses
  its request_body field.
- >-
  transform_response is a provider-specific method inherited from BaseConfig; each concrete handler
  implements it via get_provider_config. This task calls it via the returned config but does not define it.

pitfalls:
- >-
  response_cost write to both kwargs["response_cost"] and logging_obj.model_call_details["response_cost"]
  is required; the pass-through success path reads spend from model_call_details, not kwargs alone,
  so a single-location write means downstream logging or finops code misses the cost.
- >-
  build_response_logging_payload must check passthrough_logging_payload.get("request_body") not
  passthrough_logging_payload["request_body"] to avoid KeyError when the payload lacks the field.
- >-
  Exception handling in build_response_logging_payload must return kwargs (not None or raise) to
  allow the response to proceed even if standard logging object construction fails; this follows
  LiteLLM's defensive approach to avoid crashing the proxy on logging errors.
- >-
  handle_collected_chunks returns dict with "result": None on build_streaming_response failure,
  not an exception or empty dict; the caller (pass_through_async_success_handler) checks for None result
  and decides whether to fall back to StandardPassThroughResponseObject.
- >-
  _get_user_from_metadata signature takes PassthroughStandardLoggingPayload (a TypedDict), not
  a dict or request object, and must access request_body via .get() to handle absent field safely.
- >-
  The abstract method build_streaming_response has no default implementation; concrete
  providers implement this to assemble chunks into their provider-native response format before
  passthrough_chat_handler transforms it to OpenAI format.

