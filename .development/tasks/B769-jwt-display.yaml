id: B769
title: JWT login result HTML
description: >-
  Retain and rebrand the MIT SSO debug template in betterlite-server::jwt_display. Its only
  substitution is the script statement const ssoData = SSO_DATA; supplied by B063's SSO debug
  callback. Accept the already filtered parsed_by_proxy, raw_claims and access_token_claims
  records, not a bearer-token argument. B063 removes OAuth token fields before calling this
  renderer. There are no environment variables, config reads, database writes or root-path
  substitutions in this template. Preserve the literal /sso/debug/login back link.

  Own the entire HTML/CSS/JavaScript string at jwt_display_template.py L4-L355. Keep the local
  styles, inline SVG controls, 800px/max-width 100% container, 20px page padding, 40px card padding,
  system font stack, colors, borders and responsive viewport behavior in a static asset.
  template_snapshot compares this complete asset to the pinned fixture with only the documented
  branding and script-placeholder changes. Branding text becomes betterlite in title and logo;
  retain SSO Debug Information, Authentication Successful, Parsed by Proxy, Raw Claims (userinfo),
  Access Token Claims, Copy and Try Another SSO Login labels and the explanatory text.

  renderParsed clears the container and iterates Object.entries(parsed || {}) in source order.
  parsed_empty emits No fields available.; parsed_null emits the literal null; parsed_object
  uses compact JSON.stringify; parsed_scalar uses String(value). Assign keys and values through
  textContent. renderJson uses value || {}, displays '(empty — provider returned no claims for
  this section)' when Object.keys is empty, otherwise JSON.stringify(obj, null, 2).
  raw_claims_section and access_claims_section exercise those paths independently. The element
  IDs stay parsedByProxy, rawClaims and accessTokenClaims. dom_ready renders all three sections
  on DOMContentLoaded. copy_raw_claims and copy_access_claims copy the displayed text with
  navigator.clipboard.writeText, alert 'Copied to clipboard!' on success, and copy_failure logs
  'Could not copy text: ' on promise rejection without changing page content. There is no token
  copy control, navigation redirect, fetch or remote asset. static_back_link proves the fixed URL.

  B063 currently uses json.dumps(indent=2, default=str).replace('</', '<\\/') before replacing
  the exact script statement. Keep readable two-space JSON and stringification of supported
  typed non-JSON display values, while serializing <, >, &, U+2028 and U+2029 as script-safe
  escapes. script_terminator, script_separators and quoted_claims prove untrusted claims cannot
  escape the script or create HTML. Do not HTML-entity-encode JSON; that changes the displayed
  claims. Retain DOM textContent assignment, and never interpolate claims into attributes.

  Native snapshot and renderer tests cover this static UI without a fabricated Python helper.
  Browser behavior cases run a local DOM harness against the actual embedded script; the Rust
  tests invoke that harness and fail on rejected promises or wrong DOM/clipboard observations.
  Keep harness fixtures beside the renderer. No byte parser or new fuzz target is introduced.
  Count the template's nonblank data lines, including CSS and JavaScript, rather than treating
  it as zero logic because Python sees a string. Allow 355 asset, 45 renderer, 180 tests/harness
  and 20 wiring lines: 600 changed lines within a 650-line budget. Preserve MIT attribution.
scope:
  paths:
    - crates/betterlite-server/src/jwt_display.rs
    - crates/betterlite-server/src/jwt_display/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/jwt_display_template.py#L4-L355
    why: Complete owned static template, including all three render sections and clipboard behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/ui_sso.py#L4835-L4855
    why: B063 removes bearer fields and substitutes one script-safe JSON payload.
dod:
  - text: template_snapshot, static_back_link and branding_labels preserve all source markup and styles
      except the named rebranding; no config-dependent links or raw-token control are invented.
    proof: [behavior-tests]
  - text: parsed_empty, parsed_null, parsed_object, parsed_scalar, raw_claims_section, access_claims_section,
      dom_ready, copy_raw_claims, copy_access_claims and copy_failure exercise the actual local script.
    proof: [behavior-tests]
  - text: script_terminator, script_separators and quoted_claims preserve claim values while blocking
      script/markup injection; native tests cover the escaping deviation without comparing branded HTML.
    proof: [behavior-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The production renderer, full template snapshot or JavaScript DOM behavior differs.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^jwt_display::tests::/)'
oracle_cases: []
deviations:
  - what: The debug page title and logo say betterlite; JSON also escapes <, >, &, U+2028 and U+2029.
    why: README requires rebranding. Source already protects closing script tags; the additional
      script-safe escapes preserve displayed claims and satisfy the secret/input boundary rules.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/ui_sso.py#L4849-L4853
out_of_scope:
  - B063 owns SSO callback authentication, OAuth token-field removal, HTMLResponse and every HTTP route
    in ui_sso.py; this task renders only its already filtered display payload.
pitfalls:
  - The page shows decoded claim records, not a JWT bearer; adding a raw-token field would undo the caller's filtering.
  - HTML entity escaping inside the script changes JSON data; use JSON escapes and preserve textContent rendering.
budget:
  max_changed_lines: 650
  max_new_expects: 0
review_level: security
