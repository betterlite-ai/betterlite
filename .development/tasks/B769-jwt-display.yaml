id: B769
title: JWT login result HTML
description: >-
  Render the existing JWT display form for the B063 SSO route from a local static template with explicit
  escaped token/user/team substitutions and existing proxy base/root path behavior. The upstream template
  is MIT UI material; preserve user-visible controls while rebranding LiteLLM product text to betterlite.
  Do not load remote script/template assets at runtime. Native-only deviation tests (not oracle equality
  cases): html-escaped-claims. Escape HTML text and quoted attributes in their own context. For JSON embedded
  inside script, use a serializer plus escaping of <, >, &, U+2028 and U+2029 so </script> in a claim
  cannot end the element; HTML entities are not a substitute for JSON escaping. Keep existing DOM textContent
  assignment. Native renderer tests must include closing-script and quoted-attribute payloads.


  Build the production jwt_display module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 0 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  65 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 302 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_retained_mit_login_jwt_template_branding_says_betterlite_and_interpola.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  This task owns a local template renderer and static asset only. B063 owns the actual SSO/JWT display
  HTTP route and calls this renderer. There is no upstream Python helper corresponding to a static HTML
  file, so use native rendering snapshots and context-specific escaping tests against the pinned template
  fixture rather than a fabricated helper oracle. Default/root URL configuration still loads through betterlite-config.
scope:
  paths:
    - crates/betterlite-server/src/jwt_display.rs
    - crates/betterlite-server/src/jwt_display/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/jwt_display_template.py#L1-L355
    why: Pinned implementation and exact ownership boundary for jwt_display.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L5331-L5465
    why: JWT settings declaration; only the fields consumed by this task are enabled.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: display_token_fields,
      root_path_links, empty_team, copy_control_markup.'
    proof:
      - behavior-tests
  - text: 'The recorded deviations are covered by native behavior tests: native_retained_mit_login_jwt_template_branding_says_betterlite_and_interpola.'
    proof:
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^jwt_display::tests::/)
        - test(/replays_the_/)'
oracle_cases: []
deviations:
  - what: Retained MIT login/JWT template branding says betterlite, and interpolated identity/configuration
      text uses context-specific HTML/attribute escaping and script-safe JSON serialization.
    why: README Decisions retains and rebrands the MIT UI; unescaped caller text must not become executable
      markup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/jwt_display_template.py#L1-L355
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Script JSON needs < escaping; HTML entity escaping does not prevent a closing-script payload.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: security
