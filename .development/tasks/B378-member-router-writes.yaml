id: B378
title: Member-owned automatic router writes
description: 'Implement MemberRouterAccess using B052 principal, B057 team membership and B060 model write
  services. Validate ownership metadata, team opt-in, allowed member config fields and each B377 model
  dependency before create/update. Preserve old state on repository failure. No license quota is enforced.
  Implement the owned native service in crates/betterlite-server/src/member_router_writes.rs. Add ProbeOperation::MemberRouterWrites
  in tools/oracle/src/router_probes/mod.rs and the corresponding B378 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/proxy/management_helpers/auto_router_permissions.py:
  authorize_member_auto_router_team (L109-L123), validate_member_auto_router_config (L126-L137), authorize_member_auto_router_dependencies
  (L140-L228), _load_member_auto_router_dependency_objects (L231-L260), authorize_member_auto_router_write
  (L279-L370). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
scope:
  paths:
  - crates/betterlite-server/src/member_router_writes.rs
  - crates/betterlite-server/src/member_router_writes/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/error.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/member_router_writes.rs
  - crates/betterlite-server/src/routing/member_router_writes/**
  - tools/oracle/src/router_probes/member_router_writes.rs
  - tools/oracle/src/router_probes/member_router_writes/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/member_router_writes.py
  - tools/oracle/cases/routing/member-router-writes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/auto_router_permissions.py#L109-L370
  why: Implementation boundary verified against the pinned checkout.
dod:
- text: Write tests named member_router_writes_behaviors and member_router_writes_boundaries under member_router_writes::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - member-router-writes-behaviors
  - member-router-writes-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: member-router-writes-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::member_router_writes_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: member-router-writes-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::member_router_writes_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/member_router_writes.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/member_router_writes.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/member-router-writes/member-own-router.yaml
- tools/oracle/cases/routing/member-router-writes/cross-team-denied.yaml
- tools/oracle/cases/routing/member-router-writes/ownership-fields-rejected.yaml
- tools/oracle/cases/routing/member-router-writes/dependency-model-denied.yaml
deviations:
- what: Auto-router capability counts and tuning quotas do not restrict configuration.
  why: The accepted product decision enables all MIT features without a paid tier.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/auto_router_tuning_baseline.py#L147-L174
out_of_scope:
- B343 owns final integration and the remaining functions listed in its implementation boundary.
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
