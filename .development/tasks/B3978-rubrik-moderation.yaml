dod:
  - text: apply_guardrail routes on input_type="request" to _moderate_prompt and input_type="response" to _moderate_response, wrapping both with _guarded and returning inputs unchanged when type is unrecognized.
    proof: [rubrik-hook-tests]
  - text: _guarded awaits a coroutine and rethrows ModifyResponseException as-is; logs at critical severity on MalformedToolBlockingResponseError and returns inputs unchanged; logs at error severity on any other exception and returns inputs unchanged.
    proof: [rubrik-hook-tests]
  - text: _moderate_response normalizes tool_calls via B3975's _normalize_tool_calls, joins text segments via B3975's _join_texts, extracts correlation_id via B3975's _correlation_id, builds response payload via B3975's _build_response_moderation_payload, posts via B3976's _post_to_response_moderation_endpoint, and detects blocks via B3975's _extract_response_block.
    proof: [rubrik-hook-tests]
  - text: _moderate_response returns inputs unchanged when both tool_calls and texts are empty (early return optimization).
    proof: [rubrik-hook-tests]
  - text: _moderate_response builds request envelope via B3975's _extract_request_data and passes it to the endpoint POST.
    proof: [rubrik-hook-tests]
  - text: >-
      _moderate_response logs a warning at severity "warning" with message literal
      "Rubrik: logging_obj present but model_call_details is empty -- request context will be missing"
      when logging_obj is truthy but model_call_details is empty mapping.
    proof: [rubrik-hook-tests]
  - text: _moderate_response raises ModifyResponseException with message from blocked.explanation, model resolved via B3975's _resolve_model, and guardrail_name from self.guardrail_name when a block is detected.
    proof: [rubrik-hook-tests]
  - text: _moderate_response calls _stash_block_context before raising ModifyResponseException to set the logged context.
    proof: [rubrik-hook-tests]
  - text: _moderate_prompt returns inputs unchanged when no structured_messages are present and no texts are provided.
    proof: [rubrik-hook-tests]
  - text: >-
      _moderate_prompt synthesizes a user message from newline-joined texts when
      structured_messages is absent (text-only requests like /v1/completions), building
      a list with one dict message {"role": "user", "content": joined_text}, and returns
      inputs when joined is empty.
    proof: [rubrik-hook-tests]
  - text: _moderate_prompt builds prompt payload via B3975's _build_prompt_moderation_payload, posts via B3976's _post_to_prompt_moderation_endpoint, and extracts refusal via B3975's _extract_prompt_refusal.
    proof: [rubrik-hook-tests]
  - text: _moderate_prompt returns inputs unchanged when refusal is None (passthrough case).
    proof: [rubrik-hook-tests]
  - text: _moderate_prompt raises ModifyResponseException with message from refusal text, model from inputs.get("model") fallback to request_data.get("model") fallback to "unknown", and guardrail_name from self.guardrail_name when refusal is present.
    proof: [rubrik-hook-tests]
  - text: _moderate_prompt calls _stash_block_context before raising ModifyResponseException.
    proof: [rubrik-hook-tests]
  - text: _stash_block_context sets logging_obj.model_call_details["_rubrik_blocked"] = True when logging_obj is not None, and stashes logging_obj on request_data["_rubrik_logging_obj"].
    proof: [rubrik-hook-tests]
  - text: _stash_block_context logs an error with litellm_call_id when logging_obj is None and sets request_data["_rubrik_logging_obj"] = None for observability.
    proof: [rubrik-hook-tests]
  - text: Every listed oracle case exercises prompt and response moderation paths, block detection and exception raising, fail-open on transient/malformed errors, and block context stashing.
    proof: [oracle]
  - text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad suppressions.
    proof: [probe-python, oracle]

