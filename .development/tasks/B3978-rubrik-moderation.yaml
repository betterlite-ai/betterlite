out_of_scope:
  - Rubrik logger initialization and configuration (handled by B3976).
  - Payload construction and block detection (handled by B3975).
  - Transport layer POST to webhook endpoints (handled by B3976).
  - Sampled log event enqueueing and block event handling (handled by B3977).
  - ModifyResponseException type definition and exception handling (handled by B184).
  - Streaming chunk buffering or end-of-stream moderation; caller must buffer until end-of-stream before invoking.

pitfalls:
  - >-
    _moderate_response uses Final type hints to pin variables for mutation safety;
    tool_calls and texts are extracted once from inputs and never re-read, even if
    inputs is mutated after the early return check.
  - >-
    _moderate_prompt only synthesizes a user message when structured_messages is absent AND
    texts is present and non-empty; a request with neither falls through and returns inputs.
  - >-
    _moderate_prompt joins text segments with newlines, matching the webhook's expectation
    of multi-segment text payloads; single-segment content and empty strings are handled
    but produce different payloads.
  - >-
    _stash_block_context sets request_data["_rubrik_logging_obj"] even when logging_obj is None,
    so the failure handler can test for the key and handle the None case; missing the key
    means moderation never ran.
  - >-
    ModifyResponseException is raised with guardrail_name from self.guardrail_name (assigned at
    logger construction by B3976), not from any input parameter; the framework layer owns the
    exception definition and must provide a constructor accepting message, model, request_data
    and guardrail_name.
  - >-
    MalformedToolBlockingResponseError is a private exception type defined by B3975 for
    when choices is empty; it is caught separately from generic exceptions so it can log
    at critical instead of error, indicating a service misconfiguration.
  - >-
    model resolution in _moderate_response uses call_details (from logging_obj.model_call_details)
    but checks if call_details is an empty mapping and logs a warning; logging_obj may be
    present but provide no context, which is a valid failure case.
  - >-
    Final variables are only available in Python 3.8+ as a typing annotation; the linter
    checks immutability but the runtime does not enforce it.

