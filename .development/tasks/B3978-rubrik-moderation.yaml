id: B3978
title: Rubrik prompt and response moderation hooks
description: >-
  Wire request/response moderation to the lower payload and transport functions,
  with intentional policy blocks rethrown and transient/malformed failures returned
  unchanged. Stash block context for the separate logging hook without invoking it
  directly.

  Implement RubrikLogger.apply_guardrail as the unified entry point that dispatches
  to _moderate_prompt (before model call) or _moderate_response (after model call)
  based on input_type. Both paths build payloads via B3975's functions, post to
  endpoints via B3976's helpers, and interpret responses. Policy blocks (ModifyResponseException)
  are rethrown to fail the request. Transient errors and malformed service responses
  (MalformedToolBlockingResponseError) are logged at critical/error severity and
  return inputs unchanged, implementing fail-open semantics.

  Prompt moderation synthesizes a user message from text-only requests (e.g. /v1/completions)
  before building the webhook payload, since the service expects structured chat format.
  Response moderation normalizes tool calls before payload construction. Both extract
  correlation IDs for joining logs and build request envelopes the service consumes.

  Stash the block flag on logging_obj.model_call_details["_rubrik_blocked"] and store
  logging_obj on request_data["_rubrik_logging_obj"] so the deferred success-event handler
  (B3977) skips the blocked request and async_post_call_failure_hook can build the
  unsampled block event. When logging_obj is None, log an error instead of silently
  dropping the signal, preserving observability of misconfiguration.

