pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_config_selection in the context group. Replace the stub Op in tools/oracle/src/helpers/context/bedrock_config_selection.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_config_selection.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Provider/base extraction happens before the explicit route branches, so an extraction error is not bypassed by
  an explicit route.
