id: B2231
title: Bedrock config selection tags
description: >-
  Provide the pure Bedrock config-selection stage below provider factories, metadata capability queries and passthrough
  logging. Return a closed config tag with its constructor arguments; executable adapter construction is performed
  by the caller using the already owned provider implementation. In the Python oracle capture constructor identity/arguments
  at that boundary while executing the real selector. This task owns selection, not a second implementation of any
  selected provider.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  BedrockModelInfo.get_bedrock_provider_config_for_messages_api selection L1518-L1560; get_bedrock_chat_config selection
  L1563-L1636. litellm/llms/bedrock/chat/invoke_transformations/anthropic_claude2_transformation.py: get_legacy_anthropic_model_names
  L62-L68.


  Named case contracts: native_messages_route: Native Messages config precedence is explicit claude_platform ->
  B656, explicit converse -> None (chat bridge), explicit mantle -> B625, then case-sensitive claude anywhere ->
  B622, otherwise None. It does not treat uppercase Claude as this final match. chat_config_selector: Compute route
  B598, invoke-provider B591 and base B2203 before selection. Routes claude_platform, converse/converse_like, openai,
  chat_completions, agent, agentcore, mantle select B656/B599/B619/B620/B652/B653/B625 respectively. Otherwise amazon
  -> Titan B614; anthropic -> legacy B615 only for B615 legacy-name list, else Claude B615; meta/llama -> B613;
  ai21/cohere/mistral -> B617; moonshot/deepseek_r1 -> B616; nova -> B614; qwen3/qwen2 -> B618; twelvelabs -> B617;
  everything else -> B611 AmazonInvokeConfig. legacy_anthropic_names: The exact legacy list is anthropic.claude-v2,
  anthropic.claude-instant-v1, anthropic.claude-v2:1 in that order. Membership uses the B2203 base model, not arbitrary
  substring/version inference. No environment or user-editable whitelist is read here. selection_without_construction:
  Each selected tag is a zero-argument construction request. Record None for native Messages bridge routes; do not
  instantiate HTTP clients or execute transformation methods in this stage. Constructor failures occur when the
  caller performs the selected construction, in the same position before its provider request.


  Implement crates/betterlite-context/src/bedrock_config_selection.rs with adjacent tests under bedrock_config_selection/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation bedrock_config_selection in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_config_selection_cases in betterlite-context with these exact named cases (one per
  oracle file): native_messages_route, chat_config_selector, legacy_anthropic_names, selection_without_construction.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_config_selection* using HelperCase: kind:
  helper and the externally tagged bedrock_config_selection variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_config_selection that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 91 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 160 production lines, 210 behavior/config-test lines, 105 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 510 planned, 525 maximum changed lines.
