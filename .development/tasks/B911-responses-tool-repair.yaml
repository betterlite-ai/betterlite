checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_repair::/)
      - test(/::replays_corpus$/)'
  - id: case-missing-tool-call-rebuilt
    why: the missing-tool-call-rebuilt behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_repair::tests::missing_tool_call_rebuilt($|::)/)'
  - id: case-prior-assistant-call-id
    why: the prior-assistant-call-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_repair::tests::prior_assistant_call_id($|::)/)'
  - id: case-unknown-tool-not-invented
    why: the unknown-tool-not-invented behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_repair::tests::unknown_tool_not_invented($|::)/)'
  - id: case-multiple-tool-results
    why: the multiple-tool-results behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_repair::tests::multiple_tool_results($|::)/)'
  - id: case-provider-tool-use-shape
    why: the provider-tool-use-shape behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_repair::tests::provider_tool_use_shape($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_tool_repair.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_tool_repair-*)"
      && grep -qE "^[[:space:]]+responses_tool_repair:" tools/oracle/fuzz/corpus/helper_case/responses_tool_repair-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-tool-repair)"
