id: B911
title: Responses tool repair
description: >-
  Repair tool-result history using declared tools and prior assistant calls. Export ToolRepairInput with messages
  and tool definitions, recovering call IDs and inserting missing calls without inventing unknown functions; handle
  provider-shaped tool_use definitions through typed variants.


  LiteLLMCompletionResponsesConfig._ensure_tool_call_output_has_corresponding_tool_call (litellm/responses/litellm_completion_transformation/transformation.py:L988-L997)
  has no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and
  no behavior case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/responses_tool_repair.rs. Use ResponsesToolRepairInput and ResponsesToolRepairResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions missing_tool_call_rebuilt, prior_assistant_call_id, unknown_tool_not_invented,
  multiple_tool_results, provider_tool_use_shape under api::responses_tool_repair::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesToolRepair in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_tool_repair: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._find_previous_assistant_idx
  (L1000-L1014); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._recover_tool_call_id_from_assistant
  (L1017-L1043); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._get_tool_calls_list
  (L1046-L1065); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._check_tool_call_exists
  (L1068-L1078); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._reconstruct_tool_call_from_tools
  (L1081-L1097); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._get_mapping_or_attr_value
  (L1100-L1117); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._create_tool_call_chunk
  (L1120-L1143); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._normalize_tool_use_definition
  (L1146-L1184); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._add_tool_call_to_assistant
  (L1187-L1200); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._ensure_tool_results_have_corresponding_tool_calls
  (L1203-L1323). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 246 owned nonblank/non-comment/non-docstring Python lines (269 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 266 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 516 total within the 520-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B178 (Tool argument parsing and schema
  transforms), B902 (Responses shapes), B1087 (Api boundaries), B907 (Responses codex tools). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
