id: B911
title: Repair Responses tool-result history
description: >-
  Implement every method in transformation.py L999-L1323 in betterlite-core::api::responses_tool_repair.
  Repair a deep copy of messages, matching each tool result to the nearest preceding assistant,
  even across intervening user/tool messages. Inject the tool-call cache that B913's
  output conversion writes and B912 reads; B2226 owns its local TTL storage. A cache miss
  may reconstruct a call from the first named declared tool. Do not promise the correct tool
  name can be inferred: LiteLLM deliberately picks the first usable definition with arguments="{}".

  Own the mapping/attribute accessor, cached-definition normalization, call-chunk creation and
  assistant append helper as well as the repair loop. B907 serializes raw arguments. B004's
  parsed chat records provide the dict/attribute variants. The responses_tool_repair helper
  receives typed cache contents and compares both the repaired messages and unchanged input.
  Count 269 nonblank/non-comment source lines; allow 255 implementation, 165 tests, 100 fixtures,
  85 adapters and 25 wiring, 630 lines. No parser of external bytes is introduced.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_tool_repair.rs
  - crates/betterlite-core/src/api/responses_tool_repair/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/responses_tool_repair.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/responses_tool_repair.py
  - tools/oracle/fuzz/corpus/helper_case/responses_tool_repair-*
  - tools/oracle/cases/helpers/responses-tool-repair/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L999-L1323
  why: Own complete repair and normalization helpers; all nested guards are inside this task.
dod:
- text: >-
    recover_call_id repairs a tool with tool_call_id="" from the first call in the nearest
    prior assistant's list, using its dict/attribute id, stringifying numeric id=7 to "7".
    No list/empty first ID leaves it unrecovered; a later assistant without a matching ID
    prevents looking farther back. An existing matching call is never duplicated and input
    records are unchanged because repair works on a deep copy.
  proof: [repair-tests, oracle, repair-adapter]
- text: >-
    missing_call_definition adds cached {id:c,type:function,function:{name:f,arguments:{x:1}}}
    to the nearest assistant for tool result c, with index equal to its current call count
    and arguments='{"x": 1}'. Cache miss plus tools=[{function:{name:first}},{name:second}]
    selects first with arguments="{}". No cache/no named tool leaves the result unrepaired;
    a tool with no preceding assistant is also preserved. Multiple results append distinct
    missing calls in result order and do not duplicate already-present IDs.
  proof: [repair-tests, oracle, repair-adapter]
- text: >-
    empty_result_policy drops an unrecoverable empty-ID tool only when at least one non-tool
    message exists anywhere in the sequence. An all-tool list keeps empty-ID results to avoid
    empty messages; [] returns []. ID=0 is stringified to "0" and is not dropped.
  proof: [repair-tests, oracle, repair-adapter]
- text: >-
    cached_shapes accepts dictionaries and objects exposing id,type,function; falsy definitions
    or objects exposing none of those fields normalize to null. Missing/falsy normalized
    id becomes the result ID, type becomes function. Nested function objects are converted
    when they expose name or arguments. Chunk defaults are name="",arguments="{}",type=function,
    and supplied index=2 stays 2. Direct chunk id=null falls back to the result ID, while an
    explicit empty id remains empty before normalization. Raw argument objects use B907 JSON serialization.
  proof: [repair-tests, oracle, repair-adapter]
- text: >-
    accessor_append reads dict first, then callable get(key,default), then attributes if get
    raises TypeError/AttributeError; other exceptions propagate. Tool-call extraction accepts
    lists/other non-string iterables and returns [] for null/string/bytes. Append creates a
    missing dict tool_calls list but does not replace existing null/non-list dict values;
    an object's tool_calls=null becomes [], and non-list object values are left unchanged.
  proof: [repair-tests, oracle, repair-adapter]
checks:
  optional: []
  commands:
  - id: repair-tests
    why: history repair changes correlation, mutates input or fabricates the wrong fallback shape
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_repair::/)'
  - id: repair-adapter
    why: cache and object-shaped repair cases lack independent pinned execution
    run: test -f tools/oracle/helpers/responses_tool_repair.py && grep -qE '^[[:space:]]+responses_tool_repair:' tools/oracle/fuzz/corpus/helper_case/responses_tool_repair-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-tool-repair/recover-call-id.yaml
- tools/oracle/cases/helpers/responses-tool-repair/missing-call-definition.yaml
- tools/oracle/cases/helpers/responses-tool-repair/empty-result-policy.yaml
- tools/oracle/cases/helpers/responses-tool-repair/cached-shapes.yaml
- tools/oracle/cases/helpers/responses-tool-repair/accessor-append.yaml
deviations: []
out_of_scope:
- _ensure_tool_call_output_has_corresponding_tool_call L988-L995 and _deduplicate_tool_call_output_messages L925-L985 have no caller at the pin.
- Other transformation.py methods belong to B907 tool helpers, B908 options, B909 input dispatch, B910 merges, B912 results, B913 namespaces, B914 outputs, B915 sessions and B1115 details.
pitfalls:
- A cache miss uses the first named tool, with no attempt to match its name to the result ID.
- The dictionary append branch preserves existing tool_calls=null, unlike the object branch that replaces null with an empty list.
- The nearest assistant search is not limited to the immediately preceding message.
review_level: standard
budget:
  max_changed_lines: 630
  max_new_expects: 1
