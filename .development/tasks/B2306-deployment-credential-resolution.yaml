id: B2306
title: Resolve deployment credentials for passthrough and metadata discovery
description: >-
  Extract Router.get_deployment_credentials (L10286-L10299), _deployment_usable_by_team and
  _get_model_group_deployment_usable_by_team (L10323-L10348), get_credential_deployment,
  _get_team_public_name_deployment, _get_wildcard_deployment_usable_by_team and
  get_deployment_credentials_with_provider (L10550-L10661), and _is_deployment_blocked
  (L14512-L14521) into betterlite-router::deployment_credentials. B845 consumes this service;
  B016 composes it instead of owning these functions. B844 supplies deployment indexes and typed
  lookup, B367 pattern expansion, and B061.CredentialAccessor the concrete credential-list lookup.

  Resolve a deployment by exact ID, then the first usable deployment under model_name, then the
  team's exact public model name, then a wildcard. Name candidates with no owner are shared;
  candidates with model_info.team_id require an equal team_id. Missing caller team matches only
  shared names. Exact-ID lookup intentionally does not run this team predicate: its callers own
  authorization, so this helper must not claim that an arbitrary supplied ID is tenant-safe.
  Exact public-name lookup returns the first indexed team row and does nothing for team_id=None.
  Prefer any matching team wildcard list over the global list; filter global matches by team owner
  before choosing the first. An unsupported first wildcard value yields None, without trying the
  next. Convert dict candidates through the existing Deployment validator and propagate its errors.

  Only after choosing a candidate test blocked is literally true. A blocked first match returns None;
  do not continue to another deployment or global wildcard. Missing model_info, blocked=None and false
  are unblocked. get_deployment_credentials performs only exact-ID lookup, the same blocked test and
  CredentialLiteLLMParams projection with null fields excluded. It does not resolve named credentials
  or synthesize a provider. The richer helper starts with that projection, then, when
  litellm_credential_name is not None, gets a copy from B061, warns Credential '<name>' not found in
  credential_list for an empty result, overlays the values and removes litellm_credential_name.
  Missing credentials still return the deployment's remaining parameters; no authentication error
  or database write is invented here.

  After the credential overlay, restore model to the deployment's original model string. A truthy
  deployment custom_llm_provider wins; otherwise use the substring before the first slash in model,
  or openai when there is no slash. These final model/provider assignments override same-named fields
  from a credential record. Other credential values override deployment values, without mutating
  either stored input. Preserve the distinction between no credential name and an empty name: an
  empty name still triggers lookup and the warning. Carry credential values in the existing secret
  wrappers; this layer neither encrypts nor persists them and never logs their contents.

  Inputs are typed catalog/credential snapshots; no setting, environment read or new byte parser is
  introduced. B171's deployment_credentials helper operation calls the pinned methods over a real
  in-memory router/catalog and fixture credential_list, comparing selected ID, fixture-safe projection
  and warning text. No HTTP handler is called. The eight functions contain 141 nonblank, noncomment
  lines including docstrings; allocate 160 production, 230 behavior tests, 80 adapters and 30 wiring
  lines, 500 within a 550-line gate. Keep the implementation and adjacent tests in domain submodules.
scope:
  paths:
    - crates/betterlite-router/src/deployment_credentials.rs
    - crates/betterlite-router/src/deployment_credentials/**
    - crates/betterlite-router/Cargo.toml
    - tools/oracle/src/helpers/router/deployment_credentials.rs
    - tools/oracle/src/helpers/router/deployment_credentials/**
    - tools/oracle/helpers/deployment_credentials.py
    - tools/oracle/helpers/deployment_credentials/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/deployment-credentials/**
    - tools/oracle/fuzz/corpus/helper_case/deployment-credentials-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L10286-L10348
    why: Own exact-ID credential projection and the team predicates; B844 retains the intervening group lookup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L10550-L10661
    why: Selection order, team wildcard precedence, named credential overlay and provider restoration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L14512-L14521
    why: Blocked means the boolean true after the winning candidate has already been selected.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/credential_accessor.py#L9-L22
    why: B061 returns a copy of the first named credential, or an empty mapping.
dod:
  - text: 'credential_selection covers exact_id_before_name, exact_id_authorization_left_to_caller,
      first_shared_or_same_team_name, foreign_name_skipped, caller_without_team, first_team_public_name,
      team_wildcard_before_global, global_wildcard_owner_filter, unsupported_first_wildcard,
      typed_and_dict_candidates, malformed_candidate_propagates, unknown_returns_none,
      blocked_first_match_no_fallback and missing_null_false_blocked_allowed.'
    proof: [behavior-tests, oracle, helper-python, helper-corpus]
  - text: 'credential_projection covers simple_lookup_no_named_resolution, null_fields_omitted,
      named_overlay_without_mutation, empty_name_still_lookup, missing_name_warns_and_returns_base,
      deployment_model_restored, explicit_provider_restored, slash_provider_prefix,
      unprefixed_provider_openai and credential_values_never_logged.'
    proof: [behavior-tests, oracle]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Resolution priority, blocked handling or credential projection is missing or differs from the pin.
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^deployment_credentials::tests::/)'
    - id: helper-python
      why: The pinned credential-selection adapter is absent or fails Python checks.
      run: test -f tools/oracle/helpers/deployment_credentials.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-corpus
      why: The shared helper decoder has no new deployment_credentials seed or cannot replay it.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/deployment-credentials-*')" && grep -rlq deployment_credentials tools/oracle/fuzz/corpus/helper_case/deployment-credentials-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/deployment-credentials/id-and-name-priority.yaml
  - tools/oracle/cases/helpers/deployment-credentials/team-public-and-wildcard.yaml
  - tools/oracle/cases/helpers/deployment-credentials/blocked-first-match.yaml
  - tools/oracle/cases/helpers/deployment-credentials/malformed-candidate.yaml
  - tools/oracle/cases/helpers/deployment-credentials/simple-projection.yaml
  - tools/oracle/cases/helpers/deployment-credentials/named-overlay.yaml
  - tools/oracle/cases/helpers/deployment-credentials/missing-name-warning.yaml
  - tools/oracle/cases/helpers/deployment-credentials/model-and-provider-restored.yaml
deviations: []
out_of_scope:
  - B844 owns get_deployment, get_deployment_by_model_group_name and catalog indexes; B367 owns pattern expansion.
  - B061 owns credential list loading and CredentialAccessor; this task only reads its typed snapshot.
  - B016 and its existing parts retain every other router.py function; B845 owns discovery and metadata projections.
  - B052 authorizes requests before credential resolution. B087 owns managed file/batch hooks and their pending product decision.
pitfalls:
  - 'The oracle helper for this task is pre-registered as deployment_credentials in the router group. Replace the stub Op in tools/oracle/src/helpers/router/deployment_credentials.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/deployment_credentials.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A blocked team wildcard shadows global matches because blocked is checked after selection.
  - Exact deployment IDs bypass the name lookup's team predicate; an authorization caller cannot delegate tenant checks to this helper.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
