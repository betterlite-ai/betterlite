id: B4410
title: Define secret settings, reader contracts and safe rotation
description: >-
  Establish the types, base operations and eligibility rules for secret managers that will be implemented in later tasks.
  Add crates/betterlite-secret-managers to define the core secret-manager contracts and common rotation algorithm.

  Config accepts KeyManagementSettings with hosted_keys (allowlist), access_mode (read_only/write_only/read_and_write),
  prefix_for_stored_virtual_keys, primary_secret_name (for K/V reads), description and tags (for AWS writes),
  store_virtual_keys, kms_key_id and AWS credential options (region, role, session, external_id, profile, web_identity_token, sts_endpoint, replica_regions).

  Export a KeyManagementSystem enum closed over all nine manager variants: AWS_KMS ("aws_kms"), AWS_SECRET_MANAGER ("aws_secret_manager"), GOOGLE_SECRET_MANAGER ("google_secret_manager"), GOOGLE_KMS ("google_kms"), HASHICORP_VAULT ("hashicorp_vault"), CYBERARK ("cyberark"), AZURE_KEY_VAULT ("azure_key_vault"), LOCAL ("local"), and CUSTOM ("custom"). Define raise_if_unsafe_secret_name to validate paths: rejects ".." only as a full path segment (not in "1.0..2"), and all control characters 0x00-0x1F, 0x7F-0x9F, and space/tab.

  Define BaseSecretManager abstract operations: async_read_secret and sync_read_secret read by name and optional params,
  async_write_secret writes with optional description and tags, async_delete_secret deletes with 7-day recovery window default,
  and async_rotate_secret uses a supplied reader/writer/deleter to change names safely:
  verify the current secret exists, create the new one, verify it, delete the old one with recovery window 7, and return the create response.
  All operations accept optional_params and timeout; none are transactional.

  Implement helper functions to inspect and project secret values: str_to_bool converts "true"/"false" (trimmed, case-insensitive) to booleans and None otherwise,
  normalize_nonempty_secret_str strips whitespace and treats empty/None as None,
  secret_manager_would_be_consulted returns whether a get_secret read would reach the hosted manager (checking both client and hosted_keys allowlist),
  and _should_read_secret_from_secret_manager returns true when the client exists, settings exist, and access_mode allows reads.

  Config accepts KeyManagementSettings with custom_secret_manager: an optional string class path required when key_management_system is "custom".

  Every default, config key and behavior is tested with oracle cases, and environment-lookup contracts with B002 are verified through config tests.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-secret-managers/**
    - crates/betterlite-config/**
  lint_tables: false
