  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L153-L163
    why: normalize_nonempty_secret_str implementation
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L368-L395
    why: secret_manager_would_be_consulted and _should_read_secret_from_secret_manager implementations
dod:
  - text: >-
      The unsafe secret name pattern rejects ".." only as a path segment (e.g. "../x", "x/..", or exactly ".."),
      rejects all control characters 0x00-0x1F and 0x7F-0x9F, and rejects space and tab,
      but permits ".." in names like "version-1.0..2".
    proof: [secret-name-validation]
  - text: KeyManagementSystem is a closed enum with all nine manager variants (AWS_KMS, AWS_SECRET_MANAGER, GOOGLE_SECRET_MANAGER, GOOGLE_KMS, HASHICORP_VAULT, CYBERARK, AZURE_KEY_VAULT, LOCAL, CUSTOM).
    proof: [secret-types]
  - text: KeyManagementSettings accepts hosted_keys list, access_mode, prefix, primary_secret_name, description, tags, store_virtual_keys, kms_key_id, custom_secret_manager (string class path, required when key_management_system is custom), and all AWS fields, with correct defaults and types.
    proof: [config-tests]
  - text: custom_secret_manager field is present, defaults to None, and is accepted when key_management_system is "custom".
    proof: [config-tests]
  - text: >-
      BaseSecretManager defines five async methods (async_read_secret, sync_read_secret, async_write_secret, async_delete_secret, async_rotate_secret)
      with correct signatures, all accepting optional_params and timeout, and rotation verifies presence before deleting.
    proof: [secret-contracts]
  - text: async_rotate_secret verifies the current secret exists, creates the new secret, verifies creation, deletes the old secret with recovery window 7, and returns the create response.
    proof: [secret-contracts]
  - text: str_to_bool converts trimmed "true"/"false" (case-insensitive) to booleans and returns None for other values.
    proof: [secret-helpers]
  - text: normalize_nonempty_secret_str strips whitespace and returns None for empty or None input.
    proof: [secret-helpers]
  - text: secret_manager_would_be_consulted returns true only when the client exists, settings exist, and the secret name is in hosted_keys (or hosted_keys is None).
    proof: [secret-helpers]
  - text: _should_read_secret_from_secret_manager returns true only when the client exists, settings exist, and access_mode is "read_only" or "read_and_write".
    proof: [secret-helpers]
  - text: Config loader accepts KeyManagementSettings as a new top-level section with all its fields.
    proof: [config-tests]
  - text: Environment-variable resolution in config loading supplies an EnvironmentLookup trait to KeyManagementSettings fields that read env vars.
    proof: [config-tests]
checks:
  optional: []
  commands:
    - id: secret-name-validation
      why: the unsafe secret name pattern does not match the behavior at the pinned commit
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_name::/)'
    - id: secret-types
      why: the secret types or defaults do not match LiteLLM's
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_types::/)'
    - id: secret-contracts
      why: the BaseSecretManager methods or rotation algorithm are not correct
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_contracts::/)'
    - id: secret-helpers
      why: the helper functions do not match LiteLLM's behavior
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_helpers::/)'
    - id: config-tests
      why: the config loader does not accept or validate KeyManagementSettings correctly
      run: cargo nextest run --locked -p betterlite-config -p betterlite-secret-managers --no-tests=fail -E 'test(/^config_secret_settings::/)' || cargo nextest run --locked -p betterlite-config -p betterlite-secret-managers --no-tests=fail
oracle_cases: []
deviations:
  - what: KeyManagementSettings accepts unknown YAML keys without raising an error, matching LiteLLM's silent-ignore behavior through Pydantic defaults.
    why: This mirrors LiteLLM's own behavior at the pinned commit where KeyManagementSettings extends LiteLLMPydanticObjectBase without extra="forbid"; rejecting unknown keys would be stricter than the source and is not part of this task.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/base.py#L7-L26
  - what: betterlite requires environment variables for KeyManagementSettings fields to be supplied through config injection, not read from process environment directly in the secret-managers crate.
    why: Environment lookup comes through a configurable trait (B002 EnvironmentLookup) so tests can pass a map and only the binary passes the real process environment, following rule inject-dependencies.
out_of_scope:
  - All secret manager implementations (AWS, Google, Vault, CyberArk, custom). Those come in B4412-B4421.
  - OIDC providers and token caching. Those are B4411.
  - The get_secret dispatch and fallback logic. That is B4421.
  - Virtual keys, budgets, and spend tracking.
pitfalls:
  - The unsafe-name pattern must match the exact control-character ranges and the ".." segment check; "1.0..2" is safe but "../name" and "name/.." are not.
  - async_rotate_secret passes optional_params to read, write and delete, but the caller (later virtual-key hooks and config initialization) supplies the reader/writer/deleter, not a concrete manager.
  - recovery_window_in_days defaults to 7 in the delete signature; callers must pass it explicitly if they need a different value.
  - The access_mode field is Literal["read_only", "write_only", "read_and_write"], never a boolean or three separate flags.
  - LiteLLM's source accepts both dict and list for tags in async_write_secret; betterlite types the parameter the same way.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
