id: B9693
title: Prove the AI Hub publish flows and the public hub page requests through the booted proxy
description: >-
  Add HTTP oracle cases that send what the admin AI Hub table and the public hub pages send,
  in the order they send it, so a publish action on the admin side shows up on the public
  side. B9090 takes in the covered files unchanged and B9091 builds them. ModelHubTable takes a
  premiumUser prop but never reads it, so there is no patch. Every route has an owner and no
  handler is registered here.

  Admin hub. ModelHubTable loads GET /model_group/info (B060) and reads data[] with
  model_group, providers, mode, max_input_tokens, max_output_tokens, input_cost_per_token,
  output_cost_per_token and is_public_model_group, then GET /config/field/info?field_name=enable_public_model_hub
  (B8595, mounted by B8675) and treats field_value == true as the switch for the public link.
  Agents come from GET /v1/agents (B4784, mounted by B8647), read as agents[].agent_id,
  agent_card_params and litellm_params.is_public; MCP servers from GET /v1/mcp/server with no
  query (B4720, mounted by B8625); skills from GET /claude-code/plugins?enabled_only=false
  (B993), read as plugins[] with name, enabled and the manifest fields. The publish forms
  send POST /model_group/make_public {model_groups:[...]} with the full selected list,
  already-public groups preselected (B839); POST /v1/agents/make_public {agent_ids:[...]}
  (B4786); POST /v1/mcp/make_public {mcp_server_ids:[...]} (B4721, mounted by B8627); and for
  skills one POST /claude-code/plugins/<name>/enable or /disable per skill whose state changes,
  sent in parallel, with no request for unchanged skills (B992). UsefulLinksManagement reads
  GET /public/model_hub/info and saves POST /model_hub/update_useful_links {useful_links:
  {name: url or {url, index}}} with the whole map (B839).

  Public pages. app/model_hub_table renders ModelHubTable with publicPage true. Without a
  key it calls GET /litellm/.well-known/litellm-ui-config (B144's discovery case), then GET
  /public/model_hub with no auth and only Content-Type, and on a non-2xx shows an empty list.
  With ?key=<key> in the page URL it uses that key as the bearer for /model_group/info, the
  field read and GET /claude-code/plugins?enabled_only=true. public_model_hub reads
  GET /public/model_hub/info for useful_links, GET /public/agent_hub, GET /public/mcp_hub and
  GET /public/skill_hub (all without auth, B077 composing B3193 and B3194), the list through
  GET /public/v1/model_hub?page=1&page_size=50&sort=model_group, adding q=<trimmed search>,
  sort=-<field> for descending and filter[providers][in]=a,b, filter[mode][in]=... or
  filter[features][in]=... joined by commas, and the three facets through GET
  /public/v1/model_hub/{providers,modes,features}?page_size=100. GET /get/ui_settings decides
  require_auth_for_public_ai_hub; B9735 covers it.

  Owner cases. B839 plans make-public and useful-links success, invalid-target and
  unauthorized cases, B4786 and B4721 plan their make_public bodies, B992 plugin-disable-enable
  and B993 plugin-list-pagination, and B3193 and B3194 plan the public list, facet and hub
  shapes. None is on disk, and none chains a publish with the public read that shows it. Do not
  duplicate their single-route checks. Add these page transcripts: a model publish that sends
  two groups, then /model_group/info shows is_public_model_group and /public/model_hub and
  /public/v1/model_hub list only those; an agent publish followed by /public/agent_hub; an MCP
  publish followed by /public/mcp_hub; a skill toggle that enables one and disables one, then
  enabled_only=true and /public/skill_hub; a useful-links save followed by /public/model_hub/info
  with an indexed and a plain link; the public list with the page's exact default query, then
  with q, a descending sort and all three filters; the three facets with page_size=100; and
  the enable_public_model_hub field read before and after a /config/field/update; and the
  public table opened with an internal user's key, sending /model_group/info and
  enabled_only=true with that key. A last case
  sends each publish write as an internal_user and as a proxy_admin_viewer and keeps the 403
  bodies. Use B860's Postgres fixture with B5076's bootstrap, two configured model groups with
  model_info metadata, one stored agent, one stored MCP server and two registered plugins.
  About 430 case lines.
scope:
  paths:
    - tools/oracle/cases/ui/model-hub/**
  lint_tables: false
