    why: Unauthenticated public hub reads that fall back to empty, /model_group/info and the useful links body.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L5830-L5886
    why: Agent and MCP make-public bodies.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L7218-L7246
    why: enabled_only is always sent as true or false.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_management_endpoints.py#L2784-L2934
    why: B839's make-public and useful-links decorators.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_endpoints.py#L217-L384
    why: The legacy model hub, agent, MCP and skill hubs and hub info.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py#L392-L728
    why: B993's list with enabled_only and B992's enable and disable decorators.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L1229-L1330
    why: B4786's bulk make-public.
dod:
  - text: Each admin publish action is followed by the public read that shows it, and both match LiteLLM.
    proof: [model-hub-cases, oracle]
  - text: The public list and facets match LiteLLM for the page's exact default, search, sort and filter queries.
    proof: [model-hub-cases, oracle]
  - text: Non-admin publish writes keep the server's 403.
    proof: [model-hub-cases, oracle]
checks:
  optional: []
  commands:
    - id: model-hub-cases
      why: No booted-proxy case chains the hub publish writes with the public reads the pages send.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/model-hub)" &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/ui/model-hub
oracle_cases:
  - tools/oracle/cases/ui/model-hub/model-publish-then-public-lists.yaml
  - tools/oracle/cases/ui/model-hub/agent-publish-then-agent-hub.yaml
  - tools/oracle/cases/ui/model-hub/mcp-publish-then-mcp-hub.yaml
  - tools/oracle/cases/ui/model-hub/skill-toggle-then-skill-hub.yaml
  - tools/oracle/cases/ui/model-hub/useful-links-then-info.yaml
  - tools/oracle/cases/ui/model-hub/public-list-default-query.yaml
  - tools/oracle/cases/ui/model-hub/public-list-search-sort-filters.yaml
  - tools/oracle/cases/ui/model-hub/public-facets-page-size.yaml
  - tools/oracle/cases/ui/model-hub/public-hub-switch-field.yaml
  - tools/oracle/cases/ui/model-hub/public-table-with-url-key.yaml
  - tools/oracle/cases/ui/model-hub/non-admin-publish-denied.yaml
deviations: []
out_of_scope:
  - B9090 retains every function in the covered hub components; B9091 builds them and B146 opens the admin and public hub pages in the browser.
  - B060, B839, B4784, B4786, B4720, B4721, B992, B993, B8595, B077, B3193 and B3194 own the handlers; B8647, B8625, B8627 and B8675 own the mounts.
  - The MCP server list and agent list shapes on their own pages are B9735's and the agent and MCP page tasks'; the code snippets the hub shows run in a client, not through the proxy.
pitfalls:
  - The legacy public model hub call turns any non-2xx into an empty list, so a missing route looks like an empty hub in the browser; the HTTP case is what tells them apart.
  - enabled_only is a literal true or false string in the query, never omitted.
  - Skill publishing has no bulk route; each changed skill is its own enable or disable POST.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
