    why: Admin and public data loads, the enable_public_model_hub read and enabled_only by page kind.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/AIHub/forms/MakeModelPublicForm.tsx#L100-L130
    why: Already-public groups are preselected and the full list is sent.
