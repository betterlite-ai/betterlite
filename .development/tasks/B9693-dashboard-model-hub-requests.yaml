    why: Only skills whose state changes get an enable or disable request.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/public_model_hub.tsx#L100-L145
