id: B9693
title: Prove the AI Hub publish flows and the public hub page requests through the booted proxy
description: >-
  Add HTTP oracle cases that send what the admin AI Hub table sends for model groups, in the
  order it sends it. B9090 takes in the covered files unchanged and B9091 builds them.
  ModelHubTable takes a premiumUser prop but never reads it, so there is no patch. Every route
  has an owner and no handler is registered here. The public hub reads (B077, B3193, B3194) and
  the agent, MCP and skill hub actions (B4784, B4786, B8647, B4720, B4721, B8625, B8627, B992,
  B993) are deferred, and B077 adds their page transcripts.

  Admin hub. ModelHubTable loads GET /model_group/info (B060) and reads data[] with
  model_group, providers, mode, max_input_tokens, max_output_tokens, input_cost_per_token,
  output_cost_per_token and is_public_model_group, then GET /config/field/info?field_name=enable_public_model_hub
  (B8595, mounted by B8675) and treats field_value == true as the switch for the public link.
  The model publish form sends POST /model_group/make_public {model_groups:[...]} with the full
  selected list, already-public groups preselected (B839).

  Public table with a key. app/model_hub_table renders ModelHubTable with publicPage true. With
  ?key=<key> in the page URL it uses that key as the bearer for /model_group/info and the field
  read. GET /get/ui_settings decides require_auth_for_public_ai_hub; B9735 covers it.

  Owner cases. B839 plans make-public and useful-links success, invalid-target and
  unauthorized cases. None is on disk, and none chains a publish with the read that shows it.
  Do not duplicate their single-route checks. Add these page transcripts: a model publish that
  sends two groups, then /model_group/info shows is_public_model_group on exactly those; the
  enable_public_model_hub field read before and after a /config/field/update; the public table
  opened with an internal user's key, sending /model_group/info and the field read with that
  key; and a last case that sends the model publish write as an internal_user and as a
  proxy_admin_viewer and keeps the 403 bodies. Use B860's Postgres fixture with B9942's
  bootstrap and two configured model groups with model_info metadata. About 180 case lines.
scope:
  paths:
    - tools/oracle/cases/ui/model-hub/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/AIHub/ModelHubTable.tsx#L98-L243
    why: Admin and keyed public table loads and the enable_public_model_hub read.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/AIHub/forms/MakeModelPublicForm.tsx#L100-L130
    why: Already-public groups are preselected and the full list is sent.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L1656-L1774
    why: The /model_group/info request.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_management_endpoints.py#L2784-L2934
    why: B839's make-public and useful-links decorators.
dod:
  - text: The model publish is followed by the /model_group/info read that shows it, and both match LiteLLM.
    proof: [model-hub-cases, oracle]
  - text: The enable_public_model_hub field read and the keyed public table reads match LiteLLM.
    proof: [model-hub-cases, oracle]
  - text: A non-admin model publish keeps the server's 403.
    proof: [model-hub-cases, oracle]
checks:
  optional: []
  commands:
    - id: model-hub-cases
      why: No booted-proxy case chains the model hub publish write with the reads the page sends.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/model-hub)" &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/ui/model-hub
oracle_cases:
  - tools/oracle/cases/ui/model-hub/model-publish-then-group-info.yaml
  - tools/oracle/cases/ui/model-hub/public-hub-switch-field.yaml
  - tools/oracle/cases/ui/model-hub/public-table-with-url-key.yaml
  - tools/oracle/cases/ui/model-hub/non-admin-publish-denied.yaml
deviations: []
out_of_scope:
  - B9090 retains every function in the covered hub components; B9091 builds them and B146 opens the admin and public hub pages in the browser.
  - "B060, B839 and B8595 own the handlers and B8675 the config mount. The public hub reads (B3193 and B3194, mounted by B077) and the agent, MCP and skill publishes (B4784, B4786 and B8647; B4720, B4721, B8625 and B8627; B992 and B993). B077 adds every transcript that ends on a public hub read: model publish then public lists, agent, MCP and skill publish then hub, useful links then hub info, and the public list queries and facets."
  - The MCP server list and agent list shapes on their own pages are B9735's and the agent and MCP page tasks'; the code snippets the hub shows run in a client, not through the proxy.
pitfalls:
  - The publish form preselects the groups that are already public and sends the full list, so publishing one more group still sends every public group in model_groups.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
