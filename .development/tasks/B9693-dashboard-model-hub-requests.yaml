  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/publicModelHub/publicModelHubFilters.ts#L28-L43
    why: filter[field][in] values joined by commas.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/hooks/common/useResourceList.ts#L50-L81
    why: page, page_size, sort with a minus for descending and q.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/publicModelHub/usePublicModelHubFacets.ts#L12-L40
