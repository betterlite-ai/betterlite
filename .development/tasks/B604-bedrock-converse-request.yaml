id: B604
title: Bedrock Converse request assembly
description: >-
  Add ConverseRequest assembly, composing prepared options, tool/beta processing and async supplied-media conversion.
  Preserve model ARN/default-field handling, compact-only context-management filtering and tool-name mappings. Native
  byte requirements reuse the no-fetch inline-media policy; B181 owns the final message blocks.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig._prepare_request_params L1569-L1684; AmazonConverseConfig._transform_request_helper L1861-L1970;
  AmazonConverseConfig._async_transform_request L1972-L2014; AmazonConverseConfig.transform_request L2016-L2033;
  AmazonConverseConfig._transform_request L2035-L2077.


  With cache_control_injection_points at location tool_config append the cachePoint locally. AnthropicCacheControlHook.record_gateway_injection
  belongs to B2204 below both this assembly and B119; call the typed helper directly, without importing proxy hooks
  or inventing a notification sink. drop_params and modify_params default to false as in the pinned module settings.


  Reuse AnthropicConfig._model_supports_effort_param from B569 (litellm/llms/anthropic/chat/transformation.py);
  its implementation remains with that prerequisite.


  Reuse bedrock_request_metadata_is_owned from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Reuse resolve_bedrock_request_metadata from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicModelInfo.maybe_drop_disabled_thinking from B688 (litellm/llms/anthropic/common_utils.py); its
  implementation remains with that prerequisite.


  Read drop_params from the injected LITELLM_DROP_PARAMS-derived setting and modify_params from the LITELLM_MODIFY_PARAMS-derived
  setting, both false by default; shared drop flag ownership stays B206 and modify flag ownership B2202.


  Named case contracts: converse_body_shape: Order: pop _output_config_normalized from caller options and truth-test
  it; B2204 filter exceptions/nulls then safe_deep_copy. Separate maxTokens,stopSequences,temperature,topP,topK,top_k;
  tools/tool_choice; guardrailConfig/performanceConfig/serviceTier. Pop json_mode, snake output_config, requestMetadata,
  camel outputConfig. Unsupported remaining fields become additionalModelRequestFields after removing parallel_tool_calls/client_metadata,
  B602 topK handling and B2204 internal/null filtering. Always emit inferenceConfig, evenempty; emit additionalModelRequestFields/system
  onlytruthy, config blocks/requestMetadata/outputConfig whenevernon-None. No model or model_id is added by this
  body helper. tool_config_injection: Pop tools default[] and process B683 first. Pop cache_control_injection_points
  unconditionally; if truthy, converted toolsnonempty and B690 accepts cache points, append one B602 cachePoint
  for the first point location=tool_config and stop. If litellm_params supplied, call B2204 record_gateway_injection(added=1),
  preserving its bucket/sentinel/deployment rules. No tools/unsupported model/no matching point ->no injection or
  credit. ToolConfig exists only for nonempty converted tools; then pop tool_choice and ifnon-None attach toolChoice
  plus B602 remove only additional.tool_choice.type. If no tools, tool_choice stays in inferenceConfig as the source
  does. context_management_filter: Replay B683 compact-only filtering and beta insertion through final assembly.
  Do not repeat the removed helper in this task or preserve unsupported edits as forward-compatible data. system_message_order:
  Both sync and async: B603 system extraction, orphan handling, trailing guarded text, then common request helper,
  then B181 message conversion with llm_provider=bedrock_converse and popped litellm_params.user_continue_message
  defaultNone. B596 resolves metadata after message conversion; opted-in metadata ownership removes caller requestMetadata
  even if resolutionNone, otherwise replaces with trusted resolved map. Unowned metadata remains. Return messages
  plus common fields, preserving caller mutation order. inline_document_image: Use B181/B183 production media conversion
  for supplied data/file blocks with no network in oracle; compare source conversion through injected media transport.
  Current native policy rejects request HTTP(S) URLs when bytes would need downloading with ImageFetchError400,
  no param/code added by this layer; it never fetches the URL. This URL rejection is a Rust deviation test; pure
  helper parity uses supplied bytes only. model_arn_request: After format removal, application-inference-profile
  ARN forwards remaining dict output_config verbatim, bypassing capability/effort validation. Anthropic base: global
  drop_params literal True plus unsupported effort -> B576 exact Dropping unsupported `output_config` warning and
  omit; per-call drop does not select this branch. Otherwise B690 normalize only if consumed markerfalse, B600 validates
  effortnon-None, then forward. Non-Anthropic/non-profile remaining output_config silentlydrops. output_format_precedence:
  Remove format from dict snake output_config; retain onlydict format candidate, discard emptyremaining config.
  Explicit camel outputConfig non-None wins. Otherwise native conversion requires format.type=json_schema, Anthropic
  base and native capability; B601 builds native outputConfig even schema missing/None. Any other dict format candidate
  with no camel outputConfig warns Bedrock Converse: dropping `output_config.format` for model=<model> — model does
  not advertise `supports_native_structured_output` in model_prices_and_context_window.json. The schema will not
  be enforced; pass `response_format` to use the synthetic tool-call fallback. A nondict format drops without that
  warning. thinking_history_policy: If thinkingnon-None, messages supplied, B2202 last assistant-with-tool-calls
  lacks thinking and no assistant has thinking, truthy modify_params removes thinking and warns Dropping 'thinking'
  param because the last assistant message with tool_calls has no thinking_blocks. The model won't use extended
  thinking for this turn. Otherwise retain. Then always invoke B688 maybe_drop_disabled_thinking. Any thinking key
  surviving in additionalModelRequestFields adds additionalModelResponseFieldPaths=[/usage/output_tokens_details],
  regardless of its enabled/disabled value.


  Add standalone Rust test converse_request_url_not_fetched asserting ImageFetchError400 and zero media/upstream
  transport calls; inline_document_image oracle case uses only supplied bytes. The transport response mapping stays
  with API/error owners.


  Direct shared helper ownership: B598. Reuse these named lower helpers at the source call sites rather than reproducing
  them.


  Implement crates/betterlite-bedrock/src/converse_request.rs with adjacent tests under converse_request/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_request_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): converse_body_shape, tool_config_injection, context_management_filter, system_message_order, inline_document_image,
  model_arn_request, output_format_precedence, thinking_history_policy. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_request* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_request variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_request that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 255 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 285 production lines, 290 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 725 planned, 725 maximum changed lines.
