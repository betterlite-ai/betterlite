id: B081
title: Anthropic messages routes
description: >-
  Mount POST /v1/messages and POST /claude_code_gateway/v1/messages once, sharing LiteLLM's anthropic_response handler (litellm/proxy/anthropic_endpoints/endpoints.py L120-L286). The handler reads the body, runs ProxyBaseLLMRequestProcessing.base_process_llm_request with route type anthropic_messages, optionally strips usage.total_tokens, and answers three kinds of failure its own way. The earlier plan handed the processing, the response headers, the exception logging and the SSE answer to B004. B004 built none of them for this route, and B7324 records that no task builds the shared ProxyBaseLLMRequestProcessing class. So this route builds its own messages pipeline from parts that exist or are planned: B8801's pre-call step, B9800's call steps and route choice, B9720's stream generator, B9801's first-chunk answer, B9802's custom headers and B7324's keepalive wrap, keepalive interval and error payload helpers. Do not build a shared processor class or another dispatch to every adapter.


  Files. The handler, the pipeline and the error answers go in module `api::anthropic_messages_routes` (crates/betterlite-server/src/api/anthropic_messages_routes.rs and anthropic_messages_routes/: handler.rs, pipeline.rs, errors.rs, hooks.rs, tests.rs). B1100 registers crates/betterlite-server/src/routes/anthropic_messages.rs as a stub: fill only that file (and its folder) with the router and the route state, and leave routes.rs and state.rs as they are. Every name stays at 30 characters or fewer.


  Routes. Both paths are POST only and share one handler; the gateway alias is hidden from OpenAPI and goes through B1132's enable_claude_code_gateway guard (404 with detail "Claude Code gateway is not enabled" when the setting is omitted or false). Both authenticate through B756/B855, and the body is read through B1100 before anything else, as LiteLLM reads it before the handler's try block. /messages is not an alias. Neither route reads query parameters or an environment variable.


  Route state, built in routes/anthropic_messages.rs from the server state. `MessagesRouteServices::new(...)` takes, as typed constructor arguments: the pre-call step as `Arc<dyn PreCall<UserAPIKeyAuth>>`, built with B8801's `PreCallStep::standalone(settings)` (B8804 swaps in the production step); the generator `SharedStreamGenerator::standalone(redactor)` (B7980 swaps in the production ports); B9800's `MessagesCallSteps::new(dispatch, routing, None, mock, user_model)` with `B1134Dispatch` as the dispatch, `standalone_routing(executor, dispatch)` as the routing when the config has a model_list and None otherwise (LiteLLM's llm_router is None without one), no read-through, the `mock_testing_params` section and the user_model value of B8800's CliOverrides; the hooks port below with its pass-through implementation; and a settings snapshot (this task's section, B011's include_call_id_in_error_body, B1132's gateway setting, B8389's general_settings_view, the version the chat route on main sends and the WireDecodeLimits B9720's standalone generator uses).


  Config. Section `anthropic_messages_routes` (crates/betterlite-config/src/sections/anthropic_messages_routes.rs and its folder) reads litellm_settings.strip_anthropic_total_tokens (bool, default false, LiteLLM's litellm/__init__.py L265) and litellm_settings.sse_keepalive_ping_interval_seconds (L267: default null, kept as the raw number or string so B7324's coerce_keepalive_interval applies LiteLLM's rules; absent or null is None). No environment variable feeds either key. Seeds go in crates/betterlite-config/fuzz/corpus/config_yaml/anthropic-messages-routes-*.


  Hooks port (hooks.rs). `MessagesHooks` is the slice of LiteLLM's ProxyLogging this route calls, as async methods taking the request data, the key and the route type where LiteLLM passes them: `during_call_hook` (Result<(), HookError>), `update_request_status(call_id, "success")` (sync; a production implementation spawns its write the way LiteLLM's create_task does), `post_call_success_hook` (returns the body or a HookError), `post_call_response_headers_hook` (returns an optional header map; it gets the body on the non-stream path and None on the stream path, plus the request headers) and `post_call_failure_hook` (B8395's FailureHook contract; the route ignores a returned replacement, as endpoints.py does). `HookError` is `ModifyResponse` (B5471's GuardrailFailure::ModifyResponse), `Http { status, detail }` or `Other`. `PassThroughHooks` answers Ok, returns the body unchanged, gives no headers and records nothing; the route state uses it until a later task swaps in B8399's ProxyLogging.


  Pipeline (pipeline.rs), common_request_processing.py L2461-L2978 for this route type. `MessagesPipeline::respond(&self, parts, key, data) -> Response`:
  1. The client model is the body's `model` when it is a string. The keepalive interval is B7324's `ttft_interval_for(routing as DeploymentLookup, data, the section's setting)` over the body as read.
  2. Build the produce future below, mapping any `MessagesFailure` to the error answer of the handler section inside the future, and hand it to `open_sse_before_first_byte(produce, setting, "text/event-stream", None)`. Since the future then never fails, an Err from open_sse_before_first_byte can only come from the wrap itself; answer it with sse_error_payload's body as JSON under its status.
  3. Produce: run the pre-call step with route type anthropic_messages, version and no separate model; from here on the request data is the pre-call output's data and the call id is its logging state's id (request_litellm_call_id, L1606-L1610). Then run `hooks.during_call_hook` and B9800's `calls.call(data, is_proxy_admin)` together, where is_proxy_admin is true when the key's user_role is proxy_admin; the first error ends both, as LiteLLM's gather and _cancel_pending_gather_tasks do. Then `hooks.update_request_status(call id, "success")`.
  4. Stream outcome (L2665-L2823): take `hooks.post_call_response_headers_hook` with no body, build the headers with B9802's `custom_headers` (key view from the key, the call id, model id from the hidden params' model_id else the data's litellm_metadata.model_info.id, cache_key, api_base, response_cost, model_region the key's allowed_model_region, fastest_response_batch_completion, the request data, the hidden params and the hidden additional_headers as extra pairs, no logging view) and put the callback headers over them. Write `_litellm_client_requested_model` into the data when the client model is set. Call B9720's `messages_stream(SharedCall { source, key, request_data: data, request: Some(parts) }, client model)` and hand the body to B9801's `first_chunk_answer(body, headers, None, include_call_id_in_error_body)`.
  5. Message outcome (L2859-L2978): body = `hooks.post_call_success_hook(...)`. The response cost for the headers is the hidden response_cost, else "" (see deviations). When the client model is set and B9720's return_raw_model_name(data) is false, restamp the body's model the way _override_openai_response_model does for a dict (L1312-L1420): skip it when the hidden additional_headers' x-litellm-attempted-fallbacks is a number above 0, when the hidden params name an Azure model router call (a non-empty azure_model_router_selected_model, or the hidden litellm_model_name or model, or the client model, routed to model_router by betterlite-context's get_azure_ai_route), or when the body has no `model` key; otherwise set it to the client model. Build the headers with custom_headers as in step 4 with this response cost, remove `_hidden_params` from the body, and when include_guardrail_response is the JSON bool true in the data's metadata or litellm_metadata, add `guardrail_information`: the first standard_logging_guardrail_information list found in those two buckets, keeping its object entries with B3688's redact_nested_match_and_regex_keys over the keys keyword, snippet, match and regex (L1427-L1456). Put `hooks.post_call_response_headers_hook` with the body over the headers, run B744's check_response_size_is_safe on the body, then strip usage.total_tokens when the section asks for it (below), and answer JSON 200 with the headers as `ProducedResponse::Plain`.


  Handler pieces (errors.rs, endpoints.py L46-L117 and L182-L286). `strip_total_tokens(body)` removes `total_tokens` only from a root `usage` that is an object; a missing or null usage and a stream are untouched. `MessagesFailure` carries the failure and the request data the processor held when it happened, and its sources map as follows: B9800's MissingParam and B8801's ProxyException-shaped failures are a ProxyException; MockParamsDisabled, NotFound, B8801's HTTP failure and HookError::Http are an HTTPException with status and detail; Context is the context error; HookError::ModifyResponse is the blocked response; Blocked, MissingModel, CallFailure and HookError::Other are an ordinary exception with LiteLLM's status (error_status_code, default 500), message and timeout.
  - Blocked response (L182-L228): call the failure hook with the exception's request_data, build `{id: "msg_" + a v4 UUID, type: "message", role: "assistant", content: [{type: "text", text: message}], model, stop_reason: "end_turn", usage: B3663's blocked_response_usage(original response)}` in that key order with no stop_sequence. When the body's `stream` is the JSON bool true, run B9720's `sse_data_generator(SharedCall { source: one Plain chunk holding that message, key, request_data: the exception's request_data, request: None }, None)` and answer `first_chunk_answer(body, empty headers, None, false)`; otherwise answer that message as JSON 200 with no custom headers and no strip.
  - Context error (L229-L243): call the failure hook with the processor's data only when the status is 500 or more, and answer B958's transform_to_anthropic_error(status, message, x-request-id) as JSON with that status and no headers; no exception log and no span close.
  - Any other failure (L244-L286): call the failure hook with the processor's data, then log at error "litellm.proxy.proxy_server._handle_llm_api_exception(): Exception occured - litellm_call_id={call id} - {error}" (log_llm_api_exception, L1613-L1632; a 499 with detail "Client disconnected the request" logs at info instead). A ProxyException gets x-litellm-call-id set in its headers when absent and the call id is known (with_litellm_call_id) and goes to the JSON answer below. Otherwise build headers with custom_headers (call id, model id from the request data's litellm_metadata.model_info.id or "", version, response cost 0, model region the key's allowed_model_region or "", the request data, the failure's timeout, no logging view). An HTTPException becomes a ProxyException the way proxy_exception_from_http_exception does (L601-L614): message and structured fields from B7324's exception_detail_parts(detail), the structured fields over any existing provider fields, status error_status_code with default 400, and those headers. Anything else becomes ProxyException::new with its message, its status as code and those headers.
  - JSON answer (_anthropic_error_json_response, L65-L83): status is the code when it is all ASCII digits, else 500; call B8389's close_error_span(status, error) seam; envelope = transform_to_anthropic_error(status, message, the request's x-request-id or None); the error object gets provider_specific_fields when non-empty and then litellm_call_id when error_body_call_id(include_call_id_in_error_body, the exception's x-litellm-call-id header) gives one; answer JSON with that status and the exception's headers.


  Tests. api::anthropic_messages_routes::tests drive the router through tower's oneshot with fakes for the pre-call step, the dispatch, the routing and the hooks, and cover every DoD item, including the three failure kinds no HTTP case can reach before production hooks exist (blocked response, context error, ProxyException with headers). Use `tokio::time::pause` for the keepalive. The HTTP oracle cases run against booted proxies with general_settings.master_key sk-route-test, a mock upstream deployment and no enterprise package; a normal request sends model messages-test, max_tokens 16 and messages [{role: user, content: hello}].
