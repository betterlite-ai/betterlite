dod:
- text: >-
    routes_share_authenticated_processing sends the normal request with x-api-key sk-route-test and anthropic-version 2023-06-01 to each alias, enabling the gateway explicitly.
    Both return 200 with type message, role assistant, content [{type: text, text: hello}], stop_reason end_turn and usage 2 input and 1 output, one matching provider request
    and x-litellm-call-id on each response. Repeat with a configured OpenAI chat deployment and a Responses deployment to prove B1134's composition. GET on either path is 405
    with detail "Method Not Allowed" and no provider request; /messages returns 404 with detail "Not Found". Query foo=bar does not change the provider request.
  proof: [behavior-tests, oracle]
- text: >-
    gateway_and_auth_rejections covers both routes with valid JSON and no key: 401, error.type auth_error, error.param "None", error.code "401", message
    "Authentication Error, No api key passed in." and no provider call. With no database configured, x-api-key sk-wrong gives 400, type no_db_connection, param null,
    code "400", message "No connected db.". With valid auth and the gateway setting omitted or false, the gateway alias returns 404 with detail
    "Claude Code gateway is not enabled" and no upstream request, while the ordinary route still succeeds.
  proof: [behavior-tests, oracle]
- text: >-
    strips_only_dictionary_usage: with strip_anthropic_total_tokens omitted or false the response keeps usage.total_tokens and nested iterations; with true only the root
    total_tokens goes. Module cases cover a missing usage, a null usage and a stream, all unchanged, and a streamed request yields the same message_start and message_delta
    events under either setting.
  proof: [behavior-tests, config-tests, oracle]
- text: >-
    The pipeline runs in LiteLLM's order: pre-call, the during-call hook next to B9800's call, the success status, then for a stream the callback headers over the custom
    headers, the client model key and B9801's answer, and for a message the success hook, the model restamp with its three skips, the custom headers, the removed _hidden_params,
    guardrail_information only on request, the response headers hook, the size check and the strip.
  proof: [behavior-tests]
- text: >-
    A streamed request answers 200 text/event-stream with Cache-Control no-cache, X-Accel-Buffering no and the custom headers, and with sse_keepalive_ping_interval_seconds
    set a slow upstream gets ": ping" comments before the first event.
  proof: [behavior-tests, oracle]
- text: >-
    blocked_response_preserves_paid_usage (module tests, a hook raising ModifyResponse with message blocked, model messages-test, request_data {model: blocked-context} and
    original usage 5 input and 2 output, then no original) answers 200 with an id starting msg_, type message, role assistant, model messages-test, content
    [{type: text, text: blocked}], stop_reason end_turn, usage 5/2 or 0/0 and no stop_sequence; the failure hook gets blocked-context. stream omitted, null or false answers
    JSON; the literal true answers text/event-stream with exactly one data frame holding that message and no custom x-litellm headers.
  proof: [behavior-tests]
- text: >-
    context_errors_use_their_status (module tests, a dispatch failing with the context error, bad-context at 400 and then 503) answers 400 invalid_request_error and
    503 api_error with top-level type error, error.message bad-context, no param or code and no custom headers; x-request-id req_context appears as request_id; the failure
    hook runs once for 503 and never for 400, and neither logs the generic exception nor closes the span.
  proof: [behavior-tests]
- text: >-
    proxy_errors_keep_headers_and_optional_details (module tests, a ProxyException with message limited, type rate_limit_error, code "429", headers retry-after 2 and
    x-litellm-call-id call_fixed, provider fields {zone: west}) answers 429 with error {type: rate_limit_error, message: limited, provider_specific_fields: {zone: west}},
    retry-after 2 and x-litellm-call-id call_fixed. include_call_id_in_error_body true adds error.litellm_call_id call_fixed, and false, unset or an empty header omits it;
    empty provider fields are omitted; code null or "bad" answers 500 api_error and "0400" answers 400. The failure hook, the exception log and close_error_span see the
    original error in that order.
  proof: [behavior-tests, config-tests]
- text: >-
    ordinary_errors_use_shared_header_projection: an unknown model answers 400 with B9800's not-found text and provider_specific_fields holding the detail, a mock_timeout
    param without the opt-in answers 400 with the mock gate text, and an upstream 500 answers 500 api_error, each with x-litellm-call-id, x-litellm-key-spend and
    x-litellm-response-cost "0" from B9802's headers. Module cases check the header input (model id "" or the data's litellm_metadata.model_info.id, timeout absent or 7)
    and that a ProxyException keeps its own headers.
  proof: [behavior-tests, oracle]
- text: >-
    loads_message_route_settings uses the production config loader for strip_anthropic_total_tokens omitted, false and true and sse_keepalive_ping_interval_seconds omitted,
    null, a number and a numeric string, with the defaults false and None, and the settings reach the route. Those configurations are committed to the config_yaml corpus.
  proof: [config-tests, config-corpus]
