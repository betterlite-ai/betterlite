deviations: []
out_of_scope:
- B996 owns endpoints.py count_tokens and event_logging_batch, and the gateway count_tokens alias.
- B1132 owns gateway_endpoints.py _general_settings, _is_gateway_enabled, ensure_gateway_enabled and _managed_settings.
- B989 owns gateway OAuth records, _oauth_error_response, oauth_authorization_server, device_authorization,
  _validate_login, _mint_access_token, _claim_device_code, _handle_device_code_grant and oauth_token.
- B990 owns gateway managed_settings, _skip_otlp_body_parsing, _accept_otlp, otlp_metrics, otlp_logs and otlp_traces.
- B1134 owns every callable in messages/dispatch.py and anthropic_interface/messages/__init__.py, including
  _python_messages, _python_amessages, _public_request, _resolved_provider, _context, anthropic_messages_handler,
  anthropic_messages, acreate and create; this task composes their public exports, not another implementation.
- Other covered __init__.py files contain only exports. Their implementations remain in B967 (chat adapter),
  B968/B972 (context edits), B983/B984/B985/B986 (Responses adapter), and B991 (marketplace router).
- B004 owns processing, shared SSE transport and stream model restamping integration; B980 owns the restamper.
  B003/B756/B855 own admission failures before this try block. B124 owns OTel span behavior behind the injected seam.
pitfalls:
- A blocked stream contains one full message data frame; inventing a native lifecycle changes the pinned wire format.
- Only literal data.stream=true selects the blocked streaming branch, and only dictionary-valued usage is stripped.
- Context errors do not acquire generic custom headers or call-id decoration, even when their status is 500 or greater.
- The two registrations share authentication but only /claude_code_gateway/v1/messages checks the gateway setting.
- Generic failures call the failure hook before inspecting their exception class; ProxyException headers survive intact.
review_level: security
budget:
  max_changed_lines: 750
  max_new_expects: 0
