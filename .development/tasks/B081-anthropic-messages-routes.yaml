dod:
- text: >-
    routes_share_authenticated_processing sends the normal request with x-api-key=sk-route-test and
    anthropic-version=2023-06-01 to each alias, enabling the gateway explicitly. Both return 200 with
    type=message,role=assistant,content=[{type:text,text:hello}],stop_reason=end_turn and usage 2 input/1 output.
    Assert one matching provider request and x-litellm-call-id on each response. Repeat with the configured
    OpenAI chat deployment and Responses deployment to prove B1134 composition; conversion belongs to those
    dependencies. GET on either path is 405 with detail=Method Not Allowed and no provider request; /messages
    is not an alias and returns 404 with detail=Not Found. Query foo=bar does not alter the provider request.
  proof: [behavior-tests, oracle]
- text: >-
    gateway_and_auth_rejections covers both routes with valid JSON and no key: 401,error.type=auth_error,
    error.param="None",error.code="401",message="Authentication Error, No api key passed in." and no provider call.
    With no database configured, x-api-key=sk-wrong yields 400,type=no_db_connection,param=null,code="400",
    message="No connected db." from auth. These are shared envelopes, without top-level type=error.
    With valid auth and gateway setting omitted or false, the gateway alias returns 404,
    detail="Claude Code gateway is not enabled", no error.type/param/code and no upstream request;
    the ordinary route still succeeds. Malformed body handling remains B1100/B756, outside this mapper.
  proof: [behavior-tests, oracle]
- text: >-
    strips_only_dictionary_usage sends a response with usage={input_tokens:2,output_tokens:1,total_tokens:3,
    cache_read_input_tokens:4} and iterations=[{usage:{total_tokens:9}}]. Default/false preserves all fields;
    true removes only root total_tokens. Unit cases repeat with an object carrying dictionary usage; null,
    missing usage, usage=null, a typed Usage object and a streaming handle are unchanged. Streaming HTTP
    still yields the same message_start and message_delta events under either setting.
  proof: [behavior-tests, config-tests, oracle]
- text: >-
    blocked_response_preserves_paid_usage raises ModifyResponseException(message=blocked,model=messages-test,
    request_data={model:blocked-context}) with original usage input_tokens=5/output_tokens=2, then null original.
    Expect HTTP 200,id beginning msg_,type=message,role=assistant,model=messages-test,
    content=[{type:text,text:blocked}],stop_reason=end_turn and usage respectively 5/2 or 0/0.
    stop_sequence is not inserted. The failure hook receives blocked-context rather than processor data.
    stream omitted/null/false returns JSON; literal true returns text/event-stream containing exactly one
    data frame holding that full message, with no invented message_start/delta/stop lifecycle and no custom
    x-litellm headers from this branch. Assert the synthetic generator is exhausted.
  proof: [behavior-tests, oracle]
- text: >-
    context_errors_use_their_status raises AnthropicContextManagementError(message=bad-context,status_code=400),
    then status_code=503. Expect respectively 400/invalid_request_error and 503/api_error, top-level type=error,
    error.message=bad-context, no param/code and no custom headers. x-request-id=req_context appears as
    request_id=req_context; omission or empty request id omits it. The failure hook sees processor data exactly
    once for 503 and never for 400; neither case uses generic exception logging or the dangling-span seam.
  proof: [behavior-tests, oracle]
- text: >-
    proxy_errors_keep_headers_and_optional_details injects ProxyException(message=limited,type=rate_limit_error,
    param=ignored,code="429",headers={retry-after:2,x-litellm-call-id:call_fixed},provider_specific_fields={zone:west}).
    Expect 429,type=error,error={type:rate_limit_error,message:limited,provider_specific_fields:{zone:west}},
    retry-after=2 and x-litellm-call-id=call_fixed; param/code are absent. Setting include_call_id_in_error_body=true
    adds error.litellm_call_id=call_fixed; false/unset omits it, and an empty header never adds it. Empty provider
    fields are omitted. x-request-id=req_error adds request_id=req_error; missing/empty omits it. code=null or
    "bad" produces 500/api_error with the same message; "0400" produces 400/invalid_request_error.
    Unit-test _anthropic_error_detail with call_id="" separately: that helper includes the empty string.
    Failure hook, exception logging and close_error_span receive the original error in that order.
  proof: [behavior-tests, config-tests, oracle]
- text: >-
    ordinary_errors_use_shared_header_projection injects HTTPException(418,detail=teapot) and ValueError(broken).
    Expect 418/api_error/message=teapot and 500/api_error/message=broken, top-level type=error and no param/code.
    Capture the header-builder input: response_cost=0, logging object=null, missing model id="", missing allowed
    region="", missing timeout=null, with the same request data/version/call id/principal. A second exception
    with timeout=7 and data.litellm_metadata.model_info.id=deployment-a passes those values. Both paths forward
    the resulting headers and call failure hook, generic logger and close_error_span once. A ProxyException
    case bypasses new header construction and keeps its existing headers.
  proof: [behavior-tests, oracle]
- text: >-
    loads_message_route_settings uses the production config loader for strip_anthropic_total_tokens omitted/false/true,
    include_call_id_in_error_body omitted/false/true and enable_claude_code_gateway omitted/false/true; the defaults
    are all false and the explicit settings reach the route. Reuse B011/B1132 fields and assert these valid keys
    are absent from unsupported-key reports. Commit those configurations to the existing config_yaml corpus.
  proof: [config-tests, config-corpus]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Route integration, synthetic response branches or precise exception projections are absent.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::anthropic_messages_routes::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: The settings load but never reach this handler or have the wrong pinned defaults.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::anthropic_messages_routes::tests::loads_message_route_settings($|::)/)'
  - id: config-corpus
    why: No new route setting seed is accepted by the production YAML parser.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/anthropic-messages-routes-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
