id: B081
title: Anthropic messages routes
description: >-
  Finish POST /v1/messages and source aliases through B014, B052 auth and native/chat/Responses/MCP services. Restore
  client-visible model names, remove total_tokens from Anthropic usage only where the source does, and preserve
  native SSE errors. Export the service used by Claude gateway aliases and later B095/B100/B119 consumers; Python
  sync/async wrappers bind to this same native operation.


  Register POST /v1/messages and /claude_code_gateway/v1/messages; the gateway alias uses B1132 enable_claude_code_gateway
  and is 404 when disabled. Default strip_anthropic_total_tokens=false retains total_tokens; the removal case explicitly
  enables it. ModifyResponseException returns 200 synthetic msg_ content, end_turn and blocked-response usage, or
  equivalent SSE. AnthropicContextManagementError uses its own status with no extra headers and invokes the failure
  hook only for 5xx. include_call_id_in_error_body controls the error body call id.


  Implement crates/betterlite-server/src/api/anthropic_messages_routes.rs, crates/betterlite-core/src/api/anthropic_messages_routes.rs.
  Use AnthropicMessagesRouteInput and AnthropicMessagesRouteResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/messages; POST /claude_code_gateway/v1/messages. Each alias
  is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts its child
  factories without re-registering their methods/paths.


  Route input projections: request.headers.x-request-id (absent None); data.litellm_metadata (absent {}); data.stream
  (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:83 status_code=status_code; endpoints.py:243 status_code=e.status_code; endpoints.py:278
  type=openai_error_type(e, error_status_code(e, 500)), param=openai_error_param(e), code=error_status_code(e, 500).
  Compare the actual source status, error type, param and code; ignore only error wording except in message-extraction
  tests.


  Write adjacent tests.rs behavior functions native_message_route, chat_backed_message_route, responses_backed_message_route,
  stream_model_restamp, anthropic_error_route, total_tokens_removed, default_total_tokens_kept, gateway_disabled_404,
  blocked_message_200, blocked_message_stream, context_error_4xx, context_error_5xx, error_call_id_enabled, route_aliases,
  auth_missing, auth_invalid under api::anthropic_messages_routes::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.strip_anthropic_total_tokens
  defaults to false; general_settings.include_call_id_in_error_body defaults to false. No environment reads occur
  outside betterlite-config. Test api::anthropic_messages_routes::tests::loads_settings uses the production Config
  loader and an injected environment map, with a named rstest case for every key above, explicit override, unset/default
  and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key report;
  a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder rather
  than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/anthropic_endpoints/endpoints.py: _with_provider_specific_fields (L46-L50);
  litellm/proxy/anthropic_endpoints/endpoints.py: _anthropic_error_detail (L53-L62); litellm/proxy/anthropic_endpoints/endpoints.py:
  _anthropic_error_json_response (L65-L83); litellm/proxy/anthropic_endpoints/endpoints.py: _strip_total_tokens_from_anthropic_response
  (L86-L117); litellm/proxy/anthropic_endpoints/endpoints.py: anthropic_response (L125-L286). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 205 owned nonblank/non-comment/non-docstring Python lines (233 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 225 implementation,
  136 behavior tests, 192 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds
  and 38 wiring; 627 total within the 630-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B958 (Messages errors), B960 (Anthropic beta filter), B977 (Messages
  chat stream), B980 (Messages stream restamp), B981 (Messages agentic stream), B982 (Messages native call), B987
  (Messages advisor), B988 (Messages mcp), B990 (Claude gateway settings), B992 (Claude plugin write), B993 (Claude
  plugin read), B994 (Claude skill write), B995 (Claude skill read), B996 (Messages token route), B1087 (Api boundaries),
  B1132 (Claude gateway enable and settings policy), B1100 (Shared request body decoding), B1134 (Messages public
  dispatch), B732 (Typed authentication principals and grant resolution), B855 (Authenticated request admission
  and budget handoff), B756 (Authentication header selection and mode dispatch), B003 (HTTP server, health routes
  and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces and Postgres
  test fixture), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
