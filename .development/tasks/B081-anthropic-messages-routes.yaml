deviations:
- what: A /v1/messages success does not carry x-litellm-response-cost, and the cost header leaves out guardrail cost, until production logging state reaches the route; LiteLLM recovers the cost from its logging object.
  why: The route runs with B8801's standalone pre-call and pass-through hooks until B8804 and the logging tasks swap them in; there is no cost source before that.
- what: When sse_keepalive_ping_interval_seconds is set and the request fails after the first keepalive went out, the closing data frame holds the Anthropic error envelope this route builds, where LiteLLM writes the OpenAI-shaped error object of sse_error_payload.
  why: The route maps its typed failures inside the future it hands to open_sse_before_first_byte, since that wrap only carries an SseFailure back and the three failure branches need the typed error; the fast path, without keepalives, answers exactly as LiteLLM does.
out_of_scope:
- B996 owns endpoints.py count_tokens and event_logging_batch, and the gateway count_tokens alias.
- B1132 owns gateway_endpoints.py _general_settings, _is_gateway_enabled, ensure_gateway_enabled and _managed_settings.
- B989 owns gateway OAuth records, _oauth_error_response, oauth_authorization_server, device_authorization, _validate_login, _mint_access_token, _claim_device_code, _handle_device_code_grant and oauth_token.
- B990 owns gateway managed_settings, _skip_otlp_body_parsing, _accept_otlp, otlp_metrics, otlp_logs and otlp_traces.
- B1134 owns every callable in messages/dispatch.py and anthropic_interface/messages/__init__.py, including _python_messages, _python_amessages, _public_request, _resolved_provider, _context, anthropic_messages_handler, anthropic_messages, acreate and create; this task composes their public exports through B9800, not another implementation.
- Other covered __init__.py files contain only exports. Their implementations remain in B967 (chat adapter), B968/B972 (context edits), B983/B984/B985/B986 (Responses adapter), and B991 (marketplace router).
- B9720 owns the shared SSE generator and the stream model restamp integration and B7980 its production ports; B980 owns the restamper.
- B9800 owns route_request, _route_request_single_attempt and the shared call steps; B9801 owns create_response and the first-chunk checks; B9802 owns get_custom_headers; B7324 owns open_sse_before_first_byte, ttft_keepalive_interval, sse_error_payload and serialize_http_exception_detail.
- B003/B756/B855 own admission failures before the handler. B8389 owns OTel span behavior behind the injected close_error_span seam. B744 owns check_response_size_is_safe. B3688 owns redact_nested_match_and_regex_keys.
- "The production MessagesHooks (B8399's ProxyLogging), MessagesRouting (B8611 and B8631) and model read-through (B8231) and their swap into routes/anthropic_messages.rs: see B081's plan notes. The header refresh after a router fallback stream adopts another deployment's headers: B312 and B6021, passed to B9801 by that swap."
- "_arm_detached_stream_failure_hook (L3135-L3161): betterlite has no detached upstream drain; dropping the body drops the upstream and B9720's drop guard runs the cleanup."
- "The deferred logging around post-call guardrails (_has_post_call_guardrails, _arm_deferred_stream_dispatch, _flush_deferred_async_logging, record_served_output_texts): B6370 and B8399 behind the hooks port. with_proxy_compaction_executor: B8291, B100 and B9810. cancel_on_disconnect: axum drops the handler future when the client leaves."
pitfalls:
- 'A blocked stream holds one full message data frame; inventing a native message_start to message_stop lifecycle changes the pinned wire format.'
- 'Only the literal stream true selects the blocked streaming branch, and only an object-valued root usage is stripped.'
- 'Context errors get no custom headers or call-id decoration, even at 500 or above.'
- 'The two registrations share authentication, but only /claude_code_gateway/v1/messages checks the gateway setting.'
- 'Ordinary failures call the failure hook before the exception class is looked at, and a ProxyException keeps its own headers instead of the custom ones.'
- 'The not-found and mock-gate failures are HTTPExceptions with a dict detail, so the Anthropic error carries provider_specific_fields with that dict and its "error" text as the message.'
- 'The ordinary-failure headers read litellm_metadata.model_info.id from the request data and pass response cost 0, so x-litellm-response-cost is "0", not absent.'
