id: B081
title: Anthropic messages routes
description: >-
  Mount POST /v1/messages and POST /claude_code_gateway/v1/messages once, sharing the Messages handler.
  The gateway alias is hidden from OpenAPI and uses B1132's enable_claude_code_gateway guard; both paths
  authenticate through B756/B855. Own endpoints.py's complete _with_provider_specific_fields,
  _anthropic_error_detail, _anthropic_error_json_response, _strip_total_tokens_from_anthropic_response and
  anthropic_response, including its nested blocked-response generator. Keep request reading through B1100
  before the handler's try block. Neither route reads query parameters or an environment variable directly.

  Implement betterlite-server::api::anthropic_messages_routes with a typed MessagesRouteServices constructor.
  Delegate base_process_llm_request, response headers, exception logging and SSE serialization to B004;
  pass route_type=anthropic_messages, select_data_generator=null, model=null and the resolved user_model,
  user_temperature, user_request_timeout, user_max_tokens, user_api_base and version unchanged. B1134 owns
  the public dispatch operation registered with that processor. Do not dispatch separately to every adapter.
  B003 supplies shared HTTP error payload helpers, B011 supplies call-id policy, B958 the Anthropic mapper.
  B104 owns ModifyResponseException and blocked_response_usage; inject its typed blocked-response result and
  failure-hook interface because it has no task file yet. B124 owns general_settings_view and dangling OTel
  span closure; consume a typed settings snapshot and close_error_span(status, error) seam pending that task.

  litellm_settings.strip_anthropic_total_tokens defaults false. When true, mutate only a dictionary-valued
  root usage, whether on a dictionary response or an object attribute; remove only total_tokens. Preserve
  strongly typed Usage objects, streaming handles and nested iterations. B011's
  general_settings.include_call_id_in_error_body defaults false and requires literal true. Provider-specific
  error fields are included only when nonempty. Error code strings consisting of digits become the HTTP status;
  absent or nondigit codes fall back to 500. Forward exception headers unchanged, close the error span and
  transform the raw message with request.headers.x-request-id, absent null.

  Use B2401 HTTP cases against booted proxies with general_settings.master_key=sk-route-test, a fixed
  mock deployment and no enterprise package. Both route aliases, downstream requests, status/body/headers
  and captured failure-hook calls are compared. Fault scenarios use a fixture callback installed in each
  booted proxy to raise typed failures at the same processing boundary, never a helper calling FastAPI.
  A normal request sends model=messages-test,max_tokens=16,messages=[{role:user,content:hello}].
  Module tests cover non-JSON object shapes that cannot be sent over HTTP. B1100 already decodes JSON;
  do not create another parser or helper operation for this route.

  The endpoint functions plus decorator contain 194 nonblank/non-comment physical lines; the gateway
  registration adds 7. Allow 205 implementation, 165 tests, 235 HTTP fixtures, 55 fixture callbacks,
  45 config tests/seeds and 45 wiring lines, 750 total. The package exports and architecture documents
  describe wiring only and add no separate implementation of their referenced functions.
