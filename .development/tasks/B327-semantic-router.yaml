id: B327
title: Embedding-based auto routing
description: 'Implement the semantic auto_router marker using B014 embedding dispatch and a bounded immutable
  route index loaded from inline JSON or a configured file. Build the index once per configuration, share
  an in-progress build across callers and clear a failed build so another call can retry. Retain caller
  attribution, redaction and parent session metadata on internal embedding calls. Compare fixed embedding
  vectors and selected route names against the semantic-router version locked by the oracle.  Nonmonetary
  statistical arithmetic uses f64 only in semantic_math; put one module-level #[expect(clippy::float_arithmetic,
  reason = "pinned statistical routing arithmetic")] there, counted in this task budget. Money, prices,
  spend and budgets stay rust_decimal::Decimal, including database and wire boundaries. Reject nonfinite
  statistical input. Assert selected model/tier exactly; any opt-in tolerance is for diagnostic scores
  only, never a different selection. The accepted config keys are auto_router_config_path, auto_router_config,
  default_model, embedding_model and max_input_chars (default DEFAULT_AUTO_ROUTER_MAX_INPUT_CHARS=2000,
  no env lookup). Inline routes contain name, description, utterances and score_threshold; path configuration
  wins if both are supplied. No URL fetch is added. Configuration boundary keys introduced or consumed
  here: auto_router_config_path, auto_router_config, default_model, embedding_model, max_input_chars.
  Pinned declaration defaults: auto_router_config_path=None; auto_router_config=None; default_model=None;
  embedding_model=None. Resolve env values once in betterlite-config, never in router code. Keep the oracle
  semantic-router version from its uv lock; use local embedded vectors to assert threshold boundaries
  and selected route names. Implement the owned native service in crates/betterlite-router/src/semantic_router.rs.
  Add ProbeOperation::SemanticRouter in tools/oracle/src/router_probes/mod.rs and the corresponding B327 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/auto_router/auto_router.py:
  AutoRouter.__init__ (L46-L89), AutoRouter._load_semantic_routing_routes (L91-L99), AutoRouter._load_auto_router_routes_from_config_json
  (L101-L119), AutoRouter._build_routelayer (L121-L134), AutoRouter._clear_build_task_on_failure (L136-L139),
  AutoRouter._ensure_routelayer (L141-L158), AutoRouter._extract_text_from_messages (L161-L181), AutoRouter.async_pre_routing_hook
  (L183-L215), AutoRouter._matched_route_name (L217-L255). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports. Function coverage in litellm/router_strategy/auto_router/litellm_encoder.py: litellm_to_list
  (L16-L24), CustomDenseEncoder.__init__ (L30-L36), LiteLLMRouterEncoder.__init__ (L49-L79), LiteLLMRouterEncoder._clamp
  (L81-L95), LiteLLMRouterEncoder.__call__ (L97-L102), LiteLLMRouterEncoder.acall (L104-L109), LiteLLMRouterEncoder.encode_queries
  (L111-L120), LiteLLMRouterEncoder.encode_documents (L122-L131), LiteLLMRouterEncoder.aencode_queries
  (L133-L142), LiteLLMRouterEncoder.aencode_documents (L144-L153). Implement these behaviors through the
  typed Rust services above; synchronous facades and structural accessors reuse the same primitive instead
  of separate ports. Bound the route_index outside-byte parser to 1048576 bytes before decoding; on excess
  use its typed invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback
  path). If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001 only on its
  explicitly named score/probability pointer. Selection, tie order, counts, statuses, money and provider
  requests remain exact. Six-decimal wire signals are compared after the source rounding, without widening
  tolerance.'
