dod:
- text: Write tests named semantic_router_behaviors and semantic_router_boundaries under semantic_router::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - semantic-router-behaviors
  - semantic-router-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/semantic-router-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/semantic-router-invalid.yaml;
    the valid seed contains auto_router_config_path. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - semantic-router-boundaries
- text: Add crates/betterlite-router/fuzz/corpus/route_index/semantic-router-valid.json and crates/betterlite-router/fuzz/corpus/route_index/semantic-router-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target route_index and normal replays_the_route_index_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - semantic-router-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: semantic-router-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::semantic_router_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: semantic-router-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::semantic_router_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/semantic_router.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/semantic_router.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/semantic-router-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/semantic-router-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/semantic-router-" && grep -Fq 'auto_router_config_path' crates/betterlite-config/fuzz/corpus/config_yaml/semantic-router-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-router/fuzz/corpus/route_index/semantic-router-valid.json && test -f crates/betterlite-router/fuzz/corpus/route_index/semantic-router-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/route_index
      | grep -Fq "/semantic-router-" && test -f crates/betterlite-router/fuzz/fuzz_targets/route_index.rs && cargo
      nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_route_index_corpus)'
