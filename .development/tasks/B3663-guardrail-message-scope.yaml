dod:
  - text: Anthropic SSE chunk parsing handles str, bytes and dict items, splitting on "\n\n" and "data:" prefixes and parsing JSON payloads.
    proof: [stream-chunk-tests]
  - text: Blocked usage projection reads usage from response objects, Anthropic stream chunks and chat/Responses stream lists, with fallback to zero tokens on missing usage.
    proof: [blocked-usage-tests, oracle]
  - text: Stream item fingerprints produce deterministic JSON strings, invariant to field order and serialization of non-string values.
    proof: [fingerprint-tests]
  - text: Message slot texts preserve text-part lists and string content, merge rewrites one text per slot, and return None when slot counts mismatch.
    proof: [text-slot-tests, oracle]
  - text: Scoped message indices filter by skip flags and scan-only scope, distinguishing system/tool/other roles and preserving order.
    proof: [scoped-indices-tests]
  - text: Tool name extraction reads OpenAI flat/function names and Anthropic flat/function names from provider-specific tool shapes.
    proof: [tool-name-tests]
  - text: Merge returned tools preserves request tools by name and appends only new returned tool names, deduplicating within the returned list.
    proof: [merge-tools-tests]
  - text: Merge scoped messages restores guardrail-returned messages to their original positions, appends extras after the last scoped index and removes dropped originals.
    proof: [merge-messages-tests]
  - text: HTTPException detection and context enrichment work only when FastAPI is installed; pre-call rejection falls back to GuardrailRaisedException when FastAPI is missing.
    proof: [exception-tests, oracle]
  - text: Guardrail selection checks request metadata and team metadata, with per-guardrail flags (guardrail_name -> false) and team modification locks.
    proof: [selection-tests, oracle]
  - text: Content-to-text flattening joins text parts with blank-line separators while skipping non-text parts; is_all_text_parts gates true only for non-empty part lists; merge_rewritten_text_parts preserves first-part fields and the last cache_control breakpoint; assistant_text_from_response extracts text from chat/Anthropic/Responses response shapes.
    proof: [content-text-tests, oracle]
  - text: UnappliableRequestRewrite exception reports guardrail_name and message naming the guardrail and stating the request was rejected rather than sent unrewritten.
    proof: [rewrite-exception-tests]
  - text: Every mutant in the message-scope module is caught by a test.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: stream-chunk-tests
      why: Chunk parsing drops lines without "data:" or fails on invalid JSON.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::stream_chunk_events::/)'
    - id: blocked-usage-tests
      why: Usage projection misses fields or uses wrong fallbacks for response/stream shapes.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::blocked_usage::/)'
    - id: fingerprint-tests
      why: Fingerprints are not deterministic or vary with field order.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::fingerprint::/)'
    - id: text-slot-tests
      why: Text slot merge succeeds on mismatched counts or modifies non-text parts.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_message_scope::text_slot::/)'
    - id: scoped-indices-tests
      why: Scoped indices include out-of-scope roles or drop in-scope messages.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::scoped_indices::/)'
    - id: tool-name-tests
      why: Tool name extraction misses provider formats or returns wrong names.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::tool_names::/)'
    - id: merge-tools-tests
      why: Tool merge drops request tools or duplicates returned tool names.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::merge_tools::/)'
    - id: merge-messages-tests
      why: Message merge puts returned messages at wrong indices or does not append extras.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::merge_messages::/)'
    - id: exception-tests
      why: Exception context enrichment fails when FastAPI is absent or attaches wrong fields.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_message_scope::exception::/)'
    - id: selection-tests
      why: Guardrail selection ignores metadata, does not respect false flags or team locks.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_message_scope::selection::/)'
    - id: content-text-tests
      why: Content-to-text join logic fails, part type checking is wrong, cache_control merge drops breakpoints, or response extraction misses shapes.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_message_scope::content_text::/)'
    - id: rewrite-exception-tests
      why: UnappliableRequestRewrite exception fails to construct with guardrail_name or carries wrong message format.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::unappliable_rewrite::/)'

