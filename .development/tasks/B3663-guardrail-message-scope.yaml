deviations:
  - what: LiteLLM checks per-guardrail litellm_params.skip_system_message_in_guardrail and skip_tool_message_in_guardrail fields, falling back to the global litellm.skip_system_message_in_guardrail and skip_tool_message_in_guardrail module attributes; betterlite reads these only during unified initialization (B3680) and passes resolved flags in per-call context.
    why: Unified initialization centralizes configuration, and per-call flags avoid shared global state.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/guardrail_translation/utils.py#L194-L209
  - what: Guardrail metadata selection returns false (skip guardrail) when guardrails key is missing from request metadata; LiteLLM returns true (apply guardrail) when metadata is missing entirely.
    why: Explicit false is safer than implicit true for security, matching B3665's strict-mode default.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_helpers.py#L26-L67

out_of_scope:
  - B3661 supplies StreamingScanKey and StreamTransformSink types; this task uses them without redefining.
  - B3664 owns apply_guardrail invocation logic; scoped messages here are inputs to that function, not callers of it.
  - B3665 supplies effective skip/scan-only field getters on guardrail records; this task calls those to check effective behavior.
  - The get_attribute_or_key utility (used by assistant_text_from_response) is owned by B206 and imported here as-is.
  - FastAPI HTTPException handling requires FastAPI installation; when absent, fallback to GuardrailRaisedException owned by B206.
  - LiteLLM guardrail_name_config_map is owned elsewhere; should_proceed_based_on_metadata calls into it to look up guardrail callbacks.

pitfalls:
  - Anthropic SSE parsing treats "[DONE]" payloads as empty and skips them, not as completion markers.
  - blocked_chat_stream_usage scans the stream backwards to find the last chunk with usage (which may be omitted if stream_options.include_usage is false).
  - message_with_slot_texts returns None (not an error) when slot counts mismatch, so callers must check the return value.
  - merge_rewritten_text_parts only ever runs on all-text part lists (gated by is_all_text_parts check) and must keep the LAST declared cache_control breakpoint, not the first, since each breakpoint caches the prefix ending at that part. A merged part that loses the last breakpoint silently changes cache semantics.
  - Scoped message indices preserve the order of the original message list; a subset of 4 out of 10 messages returns indices [1, 3, 7, 8], not [0, 1, 2, 3].
  - anthropic_tool_names returns a tuple of both flat name and function.name when both are present, so a tool with two identical names appears twice in the tuple.
  - merge_returned_tools_into_request_tools uses the provided callable to extract names, so it never parses tool structure; the caller is responsible for providing the right extractor.
  - effective_skip_system_message_for_guardrail returns false (do not skip) when neither per-guardrail nor global flag is set, treating absence as permission to scan.
  - A team with metadata.guardrails.modify_guardrails = false cannot modify guardrails through the API, but the check happens at the API boundary, not at invocation time.

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
