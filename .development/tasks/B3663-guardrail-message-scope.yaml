id: B3663
title: Guardrail message scope, rewrite slots and blocked usage
description: >-
  Build shared utilities for message scoping and text-rewrite preservation across
  guardrail endpoints. Implement blocked usage projection for chat, Responses and
  Anthropic stream shapes, stream-chunk fingerprinting and skip-flag helpers.
  Preserve untouched message regions during scoped rewrites and distinguish an
  unappliable request rewrite from a delivered rewrite.

  Build Rust modules in crates/betterlite-guardrails and crates/betterlite-server:
  - StreamChunkEvents function parsing Anthropic SSE chunk events from bytes/str/dict.
  - BlockedUsage functions: blocked_response_usage (prompt/completion tokens from original
    response object or Anthropic stream chunks), blocked_responses_api_usage (ResponseAPIUsage
    variant for Responses shape), blocked_chat_stream_usage (tuple of prompt/completion tokens
    for chat completions stream), blocked_responses_stream_usage (ResponseAPIUsage for
    Responses stream).
  - StreamItemField function extracting a named field from dict/dataclass items.
  - StreamItemFingerprint function building a deterministic JSON string from a stream item.
  - StreamItemItems function extracting a sequence field from an item as a tuple.
  - TextSlotHelpers: message_slot_texts (strings from content str or text-part list),
    message_text_slot_count (count of text slots), message_with_slot_texts (rewrite slots in
    place if counts match exactly, return None on mismatch).
  - ScopedMessageIndices function returning message indices not filtered by skip flags/scan-only
    scope.
  - MessageRole function extracting role string from a message dict.
  - ToolNameExtraction: openai_tool_name (flat or function.name from OpenAI tool),
    anthropic_tool_names (tuple of flat name and function.name from Anthropic tool),
    anthropic_tool_name (first name from anthropic_tool_names).
  - MergeReturnedTools function: union of request tools and guardrail-returned tools,
    keyed by name, preserving request tools and appending only new returned tool names.
  - MergeGuardrailedMessages function: substitute guardrail-returned scoped messages back
    into the full conversation at their original positions, with extras appended and removed
    items dropped.
  - SkipFlagHelpers: effective_skip_system_message_for_guardrail (per-guardrail or global
    flag), effective_skip_tool_message_for_guardrail, filter_messages_by_skip_flags (tuple
    of filtered messages and bool indicating changes), effective_scan_only_tool_results_for_guardrail.
  - RoleOutOfScope predicate: true when role is filtered by skip flags or scan-only scope.
  - UnappliableRequestRewrite exception with guardrail_name field, reporting that a guardrail
    rewrote the request in a way the endpoint cannot apply.

  Build Rust modules in crates/betterlite-server/src/guardrail_message_scope.rs:
  - content_to_text function collapsing message content (str or list-of-parts) to plain text,
    joining text parts with blank-line separators and skipping non-text parts.
  - is_all_text_parts predicate: true when content is a non-empty part list holding only
    text parts.
  - merge_rewritten_text_parts function: flatten an all-text part list into one part carrying
    new_text, preserving the first part's fields and the last declared cache_control breakpoint.
  - assistant_text_from_response function extracting the assistant's natural-language text
    from model response across chat, Anthropic and Responses shapes.
  - is_fastapi_http_exception predicate: true when exception is HTTPException with a
    blocked status code.
  - enrich_http_exception_with_guardrail_context function: attach guardrail_name and
    event_hook to an HTTPException's detail dict if present.
  - pre_call_rejection function: construct a 400 HTTPException or GuardrailRaisedException
    with the rejection message and guardrail name.
  - can_modify_guardrails predicate: false when team metadata sets guardrails.modify_guardrails
    to false.
  - should_proceed_based_on_metadata function: check if a guardrail should be applied based
    on request metadata guardrails dict (guardrail_name -> bool, where false skips the
    guardrail).

  Every default value, literal token count, usage field fallback and empty-content path
  a downstream caller observes gets a named oracle case. Block-only rewrites distinguish
  pre-call (no original_response) from mid-stream (list of chunks) usage. Fallback to LiteLLM
  mode is implicit: when skip flags are absent, guardrails see the full message list unchanged.
  Skip system and tool message flags come from per-guardrail litellm_params (set during
  initialization in B3680) or fall back to the global litellm module attributes; betterlite
  config defaults take priority in the unified runtime.

scope:
  paths:
    - crates/betterlite-guardrails/src/guardrail_message_scope.rs
    - crates/betterlite-guardrails/src/guardrail_message_scope/**
    - crates/betterlite-server/src/guardrail_message_scope.rs
    - crates/betterlite-server/src/guardrail_message_scope/**
    - tools/oracle/cases/helpers/guardrail-message-scope/**
    - tools/oracle/fuzz/corpus/helper_case/guardrail-message-scope-*
    - tools/oracle/helpers/b3663.py
    - tools/oracle/helpers/b3663/**
    - tools/oracle/src/helpers/guardrails/b3663.rs
    - tools/oracle/src/helpers/guardrails/b3663/**
  lint_tables: false

