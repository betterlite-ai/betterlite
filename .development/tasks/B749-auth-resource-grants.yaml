id: B749
title: Search and vector-store permission checks
description: >-
  Implement search-tool and vector-store permission checks with no role-based admin bypass in these
  helpers. Missing permissions and None/empty search_tools are unrestricted; otherwise exact names
  must match. A denial is 403 key_model_access_denied, param search_tool_name, even for a team or
  project object. Missing team allows. can_user_view_search_tool runs key then team and returns False
  only for ProxyException; unrelated failures propagate. No wildcard or prefix grants are inferred.

  Managed-vector lookup returns [] before cache access for no IDs or no DB. Probe each UUID in input
  order at managed_vector_store_id:<uuid>, collecting hits first (including duplicates), then one
  B726 ManagedVectorStoresRepository query for missed vector_store_id.in with take=len(misses).
  Use B2315's bounded vector-store adapter. Project model_dump, else dict, then iterable row fallback
  when the result is not a nonempty dict; skip an empty projection. Validate, cache each row with
  B733 management TTL, then append it after all cache hits. Missing rows are omitted. Errors propagate
  and earlier cache writes remain; this does not promise results in original UUID order or a transaction.

  vector_store_access_check skips and DEBUG-logs when no DB exists. Consume an optional VectorStoreIds
  selector installed by B1062 registry composition through a port owned here; absent registry supplies
  no ordinary IDs. Independently append a nonempty string retrieval_config.vector_store_id for RAG,
  deduplicating registry IDs then RAG ID by first occurrence. No IDs DEBUG-logs and skips. For a nonnull
  key object_permission_id (including empty string), read B725 ObjectPermissionRepository fresh through
  B2315, then do the same for the team. Cached token permission contents are not authoritative here.
  Missing permission rows, None vector_stores and [] all allow. Otherwise reject the first disallowed
  ID with 401 key_vector_store_access_denied/team_vector_store_access_denied/org_vector_store_access_denied
  according to object_type, param vector_store and code 401. The orchestration calls only key/team,
  in that order; errors stop before the next query. There is no organization lookup or admin exemption.

  is_valid_fallback_model calls B004 route_request with model, messages=[{role:user, content:'Who was
  Alexander?'}], route_type=acompletion and the supplied router/user_model. It awaits routing preparation,
  not the returned provider coroutine, then returns True. Preserve route-selection failures and no
  provider execution. Test preparation with a recording collaborator, and verify no mock-provider hit.
  Database cases use POSTGRES_TEST_URL or testcontainers; no row is changed by these permissions.


  Build the production auth_resource_grants module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  get_managed_vector_store_rows_by_uuids (L4038-L4094; 50 source lines), _search_tool_names_from_object_permission
  (L5300-L5309; 10 source lines), _can_object_call_search_tool (L5312-L5348; 28 source lines), can_key_call_search_tool
  (L5351-L5374; 20 source lines), can_team_call_search_tool (L5377-L5403; 22 source lines), can_user_view_search_tool
  (L5406-L5426; 21 source lines), is_valid_fallback_model (L5429-L5451; 20 source lines), _get_rag_query_vector_store_id
  (L6612-L6622; 10 source lines), vector_store_access_check (L6625-L6688; 51 source lines), _can_object_call_vector_stores
  (L6691-L6718; 23 source lines).


  litellm.vector_store_registry is a runtime object defaulting to None, not a
  litellm_settings.vector_store_registry scalar setting. B1062 owns the top-level registry configuration
  and installs the selection service; this task accepts its typed optional handle.


  Add the auth_resource_grants operation under B856 Management::auth. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a auth-resource-grants-* seed to B171 helper_case, which already owns this decoder.


  Booted requests distinguish search-tool403 from vector-store401 and exercise a RAG retrieval ID
  even when the registry selector is absent. B732 supplies the permission service; denied requests
  must stop before provider dispatch without adding an administrator bypass.


  B860 database rows give the key and team different vector-store lists and stale cached permissions;
  use POSTGRES_TEST_URL with testcontainers fallback to prove fresh key-then-team reads.


  Only pure permission projections and repository fixtures enter the helper oracle. The orchestration
  that reads proxy_server.prisma_client and the routing probe run through HTTP/native integration,
  not a Python helper importing the booted proxy's globals.


  Resource IDs and permissions are already decoded; this task never downloads a vector-store file
  or enables the enterprise managed-file hook while checking access.


  Sizing: 255 source lines; allow 255 production, 290 tests, 85 adapters and 65 wiring,
  695 within 750. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_resource_grants::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
