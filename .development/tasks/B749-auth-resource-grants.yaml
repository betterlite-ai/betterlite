dod:
  - text: 'Search cases: absent_permission_unrestricted, empty_search_list_unrestricted,
      exact_search_name, search_no_wildcards, team_missing_allows,
      team_denial_uses_key_type, view_key_before_team, view_proxy_error_false,
      view_other_error_propagates and admin_has_no_helper_bypass.'
    proof:
      - behavior-tests
  - text: 'Lookup cases: no_db_or_ids_no_io, ordered_cache_hits_first,
      duplicate_uuid_hits_kept, batched_misses_take_count, row_projection_precedence,
      empty_projection_skipped, missing_rows_omitted, management_ttl_applied,
      lookup_failure_propagates and cache_partial_writes_survive. Native postgres_vector_rows
      verifies bound identifiers and raw relation decoding.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Vector cases: no_db_debug_skip, no_ids_debug_skip, rag_without_registry,
      invalid_rag_id_ignored, registry_then_rag_dedup, key_before_team_query,
      empty_permission_id_queries, missing_row_unrestricted, null_empty_vector_lists,
      first_vector_denial_fields and fresh_row_beats_token_copy. The routing-probe cases are
      fallback_probe_exact_payload, fallback_probe_error and fallback_probe_no_provider_call.'
    proof: [behavior-tests, stage-wiring-tests, oracle]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail -E 'test(/^(auth::)?auth_resource_grants::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_resource_grants.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-resource-grants-*")"
        && grep -rlq "auth_resource_grants" tools/oracle/fuzz/corpus/helper_case/auth-resource-grants-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_resource_grants::tests::/)
        - test(/replays_the_/)'
