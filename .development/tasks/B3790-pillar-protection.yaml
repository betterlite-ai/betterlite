id: B3790
title: Pillar protection payloads and response evidence
description: >-
  Build Pillar request/header projection, response decisions and bounded URL-encoded evidence headers. Prepare headers
  with boolean configuration from provided values, environment variables or defaults; build request payloads with
  extracted model/provider and metadata; call the /api/v1/protect endpoint and process responses including session ID
  storage, evidence truncation within the 8 KiB header budget, and error handling with fallback behavior. Preserve
  boolean precedence (explicit > environment > default), the evidence truncation algorithm that reduces evidence text
  with halving step sizes, the default allow fallback on backend errors, and header/metadata construction for response
  evidence. Do not implement the async hook methods (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook)
  or the guardrail constructor that calls get_async_httpx_client; those belong to the B108 umbrella. Do not implement
  add_guardrail_to_applied_guardrails_header; that needs a separate U3 owner for applied-guardrail header bookkeeping.
scope:
  paths:
    - crates/betterlite-guardrails/Cargo.toml
    - crates/betterlite-guardrails/src/pillar.rs
    - crates/betterlite-guardrails/src/pillar/**
    - tools/oracle/cases/helpers/pillar/**
    - tools/oracle/fuzz/corpus/helper_case/pillar-*
    - tools/oracle/helpers/b3790.py
    - tools/oracle/helpers/b3790/**
    - tools/oracle/src/helpers/guardrails/b3790.rs
    - tools/oracle/src/helpers/guardrails/b3790/**
  lint_tables: false
