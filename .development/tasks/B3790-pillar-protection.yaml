    run: >-
      cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
      -E 'test(/^pillar_protection::payload_construction_tests/)'
  - id: api-call
    why: HTTP POST, URL construction, raise_for_status call or response parsing is incorrect
    run: >-
      cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
      -E 'test(/^pillar_protection::api_call_tests/)'
  - id: response-processing
    why: Metadata storage, header construction or exception raising does not match
    run: >-
      cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
      -E 'test(/^pillar_protection::response_processing_tests/)'
  - id: error-fallback
