pitfalls:
- >-
  _truncate_evidence_payload encodes JSON on every iteration (including the empty list initial state) to check
  byte length, not character count; missing ensure_ascii=False or separators breaks comparison to 8 KiB.
- >-
  Boolean parsing accepts string/int/bool inputs and normalizes lowercase; "true" (string from env) must equal
  true (bool from config), not depend on the source type.
- >-
  _resolve_bool_config checks provided_value is not None (not falsy), so 0 or False are valid overrides to default,
  not fallthrough to environment.
- >-
  _prepare_headers stores X-LiteLLM-* context headers only when user_api_key_dict fields are truthy; missing values
  skip the header, not set empty string.
- >-
  _extract_model_and_provider calls get_llm_provider which may raise; fallback returns (model or "unknown", provider
  or "unknown"), not the raw custom_llm_provider if both provider and custom_llm_provider are None.
- >-
  _process_pillar_response gets metadata_field from get_metadata_variable_name_from_kwargs (B206), which may not be
  "metadata"; the function ensures both the resolved field and "metadata" alias exist in original_data.
- >-
  _process_pillar_response stores pillar_session_id in metadata for reuse in next call, and pillar_session_id_response
  for the response headers; response header uses the response version, not the persisted one.
- >-
  _call_pillar_api calls raise_for_status() before json() to detect HTTP errors; httpx raises HTTPException on non-2xx
  status before returning a response body.
- >-
  _handle_api_error is not called for HTTPException raised by _process_pillar_response (blocked detection); the try/except
  in run_pillar_guardrail re-raises isinstance(e, HTTPException) without fallback.
- >-
  Fallback behavior: transient API errors (timeout, connection, non-200 status) trigger fallback; blocked content triggers
  exception immediately and does not consult fallback_on_error.
out_of_scope:
- >-
  `get_config_model` and `get_supported_event_hooks` static/class methods: B108 (umbrella) covers guardrail lifecycle
  and hook registration.
- >-
  `async_pre_call_hook`, `async_moderation_hook`, `async_post_call_success_hook`: guardrail hook implementations that
  call run_pillar_guardrail; owned by umbrella B108.
- >-
  `PillarGuardrail.__init__` and HTTP client acquisition via `get_async_httpx_client`; owned by umbrella B108.
- >-
  `add_guardrail_to_applied_guardrails_header`: applied-guardrail header bookkeeping; owned by U3.
- >-
  `should_run_guardrail`: guardrail framework method; owned by framework task (U1).
deviations:
- what: Transient error logging uses the framework's logger, not LiteLLM's verbose_proxy_logger
  why: betterlite logging is centralized through B189 callback registration
- what: User context headers (X-LiteLLM-*) omit values from user_api_key_dict.litellm_params_metadata to match Pillar's
    security model without exposing extra metadata
  why: LiteLLM's implementation checks "metadata excluded for security"; betterlite matches that behavior
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/pillar/pillar.py#L562
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
