- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/pillar/pillar.py#L502-L838
  why: _handle_api_error, _prepare_headers, _set_bool_header, _resolve_bool_config, _parse_bool_value,
    _extract_model_and_provider, _prepare_payload, _call_pillar_api, _process_pillar_response, _raise_pillar_detection_exception;
    configuration precedence, boolean parsing, provider detection, error fallback, request construction, API calls,
    response handling including session/evidence metadata.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/pillar/pillar.py#L48-L73
  why: _PillarProtectResponse TypedDict, _PillarProtectHTTPResponse and _PillarProtectHTTPClient protocol definitions
    for response type contracts.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/pillar/pillar.py#L1-L48
  why: Import, constant and exception declarations; TRUSTED_PILLAR_RESPONSE_HEADERS_METADATA_KEY usage.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/pillar.py#L10-L57
  why: PillarGuardrailConfigModel, PillarGuardrailConfigModelOptionalParams with all settings (api_key, api_base,
    on_flagged_action default monitor, async_mode, persist_session, include_scanners, include_evidence,
    fallback_on_error default allow, timeout default 5.0); ui_friendly_name returns "Pillar Guardrail".
dod:
- text: >-
    _encode_json_for_header uses ensure_ascii=False, separators=(",", ":") and quote with safe="" to match LiteLLM's
    output exactly.
  proof:
  - encode-behavior
- text: >-
    _truncate_evidence_payload truncates list and dict evidence within max_bytes using the halving step algorithm,
    preserves non-list evidence encoding, and returns (truncated_evidence, encoded_value, was_truncated).
  proof:
  - truncate-behavior
- text: >-
    _resolve_bool_config respects precedence (explicit > environment > default), _parse_bool_value accepts "true",
    "1", "yes", "y", "on" as true and "false", "0", "no", "n", "off" as false, and invalid strings raise ValueError
    with "Unrecognised boolean value".
  proof:
  - bool-parsing
- text: >-
    _prepare_headers adds Authorization, Content-Type, plr_* conditional headers, and X-LiteLLM-* context headers
    only when values are present in user_api_key_dict.
  proof:
  - header-construction
- text: >-
    _extract_model_and_provider calls get_llm_provider from B174 with the request model, custom_llm_provider, api_base
    and api_key, returns (clean_model, provider), and falls back to (model, custom_llm_provider or provider or "unknown")
    on exception.
  proof:
  - model-extraction
- text: >-
    _prepare_payload builds dict with messages, tools, metadata source/version, optional user_id, optional session_id
    from metadata.pillar_session_id, and extracted model/provider, matching LiteLLM's /api/v1/protect contract.
  proof:
  - payload-construction
- text: >-
    _call_pillar_api POSTs to {api_base}/api/v1/protect with headers, payload and timeout, calls raise_for_status(),
    and returns response.json().
  proof:
  - api-call
- text: >-
    _process_pillar_response stores flagged, scanners (when include_scanners), evidence (when include_evidence) and
    session_id into metadata or metadata alias, builds response headers with build_pillar_response_headers, and raises
    HTTPException(400) on flagged when on_flagged_action is "block".
  proof:
  - response-processing
- text: >-
    _handle_api_error returns data unchanged when fallback_on_error is "allow", and raises HTTPException(503) with
    error detail when "block".
  proof:
  - error-fallback
- text: build_pillar_response_headers encodes scanners/evidence into x-pillar-* headers, applies _truncate_evidence_payload
    to evidence with MAX_PILLAR_HEADER_VALUE_BYTES (8 KiB), and sets pillar_response_headers and TRUSTED_PILLAR_RESPONSE_HEADERS_METADATA_KEY
    in metadata.
  proof:
  - response-headers
- text: Every oracle case exactly reproduces LiteLLM's request/response/header behavior for the scenario listed.
  proof:
  - oracle-cases
