dod:
  - text: >-
      The predict handler treats a body as audio when it has predictions with a truthy audioContent or bytesBase64Encoded and the model has a Lyria
      cost, prices it as that cost times the count without calling the cost trait, and returns the parsed body as the standard pass-through response.
    proof: [audio-tests]
  - text: >-
      A predictions list with no counted entry, or a model without a Lyria cost, does not take the audio branch and falls to the image, multimodal or text branches.
    proof: [audio-tests, predict-tests]
  - text: >-
      An image prediction body builds the image response through B1349, sets the logging object's call_type to "passthrough-image-generation", and
      is priced through the cost trait with provider "vertex_ai" and the URL's vertex_location.
    proof: [predict-tests, predict-oracle]
  - text: >-
      A body with textEmbedding, imageEmbedding or videoEmbeddings in any prediction entry goes to the multimodal step, and any other body goes
      to the text embedding step, whose response gets the URL model.
    proof: [multimodal-tests, predict-oracle]
  - text: >-
      The predict handler writes model, custom_llm_provider ("vertex_ai") and response_cost to the kwargs and to the logging object's
      model_call_details, and sets logging_obj.model and logging_obj.custom_llm_provider.
    proof: [predict-tests, predict-oracle]
  - text: >-
      embedContent builds a single embedding response with the text of content.parts joined by a space, batchEmbedContents builds one from the text of
      every part of every request, and an absent request body gives an empty input.
    proof: [embed-tests, embed-oracle]
  - text: >-
      The embedding handler takes custom_llm_provider from the URL host ("gemini" for generativelanguage.googleapis.com, else "vertex_ai"), prices with
      it and writes it, the model, response_cost and the logging object fields.
    proof: [embed-tests, embed-oracle]
  - text: >-
      A cost, decode or transform failure comes back as Err and is not turned into a zero cost.
    proof: [predict-tests, embed-tests]
  - text: The strict Python oracle adapter lints clean and its cases replay.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: audio-tests
      why: the audio test, the entry count, the truthiness rule or the Lyria price is wrong, or the cost trait is called on the audio path
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_predict_logging::tests::audio_/)'
    - id: predict-tests
      why: the image branch, the call_type write, the text branch, the model or provider writes or the error path of the predict handler are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_predict_logging::tests::predict_/)'
    - id: multimodal-tests
      why: the multimodal detection looks at truthiness, skips the wrong entries or sends a body to the wrong embedding step
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_predict_logging::tests::multimodal_/)'
    - id: embed-tests
      why: the embed input text, the batch switch, the host provider, the model and cost writes or the error path of the embedding handler are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_predict_logging::tests::embed_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3639)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3639 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3639/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/passthrough_predict_logging-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: predict-oracle
      why: newly added predict helper cases are absent, do not use the b3639 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/vertex/passthrough-predict-logging)" &&
        grep -rlE '^[[:space:]]+b3639:' tools/oracle/cases/vertex/passthrough-predict-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/vertex/passthrough-predict-logging
    - id: embed-oracle
      why: newly added embed helper cases are absent or betterlite and LiteLLM disagree on them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/vertex/passthrough-predict-logging)" &&
        grep -rlE 'operation": "embed_' tools/oracle/cases/vertex/passthrough-predict-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/vertex/passthrough-predict-logging
oracle_cases:
  - tools/oracle/cases/vertex/passthrough-predict-logging/predict-text-embedding.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/predict-multimodal-embedding.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/predict-image-generation.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/predict-lyria-audio.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/predict-audio-model-without-price.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/embed-single-content.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/embed-batch-requests.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/embed-gemini-host.yaml
  - tools/oracle/cases/vertex/passthrough-predict-logging/embed-no-request-body.yaml
deviations:
  - what: Both handlers take the buffered response bytes, the status and the headers, where LiteLLM takes the httpx response object.
    why: Rust has no httpx response; the handlers read the JSON body, and the multimodal step reads the status and headers.
  - what: A cost, decode or transform failure is returned as Err and reaches the caller, which logs it and drops the dispatch.
    why: Rust has no exceptions; this keeps LiteLLM's rule that a failure rises and nothing is dispatched.
out_of_scope:
  - "B3642 owns vertex_passthrough_handler, its route tests (embedContent and batchEmbedContents before predict), the vertex_location write to optional_params and the call into these two methods."
  - "B3638 owns extract_model_from_url, _get_custom_llm_provider_from_url and the generateContent payload factory. This task calls the first two and does not use the factory."
  - "B3640 owns the Gemini handler and Vertex stream collection. B3641 owns batch prediction jobs."
  - "B1340, B1342, B1343 and B1349 own the embedding and image response steps this task calls. B1306 owns the Lyria catalog and B1304 get_vertex_location_from_url."
  - "_handle_audio_predict_response's rawPredict and search siblings in vertex_passthrough_handler belong to B3642."
pitfalls:
  - "The audio test needs both a counted prediction and a Lyria price; a model without a price with audioContent present falls through to the text embedding step."
  - "A prediction counts as audio on a truthy audioContent or bytesBase64Encoded, so an empty string or null does not count. The same bytesBase64Encoded key also marks an image body, so the audio test runs first."
  - "The audio path prices as price times count and never calls the cost trait; the other two paths always call it."
  - "is_image_generation_response reads predictions[0] only, so a body with an empty predictions list takes B1349's error path and not the text embedding step."
  - "The call_type write to \"passthrough-image-generation\" happens only on the image branch, and only embedding results get the model reset."
  - "The predict handler writes the literal \"vertex_ai\" as provider, but the embedContent handler reads it from the host, so a generativelanguage.googleapis.com embedContent URL is priced as \"gemini\"."
  - "Batch is decided by the substring \"batchEmbedContents\" in the route, and batch input text is the parts of every request joined by one space, with a part that has no text giving an empty string."
  - "The multimodal test is key presence, so {\"textEmbedding\": null} still counts as multimodal."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
