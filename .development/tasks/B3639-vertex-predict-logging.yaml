    why: _handle_audio_predict_response, _is_audio_predict_response and _get_audio_prediction_count with the truthiness rule and the Lyria cost.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_passthrough_logging_handler.py#L481-L559
