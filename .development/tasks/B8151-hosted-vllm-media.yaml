dod:
  - text: Rerank params, request, URL, headers and reply transform match, including the truncation validation and error class.
    proof: [hosted-vllm-media-tests, hosted-vllm-media-cases]
  - text: Responses, image edit and transcription URLs, headers and supported params match LiteLLM.
    proof: [hosted-vllm-media-tests, hosted-vllm-media-cases]
  - text: Video create requests build the same form fields, and every unsafe media URL is rejected with the same message.
    proof: [hosted-vllm-media-tests, hosted-vllm-media-cases]
  - text: The decisions key resolution matches.
    proof: [hosted-vllm-media-tests, hosted-vllm-media-cases]
  - text: The reply decoder rejects malformed bodies without panicking and its corpus replays.
    proof: [hosted-vllm-media-corpus]
  - text: New helper cases for these functions exist.
    proof: [hosted-vllm-media-cases]
checks:
  optional: [mutants]
  commands:
    - id: hosted-vllm-media-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^hosted_vllm_media::/)'
      why: Without this provider code there are no such tests, so the check fails on the base branch.
    - id: hosted-vllm-media-corpus
      run: test -f crates/betterlite-openai/fuzz/fuzz_targets/hosted_vllm_rerank_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/hosted_vllm_rerank_reply)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_hosted_vllm_rerank_reply_corpus)'
      why: Bytes come from outside and need a fuzz target with a replayed corpus.
    - id: hosted-vllm-media-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/hosted-vllm-media)"
      why: Without new case files the oracle proof passes with nothing compared.
oracle_cases:
