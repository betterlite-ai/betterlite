  - tools/oracle/cases/helpers/hosted-vllm-media/decisions-key.yaml
deviations:
  []
out_of_scope:
  - "B3332 selects the video provider; B3513 and B3514 dispatch decisions calls; B1079 handles the hosted_vllm rerank credentials. This task builds the configs they call."
  - "B6040 and B7952 own the HostedVLLMRerankTruncationParams types."
  - "B3331 owns the BaseVideoConfig contract; this task builds only the hosted_vllm side."
pitfalls:
  - "The oracle helper for this task is pre-registered as b8151 by the skeleton. Write its Rust and Python files as the skeleton leaves them; the registry files are not this task's to edit."
  - "The truncation params are validated before they reach the body; a bad value is an error, not a dropped key."
  - "The video config rejects private and local URLs in every media field; read all of L88-L117 before writing the checks."
  - "The decisions config reads the key from the argument first, then the environment through betterlite-config."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
