  - tools/oracle/cases/helpers/hosted-vllm-media/image-edit-url.yaml
  - tools/oracle/cases/helpers/hosted-vllm-media/transcription-request.yaml
  - tools/oracle/cases/helpers/hosted-vllm-media/video-form.yaml
