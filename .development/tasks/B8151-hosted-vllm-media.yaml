id: B8151
title: hosted_vllm rerank, responses, image edit, transcription, video and decisions configs
description: >-
  Build the five non-chat hosted_vllm configs in betterlite-openai as crates/betterlite-openai/src/hosted_vllm_media.rs and its folder, one file per config. All are pure transforms. Each reuses the OpenAI config named in its source and changes only what the hosted_vllm file overrides.

  Rerank: HostedVLLMRerankError, validated_truncation_params, HostedVLLMRerankConfig with get_complete_url, get_supported_cohere_rerank_params, map_cohere_rerank_params, validate_environment, transform_rerank_request, transform_rerank_response, get_error_class and _transform_response. The rerank reply comes from the network, so it gets a typed decoder and a fuzz target.

  Responses: HostedVLLMResponsesAPIConfig (custom_llm_provider, validate_environment, get_complete_url, supports_native_websocket) over the OpenAI Responses config of B506.

  Image edit: HostedVLLMImageEditConfig (get_supported_openai_params, validate_environment, get_complete_url) over B512.

  Transcription: HostedVLLMAudioTranscriptionError and HostedVLLMAudioTranscriptionConfig (get_complete_url, transform_audio_transcription_request) over B515.

  Video: HostedVLLMVideoConfig with get_supported_openai_params, map_openai_params, validate_environment, get_complete_url and transform_video_create_request, plus the form helpers _serialize_form_value, _maybe_json, _reject_unsafe_media_url, _reject_unsafe_urls_in_item, _reject_unsafe_media_urls, _form_value and _input_reference_file. The unsafe URL rejection is a security rule: keep every rejected case.

  Decisions: HostedVLLMDecisionsConfig and resolve_api_key over the decisions records of B3510.

  The __init__.py files of image_edit and videos only export the config and need no code beyond that.

  Where the source and this text differ, the source at the pinned commit wins.
