    - crates/betterlite-openai/fuzz/fuzz_targets/hosted_vllm_rerank_reply.rs
    - crates/betterlite-openai/fuzz/corpus/hosted_vllm_rerank_reply/**
    - Cargo.lock
    - tools/oracle/cases/helpers/hosted-vllm-media/**
    - tools/oracle/helpers/b8151.py
    - tools/oracle/helpers/b8151/**
    - tools/oracle/src/helpers/provider/b8151.rs
    - tools/oracle/src/helpers/provider/b8151/**
