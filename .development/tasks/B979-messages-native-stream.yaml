id: B979
title: Relay native Messages with bounded backpressure and detached billing
description: >-
  Own messages/streaming_iterator.py task sets L29-L30, drain-slot/queue helpers L167-L186 and the complete
  async_sse_wrapper,_enqueue_for_client,_pump_upstream_to_queue,_handle_pump_upstream_error at
  L468-L525,L579-L697. B2436 owns logging,formatting,constructor and teardown callbacks; B978 classifies raw
  terminal chunks and closes streams. B102 owns schedule_stream_failure_logging and has no task file: inject
  that explicit seam with request body,ANTHROPIC endpoint,original exception and partial raw bytes. The owner
  remains a dependency, and its missing specification is an architect note, not an invented billing subsystem.

  Resolve ANTHROPIC_MESSAGES_STREAM_RELAY_QUEUE_MAXSIZE (default1024) and
  ANTHROPIC_MESSAGES_MAX_DETACHED_STREAM_DRAINS (default100) through B002. The queue counts chunks, not bytes;
  zero or negative queue sizes are rejected at startup as the documented bounded-input deviation. Zero or
  negative drain limits disable detached draining, matching the source comparison. Parse integer text with
  Python-compatible whitespace,plus and underscores; invalid text fails configuration. Config loader tests
  must prove both keys load and influence execution; reuse B002's decoder/seeds.

  Keep one process-wide set of live pumps and another of detached drains, releasing entries on task completion.
  Apply B1087's1MiB read bound plus a16MiB/65536-chunk checked aggregate bound to retained billing bytes. On an
  aggregate overflow close upstream, preserve bounded partial failure logging and surface the deviation below;
  never grow collected_chunks indefinitely. B009 supplies the upstream deadline; no new timeout env var exists.
  Add only SdkHttpCall::MessagesNativeStream through B2401, using real HTTP streams, explicit provider/client
  rendezvous barriers and one shared process for concurrent-drain cases. Compare output and invariants, not
  scheduler timestamps or two runtimes' incidental interleaving. Own 188 nonblank/non-comment physical
  lines including the env constants after B2436; budget 240 implementation,170 tests,180 fixtures,100 adapters,70 config and30 wiring,
  790 total. Tests use api::messages_native_stream in core and config. No new byte parser is introduced.
