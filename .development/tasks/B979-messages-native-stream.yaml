id: B979
title: Messages native stream
description: >-
  Relay native Messages SSE with the source bounded queue/drain behavior and B012 logging. Model upstream pumping,
  cancellation, terminal failure and final billing as owned tasks; preserve native pings and source queue/timeout
  defaults, and expose the iterator seam B312 wraps later. Resolve ANTHROPIC_MESSAGES_STREAM_RELAY_QUEUE_MAXSIZE=1024
  and ANTHROPIC_MESSAGES_MAX_DETACHED_STREAM_DRAINS=100 in config; zero detached drains disables draining, and source
  integer parse failures remain configuration errors.


  Implement crates/betterlite-core/src/api/messages_native_stream.rs. Use MessagesNativeStreamInput and MessagesNativeStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions slow_client_backpressure, disconnect_drain_limit, terminal_logging_once,
  upstream_incomplete, native_ping_forwarded under api::messages_native_stream::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.ANTHROPIC_MESSAGES_STREAM_RELAY_QUEUE_MAXSIZE
  defaults to '1024'; env.ANTHROPIC_MESSAGES_MAX_DETACHED_STREAM_DRAINS defaults to '100'. No environment reads
  occur outside betterlite-config. Test api::messages_native_stream::tests::loads_settings uses the production Config
  loader and an injected environment map, with a named rstest case for every key above, explicit override, unset/default
  and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key report;
  a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder rather
  than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesNativeStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_native_stream: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: _try_claim_detached_drain_slot
  (L167-L181); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: _exception_left_unconsumed (L184-L186);
  litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator.__init__
  (L388-L396); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._handle_streaming_logging
  (L398-L429); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator.get_async_streaming_response_iterator
  (L431-L451); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._convert_chunk_to_sse_format
  (L453-L466); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator.async_sse_wrapper
  (L468-L525); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._dispatch_pending_deferred_logging
  (L527-L542); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._bill_collected_chunks
  (L544-L560); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._abort_upstream
  (L563-L576); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._enqueue_for_client
  (L579-L608); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._pump_upstream_to_queue
  (L610-L667); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._handle_pump_upstream_error
  (L669-L697); litellm/llms/anthropic/pass_through/messages/streaming_iterator.py: BaseAnthropicMessagesStreamingIterator._fire_detached_failure_hook
  (L699-L710). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 234 owned nonblank/non-comment/non-docstring Python lines (303 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 254 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 540 total within the 540-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B003 (HTTP server, health routes and
  master key auth), B012 (Logging pipeline, callback registry and redaction), B171 (Direct helper oracle and URL
  path encoding), B978 (Messages sse events), B1087 (Api boundaries). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
