deviations:
- what: Queue env values0 or less stop startup with "ANTHROPIC_MESSAGES_STREAM_RELAY_QUEUE_MAXSIZE must be greater than 0"; LiteLLM makes those queues unbounded.
  why: The bounded-inputs rule forbids an unlimited relay; positive defaults and zero-drain behavior stay compatible.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L503-L505
- what: Retained encoded billing output over16MiB or65536 chunks fails with502/bad_gateway/stream/stream_buffer_too_large; a started Anthropic stream emits api_error "Messages stream exceeded its retained-output limit" and closes.
  why: A bounded queue does not bound the separate collected_chunks list; B1087 supplies finite byte/item limits.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L632-L643
out_of_scope:
- B2436 owns complete logging/constructor/format/teardown helpers at L388-L466,L527-L576,L699-L710 and B102/B191 delegation.
- B978 owns L33-L164,L189-L379 raw event parsing/rendering/response view. Its1MiB raw-read bound also applies before relay retention.
- B102 owns failure billing internals and B191 rooted logging dispatch; B009 owns transport timeout/cancellation and B081 the HTTP error boundary.
pitfalls:
- Queue capacity counts chunks; collected billing bytes need a separate aggregate bound even while the client keeps up.
- The detached cap is shared across all live streams, not reset for each request or provider.
- Logging must be parked before the end sentinel becomes observable, or disconnect can lose the spend callback.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
