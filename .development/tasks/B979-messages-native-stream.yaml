references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L29-L30
  why: Pumps and detached drains are rooted in process-wide sets shared across streams.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L167-L186
  why: Slot claiming and identity-based exception consumption, including draining all remaining queue items.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L468-L525
  why: Client relay creates a rooted pump and signals detach without cancelling the pump.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L579-L697
  why: Complete enqueue race, pump loop and connected-versus-detached failure arbitration.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L618-L632
  why: Literal env names/defaults and zero-drain semantics; queue zero is unbounded in asyncio and needs a deviation.
dod:
- text: >-
    loads_relay_settings loads unset as1024/100, explicit " 2 "/"+1" as2/1 and "1_000" as1000. Noninteger
    "bad" fails startup. Drain0/-1 allows no detached drains; queue0/-1 fails with diagnostic
    "ANTHROPIC_MESSAGES_STREAM_RELAY_QUEUE_MAXSIZE must be greater than 0" and no HTTP listener. Native deviation
    tests contrast LiteLLM's unbounded queue0 behavior without running an unbounded load test.
  proof: [behavior-tests, config-tests, config-corpus]
- text: >-
    connected_backpressure uses queue2 and pauses client consumption at a rendezvous. At most two encoded chunks
    are queued; a third enqueue waits while the pump stops further upstream pulls. Resuming drains them in order.
    Disconnect while enqueue is blocked resolves without waiting for space; already-detached enqueue returns
    false immediately. If put wins the race, it returns true even when detach is also ready. Pending competing
    waiters are cancelled. No assertions depend on OS socket-buffer size or wall-clock sleeps.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    global_detached_drain_cap starts two real streams in one process with cap1. Detach A and hold its provider
    open so it occupies the slot; detach B and deliver its next chunk. B bills collected partial bytes once,
    closes upstream and warns "async_sse_wrapper: detached-drain cap (1) reached; billing <n> partial chunks and aborting the upstream stream to stop provider billing".
    A drains without enqueueing client bytes, bills terminal usage and releases its slot; a later stream can claim
    it. Cap0 takes the partial-bill/abort path for every disconnect. Claim happens only after the next chunk is
    read and collected; a stream ending immediately after disconnect bills without requiring a slot.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    normal_terminal_and_incomplete streams forward ping/raw bytes unchanged and encode dicts through B2436,
    including type-absent event:message. Stamp completion_start_time on the first upstream chunk, including a
    ping, once. message_stop or a dict error body suppresses synthetic error. EOF without either emits B978's
    exact incomplete api_error event before end sentinel; this synthetic event is not added to collected billing
    bytes. Bill/park logging before enqueueing the sentinel; only consuming the sentinel marks reached_end=true.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    teardown_dispatches_parked_logging lets the pump park normal logging while the client still has queued bytes,
    then disconnects before consuming sentinel. Relay finally signals detach and dispatches the parked callback
    via B2436 exactly once. If enqueueing sentinel instead loses to detach, the pump performs that dispatch.
    Normal sentinel consumption does not dispatch it here; the proxy owns normal deferred completion. A detached
    completed pump bills with stream_teardown=true and never synthesizes an incomplete event for the departed client.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    upstream_exception_arbitration makes a provider raise status429/message=busy after two chunks. B102 receives
    the original exception and both raw chunks for failure logging; connected relay rethrows that same exception,
    not the incomplete-stream api_error. After relay detach, an exception consumed from the queue suppresses the
    detached failure hook. Already-detached or queued-but-unconsumed exception invokes it once. The queue scan
    removes all remaining items and matches exception identity, not equal text. Missing detached hook is harmless;
    its failure warning remains B2436's. No success billing follows this failed pump.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    relay_retained_bytes_are_bounded accepts aggregate16777216 bytes and65536 chunks, rejects the first excess
    without appending it, closes upstream and records partial failure once. SDK failure is status502,
    type=bad_gateway,param=stream,code=stream_buffer_too_large,message="Messages stream exceeded its retained-output limit".
    If the HTTP stream has started, the caller emits event:error with type=api_error and that message, no param/code
    in the Anthropic envelope and no message_stop. These are native-only deviation cases; ordinary-size HTTP
    fixtures remain differential equality cases. Live task sets return to their prior sizes after every exit.
  proof: [behavior-tests]
- text: HTTP cases and config/SDK seeds are new; slow-client and disconnect behavior is never compared as helper scheduling traces.
  proof: [new-cases, sdk-corpus, oracle, python-adapter]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: relay state, resource bounds or process-wide drain behavior is absent
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api|sections)::messages_native_stream::/)'
  - id: config-tests
    why: relay env settings have no loader test that changes runtime limits
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::messages_native_stream::tests::loads_relay_settings/)'
  - id: config-corpus
    why: no new relay settings reach the production config decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/messages-native-stream-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: python-adapter
    why: concurrent HTTP relay comparison has no checked pinned driver
    run: test -f tools/oracle/sdk_http/messages_native_stream.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: relay scenarios cannot be decoded by sdk_http
    run: grep -qE '^[[:space:]]+messages_native_stream:' tools/oracle/fuzz/corpus/sdk_http_case/messages-native-stream-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: no new live-relay provider cases were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/messages-native-stream)"
oracle_cases:
- tools/oracle/cases/sdk-http/messages-native-stream/connected-backpressure.yaml
- tools/oracle/cases/sdk-http/messages-native-stream/global-detached-drain-cap.yaml
- tools/oracle/cases/sdk-http/messages-native-stream/normal-terminal-and-incomplete.yaml
- tools/oracle/cases/sdk-http/messages-native-stream/teardown-dispatches-parked-logging.yaml
