id: B2321
title: Current-spend verification and authoritative floors
description: >-
  Move proxy_server.py SPEND_DB_FLOOR_CACHE_TTL_SECONDS and helpers L2771-L2912, L2939-L3042 into
  betterlite-auth::current_spend, below the auth budget tasks that call them. Own get_current_spend,
  _fail_closed_budget_enforcement, _raise_budget_unverifiable, _repair_stale_spend_counter,
  _floor_spend_from_db, _authoritative_floor_spend, read_spend_counter_cache_value and
  _read_spend_counter_estimate. Inject cache/repositories/settings; B2322 supplies authoritative reads.

  Read a B2316 active batch first; any answer is returned unchanged. Otherwise Redis hit or clean
  miss returns (float(value) or None,true), and a clean miss never checks local cache. Redis read or
  float conversion error DEBUG-logs and falls back to local value with verified=false. Local conversion
  errors propagate. A cache value wins; absent value invokes B2322 coalesced reseed, nonnull result is
  verified=true; otherwise caller fallback is unverified. fallback_authoritative defaults false and
  explicitly sets verified=true. max_budget and window descriptors default None.

  Return immediately if max_budget=None or current>=max_budget, before strict verification. Otherwise
  recheck a floor only when fallback>current, window_start exists, or general_settings.
  fail_closed_budget_enforcement is exactly true (default absent/false). A nonnull floor marks verified;
  only floor>current repairs and returns it. A missing floor with fallback>current returns fallback
  immediately, even in strict mode. Otherwise unverified strict mode WARNs with the counter and raises
  HTTP503 detail.error Budget enforcement unavailable: current spend could not be verified against
  Redis or the database, and fail_closed_budget_enforcement is enabled, so the request was rejected
  to avoid exceeding the configured budget. Retry shortly. Other paths return current. B757 maps
  that auth error to503 auth_error with string None param; no retry or budget-exceeded substitution.

  Floor cache is process-local spend_db_floor:<counter>, TTL exactly5 seconds; nonnull hits convert to
  float. For spend:end_user: query B2322 end_user_from_db and return directly, without a window fallback.
  Otherwise try primary from_db, then window_from_db only with nonnull type/ID/start. Missing DB floor
  is never negatively cached. After the awaited read recheck the marker before writing, so a concurrent
  committed reset marker overrides stale pre-reset spend. No singleflight is added to this floor cache.

  Repair first reads local cache: raise it only if absent, less than DB spend or unparseable by type/value
  conversion; never lower it. With Redis, forget the batch entry before atomic SET MAX. Redis repair
  error DEBUG-logs with traceback and returns without undoing the local repair. Nonnull repair result
  is recorded in B2316; absent result leaves the batch invalidated. Return the authoritative floor even
  if Redis could not be repaired. No database write, reservation or spend decrement occurs here.

  B002 loader tests strict_default_false, strict_true_consumer, false_and_absent_preserve_fallback and
  invalid_bool_rejected consume the exact nested key and new config_yaml seed. B860 real Postgres tests
  use POSTGRES_TEST_URL or testcontainers, including a reset racing a floor read. B001 HTTP cases on a
  normal protected inference route exercise strict503 through production B732 service installation;
  helper oracle calls only source read helpers with injected globals, never the route. Files stay
  below 300 lines. The 157 nonblank non-comment lines excluding docstrings allow 210 production,
  290 tests, 65 adapters, 60 config and 100 server wiring, 725 within 775. Cache decoders belong to
  B733; no new byte boundary.
