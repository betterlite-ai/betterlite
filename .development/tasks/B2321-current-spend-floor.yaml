references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2771-L2912
    why: Actual strict setting read, early returns,503 and ordered monotonic repair.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2939-L3042
    why: Floor routing, reset race, batch/Redis precedence and fallback verification.
dod:
  - text: 'Named cases: batch_answer_wins, redis_clean_miss_never_local,
      redis_parse_error_debug_local_unverified, local_parse_error_propagates,
      reseed_zero_verified_or_fallback_unverified, explicit_authoritative_fallback,
      no_ceiling_or_at_ceiling_returns_before_strict, floor_trigger_truth_table,
      floor_lower_only_marks_verified, floor_higher_repairs_and_returns,
      missing_floor_higher_fallback_bypasses_strict, strict_unverified_warning503_all_fields,
      floor_key_ttl5_no_negative_cache, enduser_no_window_fallback,
      primary_then_complete_window_descriptors, concurrent_reset_marker_wins,
      local_repair_never_lowers, batch_forget_before_redis_setmax,
      redis_repair_failure_keeps_local_and_returns_floor, nonnull_repair_records_batch,
      production_service_and_http503.'
    proof: [behavior-tests, oracle, helper-python]
  - text: The strict setting and helper operation each have new production-decoder seeds.
    proof: [config-tests, config-corpus, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Spend precedence, strict failure or repair ordering differs from the pin.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail -E 'test(/current_spend::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: Strict budget verification is ignored or enabled by an invented default.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^current_spend::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: No new strict-setting seed exists or loader replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/current-spend-*")" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: The independent source helper adapter is absent or invalid.
      run: test -f tools/oracle/helpers/current_spend.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The helper variant has no new shared parser seed.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/current-spend-*")" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/current-spend/cache-precedence-and-floor.yaml
  - tools/oracle/cases/helpers/current-spend/strict-early-returns.yaml
  - tools/oracle/cases/helpers/current-spend/reset-race-and-repair-effects.yaml
  - tools/oracle/cases/auth/current-spend/strict-unverified503.yaml
deviations: []
out_of_scope:
  - B124 retains other proxy_server.py functions, including reseed_spend_counter_from_db L2915-L2936.
  - B2322 owns database reseeds; B2316 batch state; B126 SET MAX; B733 cache decoding.
pitfalls:
  - 'The oracle helper for this task is pre-registered as current_spend in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/current_spend.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/current_spend.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Strict mode still returns a higher caller fallback when no authoritative floor is available.
  - A floor read racing a reset must recheck the marker before storing its old value.
budget:
  max_changed_lines: 775
  max_new_expects: 0
review_level: security
