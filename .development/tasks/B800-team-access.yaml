id: B800
title: Team roles and member management permissions
description: >-
  Implement TeamAccess and TeamMemberPermissions below management endpoints. TEAM_ADMIN_ONLY contains
  proxy_admin/team_admin; TEAM_OR_ORG_ADMIN additionally contains org_admin. allows checks an allowed
  proxy admin first, then a roster admin, and only then the allowed organization role. strongest_role
  instead checks proxy, organization, then team; a caller holding both organization and team roles
  must retain unrestricted organization edits. Missing/empty caller ID or organization ID skips the
  organization lookup. is_team_admin requires a nonnull matching user_id and role admin; it does not
  match email or confer roster rights on a service account. team_access_denied is HTTP 403 with
  You do not have access to this team; no ProxyException type or param is supplied by that helper.

  OrgRoles and get_team_access are native constructor boundaries: inject the owned OrgRoles contract,
  never call the later B790 user-management service from this leaf. Its production read implementation
  uses B736.get_user_object with user_id_upsert=false and checks organization_memberships for exact
  organization_id and role org_admin, preserving lookup errors. This is the PrismaOrgRoles behavior
  consumed by the source factory; B790 can reuse this lower-level implementation. No new user row is
  created during authorization. B737 supplies get_team_object; B882 supplies check_route_access;
  B867 supplies KeyManagementRoutes and LiteLLMRoutes.key_management_routes.

  Explicit list permissions, even [], become a deduplicated set plus /key/info and /key/health.
  None or a non-list falls back to exactly those baseline permissions. An unknown list element
  fails enum conversion; it is not ignored. Compare set contents, since Python set order is unstable.
  default_team_member_permissions returns baseline strings; get_all_available_team_member_permissions
  returns the route group in its existing order. A missing member role returns false, admin returns
  true without route matching, and a user role invokes B882. A denied user raises 401
  team_member_permission_error with param equal to the requested route and code "401"; a nonmember
  yields the same type/status/param from can_team_member_execute_key_management_endpoint. That wrapper
  bypasses proxy admins and keys with team_id=None, otherwise forces check_db_only=true.

  _get_user_in_team returns the FIRST matching nonnull user ID, or None for an absent caller. A team
  service account with matching team_id gets role user even if its roster entry says admin; a foreign
  service account receives no synthetic membership. user_belongs_to_keys_team returns false for a
  personal key, otherwise loads the team from the database and checks this derived role. The separate
  _team_member_has_permission uses only a nonempty explicit permission list plus matching roster ID;
  it adds neither baseline routes nor a service-account exception.

  Access-group assignment is a no-op for None/[] IDs and bypasses proxy/team admins. For a non-admin
  personal key it raises HTTP 403 (despite the upstream docstring claiming bypass). A roster member
  needs exact KEY_ACCESS_GROUP_ASSIGNMENT in the effective permissions; nonmembers have [] and fail
  403. The personal-key error lists sorted denied IDs, while the team error names the opt-in permission.
  This field gate never treats a wildcard route as an assignment grant. No stored secret is handled.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management/teams/access.py:
  OrgRoles.is_org_admin (L18-L18; 1 source lines), TeamAccess.allows (L25-L31; 7 source lines), TeamAccess.strongest_role
  (L33-L39; 7 source lines), TeamAccess._is_org_admin (L41-L44; 4 source lines), is_team_admin (L47-L51;
  5 source lines), team_access_denied (L54-L55; 2 source lines). litellm/proxy/management/teams/dependencies.py:
  get_team_access (L7-L10; 3 source lines). litellm/proxy/management_helpers/team_member_permission_checks.py:
  TeamMemberPermissionChecks.get_permissions_for_team_member (L28-L45; 15 source lines), TeamMemberPermissionChecks._get_list_of_route_enum_as_str
  (L48-L54; 7 source lines), TeamMemberPermissionChecks.can_team_member_execute_key_management_endpoint
  (L57-L102; 37 source lines), TeamMemberPermissionChecks.does_team_member_have_permissions_for_endpoint
  (L105-L134; 24 source lines), TeamMemberPermissionChecks.enforce_member_can_assign_access_groups (L137-L201;
  52 source lines), TeamMemberPermissionChecks.user_belongs_to_keys_team (L204-L227; 22 source lines),
  TeamMemberPermissionChecks.get_all_available_team_member_permissions (L230-L237; 8 source lines), TeamMemberPermissionChecks.default_team_member_permissions
  (L240-L241; 2 source lines). litellm/proxy/management_endpoints/key_management_endpoints.py: _get_user_in_team
  (L510-L517; 7 source lines), _get_caller_team_role (L520-L527; 8 source lines). litellm/proxy/management_endpoints/common_utils.py:
  _team_member_has_permission (L208-L221; 14 source lines).


  TeamAdminEditVerdict and general_settings.team_admin_editable_team_fields belong entirely to B1200;
  none of this task's functions calls that policy. This task reads no configuration key.


  Register team_access in B856 Management::teams and seed B171 helper_case with the permission-baseline,
  role-order and assignment-gate inputs. Compare the pinned helper's result sets and complete error
  fields with the production policy; constructor and database-only behavior stays in native tests.


  Only pure policy calls belong in the helper adapter. Native tests exercise the database-only lookup
  selection and constructor wiring through B736/B737 with typed collaborator outcomes.


  Sizing: 225 nonblank, noncomment source lines including docstrings; allow 240 production,
  300 policy/lookup tests, 80 helper adapters and 30 wiring lines, 650 within a 675-line gate.
