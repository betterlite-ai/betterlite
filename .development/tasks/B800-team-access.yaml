  - text: 'Implement the owned behavior and ordered failure effects; named tests: proxy_admin, organization_admin,
      team_admin, member_key_route, allows_short_circuit, strongest_org_before_team,
      missing_org_identity, org_read_no_upsert, org_read_error, null_roster_id, first_roster_match,
      service_account_user_role, foreign_service_account, baseline_none, baseline_empty,
      permissions_deduplicated, unknown_permission_error, nonlist_baseline, member_route_401,
      nonmember_route_401, admin_route_bypass, personal_key_bypass, fresh_team_read,
      personal_membership_false, explicit_permission_only, all_routes_order, default_routes,
      empty_groups_noop, proxy_group_bypass, team_admin_group_bypass, personal_group_403,
      member_group_opt_in, outsider_group_403, wildcard_not_opt_in and team_denied_403.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_access::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/team_access.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/team-access-*")"
        && grep -rlq "team_access" tools/oracle/fuzz/corpus/helper_case/team-access-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
