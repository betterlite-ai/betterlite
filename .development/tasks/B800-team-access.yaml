id: B800
title: Team roles and member management permissions
description: >-
  Implement TeamAccess, TeamMemberPermissions and TeamAdminEditVerdict using stored organization/team
  roles. Preserve field-level metadata/model/budget/key permissions and strongest-role precedence; permission
  lists contain actual pinned route names. Expose this leaf service to key/team management without depending
  on their endpoint registration.


  Build the production team_access module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management/teams/access.py:
  OrgRoles.is_org_admin (L18-L18; 1 source lines), TeamAccess.allows (L25-L31; 7 source lines), TeamAccess.strongest_role
  (L33-L39; 7 source lines), TeamAccess._is_org_admin (L41-L44; 4 source lines), is_team_admin (L47-L51;
  5 source lines), team_access_denied (L54-L55; 2 source lines). litellm/proxy/management/teams/dependencies.py:
  get_team_access (L7-L10; 3 source lines). litellm/proxy/management_helpers/team_member_permission_checks.py:
  TeamMemberPermissionChecks.get_permissions_for_team_member (L28-L45; 15 source lines), TeamMemberPermissionChecks._get_list_of_route_enum_as_str
  (L48-L54; 7 source lines), TeamMemberPermissionChecks.can_team_member_execute_key_management_endpoint
  (L57-L102; 37 source lines), TeamMemberPermissionChecks.does_team_member_have_permissions_for_endpoint
  (L105-L134; 24 source lines), TeamMemberPermissionChecks.enforce_member_can_assign_access_groups (L137-L201;
  52 source lines), TeamMemberPermissionChecks.user_belongs_to_keys_team (L204-L227; 22 source lines),
  TeamMemberPermissionChecks.get_all_available_team_member_permissions (L230-L237; 8 source lines), TeamMemberPermissionChecks.default_team_member_permissions
  (L240-L241; 2 source lines). litellm/proxy/management_endpoints/key_management_endpoints.py: _get_user_in_team
  (L510-L517; 7 source lines), _get_caller_team_role (L520-L527; 8 source lines). litellm/proxy/management_endpoints/common_utils.py:
  _team_member_has_permission (L208-L221; 14 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  general_settings.team_admin_editable_team_fields is owned and resolved by B1200; consume its typed policy
  rather than reading configuration again.


  Add the team_access operation under B856 Management::teams. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a team-access-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::team_access::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 225 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  225 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 512 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
