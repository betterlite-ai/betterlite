id: B916
title: Execute Responses requests through chat completions
description: >-
  Implement api::responses_chat_call as the complete sync/async handler pair. Prepare
  additional_tools through B2410, map options/messages with B908, execute B014's completion
  service once, and convert its result through B914 or B924. B915 restores history only
  on the async path when previous_response_id is truthy. Preserve that sync/async difference
  in the native entry modes; sharing internal code must not introduce a sync history lookup.

  Add SdkHttpCall::ResponsesChatCall to B2401. Its Python adapter invokes the actual pinned
  handler against the mock provider with custom_llm_provider=openai, not a fabricated
  completion result. Capture the POST, the returned Responses object or complete event
  sequence, and SDK failures. Use local unit seams only for impossible executor return types
  and merge-precedence assertions. No helper variant or new byte decoder is needed.
  The handler owns 124 nonblank/non-comment lines; estimate 140 native lines, 110 tests,
  95 HTTP fixtures, 80 adapters and 25 wiring, totaling 450.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_chat_call.rs
  - crates/betterlite-core/src/api/responses_chat_call/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/responses_chat_call.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/responses_chat_call.py
  - tools/oracle/cases/sdk-http/responses-chat-call/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/handler.py#L1-L140
  why: Both full handlers show option precedence, async-only session replay and result-type dispatch.
dod:
- text: >-
    chat_request_precedence sends model=gpt-4o-mini,input=hello,max_output_tokens=7,
    extra_headers={x-client:probe},api_key=sk-test. Capture one POST /v1/chat/completions,
    Authorization="Bearer sk-test",x-client=probe,model=gpt-4o-mini,
    messages=[{role:user,content:hello}],max_tokens=7 and no input or max_output_tokens.
    Mapped request values override conflicting kwargs and _skip_responses_api_bridge=true
    overrides a false kwarg internally without being forwarded in the provider JSON.
    A mock completion chat_a with content=hi returns id=chat_a,object=response and output text hi.
  proof: [call-tests, oracle, sdk-adapter]
- text: >-
    hoisted_tools_reach_provider sends an input item carrying additional_tools=[function f]
    plus user content=hello; the provider receives f and no additional_tools content item.
    The same cleaned input and extended tools are used by output transformation. Without
    a hoisted item the original request is passed through. Test tools=null and tools=[]
    separately through B2410's handling, keeping its diagnostics.
  proof: [call-tests, oracle, sdk-adapter]
- text: >-
    async_session_only uses previous_response_id=resp_a with scripted history [old]. Async
    sends [old,hello] and carries the recovered litellm_trace_id; sync sends only [hello]
    and performs no lookup. Empty previous_response_id performs no lookup in either mode.
    The fixture drives the real handler and captures provider HTTP while an injected
    spend repository supplies history; it does not replace the completion executor.
  proof: [call-tests, oracle, sdk-adapter]
- text: >-
    chat_stream_dispatch sends stream=true and a mock chat SSE delta hi then finish=stop.
    Return B924's Responses event stream with model=gpt-4o-mini,original cleaned input,
    mapped request,provider=openai and litellm_metadata from kwargs or {}. Async takes
    model/provider from the prepared completion request, using model="" when falsy;
    sync takes the handler arguments. A normal JSON response uses B914 and never constructs
    a streaming iterator. Executor returning a string raises ValueError with message
    "Unexpected response type: <class 'str'>" before any conversion.
  proof: [call-tests, oracle, sdk-adapter]
- text: >-
    chat_provider_failure scripts HTTP 401 with message=bad key,type=invalid_api_key,
    code=invalid_api_key,param=null and retries=0. One POST occurs; failure.class is
    AuthenticationError,status=401,body/type/param/code null as projected by B011/B2401.
    Do not convert it into a Responses success, retry locally or manufacture proxy code="401".
    Preserve B011's declared message comparison policy explicitly in the case.
  proof: [call-tests, oracle, sdk-adapter]
checks:
  optional: []
  commands:
  - id: call-tests
    why: the handler does not preserve preparation, session mode or result dispatch
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_call::/)'
  - id: sdk-adapter
    why: the Responses chat operation lacks real captured provider traffic
    run: test -f tools/oracle/sdk_http/responses_chat_call.py && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/responses-chat-call)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/sdk-http/responses-chat-call/chat-request-precedence.yaml
- tools/oracle/cases/sdk-http/responses-chat-call/hoisted-tools-reach-provider.yaml
- tools/oracle/cases/sdk-http/responses-chat-call/async-session-only.yaml
- tools/oracle/cases/sdk-http/responses-chat-call/chat-stream-dispatch.yaml
- tools/oracle/cases/sdk-http/responses-chat-call/chat-provider-failure.yaml
deviations: []
out_of_scope:
- B908 owns request mapping, B914 output assembly and B924 streaming conversion; their internal callees are not direct dependencies here.
- B014 owns provider dispatch and B011 error mapping; B080 owns proxy HTTP registration.
- Python's coroutine object representation and event-loop wrapper are B158-B161 binding concerns.
pitfalls:
- previous_response_id triggers storage recovery only in async_response_api_handler.
- Completion kwargs are merged before the mapped request, then _skip_responses_api_bridge is forced true.
- Hoisted tools must reach both the provider call and output conversion or custom tool names change on return.
review_level: standard
budget:
  max_changed_lines: 450
  max_new_expects: 1
