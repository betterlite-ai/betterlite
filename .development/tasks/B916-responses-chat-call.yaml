id: B916
title: Responses chat call
description: >-
  Compose the split Responses-to-chat transformations into B014's statically dispatched completion executor. Carry
  prepared context and provider metadata through one call, expose typed streaming/nonstreaming results and keep
  sync Python wrappers as later bindings to the same native service.


  Implement crates/betterlite-core/src/api/responses_chat_call.rs. Use ResponsesChatCallInput and ResponsesChatCallResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions chat_bridge_request_capture, chat_bridge_tools, chat_bridge_error,
  stream_bridge_selection under api::responses_chat_call::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesChatCall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_chat_call: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/handler.py: LiteLLMCompletionTransformationHandler.response_api_handler
  (L26-L95); litellm/responses/litellm_completion_transformation/handler.py: LiteLLMCompletionTransformationHandler.async_response_api_handler
  (L97-L140). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 121 owned nonblank/non-comment/non-docstring Python lines (124 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 141 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 373 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B908 (Responses chat options), B909 (Responses input messages),
  B910 (Responses reasoning merge), B911 (Responses tool repair), B912 (Responses tool results), B913 (Responses
  tool namespaces), B914 (Responses chat output), B915 (Responses session history), B1087 (Api boundaries), B907
  (Responses codex tools). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
