checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_call::/) -
      test(/::replays_corpus$/)'
  - id: case-chat-bridge-request-capture
    why: the chat-bridge-request-capture behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_call::tests::chat_bridge_request_capture($|::)/)'
  - id: case-chat-bridge-tools
    why: the chat-bridge-tools behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_call::tests::chat_bridge_tools($|::)/)'
  - id: case-chat-bridge-error
    why: the chat-bridge-error behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_call::tests::chat_bridge_error($|::)/)'
  - id: case-stream-bridge-selection
    why: the stream-bridge-selection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_call::tests::stream_bridge_selection($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_chat_call.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_chat_call-*)"
      && grep -qE "^[[:space:]]+responses_chat_call:" tools/oracle/fuzz/corpus/helper_case/responses_chat_call-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-chat-call)"
oracle_cases:
- tools/oracle/cases/helpers/responses-chat-call/chat-bridge-request-capture.yaml
- tools/oracle/cases/helpers/responses-chat-call/chat-bridge-tools.yaml
