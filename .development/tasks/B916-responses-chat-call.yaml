  - crates/betterlite-core/src/api/responses_chat_call.rs
  - crates/betterlite-core/src/api/responses_chat_call/**
  - crates/betterlite-core/src/api.rs
  - Cargo.toml
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/responses_chat_call.rs
  - tools/oracle/src/helpers/responses_chat_call/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/responses_chat_call.py
  - tools/oracle/helpers/responses_chat_call/**
