- tools/oracle/cases/helpers/responses-chat-call/stream-bridge-selection.yaml
deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- Within LiteLLMCompletionTransformationHandler.response_api_handler\'s isinstance(litellm_completion_response,
  ModelResponse) branch, preserve return responses_api_response and its nested guards.
- LiteLLMCompletionTransformationHandler.response_api_handler uses responses_api_request.get('tools'); retain its
  missing-value behavior and field spelling in the typed projection.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 1
