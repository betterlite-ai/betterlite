id: B821
title: Access-group response projections and lookups
description: >-
  Implement typed access-group responses, batched attached-team/key labels and read routes for /v1/access_group.
  Preserve admin-viewer versus write authority, missing-reference errors and exact assignment identifiers;
  never expose raw keys in labels.


  Also own GET /v1/unified_access_group and GET /v1/unified_access_group/{access_group_id}; register aliases
  exactly once.


  Build the production access_group_read module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/access_group_endpoints.py:
  _AccessGroupRecord.access_group_id (L49-L49; 1 source lines), _AccessGroupRecord.access_mcp_server_ids
  (L52-L52; 1 source lines), _AccessGroupRecord.access_agent_ids (L55-L55; 1 source lines), _AccessGroupRecord.assigned_team_ids
  (L58-L58; 1 source lines), _AccessGroupRecord.assigned_key_ids (L61-L61; 1 source lines), _AccessGroupRecord.dict
  (L63-L63; 1 source lines), _TeamRecord.team_id (L68-L68; 1 source lines), _TeamRecord.team_alias (L71-L71;
  1 source lines), _TeamRecord.access_group_ids (L74-L74; 1 source lines), _KeyRecord.token (L79-L79;
  1 source lines), _KeyRecord.access_group_ids (L82-L82; 1 source lines), _AccessGroupTable.find_unique
  (L86-L86; 1 source lines), _AccessGroupTable.find_many (L88-L88; 1 source lines), _AccessGroupTable.create
  (L90-L90; 1 source lines), _AccessGroupTable.update (L92-L92; 1 source lines), _AccessGroupTable.delete
  (L94-L94; 1 source lines), _TeamTable.find_unique (L98-L98; 1 source lines), _TeamTable.find_many (L100-L100;
  1 source lines), _TeamTable.update (L102-L102; 1 source lines), _KeyTable.find_unique (L106-L106; 1
  source lines), _KeyTable.find_many (L108-L108; 1 source lines), _KeyTable.update (L110-L110; 1 source
  lines), _AgentRecord.agent_id (L115-L115; 1 source lines), _AgentRecord.access_group_ids (L118-L118;
  1 source lines), _AgentTable.find_many (L122-L122; 1 source lines), _AgentTable.update (L124-L124; 1
  source lines), _AccessGroupTx.litellm_accessgrouptable (L145-L145; 1 source lines), _AccessGroupTx.litellm_teamtable
  (L148-L148; 1 source lines), _AccessGroupTx.litellm_verificationtoken (L151-L151; 1 source lines), _AccessGroupTx.litellm_agentstable
  (L154-L154; 1 source lines), _require_proxy_admin (L157-L162; 6 source lines), _require_admin_view (L165-L173;
  8 source lines), _label (L184-L185; 2 source lines), _record_to_response (L188-L201; 14 source lines),
  _ids_across (L204-L207; 4 source lines), _responses_for (L210-L237; 28 source lines), _response_for
  (L240-L242; 3 source lines), _attached_team_ids_by_group (L245-L256; 10 source lines), _teams_touching
  (L259-L265; 7 source lines), _attached_team_ids_for (L268-L273; 6 source lines), _require_teams_exist
  (L276-L286; 11 source lines), _record_to_access_group_table (L289-L291; 3 source lines), _cache_access_group_record
  (L294-L309; 14 source lines), list_access_groups (L584-L592; 8 source lines), get_access_group (L599-L613;
  14 source lines).


  Register these actual HTTP routes and aliases exactly once: GET /v1/access_group -> list_access_groups;
  GET /v1/unified_access_group -> list_access_groups; GET /v1/access_group/{access_group_id} -> get_access_group;
  GET /v1/unified_access_group/{access_group_id} -> get_access_group. For each route send a typed successful
  request, an invalid or missing target, and a caller lacking that route permission through B001 HttpCase
  against the running pinned MIT proxy and betterlite. Public login/session routes instead prove bad credentials
  or invalid/expired codes. Compare status, response model including null/absent fields, error type/param/code,
  content-type, redirect/cookie headers and litellm-changed-by where read. Do not reduce endpoint checks
  to direct helper invocations. handle_exception_on_proxy controls management error mapping; keep source
  partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 168 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  168 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 381 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
