id: B821
title: Access-group response projections and lookups
description: >-
  Implement the two access-group GET handlers and their unified aliases, plus the shared lower-level
  projection/guard helpers used by B822. _require_proxy_admin permits only proxy_admin; _require_admin_view
  uses B2314 to permit proxy_admin and proxy_admin_viewer. Both reject other roles with 403 detail.error=
  "Admin-only endpoint. Not allowed to access this.". GET checks this guard BEFORE B124
  get_prisma_client_or_throw, whose missing-DB error is 500 with CommonProxyErrors.db_not_connected_error.
  List reads all groups ordered created_at descending, with no pagination; empty input returns () and
  skips every enrichment query. Lookup uses the exact path ID and returns 404 detail="Access group
  '<id>' not found". Cases viewer_and_admin_read, role_before_database, list_order_and_empty and
  missing_group cover both path families. There is no management wrapper, local catch or
  handle_exception_on_proxy call; B003 supplies the exception envelope type/param/code.

  Own AccessGroupCreateRequest/UpdateRequest/Resource/Response from types/access_group.py and the
  _ResourceNames/protocol/filter declarations. Create requires access_group_name; description and five
  optional list fields default null. Update makes every field optional/null; retain field presence for
  B822 exclude_unset handling. Resource requires id and nullable name. Response requires its IDs/name,
  resource/assignment arrays, expanded resource tuples and created_at/updated_at; description and
  created_by/updated_by default null. B003 owns the HTTP byte decoder; request_shape_defaults and
  required_response_lists test these typed contracts, including a malformed stored null list rather
  than silently normalizing it into a valid response.

  _ids_across returns first-seen distinct IDs, skipping null arrays. Fetch teams once with OR of
  access_group_ids.hasSome(group IDs) and team_id.in(stored assigned IDs). For each group, keep stored
  team IDs that exist, then append teams whose own access_group_ids contains the group, deduplicating
  in that order. Thus response assigned_team_ids repairs ghost/missing mirrors without writing them.
  Empty _attached_team_ids_for returns {} without a query. Cases team_mirror_projection,
  stored_then_carrying_order and empty_projection_no_io cover both directions of drift.

  After the team query, concurrently obtain MCP, agent and key display names via B065 resource_display_names,
  passing B136 config_mcp_servers and B141 global_agent_registry snapshots. Each category receives
  first-seen IDs across all groups. B065 owns DB-over-config precedence and key_alias lookup; this task
  maps names back to every original resource ID, retaining duplicates/order and null for missing labels.
  Keys are identified by their stored hashes and names by aliases, never by plaintext key material.
  _record_to_response preserves the raw row except corrected team IDs and four expanded lists; response
  order follows record order. Cases label_batches_and_order, unknown_resource_null_label,
  key_hash_and_alias_projection and enrichment_failure_propagates cover these shapes and failures.

  _require_teams_exist skips an empty input, otherwise performs one transaction-scoped lookup and raises
  400 string detail="Unknown team ids: <sorted comma-separated IDs>" for missing distinct IDs. It is a
  B822 write precondition, not a GET validation. _cache_access_group_record converts record.dict() to
  LiteLLM_AccessGroupTable then calls B734 _cache_access_object with the group ID; validation/cache
  failures propagate and no database write occurs. Native require_teams_sorted_missing and
  cache_typed_record cover these helpers with POSTGRES_TEST_URL fixtures or B860 testcontainers when
  absent, failing on connection errors. No new setting, stored secret or license behavior is added.


  Also own GET /v1/unified_access_group and GET /v1/unified_access_group/{access_group_id}; register aliases
  exactly once.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/access_group_endpoints.py:
  _AccessGroupRecord.access_group_id (L49-L49; 1 source lines), _AccessGroupRecord.access_mcp_server_ids
  (L52-L52; 1 source lines), _AccessGroupRecord.access_agent_ids (L55-L55; 1 source lines), _AccessGroupRecord.assigned_team_ids
  (L58-L58; 1 source lines), _AccessGroupRecord.assigned_key_ids (L61-L61; 1 source lines), _AccessGroupRecord.dict
  (L63-L63; 1 source lines), _TeamRecord.team_id (L68-L68; 1 source lines), _TeamRecord.team_alias (L71-L71;
  1 source lines), _TeamRecord.access_group_ids (L74-L74; 1 source lines), _KeyRecord.token (L79-L79;
  1 source lines), _KeyRecord.access_group_ids (L82-L82; 1 source lines), _AccessGroupTable.find_unique
  (L86-L86; 1 source lines), _AccessGroupTable.find_many (L88-L88; 1 source lines), _AccessGroupTable.create
  (L90-L90; 1 source lines), _AccessGroupTable.update (L92-L92; 1 source lines), _AccessGroupTable.delete
  (L94-L94; 1 source lines), _TeamTable.find_unique (L98-L98; 1 source lines), _TeamTable.find_many (L100-L100;
  1 source lines), _TeamTable.update (L102-L102; 1 source lines), _KeyTable.find_unique (L106-L106; 1
  source lines), _KeyTable.find_many (L108-L108; 1 source lines), _KeyTable.update (L110-L110; 1 source
  lines), _AgentRecord.agent_id (L115-L115; 1 source lines), _AgentRecord.access_group_ids (L118-L118;
  1 source lines), _AgentTable.find_many (L122-L122; 1 source lines), _AgentTable.update (L124-L124; 1
  source lines), _AccessGroupTx.litellm_accessgrouptable (L145-L145; 1 source lines), _AccessGroupTx.litellm_teamtable
  (L148-L148; 1 source lines), _AccessGroupTx.litellm_verificationtoken (L151-L151; 1 source lines), _AccessGroupTx.litellm_agentstable
  (L154-L154; 1 source lines), _require_proxy_admin (L157-L162; 6 source lines), _require_admin_view (L165-L173;
  8 source lines), _label (L184-L185; 2 source lines), _record_to_response (L188-L201; 14 source lines),
  _ids_across (L204-L207; 4 source lines), _responses_for (L210-L237; 28 source lines), _response_for
  (L240-L242; 3 source lines), _attached_team_ids_by_group (L245-L256; 10 source lines), _teams_touching
  (L259-L265; 7 source lines), _attached_team_ids_for (L268-L273; 6 source lines), _require_teams_exist
  (L276-L286; 11 source lines), _record_to_access_group_table (L289-L291; 3 source lines), _cache_access_group_record
  (L294-L309; 14 source lines), list_access_groups (L584-L592; 8 source lines), get_access_group (L599-L613;
  14 source lines).


  Register these actual HTTP routes and aliases exactly once: GET /v1/access_group -> list_access_groups;
  GET /v1/unified_access_group -> list_access_groups; GET /v1/access_group/{access_group_id} -> get_access_group;
  GET /v1/unified_access_group/{access_group_id} -> get_access_group. B001 runs the named GET cases through
  B052 on both servers, comparing JSON content-type, null labels and errors. Alias cases must prove
  all four routes are registered once. List has no invalid-target branch.


  Sizing: 168 listed function/property lines plus the request/response and protocol/record declarations;
  allow 230 production, 320 behavior/Postgres tests, 0 helper adapters, 70 route/manifests/wiring,
  0 decoder/fuzz and 0 config lines, 620 changed lines within a 650-line gate.


