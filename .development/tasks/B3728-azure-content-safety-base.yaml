deviations:
  - what: The legacy _PROXY_AzureContentSafety hook configures a default severity threshold of four per category, while the modern AzureGuardrailBase does not configure thresholds (B3730 owns threshold logic).
    why: LiteLLM's legacy hook has its own default thresholds separate from the modern guardrail framework. betterlite preserves this distinction so both execution paths match their sources.
  - what: The legacy pre-call hook suppresses non-HTTPException errors with logging, while HTTPException is re-raised to block requests.
    why: LiteLLM's pre-call hook logs all exceptions but only re-raises HTTPException. betterlite preserves this error handling to match the source behavior.
  - what: API version defaults to 2024-09-01; the legacy Javelin v1 stored by older releases resolves to this modern default.
    why: LiteLLM handles the migration from older releases that stored "v1" as the Javelin API version. betterlite performs the same resolution.
out_of_scope:
  - Modern guardrail initialization, configuration updates and logging are owned by B104 (CustomGuardrail framework).
  - Threshold evaluation, category filtering and the complete moderation guardrail hook are owned by B3730 (text moderation).
  - Prompt Shield-specific scans and billing are owned by B3729.
  - The legacy callback registration caller at litellm/proxy/common_utils/callback_utils.py:356 is owned by U3 (callback helpers).
  - Text content type checking (is_text_content_call_type) and message text iteration (iter_message_text) are owned by U1 (framework utilities).
pitfalls:
  - "split_text_by_words always returns at least one chunk even if the input is longer than max_length; a caller cannot rely on len(chunks) > 1 to know if splitting occurred."
  - "split_text_by_words preserves all internal whitespace (spaces, newlines, tabs) within and between chunks; it only splits at word boundaries."
  - "A token longer than max_length is force-split into multiple chunks; no single token spans two chunks."
  - "The legacy hook's default threshold is severity four per category; the modern framework uses a different default set by B3730."
  - "The legacy pre-call hook suppresses all exceptions except HTTPException; a caller that expects other exception types will not see them."
  - "The legacy post-call hook has no exception suppression: all exceptions from test_violation propagate unmodified, including HTTPException and SDK errors."
  - "HTTP errors from the Azure SDK (HttpResponseError) are re-raised in test_violation but suppressed with logging in the pre-call hook."
  - "api_version resolved to the modern default is 2024-09-01; stored config must survive downgrade and re-upgrade of the Azure SDK."
