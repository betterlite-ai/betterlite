id: B3728
title: Azure Content Safety transport and legacy hooks
description: >-
  Build Azure's authenticated Content Safety transport layer and implement lossless text
  splitting at 10,000-character word boundaries. The task covers two execution paths: the
  modern AzureGuardrailBase used by both text moderation (B3730) and prompt shield (B3729),
  and the separate legacy _PROXY_AzureContentSafety hook that runs outside the modern framework.
  The legacy hook preserves its default severity threshold of four (distinct from the modern
  default of two in B3730), suppresses non-HTTP exceptions in the pre-call hook, and uses
  the Azure SDK's analyze_text contract directly without the modern transport layer. Text splitting
  splits text into chunks at word boundaries without breaking words, returning always at least
  one chunk even for text longer than the limit, and preserves whitespace within chunks.
scope:
  paths:
    - crates/betterlite-guardrails/src/azure_*.rs
    - crates/betterlite-guardrails/src/azure_*/**
    - tools/oracle/cases/guardrails/azure/**
  lint_tables: false
