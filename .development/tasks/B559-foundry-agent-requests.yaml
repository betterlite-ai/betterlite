id: B559
title: Foundry agent request and run URL construction
description: >-
  Add AgentCallRequest/PreparedAgentCall plus typed endpoint builders for threads/messages/runs. Resolve agent_id
  then assistant_id then agents/ model suffix; api_version defaults to 2025-05-01. Preserve optional thread_id and
  instructions, and pass explicit credentials and cancellation through all calls.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/agents/transformation.py:
  AzureAIAgentsConfig.__init__ L77-L78; AzureAIAgentsConfig.get_agent_id_from_model L90-L102; AzureAIAgentsConfig._get_openai_compatible_provider_info
  L104-L120; AzureAIAgentsConfig.get_supported_openai_params L122-L126; AzureAIAgentsConfig.map_openai_params L128-L138;
  AzureAIAgentsConfig._get_api_version L140-L142; AzureAIAgentsConfig.get_complete_url L144-L172; AzureAIAgentsConfig._get_agent_id
  L174-L185; AzureAIAgentsConfig.transform_request L187-L234; AzureAIAgentsConfig.validate_environment L236-L261;
  AzureAIAgentsConfig.get_error_class L263-L264; AzureAIAgentsConfig.should_fake_stream L266-L275; AzureAIAgentsConfig.has_custom_stream_wrapper
  L278-L280; AzureAIAgentsConfig.supports_stream_param_in_request_body L283-L287; AzureAIAgentsConfig.transform_response
  L289-L307. litellm/llms/azure_ai/agents/handler.py: _SyncAgentRequest.__call__ L106-L106; _AsyncAgentRequest.__call__
  L110-L112; AzureAIAgentsHandler.__init__ L122-L123; AzureAIAgentsHandler._build_thread_url L131-L132; AzureAIAgentsHandler._build_messages_url
  L134-L136; AzureAIAgentsHandler._build_runs_url L138-L140; AzureAIAgentsHandler._build_run_status_url L142-L145;
  AzureAIAgentsHandler._build_list_messages_url L147-L149; AzureAIAgentsHandler._build_create_thread_and_run_url
  L151-L153; AzureAIAgentsHandler._prepare_completion_params L258-L289; AzureAIAgentsHandler._check_response L291-L297.


  Named case contracts: agent_model_id: Choose truthy optional agent_id, then assistant_id, else suffix after the
  first case-sensitive agents/ anywhere in model (or entire model when absent). Advertise only stream; map_openai_params
  returns optional_params unchanged without copying non-default parameters. default_api_version: Default api_version=2025-05-01
  only when missing from optional_params; explicit None/empty survives. Provider-info lookup uses explicit or AZURE_AI_API_BASE/AZURE_AI_API_KEY
  only; get_complete_url rejects None with api_base is required for Azure AI Agents. Set it via AZURE_AI_API_BASE
  env var or api_base parameter., otherwise trim slashes. message_content_conversion: Each message becomes only
  role (default user when absent) and content (default empty when absent); content lists use B218 convert_content_list_to_str
  and other non-strings use Python str, including None. Pass thread_id/instructions whenever their keys exist, retaining
  null/empty values. thread_and_run_paths: Builders append /threads, /threads/<B206 encoded thread_id>/messages,
  /threads/<thread_id>/runs, /threads/<thread_id>/runs/<encoded run_id>, or /threads/runs, each followed by ?api-version=<version>
  literally. They do not insert /openai despite the transformation docstrings. agent_auth_and_response_checks: Both
  validation/preparation overwrite Content-Type=application/json; only truthy api_key overwrites Authorization=Bearer
  <key>, otherwise existing Authorization survives. Preparation returns headers,version,agent_id,optional thread_id,trimmed
  base. _check_response rejects any status outside its supplied expected list with AzureAIAgentsError preserving
  status and <error_msg>: <response.text>; get_error_class drops the supplied headers. agent_stream_flags: should_fake_stream
  always returns True regardless of requested stream/model; has_custom_stream_wrapper=False and supports_stream_param_in_request_body=False.
  The custom handler owns response conversion; the base transform_response is a no-op returning its input response
  record.


  Write standalone Rust test foundry_agents_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test foundry_agents_secret_safe_failure in betterlite-foundry: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B2202. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-foundry/src/agent_requests.rs with adjacent tests under agent_requests/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agent_requests_cases in betterlite-foundry with these exact named cases (one per oracle
  file): agent_model_id, assistant_id_override, default_api_version, existing_thread, message_content_conversion,
  thread_and_run_paths, missing_api_base, agent_auth_and_response_checks, agent_stream_flags. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_agent_requests* using HelperCase: kind:
  helper and the externally tagged foundry_agent_requests variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_agent_requests that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 225 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 225 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 580 planned, 600 maximum changed lines.
