pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_agent_requests in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/agent_requests.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_agent_requests.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The URL docstrings mention /openai/threads, but the builders append /threads directly to the already resolved
  base.
- Presence checks on thread_id/instructions preserve explicit None, while agent_id selection uses truthiness.
