dod:
  - text: NativeBackend implements every method of the BaseCache contract, forwarding each call to the corresponding native_handle method with identical semantics.
    proof: [native-adapter-tests]
  - text: The ttl parameter accepts float | None and is validated at the Pydantic level; invalid values raise ValidationError before the native handle is touched.
    proof: [factory-tests, native-adapter-tests]
  - text: Cache.memory creates a handle with ttl=600, capacity=200 and max_entry_bytes=4194304, and returns a CacheFacade with type=LiteLLMCacheType.LOCAL.
    proof: [factory-tests]
  - text: Cache.redis requires a namespace parameter, creates a handle with ttl=600 default and max_entry_bytes=4194304, and returns a CacheFacade with type=LiteLLMCacheType.REDIS.
    proof: [factory-tests]
  - text: NativeCacheHandle creation is deferred until a factory is called; no handles are created at import time.
    proof: [factory-tests]
  - text: Every mutant in the native adapter and factories is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: native-adapter-tests
      why: the native adapter tests fail, do not exist, or assertions differ from the contract
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^native_adapter::/)'
    - id: factory-tests
      why: the factory tests fail, do not exist, or parameter defaults differ
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^factories::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - NativeCacheHandle construction, serialization and the Rust bridge. These are owned elsewhere and provide the contract.
  - LiteLLMCacheType enum is owned by B4290; the CacheFacade implementation and Cache.__init__ are owned by B4299.
  - The rust_bridge._native module. It is a Rust-to-Python bridge outside this task's scope.
pitfalls:
  - Lazy initialization means NativeCacheHandle.memory and NativeCacheHandle.redis are called inside the factory methods, never at module load. A test that checks for deferred creation must catch the import statement and a factory call separately.
  - The TypeAdapter validates ttl as float | None; a ttl of 0 or 0.0 is valid (an explicit zero duration). A None value is also valid and should reach the native handle.
  - max_entry_bytes is a constant shared with the legacy facade for compatibility; do not change it in response to future scale experiments.
  - The redis factory requires namespace as a keyword-only argument with no default. Callers must pass it explicitly; no silent fallback to an empty string or a generated value.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
