id: B4311
title: Adapt experimental cache factories to native storage
description: >-
  Build the experimental memory and Redis cache factories that construct a native backend adapter for the Cache facade.
  The NativeBackend class wraps a NativeCacheHandle (from rust_bridge._native) and implements the BaseCache contract by forwarding calls to the native handle's get/set/delete/flush/ping/disconnect methods with validated duration forwarding.
  The Cache.memory factory creates an in-memory cache with ttl=600 seconds, capacity 200 items and max_entry_bytes=4194304 bytes, returning a CacheFacade configured for local storage.
  The Cache.redis factory creates a Redis cache with a required namespace parameter, ttl=600 seconds default and max_entry_bytes=4194304 bytes, returning a CacheFacade configured for Redis storage.
  Validate the ttl parameter as float | None at the Pydantic level using TypeAdapter, so invalid durations raise a ValidationError with the original value for debugging.
  Defer the NativeCacheHandle creation until the factory is called (lazy initialization), never at import time.
  The Cache class has no state, only two static methods that return fully initialized facades ready to use.
