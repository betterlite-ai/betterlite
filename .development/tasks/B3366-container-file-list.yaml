id: B3366
title: Explicit container file listing
description: >-
  Build the explicit list_container_files and alist_container_files operations in betterlite-core,
  including the file-list HTTP handlers container_file_list_handler and async_container_file_list_handler.
  The async operation wraps the sync variant through asyncio while preserving the call context.
  The sync function accepts a container ID, optional pagination parameters (after, limit, order),
  optional headers and query additions, timeout and provider override. It decodes any managed
  container ID to recover the original ID and provider metadata, retrieves the provider config
  using that provider, validates the provider environment to fetch auth headers, builds the
  complete API base URL from the provider config, transforms the request using the provider's
  file-list transformation to build the final URL and query parameters, logs the request through
  the logging object with the transformed data, sends an HTTP GET with the client's deadline
  (not a per-call timeout), checks for and raises on HTTP errors or JSON error responses, and
  transforms the response through the provider to validate and return a typed ContainerFileListResponse.
  Both handlers support sync and async execution through the same facade: the sync variant delegates
  to the async coroutine when _is_async=True, while the async handler awaits the operation.
  HTTP client selection reuses the caller's when compatible or constructs a new one with ssl_verify
  settings. Mock responses are parsed first and short-circuit provider selection. Response ID
  re-encoding is not applied to file lists. The implementation reuses B3361's managed ID decoder
  and provider config manager, B3363's error status checking, B522/B547 provider transformations,
  B173's HTTP client pool, B249's logging hooks, B2402's transport error handler, B247's logging
  state update, and B185's exception dispatching.

