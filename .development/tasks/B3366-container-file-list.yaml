checks:
  optional: []
  commands:
    - id: file-list-tests
      why: File list handlers fail, do not exist, or mock/async/provider selection/transformation/GET behavior differs from the source
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_file_list::/)'

oracle_cases: []

deviations:
  - what: The handlers do not pass timeout to httpx GET calls; the selected client's deadline is preserved instead.
    why: LiteLLM's source accepts timeout but does not forward it to GET, so passing it would promise behavior the source does not have.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L9552-L9556
  - what: When query_params is empty after transformations, None is passed to httpx instead of an empty dict.
    why: An empty dict passed as params to httpx strips the URL's query string; None preserves any query string already in api_base.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L9555

out_of_scope:
  - B3360 owns ContainerFileListResponse and option parameter contracts; this task uses them without modification.
  - B3361 owns decode_managed_container_id_for_request and ProviderConfigManager.get_provider_container_config; this task calls them to resolve provider and ID.
  - B3363 owns raise_for_error_status; this task calls it to check HTTP errors.
  - B522 owns OpenAI provider transformations (validate_environment, get_complete_url, transform_container_file_list_request/response); this task calls them.
  - B547 owns Azure provider overrides; inherited or overridden methods are used as configured.
  - B173 owns HTTPHandler and AsyncHTTPHandler and HTTP client pooling; client selection delegates to type checking against provided clients.
  - B249 owns Logging.pre_call; this task calls it with the transformed request data.
  - B2402 owns BaseLLMHTTPHandler._handle_error; this task catches transport exceptions and delegates to it.
  - B247 owns Logging.update_from_kwargs and call-type state; this task calls update_from_kwargs before delegating to handlers.
  - B185 owns exception_type dispatch; this task calls it to convert all exceptions.

pitfalls:
  - Mock response parsing happens before provider selection, so mock short-circuits the entire flow without needing a valid provider.
  - Container ID decoding happens early and uses the decoded original ID for HTTP requests, not the input managed ID.
  - Provider config returns None when unsupported; callers must check and raise explicitly before using it.
  - Headers must be overlaid with extra_headers after validate_environment returns, not before, to preserve provider auth additions.
  - The transform_container_file_list_request function may mutate headers in place and returns (url, params) tuples where params may be empty.
  - When params is empty after transformation, pass None to httpx to preserve api_base's query string, not an empty dict.
  - The sync variant returns a Union that resolves to Coroutine when _is_async=True; callers must await in async contexts.
  - All exceptions at the top level are converted through exception_type dispatch and re-raised, not swallowed or logged separately.

