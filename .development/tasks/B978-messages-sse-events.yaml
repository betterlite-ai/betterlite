references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L33-L164
  why: Raw chunk classification and first matching data-line payload, including malformed-line tolerance.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L189-L379
  why: Complete-response rendering, synthetic incomplete error and response-header/close view.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/common_utils.py#L63-L75
  why: Own this immutable native error-type lookup table, which is not the inverse of B958's exception mapping.
dod:
- text: >-
    raw_chunk_classifiers accepts dict type=ping and bytes beginning exactly event: ping, ending \n\n or
    \r\n\r\n and containing only event: ping lines; multiple whole pings qualify. A coalesced content/error
    event,leading frame tail,leading whitespace,missing final boundary or split ping is false. Content/stop
    classifiers accept a dict type or any exact event: content_block_delta/event: message_stop line in a read,
    without requiring a full frame. Strings and other objects are false. They do not inspect data JSON for these two types.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    data_line_extraction skips lines without an exact data: prefix, strips surrounding bytes after that prefix,
    parses JSON and returns the first dict whose type matches the requested event. An event: label is unnecessary
    and may disagree; malformed JSON,invalid encoding,arrays/scalars and wrong types are ignored in favor of a
    later matching line. Split/multiline JSON is never reassembled. Python-supported UTF-16/32 JSON with BOM after
    data: is decoded consistently. Parsed dict input is returned only when its type matches.
  proof: [behavior-tests, oracle, python-adapters, decoder-corpus]
- text: >-
    native_error_and_refusal_projection extracts dict error even {} for terminal detection, but parse_error
    requires string error.type. Missing/nonstring message falls back to type; empty string stays empty.
    invalid_request_error/authentication_error/permission_error/not_found_error/rate_limit_error/api_error/
    overloaded_error/timeout_error map to400/401/403/404/429/500/503/504; unknown and request_too_large map to500.
    Terminal means message_stop or a dict error body, even when parse_error returns null. message_delta with
    stop_reason=refusal and dict stop_details returns that dict, including {}; other shapes return null.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    completed_response_lifecycle renders a response with usage input5,output2,cache_read3,content text Hi,
    stop_reason=end_turn. message_start copies response extras but replaces content=[],stops=null,output_tokens=0,
    retaining all other usage; blocks emit start/delta/stop; message_delta contains final stop_reason/stop_sequence
    and original usage; message_stop is only {type:message_stop}. Missing/null content means no blocks and
    missing/null usage gives start{output_tokens:0},final usage={}. Framing is event then data using default
    json.dumps spacing/ASCII escaping and two newlines, without a [DONE] marker.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    completed_response_block_shapes renders tool_use with id/name or null,input={} in start, then partial_json
    of input or {} (null/false also become {}). Thinking always emits thinking_delta, even "", then signature_delta
    only for a nonempty string signature; start has empty thinking/signature. Redacted thinking retains data in
    its start with no delta. Other types, including compaction/future, become an empty text start and text_delta
    of text or "". Indexes follow content-array order. This deliberately differs from B2435.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    incomplete_error_literal emits event:error with {type:error,error:{type:api_error,message:"Provider stream ended before emitting a message_stop event; the response is incomplete and any partial content (e.g. tool_use input JSON) may be truncated."}}.
    It contains no param/code, status line or success terminator. Native limit tests distinguish this event from
    a read over1048576 bytes, which returns B1087's event_too_large failure and is an explicit deviation.
  proof: [behavior-tests, oracle, python-adapters, decoder-corpus]
- text: >-
    provider_headers_survive_stream wraps a mock POST /v1/messages response with x-amzn-requestid=req_a,
    x-amzn-trace-id=trace_a and x-litellm-attempted-fallbacks=spoof. additional_headers contains
    llm_provider-x-amzn-requestid, llm_provider-x-amzn-trace-id and llm_provider-x-litellm-attempted-fallbacks,
    never a bare trusted fallback marker. The view yields provider bytes unchanged; hidden params retain the
    supplied header map. has_buffered_provider_output is true only for the literal boolean true, not1 or a
    truthy string. aclose awaits a supported underlying close, is a no-op when unsupported and propagates its error.
  proof: [behavior-tests, oracle, python-adapters]
- text: New helper/HTTP seeds and arbitrary-byte seeds exercise the production decoder, not a second fixture parser.
  proof: [new-cases, operation-corpus, decoder-corpus, oracle, python-adapters]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: native chunk classification, rendering or header-view behavior is absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_sse_events::/) - test(/::replays_corpus$/)'
  - id: python-adapters
    why: raw-chunk or live header-view comparison lacks checked pinned code
    run: test -f tools/oracle/helpers/messages_sse_events.py && test -f tools/oracle/sdk_http/messages_header_stream.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: operation-corpus
    why: a native event operation cannot be selected by its oracle driver
    run: grep -qE '^[[:space:]]+messages_sse_events:' tools/oracle/fuzz/corpus/helper_case/messages_sse_events-* && grep -qE '^[[:space:]]+messages_header_stream:' tools/oracle/fuzz/corpus/sdk_http_case/messages-header-stream-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus) | test(/^sdk_http::tests::replays_corpus$/)'
  - id: decoder-corpus
    why: malformed/split/oversized reads lack fuzz coverage of the production boundary
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/messages_sse_events.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/messages_sse_events)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_sse_events::tests::replays_corpus$/)'
  - id: new-cases
    why: event helpers or live header forwarding has no added independent fixtures
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-sse-events)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/messages-header-stream)"
