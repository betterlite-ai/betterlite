id: B978
title: Messages sse events
description: >-
  Implement bounded Anthropic SSE parsing and synthetic message-event production using B005 framing. Expose ping/content/refusal/error
  classification, terminal detection and typed hidden metadata for routing B312; cached or fake streams reuse the
  same event producer.


  Ping/content classifiers inspect raw read chunks, before SSE buffering: ping coalesced with another frame or split
  across reads is not a pure ping. Synthetic _sse_event uses json.dumps default separators comma-space and colon-space;
  message-as-events compares exact generated bytes, not a normalized object. Drain slots/exception consumption are
  B979.


  Implement crates/betterlite-core/src/api/messages_sse_events.rs. Use MessagesSseEventsInput and MessagesSseEventsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions ping_classification, refusal_stop_details, error_event_status, message_as_events,
  fake_tool_block_stream, malformed_sse, coalesced_ping_not_pure, split_ping_not_pure under api::messages_sse_events::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::messages_sse_events::decode_messages_sse_events(bytes:
  &[u8], limits: &ApiLimits), for json.loads input line[len(b'data:'):].strip() at litellm/llms/anthropic/pass_through/messages/streaming_iterator.py:89.
  Place its implementation in crates/betterlite-core/src/api/messages_sse_events.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/messages_sse_events.rs passes arbitrary
  bounded bytes to that exact decoder; api::messages_sse_events::tests::replays_corpus replays newly committed seeds
  through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::MessagesSseEvents in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_sse_events: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


