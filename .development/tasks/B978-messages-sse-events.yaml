id: B978
title: Classify native Messages chunks and render fallback events
description: >-
  Own messages/streaming_iterator.py L33-L164 and L189-L379: raw-chunk predicates, data-line extraction,
  terminal/error/refusal classification, response_as_sse_events, close support and the header-carrying response
  view. B979 owns drain-slot/queue helpers and the live relay. B2435 owns fake_stream_iterator.py whole;
  its legacy renderer must remain distinct. Reuse B958 records, B963's incomplete-stream literal and B206
  header projection. The native error-to-status table is the constant at common_utils.py L63-L75, with
  overloaded_error=503 (not the inverse exception mapping's 529).

  Implement decode_messages_sse_chunk(bytes:&[u8],limits:&ApiLimits) in api::messages_sse_events. It classifies
  one transport read and decodes each data: line separately; it must not join frames across reads or join SSE
  multiline data. Preserve complete-frame requirements only for pure ping. Use the same bounded decoder in
  the messages_sse_events cargo-fuzz target and replays_corpus. At B1087's 1048576-byte cap accept the read;
  cap+1 returns its 502 bad_gateway,param=stream,code=event_too_large error before allocation.

  HelperCall::MessagesSseEvents covers raw bytes and parsed response rendering. SdkHttpCall::MessagesHeaderStream
  wraps a real B009 mock response for header/iteration/close parity through B2401. Own 271 nonblank/non-comment
  physical lines plus the 12-line status table; budget 250 implementation, 150 tests, 145 fixtures, 130 adapters,
  60 fuzz/replay and 30 wiring, 765 total. Behavior tests use api::messages_sse_events excluding replays_corpus.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
