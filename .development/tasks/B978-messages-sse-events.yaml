  to the following stage.


  Sizing: 366 owned nonblank/non-comment/non-docstring Python lines (449 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 386 implementation,
  88 behavior tests, 96 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 750 total within the 750-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B005 (Streaming chat completions), B171 (Direct helper oracle and URL path encoding),
  B958 (Messages errors), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
