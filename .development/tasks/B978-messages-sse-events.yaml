deviations:
- what: A raw Messages read above 1048576 bytes fails with status 502,type=bad_gateway,param=stream,code=event_too_large rather than unbounded inspection.
  why: Reuse B1087's finite provider-input bound; native-only boundary tests assert the contrast explicitly.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/streaming_iterator.py#L85-L107
out_of_scope:
- B979 owns _try_claim_detached_drain_slot,_exception_left_unconsumed at L167-L186, relay methods L468-L525/L579-L697 and process task sets; B2436 owns constructor/logging/formatting/teardown methods L388-L466/L527-L576/L699-L710.
- B2435 owns every function in fake_stream_iterator.py; no legacy renderer is rebuilt here.
- B206 owns header filtering, including its documented cookie/CORS security differences; B963 owns the incomplete-stream message constant.
- common_utils.py credential/OAuth/model-discovery functions belong to B567, content and beta predicates to B568,
  header/model-list projections to B570, history/thinking/cache normalization to B571, web-search replay helpers
  to B572 and sampling/forced-tool/thinking-capability methods to B688; those owners enumerate the complete callable ranges.
  This entry adds only ANTHROPIC_ERROR_STATUS_CODE_MAP and calls none of those functions.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_sse_events in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_sse_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_sse_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Payload classification trusts data.type rather than the SSE event label; message-stop byte detection does the opposite.
- An empty dict error is terminal even though it has no parsable error type.
- Native overloaded_error maps to503, whereas constructing an overloaded Anthropic exception envelope uses529.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
