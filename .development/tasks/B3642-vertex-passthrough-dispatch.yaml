deviations:
  - what: The error text of a failing leaf (a body that does not decode, an unsupported publisher) is the Rust error text, not Python's exception text.
    why: Exception strings are runtime wording (docs/compatibility.md); the failure still rises to the caller as an error, as in LiteLLM.
  - what: The helper cases cover the branch order only. The adapter patches the leaf each branch reaches and reports which one was hit.
    why: A helper adapter cannot build the logging object and proxy state that the full Python handler reads, and the branch bodies are pinned by native tests against the leaf tasks' own oracle cases.
out_of_scope:
  - "B3638 owns is_interactions_route, is_vertex_interactions_route, interactions_passthrough_handler, extract_model_from_url, _get_vertex_publisher_or_api_spec_from_url, _get_custom_llm_provider_from_url and the payload factory. This task calls them."
  - "B3639 owns _handle_predict_response, _handle_audio_predict_response, _is_audio_predict_response, _get_audio_prediction_count, _extract_embed_content_input, _handle_embed_content_response and _is_multimodal_embedding_response. B3641 owns batch_prediction_jobs_handler, _store_batch_managed_object, get_actual_model_id_from_router and extract_model_name_from_vertex_path."
  - "_handle_logging_vertex_collected_chunks and _build_complete_streaming_response (the stream side) belong to B3640."
  - "B3605 owns success_handler's TRACKED_VERTEX_METHOD_ROUTES and TRACKED_VERTEX_RESOURCE_ROUTES consts and the is_vertex_route predicate, and B3606 owns the branch choice between Gemini, Vertex and the other providers. This task owns only the choice inside the Vertex handler. B3606 owns the Vertex Live branch."
  - "The Vertex Live handler (VertexAILivePassthroughLoggingHandler, B3643) is never called from vertex_passthrough_handler in LiteLLM; B3606 reaches it through its own VertexAiLive branch."
  - "The Veo response parsing (B1362), the Gemini response decoder (B1326), the partner response configs (B032, B1333, B1335) and the Discovery Engine response decoder (B1389) are called here and not rebuilt. The completion_cost service itself (B068) is reached through B3638's cost trait, passed in by B102."
pitfalls:
  - "Every branch test is a plain substring test over the whole route string, project and model names included, so a model path or project id that contains 'search' reaches the Search branch unless an earlier test matches first."
  - "'predict' is lowercase, so 'rawPredict', 'streamRawPredict' and 'batchPredictionJobs' do not match the Predict branch, and 'predictLongRunning' is caught by the Video test that runs before it."
  - "'generateContent' does not match 'streamGenerateContent' (capital G), so a streaming route falls through to None here; the stream handlers take that traffic."
  - "The embedContent and batchEmbedContents test runs before 'predict', and the rawPredict test runs after it, so the order of branches 4, 5 and 6 matters for a route that contains two of the words."
  - "vertex_location is written to optional_params before any branch, and only when the URL has one, so the None branch and the Interactions branch both see it."
  - "The rawPredict branch parses the body as JSON and drops the value, so a body that is not JSON fails even for a route whose publisher is unknown."
  - "The rawPredict branch passes the model to the payload factory as 'vertex_ai/' plus the extracted model, while the generateContent branch passes the bare model; extract_model_from_url never adds the prefix."
  - "The generateContent branch takes custom_llm_provider from the URL host, but the video, rawPredict and search branches always use 'vertex_ai', and the search branch sets no custom_llm_provider in kwargs at all."
  - "The video cost call here passes vertex_location and call_type 'create_video'; B3640's Gemini video call passes neither a location nor a Vertex provider."
  - "The batch branch rebuilds request_metadata from kwargs['litellm_params']['metadata'], and a handler result replaces the caller's kwargs, so merge VertexBatchKwargs over the input kwargs instead of dropping the rest."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
