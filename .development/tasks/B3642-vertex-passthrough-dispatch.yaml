    - "tools/oracle/fuzz/corpus/helper_case/vertex_passthrough_handler-*"
    - tools/oracle/helpers/b3642.py
    - tools/oracle/helpers/b3642/**
    - tools/oracle/src/helpers/server/b3642.rs
    - tools/oracle/src/helpers/server/b3642/**
  lint_tables: false
