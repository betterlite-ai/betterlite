dod:
  - text: select_vertex_branch returns Interactions, Video, GenerateContent, EmbedContent, Predict, RawPredict, Search or BatchPredictionJobs in LiteLLM's order, and None for a route that matches nothing.
    proof: [order-tests, order-oracle]
  - text: The order holds where tests overlap. A route with predictLongRunning is Video, streamGenerateContent is None, embedContent is EmbedContent and not Predict, rawPredict is RawPredict and not Predict, and a route with "search" in a project name but a generateContent method is GenerateContent.
    proof: [order-tests, order-oracle]
  - text: >-
      A route with a vertex location writes it to logging_obj.optional_params["vertex_location"] on every branch including None, and a route without one writes nothing.
    proof: [location-tests]
  - text: The Interactions branch returns B3638's interactions_passthrough_handler with provider "vertex_ai" and the route's vertex_location.
    proof: [interactions-tests]
  - text: The Video branch builds the video object with B1362, sets the four model and provider writes, prices it with call_type "create_video" and the vertex_location, stores the cost in hidden params, kwargs and model_call_details.
    proof: [video-tests]
  - text: The GenerateContent branch decodes the body with the dummy message and runs B3638's payload factory with the provider from the URL host and the vertex_location.
    proof: [generate-tests]
  - text: The EmbedContent and Predict branches call B3639's two methods with the fields named above, and the request body only goes to the embed one.
    proof: [predict-tests]
  - text: The RawPredict branch parses the JSON first, uses the partner config only for a known publisher, errors on an unsupported one, and prices with the model "vertex_ai/" plus the extracted model.
    proof: [raw-predict-tests]
  - text: >-
      The Search branch prices with model "vertex_ai/search_api" and call_type "vector_store_search", returns the {"response": ...} wrapper, and writes kwargs, litellm_params.base_model and model_call_details["response_cost"] without a custom_llm_provider.
    proof: [search-tests]
  - text: >-
      The BatchPredictionJobs branch hands B3641 the status, body, route, start time and metadata taken from kwargs["litellm_params"]["metadata"] (empty when missing or null) and the call log, and returns its record and kwargs.
    proof: [batch-tests]
  - text: A leaf error (a body that does not decode, an unsupported publisher, a cost failure) comes back as Err and no partial result is returned.
    proof: [error-tests]
  - text: The helper adapter's Python passes the strict lint and type check.
    proof: [helper-python]
checks:
  optional: []
  commands:
    - id: order-tests
      why: the branch order or the substring rules are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::order_/)'
    - id: location-tests
      why: the vertex_location write to optional_params is missing, wrong, or has no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::location_/)'
    - id: interactions-tests
      why: the Interactions branch hands the wrong provider or location, or has no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::interactions_/)'
    - id: video-tests
      why: the video branch writes, pricing or hidden params are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::video_/)'
    - id: generate-tests
      why: the generateContent branch decode or payload factory call is wrong, or has no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::generate_/)'
    - id: predict-tests
      why: the embed or predict branch hand-over is wrong, or has no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::(embed_|predict_)/)'
    - id: raw-predict-tests
      why: the rawPredict branch publisher handling or model prefix is wrong, or has no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::raw_predict_/)'
    - id: search-tests
      why: the search branch pricing or the kwargs and logging object writes are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::search_/)'
    - id: batch-tests
      why: the batch branch input mapping or output mapping is wrong, or has no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::batch_/)'
    - id: error-tests
      why: a leaf error is swallowed or a partial result is returned, or there are no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_passthrough_handler::tests::error_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3642)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3642 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3642/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/vertex_passthrough_handler-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: order-oracle
      why: newly added helper cases are absent, do not use the b3642 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/vertex-passthrough-handler)" &&
        grep -rlE '^[[:space:]]+b3642:' tools/oracle/cases/helpers/vertex-passthrough-handler &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/vertex-passthrough-handler
