id: B3642
title: Vertex passthrough response dispatch
description: >-
  Build the step that looks at the route of a finished Vertex pass-through response, picks one of nine branches and runs it. It is LiteLLM's
  VertexPassthroughLoggingHandler.vertex_passthrough_handler. Four branches have their code inline in that function (predictLongRunning video,
  generateContent, rawPredict and streamRawPredict, search); the other branches call a handler that another task builds. The module goes in
  betterlite-server, in the new module vertex_passthrough_handler (crates/betterlite-server/src/pass_through_logging/vertex_passthrough_handler.rs
  and its folder), next to B3639's vertex_predict_logging and B3641's vertex_batch_logging. betterlite-vertex is a leaf that never imports core,
  provider or logging, so this glue cannot live there. The module reads no network and keeps no state.


  Types you use and do not define. From B3605: the response-object enum, the typed kwargs map, and the tracked route tables on
  PassThroughEndpointLogging (vertex methods and the vertex resource batchPredictionJobs; B3605 owns those consts, so you do not declare them
  again and this module needs them only through the branch test below). From B3608 (betterlite-logging): HandlerOutcome (an optional result
  plus a kwargs map) and the logging object handle type and time type of CollectedChunksCall. From B247: CallLog. From B3638 (betterlite-vertex,
  vertex_relay_metadata): extract_model_from_url, is_interactions_route, interactions_passthrough_handler, the publisher-or-api-spec helper
  (LiteLLM's _get_vertex_publisher_or_api_spec_from_url), get_custom_llm_provider_from_url, the Vertex logging payload factory
  (_create_vertex_response_logging_payload_for_generate_content) and the cost trait that B3638 declares there. From B1304:
  get_vertex_location_from_url. From B1326: decode_generate_content and its envelope assembly. From B1362: the Vertex Veo create-response method
  (LiteLLM's VertexAIVideoConfig.transform_video_create_response). From B032: the partner response-config selector
  (get_vertex_ai_partner_model_config; anthropic gives B1333's config, ai21 and openapi and mistralai give B1335's, any other publisher is an
  error). From B1389: the Discovery Engine search response method (LiteLLM's transform_search_vector_store_response). From B3639:
  VertexPredictLogger. From B3641: VertexBatchLogging. Read the merged code for the exact Rust names and signatures and call them. Do not copy
  their logic. If a function you need is not there, or if the cost trait cannot take a call_type ("create_video", "vector_store_search") next to
  the response, model, provider and vertex_location, or if B3605's response-object enum has no variant for the video object, the batch record
  or the search wrapper {"response": ...}, report it in notes and stop.


  Constructor. `VertexPassthroughHandler::new(predict: VertexPredictLogger, batch: VertexBatchLogging, cost: Arc<dyn <B3638's cost trait>>)
  -> VertexPassthroughHandler`. B102 builds the VertexPredictLogger with its own cost handle, builds VertexBatchLogging and the cost handle, and
  passes all three in; this module builds none of them and reads no config. No module-level state.


  The fixed names B3606 calls. The path is
  betterlite_server::pass_through_logging::vertex_passthrough_handler::VertexPassthroughHandler. `pub struct VertexPassthroughInput<'a> {
  pub logging_obj: &'a <the logging object handle type of CollectedChunksCall>, pub url_route: &'a str, pub result: &'a str, pub start_time:
  <the type of CollectedChunksCall.start_time>, pub end_time: <same>, pub cache_hit: bool, pub status: http::StatusCode, pub response_headers:
  &'a http::HeaderMap, pub response_body: &'a [u8], pub request_body: Option<&'a serde_json::Map<String, serde_json::Value>>, pub call_log:
  &'a mut CallLog, pub kwargs: <B3605 typed kwargs map> }` and `impl VertexPassthroughHandler { pub fn vertex_passthrough_handler(&self, input:
  VertexPassthroughInput<'_>) -> Result<HandlerOutcome, VertexPassthroughError> }`. The method is synchronous. response_body is the whole buffered
  upstream body (LiteLLM calls httpx_response.json() or .text on it). LiteLLM's Vertex handler gets no parsed response body, so there is none in
  the struct. result and cache_hit are not used by any branch below (B3641's handler takes neither), but keep them in the struct so
  the signature stays LiteLLM's. VertexPassthroughError is this module's own enum (thiserror) with one variant per failing collaborator, each with
  `#[from]` where the source type is a single error type. A failure is returned as Err, as LiteLLM lets the exception rise.


  The branch test, a pure function that the handler itself uses, so the tests and the oracle check the same order: `pub fn
  select_vertex_branch(url_route: &str) -> Option<VertexBranch>`. VertexBranch has the variants Interactions, Video, GenerateContent,
  EmbedContent, Predict, RawPredict, Search, BatchPredictionJobs. It returns the first match in this order, and every string test is a
  case-sensitive substring test over the whole route string, not over the path.
  1. B3638's is_interactions_route(url_route) gives Interactions.
  2. "predictLongRunning" gives Video.
  3. "generateContent" gives GenerateContent. "streamGenerateContent" has a capital G and does not match.
  4. "embedContent" or "batchEmbedContents" gives EmbedContent.
  5. "predict" gives Predict.
  6. "rawPredict" or "streamRawPredict" gives RawPredict.
  7. "search" gives Search.
  8. "batchPredictionJobs" gives BatchPredictionJobs.
  9. Nothing matches: None.


  vertex_passthrough_handler, in order. First, vertex_location = get_vertex_location_from_url(url_route); when it is Some, write it to
  logging_obj.optional_params["vertex_location"]. This runs for every route, the unmatched ones too. Then run select_vertex_branch and:

  Interactions. Return B3638's interactions_passthrough_handler with custom_llm_provider "vertex_ai" and the vertex_location, passing the
  response body, request body, logging object, kwargs and both times. B3640 calls the same function with "gemini" and no location.

  Video. model = extract_model_from_url(url_route). Build the video object with B1362's create-response method (response bytes, model, logging
  object, custom_llm_provider "vertex_ai", request_data = request body). Then set logging_obj.model = model, model_call_details["model"] = model,
  model_call_details["custom_llm_provider"] = "vertex_ai" and logging_obj.custom_llm_provider = "vertex_ai". response_cost = cost(video object,
  model, "vertex_ai", call_type "create_video", vertex_location). Store response_cost in the video object's hidden params, set kwargs
  response_cost, model and custom_llm_provider ("vertex_ai"), and set model_call_details["response_cost"]. Return the video object and the kwargs.
  Unlike B3640's Gemini video path, the cost call here carries vertex_location.

  GenerateContent. model = extract_model_from_url(url_route). Decode the body with B1326 (decode_generate_content, then the envelope assembly)
  into a chat response for that model with the single dummy message {"role": "user", "content": "no-message-pass-through-endpoint"}, empty
  optional and provider params and an empty api key. Then call B3638's payload factory with the response, model, kwargs, both times, the logging
  object, custom_llm_provider = get_custom_llm_provider_from_url(url_route) (so "gemini" for a generativelanguage.googleapis.com host, otherwise
  "vertex_ai") and vertex_location. Return the response and the kwargs the factory gives back.

  EmbedContent. Return B3639's handle_embed_content_response with VertexEmbedContentInput (logging object, url_route, status, response headers,
  response body, kwargs and the request body). Predict. Return B3639's handle_predict_response with VertexPredictInput (the same fields without the
  request body). Both return Result and the error becomes a VertexPassthroughError variant.

  RawPredict. model = extract_model_from_url(url_route). publisher = B3638's publisher-or-api-spec helper on the route ("mistralai" for
  "/publishers/mistralai/", "anthropic" for "/publishers/anthropic/", "ai21" for "/publishers/ai21/", "openapi" for "/endpoints/openapi/", else
  None). Parse the body as JSON first and return the error when it does not parse, whatever the publisher (LiteLLM calls httpx_response.json()
  before it looks at the publisher, and drops the value). The result starts as an empty chat response. When the publisher is Some, get the partner
  config from B032's selector (an unsupported publisher is an error) and let it transform the body into the chat response with the same dummy
  message, empty request data, empty params and an empty api key. With publisher None the empty response is used as is. Then call B3638's payload
  factory with the model "vertex_ai/" + model (the prefix is added here and not by extract_model_from_url), custom_llm_provider "vertex_ai" and
  vertex_location. Return the response and the kwargs.

  Search. Transform the body with B1389's search response method into the vector store search response. response_cost = cost(that response, model
  "vertex_ai/search_api", "vertex_ai", call_type "vector_store_search", vertex_location). The result is the wrapper {"response": the search
  response as an object}. Set kwargs response_cost and model "vertex_ai/search_api" (no custom_llm_provider here). Make sure
  model_call_details["litellm_params"] exists (an empty map when absent), set model_call_details["litellm_params"]["base_model"] =
  "vertex_ai/search_api" and set model_call_details["response_cost"]. Return the wrapper and the kwargs.

  BatchPredictionJobs. Build B3641's VertexBatchInput from this input: status_code from status, body, url_route, start_time, and request_metadata =
  kwargs["litellm_params"]["metadata"] with a missing or null litellm_params or metadata counted as empty. Call batch_prediction_jobs_handler with
  input.call_log (the handler never fails) and map the VertexBatchLogged into a HandlerOutcome: the result is the batch record in B3605's enum, the kwargs
  are VertexBatchKwargs merged over the input kwargs.

  None. Return no result and the input kwargs unchanged.

  Tests live under pass_through_logging::vertex_passthrough_handler::tests, in groups by prefix: order_ (every branch, plus the ordering pairs
  below), location_, interactions_, video_, generate_, embed_ and predict_, raw_predict_, search_, batch_, error_. A fake stands in for the cost
  trait, the logging object and CallLog, and the leaf handlers are the real merged ones where they are pure, so each test checks the arguments the
  branch hands over and the kwargs and logging object writes it makes. The module has no HTTP route yet (B3606, B3607 and B102 wire it), so it gets
  helper cases for the branch order only; the other branches need a logging object and proxy state, and a helper adapter cannot build
  that for every leaf, so those branches are native tests.
scope:
  paths:
    - crates/betterlite-server/src/pass_through_logging/vertex_passthrough_handler.rs
    - crates/betterlite-server/src/pass_through_logging/vertex_passthrough_handler/**
