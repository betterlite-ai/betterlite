out_of_scope:
  - prompt.rs, completion.rs, input_cost.rs, cache_write.rs, pricing.rs and the cost_usage projection. They already match LiteLLM on all eight gaps, so this task changes no product code.
  - The Rust and Python modality_cost adapters. They already take every field these cases send (service_tier, both TTL buckets, character_count, image_count, both durations, completion audio and image) and stay unchanged.
  - The helper_case corpus seeds under tools/oracle/fuzz/corpus/helper_case/modality-cost-*. No finding asks for a new seed.
  - Padded one-line functions belong to B5094. No such finding came up for B1671, and this task does not touch .ast-grep/rules/.
pitfalls:
  - LiteLLM sums Python floats and the adapter prints their repr, while the helper compare is exact, so a case priced at 0.00001 with cached_tokens 5 gives 0.0005550000000000002 on the LiteLLM side against betterlite's 0.000555; every rewritten and new case uses prices exact in binary (0.125, 0.25, 0.5, 1, 2).
  - Durations go into a case as quoted strings ("3", "-1.5", "-2.5"), the way free-seconds-and-images-suppress-token-cost.yaml sends "2.5", and both adapters print them back normalized ("3", not "3.0").
  - _get_cost_per_unit falls back from a missing _flex key to the unsuffixed key, so the flex test and case must set both keys at different prices, or a dropped tier can't show.
  - calculate_cost_component returns zero for a quantity of zero or less, so a negative unit count moves input_cost only through the token charge it skips; the returned fields are what pin the sign.
  - A negative cached text share leaves more cache for image (20 - 9 + 5 = 16 in the overdrawn case), so that case's image share of 9 comes off in full; that is LiteLLM's arithmetic, not a bug to fix.
  - The checks grep for the rstest case names exactly, so the prompt cases use case::text, case::audio and case::image, and the completion cases use case::positive, case::negative_audio and case::negative_image.
  - The five rewritten tests replace the old ones under new names; the checks fail while cache_allocates_audio_first_then_text_then_image, negative_reported_modality_is_retained_through_subtraction, ordinary_modalities_clamp_at_zero_when_cache_exceeds_them, audio_and_image_counters_pass_through_unchanged or cache_creation_token_details_pass_through_when_present still exists.
