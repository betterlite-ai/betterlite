oracle_cases: []

deviations:
  - what: The handler does not pass timeout to httpx send methods; the selected client's deadline is preserved instead.
    why: LiteLLM's source accepts timeout but does not forward it to HTTP calls, so passing it would promise behavior the source does not have.
  - what: When query_params is empty, None is passed to httpx instead of an empty dict, preserving any query string already in api_base.
    why: An empty dict passed as params to httpx strips the URL's own query string, breaking Azure container URLs with api-version; None leaves them intact.

out_of_scope:
  - HttpHandler, AsyncHTTPHandler and _get_httpx_client are B173 HTTP utilities; _sync_http_client and _async_http_client delegate to them.
  - BaseContainerConfig.get_complete_url, get_error_class and validate_environment are B522 (OpenAI) or B547 (Azure) provider implementations.
  - ContainerFileObject, ContainerFileListResponse and DeleteContainerFileResponse are B3360 type declarations.
  - encode_url_path_segment is B171's URL encoding; the handler calls it for path substitution.
  - extract_file_data is B235's media metadata extraction; the handler calls it from multipart preparation.
  - Logging.pre_call is B249's logging hook; the handler logs requests through it.
  - BaseLLMException.__init__ is B2202's base exception; errors wrap response details in it.
  - The container endpoints.json catalog is B3360's static data.
  - Provider loop callbacks and SDK HTTP execution belong to B3364 (create/list) and B3365 (retrieve/delete).

pitfalls:
  - The api_base from get_complete_url may already include /containers and query parameters; path building must account for both and preserve the query string.
  - Path parameters in the template start with {name} and must be substituted before building the final URL; missing params become empty strings, not None.
  - An empty dict passed to httpx as params strips any existing query string; use None instead to preserve api_base's own query string.
  - Multipart uploads must remove content-type header because httpx sets it automatically for multipart; leaving it causes a header duplication or httpx error.
  - JSON response bodies can contain an error field even when the HTTP status is 2xx; the handler checks for and raises on both cases.
  - A file object in kwargs may be many types (bytes, str, file-like, PIL Image); extraction is delegated to B235, not implemented here.

review_level: security

