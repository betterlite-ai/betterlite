      - behavior-tests
  - text: Endpoint lookup fails with a clear error on unknown endpoint name.
    proof:
      - behavior-tests
  - text: Path parameters are substituted and URL-encoded using B171's encoder; missing path params use empty string.
    proof:
      - behavior-tests
  - text: Query parameters are built from declared names, preserving None values as non-existent and converting non-strings; empty query params preserve existing query in the api_base URL.
    proof:
      - behavior-tests
  - text: Request headers are fetched from provider config validate_environment with api_key from params, then overlaid with extra_headers.
    proof:
      - behavior-tests
  - text: API base URL comes from provider config get_complete_url with api_base and params from litellm_params.
    proof:
      - behavior-tests
  - text: HTTP client is reused if it is the right type (sync for sync, async for async) and params.ssl_verify is passed when creating a new client.
    proof:
      - behavior-tests
  - text: Request is logged via logging_obj.pre_call with the final URL, headers and query params.
    proof:
      - behavior-tests
  - text: GET and DELETE send params as query string; POST with multipart extracts file data, sets multipart content-type on httpx, and removes content-type header.
    proof:
      - behavior-tests
  - text: Non-2xx status codes raise the provider error class; 2xx responses with JSON error fields also raise.
    proof:
      - behavior-tests
  - text: Byte responses return raw content; other responses validate against the response_type model when available.
    proof:
