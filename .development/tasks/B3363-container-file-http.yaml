id: B3363
title: Generic container file HTTP execution
description: >-
  Build the generic five-operation container-file executor in betterlite-core over the configured
  pooled HTTP transport and provider URL/auth functions, preserving path escaping, query precedence,
  multipart header removal, byte responses and JSON error handling even on successful HTTP statuses.
  The handler accepts endpoint name, provider config, LiteLLM params, logging object, optional headers
  and query overlays, timeout, async flag and optional HTTP client. It loads the endpoint configuration
  from the static catalog, substitutes path parameters with URL encoding, builds the final URL
  preserving any existing query string, assembles request headers from provider auth, selects the
  HTTP client (reusing the caller's when usable), logs the request, sends via GET/DELETE/POST with
  conditional multipart handling, and transforms the response into the appropriate typed result or
  bytes. Errors on non-2xx status codes, including those with JSON error fields on otherwise-successful
  responses, use the provider's error class with extracted error messages. The implementation uses
  B173's supplied HTTP pool, B171's path segment encoder, B235's file metadata extraction and B249's
  logging hooks, preserving the selected client's deadline when no timeout is passed. Do not add a
  timeout argument to HTTP sends or invent a per-call deadline behavior LiteLLM does not have.

