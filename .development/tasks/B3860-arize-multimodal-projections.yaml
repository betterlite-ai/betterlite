id: B3860
title: Arize multimodal messages and response projections
description: >-
  Port the part of LiteLLM's Arize attribute code that turns chat messages and a finished response into OpenInference span attributes. Everything lives under `crates/betterlite-logging/src/otel/integrations/arize_messages.rs` and its folder. Nothing calls it yet: B3861 wires it into the Arize `set_attributes` flow.


  B3844 already gives `SafeSetAttribute::safe_set_attribute(&mut self, key: &str, value: &OtelModelValue)` on every `opentelemetry::trace::Span`, the `LLMObsAttributes` trait and `OtelModelValue` (in `otel/model/utils/coercion.rs`). Use them. `MetadataMap` is `BTreeMap<String, OtelModelValue>`. Every function below takes the span as `&mut S` with `S: opentelemetry::trace::Span`. The Python code takes dicts or Pydantic objects; Rust reads `OtelModelValue` only, so `_safe_get`, `_to_plain_dict` and `model_dump` have no Rust form. `_safe_emit` only swallows exceptions, and no function here can fail, so it has none either.


  Keep the OpenInference attribute names in a `keys` submodule of public `&str` constants, from `litellm/integrations/_types/open_inference.py`. Message keys are joined with dots, for example `llm.input_messages.0.message.role`. The constants you need are `input.value`, `output.value`, `llm.input_messages`, `llm.output_messages`, `message.role`, `message.content`, `message.contents`, `message.name`, `message.tool_calls`, `message.tool_call_id`, `message.reasoning_summary`, `message_content.type`, `message_content.text`, `image.url`, `audio.url`, `audio.mime_type`, `audio.transcript`, `embedding.vector`, `embedding.text`, `tool_call.id`, `tool_call.function.name`, `tool_call.function.arguments`, and the `llm.token_count.*` keys (`total`, `prompt`, `completion`, `prompt_details.cache_read`, `prompt_details.cache_write`, `prompt_details.audio`, `completion_details.reasoning`). The image part URL key is the literal `message_content.image.image.url`. B189's task does not build the `open_inference.py` classes, so this module is the only place they exist for now.


  `ArizeOtelAttributes` is a unit struct that implements `LLMObsAttributes`. Its `set_messages(span, kwargs: &MetadataMap)` is LiteLLM's `ArizeOTELAttributes.set_messages`. `kwargs["messages"]` must be a non-empty array, else nothing is written. `input.value` is the last message's `content` (absent becomes the empty string). Then for each message at index `idx`, with `prefix = "llm.input_messages.{idx}"`, write `{prefix}.message.role` from `role` and `{prefix}.message.content` from `content` (absent or null both write the empty string), and then call `emit_input_message_extras`. Entries that are not objects are skipped. `set_response_output_messages` stays the empty default.


  `emit_input_message_extras(span, prefix, message: &MetadataMap)` writes, in this order: `{prefix}.message.name` when `name` is a non-empty string; `{prefix}.message.tool_call_id` when `tool_call_id` is a non-empty string; the tool calls through `emit_message_tool_calls`; then the structured parts when `content` is an array. For part `part_idx`, `part_prefix = "{prefix}.message.contents.{part_idx}"`, and non-object parts are skipped but still use up their index. A part whose `type` is `text` or `input_text` and whose `text` is a string writes `{part_prefix}.message_content.type = "text"` and `{part_prefix}.message_content.text`. A part whose `type` is `image_url`, `image` or `input_image` finds its URL like this: `image_url` as an object gives its `url`; `image_url` as a string is the URL itself. If that gives nothing (absent, null or empty), try `source`: when `source` is an object with a non-empty `data`, the URL is `data:{media_type};base64,{data}` with `media_type` defaulting to `image/jpeg` only when the key is absent. Only when `source` is not an object with data, a string `url` on the part itself is used. A non-empty URL writes `{part_prefix}.message_content.type = "image"` and `{part_prefix}.message_content.image.image.url`. Other part types write nothing. The plain `message.content` write from `set_messages` is never replaced.


  Tool calls live in `tool_calls.rs`. `normalize_tool_call(&OtelModelValue) -> Option<NormalizedToolCall>` returns None unless the value is an object. The result holds `id` and `type` (default `"function"` when absent), and `function` with `name` and `arguments`, both read from the object under `function` (None when it isn't an object). Arguments that are not null and not a string become their `serde_json::to_string` text. `summarize_tool_calls_for_output(tool_calls: &[OtelModelValue]) -> String` is `{"tool_calls":[...]}` over the normalized calls that are not None, where each call serializes with the keys `id`, `type` and `function` (`name`, `arguments`), and a missing id, name or arguments serializes as null. `emit_message_tool_calls(span, prefix, message: &MetadataMap)` does nothing unless `tool_calls` is a non-empty array. For each entry at `tc_idx` that normalizes, with `tc_prefix = "{prefix}.message.tool_calls.{tc_idx}"`, it writes `{tc_prefix}.tool_call.id` when the id is a non-empty string, `{tc_prefix}.tool_call.function.name` when the name is a non-empty string, and `{tc_prefix}.tool_call.function.arguments` when the arguments are not None (an empty string is written).


  `text.rs` holds `coerce_text(value: &OtelModelValue) -> Option<String>`, which B3861 also calls. Null gives None, a string is returned as is, and an array gives the parts joined with a newline: a string part is taken, an object part gives its `text` when that is a non-empty string, else its `input_text` when that is a string, and anything else is dropped. An array with no collected part, and every other value, gives None.


  `set_response_attributes(span, response: &OtelModelValue)` is `_set_response_attributes`. It returns at once unless `response` is an object, then runs these six steps in this order against the same span: choices, images, audio, embeddings, structured outputs, usage. Later steps overwrite `output.value` set by earlier ones, as in LiteLLM.


  Choices (`output.rs`): for each entry of `choices` (absent gives none) at `idx`, `message` is the choice's `message` object (empty when absent) and `content` is its `content`. `output_value` is the content, but when the content is null, absent or the empty string and `tool_calls` is a non-empty array, it becomes `summarize_tool_calls_for_output` of the calls. Write `output.value` from `output_value` (null writes the empty string), then `llm.output_messages.{idx}.message.role` from `role` and `llm.output_messages.{idx}.message.content` from `content`, then `emit_message_tool_calls` with prefix `llm.output_messages.{idx}`. With several choices the last one's `output.value` stays.


  Images: for each object in `data` at `i`, the URL is `url` when that is a non-null value, else `data:image/png;base64,{b64_json}` when `b64_json` is a non-empty string. No URL skips the entry. Index 0 writes `output.value`. Every URL writes `image.url.{i}`. Audio: for each object in the top-level `audio` array at `i`, the URL is `url` when non-null, else `data:audio/wav;base64,{b64_json}` for a non-empty `b64_json`. A URL writes `audio.url.{i}` and, for index 0, `output.value`. A non-empty `mime_type` writes `audio.mime_type.{i}` and a non-empty `transcript` writes `audio.transcript.{i}`, with or without a URL. Embeddings: for each object in `data` at `i`, a non-empty `embedding` array writes `embedding.vector.{i}` (and `output.value` for index 0) as the text `[a, b, c]`, each number written the way `serde_json::Number` displays it and joined with a comma and a space. A non-empty `text` string writes `embedding.text.{i}`. A `data` or `audio` value that is not an array is ignored.


  Structured outputs: each entry of `output` at `i` that is an object with a string `type` is read. For `reasoning` with a `summary` array, every summary object that has a `text` writes `llm.output_messages.{i}.message.reasoning_summary`, so the last summary wins. For `message` with a `content` key, `message_content` is the `text` of the first content object, or the empty string when the content is empty or has no text. The role is `role` or `assistant` when absent. Write `output.value` and `llm.output_messages.{i}.message.content` from the text and `llm.output_messages.{i}.message.role` from the role. Other types write nothing.


  Usage (`usage.rs`): `usage` must be a non-empty object, else nothing is written. `llm.token_count.total` is always written from `total_tokens`, and a missing value writes the empty string. `completion` is `completion_tokens`, falling back to `output_tokens` when the first is missing, null or 0. `prompt` is `prompt_tokens` falling back to `input_tokens` the same way. A nonzero value is written to `llm.token_count.completion` and `llm.token_count.prompt`. `reasoning_tokens` comes from `completion_tokens_details`, falling back to `output_tokens_details` when the first is missing, null or an empty object, and a nonzero value goes to `llm.token_count.completion_details.reasoning`. The prompt details object is `prompt_tokens_details` falling back to `input_tokens_details` on the same rule. `cache_read` is its `cached_tokens` falling back to `usage.cache_read_input_tokens` when 0 or missing, and a nonzero value goes to `llm.token_count.prompt_details.cache_read`. A nonzero `cache_creation_input_tokens` goes to `llm.token_count.prompt_details.cache_write`. A nonzero `audio_tokens` of the prompt details goes to `llm.token_count.prompt_details.audio`.


  Tests live in `arize_messages/tests.rs`, declared with `#[path]`. They read attributes back through `opentelemetry_sdk::trace::InMemorySpanExporter`, as B3844's tests do. Test names start with `input_`, `multimodal_`, `tool_calls_`, `choices_`, `media_`, `embedding_`, `structured_`, `usage_` and `text_`. The oracle adapter is operation `b3860`. Tagged inputs: `{"function": "set_messages", "messages": [...]}`, `{"function": "set_response", "response": {...}}`, `{"function": "coerce_text", "value": ...}` and `{"function": "summarize_tool_calls", "tool_calls": [...]}`. The two span functions answer `{"result": {attribute key: value}}` and the other two answer `{"result": ...}` with the text or null, or with the summary parsed as JSON. On both sides, a value stored under `output.value` or under a key ending in `.function.arguments` is replaced by its parsed JSON when it parses, so spacing in `json.dumps` text never matters. For `set_messages`, both sides drop `input.value` and `llm.input_messages.{n}.message.content` when that message's `content` is an array, since LiteLLM writes Python's list repr there. The Python adapter calls the real functions with a recording span that keeps what `set_attribute` receives. Because Responses output items are Pydantic objects in LiteLLM, the adapter turns each item under `output` into a `SimpleNamespace` (nested lists and objects too) before the call.

