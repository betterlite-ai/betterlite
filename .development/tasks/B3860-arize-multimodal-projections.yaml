dod:
  - text: set_messages writes input.value from the last message, the role and content of every message, and nothing for an empty or missing messages list.
    proof: [input-messages, oracle, helper-python]
  - text: A message's name, tool_call_id and assistant tool calls are written under their own keys without touching message.content.
    proof: [input-messages, tool-calls, oracle, helper-python]
  - text: Text and image parts of array content become message.contents entries, including the Anthropic base64 source, the string image_url and the part-level url.
    proof: [multimodal-parts, oracle, helper-python]
  - text: normalize_tool_call, summarize_tool_calls_for_output and emit_message_tool_calls follow LiteLLM for object arguments, missing ids and empty names.
    proof: [tool-calls, oracle, helper-python]
  - text: A choice with empty content and tool calls puts the tool call summary into output.value, and role and content are written for every choice.
    proof: [choice-outputs, oracle, helper-python]
  - text: Image and audio outputs write url attributes, with the b64_json data URL fallback, and output.value from index 0.
    proof: [media-outputs, oracle, helper-python]
  - text: Embedding vectors and texts are written per index in Python list text form.
    proof: [embedding-outputs, oracle, helper-python]
  - text: Responses API reasoning and message items write the reasoning summary, content, role and output.value.
    proof: [structured-outputs, oracle, helper-python]
  - text: Usage writes the total always and the other counts only when nonzero, with the Responses API and cache fallbacks.
    proof: [usage-outputs, oracle, helper-python]
  - text: coerce_text joins string and text-bearing parts and returns None when nothing is left.
    proof: [text-coercion, oracle, helper-python]

