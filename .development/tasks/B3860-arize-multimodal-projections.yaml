deviations:
  - what: A Responses API output list whose items are plain objects with a `type` is read like LiteLLM reads Pydantic items. LiteLLM skips a plain dict item, because `hasattr(item, "type")` is false for a dict.
    why: >-
      betterlite holds every response as JSON, so it cannot tell a Pydantic item from a dict. The Responses API logging path hands LiteLLM Pydantic items, which is the case this branch exists for.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/arize/_utils.py#L197-L222
  - what: An embedding vector is written as `[0.1, 0.2]` with numbers in serde_json's shortest form. Python's `str(list)` writes a float below 1e-4 or from 1e16 as `1e-05` style text, and serde_json writes `1e-5`.
    why: >-
      The Python float repr is not reproduced. Real embedding values in that range are rare, and the text is a display value in Arize.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/arize/_utils.py#L170-L194
  - what: A message whose `content` is an array writes the array's JSON text to `input.value` and `message.content`. LiteLLM writes Python's repr of the list.
    why: >-
      The repr is a Python runtime habit that docs/compatibility.md leaves out of the contract. The structured `message.contents` entries carry the same data in a stable shape.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/arize/_utils.py#L41-L59

out_of_scope:
  - _infer_open_inference_span_kind and _set_tool_attributes (_utils.py L307-L410) belong to B3846.
  - set_attributes, _sanitize_optional_params, _set_metadata_attributes, _extract_metadata_tools, _extract_optional_tools, _set_request_attributes, _set_model_params and _set_early_span_kind (_utils.py L413-L592) belong to B3861, together with the try and except around the calls into this task.
  - _coerce_response_obj_for_attrs (L591-L617), _set_session_and_user_attrs, _set_response_cost_attr, the passthrough helpers (L908-L1086) and the MCP tool helpers _maybe_set_mcp_tool_attrs, _has_only_text_parts and _set_mcp_tool_output (L1089-L1151) belong to B3861. They call coerce_text from this task.
  - _safe_emit, _safe_get and _to_plain_dict (L225-L244, L570-L577, L647-L661) are not built. They bridge exceptions and Pydantic objects, and Rust reads OtelModelValue and cannot fail here.
  - safe_set_attribute, cast_as_primitive_value_type and the LLMObsAttributes trait belong to B3844.
  - Weave attributes and the Weave types belong to B3861. Arize and Phoenix callbacks that call these functions belong to B3862.

pitfalls:
  - input.value comes from the last message only and ignores earlier turns, and a missing `content` writes the empty string, not an absent attribute.
  - safe_set_attribute turns null into the empty string, so a missing `role` or a null `content` still writes an attribute with an empty value.
  - emit_input_message_extras reads `image_url` first, and only when that gives no URL does it look at `source`; a `source` object with empty `data` falls through to the part-level `url`.
  - A non-object entry in a content array writes nothing but still uses up its index, so the next part is numbered one higher.
  - Usage truthiness matters, since total_tokens is written even when missing (as the empty string), but completion, prompt, reasoning, cache and audio counts of 0 are skipped, and 0 triggers the fallback name (`output_tokens`, `input_tokens`, `output_tokens_details`).
  - A choice with null or empty content and tool calls writes the JSON summary into output.value, while `llm.output_messages.N.message.content` still gets the empty content.
  - The image and embedding writers both read `data`. An embedding row has no `url` or `b64_json` so the image writer skips it, and an image row has no `embedding` so the embedding writer skips it.
  - Audio mime_type and transcript are written even when the item has no url, but output.value comes only from a url at index 0.
  - Several Responses reasoning summaries write the same `reasoning_summary` key, so only the last text remains.
  - The `tool_call.function.arguments` value is written for empty-string arguments (only None is skipped), while id and name are skipped when empty.

