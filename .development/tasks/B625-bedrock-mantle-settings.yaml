id: B625
title: Bedrock Mantle standalone provider configuration
description: >-
  Add BedrockMantleSettings and standalone bedrock_mantle provider mappings for OpenAI chat, native Messages and
  passthrough preparation. Compose B2207 credential/base/region/model-metadata selection with signing and the transport-specific
  adapter methods. Reuse existing transport/request models; raw native relay remains B101/B103 and Bedrock reply
  logging B658. Bearer precedence is explicit api_key, BEDROCK_MANTLE_API_KEY, AWS_BEARER_TOKEN_BEDROCK. Region
  precedence is aws_region_name, recognized configured Mantle hostname, BEDROCK_MANTLE_REGION, AWS_REGION_NAME,
  AWS_REGION, then us-east-1.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock_mantle/common_utils.py:
  BedrockMantleAuthMixin.sign_request L78-L127. litellm/llms/bedrock_mantle/chat/transformation.py: BedrockMantleChatConfig.__init__
  L41-L43; BedrockMantleChatConfig.custom_llm_provider L46-L47; BedrockMantleChatConfig.get_config L50-L51; BedrockMantleChatConfig.get_error_class
  L53-L56; BedrockMantleChatConfig.validate_environment L86-L108; BedrockMantleChatConfig.get_supported_openai_params
  L110-L120; BedrockMantleChatConfig._supports_reasoning L122-L127; BedrockMantleChatConfig.get_model_response_iterator
  L129-L143. litellm/llms/bedrock_mantle/messages/transformation.py: build_mantle_native_messages_url L26-L36; BedrockMantleAnthropicMessagesConfig.__init__
  L47-L49; BedrockMantleAnthropicMessagesConfig.custom_llm_provider L52-L53; BedrockMantleAnthropicMessagesConfig.uses_get_llm_provider_api_base
  L55-L56; BedrockMantleAnthropicMessagesConfig.get_complete_url L58-L67. litellm/llms/bedrock_mantle/passthrough/transformation.py:
  BedrockMantlePassthroughConfig._get_aws_region_name L26-L32; BedrockMantlePassthroughConfig.get_runtime_endpoint
  L34-L47; BedrockMantlePassthroughConfig.get_bedrock_bearer_token L49-L51; BedrockMantlePassthroughConfig.logging_non_streaming_response
  L53-L71.


  Reuse is_gpt_reasoning_series_name from B668 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation
  remains with that prerequisite.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse BaseAWSLLM._validate_aws_region_name from B591 (litellm/llms/bedrock/base_aws_llm.py); its implementation
  remains with that prerequisite.


  Named case contracts: standalone_mantle_base: The endpoint/key and model-capability selection methods now belong
  to B2207; use those exact cases through the adapter composition, including the distinct chat versus standalone
  region chains. Chat constructor calls B668 inherited GPT initialization and keeps a truthy injected aws_signer
  or creates B590 BaseAWSLLM. get_config delegates to B668; custom_llm_provider is bedrock_mantle. No client is
  created by these methods. standalone_mantle_auth: Select bearer through B2207. With a truthy token, leave caller
  headers/options unchanged and pass it as api_key to B595 _sign_request. Without a token, derive signing region
  from a case-insensitive match of ^https?://bedrock-mantle\.([^/.]+)\.api\.aws(?=/|$) against the actual api_base.rstrip("/")
  first, even if options contain a conflicting region. Otherwise call B2207 resolve_mantle_region with api_base
  overwritten by the signing URL. Copy options with that region and remove all case-insensitive Authorization header
  names into a fresh map. Call B595 with service_name=bedrock and all original model/stream/fake_stream/body arguments.
  Preserve its returned headers and signed bytes; explicit caller Authorization survives only on the bearer path.
  chat_provider_prefix: Chat validate_environment invokes B504 inherited GPT validation with the supplied api_key,
  then overwrites exact OpenAI-Project with truthy litellm_params.aws_bedrock_project_id; falsey values leave headers
  unchanged. It does not resolve bearer credentials again here. Supported params come from B668 inherited GPT list,
  then append verbosity when B668 is_gpt_reasoning_series_name(model) and absent, followed by reasoning_effort when
  _supports_reasoning is true and absent. _supports_reasoning calls B688 capability policy with provider bedrock_mantle,
  catches every exception, debug-logs BedrockMantleChatConfig: error checking reasoning support: %s and returns
  False. get_error_class uses B682 supplied fields; stream iterator is B504 OpenAIChatCompletionStreamingHandler
  with unchanged inputs. messages_auth_and_url: Native Messages constructor runs the inherited B622 constructor
  via B624 and keeps a truthy injected signer or self. It reports provider bedrock_mantle and uses_get_llm_provider_api_base=True.
  Its URL builder calls B2207 resolve_mantle_region with litellm_params copied and api_base overwritten even when
  None; ignores model/optional_params for this method. Choose truthy explicit base, BEDROCK_MANTLE_API_BASE, then
  https://bedrock-mantle.{region}.api.aws and trim trailing slashes. Remove only the first matching suffix in this
  order: /anthropic/v1/messages,/v1/messages,/messages,/anthropic/v1,/openai/v1,/v1. For a recognized Mantle host,
  replace the entire remaining base with https://bedrock-mantle.{resolved_region}.api.aws, discarding any leftover
  path; custom hosts keep their remaining path. Append /anthropic/v1/messages. Stream does not change this URL.
  mantle_passthrough_path: Passthrough region resolution delegates B2207 and ignores model/model_id. If api_base
  matches the Mantle hostname regex after trailing-slash trimming, pass api_base=None to B591 inherited runtime
  endpoint selection; otherwise pass it unchanged. Preserve aws_bedrock_runtime_endpoint, region and endpoint_type.
  This routes recognized Mantle bases to runtime while retaining their resolved region. Bearer lookup accepts only
  a string litellm_params.api_key, otherwise passes None to B2207. mantle_auth_failure: Catch exactly NoCredentialsError,PartialCredentialsError,ProfileNotFound,CredentialRetrievalError
  from the signing call and raise ValueError with message Bedrock Mantle auth failed: no Bearer token and no usable
  AWS credentials. Set BEDROCK_MANTLE_API_KEY (or AWS_BEARER_TOKEN_BEDROCK) or pass api_key for Bearer auth, or
  provide AWS credentials (IAM role / access key / profile / web identity) for SigV4. Preserve the cause in internal
  typed errors while redacting secrets. Region-selection failures happen before this try and pass through; other
  signer errors pass through unchanged. mantle_passthrough_reply_shape: For logging_non_streaming_response, choose
  provider bedrock only when endpoint contains converse and does not contain invoke; otherwise preserve custom_llm_provider.
  Forward every other argument to B658 logging_non_streaming_response and return its result/error unchanged. This
  is substring matching, so invoke takes priority when both occur; do not rewrite endpoint or request_data here.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Direct constructor/helper prerequisites used by this slice: B2214. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/mantle_settings.rs with adjacent tests under mantle_settings/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function mantle_settings_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): standalone_mantle_base, standalone_mantle_auth, chat_provider_prefix, messages_auth_and_url, mantle_passthrough_path,
  mantle_auth_failure, mantle_passthrough_reply_shape. Each case exercises its named outcome independently; use
  stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must
  not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_settings* using HelperCase: kind:
  helper and the externally tagged bedrock_mantle_settings variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_mantle_settings that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  B2207 owns BEDROCK_MANTLE_API_BASE, BEDROCK_MANTLE_API_KEY and BEDROCK_MANTLE_REGION configuration and loader
  cases. B598 owns aws_bedrock_project_id (default None). Consume those shared settings without registering the
  keys again.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_mantle_settings_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_mantle_settings_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 183 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 210 production lines, 280 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 630 planned, 650 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/mantle_settings.rs
  - crates/betterlite-bedrock/src/mantle_settings/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/mantle_settings.rs
  - tools/oracle/src/helpers/bedrock/mantle_settings/**
  - tools/oracle/helpers/bedrock_mantle_settings.py
  - tools/oracle/helpers/bedrock_mantle_settings/**
  - tools/oracle/cases/helpers/providers/bedrock-mantle-settings/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_settings*
  lint_tables: false
