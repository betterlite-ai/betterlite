checks:
  optional:
  - mutants
  commands:
  - id: case-standalone-mantle-base
    why: The standalone-mantle-base behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_settings_cases::case_[0-9]+_standalone_mantle_base$/)'
  - id: case-standalone-mantle-auth
    why: The standalone-mantle-auth behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_settings_cases::case_[0-9]+_standalone_mantle_auth$/)'
  - id: case-chat-provider-prefix
    why: The chat-provider-prefix behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_settings_cases::case_[0-9]+_chat_provider_prefix$/)'
  - id: case-messages-auth-and-url
    why: The messages-auth-and-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_settings_cases::case_[0-9]+_messages_auth_and_url$/)'
  - id: case-mantle-passthrough-path
    why: The mantle-passthrough-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_settings_cases::case_[0-9]+_mantle_passthrough_path$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_mantle_settings.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_settings*")"
      && grep -lq 'bedrock_mantle_settings' tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_settings* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_mantle_settings$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-bedrock-mantle-api-base
    why: The BEDROCK_MANTLE_API_BASE setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_settings_config_cases::case_[0-9]+_loads_bedrock_mantle_api_base$/)'
      && grep -lq 'BEDROCK_MANTLE_API_BASE' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_mantle_settings*
  - id: config-bedrock-mantle-api-key
    why: The BEDROCK_MANTLE_API_KEY setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_settings_config_cases::case_[0-9]+_loads_bedrock_mantle_api_key$/)'
      && grep -lq 'BEDROCK_MANTLE_API_KEY' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_mantle_settings*
  - id: config-bedrock-mantle-region
    why: The BEDROCK_MANTLE_REGION setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_settings_config_cases::case_[0-9]+_loads_bedrock_mantle_region$/)'
      && grep -lq 'BEDROCK_MANTLE_REGION' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_mantle_settings*
  - id: config-aws-bedrock-project-id
    why: The aws_bedrock_project_id setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_settings_config_cases::case_[0-9]+_loads_aws_bedrock_project_id$/)'
      && grep -lq 'aws_bedrock_project_id' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_mantle_settings*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_settings_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_mantle_settings*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_mantle_settings_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_mantle_settings_secret_safe_failure$/)'
