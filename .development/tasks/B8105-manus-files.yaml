id: B8105
title: Manus files API config
description: >-
  Build the Manus file provider, in the module manus_files of betterlite-provider. It covers litellm/llms/manus/files/transformation.py
  (ManusFilesConfig, 369 code lines) over B1015's file provider contract and B1128's file records. Manus has an OpenAI-shaped Files API
  with a two-step upload: POST /v1/files with {"filename": ...} returns a record with upload_url, then a PUT of the raw bytes to that URL.


  Provider and headers. custom_llm_provider is manus. The key is the explicit api_key, else the global api_key, else MANUS_API_KEY; no
  key raises ValueError "Manus API key is required. Set MANUS_API_KEY environment variable or pass api_key parameter." Headers get
  API_KEY and Content-Type application/json (the multipart comment in LiteLLM is wrong: it sets JSON). Supported create params are
  only purpose, and mapping returns the options unchanged. get_error_class returns the OpenAI error type with the status, message and
  headers.


  URL. The base is api_base, else the global api_base, else MANUS_API_BASE, else https://api.manus.im, trailing slashes removed;
  the URL is {base}/files when the base ends with /v1, else {base}/v1/files. The same function serves every operation.


  Create. transform_create_file_request needs create_file_data file; none raises ValueError "File data is required". The shared
  extract_file_data helper (B1128) gives filename and content; the filename defaults to "file_" plus the current unix seconds. The
  key is the litellm_params api_key, else global api_key, else MANUS_API_KEY, with the same ValueError when missing (api_key in
  litellm_params, not the header). The result is a two-step plan: the first request is POST to the files URL with headers API_KEY and
  Content-Type application/json and data {"filename": name}; the second is PUT to an empty URL (filled from the first reply) with no
  headers and the content bytes; the upload URL is read from the first reply body under the key upload_url.


  Create reply. If litellm_params carries initial_file_response, that stored first reply is used instead of the raw response (the
  second reply is the PUT result). The file object is id (default empty), bytes (default 0), created_at, filename (default empty),
  object file, purpose (default assistants), status always uploaded, status_details. created_at parses the first 19 characters of
  the created_at text (after replacing Z with +00:00) as %Y-%m-%dT%H:%M:%S; an empty or unparseable value gives the current unix seconds.
  Any failure while building raises ValueError "Error parsing Manus file response: <error>" and logs the exception.


  Other operations. Retrieve: URL {files URL}/{id} with the id encoded by B171's encode_url_path_segment (field name file_id), empty
  params; the reply goes through the create-reply routine with no model. Delete: the same URL and empty params; the reply body is
  built into the OpenAI file-deleted record. List: the files URL, params {purpose} only when purpose is truthy; the reply data list
  maps each item through the list parser. The list parser is the same as create except the status is the item's status (default
  uploaded). Content: URL {files URL}/{id}/content with empty params; the reply is wrapped as binary content.
