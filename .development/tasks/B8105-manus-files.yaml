deviations:
  - what: created_at text is read as UTC. LiteLLM turns it into a unix time with time.mktime, which uses the server's local time zone.
    why: Manus sends UTC. On a UTC host both agree, and an offset depending on the host zone is a bug, not a feature.
  - what: The 19-character cut still applies, so a fractional second or an offset in the text is ignored as in LiteLLM.
    why: Keeps the same parsed seconds as LiteLLM on a UTC host.
out_of_scope:
  - "The file contract (BaseFilesConfig, TwoStepFileUploadConfig) belongs to B1015 and B1128; the HTTP upload execution belongs to B2461 and B2480 to B2482."
  - "Choosing ManusFilesConfig for the manus provider (utils.py L9429) belongs to B2464, which depends on B050."
  - "files/main.py handling of the manus provider (supported lists, error texts) belongs to the file API tasks."
  - "The Manus Responses API belongs to B8104."
pitfalls:
  - The create reply is built from the first reply stored in litellm_params under initial_file_response, so the PUT response body is ignored when it exists.
  - status is the fixed text uploaded on create and retrieve, but a list item keeps its own status.
  - The API key for the two-step plan comes from litellm_params, not from the headers built by validate_environment.
  - The upload PUT has no headers and an empty URL until the first reply fills the URL from the body key upload_url.
  - Delete builds FileDeleted from the whole body with keyword arguments, so an unexpected shape fails there rather than being defaulted.
  - A purpose of "" is dropped from list params because only a truthy purpose is sent.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
