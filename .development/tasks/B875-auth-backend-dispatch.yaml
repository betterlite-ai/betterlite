dod:
  - text: 'Native cases cover oauth_nonjwt_llm_info_only, jwt_override_route_boundary,
      oauth_before_proxy_before_jwt, nonjwt_fallthrough, mapped_key_claims_and_empty_token,
      mapped_email_identity_match, backfill_failure_debug_drop, managed_agent_mapping_403,
      pending_policy_before_create, scim_literal_false_401, admin_sentinel_ttl_and_early_return,
      pending_without_db, registration_none_keeps_identity, registration_keeps_user_budget,
      zero_cost_logs_skip_budget, project_fields_before_budget and budget_429_envelope.'
    proof:
      - behavior-tests
  - text: Disabled JWT/OAuth and ordinary bearer fallthrough match the MIT HTTP server; native server tests
      jwt_without_license and oauth_without_license exercise the enabled branches that MIT gates with 403.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_backend_dispatch::tests::/)
        - test(/replays_the_/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_backend_dispatch::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-backend-dispatch-*")"
        && grep -rlq "enable_oauth2_auth" crates/betterlite-config/fuzz/corpus/config_yaml/auth-backend-dispatch-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_backend_dispatch::tests::/)
        - test(/replays_the_/)'
