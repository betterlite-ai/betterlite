pitfalls:
  - A resolved mapping falls through to virtual-key checks, whereas standard JWT returns here; merging those paths loses key restrictions or double-checks budgets.
  - Auto-registration must carry user_model_max_budget from the loaded user, since the new key row has no user budget.
