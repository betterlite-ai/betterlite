id: B875
title: Dispatch JWT and OAuth authentication stages
description: >-
  Implement the JWT/OAuth dispatch stage of authentication using installed AuthBackend ports. Preserve
  OAuth override selection only for inference/info routes, JWT mapped-key flow, managed-agent mapping
  prohibition (403), SCIM inactive-user refusal (401), and the user-model budget sequence. B053 installs
  JWT/OAuth and B054 custom callables; this stage cannot treat an absent configured backend as authenticated.
  Define AgentIdentity::resolve(VerifiedClaims)->Result<Option<ManagedAgent>,AuthError> and record(ManagedAgent)->Result<IdentityEvidence,AuthError>
  ports; B141 implements them.


  Injected port instead of a reverse dependency on B053: AuthBackend::jwt(SecretString,RequestContext)->Result<AuthContext,AuthError>;
  B053 installs the verifier/identity implementation. A configured but unregistered implementation is
  a named startup error, never a success stub.


  Own JwtKeyMapping::resolve and register_after_policy operations with resolved-key, PendingAutoRegister
  and no-mapping outcomes. B053 installs B766 behind these operations; this stage calls only its own
  typed port, never B766 directly, since B766 reaches the B052 installer through SCIM. The registration
  operation accepts the validated team/user/org/end-user/agent identity and pending claim/cache fields.


  B768 supplies OAuth introspection and trusted proxy-header authentication. The standard JWT builder
  remains an injected operation owned by this stage and installed by B053, avoiding a call back into
  its installer. Its verified result conversion is part of that operation's contract, not another
  call to B053. JWT recognition/claim accessors come from B760 and verification from B762, safe headers from
  B1100, route predicates/method from B882, user lookup from B736, project lookup from B879, zero-cost
  classification from B750, model extraction from B881 and user budget enforcement from B753.

  All three enable flags activate only on literal True. Global OAuth applies only to LLM/info routes
  and non-JWT inputs; an explicit routing override can send a JWT to OAuth on those routes. This
  choice precedes enable_oauth2_proxy_auth, which otherwise returns immediately before JWT handling.
  Non-JWT tokens fall through. Mapping verifies claims first; a managed-agent match raises HTTP 403
  auth_error with param "None". Resolved mappings replace api_key with token or empty string and
  retain jwt_claims, then fall through to virtual-key checks outside this task. Backfill a missing
  email only when claim user_id matches key user_id and claim email is present; fetch without upsert,
  use the returned row's email, and debug-log/drop any lookup failure.

  Standard JWT auth receives body, route, safe headers and request method. Refuse metadata.scim_active
  only when it is literal False, with 401 auth_error/param "None". Proxy admins return immediately;
  pending registration first caches __JWT_PROXY_ADMIN__ under its pending cache key with configured TTL.
  Non-admin pending registration runs only after full JWT policy and only with a database. A returned
  key retains verified claims, email and the already-loaded user's model_max_budget; None leaves the
  JWT identity unchanged. Resolve the model with the selected team. A zero-cost model logs and skips
  user-model budget checks only. Fetch a project when project_id exists and copy metadata/alias if found;
  then check every B881 budget model name unless zero-cost and return the resulting token. This range
  neither invokes centralized common checks nor reserves a budget. Failures propagate through B757's
  auth exception projector; budget failures are 429 budget_exceeded with null param.


  Build the production auth_backend_dispatch module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _user_api_key_auth_builder.backend_dispatch (L1603-L1856; 192 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.enable_oauth2_auth=False;
  general_settings.enable_jwt_auth=False; general_settings.enable_oauth2_proxy_auth=False;
  litellm_jwtauth.virtual_key_mapping_cache_ttl=300.


  Drive backend dispatch through B732's installed stage and an actual inference route. Native JWT/OAuth
  cases prove the license deviation; the MIT corpus contains only branches reachable without enterprise.
  Provision its auth rows through B860 using POSTGRES_TEST_URL, or testcontainers when absent.


  Write betterlite-config::auth_backend_dispatch::tests::flags_default_false, literal_true_enables,
  string_true_does_not_enable and mapping_ttl_default_and_override.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  Sizing: 192 nonblank, noncomment pinned source lines; allow
  220 production, 280 behavior/server tests, 65 wiring and 60 config lines, 625 within a 650-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_backend_dispatch::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
