id: B790
title: User mutation fields and role scope
description: >-
  Implement typed user create/update/bulk fields, password stripping/hashing, duplicate identity checks,
  default team enrollment and role projection. Use organization role lookup as a reusable authorization
  primitive; enforce no paid-tier user cap. Creating membership uses repository transactions and the source
  default-team validation. litellm_settings.default_internal_user_params defaults absent; its teams field
  accepts strings or NewUserRequestTeam records. Mixed invalid team entries retain the source error log
  and no default-team result, rather than making every user create fail.


  Build the production user_fields module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/types/proxy/management_endpoints/internal_user_endpoints.py:
  BulkUpdateUserRequest.validate_request (L52-L72; 13 source lines), BulkNewUserItem.reject_invite_email
  (L126-L129; 4 source lines). litellm/proxy/management/users/service.py: holds_org_admin (L13-L17; 5
  source lines), PrismaOrgRoles.is_org_admin (L26-L36; 10 source lines). litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _user_table (L121-L125; 5 source lines), _team_table (L128-L132; 5 source lines), _verification_token_table
  (L135-L141; 7 source lines), _organization_membership_table (L148-L154; 7 source lines), _invitation_link_table
  (L157-L163; 7 source lines), _organization_table (L166-L172; 7 source lines), _team_membership_table
  (L175-L181; 7 source lines), _hash_password_in_dict (L184-L203; 18 source lines), _strip_password_from_response
  (L206-L213; 8 source lines), _update_internal_new_user_params (L216-L249; 27 source lines), _check_duplicate_user_field
  (L252-L291; 35 source lines), _check_duplicate_user_email (L294-L304; 11 source lines), _check_duplicate_user_id
  (L307-L316; 10 source lines), _add_user_to_organizations (L319-L351; 32 source lines), _add_user_to_team
  (L354-L410; 56 source lines), _fetch_user_team_ids (L470-L472; 3 source lines), ui_get_available_role
  (L681-L707; 25 source lines), get_team_from_list (L710-L720; 10 source lines), _is_valid_user_id (L723-L732;
  9 source lines), get_user_id_from_request (L735-L753; 15 source lines), _normalize_user_info_user_id
  (L756-L760; 5 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.default_internal_user_params=None;
  litellm_settings.max_internal_user_budget=None; litellm_settings.internal_user_budget_duration=None.


  Register these actual HTTP routes and aliases exactly once: GET /user/available_roles -> ui_get_available_role.
  For each route send a typed successful request, an invalid or missing target, and a caller lacking that
  route permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::user_fields::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 341 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  341 production, 151 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 607 changed lines estimated within a 625-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
