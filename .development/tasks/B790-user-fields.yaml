id: B790
title: User mutation fields and role scope
description: >-
  Implement user mutation preparation, duplicate checks, membership dispatch and available-role
  projection. B2334 owns the split bulk records and user-info query decoder; B1226 owns default-team
  enrollment and mixed-entry validation. No owned branch checks premium_user, and the membership
  helpers here do not introduce a transaction around their calls.

  _hash_password_in_dict mutates only a present non-null password: B786 strength and breach checks
  unless password_prevalidated=true, then hash, set password_reset_required=true and
  last_breach_check_at=null. Empty password is validated; explicit null is untouched.
  _strip_password_from_response only handles dicts: remove top-level password and one nested data
  dict's password or data object's __dict__.password; bare models and deeper nesting are untouched.
  Cases password_absent_null_empty, password_prevalidated_hashes, password_validation_no_mutation
  and strip_password_supported_shapes cover each branch.

  New-user preparation generates a UUID only for an EXISTING user_id=null, pops auto_create_key
  default true and sets table_name=user only for exactly false. For non-proxy-admin requested
  roles, truthy default_internal_user_params fills missing/null fields or an empty models list,
  skipping available_teams and preserving other falsey values. Requested role exactly internal_user
  additionally fills null max_budget/budget_duration from their non-null global defaults. Pop teams
  last. Cases new_id_absent_vs_null, auto_key_exact_false, defaults_skip_admin,
  defaults_null_and_empty_models, defaults_preserve_falsey, internal_role_budget_defaults and
  teams_removed_last load and consume all three settings, whose defaults are null.

  Duplicate checks skip falsey input before requiring DB. Otherwise strip input then find_first
  with equals; email adds mode=insensitive and label=email, ID stays case-sensitive with label=id.
  Whitespace-only input still queries empty string. A match raises HTTPException 409 detail.error
  naming the existing field value (attribute fallback to stripped input). Missing DB raises an
  ordinary database-not-connected exception; callers map it. Cases duplicate_empty_skips_db,
  duplicate_whitespace_queries_empty, duplicate_email_casefold, duplicate_id_case_sensitive,
  duplicate_existing_value_message and duplicate_db_absent pin reads and errors.

  Organization additions concurrently call B828 member-add for each supplied ID, including
  duplicates, with one member user_id/role=internal_user, original caller and synthetic path
  /user/new. gather(return_exceptions=true) discards ALL per-org failures without logging.
  Cases org_member_shape and org_failures_discarded preserve that behavior. Team additions call
  B808 with role default user, email/budget null. HTTPException 400 containing 'already exists'
  or "doesn't exist" logs debug; other HTTPExceptions log error but are STILL swallowed.
  Other exceptions with either substring, or ProxyException type containing
  team_member_already_in_team, log debug and are swallowed; other exceptions log error and rethrow.
  Cases team_member_arguments, team_http_known_debug, team_http_other_swallowed,
  team_proxy_duplicate_debug and team_unexpected_rethrows distinguish all paths. Native code
  invokes dependency services, never their FastAPI wrappers; helpers inject those service boundaries.

  _fetch_user_team_ids returns row.teams as tuple or () for no row. get_team_from_list returns
  the first exact team_id match or null. holds_org_admin requires non-null user and any matching
  membership with role exactly org_admin; PrismaOrgRoles first calls B736 get_user_object with
  user_id_upsert=false. Cases fetch_teams_missing, first_team_match, org_admin_exact_membership
  and org_lookup_no_upsert assert arguments/null handling. Flatten trivial table accessors into
  B722/B723/B724/B726 repository operations instead of writing one-line Rust wrappers.

  GET /user/available_roles is hidden from OpenAPI, authenticated, and has no handler permission
  gate, selector, mutation, wrapper or except block. Every authorized caller receives exactly
  proxy_admin,proxy_admin_viewer,internal_user,internal_user_viewer in enum order with B2314's
  description/ui_label literals; omit org_admin,team,customer. available_role_subset_and_literals
  and available_roles_same_for_callers compare all descriptions/labels through HTTP. No route
  target or handler-level unauthorized error exists; outer auth errors remain B052's.


  Build the production user_fields module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including native records: litellm/proxy/management/users/service.py: holds_org_admin (L13-L17; 5
  source lines), PrismaOrgRoles.is_org_admin (L26-L36; 10 source lines). litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _user_table (L121-L125; 5 source lines), _team_table (L128-L132; 5 source lines), _verification_token_table
  (L135-L141; 7 source lines), _organization_membership_table (L148-L154; 7 source lines), _invitation_link_table
  (L157-L163; 7 source lines), _organization_table (L166-L172; 7 source lines), _team_membership_table
  (L175-L181; 7 source lines), _hash_password_in_dict (L184-L203; 18 source lines), _strip_password_from_response
  (L206-L213; 8 source lines), _update_internal_new_user_params (L216-L249; 27 source lines), _check_duplicate_user_field
  (L252-L291; 35 source lines), _check_duplicate_user_email (L294-L304; 11 source lines), _check_duplicate_user_id
  (L307-L316; 10 source lines), _add_user_to_organizations (L319-L351; 32 source lines), _add_user_to_team
  (L354-L410; 56 source lines), _fetch_user_team_ids (L470-L472; 3 source lines), ui_get_available_role
  (L681-L707; 25 source lines), get_team_from_list (L710-L720; 10 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.default_internal_user_params=None;
  litellm_settings.max_internal_user_budget=None; litellm_settings.internal_user_budget_duration=None.


  The single route uses B001 HTTP. B171 user_fields helper cases cover pure preparation and
  injected membership/repository effects; no helper invokes the available-roles route or the
  dependency FastAPI wrappers. Duplicate-query integration uses POSTGRES_TEST_URL or
  testcontainers, unique schemas and failing infrastructure checks.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Config tests defaults_null_and_empty_models, defaults_preserve_falsey and
  internal_role_budget_defaults load all three settings through B002 and inspect prepared user
  fields. This code has no generic invalid-value fallback or additional env parser.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 295 nonblank, noncomment function lines before docstring removal after the B2334 split;
  allow 285 production, 300 behavior/Postgres tests, 65 helper adapters, 65 HTTP wiring and
  50 config lines, 765 changed lines within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.




  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
