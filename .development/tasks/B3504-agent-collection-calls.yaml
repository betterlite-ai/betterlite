dod:
- text: >-
    Sync and async create/list operations match LiteLLM on the HTTP request sent
    upstream (method, path, body, headers) and on typed response.
  proof:
    - oracle
- text: >-
    Default provider is Gemini; when absent from args or kwargs.custom_llm_provider, all four
    calls use "gemini".
  proof:
    - behavior-tests
- text: >-
    Agent name is forwarded into the logging object's optional_params dict under the key "name"
    for create operations; list operations pass an empty string as the model name.
  proof:
    - behavior-tests
- text: >-
    All four operations call B3501's _get_agents_api_config and _make_logging_obj with the
    operation call_type (create_agent for create, list_agents for list) and name as the optional param.
  proof:
    - behavior-tests
- text: >-
    Exceptions wrap the original error through litellm.exception_type with the agent name
    (not empty string) as the model for create, and empty string for list operations.
  proof:
    - behavior-tests
- text: >-
    Async variants delegate to their sync counterparts using loop.run_in_executor with
    contextvars.copy_context, passing an operation-specific flag (acreate_agent for create,
    alist_agents for list) in kwargs.
  proof:
    - behavior-tests
- text: >-
    Create operations accept and forward base_agent, instructions, base_environment as kwargs
    to GenericLiteLLMParams and extra_headers, extra_body to the HTTP handler.
  proof:
    - behavior-tests
