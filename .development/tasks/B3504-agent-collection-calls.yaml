out_of_scope:
- B3501 owns provider/logging setup (_get_agents_api_config, _make_logging_obj).
- B3502 owns HTTP creation and listing (create_agent, list_agents methods).
- B3503 owns HTTP deletion and version listing (delete_agent, list_agent_versions methods).
- B3505 owns item operations (get, delete, list_versions entry points).
- Client lifecycle and context decorators; those belong to betterlite-core's shared infrastructure, not this task.
- B185/B186 exception construction; this task only calls litellm.exception_type.
- B198 timeout/context propagation; this task forwards kwargs unmodified and respects the existing propagation.
pitfalls:
- >-
  The acreate_agent and alist_agents flags are popped from kwargs before HTTP delegation, not passed downstream.
  Create operations forward base_agent, instructions, and base_environment (when non-None) as explicit sync-variant parameters, while list passes only the provider and optional parameters; both check if the sync response is a coroutine before awaiting.
- >-
  Create operations require an agent name and optional base_agent, instructions, base_environment parameters.
  These are forwarded as kwargs to GenericLiteLLMParams when non-None. List operations take no name parameter and pass
  an empty string as the model name to both logging and exception construction.
- >-
  Extra headers and extra body parameters apply to both sync and async paths. Create operations forward extra_body
  to the HTTP handler after provider transforms; list operations also accept these parameters but may not apply them.
- >-
  Default provider assignment happens before the try block in both async and sync paths, defaulting to Gemini when absent
  from the function parameter or kwargs.custom_llm_provider. This ensures provider is available for logging and exception
  construction within the block.
review_level: standard
