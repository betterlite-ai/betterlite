id: B3504
title: Create and list managed agents through the call pipeline
description: >-
  Expose the sync/async agent creation and listing entry points, keeping name-based error/log metadata
  and the explicit default provider. Implement acreate, create, alist and list entry points. Each pair follows the
  async-to-sync pattern: the async variant calls loop.run_in_executor with a context copy forwarding to its sync
  counterpart, passing an operation-specific flag in kwargs. Both sync and async return typed results from agents.types
  (AgentCreateResponse for create, AgentListResponse for list). Default provider is Gemini when absent from args or
  kwargs.custom_llm_provider. All four operations acquire the agents config through B3501's _get_agents_api_config and
  build logging metadata with operation name (create_agent for create, list_agents for list) and agent name (for create)
  or empty string (for list) as the optional param. Create also accepts base_agent, instructions, base_environment,
  extra_headers and extra_body parameters, forwarding them as kwargs to GenericLiteLLMParams or as override fields to
  the HTTP handler. Delegate HTTP work to B3502 (create_agent and list_agents methods). Wrap exceptions through
  litellm.exception_type with the agent name or empty string as model, provider and original exception. Implement the
  four functions in crates/betterlite-core/src/api/agents/collection.rs and their Rust/Python oracle adapters.
