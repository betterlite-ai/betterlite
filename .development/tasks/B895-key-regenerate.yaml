id: B895
title: Regenerate keys and preserve deprecated overlap
description: >-
  Implement POST /key/regenerate and /key/{key:path}/regenerate using the shared key persistence/patch
  services and can_modify_verification_token. Preserve owner/team-admin checks, team-member /key/regenerate
  permission, guardrail/pass-through escalation guards, deprecated-key overlap and master-key delegation
  to B785. Axum cannot put a catch-all before /regenerate: mount one trailing /key/{*tail} dispatcher
  that splits the final /regenerate or /reset_spend suffix and forwards a validated key to the same handler;
  literal /key/regenerate has precedence. Own this dispatcher here; B780 later installs the
  reset_spend handler into its typed slot. Do not call B780 or mount a second catch-all.

  Run raw allowed_routes, passthrough and permissions guards in that order, then B1224.handle_key_type
  against a fresh empty dict and B892's safe-preset recheck. The derived preset is only validated;
  it is not copied into the update payload. Body data.key wins only when truthy, otherwise use the
  path/query key. Source premium bypass requires BOTH nonnull new_master_key and B069's actual
  master-key match; merely supplying new_master_key does not bypass it. Native omits the paid gate
  but preserves all authorization checks. Missing/empty target gives HTTP 400 'No key passed in.';
  missing DB gives 500 'DB not connected. prisma_client is None'. A master target with a body
  requires new_master_key, else 400; B785 rotates it and returns key/token/key_name all equal to the
  new master key and expires None. A master target without a body takes the virtual lookup path.

  Virtual lookup hashes any key containing the substring sk, not just the sk- prefix; other values
  are already ids. Use B2362's unconditional hash for that branch. Missing row is HTTP 404; redact
  the supplied credential in its message as the deviation below requires. Then guardrail opt-out
  uses B861 against stored metadata (no data is a no-op), B800 checks KEY_REGENERATE team-member
  permission, and B777.can_modify_verification_token checks ownership/team administration. A false
  result gives HTTP 403 'You are not authorized to regenerate this key'. Do not replace these with
  a blanket non-admin denial. For truthy access_group_ids OR nonnull object_permission, fetch the
  EXISTING team with check_db_only True, check member access-group delegation, then B818 MCP,
  search-tool and vector-store grants in that order. Store MCP normalization back into data before
  the next checks. Explicit empty access_group_ids alone skips this branch. Log alias/info and row
  debug, normalize a nonstring internal changed-by value to None, then call B896 with the original
  key, hash, row, caller and header. No write occurs in this handler before that call except B785's
  master branch; B896 owns partial effects and events.

  The route's own except at L5984-L5986 logs and really calls B124.handle_exception_on_proxy.
  HTTPException retains status/detail but becomes internal_server_error, nullable param and matching
  code; ProxyException preserves its type/status/param/code; other exceptions default to 500
  internal_server_error unless carrying status_code. This is not update_key_fn's auth_error mapper.


  Build the production key_regenerate module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _check_regenerate_guardrail_opt_out (L5701-L5713; 13 source lines), regenerate_key_fn (L5727-L5986;
  214 source lines).


  LITELLM_KEY_ROTATION_GRACE_PERIOD is read only by B896's deprecated-row helper, not this route.


  Register these actual HTTP routes and aliases exactly once: POST /key/{key:path}/regenerate -> regenerate_key_fn;
  POST /key/regenerate -> regenerate_key_fn. MIT HTTP equality covers pre-license permission errors,
  missing authentication and the authorized master-key branch. Virtual regeneration and its later
  denials are native booted-server cases outside equality because the MIT license gate prevents
  reaching them. Compare full JSON/error fields, application/json and changed-by effects on both
  route spellings, including encoded slashes handled by the shared tail dispatcher.


  The regeneration HTTP tests need real key/team ownership rows in B860's separate schemas. Select
  POSTGRES_TEST_URL before testcontainers and fail if the selected fixture cannot start. The named
  postgres_pinned_rows and postgres_failure_effects checks inspect B896's resulting token and archive
  state through the route, including failures after an earlier committed write.


  Settings loading stays with B896/B785; the route adds no independent configuration decoder.


  Sizing: 227 lines before docstring exclusion; allow 230 production, 330 behavior/Postgres/HTTP
  tests and 65 route wiring, 625 within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
