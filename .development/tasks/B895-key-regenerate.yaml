    why: README removes paid gates. native_virtual_regeneration_without_license tests the real HTTP routes outside equality.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L5839-L5844
  - what: A missing-key 404 does not echo the supplied raw credential in its message.
