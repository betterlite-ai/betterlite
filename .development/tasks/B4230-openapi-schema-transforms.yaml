id: B4230
title: OpenAPI schema components and inline request bodies
description: >-
  Build a shared betterlite-openapi schema-transform module that accepts typed schema trees
  (JSON objects and arrays), merges component definitions, and expands request bodies for documentation
  without changing runtime validation. Expose both component-based decoration via `add_schema_to_components`,
  `add_request_body_to_paths` and `add_request_schema`, and self-contained inline request bodies via
  `inline_request_body`, so decision routes and proxy documentation can use it independently of the server.
  Preserve namespace prefixes in collisions, remove `$defs`, retain only path parameters in expanded forms,
  skip absent POST operations, and handle schema-generation failures gracefully. The inline expansion has
  a depth limit of 32, sibling field overrides, removal of discriminator mappings, and a required example-only
  body when schema generation fails. A missing referenced definition raises; do not silently synthesize it.
  Direct dependencies are none; TypeAdapter schema generation is a third-party boundary. B123's three
  endpoint-specific decorators call `add_request_schema` through this task; route callers depend on B4230,
  not on B123. All owned helper calls stay internal; neither mutual reference-rewrite recursion nor
  fixed-point recursion crosses a task boundary. Add oracle helper support to tools/oracle/src/helpers/mod.rs
  to call the openapi_schema_transforms operations, and create YAML helper cases under
  tools/oracle/cases/helpers/openapi-schema-transforms/ for each behavior, validating both Rust and LiteLLM
  implementations produce identical output.
