    why: "get_pydantic_schema wraps TypeAdapter schema generation and logs/suppresses exceptions."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/custom_openapi_spec.py#L68-L99
