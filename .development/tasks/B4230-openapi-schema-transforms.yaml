    - crates/betterlite-openapi/fuzz/corpus/openapi_schema/*
    - tools/oracle/src/helpers/openapi/schema_transforms.rs
    - tools/oracle/src/helpers/openapi/schema_transforms/**
    - tools/oracle/helpers/openapi_schema_transforms.py
    - tools/oracle/helpers/openapi_schema_transforms/**
    - tools/oracle/cases/helpers/openapi-schema-transforms/**
  lint_tables: false
