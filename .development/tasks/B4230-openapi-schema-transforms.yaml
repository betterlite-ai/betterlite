    why: "_inlined and inline_request_body expand all $defs in place with 32-depth limit and discriminator removal."
dod:
  - text: >-
      Collision detection iterates to fixed point, comparing property names and required-field sets (not full schemas).
      Moving defs with namespace prefixes preserves discrimination between overlapping names. Same-named defs with identical
      properties and required fields reuse existing components; different shapes trigger renames. Orphaned references raise.
    proof: [collision-tests, reference-rewrite-tests, oracle]
  - text: >-
      The messages field receives a constant example [{"role": "user", "content": "Hello, how are you?"}] that overrides
      normal expansion. All other fields are expanded in place for Swagger UI. Schemas with generation failures return
      required-only requestBody with example fallback. Depth 32 terminates inline expansion; references beyond remain as $ref.
    proof: [inline-expansion-tests, fallback-tests, oracle]
  - text: >-
      POST operations missing from a path are skipped; path parameters are retained in expanded forms; conflicting query
      parameters are removed. Inline expansion respects depth limits (exact boundary at 32), expands all $defs in place,
      removes discriminator mappings, and produces minimal fallback when generation fails.
    proof: [inline-expansion-tests, fallback-tests, openapi-corpus, oracle]
checks:
  optional:
    - mutants
  commands:
    - id: collision-tests
      why: Collision detection must reach fixed point and discriminate by shape.
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^schema_transforms::tests::.*collision($|::)/)'
    - id: reference-rewrite-tests
      why: References must be rewritten with correct namespace and orphaned defs must be rejected.
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^schema_transforms::tests::.*rewrite($|::)/)'
    - id: inline-expansion-tests
      why: Inline expansion must respect depth limit and expand all references in place.
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^inline_expansion::tests::/) - test(/::replays_corpus$/)'
    - id: fallback-tests
      why: Schema generation failures must produce minimal requestBody with example.
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^schema_transforms::tests::.*fallback($|::)/)'
    - id: api-tests
      why: Public API surface must be present and free of one-line forwarding functions.
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^lib::tests::/) - test(/::replays_corpus$/)'
    - id: openapi-corpus
      why: Fuzz targets must exist and replay their corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openapi/fuzz/corpus/openapi_schema/*)" && cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(replays_the_openapi_schema_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/openapi-schema-transforms/collision-same-shape.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/collision-different-shape.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/fixed-point-rename.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/messages-example.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/path-parameters-handling.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/inline-depth-limit.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/discriminator-removal.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/missing-reference.yaml
  - tools/oracle/cases/helpers/openapi-schema-transforms/schema-generation-fallback.yaml
deviations: []
out_of_scope:
  - "litellm/proxy/common_utils/custom_openapi_spec.py:249-275, _extract_field_schema:
    no caller at the pin."
  - "The source's Pydantic schema generation through TypeAdapter is a third-party dependency
    boundary; betterlite does not depend on TypeAdapter itself at this task's layer."
pitfalls:
  - 'The oracle helper for this task is pre-registered as openapi_schema_transforms in the openapi group. Replace the stub Op in tools/oracle/src/helpers/openapi/schema_transforms.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openapi_schema_transforms.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Collision detection must iterate to fixed point because renamed references appear in newly added defs.
  - The messages field requires a constant example overriding normal expansion to match LiteLLM's swagger display.
  - Depth limits in inline expansion are exact; hitting 32 stops further traversal to prevent unbounded recursion.
  - Missing referenced definitions raise rather than returning empty schemas to surface schema composition errors.
  - Discriminator mappings are dropped during inlining because Swagger UI cannot resolve them in inline schemas.
budget:
  max_changed_lines: 600
  max_new_expects: 0
review_level: standard
