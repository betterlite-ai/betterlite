id: B7944
title: Python types for auto router, prompt cache prediction and prompt caching requests (types/management_endpoints)
description: >-
  This task ports `management_endpoints/auto_router_endpoints.py` (659 lines), `prompt_cache_prediction.py` and
  `prompt_caching_requests.py` into `crates/betterlite-python/python/betterlite/types/management_endpoints/`. It is Python only.


  `auto_router_endpoints.py` has `RequestComplexityRouterConfig` (extends `ComplexityRouterConfig`, which lives in the router config
  types and has no Python owner; use the fields the LiteLLM class has), the validation request and response, availability request, allowance
  and response, and the routing test classes, 19 classes in all. `prompt_cache_prediction.py` has six pydantic models from
  `CacheTokenBuckets` to `CachePredictionResponse`. `prompt_caching_requests.py` has the request, cursor and response models.
scope:
  paths:
  - crates/betterlite-python/python/betterlite/types/management_endpoints/auto_router_endpoints.py
  - crates/betterlite-python/python/betterlite/types/management_endpoints/prompt_cache_prediction.py
  - crates/betterlite-python/python/betterlite/types/management_endpoints/prompt_caching_requests.py
  - crates/betterlite-python/tests/test_types_mgmt_router_and_prompt_cache.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/auto_router_endpoints.py#L1-L659
  why: Auto router request and response models.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/prompt_cache_prediction.py#L1-L49
  why: Cache prediction models.
out_of_scope:
- >-
  cache_settings, coordination_redis and router_settings endpoints are in B7945. `management_endpoints/__init__.py` is B167's.
pitfalls:
- >-
  `ComplexityRouterConfig` has no Python owner at this pin. Port `RequestComplexityRouterConfig` with its own fields and put a note in the test file; the architect decides in the notes.
dod:
- text: Every name in the covered LiteLLM files exists with the same keys, required keys, Literal values, Enum members and field defaults.
  proof: [names]
- text: Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: names
    why: A name, key or value differs from LiteLLM.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_mgmt_router_and_prompt_cache.py -k names
  - id: python-lint
    why: Strict typing has to hold for every ported module.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Names imported from the openai, httpx or pydantic packages are replaced by local equivalents or left out.
  why: The wheel depends only on python-dotenv.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
