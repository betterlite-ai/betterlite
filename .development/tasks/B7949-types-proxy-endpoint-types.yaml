id: B7949
title: Python types for the small proxy endpoint files (types/proxy, agent identity to vantage)
description: >-
  This task ports 17 small files under `litellm/types/proxy/` into `crates/betterlite-python/python/betterlite/types/proxy/`: `agent_identity`, `auth/auth_checks`,
  `callback_logs_endpoints`, `carried_budget_state`, `claude_code_endpoints`, `cloudzero_endpoints`, `compliance_endpoints`,
  `control_plane_endpoints`, `discovery_endpoints/` (agent_skills_endpoints, ui_discovery_endpoints), `gateway_requests`,
  `litellm_pre_call_utils`, `model_access_group_budget`, `model_deprecation`, `model_listing`, `prompt_endpoints`,
  `spend_capture_rate` and `vantage_endpoints`. It is Python only.


  Mostly pydantic request and response models. Other kinds: `_BudgetSnapshot` and four subclasses in `carried_budget_state.py`;
  `UserNotFoundError(ValueError)` in `auth_checks.py`; `RedactedDict(dict)` and the `SecretFields` TypedDict in
  `litellm_pre_call_utils.py`; two TypedDicts in `model_listing.py`; the plain classes `GatewayRequestKey` and `GatewayRequestCounts` in
  `gateway_requests.py`.
scope:
  paths:
  - crates/betterlite-python/python/betterlite/types/proxy/agent_identity.py
  - crates/betterlite-python/python/betterlite/types/proxy/auth/**
  - crates/betterlite-python/python/betterlite/types/proxy/callback_logs_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/carried_budget_state.py
  - crates/betterlite-python/python/betterlite/types/proxy/claude_code_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/cloudzero_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/compliance_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/control_plane_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/discovery_endpoints/**
  - crates/betterlite-python/python/betterlite/types/proxy/gateway_requests.py
  - crates/betterlite-python/python/betterlite/types/proxy/litellm_pre_call_utils.py
  - crates/betterlite-python/python/betterlite/types/proxy/model_access_group_budget.py
  - crates/betterlite-python/python/betterlite/types/proxy/model_deprecation.py
  - crates/betterlite-python/python/betterlite/types/proxy/model_listing.py
  - crates/betterlite-python/python/betterlite/types/proxy/prompt_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/spend_capture_rate.py
  - crates/betterlite-python/python/betterlite/types/proxy/vantage_endpoints.py
  - crates/betterlite-python/tests/test_types_proxy_endpoint_types.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/agent_identity.py#L1-L69
  why: Agent identity models.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/claude_code_endpoints.py#L1-L105
  why: Plugin models.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/litellm_pre_call_utils.py#L1-L15
  why: RedactedDict and SecretFields.
out_of_scope:
- >-
  Management endpoint types are in B7944 to B7947.
pitfalls:
- >-
  `RedactedDict(dict)` in `litellm_pre_call_utils.py` is the one class here with behavior (it subclasses `dict`). Read its source and test its `repr` and item access against LiteLLM.
dod:
- text: Every name in the covered LiteLLM files exists with the same keys, required keys, Literal values, Enum members and field defaults.
  proof: [names]
- text: Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: names
    why: A name, key or value differs from LiteLLM.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_proxy_endpoint_types.py -k names
  - id: python-lint
    why: Strict typing has to hold for every ported module.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Names imported from the openai, httpx or pydantic packages are replaced by local equivalents or left out.
  why: The wheel depends only on python-dotenv.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
