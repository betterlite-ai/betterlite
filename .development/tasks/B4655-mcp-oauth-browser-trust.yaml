      cookie_wrong_signature, cookie_missing_exp, cookie_expired, cookie_wrong_type, cookie_missing_login_method,
      cookie_missing_user_id, cookie_empty_user_id, cookie_with_optional_key, cookie_blob_token_no_key,
      cookie_sk_key_revoked and cookie_valid_with_key.'
