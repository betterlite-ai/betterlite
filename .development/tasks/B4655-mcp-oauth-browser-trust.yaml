id: B4655
title: MCP redirect trust and dashboard session admission
description: >-
  Build session admission from the UI dashboard cookie and redirect_uri trust policies for MCP OAuth flows.
  When users grant BYOK credentials through the dashboard, accept the signed ``token`` cookie to re-authorize
  those writes without re-login. When MCP clients register or complete OAuth flows, only accept redirect URIs
  that point back to the proxy's own origin (same-origin protection), to a loopback address (RFC 8252 native
  client pattern), or to an ops-trusted first-party host listed in ``MCP_TRUSTED_REDIRECT_ORIGINS``. Native
  clients with custom schemes may use allowlisted private-use URIs set in ``MCP_TRUSTED_NATIVE_REDIRECT_URIS``.


  Production ownership, including trust policy and cookie session handling: litellm/proxy/_experimental/mcp_server/oauth_utils.py:
  validate_loopback_redirect_uri (L239-275; 37 source lines), validate_redirect_uri_shape (L454-493; 40 source
  lines), validate_trusted_redirect_uri (L615-646; 32 source lines), and supporting helpers _parse_redirect_uri_for_validation
  (L428-436; 9 source lines), _strip_default_port (L277-307; 31 source lines), _parse_trusted_redirect_origins
  (L309-337; 29 source lines), _matches_trusted_origin_entry (L339-355; 17 source lines), is_loopback_redirect_host
  (L438-452; 15 source lines), _trusted_redirect_uri_is_allowed (L507-527; 21 source lines), _origin_label (L82-85;
  4 source lines). litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py: _user_id_from_session_cookie
  (L85-89; 5 source lines), _session_identity_from_cookie (L91-132; 42 source lines), _session_key_is_live (L134-172;
  39 source lines), _byok_session_auth (L174-185; 12 source lines).


  The HTTP request cookie is parsed as an HS256 JWT using the proxy master key. Decode the signed ``token``
  claim and validate its structure (type, login_method, user_id, optional key); reject any token that identifies
  itself as a non-UI type (e.g. ``type=="byok_session"``), or lacks the ``login_method`` claim (required for UI tokens
  only). A missing or invalid cookie, signature failure, missing expiry, or type mismatch returns (None, None).
  Absent master_key, return (None, None) without attempting decode. The decoded user_id and optional ``key`` claim
  are returned for session liveness checks. Sessions expire at the ``exp`` claim; PyJWT enforces this when present.
  A DB-backed session key (starting with ``sk-``) is re-resolved to detect revoked/logged-out sessions; blob tokens
  (older cookies with no ``key`` claim) are trusted on their bounded 10-minute signature lifetime.


  Redirect policies applied to the ``redirect_uri`` parameter in BYOK authorization requests:

  1. BYOK endpoints only (lines 239-275): native MCP clients must use loopback (http://localhost or 127.0.0.0/8).
     Rejects non-http(s) schemes and any fragment. Accepts ``localhost`` literally and any IPv4/IPv6 loopback address.

  2. Shared discoverable endpoints: same-origin (matching the proxy's resolved origin), loopback, ops-trusted https
     hosts from ``MCP_TRUSTED_REDIRECT_ORIGINS`` (env var, comma-separated, supporting wildcard subdomains like
     ``*.example.com``), or allowlisted private-use/custom-scheme native URIs from ``MCP_TRUSTED_NATIVE_REDIRECT_URIS``.
     Same-origin comparison strips default ports for the scheme (443 for https, 80 for http) so ``https://host:443``
     matches ``https://host``. PROXY_BASE_URL (env var, explicit https origin) overrides request-header origin detection.
     Untrusted proxies (X-Forwarded-* disabled or caller not in mcp_trusted_proxy_ranges) use only the literal request
     origin and the allowlists; trusted proxies may trust X-Forwarded-Proto/Host/Port. Native callbacks match on exact
     URI (lowercased scheme, netloc, path) or prefix match with a trailing ``*`` that must end with ``/`` to avoid
     ``/callback*`` matching ``/callback-2``. Rejects query strings (allowlist bypass), fragments, userinfo (credentials
     in URL), backslashes in the host, and non-http(s) schemes that are not allowlisted.


  Build the production modules in betterlite-mcp (a new crate in crates/betterlite-mcp/ for MCP-specific logic)
  and include session codec and redirect trust modules. Build named domain submodules with adjacent tests.rs files.
  Keep modules under 300 lines.


  B2316 owns password validation and credentials handling. B738 supplies the session key liveness check via
  get_key_object. B743 owns request header parsing that calls these redirect validators. B1223 owns the
  separate UI session token generation flow (the builder side), not cookie admission here. This task creates
  the betterlite-mcp/fuzz workspace since no other task owns it.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT fallback.


  This task owns the outside-byte boundary decode_session_cookie(&[u8]) -> Result<SessionCookie, DecodeError>
  for the untrusted JWT token bytes from the HTTP cookie (HS256 with master key, claims validation).
  Production calls this decoder before session liveness checks; the cargo-fuzz target decode_session_cookie calls
  that same function. Seed valid tokens (signed with master key, with and without optional ``key`` claim),
  truncated tokens, wrong-algorithm tokens, missing-exp tokens, missing-claim tokens, tampered payloads,
  non-JWT input and invalid base64. Add decode_session_cookie::tests::replays_the_decode_session_cookie_corpus.
  Create crates/betterlite-mcp/fuzz with a workspace Cargo.toml and register the decode_session_cookie target.


  Sizing: session identity functions own 98 source lines, redirect validators own 243 source lines.
  Allow 180 production, 200 behavior tests, 50 redirect integration tests, 40 helper adapters, 60 decoder/fuzz,
  20 wiring and 70 config lines, 620 changed lines within a 700-line gate. Only repository fixture/corpus/lock
  exclusions apply. Do not duplicate dependency implementations.

