      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'Redirect URI policies work for every listed case: loopback_native_callback, same_origin_proxy,
      loopback_ipv4_loopback, loopback_ipv6_loopback, loopback_localhost, loopback_non_loopback_rejected,
      loopback_fragment_rejected, loopback_no_scheme, trusted_https_allowlisted_origin, trusted_wildcard_subdomain,
      trusted_loopback_fallback, trusted_same_origin_normalized_port, trusted_native_callback_prefix_match,
      trusted_native_callback_fragment_rejected, trusted_native_callback_query_rejected, trusted_native_callback_userinfo_rejected,
      trusted_proxy_base_url_overrides_header and trusted_untrusted_proxy_ignores_headers.'
    proof:
      - behavior-tests
      - redirect-integration-tests
  - text: The production decode_session_cookie decoder is used by the service and its fuzz target and rejects
      malformed/invalid input without panic.
    proof:
      - behavior-tests
      - parser-corpus

checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^session_admission::tests::/)
        or test(/^redirect_trust::tests::/) - test(/replays_the_/)'
    - id: redirect-integration-tests
      why: Integration tests for redirect trust policies are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^redirect_trust::(integration_tests|tests)::.*redirect/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4655.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/session-admission-*")"
        && grep -rlq "session_admission" tools/oracle/fuzz/corpus/helper_case/session-admission-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-mcp/fuzz/fuzz_targets/decode_session_cookie.rs && grep -q "decode_session_cookie"
        crates/betterlite-mcp/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-mcp/fuzz/corpus/decode_session_cookie)" && cargo nextest run --locked -p betterlite-mcp
        --no-tests=fail -E 'test(replays_the_decode_session_cookie_corpus)'

