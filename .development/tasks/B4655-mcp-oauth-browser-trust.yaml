deviations:
  - what: Session identity extraction returns typed (user_id, session_key) tuples or None rather than
      raising exceptions, deferring validation to the FastAPI dependency layer for cleaner composition
      with async liveness checks.
    why: Separating the decode step from policy enforcement allows unit testing the decoder independently
      and makes async key resolution optional rather than required.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L91-L132
  - what: Redirect trust policies are organized as separate Rust functions for each policy (loopback,
      same-origin, trusted origins) rather than merged into a single large validator, matching domain
      separation from oauth_utils.py but structured for modular testing.
    why: Allow independent unit testing of each policy and clearer composition in route handlers that
      may apply different policies to different OAuth flows.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/oauth_utils.py#L615-L646

