    build_upstream_oauth2_token_request (L731-750+), and all RFC 8707 resource identifier logic.'
  - 'litellm/proxy/_experimental/mcp_server/oauth_utils.py: B4654 owns validate_redirect_uri_shape for
    native-callback matching and validate_trusted_redirect_uri when called from user_api_key_auth_mcp.'
  - 'litellm/proxy/_experimental/mcp_server/oauth_utils.py: B4650 owns get_request_base_url (L138-178; 41 source lines),
    well_known_root_suffix (L180-190; 11 source lines), TOKEN_NO_CACHE_HEADERS constant, and PROXY_BASE_URL resolution.
    These are owned separately for credential carrier setup, not redirect validation.'
  - 'litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py: Multiple route handlers and stores
    are owned by B4677 (consent page), B4678 (metadata and code exchange) and B4676 (token grants). This
    task owns only the session admission and trust policies they depend on.'
  - 'litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py: _purge_expired_codes (L70-75),
    _verify_pkce (L58-63), _oauth_token_error (L77-83), _build_authorize_html (L187-200+) are owned by B4678.'

pitfalls:
  - 'The JWT decode must reject any token with type=="byok_session", since the MCP /token endpoint also
    signs tokens with master_key (type="byok_session") and a leaked one could be replayed as a UI cookie
    to re-authorize BYOK writes. The login_method claim distinguishes UI tokens from MCP tokens.'
  - 'Session key liveness is async; the _session_identity_from_cookie decoder itself is sync but the
    FastAPI dependency _byok_session_auth is async and calls _session_key_is_live after decoding. Tests
    must mock the async resolution or use a test database.'
  - 'Redirect URI validation for loopback addresses requires checking the full 127.0.0.0/8 range and
    IPv6 ::1, not just the literal string "127.0.0.1". Use a proper IP parsing library and is_loopback
    property rather than string matching.'
  - 'Default port stripping (443 for https, 80 for http) is critical for same-origin comparison: a load
    balancer may set X-Forwarded-Port: 443 even when the client URL has no explicit port, and mismatching
    this breaks BYOK authorization for proxies behind HTTPS ingress.'
  - 'PROXY_BASE_URL takes precedence over X-Forwarded-* headers for origin determination in redirect validation.
    Untrusted proxies never use X-Forwarded-* even when set, preserving the loopback + allowlist fallback.
    Mixing these two rules in one function creates TOCTOU bugs.'

budget:
  max_changed_lines: 1500
  max_new_expects: 0

review_level: security
