    why: The state cookie constants and helpers, and _append_query_params.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L557-L615
    why: Token response validation rules with dot paths.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L1675-L1684
    why: client_supplied_redirect_uris.

dod:
  - text: encode_state writes all eleven keys sorted with nulls kept, and decode_state returns them, with Undecryptable and Malformed errors.
    proof: [state-tests]
  - text: Both sealed codes round trip, and each opener returns None for a wrong prefix, a failed decrypt, bad JSON, a missing or empty required field and a bad auth method.
    proof: [state-tests]
  - text: redeem_passthrough_code gives Ok(None) for no code or a raw code, WrongServer for another server, VerifierRequired without a verifier, and the sealed value otherwise.
    proof: [state-tests]
  - text: client_supplied_redirect_uris, validate_token_response and the dot path walk match LiteLLM on the oracle helper cases.
    proof: [state-tests, oracle]
  - text: The state cookie helpers give the name, path, secure flag, resolve and clear results LiteLLM gives.
    proof: [state-tests]
  - text: The sealed-code openers have a fuzz target, a committed seed corpus and a replay test.
    proof: [sealed-corpus]

checks:
  optional: []
  commands:
    - id: state-tests
      why: the state, sealed code, cookie, redirect uri, token rule or query helpers have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_state::/) - test(/::replays_sealed_corpus$/)'
    - id: sealed-corpus
      why: the sealed code openers have no fuzz target or new seed, or the replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/mcp_sealed_code)" && test -f crates/betterlite-mcp/fuzz/fuzz_targets/mcp_sealed_code.rs && grep -qF "open_passthrough_code" crates/betterlite-mcp/fuzz/fuzz_targets/mcp_sealed_code.rs && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_state::sealed::tests::replays_sealed_corpus$/)'

oracle_cases:
  - tools/oracle/cases/helpers/mcp-oauth-state/redirect-uris-valid.yaml
  - tools/oracle/cases/helpers/mcp-oauth-state/redirect-uris-bad-shapes.yaml
  - tools/oracle/cases/helpers/mcp-oauth-state/token-rules-match.yaml
  - tools/oracle/cases/helpers/mcp-oauth-state/token-rules-dot-path.yaml
  - tools/oracle/cases/helpers/mcp-oauth-state/token-rules-absent-and-mismatch.yaml
  - tools/oracle/cases/helpers/mcp-oauth-state/append-query-params.yaml

deviations:
  - what: Sealed values are produced by betterlite's cipher, so a code or state sealed by LiteLLM does not open in betterlite and the other way round.
    why: Both sides encrypt with their own master key derivation; in-flight flows across a switch must restart. Oracle cases cover only the pure helpers.

out_of_scope:
  - "The callback route that opens the state and seals the codes, and _get_validated_client_redirect_uri: no owner found, see the architect notes."
  - "validate_trusted_redirect_uri and get_request_base_url: B4654 and B4655."
  - "The flows that call these helpers: B7531 (register and ephemeral client) and B7532 (authorize and token)."
  - "The StoredCipher implementation: B1600."

pitfalls:
  - State and sealed JSON use sorted keys and keep null values, so a missing optional is written as null and not left out.
  - A sealed passthrough code with an auth method outside the known enum fails validation and opens to None, it is not passed on as text.
  - redeem returns Ok(None) for a raw upstream code even when a verifier is missing; the verifier check applies only to a genuine sealed code.
  - Rule keys with a dot are tried as a whole key first and the dot walk starts only when that value is absent or null.
  - A boolean rule value "true" matches a JSON true, and a number 12345 matches the string "12345", but the string "True" does not match a JSON true.
  - The cookie delete spec is returned only when the request carried that cookie.
  - decode_state label is "oauth_state", but the label is never a key, so tests must not depend on it.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
