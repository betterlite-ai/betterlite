    why: The lookup in wrapper_async and the early return of a hit.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2161-L2167
    why: The store after a successful call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L1234-L1243
    why: function_setup puts the audio content hash in metadata.file_checksum before the lookup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L445-L456
    why: The key reads file_checksum before the file name.
