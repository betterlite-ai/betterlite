    - crates/betterlite-server/src/app/inference/response_cache.rs
    - crates/betterlite-server/src/app/inference/response_cache/family_tests.rs
    - crates/betterlite-server/src/routes/completions.rs
    - crates/betterlite-server/src/routes/completions/**
    - crates/betterlite-server/src/routes/rerank.rs
    - crates/betterlite-server/src/api/rerank_routes.rs
    - crates/betterlite-server/src/api/rerank_routes/**
    - crates/betterlite-server/src/app/inference/route_ports.rs
    - crates/betterlite-server/src/app/inference/route_ports/**
    - crates/betterlite-server/src/routes/audio.rs
    - crates/betterlite-server/src/routes/audio/**
    - crates/betterlite-server/src/api/audio_routes.rs
    - crates/betterlite-server/src/api/audio_routes/**
