    why: The text completion attempt passes prompt and caching before the request kwargs.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4952-L4959
    why: The rerank attempt passes caching and client before the request kwargs.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4799-L4806
    why: The transcription attempt passes file and caching before the request kwargs.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12105-L12117
    why: The text completion route and its four paths.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rerank_api/main.py#L30-L45
    why: arerank sits under the client decorator, so its wrapper checks the cache.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rerank_endpoints/endpoints.py#L27-L45
    why: The rerank route and its three paths.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12655-L12720
    why: The transcription route turns the upload into a named BytesIO in data["file"].
dod:
  - text: A repeated text completion, rerank or transcription request is answered from the cache without a provider call and carries x-litellm-cache-key.
    proof: [family-tests, family-cases, oracle]
  - text: A text completion stream miss is written once after its last chunk, and a stream hit replays as SSE.
    proof: [family-tests, family-cases, oracle]
  - text: A transcription key follows the uploaded bytes, not the file name.
    proof: [family-tests, family-cases, oracle]
  - text: no-cache and no-store behave as in LiteLLM, and with no cache the three routes and their own tests behave as before.
    proof: [family-tests, route-tests, family-cases, oracle]
checks:
  optional: []
  commands:
    - id: family-tests
      why: a family skips the lookup or the store, answers a hit through the provider, or keys a transcription by its file name
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::response_cache::family_tests::/)'
    - id: route-tests
      why: the edits at the send points broke the text completion, rerank, audio or route port tests
      run: test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-server/src/app/inference/response_cache/family_tests.rs)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::completions::/) | test(/^api::rerank_routes::/) | test(/^api::audio_routes::/) | test(/^app::inference::route_ports::/)'
    - id: family-cases
      why: the HTTP cases for the three families were not added
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/response-cache-calls)"
oracle_cases:
  - tools/oracle/cases/response-cache-calls/text-completion-miss-then-hit.yaml
  - tools/oracle/cases/response-cache-calls/text-completion-no-store.yaml
  - tools/oracle/cases/response-cache-calls/text-completion-stream-miss-then-hit.yaml
  - tools/oracle/cases/response-cache-calls/rerank-miss-then-hit.yaml
  - tools/oracle/cases/response-cache-calls/rerank-no-cache.yaml
  - tools/oracle/cases/response-cache-calls/transcription-miss-then-hit.yaml
  - tools/oracle/cases/response-cache-calls/transcription-other-bytes.yaml
deviations: []
out_of_scope:
  - "The cache step, the kwargs rule and the chat and embeddings wiring: B9560. Responses and Anthropic Messages: B125."
  - "Lookup, conversion, writes and keys: B4305, B4302, B4304 and B4296. The audio content hash: B1001."
  - "The routes themselves, their decoding and their error answers: B202, B085, B8636 and B083."
  - "Speech (aspeech) and image calls: LiteLLM's default supported_call_types leave them out, and the router sends no caching for aspeech."
pitfalls:
  - "LiteLLM keys a transcription by the content hash function_setup adds, so two different recordings named audio.mp3 must not share an entry."
  - "Rerank without a router calls litellm.arerank with no caching kwarg, so the lookup still runs whenever a cache exists."
  - "Rerank has no prompt or messages, so its key comes only from query, documents, top_n and the other rerank params plus model_group."
  - "Files with the same config share one booted proxy and one in-memory cache, so every case file needs its own model_name."
  - "The text completion stream replay is text completion chunks (choices[].text), not chat deltas."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
