dod:
  - text: GoogleGeneration implements GenerateContentDispatch; generateContent and streamGenerateContent reach the provider through the pre-call step, the route choice and the SDK session, and answer its JSON or its raw frames with the custom headers.
    proof: [generation-tests, routes-tests]
  - text: A deployment's Vertex options reach the SDK call, and a model with no GenAI config answers through the chat adapter, streamed or not.
    proof: [generation-tests]
  - text: Every failure answers through handle_llm_api_exception with LiteLLM's status, type, message and headers.
    proof: [exception-tests, generation-tests]
  - text: The routes take a generic key and the request Parts, and B3506's tests and the oracle's genai replay still pass.
    proof: [routes-tests, oracle-replay]
  - text: docs/deviations/B10178.yaml lists this task's rows.
    proof: [deviation-rows]
checks:
  optional: [mutants]
  commands:
    - id: generation-tests
      why: the pipeline skips a step, the SDK call loses a field or a Vertex pin, the adapter is not used, or a failure answers wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::google_generation::/)'
    - id: exception-tests
      why: a failure kind maps to the wrong status, type or headers, or an unsafe header survives
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::llm_api_exception::/)'
    - id: routes-tests
      why: the generic key, the Parts or the stream body type broke a B3506 route test
      run: grep -q 'Extension<K>' crates/betterlite-server/src/api/genai_routes.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::genai_routes::/)'
    - id: oracle-replay
      why: the oracle's genai replay no longer builds the routes or answers its seeds
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^http::postgres::tests::replays_the_http_case_corpus$/)'
    - id: deviation-rows
      why: this task's deviations are not recorded
      run: test -s docs/deviations/B10178.yaml && grep -q 'user_config' docs/deviations/B10178.yaml
oracle_cases: []
deviations:
  - what: >-
      With a model_list, a Google generation call picks its deployment with B9800's standalone routing: a simple shuffle over the model group, no retries, no fallbacks and no cooldowns, and only the deployment's model, api_base, api_key, timeout and Vertex options (vertex_project, vertex_location, vertex_credentials and their vertex_ai_ aliases) reach the call. LiteLLM runs Router.agenerate_content through _ageneric_api_call_with_fallbacks with every litellm_params key of the deployment.
    why: The router engine (B6021, B8631) registers only anthropic_messages, so no generic router executor serves agenerate_content yet; /v1/messages has the same limit under the same routing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L5334-L5414
  - what: A request whose data carries user_config gets a 400 with "user_config is not supported on agenerate_content", where LiteLLM builds a Router from it and runs the call.
    why: B9800 does not build per-request routers; /v1/messages answers the same way.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L38-L50
  - what: A model starting with a2a/ that no deployment serves gets the 400 ProxyModelNotFoundError, where LiteLLM looks the agent up and calls agenerate_content with its URL.
    why: The standalone routing has no agent registry (its a2a_agent answers None, standalone.rs L122-L127).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/a2a_routing.py#L17-L80
  - what: >-
      The chat adapter reaches a model_list deployment through the OpenAI-compatible chat executor only, so a chat-only deployment the executor cannot send (an Anthropic or Azure one, say) fails with the executor's error, and with no model_list the adapter answers a 500. A chat stream that breaks midway ends the Google stream instead of raising.
    why: The route has no general litellm.acompletion; B3489's CompletionExecutor answers a stream of plain chunks with no error item.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/handler.py#L57-L104
  - what: Vertex credentials are loaded again on every generation call, where LiteLLM's GenAI config caches them per credentials and project.
    why: B10183's session keeps B7844's lookup; the server's credential cache lives inside the Vertex embedding executor.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L470-L520
out_of_scope:
  - "Mounting the routes, the TranslateContents and TokenCounter values and the HTTP oracle cases: B8774. countTokens has no production counter yet (B8598 owns /utils/token_counter)."
  - "The Google guardrail HTTP cases: B8992."
  - "A generic router executor for agenerate_content in B6021's engine: no task owns it."
  - "The bug-report notice on a 500 (should_report_bug): no production ProxyDiagnostics exists, and the notice is a log line only."
  - "Reusing handle_llm_api_exception from the other OpenAI-shaped routes (B8693's passthrough mapping and the todo routes that cite _handle_llm_api_exception): their tasks."
pitfalls:
  - "Rename generationConfig only when config is absent; LiteLLM keeps both keys when the body has both."
  - "The pre-call step returns new data with litellm_metadata and the call id; every later step, the SDK call included, reads that data, never the body the route decoded."
  - "B3506's with_stream_flags already sets stream, _litellm_raw_sse_stream and _litellm_skip_openai_stream_done; the pipeline must not set them again or strip them before the generator reads them."
  - "`stream` stays in the SDK call's kwargs, as **data passes it to agenerate_content_stream; GenaiCall has no stream field."
  - "vertex_embedding_dispatch's deployments list is index-aligned with model_list (one entry per deployment, in file order), and so is state.executor.deployments (chat_setup.rs L130-L165); match the deployment by model_id, then use its index."
  - "MessagesOutcome's hidden params carry model_id and api_base from StandaloneRouting (standalone.rs L110-L118); the custom headers read them there, not from the logging state."
  - "The genai stream frames are already SSE text from the provider; wrap them as StreamItem::Bytes so B6370's guardrail wrapper sees raw bytes, as LiteLLM's iterator hook does (google_endpoints/endpoints.py L109-L112)."
  - "B9800's trait method is still named anthropic_messages; the genai path reaches it only through MessagesCallSteps, so no genai code names it."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
