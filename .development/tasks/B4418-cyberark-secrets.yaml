dod:
  - text: Authentication caching, token base64 encoding, AppRole and mTLS paths, SSL verification and premium-user gate match the source.
    proof: [cyberark-auth-tests]
  - text: Read operations cache by secret name, percent-encode names in URLs, handle 404 silently and return None on exceptions, and check the native reader.
    proof: [cyberark-read-tests, oracle, cyberark-helper-corpus]
  - text: Write operations create policies with YAML-safe serialization, retry 409 with exponential backoff up to 5 times, warn on failure, cache on success and return dict status.
    proof: [cyberark-write-tests, oracle, cyberark-helper-corpus]
  - text: >-
      Delete returns not_supported status and clears the cache. Rotation delegates unconditionally
      to the base algorithm: it verifies current secret, writes new secret (which updates the cache),
      verifies the new secret through a cache hit (not a fresh GET), and deletes the old name
      through async_delete_secret, which clears the cache even though it returns not_supported.
      Same-name rotation still deletes; the cache is cleared after the write-and-verify cycle.
    proof: [cyberark-delete-tests, oracle, cyberark-helper-corpus]
  - text: The independently invoked MIT helper matches the production operations and the new helper-case seed replays.
    proof: [oracle, helper-python, cyberark-helper-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: cyberark-auth-tests
      why: Authentication, caching and credential paths are missing or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^cyberark_auth::tests::/)'
    - id: cyberark-read-tests
      why: Read caching, encoding and exception handling are missing or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^cyberark_read::tests::/)'
    - id: cyberark-write-tests
      why: Policy creation, retry, YAML serialization and write caching are missing or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^cyberark_write::tests::/)'
    - id: cyberark-delete-tests
      why: Delete not-supported status and cache clearing are missing or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^cyberark_delete::tests::/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4418.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: cyberark-helper-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/cyberark-*")" && grep -rlq "cyberark" tools/oracle/fuzz/corpus/helper_case/cyberark-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
