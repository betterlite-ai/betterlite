id: B4418
title: Authenticate Conjur and manage secret policies and values
description: >-
  Implement CyberArk Conjur token authentication, cached reads, policy creation,
  writes and the unsupported-delete outcome. Use the shared rotation algorithm with
  these operations and serialize policy-loading attempts per client.


  Build the CyberArkSecretManager class with AppRole and mTLS authentication paths.
  Authentication base64-encodes the response text and caches the token for 300 seconds
  (CYBERARK_REFRESH_INTERVAL, default 300). Conjur address defaults to http://127.0.0.1:8080,
  account to default, username to admin, and SSL verification to true. Read
  CYBERARK_API_BASE, CYBERARK_ACCOUNT, CYBERARK_USERNAME, CYBERARK_API_KEY,
  CYBERARK_CLIENT_CERT, CYBERARK_CLIENT_KEY and CYBERARK_SSL_VERIFY from the
  environment through B002's injected lookup. Require either API_KEY or both
  CYBERARK_CLIENT_CERT and CYBERARK_CLIENT_KEY at initialization. When mTLS paths
  are set, use httpx.Client with cert parameter; otherwise use the sync httpx handler.
  SSL verification uses str_to_bool from B4410; unrecognized values default to true.
  Log a warning when verification is disabled.


  Secret reads use GET against /secrets/{account}/variable/{encoded_name}, where the
  secret name is percent-encoded with quote='' (encode everything). Cache the secret
  value by name with the refresh interval TTL; return the cached value on cache hit.
  Synchronous reads use _get_httpx_client; asynchronous reads use get_async_httpx_client.
  Return None on 404 (secret not found) without logging the error; log other HTTP errors
  and return None. Return None on any exception.


  Secret writes use POST to the same URL, with the secret value as the content. Before
  writing, call _ensure_variable_exists to create the policy entry if needed. Update
  cache on successful write. Return a dict with status and message on success or error.


  Ensure a variable exists by POST to /policies/{account}/policy/root with policy YAML.
  Use yaml.safe_dump with default_style='"' to safely serialize the secret name as a
  YAML scalar; strip the trailing newline. Build policy as "- !variable {quoted_name}\n".
  Serialize policy-loading attempts per client using asyncio.Lock(). Retry only on HTTP
  409 (conflict), at most 5 calls (CYBERARK_POLICY_LOAD_ATTEMPTS), with exponential
  backoff delays 0.2/0.4/0.8/1.6 seconds (initial delay 0.2, multiply by 2 each retry).
  Policy creation failure logs a warning and the value write still proceeds. 404 and 422
  responses log at debug; other failures log a warning. Success sets Content-Type to
  application/x-yaml in the policy request headers.


  Secret deletion clears the cache and returns a dict with status=not_supported and a
  message that CyberArk does not support direct deletion through the API.


  Rotation delegates unconditionally to BaseSecretManager.async_rotate_secret. The base
  rotation verifies presence of the current secret, writes the new name with new value,
  verifies the new secret through a cache hit (not a fresh HTTP GET), and deletes the old
  name through async_delete_secret, which clears the cache entry even though it returns
  not_supported. Same-name rotation still deletes; the cache is cleared after the
  write-and-verify cycle.


  Authentication headers include Authorization: Token token="{base64_encoded_token}".
  Reject unsafe secret names through raise_if_unsafe_secret_name during policy creation
  (in the write path through _ensure_variable_exists), not during reads, deletes, or
  rotation's internal read steps.
  The KeyManagementSystem is CYBERARK. Do not remove the MIT premium-user gate that
  determines whether CyberArk is available at all; that gate is owned by the proxy
  startup logic, not this task.


  The Python runtime does not own these native operations; native dispatch calls are
  resolve_native_provider_reader and resolve_native_provider_writer from
  litellm.rust_bridge.secret_manager, with provider name "cyberark". The native path,
  when present, returns early from every operation. Async adapters must avoid blocking
  login on a Tokio worker thread; use the async http client and asyncio.Lock, never
  thread::spawn or blocking calls.
