deviations:
  - what: The MIT premium-user gate is determined by the proxy startup logic, not within this task's manager class.
    why: License checks are owned by the proxy initialization layer and the no-paid-tier project decision.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/cyberark_secret_manager.py#L62-L65
  - what: Native dispatch paths (resolve_native_provider_reader and resolve_native_provider_writer) check early and return native results; when native is absent, Python fallback logic runs in betterlite.
    why: The native bridge is a LiteLLM integration point, not a second implementation to port into Rust.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/cyberark_secret_manager.py#L202-L204
out_of_scope:
  - B4410 owns raise_if_unsafe_secret_name, str_to_bool, KeyManagementSystem.CYBERARK and the base rotation algorithm.
  - B173 owns the httpx client construction and HTTP dispatch primitives.
  - B2226 owns InMemoryCache initialization and cache operations.
  - B4421 owns the dispatch shim and manager-type selection logic.
pitfalls:
  - Policy YAML serialization uses yaml.safe_dump with default_style='"' to safely escape the secret name; the result must have its trailing newline stripped before building the policy string.
  - The retry lock must serialize policy-creation attempts per client instance using asyncio.Lock; concurrent writes for different secret names use the same lock to prevent thundering herd.
  - Async adapters must use get_async_httpx_client and asyncio.Lock, never spawn threads or blocking calls on the Tokio worker.
  - A 404 on read logs at debug and returns None silently; other HTTP errors log an exception and also return None, not error status.
  - Policy creation failure (non-409, non-5xx) logs a warning but does not prevent the value write; the write proceeds anyway.
  - Delete returns status=not_supported and a message; it does not raise an exception or return None.
  - >-
    raise_if_unsafe_secret_name is called only inside _ensure_variable_exists, which runs only during
    async_write_secret. It does not run during reads, deletes, or the verification read inside the base rotation algorithm.
  - >-
    The verify-read in rotation is a cache hit after a successful write; it does not make a fresh HTTP request
    to CyberArk. The cache was populated by async_write_secret, and async_read_secret checks it before attempting a GET.
  - >-
    async_delete_secret returns "not_supported" but still clears the cache. Even in same-name rotation, where
    current and new names are equal, the delete is called and the cache entry is removed, preventing stale values
    from being served on re-use of that secret name.
budget:
