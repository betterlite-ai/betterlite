dod:
  - text: 'Default-budget tests and helper cases: metadata_string_only, whitespace_id_kept,
      explicit_empty_id_overrides, no_db_or_id_skips_cache, default_cache_hit, default_missing_warn,
      warning_id_strips_crlf, default_query_error_none, default_decode_error_none,
      default_cache_write_error_none, default_cache_read_error_propagates, member_query_error_none,
      member_missing_warn, member_decode_error_propagates, member_cache_write_error_propagates,
      management_ttl_consumed, key_before_proxy_default and missing_key_budget_uses_proxy.'
    proof:
      - behavior-tests
  - text: 'Lookup cases: own_resolved_budget_wins, dangling_budget_uses_default,
      default_copy_preserves_id, db_required_before_none_id, empty_id_queries,
      unrestricted_registry_skips_row, budget_forces_registry_lookup,
      relation_includes, proxy_default_cached_before_key_default,
      two_keys_do_not_share_defaults, cached_default_resolved_again,
      db_block_failure_returns_none and prequery_failure_propagates.
      Each named helper case asserts ordered cache effects and unchanged database rows.'
    proof: [behavior-tests, oracle, helper-python]
  - text: 'Budget cases: info_route_skips_budget, absent_budget_skips_spend,
      authoritative_end_user_counter, equal_budget_allowed, zero_budget_rejects_positive,
      over_budget_fields and spend_failure_propagates. HTTP over-budget compares the default 422,
      budget_exceeded, null param and string code 422 through the real auth stage; B757 owns
      litellm_settings.budget_exceeded_status_code overrides.'
    proof: [behavior-tests, stage-wiring-tests, oracle]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(/^(auth::)?auth_end_users::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_end_users.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-end-users-*")"
        && grep -rlq "auth_end_users" tools/oracle/fuzz/corpus/helper_case/auth-end-users-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::auth_end_users::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-end-users-*")"
        && grep -rlq "max_end_user_budget_id" crates/betterlite-config/fuzz/corpus/config_yaml/auth-end-users-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_end_users::tests::/)
        - test(/replays_the_/)'
