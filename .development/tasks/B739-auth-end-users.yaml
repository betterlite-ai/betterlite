id: B739
title: End-user identity and default budgets
description: >-
  Implement end-user lookup and default-budget selection. B880 owns request identity/header validation
  and B1218 owns the restricted registry. Read key metadata end_user_budget_id only when it is a nonempty
  string; whitespace is accepted. An explicit budget_id, including an empty string, overrides
  litellm_settings.max_end_user_budget_id (default None, no dedicated env binding). Missing DB or an
  unset resolved ID returns None before cache access. Query B725 BudgetRepository through B2315's
  bounded budget adapter after checking default_end_user_budget:<id>. Missing rows WARN with CR/LF
  stripped from the ID; query, validation and cache-write errors log ERROR and return None. Cache-read
  errors escape because that read is outside the try block. Cache TTL comes from B733
  get_management_object_ttl, not the obsolete '60 seconds' comment.

  Team-member defaults use team_member_default_budget:<id>. Missing DB returns None; a query failure
  logs an exception and returns None, and a missing row WARNs. Unlike end-user defaults, validation
  and cache-write errors propagate. Resolve the key's budget first, then the proxy default when
  the key has no budget or its fetch returns None. Applying a default keeps an end user's own
  nonnull budget_id plus resolved relation unchanged; a dangling own ID can receive a default.
  Change only litellm_budget_table on a copy and log DEBUG; never persist or overwrite budget_id.

  get_end_user_object rejects absent DB with 'No db connected' even for a None ID. None ID then
  returns None; an empty ID is a real lookup. Use B733's end-user cache key and B1218's unrestricted
  registry fast path, passing token_end_user_max_budget and key_end_user_budget_id. On DB reads,
  include litellm_budget_table and object_permission, apply only the proxy default, cache that row,
  then apply the requesting key's default on a copy. Cached rows also resolve defaults per request.
  Every exception within the DB-fetch/apply/cache block returns None silently; initial cache reads,
  cached-row default application and registry failures are outside that catch and propagate.

  _check_end_user_budget skips B882 info routes and absent budget relations/max_budget. Otherwise
  call B2321's current-spend service with spend:end_user:<id>, fallback spend or zero, max_budget
  and fallback_authoritative=true. Reject strictly greater spend, including positive spend against
  zero budget, with BudgetExceededError carrying current_cost, max_budget, entity_type=end_user
  and entity_id; equality is permitted. B757 maps that error to HTTP. No database writes occur here.
  Repository tests use POSTGRES_TEST_URL with testcontainers fallback.


  Build the production auth_end_users module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  get_key_end_user_budget_id (L1438-L1443; 6 source lines), get_default_end_user_budget (L1446-L1508;
  50 source lines), get_team_member_default_budget (L1512-L1564; 44 source lines), resolve_default_end_user_budget
  (L1567-L1597; 28 source lines), _apply_default_budget_to_end_user (L1600-L1641; 36 source lines), _check_end_user_budget
  (L1644-L1683; 34 source lines), get_end_user_object (L1876-L1974; 83 source lines).


  End-user spend values retain B726's stored representation and B732's checked numeric boundary.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.max_end_user_budget_id=None.


  Add the auth_end_users operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-end-users-*
  seed to B171 helper_case, which already owns this decoder.


  Exercise end-user lookup and budget denial on POST /v1/chat/completions through B732 registration;
  compare the precise B757 envelope and assert that denied requests never reach the mock provider.


  B860 end-user rows run on POSTGRES_TEST_URL with testcontainers fallback, including absent budget
  relations and conflicting cached versus authoritative spend.


  Config tests max_end_user_default_unset and max_end_user_id_loaded use B002's production loader
  with None, empty and nonempty string values and assert the resulting lookup selection. This is a
  budget-row identifier, not an integer setting with an invalid-value fallback. Seed config_yaml
  with litellm_settings.max_end_user_budget_id.


  End-user records arrive through existing repository decoders; no new request-byte parser is needed.


  Sizing: 281 nonblank, noncomment pinned source lines; allow 250 production, 300 behavior/Postgres
  tests, 80 adapters, 60 wiring and 50 config lines, 740 within 800. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_end_users::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
