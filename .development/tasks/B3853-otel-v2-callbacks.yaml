id: B3853
title: OTel V2 callback construction and proxy hooks
description: >-
  Build the OpenTelemetryV2 CustomLogger callback that wires request identity
  seeding, phase spans and guardrail emission into the proxy callback system. The
  callback construction takes an OpenTelemetryV2Config (B3842), a SpanEmitter with
  its mappers (B3847, B3846), a TenantTracerCache (B3852), and injected metrics/event
  recorders (B3869, B3848). The __init__ method builds a tracer provider through
  B3868's build_tracer_provider if none is provided, resolves meter/logger providers
  (B3848), and registers the instance in proxy_server.open_telemetry_logger for
  global access. The tracer_provider property exposes read-only access. The callback
  registers itself in litellm service_callback, input_callback, _async_success_callback
  and _async_failure_callback lists if no OTel instance is already present (checked by
  module name prefix).

  Implement _span_error_from_exception to build SpanError records (B3843) from proxy-level
  exceptions (auth/validation rejections) that never produced a StandardLoggingPayload,
  calling B253's StandardLoggingPayloadSetup.get_error_information to extract status/type/message/traceback,
  matching _parse_error's field mapping in B3843. Service hooks async_service_success_hook
  and async_service_failure_hook accept ServiceLoggerPayload and optional timing/metadata,
  delegate to _emit_service to construct ServiceSpanData (B3843), call B3840's span_role_for_service,
  skip metrics-only operations (auth, framework-duplicate services), resolve parent context
  and links through B3847's resolve_service_span_context, and emit through the SpanEmitter
  with B3847's emit method.

  Implement request identity seeding (seed_request_identity) to attach request-identity
  Baggage (B3841) to the current context and server span once at the auth boundary, calling
  RequestIdentity.from_user_api_key_auth (B3841), promoted_baggage (B3841) with the callback's
  baggage key configuration, and set_request_baggage (B3847) to wire the contextvar. Stamp
  identity on the server span directly (never the ambient phase span) using B3847's set_request_root_span
  and request_root_span to anchor to the root instead of the active span. Start phase spans
  (start_phase_span) as a context manager yielding a recordable span with name from a service
  role, stamping errors through B3847's stamp_error.

  Implement async_pre_call_hook to call seed_request_identity with the user key and request
  metadata (B3841). Implement async_post_call_failure_hook to stamp error attributes on the
  request's root SERVER span for failures before any LLM call (auth/validation rejections),
  stamping through stamp_error_attrs. Stamp error.* attributes without recording
  a duplicate event if error is already on the span. Prefer B3847's mcp_message_transport_span
  for MCP message errors over the request root. Implement emit_guardrail_span (instance method)
  to emit a guardrail span from a StandardLoggingGuardrailInformation entry (B3843) as a
  sibling under the request root, calling GuardrailSpanData.from_logging_entry (B3843) and
  resolve_request_span_context (B3847). Implement mark_request_root_span
  to anchor the FastAPI server span as the request root span, calling set_request_root_span
  and request_root_span.

  Export module-level _registered_v2_logger (reads proxy_server.open_telemetry_logger),
  module-level emit_guardrail_span (routes to the registered logger's instance method,
  swallowing exceptions), module-level seed_request_identity (routes to the registered logger),
  and phase_span context manager (routes to start_phase_span).

  The span-error-from-exception helper stamps status_code on error.code to pin a proxy-level
  500 or 400 to the real HTTP status (not the provider's), so oracle cases for pre-call failures
  read as failed with the right code. Direct dependencies enforce that no unmapped callback field
  is shipped untyped: every config key in OpenTelemetryV2Config (B3842), every baggage key,
  every mapper name is validated once at construction. Request identity has trusted-versus-requester
  precedence (B3841) preserved. Metrics and event recorders (B3869, B3848) are optional: if either
  config is disabled, the recorder is None and hooks skip recording. The callback's open_llm_calls
  map is bounded to _OPEN_CALLS_MAX (10_000); an oldest-call eviction on overflow caps memory.

  A failed logger.emit_guardrail_span or seed_request_identity suppresses exceptions so a guardrail
  or seed failure never breaks the request. The phase_span module entry returns None if no logger
  is registered, so clients use it in a with-statement and check the span for None. Module-level
  emit_guardrail_span is the single entry point for guardrail emission so a recorded entry yields
  exactly one span regardless of how many instances are registered. The span-emission pattern
  (emit through SpanEmitter, link back to ambient/threaded context) preserves tenant destination
  fanout (B3849).

