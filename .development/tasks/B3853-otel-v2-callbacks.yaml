deviations:
  - what: Module-level emit_guardrail_span catches and suppresses all exceptions so a guardrail-emission failure never breaks the request flow.
    why: LiteLLM's guardrail-emission path is a best-effort side channel that must not fail the request; betterlite preserves this behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L954-L961
  - what: Phase span context manager returns None if no logger is registered instead of throwing.
    why: Phase spans are optional instrumentation for context propagation; callers must handle None in the with-statement.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L993-L1000
  - what: Request identity seeding swallows exceptions from Baggage attachment so a malformed key dict never breaks auth or seeding.
    why: Identity seeding is a best-effort span-labeling side effect; attachment failures must not reject the request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L704-L734
out_of_scope:
  - "litellm/integrations/otel/logger.py:846-871 (select_global_otel_v2_logger): canonical logger selection, owned by B110."
  - "litellm/integrations/otel/logger.py:874-908 (publish_global_otel_v2_provider): provider publication and fanout setup, owned by B110."
  - "litellm/integrations/otel/logger.py:911-922 (_excluded_db_systems): service exclusion list, owned by B110."
  - "litellm/integrations/otel/logger.py:925-932 (_v2_configs): multi-logger configuration aggregation, owned by B110."
  - "litellm/integrations/otel/logger.py:970-990 (fan_out_provider): fallback provider access, owned by B110."
  - "litellm/integrations/otel/logger.py:1003-1026 (build_otel_v2_logger, _logger_class): logger factory composition, owned by B110."
  - B3852 owns the complete TenantTracerCache; this task constructs and holds it.
  - B3849 owns attach_tenant_fan_out; this task calls it through fan_out_provider (B110).
  - B3868 owns build_tracer_provider; this task calls it in __init__.
  - B3869 owns create_genai_metrics and GenAIMetricRecorder; this task uses them as dependencies.
  - B3848 owns get_tracer, get_meter, get_event_logger, GenAIEventRecorder and metric/logger provider resolution; this task uses them.
  - B3847 owns SpanEmitter, stamp_error, and context resolution functions; this task uses them.
  - B3841 owns RequestIdentity, promoted_baggage and all identity/metadata construction; this task calls them.
  - B3843 owns ServiceSpanData, GuardrailSpanData and SpanError construction; this task calls them.
  - B3846 owns resolve_mappers; this task passes the result to SpanEmitter.
  - B253 owns StandardLoggingPayloadSetup.get_error_information; this task calls it through _span_error_from_exception.
  - G1 (Langfuse leaf, gap) owns LangfuseOpenTelemetryV2 and LangfuseContentOpenTelemetryV2 constructors; B110 dispatches to them.
pitfalls:
  - The open_llm_calls map evicts the oldest entry on overflow, not the newest; a long-running proxy never calls close on an evicted provider.
  - Request identity seeding stamps the server span only if it is recordable; a rejected auth request that never opens a root span leaves identity unstamped.
  - Service hooks with both start_time and end_time in the past emit as finished traces; a background service call with no parent opens a root trace and is not a child.
  - The phase_span context manager is a generator; clients must use it in a with-statement, not call it as a plain function.
  - Emit_guardrail_span is the single entry point; directly calling the logger's instance method on multiple registered callbacks double-emits the same entry.
  - Pre-call failure error stamping checks the Error.TYPE attribute key to detect if error is already on the span; missing the check records a duplicate event.
