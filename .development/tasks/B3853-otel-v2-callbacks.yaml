dod:
  - text: The V2 callback constructs with explicit tracer/meter/logger providers, registers itself once in proxy callbacks, and exposes tracer_provider read-only.
    proof: [v2-callback-init-tests, v2-callback-proxy-registration-tests]
  - text: Request identity seeding attaches Baggage to the ambient context and server span once at auth boundary without breaking on malformed keys.
    proof: [v2-callback-identity-tests, v2-callback-baggage-tests]
  - text: Service hooks emit with correct role, parent context, timing and error overrides, skipping metrics-only operations.
    proof: [v2-callback-service-hooks-tests]
  - text: Guardrail emission through module-level entry point yields exactly one span per entry, routing through the single registered logger.
    proof: [v2-callback-guardrail-tests]
  - text: Pre-call failures stamp error.code to the real HTTP status, not provider status, without duplicate error events.
    proof: [v2-callback-error-stamping-tests]
  - text: Open LLM calls map is bounded; oldest entry is evicted on overflow and no memory is leaked.
    proof: [v2-callback-llm-calls-bounded-tests]
  - text: Phase span context manager suppresses exceptions, returns None if no logger is registered, and properly closes spans.
    proof: [v2-callback-phase-span-tests]
checks:
  optional: []
  commands:
    - id: v2-callback-init-tests
      why: Callback initialization with explicit and injected providers must wire dependencies correctly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::initialization::/)'
    - id: v2-callback-proxy-registration-tests
      why: Callback must register itself in proxy lists without duplicating if OTel is already present.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::proxy_registration::/)'
    - id: v2-callback-identity-tests
      why: Identity seeding must attach Baggage and stamp server span once without breaking on malformed keys.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::request_identity::/)'
    - id: v2-callback-baggage-tests
      why: Baggage promotion and span stamping preserve trusted-versus-requester precedence.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::baggage::/)'
    - id: v2-callback-service-hooks-tests
      why: Service hooks emit with correct spans, parent contexts, timing and error overrides.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::service_hooks::/)'
    - id: v2-callback-guardrail-tests
      why: Guardrail emission must route to the single registered logger and yield exactly one span.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::guardrail_emission::/)'
    - id: v2-callback-error-stamping-tests
      why: Error attributes must stamp to the correct span with the real HTTP status, without duplicate events.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::error_stamping::/)'
    - id: v2-callback-llm-calls-bounded-tests
      why: Open calls map bounded eviction and provider release must not leak memory.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::llm_calls_bounds::/)'
    - id: v2-callback-phase-span-tests
      why: Phase span context manager lifecycle, exception handling and None-return when no logger is registered.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_v2_callback::phase_span::/)'
