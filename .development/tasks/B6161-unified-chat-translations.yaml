    why: How a ModifyResponse or HTTP failure becomes block chunks and error items.

dod:
  - text: Three adapters implement every method of `BaseTranslation`, and their input and output methods call the matching B3668, B3671 and B3675 functions with the same arguments.
    proof: [adapter-tests]
  - text: The Responses adapter sets both class flags to true, passes the delivery flag to B3672, and the other two adapters carry the pinned handler values.
    proof: [flag-tests]
  - text: The Anthropic adapter converts the trait's stream items to `SseChunk` and back without losing events, and the Responses adapter edits its events in place.
    proof: [stream-conversion-tests]
  - text: B3672's undeliverable error becomes B3246's `UndeliverableStreamRewrite` with the same guardrail name ("unknown" when absent) and reason, and B3676's error passes through unchanged.
    proof: [undeliverable-tests]
  - text: Block chunks and error items use a stamp from the injected `StampSource` and the status and message of the guardrail failure.
    proof: [stamp-tests]
  - text: The chat, Responses and Anthropic tables list exactly the pinned call types in order, and only the chat entries carry the chat-completions flag.
    proof: [table-tests]

checks:
  optional: [mutants]
  commands:
    - id: adapter-tests
      why: an adapter skips its handler or passes different arguments
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_chat::.*::tests::adapter_/)'
    - id: flag-tests
      why: a class flag has the wrong value or the delivery flag is not passed on
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_chat::.*::tests::flags_/)'
    - id: stream-conversion-tests
      why: a stream item is dropped, reordered or converted lossily
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_chat::.*::tests::stream_/)'
    - id: undeliverable-tests
      why: the undeliverable error loses its name, reason or the "unknown" fallback
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_chat::undeliverable::tests::/)'
    - id: stamp-tests
      why: block chunks or error items ignore the injected stamp or the failure's status and message
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_chat::.*::tests::stamp_/)'
    - id: table-tests
      why: a call type is missing, duplicated or flagged wrongly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_chat::tables::tests::table_/)'

oracle_cases: []

deviations: []

out_of_scope:
  - The chat, Responses and Anthropic handler functions; B3667, B3668, B3669, B3671, B3672, B3673, B3675 and B3676 own them.
  - The `UndeliverableStreamRewrite` type itself; B3246 owns it.
  - The registry fill, the translation enum, the real stamp source and the hooks; B3680 owns them.
  - HTTP oracle cases for chat, Responses and Anthropic guardrails; B3680 adds them.

pitfalls:
  - "The two B3672 and B3676 errors differ: only B3672's is a local enum, so only it needs the conversion."
  - "`guardrail_name` is None-able in B3672 and \"unknown\" is the fallback in the error text; do not pass an empty string."
  - Chat completions are the only entries with `chat_completions` true; `anthropic_messages` is not one.
  - Keep one conversion per direction for stream items; a second helper that does the same thing in another file fails review.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
