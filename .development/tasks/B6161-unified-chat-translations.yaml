id: B6161
title: Registry adapters for chat, Responses and Anthropic guardrail handlers
description: >-
  Wrap the chat handler (B3667, B3668, B3669), the Responses handler (B3671, B3672, B3673) and the Anthropic
  Messages handler (B3675, B3676, B3673) in three adapter types that implement B3661's `BaseTranslation`, and own
  their call-type tables. Those tasks ship plain async functions generic over `G: GuardrailContract`, because
  `apply_guardrail` returns `impl Future` and the trait cannot be a trait object. B3679's
  `TranslationRegistry<T: BaseTranslation>` needs a value that implements the trait, so the glue lives here.

  Code goes in crates/betterlite-server/src/guardrails/unified_chat.rs and unified_chat/. Files: chat.rs,
  responses.rs, anthropic.rs, stamps.rs, undeliverable.rs and tables.rs. Types: `ChatTranslation`,
  `ResponsesTranslation`, `AnthropicTranslation`. Each implements every method of `BaseTranslation` with the
  signatures B3661 fixes. Do not change the trait.

  Input and output. `process_input_messages` and `process_output_response` call the handler functions of the
  matching task with the same arguments. Chat uses B3668. Responses uses B3671. Anthropic uses B3675, and its
  `post_call_hook_response` uses B3675's `post_call_hook_response`; the other two keep B3661's default for that
  method. `get_structured_messages` and `extract_request_tool_names` call the handler's own function where B3667,
  B3671 or B3675 define one, and keep the default otherwise.

  Streaming. This is the hard part. B3672 works on `&mut [serde_json::Value]`, B3676 on `&mut Vec<SseChunk>`
  (B3673's `SseChunk` with `Bytes`, `Event` and `Other`), and chat (B3669) on its own chunk type. B3661 fixes the
  stream item type of `BaseTranslation`; read it and use that type at the trait boundary. Convert inside the adapter
  and nowhere else. If the item type is `serde_json::Value`, the Anthropic adapter turns each JSON object into
  `SseChunk::Event`, each other value into `SseChunk::Other`, calls B3676, and writes the events back as `Value`
  objects in place, keeping the vector length unless B3676 changes it. Add a round-trip test per conversion. Do not
  add a second stream item type to B3679 or B3661.

  Flags. `ResponsesTranslation` sets `delivers_ended_stream_rewrites` and `assembles_streamed_response` to true, as
  B3671 says. Chat and Anthropic set them to whatever the pinned handler classes set; read the three
  `guardrail_translation/handler.py` files and copy the values. The Responses and Anthropic adapters pass
  `deliver_ended_stream_rewrites` to B3672 and B3676 from the flag, so the value has one source.

  Guardrail name. B3672 takes `guardrail_name: Option<&str>` because `GuardrailContract` has no name accessor.
  Every adapter takes the name from the same place: the argument B3661's trait passes to the streaming method. If
  the trait has no such argument, stop and say so in the report; do not invent a second source. The adapter hands
  that `Option<&str>` to B3672 unchanged and uses it for the Anthropic error below.

  Undeliverable rewrites. B3672 returns `StreamSyncError::Undeliverable { guardrail_name, reason }` and B3676
  returns `ProcessStreamError::Undeliverable` that already holds `UndeliverableStreamRewrite { guardrail_name, reason }`
  (B3246, betterlite-core `guardrails/streaming_rewrite.rs`). `undeliverable.rs` converts the B3672 error into
  B3246's `UndeliverableStreamRewrite`, keeping `guardrail_name` (use "unknown" when it is None, as B3672 does) and
  `reason`, and the adapter returns it through whatever error type B3661's streaming method returns. Read B3246's
  task and the code on main for the real struct; if it has no public constructor with these two fields, report that
  in the blocker field and stop.

  Block chunks and error items. `build_block_sse_chunks` and `build_stream_error_items` need a response id, a
  message id and a created time that LiteLLM draws from random ids and the clock. B3673's functions take them as a
  `BlockStamp { response_id, message_id, created_at }`. `stamps.rs` defines the trait `StampSource` with one method
  returning a `BlockStamp`, and each adapter is generic over `S: StampSource` (no trait object); tests use a fixed source. B3680 passes the real one. The
  adapter converts `GuardrailFailure` to the status code and message those functions take: `Http { status, detail }`
  gives that status and detail, `ModifyResponse` gives 400 and its message, as LiteLLM's `handle_streaming_block`
  does; read B3673's task for the exact parameter list.

  Tables in tables.rs, with B207's `CallType` values in the order of the pinned files:
  `CHAT_CALL_TYPES` = completion, acompletion; `RESPONSES_CALL_TYPES` = responses, aresponses;
  `ANTHROPIC_CALL_TYPES` = anthropic_messages. `chat_completions` is true only for the two chat entries (B3679 uses
  it to tell chat apart from other call types); this task exports the two chat names a second time as `CHAT_COMPLETIONS_CALL_TYPES` so B3680 can set the flag.

scope:
  paths:
    - crates/betterlite-server/src/guardrails/unified_chat.rs
    - crates/betterlite-server/src/guardrails/unified_chat/**
  lint_tables: false

references:
