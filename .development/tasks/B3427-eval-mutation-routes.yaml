deviations:
  - what: "Request body decoding (JSON parse errors) occurs before the try/catch block so malformed bodies return 400 with a parse error, not a 500 from the handler. This is a safety boundary between parsing and processing, not a deviation from LiteLLM."
    why: "LiteLLM's FastAPI route handler implicitly parses bodies as part of the request lifecycle; betterlite's explicit decode before try/catch preserves the same error surface (400 on bad JSON) without changing the visible contract."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_evals_endpoints/endpoints.py#L352-L354"
out_of_scope:
  - "ProxyBaseLLMRequestProcessing.base_process_llm_request implementation and its internal processing steps; this task only calls it."
  - "ProxyBaseLLMRequestProcessing._handle_llm_api_exception implementation; this task only catches and delegates to it."
  - "Authentication and user_api_key_auth dependency injection; B756 or another auth task owns that."
  - "The concrete operation implementations (aupdate_eval, adelete_eval, acancel_eval) owned by B3422 and B3423; routes only dispatch to them."
pitfalls:
  - "Model selection must check body (truthy), then query, then header `x-litellm-model` in that exact order. The line order in LiteLLM is the authority despite any misleading comments."
  - "custom_llm_provider must never default to openai when a body value (including null) is present. Only apply the default when the key is entirely absent from the body."
  - "Path eval_id overwrites body eval_id unconditionally; this is not a precedence rule, it is always the source of truth."
  - "Body parsing with orjson must happen outside the try block so parse errors are visible as 400 responses, not caught by exception handlers."
  - "Delete and cancel routes must accept optional bodies like update does, not require an empty body."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
