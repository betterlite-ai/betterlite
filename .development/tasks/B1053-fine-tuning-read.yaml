id: B1053
title: Fine-tuning job list and retrieval SDK calls
description: >-
  Implement the complete alist/list/aretrieve/retrieve_fine_tuning_job functions in core::api::fine_tuning_read.
  B518 and B542 own OpenAI/Azure clients and wire conversion; B2487 supplies loaded resource settings and
  timeout capability, B010 GenericLiteLLMParams and B012 the decorated retrieve-call boundary. List has
  no @client decorator. Use B2401 FineTuningRead with actual SDK HTTP for both modes, preserving context
  and awaiting only coroutine results. No registry/file credential resolver is called by these functions.

  List after/limit default null, despite a docstring saying 20; retrieve requires fine_tuning_job_id.
  Provider defaults openai and extra_headers/extra_body default null. All are accepted for openai/azure
  only; vertex_ai in the type annotation is not an implemented read branch. Environment/global fallback
  contracts are owned and loader-tested by B2487; use them here with timeout then request_timeout then
  600 seconds. Own 253 nonblank/non-comment lines at 484-778; estimate 190 implementation, 155 tests,
  85 adapters, 125 fixtures and 45 wiring/corpus, 600 total. B518 decodes provider response bytes.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/fine_tuning_read.rs
  - crates/betterlite-core/src/api/fine_tuning_read/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/fine_tuning_read.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/fine_tuning_read.py
  - tools/oracle/cases/sdk-http/fine-tuning-read/**
  - tools/oracle/fuzz/corpus/sdk_http_case/fine-tuning-read-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/fine_tuning/main.py#L484-L778
  why: All four functions preserve null pagination, per-provider client arguments and distinct unsupported-operation messages.
dod:
- text: >-
    list_jobs_does_not_invent_limit calls list/alist with no pagination and expects GET /v1/fine_tuning/jobs
    without after/limit. after="",limit=0 sends both; after=ft_prev,limit=7 sends those literals, without
    order. Mock {object:list,data:[<ft_a>],has_more:true} preserves page metadata and the job records.
    Azure list page entries are not individually normalized by retrieve's converter; status=canceling remains
    canceling in a returned list entry. extra_headers={X-Ignored:x},extra_body={limit:99} are ignored.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    retrieve_job_preserves_provider_result calls both modes for ft_a, expects GET
    /v1/fine_tuning/jobs/ft_a and B518's complete returned job including training_file,result_files,status.
    Azure with api_version=2024-08-01-preview uses its versioned URL and B542 normalization:
    status=canceled/canceling->cancelled,organization_id=null->"",result_files=null->[].
    The SDK wrapper does not decode a managed id, read registry credentials or rewrite job ids.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    read_settings_and_client_mode checks OpenAI request credentials win global values, then environment
    values from B2487; unset base becomes https://api.openai.com/v1 and unset organization null. Azure uses
    request/global/secret base/version/key chain and request organization only. Native captured args prove
    600-second fallback, timeout=0/request_timeout=9->9, request_timeout="7.5"->7.5 and structured OpenAI/Azure
    timeout passthrough. Only OpenAI receives the supplied client; Azure constructs its own. Reassigning
    Azure extra_body from GenericLiteLLMParams discards the public argument and removes any azure_ad_token
    before returning; neither extras map is forwarded. Async flags require true, and context reaches the call.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    unsupported_read_provider sends vertex_ai and expects no HTTP with BadRequestError,400,
    type/param/code=null. List source message is "LiteLLM doesn't support vertex_ai for 'create_batch'. Only 'openai' is supported.";
    retrieve is "LiteLLM doesn't support vertex_ai for 'retrieve_fine_tuning_job'. Only 'openai' and 'azure' are supported.".
    Both source response bodies are "Unsupported provider"; methods are create_thread and
    retrieve_fine_tuning_job respectively. Null and unknown provider also enter this unsupported branch.
    Invalid numeric timeout fails before dispatch. A mock HTTP 404 reaches the SDK's NotFoundError with
    status=404; use provider body {error:{message:missing,type:invalid_request_error,param:null,code:null}}
    and assert type=invalid_request_error,param/code=null for undecorated list, while decorated retrieve
    returns mapped NotFoundError,status=404,type=null,param=null,code=null through B012/B011. With
    timeout="bad", undecorated list raises ValueError with no status/type/param/code, while decorated
    retrieve maps it to APIConnectionError,status=500,type/param/code=null; both send zero requests.
    Add separate cases, not an assumed common mapper.
  proof: [read-tests, oracle, python-adapter, sdk-corpus]
checks:
  optional: []
  commands:
  - id: read-tests
    why: list/retrieve wrappers lose their different decoration, pagination or provider restrictions
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::fine_tuning_read::tests::/) - test(/::replays_corpus$/)'
  - id: python-adapter
    why: read cases only compare prepared inputs instead of SDK HTTP results
    run: test -f tools/oracle/sdk_http/fine_tuning_read.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: no newly added SDK read case exercises the case decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/fine-tuning-read-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/fine-tuning-read/list-jobs-does-not-invent-limit.yaml
- tools/oracle/cases/sdk-http/fine-tuning-read/retrieve-job-preserves-provider-result.yaml
- tools/oracle/cases/sdk-http/fine-tuning-read/read-settings-and-client-mode.yaml
- tools/oracle/cases/sdk-http/fine-tuning-read/unsupported-read-provider.yaml
deviations: []
out_of_scope:
- B1052 owns create and its request helpers, B1141 cancellation, B2487 timeout capability/default settings and its finite-duration deviation.
- B518/B542 own SDK URL encoding and response decoding. B088 owns actual retrieve/list proxy routes.
pitfalls:
- List is undecorated while retrieve uses @client, so their exception projections must be checked independently.
- The list default is null and is not replaced with the docstring's 20.
- Azure list results do not run the per-job normalization used by retrieve.
review_level: security
budget:
  max_changed_lines: 680
  max_new_expects: 0
