dod:
  - text: Environment variables in custom headers with os.environ/NAME syntax are resolved to their values at registration time through the config loader.
    proof: [header-env-resolution]

  - text: Custom headers named LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY are base64 encoded and combined into a single Authorization header with Basic scheme, not passed as plain os.environ/ substitutions.
    proof: [langfuse-auth-header-encoding]

  - text: Exact path routes are registered with SafeRouteAdder for every configured HTTP method, or all five (GET, POST, PUT, DELETE, PATCH) if none are specified.
    proof: [exact-route-registration]

  - text: Subpath routes are registered when include_subpath is true, creating a wildcard route under the same endpoint.
    proof: [subpath-route-registration]

  - text: Routes requiring auth are added to LiteLLMRoutes.openai_routes so the auth system protects them.
    proof: [auth-route-visibility]

  - text: Endpoints without an id field receive a generated UUID at registration time.
    proof: [endpoint-id-generation]

  - text: Config and database endpoints are merged in the order supplied, and routes are registered in that order.
    proof: [route-order-preservation]

  - text: Missing path field in an endpoint raises ValueError with message "Path is required for pass-through endpoint" and stops registration of that endpoint.
    proof: [missing-path-error]

  - text: Missing target field causes registration to return early without creating a route, even if auth gating or openai_routes was already applied to the path in the same call.
    proof: [missing-target-silent-return]

  - text: Stale routes from prior configuration loads (by exact route key) are removed after initialization, but path entries in openai_routes are preserved if still owned by a live endpoint.
    proof: [stale-route-removal]

  - text: The missing auth default (false when absent) is preserved from the raw dict, not replaced by the typed config model's default.
    proof: [raw-dict-auth-default]

  - text: Every exact and subpath entry stores the config_file_path its route was first installed with, the config file path on a file load and None from the database and runtime callers, and a later call that registers the same path and methods with None keeps the remembered file path.
    proof: [config-file-path-stored]

checks:
  optional: []
  commands:
    - id: header-env-resolution
      why: environment variable substitution in headers is missing or broken
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::resolve_os_environ_in_headers)'

    - id: langfuse-auth-header-encoding
      why: LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY headers are not base64 encoded into Authorization headers
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::langfuse_)'

    - id: exact-route-registration
      why: exact path routes are not registered correctly or method defaults are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::exact_route_)'

    - id: subpath-route-registration
      why: subpath/wildcard routes are missing or not created correctly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::subpath_route_)'

    - id: auth-route-visibility
      why: routes requiring authentication are not added to the auth system's visible routes
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::auth_)'

    - id: endpoint-id-generation
      why: endpoints without id fields do not receive generated UUIDs
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::id_generation)'

    - id: route-order-preservation
      why: routes are not registered in the order they appear in the merged endpoint list
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::order_)'

    - id: missing-path-error
      why: missing path field does not raise ValueError or error message is incorrect
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::missing_path)'

    - id: missing-target-silent-return
      why: missing target field does not return early or leaves orphaned entries in openai_routes
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::missing_target)'

    - id: stale-route-removal
      why: stale routes from prior loads are not cleaned up or path entries are incorrectly removed
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::stale_removal)'

    - id: raw-dict-auth-default
      why: missing auth field is not preserved as false, or typed defaults are incorrectly applied
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::auth_default)'

    - id: config-file-path-stored
      why: an entry lacks config_file_path, stores it on a database or runtime install, or loses the remembered value on a later call
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(passthrough_route_registration::config_file_path)'

oracle_cases: []

deviations:
  - what: Missing auth field in raw endpoint dicts defaults to false (unauthenticated), not to the typed config model's default of true.
    why: betterlite preserves the raw configuration behavior where an absent auth field means the endpoint is open; requiring explicit opt-in to auth matches the source and avoids silent changes in behavior.
  - what: Custom headers named LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY receive special treatment as base64-encoded Basic Authorization headers.
    why: Langfuse's integration requires a specific authorization header format distinct from other os.environ/ header substitutions.

out_of_scope:
  - create_pass_through_route and the endpoint function it builds (B3615); calling it for a matched request with the stored entry, config_file_path included (B8643).
  - Lower route lookup, collision detection and registry queries (B3614).
  - Config and database persistence of pass-through endpoints; this task only reads them.
  - HTTP method normalization beyond passing configured methods to SafeRouteAdder.
  - Guardrail processing; this task stores the endpoint's guardrails dict in the entry's passthrough params as given, and B8643 hands it to B3615's create_pass_through_route.
  - Cost per request validation; the endpoint dict value is passed through as-is.

pitfalls:
  - >-
    When merging config and database endpoints, preserve their order: the first-match lookup
    in B3614 depends on registration order.
  - >-
    Route keys in the visited set must exactly match the format {id}:{type}:{path}:{methods},
    where methods are sorted and joined with commas.
  - >-
    When an endpoint specifies auth=true, add both the exact path and the wildcard path to
    openai_routes, but only if include_subpath=true for the wildcard.
  - >-
    Do not normalize the auth field value; auth="true" (string) and auth=true (bool) both trigger
    dependency injection, but both must be converted to a boolean before comparing.
  - >-
    The include_subpath field uses strict identity check (is True), not truthy comparison, so a string "true"
    from a database-stored dict will not enable the subpath route. This differs from auth normalization
    and means db-sourced dicts must have include_subpath as a boolean, not a string.
  - >-
    LiteLLM's LiteLLMRoutes.openai_routes is a global list that is appended to, not cleared;
    check for path membership before adding to avoid duplicates across reload cycles.
  - >-
    The registry dict key must be stable across reloads for the same endpoint_id and path,
    so stale-route removal by key can find and drop entries from old loads.
  - >-
    LiteLLM's load_config passes the same config list twice (as pass_through_endpoints and again as
    config_passthrough_endpoints), and every database reload registers it once more with None; a test
    that only checks the first call's entry misses the case where None overwrites the remembered
    config file path.
  - >-
    Missing target field causes early return before any route is registered, but any auth gating
    and openai_routes path entries added before the target check are left behind. Callers must
    ensure target is present before calling or be prepared to handle orphaned auth entries.

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
