id: B3616
title: Pass-through configured route registration
description: >-
  Implement pass-through endpoint registration from configuration and database sources,
  resolving header variable references and initializing both exact and subpath routes.

  The configuration sources are merged from two places: endpoints defined in the typed config.yaml
  (loaded by B002) and endpoints persisted in the database. When a pass-through endpoint from either
  source lacks an `id` field, generate one as a UUID. For each endpoint, resolve any headers
  that contain `os.environ/NAME` references to actual environment variable values using the
  config's secret resolution. Do not alter defaults: where the raw LiteLLM dict omits `auth`,
  keep it absent (falsy) rather than applying the typed config model's different default.

  Register each endpoint exactly once per configuration load, using the SafeRouteAdder from B3614
  to avoid FastAPI panics on duplicate routes. Register the exact path with every configured HTTP
  method, or all five methods (GET, POST, PUT, DELETE, PATCH) if none are specified. If the
  endpoint specifies `include_subpath: true`, also register a wildcard subpath route and add both
  the exact and wildcard paths to LiteLLMRoutes.openai_routes when auth is required, so the auth
  system sees them as protected routes.

  When routes are reloaded, stale registry entries from earlier loads must be removed (by exact
  route key, not endpoint ID) while preserving their path entries in openai_routes if those paths
  are still owned by a live endpoint registered in the same cycle.

  After every endpoint registration attempt, track its route key in a visited set. Remove all
  registered routes whose keys are not in the visited set, cleaning up entries from the prior
  configuration snapshot without leaving orphaned routes in the registry. Do not call the route
  factory or the HTTP client here. LiteLLM's add_exact_path_route and add_subpath_route build the
  endpoint function with create_pass_through_route when they install a route, but an axum router
  can't change once it serves, so B8643's configured dispatch calls B3615's create_pass_through_route
  for each matched request from the entry this task writes. This task writes that entry and
  installs the path and methods in B3614's RouteTable, nothing more.

  The proxy startup (B8374, on a config file load) and the database and runtime paths (B8384,
  B8379, B8520) call initialize_pass_through_endpoints. It takes the shared route handle described
  below, the list of endpoints and `config_file_path: Option<&str>`; add_exact_path_route and
  add_subpath_route take the handle and config_file_path too, since B8520 calls them directly with
  None. Store config_file_path as an owned `Option<String>` on every exact and subpath entry. That
  is how the config file path reaches create_pass_through_route, where get_instance_fn uses it to
  load s3:// and gcs:// custom handlers and modules that sit next to config.yaml; the database and
  runtime callers pass None, so that gate refuses remote handlers at runtime.

  An entry carries the config_file_path its route was first installed with. The handle remembers
  the value per route that B3614's add_route_if_not_exists installed (that table never drops a
  route). When a later call gets false back because the path and methods are already installed,
  look that route up with colliding_routes and store its remembered value instead of the call's
  own; with no remembered value (a static app route holds the path) store the call's value.
  LiteLLM behaves this way because SafeRouteAdder never replaces an endpoint function it already
  added, and every database reload registers the config endpoints again with None.

  The registry is not a module global: the caller passes in one shared handle per process (B8640
  builds it, B8614's PassThroughState.routes carries it). Define its type here, for example an Arc
  of a lock around B3614's RouteTable, B2302's PassThroughRegistry, the passthrough params by route
  key and the remembered config_file_path per installed route; B8614, B8520 and B8643 read its
  merged name. Entries are keyed by route key ({id}:{type}:{path}:{methods}) and hold the endpoint
  metadata, the passthrough params (target, custom_headers, forward_headers, merge_query_params,
  default_query_params, cost_per_request, guardrails, timeout) and config_file_path, so B8643 builds
  a handler from one entry. Preserve the order of endpoints as they appear in the combined list,
  since LiteLLM's first-match logic relies on it.

scope:
  paths:
    - crates/betterlite-server/src/passthrough/route_registration.rs
    - crates/betterlite-server/src/passthrough/route_registration/tests.rs
    - crates/betterlite-server/src/passthrough/route_registration/tests/**
  lint_tables: false

