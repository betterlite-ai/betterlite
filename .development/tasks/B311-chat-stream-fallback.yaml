id: B311
title: Fallback before generated chat output commits
description: Extend B005's stream lifecycle with the B310 fallback engine. Track whether text, reasoning
  or tool output has actually committed, own the upstream and deployment slot across stream acquisition,
  and transfer response metadata and usage when a new stream takes over. Keep stream errors typed and
  close both failed and replacement streams on cancellation. Add an error-event parser target only if
  the existing B005 SSE parser does not already cover the new input; in either case seed and replay its
  existing corpus. Use the existing Rust crate boundaries from B004 and B008; integrate through the server
  when the provider dispatcher or callbacks live in another core crate. This task's source slices are
  the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Keep the implementation, adapters and tests
  within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-server/**
  - crates/betterlite-openai/**
  - tools/oracle/cases/routing/chat-stream-fallback/**
  - tools/oracle/src/router_probes/chat-stream-fallback/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/chat_stream_fallback.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L2833-L3090
  why: Chat stream wrapper, generated-content boundary, usage and cleanup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L454-L478
  why: Generated-output detection.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(chat_stream_fallback)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/chat-stream-fallback/failure-before-chunk.yaml
- tools/oracle/cases/routing/chat-stream-fallback/role-only-then-error.yaml
- tools/oracle/cases/routing/chat-stream-fallback/text-then-error-no-fallback.yaml
- tools/oracle/cases/routing/chat-stream-fallback/tool-fragment-no-replay.yaml
- tools/oracle/cases/routing/chat-stream-fallback/fallback-chain-second-stream-fails.yaml
- tools/oracle/cases/routing/chat-stream-fallback/replacement-usage-and-headers.yaml
- tools/oracle/cases/routing/chat-stream-fallback/cancel-releases-both.yaml
deviations: []
out_of_scope:
- Responses and Anthropic event commitment (B312).
pitfalls:
- Receiving a role chunk is different from committing generated output.
- Headers already sent on HTTP cannot be rewritten; compare visible headers and internal final metadata
  separately.
- Use B005's parser rather than a second SSE implementation.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
