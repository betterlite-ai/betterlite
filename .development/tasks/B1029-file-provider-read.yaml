id: B1029
title: File SDK metadata and list selection
description: >-
  Add the whole afile_retrieve/file_retrieve and afile_list/file_list functions to
  betterlite-core::api::file_provider_read. Their provider-selection order differs: retrieve
  tests OpenAI-compatible and Azure first, list tests the provider config first. Use B516/B694
  for compatible/Azure methods and B2462 for generic operations, with B500/B2200 credentials,
  B176 trusted controls, B010 operation types, B2464 file registry/timeout selection and B012 logging.

  This task does not implement proxy pagination: the SDK wrapper forwards purpose but drops
  after/limit/order. Generic provider pagination belongs to B2462, OpenAI SDK pages to B516.
  Register file_provider_read as a B2401 SDK HTTP operation; record actual requests and SDK
  results/errors for sync and async calls. Native tests in api::file_provider_read::tests also
  inspect callback construction and dropped fields. No helper or new decoder is needed.
  Whole functions with decorators count 289 nonblank, non-comment lines. Allow 210 implementation,
  150 tests, 120 fixtures, 90 adapters and 30 wiring lines, totaling 600.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_provider_read.rs
  - crates/betterlite-core/src/api/file_provider_read/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/file_provider_read.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/file_provider_read.py
  - tools/oracle/cases/sdk-http/file-provider-read/**
  - tools/oracle/fuzz/corpus/sdk_http_case/file-provider-read-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/main.py#L298-L463
  why: Retrieve dispatch and the asynchronous OpenAIFileObject revalidation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/main.py#L643-L802
  why: Config-first listing, purpose forwarding and subtly different fallback logging id handling.
dod:
- text: >-
    retrieve_provider_metadata calls both forms without a provider and gets openai; hosted_vllm
    and litellm_proxy use the same compatible branch, azure its credential/version branch, and
    anthropic the generic config. file_id=f survives unchanged until the provider path encoder.
    Async revalidates response.model_dump() as OpenAIFileObject; sync returns the provider object.
    A mock 404 with type=invalid_request_error,param=file_id,code=file_not_found,message=missing
    retains those error facts through the selected provider. extra_headers/extra_body are unused
    by OpenAI/Azure retrieve; generic retrieve uses extra_headers or {} but ignores extra_body.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    list_purpose_without_client_cursor sends purpose absent,null,"",batch and after=f,limit=1,
    order=asc. OpenAI forwards string purpose only, including "", and sends none of those three
    pagination kwargs; generic list gets purpose and its own pagination context, not new query
    parameters invented from the caller's kwargs. Mock pages preserve provider order and duplicates.
    Returned list/page shapes remain those of the chosen provider; this dispatcher adds no object=list wrapper.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    read_deadline_and_mode covers timeout=2 over request_timeout=3; absent/null/0 values fall
    back to 600, numeric "2.5" becomes 2.5, invalid text fails before dispatch. HTTP timeout objects
    pass intact for openai/azure/bedrock and otherwise reduce to read or 600. Only is_async=true
    activates async mode; both async wrappers force it and preserve context across the executor.
    B2462's generic retrieve drops the deadline at GET despite receiving it from this dispatcher.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    read_trusted_context passes trusted model credentials to the generic config, then overwrites
    api_key/api_base with optional values even when null. Only HTTPHandler/AsyncHTTPHandler client
    objects survive there; OpenAI/Azure read wrappers do not receive the SDK caller's client.
    Missing logger creates model="",messages=[],stream=false,clock start_time, call_type
    file_retrieve/afile_retrieve or file_list/afile_list, and litellm_call_id from kwargs.get with
    a generated UUID default (explicit null remains null). Retrieve function_id=str(id or "");
    list function_id=str(kwargs.get("id","")), so id=null gives "None" only for list.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    unsupported_file_read passes cohere and expects BadRequestError 400,type=null,param=null,
    code=null,message="litellm.BadRequestError: LiteLLM doesn't support cohere for 'file_retrieve'.
    Only 'openai', 'azure', 'manus', and 'anthropic' are supported." List substitutes 'file_list'
    in that exact message. Both error bodies are "Unsupported provider", model=n/a;
    request method=create_thread for retrieve and file_list for list, URL=https://github.com/BerriAI/litellm.
    Unknown provider names fail enum conversion before these branches. No provider request occurs.
  proof: [behavior-tests, oracle, sdk-python]
- text: Metadata/list parity uses new mock captures and a typed SDK protocol seed.
  proof: [new-cases, sdk-seeds, oracle, sdk-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: list field dropping and retrieve dispatch have no native assertions
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_provider_read::tests::/) - test(/replays_/)'
  - id: sdk-python
    why: file metadata SDK adapter is missing or untyped
    run: test -f tools/oracle/sdk_http/file_provider_read.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-seeds
    why: read operation has no added SDK seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/file-provider-read-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: SDK metadata requests lack independent fixtures
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/file-provider-read)"
oracle_cases:
- tools/oracle/cases/sdk-http/file-provider-read/retrieve-provider-metadata.yaml
- tools/oracle/cases/sdk-http/file-provider-read/list-purpose-without-client-cursor.yaml
- tools/oracle/cases/sdk-http/file-provider-read/read-deadline-and-mode.yaml
- tools/oracle/cases/sdk-http/file-provider-read/read-trusted-context.yaml
- tools/oracle/cases/sdk-http/file-provider-read/unsupported-file-read.yaml
deviations: []
out_of_scope:
- B1028 owns upload/delete, B1030 content and content-logging helpers. B2462 owns all generic metadata HTTP and pagination methods.
- Python executor facades are B159-B161; provider path encoding, authentication and response decoding stay B516/B694 or the concrete config selected by B2464.
pitfalls:
- The source accepts after/limit in kwargs but these wrappers do not send them to OpenAI.
- List's null id becomes the string "None" in function_id; retrieve uses an empty string.
- Async retrieve reconstructs OpenAIFileObject, while async list returns the awaited result directly.
review_level: security
budget:
  max_changed_lines: 600
  max_new_expects: 0
