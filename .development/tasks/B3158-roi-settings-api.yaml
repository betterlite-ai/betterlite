id: B3158
title: Persist ROI settings and expose admin configuration
description: >-
  Build stored-settings loading, encrypted secret updates, public readiness projection and GET/PUT
  `/roi-calculator/settings` in `betterlite-server::roi_settings`. Preserve read-only-admin access,
  write-admin checks, encrypted-secret reuse, token clearing when the GitHub origin changes,
  explicit-null URL rejection, validation errors and model-name sorting. Settings are stored in
  the config repository with key `roi_calculator_settings` and loaded as `_StoredSettings`, a
  pydantic model with `ConfigDict(extra="ignore")` that holds github_api_url (default `https://api.github.com`),
  github_token (default empty, encrypted when saved), estimator_key (default empty, encrypted),
  repos (tuple, default empty), estimator_model (default empty), estimator_prompt (default `DEFAULT_PROMPT`),
  backfill_days (int, default 7, validated 1-3650), update_interval_minutes (float, default 1440,
  validated 0-43200), and identity_map (mapping, default empty). Decryption errors raise 500 with
  "Stored ROI Calculator settings are invalid." The public response includes available_models (sorted
  unique router model names), ready flag (true when repos and estimator_model are set and model exists),
  has_github_token and has_estimator_key (boolean flags without values), and all user-visible settings.
  Token is cleared (set to empty encrypted string) when github_api_url changes, checked by stripping
  trailing slashes. Requests to update with null github_api_url return 422. Validation failures in
  ROISettings construction on PUT return 422 with pydantic error details. Missing database returns 500
  with "DB not connected. This endpoint needs a database; set DATABASE_URL to a PostgreSQL connection
  string (postgresql://...) to enable it. See https://docs.litellm.ai/docs/proxy/virtual_keys" error.
