dod:
  - text: Data classes _RouterEstimatorParams, _RouterEstimatorModelInfo and _RouterEstimatorDeployment parse router deployment objects with ConfigDict(extra="ignore", from_attributes=True).
    proof: [deployment-class-cases]
  - text: _estimator_models_from_deployments parses deployment objects via TypeAdapter and returns a tuple of EstimatorModel (model name, custom_llm_provider), skipping entries without a model.
    proof: [estimator-models-cases]
  - text: _estimator_model extracts the model field from a _RouterEstimatorDeployment by checking deployment.model_info.base_model first, then parameters.base_model, then parameters.model, returning None if all are absent.
    proof: [estimator-model-cases]
  - text: _router_estimator_models calls llm_router.get_model_list with the supplied model_name and returns a tuple of EstimatorModel for matching deployments, or empty tuple if llm_router is None.
    proof: [router-estimator-models-cases]
  - text: _router_models calls llm_router.get_model_names, validates result via TypeAdapter, sorts unique values and returns a tuple of sorted model names, or empty tuple if llm_router is None.
    proof: [router-models-cases]
  - text: _read_admin allows proxy admin and proxy admin view-only roles, returns 403 Forbidden for other roles.
    proof: [read-admin-cases]
  - text: _write_admin allows proxy admin only, returns 403 Forbidden for view-only or non-admin.
    proof: [write-admin-cases]
  - text: get_roi_config_repository loads ConfigRepository with use_writer=True or returns 500 with "DB not connected. This endpoint needs a database; set DATABASE_URL to a PostgreSQL connection string (postgresql://...) to enable it. See https://docs.litellm.ai/docs/proxy/virtual_keys" when prisma_client is None.
    proof: [config-repository-cases]
  - text: _load_stored_settings reads the "roi_calculator_settings" parameter from ConfigRepository, returns default _StoredSettings if None, raises 500 "Stored ROI Calculator settings are invalid." on validation error.
    proof: [load-stored-cases]
  - text: _load_settings decrypts github_token and estimator_key using decrypt_value_helper with key "roi_calculator_settings", constructs ROISettings, returns 500 "Stored ROI Calculator settings are invalid." on validation error without logging.
    proof: [load-settings-cases]
  - text: _save_settings encrypts github_token and estimator_key using encrypt_value_helper, stores as _StoredSettings via set_param with key "roi_calculator_settings".
    proof: [save-settings-cases]
  - text: _public_settings returns sorted unique router model names as available_models, ready flag true only when repos and estimator_model are both set and estimator_model appears in available_models.
    proof: [public-settings-cases]
  - text: _load_report reads the "roi_calculator_report" parameter from ConfigRepository, returns None if absent, raises 500 "Stored ROI Calculator report is invalid." on validation error.
    proof: [load-report-cases]
  - text: GET /roi-calculator/settings requires read-admin, returns 200 with public settings.
    proof: [get-route-cases]
  - text: PUT /roi-calculator/settings requires write-admin, returns 422 if patch contains explicit null github_api_url.
    proof: [put-null-url-cases]
  - text: PUT clears github_token (both plaintext and encrypted) when github_api_url changes, detected by rstrip("/") comparison.
    proof: [put-url-change-token-clear]
  - text: PUT preserves github_token when URL does not change and token not supplied.
    proof: [put-url-same-token-preserve]
  - text: PUT encrypts new token when supplied, uses empty string for missing or falsy token.
    proof: [put-token-encryption-cases]
  - text: PUT validates reconstructed ROISettings and returns 422 with pydantic error details on validation failure.
    proof: [put-validation-cases]
  - text: PUT returns 500 when ConfigRepository is None or when loading existing settings fails.
    proof: [put-db-error-cases]
