pitfalls:
  - Token is cleared by comparing rstrip("/") results, so "https://api.github.com/" and "https://api.github.com" are the same URL.
  - Decryption that returns an empty string is treated as no secret; encryption of an empty string produces an empty encrypted value.
  - model_fields_set from pydantic allows detection of which fields the client sent; a missing field uses the current value, not the default.
  - _StoredSettings uses ConfigDict(extra="ignore") to allow new fields from the router without breaking deserialization.
  - The ready flag requires an exact model name match; it does not infer or resolve model aliases.
  - Validation errors from ROISettings construction are converted to pydantic error details by exc.errors(include_context=False).
