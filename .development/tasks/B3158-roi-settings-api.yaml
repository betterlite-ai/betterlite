deviations:
  - what: Decryption failures for github_token or estimator_key do not log a warning and return the result of decrypt_value_helper unchanged.
    why: LiteLLM decrypts secrets silently without logging; betterlite preserves this behavior to avoid logging partial or corrupted secrets.
  - what: Invalid stored settings that fail ValidationError raise HTTP 500 immediately without attempting fallback or partial recovery.
    why: A stored value that cannot deserialize to _StoredSettings indicates database corruption or a configuration issue; returning 500 signals the operator to investigate.
  - what: The ready flag checks whether estimator_model is a member of available_models by exact string match; it does not attempt to resolve aliases or provider prefixes.
    why: The model list from the router is the source of truth; only configured models in that list are valid for the estimator.
