deviations: []
out_of_scope:
  - B9090 retains every logging/alert/fallback component and its pure formatting helpers; this task adds no client patch or settings registry.
  - B8594/B8595/B8596/B8675 retain all config route implementations; B8230 separately serves runtime plugin metadata and is not the editor's field-info route.
  - B066 owns callback metadata, B4447/B8540/B116 health and alert delivery, B8389 descriptors, B004/B310/B8350 fallback inference, and B077 public model costs.
  - Email-event handlers have no MIT implementation at the pin; licensing removal does not supply an absent enterprise service.
pitfalls:
  - Email overwrites alerting with [email], whereas Teams reads and unions the latest destinations before saving.
  - The alerting form merges initial descriptor values last, so constructing a cleaner patch changes the request under test.
  - A plugin edit goes to /config/field/update, not /api/plugins or /claude-code/plugins.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
