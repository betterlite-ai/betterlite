dod:
  - text: Callback, email, Teams, Slack, spend-log and plugin edits replay the pages' exact write/read sequences through the mounted config services.
    proof: [logging-transcripts, oracle]
  - text: The fallback editor and its mock-testing completion agree with the real router, while absent email-event routes remain observable not-found responses.
    proof: [logging-transcripts, oracle]
checks:
  optional: []
  commands:
    - id: logging-transcripts
      why: Existing callback initialization cases do not exercise dashboard form updates.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/logging-settings)"
