dod:
  - text: Every named description case proves its branch, including the fallback defect, direct
      metadata payload, sequential password writes and partially committed failures.
    proof:
      - behavior-tests
  - text: postgres_fast_path and postgres_fallback_effects prove actual direct updates, JSON storage,
      concurrent-row snapshots and cache-failure rewrites against independent Postgres fixtures.
    proof:
      - postgres-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_bulk_update::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Real fast-path writes or fallback effects are absent or differ from the pin.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_bulk_update::tests::postgres_fast_path$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_bulk_update::tests::postgres_fallback_effects$/)'
