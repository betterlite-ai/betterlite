id: B795
title: Bulk user update endpoint
description: >-
  Implement authenticated POST /user/bulk_update with B865 effects, B2334 body/response records and
  optional litellm-changed-by header default null. It never calls bulk-create or bulk-delete helpers.
  Missing DB raises HTTPException 500 detail.error='Database not connected' before handler guards.
  Select requested role from user_updates first, otherwise first non-null role in users; any non-null
  role requires exact proxy_admin (403 'Only proxy admins can modify user roles.'). This rejects the
  WHOLE batch, even when another row would be permitted. Cases database_first, role_guard_whole_batch
  and changed_by_forwarding cover those branches.

  Truthy all_users AND user_updates chooses the fast path, otherwise truthy users selects the list,
  otherwise 400 detail.error explains the required users/all_users+user_updates alternatives.
  Preserve B2334's omitted-user_updates validator timing: {} reaches this 400; explicit null can
  fail with 422 earlier; conflicting selectors with a supplied patch fail schema validation.
  All-users requires proxy_admin (403 'Only proxy admins can update all users at once.') and rejects
  ANY non-null password, including empty, with 400 detail.error='Setting one password for all users
  is not supported. Use per-user updates via the users list instead.' (source quotes 'users').
  Cases selection_omitted_vs_null, conflicting_selectors_422, all_users_admin_only and
  all_users_password_null_vs_empty pin these errors and their ordering.

  Fetch all users ordered created_at desc before checking 0 or >500 rows. Empty raises 400
  detail.error='No users found to update'; oversized raises 400 naming maximum 500 and found count.
  Individual lists have the same 500 cap without a preflight DB count; preserve input duplicates.
  Cases all_users_empty, all_users_limit_after_read, individual_limit_500 and duplicate_updates_repeat.
  Prepare all-users patch through B792, then remove user_id/user_email. update_many uses where={}
  and serializes ONLY model_max_budget with json.dumps; count returned by the write is ignored.
  Concurrently inserted users can be updated but omitted from the response's earlier snapshot.
  Cases fast_update_all_rows, model_budget_json_only and concurrent_insert_response_snapshot.

  This fast path bypasses the single-user helper's role/self checks, finite-spend check,
  prepare_metadata_fields, encrypt_callback_vars, object-permission service, session revocation and
  spend-counter invalidation. Preserve the exact direct-update payload and repository acceptance
  or failure for those fields; do not silently route a successful fast update through B792.
  In particular raw metadata is forwarded unchanged, whereas per-user B792 encrypts callback
  variables through B894. Cases fast_metadata_payload_unchanged, fast_permission_payload,
  fast_spend_counter_unchanged and per_user_callback_encrypted inspect rows and collaborator calls.
  This documents a source asymmetry, not a claim that the fast path encrypts stored credentials.

  After update_many, only max_budget/model_max_budget trigger user-ID evict_and_broadcast.
  Own _USER_BUDGET_CACHE_INVALIDATION_BATCH_SIZE=50 at L117: await gather in chunks of 50 in
  snapshot order, aborting on a cache exception. Metadata/duration/spend alone do not broadcast.
  Fast results contain snapshot ID/email,success=true,updated_user={user_id,...prepared_patch};
  they are not reread rows. Build one asynchronous B797 audit for caller.user_id or empty string,
  action=updated, changed-by header-or-caller, before='Updated {N} users', after=json.dumps(patch).
  Audit scheduling/serialization errors warn and leave success intact (e.g. a datetime reset_at).
  Cases invalidate_chunks_fifty, fast_invalidation_field_set, fast_result_is_patch,
  single_bulk_audit and audit_json_datetime_warning prove ordering and literals.

  A write, broadcast or result-building exception logs and constructs per-user copies of the
  no-ID/email patch, assigning each snapshot ID. No rollback occurs; cache failure may cause a
  second write to an already-updated row. Preserve the pinned fallback defect: those copies
  inherit user_id but have NO user_email field. After the first helper update, success-result
  construction accesses user_email and fails; failure-result construction accesses it again,
  so the outer helper catch raises HTTPException 500 detail.error with that AttributeError.
  Cases fast_write_failure_fallback_500 and cache_failure_rewrite_then_500 prove persisted effects
  and that later rows are not individually retried. If some fast results were already counted
  before a result-building failure, successful_updates>0 returns those partial results with
  failed_updates=0 and original total_requested instead; partial_fast_result_count pins this.

  For ordinary individual requests, preflight ALL non-null passwords through B786
  validate_passwords_bulk before ANY user write. The preflight is outside the helper's outer
  try and receives optional hibp_client; individual calls pass password_prevalidated=true,
  omit hibp_client and run SEQUENTIALLY, not concurrently. Raise each non-null verdict before
  that row's update. B792 still hashes and revokes sessions. Cases password_preflight_before_writes,
  password_verdict_skips_row, password_hash_not_revalidated and individual_serial_order.

  Success user_id comes from truthy response.get(user_id), otherwise requested ID; user_email
  remains the REQUEST email, updated_user is the whole helper response, error=null. A bare-model
  insert response lacking get can turn a committed insert into a failed result. Row exceptions
  produce both exception and error logs, then success=false,error=str(exception), requested ID/email,
  updated_user=null, and continue. HTTPException row text includes its status; do not use B124's
  exception converter. Cases response_id_and_requested_email, bare_model_insert_row_failure,
  row_error_text_and_continue and mixed_counts_and_order compare all fields. An exception in
  result handling itself becomes HTTPException 500 detail.error, as in the fallback defect above.

  There is NO route except block. Handler HTTPExceptions retain the outer {detail:...} envelope,
  without OpenAI type/param/code; unexpected preflight errors reach B124's outer 500
  internal_server_error envelope (no param/code). Auth/schema failures remain B052/B2334.
  Cases route_http_detail_envelope and preflight_unexpected_500 distinguish these mappings.


  Build the production user_bulk_update module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  bulk_update_processed_users (L1756-L1831; 64 source lines), bulk_user_update (L1841-L2064; 188 source
  lines), plus the batch-size declaration at L117. B792 owns the shared budget-cache field set.


  B001 HTTP cases cover the real route and B860 supplies equivalent Postgres fixtures. Native
  fault injection checks post-write failures and helper-only response shapes. Database cases
  use POSTGRES_TEST_URL or testcontainers, unique schemas and fail on infrastructure errors.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 252 source lines before removing the route's long docstring plus one declaration;
  allow 240 production, 390 behavior/Postgres tests and 65 wiring, 695 changed lines within
  a 750-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
