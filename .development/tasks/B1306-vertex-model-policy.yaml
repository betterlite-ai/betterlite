references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/common_utils.py#L28-L351
    why: Own endpoint unsupported-parameter constants, Lyria lookup, error, redaction, labels and model policy.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/common_utils.py#L388-L408
    why: Publisher versus deployed Model Garden recognition.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/common_utils.py#L972-L986
    why: The Z-shaped timestamp is parsed as a naive local datetime before integer conversion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_partner_models/main.py#L29-L88
    why: Own PartnerModelPrefixes and is_vertex_partner_model/should_use_openai_handler; constructor is B032.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/vertex_ai.py#L781-L787
    why: Exact fields removed from logging metadata copies.
dod:
  - text: Routing order, capability failure, Lyria overlays and labels match their independent source helpers.
    proof: [policy-tests, oracle, policy-python]
  - text: Both visible and hidden metadata copies are scrubbed and timestamp conversion keeps source precision rules.
    proof: [metadata-tests, oracle, policy-python]
  - text: The policy helper variant is exercised by a newly committed input.
    proof: [policy-seed]
  - text: Timestamp decoding preserves fractional width and local-time behavior on newly committed parser inputs.
    proof: [metadata-tests, timestamp-corpus, oracle, policy-python]
checks:
  optional: []
  commands:
    - id: policy-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^model_policy::/)' && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^request_labels::/)'
      why: Every routing and label module must contain behavior tests.
    - id: metadata-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^provider_metadata::/) - test(replays_the_vertex_timestamp_corpus)'
      why: Hidden response metadata or timestamp behavior is untested or incorrect.
    - id: policy-python
      run: test -f tools/oracle/helpers/vertex_model_policy.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Policy adapters must preserve Python warnings and metadata effects.
    - id: policy-seed
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/vertex_model_policy*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::vertex::model_policy::/)'
      why: Seed decoding must assert the vertex_model_policy variant and reject zero inputs.
    - id: timestamp-corpus
      run: test -f crates/betterlite-vertex/fuzz/fuzz_targets/vertex_timestamp.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-vertex/fuzz/corpus/vertex_timestamp)" && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(replays_the_vertex_timestamp_corpus)'
      why: Timestamp replay must call the production decoder with a deterministic injected local-time context.
