id: B1306
title: Vertex model routing, labels and catalog metadata
description: >-
  Create model_policy, request_labels and provider_metadata modules in betterlite-vertex.
  Own common_utils L28-L351 and L388-L408, together with the partner prefix enum and its two
  recognition predicates. Route base_model containing gemini first, then agent_engine, numeric
  endpoint with api_base, partner prefixes, BGE, Gemma, Model Garden and Gemini, finally legacy
  models. Keep partner-prefix recognition separate from the substring test selecting the OpenAI
  handler; google/gemma- is a partner while gemma/ is a deployed endpoint. Capability lookup
  treats vertex_ai_beta as vertex_ai and warns then returns false on system-message lookup
  failure. responseJsonSchema uses its own Gemini-2-plus regex, not the URL version predicate.
  Implement typed Lyria catalog overlays with invalid runtime entries falling back to bundled
  data and runtime price absence falling back independently. Billing labels consume explicit
  labels first, then metadata.requester_metadata, then litellm_metadata.requester_metadata;
  only string values survive and an empty selection falls through. Redaction clears the five
  named provider metadata fields on response objects and removes their hidden copies from both
  metadata dictionaries. Preserve VertexAIError's status and headers using B240's classifier.
  Use separate rstest tables route_cases, label_cases and metadata_cases; the helper operation
  vertex_model_policy invokes the matching pinned function on each typed input. Cases include
  base_model_priority, numeric_psc, partner_vs_deployed_gemma, catalog_failure_warning,
  lyria_runtime_fallback, labels_fall_through and metadata_hidden_copies. Record timestamp
  conversion in metadata_cases too: own _convert_vertex_datetime_to_openai_datetime L972-L986.
  decode_vertex_timestamp accepts bounded UTF-8 timestamp bytes in %Y-%m-%dT%H:%M:%S.%fZ
  format, with one to six fractional digits. Despite Z, Python creates a naive datetime and
  interprets it in the process's local timezone; int(timestamp) truncates toward zero.
  Supply an immutable LocalTimeContext from bootstrap, preserving fold=0 behavior at timezone
  transitions without runtime environment reads. Use a maintained calendar library and share
  this context with file/tuning timestamp conversions. Test UTC, a non-UTC zone, transition
  boundaries, negative fractional epoch and invalid fractional width. Fuzz this decoder with
  vertex_timestamp and replay new seeds. The owned functions/constants contain 312 nonblank
  noncomment lines excluding the partner constructor, plus metadata-field declarations; plan
  300 implementation, 230 tests, 110 adapters and 110 fuzz/wiring lines within 800.
