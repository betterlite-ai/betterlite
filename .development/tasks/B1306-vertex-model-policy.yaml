deviations: []
out_of_scope:
  - Common URL functions L352-L387/L409-L602 are B1305; _check_text_in_content is B1312; schema functions L618-L971/L987-L1066 are B1307; passthrough helpers L1067-L1169 are B1304; model-info/token-count classes from L1170 are B1330.
  - Partner main.py error construction, initialization, completion and count_tokens are composed by B032.
  - Provider response wire records in types/llms/vertex_ai.py belong to B1311-B1315 and the corresponding endpoint tasks; this part owns only metadata field names.
pitfalls:
  - 'The oracle helper for this task is pre-registered as vertex_model_policy in the vertex group. Replace the stub Op in tools/oracle/src/helpers/vertex/model_policy.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vertex_model_policy.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Explicit labels containing only non-string values still permit requester_metadata fallback.
  - An arbitrary model containing bge routes before the Gemma and Model Garden checks.
  - metadata and litellm_metadata can each contain a hidden_params copy that needs removal.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
