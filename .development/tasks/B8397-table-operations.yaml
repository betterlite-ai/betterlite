id: B8397
title: Remaining PrismaClient table reads and writes and the config row cache
description: >-
  LiteLLM's PrismaClient routes most database work through four dispatchers, `get_data`, `insert_data`, `update_data` and `delete_data`, picked by table_name and query_type, plus `get_generic_data`. Other tasks took some branches: B2320 the combined_view read, B722 the token find_unique read (L4890-L4936), B3011 and B3012 the budget-reset reads (L4935-L4946, L4993-L5012, L5064-L5076), and B2362 the key and user insert and update branches with the shared retry and failure handler. This task builds every branch left, as typed functions in betterlite-db over B714's routed handles, plus the cached LiteLLM_Config reads that the proxy's config loading uses. Code goes in crates/betterlite-db/src/table_ops.rs and table_ops/ (reads.rs, inserts.rs, updates.rs, deletes.rs, generic.rs, team_json.rs, tests.rs) and crates/betterlite-server/src/config_param_cache.rs and config_param_cache/ (the cache lives in the server crate because it uses betterlite-cache's DualCache).

  Read the dispatchers at L4737-L5728 and port, branch by branch: get_generic_data for users, keys, config and spend (find_first by one key, with the backoff of 1 try in 2 seconds and the failure handler with call_type get_generic_data); get_data's key find_all variants by user_id, team_id, expires with reset_at, and all; user find_all by key_val, reset_at, user_id_list and all; spend find_unique and find_all; budget find_all by reset_at; enduser find_all by budget_id_list; team find_unique, find_all by reset_at, user_id, team_id_list and all; user_notification find_unique and find_all. insert_data for team, config (one upsert per param, JSON values through B2362's jsonify_object), spend and user_notification. update_data for team (update and upsert as LiteLLM does), the batch update_many for key, user, enduser, budget and team inside one batch commit (the `_UpdateManyBatch` and `_EndUserBatchTable` protocols at L299-L328 are the shapes of that batch), and team_id_list updates for team and key. delete_data for keys by token list (with an optional team_id or user_id filter), keys by team_id_list (B811 deletes a team's keys this way) and teams by team_id_list. `jsonify_team_object` (L5268-L5274) turns the team's map fields into JSON strings. Every operation keeps LiteLLM's retry (3 tries in 10 seconds with on_backoff, B2362's helper), its failure handler call and its exact SQL filters and ordering; each failure goes through the same `FailureSink` B2362 uses.

  config_param_cache.rs: `get_config_param(param_name)` (L4287-L4297) reads `litellm_config:param:{name}` from a DualCache with the TTL LITELLM_CONFIG_PARAM_CACHE_TTL_SECONDS (default 60, for memory and Redis, read through a config section `config_param_cache`), stores a miss as the marker "__litellm_config_param_miss__" and a hit as `{param_name, param_value}`. `evict_config_param`, `invalidate_config_param` (evict, then publish the change through LiteLLM's `publish_config_param_change`, taken as the trait `ConfigChangePublisher { async fn publish_param_change(&self, param_name: &str); }` this task declares; it returns nothing, as in LiteLLM, and B8399 implements it over B4144's config_sync_pubsub publisher) and `prefetch_config_params` (one find_many for all names, falling back silently on error). `cache_user_row(user_id, cache, db)` (L6996-L7009) stores `{user_id}_user_api_key_user_id` for 600 seconds after a miss.
