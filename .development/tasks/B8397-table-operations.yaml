dod:
  - text: Each remaining get_data and get_generic_data branch returns LiteLLM's rows for its filters, tested against Postgres.
    proof: [table-tests]
  - text: insert_data, update_data and delete_data branches write the same rows, and update_many commits one batch.
    proof: [table-tests]
  - text: Failures retry 3 times in 10 seconds and reach the failure sink with the operation's call_type.
    proof: [table-tests]
  - text: Config params are cached with the miss marker and TTL, evicted, invalidated with a publish, and prefetched in one query.
    proof: [cache-tests, config-tests]
checks:
  optional: []
  commands:
    - id: table-tests
      why: a remaining table branch, the batch update or the retry is missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^table_ops::/)'
    - id: cache-tests
      why: the config param cache or the user row cache is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^config_param_cache::/)'
    - id: config-tests
      why: LITELLM_CONFIG_PARAM_CACHE_TTL_SECONDS is not read or has the wrong default
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::config_param_cache::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The combined_view read and the deprecated key lookup: B2320. Token storage: B722. Budget reset reads: B3011 and B3012. Key and user insert and update, hash_token, jsonify_object and on_backoff: B2362."
  - "PrismaClient.get_request_status: B1743. Health check rows: B7640 and B3193."
  - "The routes that call these operations keep their owners; HTTP oracle cases come with them."
pitfalls:
  - 'The key find_all read hashes list entries only when they start with sk-, orders by spend descending, and answers HTTP 401 "Authentication Error: invalid user key - token does not exist" when the result is None.'
  - The unfiltered user find_all without expires is raw SQL that joins key aliases with json_agg, ordered by spend descending with LIMIT $1 OFFSET $2.
  - update_many writes every row in one batch and commits once, so a failure loses the whole batch, not one row.
  - get_generic_data has only one try within 2 seconds, unlike the 3 tries of the other operations.
  - The config cache stores a miss marker, so a missing row is not looked up again until the TTL passes.
  - invalidate_config_param must publish after the local eviction, so other pods evict too.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
