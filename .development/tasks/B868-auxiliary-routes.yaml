id: B868
title: Public and auxiliary route permission tables
description: >-
  Define typed permission-route constants for openai_route_names, mapped_pass_through_routes, passthrough_routes_wildcard,
  litellm_native_routes, mcp_inference_routes, mcp_routes, agent_inference_routes, agent_routes, google_routes,
  apply_guardrail_routes, model_info_routes, info_routes, public_routes, ui_routes, compliance_check_routes,
  self_managed_routes. Preserve every pinned literal, alias, template and enum expansion; these are policy
  data, not HTTP route registrations. Serve the named groups to route matching and role policy without
  importing endpoint modules. B207 still owns call-type mapping; B124 no longer owns these table entries.
  No URL is fetched and no caller string can create a new enum group.


  Build the production auxiliary_routes module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/_types.py:
  LiteLLMRoutes.openai_route_names (L329-L338; 10 source lines), LiteLLMRoutes.mapped_pass_through_routes
  (L492-L521; 30 source lines), LiteLLMRoutes.passthrough_routes_wildcard (L527-L527; 1 source lines),
  LiteLLMRoutes.litellm_native_routes (L529-L549; 21 source lines), LiteLLMRoutes.mcp_inference_routes
  (L564-L580; 17 source lines), LiteLLMRoutes.mcp_routes (L591-L591; 1 source lines), LiteLLMRoutes.agent_inference_routes
  (L594-L601; 8 source lines), LiteLLMRoutes.agent_routes (L616-L616; 1 source lines), LiteLLMRoutes.google_routes
  (L618-L636; 17 source lines), LiteLLMRoutes.apply_guardrail_routes (L638-L640; 3 source lines), LiteLLMRoutes.model_info_routes
  (L642-L646; 5 source lines), LiteLLMRoutes.info_routes (L660-L685; 26 source lines), LiteLLMRoutes.public_routes
  (L823-L844; 22 source lines), LiteLLMRoutes.ui_routes (L849-L871; 23 source lines), LiteLLMRoutes.compliance_check_routes
  (L875-L878; 4 source lines), LiteLLMRoutes.self_managed_routes (L931-L1019; 67 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): public_routes=[].


  Add the auxiliary_routes operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auxiliary-routes-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::auxiliary_routes::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 256 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  256 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 543 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
