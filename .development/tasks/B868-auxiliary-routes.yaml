id: B868
title: Public and auxiliary route permission tables
description: >-
  Implement the lower-level auxiliary permission tables in betterlite-auth. They supply data to B866
  and B867 without loading settings or invoking auth/endpoint services. Own mcp_management_routes and
  agent_management_routes here as well: their local unions and self_managed_routes need those literals.
  Keep list/tuple ordering and duplicates, while public_routes retains set membership semantics.

  openai_route_names contains chat_completion, completion, embeddings, image_generation,
  video_generation, audio_transcriptions, moderations, model_list. mapped_pass_through_routes has
  slash-prefixed bedrock, comprehendmedical, azure_speech, transcribe, vertex-ai, vertex_ai, cohere,
  cursor, gemini, anthropic, langfuse, azure, azure_ai, openai, openai_passthrough, assemblyai,
  eu.assemblyai, tinyfish, vllm, mistral, typesafe, openrouter, milvus, gigachat, watsonx, nvidia_nim,
  deepgram, fal_ai in that order; passthrough_routes_wildcard appends /* to each, without fetching URLs.

  litellm_native_routes begins /rag/ingest, /v1/rag/ingest, /rag/query, /v1/rag/query. Continue
  /lens, /lens/{lens_id}, /lens/{lens_id}/runs, /lens/{lens_id}/runs/{job_id},
  /lens/{lens_id}/executions/{execution_id}, /lens/{lens_id}/cancel,
  /lens/{lens_id}/findings/{finding_id}, /lens/preview/sample, /lens/workers/register,
  /lens/workers/{worker_id}; /v1/traces, /v1/traces/query, /v1/traces/query/help,
  /v1/traces/{trace_id}, /v1/traces/{trace_id}/spans/{span_id}.

  mcp_inference_routes is /mcp, /mcp/, /mcp/sse/, /mcp/sse/messages, /mcp/sse/messages/,
  /mcp/proxy, /mcp/{subpath}, /mcp/tools, /mcp/tools/list, /mcp/tools/call, /mcp-rest/tools/list,
  /mcp-rest/tools/call, /v1/mcp/tools, /introspect, /token. Its management peer is /v1/mcp/server,
  /v1/mcp/server/{path:path}, /v1/mcp/sessions; mcp_routes concatenates inference then management.
  agent_inference_routes is the tuple /agents, /a2a/{agent_id}, /a2a/{agent_id}/message/send,
  /v1/a2a/{agent_id}/message/send, /a2a/{agent_id}/message/stream,
  /a2a/{agent_id}/.well-known/agent-card.json. The management tuple is /v1/agents,
  /v1/agents/{agent_id}, /v1/agents/make_public, /v1/agents/{agent_id}/make_public,
  /v1/agents/{agent_id}/kill_switch; agent_routes concatenates both tuples.

  google_routes first has /v1beta/models/{model_name:path} with :countTokens, :generateContent,
  :streamGenerateContent, then /models/{model_name:path} with the same suffixes. Follow with
  unversioned then /v1beta pairs for /interactions, /interactions/{interaction_id} and
  /interactions/{interaction_id}/cancel; then /v1beta/agents, /v1beta/agents/{name},
  /v1beta/agents/{name}/versions. apply_guardrail_routes contains only /guardrails/apply_guardrail;
  model_info_routes contains /model/info, /v1/model/info, /model_group/info, without /v2/model/info.

  info_routes contains /key/info, /key/health, /team/info, /team/list, /v2/team/list,
  /organization/list, /team/available, /team/metadata_schema, /user/info, /v2/user/info,
  /model/info, /v1/model/info, /v2/model/info, /v2/key/info, /model_group/info, /health,
  /health/services, /key/list, /user/filter/ui, /models, /v1/models, /sso/get/ui_settings,
  /get/user_banner, /get/latest_release_info. The constant public_routes set contains /routes, /,
  /health/liveliness, /health/liveness, /test, /config/yaml, /litellm/.well-known/litellm-ui-config,
  /.well-known/litellm-ui-config, /public/model_hub, /public/v1/model_hub,
  /public/v1/model_hub/providers, /public/v1/model_hub/modes, /public/v1/model_hub/features,
  /public/model_hub/info, /public/agent_hub, /public/mcp_hub, /public/skill_hub,
  /public/litellm_model_cost_map. It is not a public_routes=[] config read.

  ui_routes starts /sso, /sso/get/ui_settings, /get/ui_settings, /login, /key/info, /config,
  /spend, /model/info, /v2/model/info, /v2/key/info, /models, /v1/models, /global/spend,
  /global/spend/logs, /global/spend/keys, /global/spend/models, /global/spend/tags,
  /global/predict/spend/logs, /global/activity, /gateway/daily/activity, /health/services,
  then appends info_routes with duplicates. This legacy JWT group does not bypass UI-token RBAC.
  compliance_check_routes contains /compliance/eu-ai-act and /compliance/gdpr.

  self_managed_routes starts /team/update, /team/member_add, /team/member_delete,
  /management/v1/teams/{team_id}/members/bulk_delete, the same prefix with /bulk_update,
  /team/member_update, /team/{team_id}/member/{user_id}/reset_spend and /reset_budget,
  /team/permissions_list, /team/permissions_update. Then /team/daily/activity with suffixes '',
  /aggregated, /aggregated/keys, /aggregated/search, /aggregated/model_top_keys, /export;
  /team/spend/by_user, /team/{team_id}/members/me, /team/{team_id:path}/callback,
  /team/{team_id:path}/callback/{callback_name}, /model/new, /model/update, /model/delete.
  Continue the six daily-family literals under /user and /user/daily/activity/aggregated/cache_leakage_keys,
  then the six under /organization; /user/available_roles, /claude_code_gateway/managed/settings,
  /claude_code_gateway/v1/metrics, /claude_code_gateway/v1/logs, /claude_code_gateway/v1/traces,
  /user/list, /management/v1/users/bulk_delete, /user/password/change, /session/logout,
  /model/{model_id}/update, /prompt/list, /prompt/info, /vector_store/info, /project/list,
  /project/info, /project/new, /project/update, /health/test_connection, /invitation/new,
  /invitation/delete, /guardrails/register, /guardrails/submissions,
  /guardrails/submissions/{guardrail_id}, /auto_router/test_routing,
  /auto_router/validate_complexity_router_config, /auto_router/availability, /auto_router/session,
  /cost/predict-cache, followed by all five agent management literals. These paths defer permission
  checks to their handlers; membership does not make them public.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/_types.py:
  LiteLLMRoutes.openai_route_names (L329-L338; 10 source lines), LiteLLMRoutes.mapped_pass_through_routes
  (L492-L521; 30 source lines), LiteLLMRoutes.passthrough_routes_wildcard (L527-L527; 1 source lines),
  LiteLLMRoutes.litellm_native_routes (L529-L549; 21 source lines), LiteLLMRoutes.mcp_inference_routes
  (L564-L580; 17 source lines), LiteLLMRoutes.mcp_management_routes (L583-L587; 5 source lines),
  LiteLLMRoutes.mcp_routes (L591-L591; 1 source lines), LiteLLMRoutes.agent_inference_routes
  (L594-L601; 8 source lines), LiteLLMRoutes.agent_management_routes (L606-L612; 7 source lines),
  LiteLLMRoutes.agent_routes (L616-L616; 1 source lines), LiteLLMRoutes.google_routes
  (L618-L636; 17 source lines), LiteLLMRoutes.apply_guardrail_routes (L638-L640; 3 source lines), LiteLLMRoutes.model_info_routes
  (L642-L646; 5 source lines), LiteLLMRoutes.info_routes (L660-L685; 26 source lines), LiteLLMRoutes.public_routes
  (L823-L844; 22 source lines), LiteLLMRoutes.ui_routes (L849-L871; 23 source lines), LiteLLMRoutes.compliance_check_routes
  (L875-L878; 4 source lines), LiteLLMRoutes.self_managed_routes (L931-L1019; 67 source lines).


  The auxiliary_routes helper under Management::auth reads original enum values in Python and
  production tables in Rust. Cases compare complete arrays per group and sorted membership solely for
  the frozenset. Add per_literal named rstest rows, wildcard_suffix, legacy_union_order,
  ui_duplicates_retained, model_info_excludes_v2, and self_managed_is_not_public. The existing B171
  helper decoder accepts the operation; replay its auxiliary-routes seeds without adding a parser.

  The owned declarations total 268 nonblank noncomment lines. Allow 270 production, 230 table tests,
  80 adapters and 30 wiring lines, 610 within 650, split into submodules below 300 lines.
scope:
  paths:
    - crates/betterlite-auth/src/auxiliary_routes.rs
    - crates/betterlite-auth/src/auxiliary_routes/**
    - crates/betterlite-auth/Cargo.toml
    - tools/oracle/src/helpers/auth/auxiliary_routes.rs
    - tools/oracle/src/helpers/auth/auxiliary_routes/**
    - tools/oracle/helpers/auxiliary_routes.py
    - tools/oracle/helpers/auxiliary_routes/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/auxiliary-routes/**
    - tools/oracle/fuzz/corpus/helper_case/auxiliary-routes-*
  lint_tables: false
