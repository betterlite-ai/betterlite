pitfalls:
  - 'The oracle helper for this task is pre-registered as auxiliary_routes in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/auxiliary_routes.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/auxiliary_routes.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - /mcp/sse/messages and /mcp/sse/messages/ are separate literals; normalizing slashes changes matching.
  - public_routes is a frozenset, so an ordered oracle assertion would depend on Python hash randomization.
  - self_managed_routes includes writes whose handlers still authorize the caller; it is not a public-route expansion.
budget:
  max_changed_lines: 650
  max_new_expects: 0
review_level: security
