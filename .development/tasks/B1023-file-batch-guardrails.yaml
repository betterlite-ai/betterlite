checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_guardrails::/)
      - test(/::replays_corpus$/)'
  - id: case-batch-url-call-type
    why: the batch-url-call-type behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_guardrails::tests::batch_url_call_type($|::)/)'
  - id: case-batch-body-call-type
    why: the batch-body-call-type behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_guardrails::tests::batch_body_call_type($|::)/)'
  - id: case-unsupported-row-operation
    why: the unsupported-row-operation behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_guardrails::tests::unsupported_row_operation($|::)/)'
  - id: case-guardrail-row-block
    why: the guardrail-row-block behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_guardrails::tests::guardrail_row_block($|::)/)'
  - id: case-row-metadata-fingerprint
    why: the row-metadata-fingerprint behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_guardrails::tests::row_metadata_fingerprint($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/file_batch_guardrails)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/file_batch_guardrails.rs && grep -qF "decode_file_batch_guardrails"
      crates/betterlite-core/fuzz/fuzz_targets/file_batch_guardrails.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::file_batch_guardrails::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_batch_guardrails.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_batch_guardrails-*)"
      && grep -qE "^[[:space:]]+file_batch_guardrails:" tools/oracle/fuzz/corpus/helper_case/file_batch_guardrails-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-batch-guardrails)"
