- tools/oracle/cases/helpers/file-batch-guardrails/batch-route-selection.yaml
- tools/oracle/cases/helpers/file-batch-guardrails/scan-metadata-allowlist.yaml
- tools/oracle/cases/helpers/file-batch-guardrails/custom-id-rendering.yaml
- tools/oracle/cases/helpers/file-batch-guardrails/content-fingerprint.yaml
- tools/oracle/cases/helpers/file-batch-guardrails/content-block-classification.yaml
- tools/oracle/cases/helpers/file-batch-guardrails/scan-report-projection.yaml
- tools/oracle/cases/helpers/file-batch-guardrails/public-scan-failures.yaml
deviations: []
out_of_scope:
- B1022 owns the preceding upload validation and its JSON acceptance; B1023 consumes its validated byte stream and does not duplicate validation errors.
- B1024 owns _scan_window, _spool, _worst, scan_batch_input_file, _read_spooled and rewrite_batch_input_file as whole functions, including their use of _SCAN_WINDOW and _REWRITE_SPOOL_BYTES.
- B124 owns ProxyLogging.pre_call_hook and its full dispatcher; this task calls only the injected guardrails-only port with the exact keyword contract above.
- B104 owns is_guardrail_intervention and the GuardrailRaisedException, BlockedPiiEntityError, SensitiveDataRouteException and ModifyResponseException definitions.
- B207 owns get_call_types_for_route and its exact/dynamic path matcher; B732 owns UserAPIKeyAuth and authenticated principal resolution.
- B1032 owns HTTP file-upload route wiring and the outer error envelope; this task owns only the HTTPException status 400 and detail.error values raised by batch_guardrails.py.
pitfalls:
- A row's body guardrails=[] must be removed before the hook and the trusted guardrails=["g"] must be placed in fresh metadata bags, or a caller can opt out of the selected chain.
- json.dumps on the changed row must happen only after injected keys are restored, while the hook's replacement metadata and guardrails bookkeeping must not leak upstream.
- _call_type_from_url treats /responses/r_1/input_items and image routes as known but non-scannable, so the implementation must still apply the body-key fallback instead of rejecting the row.
- A 403 HTTPException with an explicit __cause__ is a technical guardrail failure and must be re-raised, whereas an uncased 403 is an intentional drop.
- _describe sanitizes only newline, NUL and DEL/control characters for logs; the report retains the original custom_id, so truncating the stored identifier would break reconciliation.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 1
