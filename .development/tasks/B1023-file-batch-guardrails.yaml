id: B1023
title: File batch guardrails
description: >-
  Build typed batch guardrail scan records, source call-type resolution, custom_id fingerprints and per-row metadata
  using B104 and B207. Preserve the original row's endpoint/model authorization context and return rejection/report
  outcomes without publishing partially scanned input.


  Implement crates/betterlite-core/src/api/file_batch_guardrails.rs. Use FileBatchGuardrailsInput and FileBatchGuardrailsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): batch_guardrails.py:190 status_code=400, exception_detail=FastAPI detail object. Compare
  the actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions batch_url_call_type, batch_body_call_type, unsupported_row_operation,
  guardrail_row_block, row_metadata_fingerprint under api::file_batch_guardrails::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::file_batch_guardrails::decode_file_batch_guardrails(bytes:
  &[u8], limits: &ApiLimits), for json.loads input raw_line at litellm/proxy/openai_files_endpoints/batch_guardrails.py:280.
  Place its implementation in crates/betterlite-core/src/api/file_batch_guardrails.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/file_batch_guardrails.rs passes arbitrary
  bounded bytes to that exact decoder; api::file_batch_guardrails::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::FileBatchGuardrails in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_batch_guardrails: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/openai_files_endpoints/batch_guardrails.py: BatchScanResult.submitted_records
  (L155-L156); litellm/proxy/openai_files_endpoints/batch_guardrails.py: BatchScanResult.summary (L158-L166); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  BatchScanResult.report (L168-L180); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _rejected (L189-L190);
  litellm/proxy/openai_files_endpoints/batch_guardrails.py: raise_public (L193-L213); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  raise_nothing_to_submit (L216-L220); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _is_content_block
  (L223-L243); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _naming_guardrail (L246-L253); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  _describe (L256-L260); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _iter_lines (L263-L274); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  _iter_records (L277-L280); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _call_type_from_url (L283-L302);
  litellm/proxy/openai_files_endpoints/batch_guardrails.py: _call_type_from_body (L305-L307); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  _scannable_call_type (L310-L319); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _custom_id_of (L322-L334);
  litellm/proxy/openai_files_endpoints/batch_guardrails.py: _fingerprint (L337-L348); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  build_scan_metadata (L351-L358); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _scan_record (L361-L425).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 160 owned nonblank/non-comment/non-docstring Python lines (212 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 180 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 490 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B104 (Guardrail framework, registry and guardrail API), B171 (Direct helper oracle and
  URL path encoding), B207 (Route and call-type metadata matching), B1022 (File upload validation), B1087 (Api boundaries).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
