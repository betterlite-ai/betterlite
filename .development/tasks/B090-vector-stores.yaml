id: B090
title: Attach retrieval results and failures to model responses
description: >-
  Implement VectorStorePreCallHook's two post-call methods in core::api::vector_stores and register them
  with B012's existing deployment-hook pipeline. They consume already collected search_results and
  vector_store_search_failures; they do not call search or register vector-store routes. The success hook
  reads a logging object from request_data and its model_call_details. The streaming hook instead reads
  the two fields directly from request_data. Preserve that distinction in typed entry points.

  For chat responses attach nonempty fields under each choice.message.provider_specific_fields, retaining
  unrelated provider fields. ResponsesAPIResponse gets only top-level vector_store_search_failures, as a
  list, and never search_results. Streaming choices use delta.provider_specific_fields. Empty/missing
  choices or message/delta objects are skipped. Wrap decoration failures with diagnostics and preserve
  the source return conventions below. These are transformations over decoded records, so HelperCall::VectorStores
  may compare them directly; no provider-I/O helper or new decoder is needed.

  The two methods at 415-512 contain 74 nonblank/non-comment lines. Budget 100 implementation, 125 tests,
  85 adapters, 65 fixtures and 25 wiring/corpus, 400 total. Native tests use api::vector_stores::tests.
  The __init__.py files are export manifests only; their owning API parts expose those operations and
  Python facade tasks mirror the public names without this task registering routes a second time.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_stores.rs
  - crates/betterlite-core/src/api/vector_stores/**
  - crates/betterlite-core/src/dispatch.rs
  - crates/betterlite-core/src/dispatch/**
  - tools/oracle/src/helpers/core_ops/vector_stores.rs
  - tools/oracle/src/helpers/core_ops/vector_stores/**
  - tools/oracle/helpers/vector_stores.py
  - tools/oracle/helpers/vector_stores/**
  - tools/oracle/cases/helpers/vector-stores/**
  - tools/oracle/fuzz/corpus/helper_case/vector_stores-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py#L415-L512
  why: The two complete post-call hooks use different metadata sources and have different failure/empty return values.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/__init__.py#L1-L4
  why: Store exports are VectorStoreRegistry,acreate,asearch,create,search; this manifest contains no extra route implementation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_store_files/__init__.py#L1-L29
  why: File exports expose six sync/async operation pairs already owned by B1072-B1074.
dod:
- text: >-
    chat_retrieval_fields supplies logging details search_results=[{search_query:q,data:[]}],
    vector_store_search_failures=[{vector_store_id:vs_a,custom_llm_provider:openai,error:failed}], and two
    chat choices with provider_specific_fields={keep:x,search_results:old}. Each nonempty message keeps
    keep=x and replaces search_results plus vector_store_search_failures with the supplied sequences.
    Empty failure/results inputs do not erase existing fields. Return the modified response; no search executes.
  proof: [post-tests, oracle, helper-python]
- text: >-
    responses_only_receive_failures gives the same logging details to a ResponsesAPIResponse. Expect
    only top-level vector_store_search_failures=[{vector_store_id:vs_a,custom_llm_provider:openai,error:failed}],
    no added search_results and unchanged output/id. Success-only search results return the Responses
    object unchanged. A response with no choices, choices=[] or a choice without a message is returned unchanged.
  proof: [post-tests, oracle, helper-python]
- text: >-
    successful_hook_noop has no logging object or empty model_call_details. Return null, not the response,
    with debug diagnostic "No litellm_logging_obj in request_data" or "No search results or search failures found".
    A malformed writable provider-fields target causes exception diagnostic "Error adding search results to response: %s"
    and null; it does not fail the completed model request or roll back already modified earlier choices.
  proof: [post-tests, oracle, helper-python]
- text: >-
    streaming_retrieval_fields passes the two fields directly in request_data and a chunk with two deltas.
    Attach both nonempty fields to each nonempty delta.provider_specific_fields while preserving keep=x.
    A logging object alone does not provide streaming metadata. Absent/empty fields return the identical
    chunk with debug "No search results or search failures found for streaming chunk"; no choice or delta
    is created. A mutation failure emits "Error adding search results to streaming chunk: %s" and returns
    the original chunk, including any earlier mutation. Neither hook performs a second retrieval.
  proof: [post-tests, oracle, helper-python]
- text: New vector_stores seeds cover both post-call transformations in the shared helper-case replay.
  proof: [helper-corpus]
checks:
  optional: []
  commands:
  - id: post-tests
    why: response decoration uses the wrong metadata source, return value or response field
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_stores::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: post-hook parity is absent or invokes fabricated expected output
    run: test -f tools/oracle/helpers/vector_stores.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the added post-hook variants have no shared-decoder seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_stores-*)" && grep -qE '^[[:space:]]+vector_stores:' tools/oracle/fuzz/corpus/helper_case/vector_stores-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vector-stores/chat-retrieval-fields.yaml
- tools/oracle/cases/helpers/vector-stores/responses-only-receive-failures.yaml
- tools/oracle/cases/helpers/vector-stores/successful-hook-noop.yaml
- tools/oracle/cases/helpers/vector-stores/streaming-retrieval-fields.yaml
deviations: []
out_of_scope:
- B1077 owns pre-call execution and B2483 owns its seven pure shaping/policy helpers; lines 520-521 are blank and claim no callable.
- B1062/B1064 own VectorStoreRegistry/create/search exports; B1072-B1074 own every vector_store_files operation. The proxy vector_store_files_endpoints __init__.py is empty.
- Gateway routes remain B1067/B1068/B1076/B1081; B158-B161 own Python package exports, so this task adds no route registration.
pitfalls:
- 'The oracle helper for this task is pre-registered as vector_stores in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/vector_stores.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vector_stores.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The successful Responses hook advertises failed retrievals only; adding successful search_results would change its wire format.
- Streaming reads request_data directly, while non-streaming reads the logging object's model_call_details.
- A post-hook failure returns null for success but the original chunk for streaming, without atomic rollback.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
