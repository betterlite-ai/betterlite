pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_rejected_fields in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/rejected_fields.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_rejected_fields.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The tools[3].field index only detects a tool error; removal applies the field to all tools.
- Only the first bracket pair is parsed for extra parameters, even if later brackets contain a more plausible list.
