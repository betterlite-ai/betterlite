id: B551
title: Foundry bounded 422 request repair
description: >-
  Implement FoundryRepair and connect it to B010 TransformRetry in betterlite-provider/src/transform_retry.rs; the
  leaf returns a repair decision and never imports betterlite-provider. Match bounded error text for extra top-level
  fields, tool-level fields, invalid tool-call index and pass-through hints, then run at most two provider-local
  transform retries. Do not increment or replace router retries. Use parsed field names only to remove existing
  body fields; never alter auth, base URL or deadline.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/chat/transformation.py:
  AzureAIStudioConfig.should_retry_llm_api_inside_llm_translation_on_http_error L327-L340; AzureAIStudioConfig._error_has_tool_level_extra_fields
  L342-L343; AzureAIStudioConfig.max_retry_on_unprocessable_entity_error L346-L347; AzureAIStudioConfig.transform_request_on_unprocessable_entity_error
  L349-L361; AzureAIStudioConfig._drop_tool_level_extra_fields L363-L371; AzureAIStudioConfig._drop_extra_params_from_request_data
  L373-L379; AzureAIStudioConfig._extract_params_to_drop_from_error_text L381-L398.


  Reuse drop_params_from_unprocessable_entity_error from B505 (litellm/llms/openai/common_utils.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-foundry/src/rejected_fields.rs with adjacent tests under rejected_fields/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation foundry_rejected_fields in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function rejected_fields_cases in betterlite-foundry with these exact named cases (one per oracle
  file): drop_top_level_loc, drop_tool_level_extra_fields, remove_tool_call_index, extra_parameters_list, repair_without_drop_policy_for_tools,
  unrelated_error_no_retry, two_repairs_only. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and captured
  upstream request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields* using HelperCase: kind:
  helper and the externally tagged foundry_rejected_fields variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_rejected_fields that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 61 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 95 production lines, 108 behavior/config-test lines, 83 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 311 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-foundry/Cargo.toml
  - crates/betterlite-foundry/src/lib.rs
  - crates/betterlite-foundry/src/error.rs
  - crates/betterlite-foundry/src/rejected_fields.rs
  - crates/betterlite-foundry/src/rejected_fields/**
  - crates/betterlite-provider/src/transform_retry.rs
  - crates/betterlite-provider/src/provider.rs
  - crates/betterlite-provider/src/error.rs
  - crates/betterlite-provider/Cargo.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/foundry_rejected_fields.rs
  - tools/oracle/src/helpers/foundry_rejected_fields/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/foundry_rejected_fields.py
  - tools/oracle/cases/helpers/providers/foundry-rejected-fields/**
  - tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields*
  lint_tables: false
