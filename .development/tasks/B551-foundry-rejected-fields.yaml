- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/chat/transformation.py#L327-L398
  why: >-
    Own AzureAIStudioConfig.should_retry_llm_api_inside_llm_translation_on_http_error, AzureAIStudioConfig._error_has_tool_level_extra_fields,
    AzureAIStudioConfig.max_retry_on_unprocessable_entity_error, AzureAIStudioConfig.transform_request_on_unprocessable_entity_error,
    AzureAIStudioConfig._drop_tool_level_extra_fields, AzureAIStudioConfig._drop_extra_params_from_request_data,
    AzureAIStudioConfig._extract_params_to_drop_from_error_text. Other functions in this file remain with the owners
    listed below.
