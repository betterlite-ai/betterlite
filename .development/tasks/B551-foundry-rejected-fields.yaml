id: B551
title: Foundry bounded 422 request repair
description: >-
  Implement FoundryRepair and connect it to B010 TransformRetry in betterlite-provider/src/transform_retry.rs; the
  leaf returns a repair decision and never imports betterlite-provider. Match bounded error text for extra top-level
  fields, tool-level fields, invalid tool-call index and pass-through hints, then run at most two provider-local
  transform retries. Do not increment or replace router retries. Use parsed field names only to remove existing
  body fields; never alter auth, base URL or deadline.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/chat/transformation.py:
  AzureAIStudioConfig.should_retry_llm_api_inside_llm_translation_on_http_error L327-L340; AzureAIStudioConfig._error_has_tool_level_extra_fields
  L342-L343; AzureAIStudioConfig.max_retry_on_unprocessable_entity_error L346-L347; AzureAIStudioConfig.transform_request_on_unprocessable_entity_error
  L349-L361; AzureAIStudioConfig._drop_tool_level_extra_fields L363-L371; AzureAIStudioConfig._drop_extra_params_from_request_data
  L373-L379; AzureAIStudioConfig._extract_params_to_drop_from_error_text L381-L398.


  Reuse drop_params_from_unprocessable_entity_error from B505 (litellm/llms/openai/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: drop_tool_level_extra_fields: Extract every tools[digits].([word-or-hyphen]+) field and
  remove it from every dictionary in the tools list, not just the indexed tool; non-dict entries are untouched.
  This repair runs even with drop_params false. remove_tool_call_index: If invalid-index text and messages is not
  None call B219 remove_index_from_tool_calls; this excludes the pass-through-hint elif even if both markers occur.
  Tool-field removal can still run afterward, then always call B505 drop_params_from_unprocessable_entity_error.
  extra_parameters_list: Take the first non-greedy bracketed substring anywhere, split commas, trim whitespace then
  single then double quotes, ignore empty names and remove only matching top-level keys. No bracket yields []; do
  not parse it as JSON or Python syntax. repair_trigger_literals: Retry when error text contains Extra inputs are
  not permitted and either truthy per-call/global drop_params or tools[digits]. appears; always retry on unknown
  field: parameter index is not a valid field or Set extra-parameters to 'pass-through'. Otherwise use B505 superclass
  retry policy; max local retries=2.


  Implement crates/betterlite-foundry/src/rejected_fields.rs with adjacent tests under rejected_fields/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function rejected_fields_cases in betterlite-foundry with these exact named cases (one per oracle
  file): drop_top_level_loc, drop_tool_level_extra_fields, remove_tool_call_index, extra_parameters_list, repair_without_drop_policy_for_tools,
  unrelated_error_no_retry, two_repairs_only, repair_trigger_literals. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields* using HelperCase: kind:
  helper and the externally tagged foundry_rejected_fields variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_rejected_fields that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 61 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 95 production lines, 165 behavior/config-test lines, 95 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 435 planned, 450 maximum changed lines.
scope:
  paths:
  - crates/betterlite-foundry/Cargo.toml
  - crates/betterlite-foundry/src/rejected_fields.rs
  - crates/betterlite-foundry/src/rejected_fields/**
  - crates/betterlite-provider/src/transform_retry.rs
  - crates/betterlite-provider/src/provider.rs
  - crates/betterlite-provider/Cargo.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/foundry/rejected_fields.rs
  - tools/oracle/src/helpers/foundry/rejected_fields/**
  - tools/oracle/helpers/foundry_rejected_fields.py
  - tools/oracle/helpers/foundry_rejected_fields/**
  - tools/oracle/cases/helpers/providers/foundry-rejected-fields/**
  - tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/chat/transformation.py#L327-L398
  why: Own AzureAIStudioConfig.should_retry_llm_api_inside_llm_translation_on_http_error, AzureAIStudioConfig._error_has_tool_level_extra_fields,
    AzureAIStudioConfig.max_retry_on_unprocessable_entity_error, AzureAIStudioConfig.transform_request_on_unprocessable_entity_error,
    AzureAIStudioConfig._drop_tool_level_extra_fields, AzureAIStudioConfig._drop_extra_params_from_request_data,
    AzureAIStudioConfig._extract_params_to_drop_from_error_text. Other functions in this file remain with the owners
    listed below.
dod:
- text: 'drop top level loc: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/drop-top-level-loc.yaml.'
  proof:
  - case-drop-top-level-loc
  - oracle
  - helper-python
- text: 'drop_tool_level_extra_fields: Extract every tools[digits].([word-or-hyphen]+) field and remove it from
    every dictionary in the tools list, not just the indexed tool; non-dict entries are untouched. This repair runs
    even with drop_params false.'
  proof:
  - case-drop-tool-level-extra-fields
  - oracle
  - helper-python
- text: 'remove_tool_call_index: If invalid-index text and messages is not None call B219 remove_index_from_tool_calls;
    this excludes the pass-through-hint elif even if both markers occur. Tool-field removal can still run afterward,
    then always call B505 drop_params_from_unprocessable_entity_error.'
  proof:
  - case-remove-tool-call-index
  - oracle
  - helper-python
- text: 'extra_parameters_list: Take the first non-greedy bracketed substring anywhere, split commas, trim whitespace
    then single then double quotes, ignore empty names and remove only matching top-level keys. No bracket yields
    []; do not parse it as JSON or Python syntax.'
  proof:
  - case-extra-parameters-list
  - oracle
  - helper-python
- text: 'repair without drop policy for tools: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/repair-without-drop-policy-for-tools.yaml.'
  proof:
  - case-repair-without-drop-policy-for-tools
  - oracle
  - helper-python
- text: 'unrelated error no retry: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/unrelated-error-no-retry.yaml.'
  proof:
  - case-unrelated-error-no-retry
  - oracle
  - helper-python
- text: 'two repairs only: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/two-repairs-only.yaml.'
  proof:
  - case-two-repairs-only
  - oracle
  - helper-python
- text: New foundry_rejected_fields seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: 'repair_trigger_literals: Retry when error text contains Extra inputs are not permitted and either truthy
    per-call/global drop_params or tools[digits]. appears; always retry on unknown field: parameter index is not
    a valid field or Set extra-parameters to ''pass-through''. Otherwise use B505 superclass retry policy; max local
    retries=2.'
  proof:
  - case-repair-trigger-literals
  - oracle
  - helper-python
checks:
  optional:
  - mutants
  commands:
  - id: case-drop-top-level-loc
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/drop-top-level-loc.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_drop_top_level_loc$/)'
  - id: case-drop-tool-level-extra-fields
    why: Extract every tools[digits].([word-or-hyphen]+) field and remove it from every dictionary in the tools
      list, not just the indexed tool; non-dict entries are untouched. This repair runs even with drop_params false.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_drop_tool_level_extra_fields$/)'
  - id: case-remove-tool-call-index
    why: If invalid-index text and messages is not None call B219 remove_index_from_tool_calls; this excludes the
      pass-through-hint elif even if both markers occur. Tool-field removal can still run afterward, then always
      call B505 drop_params_from_unprocessable_entity_error.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_remove_tool_call_index$/)'
  - id: case-extra-parameters-list
    why: Take the first non-greedy bracketed substring anywhere, split commas, trim whitespace then single then
      double quotes, ignore empty names and remove only matching top-level keys. No bracket yields []; do not parse
      it as JSON or Python syntax.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_extra_parameters_list$/)'
  - id: case-repair-without-drop-policy-for-tools
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/repair-without-drop-policy-for-tools.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_repair_without_drop_policy_for_tools$/)'
  - id: case-unrelated-error-no-retry
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/unrelated-error-no-retry.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_unrelated_error_no_retry$/)'
  - id: case-two-repairs-only
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/two-repairs-only.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_two_repairs_only$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_rejected_fields.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields*")"
      && grep -lq 'foundry_rejected_fields' tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_rejected_fields$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-repair-trigger-literals
    why: 'Retry when error text contains Extra inputs are not permitted and either truthy per-call/global drop_params
      or tools[digits]. appears; always retry on unknown field: parameter index is not a valid field or Set extra-parameters
      to ''pass-through''. Otherwise use B505 superclass retry policy; max local retries=2.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_repair_trigger_literals$/)'
