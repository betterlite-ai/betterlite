  proof:
  - case-drop-top-level-loc
  - oracle
  - helper-python
- text: >-
    drop tool level extra fields: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/drop-tool-level-extra-fields.yaml.
  proof:
  - case-drop-tool-level-extra-fields
  - oracle
  - helper-python
- text: >-
    remove tool call index: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/remove-tool-call-index.yaml.
  proof:
  - case-remove-tool-call-index
  - oracle
  - helper-python
- text: >-
    extra parameters list: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/extra-parameters-list.yaml.
  proof:
  - case-extra-parameters-list
  - oracle
  - helper-python
- text: >-
    repair without drop policy for tools: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/repair-without-drop-policy-for-tools.yaml.
  proof:
  - case-repair-without-drop-policy-for-tools
  - oracle
  - helper-python
- text: >-
    unrelated error no retry: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/unrelated-error-no-retry.yaml.
  proof:
