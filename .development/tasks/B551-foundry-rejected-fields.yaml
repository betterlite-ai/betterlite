  - oracle
  - helper-python
- text: 'two repairs only: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rejected-fields/two-repairs-only.yaml.'
  proof:
  - case-two-repairs-only
  - oracle
  - helper-python
- text: New foundry_rejected_fields seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-drop-top-level-loc
    why: The drop-top-level-loc behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_drop_top_level_loc$/)'
  - id: case-drop-tool-level-extra-fields
    why: The drop-tool-level-extra-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_drop_tool_level_extra_fields$/)'
  - id: case-remove-tool-call-index
    why: The remove-tool-call-index behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_remove_tool_call_index$/)'
  - id: case-extra-parameters-list
    why: The extra-parameters-list behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_extra_parameters_list$/)'
  - id: case-repair-without-drop-policy-for-tools
    why: The repair-without-drop-policy-for-tools behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_repair_without_drop_policy_for_tools$/)'
  - id: case-unrelated-error-no-retry
    why: The unrelated-error-no-retry behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_unrelated_error_no_retry$/)'
  - id: case-two-repairs-only
    why: The two-repairs-only behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rejected_fields_cases::case_[0-9]+_two_repairs_only$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_rejected_fields.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields*")"
      && grep -lq 'foundry_rejected_fields' tools/oracle/fuzz/corpus/helper_case/foundry_rejected_fields* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_rejected_fields$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
