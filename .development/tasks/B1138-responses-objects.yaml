id: B1138
title: Responses objects and usage
description: >-
  Define ResponsesAPIUsage, ResponsesAPIResponse and input/output response records below event/provider contracts.
  Wire decoding belongs here and does not depend on any executor.


  Implement crates/betterlite-openai/src/api/responses_objects.rs. Use ResponsesObjectsInput and ResponsesObjectsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions response_object_usage, response_object_status under api::responses_objects::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-openai::api::responses_objects::decode_responses_objects(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/responses_objects.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-openai/fuzz/fuzz_targets/responses_objects.rs passes arbitrary bounded bytes to that
  exact decoder; api::responses_objects::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesObjects in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_objects: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/types/llms/openai.py: ResponseAPIUsage.parse_cost (L1360-L1364); litellm/types/llms/openai.py:
  ResponsesAPIResponse.validate_reasoning_to_dict (L1428-L1436); litellm/types/llms/openai.py: ResponsesAPIResponse.validate_usage
  (L1440-L1446); litellm/types/llms/openai.py: ResponsesAPIResponse._serialize_output_filter_reasoning_nulls (L1450-L1473);
  litellm/types/llms/openai.py: ResponsesAPIResponse.output_text (L1476-L1506). Abstract/protocol declarations map
  to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 168 owned nonblank/non-comment/non-docstring Python lines (187 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 188 implementation,
  52 behavior tests, 24 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 444 total within the 450-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B171 (Direct helper oracle and URL path
  encoding), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
