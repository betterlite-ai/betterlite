checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_objects::/) -
      test(/::replays_corpus$/)'
  - id: case-response-object-usage
    why: the response-object-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_objects::tests::response_object_usage($|::)/)'
  - id: case-response-object-status
    why: the response-object-status behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_objects::tests::response_object_status($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/responses_objects)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/responses_objects.rs && grep -qF "decode_responses_objects"
      crates/betterlite-openai/fuzz/fuzz_targets/responses_objects.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::responses_objects::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_objects.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_objects-*)"
      && grep -qE "^[[:space:]]+responses_objects:" tools/oracle/fuzz/corpus/helper_case/responses_objects-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-objects)"
