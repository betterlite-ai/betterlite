id: B1138
title: Responses objects and usage
description: >-
  Implement the ResponsesAPIResponse and ResponseAPIUsage records in
  betterlite-openai::api::responses_objects. Own parse_cost, validate_reasoning_to_dict,
  validate_usage, _serialize_output_filter_reasoning_nulls and output_text in full.
  Reuse B902's output records and wire limits and B004's common OpenAI types. All five
  methods are reached by response construction, serialization or SDK property access.

  A response requires id, created_at and output; its other declared fields default null.
  In particular status is an optional string, even though ResponsesAPIStatus enumerates
  completed, failed, in_progress, cancelled, queued and incomplete. Usage requires
  input_tokens,output_tokens,total_tokens; detail records and cost default null.
  InputTokensDetails.cached_tokens defaults 0; audio_tokens,cached_tokens_details,image_tokens,
  text_tokens,video_tokens default null. Output audio_tokens,reasoning_tokens,text_tokens default
  null. Preserve extra provider fields. Store cost as Decimal, including total_cost extracted
  from a mapping. _hidden_params starts empty and never appears in serialized response JSON.

  The optional request declarations retain omission versus explicit null for include,
  instructions,max_output_tokens,metadata,parallel_tool_calls,previous_response_id,reasoning,
  store,background,stream,temperature,text,tool_choice,tools,top_p,truncation,user,service_tier,
  safety_identifier,prompt,max_tool_calls,prompt_cache_key,prompt_cache_retention,prompt_cache_options,
  stream_options,top_logprobs,partial_images,context_management. input and model are required
  by ResponsesAPIRequestParams; these TypedDict declarations do not validate bounds at runtime.
  stream_options.include_obfuscation is optional. B905 owns parameter selection.

  decode_responses_objects(bytes, WireDecodeLimits) is the provider-JSON boundary and fuzz entry.
  The responses_objects helper operation constructs the pinned Pydantic records and returns
  their dump plus output_text, independently of the Rust decoder. Tests live beside the
  production module; replays_corpus is excluded from the behavior filter. Count 187 nonblank,
  non-comment Python lines; budget 210 implementation, 155 tests, 100 oracle inputs, 80 adapters,
  60 fuzz/replay and 25 wiring, totaling 630.
scope:
  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/responses_objects.rs
  - crates/betterlite-openai/src/api/responses_objects/**
  - crates/betterlite-openai/fuzz/Cargo.toml
  - crates/betterlite-openai/fuzz/fuzz_targets/responses_objects.rs
  - crates/betterlite-openai/fuzz/corpus/responses_objects/**
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/openai/responses_objects.rs
  - tools/oracle/src/helpers/openai/responses_objects/**
  - tools/oracle/helpers/responses_objects.py
  - tools/oracle/helpers/responses_objects/**
  - tools/oracle/fuzz/corpus/helper_case/responses_objects-*
  - tools/oracle/cases/helpers/responses-objects/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L1273-L1508
  why: Request declarations, token defaults, cost normalization and response serialization/property behavior owned here.
dod:
- text: >-
    usage_cost supplies tokens 3,2,5 and cost={total_cost:0.125,provider:ignored}; expect
    cost=0.125. Numeric cost=0.25 stays 0.25, cost={} becomes null, absent details become null,
    and input_tokens_details={} gains cached_tokens=0 and the listed null defaults.
    Extra usage/detail key provider_count=7 survives. Omitting total_tokens is a validation error.
  proof: [object-tests, oracle, helper-python]
- text: >-
    response_defaults decodes {id:resp_a,created_at:1,output:[]} into null optional fields,
    empty output_text and no _hidden_params. Missing id,created_at or output each fails.
    status=future_status is accepted; truncation=auto/disabled is accepted and truncation=other
    fails. A reasoning dict with effort=none or xhigh and extra key detail=1 is unchanged;
    a model_dump-capable reasoning object is converted to the same mapping. Null stays null.
  proof: [object-tests, oracle, helper-python]
- text: >-
    reasoning_nulls serializes a reasoning item with status=null,content=null,encrypted_content=null,
    summary=null and id=rs_a; only the first three keys disappear. Non-null values stay and
    identically named null keys on a message item stay. usage supplied as a dict becomes the
    same typed usage as direct construction, including cost normalization.
  proof: [object-tests, oracle, helper-python]
- text: >-
    output_text_join supplies message output_text blocks "a",null,"b", a refusal and a
    non-message output_text block; expect "ab" without separators. Missing text and missing
    content contribute nothing. Exercise both dict and typed output items.
  proof: [object-tests, oracle, helper-python]
- text: >-
    tool_usage_count accepts web_search=null or {num_requests:0} and {num_requests:2}; a
    negative num_requests fails. Request declaration tests retain all named optional keys
    without inventing runtime validation for partial_images or compact_threshold.
  proof: [object-tests, oracle, helper-python]
- text: Malformed response JSON and null/default seeds reach the production decoder in both fuzzing and replay.
  proof: [object-corpus]
checks:
  optional: [mutants]
  commands:
  - id: object-tests
    why: response serialization, text aggregation or cost/default handling differs
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_objects::/) - test(/::replays_corpus$/)'
  - id: object-corpus
    why: no new response-object parser corpus reaches the production decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/responses_objects)" && grep -qF decode_responses_objects crates/betterlite-openai/fuzz/fuzz_targets/responses_objects.rs && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_objects::tests::replays_corpus$/)'
  - id: helper-python
    why: response-object comparisons lack a typed pinned Python adapter
    run: test -f tools/oracle/helpers/responses_objects.py && grep -qE '^[[:space:]]+responses_objects:' tools/oracle/fuzz/corpus/helper_case/responses_objects-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-objects/usage-cost.yaml
- tools/oracle/cases/helpers/responses-objects/response-defaults.yaml
- tools/oracle/cases/helpers/responses-objects/reasoning-nulls.yaml
- tools/oracle/cases/helpers/responses-objects/output-text-join.yaml
- tools/oracle/cases/helpers/responses-objects/tool-usage-count.yaml
deviations: []
out_of_scope:
- B1113 owns the event records and union at openai.py L1509-L1929; B004 owns every other callable in that shared file, including binary/file/video accessors and chat-chunk initialization.
- B902 owns the imported generic output, function, image, interpreter and custom-tool records in types/responses/main.py.
- B905 selects request parameters; no request dispatch or provider HTTP belongs to these record constructors.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_objects in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/responses_objects.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_objects.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- ResponsesAPIResponse.status accepts arbitrary strings; enforcing ResponsesAPIStatus on that field would reject provider extensions.
- Null stripping applies only to reasoning output and exactly status, content and encrypted_content.
- A cost mapping without total_cost yields null, not zero and not the original mapping.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
