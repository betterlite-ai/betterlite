id: B388
title: Adaptive routing configuration and request types
description: 'Implement AdaptiveConfig, AdaptivePreferences and the pinned request-type classifier. Validate
  quality tiers and strengths, header/metadata minimum quality, default weights 0.7/0.3 and one adaptive
  marker per router. Return typed request categories to B339; no sampling or persistence is added. Configuration
  boundary keys introduced or consumed here: adaptive_router_config, quality_tier, strengths. Pinned declaration
  defaults: adaptive_router_config=None; strengths=list. Resolve env values once in betterlite-config,
  never in router code. RequestType variants and preference defaults come from types/router.py RequestType,
  AdaptiveRouterWeights and AdaptiveRouterPreferences; quality_tier is required (1..3), strengths to an
  empty list, and weights quality=0.7/cost=0.3. Statistical arithmetic may use finite f64 only in preference_math
  with one module-level #[expect(clippy::float_arithmetic, reason = "pinned statistical routing arithmetic")],
  counted in max_new_expects. Keep every price/spend/budget Decimal and compare selected model/tier exactly;
  diagnostic score tolerances cannot hide a selection difference. Implement the owned native service in
  crates/betterlite-router/src/adaptive_classification.rs. Add ProbeOperation::B388 in tools/oracle/src/router_probes/mod.rs
  and the corresponding B388 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_strategy/adaptive_router/classifier.py:
  classify_prompt (L123-L139). Implement these behaviors through the typed Rust services above; synchronous
  facades and structural accessors reuse the same primitive instead of separate ports. If floating diagnostics
  differ, a case may use absolute_tolerance=0.000000000001 only on its explicitly named score/probability
  pointer. Selection, tie order, counts, statuses, money and provider requests remain exact. Six-decimal
  wire signals are compared after the source rounding, without widening tolerance.'
