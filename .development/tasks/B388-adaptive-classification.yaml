dod:
- text: Write tests named b388_behaviors and b388_boundaries under adaptive_classification::tests. The
    first asserts the listed successful and warning/fallback outcomes; the second asserts error fields,
    bounds, cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay
    cannot satisfy either check.
  proof:
  - b388-behaviors
  - b388-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/b388-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/b388-invalid.yaml;
    the valid seed contains adaptive_router_config. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - b388-boundaries
- text: Add crates/betterlite-openai/fuzz/corpus/chat_request/b388-valid.json and crates/betterlite-openai/fuzz/corpus/chat_request/b388-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target chat_request and normal replays_the_chat_request_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - chat-corpus
  - b388-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: b388-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::b388_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: b388-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::b388_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/adaptive_classification.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/adaptive_classification.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/b388-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/b388-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/b388-" && grep -Fq 'adaptive_router_config' crates/betterlite-config/fuzz/corpus/config_yaml/b388-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: chat-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-openai/fuzz/corpus/chat_request/b388-valid.json && test -f crates/betterlite-openai/fuzz/corpus/chat_request/b388-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request
      | grep -Fq "/b388-" && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
