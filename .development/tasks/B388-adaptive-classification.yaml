out_of_scope:
- B339 owns final integration and the remaining functions listed in its implementation boundary.
- litellm/router_strategy/adaptive_router/config.py has no functions at the pin; its exports/data are
  accounted for by the owning native module, with no Python wrapper port.
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
