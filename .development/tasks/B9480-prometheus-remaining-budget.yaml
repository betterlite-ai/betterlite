    why: _customer_budget_gauges_are_noop, B3882's half of the gate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/carried_budget_state.py#L17-L64
    why: from_metadata gives None when any key of a snapshot is missing or invalid.
dod:
  - text: The section loads PROMETHEUS_BUDGET_METRICS_PER_REQUEST_TIMEOUT with the 5 second default, falls back for values that are not finite or not above 0, caps huge values at Duration::MAX and refuses text the shared parser refuses.
    proof: [config-tests, oracle, new-cases, helper-python]
  - text: The fan-out skips everything when all four remaining-budget gauges and the customer gauges are no-op, and otherwise runs all five lookups.
    proof: [fan-out-tests, oracle, new-cases, helper-python]
  - text: Each lookup gets the metadata spends, max budgets, string-only email and alias, and the carried snapshot LiteLLM passes it.
    proof: [fan-out-tests, oracle, new-cases, helper-python]
  - text: A run past the timeout returns after one debug line, and a failed lookup logs its entity name without stopping the others or returning an error.
    proof: [fan-out-tests]
  - text: New helper corpus seeds call b9480 and replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: fan-out-tests
      why: the gate, the argument mapping, the timeout or the failure logging differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_remaining_budget::/)'
    - id: config-tests
      why: the timeout variable is not loaded, its default or fallback is wrong, or bad text is accepted
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::prometheus_request_budget::/)'
    - id: new-cases
      why: no new helper case for the fan-out or the timeout exists on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/prometheus-remaining-budget)"
    - id: helper-python
      why: the b9480 adapter must exist and pass ruff and basedpyright
      run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b9480)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b9480 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b9480/pyrightconfig.json
    - id: helper-case-corpus
      why: b9480 needs fresh seeds that replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/prometheus-remaining-budget-*")" && grep -lE '^[[:space:]]+b9480:' tools/oracle/fuzz/corpus/helper_case/prometheus-remaining-budget-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/prometheus-remaining-budget
deviations:
  - what: PROMETHEUS_BUDGET_METRICS_PER_REQUEST_TIMEOUT set to text that is not a decimal number (abc, inf, nan) stops startup with a config error naming the variable. LiteLLM logs at debug and uses 5 seconds.
    why: docs/compatibility.md sends every env number through one shared parser that refuses such text; a value that parses but is not usable still falls back as in LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L191-L207
out_of_scope:
  - "The five per-request lookups and the gauges they set: B3883 and B3882. This task only calls them."
  - "Calling the fan-out from the success hook: B8561, and it needs this task in its depends_on. Building it with the configured timeout when the prometheus logger is made: B8655's prometheus arm."
  - "The periodic budget refresh and PROMETHEUS_BUDGET_METRICS_REFRESH_INTERVAL_MINUTES: B3884."
  - "The module helpers at prometheus.py L91-L158 (_BudgetedCustomerFilter, _PaginatedPrismaTable, _paginated_table, _JoinedBudgetRow, _CustomerBudgetRow): typing glue for the page walk and the customer setter, owned with their callers by B3884 and B3882."
pitfalls:
  - "The gate needs all five groups no-op to skip; with one gauge enabled LiteLLM still runs all five lookups, and each lookup decides on its own gauge."
  - "Python's asyncio.gather with return_exceptions=True keeps going when one lookup fails, so a failure must not cancel the other four futures."
  - "On timeout the debug line is the only output; the per-lookup failure lines are not logged, even for lookups that had already failed."
  - "Duration::from_secs_f64 panics on 1e300 and clippy refuses it; use try_from_secs_f64 and map the overflow to Duration::MAX."
  - "1e999 parses to infinity in both Python and Rust, so it reaches the finite check and falls back to 5 seconds instead of failing the load."
  - "The email and the org alias are dropped when they are not strings, but the spends and max budgets are passed through as they are, null included."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
