  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L1461-L1472
    why: The one caller, in the success hook B8561 builds, and the values it passes.
