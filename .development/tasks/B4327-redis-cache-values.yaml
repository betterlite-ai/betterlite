deviations:
  - what: >-
      The sync `set_cache` stores the JSON text of the value. LiteLLM stores
      `str(value)`, so a dict reaches Redis as `{'a': 1}`.
    why: Python repr text is outside docs/compatibility.md, and `get_cache` reads both forms through B4324's decoder. LiteLLM reads betterlite's text too, since JSON is valid input to `json.loads`.
  - what: >-
      `flush_cache_buffer` removes only the entries it sent. LiteLLM empties the
      whole list after the await, so an entry appended while the pipeline was running
      is lost.
    why: Keeping those entries loses no write, and the Python outcome is a race, not a promise.
  - what: >-
      `batch_get_cache` returns an empty map when decoding fails. LiteLLM returns the
      raw, undecoded values it had mapped so far.
    why: A raw bytes value has no place in the typed result. This is an open question for the architect, and the empty map is the choice for now.
  - what: >-
      The service event has no `caller` field, so the stack projection from B4324 is
      not called here.
    why: Rust has no frame names to walk. The event's `call_type` names the method.
  - what: >-
      Entries are serialized to JSON text when they are appended to the buffer, not
      when it is flushed.
    why: A typed value can't wait in a list of unknown type, and a value that can't be serialized fails at the call that gave it.

out_of_scope:
  - "`RedisCache.__init__`, `async_increment`, `async_get_cache`, `async_batch_get_cache`, `async_increment_pipeline`, `async_get_ttl` and `async_refresh_ttl`; B360 owns them."
  - "`_get_cache_logic`, `check_and_fix_namespace`, `_get_call_stack_info`, `_incrbyfloat_with_ttl` and `_pipeline_increment_helper`; B4324 owns them. The code here calls the first two."
  - "`init_async_client`, `_async_commands`, `_run_redis_mget_operation` and `_async_run_redis_mget_operation`; B4325 owns them as `RedisTransport::async_client` and `mget`."
  - "The circuit breaker, `_enter_circuit_breaker`, `_exit_circuit_breaker`, the guard decorators, `log_redis_failure` and `_record_swallowed_redis_failure`; B393 owns them and B5630 fills in `BreakerGate` over them."
  - "`async_delete_cache`, `delete_cache`, `ping`, `sync_ping`, `disconnect`, `flush_cache`, `flushall` and the other administration methods; B4326 owns them."
  - "`increment_cache`, `increment_with_floor`, `batch_get_counts`, `async_scan_iter`, `async_register_script`, `async_set_max` and `async_increment_with_floor`; B4328 owns them. `get_cache` and `batch_get_cache` are here because B4328 is about counters and Lua and neither one uses either."
  - "The list operations at L2053-L2420 of `litellm/caching/redis_cache.py`; B4329 owns them."
  - "`BaseCache.get_ttl` in `litellm/caching/base_cache.py`; B4290 owns it. The same integer cut is done inline here."
  - "`ServiceLogging` in `litellm/_service_logger.py`; B012 owns it and B5630 implements `ServiceHooks` over it."
  - "`async_set_cache_sadd` on `InMemoryCache` and `DualCache`; B4290 and B4293 own them."

pitfalls:
  - >-
      `batch_get_cache` returns the original keys, not the namespaced ones, and a miss
      is `key: None` in the map. A caller such as `DualCache` tells a miss from an
      absent key by that.
  - >-
      `async_set_cache_pipeline` looks up the async client outside its try and
      `async_set_cache_pipeline_with_ttls` inside it, so the first returns a connection
      error and the second swallows it. Don't make the two alike.
  - >-
      `async_set_cache` and `async_set_cache_sadd` return a client error but swallow
      the command error, so a test that only breaks the command sees `Ok`.
  - >-
      `batch_cache_write` already namespaced the key, and the pipeline namespaces it
      again. `check_and_fix_namespace` skips a key that already has the prefix, so
      don't strip the prefix or call it a second time by hand.
  - >-
      `async_set_cache` sends `NX` only when the caller passes `nx`, and a nil reply
      means the key existed. Treat a nil reply as `None`, not as an error.
  - >-
      `SADD` with an empty member list is sent as it is. The server's error is
      swallowed, and the `EXPIRE` that follows is not sent.
  - >-
      `batch_get_cache` leaves the gate before decoding, so a bad cached value is
      recorded as a swallowed failure but the admission was already exited.
  - >-
      `set_cache`, `get_cache` and `batch_get_cache` block on the sync client. They are
      for sync call sites only, and async code must call them through `spawn_blocking`.
  - "A pipeline with a TTL of 0 sends `EX 0` and the server rejects it. The whole pipeline fails and nothing is written."

review_level: standard

