id: B4327
title: Write Redis cache values, sets and buffered pipelines
description: >-
  B4325 gives a `RedisTransport` with a sync and an async client. This task puts
  the value reads and writes of `RedisCache` on top of it: single SET, pipelined
  SET, SET with a TTL per entry, SADD with EXPIRE, the write buffer, and the sync
  reads `get_cache` and `batch_get_cache`. It adds the module `redis_cache_values`
  to betterlite-redis. B4330 calls `async_set_cache_pipeline_with_ttls` from here,
  and B4293 and B4294 reach the rest through the cache wrapper.

  Type. `RedisCacheValues::new(settings: RedisCacheValuesSettings, transport:
  Arc<RedisTransport>, hooks: Arc<dyn ServiceHooks>, gate: Arc<dyn BreakerGate>)`,
  with no global. `RedisCacheValuesSettings` has `namespace: Option<String>`,
  `default_ttl: Option<i64>` and `redis_flush_size: Option<usize>`. A missing flush
  size means 100. B5630 reads `litellm.default_redis_ttl` and the flush size from
  config and passes them in, so this task reads no config key and no env var. The
  struct also holds the write buffer, `Mutex<Vec<(String, String)>>` of namespaced
  key and JSON text. Key namespacing is B4324's `check_and_fix_namespace`.

  Hooks and gate. `ServiceHooks`, `ServiceEvent`, `BreakerGate`, `BreakerAdmission`
  and `BreakerOpen` come from B4325's module `redis_client_reuse`, and this task
  declares none of them. The hook gets the event and, on failure, the error as `&(dyn
  Error + Send + Sync)`. The gate's `enter` returns `BreakerOpen`, which this
  module's error wraps as `RedisCacheValuesError::BreakerOpen`. The gate stands in
  for `_enter_circuit_breaker`, `_exit_circuit_breaker`, the health-failure check in
  `_run_under_circuit_breaker` and `_record_swallowed_redis_failure` (B393), and the
  hooks for B012's `ServiceLogging`. B5630 implements both. `swallowed` takes the
  admission so the gate can count the failure per call. A test gate in
  `redis_cache_values/tests/` records the calls.

  Guard rule, used by every method below marked guarded. Call `gate.enter(name)`
  first, and an open breaker returns its error with nothing sent. Run the body. If
  the body returns `Err`, call `gate.record_failure(&error)` and return the error. If it
  returns `Ok`, call `gate.exit(admission)` once. A failure the body swallows goes
  to `gate.swallowed(&admission, &error)`, and `exit` then does not count a success.
  The two guarded sync methods use the same order. The guarded methods are
  `async_set_cache`, `async_set_cache_pipeline`,
  `async_set_cache_pipeline_with_ttls`, `async_set_cache_sadd`, `batch_cache_write`
  and `get_cache`. `batch_get_cache` enters and exits by hand and `set_cache` is not
  guarded at all.

  TTL. Every write resolves its TTL the way `BaseCache.get_ttl` does (B4290 owns
  that class): a given `ttl: Option<f64>` is cut to an integer toward zero, and no
  `ttl` means `default_ttl`. The result goes to the server as `EX` seconds. With
  neither, no `EX` is sent. A zero or negative TTL is sent as it is and the server's
  error follows the usual path for that method.

  `fn set_cache<V: Serialize + ?Sized>(&self, key: &str, value: &V, ttl:
  Option<f64>)`. Blocking, for sync call sites only. It namespaces the key, sends
  `SET key text [EX ttl]` through `transport.sync_client.query`, and fires the
  success hook with `call_type` `set_cache`. Any error is swallowed and returns `()`,
  with no failure hook and no gate call. LiteLLM stores `str(value)`, a Python repr.
  betterlite stores the JSON text, and `get_cache` decodes both (see deviations).

  `async fn async_set_cache<V: Serialize + ?Sized>(&self, key: Option<&str>, value:
  &V, ttl: Option<f64>, nx: bool) -> Result<Option<bool>, RedisCacheValuesError>`,
  guarded. A `None` key returns `Ok(None)` with nothing sent. Getting the async client
  comes first and its failure fires the failure hook and is returned, so the guard
  counts it. After that, `SET namespaced_key json [NX] [EX ttl]` through
  `transport.async_client()` and `LiveAsyncClient::query`. A reply of OK gives
  `Some(true)`. A nil reply (what `nx` gets when the key exists) gives
  `None`. The success hook gets `key` set to the namespaced key. An error from the
  SET fires the failure hook, is swallowed through `gate.swallowed`, and returns
  `Ok(None)`.

  `async fn async_set_cache_pipeline<V: Serialize>(&self, cache_list: &[(String, V)],
  ttl: Option<f64>) -> Result<(), RedisCacheValuesError>`, guarded. An empty list
  returns at once and opens no client. Getting the async client is outside the try,
  so its error is returned. Then one non-transactional pipeline (`client.pipeline(false)`
  from B5220's `AsyncRedisCommands`, commands added to `LivePipeline.commands`) holds one
  `SET namespaced_key json [EX ttl]` per entry in order, all with the one resolved
  TTL, and `execute()` runs it. Any command error fails the whole execute, as
  redis-py's `raise_on_error` does. An execute error fires the failure hook, goes to
  `gate.swallowed` and returns `Ok(())`. Success fires the success hook.

  `async fn async_set_cache_pipeline_with_ttls<V: Serialize>(&self, cache_list:
  &[(String, V, Option<f64>)]) -> Result<(), RedisCacheValuesError>`, guarded. Same
  shape, but each entry resolves its own TTL and a `None` falls back to
  `default_ttl`. Unlike the plain pipeline, getting the async client is inside the try,
  so its error is swallowed like an execute error.

  `async fn async_set_cache_sadd(&self, key: &str, value: &[String], ttl:
  Option<f64>) -> Result<(), RedisCacheValuesError>`, guarded. Client failure fires the
  failure hook and is returned. Then `SADD key member...`, and when the resolved
  TTL exists, a second command `EXPIRE key ttl`. These are two round trips with no
  MULTI, and a failure of the second leaves the set written. A failure of either
  fires the failure hook and is swallowed. An empty `value` sends `SADD key` with
  no member, the server rejects it, and that is swallowed too.

  Buffer. `async fn batch_cache_write<V: Serialize + ?Sized>(&self, key: &str, value:
  &V) -> Result<(), RedisCacheValuesError>`, guarded. It namespaces the key, appends
  the key and the JSON text to the buffer, and when the buffer length reaches
  `redis_flush_size` it calls `flush_cache_buffer`. `async fn flush_cache_buffer(&self)
  -> Result<(), RedisCacheValuesError>` sends the buffered entries through
  `async_set_cache_pipeline` with no TTL, so the default TTL applies and the keys are
  namespaced a second time, and that changes nothing. It then removes exactly the
  entries it sent, from the front. The pipeline call is itself guarded, so a flush
  inside `batch_cache_write` enters the gate twice, as LiteLLM does. A returned error
  keeps the buffer. A swallowed pipeline error does not: the entries are removed and
  lost.

  Sync reads. `fn get_cache(&self, key: &str) -> Result<Option<CachedValue>,
  RedisCacheValuesError>`, guarded, blocking. It sends `GET` through
  `transport.sync_client.query`, fires the success hook with `call_type`
  `get_cache` before decoding, then decodes with B4324's `decode_cached_value`
  (JSON first, then a Python literal). Every error, a decode error included, is
  logged, goes to `gate.swallowed` and returns `Ok(None)`. Only an open breaker
  returns `Err`.

  `fn batch_get_cache(&self, key_list: &[Option<&str>]) ->
  Result<HashMap<String, Option<CachedValue>>, RedisCacheValuesError>`, blocking. It
  drops `None` keys, calls `gate.enter("batch_get_cache")` and returns its error
  unswallowed, namespaces the rest, and calls `transport.mget` (B4325, the
  sync `_run_redis_mget_operation` for both families). It calls `gate.exit` right
  after the read, before decoding, then fires the success hook. The result maps each
  original, not namespaced, key to its decoded value, and a miss is present with
  `None`. Convert each `redis::Value` reply with `FromRedisValue` into
  `Option<Vec<u8>>` and pass it to `decode_cached_value`. A duplicate key keeps the
  last value. Any error fires the failure hook, goes to `gate.swallowed` and gives an
  empty map (see deviations for a decode error).

  `RedisCacheValuesError` is a `thiserror` enum owned by this module. It wraps
  `ClientReuseError`, `LiveClientError`, `DecodeError` and `serde_json::Error` with
  `#[from]`, and wraps B4325's `BreakerOpen` the same way. Its text is "Redis circuit
  breaker is open, skipping" followed by the method name.

  Tests reuse the fake server at `crate::redis_live_client::tests::fake_server`. Each
  group is a file under `redis_cache_values/tests/`. The oracle helper op `b4327` has
  two functions. `write_commands` builds a `RedisCache` without connecting (an
  instance made with `object.__new__` and the attributes the methods read set by
  hand: `namespace`, `redis_flush_size`, `redis_batch_writing_buffer`, `default_ttl`,
  a breaker and a no-op service logger), replaces `init_async_client` with a recording
  fake whose `pipeline` and `set`, `sadd` and `expire` write each command to a list, runs the
  named method, and returns `{commands: [[str]], buffered: int}`. Its input has
  `operation`, `namespace`, `default_ttl`, `flush_size`, `entries` and `nx`.
  `read_values` does the same for `get_cache` and `batch_get_cache`, with the fake
  `get` and `mget` answering the given raw `replies`, and returns `{values, keys_sent}`.
  Each case file is `kind: helper` with `call: {b4327: {function: ..., ...}}`.

