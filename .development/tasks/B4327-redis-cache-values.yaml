dod:
  - text: >-
      `async_set_cache` sends `SET` with the namespaced key and JSON text, adds `NX`
      only when asked, adds `EX` from the given TTL or the default, returns
      `Some(true)` on OK and `None` on an `NX` miss, and sends nothing for a `None` key.
    proof: [async-set-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `async_set_cache` returns an error from getting the client, and swallows an
      error from the SET through `gate.swallowed` after the failure hook.
    proof: [async-set-failure-tests]
  - text: >-
      `async_set_cache_pipeline` sends one non-transactional pipeline of namespaced
      `SET` commands in order with one TTL, sends nothing for an empty list, returns a
      client error, and swallows an execute error.
    proof: [pipeline-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `async_set_cache_pipeline_with_ttls` gives each entry its own TTL, uses the
      default for a `None`, sends no `EX` when neither exists, and swallows a client
      error as well as an execute error.
    proof: [pipeline-ttls-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `async_set_cache_sadd` sends `SADD` then `EXPIRE` only when a TTL resolves, fires
      the failure hook on a failure of either, returns a client error, and swallows the rest.
    proof: [sadd-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `batch_cache_write` buffers namespaced entries, flushes once the buffer reaches
      the flush size, keeps entries added during the flush, keeps the buffer on a
      returned error and drops it on a swallowed one.
    proof: [buffer-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `set_cache` stores the JSON text with the TTL, swallows an error, and never calls
      the gate.
    proof: [sync-set-tests]
  - text: >-
      `get_cache` decodes JSON and Python literal replies, returns `None` for a miss,
      and returns `None` and records a swallowed failure for an undecodable reply.
    proof: [get-cache-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `batch_get_cache` drops `None` keys, reads namespaced keys with one `MGET`, maps
      original keys to decoded values with `None` for a miss, and exits the gate before
      decoding. A read error gives an empty map.
    proof: [batch-get-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      An open breaker returns `BreakerOpen` from every guarded method and from
      `batch_get_cache`, with the fake server recording no command. A success exits the
      gate once and a swallowed failure does not count as a success.
    proof: [gate-tests]

