deviations:
  - what: >-
      All _post_inspection failures (HTTP status errors, timeouts, network errors,
      JSON parse errors) wrap uniformly into CiscoAIDefenseGuardrailAPIError, which
      is caught by _inspect_chat and _inspect_mcp_request/response and routed through
      _handle_api_error for fallback_on_error policy handling.
    why: >-
      Uniform error handling ensures consistent fallback behavior across all transport
      failure modes. The verdict engine (_finalize_inspection) only processes successful
      responses; error policy decisions are deferred to _handle_api_error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L814-L849

out_of_scope:
  - Configuration normalization, mode inference, record definitions, and supported_hooks list; those belong to B3759.
  - Building chat inspection payloads (_build_chat_payload, _build_metadata, _build_config); those belong to B3759.
  - Verdict envelope parsing, action normalization, sanitized payload extraction, MCP argument decoding; those belong to B3758.
  - Request and response redaction application; those belong to B3757.
  - Verdict finalization, decision logging, metadata attachment to request, error fallback policy, and block payload building; those belong to B3760.
  - Building MCP request/response payloads (_build_mcp_request_payload, _build_mcp_response_payload), MCP post-tool hook (async_post_mcp_tool_call_hook), and MCP output replacement; those belong to B3761.
  - Message and tool-argument extraction from requests/responses; those belong to B3756.
  - Streaming output hook (async_post_call_streaming_iterator_hook); that buffers and applies verdicts to streamed chunks.
  - HTTP client setup and async handler acquisition; those are framework dependencies (H).
  - CustomGuardrail base class initialization; that belongs to the framework (F).
  - should_run_guardrail filtering by event_type and metadata; that belongs to the guardrail base (F).

pitfalls:
  - The async_handler is acquired via get_async_httpx_client with llm_provider=httpxSpecialProvider.GuardrailCallback; it is not instantiated in this task.
  - _post_inspection sends with follow_redirects=False to prevent following inspector API redirects; this is deliberate, unlike normal HTTP clients.
  - Surface matching must check inspection_type against is_mcp (inferred from call_type), not consult request shape; call_type is the proxy's routing decision, not caller-controlled.
  - _inspect_mcp_request and _inspect_mcp_response are inherited from _CiscoAIDefenseMcpMixin via multiple inheritance in the class declaration, following the same inspection and error-handling pattern as _inspect_chat.
  - _post_inspection raises CiscoAIDefenseGuardrailAPIError for all transport failures; _inspect_chat and MCP variants catch it and dispatch to _handle_api_error for policy handling, never re-raising.

