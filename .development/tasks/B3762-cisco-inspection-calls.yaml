dod:
  - text: >-
      __init__ accepts api_key (or CISCO_AI_DEFENSE_API_KEY env var), api_base
      (or CISCO_AI_DEFENSE_API_BASE env var, default CISCO_DEFAULT_API_BASE),
      inspection_type (or env var, default "chat"), enabled_rules, timeout, and
      uses _resolve_choice/_coerce_timeout/_infer_inspection_type_from_mode/
      _normalize_rule helpers to normalize. Raises CiscoAIDefenseGuardrailMissingSecrets
      when api_key is absent. Calls parent CustomGuardrail.__init__ with supported hooks.
    proof: [inspection-tests]
  - text: >-
      async_pre_call_hook filters on _surface_matches(is_mcp), returns data
      unchanged if surface mismatch or should_run_guardrail fails. On match,
      calls _inspect_chat (for chat) or _inspect_mcp_request (for mcp) with
      request messages/arguments, then adds guardrail header and returns data.
    proof: [inspection-tests]
  - text: >-
      async_moderation_hook (during_call) has same surface/run guards and dispatch
      as async_pre_call_hook. Both use GuardrailEventHooks.pre_call/during_call for chat,
      pre_mcp_call/during_mcp_call for mcp.
    proof: [inspection-tests]
  - text: >-
      async_post_call_success_hook returns response early if inspection_type != "chat".
      Extracts response messages via _extract_response_messages, builds conversation by
      prepending request messages, calls _inspect_chat with direction="output" and
      response_obj. Returns response after adding header.
    proof: [inspection-tests]
  - text: >-
      _inspect_chat calls _build_chat_payload (from B3759), posts to
      {api_base}{inspect_path}, catches exceptions and dispatches to
      _handle_api_error, delegates verdict response to _finalize_inspection
      with _ScanContext(surface="chat", direction=direction).
    proof: [inspection-tests]
  - text: >-
      _post_inspection builds headers via _build_headers, calls
      client.build_request("POST", url, headers, json=payload, timeout=self.timeout),
      client.send(request, follow_redirects=False). All errors (HTTP status, timeout,
      network, JSON parse) are wrapped as CiscoAIDefenseGuardrailAPIError and raised.
    proof: [inspection-tests]
  - text: >-
      _build_headers returns dict with CISCO_API_KEY_HEADER (api_key value),
      Content-Type (application/json), Accept (application/json), User-Agent
      (litellm/{litellm_version}).
    proof: [inspection-tests]
  - text: >-
      _inspect_mcp_request builds MCP request payload via _build_mcp_request_payload (from B3761),
      calls _post_inspection, catches exceptions and dispatches to _handle_api_error,
      delegates verdict response to _finalize_inspection with _ScanContext(surface="mcp", direction="input").
      When payload builder returns None, logs debug and returns {}, skipping inspection.
    proof: [inspection-tests]
  - text: >-
      _inspect_mcp_response builds MCP response payload via _build_mcp_response_payload (from B3761),
      calls _post_inspection, catches exceptions and dispatches to _handle_api_error,
      delegates verdict response to _finalize_inspection with _ScanContext(surface="mcp", direction="output").
      When payload builder returns None, logs debug and returns {}, skipping inspection.
    proof: [inspection-tests]
  - text: >-
      _inspect_mcp_request returns {} without calling _post_inspection when
      _build_mcp_request_payload returns None.
    proof: [inspection-tests]
  - text: >-
      _inspect_mcp_response returns {} without calling _post_inspection when
      _build_mcp_response_payload returns None.
    proof: [inspection-tests]
  - text: >-
      All _post_inspection failures (HTTP status, timeout, network, JSON parse)
      wrap uniformly into CiscoAIDefenseGuardrailAPIError, route through _handle_api_error,
      and delegate final verdict logic to _finalize_inspection.
    proof: [inspection-tests]

