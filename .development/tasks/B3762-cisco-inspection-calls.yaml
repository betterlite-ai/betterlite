id: B3762
title: Cisco inspection calls and nonstreaming lifecycle hooks
description: >-
  Construct CiscoAIDefenseGuardrail instances and implement the lifecycle hooks
  that perform chat and MCP HTTP inspections, connecting them to the common
  verdict engine. Implement the constructor initializer (api_key, api_base,
  inspection_type, enabled_rules, timeout settings, configuration resolution),
  the three synchronous hooks (async_pre_call_hook for input inspection,
  async_moderation_hook for mid-call inspection, async_post_call_success_hook
  for nonstreaming output inspection), and the HTTP inspection orchestration
  (_inspect_chat and _post_inspection) that builds payloads, sends requests
  with correct headers, parses responses, and delegates verdict finalization
  to shared logic. Preserve disabled redirects on inspection requests (fastapi
  HTTPException detail payload) and separate JSON-RPC MCP envelope handling
  in request bodies.

  The streaming output hook (async_post_call_streaming_iterator_hook) remains
  out of scope; streaming hooks buffer chunks and apply verdicts but do not
  change the core inspection request/response cycle. The MCP post-tool hook
  lives on the mixin in cisco_ai_defense_mcp.py and is registered separately.

  Configuration normalization, verdict records, redaction application, and
  metadata attachment all belong to prerequisites. This part owns only the
  guardrail initialization and the request/response inspection workflow that
  feeds the verdict engine with the right message shapes and carries forward
  the inspection surface context (chat vs. mcp, input vs. output).

