dod:
  - text: >-
      LimitedSizeOrderedDict tracks insertion order and evicts oldest when max size is exceeded
      without losing concurrent lock-protected updates.
    proof: [dual-cache-tests]

  - text: >-
      DualCache constructor initializes with optional Redis and required memory tier, applying
      provided or default TTLs, batch expiry, and max batch size.
    proof: [dual-cache-tests]

  - text: >-
      update_cache_ttl and update_in_memory_max_size modify running configuration safely.
    proof: [dual-cache-tests]

  - text: >-
      attach_redis_cache wires Redis lazily, preserving prior state and doing nothing when
      Redis is None or already attached.
    proof: [dual-cache-tests]

  - text: >-
      set_cache writes to both memory and Redis, applying default memory TTL when not specified,
      and swallows exceptions without backpropagation.
    proof: [dual-cache-tests]

  - text: >-
      increment_cache increments memory first, then Redis, returning Redis result when available,
      propagating Redis errors to the caller.
    proof: [dual-cache-tests]

  - text: >-
      get_cache returns memory result on hit, falling back to Redis miss with backfill to memory
      using the memory tier's TTL, and logging exceptions.
    proof: [dual-cache-tests]

  - text: >-
      async_get_cache checks request-batch miss tracking through active_request_redis_batch,
      returning None when marked missing, without blocking.
    proof: [dual-cache-tests]

  - text: >-
      async_set_cache_pre_call returns BatchResult for request-pipeline or None for direct-path,
      writing to memory now and deferring Redis.
    proof: [dual-cache-tests]

  - text: >-
      async_delete_cache_pre_call deletes from memory now and defers Redis DEL to the request pipeline.
    proof: [dual-cache-tests]

  - text: >-
      async_set_cache_pipeline writes to both memory and Redis with a single memory TTL applied to
      all entries in the batch.
    proof: [dual-cache-tests]

  - text: >-
      async_increment_cache and async_increment_cache_pipeline catch Redis errors and return the
      memory result rather than propagating exceptions.
    proof: [dual-cache-tests]

  - text: >-
      async_increment_cache_post_call increments memory and enqueues Redis increment on the post-call
      batch with settled-hook callback for deferred-increment-failure logging.
    proof: [dual-cache-tests]

  - text: >-
      async_set_cache_sadd adds values to a set in both memory and Redis with optional TTL.
    proof: [dual-cache-tests]

  - text: >-
      flush_cache and delete_cache work across both tiers; async_delete_cache_keys chunks Redis
      deletes to DEFAULT_MAX_REDIS_BATCH_CACHE_SIZE per command.
    proof: [dual-cache-tests]

  - text: >-
      async_get_ttl returns memory TTL first, falling back to Redis TTL when memory miss.
    proof: [dual-cache-tests]

