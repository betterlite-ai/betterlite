deviations:
  - what: >-
      betterlite uses Rust's Arc<Mutex<LimitedSizeOrderedDict>> for thread-safe access-time tracking;
      LiteLLM uses Python's threading.Lock(). Semantics are equivalent: ordered FIFO eviction with
      concurrent writer exclusion.
    why: Language difference requires different synchronization primitives to achieve the same result.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/dual_cache.py#L102-L103

  - what: >-
      betterlite uses async/await natively; LiteLLM uses asyncio. All behavior is preserved:
      operations run to completion before returning, exceptions propagate as specified, and callbacks
      settle after all operations are done.
    why: Language and runtime difference; betterlite's native async is a superset of asyncio behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/dual_cache.py#L261

  - what: >-
      betterlite DualCache accepts owned InMemoryCache and RedisCache instances; LiteLLM accepts
      options and constructs them internally. Behavior is identical: both support constructor-provided
      or lazy attach_redis_cache.
    why: Rust requires explicit ownership; the effect on the user of cache construction is unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/dual_cache.py#L87-L100

out_of_scope:
  - 'Batch-read operations (batch_get_cache, async_batch_get_cache, async_batch_get_cache_shared, declared-read protocol): owned by B4294.'
  - 'Redis writes (set, delete, increment operations): owned by a lower task (blocker A per outline).'
  - 'RedisBatch batch engine: owned by B4330; B4293 is a caller through B4331.'
  - 'active_request_redis_batch and request-scoped batch management (RequestRedisBatches context variable): owned by B4331.'
  - 'Batch operation result protocols (BatchResult, on_settled callbacks): owned by B4330.'
  - 'Memory-cache primitives (get, set, delete, increment): owned by B2226 and B390, composed only.'
  - 'Redis constructor and non-batched fallback operations: owned by B360, composed only.'
  - 'Cache key derivation and semantic-cache logic: owned by B4296.'
  - 'Cache configuration and backend construction: owned by B4299.'

pitfalls:
  - "active_request_redis_batch(redis_cache) is provided by B4331 and returns the current request's
    active batch if one exists, or None outside the context. Call this before every potential Redis
    read to check miss tracking without blocking the caller."

  - "Backfill after Redis reads must reapply the configured default_in_memory_ttl; otherwise, backfilled
    entries use memory cache's global default TTL, which may differ from the dual-cache configuration."

  - "async_increment_cache and pipeline_increment catch Redis errors and return the memory result;
    sync increment_cache propagates errors. This asymmetry is intentional: async increments preserve
    memory state across Redis failure, while sync increments demand consistency."

  - "async_delete_cache_keys chunks Redis deletes into groups of DEFAULT_MAX_REDIS_BATCH_CACHE_SIZE
    (currently 1000) because Redis takes the entire key list as one command. Memory deletion is not
    chunked and runs on every key."

  - "Memory deletion inside async_delete_cache_keys does not await; the function synchronously deletes
    from memory and then asynchronously deletes from Redis in chunks. Ordering is memory-first,
    then Redis in sequence."

  - "Settled hooks for deferred increments run after the post-call batch flushes. The _log_deferred_increment_failure
    callback runs even if the operation was cancelled or the batch failed. Do not assume the future
    contains a result value."

review_level: standard
