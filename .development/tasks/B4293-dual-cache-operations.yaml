id: B4293
title: Compose memory and Redis cache reads and mutations
description: >-
  Build the dual-tier cache orchestration composing local memory and remote Redis backends
  into a unified interface for single-key operations. Implement LimitedSizeOrderedDict
  for ordered, bounded tracking of Redis batch access times with atomic lock-protected updates.
  Construct DualCache with optional Redis and required memory tiers, applying configured TTLs
  to both layers on writes and backfilling memory from Redis reads with the memory tier's TTL.

  On memory misses, single-key Redis reads apply throttling to avoid overloading a slow backend,
  reusing access times across concurrent calls with thread-safe atomic reservations. Local-only
  fallback when Redis is absent or writes are deferred works for all operations. Async increment
  catches Redis errors and returns the memory result rather than propagating, while sync increment
  propagates errors. Mutation ordering preserves local writes ahead of remote completion;
  request-batched writes defer Redis operations to pipelines and unbatched calls execute directly.
  Delegate batch operations to B4294 through declared reads and shared batch infrastructure.

  Crate: betterlite-cache.

  Configuration and environment: TTL defaults from litellm.default_in_memory_ttl,
  litellm.default_redis_ttl, litellm.default_redis_batch_cache_expiry, and
  DEFAULT_MAX_REDIS_BATCH_CACHE_SIZE constant (currently 1000). No new config keys
  or environment variables at this level; B4299 composes backend construction.

