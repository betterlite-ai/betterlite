id: B4717
title: MCP management visibility and credential inheritance
description: >-
  Build the role-sensitive sanitizers, the admin predicates and the credential
  inheritance of the MCP management endpoints in betterlite-server::mcp::management_visibility.

  Redaction layers: full admins see the row B10134's redact_mcp_credentials
  (mcp::admin_credential_view) returns, with the admin-config keys and scopes kept for the
  edit form; this task maps it over a list (_redact_mcp_credentials_list) and builds the
  progressively stripped views non-admin viewers and virtual keys receive. Every function
  here that redacts takes the registry and public list redact_mcp_credentials takes, passes
  them through, and returns its CredentialViewError. The redaction contract
  ensures secrets never leak through unencrypted fields like static_headers, env,
  url, spec_path, command, args, issuer, or token endpoints.

  Role distinctions: PROXY_ADMIN (full admin), PROXY_ADMIN_VIEW_ONLY (admin view,
  no mutations), and regular users. virtual-key callers with non-empty allowed_routes
  (B10135's is_restricted_virtual_key_request) are restricted and the routes give them the
  virtual-key sanitizer. Everyone else maps to admin or non-admin sanitization.

  Credential inheritance: when a user edits a session server (draft) derived from
  a stored server, new credentials come from admin input (form submission); omitted
  fields inherit from the parent server's stored secrets via a whitelist of
  (server_attr, credential_key) pairs. Admin config overrides inherited values, and
  the guard refuses to leak readable BYOK via inheritance if no real credential
  was supplied. The admin-config keys _has_non_admin_config_credentials skips are B10134's
  MCP_ADMIN_CONFIG_CREDENTIAL_KEYS; read that list instead of declaring it again.

  Moved to other tasks and not built here: _authorize_and_fetch_mcp_server,
  _resolve_accessible_mcp_servers, _is_restricted_virtual_key_request and
  _get_user_mcp_management_mode are B10135's (mcp::management_server_access and the
  mcp_management_mode config section); _redact_mcp_credentials and
  _preserved_admin_config_credentials are B10134's. Nothing in this module calls B10135.

  The plan registers helper operation b4717 as a not_built stub in tools/oracle/src/helpers/mcp/lib.rs and tools/oracle/helpers/dispatch.py. Fill tools/oracle/src/helpers/mcp/b4717.rs, write tools/oracle/helpers/b4717.py, and leave both registries as they are.

