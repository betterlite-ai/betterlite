id: B4717
title: MCP management visibility and credential inheritance
description: >-
  Build role-sensitive redaction, per-user-state authorization, and credential
  inheritance for MCP management endpoints in betterlite-server::mcp::management_visibility.

  Redaction layers: full admins see server credentials with admin-config keys
  (scopes, minting parameters) preserved for the edit form; non-admin viewers and
  virtual keys receive progressively stripped server views. The redaction contract
  ensures secrets never leak through unencrypted fields like static_headers, env,
  url, spec_path, command, args, issuer, or token endpoints.

  Role distinctions: PROXY_ADMIN (full admin), PROXY_ADMIN_VIEW_ONLY (admin view,
  no mutations), and regular users. virtual-key callers with non-empty allowed_routes
  are restricted and get the virtual-key sanitizer. Everyone else maps to admin or
  non-admin sanitization.

  User-state authorization: _authorize_and_fetch_mcp_server looks up servers in
  both DB and the in-memory registry (for config-defined servers), then gates
  access per identity: full admins see any server or get 404 for unknown; non-admins
  must have the server in their allowed set and otherwise get 403 (never 404). The
  same allowed-server resolution MCP gateway enforces on tool calls applies here.

  Credential inheritance: when a user edits a session server (draft) derived from
  a stored server, new credentials come from admin input (form submission); omitted
  fields inherit from the parent server's stored secrets via a whitelist of
  (server_attr, credential_key) pairs. Admin config overrides inherited values, and
  the guard refuses to leak readable BYOK via inheritance if no real credential
  was supplied.

  Management mode: user_mcp_management_mode defaults to restricted; only exact
  view_all enables catalog visibility, isolation per key, and non-admin access.
  _resolve_accessible_mcp_servers returns the credential-free server set a user
  may query; sanitization is caller-applied. _get_user_mcp_management_mode loads
  the setting from proxy config.

