dod:
  - text: 'Cases secret_gate_settings_switch_client, prefix_trailing_slash_empty,
      create_raw_value_tags_description, rotate_both_names_no_creation_options,
      rename_read_then_rotate, rename_missing_warns_empty_value_rotates,
      delete_alias_none_vs_empty, delete_team_params_cached, delete_failure_stops_later_keys,
      params_missing_runtime_db_cache, params_lookup_error_debug_none,
      params_model_dump_and_nonempty_dict, params_model_dump_error_propagates,
      no_secret_value_in_diagnostics, email_disabled_debug_skip,
      email_membership_shape_semantics, legacy_creation_event_all_defaults,
      legacy_creation_explicit_nulls, legacy_email_uses_token_not_key,
      creation_schedules_without_waiting and rotation_email_unavailable_debug_skip cover the MIT path.'
    proof:
      - behavior-tests
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_event_sinks::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/key_event_sinks.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/key-event-sinks-*")"
        && grep -rlq "key_event_sinks" tools/oracle/fuzz/corpus/helper_case/key-event-sinks-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^key_event_sinks::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/key-event-sinks-*")"
        && grep -rlq "key_management_settings" crates/betterlite-config/fuzz/corpus/config_yaml/key-event-sinks-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/key-event-sinks/rename-secret.yaml
  - tools/oracle/cases/helpers/key-event-sinks/delete-secret-batch.yaml
  - tools/oracle/cases/helpers/key-event-sinks/email-settings.yaml
  - tools/oracle/cases/helpers/key-event-sinks/secret-manager-failure.yaml
  - tools/oracle/cases/helpers/key-event-sinks/enterprise-absent-legacy-email.yaml
deviations: []
out_of_scope:
  - Enterprise BaseEmailLogger imports and event branches are unavailable and not implemented.
    B129 owns concrete secret-manager transport operations and configuration, B116 legacy email
    delivery, B737 team lookup and B784 outer lifecycle handling. This task passes secrets to their
    intended secure destination and adds no stored-cipher format or local database write.
  - 'litellm/proxy/hooks/key_management_event_hooks.py: B784 owns KeyManagementEventHooks.async_key_generated_hook
    (L36-L94), KeyManagementEventHooks.async_key_updated_hook (L97-L154), KeyManagementEventHooks.async_key_rotated_hook
    (L157-L224), KeyManagementEventHooks.async_key_deleted_hook (L227-L245), KeyManagementEventHooks.create_key_deleted_audit_logs
    (L248-L286).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - An empty secret returned by read is renamed; only None means missing.
  - Enabling legacy email sends creation notifications but still skips every rotation notification.
budget:
  max_changed_lines: 750
  max_new_expects: 0
review_level: security
