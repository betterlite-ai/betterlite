deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - 'litellm/proxy/hooks/key_management_event_hooks.py: B784 owns KeyManagementEventHooks.async_key_generated_hook
    (L36-L94), KeyManagementEventHooks.async_key_updated_hook (L97-L154), KeyManagementEventHooks.async_key_rotated_hook
    (L157-L224), KeyManagementEventHooks.async_key_deleted_hook (L227-L245), KeyManagementEventHooks.create_key_deleted_audit_logs
    (L248-L286).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - B129 and B116 install concrete transports.
