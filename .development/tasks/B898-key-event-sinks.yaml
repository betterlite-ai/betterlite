id: B898
title: Key secret-manager and legacy notification sinks
description: >-
  Implement secret-manager operations over B129 and legacy notification scheduling over B116.
  All secret operations require a settings record, store_virtual_keys literally True and a
  BaseSecretManager-compatible client; other values return without I/O. Do not gate these helpers
  on access_mode themselves. Name secrets by appending directly when prefix ends '/', otherwise
  insert '/'; empty prefix therefore produces /<name>. Creation passes the RAW key to async_write_secret
  with tags/description (both default None) and per-team optional params. Rotation prefixes both names
  and sends the new raw secret but no creation tags/description. Rename first reads the old prefixed
  name; None warns and skips, whereas empty string is a real value and is rotated. It keeps that
  value and uses the same optional params for read and rotate. No local encryption/hash changes the
  secret-manager payload; B129 owns transport credentials and secure storage.

  Delete keys sequentially, skipping only key_alias None with a warning containing the stored token
  identifier. Empty alias is still a secret name. Cache optional params once per distinct team_id,
  including None, within a delete call. A transport exception propagates and stops later deletes;
  this helper does not swallow it or log a generic success. B784 owns its caller's event failure
  handling. Never include raw secret values in native diagnostics or transport debug output.

  Optional params return None for team_id None, absent proxy runtime, DB or key cache. B737 lookup
  exceptions debug-log and return None. A metadata model is dumped, then only a nonempty dict
  metadata.secret_manager_settings is shallow-copied and passed to the sink. Empty/wrong-shaped
  metadata/settings yield None. Model-dump failures occur outside the lookup catch and propagate.
  These team settings are not passed through encrypt_callback_vars here; preserve the existing
  opaque credential/settings representation and do not dump it in diagnostics.

  With no enterprise package, _is_email_sending_enabled skips its import and checks only whether
  general_settings.alerting (default []) contains email. Disabled creation/rotation debug-log and
  return. Enabled creation builds the legacy WebhookEvent: event key_created, group KEY, message
  'API Key Created', token from response.token default '', spend/max_budget default 0.0, user_id
  None, team_id 'Default Team' and key_alias None. Missing differs from an explicit None. It does
  not take the new key from response.key. Schedule send_key_created_or_user_invited_email without
  waiting for delivery. Enabled rotation debug-logs the unavailable enterprise import and sends
  NO legacy email; v0 has no rotated-email equivalent. Event-construction/scheduling errors are
  not caught here despite the source docstring. Use a supervised sink for the scheduled creation
  notification and retain the caller-visible nonblocking behavior.


  Build the production key_event_sinks module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/hooks/key_management_event_hooks.py:
  KeyManagementEventHooks._store_virtual_key_in_secret_manager (L289-L318; 26 source lines), KeyManagementEventHooks._rotate_virtual_key_in_secret_manager
  (L321-L345; 24 source lines), KeyManagementEventHooks._stored_virtual_key_secret_manager (L348-L356;
  9 source lines), KeyManagementEventHooks._rename_virtual_key_in_secret_manager (L359-L395; 36 source
  lines), KeyManagementEventHooks._get_secret_name (L398-L402; 5 source lines), KeyManagementEventHooks._delete_virtual_keys_from_secret_manager
  (L405-L438; 32 source lines), KeyManagementEventHooks._get_secret_manager_optional_params (L441-L484;
  34 source lines), KeyManagementEventHooks._is_email_sending_enabled (L487-L514; 21 source lines), KeyManagementEventHooks._send_key_created_email
  (L517-L589; 59 source lines), KeyManagementEventHooks._send_key_rotated_email (L592-L645; 44 source
  lines).


  Runtime secret_manager_client defaults None and is installed by B129, not a second YAML client
  decoder. The public email binding is general_settings.alerting, default []; no top-level alerting
  override is read by these methods.


  general_settings.key_management_settings resolves _key_management_settings: hosted_keys=None,
  store_virtual_keys=false, prefix_for_stored_virtual_keys="litellm/", access_mode="read_only"; the sink
  uses the stored-key switch and prefix rather than enabling secret writes implicitly.


  Add the key_event_sinks operation under B856 Management::keys. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-event-sinks-*
  seed to B171 helper_case, which already owns this decoder.


  Config tests key_event_sinks::tests::key_management_defaults, configured_prefix_tags_description,
  store_virtual_keys_false_null_true, legacy_alerting_nested_binding and invalid_settings_rejected
  call the B002 loader and B129 settings schema. No invalid-value fallback is invented. Tests of
  direct helper inputs also cover Python's membership behavior for string alerting and error for
  null/noncontainer alerting, rather than silently substituting the absent-field default.


  Sizing: the ranges contain 290 lines before docstring and unavailable enterprise-branch exclusion.
  Allow 240 native sink logic, 300 tests, 65 oracle adapters, 30 wiring and 50 config tests,
  685 within 750. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
