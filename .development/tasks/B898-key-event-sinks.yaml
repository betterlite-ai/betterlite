id: B898
title: Key secret-manager and legacy notification sinks
description: >-
  Implement key secret-manager store/rotate/rename/delete preparation and MIT legacy email fallback through
  injected SecretManagerSink and NotificationSink. B129 and B116 install concrete transports. With no
  litellm_enterprise package, V2 BaseEmailLogger hooks are unavailable and their MIT import fallback is
  followed. Preserve prefix_for_stored_virtual_keys and optional tag/description handling; sink failure
  warnings must not expose raw key values.


  Build the production key_event_sinks module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/hooks/key_management_event_hooks.py:
  KeyManagementEventHooks._store_virtual_key_in_secret_manager (L289-L318; 26 source lines), KeyManagementEventHooks._rotate_virtual_key_in_secret_manager
  (L321-L345; 24 source lines), KeyManagementEventHooks._stored_virtual_key_secret_manager (L348-L356;
  9 source lines), KeyManagementEventHooks._rename_virtual_key_in_secret_manager (L359-L395; 36 source
  lines), KeyManagementEventHooks._get_secret_name (L398-L402; 5 source lines), KeyManagementEventHooks._delete_virtual_keys_from_secret_manager
  (L405-L438; 32 source lines), KeyManagementEventHooks._get_secret_manager_optional_params (L441-L484;
  34 source lines), KeyManagementEventHooks._is_email_sending_enabled (L487-L514; 21 source lines), KeyManagementEventHooks._send_key_created_email
  (L517-L589; 59 source lines), KeyManagementEventHooks._send_key_rotated_email (L592-L645; 44 source
  lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.secret_manager_client=None;
  general_settings.alerting=[]; alerting=[].


  litellm_settings.key_management_settings resolves the source _key_management_settings record: hosted_keys=None,
  store_virtual_keys=false, prefix_for_stored_virtual_keys="litellm/", access_mode="read_only"; the sink
  uses the stored-key switch and prefix rather than enabling secret writes implicitly.


  Add the key_event_sinks operation under B856 Management::keys. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-event-sinks-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::key_event_sinks::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 290 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  290 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 580 changed lines estimated within a 600-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
