out_of_scope:
  - "LiteLLM's end-user parameters spread into the master record (user_api_key_auth.py L2096) and the master-only route list (L2119-L2120): the end-user stages and B2326, which ports the whole master branch for B052."
  - "A configured admin name in place of DEFAULT_USER_ID: master_key_context passes DEFAULT_USER_ID, as B10165 does; B8621 reads the setting for the MCP paths."
  - "betterlite-core's managed_resource_access has_admin_view and managed_resource_store is_proxy_admin, which read roles only and never compared the subject; the master key passes them since B10165."
  - "The auth stage tests that assert subject \"master_key\"; the subject stays."
  - "The alias inside LiteLLM's own lists, betterlite-guardrails straiker/v3.rs PLACEHOLDER_IDENTITIES and betterlite-logging spend_metadata/redaction.rs NON_SECRET_KEY_ALIASES: they port LiteLLM's lists, check no caller, and their crates don't depend on betterlite-auth."
  - "The `user_id or litellm_proxy_admin_name` fallbacks with their own constant, cache_settings_update/audit.rs DEFAULT_USER_ID and invitation_routes/store.rs PROXY_ADMIN_NAME: they never check the master key."
  - "HTTP oracle cases, for the reason in the description."
pitfalls:
  - "Don't add a master marker of any kind (an AuthMethod variant, a credential_ref sentinel, a flag on Principal): LiteLLM's marker is the record, and a second marker is one more thing a key could forge."
  - "Set the subject back to \"master_key\" only through struct update after principal_from_key, and compare it nowhere."
  - "Hash with hash_token, not safe_hash_api_key: master_key_admin_auth compares against hash_token of the master key, the plain SHA-256 of any text, and a master key need not start with sk-."
  - "An Err from master_key_admin_auth is a StageFailure, never Ok(None) and never a pass."
  - "Once the subject clause goes, the is_proxy_admin bodies in guards.rs, cache_settings_test, cache_settings_update and custom_code_test are one line, so the no-one-line-functions rule puts the role check at each caller (guards.rs, invitations.rs role_text, invitations/create.rs, invitations/delete.rs and the three routes). Move the rstest for guards' is_proxy_admin to a caller's behavior."
  - "caller_has_admin_view spreads over several lines after rustfmt, so it stays a function; its eight old copies all go."
  - "A hand-built \"master\" fixture stops being an admin. Switch it to master_caller(); don't add roles or a source key by hand to keep it passing."
  - "spend/reports: the master branch gave api_key \"litellm_proxy_master_key\", team None and org None; check that logged_api_key over the record (api_key the alias, is_session_token false, key_alias None) gives the same."
  - "invitation_routes/queue/request.rs's master KeyView carried token None; the record's token is the alias, as in LiteLLM, so compare the queued call's key fields with LiteLLM's L16800-L16816 rather than with the old branch."
  - "B10165 added master_key_context calls in management_admins/tests.rs and credentials/tests/create.rs; they take the Result now. Its master_key_context_carries_the_admin_user_and_role asserts ServiceAccount and no source key, which both change here, so master_key_context_carries_the_master_key_record replaces it."
