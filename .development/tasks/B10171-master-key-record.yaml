dod:
  - text: >-
      master_key_context builds LiteLLM's master key record with master_key_admin_auth and projects it with
      principal_from_key: user default_user_id, roles PlatformAdmin, credential_ref token_id the alias, the record as
      source_key and subject "master_key". Another key or an empty one gives no context.
    proof: [master-record]
  - text: >-
      At the role sites a virtual key whose user_id or key_alias is "master_key" is not a proxy admin, and the master
      key still is.
    proof: [spoof-role-sites]
  - text: At the admin-view sites a virtual key whose user_id is "master_key" has no admin view.
    proof: [spoof-admin-view]
  - text: >-
      At the key-record sites a virtual key whose user_id is "master_key" reads as itself, not as the master key's
      alias, admin user or role.
    proof: [spoof-key-record]
  - text: >-
      No MASTER_KEY_SUBJECT, subject comparison with "master_key", default_user_id copy or second master key alias
      constant is left in the crates.
    proof: [no-master-subject]
  - text: The auth stages and every route suite that serves the master key still pass with master_caller().
    proof: [module-tests]
checks:
  optional: []
  commands:
    - id: master-record
      why: The master principal still lacks LiteLLM's key record, or another key authenticates as the master key.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^auth::auth_key_lookup::tests::master_key_context_carries_the_master_key_record$/)'
    - id: spoof-role-sites
      why: A key named master_key by its user id or alias still passes a proxy admin check.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^(tracing_routes::tests::access::a_key_whose_user_or_alias_is_master_key_is_not_an_admin|spend::totals::tests::routes::logs_scope_a_key_whose_user_is_master_key_to_that_user)$/)'
    - id: spoof-admin-view
      why: A key whose user id is master_key still gets the admin view.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^(root_routes::tests::a_key_whose_user_is_master_key_gets_the_admin_view_error|usage_ai_chat_route::tests::caller_treats_a_key_whose_user_is_master_key_as_a_non_admin)$/)'
    - id: spoof-key-record
      why: A key whose user id is master_key still reads as the master key's alias, admin user or role.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^(auto_router_read_api::tests::caller_api_key_ignores_a_key_whose_user_is_master_key|organization_create::tests::access::org_caller_of_a_key_whose_user_is_master_key_is_not_an_admin)$/)'
    - id: no-master-subject
      why: A master key subject constant, subject comparison, default_user_id copy or second alias constant is still in the code.
      run: >-
        test -z "$(git grep -l -E 'MASTER_KEY_SUBJECT|MASTER_KEY_USER_ID|DEFAULT_ADMIN_USER_ID|const LITELLM_PROXY_MASTER_KEY_ALIAS' -- crates)"
        && test -z "$(git grep -l -F 'subject == "master_key"' -- crates)"
        && test -z "$(git grep -l -F '"litellm_proxy_master_key"' -- 'crates/betterlite-server/src/*.rs' 'crates/betterlite-core/src/*.rs' ':!**/tests.rs' ':!**/tests/**')"
        && test "$(git grep -l -E 'const MASTER_KEY_ALIAS' -- crates)" = crates/betterlite-auth/src/master_key_admin.rs
    - id: module-tests
      why: The master key record or a removed branch broke an auth stage or a route suite that serves the master key.
      run: >-
        cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^master_key_admin::/)'
        && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_metadata_safety::/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^(auth::|management_guards::|management_admins::|credentials::|agent_endpoints::|api::|auto_router_read_api::|cache_settings_read::|cache_settings_test::|cache_settings_update::|endpoints::passthrough_config_reads::|guardrails::|health_access_and_connections::|health_services::|invitation_routes::|management::|organization_create::|plugin_routes::|reload_routes::|roi_connections::|roi_settings::|root_routes::|routes::|search_tool_routes::|spend::|tracing_routes::|usage_ai_chat_route::|workflow_events::|workflow_runs::|compliance_checks::|lens_access::|app::|health_status_routes::)/)'
