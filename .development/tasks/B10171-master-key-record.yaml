id: B10171
title: The master key's rights come from LiteLLM's master key record, not from the subject
description: >-
  About 28 route modules in betterlite-server decide that the caller is the master key by comparing principal.subject with "master_key", each with its own MASTER_KEY_SUBJECT constant (organization_create/caller.rs makes its copy pub, and auto_router_read_api and spend/reports import it). The key stage sets the subject from the key's user_id, then key_alias, then the hashed token (B870's principal_from_key, which B10165 puts on the fallback path), so a virtual key whose user_id or key_alias is "master_key" gets every master right at those sites: proxy-admin writes, the admin view, the master's api_key alias in spend reports and the auto-router session list, and default_user_id as its identity. No booted request authenticates with a virtual key yet (state/auth_key_lookup.rs leaves the authenticator None), so nobody reaches it today, but a composition root that installs one would open it.


  LiteLLM never asks "is this the master key" at these sites. user_api_key_auth compares the master key once (user_api_key_auth.py L2074-L2085) and answers with a UserAPIKeyAuth whose api_key is LITELLM_PROXY_MASTER_KEY_ALIAS "litellm_proxy_master_key", user_role PROXY_ADMIN, user_id litellm_proxy_admin_name and via_virtual_key True (L2085-L2116). Then it projects that record into the request principal the way it projects any key (L3518-L3527 and _resolve_request_principal L3224-L3245). Every site below reads user_role, the admin view, user_id or api_key off that record, so the master key passes as a proxy admin, and a virtual key passes only with a proxy admin role of its own. Once the Rust master principal carries the same record, every site can read it the same way and the Rust behavior matches LiteLLM's, so there is no deviations row.


  The one master check is the comparison in master_key_context (crates/betterlite-server/src/auth/auth_key_lookup.rs, where B10165 moves it), and only master_key_context builds the master's record. It hashes the presented key with betterlite_models::key_digest::hashing::hash_token and calls B10115's betterlite_auth::master_key_admin::master_key_admin_auth(&digest, Some(master_key), DEFAULT_USER_ID), with betterlite_db::model_secrets::DEFAULT_USER_ID. That function compares the digests in constant time and builds exactly LiteLLM's record; LiteLLM's bridge_token_flow.py L212-L234 builds the same one for MCP. No presented key, an empty one or a wrong one gives Ok(None), as today. The principal is that record through B870's principal_from_key with the projection _resolve_request_principal gives it: auth_method ApiKey, issuer None, subject_fallback Some(MASTER_KEY_ALIAS), scopes empty, credential_ref Some(CredentialRef { key_id: None, token_id: Some(MASTER_KEY_ALIAS.to_owned()) }) and network None. So it carries user default_user_id, roles [Role::PlatformAdmin], principal_type Human and the record as source_key. MASTER_KEY_ALIAS in crates/betterlite-auth/src/master_key_admin.rs becomes pub for this, and betterlite-core's request_metadata_safety/identity.rs uses it instead of its own LITELLM_PROXY_MASTER_KEY_ALIAS copy.


  One field stays apart from LiteLLM's projection: the subject is set back to "master_key" with struct update syntax, `Principal { subject: "master_key".to_owned(), ..principal_from_key(..) }`. About twenty auth stage tests on main and five running tasks (B742, B750, B753, B880, B881) assert that subject to show the master key went through a stage, and after this task no code grants anything on it. The subject is not on any response.


  master_key_admin_auth returns a Result, because UserAPIKeyAuth::construct does, so master_key_context returns Result<Option<AuthContext>, StageFailure>. An Err becomes StageFailure::KeyLookup carrying as_proxy_exception(&AuthFailure::Other { message: error.to_string(), param: None }).exception(), the 401 "Authentication Error, <error>" that LiteLLM's handler gives an exception raised in this branch (user_api_key_auth.py L2199-L2208, auth_exception_handler.py L77-L82). master_key_stage in auth_identity.rs then returns Result<AuthContext, StageFailure> and its call site drops the map_err. The key lookup prefetch and B870's identity-store prefetch in crates/betterlite-server/src/auth/identity_store.rs apply ? to it.


  The role sites drop their subject clause, and what is left is LiteLLM's PROXY_ADMIN check, `principal.roles.contains(&Role::PlatformAdmin)` or the module's role list, written where it is used. They are api/agents/collection_routes/guards.rs is_proxy_admin (agents_endpoints.py L34-L38), which invitation_routes/invitations.rs role_text, invitations/create.rs and invitations/delete.rs also call; api/claude_plugin_write/access.rs require_admin (claude_code_marketplace.py L270, through resource_ownership.py is_proxy_admin); cache_settings_test/route.rs and cache_settings_update/route.rs is_proxy_admin (route_checks.py L260-L365, the admin-only route check that refuses a non-admin key for /cache/settings); guardrails/admin_mutations.rs (guardrail_endpoints.py L393, L503, L596, L1016, L1096 and L1186); guardrails/custom_code_test/route.rs (guardrail_endpoints.py L2120); routes/prompts/write/state.rs (prompt_endpoints.py L631-L632, L728-L729, L839-L840 and L925-L926); roi_settings/auth.rs (roi_calculator_endpoints.py L87-L104); management/gateway_request_activity/auth.rs (gateway_request_endpoints.py L109-L116); tracing_routes/access.rs TraceAuth::from_principal (tracing_endpoints.py L58-L70 and L164); and spend/totals/access.rs classify (spend_management_endpoints.py L3878-L3882, which scopes internal users only). api/claude_plugin_read/access.rs admin_principal pushes PlatformAdmin for the master and goes; caller passes the principal unchanged (skill_visibility, claude_code_skill_access.py L62-L65).


  The admin-view sites hold eight copies of LiteLLM's user_api_key_has_admin_view over a principal (_types.py L3554): the key record's admin view, or the PlatformAdmin or PlatformViewer role. They become one `pub fn caller_has_admin_view(principal: &Principal) -> bool` in crates/betterlite-server/src/management_guards/caller.rs, beside caller_user_id_for_non_admin. guardrails/admin_reads/caller.rs (guardrail_endpoints.py L231), guardrails/submissions/teams.rs (L904 and L983), invitation_routes/invitations/info.rs (proxy_server.py L17805), reload_routes/caller.rs (L19507 and L19559), root_routes.rs (L19882), routes/prompts/read/access.rs (prompt_endpoints.py L292 and L364), search_tool_routes/list.rs sees_every_tool (search_tool_management.py L110-L113) and usage_ai_chat_route/caller.rs (usage_endpoints/endpoints.py L56) call it and delete their own.


  The key-record sites delete their master branch, because the master's record now answers what the branch hard-coded. auto_router_read_api/access.rs caller_api_key reads api_key (auto_router_endpoints.py L935). spend/reports/caller.rs ReportCaller reads the logged api_key, team and org (spend_management_endpoints.py L1846-L1870 and L1931-L1935). invitation_routes/queue/request.rs key_view reads api_key and user_id (proxy_server.py L16800-L16816). organization_create/caller.rs OrgCaller reads user_id, user_role, models and the admin view (organization_endpoints.py L275, L449, L502-L503 and L534-L535). plugin_routes/routes.rs caller_identity reads user_id and user_role (plugin_routes.py L240-L241, L267 and L299-L304). The creator and updater ids come from principal.user in api/claude_plugin_write/access.rs creator_id (claude_code_marketplace.py L360), invitation_routes/invitations/update.rs (proxy_server.py L17854-L17868) and routes/prompts/write/state.rs (prompt_endpoints.py L663, L778 and L984-L985). Their default_user_id copies (MASTER_KEY_USER_ID, DEFAULT_ADMIN_USER_ID) and MASTER_KEY_ALIAS copies go with the branches. organization_create/creation.rs keeps LiteLLM's `user_id or litellm_proxy_admin_name` fallback (organization_endpoints.py L502) with DEFAULT_USER_ID.


  Modules that reach the master key through these helpers follow without a code change: TraceAuth serves endpoints/passthrough_config_reads, roi_connections, workflow_runs and workflow_events; caller_identity serves health_access_and_connections, spend/tag_reports, agent_endpoints, routes/auto_router_read_api and guardrails/admin_reads team_ids; OrgCaller serves spend reports, lens_access and others. The record also reaches every other source_key reader, as it does in LiteLLM: virtual_key_routes reads allowed_routes unset and lets the request through, auth_model_grants returns before any check (no agent_caller, no agent_id), and compliance_checks, health_services key alerts, lens_access, file_credentials and vector_management_read see a proxy admin key.


  Tests. crates/betterlite-server/src/auth/auth_key_lookup/tests.rs gains `pub(crate) fn master_caller() -> AuthContext`, the context master_key_context returns for a fixed test key, beside B10165's caller_through_key_stage. Every route-test fixture that builds a master by subject switches to master_caller(): caller("master_key", ..), principal("master_key", ..), context("master_key", ..), a JSON principal with "subject":"master_key", a principal whose subject is set to "master_key", and routes/prompts/read/tests/support.rs, which imports MASTER_KEY_SUBJECT. Every test that showed the subject alone makes an admin (the_master_key_subject_is_an_admin_without_a_role, master_key_subject_is_an_admin, access_master_key_is_a_proxy_admin, the master_key rstest cases in roi_settings, root_routes and workflow_runs, and the rest the module suites turn up) becomes a test that a key whose user_id is "master_key" is not one, with a master_caller() case beside it. B10165's tests that call master_key_context directly take its Result.


  The new tests build the spoofing key with caller_through_key_stage(r#"{"user_id":"master_key"}"#) and the aliased one with caller_through_key_stage(r#"{"key_alias":"master_key"}"#), never a hand-written Principal. In auth::auth_key_lookup::tests, master_key_context_carries_the_master_key_record: for the configured key the context has subject "master_key", user id "default_user_id", roles exactly [Role::PlatformAdmin], credential_ref token_id "litellm_proxy_master_key" and key_id None, and a source_key whose serde form has api_key "litellm_proxy_master_key", user_id "default_user_id" and user_role "proxy_admin"; another key and an empty key give Ok(None). The role sites: tracing_routes::tests::access::a_key_whose_user_or_alias_is_master_key_is_not_an_admin (TraceAuth role Other for both spoofing keys, Admin for master_caller()) and spend::totals::tests::routes::logs_scope_a_key_whose_user_is_master_key_to_that_user (that key with user_role "internal_user" on /global/spend/logs: the store call is user_daily_spend for master_key, not the global one). The admin-view sites: root_routes::tests::a_key_whose_user_is_master_key_gets_the_admin_view_error (GET /adaptive_router/state answers the admin-view 403) and usage_ai_chat_route::tests::caller_treats_a_key_whose_user_is_master_key_as_a_non_admin (200, the source sees user id Some("master_key") and the model gets the one non-admin tool). The key-record sites: auto_router_read_api::tests::caller_api_key_ignores_a_key_whose_user_is_master_key (caller_api_key is not Some("litellm_proxy_master_key") for the spoofing key and is for master_caller()) and organization_create::tests::access::org_caller_of_a_key_whose_user_is_master_key_is_not_an_admin (OrgCaller user_id Some("master_key"), user_role None, admin_view false; master_caller() gives default_user_id, ProxyAdmin and true).


  There are no HTTP oracle cases. The booted proxy installs no KeyAuthenticator, so no booted request authenticates with a virtual key, and the master key's booted answers on composed routes don't change.
