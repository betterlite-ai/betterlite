- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/common_utils.py#L47-L63
  why: Own AzureOpenAIError.__init__. Other functions in this file remain with the owners listed below.
