  proof:
  - case-client-secret-form
  - oracle
  - helper-python
- text: 'tenant scope: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-client-secret/tenant-scope.yaml.'
  proof:
  - case-tenant-scope
  - oracle
  - helper-python
- text: 'oauth failure: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-client-secret/oauth-failure.yaml.'
  proof:
  - case-oauth-failure
  - oracle
  - helper-python
- text: 'token expiry: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-client-secret/token-expiry.yaml.'
  proof:
  - case-token-expiry
  - oracle
  - helper-python
- text: New azure_client_secret seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_client_secret_token has newly committed malformed and boundary inputs replayed through production
