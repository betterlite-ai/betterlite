  - crates/betterlite-azure/src/azure_client_secret.rs
  - crates/betterlite-azure/src/azure_client_secret/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_client_secret.rs
  - tools/oracle/src/helpers/azure_client_secret/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_client_secret.py
  - tools/oracle/cases/helpers/providers/azure-client-secret/**
  - tools/oracle/fuzz/corpus/helper_case/azure_client_secret*
