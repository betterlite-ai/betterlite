id: B673
title: Azure client-secret grant
description: >-
  Implement the client-secret OAuth grant through the injected B173 client, with tenant/client/secret/scope passed
  as typed resolved inputs. Use grant_type=client_credentials and the tenant v2 token endpoint; this task owns the
  reusable token provider cache.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  get_azure_ad_token_from_entra_id L104-L157; AzureOpenAIError.__init__ L47-L63; _cached_entra_id_token_provider
  L81-L96.


  Named case contracts: client_secret_reference_resolution: Resolve tenant_id, client_id and client_secret through
  B129 only when they start with os.environ/; leave other strings unchanged, including empty strings. Any resolved
  None raises ValueError tenant_id, client_id, and client_secret must be provided. Default scope is https://cognitiveservices.azure.com/.default.
  client_secret_provider_cache: Reuse the provider with lru_cache(maxsize=128), keyed by resolved tenant_id/client_id/client_secret/scope;
  the provider owns Azure SDK token refresh. Capture ClientSecretCredential and get_bearer_token_provider construction,
  do not duplicate Azure Identity expiry algorithms. azure_error_fields: AzureOpenAIError delegates status_code,
  message, request, response, headers and body to B2202 BaseLLMException without rewriting them; defaults for request/response/headers/body
  are None. regional_authority_inputs: Azure Identity reads AZURE_REGIONAL_AUTHORITY_NAME default None, mapping
  case-insensitive true/tryautodetect to auto detection; other strings including empty are literal values. MSAL_FORCE_REGION
  default None is used only when that input is None, not empty. REGION_NAME default empty removes all spaces and
  lowercases; this local detection runs even with no selected regional authority. Reuse this policy in B674/B675.
  regional_authority_discovery: When configured region is non-None (including an empty string) and REGION_NAME is
  empty, GET http://169.254.169.254/metadata/instance/compute/location?format=text&api-version=2021-01-01 with Metadata:
  true using B173. Exceptions log IMDS unavailable and return None; otherwise use stripped response text without
  a status guard. Auto detection uses detected region; explicit region wins. Warn Region configured (...) != region
  detected (...) whenever configured is not autodetect and differs from detected, including None or empty configured
  values, and debug Region to be used: .... No configured region means no IMDS call and no regional authority. regional_authority_host:
  A chosen region uses https://{region}.login.microsoft.com/{tenant} for central login.microsoftonline.com, login.microsoft.com,
  login.windows.net or sts.windows.net; other clouds use https://{region}.{central_host}/{tenant}. Disable repeated
  instance discovery for this derived authority. Central authority ValueError propagates; other central-discovery
  failure retries without instance discovery only when a regional authority was selected. No user request URL can
  supply the discovery endpoint.


  Shared provider base helper implementations are B2202: use its owned primitives directly when called by these
  ranges. Do not reintroduce a dependency on B010/B016 for these small helpers.


  Pin SDK fixture capture to azure-identity 1.25.2 and msal 1.37.0 from LiteLLM uv.lock; reject fixture generation
  with a different version. The old 1.26.0 references were not the locked dependency. Capture the public credential
  transport path, not unused legacy request factories retained in the SDK.


  Load AZURE_REGIONAL_AUTHORITY_NAME, MSAL_FORCE_REGION, REGION_NAME through betterlite-config, with injected environment
  lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest azure_identity_region_config_cases; each named loads_<key> case invokes the real B002 loader,
  checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  AZURE_IDENTITY_DISABLE_MULTITENANTAUTH is not read on the LiteLLM wrapper path: no get_token tenant override is
  supplied, so resolve_tenant returns at its first guard. SDK callers that pass alternate tenant IDs remain B159;
  do not expose an unused deployment option here. SDK-specific regional metadata lookup is fixed-endpoint credential
  discovery, not request URL downloading.


  Implement crates/betterlite-azure/src/azure_client_secret.rs with adjacent tests under azure_client_secret/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_client_secret in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_client_secret_cases in betterlite-azure with these exact named cases (one per oracle
  file): client_secret_form, tenant_scope, oauth_failure, token_expiry, client_secret_reference_resolution, client_secret_provider_cache,
  azure_error_fields, regional_authority_inputs, regional_authority_discovery, regional_authority_host. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_client_secret* using HelperCase: kind:
  helper and the externally tagged azure_client_secret variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_client_secret that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_client_secret_token consumes Azure client-secret token response bytes in crates/betterlite-azure/src/azure_client_secret.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_client_secret.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_client_secret.
  The adjacent test replays_the_azure_client_secret_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_client_secret_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_client_secret_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 76 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 305 production lines, 250 behavior/config-test lines, 125 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 40 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 800 planned, 800 maximum changed lines. The production allowance includes 100 lines for the referenced
  SDK protocol that LiteLLM delegates.
