  proof:
  - parser-corpus
- text: credential identity isolation holds at this task’s owned boundary.
  proof:
  - credential-identity-isolation
- text: secret safe failure holds at this task’s owned boundary.
  proof:
  - secret-safe-failure
checks:
  optional:
  - mutants
  commands:
  - id: case-client-secret-form
    why: The client-secret-form behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_client_secret_cases::case_[0-9]+_client_secret_form$/)'
  - id: case-tenant-scope
    why: The tenant-scope behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_client_secret_cases::case_[0-9]+_tenant_scope$/)'
  - id: case-oauth-failure
    why: The oauth-failure behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_client_secret_cases::case_[0-9]+_oauth_failure$/)'
  - id: case-token-expiry
    why: The token-expiry behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_client_secret_cases::case_[0-9]+_token_expiry$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_client_secret.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_client_secret*")"
      && grep -lq 'azure_client_secret' tools/oracle/fuzz/corpus/helper_case/azure_client_secret* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_client_secret$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_client_secret)"
      && grep -q 'decode_client_secret_token' crates/betterlite-azure/fuzz/fuzz_targets/azure_client_secret.rs &&
      cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_client_secret_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_client_secret_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_client_secret_secret_safe_failure$/)'
