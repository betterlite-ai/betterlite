dod:
  - text: Protected indices are the union of the system rows, last user row, last assistant row and cached prefix from `get_protected_indices`, plus retrieval result rows, expanded over whole tool exchanges, plus every assistant row without expansion.
    proof: [headroom-protected-tests, oracle]
  - text: Retrieve call ids are read from OpenAI `tool_calls` (assistant rows, non-empty id) and Anthropic `tool_use` blocks (id present), matching `headroom_retrieve` and the `__headroom_retrieve` suffix, and ignoring other tools.
    proof: [headroom-protected-tests, oracle]
  - text: Tool and function rows whose `tool_call_id` is a retrieve call id are retrieval results, including ids that only the raw untranslated messages carry.
    proof: [headroom-protected-tests, oracle]
  - text: Flattening turns only non-empty all-text part lists into one string and leaves every other row unchanged.
    proof: [headroom-shape-tests, oracle]
  - text: Content shape restoration keeps the original parts for an untouched row, merges rewritten text into one part with the last cache_control, and adopts the returned rows when the count or any role differs.
    proof: [headroom-shape-tests, oracle]
  - text: Protected rows are put back at their original positions around the compressed rows, and a short compressed list is a typed error.
    proof: [headroom-shape-tests, oracle]
  - text: ccr hashes are lowercased, filtered to 12 to 24 hex characters and dropped when `ccr_hashes` is not a list.
    proof: [headroom-failure-tests, oracle]
  - text: Failure detail adds the 404 hint only for status 404, and fail_open returns the rows unchanged while fail_closed returns a 502 body with `error` and the detail keys.
    proof: [headroom-failure-tests, oracle]
  - text: Settings fall back to HEADROOM_API_BASE and HEADROOM_API_KEY, strip trailing slashes from the base, reject an empty base with the LiteLLM message, and default to fail_closed and ccr_retrieval true.
    proof: [headroom-settings-tests]
  - text: Timeouts that are none, zero, negative, NaN or infinite give 60 seconds, any other value is kept, and the connect timeout is the smaller of the total and 5 seconds.
    proof: [headroom-settings-tests, oracle]
  - text: Request headers carry the Bearer key only when a key is set, and the config model rejects an `unreachable_fallback` other than the two names.
    proof: [headroom-settings-tests]
checks:
  optional: []
  commands:
    - id: headroom-protected-tests
      why: protected index selection or retrieve call id reading is missing or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^headroom_messages::tests::protected_/)'
    - id: headroom-shape-tests
      why: flattening, content shape restoration or protected row restore is missing or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^headroom_messages::tests::(flatten|restore)_/)'
    - id: headroom-failure-tests
      why: failure detail, fallback handling or ccr hash reading is missing or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^headroom_failure::tests::/)'
    - id: headroom-settings-tests
      why: instance settings, timeout clamping, request headers or the config model are missing or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^headroom_settings::tests::/)'
