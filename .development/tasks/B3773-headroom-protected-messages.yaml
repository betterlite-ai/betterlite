id: B3773
title: Headroom protected messages and transport settings
description: >-
  Build the parts of LiteLLM's Headroom guardrail that B3774 (compression call and apply hook) and B3775 (retrieval) both stand on: which message rows are held back from compression, how rows are flattened before the call and put back after it, the failure policy, and the settings a guardrail instance is built from. Everything here is pure or takes its inputs as arguments. No HTTP call is made in this task.


  Three new modules in betterlite-guardrails, each with its own error type where it can fail and its tests in a sibling `tests.rs`. Rows are `serde_json::Value` objects, the type `betterlite_compression::protected_indices::get_protected_indices` already takes. `group_tool_exchanges` from betterlite-prompts (B224) takes its own `Json` type, so convert the rows once at that call with serde and do not write a second converter.


  Module `headroom_messages`. (1) `flatten_for_compression(rows) -> Vec<Value>`: a row whose `content` is a non-empty list with only `{"type": "text"}` parts (`is_all_text_parts`, B3663, in `betterlite_guardrails::content_text`) and whose joined text (`content_to_text`, B3663) is non-empty gets `content` replaced by that text string. Every other row is copied unchanged, so a row with an image part keeps its parts and its `cache_control` positions. (2) `restore_content_shapes(originals, returned) -> Vec<Value>`: if the counts differ, or any pair has a different `role`, return `returned` as is. Otherwise go pair by pair. When the original `content` is a list and the returned `content` is a string: if the string equals `content_to_text(original content)`, the row is the returned row with the original parts list put back (so per-part fields such as `cache_control` survive); if not, the row is the returned row with `content` set to `merge_rewritten_text_parts(original parts, returned text)` (B3663). Any other pair gives the returned row. (3) `restore_protected_messages(messages, compressed, protected) -> Vec<Value>`: the rows not in `protected` were the ones sent, in order; zip them with `compressed` by position and rebuild the full list, taking the original row at every protected index. B3774 guarantees one returned row per row sent, so a short `compressed` is a typed error, never a panic or a silent gap.


  Protected indices in `headroom_messages`. `retrieve_call_ids(messages: Option<&Value>) -> BTreeSet<String>` reads the request's own untranslated messages (a list, else empty). Per message it collects two kinds of id. OpenAI: only when `role` is `assistant`, each `tool_calls` entry that is an object with a non-empty `id` and a `function.name` that is `headroom_retrieve` or ends with `__headroom_retrieve` (the `mcp__<server>__` form a client sees through the MCP gateway). Anthropic: each `content` list block of `type` `tool_use` whose `name` matches the same rule and whose `id` is present (an empty string id counts here, unlike the OpenAI branch). `retrieval_result_indices(messages, extra_ids)` returns the indices of rows whose `role` is `tool` or `function` and whose `tool_call_id` is in `extra_ids` united with the ids found by the OpenAI branch over `messages` themselves (not the Anthropic branch). It returns the empty set when there are no ids. `protected_indices(messages, extra_ids) -> BTreeSet<usize>` is the union of: `get_protected_indices(messages)` plus `retrieval_result_indices`, expanded so that any `group_tool_exchanges` group with a member in that set is wholly included, plus every index whose `role` is `assistant` (added after the expansion and not expanded, so tool results asked for by an assistant stay compressible).


  Module `headroom_failure`. `build_compress_failure_detail(status, body) -> Map<String, Value>`: `{"status_code", "body"}`; for status 404 add `hint` with exactly "The Headroom compression endpoint returned HTTP 404. Verify that the configured Headroom endpoint is correct and that the compression endpoint is available. If you are using a self-hosted deployment, some deployments require enabling remote compression (for example, HEADROOM_COMPRESS_ALLOW_REMOTE=1)." `handle_compress_failure(fallback, rows, error, detail) -> Result<Vec<Value>, CompressFailure>`: with `fail_open` log at error level (tracing has no critical) "Headroom: {error}; fail_open configured, forwarding request uncompressed. detail={detail}" and return `rows` unchanged; with `fail_closed` return `CompressFailure { status: 502, body }` where body is `{"error": error, ...detail}`. B3774 turns that into the HTTP 502. Also define here `CompressResult { messages, succeeded, stats, ccr_hashes }` (the value `_call_compress` returns; B3774 fills it) and `read_ccr_hashes(body) -> BTreeSet<String>`: when `ccr_hashes` is a list, keep the string entries that, lowercased, fully match `[a-f0-9]{12,24}`, and store the lowercased form; any other `ccr_hashes` value gives the empty set.


  Module `headroom_settings`. Constants: `BYPASS_HEADER` = `x-headroom-bypass`, `HEADROOM_RETRIEVE_TOOL_NAME` = `headroom_retrieve`, `HEADROOM_GUARDRAIL_PROVIDER` = `headroom`, the supported hooks `pre_call` and `post_call` (`GuardrailEventHooks` lives in betterlite-config, B3662), the default compress timeout 60 seconds and the connect cap 5 seconds (LiteLLM's HTTP_HANDLER_CONNECT_TIMEOUT_SECONDS). `HeadroomSettings::new(input, secrets)` builds the instance fields from `api_base`, `api_key`, `model`, `unreachable_fallback`, `timeout` and `ccr_retrieval` (default true). The API base is `api_base`, else the secret `HEADROOM_API_BASE`, else empty, with every trailing `/` removed; an empty result is the typed error `MissingApiBase` with the text "Headroom guardrail requires an API base URL. Set `api_base` in the guardrail config or HEADROOM_API_BASE env var." The key is `api_key`, else the secret `HEADROOM_API_KEY`, else none; an empty string counts as unset for both. `unreachable_fallback` is `FailOpen` only for the exact text `fail_open`, otherwise `FailClosed`. Secrets come in through a small injected trait so the unit tests need no environment. `resolve_timeout(Option<f64>) -> CompressTimeout { total, connect }`: none gives 60 seconds; zero, negative, NaN and infinite values are rejected with a warning "Headroom: ignoring unusable timeout {value}, using 60 seconds" and also give 60; otherwise the value is used; `connect` is the smaller of `total` and 5 seconds. `request_headers()` returns `Content-Type: application/json` and, when a key is set, `Authorization: Bearer <key>`. `HeadroomConfig` is the typed form of LiteLLM's `HeadroomGuardrailConfigModel`: `api_base`, `api_key`, `model` (all optional strings), `unreachable_fallback` (`fail_closed` default, or `fail_open`; any other value is a config error naming the field), `ccr_retrieval` (default true), UI name "Headroom". Per B3774, `update_in_memory_litellm_params` calls `resolve_timeout` again; this task only provides it.
