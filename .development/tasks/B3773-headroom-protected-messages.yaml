deviations:
  - what: fail_open logs at error level instead of Python's critical level.
    why: Rust's tracing has no critical level, and the message text is kept as LiteLLM writes it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/headroom/headroom.py#L577-L583
  - what: A `restore_protected_messages` call with fewer compressed rows than unprotected rows returns a typed error.
    why: Python raises KeyError there, which would be a 500; B3774 already rejects a changed row count before this call, so the error only guards against a caller bug.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/headroom/headroom.py#L277-L281
  - what: A config `unreachable_fallback` other than `fail_closed` or `fail_open` is a config error naming the field.
    why: LiteLLM's pydantic model rejects it the same way; the constructor's quiet fall back to fail_closed only applies to a caller that bypasses the model.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/headroom.py#L27-L34
out_of_scope:
  - "B3774 owns the HTTP call, `_call_compress`, `_should_bypass`, `_prune_expired_hashes`, `_resolve_call_id`, `_build_headroom_retrieve_tool`, `has_headroom_retrieve_tool`, `update_in_memory_litellm_params`, the issued hash map and `apply_guardrail`."
  - "B3775 owns `_call_retrieve`, the agentic loop hooks, the follow-up message builders and `_extract_headroom_tool_calls`."
  - "B3663 owns `content_to_text`, `is_all_text_parts` and `merge_rewritten_text_parts` in crates/betterlite-guardrails/src/content_text.rs; B3540 owns `get_protected_indices`; B224 owns `group_tool_exchanges`."
  - "B3662 owns `GuardrailEventHooks` and the `LitellmParams` fields (`api_base`, `api_key`, `model`, `unreachable_fallback`, `timeout`, `ccr_retrieval`) the constructor arguments come from."
  - "The registry entry `initialize_guardrail`, `guardrail_initializer_registry` and `guardrail_class_registry` in headroom/__init__.py belong to B107 (the umbrella that wires the guardrail in)."
  - "B3775 owns `async_pre_call_deployment_hook` (turning a stream into a non-stream call when the retrieve tool is present). `get_config_model` is covered by `HeadroomConfig` here."
  - "The CustomGuardrail base class and its logging helpers have no task file; this task only holds plain settings and does not subclass anything."
pitfalls:
  - The Anthropic branch accepts an empty-string `tool_use` id (`is not None`), but the OpenAI branch needs a non-empty `id`; do not unify the two checks.
  - OpenAI ids are only read from rows whose `role` is `assistant`, while Anthropic `tool_use` blocks are read from any row with a list `content`.
  - "`retrieval_result_indices` unites the extra ids with ids from the OpenAI branch of the same messages only, so an Anthropic `tool_use` id helps only when it arrives through `extra_ids`."
  - Assistant rows are added to the protected set after the tool exchange expansion and do not expand it, so a tool result that an assistant row asked for stays compressible.
  - The 404 hint is added only for status 404.
  - "`read_ccr_hashes` lowercases before matching and stores the lowercased text, so `ABCDEF012345` is kept as `abcdef012345`, and an 11 or 25 character hash is dropped."
  - "`restore_content_shapes` compares the returned string with `content_to_text(original parts)` (parts joined with a blank line) to decide a row is untouched, not with any single part."
  - The connect timeout is `min(total, 5)`, so a configured timeout of 2 seconds gives 2 for both, and one of 90 gives 90 and 5.
  - An empty `api_base` or `api_key` argument counts as unset and falls to the secret, the same as a missing one.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
