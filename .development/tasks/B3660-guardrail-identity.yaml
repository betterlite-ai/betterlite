  why: GuardrailConfigModel base class with optional_params and abstract ui_friendly_name method.
dod:
- text: >-
    SupportedGuardrailIntegrations enum declares all 60 provider names with LiteLLM wire values.
    Unknown provider name strings fail the type check; mismatched wire values fail round-trip
    serialization. Providers aporia, bedrock, presidio, custom_code and generic_guardrail_api
    appear in the type.
  proof: [type-check, enum-round-trip-tests]
- text: >-
    PiiEntityType declares all 79 entity types and PiiEntityCategory lists all 20 categories
    with correct groupings. PII_ENTITY_CATEGORIES_MAP maps each category to exactly its type
    tuple; missing or extra types break lookups. General has 11 types, Germany has 13, USA has 7.
  proof: [type-check, pii-map-tests]
- text: >-
    PresidioConfigModel, LassoGuardrailConfigModel and DeepKeepGuardrailConfigModel preserve
    all field names, types, defaults and Field descriptions from LiteLLM. Setting unknown field
    keys fails validation; null defaults and optional field annotations round-trip exactly.
  proof: [type-check, config-field-tests]
- text: >-
    GuardrailItem.__init__ accepts callbacks list, guardrail_name, default_on (defaulting False),
    logging_only, enabled_roles (defaulting to [system, assistant, user]) and callback_args dict
    (defaulting to {}). Callers omitting enabled_roles receive the default; callers with empty
    roles get empty roles, not the default.
  proof: [type-check, default-value-tests]
- text: >-
    GuardrailBaseInitKwargs TypedDict fields are all marked ReadOnly; a runtime mutation attempt
    is caught by the type checker. All 13 fields map to CustomGuardrail.__init__ parameters and
    accept the documented types (bool, str, int, None as shown).
  proof: [type-check, readonly-field-tests]
- text: >-
    GuardrailParamUITypes enum and GuardrailConfigModel base class with optional_params field
    and abstract ui_friendly_name method are present. Concrete models inherit the base pattern
    and override ui_friendly_name as defined in B3661+ tasks.
  proof: [type-check]
checks:
  optional: []
  commands:
  - id: type-check
    why: Provider vocabularies and PII/Presidio types are missing or misdeclared
    run: cargo clippy --locked -p betterlite-config --all-targets -- -D warnings
  - id: enum-round-trip-tests
    why: Wire-value strings do not round-trip through serde or provider count is incomplete
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_identity::guardrail_enums::/)'
  - id: pii-map-tests
    why: PII_ENTITY_CATEGORIES_MAP omits types, has wrong category groupings or type count is incorrect
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_identity::pii_entity_categories::/)'
  - id: config-field-tests
    why: Config model field names do not match LiteLLM or defaults do not deserialize correctly
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_identity::guardrail_config_models::/)'
  - id: default-value-tests
    why: GuardrailItem defaults for enabled_roles or callback_args do not match expected behavior
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_identity::guardrail_item_defaults::/)'
  - id: readonly-field-tests
    why: GuardrailBaseInitKwargs fields are not ReadOnly or field count is incomplete
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_identity::guardrail_base_init_kwargs::/)'
oracle_cases: []
deviations: []
out_of_scope:
- B3661 owns BedrockChecksConfigModel, BedrockChecksContentFilterModel, BedrockChecksPromptAttackModel, BedrockChecksSensitiveInformationModel, BedrockGuardrailConfigModel, BedrockGuardrailStreamingParams and LakeraV2GuardrailConfigModel configuration and validation.
- B3661 owns PillarGuardrailConfigModel, NomaGuardrailConfigModel, ZscalerGuardrailConfigModel, JavalinGuardrailConfigModel and other provider-specific option records beyond Lasso and DeepKeep.
pitfalls:
- PII_ENTITY_CATEGORIES_MAP values are tuples of PiiEntityType, not lists; iterating expects immutable sequences.
- enabled_roles defaults to [Role.SYSTEM, Role.ASSISTANT, Role.USER] only when omitted from __init__, never when set to None or [].
- PresidioConfigModel.presidio_language defaults to "en", not None; callers expecting optional must check explicitly.
- 'Field names on Presidio/Lasso/DeepKeep models carry provider prefixes: presidio_analyzer_api_base, not analyzer_api_base; lasso_user_id, not user_id; deepkeep_firewall_id, not firewall_id.'
- LITELLM_* environment variables are documented in Field descriptions but not implemented as fallbacks here; B3680+ tasks own initializer defaults.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
