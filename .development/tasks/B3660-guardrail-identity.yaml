- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/guardrails.py#L155-L161
  why: Role enum and default_roles list; preserve defaults and callback_args init.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/guardrails.py#L182-L198
  why: GuardrailItem __init__ signature and defaults.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/guardrails.py#L212-L427
  why: PiiAction, PiiEntityCategory (20 members), PiiEntityType (79 members) enums and PII_ENTITY_CATEGORIES_MAP constant.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/guardrails.py#L435-L512
  why: GuardrailParamUITypes enum, PresidioPresidioConfigModelUserInterface and PresidioConfigModel with all fields and defaults.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/guardrails.py#L734-L751
