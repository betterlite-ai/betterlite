id: B3660
title: Guardrail identity and PII configuration vocabulary
description: >-
  Build the provider-name and PII vocabularies, Presidio UI records and initializer
  contract. Preserve the exact category/action choices exposed by configuration and
  the UI.

  Implement in betterlite-config::types::guardrails:

  - SupportedGuardrailIntegrations enum with all 60 provider names and their LiteLLM
    wire values (aporia, bedrock, presidio, custom_code, generic_guardrail_api, etc).

  - Role enum (system, assistant, user) and default_roles list.

  - GuardrailItem with callbacks list, default_on, logging_only, guardrail_name,
    enabled_roles (defaulting to all three), callback_args dict and its __init__ signature.

  - PiiAction enum (BLOCK, MASK) and PiiEntityCategory enum (20 categories from General
    through South Africa).

  - PiiEntityType enum with 79 entity types across all categories.

  - PII_ENTITY_CATEGORIES_MAP constant keying each category to its entity type tuple.

  - GuardrailParamUITypes enum (bool, str, multiselect, percentage).

  - PresidioPresidioConfigModelUserInterface with presidio_analyzer_api_base, presidio_anonymizer_api_base,
    presidio_filter_scope (input/output/both), output_parse_pii bool with ui_type annotation,
    presidio_language (default "en"), presidio_run_on (input/output/both).

  - PresidioConfigModel extending the UI model with pii_entities_config dict, score
    thresholds dict, deny_list, ad_hoc_recognizers path, chunk_size_bytes and
    mock_redacted_text.

  - LassoGuardrailConfigModel with lasso_user_id, lasso_conversation_id and mask bool.

  - DeepKeepGuardrailConfigModel with deepkeep_firewall_id and env var fallback documentation.

  - GuardrailBaseInitKwargs TypedDict for the scalar keyword payload guardrails forward
    to CustomGuardrail.__init__, with all 13 keyword fields marked ReadOnly.

  - GuardrailConfigModel base class with optional_params field and abstract ui_friendly_name
    method.

  Do not implement BedrockChecksConfigModel, BedrockGuardrailConfigModel, or other provider
  config models owned by B3661; they are marked out_of_scope below. Do not add a parser
  or any transformation logic; preserve types exactly as they appear, with every docstring,
  Field description and default value from LiteLLM.
scope:
  paths:
  - crates/betterlite-config/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - crates/betterlite-config/src/sections/guardrail_identity.rs
  - crates/betterlite-config/src/sections/guardrail_identity/**
  lint_tables: false
