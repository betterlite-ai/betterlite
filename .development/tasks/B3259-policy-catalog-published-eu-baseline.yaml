id: B3259
title: Published EU AI Act and baseline PII catalog records
description: >-
  Retain the published EU AI Act and baseline PII records as remote-response fixtures. Keep them distinct from the backup versions in B3258, which add example_sentences.
  LiteLLM's published root catalog `policy_templates.json` serves as the remote-response fixture for fetch requests by B3253. This task owns the complete baseline-pii-protection and eu-ai-act-article5 guardrail template records with all guardrailDefinitions, preserving language-specific category paths, guardrail ordering and source policy metadata.
  Write each record to its own fragment file: `crates/betterlite-policy/assets/templates/published/baseline-pii-protection.json` and `crates/betterlite-policy/assets/templates/published/eu-ai-act-article5.json`. Each holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  Baseline-pii-protection is a low-complexity credentials and PII baseline with three guardrails (au-pii-tax-identifiers, credentials-api-keys, financial-pii) and no example sentences. The EU AI Act Article 5 record is high-complexity with ten guardrails in English and French (five pairs covering subliminal manipulation, vulnerability exploitation, social scoring, emotion recognition, and biometric profiling), referencing content filter category files with language-specific detection.
  Record the field order and literal values at the pinned release. Both records include id, title, description, icon, iconColor, iconBg, guardrails array, complexity, guardrailDefinitions array with litellm_params, templateData with policy_name and guardrails_add/guardrails_remove, tags, and estimated_latency_ms (1). No example_sentences field.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/published/baseline-pii-protection.json
    - crates/betterlite-policy/assets/templates/published/eu-ai-act-article5.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L382-L520
    why: The complete baseline-pii-protection record with three guardrailDefinitions (au-pii-tax-identifiers, credentials-api-keys, financial-pii).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L1060-L1294
    why: The complete eu-ai-act-article5 record with ten guardrailDefinitions (five English, five French variants) covering Article 5 prohibited practices.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L607-L664
    why: The get_policy_templates route that fetches the root catalog and uses policy_templates.json as the published remote-response fixture.
dod:
  - text: The published baseline-pii-protection fragment holds the complete record including all three guardrail definitions and no example_sentences.
    proof: [catalog-data]
  - text: The published eu-ai-act-article5 fragment holds the complete record including all ten guardrail definitions (five English, five French) and no example_sentences.
    proof: [catalog-data]
  - text: Both fragments are valid JSON and each holds exactly one object.
    proof: [catalog-data]
  - text: >-
      The baseline-pii-protection record's keys are, in this order, id, title, description, icon, iconColor, iconBg, guardrails array,
      complexity, guardrailDefinitions array with three entries, templateData,
      tags, and estimated_latency_ms, with correct literal values, and no example_sentences.
    proof: [catalog-data]
  - text: >-
      The eu-ai-act-article5 record's keys are, in this order, id, title, description, icon, iconColor, iconBg, guardrails array with
      ten entries, complexity, guardrailDefinitions array with ten entries,
      templateData, tags, and estimated_latency_ms, with correct literal values, and no example_sentences.
    proof: [catalog-data]
  - text: >-
      All baseline literal values verified: id "baseline-pii-protection", title "Baseline PII Protection",
      icon "ShieldCheckIcon", iconColor "text-blue-500", iconBg "bg-blue-50", complexity "Low",
      three guardrails [au-pii-tax-identifiers, credentials-api-keys, financial-pii],
      tags [PII Protection], estimated_latency_ms 1, policy_name "baseline-pii-protection".
    proof: [catalog-data]
  - text: >-
      EU AI Act record literal values verified: id "eu-ai-act-article5", title contains "EU AI Act Article 5",
      icon "ShieldExclamationIcon", iconColor "text-red-500", iconBg "bg-red-50", complexity "High",
      ten guardrails with English and French variants (manipulation, vulnerability, social-scoring,
      emotion-recognition, biometric-profiling), tags [Regulatory, EU], estimated_latency_ms 1,
      guardrailDefinitions with matching category names and category_file paths for each guardrail.
    proof: [catalog-data]
checks:
  optional: []
  commands:
    - id: catalog-data
      why: a fragment is missing, is not one valid JSON object, or the baseline-pii-protection or eu-ai-act-article5 record differs from the pinned LiteLLM record in keys, key order or literal values
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["au-pii-tax-identifiers", "credentials-api-keys", "financial-pii"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "baseline-pii-protection"
          and .title == "Baseline PII Protection"
          and .icon == "ShieldCheckIcon"
          and .iconColor == "text-blue-500"
          and .iconBg == "bg-blue-50"
          and .guardrails == $names
          and .complexity == "Low"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[]; .litellm_params | has("patterns"))
          and .templateData.policy_name == "baseline-pii-protection"
          and .tags == ["PII Protection"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/baseline-pii-protection.json \
        && jq -e -s 'length == 1 and (.[0]
          | ["eu-ai-act-art5-manipulation", "eu-ai-act-art5-vulnerability", "eu-ai-act-art5-social-scoring", "eu-ai-act-art5-emotion-recognition", "eu-ai-act-art5-biometric-profiling", "eu-ai-act-art5-manipulation-fr", "eu-ai-act-art5-vulnerability-fr", "eu-ai-act-art5-social-scoring-fr", "eu-ai-act-art5-emotion-recognition-fr", "eu-ai-act-art5-biometric-profiling-fr"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "eu-ai-act-article5"
          and (.title | contains("EU AI Act Article 5"))
          and .icon == "ShieldExclamationIcon"
          and .iconColor == "text-red-500"
          and .iconBg == "bg-red-50"
          and .guardrails == $names
          and .complexity == "High"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[]; (.guardrail_name | gsub("-"; "_")) as $category | [.litellm_params.categories[] | [.category, .category_file]] == [[$category, "litellm/proxy/guardrails/content_filter_data/policy_templates/\($category).yaml"]])
          and .templateData.policy_name == "eu-ai-act-article5"
          and .tags == ["Regulatory", "EU"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/eu-ai-act-article5.json
oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or uses this catalog file. The published root catalog is fetched by B3253 which depends on this task. The route that fetches the root (get_policy_templates) is covered by B3253. The backup fallback is covered by B3252.
  - Guardrail implementation behavior and detection patterns. The published catalog records only establish the schema, metadata and category file references.
  - Content filter data files referenced by category_file paths. The published catalog defines file references but does not package the files themselves, which are managed as separate policy assets.
  - Other policy templates in the root catalog. Those are owned by other catalog tasks.
pitfalls:
  - Both fragments must be valid JSON holding one object each. Syntax errors prevent remote fetches by B3253; malformed JSON does not fall back to the backup.
  - The published baseline-pii-protection record requires exactly three guardrailDefinitions in their original order; the published fixture must not reorder, duplicate, or omit any.
  - The published eu-ai-act-article5 record must include exactly ten guardrailDefinitions (five English, five French variants). All must reference category_file paths with language-specific files; do not drop any guardrail or category reference.
  - Unlike the backup catalog, the published root catalog does not include example_sentences field. Preserve their absence; do not add them to match the backup.
  - The published catalog preserves the eu-ai-act-article5 record with category-based detection (category_file references) while the baseline uses pattern arrays; respect both methods in the published root catalog without alteration.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 0
