deviations:
  - what: extract_model_from_target_model_names applies empty-string filtering only to comma-separated string input, not to list input; list input returns target_model_names[0] unfiltered.
    why: This replicates LiteLLM's asymmetric behavior where string input is split and filtered but list input is accessed directly by index, so ["", "foo"] returns "" not "foo".
out_of_scope:
  - "litellm/types/videos/main.py:47-67 (VideoResponse): no caller at the pin. Test code constructs it once; actual generation returns VideoObject and list returns a provider page."
  - "litellm/types/videos/main.py:89-97 (VideoCreateRequestParams): no caller at the pin in production code."
  - "litellm/types/videos/main.py:132-137 (VideoEditRequestParams): no caller at the pin in production code."
  - "litellm/types/videos/main.py:139-145 (VideoExtensionRequestParams): no caller at the pin in production code."
  - The video operation contract and provider selection, owned by B3331 and B3332.
  - HTTP transport and route registration, owned by B3333–B3337 and B3343–B3345.
  - OpenAI video transformations and validation, owned by B525 and B526.
  - Character and video ID encoding implementation, owned by B672.
  - Response transformations beyond encoding character IDs.
pitfalls:
  - "VideoObject fields id, object, status are required; created_at, completed_at, expires_at, error, progress, remixed_from_video_id, seconds, size, model, usage are optional (None defaults). _hidden_params defaults to empty dict."
  - "extract_model_from_target_model_names has asymmetric behavior: string input filters empty after strip(), list input returns index 0 unfiltered; a list like ['', 'foo'] returns '' not 'foo'."
  - "video_reference_to_id uses JSON parsing and silently falls back on parse error; do not log the error or re-raise it."
  - "get_custom_provider_from_data accepts extra_body as a string and decodes it; catch all exceptions during decode and treat them as None."
  - "encode_character_id_in_response handles both dict and object responses; check type and use dict.get/setitem or getattr/setattr accordingly."
  - "VideoCreateOptionalRequestParams uses TypedDict with total=False; do not create a Rust struct for it—it is used only as a reference type in signatures."
  - "DecodedVideoId may have None values for custom_llm_provider and model_id; use Option types and preserve None through JSON serialization."
  - "The dictionary-style access methods (__contains__, get, __getitem__) on VideoObject and CharacterObject map to field access; implement as methods that read fields directly."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
