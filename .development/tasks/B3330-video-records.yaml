id: B3330
title: Video records and proxy input helpers
description: >-
  Build video request projection types and proxy input helpers. Implement VideoObject with fields id (str), object (Literal["video"]),
  status (str), created_at (int | None), completed_at (int | None), expires_at (int | None), error (dict | None), progress (int | None),
  remixed_from_video_id (str | None), seconds (str | None), size (str | None), model (str | None), usage (dict | None), _hidden_params (dict);
  the type includes __contains__, get, __getitem__ and json convenience methods matching Python dict access. Implement VideoCreateOptionalRequestParams
  as a TypedDict with fields input_reference, image, parameters, model, resolution (ReadOnly), seconds, size, characters, user, extra_headers, extra_body.
  Implement CharacterObject with fields id (str), object (Literal["character"]), created_at (int), name (str), _hidden_params (dict), and the same
  dict-like methods. Implement DecodedVideoId as a TypedDict with custom_llm_provider, model_id, video_id.

  Build four proxy helpers in the same module. extract_model_from_target_model_names accepts a string (comma-separated list) or a list and returns
  the first non-empty element: for string input, splits on comma, strips whitespace, filters empty entries, returns first or None; for list input,
  returns target_model_names[0] unfiltered (list ["", "foo"] returns "" not "foo"); returns None for non-string/non-list inputs or empty results.
  video_reference_to_id accepts any value and returns a string: if dict, extract the "id" key; if string, try JSON-decoding as dict and extract "id",
  falling back to the string itself; otherwise return empty string. Preserve the JSON decode exception fallback without logging.
  get_custom_provider_from_data searches the request data dict for custom_llm_provider, then searches extra_body (after JSON-decoding if string),
  returning the first truthy value or None. encode_character_id_in_response calls B672's encode_character_id_with_provider on the response's id field
  when present, handling both dict and object response types. All four match LiteLLM's behavior exactly on the inputs described; no silent drops or type
  coercions beyond what LiteLLM performs.

  Add a cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/video_reference_to_id.rs that calls video_reference_to_id and get_custom_provider_from_data
  with arbitrary bytes. Seed the corpus with the cases from the oracle. Add a test replays_the_video_reference_to_id_corpus that replays every file in the
  corpus without panicking. Add oracle helper cases that exercise the two JSON-parsing helpers independently with valid, malformed and boundary inputs.
