dod:
  - text: VideoObject has fields id, object, status, created_at, completed_at, expires_at, error, progress, remixed_from_video_id, seconds, size, model, usage, _hidden_params with correct types and optionality.
    proof: [video-object-fields]
  - text: VideoObject implements __contains__, get, __getitem__, json convenience methods matching Python dict access.
    proof: [video-object-methods]
  - text: VideoCreateOptionalRequestParams contains all required TypedDict fields with correct types and ReadOnly markers.
    proof: [optional-params-compile]
  - text: CharacterObject has fields id, object, created_at, name, _hidden_params with dict-like access methods.
    proof: [character-object-fields]
  - text: DecodedVideoId is a typed dict with custom_llm_provider, model_id, video_id fields.
    proof: [decoded-video-id-compile]
  - text: "extract_model_from_target_model_names: string input splits on comma, filters empty (stripped), returns first; list input returns index 0 unfiltered; None/other type input returns None; empty input returns None."
    proof: [extract-model-cases]
  - text: video_reference_to_id handles dict with id key, parses JSON strings to extract id, returns plain string unchanged, returns empty string for non-dict/non-string inputs, with no exception logging.
    proof: [video-reference-cases]
  - text: get_custom_provider_from_data reads custom_llm_provider from data, or from parsed extra_body JSON if extra_body is string, or None if neither.
    proof: [custom-provider-cases]
  - text: encode_character_id_in_response wraps response id (dict or object) using B672's encode_character_id_with_provider with provider and model.
    proof: [encode-character-cases]
  - text: video_reference_to_id and get_custom_provider_from_data have a cargo-fuzz target at crates/betterlite-core/fuzz/fuzz_targets/video_reference_to_id.rs.
    proof: [video-fuzz-corpus]
  - text: replays_the_video_reference_to_id_corpus replays every corpus file without panicking.
    proof: [video-fuzz-corpus]
checks:
  optional: [mutants]
  commands:
    - id: video-object-fields
      why: VideoObject field set is wrong or incomplete, missing seconds or having duration
      run: grep -E '^\s+seconds:' crates/betterlite-core/src/api/video_records.rs && grep -E '^\s+model:' crates/betterlite-core/src/api/video_records.rs && grep -E '^\s+usage:' crates/betterlite-core/src/api/video_records.rs && grep -E '^\s+remixed_from_video_id:' crates/betterlite-core/src/api/video_records.rs && ! grep -E '^\s+duration:' crates/betterlite-core/src/api/video_records.rs
    - id: video-object-methods
      why: VideoObject dict-like methods do not exist or do not match LiteLLM behavior
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_records::(contains|get|getitem|json)/)'
    - id: optional-params-compile
      why: VideoCreateOptionalRequestParams does not compile or fields are wrong
      run: cargo build --locked -p betterlite-core
    - id: character-object-fields
      why: CharacterObject field set is wrong or methods are missing
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_records::character_/)'
    - id: decoded-video-id-compile
      why: DecodedVideoId does not compile or has wrong fields
      run: cargo build --locked -p betterlite-core
    - id: extract-model-cases
      why: "extract_model_from_target_model_names behavior for strings, lists, None, empty and list-with-empty-first is wrong"
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_records::extract_model_/)'
    - id: video-reference-cases
      why: video_reference_to_id does not handle dict, JSON string, plain string, non-dict/non-string inputs, or malformed JSON correctly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_records::video_reference_/)'
    - id: custom-provider-cases
      why: get_custom_provider_from_data does not read from data, extra_body dict, or parsed extra_body JSON correctly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_records::custom_provider_/)'
    - id: encode-character-cases
      why: encode_character_id_in_response does not encode character IDs for dict or object response types
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_records::encode_character_/)'
    - id: video-fuzz-corpus
      why: video reference fuzz target or corpus is missing, or replaying the corpus fails
      run: test -f crates/betterlite-core/fuzz/fuzz_targets/video_reference_to_id.rs && test -n "$(find crates/betterlite-core/fuzz/corpus/video_reference_to_id -type f 2>/dev/null)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(replays_the_video_reference_to_id_corpus)'
