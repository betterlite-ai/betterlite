id: B10118
title: Shared UI session token encoder
description: >-
  The dashboard's `token` cookie is one HS256 JWT, and both UI login paths mint it: B788's password login and B1624's SSO browser session. LiteLLM signs it in one place, encode_ui_session_jwt in login_utils.py, so the cookie's lifetime can't drift between the paths. This task builds that encoder, its exp stamp, the one setting it reads, and get_disabled_non_admin_personal_key_creation, the flag both paths put into the token. B788 and B1624 call these and build none of them. Nothing here checks a password, mints a virtual key, writes a session row or talks to an SSO provider.


  Layout. Module ui_session_token in betterlite-server, crates/betterlite-server/src/ui_session_token.rs, with submodules as you need and a tests.rs beside each. The file is an empty stub lib.rs already declares; it sits outside password_login and sso_browser_session on purpose, so the three tasks never share files. The setting lives in config section ui_session_token, crates/betterlite-config/src/sections/ui_session_token.rs with its tests in sections/ui_session_token/tests.rs; the stub, its `pub mod` line and its sections! entry are on main. betterlite-server already depends on jsonwebtoken, chrono, jiff, betterlite-core, betterlite-auth and betterlite-config, so no Cargo.toml changes.


  The setting. litellm/constants.py reads LITELLM_UI_SESSION_DURATION once at import with `os.getenv("LITELLM_UI_SESSION_DURATION", "24h")`. The section's Settings has one field, `duration: String`: "24h" when the variable is unset, the variable's text otherwise. A variable set to the empty string stays "", because os.getenv returns it; don't drop empty values the way public_discovery's environment_or does. Keep the text raw and don't parse it at load: LiteLLM parses it only when a token is minted, so a bad value fails that login and not startup. There is no config file key. Other crates read it as config.sections.ui_session_token. B788 and B1624 also pass this same duration to B893's key generation for the dashboard key, so neither of them reads the variable again.


  The exp stamp. `ui_session_exp_timestamp(settings: &Settings, now: DateTime<Utc>, database: &TimeZoneDatabase) -> Result<i64, UiSessionTokenError>` is LiteLLM's _ui_session_exp_timestamp. Call B199's `betterlite_core::duration::seconds::duration_in_seconds(&settings.duration, now, None, database)`, take `.seconds` and drop the warnings, as `key_policy_fields::shifted_by` does, then add them to now and take whole Unix seconds. Python computes `int((now + timedelta(seconds=ttl)).timestamp())`, so the sub-second part is cut, never rounded. A parse failure is `UiSessionTokenError::Duration` holding B199's DurationError, and an overflow is its own variant. Don't write a second duration parser: the word aliases ("daily", "weekly") and the "mo" unit come from B199.


  The encoder. `encode_ui_session_jwt(token: &ReturnedUiTokenObject, master_key: &SecretString, settings: &Settings, now: DateTime<Utc>, database: &TimeZoneDatabase) -> Result<String, UiSessionTokenError>`. ReturnedUiTokenObject is B1608's type in `betterlite_auth::sso_types::identity`; reuse it and define no second token struct. The claims are every field of that object, in its serde order and names (the key in clear through its ExposedSecret serializer, disabled_non_admin_personal_key_creation under that name), followed by exp. A claims struct with `#[serde(flatten)]` over a reference to the object plus `exp: i64` gives exactly that. Compute exp first, then refuse an empty master key with `UiSessionTokenError::EmptyMasterKey`, then sign with `Header::new(Algorithm::HS256)` and `EncodingKey::from_secret` over the key's bytes. LiteLLM builds the claims dict, and with it the exp, before PyJWT prepares the key, and PyJWT 2.15.1 refuses an empty HMAC key with InvalidKeyError "HMAC key must not be empty.", while jsonwebtoken signs with one, so the check must be explicit. It is reachable: B1624 passes LiteLLM's `master_key or ""` when no master key is set. No error text and no log line holds the master key or the token's key.


  The personal-key flag. `disabled_non_admin_personal_key_creation(key_generation: &KeyGeneration) -> bool` reads B771's `betterlite_config::sections::key_access::KeyGeneration`, which callers take from config.sections.key_access.key_generation; don't parse key_generation_settings a second time. LiteLLM returns false when litellm.key_generation_settings is None, then takes `personal_key_generation or {}` and `allowed_user_roles or []` and returns whether the literal "proxy_admin" is in that list. On the typed value: false when `configured` is false, false when `personal` is None or its allowed_user_roles is None or empty, otherwise true exactly when one entry equals "proxy_admin", case-sensitive and in any position, also next to other roles. B788's create_ui_token_object and B1624's SSO session call it, and so does B8387's onboarding token.


  Tests. ui_session_token::tests in betterlite-server, with a fixed now and a test key, decode each token with jsonwebtoken (HS256 only, exp validation off) and check: every field and exp for an sso and a username_password object, a null user_email and a non-ASCII email; header alg HS256; exp for now = 2026-01-01T12:00:00.999999Z with "30s" (12:00:30, not 12:00:31), "24h", "daily" and "2w"; "", "24" (no unit) and "abc" failing as Duration at encode time; an empty key failing as EmptyMasterKey; an empty key with a bad duration failing as Duration; and the Display and Debug text of each error carrying neither key. The flag table: unconfigured, configured without personal_key_generation, personal without allowed_user_roles, an empty list, ["proxy_admin"], ["internal_user", "proxy_admin"] and ["PROXY_ADMIN"]. sections::ui_session_token::tests loads config through B002's Loader::load with an injected environment: unset gives "24h", "7d" stays "7d", "" stays "", and "nonsense" loads and fails only when the encoder uses it.


  Oracle. Helper cases on the b10118 operation in the server group. The input is a tagged union with two variants. `encode` carries the token object, the master key, the duration text and now as RFC 3339 with microseconds; Python patches `litellm.proxy.auth.login_utils.datetime` with a datetime subclass whose now() returns that instant (b4803.py does the same) and `login_utils.LITELLM_UI_SESSION_DURATION` with the duration, calls encode_ui_session_jwt, and answers `jwt.get_unverified_header(token)` and `jwt.decode(token, key, algorithms=["HS256"], options={"verify_exp": False})`, or the error class name (ValueError, InvalidKeyError). `personal_key_flag` carries key_generation_settings as written or absent; Python sets litellm.key_generation_settings and calls get_disabled_non_admin_personal_key_creation(). The Rust side runs the production functions and decodes its own token the same way, mapping Duration to ValueError and EmptyMasterKey to InvalidKeyError. Add helper_case seeds named ui-session-token-* for B171's existing decoder. No route reaches this code yet: B899's login routes and B063's SSO routes add the HTTP cases.
scope:
  paths:
    - crates/betterlite-server/src/ui_session_token.rs
    - crates/betterlite-server/src/ui_session_token/**
    - crates/betterlite-config/src/sections/ui_session_token.rs
    - crates/betterlite-config/src/sections/ui_session_token/**
    - tools/oracle/cases/helpers/ui-session-token/**
    - tools/oracle/fuzz/corpus/helper_case/ui-session-token-*
    - tools/oracle/helpers/b10118.py
    - tools/oracle/helpers/b10118/**
    - tools/oracle/src/helpers/server/b10118.rs
    - tools/oracle/src/helpers/server/b10118/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_utils.py#L478-L485
    why: Owned. _ui_session_exp_timestamp, now plus the parsed duration cut to whole seconds.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_utils.py#L488-L498
    why: Owned. encode_ui_session_jwt, the token object's claims with exp added, signed HS256 with the master key.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/ui_sso.py#L1744-L1750
    why: Owned. get_disabled_non_admin_personal_key_creation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1761-L1761
    why: LITELLM_UI_SESSION_DURATION, read at import with the 24h default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/ui_sso.py#L6-L20
