dod:
  - text: encode_ui_session_jwt signs HS256 with the master key, and its claims are every ReturnedUiTokenObject field with the key in clear plus exp, equal to LiteLLM's decoded header and claims.
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: exp is now's whole Unix seconds plus B199's seconds for the duration, with the fraction cut, and an empty or invalid duration fails at encode time, before the key check.
    proof: [behavior-tests, oracle]
  - text: An empty master key fails as EmptyMasterKey where LiteLLM raises InvalidKeyError, and no error text carries the master key or the token key.
    proof: [behavior-tests, oracle]
  - text: The personal-key flag is false without key_generation_settings, personal_key_generation or allowed_user_roles, and true exactly when the literal proxy_admin is in the list, next to other roles too.
    proof: [behavior-tests, oracle, helper-python]
  - text: LITELLM_UI_SESSION_DURATION loads through B002's loader as raw text, 24h when unset and empty when set empty.
    proof: [config-tests]
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The encoder, its exp stamp, its errors or the personal-key flag are missing or differ from LiteLLM.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^ui_session_token::/)'
    - id: config-tests
      why: The loader does not read LITELLM_UI_SESSION_DURATION with its 24h default and keeps no empty value.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::ui_session_token::/)'
    - id: helper-python
      why: The b10118 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10118.py tools/oracle/helpers/b10118)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10118 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/ui-session-token-*")" &&
        grep -lE 'b10118"?:' tools/oracle/fuzz/corpus/helper_case/ui-session-token-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-server --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/ui-session-token/cookie-claims-and-header.yaml
  - tools/oracle/cases/helpers/ui-session-token/exp-cuts-sub-second.yaml
  - tools/oracle/cases/helpers/ui-session-token/bad-duration-fails-at-use.yaml
  - tools/oracle/cases/helpers/ui-session-token/empty-master-key.yaml
  - tools/oracle/cases/helpers/ui-session-token/personal-key-flag.yaml
deviations:
  - what: A master key that PyJWT 2.15.1 refuses for its shape (PEM or SSH key text, DER key or certificate bytes, JSON holding a kty member) still signs the cookie; only the empty key is refused.
    why: PyJWT guards against algorithm confusion when a token header picks the algorithm. This encoder always signs HS256 with the operator's master key, and porting PyJWT's key sniffing for keys no LiteLLM setup uses adds code with no reader.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_utils.py#L488-L498
out_of_scope:
  - "authenticate_user, _sign_in, LoginResult, create_ui_token_object and the other login_utils.py functions: B788, which calls the encoder and the flag from here and passes this section's duration to key generation. is_env_credential_login_enabled: B10067."
  - "The SSO callback's token object, redirect and cookie: B1624, which calls the same two functions. The other ui_sso.py functions stay with B063 and the parts its inventory names."
  - "The onboarding invitation token: B8387. It puts the flag into its token object but signs it with its own jwt.encode and no exp."
  - "ReturnedUITokenObject: B1608. Duration parsing and month math: B199. Parsing key_generation_settings: B771's key_access section."
  - "The experimental UI login token, an encrypted blob with a fixed ten-minute expiry that is not a JWT: B1223."
pitfalls:
  - The `_ui_session_exp_timestamp()` call sits inside the claims dict that is built before `jwt.encode`, so a bad duration with an empty master key fails as ValueError, not InvalidKeyError.
  - '`int(...timestamp())` cuts the fraction, so now = 12:00:00.999999 with "30s" gives an exp of 12:00:30; take chrono''s flooring timestamp() and never round the fraction.'
  - jsonwebtoken writes the header as {"typ":"JWT","alg":"HS256"} where PyJWT sorts it to {"alg":"HS256","typ":"JWT"}, and json.dumps escapes non-ASCII where serde_json does not, so the helper answers carry decoded header and claims, never the token text.
  - login_utils imports LITELLM_UI_SESSION_DURATION and datetime by name, so the Python helper patches them on login_utils; patching litellm.constants or the datetime module changes nothing.
  - The "mo" unit reads Python's local clock through time.time() inside duration_parser, which the patched login_utils.datetime does not reach, so the oracle cases use s, m, h, d, w and the word aliases only.
  - The helper stub tools/oracle/src/helpers/server/b10118.rs and its registry lines are on main; replace the stub Op with a typed impl Helper and leave the server group's lib.rs and operations.txt alone.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
