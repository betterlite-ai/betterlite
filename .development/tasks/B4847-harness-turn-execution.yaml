dod:
  - text: begin_turn failure (TurnRunning) and ensure_ready run before any sandbox snapshot, and end_turn runs after a finished turn and after an error, so the next turn can start. A stream dropped before Done also leaves the session not busy.
    proof: [events-tests]
  - text: A turn yields the handler's events in order, then any file change the snapshots found that was not streamed, then Done whose result holds text, events, files, usage, cost, stop reason Done and the session id; the result is also recorded on the session.
    proof: [events-tests]
  - text: Streamed Text deltas become the result text unless the handler set final_text; a runtime error appends its text to it.
    proof: [result-tests]
  - text: The result usage and cost are the counters after the turn minus the counters before it, never below zero for cost.
    proof: [result-tests]
  - text: The tool call above max_turns is dropped, the turn ends with stop reason MaxTurns, and interrupt is called.
    proof: [limits-tests]
  - text: A turn past its timeout ends with stop reason Timeout and the handler stream is dropped; cancel, also one fired before the turn starts, ends with Cancelled and wins over Timeout and MaxTurns.
    proof: [limits-tests]
  - text: A handler error becomes stop reason RuntimeError with its text in the result, except InstallFailed and CapabilityUnsupported, which are returned with no Done and no recorded result.
    proof: [limits-tests]
  - text: An Approval event goes to the callback; allow, deny and a panicking callback give Allow, "denied by on_approval" and "on_approval raised"; with no callback a non-interactive turn denies "no approval handler" and an interactive one denies "approval not answered" when the consumer moves on without an answer.
    proof: [approval-tests]
  - text: Callbacks still running when the turn ends are aborted, and a second answer to the same approval is ignored.
    proof: [approval-tests]
  - text: With an output schema and stop reason Done, the output is parsed from output_json or from the last JSON object in the text; a bad one yields Done and then OutputInvalid with the raw text and the result.
    proof: [result-tests]
  - text: Files created, modified and deleted in the sandbox during the turn appear as FileChange events once, even when the handler also streamed them.
    proof: [files-tests]
