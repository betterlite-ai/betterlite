id: B4847
title: Execute bounded harness turns with approvals and final results
description: >-
  Port LiteLLM's turn engine (litellm/harness/runtime.py L259-L541 and `AsyncSession.turn_events` L732-L741) into a new module `turn_runtime` of the crate
  betterlite-harness. One turn is: snapshot the sandbox, ask the handler for an event stream, pass its events on while enforcing `max_turns`, `timeout`
  and cancellation, route every `Event::Approval` to the approval callback, then snapshot again, add the file changes, build a `RunResult` and end with
  `Event::Done`. The session itself (start, interrupt, close, state) is B4846's and the public entry points (`astream`, `arun`, sessions from state)
  are B4848's. Read these on main first and use their exact Rust names: crates/betterlite-harness/src/session_runtime.rs (B4846: `AsyncSession<S, H, E>`
  and its `pub(crate)` fields `config`, `ctx`, `handler`, `results`, the methods `ensure_ready`, `begin_turn`, `end_turn`, `interrupt`, `record`,
  `usage_counters`, and `SessionRuntimeError`, `UsageCounters`, `TurnPermit`), context.rs (`SessionContext`, `SessionSettings`, `TurnOutcome`, `ApprovalHandler`),
  events.rs (`Event`, `Approval`, `Decision`, `FileChange`, `RunResult`), handlers.rs (`BaseHarnessHandler::turn`), snapshots.rs
  (`capture_text_contents`, `build_file_changes`, B4831), session/output.rs (`parse_output`, `OutputError`, B4844), errors.rs (`HarnessError`) and types.rs
  (`StopReason`, `Usage`, `FileChangeKind`).


  Entry point (`turn_events` L732-L741). In `turn_runtime.rs`, add an inherent `impl<S, H, E> AsyncSession<S, H, E>` block with
  `turn_events(&mut self, prompt: String, control: TurnControl, interactive: bool) -> impl Stream<Item = Result<Event, SessionRuntimeError>> + Send + '_`,
  built with `async_stream::try_stream!` (already a dependency). The bounds are those of B4846's struct plus `S: Sandbox + Clone`. The stream runs in this
  order: `let permit = self.begin_turn()?` (fails with `TurnRunning` when a turn is marked running; `TurnPermit` clears the busy flag when dropped), `self.ensure_ready().await?`, then the turn described below, and
  `self.end_turn(permit)` on every exit the stream reaches, success or error. If the consumer drops the stream first, the permit drops with it and the session is not busy. Items are `Event`s; a failure ends the stream after yielding one `Err`.


  Cancel handle (`TurnControl` L266-L276, `turn_runtime/control.rs`). `TurnControl` is `Clone` and holds an `Arc<AtomicBool>` and an `Arc<tokio::sync::Notify>`.
  `cancel(&self)` sets the flag with `Ordering::SeqCst` and calls `notify_one`, so a cancel that arrives before the turn first waits is not lost
  (Python's `if self.control.cancelled: producer.cancel()` at L394). `is_cancelled(&self) -> bool` reads the flag. `TurnControl::default()` is not cancelled.
  There is no producer task to hold, so Python's `producer` field is not built.


  Begin (`_begin` L380-L388). With `sandbox = self.ctx.sandbox.clone()`: `before = sandbox.snapshot().await`, `before_contents =
  capture_text_contents(&sandbox, &before).await`, `usage_before = self.usage_counters()`, then `ctx.outcome.final_text` is cleared and
  `ctx.outcome.output_json` is set to `None`. Do not reset `ctx.outcome.usage` or `ctx.outcome.cost`: in-process harnesses add to them across turns and
  `usage_counters` reads them. When `ctx.settings.timeout` is `Some(d)`, `deadline = tokio::time::Instant::now() + d`. Read `max_turns`, `on_approval` (clone
  of the `Arc`), `output_schema` and the session id from `ctx.settings` now, since the handler stream will hold `&mut self.ctx`. A sandbox error is returned
  as `SessionRuntimeError::Harness`.


  Event loop (`pump_events` L289-L314, `_next_item` L405-L415, `_finish` L417-L428, `_drain` L446-L458). Start the stream with
  `self.handler.turn(&mut self.ctx, &prompt)` and pin it. Loop with `tokio::select!` over, in this order and with `biased;`: the control's
  `Notify::notified()` future, the next item of the stream (`StreamExt::next`, wrapped in `tokio::time::timeout_at(deadline, ..)` when there is a
  deadline) and, when the approval set is not empty, `JoinSet::join_next_with_id`. Before each wait, if a deadline exists and `Instant::now() >= deadline`,
  end with reason `Timeout` (Python raises at once when `remaining <= 0`). Each branch gives one of these:

  - The stream ends: the turn is over with no reason and no error.

  - `Err(error)` from the stream: if it is `HarnessError::InstallFailed` or `HarnessError::CapabilityUnsupported`, the turn function returns it as
  `SessionRuntimeError::Harness` at once, with no `Done`, no result recorded and no `interrupt` (PROPAGATED_ERRORS L63). Any other error ends the turn with
  stop reason `RuntimeError` and error text `HarnessError: <error display>`, and a `tracing::warn!` line saying "harness <name> runtime error".

  - `Event::Done` from the stream is dropped without being recorded or yielded (L450).

  - A `ToolCall` event increments a counter. When `max_turns` is `Some(n)` and the counter is above `n`, the event is neither recorded nor yielded and the
  turn ends with reason `MaxTurns`. The check counts every tool call, built-in or not.

  - Anything else is recorded (below) and yielded to the consumer.

  - Cancel fired: the turn ends with reason `Cancelled`. Timeout: reason `Timeout`.


  When the loop ends, drop the stream (this is Python's `_aclose` and `_stop_producer`) and abort every approval task still running (`JoinSet::abort_all`,
  then drain it with `join_next`). The final stop reason is decided in this order: a stream error wins (`RuntimeError`), then `control.is_cancelled()`
  (`Cancelled`, even when the reason was `Timeout` or `MaxTurns`), then the end reason, else `Done`.


  Recording (`_record` L437-L444). `Text { delta }` is pushed on `text_parts`. `FileChange` adds `(path, kind)` to an `emitted_files` set (use a `BTreeSet`; it
  needs `FileChangeKind: Ord`, which the type does not derive, so key the set on `(String, &'static str)` with the kind's lowercase name, or on a `Vec` and use
  `contains`). `Approval` goes to the approval step. Every recorded event is also pushed on the `events` vector, in order.


  Approvals (`_on_approval` L430-L435, `call_approval_handler` L334-L350, `turn_runtime/approval.rs`). `ApprovalTasks` wraps a `tokio::task::JoinSet<bool>` and a
  `HashMap<tokio::task::Id, Approval>`. `on_approval(approval)`: with a callback, spawn `callback(approval.clone())` into the set (the rules ban a bare
  `tokio::spawn`) and remember its task id; with no callback and `interactive == false`, answer `Decision::Deny { reason: "no approval handler" }` at once;
  with no callback and `interactive == true`, do nothing, because the consumer answers through the `Approval`. When `join_next_with_id` gives
  `Ok((id, true))` answer Allow; `Ok((id, false))` answer `Deny { reason: "denied by on_approval" }`; `Err(error)` (the callback panicked) answers
  `Deny { reason: "on_approval raised: <error>" }` with a `tracing::warn!` naming the tool. An answer is `approval.decision.set(..)`. `SetOnce::set` returns
  an error when the approval is already answered, and that is expected (Python's `_resolve` returns early), so the error is dropped with `.is_err()` in an
  `if`, not with `let _ =`. After the consumer asks for the next event past a yielded `Approval` and there is no callback, answer `Deny { reason: "approval not
  answered" }` unless `decision.initialized()` (L455-L457). With a callback this step does nothing.


  Finish (`run` L517-L541). If the stop reason is not `Done`, call `self.interrupt().await` (it keeps the handler's native id for resume). Then compute
  file changes (`_file_changes` L460-L471, `turn_runtime/files.rs`): `after = sandbox.snapshot()`, `files = build_file_changes(&sandbox, &before, &after,
  &before_contents)`, then every recorded `Event::FileChange` whose path is not yet in `files` (compare by path only) is appended, so a streamed change the
  snapshots missed is kept. Then every file change in `files` whose `(path, kind)` is not in `emitted_files` is pushed on `events` and yielded.


  Result (`_text` L473-L477, `_usage` L479-L487, `_result` L489-L506, `_output` L508-L515, `turn_runtime/result.rs`).

  - `text` is `ctx.outcome.final_text` when it is not empty, else the `text_parts` joined. With an error text it becomes `"<text>\n\n<error>"`, or just the error
  when the text is empty.

  - `usage` and `cost` are `usage_counters()` now minus `usage_before`. Token and call counts use `saturating_sub`; `cost` is `max(delta, 0)`.

  - `output` is computed only when the session has an output schema and the stop reason is `Done`: `parse_output::<JsonObject>(ctx.outcome.output_json.as_deref(),
  &text)`. `Ok` gives `Some(output)`, `Err` keeps `output: None` and holds the error.

  - `RunResult { text, output, files, events: <clone of events>, usage, cost, stop_reason, session_id }`.

  Then `self.record(result.clone())`, yield `Event::Done { result }`, and last, if parsing failed, yield one `Err(SessionRuntimeError::Harness(
  HarnessError::OutputInvalid { message: <error display>, raw: <output_json or text>, result: Some(Box::new(result)) }))`. So the consumer sees `Done` first and the
  error right after, as in LiteLLM.


  Deviations in structure. Rust has no event queue and no producer task: the stream is polled on the consumer's task, so a slow consumer pauses the
  handler (that is the backpressure of Python's bounded queue), and `HARNESS_EVENT_QUEUE_MAX_SIZE` (1024) is not used. Callbacks are async only, as
  B4830's `ApprovalHandler` type already says.
