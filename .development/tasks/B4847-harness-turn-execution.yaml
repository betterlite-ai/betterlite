      why: the turn entry point and event order tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^turn_runtime::(.*::)?events::/)'
    - id: limits-tests
      why: max_turns, timeout, cancel and runtime error tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^turn_runtime::(.*::)?limits::/)'
    - id: approval-tests
      why: approval routing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^turn_runtime::(.*::)?approval::/)'
    - id: result-tests
      why: result text, usage and structured output tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^turn_runtime::(.*::)?result::/)'
    - id: files-tests
      why: file change tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^turn_runtime::(.*::)?files::/)'
oracle_cases: []
deviations:
  - what: There is no event queue or producer task. The handler stream is polled by the turn itself, so a slow consumer pauses the handler.
    why: A Rust stream is pull based, so the pause is the backpressure Python gets from its 1024-slot queue. HARNESS_EVENT_QUEUE_MAX_SIZE is not used.
  - what: A runtime error's text starts with "HarnessError:" where LiteLLM writes the Python exception class name.
    why: Rust errors have one type here, and the class name is not part of any wire format.
  - what: Approval callbacks must be async; sync callbacks run in a worker thread in LiteLLM.
    why: B4830's ApprovalHandler type is already an async closure, and a panic in it takes the place of a raised exception.
  - what: Dropping a turn stream before Done does not call interrupt or record a result, but the session is not left busy.
    why: Rust runs no code when a stream is dropped, so the handler stays as it was; the TurnPermit held by the stream clears the busy flag on drop. The supported clean stop is still TurnControl::cancel followed by reading the stream to its Done.
out_of_scope:
  - "SessionConfig, build_config, validate, context_for, parse_output and resolve_model_route (runtime.py L72-L255) belong to B4844; parse_output is called here."
  - "The AsyncSession lifecycle (L584-L730, L750-L776: start, interrupt, ensure_ready, close, state, usage_counters, record, history, cost, usage) belongs to B4846 and is called here; begin_turn and end_turn are its busy-flag methods."
  - "AsyncEventStream, _one_shot, astream, arun, _collect, aagent_session, arun_agent, astream_agent, _coerce_state, aagent_resume, agent_capabilities and aagent (L544-L582, L743-L748, L779-L1028) belong to B4848."
  - "`_aclose` (L279-L286) has no Rust counterpart: dropping the stream closes it."
  - "build_file_changes and capture_text_contents are B4831's and the snapshot comparison is not rebuilt here."
pitfalls:
  - The max_turns check is a strict greater-than on the running count of ToolCall events, and the call that crosses the limit is dropped before it is recorded or yielded.
  - Cancel wins over every other reason, including a reason set by the timeout or by max_turns, and a stream error wins over cancel.
  - A timeout checks the clock before waiting, so a deadline already passed ends the turn even when the next item is ready.
  - InstallFailed and CapabilityUnsupported stop the whole turn with an error and skip interrupt, file changes, record and Done; every other handler error still produces a Done with RuntimeError.
  - interrupt is called for every stop reason other than Done, runtime errors included, before the file changes are computed.
  - Reset only final_text and output_json at the start of a turn; usage and cost on ctx.outcome belong to in-process harnesses and are summed across turns.
  - Done is yielded before OutputInvalid, and the result recorded on the session is the one carried by the error.
  - File changes streamed by the handler are deduplicated against the snapshot result by path, but a yielded change is skipped only when both path and kind were already emitted.
  - An Approval with no callback in interactive mode is denied only after the consumer asks for the next event; denying it on arrival would stop the consumer from answering.
  - Hold no borrow of self across the handler stream except the two fields it needs, so take every ctx.settings value and a clone of the sandbox before calling handler.turn.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
