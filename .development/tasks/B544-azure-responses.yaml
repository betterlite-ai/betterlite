checks:
  optional:
  - mutants
  commands:
  - id: case-responses-base-and-api-version
    why: Use B2200 URL helper with route=/openai/responses and default from AZURE_DEFAULT_RESPONSES_API_VERSION
      environment (default preview). Reuse B2200 key/token header validation and its query precedence; advertise
      provider azure.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_responses_base_and_api_version$/)'
  - id: case-strip-azure-model-prefix
    why: Remove every responses/,o_series/,azure_ai/ occurrence in that order, not the azure/ prefix. Copy each
      dict tool having function, remove function and update with its nested mapping so nested keys overwrite top-level
      keys; replace tools in caller options before B507 request transformation.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_strip_azure_model_prefix$/)'
  - id: case-o-series-options
    why: Recognize case-insensitive o_series substring or B174 supports_reasoning(model); do not restrict this selector
      to o1/o3/o4 substrings.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_o_series_options$/)'
  - id: case-reasoning-null-fields
    why: 'For reasoning items try SDK validation, synthesize absent summary from reasoning_content (first100 plus
      ... when longer), dump exclude_none=True and remove status. On any validation/type failure debug-log and filter
      the original item only: remove null status/content/encrypted_content, retaining non-null status and unrelated
      null fields. Parent input validation runs first; then remove every status field from type=message dictionaries.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_reasoning_null_fields$/)'
  - id: case-websocket-model-query
    why: Native websocket support is True and model_in_websocket_url is False. Missing None api_base raises ValueError
      api_base is required for Azure WebSocket. Strip trailing slash and one existing /openai/v1/responses or /openai/responses
      suffix, append /openai/v1/responses, remove all query, set wss only for original https and ws otherwise.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_websocket_model_query$/)'
  - id: case-resource-id-before-query
    why: Append B206 encoded response_id and optional /cancel or /input_items to the trimmed URL path while preserving
      scheme,authority,params,query,fragment. Get/delete/cancel return {} data; input items include non-None after/before/limit/order,
      default20/desc, and comma-join a truthy include list.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_resource_id_before_query$/)'
  - id: case-cancel-response
    why: JSON parsing exceptions become AzureOpenAIError carrying raw_response.text/status; successful JSON is validated
      as ResponsesAPIResponse and validation failures propagate, matching the OpenAI cancellation projection contract.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_cancel_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_responses.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_responses*")"
      && grep -lq 'azure_responses' tools/oracle/fuzz/corpus/helper_case/azure_responses* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_responses$/)' && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_responses)"
      && grep -q 'decode_azure_response_resource' crates/betterlite-azure/fuzz/fuzz_targets/azure_responses.rs &&
      cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_responses_corpus$/)'
  - id: case-azure-responses-capabilities
    why: Remove context_management from B506 supported params; none-effort support/default delegates to B532 Azure
      catalog policy. O-series also removes temperature from its advertised list, but its mapper copies all values
      and drops temperature only when drop_params is truthy, with debug logging; without drop it retains temperature.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_azure_responses_capabilities$/)'
  - id: config-azure-default-responses-api-version
    why: AZURE_DEFAULT_RESPONSES_API_VERSION lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_responses_config_cases::case_[0-9]+_loads_azure_default_responses_api_version$/)'
