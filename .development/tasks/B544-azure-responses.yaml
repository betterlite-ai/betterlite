id: B544
title: Azure Responses native requests
description: >-
  Add AzureResponsesConfig over the OpenAI Responses types, including Azure model prefix removal, reasoning-history
  filtering, native websocket URL metadata and query-preserving resource-id paths. Share stream decoding and compact/request
  sanitation; public proxy endpoints stay in B080.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/responses/transformation.py:
  AzureOpenAIResponsesAPIConfig.custom_llm_provider L30-L31; AzureOpenAIResponsesAPIConfig._supports_reasoning_effort_none
  L34-L35; AzureOpenAIResponsesAPIConfig._effort_resolves_to_none L38-L39; AzureOpenAIResponsesAPIConfig.get_supported_openai_params
  L41-L46; AzureOpenAIResponsesAPIConfig.validate_environment L48-L49; AzureOpenAIResponsesAPIConfig.get_stripped_model_name
  L51-L52; AzureOpenAIResponsesAPIConfig._handle_reasoning_item L54-L89; AzureOpenAIResponsesAPIConfig._validate_input_param
  L91-L113; AzureOpenAIResponsesAPIConfig.transform_responses_api_request L115-L147; AzureOpenAIResponsesAPIConfig.get_complete_url
  L149-L177; AzureOpenAIResponsesAPIConfig.supports_native_websocket L179-L180; AzureOpenAIResponsesAPIConfig.get_websocket_url
  L182-L203; AzureOpenAIResponsesAPIConfig.model_in_websocket_url L205-L207; AzureOpenAIResponsesAPIConfig._construct_url_for_response_id_in_path
  L212-L238; AzureOpenAIResponsesAPIConfig.transform_delete_response_api_request L240-L260; AzureOpenAIResponsesAPIConfig.transform_get_response_api_request
  L265-L281; AzureOpenAIResponsesAPIConfig.transform_list_input_items_request L283-L310; AzureOpenAIResponsesAPIConfig.transform_cancel_response_api_request
  L315-L337; AzureOpenAIResponsesAPIConfig.transform_cancel_response_api_response L339-L353. litellm/llms/azure/responses/o_series_transformation.py:
  AzureOpenAIOSeriesResponsesAPIConfig.get_supported_openai_params L35-L52; AzureOpenAIOSeriesResponsesAPIConfig.map_openai_params
  L54-L75; AzureOpenAIOSeriesResponsesAPIConfig.is_o_series_model L77-L92.


  Reuse BaseAzureLLM._base_validate_azure_environment from B531 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse BaseAzureLLM._get_base_azure_url from B531 (litellm/llms/azure/common_utils.py); its implementation remains
  with that prerequisite.


  Implement crates/betterlite-azure/src/responses.rs with adjacent tests under responses/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_responses in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function responses_cases in betterlite-azure with these exact named cases (one per oracle file):
  responses_base_and_api_version, strip_azure_model_prefix, o_series_options, reasoning_null_fields, websocket_model_query,
  resource_id_before_query, cancel_response. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and captured
  upstream request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_responses* using HelperCase: kind: helper
  and the externally tagged azure_responses variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_responses that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_azure_response_resource consumes Azure Responses resource JSON bytes in crates/betterlite-azure/src/responses.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_responses.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_responses.
  The adjacent test replays_the_azure_responses_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 297 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 315 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 586 planned, 600 maximum changed lines.
