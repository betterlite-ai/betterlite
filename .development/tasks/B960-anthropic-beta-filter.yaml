id: B960
title: Anthropic beta filter
description: >-
  Filter, remap and inject Anthropic beta headers using the validated provider matrix. Keep unsupported-header diagnostics
  and native pass-through model-specific beta synthesis for thinking, tools and context management, without filtering
  unrelated client headers.


  Unknown or null-mapped beta values are dropped with a debug diagnostic; deduplicate, sort and join remaining tokens
  with a comma and no spaces. Remove the header/body anthropic_beta if none remain. Native injection finds header
  names case-insensitively and writes anthropic-beta in lower case. Own _messages_carry_output_config below the
  caller B961.


  Provider behavior comes through B010 prepared operation/capability values; no provider umbrella is a scheduling
  dependency.


  is_beta_header_supported (litellm/anthropic_beta_headers_manager.py:L269-L288) has no MIT runtime caller at the
  pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior case exercises that
  unused entry point.


  get_provider_beta_header (litellm/anthropic_beta_headers_manager.py:L291-L318) has no MIT runtime caller at the
  pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior case exercises that
  unused entry point.


  get_unsupported_headers (litellm/anthropic_beta_headers_manager.py:L395-L410) has no MIT runtime caller at the
  pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior case exercises that
  unused entry point.


  Implement crates/betterlite-core/src/api/anthropic_beta_filter.rs. Use AnthropicBetaFilterInput and AnthropicBetaFilterResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions unsupported_beta_diagnostic, provider_beta_remap, comma_separated_beta,
  thinking_beta_injection, context_management_beta, all_betas_filtered_header_409f under api::anthropic_beta_filter::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::AnthropicBetaFilter in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {anthropic_beta_filter: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/anthropic_beta_headers_manager.py: filter_and_transform_beta_headers (L215-L266);
  litellm/anthropic_beta_headers_manager.py: update_headers_with_filtered_beta (L321-L356); litellm/anthropic_beta_headers_manager.py:
  update_request_with_filtered_beta (L359-L392); litellm/llms/anthropic/pass_through/messages/transformation.py:
  _messages_carry_output_config (L53-L54); litellm/llms/anthropic/pass_through/messages/transformation.py: AnthropicMessagesConfig._update_headers_with_anthropic_beta
  (L611-L709). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 122 owned nonblank/non-comment/non-docstring Python lines (167 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 142 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 410 total within the 410-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B959 (Anthropic beta config), B1087
  (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
