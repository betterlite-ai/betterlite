id: B960
title: Anthropic beta filtering and feature injection
description: >-
  Implement the three live filtering functions in anthropic_beta_headers_manager.py and the whole native
  _update_headers_with_anthropic_beta method plus _messages_carry_output_config in messages/transformation.py.
  Put the transformations in betterlite-core::api::anthropic_beta_filter. B959 supplies a cached matrix and alias
  resolver; B568 supplies feature predicates and tool-search header names. This task consumes decoded request
  records and does not add a parser or perform network I/O.

  Keep matrix filtering distinct from native feature injection. Filtering mutates the lowercase anthropic-beta
  header and anthropic_beta body list, with debug diagnostics on each unknown or null-mapped input. Native injection
  finds existing header names case-insensitively and returns one lowercase header when any tokens exist, preserving
  unknown beta tokens until the caller explicitly filters them. It never filters unrelated headers. No thinking
  beta is added merely because thinking is enabled; only display=updates has an injection here.

  Use HelperCall::AnthropicBetaFilter to select matrix_filter or native_injection in Rust and Python. Fixtures
  call the pinned functions with local configuration, recording transformed headers/body and debug-drop reasons.
  Name tests after the cases below, with rstest inputs for provider and feature combinations. The functions own
  168 nonblank/non-comment lines; allow 150 implementation, 150 tests, 140 fixtures, 85 adapters and 35 wiring,
  560 changed lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/anthropic_beta_filter.rs
  - crates/betterlite-core/src/api/anthropic_beta_filter/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/anthropic_beta_filter.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/anthropic_beta_filter.py
  - tools/oracle/fuzz/corpus/helper_case/anthropic_beta_filter-*
  - tools/oracle/cases/helpers/anthropic-beta-filter/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_beta_headers_manager.py#L215-L266
  why: Strip input tokens, map only known non-null values, deduplicate output and sort lexically.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_beta_headers_manager.py#L321-L392
  why: Header and body filtering differ when the original value is absent or empty.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/transformation.py#L53-L54
  why: A message output_config key counts even if its value is null.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/transformation.py#L610-L709
  why: Own native injection as one method, including the sorted union and case-insensitive header merge.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/anthropic_tool_search.py#L14-L36
  why: B568 selects advanced-tool-use-2025-11-20 or tool-search-tool-2025-10-19 by provider.
dod:
- text: >-
    mapped_beta_tokens sends bedrock tokens " advanced-tool-use-2025-11-20 ", tool-search-tool-2025-10-19,
    fast-mode-2026-02-01 and invented. Return [tool-search-tool-2025-10-19], with unsupported debug for fast-mode
    and unknown debug for invented. Unknown provider drops every token; empty input returns [] without loading
    the matrix. A custom alias and two input tokens mapped to the same output resolve once and deduplicate.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    header_body_removal sends anthropic-beta="unknown,, " and anthropic_beta=[unknown] and removes both keys.
    An absent or null header is unchanged; an empty header is removed. An absent, null or [] body field is kept
    unchanged because it is falsey. Mixed input "effort-2025-11-24, computer-use-2025-01-24,effort-2025-11-24"
    becomes computer-use-2025-01-24,effort-2025-11-24 with no spaces. X-Keep=yes survives; Anthropic-Beta is untouched
    by the matrix function because that function looks up only the lowercase key.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    native_beta_merge supplies Anthropic-Beta=" custom ,custom" and anthropic-beta="other"; injection returns
    only anthropic-beta=custom,other and retains X-Keep=yes. Empty headers/options/messages return unchanged.
    An existing empty Anthropic-Beta with no feature is also unchanged. Native injection preserves unknown custom.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    context_compaction_betas uses context_management.edits=[] and gets no beta; compact_20260112 adds
    compact-2026-01-12; clear_tool_uses_20250919 or an edit missing type adds context-management-2025-06-27;
    both edits produce both sorted tokens. Native compaction={} or an existing compaction block with signature=sig
    adds compact-2026-09-04 only for provider=anthropic; empty signature and provider=bedrock do not.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    output_and_speed_betas sends output_format={} or output_config.format={} and gets structured-outputs-2025-11-13;
    null format does not. speed=fast adds fast-mode-2026-02-01, speed=standard does not. A message carrying
    output_config=null adds per-turn-control-2026-07-01; a top-level output_config alone does not add that token.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    tool_and_thinking_betas sends tool type=advisor_20260301 and gets advisor-tool-2026-03-01. Either
    tool_search_tool_regex_20251119 or tool_search_tool_bm25_20251119 adds tool-search-tool-2025-10-19 for
    vertex_ai,vertex_ai_beta,bedrock and advanced-tool-use-2025-11-20 for anthropic,azure,azure_ai,unknown.
    thinking={type:enabled,display:updates} or adaptive/updates adds thinking-display-updates-2026-08-18;
    disabled/updates and enabled without display do not. A system tool_addition or tool_removal block with
    tool.type=tool_reference adds mid-conversation-tool-changes-2026-07-01; a user block does not.
  proof: [behavior-tests, oracle, helper-python]
- text: Independent beta-filter cases and a newly tagged helper seed execute the production transforms without provider traffic.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: beta merge, injection or removals lack executable comparisons
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_filter::/)'
  - id: helper-python
    why: the filter adapter is missing or not strictly checked
    run: test -f tools/oracle/helpers/anthropic_beta_filter.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: anthropic_beta_filter cannot be selected by the helper parser
    run: grep -qE '^[[:space:]]+anthropic_beta_filter:' tools/oracle/fuzz/corpus/helper_case/anthropic_beta_filter-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: the branch adds no beta-filter comparisons
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/anthropic-beta-filter)"
oracle_cases:
- tools/oracle/cases/helpers/anthropic-beta-filter/mapped-beta-tokens.yaml
- tools/oracle/cases/helpers/anthropic-beta-filter/header-body-removal.yaml
- tools/oracle/cases/helpers/anthropic-beta-filter/native-beta-merge.yaml
- tools/oracle/cases/helpers/anthropic-beta-filter/context-compaction-betas.yaml
- tools/oracle/cases/helpers/anthropic-beta-filter/output-and-speed-betas.yaml
- tools/oracle/cases/helpers/anthropic-beta-filter/tool-and-thinking-betas.yaml
deviations: []
out_of_scope:
- B959 owns matrix loading, validation, reload and get_provider_name in anthropic_beta_headers_manager.py L47-L212.
- is_beta_header_supported, get_provider_beta_header and get_unsupported_headers have no caller at the pin.
- B961 owns messages/transformation.py L59-L284 preparation; B2430 owns L287-L570 request transformation; B962 owns L572-L608 response transformation and iterator construction.
- B568 owns common_utils.py feature predicates and types/llms/anthropic_tool_search.py provider-specific beta selection.
pitfalls:
- The structured-output enum member contains 2025_09_25 but its wire value is structured-outputs-2025-11-13.
- Empty anthropic_beta=[] survives while a nonempty list whose entries all drop is removed.
- Native header merging is case-insensitive; the separate matrix updater is case-sensitive.
review_level: standard
budget:
  max_changed_lines: 580
  max_new_expects: 0
