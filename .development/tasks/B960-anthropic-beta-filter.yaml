    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_filter::tests::all_betas_filtered_header_409f($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/anthropic_beta_filter.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/anthropic_beta_filter-*)"
      && grep -qE "^[[:space:]]+anthropic_beta_filter:" tools/oracle/fuzz/corpus/helper_case/anthropic_beta_filter-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/anthropic-beta-filter)"
