  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_filter::/)
      - test(/::replays_corpus$/)'
  - id: case-unsupported-beta-diagnostic
    why: the unsupported-beta-diagnostic behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_filter::tests::unsupported_beta_diagnostic($|::)/)'
  - id: case-provider-beta-remap
    why: the provider-beta-remap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_filter::tests::provider_beta_remap($|::)/)'
