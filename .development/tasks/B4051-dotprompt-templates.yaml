oracle_cases: []
deviations:
  - what: Per-file load errors during directory scan are caught and skipped silently rather than stopping the load or warning.
    why: LiteLLM behavior at the pinned commit; strict error handling is a future refinement controlled by configuration.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dotprompt/prompt_manager.py#L109-L124
  - what: Invalid YAML in frontmatter raises ValueError during parsing instead of being logged and skipped.
    why: LiteLLM behavior at the pinned commit; inline YAML errors surface during parse, not silently.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dotprompt/prompt_manager.py#L179-L198
out_of_scope:
  - "PromptManager.list_prompts: no caller at the pin outside tests/examples"
  - "PromptManager.get_prompt_metadata: no caller at the pin outside tests/examples"
  - "PromptManager.json_to_prompt_file: no caller at the pin outside tests/examples"
  - "PromptTemplate.__repr__: no caller at the pin in runtime paths"
  - Custom Python extension execution through litellm_logging or user hooks; this task is purely about file and template loading.
  - The integration with completion hooks and compiler dispatch; B4052 owns the DotpromptManager that uses these types.
  - Caching and in-memory registry management; those belong to the compiler and router tasks.
pitfalls:
  - PromptTemplate.__init__ must extract restricted_keys (model, input, output) from metadata and store everything else in optional_params.
  - strip_version_suffix uses rpartition(".v"), so it handles only the rightmost .v and checks that version is isdigit(); "prompt.v1.v2" returns "prompt.v1" as the base.
  - _parse_frontmatter uses re.DOTALL and matches ^---\s*\n...\n---\s*\n; the newline after the closing --- is part of the delimiter and does not appear in template_content.
  - ImmutableSandboxedEnvironment disallows mutation of caller-supplied objects, so templates cannot assign to context variables or call methods on mutable types.
  - Jinja2 from_string() uses the loader's environment, not a fresh one; tests must use the same jinja_env instance.
  - The schema type mapping is case-insensitive and defaults to str for unknown types; "Number" and "STRING" both work.
  - Frontmatter that is invalid YAML raises a ValueError immediately; there is no fallback to treating it as content.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
