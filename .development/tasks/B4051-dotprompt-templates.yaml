dod:
  - text: PromptTemplate struct holds content, metadata dict, template_id, and extracts model, input_schema, output_format, output_schema and optional_params from metadata.
    proof: [dotprompt-template-tests]
  - text: strip_version_suffix splits on ".v" suffix and returns the base name if the version is all digits, else None.
    proof: [dotprompt-version-tests]
  - text: PromptManager.__init__ accepts optional prompt_directory, prompt_data dict and prompt_file, and loads from directory if provided with nonrecursive glob for *.prompt files.
    proof: [dotprompt-loading-tests]
  - text: "PromptManager.__init__ with prompt_file but no prompt_id raises ValueError with the exact message: 'prompt_id is required when prompt_file is provided'."
    proof: [dotprompt-loading-tests]
  - text: "_load_prompts raises ValueError with the exact message 'Prompt directory does not exist: <path>' when the directory does not exist or is falsy."
    proof: [dotprompt-loading-tests]
  - text: Per-file errors during directory load are caught and skipped silently; per-record errors in JSON load are skipped without stopping the load.
    proof: [dotprompt-loading-tests]
  - text: >-
      _load_prompts_from_json branches on prompt_data shape: passing prompt_id="x" with {"content": "template", "metadata": {...}} registers one template under "x";
      passing {"a": {"content": "...", "metadata": {...}}, "b": {...}} registers two templates under "a" and "b" keys.
    proof: [dotprompt-loading-tests]
  - text: _parse_frontmatter splits on ^---\s*\n(.*?)\n---\s*\n with YAML parsing, returns frontmatter dict and content, and treats invalid YAML as an error.
    proof: [dotprompt-frontmatter-tests]
  - text: render() retrieves the template, validates input against input_schema if present, renders with Jinja2 from_string using the sandboxed environment, and raises ValueError on render errors.
    proof: [dotprompt-render-tests]
  - text: "render() raises KeyError with the exact message \"Prompt '<prompt_id>'<version_suffix> not found. Available prompts: <list>\" when get_prompt returns None."
    proof: [dotprompt-render-tests]
  - text: _validate_input checks each variable type against the schema and raises ValueError on mismatch using _get_python_type mapping.
    proof: [dotprompt-validation-tests]
  - text: _get_python_type maps schema type strings (string/str, integer/int, number, float, boolean/bool, array/list, object/dict) to Python types, case-insensitive, defaulting to str.
    proof: [dotprompt-validation-tests]
  - text: get_prompt() looks for versioned ID first (prompt_id.vN), then direct match, then strips version from prompt_id and looks for the base.
    proof: [dotprompt-version-tests]
  - text: reload_prompts() clears stored prompts and reloads them from the configured prompt_directory.
    proof: [dotprompt-reload-tests]
  - text: add_prompt(prompt_id, content, metadata) creates and stores a PromptTemplate with the supplied content, metadata and template_id.
    proof: [dotprompt-reload-tests]
  - text: load_prompts_from_json_data(prompt_data) merges JSON-supplied prompts into the existing store via _load_prompts_from_json.
    proof: [dotprompt-reload-tests]
  - text: prompt_file_to_json reads a .prompt file, parses frontmatter, returns JSON with content and metadata keys.
    proof: [dotprompt-conversion-tests]
  - text: get_all_prompts_as_json returns a dict mapping prompt_id to {content, metadata} for all loaded templates.
    proof: [dotprompt-conversion-tests]
  - text: _get_prompt_data_from_dotprompt_content parses dotprompt content string and returns {content, metadata} dict for database-stored templates.
    proof: [dotprompt-content-tests]
  - text: "PromptManager uses ImmutableSandboxedEnvironment with Handlebars delimiters ({{ }}, {% %}, {# #}), select_autoescape for html/xml, and immutable restrictions are enforced."
    proof: [dotprompt-sandbox-tests]
  - text: The crate has a cargo-fuzz target at crates/betterlite-prompts/fuzz/fuzz_targets/dotprompt_templates.rs seeded with file/frontmatter/JSON/template fixtures, and replays_the_dotprompt_templates_corpus loads every corpus file without panic.
    proof: [dotprompt-fuzz-corpus]
  - text: Every mutant in the loader and rendering code is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: dotprompt-template-tests
      why: PromptTemplate struct or property tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::template/)'
    - id: dotprompt-version-tests
      why: strip_version_suffix or version lookup tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::version/)'
    - id: dotprompt-loading-tests
      why: directory or JSON loading tests fail or do not exist, including __init__ error cases
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::loading/)'
    - id: dotprompt-reload-tests
      why: reload_prompts, add_prompt and load_prompts_from_json_data tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::reload/)'
    - id: dotprompt-frontmatter-tests
      why: frontmatter parsing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::frontmatter/)'
    - id: dotprompt-render-tests
      why: template rendering and render error tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::render/)'
    - id: dotprompt-validation-tests
      why: input validation and type mapping tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::validation/)'
    - id: dotprompt-conversion-tests
      why: JSON conversion tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::conversion/)'
    - id: dotprompt-content-tests
      why: database content parsing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::content/)'
    - id: dotprompt-sandbox-tests
      why: sandbox environment configuration tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^dotprompt_templates::sandbox/)'
    - id: dotprompt-fuzz-corpus
