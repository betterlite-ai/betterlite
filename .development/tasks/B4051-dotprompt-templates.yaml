id: B4051
title: Dotprompt loading and sandboxed template rendering
description: >-
  Add crates/betterlite-prompts crate for local prompt file management, JSON loading and Jinja2 rendering.
  Build the PromptTemplate struct to hold content, metadata, model, input schemas, output format/schema and optional params.
  Build PromptManager to load .prompt files from a directory using nonrecursive glob, parse YAML frontmatter (---\n...\n---\n),
  store and retrieve templates with version lookup support, and render templates with a sandboxed Jinja2 environment.
  Support loading from JSON data structures and converting between .prompt file format and JSON.
  Implement input validation against schemas with Python type mapping (string, integer, number, float, boolean, array, object and their aliases).
  Export _get_prompt_data_from_dotprompt_content to parse templates from database-stored content.
  Preserve the nonrecursive directory scan with silent skip on per-file errors and per-record parse failures,
  the exact .v suffix splitting rule for version lookup, the ImmutableSandboxedEnvironment configuration for Handlebars-style templates,
  and the extraction of restricted keys (model, input, output) and optional params from metadata.
  Use Jinja2's select_autoescape for string templates and maintain immutable sandbox restrictions.
  Fuzz file/frontmatter/JSON/template inputs to ensure parser robustness.
scope:
  paths:
    - crates/betterlite-prompts/Cargo.toml
    - crates/betterlite-prompts/src/dotprompt_templates.rs
    - crates/betterlite-prompts/src/dotprompt_templates/**
    - crates/betterlite-prompts/fuzz/fuzz_targets/dotprompt_templates.rs
    - crates/betterlite-prompts/fuzz/corpus/dotprompt_templates/**
  lint_tables: false
