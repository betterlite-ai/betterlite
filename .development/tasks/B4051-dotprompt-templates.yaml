    why: PromptManager class with __init__, _load_prompts, _load_prompts_from_json, _load_prompt_file, _parse_frontmatter, render, _validate_input, _get_python_type, get_prompt, reload_prompts and add_prompt methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dotprompt/prompt_manager.py#L319-L334
    why: prompt_file_to_json conversion method.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dotprompt/prompt_manager.py#L359-L375
    why: get_all_prompts_as_json and load_prompts_from_json_data methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dotprompt/__init__.py#L30-L43
    why: _get_prompt_data_from_dotprompt_content function for parsing database-stored dotprompt content.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dotprompt/README.md
    why: Dotprompt specification documentation and API reference.
