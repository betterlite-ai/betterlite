checks:
  optional:
  - mutants
  commands:
  - id: case-filter-operator-map
    why: The filter-operator-map behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_filter_operator_map$/)'
  - id: case-nested-and-or-filters
    why: The nested-and-or-filters behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_nested_and_or_filters$/)'
  - id: case-knowledge-base-retrieve-url
    why: The knowledge-base-retrieve-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_knowledge_base_retrieve_url$/)'
  - id: case-user-context
    why: The user-context behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_user_context$/)'
  - id: case-location-file-id-name
    why: The location-file-id-name behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_location_file_id_name$/)'
  - id: case-attributes-and-scores
    why: The attributes-and-scores behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_attributes_and_scores$/)'
  - id: case-unsupported-create
    why: The unsupported-create behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_unsupported_create$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_vector_stores.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_vector_stores*")"
      && grep -lq 'bedrock_services_vector_stores' tools/oracle/fuzz/corpus/helper_case/bedrock_services_vector_stores*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_vector_stores$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_vector_stores)"
      && grep -q 'decode_knowledge_base_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_vector_stores.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_vector_stores_corpus$/)'
