id: B660
title: Bedrock Knowledge Bases vector retrieval
description: >-
  Add BedrockVectorQuery/Reply for knowledge-base retrieve, OpenAI filter operator translation and optional user
  context. Preserve the source single-level and/or filters, metadata file-id/name/attribute extraction and score/result
  order. Creation remains the pinned unsupported provider operation, not a synthetic successful store.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/vector_stores/transformation.py:
  BedrockVectorStoreConfig.__init__ L40-L42; BedrockVectorStoreConfig.get_error_class L44-L50; BedrockVectorStoreConfig.get_auth_credentials
  L52-L53; BedrockVectorStoreConfig.get_vector_store_endpoints_by_type L55-L59; BedrockVectorStoreConfig.get_supported_openai_params
  L61-L62; BedrockVectorStoreConfig._map_operator_to_aws L64-L92; BedrockVectorStoreConfig._map_operator_filter
  L94-L107; BedrockVectorStoreConfig._map_and_or_filters L109-L153; BedrockVectorStoreConfig.map_openai_params L155-L184;
  BedrockVectorStoreConfig.validate_environment L186-L189; BedrockVectorStoreConfig.get_complete_url L191-L199;
  BedrockVectorStoreConfig.transform_search_vector_store_request L201-L252; BedrockVectorStoreConfig._user_context
  L255-L268; BedrockVectorStoreConfig.sign_request L270-L285; BedrockVectorStoreConfig._get_file_id_from_metadata
  L287-L297; BedrockVectorStoreConfig._get_filename_from_metadata L299-L319; BedrockVectorStoreConfig._get_attributes_from_metadata
  L321-L328; BedrockVectorStoreConfig.transform_search_vector_store_response L330-L367; BedrockVectorStoreConfig.transform_create_vector_store_request
  L370-L375; BedrockVectorStoreConfig.transform_create_vector_store_response L377-L378.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: filter_operator_map: Map eq->equals,ne->notEquals,gt->greaterThan,gte->greaterThanOrEquals,lt->lessThan,lte->lessThanOrEquals,in->in,nin->notIn.
  AWS names equals,notEquals,greaterThan,greaterThanOrEquals,lessThan,lessThanOrEquals,notIn,startsWith,listContains,stringContains
  pass unchanged, as do all unknown operators. Single filter requires operator,key,value by indexing and emits only
  {mapped_operator:{key,value}}; do not add validation or copy extra keys. nested_and_or_filters: The helper is
  NOT recursive: children must each have operator,key,value; nested and/or children fail missing-key access. An
  and list of length1 returns its single operator immediately, ignoring any or field. Otherwise build andAll including
  empty[], then inspect or; a length1 or returns only that operator, discarding prior andAll. Multiple/empty or
  builds orAll; both multi-lists remain in result. Preserve ordering. knowledge_base_retrieve_url: Constructor calls
  B1058 BaseVectorStore and B590 BaseAWS. get_auth_credentials returns{}. Read endpoints exactly POST /knowledgebases/{knowledge_base_id}/retrieve,write[].
  Environment keeps caller Content-Type if present,otherwise application/json. B591 non-LLM region resolver and
  agent runtime endpoint produce endpoint_url plus /knowledgebases, without trimming existing slash. Search appends
  /{B171 encode_url_path_segment(vector_store_id)}/retrieve. Shared B595 signer uses service bedrock and passes
  api_key; do not use bedrock-agent-runtime service name. user_context: Select first non-None value across extra_body
  then litellm_params, camel userContext then snake user_context within each Mapping. Empty dict/False/empty string
  are selected and emitted without schema validation. Missingall omits userContext. Other extra_body keys are not
  copied. Set logging_obj.model_call_details.query to joined query for response search_query. location_file_id_name:
  Ignore retrieval result location field; derive from metadata only. Truthy x-amz-bedrock-kb-source-uri is file_id
  unchanged; else bedrock-kb-{chunk-id default unknown}, preserving explicitNone as Python string. Filename from
  parsed URI final path component when path not empty/root,else netloc; empty final component falls backnetloc;
  parse exceptions return source_uri. Do not percent-decode basename. Without URI use bedrock-kb-document-{data-source-id
  default unknown}. attributes_and_scores: decode_knowledge_base_reply reads JSON into TypedDict-style BedrockKBResponse,
  not strict Pydantic schema. retrievalResults missing/None/empty -> empty list. Skip missing/falsey content or
  text=None, but include empty text. Metadata falsey->{}; attributes copy ALL metadata including AWS internal keys,score
  item.score as supplied. Preserve order and construct content=[{type:text,text}],file_id,filename. Return object
  vector_store.search_results.page,search_query from logging query defaultempty,data results. Underlying output-type
  validation remains B1058. unsupported_create: Both transform_create_vector_store_request and response raise bare
  NotImplementedError with no message; no write endpoint and no synthetic successful store. option_mapping: Supported
  list filters,max_num_results,ranking_options. map_openai_params maps max_num_results to numberOfResults evenNone;
  filters=None does not alter existing filters. Non-None nondict filters writes filters=None; dict operator wins
  over and/or, then compound helper, else AWS-shaped dict unchanged. Ignore ranking_options and other fields regardless
  of drop_params; do not invent unsupported errors. retrieval_configuration: Query list joins with spaces; otherwise
  preserve query. retrievalQuery.text=query. For dict extra_body, deepcopy truthy retrievalConfiguration then retrieval_configuration
  then{}; canonical falsey permits snake-case fallback. Explicit non-None search max_num_results overwrites vectorSearchConfiguration.numberOfResults;
  explicit non-None filters overwrites filter. Different non-None prior values log the exact source override diagnostics.
  Existing unknown retrieval fields remain; emit retrievalConfiguration only if truthy. The transformer expects
  max_num_results, not the earlier mapper output key numberOfResults, so keep these seams distinct. knowledge_base_response_error:
  Any parse/shape/projection error is caught and becomes B682 with str(error),raw response status/headers, even200.
  No independent HTTP-status rejection. Successful parseable result at non200 still projects; do not add a provider-local
  status policy.


  Load userContext, user_context through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest knowledge_base_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Deployment userContext/user_context defaultNone; the loader preserves their supplied structured values for source
  precedence, rather than inserting a default identity. Request extra_body remains the higher-priority source.


  Write standalone Rust test knowledge_base_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test knowledge_base_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/vector_stores.rs with adjacent tests under vector_stores/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function vector_stores_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  filter_operator_map, nested_and_or_filters, knowledge_base_retrieve_url, user_context, location_file_id_name,
  attributes_and_scores, unsupported_create, option_mapping, retrieval_configuration, knowledge_base_response_error.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_vector_stores* using HelperCase:
  kind: helper and the externally tagged bedrock_services_vector_stores variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_vector_stores that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_knowledge_base_reply consumes knowledge-base retrieval JSON bytes in crates/betterlite-bedrock/src/vector_stores.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_vector_stores.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_vector_stores.
  The adjacent test replays_the_bedrock_services_vector_stores_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 285 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 280 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 60 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 800 planned, 800 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/vector_stores.rs
  - crates/betterlite-bedrock/src/vector_stores/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/services_vector_stores.rs
  - tools/oracle/src/helpers/bedrock/services_vector_stores/**
  - tools/oracle/helpers/bedrock_services_vector_stores.py
  - tools/oracle/helpers/bedrock_services_vector_stores/**
  - tools/oracle/cases/helpers/providers/bedrock-services-vector-stores/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_services_vector_stores*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_vector_stores.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_services_vector_stores/**
  - crates/betterlite-config/Cargo.toml
  - crates/betterlite-config/fuzz/corpus/config_yaml/knowledge_base*
  - crates/betterlite-config/src/sections/bedrock_services_vector_stores.rs
  - crates/betterlite-config/src/sections/bedrock_services_vector_stores/**
  lint_tables: false
