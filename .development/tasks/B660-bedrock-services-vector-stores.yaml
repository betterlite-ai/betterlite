  why: >-
    Own BedrockVectorStoreConfig.__init__, BedrockVectorStoreConfig.get_error_class, BedrockVectorStoreConfig.get_auth_credentials,
    BedrockVectorStoreConfig.get_vector_store_endpoints_by_type, BedrockVectorStoreConfig.get_supported_openai_params,
    BedrockVectorStoreConfig._map_operator_to_aws, BedrockVectorStoreConfig._map_operator_filter, BedrockVectorStoreConfig._map_and_or_filters,
    BedrockVectorStoreConfig.map_openai_params, BedrockVectorStoreConfig.validate_environment, BedrockVectorStoreConfig.get_complete_url,
    BedrockVectorStoreConfig.transform_search_vector_store_request, BedrockVectorStoreConfig._user_context, BedrockVectorStoreConfig.sign_request,
    BedrockVectorStoreConfig._get_file_id_from_metadata, BedrockVectorStoreConfig._get_filename_from_metadata, BedrockVectorStoreConfig._get_attributes_from_metadata,
    BedrockVectorStoreConfig.transform_search_vector_store_response, BedrockVectorStoreConfig.transform_create_vector_store_request,
    BedrockVectorStoreConfig.transform_create_vector_store_response. Other functions in this file remain with the
    owners listed below.
