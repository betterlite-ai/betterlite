out_of_scope:
  - "litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py: B3720 owns all records
    and chunk operations (L150-L196, L1389-L1738). B3722 owns redaction, logging and exception
    handling (L210-L219, L1280-L1387, L2092-L2148, L2176-L2486). B3723 owns guardrail initialization,
    credentials and transport (L1-L148, L232-L330, L339-L375, L758-L861, L1740-L1815, L2150-L2174).
    B3724 owns ApplyGuardrail execution with retries (L863-L1278). B3725 owns InvokeGuardrailChecks
    (L1819-L2090). B3726 owns streaming hooks and call-type selection (L222-L229, L332-L337,
    L2488-L2695, L2733-L2905). B3727 owns incremental scanning and generic apply entry point (L3063-L3286)."
  - "The framework utility effective_scan_only_tool_results_for_guardrail is called at L672 but
    not defined in this LiteLLM file; it belongs to B2226 (shared local TTL cache primitives, guardrail framework initialization)."
  - "Wire-format record constructors (ChatCompletionUserMessage, Choices, StreamingChoices, TextChoices)
    are consumed from litellm imports, not built by this task."
pitfalls:
  - "The scanned_slice tracking requires exact alignment: when experimental_use_latest_role_message_only
    filters the structured_messages, _locate_message_texts_slice must detect length mismatch and return
    None, triggering the safe fallback-to-original behavior rather than misapplying masked content."
  - "The contextual_grounding_from_messages fallback triggers only when explicit grounding tags are
    absent AND the configured flag is true; if no explicit tags are present and the flag is false,
    return an empty grounding list (no automatic derivation)."
  - "INPUT requests must never attach grounding qualifiers, even when the source's grounding_source/query
    tags are present, so a caller cannot bypass input-safety policies with grounding metadata."
  - "Masked-text extraction stops at the first None or missing outputs field; an empty outputs list
    returns an empty masked-text list (allowing pass-through of originals)."
