dod:
  - text: Text extraction and grounding-source selection honors system/developer role constraints and INPUT content remains unqualified.
    proof: [message-selection-tests, helper-python, helper-case-corpus]
  - text: Latest-user selection, role-subset filtering and scanned-slice tracking preserve message alignment for write-back or safely skip masking on mismatch.
    proof: [message-selection-tests, helper-python, helper-case-corpus]
  - text: Contextual-grounding fallback derives automatic grounding from plain messages when configured and no explicit tags are present.
    proof: [message-selection-tests, helper-python, helper-case-corpus]
  - text: Masked-text extraction and application across string/list/choice content respects index tracking and applies to messages and model responses.
    proof: [masking-tests, helper-python, helper-case-corpus]
  - text: Unaligned role-subset scans return originals rather than corrupting positions, with a warning logged.
    proof: [message-selection-tests, helper-python, helper-case-corpus]
