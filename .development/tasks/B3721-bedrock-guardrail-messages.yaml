id: B3721
title: Bedrock guardrail message selection and masking
description: >-
  Build text extraction, trusted grounding-source selection, latest-user selection
  and positional write-back into messages. Preserve INPUT content unqualified, honor
  system/developer grounding sources only, and retain the source's behavior when masked
  output cannot be aligned.

  Text extraction flattens message content (string or list of content blocks) into blocks
  with optional qualifiers (grounding_source, query, guard_content). Grounding selection
  harvests tagged blocks from messages, prioritizing explicit tags over plain-message
  fallback, and restricts grounding_source to system/developer roles to prevent user
  content from forging evidence. Latest-user selection splits messages for the experimental
  role-based filtering feature, returning the target message(s) and the original message
  list for write-back tracking.

  Masking write-back merges guardrail output (masked and filtered messages) into the
  original message structure, preserving positions when a role-selected subset was
  scanned and aligned, falling back to unmasked originals when alignment fails, and using
  masked output directly when the whole list was scanned.

  Direct dependency: B3720 for QualifiedTextBlock, BedrockRequest, BedrockContentItem,
  BedrockTextContent, GuardrailMessageFilterResult and ApplyGuardrailMessageSelection.
  Unresolved call: effective_scan_only_tool_results_for_guardrail (B2226). The architect
  must add `pub mod bedrock_message_selection` and `pub mod bedrock_masking` to
  crates/betterlite-guardrails/src/lib.rs and pre-register "bedrock_messages" in
  tools/oracle/src/helpers/guardrails.rs before dispatch.
