      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock-messages-*")" && grep -rlq "bedrock_messages" tools/oracle/fuzz/corpus/helper_case/bedrock-messages-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
