deviations:
  - what: "GET /debug/asyncio-tasks, /memory-usage (when enabled), /debug/memory/summary, /debug/memory/details, and POST /debug/memory/gc/configure return HTTP 501 with error.type=unsupported_runtime and error.code=unsupported_runtime."
    why: Native Rust runtime has no Python interpreter to query asyncio tasks, tracemalloc snapshots, GC generations, Python object counts or memory state. Return 501 instead of fabricating empty or fabricated responses.
  - what: Cache state snapshot is injected through server initialization, not read from proxy_server globals.
    why: betterlite separates cache management from route dispatch. Cache views are typed parameters, not shared global state.
  - what: Process memory information uses system APIs (psutil equivalent or /proc filesystem) instead of Python-specific tools.
    why: Native Rust cannot access Python object heap or CPython internals. Platform OS APIs provide comparable memory data.
out_of_scope:
  - GET /debug/report route and its proxy-admin-only 403 check; owned by B4171.
  - Request decoding, HTTP status mapping, error message formatting; owned by B003.
  - ProxyState and scheduled job state access; managed by B4172 and its callers.
  - Authentication pipeline implementation; owned by B052.
  - Cache read/write operations; B4173 provides readonly snapshots.
  - OpenTelemetry exporter lifecycle; routes read the already-running exporter.
pitfalls:
  - >-
    GET /debug/asyncio-tasks, /memory-usage (when enabled), /debug/memory/summary, /debug/memory/details, and POST /debug/memory/gc/configure
    return HTTP 501 with error.type=unsupported_runtime and error.code=unsupported_runtime, not empty responses or fabricated healthy metrics.
    Never return a 200 response pretending to provide Python runtime data from Rust.
  - >-
    Cache counts sum cache_dict and ttl_dict items; user_api_key_cache includes both in_memory_cache and key_object_cache.
    A single cache component may report twice the physical entries if both dicts hold data.
  - >-
    GET /memory-usage registers conditionally: only when LITELLM_PROFILE.lower() == "true". The route does not exist otherwise; requests get 404.
    Check at server startup, not per-request.
  - >-
    Span grouping uses span.parent.trace_id, not span.trace_id. Missing parent or missing trace_id returns results ungrouped.
    An absent exporter returns empty spans_grouped_by_parent and empty otel_spans; never return None.
  - >-
    GC configuration at startup happens at server initialization time, not at module import. Call it in the server startup path.
  - >-
    Cache-item routes expose sensitive contents (API keys, internal caches). Preserve the current permission model: authentication required, no admin check.
    Never silently add an admin-only restriction.
  - >-
    Memory percent thresholds use strict > (not >=) for 80 and 60; matching LiteLLM exactly determines critical/warning/healthy status.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
