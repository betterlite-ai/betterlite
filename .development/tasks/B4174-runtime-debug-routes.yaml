id: B4174
title: Authenticated memory and task debug routes
description: >-
  Register GET /debug/asyncio-tasks, /memory-usage, /memory-usage-in-mem-cache, /memory-usage-in-mem-cache-items, /debug/memory/summary, /debug/memory/details,
  POST /debug/memory/gc/configure and GET /otel-spans in betterlite-server.
  Each route requires authentication through B052's user_api_key_auth.

  GET /debug/asyncio-tasks, /memory-usage, /debug/memory/summary, /debug/memory/details and POST /debug/memory/gc/configure are unsupported in native Rust
  and return HTTP 501 with error.type=unsupported_runtime, error.code=unsupported_runtime because native runtime has no Python asyncio tasks, tracemalloc,
  or GC generations to inspect.

  GET /memory-usage-in-mem-cache and GET /memory-usage-in-mem-cache-items assemble responses from B4173 diagnostic snapshot functions.
  GET /memory-usage registers conditionally only when LITELLM_PROFILE is case-insensitive true; requests when unset return 404.
  Query parameter defaults for GET /debug/memory/details are top_n=20 and include_process_info=true.
  Cache item endpoints include TTL maps where LiteLLM includes them.
  GET /otel-spans groups spans by parent trace ID and uses 1,000,000 starting timestamp; absent exporter returns empty results.
  All handlers are live framework callbacks registered at startup through the debug router.

scope:
  paths:
    - crates/betterlite-server/src/debug_routes.rs
    - crates/betterlite-server/src/debug_routes/**
    - tools/oracle/cases/debug/tasks/**
