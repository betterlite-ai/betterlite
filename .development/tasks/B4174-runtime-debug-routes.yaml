dod:
  - text: GET /debug/asyncio-tasks registers and requires authentication, returning HTTP 501 with error.type=unsupported_runtime and error.code=unsupported_runtime because native Rust has no Python asyncio introspection.
    proof: [tasks-route-tests]
  - text: GET /memory-usage registers only when LITELLM_PROFILE is case-insensitive true and returns HTTP 501 with error.type=unsupported_runtime because native Rust has no tracemalloc; requests return 404 when LITELLM_PROFILE is unset or false.
    proof: [profiling-conditional-tests]
  - text: GET /memory-usage-in-mem-cache requires authentication and returns item counts for user_api_key_cache, llm_router_cache and proxy_logging_obj_cache.
    proof: [cache-counts-tests]
  - text: GET /memory-usage-in-mem-cache-items requires authentication and returns cache_dict and ttl_dict entries for all cache components.
    proof: [cache-items-tests]
  - text: GET /debug/memory/summary requires authentication, returning HTTP 501 with error.type=unsupported_runtime and error.code=unsupported_runtime because native Rust cannot measure Python memory metrics.
    proof: [summary-tests]
  - text: GET /debug/memory/details requires authentication, defaults are top_n=20 and include_process_info=true, returning HTTP 501 with error.type=unsupported_runtime and error.code=unsupported_runtime because native Rust cannot measure Python memory metrics.
    proof: [details-defaults-tests]
  - text: POST /debug/memory/gc/configure requires authentication, defaults are generation_0=700, generation_1=10, generation_2=10, returning HTTP 501 with error.type=unsupported_runtime and error.code=unsupported_runtime because native Rust has no Python GC to configure.
    proof: [gc-configure-tests]
  - text: GET /otel-spans requires authentication and returns otel_spans grouped by parent trace ID with 1,000,000 starting timestamp.
    proof: [spans-tests]
  - text: All routes with include_in_schema=false in LiteLLM are excluded from OpenAPI schema in betterlite.
    proof: [schema-tests]
checks:
  optional: []
  commands:
    - id: tasks-route-tests
      why: GET /debug/asyncio-tasks does not register, does not authenticate, or does not return HTTP 501 with unsupported_runtime error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::asyncio_tasks::/) - test(/replays_the_/)'
    - id: profiling-conditional-tests
      why: GET /memory-usage is not conditional on LITELLM_PROFILE, or does not return 501 when enabled, or does not return 404 when disabled
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::memory_usage::/) - test(/replays_the_/)'
    - id: cache-counts-tests
      why: GET /memory-usage-in-mem-cache does not register, does not authenticate, or counts are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::cache_counts::/) - test(/replays_the_/)'
    - id: cache-items-tests
      why: GET /memory-usage-in-mem-cache-items does not register, does not authenticate, or cache/TTL dicts are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::cache_items::/) - test(/replays_the_/)'
    - id: summary-tests
      why: GET /debug/memory/summary does not register, does not authenticate, or does not return HTTP 501 with unsupported_runtime error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::memory_summary::/) - test(/replays_the_/)'
    - id: details-defaults-tests
      why: GET /debug/memory/details does not register, does not authenticate, or does not return HTTP 501 with unsupported_runtime error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::memory_details::/) - test(/replays_the_/)'
    - id: gc-configure-tests
      why: POST /debug/memory/gc/configure does not register, does not authenticate, or does not return HTTP 501 with unsupported_runtime error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::gc_configure::/) - test(/replays_the_/)'
    - id: spans-tests
      why: GET /otel-spans does not register, does not authenticate, or span grouping by parent trace ID is broken
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^debug_routes::otel_spans::/) - test(/replays_the_/)'
    - id: schema-tests
