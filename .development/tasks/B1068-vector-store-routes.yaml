id: B1068
title: Vector-store retrieve, list, update and delete routes
description: >-
  Implement server::api::vector_store_routes with GET /v1/vector_stores/{vector_store_id} and
  /vector_stores/{vector_store_id}, GET /v1/vector_stores and /vector_stores, POST and DELETE on both
  id paths. These are ordinary single-segment ids, unlike search's path converter. Call B1067's registry
  overlay/access helper for retrieve/update/delete, B1100 for update JSON, B004 for processing with
  avector_store_retrieve/list/update/delete and model=null, and B1065/B1066 SDK services. B003 auth and
  B732 identities apply to every alias. Forward the injected common processor settings without new defaults.

  List binds after/before=null,limit=20,order=desc from query; retrieve/delete start from the path id only.
  Update inserts its path id only if the body has no vector_store_id key. Preserve that observable choice
  and the fact that access/registry lookup still uses the path id. Compare real proxy HTTP, including
  mismatched ids, rather than invoking handlers through helpers. Four complete handlers at 286-545 contain
  239 nonblank/non-comment lines. Allow 200 implementation, 170 tests, 150 fixtures and 55 decoder/wiring
  lines, 575 total. Reuse B1100's decode_request_body and corpus for update bytes.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/vector_store_routes.rs
  - crates/betterlite-server/src/api/vector_store_routes/**
  - crates/betterlite-server/fuzz/corpus/request_body/vector-store-routes-*
  - tools/oracle/cases/api/vector-store-routes/**
  - tools/oracle/helpers/b1068.py
  - tools/oracle/helpers/b1068/**
  - tools/oracle/src/helpers/server/b1068.rs
  - tools/oracle/src/helpers/server/b1068/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/endpoints.py#L286-L545
  why: Complete decorators and handlers specify the eight paths, query defaults and update's conditional id insertion.
dod:
- text: >-
    retrieve_and_delete_use_path sends GET/DELETE for vs_a on both aliases with JSON
    {vector_store_id:vs_body,custom_llm_provider:other} and query extra_query=ignored. Only path vs_a
    enters processing; mock upstream GET returns {id:vs_a,object:vector_store} and DELETE returns
    {id:vs_a,object:vector_store.deleted,deleted:true}, both 200. No request-body parsing or list query
    extraction occurs. Registry credentials overlay after access; denied store yields B1060's 403 detail
    envelope with no provider request. Unknown store keeps the path-only data.
  proof: [route-tests, oracle, new-cases]
- text: >-
    list_query_defaults reaches both list aliases without arguments and expects upstream
    limit=20,order=desc. ?after=&before=vs_z&limit=0&order=sideways retains each literal, with no range/order
    validation. ?limit=bad produces 422 detail validation at query.limit, without error type/param/code.
    JSON body {limit:99} and unrecognized query fields are ignored. The provider's data,has_more,first_id,
    last_id are returned unchanged at 200. List never calls the per-store registry overlay.
  proof: [route-tests, oracle]
- text: >-
    update_body_id_is_not_overwritten sends POST /v1/vector_stores/vs_path and its alias with
    {vector_store_id:vs_body,name:renamed,metadata:{tag:x}}. Registry/access checks use vs_path but upstream
    update uses vs_body. Omit the key and upstream uses vs_path; present null remains null and fails the SDK
    path-id validation before HTTP. Registry litellm_params may override caller fields, including that id.
    Mock {id:vs_body,object:vector_store,name:renamed} returns 200. Malformed update JSON follows B1100's
    400 invalid_request_error,param=request_body,code="400" with no upstream request.
  proof: [route-tests, oracle, body-corpus]
- text: >-
    store_route_auth_and_errors exercises all eight registrations with missing/invalid bearer keys
    (401,authentication_error,param=null,code="401") and configured valid key (one provider send with
    provider Authorization, never the proxy key). Provider 404 becomes 404,not_found_error,param=null,
    code="404" through B004, and 429 becomes 429,rate_limit_error,param=null,code="429" with Retry-After.
    Compare application/json and standard processor headers; message wording uses the README ignore rule.
    A slash-containing decoded id does not match these single-segment routes and returns 404 detail="Not Found".
  proof: [route-tests, oracle]
checks:
  optional: []
  commands:
  - id: route-tests
    why: one of the read/write aliases changes data extraction or error processing
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_store_routes::tests::/) - test(/::replays_corpus$/)'
  - id: new-cases
    why: the eight routes have no new HTTP parity cases
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/vector-store-routes)"
  - id: body-corpus
    why: conditional update id insertion has no decoded input regression
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/request_body/vector-store-routes-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/api/vector-store-routes/retrieve-and-delete-use-path.yaml
- tools/oracle/cases/api/vector-store-routes/list-query-defaults.yaml
- tools/oracle/cases/api/vector-store-routes/update-body-id-is-not-overwritten.yaml
- tools/oracle/cases/api/vector-store-routes/store-route-auth-and-errors.yaml
deviations: []
out_of_scope:
- B1067 owns the shared registry helpers, search/create and index routes in this file. Do not register them here.
- B004 owns common processing and exception conversion; B1065/B1066 own SDK dispatch. B1060 owns the access predicate behind B1067.
pitfalls:
- Update checks registry access for the path id even when a body id determines the upstream target.
- GET and DELETE ignore JSON bodies, while POST update reads one.
- The list handler does not constrain order to asc or desc and does not clamp limit=0.
review_level: security
budget:
  max_changed_lines: 640
  max_new_expects: 0
