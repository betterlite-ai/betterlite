dod:
  - text: Every reachable shared selector receives the expected populated IDs, labels, policy metadata and response envelope through the booted gateway.
    proof: [selector-cases, oracle, selector-components]
  - text: Model flags, MCP/team scope, raw agent arrays, guardrail fallback and public versus authenticated settings retain their actual client contracts.
    proof: [oracle, selector-components]
checks:
  optional: []
  commands:
    - id: selector-cases
      why: Page lookups have only helper or empty catalog coverage.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/management-selectors)"
    - id: selector-components
      why: The selector cannot consume the real wire envelope despite backend equality.
      run: bash tools/dashboard/build.sh check ui/dashboard/tests/management-selectors
oracle_cases:
  - tools/oracle/cases/ui/management-selectors/models-ui-flags-and-team-scope.yaml
  - tools/oracle/cases/ui/management-selectors/model-groups-for-router-fallbacks.yaml
  - tools/oracle/cases/ui/management-selectors/openapi-form-schema-read.yaml
  - tools/oracle/cases/ui/management-selectors/budget-options-array.yaml
  - tools/oracle/cases/ui/management-selectors/mcp-servers-and-group-labels.yaml
  - tools/oracle/cases/ui/management-selectors/mcp-toolsets-and-tools.yaml
  - tools/oracle/cases/ui/management-selectors/agents-raw-list.yaml
  - tools/oracle/cases/ui/management-selectors/vector-store-options-no-page-query.yaml
  - tools/oracle/cases/ui/management-selectors/search-and-skill-options.yaml
  - tools/oracle/cases/ui/management-selectors/guardrail-v2-and-v1.yaml
  - tools/oracle/cases/ui/management-selectors/policy-names-and-resolved-guardrails.yaml
  - tools/oracle/cases/ui/management-selectors/prompt-and-tag-options.yaml
  - tools/oracle/cases/ui/management-selectors/router-and-passthrough-options.yaml
  - tools/oracle/cases/ui/management-selectors/public-ui-and-authenticated-sso-settings.yaml
deviations: []
out_of_scope:
  - B9090 keeps every unchanged permissions component and helper; the named route owners and mount tasks implement all catalogs.
  - Type-only imports from useBudgets and model/auto-router modules do not make their unused functions page calls; no budget mutation, /v2/model/info or auto-router endpoint is added here. The live /model_group/info request is covered above.
  - key_team_helpers/filter_helpers.fetchTeamFilterOptions and fetchAllOrganizations have no production caller at the pin; fetchAllTeams is called only by the logs page, whose workflow belongs to B147.
  - The browser session/bootstrap/static behavior is B144; B145 composes page interactions after this part's selector contracts exist.
pitfalls:
  - getAgentsList returns a local agents wrapper around a raw HTTP array.
  - VectorStoreListCall's unused page parameters must not appear in a supposedly exact page request.
  - MCP string access groups and unified access-group records have different endpoints and shapes.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
