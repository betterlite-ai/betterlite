id: B5842
title: Watsonx embeddings, rerank, audio transcription and passthrough
description: >-
  Last part of the watsonx.ai provider (litellm/llms/watsonx). B5970 built the shared auth and URL functions, B5971 chat
  and B5972 text generation. This task builds the other four endpoint families, each using B5970 for credentials, error
  type, base URL, version suffix and payload ids. B4808 is a different thing (Watsonx Orchestrate agents under
  a2a_protocol) and shares no code with this folder.

  Embeddings (crates/betterlite-provider/src/watsonx_embed.rs, IBMWatsonXEmbeddingConfig). No OpenAI params are
  supported and map_openai_params returns the options unchanged. The request runs B5970's get_api_params on the options
  (removing project, space and region keys), then builds {inputs, parameters: the remaining options, then the
  prepare_payload fields}. A string input becomes a one-item list, a list is sent as is, and a non-empty list whose first
  item is an integer or a list (token ids) fails with the error "WatsonX embeddings require a string or list of strings".
  The URL is the base without trailing slashes plus /ml/v1/text/embeddings and the version suffix (popping api_version);
  a deployment/<id> model gets the same path because the path has no placeholder. The reply gives data items
  {object: embedding, index: position, embedding: values} from results, object list, and usage with prompt and total
  tokens equal to input_token_count (default 0) and completion tokens 0. decode_watsonx_embedding_reply(bytes) is the typed
  decoder and fails when a result lacks embedding.

  Rerank (crates/betterlite-provider/src/watsonx_rerank.rs, IBMWatsonXRerankConfig, records from B1013). The URL is the
  base plus /ml/v1/text/rerank plus the version suffix, reading api_version without popping it. The cohere params are
  query, documents, top_n, return_documents, max_tokens_per_doc. validate_environment returns the two default headers
  overlaid with the caller headers when Authorization is present, else pops token (or WATSONX_TOKEN) for Bearer, else
  pops zen_api_key (or WATSONX_ZENAPIKEY) for "ZenApiKey", else Bearer with B5970's IAM token. map_cohere_rerank_params
  keeps query, turns documents into inputs ({text: s} for strings, objects unchanged), puts top_n at
  parameters.return_options.top_n, a boolean return_documents at parameters.return_options.inputs and max_tokens_per_doc
  at parameters.truncate_input_tokens, copies project_id and space_id, and ignores None values and every other key.
  transform_rerank_request runs get_api_params on the mapped map in place and returns it overlaid with the prepare_payload
  fields. The reply gives {index, relevance_score from score} per result plus document {text} for a string input or the
  input object, id from the body or a new UUID4, and meta.tokens.input_tokens from input_token_count (default 0). A body
  that is not JSON fails with WatsonxError using the response status; a body without results fails with "No results found
  in the response=<body>". decode_watsonx_rerank_reply(bytes) is the typed decoder.

  Audio transcription (crates/betterlite-openai/src/watsonx_audio.rs, IBMWatsonXAudioTranscriptionConfig over B515's
  Whisper config). Headers come from B5970's validate_environment with Content-Type removed. Supported params: language,
  prompt, response_format, temperature, timestamp_granularities. The multipart form has model, then project_id (from
  project_id or watsonx_project) or else space_id, only when given (no env fallback, no 401), then every supported option
  that is not None in options order; the file part is B1001's processed filename, bytes and content type. The URL is the
  base without trailing slashes plus /ml/v1/audio/transcriptions?version= with api_version or 2024-03-13, not popped. The
  reply needs text or usage (else an error that includes the body), keeps both, drops model, and keeps every other key.
  decode_watsonx_transcription_reply(bytes) is the typed decoder.

  Passthrough (crates/betterlite-openai/src/watsonx_passthrough.rs, WatsonxPassthroughConfig over B3570). is_streaming_request
  returns request_data["stream"] with default false. get_complete_url takes api_base or B5970's get_base_url (401 when
  neither exists) and B3570's format_url(endpoint, base, query params) and returns (url, base). get_api_key returns the
  argument or B5970's credentials api_key; get_base_model returns the model unchanged; validate_environment is B5970's.
