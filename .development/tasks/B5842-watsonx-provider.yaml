dod:
  - text: Embedding requests and replies match the source, including token-id rejection and the shared path for deployment models.
    proof: [watsonx-endpoints-tests, oracle]
  - text: Rerank parameter mapping, auth headers, request and reply conversion match the source, including the two failure messages.
    proof: [watsonx-endpoints-tests, oracle]
  - text: Transcription form fields, URL and reply conversion match the source.
    proof: [watsonx-endpoints-tests, oracle]
  - text: Passthrough URL, streaming flag, key and base model match the source.
    proof: [watsonx-endpoints-tests, oracle]
  - text: The embedding, rerank and transcription reply decoders reject malformed bodies without panicking and their corpora replay.
    proof: [watsonx-endpoints-corpus]
  - text: New helper cases for these functions exist.
    proof: [watsonx-endpoints-cases]
checks:
  optional: [mutants]
  commands:
    - id: watsonx-endpoints-tests
      run: cargo nextest run --locked -p betterlite-provider -p betterlite-openai --no-tests=fail -E 'test(/^(watsonx_embed|watsonx_rerank|watsonx_audio|watsonx_passthrough)::/) - test(/^replays_the_watsonx_/)'
      why: Each family has its own URL, header and body rules that a generic OpenAI-shaped config would get wrong.
    - id: watsonx-endpoints-corpus
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/watsonx_embed_rerank_reply.rs && test -f crates/betterlite-openai/fuzz/fuzz_targets/watsonx_transcription_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/watsonx_embed_rerank_reply crates/betterlite-openai/fuzz/corpus/watsonx_transcription_reply)" && cargo nextest run --locked -p betterlite-provider -p betterlite-openai --no-tests=fail -E 'test(replays_the_watsonx_embed_rerank_reply_corpus) + test(replays_the_watsonx_transcription_reply_corpus)'
      why: Reply bodies come from outside and need fuzz targets with replayed corpora.
    - id: watsonx-endpoints-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/watsonx-endpoints)"
      why: Without new case files the oracle proof passes with nothing compared.
