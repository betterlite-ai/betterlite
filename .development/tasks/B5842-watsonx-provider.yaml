  - tools/oracle/cases/helpers/watsonx-endpoints/passthrough-url-and-key.yaml
deviations: []
out_of_scope:
  - B5970 owns IBMWatsonXMixin, get_api_params, the IAM token, WatsonxError and the endpoint paths used here.
  - B5971 owns chat and B5972 owns text generation and the prompt functions.
  - B1013 owns BaseRerankConfig and the rerank records, B515 the Whisper config this one extends, B1001 process_audio_file, and B3570 BasePassthroughConfig and format_url. get_models on the passthrough config only calls the base method, which B3570's covers own.
  - B3627 owns the /watsonx proxy route in llm_passthrough_endpoints.py, including the version query parameter it adds. B042 owns the main.py and rerank_api/main.py credential call sites, dispatch wiring and HTTP oracle cases.
pitfalls:
  - 'The oracle helper for this task is pre-registered as b5842 by the skeleton. Write its Rust and Python files as the skeleton leaves them; the registry files are not this task''s to edit.'
  - Embedding deployment models get no deployment path because EMBEDDINGS has no placeholder, so format changes nothing.
  - The rerank validate_environment pops token from the options, while the shared one reads it with get. An early Authorization header returns before any pop.
  - The passthrough get_complete_url docstring says it always adds version, but the code does not; the proxy route adds it through the query parameters.
  - The transcription model field is the model string as received, and a missing project_id and space_id is not an error here, unlike chat and text.
  - The audio config puts the Watsonx mixin before the Whisper config, so its error class is WatsonxError, not the OpenAI one.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
