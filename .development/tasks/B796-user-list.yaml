id: B796
title: User lists, search and organization scoping
description: >-
  Implement /user/list and /user/filter/ui with typed pagination/sort/search and organization/team scope
  resolution. Keep key counts batched and source role restrictions, including scope_user_search_to_org=false
  default; all SQL filters are bound.


  Build the production user_list module in betterlite-server; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  get_user_key_counts (L2067-L2101; 28 source lines), _validate_sort_params (L2104-L2133; 24 source lines),
  _authorize_user_list_request (L2136-L2199; 58 source lines), get_users (L2224-L2388; 135 source lines).


  Register these actual HTTP routes and aliases exactly once: GET /user/list -> get_users. For each route
  send a typed successful request, an invalid or missing target, and a caller lacking that route permission
  through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session routes
  instead prove bad credentials or invalid/expired codes. Compare status, response model including null/absent
  fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by where read.
  Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls management
  error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 245 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  245 production, 139 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 449 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
