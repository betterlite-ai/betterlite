id: B796
title: User lists, search and organization scoping
description: >-
  Implement only authenticated GET /user/list; B1203 owns /user/filter/ui and its
  scope_user_search_to_org setting. This route reads no configuration setting and has no
  management_endpoint_wrapper or local except block. Defaults are role,user_ids,sso_user_ids,
  user_email,search,team,sort_by,organization_ids=null; page=1 (minimum 1), page_size=25
  (1..100),sort_order=asc. Unknown query fields are ignored; the actual SSO selector is
  sso_user_ids, not the docstring's sso_ids. Cases query_defaults, page_bounds_422,
  unknown_query_ignored and sso_selector_spelling compare HTTP behavior.

  Missing DB raises HTTPException 500 detail.error='No db connected. prisma client=None'
  before authorization. Admin-view roles proxy_admin/proxy_admin_viewer keep organization_ids
  unchanged. Others need non-null caller ID, then B736 get_user_object(user_id_upsert=false)
  with cache/logging collaborators. Only ValueError is translated; null row or no org_admin
  memberships also raises 403 detail.error='Only proxy admins and organization admins can list
  users.'. Unexpected lookup errors propagate to outer 500. The role label alone grants nothing.
  Cases database_before_scope, admin_view_unrestricted, membership_role_required,
  caller_missing_value_error_403 and lookup_failure_500 cover the distinction.

  Collect organization IDs for memberships whose role is exactly org_admin, retaining empty
  IDs and duplicates. For a truthy requested string, split commas, strip/drop blanks and
  intersect sets; empty intersection raises 403 detail.error='You do not have org_admin access
  to the requested organization(s).'. Otherwise use all allowed IDs. Join with commas; ordering
  of the set intersection is not a wire guarantee. Cases org_scope_default,
  requested_org_intersection, requested_blanks_forbidden and duplicate_org_memberships.
  A stored org_admin membership whose ONLY organization_id is empty string passes the nonempty
  membership-list check, joins to empty, and produces no org filter later; preserve this source
  edge in empty_org_id_filter_gap instead of inventing validation in this handler.

  Build conjunctive filters: truthy role is exact, with no role-enum validation; truthy user_ids
  splits/strips/drops blanks, then ONE ID uses case-insensitive contains, zero or multiple use
  exact IN. Non-null user_email uses insensitive contains even for empty string. Non-null team
  uses teams.has even for empty string. Non-null sso_user_ids uses split/strip/drop-blank exact
  IN, including empty IN. Truthy organization_ids adds membership.some organization_id IN only
  when the stripped list is nonempty. Merge B1203 _user_search_where: falsey search adds nothing,
  otherwise OR of insensitive user_id/user_email contains without trimming. AND it with other
  filters, removing only top-level null predicates. Cases role_unknown_empty_result,
  single_id_contains_multiple_ids_exact, comma_only_ids_empty_in, email_empty_not_omitted,
  team_empty_not_omitted, sso_empty_in, admin_blank_org_filter_omitted, search_and_filters,
  search_whitespace_and_wildcards pin the precise Postgres predicates. Bind all values.

  With null sort_by, ignore even invalid sort_order and use created_at desc. Otherwise allowed
  columns are exactly user_id,user_email,created_at,spend,user_alias,user_role (case-sensitive).
  Invalid column returns 400 detail.error listing those six in that order. Lowercase sort_order
  must be asc/desc, without stripping; otherwise 400 detail.error="Invalid sort order. Must be
  'asc' or 'desc'". Cases default_sort_ignores_order, sort_columns_and_case,
  sort_order_case_not_whitespace and sort_column_error_first verify order validation.

  Query users with skip=(page-1)*page_size,take=page_size and selected order, then count with the
  SAME predicate, then count keys separately for EACH returned user in sequence. There is no
  transaction/snapshot across these reads and no batched key-count query. Empty user IDs skip
  key queries; duplicate IDs repeat reads and the last count replaces the map entry. Count
  all keys with matching user_id and team_id null OR not litellm-dashboard: blocked,expired,
  master and other-team keys still count. Cases page_count_then_keys, empty_page_no_key_queries,
  duplicate_key_count_reads, key_count_excludes_only_ui and separate_reads_can_race prove this.

  Return users,total,page,page_size,total_pages=ceil(total/page_size), with total_pages=0 for
  zero total, even when page is beyond the last. For each row dump, remove only the three
  directory metadata fields via B791 and validate B720 user model plus B124 key_count default0.
  B720 excludes password from serialization and normalizes null spend/models/teams; other
  user fields remain, including budget counters, memberships, reset flags and object permissions.
  Do not apply V1 user-info key filtering or master-return settings. Cases full_row_projection,
  password_excluded_by_model, directory_metadata_redacted, key_count_default_zero and
  total_pages_empty_and_out_of_range compare every field and null/default behavior.

  All owned HTTPExceptions use the outer {detail:...} envelope, with no OpenAI type/param/code.
  Unexpected repository/model failures reach B124's 500 internal_server_error envelope, absent
  param/code, subject to B731's database-unavailable classification. Cases handler_error_envelope
  and invalid_row_error_envelope compare the route; it never calls handle_exception_on_proxy.


  Build the production user_list module in betterlite-server; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  get_user_key_counts (L2067-L2101; 28 source lines), _validate_sort_params (L2104-L2133; 24 source lines),
  _authorize_user_list_request (L2136-L2199; 58 source lines), get_users (L2224-L2388; 135 source lines).


  HTTP cases use running pinned MIT and betterlite gateways. postgres_filter_queries and
  postgres_read_order use POSTGRES_TEST_URL or testcontainers with isolated schemas; unavailable
  infrastructure fails. No write/rollback test is appropriate for this read-only task.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Implement decode_user_list_query with B001's maintained query extraction, typed defaults and
  validation; no hand-written percent decoder. Add user_list_query to B770's existing server fuzz
  workspace for duplicate fields, percent escapes, invalid integers, comma lists and bounds.
  Consume the existing gateway URI-size limit, with no new setting. B2334 owns the response envelope.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 245 source lines before docstring removal including the route query declaration;
  allow 245 production, 330 behavior/Postgres tests, 65 wiring and 50 decoder/fuzz lines,
  690 changed lines within a 750-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
