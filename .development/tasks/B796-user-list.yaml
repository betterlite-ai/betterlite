dod:
  - text: Every named description case covers its exact filter, scope, sort, count or projection branch.
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: postgres_filter_queries and postgres_read_order prove actual filters, unbatched key counts
      and separate page/count reads against independent fixtures.
    proof:
      - postgres-tests
  - text: The production query decoder and its added corpus replay reject invalid pagination without panics.
    proof:
      - query-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_list::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual query/filter and ordered-read tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_list::tests::postgres_filter_queries$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_list::tests::postgres_read_order$/)'
    - id: query-corpus
      why: The named decoder fuzz target or newly added query corpus is missing or fails replay.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/user_list_query.rs
        && grep -q user_list_query crates/betterlite-server/fuzz/Cargo.toml
        && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/user_list_query)"
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_user_list_query_corpus)'
