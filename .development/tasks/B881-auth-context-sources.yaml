id: B881
title: SSO readiness and model request context utilities
description: >-
  Resolve SSO provider readiness from explicitly configured credential/endpoint inputs, and model context
  aliases from catalog snapshots. Keep readiness separate from actual SSO login, which B063 owns. Model
  normalization does not grant permission. Secret abbreviation is only for source-compatible response
  params and never a logging license.


  Build the production auth_context_sources module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  has_user_setup_sso (L1431-L1451; 19 source lines), _is_google_ready (L1454-L1455; 2 source lines), _is_microsoft_ready
  (L1458-L1463; 6 source lines), _is_generic_oauth_ready (L1466-L1473; 8 source lines), _is_saml_ready
  (L1476-L1490; 7 source lines), is_sso_provider_fully_configured (L1493-L1508; 15 source lines), abbreviate_api_key
  (L2086-L2089; 4 source lines). litellm/proxy/auth/user_api_key_auth.py: _get_model_from_request_context
  (L206-L221; 16 source lines), _normalize_claude_model (L230-L255; 25 source lines), _resolve_router_settings_model_group_alias
  (L258-L293; 35 source lines), _get_model_names_for_budget_checks (L296-L303; 8 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): MICROSOFT_CLIENT_ID=None;
  GOOGLE_CLIENT_ID=None; GENERIC_CLIENT_ID=None; SAML_IDP_METADATA_URL=None; SAML_IDP_METADATA_XML=None;
  GOOGLE_CLIENT_SECRET=None; MICROSOFT_CLIENT_SECRET=None; MICROSOFT_TENANT=None; GENERIC_CLIENT_SECRET=None;
  GENERIC_AUTHORIZATION_ENDPOINT=None; GENERIC_TOKEN_ENDPOINT=None; GENERIC_USERINFO_ENDPOINT=None; MINIMUM_CUSTOM_KEY_LENGTH=16.


  Add the auth_context_sources operation under B856 Management::auth. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a auth-context-sources-* seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::auth_context_sources::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 145 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  145 production, 142 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 467 changed lines estimated within a 475-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_context_sources::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
