id: B881
title: SSO readiness and model request context utilities
description: >-
  Resolve SSO provider readiness from explicitly configured credential/endpoint inputs, and model context
  aliases from catalog snapshots. Keep readiness separate from actual SSO login, which B063 owns. Model
  normalization does not grant permission. Secret abbreviation is only for source-compatible response
  params and never a logging license.

  Discovery considers any Microsoft/Google/generic client ID that is not None, including empty string,
  or truthy SAML metadata URL/XML. Readiness is stricter: Google needs truthy ID and secret; Microsoft
  also tenant; generic needs ID, secret and all authorization/token/userinfo endpoints. Any complete
  provider suffices even when another is incomplete. SAML requires metadata plus an available runtime;
  LiteLLM catches missing onelogin.saml2.auth as false. Own a runtime-capability input installed by B063,
  initially unavailable, rather than importing or depending on the SSO route installer. No URL is fetched
  by readiness. All env settings default absent. MINIMUM_CUSTOM_KEY_LENGTH is int(env, default 16):
  invalid text stops startup, zero/negative values are not clamped. Abbreviation returns sk-... below
  that length, otherwise sk-... plus the last four characters; credentials stay secret-typed.

  _get_model_from_request_context delegates to B746 with B1100's safe headers/query values, request,
  router and team. Budget names preserve list order/duplicates, wrap a string once and turn None into [].
  Claude normalization runs only on /messages, /v1/messages, /chat/completions, /v1/chat/completions,
  /responses and /v1/responses, with a router and no literal-True litellm.claude_model_normalized marker.
  The resolved model must be a string identical to body.model and either start with claude-router-
  or case-insensitively end with [1m]. Resolve hierarchical aliases and call B007
  claude_code_requested_group with key aliases, team_model_aliases and hierarchical model_group_alias
  in that order. Mark the request normalized even if no source group is found, then use B1100
  rewrite_request_model only when there is a source. Preserve both decoded and raw request body views.

  Router alias rewriting requires request, router and B882's LLM route classification. Mark
  litellm.model_group_alias_resolved before checking B746 custom/provider passthrough dispatch, string
  model and B1100 raw JSON body availability. Get hierarchical settings and call B302 resolve_model_group_alias.
  None/self targets do nothing. Debug-log source/target with CR/LF removed; setdefault
  litellm.client_requested_model so an earlier client value survives, then rewrite the request.

  Move the small lower-level ProxyConfig helpers out of B124's unplanned proxy-server remainder into
  this task: _parse_router_settings_value L7646-L7671, get_hierarchical_router_settings L7673-L7679 and
  _get_hierarchical_router_settings L7681-L7725. Parse a dictionary directly or a YAML string, attempting
  JSON only after a YAML parse error. Only a nonempty dictionary is usable. Key router_settings wins;
  otherwise fetch the cached team through B737 and use its settings. Any team lookup/parse exception
  is silently dropped. Never merge key/team settings or consult global router_settings here. This
  removes a call to B124, which depends on the auth installer. Native callers share this implementation.


  Build the production auth_context_sources module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  has_user_setup_sso (L1431-L1451; 19 source lines), _is_google_ready (L1454-L1455; 2 source lines), _is_microsoft_ready
  (L1458-L1463; 6 source lines), _is_generic_oauth_ready (L1466-L1473; 8 source lines), _is_saml_ready
  (L1476-L1490; 7 source lines), is_sso_provider_fully_configured (L1493-L1508; 15 source lines), abbreviate_api_key
  (L2086-L2089; 4 source lines). litellm/proxy/auth/user_api_key_auth.py: _get_model_from_request_context
  (L206-L221; 16 source lines), _normalize_claude_model (L230-L255; 25 source lines), _resolve_router_settings_model_group_alias
  (L258-L293; 35 source lines), _get_model_names_for_budget_checks (L296-L303; 8 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): MICROSOFT_CLIENT_ID=None;
  GOOGLE_CLIENT_ID=None; GENERIC_CLIENT_ID=None; SAML_IDP_METADATA_URL=None; SAML_IDP_METADATA_XML=None;
  GOOGLE_CLIENT_SECRET=None; MICROSOFT_CLIENT_SECRET=None; MICROSOFT_TENANT=None; GENERIC_CLIENT_SECRET=None;
  GENERIC_AUTHORIZATION_ENDPOINT=None; GENERIC_TOKEN_ENDPOINT=None; GENERIC_USERINFO_ENDPOINT=None; MINIMUM_CUSTOM_KEY_LENGTH=16.


  Add the auth_context_sources operation under B856 Management::auth. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a auth-context-sources-* seed to B171 helper_case, which already owns this decoder.


  The context-source helpers need no SQL fixture: supply the configured SSO inputs, router aliases and
  request headers directly. B732 wiring tests prove that their resolved context reaches the installed
  stage; the helper corpus compares values and parse failures without pretending to authenticate a JWT.


  Write betterlite-config::auth_context_sources::tests::sso_env_absent_and_empty,
  google_env_pair, microsoft_env_triplet, generic_env_five_fields, saml_metadata_sources,
  minimum_key_default_override, minimum_key_invalid_startup and minimum_key_nonpositive.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  decode_router_settings(&[u8]) owns the moved YAML/JSON string boundary. Reuse B002's bounded YAML
  parsing primitives and B192 JSON decoder, cap input at 1048576 bytes/depth 64, and feed the production
  function from auth_context_sources fuzz target and replays_the_auth_context_sources_corpus. HTTP body
  decoding remains B1100's. Corpus seeds cover dictionaries, empty/scalar/list inputs, invalid YAML/JSON,
  JSON fallback and limits; parser failures become None as at the pin.


  Sizing: 145 original lines plus 50 moved helper lines before docstring removal; allow
  230 production, 260 behavior tests, 75 adapters, 65 wiring, 55 decoder/fuzz and 60 config lines,
  745 within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_context_sources::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
