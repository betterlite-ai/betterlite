dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: sso_complete, sso_missing_field,
      alias_normalization, model_budget_names, discovery_empty_client_id,
      readiness_all_companions, incomplete_provider_does_not_mask_other,
      saml_metadata_without_runtime, abbreviation_threshold_tail, budget_list_preserved,
      claude_six_routes_only, claude_marker_skip, claude_body_identity,
      claude_prefix_suffix_case, claude_marks_unresolved, claude_alias_order,
      router_marker_before_skip, passthrough_not_rewritten, nonjson_not_rewritten,
      alias_self_none_unchanged, log_crlf_stripped, client_model_setdefault,
      settings_key_before_team, empty_key_falls_back, global_settings_not_merged,
      team_error_silent_drop and settings_yaml_json_nonempty_object.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
  - text: settings_size_depth_limits and replays_the_auth_context_sources_corpus exercise the actual settings decoder and its fuzz input boundary.
    proof: [behavior-tests, parser-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: parser-corpus
      why: The new router-settings parser lacks its target or added replay inputs.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/auth_context_sources.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-auth/fuzz/corpus/auth_context_sources)" && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(replays_the_auth_context_sources_corpus)'
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_context_sources::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_context_sources.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-context-sources-*")"
        && grep -rlq "auth_context_sources" tools/oracle/fuzz/corpus/helper_case/auth-context-sources-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_context_sources::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-context-sources-*")"
        && grep -rlq "MICROSOFT_CLIENT_ID" crates/betterlite-config/fuzz/corpus/config_yaml/auth-context-sources-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_context_sources::tests::/)
        - test(/replays_the_/)'
