    - crates/betterlite-core/src/api/soniox.rs
    - crates/betterlite-core/src/api/soniox/**
    - crates/betterlite-core/src/api/soniox/pipeline.rs
    - crates/betterlite-core/src/api/soniox/pipeline/**
    - tools/oracle/src/helpers/core_ops/soniox_pipeline.rs
    - tools/oracle/src/helpers/core_ops/soniox_pipeline/**
    - tools/oracle/helpers/soniox_pipeline.py
    - tools/oracle/helpers/soniox_pipeline/**
    - tools/oracle/cases/helpers/soniox-pipeline/**
    - tools/oracle/fuzz/corpus/helper_case/soniox_pipeline*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/soniox/audio_transcription/handler.py#L358-L481
    why: Resource ownership, logging order and synchronous finalization.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/soniox/audio_transcription/handler.py#L589-L715
    why: Async client selection and awaited cleanup on the same job sequence.
dod:
  - text: Soniox chooses the correct file/reference path and completes the ordered create-poll-fetch response flow in both modes.
    proof: [soniox-pipeline-tests, oracle, soniox-pipeline-python]
  - text: Every tested success and partial failure cleans only known invocation-owned resources without changing the original result.
    proof: [soniox-pipeline-tests, oracle, soniox-pipeline-python]
checks:
  optional: []
  commands:
    - id: soniox-pipeline-tests
      why: Soniox orchestration or failure finalization is absent
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::soniox::pipeline::/)'
    - id: soniox-pipeline-python
      why: the full Soniox effect sequence has no independently executed source comparison
      run: grep -qE '^[[:space:]]+soniox_pipeline:' tools/oracle/fuzz/corpus/helper_case/soniox_pipeline* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/soniox_pipeline.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/helpers/soniox-pipeline/uploaded-success.yaml
  - tools/oracle/cases/helpers/soniox-pipeline/caller-file-preserved.yaml
  - tools/oracle/cases/helpers/soniox-pipeline/url-without-upload.yaml
  - tools/oracle/cases/helpers/soniox-pipeline/both-references.yaml
  - tools/oracle/cases/helpers/soniox-pipeline/missing-input.yaml
  - tools/oracle/cases/helpers/soniox-pipeline/create-failure-cleans-file.yaml
  - tools/oracle/cases/helpers/soniox-pipeline/fetch-failure-cleans-both.yaml
  - tools/oracle/cases/helpers/soniox-pipeline/invalid-duration-after-log.yaml
deviations: []
out_of_scope:
  - Public Soniox mode dispatch at 111-172 stays in B047; handler records/shared helpers at 61-102 and 173-357 are B1549, and upload/poll/cleanup pairs at 482-588 and 716-816 are B1550.
pitfalls:
  - 'The oracle helper for this task is pre-registered as soniox_pipeline in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/soniox_pipeline.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/soniox_pipeline.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The job may be created remotely before a malformed response prevents learning its cleanup ID.
  - A caller-supplied file_id is never substituted into uploaded_file_id for cleanup.
  - Invalid audio_duration_ms can fail after post_call already ran.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
