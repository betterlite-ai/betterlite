id: B1551
title: Compose Soniox transcription jobs with resource-aware finalization
description: >-
  Implement api::soniox::pipeline for _sync_audio_transcriptions and _async_audio_transcriptions.
  B1549 prepares options and selects the authenticated base; retain a client only when it matches
  the chosen sync/async mode, otherwise obtain B173's client with resolved ssl_verify. B1548 supplies
  record projection and B1550 upload/poll/cleanup. Keep all IDs invocation-local and run preparation
  before entering the resource cleanup region.

  Start with caller file_id. Upload local audio only when both file_id and audio_url are falsey;
  if no file was supplied, return the pinned Soniox 400 missing-input error. Never download audio_url:
  send it to Soniox unchanged. Track uploaded_file_id separately from selected file_id so caller-owned
  files are never deleted. If both references are present, send both rather than choosing one.
  Construct/log the body, POST /v1/transcriptions, require its id, poll to completion, then GET
  /v1/transcriptions/{id}/transcript. The selected timeout goes on each request; there is no internal
  transient retry layer or new overall deadline.

  Combine poll metadata and fetched transcript, update the supplied response through B1548 with
  the requested format, and perform post_call before adding hidden model/provider/duration. Convert
  a non-null audio_duration_ms to Decimal seconds strictly at this last stage, preserving the source
  failure even though public response duration conversion was best-effort. In finally, invoke B1550
  with any known transcription id and only the file id this call uploaded. Cleanup completes before
  returning either the response or original error. A malformed create response can leave a remote
  job whose id was never learned; do not claim transactional creation or invent a lookup/delete.

  call.soniox_pipeline invokes the actual sync and async source methods against scripted clients.
  Compare uploaded_success, caller_file_preserved, url_without_upload, both_references,
  missing_input, create_failure_cleans_file, fetch_failure_cleans_both and invalid_duration_after_log.
  Assert ordered create/poll/fetch/log/delete effects and response-object updates, including partial
  failures. Reuse decode_soniox_reply without another byte boundary. These two bodies contain 228
  nonblank/non-comment lines; one shared state machine should fit 210 production, 230 tests and
  140 oracle lines under 650 changed lines.
scope:
