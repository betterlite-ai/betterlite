id: B10149
title: User search predicate for the user list and UI user search
description: >-
  GET /user/list (B796) and GET /user/filter/ui (B1203) both take a free-text search parameter and narrow the users to those whose user_id or user_email contains it, ignoring case. LiteLLM builds that filter once, in _user_search_where, and both route functions merge it into their Prisma where mapping. B1203 owned it together with the whole org-scoped UI search, so B796 waited for that route. This task builds only the predicate and its SQL. Code goes in betterlite-server, module user_search_predicate (crates/betterlite-server/src/user_search_predicate.rs), with its tests in user_search_predicate/tests.rs. The file is an empty stub that lib.rs already declares.


  Types come from done tasks and no new record is built: UserSearchWhere and UserSearchTerm from B2334 in user_contracts::search (the native form of LiteLLM's UserSearchWhere TypedDict), InsensitiveContains and MatchMode from B770 in key_fields::values, and SqlValue from B897 in key_query_plan::sql, the bind list team_list_query already reuses. Build these two public functions.


  1. `user_search_where(search: Option<&str>) -> Option<UserSearchWhere>` is _user_search_where. None and the empty string give None, LiteLLM's falsey check returning the empty _NO_SEARCH_WHERE mapping. Any other string, whitespace and %, _ and \ included, is kept exactly as given, and `or` holds two terms in this order: one with only user_id set to InsensitiveContains { contains: search, mode: MatchMode::Insensitive }, then one with only user_email set the same way. Serialized, it reads {"OR": [{"user_id": {"contains": "<search>", "mode": "insensitive"}}, {"user_email": {...}}]}, which is LiteLLM's mapping with the tuple as a list.


  2. `user_search_sql(predicate: &UserSearchWhere, params: &mut Vec<SqlValue>) -> String` renders a UserSearchWhere the way Prisma reads it on Postgres, as one fragment the caller ANDs with its own filters. A set column becomes `"user_id" ILIKE $n` or `"user_email" ILIKE $n`: push `SqlValue::Text(format!("%{contains}%"))` onto params and use its 1-based position after the push, so the fragment numbers after whatever the caller bound before it. A term joins its set columns with AND, and a term with neither renders TRUE. The terms are joined with OR inside one pair of parentheses, and an empty `or` renders FALSE, since Prisma matches nothing for an empty OR list. The pattern is not escaped: Prisma's contains reaches Postgres as it is, so % and _ stay wildcards and \ stays LIKE's escape character, as team_list_query/sql.rs on main already renders the team filters. Column names are unqualified, so the caller reads "LiteLLM_UserTable" as the only table in its FROM and puts organization membership filters in a subquery.


  How the routes use it: B796's get_users and B1203's ui_view_users call user_search_where(search) and, when it gives Some, add user_search_sql's fragment to the clauses they AND together, after their own filters. LiteLLM merges the "OR" key into a mapping whose other keys are plain column filters, so the search is ANDed with them. Neither route writes a second OR or ILIKE for the search.


  Tests in user_search_predicate::tests. Names starting with predicate_ cover 1: None, the empty string, a single space giving the full OR with the space kept, "  Bob " kept untrimmed, "a%b_c\" kept as given, the user_id term before the user_email term, and the serde JSON of a predicate equal to LiteLLM's mapping. Names starting with sql_ cover 2 without a database: placeholders numbered $3 and $4 after two params the test bound first, the two patterns pushed as %text%, a term with both columns joined by AND, an empty term rendering TRUE and an empty `or` rendering FALSE. Names starting with postgres_ run the fragment on real Postgres the way crates/betterlite-server/src/team_list_query/tests/support.rs does: POSTGRES_TEST_URL when set, otherwise the betterlite-postgres-fixture container, the schema from B716's PACKAGED_CATALOGS and B700's PostgresStore. Seed "LiteLLM_UserTable" rows with synthetic ids and emails (alice-1, alice@example.com), bind one filter of the test's own before the fragment, and assert the matched ids: ALICE matches the id and the email, a row with a NULL email is found through its id only, a match on both columns returns the row once, % matches any run and _ exactly one character, \% matches only a stored percent sign, and " alice" with a leading space misses a row that has no space before alice.


  Oracle. Helper operation b10149 takes {"search": string or null} and answers the predicate as JSON, or {} when there is none. The Python side imports _user_search_where from litellm.proxy.management_endpoints.internal_user_endpoints and answers dict(result) with the OR tuple turned into a list of plain dicts. The Rust side answers serde_json::to_value of the Some value, or an empty object for None. Add helper_case corpus seeds named user-search-predicate-*.
