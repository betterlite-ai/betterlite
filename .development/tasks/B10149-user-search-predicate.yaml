dod:
  - text: user_search_where gives None for a null or empty search and otherwise the user_id then user_email insensitive contains OR, with the search kept untrimmed and unescaped, matching LiteLLM's mapping.
    proof: [predicate-tests, oracle, helper-python]
  - text: user_search_sql numbers its placeholders after the params the caller bound, binds %text% patterns, ORs the terms inside parentheses, ANDs the columns of one term, and renders TRUE for an empty term and FALSE for an empty OR.
    proof: [sql-tests]
  - text: On real Postgres the fragment matches user_id or user_email ignoring case, keeps whitespace, treats % and _ as wildcards and \ as the escape character, and finds a row with a NULL email through its user_id.
    proof: [postgres-tests]
  - text: New user-search-predicate seeds for b10149 replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: predicate-tests
      why: The predicate is missing, trims or escapes the search, treats a space as empty, or orders its terms differently from LiteLLM.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_search_predicate::tests::predicate_/)'
    - id: sql-tests
      why: The rendered fragment restarts its placeholders, escapes the pattern or mishandles an empty term or an empty OR.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_search_predicate::tests::sql_/)'
    - id: postgres-tests
      why: The fragment matches different users than Prisma's insensitive contains on real Postgres.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_search_predicate::tests::postgres_/)'
    - id: helper-python
      why: The b10149 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10149.py tools/oracle/helpers/b10149)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10149 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/user-search-predicate-*")" &&
        grep -lE 'b10149"?:' tools/oracle/fuzz/corpus/helper_case/user-search-predicate-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-server --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/user-search-predicate/null-search.yaml
  - tools/oracle/cases/helpers/user-search-predicate/empty-search.yaml
  - tools/oracle/cases/helpers/user-search-predicate/whitespace-kept.yaml
  - tools/oracle/cases/helpers/user-search-predicate/wildcards-kept.yaml
deviations: []
out_of_scope:
  - "get_users (/user/list) with its other filters, sorting, counts and key counts: B796. ui_view_users (/user/filter/ui), _resolve_org_filter_for_user_search and _resolve_team_org_filter: B1203. Both call this module and write no search OR of their own."
  - "UserSearchWhere, UserSearchTerm and the user query decoders: B2334. InsensitiveContains and MatchMode: B770. SqlValue and the key list SQL: B897."
  - "The other functions of internal_user_endpoints.py: B056, B790, B791, B792, B795, B796, B797, B798, B1203 and B1226, as their out_of_scope lists name them."
pitfalls:
  - "Only None and the empty string give no predicate: a search of one space is truthy in LiteLLM and filters on that space, so never trim before the check."
  - "Escaping the pattern the way list_api's escape_like does changes results: Prisma sends contains unescaped, so a search of a_b also matches aXb (team_list_query's alias_wildcards_are_patterns test shows the same for teams)."
  - "The placeholders count from params.len() after each push, not from 1: both routes bind their own filters before the search, and a fragment that starts again at $1 binds the wrong value."
  - "Column names are unqualified, and LiteLLM_OrganizationMembership has its own user_id, so a caller that joins it in the FROM makes the reference ambiguous; membership filters belong in an EXISTS subquery."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
