deviations:
  - what: >-
      Agent registry is accepted as a read-only injected view,
      not as a mutable registry with DB access or cache population.
    why: >-
      Registry mutation, database reads and startup population are responsibilities of B141 (agent feature owner).
      B3017 consumes an already-populated registry snapshot to support rate-limit context in session hooks.

out_of_scope:
  - Agent registry mutation, database loading or cache population (B141).
  - Agent route definitions, dispatch or pre-call hook assembly (B141).
  - Rate limiter policy, admission decisions or v3 limiter internals (B072).
  - The full rate limiter implementations that call ProxyRateLimitError (B3007, B072).
  - The other LiteLLM rate limiter utility functions convert_priority_to_percent and map_v3_rate_limit_type.

pitfalls:
  - >-
    Agent ID lookups must check exact ID equality before attempting legacy ID lookup.
    LiteLLM iterates agent.agent_id == id first, then tries legacy mapping; reversing this breaks compatibility.
  - >-
    Router alias resolution must catch all exceptions (including from model_list iteration and inner get_llm_provider calls)
    and return None rather than panicking, so secondary exceptions never escape the rate-limit raise path.
  - >-
    Each router alias resolution step (is router.model_list a list, is deployment a dict, does it have model_name,
    is litellm_params a dict) must be guarded; a malformed deployment entry must not crash the whole resolution.
  - >-
    Header values in ProxyRateLimitError must be stringified to satisfy axum's typing,
    while preserving the exact header names and values the limiter passed in.
  - >-
    _coerce_message must try JSON serialization and catch serialization failures gracefully,
    falling back to Display::to_string for objects that cannot JSON-serialize.
  - >-
    ProxyRateLimitError defaults for missing/None arguments (model → "", llm_provider → "litellm_proxy")
    must match LiteLLM's so downstream Prometheus labels and error categorization are consistent.
  - >-
    The two fallback cases must be explicit: empty/None model returns ("", "litellm_proxy");
    non-empty model with both lookups failing preserves the original model string and returns (model, "litellm_proxy").

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
