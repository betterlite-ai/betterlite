deviations:
  - what: An output reply with more texts than were sent returns a typed `TooManyTexts` error and the response fails. A tool_use output block without id, name or input returns `MalformedToolUse`.
    why: LiteLLM raises IndexError and KeyError there and the request fails with a 500. A named error keeps that outcome.
  - what: The structured_messages answer counts as changed when it differs by value from the list that was sent. LiteLLM compares object identity.
    why: A guardrail returns owned values in Rust, so identity is gone. A guardrail that returns an equal copy would take the structured path in LiteLLM and the text path here, which leaves the request body as the client sent it.
  - what: post_call_hook_response treats a JSON object whose `choices` is an array as a ModelResponse.
    why: Python checks the class. A JSON value has none, and an Anthropic message never has `choices`.
  - what: Only plain JSON object blocks are read on the output side. LiteLLM also reads pydantic blocks through model_dump and `.text`.
    why: docs/compatibility.md leaves out Python object duck typing beyond the declared JSON shapes.
out_of_scope:
  - "B3674 owns _translate_to_openai, _hoisted_top_level_system_message, the write-back helpers, _apply_guardrail_responses_to_input and _apply_guardrail_tool_calls_to_input. This task calls them."
  - "B3673 owns the stream observation (get_streaming_scan_key, _streamed_tool_use_fingerprints, get_streaming_string_so_far, _extract_text_from_sse, _check_streaming_has_ended). B3676 owns process_output_streaming_response, the ended-stream rewrite helpers, _SSEFieldRewrite, its rewriters and _build_streaming_usage_response. B3673 owns build_block_sse_chunks, build_stream_error_items and the block continuation helpers."
  - "B3670 owns the scan target types, ScannedText, ScannedToolCall, ExtractedInput, _is_client_tool_use and the tool call shape helpers (_ToolCallShape, _tool_call_shapes)."
  - "B888 owns extract_request_tool_names (it moves into betterlite-auth). It is not planned here."
  - "B3663 owns the skip flag readers, scoped_structured_message_indices, merge_guardrailed_scoped_messages, merge_returned_tools_into_request_tools, anthropic_tool_name and unappliable_request_rewrite. B3661 owns BaseTranslation and its class variables, and B5820 owns the response context preparation that replaces _prepare_request_data's metadata step."
  - "B578 owns AnthropicConfig.convert_tool_use_to_openai_format, B575 owns AnthropicConfig._map_tool_helper, B1117 owns is_provider_native_tool_dict, B966 owns translate_openai_response_to_anthropic and B967 owns translate_anthropic_to_openai."
  - "The constructor's LiteLLMAnthropicMessagesAdapter() has no Rust counterpart: the functions here call the adapter functions directly."
  - "_has_text_content has no caller in the Anthropic handler at the pin (the calls at chat/guardrail_translation/handler.py L409 and L575 belong to the OpenAI chat handler), so it is not built."
  - "_openai_system_message_to_anthropic, _fold_leading_systems_into_top_level, _is_hoisted_top_level_system, _is_system, _defer_systems_inside_tool_exchanges and _write_back_structured_messages are B3674's."
  - "The Anthropic typing helpers _as_str_mapping, _content_block_at, _ModelDumpBlock, _TextAttrBlock, _WritableMessage and _as_writable only narrow Python types and have no Rust counterpart."
pitfalls:
  - "Input tool calls are numbered by a running count of client tool_use blocks (index 0, 1, 2 among tool_use blocks only), but output tool calls use the block's position in `content`. Mixing them changes the `index` the guardrail sees."
  - "The texts are scanned from the original Anthropic `messages`, while `structured_messages` come from the translated chat rows plus the hoisted system row, so the two lists are different views and the text path must pair texts with `scanned`, never with the structured rows."
  - "`has_midturn_system_message` must be computed from the translated rows before the hoisted system row is inserted, or every request with a top-level `system` looks like it has a mid-turn one and the write-back keeps system rows in `messages`."
  - "`skip_system` removes only the hoisted top-level prompt. In-sequence system rows stay in scope, so `scoped_structured_message_indices` is called with `skip_system` false."
  - "Returned tools are converted and written to `data.tools` before the structured-versus-text branch, so a guardrail that returns both tools and structured_messages gets both applied."
  - "An empty returned `texts` list is not a mismatch: the length check runs only when the list is non-empty, so a guardrail that returns tools or tool_calls but no texts is accepted."
  - "A text block with an empty `text` is not scanned on the output side, but an empty string `content` is still scanned on the input side, and an empty top-level system string is scanned too. Do not unify the rules."
  - "`system` as a message role is checked with exact \"system\" in the extractor but lowercased in `has_midturn_system_message`; `tool` is checked lowercased. Keep each as it is."
  - "On the output side an image list is never filled, so `images` is never in the inputs of a response scan."
  - "The model for the response scan is `response.model`, not `request_data.model`, and for the request scan it is `data.model`; each is sent only when it is a non-empty string."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 3
