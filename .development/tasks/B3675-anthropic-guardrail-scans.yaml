dod:
  - text: >-
      extract_input_text_and_images scans string content, text blocks (any block with a string text), tool_result strings and tool_result item texts into the right targets, skips system and tool roles by the flags, and returns nothing for string and text content when scan_only_tool_results is set.
    proof: [input-extract-tests, oracle]
  - text: >-
      Client tool_use blocks become scanned tool calls numbered by a running count of tool_use blocks, with the real content position in the target; a tool_use block without an object input is not scanned.
    proof: [input-extract-tests, oracle]
  - text: >-
      image_sources turns url sources into the url, base64 sources into data URIs (bare data without media_type), and file sources into nothing.
    proof: [image-sources-tests, oracle]
  - text: >-
      extract_midturn_system_text and extract_top_level_system_text produce the right targets; system block targets are numbered over all blocks and empty top-level strings are still scanned.
    proof: [system-extract-tests, oracle]
  - text: get_structured_messages returns None for no messages and for an empty translation, and the translated rows otherwise.
    proof: [structured-messages-tests, oracle]
  - text: >-
      process_input_messages makes no guardrail call when nothing is scannable, and otherwise builds the inputs with images, tool_calls, tools and structured_messages only when non-empty and model only when non-empty.
    proof: [process-input-inputs-tests]
  - text: >-
      The skip flags and scan_only_tool_results decide which rows are in the scoped structured_messages, whether the top-level system is hoisted and scanned, and whether tools are sent.
    proof: [process-input-scope-tests]
  - text: >-
      Returned tools are converted back to Anthropic tools and replace data.tools (native tools kept first), or are merged into the request tools by name when scan_only_tool_results is set, on both write-back paths.
    proof: [process-input-tools-tests]
  - text: >-
      A changed structured_messages answer goes through structured write-back with the full or merged rows and the mid-turn system flag; an unchanged one falls through to the text path.
    proof: [process-input-structured-tests]
  - text: >-
      On the text path a non-empty returned texts list of the wrong length returns the unappliable-rewrite error, and equal-length answers rewrite texts and tool calls in place.
    proof: [process-input-text-tests]
  - text: >-
      process_output_response collects text blocks and tool_use blocks with their content positions, sends them with input type Response, and makes no call and leaves request_data alone when there is nothing to send.
    proof: [output-scan-tests]
  - text: >-
      Returned output texts replace text blocks by position (a shorter reply rewrites a prefix), a longer reply returns TooManyTexts, and returned tool calls are never written back.
    proof: [output-apply-tests, oracle]
  - text: A tool_use output block without id, name or input returns the malformed tool use error with its content position.
    proof: [output-scan-tests]
  - text: >-
      post_call_hook_response translates an object with a choices array into an Anthropic message and returns any other value unchanged.
    proof: [hook-tests, oracle]
