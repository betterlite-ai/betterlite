id: B3675
title: Anthropic guardrail input and completed-output scans
description: >-
  Build the Anthropic Messages handler that scans a request before the model call and a completed (non-streaming) response after it, calls the guardrail, and puts the answer back.
  Everything is a plain async or sync function in crates/betterlite-server/src/guardrails/anthropic_translation/, generic over `G: GuardrailContract` (from B5471's `guardrail_base`; the trait's `apply_guardrail` returns `impl Future`, so it cannot be a trait object).
  Request bodies are `BTreeMap<String, GuardrailValue>` and Anthropic responses are `GuardrailValue`, both from `betterlite_config::sections::guardrail_identity::item`. `GuardrailApiInputs`, `GuardrailFailure`, `GuardrailLogTarget` and `GuardrailInputType` come from B5471. Rows and blocks stay JSON, so `serde_json::Value` is allowed at those boundaries only, with one `#[expect]` per module and its reason.
  Other tasks own the pieces this one calls, so read their modules for exact signatures and never copy them. B3670: `ScannedText`, `ScannedToolCall`, `ExtractedInput` (with `ExtractedInput::empty()`), the target enums, `is_client_tool_use` and `tool_call_shapes`. B3674: `write_back_structured_messages`, `apply_guardrail_tool_calls_to_input`, `apply_guardrail_responses_to_input`, `translate_to_openai` and `hoisted_top_level_system_message`. B3663: the three `effective_*` flag readers, `scoped_structured_message_indices`, `merge_guardrailed_scoped_messages`, `merge_returned_tools_into_request_tools`, `anthropic_tool_name` and `unappliable_request_rewrite`. B578: the Rust `convert_tool_use_to_openai_format`. B575: the Rust `_map_tool_helper`. B1117: `is_provider_native_tool_dict`. B5820: `response_context::add_response_context`. B966: the Rust `translate_openai_response_to_anthropic`.

  Module `input_scan` (input_scan.rs) holds the extractors, which only read the request. `extract_input_text_and_images(message: &Value, msg_idx: usize, skip_system_message: bool, skip_tool_message: bool, scan_only_tool_results: bool) -> ExtractedInput` follows LiteLLM in this order. `role` is the message's `role` text, empty when missing. Role exactly "system" gives `ExtractedInput::empty()` when `scan_only_tool_results`, else `extract_midturn_system_text`; `skip_system_message` is ignored here because it covers only the top-level prompt. Role "tool" in any case with `skip_tool_message` gives empty. A string `content` gives one `MessageContent` text, or empty when `scan_only_tool_results`; an empty string is still scanned. A `content` that is neither string nor array gives empty. For an array, every object item goes through `extract_content_block` (non-object items are skipped) and the results are joined in order. Tool calls come from items that pass B3670's `is_client_tool_use`, and only when not `scan_only_tool_results`; each is converted with B578's `convert_tool_use_to_openai_format(block, tool_call_idx)` where `tool_call_idx` counts the client tool_use blocks only (0, 1, 2), and gets `ToolUseInputTarget { msg_idx, content_idx }` with the real position.
  `extract_content_block` returns empty for a `tool_result` block when `skip_tool_message`, else `extract_tool_result`; for any other block it returns empty when `scan_only_tool_results`. Otherwise it scans the block's `text` whenever that key holds a string, whatever the block `type` is (target `ContentBlockText`), and for `type` "image" it adds `image_sources(block)`. `extract_tool_result` scans a string `content` as `ToolResultString`, and for an array scans each object item that has a string `text` as `ToolResultBlockText { msg_idx, content_idx, block_idx }` and collects `image_sources` of every item with `type` "image". Other `content` gives empty. `image_sources(block) -> Vec<String>`: no object `source` gives none; `source.type` "url" gives the `url` only when it is a non-empty string; any other `source.type` reads `data` (a non-empty string, else none) and gives `data:{media_type};base64,{data}` when `media_type` is a non-empty string, else the bare `data`. A `file` source has no `data`, so it yields nothing.
  `extract_midturn_system_text(message, msg_idx) -> ExtractedInput`: a non-empty string `content` gives one `MessageContent`; an array gives each object item with `type` "text" and a non-empty string `text` as `ContentBlockText`; everything else gives empty. `extract_top_level_system_text(hoisted: &Value) -> Vec<ScannedText>`: a string `content` gives one `SystemString` even when empty; an array gives `SystemBlockText { block_idx }` for each object item with a string `text`, where `block_idx` is the position among ALL items, not among text items. `get_structured_messages(data) -> Result<Option<Vec<Value>>, _>`: no `messages` key or null gives None; otherwise it calls B3674's `translate_to_openai` on the whole body (system included) and gives None when the translated `messages` list is empty.

  Module `process_input` (process_input.rs) has `process_input_messages(data: &mut BTreeMap<String, GuardrailValue>, guardrail: &G, logging_obj: Option<&mut GuardrailLogTarget>) -> Result<(), ProcessInputError>`. A missing or null `messages` returns at once. Steps, in order:
  (1) Read `skip_system`, `skip_tool` and `scan_only_tool_results` with B3663's flag readers.
  (2) Call `translate_to_openai` on a copy of `data` without the `system` key. Its `messages` are `full_structured_messages`; its `tools` are the chat-format tools.
  (3) `has_midturn_system_message` is true when any of those messages has a `role` whose lowercase is "system". Compute it before step 4.
  (4) Unless `skip_system`, `hoisted_top_level_system_message(data)`; when it is Some, insert it at index 0 of `full_structured_messages`.
  (5) `scoped_message_indices = scoped_structured_message_indices(full, scan_only_tool_results, skip_system=false, skip_tool)`; `structured_messages` are those rows. System rows are always in scope here because `skip_system` already left the trusted prompt out.
  (6) `tools_to_check` is empty when `scan_only_tool_results`, else the chat-format tools that are not `is_provider_native_tool_dict`.
  (7) Scan. The top-level system texts come from `extract_top_level_system_text(hoisted)`, but only when there is a hoisted message and not `scan_only_tool_results`. Then `extract_input_text_and_images` runs for every message of the ORIGINAL Anthropic `messages` with its index. `scanned` is the system texts followed by every message's texts; `images`, `scanned_tool_calls` and their `tool_call` values are collected the same way. `pre_guardrail_tool_calls = tool_call_shapes(tool_calls)`.
  (8) When there are no texts and no tool calls, stop (no guardrail call, no change). Otherwise build `GuardrailApiInputs { texts }`, adding `images`, `tool_calls`, `tools` (`tools_to_check`) and `structured_messages` only when non-empty, and `model` only when `data.model` is a non-empty string. Call `guardrail.apply_guardrail(inputs, data, GuardrailInputType::Request, logging_obj)`; its `GuardrailFailure` goes straight to the caller.
  (9) Returned `tools`, when Some, are converted one by one with B575's `_map_tool_helper` port (a None result is dropped; the MCP server half is ignored) into Anthropic tools. Then `data.tools` becomes `merge_returned_tools_into_request_tools(request tools, converted, anthropic_tool_name)` when `scan_only_tool_results`, else the request's native tools (`is_provider_native_tool_dict`) followed by the converted ones. A missing request `tools` counts as empty. This runs before the next step and also on the structured path.
  (10) Structured path: when the guardrail returned `structured_messages` and they differ from the ones sent (compared by value), call `write_back_structured_messages(data, rows, hoisted, has_midturn_system_message)`. `rows` are the returned list when `guardrail.messages_cover_full_request()` is true, else `merge_guardrailed_scoped_messages(full, scoped_message_indices, returned)`.
  (11) Otherwise the text path: when the returned `texts` is non-empty and its length differs from `scanned.len()`, return B3663's unappliable-rewrite error; then `apply_guardrail_tool_calls_to_input` with the returned `tool_calls`; then `apply_guardrail_responses_to_input` with the returned texts. An empty or absent returned `texts` rewrites no text.
  Keep the debug line `Anthropic Messages: Processed input messages: {messages}` at the end.

  Module `output_scan` (output_scan.rs) has `process_output_response(response: &mut GuardrailValue, guardrail: &G, logging_obj: Option<&mut GuardrailLogTarget>, user_api_key_dict: Option<&BTreeMap<String, GuardrailValue>>, request_data: Option<&mut BTreeMap<String, GuardrailValue>>) -> Result<(), ProcessOutputError>`. A response with a missing, null or empty `content` array returns unchanged and makes no call. `extract_from_content_blocks` visits each block by position `content_idx`. Only object blocks whose `type` is "text" or "tool_use" count; the rest are skipped. A "text" block with a non-empty string `text` adds the text and the mapping `content_idx`. A "tool_use" block is converted with `convert_tool_use_to_openai_format(block, content_idx)`: unlike the input side there is no `is_client_tool_use` check, and the index is the block's position in `content`, not a running count. A tool_use block missing `id`, `name` or `input` returns `ProcessOutputError::MalformedToolUse { content_idx }` (LiteLLM raises KeyError and the request fails). No texts and no tool calls means no call and `request_data` is not touched. Otherwise `add_response_context` (B5820) prepares `request_data` (an absent `request_data` starts as an empty map, and the key `response` is added only when missing), the inputs get `texts`, `tool_calls` when non-empty, and `model` from `response.model` when non-empty; images are never set on this side. The call uses `GuardrailInputType::Response`. Write-back is by position: returned text `i` replaces `text` of the block in mapping `i`, for every `i` below the returned length, only when that block is an object with `type` "text". A shorter reply rewrites only the first texts. A reply longer than the number of texts sent returns `ProcessOutputError::TooManyTexts { sent, returned }` (LiteLLM hits IndexError). Returned `tool_calls` on the output side are ignored: a rewritten tool_use block is never written back. Keep the debug line `Anthropic Messages: Processed output response: {response}`.

  Module `post_call_hook` (post_call_hook.rs) has `post_call_hook_response(response: &GuardrailValue) -> Result<GuardrailValue, PostCallHookError>`, LiteLLM's method of the same name. It returns the response unchanged unless it is an OpenAI chat `ModelResponse`; then it runs B966's `translate_openai_response_to_anthropic` with no tool name mapping and no polyfill result and returns the Anthropic message. Python tells the two apart by class. A JSON value has no class, so this port treats an object whose `choices` is an array as a ModelResponse (an Anthropic message has no `choices`). A value that has `choices` but does not parse as a ModelResponse returns `PostCallHookError::Response` with `#[source]`. The policy pipeline calls this to show the legacy post-call hook the shape it expects.

  Each module that can fail owns its error enum in its own files with `thiserror`: `ProcessInputError` (wrapping `GuardrailFailure` boxed if `clippy::result_large_err` fires, B3663's unappliable error, `WriteBackError`, `ApplyError`, `StructuredWriteBackError` and a tool conversion error, each with `#[source]`), `ProcessOutputError`, `PostCallHookError`, and one for `get_structured_messages`. Tests use a fake guardrail defined in each tests.rs that records the `GuardrailApiInputs`, `input_type` and a copy of `request_data`, and returns a scripted result. Cargo: add the betterlite-guardrails and betterlite-anthropic dependencies to crates/betterlite-server/Cargo.toml if no earlier task did; neither depends on betterlite-server, so no cycle forms.

  Name tests so the filters match: `extract_*`, `image_sources_*`, `midturn_*`, `top_level_*`, `structured_messages_*` in input_scan; `flags_*`, `scope_*`, `inputs_*`, `tools_*`, `structured_path_*`, `text_path_*`, `mismatch_*` in process_input; `output_extract_*`, `output_call_*`, `output_apply_*` in output_scan; `hook_*` in post_call_hook. Helper oracle cases (pure functions only) go in tools/oracle/cases/helpers/anthropic-guardrail-scan/ with `call: b3675: {function: ..., ...}`. The handlers are not reachable from a route yet, so HTTP cases come with the umbrella that wires the dispatcher.
