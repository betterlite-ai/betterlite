checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::responses_session_history::/)
      - test(/::replays_corpus$/)'
  - id: case-previous-response-chain
    why: the previous-response-chain behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_session_history::tests::previous_response_chain($|::)/)'
  - id: case-redacted-tool-arguments
    why: the redacted-tool-arguments behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_session_history::tests::redacted_tool_arguments($|::)/)'
  - id: case-cold-storage-payload
    why: the cold-storage-payload behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_session_history::tests::cold_storage_payload($|::)/)'
  - id: case-missing-history
    why: the missing-history behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_session_history::tests::missing_history($|::)/)'
  - id: case-cycle-bound
    why: the cycle-bound behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_session_history::tests::cycle_bound($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_session_history::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/responses-session-history-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_session_history)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/responses_session_history.rs && grep -qF "decode_responses_session_hist"
      crates/betterlite-core/fuzz/fuzz_targets/responses_session_history.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::responses_session_history::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_session_history.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_session_history-*)"
      && grep -qE "^[[:space:]]+responses_session_history:" tools/oracle/fuzz/corpus/helper_case/responses_session_history-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-session-history)"
