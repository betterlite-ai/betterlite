id: B915
title: Responses session history
description: >-
  Retrieve previous-response history through injected spend-log and cold-storage readers using B051 schema records.
  Normalize redacted arguments, traverse previous response chains with an explicit work bound, and pass the recovered
  messages to responses-input-messages; never read storage for a caller until the response ID has been authorized.


  Implement crates/betterlite-core/src/api/responses_session_history.rs. Use ResponsesSessionHistorInput and ResponsesSessionHistorResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions previous_response_chain, redacted_tool_arguments, cold_storage_payload,
  missing_history, cycle_bound under api::responses_session_history::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.RESPONSES_SESSION_LOOKUP_MAX_ATTEMPTS
  defaults to '3'; env.RESPONSES_SESSION_LOOKUP_RETRY_INTERVAL defaults to '0.2'. No environment reads occur outside
  betterlite-config. Test api::responses_session_history::tests::loads_settings uses the production Config loader
  and an injected environment map, with a named rstest case for every key above, explicit override, unset/default
  and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key report;
  a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder rather
  than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::responses_session_history::decode_responses_session_hist(bytes:
  &[u8], limits: &ApiLimits), for json.loads input proxy_server_request at litellm/responses/litellm_completion_transformation/session_handler.py:174;
  json.loads input metadata_str at litellm/responses/litellm_completion_transformation/session_handler.py:211. Place
  its implementation in crates/betterlite-core/src/api/responses_session_history.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/responses_session_history.rs passes arbitrary
  bounded bytes to that exact decoder; api::responses_session_history::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesSessionHistory in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_session_history: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/session_handler.py: _normalize_redacted_tool_call_arguments
  (L33-L41); litellm/responses/litellm_completion_transformation/session_handler.py: ResponsesSessionHandler.get_chat_completion_message_history_for_previous_response_id
  (L46-L88); litellm/responses/litellm_completion_transformation/session_handler.py: ResponsesSessionHandler.extend_chat_completion_message_with_spend_log_payload
  (L91-L160); litellm/responses/litellm_completion_transformation/session_handler.py: ResponsesSessionHandler.get_proxy_server_request_from_spend_log
  (L163-L193); litellm/responses/litellm_completion_transformation/session_handler.py: ResponsesSessionHandler._get_cold_storage_object_key_from_spend_log
  (L196-L218); litellm/responses/litellm_completion_transformation/session_handler.py: ResponsesSessionHandler.get_proxy_server_request_from_cold_storage_with_object_key
  (L221-L241); litellm/responses/litellm_completion_transformation/session_handler.py: ResponsesSessionHandler._should_check_cold_storage_for_full_payload
  (L244-L263); litellm/responses/litellm_completion_transformation/session_handler.py: ResponsesSessionHandler.get_all_spend_logs_for_previous_response_id
  (L266-L320); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.async_responses_api_session_handler
  (L535-L600). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 261 owned nonblank/non-comment/non-docstring Python lines (303 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 281 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 36 config tests/seeds
  and 30 wiring; 627 total within the 630-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B069 (Spend tracking and spend logs), B127 (Object storage caches), B171 (Direct helper
  oracle and URL path encoding), B903 (Response id codecs), B909 (Responses input messages), B1087 (Api boundaries),
  B726 (Managed resources and transaction repositories), B858 (Typed managed-resource and analytics rows), B911
  (Responses tool repair), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
