id: B915
title: Recover Responses sessions from spend logs
description: >-
  Build api::responses_session_history around injected spend-log queries, cold-storage reads
  and an async sleeper. Own every function in session_handler.py and the complete
  async_responses_api_session_handler in transformation.py. B726 executes the parameterized
  query using B858 rows; B069 supplies the cold-storage reader. B903 unwraps the response ID,
  B909 rebuilds input messages and B911 repairs tool correlations. There is no recursive
  previous_response_id traversal in this source: fetch all rows in the matching session,
  ordered by endTime ascending. The caller must authorize the ID before invoking this service.

  B002 loads RESPONSES_SESSION_LOOKUP_MAX_ATTEMPTS from default "3", clamps integer values
  to at least 1, and loads RESPONSES_SESSION_LOOKUP_RETRY_INTERVAL from default "0.2" seconds.
  Invalid numbers fail configuration, not silently fall back. Reuse disable_spend_logs and
  litellm.cold_storage_custom_logger settings; the latter is an optional injected reader,
  never a Python callback. Put settings tests in betterlite-config, not the core module.

  Decode stored request/metadata JSON in decode_session_log_json(bytes,kind,limits), bounded
  by B1087. Request errors propagate; malformed metadata is logged and ignored. Production,
  the session_log_json fuzz target and replays_corpus use this decoder. Register B171's
  responses_session_history helper with scripted repository replies and record query
  parameters, read keys, sleeps and debug messages independently on both sides.
  The references contain 303 nonblank/non-comment source lines. Budget 280 implementation,
  175 tests, 95 cases, 80 adapters, 55 fuzz/replay, 45 config/seeds and 25 wiring: 755 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_session_history.rs
  - crates/betterlite-core/src/api/responses_session_history/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/session_log_json.rs
  - crates/betterlite-core/fuzz/corpus/session_log_json/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/responses_session_history.rs
  - crates/betterlite-config/src/api/responses_session_history/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/responses-session-history-*
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/responses_session_history.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/responses_session_history.py
  - tools/oracle/fuzz/corpus/helper_case/responses_session_history-*
  - tools/oracle/cases/helpers/responses-session-history/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/session_handler.py#L1-L320
  why: Session SQL, retry ordering, stored input/output replay and cold-storage fallback are implemented together.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L535-L600
  why: History precedes current messages; repair has a nonempty fallback and carries the session trace ID.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1807-L1808
  why: Lookup attempts are clamped integers while the delay is an un-clamped float.
dod:
- text: >-
    session_query unwraps an encoded response ID to resp_a and binds it as $1 against
    LiteLLM_SpendLogs.request_id, selects every matching session_id and sorts endTime ASC.
    No repository returns [] without a query. Replies [],[],[row] cause three queries and
    two sleeps of 0.2; first nonempty reply stops retries. disable_spend_logs=true makes
    exactly one query and no sleep. No rows returns messages=[],litellm_session_id=null;
    multiple rows use the first row's session_id. Debug output includes "decoding response id=%s",
    "Found no spend logs for previous response id %s", and on success
    "Found the following spend logs for previous response id %s: %s" with decoded ID and rows.
  proof: [session-tests, oracle, session-adapter]
- text: >-
    stored_turn_replay prefers truthy input over messages, wraps a dict input in a list,
    and replays reasoning through B909. Empty input falls back to truthy messages. It appends
    every response choice.message only when response is a nonempty dict; missing response,
    string JSON and {} add no output. Both tool_calls[].function.arguments and legacy
    function_call.arguments equal to "redacted-by-litellm" become "{}"; all other strings
    stay byte-for-byte unchanged. Invalid response dictionaries propagate B004 validation.
  proof: [session-tests, oracle, session-adapter]
- text: >-
    cold_payload_selection treats missing/falsy proxy_server_request as {}, passes dicts
    directly and parses strings. Without a cold logger it never fetches. With a logger,
    null,{},or any representation containing "litellm_truncated" qualifies, including a
    nested string value containing that substring. Read metadata.cold_storage_object_key
    from dict or JSON string; absent/empty key skips the read. A truthy cold result replaces
    the stored request; {} or null keeps it. Malformed metadata or a scalar logs
    "Failed to parse metadata from spend log to extract cold storage object key" and returns
    no key; malformed request JSON propagates a decode error. Storage errors propagate.
  proof: [session-tests, oracle, session-adapter, session-corpus]
- text: >-
    session_merge sends history [old] and current [new] to B911 as [old,new]. If repair
    removes everything, keep nonempty current messages, otherwise nonempty history.
    If both are empty, return BadRequestError status=400 with message
    "Unable to create messages for completion request. This can happen when: 1) Using previous_response_id without a session database, AND 2) Input contains only function_call_output with empty or invalid call_id. Please ensure function_call_output has a valid call_id from a previous response. Original request: previous_response_id=resp_a",
    model/provider defaulting to "" and SDK body/type/param/code null. Set litellm_trace_id
    to the recovered session ID, including null. Debug records include
    "inside get_chat_completion_message_history_for_previous_response_id",
    "found %s spend logs for this response id", "chat_completion_message_history %s" and
    "inside get_proxy_server_request_from_cold_storage_with_object_key..." on their paths.
  proof: [session-tests, oracle, session-adapter]
- text: >-
    loads_session_lookup_settings uses the real loader: unset gives 3 and 0.2, attempts=0
    or -2 gives 1, attempts=5 gives 5, interval=0 gives 0, and interval=-1 remains -1.
    attempts=bad and interval=bad are configuration errors. The keys are recognized and
    affect query/sleep behavior; config seeds replay through B002's YAML decoder.
  proof: [session-settings, session-config-corpus]
checks:
  optional: [mutants]
  commands:
  - id: session-tests
    why: query timing, replay ordering or cold-storage fallback is missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_session_history::/) - test(/::replays_corpus$/)'
  - id: session-settings
    why: environment values do not reach the production lookup settings
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_session_history::tests::loads_session_lookup_settings($|::)/)'
  - id: session-config-corpus
    why: the shared config decoder has no new lookup-setting seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/responses-session-history-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: session-corpus
    why: stored JSON bypasses the bounded production decoder or lacks replay
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/session_log_json.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/session_log_json)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_session_history::tests::replays_corpus$/)'
  - id: session-adapter
    why: repository effects are not independently compared with the pinned helper
    run: test -f tools/oracle/helpers/responses_session_history.py && grep -qE '^[[:space:]]+responses_session_history:' tools/oracle/fuzz/corpus/helper_case/responses_session_history-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-session-history/session-query.yaml
- tools/oracle/cases/helpers/responses-session-history/stored-turn-replay.yaml
- tools/oracle/cases/helpers/responses-session-history/cold-payload-selection.yaml
- tools/oracle/cases/helpers/responses-session-history/session-merge.yaml
deviations: []
out_of_scope:
- B069 owns cold-storage credentials and downloads; B726 owns database execution and B858 the row representation.
- Other transformation.py functions stay with B907-B914, B1115 and B2411; unreachable helpers are excluded in those owners.
- B929 and route callers authorize IDs; this service receives authorized identifiers and adds no authorization shortcut.
pitfalls:
- The SQL matches request_id, not a response_id column, and recovers a session rather than walking a response chain.
- The truncation check searches str(request), so a nested value containing litellm_truncated also triggers cold storage.
- Empty cold-storage results do not erase the stored request and malformed metadata does not fail the request.
review_level: security
budget:
  max_changed_lines: 755
  max_new_expects: 1
