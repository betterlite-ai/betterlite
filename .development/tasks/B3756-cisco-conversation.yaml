deviations: []
out_of_scope:
- field and field_list are structural accessors for both dict and object-shaped messages; they remain in this part as internal helpers.
- B3757 owns redact_chat_input and redact_chat_output which call these extraction functions, plus handling of block payloads and incomplete-rewrite fallback.
- B3761 owns MCP envelope projection, not Cisco extraction; it imports these helpers for message/content handling.
- B3762 owns the constructor, async_pre_call_hook and async_moderation_hook that call inspect_chat and manage verdict lifecycle.
pitfalls:
- 'The oracle helper for this task is pre-registered as cisco_conversation in the guardrails group. Replace the stub Op in tools/oracle/src/helpers/guardrails/cisco_conversation.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/cisco_conversation.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- flatten_responses_input coerces non-list, non-string inputs via str() and wraps as user messages, not treated as parse error.
- rewrite_responses_input_text handles plain-string message content (not wrapped in a list) as a direct replacement path separate from list/text-type detection.
- normalize_message_content recurses into nested content fields and handles both role-based messages and flat content-part schemas in one function.
- Text-type detection checks a fixed set of types (text, input_text, output_text, summary_text, reasoning_text) and skips unrecognized types.
- Tool definition extraction is recursive over both dicts and lists to find all string values, including deeply nested schema descriptions.
review_level: standard
budget:
  max_changed_lines: 1150
  max_new_expects: 0
