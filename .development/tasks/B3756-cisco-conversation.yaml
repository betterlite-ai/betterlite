id: B3756
title: Cisco conversation extraction and Responses conversion
description: >-
  Implement pure extraction helpers for chat, text-completion and Responses API
  text, reasoning and tool arguments, plus low-level Responses input rewrite
  conversions. These transformations sit below both request redaction (B3757) and
  stream inspection (B3762), and use no LiteLLM callbacks or shared guardrail
  setup. Owned functions handle plain strings, message arrays with nested
  content, flat content-part lists, and Responses API text-type schemas
  (text, input_text, output_text, summary_text, reasoning_text). Extract
  sanitized messages from verdicts and rewrite them back into request/response
  surfaces with incomplete-rewrite fallback for policy decisions.
