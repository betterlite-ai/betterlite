dod:
- text: >-
    extract_inspect_messages_from_request_chat handles instructions/system, messages
    with role/content pairs, calls normalize_message_content on instruction and each
    message content, and appends extract_message_tool_argument_parts. Empty instructions
    or content produce no message; null instructions/messages use empty list. Tool and
    function names/descriptions flatten via extract_tool_definition_text appended as
    system role; no tools field produces empty string and no message.
  proof: [helpers-rust, helper-python]
- text: >-
    extract_inspect_messages_from_request_responses_input
    passes data.input to flatten_responses_input. Plain string "hello" becomes one user
    message with content="hello". Message-array [{"role":"user","content":"x"}] preserves
    role and rewrites content via normalize_message_content. Flat-list
    [{"type":"input_text","text":"y"}] becomes one user message with concatenated text.
    Non-list, non-string null/123 coerces to str() and wraps as user message; empty
    string produces no message.
  proof: [helpers-rust, helper-python, fuzz-input]
- text: >-
    extract_inspect_messages_from_request_prompt falls back to data.prompt when
    messages/input are both absent; null prompt produces no fallback. With instructions
    and prompt both present, only instructions generates a system message.
  proof: [helpers-rust, helper-python]
- text: >-
    normalize_message_content_string returns the string unchanged; null/"" return "";
    non-string returns str(value). List with no text-type parts, nested content or
    arguments returns "".
  proof: [helpers-rust, helper-python]
- text: >-
    normalize_message_content_list extracts all text-type parts (text, input_text,
    output_text, summary_text, reasoning_text) and their values as space-joined string.
    Skips non-dict parts, non-string text values. Recurses into nested content and
    arguments/output fields. [{"type":"text","text":"a"},{"type":"input_text","text":"b"}]
    becomes "a b".
  proof: [helpers-rust, helper-python]
- text: >-
    extract_response_messages_chat handles ModelResponse with choices[].message: pulls
    content via normalize_message_content, appends extract_message_tool_argument_parts
    and extract_message_reasoning_parts, joins as "assistant" role. Empty parts produce
    no message; null choices defaults to [].
  proof: [helpers-rust, helper-python]
- text: >-
    extract_response_messages_text_completion handles TextCompletionResponse with
    choices[].text: joins all non-empty text fields as single "assistant" role message.
    Null choices defaults to [].
  proof: [helpers-rust, helper-python]
- text: >-
    extract_response_messages_responses_api handles output shape with output[].content[],
    output[].arguments, output[].text, output[].reasoning, output[].thinking: joins
    all non-empty string values as single "assistant" role message. Dict and non-dict
    getters both supported.
  proof: [helpers-rust, helper-python]
- text: >-
    extract_message_reasoning_parts pulls reasoning_content string, thinking_blocks[].{thinking,reasoning,text},
    and reasoning_items[].{summary[].text, text, reasoning, reasoning_content}. Returns
    space-joined list; skips non-string/empty values. Null fields return [].
  proof: [helpers-rust, helper-python]
- text: >-
    extract_message_tool_argument_parts pulls tool_calls[].function.arguments and
    function_call.arguments as strings. Returns space-joined list; null fields return [].
    Null tool_calls/function_call defaults to [].
  proof: [helpers-rust, helper-python]
- text: >-
    flatten_responses_input_string_to_message plain string "hello" returns [{"role":"user","content":"hello"}];
    empty string returns [].
  proof: [helpers-rust, helper-python, fuzz-input]
- text: >-
    flatten_responses_input_message_array with ["role"] keys detects message shape.
    List [{"role":"user","content":"x"},{"role":"assistant","content":"y"}] returns
    messages with role preserved and content rewritten via normalize_message_content.
    Missing/non-dict items skipped; empty content produces no message.
  proof: [helpers-rust, helper-python]
- text: >-
    flatten_responses_input_content_part_list with no ["role"] key detects flat content
    shape. List [{"type":"input_text","text":"a"},{"type":"output_text","text":"b"}]
    becomes one user message with concatenated text via normalize_message_content.
  proof: [helpers-rust, helper-python]
- text: >-
    flatten_responses_input_non_list_non_string input like integer 123 coerces to str()
    giving "123" as single user message; null/empty string produces []. Fallback applies
    when input is neither string nor list.
  proof: [helpers-rust, helper-python, fuzz-input]
- text: >-
    flatten_responses_input_message_string_content message-array item
    [{"role":"user","content":"hello"}] with plain string content (not list) rewrites
    content directly via sanitized_text without searching for text-type parts. Returns
    rewritten message in place.
  proof: [helpers-rust, helper-python]
- text: >-
    sanitized_messages_to_responses_input converts [{"role":"user","content":"text"}]
    to [{"role":"user","content":[{"type":"input_text","text":"text"}]}] and
    [{"role":"assistant","content":"text"}] to [{"role":"assistant","content":[{"type":"output_text","text":"text"}]}].
    Non-dict/non-content items skipped; returns None if no usable output.
  proof: [helpers-rust, helper-python]
- text: >-
    rewrite_responses_input_text_string returns sanitized_text directly when
    original_input is a plain string. Null original returns None.
  proof: [helpers-rust, helper-python]
- text: >-
    rewrite_responses_input_text_message_array_list_content detects last user item
    in [{"role":"user","content":[{"type":"input_text","text":"x"}]}] and rewrites
    first text-type part with sanitized_text. Returns None if no user item or no
    text-type part found.
  proof: [helpers-rust, helper-python]
- text: >-
    rewrite_responses_input_text_message_array_string_content detects last user item
    in [{"role":"user","content":"x"}] with plain string content (not list) and
    replaces it directly with sanitized_text. Does not recurse into content structure.
  proof: [helpers-rust, helper-python]
- text: >-
    rewrite_responses_input_text_flat_content_list rewrites first text-type part in
    [{"type":"input_text","text":"x"}] with sanitized_text. Returns None if no
    text-type part found.
  proof: [helpers-rust, helper-python]
- text: >-
    extract_tool_definition_text flattens data.tools and data.functions into a single
    space-joined string by recursing dicts and lists, extracting all string values.
    Empty or missing fields return "".
  proof: [helpers-rust, helper-python]
