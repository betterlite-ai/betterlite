dod:
  - text: >-
      Wildcard matching, metadata decoding and tag extraction behave as LiteLLM: a trailing star is a case-sensitive prefix test, other
      patterns are equality, a JSON-string metadata is decoded, bad JSON or a non-object gives no tags, and only an array of strings counts.
    proof: [matching-tests]
  - text: >-
      The alias filter builds an in-list for exact patterns and starts-with tests for star patterns, in LiteLLM's order, treats `%`, `_` and
      backslash in a prefix as literal, and reads rows newest first up to the row limit.
    proof: [store-tests]
  - text: >-
      The estimate returns -1 counts and the two global-scope sample strings for scope `*` without reading the database, and zeros for a
      request with no tags, teams or keys.
    proof: [estimate-tests]
  - text: >-
      The tag, team and key steps run in LiteLLM's order with its de-duplication quirks: each step compares against the list as it stood
      after the previous step, repeated aliases are kept, unnamed keys of matched teams are always counted, and samples hold the first 10.
    proof: [estimate-tests]
  - text: >-
      The row limit defaults to 1000, reads MAX_POLICY_ESTIMATE_IMPACT_ROWS text, and rejects a non-integer or negative value.
    proof: [estimate-tests]
  - text: >-
      The estimate-impact route answers 422 for a bad body, 500 `Database not connected` with no database (also for scope `*`), and 500
      with the error text for a database failure.
    proof: [impact-route-tests, oracle]
  - text: >-
      The preview gives `unsupported` with LiteLLM's text for any guardrail type other than litellm_content_filter, including a missing
      type, and keeps definition order.
    proof: [preview-tests, oracle]
  - text: >-
      The preview maps a runner result to `passed`, `masked`, `blocked` (empty output text, the detail's `error` member as details) or
      `error` (input text, the message), one definition at a time, and passes only the five content filter params.
    proof: [preview-tests]
  - text: >-
      overall_action ranks blocked over masked over error over unsupported over passed, and an empty list is `passed`.
    proof: [preview-tests]
  - text: >-
      POST /policy/templates/test answers with overall_action and results in LiteLLM's key order, needs no database, and answers 422 for a
      missing `text` or a non-array `guardrail_definitions`.
    proof: [template-route-tests, oracle]
  - text: >-
      Both request decoders reject malformed bytes and wrong shapes without panicking and have committed corpus inputs.
    proof: [request-corpus]

checks:
  optional: []
  commands:
    - id: matching-tests
      why: wildcard matching, metadata decoding or tag extraction is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^attachment_impact::.*tests::matching_/)'
    - id: store-tests
      why: an alias filter, the escaping, the ordering or the row limit read is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^attachment_impact::.*tests::store_/)'
    - id: estimate-tests
      why: the estimate steps, their de-duplication, the global shortcut or the row limit setting is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^attachment_impact::.*tests::(estimate_|limit_)/)'
    - id: impact-route-tests
      why: the estimate-impact route, its validation or its no-database answer is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^attachment_impact::.*tests::route_/)'
    - id: preview-tests
      why: the per-definition preview, its action mapping or the overall ranking is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^template_preview::.*tests::(preview_|overall_)/)'
    - id: template-route-tests
      why: the template test route, its body validation or its response shape is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^template_preview::.*tests::route_/)'
    - id: request-corpus
      why: the request decoders have no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/preview_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_preview_request_corpus)'

