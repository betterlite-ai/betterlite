id: B3249
title: Attachment impact and template guardrail previews
description: >-
  Build two management routes that preview a change before it is made, both in betterlite-server. POST `/policies/attachments/estimate-impact`
  counts the keys and teams a policy attachment would reach. POST `/policy/templates/test` runs a policy template's guardrail definitions
  against one text and reports what each would do. Neither route writes anything. B3242 gives the request and response records
  (`PolicyAttachmentCreateRequest`, `AttachmentImpactResponse`) in betterlite-policy. B722 and B724 give the key and team table handles in
  betterlite-db, built on B700's `find_many`. B882 gives the wildcard matcher `route_matches_wildcard_pattern`. B865 gives the
  `management_endpoint_wrapper` equivalent and B2400 gives `handle_exception_on_proxy`. B732, B855 and B756 own auth. Use the names and
  types as they exist when you start and re-implement none of them. B3250 owns `/policies/resolve` in the same LiteLLM file and B3252 owns
  the other `/policy/templates/...` routes; do not touch their code.

  Part 1, attachment impact. Code goes in crates/betterlite-server/src/attachment_impact.rs and attachment_impact/. Files: matching.rs,
  store.rs, estimate.rs, request.rs, route.rs, error.rs and tests.rs. `AttachmentImpactError` is a `thiserror` enum in error.rs. The
  service struct `AttachmentImpact` takes the key table handle, the team table handle and `row_limit: u32` through its constructor, and the
  route state takes `Option<AttachmentImpact>` (None stands for LiteLLM's `prisma_client is None`). No module-level state.

  Row limit. LiteLLM's `MAX_POLICY_ESTIMATE_IMPACT_ROWS` (constants.py L1885) is the env var of that name, default 1000. Add
  `row_limit_from_env(value: Option<&str>) -> Result<u32, AttachmentImpactError>` in estimate.rs: unset is 1000, a non-integer or negative
  text is an error (LiteLLM's `int()` fails at import). The caller reads the env var and passes the text. Every table read below uses
  this as `take`, ordered by `created_at` descending. That means counts are over the newest `row_limit` rows, not over all rows.

  Matching (matching.rs, pure functions, tested without a database). `route_matches_wildcard_pattern(route, pattern)` is B882's: a
  pattern ending in `*` is a prefix test on everything before the star, any other pattern is equality, both case-sensitive.
  - `parse_metadata(raw)` (L67-L76): null gives an empty object, a string is parsed as JSON and a parse failure gives an empty object, an
    object is kept, anything else is an empty object.
  - `tags_of(metadata)` (L79-L83): parse the metadata (this schema has no `metadata_json` column, so only `metadata` is read), take its
    `tags` value, and use an empty list when it is missing, null or empty. Only an array's string elements count (see deviations).
  - `filter_by_tags(rows, tag_patterns)` (L95-L117 for keys, L120-L142 for teams): for each row in the given order, take its alias (empty
    when null). If the row has at least one tag and any tag matches any pattern, then a non-empty alias is pushed to the named list and an
    empty alias adds one to the unnamed count. Return `(named, unnamed)`. The named list keeps duplicates and row order. Keys read the tags
    from the key's `metadata`; teams read them from the team's `metadata`.
  - `alias_filter(field, patterns)` (L40-L64): build the database filter. Patterns that end in `*` become a starts-with test on the text
    before the star; the others are collected into one `in` list. The conditions are the `in` test first (when any exact pattern exists)
    and then each starts-with test in pattern order. One condition is used alone, several are joined with OR, and none gives "the field is
    not null". Starts-with is case-sensitive and a `%`, `_` or backslash in the prefix is literal, so build it with bound parameters and
    escape the three characters, never by pasting text into SQL.

  Store (store.rs, the three reads over B722 and B724). `all_teams()` reads teams with no filter. `all_keys()` reads keys with no filter.
  `keys_in_teams(team_ids)` reads keys where `team_id` is in the list. `keys_by_alias(patterns)` reads keys with `alias_filter("key_alias",
  patterns)`. All four order by `created_at` descending and take `row_limit`. Rows are raw (B722 and B724 raw reads), so `metadata` may be
  a JSON string or an object and `matching.rs` decodes it. Database errors propagate as `AttachmentImpactError`.

  Estimate (estimate.rs, `AttachmentImpact::estimate(request) -> Result<AttachmentImpactResponse, AttachmentImpactError>`), steps in this
  order, copying `estimate_attachment_impact` (L323-L425):
  1. `scope == "*"` returns at once, without reading the database: `affected_keys_count` -1, `affected_teams_count` -1,
     `unnamed_keys_count` and `unnamed_teams_count` left at their default 0, `sample_keys` the one string `(global scope`, a space,
     an em dash (U+2014), a space, `affects all keys)`, and `sample_teams` the same with `teams` in place of `keys`. Any other scope, or
     none, continues.
  2. `tag_patterns` is `tags` or empty and `team_patterns` is `teams` or empty. When either is non-empty, read `all_teams()` once and
     reuse it in steps 3 and 4.
  3. Tags, when `tag_patterns` is non-empty: read `all_keys()`, run `filter_by_tags` on the keys to get `affected_keys` and
     `unnamed_keys`, and on the teams to get `affected_teams` and `unnamed_teams`.
  4. Team patterns, when `team_patterns` is non-empty (L145-L185). Walk the teams read in step 2 in order. A team whose alias is
     non-empty, matches any team pattern, and is not already in `affected_teams` (the list as it stands after step 3, not updated while
     walking) is pushed to `new_teams`, and its `team_id` text to the matched ids. A repeated alias in the rows is pushed twice. When any
     id matched, call `keys_in_teams(ids)`: a key with a non-empty alias that is not in `affected_keys` (the list after step 3) is pushed
     to `new_keys`; a key with an empty alias adds one to the unnamed count, even if step 3 already counted it. Then extend
     `affected_teams` with `new_teams`, `affected_keys` with `new_keys` and add the unnamed count to `unnamed_keys`.
  5. Key patterns, when `keys` is non-empty (L188-L212): call `keys_by_alias(patterns)`, and keep each row whose alias is non-empty,
     matches any key pattern and is not in `affected_keys` (the list after step 4). Extend `affected_keys` with them. Keys with no alias
     are not counted in this step.
  6. Return `affected_keys_count` = named keys + `unnamed_keys`, `affected_teams_count` = named teams + `unnamed_teams`, both unnamed
     counts, and `sample_keys` and `sample_teams` as the first 10 entries of each named list. A request with only `models`, or with no
     pattern field at all, returns zeros and empty samples after reading nothing.

  Route (route.rs). POST `/policies/attachments/estimate-impact`, tag `Policies`, response model `AttachmentImpactResponse`, in the
  standard authenticated group (B855 and B756 own the auth; LiteLLM's read-only admin viewer list holds only `/policies/attachments/list`,
  so this route gets no special case). Order of answers: shared 422 for a body that fails the decoder, then, with no database, HTTP 500
  with `detail` `Database not connected` (this applies to a global-scope request too), then the estimate. Any other failure is HTTP 500
  with `detail` set to the error text, and the failure is logged at error level with the text `Error estimating attachment impact: <error>`.
  This route does not use `handle_exception_on_proxy`; its errors are FastAPI-style `{"detail": ...}`. `request.rs` has
  `decode_impact_request(bytes: &[u8]) -> Result<PolicyAttachmentCreateRequest, ImpactRequestError>`: a JSON object where `policy_name`
  is a required string, `scope` is a string or null, `teams`, `keys`, `models` and `tags` are arrays of strings or null, `priority` is an
  integer from -2147483648 to 2147483647 or null, `default` is a boolean (default false), and unknown fields are ignored.

  Part 2, template preview. Code goes in crates/betterlite-server/src/template_preview.rs and template_preview/. Files: run.rs,
  overall.rs, request.rs, route.rs, error.rs and tests.rs. LiteLLM instantiates a `ContentFilterGuardrail` for each definition. Its
  constructor and its `apply_guardrail` wrapper have no planned Rust owner yet (B3695 owns only `_filter_single_text`), so this task
  does not build a content filter. It defines the port the production adapter will implement, in run.rs:
  `trait ContentFilterRunner { async fn run(&self, params: &ContentFilterParams, text: &str) -> Result<Vec<String>, RunFailure>; }`.
  `ContentFilterParams` holds `guardrail_name: String`, `patterns`, `blocked_words` and `categories` as optional `serde_json::Value`
  (passed through untouched, the content filter's own constructor validates them), `pattern_redaction_format: Option<String>` and
  `default_on: bool`. The runner makes a filter from these, with an empty `request_data` and input type `request`, runs it on the one
  text, and returns the resulting `texts`. `RunFailure` has `Blocked { detail: serde_json::Value }` for LiteLLM's HTTPException and
  `Failed { message: String }` for any other error. The service struct `TemplatePreview` takes the runner through its constructor.
  Tests use a fake runner.

  `preview(definitions, text) -> Vec<GuardrailTestResultEntry>` copies `_test_guardrail_definitions` (L1174-L1255). For each definition in
  order:
  - `guardrail_name` is the definition's `guardrail_name` or `unknown`. `litellm_params` is the definition's `litellm_params` or an
    empty object. `guardrail_type` is `litellm_params.guardrail` or an empty string.
  - A type other than `litellm_content_filter` gives an entry with action `unsupported`, `output_text` the input text, and `details`
    `Preview not available for guardrail type: <type>` (an empty type leaves the text ending after the colon and space).
  - Otherwise build `ContentFilterParams` from `litellm_params`: `patterns`, `blocked_words`, `categories` and
    `pattern_redaction_format` as given or absent, and `default_on` (default false). Only those five keys are passed. `guardrail_id`,
    `policy_template`, `severity_threshold`, `event_hook`, `blocked_words_file`, `image_model` and `competitor_intent_config` in the
    params are ignored, so the constructor defaults apply to them.
  - Run it. On `Ok(texts)`, `output_text` is the first element when the list is non-empty, else the input text. When `output_text` differs
    from the input the action is `masked` with details `Content was modified (masked)`, else `passed` with details `No issues detected`.
  - `RunFailure::Blocked` gives action `blocked`, `output_text` empty, and `details` the detail's string `error` member when the detail
    is an object that has one, else the detail as a string (JSON text for an object without a string `error`).
  - `RunFailure::Failed` gives action `error`, `output_text` the input text, `details` the message.
  - One definition's failure never stops the others, and the results keep definition order.

  `overall_action(results)` (overall.rs, L1258-L1265) returns the worst action by priority blocked 4, masked 3, error 2, unsupported 1,
  passed 0, starting from `passed`, with a later entry replacing the current only when strictly greater. An empty list is `passed`.

  Route (route.rs). POST `/policy/templates/test`, tag `policy management`, in the standard authenticated group, wrapped once with B865's
  management wrapper as LiteLLM's `@management_endpoint_wrapper` does. It needs no database. The body is `guardrail_definitions` (required
  array of objects) and `text` (required string). The answer is `{"overall_action": ..., "results": [{"guardrail_name", "action",
  "output_text", "details"}, ...]}` with those key names and order. Any error that escapes `preview` goes through B2400's
  `handle_exception_on_proxy`, which gives the OpenAI-style error body. `request.rs` has `decode_template_test(bytes: &[u8]) ->
  Result<TestPolicyTemplateRequest, TemplateTestRequestError>`, shared 422 on failure.

  Fuzz and corpus. One cargo-fuzz target, `preview_request`, feeds both decoders. Commit corpus inputs for malformed JSON, a wrong top-level
  type, wrong field types, an out-of-range `priority`, a non-object definition and missing `text`.

  Tests. Native tests live in `attachment_impact::tests` with prefixes `matching_`, `store_`, `estimate_`, `limit_` and `route_`, and in
  `template_preview::tests` with prefixes `preview_`, `overall_` and `route_`; the checks filter on them. Store tests run against a real
  Postgres through POSTGRES_TEST_URL or testcontainers and cover the starts-with escaping, the order, the take limit and the team-id
  membership read. `estimate_` tests run the service over that same database with rows for keys with and without alias and tags, teams
  with and without alias, tag-only, team-only, key-only and combined requests. There are no helper oracle cases: the estimate reads
  tables and the preview needs the content filter, which a pure helper adapter cannot reach.

  Oracle. HTTP cases go in tools/oracle/cases/policies/attachment-impact/ and tools/oracle/cases/policies/template-test/. They send the
  real request to the booted proxy with the master key and no database. Compare status and body, and for 422 compare the status only (see
  deviations). The impact cases cover the no-database 500 (scope `*` and a tags request), the 422 for a body without `policy_name` and the
  401 without a key. The template cases cover an empty definition list, one definition of another guardrail type, a definition with no
  `litellm_params`, two unsupported definitions in order, the 422 for a missing `text` and the 401 without a key. Cases that need a
  working content filter are left to the task that adds the production runner; this task covers those paths with the fake runner.

