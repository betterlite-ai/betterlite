deviations:
  - what: The 422 body for a bad request body uses the server's shared validation response and wording, not FastAPI's `loc` and `msg` strings. Status 422 matches.
    why: Every route in the server shares one validation response.
  - what: A `tags` value in key or team metadata that is not an array, and array elements that are not strings, are ignored. LiteLLM iterates a string tag value by character and fails with HTTP 500 on a non-string element.
    why: No working setup relies on either result (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_resolve_endpoints.py#L79-L83).
  - what: A definition in `guardrail_definitions` whose `guardrail_name` or `litellm_params.guardrail` is not a string, whose `litellm_params` is not an object, or whose `default_on` is not a boolean is HTTP 422. LiteLLM calls `.get` on the value and answers 500 with an AttributeError text.
    why: A 500 from an unhandled exception on malformed input belongs to 4xx (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L1174-L1195).
  - what: The content filter is reached through the `ContentFilterRunner` port, not constructed inside the route.
    why: The constructor and `apply_guardrail` wrapper have no Rust owner yet, and the port keeps this task testable until one lands.

out_of_scope:
  - "B3250 owns resolve_policies_for_context, POST /policies/resolve (policy_resolve_endpoints.py L215-L320) and the module's router and imports."
  - "B3252 owns POST /policy/templates/enrich and its stream; B3253 owns GET /policy/templates and POST /policy/templates/suggest; B3251 and B3250 own the other endpoints.py routes (apply_policies, validate, list, info, match)."
  - "B3242 owns PolicyAttachmentCreateRequest and AttachmentImpactResponse; B722 and B724 own the key and team table handles; B700 owns find_many; B882 owns route_matches_wildcard_pattern."
  - "The ContentFilterGuardrail constructor (content_filter.py L210-L330) and apply_guardrail (L1874-L1955) have no owner at the time of writing; B3695 owns _filter_single_text only. The production ContentFilterRunner adapter belongs to whoever takes them."
  - "B865 owns management_endpoint_wrapper and B2400 owns handle_exception_on_proxy; this task calls them."
  - "PolicyAttachmentCreateRequest validation of `policy_name` existence is not done by this route: LiteLLM never looks the policy up when estimating."

pitfalls:
  - "Scope `*` is checked before any database read, but the `Database not connected` 500 comes first, so with no database even a global-scope request is 500."
  - "The global-scope answer leaves `unnamed_keys_count` and `unnamed_teams_count` at 0 and puts an em dash (U+2014) in both sample strings; copy the bytes exactly."
  - "Tag matching tests every tag of a row against every pattern, and a row with no tags never counts, even for pattern `*`."
  - "The team step compares an alias only against `affected_teams` as it was after the tag step, so two teams with the same alias both enter `new_teams`, and a team already found by tag is skipped along with its keys."
  - "Unnamed keys of matched teams add to `unnamed_keys` without checking whether the tag step counted the same key, so the count can exceed the number of distinct keys."
  - "The key-alias step re-checks each returned row with the wildcard matcher, and only the trailing `*` is a wildcard: `dev-*-x` is an exact pattern."
  - "Counts come from at most `row_limit` newest rows per read, so a large deployment under-counts; that is LiteLLM's behavior and the response does not say so."
  - "Starts-with in the database is case-sensitive and the prefix must be escaped for `%`, `_` and backslash, or `dev_*` would also match `devX`."
  - "The preview passes only patterns, blocked_words, categories, pattern_redaction_format and default_on; `severity_threshold` and `competitor_intent_config` in the definition do nothing."
  - "A blocked entry has an empty `output_text`, while an `error` entry keeps the input text; the two are easy to swap."
  - "`/policy/templates/test` works without a database; only the impact route checks for one."

