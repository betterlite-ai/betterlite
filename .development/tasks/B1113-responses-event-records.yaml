id: B1113
title: Responses streaming event records
description: >-
  Add the event records and complete ResponsesAPIStreamingResponse union from openai.py
  L1509-L1929 to betterlite-openai::api::responses_event_records. The old range stopped in
  the union; this task owns its closing discriminator too. Reuse B1138 response objects and
  B902 WireDecodeLimits. decode_responses_event_record(bytes, limits) decodes one JSON event;
  SSE framing and event selection remain B925. The parser must preserve generic provider
  fields and the difference between required nullable fields and defaults.

  Cover every enum literal with a named rstest row and a helper oracle input. The pinned
  Python adapter constructs the corresponding event model or GenericEvent; it must not
  replace the union's permissive generic path with a stricter invented schema. ErrorEvent
  is an event value, not a raised HTTP exception. Private _hidden_params on a completed
  event is empty and absent from JSON. Feed arbitrary bytes to this same decoder from
  responses_event_records fuzzing and replay committed corpus seeds with replays_corpus.

  There are 295 nonblank, non-comment lines including the union tail. Budget 305 native
  declarations/decoder, 145 behavior tests, 130 compact oracle fixtures, 85 adapters,
  60 fuzz/replay and 25 wiring: 750 lines.
scope:
  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/responses_event_records.rs
  - crates/betterlite-openai/src/api/responses_event_records/**
  - crates/betterlite-openai/fuzz/Cargo.toml
  - crates/betterlite-openai/fuzz/fuzz_targets/responses_event_records.rs
  - crates/betterlite-openai/fuzz/corpus/responses_event_records/**
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/openai/responses_event_records.rs
  - tools/oracle/src/helpers/openai/responses_event_records/**
  - tools/oracle/helpers/responses_event_records.py
  - tools/oracle/helpers/responses_event_records/**
  - tools/oracle/fuzz/corpus/helper_case/responses_event_records-*
  - tools/oracle/cases/helpers/responses-event-records/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L1509-L1929
  why: Every event discriminant, concrete record and the whole discriminator union, including GenericEvent fallback.
dod:
- text: >-
    lifecycle_events sends each of response.created,response.in_progress,response.completed,
    response.failed,response.incomplete with response={id:resp_a,created_at:1,output:[],
    usage:{input_tokens:2,output_tokens:1,total_tokens:3}}; expect unchanged type and token counts.
    Only completed,incomplete,failed belong to ResponsesTerminalEvent. Hidden fields are omitted.
  proof: [event-tests, oracle, event-adapter]
- text: >-
    item_content_events round-trips response.output_item.added with output_index=2,item=null;
    response.output_item.done with item={type:message} defaults sequence_number=1.
    response.content_part.added/done preserve item_id=msg_a,output_index=2,content_index=3.
    Done parts accept {type:output_text,text:hi,annotations:[],logprobs:null},
    {type:refusal,refusal:no} and {type:reasoning_text,reasoning:think}. Missing required
    logprobs in the concrete output-text part fails. Logprob objects retain token="a",
    logprob=-1,bytes=[97],top_logprobs=[{token:b,logprob:-2}].
  proof: [event-tests, oracle, event-adapter]
- text: >-
    text_tool_events preserves item_id=i,output_index=0,content_index=1 and payloads for
    response.output_text.delta(delta=hi),response.output_text.done(text=hi),
    response.output_text.annotation.added(annotation_index=2,annotation={type:url_citation,url:https://a.test}),
    response.refusal.delta(delta=no),response.refusal.done(refusal=no).
    response.function_call_arguments.delta uses delta="{" and .done uses arguments="{}";
    neither requires content_index. response.custom_tool_call_input.delta(delta=patch),
    response.custom_tool_call_input.done(input=patch),response.shell_call.in_progress,
    response.shell_call.completed,response.shell_call_output.done use GenericEvent and retain extra fields.
  proof: [event-tests, oracle, event-adapter]
- text: >-
    reasoning_events supplies item_id=rs_a,output_index=1 to response.reasoning_summary_part.added
    with part={type:summary_text,text:hi}; response.reasoning_summary_text.delta adds delta=hi
    and defaults summary_index=0. response.reasoning_summary_text.done(text=hi,sequence_number=7)
    and response.reasoning_summary_part.done(part={type:summary_text,text:hi},sequence_number=8)
    also default summary_index=0; explicit summary_index=3 survives. Concrete done models
    reject missing sequence_number rather than inventing it.
  proof: [event-tests, oracle, event-adapter]
- text: >-
    search_mcp_events sends output_index=2,item_id=tool_a for response.file_search_call.in_progress,
    .searching,.completed and response.web_search_call.in_progress,.searching,.completed;
    expect the exact type and indices. response.mcp_list_tools.in_progress,.completed,.failed
    and response.mcp_call.in_progress,.completed,.failed additionally require sequence_number=4.
    response.mcp_call_arguments.delta(delta="{") and .done(arguments="{}") retain that sequence
    and do not parse the payload string as JSON. image_generation.partial_image carries
    partial_image_index=1,b64_json=YQ== without requiring item_id.
  proof: [event-tests, oracle, event-adapter]
- text: >-
    error_and_generic sends type=error,sequence_number=9,error={type:invalid_request_error,
    code:context_length_exceeded,message:too long}; param defaults null, with explicit param=input
    and param={field:input} both accepted. GenericEvent(type=vendor.future,extra=7) preserves
    extra=7, including protected-name keys such as model_debug. Missing type fails that concrete
    model. Record validation errors remain validation failures, not fabricated HTTP status codes.
  proof: [event-tests, oracle, event-adapter]
- text: Event JSON over the supplied byte limit is rejected and malformed/new event corpus files replay without panics.
  proof: [event-corpus]
checks:
  optional: [mutants]
  commands:
  - id: event-tests
    why: a discriminant, required field or event-specific default is wrong
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::/) - test(/::replays_corpus$/)'
  - id: event-adapter
    why: the event oracle cannot construct the pinned event classes independently
    run: test -f tools/oracle/helpers/responses_event_records.py && grep -qE '^[[:space:]]+responses_event_records:' tools/oracle/fuzz/corpus/helper_case/responses_event_records-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: event-corpus
    why: external event bytes have no production-decoder fuzz replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/responses_event_records)" && grep -qF decode_responses_event_record crates/betterlite-openai/fuzz/fuzz_targets/responses_event_records.rs && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/helpers/responses-event-records/lifecycle-events.yaml
- tools/oracle/cases/helpers/responses-event-records/item-content-events.yaml
- tools/oracle/cases/helpers/responses-event-records/text-tool-events.yaml
- tools/oracle/cases/helpers/responses-event-records/reasoning-events.yaml
- tools/oracle/cases/helpers/responses-event-records/search-mcp-events.yaml
- tools/oracle/cases/helpers/responses-event-records/error-and-generic.yaml
deviations: []
out_of_scope:
- B1138 owns parse_cost, reasoning/usage validators, reasoning-null serialization and output_text in openai.py; B004 owns all remaining methods in that file, outside L1273-L1929.
- B925 chooses event classes during SSE processing; B937 constructs client-facing stream errors and B927 drives provider streams.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_event_records in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/responses_event_records.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_event_records.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- image_generation.partial_image has no response. prefix, unlike most event strings.
- summary_index defaults to 0, but most output/content indices and MCP sequence numbers are required.
- Custom-tool and shell enum members have no dedicated record class here and must survive through GenericEvent.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
