id: B1113
title: Responses streaming event records
description: >-
  Define native Responses event records and the public event decoder in the wire crate, including terminal usage
  and all pinned event discriminants. Reuse B902 response objects through a lower common record dependency, not
  a reverse orchestration dependency.


  Implement crates/betterlite-openai/src/api/responses_event_records.rs. Use ResponsesEventRecordsInput and ResponsesEventRecordsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions terminal_usage_records, event_discriminants, tool_call_delta_record,
  reasoning_summary_record, unknown_event_shape under api::responses_event_records::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  The production external-byte decoder is betterlite-openai::api::responses_event_records::decode_responses_event_record(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/responses_event_records.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-openai/fuzz/fuzz_targets/responses_event_records.rs passes arbitrary bounded bytes to
  that exact decoder; api::responses_event_records::tests::replays_corpus replays newly committed seeds through
  the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesEventRecords in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_event_records: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  This task owns the declarative types/tooling boundary named above, not additional LiteLLM callables. Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 261 owned nonblank/non-comment/non-docstring Python lines (266 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 281 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 591 total within the 600-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B171 (Direct helper oracle and URL path
  encoding), B1087 (Api boundaries), B1138 (Responses objects and usage). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
