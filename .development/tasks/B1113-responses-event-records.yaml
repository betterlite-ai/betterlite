checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::/)
      - test(/::replays_corpus$/)'
  - id: case-terminal-usage-records
    why: the terminal-usage-records behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::tests::terminal_usage_records($|::)/)'
  - id: case-event-discriminants
    why: the event-discriminants behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::tests::event_discriminants($|::)/)'
  - id: case-tool-call-delta-record
    why: the tool-call-delta-record behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::tests::tool_call_delta_record($|::)/)'
  - id: case-reasoning-summary-record
    why: the reasoning-summary-record behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::tests::reasoning_summary_record($|::)/)'
  - id: case-unknown-event-shape
    why: the unknown-event-shape behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_event_records::tests::unknown_event_shape($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/responses_event_records)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/responses_event_records.rs && grep -qF "decode_responses_event_record"
      crates/betterlite-openai/fuzz/fuzz_targets/responses_event_records.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::responses_event_records::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_event_records.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_event_records-*)"
      && grep -qE "^[[:space:]]+responses_event_records:" tools/oracle/fuzz/corpus/helper_case/responses_event_records-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-event-records)"
