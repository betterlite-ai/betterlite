deviations: []
out_of_scope:
  - "The handlers: B3100, B3101, B3102 and B4787. The daily activity routes and the first lines of app/spend.rs: B8482."
  - "B8270's release layer, and B3102's accumulator feed and the flush schedule of flush_gateway_requests: the edge part (B8680) installs them with B3889's billable request metrics middleware. The route itself reads only the database."
  - "The spend report and spend log routes (B1721 to B1732) and GET /spend/capture_rate: B069 composes them and B8662 merges them."
pitfalls:
  - "B4787's routes() function lives in routes/agent_daily_activity.rs but router() does not merge it; merging it there as well as here would panic on the duplicate path."
  - "The per-user analytics path is /tag/user-agent/per-user-analytics, not /tag/user."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
