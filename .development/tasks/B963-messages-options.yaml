id: B963
title: Messages options
description: >-
  Project requested Messages parameters and native refusal details, build source mock responses and convert system
  text for bridges. Use the typed error service for safeguard refusal without treating ordinary stop reasons as
  errors.


  Implement crates/betterlite-core/src/api/messages_options.rs. Use MessagesOptionsInput and MessagesOptionsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions optional_parameter_selection, safeguard_refusal, openai_refusal_text,
  responses_refusal_text, mock_tool_response under api::messages_options::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesOptions in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_options: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/messages/utils.py: get_safeguard_refusal_stop_details
  (L24-L34); litellm/llms/anthropic/pass_through/messages/utils.py: refusal_stop_details (L37-L39); litellm/llms/anthropic/pass_through/messages/utils.py:
  _mapping_field (L42-L46); litellm/llms/anthropic/pass_through/messages/utils.py: _mapping_str_field (L49-L51);
  litellm/llms/anthropic/pass_through/messages/utils.py: openai_chat_refusal_text (L54-L63); litellm/llms/anthropic/pass_through/messages/utils.py:
  _responses_message_refusal_text (L66-L85); litellm/llms/anthropic/pass_through/messages/utils.py: responses_output_refusal_text
  (L88-L97); litellm/llms/anthropic/pass_through/messages/utils.py: safeguard_refusal_error (L100-L109); litellm/llms/anthropic/pass_through/messages/utils.py:
  anthropic_system_to_openai_message (L112-L119); litellm/llms/anthropic/pass_through/messages/utils.py: _anthropic_messages_optional_param_keys
  (L123-L131); litellm/llms/anthropic/pass_through/messages/utils.py: AnthropicMessagesRequestUtils.get_requested_anthropic_messages_optional_param
  (L136-L177); litellm/llms/anthropic/pass_through/messages/utils.py: mock_response (L180-L223). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 145 owned nonblank/non-comment/non-docstring Python lines (188 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 165 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 415 total within the 420-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B175 (Provider parameter capabilities
  and mapping), B902 (Responses shapes), B958 (Messages errors), B1087 (Api boundaries). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
