id: B963
title: Messages optional parameters, refusals and mock results
description: >-
  Implement every function and the incomplete-stream message constant in messages/utils.py in
  betterlite-core::api::messages_options. Select the static AnthropicMessagesRequestOptionalParams keys,
  then call B569's speed gate and B688's sampling gate only when model is non-null. B011 constructs SDK
  exceptions, B958 supplies Anthropic response records, and B902 supplies typed Responses output objects.

  Refusal helpers distinguish typed Chat message attributes from raw Responses mappings. A refusal is not
  automatically an exception: get_safeguard_refusal_stop_details returns a dict only for an Anthropic dict
  with stop_reason=refusal and dict stop_details; the caller separately chooses safeguard_refusal_error.
  Keep the fixed source mock response, including its model and token counts, even when callers supply another model.

  Expose HelperCall::MessagesOptions for option filtering, refusal extraction, system conversion and mock output.
  Compare SDK exception class/status/type/param/code rather than a proxy envelope. All inputs are typed records;
  neither provider I/O nor a new byte decoder belongs here. Use adjacent rstest cases for the branches below.
  Count 175 nonblank/non-comment implementation lines plus 23 option-declaration lines; budget 170 implementation, 145 tests, 130 fixtures, 85 adapters
  and 30 wiring, 560 lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_options.rs
  - crates/betterlite-core/src/api/messages_options/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/messages_options.rs
  - tools/oracle/src/helpers/core_ops/messages_options/**
  - tools/oracle/helpers/messages_options.py
  - tools/oracle/helpers/messages_options/**
  - tools/oracle/fuzz/corpus/helper_case/messages_options-*
  - tools/oracle/cases/helpers/messages-options/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/utils.py#L18-L223
  why: Own optional-key selection, refusal projections, system-message conversion and the fixed mock response/errors.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/anthropic.py#L408-L430
  why: This TypedDict supplies the complete filter key set, independently of native-provider supported fields.
dod:
- text: >-
    optional_key_projection sends a non-null value for each of max_tokens,metadata,stop_sequences,stream,system,
    temperature,thinking,tool_choice,tools,top_k,inference_geo,top_p,mcp_servers,context_management,compaction,
    container,output_format,speed,output_config,cache_control,reasoning_effort,safeguards and retains them with
    model=null. Drop messages,model,litellm_metadata,unknown and every null value; preserve false,0,[],{} and empty
    strings. Repeated calls use the same static key set and do not mutate the caller's original params.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    model_option_gates uses model=claude-sonnet-4-5,speed=fast and an unsupported-speed target: drop_params=false
    raises UnsupportedParamsError status=400 with absent type/param/code; true warns and removes speed. The global
    litellm.drop_params=true also removes it. With a target whose sampling capability is false, temperature=0,
    top_p=0.5 and top_k=2 each fail 400 unless dropping is enabled, in which case they disappear without a warning;
    temperature=1 survives. Speed is checked before temperature, then top_p, then top_k. B569/B688 own config defaults.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    safeguard_refusal_details sends stop_reason=refusal,stop_details={} and receives {}; missing/null/list details,
    a non-dict response or stop_reason=end_turn return none. refusal_stop_details("blocked") returns
    {type:refusal,category:null,explanation:blocked}, and null explanation stays null. safeguard_refusal_error with
    category=safety yields ContentPolicyViolationError status=400,type=null,param=null,code=null,provider=anthropic
    and the supplied model; source message contains "Anthropic safeguard refusal (category: safety)." Missing
    category uses "None". Ignore only generated exception wording, not the details record.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    chat_refusal_precedence uses a typed Message/Delta with refusal=first and provider_specific_fields.refusal=second
    and returns first. Empty/nonstring first falls back to second; empty/nonstring second returns none. A raw dict
    {refusal:first} returns none because this function reads attributes. Responses refusal extraction accepts typed
    or raw message items, skips empty refusals and non-message output, and returns the first nonempty refusal in
    the first qualifying message. content=null,content="text" and malformed parts do not manufacture a refusal.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    system_message_projection turns "guide" into {role:system,content:guide} and a nonempty block list into the
    same system record without flattening it. Empty string/list, null, dict and numeric inputs produce none.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    mock_message_literals defaults text to "Hi! My name is Claude." and always returns
    id=msg_013Zva2CMHLNnXjNJJKqJ2EF,model=claude-sonnet-4-20250514,role=assistant,type=message,stop_reason=end_turn,
    stop_sequence=null,usage={input_tokens:2095,output_tokens:503}. Explicit text=hello changes only the text block.
    Caller tools never produce tool_use here. The literal strings litellm.InternalServerError,
    litellm.ContextWindowExceededError and litellm.RateLimitError raise their named classes with statuses 500,400,429;
    respective types are internal_server_error,null,throttling_error, codes null,null,"429", and params null.
    Source messages are "this is a mock internal server error", "this is a mock context window exceeded error"
    and "this is a mock rate limit error" with SDK prefixes; preserve class and fields while ignoring wording.
  proof: [behavior-tests, oracle, helper-python]
- text: New helper fixtures and the messages_options parser seed cover fixed mock output as well as empty/refusal cases.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: optional-field selection or refusal handling has no independently failing test
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_options::/)'
  - id: helper-python
    why: the options adapter cannot execute pinned helpers under strict Python checks
    run: test -f tools/oracle/helpers/messages_options.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the options operation is absent from the helper input format
    run: grep -qE '^[[:space:]]+messages_options:' tools/oracle/fuzz/corpus/helper_case/messages_options-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: the task adds no option/refusal fixtures
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-options)"
oracle_cases:
- tools/oracle/cases/helpers/messages-options/optional-key-projection.yaml
- tools/oracle/cases/helpers/messages-options/model-option-gates.yaml
- tools/oracle/cases/helpers/messages-options/safeguard-refusal-details.yaml
- tools/oracle/cases/helpers/messages-options/chat-refusal-precedence.yaml
- tools/oracle/cases/helpers/messages-options/system-message-projection.yaml
- tools/oracle/cases/helpers/messages-options/mock-message-literals.yaml
deviations: []
out_of_scope:
- B569 owns speed support and its warning; B688 owns sampling support, and B011 owns SDK exception constructors.
- B958 owns Anthropic wire types and B902 owns Responses types; this task owns all callable behavior in messages/utils.py.
- B978/B979 consume INCOMPLETE_STREAM_ERROR_MESSAGE and own its SSE/error emission.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_options in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_options.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_options.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A raw Chat dict with refusal is not equivalent to the typed Message object accepted by openai_chat_refusal_text.
- The fixed mock model is claude-sonnet-4-20250514 regardless of the requested model or max_tokens.
- Empty stop_details is a valid safeguard result, so truthiness would lose a refusal branch.
review_level: standard
budget:
  max_changed_lines: 580
  max_new_expects: 0
