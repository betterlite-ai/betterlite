id: B720
title: Verification-token, user and end-user row contracts
description: >-
  Implement betterlite-db::identity_rows for LiteLLM_VerificationToken,
  LiteLLM_DeletedVerificationToken, LiteLLM_UserTable, SCIMPlaceholder and LiteLLM_EndUserTable.
  B2310 owns the shared budget, permission and organization-membership types they embed. These
  row models construct and serialize data; they do not encrypt credentials, hash tokens, decide
  model permissions or write database rows. Use B700 RowCodec with native types and preserve
  field presence for partial updates instead of merging omitted values into explicit nulls.

  VerificationToken has no required fields. spend and total_spend default 0.0; models defaults [];
  aliases, config, metadata, permissions, model_spend, model_max_budget and budget_fallbacks default
  {}. budget_fallbacks maps strings to string lists; the other dict/list declarations keep their
  source element flexibility through named data payloads rather than assuming every model entry
  is a string. allowed_cache_controls and allowed_routes default [] but accept explicit null.
  soft_budget_cooldown defaults false and is not nullable. rotation_count defaults 0 and auto_rotate
  false; both accept explicit null. All remaining fields default None: token, key_name, key_alias,
  max_budget, expires, user_id, team_id, agent_id, project_id, max_parallel_requests, tpm_limit,
  rpm_limit, tpd_limit, budget_duration, budget_reset_at, key_type, blocked, litellm_budget_table,
  budget_id, org_id, created_at, created_by, updated_at, updated_by, settings_updated_at, last_active,
  object_permission_id, object_permission, access_group_ids, rotation_interval, last_rotation_at,
  key_rotation_at, router_settings and budget_limits. litellm_budget_table is a generic dict here,
  not the typed budget used by end users. object_permission uses B2310. budget_limits is a list
  of dicts; access_group_ids a string list. expires accepts an arbitrary string or datetime without
  requiring every string to parse as a timestamp. Other timestamp fields validate as datetimes.

  Preserve strings such as '*' and 'all-proxy-models' as values, with no expansion in this layer.
  A null token spend/models/dict field fails unless its declaration is nullable; the key model has
  no user-style normalizer. DeletedVerificationToken inherits every key field and adds id,
  organization_id, deleted_at, deleted_by, deleted_by_api_key and litellm_changed_by, all None by
  default. It retains both inherited org_id and separate organization_id. Serialization does not
  hash or redact token/deleted_by_api_key values, which are required storage fields; diagnostic
  messages must not echo row payloads.

  UserTable requires user_id. user_alias, team_id, sso_user_id, organization_id,
  object_permission_id, password, password_reset_required, last_breach_check_at, user_role,
  max_budget, user_email, metadata, max_parallel_requests, tpm_limit, rpm_limit, budget_duration,
  budget_reset_at, created_at, updated_at, organization_memberships and object_permission default
  None. teams, models, allowed_cache_controls and policies default []; teams/cache controls/policies
  contain strings while models retains the unparameterized source list. spend defaults 0.0;
  model_spend and model_max_budget default {} but allow explicit null. Its before-validator maps
  both missing and explicit-null spend to 0.0, models to [] and teams to []; no other null is
  repaired. password remains readable internally but is excluded from every normal model dump,
  including an explicit include request; do not serialize it accidentally through an SQL row adapter.
  organization_memberships and object_permission decode through B2310. Keep the inherited
  unknown-field-ignore behavior, fresh mutable defaults and named validation paths for bad fields.

  SCIMPlaceholder requires placeholder_user_id, resolved_user_ids and team_ids, the latter two
  tuples of strings (JSON arrays at the wire). Empty tuples are valid, order and duplicate IDs
  survive and no lookup or canonicalization occurs here. EndUserTable requires user_id and blocked;
  it has no default blocked=false. alias, allowed_model_region, default_model, budget_id,
  litellm_budget_table, object_permission_id and object_permission default None, and spend defaults
  0.0. Only missing/null spend is normalized. allowed_model_region is exactly 'eu' or 'us',
  case-sensitive; unknown/uppercase values fail. Embedded budget and permissions use B2310.

  No owned validator calls json.loads on dict/list fields: a stored string containing JSON is
  rejected rather than accepted as an object. Repository-specific string conversions remain with
  their owners. Validate an outer stored row through decode_identity_rows(&[u8]); retain normal
  scalar coercions that Pydantic permits, without broadening container shapes. Money uses checked
  rust_decimal::Decimal at the SQL boundary without altering the pinned DOUBLE PRECISION schema;
  reject nonfinite/out-of-range amounts instead of erasing them or making budgets unlimited.
  Neither this layer nor its oracle adapter invents HTTP status/type/param/code for model validation.

  The pure identity_rows helper in B856's database namespace constructs/dumps the actual pinned
  classes and exposes internal password separately only as a boolean presence assertion. Cover
  every declared field with minimal-default and explicit-value roundtrips, then malformed/null cases
  per distinct field category. B171 owns HelperCase envelope decoding. B860 Postgres fixtures use
  POSTGRES_TEST_URL when set, otherwise testcontainers; assert stored JSON versus typed defaults
  and existing float columns, with no invented transactional row operation. Add the identity_rows
  fuzz target to B2307's workspace for the production decoder, limited to 1048576 bytes and depth
  64. Replay all row kinds, truncated JSON/UTF-8, duplicate fields and exact/over-limit payloads.

  Moving budget.py to B2310 and omitting the two unused user methods leaves about 154 nonblank
  noncomment lines. Allow 200 native fields/code, 290 field/coercion/Postgres tests, 65 helper
  adapters, 45 fuzz and 30 wiring lines, 630 within 700. Separate key, user and end-user modules
  so every source file stays below 300 lines.
scope:
  paths:
    - crates/betterlite-db/src/identity_rows.rs
    - crates/betterlite-db/src/identity_rows/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - tools/oracle/src/helpers/db/identity_rows.rs
    - tools/oracle/src/helpers/db/identity_rows/**
    - tools/oracle/helpers/identity_rows.py
    - tools/oracle/helpers/identity_rows/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/identity-rows/**
    - tools/oracle/fuzz/corpus/helper_case/identity-rows-*
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/identity_rows.rs
    - crates/betterlite-db/fuzz/corpus/identity_rows/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/verification_token.py#L16-L79
    why: Every key default, nullable field, generic budget dict and deleted-key additions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/user.py#L19-L61
    why: User fields, password exclusion and the three null-normalized fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/user.py#L74-L79
    why: SCIM placeholder's required ordered tuple fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/end_user.py#L17-L36
    why: Required blocked flag, exact region literals, typed nested rows and spend normalization.
dod:
  - text: 'Oracle tests name key_all_defaults, key_all_explicit_fields_roundtrip,
      key_nullable_lists_and_rotation_fields, key_nonnullable_nulls_fail,
      key_generic_budget_dict_and_typed_permission, key_expires_string_stays_string,
      key_model_sentinels_are_plain_values, deleted_key_additions_and_two_org_ids,
      user_all_defaults_and_required_id, user_all_explicit_fields_roundtrip,
      user_spend_models_teams_null_normalization, other_user_nulls_not_normalized,
      user_password_excluded_even_when_included, nested_membership_and_permission,
      placeholder_required_tuples_preserve_order_and_duplicates,
      end_user_all_defaults_and_required_blocked, end_user_region_exact_literals,
      end_user_null_spend_and_typed_budget, json_strings_are_not_container_values,
      unknown_fields_ignored, fresh_mutable_defaults and pydantic_scalar_coercion_boundaries.
      The all-fields cases assert every field listed in the description, not just selected examples.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'postgres_identity_rows_preserve_storage_types checks key/user/end-user rows through the
      pinned schema, including explicit zero and nullable JSON/array fields. Native tests
      identity_money_nonfinite_and_overflow_rejected and native_identity_row_size_and_depth_limits
      prove the documented differences. replays_the_identity_rows_corpus invokes the production decoder.'
    proof: [behavior-tests, postgres-tests, parser-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Field defaults, null normalization and password omission need assertions separate from corpus replay.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^identity_rows::tests::/) - test(replays_the_identity_rows_corpus)'
    - id: helper-python
      why: Adapters must instantiate the real row models and preserve their validation boundary.
      run: test -f tools/oracle/helpers/identity_rows.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Require a new identity_rows operation seed in the existing typed envelope corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/identity-rows-*")" && grep -rlq identity_rows tools/oracle/fuzz/corpus/helper_case/identity-rows-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Existing SQL column types and nulls must survive the new row codec.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/identity_rows::tests::postgres_identity_rows_preserve_storage_types$/)'
    - id: parser-corpus
      why: External stored-row bytes must reach the same decoder in production and fuzz replay.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/identity_rows.rs && grep -q identity_rows crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/identity_rows)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_identity_rows_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/identity-rows/key-fields-and-deletion.yaml
  - tools/oracle/cases/helpers/identity-rows/user-normalization-and-password.yaml
  - tools/oracle/cases/helpers/identity-rows/scim-placeholder-tuples.yaml
  - tools/oracle/cases/helpers/identity-rows/end-user-region-and-budget.yaml
  - tools/oracle/cases/helpers/identity-rows/container-and-scalar-validation.yaml
deviations:
  - what: Stored identity-row JSON over 1048576 bytes or depth 64 fails with a typed decode-limit error.
    why: Bound this new stored-data decoder; native_identity_row_size_and_depth_limits tests both limits.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/verification_token.py#L16-L65
  - what: Identity-row monetary values outside Decimal's finite range fail decoding instead of remaining Python floats.
    why: Checked conversion implements money-is-decimal without changing the SQL schema; identity_money_nonfinite_and_overflow_rejected prevents fallback to zero or unlimited budgets.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/verification_token.py#L20-L22
out_of_scope:
  - B2310 owns budget.py, object_permission.py and organization_membership.py, including the temporary-budget methods and membership email projection.
  - LiteLLM_UserTable.is_over_budget and has_model_access have no caller at the pin; do not add unused policy methods or their cases.
pitfalls:
  - 'The oracle helper for this task is pre-registered as identity_rows in the db group. Replace the stub Op in tools/oracle/src/helpers/db/identity_rows.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/identity_rows.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Key spend=null is invalid, while user and end-user spend=null are normalized to zero.
  - Deleted keys carry both org_id and organization_id, which must not be collapsed into one field.
  - A user's password can be read internally but Field(exclude=True) wins even over a serialization include request.
budget:
  max_changed_lines: 700
  max_new_expects: 0
review_level: security
