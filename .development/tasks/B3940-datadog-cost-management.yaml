id: B3940
title: Datadog FOCUS cost aggregation and upload
description: >-
  Build the Datadog cost management logger that aggregates successful API call costs into
  FOCUS daily cost entries and uploads them to Datadog's custom costs API.

  The logger extends CustomBatchLogger and accepts cost_tag_keys: a list of metadata
  fields allowed in cost attribution tags. Aggregate positive-cost success records by
  provider, model, date (UTC) and normalized tags, then PUT the array of DatadogFOCUSCostEntry
  objects to https://api.{DD_SITE}/api/v2/cost/custom_costs with DD-API-KEY and
  DD-APPLICATION-KEY headers (both required for upload).

  Tag extraction pulls base tags (env, service, host, pod_name) from environment configuration,
  always-on canonical FOCUS dimensions (provider, model, model_id) from StandardLoggingPayload
  top-level fields, and optional user/team/model_group metadata. The allowlist cost_tag_keys
  gates request_tags (split on ":", preserved if in allowlist and nonempty), metadata
  fields, and nested metadata under spend_logs_metadata and requester_metadata. Reserved keys
  (env, service, host, pod_name, provider, model, model_id, team, user, model_group) are
  hard-blocked even when allowlisted, preventing team-controlled overwrite of trusted cost
  attribution. Warn and drop reserved keys when user supplies them. Normalize user, team, and
  allowlist-gated custom tags through the tag normalizer; base tags and FOCUS dimensions are
  stored as-is.

  Load configuration from environment: DD_API_KEY (required for upload, warn if missing),
  DD_APP_KEY (required for upload, warn if missing), DD_SITE (default datadoghq.com), and
  cost_tag_keys (default empty list). The default flush_interval is five seconds from CustomBatchLogger. Missing credentials
  skip upload but leave logs in the queue without error. Requeue order is preserved: failed
  batch is prepended to the queue on exception. Direct threshold send and inherited periodic
  flush paths must be compared separately because their requeue retention differs; the
  batch from the queue is mutated in place, so failed sends restore the original batch.

