deviations:
  - what: When either DD_API_KEY or DD_APP_KEY is absent, the logger warns at initialization and skips upload on send, but does not fail; missing credentials do not prevent the logger from operating.
    why: This matches LiteLLM's behavior where cost management warns if either key is missing but continues to accept logs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_cost_management.py#L55-L58
  - what: Dates are computed using local system time via datetime.fromtimestamp, not UTC, despite the comment suggesting UTC interpretation.
    why: This matches LiteLLM's implementation which uses fromtimestamp without explicit UTC specification.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_cost_management.py#L132
  - what: Reserved keys are blocked with a debug-level log, not a warning, when user supplies them.
    why: LiteLLM logs at debug level when filtering reserved keys to avoid log noise for allowlisted but then rejected keys.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_cost_management.py#L227-L232

out_of_scope:
  - Datadog API authentication beyond environment variable loading; B002 supplies resolved credentials.
  - HTTP transport implementation; B173 supplies the async client and PUT method.
  - Payload serialization and compression; B192 supplies safe_dumps.
  - StandardLoggingPayload type definition and metadata records; B254 owns those.
  - Batch initialization and periodic flush base behavior; B256 supplies CustomBatchLogger.
  - Configuration key resolution from config.yaml; B002's loader handles all config inputs.
  - Datadog tag normalization; B3930 supplies normalize_datadog_tag_value.
  - Exporter initialization and callback registration; B113 composes the logger with others.

pitfalls:
  - The DD_SITE environment variable must not have a trailing slash when constructing the upload URL; datadoghq.com is the correct format, not datadoghq.com/.
  - Cost aggregation groups by a tuple of (provider, model, date_str, tags_key); the tags_key is a sorted tuple of (key, value) pairs for stable grouping across requests.
  - Team tag extraction tries four different metadata keys in order; only the first found value is used, not a merge of all four.
  - Nested metadata extraction checks isinstance(nested, dict) to ensure only dict-typed fields are traversed; lists and other types are skipped.
  - The upload method must prepend the failed batch to the queue (batch_to_send + self.log_queue) to preserve order on exception.
  - Reserved keys are checked after user supply, not before filtering from metadata; the check prevents overwrites by allowlist membership alone.
  - When zero or negative costs appear in the aggregation loop, they are silently skipped with no queue mutation, unlike failed sends which cause requeue.

review_level: security

