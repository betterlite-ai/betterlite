dod:
  - text: DatadogCostManagementLogger loads cost_tag_keys from configuration and accepts cost_tag_keys in constructor, defaulting to an empty list.
    proof: [config-init]
  - text: Only success records with positive response_cost are added to the log queue; zero and negative costs are silently dropped.
    proof: [positive-costs-only]
  - text: Costs are aggregated by provider, model, UTC date (YYYY-MM-DD) and normalized tags into DatadogFOCUSCostEntry objects with ProviderName, ChargeDescription, ChargePeriodStart, ChargePeriodEnd, BilledCost, BillingCurrency and optional Tags.
    proof: [cost-aggregation]
  - text: Base tags (env, service, host, pod_name) come from environment configuration, and FOCUS dimensions (provider, model, model_id) come from StandardLoggingPayload fields.
    proof: [base-focus-tags]
  - text: User/team/model_group tags are extracted from metadata when present, with team preferring user_api_key_team_alias, then team_alias, then user_api_key_team_id, then team_id.
    proof: [user-team-tags]
  - text: Allowlist-gated request_tags (split on colon) and metadata fields from spend_logs_metadata and requester_metadata are added only when their keys are in cost_tag_keys.
    proof: [allowlist-gating]
  - text: Reserved keys (env, service, host, pod_name, provider, model, model_id, team, user, model_group) are hard-blocked even when allowlisted; a debug log warns and drops them.
    proof: [reserved-keys-blocked]
  - text: User, team, and allowlist-gated custom tags are normalized through normalize_datadog_tag_value; base tags and FOCUS dimensions (provider, model, model_id) are stored as-is via str() conversion.
    proof: [tag-normalization]
  - text: Configuration loads DD_API_KEY (required for upload, warn if missing), DD_APP_KEY (required for upload, warn if missing), DD_SITE (default datadoghq.com), and cost_tag_keys through the B002 loader.
    proof: [config-defaults]
  - text: Upload URL is constructed as https://api.{DD_SITE}/api/v2/cost/custom_costs with no trailing slash.
    proof: [upload-url]
  - text: Failed batches are prepended to the queue on exception, preserving requeue order.
    proof: [requeue-order]
  - text: Direct threshold send and inherited periodic flush paths both trigger upload and preserve queue behavior separately.
    proof: [flush-paths]
  - text: Mutants in tag extraction, reserved-key checking, aggregation and upload logic are caught by tests.
    proof: [mutants]

