id: B765
title: JWT user and team provisioning and fallback identity
description: >-
  Implement JWT user lookup and synchronization, using B760 claim readers and B871 GrantResolver.
  get_user_info reads email first; domain enforcement produces None when disabled, false for an absent
  email when enabled, otherwise B761's domain result. The user-id reader falls back to that email.
  get_objects resolves organization by truthy id before alias through B879, then rejects false domain
  validation with 403 auth_error, param user_email. That failure happens after organization lookup but
  before user creation. Resolve user/membership with B736/B737 loaders and sso_user_id equal to the claim
  id; an explicit user_id_upsert argument overrides B760's setting/domain decision. Only then load a truthy
  end_user_id through B739 with the route. Return user, organization, end user, membership and effective
  database user id in that order; B871 owns canonical identity and its fuzzy lookup behavior.

  map_user_to_teams returns when either object is absent or a roster member has the same truthy user_id.
  Otherwise invoke B808's team_member_add service with Member role user and a PROXY_ADMIN principal,
  retaining its database/cache/audit effects. Swallow only ProxyException type team_member_already_in_team,
  debug-log it, and propagate every other error. The source comment calls this nonblocking, but the call
  is awaited and most failures still fail authentication.

  sync_user_role_and_teams returns if disabled or either user/database is missing. Map the role through
  B890; only a nonempty changed role writes B723's user row, then changes the in-memory user and writes
  B733's cache under user_id using get_management_object_ttl. Next compute claim-team sets: with
  fallback_to_db_teams off use only plural claims, with it on use the combined singular/plural reader.
  Add missing teams and remove stored teams absent from claims, except that fallback enabled with no
  claims preserves database teams. If any difference exists call B064.patch_team_membership with its
  default raise_on_error=False, then assign the user object's teams to the claim set and cache it. The
  SCIM helper attempts every add/remove and logs roster failures; its success return does not prove all
  writes landed. Preserve this possible partial database/cache divergence, not an invented transaction.


  Build the production jwt_provisioning module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTAuthManager.get_user_info (L1753-L1763; 11 source lines), JWTAuthManager.get_objects (L1779-L1887; 101 source lines), JWTAuthManager.map_user_to_teams
  (L2009-L2057; 43 source lines), JWTAuthManager.sync_user_role_and_teams (L2060-L2130; 59 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.user_allowed_email_domain=None;
  litellm_jwtauth.sync_user_role_and_teams=False; litellm_jwtauth.fallback_to_db_teams=False;
  litellm_jwtauth.user_id_upsert=False. B760 owns claim-path settings and B890 owns role mapping settings.


  Add the pure get_user_info projection as jwt_provisioning under B856 Management::jwt. Python calls that
  MIT method with configured claim readers. Database lookup and synchronization are HTTP and Rust Postgres
  cases, not helper invocations that indirectly call management handlers.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-provisioning-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::jwt_provisioning::tests::provisioning_defaults, loads_provisioning_settings,
  boolean_setting_coercion and malformed_provisioning_settings. Assert accepted YAML booleans and the
  pinned bool string coercion, and validation errors for unrecognized strings rather than a default fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 214 nonblank, noncomment pinned lines after removing the uncalled canonical-id wrapper. Allow
  215 production, 300 behavior/Postgres tests, 45 helper adapters, 65 stage wiring and 65 config lines,
  690 changed lines within a 750-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::jwt_provisioning::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
