pitfalls:
  - 'The oracle helper for this task is pre-registered as jwt_provisioning in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/jwt_provisioning.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/jwt_provisioning.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - With fallback_to_db_teams=false, a singular-only claim is ignored by synchronization and existing DB teams are removed.
  - SCIM's default failure suppression can leave cached claim teams ahead of actual roster writes.
