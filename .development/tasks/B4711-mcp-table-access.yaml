dod:
  - text: McpIdentifierConflict record with field (literal "server_name" or "alias"), value, and server_id.
    proof: [table-access-types]
  - text: _mcp_server_table_actions returns MCPServerRepository table handle.
    proof: [table-access-tests]
  - text: _oauth_client_table_actions returns MCPServerOAuthClientRepository table handle.
    proof: [table-access-tests]
  - text: _db_transaction_manager returns prisma_client.db.tx().
    proof: [table-access-tests]
  - text: _identifier_where filters by case-insensitive alias and server_name, includes NULL approval_status, excludes drafts and optionally a specified server_id.
    proof: [table-access-tests, conflict-where-clause]
  - text: _identifier_field extracts a string value from a mapping by key, returns None if absent or not a string.
    proof: [table-access-tests]
  - text: _find_mcp_server_identifier_conflict checks alias first, then server_name, returns McpIdentifierConflict with field name or None.
    proof: [table-access-tests, conflict-alias-first]
  - text: _mcp_identifier_lock_keys computes sorted signed BLAKE2b advisory-lock keys from lowercased identifiers, deduping and returning empty tuple if all are empty.
    proof: [table-access-tests, lock-keys-sorted, lock-keys-signed]
  - text: _mcp_server_write_if_identifier_free acquires advisory locks for each key, checks for conflicts while locked, and runs write closure or returns conflict.
    proof: [table-access-tests, lock-write-conflict]
  - text: _db_find_mcp_server_rows queries server table with optional WHERE filter.
    proof: [table-access-tests]
  - text: _db_find_mcp_server_row returns single server by server_id or None.
    proof: [table-access-tests]
  - text: _db_update_mcp_server_row updates server by server_id and raises ValueError "MCP server not found..." if absent.
    proof: [table-access-tests, update-not-found]
  - text: _db_find_user_credential_row returns credential by user_id/server_id composite key or None.
    proof: [table-access-tests]
  - text: _db_find_user_credential_rows queries credentials with optional WHERE filter.
    proof: [table-access-tests]
  - text: _db_upsert_user_credential_row inserts or updates credential_b64 by composite key.
    proof: [table-access-tests]
  - text: _db_find_user_env_var_rows queries env vars with optional WHERE filter.
    proof: [table-access-tests]
  - text: _readable_mcp_servers validates and decrypts each row, warns and skips on SecretMapDecodeError.
    proof: [table-access-tests, readable-secret-error]
  - text: get_all_mcp_servers returns all non-draft servers, including NULL approval_status, optionally filtered by approval_status.
    proof: [table-access-tests, get-all-drafts-excluded, get-all-null-included]
  - text: get_mcp_server returns single server by server_id with env vars decrypted, or None.
    proof: [table-access-tests]
  - text: get_mcp_servers returns list of servers by server_ids iterable.
    proof: [table-access-tests]
  - text: approve_mcp_server sets approval_status to "active", records reviewed_at as current UTC, sets updated_by.
    proof: [table-access-tests, review-approve]
  - text: reject_mcp_server sets approval_status to "rejected", records reviewed_at and updated_by, optionally sets review_notes.
    proof: [table-access-tests, review-reject]
  - text: get_mcp_submissions returns MCPSubmissionsSummary with servers ordered by submitted_at DESC, capped at 500, with status counts.
    proof: [table-access-tests, submissions-cap, submissions-counts]
  - text: set_mcp_server_pinned_tools returns None if server absent, serializes tools with model_dump, writes JSON via safe_dumps, returns validated row.
    proof: [table-access-tests, pinned-tools-serialize]
  - text: get_active_submitted_mcp_server_ids_for_user returns server IDs submitted by user with approval_status "active", or empty list if user_id empty.
    proof: [table-access-tests, active-submissions]
  - text: _get_prisma_client_or_none returns global prisma_client or None.
    proof: [management-tests]
  - text: get_prisma_client_or_throw raises HTTPException status 500 with detail dict if prisma_client is None.
    proof: [management-tests, prisma-throw-status]
  - text: New oracle helper operation for MCP table access integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: table-access-types
      why: McpIdentifierConflict or table access types are missing or incomplete.
      run: grep -qE 'struct McpIdentifierConflict|pub struct McpIdentifierConflict' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'field.*Literal|value.*String|server_id.*String' crates/betterlite-db/src/mcp/table_access.rs
    - id: table-access-tests
      why: Table access tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_table_access::tests::/) - test(/replays_the_/)'
    - id: conflict-where-clause
      why: _identifier_where does not filter correctly.
      run: grep -qE 'fn _identifier_where' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'case.*insensitive|mode.*insensitive' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'OR.*approval_status.*None|approval_status.*not.*draft' crates/betterlite-db/src/mcp/table_access.rs
    - id: conflict-alias-first
      why: Identifier conflict detection does not check alias before server_name.
      run: grep -qE 'fn.*find.*identifier.*conflict|fn.*conflict.*check' crates/betterlite-db/src/mcp/table_access.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_table_access::tests::.*alias.*first/)'
    - id: lock-keys-sorted
      why: _mcp_identifier_lock_keys does not sort keys.
      run: grep -qE 'fn _mcp_identifier_lock_keys' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'sorted\(|sort\(' crates/betterlite-db/src/mcp/table_access.rs
    - id: lock-keys-signed
      why: _mcp_identifier_lock_keys does not use signed BLAKE2b.
      run: grep -qE 'blake2b|BLAKE2b' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'signed.*True|signed=True|"big".*"signed"' crates/betterlite-db/src/mcp/table_access.rs
    - id: lock-write-conflict
      why: Write-if-identifier-free operation does not check conflicts while locked.
      run: grep -qE 'fn.*write.*if.*identifier|fn.*write_if.*conflict' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'execute_raw|pg_advisory_xact_lock' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'McpIdentifierConflict' crates/betterlite-db/src/mcp/table_access.rs
    - id: update-not-found
      why: _db_update_mcp_server_row does not raise ValueError when server absent.
      run: grep -qE 'fn _db_update_mcp_server_row' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'MCP server not found' crates/betterlite-db/src/mcp/table_access.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_table_access::tests::.*update.*not_found/)'
    - id: readable-secret-error
      why: _readable_mcp_servers does not warn and skip on SecretMapDecodeError.
      run: grep -qE 'fn _readable_mcp_servers' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'SecretMapDecodeError|Skipping MCP server' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'warning|warn' crates/betterlite-db/src/mcp/table_access.rs
    - id: get-all-drafts-excluded
      why: get_all_mcp_servers does not exclude drafts.
      run: grep -qE 'fn get_all_mcp_servers' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'MCPApprovalStatus.*draft|not.*draft' crates/betterlite-db/src/mcp/table_access.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_table_access::tests::.*get_all.*draft/)'
    - id: get-all-null-included
      why: get_all_mcp_servers does not include NULL approval_status.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_table_access::tests::.*get_all.*null/)'
    - id: review-approve
      why: approve_mcp_server does not set approval_status or reviewed_at.
      run: grep -qE 'fn approve_mcp_server' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'MCPApprovalStatus.*active|approval_status.*active' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'reviewed_at' crates/betterlite-db/src/mcp/table_access.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_table_access::tests::.*approve/)'
    - id: review-reject
      why: reject_mcp_server does not set approval_status or review_notes.
      run: grep -qE 'fn reject_mcp_server' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'MCPApprovalStatus.*rejected|approval_status.*rejected' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'review_notes' crates/betterlite-db/src/mcp/table_access.rs
    - id: submissions-cap
      why: get_mcp_submissions does not cap at 500 items.
      run: grep -qE 'fn get_mcp_submissions' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'take.*500|take\(500\)' crates/betterlite-db/src/mcp/table_access.rs
    - id: submissions-counts
      why: get_mcp_submissions does not return MCPSubmissionsSummary with status counts.
      run: grep -qE 'MCPSubmissionsSummary' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'pending_review|active|rejected' crates/betterlite-db/src/mcp/table_access.rs
    - id: pinned-tools-serialize
      why: set_mcp_server_pinned_tools does not serialize tools or use safe_dumps.
      run: grep -qE 'fn set_mcp_server_pinned_tools' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'safe_dumps|model_dump' crates/betterlite-db/src/mcp/table_access.rs
    - id: active-submissions
      why: Active submission query does not filter by approval_status or handle empty user_id.
      run: grep -qE 'fn.*active.*submissions|fn.*get.*active.*server' crates/betterlite-db/src/mcp/table_access.rs && grep -qE 'MCPApprovalStatus.*active' crates/betterlite-db/src/mcp/table_access.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_table_access::tests::.*active.*submission/)'
    - id: management-tests
      why: Management accessor tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp_management_access::tests::/) - test(/replays_the_/)'
    - id: prisma-throw-status
      why: get_prisma_client_or_throw does not raise 500 status.
      run: grep -qE 'fn get_prisma_client_or_throw' crates/betterlite-server/src/mcp/management_access.rs && grep -qE 'HTTP_500|status.*500|status_code.*500' crates/betterlite-server/src/mcp/management_access.rs && grep -qE 'detail.*error|"error"' crates/betterlite-server/src/mcp/management_access.rs
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4711.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/mcp-table-access-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

