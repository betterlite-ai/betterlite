id: B4711
title: MCP table access, identifier locks and server reads
description: >-
  Build typed MCP table access, case-insensitive alias/name conflict detection under
  advisory locks, decoded server reads, review-state writes and pinned-catalog writes in
  betterlite-db. Put both management DB-handle accessors in betterlite-server where they
  are called by management endpoints, so helper functions that present server data do not
  depend on registry reloads.

  Table access: Implement _mcp_server_table_actions, _oauth_client_table_actions,
  _db_transaction_manager, _user_credential_actions, _user_env_var_actions, and a local
  _MCPUserEnvVarsRepository that provides table operations for MCP servers, OAuth clients,
  user credentials and per-user environment variables. Each function returns a TableActions
  handle from the auxiliary repository layer that owns these tables.

  Identifier conflict detection: _identifier_where constructs a Prisma WHERE clause that
  matches case-insensitively against both server_name and alias, excludes draft approval
  statuses (reserving them for transient OAuth session flows that never reach the registry),
  includes NULL approval_status (rows predating the approval workflow), and optionally
  excludes a specific server_id to support update operations. _identifier_field extracts
  a field value from a dict and returns it only if it is a string. _find_mcp_server_identifier_conflict
  checks alias first (so the reported field is deterministic), then server_name, and returns
  a McpIdentifierConflict with the colliding field, value and server_id, or None if both
  are clear. find_mcp_server_identifier_conflict is an unlocked check for callers outside
  write paths.

  Advisory locks: _mcp_identifier_lock_keys computes deterministic sorted signed 64-bit
  BLAKE2b advisory-lock keys from lowercased identifiers. Each key is the output of
  hashlib.blake2b(f"mcp_identifier:{normalized}", digest_size=8) interpreted as a big-endian
  signed integer. Only non-empty identifiers produce keys, duplicates are deduped, and
  the keys are sorted so concurrent requests for the same pair always lock in the same order.
  _mcp_server_write_if_identifier_free acquires per-identifier advisory locks in transaction
  order, checks for conflicts while locked, and runs a write closure only if no conflict exists.
  Return the written row, a McpIdentifierConflict if a collision was found, or None if the
  write produced no row.

  Server lookup and mutation: _db_find_mcp_server_rows queries with optional WHERE clause
  filters (used by other parts). _db_find_mcp_server_row gets a single server by server_id,
  returning None if absent. _db_update_mcp_server_row updates by server_id and raises
  ValueError with message "MCP server not found, passed server_id={server_id}" if the row
  is absent.

  User credential and environment tables: _db_find_user_credential_row gets a single
  credential by user_id and server_id composite key. _db_find_user_credential_rows queries
  with optional WHERE filters. _db_upsert_user_credential_row inserts or updates a
  credential_b64 blob (encrypted value) using the composite key. _db_find_user_env_var_rows
  queries environment variables with optional WHERE filters.

  _UserEnvVarsTransactionClient and _UserEnvVarsTransaction are Protocol types that declare
  the transaction contract: a client with litellm_mcpuserenvvars, litellm_mcpservertable
  table actions and an async execute_raw(query: str, *args) for advisory locks. They are
  never implemented in this task; they define the seam that B714 provides.

  Readable servers: _readable_mcp_servers iterates rows, validates each with
  LiteLLM_MCPServerTable.model_validate (owned by B858), decrypts its env_vars
  (owned by B4710), and yields it. On SecretMapDecodeError, warn with
  "Skipping MCP server {server_id}: cannot decrypt secret map" and skip that row.

  Server reads: get_all_mcp_servers returns all servers except drafts, optionally filtered
  by approval_status. When approval_status is None, include NULL approval_status and
  exclude draft status (using an OR clause so NULL is not silently dropped by a bare inequality).
  get_mcp_server returns a single server by server_id, or None if absent, with env vars
  decrypted. get_mcp_servers returns a list by server_ids iterable.

  Review operations: approve_mcp_server sets approval_status to "active", records reviewed_at
  as current UTC time, and sets updated_by. reject_mcp_server sets approval_status to "rejected",
  records reviewed_at and updated_by, and optionally sets review_notes only if non-null.
  get_mcp_submissions returns all servers with submitted_at IS NOT NULL, ordered by
  submitted_at DESC, capped at 500 items for safety, wrapped in MCPSubmissionsSummary with
  total count and counts by pending_review, active, rejected status. All read rows through
  _readable_mcp_servers so secret-map failures are warned and skipped.

  Pinned tools: set_mcp_server_pinned_tools imports safe_dumps (owned by B192), checks
  the server exists (return None if absent), serializes the pinned_tools mapping to JSON
  (calling model_dump on each tool), writes the serialized JSON and updated_by, and returns
  the validated updated row with env vars decrypted.

  Active submissions: get_active_submitted_mcp_server_ids_for_user returns server IDs of
  servers submitted by a user with approval_status="active" (creator visibility). Return
  empty list if user_id is empty.

  Management accessors: _get_prisma_client_or_none returns the global prisma_client from
  litellm.proxy.proxy_server, or None if the proxy is configured without a database (so
  in-memory OAuth sessions can degrade gracefully). get_prisma_client_or_throw raises
  HTTPException with status 500 and detail {"error": message} if prisma_client is None,
  where message is a supplied string parameter.

  Preserve alias-first conflict reporting (alias checked before server_name), exclusion of
  drafts but inclusion of NULL approval status, sorted signed BLAKE2b lock keys, the 500-item
  submissions cap, and warn-and-skip secret-map failures in listings. Handle empty user_id
  as falsy without error.

