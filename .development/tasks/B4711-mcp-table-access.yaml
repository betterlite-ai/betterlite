  - what: Advisory locks use signed BLAKE2b instead of Python's hashlib implementation
      directly, but maintain the same lock-key semantics and order.
    why: Rust's blake2b crate computes the same digest; the only difference is the
      input transformation and byte-order interpretation, which is preserved.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L583-L594
  - what: _UserEnvVarsTransactionClient and _UserEnvVarsTransaction are Protocol types
      declaring the transaction contract, not implementations. They are fulfilled by B714's
      WriterSession or equivalent.
    why: Rust Protocol types define the seam between this task and B714's transaction
      provider. This task never implements the protocol; callers supply the implementation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L65-L75

