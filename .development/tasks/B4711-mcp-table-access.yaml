pitfalls:
  - _mcp_identifier_lock_keys returns an empty tuple if all identifiers are empty or None,
    which is correct (no locks needed). Test both empty and non-empty cases.
  - _identifier_where uses "insensitive" mode for database case-insensitivity. Different
    databases may have different collation behavior; test against the actual Prisma schema.
  - _mcp_server_write_if_identifier_free acquires locks in sorted order across concurrent
    requests. A test should verify that two concurrent requests for the same identifier
    cannot both pass the check.
  - 'get_all_mcp_servers with approval_status=None is special: it includes both NULL and non-draft rows. This is unlike a bare query that would drop NULLs on an inequality.'
  - SecretMapDecodeError from _readable_mcp_servers is caught and logged as a warning,
    not raised. The server is skipped, so the caller never sees it. This is distinct from
    other errors which propagate.
  - set_mcp_server_pinned_tools calls model_dump on each PinnedMCPTool before serializing,
    then safe_dumps the dict. This imports B192's safe_dumps, which must be available at runtime.
  - The MCPUserEnvVarsRepository is local to this task and is not shared; no other task
    should use it directly.

