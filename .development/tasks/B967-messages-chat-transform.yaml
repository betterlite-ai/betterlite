id: B967
title: Messages chat transform
description: >-
  Compose the input/output stages into MessagesChatTransform with its tool-name map retained for response restoration.
  This unit owns the public transformation entrypoints only; bridge execution and stream state remain separate services.


  Implement crates/betterlite-core/src/api/messages_chat_transform.rs. Use MessagesChatTransformInput and MessagesChatTransformResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions roundtrip_long_tool_name, messages_request_chat_shape, chat_response_messages_shape,
  stream_delta_tool_name_restore under api::messages_chat_transform::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesChatTransform in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_chat_transform: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/transformation.py: AnthropicAdapter.__init__
  (L229-L230); litellm/llms/anthropic/pass_through/adapters/transformation.py: AnthropicAdapter.translate_completion_input_params
  (L232-L243); litellm/llms/anthropic/pass_through/adapters/transformation.py: AnthropicAdapter.translate_completion_input_params_with_tool_mapping
  (L245-L282); litellm/llms/anthropic/pass_through/adapters/transformation.py: AnthropicAdapter.translate_completion_output_params
  (L284-L304); litellm/llms/anthropic/pass_through/adapters/transformation.py: AnthropicAdapter.translate_completion_output_params_streaming
  (L306-L345); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_anthropic_to_openai
  (L1214-L1288). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 113 owned nonblank/non-comment/non-docstring Python lines (158 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 133 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 365 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B964 (Messages chat content), B965
  (Messages chat options), B966 (Messages chat output), B1087 (Api boundaries). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
