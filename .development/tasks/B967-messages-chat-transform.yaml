id: B967
title: Compose Messages and Chat transformations
description: >-
  Implement AnthropicAdapter and translate_anthropic_to_openai as the public composition layer in
  betterlite-core::api::messages_chat_transform. Delegate conversation content to B964, system/metadata/thinking
  to B965, tools/schema to B2431, result records to B966 and stream iteration to B977. Preserve the tool-name map
  across the call boundary and pass B968 polyfill applied edits, compaction block and iteration usage to both
  output paths. The stateless constructor adds no singleton or registry.

  Input composition converts messages, inserts top-level system, translates metadata, tool choice, tools, thinking,
  stops and output format, then copies untouched parameters last. The public kwargs wrapper pops model and messages
  before checking either for truthiness. The convenience wrapper discards only the name map, not options.
  Default is_async=true returns an async AnthropicSSEStream; false returns the synchronous SSE iterator.

  Keep input/output record cases in HelperCall::MessagesChatTransform. The messages_chat_transform_stream
  B2401 variant calls B004 against the mock Chat provider, then the production output wrapper, capturing actual
  HTTP and events. No later B974 execution handler is needed. There is no new byte parser: B004/B005 decode
  provider data. Count 158 nonblank/non-comment source lines; budget 145 implementation, 140 tests, 130 fixtures,
  120 dual adapters and 40 wiring, 575 lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_chat_transform.rs
  - crates/betterlite-core/src/api/messages_chat_transform/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/messages_chat_transform.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/messages_chat_transform.py
  - tools/oracle/fuzz/corpus/helper_case/messages_chat_transform-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/messages_chat_transform_stream.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/messages_chat_transform_stream.py
  - tools/oracle/cases/helpers/messages-chat-transform/**
  - tools/oracle/cases/sdk-http/messages-chat-transform/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L229-L345
  why: Own complete public input/output wrappers and the sync/async stream-factory choice.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L1214-L1288
  why: Own request composition order and the retained truncated-name map.
dod:
- text: >-
    required_request_fields calls the public wrapper with missing model or messages and gets KeyError for that
    missing key. model="" with messages=[{role:user,content:hi}] raises ValueError "Bad Request: model is required
    for Anthropic Messages Request"; model=gpt-4o with messages=[] raises the equivalent messages-required error.
    Both keys have been popped before the falsey-value checks; a missing messages key still consumes model.
    The helper failure projection has no HTTP status/type/param/code, and generated wording is the only ignored field.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    composed_chat_request sends model=gpt-4o,messages=[{role:user,content:hello}],system=guide,max_tokens=12,
    metadata={user_id:alice},litellm_metadata={tag:t},stop_sequences=[END],tool_choice={type:any} and no tools.
    Expect model=gpt-4o,messages=[{role:system,content:guide},{role:user,content:hello}],max_tokens=12,user=alice,
    metadata={tag:t},stop=[END],tool_choice=required and an empty name map. litellm_metadata disappears from the
    request record. An explicit stop=[LAST] overwrites the translated stop in the last-copy phase.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    long_tool_name_roundtrip declares a 65-character a name and selects it with tool_choice. Both outgoing names
    are 55 a characters followed by _635361c4; the returned map restores the full 65-character name in a mock
    tool-call response. The convenience input wrapper returns the same request without exposing the map.
    preserve_midturn_system=true on direct request composition reaches B964 unchanged.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    composed_message_response wraps id=chat_a,model=gpt-4o,assistant content=hello,finish=stop,usage=10/2 into
    id=chat_a,type=message,role=assistant,model=gpt-4o,content=[{type:text,text:hello}],stop_reason=end_turn,
    stop_sequence=null,stop_details=null,usage={input_tokens:10,output_tokens:2}. A supplied PolyfillResult prepends
    its compaction block, includes nonempty applied_edits and preserves its summary iterations before the message iteration.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    stream_factory_modes sends a real Chat stream from the mock with text=hello, stop and usage=10/2. Default
    is_async and explicit false both emit message_start, text block start/delta/stop, message_delta and message_stop
    with model=gpt-4o and the same usage. The async result exposes chunks/messages/model and supports aclose;
    the sync result is directly iterable. A long-name tool chunk uses the saved map, and polyfill compaction/
    applied_edits/iterations reach B977 in both modes. Logging context identity is retained.
  proof: [behavior-tests, oracle, adapters]
- text: The helper and HTTP factory drivers have separate newly committed fixtures and a registered pure-record seed.
  proof: [new-cases, helper-corpus, oracle, adapters]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: composition and stream-mode selection lack behavior tests
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_transform::/)'
  - id: adapters
    why: either record or HTTP stream comparison lacks a strict Python implementation
    run: test -f tools/oracle/helpers/messages_chat_transform.py && test -f tools/oracle/sdk_http/messages_chat_transform_stream.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: helper-corpus
    why: the pure composition call has no parser seed
    run: grep -qE '^[[:space:]]+messages_chat_transform:' tools/oracle/fuzz/corpus/helper_case/messages_chat_transform-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no new record and stream factory parity cases were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-chat-transform)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/messages-chat-transform)"
oracle_cases:
- tools/oracle/cases/helpers/messages-chat-transform/required-request-fields.yaml
- tools/oracle/cases/helpers/messages-chat-transform/composed-chat-request.yaml
- tools/oracle/cases/helpers/messages-chat-transform/long-tool-name-roundtrip.yaml
- tools/oracle/cases/helpers/messages-chat-transform/composed-message-response.yaml
- tools/oracle/cases/sdk-http/messages-chat-transform/stream-factory-modes.yaml
deviations: []
out_of_scope:
- B1117 owns primitives L25-L93,L213-L225,L357-L454,L672-L700,L1290-L1343; B964 owns L352-L353,L456-L639 conversation conversion.
- B965 and B2431 divide the option methods L642-L1212; B966 owns all output methods L1345-L1766.
- create_tool_name_mapping L94-L114 and translate_thinking_for_model L703-L737 have no caller at the pin.
- B974 owns completion execution and B977 the stream state machine; this task owns only composing their value transformations.
pitfalls:
- The public wrapper consumes both required keys before it reports an empty model.
- is_async defaults true; returning an async iterator to a synchronous caller breaks iteration even if its events are correct.
- The tool-name map is part of the input transformation result and must survive until response conversion.
review_level: standard
budget:
  max_changed_lines: 620
  max_new_expects: 0
