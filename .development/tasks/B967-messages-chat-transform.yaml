checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_transform::/)
      - test(/::replays_corpus$/)'
  - id: case-roundtrip-long-tool-name
    why: the roundtrip-long-tool-name behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_transform::tests::roundtrip_long_tool_name($|::)/)'
  - id: case-messages-request-chat-shape
    why: the messages-request-chat-shape behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_transform::tests::messages_request_chat_shape($|::)/)'
  - id: case-chat-response-messages-shape
    why: the chat-response-messages-shape behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_transform::tests::chat_response_messages_shape($|::)/)'
  - id: case-stream-delta-tool-name-restore
    why: the stream-delta-tool-name-restore behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_transform::tests::stream_delta_tool_name_restore($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_chat_transform.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_chat_transform-*)"
      && grep -qE "^[[:space:]]+messages_chat_transform:" tools/oracle/fuzz/corpus/helper_case/messages_chat_transform-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-chat-transform)"
