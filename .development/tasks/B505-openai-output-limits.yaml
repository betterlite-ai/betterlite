pitfalls:
- 'The oracle helper for this task is pre-registered as openai_output_limits in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/output_limits.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_output_limits.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The decoder validates only detail[0] before iterating every entry, so a later scalar must not be silently ignored.
- Recovery is based on the complete message marker, with no GPT-5 model-name guard despite its motivating example.
- Streaming recovery still calls token_counter before returning its one chunk, although that chunk contains no usage.
