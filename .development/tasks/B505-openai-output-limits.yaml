out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- B9988 wires the recovery into the proxy chat path. It owns the proxy-wide global_drop_params, the 422 resend in
  betterlite-provider, OperationResult::OutputLimit, the chat routes' recovery module, ChatCalls with its Counter and
  the three tools/oracle/cases/chat cases. betterlite-provider, routes/chat, server.rs and the oracle's
  sdk_http/native.rs are not this task's to edit.
- ChatExecutor::send and ChatExecutor::stream stay as on main. They serve only mocked calls and the oracle's SDK
  harness; a later task that wants the repair there calls the same output_limits functions.
- The InlineCounter copies in other crates' tests, the tokenizer's own tests and fuzz target, and the Counter fixtures
  of other oracle helpers stay as they are.
