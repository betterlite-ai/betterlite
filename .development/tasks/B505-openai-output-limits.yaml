id: B505
title: OpenAI output-limit and rejected-field recovery
description: >-
  Implement rejected-field parsing and GPT-5 output-limit recovery and wire them into the existing chat and streaming
  call paths. The output-limit 400 becomes a 200 length-truncated reply/chunk; a 422 retries once with the rejected
  fields dropped when drop_params allows it. Reuse B196 token_counter, injected clock/id and transport; this is
  the provider-specific repair path, not a router retry policy.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/common_utils.py:
  drop_params_from_unprocessable_entity_error L89-L130; is_output_token_limit_error L138-L145; _output_token_limit_completion
  L148-L162; _output_token_limit_chunk L165-L178; _iter_once L181-L182; _aiter_once L185-L186; build_output_token_limit_response
  L189-L203.


  Implement crates/betterlite-openai/src/output_limits.rs with adjacent tests under output_limits/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_output_limits in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function output_limits_cases in betterlite-openai with these exact named cases (one per oracle file):
  two_element_loc, malformed_detail_keeps_fields, output_limit_case_insensitive, empty_length_completion, single_length_stream_chunk,
  prompt_token_count, unrelated_error, openai_output_limit_buffered, openai_output_limit_stream, openai_422_drop_retry.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_output_limits* using HelperCase: kind:
  helper and the externally tagged openai_output_limits variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_output_limits that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_rejected_fields consumes 422 error-body bytes, including JSON encoded in message
  in crates/betterlite-openai/src/output_limits.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_output_limits.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_output_limits.
  The adjacent test replays_the_openai_output_limits_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 91 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 125 production lines, 135 behavior/config-test lines, 95 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 435 planned, 450 maximum changed lines.
