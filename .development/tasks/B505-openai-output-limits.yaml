checks:
  optional:
  - mutants
  commands:
  - id: case-two-element-loc
    why: 'Use SDK e.body or HTTPStatusError response.json().error; decode a string message as JSON, falling back
      to {detail: original string} on JSONDecodeError. Remove input keys matching loc[1] only for a truthy two-element
      list loc, preserving the caller data map.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_two_element_loc$/)'
  - id: case-malformed-detail-keeps-fields
    why: Absent/non-dictionary body or a false message does not drop fields; empty/nonlist detail and a first nondictionary
      detail entry do not trigger iteration.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_malformed_detail_keeps_fields$/)'
  - id: case-output-limit-case-insensitive
    why: Match the complete lowercase marker could not finish the message because max_tokens or model output limit
      was reached as a substring, independent of model name; shorter phrases and unrelated 400 errors are not recovered.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_output_limit_case_insensitive$/)'
  - id: case-empty-length-completion
    why: Return original response headers, id chatcmpl-{uuid}, integer injected clock time, object chat.completion,
      one assistant choice at index 0 with empty content and finish_reason length; completion_tokens=0 and total_tokens=prompt_tokens.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_empty_length_completion$/)'
  - id: case-single-length-stream-chunk
    why: For truthy data.stream return exactly one sync/async chunk with object chat.completion.chunk, index 0,
      assistant delta with empty content and finish_reason length; omit usage even though token counting was performed.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_single_length_stream_chunk$/)'
  - id: case-prompt-token-count
    why: Convert model through str(data.get(model, empty string)); call B196 token_counter only when messages is
      a list, otherwise use zero. Preserve the upstream error response headers.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_prompt_token_count$/)'
  - id: case-unrelated-error
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-output-limits/unrelated-error.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_unrelated_error$/)'
  - id: provider-recovery
    why: OpenAi decode does not answer OperationResult::OutputLimit for the output-limit 400, another 400 is recovered,
      the 422 resend keeps a rejected field, the retry runs without the proxy-wide flag, or a malformed detail does not
      fail the call.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_recovery_cases::/)'
  - id: route-recovery
    why: The booted chat routes do not answer the length-truncated reply, the two stream frames, the unrelated 400
      or the 422 resend the way the named cases assert.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::output_limit_route_cases::/)'
  - id: vertex-counter
    why: Moving the Counter builder into betterlite-tokenizer broke the Vertex embedding setup.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::vertex_embedding::/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_output_limits.py tools/oracle/helpers/openai_output_limits)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_output_limits*")"
      && grep -lq 'openai_output_limits' tools/oracle/fuzz/corpus/helper_case/openai_output_limits* && cargo nextest
      run --locked -p betterlite-oracle-openai --no-tests=fail -E 'test(/::helper_seeds_select_openai_output_limits$/)'
      && cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-openai
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_output_limits)"
      && grep -q 'decode_rejected_fields' crates/betterlite-openai/fuzz/fuzz_targets/openai_output_limits.rs &&
      cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_output_limits_corpus(::|$)/)'
  - id: case-malformed-nested-error-failure
    why: A truthy non-object decoded message raises its attribute-access failure; after a dictionary first detail
      item a later nondictionary item also fails rather than being silently skipped. Invalid HTTP response JSON
      propagates parsing failure.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_malformed_nested_error_failure$/)'
  - id: case-azure-raw-send-headers
    why: Both Azure wrappers unconditionally use chat.completions.with_raw_response.create(**data, timeout=timeout),
      parse the response and return raw headers with it; the return_response_headers docstring is stale.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_azure_raw_send_headers$/)'
  - id: case-azure-output-limit-recovery
    why: Both wrappers recover only the full output-limit BadRequestError marker through build_output_token_limit_response
      with their sync/async flag; other BadRequestError values propagate.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_azure_output_limit_recovery$/)'
  - id: case-azure-async-timeout
    why: Only the async Azure wrapper appends timeout value and elapsed seconds rounded to two decimals to APITimeoutError
      before rethrowing; compare error class/status/type/param/code and ignore message wording.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::output_limits_cases::case_[0-9]+_azure_async_timeout$/)'
