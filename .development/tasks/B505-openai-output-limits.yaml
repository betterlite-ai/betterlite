id: B505
title: OpenAI output-limit and rejected-field recovery
description: >-
  Implement rejected-field parsing and GPT-5 output-limit recovery and wire them into the existing chat and streaming
  call paths. The output-limit 400 becomes a 200 length-truncated reply/chunk; a 422 retries once with the rejected
  fields dropped when drop_params allows it. Reuse B196 token_counter, injected clock/id and transport; this is
  the provider-specific repair path, not a router retry policy.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/common_utils.py:
  drop_params_from_unprocessable_entity_error L89-L130; is_output_token_limit_error L138-L145; _output_token_limit_completion
  L148-L162; _output_token_limit_chunk L165-L178; _iter_once L181-L182; _aiter_once L185-L186; build_output_token_limit_response
  L189-L203. litellm/llms/azure/azure.py: AzureChatCompletion.make_sync_azure_openai_chat_completion_request L140-L162;
  AzureChatCompletion.make_azure_openai_chat_completion_request L164-L194.


  Named case contracts: two_element_loc: Use SDK e.body or HTTPStatusError response.json().error; decode a string
  message as JSON, falling back to {detail: original string} on JSONDecodeError. Remove input keys matching loc[1]
  only for a truthy two-element list loc, preserving the caller data map. malformed_detail_keeps_fields: Absent/non-dictionary
  body or a false message does not drop fields; empty/nonlist detail and a first nondictionary detail entry do not
  trigger iteration. output_limit_case_insensitive: Match the complete lowercase marker could not finish the message
  because max_tokens or model output limit was reached as a substring, independent of model name; shorter phrases
  and unrelated 400 errors are not recovered. empty_length_completion: Return original response headers, id chatcmpl-{uuid},
  integer injected clock time, object chat.completion, one assistant choice at index 0 with empty content and finish_reason
  length; completion_tokens=0 and total_tokens=prompt_tokens. single_length_stream_chunk: For truthy data.stream
  return exactly one sync/async chunk with object chat.completion.chunk, index 0, assistant delta with empty content
  and finish_reason length; omit usage even though token counting was performed. prompt_token_count: Convert model
  through str(data.get(model, empty string)); call B196 token_counter only when messages is a list, otherwise use
  zero. Preserve the upstream error response headers. malformed_nested_error_failure: A truthy non-object decoded
  message raises its attribute-access failure; after a dictionary first detail item a later nondictionary item also
  fails rather than being silently skipped. Invalid HTTP response JSON propagates parsing failure. azure_raw_send_headers:
  Both Azure wrappers unconditionally use chat.completions.with_raw_response.create(**data, timeout=timeout), parse
  the response and return raw headers with it; the return_response_headers docstring is stale. azure_output_limit_recovery:
  Both wrappers recover only the full output-limit BadRequestError marker through build_output_token_limit_response
  with their sync/async flag; other BadRequestError values propagate. azure_async_timeout: Only the async Azure
  wrapper appends timeout value and elapsed seconds rounded to two decimals to APITimeoutError before rethrowing;
  compare error class/status/type/param/code and ignore message wording.


  Also own the small Azure raw-send wrappers as shared raw-chat result handling in this lower OpenAI module: accept
  a prepared sync/async SDK transport interface and preserve raw response headers. B533 buffered calls and B685
  streams both reuse this implementation; it needs no Azure client construction or Azure crate dependency. B190
  supplies track_llm_api_timing.


  Implement crates/betterlite-openai/src/output_limits.rs with adjacent tests under output_limits/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function output_limits_cases in betterlite-openai with these exact named cases (one per oracle file):
  two_element_loc, malformed_detail_keeps_fields, output_limit_case_insensitive, empty_length_completion, single_length_stream_chunk,
  prompt_token_count, unrelated_error, openai_output_limit_buffered, openai_output_limit_stream, openai_422_drop_retry,
  malformed_nested_error_failure, azure_raw_send_headers, azure_output_limit_recovery, azure_async_timeout. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases
  use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_output_limits* using HelperCase: kind:
  helper and the externally tagged openai_output_limits variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_output_limits that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_rejected_fields consumes 422 error-body bytes, including JSON encoded in message
  in crates/betterlite-openai/src/output_limits.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_output_limits.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_output_limits.
  The adjacent test replays_the_openai_output_limits_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 143 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 225 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 645 planned, 650 maximum changed lines.
