id: B505
title: OpenAI output-limit and rejected-field recovery
description: >-
  Port LiteLLM's rejected-field parsing and GPT-5 output-limit recovery and wire them into the path real proxy chat
  calls take. An output-limit 400 becomes a 200 length-truncated reply, or on a stream the two frames LiteLLM's stream
  wrapper sends; a 422 is resent once without the fields it rejects when the proxy-wide drop_params is on. This is
  the provider-specific repair, not a router retry policy.


  Why the plan changed: the first plan put the repair in ChatExecutor::send and ChatExecutor::stream. Since B010 a
  proxy chat call that no mock answers goes through provider_chat in
  crates/betterlite-server/src/server/chat_setup/provider_call.rs and provider_stream in
  crates/betterlite-server/src/routes/chat/streaming.rs, and both run betterlite-provider's OpenAi prepare, execute
  and decode. The executor only serves mocked calls and the oracle's SDK harness, so with the repair there the three
  chat oracle cases got a 400 from betterlite where LiteLLM answers 200. The 422 case also needs the proxy-wide flag:
  its config sets litellm_settings.drop_params, and LiteLLM's retry reads litellm.drop_params, never the call's own
  drop_params.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/common_utils.py:
  drop_params_from_unprocessable_entity_error L89-L130; is_output_token_limit_error L138-L145; _output_token_limit_completion
  L148-L162; _output_token_limit_chunk L165-L178; _iter_once L181-L182; _aiter_once L185-L186; build_output_token_limit_response
  L189-L203. litellm/llms/azure/azure.py: AzureChatCompletion.make_sync_azure_openai_chat_completion_request L140-L162;
  AzureChatCompletion.make_azure_openai_chat_completion_request L164-L194. The callers' repair branches in
  litellm/llms/openai/openai.py (the BadRequestError branch of make_openai_chat_completion_request and the
  UnprocessableEntityError branches of acompletion and async_streaming) are ported where the proxy runs them, in
  betterlite-provider and betterlite-server as described below.


  Named case contracts: two_element_loc: Use SDK e.body or HTTPStatusError response.json().error; decode a string
  message as JSON, falling back to {detail: original string} on JSONDecodeError. Remove input keys matching loc[1]
  only for a truthy two-element list loc, preserving the caller data map. malformed_detail_keeps_fields: Absent/non-dictionary
  body or a false message does not drop fields; empty/nonlist detail and a first nondictionary detail entry do not
  trigger iteration. output_limit_case_insensitive: Match the complete lowercase marker could not finish the message
  because max_tokens or model output limit was reached as a substring, independent of model name; shorter phrases
  and unrelated 400 errors are not recovered. empty_length_completion: Return original response headers, id chatcmpl-{uuid},
  integer injected clock time, object chat.completion, one assistant choice at index 0 with empty content and finish_reason
  length; completion_tokens=0 and total_tokens=prompt_tokens. single_length_stream_chunk: For truthy data.stream
  return exactly one sync/async chunk with object chat.completion.chunk, index 0, assistant delta with empty content
  and finish_reason length; omit usage even though token counting was performed. prompt_token_count: Convert model
  through str(data.get(model, empty string)); call B196 token_counter only when messages is a list, otherwise use
  zero. Preserve the upstream error response headers. malformed_nested_error_failure: A truthy non-object decoded
  message raises its attribute-access failure; after a dictionary first detail item a later nondictionary item also
  fails rather than being silently skipped. Invalid HTTP response JSON propagates parsing failure. azure_raw_send_headers:
  Both Azure wrappers unconditionally use chat.completions.with_raw_response.create(**data, timeout=timeout), parse
  the response and return raw headers with it; the return_response_headers docstring is stale. azure_output_limit_recovery:
  Both wrappers recover only the full output-limit BadRequestError marker through build_output_token_limit_response
  with their sync/async flag; other BadRequestError values propagate. azure_async_timeout: Only the async Azure
  wrapper appends timeout value and elapsed seconds rounded to two decimals to APITimeoutError before rethrowing;
  compare error class/status/type/param/code and ignore message wording.


  Also own the small Azure raw-send wrappers as shared raw-chat result handling in this lower OpenAI module: accept
  a prepared sync/async SDK transport interface and preserve raw response headers. B533 buffered calls and B685
  streams both reuse this implementation; it needs no Azure client construction or Azure crate dependency. B190
  supplies track_llm_api_timing.


  Pure logic, in betterlite-openai. It is the lowest crate both betterlite-provider and betterlite-server reach, so
  each piece lives here once. crates/betterlite-openai/src/output_limits.rs owns OUTPUT_TOKEN_LIMIT_MARKER,
  ErrorBody<'body> { Sdk(&'body Value), Http(&'body [u8]) } with fn reaches_output_limit(&self) -> bool,
  RejectedFieldsError, pub fn decode_rejected_fields(body: ErrorBody<'_>) -> Result<Vec<Value>, RejectedFieldsError>
  and pub fn without_rejected_fields(body: ErrorBody<'_>, data: &Map<String, Value>) -> Result<Map<String, Value>,
  RejectedFieldsError>. output_limits/build.rs owns pub struct Recovery<'recovery> { pub clock: fn() -> u64, pub
  next_id: fn() -> Uuid, pub tokens: &'recovery dyn PromptTokens }, pub enum RecoveredBody { Completion(ChatResponse),
  Chunk(Chunk) }, pub struct OutputLimitResponse { pub headers: HeaderMap, pub body: RecoveredBody } and pub async fn
  build_limit_response(data: &Map<String, Value>, headers: HeaderMap, recovery: &Recovery<'_>) ->
  Result<OutputLimitResponse, PromptCountError>. output_limits/raw_send.rs owns the Azure wrappers. Value and Map are
  serde_json's. output_limits/tokens.rs owns the count port: #[async_trait] pub trait PromptTokens: Send + Sync {
  async fn count(&self, model: &str, messages: &[Value]) -> Result<usize, PromptCountError>; }, pub enum
  PromptCountError { Messages { #[source] source: serde_json::Error }, Count { #[from] source: CountError } } and
  #[async_trait] impl PromptTokens for betterlite_tokenizer::count::Counter. That impl deserializes messages into
  Vec<betterlite_tokenizer::count::request::Message> and returns Counter::count(self, &TokenRequest { model,
  custom_tokenizer: None, text: None, messages: Some(&parsed), count_response_tokens: None, tools: None, tool_choice:
  None }), the B196 port of token_counter. No other PromptTokens implementation ships, and nothing rebuilds the
  counting pipeline by hand.


  One counter builder, in betterlite-tokenizer. The server's chat routes, the server's Vertex usage records and the
  oracle helper all need a real Counter, and betterlite-tokenizer is the lowest crate all three reach. Move
  token_counter, hub_downloader and TOKEN_COUNT_CONCURRENCY out of
  crates/betterlite-server/src/server/chat_setup/vertex_embedding.rs, and InlineCounter with its BlockingCounter impl
  out of vertex_embedding/counter.rs, into the new module crates/betterlite-tokenizer/src/count/runtime.rs, declared
  by pub mod runtime; in crates/betterlite-tokenizer/src/count.rs. The public function is pub fn
  runtime_counter(config: &Config, client: &Arc<ProxiedClient>, catalog: &Arc<ModelCatalog>) -> Result<Counter,
  CountError>, with Config from betterlite_config::types; its body is the moved token_counter body unchanged.
  hub_downloader, the constant and InlineCounter stay private there. vertex_embedding_calls calls
  runtime_counter(config, &transport, &catalog) and maps the error to VertexEmbeddingSetupError::Limits as today.
  Rewrite InlineCounter's comment so it no longer says the counter only runs inside block_in_place: the Vertex
  records call it inside block_in_place, and the output-limit recovery calls it on the request task, as LiteLLM's
  synchronous token_counter does.


  The proxy-wide drop_params, in betterlite-openai and betterlite-provider. Add pub global_drop_params: bool to
  OpenAiDefaults and to ChatDeployment in crates/betterlite-openai/src/chat/deployment.rs; resolve_with sets
  global_drop_params: defaults.global_drop_params. openai_defaults in crates/betterlite-server/src/server/chat_setup.rs
  and in tools/oracle/src/sdk_http/native.rs set it from config.sections.drop_params.policy.global_drop_params, the
  value of litellm_settings.drop_params or LITELLM_DROP_PARAMS. Every other OpenAiDefaults and ChatDeployment literal
  sets false. Add pub global_drop_params: bool to Deployment in crates/betterlite-provider/src/prepared/deployment.rs:
  from_chat copies deployment.global_drop_params, and from_params sets false since its params never carry the
  proxy-wide setting.


  The 422 retry, in betterlite-provider. In crates/betterlite-provider/src/transform_retry.rs the hook becomes
  fallible: fn transform_request(&self, _prepared: &mut PreparedRequest, _response: &UpstreamResponse, _deployment:
  &Deployment) -> Result<(), OperationError>, with a default body of Ok(()), and send_with_retry propagates it with
  ?. Add OperationError::RejectedFields { #[source] source: RejectedFieldsError } in
  crates/betterlite-provider/src/operation.rs. In crates/betterlite-provider/src/openai_dispatch.rs, chat_request sets
  retry to TransformRetry::bounded(2)? when deployment.global_drop_params is true and TransformRetry::DISABLED
  otherwise, matching LiteLLM's for _ in range(2) loop. Delete the empty impl TransformOnUnprocessable for OpenAi {}
  there and write the filled impl in the new child module crates/betterlite-provider/src/openai_dispatch/recovery.rs,
  declared by mod recovery; at the bottom of openai_dispatch.rs. should_retry answers response.status == 422, the
  status of openai.UnprocessableEntityError. transform_request takes the body of a PreparedRequest::Chat or
  PreparedRequest::Stream (any other variant returns Ok(())), parses it into a Map<String, Value>
  (OperationError::Encode on failure), builds the SDK's exception body from the 422 (the response JSON's error member
  when the body is a JSON object holding one, else the whole JSON value, else the body text as a JSON string),
  calls without_rejected_fields(ErrorBody::Sdk(&error_body), &sent) (OperationError::RejectedFields on failure) and
  writes the result back as the request body. It drops whatever loc[1] names, model and messages included, as the
  async and streaming handlers do with data.


  The output-limit seam, in betterlite-provider. Add OperationResult::OutputLimit { sent: Box<Map<String, Value>> } in
  operation.rs: the request body as sent, for the caller to rebuild the reply from. recovery.rs also owns pub(super)
  fn output_limit(chat: &PreparedChat, response: &UpstreamResponse) -> Result<Option<OperationResult>,
  OperationError>: it answers Ok(None) unless response.status is 400 and ErrorBody::Http(&response.body)
  .reaches_output_limit(), and otherwise parses chat.http.body into the sent map (OperationError::Encode on failure).
  OpenAi::decode calls it first in its (PreparedKind::Chat(chat), Upstream::Buffered(response)) and
  (PreparedKind::Stream(chat), Upstream::Buffered(response)) arms and returns the Some value; with None both arms run
  as today, so every other 400 stays OperationError::Provider.


  The reply, in betterlite-server. answer_chat and provider_chat in provider_call.rs return Result<(OperationResult,
  HeaderMap, Duration), CallError<ChatError>>: provider_chat drops its let-else and hands the decoded result on, and
  the mock path wraps its reply as OperationResult::Chat(ChatCompletion::OpenAi(..)). provider_stream in
  streaming.rs returns Result<(OperationResult, HeaderMap), CallError<ChatError>>, with the headers read from
  Upstream::headers() before decode. chat_error in provider_call.rs and its embedding twin in
  provider_call/embedding.rs send OperationError::RejectedFields to CallError::Operation next to TransformRetry, a 500
  as LiteLLM's AttributeError gives. ChatCalls in streaming.rs becomes pub(crate) struct ChatCalls { pub(crate)
  executor: Arc<ChatExecutor>, pub(crate) counter: Counter } with pub(crate) fn new(config: &Config, executor:
  Arc<ChatExecutor>) -> Result<Self, CountError>; it builds the counter with runtime_counter(config,
  &Arc::new(executor.client.clone()), &BundledCatalog::default().get()). ChatCall::complete matches the result:
  OperationResult::Chat goes on as today, OperationResult::OutputLimit { sent } goes to recovery::completion and any
  other variant answers ChatFailure::Mismatched. ChatCall::stream does the same with OperationResult::Stream and
  recovery::stream.


  The new module crates/betterlite-server/src/routes/chat/streaming/recovery.rs, declared by mod recovery; in
  streaming.rs, holds pub(super) async fn completion(calls: &ChatCalls, sent: &Map<String, Value>, headers: HeaderMap,
  client_model: Option<&str>) -> Result<(ChatCompletion, HeaderMap), ChatFailure> and pub(super) async fn
  stream(calls: &ChatCalls, sent: &Map<String, Value>, headers: HeaderMap, upstream_time: Duration) ->
  Result<ChatStreamAnswer, ChatFailure>. Both call build_limit_response with Recovery { clock: calls.executor.clock,
  next_id: calls.executor.next_id, tokens: &calls.counter } and the 400's headers. A PromptCountError answers
  ChatFailure::Internal { message: error.to_string() }, and a RecoveredBody of the other shape answers
  ChatFailure::Mismatched. completion returns ChatCompletion::OpenAi(Box::new(response.for_client(client_model))) with
  the returned headers. stream yields two SSE frames (data: {json}, then a blank line) as a BoxStream of Ok(Vec<u8>)
  items, the shape mock_stream already builds: first the recovered chunk with finish_reason null, then the same chunk
  with an empty delta (Delta::default()) and finish_reason length. That is what LiteLLM's CustomStreamWrapper makes of
  the one chunk; relay_bytes then adds data: [DONE] as for any upstream stream.


  Wiring. crates/betterlite-server/src/routes/chat.rs: mod streaming; becomes pub(crate) mod streaming;, and
  chat_routes_with_call_id takes calls: Arc<ChatCalls> in place of executor: Arc<ChatExecutor>. Its three-line
  ChatCalls construction becomes exactly these two lines: let executor = Arc::clone(&calls.executor); and let calls:
  Arc<dyn ChatCall> = calls;. In crates/betterlite-server/src/server.rs, application builds ChatCalls::new(config,
  Arc::clone(&executor)) and passes Arc::new of it; ServerError gains TokenCounter { #[source] source: CountError }
  with the message the token counter limits are invalid: {source}. Every test that calls chat_routes_with_call_id
  builds ChatCalls::new the same way; a test with no Config at hand loads one with ConfigLoader { lookup:
  BTreeMap::new() }.load("").


  Oracle. The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with
  fixture transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the
  local model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where
  specified above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success. The
  Rust helper gets its Counter from runtime_counter: the Config from ConfigLoader { lookup: BTreeMap::new() }.load("")
  as tools/oracle/src/helpers/azure/client_secret.rs loads one, the client from ProxyPolicy::resolve(&ProxyTrust::default(),
  &BTreeMap::new()) and ProxiedClient::outbound(&Arc::new(policy)) as
  tools/oracle/src/helpers/tokenizer/reservation_tokens/fixture.rs builds one, and BundledCatalog::default().get().
  The three chat cases run the real gateway against LiteLLM; their recovered replies carry the real prompt count.


  Tests. Write rstest function output_limits_cases in betterlite-openai with these exact named cases (one per helper
  oracle file): two_element_loc, malformed_detail_keeps_fields, output_limit_case_insensitive, empty_length_completion,
  single_length_stream_chunk, prompt_token_count, unrelated_error, malformed_nested_error_failure,
  azure_raw_send_headers, azure_output_limit_recovery, azure_async_timeout. Write rstest function
  openai_recovery_cases in crates/betterlite-provider/src/openai_dispatch/recovery/tests.rs with named cases
  output_limit_chat, output_limit_stream, unrelated_400_stays_provider, retry_drops_rejected_fields,
  retry_needs_global_flag and malformed_detail_fails_the_call, driving OpenAi prepare, execute and decode against a
  loopback upstream. Write rstest function output_limit_route_cases in
  crates/betterlite-server/src/routes/chat/streaming/recovery/tests.rs with named cases buffered_length_reply,
  stream_two_frames, unrelated_400_answers_400 and drop_params_resend, booting chat_routes_with_call_id against a
  loopback upstream and asserting both the client response and the captured upstream requests. Each case exercises
  its named outcome independently with stable clocks and IDs. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_output_limits* using HelperCase: kind:
  helper and the externally tagged openai_output_limits variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_output_limits that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_rejected_fields consumes 422 error-body bytes, including JSON encoded in message
  in crates/betterlite-openai/src/output_limits.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_output_limits.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_output_limits.
  The adjacent test replays_the_openai_output_limits_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget: about 1150 lines for the ported helpers, the Azure wrappers, the oracle adapters, the fuzz target and the
  deviations log; about 150 for the counter move (both sides of a move count); about 120 in betterlite-provider;
  about 200 in betterlite-server; about 30 for the global_drop_params field and its literals. That plans about 1650
  changed lines against a maximum of 1800. Test files and oracle cases do not count.
