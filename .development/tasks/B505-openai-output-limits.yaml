pitfalls:
- 'The oracle helper for this task is pre-registered as openai_output_limits in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/output_limits.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_output_limits.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- If the task branch still holds the first attempt's executor wiring, put crates/betterlite-openai/src/chat/execution.rs,
  crates/betterlite-openai/src/chat/execution/recovery.rs, crates/betterlite-openai/src/chat/provider_error.rs and
  crates/betterlite-openai/src/stream.rs back to the base commit's content. They are out of scope now, and the
  ChatError variants and ChatStream type added there go with them.
- The first attempt's TokenizerPromptTokens and its private InlineCounter in output_limits/tokens.rs rebuild
  Counter::count's pipeline by hand. Delete both; the only PromptTokens implementation is the one for Counter, and
  PromptCountError keeps only its Messages and Count variants.
- Dispatched runs cannot compile, so follow the signatures in the description exactly. Chunk in
  betterlite_openai::stream::chunk derives no Clone, so write the second stream frame by serializing the same chunk
  again after the change (take the choice's finish_reason before the first frame, put it back and set the delta to
  Delta::default() before the second). A failed serialization answers ChatFailure::Route(ChatError::Encode { source })
  as mock_stream does.
- 'Imports a dispatched run cannot see go unused: openai_dispatch.rs drops TransformOnUnprocessable from its
  crate::transform_retry import (recovery.rs imports it); vertex_embedding.rs drops Counter, ModelCatalog,
  CountSettings, TiktokenFetcher, HubDownloader, BlockingCounter, CountingService, Selector, HubClock, SystemHubClock,
  HubTokenFileReader, HubTokenResolver, TokioHubTokenFileReader, tokio::time::Instant and InlineCounter, and keeps
  CountError, BundledCatalog and ProxiedClient; vertex_embedding/counter.rs drops async_trait, Engine, EngineError,
  BlockingCounter, BuildJob, ConvertJob and CountJob. The Rewrite test hook in transform_retry/tests.rs overrides
  transform_request, so it takes the new return type and returns Ok(()).'
- 'File sizes: the file-size check counts every line except bare mod x; and pub mod x; lines, so pub(crate) mod
  streaming; counts. crates/betterlite-server/src/routes/chat.rs is exactly 300 today and must stay at or under
  300. That is why its ChatCalls construction shrinks to the two lines given. streaming.rs is 259, so the recovery
  bodies go to streaming/recovery.rs. crates/betterlite-server/src/routes/embeddings.rs is 298, so do not add a
  CallError variant: its embedding_port_failure match would need a new arm.'
- The 422 retry is gated by the proxy-wide flag only. A request's own drop_params and a deployment's
  litellm_params.drop_params never turn it on, since openai.py reads litellm.drop_params or the handler's drop_params
  argument and main.py never passes that argument.
- The resend drops whatever loc[1] names, model and messages included, as the async and streaming handlers drop
  from data. After the second 422 the provider's error reaches the client; LiteLLM's loop returns None there, and
  the deviations log already records that.
- 'The second stream frame comes from reading streaming_handler.py, not from a LiteLLM run: frame 0 is the recovered
  chunk with delta {role: assistant, content: ""} and finish_reason null, frame 1 has an empty delta and finish_reason
  length. openai-output-limit-stream.yaml ignores /0 and /1 ids and timestamps, and that fits two frames. If the first
  CI oracle run shows another shape for frame 1, match LiteLLM''s.'
- B024 (https://github.com/betterlite-ai/betterlite/pull/2247) adds module lines at the top of openai_dispatch.rs and
  turns OpenAiResult into an enum. Put mod recovery; at the bottom of openai_dispatch.rs, keep the decode and
  chat_request edits in their own hunks and leave OpenAiResult alone.
- docs/deviations/B505.yaml keeps the rows for the second 422, the marker matched in the provider's raw text and the
  Azure timeout text, and both kept_bugs. Delete the rows that said the proxy never reaches the repair, that the
  retry reads the call's drop_params, and that the retry keeps model and messages; none of them holds after this
  task.
- The decoder validates only detail[0] before iterating every entry, so a later scalar must not be silently ignored.
- Recovery is based on the complete message marker, with no GPT-5 model-name guard despite its motivating example.
- Streaming recovery still calls token_counter before returning its chunk, although that chunk contains no usage.
