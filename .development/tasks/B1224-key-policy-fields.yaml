dod:
  - text: 'Cover hook_getters, missing_hooks_noop, synchronous_hook_rejected_before_builder,
      decision_default_and_custom_denial, hook_failure_propagates, json_columns_only, malformed_column_json,
      organization_id_null_wins, effective_patch_clears_permission, policy_operation_and_original_request,
      generated_metadata_override_encrypted, generate_clock_expiry_and_rotation, budget_windows_empty_and_order,
      regeneration_absent_null_empty_duration, key_type_route_presets, disabled_rotation_keeps_fields,
      stored_rotation_requires_alias, empty_alias_is_present, unsafe_alias_always_rejected,
      builtin_alias_boundaries, custom_fullmatch_and_length, validation_disabled_has_no_format_limit,
      uniqueness_global_excludes_raw_token, uniqueness_missing_db_noop, model_budget_empty,
      model_budget_numeric_aliases, model_budget_invalid_values and model_budget_without_license_is_allowed.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: Stored JSON columns use the production decoder in both fuzzing and corpus replay.
    proof:
      - parser-corpus
checks:
  optional:
    - mutants
  commands:
    - id: parser-corpus
      why: The stored-column parser lacks malformed-input coverage or bypasses the production function.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/key_policy_json_column)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_key_policy_json_column_corpus)'
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_policy_fields::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/key_policy_fields.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/key-policy-fields-*")"
        && grep -rlq "key_policy_fields" tools/oracle/fuzz/corpus/helper_case/key-policy-fields-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^key_policy_fields::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/key-policy-fields-*")"
        && grep -rlq "enable_key_alias_format_validation" crates/betterlite-config/fuzz/corpus/config_yaml/key-policy-fields-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
