id: B1224
title: Key policy hooks aliases and rotation fields
description: >-
  Implement the effective-key policy builders and validators in key_policy_fields. The three hook getters
  return the configured generate/update/policy callable unchanged. Missing update/policy hooks do nothing;
  reject synchronous hooks with ValueError user_custom_key_update must be a coroutine or
  user_custom_key_policy must be a coroutine before constructing a policy request. Await the hook once;
  missing decision means true, false raises HTTPException 403 with the supplied message or Authentication
  Failed - Custom Auth Rule. Propagate hook failures. These helpers do not map errors into route envelopes.


  For updates decode only string router_settings and budget_limits through decode_json_string_column;
  malformed JSON fails, other columns and nonstrings pass through. Overlay onto the existing row and set
  object_permission=None. A present organization_id wins over org_id even when null. Policy requests carry
  operation update/regenerate, the unmodified existing key, effective merged key and original request.
  For generation exclude unset/null request fields, fold the metadata enum fields over data.metadata,
  apply handle_key_type, and call B2304 encrypt_callback_vars before constructing the effective key.
  Compute expires from the supplied now, budget_reset_at through B2317 get_budget_reset_time, and
  key_rotation_at only when both auto_rotate and rotation_interval are truthy. Missing/empty budget_limits
  yields None; otherwise preserve window order and fields and replace reset_at with an ISO timestamp.
  Regeneration retains only UpdateKeyRequest fields other than key, skips empty duration/budget_duration,
  keeps explicit nulls, returns None for an empty patch and otherwise uses the supplied key.


  handle_key_type removes an absent key_type; LLM_API, MANAGEMENT and READ_ONLY set allowed_routes to
  [llm_api_routes], [management_routes] and [info_routes] respectively, while other enum values retain routes.
  Rotation updates auto_rotate, rotation_interval and key_rotation_at together only for enabled rotation
  with a nonempty interval. It does not clear existing fields when disabled. When store_virtual_keys is
  exactly true, require either a non-null requested or existing alias; empty aliases count as present here.
  Failure is ProxyException 400/bad_request_error, param key_alias, with the stable-secret-name explanation.


  Alias None is accepted. Always call B129 raise_if_unsafe_secret_name before optional format checking;
  traversal/control-character failures become 400/bad_request_error, param key_alias, message Invalid
  key_alias. key_alias_pattern, including an empty string, overrides enable_key_alias_format_validation.
  Its config parser accepts None or a compilable string, otherwise raises ValueError; invalid regex does
  not silently disable validation. Built-in validation requires 2-255 characters, alphanumeric endpoints,
  and interior a-zA-Z0-9_-/.@; report that rule in the error message. A custom rule uses fullmatch and the
  same 255-character maximum, with the configured pattern in its error. Without either setting, there is
  no length/format restriction beyond unsafe-name rejection. Uniqueness is a separate global find_first
  on key_alias, skipped for None alias or missing DB; a truthy existing token adds NOT token unchanged,
  without hashing. A collision gives 400/bad_request_error, param key_alias and the unique-alias message.
  Test queries against Postgres via POSTGRES_TEST_URL, falling back to testcontainers; no write occurs here.


  model_max_budget None/empty is accepted without a license check. Nonempty maps require premium_user
  exactly true in LiteLLM, then string model names and BudgetConfig-compatible dict/model values; convert
  budget_limit numeric strings, and preserve BudgetConfig aliases budget_limit/max_budget and
  time_period/budget_duration plus rpm_limit/tpm_limit. Wrap every failure in ValueError with Invalid
  model_max_budget and the https://docs.litellm.ai/docs/proxy/users example. Apply the README no-paid-tier
  decision only to that license branch, testing nonempty valid/invalid budget maps natively outside the
  equality corpus; only the None/empty-map early return belongs in MIT equality cases.


  Build the production key_policy_fields module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _custom_key_generate_hook (L298-L301; 4 source lines), _custom_key_update_hook (L304-L307; 4 source
  lines), _custom_key_policy_hook (L310-L313; 4 source lines), _enforce_custom_key_update_policy (L316-L329;
  14 source lines), _enforce_custom_key_policy (L332-L345; 14 source lines), _effective_key_after_update
  (L366-L375; 10 source lines), _update_policy_request (L378-L391; 14 source lines), _generate_budget_windows
  (L394-L407; 14 source lines), _effective_key_for_generate (L410-L444; 35 source lines), _regenerate_request_as_update_request
  (L450-L462; 13 source lines), _calculate_key_rotation_time (L530-L542; 11 source lines), _set_key_rotation_fields
  (L545-L579; 34 source lines), parse_key_alias_pattern (L7713-L7724; 12 source lines), _key_alias_rule
  (L7727-L7736; 10 source lines), _validate_key_alias_format (L7739-L7773; 31 source lines), _enforce_unique_key_alias
  (L7776-L7806; 27 source lines), validate_model_max_budget (L7809-L7840; 27 source lines), _decode_json_string_column
  (L355-L358; 4 source lines), _verification_token_from_row (L361-L363; 3 source lines), handle_key_type
  (L852-L867; 16 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.enable_key_alias_format_validation=False;
  litellm_settings.key_alias_pattern=None.


  general_settings.key_management_settings is the config key, not litellm_settings.key_management_settings.
  When omitted, the process already has KeyManagementSettings() with store_virtual_keys=false. The loader
  replaces it when the general_settings record is non-null. This component reads only store_virtual_keys;
  B129 owns the remaining secret-manager fields and their consumers. A runtime None settings object also
  skips the stored-key alias requirement, but it is not the normal default.


  Add pure effective-row, alias-rule, budget-window and rotation operations under B856 Management::keys,
  using B171 helper_case. Keep database uniqueness and real asynchronous policy execution in native
  integration tests; no helper adapter substitutes for their dependencies. B770 supplies request types
  and the verification-token table adapter; B165 supplies configured Python callables.


  Load these settings through B002 in config tests alias_defaults, configured_pattern_overrides_toggle,
  empty_pattern_is_configured, nonstring_pattern_rejected, invalid_regex_rejected and stored_rotation_alias.
  Seed config_yaml with the nested settings and os.environ/ resolution; there is no dedicated alias env var.


  Add the key_policy_json_column fuzz target invoking production decode_json_string_column(column, bytes).
  Seed both parsed columns, passthrough columns, null/scalar/array/object JSON, truncated and invalid UTF-8
  inputs; replay them in replays_the_key_policy_json_column_corpus. B770 retains request JSON decoding.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 301 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  301 production, 300 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 50 config lines, 791 changed lines estimated within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
