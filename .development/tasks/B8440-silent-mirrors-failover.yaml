id: B8440
title: Silent experiment mirrors and weighted failover
description: >-
  Two small router features that LiteLLM keeps in `litellm/router.py` have no Rust owner yet. This task builds both as
  plain services that other router tasks call. It adds no route and changes no caller.


  Part one is the silent experiment, LiteLLM's shadow traffic. A deployment may carry `silent_model` in its
  `litellm_params` (declared `str | Sequence[str] | None` in `litellm/types/litellm_params.py`). After the router picks
  that deployment, it starts one extra completion per silent target in the background and never waits for it, so the
  client only sees the primary answer. Put this in the new module `crates/betterlite-sdk/src/silent_experiment.rs`
  with its folder, because its only caller, B6020's `RouterCompletion` in `crates/betterlite-sdk/src/router_completion.rs`,
  lives in that crate and owns the tokio runtime handle. Add `tracing.workspace = true` to
  `crates/betterlite-sdk/Cargo.toml` if it is not there yet; touch nothing else in that file.


  `silent_targets(value: Option<&serde_json::Value>) -> Vec<String>` ports `_silent_experiment_targets`. Absent or
  null gives no targets. A string gives one target. An array whose items are all strings gives those items in order
  (an empty array gives none). Any other value logs a `tracing::warn!` with the text
  "silent_model must be a model name or a list of model names, got {value}; skipping shadow traffic" and gives no
  targets, the way LiteLLM skips the mirror with a warning instead of failing the request.


  `silent_kwargs(request: &serde_json::Map<String, serde_json::Value>) -> Result<Map, SilentExperimentError>` ports
  `_get_silent_experiment_kwargs`. It returns a copy of the request map, never touching the caller's map. In the copy,
  `metadata` becomes an empty object when it is absent or null, and a `metadata` that is not an object is the error
  `SilentExperimentError::MetadataNotObject`. Then remove `litellm_parent_otel_span` from the copy's metadata, set
  `is_silent_experiment` to true in it, and remove the top-level keys `litellm_call_id`, `litellm_logging_obj` and
  `standard_logging_object`. Every other key stays, `proxy_server_request` and `stream` included, because LiteLLM's
  spend log metadata needs `proxy_server_request` on the mirror call.


  `MirrorCall<M>` is the seam back into the router, so this module never depends on B6020. It has an associated
  `type Error: std::fmt::Display + Send + 'static` and one method,
  `fn complete(&self, args: MirrorArgs<M>) -> Pin<Box<dyn Future<Output = Result<(), Self::Error>> + Send + 'static>>`.
  `MirrorArgs<M>` holds `model: String`, `messages: Vec<M>`, `stream: bool` and `request: Map`. `M` is the caller's
  message type (`Clone + Send + 'static`). The trait doc says what an implementor does, as LiteLLM's
  `_run_silent_experiment` does: call `acompletion` with `model`, `messages`, `stream` and the request's keys as the
  other arguments, and when the answer is a stream, read every chunk to the end and drop it. The first error from the
  call or from a chunk is the result.


  `SilentExperiments` is built with `new(runtime: tokio::runtime::Handle)` and has two methods that take
  `call: Arc<C>` where `C: MirrorCall<M> + Send + Sync + 'static`, plus `target: String`, `messages: Vec<M>` and
  `request: Map`. The caller passes a copy of its request taken at start time, which stands in for
  `_silent_experiment_kwargs_snapshot`, so later changes to the primary request never reach the mirror.
  `start` ports `_silent_experiment_acompletion`: it spawns the mirror on the runtime and returns the
  `tokio::task::JoinHandle<()>`, which B6020 drops. `start_blocking` ports `_silent_experiment_completion`: it spawns a
  `std::thread` that runs the same mirror with `runtime.block_on` and returns the `std::thread::JoinHandle<()>`.
  Both run one private async function with these steps in this order. When the incoming request's `metadata` has
  `is_silent_experiment` set to true, return at once without a log line: that is the guard against a silent model
  whose own deployment has a `silent_model`. Log `tracing::info!` "Starting silent experiment for model {target}".
  Build the copy with `silent_kwargs`, set the copy's `metadata.model_group` to the target, read `stream` from the
  copy (true only when it is the JSON value true) and remove `stream` from it, then await `call.complete`. Any error,
  from `silent_kwargs` or from the call, logs `tracing::error!` "Silent experiment failed for model {target}: {error}"
  and ends the mirror. Nothing ever reaches the caller, and a panic is never the way out.


  Part two is weighted failover, `router_settings.enable_weighted_failover` (default false). With the flag on and the
  routing strategy "simple-shuffle", a failed deployment makes the router try the other healthy deployments of the
  same model group before any cross-group fallback. Put the decision in the new module
  `crates/betterlite-router/src/weighted_failover.rs` with its folder. This crate has no async runtime and no logger,
  so the module is pure: it does not run the retry and does not port LiteLLM's debug log line.


  `plan_weighted_failover(inputs: &FailoverInputs<'_>, request: &mut serde_json::Map<String, Value>, metadata_key: &str)
  -> Option<FailoverEntry>` ports `_maybe_run_weighted_failover` up to the fallback call. `FailoverInputs` holds
  `strategy: &str` (the group's routing strategy as the router resolved it), `failed_deployment_id: Option<&str>` (the
  id B017 stamps on the error), `model_group: &str`, `deployment_ids: &[String]` (the `model_info.id` of every
  deployment in the group that has one) and `cooldown_ids: &[String]` (the router-wide list of deployments in
  cooldown). `metadata_key` is `litellm_metadata` when the request has that key, else `metadata`; the caller passes it.
  Steps, in LiteLLM's order: a strategy other than "simple-shuffle" gives none. A missing or empty failed id gives
  none. When `request[metadata_key]` is absent or null, insert an empty object there; when it is present but not an
  object, give none. Read the earlier exclusions from that object's `_failover_excluded_ids` (absent or null means
  none) and add the failed id, keeping each id once in first-seen order. The remaining set is `deployment_ids` minus
  `cooldown_ids` minus the exclusions; when it is empty, give none (the metadata object inserted above stays). Write
  the exclusion list back under `_failover_excluded_ids` and return `FailoverEntry { model: model_group,
  excluded_deployment_ids }`. `FailoverEntry` serializes with serde as `{"model": ..., "_excluded_deployment_ids":
  [...]}`, the fallback entry shape LiteLLM's fallback walk passes into the next selection.


  `drop_excluded<T>(deployments: Vec<T>, excluded: &[String], id_of: impl Fn(&T) -> Option<&str>) -> Vec<T>` ports
  `get_excluded_filtered_deployments` from `litellm/utils.py`. An empty exclusion list returns the input unchanged.
  Otherwise keep each deployment whose id is missing or not excluded, in order. The result may be empty; the caller
  then raises its usual no-deployments error, unlike the retry skip, which falls back to the unfiltered list. This is
  the only port of that function: its callers are in betterlite-router, and that crate may not depend on
  betterlite-models, so B5365's deployment_filters leaves it out.


  Write the module doc so the callers can follow it. The fallback dispatcher (B399's
  `async_function_with_fallbacks_common_utils` port, with B310 running the hop) asks for the plan when the flag is on,
  the request did not skip order fallbacks and the original model group is known, after the order-based fallbacks and
  before the generic fallback walk. It runs one hop with `fallback_model_group` set to `[entry]` and
  `original_model_group` set to the group. When that hop fails with a provider API error or a no-deployments error, it
  goes on to the generic fallbacks; any other error propagates. Selection (B016's `async_get_healthy_deployments`
  and its sync `get_available_deployment`) takes `_excluded_deployment_ids` out of the request after order filtering
  and before the retry skip and filters with `drop_excluded`, whether or not the flag is on.


  The flag lives in the new config section `crates/betterlite-config/src/sections/weighted_failover.rs` with its
  folder, in the shape the other sections use (a `Raw` view of the whole file, a `Settings` struct and
  `impl Section for Raw`). It reads `router_settings.enable_weighted_failover`: a YAML bool, or an `os.environ/NAME`
  reference read through the shared resolver the other sections use. Absent or null is false. Any other value is a
  load error that names `router_settings.enable_weighted_failover`. Settings reach other crates as
  `config.sections.weighted_failover.enabled`. LiteLLM passes every `router_settings` key that `Router.__init__`
  accepts straight to the constructor, so this key is read from the config file just as the proxy reads it.


  Tests live in each module's `tests.rs`: `silent_experiment::tests` with names starting `targets_`, `kwargs_`,
  `start_` and `blocking_` (drive `start` on a current-thread runtime and `start_blocking` with a multi-thread
  runtime handle, against a fake `MirrorCall` that records its arguments), `weighted_failover::tests` with names
  starting `plan_` and `excluded_`, and `sections::weighted_failover::tests`. The task parses no outside bytes, so
  there is no fuzz target. Add helper oracle cases that run LiteLLM's `_silent_experiment_targets`,
  `Router(model_list=[])._get_silent_experiment_kwargs(**request)` and `litellm.utils.get_excluded_filtered_deployments`
  against `silent_targets`, `silent_kwargs` and `drop_excluded` (with `id_of` reading `model_info.id`), using only
  inputs of the declared types. Put them in `tools/oracle/cases/helpers/silent-experiment/` and
  `tools/oracle/cases/helpers/weighted-failover/`. No route reaches this code yet, so HTTP cases come with the wiring.

