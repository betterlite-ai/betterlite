dod:
  - text: silent_targets gives one target for a string, the items in order for a list of strings, none for absent or null, and none with a warning for any other value.
    proof: [silent-experiment-tests, oracle, helper-python]
  - text: silent_kwargs copies the request, fills a missing or null metadata, drops litellm_parent_otel_span from metadata, sets is_silent_experiment, drops litellm_call_id, litellm_logging_obj and standard_logging_object, and keeps proxy_server_request and stream.
    proof: [silent-experiment-tests, oracle, helper-python]
  - text: A mirror whose incoming metadata has is_silent_experiment true makes no call.
    proof: [silent-experiment-tests]
  - text: A mirror calls MirrorCall with the target as model, metadata.model_group set to the target, stream as its own flag and stream removed from the request, and leaves the caller's request unchanged.
    proof: [silent-experiment-tests]
  - text: start runs the mirror on the runtime and start_blocking on its own thread, and a failing call is logged and never reaches the caller.
    proof: [silent-experiment-tests]
  - text: plan_weighted_failover gives none for a strategy other than simple-shuffle, a missing or empty failed id, metadata that is not an object, or no remaining healthy deployment.
    proof: [weighted-failover-tests]
  - text: plan_weighted_failover adds the failed id to earlier exclusions, writes them back under _failover_excluded_ids in the metadata named by metadata_key, and returns an entry that serializes as model plus _excluded_deployment_ids.
    proof: [weighted-failover-tests]
  - text: drop_excluded keeps order, keeps deployments without an id, returns the input for an empty exclusion list, and may return an empty list.
    proof: [weighted-failover-tests, oracle, helper-python]
  - text: router_settings.enable_weighted_failover loads as false when absent or null, reads a bool or an os.environ reference, and fails the load for any other value.
    proof: [failover-config-tests]

checks:
  optional: [mutants]
  commands:
    - id: silent-experiment-tests
      why: the silent target parsing, the mirror request copy, the recursion guard or the two start paths are missing
      run: >-
        cargo nextest run --locked -p betterlite-sdk --no-tests=fail
        -E 'test(/^silent_experiment::tests::/)'
    - id: weighted-failover-tests
      why: the failover plan, its metadata write-back or the exclusion filter is missing
      run: >-
        cargo nextest run --locked -p betterlite-router --no-tests=fail
        -E 'test(/^weighted_failover::tests::/)'
    - id: failover-config-tests
      why: the enable_weighted_failover config key is not loaded
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::weighted_failover::tests::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b8440)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b8440 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b8440/pyrightconfig.json

oracle_cases:
  - tools/oracle/cases/helpers/silent-experiment/targets.yaml
  - tools/oracle/cases/helpers/silent-experiment/mirror-kwargs.yaml
  - tools/oracle/cases/helpers/weighted-failover/excluded-filter.yaml

deviations:
  - what: _failover_excluded_ids lists ids in first-seen order.
    why: LiteLLM builds the list from a Python set, so its order is arbitrary; a fixed order keeps logged metadata stable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L7220-L7245

out_of_scope:
  - "Reading silent_model from the deployment params, removing it from the params and the request, and calling start or start_blocking once per target: B6020 (completion and acompletion attempts)."
  - "Calling plan_weighted_failover from the fallback dispatcher and treating a provider API error or a no-deployments error from the retry as not applicable: B399, with B310 running the hop."
  - "Popping _excluded_deployment_ids and calling drop_excluded during selection: B016 for async_get_healthy_deployments and the sync get_available_deployment."
  - "Router.__init__ storing enable_weighted_failover (B8356) and _anthropic_messages_stream_can_fall_back reading it (B8351); they read config.sections.weighted_failover."
  - "HTTP oracle cases for silent_model and enable_weighted_failover through the booted proxy: the router wiring that composes B6020, B399 and B310 into the chat route."
  - "Router._initialize_alerting and send_llm_exception_alert: not built, since the proxy only reaches them through router_settings.alerting_config, which LiteLLM keeps as a dict and fails on at startup, and the alert skips every call that carries proxy_server_request."
  - "Every other function in litellm/router.py: the owners in the litellm/router.py ownership inventory of tasks/B021-automatic-router-pipeline.yaml."
  - "The shadow evaluation logger and its judge calls: B4081 to B4085."

pitfalls:
  - "The recursion guard reads is_silent_experiment from the incoming request's metadata before the copy; checking the copy would always be true and no mirror would ever run."
  - "proxy_server_request must survive the copy, while litellm_call_id, litellm_logging_obj and standard_logging_object must not, or the mirror reuses the primary call's spend log id."
  - "litellm_parent_otel_span is removed only from the copy's metadata; the primary request keeps its span."
  - "metadata.model_group on the mirror is the silent target, not the primary model group, so metrics land on the silent model."
  - "stream leaves the request and travels as MirrorArgs.stream; a missing stream key means false."
  - "Weighted failover applies only when the strategy is exactly \"simple-shuffle\"; latency, usage and cost strategies keep the plain fallback path."
  - "cooldown_ids is the router-wide cooldown list, not only the failed group's, and it is subtracted before the exclusions."
  - "When metadata is absent the empty object is inserted before the remaining check, so it stays in the request even when the plan gives none."
  - "drop_excluded never falls back to the unfiltered list; only the retry skip with _retry_skipped_deployment_ids does that."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
