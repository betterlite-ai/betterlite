id: B3101
title: Report monthly active users, tag totals and per-user analytics
description: >-
  Implement three additional user-agent analytics endpoints in betterlite-server::user_agent_analytics
  to complement B3100's distinct, DAU and WAU metrics.

  Implement get_monthly_active_users (GET `/tag/mau`): calculate active users per tag for the last
  MAX_MONTHS=7 months (210 days), where months are 30-day periods. End boundary is UTC today + 1 day
  at 0:00 UTC. Accept optional tag_filter (substring ILIKE match, legacy) and tag_filters (exact
  match list, takes precedence). Query joins LiteLLM_DailyTagSpend with LiteLLM_VerificationToken
  on api_key=token, groups by tag and month_offset, counts distinct user_id. Generate descriptive
  month labels with ordinal numbers and month abbreviations (e.g., "Month 1 (Jan)"). Include
  period_start and period_end dates in response. Order by month_offset descending (most recent
  first) then active_users descending.

  Implement get_tag_summary (GET `/tag/summary`): aggregate metrics by tag across a provided date
  range (both start_date and end_date required as YYYY-MM-DD strings). Support same tag filtering
  as MAU. Query joins LiteLLM_DailyTagSpend with LiteLLM_VerificationToken on api_key=token using
  LEFT JOIN (retain records even when user_id is null), sums api_requests, successful_requests,
  failed_requests, and spend, and totals (prompt_tokens + completion_tokens). Coalesce all null
  aggregates to 0 or 0.0 in response. Order results by total_requests descending.

  Implement get_per_user_analytics (GET `/tag/user-agent/per-user-analytics`): return paginated
  per-user metrics for the last 30 days ending UTC tomorrow. Support optional tag_filter and
  tag_filters with same semantics as other endpoints. Accept page (default 1, ge 1) and page_size
  (default 50, ge 1 le 1000) query parameters. Return immediately with zero results and zero
  pages if no api_keys match the date and tag filters, without querying users or building metrics.
  Fetch tag records matching filters, extract unique api_keys, join with VerificationToken to map
  api_keys to user_ids, fetch UserRepository for emails, aggregate metrics by user_id. Each user's
  user_agent field stores the first observed tag (not replaced by later tags with different values);
  null values are preserved and counts/totals accumulate across all records for that user. Sort
  results by successful_requests descending before pagination. Return total_count, page, page_size
  and total_pages (ceil division: (total_count + page_size - 1) / page_size).

  All endpoints require user API key authentication (B052). When prisma_client is unavailable, return
  HTTP 500. Build SQL queries with parameter injection; accept date validation errors from strptime
  with HTTP 400 "Invalid date format. Use YYYY-MM-DD: {e}".

