    proof: [oracle, behavior-tests]
  - text: "get_monthly_active_users calculates month_offset using FLOOR((end_date - tag_date) / 30) and supports both exact-match tag_filters (takes precedence) and substring tag_filter legacy mode."
    proof: [oracle, behavior-tests]
  - text: "get_tag_summary accepts start_date and end_date as required YYYY-MM-DD parameters, validates with strptime and returns HTTP 400 on invalid format, aggregates across all matching records in date range."
    proof: [oracle, behavior-tests]
  - text: "get_tag_summary uses LEFT JOIN with VerificationToken to retain api_keys without matching user_id, sums api_requests/successful_requests/failed_requests, totals (prompt_tokens + completion_tokens) as total_tokens, sums spend."
    proof: [oracle, behavior-tests]
  - text: "get_tag_summary coalesces null aggregates to 0 (int) or 0.0 (float) in response, ordered by total_requests descending."
    proof: [oracle, behavior-tests]
  - text: "get_per_user_analytics returns immediately with zero results, zero total_count, and zero total_pages when no api_keys match the date and tag filters, without querying user or repository tables."
    proof: [oracle, behavior-tests]
  - text: "get_per_user_analytics fetches DailyTagSpend records for last 30 days ending UTC tomorrow, extracts unique api_keys, joins with VerificationToken to map to user_ids, fetches UserRepository for emails."
    proof: [behavior-tests]
  - text: "get_per_user_analytics aggregates metrics by user_id: user_agent stores the first observed tag (unchanged if already set), counts and totals accumulate across all records for that user."
    proof: [behavior-tests]
  - text: "get_per_user_analytics accepts page (default 1, ge 1) and page_size (default 50, ge 1 le 1000), returns paginated results sorted by successful_requests descending, with total_pages = ceil((total_count + page_size - 1) / page_size)."
    proof: [oracle, behavior-tests]
  - text: "Tag filtering respects exact-list precedence (tag_filters with exact match before tag_filter substring search) and empty filter lists mean no filtering across all three endpoints."
    proof: [oracle, behavior-tests]
  - text: "GET /tag/mau returns HTTP 500 with \"Database not connected\" error when prisma_client is unavailable."
    proof: [oracle]
  - text: "GET /tag/summary returns HTTP 500 with \"Database not connected\" error when prisma_client is unavailable."
    proof: [oracle]
  - text: "GET /tag/user-agent/per-user-analytics returns HTTP 500 with \"Database not connected\" error when prisma_client is unavailable."
    proof: [oracle]
