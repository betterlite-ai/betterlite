deviations:
  - what: SQL parameter injection uses Rust's native parameterized query API instead of string formatting for MAU query. Tag filter parameters are built dynamically with count-based indices.
    why: Prevents SQL injection and matches betterlite's database abstraction patterns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/user_agent_analytics_endpoints.py#L496-L523
  - what: Month labels use Rust chrono date formatting instead of PostgreSQL TO_CHAR. Output matches LiteLLM's format (e.g., "Month 1 (Jan)") exactly.
    why: Simplifies query building and aligns with Rust type safety.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/user_agent_analytics_endpoints.py#L512-L514
  - what: Per-user pagination uses Rust in-memory sorting and slicing (sort by successful_requests then slice for page) instead of SQL OFFSET/LIMIT.
    why: Total distinct users per 30-day window is typically small enough for in-memory sorting; simplifies implementation and avoids SQL complexity.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/user_agent_analytics_endpoints.py#L775-L787
  - what: Null numeric coalescing (int and float) is performed in Rust response construction using .unwrap_or() and float fallback to 0.0, not SQL COALESCE.
    why: Consistent type handling across the API and failure-safe if a SQL type doesn't match expectations.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/user_agent_analytics_endpoints.py#L625-L636
out_of_scope:
  - "_TableOps protocol and _typed_table overloads (lines 142-155) are type-checking-only definitions with no runtime implementation; they provide type hints that return the repository's existing .table property unchanged. B3100 does not build them either."
  - get_distinct_user_agent_tags, get_daily_active_users, get_weekly_active_users (owned by B3100).
  - Tag ownership scoping or authorization checks beyond user_api_key_auth (B052).
  - Caching of results or precomputed aggregations.
  - Database schema or table definitions (uses existing LiteLLM tables).
pitfalls:
  - "MAU uses 30-day month buckets via FLOOR((end_date - date) / 30): month_offset 0 is the most recent 30-day period, month_offset 1 is 30–60 days ago; query end_dt is UTC today at 0:00 + 1 day, making dates < end_date + 1 day inclusive of the end_date calendar day. Summary accepts arbitrary date ranges (start_date and end_date) with no +1 day adjustment; per-user uses a fixed 30-day window ending UTC today + 1 day, the same as MAU."
  - "MAU month labels show 'Month N (Mon)' where N = MAX_MONTHS - month_offset (N ranges 1–7) and Mon is the abbreviation of (end_date - (month_offset * 30) - 29 days). Period_start and period_end are the first and last days of each 30-day bucket, inclusive."
  - "Summary date validation uses strptime and raises ValueError before the database query; the error is caught and HTTP 400 'Invalid date format. Use YYYY-MM-DD: {e}' is returned. Null numeric aggregates coalesce to 0 or 0.0 in response construction, not in SQL."
  - "Per-user analytics returns immediately with zero results and total_pages=0 if no api_keys are found in the date range, skipping user and email table queries. Per-user user_agent stores the first observed tag and does not change if later records have different tags; null user_id in VerificationToken is skipped during user_id -> email mapping."
  - "Per-user pagination defaults to page=1 and page_size=50, with maximum page_size 1000. Total_pages is calculated as ceil division: (total_count + page_size - 1) / page_size. Results are sorted by successful_requests descending before pagination."
  - "Tag filtering across all three endpoints respects exact-list precedence (tag_filters with equality before tag_filter with ILIKE), and empty tag_filters lists mean no filtering (query all tags), not exclude everything."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
