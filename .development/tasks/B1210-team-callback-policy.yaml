dod:
  - text: >-
      Cases invalid_callback_400, valid_callback, audit_redacts_all_vars, redaction_deep_copy,
      malformed_slots_unchanged, sensitive_keys_masked, undecrypted_prefix_masked, ordinary_vars_visible,
      nonobject_defaults, logging_empty_shadows_legacy, logging_nonlist_shadows_legacy,
      null_logging_uses_legacy, invalid_entry_warn_drop, fold_callback_entries,
      invalid_legacy_raises, audit_disabled_no_task, audit_identity_and_json,
      audit_task_failure_warns, audit_cancel_no_warning, admin_unknown_team_status and
      nonadmin_unknown_team_403 prove resolution and audit effects. B065's config tests own the audit switch.
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_callback_policy::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/team_callback_policy.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/team-callback-policy-*")"
        && grep -rlq "team_callback_policy" tools/oracle/fuzz/corpus/helper_case/team-callback-policy-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/team-callback-policy/invalid-callback.yaml
  - tools/oracle/cases/helpers/team-callback-policy/list-masked-secrets.yaml
  - tools/oracle/cases/helpers/team-callback-policy/audit-redaction-copy.yaml
  - tools/oracle/cases/helpers/team-callback-policy/logging-precedence.yaml
  - tools/oracle/cases/helpers/team-callback-policy/unknown-team-role.yaml
deviations: []
out_of_scope:
  - B2304 owns callback encryption/decryption and sensitive-key selection; B065 owns audit storage and its settings.
  - 'litellm/proxy/management_endpoints/team_callback_endpoints.py: B057 owns add_team_callbacks (L258-L432),
    delete_team_callback (L442-L577).'
  - 'litellm/proxy/management_endpoints/team_callback_endpoints.py: B1211 owns disable_team_logging (L586-L716),
    get_team_callbacks (L725-L815).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as team_callback_policy in the server group. Replace the stub Op in tools/oracle/src/helpers/server/team_callback_policy.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/team_callback_policy.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Audit masking hides all callback variables, but GET masking must retain ordinary project, bucket and host configuration.
  - A present empty logging array suppresses the legacy callback_settings object rather than merging it.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
