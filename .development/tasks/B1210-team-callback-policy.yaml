id: B1210
title: Team callback validation redaction and audit projection
description: >-
  Validate AddTeamCallback using B246 callback_config_error; a returned message becomes HTTPException
  400 detail.error, otherwise accept. Redact audit metadata by deep-copying dictionaries and replacing
  EVERY value in logging[*].callback_vars and callback_settings.callback_vars with ***REDACTED***;
  leave non-dictionaries and malformed slots untouched. GET masking differs: B2304 sensitive-key
  classification or a remaining litellm_enc:: prefix masks a value, while ordinary configuration stays
  readable. Neither projection mutates stored metadata.

  _resolve_team_callbacks returns default TeamCallbackMetadata for non-dictionaries. Otherwise use
  B2304 decrypt_callback_vars, then prefer logging whenever it is not None, even [] or a non-list.
  Iterate dictionary entries only; B1109 _get_validated_callback_metadata warns and drops invalid entries
  with source team-level read, and convert_key_logging_metadata_to_callback folds valid entries in order.
  Only absent/null logging permits dictionary callback_settings as fallback; invalid legacy fields can
  raise. Mask the result after resolution. No key-level callback override is consulted here.

  Audit emission calls B065 is_audit_logging_enabled and schedules create_audit_log_for_update only when
  enabled. Its settings are litellm_settings.store_audit_logs=None, then LITELLM_STORE_AUDIT_LOGS, then
  premium_user (B065 owns that decision and its no-paid-tier policy). Use a random UUID, UTC updated_at,
  changed_by=truthy header then user_id then litellm_proxy_admin_name, caller api_key, table
  LiteLLM_TeamTable, object_id=team_id and action=updated. Serialize before_value/updated_values as
  {metadata: redacted snapshot}, default=str. Cancellation produces no warning; a task failure warns
  Failed to write team-callback audit log and cannot undo the route's committed write. Native Postgres
  tests use POSTGRES_TEST_URL or testcontainers; helper equality covers pure redaction/error projections.

  _callback_error preserves the supplied status and detail.error message. _unknown_team_error reveals
  the requested missing-team status only to PROXY_ADMIN; every other role receives 403 with string
  detail You do not have access to this team. There is no HTTP route or exception remapping here.


  Build the production team_callback_policy module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_callback_endpoints.py:
  _callback_config_error (L59-L60; 2 source lines), _validate_team_callback (L63-L66; 4 source lines),
  _redact_callback_secrets (L69-L92; 23 source lines), _mask_sensitive_callback_vars (L95-L118; 21 source
  lines), _resolve_team_callbacks (L121-L161; 36 source lines), _log_audit_task_exception (L164-L176;
  12 source lines), _emit_team_callback_audit_log (L179-L225; 42 source lines), _callback_error (L228-L233;
  6 source lines), _unknown_team_error (L236-L249; 13 source lines).


  Add the team_callback_policy operation under B856 Management::teams. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a team-callback-policy-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 159 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  159 production, 240 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 494 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
