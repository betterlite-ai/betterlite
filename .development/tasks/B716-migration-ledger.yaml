checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^migration_ledger::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/migration_ledger::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/migration_ledger::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^migration_ledger::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/migration-ledger-*")"
        && grep -rlq "DATABASE_URL" crates/betterlite-config/fuzz/corpus/config_yaml/migration-ledger-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
