id: B716
title: Migration locking and ledger recovery
description: >-
  Implement MigrationLedger and MigrationLock against the existing _prisma_migrations table, including
  session advisory locking, completion evidence, baseline bookkeeping, inert failed migrations and contention
  attempt accounting. Use the pinned lock ID and ledger columns; native migration outcomes substitute
  for Prisma CLI exit classes. Preserve existing IDs, migration_name, checksum and applied_steps_count;
  never mark an incomplete DDL step applied without source-equivalent evidence. MigrationCatalog carries
  explicit execution mode per pinned migration. Run the 20260415120000_health_check_latest_per_model_index
  single-statement migration outside a transaction; do not use a migrator that wraps all files implicitly.
  Keep interrupted concurrent-index creation incomplete in the ledger and let drift repair remove/rebuild
  an invalid index.


  B873 owns native migrate deploy; consume it here: hold Prisma advisory lock 72707369 for the entire
  run, in addition to the coordinator transaction/session lock int.from_bytes(b"llm_mig2", "big"). Apply
  ordered pending SQL files with their declared transaction mode and insert/update _prisma_migrations
  rows with SHA256 of exact migration bytes. Native baseline adopts only an already-current db-push schema
  with no ledger; an older schema cannot start. Do not create a schema-diff engine.


  Build the production migration_ledger module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm-proxy-extras/litellm_proxy_extras/migration_lock.py:
  migration_environment (L18-L29; 12 source lines), _try_lock (L37-L42; 5 source lines), MigrationCoordinator.check_connection
  (L49-L50; 2 source lines), MigrationCoordinator.acquire_prisma_lock (L52-L62; 11 source lines), migration_lock
  (L66-L89; 22 source lines), held_migration_lock (L93-L107; 14 source lines). litellm-proxy-extras/litellm_proxy_extras/migration_recovery.py:
  MigrationProgress.confirms_completion (L26-L31; 6 source lines), _migration_records (L34-L49; 15 source
  lines), recover_completed_migration (L52-L79; 26 source lines), baseline_current_schema (L89-L159; 68
  source lines), is_inert_migration (L167-L171; 5 source lines), roll_back_failed_inert_migration (L174-L204;
  30 source lines). litellm-proxy-extras/litellm_proxy_extras/utils.py: _MigrateAttemptBudget.exhausted
  (L108-L109; 2 source lines), _MigrateAttemptBudget.attempt_number (L112-L113; 2 source lines), _MigrateAttemptBudget.spend
  (L115-L116; 2 source lines), _MigrateAttemptBudget.after_contention (L118-L125; 8 source lines), _migration_timestamp
  (L188-L195; 7 source lines), _max_migration_timestamp (L198-L202; 5 source lines), ProxyExtrasDBManager._get_migration_names
  (L323-L327; 5 source lines), ProxyExtrasDBManager._read_migration_ledger (L356-L376; 19 source lines),
  ProxyExtrasDBManager._failed_migration_logs (L379-L387; 9 source lines), ProxyExtrasDBManager._failed_migration_recovered
  (L390-L396; 7 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DATABASE_URL=None.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::migration_ledger::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 282 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  282 production, 145 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 507 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
