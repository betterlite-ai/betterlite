id: B716
title: Migration locking and ledger recovery
description: >-
  Implement MigrationLedger and MigrationLock against the existing _prisma_migrations table, including
  transaction advisory locking, completion evidence, baseline bookkeeping, inert failed migrations and contention
  attempt accounting. Use the pinned lock ID and ledger columns; native migration outcomes substitute
  for Prisma CLI exit classes. Preserve existing IDs, migration_name, checksum and applied_steps_count;
  never mark an incomplete DDL step applied without source-equivalent evidence. B873 alone applies SQL
  files, owns the deploy session lock and handles the concurrent-index execution mode. This task reads
  B873's migration_files catalog but does not deploy it.


  migration_lock opens a ten-second-timeout autocommit connection and tries pg_try_advisory_xact_lock
  with int.from_bytes(b"llm_mig2", "big") inside a transaction. Hold that transaction through the yielded
  coordinator and its final SELECT 1 check. acquire_prisma_lock tries pg_try_advisory_xact_lock(72707369)
  on that transaction, not a session lock. Both retry with uniform 0.5-to-1.5-second jitter capped by
  remaining monotonic deadline. Timeout errors name the relevant lock and stop startup; coordination
  connection errors retain their cause. Log waiting/acquisition. held_migration_lock is the distinct
  nonblocking session-level llm_mig2 lock for concurrent DDL; yield false if unavailable and unlock in
  finally only when acquired, including a failed DDL body.

  migration_environment uses DIRECT_URL only when both it and DATABASE_URL are truthy. Replace its schema
  query entries with the first nonblank schema from DATABASE_URL, default public, preserving other direct
  URL parameters. _prisma_schema_param is owned here and returns the first schema query value or None;
  it selects the ledger namespace, not a Prisma CLI schema filename. Read ledger rows through B711's
  stripped libpq URL with a ten-second connection timeout, quote schema/table identifiers, and bind values.
  Missing/empty DATABASE_URL, absent driver at the pin, or operational/database errors return None; no row
  returns an empty tuple. Failed logs select unfinished/non-rolled-back rows by migration_name/started_at;
  no row or a non-string/null log becomes empty string, while unavailable lookup stays None. Recovered
  checks require the same identity and either finished_at or rolled_back_at.

  Recovery reads all non-rolled-back records, coalescing null logs to empty. With no unfinished records,
  return whether any checksum matches the exact bytes. Otherwise require exactly one unfinished row,
  applied_steps_count=1, whitespace-only logs and matching SHA256. Update only finished_at using a guarded
  id/checksum/steps/unfinished/not-rolled-back/original-logs predicate; a rowcount other than one raises
  the retry-startup error. Leave checksum, id, logs and steps untouched and log confirmed completion.

  Baseline first refuses an empty/custom migration history or schema.prisma bytes unlike the packaged
  build. Acquire the Prisma transaction lock and return unchanged if the ledger already exists. Without
  a ledger, B701 SchemaContract compares the live catalog to the independently initialized current build;
  mismatch or unavailable verification stops startup without reconciliation. Only a match may create the
  ledger with varchar(36) primary id, varchar(64) checksum, varchar(255) name, timestamptz started/finished/
  rolled-back dates, text logs and integer applied_steps_count default 0. Insert each packaged migration
  using a UUID, checksum, empty logs, started_at=finished_at=current_timestamp and steps left at 0. Warn
  that history was adopted and historical data backfills were neither replayed nor verified.

  is_inert_migration strips block then line comments, splits on semicolons and accepts only empty pieces
  or case-insensitive SELECT 1. Failed inert recovery refuses noninert SQL before taking the Prisma lock;
  require exactly one unfinished, non-rolled-back row, then set rolled_back_at without requiring a current
  checksum. A guarded update affecting other than one row raises the rerun-setup error; log success.
  _MigrateAttemptBudget starts with MAX_MIGRATE_DEPLOY_ATTEMPTS=4 and default contention_seconds_left=600;
  exhausted means attempts_left<=0, attempt_number=4-attempts_left+1, spend decrements only attempts, and
  after_contention decrements only elapsed contention time and errors at zero or below. Migration names
  parse only fourteen digits followed by underscore; others, including the eight-digit email index, map
  to zero, as does an empty maximum. Enumerate only */migration.sql and log the discovered count.


  Build the production migration_ledger module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm-proxy-extras/litellm_proxy_extras/migration_lock.py:
  migration_environment (L18-L29; 12 source lines), _try_lock (L37-L42; 5 source lines), MigrationCoordinator.check_connection
  (L49-L50; 2 source lines), MigrationCoordinator.acquire_prisma_lock (L52-L62; 11 source lines), migration_lock
  (L66-L89; 22 source lines), held_migration_lock (L93-L107; 14 source lines). litellm-proxy-extras/litellm_proxy_extras/migration_recovery.py:
  MigrationProgress.confirms_completion (L26-L31; 6 source lines), _migration_records (L34-L49; 15 source
  lines), recover_completed_migration (L52-L79; 26 source lines), baseline_current_schema (L89-L159; 68
  source lines), is_inert_migration (L167-L171; 5 source lines), roll_back_failed_inert_migration (L174-L204;
  30 source lines). litellm-proxy-extras/litellm_proxy_extras/utils.py: _MigrateAttemptBudget.exhausted
  (L108-L109; 2 source lines), _MigrateAttemptBudget.attempt_number (L112-L113; 2 source lines), _MigrateAttemptBudget.spend
  (L115-L116; 2 source lines), _MigrateAttemptBudget.after_contention (L118-L125; 8 source lines), _migration_timestamp
  (L188-L195; 7 source lines), _max_migration_timestamp (L198-L202; 5 source lines), ProxyExtrasDBManager._get_migration_names
  (L323-L327; 5 source lines), ProxyExtrasDBManager._read_migration_ledger (L356-L376; 19 source lines),
  ProxyExtrasDBManager._failed_migration_logs (L379-L387; 9 source lines), ProxyExtrasDBManager._failed_migration_recovered
  (L390-L396; 7 source lines).


  Also own prisma_toolchain.py _timeout_from_env (L81-L100), prisma_command_timeout (L103-L107),
  migration_lock_timeout (L110-L111) and prisma_migrate_deploy_timeout (L121-L127), below their B051,
  B717 and B857 callers. LITELLM_MIGRATION_LOCK_TIMEOUT defaults 600 seconds; invalid numeric
  text, nonfinite values and values<=0 warn and fall back to 600, while positive fractional seconds work.
  LITELLM_PRISMA_COMMAND_TIMEOUT uses the same parser with default 60. LITELLM_PRISMA_MIGRATE_DEPLOY_TIMEOUT,
  when present even as an empty string, uses that parser with default 600 and does not inherit the
  command timeout. When absent it is max(600,prisma_command_timeout()). Thus an explicit invalid deploy
  timeout falls back to 600 even when command timeout is 900. Preserve the distinct warning text
  'is not a number' versus 'is not a finite positive number', the env name/value and fallback seconds.
  DATABASE_URL and DIRECT_URL default absent. These reads resolve in betterlite-config and are injected.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use independent temporary databases
  for complete baseline histories, since baseline constraint-name guards inspect the whole database;
  small ledger-only fixtures can use isolated schemas. Clean only test-owned objects on exit.


  Write betterlite-config::migration_ledger::tests::lock_timeout_default, positive_fractional_timeout,
  invalid_timeout_warns, command_timeout_default_sixty, deploy_timeout_default_six_hundred,
  absent_deploy_inherits_larger_command, explicit_deploy_overrides_command,
  invalid_present_deploy_uses_six_hundred, timeout_warning_categories,
  direct_url_schema_override, missing_url_passthrough and first_schema_value.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 282 original owned source lines plus 34 timeout-helper/accessor lines and eight schema-query lines.
  Allow 324 production, 345 behavior/Postgres tests, 30 wiring and 70 config lines, 769 within an 800-line
  gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
