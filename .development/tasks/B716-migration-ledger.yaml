  - text: 'Implement the owned behavior and ordered failure effects; named tests: native_baseline_current_only,
      coordinator_lock_contention, prisma_xact_lock_contention, connection_check_before_commit,
      lock_timeout_deadline, lock_connection_error, held_lock_unlock_on_error, held_lock_false,
      direct_schema_preserved, public_schema_default, ledger_unavailable_none, ledger_absent_tuple,
      failed_logs_null_empty, recovered_identity_match, completed_checksum_match, completion_one_step,
      completion_empty_logs, completion_exact_checksum, completion_multiple_unfinished,
      completion_guard_rowcount, baseline_rows_zero_steps, baseline_custom_history_refused,
      baseline_existing_ledger_noop, baseline_warns_backfills, inert_comments_select_one,
      noninert_not_rolled_back, failed_inert_recovery, inert_guard_rowcount, attempt_and_contention_budgets,
      timestamp_fourteen_digits, postgres_pinned_rows and postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^migration_ledger::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/migration_ledger::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/migration_ledger::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::migration_ledger::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/migration-ledger-*")"
        && grep -rlq "DATABASE_URL" crates/betterlite-config/fuzz/corpus/config_yaml/migration-ledger-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
