checks:
  optional:
  - mutants
  commands:
  - id: case-provider-qualified-catalog
    why: The provider-qualified-catalog behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_capability_catalog_cases::case_[0-9]+_provider_qualified_catalog$/)'
  - id: case-exact-capability
    why: The exact-capability behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_capability_catalog_cases::case_[0-9]+_exact_capability$/)'
  - id: case-adaptive-thinking
    why: The adaptive-thinking behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_capability_catalog_cases::case_[0-9]+_adaptive_thinking$/)'
  - id: case-forced-tool-downgrade
    why: The forced-tool-downgrade behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_capability_catalog_cases::case_[0-9]+_forced_tool_downgrade$/)'
  - id: case-sampling-capability
    why: The sampling-capability behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_capability_catalog_cases::case_[0-9]+_sampling_capability$/)'
  - id: case-legacy-budget-effort
    why: The legacy-budget-effort behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_capability_catalog_cases::case_[0-9]+_legacy_budget_effort$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_capability_catalog.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_capability_catalog*")"
      && grep -lq 'anthropic_capability_catalog' tools/oracle/fuzz/corpus/helper_case/anthropic_capability_catalog*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_capability_catalog$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
