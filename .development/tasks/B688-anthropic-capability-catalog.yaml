id: B688
title: Anthropic catalog capability and thinking selection
description: >-
  Port AnthropicModelInfo catalog lookup, alias/provider normalization and forced-tool/sampling/adaptive-thinking
  capability projections. Inject the catalog and B2216 raw catalog lookup; B569 composes these with AnthropicConfig
  effort/speed parameter gates.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  AnthropicModelInfo._supports_sampling_params L478-L503; AnthropicModelInfo._apply_sampling_param L506-L528; AnthropicModelInfo.forced_tool_use_unsupported
  L531-L532; AnthropicModelInfo.forced_tool_use_downgraded L535-L552; AnthropicModelInfo._apply_forced_tool_choice
  L555-L567; AnthropicModelInfo._get_provider_resolved_capability L651-L668; AnthropicModelInfo._supports_model_capability
  L671-L693; AnthropicModelInfo._is_adaptive_thinking_model L696-L705; AnthropicModelInfo._is_always_on_thinking_model
  L708-L714; AnthropicModelInfo._supports_legacy_thinking L717-L724; AnthropicModelInfo.maybe_drop_disabled_thinking
  L727-L744; AnthropicModelInfo.translate_legacy_thinking_for_adaptive_model L747-L781; AnthropicModelInfo._legacy_budget_to_effort
  L784-L793; AnthropicModelInfo.is_effort_used L795-L829.


  Reuse B2216 for candidate normalization, raw/exact capability lookup and fast-mode selection.


  Named case contracts: provider_qualified_catalog: Resolve model/provider with B174 before provider-aware model
  metadata. A resolved bool, including False, is authoritative; exceptions or non-bools yield None. With no resolved
  bool, try _supports_factory; only True stops fallback, and exceptions are swallowed. Finally require raw B2216
  capability is True. supports_adaptive_thinking, thinking_always_on and supports_legacy_thinking use this sequence;
  model-version gates belong to catalog generalization rules, not hardcoded branches. adaptive_thinking: Translate
  only adaptive models without supports_legacy_thinking and a thinking dict whose type is enabled. Convert budget_tokens
  via int(value or 0), propagating invalid conversion before mutation. Replace thinking with type=adaptive, keeping
  display only for summarized or omitted (updates is discarded). Set output_config effort from the budget then overlay
  an existing dict, so even caller effort=None wins and other keys survive; a non-dict output_config is discarded.
  forced_tool_downgrade: Only raw supports_forced_tool_use is False disables forcing. Missing type raises; types
  other than any/tool pass unchanged. Disabled forcing without a truthy global/per-call drop_params raises UnsupportedParamsError
  400: {model} does not support forced tool use (tool_choice='required' or a named tool). Use tool_choice='auto'
  and tell the model in the prompt when to call the tool, or set `litellm.drop_params = True` to downgrade to 'auto'
  automatically. With drop enabled emit DROP_FORCED_TOOL_CHOICE_WARNING and replace with type=auto, retaining disable_parallel_tool_use
  only when non-None (False included); drop name and other fields. sampling_capability: An explicit supports_sampling_params
  bool wins. Otherwise lower-case name is unsupported if it contains fable or opus-4-7, opus_4_7, opus-4.7, opus_4.7,
  opus-4-8, opus_4_8, opus-4.8 or opus_4.8; all other names allow sampling. Forward to the caller output_key when
  supported or when temperature equals 1 (including Python True). Otherwise either global or per-call truthy drop_params
  silently omits the field without warning; with neither raise UnsupportedParamsError 400, message {model} does
  not support {param}={value}. followed for temperature by Only temperature=1 is supported. and then To drop unsupported
  params, set `litellm.drop_params = True`. legacy_budget_effort: Budget >= the loaded xhigh threshold yields xhigh
  only with supports_xhigh_reasoning_effort. Otherwise >=high yields high, >=medium yields medium, else low, including
  negative/zero budgets. There is no max result even at the configured max threshold. disabled_thinking_warning:
  Only a dict with type=disabled on a thinking_always_on model is removed. This ignores drop_params and always warns
  with DROP_DISABLED_THINKING_WARNING; other thinking values/maps remain unchanged. effort_beta_gate: Absent/empty
  options return False; an adaptive model suppresses the effort beta regardless of values. For other models a nonempty
  string reasoning_effort enables it only when the lower-case name contains opus-4-5 or opus_4_5. Otherwise a truthy
  dict output_config with a nonempty string effort enables it; nonstrings and empty strings do not.


  Shared thinking budgets resolve integer environment variables DEFAULT_REASONING_EFFORT_MINIMAL_THINKING_BUDGET=128,
  DEFAULT_REASONING_EFFORT_LOW_THINKING_BUDGET=1024, DEFAULT_REASONING_EFFORT_MEDIUM_THINKING_BUDGET=2048, DEFAULT_REASONING_EFFORT_HIGH_THINKING_BUDGET=4096,
  DEFAULT_REASONING_EFFORT_XHIGH_THINKING_BUDGET=8192 and DEFAULT_REASONING_EFFORT_MAX_THINKING_BUDGET=16384. B569
  consumes the same loaded values; the Anthropic minimum floor is the literal 1024, not an environment setting.


  Load DEFAULT_REASONING_EFFORT_MINIMAL_THINKING_BUDGET, DEFAULT_REASONING_EFFORT_LOW_THINKING_BUDGET, DEFAULT_REASONING_EFFORT_MEDIUM_THINKING_BUDGET,
  DEFAULT_REASONING_EFFORT_HIGH_THINKING_BUDGET, DEFAULT_REASONING_EFFORT_XHIGH_THINKING_BUDGET, DEFAULT_REASONING_EFFORT_MAX_THINKING_BUDGET
  through betterlite-config, with injected environment lookup and the defaults/precedence stated here. Deployment
  inputs use litellm_params and global inputs use litellm_settings. Add config rstest anthropic_thinking_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Load BEDROCK_MIN_THINKING_BUDGET_TOKENS through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest anthropic_capability_catalog_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  BEDROCK_MIN_THINKING_BUDGET_TOKENS is parsed as an integer from the identically named environment variable, default
  1024 (constants.py L540); B600 and B621 consume this same loaded value. Invalid integer strings fail configuration
  loading rather than silently restoring the default.


  Warning literals: DROP_FORCED_TOOL_CHOICE_WARNING is "Downgrading forced tool_choice to 'auto' for model=%s (drop_params=True):
  this model rejects tool_choice type 'any'/'tool' with a 400 because thinking is always on and a forced call would
  skip it." DROP_DISABLED_THINKING_WARNING is "Dropping `thinking={'type': 'disabled'}` for model=%s: thinking is
  always on for this model and cannot be disabled (the alternative is a provider 400). The model will still think
  adaptively, its response can contain thinking blocks, and those thinking tokens are billed as output tokens."
  Use B184 error envelope mapping and ignore only rewritten error message text in oracle comparisons. Global drop_params
  is the existing B002/B176 setting, default False; do not add a second loader.


  Shared metadata calls are B2219 _get_model_info_helper and B2221 _supports_factory/declared_value_factory/is_explicitly_disabled_factory;
  reuse those implementations directly. B157 is only the public Python facade and is not a dependency of these provider
  predicates.


  Implement crates/betterlite-anthropic/src/anthropic_capability_catalog.rs with adjacent tests under anthropic_capability_catalog/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation anthropic_capability_catalog in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_capability_catalog_cases in betterlite-anthropic with these exact named cases
  (one per oracle file): provider_qualified_catalog, adaptive_thinking, forced_tool_downgrade, sampling_capability,
  legacy_budget_effort, disabled_thinking_warning, effort_beta_gate. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_capability_catalog* using HelperCase:
  kind: helper and the externally tagged anthropic_capability_catalog variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_anthropic_capability_catalog that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 231 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 285 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 95 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 765 planned, 775 maximum changed lines.
