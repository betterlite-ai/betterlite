deviations:
  - what: "`set_attributes` returns `Err(MissingStandardLoggingObject)` and leaves the logging and the callback-failure count to its caller."
    why: LiteLLM swallows every exception inside the method. Rule errors-surface forbids a swallowed error; the span stays untouched in both versions, and the lifecycle (B3859) logs the same message.
  - what: "The emit-once record, the capture mode and the settings record are passed in through `AttributeContext`, not read from `self`."
    why: Rule no-module-state and constructor wiring; the lifecycle owns the logger state and builds the context once per request.

out_of_scope:
  - "set_tools_attributes, _tool_calls_kv_pair, the message, choice and Responses transforms and _to_dict (B3845); this task only calls them."
  - "cast_as_primitive_value_type, _cast_as_primitive_value_type and safe_set_attribute (B3844)."
  - "The semconv helpers _gen_ai_operation_name, _set_semconv_request_attributes, _set_semconv_cache_token_attributes and _gen_ai_semconv_latest_experimental, and _set_inference_identity_attributes, _set_service_tier_attributes, _team_metadata_json and the capture predicates (B3854); this task only calls them."
  - "_start_primary_span, _maybe_log_raw_request, _handle_success, _handle_failure, the span kind CLIENT choice and the decision to create the raw span (B3859)."
  - "The Langtrace, Langfuse OTel and Weave attribute writers themselves (B3846, B3909, B3861); this task only picks them by callback name."
  - "Arize and Phoenix set_attributes overrides (B3862) and Arize's shared flow (B3861)."
  - "is_unbilled_non_inference_call_from_params and should_redact_message_logging (B188); this task calls them."
  - "safe_dumps (B192)."
  - "handle_callback_failure on the custom logger base (the logging callback manager task); the lifecycle calls it on the error."

pitfalls:
  - 'The usage block tests `kwargs["call_type"]` for the unbilled check, while the non-semconv operation name reads `payload["call_type"]` and the semconv operation name reads `kwargs["call_type"]`; do not use one source for all three.'
  - '`gen_ai.request.temperature` and `gen_ai.request.max_tokens` use a truthiness test, so 0 and 0.0 are not written, while `llm.request.type` and the three usage counts are always written, as the empty string when null.'
  - '`llm.is_streaming` is the Python text `True`, `False` or `None`, not a bool attribute, and it is not written at all in semconv mode, where only `gen_ai.request.stream` (true) can appear.'
  - 'The provider key is `gen_ai.system` in the legacy mode and `gen_ai.provider.name` in semconv mode, never both.'
  - 'The system prompt picks the first kwarg that is not null, so `system_instructions: []` wins over a truthy `instructions` and then nothing is written.'
  - 'The Responses branch builds its tool calls from `function_call` items only and always passes `name` and `arguments` as strings, so a null argument becomes the empty string and `_tool_calls_kv_pair` still skips it as falsy.'
  - 'Tool-call attributes from `choices` are written only for choices with a truthy `finish_reason`; a streaming-style choice without one writes no tool attributes.'
  - 'A raw response key with the same name as a raw request key replaces it, because the response entries are written second.'
  - 'The unbilled check reads the origin from the merged metadata, where `litellm_params.metadata` wins over `litellm_metadata` and drops `user_api_key_auth` and `user_api_key_budget_reservation`; reading only `metadata` misses an origin set on the other map.'
