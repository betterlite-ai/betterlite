dod:
  - text: A callback name of langtrace, langfuse_otel or weave_otel hands the span to that vendor's writer and writes none of the generic attributes; any other name runs the generic flow.
    proof: [dispatch-tests, oracle, helper-python]
  - text: A kwargs without standard_logging_object returns MissingStandardLoggingObject and writes no attribute.
    proof: [dispatch-tests, oracle, helper-python]
  - text: Metadata, hidden params, cost breakdown, identity and service-tier attributes are written in LiteLLM's order with its skip rules.
    proof: [request-tests, oracle, helper-python]
  - text: Request attributes write the model, call type, provider (Unknown when absent), and the max tokens, temperature and top_p only when truthy; streaming, user, response id with the payload id fallback, call id and response model follow the rules above.
    proof: [request-tests, oracle, helper-python]
  - text: In semconv latest-experimental mode the provider key is gen_ai.provider.name, the semconv request and cache-token attributes replace llm.is_streaming, and in the other mode gen_ai.system and llm.is_streaming are written.
    proof: [request-tests, oracle, helper-python]
  - text: Usage attributes are written for a truthy usage, are skipped for an unbilled non-inference call type, and still count for a background response or a cost-poll origin.
    proof: [request-tests, oracle, helper-python]
  - text: Nothing after usage is written when the capture mode does not capture in the span.
    proof: [content-tests, oracle, helper-python]
  - text: Tools, input messages, system instructions (first non-null of system_instructions, instructions, system), operation name from both call-type sources, and request id are written as described.
    proof: [content-tests, oracle, helper-python]
  - text: Choices write output messages, finish reasons and tool-call attributes; a falsy choices list falls to the Responses output branch with its function-call attributes and status finish reason.
    proof: [response-tests, oracle, helper-python]
  - text: Raw request attributes use the provider prefix, write request entries before response entries, and handle JSON text, non-JSON text and non-object JSON as described.
    proof: [raw-request-tests, oracle, helper-python]
  - text: parse_raw_response replays its fuzz corpus without panicking.
    proof: [raw-request-tests]
  - text: Newly added helper corpus cases replay through the shared helper-case parser independently of the native behavior tests.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: dispatch-tests
      why: the callback-name branch or the missing standard_logging_object error is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_attributes::dispatch::/)'
    - id: request-tests
      why: the metadata, request, usage or service-tier attributes are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_attributes::request::/)'
    - id: content-tests
      why: the content gate, messages, system instructions or operation name are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_attributes::content::/)'
    - id: response-tests
      why: the choices, finish reasons, tool-call or Responses output attributes are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_attributes::response::/)'
    - id: raw-request-tests
      why: the raw request attributes or the raw response decoder are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_attributes::raw_request::/)'
    - id: helper-python
      why: the LiteLLM-side helper and the betterlite helper disagree on a case
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3856::/)'
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/legacy-otel-attributes/ "tools/oracle/fuzz/corpus/helper_case/legacy-otel-attributes-*")" &&
        grep -rlE '^[[:space:]]+b3856:' tools/oracle/cases/helpers/legacy-otel-attributes &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

