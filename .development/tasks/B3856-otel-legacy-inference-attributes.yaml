id: B3856
title: Legacy OTel inference and raw-request attributes
description: >-
  Build the part of LiteLLM's legacy OpenTelemetry logger that fills a span for one LLM call: `set_attributes`, which writes the metadata, request, usage, content and response attributes, and `set_raw_request_attributes`, which writes the provider's raw request and raw response onto the second "litellm_raw_gen_ai_request" span. Also build the callback-name branch at the top of `set_attributes` that hands the span to the Langtrace, Langfuse OTel and Weave writers instead.
  The lifecycle (B3859) creates the spans, picks the tracer and calls these two functions, and the Weave and other vendor callbacks (B3863) reach them through the lifecycle, so this task owns them and calls none of them back.
  Everything goes in the module `otel::legacy_attributes` of betterlite-logging: `crates/betterlite-logging/src/otel/legacy_attributes.rs` declares the submodules `error`, `context`, `dispatch`, `request`, `content`, `response` and `raw_request`, each in `legacy_attributes/<name>.rs` with its tests in `legacy_attributes/<name>/tests.rs`. Read the exact pub names and signatures of B3844 (`SafeSetAttribute`, `OtelModelValue`, `MetadataMap`), B3845 (`otel::transforms` and the tool writers), B3854 (`otel::legacy_policy`), B3846 (`otel::integrations::langtrace`), B3861 (`weave_attributes`), B3909 (the Langfuse OTel writer) and B188 (`logging_privacy::internal`) on main before you start, and call them as they are.

  Inputs. Python reads dicts with `.get` and truthiness. Rust reads `OtelModelValue` only, so `kwargs` is `&MetadataMap`, the standard logging payload is the map under `kwargs["standard_logging_object"]`, and the response is `Option<&OtelModelValue>`. A missing key and a null value read the same unless a rule below says otherwise. A value is "truthy" by the rule of B3861's `is_truthy` (`otel::integrations::arize_attributes::truthy`); call it, do not write a second one. LiteLLM's `safe_dumps` is B192's depth-limited JSON writer, and every `safe_set_attribute` call is B3844's `SafeSetAttribute::safe_set_attribute`. Every function takes the span as `&mut S` with `S: opentelemetry::trace::Span`.
  `context` holds `AttributeContext<'a> { callback_name: Option<&'a str>, config: &'a OpenTelemetryConfig, capture_mode: CaptureMode }`. The lifecycle builds it once per request: `config` is the logger's B3854 settings record, and `capture_mode` is `CapturePolicy::resolve(turn_off_message_logging, message_logging)` for that request. `capture_in_span` of the mode replaces LiteLLM's `self._capture_in_span()`, and `semconv_latest_experimental(config)` replaces `self._gen_ai_semconv_latest_experimental`. A struct keeps every function at five arguments or fewer, which clippy.toml requires.

  Errors (`error`). `LegacyAttributesError` has one variant, `MissingStandardLoggingObject`, with the display text "standard_logging_object not found in kwargs". `set_attributes` returns `Result<(), LegacyAttributesError>`. LiteLLM catches every exception inside, logs it with `verbose_logger.exception` and bumps the callback-failure counter; here the caller (B3859) logs and counts the `Err`, so this task neither logs it nor swallows it. Nothing else here can fail: malformed shapes that make Python raise (a choice with a finish reason and no `message`) are outside the declared types and are read as absent.

  Dispatch (`dispatch`). `set_attributes(span, ctx, kwargs, response)` first looks at `ctx.callback_name`. "langtrace" calls B3846's Langtrace writer and returns. "langfuse_otel" calls B3909's `set_langfuse_otel_attributes` and returns. "weave_otel" calls B3861's `set_weave_otel_attributes` and returns. Any other name, or none, runs the generic flow below. Pass each vendor writer what its signature asks for (B3861 and B3909 take the redaction answer as a bool; compute it with B188's `should_redact_message_logging` equivalent from `kwargs`). The Arize and Phoenix callbacks override `set_attributes` in their own classes (B3862) and never come through this branch.

  Generic flow, part one (`request`). `payload` is `kwargs["standard_logging_object"]`; when it is missing or null return `Err(MissingStandardLoggingObject)` before any attribute is written. `optional_params` is `kwargs["optional_params"]` and `litellm_params` is `kwargs["litellm_params"]`, each an empty map when absent or null. Then, in this order:
  1. For every key and value of `payload["metadata"]`, write `metadata.<key>`.
  2. `hidden_params` is `payload["hidden_params"]`; when truthy write `hidden_params` as its `safe_dumps` text.
  3. B3854's `set_inference_identity_attributes(span, payload, litellm_params, ctx.config.baggage_team_metadata_keys, ctx.config.baggage_metadata_keys)`.
  4. `cost_breakdown` is `payload["cost_breakdown"]`; when truthy, write `gen_ai.cost.<key>` for each entry whose value is not null.
  5. `gen_ai.request.model` from `kwargs["model"]` when truthy.
  6. `llm.request.type` from `payload["call_type"]`, always written (a missing value becomes the empty string).
  7. The provider is `litellm_params["custom_llm_provider"]`, or the text "Unknown" when the key is absent (a present null is written as the empty string). In semconv latest-experimental mode write it as `gen_ai.provider.name`, otherwise as `gen_ai.system`.
  8. `gen_ai.request.max_tokens`, `gen_ai.request.temperature` and `gen_ai.request.top_p` from the same names in `optional_params`, each only when truthy, so a temperature of 0 is not written.
  9. In semconv mode call B3854's `set_semconv_request_attributes(span, optional_params)` and `set_semconv_cache_token_attributes(span, payload)` and write nothing else here. Otherwise write `llm.is_streaming` as the text `True` or `False` of `optional_params["stream"]`, with `False` when the key is absent and `None` when it is null.
  10. `llm.user` from `optional_params["user"]` when truthy.
  11. `gen_ai.response.id` is `response["id"]` when the response is truthy and has a truthy id, else `payload["id"]`; write it when truthy.
  12. `litellm.call_id` from `payload["litellm_call_id"]` when truthy.
  13. `gen_ai.response.model` from `response["model"]` when the response is truthy and the value is truthy.
  14. B3854's `set_service_tier_attributes(span, payload)`.
  15. Usage. The response's `usage` counts only when the response is truthy and the call is not an unbilled non-inference call. That test is B188's `call_category(kwargs["call_type"])` and `is_unbilled(category, origin, background)`: `origin` is `Some(Origin::BackgroundResponseCostPoll)` when the key `internal_call_origin` of the merged metadata holds "background_response_cost_poll" (the merge is `litellm_params.metadata` without `user_api_key_auth` and `user_api_key_budget_reservation`, then `litellm_params.litellm_metadata` for keys the first lacks), and `background` is true only when `response["background"]` is the bool true. Note that the call type here is `kwargs["call_type"]`, not the payload's. When `usage` is truthy write `gen_ai.usage.total_tokens`, `gen_ai.usage.output_tokens` (from `completion_tokens`) and `gen_ai.usage.input_tokens` (from `prompt_tokens`), each always, so a missing count is the empty string.

  Generic flow, part two (`content`). When `ctx.capture_mode` is not captured in the span, return `Ok(())` here: usage is written, content is not.
  1. When `optional_params["tools"]` is truthy, call B3845's `set_tools_attributes`.
  2. When `kwargs["messages"]` is truthy write `gen_ai.input.messages` as the `safe_dumps` text of B3845's message transform of it.
  3. The system prompt is the first of `kwargs["system_instructions"]` (Vertex Gemini), `kwargs["instructions"]` (OpenAI Responses) and `kwargs["system"]` (Anthropic Messages) that is not null; an empty list or empty string is chosen if it comes first, and then nothing is written. When truthy: a string is written as it is to `gen_ai.system_instructions`, anything else as the `safe_dumps` text of the message transform.
  4. `gen_ai.operation.name`, always written. In semconv mode it is B3854's `gen_ai_operation_name(kwargs["call_type"])`. Otherwise it is "chat" when `payload["call_type"]` is "completion", else `payload["call_type"]`, else "chat" when that is missing or empty.
  5. `gen_ai.request.id` from `payload["request_id"]` when truthy.

  Generic flow, part three (`response`). Only when the response is present (not the same as truthy: an empty object still enters). If `response["choices"]` is truthy: write `gen_ai.output.messages` as the `safe_dumps` text of B3845's choices transform. Collect the truthy `finish_reason` of each choice; when the list is not empty write `gen_ai.response.finish_reasons` as its `safe_dumps` text. Then for each choice with a truthy `finish_reason` whose `message.tool_calls` is truthy, write every key and value of B3845's `_tool_calls_kv_pair` of those calls. Otherwise, if `response["output"]` is truthy (Responses API): write `gen_ai.output.messages` from B3845's Responses transform only when it returns a non-empty list; then build one call `{"function": {"name": ..., "arguments": ...}}` for each output item (after B3845's `_to_dict`) whose `type` is "function_call", with name and arguments defaulting to the empty string, and write the `_tool_calls_kv_pair` of that list when it is not empty; then, when `response["status"]` is truthy, write `gen_ai.response.finish_reasons` as the `safe_dumps` text of the one-element list holding the status. The Responses branch runs only when `choices` is falsy.

  Raw request (`raw_request`). `set_raw_request_attributes(span, kwargs)` writes provider-prefixed attributes for the second span. `provider` is `kwargs["litellm_params"]["custom_llm_provider"]`, or "Unknown" when the key is absent (a present null becomes the text "None" in the key, as the Python f-string does). `complete_input_dict` is `kwargs["additional_args"]["complete_input_dict"]`; when it is a non-empty object write `llm.<provider>.<param>` for each entry. Then `kwargs["original_response"]`: only a non-empty string counts. `parse_raw_response(text) -> Option<OtelModelValue>` parses it with `serde_json::from_str`. A parsed object writes `llm.<provider>.<param>` for each entry, after the request entries, so a response key with the same name replaces the request one. Text that does not parse writes `llm.<provider>.stringified_raw_response` with the original text and logs it at `debug` as "raw_response not json string". Text that parses to something other than an object (an array, a number) writes nothing and logs `tracing::error!` "OpenTelemetry logging error in set_raw_request_attributes", because Python raises on `.items()` and its outer handler logs the same. The function takes no `response` argument (LiteLLM's third argument is never read) and no `ctx`: the lifecycle decides whether to call it, using `capture_in_span` and the semconv mode (B3859). `parse_raw_response` is the decoder of provider text, so it gets a cargo-fuzz target `crates/betterlite-logging/fuzz/fuzz_targets/legacy_raw_response.rs` that feeds UTF-8 input to it, and a corpus folder `crates/betterlite-logging/fuzz/corpus/legacy_raw_response` with at least three seeds, replayed by the test `replays_the_legacy_raw_response_corpus` in the raw_request tests.

  Attribute names LiteLLM takes from `SpanAttributes` (`proxy/_types.py` L4256-L4320): `gen_ai.system`, `gen_ai.request.model`, `gen_ai.request.max_tokens`, `gen_ai.request.temperature`, `gen_ai.request.top_p`, `gen_ai.response.model`, `gen_ai.input.messages`, `gen_ai.output.messages`, `gen_ai.usage.input_tokens`, `gen_ai.usage.output_tokens`, `gen_ai.usage.total_tokens`, `gen_ai.operation.name`, `gen_ai.request.id`, `gen_ai.system_instructions`, `gen_ai.response.finish_reasons`, `llm.request.type`, `llm.user` and `llm.is_streaming`. Reuse B3840's constants where they exist; put the rest in a `keys` constants block in `legacy_attributes/request.rs` and do not repeat one that B3840 already has. The proof is the oracle cases, not the names.

  The logger is not routed by any proxy route yet, so every behavior is proven by helper cases through the oracle, not by HTTP cases; the umbrella that wires the logger adds HTTP cases. The Python helper builds LiteLLM's `OpenTelemetry` class with an in-memory exporter, calls the method under test and returns the span's attributes as a JSON object; the Rust helper does the same with `InMemorySpanExporter`. The oracle adapter is operation `b3856`. Tagged inputs: `{"function": "set_attributes", "callback_name": ..., "capture_mode": "SPAN_AND_EVENT", "semconv": false, "baggage_metadata_keys": [...], "baggage_team_metadata_keys": [...], "kwargs": {...}, "response": {...}}` (the last four optional) and `{"function": "set_raw_request_attributes", "kwargs": {...}}`. Both sides answer `{"result": {"attributes": {...}}}`, or `{"result": {"error": "standard_logging_object not found in kwargs"}}` for the missing-object case. Every case gets a fuzz seed of the same content at `tools/oracle/fuzz/corpus/helper_case/legacy-otel-attributes-<case>.yaml`.

