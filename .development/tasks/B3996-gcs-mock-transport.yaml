deviations:
  - what: >-
      GCS mock mode is activated globally via the GCS_MOCK environment variable and patches
      AsyncHTTPHandler.get, AsyncHTTPHandler.delete, and VertexBase auth methods
      (_ensure_access_token_async, _ensure_access_token, _get_token_and_url) globally at
      module initialization time. This diverges from the intended injected fixture pattern
      where tests pass mock factories to client constructors. The current implementation uses
      application-wide patching that affects all Vertex and GCS clients when GCS_MOCK is set,
      not instance-local mock state.
    why: >-
      The LiteLLM implementation at the pinned commit uses global monkeypatching activated via
      environment variable. Following this approach preserves compatibility with the existing
      GCS mock test framework and allows the mock to function without changes to
      GCSBucketBase.__init__ beyond calling the mock setup functions. A future decision would
      be needed to move to instance-scoped fixture injection as originally outlined.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gcs_bucket/gcs_bucket_mock_client.py#L185-L235
out_of_scope:
  - B191 owns mock_client_factory.create_mock_client_factory, MockClientConfig and MockResponse; they require a concrete shared owner and are not implemented here.
  - B002 owns environment loading for GCS_MOCK and GCS_MOCK_LATENCY_MS; this task consumes the resolved values.
  - B173 owns the real AsyncHTTPHandler and fallthrough to actual httpx/aiohttp clients; mocks intercept before that boundary.
  - GCSBucketBase construction is B3997; this task provides only the injectable mock factory.
pitfalls:
  - The mock GET handler returns a complete JSON object as bytes, not streaming chunks; callers must handle this as a full response, not a stream boundary.
  - Auth mocks are installed on the VertexBase class globally when the factory is first called, not locally per instance; test isolation requires careful mock cleanup between test runs.
  - Fallthrough for non-mocked URLs must preserve exact request parameters (headers, data, json, timeout, stream, content) to avoid altering unintended calls.
  - Mock latency sleeps before returning; a zero-duration sleep still applies asyncio.sleep() and yields control, not a no-op.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
