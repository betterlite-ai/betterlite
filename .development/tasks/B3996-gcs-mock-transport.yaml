    why: Three nested auth method mocks storing originals and returning fixed literal token values.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gcs_bucket/gcs_bucket_mock_client.py#L34-L34
    why: Factory-generated POST handler and should_use_gcs_mock binding.
dod:
  - text: >-
      GCS mock GET requests to storage.googleapis.com return 200 with a complete mock StandardLoggingPayload
      JSON (all fields present, zero costs, mock IDs), while other URLs pass through to the real handler
      unchanged. DELETE returns 204 with empty body, also mocking only storage.googleapis.com. POST returns
      {"kind": "storage#object", "name": "mock-object"} at 200. Mock latency resolves from
      GCS_MOCK_LATENCY_MS environment variable or defaults 150 milliseconds, applied uniformly to all handlers.
    proof: [behavior-tests, oracle, http-corpus]
  - text: >-
      Auth mocks (_ensure_access_token_async, _ensure_access_token, _get_token_and_url) return the
      literal fixed values ("mock-gcs-token", "mock-project-id", "https://storage.googleapis.com") once
      installed. Installation is idempotent via hasattr guard; patching happens at module initialization
      when should_use_gcs_mock or create_mock_gcs_client is first called. Patches apply globally to
      VertexBase class, affecting all instances when GCS_MOCK environment variable is set.
    proof: [behavior-tests, oracle, auth-corpus]
  - text: >-
      GCS_MOCK environment variable activates global monkeypatching of AsyncHTTPHandler.get, AsyncHTTPHandler.delete,
      and VertexBase auth methods at module initialization time. Fallthrough for non-mocked URLs and missing
      original handlers raises RuntimeError rather than silently succeeding. Idempotent guards prevent re-patching
      on multiple initialization calls.
    proof: [behavior-tests, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Mock GET/DELETE must intercept only GCS URLs, return exact canned payloads and respect configured latency.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_mock::tests::/) - test(/::replays_corpus$/)'
    - id: auth-corpus
      why: Auth mocks must be installed once and return fixed literal values without network calls.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/http_case/gcs-mock-auth-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3996::tests::replays_corpus$/)'
    - id: http-corpus
      why: The HTTP case decoder must replay GET/DELETE mock cases with fallthrough assertions.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/logging/gcs-mock/)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^http::tests::replays_the_http_case_corpus$/)'
