id: B3996
title: Supply GCS mock transport and authentication behavior
description: >-
  Provide injectable GCS mock HTTP and auth behavior for the logger's GCS_MOCK branch, including
  fallthrough to the real client for other URLs. Implement GET and DELETE handlers that intercept
  storage.googleapis.com URLs with 150ms default latency simulation, returning canned responses:
  GET returns 200 with a complete StandardLoggingPayload JSON object, DELETE returns 204 No Content
  with empty body. Mock Vertex AI auth methods (_ensure_access_token_async, _ensure_access_token,
  _get_token_and_url) to return fixed values ("mock-gcs-token", "mock-project-id",
  "https://storage.googleapis.com") when enabled, allowing testing without real credentials.

  Compose the mocks with B191's factory-generated POST handler through MockClientConfig contract
  returning {"kind": "storage#object", "name": "mock-object"} at 200 status with default 150ms
  latency. Wire through should_use_gcs_mock and create_mock_gcs_client called at instance
  initialization. Keep all mock state instance-owned with idempotent guards (_mocks_initialized
  flag, hasattr checks) to prevent multiple patch attempts. Read GCS_MOCK_LATENCY_MS environment
  variable at initialization, defaulting to 150ms. Non-GCS URLs fall through to the real HTTP
  client without modification.

  Count: 165 implementation lines from litellm/integrations/gcs_bucket/gcs_bucket_mock_client.py.
