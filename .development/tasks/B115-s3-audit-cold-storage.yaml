    why: async_log_audit_log_event, the element it builds, the shared queue, the batch-size flush and its error line.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L469-L483
    why: Model events, for contrast, append through _async_log_event_base and never flush on size.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L163-L212
    why: The override argument, its masked debug line and how it replaces s3_callback_params as the parameter source.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L232-L243
    why: Flush interval and batch size come only from constructor arguments, never from the params dict.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L775-L786
