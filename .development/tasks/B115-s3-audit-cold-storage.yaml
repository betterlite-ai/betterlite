    why: The caller that builds the dedicated audit logger when s3_audit_callback_params is non-null.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L3551-L3562
