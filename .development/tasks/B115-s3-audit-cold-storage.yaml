    why: get_active_custom_logger_for_callback_name takes the first active logger of the mapped class and raises when there is none.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/custom_logger_registry.py#L188-L195
    why: The name-to-class map raises KeyError for names it lacks; only s3_v2 maps to S3Logger (L100).
dod:
  - text: An audit record becomes one element with the audit_logs/ key at the logger's granularity, the HH-MM-SS_<id> file name, the audit-<id>.json download name and the record as payload, with "unknown" for an absent or null id.
    proof: [audit-tests, oracle, new-cases, helper-python]
  - text: Audit elements share the model-event queue, and the one that brings the queue to batch_size flushes it at once while model events never do; errors log "S3 audit log error" and never reach the caller.
    proof: [audit-tests]
  - text: The dedicated audit logger takes every parameter from the audit source, an empty one included, keeps the default flush interval and batch size, and runs its own queue and flush loop until shutdown without entering the catalog.
    proof: [audit-tests, oracle, new-cases, helper-python]
  - text: The s3_v2 logger reports its path and current granularity as its cold-storage target, other loggers report none, and CatalogColdStorage gives None without a name and the default target for a name with no s3_v2 logger built.
    proof: [locator-tests]
  - text: New helper corpus seeds call b115 and replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: audit-tests
      why: the audit element, the shared queue, the size flush, the error line or the dedicated logger differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^s3_audit::/)'
    - id: locator-tests
      why: the cold-storage target or the locator answers differ from LiteLLM, or the trait change broke the s3_v2 logger or the trait's own tests
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^cold_storage_locator::/)' && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E '(test(/^s3_batch::/) | test(/^registry::catalog::s3_v2::/) | test(/^callback_logger::/)) - test(/replays_the_/)'
    - id: new-cases
      why: no new S3 audit case exists on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/s3-audit-logs)"
    - id: helper-python
      why: the b115 adapter is missing or fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b115)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b115 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b115/pyrightconfig.json
    - id: helper-case-corpus
      why: b115 needs fresh seeds that replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/s3-audit-logs-*")" && grep -lE '^[[:space:]]+b115:' tools/oracle/fuzz/corpus/helper_case/s3-audit-logs-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/s3-audit-logs/day-partition-key.yaml
  - tools/oracle/cases/helpers/s3-audit-logs/hour-partition-key.yaml
  - tools/oracle/cases/helpers/s3-audit-logs/env-hour-granularity.yaml
  - tools/oracle/cases/helpers/s3-audit-logs/no-s3-path.yaml
  - tools/oracle/cases/helpers/s3-audit-logs/override-path-wins.yaml
  - tools/oracle/cases/helpers/s3-audit-logs/empty-override-ignores-global.yaml
  - tools/oracle/cases/helpers/s3-audit-logs/id-with-slash-and-colon.yaml
  - tools/oracle/cases/helpers/s3-audit-logs/null-before-and-updated-values.yaml
deviations: []
out_of_scope:
  - "S3Logger.__init__, async_log_success_event, async_log_failure_event, _async_log_event_base and the catalog build of the s3_v2 logger: B3994, whose callback-logger check covers them."
  - "_init_s3_params, resolve_partition_granularity and create_s3_batch_logging_element: B3992. _s3_error_code, _is_terminal, the signing, the uploads and the cold-object download: B3993; upload_data_to_s3 has no caller at the pin. The batch flush, the upload limiter, the batch-file grouping and S3BatchUploadError: B3994."
  - "Choosing the dedicated logger when litellm_settings.s3_audit_callback_params is non-null, caching it, parsing the dict into a Source, building StandardAuditLogPayload and dispatching records to audit_log_callbacks: B2330 and B065."
  - "Building the cold-storage key and stamping it into the metadata: B9520. Loading litellm_settings.cold_storage_custom_logger and handing it with the catalog to CatalogColdStorage: B1729 loads it, and B8742 wires it at startup (one line in app/callbacks.rs)."
  - "Calling log_audit_event through Arc<dyn CallbackLogger>: B065 adds async_log_audit_log_event to CallbackLogger and the s3_v2 logger forwards it to log_audit_event."
pitfalls:
  - "Only audit records flush on batch_size; async_log_success_event and async_log_failure_event only append, so a size check added to the shared queue push would change model-event timing."
  - "The audit file name is %H-%M-%S of the call's UTC time plus the id, with no time- prefix and no microseconds, unlike the time-...-%f name of model events."
  - "audit-<id>.json skips object_download_filename's sanitizing and bounding, so an id with a slash keeps it in the download name while the object key turns it into an underscore."
  - "s3_batch_size and s3_flush_interval inside s3_audit_callback_params or s3_callback_params change nothing, since LiteLLM reads them only as constructor arguments; the dedicated logger runs with 512 and 10 seconds unless DEFAULT_S3_BATCH_SIZE or DEFAULT_S3_FLUSH_INTERVAL_SECONDS is set."
  - "An empty s3_audit_callback_params is not the same as none: it builds the dedicated logger with no bucket or path from s3_callback_params at all."
  - "The dedicated audit logger must stay out of the catalog, or the cold-storage locator and the callback lists would find it in place of the normal s3_v2 logger."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
