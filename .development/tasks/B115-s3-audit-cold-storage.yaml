id: B115
title: Queue audit records on the s3_v2 logger, build the dedicated audit logger and locate the cold-storage target
description: >-
  B3990 to B4004 build the storage, queue and SIEM loggers, and B3994 builds the s3_v2 logger itself: its constructor in registry/catalog/s3_v2.rs, its model-event queue and its flush loop. Three pieces of s3_v2.py and its callers are still nobody's. S3Logger.async_log_audit_log_event (s3_v2.py L485-L512) turns an audit record into an S3 object under audit_logs/ on the same queue as model events. management_helpers/audit_logs.py L64-L92 builds a second, dedicated S3Logger from litellm.s3_audit_callback_params, and B2330 and B065 call that constructor without owning it. And when litellm.cold_storage_custom_logger is set, the cold-storage key generator reads the active s3_v2 logger's s3_path and partition granularity (litellm_logging.py L6074-L6089); B9520 builds the key and its ColdStorageLocator seam, and the locator that reads the logger is here. This task builds those three. It registers no route.


  Read B3994's logger first: crates/betterlite-logging/src/s3_batch.rs, its folder and registry/catalog/s3_v2.rs. New code goes in crates/betterlite-logging/src/s3_audit.rs with s3_audit/ (element.rs, dedicated.rs, tests.rs) and crates/betterlite-logging/src/cold_storage_locator.rs with cold_storage_locator/ (tests.rs). The skeleton declares both modules in lib.rs; don't edit lib.rs, s3_batch.rs or registry/catalog.rs.


  The audit element. `audit_element(s3_path: &str, granularity: PartitionGranularity, audit_log: &Json, now: DateTime<Utc>) -> Result<S3BatchLoggingElement<Json>, AuditElementError>` is pure and is what the oracle helper calls. The record must be a JSON object, otherwise AuditElementError. Its id is the text under "id", and "unknown" when the key is absent or null (audit_log.get("id", "unknown")); any other id type is an error. s3_object_key is B3990's `object_key(s3_path, "audit_logs/", now as naive UTC, "<%H-%M-%S of now>_<id>", granularity)`, s3_object_download_filename is "audit-<id>.json" exactly as built (not B3990's object_download_filename), payload is the record unchanged, body None, content type Json and retrying_since None.


  The audit entry point. `log_audit_event<Audit: Serialize>(&self, audit_log: &Audit, now: DateTime<Utc>)` is an inherent async method on B3994's logger, written in s3_audit. It serializes the record to Json, builds the element with the logger's s3_path (empty when unset) and the granularity its partition cache resolves (B3992's PartitionGranularityCache, the same cache create_batch_element uses), and appends it to the logger's own queue, so audit records share batch_size, max_queue_size, the flush loop, retries and batch-file grouping with model events. When the queue length is then at least batch_size it runs the queue's flush right away, the same flush the timer runs (CustomBatchLogger.flush_queue, under the flush lock). Any error is logged at error level as "S3 audit log error: <error>" and the method returns; it never fails the caller and never calls handle_callback_failure. Model events stay as B3994 built them: they only append, and only the timer flushes them. If B3994's queue payload type can't hold a JSON object, stop and report it as a blocker rather than adding a second queue.


  The dedicated logger. `build_audit_logger(inputs: &CatalogInputs, audit_source: &Source<..>) -> Result<Arc<..>, CatalogError>` in s3_audit/dedicated.rs builds the logger LiteLLM makes with S3Logger(s3_callback_params_override=litellm.s3_audit_callback_params). It resolves parameters with B3992's resolve_s3_parameters(defaults, global, Some(audit_source), env), passing the constructor defaults and the global source B3994's catalog build reads, so the audit source wins completely and an empty one ({}) still ignores s3_callback_params. Then it goes through the same constructor B3994's registry/catalog/s3_v2.rs uses, so the logger gets its own queue, upload limiter, HTTP client and flush loop on inputs.tracker, stopped by inputs.shutdown. Flush interval and batch size stay at the constructor defaults, DEFAULT_S3_FLUSH_INTERVAL_SECONDS (10) and DEFAULT_S3_BATCH_SIZE (512), since LiteLLM never reads s3_flush_interval or s3_batch_size from either params dict. It is not stored in the LoggerCatalog, so the normal s3_v2 logger stays the one callback lists and the cold-storage lookup see. Log "in init s3 logger (audit override) - <source>" at debug with the source's Debug output, whose credential fields are SecretString and print redacted. A failed build returns CatalogError::Init and logs nothing more here: B2330 and B065 own the audit callback cache, the check that s3_audit_callback_params is non-null and the parsing of that dict into a Source.


  The cold-storage target. In crates/betterlite-logging/src/callback_logger.rs add one default method to B8740's CallbackLogger trait, `fn cold_storage_target(&self) -> Option<ColdStorageTarget> { None }`, with B9520's ColdStorageTarget. In the file holding B3994's `impl CallbackLogger` for the s3_v2 logger, override it to return the logger's s3_path (empty when unset) and the granularity its partition cache resolves now, so an env change to S3_PARTITION_GRANULARITY shows up as it does in LiteLLM. No other logger overrides it: LiteLLM's CustomLoggerRegistry maps only "s3_v2" to S3Logger, so every other name raises KeyError inside the try and keeps the defaults. In cold_storage_locator.rs, `CatalogColdStorage::new(logger_name: Option<String>, catalog: Arc<LoggerCatalog>)` implements B9520's ColdStorageLocator: no name gives None; a name gives Some of `catalog.existing(name)`'s cold_storage_target(), or ColdStorageTarget::default() (empty path, day) when nothing is built under that name or the logger has no target.


  Oracle cases in tools/oracle/cases/helpers/s3-audit-logs/ use the b115 helper. The Python side runs inside asyncio.run: it sets litellm.s3_callback_params from the case, replaces the datetime name in litellm.integrations.s3_v2 with a datetime subclass whose now() returns the case's instant, builds S3Logger(s3_callback_params_override=...) when the case gives an override and S3Logger() otherwise, awaits async_log_audit_log_event with the case record, and answers with payload, s3_object_key and s3_object_download_filename of the last queued element; then it cancels the logger's flush task and restores both globals. The Rust side resolves the parameters with resolve_s3_parameters from the same sources, resolves the granularity through a PartitionGranularityCache with the case env and calls audit_element. Cases: day-partition-key (s3_path team-logs, now 2026-03-04T05:06:07Z, id a1, so "team-logs/audit_logs/2026-03-04/05-06-07_a1.json" and "audit-a1.json"), hour-partition-key, env-hour-granularity (S3_PARTITION_GRANULARITY=hour), no-s3-path, override-path-wins (global s3_path global-logs, override s3_path audit-logs), empty-override-ignores-global, id-with-slash-and-colon (id "key/1:x" is key_1_x in the key but stays as is in the download name) and null-before-and-updated-values. Add a helper corpus seed per case under tools/oracle/fuzz/corpus/helper_case/s3-audit-logs-*.


  Native tests. s3_audit/tests.rs, against B3994's logger with a recording uploader or a local mock S3 and a paused clock: an audit record below batch_size waits for the timer, the one that reaches batch_size flushes at once, a model event that reaches batch_size does not, audit and model elements land in one queue in arrival order, a record that isn't an object logs the error and leaves the queue unchanged, and the dedicated logger keeps its own queue, uses the audit source's bucket and path and stops its flush loop on shutdown. cold_storage_locator/tests.rs covers no name, a name with nothing built, a name whose logger keeps the default (a catalog-built logger other than s3_v2), and a built s3_v2 logger with path and hour granularity, including a granularity change through the env between two calls.


  Startup wiring is B8742's: its start(state) builds CatalogColdStorage with this task's public constructor `CatalogColdStorage::new(cold_storage_custom_logger, catalog)`. Nothing here changes a response a client sees, so there are no HTTP cases.
scope:
  paths:
    - crates/betterlite-logging/src/s3_audit.rs
    - crates/betterlite-logging/src/s3_audit/**
    - crates/betterlite-logging/src/cold_storage_locator.rs
    - crates/betterlite-logging/src/cold_storage_locator/**
    - crates/betterlite-logging/src/callback_logger.rs
    - crates/betterlite-logging/src/s3_batch/**
    - tools/oracle/cases/helpers/s3-audit-logs/**
    - "tools/oracle/fuzz/corpus/helper_case/s3-audit-logs-*"
    - tools/oracle/helpers/b115.py
    - tools/oracle/helpers/b115/**
    - tools/oracle/src/helpers/logging/b115.rs
    - tools/oracle/src/helpers/logging/b115/**
  lint_tables: false
