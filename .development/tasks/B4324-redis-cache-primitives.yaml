dod:
  - text: >-
      Cache key namespacing idempotently prefixes every key with namespace and colon,
      preserving None inputs and leaving already-prefixed keys unchanged.
    proof: [namespace-primitives-tests]
  - text: >-
      Redis response decoding validates bytes/str/None to int | None tuples via
      _decoded_counts, and _get_cache_logic tries JSON first then Python literal
      evaluation with proper None/exception handling.
    proof: [decode-primitives-tests]
  - text: >-
      Redis version parsing extracts major version from strings (with/without dots,
      whitespace, -rc suffixes), floats (7.0 from Valkey), integers, and defaults
      to config DEFAULT_REDIS_MAJOR_VERSION on parse failure or Unknown.
    proof: [version-parsing-tests]
  - text: >-
      Call-stack projection skips circuit-breaker guard frames while preserving
      the actual caller and grandparent names for diagnostics, handling missing
      frames and frame errors gracefully.
    proof: [stack-projection-tests]
  - text: >-
      Prometheus breaker metrics register once per instance with correct gauge/counter
      types and label dimensions; record state changes, transitions and failures,
      and no-op when prometheus_client is unavailable.
    proof: [breaker-metrics-tests]
  - text: >-
      INCRBYFLOAT with TTL sends both commands in one round trip when TTL is set,
      with separate EXPIRE only when a non-refreshing key has expired, and incrbyfloat
      alone when TTL is None.
    proof: [float-ttl-primitives-tests]
  - text: >-
      Pipeline increment helper chains increment operations with optional per-operation
      TTL values, executes the pipeline, filters float values only, and returns
      results in operation order.
    proof: [pipeline-increment-primitives-tests]
  - text: >-
      _AsyncRedisCommands protocol types all eight async operations (ping, delete,
      ttl, expire, rpush, lpop, pipeline, eval) with accurate signatures for both
      Redis and RedisCluster unions.
    proof: [async-commands-protocol-tests]
checks:
  optional: []
  commands:
    - id: namespace-primitives-tests
      why: Namespace prefixing or idempotency is broken or missing.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^cache_primitives::namespace::/)'
    - id: decode-primitives-tests
      why: JSON/literal decoding or count validation is missing or incorrect.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^cache_primitives::decode::/)'
    - id: version-parsing-tests
      why: Redis version parsing does not handle all formats or defaults.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^cache_primitives::version::/)'
    - id: stack-projection-tests
      why: Call-stack info is missing guard filtering or does not handle frame errors.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^cache_primitives::stack::/)'
    - id: breaker-metrics-tests
      why: Prometheus metrics are not registered, not recorded, or crash when client is unavailable.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^breaker_metrics::/)'
    - id: float-ttl-primitives-tests
      why: INCRBYFLOAT with TTL does not execute in one round trip or TTL handling is wrong.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^cache_primitives::float_ttl::/)'
    - id: pipeline-increment-primitives-tests
      why: Pipeline increment helper is missing, does not chain operations, or filters wrong results.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^cache_primitives::pipeline_increment::/)'
    - id: async-commands-protocol-tests
      why: _AsyncRedisCommands protocol is missing methods or has incorrect signatures.
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^cache_primitives::protocol::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - >-
    B4323 constructs Redis and Sentinel clients; B4325 binds Cluster-specific operations
    and pubsub; B4327, B4328, B4329, B4331 invoke these primitives via the _AsyncRedisCommands
    interface, and B393 calls _breaker_metrics to record circuit-breaker events.
pitfalls:
  - >-
    The _get_call_stack_info guard-name vocabulary is static; adding a new guard function
    requires updating _BREAKER_GUARD_FRAME_NAMES, not discovering guards dynamically.
  - >-
    Namespace prefixing with None returns None, so callers must handle the None case
    before calling check_and_fix_namespace if they expect a string.
  - >-
    INCRBYFLOAT with refresh_ttl=False only sends EXPIRE if TTL read returns -1 (key was
    expiring); a key that is already expired silently updates the value without resetting TTL.
  - >-
    _get_cache_logic tries JSON then literal eval, so a cached value that is valid
    literal eval but invalid JSON (e.g., a Python 3 string) will be decoded by the fallback,
    not rejected as malformed.
  - >-
    Prometheus registry import is optional; if prometheus_client is absent, _BreakerMetrics
    metrics remain None and no-op all recording calls.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
