id: B4324
title: Decode Redis values and supply cache and breaker primitives
description: >-
  Build shared cache namespacing, value and count decoding, version parsing, increment-with-floor
  Lua helpers and the breaker metric sink used below their callers. Preserve JSON-then-literal
  decoding fallback, count validation, idempotent namespace prefixes, Valkey numeric version
  handling, and INCRBYFLOAT with TTL in one round trip without enforcing atomicity.

  Decode Redis responses via _decoded_counts, validating bytes/str/None to typed ints and
  returning an optional tuple. Call-stack projection through _get_call_stack_info reads frame names
  to skip internal circuit-breaker guards and report actual callers for diagnostics; skip frames
  whose co_name is in {<lambda>, wrapper, _run_under_circuit_breaker, _run_under_circuit_breaker_sync}
  and whose __name__ matches redis_cache's module.

  Namespace prefix each key via check_and_fix_namespace, idempotently prepending the configured
  namespace and colon separator when absent. Parse redis_version from strings "7.0.0" or "v6",
  floats 7.0 (ElastiCache/Valkey), integers 7, or malformed "latest"/"Unknown" to integer major
  version, defaulting to DEFAULT_REDIS_MAJOR_VERSION from config on parse failure.

  INCRBYFLOAT with TTL: _incrbyfloat_with_ttl sends both in one pipelined round trip when TTL
  is set, otherwise incrbyfloat alone. On refresh_ttl=True, pipe EXPIRE after incrbyfloat.
  On refresh_ttl=False, pipe TTL instead, then if TTL returned -1 (key was expiring), send
  separate EXPIRE. Cache decoding via _get_cache_logic first tries json.loads, then
  ast.literal_eval on decode/parse failure, returning None on both failures.

  Pipeline increment helper _pipeline_increment_helper chains increment operations with optional
  per-operation TTL expire commands, executes the pipeline, filters and returns only float
  values (incrbyfloat results), and logs diagnostics.

  Supply _BreakerMetrics as a module-level singleton that lazily registers Prometheus metrics
  when prometheus_client is available. Register metrics with names litellm_redis_circuit_breaker_state
  (Gauge), transitions (Counter) and failures (Counter), each with label dimensions (state, state,
  failure_class). Record state changes (decrement old, increment new), transitions to a given state,
  and failures by class when breaker events occur. No-op gracefully when prometheus_client is unavailable.

  Also own the _AsyncRedisCommands protocol that types this cache's async redis operations with
  eight method signatures: ping, delete, ttl, expire, rpush, lpop, pipeline (transaction kwarg),
  eval. Declare the floor-increment Lua script constant _INCREMENT_WITH_FLOOR_LUA that atomically
  increments, floors to zero, and sets TTL; declare TypeAdapter constants _LUA_COUNT and
  _OPTIONAL_COUNTS for validating Lua and batch count responses.

  Load DEFAULT_REDIS_MAJOR_VERSION from config through B002. B393 calls _breaker_metrics.record_*
  methods; register the singleton on inject only, no reverse call to B393. Pipeline execution is
  the Redis driver's API; print_verbose is diagnostic plumbing. This task owns no route, no config
  reload, and does not call other B4320–B4331 leaves.
scope:
  paths:
    - crates/betterlite-redis/src/cache_primitives.rs
    - crates/betterlite-redis/src/cache_primitives/**
    - crates/betterlite-redis/src/breaker_metrics.rs
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/src/sections/redis_cache_primitives.rs
    - crates/betterlite-config/src/sections/redis_cache_primitives/**
    - crates/betterlite-redis/src/breaker_metrics/**
  lint_tables: false
