deviations:
- what: >-
    The price lookup fetches the Hugging Face config before the charge and reads the cached answer,
    because PriceLookup is synchronous. When default_max_lru_cache_size is 0 (caching disabled), after
    the entry was evicted, or for a charge whose prepared attempt prices a response-stated model or
    provider the prefetch did not resolve, max_tokens stays absent in the chat-mode record, where
    LiteLLM's get_model_info fetches on that call and carries max_position_embeddings.
  why: >-
    LiteLLM's cost calculator runs the cached get_model_info inline, so its lru_cache sits in front of a
    synchronous fetch. betterlite's lookup cannot start a request from a synchronous read; the fetch runs
    before the charge through B2225's cache, and a disabled, evicted or unmatched entry leaves only the
    soft record. The download itself is the same URL under the same timeout, so the 2026-10-31 decision
    records no row for it.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L5992-L6013
out_of_scope:
- >-
  B013's synchronous limits path (crates/betterlite-models/src/lookup/limits.rs), B197's base_model
  clamp and B2201's get_max_tokens callers: they hold no Hugging Face client and keep their rows. Only
  B013's first row goes, because it says the model info itself gets no max_position_embeddings.
- >-
  B2219's fetch details: the 16 MiB body cap, the single 10 second deadline and the wrong-typed
  max_position_embeddings mapping keep their rows and their tests.
- >-
  B845's deployment model info: it reads Hugging Face metadata through the shared resolver with a
  caller-supplied ModelInfoClient and does not wait on this task.
- >-
  The oracle registry files (tools/oracle/src/helpers/core_ops/lib.rs and
  tools/oracle/helpers/dispatch.py) and the stub op; the skeleton writes them.
- >-
  Any second Hugging Face client, a request-time fetch from the synchronous lookup, and a new HTTP
  oracle case: the route-reachable behavior is the price lookup, which the helper cases already drive
  through the same CatalogLookup the charge uses.
pitfalls:
- >-
  The oracle helper for this task is pre-registered as b9966 in the core_ops group. Replace the stub Op
  in tools/oracle/src/helpers/core_ops/b9966.rs with an impl Helper whose Input is the typed input, and
  write run in tools/oracle/helpers/b9966.py. The registry files
  (tools/oracle/src/helpers/core_ops/lib.rs and tools/oracle/helpers/dispatch.py) are not this task's to
  edit.
- >-
  The cache key is the pair names_for returns, not the billing strings. Prefetching billing.model with no
  provider would store under a different key than call_price queries, and a supplied provider prefix
  would be stored with the prefix still attached.
- >-
  Do not put the cache.put before the fetch or store a record whose max_tokens is None. On main the
  refusing client answers the soft record, and caching it would hide a later successful fetch for the
  whole process lifetime.
- >-
  Do not hold the keys mutex across the prefetch await. A future holding a std MutexGuard is not Send,
  and the charge futures run on the server's workers.
- >-
  huggingface_model_info stays the source of the soft record. Do not rebuild the ModelInfoBase field list
  in betterlite-core, and do not answer None when the synchronous helper pends, because the charge would
  turn an unmapped model into an UnknownModel error on a cache miss.
- >-
  send_following follows redirects with each hop re-checked. execute_buffered does not follow a 302, and
  LiteLLM's HTTPHandler does; a 302 answer must not fail the fetch.
- >-
  The body limit is self.limits.body_bytes, not HF_CONFIG_BODY_LIMIT copied by hand.
  TransportLimits::DEFAULT.body already equals that byte count, and a caller-built request must keep
  body_limit and the client's configured limit in step.
- >-
  The server test's map client counts requests, so a second prefetch that bypasses the cache shows up as
  an extra count; the oracle case compares counts for the same reason.
- >-
  Patch litellm.module_level_client.get, not a class the handler was built from.
  _get_max_position_embeddings resolves the attribute on litellm.module_level_client at call time.
- >-
  Clear litellm.utils._cached_get_model_info_helper before each oracle case, or the second case reads
  the first case's record and its fetch count.
- >-
  The mapped-model oracle case ignores the record because betterlite reads the case's catalog while
  pinned LiteLLM reads its bundled map, so only the zero fetch count is comparable, and the ignore needs
  that why.
- >-
  Keep no second ProxiedClient in state/cost_service.rs. shared.http is the clone of chat.client whose
  tracker server::run drains; a fresh client leaves its requests undrained at shutdown.
- >-
  The existing Slot test constructs &Shared. It keeps whatever B8610's Shared construction requires; the
  slot-wiring check, not that test, proves the field reads.
