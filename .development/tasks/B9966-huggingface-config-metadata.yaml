id: B9966
title: Model metadata downloads the Hugging Face model config
description: >-
  Fix the no-fetch cost metadata B068 left behind. crates/betterlite-core/src/cost/completion/lookup.rs
  holds CatalogLookup with `hf: HfConfigClient<NoHfConfig>`; NoHfConfig answers Err from every
  ModelInfoClient::get, resolved polls get_model_info_helper with now_or_never(), and an unmapped
  huggingface model therefore prices from huggingface_model_info(model, None): a chat-mode record with
  max_tokens None. LiteLLM downloads the config instead. _get_max_position_embeddings (utils.py
  L5847-L5867) GETs https://huggingface.co/{model}/raw/main/config.json through litellm.module_level_client
  with HF_CONFIG_FETCH_TIMEOUT_SECONDS and returns max_position_embeddings, and get_model_info's
  huggingface branch (L5992-L6013) answers ModelInfoBase with that value; every fetch failure returns None,
  so a 404, a timeout, a bad body or a missing field leaves max_tokens absent and the rest of the record
  unchanged. get_model_info is lru_cached (L5870-L5885) on (model, custom_llm_provider, api_base), and the
  cost calculator calls the cached helper with the provider it used for pricing (cost_calculator.py L351,
  L746). Max decided on 2026-10-31 that betterlite downloads what LiteLLM downloads from the same place, so
  this task records no deviation row for the download itself. B2219 already built HF_CONFIG_TIMEOUT_SECONDS
  (10.0), HF_CONFIG_BODY_LIMIT (16 MiB), HF_CONFIG_BASE_URL, CONFIG_PATH, decode_hf_model_config,
  huggingface_model_info and HfConfigClient<Client>::max_position_embeddings in
  crates/betterlite-models/src/model_metadata_resolution/hf_config.rs; that file changes only to make
  huggingface_model_info public.


  The seam. PriceLookup is synchronous and every charge reads it through &dyn PriceLookup, while B2225's
  get_model_info_helper_cached (crates/betterlite-models/src/full_model_metadata.rs) is async and already
  mirrors LiteLLM's lru_cache over (model, custom_llm_provider, api_base), with ModelInfoCache::new(size)
  where a size of zero or less disables caching. So the fetch runs before the charge and the synchronous
  read consumes the cached answer; now_or_never() is never expected to complete a real ProxiedClient
  request, and no second fetch path is added.


  Rust changes in betterlite-core. CatalogLookup becomes `CatalogLookup<Client = NoHfConfig>` with a
  `cache: ModelInfoCache` field. Keep `impl CatalogLookup<NoHfConfig> { pub fn new(model_cost, settings) }`
  as the catalog-only constructor with the refusing client and ModelInfoCache::new(0), so the oracle
  response_charge frame and every existing test compile unchanged. Add
  `pub fn with_model_info(model_cost: &[u8], settings: LookupSettings, hf: HfConfigClient<Client>,
  cache: ModelInfoCache) -> Result<Self, LookupError>` on `impl<Client: ModelInfoClient> CatalogLookup<Client>`;
  new delegates to it. Add
  `pub async fn prefetch_model_info(&self, model: &str, custom_llm_provider: Option<&str>, region_name:
  Option<&str>)`: resolve the names with the new `names_for` below, build MetadataEnvironment the way
  resolved does, and await get_model_info_helper_cached with HelperQuery { model: names.model,
  custom_llm_provider: Some(names.provider), api_base: None }, &NoDynamicMetadata and a local
  ModelCostKeys::default(). Every error, including the name resolution, is swallowed, like LiteLLM's
  `except Exception: return None`; do not hold self.keys across the await. Make resolved check
  self.cache.find(model, provider, None) first and serialize the ModelInfo handle with
  serde_json::value::to_raw_value. When the cache misses, keep the current synchronous helper call, and
  when it does not complete and provider is Some("huggingface"), answer
  huggingface_model_info(model, None).ok(): a real transport pends until the prefetch filled the cache,
  and a disabled or evicted cache must leave the soft record the main branch answers today instead of
  turning an unmapped model's charge into an UnknownModel error. The four trait impls on the lookup gain
  the same `Client: ModelInfoClient` parameter and keep their methods: PriceLookup in lookup.rs,
  ModelResolver and ProviderInference in resolver.rs, and ToolPriceSource in tool_source.rs;
  effective_model_info and effective_priced_model read resolved as they do now.


  Name selection. The cache key the price path will query is not the raw billing pair. model_names::select
  (crates/betterlite-core/src/cost/call_price/model_names.rs) collapses a supplied provider prefix, picks
  the catalog key, and resolves the provider slug when none is supplied, and call_price then asks
  effective_model_info(chosen_model, Some(provider)). Extract the body into
  `pub fn names_for(model: &str, custom_llm_provider: Option<&str>, region_name: Option<&str>, lookup:
  &dyn PriceLookup, resolution: &ResolutionContext<'_>) -> Result<ModelNames, CallPriceError>` and have
  select call it with env.lookup and env.resolution, so the prefetch uses the same function rather than a
  copy. No other file in the pricing path changes.


  Rust changes in betterlite-models. Add `pub fn find(&self, model: &str, custom_llm_provider:
  Option<&str>, api_base: Option<&str>) -> Option<ModelInfoHandle>` to ModelInfoCache
  (full_model_metadata/cache.rs), building the existing CacheKey. Make huggingface_model_info pub in
  hf_config.rs. Nothing else in full_model_metadata or hf_config changes.


  Rust changes in betterlite-http. The skeleton creates crates/betterlite-http/src/proxy/model_info.rs
  empty and adds `pub mod model_info;` to crates/betterlite-http/src/proxy.rs; write the module there.
  `impl ModelInfoClient for ProxiedClient` with `type Error = ModelInfoFetchError`, an error enum
  (ModelInfoFetchError, variants Url(url::ParseError), HeaderName { name: String }, Transport(#[from]
  TransportError)). get builds a HeaderMap from request.headers (HeaderName::from_static on the
  &'static str, HeaderValue::from_str on the SecretString with ExposeSecret), parses request.url, builds
  `OutboundRequest { method: Method::GET, url, query: Vec::new(), headers, body: RequestBody::Empty,
  deadline: request.timeout }`, calls self.send_following(outbound).await (the path B173 documents as
  following provider redirects with each hop re-checked, so a Hugging Face redirect behaves like
  LiteLLM's module_level_client), then .buffered(self.limits.body_bytes).await. Convert the HeaderMap to
  (name, value) string pairs, skipping a value that is not UTF-8, and answer
  FetchResponse::new(status, pairs, body); TransportLimits::DEFAULT.body equals HF_CONFIG_BODY_LIMIT.
  Keep the module within the 300-line source limit.


  Rust changes in betterlite-server. CostService becomes `CostService<Formulas, Client = ProxiedClient>`
  and holds `lookup: CatalogLookup<Client>`; its constraints gain `Client: ModelInfoClient + 'static`.
  new takes `hf: HfConfigClient<Client>` and `cache: ModelInfoCache` after the existing arguments and calls
  CatalogLookup::with_model_info. Add a private `async fn prefetch_model_info(&self, billing:
  &CompletionBillingInput<'_>)` that returns at once when billing.model is None and otherwise awaits
  self.lookup.prefetch_model_info(model, billing.custom_llm_provider, billing.region_name). Call it after
  self.bound(...) and before the calculator in completion_cost (cost_service.rs) and in response_cost
  (cost_service/response.rs, which gains the same Client parameter), so the clock reading keeps its place
  in the request. In
  state/cost_service.rs, Slot::new reads `shared.http`, builds `HfConfigClient { client:
  shared.http.clone(), base_url: HF_CONFIG_BASE_URL.to_owned() }` and
  `ModelInfoCache::new(config.sections.full_model_metadata.default_max_lru_cache_size)`, and passes both to
  CostService::new. That is B8610's field, the clone of chat.client whose tracker server::run drains; build
  no second ProxiedClient. Slot stays `Result<CostService<ProviderFormulas>, SlotError>` through the
  default type parameter. This is the only production construction of a Hugging Face client: the
  synchronous limits lookup (crates/betterlite-models/src/lookup/limits.rs), B197's base_model clamp and
  B2201's get_max_tokens callers hold no client and are not changed.


  Tests. Core: crates/betterlite-core/src/cost/completion/tests/lookup.rs gets a MapHf implementing
  ModelInfoClient over a BTreeMap<String, Vec<u8>> keyed by URL with a Mutex<Vec<String>> of requested
  URLs, plus a PendingHf whose get returns std::future::pending() and reuses NoHfConfig for the refusing
  case. A fixture builds CatalogLookup::with_model_info from a small cost map and
  HfConfigClient { client, base_url: HF_CONFIG_BASE_URL.to_owned() } with ModelInfoCache::new(64). Tests:
  prefetch_fills_hf_metadata (max_tokens 4096, litellm_provider huggingface, mode chat),
  refusing_transport_stays_soft (the record exists with max_tokens None),
  pending_transport_answers_soft (the synchronous read answers the same soft record, no error),
  second_prefetch_hits_cache (one request for two prefetches and both reads answer 4096),
  mapped_model_needs_no_fetch (a catalog model answers its static record and the client records no
  request). Cache: full_model_metadata/tests.rs gets find_reads_a_cached_entry (put through the cached
  helper or put, find answers the same handle for the same key, None for another key) and
  find_skips_a_disabled_cache (ModelInfoCache::new(0) answers None). Transport:
  proxy::model_info::tests uses the pub(crate) serve helper in proxy/tests.rs and default_client():
  get_maps_the_response (status, a lowercased header, body), get_sends_the_request_headers (the recorded
  request head carries the supplied header and a GET line), get_uses_the_request_deadline (a server that
  delays past request.timeout answers ModelInfoFetchError::Transport(Deadline)), get_follows_a_redirect
  (a 302 Location answer loops to TransportError::TooManyRedirects, which proves hops are followed rather
  than returned). Server: cost_service/tests.rs builds
  CostService::new(..., refusing_hf(), ModelInfoCache::new(0)) in the existing service helper, and adds
  charge_prefetches_hf_metadata (an unmapped org/model with custom_llm_provider huggingface through
  completion_cost charges zero and effective_model_info then answers max_tokens 4096) and
  charge_caches_the_config (two charges make one client request). The existing
  the_slot_builds_the_shared_service_from_the_bundled_catalog test keeps whatever Shared construction
  B8610 left it; the slot-wiring check proves the field reads.


  Oracle helper. The skeleton registers this task's helper operation b9966 in the core_ops group and adds
  tools/oracle/src/helpers/core_ops/b9966.rs and tools/oracle/helpers/b9966.py to the scope; replace the
  stub Op in the Rust file with the typed input and impl Helper, and write run in the Python file. Input:
  catalog (raw cost map object), model (string), provider (string or null), lookups (1 or 2), and answers
  (a list of {status: u16, body: string or null} tried in order, the last answer repeating). The Rust
  adapter builds a CatalogLookup with with_model_info over a map client that answers those statuses and
  bodies in order and counts requests, awaits prefetch_model_info(model, provider, None) lookups times,
  reads effective_model_info(model, provider), and answers {record: record or null, fetches: count}. The
  Python adapter patches litellm.module_level_client.get with a typed callable object holding the answers:
  it returns an object whose json() decodes the body and whose raise_for_status() raises for a non-2xx
  status, the way httpx does, and it counts calls. Clear
  litellm.utils._cached_get_model_info_helper.cache_clear() before each case, call
  litellm.utils._cached_get_model_info_helper(model=model, custom_llm_provider=provider) once per
  lookup, and answer the same {record, fetches} shape, where record is the returned Mapping. Patch the
  attribute on litellm.module_level_client, not on the imported httpx module. Cases under
  tools/oracle/cases/helpers/huggingface-config-metadata: config-supplies-max-tokens (200 with
  {"max_position_embeddings": 4096}), config-without-the-field (200 with {"hidden_size": 768}),
  config-fetch-fails (404), second-lookup-hits-the-cache (lookups 2, one fetch), and
  mapped-model-never-fetches (catalog holds gpt-4o, provider null, record ignored with a why that says
  betterlite reads the case catalog while pinned LiteLLM reads its bundled map, fetches must be 0). Add
  the seed tools/oracle/fuzz/corpus/helper_case/b9966-config-supplies-max-tokens.yaml. The helper module
  and Python file are the skeleton's; tools/oracle/src/helpers/core_ops/lib.rs and
  tools/oracle/helpers/dispatch.py are not this task's to edit.


  Deviations. Delete the first row of docs/deviations/B013.yaml, the one that says a huggingface model
  gets no max_position_embeddings, and leave the provider-inference row. docs/deviations/B197.yaml and
  docs/deviations/B2201.yaml keep their rows: their synchronous clamp and get_max_tokens paths still hold
  no client. Write docs/deviations/B9966.yaml with the row in deviations below. Size: about 100 changed
  production lines in betterlite-core, 15 in betterlite-models, 100 in betterlite-http, 70 in
  betterlite-server, about 240 lines across the two oracle adapters, and 6 lines in the deviation files;
  tests, oracle cases and the fuzz corpus sit outside the changed-line budget.
