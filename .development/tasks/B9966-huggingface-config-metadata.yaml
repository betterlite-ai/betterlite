dod:
- text: >-
    A prefetch through a map-backed client makes the price lookup answer max_tokens 4096 with
    litellm_provider huggingface and mode chat for an unmapped huggingface model, and a refusing client
    answers the same record with max_tokens None.
  proof: [hf-lookup-tests, oracle]
- text: >-
    The prefetched answer is cached like LiteLLM's lru_cache: a second prefetch fetches once, a
    catalog-mapped model never fetches, and a transport that cannot answer during a synchronous read
    answers the soft record instead of an error.
  proof: [hf-lookup-tests, hf-cache-tests]
- text: >-
    The cost service builds its Hugging Face client from Shared.http with HF_CONFIG_BASE_URL and the
    configured default_max_lru_cache_size, builds no second ProxiedClient, and both async charge entries
    prefetch model info before they price.
  proof: [hf-service-tests, slot-wiring]
- text: >-
    The shared outbound client answers a ModelInfoClient request as a GET carrying the request's headers,
    timeout and redirect hops, bounded by the transport body limit, and maps the status, headers and body
    back into a FetchResponse.
  proof: [hf-transport-tests]
- text: >-
    Oracle cases compare the price lookup's record and fetch count with LiteLLM's cached helper under the
    same config answers: a supplied value, a missing field, a 404, a cached second lookup and a mapped
    model that never fetches.
  proof: [oracle, helper-cases, helper-python, helper-case-corpus]
- text: >-
    docs/deviations/B013.yaml no longer says a huggingface model gets no max_position_embeddings, and
    docs/deviations/B9966.yaml records the cache-dependent miss with its pinned link.
  proof: [deviation-row]
checks:
  optional: []
  commands:
  - id: hf-lookup-tests
    why: The prefetch seam is missing, a fetch happens where LiteLLM does not fetch, or the synchronous read errors instead of answering the soft record.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-core/src/cost/completion/tests/lookup.rs)"
      && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^cost::completion::tests::lookup::(prefetch_fills_hf_metadata|refusing_transport_stays_soft|pending_transport_answers_soft|second_prefetch_hits_cache|mapped_model_needs_no_fetch)$/)'
  - id: hf-cache-tests
    why: The cache read seam is missing or a disabled cache answers an entry.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-models/src/full_model_metadata/cache.rs)"
      && cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^full_model_metadata::tests::(find_reads_a_cached_entry|find_skips_a_disabled_cache)$/)'
  - id: hf-transport-tests
    why: The ProxiedClient ModelInfoClient impl is missing or sends the wrong request.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-http/src/proxy/model_info.rs)"
      && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^proxy::model_info::tests::/)'
  - id: hf-service-tests
    why: The cost service does not prefetch, or it fetches again for a cached model.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-server/src/cost_service.rs)"
      && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cost_service::tests::(charge_prefetches_hf_metadata|charge_caches_the_config)$/)'
  - id: slot-wiring
    why: The production slot still builds a refusing client, or reads a fresh client or a hardcoded cache size.
    run: >-
      grep -qF 'shared.http' crates/betterlite-server/src/state/cost_service.rs
      && grep -qF 'default_max_lru_cache_size' crates/betterlite-server/src/state/cost_service.rs
      && grep -qF 'HF_CONFIG_BASE_URL' crates/betterlite-server/src/state/cost_service.rs
      && ! grep -qF 'ProxiedClient::' crates/betterlite-server/src/state/cost_service.rs
  - id: helper-cases
    why: No new helper case exists on this branch.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/huggingface-config-metadata)"
  - id: helper-python
    why: The oracle adapters fail strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
      --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: The b9966 seed is missing or the shared helper corpus does not replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/b9966-*")"
      && grep -lq 'b9966' tools/oracle/fuzz/corpus/helper_case/b9966-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: deviation-row
    why: The new deviation is missing or the old no-download row remains.
    run: >-
      grep -qF 'utils.py#L5992-L6013' docs/deviations/B9966.yaml
      && ! grep -qF 'A huggingface model gets no max_position_embeddings' docs/deviations/B013.yaml
      && grep -qF 'With no provider given, the provider is inferred' docs/deviations/B013.yaml
