    why: Owned. get_customer_user_header_from_mapping, the customer header names in list order.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L1533-L1557
    why: Owned. _get_customer_id_from_standard_headers, the two standard headers in order.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L1560-L1592
    why: Owned. _coerce_user_id_to_str and its validate_end_user_id_in_db gate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L1595-L1678
    why: Owned. get_end_user_id_from_request_body, the six checks and the nested _as_dict.
