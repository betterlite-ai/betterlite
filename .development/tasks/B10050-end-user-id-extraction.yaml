  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1902
    why: Call site with the request headers, followed by B880's database validation.
dod:
  - text: The standard headers come first, then the customer mappings in list order, then user_header_name only when no customer mapping names a header, then the four body sources; a call without headers skips both header steps.
    proof: [extraction-tests, oracle, helper-python]
  - text: litellm_metadata and metadata count only as objects or as strings that decode to objects, and ids are trimmed, blanks, booleans and structures skipped, and numbers written as Python writes them.
    proof: [extraction-tests, oracle, helper-python]
  - text: With validate_end_user_id_in_db on, an id whose text decodes to an object or list is skipped and malformed JSON text is kept; with it off, both are kept.
    proof: [extraction-tests, oracle, helper-python, helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: extraction-tests
      why: The end-user id lookup reads a source out of order, coerces a value differently or ignores the validation flag.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^end_user::extraction::/)'
    - id: helper-python
      why: The b10050 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10050.py tools/oracle/helpers/b10050)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10050 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/end-user-id-*")" &&
        grep -lE 'b10050"?:' tools/oracle/fuzz/corpus/helper_case/end-user-id-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-logging --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/end-user-id/header-sources.yaml
  - tools/oracle/cases/helpers/end-user-id/legacy-header-name.yaml
  - tools/oracle/cases/helpers/end-user-id/body-sources.yaml
  - tools/oracle/cases/helpers/end-user-id/json-text-validation.yaml
deviations:
  - what: A metadata or litellm_metadata string, or an id starting with { or [, longer than 1 MiB or nested past 64 levels counts as malformed, so the metadata reads as empty and the id is kept even with validation on.
    why: B192's safe_json_loads bounds every untrusted JSON string; LiteLLM's json.loads has no size bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/safe_json_loads.py#L9-L16
out_of_scope:
  - "resolve_and_validate_end_user_id and _end_user_id_exists_in_db (auth_checks.py L1981-L2083), the database check, its cache and the auth stage that calls this lookup: B880."
  - "safe_json_loads, its bounds and its fuzz target: B192. Number text: B3865's python_json. Loading user_header_mappings and user_header_name: B1104; validate_end_user_id_in_db: B1218."
  - "The internal_user header mapping and the deprecated user_header_name as forwarded user information: B1104 (betterlite-core request_headers::user_mapping)."
  - "Other functions in auth_utils.py: B054 owns the custom auth warnings (L1361-L1415), B741 and B882 the request route helpers (L621-L837), B744 the pre-DB checks and size limits (L41-L108, L562-L618, L840-L946), B745 the rate limit and output token helpers (L950-L1342), B746 the model candidates (L1731-L2083), B881 the SSO readiness checks and abbreviate_api_key (L1431-L1508, L2086-L2089), B884 the request body safety checks (L159-L559)."
  - "check_complete_credentials, get_team_model_rpm_limit, get_team_model_tpm_limit, get_project_model_rpm_limit, get_project_model_tpm_limit and is_pass_through_provider_route in auth_utils.py: no caller at the pin."
pitfalls:
  - "Starlette decodes header bytes as latin-1, so read a HeaderValue's bytes as latin-1 instead of calling to_str, which fails on any byte above 0x7e and would skip the header."
  - "Python's str.strip also removes \\x1c to \\x1f, which Rust's str::trim keeps; an id padded with them has to come out the same."
  - "The validation gate reads only the first character of the trimmed text, so ' {\"a\": 1}' is dropped once trimmed, and '[x' is kept because it does not decode."
  - "\"user\": false must skip to litellm_metadata, not become \"False\"; a bool is not a number here even though Python's bool is an int."
  - "x-litellm-customer-id wins over x-litellm-end-user-id and over every configured header, even a customer mapping."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
