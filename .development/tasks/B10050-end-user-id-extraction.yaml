id: B10050
title: End-user id from request headers and body
description: >-
  Three callers read the caller's end-user id the way LiteLLM's get_end_user_id_from_request_body does: B880's end-user auth stage, B3630's end_user_from_request_body for pass-through cost logging, and B3604's _get_user_from_metadata. Only B880 then checks the id against the database. This task builds the lookup alone, so the two logging callers no longer wait for B880's database half, and B880 calls it instead of building it.


  Layout. Module extraction under betterlite-logging's end_user module: crates/betterlite-logging/src/end_user/extraction.rs, with tests in end_user/extraction/tests.rs. The file is an empty stub that end_user.rs (B1716's module, merged) declares; nothing else in end_user changes. The home is betterlite-logging on purpose: B3604 is in betterlite-logging and betterlite-auth depends on betterlite-logging, so a module in betterlite-auth would be a crate cycle for B3604, while betterlite-auth (B880) and betterlite-server (B3630) already depend on betterlite-logging. It also reaches B192's safe_json_loads and B3865's python_json in the same crate.


  Settings. No new config section. `IdSettings<'config>` borrows B1104's `betterlite_config::sections::request_headers::Settings`, which already loads general_settings.user_header_mappings (a list of header_name and litellm_user_role, internal_user or customer, empty by default) and general_settings.user_header_name (None by default), and carries `validate_end_user_id_in_db: bool` from B1218's `sections::end_user_registry::Settings` (litellm_settings.validate_end_user_id_in_db, false by default). Callers build it from config.sections; nothing here reads a global.


  The lookup. `request_end_user_id(body: &JsonObject, headers: Option<&HeaderMap>, settings: &IdSettings<'_>) -> Option<String>`, with betterlite_models' JsonObject and http's HeaderMap, tries these sources in order and returns the first one that coerces to an id. With headers: first `standard_header_id`, which reads x-litellm-customer-id and then x-litellm-end-user-id (LiteLLM's STANDARD_CUSTOMER_ID_HEADERS) whatever is configured; then the configured headers. `customer_header_names(mappings)` returns the lowercased header_name of every customer mapping whose name is not empty, in list order; internal_user mappings are never read here. When that list is not empty, its headers are tried in order, and user_header_name is skipped even if none of them is on the request. When the list is empty, user_header_name is tried if it is not blank after trimming; the name is matched as configured, so a name with spaces around it matches no header. Without headers, both header steps are skipped, which is how the pass-through callers call it. Then the body: "user", litellm_metadata's "user", metadata's "user_id", and "safety_identifier". litellm_metadata and metadata count only as objects: an object is read as is, a string goes through safe_json_loads and counts only when it decodes to an object, and anything else, malformed text included, is an empty object. That is LiteLLM's nested _as_dict, not B884's _coerce_metadata_to_dict.


  Coercion. `coerce_user_id(value, validate)` is _coerce_user_id_to_str: null, booleans, lists and objects give None; a number gives Python's str text, taken from python_json::dumps of the number, so 7 is "7", 1.50 is "1.5" and 1e3 is "1000.0"; a string is trimmed and a blank one gives None. When validate is on and the trimmed text starts with { or [, it goes through safe_json_loads and is dropped only when that yields an object or a list; malformed text and JSON scalars stay. Header values are text and take the same string path.


  Oracle. Helper cases on the b10050 operation, one settings snapshot and a list of requests per case (body, and headers or null), answering the list of ids. The Python side sets proxy_server.general_settings to the case's user_header_mappings and user_header_name and litellm.validate_end_user_id_in_db, then calls get_end_user_id_from_request_body for each request. The Rust side builds IdSettings and a HeaderMap from the same input and calls request_end_user_id. Cases send settings of the declared types: user_header_mappings as a list of mappings with a known role.


  Tests in end_user/extraction/tests.rs: standard_headers_first, standard_header_casefold, blank_standard_header_falls_through, customer_mappings_in_order, absent_mapped_header_blocks_legacy, legacy_name_needs_text, internal_user_mapping_ignored, no_headers_skips_header_steps, body_source_order, metadata_string_object_only, numbers_use_python_text, trim_blank_bool_and_structures, json_text_dropped_when_validating and malformed_json_text_kept.
scope:
  paths:
    - crates/betterlite-logging/src/end_user/extraction.rs
    - crates/betterlite-logging/src/end_user/extraction/**
    - tools/oracle/cases/helpers/end-user-id/**
    - tools/oracle/fuzz/corpus/helper_case/end-user-id-*
    - tools/oracle/helpers/b10050.py
    - tools/oracle/helpers/b10050/**
    - tools/oracle/src/helpers/logging/b10050.rs
    - tools/oracle/src/helpers/logging/b10050/**
  lint_tables: false
references:
