checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_call::/) - test(/::replays_corpus$/)'
  - id: case-native-speech-audio
    why: the native-speech-audio behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_call::tests::native_speech_audio($|::)/)'
  - id: case-speech-bridge-audio
    why: the speech-bridge-audio behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_call::tests::speech_bridge_audio($|::)/)'
  - id: case-speech-streaming-bytes
    why: the speech-streaming-bytes behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_call::tests::speech_streaming_bytes($|::)/)'
  - id: case-speech-provider-error
    why: the speech-provider-error behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_call::tests::speech_provider_error($|::)/)'
  - id: case-speech-cancellation
    why: the speech-cancellation behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_call::tests::speech_cancellation($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/speech_call.py && uv run --locked --project tools/oracle/litellm ruff check
      tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/speech_call-*)"
      && grep -qE "^[[:space:]]+speech_call:" tools/oracle/fuzz/corpus/helper_case/speech_call-* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/speech-call)"
