id: B1084
title: Complete speech SDK dispatch
description: >-
  Own speech from its decorator through return at main.py:8237-8719 in betterlite-core::api::speech_call.
  B1083 owns aspeech and depends on this entire function. Resolve provider/model using api_base or base_url;
  remove tags from kwargs. Only non-None response_format,speed,instructions enter initial options. timeout=None
  uses litellm.request_timeout (REQUEST_TIMEOUT default 6000), but zero is retained. max_retries=None uses
  litellm.num_retries or OpenAI DEFAULT_MAX_RETRIES=2; explicit zero is retained, global zero falls back to 2.
  Build litellm_params with metadata and api_key or dynamic_api_key, then obtain B157's media config selector
  and map voice/options with drop_params=false regardless of global drop_params. Log mapped options plus
  metadata/call id/model info,preset_cache_key=None,stream_response={},overlaid kwargs after tags removal.

  OpenAI and compatible providers except azure/azure_ai require a string voice. Base precedence is call,
  litellm.api_base,OPENAI_BASE_URL,OPENAI_API_BASE,https://api.openai.com/v1; key is call,litellm.api_key,
  litellm.openai_key,OPENAI_API_KEY. Organization and project use call,global,OPENAI_ORGANIZATION/OPENAI_PROJECT,None.
  All globals default None. headers or litellm.headers is computed but not passed to OpenAI audio_speech.
  Use B514 for this native call. Azure/azure_ai model speech/* uses B538's native speech operation and requires
  a config; other models require string voice, use call/global/AZURE_API_BASE and call/global/AZURE_API_VERSION,
  and key call,litellm.api_key,litellm.azure_key,AZURE_OPENAI_API_KEY,AZURE_API_KEY. Pop azure_ad_token from
  options.extra_body then fall back to AZURE_AD_TOKEN; retain azure_ad_token_provider and truthy extra_headers.

  B537's Azure OpenAI transport depends on this task, so inject a B010 prepared operation for that branch,
  with caller-visible credential/argument tests here and concrete wire tests in B537. The same seam is used
  for downstream B047 ElevenLabs/Polly, B043 MiniMax, B046 RunwayML, B036 Mistral and B041 EdenAI composition.
  These are named owners, never imports of a task that depends on this one. Generic execution goes through
  B2452. Vertex native synthesis uses B1352/B1353 config operations; lowercase substring gemini on vertex_ai/
  vertex_ai_beta and provider gemini use B1003's chat bridge. No streaming pump or cancellation implementation
  occurs in this function. Provider reply/body decoding stays with the selected provider/transport.

  ElevenLabs strips voice, stores __elevenlabs_voice_id__ and moves dictionary __elevenlabs_query_params__
  out of kwargs into litellm_params. Explicit non-None base/key overwrite those params. Vertex stores
  vertex_project,vertex_location,vertex_credentials and dispatches with api_key=None and extra_headers=headers,
  not kwargs.extra_headers. MiniMax takes a string or first truthy voice_id,id,name from a dict; Mistral/EdenAI
  accept only a string at generic dispatch, else None. RunwayML requires config; EdenAI,ElevenLabs,MiniMax,
  Mistral,Polly and non-Gemini Vertex use their source fallback config tags. Unmapped providers leave response=None
  and raise the source generic Exception. All provider-config implementations remain with their named owners.

  Add speech_call to B2401's SDK HTTP driver. Load every named setting/env fallback in config tests and seeds;
  no environment reads in core. Count 416 nonblank/non-comment source lines, heavily repeated call arguments;
  a typed dispatch record keeps implementation to 300 lines. Budget 180 tests,150 fixtures,80 adapters,60 config/
  corpus and 30 wiring in addition, 800 total. Do not split the Azure call or any other function by line count.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/speech_call.rs
  - crates/betterlite-core/src/api/speech_call/**
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/speech_call.rs
  - crates/betterlite-config/src/api/speech_call/**
  - crates/betterlite-config/src/config.rs
  - crates/betterlite-config/fuzz/corpus/config_yaml/speech-call-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/speech_call.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/speech_call.py
  - tools/oracle/cases/sdk-http/speech-call/**
  - tools/oracle/fuzz/corpus/sdk_http_case/speech-call-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8237-L8719
  why: Own the complete speech dispatch, including credentials and voice checks previously assigned to B1083.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L557-L577
  why: Speech uses REQUEST_TIMEOUT=6000; AUDIO_SPEECH_CHUNK_SIZE belongs to the later route, not this dispatcher.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/elevenlabs/text_to_speech/transformation.py#L64-L65
  why: These two exact private control keys carry the normalized voice and query options to ElevenLabs.
dod:
- text: >-
    native_speech_defaults sends openai/tts-1,input=hello,voice=alloy: one POST /v1/audio/speech returns the
    mock binary bytes 000102 unchanged. Unset timeout/retries use 6000/2; explicit timeout=0,max_retries=0
    stay zero, global num_retries=0 uses 2. response_format=wav,speed=0,instructions="" are mapped because
    they are non-None. tags is absent from downstream kwargs. Mapper receives drop_params=false even when
    the global flag is true. headers={x:ignored} alone does not reach OpenAI's audio_speech call.
  proof: [behavior-tests, config-tests, oracle, sdk-python]
- text: >-
    speech_credentials exercises every OpenAI and Azure base/version/key fallback tier listed above, including
    empty-string fallthrough, and asserts selected operation inputs and actual OpenAI mock headers/path.
    OpenAI-Organization and OpenAI-Project use call over globals over env. Dynamic key reaches litellm_params
    but does not replace the OpenAI branch's separate explicit/global/env key chain. Azure extra_body token
    wins over AZURE_AD_TOKEN and is removed; an empty token falls back. Callback and extra_headers are preserved.
    The Azure mock operation receives the entire call, including voice validation before execution.
  proof: [behavior-tests, config-tests, oracle, sdk-python]
- text: >-
    speech_voice_and_config_errors passes voice=None or {} to OpenAI/Azure OpenAI: BadRequestError 400 with
    source "'voice' is required to be passed as a string for OpenAI TTS" or "'voice' is required to be passed
    as a string for Azure TTS"; empty string is accepted there. Missing native Azure config gives 400
    "Azure Speech Service configuration not found"; missing RunwayML config gives 400 "RunwayML Text-to-Speech
    configuration not found". ElevenLabs None,dict or whitespace voice gives 400 "'voice' must resolve to an
    ElevenLabs voice id for ElevenLabs TTS". All reject before HTTP. SDK failures retain their own class/status
    and nullable fields, not a proxy code="400". An injected unmapped provider raises Exception beginning
    "Unable to map the custom llm provider=<provider> to a known provider=" plus the pinned provider list.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    speech_provider_controls passes ElevenLabs voice=" id ",__elevenlabs_query_params__={enable_logging:false}:
    generic transport receives voice=id and both exact private keys in params, with the query key removed from
    kwargs. A non-dictionary query value is removed but not stored. MiniMax dict {voice_id:"",id:id,name:name}
    chooses id; voice_id=v wins over id/name; only name chooses name; an empty dict gives None. Mistral/EdenAI
    dict voice gives None. Base/key empty strings still overwrite params on these non-None tests.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    speech_vertex_and_bridges uses vertex_ai/gemini-2.5-flash-preview-tts and gemini/gemini-2.5-flash-preview-tts:
    both call B1003, returning its audio/wav bytes. Vertex non-Gemini operations receive vertex_project/location/
    credentials,api_key=None and headers as extra_headers even if a key and a different kwargs.extra_headers were
    supplied. Case-sensitive GEMINI does not take the lowercase-substring branch. Lyria/non-Lyria select their
    respective config tags. Polly keeps a mapped dict voice. A mock OpenAI 429 preserves B011's SDK error
    projection; speech_streaming_bytes and speech_cancellation are removed because this range owns neither.
  proof: [behavior-tests, oracle, sdk-python]
- text: New speech settings and SDK operation seeds parse, and all normal provider comparisons capture actual HTTP.
  proof: [corpora, new-cases, oracle, sdk-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Every provider branch must have voice, credentials and option-input assertions in core/config.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::speech_call::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: Speech fallback settings must be accepted and applied by the production loader.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::speech_call::tests::loads_settings($|::)/)'
  - id: sdk-python
    why: Normal SDK speech calls must execute through the HTTP capture driver.
    run: test -f tools/oracle/sdk_http/speech_call.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpora
    why: Speech controls and SDK invocation need new parser seeds.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/speech-call-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/speech-call-*)" && cargo nextest run --locked -p betterlite-oracle -p betterlite-config --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_config_yaml_corpus)'
  - id: new-cases
    why: The complete dispatch requires new provider-call fixtures with branch controls.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/speech-call)"
oracle_cases:
- tools/oracle/cases/sdk-http/speech-call/native-speech-defaults.yaml
- tools/oracle/cases/sdk-http/speech-call/speech-credentials.yaml
- tools/oracle/cases/sdk-http/speech-call/speech-voice-and-config-errors.yaml
- tools/oracle/cases/sdk-http/speech-call/speech-provider-controls.yaml
- tools/oracle/cases/sdk-http/speech-call/speech-vertex-and-bridges.yaml
deviations: []
out_of_scope:
- B1083 owns aspeech; B1082 transcription/atranscription; B158 owns remaining general main.py SDK facade functions, while per-provider _complete_* functions remain their provider umbrellas' responsibility.
- B1135 owns base speech contracts; B157 owns ProviderConfigManager.get_provider_text_to_speech_config; B176 owns get_litellm_params; B174 model resolution.
- B537 Azure OpenAI,B538 native Azure,B047 ElevenLabs/Polly,B043 MiniMax,B046 RunwayML,B036 Mistral,B041 EdenAI and B033 Vertex composition own concrete adapters. B010 operations are injected where those owners are downstream; this task never imports them.
- B2452 owns generic text_to_speech_handler/async_text_to_speech_handler; B514 owns OpenAI execution and B1003 the chat bridge.
pitfalls:
- Azure voice validation and credential resolution must remain with its call, not a separate line-count stage.
- Vertex explicitly dispatches api_key=None and uses headers instead of kwargs.extra_headers.
- Global num_retries=0 falls through to 2 while an explicit max_retries=0 does not.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
