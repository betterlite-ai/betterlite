id: B1084
title: Speech call
description: >-
  Execute SpeechPlan through the B010/B024 provider or speech-chat-bridge, preserving binary response metadata,
  streaming response ownership and normalized errors. Provider-native execution uses B009; the native SDK operation
  is shared by the later HTTP route and Python bindings. B047 consumes this family's base contract and adds its
  provider-specific executable variants later; keep the generic prepared-call seam independent of those downstream
  adapters.


  Implement crates/betterlite-core/src/api/speech_call.rs. Use SpeechCallInput and SpeechCallResult with typed nested
  records; inject only the clock, repositories, transports and resolved settings this slice uses through constructors.
  Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions native_speech_audio, speech_bridge_audio, speech_streaming_bytes, speech_provider_error,
  speech_cancellation under api::speech_call::tests. Each named function drives production code and asserts its
  case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::SpeechCall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export) and
  tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {speech_call: <typed input>}; operation is only
  the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and Python invokes
  the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered diagnostics/effects,
  never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/main.py: speech (L8453-L8719). Abstract/protocol declarations map to native types
  and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 225 owned nonblank/non-comment/non-docstring Python lines (225 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 245 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 495 total within the 500-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B011 (Exception types and provider error mapping),
  B171 (Direct helper oracle and URL path encoding), B1003 (Speech chat bridge), B1083 (Speech call plan), B1087
  (Api boundaries), B514 (OpenAI binary speech generation). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
