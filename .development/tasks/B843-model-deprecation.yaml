dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: deployment_date_override,
      cost_map_date, invalid_date, already_deprecated, upcoming_boundary, deduplicated_model, escaped_alert.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The production decode_deprecation_date decoder is used by the service and its fuzz target and
      rejects malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_deprecation::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/model_deprecation.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/model-deprecation-*")"
        && grep -rlq "model_deprecation" tools/oracle/fuzz/corpus/helper_case/model-deprecation-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/model_deprecation.rs && grep -q "model_deprecation"
        crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-server/fuzz/corpus/model_deprecation)" && cargo nextest run --locked -p betterlite-server
        --no-tests=fail -E 'test(replays_the_model_deprecation_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/model-deprecation/deployment-date-override.yaml
  - tools/oracle/cases/helpers/model-deprecation/cost-map-date.yaml
  - tools/oracle/cases/helpers/model-deprecation/invalid-date.yaml
  - tools/oracle/cases/helpers/model-deprecation/already-deprecated.yaml
  - tools/oracle/cases/helpers/model-deprecation/upcoming-boundary.yaml
  - tools/oracle/cases/helpers/model-deprecation/deduplicated-model.yaml
  - tools/oracle/cases/helpers/model-deprecation/escaped-alert.yaml
deviations:
  - what: New otherwise unbounded byte decoders reject over 1048576 bytes or JSON depth 64, respecting
      smaller inherited limits.
    why: Bound the specific outside-byte decoder named in this task; typed helpers inherit no artificial
      parser behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/model_deprecation.py#L32-L42
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
pitfalls:
  - Invalid deprecation dates follow the source fallback and must not remove the deployment.
budget:
  max_changed_lines: 475
  max_new_expects: 0
review_level: security
