    - crates/betterlite-server/src/model_deprecation.rs
    - crates/betterlite-server/src/model_deprecation/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/src/helpers/model_deprecation.rs
    - tools/oracle/src/helpers/model_deprecation/**
