id: B843
title: Model deprecation dates and alert formatting
description: >-
  Implement ModelDeprecations over B013 catalog dates and deployment overrides with an injected date.
  Preserve provider/model lookup precedence, classification buckets, deduplication, ordering and escaped
  Slack mrkdwn payload formatting. B116 sends alerts; this task only produces typed facts and text.


  Build the production model_deprecation module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/model_deprecation.py:
  _parse_deprecation_date (L32-L42; 11 source lines), _cost_map_lookup (L45-L59; 15 source lines), _mapping_field
  (L62-L64; 3 source lines), _resolve_deployment_deprecation (L67-L95; 27 source lines), _classify (L98-L103;
  6 source lines), _build_info (L106-L123; 16 source lines), _dedupe (L126-L133; 8 source lines), _bucket
  (L136-L142; 7 source lines), collect_model_deprecations (L145-L175; 28 source lines), _escape_slack_mrkdwn
  (L178-L180; 3 source lines), _format_entry (L183-L193; 11 source lines), format_deprecation_alert_message
  (L196-L226; 28 source lines).


  Add the model_deprecation operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a model-deprecation-*
  seed to B171 helper_case, which already owns this decoder.


  This task owns the outside-byte boundary model_deprecation::decode_deprecation_date(&[u8]) -> Result<TypedValue,DecodeError>
  for catalog date strings. Production calls this decoder before its typed policy functions; the cargo-fuzz
  target model_deprecation calls that same function. Seed valid, truncated, malformed, duplicate-field
  and limit-boundary inputs and add model_deprecation::tests::replays_the_model_deprecation_corpus. Reuse
  B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string decoder
  cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or fetching
  URLs. B770 owns crates/betterlite-server/fuzz; depend on it and register this decoder target without
  recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 163 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  163 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 454 changed lines estimated within a 475-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
scope:
