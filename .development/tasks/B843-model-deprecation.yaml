id: B843
title: Model deprecation dates and alert formatting
description: >-
  Implement ModelDeprecations over B013 catalog dates and deployment overrides with an injected date.
  Preserve provider/model lookup precedence, classification buckets, deduplication, ordering and escaped
  Slack mrkdwn payload formatting. B116 sends alerts; this task only produces typed facts and text.


  Read deployments through B844 get_model_list and catalog entries through B013; inject both catalog
  and UTC clock. Own _ResolvedDeprecation plus all response fields and constants in the covered types
  file: DEFAULT_DEPRECATION_WARN_DAYS=30, DEFAULT_DEPRECATION_CHECK_INTERVAL_SECONDS=86400 and
  DEPRECATION_IDLE_POLL_SECONDS=30. The latter two are exported for B116, not new environment settings.
  ModelDeprecationInfo requires model_name/date/days/status and defaults litellm_model and
  litellm_provider to None. Response buckets default empty; warn_within_days and checked_at are required.


  Dates accept datetime (take its calendar date without timezone conversion), date, or a string
  trimmed with Python strip semantics and parsed by date.fromisoformat. Match calendar dates, basic
  YYYYMMDD and supported ISO week dates; reject date-time strings and invalid dates by returning None,
  without a warning. Non-string scalar/container values also return None. A valid model_info override
  wins and takes provider only from that model_info. Otherwise try catalog base_model, the full
  litellm_params.model, then its suffix after the first slash. Ignore empty/non-string lookup keys,
  non-mapping catalog entries and invalid dates; keep a non-string catalog provider as None. A malformed
  model_info or litellm_params acts as an empty map. Missing/non-string/empty public model_name or no
  resolvable date removes only that row from the report, never from the router.


  Days below zero classify deprecated; zero through warn_within_days inclusive classify imminent;
  later dates classify upcoming. The helper does not clamp a negative warning window. Deduplicate by
  (public model_name,date), retaining the first deployment's provider/model for equal keys, then sort
  each bucket by date, preserving model-name order for tied dates. Different dates for the same public
  name remain distinct entries. Missing router or model list gives empty buckets. Always sample the UTC
  clock for checked_at, even with an explicit today, and emit the debug count of deduplicated dated
  models versus total deployments. Explicit today changes classification, not checked_at.


  Alert formatting returns None when deprecated and imminent are empty, even if upcoming is populated.
  Otherwise emit '*⚠️ Model Deprecation Warning*', the nonempty sections '\n*Already deprecated:*'
  and '\n*Deprecating within <days> days:*', and the footer '\nPlan migrations to a supported model.
  See https://docs.litellm.ai/docs/proxy/model_management for guidance.', joined with newlines.
  Each entry is '• `<name>` (provider: <provider>, deprecates <ISO date>, <suffix>)', using unknown
  for absent or empty provider and 'already deprecated <absolute days>d ago' or 'in <days>d'. Escape
  ampersand first, then < and >, in both name and provider; do not add backtick/asterisk escaping the
  source lacks. Formatter output is compared byte-for-byte, including blank lines and section order.


  Build the production model_deprecation module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/model_deprecation.py:
  _parse_deprecation_date (L32-L42; 11 source lines), _cost_map_lookup (L45-L59; 15 source lines), _mapping_field
  (L62-L64; 3 source lines), _resolve_deployment_deprecation (L67-L95; 27 source lines), _classify (L98-L103;
  6 source lines), _build_info (L106-L123; 16 source lines), _dedupe (L126-L133; 8 source lines), _bucket
  (L136-L142; 7 source lines), collect_model_deprecations (L145-L175; 28 source lines), _escape_slack_mrkdwn
  (L178-L180; 3 source lines), _format_entry (L183-L193; 11 source lines), format_deprecation_alert_message
  (L196-L226; 28 source lines).


  Add the model_deprecation operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a model-deprecation-*
  seed to B171 helper_case, which already owns this decoder.


  The string parser decode_deprecation_date(&str) returns Option<Date>, using a maintained date parser
  with compatibility for the source's ISO formats. Catalog/config/helper bounds are enforced upstream;
  there is no JSON depth or new one-megabyte policy in a date-string helper. Fuzz this actual parser
  with arbitrary UTF-8 strings, invalid days, leap years, week dates, whitespace and truncation; replay
  the committed corpus in replays_the_model_deprecation_corpus. B770 supplies the server fuzz workspace.


  The helper module has 179 nonblank noncomment lines excluding docstrings, including imports/types;
  its response file adds 42 such lines. Estimate 200 production, 255 tests, 80 adapters, 45 fuzz/replay
  and 30 wiring lines, 610 within 650. No database or route work belongs in this part.
