deviations: []
out_of_scope:
  - B116 owns Slack delivery, deduplication TTL and polling; the model-info route owner calls this collector.
pitfalls:
  - 'The oracle helper for this task is pre-registered as model_deprecation in the server group. Replace the stub Op in tools/oracle/src/helpers/server/model_deprecation.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/model_deprecation.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Two deployments with the same public name and date report the first deployment's metadata, even if their providers differ.
  - Supplying today does not freeze checked_at, which always comes from a fresh UTC clock sample.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
