oracle_cases: []
deviations:
  - what: >-
      Session ID scoping hashes the principal (authenticated token) using SHA256 and truncates to 16 hex characters,
      so the raw principal is never sent to the agent backend.
    why: >-
      betterlite stores scoped session IDs to bind A2A contexts to keys, preventing context confusion across
      different authorized keys. The principal is already a hashed token (from auth), so hashing again
      adds a layer of isolation for operator-side correlation.
out_of_scope:
  - litellm/a2a_protocol/utils.py:168-174 (backwards compatibility aliases), re-exported as direct functions in Rust.
  - A2A protocol SDK protobuf conversion and transport, handled by the A2A SDK contracts.
  - Agent card resolution, owned by B4800.
  - Completion bridge handler, provider routing and A2A_USER_API_KEY_HASH_PARAM constant, owned by B4809.
  - Request retries and retry logic, owned by B4801 (native client transport).
pitfalls:
  - Text extraction from A2A request-side parts requires calling model_dump(mode="json") first, since A2A SDK Part objects use root models that object attribute access cannot read; response-side extraction works on dicts from model_dump.
  - get_session_id_from_a2a_params returns None when params have no message, not an empty string; callers must check for None before scoping.
  - count_tokens catches all exceptions and returns 0 silently; verbose logging of the failure is optional and does not affect behavior.
  - Message text joining uses space separator, not newline; parts are extracted from a list that may have missing or malformed entries, which are skipped without error.
  - Token-based cost calculation treats None cost values as 0.0; if input or output cost is not present, it contributes zero to the total.
  - Principal hashing checks for None or empty with a boolean test, so a falsy string or 0 would bypass scoping and return the original session_id unchanged.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
