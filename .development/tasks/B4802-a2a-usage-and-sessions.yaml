id: B4802
title: A2A principal sessions, text usage and agent pricing
description: >-
  Build A2A utilities for text extraction, token counting, usage calculation, session scoping,
  and cost pricing. Build pure Rust modules consuming logging state and token counting infrastructure.

  A2ARequestUtils extracts text from A2A message parts (handling both dict and object access patterns),
  extracts text from A2A response results (detecting message kind explicitly), gets input messages from
  A2A requests, counts tokens using the tokenizer crate, and calculates usage as a tuple of (prompt_tokens,
  completion_tokens, total_tokens). Message parts are extracted by iterating parts, checking kind=="text",
  and joining text fields with space. Response extraction handles direct message format (kind=="message")
  and nested message format (result.message), using the same extraction logic. Token counting wraps
  the tokenizer and returns 0 on failure. Usage is calculated by extracting text from both
  request message and response, counting tokens, and summing them.

  scope_session_to_principal binds a client-supplied A2A contextId to the authenticated principal (hashed
  token) so two keys authorized for the same agent cannot share backend memory. Principal is hashed with
  SHA256 and truncated to 16 hex characters (8 bytes), prepended to the original contextId as
  "{principal_prefix}-{session_id}". If principal is None or empty, the original session_id is returned
  unchanged.

  A2ACostCalculator calculates A2A call cost with priority order: response_cost (set directly, backward
  compatibility) > cost_per_query (fixed cost per query) > input_cost_per_token + output_cost_per_token
  (token-based). Cost parameters come from litellm_params in model_call_details. Token-based cost is
  calculated as (prompt_tokens * input_cost_per_token) + (completion_tokens * output_cost_per_token), with
  missing cost values treated as 0.0. Default cost is 0.0 when no parameters match.
scope:
