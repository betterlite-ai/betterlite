dod:
  - text: >-
      Cases missing_session_id, missing_max_iterations, first_call_passes,
      second_call_within_limit, third_call_exceeds_limit,
      redis_failure_fallback_increments, counter_increments_on_rejection,
      error_detail_includes_session_and_counts,
      agent_params_wins_over_metadata, cache_key_uses_hash_tag and
      ttl_expires_counter verify full behavior without Redis outages.
    proof:
      - behavior-tests
  - text: >-
      The independently invoked helper reproduces rejection and counter
      increment behavior exactly and replays the corpus successfully.
    proof:
      - helper-python
      - helper-case-corpus
  - text: >-
      LITELLM_MAX_ITERATIONS_TTL loads through production config boundary
      with 3600-second default, environment override and no invalid-value failure.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The session iteration limit behavior tests are absent or fail against the pinned implementation.
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^session_iteration_limits::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b3054.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/session-iteration-limits-*")"
        && grep -rlq "session_iteration" tools/oracle/fuzz/corpus/helper_case/session-iteration-limits-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::session_iteration_limits::tests::.*max_iterations($|::)/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/session-iteration-limits-*")"
        && grep -rlq "max_iterations_ttl" crates/betterlite-config/fuzz/corpus/config_yaml/session-iteration-limits-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
