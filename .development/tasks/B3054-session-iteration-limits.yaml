id: B3054
title: Per-session maximum iteration limits
description: >-
  Implement the session iteration limiter in betterlite-rate-limit, enforcing
  a per-session cap on consecutive LLM calls in agentic loops. Count session
  iterations before dispatch using a Redis first-increment TTL with in-memory
  fallback, rejecting only after the count exceeds the selected limit. Rejected
  attempts still increment the counter.

  Extract session_id from metadata.session_id or litellm_metadata.session_id
  (as string, tolerating missing sessions by passing through). Resolve max_iterations
  with agent litellm_params taking precedence over key metadata; both fallback
  to None when absent. Return early without checking if either is missing.

  Build a Redis Lua script for atomic first-increment with TTL to preserve
  counter lifetime across instances. Redis failures fall back to in-memory
  cache with the same TTL. Cache keys use hash-tag pattern {session_iterations:<session_id>}:count
  to group cluster slot requests per session.

  Load LITELLM_MAX_ITERATIONS_TTL (default 3600 seconds) from environment through
  betterlite-config as a setting; config tests verify defaults and overrides.
  Raise ProxyRateLimitError with rate_limit_type MAX_ITERATIONS and resolved
  model/provider on rejection (using B3030's provider resolution). Include
  detail messages with current count and limit.

  Implement _PROXY_MaxIterationsHandler as a pre-call hook accepting
  user_api_key_dict, cache, data and call_type. B732 supplies authenticated
  metadata; B3030 supplies ProxyRateLimitError and resolve_llm_provider_for_rate_limit.
  B4776 supplies AgentRegistry.get_agent_by_id for agent parameter lookup;
  B4328 supplies DualCache.async_register_script for Redis script registration.

  Budget 130 Rust impl/tests in betterlite-rate-limit, 50 config tests/seeds,
  50 oracle adapters, 30 wiring and 140 new oracle cases, 400 changed lines
  estimated within a 500-line gate.
