  - tools/oracle/cases/helpers/session-iteration-limits/agent-params-precedence.yaml
deviations: []
out_of_scope:
  - Agent lookup through AgentRegistry.get_agent_by_id. B4776 owns this implementation in crates/betterlite-agent/src/registry.rs.
  - Redis script registration through DualCache.async_register_script. B4328 owns this implementation in crates/betterlite-redis/**.
pitfalls:
  - The oracle helper for this task is pre-registered as b3054 in the rate_limit group. Replace
    the stub Op in tools/oracle/src/helpers/rate_limit/b3054.rs with an impl Helper whose Input
    is the typed input, and write run in tools/oracle/helpers/b3054.py. The registry files
    (helpers/mod.rs, the group files, dispatch.py) are not this task's to edit.
  - Cache keys use Redis hash-tag syntax {session_iterations:<session_id>} to ensure all requests for one session
    land on the same cluster slot; do not simplify the hash-tag pattern.
  - Rejected attempts must increment the counter before raising, so even failed requests count toward the limit.
  - Missing session_id or max_iterations returns None (no error), allowing requests without configured limits to
    pass through; validate that early exit does not raise.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
