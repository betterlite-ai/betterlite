dod:
  - text: "GenericApiLogger implements CallbackLogger by queueing on async success and failure, so the generic_api names B8655 resolves receive calls (tests named callback_logger_* in generic_api_logger)."
    proof: [callback-logger]
  - text: >-
      The embedded json parses into the five named configs, and substitute_env_variables replaces only upper-case NAME
      patterns, with an unset variable becoming empty.
    proof: [compat-tests]
  - text: >-
      Settings resolve endpoint, headers, event types and format from the given values first, then the named config,
      then the environment; an unknown name warns; a missing endpoint and a bad format fail with the exact texts.
    proof: [settings-tests]
  - text: >-
      Headers merge in the order default, GENERIC_LOGGER_HEADERS, global headers, given and config headers, by exact
      key; retries and delay are clamped at zero.
    proof: [settings-tests]
  - text: >-
      The event methods skip an event type that is not listed, queue the standard payload (or JSON null) or the v1
      payload, and send at the batch size.
    proof: [delivery-tests]
  - text: >-
      json_array, ndjson and single bodies match the rules above; the queue is empty after every send, including a failed
      one; one failing single request does not stop the others.
    proof: [delivery-tests]
  - text: >-
      Retries follow max_retries plus one attempts with the doubling delay, retry only timeouts, transport errors and
      5xx, and re-raise on the last attempt.
    proof: [retry-tests]
  - text: The v1 payload has the thirteen keys, all as text, and a missing usage fails.
    proof: [v1-payload-tests]
checks:
  optional: []
  commands:
    - id: callback-logger
      why: GenericApiLogger never receives a logger event
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^generic_api_logger::(.*::)?callback_logger_/)'
    - id: compat-tests
      why: fails while the embedded json or the placeholder substitution is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^generic_api_logger::compat_callbacks::/)'
    - id: settings-tests
      why: fails while the settings order, header merge or validation is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^generic_api_logger::generic_settings::/)'
    - id: delivery-tests
      why: fails while event filtering, the three formats or the queue clear are missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^generic_api_logger::generic_logger::delivery/)'
    - id: retry-tests
      why: fails while the retry classification or the backoff is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^generic_api_logger::generic_logger::retry/)'
    - id: v1-payload-tests
      why: fails while the v1 payload keys or their text form are missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^generic_api_logger::v1_payload::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The callback_settings route in logging_callback_manager.py that builds a GenericAPILogger from a config entry with `callback_type: generic_api` and caches it by name: B189 is merged without it, so B8655 builds that lookup and calls GenericApiSettings::resolve."
  - "CustomBatchLogger's timer, worker and generic batch delivery: B256 and B191 own them; this task only uses their constants and the no-timer rule."
  - "Rubrik's own logger and moderation in litellm/integrations/rubrik.py: B3975 to B3978 own them. The `rubrik` entry in the json file is only a config for this logger."
pitfalls:
  - >-
    The queue is cleared in a `finally`. A failed post loses the batch on purpose. B256's primitive keeps failed events,
    so do not route delivery through it.
  - >-
    Python appends None when the event has no `standard_logging_object`, which later serializes as `null`. Keep that; do
    not skip the entry.
  - >-
    `endpoint or env` treats an empty endpoint as unset. `max_retries or 0` treats a missing value as 0.
  - >-
    The json headers are added only when the exact key is missing from the given headers, but they are applied before the
    final merge, so they replace the env and global headers of the same key.
  - >-
    The header values and the endpoint can carry secrets (an API key in `Authorization`). The debug line in the
    constructor prints them in Python; log the callback name, the format and the event types only.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
