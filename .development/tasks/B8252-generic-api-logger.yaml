id: B8252
title: Generic API logger and compatible callback configs
description: >-
  Build LiteLLM's `GenericAPILogger` (`litellm/integrations/generic_api/generic_api_callback.py`) and the data file next
  to it, `generic_api_compatible_callbacks.json`, in betterlite-logging as the module `generic_api_logger`. The logger
  posts every success or failure payload to one HTTP endpoint, in batches. Named callbacks (`sample_callback`, `rubrik`,
  `sumologic`, `qualifire_eval`, `ramp`) fill their endpoint, headers, event types and format from the json file.

  Data file. Copy the json to `crates/betterlite-logging/src/generic_api_logger/compatible_callbacks.json` unchanged and
  load it with `include_str!` into a typed map. Module `compat_callbacks` has `CallbackConfig` (optional `event_types`,
  `endpoint`, `headers`, `log_format`, and `environment_variables` as a list of names) and
  `CompatibleCallbacks::embedded()`, which parses the embedded text and returns an error if it is invalid (a test proves
  it parses and holds the five names). `is_callback_compatible(name)` and `get_callback_config(name)` read that map.
  `substitute_env_variables(value, env)` replaces each `{{environment_variables.NAME}}` with the value `env` gives for
  NAME, or the empty string when unset. NAME matches only upper-case letters and underscores, so
  `{{environment_variables.Foo1}}` stays as written. `env` is an injected lookup; never read the process environment.

  Settings. Module `generic_settings` has `GenericApiArgs` (`endpoint`, `headers`, `event_types`, `callback_name`,
  `log_format`, `max_retries`, `retry_delay`, `timeout`) and `GenericApiSettings::resolve(args, env, global_headers)`.
  Resolve in this order. (1) With a `callback_name` that is in the json file: an unset `endpoint` takes the substituted
  json endpoint; every json header whose exact key is not already in the given headers is added with its value
  substituted; unset `event_types` and `log_format` take the json values. A `callback_name` that is not in the file logs
  the warning "callback_name '<name>' not found in generic_api_compatible_callbacks.json" and goes on with the given
  values. (2) `endpoint` is the given or json value, else env `GENERIC_LOGGER_ENDPOINT`; an empty string counts as unset.
  When none exists, fail with "endpoint not set for GenericAPILogger, GENERIC_LOGGER_ENDPOINT not found in environment
  variables". (3) Headers start as `Content-Type: application/json`, then take env `GENERIC_LOGGER_HEADERS` (comma
  separated `key=value` items; split each item on its first `=`, trim both sides, skip items without `=`), then
  `global_headers` (LiteLLM's `litellm.generic_logger_headers`, passed in from the settings), then the headers from step
  (1). A later source replaces an earlier one by exact key, so `content-type` and `Content-Type` are two headers.
  (4) `log_format` is `json_array` (default), `ndjson` or `single`; any other text fails with "Invalid log_format: <x>.
  Must be one of: 'json_array', 'ndjson', 'single'". (5) `max_retries` is `max(0, value)`, `retry_delay` is
  `max(0.0, value)` with an absent value as 0.0. `timeout` is kept as given. `event_types` stays `None` for "all events".

  Delivery. Module `generic_logger` has `GenericApiLogger`. Its two event methods mirror `async_log_success_event` and
  `async_log_failure_event`. Each returns at once when `event_types` is set and lacks `llm_api_success` or
  `llm_api_failure`. Otherwise it appends one payload to the queue and, when the queue length reaches the batch size,
  sends the batch. The payload is the event's `standard_logging_object`, which stays JSON `null` when the event has none.
  With the global setting `generic_api_use_v1` true it is the v1 payload instead (below). An internal error is logged
  and never reaches the caller. Use B256's batch size (512) and flush interval (5 seconds) values and its rule that the
  caller owns the timer; the periodic flush is B8655's.
  `send_batch` does nothing for an empty queue. For `json_array` it posts one body, the JSON array of the queue. For
  `ndjson` it posts the JSON text of each entry joined with a newline and no trailing newline. For `single` it posts one
  request per entry, all at the same time, and logs each failure with its index without stopping the others. Serialize
  with B192's `safe_dumps`. It always empties the queue at the end, success or not: a failed batch is dropped, unlike
  B256's default, and a test pins that. Do not call B256's requeue path.
  `post_with_retries` makes `max_retries + 1` attempts. After attempt n it sleeps `retry_delay * 2^n` seconds, where n
  starts at 0, and skips the sleep when `retry_delay` is 0. A timeout, a transport error or a response with status 500
  or above is retried; a 4xx response or any other error is not, and the last attempt re-raises. Each retry logs
  "Generic API Logger - retrying request to <endpoint> after error: <error> (attempt <n>/<total>)" at warning level.
  Posts use the Logging callback client of B173 with the resolved headers and `timeout`. The sleep comes in through an
  injected clock so tests do not wait.

  V1 payload. Module `v1_payload` has `v1_logging_payload(kwargs, response, start_time, end_time)`. It builds a map with
  `id` (the response `id`, else a new UUID text), `call_type` (default `litellm.completion`), `cache_hit` (default
  false), `startTime`, `endTime`, `model` (default empty), `user` (default empty), `modelParameters` (the
  `optional_params`), `messages`, `response`, `usage` (the response `usage`; a missing `usage` fails), `metadata` (the
  `litellm_params.metadata`, `{}` when null) and `cost` (`response_cost`, default 0.0). Then every value is replaced by
  its string form. Follow docs/compatibility.md for what a Python `str()` of each JSON type becomes; do not invent a
  repr. The v1 payload is old and rarely on, so keep this module small.
scope:
