deviations:
  - what: Stored metadata JSON above 1048576 bytes or depth 64 becomes an empty object, like malformed metadata.
    why: B192 bounds otherwise unbounded stored JSON; native_object_limits_become_empty proves the additional fallback.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/team_admin_field_permissions.py#L109-L113
out_of_scope:
  - 'litellm/proxy/management_endpoints/team_admin_field_permissions.py::team_admin_may_manage_projects
    (L97-L100): no production caller at the pinned commit; repository-wide identifier search finds only
    this definition.'
  - B1231 owns UpdateTeamRequest validation; B770 owns UpdateKeyRequest; B894 owns the reserved service_account_id catalog.
pitfalls:
  - 'The oracle helper for this task is pre-registered as team_admin_fields in the server group. Replace the stub Op in tools/oracle/src/helpers/server/team_admin_fields.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/team_admin_fields.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The spend check uses field presence because the stored row can lag live counters, so equal-value diffing is insufficient.
  - Removing duplicate budget windows before comparison would erase the source's raw-comparison fallback.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
