id: B1200
title: Team-administrator editable field policy
description: >-
  Implement team-admin editable team/key field verdicts over typed before/after values. general_settings.team_admin_editable_team_fields
  defaults absent/empty; accepted values are tpm_limit, rpm_limit, max_budget, projects and member_key_budgets.
  A malformed list warns and becomes empty; unsupported entries warn and are ignored. Spend is never an
  editable key-budget field, even when its submitted value equals the stored value. Metadata comparison
  deliberately ignores team_member_budget_id; do not turn that omission into a rejection.

  Resolve the configured list into a set, removing duplicates. None gives an empty set. Validation failure
  warns with the setting and raw value, then returns empty; unknown names warn in sorted order. A known
  permission outside the requested supported subset is silently ignored. The team subset has three fields;
  member-key editing checks only member_key_budgets. Own the declaration/verdict types at L25-L69 and
  L272-L284, plus the two metadata-folding tables in _types.py L5069-L5101, below B894 and B800. The ordinary
  table is model_rpm_limit, model_tpm_limit, model_itpm_limit, model_otpm_limit, default_estimated_output_tokens,
  default_estimated_output_tokens_per_model, mcp_rpm_limit, tag_rpm_limit, rpm_limit_type, tpm_limit_type,
  enforced_params, temp_budget_increase, temp_budget_expiry, allowed_vector_store_indexes,
  enforced_batch_output_expires_after, enforced_file_expires_after, throttle_on_budget_exceeded,
  enable_prompt_caching and end_user_budget_id. The premium-named table contains disable_global_guardrails,
  guardrails, policies, tags, team_member_key_duration, prompts, logging, secret_manager_settings and
  allowed_passthrough_routes. This policy reads both tables without a license branch.

  Use B859's team row and B720's verification-token row. Compare request and row JSON representations,
  preserving field presence. Missing metadata uses the stored
  object; explicitly sent metadata replaces it, including null becoming an empty object. Explicit top-level
  folded fields override that object, including null. Changes to a folded key use its own field name; any
  other metadata difference uses metadata. Missing and null compare equally. Model aliases compare the
  submitted parsed object against litellm_model_table.model_aliases, with an absent table treated as empty.
  Unstored fields count as changed whenever sent. Team identity team_id and metadata are not columns;
  key identity key, token and metadata are not columns. Empty team permissions disable even a no-op request.
  Otherwise choose the lexicographically first blocked field. Allowed team edits retain team_id, only changed
  submitted fields, and metadata when a logical change came from inside it; revalidate through B1231 so a
  resent unchanged budget_duration cannot reset the budget. An allowed key verdict returns its changed set
  and does not filter the patch. Disabled member-key editing wins before comparison; the only permitted
  key fields are max_budget, budget_duration, soft_budget and budget_limits.

  Budget windows compare unordered unique (budget_duration,max_budget) pairs, ignoring reset_at and extra
  keys. None equals an empty list. Duplicate pairs, a non-list or invalid list items fall back to raw JSON
  comparison; unhashable pair values raise rather than silently normalizing. Four rejection branches raise
  HTTPException 403 with string detail, without supplying type/param/code. Preserve the exact messages at
  L205-L216 and L310-L322, including the location literal Settings > UI > Team admin editable fields,
  the quoted blocked field, and the quoted member_key_budgets permission.


  Build the production team_admin_fields module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_admin_field_permissions.py:
  resolve_team_admin_editable_fields (L72-L94; 23 source lines), team_admin_may_edit_member_key_budgets
  (L103-L106; 4 source lines), _as_object (L109-L113; 5 source lines), _stored_metadata (L116-L117; 2
  source lines), _submitted_metadata (L120-L128; 9 source lines), _metadata_changes (L131-L140; 10 source
  lines), _stored_model_aliases (L143-L145; 3 source lines), _column_changed (L148-L155; 8 source lines),
  changed_team_fields (L158-L172; 14 source lines), _only_changes (L175-L181; 7 source lines), team_admin_edit_verdict
  (L184-L195; 12 source lines), team_admin_request_or_raise (L198-L219; 22 source lines), _budget_windows
  (L222-L239; 17 source lines), _key_column_changed (L242-L250; 9 source lines), changed_key_fields (L253-L268;
  15 source lines), team_admin_key_edit_verdict (L287-L300; 14 source lines), team_admin_key_request_or_raise
  (L303-L325; 23 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the team_admin_fields operation under B856 Management::teams. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a team-admin-fields-*
  seed to B171 helper_case, which already owns this decoder.


  Config tests absent_and_null_disable, supported_subset_and_duplicates, malformed_list_warns_empty and
  unsupported_sorted_warning load general_settings.team_admin_editable_team_fields through B002 and then
  call this resolver. There is no dedicated environment variable; seed config_yaml with the nested list.


  _as_object accepts stored JSON strings as well as objects. Implement decode_team_admin_object on B192's
  bounded JSON decoder; malformed JSON, wrong shape, over 1048576 bytes or depth over 64 yields the empty
  object. Register team_admin_object in B770's server fuzz workspace and replay valid, malformed, duplicate
  key, scalar, depth and byte-boundary inputs through that production decoder. Request decoding remains
  with B770/B1231; this task owns only the stored-object coercion.


  Sizing includes the 197 helper lines, 47 declaration lines and 32 table lines before docstring exclusion:
  allow 275 production, 280 policy tests, 65 adapters, 40 decoder/fuzz, 50 configuration and 30 wiring lines,
  totaling 740 within an 800-line gate. No database writes or route registration belong here.
