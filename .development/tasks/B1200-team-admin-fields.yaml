id: B1200
title: Team-administrator editable field policy
description: >-
  Implement team-admin editable team/key field verdicts over typed before/after values. general_settings.team_admin_editable_team_fields
  defaults absent/empty; accepted values are tpm_limit, rpm_limit, max_budget, projects and member_key_budgets.
  A malformed list warns and becomes empty; unsupported entries warn and are ignored. Spend is never an
  editable key-budget field, and system-managed team_member_budget_id changes cannot bypass the diff policy.


  Build the production team_admin_fields module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_admin_field_permissions.py:
  resolve_team_admin_editable_fields (L72-L94; 23 source lines), team_admin_may_edit_member_key_budgets
  (L103-L106; 4 source lines), _as_object (L109-L113; 5 source lines), _stored_metadata (L116-L117; 2
  source lines), _submitted_metadata (L120-L128; 9 source lines), _metadata_changes (L131-L140; 10 source
  lines), _stored_model_aliases (L143-L145; 3 source lines), _column_changed (L148-L155; 8 source lines),
  changed_team_fields (L158-L172; 14 source lines), _only_changes (L175-L181; 7 source lines), team_admin_edit_verdict
  (L184-L195; 12 source lines), team_admin_request_or_raise (L198-L219; 22 source lines), _budget_windows
  (L222-L239; 17 source lines), _key_column_changed (L242-L250; 9 source lines), changed_key_fields (L253-L268;
  15 source lines), team_admin_key_edit_verdict (L287-L300; 14 source lines), team_admin_key_request_or_raise
  (L303-L325; 23 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  general_settings.team_admin_editable_team_fields=None; values tpm_limit/rpm_limit/max_budget/projects/member_key_budgets
  use the warn-and-ignore behavior of resolve_team_admin_editable_fields.


  Add the team_admin_fields operation under B856 Management::teams. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a team-admin-fields-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::team_admin_fields::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 197 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  197 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 487 changed lines estimated within a 500-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
