deviations:
  - what: Default start_date is UTC today minus seven days, not the configured server timezone.
    why: LiteLLM uses datetime.now(timezone.utc), so betterlite matches for consistency and simplicity.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/usage_endpoints.py#L56-L58
  - what: UsageOverviewResponse.passRate is calculated as (requests - blocked) / requests * 100, never taken from a separate tracked field.
    why: LiteLLM calculates it on the fly from aggregated counters; deriving it at the response boundary matches the dependency on B726's table accessors, not on usage_tracking's cost model.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/usage_endpoints.py#L393-L401

out_of_scope:
  - "_ACTION_SEVERITY constant (litellm/proxy/guardrails/usage_endpoints.py:45): only used by _usage_log_entry_from_row (L783), owned by B104."
  - "_GuardrailRunInfo TypedDict (litellm/proxy/guardrails/usage_endpoints.py:217-224): only used by _usage_log_entry_from_row (L780-781), owned by B104."
  - HTTP route handlers guardrails_usage_overview, guardrails_usage_detail, guardrails_usage_logs, policies_usage_overview (owned by B104).
  - Database table find_many operations (owned by B726 repositories).
  - Guardrail registry IN_MEMORY_GUARDRAIL_HANDLER.list_config_guardrails (owned by B3682-B3683).
  - spend log filtering and pagination (owned by B3688 usage_tracking).

pitfalls:
  - "resolve_usage_window must validate that parsed dates round-trip exactly through fromisoformat and isoformat; non-ISO formats like M-D-YYYY are rejected even if parsed."
  - "Default window start is (now - timedelta(days=7)).isoformat(), not a hardcoded past date; each request uses the current UTC time."
  - "status_from_fail_rate thresholds are strict inequalities: fail_rate > 15 returns critical, not >=; fail_rate > 5 returns warning, not >=."
  - "trend_from_comparison returns stable when previous_fail is 0.0 or None, not when diff is exactly 0; hysteresis is ±0.5 percentage points."
  - "_sum_tracked_cost returns None (not 0.0) when no row has a tracked cost; this distinguishes unpriced from zero-cost."
  - "Guardrail metrics are keyed by display_name from spend logs, not always by guardrail_id; overview rows must look up both keys in order and use first match."
  - "Fallback overview rows for metrics without a guardrail record omit zero-request entries; a metric key with requests=0 never gets a row."
  - "Policy overview rows always have empty usageUnits and null cost; policies do not participate in unit tracking."
  - "get_guardrail_field handles both Prisma model attributes (db rows) and dict keys (config guardrails) in one function; dict.get returns None for missing keys, not AttributeError."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
