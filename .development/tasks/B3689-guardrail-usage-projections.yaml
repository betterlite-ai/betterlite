dod:
  - text: >-
      resolve_usage_window parses start/end dates in YYYY-MM-DD format, defaults
      start to 7 days ago UTC and end to today UTC. Rejects non-ISO format, out-
      of-order dates and ranges exceeding 366 days with HTTP 400 bad_request and
      exact LiteLLM error messages.
    proof: [window-validation-works, window-defaults-work, window-format-strict]
  - text: >-
      Constants usage_max_range_days is 366, empty_units is immutable.
      status_from_fail_rate returns correct thresholds (critical >15, warning >5,
      healthy <=5) and trend_from_comparison returns up/down/stable with ±0.5pp
      hysteresis; stable when previous is zero.
    proof: [thresholds-correct]
  - text: >-
      aggregate_daily_metrics sums all four counter types per id. prev_fail_rates
      calculates (blocked / requests) per id, handles zero requests. chart_from_metrics
      groups by date string, sums passed/blocked, returns sorted chronological list.
    proof: [metrics-aggregation-works]
  - text: >-
      sum_counter_units groups by counter name, sums units. sum_untracked_units groups
      by counter, sums untracked_units, omits zero values. sum_tracked_cost sums costs
      only from rows with non-null cost and untracked < total; returns null when no
      priced row exists.
    proof: [row-aggregation-works]
  - text: >-
      guardrail_overview_rows looks up each guardrail by display_name then id (first match),
      defaults to zero metrics when not found. Adds fallback rows for metrics keys not in
      guardrails (omits zero-request entries). Extracts provider from litellm_params.guardrail,
      type from guardrail_info.type.
    proof: [guardrail-overview-works]
  - text: >-
      policy_overview_rows looks up each policy by policy_id, defaults to zero metrics.
      Returns all policies with type=Policy, provider=LiteLLM, empty units and null cost.
    proof: [policy-overview-works]
  - text: >-
      get_guardrail_field overloaded for str fields (guardrail_id, guardrail_name) returning
      strings and object fields (litellm_params, guardrail_info) returning dicts. Accesses db
      struct attributes and config dict keys uniformly.
    proof: [field-access-works]
  - text: >-
      The independently invoked MIT helper matches the production aggregation operation
      and the new helper-case seed replays.
    proof: [guardrail-usage-oracle, guardrail-usage-python, guardrail-usage-corpus]

checks:
  optional:
    - mutants
  commands:
    - id: window-validation-works
      why: Date window validation is missing, incorrect or error messages mismatch LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*window_validation/)'
    - id: window-defaults-work
      why: resolve_usage_window defaults are incorrect or do not round-trip as ISO strings
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*window_defaults/)'
    - id: window-format-strict
      why: Date format is not validated strictly (non-ISO round-trip allowed)
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*format_strict/)'
    - id: thresholds-correct
      why: Status thresholds or trend comparison offsets are incorrect
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*(status|trend)/)'
    - id: metrics-aggregation-works
      why: Daily metrics aggregation is missing, incomplete or produces wrong totals
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*aggregat(e|ion)/)'
    - id: row-aggregation-works
      why: Row summation or grouping by counter/team/key is missing or incorrect
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*sum_|.*grouping/)'
    - id: guardrail-overview-works
      why: Overview row building is missing, metrics lookup fails or fallback rows are incorrect
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*overview/)'
    - id: policy-overview-works
      why: Policy overview rows are missing or policy_id lookup is incorrect
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*policy/)'
    - id: field-access-works
      why: Field extraction from mixed db/config guardrail records fails
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrail_usage_projections::.*field/)'
    - id: guardrail-usage-oracle
      why: The typed operation has no seed, the oracle helper fails or behavior tests are missing
      run: test -f tools/oracle/helpers/b3689.py && test -f tools/oracle/src/helpers/server/b3689.rs && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^guardrail_usage_projections::|replays_the_helper_case_corpus)' && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/guardrail-usage-projections-*)"
    - id: guardrail-usage-python
      why: The helper adapter is missing or strict Python checking fails
      run: test -f tools/oracle/helpers/b3689.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: guardrail-usage-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/guardrail-usage-projections-*)" && grep -rlq "guardrail_usage_projections" tools/oracle/fuzz/corpus/helper_case/guardrail-usage-projections-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

