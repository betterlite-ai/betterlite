id: B3689
title: Guardrail usage windows and dashboard aggregation
description: >-
  Validate dashboard date windows and aggregate daily guardrail/policy counters,
  trends and priced/unpriced units into response records. Keep database lookup
  and pure projection below the HTTP handlers.

  Implement aggregation helpers and response types in betterlite-server for
  usage dashboard queries:

  - Constants: usage_max_range_days = 366, empty_units immutable map.

  - resolve_usage_window: parse optional start/end date query params (YYYY-MM-DD
    format), validate format round-trips exactly, ensure end >= start, cap range
    at 366 days. Default to UTC today minus seven days when start_date is absent;
    return both as normalized strings. Reject with HTTP 400 bad_request on format
    error, out-of-order dates, or range overflow.

  - Row projection helpers: counter_name (usage_unit field), team_of (team_id),
    key_of (api_key). row_untracked_units: returns full units when cost is null,
    else untracked_units column. row_tracked_cost: returns cost only when cost is
    not null and untracked_units < total units; else null.

  - Aggregation helpers: sum_counter_units (group by counter, sum units per
    group), sum_untracked_units (group by counter, sum untracked_units, omit
    zero counts). sum_tracked_cost (sum costs where cost is not null and at
    least one unit is priced; return null when no priced row exists). by
    (generic groupby-reduce pattern: sort by key_of, group, apply reduce,
    collect keyed mapping). first_match (search lookup_keys in mapping in order,
    return first match or default).

  - metric aggregation: aggregate_daily_metrics groups rows by id_of, summing
    requests_evaluated, passed_count, blocked_count and flagged_count per id.
    prev_fail_rates groups previous-period rows by id_of, calculates (blocked /
    requests) fail rate per id. chart_from_metrics groups by date, sums passed
    and blocked counts, returns sorted list of {date, passed, blocked}.

  - Trend and status: status_from_fail_rate returns "critical" (>15%),
    "warning" (>5%), else "healthy". trend_from_comparison returns "up"
    (+0.5pp), "down" (-0.5pp), else "stable"; return "stable" when
    previous_fail_rate is zero.

  - Response types: UsageChartPoint {date, passed, blocked, ?score},
    UsageOverviewRow {id, name, type, provider, requestsEvaluated, failRate,
    ?avgScore, ?avgLatency, status, trend, usageUnits map, ?cost, untrackedUsageUnits},
    UsageOverviewResponse {rows, chart, totalRequests, totalBlocked, passRate,
    totalUsageUnits, ?totalCost, totalUntrackedUsageUnits}.

  - guardrail_overview_rows: builds overview rows from guardrails (db or config)
    and aggregated metrics/units/costs. Looks up metrics by guardrail display
    name (guardrail_name field) or guardrail_id (both as lookup keys, first match
    wins). Falls back to {requests: 0, passed: 0, blocked: 0, flagged: 0} when
    not found. Adds rows for metrics keys not in any guardrail (config/MCP
    guardrails with no db entry), setting id=key, name=key, type="Guardrail",
    provider="Custom". Omits metrics rows with zero requests.

  - policy_overview_rows: builds overview rows from policy records and
    aggregated metrics. Looks up metrics by policy_id. Returns rows with
    type="Policy", provider="LiteLLM", usageUnits and cost always empty/null.

  - Field access helpers: get_guardrail_field (overloaded for str fields
    guardrail_id/guardrail_name vs object fields litellm_params/guardrail_info;
    accesses db rows as struct attributes, config dicts as key lookups). to_dict
    (coerce BaseModel to dict via model_dump(exclude_none=True), pass-through
    dict, return empty dict otherwise). field_str (stringify mapping[key] or
    default when absent). get_guardrail_attrs (extract {guardrail_id, display
    name} pair from guardrail record; name falls back to id, then empty string).

