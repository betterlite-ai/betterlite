dod:
  - text: The prediction route returns 503 without a router, 404 for a missing or other-team deployment, and runs the model access check for both deployments before any prompt work.
    proof: [predict-tests, oracle]
  - text: Header, request-transform, prompt-shape, identity and limiter reasons win in the stated order and return 200 with only deployment_id and reason per arm and null deltas, without a provider call.
    proof: [predict-tests, oracle]
  - text: A comparison counts under the request_capacity guard for each count, reuses the stay arm when both deployments share one model_info.id, and lets a 429 from the guard become the response.
    proof: [predict-tests]
  - text: switch_delta and cache_rebuild_penalty are computed from estimate and warm costs and are null when an operand is missing; pricing_basis and cache_guarantee are fixed.
    proof: [predict-tests, oracle]
  - text: The prediction body rejects unknown fields and empty or over-256 ids with the shared 422 response.
    proof: [predict-tests, oracle]
  - text: The listing route checks the admin view role, then the cursor pair, then the database, then the date order, with the stated statuses and details.
    proof: [requests-tests, oracle]
  - text: The listing SQL has the exact filter clauses, token expressions, cache-hit exclusion, cursor test and ordering, with every value bound.
    proof: [sql-tests]
  - text: Rows map to requests with gateway_injected, token counts, spend and net_savings, and paging returns page_size rows, has_more and a next_cursor from the last returned row.
    proof: [requests-tests]
  - text: Query decoding applies the page_size range, the filter enum, naive datetimes as UTC and required start_date and end_date, and never panics on arbitrary query bytes.
    proof: [requests-tests, caching-query-corpus, oracle]
checks:
  optional: []
  commands:
    - id: predict-tests
      why: the prediction route tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prompt_cache_routes::predict::/)'
    - id: requests-tests
      why: the listing route tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prompt_cache_routes::requests::/) - test(/^prompt_cache_routes::requests::sql_/) - test(replays_the_caching_requests_query_corpus)'
    - id: sql-tests
      why: the listing SQL text tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prompt_cache_routes::requests::sql_/)'
    - id: caching-query-corpus
      why: the query decoder has no new fuzz replay samples
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/caching_requests_query)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_caching_requests_query_corpus)'
