deviations:
  - what: limiter_unavailable is returned only when betterlite's main rate limiter is absent from server state, not when a different limiter class is installed.
    why: betterlite has one limiter type (B5660 builds it at boot), so LiteLLM's isinstance test against the v3 handler has no second case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/prompt_cache_prediction.py#L103-L111
  - what: The oracle cases for the listing route stop at the 400, 422 and no-database 500 answers; the admin 403, the date-order 400, rows and paging are covered by native tests only.
    why: The oracle has no database for either gateway in the worker sandbox, so cases stop at the 500 database check.
out_of_scope:
  - "B3120 owns parse_prompt, B3121 owns supported_prediction_headers, count_prompt_tokens and TokenCounter, B3123 owns predict, the arm types and has_request_transforms, and B3122 owns observation lookup."
  - "B746 owns get_cache_prediction_deployments and the /cost/predict-cache model-candidate extraction for auth; B886 owns can_key_call_resolved_model."
  - "B3055 owns request_capacity and the 429 body; B1106 owns the two tag merges; B1100 owns the parsed-body cache."
  - "B1693 and B1694 own the usage extractors, marks_gateway_injection and prompt_caching_savings_for_request; B1726 and B700 own the spend-log query seam."
  - "B1650 and B1651 own the other routes of cost_tracking_settings.py and compose this module's routes without registering them again."
pitfalls:
  - A 429 from the capacity guard inside a token count is outside count_prompt_tokens' catch-all, so it fails the whole request instead of giving token_count_unavailable.
  - The same-id shortcut compares model_info.id of the two deployments, not their model names, and then reuses the stay arm without a second count.
  - Header reasons look at every request header; anthropic-version equal to 2023-06-01 passes, any other value or any anthropic-beta header turns both arms to unsupported_provider_headers.
  - An empty caller api_key gives caller_identity_unavailable only when the prompt shape is supported, because unsupported_prompt_shape is checked before it.
  - The cursor test is a row comparison (startTime, request_id), so rows with the same startTime page by request_id descending and none repeat or vanish.
  - The SQL excludes rows with cache_hit 'true' in any letter case, and treats a null cache_hit as not a hit.
  - NULLIF(candidate, 0) in the token SQL means a zero cache_read_input_tokens falls through to prompt_tokens_details.cached_tokens, and TRUNC means 0.9 counts as 0 for the filter.
  - The Rust extractors of B1693 run on the same usage_object after the SQL filter, so filter and displayed counts can differ for odd values; do not reconcile them.
  - A naive start_date or end_date or cursor_start_time is UTC, and an end_date equal to start_date is allowed.
  - The database check comes before the date-order check, so a reversed range with no database is 500, not 400.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
