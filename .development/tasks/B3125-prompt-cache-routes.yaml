id: B3125
title: Serve cache cost comparisons and paginated caching requests
description: >-
  Add the module `prompt_cache_routes` to betterlite-server with two routes and nothing else. The prediction
  route is POST /cost/predict-cache. The listing route is GET /cost_optimization/prompt_caching/requests. Both
  need a Bearer or master-key caller through the existing auth layer. Submodules: `predict` (handler and arm
  composition), `requests` (query decoding, SQL, row mapping, paging) and `error` (the module's error enum).
  This task adds betterlite-anthropic and betterlite-rate-limit to the server's Cargo.toml. It registers both
  routes itself. The settings-route task B1650 composes its router without re-registering /cost/predict-cache.

  Route one, POST /cost/predict-cache. The body type `CachePredictionRequest` has current_deployment_id and
  candidate_deployment_id (strings of 1 to 256 characters) and request (a JSON object); any other field is a 422.
  The response type `CachePredictionResponse` has stay, switch, switch_delta, cache_rebuild_penalty,
  pricing_basis (always "input_before_discounts_and_margins") and cache_guarantee (always false). The arm types
  belong to B3123; reuse them. Steps in this order, because the status codes depend on it. (1) No model router in
  server state: 503 with detail "Model router is unavailable". (2) Look both deployments up with B746's
  get_cache_prediction_deployments; a missing deployment, or one whose team_id is neither null nor the caller's
  team, is 404 with detail "Deployment not found". (3) For current then candidate, run B886's
  can_key_call_resolved_model on the deployment's model_name; its error propagates. (4) parse_prompt of B3120 on
  the request object. (5) Compute the reason. The caller key is the caller's hashed api_key. A caller whose
  resolved key settings have a non-empty `config`, or a process where B3123's has_request_transforms is true,
  is "unsupported_request_transform". The request headers fail B3121's supported_prediction_headers when
  anthropic-beta is present or anthropic-version differs from 2023-06-01. The reason precedence, first match
  wins: unsupported_provider_headers, unsupported_request_transform, unsupported_prompt_shape (prefix is None),
  caller_identity_unavailable (empty api_key), limiter_unavailable (no main rate limiter in state). With any
  reason, return 200 with stay for the current id and switch for the candidate id, each holding only
  deployment_id and that reason, and switch_delta and cache_rebuild_penalty null. No provider call happens.
  (6) Otherwise read the request body again through B1100's parsed-body cache. Rebuild the limiter request data:
  the parsed body plus the client-tag policy and key-tag merges of B1106 (apply_client_tag_policy_pre_auth, then
  apply_key_tags_pre_auth), because the cache keeps only the original top-level keys. (7) Call B3123's
  AnthropicCacheRouting::predict for the current deployment with a TokenCounter that, for every count, takes
  B3055's request_capacity guard (model = that deployment's model_name, the rebuilt data) and holds it while
  B3121's count_prompt_tokens runs. A 429 from the guard is not caught: it leaves the handler as the response.
  (8) When both deployments have the same model_info.id, switch is the same value as stay and no second
  prediction runs. Otherwise predict for the candidate the same way. (9) switch_delta is switch.estimate.input_cost
  minus stay.estimate.input_cost when both estimates exist, else null. cache_rebuild_penalty is
  switch.estimate.input_cost minus switch.warm.input_cost when both exist, else null. Costs are floats, not
  rounded.

  Route two, GET /cost_optimization/prompt_caching/requests. Query values: start_date and end_date (required,
  datetimes), page_size (integer 1 to 100, default 50), filter (all, injected or hits; default all),
  cursor_start_time (datetime) and cursor_request_id (non-empty string). Decode with `decode_requests_query`,
  the raw query string parser and the fuzz target. Datetimes follow pydantic: ISO 8601 with or without an offset
  (use the speedate crate the server already has) or a Unix number. A naive datetime means UTC. Any failure is
  the shared 422 response. Order of checks after decoding: (1) caller is not a proxy_admin or
  proxy_admin_viewer (B2314's user_api_key_has_admin_view): 403, detail "Only proxy admin roles can view prompt
  caching requests". (2) Exactly one of cursor_start_time and cursor_request_id: 400, detail "cursor_start_time
  and cursor_request_id must be provided together". (3) No database: 500 with the db_not_connected_error text
  from B2314/B1726's shared constant. (4) end before start: 400, detail "end_date must not be earlier than
  start_date". Then run the SQL below through B700's typed query interface (B1726 owns the same
  _query_raw_rows seam; do not build a parallel one) with page_size + 1 as the limit. The SQL selects request_id,
  startTime as start_time, endTime as end_time, model, model_id, custom_llm_provider, spend, usage_object and
  cost_breakdown (each only when the metadata value is a JSON object) and gateway_marker (the
  litellm_gateway_injected_cache metadata value when it is a string) from LiteLLM_SpendLogs. Filters: startTime
  between the two bounds inclusive, in UTC; cache_hit not equal to 'true' (a null cache_hit counts as 'false');
  the filter clause; and the cursor test (startTime, request_id) less than (cursor time, cursor id) when a
  cursor is given. Order by startTime descending, then request_id descending. The filter clauses are: hits means
  cache-read tokens > 0; injected means the gateway marker is a string that is empty or equals model_id; all
  means injected OR read > 0 OR creation > 0. The token expressions read metadata.usage_object: read is the
  first non-zero of cache_read_input_tokens and prompt_tokens_details.cached_tokens, creation is the first
  non-zero of cache_creation_input_tokens, prompt_tokens_details.cache_write_tokens and
  prompt_tokens_details.cache_creation_tokens. A candidate counts only when it is a JSON number (truncated) or a
  JSON boolean (true is 1), and no match gives 0. Build the SQL with bound parameters only; the filter picks
  from a closed enum of three fixed fragments.

  Each row becomes a `PromptCachingRequest`: request_id, start_time (UTC), model, gateway_injected
  (B1693's marks_gateway_injection with the marker and model_id), cache_read_tokens and cache_creation_tokens
  (B1693's extract_cache_read_tokens and extract_cache_creation_tokens on usage_object), spend and net_savings
  (B1694's prompt_caching_savings_for_request with model, provider, usage_object, model_id, the current router,
  cost_breakdown and end_time as billed_at; null when unavailable). The response `PromptCachingRequestsResponse`
  holds requests (the first page_size rows), page_size, has_more (more than page_size rows came back) and
  next_cursor. next_cursor is {start_time, request_id} of the last returned request when has_more, else null.
  Timestamps serialize as pydantic does: UTC with a trailing Z.

