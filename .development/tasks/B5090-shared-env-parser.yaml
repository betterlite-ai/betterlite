references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L115-L134
  why: >-
    LiteLLM's str_to_bool reads only true and false, one of the spellings docs/compatibility.md replaces with the one
    shared reading.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L200
  why: The Redis settings also take 1 and yes, the second spelling the shared parser replaces.
- url: https://rust-fuzz.github.io/book/cargo-fuzz.html
  why: Layout of a cargo-fuzz target and its corpus folder, which the betterlite-env fuzz crate follows.
dod:
- text: >-
    betterlite-env's flag reads true, false, 1, 0, yes, no, on and off in any case with spaces trimmed, returns None
    for empty or whitespace-only text, and returns an EnvError for anything else whose message names the variable and
    not the value.
  proof:
  - env-parser
- text: >-
    betterlite-env's number reads decimal text with spaces trimmed, returns None for empty text, and rejects inf, nan,
    underscores and hex with an EnvError that names the variable and not the value.
  proof:
  - env-parser
- text: betterlite-env has a cargo-fuzz target with a committed corpus, and a normal test replays every corpus file through flag and number.
  proof:
  - env-corpus
- text: EnvironmentLookup is defined once, in betterlite-env, and config and redis re-export it.
  proof:
  - one-lookup-trait
- text: >-
    Every env read listed in the description goes through flag or number: a padded mixed-case word reads as the bool,
    an empty value keeps the default, and bad text fails naming the variable without its value, in config, redis,
    redact, db, logging and cli.
  proof:
  - shared-env-sites
- text: >-
    The eight migrated files are off the no-python-habits ignores list, the other baseline entries stay, and ast-grep
    scan finds nothing.
  proof:
  - rule-baseline
- text: >-
    The oracle cases for LITELLM_MODIFY_PARAMS, DEFAULT_MAX_TOKENS, the database flags, the Datadog flags, the proxy
    trust flag and the Redis settings still match LiteLLM.
  proof:
  - oracle
checks:
  optional: [mutants]
  commands:
  - id: env-parser
    why: the shared parser reads a word or a number the policy does not allow, misses one it allows, or leaks the value into its error
    run: cargo nextest run --locked -p betterlite-env --no-tests=fail
  - id: env-corpus
    why: the fuzz corpus is missing or no test replays it
    run: test -n "$(ls crates/betterlite-env/fuzz/corpus/env_values)" && test -f crates/betterlite-env/fuzz/fuzz_targets/env_values.rs && cargo nextest run --locked -p betterlite-env --no-tests=fail -E 'test(/replays_the_env_values_corpus/)'
  - id: one-lookup-trait
    why: a crate still defines its own EnvironmentLookup trait
    run: |-
      grep -rqE 'pub trait EnvironmentLookup' crates/betterlite-env/src && test -z "$(grep -rlE 'trait EnvironmentLookup' crates --include=*.rs | grep -v '^crates/betterlite-env/')"
  - id: shared-env-sites
    why: a migrated env read has no test showing the shared reading, the default for an empty value, and an error without the value
    run: |-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/shared_env_(modify_params|default_max_tokens|os_environ_number|proxy_trust|redis_credential_flag|billing_interval)/)' && cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/shared_env_redis_coercion/)' && cargo nextest run --locked -p betterlite-redact --no-tests=fail -E 'test(/shared_env_sentry_settings/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/shared_env_token_auth_flag/)' && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/shared_env_datadog_flags/)' && cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/shared_env_keyring_disable/)'
  - id: rule-baseline
    why: a migrated file is still on the rule's baseline, or the scan finds a hit
    run: |-
      ! grep -nE 'betterlite-(config/src/proxy|config/src/sections/billing_metrics|config/src/sections/redis_credentials|cli/src/keyring|logging/src/datadog/tagging|redact/src/sentry/settings|db/src/database_url_policy/flag|redis/src/redis_connection_settings/coercion)\.rs' .ast-grep/rules/no-python-habits.yml && grep -qF 'crates/betterlite-config/src/sections/redis_credentials/provider.rs' .ast-grep/rules/no-python-habits.yml && ast-grep scan
oracle_cases:
- tools/oracle/cases/helpers/providers/provider-base-helpers/modify-params-default-and-env.yaml
- tools/oracle/cases/helpers/providers/provider-base-helpers/implicit-thinking-max-tokens.yaml
- tools/oracle/cases/helpers/database-url-policy/str-to-bool-on.yaml
- tools/oracle/cases/helpers/database-url-policy/str-to-bool-padded-true.yaml
- tools/oracle/cases/helpers/database-url-policy/strict-and-permissive-flags.yaml
- tools/oracle/cases/helpers/database-url-policy/token-auth-flag-invalid.yaml
- tools/oracle/cases/helpers/datadog/environment-tags.yaml
- tools/oracle/cases/helpers/proxy-policy/disabled-env.yaml
- tools/oracle/cases/redis/settings-coercion-boolean.yaml
- tools/oracle/cases/redis/settings-coercion-numeric.yaml
- tools/oracle/cases/redis/settings-direct.yaml
- tools/oracle/cases/redis/settings-env-precedence.yaml
deviations: []
out_of_scope:
- The Azure AD token sentinel compared with "true" in config's sections/redis_credentials/provider.rs and redis's iam.rs; the value is a token, not a bool field, and both files stay on the baseline.
- Pydantic-style lax bools for YAML, database rows, query strings and SCIM (scheduled_job_stagger, identity_rows, model_query, scim lax_bool), and the JSON truthiness helper in settings/coerce_bool.rs.
- Every python_*, truthy and falsy helper that is not one of the eight files; they stay on the baseline until their own task.
- Rejecting YAML text for a field LiteLLM declares as a number; resolve_number keeps today's parser for literal YAML text.
- String-valued os.environ/ references; an empty variable behind a string field keeps reading as an empty string.
- Merging redis's os_environ.rs reference resolver with config's resolve_string.
pitfalls:
- Three oracle cases send values the old readings and LiteLLM agree on but the shared parser reads differently. modify-params-default-and-env.yaml sends "false" (LiteLLM's bool(os.getenv(...)) answers True); change both its env and environment to "true". str-to-bool-on.yaml sends "on" (LiteLLM's db str_to_bool answers False); change its value to "yes". environment-tags.yaml sends USE_DDPROFILER "1" (LiteLLM answers false); change it to "false" and keep USE_DDTRACE " TRUE ".
- token-auth-flag-invalid.yaml stays as it is; B5091 stops comparing helper error messages, so the new message without the value still matches on status, type, param and code.
- Unit tests pin the old readings and change with them, among them base_helpers/tests.rs modify_params_default_and_env (it asserts "false", "0" and " " turn modify_params on), the db tests that assert the python_repr message for 'maybe', and the redis and billing tests for PEP 515 underscores.
- No one-line helpers or wrappers around flag and number; call them where the value is read.
- worker.md forbids editing a crate's lib.rs unless the scope lists the whole crate. The new crate is listed whole; every other crate keeps its lib.rs, which is why config and redis re-export the trait from loader.rs and environment.rs.
- The betterlite-http proxy_policy fuzz target now gets a Result; it skips an Err instead of unwrapping it, since the fuzzer feeds invalid trust values on purpose.
- The fuzz crate under crates/betterlite-env/fuzz needs its own empty [workspace] table like betterlite-paths-fuzz; without it cargo treats it as an unlisted package inside the workspace and refuses to build it.
- ChatSetupError in chat_setup.rs gains one variant for EnvError, next to its DeploymentError and HttpError variants.
review_level: standard
budget:
  max_changed_lines: 1800
  max_new_expects: 0
