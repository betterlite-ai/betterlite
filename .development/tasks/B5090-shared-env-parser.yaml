id: B5090
title: One shared parser for env and os.environ/ values
description: >-
  docs/compatibility.md says env vars and os.environ/ references are the one place where text turns into a bool or a
  number, and one shared parser does it for every field. A bool reads true, false, 1, 0, yes, no, on or off in any
  case, a number reads in decimal notation, spaces around the value are trimmed, an empty env var counts as unset, and
  anything else is a load error that names the variable. Today eight files each spell their own reading and they
  disagree. config's loader.rs turns LITELLM_MODIFY_PARAMS on for any non-empty value, "false" included, and trims
  DEFAULT_MAX_TOKENS before parsing it as i64. config's proxy.rs reads DISABLE_AIOHTTP_TRUST_ENV and AIOHTTP_TRUST_ENV
  as true only for "true" after a trim. config's sections/redis_credentials.rs coerces_to_true takes "true", "1" and
  "yes" without a trim. config's sections/billing_metrics.rs parse_python_int reads
  LITELLM_BILLING_METRICS_EXPORT_INTERVAL_MS with Python's PEP 515 underscores and warns and falls back on a bad value.
  cli's keyring.rs takes 1, true, yes and on for LITELLM_CLI_DISABLE_KEYRING. logging's datadog/tagging.rs takes only
  "true" for USE_DDTRACE and USE_DDPROFILER. redact's sentry/settings.rs takes only "true" for SENTRY_SEND_DEFAULT_PII
  and has its own parse_env_value for the rates and key lengths. db's database_url_policy/flag.rs has str_to_bool (true,
  1, t, y, yes, never fails) and token_auth_flag_enabled (1, on, t, true, y, yes and their opposites, else
  NotRecognized with the value in the message). redis's redis_connection_settings/coercion.rs coerce_int and
  coerce_float strip PEP 515 underscores, coerce_bool takes true, 1 and yes, and a bad value is dropped without a word.
  There are also two copies of the EnvironmentLookup trait, one in config's loader.rs and one in redis's
  redis_connection_settings/environment.rs.


  Add a leaf crate crates/betterlite-env with license.workspace = true, [lints] workspace = true and no betterlite
  dependency. It holds the one EnvironmentLookup trait (fn lookup(&self, name: &str) -> Option<String>) and its
  BTreeMap<String, String> impl, moved from config's loader.rs. config's loader.rs and redis's environment.rs replace
  their trait with pub use betterlite_env::EnvironmentLookup, so every caller that names
  betterlite_config::loader::EnvironmentLookup or the redis path keeps compiling unchanged. The crate also holds two
  parsers. flag(name, text) -> Result<Option<bool>, EnvError> trims the text, returns Ok(None) for empty text, reads
  the eight words above in any ASCII case, and returns EnvError for anything else. number::<T: FromStr>(name, text) ->
  Result<Option<T>, EnvError> trims, returns Ok(None) for empty text, accepts only the characters 0-9, +, -, . and e or
  E before handing the text to T::from_str, and returns EnvError for anything else, so inf, nan, 1_000 and 0x10 are all
  errors. EnvError (thiserror) carries the name the caller passed and what it expected (a bool or a number), and its
  message names the variable and never the value, since an env value can be a secret. Each caller maps EnvError into
  its own error type.


  Move every site above onto those two parsers. In config, environment_defaults reads LITELLM_MODIFY_PARAMS through
  flag (the configured value still wins, unset still means false) and DEFAULT_MAX_TOKENS through number::<i64>
  (unset still means 4096), and ConfigError gains one variant that wraps EnvError. resolve.rs's resolve_number reads
  the value of an os.environ/ reference through number, so an empty variable leaves the field unset (Ok(None)) and bad
  text is that ConfigError variant; literal YAML text keeps today's parser. ProxyPolicy::resolve reads both trust
  flags through flag and returns Result<Self, EnvError>; chat_setup.rs in betterlite-server propagates it, and the
  tests, the betterlite-http proxy_policy fuzz target and the oracle adapter take the Result. redis_credentials.rs's
  config_or_environment_flag reads ScalarBool::Text through flag, from the environment and from config alike, and
  coerces_to_true goes away. billing_metrics.rs reads the export interval through number::<i64>, unset keeps the
  default, bad text is a load error instead of a warning, and parse_python_int goes away. KeyringVault::with_api and
  KeyringVault::new return Result<Self, EnvError>, unset still means the keyring stays on. Environment::from_lookup in
  datadog/tagging.rs returns Result<Self, EnvError>. sentry/settings.rs reads SENTRY_SEND_DEFAULT_PII through flag and
  the rates and key lengths through number, and parse_env_value goes away. In db, token_auth_flag_enabled reads
  FlagValue::Text through flag (unset or empty is false, as today), keeps TokenFlagError::NotRecognized with a message
  that names the variable and not the value, and str_to_bool goes away; the oracle adapter's str_to_bool function calls
  betterlite_env::flag directly. python_repr in python_repr.rs loses its only caller, so drop that function and keep
  format_float. In redis, the Coerce impls for bool, i64 and f64 read Scalar::Text through flag and number and return
  the error instead of None, so a bad REDIS_* value or kwargs text is a RedisSettingsError naming the setting, and
  strip_grouping_underscores goes away.


  The eight files above come off the ignores list of .ast-grep/rules/no-python-habits.yml: config src/proxy.rs,
  src/sections/billing_metrics.rs and src/sections/redis_credentials.rs, cli src/keyring.rs, logging
  src/datadog/tagging.rs, redact src/sentry/settings.rs, db src/database_url_policy/flag.rs, and redis
  src/redis_connection_settings/coercion.rs. ast-grep scan must stay clean with them off the list, and every other
  baseline entry stays.


  Each migrated crate gets tests named with the shared_env_ prefix: shared_env_modify_params,
  shared_env_default_max_tokens, shared_env_os_environ_number, shared_env_proxy_trust, shared_env_redis_credential_flag
  and shared_env_billing_interval in config, shared_env_redis_coercion in redis, shared_env_sentry_settings in redact,
  shared_env_token_auth_flag in db, shared_env_datadog_flags in logging and shared_env_keyring_disable in cli. Each one
  shows that " Yes " or " OFF " reads as the bool, that an empty value keeps the default, and that "maybe" for a bool
  or "1_000" for a number fails with an error whose text names the variable and does not contain the value.


  Add crates/betterlite-env/fuzz the way crates/betterlite-paths/fuzz is built: its own Cargo.toml with an empty
  [workspace], a target fuzz_targets/env_values.rs that feeds arbitrary UTF-8 to flag, number::<i64>, number::<u32> and
  number::<f64>, and a committed corpus under fuzz/corpus/env_values with at least the eight words in mixed case,
  padded values, empty and whitespace-only text, inf, nan, 1_000, 0x10, 1e3, -0 and a value with a zero-width space. A
  test named replays_the_env_values_corpus in betterlite-env reads every corpus file and runs it through the same four
  calls.
scope:
  paths:
  - crates/betterlite-env/**
  - Cargo.lock
  - crates/betterlite-config/Cargo.toml
  - crates/betterlite-config/src/loader.rs
  - crates/betterlite-config/src/resolve.rs
  - crates/betterlite-config/src/proxy.rs
  - crates/betterlite-config/src/proxy/tests.rs
  - crates/betterlite-config/src/sections/billing_metrics.rs
  - crates/betterlite-config/src/sections/billing_metrics/tests.rs
  - crates/betterlite-config/src/sections/redis_credentials.rs
  - crates/betterlite-config/src/sections/redis_credentials/tests.rs
  - crates/betterlite-config/src/tests/**
