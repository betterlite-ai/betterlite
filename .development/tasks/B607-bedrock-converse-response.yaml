  commands:
  - id: case-converse-reply-envelope
    why: The converse-reply-envelope behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::converse_response_cases::case_[0-9]+_converse_reply_envelope$/)'
  - id: case-stop-reasons
    why: The stop-reasons behavior is missing or differs from its pinned fixture.
