id: B607
title: Bedrock Converse response conversion
description: >-
  Add ConverseReply decoding and final ChatResponse transformation, including stopReason, model/id metadata, provider
  fields, headers and fake-stream capability. Consume already typed content/usage helpers and retain source status/type/code/param
  on errors.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig.transform_response L2079-L2105; AmazonConverseConfig._transform_response L2527-L2702; AmazonConverseConfig.get_error_class
  L2704-L2709; AmazonConverseConfig.validate_environment L2711-L2724; AmazonConverseConfig.should_fake_stream L2726-L2752.


  Reuse bedrock_request_metadata_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Reuse merge_bedrock_invoke_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation remains
  with that prerequisite.


  Named case contracts: converse_reply_envelope: Post-call log before decode through B190 with input=messages,api_key,response.text
  and complete_input_dict=data. Resolved json_mode is explicit argument whenevernon-None (false suppresses options),
  otherwise optional_params value. Build output from required completion.output.message; explicit messageNone allowed
  ->emptytext/no tools, missing output/message fails outside decodecatch. Ignore provider message.role and emit
  assistant. Set one choiceindex0, created=int injectedtime, model=requestedmodel and B605 usage; preserve supplied
  response.id, never copy a provider id or fabricate a new id here. stop_reasons: B206 map_finish_reason consumes
  required stopReason. If truthy resolvedjsonmode removed all synthetics and original toolsnonempty, forcestop.
  Then B606 textual function recovery may change it back to tool_calls if resulting JSON names an optional tool.
  Retain this ordering and exact real/synthetic tool cases from B606. metrics_headers: Metrics, ordinary response
  headers and arbitrary top-level fields are not projected by this function; headers only go to BedrockError on
  conversion failure. Existing response fields survive unless explicitly replaced. Do not add metrics/headers to
  provider_specific_fields from this helper. additional_model_fields: Preserve raw reasoningContentBlocks/citationsContent
  under message.provider_specific_fields whenever listnon-None, then B605 reasoning/thinking projections. Only use
  additionalModelResponseFields for B605 reasoning count, not wholesale passthrough. If trace key exists set response.trace
  evenNone. If serviceTier isdict and contains type, set service_tier to rawtype evenNone/empty; otherwise leave
  existing value. fake_stream_capability: Explicit fake_stream is literal True ->true regardless model/stream. Else
  stream literal True plus modelnon-None containing case-sensitive ai21 ->true. Falsey/nonbooleanstream and othermodels
  ->false; custom_llm_provider ignored. This is selection only, no upstream stream opened. malformed_json: Only
  response.json or ConverseResponseBlock(**value) errors inside the initial try map to BedrockError422 Error converting
  to valid response block=<error>. File an issue if litellm error - https://github.com/BerriAI/litellm/issues with
  upstream headers. TypedDict construction does not validate required fields; missing output/usage/stopReason and
  malformed later content retain their later failure path, not this422. get_error_class delegates B682 suppliedstatus/message/headers
  with no fabricated param/code. tool_calls_response: Compose B606 text/tool/reasoning/citation parsing, json-mode
  filtering, B605 usage then textual function recovery; preserve per-block tool index, real-tool ordering and preexisting
  responseid. Source stream/encoding are unused in buffered conversion; they do not alter the returned envelope.
  citation_content_alignment: B606 citations text replaces whitespace-only normaltext entirely. If normaltext stripped
  has no alphanumeric Unicode character, prepend citedtext to original unstripped punctuation text. Only these two
  insertion cases add normalized annotations. Existing alphanumeric text keeps its own content with no annotations,
  even when identical to citedtext. Raw citations remain in provider_specific_fields in everycase. auth_and_metadata_headers:
  Truthy explicit api_key mutates canonical Authorization=Bearer <key>; empty/None leaves existing headers. No env
  lookup here. Then B596 metadata-header merge owns/evicts every case variant when optedin, evenempty resolution,
  or forwards unowned headers unchanged. Replay B596 owned-empty and compactJSON header cases through this function;
  APIbase/model/messages/options do not alter headers.


  Write standalone Rust test converse_response_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test converse_response_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-bedrock/src/converse_response.rs with adjacent tests under converse_response/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_response_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): converse_reply_envelope, stop_reasons, metrics_headers, additional_model_fields, fake_stream_capability,
  malformed_json, tool_calls_response, citation_content_alignment, auth_and_metadata_headers. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_response* using HelperCase:
  kind: helper and the externally tagged bedrock_converse_response variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_response that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  Outside-byte boundary: decode_converse_reply consumes Converse response JSON bytes in crates/betterlite-bedrock/src/converse_response.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_converse_response.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_converse_response.
  The adjacent test replays_the_bedrock_converse_response_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 208 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 280 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 60 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 730 planned, 750 maximum changed lines.
