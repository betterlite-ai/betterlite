id: B607
title: Bedrock Converse response conversion
description: >-
  Add ConverseReply decoding and final ChatResponse transformation, including stopReason, model/id metadata, provider
  fields, headers and fake-stream capability. Consume already typed content/usage helpers and retain source status/type/code/param
  on errors.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig.transform_response L2079-L2105; AmazonConverseConfig._transform_response L2527-L2702; AmazonConverseConfig.get_error_class
  L2704-L2709; AmazonConverseConfig.validate_environment L2711-L2724; AmazonConverseConfig.should_fake_stream L2726-L2752.


  Reuse bedrock_request_metadata_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Reuse merge_bedrock_invoke_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation remains
  with that prerequisite.


  Implement crates/betterlite-bedrock/src/converse_response.rs with adjacent tests under converse_response/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_converse_response in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_response_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): converse_reply_envelope, stop_reasons, metrics_headers, additional_model_fields, fake_stream_capability,
  malformed_json, tool_calls_response. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and captured
  upstream request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_response* using HelperCase:
  kind: helper and the externally tagged bedrock_converse_response variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_response that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  Outside-byte boundary: decode_converse_reply consumes Converse response JSON bytes in crates/betterlite-bedrock/src/converse_response.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_converse_response.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_converse_response.
  The adjacent test replays_the_bedrock_converse_response_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 208 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 235 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 506 planned, 525 maximum changed lines.
