pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_invoke_events in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/invoke_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_invoke_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The legacy exported selector lacks the Moonshot branch and drops json_mode for the base decoder.
- MockResponseIterator marks itself done before parsing, so a failed first next cannot be retried.
