id: B609
title: Bedrock Invoke provider and JSON-mode streams
description: >-
  Implement BedrockStream composition above B599 framing and B608 base chunk projection, with Anthropic, DeepSeek
  and OpenAI-compatible decoder selection. Keep the two public selector variants distinct, preserve sync/async event
  ordering and EOF diagnostics, and provide the one-chunk buffered fake-stream projection.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/__init__.py:
  get_bedrock_event_stream_decoder L9-L25. litellm/llms/bedrock/chat/invoke_handler.py: _stream_decoder L169-L182;
  AWSEventStreamDecoder.iter_bytes L745-L765; AWSEventStreamDecoder.aiter_bytes L767-L786. litellm/llms/bedrock/chat/invoke_handler.py:
  AmazonAnthropicClaudeStreamDecoder.__init__ L817-L833; AmazonAnthropicClaudeStreamDecoder._chunk_parser L835-L836;
  AmazonDeepSeekR1StreamDecoder.__init__ L840-L853; AmazonDeepSeekR1StreamDecoder._chunk_parser L855-L856; AmazonOpenAICompatibleStreamDecoder.__init__
  L860-L871; AmazonOpenAICompatibleStreamDecoder._chunk_parser L873-L874; MockResponseIterator.__init__ L878-L881;
  MockResponseIterator.__iter__ L884-L885; MockResponseIterator._handle_json_mode_chunk L887-L913; MockResponseIterator._chunk_parser
  L915-L953; MockResponseIterator.__next__ L955-L959; MockResponseIterator.__aiter__ L962-L963; MockResponseIterator.__anext__
  L965-L969. litellm/llms/bedrock/chat/invoke_transformations/amazon_deepseek_transformation.py: AmazonDeepseekR1ResponseIterator.__init__
  L83-L85; AmazonDeepseekR1ResponseIterator.chunk_parser L87-L121.


  Reuse ModelResponseIterator.__init__ from B581 (litellm/llms/anthropic/chat/handler.py); its implementation remains
  with that prerequisite.


  Own the DeepSeek streaming iterator here alongside provider stream selection, so B612 does not depend back on
  B615 buffered response normalization.


  Named case contracts: claude3_invoke_stream: Anthropic constructor initializes B608 base with model only, then
  B581 Anthropic iterator with streaming_response=None,sync_stream and supplied json_mode. chunk_parser delegates
  B582 (not B583 SSE parser) with parsed chunk. Replay B581/B582 empty-tool, thinking/signature, usage and JSON-mode
  cases at this delegation seam; no duplicate Anthropic mapping. json_mode_tool_chunk: MockResponseIterator json_mode
  literal True plus tool_calls non-None invokes B578 _convert_tool_response_to_message; if it returns message, replace
  text with message.content-or-empty and no tool. If it returns None, preserve text but still suppress real tool
  use. With json_mode false, _handle_json_mode_chunk returns first nonempty tool, but outer _chunk_parser independently
  indexes first tool whenever listnon-None; empty list therefore raises. Source synthetic conversion handles only
  first json_tool_call payload, matching B578. json_mode_stop: Fake stream projects choices[0] content-or-empty,
  first tool only (index0), required usage prompt/completion/total only, is_finished=true and B206 mapped original
  finish_reason-or-empty. Even JSON-mode conversion retains mapped original finish reason; do not force stop as
  B607 does. Iter/aiter return self; next/anext share is_done, set it before parsing, and yield at most one chunk,
  including failure then stop. empty_tool_input: Buffered tool projection preserves exact function.arguments, including
  empty string; it does not synthesize{} like B608 stop logic. Missingusage/choice/tool fields and empty non-None
  tool list become ValueError Failed to decode chunk: <chunk>. Error: <error>. Apply shared secret-redaction at
  outward boundary and preserve typed underlying failure. deepseek_stream_chunks: Constructor initializes BaseModelResponseIterator
  via B004 and has_finished_thinking=false. Require generation and stop_reason. Exactly first generation=</think>
  before transition logs Deepseek r1: </think> received, setting has_finished_thinking to True, switches state and
  yields emptycontent; other text including <think>, embedded/fragmented delimiter remains reasoning. After transition
  generation emits content, reasoning=None, and later </think> emitted literally. prompt_token_count/generation_token_count
  use value-or-0 and sum, preserving provided negative numbers. stop_reason passed raw, no map_finish_reason; no
  explicit id/model/role added beyond wire defaults. Exceptions rethrow unchanged. stream_selector_variants: _stream_decoder
  selects Anthropic for exact anthropic with model/sync/json_mode; DeepSeek for deepseek_r1 with model/sync only;
  Moonshot for moonshot via OpenAI-compatible model/sync; otherwise base B608 with supplied json_mode. get_bedrock_event_stream_decoder
  only special-cases anthropic/deepseek_r1: moonshot and every other provider use base B608 with default json_mode=false,
  ignoring supplied flag. Do not collapse these selectors into one table. openai_compatible_invoke_stream: Moonshot
  constructor initializes base B608 then B504 OpenAIChatCompletionStreamingHandler with streaming_response=None
  and sync flag; delegates parsed chunk unchanged to B504. Explicit selector path honors OpenAI-shaped delta/tool/usage
  frames, while legacy get_bedrock_event_stream_decoder moonshot path intentionally remains base dispatch. framing_iteration_and_eof:
  Both iter_bytes/aiter_bytes call B599 framing/tally, count event before parse, skip falsey decoded text, json-decode
  truthy text and yield chosen provider projection once per event, even when that projection is empty. Surface malformed
  JSON and invalid provider payload errors without fabricating a success. On EOF replay exact B599 no-events/leftover-bytes502
  cases including headers and first 200-byte diagnostic; complete but ignored events count as successful framing.
  Preserve already-emitted chunks before a late error.


  Titan/Mistral/base provider branch behavior belongs to B608 invoke_chunk_provider_dispatch and is reused through
  framing_iteration_and_eof; do not keep redundant selector cases that exercise no new outcome. BaseModelResponseIterator
  initialization belongs B2214; its common iteration/closure belongs B010. Both iterators keep no additional SSE
  parser; they decode AWS-framed JSON only.


  Outside-byte boundary: decode_bedrock_event_json consumes UTF-8 JSON payload bytes returned by B599 for framed
  Bedrock events; both sync and async iteration call this exact decoder before selecting the provider projection
  in crates/betterlite-bedrock/src/invoke_events.rs or its scoped child module. Use that production decoder from
  the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_invoke_events.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_bedrock_invoke_events_corpus
  that checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Direct constructor/helper prerequisites used by this slice: B2201. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/invoke_events.rs with adjacent tests under invoke_events/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_events_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  claude3_invoke_stream, json_mode_tool_chunk, json_mode_stop, empty_tool_input, deepseek_stream_chunks, stream_selector_variants,
  openai_compatible_invoke_stream, framing_iteration_and_eof. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_events* using HelperCase: kind:
  helper and the externally tagged bedrock_invoke_events variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_invoke_events that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 231 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 285 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 60 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
