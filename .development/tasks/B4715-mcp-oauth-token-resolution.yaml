id: B4715
title: MCP OAuth token refresh, resolution and invalidation
description: >-
  Build refresh and cache-aware access-token resolution above credential persistence and
  identity-binding validation. Store and refresh per-user OAuth2 tokens, compare decrypted
  mint-relevant server identity before purging stale tokens, retain BYOK rows when server
  configuration changes, and preserve refresh/cache failure fallbacks. Implement seven
  token-lifecycle functions. _decrypted_credential_field extracts a single decrypted field
  from a credential dict. mcp_oauth_token_identity extracts the tuple of server fields
  determining a minted token's validity. purge_user_oauth_credentials_for_server deletes
  stored per-user tokens after a server's OAuth configuration changes, comparing decrypted
  identity and filtering OAuth rows only while retaining BYOK. refresh_user_oauth_token POSTs to
  the server's token_url with grant_type=refresh_token and stores the new credential. resolve_valid_user_oauth_token
  checks expiry and refreshes if needed. resolve_user_oauth_access_token combines Redis
  cache for non-binding enforced servers, DB lookup and refresh. _remaining_token_seconds
  parses an expires_at ISO 8601 string and returns seconds-until-expiry or None.
  The purge uses _decode_oauth_payload to distinguish OAuth rows from BYOK, so purged rows
  share a single delete_many by (user_id, server_id) pair rather than blanket server_id.
  Purging enumerated users while a concurrent write targets a new user survives as expected;
  a re-auth completing for an already-enumerated user gets deleted with the stale row. The
  refresh builds a token_request via build_upstream_oauth2_token_request (Q2), enforces
  identity binding through enforce_oauth_identity_binding (Q3), stores via store_user_oauth_credential
  with skip_byok_guard=True to skip the redundant find_unique, reads back via get_user_oauth_credential,
  and retries on failure (returning None to signal re-auth). Resolve_valid_user_oauth_token
  checks binding before testing grant state and refresh, using oauth_grant_state to detect
  expiry within MCP_PER_USER_TOKEN_EXPIRY_BUFFER_SECONDS (Q2). Resolve_user_oauth_access_token
  reads the Redis cache only when binding is not enforced (Q3), calls get_token for binding-enforced
  servers and credential_binding_matches to validate before returning (Q3), warms the cache with
  _compute_per_user_token_ttl (Q2), and swallows all errors to None. Preserve the two refresh paths:
  one inline from resolve_user_oauth_access_token when binding is enforced and the token is stale,
  and one from resolve_valid_user_oauth_token when no binding is enforced. When a refresh fails or
  the token is expired with no refresh_token, delete the Redis entry and return None.

  Cache invalidation. This task owns the manager's invalidate_user_oauth_token_cache (mcp_server_manager.py L6379-L6403), because it already holds the per-user token cache the resolver reads and warms. The Rust name is `invalidate_user_token_cache` (33 characters is too long), in module oauth_token_resolution as `pub async fn invalidate_user_token_cache(caches: &impl UserTokenCaches, user_id: &str, server_id: &str)`. The trait `UserTokenCaches` (same module) has `invalidate_discovery_lists(&self, server_id)` (sync, LiteLLM's _invalidate_discovery_lists), `invalidate_oauth_store(&self, user_id, server_id)` (the v2 chain store) and `delete_legacy(&self, user_id, server_id)` (the legacy mcp_per_user_token_cache), the last two async and returning a cache error. The function drops the discovery lists first, then the v2 store, then the legacy cache. A failure of either cache call is logged with `tracing::warn!` using LiteLLM's texts ("Failed to invalidate cached MCP OAuth token for user=.. server=..: ..", "Failed to drop legacy cached MCP OAuth token for user=.. server=..: ..") and never returned, and the second call still runs after the first failed. purge_user_oauth_credentials_for_server calls it for each purged user. B4723 calls it after storing or revoking an OAuth credential. The real UserTokenCaches is wired at the composition root.

  Identity binding port. betterlite-mcp depends on betterlite-db, so this task cannot import B4659 (betterlite-mcp). It declares the trait `OauthBindingPort` in module oauth_token_resolution with associated types `Server`, `Ownership` and `Denied`, and two methods: `async fn enforce(&self, server: &Self::Server, token_response: &serde_json::Map<String, serde_json::Value>, user_id: Option<&str>, grant_type: &str, ownership: Option<&Self::Ownership>) -> Result<Option<String>, Self::Denied>` (LiteLLM enforce_oauth_identity_binding) and `async fn proof_matches(&self, server: &Self::Server, user_id: &str, stored_proof: Option<&str>) -> bool` (LiteLLM credential_binding_matches). refresh_user_oauth_token, resolve_valid_user_oauth_token and resolve_user_oauth_access_token take the port as a generic parameter and call only these two methods. B4659 implements the trait for its IdentityBinder in betterlite-mcp, and the composition root passes it in. Tests use a fake port that records its calls and returns canned results.

