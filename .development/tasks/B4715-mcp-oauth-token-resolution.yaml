deviations:
- what: >-
    On purge, a row inserted while the purge runs for a user not yet enumerated survives. A re-auth completing for an already-enumerated user is deleted along with the stale row.
  why: The purge enumerates rows once, then deletes by (user_id, server_id) pair, creating a race window. Treating this as acceptable.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1809-L1832

out_of_scope:
- credential_binding_matches validates a credential against a binding proof. B4659 implements it behind OauthBindingPort in betterlite-mcp.
- enforce_oauth_identity_binding verifies token response and binding proof construction. B4659 implements it behind OauthBindingPort in betterlite-mcp.
- RefreshTokenPresented is the refresh-token proof type passed to enforce_oauth_identity_binding. Definition is a missing types Q1.
- build_upstream_oauth2_token_request constructs token request headers/body given server and client auth method. Its implementation is a missing callees Q2.
- mcp_per_user_token_cache.get, get_token, set and delete operations belong to Q3's token-store adapter.
- _compute_per_user_token_ttl computes the per-server expiry buffer. Its implementation is a missing callees Q2.
- The UserTokenCaches implementation (the concrete v2 store, legacy cache and discovery caches) is wired at the composition root; this task owns only invalidate_user_token_cache and the trait.
- proxy.utils.get_prisma_client_or_throw is the generic DB accessor. Its implementation is a missing callees Q6.
- _load_stored_refresh_token loads a refresh token for identity binding validation. Implementation belongs to B4713, not this task.

pitfalls:
- mcp_oauth_token_identity must compare client_id and client_secret decrypted, since NaCl encryption uses a fresh nonce on every write.
- purge_user_oauth_credentials_for_server filters by _decode_oauth_payload result, not by a credential type field; only OAuth rows are deleted.
- refresh_user_oauth_token must skip the find_unique BYOK guard when storing, since the row is already OAuth2.
- resolve_valid_user_oauth_token returns None on binding enforcement failure, signaling caller to clear and re-auth.
- resolve_user_oauth_access_token must delete the Redis entry when refresh fails or token expires with no refresh_token, so next request does not reuse stale data.
- When prefetched_creds is supplied to resolve_user_oauth_access_token, the Redis cache is bypassed entirely; never warm it from a DB read when prefetch is provided.
- _remaining_token_seconds returns None for past/unparseable expires_at; a token with no expiry is treated as valid indefinitely.

