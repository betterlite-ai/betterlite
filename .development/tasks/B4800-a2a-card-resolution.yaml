dod:
  - text: Card discovery via three probe paths returns the first successful card.
    proof: [card-resolver-tests]
  - text: Discovery with a supplied relative path bypasses probing and uses that path only.
    proof: [card-resolver-tests]
  - text: Discovery failure lists all attempted paths and non-404 status codes in order.
    proof: [card-resolver-tests]
  - text: Localhost/internal URL detection function matches all LiteLLM patterns and is available for use by B4813.
    proof: [localhost-patterns]
  - text: Lowercase protocol bindings are uppercased and trigger version downgrade to 0.3.
    proof: [card-resolver-tests]
  - text: A2AError and all subclasses have the correct status codes and type fields matching LiteLLM.
    proof: [error-tests]
  - text: Error messages use betterlite's own wording and are never copied from LiteLLM.
    proof: [error-tests]
  - text: Localhost patterns match LiteLLM's LOCALHOST_URL_PATTERNS constant exactly.
    proof: [localhost-patterns]
checks:
  optional: []
  commands:
    - id: card-resolver-tests
      why: card resolver behavior tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^card_resolver_behavior($|::)/)'
    - id: error-tests
      why: error type tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^a2a_error($|::)/)'
    - id: localhost-patterns
      why: localhost pattern matching does not match LiteLLM
      run: grep -qE '"localhost"|"127\.0\.0\.1"|"0\.0\.0\.0"|"::"' crates/betterlite-a2a/src/errors.rs || grep -qE 'localhost|127\.0\.0\.1|0\.0\.0\.0|::' crates/betterlite-a2a/src/card_resolver.rs
oracle_cases: []
deviations:
  - what: >-
      Error messages are in betterlite's own wording instead of LiteLLM's "litellm.A2AError: ..." prefix.
    why: betterlite errors never credit LiteLLM in their text (rule litellm-boundaries), and messages name betterlite's own component names.
  - what: >-
      Card discovery probes in order: /.well-known/agent-card.json, /.well-known/agent.json, /agentCard/v1.0.
    why: Probe order and path choices match LiteLLM's source, not arbitrary sequences.
out_of_scope:
  - a2a_protocol/card_resolver.py:130-158 (fix_agent_card_url), owned by no caller at the pin; active retry calls set_agent_card_url instead.
  - A2A SDK protobuf conversion and transport, sourced from the a2a crate's own contract.
  - Request retries and policy, owned by B4801 (native client transport).
pitfalls:
  - Localhost detection is substring-based, matching patterns anywhere in the URL (case-insensitive match for localhost, not path-suffix only).
  - LOCALHOST_URL_PATTERNS must be read from litellm/constants.py:584 and the pattern list; do not invent URLs that look internal.
  - Protobuf AgentCard mutation (CopyFrom, field assignment) requires types from the a2a crate at its version; confirm the proto layout matches before mutation.
  - First non-404 status means the first response that is not 404; all non-response failures (network, timeout, parse) are collected and reported in the error.
  - Interface normalization triggers on lowercase bindings anywhere in the binding string, not just an exact lowercase match.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
