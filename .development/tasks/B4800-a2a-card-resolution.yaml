id: B4800
title: A2A card resolution and protocol errors
description: >-
  Build A2A agent card discovery from three probe paths and typed errors for the protocol layer.

  Card discovery probes /.well-known/agent-card.json, /.well-known/agent.json, then /agentCard/v1.0 in order using the injected HTTP pool from B173, returning the first successful response or raising A2AAgentCardDiscoveryError with all failures. A supplied relative path bypasses probing. Provide localhost/internal URL detection (matching localhost, 127.0.0.1, 0.0.0.0 and their variants) for use by B4813 when classifying connection errors. Normalize agent card interfaces by uppercasing lowercase protocol bindings like "jsonrpc" to "JSONRPC", detecting spec-adjacent servers and downgrading their protocolVersion to 0.3 when a mis-cased binding is found. Preserve the original requested URL in discovery error messages.

  A2AError is the base exception type with status 500, llm_provider "a2a_agent", and optional fields for model, response, debug info, and retry counts. A2AConnectionError (status 503) wraps connection failures including unreachable agents. A2AAgentCardError (status 404) covers card fetch failures and invalid formats. A2AAgentCardDiscoveryError lists all attempted paths and status codes. A2ALocalhostURLError is defined for use by B4813 to report localhost URLs detected in connection errors, carrying the detected URL, replacement base URL and original error for retry logic.

  The task builds a pure Rust module consuming the HTTP pool contract from B173 and returning typed results. Error messages use betterlite's own wording, keeping status codes and types aligned with LiteLLM's response format.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-a2a/**
  lint_tables: false
