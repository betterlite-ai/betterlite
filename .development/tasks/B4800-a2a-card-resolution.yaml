    why: Protocol binding normalization and version downgrade logic.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/card_resolver.py#L107-L127
    why: Agent card URL getters and setters on resolved cards.
