id: B825
title: Model access-group budget management routes
description: >-
  Implement GET, PUT and DELETE /access_group/{access_group}/budget in model_group_budget. Ownership
  is get_access_group_budget L1093-L1120, set_access_group_budget L1128-L1198 and
  delete_access_group_budget L1206-L1244 of model_access_group_management_endpoints.py. Their decorators
  at L1088, L1123 and L1201 use B052 authentication and B832 response schemas. None has a local role
  check, management decorator or exception handler. Use B823's _prisma_client_or_500 before other
  handler work: absent database yields HTTPException 500 detail.error="Database not connected.".
  Existing groups are discovered from model tags, not budget rows; B823's existence check returns 404
  detail.error="Access group '<name>' not found". Cases database_first, budget_row_without_group_404
  and middleware_budget_policy exercise these distinctions through the actual routes.

  GET checks existence then reads the joined group-budget row and delegates to B823._budget_response.
  No row means spend=0.0 and budget=null; a row without its linked budget retains its spend with null
  budget. A linked row returns B832's budget projection. Cases read_unset_budget, read_dangling_budget
  and read_joined_budget fix the wire fields without adding writes or cache reads.

  PUT's AccessGroupBudgetRequest defaults max_budget, soft_budget, budget_duration and budget_id to
  null; B832 enforces nonnegative numeric budgets and forbids extra fields, including tpm_limit/rpm_limit.
  After obtaining the DB, exclude_none leaves an empty object for {} or all-null fields: return 400
  detail.error="One of max_budget, soft_budget, budget_duration or budget_id is required". Zero budgets
  and empty strings are non-null and pass this presence test. Then call B861.validate_budget_duration,
  then verify group existence, then read its existing joined budget. Cases empty_patch_and_all_null,
  zero_budget_allowed, forbidden_fields_and_negative_budget and duration_before_group_lookup preserve
  validation order, including B861's invalid-duration detail and 400 rather than a fabricated fallback.

  Call B065.handle_budget_for_entity with the existing row's budget_id or null and the caller plus
  litellm_proxy_admin_name. That dependency selects/creates/updates the shared budget; do not substitute
  B862's team-member patch helper. Without an existing ID a supplied ID wins over other budget fields;
  with an existing ID, omitted budget_id permits updating that budget. A nonnull supplied budget_id
  instead remains in _budget_data, so BudgetNewRequest(budget_id=existing, **_budget_data) raises
  TypeError for multiple values for keyword argument 'budget_id', even when both IDs are equal.
  Preserve this failure before any new write; the ordinary JSON error boundary returns 500 with
  error.message="Internal server error", error.type="internal_server_error" and no param/code.
  Do not implement the helper's unreachable relink intent.
  Cases link_supplied_budget, create_budget_then_link, update_existing_budget,
  explicit_existing_budget_id_type_error and budget_write_survives_link_failure assert these outcomes.

  Upsert LiteLLM_ModelAccessGroupBudgetTable by access_group_name, including litellm_budget_table in
  the returned row. Create supplies access_group_name, budget_id, created_by and updated_by; update
  supplies ONLY budget_id and updated_by. The actor is caller.user_id or litellm_proxy_admin_name.
  Preserve existing spend and created_by. Afterwards await B823._evict_model_access_group_cache_keys
  for the group-row and registry keys, log "Set budget %s on access group '%s'", and project the response.
  Never reset the group spend counter or delete the old shared budget. Cases actor_fallback_and_upsert,
  spend_and_creator_preserved, row_then_registry_eviction and cache_failure_keeps_link prove the order.

  DELETE verifies group existence and calls B823._delete_model_access_group_budget_row. It deletes
  the linking row and evicts the same two keys, retaining both deployments and the shared BudgetTable
  row. Return 200 with access_group, budget_deleted and message "Budget for access group '<name>'
  deleted successfully" when the helper returns true; false returns "Access group '<name>' has no
  budget to delete". A repository exception is not changed into false by this route. Cases delete_link_only,
  delete_false_response and repository_error_not_swallowed establish that contract. There is no spanning
  transaction or handle_exception_on_proxy call on any of the three paths.

  Use B001 HTTP parity fixtures for reachable responses and native fault-injection tests for repository
  and cache failures. B860 provides isolated Postgres schemas through POSTGRES_TEST_URL or, only if
  absent, testcontainers; failures are fatal to the test. Money uses the workspace Decimal representation
  with checked conversion to the pinned columns. Request bytes remain B003/B832's responsibility.
  No setting is newly read here: the actor fallback is injected from the proxy. The 120 owned nonblank,
  noncomment lines include API examples; estimate 130 production, 270 behavior tests and 65 route lines,
  465 within 500, with each Rust implementation file below 300 lines.
scope:
