id: B825
title: Model access-group budget management routes
description: >-
  Implement get/put/delete /access_group/{access_group}/budget with typed Decimal budget patches, reset
  time calculation and linked budget lifecycle. Invalidate both registry and group spend/auth caches after
  commit; no budget reset scheduler is introduced.


  Build the production model_group_budget module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_access_group_management_endpoints.py:
  get_access_group_budget (L1093-L1120; 23 source lines), set_access_group_budget (L1128-L1198; 63 source
  lines), delete_access_group_budget (L1206-L1244; 34 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Register these actual HTTP routes and aliases exactly once: GET /access_group/{access_group}/budget
  -> get_access_group_budget; PUT /access_group/{access_group}/budget -> set_access_group_budget; DELETE
  /access_group/{access_group}/budget -> delete_access_group_budget. For each route send a typed successful
  request, an invalid or missing target, and a caller lacking that route permission through B001 HttpCase
  against the running pinned MIT proxy and betterlite. Public login/session routes instead prove bad credentials
  or invalid/expired codes. Compare status, response model including null/absent fields, error type/param/code,
  content-type, redirect/cookie headers and litellm-changed-by where read. Do not reduce endpoint checks
  to direct helper invocations. handle_exception_on_proxy controls management error mapping; keep source
  partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 120 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  120 production, 154 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 339 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
