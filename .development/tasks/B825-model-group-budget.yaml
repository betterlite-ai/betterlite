    why: Budget route decorators, validation and exact linking/cache order.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/utils.py#L180-L267
    why: B065's shared-budget selection and duplicate budget_id keyword on an existing linked row.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/management_endpoints/model_management_endpoints.py#L65-L83
    why: B832 budget request defaults and response records.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2049-L2081
    why: Unhandled duplicate-keyword TypeError is a generic JSON 500, not an HTTPException detail.
dod:
  - text: Named HTTP cases compare budget projections, validation precedence, middleware policy and
      deletion messages with the pinned proxy, including absent type/param/code fields.
    proof: [behavior-tests, oracle]
  - text: Named Postgres/fault cases prove shared-budget writes precede linking, preserve spend and
      created_by, and retain committed rows when cache invalidation fails.
    proof: [behavior-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Shared-budget route tests are missing or change linking/deletion effects.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E
        'test(/^model_group_budget::tests::/) - test(/replays_the_/)'
