deviations: []
out_of_scope:
  - B823 owns data helpers L65-L566 in model_access_group_management_endpoints.py; B824 owns the three
    model-tag write routes L574-L712/L829-L1085 and B2341 the read routes L720-L821.
  - B065 implements handle_budget_for_entity; B861 implements duration validation, and B832 defines schemas.
pitfalls:
  - Supplying budget_id for an already linked group fails on a duplicate constructor keyword, even for the same ID.
  - PUT excludes nulls, so an all-null payload cannot clear an existing group's budget.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
