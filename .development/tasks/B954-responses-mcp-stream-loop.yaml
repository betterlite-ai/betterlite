  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_loop::/)
      - test(/::replays_corpus$/)'
  - id: case-tool-round-followup
    why: the tool-round-followup behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_loop::tests::tool_round_followup($|::)/)'
  - id: case-streamed-tool-error
