id: B954
title: Responses mcp stream loop
description: >-
  Run streamed MCP tool execution and follow-up rounds using the split round state, tool executor and follow-up
  planner. Use owned cancellation and the source iteration cap; synchronous SDK iteration later delegates to this
  state machine. Keep MAX_MCP_TOOL_CALL_ROUNDS=5 and its warning plus forced text-only follow-up when the cap is
  reached.


  Implement crates/betterlite-core/src/api/responses_mcp_stream_loop.rs. Use ResponsesMcpStreamLoopInput and ResponsesMcpStreamLoopResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions tool_round_followup, streamed_tool_error, iteration_limit, client_cancel_tool_round
  under api::responses_mcp_stream_loop::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesMcpStreamLoop in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_mcp_stream_loop: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator.__anext__ (L436-L445);
  litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._anext_impl (L447-L515); litellm/responses/mcp/mcp_streaming_iterator.py:
  MCPEnhancedStreamingIterator._generate_tool_execution_events (L731-L880); litellm/responses/mcp/mcp_streaming_iterator.py:
  MCPEnhancedStreamingIterator._create_follow_up_iterator (L882-L951); litellm/responses/mcp/mcp_streaming_iterator.py:
  MCPEnhancedStreamingIterator.__iter__ (L953-L954); litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator.__next__
  (L956-L974). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 239 owned nonblank/non-comment/non-docstring Python lines (251 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 259 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 491 total within the 500-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B932 (Responses create call), B950
  (Responses mcp execute), B951 (Responses mcp followup), B953 (Responses mcp stream round), B1087 (Api boundaries),
  B952 (Responses mcp events), B948 (Responses mcp selection), B949 (Responses mcp discovery). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
