id: B3046
title: Settle limiter callbacks and publish quota headers
description: >-
  Wire the post-call settlement callbacks to release slots, refund reservations and publish
  quota headers. Build five callback hooks that complete the rate-limit lifecycle: success
  settlement that releases parallel slots and reconciles token usage, logging mirroring for
  streaming responses, failure settlement that refunds reserved tokens when rejection occurs
  before the LLM call, disconnect handling for cancelled streams, and batch enqueued post-call
  accounting.

  _merge_ratelimit_statuses_into_additional_headers takes a dict of additional headers and a
  list of RateLimitStatus records, returning the dict extended with x-ratelimit-{descriptor_key}-{remaining|limit}-{rate_limit_type}
  entries. Non-mutating so callers choose their target dict.

  async_logging_hook and _mirror_ratelimit_response_into_logging_payload handle streaming
  responses where the logging callback runs before the post-call hook. Copy the stashed
  RateLimitResponse into the SLP's hidden_params.additional_headers (when present) and the
  response object's _hidden_params.additional_headers (when a dict), using _merge_ratelimit_statuses_into_additional_headers.
  async_logging_hook returns (kwargs, result) unchanged after mirroring; idempotent for non-streaming.

  async_log_success_event runs after successful completion: release the stashed parallel slot
  via _release_stashed_parallel_slot, then build and apply TPM/combined operations from
  _build_success_event_pipeline_operations via async_increment_tokens_with_ttl_preservation;
  when ITPM/OTPM operations exist, apply them via async_increment_reservation_aware_tokens.
  Catch exceptions so logging errors never fail the response.

  async_log_failure_event runs on LLM errors: release the parallel slot, then conditionally
  refund reserved tokens. Skip refund if async_post_call_failure_hook already released them
  (checked via stash.reservation_released). Build refund ops from _build_reservation_aware_tpm_ops
  and _build_project_reservation_ops for the originally reserved scopes (not unreserved ones).
  For partial-stream failures with recovered usage, settle at that usage instead of full refund.
  Apply via async_increment_cache_pipeline_post_call for simple TPM ops and async_increment_reservation_aware_tokens
  for project operations; flag the stash's reservation_released when done.

  async_release_max_parallel_requests_on_disconnect releases the acquired max_parallel_requests
  slot when a stream cancels mid-flight without either callback firing. Uses the stashed
  acquisition presence to decide whether to release (allowing config changes mid-request without
  leaking slots past their TTL).

  async_post_call_success_hook combines two tasks: release the acquired parallel slot, then
  merge rate-limit headers into the response object's _hidden_params.additional_headers (when
  response_has_hidden_params is true). Catch exceptions separately so slot release errors do
  not block header updates; both exceptions are logged but neither fails the response.

  _handle_batch_enqueued_post_call completes batch token reservation accounting: on successful
  enqueue, save the stashed BatchEnqueuedTokenReservation via batch_enqueued_token_store.save_reservation;
  on completion (status in BATCH_ENQUEUED_REFUND_STATUSES), pop and refund it. Idempotent per
  reservation; handles batch_id canonicalization via canonical_provider_batch_id and batch_response_view.

  async_post_call_failure_hook handles proxy-level rejections after pre-call acquired slots/reservations
  but before the LLM call ran (e.g. guardrails, auth hooks). Release the slot, refund batch
  enqueued reservations, apply any batch TPD refund ops, then conditionally refund TPM/ITPM/OTPM
  reservations (guarded by reservation_released flag — idempotent with async_log_failure_event).
  Settle at recovered partial usage when available; use _build_reservation_aware_tpm_ops and
  _build_project_reservation_ops for delta ops. Apply simple ops via async_increment_cache_pipeline
  and project ops via async_increment_cache_pipeline or async_increment_reservation_aware_tokens.
  Catch exceptions so batch/reservation failures never fail the response.

  Depends on B732 for UserAPIKeyAuth and parent_otel_span; B1042 for BatchEnqueuedTokenReservation,
  batch_response_view, canonical_provider_batch_id; B1043 for BatchEnqueuedTokenStore.save_reservation,
  pop_reservation, refund; B3031 for get_request_stash, get_request_stash_for_call, _call_id_from_callback_kwargs;
  B3035 for _release_stashed_parallel_slot; B3037 for async_increment_tokens_with_ttl_preservation,
  async_increment_reservation_aware_tokens, _build_reservation_aware_tpm_ops, _build_project_reservation_ops;
  B3044 for get_rate_limit_type, _recovered_partial_usage_tokens; B3045 for _build_success_event_pipeline_operations.

