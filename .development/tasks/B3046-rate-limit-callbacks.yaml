dod:
  - text: _merge_ratelimit_statuses_into_additional_headers returns a new dict extended with x-ratelimit-* headers, one per status and rate-limit-type.
    proof: [header-merge-format]
  - text: async_logging_hook copies rate-limit response into standard_logging_object.hidden_params.additional_headers and response._hidden_params.additional_headers without failing the response.
    proof: [logging-hook-mirror]
  - text: async_log_success_event releases the stashed parallel slot, builds and applies TPM operations via async_increment_tokens_with_ttl_preservation, and applies ITPM/OTPM operations via async_increment_reservation_aware_tokens.
    proof: [success-event-slot-release, success-event-tpm-ops, success-event-io-ops]
  - text: async_log_success_event catches all exceptions and logs them without failing the response.
    proof: [success-event-error-handling]
  - text: async_log_failure_event releases the parallel slot, checks stash.reservation_released to skip redundant refunds, and builds refund operations for originally reserved scopes only.
    proof: [failure-event-slot-release, failure-event-idempotency, failure-event-scope-filtering]
  - text: async_log_failure_event settles at recovered partial usage when available, or refunds full reserved amounts when not.
    proof: [failure-event-partial-usage]
  - text: async_log_failure_event applies refund operations via async_increment_cache_pipeline_post_call and async_increment_reservation_aware_tokens and flags reservation_released.
    proof: [failure-event-refund-application, failure-event-release-flag]
  - text: async_log_failure_event catches all exceptions and logs them without failing the response.
    proof: [failure-event-error-handling]
  - text: async_release_max_parallel_requests_on_disconnect releases the stashed parallel slot when a stream cancels without triggering success/failure callbacks.
    proof: [disconnect-slot-release]
  - text: async_post_call_success_hook releases the parallel slot and merges rate-limit headers into response._hidden_params.additional_headers, with separate exception handling for each task.
    proof: [success-hook-slot-release, success-hook-header-merge, success-hook-exception-separation]
  - text: _handle_batch_enqueued_post_call saves stashed batch token reservations via BatchEnqueuedTokenStore.save_reservation on successful enqueue.
    proof: [batch-enqueued-save]
  - text: _handle_batch_enqueued_post_call pops and refunds batch reservations via pop_reservation and refund when status is in BATCH_ENQUEUED_REFUND_STATUSES.
    proof: [batch-enqueued-refund]
  - text: _handle_batch_enqueued_post_call uses batch_response_view to extract view from response and canonical_provider_batch_id to normalize batch ID.
    proof: [batch-enqueued-batch-id]
  - text: async_post_call_failure_hook refunds batch enqueued reservations and applies batch TPD refund ops before checking reservation_released guard.
    proof: [failure-hook-batch-setup]
  - text: async_post_call_failure_hook conditionally refunds TPM/ITPM/OTPM reservations only when reservation_released is false, settling at recovered partial usage or refunding full reserved amounts.
    proof: [failure-hook-tpm-refund, failure-hook-io-refund]
  - text: async_post_call_failure_hook applies refund operations via async_increment_cache_pipeline and async_increment_cache_pipeline or async_increment_reservation_aware_tokens.
    proof: [failure-hook-refund-application]
  - text: async_post_call_failure_hook flags stash.reservation_released when refunds are applied and catches all exceptions without failing the response.
    proof: [failure-hook-release-flag, failure-hook-error-handling]
  - text: Every default header name, cache pipeline method, refund transition and duplicate-prevention pattern a user can observe is in a named oracle case with input and outcome.
    proof: [oracle-cases-tests]

