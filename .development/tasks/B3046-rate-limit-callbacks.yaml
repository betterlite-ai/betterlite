deviations:
  - what: >-
      When async_post_call_failure_hook and async_log_failure_event both run (proxy-level
      rejection that also bubbles as LLM error), the refund is guarded by stash.reservation_released
      flag. Only the first to acquire the stash can apply refunds; the second sees the flag
      set and skips refunding. This ensures double-refunds do not occur.
    why: >-
      Some error conditions trigger both the proxy-level rejection hook and the LLM logging callback,
      creating a window where both could refund the same reservation. The reservation_released flag
      prevents the second callback from driving counters negative.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L5126-L5135
  - what: >-
      BATCH_ENQUEUED_REFUND_STATUSES determines which batch completion statuses trigger refund
      (e.g. failed, expired). Only statuses in this set cause pop_reservation and refund to run;
      successful batch operations do not refund.
    why: >-
      Batch API semantics distinguish successful enqueuing from successful batch execution. Only
      when the batch itself fails or expires should reservations be returned to the pool. The set
      is sourced from B1043's batch store configuration.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L5278

out_of_scope:
  - Rate-limit descriptor and status construction belong to earlier pre-call phases (B3038-B3040).
  - Parallel slot acquisition and release APIs belong to B3035.
  - Token increment and reservation-aware delta operations belong to B3037.
  - Successful operation pipeline construction belongs to B3045.
  - Batch token store interface (save, pop, refund) belongs to B1043.
  - User API key auth context and parent span extraction belong to B732.
  - Request stash lifecycle and call-ID filtering belong to B3031.
  - Cache pipeline transport methods and Redis registration belong to external owners (B124/B125/B126).

pitfalls:
  - _merge_ratelimit_statuses_into_additional_headers is non-mutating; callers must use the returned dict, not assume the input is modified.
  - async_logging_hook must be idempotent for non-streaming responses that trigger both logging hook and post-call hook. Use the same stashed response to write the same headers.
  - Header names follow the pattern x-ratelimit-{descriptor_key}-{remaining|limit}-{rate_limit_type}; ensure descriptor_key and rate_limit_type match what was returned at pre-call.
  - async_log_failure_event and async_post_call_failure_hook are separate callbacks that may both run on certain errors. Guard refunds with stash.reservation_released to prevent double-refunding.
  - Refund operations are built from reserved scopes (stash.reserved_scopes, stash.itpm_reserved_scopes, stash.otpm_reserved_scopes), not from requested scopes. Refunding unreserved scopes would drive counters negative.
  - Partial stream failures recovered via _recovered_partial_usage_tokens must settle at that usage (actual - reserved delta) rather than refunding the full reserved amount.
  - async_post_call_failure_hook's exception handling must be broad (catch Exception) so batch/reservation failures never fail the response. Separate exception blocks per task preserve partial success when some operations fail.
  - batch_response_view(response) returns None for non-batch responses; always check before dereferencing the view.
  - BATCH_ENQUEUED_REFUND_STATUSES is a string set (e.g. {"failed", "expired"}); use .lower() on status values before set membership checks.
  - Slot stashing uses call_id filtering to prevent nested callbacks from releasing the wrong acquisition. Always pass the correct call ID to _call_id_from_callback_kwargs.

