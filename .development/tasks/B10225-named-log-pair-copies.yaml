dod:
  - text: LogContext lives in betterlite-logging's logging_pre_post::context with the state and env borrows, and none of the seven CallLogging, the ten PrePostLogger or the EvalLogging copies is left.
    proof: [log-context-home, named-log-copies]
  - text: Every user names the home, each logger trait is implemented for it, and the owners' tests in provider, openai, azure, core and python pass with only names and imports changed.
    proof: [provider-dispatch-log-tests, openai-logger-tests, azure-logger-tests, core-eval-log-tests, python-eval-log-tests]
checks:
  optional: []
  commands:
    - id: log-context-home
      why: the home LogContext is missing or does not borrow the logging state mutably beside the pre and post call environment
      run: |-
        grep -qxF "pub struct LogContext<'borrow, 'env> {" crates/betterlite-logging/src/logging_pre_post/context.rs &&
        grep -qxF "    pub state: &'borrow mut LoggingState," crates/betterlite-logging/src/logging_pre_post/context.rs &&
        grep -qxF "    pub env: &'borrow PrePostEnv<'env>," crates/betterlite-logging/src/logging_pre_post/context.rs
    - id: named-log-copies
      why: a CallLogging, PrePostLogger or EvalLogging copy is still declared, or a user still names one instead of the home
      run: |-
        test -z "$(grep -lE '^pub struct (CallLogging|PrePostLogger|EvalLogging)<' crates/betterlite-provider/src/anthropic_dispatch.rs crates/betterlite-provider/src/model_hub_dispatch.rs crates/betterlite-provider/src/gateway_provider_dispatch/context.rs crates/betterlite-provider/src/ragflow_chat/dispatch/context.rs crates/betterlite-provider/src/self_hosted_dispatch/context.rs crates/betterlite-provider/src/data_cloud_dispatch/context.rs crates/betterlite-provider/src/hosted_platform_dispatch/context.rs crates/betterlite-openai/src/image_generation/logging.rs crates/betterlite-openai/src/text_completion_transport/logging.rs crates/betterlite-openai/src/image_variations/logging.rs crates/betterlite-openai/src/transcription/logging.rs crates/betterlite-openai/src/speech/logging.rs crates/betterlite-openai/src/realtime/logging.rs crates/betterlite-azure/src/embeddings/logging.rs crates/betterlite-azure/src/speech/logging.rs crates/betterlite-azure/src/transcription/call/logging.rs crates/betterlite-core/src/api/soniox/prepare/logging.rs crates/betterlite-core/src/api/eval_http/exchange.rs)" &&
        test -z "$(grep -rnwE 'CallLogging|PrePostLogger|EvalLogging' crates tools --include=*.rs | grep -v -e '^crates/betterlite-sdk/' -e '^tools/oracle/src/helpers/sdk/')"
    - id: provider-dispatch-log-tests
      why: a provider dispatch family no longer hands its logging state and environment to pre_call and post_call, or openai's completion logger lost its B249Logger seat
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^(anthropic_dispatch|azure_media_dispatch|data_cloud_dispatch|gateway_provider_dispatch|hosted_platform_dispatch|model_hub_dispatch|openai_dispatch|ragflow_chat|self_hosted_dispatch)::/) - test(/replays_/)'
    - id: openai-logger-tests
      why: an openai logger trait is no longer implemented for the type its handler is handed, so a pre-call or post-call record is lost
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^(image_generation|image_variations|realtime|speech|text_completion_transport|transcription)::/) - test(/replays_/)'
    - id: azure-logger-tests
      why: an azure logger trait is no longer implemented for the type its handler is handed
      run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/^(embeddings|speech|transcription)::/) - test(/replays_/)'
    - id: core-eval-log-tests
      why: an eval handler or soniox's logger no longer writes its pre-call through the home
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(eval_create_list|eval_get_update|eval_http|eval_lifecycle|eval_run_create_list|eval_run_http|eval_run_lifecycle|soniox::prepare)::/) - test(/replays_/)'
    - id: python-eval-log-tests
      why: the Python eval calls no longer build the logging pair their core handler takes
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^eval_calls::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "B10224's copies: the eighteen `LogContext` structs in core, bedrock and provider, provider rerank_http's `RerankLogContext`, core video_generation_call's `GenerationCallEnvironment` and anthropic's `Logging`. Their files sit in B10200's, B10216's and B10217's scopes, so they wait for those tasks and take this home."
  - "Not copies: core responses_lifecycle_call's `LifecycleLog` (service.rs L27-L30) owns its PrePostEnv instead of borrowing it, and the structs that carry the pair beside call data (openai edenai_responses.rs `ReplyRequest` L43, core video_remix_call/shared.rs `VideoCallDeps` L17, the provider dispatch contexts) have other fields. betterlite-sdk's `CallLogging` (call_wrapper/logging.rs L67) is a trait that shares the name and stays."
  - "The logger traits and their records repeat across crates in places, for one openai's and azure's speech/logging.rs hold the same SpeechLogger and pre-call record with one field renamed (`body` and `data`): a later plan."
pitfalls:
  - "Keep the home's name, field names and lifetimes exactly as the description writes them: B10224 relies on 150 files that already spell `LogContext<'_, '_>` with `state` and `env` changing only their import."
  - "All ten logger traits are now implemented for one type, so a method call such as `logger.pre_call(record)` on a concrete LogContext is ambiguous (E0034) in a file with two of the traits in scope. On main each concrete call site imports one trait (the tests write `CompletionLogger as _` and the like) and provider openai_media_dispatch/execute.rs L53 calls through its generic bound, so import no second trait into those files."
  - "anthropic_dispatch.rs is `#[rustfmt::skip]` from L145, and L165 builds anthropic's `Logging { state: log.state, env: log.env }` out of the CallLogging; leave that line as it is, since anthropic's Logging is B10224's."
  - "betterlite-sdk declares a `CallLogging` trait that the oracle's helpers/sdk/b5368/ports.rs implements; it is a different item, so a rename across the whole workspace breaks the SDK call wrapper."
  - "tools/oracle/src/helpers/provider/b8330/chat.rs has 295 of its 300 counted lines; keep the home import on the line the old import held."
  - "A dispatched run builds nothing, so walk every hit of the rg line in the description before committing; each missed site costs a CI round."
review_level: standard
budget:
  max_changed_lines: 600
  max_new_expects: 0
