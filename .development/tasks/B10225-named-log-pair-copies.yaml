id: B10225
title: One LogContext in betterlite-logging for the CallLogging, PrePostLogger and EvalLogging copies
description: >-
  Eighteen structs in betterlite-provider, betterlite-openai, betterlite-azure and betterlite-core hold the same two fields under three names, `state: &mut LoggingState` and `env: &PrePostEnv<'env>`, both from betterlite-logging. Each is the logging object of one provider call and the pre and post call environment its records go through, which is what betterlite-logging's `pre_call` (logging_pre_post/pre_call.rs L118-L122) and `post_call` (post_call.rs L34) take beside the record. This task gives the pair one home in betterlite-logging and points every user of these eighteen at it. B10224 then folds the eighteen `LogContext` copies in core, bedrock and provider into the same home. It is a refactor: no record, log line, header or error changes, and nothing a user sees changes.


  The home. crates/betterlite-logging/src/logging_pre_post/context.rs, already declared by `pub mod context;` in logging_pre_post.rs, holds `pub struct LogContext<'borrow, 'env>` with `pub state: &'borrow mut LoggingState,` and `pub env: &'borrow PrePostEnv<'env>,`, one comment line saying what it carries, and the imports `crate::logging_state::LoggingState` and `super::env::PrePostEnv`. No derive and no impl: none of the copies has one. Every crate below already depends on betterlite-logging, so no crate gains a dependency and no cycle can form. The name, the field names and the lifetimes are those of the eighteen LogContext copies, so B10224 only rewrites their imports.


  CallLogging. Seven betterlite-provider dispatch families declare `pub struct CallLogging<'state, 'env>` with the two fields: anthropic_dispatch.rs L122-L125, model_hub_dispatch.rs L154-L157, gateway_provider_dispatch/context.rs L104-L107, ragflow_chat/dispatch/context.rs L20-L23, self_hosted_dispatch/context.rs L70-L73, data_cloud_dispatch/context.rs L61-L64 and hosted_platform_dispatch/context.rs L66-L69. All seven go. Every `CallLogging` in those families reads `LogContext` and imports the home: each family's chat.rs and logging.rs and its tests/chat.rs (ragflow's dispatch.rs, dispatch/logging.rs and dispatch/tests.rs), model_hub_dispatch's embedding.rs, json.rs, predibase.rs, replicate.rs and tests (pooled.rs, send.rs, support.rs), anthropic_dispatch's completion.rs, gateway/call.rs, native.rs, native/messages.rs, native/tests/support/execution.rs and fixtures (calls.rs, recording.rs), and the oracle's helpers/provider b8157/chat.rs, b8310/chat.rs, b8311/chat.rs, b8330/chat.rs and b8332.rs.


  PrePostLogger. Ten modules declare `pub struct PrePostLogger<'call, 'env>` with the two fields only to implement their own logger trait over pre_call and post_call: betterlite-openai's image_generation/logging.rs L30-L33 (ImageGenerationLogger at L35), text_completion_transport/logging.rs L111-L115 (CompletionLogger at L178), image_variations/logging.rs L66-L69 (ImageVariationLogger at L71), transcription/logging.rs L31-L34 (TranscriptionLogger at L36), speech/logging.rs L20-L23 (SpeechLogger at L25) and realtime/logging.rs L23-L26 (RealtimeLogger at L28); betterlite-azure's embeddings/logging.rs L45-L49 (EmbeddingLogger at L66), speech/logging.rs L20-L23 (azure's own SpeechLogger at L25) and transcription/call/logging.rs L34-L37 (AzureTranscriptionLogger at L39); and core's api/soniox/prepare/logging.rs L38-L41 (SonioxLogger at L43). Each struct goes and its `impl <Trait> for PrePostLogger<'_, '_> {` header reads `impl <Trait> for LogContext<'_, '_> {` in the same file with the same body. Each trait is local to its crate, so the orphan rule allows the impl on the logging crate's type, and the ten traits are distinct, so no two impls clash. The users outside the defining files name the home: provider openai_dispatch/logging.rs L4 and the `completion` field of B249Logger at L36 with its test tests/call_failure_logging.rs L13 and L232, provider azure_media_dispatch/speech/openai.rs L6 and L49, and the modules' own tests (openai image_generation/tests.rs, text_completion_transport/tests.rs, image_variations/tests/support.rs, transcription/tests/logging.rs, speech/tests/cases.rs, realtime/tests/logging.rs, azure embeddings/tests/logging_cases.rs, speech/tests/invariants.rs, transcription/tests/wiring.rs and core soniox/prepare/tests/logging.rs).


  EvalLogging. Core's api/eval_http/exchange.rs L51-L55 declares `pub struct EvalLogging<'state, 'env>` with the two fields and its comment; it goes. Its users read `LogContext` and import the home: eval_http (handlers.rs, logging.rs, tests/support.rs), eval_create_list (handler.rs L14, service.rs), eval_get_update (handler.rs L15 and L22, service.rs), eval_lifecycle.rs and its tests/support.rs, eval_run_create_list (eval_run_create_list.rs, providers.rs, tests/async_calls.rs, tests/support.rs L406), eval_run_http.rs and its tests/support.rs, eval_run_lifecycle/handlers.rs, and betterlite-python's eval_calls/session/operations.rs.


  Imports. A defining file drops the LoggingState and PrePostEnv imports that only the struct used, and clippy's unused import lint names any left. No `pub use` and no `as` alias keeps an old name: an old name at the old path is the copy this removes. `rg -nw 'CallLogging|PrePostLogger|EvalLogging' crates tools -g '!crates/betterlite-sdk/**' -g '!tools/oracle/src/helpers/sdk/**'` lists every site on main.


  Tests. No new test: the owners' tests already drive each logger through pre_call and post_call and pin the records, and they must pass with only the type name and the imports changed. The home is a plain struct with no behavior of its own. The oracle helpers change only names and imports, and CI's clippy lane builds them.


  What users see: nothing.
