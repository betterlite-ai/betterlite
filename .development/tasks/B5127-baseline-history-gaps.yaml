dod:
  - text: >-
      entry_status_matches_only_when_every_condition_holds replaces
      entry_status_requires_the_window_the_fingerprint_and_the_ttl_to_match, with the cases matching,
      expired, not_yet_available, fingerprint_outside_lookback, tokens_above_prefix and ttl_differs.
      Deleting the available_at bound, the lookback_fingerprints check, the tokens <= prefix_tokens
      check or the TTL equality in entry_status each fails one case. The new
      entry_status_flags_an_uncertain_entry_with_the_same_ttl_as_ambiguous fails once
      `entry.uncertain ||` is deleted.
    proof: [entry-status-tests]
  - text: >-
      request-before-write-availability-stays-cold.yaml and near-miss-entries-stay-cold.yaml both come
      back cache_prefix_cold, and uncertain-entry-refuses-a-later-request.yaml comes back
      cache_ttl_changed, the same as LiteLLM. Each one would answer differently with the matching
      condition its gap names deleted.
    proof: [case-entry-matching, oracle]
  - text: >-
      history-unavailable-uses-the-longest-marker-ttl.yaml answers history_unavailable and
      history-unavailable-skips-markers-below-the-minimum.yaml answers a modeled cache_prefix_cold, the
      same as LiteLLM. Taking the smallest marker TTL fails the first case, and taking the TTLs from
      plan.breakpoints instead of the kept markers fails the second.
    proof: [case-history-unavailable, oracle]
  - text: >-
      below-cache-minimum-sends-every-prompt-token-as-text.yaml answers below_cache_minimum and
      empty-breakpoints-report-no-cache-breakpoints.yaml answers no_cache_breakpoints, each as a modeled
      estimate with every plan token as text_tokens, the same as LiteLLM.
    proof: [case-cache-reasons, oracle]
  - text: >-
      writes_for_a_request_started_before_blocked_until_writes_nothing fails once the blocked_until
      guard in writes_for is deleted. writes_for_an_ambiguous_write_expires_at_the_longest_conflicting_ttl
      fails once marker_entries stops folding the ambiguous entries' TTLs. writes_for_emits_a_refresh_before_the_marker_entry
      replaces writes_for_refreshes_a_hit_that_the_plan_no_longer_names and fails once refresh_entry
      returns None.
    proof: [writes-tests]
  - text: >-
      blocked-request-writes-no-entries.yaml keeps the history's entries empty after the blocked
      request, and short-marker-after-long-entry-keeps-the-long-expiry.yaml writes an uncertain "new"
      entry that expires at 8600.0, the same as LiteLLM.
    proof: [case-write-guards, oracle]
  - text: >-
      an_invalid_group_blocks_until_its_latest_relevant_observation_is_available replaces
      an_invalid_observation_blocks_every_relevant_observation_in_its_group and asserts blocked_until
      and uncertain_before both equal the valid observation's available_at. It fails when blocked_until
      folds only the bad observations, when it also folds the response_cache one, and when
      `invalidated ||` is dropped from the uncertain_before choice.
    proof: [replay-tests]
  - text: >-
      invalid-group-blocks-through-the-latest-relevant-sibling.yaml,
      equivalence-stays-off-after-a-divergence.yaml and
      group-order-rejects-a-split-start-and-a-repeated-start.yaml answer the same as LiteLLM: blocked_until
      and uncertain_before at 30.0, unsupported_cache_plan instead of identical_baseline_path after the
      divergence, and invalid_observation_order for every member of a split start group and of a group
      at exactly last_at, with the history left unchanged.
    proof: [case-replay-state, oracle]
  - text: >-
      a_non_finite_timestamp_is_rejected_by_its_own_check builds Raw with an infinite or NaN started_at
      or available_at and gets exactly ObservationError::InvalidStartedAt or
      ObservationError::InvalidAvailableAt from BaselineObservation::try_from, so deleting either
      is_finite check fails it. The 1e400 case is renamed overflowing_available_at_literal.
    proof: [finite-timestamp-tests]
  - text: >-
      The second entry of docs/deviations/B1696.yaml covers every AttributeError path of
      _complete_usage: no cache_creation_tokens and no cache_write_tokens at line 75, and a missing
      cache_creation_token_details with zero or positive writes at line 78. It links
      baseline_accounting.py#L75-L78, and the file still holds two entries.
    proof: [usage-crash-deviation]
  - text: >-
      top-level-cache-counters-override-prompt-token-details.yaml answers the same as LiteLLM in all
      five groups: identical_baseline_path with cached_tokens 20 in the returned usage for group one,
      identical_baseline_path with cache_creation_tokens and cache_write_tokens 20 for group two, and
      unsupported_cache_plan for groups three and four and for all three requests of group five. On
      main the first four groups and group five's nested-only request answer complete.
    proof: [case-top-level-cache-counters, oracle]
  - text: >-
      prompt_tokens_details_takes_the_nested_creation_count_last passes its cases write_wins,
      creation_beats_nested, nested_alone_counts and nested_float_is_ignored, so the nested
      cache_creation_input_tokens counts only after cache_write_tokens and cache_creation_tokens and
      only as an integer.
    proof: [nested-creation-count-tests]
checks:
  optional: []
  commands:
    - id: entry-status-tests
      why: entry_status has no unit test that fails when its available_at bound, lookback check, token check, TTL check or uncertain flag is deleted
      run: >-
        ! grep -q 'fn entry_status_requires_the_window_the_fingerprint_and_the_ttl_to_match' crates/betterlite-models/src/baseline_history/estimate/tests.rs &&
        grep -q 'fn entry_status_matches_only_when_every_condition_holds' crates/betterlite-models/src/baseline_history/estimate/tests.rs &&
        grep -q 'case::not_yet_available' crates/betterlite-models/src/baseline_history/estimate/tests.rs &&
        grep -q 'case::fingerprint_outside_lookback' crates/betterlite-models/src/baseline_history/estimate/tests.rs &&
        grep -q 'case::tokens_above_prefix' crates/betterlite-models/src/baseline_history/estimate/tests.rs &&
        grep -q 'case::ttl_differs' crates/betterlite-models/src/baseline_history/estimate/tests.rs &&
        grep -q 'fn entry_status_flags_an_uncertain_entry_with_the_same_ttl_as_ambiguous' crates/betterlite-models/src/baseline_history/estimate/tests.rs &&
        cargo nextest run --locked -p betterlite-models --no-tests=fail -E
        'test(/^baseline_history::estimate::tests::/)'
    - id: writes-tests
      why: writes_for has no unit test that fails when the blocked_until guard, the longest ambiguous TTL or the refresh entry is deleted
      run: >-
        ! grep -q 'fn writes_for_refreshes_a_hit_that_the_plan_no_longer_names' crates/betterlite-models/src/baseline_history/writes/tests.rs &&
        grep -q 'fn writes_for_emits_a_refresh_before_the_marker_entry' crates/betterlite-models/src/baseline_history/writes/tests.rs &&
        grep -q 'fn writes_for_a_request_started_before_blocked_until_writes_nothing' crates/betterlite-models/src/baseline_history/writes/tests.rs &&
        grep -q 'fn writes_for_an_ambiguous_write_expires_at_the_longest_conflicting_ttl' crates/betterlite-models/src/baseline_history/writes/tests.rs &&
        cargo nextest run --locked -p betterlite-models --no-tests=fail -E
        'test(/^baseline_history::writes::tests::/)'
    - id: replay-tests
      why: no replay test fails when blocked_until folds the wrong observations or uncertain_before ignores an invalid group
      run: >-
        ! grep -q 'fn an_invalid_observation_blocks_every_relevant_observation_in_its_group' crates/betterlite-models/src/baseline_history/replay/tests.rs &&
        grep -q 'fn an_invalid_group_blocks_until_its_latest_relevant_observation_is_available' crates/betterlite-models/src/baseline_history/replay/tests.rs &&
        cargo nextest run --locked -p betterlite-models --no-tests=fail -E
        'test(/^baseline_history::replay::tests::/)'
    - id: finite-timestamp-tests
      why: no model test fails when the is_finite checks on started_at and available_at are deleted
      run: >-
        ! grep -qF 'case::infinite_available_at("available_at", "1e400")' crates/betterlite-models/src/baseline_history/model/tests.rs &&
        grep -qF 'case::overflowing_available_at_literal("available_at", "1e400")' crates/betterlite-models/src/baseline_history/model/tests.rs &&
        grep -q 'fn a_non_finite_timestamp_is_rejected_by_its_own_check' crates/betterlite-models/src/baseline_history/model/tests.rs &&
        grep -q 'case::started_at_infinity' crates/betterlite-models/src/baseline_history/model/tests.rs &&
        grep -q 'case::started_at_nan' crates/betterlite-models/src/baseline_history/model/tests.rs &&
        grep -q 'case::available_at_infinity' crates/betterlite-models/src/baseline_history/model/tests.rs &&
        grep -q 'case::available_at_nan' crates/betterlite-models/src/baseline_history/model/tests.rs &&
        cargo nextest run --locked -p betterlite-models --no-tests=fail -E
        'test(/^baseline_history::model::tests::/)'
    - id: case-entry-matching
      why: no oracle case sends a request before an earlier write is available, near-miss entries, or an uncertain entry ahead of a later request
      run: >-
        test -f tools/oracle/cases/helpers/baseline-history/request-before-write-availability-stays-cold.yaml &&
        test -f tools/oracle/cases/helpers/baseline-history/near-miss-entries-stay-cold.yaml &&
        test -f tools/oracle/cases/helpers/baseline-history/uncertain-entry-refuses-a-later-request.yaml
    - id: case-history-unavailable
      why: no oracle case reaches history_unavailable with two markers of different TTLs or with a marker below minimum_cache_tokens
      run: >-
        test -f tools/oracle/cases/helpers/baseline-history/history-unavailable-uses-the-longest-marker-ttl.yaml &&
        test -f tools/oracle/cases/helpers/baseline-history/history-unavailable-skips-markers-below-the-minimum.yaml
    - id: case-cache-reasons
      why: no oracle case reaches the below_cache_minimum or no_cache_breakpoints reason
      run: >-
        test -f tools/oracle/cases/helpers/baseline-history/below-cache-minimum-sends-every-prompt-token-as-text.yaml &&
        test -f tools/oracle/cases/helpers/baseline-history/empty-breakpoints-report-no-cache-breakpoints.yaml
    - id: case-write-guards
      why: no oracle case sends a valid request before blocked_until, or a short marker against a longer entry on the same content
      run: >-
        test -f tools/oracle/cases/helpers/baseline-history/blocked-request-writes-no-entries.yaml &&
        test -f tools/oracle/cases/helpers/baseline-history/short-marker-after-long-entry-keeps-the-long-expiry.yaml
    - id: case-replay-state
      why: no oracle case invalidates a group after first_at, runs a group after a divergence, or sends a split start group or a group at exactly last_at
      run: >-
        test -f tools/oracle/cases/helpers/baseline-history/invalid-group-blocks-through-the-latest-relevant-sibling.yaml &&
        test -f tools/oracle/cases/helpers/baseline-history/equivalence-stays-off-after-a-divergence.yaml &&
        test -f tools/oracle/cases/helpers/baseline-history/group-order-rejects-a-split-start-and-a-repeated-start.yaml
    - id: usage-crash-deviation
      why: the deviation log names only the zero writes AttributeError at line 78, not the line 75 path or the positive writes path
      run: >-
        grep -q 'baseline_accounting.py#L75-L78' docs/deviations/B1696.yaml &&
        grep -q 'cache_write_tokens' docs/deviations/B1696.yaml &&
        ! grep -q 'baseline_accounting.py#L78$' docs/deviations/B1696.yaml &&
        test "$(grep -c '^  - what:' docs/deviations/B1696.yaml)" = "2"
    - id: case-top-level-cache-counters
      why: no oracle case sends prompt_cache_hit_tokens, cache_read_input_tokens or cache_creation_input_tokens at the top level of a usage
      run: >-
        test -f tools/oracle/cases/helpers/baseline-history/top-level-cache-counters-override-prompt-token-details.yaml &&
        grep -q 'prompt_cache_hit_tokens' tools/oracle/cases/helpers/baseline-history/top-level-cache-counters-override-prompt-token-details.yaml &&
        grep -q 'cache_read_input_tokens' tools/oracle/cases/helpers/baseline-history/top-level-cache-counters-override-prompt-token-details.yaml &&
        grep -q 'cache_creation_input_tokens' tools/oracle/cases/helpers/baseline-history/top-level-cache-counters-override-prompt-token-details.yaml &&
        grep -q 'cache_write_tokens' tools/oracle/cases/helpers/baseline-history/top-level-cache-counters-override-prompt-token-details.yaml &&
        grep -q 'nested-only' tools/oracle/cases/helpers/baseline-history/top-level-cache-counters-override-prompt-token-details.yaml
    - id: nested-creation-count-tests
      why: no usage test parses a nested cache_creation_input_tokens, so nothing pins its place after cache_write_tokens and cache_creation_tokens or that a float is ignored
      run: >-
        grep -q 'fn prompt_tokens_details_takes_the_nested_creation_count_last' crates/betterlite-models/src/baseline_history/usage/tests.rs &&
        grep -q 'case::write_wins' crates/betterlite-models/src/baseline_history/usage/tests.rs &&
        grep -q 'case::creation_beats_nested' crates/betterlite-models/src/baseline_history/usage/tests.rs &&
        grep -q 'case::nested_alone_counts' crates/betterlite-models/src/baseline_history/usage/tests.rs &&
        grep -q 'case::nested_float_is_ignored' crates/betterlite-models/src/baseline_history/usage/tests.rs &&
        cargo nextest run --locked -p betterlite-models --no-tests=fail -E
        'test(/^baseline_history::usage::tests::/)'
oracle_cases:
  - tools/oracle/cases/helpers/baseline-history/request-before-write-availability-stays-cold.yaml
  - tools/oracle/cases/helpers/baseline-history/near-miss-entries-stay-cold.yaml
  - tools/oracle/cases/helpers/baseline-history/uncertain-entry-refuses-a-later-request.yaml
  - tools/oracle/cases/helpers/baseline-history/history-unavailable-uses-the-longest-marker-ttl.yaml
  - tools/oracle/cases/helpers/baseline-history/history-unavailable-skips-markers-below-the-minimum.yaml
  - tools/oracle/cases/helpers/baseline-history/below-cache-minimum-sends-every-prompt-token-as-text.yaml
  - tools/oracle/cases/helpers/baseline-history/empty-breakpoints-report-no-cache-breakpoints.yaml
  - tools/oracle/cases/helpers/baseline-history/blocked-request-writes-no-entries.yaml
  - tools/oracle/cases/helpers/baseline-history/short-marker-after-long-entry-keeps-the-long-expiry.yaml
  - tools/oracle/cases/helpers/baseline-history/invalid-group-blocks-through-the-latest-relevant-sibling.yaml
  - tools/oracle/cases/helpers/baseline-history/equivalence-stays-off-after-a-divergence.yaml
  - tools/oracle/cases/helpers/baseline-history/group-order-rejects-a-split-start-and-a-repeated-start.yaml
  - tools/oracle/cases/helpers/baseline-history/top-level-cache-counters-override-prompt-token-details.yaml
deviations:
  - what: >-
      A usage whose prompt_tokens_details gets no creation count (no cache_creation_tokens, no
      cache_write_tokens and no int cache_creation_input_tokens, nested or top level), or has no
      cache_creation_token_details, gets a completeness answer instead of a crash. Without a
      creation count, or with positive writes and no split, the usage is incomplete; with zero writes
      and no split it is complete. LiteLLM deletes those None attributes in PromptTokensDetailsWrapper,
      so its completeness check raises AttributeError at line 75 or line 78 in every one of these cases.
    why: No caller can rely on a pure completeness check crashing instead of returning a bool, and a working setup sends these fields whenever it reaches this code, so the crash only shows on a hand-built input.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/baseline_accounting.py#L75-L78
out_of_scope:
  - Padded one-line functions in the baseline_history modules belong to B5094. It clears the no-one-line-functions and no-padded-one-line-functions legacy lists. This task does not touch .ast-grep/rules/.
  - The fixed status per error class belongs to B5102, already merged.
  - The source files matching.rs, estimate.rs, writes.rs, replay.rs and model.rs, and the oracle adapters tools/oracle/src/helpers/models/baseline_history.rs and tools/oracle/helpers/baseline_history.py. Every finding but gap thirteen is a test or log gap, and that code already does what LiteLLM does.
  - The eleven B1696 oracle cases already in tools/oracle/cases/helpers/baseline-history/ stay as they are; the new cases sit next to them.
pitfalls:
  - Every usage in a new case gives LiteLLM a creation count (cache_creation_tokens, cache_write_tokens or an int cache_creation_input_tokens, nested or top level) and a cache_creation_token_details split, as the B1696 cases do; without them LiteLLM raises AttributeError at baseline_accounting.py line 75 or 78 and the case compares a crash.
  - Gap thirteen's group five keeps its nested cache_creation_input_tokens in prompt_tokens_details extra. betterlite writes it back out and the Python adapter does not print it, so its requests take unsupported_cache_plan and return no usage, the same as groups three and four.
  - In gap thirteen the copies overwrite the values in prompt_tokens_details, so a fix that only fills a missing cached_tokens or cache_creation_tokens keeps the cases' explicit 0 and still answers complete; cache_creation_input_tokens has to set both cache_creation_tokens and cache_write_tokens.
  - prompt_cache_hit_tokens has no typed field, so it stays in Usage.extra and is copied only when it holds an integer, as LiteLLM's isinstance int check does. betterlite writes extra keys back out and the Python adapter prints only named usage keys, so the gap thirteen requests with prompt_cache_hit_tokens take unsupported_cache_plan, a path that returns no usage.
  - A history that starts empty sets uncertain_before to the first group's started_at, so a cold request in the next 300 or 3600 seconds answers history_unavailable; the cases for gaps one, two, three and six start from a history with first_at, last_at and uncertain_before at 0.0, so only the times the description gives decide that bound.
  - A valid plan keeps prefix_tokens rising and ttl_seconds falling, so gap three lists the 3600 second marker first with prefix 40; the other order is an invalid plan and answers unsupported_cache_plan.
  - Each breakpoint must list its own fingerprint in lookback_fingerprints and its own content_fingerprint in lookback_content_fingerprints, or is_plan_valid rejects the plan.
  - The ttl_differs unit case and the near-miss entry with the other TTL put their content_fingerprint outside the marker's lookback_content_fingerprints; with a shared content the entry is ambiguous and the request answers cache_ttl_changed instead of testing the TTL match.
  - A response_cache observation is not relevant, so its available_at never reaches blocked_until or uncertain_before; the gap eight sibling at 40.0 must leave both at 30.0.
  - Raw and its fields stay private. model/tests.rs is a child module of model and can build Raw directly, so model.rs needs no visibility change.
  - The new cases call the existing baseline_history helper operation with kind helper, compare {ignore []} and env {}, like the B1696 cases. There is no new helper operation.
  - A rewritten test takes its new name, since the checks require the old name to be gone; new assertions under the old name fail the gate.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
