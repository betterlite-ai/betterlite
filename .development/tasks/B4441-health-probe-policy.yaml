id: B4441
title: Health probe settings, deployment targeting and display fields
description: >-
  Build typed probe settings and pure deployment-selection/display helpers in crates/betterlite-server,
  with config parsing in crates/betterlite-config.
  Prepare the final health request without changing the configured deployment catalog, and expose targeting
  helpers to both live probes and cached-result authorization.

  Implement typed structs to parse health_check_* settings from config and resolve them during request
  preparation: max_tokens (with reasoning/non-reasoning variants), mode (via model_info or cost map),
  model overrides, voice (for audio_speech), and health_check_params merges. Environment variables
  BACKGROUND_HEALTH_CHECK_MAX_TOKENS, BACKGROUND_HEALTH_CHECK_MAX_TOKENS_REASONING and HEALTH_CHECK_TIMEOUT_SECONDS
  are read at startup via config with defaults unset, unset, and 60 seconds. Malformed/blank token env vars
  are treated as unset. The default health check prompt is `test from litellm`.

  Implement background_health_check_model_groups parsing from config that distinguishes absent (all models)
  from an empty list (no models) and rejects malformed input at startup. Implement disabled-background and
  skip-wildcard filtering. Deduplication drops deployments without a truthy ID; narrowing to an unknown ID
  retains the input list (unlike HTTP routing which rejects), and narrowing to a model name uses request
  routing semantics: team public names win, then deployments named that way, then public team-agnostic names,
  then model string matches.

  Implement Bedrock region routing normalization that strips bedrock/ prefix and removes region path segments
  from bedrock/region/model, preserving cross-region inference profile prefixes (us., eu., apac.).
  Explicit custom_llm_provider overrides stay; missing ones default to bedrock for bare model ids to resolve.
  A malformed health_check_params dict warns and is ignored; explicit dedicated knobs win on conflict.

  Copy the display field sets MINIMAL_DISPLAY_PARAMS and HEALTH_DISPLAY_PARAMS with admin-only subset
  ADMIN_ONLY_HEALTH_DISPLAY_PARAMS and mode constants _MAX_TOKEN_SUPPORT_MODES and
  _HEALTH_CHECK_MODES_SUPPORTING_REASONING_EFFORT.

  Use LiteLLM's TypeAdapter for validation, serde/serde_yaml for config, and secrecy types for any
  credential fields passed through. The config task (B002) owns loading and parsing; this task reads
  resolved config values and environment through constructor injection, never ambient environment.
  The health cycle (B4443) consumes these helpers; B4446 reuses targeting and display filtering.

