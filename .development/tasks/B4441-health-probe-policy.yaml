dod:
  - text: Mode resolution prefers explicit model_info.mode and falls back to the model cost map; handles unresolvable modes gracefully.
    proof: [behavior-tests]
  - text: Max token injection decision checks mode against _MAX_TOKEN_SUPPORT_MODES or model_info override; unresolvable modes default to chat.
    proof: [behavior-tests]
  - text: General settings filtering reads health_check_skip_disabled_background_models with false default.
    proof: [config-tests]
  - text: Model groups parsing returns None for absent, a set for valid lists, and raises ValueError for malformed input at startup.
    proof: [config-tests]
  - text: Model group filtering keeps deployments with matching model_name or all when unset.
    proof: [behavior-tests]
  - text: Deployment deduplication by ID drops entries without IDs and preserves first occurrence.
    proof: [behavior-tests]
  - text: "Deployment targeting by name uses routing semantics: team public names, then model_name, then public team-agnostic names, then model string fallback."
    proof: [behavior-tests]
  - text: Target narrowing by ID returns the whole list on mismatch; by model uses routing semantics.
    proof: [behavior-tests]
  - text: Health check params merge happens first; explicit mode, max_tokens, reasoning_effort, model, and voice knobs then win on conflict.
    proof: [behavior-tests]
  - text: Bedrock bedrock/region/model paths strip bedrock/ and region segments while preserving routes and cross-region inference profiles.
    proof: [behavior-tests]
  - text: Max tokens follow the priority chain and account for reasoning capability, environment variables, and wildcard status.
    proof: [behavior-tests]
  - text: Timeout wrapping returns error result on timeout and does not cancel sibling probes.
    proof: [behavior-tests]
  - text: Display field sets match LiteLLM contents and admin-only filtering is applied correctly.
    proof: [behavior-tests]
  - text: Environment variables BACKGROUND_HEALTH_CHECK_MAX_TOKENS, BACKGROUND_HEALTH_CHECK_MAX_TOKENS_REASONING, HEALTH_CHECK_TIMEOUT_SECONDS have correct defaults and handle malformed input.
    proof: [config-tests]

checks:
  optional: []
  commands:
    - id: config-tests
      why: config parsing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::health_probe_policy::/)'
    - id: behavior-tests
      why: health probe settings or deployment targeting tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_probe_settings::/)'

oracle_cases: []

deviations:
  - what: "Narrowing to an unknown deployment ID retains the input list, whereas HTTP routing in B4446 rejects it with 404."
    why: The targeting helper is used both by cached-result authorization (which needs the fallback list) and by health cycle execution; the HTTP layer adds its own validation.
  - what: "Malformed health_check_params dict logs a warning and is ignored; the request is built without that override."
    why: "LiteLLM allows passing arbitrary fields; a typo in health_check_params should not fail the health check silently."
  - what: "run_with_timeout is async and accepts a task/coroutine, returning a result dict with error and exception on timeout, matching LiteLLM's internal contract."
    why: The health cycle (B4443) supplies async tasks; the timeout wrapping must not cancel sibling probes.

out_of_scope:
  - The background health check loop, scheduled cooldown and caching integration. These are owned by B4443.
  - Native entry points (ahealth_check, acompletion, etc.) and their mode handlers. B4440 owns those.
  - HTTP routing, request validation and access control. B4446 owns the /health endpoints.
  - Health-state persistence to the database. B4445 owns that.
  - Strategy router verdicts and dependency expansion. B4442 owns those.

pitfalls:
  - "The BACKGROUND_HEALTH_CHECK_MAX_TOKENS environment variable defaults to None (unset) when absent or blank; HEALTH_CHECK_TIMEOUT_SECONDS defaults to 60 seconds (an int). Parse them at config load time to reject malformed values."
  - "Bedrock region removal must check BedrockModelInfo.all_global_regions from B2203, not hardcode region names."
  - "Wildcard deployments default to omitting max_tokens; non-wildcard default to 16. Do not invert this logic."
  - "Team public name matching is scoped to the caller's team; a caller with no team sees only public team-agnostic names."
  - "filter_deployments_by_id mutates the input list order only to deduplicate by ID; use it after narrowing, not before, to avoid dropping valid rows."
  - "HEALTH_CHECK_MODES_SUPPORTING_REASONING_EFFORT includes None (unresolvable mode) for backward compatibility; treat missing mode as chat."
  - "health_check_params is a dict that merges into litellm_params; its keys must not be validated against betterlite's typed model (no schema enforcement)."

review_level: standard

