id: B3461
title: RAG retrieval, reranking and query billing
description: >-
  Build LiteLLM's RAG query path: `aquery` and `_execute_query_pipeline` from rag/main.py, the
  `_suppressed_sub_call_billing` guard, and the `RAGQuery` helper class from rag/rag_query.py. A query takes the
  last user message, searches one vector store, optionally reranks the hits, puts the hits into a "Context:"
  message in front of the last message, calls the chat model, attaches the hits to the answer and adds the
  search and rerank cost to the answer's cost. Put it in a new module `rag_query_call` of betterlite-sdk
  (crates/betterlite-sdk/src/rag_query_call.rs and the folder beside it). The sdk crate already holds the
  completion calls this one needs, B5656 (`AsyncCompletionTarget`) and B6020 (`RouterCompletion::acompletion`),
  and betterlite-core holds search, rerank and pricing (B1064, B1014, B1686). This task registers no route.
  B3465 owns the HTTP routes and will call `aquery` from its /rag/query handler (that handler also reads the
  body, authorizes the stores and merges the managed store's settings, none of which is built here).

  Read first: the merged code of B1064 (`vector_store_search` in betterlite-core api), B1014 (`rerank_call`),
  B1686 (`cost::call_price`), B5656 (`completion_call`), B6020 (`router_completion`), B198 (call context in
  betterlite-context), B247 (the per-call log) and B1058 (the vector store search result types). Names below
  come from the task files and may differ in the merged code. Use the merged names. If an item this task needs is
  missing or private, stop and say so in the report instead of copying it.

  Four submodules. `chunks` is RAGQuery. `params` builds the search arguments. `pipeline` is
  _execute_query_pipeline. `entry` is aquery.

  Submodule `chunks` (rag_query.py L40-L148). Five pure functions with LiteLLM's names. 1.
  `extract_query_from_messages(messages)` returns None for an empty list. It looks only at the last message: None
  when it has no content, the text when content is a string (an empty string is returned as is), and for a list of
  parts the `text` of the first part whose type is "text". Anything else is None. 2. `build_context_message(chunks)`
  starts from "Context:\n\n" and returns a message with role "user" and that text as content. A chunk is a
  `ContextChunk`, an enum with `Result { content: Option<Vec<ContentItem>>, text: Option<String> }` and
  `Text(String)`. For a Result with a non-empty `content` list, add every item's text that is non-empty, each
  followed by "\n\n"; items without text add nothing, and then the Result's own `text` is not used. Only when
  `content` is None or empty does a Result with `text` present add that text and "\n\n" (an empty `text` still
  adds "\n\n"). A Text chunk adds its string and "\n\n". 3. `extract_documents_from_search(response)` walks the
  response `data` list and each result's `content` list and collects the text of every item whose type is "text"
  and whose text is non-empty. 4. `get_top_chunks_from_rerank(search, rerank)` walks the rerank `results`, and for
  each result with an index less than the number of search hits returns that hit, in rerank order, repeats included.
  A result without an index is skipped. A negative index counts from the end like Python's list indexing, and an
  index below minus the length is the typed error `RagQueryError::RerankIndex` (Python's IndexError). 5.
  `add_search_results_to_response(response, search, rerank)` sets `provider_specific_fields.search_results` on the
  message of every choice that has a message, keeping the other fields already there, and sets
  `rerank_results` only when a rerank response was given. Use B1058's typed search result and B1014's typed rerank
  response. The typed search result has no `text` field, so the pipeline always builds `ContextChunk::Result` with
  `text: None`; the `text` and `Text` forms exist because the function takes any list of chunks, and the helper cases
  exercise them.

  Submodule `params` (main.py L45-L71 and L243-L270). Constants `FORWARDABLE_KEYS` (aws_region_name,
  vector_bucket_name, embedding_model, litellm_embedding_model, litellm_embedding_config, litellm_credential_name)
  and `PIPELINE_SET_KEYS` (vector_store_id, query, max_num_results, custom_llm_provider, router). A typed
  `RetrievalConfig` holds vector_store_id (required), custom_llm_provider, top_k, retrieval_filter, filters, the six
  forwardable keys as named optional fields, and the merged managed-store settings the route adds. A typed
  `SearchParams` is what the search call receives besides its own named arguments. `build_search_params(config,
  top_level_filters, caller_extras, store_params)` merges four layers in this order, the later one winning on the
  same key: the forwardable keys present in the config, then the caller extras (every request field left over after
  the pipeline took `router` and `filters`), then `{filters}`, then the store params with PIPELINE_SET_KEYS
  removed. `filters` is the first truthy of config.retrieval_filter, config.filters and the top-level filters (an
  empty object is falsy), and the layer is empty when none is truthy. The config's own `api_base`, `api_key` and
  any other key outside the allowlist never reach the search: this keeps a caller from sending the store's
  credentials to another host. A caller extra whose name is one of PIPELINE_SET_KEYS makes Python's call fail
  with TypeError "asearch() got multiple values for keyword argument '<name>'"; return
  `RagQueryError::DuplicateArgument(name)` with that text.

  Submodule `pipeline` (main.py L226-L350). `QuerySteps` is an async trait the pipeline calls, so tests run it
  against a scripted fake: `search`, `search_cost`, `rerank`, `complete` and `add_extra_cost`. The production
  `NativeQuerySteps` implements it over B1064's asearch, B1686's vector store cost, B1014's arerank,
  B6020's `RouterCompletion::acompletion` when the request carries a router and B5656's `AsyncCompletionTarget`
  when it does not, and B247's call log. `run_query(steps, ctx, request)` does this in order. 1. Take the
  query with `extract_query_from_messages`; if it is None or empty, fail with
  `RagQueryError::NoQuery`, message "No query found in messages for RAG query" (a ValueError in Python). 2. Build
  the search params. 3. Search: vector_store_id from the config, `query`, `max_num_results` = config.top_k,
  default 10 only when the key is absent (an explicit null stays null), and `custom_llm_provider` =
  config.custom_llm_provider, default "openai" only when absent. 4. Price the search with B1686's vector store
  cost, sum its two numbers, and use 0.0 on any error. Python passes provider = config provider (default
  "openai") and gives a model only when that provider string has a "/" in it. When the config holds an explicit
  null provider, Python's `"/" in None` raises inside the same try block, so the cost is 0.0. Keep that. 5.
  Rerank only when `rerank` is present and `enabled` is true and the extracted documents are non-empty: call arerank
  with `rerank.model` (required, a missing model is `RagQueryError::MissingField("model")`), the query, the documents
  and `top_n` (default 5). The rerank cost is the response's hidden `response_cost`, or 0.0 when absent or null. The
  context chunks become `get_top_chunks_from_rerank`. When rerank is off or there are no documents, the context
  chunks are the whole search `data` list. A null `data` or null rerank `results` is the typed error
  `RagQueryError::NullList` (Python iterates None and raises TypeError). 6. Build the context message and the new
  message list: all messages but the last, the context message, then the last message. 7. Call chat completion with
  the model, those messages, `stream` and the leftover request fields. Use the router when the request has one, the
  direct call otherwise. 8. Attach and bill. When `stream` is false and the answer is a finished model response:
  attach search and rerank results with `add_search_results_to_response`, and when the summed sub-call cost is
  above zero and the response's hidden `response_cost` is present, add the cost to it (a missing hidden cost stays
  missing and the sub-call cost is lost). In every other case (a stream, or any answer that is not a finished
  model response) with a summed cost above zero, call `add_extra_cost` with the cost, which sets
  `additional_response_cost` on the call log when the request carries one and does nothing otherwise. A stream gets
  no search results attached.

  The three sub-calls (search, rerank, completion) run under an internal context: derive a child of `ctx` with
  B198's internal-call provenance and pass that child to `search`, `rerank` and `complete`, not to `search_cost`
  or `add_extra_cost`. This is `_suppressed_sub_call_billing`: Python sets a context variable around the call and
  resets it to the previous value afterward, even on error. In Rust the child value dies with the call, so there
  is nothing to reset. Do not add a context variable or a static.

  Submodule `entry`. `aquery(request, call)` is aquery (L353-L399) as one async function. Call `run_query`; on an
  error map it through betterlite-error's dispatch (crates/betterlite-error/src/dispatch.rs, B185 and B186) with
  `model` = the request model and `custom_llm_provider` = the config's raw provider (None when absent, even though
  the search used "openai"). LiteLLM maps twice, in query and in aquery, and its second pass returns an already
  mapped exception unchanged (exception_mapping_utils.py L2366-L2367), so map once. Errors from the search,
  rerank and completion steps are already LiteLLM-style errors and pass through unchanged.

  Oracle helper. Helper cases run the five RAGQuery functions in Python and in Rust and compare results. One
  helper operation named after this task id, with a variant tag per function under `call`: `extract_query`,
  `context_message`, `documents`, `top_chunks`, `attach_results`. The skeleton creates the operation and the
  worker writes its adapter files. The Python side builds a `ModelResponse` with choices for `attach_results`
  and projects each choice's `provider_specific_fields`. No HTTP case belongs here, because no route reaches
  `aquery` until B3465 registers the query route; B3465 adds those. The pipeline is covered by Rust tests with a
  scripted `QuerySteps`, since a helper adapter cannot run it without the proxy's globals.

  Size. The owned LiteLLM code is about 190 nonblank, non-comment lines. Allow 330 implementation, 300 tests,
  100 adapters and 80 case lines.

