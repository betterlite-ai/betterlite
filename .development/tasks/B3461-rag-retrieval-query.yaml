dod:
  - text: extract_query_from_messages reads only the last message, returns a string content as is and the first text part of a list, and returns None for everything else.
    proof: [chunks-query, oracle, helper-python]
  - text: build_context_message starts with "Context:\n\n", skips items without text, uses a Result's own text only when its content is None or empty, and adds Text chunks.
    proof: [chunks-context, oracle]
  - text: extract_documents_from_search and get_top_chunks_from_rerank pick the text items, keep rerank order, skip results without an index and read a negative index from the end.
    proof: [chunks-documents, oracle]
  - text: add_search_results_to_response sets search_results on every choice message, keeps other provider_specific_fields, and sets rerank_results only when given.
    proof: [chunks-attach, oracle]
  - text: build_search_params applies the four layers in order, takes filters from retrieval_filter before filters before the top-level value, drops keys outside the allowlist and refuses a caller extra that clashes with a pipeline key.
    proof: [params-merge]
  - text: run_query fails with the NoQuery message for a missing or empty query and does not search.
    proof: [pipeline-query]
  - text: run_query searches with top_k 10 and provider "openai" only when those keys are absent, and passes an explicit null through.
    proof: [pipeline-search]
  - text: The search cost is the sum of both numbers of the vector store cost, and is 0.0 on an error or an explicit null provider.
    proof: [pipeline-cost]
  - text: Rerank runs only when enabled with documents, uses top_n 5 by default, reads the cost from the response's hidden response_cost, and replaces the context chunks with the reranked hits.
    proof: [pipeline-rerank]
  - text: The message list sent to the model is the earlier messages, the context message, then the last message.
    proof: [pipeline-messages]
  - text: A finished non-stream answer gets the search and rerank results and the summed cost added to its hidden response_cost, and a stream or other answer sends the cost to add_extra_cost and gets no results.
    proof: [pipeline-billing]
  - text: Search, rerank and completion receive an internal child context, and cost pricing does not.
    proof: [pipeline-internal]
  - text: aquery maps any pipeline error once, with the request model and the config's raw custom_llm_provider.
    proof: [entry-error-map]
  - text: Helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: chunks-query
      why: the query text rules are missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::chunks::tests::query_text_/)'
    - id: chunks-context
      why: the context message text rules are missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::chunks::tests::context_message_/)'
    - id: chunks-documents
      why: document extraction or the rerank index mapping is missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::chunks::tests::(documents|top_chunks)_/)'
    - id: chunks-attach
      why: the results are not attached to the choices
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::chunks::tests::attach_/)'
    - id: params-merge
      why: the search argument layers, the filters choice or the allowlist is missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::params::tests::/)'
    - id: pipeline-query
      why: a missing query still searches or the error text is wrong
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::pipeline::tests::query_/)'
    - id: pipeline-search
      why: the search defaults or the explicit null pass-through are missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::pipeline::tests::search_/)'
    - id: pipeline-cost
      why: the search cost sum or its zero fallbacks are missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::pipeline::tests::cost_/)'
    - id: pipeline-rerank
      why: the rerank step, its defaults or its cost are missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::pipeline::tests::rerank_/)'
    - id: pipeline-messages
      why: the context message is in the wrong place in the message list
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::pipeline::tests::messages_/)'
    - id: pipeline-billing
      why: the cost folding or the stream path is missing
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::pipeline::tests::billing_/)'
    - id: pipeline-internal
      why: a sub-call runs without the internal child context, or the pricing gets it
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::pipeline::tests::internal_/)'
    - id: entry-error-map
      why: errors are not mapped, are mapped twice, or lose the raw provider
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^rag_query_call::entry::tests::mapped_error_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3461)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3461 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3461/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added rag query cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/rag_query_call-*")" &&
        grep -lE '^[[:space:]]+b3461:' tools/oracle/fuzz/corpus/helper_case/rag_query_call-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

