deviations:
  - what: Only the async entry exists. LiteLLM's sync `query`, and aquery's executor and contextvars hand-off, are not built.
    why: The only caller is the async /rag/query handler. The sync path exists only to run the coroutine on an event loop, which Rust has no use for.
  - what: A list that Python would iterate as None (a null search `data`, a null rerank `results`) is the typed error `RagQueryError::NullList`, and a rerank index below minus the hit count is `RagQueryError::RerankIndex`.
    why: Python raises TypeError and IndexError there. Both reach the client through the error mapping, so the call still fails, with a message that names the cause instead of Python's.
  - what: A caller extra named vector_store_id, query, max_num_results, custom_llm_provider or router fails with the same "got multiple values" text, as `RagQueryError::DuplicateArgument`.
    why: Python fails at the call site with TypeError. The typed version keeps the failure and the words.
  - what: The error is mapped once at aquery, not in query and again in aquery.
    why: exception_type returns an already mapped LiteLLM exception unchanged, so the client sees the same error.

out_of_scope:
  - The /rag/query and /v1/rag/query routes, request body reading, required-field 400s, embedding-selection rejection, nested store authorization, the managed store merge, response headers and the stream wrapper. B3465 and B3463 own them (endpoints.py).
  - The @client decorator on aquery and query (call ids, logging object, callbacks). B012 owns the logging pipeline and B3465 attaches it.
  - litellm.vector_stores.asearch, arerank and acompletion, and Router.acompletion themselves. B1064, B1014, B5656 and B6020 own them.
  - vector_store_search_cost. B1686 owns it. This task only calls it.
  - The sync `query` function. See deviations.
  - RAGQueryRequest, RAGQueryResponse, RAGRetrievalConfig and RAGRerankConfig as Python model classes. B3450 left them out; this task defines the typed config and rerank settings the pipeline reads.
  - The ingest side of rag/main.py (aingest, ingest, _execute_ingest_pipeline, the registry). B3450 and B3460 own them.
  - litellm/rag/utils.py and litellm/rag/__init__.py. Nothing in the query path calls them.

pitfalls:
  - The empty-query check is falsy, so a last message with an empty string as content fails with "No query found in messages for RAG query" just like a missing one.
  - '`top_k` and `custom_llm_provider` use `.get(key, default)`, so the defaults 10 and "openai" apply only when the key is absent, and an explicit null goes to the search as null.'
  - The cost call computes `"/" in search_provider` inside the try block, so a null provider turns into a 0.0 cost, not an error.
  - A hit whose `content` is a non-empty list with no text items adds nothing, and its `text` field is not used as a fallback.
  - When the non-stream answer has no hidden `response_cost` (null), the sub-call cost is dropped and `add_extra_cost` is not called, because the `elif` is only reached for streams and non-model answers.
  - A stream never gets `search_results` or `rerank_results`, only the extra cost on the call log.
  - '`rerank_results` is set only when a rerank response exists, so a rerank that was enabled but had no documents leaves the key out.'
  - The leftover request fields go to the search call and to the completion call, but `filters` and `router` are taken out first, so neither is forwarded to the model.
  - The store params win last in the search arguments, so a caller cannot override the store's provider or credentials through the request.
  - Rerank is called with no `custom_llm_provider`; the provider comes from the model name.
review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
