pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_invoke_response in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/invoke_response.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_invoke_response.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An empty tool_calls list bypasses the empty-text failure because the source tests None, not truthiness.
- A Mistral parsing error with status 400 is wrapped by this caller as status 422.
