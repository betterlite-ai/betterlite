id: B612
title: Bedrock Invoke reply conversion and stream ownership
description: >-
  Add InvokeReply decoding for base provider families and the typed custom stream wrapper. Preserve token counts
  from body/header, response metadata, provider-specific field names and malformed-body errors. Family-specific
  transforms compose through explicit match arms added by their tasks.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py:
  AmazonInvokeConfig.transform_response L281-L419; AmazonInvokeConfig.get_async_custom_stream_wrapper L444-L480;
  AmazonInvokeConfig.get_sync_custom_stream_wrapper L483-L523; AmazonInvokeConfig.has_custom_stream_wrapper L526-L527;
  AmazonInvokeConfig.supports_stream_param_in_request_body L530-L534.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse make_call from B691 (litellm/llms/bedrock/chat/invoke_handler.py); its implementation remains with that
  prerequisite.


  Reuse make_sync_call from B691 (litellm/llms/bedrock/chat/invoke_handler.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/invoke_response.rs with adjacent tests under invoke_response/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_invoke_response in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_response_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): ai21_completion, cohere_generations, titan_output, llama_generation, mistral_output, response_header_token_counts,
  stream_owned_response. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_response* using HelperCase: kind:
  helper and the externally tagged bedrock_invoke_response variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_invoke_response that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_invoke_reply consumes Invoke response JSON bytes in crates/betterlite-bedrock/src/invoke_response.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_invoke_response.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_invoke_response.
  The adjacent test replays_the_bedrock_invoke_response_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 217 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 511 planned, 525 maximum changed lines.
