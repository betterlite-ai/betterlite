id: B612
title: Bedrock Invoke reply conversion and stream ownership
description: >-
  Decode buffered Invoke responses and compose the concrete provider reply transforms. The custom stream methods
  now belong to lower B2206, so this selector can depend directly on Nova, Claude and Pegasus without a reverse
  dependency. Preserve the three distinct failure boundaries and header-only base-family usage.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py:
  AmazonInvokeConfig.transform_response L281-L419.


  Named case contracts: base_family_outputs: Use B2205 provider selection. Cohere text key presence wins over generations
  and leaves finish_reason unchanged; otherwise use generations[0].text and B206 map_finish_reason on its required
  finish_reason. AI21 uses completions[0].data.text; meta,llama,deepseek_r1 use generation. Mistral delegates B613
  get_outputText including its raw finish reason. Every other base family falls through to results[0].outputText
  as Titan, including unknown providers. Do not read body token counts in these branches. family_reply_delegation:
  Anthropic B618, Nova B614 and Pegasus B617 return their complete responses immediately, bypassing base content/usage/clock
  handling. Forward all source arguments; Nova does not receive api_key while Anthropic and Pegasus do. All three
  receive json_mode. Their exceptions are inside the common processing catch and become BedrockError 422. decode_and_processing_errors:
  JSON decoding failures use B682 BedrockError with raw response status, raw text message and original headers,
  even for status 200. Valid JSON with a malformed family payload instead yields status 422 and message Error processing={raw_response.text},
  Received error={error}. The same catch wraps delegated family errors, including an existing BedrockError; compare
  its displayed message. Successful JSON is debug-logged with indent=4 and default=str before provider selection.
  content_assignment_and_empty: Assign outputText only when it is not None, has positive length, and choices[0].message
  exists with tool_calls None. Any tool_calls value other than None, including [], suppresses assignment and accepts
  empty/missing text. Otherwise raise BedrockError using the original response status/headers and message Error
  parsing received text={outputText}.

  Error-{error}. Distinguish this boundary from the earlier 422 processing catch; preserve preexisting content on
  the tool-call path. response_header_token_counts: Read x-amzn-bedrock-input-token-count and x-amzn-bedrock-output-token-count
  case-insensitively through response headers. Truthy strings, including "0" and negative numbers, are passed to
  int; missing/empty values call B196 token_counter on messages or reply text with count_response_tokens=True. Conversion
  and fallback errors occur outside both catches. Set usage prompt/completion/total to these values and their sum;
  ignore body usage. Preserve response id and other fields, set created to integer epoch seconds and model to the
  requested model.


  Implement crates/betterlite-bedrock/src/invoke_response.rs with adjacent tests under invoke_response/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_response_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): base_family_outputs, family_reply_delegation, decode_and_processing_errors, content_assignment_and_empty,
  response_header_token_counts. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_response* using HelperCase: kind:
  helper and the externally tagged bedrock_invoke_response variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_invoke_response that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_invoke_reply consumes Invoke response JSON bytes in crates/betterlite-bedrock/src/invoke_response.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_invoke_response.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_invoke_response.
  The adjacent test replays_the_bedrock_invoke_response_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 132 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 175 production lines, 210 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 570 planned, 575 maximum changed lines.
