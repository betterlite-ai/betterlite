  commands:
  - id: case-ai21-completion
    why: The ai21-completion behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_response_cases::case_[0-9]+_ai21_completion$/)'
  - id: case-cohere-generations
    why: The cohere-generations behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_response_cases::case_[0-9]+_cohere_generations$/)'
  - id: case-titan-output
    why: The titan-output behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_response_cases::case_[0-9]+_titan_output$/)'
  - id: case-llama-generation
    why: The llama-generation behavior is missing or differs from its pinned fixture.
