id: B8153
title: vllm passthrough, model info and petals configs
description: >-
  Build the vllm and petals provider code in betterlite-provider as crates/betterlite-provider/src/vllm.rs and petals.rs with their folders. All are pure transforms; the main.py dispatch (_complete_petals) stays with B8157.

  vllm: VLLMError and VLLMModelInfo from common_utils.py (validate_environment, get_api_base, get_api_key, get_base_model, get_models, get_error_class), VLLMConfig (a thin layer over the hosted_vllm chat config of B8150), and VLLMPassthroughConfig (is_streaming_request, get_complete_url) over the passthrough contract of B3570. B2220 builds the model metadata factory and uses VLLMModelInfo, so build the type here with the exact method names it calls.

  vllm in-process SDK: handler.py runs a local vllm Python engine (completion, batch_completions, embedding, validate_environment). That cannot run in Rust. Build the request-to-prompt and reply-to-ModelResponse shaping only if it is a pure function; the call into the engine is not ported and returns a typed error with LiteLLM's message (see deviations).

  petals: PetalsError, PetalsConfig (get_config, get_error_class, get_supported_openai_params, map_openai_params, transform_request, transform_response, validate_environment) and the HTTP branch of handler.py completion. The local torch branch is not ported, same as vllm. The petals reply is decoded with a typed struct and has a fuzz target.

  Where the source and this text differ, the source at the pinned commit wins.
scope:
  paths:
    - crates/betterlite-provider/src/vllm.rs
    - crates/betterlite-provider/src/vllm/**
    - crates/betterlite-provider/src/petals.rs
    - crates/betterlite-provider/src/petals/**
    - crates/betterlite-provider/fuzz/Cargo.toml
    - crates/betterlite-provider/fuzz/fuzz_targets/petals_reply.rs
    - crates/betterlite-provider/fuzz/corpus/petals_reply/**
    - Cargo.lock
    - tools/oracle/cases/helpers/vllm-petals/**
    - tools/oracle/helpers/b8153.py
    - tools/oracle/helpers/b8153/**
    - tools/oracle/src/helpers/provider/b8153.rs
    - tools/oracle/src/helpers/provider/b8153/**
  lint_tables: false
