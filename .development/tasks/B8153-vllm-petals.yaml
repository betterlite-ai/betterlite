    why: VLLMConfig.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vllm/passthrough/transformation.py#L1-L32
    why: Passthrough config.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/petals/common_utils.py#L1-L8
    why: PetalsError.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/petals/completion/handler.py#L1-L146
    why: Petals handler.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/petals/completion/transformation.py#L1-L133
    why: Petals config.
dod:
  - text: VLLMModelInfo, VLLMConfig and VLLMPassthroughConfig give LiteLLM's api base, key, URL and streaming detection.
    proof: [vllm-petals-tests, vllm-petals-cases]
  - text: Petals params, request and reply transforms match, and a bad reply gives the same error.
    proof: [vllm-petals-tests, vllm-petals-cases]
  - text: The in-process engine paths return the typed not-supported error instead of running.
    proof: [vllm-petals-tests, vllm-petals-cases]
  - text: The reply decoder rejects malformed bodies without panicking and its corpus replays.
    proof: [vllm-petals-corpus]
  - text: New helper cases for these functions exist.
    proof: [vllm-petals-cases]
checks:
  optional: [mutants]
  commands:
    - id: vllm-petals-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^vllm::/) | test(/^petals::/)'
      why: Without this provider code there are no such tests, so the check fails on the base branch.
    - id: vllm-petals-corpus
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/petals_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/petals_reply)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_petals_reply_corpus)'
      why: Bytes come from outside and need a fuzz target with a replayed corpus.
    - id: vllm-petals-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/vllm-petals)"
      why: Without new case files the oracle proof passes with nothing compared.
oracle_cases:
  - tools/oracle/cases/helpers/vllm-petals/vllm-model-info.yaml
  - tools/oracle/cases/helpers/vllm-petals/vllm-passthrough.yaml
  - tools/oracle/cases/helpers/vllm-petals/petals-params.yaml
  - tools/oracle/cases/helpers/vllm-petals/petals-request.yaml
  - tools/oracle/cases/helpers/vllm-petals/petals-reply.yaml
deviations:
  - what: "The vllm in-process engine handler and the petals local torch branch return a typed error with status 400 and LiteLLM's missing-package message."
    why: "Both run Python ML libraries inside the process, which a Rust gateway cannot do. The architect decides the final status and text."
out_of_scope:
  - "B8157 owns main.py _complete_petals and the dispatch wiring."
  - "B2220 owns the provider metadata factory; B3627 uses VLLMPassthroughConfig and VLLMModelInfo from here."
  - "B8150 owns the hosted_vllm chat config that VLLMConfig extends."
pitfalls:
  - "The oracle helper for this task is pre-registered as b8153 by the skeleton. Write its Rust and Python files as the skeleton leaves them; the registry files are not this task's to edit."
  - "get_models lists models over HTTP with the injected client; it never uses a request-supplied URL."
  - "VLLMError exists twice in LiteLLM (common_utils.py and handler.py); build the common_utils one and map the handler one onto it."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
