  - id: case-request-optional-presence
    why: Include instructions and transformed tools whenever not None, including empty values; preserve model/input
      directly and keep empty assistant messages when no tool calls exist.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_request_optional_presence$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_count_tokens_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_count_tokens_secret_safe_failure$/)'
