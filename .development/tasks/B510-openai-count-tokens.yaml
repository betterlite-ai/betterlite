id: B510
title: OpenAI Responses token counting
description: >-
  Build the native OpenAI Responses input-token counter, chat-to-input conversion and HTTP request. Resolve credentials
  only from deployment litellm_params.api_key or OPENAI_API_KEY, and api_base only from litellm_params.api_base
  with https://api.openai.com/v1 default. On API failure return error=true, total_tokens=0 and the provider status_code
  (500 for other exceptions); missing messages/key/input returns None. Local fallback belongs to callers in main.py
  and proxy_server.py and is not performed here.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/responses/count_tokens/handler.py:
  OpenAICountTokensHandler.handle_count_tokens_request L26-L101. litellm/llms/openai/responses/count_tokens/token_counter.py:
  OpenAITokenCounter.should_use_token_counting_api L26-L30; OpenAITokenCounter.count_tokens L32-L114. litellm/llms/openai/responses/count_tokens/transformation.py:
  _chat_image_block_to_responses_part L35-L45; _chat_file_block_to_responses_part L48-L61; _chat_block_to_responses_part
  L64-L83; chat_content_blocks_to_responses_content L86-L100; OpenAICountTokensConfig.get_openai_count_tokens_endpoint
  L112-L115; OpenAICountTokensConfig.transform_request_to_count_tokens L117-L140; OpenAICountTokensConfig.get_required_headers
  L142-L146; OpenAICountTokensConfig.validate_request L148-L153; OpenAICountTokensConfig._transform_tools_for_responses_api
  L156-L181; OpenAICountTokensConfig.messages_to_responses_input L184-L248.


  Reuse OpenAIError.__init__ from B668 (litellm/llms/openai/common_utils.py); its implementation remains with that
  prerequisite.


  Named case contracts: text_and_content_array: Bare strings and type=text blocks become input_text; nonstring text
  becomes empty. Text-only lists join with newline, while any retained media keeps typed parts. System/developer
  text joins into instructions in input order; unknown roles are ignored. image_and_file_parts: User images require
  a nonempty string URL and default detail to auto unless a nonempty string is provided; inline files require nonempty
  filename and file_data strings. Assistant media, malformed files/images and unknown blocks are dropped. tool_definitions_and_results:
  Flatten type=function/function into type/function name/description/parameters, defaulting to empty strings and
  {}, copying strict only when present; other tools pass through. Assistant tool calls become function_call with
  call_id/name/arguments default empty, following nonempty assistant content; tool messages become function_call_output.
  missing_model: validate_request rejects false model with ValueError (model parameter is required), then false
  input with ValueError (input parameter is required); handler wraps either as OpenAIError 500, while the high-level
  counter returns its error record. native_count_success: Select native API only for provider openai; return total_tokens=result.input_tokens
  default 0, tokenizer_type=openai_api, request_model/model_used and original_response, retaining absent versus
  explicit None input_tokens. count_failure_zero_status: A non-200 response or HTTPStatusError retains upstream
  status; request/JSON/ValueError failures become OpenAIError 500. Counter logs a warning and returns error=true,total_tokens=0,status_code
  plus error_message; other exceptions use 500. missing_input_returns_none: Missing/empty messages, no resolved
  key (with a warning), or system-only/no input items returns None before HTTP. contents is unused. Extracted instructions
  take precedence over system, even when empty; otherwise stringify nonstring system using Python str. credentials_ignore_module_overrides:
  Use deployment.litellm_params.api_key then OPENAI_API_KEY, and only deployment.litellm_params.api_base; ignore
  litellm.api_key/openai_key/api_base and OPENAI_BASE_URL/OPENAI_API_BASE. count_http_headers_timeout: POST {trimmed
  base}/responses/input_tokens, default base https://api.openai.com/v1, with Content-Type: application/json and
  Authorization: Bearer {api_key}; timeout is explicit unless None, then injected litellm.request_timeout (default
  6000 seconds through B004 config). request_optional_presence: Include instructions and transformed tools whenever
  not None, including empty values; preserve model/input directly and keep empty assistant messages when no tool
  calls exist.


  Write standalone Rust test openai_count_tokens_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_count_tokens_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-openai/src/count_tokens.rs with adjacent tests under count_tokens/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_count_tokens in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function count_tokens_cases in betterlite-openai with these exact named cases (one per oracle file):
  text_and_content_array, image_and_file_parts, tool_definitions_and_results, missing_model, native_api_selected,
  native_count_success, count_failure_zero_status, missing_input_returns_none, credentials_ignore_module_overrides,
  python_string_tool_output, count_http_headers_timeout, request_optional_presence. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_count_tokens* using HelperCase: kind:
  helper and the externally tagged openai_count_tokens variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_count_tokens that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_input_token_count consumes input_tokens HTTP response bytes in crates/betterlite-openai/src/count_tokens.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_count_tokens.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_count_tokens.
  The adjacent test replays_the_openai_count_tokens_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 311 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 340 production lines, 235 behavior/config-test lines,
  135 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 790 planned, 800 maximum changed lines.
