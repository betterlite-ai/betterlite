deviations: []
out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Assistant image/file parts are discarded before deciding whether to emit an empty assistant message; counting
  user content with the assistant role produces different input.
- An empty extracted instructions string blocks the separate system fallback because the check is is None.
- Non-string function-call output uses Python str(), including single quotes in dictionary representations.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
