  - mutants
  commands:
  - id: case-text-and-content-array
    why: Bare strings and type=text blocks become input_text; nonstring text becomes empty. Text-only lists join
      with newline, while any retained media keeps typed parts. System/developer text joins into instructions in
      input order; unknown roles are ignored.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_text_and_content_array$/)'
  - id: case-image-and-file-parts
    why: User images require a nonempty string URL and default detail to auto unless a nonempty string is provided;
      inline files require nonempty filename and file_data strings. Assistant media, malformed files/images and
      unknown blocks are dropped.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_image_and_file_parts$/)'
  - id: case-tool-definitions-and-results
    why: Flatten type=function/function into type/function name/description/parameters, defaulting to empty strings
      and {}, copying strict only when present; other tools pass through. Assistant tool calls become function_call
      with call_id/name/arguments default empty, following nonempty assistant content; tool messages become function_call_output.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_tool_definitions_and_results$/)'
  - id: case-missing-model
    why: validate_request rejects false model with ValueError (model parameter is required), then false input with
      ValueError (input parameter is required); handler wraps either as OpenAIError 500, while the high-level counter
      returns its error record.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_missing_model$/)'
  - id: case-native-api-selected
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-count-tokens/native-api-selected.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_native_api_selected$/)'
  - id: case-native-count-success
    why: Select native API only for provider openai; return total_tokens=result.input_tokens default 0, tokenizer_type=openai_api,
      request_model/model_used and original_response, retaining absent versus explicit None input_tokens.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_native_count_success$/)'
  - id: case-count-failure-zero-status
    why: A non-200 response or HTTPStatusError retains upstream status; request/JSON/ValueError failures become
      OpenAIError 500. Counter logs a warning and returns error=true,total_tokens=0,status_code plus error_message;
      other exceptions use 500.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_count_failure_zero_status$/)'
  - id: case-missing-input-returns-none
    why: Missing/empty messages, no resolved key (with a warning), or system-only/no input items returns None before
      HTTP. contents is unused. Extracted instructions take precedence over system, even when empty; otherwise stringify
      nonstring system using Python str.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_missing_input_returns_none$/)'
  - id: case-credentials-ignore-module-overrides
    why: Use deployment.litellm_params.api_key then OPENAI_API_KEY, and only deployment.litellm_params.api_base;
      ignore litellm.api_key/openai_key/api_base and OPENAI_BASE_URL/OPENAI_API_BASE.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_credentials_ignore_module_overrides$/)'
  - id: case-python-string-tool-output
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-count-tokens/python-string-tool-output.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_python_string_tool_output$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_count_tokens.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_count_tokens*")"
      && grep -lq 'openai_count_tokens' tools/oracle/fuzz/corpus/helper_case/openai_count_tokens* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_count_tokens$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_count_tokens)"
      && grep -q 'decode_input_token_count' crates/betterlite-openai/fuzz/fuzz_targets/openai_count_tokens.rs &&
      cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_count_tokens_corpus$/)'
