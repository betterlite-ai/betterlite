checks:
  optional: []
  commands:
    - id: provider-catalog
      why: "provider catalog is missing, incomplete or has wrong env_key/models"
      run: |-
        grep -q '"openai"' crates/betterlite/src/*.rs && grep -q 'gpt-4o' crates/betterlite/src/*.rs && grep -q 'ANTHROPIC_API_KEY' crates/betterlite/src/*.rs && grep -q 'claude-haiku' crates/betterlite/src/*.rs && grep -q 'AZURE_AI_API_KEY' crates/betterlite/src/*.rs && grep -q 'AWS_ACCESS_KEY_ID' crates/betterlite/src/*.rs && grep -q 'ollama' crates/betterlite/src/*.rs && grep -q 'localhost:11434' crates/betterlite/src/*.rs
    - id: color-support-tests
      why: "color support checks fail or do not exist"
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^terminal_styling::/)' || cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(.*color.*)'
    - id: styled-input-tests
      why: "styled_input readline wrapping tests fail or do not exist"
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^styled_input::/)' || cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(.*styled_input.*)'
    - id: yaml-escape-tests
      why: "YAML escape tests fail or do not exist"
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^yaml_escape::/)' || cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(.*yaml.*escape.*)'
    - id: interactive-select-tests
      why: "interactive provider selector tests fail or do not exist"
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^provider_selection::interactive.*/)' || cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(.*interactive.*select.*)'
    - id: raw-mode-tests
      why: "raw terminal mode restoration tests fail or do not exist"
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^provider_selection::.*raw/)' || cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(.*raw.*mode.*)'
    - id: fallback-select-tests
      why: "numeric fallback selector tests fail or do not exist"
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^provider_selection::fallback/)' || cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(.*fallback.*select.*)'
    - id: welcome-tests
      why: "welcome message tests fail or do not exist"
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^welcome/)' || cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(.*print_welcome.*)'
oracle_cases: []
deviations:
  - what: "The six-provider catalog and ANSI styling are built as Rust code, not referenced from LiteLLM at runtime."
    why: "betterlite is Rust and does not import LiteLLM modules; the catalog and colors are part of the wizard support layer."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/setup_wizard.py#L43-L138"
  - what: "NO_COLOR support is read through the injected EnvironmentLookup from B002, not directly from os.environ."
    why: "All environment reads go through the config boundary for testability and injection."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/setup_wizard.py#L140-L141"
out_of_scope:
  - "`SetupWizard.run` (L226-231) — entry point for the wizard flow; owned by B135."
  - "`SetupWizard._wizard` (L235-254) — orchestrates the complete wizard steps; owned by B135."
  - "`SetupWizard._collect_keys` (L390-426) — collects and validates keys using _prompt_key and _validate_and_report; owned by B135."
  - "`SetupWizard._prompt_key` (L428-438) — prompts for a single API key with skip option; owned by B135."
  - "`SetupWizard._validate_and_report` (L440-468) — validates credentials via check_valid_key and offers re-entry; owned by B135."
  - "`SetupWizard._proxy_settings` (L472-490) — collects port and master key from user; owned by B135."
  - "`SetupWizard._build_config` (L494-550) — generates litellm_config.yaml from providers and env vars; owned by B135."
  - "`SetupWizard._print_success` (L554-571) — prints config saved message and startup instructions; owned by B135."
  - "`SetupWizard._offer_start` (L573-620) — prompts to start the proxy and invokes it via os.execlp; owned by B135."
  - "`run_setup_wizard` (L628-631) — public entrypoint called by litellm --setup; owned by B135."
  - "Key validation (check_valid_key) calls litellm.completion with a test message; owned by an unassigned task."
  - "CLI command parsing for --setup; that belongs to the CLI owner."
pitfalls:
  - "ANSI sequences must be wrapped with readline markers (\\001 and \\002) in TTY contexts, or stripped entirely in non-TTY, so readline correctly tracks the cursor column and does not treat escape codes as characters."
  - "Raw mode via termios.tcgetattr/tcsetattr must be restored in a finally block even on KeyboardInterrupt, or the terminal is left in an unusable state."
  - "Arrow key escape sequences start with \\x1b[ and must be read as three bytes: escape, bracket, and the direction byte (A, B, etc.). The _read_key function handles multibyte sequences and UTF-8 decode errors gracefully."
  - "Empty NO_COLOR (present but with no value) disables styling, not absent NO_COLOR. Check os.environ.get('NO_COLOR') is not None, not os.environ.get('NO_COLOR')."
  - "The _render_selector must count actual newlines in printed content to move the cursor up correctly; using string length is incorrect."
  - "Numeric input parsing must deduplicate and sort valid indices, so 1,2,1,3 becomes [PROVIDERS[0], PROVIDERS[1], PROVIDERS[2]] not a repeat."
review_level: standard
