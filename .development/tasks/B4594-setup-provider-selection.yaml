id: B4594
title: Setup wizard terminal input and provider selection
description: >-
  Build terminal styling, readline-safe prompts and provider selection, with raw-key navigation and the number-input fallback. Keep the pinned provider cards and YAML-scalar escaping together as wizard support callable by the final entry.

  Implement terminal color support helpers (color(), bold(), orange(), green(), blue(), grey(), dim()), a styled input function that wraps ANSI sequences for readline compatibility, and YAML string escaping for safe scalar embedding. Add the SetupWizard class with provider selection using raw terminal mode for arrow-key navigation (up/down wrap, space to toggle, enter to confirm or auto-select cursor) and a fallback to numeric input when raw mode is unavailable.

  Preserve the six-provider catalog from LiteLLM (OpenAI, Anthropic with 11 models, Gemini, Azure with deployment capture, AWS Bedrock with extra keys, and Ollama with local base URL). Arrow keys wrap to the first/last provider, enter without a selection auto-selects the cursor item, and the numeric fallback sorts and deduplicates valid indices. Empty-but-present NO_COLOR environment variable disables styling; non-TTY also disables it. Raw mode must restore terminal attributes on cancellation. Preserve the LITELLM ASCII banner and layout constants. These helpers are called by B135's higher-level wizard flow, so keep them stateless and testable.

  Terminal initialization runs once at import time, checking platform and NO_COLOR; _supports_color() reads the result and checks stdout at call time. The _styled_input wrapper strips ANSI from the readline prompt in non-TTY, leaving the display clean. The _render_selector handles both first and subsequent renders by moving the cursor up and reprinting. The _select_interactive loop reads byte-by-byte via /dev/tty in raw mode and restores terminal state in a finally block.
