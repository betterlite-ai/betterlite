id: B4723
title: MCP user credential management routes
description: >-
  Build the seven per-user credential routes of the MCP management router in
  betterlite-server::mcp_user_credential_routes, plus the five wire types they use.
  All seven sit under the router prefix /v1/mcp (LiteLLM mounts this router with that prefix only, so there is no /mcp/... or /openai/v1/... alias) and every one needs a valid key.
  Errors are FastAPI HTTPException values whose detail is an object, so the body is {"detail": {"error": "..."}} and not the OpenAI error shape.

  Wire types, all JSON objects with these exact field names. MCPUserCredentialRequest has credential (string, required) and save (bool, default true).
  MCPUserCredentialResponse has server_id and has_credential.
  MCPOAuthUserCredentialRequest has access_token (required), refresh_token, expires_in (integer seconds) and scopes (list of strings), the last three optional and null by default.
  MCPOAuthUserCredentialStatus has server_id, has_credential, expires_at (ISO-8601 or null), is_expired (default false) and connected_at (ISO-8601 or null).
  MCPUserCredentialListItem has server_id, server_name, alias (both nullable), credential_type, has_credential, expires_at and connected_at.
  MCPServerUserCredentialListItem is B4713's secret-free row summary; reuse it and do not declare it again.

  Routes, in the order LiteLLM declares them.
  1. POST /v1/mcp/server/{server_id}/user-credential stores the caller's BYOK key.
  Order of checks: database present, server authorized, server is BYOK, caller has a user id.
  No database gives 500 with detail.error "Database not connected. Connect a database to your proxy".
  The server comes from B4717's authorize_and_fetch_mcp_server (admin: any server, 404 for unknown; non-admin: 403 outside the allowed set).
  A server whose is_byok is false (or missing) gives 400 "This MCP server does not support BYOK credentials".
  An empty user_id on the key gives 400 "User ID not found in token".
  With save true: call B4713's store_user_credential, then drop the cached BYOK credential for (user_id, server_id) through B5121's invalidate_byok_credential and publish that key to peer workers through B878, and answer has_credential true.
  With save false: write nothing, invalidate nothing, answer has_credential false.
  2. DELETE /v1/mcp/server/{server_id}/user-credential removes a BYOK key.
  Optional query user_id has min length 1 (an empty value is a 422 before the handler runs).
  The target user comes from B4717's resolve_credential_target_user_id: the caller by default, another user only for full PROXY_ADMIN (403 "Proxy admin access required to revoke another user's MCP credential." otherwise), 400 "User ID not found in token" when the caller has no id.
  Order here: database check first, then the target resolution, then the delete.
  A missing row is not an error. The route does not authorize the server and does not check the row type, so it deletes an OAuth row at the same key too.
  After the delete it invalidates the BYOK cache entry for the target user and answers has_credential false.
  3. POST /v1/mcp/server/{server_id}/oauth-user-credential stores an OAuth2 token the caller already holds.
  Order: database, server authorized, identity-binding gate, user id, store.
  The gate reads the server from the registry (not the database row); when it has an oauth_identity_binding whose mode is "enforce" the route answers 403 with detail {"error": "oauth_identity_binding_enforced", "error_description": "Direct credential storage is disabled for this server: its OAuth identity binding is enforced and this endpoint cannot validate the token's principal. Complete the OAuth flow through the gateway instead.", "server_id": <id>, "credential_stored": false} and writes nothing.
  Otherwise call store_user_oauth_credential with access_token, refresh_token, expires_in and scopes and leave skip_byok_guard false, so B4713's guard refuses to overwrite a readable BYOK row.
  Then call B4715's `betterlite_db::oauth_token_resolution::invalidate_user_token_cache(caches, user_id, server_id)` (LiteLLM's manager invalidate_user_oauth_token_cache; the route state holds the `UserTokenCaches` implementation), read the row back with get_user_oauth_credential and answer has_credential true, the stored expires_at (null when the read finds no expires_at) and is_expired false. connected_at is not set in this response.
  4. DELETE /v1/mcp/server/{server_id}/oauth-user-credential revokes an OAuth token.
  Same user_id query and target resolution as route 2.
  It reads the row with get_user_oauth_credential first and deletes only when that returns a payload, so a BYOK row at the same key survives. A missing row on delete is ignored.
  After a delete it calls the same `invalidate_user_token_cache` for the target user.
  The answer is always has_credential false and is_expired false, whether or not anything was deleted.
  5. GET /v1/mcp/server/{server_id}/oauth-user-credential/status answers for the caller only: 400 when the key has no user id, otherwise the status of get_user_oauth_credential.
  No row: has_credential false, is_expired false.
  A row: has_credential true, expires_at and connected_at from the payload, and is_expired true when expires_at parses as an ISO time earlier than now. B4713's is_oauth_credential_expired is not used here. An unparseable expires_at counts as not expired. A time with no zone counts as not expired, because LiteLLM compares it with a zone-aware now, Python raises and the route swallows the error.
  This route does not authorize the server.
  6. GET /v1/mcp/user-credentials lists the caller's OAuth connections (BYOK rows are not listed).
  Database check, then 400 on a missing user id, then list_user_oauth_credentials; an empty list answers [].
  It loads server rows for all credential server ids with one get_mcp_servers call and builds the allowed set: None for an admin view (user_api_key_has_admin_view), else the union of get_allowed_mcp_servers over every context build_effective_auth_contexts returns.
  Each item is looked up with resolve_mcp_server (database rows from the batch first, then the registry); a server that does not resolve, or resolves outside the allowed set, still gets an item but with server_name and alias null.
  Items carry credential_type "oauth2", has_credential true, the raw expires_at and connected_at.
  A credential row with no server_id is skipped.
  7. GET /v1/mcp/server/{server_id}/user-credentials is the admin view of every user's credential for one server.
  Only PROXY_ADMIN and PROXY_ADMIN_VIEW_ONLY pass; everyone else gets 403 "Admin access required to view MCP server user credentials." before the database check.
  Then it returns B4713's list_server_user_credentials(server_id) as is, with no secrets.
  An unknown server id gives an empty list, not 404.

  Every handler runs inside B865's management_endpoint_wrapper. Unhandled errors (for example the ValueError from the BYOK-overwrite guard in route 3) pass through it unchanged.

