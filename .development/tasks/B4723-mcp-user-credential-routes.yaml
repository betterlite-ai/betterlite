dod:
  - text: >-
      Route 1 stores the caller's BYOK key only for a BYOK server with a user id and save true, invalidates the BYOK cache after the write, and answers has_credential false without writing when save is false.
      The 400 texts "This MCP server does not support BYOK credentials" and "User ID not found in token" and the 500 no-database text are exact.
    proof: [route-tests, oracle]
  - text: >-
      Routes 2 and 4 default to the caller, take another user only for PROXY_ADMIN (PROXY_ADMIN_VIEW_ONLY and regular users get 403), reject an empty user_id query with 422,
      ignore a missing row, and always answer has_credential false.
      Route 4 leaves a BYOK row in place and route 2 deletes whatever row is there.
    proof: [route-tests, oracle]
  - text: >-
      Route 3 refuses a server with an enforced identity binding with the exact 403 detail and credential_stored false,
      keeps B4713's BYOK-overwrite guard on, invalidates the manager's token cache and answers with the stored expires_at, is_expired false and no connected_at.
    proof: [route-tests, oracle]
  - text: >-
      Route 5 answers only for the caller, reports is_expired from an inline comparison with the current time, treats an unparseable expires_at as not expired, and does not authorize the server.
    proof: [route-tests, oracle]
  - text: >-
      Route 6 returns [] without a server lookup when the caller has no OAuth rows, uses one batch server read, nulls server_name and alias for servers the caller may not see or that do not resolve,
      and skips rows without a server_id.
    proof: [route-tests, oracle]
  - text: >-
      Route 7 returns 403 for anyone except PROXY_ADMIN and PROXY_ADMIN_VIEW_ONLY before the database check, and returns the secret-free rows of B4713 unchanged.
    proof: [route-tests, oracle]
  - text: >-
      The seven routes are registered under /v1/mcp with the methods and paths in the description, the five wire types serialize with LiteLLM's field names and defaults,
      and no response body ever contains a credential, access token or refresh token.
    proof: [route-tests, oracle]

