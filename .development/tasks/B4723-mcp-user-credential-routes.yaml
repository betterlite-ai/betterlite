out_of_scope:
  - "get_prisma_client_or_throw and the server and batch server reads (get_mcp_server, get_mcp_servers): owned by B4711."
  - "store_user_credential, delete_user_credential, store_user_oauth_credential, get_user_oauth_credential, list_user_oauth_credentials, list_server_user_credentials, MCPServerUserCredentialListItem and the expiry helpers: owned by B4713."
  - "_user_is_full_admin, _resolve_credential_target_user_id and _authorize_and_fetch_mcp_server: owned by B4717. _user_has_admin_view (user_api_key_has_admin_view) is owned by B2314."
  - "resolve_mcp_server: owned by B4731. build_effective_auth_contexts: owned by B4672. get_allowed_mcp_servers: owned by B6591."
  - "management_endpoint_wrapper: owned by B865. The BYOK cache entry removal (invalidate_byok_credential): owned by B5121. Publishing the key to peer workers: owned by B878."
  - "invalidate_user_token_cache and the UserTokenCaches trait: owned by B4715; this task only calls them."
  - "The other routes in mcp_management_endpoints.py: B4719 to B4725, B4729 and the temporary OAuth session routes own them."
  - "Per-user env var routes and their authorization helper reuse: B4724."

pitfalls:
  - Route 2 and route 4 look alike but differ in what they delete, so keep them apart. Route 2 deletes the row whatever it holds, route 4 reads it first and deletes only an OAuth payload.
  - Route 2 checks the database, then the target user, and never calls the server authorization, so a user can delete a credential for a server they no longer have access to.
  - The 403 for another user's credential is raised in the target resolution, after the database check. Without a database the answer is 500 even for that case.
  - Route 7 checks the role first and the database second, the opposite order from the other six.
  - Route 3 reads the identity binding from the registry server (get_mcp_server_by_id on the manager), not from the database row, and a config-only server has no row at all.
  - Route 3's response has no connected_at and is_expired is hard false, while route 5 returns connected_at for the same row.
  - The status route uses fromisoformat on the stored string; the stored value is "...+00:00", so compare in UTC and do not use B4713's buffer-based helper, which would add a grace period.
  - Route 6 does not drop rows for servers the caller cannot see; it only blanks server_name and alias, so a hidden server id is still visible to its own connector.
  - The detail of every error is an object under "detail", and the 422 for the empty user_id query comes from request validation in FastAPI's own shape (a list under "detail"), not from the handler.
  - The routes must never log or echo credential, access_token or refresh_token; the response models carry no secret field at all.

review_level: security

