out_of_scope:
- assistants/utils.py get_optional_params_image_gen at 69-141 has no caller at the pin; images/main.py and main.py import the distinct litellm.utils version, so remove its cases.
- B1055/B1130 own assistant definitions, B1056 threads, B089's split run SDK. B1086 owns message HTTP routes.
- B697 owns Azure mapping details/drop_params loader tests, B2487 resource settings and finite-timeout deviation, B520 provider response records.
pitfalls:
- 'The oracle helper for this task is pre-registered as assistant_message_options in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/assistant_message_options.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/assistant_message_options.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Azure accepts attachments in its supported-key list but discards even valid file ids after validation.
- drop_params=true does not make non-string Azure content valid.
- Message SDKs retain Azure clients and do not apply the OpenAI-instance discard rule used by thread wrappers.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
