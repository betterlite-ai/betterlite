  - tools/oracle/helpers/assistant_message_options/**
  - tools/oracle/cases/sdk-http/assistant-messages/**
  - tools/oracle/cases/helpers/assistant-message-options/**
  - tools/oracle/fuzz/corpus/sdk_http_case/assistant-messages-*
  - tools/oracle/fuzz/corpus/helper_case/assistant-message-options-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L841-L1161
  why: Whole message wrappers compose the selector, omit list pagination and preserve provider-specific credentials.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/utils.py#L10-L66
  why: Non-null option selection, unknown-provider behavior and trailing kwargs pass-through are pure policy.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/azure.py#L71-L112
  why: B697's called mapper accepts four keys, rejects non-string content and validates then discards attachment ids.
dod:
- text: >-
    message_option_omissions compares pure selector with role/content/attachments/metadata all null -> {};
    openai preserves non-null role=user,content="",attachments=[],metadata={}. Extra kwargs trace=x is
    appended after filtering for every provider, including unknown. Unknown provider returns only extra
    kwargs, dropping the four standard values. SDK constructs MessageData as a TypedDict, so role=system
    is not locally rejected; source type annotations do not become a new runtime validator.
  proof: [message-tests, oracle, helper-python]
- text: >-
    append_openai_message sends thread_a,role=user,content=hello,attachments=[{file_id:file_a,tools:[{type:file_search}]}],
    metadata={tag:x}. Both modes POST /v1/threads/thread_a/messages with these fields and assistants=v2;
    mock {id:msg_a,object:thread.message,thread_id:thread_a,role:user,content:[],created_at:1} returns through
    B520. Null optional values are omitted, empty lists/maps remain. Content blocks are passed unchanged
    for OpenAI; neither wrapper retrieves or uploads their files.
  proof: [message-tests, oracle, sdk-python]
- text: >-
    azure_attachment_drop_and_content supplies attachments=[{file_id:file_a}] and expects upstream
    role/content/metadata only: B697 collects file ids but never puts them into optional_params. With
    attachments=[{tools:[]}] and drop_params=false get UnsupportedParamsError,400,type/param/code=null,
    source message="Azure doesn't support [{'tools': []}]. To drop it from the call, set `litellm.drop_params = True.".
    With drop_params=true the invalid attachment is silently dropped without a warning. attachments={} still
    raises 400 with "Invalid param. attachments should always be a list. Got=<class 'dict'>, Expected=List. Raw value={}";
    content=[{type:text,text:hello}] raises 400 "Azure only accepts content as a string." even with drop_params=true.
    The generic unsupported-key validator is unreachable for pinned Azure's four supported keys; do not invent
    an unsupported fifth standard parameter to reach its nominal status_code=500 branch.
  proof: [message-tests, oracle, sdk-python, helper-python]
- text: >-
    message_list_ignores_pagination gives after=msg_a,before=msg_z,limit=2,order=asc in kwargs to both
    modes. Provider GET /v1/threads/thread_a/messages has no pagination query, not defaults limit=20/order=desc
    synthesized here. Mock {object:list,data:[],has_more:false} returns unchanged. Flags 1/"true" are
    accepted at wrapper boundary but do not activate provider async dispatch; null/false also stay sync.
    Native null provider returns stay null and request context survives async preparation.
  proof: [message-tests, oracle, sdk-python]
- text: >-
    message_settings_and_failures proves request/global/env resolution through B2487 using distinct
    OpenAI Authorization/Organization and Azure api-key/api-version; timeout defaults 600, 0 falls through
    request_timeout, strings float-convert and structured timeout survives. Both message methods retain
    supplied clients on Azure, unlike thread create/get. Omitted extra_body or {} suppresses AZURE_AD_TOKEN;
    null reads env-token; body-token is popped from its map. Unsupported anthropic yields BadRequestError,400,
    type/param/code=null; append source operation name is create_thread, list is get_messages, each with
    "Only 'openai' is supported.". A provider 404 preserves body fields synchronously and becomes B011
    NotFoundError,404,type/param/code=null asynchronously with model="",completion_kwargs={}. Add separate
    helper and SDK seeds so both adapter kinds must parse and execute.
  proof: [message-tests, oracle, sdk-python, operation-corpora]
checks:
  optional: []
  commands:
  - id: message-tests
    why: message SDK behavior or option selection is missing despite corpus replay
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_messages::tests::/) - test(/::replays_corpus$/)'
  - id: sdk-python
    why: message calls are not independently executed through actual provider HTTP
    run: test -f tools/oracle/sdk_http/assistant_messages.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: helper-python
    why: the pure option-selector cases have no independent source comparison
    run: test -f tools/oracle/helpers/assistant_message_options.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: operation-corpora
    why: message SDK and pure-selector input tags lack committed parser seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/assistant-messages-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/assistant-message-options-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_helper_case_corpus)'
