id: B1057
title: Assistant messages
description: >-
  Implement thread message create/list, optional message/image parameters and attachment mappings using existing
  OpenAI records. Preserve role/content/list cursors and source provider parameter support; URLs are passed to URL-capable
  providers without proxy fetching.


  Implement crates/betterlite-core/src/api/assistant_messages.rs. Use AssistantMessagesInput and AssistantMessagesResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions thread_message_create, message_file_attachments, message_list_pagination,
  image_detail_parameter, unsupported_message_param under api::assistant_messages::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.api_base
  defaults to None; env.OPENAI_BASE_URL defaults to unset (None); env.OPENAI_API_BASE defaults to unset (None);
  litellm_settings.organization defaults to None; env.OPENAI_ORGANIZATION defaults to None; litellm_settings.api_key
  defaults to None; litellm_settings.openai_key defaults to None; env.OPENAI_API_KEY defaults to unset (None); env.AZURE_API_BASE
  defaults to unset (None); litellm_settings.api_version defaults to None; env.AZURE_API_VERSION defaults to unset
  (None); litellm_settings.azure_key defaults to None; env.AZURE_OPENAI_API_KEY defaults to unset (None); env.AZURE_API_KEY
  defaults to unset (None); env.AZURE_AD_TOKEN defaults to unset (None); litellm_settings.drop_params defaults to
  false; LITELLM_DROP_PARAMS uses the source flag parser; invalid nonempty env values warn and enable; env.LITELLM_DROP_PARAMS
  defaults to false; empty is false, recognized boolean strings use normalize_drop_params; invalid nonempty values
  warn and enable. No environment reads occur outside betterlite-config. Test api::assistant_messages::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::AssistantMessages in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {assistant_messages: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/assistants/main.py: a_add_message (L841-L889); litellm/assistants/main.py: add_message
  (L892-L1011); litellm/assistants/main.py: aget_messages (L1014-L1054); litellm/assistants/main.py: get_messages
  (L1057-L1161); litellm/assistants/utils.py: get_optional_params_add_message (L10-L66); litellm/assistants/utils.py:
  get_optional_params_image_gen (L69-L141). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 394 owned nonblank/non-comment/non-docstring Python lines (398 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 414 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 81 config tests/seeds and
  30 wiring; 745 total within the 750-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B183 (Bounded inline media conversion), B1019 (File routing ids), B1087 (Api boundaries),
  B520 (OpenAI thread and message operations), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
