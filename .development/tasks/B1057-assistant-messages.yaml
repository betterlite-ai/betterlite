id: B1057
title: Assistant message SDK calls and option selection
description: >-
  Own complete a_add_message/add_message/aget_messages/get_messages at main.py:841-1161 and
  get_optional_params_add_message including its nested validator at utils.py:10-66. Implement in
  core::api::assistant_messages using B520 OpenAI messages, B697 Azure messages/legacy mapper, B176
  controls, B010 GenericLiteLLMParams, B174 provider resolution, B011 async errors and B2487 settings. B697 owns Config loading of
  litellm_settings.drop_params, default false; pass its resolved flag into the option selector.
  B2401 AssistantMessages drives provider calls. B171 AssistantMessageOptions compares only the pure
  selector and its returned map/errors, never a provider call or FastAPI route.

  Append requires provider/thread_id/role/content, with attachments,metadata,client null. List requires
  provider/thread_id with client null. Both async flags default null and are popped without validation.
  Provider-only requests use the B2487 600-second timeout/credential view. The unused image helper in
  assistants/utils.py is excluded after checking imports: live image calls use litellm.utils instead.
  327 nonblank/non-comment owned lines allow 245 implementation, 180 tests, 125 adapters, 150 fixtures and
  55 corpus/wiring, 755 total. No new byte decoder; B520/B697 own response parsing.
