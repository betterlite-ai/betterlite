  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/assistant_messages.rs
  - crates/betterlite-core/src/api/assistant_messages/**
  - tools/oracle/src/sdk_http.rs
