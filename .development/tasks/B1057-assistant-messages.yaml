checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::assistant_messages::/)
      - test(/::replays_corpus$/)'
  - id: case-thread-message-create
    why: the thread-message-create behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_messages::tests::thread_message_create($|::)/)'
  - id: case-message-file-attachments
    why: the message-file-attachments behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_messages::tests::message_file_attachments($|::)/)'
  - id: case-message-list-pagination
    why: the message-list-pagination behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_messages::tests::message_list_pagination($|::)/)'
  - id: case-image-detail-parameter
    why: the image-detail-parameter behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_messages::tests::image_detail_parameter($|::)/)'
  - id: case-unsupported-message-param
    why: the unsupported-message-param behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_messages::tests::unsupported_message_param($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::assistant_messages::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/assistant-messages-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/assistant_messages.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/assistant_messages-*)"
      && grep -qE "^[[:space:]]+assistant_messages:" tools/oracle/fuzz/corpus/helper_case/assistant_messages-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/assistant-messages)"
