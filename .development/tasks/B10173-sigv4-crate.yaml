id: B10173
title: SigV4 signing and AWS credentials live in a new betterlite-sigv4 crate, and Polly signs through it
description: >-
  Core's Polly speech signs with its own SigV4 code. `sign_post` in crates/betterlite-core/src/api/polly/speech/signing.rs L28-L68 builds the identity, the signing parameters and the signable request itself and recases the three headers botocore returns (`litellm_casing`, L71-L78). That is a restricted copy of betterlite-bedrock's `sign_request` (crates/betterlite-bedrock/src/signing/sigv4.rs L22-L98): a POST whose only header is Content-Type goes through the same steps, since Content-Type is not in `unsigned` and no X-Amz-Content-SHA256 header is set. Polly also keeps its own credential type, `ResolvedCredentials` (polly/speech/credentials.rs L23-L28), with the same three fields as betterlite-bedrock's `Credentials` (aws_settings/sources.rs L30-L35). Core cannot call betterlite-bedrock, because betterlite-bedrock depends on betterlite-core, so the shared code moves down into a new crate both reach. The decision and the options it rejects are in .development/decisions/2026-11-27-aws-credential-chain.md.


  The crate. crates/betterlite-sigv4 depends on no betterlite crate: only aws-sigv4, aws-credential-types =1.3.1, aws-smithy-runtime-api =1.19.2 with the client feature, secrecy and thiserror, at the versions betterlite-bedrock's Cargo.toml uses. Its Cargo.toml has name betterlite-sigv4, `version.workspace = true`, `edition.workspace = true`, `license.workspace = true`, `publish.workspace = true` and `[lints] workspace = true`, like crates/betterlite-test-ports/Cargo.toml; the workspace members glob `crates/*` picks it up, so the root Cargo.toml stays as it is. src/lib.rs declares three public modules. `credentials` holds `Credentials`, moved as it is (Debug, Clone, the three pub fields). `error` holds `SigV4Error` with the two variants that betterlite-bedrock's `SigningError` has for this step today, `Parameters(#[source] BuildError)` with the text "the signing parameters are invalid" and `Signable(#[source] SigningError)` with "the request cannot be signed". `sign` holds `Signable` and `sign_request`, with `unsigned`, `identity`, `payload` and `botocore_name`, moved from signing/sigv4.rs and returning `Result<Vec<(String, String)>, SigV4Error>`. The identity's provider name becomes "betterlite"; AWS never sees it. `Signable` gains one field, `mode: SigningMode`, and `sign` holds that public enum, Debug, Clone and Copy, with two variants named after botocore's two header signers. `SigV4Auth` signs with `SigningSettings::default()`, as sign_request does today. `S3SigV4Auth` signs the path as sent, the way botocore's S3SigV4Auth does: the default settings with `uri_path_normalization_mode` Disabled and `percent_encoding_mode` Single, the two values betterlite-logging's S3 signer sets (crates/betterlite-logging/src/s3_transport/signing.rs L93-L94). sign_request builds its settings in an exhaustive match on the mode. Every Signable in this task says `SigningMode::SigV4Auth`; B10190 moves the S3 signers onto `S3SigV4Auth`.


  betterlite-bedrock. signing/sigv4.rs and its `mod sigv4;` line go. aws_settings/sources.rs replaces the struct with `pub use betterlite_sigv4::credentials::Credentials;`, so the 164 files that import `aws_settings::sources::Credentials` stay as they are. signing/error.rs drops `Parameters` and `Signable` and gains `#[error(transparent)] SigV4(#[from] SigV4Error)`, so every `?` inside betterlite-bedrock keeps working and no error text changes. The ten importers of `signing::sigv4` switch to `betterlite_sigv4::sign`: batch_call/request.rs L12, bedrock_embedding_io/signed_get.rs L7, sagemaker_runtime/tests/integration.rs L57, signing/batch.rs L4, signing/endpoint.rs L8, signing/json_post.rs L4 and signing/service.rs L6 in betterlite-bedrock, betterlite-rag's bedrock_ingestion/client.rs L6, betterlite-transcribe's live/signing.rs L8 and betterlite-vertex's aws_federation.rs L8, and each Signable they build sets `mode: SigningMode::SigV4Auth`. Outside betterlite-bedrock each caller keeps its own error variant, all of which wrap betterlite-bedrock's `SigningError`, and converts with `SigningError::from`: transcribe's `ProbeError::Signing` (live/signing.rs L72; L104 wraps `sign_aws_json_post` and stays), vertex's `FederationError::Signing` (aws_federation.rs L218) and rag's `?` at client.rs L139. betterlite-rag, betterlite-transcribe and betterlite-vertex add betterlite-sigv4 to their dependencies.


  Polly. `ResolvedCredentials` goes, and polly/speech uses `betterlite_sigv4::credentials::Credentials`. `sign_post` keeps its signature and its one-line comment and calls `sign_request` with method POST, the URL, the one header `Content-Type: application/json`, the body, service `polly`, the region, the credentials, `now` and mode `SigV4Auth`; it answers an IndexMap with Content-Type first and then the returned headers in their order, which is the order it answers today. `litellm_casing`, PROVIDER_NAME and the Identity and SigningParams code go. SpeechError's `SigningParameters`, `Signable` and `Sign` variants become one `Signing(#[source] SigV4Error)` with the text "the AWS Polly request cannot be signed"; nothing outside polly/speech matches them. The resolver seam becomes async in the same step, so B10175's credential chain can sit behind it: `#[async_trait] pub trait CredentialResolver: Send + Sync { async fn resolve(&self, sources: &CredentialSources<'_>) -> Result<Credentials, SpeechError>; }`, and `transform_request` (request.rs L77-L86) becomes `pub async fn` and awaits it. Its comment at credentials.rs L30 keeps saying betterlite-bedrock owns the resolver. The tests' FixedResolver and ExpectingResolver (polly/speech/tests.rs L85-L112) and the oracle helper's FixedResolver (tools/oracle/src/helpers/core_ops/polly_speech.rs L286-L290) implement the async trait and answer `Credentials`; the oracle helper awaits `transform_request` on a current-thread tokio runtime, as tools/oracle/src/helpers/core_ops/b10014.rs L96 does. betterlite-core drops aws-credential-types, aws-sigv4 and aws-smithy-runtime-api (Cargo.toml L10-L12; only polly/speech/error.rs and signing.rs use them) and adds betterlite-sigv4.


  Tests. No new test: the signing cases in betterlite-bedrock's signing/tests/signing_cases.rs and the Polly tests and helper cases check the moved code against botocore's answers byte for byte, and they must pass unchanged. A unit test that only restates `sign_request` in the new crate would add nothing.


  What users see: nothing. Every signed header, body and error text stays the same.
