  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L1657-L1730
    why: _sign_request, the SigV4 step betterlite-bedrock's sign_request ports and Polly now shares.
dod:
  - text: crates/betterlite-sigv4 holds Credentials, SigV4Error, Signable with its two-variant SigningMode and sign_request, depends on no betterlite crate and inherits the workspace package fields and lints.
    proof: [crate-shape]
  - text: betterlite-bedrock re-exports Credentials at aws_settings::sources and has no signing/sigv4.rs; every signer imports betterlite_sigv4::sign, and the signing cases still match botocore.
    proof: [crate-shape, bedrock-signing-tests, signer-tests]
  - text: Polly signs through betterlite_sigv4, has no ResolvedCredentials, Identity or casing code, takes an async resolver, and its tests and helper cases still pass.
    proof: [no-polly-copy, polly-speech-tests, polly-speech-cases]
checks:
  optional: []
  commands:
    - id: crate-shape
      why: the crate or its S3SigV4Auth mode is missing, it depends on a betterlite crate, skips the workspace fields, or betterlite-bedrock still has its own sigv4 module or Credentials struct
      run: test -f crates/betterlite-sigv4/Cargo.toml && grep -q S3SigV4Auth crates/betterlite-sigv4/src/sign.rs && grep -q '^workspace = true' crates/betterlite-sigv4/Cargo.toml && grep -q 'license.workspace = true' crates/betterlite-sigv4/Cargo.toml && test -z "$(grep -n 'betterlite-' crates/betterlite-sigv4/Cargo.toml | grep -v 'name = .betterlite-sigv4.')" && test ! -e crates/betterlite-bedrock/src/signing/sigv4.rs && test -z "$(grep -rn 'signing::sigv4\|pub struct Credentials' crates/betterlite-bedrock/src crates/betterlite-rag/src crates/betterlite-transcribe/src crates/betterlite-vertex/src)"
    - id: no-polly-copy
      why: core still carries its own SigV4 steps, credential type or AWS signing dependencies
      run: test -z "$(grep -rnE 'ResolvedCredentials|fn litellm_casing|SigningParams|Identity::new|aws_sigv4|aws_credential_types|aws_smithy_runtime_api' crates/betterlite-core/src/api/polly tools/oracle/src/helpers/core_ops/polly_speech.rs)" && test -z "$(grep -nE '^aws-(sigv4|credential-types|smithy-runtime-api) ' crates/betterlite-core/Cargo.toml)"
    - id: polly-speech-tests
      why: Polly mapping or exact-body signing changed after the move onto the shared signer
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::polly::speech::/)'
    - id: polly-speech-cases
      why: the Polly helper cases no longer match LiteLLM's signed headers and body
      run: cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-core-ops -- tools/oracle/cases/helpers/polly-speech
    - id: bedrock-signing-tests
      why: the moved signer or the new SigningError variant changed a signed header, a body or an error text
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E '(test(/^signing::/) | test(/^batch_call::/) | test(/^bedrock_embedding_io::/) | test(/^sagemaker_runtime::/)) - test(/replays_the_/)'
    - id: signer-tests
      why: a signer outside betterlite-bedrock lost its error mapping or its signed headers changed
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::/)' && cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^live::/)' && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^aws_federation::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The other SigV4 signers, each a copy of the same steps with its own inputs: betterlite-secret-managers aws/request_signing/sigv4.rs L17-L40, betterlite-logging s3_transport/signing.rs L77-L100, sqs_logging/signing.rs L54-L79 and legacy_dynamodb/signing.rs L34-L53, betterlite-http mcp_sigv4/signing.rs L88-L130, betterlite-openai providers/strands_decider/signing.rs L105-L155, and the two query presigners in betterlite-config sections/redis_credentials/aws.rs L89-L117 and betterlite-db rds_credentials/signer.rs L49-L60. betterlite-sigv4 is the home they can all reach: B10191 moves the five header signers and B10190 the S3 signer and both presigners."
  - "Merging the credential traits and the production credential chain: B10174 and B10175."
  - "Wiring Polly to the speech dispatch: B047."
pitfalls:
  - "aws_settings::sources::Credentials must stay importable at that path: B645 and B648 are running on code that names it, and 164 files do on main."
  - "SigningError's Display texts are what callers see: SigV4Error keeps \"the signing parameters are invalid\" and \"the request cannot be signed\", and SigningError::SigV4 is transparent."
  - "Polly's IndexMap order is Content-Type, then Authorization, X-Amz-Date and X-Amz-Security-Token as sign_request returns them; the helper cases compare the headers, so keep the order and the casing."
  - "sign_request's `unsigned` filter and `payload` change nothing for Polly: Content-Type is signed and Polly never sends X-Amz-Content-SHA256. Don't add a Polly-only path to the shared function."
  - "S3SigV4Auth has no caller until B10190; build it anyway, with its two settings inside its match arm, so `SigV4Auth` stays exactly `SigningSettings::default()`."
  - "transform_request takes `&dyn CredentialResolver`, so the trait stays dyn-compatible: use async_trait (already a core dependency), not an `impl Future` return."
  - "The new crate has no test of its own, so its checks run through betterlite-bedrock and betterlite-core; don't add a `-p betterlite-sigv4 --no-tests=fail` run."
review_level: standard
budget:
  max_changed_lines: 900
  max_new_expects: 0
