deviations:
  - what: Token cache uses SHA256 hashing of the assertion instead of the assertion as a direct key.
    why: LiteLLM uses hashlib.sha256 to keep assertion byte sequences out of structured memory, and the bounded cache provides cryptographic-grade distinction.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L436-L438
  - what: Conversation ID resolution uses exact case-insensitive header matching for mcp-session-id instead of a regex-based search.
    why: HTTP headers are always case-insensitive per RFC 7230; exact string comparison with case normalization is simpler and avoids regex overhead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L424-L430
out_of_scope:
  - "CustomGuardrail base class construction and initialization (__init__) is owned by B3664, B3665, and B3666."
  - "should_run_guardrail checking, add_standard_logging_guardrail_information_to_request_data, and log_guardrail_information decorator are unresolved B104 dependencies."
  - "async_pre_call_hook, verdict enforcement, error handling (_handle_caller_fault, _handle_unavailable, _handle_throttled, _enforce_verdict) and verdict recording are B3742's responsibility."
pitfalls:
  - 'The oracle helpers for this task are pre-registered as agent_365_token_exchange and agent_365_payload_assembly in the guardrails group. Replace the stub Ops in tools/oracle/src/helpers/guardrails/b3741.rs and agent_365_payload_assembly.rs with impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/b3741.py and agent_365_payload_assembly.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - OBO token cache insertion happens first, then eviction occurs; when the cache reaches 1,001 entries, the oldest is evicted after inserting the new one, maintaining at most 1,000.
  - The mcp-session-id header search must be case-insensitive (e.g., "MCP-Session-ID" == "mcp-session-id") to handle client-provided headers correctly.
  - Token parsing must distinguish missing/non-string access_token fields; a missing field is a decode error, a non-string is a validation error, and either raises Agent365MalformedResponseError.
  - AADSTS code parsing uses TypeAdapter validation to ensure a tuple of ints; a non-tuple or non-integer list silently returns empty tuple, preserving fallback behavior.
