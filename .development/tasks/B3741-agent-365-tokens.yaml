id: B3741
title: Agent 365 delegated tokens and evaluation payloads
description: >-
  Build Agent 365 construction with Entra On-Behalf-Of token acquisition and caching,
  typed token-exchange errors, and evaluation payload assembly with session identity.
  Hash the assertion with SHA256 for the bounded 1,000-entry LRU cache with 60-second
  expiry margin; retain the production endpoint, resource app ID and scope name as
  constants. Use the authenticated key_alias as agent identity in the evaluation payload,
  and resolve conversation ID from MCP session metadata, headers, or fall back to per-call
  litellm_call_id or generated UUID. Distinguish missing/non-string access tokens from
  gateway-owned Entra credential errors (identified by error code in _GATEWAY_OWNED_TOKEN_ERRORS)
  and assertion-validation errors (AADSTS 50027 prefix) within the same rejection. Token
  parsing returns _DEFAULT_TOKEN_TTL_SECONDS when expires_in is malformed or absent.

  Implement Agent365TokenExchangeError.__init__ with status_code, error_code, description
  and aadsts_codes, and its gateway_owned property to return true when error_code is in
  the gateway-owned set and no AADSTS code starts with ASSERTION_ERROR_AADSTS_PREFIX.
  Implement Agent365MalformedResponseError as a simple exception. Implement Agent365ThrottledError.__init__
  with status_code. Implement Agent365Guardrail with records_own_guardrail_information=True,
  storing tenant_id, client_id, client_secret, request_timeout (default 10.0),
  unreachable_fallback (default fail_closed), and an OrderedDict-backed _obo_token_cache
  guarded by _obo_cache_lock. The class declaration and __init__ method wire the async_handler
  (defaulting to get_async_httpx_client with GuardrailCallback provider), initialize the
  logger, and delegate to CustomGuardrail with get_supported_event_hooks returning pre_mcp_call.

  Implement get_config_model returning Agent365GuardrailConfigModel. Implement _parse_expires_in
  to return float(raw) when raw is numeric or numeric string, otherwise _DEFAULT_TOKEN_TTL_SECONDS.
  Implement _parse_aadsts_codes to validate raw with TypeAdapter(tuple[int, ...]), returning
  an empty tuple on validation error. Implement entra_assertion to return the bearer value
  when it is a non-empty string with exactly two dots (compact JWS format), otherwise None.
  Use a constant name for the AADSTS prefix that is 30 characters or fewer (e.g., ASSERTION_ERROR_AADSTS_PREFIX
  at 29 characters, or AADSTS_ASSERTION_ERROR_PREFIX).

  Implement _resolve_conversation_id as a static method that tries the litellm_logging_obj's
  mcp_tool_call_metadata.mcp_session_id first, then searches metadata/litellm_metadata
  headers for the mcp-session-id header (case-insensitive), then uses litellm_call_id, and
  finally generates a UUID. Implement _build_evaluate_payload to assemble the JSON body
  with tool.name, serverName, conversationId, optional agentId from key_alias, and optional
  arguments when it is a dict. Implement _get_obo_token to hash the assertion with SHA256,
  check cache with expiry margin, POST to the token endpoint with OBO parameters, raise
  Agent365ThrottledError for 408/429, raise httpx.HTTPStatusError for 5xx, parse the
  response JSON, raise Agent365TokenExchangeError for 4xx with error/error_description/error_codes,
  validate that access_token is a non-empty string, cache with LRU eviction at 1,000 entries,
  and return the token. Implement _post_allowing_error_status to call async_handler.post with
  the given URL, data, json, headers and timeout, catching httpx.HTTPStatusError and
  returning its response without re-raising. Implement _evict_obo_token as a lock-protected
  cache removal by SHA256-hashed assertion key.

  Implement Agent365GuardrailConfigModel with tenant_id, client_id, client_secret fields
  (all optional, falling back to environment variables), unreachable_fallback (Literal
  fail_closed|fail_open, default fail_closed), and ui_friendly_name() returning "Microsoft Agent 365".
  Write the behavior rstest functions agent_365_token_behaviors in adjacent tests.rs files,
  with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. The helper operations agent_365_token_exchange, agent_365_payload_assembly
  are already registered; each operation has its own Rust and Python adapter file and corpus seed.
  Budget 200 token/cache logic, 100 error types, 100 payload assembly, 120 configuration/wiring
  and 280 tests/helpers (800 total).
