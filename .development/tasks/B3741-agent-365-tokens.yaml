dod:
  - text: OBO token cache uses SHA256 hashing, respects 1,000-entry LRU eviction, and checks expiry with 60-second margin before returning cached tokens.
    proof: [agent-365-token-behaviors, oracle]
  - text: Token parsing returns default TTL on malformed/missing expires_in; access_token validation rejects non-string or empty values; AADSTS code parsing tolerates invalid input.
    proof: [agent-365-token-behaviors, agent-365-token-python, oracle]
  - text: gateway_owned distinguishes assertion errors (AADSTS 50027) from client-credential errors even within the same error_code rejection.
    proof: [agent-365-token-behaviors, oracle]
  - text: Conversation ID resolution tries mcp_session_id from logging, mcp-session-id header (case-insensitive), litellm_call_id, and generates UUID as final fallback.
    proof: [agent-365-token-behaviors, oracle]
  - text: Evaluation payload includes tool.name, serverName, conversationId, optional agentId from key_alias, and optional arguments when present as dict.
    proof: [agent-365-token-behaviors, oracle]
  - text: Entra assertion validation accepts only compact JWS (three dot-separated parts); virtual keys, session bearers and opaque tokens yield None.
    proof: [agent-365-token-behaviors, agent-365-token-python, oracle]
  - text: "_post_allowing_error_status catches httpx.HTTPStatusError and returns the response without re-raising, preserving error status for caller inspection."
    proof: [agent-365-token-behaviors, oracle]
  - text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
    proof: [agent-365-token-corpus]
checks:
  optional: []
  commands:
    - id: agent-365-token-behaviors
      why: Token exchange, caching, or payload assembly tests are missing, skipped or fail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/::agent_365_token_behaviors(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: agent-365-token-python
      why: The oracle adapters fail strict Python checks
      run: test -f tools/oracle/helpers/b3741.py && test -f tools/oracle/helpers/b3741.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: agent-365-token-corpus
      why: The helper fuzz target or nonempty committed corpus is missing, or corpus replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" && grep -rlq 'agent_365_token_exchange\|agent_365_payload_assembly' tools/oracle/fuzz/corpus/helper_case/agent-365-tokens-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case/agent-365-tokens-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
