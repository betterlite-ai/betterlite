dod:
  - text: >-
      The provider is the custom-llm-provider header when it is not empty, else the custom_llm_provider query value when it is not empty, else "openai", in both functions. An empty header falls through to the query.
    proof: [provider-tests]
  - text: >-
      The ownership check runs first with the path container_id and the picked provider, its original id and resolved provider replace the path values for the rest of the call, and a denial returns before the common processing is called, in both functions.
    proof: [access-tests]
  - text: >-
      The content request builds the data map with file_id first, then the original container_id, the resolved custom_llm_provider and model_id only when forwarding gave one, and calls the processing with route type aretrieve_container_file_content and no model.
    proof: [binary-tests]
  - text: >-
      The content request returns the bytes, the guessed content type and the headers the processing set. A result that is not bytes fails with the "expected bytes, got" text through the exception handling.
    proof: [binary-tests]
  - text: >-
      content_type_for_file_id follows the fixed first-match order: png (also by suffix), jpg or jpeg, gif, csv, json, txt, pdf, else application/octet-stream, on the lowercased id.
    proof: [content-type-tests]
  - text: >-
      The upload request fails with 400 and detail "Missing required 'file' field" when the form has no file key, and does so before any ownership check or processing.
    proof: [upload-tests]
  - text: >-
      The upload request replaces a non-empty file list with its first element, keeps every other form field, lets the forwarding values overwrite form fields named container_id, custom_llm_provider and model_id, passes the given route type with no model, and returns the processing result unchanged.
    proof: [upload-tests]
  - text: >-
      Failures inside the guarded section go through handle_exception once. Ownership, forwarding, form and missing-file failures are returned as they are and never reach handle_exception.
    proof: [error-tests]

