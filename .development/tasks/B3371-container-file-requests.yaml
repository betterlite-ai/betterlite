id: B3371
title: Container file content and upload request processing
description: >-
  Build the two request processors of litellm/proxy/container_endpoints/handler_factory.py that the container file routes share:
  _process_binary_request (the file content download) and _process_multipart_upload_request (the file upload). Put them in
  betterlite-server as module api::container_file_requests (crates/betterlite-server/src/api/container_file_requests.rs, tests in
  container_file_requests/tests.rs). The module registers no route and builds no axum handler. B3372 owns route registration, the
  JSON request processor and the handler wrappers, and calls the two public functions below for GET .../files/{file_id}/content and
  POST .../files. Because B3372 registers every path and alias, the HTTP oracle cases for both routes belong to B3372. This task
  has Rust tests only.

  Shape. ContainerFileRequests is built with three injected collaborators and holds no module state. (1) A ContainerAccess trait
  with two async methods, check_access(container_id, caller, provider) returning the original container id and the resolved
  provider, and forwarding_params(container_id, original_container_id, provider) returning ForwardingParams (container_id,
  custom_llm_provider, model_id as Option<String>). The production implementation is a thin adapter over B3362's
  assert_user_can_access_container and get_container_forwarding_params, written in this module. (2) A RequestProcessing trait
  with process(data, route_type, caller) and handle_exception(error, caller, data). The production implementation is B004's common
  request processing and its exception handling (LiteLLM's ProxyBaseLLMRequestProcessing.base_process_llm_request and
  _handle_llm_api_exception). B3372 supplies it at wiring time, so this task only declares the trait and tests against a fake.
  (3) A ProviderHints value taken from B2400's accessors, already read from the request: the custom-llm-provider header and the
  custom_llm_provider query value, both Option<String>. The functions never read the JSON body, so B2400's body accessor is not used.

  Provider pick (both functions). The provider is the first truthy value of the custom-llm-provider header, then the
  custom_llm_provider query value, then the literal "openai". An empty string is not truthy, so it falls through to the next
  source.

  process_file_content_request(request parts, container_id, file_id, caller). Steps, in LiteLLM's order (L164-L268).
  (1) Pick the provider. (2) Call check_access with the path container_id and the provider; it returns the original id and the
  resolved provider, or rejects with 403 "Forbidden". (3) Call forwarding_params with the path container_id, the original id and
  the resolved provider. (4) Build the data map with file_id first, then container_id (the original id), custom_llm_provider (the
  resolved one) and model_id when forwarding_params gave one. file_id is the whole path segment and is never decoded. (5) Inside
  the guarded section, call process with the data, route type "aretrieve_container_file_content" and no model. (6) Guess the
  content type from the lowercase file_id with content_type_for_file_id. (7) The result must be bytes. Anything else is a
  TypeError-style failure with the text "aretrieve_container_file_content expected bytes, got <type>". Rust has no Python type
  names, so name the variant instead (for example "json object") and keep the sentence shape. (8) Return ContainerFileDownload:
  the bytes, the content type and the headers the common processing put on its response object (LiteLLM copies
  dict(fastapi_response.headers)). Steps 5 to 8 are one guarded section: any failure goes to handle_exception and the mapped error
  is what the caller sees.

  content_type_for_file_id(file_id) is a public pure function. On the lowercased id the first match wins, in this order:
  contains ".png" or ends with "png" gives image/png; contains ".jpg" or ".jpeg" gives image/jpeg; ".gif" gives image/gif;
  ".csv" gives text/csv; ".json" gives application/json; ".txt" gives text/plain; ".pdf" gives application/pdf; anything else gives
  application/octet-stream. The test is substring based, so "report.png.txt" is image/png and "csvdata" is octet-stream.
  Starlette appends "; charset=utf-8" to every text/* media type when it builds the response, so the HTTP content-type header for
  .csv and .txt is "text/csv; charset=utf-8" and "text/plain; charset=utf-8". ContainerFileDownload carries the bare media type and
  the route layer formats the header; record the charset rule in the type's doc comment so B3372 applies it.

  process_file_upload_request(request parts, container_id, route_type, caller, form). Steps (L271-L357). (1) Read the form with
  B1101's get_form_data and then convert_upload_files_to_file_data; both run before any guarded section, so a malformed form fails
  with B1101's error and not through handle_exception. (2) If the converted data has no "file" key, fail with HTTP 400 and detail
  "Missing required 'file' field" (a plain detail body, not an OpenAI error object, and not through handle_exception). (3) If
  data["file"] is a non-empty list, replace it with its first element, a (filename, bytes, content_type) tuple. An uploaded single
  file arrives as a one-element list, so this gives the tuple. A plain text field named "file" stays a string. (4) Pick the provider.
  (5) check_access and forwarding_params as above. (6) data.update(forwarding params): container_id, custom_llm_provider and
  model_id from the checks overwrite any form field of the same name, while every other form field stays in data as B1101 returned
  it. (7) Inside the guarded section call process with the data, the given route_type and no model, and return the result
  unchanged. Any failure goes to handle_exception. route_type is an argument because B3372 passes the catalog's async_name for the
  upload entry ("aupload_container_file"). file_id is not part of the data. No query parameter is forwarded.

  Errors. ContainerFileRequestError is this module's enum: AccessDenied (carries B3362's 403 Forbidden), Form (wraps B1101's
  error), MissingFileField (400), NotBytes (text above) and Processing (the mapped error from handle_exception). Access checks,
  forwarding_params and form reading run before the guarded section, so their errors are returned as they are and never reach
  handle_exception. This matches LiteLLM, where they are raised before the try block.

  Tests (tests.rs) use a fake ContainerAccess, a fake RequestProcessing that records the data map, route type and model it was
  given, and an in-memory B1101 form value. Name the tests provider_*, access_*, binary_*, content_type_*, upload_* and error_* so
  each check below filters on its prefix. The task parses no bytes of its own (B1101 owns the form decoder), so there is no fuzz
  target. Budget from about 115 owned LiteLLM lines: about 230 production lines and 350 test lines.

