oracle_cases: []

deviations:
  - what: The two request processors take their collaborators (ownership checks, common processing, request provider hints) through constructor-injected traits, and return a ContainerFileDownload value instead of a framework Response.
    why: betterlite-server wires the real services at startup and the axum layer builds the response, so these functions stay testable without a server. The client sees the same bytes, content type and headers.
  - what: A second file part sent under the plain form key "file" is dropped by the form reader, as in LiteLLM, which keeps the last repeated plain key.
    why: B1101 owns the reader and mirrors LiteLLM here; the upload processor only takes the first element of whatever list reaches it.

out_of_scope:
  - "_load_endpoints_config, get_all_route_types, _create_handler_for_path_params, _declared_query_params, _process_request and register_container_file_endpoints in handler_factory.py: B3372 owns them, with route registration under /v1/containers... and /containers..., the JSON request processor and the HTTP oracle cases for the content and upload routes."
  - "_get_container_provider_config in handler_factory.py has no caller at the pin (grep for it finds only its definition): B3372 lists it as out of scope with that reason."
  - "assert_user_can_access_container and get_container_forwarding_params: B3362 owns them; this task adapts them behind ContainerAccess."
  - "ProxyBaseLLMRequestProcessing.base_process_llm_request and _handle_llm_api_exception: B004 owns them."
  - "get_form_data and convert_upload_files_to_file_data: B1101 owns them. The provider accessors: B2400."
  - "The generated container file operations that the route type finally reaches (acontainer_file_call): B3368 owns them."

pitfalls:
  - The ownership check and the forwarding lookup run before the try block, so a 403 "Forbidden" comes back as a plain detail error and is never shaped by the common exception handling.
  - >-
    The missing file check answers 400 with detail "Missing required 'file' field" as an HTTP error body ({"detail": ...}), not as an OpenAI error object.
  - data["file"] is a one-element list when one file was uploaded, so the first-element step turns it into the (filename, bytes, content_type) tuple; a text field named file is left as a string.
  - The forwarding update overwrites container_id, custom_llm_provider and model_id from the form, so a client cannot choose the provider or model by form field, but any other form field (for example purpose) reaches the call.
  - The content type test is substring based and ordered, so report.png.txt is image/png and a bare id ending in png (no dot) is image/png too.
  - The content response copies the headers the common processing set and sets its own media type, so x-litellm-* headers reach the client on this route, unlike the video content route.
  - The binary processor checks for bytes after the processing returns, inside the guarded section, so a JSON object from the router becomes a mapped 500, not a raw response.
  - The upload processor receives no file_id and forwards no query parameter, and the binary one forwards neither a query nor a body.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
