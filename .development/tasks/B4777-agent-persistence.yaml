dod:
  - text: safe_json_text removes NUL characters from strings and object keys, replaces a value deeper than max_depth with `MaxDepthExceeded`, and keeps everything else.
    proof: [json-text-tests]
  - text: Create plans a litellm_params with a marker secret dropped, writes kill_switch as `null` when absent, writes static_headers only when non-empty, de-duplicates access_group_ids and skips null limits.
    proof: [plan-tests]
  - text: ConfigSyncAgentPublisher implements AgentChangePublisher and publishes one litellm_agentstable config change per agents_changed call.
    proof: [create-tests]
  - text: Replace plans litellm_params restored from the stored column, always writes static_headers (`{}` when absent), extra_headers (`[]`), access_group_ids and kill_switch (cleared to `null` when the body has none), and writes a limit only when it is set.
    proof: [plan-tests]
  - text: Patch plans only the keys the request carries, turns null static_headers, extra_headers and access_group_ids into `{}`, `[]` and `[]`, writes a null limit as NULL, and restores a marker secret and a marker kill switch secret from the stored row.
    proof: [plan-tests]
  - text: Rows decode into AgentResponse with the identity, the object permission, the raw litellm_params and kill_switch columns, UTC timestamps, widened limits and exact spend, and a JSON string stored in a jsonb column reads the same as an object.
    proof: [row-codec-tests]
  - text: Creating an agent stores the row, its object permission row and its identity with the retired identity history entry in one transaction, returns the decoded agent, publishes once, and a failure after the first write leaves no row and publishes nothing.
    proof: [create-tests]
  - text: A duplicate agent_name or a duplicate Entra application is `Conflict("Agent name or Entra application is already registered")`, and an Entra application whose history row belongs to another agent is `Conflict("Entra application was already registered to another agent")`.
    proof: [create-tests, identity-tests]
  - text: Replace restores a marker secret and a stored kill switch secret from the stored row, keeps a stored secret the body leaves out, clears the optional columns the body leaves out, reports a missing agent as NotFound, publishes once, and without agent_card_params it behaves as a patch.
    proof: [replace-tests]
  - text: Patch writes only the carried columns, leaves the rest of the row unchanged, reports `Agent with ID <id> not found` for a missing agent, and publishes once.
    proof: [patch-tests]
  - text: An identity bind writes the identity row (create, update or upsert as B4772 says) and the history entry, an unbind sets the identity inactive with a new revision and a NULL last_authenticated_at, and a history entry of the same agent is not inserted twice.
    proof: [identity-tests]
  - text: An object permission in the request is merged by B816, written with only the present columns, linked to the agent when the agent had none, and rolled back with the agent write on a failure.
    proof: [permission-tests]
  - text: Deleting an identity-managed agent adds a `"LiteLLM_RetiredAgent"` row (once) and deletes the agent's keys; deleting any other agent keeps its keys; a missing agent is NotFound; delete does not publish.
    proof: [remove-tests]
  - text: "Listing returns every agent newest first with identity and permission, and wraps a failure as `Error getting agents from DB: <error>`."
    proof: [listing-tests]
checks:
  optional: []
  commands:
    - id: json-text-tests
      why: NUL removal or the depth cap in the stored JSON text is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::json_text::/)'
    - id: plan-tests
      why: the create, replace or patch column plans differ from LiteLLM on which columns are written or cleared
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::write_plan::/)'
    - id: row-codec-tests
      why: an agent row does not decode into AgentResponse and StoredAgent against real Postgres
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::row_codec::/)'
    - id: create-tests
      why: add_agent_to_db does not store the agent, its permission and identity in one transaction, or maps conflicts wrongly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::(create|change_publisher)::/)'
    - id: replace-tests
      why: update_agent_in_db does not restore secrets, clear omitted columns, redirect to patch or report a missing agent
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::replace::/)'
    - id: patch-tests
      why: patch_agent_in_db writes columns the request did not carry or misses the not found text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::patch::/)'
    - id: identity-tests
      why: identity binds, unbinds or the retired identity history check are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::identity_write::/)'
    - id: permission-tests
      why: the object permission row is not merged, written with its present columns, linked or rolled back
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::permission_write::/)'
    - id: remove-tests
      why: delete_agent_from_db does not retire the id, delete the keys of a managed agent or keep the keys of an unmanaged one
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::remove::/)'
    - id: listing-tests
      why: get_all_agents_from_db does not order newest first or wrap its failure
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_persistence::listing::/)'
oracle_cases: []
deviations:
  - what: JSON columns (litellm_params, agent_card_params, static_headers, kill_switch) are written as parsed jsonb values, and readers also accept a JSON string stored in the column.
    why: One write path for the typed record. B4775's parsers already accept both forms, and the response JSON is the same either way.
  - what: "A PATCH body with `litellm_params: null` leaves the stored params unchanged. LiteLLM resets them to the stored secrets only."
    why: B4770's typed PatchAgentRequest reads null and absent litellm_params as the same thing, and a client that wants to reset sends an empty object.
  - what: delete_agent_from_db returns nothing, and get_all_agents_from_db returns typed AgentResponse values.
    why: LiteLLM returns dicts that no caller reads except the registry reload, and typed values replace that dict round trip.
  - what: The depth cap of the stored JSON text comes from the constructor, not from the DEFAULT_MAX_RECURSE_DEPTH env var read here.
    why: Dependencies come in through constructors, and the server passes the same default of 100.
out_of_scope:
  - "B4775 owns restore_redacted_litellm_params, parse_agent_litellm_params, parse_agent_kill_switch and serialize_agent_kill_switch. This task calls them and does not copy their rules."
  - "B4772 owns managed_write_fields, the identity configuration checks and raise_identity_failure's status rule. This task turns its output into SQL."
  - "B816 owns prepare_object_permission_upsert, the ambiguity check on mcp_tool_permissions and cache eviction of object permissions."
  - "B4776 owns AgentRegistry, load_agents_from_db_and_config and the reconcile lock. The route owner (B4785) registers a created agent in memory and deregisters a deleted one."
  - "B4785 owns the HTTP routes, the 400 and 404 checks before these calls, the A2A card merge that pre-generates the agent id, and the status mapping of AgentPersistenceError."
  - "agent_registry.py has no other code at the pin. The AgentRecord, AgentTableClient and AgentIdWhere protocols and agents_table, object_permission_table are Prisma adapters and have no native counterpart."
pitfalls:
  - "A PUT body without `kill_switch` stores the text `null`, so it clears a configured switch; a PATCH without the key leaves it."
  - "A PUT writes tpm_limit, rpm_limit, session_tpm_limit and session_rpm_limit only when they are not null, so a PUT cannot clear a limit, while a PATCH with `tpm_limit` set to null does."
  - "Create restores litellm_params against an empty map on purpose: a stray `api_key: REDACTED_BY_LITELM` is dropped, not stored."
  - "PUT with no agent_card_params is a patch, and so a PUT in that form does not clear static_headers or access_group_ids unless the body carries them."
  - "A patch's NotFound text is `Agent with ID <id> not found`, and the update and delete text is `Agent not found, passed agent_id=<id>`."
  - "Delete keeps API keys of an agent whose identity_managed is false; only a managed agent loses its the LiteLLM_VerificationToken rows."
  - "The retired identity check runs before the write and reads the writer pool, because a replica could lag behind the history row the same request depends on."
  - "A history row of the same agent is not an error and is not inserted again; with no prior row the agent's new binding inserts one."
  - "Timestamp columns are `TIMESTAMP(3)` without zone, so bind and read chrono NaiveDateTime in UTC and do not use a zoned type."
  - "Postgres rejects `\u0000` in jsonb, so NUL removal in safe_json_text must cover object keys as well as values."
  - "`extra_headers` and `access_group_ids` are `text[]` columns; bind a `Vec<String>`, not JSON."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
