references: []
dod:
  - text: ClientKind and SuppliedClient exist once, in vector_store_http_write's service module, and none of the twelve class enums or the twelve supplied-client structs is left.
    proof: [kind-copies, supplied-copies, home-shape]
  - text: One WriteRequest with a query and one WriteTransport serve every handler family named here, ProxiedClient implements it once, and no copied request struct, transport trait or proxied adapter is left.
    proof: [request-copies, home-shape]
  - text: Every user of a deleted type compiles against the home and the owners' tests in core, provider, python and server pass with only names, imports and fake methods changed.
    proof: [core-client-tests, provider-client-tests, python-client-tests, server-video-tests]
checks:
  optional: []
  commands:
    - id: kind-copies
      why: a module still declares its own Sync and Asynchronous client class enum
      run: |-
        test -z "$(grep -lE '^pub enum (ClientKind|Mode|ImageEditClientKind|CustomClientKind)\b' crates/betterlite-core/src/api/responses_read_http/service.rs crates/betterlite-core/src/api/responses_compact_http/service.rs crates/betterlite-core/src/api/responses_write_http/service.rs crates/betterlite-core/src/api/videos_http_transport/client.rs crates/betterlite-core/src/api/fal/video_results/transport.rs crates/betterlite-core/src/api/file_http_upload/service.rs crates/betterlite-core/src/api/image_edit_call/call.rs crates/betterlite-core/src/api/image_generation_call/call.rs crates/betterlite-provider/src/api/image_edit_http/service.rs crates/betterlite-provider/src/api/image_generation_http.rs crates/betterlite-provider/src/api/rerank_http/client.rs crates/betterlite-provider/src/api/speech_http.rs)" &&
        test -z "$(grep -rnwE 'ImageEditClientKind|CustomClientKind' crates tools --include=*.rs)"
    - id: supplied-copies
      why: a module still pairs the client class with a borrowed transport in its own struct
      run: |-
        test -z "$(grep -lE '^pub struct (SuppliedClient|SuppliedTransport)\b' crates/betterlite-core/src/api/responses_read_http/service.rs crates/betterlite-core/src/api/responses_compact_http/service.rs crates/betterlite-core/src/api/responses_write_http/service.rs crates/betterlite-core/src/api/videos_http_transport/client.rs crates/betterlite-core/src/api/fal/video_results/transport.rs crates/betterlite-core/src/api/file_http_upload/service.rs crates/betterlite-core/src/api/realtime_http_calls/call.rs crates/betterlite-provider/src/api/image_edit_http/service.rs crates/betterlite-provider/src/api/image_generation_http.rs crates/betterlite-provider/src/api/rerank_http/client.rs crates/betterlite-provider/src/api/speech_http.rs crates/betterlite-provider/src/api/realtime_http_transport/client.rs)" &&
        test -z "$(grep -rnw 'SuppliedTransport' crates/betterlite-core/src/api/fal tools/oracle/src/helpers/core_ops/fal_video_results --include=*.rs)"
    - id: request-copies
      why: a copied request struct, transport trait or ProxiedClient adapter over the handler request is still in place
      run: |-
        test -z "$(grep -lE '^pub (struct (WriteRequest|CompactRequest|VideoRequest|FileRequest|SpeechWireRequest)|trait (WriteTransport|CompactTransport|VideoTransport|VideoAsyncClient|FileTransport|SpeechTransport))\b' crates/betterlite-core/src/api/responses_write_http/service.rs crates/betterlite-core/src/api/responses_compact_http/service.rs crates/betterlite-core/src/api/videos_http_transport/client.rs crates/betterlite-core/src/api/vector_file_http_write/service.rs crates/betterlite-core/src/api/vector_file_http_create_list/service.rs crates/betterlite-core/src/api/video_remix_list_transport/client.rs crates/betterlite-provider/src/api/speech_http.rs)" &&
        test ! -e crates/betterlite-core/src/api/responses_compact_http/service/proxied.rs &&
        test ! -e crates/betterlite-core/src/api/responses_write_http/service/proxied.rs &&
        test ! -e crates/betterlite-core/src/api/vector_file_http_write/service/proxied.rs &&
        test ! -e crates/betterlite-core/src/api/vector_file_http_create_list/service/proxied.rs &&
        test ! -e crates/betterlite-provider/src/api/speech_http/proxied.rs &&
        test -z "$(grep -rnwE 'CompactTransport|SpeechWireRequest|VideoAsyncClient' crates/betterlite-core/src crates/betterlite-provider/src crates/betterlite-python/src crates/betterlite-server/src tools/oracle/src/helpers/core_ops tools/oracle/src/sdk_http --include=*.rs)"
    - id: home-shape
      why: the home request lost its query, its adapter drops the query, or the home supplied client is not Copy for a ProxiedClient
      run: |-
        grep -qxF '    pub query: Vec<(String, String)>,' crates/betterlite-core/src/api/vector_store_http_write/service.rs &&
        grep -qF "impl<Client> Copy for SuppliedClient<'_, Client> {}" crates/betterlite-core/src/api/vector_store_http_write/service.rs &&
        grep -qF "impl<Client> Clone for SuppliedClient<'_, Client> {" crates/betterlite-core/src/api/vector_store_http_write/service.rs &&
        grep -qF 'query: request.query,' crates/betterlite-core/src/api/vector_store_http_write/service/proxied.rs
    - id: core-client-tests
      why: a core handler family lost its client selection, its timeout, its error mapping or its request after the merge
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(vector_store_http_write|responses_read_http|responses_compact_http|responses_write_http|responses_compact_call|responses_create|responses_create_http|responses_lifecycle_call|responses_lifecycle_write|videos_http_transport|video_character_transport|video_content_call|video_generation_call|video_remix_call|video_remix_list_transport|video_edit_transport|fal::video_results|file_http_upload|file_provider_write|file_http_metadata|image_edit_call|image_generation_call|realtime_http_calls|vector_file_http_write|vector_file_http_create_list|vector_search_execution|vector_store_http_create_read)::/) - test(/replays_/)'
    - id: provider-client-tests
      why: the provider image, rerank, speech or realtime transport no longer picks or sends through the shared client types
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^(api::(image_edit_http|image_generation_http|rerank_http|speech_http|realtime_http_transport)|azure_media_dispatch)::/) - test(/replays_/)'
    - id: python-client-tests
      why: the Python file or video calls no longer reach the upload mode or the async video client through the home types
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^(file_calls|video_calls)::/)'
    - id: server-video-tests
      why: the server's video generation health check fake no longer implements the shared transport
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_native_backend::video_generation::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "B10217's group: the `Sync, Async` client class and its supplied pair in betterlite-bedrock (bedrock_embedding_io, image_call and rerank transport.rs), betterlite-vertex's gemini_http/call.rs, core's soniox/pipeline/client.rs and bfl's TransportKind and SuppliedTransport. They take this home without waiting for B10200."
  - "The same class below betterlite-core, which cannot import this home: betterlite-anthropic's chat_call/transport.rs ClientKind and SuppliedChatClient and betterlite-foundry's embeddings/call.rs EmbeddingMode and SuppliedClient. Folding them needs the home moved into betterlite-http, a later plan."
