deviations: []
out_of_scope: []
pitfalls:
- Provider resolution falls back safely when get_llm_provider raises BadRequestError; returning None instead of
  panicking.
- Opaque metadata filtering must preserve the configured default_metadata values even when request metadata is
  empty or missing.
- Finish-reason extraction must check both finish_reason and stop_reason fields to support Anthropic-format
  responses.
- Hook-name coercion handles both string enum values and Mode.tags which may be lists or single values.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
