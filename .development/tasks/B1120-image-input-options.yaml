id: B1120
title: Image edit parameters and MIME
description: >-
  Project edit option fields and sniff at most the first 100 bytes for MIME with PNG fallback. Use provider capability
  input rather than calling image endpoints.


  edit-optional-params uses the OpenAI edit configuration with background=transparent, input_fidelity=high, n=1
  and response_format=b64_json, plus allow/drop cases. Sniff png/jpeg/gif/webp/heic; unknown type or any sniff/read
  error returns image/png, reads at most 100 bytes and restores a seekable stream position.


  Implement crates/betterlite-core/src/api/image_input_options.rs. Use ImageInputOptionsInput and ImageInputOptionsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions edit_optional_params, png_jpeg_webp_mime, mask_content_type, unknown_mime_png,
  sniff_error_png, heic_mime under api::image_input_options::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.drop_params
  defaults to false; LITELLM_DROP_PARAMS uses the source flag parser; invalid nonempty env values warn and enable;
  env.LITELLM_DROP_PARAMS defaults to false; empty is false, recognized boolean strings use normalize_drop_params;
  invalid nonempty values warn and enable. No environment reads occur outside betterlite-config. Test api::image_input_options::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ImageInputOptions in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {image_input_options: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/images/utils.py: ImageEditRequestUtils.get_optional_params_image_edit (L14-L61); litellm/images/utils.py:
  ImageEditRequestUtils.get_requested_image_edit_optional_param (L64-L81); litellm/images/utils.py: ImageEditRequestUtils.get_image_content_type
  (L84-L147). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 107 owned nonblank/non-comment/non-docstring Python lines (140 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 127 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 431 total within the 440-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B175 (Provider parameter capabilities and mapping), B171 (Direct helper oracle and URL
  path encoding), B1087 (Api boundaries), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
