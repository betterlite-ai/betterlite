out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- 'Within ImageEditRequestUtils.get_optional_params_image_edit\''s unsupported_params branch, preserve raise litellm.UnsupportedParamsError(model=model,
  message=f"The following parameters are not supported for model {model}: {'', ''.join(unsupported_params)}") and
  its nested guards.'
- 'Within ImageEditRequestUtils.get_optional_params_image_edit\''s should_drop branch, preserve raise litellm.UnsupportedParamsError(model=model,
  message=f"The following parameters are not supported for model {model}: {'', ''.join(unsupported_params)}") and
  its nested guards.'
