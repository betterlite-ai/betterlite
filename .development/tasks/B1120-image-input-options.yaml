checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::image_input_options::/)
      - test(/::replays_corpus$/)'
  - id: case-edit-optional-params
    why: the edit-optional-params behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_input_options::tests::edit_optional_params($|::)/)'
  - id: case-png-jpeg-webp-mime
    why: the png-jpeg-webp-mime behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_input_options::tests::png_jpeg_webp_mime($|::)/)'
  - id: case-mask-content-type
    why: the mask-content-type behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_input_options::tests::mask_content_type($|::)/)'
  - id: case-unknown-mime-png
    why: the unknown-mime-png behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_input_options::tests::unknown_mime_png($|::)/)'
  - id: case-sniff-error-png
    why: the sniff-error-png behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_input_options::tests::sniff_error_png($|::)/)'
  - id: case-heic-mime
    why: the heic-mime behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_input_options::tests::heic_mime($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::image_input_options::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/image-input-options-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/image_input_options.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/image_input_options-*)"
      && grep -qE "^[[:space:]]+image_input_options:" tools/oracle/fuzz/corpus/helper_case/image_input_options-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/image-input-options)"
