id: B1120
title: Image edit parameters and MIME
description: >-
  Implement all three ImageEditRequestUtils methods and ImageEditOptionalRequestParams/ImageEditRequestParams
  in betterlite-core::api::image_input_options. The optional keys are background, input_fidelity, mask, n,
  quality, response_format, size, user and imageConfig; image, prompt and model are request fields. Selection
  admits provider capability extensions, excludes null and retains false, zero and empty strings. Apply
  additional_drop_params before unsupported-parameter checking and map_openai_params. Only boolean true in
  either resolved global drop_params or the call option enables dropping; call=false cannot disable global=true.

  Inspect at most 100 image bytes from the beginning through B258's signature recognizer. Restore a reader's
  saved position only after successful reading. Unknown signatures, unhandled objects and read/seek/detection
  exceptions return image/png silently. Nonseekable readers are consumed. B175 owns capability mapping, B002
  resolves litellm_settings.drop_params and LITELLM_DROP_PARAMS; inject the resolved boolean here. B1087 bounds
  inputs. Signature decoding and its fuzz corpus remain B258's; this task handles reader effects and MIME mapping.

  Register image_input_options in Rust/Python helper dispatch. Python invokes the pinned methods using finite
  reader fixtures and records mapper calls. Ownership is 129 nonblank/non-comment lines including types and
  docstrings; allocate 130 implementation, 100 tests, 75 cases, 90 adapters and 35 wiring lines, total 430.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/image_input_options.rs
  - crates/betterlite-core/src/api/image_input_options/**
  - Cargo.toml
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/image_input_options.rs
  - tools/oracle/src/helpers/core_ops/image_input_options/**
  - tools/oracle/helpers/image_input_options.py
  - tools/oracle/helpers/image_input_options/**
  - tools/oracle/fuzz/corpus/helper_case/image_input_options-*
  - tools/oracle/cases/helpers/image-input-options/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/utils.py#L12-L147
  why: Own selection, removal before mapping and reader/MIME fallback, including failed restoration.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/images/main.py#L8-L35
  why: Edit options include imageConfig but do not declare stream.
dod:
- text: >-
    edit_optional_params supplies background=transparent,input_fidelity=high,n=0,response_format=b64_json,
    mask=null,user="",imageConfig={},stream=true and provider extension seed=0. Keep all nonnull declared
    fields plus advertised seed; omit mask and stream. With supported=[n,user], default drop=false raises
    UnsupportedParamsError, status 400, source message "The following parameters are not supported for model
    edit-model: background, input_fidelity, response_format, imageConfig, seed". additional_drop_params
    naming those five keys plus absent removes them before validation and maps {n:0,user:""}. Either
    global=true/call=false or global=false/call=true drops unsupported fields and passes drop_params=true
    to the mapper; neither set passes false. HTTP envelope mapping belongs to B082.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    image_signature_mime supplies PNG,JPEG,GIF,WebP,HEIC bytes and expects image/png,image/jpeg,image/gif,
    image/webp,image/heic. BytesIO, BufferedReader and generic seekable readers positioned at 7 are read
    from 0 for at most 100 bytes and restored to 7. Mask bytes follow the same rule; a .jpeg filename does
    not override a PNG signature. Signature recognition itself is B258's fixture input.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    mime_fallback_and_reader_effects supplies unknown bytes, an unlisted detected type and an object without
    read: expect image/png with no warning. Exceptions from tell, initial seek, read, restore or recognition
    also return image/png. A read failure after seek(0) leaves position 0. A nonseekable reader consumes its
    first 100 bytes; no rewind is attempted.
  proof: [behavior-tests, oracle, helper-python]
- text: The added helper seed selects image_input_options and executes independent native and pinned selection/reader policy.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Field precedence, mapper arguments and reader effects require assertions against production methods.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_input_options::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: The pinned method adapter must exist and pass typed Python checks.
    run: test -f tools/oracle/helpers/image_input_options.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: A seed must exercise the image_input_options variant.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/image_input_options-*)" && grep -qE '^[[:space:]]+image_input_options:' tools/oracle/fuzz/corpus/helper_case/image_input_options-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Existing media cases cannot substitute for edit selection and reader fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/image-input-options)"
oracle_cases:
- tools/oracle/cases/helpers/image-input-options/edit-optional-params.yaml
- tools/oracle/cases/helpers/image-input-options/image-signature-mime.yaml
- tools/oracle/cases/helpers/image-input-options/mime-fallback-and-reader-effects.yaml
deviations: []
out_of_scope:
- B258 owns get_image_type signature decoding; B175 owns provider mapping implementations; B002 owns the global drop flag loader.
- B997 owns image interfaces. B999 performs edit provider I/O and B082 registers its routes.
pitfalls:
- 'The oracle helper for this task is pre-registered as image_input_options in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/image_input_options.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/image_input_options.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- additional_drop_params removes supported fields too, before the unsupported list is calculated.
- MIME exceptions return PNG silently and do not guarantee restoration after a failed read.
- Empty imageConfig and user survive selection; a truthiness filter changes requests.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
