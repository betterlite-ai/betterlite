id: B2235
title: Stream usage accumulation and estimation
description: >-
  Implement shared typed chunk assembly in betterlite-streaming, below provider and SSE execution. Parsed chunk
  DTOs come from B004; this task does not create another SSE/JSON parser. Use bounded outputs and injected clock/counters
  where the source reads them.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/litellm_core_utils/streaming_chunk_builder_utils.py:
  _reports_prompt_side_usage L169-L174; capture_cache_creation_token_details L177-L187; attach_cache_creation_token_details
  L190-L202; apply_grounding_request_counts L205-L223; ChunkProcessor._usage_chunk_calculation_helper L777-L816;
  count_reasoning_tokens L818-L832; _extract_usage_chunk L834-L850; _calculate_usage_per_chunk L852-L976; _last_provider_pricing_field
  L978-L994; _finish_reason_of_choice L996-L1004; _chunk_choices L1006-L1010; _saw_finish_reason L1012-L1018; _reset_anthropic_cursor_completion_tokens
  L1020-L1057; calculate_usage L1059-L1174.


  Named case contracts: usage_source_and_counts: Prefer non-None usage attribute, then usage key by presence, then
  hidden usage only for ModelResponse/Stream; convert dict/SDK usage through shared B004 types. Absent usage means
  counts unreported None; any usage record missing/null counts reports0. Each positive prompt/completion count replaces
  earlier value, not sum or max; later0/negative replaces only an unreported count. Count positive completion-bearing
  updates. cache_and_details: Accept a non-None cache count when any prompt-side count is positive or that cache
  count is unreported; otherwise retain earlier count. Completion details last non-None; prompt details last truthy.
  Preserve last non-None nested cache_creation_token_details across later prompt detail replacement, but do not
  replace an existing nested breakdown when attaching. server_tool_use last non-None coerced to typed record; malformed
  source values fail. grounding_and_pricing: Retain last non-None web_search_requests and google_maps_grounding_requests
  separately, including0; overlay both into prompt details creating it if absent. cost last non-None including0
  uses Decimal. inference_geo/speed last string wins including empty. Keep these fields through final Usage reconstruction.
  anthropic_cursor_reset: Reset completion count and completion details to unreported only when first chunk hidden
  params is a dict with exact custom_llm_provider anthropic, fewer than2 positive completion usage updates, and
  no choice anywhere has non-None finish reason. Empty finish string is evidence. No magnitude check: a lone8 or0
  also resets. Other provider names keep their counts. token_fallback_and_failures: Estimate only unreported counts.
  Prompt uses supplied counter callback else B196 model/messages counter; any prompt count error emits verbose token_counter
  failed, assuming prompt tokens is 0 and uses0. Completion estimation uses model/text/count_response_tokens=True
  plus reasoning_tokens-or0 and propagates counting errors. Provider reported0 is never estimated. total is prompt+completion.
  reasoning_usage: Count each truthy message.reasoning_content via B196 text counter with count_response_tokens=True
  and no model; no reasoning means None, empty strings skipped, failures propagate. Supplied reasoning count is
  capped with min(max(0,count),completion_tokens), including source negative completion edge. Create detail reasoning/text
  counts if absent; fill only None fields if details exist, preserving reported reasoning and text counts. usage_detail_copying:
  Grounding and nested cache attachment return copied typed details only when updates are required; no update returns
  original. Final usage keeps public/private cache counts, provider detail wrappers, server_tool_use and cost without
  mutating input chunk records.


  Use B2239 for main/utils print_verbose at the owned call sites; these are verbose hooks, not pre_call/post_call.


  Implement crates/betterlite-streaming/src/stream_usage_assembly.rs with adjacent tests under stream_usage_assembly/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_usage_assembly_cases in betterlite-streaming with these exact named cases (one per
  oracle file): usage_source_and_counts, cache_and_details, grounding_and_pricing, anthropic_cursor_reset, token_fallback_and_failures,
  reasoning_usage, usage_detail_copying. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/stream_usage_assembly* using HelperCase: kind:
  helper and the externally tagged stream_usage_assembly variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_stream_usage_assembly that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 383 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 340 production lines, 270 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 755 planned, 775 maximum changed lines.
