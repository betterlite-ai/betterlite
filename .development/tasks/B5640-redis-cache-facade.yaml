dod:
  - text: >-
      `connect` builds every slice over one transport, so a write through `values`, a
      counter through `counters`, a delete through `admin` and a push through `lists`
      all reach the fake server with the namespaced key, and `values` uses the given
      `default_ttl` as its `EX`.
    proof: [parts-tests]
  - text: >-
      A missing `socket_timeout` becomes 5.0 and a given one stays.
    proof: [socket-timeout-tests]
  - text: >-
      `connect` fills `redis_major_version` from an `INFO` reply of text, integer and
      float, and uses `default_major_version` when `INFO` fails or has no
      `redis_version`, and `connect` still returns `Ok` in those cases.
    proof: [version-tests]
  - text: >-
      `connect` starts the health pings, so the fake server sees `PING` once `connect`
      returns.
    proof: [health-ping-tests]
  - text: >-
      `async_increment` sends the namespaced key with the given TTL or `default_ttl`,
      honors `refresh_ttl`, fires the success hook, returns a client error with no hook,
      and fires the failure hook and returns the error on a command failure.
    proof: [increment-tests]
  - text: >-
      `async_increment_pipeline` returns `None` and sends nothing for an empty list,
      returns only the float replies otherwise, returns a client error with no hook, and
      fires the failure hook and returns the error on a pipeline failure.
    proof: [increment-pipeline-tests]
  - text: >-
      `async_get_cache` decodes JSON and Python literal replies, returns `None` for a
      miss, puts the namespaced key on both hook events, returns a client error, and
      swallows a GET or decode error.
    proof: [get-tests]
  - text: >-
      `async_batch_get_cache` drops `None` keys, sends namespaced keys in one `MGET`,
      maps original keys to decoded values with `None` for a miss, and swallows every
      error into an empty map, a client error included. A bad cached value fires both
      hooks.
    proof: [batch-get-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `async_get_ttl` returns the seconds left, `None` for replies -1 and -2, and swallows
      every error into `None` with no hook.
    proof: [ttl-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `async_refresh_ttl` sends `EXPIRE` with the namespaced key, answers `true` or
      `false` from the reply, and returns an error.
    proof: [refresh-ttl-tests]
  - text: >-
      `run_script` runs the script under the name `run_script`, and a failing script
      reaches `gate.record_failure` and is returned.
    proof: [script-tests]
  - text: >-
      An open breaker returns `RedisCacheError::Breaker` from all seven guarded methods
      with the fake server recording no command. A success exits the gate once, a
      returned error skips `exit`, and a swallowed failure reaches `gate.swallowed`
      before `exit`.
    proof: [gate-tests]

checks:
  optional: []
  commands:
    - id: parts-tests
      why: A slice is missing from RedisCache or does not get the namespace and TTL
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache::tests::parts::/)'
    - id: socket-timeout-tests
      why: The 5.0 second default is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache::tests::socket_timeout::/)'
    - id: version-tests
      why: The version read or its swallowed failure is missing
