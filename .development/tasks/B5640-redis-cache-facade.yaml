id: B5640
title: Build the RedisCache facade over the Redis operation modules
description: >-
  B4325 to B4329 each built one slice of LiteLLM's `RedisCache` in betterlite-redis.
  This task adds the module `redis_cache` there. It joins the slices into one
  `RedisCache` value and builds what no slice owns: the constructor, six guarded
  async methods and the guarded script run. B4293, B4294, B360, B4330 and the proxy usage-cache builders (B8377 to B8389)
  reach Redis through this type.

  The module reads no config key and no env var of its own, and it knows nothing
  about betterlite-router or betterlite-logging. The breaker and the service logger
  arrive as `Arc<dyn BreakerGate>` and `Arc<dyn ServiceHooks>` from
  `redis_client_reuse`. B5630 fills them with the real ones. Tests here use a
  recording gate and hook in `redis_cache/tests/support.rs`. No new dependency is
  needed.

  Type. `RedisCache` has only public fields, and callers go through them:
  `cache.values.async_set_cache(..)`, `cache.counters.async_set_max(..)`,
  `cache.admin.ping(..)`, `cache.lists.async_rpush(..)`. Write no method that only
  forwards to a slice, because the rules forbid one-line wrappers. The fields are
  `transport: Arc<RedisTransport>`, `values: RedisCacheValues`, `counters:
  RedisCounters`, `admin: Arc<RedisCacheAdmin>`, `lists` (B4329's list type),
  `namespace: Option<String>`, `default_ttl: i64`, `redis_major_version: u32`,
  `hooks: Arc<dyn ServiceHooks>` and `gate: Arc<dyn BreakerGate>`.

  Constructor. `RedisCacheOptions` has the public fields `overrides: RedisOverrides`,
  `family: RedisCacheFamily`, `namespace: Option<String>`, `default_ttl: i64`,
  `redis_flush_size: Option<usize>`, `default_major_version: u32`, `factory:
  Arc<LiveClientFactory>`, `store: Arc<RedisClientStore>`, `hooks` and `gate`.
  `async fn connect<E: EnvironmentLookup>(options: RedisCacheOptions, env: &E) ->
  Result<RedisCache, RedisCacheError>` follows `__init__` (L607-L674) in this order.
  First, `with_default_socket_timeout(overrides)` sets `socket_timeout` to
  `Scalar::Value(5.0)` when it is `None`, and a given value stays. Second,
  `resolve_redis_kwargs(overrides, ClientKind::Async, env)` gives the settings,
  `resolve_target` reads the target from them, and `build_connection_pool(&settings,
  target, env)` gives the pool. `RedisTransport::new` takes one settings record, so
  resolve once with the kind every request uses. Third, build `RedisTransport`,
  `RedisCacheValues` (with `namespace`, `default_ttl: Some(default_ttl)` and
  `redis_flush_size`), `RedisCounters` and `RedisCacheAdmin`, all sharing the same
  transport, hooks and gate. Fourth, read the version: run `admin.info()` in
  `tokio::task::spawn_blocking`, await it, and take `redis_version` from the map.
  `InfoValue::Text`, `Int` and `Float` become `RedisVersionValue::Text`, `Integer`
  and `Float`. A failed `info`, a missing field or any other `InfoValue` kind leaves
  `RedisVersionValue::Text("Unknown")`, writes a `tracing::debug!` line, and
  `connect` carries on. `parse_major_version(&value, default_major_version)` gives
  `redis_major_version`. Fifth, build B4329's list type with the transport, the
  namespace, the hooks, the gate and that major version. B4329 names neither the type
  nor its constructor, so use what merged. If it asks for the raw `RedisVersionValue`
  and the default, pass those. Last, call `admin.setup_health_pings().await`.
  Passing `RedisCacheFamily::Cluster` is allowed, because the cluster form of the constructor
  comes through here. `connect` does not choose the family.

  Guard rule, used by every method below. Start with `gate.enter(name)`, where `name`
  is the method's name, and an open breaker returns `RedisCacheError::Breaker` with
  nothing sent. A body that returns `Err` goes to `gate.record_failure(&error)`, the
  error is returned, and `exit` is not called. A body that returns `Ok` calls
  `gate.exit(admission)` once. A failure the body swallows goes to
  `gate.swallowed(&admission, &error)` before that `exit`. Each hook gets a
  `ServiceEvent` with the method's name as `call_type` and the time since the body
  began as `duration`, measured with `std::time::Instant`.

  `async fn async_increment(&self, key: &str, value: f64, ttl: Option<i64>,
  refresh_ttl: bool) -> Result<f64, RedisCacheError>` (L1419-L1476). Call
  `transport.async_client()` first and let its error return with no hook, as LiteLLM's
  lookup outside the try does. `incr_by_float_with_ttl` then finds the same client in
  the store. Use `ttl.unwrap_or(self.default_ttl)`, namespace the key, and call
  `counters.incr_by_float_with_ttl(&key, value, Some(used_ttl), refresh_ttl)`.
  Success fires `hooks.success` with `key: None`. Failure fires `hooks.failure` with
  `key: None`, writes the `tracing::error!` line "LiteLLM Redis Caching: async
  async_increment() - Got exception from REDIS" with the error text, and returns the
  error.

  `async fn async_increment_pipeline(&self, increment_list: &[IncrementOperation]) ->
  Result<Option<Vec<f64>>, RedisCacheError>` (L1954-L2017). An empty list returns
  `Ok(None)` and sends nothing. Otherwise look up the client as above, then call
  `counters.pipeline_increment(increment_list)`. Success fires `hooks.success` with
  `key: None` and returns `Ok(Some(floats))`. Failure fires `hooks.failure`, writes the
  `tracing::error!` line "LiteLLM Redis Caching: async increment_pipeline() - Got
  exception from REDIS" and returns the error.

  `async fn async_get_cache(&self, key: &str) -> Result<Option<CachedValue>,
  RedisCacheError>` (L1648-L1693). The client lookup comes first and its error
  returns with no hook. Namespace the key, send `GET` through
  `LiveAsyncClient::query`, decode with `decode_cached_value`, then fire
  `hooks.success` with `key: Some(namespaced_key)`. A GET or decode error fires
  `hooks.failure` with the same key, writes a `tracing::debug!` line "async get() - Got
  exception from REDIS" with the error text, goes to `gate.swallowed`, and returns
  `Ok(None)`.

  `async fn async_batch_get_cache(&self, key_list: &[Option<&str>]) ->
  Result<HashMap<String, Option<CachedValue>>, RedisCacheError>` (L1696-L1768), the
  same signature shape as B4327's sync `batch_get_cache`. Everything sits inside the
  swallow, the client lookup too. `batch_keys` drops `None` keys and namespaces the
  rest, `transport.async_mget` reads them (empty keys send nothing), and
  `hooks.success` fires with `key: None` before decoding. Convert each `redis::Value`
  with `FromRedisValue` into `Option<Vec<u8>>` and pass the list to `decoded_batch`.
  Any error fires `hooks.failure`, writes the `tracing::error!` line "Error occurred
  in async batch get cache", goes to `gate.swallowed` and returns an empty map.

  `async fn async_get_ttl(&self, key: &str) -> Result<Option<i64>, RedisCacheError>`
  (L2020-L2042). Client lookup, namespacing and `TTL` all sit inside the swallow, and
  no hook fires. `remaining_ttl(reply)` turns the reply into the answer. An error
  writes the `tracing::debug!` line "Redis TTL Error: {error}", goes to
  `gate.swallowed`, and returns `Ok(None)`.

  `async fn async_refresh_ttl(&self, key: &str, ttl: Option<i64>) -> Result<bool,
  RedisCacheError>` (L2045-L2050). Send `EXPIRE namespaced_key used_ttl` with
  `ttl.unwrap_or(self.default_ttl)`, and a reply of 1 is `true`, 0 is `false`. Nothing
  is swallowed and no hook fires. LiteLLM's `False` for a `None` TTL has no branch
  here, because `default_ttl` is a plain `i64`.

  `async fn run_script(&self, script: &RegisteredScript, keys: &[String], args:
  &[RedisScalar]) -> Result<redis::Value, RedisCacheError>` (L1030-L1044) is
  `RegisteredScript::run` under the guard with the name `run_script`. No hook fires.
  Callers register with `cache.counters.async_register_script(..)`.

  Pure functions, public so the oracle adapter can call them.
  `redis_cache/batch_read.rs` has `pub struct BatchKey { pub original: String, pub
  namespaced: String }`, `pub fn batch_keys(key_list: &[Option<&str>], namespace:
  Option<&str>) -> Vec<BatchKey>`, and `pub fn decoded_batch(keys: &[BatchKey],
  replies: &[Option<Vec<u8>>]) -> Result<HashMap<String, Option<CachedValue>>,
  DecodeError>`, mapping each original key to its decoded value with `None` for a miss
  and the last value for a duplicate key. `redis_cache/ttl.rs` has `pub fn
  remaining_ttl(reply: i64) -> Option<i64>`, with `None` for a reply of -1 or lower.

  `RedisCacheError` is a `thiserror` enum owned by this module, with `#[from]`
  variants for `BreakerOpen` (named `Breaker`), `ClientReuseError`, `LiveClientError`,
  `RedisCountersError`, `RedisSettingsError`, `FactoryError`, `DecodeError` and
  `tokio::task::JoinError`. Split the code by job: `redis_cache/connect.rs`,
  `increment.rs`, `reads.rs`, `ttl.rs`, `script.rs`, `batch_read.rs` and `error.rs`.

  Tests reuse the fake server at `crate::redis_live_client::tests::fake_server`, with
  one file per group under `redis_cache/tests/`. The oracle helper op `b5640` has two
  functions and reaches only the pure functions, because `tools/oracle` has no fake
  Redis server. `batch_read` takes `namespace`, `keys` (strings or null) and `replies`
  (strings or null, one per kept key). Its Rust side calls `batch_keys` and
  `decoded_batch`. Its Python side makes a `RedisCache` with `object.__new__`, sets
  `namespace`, `_circuit_breaker` to a closed `RedisCircuitBreaker` and
  `service_logger_obj` to a no-op stub, replaces `_async_run_redis_mget_operation` with
  a stub that records the keys and answers `replies`, runs `async_batch_get_cache` under
  `asyncio.run`, and returns `{keys_sent, values}`. `ttl_reply` takes `namespace`,
  `key` and `reply`. Its Rust side calls `check_and_fix_namespace` and `remaining_ttl`.
  Its Python side replaces `_async_commands` with a stub whose `ttl` records the key
  and answers `reply`, runs `async_get_ttl`, and returns `{key_sent, ttl}`. Write a
  `CachedValue` to JSON the way the `b4327` adapter does. Each case file is `kind:
  helper` with `call: {b5640: {function: ..., ...}}`.

