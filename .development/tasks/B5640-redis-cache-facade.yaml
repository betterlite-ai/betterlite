deviations:
  - what: >-
      The methods take no `parent_otel_span`, the hooks get no `caller` text and no
      start or end time, and the hooks run inline. LiteLLM sends them through
      `asyncio.create_task` with a span, a stack string and two timestamps.
    why: B4325's `ServiceEvent` holds the call type, the duration and the key. Rust has no frame names to walk, and the hook implementer spawns when it has to.
  - what: >-
      `async_batch_get_cache` returns an empty map when decoding fails. LiteLLM returns
      the raw, undecoded values it had mapped so far.
    why: A raw bytes value has no place in the typed result, and B4327's sync read makes the same choice.
  - what: >-
      A failure writes a plain `tracing::error!` line. LiteLLM's `log_redis_failure`
      throttles timeout lines.
    why: The throttle sits in betterlite-router, out of this crate's reach, and B5630's gate carries the failure there.
  - what: >-
      `ttl` is `Option<i64>`. LiteLLM's `get_ttl` also takes text and floats, cuts with
      `int()`, and falls back to the default on text it can't read.
    why: Callers here are typed Rust, so no such value reaches the method.
  - what: >-
      A `socket_timeout` set to null in config gets the 5.0 default. LiteLLM skips the key
      for an explicit `None`, and the client then has no timeout.
    why: "`RedisOverrides` can't tell null from a missing key, and a client with no timeout can hang a request forever."

out_of_scope:
  - "`RedisCircuitBreaker`, `_redis_circuit_breaker_guard`, `_redis_circuit_breaker_guard_sync`, `_enter_circuit_breaker`, `_exit_circuit_breaker`, `_run_under_circuit_breaker`, `_run_under_circuit_breaker_sync`, `log_redis_failure`, `_record_swallowed_redis_failure`, `_breaker_metrics`, `_explicit_causes`, `_redis_health_error_types` and `_redis_timeout_error_types`; B393 owns them and B5630 implements `BreakerGate` over them."
  - "`ServiceLogging` in `litellm/_service_logger.py`; B012 owns it and B5630 implements `ServiceHooks` over it."
  - "Reading `litellm.default_redis_ttl` and `redis_flush_size` from config; B5630 reads them and passes them in."
  - "`RedisClusterCache`'s methods are B4325's and B4326's, B8501 builds the production `GcpTokenFetcher`, `AzureTokenFetcher` and `AwsCredentialsResolver`, and B4299, B360 and the proxy usage-cache builders (B8377 to B8389) choose the cluster family."
  - "`get_redis_client`, `get_redis_connection_pool` and `_get_redis_client_logic`; B4323 owns them, and `connect` calls its Rust counterparts."
  - "`init_async_client`, `init_pubsub_client`, `_cluster_node_pubsub_client`, `_async_commands`, `_get_async_client_cache_key`, `_opaque_kwarg_key` and the MGET operations; B4325 owns them."
  - "`_setup_health_pings`, `ping`, `sync_ping`, `_handle_async_ping_error`, `_handle_sync_ping_error`, `disconnect`, `test_connection`, `delete_cache_keys`, `async_delete_cache`, `delete_cache`, `client_list`, `info`, `flush_cache` and `flushall`; B4326 owns them."
  - "`set_cache`, `get_cache`, `batch_get_cache`, `async_set_cache`, `async_set_cache_pipeline`, `async_set_cache_pipeline_with_ttls`, `async_set_cache_sadd`, `_pipeline_helper`, `_set_cache_sadd_helper`, `batch_cache_write` and `flush_cache_buffer`; B4327 owns them."
  - "`increment_cache`, `increment_with_floor`, `async_increment_with_floor`, `batch_get_counts`, `async_batch_get_counts`, `async_scan_iter`, `async_set_max`, `async_register_script`, `_register_script_for_current_loop`, `_incrbyfloat_with_ttl` and `_pipeline_increment_helper`; B4328 owns them."
  - "`async_rpush`, `async_rpush_and_trim`, `async_rpush_pipeline`, `_pipeline_rpush_helper`, `async_lpop`, `async_lpop_pipeline`, `_pipeline_lpop_helper` and `handle_lpop_count_for_older_redis_versions`; B4329 owns them."
  - "`check_and_fix_namespace`, `_get_cache_logic`, `_parse_redis_major_version`, `_decoded_counts` and `_get_call_stack_info`; B4324 owns them. The code here calls the first three."
  - "`BaseCache.get_ttl`; B4290 owns it. The `unwrap_or` here is the same rule."
  - "Running a script inside a pipeline through `run_script`'s `client` argument; B4330 owns it and reads `RegisteredScript::sha1`."

pitfalls:
  - >-
      `async_increment`, `async_increment_pipeline` and `async_get_cache` return a client
      error with no hook, while `async_batch_get_cache` and `async_get_ttl` swallow the
      same error. Don't make the five alike.
  - >-
      `async_get_cache` fires the success hook after decoding and
      `async_batch_get_cache` before it, so a bad cached value fires only the failure hook
      in the first and both hooks in the second.
  - >-
      A `None` TTL in `async_increment` means `default_ttl`. Passing `None` on to
      `incr_by_float_with_ttl` would leave the key with no expiry.
  - >-
      `incr_by_float_with_ttl` wants an already namespaced key, while
      `pipeline_increment` and `RegisteredScript::run` namespace their own keys, so give
      those two the keys as the caller wrote them.
  - >-
      `async_increment_pipeline` calls `gate.enter` before it looks at the list, so an
      empty list with an open breaker returns `Breaker` and not `Ok(None)`.
  - "`remaining_ttl` keeps a reply of 0 as `Some(0)`. Only -1 and lower mean `None`."
  - >-
      `admin.info()` blocks on the sync client. Called straight from `connect` it stalls
      a runtime thread for up to `socket_timeout`.
  - >-
      A Redis that is down at startup must still give a `RedisCache`, because LiteLLM's
      version read swallows every error and the breaker deals with the outage later.
  - >-
      `parse_info` turns `redis_version:7.2` into a float and `redis_version:7` into an
      integer. Only a three part version such as `7.2.4` arrives as text.
  - >-
      Set the Python stub's breaker and logger on the instance. `object.__new__` runs no
      `__init__`, so `_circuit_breaker` is otherwise missing and the guard raises
      `AttributeError`.

