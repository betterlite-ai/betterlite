        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache::tests::health_pings::/)'
    - id: increment-tests
      why: async_increment or its hooks are missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
