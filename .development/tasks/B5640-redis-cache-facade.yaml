    - id: helper-python
      why: The Python side of batch_read or ttl_reply has a lint or type error
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5640)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5640 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5640/pyrightconfig.json
    - id: helper-case-corpus
      why: The new facade cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/redis_cache-*")" &&
        grep -lE '^[[:space:]]+b5640:' tools/oracle/fuzz/corpus/helper_case/redis_cache-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

