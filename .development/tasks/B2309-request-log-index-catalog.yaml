  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/request_log_indexes.py#L215-L217
    why: Table-kind lookup moved below the caller's leaf/partition dispatch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/request_log_indexes.py#L225-L228
    why: Schema-qualified identifier projection for regclass lookup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/request_log_indexes.py#L237-L261
    why: State and equivalent-index queries and their ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/request_log_indexes.py#L314-L325
    why: Immediate unattached children retain namespace and partitioned status.
dod:
  - text: 'Pure cases prove registry_order_and_columns, child_name_matching_prefix,
      child_name_nonmatching_prefix, name_exactly_sixty_three_bytes, long_name_full_digest,
      long_unicode_name_boundary and long_suffixes_remain_distinct.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Catalog tests prove missing_relation, plain_and_partitioned_kind,
      state_contains_validity_and_relname_only, nonindex_relation_has_no_state,
      postgres_equivalent_default_btree, wrong_column_order_excluded, unique_excluded,
      expression_excluded, predicate_excluded, include_columns_excluded,
      descending_and_nulls_first_excluded, custom_opclass_excluded,
      nondefault_collation_excluded, attached_index_excluded,
      valid_before_invalid_then_name, expected_name_excluded, immediate_children_only,
      existing_attachment_excluded, cross_schema_children_and_quoted_names,
      query_error_propagates and postgres_inspection_never_mutates.'
    proof: [behavior-tests, postgres-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Naming boundaries and each catalog predicate must have distinct assertions.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^request_log_index_catalog::tests::/)'
    - id: postgres-tests
      why: Real catalog objects must determine equivalence without being renamed, repaired or dropped.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/request_log_index_catalog::tests::postgres_equivalent_default_btree$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/request_log_index_catalog::tests::postgres_inspection_never_mutates$/)'
    - id: helper-python
      why: Naming adapters must invoke the real pinned dataclass methods and type-check.
      run: test -f tools/oracle/helpers/request_log_index_catalog.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new naming operation must replay through the existing typed HelperCase decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/request-log-index-catalog-*")" && grep -rlq request_log_index_catalog tools/oracle/fuzz/corpus/helper_case/request-log-index-catalog-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/request-log-index-catalog/columns-and-prefix.yaml
  - tools/oracle/cases/helpers/request-log-index-catalog/utf8-name-boundaries.yaml
deviations: []
out_of_scope:
  - B718 owns _connect, ensure_request_log_indexes, _under_migration_lock, _with_bounded_lock,
    _ensure_index dispatch, _create_index_statement, _adopt_equivalent_index, _report_second_copies,
    _build_leaf_index, build_index_on_partitioned_table, _create_parent_index and _attach_child_index.
  - filter_request_log_index_diff, _creates_one_of and _without_comments belong only to the excluded
    v1 schema-diff path under B717's native-v2 deviation. B701 recognizes deferred indexes structurally.
pitfalls:
  - 'The oracle helper for this task is pre-registered as request_log_index_catalog in the db group. Replace the stub Op in tools/oracle/src/helpers/db/request_log_index_catalog.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/request_log_index_catalog.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Index state exposes only the indexed table's relname, so it cannot distinguish a same-named table in another schema.
  - Equivalent-index matching excludes attached indexes even when every key column otherwise matches.
  - The child-name digest covers the untruncated UTF-8 name, while only the retained prefix has a 54-byte budget.
budget:
  max_changed_lines: 550
  max_new_expects: 0
review_level: standard
