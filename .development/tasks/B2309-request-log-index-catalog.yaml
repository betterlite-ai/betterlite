id: B2309
title: Request-log index definitions and catalog inspection
description: >-
  Extract betterlite-db::request_log_index_catalog below B718's DDL builder and B701's schema
  contract. Own RequestLogIndex.columns/partition_index_name, REQUEST_LOG_INDEXES, identifier/digest
  limits, the four catalog SQL queries and their row types, _regclass_name, _index_state,
  _equivalent_indexes and _children_without_the_index. Move the table-kind lookup from _ensure_index's
  prelude into this service too. These operations inspect and name indexes; none creates, renames,
  drops or attaches one, takes a migration lock, or depends on the B716 migration coordinator.

  The two definitions, in order, are LiteLLM_SpendLogs_api_key_startTime_idx over ("api_key","startTime")
  and LiteLLM_SpendLogs_litellm_call_id_idx over ("litellm_call_id"), both on LiteLLM_SpendLogs. Keep
  columns in quoted-definition order; the reference columns property collects nonempty double-quoted
  fragments with its regular expression, not a general SQL grammar. Definitions are compiled constants,
  never request-supplied SQL. B701 uses this same registry to recognize deferred managed indexes.

  partition_index_name forms '{partition}_{index_name_without_table_prefix}', removing only a matching
  leading '{table}_'. Return it unchanged at <=63 UTF-8 bytes. Longer names use the longest whole-character
  prefix within 54 bytes, an underscore and the first eight lower-case hex SHA256 digits of the entire
  untruncated UTF-8 name. Preserve suffix sensitivity and Unicode boundaries; do not count Rust chars
  as bytes or hash the shortened prefix. A nonmatching index prefix is kept in full before truncation.

  Quote schema/name separately for regclass lookup and bind that fully quoted identity as a value.
  The table-kind query returns absent for no relation, otherwise whether relkind='p'. Index state
  returns absent when the resolved relation is not an index; otherwise return indisvalid and only
  the indexed table's relname. It does not verify columns, uniqueness or the indexed table's namespace.
  Do not strengthen that projection: B718's source comparison accepts a valid expected index name
  whose table relname matches, even if its definition differs or its table is in another namespace.

  Equivalent-index discovery excludes the expected name and requires the exact target table OID,
  btree access method, nonunique, no expression or predicate, no INCLUDE columns, all sort-option
  bits zero (no DESC or NULLS FIRST), default operator classes and each nonzero collation equal to
  its column's collation. Match the complete column-name list in order. Exclude indexes already
  attached as partition children. Return both valid and invalid candidates ordered valid first and
  then index relname; B718 decides which valid candidate to rename and warns about all remaining copies.
  A partial index with the same columns is not equivalent, nor is a unique index or reversed column order.

  Child discovery reads immediate table children from pg_inherits, including each child's namespace
  and partitioned flag. Exclude any child table that already has an index attached to the specified
  parent index; it checks attachment/table identity, not a newly calculated name. Order by child relname.
  A partitioned child remains a child record for B718's recursive builder, not a flat list of leaves.
  All catalog queries propagate database errors to their caller without warnings or mutation.

  Use B860 real Postgres fixtures via POSTGRES_TEST_URL or testcontainers to establish each equivalence
  inclusion/exclusion independently, including quoted namespaces, cross-schema children and an invalid
  concurrently built index. Compare OIDs before/after to prove inspection did not rename or repair.
  Pure helper oracle cases invoke RequestLogIndex.columns and partition_index_name directly; no helper
  adapter executes a catalog query. Extend B856's database namespace and B171's existing HelperCase
  corpus. Inputs here are compiled definitions and typed database identifiers, with no new byte parser.

  The moved ranges contain about 115 nonblank noncomment lines, including static SQL and docstrings.
  Allow 150 native types/query code, 250 catalog/naming tests, 65 helper adapters and 30 wiring lines,
  495 within 550. Separate definitions/naming from catalog queries to keep source files under 300 lines.
