id: B1205
title: Team update budget reset and object permission preparation
description: >-
  Supply the field preparation called by B806 update_team. A non-null budget_duration calls B2317
  get_budget_reset_time and sets budget_reset_at. An explicit null in updated_kv clears budget_reset_at;
  absence leaves it untouched. Nonempty budget_limits initialize each dictionary or typed window with
  an ISO reset_at and serialize the array to JSON; None and [] do not synthesize windows.

  Delegate object permissions to B816 handle_update_object_permission_common using the stored
  object_permission_id and live database client. Add object_permission_id to the returned data only
  when that helper returns one, preserving every other input field. Propagate its failures, including
  any prior writes; this preparation does not wrap a transaction or map an HTTP error.
  B2370 owns PATCH /team/{team_id}, which depends on the actual B806 executor. Keeping these two
  small helpers below B806 removes the former reverse callback dependency.


  Build the production team_patch module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  _set_budget_reset_at (L2645-L2663; 16 source lines), handle_update_object_permission
  (L2666-L2687; 16 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Test the mutation of typed update fields beside team_patch. Object-permission persistence tests use
  POSTGRES_TEST_URL supplied by CI, otherwise testcontainers, and verify new-row, existing-row and
  failed-write effects through B816. Pure budget-window projections have MIT helper oracle cases under
  Management::teams; B171 owns the helper-case decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 32 nonblank, noncomment source lines; allow 65 production, 180 behavior/Postgres tests,
  70 helper adapters and 35 wiring lines, 350 changed lines within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  This task registers no route; the team update handler consumes these functions directly.
scope:
  paths:
    - crates/betterlite-server/src/team_patch.rs
    - crates/betterlite-server/src/team_patch/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/src/helpers/server/team_patch.rs
    - tools/oracle/src/helpers/server/team_patch/**
    - tools/oracle/helpers/team_patch.py
    - tools/oracle/helpers/team_patch/**
    - tools/oracle/cases/helpers/team-patch/**
    - tools/oracle/fuzz/corpus/helper_case/team-patch-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/team_endpoints.py#L2645-L2663
    why: Own _set_budget_reset_at; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/team_endpoints.py#L2666-L2687
    why: Own handle_update_object_permission; preserve caller-visible values and failure ordering.
dod:
  - text: >-
      budget_duration_absent_preserves_reset, budget_duration_null_clears_reset, duration_uses_reset_clock,
      windows_dictionary_and_model_iso_json, windows_null_and_empty_untouched, permission_created,
      permission_updated, permission_none_preserves_payload and permission_failure_preserves_prior_effects
      exercise the actual preparation and B816 persistence.
    proof:
      - behavior-tests
  - text: MIT reset-window projections agree with Rust and the new helper seed is replayed.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_patch::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The team budget projection adapter must exist and pass strict Python checks.
      run: test -f tools/oracle/helpers/team_patch.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: A newly added budget-window seed must exercise the helper decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/team-patch-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/team-patch/reset-field-presence.yaml
  - tools/oracle/cases/helpers/team-patch/window-reset-json.yaml
