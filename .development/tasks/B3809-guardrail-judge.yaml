id: B3809
title: LLM guardrail judge criteria and decisions
description: >-
  Build weighted judge criteria, prompt construction, recursion suppression and verdict
  conversion. Preserve fail-open judge exceptions, score clamping to [0, 100] with default
  100, and 422 blocks below the configured threshold. Instantiate LLMAsAJudgeGuardrail
  with judge_model, criteria list, overall_threshold and on_failure (block or log) modes.
  Support pre_call, during_call and post_call event hooks, extracting the latest user
  message from structured_messages for request evaluation and texts from the response.
  Score results map to verdicts with criterion name, score, reasoning, passed flag and
  weight; clamp overall_score to [0, 100], defaulting to 100 on invalid parse. Block
  with status 422 when overall_score < overall_threshold and on_failure is block, log-only
  when on_failure is log. Add eval_information to request_data.metadata with eval_name,
  overall_score, passed, judge_model, threshold and verdicts; merge multiple eval results
  as a list. Suppress recursive judge calls via _is_logged_judge_call, checking request
  metadata's INTERNAL_CALL_ORIGIN_METADATA_KEY against LLM_AS_A_JUDGE_GUARDRAIL_CALL_ORIGIN.
  Initialize with weights that sum to 100 (within 0.5 tolerance), validate on_failure is
  block or log, and coerce mode to GuardrailEventHooks. Fail-open on judge call exceptions,
  logging the error and returning inputs unchanged. Converge event_type from _event_type_for
  by detecting which configured hook matches the input_type's lifecycle.

scope:
  paths:
    - crates/betterlite-guardrails/src/judge.rs
    - crates/betterlite-guardrails/src/judge/**
    - crates/betterlite-guardrails/Cargo.toml
