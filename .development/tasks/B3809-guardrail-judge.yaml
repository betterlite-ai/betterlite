dod:
  - text: _is_logged_judge_call returns false unless event_type is logging_only and litellm_params.metadata contains the judge call origin marker.
    proof: [judge-recursion-tests]

  - text: _get_litellm_param returns the value from litellm_params attribute, guardrail dict under the key, or the guardrail dict parsed as an object attribute, or default.
    proof: [judge-config-tests]

  - text: _coerce_event_hook converts a string mode to GuardrailEventHooks, a list of strings to a list of hooks, Mode/hook to itself, or None to post_call default.
    proof: [judge-config-tests]

  - text: _text_under_review returns joined texts from inputs for response evaluation, or the latest user message from structured_messages for request evaluation.
    proof: [judge-text-tests]

  - text: _build_judge_prompt constructs the criteria block listing name, weight and description; conversation block from structured_messages or request_data.messages; and text_under_review labeled as Latest request turn or Assistant response.
    proof: [judge-prompt-tests]

  - text: LLMAsAJudgeGuardrail stores judge_model, criteria, overall_threshold, on_failure and event_hook, calling super().__init__ with guardrail_name and supported_event_hooks.
    proof: [judge-construct-tests]

  - text: get_supported_event_hooks returns the list [pre_call, during_call, post_call] regardless of instance configuration.
    proof: [judge-construct-tests]

  - text: should_run_guardrail returns false for recursive judge calls (logging_only events from the judge itself), delegating to super for other cases.
    proof: [judge-recursion-tests]

  - text: _run_judge calls the judge completion with response_format json_object and temperature 0, extracts content from the response, and parses the JSON verdict dict.
    proof: [judge-call-tests]

  - text: apply_guardrail fails open when judge call raises any exception, logging a warning and returning inputs unchanged.
    proof: [judge-call-tests, judge-oracle]

  - text: apply_guardrail handles a missing overall_score key by defaulting to 100, clamping to [0, 100], and continuing normally to write eval_information and check the threshold.
    proof: [judge-verdict-tests]

  - text: apply_guardrail handles a present non-numeric overall_score value by catching the exception and returning inputs immediately without writing eval_information.
    proof: [judge-verdict-tests]

  - text: apply_guardrail computes passed as overall_score >= overall_threshold and adds eval_information to request_data.metadata.
    proof: [judge-verdict-tests]

  - text: apply_guardrail merges multiple eval_information by appending to a list, starting a new list on the second entry.
    proof: [judge-verdict-tests]

  - text: apply_guardrail raises HTTPException with status 422 when passed is false and on_failure is block, including overall_score, threshold and verdicts in the detail.
    proof: [judge-block-tests, judge-oracle]

  - text: apply_guardrail logs eval_information and returns inputs unchanged when on_failure is log, regardless of passed.
    proof: [judge-log-tests]

  - text: _event_type_for returns the first configured hook matching input_type's lifecycle (pre_call/during_call/logging_only for request, post_call/logging_only for response), or None if none or multiple match.
    proof: [judge-event-type-tests]

  - text: initialize_guardrail validates guardrail_name, judge_model, criteria list, weight sum (100 ± 0.5), on_failure (block or log), constructs instance and registers with add_litellm_callback.
    proof: [judge-initialize-tests]

