deviations:
  - what: Judge calls include metadata with INTERNAL_CALL_ORIGIN_METADATA_KEY to suppress recursion at the logging_only hook level.
    why: Rust constructor directly injects marker rather than inspecting call stack.
  - what: Score clamping uses min(100.0, max(0.0, score)) to produce a valid range, with default 100 for invalid JSON parse.
    why: "Matches LiteLLM behavior: clamp before checking threshold, default open on parse failure."
  - what: Eval information merges as a list when multiple judges run; individual entry is not wrapped in a list.
    why: "Matches LiteLLM logic: first entry is scalar, second and later entries append to a list."

pitfalls:
  - "Criterion weights must sum to 100 within 0.5 tolerance; a weight total of 99.5 or 100.5 is valid, but 99.4 or 100.6 is rejected during initialize_guardrail."
  - "_coerce_event_hook(None) returns post_call, not a list; check that event hook matching in constructor allows both single hooks and lists."
  - "_is_logged_judge_call only suppresses logging_only event hooks; pre_call, during_call and post_call hooks are not affected even if they are recursive."
  - "_text_under_review calls get_last_user_message only for request evaluation; response evaluation joins the texts array directly without traversing messages."
  - "apply_guardrail defaults overall_score to 100 when the key is missing from the verdict dict, allowing normal eval_information write and threshold check; a non-numeric overall_score value causes an immediate return without eval_information."

budget:
  max_changed_lines: 1000
  max_new_expects: 0

review_level: standard
