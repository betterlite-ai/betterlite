id: B172
title: Outbound TLS configuration and HTTP defaults
description: >-
  Build TlsPolicy under betterlite-config/src/tls.rs and apply it under betterlite-http/src/tls.rs. Resolve litellm_settings.ssl_verify,
  ssl_certificate, http2, ssl_ecdh_curve and ssl_security_level and SSL_VERIFY, SSL_CERT_FILE, SSL_CERTIFICATE,
  LITELLM_HTTP2, SSL_ECDH_CURVE, SSL_SECURITY_LEVEL and LITELLM_USER_AGENT through injected config. Support per-deployment
  litellm_params.ssl_verify with argument-over-environment precedence. Match default aiohttp behavior: SSL_CERTIFICATE/ssl_certificate
  is accepted but no client identity is sent, because HTTPX ignores cert= with the supplied transport; do not invent
  functioning mTLS here. Parse bounded CA PEM using rustls; verification disabling is explicit. Map X25519, prime256v1
  and secp384r1 to rustls key-exchange groups in a preconfigured ClientConfig; an invalid name warns and uses defaults,
  while a recognized curve absent from the selected crypto provider fails startup by name. SSL_SECURITY_LEVEL is
  an OpenSSL cipher-list expression, not a scalar security level, and remains a named startup error. Set the default
  User-Agent to betterlite/<package-version> and honor LITELLM_USER_AGENT. HTTP/2 selects protocol capability, not
  a second transport. Compose B208 proxy policy, and prove with a local http:// proxy and a local TLS origin that an HTTPS request opens a CONNECT tunnel carrying Proxy-Authorization and then verifies the origin certificate; B208 only proves plain HTTP forwarding. Add tls_policy helper adapters to get_ssl_verify/http2_enabled/get_default_headers
  and bounded PEM fuzz target http_policy.  Write the behavior rstest functions http_policy_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. Register helper operations tls_policy in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed. Budget 280 TLS policy, 100 adapters,
  250 tests and 140 config/replay wiring (770 total).
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-config/**
  - crates/betterlite-http/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/http/tls_policy.rs
  - tools/oracle/src/helpers/http/tls_policy/**
  - tools/oracle/helpers/tls_policy.py
  - tools/oracle/helpers/tls_policy/**
  - tools/oracle/cases/helpers/tls-policy/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L78-L93
  why: HTTP/2 and environment proxy selection.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L282-L433
  why: TLS verification precedence, certificate paths and OpenSSL-only knobs.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L651-L699
  why: Client certificate and TLS policy application.
- url: https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html
  why: Existing client support for roots, identity, proxies and HTTP/2.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L140-L155
  why: User-Agent default and override.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_litellm_params.py#L177-L240
  why: Per-deployment ssl_verify.
dod:
- text: >-
    Verification precedence, HTTP/2 and User-Agent overrides match the listed helper cases; the default betterlite
    User-Agent is tested locally as a documented deviation.
  proof:
  - oracle
  - http-policy-tests
  - helper-python
- text: >-
    Local TLS tests accept trusted CA, reject untrusted or wrong-host certificates, honor verification disabling
    and demonstrate that ssl_certificate does not activate mTLS on the default path. An HTTPS request through a
    local proxy opens a CONNECT tunnel with Proxy-Authorization before TLS.
  proof:
  - http-policy-tests
- text: >-
    Curve mapping and invalid-name warning fallback work; unsupported recognized groups and cipher expressions fail
    by key; unreadable or malformed CA files fail without leaking contents.
  proof:
  - http-policy-tests
- text: >-
    Every newly supported setting and tls_policy operation has a new corpus seed; PEM decoding is fuzzed and replays
    production parsing.
  proof:
  - config-yaml-corpus
  - helper-case-corpus
  - http-policy-corpus
checks:
  optional:
  - mutants
  commands:
  - id: http-policy-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-config -p betterlite-http --no-tests=fail -E 'test(/::http_policy_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'ssl_verify' crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq 'ssl_certificate'
      crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq 'http2' crates/betterlite-config/fuzz/corpus/config_yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'tls_policy' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: http-policy-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-http/fuzz/corpus/http_policy)"
      && test -f crates/betterlite-http/fuzz/fuzz_targets/http_policy.rs && test -n "$(ls -A crates/betterlite-http/fuzz/corpus/http_policy)"
      && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(replays_the_http_policy_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/tls-policy/defaults.yaml
- tools/oracle/cases/helpers/tls-policy/argument-over-environment.yaml
- tools/oracle/cases/helpers/tls-policy/false-string.yaml
- tools/oracle/cases/helpers/tls-policy/ca-file.yaml
- tools/oracle/cases/helpers/tls-policy/cert-file-override.yaml
- tools/oracle/cases/helpers/tls-policy/http2-environment.yaml
- tools/oracle/cases/helpers/tls-policy/per-deployment-verify.yaml
- tools/oracle/cases/helpers/tls-policy/user-agent-override.yaml
- tools/oracle/cases/helpers/tls-policy/invalid-curve-warning.yaml
- tools/oracle/cases/helpers/tls-policy/certificate-default-path.yaml
deviations:
- what: SSL_SECURITY_LEVEL fails startup by name.
  why: >-
    OpenSSL cipher-list expressions have no equivalent rustls parser; pretending to honor them could silently weaken
    policy.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L296-L304
- what: >-
    A valid curve unsupported by the chosen rustls crypto provider fails startup; invalid names warn and retain
    defaults.
  why: A recognized explicit policy cannot be honored by that provider; invalid-name fallback matches LiteLLM.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L306-L326
- what: The default User-Agent is betterlite/<package-version>.
  why: The binary identifies itself; LITELLM_USER_AGENT remains an exact override.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L140-L155
out_of_scope:
- Proxy discovery, credentials and bypass are B208; pooling is B173.
- >-
  Working client-certificate authentication on non-default HTTPX proxy mounts is not implemented; the default path
  ignores cert=, as the pinned implementation does.
pitfalls:
- 'The oracle helper for this task is pre-registered as tls_policy in the http group. Replace the stub Op in tools/oracle/src/helpers/http/tls_policy.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/tls_policy.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The host process may already have proxy variables, so tests must supply an isolated environment map.
- Never put proxy credentials or certificate bytes into a printable pool key.
- Use test certificate fixtures and local ports; public TLS endpoints make the gate nondeterministic.
- HTTPX ignores cert= when transport= is supplied; a client-certificate option alone does not prove mTLS.
- An invalid ECDH name warns; do not turn that fallback into a startup failure.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
