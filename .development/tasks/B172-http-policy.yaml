id: B172
title: Outbound TLS and proxy configuration
description: >-
  Extend betterlite-config with resolved outbound HTTP policy and apply it in betterlite-http's existing client
  factory. Parse ssl_verify, ssl_certificate and http2 from supported LiteLLM settings and resolve SSL_VERIFY, SSL_CERT_FILE,
  SSL_CERTIFICATE, LITELLM_HTTP2, LITELLM_USER_AGENT, HTTP_PROXY, HTTPS_PROXY, ALL_PROXY and NO_PROXY through the
  injected environment lookup. Treat proxy authentication and client private keys as secrets; read bounded PEM files
  during startup and pass material into the client constructor. Support boolean verification and operator-supplied
  CA paths, explicit verification disabling, mTLS, HTTP/2 negotiation and per-destination proxy bypass using reqwest/rustls
  rather than a second transport stack. Disable reqwest's implicit environment discovery after computing the policy.
  Add helper tls_policy cases using virtual environment/path inputs and a Python adapter around get_ssl_verify/http2_enabled,
  plus local TLS and forwarding-proxy tests for actual transport behavior. Extend B002's existing config corpus
  instead of introducing another YAML parser. Budget 300 policy/config lines, 180 factory lines and 280 tests.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-config/**
  - crates/betterlite-http/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/tls-policy/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L78-L93
  why: HTTP/2 and environment proxy selection.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L282-L433
  why: TLS verification precedence, certificate paths and OpenSSL-only knobs.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L651-L699
  why: Client certificate and TLS policy application.
- url: https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html
  why: Existing client support for roots, identity, proxies and HTTP/2.
dod:
- text: The listed policy cases match pinned helper outputs without reading the host environment.
  proof:
  - oracle
- text: >-
    A trusted local certificate succeeds, untrusted and wrong-host certificates fail, explicit verification disabling
    succeeds, and mTLS requires the configured identity.
  proof:
  - http-policy-tests
- text: >-
    Authenticated HTTP/HTTPS proxies and NO_PROXY are exercised with local servers, while request and error Debug
    output contain no proxy password or private key.
  proof:
  - http-policy-tests
- text: Unsupported OpenSSL-only settings and unreadable or malformed PEM files fail startup with key paths and
    no secret material.
  proof:
  - http-policy-tests
- text: The existing config fuzz corpus covers every added setting.
  proof:
  - config-yaml-corpus
checks:
  optional:
  - mutants
  commands:
  - id: http-policy-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-config -p betterlite-http --no-tests=fail -E 'test(/http_policy|tls|proxy/)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/tls-policy/defaults.yaml
- tools/oracle/cases/helpers/tls-policy/argument-over-environment.yaml
- tools/oracle/cases/helpers/tls-policy/false-string.yaml
- tools/oracle/cases/helpers/tls-policy/ca-file.yaml
- tools/oracle/cases/helpers/tls-policy/cert-file-override.yaml
- tools/oracle/cases/helpers/tls-policy/http2-environment.yaml
deviations:
- what: SSL_SECURITY_LEVEL and SSL_ECDH_CURVE are rejected by name when set.
  why: They are OpenSSL configuration languages with no equivalent rustls contract; silently ignoring them violates
    the config rule.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L282-L328
out_of_scope:
- Client pooling and response lifetime are B173.
- No request field can change transport policy or resolve a process environment variable.
pitfalls:
- The host process may already have proxy variables, so tests must supply an isolated environment map.
- Never put proxy credentials or certificate bytes into a printable pool key.
- Use test certificate fixtures and local ports; public TLS endpoints make the gate nondeterministic.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
