id: B853
title: Offline spend-log partition conversion
description: >-
  Implement B1232 offline partition-spend-logs and unpartition-spend-logs operations with B700's primary
  database connection. Own both complete executable SQL scripts. Each operation has its own explicit
  BEGIN/COMMIT transaction; rollback all table/index/data changes on any SQL error. They are manual
  commands, not startup migrations or B070's periodic retention work. Preserve B701 column/default
  types; do not rebuild tables from an independently invented schema.

  Partitioning renames LiteLLM_SpendLogs to LiteLLM_SpendLogs_legacy, then moves existing indexes
  LiteLLM_SpendLogs_pkey, _startTime_idx, _startTime_request_id_idx, _end_user_idx, _session_id_idx
  and _api_key_startTime_idx to the corresponding LiteLLM_SpendLogs_legacy_* names using IF EXISTS.
  Create the new canonical table LIKE legacy INCLUDING DEFAULTS INCLUDING GENERATED, partitioned by
  RANGE(startTime), with primary key(request_id,startTime). Recreate those five non-PK canonical
  indexes on startTime; (startTime,request_id); end_user; session_id; (api_key,startTime), respectively,
  using IF NOT EXISTS. Create LiteLLM_SpendLogs_pdefault as the DEFAULT partition with IF NOT EXISTS,
  then commit. New rows without an explicit range land there. No day/month partitions are created.
  Critically, no old rows are copied and the legacy table is not dropped: the commented backfill/drop
  examples are NOT executable steps. A populated input leaves populated legacy and an empty new table.

  Unpartitioning renames the canonical table to LiteLLM_SpendLogs_partitioned and similarly renames
  the six indexes, plus legacy alternate LiteLLM_SpendLogs_pkey1, to _partitioned_* names. Create a
  plain LIKE table including defaults/generated columns, restore primary key(request_id) and the
  same five non-PK indexes, copy SELECT * from the partitioned parent with ON CONFLICT(request_id)
  DO NOTHING, drop the old partitioned parent (and its partitions), then commit. Duplicate request_id
  values at distinct startTime values collapse to one arbitrary scan-order survivor: no timestamp
  ordering or newest-row guarantee exists. Test survivor membership, not an invented selection rule.

  IF EXISTS only covers index renames, and IF NOT EXISTS only index/default-partition creation; neither
  command is idempotent as a whole. Existing legacy/partitioned destination table or rename-target
  collisions fail and roll back. Assert index ownership/catalog definitions, not only names, because
  same-name indexes on the retained old table can otherwise hide missing new indexes. LIKE does not
  copy indexes; recreated parent indexes propagate to future partitions. Command help preserves the
  source guidance: enable use_spend_logs_partitioning and retention separately after conversion,
  keep SPEND_LOG_PARTITION_INTERVAL consistent with later partition creation, and disable partitioning
  for rollback. No config value is read or written by these SQL operations; those settings belong B070.


  Build the production spend_partitions module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Also write tools/betterlite-db-admin::spend_partitions::tests::dispatches_native_operation and rejects_bad_arguments;
  the admin command check must fail without these real CLI dispatch tests.


  B860 initializes separate schemas for the pinned scripts and native operations. Use the supplied
  POSTGRES_TEST_URL or, only when absent, testcontainers; never skip connection failures. Query actual
  partition/index catalogs and retained rows, and clean schemas after success or rollback tests.


  Partition SQL has 32 and unpartition SQL 36 nonblank noncomment lines. Allow 120 SQL/service,
  270 Postgres tests and 65 CLI/wiring lines, 455 within 525. Reuse B1232 argv decoding.


  Register partition and unpartition commands in B1232's existing database-admin dispatcher, invoking
  these native DB operations without introducing a server dependency or a second command package.
scope:
  paths:
    - crates/betterlite-db/src/spend_partitions.rs
    - crates/betterlite-db/src/spend_partitions/**
    - crates/betterlite-db/Cargo.toml
    - Cargo.toml
    - tools/betterlite-db-admin/Cargo.toml
    - tools/betterlite-db-admin/src/main.rs
    - tools/betterlite-db-admin/src/commands.rs
    - tools/betterlite-db-admin/src/spend_partitions.rs
    - tools/betterlite-db-admin/src/spend_partitions/**
    - crates/betterlite-db/src/spend_partitions/fixtures.rs
    - crates/betterlite-db/src/spend_partitions/fixtures/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/db_scripts/partition_spend_logs.sql#L1-L109
    why: Pinned implementation and exact ownership boundary for spend_partitions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/db_scripts/unpartition_spend_logs.sql#L1-L74
    why: Pinned implementation and exact ownership boundary for spend_partitions.
dod:
  - text: 'Named Postgres cases partition_retains_legacy_without_copy, defaults_generated_columns,
      canonical_index_definitions, missing_old_indexes, default_partition_accepts_rows,
      same_id_distinct_start_time, rollback_restores_single_key, alternate_pkey1_rename,
      duplicate_survivor_is_unspecified, drop_removes_children, destination_collision_rollback and
      mid_copy_failure_rollback verify every DDL step and its transaction boundary.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Implement the owned behavior and ordered failure effects; named tests: partition_populated_table,
      legacy_index_renames, composite_primary_key, unpartition_deduplication, failure_rolls_back, startup_no_conversion,
      postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The offline admin command invokes the native operation and preserves its exit/error contract.
    proof:
      - admin-tests
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^spend_partitions::tests::/)
        - test(/replays_the_/)'
    - id: admin-tests
      why: The offline command does not dispatch the named native operation or reject bad arguments.
      run: cargo nextest run --locked -p betterlite-db-admin --no-tests=fail -E 'test(/^spend_partitions::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/spend_partitions::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/spend_partitions::tests::postgres_failure_effects$/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B070 owns retention, future partition creation and partition-related config loading; B1232 owns CLI parsing/outcome reporting.
  - The commented manual legacy backfill/drop examples have no executable caller at the pin and are not automatically performed.
pitfalls:
  - Partitioning a populated table creates an empty new table; copying legacy rows is a separate optional operator action.
  - ON CONFLICT(request_id) DO NOTHING does not choose the newest duplicate during unpartitioning.
  - The pkey1 rename exists only in the unpartition script; adding it to partitioning changes collision behavior.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
