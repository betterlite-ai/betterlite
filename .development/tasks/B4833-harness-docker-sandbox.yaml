dod:
  - text: Construction rejects an empty image and a relative workdir with LiteLLM's messages, normalizes the workdir and mount host paths, and collapses duplicate host paths.
    proof: [docker-sandbox-tests]
  - text: run_args, exec_args and container_path produce exactly LiteLLM's argument lists and paths, including the name, mount and env flags, the empty-cwd fallback and the leading double slash rule.
    proof: [docker-sandbox-tests]
  - text: start launches one container for concurrent callers, returns the trimmed id, fails on nonzero exit or blank output with LiteLLM's messages, and refuses after close.
    proof: [docker-sandbox-tests]
  - text: exec rejects an empty command and registers the process, and run returns decoded stdout, stderr and the exit code without treating a nonzero code as an error.
    proof: [docker-sandbox-tests]
  - text: run on timeout and over-cap output returns a typed error and kills the docker client, and the handle leaves the registry.
    proof: [docker-sandbox-tests]
  - text: read, write, which and tempdir use the exact container commands and error texts, and read enforces the byte cap.
    proof: [docker-sandbox-tests]
  - text: snapshot builds the find script from the sorted skip list and the file size limit, and parse_sha256sum strips "./" and ignores short lines.
    proof: [docker-sandbox-tests]
  - text: close kills live processes, removes the container once, ignores a nonzero docker rm exit and is idempotent; the docker client dies with its owner.
    proof: [docker-sandbox-tests]
  - text: A missing docker program gives the install hint message, and host_url and is_container match LiteLLM.
    proof: [docker-sandbox-tests]
  - text: The sha256sum parser has a fuzz target with a replayed corpus.
    proof: [docker-sha256sum-corpus]

checks:
  optional: []
  commands:
    - id: docker-sandbox-tests
      why: the Docker sandbox behavior tests are missing or fail
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^sandbox::docker::/) - test(replays_the_docker_sha256sum_corpus)'
    - id: docker-sha256sum-corpus
      why: the fuzz target or its fresh corpus is missing, or replay fails
      run: >-
        test -f crates/betterlite-harness/fuzz/fuzz_targets/docker_sha256sum.rs &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-harness/fuzz/corpus/docker_sha256sum)" &&
        cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(replays_the_docker_sha256sum_corpus)'

oracle_cases: []

deviations:
  - what: run takes a required Duration timeout and a byte cap, and read takes a byte cap, because the Rust Sandbox trait already requires them.
    why: LiteLLM's timeout is optional and its output is unbounded; the bounded-inputs rule needs a cap, and callers in the harness crates pass explicit values.
  - what: The docker client is started in its own process group and killed on drop.
    why: The processes-die-with-owner rule; LiteLLM leaves the client to the event loop.
  - what: The constructor can take a docker program path.
    why: Tests need a fake docker without changing the process environment; with no path the PATH lookup is LiteLLM's.

out_of_scope:
  - The `timeout` argument of the private docker call (_docker). No caller at the pin passes it, so there is no "docker <verb> timed out" error.
  - DockerSandbox.__repr__. No caller at the pin.
  - The docker() factory function and the re-exports in litellm/harness/sandbox/__init__.py and litellm/sandbox/__init__.py. They are Python package glue with no Rust code, so they are not built; the factory is DockerSandbox::new.
  - __aenter__ and __aexit__ as Python protocol methods. The Rust equivalents are the public start and close.
  - Stopping the program that a container command started when its docker client is killed. LiteLLM does not do it either.

pitfalls:
  - Killing the local `docker exec` client does not stop the command inside the container, so a timed-out run can leave work running until close removes the container with `rm -f`.
  - >-
    `docker run` prints the container id on stdout with a trailing newline, and an empty id after exit 0 is an error ("docker run returned no container id").
  - >-
    `--rm` plus `sleep infinity` means the container dies when `docker rm -f` runs or the daemon stops, so a later exec on a dead id returns a nonzero exit with the daemon's message on stderr.
  - exec_args uses `cwd or workdir`, so an empty cwd string means the workdir, not the root.
  - >-
    posixpath.normpath keeps exactly two leading slashes ("//a" stays "//a") and turns "" into "."; three or more leading slashes collapse to one.
  - >-
    `find -size -N c` means smaller than N bytes, so the script uses MAX_FILE_BYTES + 1 to keep files of exactly 50 MiB, and `-type f` leaves symlinks out.
  - >-
    `sha256sum` output for names that contain newlines or backslashes is escaped by the tool; parse lines as given and do not unescape them.
  - The sh one-liners get the path as "$1" after a literal `sh` argument; never put the path inside the script text.
  - which uses `sh -lc`, a login shell, so it sees the PATH the profile files set up, not the container's plain PATH.
  - close does not wait for a start in flight, so a start that finishes after close can leave a container behind; keep LiteLLM's order and do not add a hidden fix.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
