id: B082
title: Image routes
description: >-
  Finish image generation/edit route aliases with B052 auth, typed JSON or multipart extraction, B014 operation
  variants and provider dispatch. Preserve duplicate image fields and source form conversion; compare outbound multipart
  fields with B900 and x-litellm-* response headers with B001.


  Register generation/edit under /v1/images/..., /images/... and /openai/deployments/{model:path}/images/... (six
  total paths), with one HTTP case per alias. Reject a URL-valued deployment model via B1102. No variations route
  exists at this pin. Supplying image and image[] together (or mask and mask[]) is FastAPI 422 detail; a string
  image is also 422. Edit prompt defaults to None. Generation copies prompt to messages for guardrails and then
  copies it back.


  Implement crates/betterlite-server/src/api/image_routes.rs, crates/betterlite-core/src/api/image_routes.rs. Use
  ImageRoutesInput and ImageRoutesResult with typed nested records; inject only the clock, repositories, transports
  and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient
  environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/images/generations; POST /images/generations; POST /openai/deployments/{model:path}/images/generations;
  POST /v1/images/edits; POST /images/edits; POST /openai/deployments/{model:path}/images/edits. Each alias is exercised
  through the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without
  re-registering their methods/paths.


  Route input projections: request.headers.x-litellm-call-id (absent None); data.prompt (absent None); data.messages
  (absent None); data.model (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:266 status_code=422, exception_detail=FastAPI detail string; endpoints.py:268
  status_code=422, exception_detail=FastAPI detail string; endpoints.py:314 status_code=422, exception_detail=FastAPI
  detail string; endpoints.py:207 type=openai_error_type(e, error_status_code(e, status.HTTP_400_BAD_REQUEST)),
  param=openai_error_param(e), code=error_status_code(e, status.HTTP_400_BAD_REQUEST); endpoints.py:216 type=openai_error_type(e,
  error_status_code(e, 500)), param=openai_error_param(e), openai_code=getattr(e, 'code', None), code=error_status_code(e,
  500). Compare the actual source status, error type, param and code; ignore only error wording except in message-extraction
  tests.


  Write adjacent tests.rs behavior functions images_generations_route, images_edits_route, image_array_form_fields,
  missing_prompt_or_image, provider_error_envelope, generation_deployment_alias, generation_short_alias, edit_deployment_alias,
  edit_short_alias, image_and_array_422, mask_and_array_422, string_image_422, edit_prompt_omitted, generation_guardrail_prompt,
  route_aliases, auth_missing, auth_invalid under api::image_routes::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  The production external-byte decoder is betterlite-server::api::image_routes::decode_image_routes(bytes: &[u8],
  limits: &ApiLimits), for orjson.loads input body at litellm/proxy/image_endpoints/endpoints.py:107. Place its
  implementation in crates/betterlite-server/src/api/image_routes.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-server/fuzz/fuzz_targets/image_routes.rs passes arbitrary bounded bytes to that exact
  decoder; api::image_routes::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/image_endpoints/endpoints.py: uploadfile_to_bytesio (L45-L53); litellm/proxy/image_endpoints/endpoints.py:
  batch_to_bytesio (L56-L64); litellm/proxy/image_endpoints/endpoints.py: image_generation (L85-L223); litellm/proxy/image_endpoints/endpoints.py:
  image_edit_api (L242-L353). Abstract/protocol declarations map to native types and synchronous/async wrappers
  share one implementation; a partial function span is the explicit preparation/transition stage described above,
  with typed values passed to the following stage.


  Sizing: 278 owned nonblank/non-comment/non-docstring Python lines (297 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 298 implementation,
  142 behavior tests, 204 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds
  and 38 wiring; 742 total within the 750-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B900 (Multipart oracle), B998 (Image generation call), B999 (Image
  edit call), B1000 (Image variations), B1087 (Api boundaries), B001 (Oracle harness against the pinned LiteLLM),
  B1100 (Shared request body decoding), B1101 (Shared multipart and form extraction), B1102 (Request model and destination
  policy), B1103 (Authenticated request preparation), B732 (Typed authentication principals and grant resolution),
  B855 (Authenticated request admission and budget handoff), B756 (Authentication header selection and mode dispatch),
  B003 (HTTP server, health routes and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management
  oracle namespaces and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
