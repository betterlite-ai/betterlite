id: B082
title: Image generation and edit HTTP routes
description: >-
  Register POST /v1/images/generations,/images/generations,/openai/deployments/{model:path}/images/generations
  and POST /v1/images/edits,/images/edits,/openai/deployments/{model:path}/images/edits exactly once in
  betterlite-server::api::image_routes. Own every function in image_endpoints/endpoints.py, including the
  UploadFile-to-named-buffer helpers; the two package initializers add no executable behavior. No variation
  route exists. Use B756 authentication, B124 proxy hooks, B1103 authenticated request enrichment, B1102 model
  precedence/destination checks, B014 routing, B1121/B999 SDK calls and B004 common request/error processing.

  Generation creates a call id from x-litellm-call-id before its try; parsed JSON is merged with that id so a
  body litellm_call_id cannot override it. Enrich before resolving model, reject URL-valued path models, then
  apply litellm.model_alias_map after model precedence. A non-None prompt becomes one user message for the
  pre-call hook, call_type=image_generation. If the resulting messages value is a nonempty list, B218's
  get_str_from_messages supplies prompt; always remove messages before route_type=aimage_generation.
  Await dispatch, schedule status=success through an owned task tracker, then run post-call-success and custom
  response-header hooks. Later callback headers overwrite custom headers. Failure invokes failure-hook then
  log_llm_api_exception and wraps HTTPException/non-HTTPException through B1103's error payload helpers.

  Edit accepts repeated image,image[],mask,mask[] uploads, rejects mixed spellings before processing, and uses
  B1100/B1101 body decoding and numeric coercion. Strip bracketed file keys, then replace nonempty file lists
  with named byte buffers preserving upload order and filename. Plain string image or mask is rejected before
  the common processor. Absent image and prompt are allowed at this route; missing prompt is set to None.
  B004 base_process_llm_request receives route_type=aimage_edit and the existing user_* settings; it owns
  their defaults, header policy and exception handling. Shared config loaders own image_generation_model,
  completion_model,user_model and model_alias_map; route tests verify their loaded values reach these calls.

  decode_image_routes(bytes,limits) parses generation JSON as an object at the actual server boundary. Fuzz it
  with bounded bytes and replay newly added malformed/nonobject/UTF-8 seeds. Edit's multipart decoder remains
  B1101's. Every parity fixture boots both gateways with master_key=sk-test and mock provider credentials;
  multipart uses B900 capture, never a direct FastAPI helper adapter. Count 261 nonblank/non-comment lines;
  budget 250 implementation, 180 tests, 210 HTTP fixtures, 65 fuzz/replay and 45 wiring lines, total 750.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/image_routes.rs
  - crates/betterlite-server/src/api/image_routes/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/error.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/image_routes.rs
  - crates/betterlite-core/src/api/image_routes/**
  - crates/betterlite-core/src/operation.rs
  - crates/betterlite-core/src/dispatch.rs
  - crates/betterlite-server/fuzz/Cargo.toml
  - crates/betterlite-server/fuzz/fuzz_targets/image_routes.rs
  - crates/betterlite-server/fuzz/corpus/image_routes/**
  - tools/oracle/cases/api/image-routes/**
  - tools/oracle/fixtures/image-routes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/image_endpoints/endpoints.py#L39-L353
  why: Own upload conversion and both complete handlers, with decorators naming all six paths.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/http_parsing_utils.py#L32-L63
  why: B1102 defines different generation/edit model precedence; this route must use the right kind.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L4325-L4373
  why: ProxyException emits a string status code and nullable param, not its separately stored openai_code.
dod:
- text: >-
    image_route_aliases sends prompt=cat,model=image-model and valid Bearer sk-test to each generation path,
    including deployment path openai/dall-e-2; all return 200 {created:1,data:[{b64_json:YQ==}]} from one mock
    generation call. Each edit alias receives a.png=abc,prompt=change,model=image-model and returns that same
    mock shape after one multipart provider call. Deployment paths accept slash-bearing model names. GET on
    these POST-only paths yields 405; /v1/images/variations remains 404. No duplicate registration is permitted.
  proof: [route-tests, oracle]
- text: >-
    image_generation_hooks sends prompt=old and a header call id=call_image with body litellm_call_id=forged.
    Pre-call sees messages=[{role:user,content:old}] and call_image; a hook replacing content with new produces
    upstream prompt=new and no messages. Absent/null prompt creates no synthetic message. Hook messages=[] or
    a nonlist leaves the original prompt, then removes messages. Post-success mutation reaches the client;
    callback header x-test=callback overwrites x-test=custom. A failed post-success hook enters failure processing
    after status=success was scheduled, preserving the source effect order.
  proof: [route-tests, oracle]
- text: >-
    image_model_precedence loads user_model=cli,path=path,image_generation_model=config,body=body: generation
    chooses cli, then path with cli unset, then config, then body. An alias maps the selected name after this
    choice. Edit uses B1102's completion_model first, then cli,path,image_generation_model,body. Each selected
    mock deployment sees its expected model. A URL-valued path is rejected by B1102 before provider traffic.
  proof: [route-tests, oracle]
- text: >-
    image_edit_form sends image[]=a.png:abc then b.png:def,mask[]=m.png:ghi,n="2" and no prompt. B004 receives
    ordered named buffers, n=2,prompt=None and no image[]/mask[] keys. Empty upload lists become None; single
    uploads preserve their filename and bytes. A form without any image reaches the configured model's validation
    rather than an invented route-level 422. B1120/B512 own provider MIME and first-mask selection.
  proof: [route-tests, oracle]
- text: >-
    edit_upload_rejections supplies both image and image[]: HTTP 422 {detail:"Cannot specify both 'image' and
    'image[]'"}. Both mask spellings yield 422 {detail:"Cannot specify both 'mask' and 'mask[]'"}. Plain string
    image or mask yields 422 with detail="'<field>' must be provided as a multipart file upload, not a string."
    All produce zero upstream requests and no OpenAI error object. Test image collision before mask collision
    when both occur. FastAPI's upload validation owns strings supplied to declared upload fields.
  proof: [route-tests, oracle]
- text: >-
    image_error_envelopes sends malformed generation JSON and a JSON array: expect HTTP 500,error.type=
    internal_server_error,param=null,code="500",plus x-litellm-call-id. Inject an HTTPException(403) from the
    hook: expect 403,permission_error,null,"403"; a regular exception without status gives the 500 tuple.
    A provider failure carrying status=429,type=rate_limit_error,param=null,code=provider_limit yields
    429,rate_limit_error,null,"429", never provider_limit. Ignore only /error/message for wording, recording
    the source message in the fixture. Failure-hook effects precede exception logging.
  proof: [route-tests, oracle]
- text: >-
    image_auth_failures keeps valid image requests and master_key=sk-test but omits auth, then sends
    Authorization="Bearer sk-wrong" on every alias. B756 returns HTTP 401,error.type=auth_error,param="None",
    code="401",zero provider calls. Valid auth reaches the mock. These tests do not disable authentication.
  proof: [route-tests, oracle]
- text: Generation's production decoder replays malformed/nonobject JSON seeds, and the branch adds all image HTTP scenarios.
  proof: [parser-corpus, new-cases, oracle]
checks:
  optional: []
  commands:
  - id: route-tests
    why: All six routes, hook order and upload rejection branches need behavior tests in both scoped crates.
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::image_routes::/) - test(/::replays_corpus$/)'
  - id: parser-corpus
    why: Generation JSON is a public byte boundary and requires a real decoder fuzz/replay target.
    run: test -f crates/betterlite-server/fuzz/fuzz_targets/image_routes.rs && grep -qF decode_image_routes crates/betterlite-server/fuzz/fuzz_targets/image_routes.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/image_routes)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::image_routes::tests::replays_corpus$/)'
  - id: new-cases
    why: Route coverage must come from newly added HTTP cases through both proxies.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/image-routes)"
oracle_cases:
- tools/oracle/cases/api/image-routes/image-route-aliases.yaml
- tools/oracle/cases/api/image-routes/image-generation-hooks.yaml
- tools/oracle/cases/api/image-routes/image-model-precedence.yaml
- tools/oracle/cases/api/image-routes/image-edit-form.yaml
- tools/oracle/cases/api/image-routes/edit-upload-rejections.yaml
- tools/oracle/cases/api/image-routes/image-error-envelopes.yaml
- tools/oracle/cases/api/image-routes/image-auth-failures.yaml
deviations: []
out_of_scope:
- B004 owns ProxyBaseLLMRequestProcessing, resolve_litellm_call_id and log_llm_api_exception; B1103 owns shared OpenAI error-payload helpers and authenticated request enrichment.
- B1100/B1101 own multipart/body extraction and numeric coercion; B1102 owns model precedence and reject_url_valued_destination; B218 owns get_str_from_messages.
- B1121/B998 and B999 own SDK image calls, B124 proxy hook/status services and B756 authentication. No other function in image_endpoints/endpoints.py is left unassigned.
pitfalls:
- Generation merges the trusted call id over the body; reversing the union lets a client forge the logging identifier.
- Upload conflicts and plain-string failures occur outside the edit processor's try block and retain FastAPI detail bodies.
- A post-success-hook failure can follow a scheduled success status; the source does not make those effects atomic.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
