  commands:
  - id: case-models-chat-completions-route
    why: The models-chat-completions-route behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::chat_cases::case_[0-9]+_models_chat_completions_route$/)'
  - id: case-api-version-url-precedence
    why: The api-version-url-precedence behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::chat_cases::case_[0-9]+_api_version_url_precedence$/)'
  - id: case-strip-non-openai-message-fields
