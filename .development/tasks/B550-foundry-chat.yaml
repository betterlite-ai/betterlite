id: B550
title: Foundry chat request and response mapping
description: >-
  Add FoundryChatOptions and prepare/parse stages over existing OpenAI wire records. Preserve model-family capability
  queries, the exact deep-copy message transformation, extra_body precedence, model response prefixes and services.ai.azure.com
  route handling. Resolve Azure OpenAI redirects as a typed provider-selection result for the dispatcher; this leaf
  crate does not import betterlite-provider.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/chat/transformation.py:
  AzureAIGPT5Config._model_map_lookup_name L50-L63; AzureAIStudioConfig.get_supported_openai_params L70-L90; AzureAIStudioConfig.map_openai_params
  L92-L111; AzureAIStudioConfig._supports_stop_reason L113-L121; AzureAIStudioConfig.validate_environment L123-L145;
  AzureAIStudioConfig._should_use_api_key_header L147-L151; AzureAIStudioConfig.get_complete_url L153-L203; AzureAIStudioConfig.get_required_params
  L205-L220; AzureAIStudioConfig._transform_messages L222-L254; AzureAIStudioConfig._is_foundry_model_inference_base
  L256-L257; AzureAIStudioConfig._is_azure_openai_model L259-L267; AzureAIStudioConfig._get_openai_compatible_provider_info
  L269-L282; AzureAIStudioConfig.transform_request L284-L296; AzureAIStudioConfig.transform_response L298-L325.


  Reuse BaseAzureLLM._base_validate_azure_environment from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse api_key_header_for_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse is_foundry_model_inference_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: models_chat_completions_route: None api_base raises the exact Azure-AI-Studio required-base
  ValueError. The raw string substring services.ai.azure.com selects /models/chat/completions, otherwise /chat/completions,
  joined through B668 overlap logic; this URL selector is broader than B549 hostname validation. api_version_url_precedence:
  Copy existing query to a dict; existing api-version including empty wins. Otherwise add truthy litellm_params.api_version
  only, with no environment/global/default lookup in this method; repeated original query keys collapse. strip_non_openai_message_fields:
  Deep-copy messages, recursively remove thinking_blocks,reasoning_content,provider_specific_fields,cache_control
  using B219 filter_value_from_dict. Then skip text flattening for B218 image/audio messages; otherwise replace
  content only when B218 convert_content_list_to_str is truthy, leaving empty-list/text cases unchanged and caller
  data untouched. extra_body_precedence: Pop extra_body default {}; merge it only when truthy and dict, overwriting
  existing options. Then pop max_retries, including any value from extra_body, and delegate B668 request transform.
  gpt5_capability_selection: Prefer azure_ai/<model> in litellm.model_cost when present, else B502 base lookup.
  Select GPT5 policy via its predicate or ordinary B668 superclass; remove tool_choice when B174 supports_tool_choice(azure_ai/<model>)
  is false and stop when case-sensitive grok delegates to B1403 XAI _supports_stop_reason and returns false. azure_openai_model_redirect:
  Provider-info helper resolves explicit base/key or AZURE_AI_API_BASE/AZURE_AI_API_KEY without global fallback.
  Never redirect when base is None or B549 Foundry model-inference host; otherwise remove only the first model prefix
  and test OpenAI chat/text/embedding catalog lists, setting provider azure on membership. azure_ai_response_model:
  Set supplied model_response.model=azure_ai/<requested model> before superclass response projection; preserve B668/B004
  conversion ordering and upstream response fields, rather than unconditionally overwriting the final parsed model.
  foundry_chat_auth: Truthy explicit key uses api-key for B549 recognized host or Authorization Bearer otherwise;
  absent key validates only a dict litellm_params into GenericLiteLLMParams and calls B2200 auth. Always overwrite
  Content-Type=application/json. foundry_required_fields: Expose api_key and api_base as string ProviderFields with
  descriptions Your Azure AI Studio API Key. and Your Azure AI Studio API Base., examples zEJ... and https://Mistral-serverless.
  respectively.


  Write standalone Rust test foundry_chat_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test foundry_chat_secret_safe_failure in betterlite-foundry: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-foundry/src/chat.rs with adjacent tests under chat/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation foundry_chat in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_cases in betterlite-foundry with these exact named cases (one per oracle file): models_chat_completions_route,
  api_version_url_precedence, strip_non_openai_message_fields, text_list_copy_behavior, extra_body_precedence, gpt5_capability_selection,
  azure_openai_model_redirect, azure_ai_response_model, foundry_chat_auth, foundry_required_fields. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_chat* using HelperCase: kind: helper
  and the externally tagged foundry_chat variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_foundry_chat that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 232 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 245 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 645 planned, 650 maximum changed lines.
