id: B933
title: Responses retrieve and input-items SDK calls
description: >-
  Build responses_lifecycle_call around the four whole SDK functions aget_responses, get_responses,
  alist_input_items and list_input_items. B903 decodes provider-bearing IDs; decoded nonempty fields
  override the raw ID and explicit provider. Resolve a Responses config for model=null through
  B157, log through B247 and execute B2416. B010 owns generic SDK parameters and B198 owns the
  imported REQUEST_TIMEOUT default of 6000. Use B185/B186 for exceptions, preserving SDK absence
  and null fields rather than projecting proxy errors. B904 updates successful retrieve IDs with
  litellm_metadata and the selected provider; input-items JSON is returned unchanged.

  Keep defaults after=null,before=null,include=null,limit=20,order=desc. Async wrappers decode,
  set their mode flag and preserve context through the sync call; await returned coroutines once.
  alist_input_items has no @client decorator, while list_input_items does. Sync dispatch tests
  its popped mode flag with is True. Retrieve accepts extra_query and extra_body but neither
  affects provider HTTP. timeout=null or 0 selects REQUEST_TIMEOUT before B2416; that transport
  intentionally omits the timeout on GET. Do not fix that omission in this SDK task.

  Add SdkHttpCall::ResponsesLifecycleRead to B2401, testing both public modes against the same
  mock protocol. Python uses actual SDK calls; native calls the production service. The
  api::responses_lifecycle_call::tests module also checks logging and context. Source ownership
  totals 255 nonblank/non-comment lines. Budget 225 implementation, 140 tests, 100 fixtures,
  90 adapters and 30 wiring, 585 total under 620. No parser is introduced above B509 and B2401.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_lifecycle_call.rs
  - crates/betterlite-core/src/api/responses_lifecycle_call/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/responses_lifecycle_read.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/responses_lifecycle_read.py
  - tools/oracle/cases/sdk-http/responses-lifecycle-read/**
  - tools/oracle/fuzz/corpus/sdk_http_case/responses-lifecycle-read-*
  - Cargo.lock
  - tools/oracle/helpers/b933.py
  - tools/oracle/helpers/b933/**
  - tools/oracle/src/helpers/core_ops/b933.rs
  - tools/oracle/src/helpers/core_ops/b933/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L1613-L1790
  why: Retrieve decodes before dispatch and encodes typed responses after sync or awaited completion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L1794-L1925
  why: Input-items defaults and wrapper asymmetry; returned item JSON does not use the retrieve ID rewrite.
dod:
- text: >-
    retrieve_routes_encoded_id sends a B903 ID for provider=openai,response_id=resp/a plus explicit
    provider=anthropic. Both modes make GET /v1/responses/resp%2Fa with no body. Mock 200 complete
    response id=resp_a,status=completed is returned with a B904 ID decoding to provider=openai,
    model_id=deployment_a,response_id=resp_a when litellm_metadata.model_info.id=deployment_a.
    Repeated encoding through sync/async layers must not nest the ID. Raw resp_a plus explicit
    openai works too; returned provider headers remain attached.
  proof: [retrieve-id, oracle, python-adapter]
- text: >-
    input_items_sdk_pagination calls with defaults and observes GET /v1/responses/resp_a/input_items
    query limit=20,order=desc. after="",before=item_b,include=[message.input_image.image_url],limit=2,
    order=asc forwards all five fields; [] include omits include and explicit null limit/order
    omit those query fields. A mock {object:list,data:[{id:item_a,type:message}],has_more:false}
    returns exactly that object without B904 item/response ID encoding. This SDK accepts explicit
    pagination arguments; the proxy route's ignored URL query belongs to B938.
  proof: [input-items, oracle, python-adapter]
- text: >-
    read_ignored_extras_and_context sends extra_query={after:ignored},extra_body={ignored:true},
    extra_headers={X-Trace:trace-a},timeout=7. The mock sees the trace header but no added query/body.
    Native capture sees timeout=7 handed to B2416 and no timeout on its GET. null/0 becomes 6000
    or injected REQUEST_TIMEOUT=17; B198 tests that setting's loader. Call context call-a survives
    async handoff. update_from_kwargs records model=null,optional_params={response_id:resp_a},
    litellm_params={litellm_call_id:call-a}; kwargs overlay locals first. Only a true mode flag
    selects async, not 1 or "true". ID rewriting applies only to typed ResponsesAPIResponse values.
  proof: [read-context, oracle, python-adapter]
- text: >-
    read_provider_errors sends a raw ID without provider and expects no HTTP with source ValueError
    "custom_llm_provider is required but passed as None". Missing anthropic config yields
    "GET responses is not supported for anthropic" or "list_input_items is not supported for anthropic".
    Shared mapping returns SDK APIConnectionError,status=500,type=null,param=null,code=null;
    assert the exact source cause and redacted public-message deviation. Mock 404 body
    {error:{message:gone,type:invalid_request_error,param:response_id,code:not_found}} becomes
    NotFoundError,status=404,type=null,param=null,code=null because the SDK mapper omits its body.
  proof: [read-errors, oracle, python-adapter]
- text: New lifecycle-read seeds parse as the SDK HTTP variant and execute real requests in each mode.
  proof: [sdk-corpus, oracle, python-adapter]
checks:
  optional: []
  commands:
  - id: retrieve-id
    why: retrieve leaks the public encoded ID upstream or encodes its returned ID twice
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_call::tests::retrieve_routes_encoded_id($|::)/)'
  - id: input-items
    why: SDK pagination is confused with the proxy route's body-only arguments
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_call::tests::input_items_sdk_pagination($|::)/)'
  - id: read-context
    why: extra_query leaks or context/logging uses the undecoded response ID
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_call::tests::read_ignored_extras_and_context($|::)/)'
  - id: read-errors
    why: missing provider reaches HTTP or upstream body fields are invented on SDK exceptions
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_call::tests::read_provider_errors($|::)/)'
  - id: python-adapter
    why: read SDK parity lacks an independent pinned implementation
    run: test -f tools/oracle/sdk_http/responses_lifecycle_read.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: the read SDK variant has no new decoder seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/responses-lifecycle-read-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/responses-lifecycle-read/retrieve-routes-encoded-id.yaml
- tools/oracle/cases/sdk-http/responses-lifecycle-read/input-items-sdk-pagination.yaml
- tools/oracle/cases/sdk-http/responses-lifecycle-read/read-ignored-extras-and-context.yaml
- tools/oracle/cases/sdk-http/responses-lifecycle-read/read-provider-errors.yaml
deviations:
- what: Unsupported lifecycle calls expose the shared bounded error message rather than Python stack traces, retaining APIConnectionError and status=500.
  why: The existing B184/B187 diagnostics contract applies to these locally raised errors.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2692-L2709
out_of_scope:
- B1116 owns delete/cancel, B934 compact, B1078 create, B932 async create, B931 shared selection, B955 interception and B943 websocket functions in main.py.
- B938 owns HTTP lifecycle routes, including JSON-body pagination and polling cancellation/re-read.
- B2416 owns resource HTTP execution; B509 owns request transforms and resource byte decoding.
pitfalls:
- alist_input_items delegates to the decorated synchronous function but is not itself decorated.
- SDK input-items returns raw item JSON; retrieve alone updates the response ID.
- A passed timeout does not imply a per-call deadline on the GET request at the pin.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
