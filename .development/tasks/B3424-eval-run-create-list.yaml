deviations:
  - what: "Async wrappers call sync counterparts via thread pool and contextvars copy, matching the @client decorator in LiteLLM but betterlite has its own context/logging mechanism."
    why: "The pattern (sync function, async wrapper running it in executor with context) is preserved; logging and context types come from betterlite's observability layer."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L1094-1106
  - what: "create_run uses a 600-second default timeout for long-running eval operations, not the standard request_timeout constant."
    why: "Evaluation runs can take longer than standard API requests; LiteLLM specifies timeout=600.0 as the explicit default with a 5-second connect timeout."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L1261
  - what: "Metadata supplied to create_run is captured in local_vars for error reporting but not added to the outgoing request unless extra_body includes it."
    why: "LiteLLM accepts and documents metadata but does not forward it; only extra_body can override the behavior, matching the pinned behavior exactly."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L1220-1222
  - what: "list_runs merges extra_query after explicit pagination parameters, so extra_query can overwrite pagination keys."
    why: "Pagination precedence is explicit parameters < extra_query overwrites; this order matches LiteLLM's implementation and is load-bearing for requests that override defaults."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L1410-1412

out_of_scope:
  - "Provider factory owned by B157 (ProviderConfigManager.get_provider_evals_api_config, litellm/utils.py:9262-9279)."
  - "HTTP handler implementation and transport dispatch for create_run_handler/list_runs_handler: no task currently owns these in base_llm_http_handler.py; flagged as unresolved, same as B3425."
  - Request/response transformation for OpenAI (owned by B523).
  - Logging infrastructure and observability (B247).
  - Exception type mapping from provider errors to OpenAI vs. other/fallback (B185, B186).
  - Async runtime, context variables and request tracing beyond what local operations require.
  - Client-wrapper decorator or its side effects on operation selection (betterlite's routing replaces this).
  - Unused data-source variants (dataset, sample-set, inline) that belong to evaluation definitions, not runs.

pitfalls:
  - "create_run timeout defaults to httpx.Timeout(timeout=600.0, connect=5.0), not the standard request_timeout. This 600-second limit is specific to run creation and must not be changed to the standard timeout."
  - "CreateRunRequest initializes with only data_source as a required field, optionally adds name if not None, and explicitly excludes metadata (see the commented-out lines 1221–1222 in litellm). Metadata can only reach the request through extra_body updates. Do not add metadata to CreateRunRequest directly; the omission is intentional and security-sensitive."
  - "ListRunsParams starts with only the fields explicitly passed: limit, after, before, and order, each added only when not None. The extra_query merge (line 1412) then applies with .update(), so extra_query can overwrite any of these four keys plus add new ones. Build from explicit params first, then apply extra_query as a second pass."
  - "Timeout resolution uses: supplied timeout if not None, otherwise the hardcoded timeout (600s for create_run via httpx.Timeout(timeout=600.0, connect=5.0) on line 1261; request_timeout for list_runs on line 1446). On None inputs, the default applies, not a per-request timeout."
  - "acreate_run dispatches to create_run with the 600-second timeout path (line 1261), while alist_runs dispatches to list_runs with request_timeout (line 1446). The async wrapper must preserve this distinction: do not normalize both to the same timeout resolution."
  - "create_run raises ValueError(f\"CREATE run is not supported for {custom_llm_provider}\") and list_runs raises ValueError(f\"LIST runs is not supported for {custom_llm_provider}\") when ProviderConfigManager returns None; do not mask this error or silently fall back to openai."
  - "CreateRunRequest requires eval_id and data_source; data_source is an opaque dict, not a modeled union of the unused inline/dataset/sample-set variants. Do not confuse the evaluation definition's data-source variants with run data-source handling."
  - "Both acreate_run and alist_runs check if the result is a coroutine before awaiting; this handles cases where the sync function might return a coroutine directly."
  - "list_runs logging includes both query_params and eval_id in optional_params, so the eval_id is present for tracing even when pagination parameters are omitted."
  - "local_vars = locals() must be called at the entry of create_run and list_runs before the try block to capture eval_id, data_source (create only), pagination params (list only), and all extra_* arguments for error reporting."

