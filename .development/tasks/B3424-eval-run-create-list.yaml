id: B3424
title: Eval run creation and listing operations
description: >-
  Build eval run creation and listing orchestration in `betterlite-core::api::eval_run_create_list`. Implement `create_run`, `acreate_run`, `list_runs`, and `alist_runs` with native sync/async semantics, preserving run creation's special timeout and the distinction between an arbitrary run data_source object and routing-only completion/model fields.

  In `create_run`: accept `eval_id` (required), `data_source` (required dict), `name` (optional), `metadata` (optional, not forwarded unless overridden by `extra_body`), `extra_headers`, `extra_query`, `extra_body`, `timeout`, and `custom_llm_provider`. Select provider: `custom_llm_provider` becomes `"openai"` if `None`. Construct `CreateRunRequest` with required `eval_id` and `data_source` fields, optional `name`, apply `extra_body` updates, validate environment through the config, transform the request, call the logging updater with the full request body as optional params, and dispatch to the transport handler with resolved timeout (`timeout or httpx.Timeout(timeout=600.0, connect=5.0)` — the 600-second run creation timeout, not the standard request timeout).

  In `list_runs`: accept `eval_id` (required), pagination parameters `limit`, `after`, `before`, `order` (all optional), `extra_headers`, `extra_query`, `timeout`, and `custom_llm_provider`. Build `ListRunsParams` from non-None explicit parameters only, apply `extra_query` overrides afterward, validate environment, transform request, log with query params and eval_id as optional params, dispatch with resolved timeout (`timeout or request_timeout`).

  Async wrappers `acreate_run` and `alist_runs` run their sync counterparts in a thread pool via `loop.run_in_executor`, copy context with `contextvars.copy_context`, and await the result. If the result is a coroutine, await it; otherwise return it.

  Unsupported providers are rejected with `ValueError` after `ProviderConfigManager.get_provider_evals_api_config` returns `None`. Exception mapping uses the same `litellm.exception_type` dispatch as the provider transforms: OpenAI errors through B185, other or unmapped errors through B186. Store `local_vars = locals()` before the try block to capture arguments and defaults.

  Metadata is not included in CreateRunRequest by default; it can only be supplied through `extra_body`, preserving LiteLLM's behavior. Run data_source is an opaque dict; do not model the unused inline, dataset, or sample-set data-source variants that belong to evaluation definitions.

