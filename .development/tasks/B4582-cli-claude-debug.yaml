dod:
  - text: An explicit, non-empty CLAUDE_CODE_SESSION_ID wins over any transcript scan; otherwise the newest file under projects/*/*.jsonl whose stem is a lowercase, fully-matched 8-4-4-4-12 hex UUID is returned by its stem, and no match returns nothing.
    proof: [debug-session-detection]
  - text: SpendLogRow's spend parses as a Decimal the way parse_decimal_lexeme does, metadata decodes the same from an object, a JSON-encoded string or null, and failed treats an empty status the same as an absent one before falling back to metadata.status.
    proof: [debug-wire-types]
  - text: session_rows fetches every page with page_size 100, concatenates and stably sorts by start_time (absent sorts as empty), and a page's HTTP failure or unexpected shape is reported without requiring every later page to have been fetched; payload fetches the same way for one request id.
    proof: [debug-fetch]
  - text: build_report selects bodies for every failed row plus the most recent N rows (N = 0 selects none), fails by name when there are no rows at all, and never lets one wanted id's own failure merge with another's.
    proof: [debug-fetch]
  - text: render_report's summary carries the proxy URL, a Clock-sourced UTC timestamp formatted with a literal +00:00 offset, turn and failure counts, total spend to six decimal places and the sorted distinct model list (or "n/a" for none); the fence around a body is always at least one backtick longer than the longest backtick run already in that body.
    proof: [debug-render]
  - text: The summary's lines join with single newlines, consecutive row sections are separated by exactly one blank line, there is no blank line between the summary and the first section, and the report ends with exactly one trailing newline.
    proof: [debug-render]
  - text: write_report creates ~/.litellm/debug and claude-{session_id}.md with mode 0600 set before any byte is written, by opening it through B4575's settings_backup::secure_create, never a write followed by a chmod.
    proof: [debug-report-file]
  - text: install_slash_command creates ~/.claude/commands and writes debug-lite.md with the static body verbatim and ordinary (non-tightened) permissions, overwriting any existing file at that path.
    proof: [debug-slash-command]
  - text: >-
      DebugError carries a source for every failure path above (an unresolved home directory, a failed or
      non-success request with its truncated body, an unexpected response shape, no session rows found, no
      session id resolved, and a failed report or slash-command write) and nothing is ever unwrapped or panics.
    proof: [debug-error]
  - text: debug claude accepts --session-id, --recent-bodies (default 3, rejects a negative value), --max-body-chars (default 20000, rejects a value under 100) and --no-save; it always prints the report to stdout, writes and reports the saved path on stderr unless --no-save is given, and exits with a typed error when no session id resolves. debug install-claude-command takes no flags and prints the installed path and a restart hint.
    proof: [debug-cli-dispatch]
checks:
  optional: []
  commands:
    - id: debug-session-detection
      why: detect_claude_session_id does not prefer the environment variable, does not pick the newest matching transcript, or accepts a stem that is not a full lowercase UUID.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::session_id_/)'
    - id: debug-wire-types
      why: spend does not parse as an exact Decimal, metadata does not accept all three wire shapes, or failed/error do not match the reference's fallback.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::spend_row_/)'
    - id: debug-fetch
      why: pagination, sorting, the wanted-id selection or the failure-reporting order are wrong.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::fetch_/)'
    - id: debug-render
      why: the summary line, the fence sizing or the exact joining between the summary and the row sections are wrong.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::render_/)'
    - id: debug-report-file
      why: the report file's directory, name or permission ordering are wrong.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::write_report_/)'
    - id: debug-slash-command
      why: the slash-command file's path, body or permissions are wrong.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::install_slash_command_/)'
    - id: debug-error
      why: DebugError drops a source or a failure path above has no typed variant.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::debug_error_/)'
    - id: debug-cli-dispatch
      why: a flag's default, its bound or the save/no-save and exit behavior are wrong.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::.*tests::(debug_claude|debug_install_claude_command)_/)'
oracle_cases: []
deviations:
  - what: write_report opens the report file for create and truncate at mode 0600 and sets that mode on the open file before writing any byte, instead of writing the file first and chmod-ing it afterward.
    why: The reference's write-then-chmod leaves the report, which can embed request and response bodies, briefly at the process umask before the chmod call tightens it; this task opens the report through B4575's settings_backup::secure_create, which never opens that window.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/debug.py#L294-L299
out_of_scope:
  - The shared client (betterlite-http's ProxiedClient), its base URL and the shared HTTP error printing. B4580 owns commands.rs and every command in this crate, this one included, sends its requests through that client.
  - The CLI root and command registration. B134 owns main.rs; this task only exposes DebugCommand and run for it to wire.
  - The statusline subcommand. B4586 owns crates/betterlite-cli/src/statusline.rs; nothing here calls it.
  - Claude settings.json reading, writing or merging. B4562 and B4563 own claude_settings.rs; this task never reads or writes settings.json, only the slash-command file and session transcripts under ~/.claude.
  - HTTPClient as an importable Python class and the rest of its generic request method. That stays B169's reference; this task builds only the two GET requests debug.py itself sends.
  - Credential storage, token refresh and keyring access. B4574, B4590, B4591 and B4592 own those; this task only uses the API key the CLI context and B4580's shared client already resolved.
pitfalls:
  - The reference's failed check treats an empty status string the same as an absent one, so a row whose own status is empty still falls back to metadata.status, not to that empty string.
  - Both truncations (the 500-character transport-failure body snippet and the --max-body-chars body truncation) count Unicode scalar values, never bytes; a byte-index slice can land inside a multi-byte character.
  - A payload fetched for a wanted request id can legitimately come back absent (the proxy simply stored none); that is not a failure and renders the same empty body section as an id that was never fetched.
  - recent_bodies = 0 must select no extra rows at all, not every row; an unsigned "N most recent" computed as "skip len - N" rather than a signed negative-index slice avoids the reference's own negative-index special case entirely.
  - The fence around a body must stay longer than the longest run of backticks already inside that body, including an embedded JSON string that itself contains backticks, or the rendered code block closes early.
  - write_report and install_slash_command end up with different permissions on purpose (0600 against the default); reusing the same secure-create helper for both would tighten a file the reference never tightens.
  - The home directory comes from EnvironmentLookup::system_home(), never a direct std::env or Path::home() call, so a test can run against a temporary folder; treat a missing home directory as a typed error, not an unwrap.
  - session_rows and the payload loop are allowed to stop at the first page or id, in page or sorted-id order, that fails; this sends fewer requests than the reference's own eager loop but reports the exact same failure, since the reference only ever surfaces the first one in that same order too.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
