id: B4582
title: Claude session debug reports and slash-command installation
description: >-
  Build `lite debug claude` and `lite debug install-claude-command` in crates/betterlite-cli/src/commands/debug.rs
  and its error, session, wire, fetch, render, report_file and slash_command submodules. debug.rs is the parent
  module: it declares every submodule, holds the `DebugCommand` clap enum (`claude` and `install-claude-command`)
  and the one `run` function the CLI root calls, and resolves the two paths every submodule needs, `~/.claude`
  and `~/.litellm/debug`, through betterlite-config's EnvironmentLookup (`system_home()`), never through
  `std::env::home_dir()` or an unwrapped `Path::home()` equivalent, so a test can point both at a temporary
  folder. A home directory that does not resolve is a typed error, never a panic.

  session.rs resolves the session id: the `CLAUDE_CODE_SESSION_ID` environment variable, read through the same
  EnvironmentLookup (`lookup`), wins when it is set and non-empty; otherwise it reads `~/.claude/projects/*/*.jsonl`
  (two plain directory listings, not a glob dependency), keeps the files whose stem is a lowercase, full 8-4-4-4-12
  hex UUID, and returns the most recently modified one's stem. No match returns nothing; this task does not
  decide what the CLI prints for that case beyond surfacing a typed "no session detected" outcome.

  wire.rs models the two response shapes fetch.rs decodes: SpendLogRow (request_id required; start_time and
  end_time aliased from startTime/endTime; model, model_group, custom_llm_provider, api_base, call_type and
  status optional; spend a rust_decimal::Decimal that defaults to zero and parses the same way
  betterlite_models::price_fields::decimal_lexeme::parse_decimal_lexeme does, never through Decimal's own
  float-based deserialization; prompt_tokens, completion_tokens and total_tokens non-negative integers
  defaulting to zero; metadata a SpendLogMetadata that defaults to empty and that decodes the same way whether
  the wire sends it as a JSON object, a JSON string holding encoded JSON, or null), SpendLogMetadata (status,
  error_information), ErrorInformation (error_code, error_class, error_message, llm_provider, all optional) and
  SessionLogsPage (data, total, total_pages). A SpendLogRow is failed when its own status, or its metadata's
  status when its own is absent or empty, equals "failure"; empty counts the same as absent, matching the
  reference's truthiness. RequestResponsePayload carries proxy_server_request, response and messages as one
  passthrough JSON type this task defines once with a single #[expect(clippy::disallowed_types, ...)], reused
  for the three fields, since this task never inspects their shape, only re-renders it; the payload for a given
  request id is itself optional (the endpoint can answer null, meaning no body was stored).

  fetch.rs sends every request through the shared client and base URL commands.rs (B4580) builds from the CLI
  context: GET /spend/logs/session/ui with session_id, page and a page size of 100 for session_rows (fetch page
  1, then pages 2..=total_pages in order, concatenate and stable-sort every row by start_time with an absent
  start_time sorting as the empty string), and GET /spend/logs/ui/{request_id} for one payload. A failure is
  typed as either the request or an unsuccessful status (the response's text, truncated to 500 Unicode
  characters, never bytes, carried alongside) or an unexpected response shape; session_rows and the payload
  fetch loop may stop at the first page or id, in page or sorted-id order, that fails, since a later one's
  outcome never changes which failure gets reported.

  render.rs builds the markdown report as a plain string (build_report, render_report, the per-row section, the
  JSON truncation and the backtick-fence sizing) with no I/O of its own. It takes the already-fetched rows and a
  map from request id to an optional payload (failed rows plus the most recent N rows, N configurable, want
  bodies; a row absent from that map or present with no payload renders the same empty body section). The
  report's summary line names a UTC timestamp read through a small Clock trait this module defines (`fn now(&self)
  -> chrono::DateTime<chrono::Utc>`, with a SystemClock production impl) and formats it with a literal "+00:00"
  offset, not "Z", matching the reference's isoformat output; total spend sums every row's Decimal and prints it,
  and every per-row spend, with exactly six digits after the decimal point. The summary's lines join with single
  newlines, the row sections join with exactly one blank line between consecutive sections, there is exactly one
  newline (no blank line) between the summary's last line and the first section, and the whole report ends with
  exactly one trailing newline. A build with no rows is its own typed failure naming the session id and base URL;
  it never reaches render_report.

  report_file.rs writes the finished report to `~/.litellm/debug/claude-{session_id}.md`, creating the directory
  first, by opening it through B4575's settings_backup::secure_create (mode 0600 on open and on the open file
  before any byte, the call write_backup uses for its own file), not a write-then-chmod that leaves the file briefly at the process umask. slash_command.rs writes
  the static `/debug-lite` command body to `~/.claude/commands/debug-lite.md` unconditionally (creating the
  directory first) with ordinary create semantics and no permission tightening, since that file is a boilerplate
  template with nothing secret in it; the two files deliberately end up with different permissions and this task
  must not blur that.

  The `claude` subcommand takes an optional --session-id, --recent-bodies (default 3, rejects negative), --max-
  body-chars (default 20000, rejects anything under 100) and a --no-save flag; it always prints the report to
  stdout, then writes the file and prints where, to stderr, unless --no-save is given, and it exits with a typed
  error when no session id can be resolved. `install-claude-command` takes no flags, writes the slash command and
  prints the installed path and a restart hint.
