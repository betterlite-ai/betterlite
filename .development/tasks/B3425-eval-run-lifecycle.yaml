dod:
  - text: The module exports `get_run`, `aget_run`, `cancel_run`, `acancel_run`, `delete_run` and `adelete_run` with the correct signatures matching the LiteLLM functions.
    proof: [eval-run-lifecycle-exports]
  - text: All six functions preserve both `eval_id` and `run_id` throughout logging and provider dispatch.
    proof: [eval-run-lifecycle-exports]
  - text: Each sync function returns its response contract (`Run` for get, `CancelRunResponse` for cancel, `RunDeleteResponse` for delete).
    proof: [eval-run-lifecycle-exports]
  - text: All three accept but do not forward `extra_query` to the transport.
    proof: [eval-run-lifecycle-extra-query]
  - text: Cancel and delete discard the transform's returned body before transport, as get never receives one.
    proof: [eval-run-lifecycle-body-handling]
  - text: When an unsupported provider is selected, the function fails with `ValueError("GET run is not supported for {provider}")`, `ValueError("CANCEL run is not supported for {provider}")` or `ValueError("DELETE run is not supported for {provider}")` respectively.
    proof: [eval-run-lifecycle-unsupported-provider]
  - text: Exceptions are caught and re-raised via `litellm.exception_type` with the correct parameters.
    proof: [eval-run-lifecycle-error-handling]
  - text: Async variants call their sync counterparts using `asyncio.get_event_loop().run_in_executor` with `functools.partial` and `contextvars.copy_context`.
    proof: [eval-run-lifecycle-async]
  - text: Timeout resolves to supplied timeout or request_timeout constant.
    proof: [eval-run-lifecycle-timeout]
checks:
  optional: []
  commands:
    - id: eval-run-lifecycle-exports
      why: the module does not export all six functions with correct signatures
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(eval_run_lifecycle_exports)'
    - id: eval-run-lifecycle-extra-query
      why: extra_query is forwarded to the transport
      run: grep -q 'extra_query' crates/betterlite-core/src/api/eval_run_lifecycle.rs && ! grep -q 'extra_query.*handler' crates/betterlite-core/src/api/eval_run_lifecycle.rs
    - id: eval-run-lifecycle-body-handling
      why: cancel/delete do not discard the transform's returned body before transport
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(eval_run_lifecycle_body)'
    - id: eval-run-lifecycle-unsupported-provider
      why: unsupported providers do not fail with the correct error message
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(eval_run_lifecycle_unsupported)'
    - id: eval-run-lifecycle-error-handling
      why: exceptions are not properly caught and re-raised
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(eval_run_lifecycle_error)'
    - id: eval-run-lifecycle-async
      why: async variants do not use run_in_executor with partial and copy_context
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(eval_run_lifecycle_async)'
    - id: eval-run-lifecycle-timeout
      why: timeout does not resolve to supplied timeout or request_timeout constant
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(eval_run_lifecycle_timeout)'
