id: B3425
title: Eval run retrieval cancellation and deletion operations
description: >-
  Build run get/cancel/delete orchestration in `betterlite-core::api::eval_run_lifecycle`.
  The module exports six functions: `get_run`, `aget_run`, `cancel_run`, `acancel_run`, `delete_run` and `adelete_run`.

  Each function accepts an `eval_id` and `run_id` identifying the target, plus `extra_headers`, `extra_query`, `timeout`, `custom_llm_provider` and `**kwargs` for runtime parameters.
  When `custom_llm_provider` is `None`, default to `"openai"`.
  The three sync functions are the implementation core; the three async variants use `asyncio.get_event_loop().run_in_executor` with `functools.partial` and `contextvars.copy_context` to call their sync counterparts.

  Each sync function retrieves a `LiteLLMLoggingObj` from kwargs, extracts `litellm_call_id` with `None` default, and pops the matching async flag (e.g., `aget_run` checks `kwargs.pop("aget_run", False)`).
  Build `GenericLiteLLMParams` from `**kwargs` after that pop.
  Call `ProviderConfigManager.get_provider_evals_api_config` with the resolved provider; fail with `ValueError("GET run is not supported for {provider}")` if it returns `None`.
  Call `validate_environment` on the provider config, passing `extra_headers or {}` and the params; use the returned headers.
  Call the matching `transform_*_request` method (e.g., `transform_get_run_request` for get) with `eval_id`, `run_id`, api_base (resolved from `litellm_params.api_base or DEFAULT_OPENAI_API_BASE`), litellm_params and headers.
  For get, receive `url, headers` from the transform; for cancel and delete, receive `url, headers, request_body`.
  Call `litellm_logging_obj.update_from_kwargs` with the `kwargs`, `model=None`, `optional_params={"eval_id": eval_id, "run_id": run_id}`, and `litellm_params={"litellm_call_id": litellm_call_id}`, plus the provider.
  Call the matching handler on `base_llm_http_handler` (e.g., `get_run_handler` for get) with url, evals_api_provider_config, provider, litellm_params, logging_obj, extra_headers (the returned headers), timeout (resolved from `timeout or request_timeout`), `_is_async`, client and shared_session from kwargs.
  Return the response.
  On exception, raise `litellm.exception_type` with `model=None`, the provider, the original exception, local_vars as completion_kwargs and kwargs as extra_kwargs.

  Preserve both identifiers throughout logging and provider dispatch.
  Leave request/response transformation in B523.
  The unresolved transport owner (the handler callees in `litellm/llms/custom_httpx/llm_http_handler.py`) must preserve the call boundaries and implement the three handlers: `get_run_handler`, `cancel_run_handler`, `delete_run_handler`.
