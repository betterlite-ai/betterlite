out_of_scope:
  - ProviderConfigManager.get_provider_evals_api_config owned by B523 or a utility owner.
  - HTTP handler implementation and transport dispatch (owned by the handler/transport owner identified by B096's external-calls table).
  - Request/response transformation. B523 owns the transform_* methods.
  - Logging callback registration and the @client decorator implementation. B247 owns the logging integration.
pitfalls:
  - "Both eval_id and run_id must be preserved in all logging calls and passed to the provider config's transform methods. A missing identifier in logging silently breaks observability."
  - "Cancel and delete receive a request_body from the transform but discard it before calling the handler. Do not accidentally forward it or omit the discard."
  - "Get never receives a request_body from its transform; cancel and delete always do. The transform signatures differ."
  - "extra_query is accepted but must not be forwarded to the transport layer, matching LiteLLM's behavior."
  - "The async flag (e.g., kwargs.pop(\"aget_run\", False)) must be popped before building GenericLiteLLMParams from kwargs, or it pollutes the params."
  - "Logging calls must use the exact optional_params keys eval_id and run_id to match B247's expected structure."
  - "Timeout resolution uses: supplied timeout if not None, otherwise request_timeout constant (REQUEST_TIMEOUT env var with 6000-second default). On None inputs, the default applies, not a per-request timeout."
