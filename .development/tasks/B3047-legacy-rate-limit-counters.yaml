id: B3047
title: Legacy minute-counter limits and errors
description: >-
  Implement the legacy per-minute rate-limit checking path for `betterlite-core::rate_limiters`
  in `_PROXY_MaxParallelRequestsHandler`, building the original minute-key counter checks and
  cache-object batching. The handler stores an internal_usage_cache reference and checks
  five counter types (key, key-model, user, team, end-user) against their limits, retaining
  dimension precedence (max_parallel_requests checked before tpm before rpm). Preserve the
  legacy clock-minute retry interval (seconds to next minute boundary) and optional verbose
  logging behavior keyed on `litellm.set_verbose`.

  Cache keys segregate by entity type: key uses `{api_key}::{precise_minute}::request_count`;
  key-model adds the model as `{api_key}::{model}::{precise_minute}::request_count`; user,
  team and end-user follow the same minute-scoped pattern. When any limit is zero, raise a
  429 with the appropriate rate_limit_type (CONCURRENT_REQUESTS for max_parallel_requests==0,
  TOKENS for tpm==0, REQUESTS for rpm==0) and retry-after header. The batch cache writes
  apply local_only=True and ttl=60 for immediate local consistency without waiting on
  distributed storage.

scope:
  paths:
    - crates/betterlite-core/src/rate_limiters.rs
    - crates/betterlite-core/src/rate_limiters/**
    - tools/oracle/cases/legacy-rate-limit-counters/**
  lint_tables: false

