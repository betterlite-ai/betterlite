id: B754
title: Shared authenticated request policy ordering
description: >-
  Implement CommonAuthChecks composing model/resource/tenant/pricing services in source order and preserving
  the selected caller context. Guardrail modification and tool allowlists use typed policies; trace-ID
  requirements for agent callers use injected registered-agent policy snapshots. Failures stop the pipeline
  before upstream dispatch and downstream effects, while warnings retain source continuation.


  Resolve models with B746 and headers/query accessors from B1100. skip_all_budget_checks is the
  explicit flag OR B750 route exemption, not a price check here. Fetch B736 membership before pricing
  or blocked-team checks when a team and nonnull token user exist and either a model is truthy or
  budgets are enabled. Pass the loaded flag even for a missing row, avoiding a second query. The
  false-by-default block_requests_for_models_without_pricing setting rejects only LLM routes using
  B750's singular/plural message, 403 model_cost_map_missing, param model, code 403. This precedes
  a blocked team's ordinary exception naming /team/unblock, mapped by B757 to 401 auth_error.


  In order run B886 team-model authorization, allowing only team_model_access_denied to be rescued
  by key access groups; B887 member scope; agent trace requirement; managed-agent ceiling; B748 agent
  group and caller checks; B886 personal-user model checks only without a team; B750 project checks;
  B885 matched-group stamping; B750 rejection of client metadata.tags. Use the agent registry port
  owned by B748. A registered agent's truthy require_trace_id_on_calls_by_agent requires a truthy
  B1105 get_chain_id_from_headers result; otherwise 400 bad_request_error, null param, message Requests
  made with this agent's key must include the x-litellm-trace-id header. Missing agents do not fail.
  A managed agent with a requested model needs a nonempty list/tuple models grant, otherwise HTTP403
  This agent has no model grants; B747 resolves aliases and applies its ceiling.


  Unless budgets are skipped, B1106 pre-seeds route metadata then applies key tags before any
  concurrent check. Gather all eligible checks and wait for all siblings to finish. Raise the first
  error in scope order, not completion order: team hard, team multi, key multi, team soft,
  organization, tags, matched groups, user, member, end user. Key multi requires a token; groups need
  matches; end users need a row and budget relation. Alerts/mutations from siblings remain even when
  another scope fails. Project checks occur earlier and may prevent this entire gathered batch.


  The nested user check skips missing user/ceiling and skips team keys unless
  general_settings.apply_user_budget_to_team_keys is exactly true (default absent). B2321 reads
  spend:user:<id> with row spend or zero fallback and the ceiling. Schedule user_budget with spend,
  ceiling, user_id, user_email and USER event group even below the ceiling. Then finite ceilings deny
  at equality with BudgetExceededError, entity user and message ExceededBudget: User=<id> over budget.
  Spend=<spend>, Budget=<budget>. Nonfinite ceilings still read and alert. B4025 owns budget alert delivery.


  After the batch run B750 required-user and global-budget checks, B888 guardrails, B1229 organization
  RBAC and team/org request enrichment using B741 route template, B742 route permissions, B749 vector
  permissions, and B888 tools allowlist. The enrichment's B737 team loader catches only HTTPException
  and returns null; other failures propagate. The route check's boolean result is ignored; it enforces
  by raising. Success returns true. Sequential failure prevents all later steps.


  Build the production auth_common_checks module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  common_checks (L922-L1295; 322 source lines).


  Keep each invoked budget check's threshold and numeric semantics; the orchestrator must not
  pre-round spend or merge independently scheduled budget checks into a different comparison.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.block_requests_for_models_without_pricing=False;
  general_settings.apply_user_budget_to_team_keys=None.


  Add the auth_common_checks operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-common-checks-*
  seed to B171 helper_case, which already owns this decoder.


  Common-check integration uses B732 admission on chat requests with multiple simultaneous denied
  budgets. Compare which exception escapes after all gather siblings finish, plus post-budget check
  suppression and absence of provider calls. B757 supplies the final public envelope.


  Seed B860 via POSTGRES_TEST_URL or testcontainers with a blocked team, optional membership and
  independently failing user/org budgets; distinguish lookup effects before the first rejection.


  Write betterlite-config::auth_common_checks::tests::pricing_default_false,
  pricing_enabled_only_on_llm_routes, team_user_budget_absent_false_and_true and invalid_boolean_rejected.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This composition consumes B2315 typed request/row projections. It owns no decoder or premium
  feature gate; source branches and their ordering remain observable through the booted server.


  Sizing: 322 source lines translate to about 270 production orchestration lines; allow 300 table-driven
  tests, 80 helper adapters, 90 wiring and 50 config lines, 790 changed lines within an 800-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_common_checks::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
