dod:
  - text: 'Named cases: model_and_membership_before_pricing_and_blocked_team,
      missing_membership_is_not_reloaded, pricing_error_all_fields, blocked_team_message,
      only_team_model_denial_gets_key_group_override, member_scope_after_team_override,
      agent_absent_optional_and_required_trace, managed_agent_missing_empty_invalid_and_alias_grants,
      agent_caller_then_personal_user_then_project_order, project_failure_prevents_group_stamping,
      client_tags_rejected_before_key_tag_injection, skip_budget_retains_nonbudget_policy,
      gather_waits_for_all_then_scope_priority_error, gather_alerts_survive_sibling_failure,
      absent_token_groups_and_end_user_omit_only_their_checks, user_team_key_exact_true_setting,
      user_counter_alert_before_finite_equality_denial, user_nonfinite_still_alerts,
      postbudget_user_global_guardrail_org_route_vector_tool_order, enrichment_only_catches_http,
      route_false_return_is_ignored, success_returns_true.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_common_checks::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_common_checks.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-common-checks-*")"
        && grep -rlq "auth_common_checks" tools/oracle/fuzz/corpus/helper_case/auth-common-checks-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_common_checks::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-common-checks-*")"
        && grep -rlq "block_requests_for_models_without_pricing" crates/betterlite-config/fuzz/corpus/config_yaml/auth-common-checks-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_common_checks::tests::/)
        - test(/replays_the_/)'
