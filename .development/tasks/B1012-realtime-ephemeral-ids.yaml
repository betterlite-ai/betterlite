id: B1012
title: Realtime token payloads and authorized session selection
description: >-
  Own the seven complete helpers at realtime_endpoints/endpoints.py:43-213 in
  betterlite-core::api::realtime_ephemeral_ids. They select/authorize session models and encode/decode
  the plaintext routing payload; encryption itself is B061 and is invoked by the route owners.
  Session types realtime/transcription are accepted exactly; every other value becomes realtime.
  Defaults are gpt-4o-realtime-preview and gpt-realtime-whisper. Token version is the string realtime_v1.
  Preserve the distinction between missing session and an empty supplied session record.

  For transcription, collect nonempty string models from GA audio.input.transcription first, then
  flat input_audio_transcription, deduplicating without trimming. If neither exists, try session.model
  then root model; otherwise use the transcription default. Authorize every candidate through B886
  before rewriting both nested shapes to the first candidate and removing session.model. Ordinary
  realtime authorizes session.model or root model or its default once. B1004 owns request types.

  HelperCall::RealtimeEphemeralIds compares the pure type/candidate/setter/token functions through B171.
  _prepare_client_secret_session has native B886 invocation-order tests; B1126's secret_authorized_models
  HTTP case supplies composed authorization parity without introducing a reverse route dependency here.
  decode_realtime_token_payload(bytes,limits) is the production bounded decrypted-token decoder; fuzz
  and replay it with JSON and raw legacy tokens. A failure returns None, not an HTTP error, because
  B084 decides whether to use legacy-token fallback. Source functions contain 148 nonblank/non-comment
  lines; budget 145 implementation,125 tests,95 fixtures,80 adapters,60 fuzz/replay and 25 wiring =530 lines.
