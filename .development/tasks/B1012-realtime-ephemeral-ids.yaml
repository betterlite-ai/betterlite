references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/realtime_endpoints/endpoints.py#L37-L213
  why: Exact defaults, all seven helpers, authorization-before-rewrite and deliberately permissive token decoding.
dod:
- text: >-
    realtime_session_candidate_order maps None,"",Realtime,unknown to realtime and preserves exact realtime/
    transcription. Nested GA model=a then flat model=b yields [a,b]; duplicate a yields [a]. Empty or nonstring
    model is ignored, but " " is retained without trimming. Setter rewrites both existing dictionary shapes
    to model=a, retaining language and siblings. create_if_missing=false creates nothing; true with no valid
    transcription object creates audio.input.transcription={model:a}, replacing nonobject audio/input as needed.
    If a flat object exists, it is updated and no GA shape is created.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    authorized_realtime_session_selection uses native authorizer snapshots: no session/root model chooses
    gpt-4o-realtime-preview with session_data=None; an empty supplied session gains type=realtime. Realtime
    session.model beats root model and is authorized once. Transcription nested candidates [allowed,forbidden]
    cause both B886 checks in order and propagate the second denial before mutation. Both allowed rewrite
    both nested models to the first and remove session.model. Without nested candidates, distinct session/root
    models are both authorized; without any candidates authorize gpt-realtime-whisper and create GA transcription.
    Every call carries the same principal,model list and router. B1126 owns the matching booted-proxy HTTP case.
  proof: [behavior-tests]
- text: >-
    realtime_token_encoding emits compact JSON in order v,ephemeral_key,model_id,user_id,team_id,expires_at,
    session_type. For key=ep,model=m,user=None,team="",expiry=None expect
    {"v":"realtime_v1","ephemeral_key":"ep","model_id":"m","user_id":"","team_id":"","expires_at":null,"session_type":"realtime"}.
    Explicit transcription is retained, Unicode uses JSON's ASCII escapes, empty ephemeral/model strings are
    allowed. Even ephemeral_key=null or 7 is serialized unchanged despite the annotation; the decoder later
    rejects it. No encryption, signing, expiry check or owner authorization occurs in this function.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    realtime_token_legacy_decoding returns None for raw ep-test,malformed JSON,[],null,wrong/missing v,
    nonstring/missing ephemeral_key or model_id. Correct version with empty string key/model is accepted.
    Unknown fields and malformed ancillary user_id/team_id/expires_at/session_type values pass through:
    only the version and two string fields are checked. expires_at=true remains true and is not converted
    here. Decoding a valid compact payload returns its fields unchanged. No error status is manufactured.
  proof: [behavior-tests, oracle, helper-python]
- text: Token bytes and pure helper seeds are newly added and use the production decoder.
  proof: [decoder-corpus, helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Authorization order, nested model rewrites and permissive legacy detection need production assertions.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::/) - test(/::replays_corpus$/)'
  - id: decoder-corpus
    why: Decrypted token bytes are still untrusted and must reach the bounded production parser.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/realtime_token_payload)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::replays_corpus$/)'
  - id: helper-python
    why: Pure payload transforms must run against the pinned helpers without invoking FastAPI routes.
    run: test -f tools/oracle/helpers/realtime_ephemeral_ids.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The realtime_ephemeral_ids tag must appear under call in a new seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime-ephemeral-ids-*)" && grep -qE '^[[:space:]]+realtime_ephemeral_ids:' tools/oracle/fuzz/corpus/helper_case/realtime-ephemeral-ids-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Token encoding/decoding and candidate selection require fresh pure parity fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-ephemeral-ids)"
oracle_cases:
- tools/oracle/cases/helpers/realtime-ephemeral-ids/realtime-session-candidate-order.yaml
- tools/oracle/cases/helpers/realtime-ephemeral-ids/realtime-token-encoding.yaml
- tools/oracle/cases/helpers/realtime-ephemeral-ids/realtime-token-legacy-decoding.yaml
deviations: []
out_of_scope:
- B1126 owns both secret/transcription handlers at 216-359 and 521-658; B084 owns the complete WebRTC calls handler at 362-518. B061 owns encrypt_value_helper/decrypt_value_helper and key management.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_ephemeral_ids in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/realtime_ephemeral_ids.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_ephemeral_ids.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A malformed versioned token payload returns None and the route treats its decrypted text as a legacy key.
- Transcription authorizes every distinct candidate before normalizing to the first; authorizing only the chosen model weakens the pin.
- The token encoder converts absent user/team IDs to empty strings but keeps expiry=None as JSON null.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
