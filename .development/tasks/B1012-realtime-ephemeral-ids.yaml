checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::/)
      - test(/::replays_corpus$/)'
  - id: case-ephemeral-token-roundtrip
    why: the ephemeral-token-roundtrip behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::ephemeral_token_roundtrip($|::)/)'
  - id: case-legacy-token
    why: the legacy-token behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::legacy_token($|::)/)'
  - id: case-transcription-model-candidates
    why: the transcription-model-candidates behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::transcription_model_candidates($|::)/)'
  - id: case-payload-user-team
    why: the payload-user-team behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::payload_user_team($|::)/)'
  - id: case-malformed-token
    why: the malformed-token behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::malformed_token($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/realtime_ephemeral_ids)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/realtime_ephemeral_ids.rs && grep -qF "decode_realtime_ephemeral_ids"
      crates/betterlite-core/fuzz/fuzz_targets/realtime_ephemeral_ids.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::realtime_ephemeral_ids::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/realtime_ephemeral_ids.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime_ephemeral_ids-*)"
      && grep -qE "^[[:space:]]+realtime_ephemeral_ids:" tools/oracle/fuzz/corpus/helper_case/realtime_ephemeral_ids-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-ephemeral-ids)"
