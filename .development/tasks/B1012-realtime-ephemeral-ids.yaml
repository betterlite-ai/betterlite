id: B1012
title: Realtime ephemeral ids
description: >-
  Prepare realtime session model candidates and encode/decode proxy ephemeral-token payloads through B061 encryption.
  Bind model, session type, user and team to the returned credential; keep legacy raw-token recognition without
  granting additional permissions.


  Implement crates/betterlite-core/src/api/realtime_ephemeral_ids.rs. Use RealtimeEphemeralIdsInput and RealtimeEphemeralIdsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions ephemeral_token_roundtrip, legacy_token, transcription_model_candidates,
  payload_user_team, malformed_token under api::realtime_ephemeral_ids::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  The production external-byte decoder is betterlite-core::api::realtime_ephemeral_ids::decode_realtime_ephemeral_ids(bytes:
  &[u8], limits: &ApiLimits), for json.loads input decrypted_value at litellm/proxy/realtime_endpoints/endpoints.py:201.
  Place its implementation in crates/betterlite-core/src/api/realtime_ephemeral_ids.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/realtime_ephemeral_ids.rs passes arbitrary
  bounded bytes to that exact decoder; api::realtime_ephemeral_ids::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::RealtimeEphemeralIds in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_ephemeral_ids: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/realtime_endpoints/endpoints.py: _coerce_realtime_session_type (L43-L46); litellm/proxy/realtime_endpoints/endpoints.py:
  _append_model_candidate (L49-L51); litellm/proxy/realtime_endpoints/endpoints.py: _transcription_model_candidates_from_session
  (L54-L72); litellm/proxy/realtime_endpoints/endpoints.py: _set_transcription_model_on_session (L75-L120); litellm/proxy/realtime_endpoints/endpoints.py:
  _prepare_client_secret_session (L123-L167); litellm/proxy/realtime_endpoints/endpoints.py: _encode_realtime_token_payload
  (L170-L191); litellm/proxy/realtime_endpoints/endpoints.py: _decode_realtime_token_payload (L194-L213). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 141 owned nonblank/non-comment/non-docstring Python lines (148 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 161 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 471 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B061 (Stored credentials and their encryption), B171 (Direct helper oracle and URL path
  encoding), B1004 (Realtime contracts), B1087 (Api boundaries), B732 (Typed authentication principals and grant
  resolution), B855 (Authenticated request admission and budget handoff), B756 (Authentication header selection
  and mode dispatch). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
