id: B662
title: Bedrock realtime audio and conversation input
description: >-
  Add typed realtime client events for audio append/commit, text/conversation items, response create/cancel and
  session close. Preserve prompt/content state and the pinned precomputed PCM ready trigger bytes; copy them as
  a fixture, not an audio synthesis dependency. Input base64 uses bounded decoding, no caller path/URL is opened.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/transformation.py:
  BedrockRealtimeConfig.transform_input_audio_buffer_append_event L358-L423; BedrockRealtimeConfig.transform_input_audio_buffer_commit_event
  L425-L450; BedrockRealtimeConfig.transform_conversation_item_create_event L452-L518; BedrockRealtimeConfig.transform_response_create_event
  L520-L566; BedrockRealtimeConfig._response_trigger_audio_messages L568-L583; BedrockRealtimeConfig.transform_response_cancel_event
  L585-L597; BedrockRealtimeConfig.session_close_messages L599-L626; BedrockRealtimeConfig.transform_realtime_request
  L628-L668; BedrockRealtimeConfig.transform_conversation_item_create_tool_result_event L1212-L1273. litellm/llms/bedrock/realtime/trigger_audio.py:
  ready_trigger_pcm L208-L209.


  Implement crates/betterlite-bedrock/src/realtime_input.rs with adjacent tests under realtime_input/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_realtime_input in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_input_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): audio_append_before_after_session, audio_commit, conversation_text_item, response_create_ready_audio, response_cancel,
  close_session_order, unknown_client_event. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and captured
  upstream request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_input* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_input variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_input that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_realtime_client_input consumes realtime client message JSON bytes in crates/betterlite-bedrock/src/realtime_input.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_realtime_input.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_realtime_input.
  The adjacent test replays_the_bedrock_services_realtime_input_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 315 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 335 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 606 planned, 625 maximum changed lines.
