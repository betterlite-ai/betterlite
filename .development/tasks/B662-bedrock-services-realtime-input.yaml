checks:
  optional:
  - mutants
  commands:
  - id: case-audio-append-before-after-session
    why: The audio-append-before-after-session behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_input_cases::case_[0-9]+_audio_append_before_after_session$/)'
  - id: case-audio-commit
    why: The audio-commit behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_input_cases::case_[0-9]+_audio_commit$/)'
  - id: case-conversation-text-item
    why: The conversation-text-item behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_input_cases::case_[0-9]+_conversation_text_item$/)'
  - id: case-response-create-ready-audio
    why: The response-create-ready-audio behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_input_cases::case_[0-9]+_response_create_ready_audio$/)'
  - id: case-response-cancel
    why: The response-cancel behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_input_cases::case_[0-9]+_response_cancel$/)'
  - id: case-close-session-order
    why: The close-session-order behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_input_cases::case_[0-9]+_close_session_order$/)'
  - id: case-unknown-client-event
    why: The unknown-client-event behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_input_cases::case_[0-9]+_unknown_client_event$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_realtime_input.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_input*")"
      && grep -lq 'bedrock_services_realtime_input' tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_input*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_realtime_input$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_realtime_input)"
      && grep -q 'decode_realtime_client_input' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_realtime_input.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_realtime_input_corpus$/)'
