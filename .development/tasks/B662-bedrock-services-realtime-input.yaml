id: B662
title: Bedrock realtime audio and conversation input
description: >-
  Add typed realtime client events for audio append/commit, text/conversation items, response create/cancel and
  session close. Preserve prompt/content state and the pinned precomputed PCM ready trigger bytes; copy them as
  a fixture, not an audio synthesis dependency. Client audio strings are forwarded without base64 decoding; no caller
  path/URL is opened.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/transformation.py:
  trigger audio constants L73-L77; BedrockRealtimeConfig.transform_input_audio_buffer_append_event L358-L423; BedrockRealtimeConfig.transform_input_audio_buffer_commit_event
  L425-L450; BedrockRealtimeConfig.transform_conversation_item_create_event L452-L518; BedrockRealtimeConfig.transform_response_create_event
  L520-L566; BedrockRealtimeConfig._response_trigger_audio_messages L568-L583; BedrockRealtimeConfig.transform_response_cancel_event
  L585-L597; BedrockRealtimeConfig.session_close_messages L599-L626; BedrockRealtimeConfig.transform_realtime_request
  L628-L668; BedrockRealtimeConfig.transform_conversation_item_create_tool_result_event L1212-L1273. litellm/llms/bedrock/realtime/trigger_audio.py:
  READY_TRIGGER_PCM_16KHZ_MONO_GZIP_B64 L14-L204; ready_trigger_pcm cache and body L207-L209.


  Named case contracts: audio_append_before_after_session: Set client_audio_streamed=True before any other operation,
  regardless of prompt_started/audio validity. Open audio content if marker absent: contentStart typeAUDIO,interactiveTrue,roleUSER
  with B661 input media/rate/bits/channel/audioType/encoding. Then always audioInput content=json_message.audio
  defaultempty, preservingNone/nonbase64 strings; no decoder or prompt-start check. Same-rate subsequent append
  emits only audioInput. audio_commit: If audio marker present emit one contentEnd then delete marker; otherwise[].
  Do not reset client_audio_streamed,prompt_started,savedrate or audio_content_name. conversation_text_item: Only
  item.type=message walks content default[]. Each input_text block emits fresh-content UUID start/text/end in order,typeTEXT,interactiveTrue,roleUSER
  even if caller item.role differs,textInputConfiguration text/plain,text defaultempty. Other block/item types silently
  ignored; malformed shapes retain errors. No prompt_started guard. response_create_ready_audio: If not prompt_started
  OR client_audio_streamed return[]. Otherwise ensure open audio content at trigger rate16000 with same input media/bits/channel/encoding
  and typeAUDIO interactiveTrue roleUSER; an already open marker is reused without rate recheck. Then emit trigger
  PCM chunks, without contentEnd. Repeated response.create repeats trigger audio because this synthetic injection
  does not set client_audio_streamed. response_cancel: Return[] and only debug Handling response.cancel; no interrupt
  or state reset is sent. close_session_order: If prompt_started=False return[] even when audio marker exists, leaving
  it unchanged. Otherwise optional contentEnd removes audio marker,then promptEnd with promptName,then sessionEnd{},set
  prompt_started=False. Do not reset client_audio_streamed or allocate new UUIDs; repeated close becomes[]. unknown_client_event:
  decode_realtime_client_input JSON syntax failure warns Invalid JSON message: {first 200 source characters} and
  returns[]; betterlite suppresses raw text per deviation. Valid nondict JSON fails .get outside that catch. Dispatch
  exactly session.update to B661, audio append/commit,conversation.item.create,response.create,response.cancel;
  any other/missing type warns Unknown message type: {type} then[]. Ignore model and previous session_configuration_request
  arguments. audio_sample_rate_transition: When audio marker exists and saved sample rate differs from current input
  rate, emit contentEnd for old audio_content_name,clear marker,allocate new UUID audio_content_name,then contentStart+audioInput
  at newrate. Commit alone does not allocate a fresh content name, so same-name reopen after commit is preserved.
  conversation_tool_result: Only function_call_output routes to tool result: fresh content UUID; contentStart typeTOOL,roleTOOL,interactiveFalse,toolResultInputConfiguration
  toolUseId=call_id defaultempty,typeTEXT,textInputConfiguration.mediaType text/plain. toolResult.content is output
  unchanged ifstring elsejson.dumps(output),defaultempty; finish contentEnd. No tool registry validation or supplied
  item id reuse. ready_trigger_fixture: Copy pinned decompressed PCM as crates/betterlite-bedrock/src/realtime_input/ready_trigger.pcm
  and include_bytes!, with15990bytes and SHA256 961653bfc4a99686cca3f2d64f10c9fa5589cfb511098508ca916c7f20a826bd.
  Oracle calls cached ready_trigger_pcm (lru_cache maxsize1), not synthesizedaudio. Prepend16000zero bytes (0.5s)
  and append96000zero bytes (3s), yielding127990bytes. Split1024-byte chunks,base64 each independently,125audioInput
  frames,last1014bytes. No Polly/download/audio codec dependency. Count the source opaque literal separately from
  executable logic in budget reasoning.


  The counted source includes the191-line opaque compressed PCM literal. Store the verified binary fixture rather
  than duplicating that literal or implementing runtime gzip decoding; its asset wiring is included in the production/wiring
  allocation.


  Implement crates/betterlite-bedrock/src/realtime_input.rs with adjacent tests under realtime_input/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_input_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): audio_append_before_after_session, audio_commit, conversation_text_item, response_create_ready_audio, response_cancel,
  close_session_order, unknown_client_event, audio_sample_rate_transition, conversation_tool_result, ready_trigger_fixture.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_input* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_input variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_input that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_realtime_client_input consumes realtime client message JSON bytes in crates/betterlite-bedrock/src/realtime_input.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_realtime_input.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_realtime_input.
  The adjacent test replays_the_bedrock_services_realtime_input_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 512 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 300 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 785 planned, 800 maximum changed lines.
