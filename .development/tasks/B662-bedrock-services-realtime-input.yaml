pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_realtime_input in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_realtime_input.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_realtime_input.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A client append marks the session as having audio even when its content is empty, permanently disabling the synthetic
  ready trigger for that session.
- Committing audio closes the current content but does not change its contentName before a later append.
