oracle_cases: []
deviations:
  - what: "parse_observed_cache decodes request and response as strict Pydantic models instead of LiteLLM's manual field access."
    why: "Typed decoding enforces validation at the boundary and prevents silent field misses when the wire format changes."
  - what: "PromptCacheObserver is registered as the built-in 'prompt_cache_prediction' callback identity instead of requiring a user callback name."
    why: "The observer is integral to cache prediction functionality and the shared registry (B189) permits built-in identity registration for framework callbacks."
  - what: "Observation storage uses the dual cache's ttl parameter instead of computing expiry inline."
    why: "The dual cache abstracts Redis/local TTL management; the observer specifies retention policy (24 hours) and local copy freshness (1 second) without managing the cache's encoding."
  - what: "prefix.fingerprints (the lookback/secondary fingerprints) is accessed directly instead of calling a separate lookback function."
    why: "B3120 returns fingerprints tuple; the observer consumes it directly for fallback matching without reconstructing lookback windows."
out_of_scope:
  - "DualCache.async_get_cache and async_set_cache implementations: owned by B4293."
  - "redis_cache field access and initialization: owned by B4293 via attach_redis_cache."
  - "Callback registry registration and lifecycle: owned by B189, composed here."
  - "parse_prompt implementation: owned by B3120, called to reconstruct the observed prefix."
  - "supported_prediction_headers, _supported_provider_key and cache_scope helpers: owned by B3121, called here for validation."
  - "Cache eviction, memory backend and Redis backend: owned by B390, B360 and B4293, composed here."
pitfalls:
  - >-
    The wire request is httpx.Request (from the response.request property) and the response is httpx.Response. The body is wire.content (bytes) and headers are wire.headers (a MutableHeaders dict-like). Do not confuse httpx.Request with the FastAPI/Starlette Request type.
  - >-
    parse_observed_cache expects httpx.Request and httpx.Response directly, not FastAPI request/response objects. The observer receives them from the _Event model which carries httpx_response (an httpx.Response object).
  - >-
    The fingerprints tuple from prefix.fingerprints includes the exact fingerprint at index 0 and lookback fingerprints at indices 1+. The exact match is prefix.fingerprint (a string); fingerprints[1:] are the partial/stale fallback options.
  - >-
    The 24-hour retention (_RETENTION_SECONDS = 86400) is for persistent Redis storage; the local copy (_RETENTION_SECONDS is also passed but with local_only=True) keeps a fresh one-second snapshot for immediate same-request lookups.
  - >-
    Observations expire at started + prefix.ttl_seconds, where started is the request's first_api_call_start_time.timestamp() and prefix.ttl_seconds is 300 (5m) or 3600 (1h). The expiry_at field stores this pre-computed value.
  - >-
    A read-only hit (cache_creation_tokens == 0) requires prior evidence with matching fingerprint and cached_tokens. The previous observation must have been written in an earlier request; mismatch means the cache state changed and the observation is invalid.
  - >-
    The cache_scope digest includes anthropic-version as a parameter with DEFAULT_ANTHROPIC_API_VERSION as the default. It is computed inside parse_observed_cache and passed directly to ObservedCachePrefix.scope.
  - >-
    Wire request and response validation must be strict: unknown headers outside _NATIVE_HEADERS, extra response fields, or schema mismatches all return None rather than attempting a partial decode. Use TypeAdapter with strict=True.
review_level: security
