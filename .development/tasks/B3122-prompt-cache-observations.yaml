id: B3122
title: Record and retrieve caller-scoped provider cache observations
description: >-
  Build strict observation decoding and the native success-event observer in crates/betterlite-server::hooks,
  reusing the shared callback registry and injected cache/clock handles.
  The observer decodes successful native Anthropic responses to extract exact-before-lookback prefix evidence,
  validates fingerprints and cache token counts, stores observations with request-start expiry windows,
  and persists entries with 24-hour retention in the dual cache with one-second local Redis-backed copies.
  Implement lookup to find warm evidence by exact or partial fingerprint match, with stale-evidence fallback
  when exact matches have expired. Require existing matching evidence before refreshing read-only hits (cache_creation_tokens == 0).
  Decode wire body and response as strict Pydantic models, rejecting unknown fields, incomplete streams and response-cache hits.
  Only successful native Anthropic responses to the exact HTTPS recipient (api.anthropic.com:443/v1/messages) qualify.
scope:
  paths:
    - crates/betterlite-anthropic/src/observation_parsing.rs
    - crates/betterlite-anthropic/src/observation_parsing/**
    - crates/betterlite-logging/src/cache_observer.rs
    - crates/betterlite-logging/src/cache_observer/**
    - tools/oracle/cases/cache-observation/**
  lint_tables: false
