dod:
  - text: CacheObservation records fingerprint (64-char hex), cached_tokens (>0), observed_at (>=0), and expires_at (>=0) as strict frozen Pydantic model with extra="forbid".
    proof: [cache-observation-tests]
  - text: _cache_key returns a scope-and-fingerprint-scoped Redis key like "prompt-cache-observation:<scope>:<fingerprint>".
    proof: [cache-observation-tests]
  - text: _read_exact retrieves one cached observation by key, validates it with CacheObservation or decodes from JSON string, and returns None on validation failure or fingerprint mismatch; expiry filtering is handled by the caller lookup.
    proof: [cache-observation-tests]
  - text: lookup retrieves the exact observation by fingerprint or falls back to stale evidence from older fingerprints in prefix.fingerprints[1:], returning the first non-expired match or the most recent observation regardless of expiry.
    proof: [cache-observation-tests]
  - text: parse_observed_cache validates the wire request scheme, host (api.anthropic.com), path (/v1/messages), query (must be absent), and port (None or 443) to accept only native HTTPS recipients.
    proof: [parse-observed-cache-tests]
  - text: parse_observed_cache validates model match with response.model, provider_key format via _supported_provider_key, and that headers stay within _NATIVE_HEADERS.
    proof: [parse-observed-cache-tests]
  - text: parse_observed_cache validates anthropic-version == DEFAULT_ANTHROPIC_API_VERSION (2023-06-01) and calls supported_prediction_headers(headers) to reject anthropic-beta.
    proof: [parse-observed-cache-tests]
  - text: parse_observed_cache calls parse_prompt to reconstruct the observed prefix from the wire body, returning None if the body is unsupported (thinking block, multi-breakpoint or no single-message boundary).
    proof: [parse-observed-cache-tests]
  - text: parse_observed_cache validates cache token counts (cached_tokens > 0, cache_creation_tokens >= 0, sum <= prompt_tokens) and TTL consistency via split.ephemeral_5m_input_tokens and split.ephemeral_1h_input_tokens matching the prefix TTL.
    proof: [parse-observed-cache-tests]
  - text: parse_observed_cache returns ObservedCachePrefix with the exact prefix, computed cache_scope, cached_tokens and cache_creation_tokens, or None on any validation failure.
    proof: [parse-observed-cache-tests]
  - text: PromptCacheObserver.__init__ injects internal_usage_cache (holding a dual_cache) and clock (defaults to time.time), storing them as self.cache and self.clock.
    proof: [observer-init-tests]
  - text: async_log_success_event validates that kwargs is an _Event with cache_hit not set, status 200, and stream/prompt_cache_response_complete consistency (incomplete streams rejected unless prompt_cache_response_complete is true).
    proof: [observer-event-tests]
  - text: async_log_success_event calls parse_observed_cache and returns early if the wire request is outside the native HTTPS endpoint, response is non-200, stream is incomplete, or observation is None.
    proof: [observer-event-tests]
  - text: async_log_success_event checks that request.first_api_call_start_time (cast to timestamp) is not in the future; requests starting after now are dropped.
    proof: [observer-event-tests]
  - text: "async_log_success_event requires existing evidence when cache_creation_tokens == 0 (read-only hit): calls _read_exact to fetch the exact prior fingerprint and rejects refresh if the prior observation has mismatched fingerprint or cached_tokens."
    proof: [observer-read-only-tests]
  - text: async_log_success_event stores the observation with cache_tokens and TTL scoping via cache_scope (caller_key_hash, deployment_id, provider_key, model, default anthropic-version).
    proof: [observer-storage-tests]
  - text: async_log_success_event persists CacheObservation as JSON via model_dump_json() to dual_cache with 86400-second (24-hour) TTL, and maintains one-second local Redis copies via async_set_cache with local_only=True and ttl=1.
    proof: [observer-storage-tests]
