dod:
  - text: >-
      AgenticLoopRequestPatch and AgenticLoopPlan exist in betterlite-context with LiteLLM's field
      names and defaults, and a default plan has run_agentic_loop false, no patch, no override, terminate
      false, no stop reason and empty metadata.
    proof: [plan-types-tests]
  - text: >-
      search_batch returns outcomes in tool call order, runs every search even when one fails, turns
      a failure into "Search failed: <message>" text, and does not call the executor for a call
      without a query.
    proof: [search-batch-tests, oracle]
  - text: >-
      The chat plan finds the query in call.input or in function.arguments, forwards the rich input,
      and builds the follow-up messages for the openai format (assistant plus tool messages) and the
      other formats (assistant plus one user message).
    proof: [chat-patch-tests, oracle]
  - text: >-
      The chat patch prefixes the model with custom_llm_provider only when the model has no "/" and
      does not start with the provider string, and keeps tools in optional_params with patch.tools unset.
    proof: [chat-patch-tests, oracle]
  - text: >-
      The chat patch removes exactly its own optional_params and kwargs keys and keeps
      "_agentic_loop_api_surface" in kwargs.
    proof: [chat-patch-tests, oracle]
  - text: >-
      The Responses patch turns a string or list input into items, adds a function_call and a
      function_call_output item per call in order, with call_id null when missing and arguments ""
      when missing.
    proof: [responses-patch-tests, oracle]
  - text: >-
      The Responses patch moves optional_params["tools"] into patch.tools, removes exactly its own
      optional_params and kwargs keys, and prefixes the model whenever it has no "/" and a string provider is set.
    proof: [responses-patch-tests, oracle]
  - text: >-
      Both plans carry run_agentic_loop true and metadata tool_type "websearch" with response_format
      "openai" (or the given format) for chat and "responses" for Responses.
    proof: [followup-plan-tests, oracle]
  - text: >-
      The chat rerun request lays the patch optional_params over the request ones, removes
      tool_choice, uses the patch model and carries the patch kwargs.
    proof: [chat-rerun-tests, oracle]
  - text: >-
      Each oracle case calls the production operation and compares the whole plan or rerun request
      with LiteLLM's, including the recorded search calls; only error message wording may be ignored.
    proof: [oracle]

checks:
  optional: []
  commands:
    - id: plan-types-tests
      why: the plan and patch records, their defaults or their serialization are missing or untested
      run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^agentic_loop_plan::/)'
    - id: search-batch-tests
      why: the parallel search batch, its ordering or its failure text is missing or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^chat_responses_followup::(.*::)?search_batch/)'
    - id: chat-patch-tests
      why: the chat patch builder is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^chat_responses_followup::(.*::)?chat_patch/)'
    - id: responses-patch-tests
      why: the Responses patch builder is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^chat_responses_followup::(.*::)?responses_patch/)'
    - id: followup-plan-tests
      why: the two public plan builders or their metadata are missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^chat_responses_followup::(.*::)?followup_plan/)'
    - id: chat-rerun-tests
      why: the legacy chat rerun request is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^chat_responses_followup::(.*::)?chat_rerun/)'

