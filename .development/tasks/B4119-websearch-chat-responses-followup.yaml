deviations:
  - what: The plan, patch and message records are typed Rust structs with JSON-valued fields, not pydantic models and dicts.
    why: The rules forbid untyped dicts; the JSON a client or provider sees is unchanged.
  - what: The legacy chat rerun returns a ChatRerunRequest instead of calling litellm.acompletion itself.
    why: Sending the request belongs to the core executor; the request it sends is the same.

out_of_scope:
  - The surface dispatcher build_agentic_loop_plan, the Anthropic plan, the Anthropic patch, _resolve_max_tokens and _prepare_followup_kwargs (B4118).
  - The OpenAI chat provider hook that calls async_run_chat_completion_agentic_loop (litellm/llms/openai/openai.py L587-L620) and the follow-up provider call itself (B2415 and the chat executor).
  - async_run_agentic_loop and _execute_agentic_loop, the Anthropic legacy run (B4118).
  - _execute_search, _rich_search_input, _short_circuit_search_outcome and _create_empty_search_result bodies (B4115). This task calls them.
  - transform_response, search_outcome, search_outcome_text and the native blocks (B4113).
  - AgenticLoopSafetyError, StandardCustomLoggerInitParams and the interception prefix helpers in custom_logger.py L1-L64 (no task owns them in Rust; see notes).
  - Gates, tool rewriting and request hooks (B4116, B4117), tool access (B4114).

pitfalls:
  - The chat model prefix test is "model does not start with custom_llm_provider and has no '/'"; a model like "azure-gpt" with provider "azure" stays unprefixed, while the Responses builder prefixes it.
  - The chat patch keeps "_agentic_loop_api_surface" in kwargs, but the Responses patch removes it; do not share one kwargs filter.
  - The chat optional_params filter drops "extra_body" and keeps "stream"; the Responses filter keeps "extra_body" and drops "stream". Neither touches the other's list.
  - The chat patch never sets patch.tools; it puts "tools" back into optional_params. The Responses patch does the reverse.
  - A chat call whose "input" is present but not an object still falls through to function.arguments, and function.arguments that is a JSON string (not an object) gives no query.
  - Responses items use tool_call["call_id"] (null when missing) and tool_call["arguments"] (the empty string when missing), not call.id.
  - For the openai format the tool messages are a list added after the assistant message; for every other format the user message is one item, so the length of follow_up_messages differs.
  - Run the searches with join_all and keep the call order, because B4113's native pairing zips calls with outcomes by position and a failed search must not stop the others.
  - A Text input becomes a user item, but an empty list stays empty and only gets the function items.
  - The rerun removes "tool_choice" after merging, so a patch that sets it would still lose it.

