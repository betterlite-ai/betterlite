id: B4119
title: Build chat and Responses search follow-up plans
description: >-
  Build the two plan builders that turn an intercepted web search into a follow-up request on the
  Chat Completions and Responses surfaces, plus the typed plan and patch records every agentic loop
  callback returns. B4118 owns the surface dispatcher (build_agentic_loop_plan) and calls the two
  builders below, so B4119 must not depend on B4118 and the names below are public API that B4118
  uses as written.

  Part 1: the plan records. Implement crates/betterlite-context/src/agentic_loop_plan.rs (and its
  folder). The skeleton creates the empty module and declares it in lib.rs. No earlier task builds
  these types: B189 covers the LiteLLM file but its task text never names them, and other tasks
  (B4118, B3544, B4122, B2415, B6030) say "from B189". They sit in betterlite-context, which core
  already depends on, so every caller can reach them without a cycle. Add `serde` (workspace),
  `indexmap` (version 2.14.2, feature serde) and the `raw_value` feature of serde_json to
  crates/betterlite-context/Cargo.toml.
  - `pub type JsonMap = IndexMap<String, Box<RawValue>>` is the shape for every LiteLLM dict
    whose values are provider JSON (optional_params, kwargs, metadata). Add `JsonMap` helper
    functions as free functions only if a second caller needs them; `get_text(map, key)` returning
    Option<String> for a JSON string value is the one this task needs.
  - `FollowupMessage` wraps `Box<RawValue>` with `#[serde(transparent)]` and has
    `FollowupMessage::from_value<T: Serialize>(value: &T) -> Result<Self, serde_json::Error>`. It
    stands for one LiteLLM message or Responses input item (a dict). Do not use serde_json::Value.
  - `AgenticLoopRequestPatch` has `model: Option<String>`, `messages: Option<Vec<FollowupMessage>>`,
    `tools: Option<Vec<FollowupMessage>>`, `max_tokens: Option<u64>`, `optional_params: JsonMap`
    and `kwargs: JsonMap`. It derives Default, Debug, Clone, Serialize and Deserialize with the same
    field names, so Default matches LiteLLM's field defaults (None and empty maps).
  - `AgenticLoopPlan` has `run_agentic_loop: bool` (default false), `request_patch:
    Option<AgenticLoopRequestPatch>`, `response_override: Option<Box<RawValue>>`, `terminate: bool`,
    `stop_reason: Option<String>` and `metadata: JsonMap`, with the same derives and default.

  Part 2: the builders. Implement crates/betterlite-websearch/src/chat_responses_followup.rs (and
  its folder: search.rs, chat.rs, responses.rs, rerun.rs, error.rs, tests.rs). The skeleton creates
  the empty module and declares it in lib.rs. Add `betterlite-context` (path), `async-trait`
  (0.1.92), `futures-util` (0.3.34, default-features false, feature alloc) to
  crates/betterlite-websearch/Cargo.toml, and `tokio` (workspace, features macros and rt) and
  `rstest` (=0.27.0) as dev-dependencies. Do not read the environment or the clock.

  The search runner is a trait so tests pass fixed outcomes and B4118 reuses it:

      #[async_trait]
      pub trait SearchExecutor: Send + Sync {
          async fn execute_search(&self, query: &str, kwargs: &JsonMap, rich: Option<RichWebSearchInput>) -> SearchResult;
      }

  SearchResult is B4113's call_transformation::outcome::SearchResult. Also add, in search.rs, the
  impl of SearchExecutor for B4115's WebSearchExecution: read crates/betterlite-websearch/src/execution.rs
  on main first (B4115 is a dependency), call its execute_search, and map the typed result (text and
  optional SearchResponse, or SearchFailure) to SearchResult::Succeeded or SearchResult::Failed. If
  B4115's signature cannot be mapped this way, stop and report a blocker naming the function.

  `search_batch(executor, tool_calls, kwargs)` in search.rs returns `Vec<SearchOutcome>` in tool
  call order. For each call it finds the query and the rich input (see the per-surface rules), then
  starts `executor.execute_search` for a non-empty query, or uses B4115's create_empty_search_result
  (text "No search query provided", no response) for a missing or empty query and logs the call id
  at debug. All searches run together with `futures_util::future::join_all`. Each SearchResult goes
  through B4113's `search_outcome` and the text through `search_outcome_text`, so a failed search
  becomes "Search failed: <message>" and never cancels its siblings. Keep the debug line
  "Executing N search(es) in parallel".

  Public entry points, all on `pub struct ChatResponsesFollowup { search: Arc<dyn SearchExecutor> }`
  with `ChatResponsesFollowup::new(search: Arc<dyn SearchExecutor>)`:

  - `build_chat_plan(&self, tool_calls: &[Call], response_format: &str, request: &FollowupRequest<'_>)
    -> Result<AgenticLoopPlan, FollowupError>`. `FollowupRequest<'a>` holds `model: &'a str`,
    `messages: &'a [FollowupMessage]`, `optional_params: &'a JsonMap`, `kwargs: &'a JsonMap`. The
    dispatcher passes "openai" for response_format when the tools record has none. Returns
    run_agentic_loop=true, the patch from build_chat_patch and metadata {"tool_type": "websearch",
    "response_format": <response_format>}.
  - `build_responses_plan(&self, tool_calls: &[Call], request: &ResponsesRequest<'_>)
    -> Result<AgenticLoopPlan, FollowupError>`. `ResponsesRequest<'a>` holds `model`, `input:
    &'a ResponsesInput`, `optional_params`, `kwargs`. `ResponsesInput` is `Text(String)` or
    `Items(Vec<FollowupMessage>)`. Metadata is {"tool_type": "websearch", "response_format":
    "responses"}.
  - `build_chat_rerun(&self, tool_calls, response_format, request) -> Result<ChatRerunRequest,
    FollowupError>` is the legacy OpenAI chat path (async_run_chat_completion_agentic_loop and
    _execute_chat_completion_agentic_loop). OpenAI's chat provider calls it directly at the pin
    without the plan, so it has a caller. It builds the same chat patch, then returns
    `ChatRerunRequest { model, messages, params, kwargs }` for the core executor to send (no HTTP in
    this crate). `model` is patch.model, falling back to request.model. `params` is request
    optional_params with the patch optional_params laid over it (patch wins), then "tool_choice"
    removed. `kwargs` is patch.kwargs. LiteLLM raises "WebSearchInterception: missing follow-up
    messages" when the patch has no messages; the Rust patch always has them, so there is no error
    path for it.

  Chat patch (build_chat_patch, chat.rs), from _build_chat_completion_request_patch:
  1. Query lookup per call: if call.input is an object, the tool args are call.input and the query
     is its "query"; otherwise if call.function is present and its arguments are an object, those
     are the tool args. Anything else has no query. A non-empty string query starts execute_search
     with B4115's rich_search_input(tool args) and logs "Queuing search for query='<q>'" at debug.
     No query logs "Tool call <id> has no query" at debug and uses the empty result.
  2. Texts and outcomes from search_batch, then B4113's `WebSearchTransformation::transform_response`
     with the calls, texts and response_format.
  3. follow_up_messages: when response_format is "openai", request.messages then the assistant
     message then every tool message. Any other format: request.messages, the assistant message,
     then the single user message. Each message becomes a FollowupMessage. Log "Follow-up messages
     count" at debug.
  4. Model: if kwargs has "custom_llm_provider" (a string) and the model does not start with that
     string and has no "/", the patch model is "<provider>/<model>"; otherwise the model as given.
     This is a prefix test on the whole provider string, not a segment test.
  5. patch.optional_params is request optional_params without "tools", "tool_choice", "extra_body",
     "model_alias_map", "stream_response", "custom_prompt_dict", then "tools" is put back last when
     the request had it. patch.tools stays None.
  6. patch.kwargs is request kwargs without any key that starts with "_websearch_interception" and
     without "_websearch_interception", "acompletion", "litellm_logging_obj", "custom_llm_provider",
     "model_alias_map", "stream_response", "custom_prompt_dict". "_agentic_loop_api_surface" is kept.
  7. Debug line "Built chat completion request patch model=<m> messages=<n>".

  Responses patch (build_responses_patch, responses.rs), from _build_responses_request_patch:
  1. Query lookup: only call.input as an object with a non-empty string "query". The rich input is
     rich_search_input(call.input). Otherwise the empty result.
  2. Texts from search_batch as above.
  3. followup items: for each call in order, a `function_call` item {"type": "function_call",
     "call_id": call.call_id, "name": "litellm_web_search", "arguments": call.arguments or ""} then a
     `function_call_output` item {"type": "function_call_output", "call_id": call.call_id, "output":
     <text>}. A missing call_id is JSON null. Use the LITELLM_WEB_SEARCH_TOOL_NAME constant from
     crates/betterlite-websearch/src/tools.rs.
  4. patch.messages is the normalized input plus the items. Text(s) becomes one item
     {"role": "user", "content": s}; Items(list) is copied as is.
  5. patch.tools is request optional_params["tools"] when it is a JSON array, else None.
  6. patch.optional_params is request optional_params without "tools", "tool_choice", "stream",
     "model_alias_map", "stream_response", "custom_prompt_dict". "extra_body" stays.
  7. patch.kwargs is request kwargs without keys starting with "_websearch_interception" and without
     "_agentic_loop_api_surface", "litellm_logging_obj", "acompletion", "custom_llm_provider",
     "model_alias_map". "stream_response" and "custom_prompt_dict" stay here.
  8. Model: when the model has no "/" and kwargs["custom_llm_provider"] is a string, the patch model
     is "<provider>/<model>", with no starts-with test. Otherwise as given.
  9. Debug line "Built responses request patch model=<m> input_items=<n> searches=<n>".

  The dispatcher in B4118 reads tools["tool_calls"] and tools.get("response_format", "openai"),
  and ignores response, logging_obj and stream for these two surfaces, so the Rust builders do not
  take them.

  Oracle: helper cases compare LiteLLM and betterlite. The Python adapter builds a
  WebSearchInterceptionLogger, replaces `_execute_search` with a function that returns or raises what
  the case lists and records each (query, rich) call, then awaits
  async_build_chat_completion_agentic_loop_plan or async_build_responses_agentic_loop_plan. For the
  rerun cases it replaces `litellm.acompletion` with a recorder and calls
  async_run_chat_completion_agentic_loop. The adapter returns the plan (or the recorded rerun
  arguments) together with the recorded search calls. Write case files under
  tools/oracle/cases/helpers/websearch-chat-responses-plan/. The worker names the operation b4119 in the
  case files, with the functions build_chat_plan, build_responses_plan and build_chat_rerun.

