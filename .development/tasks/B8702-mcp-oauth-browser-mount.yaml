out_of_scope:
  - "Route behavior: B7971, B4719, B4675 and B7532."
  - "The discovery documents, token routes and BYOK routes: B8624."
pitfalls:
  - B7971 and B7532 must get the same reachability value; two copies can disagree after a user reload and let the connect flow grant what authorize refused.
  - Mounting B4719's routes inside the auth layers breaks the session cookie path, which LiteLLM accepts without an Authorization header.
  - MCP_TRUSTED_REDIRECT_ORIGINS admits https redirects only, so the trusted-origin case must send https://app.example.com/cb; an http URI on a listed host is still refused.
  - The 400 detail of the untrusted case names the redirect origin and a scheme and host mismatch but never the proxy host, so it compares equal across the two booted proxies; do not set PROXY_BASE_URL in these cases, or the same-origin rule changes what is refused.
review_level: security
budget:
