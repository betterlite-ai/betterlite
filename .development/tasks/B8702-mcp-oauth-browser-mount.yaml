  - tools/oracle/cases/http/mcp-oauth-browser/register-non-oauth-server-400.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/callback-no-params-400.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/callback-error-no-state-400.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/callback-error-escapes-html.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/callback-error-bad-state-400.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/callback-code-bad-state-incomplete.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/flow-missing-param-422.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/flow-unknown-400.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/complete-missing-flow-422.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/complete-bad-delivery-400.yaml
  - tools/oracle/cases/http/mcp-oauth-browser/complete-unknown-flow-400.yaml
