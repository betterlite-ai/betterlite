id: B8702
title: Mount the MCP OAuth browser routes and the /v1/mcp/server/oauth routes
description: >-
  B7971's OauthBrowser (GET /authorize and /{mcp_server_name}/authorize, /authorize/mcp-session, /authorize/flow,
  POST /authorize/complete, /callback, POST /register and /{mcp_server_name}/register, /.well-known/litellm-cli-auth)
  and B4719's OauthRoutes (the /v1/mcp/server/oauth/... routes for temporary servers) are built and never merged. This
  task builds their states from McpState and mounts them.


  Code goes in crates/betterlite-server/src/app/mcp/oauth_browser.rs and app/mcp/oauth_browser/ (ports.rs, a tests.rs
  beside each), plus one line in app::mcp::mount_public (crates/betterlite-server/src/app/mcp.rs) that merges
  `oauth_browser::router(&McpState::shared(state), state)`. Both families go outside the auth layers: LiteLLM serves
  the browser routes with no key, and B4719's routes authenticate inside the handler through RouteAuth with a session
  cookie fallback, so the app's key layer would refuse a cookie-only request that LiteLLM accepts.


  OauthBrowser (B7971) takes the registry from McpCore, McpState's oauth pieces built by B8623 (SealCipher, the
  OauthFlows implementation, and the B4675 gateway pieces: cipher, token source, consent renderer, single-use guard),
  the consent team lookup, a system clock, the trusted-proxy settings for the client ip (B743), and these ports in
  ports.rs. SessionReader is B4655's session cookie reader (LiteLLM's _session_cookie_user_id). RedirectTrust is
  B4655's validate_trusted_redirect_uri, its HTTPException mapped to TrustRejection with status and text.
  CredentialRead is B4713's get_user_oauth_credential, a missing database being ReadFailure::NoDatabase. The
  reachability lookup (B7532's UserAccess::user_can_reach, LiteLLM's _user_can_reach_mcp_server) and
  token_exchange_available (B4663's token_exchange_available over the loaded config) come from one value handed to both
  B7971 and the B7532 flows, as LiteLLM shares the function.


  Redirect allowlists. RedirectTrust holds one B4655 RedirectAllowlists, built once in ports.rs from B10094's
  config.sections.mcp_redirect_trust with a struct literal: origins is B4655's
  parse_trusted_redirect_origins(&trusted_origins) and native_callbacks is B10062's
  native_callbacks(&native_redirect_uris). validate passes it to validate_trusted_redirect_uri on every call, and
  nothing here reads the environment. B7971's register path calls B4674's register_aggregate_client, whose last
  argument is the native callback list: hand it the same native_callbacks, next to token_exchange_available. Three
  booted cases in mcp-oauth-browser prove the wiring end to end. Each configures one oauth2 MCP server with a client_id,
  an authorization_url and a token_url (no DCR bridge, no identity binding) and calls GET /<server>/authorize with
  state, an S256 code_challenge and a redirect_uri on a host that is neither the proxy nor loopback:
  authorize-trusted-origin-redirects sets MCP_TRUSTED_REDIRECT_ORIGINS to app.example.com and sends
  https://app.example.com/cb, authorize-untrusted-origin-400 sends the same URI with no variable set, and
  authorize-trusted-native-callback sets MCP_TRUSTED_NATIVE_REDIRECT_URIS to myapp://host/oauth/* and sends
  myapp://host/oauth/callback. The two accepted ones answer 307 with a location header; compare the status and that
  the header is present, never its value, since the relay state in it is random.


  OauthRoutes (B4719) takes McpState's OauthFlows implementation (B7321's), McpState's tokens.sessions (B4718's
  SessionStore built by B8622) and a RouteAuth over B855's _user_api_key_auth_builder with every provider header
  argument empty, so only api_key and request_data matter. Its AuthFailure passes through with the status and body
  the builder defines.


  POST /v1/mcp/server/oauth/session is B4718's route, not B4719's, and LiteLLM guards it with user_api_key_auth. Mount
  it here too, from McpState's tokens.sessions (B4718's SessionStore, built by B8622, which mounts no route), and wrap
  only this route with B8610's with_key_auth so it needs a normal key. B4719's cookie-aware routes stay outside the
  key layer.


  Every first-segment path parameter must be named mcp_server_name, as B8624's routers and B8592 name it, or matchit
  refuses the merge. Tests in app::mcp::oauth_browser:: : the router merged with B8624's builds, every path answers
  something other than 404 through tower's oneshot, SessionReader returns None without a cookie, and RedirectTrust
  maps a rejection to its status and text.


  HTTP oracle cases. The cases B7971 and B4719 planned through the booted proxy move here, because their routes only
  answer once this task mounts them. Write each listed case from its route task's description, DoD and case names
  (.development/tasks/B7971-mcp-oauth-browser-routes.yaml and B4719-mcp-oauth-browser-routes.yaml), with the config,
  key and ignore rules each describes. B4718's five session cases move here too, as tools/oracle/cases/http/mcp-oauth-session/, written from B4718-mcp-oauth-sessions.yaml's route steps and DoD with a master key, no database and no response cache: a supplied server_id kept, a generated id, credentials redacted with scopes kept, 401 without a key, and 400 for an invalid name.

  Booted case from B9695: ui/chat-app/connect-flow-status reads GET /authorize/flow?flow=<handle> with cookies and no bearer after starting a flow, and again with an unknown handle, as the /ui/chat ConnectFlowSurface sends it.
scope:
  paths:
    - crates/betterlite-server/src/app/mcp.rs
    - crates/betterlite-server/src/app/mcp/oauth_browser.rs
    - crates/betterlite-server/src/app/mcp/oauth_browser/**
    - tools/oracle/cases/http/mcp-oauth-routes/**
    - tools/oracle/cases/http/mcp-oauth-browser/**
    - tools/oracle/cases/http/mcp-oauth-session/**
    - tools/oracle/cases/ui/chat-app/connect-flow-status.yaml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L1926-L2379
    why: The browser routes mounted here (/authorize/mcp-session, /authorize, /authorize/flow, /authorize/complete, /.well-known/litellm-cli-auth, /callback) and their path parameter names; /token, /revoke and /introspect in between are B8624's.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L2944-L2996
    why: POST /register and /{mcp_server_name}/register.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2010-L2354
    why: The four /v1/mcp/server/oauth routes of B4719.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/oauth_utils.py#L507-L646
    why: The allowlist check and the trusted-redirect rejection the three redirect cases reach.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L921-L1040
    why: authorize_with_server runs the redirect check before the 307 to the authorization url.
dod:
  - text: The OauthBrowser and OauthRoutes routers are merged once each outside the auth layers.
    proof: [browser-route-tests, oracle]
  - text: POST /v1/mcp/server/oauth/session is mounted once from McpState's tokens.sessions behind with_key_auth, while B4719's cookie-aware routes stay outside the key layer.
    proof: [browser-route-tests]
  - text: SessionReader, RedirectTrust, CredentialRead, the shared reachability value and RouteAuth forward to their owning crates.
    proof: [browser-route-tests]
  - text: RedirectTrust and the registration path get their allowlists from config.sections.mcp_redirect_trust, so a listed https origin and a listed native callback pass /authorize and an unlisted origin gets LiteLLM's 400 invalid_request.
    proof: [browser-route-tests, browser-route-cases, oracle]
  - text: The moved B7971, B4719 and B4718 cases match LiteLLM through the booted proxy.
    proof: [browser-route-cases, oracle]
  - text: "The connect flow read after starting a flow and with an unknown handle answers as LiteLLM does."
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: browser-route-tests
      why: a router is not merged, a path is missing, or a port is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::mcp::oauth_browser::/)'
    - id: browser-route-cases
      why: without the case files the oracle proof compares nothing for these routes
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/mcp-oauth-browser tools/oracle/cases/http/mcp-oauth-routes tools/oracle/cases/http/mcp-oauth-session)"
