deviations: []
out_of_scope:
  - "Route behavior: B7971, B4719, B4675 and B7532."
  - "The discovery documents, token routes and BYOK routes: B8624."
pitfalls:
  - B7971 and B7532 must get the same reachability value; two copies can disagree after a user reload and let the connect flow grant what authorize refused.
  - Mounting B4719's routes inside the auth layers breaks the session cookie path, which LiteLLM accepts without an Authorization header.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
