id: B3892
title: OTel trace controls and type coercion utilities
description: >-
  Port the shared OTel model utilities in
  `litellm/integrations/otel/model/{trace_controls,utils}.py` into the
  `betterlite-logging` crate as independent modules `otel::model::utils` and
  `otel::model::trace_controls`. These modules are consumed by metadata and
  payload projections and by B3841; keep them free of OTel SDK dependencies.
  Provide typed Rust APIs for scalar coercion, string-keyed JSON objects and
  string tuples, epoch/date conversion, and the immutable TraceControls record.

  TraceControls carries name, user_id, session_id and tags. Read scalar values
  from litellm_params.metadata first and litellm_params.litellm_metadata second;
  nonempty `langfuse_trace_name`, `langfuse_trace_user_id` and
  `langfuse_session_id` request headers override the corresponding body values.
  Tags are the first nonempty string-only tag sequence from those two body
  metadata objects. Ignore non-string and empty tags and do not carry mutation
  controls such as trace_id, existing_trace_id or update_trace_keys.

  Implement the nontrivial numeric, tuple and time conversions along with
  TraceControls. Use serde_json's scalar and object accessors directly where
  their behavior matches the policy; Python helper names do not require one-to-one
  Rust wrappers. Represent decimal input and results with
  rust_decimal::Decimal, never f32/f64. Use checked arithmetic and checked
  conversion to the timestamp integer type; return None for invalid values,
  non-finite values and values outside the supported range. Preserve
  numeric-string parsing and truncation toward zero. as_bool accepts only a JSON
  boolean or null, while mappings and tuples accept only their declared JSON
  shapes; do not copy Python repr, duck typing or arbitrary truthiness beyond
  docs/compatibility.md. DateTime inputs carry explicit timezone state. Parse
  naive formatted dates through an injected LocalTimeResolver passed to the
  conversion instead of reading ambient timezone state inside these pure
  helpers. The resolver tests cover UTC, non-UTC and DST gaps/folds.
scope:
  paths:
    - crates/betterlite-logging/src/otel/model/utils.rs
    - crates/betterlite-logging/src/otel/model/utils/**
    - crates/betterlite-logging/src/otel/model/trace_controls.rs
    - crates/betterlite-logging/src/otel/model/trace_controls/**
    - tools/oracle/cases/helpers/otel-trace-controls/**
    - tools/oracle/fuzz/corpus/helper_case/otel-trace-controls-*
    - tools/oracle/helpers/b3892.py
    - tools/oracle/helpers/b3892/**
    - tools/oracle/src/helpers/logging/b3892.rs
    - tools/oracle/src/helpers/logging/b3892/**
  lint_tables: false
references:
