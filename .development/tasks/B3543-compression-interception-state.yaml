id: B3543
title: Compression interception settings and request cache
description: >-
  Load interception configuration and implement the deployment pre-call hook with
  its per-call 900-second original-content cache, generated call IDs and validated
  savings metadata. Mutate messages/tools only when compression produced a nonempty
  cache, preserving untouched no-op requests and the existing litellm_metadata object
  semantics.

  The handler validates token counts are non-negative ints (zero allowed): both
  original=0 and compressed=0 are valid inputs that produce tokens_saved=0. Savings
  attach to the request's litellm_metadata dict so they land in the SpendLog row's
  compression_savings key. Cache entries store (original_content_dict, creation_timestamp)
  and are pruned when their age exceeds 900 seconds (exactly 900 survives); access alone
  does not refresh creation time. Call IDs are generated when first used, preferring an
  existing litellm_call_id over a new uuid. Tool detection recognizes OpenAI function
  tools (type: function with a name in the function object) and native custom tools
  (type: custom with a name at the top level), not every bare dict. When an existing
  retrieval tool is present, _merge_tools returns the tool list unchanged without
  appending compressed_tools; otherwise it appends compressed_tools and returns the
  merged list. Compression is skipped when below trigger, invalid Anthropic exchanges
  exist, or an existing retrieval tool is detected; no empty tools list is injected
  into requests that originally had none.

  Top-level interception parameters win over callback-specific parameters. Defaults
  are enabled=true, compression_trigger=200000, compression_target=None, embedding_model=None
  and embedding_model_params=None. The hook skips positive _agentic_loop_depth values
  and waits for _has_retrieval_tool to return false.

