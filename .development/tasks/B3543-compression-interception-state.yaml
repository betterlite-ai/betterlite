  commands:
  - id: behavior-tests
    why: Configuration loading, cache lifecycle, compression savings validation and tool detection/merging require behavior assertions.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api::compression_interception|sections::compression_interception_state)::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: All compression_interception parameters and fallback chains must load through the production configuration loader.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::compression_interception_state::tests::loads_settings($|::)/)'
  - id: sdk-python
    why: Provider comparisons must use the SDK HTTP driver with a typed operation adapter.
    run: test -f tools/oracle/sdk_http/compression_interception.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpora
    why: New settings and SDK operation tags must have parser seeds.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/compression-interception-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/compression-interception-*)" && cargo nextest run --locked -p betterlite-oracle -p betterlite-config --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_config_yaml_corpus)'
  - id: new-cases
    why: Compression interception requires its own mock-provider HTTP cases.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/compression-interception)"
