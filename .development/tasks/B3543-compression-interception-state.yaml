dod:
- text: >-
    compression_savings_validation sends original=0,compressed=0,1,both positive and
    both negative to _compression_savings_from_counts: zero-zero returns tokens_saved=0,
    valid positive returns tokens_saved=original-compressed, negative/bool/float cases
    return None. Negative compressed or original < compressed also return None. Savings
    attach unmodified to both existing and newly created litellm_metadata dicts, with
    source="compression_interception" in both cases.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    configuration_loading exercises compression_interception_params from litellm_settings
    and fallback to callback_specific_params["compression_interception"]. Each parameter
    (enabled bool, trigger int, target int|null, embedding_model str|null, embedding_model_params dict|null)
    loads with its documented default when missing. from_config_yaml returns a logger with
    those values; initialize_from_proxy_config chooses top-level over callback-specific.
  proof: [config-tests, oracle, sdk-python]
- text: >-
    pre_call_hook_dispatch checks enabled, call_type=anthropic_messages, _agentic_loop_depth,
    messages list presence, model string and _has_retrieval_tool. Skips and returns None
    when any condition fails. Enabled true but other conditions false leaves messages/tools
    untouched. When all pass, calls asyncify(compress) with the configured trigger/target/embedding
    parameters.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    compression_cache_lifecycle creates empty _compression_cache_by_call_id on init,
    stores (cache_dict, time.time()) when cache is nonempty, prunes entries older than 900
    seconds (>900 pruned, ==900 kept, <900 kept) every pre-call, and _get_cache retrieves
    by call_id or returns empty dict. Cache entries are never refreshed on access. Call ID
    either exists as litellm_call_id in kwargs or logging_obj.litellm_call_id string, or a
    new uuid.uuid4() string is generated and stored.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    tool_detection and merging with existing_tools=none/[],retrieved_tools=[],both with
    retrieval tool present/absent. _has_retrieval_tool(None/non-list) returns false. Type:function
    with function.name==litellm_content_retrieve and type:custom with name==litellm_content_retrieve
    return true. _merge_tools with retrieval tool already present returns existing unchanged.
    _merge_tools without retrieval tool appends compressed_tools and returns merged. No empty
    tools list is injected when original request had none.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    messages_and_tools_mutation mutates both when cache is nonempty and compression_tools nonempty,
    mutates messages only when cache nonempty and no tools, leaves both untouched when cache empty,
    and records savings only when cache nonempty (savings can be zero when tokens_saved=0).
    logging includes call_id, original/compressed token counts and cache key count on success and
    compression_skipped_reason on skip.
  proof: [behavior-tests, oracle, sdk-python]
- text: Settings and SDK seeds reach the existing parsers and every new capture comes from an actual provider HTTP exchange.
  proof: [config-tests, corpora, new-cases, oracle, sdk-python]
