out_of_scope:
- B3542 owns compress() and its return dict. B3541 owns embedding_score_messages. B3540 owns get_protected_indices and related message normalization.
- B3544 owns async_should_run_agentic_loop, async_build_agentic_loop_plan, _resolve_retrieval_content, _extract_retrieval_tool_calls and _prepare_followup_kwargs.
- B189 owns the native CustomLogger initialization contract; this task inherits it via super().__init__().
- B198 owns the asyncify() decorator and the context injection for time/uuid/compression execution.
- B2401 owns sdk_http cases and oracle HTTP transport. B012 owns logging call details. B011 owns exception projection.
pitfalls:
- >-
  Cache entries are stored with creation timestamps via time.time() and pruned by age,
  never by access count. A cache entry exactly at 900 seconds old survives; only entries
  older than 900 seconds are removed. Access does not refresh the creation timestamp.
- >-
  Tool detection recognizes two patterns: type="function" with a function object containing
  name=litellm_content_retrieve, and type="custom" with a name field at the top level.
  A bare dict without type/name is not considered a tool and does not trigger retrieval.
- >-
  _merge_tools returns the existing tool list unchanged when a retrieval tool is already
  present; it never appends compressed_tools in that case. This prevents duplicates from
  being added when compression detects a pre-existing retrieval tool.
- >-
  Compression savings are only recorded when the cache is nonempty; skipped requests do
  not record zero-token savings even if compression ran and found nothing to drop.
- >-
  litellm_metadata is mutated in place when it exists (preserving references held by
  proxy and logging object); when it does not exist, a new dict is created and assigned
  to kwargs.
