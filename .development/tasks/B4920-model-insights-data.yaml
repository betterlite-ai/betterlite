oracle_cases: []
deviations: []
out_of_scope:
  - Calling the model-insights backend routes; this module has no server dependency.
  - Rendering the model insights page or using these functions in components; that belongs to B146.
pitfalls:
  - "Empty buckets must stay in buildSeries' returned array, not be filtered out. A range 2024-10-01 to 2024-10-07 with data only on 10-01 and 10-07 has entries for 10-02 through 10-06 with zero or default values."
  - "When halfShares compares two periods and one has zero total usage, its share delta is zero for every model, not NaN or undefined. This preserves the sorted order when one half is empty."
  - "UTC boundaries matter: toDay('2024-10-01T23:00:00Z') is the same day as toDay('2024-10-02T01:00:00Z') only in UTC, not in the user's timezone."
  - "Intl.NumberFormat locale is 'en-US' to match LiteLLM's formatting. The formatter is created once and reused, not recreated per value."
  - "Map iteration order is insertion order. buildBucketTotals must insert buckets in chronological order so iteration produces sorted results."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
