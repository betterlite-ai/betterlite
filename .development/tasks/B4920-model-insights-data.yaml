id: B4920
title: Model insights metric aggregation, time buckets and ranking
description: >-
  Implement pure TypeScript metric helpers for the model insights dashboard.
  Build response types ModelInsightsResponse, TaskSummary and ModelInsightTasksResponse consumed by the insights view.
  Functions bucket usage by UTC day or week, order models by spend, aggregate share changes, and format values for display.
  Preserve empty buckets, range-midpoint comparisons, and zero-delta behavior when either half has no usage.
  Format spend larger than 10,000 USD in compact notation (e.g., "1.2M" for 1,200,000).
  Functions use ECMAScript `Map`, `Date`, array operations, and `Intl.NumberFormat`; no server calls or external dependencies.
  metricValue extracts a value from a usage object. formatMetric compresses numbers to 3 significant figures.
  toDay returns a numeric UTC millisecond timestamp; isoDay converts one back to an ISO 8601 day string.
  modelOrder sums metric values per model and sorts descending by total.
  buildSeries returns an ordered array of per-bucket objects with one key per model plus date, preserving empty buckets.
  buildBucketTotals sums the gateway-wide daily total into day or week buckets as a Map.
  shareByModel computes each model's percentage share of total usage during a period.
  halfShares compares share deltas: given two date ranges, returns how each model's share changed from first to second, with zero-delta when a half has no usage.
  rankModels ranks models by total share or spend descending.
  Include Vitest tests: row() helper and suite callbacks for buildSeries with bucket initialization, buildBucketTotals, modelOrder, rankModels, and formatMetric.
scope:
  paths:
    - "ui/litellm-dashboard/src/app/(dashboard)/model-insights/_components/modelInsightsData.ts"
    - "ui/litellm-dashboard/src/app/(dashboard)/model-insights/_components/modelInsightsData.test.ts"
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/model-insights/_components/modelInsightsData.ts#L1-L150
    why: Response types ModelInsightsResponse (17-23), TaskSummary (24-32), ModelInsightTasksResponse (33), and metric helpers metricValue (41-45), formatMetric (49-61), toDay/isoDay (63-64), modelOrder (68-72), buildSeries (76-89), buildBucketTotals (91-100), shareByModel (102-110), halfShares (112-128) and rankModels (130-150).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/model-insights/_components/modelInsightsData.test.ts#L1-L139
    why: The Vitest suite structure, row helper and test case data covering buildSeries, buildBucketTotals, modelOrder, rankModels and formatMetric.
dod:
  - text: metricValue, formatMetric, modelOrder, buildSeries, buildBucketTotals and rankModels are exported; toDay, isoDay, shareByModel and halfShares are defined as module-private functions.
    proof: [metric-helpers-defined]
  - text: Response types ModelInsightsResponse, TaskSummary and ModelInsightTasksResponse are exported.
    proof: [metric-helpers-defined]
  - text: toDay returns the UTC millisecond timestamp for a day string's start; isoDay converts a millisecond timestamp back to a UTC ISO 8601 day string.
    proof: [date-functions-coverage]
  - text: formatMetric compresses values to 3 significant figures and formats values >= 10000 USD in compact notation.
    proof: [format-metric-coverage]
  - text: buildSeries returns an ordered array of per-bucket row objects with one key per model plus date, preserves empty buckets in the range, and initializes each bucket with zero values.
    proof: [build-series-coverage]
  - text: buildBucketTotals sums the gateway-wide daily total into day or week buckets using a Map keyed by bucket start date.
    proof: [bucket-totals-coverage]
  - text: modelOrder sums metricValue per model_group across rows and sorts the result descending by that total.
    proof: [model-order-coverage]
  - text: rankModels ranks models by share or spend descending.
    proof: [rank-models-coverage]
  - text: shareByModel computes each model's percentage of total usage during a period.
    proof: [share-by-model-coverage]
  - text: halfShares compares share deltas across two date ranges, with zero-delta when a half has no usage.
    proof: [rank-models-coverage]
  - text: Vitest suites for each function have test cases covering happy path, empty input, zero values and edge cases.
    proof: [insights-vitest-all]
checks:
