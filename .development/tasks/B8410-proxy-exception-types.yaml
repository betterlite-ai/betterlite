    why: ProxyException, its code rules and to_dict, and ModelAccessDeniedProxyException with the sanitized message.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L4390-L4559
    why: CommonProxyErrors messages, every ProxyErrorTypes value and the two mapping class methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L4943-L4976
