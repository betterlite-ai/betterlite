id: B8410
title: Proxy exception, error type values and special headers
description: >-
  Build the error record every LiteLLM proxy route returns and the small enums around it, all from litellm/proxy/_types.py. Auth checks, management routes and the request pipeline raise this record, so it goes low, in betterlite-error, where betterlite-auth and betterlite-server can both use it. Nothing here does I/O.

  Module `proxy_exception` (crates/betterlite-error/src/proxy_exception.rs, with submodules under crates/betterlite-error/src/proxy_exception/ and tests in proxy_exception/tests.rs).

  `ProxyException` mirrors LiteLLM's class of the same name (L4325-L4371). Build it with `ProxyException::new(init: ProxyExceptionInit)`, where ProxyExceptionInit has `message: String`, `error_type: String` (LiteLLM's `type`), `param: Option<String>`, `code: ExceptionCode`, `headers: BTreeMap<String, String>` (default empty), `openai_code: Option<String>` and `provider_specific_fields: Option<serde_json::Map<String, Value>>`. `ExceptionCode` is `Absent`, `Status(i64)` or `Text(String)`, because LiteLLM accepts an int, a string or None. The stored `code` is always a string: Status(429) gives "429", Text keeps its text, Absent gives "None" (Python's str(None)). The stored `openai_code` is the given openai_code when it is Some and not empty, otherwise the code as given (Absent stays None, Status(400) becomes "400"). Then the two message rules, in this order: when the message contains "No healthy deployment available" or "No deployments available", code becomes "429"; otherwise, when it contains "Not allowed to access model due to tags configuration" (RouterErrors.no_deployments_with_tag_routing in litellm/types/router.py), code becomes "401". Matching is case-sensitive substring search. Keep public read access to message, error_type, param, code, openai_code, headers and provider_specific_fields.

  `ProxyException::to_body(&self) -> ProxyErrorBody` is LiteLLM's to_dict. ProxyErrorBody serializes as {"message", "type", "param", "code"} in that order, param as JSON null when None, code as the stored string, plus "provider_specific_fields" only when that map is Some and not empty (LiteLLM tests it for truthiness). Implement Display as the message and std::error::Error for ProxyException.

  `ModelAccessDeniedProxyException` (L4374-L4387) holds a ProxyException built from message, error_type, param and code (no headers, no openai_code, no provider fields) plus `internal_message: String`. `sanitized_internal_message(&self) -> String` removes every "\r" and "\n". Give it `as_proxy_exception(&self) -> &ProxyException` so callers that catch any proxy exception see it.

  Module `proxy_error_types` (crates/betterlite-error/src/proxy_error_types.rs and its folder). `ProxyErrorTypes` (L4410-L4559) is a fieldless enum whose serde and Display text is the value: budget_exceeded, no_db_connection, token_not_found_in_db, key_model_access_denied, team_model_access_denied, user_model_access_denied, org_model_access_denied, project_model_access_denied, agent_model_access_denied, model_cost_map_missing, expired_key, auth_error, auth_provider_unavailable, internal_server_error, bad_request_error, not_found_error, validation_error, cache_ping_error, team_member_permission_error, key_vector_store_access_denied, team_vector_store_access_denied, org_vector_store_access_denied, team_member_already_in_team and tool_access_denied. Check the list against the reference before you write it. `ProxyErrorTypes::model_access_denied_for(object: ModelAccessObject) -> Self` maps Key, Team, User, Org, Project and Agent to the six *_model_access_denied values, and `vector_store_access_denied_for(object: VectorStoreObject) -> Self` maps Key, Team and Org to the three *_vector_store_access_denied values. Both input enums are closed, so the None that LiteLLM returns for an unknown string cannot happen. `CommonProxyErrors` (L4390-L4407) is a fieldless enum with an `as_str` that returns LiteLLM's exact message for db_not_connected_error, no_llm_router, not_allowed_access, not_premium_user, max_parallel_request_limit_reached, missing_enterprise_package and missing_enterprise_package_docker; copy the strings from the reference character for character.

  Module `proxy_enums` (crates/betterlite-error/src/proxy_enums.rs and its folder). `SpecialHeaders` (L4943-L4976) has the nine header values Authorization, API-Key, x-api-key, x-goog-api-key, Ocp-Apim-Subscription-Key, x-litellm-api-key, x-mcp-auth, x-mcp-servers and x-mcp-access-groups, each with `as_str`. `SpecialHeaders::litellm_credential_header_names() -> BTreeSet<String>` returns the lowercased names of the first six only (the MCP headers are not credentials): authorization, api-key, x-api-key, x-goog-api-key, ocp-apim-subscription-key and x-litellm-api-key. The configured general_settings.litellm_key_header_name is added by the caller, not here. `SupportedDbObjectType` (L124-L143) is a fieldless enum with LiteLLM's values (models, mcp, guardrails, policies, vector_stores, pass_through_endpoints, prompts, model_cost_map, tools, config_overrides, websearch_interception_settings; check the reference for any value above models) whose Display and serde text is the value, which is all its __str__ does.

  Tests: proxy_exception::tests covers code stringification for each ExceptionCode form, the openai_code fallback (None, empty string, given), each message rule and their order (a message with both phrases gives 429), header and provider-field passthrough, the body with and without provider fields (an empty map is left out) and the sanitized internal message. proxy_error_types::tests covers every value's text and both mapping functions for every input. proxy_enums::tests covers the nine header values, the six credential names and every SupportedDbObjectType text. Helper oracle cases compare to_body, the 429 and 401 rules, the sanitized message and the credential header set with LiteLLM.
scope:
  paths:
    - crates/betterlite-error/src/proxy_exception.rs
    - crates/betterlite-error/src/proxy_exception/**
    - crates/betterlite-error/src/proxy_error_types.rs
    - crates/betterlite-error/src/proxy_error_types/**
    - crates/betterlite-error/src/proxy_enums.rs
    - crates/betterlite-error/src/proxy_enums/**
    - crates/betterlite-error/Cargo.toml
    - tools/oracle/cases/helpers/proxy-exception/**
    - tools/oracle/helpers/b8410.py
    - tools/oracle/helpers/b8410/**
    - tools/oracle/src/helpers/error/b8410.rs
    - tools/oracle/src/helpers/error/b8410/**
  lint_tables: false
