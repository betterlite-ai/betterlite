dod:
  - text: The stored code is a string for int, string and absent codes, and openai_code falls back to the given code when it is missing or empty.
    proof: [exception-tests, oracle, helper-python]
  - text: A message with either no-deployment phrase gets code 429, a message with the tag-routing phrase gets 401, and the 429 rule wins when both appear.
    proof: [exception-tests, oracle, helper-python]
  - text: The error body has message, type, param and code, and carries provider_specific_fields only when the map is not empty.
    proof: [exception-tests, oracle, helper-python]
  - text: The model access denied exception keeps the client message and strips carriage returns and newlines from the internal message.
    proof: [exception-tests, oracle, helper-python]
  - text: Every ProxyErrorTypes value has LiteLLM's text and both mapping functions return the right value for every object kind.
    proof: [error-type-tests]
  - text: The credential header set holds exactly the six lowercased auth headers, and every SpecialHeaders and SupportedDbObjectType value has LiteLLM's text.
    proof: [enum-tests, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
    - id: exception-tests
      why: the proxy exception code rules, body or sanitized message are missing
      run: cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^proxy_exception::/)'
    - id: error-type-tests
      why: the error type values or their mapping functions are missing
      run: cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^proxy_error_types::/)'
    - id: enum-tests
      why: the special headers, the credential header set or the db object types are missing
      run: cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^proxy_enums::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b8410)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b8410 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b8410/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/helpers/proxy-exception/code-stringified.yaml
  - tools/oracle/cases/helpers/proxy-exception/no-healthy-deployment-429.yaml
  - tools/oracle/cases/helpers/proxy-exception/tag-routing-401.yaml
  - tools/oracle/cases/helpers/proxy-exception/provider-fields.yaml
  - tools/oracle/cases/helpers/proxy-exception/model-access-sanitized.yaml
  - tools/oracle/cases/helpers/proxy-exception/credential-headers.yaml
deviations:
  - what: Header values are typed strings, so LiteLLM's step that turns non-string header values into str is not built.
    why: A Rust caller cannot pass a non-string header value; what reaches the wire is the same.
  - what: The object-kind mappings take closed enums and always return a value, where LiteLLM returns None for an unknown kind.
    why: LiteLLM's callers only pass the declared literals; an unknown kind cannot be built in Rust.
out_of_scope:
  - "handle_exception_on_proxy and the exception handler that turns a ProxyException into an HTTP response: the proxy/utils.py and proxy_server.py parts of B124."
  - "should_load_db_object and general_settings.supported_db_objects parsing: B8380; this task only gives it the enum."
  - "The LiteLLM exception classes in litellm/exceptions.py and the error envelope already on main: B011 and B184 (crates/betterlite-error/src/error.rs and envelope.rs)."
  - "ModelAccessDeniedHTTPException in proxy/auth/model_access_denied.py: B747."
pitfalls:
  - LiteLLM sets code to "429" after it already stored str(code), so a ProxyException built with code 500 and the message "No deployments available for group x" still answers 429.
  - The tag-routing 401 rule is an elif, so it never runs when a no-deployment phrase matched first.
  - openai_code uses Python `or`, so an empty openai_code string falls back to the raw code, which may be an int in LiteLLM; store it as its decimal text.
  - to_dict leaves provider_specific_fields out for an empty dict too, not only for None.
  - litellm_credential_header_names skips x-mcp-auth, x-mcp-servers and x-mcp-access-groups even though they sit in the same enum.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
