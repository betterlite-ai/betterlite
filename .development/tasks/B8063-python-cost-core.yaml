id: B8063
title: Python cost_per_token, completion_cost and response_cost_calculator
description: >-
  Give `betterlite` the three cost functions users call most: `cost_per_token`, `completion_cost` and
  `response_cost_calculator`, with `get_response_cost_from_hidden_params`, `get_usage_object`, `has_hidden_params` and
  `get_replicate_completion_pricing`. The price rules are Rust: B068 holds `CostCalculator`, `completion_cost` and
  `response_cost_calculator`, and its parts hold the stages. This task adds the native family `cost` and the Python layer.
  Python converts response objects to JSON, calls Rust, and returns a float.


  Native family `cost`, as B5659 describes it: `src/cost.rs` with one `register` function, code in `src/cost/**`, types in
  `python/betterlite/_native_cost.pyi`, B5369 declares the `cost` family in `lib.rs` and `_native.pyi` with a stub `register` that this task fills. A `#[pyclass] NativeCost` is built
  once from a JSON settings text and owns B068's `CostCalculator` with B205's resolver and B193's price map (the
  `NativeCatalog` of B8061 is not shared across families, so each builds its own from the same bundled map and the
  runtime entries Python sends). Methods: `cost_per_token(request_json)` returning `[prompt_cost, completion_cost]`,
  `completion_cost(request_json)` returning `{cost, breakdown}` JSON, and `response_cost(request_json)`. Pure JSON
  conversions sit in `src/cost/convert.rs` with tests named `cost_request_` and `cost_result_`.


  Python lives in `python/betterlite/_cost/` with an explicit `__all__`. Signatures are
  copied from LiteLLM: `cost_per_token(model="", prompt_tokens=0, completion_tokens=0, response_time_ms=0.0,
  custom_llm_provider=None, region_name=None, prompt_characters=None, completion_characters=None,
  cache_creation_input_tokens=0, cache_read_input_tokens=0, custom_cost_per_token=None, custom_cost_per_second=None,
  number_of_queries=None, usage_object=None, rerank_billed_units=None, ...)` through the end of the parameter list at
  L379-L400, `completion_cost(completion_response=None, model=None, prompt="", messages=[], completion="", total_time=0.0,
  call_type=None, custom_llm_provider=None, region_name=None, size=None, quality=None, n=None, custom_cost_per_token=None,
  custom_cost_per_second=None, optional_params=None, custom_pricing=None, base_model=None,
  standard_built_in_tools_params=None, litellm_model_name=None, router_model_id=None, litellm_logging_obj=None,
  service_tier=None, data_residency=None, vertex_location=None)` and `response_cost_calculator(...)` at L1979-L2073. A test
  compares `inspect.signature` for each.


  Response objects (`ModelResponse`, `EmbeddingResponse`, `ImageResponse`, `TextCompletionResponse`, `RerankResponse`,
  `ResponsesAPIResponse` and the rest, from B5657 and B5658) go through `model_dump()` and carry `_hidden_params` along as a
  separate JSON field. `response_cost_calculator` first returns `0.0` when `cache_hit is True`, then returns the provider
  cost from `get_response_cost_from_hidden_params` (`additional_headers["llm_provider-x-litellm-response-cost"]`) when the
  response has `_hidden_params`, and only then calls Rust. `litellm_logging_obj` is a Python object: Python reads
  `model` and the cost breakdown hooks from it before the call and writes the returned breakdown back with the method
  `_store_cost_breakdown_in_logging_obj` uses (L1221-L1291). It is never put in the JSON. A pricing failure from Rust
  raises the exception class named in the native error through B158's `betterlite._completion.errors`, and a model that is
  not priced raises LiteLLM's "This model isn't mapped yet" text.


  `get_usage_object(completion_response)` (L1015-L1056) returns a `Usage` built from a dict, a pydantic response or a
  `ResponseAPIUsage`, and `None` when absent. `get_replicate_completion_pricing(completion_response, total_time=0.0)`
  (L759-L770) is plain arithmetic over the response's `usage` and the Replicate rate, and Python keeps it since no Rust task owns it.


  Tests compare floats exactly (`==`) with LiteLLM on the local map: plain chat usage, cached and cache-creation tokens,
  `custom_cost_per_token`, a per-second model, a tiered model above its threshold, an OpenAI `service_tier` of `flex`, a
  Bedrock `region_name`, an embedding response, a response that carries a provider cost header, and a cache hit.
scope:
  paths:
  - crates/betterlite-python/src/cost.rs
  - crates/betterlite-python/src/cost/**
  - crates/betterlite-python/python/betterlite/_native_cost.pyi
  - crates/betterlite-python/Cargo.toml
  - Cargo.lock
  - crates/betterlite-python/python/betterlite/_cost/**
  - crates/betterlite-python/tests/test_cost.py
  lint_tables: false
