- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/cost_calculator.py#L1221-L1291
  why: Where the cost breakdown goes on the logging object.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/cost_calculator.py#L1332-L1362
  why: completion_cost parameter list.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/cost_calculator.py#L1962-L2073
  why: Provider cost header and response_cost_calculator.
dod:
- text: "`cost_per_token` gives LiteLLM's pair of floats for the fixed usage list, and its signature equals LiteLLM's."
  proof: [cost-per-token]
- text: "`completion_cost` gives LiteLLM's float for chat, embedding, cached, custom-priced, per-second, tiered, service-tier and region cases, and its signature equals LiteLLM's."
  proof: [cost-completion]
- text: "`response_cost_calculator` returns 0.0 on a cache hit, the header cost when present, and otherwise the computed cost."
  proof: [cost-response]
- text: "The cost breakdown reaches `litellm_logging_obj` as in LiteLLM, and the logging object is not part of the JSON."
  proof: [cost-response]
- text: "`get_usage_object`, `get_response_cost_from_hidden_params` and `get_replicate_completion_pricing` match LiteLLM."
  proof: [cost-helpers]
- text: An unpriced model and a native pricing error raise LiteLLM's exception class and text.
  proof: [cost-completion]
- text: JSON conversions for every native method parse without an interpreter, and malformed text gives an error, not a panic.
  proof: [cost-native]
- text: The `_cost` package passes ruff and strict basedpyright.
  proof: [python-lint]
- text: >-
    This task adds every Cargo.toml dependency it uses and no unused ones.
  proof: [cost-per-token]
checks:
  optional: []
  commands:
  - id: cost-per-token
    why: A per-token price differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cost.py -k "per_token or signature"
  - id: cost-completion
    why: A completion cost or its error differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cost.py -k "completion_cost"
  - id: cost-response
    why: The cache hit, header or breakdown path differs.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cost.py -k "response_cost"
  - id: cost-helpers
    why: A small cost helper differs.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cost.py -k "usage_object or hidden_params or replicate"
  - id: cost-native
    why: A conversion breaks or panics.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^cost::/)'
  - id: python-lint
    why: A strict type error in the cost package.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`completion_cost` and `cost_per_token` return a Python `float` made from Rust's exact decimal result."
  why: B068 computes with exact money types, and LiteLLM's float arithmetic can differ in the last digit. The tests allow a relative difference of 1e-12 and list the cases where it shows.
- what: This task has no helper oracle cases.
  why: The pytest file compares both packages, and the pricing cases belong to B068 and its parts.
out_of_scope:
- "Price rules, tier selection, discounts, margins and tool fees are Rust (B068 and its parts)."
- "OCR, rerank, transcription, image, video, batch, vector store and realtime pricing are B8064."
- "`_select_model_name_for_cost_calc`, `_get_provider_for_cost_calc` and the other private helpers in cost_calculator.py L777-L1014, L1059-L1331 are private to the Rust calculator."
- "`cost_per_token`'s body (L401-L757) and `completion_cost`'s body (L1363-L1961) are Rust."
pitfalls:
- "`messages` has a mutable default `[]` in LiteLLM's signature, so keep the signature equal and never mutate it."
- "A response with `_hidden_params` that is a dict and one that is a pydantic object both count, and `additional_headers` may be missing."
- "`float(...)` of the provider cost header raises for non-numeric text, and LiteLLM lets that error out."
- "`model` may come from `completion_response.model`, so pass both to Rust and let it choose."
- "`total_time` is only used for per-second and Replicate pricing and is zero by default."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
