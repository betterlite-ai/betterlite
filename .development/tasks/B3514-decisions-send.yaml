dod:
  - text: >-
      prepare_request validates the environment first, builds the url from the validated model and api_base, copies the body, and logs pre_call once with the unsigned outbound headers only when a logging object exists. With no logging object nothing is logged and the send still works.
    proof: [request-prep-tests]
  - text: >-
      A SystemOne call to a TypeSafe mock with api_base set returns the SystemOne answers keyed as the request keyed its questions, with the provider's usage, and the mock sees one POST of the transformed body with bearer authorization and Content-Type application/json.
    proof: [send-behavior-tests, oracle, sdk-python]
  - text: >-
      An OpenAI-format call returns an OpenAI response whose model is the requested model name, not the canonical one, and the response shape follows the request shape for both sync and async sends.
    proof: [format-tests]
  - text: >-
      Hidden params on a formatted response hold model, provider_response_model and custom_llm_provider, add additional_headers with llm_provider-x-litellm-response-cost only when the config reports a cost, and are absent from the serialized response.
    proof: [format-tests]
  - text: >-
      A signed body is sent as raw content with no JSON, and an unsigned result is sent as JSON. The async path signs off the request task only when signs_with_aws is true for the api_base; the sync path always signs inline.
    proof: [signing-tests]
  - text: >-
      A provider HTTP 429 with a Retry-After header reaches the client as the mapped rate-limit error with status 429 and the original provider message, and a 401 as the mapped authentication error. The provider is called once and nothing retries.
    proof: [error-mapping-tests, oracle, sdk-python]
  - text: >-
      A connection failure or any error with no integer status becomes an APIConnectionError of status 500 with message `{Label} - {message}` for typesafe, hosted_vllm and strands_decider, and model `{provider}/{model}`.
    proof: [error-mapping-tests]
  - text: >-
      A provider answer that fails response validation (transform_decisions_response returns its 500 BaseLLMException) is mapped through exception_type, not through the synthesized-status branch.
    proof: [error-mapping-tests, oracle, sdk-python]
  - text: Newly added decisions-send SDK cases reach both adapters through B2401's case parser.
    proof: [sdk-corpus, oracle, sdk-python]

checks:
  optional: []
  commands:
    - id: request-prep-tests
      why: header validation, url building, body copying or pre_call logging order is wrong or missing
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::decisions_send::tests::request_prep/)'
    - id: send-behavior-tests
      why: the POST body, headers, timeout or sync and async client selection differs from the handler
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::decisions_send::tests::send_behavior/)'
    - id: format-tests
      why: the response shape, requested-model echo or hidden params are wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::decisions_send::tests::format_response/)'
    - id: signing-tests
      why: signed bodies, JSON fallback or the async signing split are wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::decisions_send::tests::signing/)'
    - id: error-mapping-tests
      why: transport, synthesized-status or response-validation errors are mapped to the wrong client error
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::decisions_send::tests::error_mapping/)'
    - id: sdk-python
      why: the real-handler HTTP adapter is missing or untyped
      run: test -f tools/oracle/sdk_http/decisions_send.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
    - id: sdk-corpus
      why: no new decisions_send call reaches the SDK HTTP parser
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/decisions-send-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
    - id: new-cases
      why: the SDK cases for send, provider errors and invalid answers are missing
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/decisions-send)"

oracle_cases:
  - tools/oracle/cases/sdk-http/decisions-send/systemone-typesafe.yaml
  - tools/oracle/cases/sdk-http/decisions-send/provider-rate-limit.yaml
  - tools/oracle/cases/sdk-http/decisions-send/invalid-provider-answer.yaml

deviations: []

out_of_scope:
  - B3513 owns prepare_call, DecisionsCall and reject_other_format; this task only consumes the call it returns.
  - B3515 owns adecisions, decisions, asystemone and systemone, which call asend and send here.
  - B8276 owns the HTTP routes, so the HTTP oracle cases for the Decisions routes belong there. This task uses SDK cases because no route reaches the send path yet.
  - B2402 owns the shared transport error conversion (_handle_error); B173 owns the pooled client; B595 owns run_aws_signing.
  - B3511 and B3512 own validate_environment, get_complete_url, sign_request, signs_with_aws and transform_decisions_response for each provider.
  - B186 owns exception_type and the other error classifiers.

pitfalls:
  - The synthesized-status branch is checked on BaseLLMException only; every other error type, such as a validation error from the response transform, goes straight to exception_type.
  - The label upper-cases only the first character, so `hosted_vllm` gives `Hosted_vllmException`, not `HostedVllmException`.
  - Pre-call logging gets the headers from validate_environment, before sign_request changes them, and the body copy, not the signed bytes.
  - With a signed body the request carries `content` and no `json`; passing both would send the body twice or drop the signature.
  - additional_headers is left out entirely when the cost is None, and the cost header key is `llm_provider-x-litellm-response-cost`, not the upstream `x-litellm-response-cost`.
  - The async client lookup can fail for a provider name the pool does not know, and that failure also goes through the exception mapping because it sits inside asend's try.
  - The OpenAI-format response gets requested_model, while the SystemOne response gets the IR request; mixing them returns the canonical model name to the client.

review_level: standard

