id: B3514
title: Send decision requests and format their responses
description: >-
  Build the send half of the Decisions API in betterlite-core, module api::decisions_send. It takes the DecisionsCall that B3513's prepare_call returns, posts its body to the provider, and turns the provider answer into the client response. Two LiteLLM pieces become one module: the handler methods _prepare_decisions_request, decisions and adecisions in llm_http_handler.py, and asend, send, _format_response, _formatted_response and _map_upstream_exception in decisions/call.py. B3515 calls asend and send; nothing here calls B3515.

  Public functions are `asend(call: &DecisionsCall) -> Result<DecisionsOutput, DecisionsSendError>` and `send(call: &DecisionsCall) -> Result<DecisionsOutput, DecisionsSendError>`. DecisionsOutput is an enum with the two B3510 response records, SystemOne `DecisionsResponse` and `OpenAIDecisionResponse`. DecisionsSendError carries the mapped client error from B184's taxonomy. The HTTP client comes in through the constructor of a DecisionsSender struct, from B173's pool, so tests can inject a client. The sync path uses the pool's default client. The async path asks the pool for the client of the call's provider, as get_async_httpx_client(llm_provider=...) does. Neither reads a global.

  Request preparation (_prepare_decisions_request), in this order: outbound headers come from `provider_config.validate_environment(headers, model, api_key)`; the url comes from `provider_config.get_complete_url(api_base, model)`; the data is a copy of call.body; then, only if a logging object exists, B249's pre_call runs with input=data, api_key, model and additional_args holding api_base=url, complete_input_dict=data and headers=outbound headers. Logging sees the headers before signing.

  Sending (decisions and adecisions): call `provider_config.sign_request(headers, url, api_base, body, api_key, litellm_params)`. It returns signed headers and an optional signed body. POST to the url with the signed headers and the call timeout (passed as it is, including None). When the signed body is present, send it as raw content and send no JSON; otherwise send the data as JSON. The sync path signs inline. The async path signs through B595's run_aws_signing (off the request task) only when `provider_config.signs_with_aws(api_base)` is true, and inline otherwise. Any transport error (a failed connection, or a status of 400 or more) goes through B2402's shared transport error conversion with the provider config, which asks `provider_config.get_error_class`. Then `provider_config.transform_decisions_response(model, custom_llm_provider, raw_response, request=call.ir_request)` gives the IR response. Errors from that call are not converted by the transport step.

  Exception mapping (_map_upstream_exception) wraps everything inside the handler call, not only the POST. A BaseLLMException whose status_code_is_synthesized is true becomes an APIConnectionError with message `{Label} - {original message}`, where Label is the provider name with its first character upper-cased and the rest unchanged, plus the literal `Exception` (typesafe gives `TypesafeException`, hosted_vllm gives `Hosted_vllmException`). Its llm_provider is the provider name and its model is `{provider}/{model}`. Every other error goes through B186's exception_type with model `{provider}/{model}`, the provider name and the original error. The mapped error replaces the original and keeps it as its source.

  Response formatting (_format_response): choose the shape from call.request, not from the provider. A SystemOne request uses B3511's ir_to_systemone_response(response, call.ir_request). An OpenAI request uses ir_to_openai_response(response, call.ir_request, call.requested_model), so the client sees the model name it sent. Then set hidden params on the result: `model` and `provider_response_model` both `{provider}/{model}` (the canonical model) and `custom_llm_provider`. When `provider_config.provider_reported_cost(response)` is not None, also set `additional_headers` to a map with the single key `llm_provider-x-litellm-response-cost` holding that float. With no cost the key `additional_headers` is not set at all. Hidden params never appear in the serialized body.

  Tests live in crates/betterlite-core/src/api/decisions_send/tests.rs and use a mock server and a test provider config. Include the full path through B3511's TypeSafe config for the SystemOne case. For the OpenAI-format case and the cost header, use a fake config where the real one is not in this crate's reach.

