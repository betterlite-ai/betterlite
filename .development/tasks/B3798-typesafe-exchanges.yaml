id: B3798
title: TypeSafe tool exchange checks
description: >-
  Build the TypeSafe (Jev) relevance-based compaction guardrail's core logic: state construction for
  completed tool exchanges and their evaluation through the `/v1/systemone` API. Preserve protected
  exchanges (system, last-user, last-assistant, prompt-cache breakpoints), middle truncation of long
  results, and the fail-open/fail-closed behavior when TypeSafe is unreachable.

  Implement the helpers: _as_str_object_dict and _as_object_list validate object structures without
  parsing; _safe_response_text extracts readable error messages from httpx responses; _truncate_for_state
  keeps the head and tail of long results within a character budget while preserving code structure;
  _question_instructions formats the yes/no question about task relevance; _tool_call_entry and
  _tool_call_entries extract function names and arguments from Anthropic tool_calls; _protected_indices
  expands LiteLLM's protected-message list by entire tool exchanges (so the most recent exchange is never
  evaluated).

  Implement the orchestration: _handle_failure logs or raises based on unreachable_fallback ("fail_open"
  or "fail_closed"); _candidate_exchanges filters tool exchanges by protection, minimum length and
  exchange completeness, capping evaluation to 200 exchanges; _exchange_tool_text concatenates tool
  and function message content for scoring; _build_state assembles the Jev input with the last-user
  task, system instructions, and indexed tool exchanges; _call_systemone posts to the API, handles
  connection errors and malformed responses, and returns the parsed relevance scores or None.

  Configuration types model api_base, api_key, model, unreachable_fallback, relevance_threshold,
  min_chars_to_evaluate, and max_result_chars_in_state, with defaults matching LiteLLM
  (api_base: https://api.typesafe.ai, model: "jev-latest", threshold: 0.2, min_chars: 200, max_chars: 4000).
  The ui_friendly_name method returns "TypeSafe (Jev) Compaction".

  Do not implement __init__, apply_guardrail or get_config_model; those stay in the final assembly.
  Call get_protected_indices from compression and group_tool_exchanges from B224; both are injected
  dependencies, never called indirectly through a framework. Preserve the exact text "[Tool result removed
  by TypeSafe compaction: judged no longer relevant to the current task]" as the dropped-result marker
  and the "\n... [middle truncated] ...\n" elision in truncation.

