dod:
  - text: _as_str_object_dict and _as_object_list parse objects through Pydantic TypeAdapter without
      panicking, returning None on validation failure.
    proof: [message-parsing-tests]
  - text: _safe_response_text extracts decoded response text, handles httpx.DecodingError, and truncates
      to the specified limit (default 500 chars).
    proof: [message-parsing-tests]
  - text: _protected_indices returns the union of compression's protected indices and entire tool-exchange
      groups that contain any protected message.
    proof: [protection-tests]
  - text: _truncate_for_state preserves the head and tail of long results within max_chars, using middle
      ellipsis "\n... [middle truncated] ...\n" as the separator.
    proof: [truncation-tests]
  - text: _question_instructions formats the Jev yes/no question with the exchange id and task context
      as LiteLLM does.
    proof: [instruction-tests]
  - text: "_tool_call_entry extracts {\"name\", \"arguments\"} from a tool_call, handling both OpenAI {\"function\": {}} and direct name/arguments layouts."
    proof: [tool-extraction-tests]
  - text: _tool_call_entries returns a tuple of all valid entries from assistant message tool_calls,
      ignoring malformed entries.
    proof: [tool-extraction-tests]
  - text: _candidate_exchanges filters tool exchanges to unprotected, complete (2+ messages), long enough
      (>= min_chars_to_evaluate), and caps results to 200.
    proof: [candidate-selection-tests]
  - text: _exchange_tool_text concatenates content from all tool/function messages in an exchange,
      using content_to_text on each.
    proof: [text-extraction-tests]
  - text: _build_state constructs the Jev input with task (last user message), system (joined system
      messages), and indexed tool_exchanges keyed e0, e1, etc.
    proof: [state-building-tests]
  - text: _call_systemone posts the state and questions to {api_base}/v1/systemone, parses the response
      shape _JevSystemOneResponse, and returns None on connection/parse/validation failure.
    proof: [api-call-tests]
  - text: _handle_failure logs warnings on fail_open or raises HTTPException with 502 status on fail_closed,
      preserving the error detail for logging.
    proof: [failure-handling-tests]
  - text: Configuration models serialize the seven configuration parameters (api_base, api_key, model,
      unreachable_fallback, relevance_threshold, min_chars_to_evaluate, max_result_chars_in_state)
      with correct defaults and validation.
    proof: [config-tests]
  - text: ui_friendly_name returns "TypeSafe (Jev) Compaction".
    proof: [config-tests]

