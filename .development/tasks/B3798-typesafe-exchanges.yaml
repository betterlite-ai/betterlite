deviations:
  - what: >-
      TypeSafe integration does not implement __init__, apply_guardrail or get_config_model in this task.
      Those functions remain in the final assembly (B108) which may depend on this task's helpers. The
      separation preserves modularity: helpers and orchestration are independent, while the orchestrator
      method depends on both.
    why: >-
      The outline allocates __init__, apply_guardrail and get_config_model to the final assembly to avoid
      a circular dependency: apply_guardrail calls the helpers owned here, but gets registered as a guardian
      hook by the initializer owned in B108. Rust forces this split more sharply than Python.
  - what: >-
      The protected-indices expansion is computed from LiteLLM's get_protected_indices, which will be provided by
      B005 (compression module). Until that task is merged, protected_indices calls a stub that returns empty.
    why: >-
      TypeSafe's core logic (truncation, state building, API calls) does not depend on protected indices for
      correctness; skipping protected exchanges is an optimization. The stub allows tests to run before B005
      merges, and the full implementation integrates once get_protected_indices is available.
  - what: >-
      Dropped tool results use the exact marker "[Tool result removed by TypeSafe compaction: judged no longer
      relevant to the current task]" and truncation uses "\n... [middle truncated] ...\n" as the elision marker.
    why: >-
      These strings are visible to users in model responses; they must match LiteLLM for compatibility with
      existing behaviors and monitoring that keys on these exact strings.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/typesafe/typesafe.py#L53-56

out_of_scope:
  - __init__, apply_guardrail and get_config_model, owned by the final assembly B108.
  - Configuration resolution and environment variable lookup, owned by B002.
  - HTTP client provisioning and pooling, owned by B173.
  - Tool-exchange grouping, owned by B224 (group_tool_exchanges is injected).
  - Protected-index computation, owned by B005 (get_protected_indices is injected).
  - Content-to-text extraction, supplied by the guardrail framework (content_to_text is injected).
  - Guardrail registration, lifecycle and callback logging, owned by B104.
  - Streaming response iteration and reassembly, owned by B2227.

pitfalls:
  - "_as_str_object_dict and _as_object_list must return None on validation failure, not panic. A malformed input is not a bug in the guardrail; it is a reason to skip evaluation and return the unmodified request."
  - "_protected_indices must deduplicate and preserve order when expanding tool-exchange groups. The same message index can be protected by multiple criteria (e.g., system role and cache control)."
  - "_truncate_for_state results land exactly at max_chars (never over): head + marker + (budget - head) = budget + marker = max_chars - marker + marker = max_chars. Tests should assert exact equality, not overflow cases."
  - "_candidate_exchanges caps evaluation to 200 exchanges to avoid quadratic evaluation cost. Tests must verify that when more than 200 exchanges exist, only the last 200 are kept."
  - "_question_instructions formats the question from the exchange id; if an exchange is dropped by the cap (not in candidates), it has no question and receives no relevance score."
  - "_handle_failure's fail_open path logs a warning without throwing, allowing the request to proceed uncompacted. fail_closed raises an HTTPException, but does not include the upstream error body in the response (only in logs) to avoid leaking TypeSafe's error details to clients."
  - "_build_state iterates messages forward to accumulate task/system, then iterates backward to find the last user message. Reversed iteration finds the most recent task context without redundant scans."
  - "_call_systemone must handle httpx.HTTPStatusError (status errors), invalid UTF-8 decoding errors and validation errors separately. Connection timeouts, DNS failures and other asyncio exceptions are caught as generic Exception and logged without crashing."

