deviations:
  - what: "Configuration defaults are applied in the Rust constructor the same way LiteLLM applies them in Python __init__: missing values get hardcoded defaults, and coerce_event_hook logic is replicated."
    why: >-
      Defaults must match exactly so betterlite deployments migrate from LiteLLM without surprises.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/__init__.py#L35-L67"
  - what: "The recovery store uses OrderedDict with per-process state scoped by (caller hash, call_id) for multi-tenant isolation."
    why: >-
      Per-tenant isolation prevents one caller from reading another's compressed originals; the caller scope is derived from virtual-key auth.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L572-L577"
  - what: "Message writeback adds recovery markers only when stored originals fit within the per-call byte budget; no marker is added if the budget is exceeded."
    why: >-
      This preserves the marker-only-on-store invariant: a marker is never issued without storing the original.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L883-L902"
  - what: "Responses texts channel mirror applies replacements only when unambiguous: one compression result per text, and the text occurs in texts the same number of times as in the compressed messages."
    why: >-
      Ambiguous replacements (same text with different compressions, or mismatched occurrence counts) are skipped to avoid replacing the wrong instance.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L921-L943"
  - what: >-
      Tool injection calls has_compresr_retrieve_tool (from B3764) to detect existing retrieve tools before merging, rather than checking tools directly.
    why: >-
      The detection function is shared and centralized in B3764 so both B3765's injection and B3764's agentic loop use consistent logic. B3765 depends on B3764, so this forward reference is safe.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L302-L303"
out_of_scope:
  - "Compression transport and API calls: B3763 owns _call_compress and the HTTP compression request."
  - "Recovery store eviction and retrieval: B3764 owns per-key storage, TTL pruning, the _retrieve_original method on retrieval, and has_compresr_retrieve_tool detection."
  - "Query selection and content projection: B3763 owns _query_for_target, _render_tool_intent, and IP/URL validation."
  - "Recovery plan building and agentic loop: B3764 owns async_should_run_agentic_loop, async_build_agentic_loop_plan, and follow-up message formatting."
  - "Content text utilities: B3663 owns is_all_text_parts, merge_rewritten_text_parts, and content_to_text."
pitfalls:
  - "CompresrGuardrailOptionalParams and CompresrGuardrailConfigModel are Pydantic models. The optional params are all nullable to let the constructor apply defaults; the config model provides the guardrail_name and event_hook that the constructor inherits from CustomGuardrail."
  - "API key resolution is checked at __init__ time: get_secret_str (the proxy's env-lookup function) must be available; if the key is empty after env lookup, raise ValueError immediately so startup fails loud."
  - "The recovery store is per-process in a HashMap at _originals_by_call_id; enable_retrieval=true logs a warning about multi-worker deployments needing --workers 1 or disable_retrieval."
  - "Bypass header is x-compresr-bypass (lowercase), and its value is coerced to bool via str().lower() == \"true\", so any case variation is accepted."
  - "Target selection skips messages that are too short (< min_chars_to_compress chars after content_to_text), have non-text multipart content, or don't match the role/position filters."
  - "_select_targets returns indices in order; _apply_compression_results pairs them with contexts and results in order, so alignment is by position, not by message identity."
  - "Message writeback only replaces when compressed_context is a non-empty string that differs from the original text. Identical text is treated as no-op so unchanged requests are not rewritten downstream."
  - "Recovery markers are 24-character SHA-256 prefixes; appending to the compressed text (e.g. \"...compressed...hash123\") preserves the marker in all content shapes (string, text parts)."
  - "Ambiguous text (same original, different compressions due to different queries) is tracked; if a text has multiple compressions, no replacement is applied (safe-fail)."
  - "The texts mirror applies replacements only when the count matches: if a text is compressed N times in messages but appears M times in texts (M != N), no replacement is applied."
  - "Tool injection calls has_compresr_retrieve_tool (from B3764) to detect existing retrieve tools before merging, since B3764 owns the detection logic and B3765 depends on B3764."
  - "Fail_open logs and returns None to signal the caller to forward uncompressed; fail_closed raises HTTPException(502) with a generic detail dict, never the upstream response body or API key."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
