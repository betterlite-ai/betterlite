id: B3765
title: Compresr settings and compressed message writeback
description: >-
  Build Compresr guardrail initialization, configuration types, and message writeback pipeline.
  The CompresrGuardrailConfigModel provides typed config fields including api_key, api_base (defaulting to https://api.compresr.ai), compression model, and all tuning knobs: target_compression_ratio, coarse/dynamic flags, min_chars_to_compress, compression targets (tool_outputs, system, history, last_user), enable_retrieval flag, max_bytes_per_call per-call budget, allow_bypass_header for testing, and compression_params passthrough for new API features.

  The CompresrGuardrail class constructor applies defaults (0.5 compression ratio, latte_v2 model, 500 char minimum, tool outputs only), validates api_base to reject non-http(s) and cloud-metadata addresses, requires an API key from the config or COMPRESR_API_KEY env var, and initializes the per-call recovery store (_originals_by_call_id) when enable_retrieval is on.

  The main apply_guardrail entry point runs on request inputs: it checks for bypass header if enabled, extracts the fallback user query, selects eligible messages (respecting compress_tool_outputs, compress_system, compress_history, compress_last_user flags and min_chars_to_compress), calls the compression API, and applies results to a message copy. Message writeback (via _apply_compression_results) replaces message content with compressed text, stores original text hashes for recovery when enabled, dedupes compression results for ambiguous text replacements, and mirrors replacements into the Responses texts channel when applicable.

  Tool injection merges the compresr_retrieve tool into the request's tool list so the model can recover original content during agentic loops. The bypass header (x-compresr-bypass: true) skips compression for a single call when allow_bypass_header is on.

  Configuration defaults match LiteLLM's: api_base DEFAULT_API_BASE, compression_model DEFAULT_COMPRESSION_MODEL, target_compression_ratio 0.5, coarse true, min_chars_to_compress 500, compress_tool_outputs true, compress_system false, compress_history false, compress_last_user false, enable_retrieval true, max_bytes_per_call 10 MiB, allow_bypass_header false, dynamic true. Unsupported keys in config stop startup with a list of them; every guardrail config option is registered so a new feature does not require a code change.
