dod:
  - text: CompresrGuardrailConfigModel loads from guardrail config and provides all tuning knobs with LiteLLM defaults.
    proof: [config-loading]
  - text: CompresrGuardrail __init__ validates api_base, requires an API key, applies configuration defaults, and initializes the recovery store.
    proof: [config-tests, guardrail-init]
  - text: Configuration defaults match LiteLLM exactly (0.5 ratio, latte_v2, 500 chars, tool outputs only, recovery on, 10 MiB cap).
    proof: [config-tests]
  - text: Unsupported config keys are rejected at startup with a full list of them.
    proof: [unsupported-keys]
  - text: apply_guardrail extracts fallback query, selects targets respecting all compress_* flags, calls the compression API, and applies results to messages.
    proof: [apply-guardrail-tests]
  - text: Message writeback replaces content with compressed text, stores hashes for recovery when enabled, and dedupes ambiguous replacements.
    proof: [writeback-tests]
  - text: Responses texts channel mirrors compressed content only when unambiguous (one compression per text, all occurrences accounted for).
    proof: [writeback-tests]
  - text: Tool injection builds a _build_compresr_retrieve_tool definition and merges it with existing tools; detection of the tool calls is delegated to B3764's has_compresr_retrieve_tool function.
    proof: [tool-injection-tests]
  - text: The x-compresr-bypass header skips compression for a single call when allow_bypass_header is on.
    proof: [bypass-header-tests]
  - text: Failure handling respects fail_open (log and forward uncompressed) and fail_closed (raise 502 with generic message, never upstream details).
    proof: [failure-handling-tests]
  - text: Recovery store is initialized with correct OrderedDict and per-process state when enable_retrieval is on.
    proof: [recovery-store-init]
checks:
  optional: []
  commands:
    - id: config-loading
      why: Configuration types or defaults do not load correctly
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::compresr_writeback::tests::/)' --no-capture
    - id: config-tests
      why: CompresrGuardrail initialization or configuration fails
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_settings::tests::/)' --no-capture
    - id: guardrail-init
      why: Recovery store or request headers initialization is incorrect
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_settings::.*init(::|$)|^compresr_settings::.*store(::|$)|^compresr_settings::.*header(::|$)/)' --no-capture
    - id: unsupported-keys
      why: Configuration does not reject unsupported keys
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::compresr_writeback::tests::.*unsupported(::|$)/)' --no-capture
    - id: apply-guardrail-tests
      why: apply_guardrail entry point, target selection, or bypass logic fails
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_writeback::tests::.*apply_guardrail(::|$)|^compresr_writeback::tests::.*select_targets(::|$)|^compresr_writeback::tests::.*bypass(::|$)/)' --no-capture
    - id: writeback-tests
      why: Message writeback, recovery marker application, or texts channel mirroring fails
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_writeback::tests::.*writeback(::|$)|^compresr_writeback::tests::.*mirror(::|$)|^compresr_writeback::tests::.*recovery(::|$)|^compresr_writeback::tests::.*ambiguous(::|$)/)' --no-capture
    - id: tool-injection-tests
      why: Tool injection or compresr_retrieve merge fails
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_writeback::tests::.*tool_injection(::|$)|^compresr_writeback::tests::.*merge_tool(::|$)/)' --no-capture
    - id: bypass-header-tests
      why: Bypass header detection or skipping fails
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_settings::tests::.*bypass_header(::|$)/)' --no-capture
    - id: failure-handling-tests
      why: fail_open or fail_closed failure handling does not match LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_writeback::tests::.*fail_open(::|$)|^compresr_writeback::tests::.*fail_closed(::|$)/)' --no-capture
    - id: recovery-store-init
      why: Recovery store is not initialized correctly or per-process state is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_settings::tests::.*recovery_store(::|$)/)' --no-capture
