id: B3632
title: Anthropic interrupted stream usage recovery
description: >-
  Build the recovery of token usage and cost for an Anthropic pass-through stream that ended early, in betterlite-server at src/pass_through_logging/interrupted_stream_usage.rs (the skeleton declares it).
  Why it exists: when a client disconnects mid-stream, Anthropic has sent message_start, which carries a placeholder output_tokens of 1 to 3, but not the final message_delta that carries the real count. Without this task the failure log bills about a twentieth of the real output.
  The task rebuilds the response from the buffered chunks, re-counts the output text when the stream was cut, and hands usage and cost to the failure log.
  Nothing here holds module-level state. Collaborators come in as arguments: B3630's call log accessors and cost helpers, B3631's reconstruction functions, B196's token count, B218's get_content_from_model_response, and B251's record_partial_usage_for_failure on the per-call log.


  Chunk and error types. Every function takes the raw chunks as a slice of the chunk type B3630's stream_fields module already uses for extract_message_start_field (one entry is text or bytes). Do not define a second chunk type. The module has one thiserror enum, InterruptedStreamUsageError, with variants for invalid UTF-8 in a chunk (the source is B3630's stream_fields error), a failed reconstruction (source B3631's error), a failed token count (source B196's error) and a failed cost (source B3630's response_costing error).


  Public surface, pinned. B3609 (partial usage on a failed stream) and B3634 (the success-side collected chunks handler) call these two; they are `pub` and their names and argument lists do not change.
  `pub fn record_partial_usage_for_failure(call_log: &mut CallLog, request_body: &RequestBody, all_chunks: &[StreamChunk]) -> Result<(), InterruptedStreamUsageError>`
  `pub fn build_streaming_response_for_logging(call_log: &CallLog, request_body: &RequestBody, all_chunks: &[StreamChunk], model: &str) -> Result<Option<AssembledResponse>, InterruptedStreamUsageError>`
  CallLog is B247's per-call log (what LiteLLM calls the logging object with its model_call_details), RequestBody is the parsed JSON body B3630's functions take, and AssembledResponse is the enum B2227's stream assembly returns (a chat ModelResponse or a TextCompletionResponse). Use the exact type names the merged B247, B3630 and B2227 code exports; the names above are the roles. Each collaborator is a generic parameter bounded by the trait its owner exports (no `impl Trait` arguments, no `dyn`); the two pinned functions carry those generics, the argument lists above do not change.
  The other five functions are `pub(crate)` so B3634 and the tests reach them: `stream_was_interrupted`, `recover_interrupted_stream_output_tokens`, `clear_placeholder_cost`, `usage_only_response_or_none`, `assemble_streaming_response`. Drop LiteLLM's leading underscore from every name.


  stream_was_interrupted(all_chunks) -> Result<bool, InterruptedStreamUsageError>. Walk the chunks from the last to the first, and inside each chunk the lines from the last to the first. Decode bytes as strict UTF-8 and return the typed error on bad bytes (LiteLLM lets UnicodeDecodeError out). Split a chunk into lines the way Python's str.splitlines does (\n, \r, \r\n, \v, \f, \x1c, \x1d, \x1e, \x85, U+2028, U+2029). Skip a line that does not start with "data:". Strip the rest of the line with Python's strip() whitespace rules and parse it as JSON; skip a line that fails to parse or is not an object (so "data: [DONE]" is skipped). Decide on the first event whose "type" is one of these three: "message_delta" gives false; "content_block_delta", "content_block_stop" and "message_start" give true. Any other type (message_stop, ping, error, a missing or non-string type) is skipped and the walk continues. When the walk ends without a decision, including an empty chunk list, the answer is true.
  If B3630's stream_fields module already exposes a Python-style line splitter and strip to the crate, use it; if it does not, write one private helper here and list the duplicate in the task's notes for the architect. The fuzz target below is for this decoder.


  recover_interrupted_stream_output_tokens(response, all_chunks, model) -> Result<bool, InterruptedStreamUsageError>. It takes the response by mutable reference and returns true only when it changed the usage. Run these guards in this order, each one returns false: the response is a text completion and not a chat ModelResponse; stream_was_interrupted is false; the response has no usage; the output text is empty. The output text is B218's get_content_from_model_response on the response: for each chat choice, the message content, then the function_call as JSON, then every tool call as JSON, all concatenated. Count it with B196's token count in text mode with model set to the `model` argument (the logged model, not the costing model) and the count-response-tokens flag on. A count error logs at warn "Could not re-tokenize interrupted stream output; keeping placeholder completion token count." and returns false; it never reaches the caller. When the recovered count is not greater than the usage's completion_tokens (a missing value is 0), return false and change nothing. Otherwise set completion_tokens to the recovered count, total_tokens to prompt_tokens (missing is 0) plus the recovered count, and, only when completion_tokens_details exists and its text_tokens is set, text_tokens to the recovered count. Anthropic costing reads text_tokens, so leaving the message_start placeholder there keeps the spend low. Return true.
  When B196's disable_token_counter setting is on, the count is 0, which is never greater than the placeholder, so nothing changes.


  clear_placeholder_cost(response). Sets the response usage's cost to none and removes "response_cost" from the response's hidden params. LiteLLM also takes the usage as a second argument, but there it is the same object as response.usage; Rust has no aliasing, so the function takes only the response.


  usage_only_response_or_none(all_chunks, model, speed) -> Option<AssembledResponse>. Call B3631's usage-only builder (LiteLLM's _build_usage_only_response_from_chunks). On Ok return its answer. On any error log at warn "Anthropic passthrough: usage-only fallback failed (model={model}): {error}" and return none. It never returns an error.


  assemble_streaming_response(all_chunks, call_log, model, speed) -> Option<AssembledResponse>. Call B3631's full reconstruction (LiteLLM's _build_complete_streaming_response). On Ok(Some) return that response. On Ok(None) call usage_only_response_or_none with no extra log. On an error log at warn "Anthropic passthrough: stream assembly raised (model={model}): {error}; falling back to usage-only cost from raw SSE events." and call usage_only_response_or_none. It never returns an error.


  build_streaming_response_for_logging(call_log, request_body, all_chunks, model). Run assemble_streaming_response with speed from B3630's cost_relevant_speed(request_body). When the result is none or a text completion, return it unchanged. When it is a chat response, run recover_interrupted_stream_output_tokens, and only when that returned true run clear_placeholder_cost, so the cost that was built from the placeholder is dropped and the later cost step prices the corrected tokens. Return the response. An error from stream_was_interrupted or the recovery token count path other than the logged warning comes back as the typed error.


  record_partial_usage_for_failure(call_log, request_body, all_chunks). Do nothing for an empty chunk list. Otherwise: model from B3630's resolve_logged_model; the response from build_streaming_response_for_logging; when there is no response or it has no usage, return Ok(()) without recording; else the cost from B3630's cost_partial_stream_or_zero(response, model, call_log) and then B251's call log record_partial_usage_for_failure(usage, cost). B251 stores the usage under model_call_details["combined_usage_object"] and the cost under "response_cost"; this task only calls it. Read the usage from either response variant.


  Tests: module tests under pass_through_logging::interrupted_stream_usage::tests, every name starting interrupted_. Fakes stand in for the token counter, the cost service and the call log (reuse the fakes B3630's tests define where they are exported to the crate, otherwise write small ones). Cover: the tail walk on a completed stream, a cut mid content_block_delta, a cut after content_block_stop, a message_stop-only tail, an empty list and a [DONE] tail; recovery that raises tokens, keeps them when the recount is lower or equal, skips an empty text, tolerates a token count error with the warning, corrects text_tokens only when present and uses tool call JSON as output text; the assembled-then-usage-only fallbacks with their log lines; and record_partial_usage_for_failure recording usage plus a cost of 0.0 on a costing error.
  Oracle: helper cases for the pure functions through the helper operation named after this task. They call the pinned Python static functions on stub objects and never copy the algorithm. There is no route for this code yet; the umbrella adds the HTTP cases.
  Fuzz: stream_was_interrupted decodes bytes from outside. Add the cargo-fuzz target stream_interrupted in betterlite-server/fuzz that feeds it arbitrary byte chunks and asserts no panic, plus a corpus replay test named replays_the_stream_interrupted_corpus.
