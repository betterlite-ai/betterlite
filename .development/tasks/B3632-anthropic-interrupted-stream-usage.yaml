dod:
  - text: stream_was_interrupted decides on the first message_delta (false) or content_block_delta, content_block_stop or message_start (true) found from the tail, skips other events and bad lines, and returns true for an empty list or when nothing decides.
    proof: [interrupted-tests, interrupted-oracle]
  - text: stream_was_interrupted splits lines like Python splitlines, strips like Python strip, and returns a typed error on invalid UTF-8.
    proof: [interrupted-tests, interrupted-oracle]
  - text: The tail decoder has a fuzz target that replays its corpus without a panic.
    proof: [interrupted-corpus]
  - text: recover_interrupted_stream_output_tokens raises completion_tokens, total_tokens and a present text_tokens only when the stream was cut and the recount is higher, and leaves usage alone for a completed stream, a text completion, missing usage, empty output text or a lower recount.
    proof: [interrupted-tests, interrupted-oracle]
  - text: A token count error in the recovery logs the re-tokenize warning and keeps the placeholder count instead of failing the caller.
    proof: [interrupted-tests]
  - text: clear_placeholder_cost removes the usage cost and the hidden response_cost, and build_streaming_response_for_logging calls it only after a recovery that changed usage.
    proof: [interrupted-tests, interrupted-oracle]
  - text: assemble_streaming_response falls back to the usage-only response on an assembly error (with its warning) and on an empty result (without one); usage_only_response_or_none turns an error into a warning and none.
    proof: [interrupted-tests]
  - text: record_partial_usage_for_failure does nothing for empty chunks or a response without usage, and otherwise records the usage with the partial stream cost, using 0.0 when costing fails.
    proof: [interrupted-tests]
  - text: The helper adapter's Python passes the strict lint and type check.
    proof: [helper-python]
checks:
  optional: []
  commands:
    - id: interrupted-tests
      why: the interrupted stream detection, token recovery, fallbacks or failure recording are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::interrupted_stream_usage::tests::interrupted_/) - test(replays_the_stream_interrupted_corpus)'
    - id: interrupted-corpus
      why: the tail decoder has no fuzz target, no new corpus seeds or the replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/stream_interrupted)" &&
        grep -q 'stream_was_interrupted' crates/betterlite-server/fuzz/fuzz_targets/stream_interrupted.rs &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_stream_interrupted_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3632)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3632 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3632/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/interrupted_stream_usage-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: interrupted-oracle
      why: newly added helper cases are absent, do not use the b3632 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/interrupted-stream-usage)" &&
        grep -rlE '^[[:space:]]+b3632:' tools/oracle/cases/helpers/interrupted-stream-usage &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/interrupted-stream-usage
oracle_cases:
  - tools/oracle/cases/helpers/interrupted-stream-usage/tail-completed-message-delta.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/tail-cut-mid-content-block-delta.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/tail-message-stop-then-delta.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/tail-empty-and-done-only.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/tail-splitlines-boundary.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/recover-raises-placeholder.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/recover-completed-stream-unchanged.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/recover-lower-recount-unchanged.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/recover-text-tokens-absent.yaml
  - tools/oracle/cases/helpers/interrupted-stream-usage/clear-placeholder-cost.yaml
deviations:
  - what: clear_placeholder_cost takes only the response, not the response and its usage.
    why: In LiteLLM the usage argument is the same object as response.usage; Rust has no aliasing, so a second argument would be a copy that clears nothing.
  - what: recover_interrupted_stream_output_tokens returns whether it changed the usage, not the usage object.
    why: The only caller tests the result for none and then clears the cost; the response already holds the corrected usage.
  - what: Failures are typed errors where LiteLLM lets Python exceptions (UnicodeDecodeError out of stream_was_interrupted) propagate, and the catch-all `except Exception` blocks catch only the typed errors of the steps they wrap.
    why: Rust has no runtime attribute errors and a panic is banned by the no-panics rule, so the typed error is the only failure left to catch.
  - what: The token count error branch catches B196's typed error only.
    why: LiteLLM's bare `except Exception` also hides Python bugs such as a missing attribute; betterlite has no such class of failure.
out_of_scope:
  - "anthropic_passthrough_handler, _create_anthropic_response_logging_payload and _handle_logging_anthropic_collected_chunks: B3634 owns them. It calls build_streaming_response_for_logging from this task."
  - "batch_creation_handler, _store_batch_managed_object and get_actual_model_id_from_router: B3633 owns Anthropic batch logging."
  - "_split_sse_chunk_into_events, _build_complete_streaming_response, _collapse_pure_text_chunks, _build_complete_streaming_response_legacy, _extract_sse_data and _build_usage_only_response_from_chunks: B3631 owns the stream reconstruction. This task only calls its full reconstruction and its usage-only builder."
  - "_cost_relevant_speed, _resolve_costing_model, _resolve_logged_model, _cost_partial_stream_or_zero, _compute_response_cost, _extract_message_start_field, _extract_model_from_anthropic_chunks, _extract_response_id_from_anthropic_chunks and _get_user_from_metadata: B3630 owns them and its covers include the file."
  - "Logging.record_partial_usage_for_failure and record_assembled_response_for_failure on the per-call log: B251 owns them."
  - "PassThroughStreamingHandler._record_partial_usage_for_failure and schedule_stream_failure_logging, which choose this task's function for the Anthropic endpoint type: B3609 owns them."
  - "get_content_from_model_response (B218), token_counter (B196), stream_chunk_builder (B2227) and AnthropicConfig.calculate_usage (B579)."
pitfalls:
  - The usage-only response built from raw events has message content "" so recover_interrupted_stream_output_tokens finds no output text and never corrects it; an interrupted stream that fell back to usage-only keeps the message_start output_tokens placeholder.
  - A stream that ends with content_block_stop but no message_delta still counts as interrupted; only message_delta marks it complete, and message_stop alone does not.
  - The walk skips a message_stop or ping at the tail and keeps looking back, so "message_delta, message_stop" is complete and "content_block_delta, ping" is interrupted.
  - The recount uses the logged model, while the cost uses resolve_costing_model's model; passing the costing model to the token counter changes the tokenizer choice for a "passthrough/..." model group.
  - A recount that is equal to or lower than completion_tokens changes nothing, so a short interrupted stream whose placeholder is already right keeps its cost and hidden response_cost.
  - text_tokens is touched only when completion_tokens_details exists and text_tokens is not none; do not create the details object when it is missing.
  - clear_placeholder_cost runs only after a recovery returned true; clearing it on every chat response would drop the response_cost that a completed stream legitimately carries.
  - assemble_streaming_response logs the "stream assembly raised" warning only for an error, and an Ok(None) reconstruction goes to usage-only silently.
  - record_partial_usage_for_failure returns without recording when there are no chunks or no usage, so the failure row keeps the cost and usage the call log already held.
  - cost_partial_stream_or_zero swallows costing errors into 0.0 and the call log still gets the recovered usage, so tokens are billed with a zero cost rather than lost.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
