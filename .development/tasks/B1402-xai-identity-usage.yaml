id: B1402
title: xAI credential selection, usage reconciliation and reported charges
description: >-
  Build xai_identity and xai_usage in betterlite-openai. The first owns common_utils.py
  except XAIModelInfo.get_provider_info, already B2220. Resolve explicit api_key, xai_key,
  then XAI_API_KEY for chat; the legacy mode inserts litellm.api_key after xai_key. Read
  module values through litellm_settings and environment through betterlite-config. Base
  discovery uses explicit api_base, XAI_API_BASE, then https://api.x.ai, appending /v1/models
  literally. Headers replace Authorization only for a non-None key and insert Content-Type
  application/json only when neither supported casing exists. Model discovery prefixes every
  returned id with xai/; base-model normalization removes every xai/ substring. Add loader
  test xai_identity_settings for xai_key, XAI_API_KEY and XAI_API_BASE; reuse B1400's base
  setting if present. Parse model-list JSON with bounded decode_xai_models and fuzz it.

  Own every function in cost_calculator.py plus xai_reported_cost_in_usd and chat's
  fold_reasoning_tokens_into_completion, _normalize_openai_compatible_usage_totals and
  _usage_restated_from_xai_ticks. Integer nonboolean nonnegative ticks divide by exactly
  10000000000 using Decimal. A valid finite nonnegative usage.cost bypasses token prices,
  yielding input cost zero and output cost equal to the reported charge; it also suppresses
  web-search charges. Otherwise pass adjusted Usage with completion details cleared to an
  injected GenericTokenPricing delegate, supplied later by B068. Fold reasoning only when
  total equals prompt+completion+reasoning and differs from prompt+completion; then raise a
  deficient total to prompt+completion without lowering a larger one. Preserve idempotence.
  Attach server_side_tool_usage_details even when web_search_calls cannot be converted;
  only positive converted counts populate prompt_tokens_details.web_search_requests.
  Search pricing tries positive medium, low, high rates in that order, falling back to
  0.005 per call. Use parsed typed usage/model prices from B004/B193/B204, not a second
  catalog or decimal parser. Helper xai_usage covers tick rejection, reported zero,
  folded/raw reasoning, malformed search count and rate precedence; helper xai_identity
  covers both key modes and header casing without sending requests. Count 192 lines in
  common/cost after excluding B2220's ten, plus 73 shared chat-usage lines; budget 280
  implementation, 220 behavior/config tests, 150 adapters and 100 fuzz/wiring, maximum 800.
