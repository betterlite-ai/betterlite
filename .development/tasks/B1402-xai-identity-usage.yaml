    - crates/betterlite-openai/src/{lib,error,xai_identity,xai_usage}.rs
    - crates/betterlite-openai/src/{xai_identity,xai_usage}/**
    - crates/betterlite-openai/fuzz/Cargo.toml
    - crates/betterlite-openai/fuzz/fuzz_targets/xai_models.rs
    - crates/betterlite-openai/fuzz/corpus/xai_models/**
    - crates/betterlite-config/src/{lib,config,settings,model,env,providers,tests}.rs
    - crates/betterlite-config/src/providers/xai.rs
    - crates/betterlite-config/src/providers/xai/identity.rs
    - crates/betterlite-config/src/tests/xai_identity.rs
    - crates/betterlite-config/fuzz/corpus/config_yaml/xai_identity*
    - tools/oracle/src/helpers/openai/xai_identity.rs
    - tools/oracle/src/helpers/openai/xai_identity/**
    - tools/oracle/helpers/xai_identity.py
    - tools/oracle/helpers/xai_identity/**
    - tools/oracle/src/helpers/openai/xai_usage.rs
    - tools/oracle/src/helpers/openai/xai_usage/**
    - tools/oracle/helpers/xai_usage.py
    - tools/oracle/helpers/xai_usage/**
    - tools/oracle/cases/helpers/{xai-identity,xai-usage}/**
    - tools/oracle/fuzz/corpus/helper_case/xai_identity*
    - tools/oracle/fuzz/corpus/helper_case/xai_usage*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/common_utils.py#L11-L107
    why: Cost ticks, endpoint-specific key order and model discovery; capability declaration remains B2220.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/cost_calculator.py#L17-L144
    why: Provider-reported charges take precedence over token and search pricing.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/chat/transformation.py#L34-L38
    why: Chat Usage copy retaining every field except the restated cost.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/chat/transformation.py#L304-L404
    why: Shared reasoning and total normalization; enhancement method in this span remains B1403.
dod:
  - text: Key precedence and default base differ exactly where the xAI endpoint families require it.
    proof: [xai-identity-tests, xai-identity-config, oracle, xai-usage-python]
  - text: Reported charges, reasoning reconciliation and search usage preserve zero and invalid-value behavior.
    proof: [xai-usage-tests, oracle, xai-usage-python]
  - text: Model discovery and new helper tags are checked with fresh parser seeds.
    proof: [xai-model-corpus, xai-usage-seeds]
checks:
  optional: [mutants]
  commands:
    - id: xai-identity-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^xai_identity::/) - test(replays_xai_models_corpus)'
      why: Discovery URL assembly and credential redaction cannot be inferred from pricing tests.
    - id: xai-usage-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^xai_usage::/)'
      why: Double-counting reasoning or charging searches after reported cost changes these results.
    - id: xai-identity-config
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(xai_identity_settings)'
      why: Secret settings must be accepted and selected by the config loader.
    - id: xai-usage-python
      run: test -f tools/oracle/helpers/xai_usage.py && test -f tools/oracle/helpers/xai_identity.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Both reference adapters must invoke their respective source functions.
    - id: xai-usage-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/xai_usage*')" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/xai_identity*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::openai::xai_(identity|usage)::/)'
      why: Each new helper needs its own correctly tagged case corpus.
    - id: xai-model-corpus
      run: test -f crates/betterlite-openai/fuzz/fuzz_targets/xai_models.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/xai_models)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_xai_models_corpus)'
      why: Missing model IDs and malformed catalog replies reach the production decoder.
oracle_cases:
  - tools/oracle/cases/helpers/xai-identity/key-modes.yaml
  - tools/oracle/cases/helpers/xai-identity/header-casing.yaml
  - tools/oracle/cases/helpers/xai-identity/repeated-provider-prefix.yaml
  - tools/oracle/cases/helpers/xai-usage/ticks-and-booleans.yaml
  - tools/oracle/cases/helpers/xai-usage/reported-zero.yaml
  - tools/oracle/cases/helpers/xai-usage/fold-once-and-preserve-larger-total.yaml
  - tools/oracle/cases/helpers/xai-usage/search-count-conversion.yaml
  - tools/oracle/cases/helpers/xai-usage/medium-low-high-rate.yaml
deviations: []
out_of_scope:
  - XAIModelInfo.get_provider_info is B2220; B068 supplies generic_cost_per_token and installs the cost dispatcher.
  - B1403 owns all remaining XAIChatConfig methods and XAIChatCompletionStreamingHandler.chunk_parser in chat/transformation.py.
pitfalls:
  - 'The oracle helper for this task is pre-registered as xai_identity and xai_usage in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/xai_identity.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/xai_identity.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Boolean cost_in_usd_ticks is rejected even though Python bool is an integer subclass.
  - usage.cost equal to zero is authoritative and disables extra web-search billing.
  - A configured base already ending in /v1 becomes /v1/v1/models in XAIModelInfo.get_models.
budget: {max_changed_lines: 800, max_new_expects: 0}
review_level: security
