id: B3684
title: Guardrail list projections and provider form fields
description: >-
  Build the read side of the guardrail admin API in betterlite-server: the two list routes, the info route, the add-guardrail settings route and the provider form route, plus the masking and filtering they share. Everything goes in crates/betterlite-server/src/guardrails/admin_reads.rs and admin_reads/. The create, change and delete routes are B3685, submissions are B3686 and B3687 owns the catalog and apply routes; none of them lives here.

  Routes, all behind the normal key check (any valid key, any role, no other permission). `GET /guardrails/list`, `GET /v2/guardrails/list`, `GET /guardrails/{guardrail_id}` and its alias `GET /guardrails/{guardrail_id}/info`, `GET /guardrails/ui/add_guardrail_settings` and `GET /guardrails/ui/provider_specific_params`. Expose `pub fn routes()` the way the sibling modules in crates/betterlite-server/src/guardrails/ do; the architect's skeleton mounts it, so do not touch app.rs. The response records `GuardrailInfoResponse`, `ListGuardrailsResponse` and `GuardrailUiAddSettings` are B3662's (betterlite-config, sections::guardrail_params); the registry reads and the in-memory handler are B3682's and B3683's.

  Masking, in `masking.rs`: `mask_sensitive_values(values: &Map<String, Value>) -> Map<String, Value>` follows `_get_masked_values` (litellm_logging.py L4346-L4404) with `unmasked_length` 4 and `number_of_asterisks` 4. A key is sensitive when its lowercase text contains one of `authorization`, `token`, `key`, `secret`, `vertex_credentials`, `credentials`, `password`, `passwd`. A sensitive key with a string value becomes `*****` when the string has 4 characters or fewer, else the first 2 characters, `****` and the last 2 characters. A sensitive key with an object value is masked again inside, up to depth 20 (below that the object is returned as it is). Every other value, including lists and non-strings under a sensitive key, is kept. It is `pub(crate)` and lives at `crate::guardrails::admin_reads::masking::mask_sensitive_values` (declare `pub(crate) mod masking;` in admin_reads.rs). B3686 calls it for the submission items, so keep that signature. Give it its own tests.

  `GET /guardrails/list` reads the raw `guardrails:` list from the loaded config file (the `general` config, not the database). No list gives `{"guardrails": []}`. Each item gives `guardrail_id` and `guardrail_name` as written (null when absent), `litellm_params` masked, and `guardrail_info` as written. An item without `litellm_params` still gets a `litellm_params` of the default `BaseLitellmParams` (every key null), not null.

  `GET /v2/guardrails/list`. Admin view (`_user_has_admin_view`, B732's role predicate) sees everything. For other callers: team ids come from `_get_user_team_ids` (the user's `teams` from B736's `get_user_object` with `user_id_upsert` false, empty when the caller has no user id or the database is off, empty strings dropped). The database rows (`GuardrailRegistry.get_all_guardrails_from_db`, active rows only) are kept when the `team_id` of the `Guardrail` record (B3662, `team_id: Option<String>`) is null or in the caller's teams. The ids of removed rows are remembered. Each kept row becomes an entry with `guardrail_definition_location` "db", `created_at`, `updated_at`, `litellm_params` masked (null when the masked map is empty) and `guardrail_info` as stored (null stays null). Then the in-memory guardrails (`list_in_memory_guardrails`) are added as "config" entries when the id was not seen, when the entry's source is not "db" (a row deleted on another pod and not yet reconciled is skipped), and, for non-admins, when its record's `team_id` is null or in the caller's teams. A config entry has no timestamps and its `guardrail_info` is always an object (`{}` for null). With no database the db part is empty. Any error becomes 500 with the error text as `detail`, logged with the text "Error getting guardrails from db: {error}".

  `GET /guardrails/{guardrail_id}`: read the database row (when there is a database), else the in-memory entry only when its source is "config", else 404 with detail "Guardrail with ID {guardrail_id} not found". The body is a `GuardrailInfoResponse` with `guardrail_definition_location` "db" or "config", timestamps, masked `litellm_params` (null when empty) and `guardrail_info` as an object. There is no team check on this route; a team-scoped guardrail is readable by any valid key (LiteLLM does the same, see the notes). Other errors give 500 with the text as `detail`; an HTTP error from inside passes through.

  `GET /guardrails/ui/add_guardrail_settings` returns `GuardrailUiAddSettings`: `supported_entities` (every PiiEntityType value in declaration order), `supported_actions` (PiiAction values), `supported_modes` (every GuardrailEventHooks value), `supported_modes_by_provider`, `pii_entity_categories` (list of `{category, entities}` from PII_ENTITY_CATEGORIES_MAP), `decision_model_providers` (B3513's `supported_decisions_providers`) and `content_filter_settings` with `prebuilt_patterns` (B3691's `get_pattern_metadata`), `pattern_categories` (the keys of PATTERN_CATEGORIES), `supported_actions` fixed to `["BLOCK","MASK"]` and `content_categories` (`get_available_content_categories`). `supported_modes_by_provider` is a table in `provider_modes.rs`: for each registry key whose class returns a list from `get_supported_event_hooks` the hook names, plus `hide-secrets` with only `pre_call`. LiteLLM has 53 overrides of that method (grep `def get_supported_event_hooks` under litellm/); take each one's list and its registry key from the hook folder's `__init__.py`. A provider whose class returns nothing is absent.

  `GET /guardrails/ui/provider_specific_params`: build the map from B6560's `core_tables()` in LiteLLM's order (bedrock, presidio, lakera_v2, tool_permission, hide-secrets), then B6561's `tables_a()` and B6562's `tables_b()`; a later entry with the same key replaces the earlier one. Each model is projected with `project_model(model, max_depth)` where `max_depth` is the env var `DEFAULT_MAX_RECURSE_DEPTH` (default 100), then `with_friendly_name`. `FormError::TooDeep` gives 400 with LiteLLM's detail text.

  Oracle: the HTTP cases boot LiteLLM and betterlite with a config that has `guardrails:` entries and compare status, headers and body. No database cases are possible in this folder (no virtual keys), so the db branches and the non-admin team filter are covered by named Rust tests with a fake registry reader.
