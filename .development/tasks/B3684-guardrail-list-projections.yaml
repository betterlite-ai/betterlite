deviations:
  - what: Config guardrails get a stable `guardrail_id` in the v2 and info responses only if the registry gave them one when it started them; the v1 list shows the id as written in the file.
    why: LiteLLM does the same, because v1 reads the raw file and v2 reads the handler.
  - what: Masking is a `pub(crate)` helper in this module, where LiteLLM shares one function with its logging code.
    why: No Rust owner exists for that function at the pin, so this task owns the one copy and B3686 reuses it.
out_of_scope:
  - "Create, update, patch and delete routes and the mutation checks: B3685."
  - "Submission routes and the custom-code test route: B3686."
  - "category_yaml, major_airlines, validate_blocked_words_file and apply_guardrail routes (L1450-L1620 and L2337-L2457): B3687."
  - "The usage routes mounted by `router.include_router(guardrails_usage_router)` (L2457): B3689 builds the projections, B104 mounts them."
  - "get_all_guardrails_from_db and the in-memory handler methods: B3682. IN_MEMORY_GUARDRAIL_HANDLER and the reconcile pair: B3683."
  - "Form types, projection and the core tables: B6560. The other tables: B6561 and B6562."
  - "The module-level GUARDRAIL_REGISTRY object and the `_create_guardrail_row`, `_delete_guardrail_row` and `_find_team_guardrail_rows` helpers: used only by mutation and submission routes (B3685, B3686)."
  - "_parse_json_field and _row_to_submission_item (L811-L870): used only by submission routes (B3686)."
pitfalls:
  - "The v1 list passes `litellm_params` as a dict even when empty, so the response holds all-null BaseLitellmParams keys, while v2 and info send null for an empty masked map."
  - "v1 reads the raw config (`proxy_config.config.get('guardrails')`) and shows no timestamps and no `guardrail_definition_location` of its own: the field takes its default, `config`."
  - "Masking tests the key name with a substring match on the lowercase key, so `aws_session_token`, `api_key`, `max_tokens` and `guardrail_secret_name` are all masked, and only string values change."
  - "An object under `credentials` is masked inside by the same rule, so its non-sensitive keys (such as `client_email`) stay readable."
  - "Masked strings use `v[:2] + '****' + v[-2:]` because unmasked_length 4 is halved; a 5-character value shows 2 and 2 characters."
  - "v2 compares `team_id` with the caller's team ids only for non-admins, and `caller_team_ids` is not defined for admins, so the config pass must not touch it for them."
  - "A db row hidden from a caller stays in the seen set, so a config entry with the same id is hidden too."
  - "The info route is checked in this order: db row, then config-sourced memory entry. A memory entry whose source is db counts as not found."
  - "`guardrail_info` is `dict(x or {})` on config and info paths but stored-as-is (null allowed) for db rows in v2."
  - "`/guardrails/ui/provider_specific_params` puts the five fixed providers first and the registry loop after, so tool_permission from the registry replaces the fixed one."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
