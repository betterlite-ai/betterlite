dod:
  - text: Masking follows the rule exactly. A sensitive key keeps the first 2 and last 2 characters around four asterisks, a value of 4 characters or fewer becomes five asterisks, objects under a sensitive key are masked inside, other values and other keys stay.
    proof: [admin-masking-tests]
  - text: GET /guardrails/list returns the config file's guardrails with masked params, `[]` when the file has none, and the default all-null params for an item with no litellm_params.
    proof: [admin-routes-tests, oracle]
  - text: The v2 list returns admin everything, other callers only entries with no team or one of their teams, skips db-sourced in-memory entries, never repeats an id, labels each entry db or config, and answers 500 with the error text on failure.
    proof: [admin-routes-tests, oracle]
  - text: The info route finds a db row, then a config entry, never a db-sourced in-memory entry, answers 404 with the exact text otherwise, and serves both paths.
    proof: [admin-routes-tests, oracle]
  - text: The add-guardrail settings body, with the per-provider modes table, matches LiteLLM's.
    proof: [admin-routes-tests, oracle]
  - text: The provider form route returns the merged map in LiteLLM's key set, with a later registry entry replacing an earlier one, and turns a too-deep model into 400.
    proof: [admin-routes-tests, oracle]
  - text: Every route needs a valid key; a request without one gets the usual 401 body.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: admin-masking-tests
      why: the masking rule, its thresholds or its nesting are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::admin_reads::tests::masking_/)'
    - id: admin-routes-tests
      why: a list, info, settings or provider-form behaviour is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::admin_reads::tests::(list_|team_|info_|settings_|forms_)/)'
