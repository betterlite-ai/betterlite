id: B3150
title: ROI settings validation and shared records
description: >-
  Build the common ROI records and boundary validation in a new `betterlite-roi` crate,
  using Decimal for spend and plain float (f64 without StrictFloat constraint) for hours
  and update_interval_minutes. Preserve absent/null distinctions, repository normalization,
  HTTPS URL validation, login/email normalization, and defaults including seven backfill days
  and a 1,440-minute update interval.

  Settings validation holds five validators on ROISettings: validate_update_interval rejects
  zero-length intervals below 5 minutes and above 43,200 (allow_inf_nan=False only); normalize_github_api_url enforces
  HTTPS with no credentials, query or fragment and strips trailing slashes; validate_repositories
  deduplicates and rejects invalid owner/repo format, relative paths and non-URL suffixes;
  validate_estimator_prompt bounds length 1–20,000 characters and strips whitespace;
  normalize_identity_map validates each login via _normalize_login, normalizes email addresses
  via normalize_email, and rejects empty results or login-email pairs. When an invalid login
  is provided, _normalize_login raises ValueError("Enter a valid GitHub username.") directly,
  a distinct error from the generic pair-rejection message. _normalize_login casefolda GitHub
  username and rejects any that do not match [A-Za-z0-9_[\]-]+.

  normalize_email matches valid email patterns, rejects noreply.github.com addresses,
  and returns empty string for invalid inputs; used in identity validation and by downstream
  summarization. All models preserve ReadOnly and NotRequired distinctions: spend records,
  pull records, estimates, and evidence records nest within pull and report containers.
  Every Pydantic model uses ConfigDict for frozen or strict checking where declared in
  the source. The DEFAULT_PROMPT constant supplies the estimator prompt fallback.

  Store github_token and estimator_key as SecretStr inputs; project only has_github_token
  and has_estimator_key booleans in the response. No response model ever exposes the raw
  secret values.

  Expose settings/update/response models, spend/estimate/pull/report/evidence records,
  and the validation functions in `betterlite-roi` types. No implementation outside
  these boundaries or the email helpers belongs here. Consumers (B3151+) import and
  call these validators and construct these typed records.

