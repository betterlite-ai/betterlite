out_of_scope:
  - "B173 owns the HTTP client pool; this task owns only settings records and validation, not network calls."
  - "B3151 owns litellm/types/roi_calculator.py starting at line 261 (person/pull/metrics/trend/summary records)
    and litellm/proxy/roi_calculator/analytics.py:27-215 (identity matching and report summarization);
    ROIIdentityMatch (lines 255-259) has no caller at the pin and falls in the gap but belongs semantically with B3151."
  - "B3154 owns litellm/types/roi_calculator.py:442-514 (estimator and completion request/response models)
    and litellm/types/roi_calculator.py:517-537 (ROIEstimatorResult with hours/reasoning validators)."
  - "Config file parsing and settings loading; this task owns only type definitions and validation."
pitfalls:
  - "normalize_email returns empty string for None/empty input or invalid patterns; callers must check the result before using it."
  - "validate_repositories deduplicates by comparing normalized paths; .git suffix removal and trailing-slash removal happen before dedup check."
  - "identity_map validator skips pairs where normalize_email returns empty; a pair with an invalid email does not add an error, it is silently dropped."
  - "identity_map surfaces _normalize_login's ValueError directly ('Enter a valid GitHub username.') for invalid login, not the generic pair-rejection message, so a user sees the specific error about what part of the pair is wrong."
  - "update_interval_minutes with value 0 is valid (manual updates); the 5-minute minimum applies only when value > 0."
  - "github_api_url empty string after strip() raises ValueError; the field default is 'https://api.github.com', never None or empty."
  - "normalize_github_api_url accepts both 'https://api.github.com' and 'https://github.enterprise.com/api' as long as they are HTTPS with no credentials."
  - "_normalize_login casefolda the input and checks the casefolded result; 'MyLogin' becomes 'mylogin' and is validated against [a-z0-9_[\\]-]+."
  - "DEFAULT_PROMPT is a module-level Final constant with exact phrasing; the estimator uses it as fallback, not as a placeholder to be replaced."
budget:
