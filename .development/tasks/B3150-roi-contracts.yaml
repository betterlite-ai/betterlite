dod:
  - text: Settings validation enforces all five field validators on ROISettings in order; each validator preserves its original error message and ValueError reason.
    proof: [settings-validators]
  - text: _normalize_login casefolded logins, rejects invalid characters and returns the normalized value or ValueError.
    proof: [login-normalization]
  - text: normalize_email rejects noreply.github.com and invalid patterns, returning empty string or the normalized email.
    proof: [email-normalization]
  - text: validate_repositories deduplicates, preserves order for remaining items, normalizes paths and validates owner/repo format.
    proof: [repositories-validation]
  - text: update_interval_minutes rejects 0 < value < 5 and values >= 43201, accepting 0 and [5, 43200].
    proof: [interval-validation]
  - text: "backfill_days validation rejects 0 and values above 3650, and accepts 1 and 3650."
    proof: [backfill-days-validation]
  - text: github_api_url enforces HTTPS, no credentials/query/fragment, required non-empty value and strips trailing slash.
    proof: [github-url-validation]
  - text: estimator_prompt bounds character count 1–20000, strips leading/trailing whitespace.
    proof: [prompt-validation]
  - text: identity_map validates each login/email pair, calls normalize_email, skips empty-email pairs, preserves order.
    proof: [identity-map-validation]
  - text: identity_map surfaces distinct error "Enter a valid GitHub username." when a login is invalid, not the generic pair-rejection message.
    proof: [identity-map-error-message]
  - text: All read-only TypedDict records and response models preserve NotRequired fields exactly as declared.
    proof: [record-types]
  - text: "ROISettingsResponse carries has_github_token and has_estimator_key booleans and never
      exposes the underlying SecretStr value."
    proof: [settings-response-redaction]
  - text: DEFAULT_PROMPT constant matches the LiteLLM source value exactly.
    proof: [default-prompt]
