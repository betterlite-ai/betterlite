id: B1014
title: Async rerank SDK wrapper
description: >-
  Implement the complete @client arerank wrapper in betterlite-core::api::rerank_call. B1079 owns
  all of rerank, so this wrapper no longer owns detached fragments of that function. Preserve the
  eight positional arguments model,query,documents,custom_llm_provider,top_n,rank_fields,
  return_documents,max_chunks_per_doc and kwargs. Optional arguments default None, especially
  return_documents, which overrides rerank's True default. Set kwargs.arerank=True even if the
  caller supplied False. B209 declared_authenticating_provider is tried before B174 resolution;
  that first identity lookup is only for exception attribution and must not rewrite the model
  or explicit provider passed to rerank. Copy the current logging context into execution.

  Await a returned coroutine exactly once, or return an immediate result as is. On Exception,
  call B011 with the original model and resolved provider or explicit provider; there is no
  fallback to openai. Cancellation remains cancellation. B2401 sdk_http.rerank_call drives this
  wrapper against mock HTTP, comparing provider requests, SDK results and error fields. Finite
  injected B1079 operations cover immediate and deferred results without timing sleeps. Existing
  SDK decoders handle the fixture bytes; the wrapper has no parser or config keys.

  Own 56 nonblank/non-comment lines at main.py:30-89. Budget 70 implementation,110 behavior tests,
  115 provider fixtures,80 adapters and 25 registration lines, 400 total. Test functions named in
  the cases below live under api::rerank_call::tests.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/rerank_call.rs
  - crates/betterlite-core/src/api/rerank_call/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/rerank_call.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/rerank_call.py
  - tools/oracle/cases/sdk-http/rerank-call/**
  - tools/oracle/fuzz/corpus/sdk_http_case/rerank-call-*
  - tools/oracle/helpers/b1014.py
  - tools/oracle/helpers/b1014/**
  - tools/oracle/src/helpers/core_ops/b1014.rs
  - tools/oracle/src/helpers/core_ops/b1014/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rerank_api/main.py#L30-L89
  why: The whole async facade, including identity attribution, context propagation and its None default.
dod:
- text: >-
    async_rerank_preserves_defaults sends model=cohere/rerank-english-v3.0,query=q,documents=[a,b]
    with no optional arguments. Capture one provider request with return_documents omitted by
    the config (the wrapper supplied None), unlike sync rerank's true. Explicit true,false,top_n=0,
    rank_fields=[],max_chunks_per_doc=0 and max_tokens_per_doc=8 in kwargs reach B1079 unchanged.
    Supplying arerank=false still selects async execution; query and document order are unchanged.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    async_rerank_awaits_one_result runs one immediate and one coroutine-producing operation, each
    making one mock POST and returning results with indexes [1,0]. Neither result is sorted or called
    twice. The copied context retains litellm_call_id=rerank-context for execution and logging.
    A cancelled execution produces no second call and does not become an ordinary mapped exception.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    async_rerank_attributes_errors uses an explicit declared authenticating provider to bypass the
    preliminary resolver, but still forwards the original model/provider to B1079. With no declaration,
    resolve using model,custom_llm_provider and kwargs.api_base; a resolver failure uses the explicit
    provider or None, never openai. A mock HTTP 429 in both immediate and deferred paths is passed to
    B011 with that provider and original model. Compare SDK class,status,type,param,code including nulls
    and the single provider request; error message prose alone may differ.
  proof: [behavior-tests, oracle, sdk-python]
- text: Async rerank has independent SDK HTTP cases and a newly registered operation seed.
  proof: [new-cases, sdk-corpus, oracle, sdk-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The async wrapper must preserve None and perform only one invocation in either return mode.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_call::tests::/)'
  - id: sdk-python
    why: Provider-call parity must use the SDK HTTP adapter rather than a pure helper.
    run: test -f tools/oracle/sdk_http/rerank_call.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: The rerank_call fixture variant must decode through B2401.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/rerank-call-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: Immediate, deferred and failing calls need fresh captured provider exchanges.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/rerank-call)"
oracle_cases:
- tools/oracle/cases/sdk-http/rerank-call/async-rerank-preserves-defaults.yaml
- tools/oracle/cases/sdk-http/rerank-call/async-rerank-awaits-one-result.yaml
- tools/oracle/cases/sdk-http/rerank-call/async-rerank-attributes-errors.yaml
deviations: []
out_of_scope:
- B1079 owns the entire synchronous rerank function and all its settings, branches and generic HTTP calls.
- B209 owns declared_authenticating_provider, B174 fallback resolution, B011 exception mapping and B012 logging context.
pitfalls:
- arerank explicitly passes return_documents=None, so allowing the sync callee to apply True changes the request.
- A non-coroutine result is returned directly; copying the aspeech retry-on-immediate-result behavior would double bill rerank.
- The preliminary identity resolution must not strip the model prefix in arguments passed to rerank.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
