deviations:
- what: Bedrock Hugging Face templates use local files or custom_prompt_dict only. Missing instruct assets fail
    with No chat template found before family dispatch; there is no remote acquisition.
  why: Max still needs to decide whether Hugging Face downloads are supported. B2205 owns this behavior and its
    no-download proof.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L5266-L5309
