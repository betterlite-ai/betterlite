id: B611
title: Bedrock Invoke base request preparation
description: >-
  Port Invoke request selection and classic body shapes using an injected ClassicDefaults record from B613. Delegate
  Claude to B618, Nova to B614, Pegasus to B617 and OpenAI to B619 through typed preparer inputs; the selector does
  not rebuild those model transforms. Use /invoke-with-response-stream when stream=true except for AI21; there is
  no stream Accept-header branch.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py:
  _bedrock_invoke_guardrail_headers L55-L74; AmazonInvokeConfig.__init__ L78-L80; AmazonInvokeConfig.get_supported_openai_params
  L82-L90; AmazonInvokeConfig.map_openai_params L92-L107; AmazonInvokeConfig.get_complete_url L109-L144; AmazonInvokeConfig.sign_request
  L146-L167; AmazonInvokeConfig._apply_config_to_params L169-L173; AmazonInvokeConfig.transform_request L175-L279;
  AmazonInvokeConfig.validate_environment L421-L438; AmazonInvokeConfig.get_error_class L440-L441; AmazonInvokeConfig.get_bedrock_invoke_provider
  L537-L570; AmazonInvokeConfig._get_provider_from_model_path L573-L590; AmazonInvokeConfig.convert_messages_to_prompt
  L592-L630. litellm/llms/bedrock/chat/invoke_handler.py: AmazonCohereChatConfig.__init__ L90-L110; AmazonCohereChatConfig.get_config
  L113-L128; AmazonCohereChatConfig.get_supported_openai_params L130-L144; AmazonCohereChatConfig.map_openai_params
  L146-L166.


  The llama3/llama4 instruct branch calls the Hugging Face chat-template path in factory.py:5305-5309. Supply a
  local template via custom_prompt_dict[model].roles/initial_prompt_value/final_prompt_value (B177) to bypass acquisition;
  without it retain B177 default_pt fallback and its warning under the open decision, rather than inventing a download
  failure.


  Define the injected defaults/preparer record at this lower boundary; B028 composes B613, B618, B614, B617 and
  B619 into it after those parts finish, so this selector does not depend back on its subclasses.


  llama-instruct-local-template compares the supplied custom_prompt_dict output; llama-instruct-missing-template
  expects the current B177 default_pt output with no download, not a newly invented exception. The adapter supplies
  the same unavailable-template result at the pinned template loader seam.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse bedrock_request_metadata_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Reuse merge_bedrock_invoke_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation remains
  with that prerequisite.


  Implement crates/betterlite-bedrock/src/invoke_request.rs with adjacent tests under invoke_request/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_invoke_request in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_request_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): invoke_model_url, guardrail_id_version_headers, stream_invoke_url_ai21_exclusion, provider_family_selection,
  prompt_template_selection, model_spec_defaults, unknown_provider, llama_instruct_local_template, llama_instruct_missing_template.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_request* using HelperCase: kind:
  helper and the externally tagged bedrock_invoke_request variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_invoke_request that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 371 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 385 production lines, 126 behavior/config-test lines,
  91 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 627 planned, 650 maximum changed lines.
