- 'litellm/llms/bedrock/chat/invoke_handler.py: AmazonCohereChatConfig.get_supported_openai_params L130-L144 and
  map_openai_params L146-L166 have no caller at the pin. The only live instance call is get_config in base_invoke_transformation.py
  L202; common_utils.py L1620 selects AmazonCohereConfig instead. Do not build the unused mapper or its unconditional
