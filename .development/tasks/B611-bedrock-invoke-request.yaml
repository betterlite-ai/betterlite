id: B611
title: Bedrock Invoke base request preparation
description: >-
  Compose Invoke requests from B2205 primitives and the actual family implementations in B613/B614/B617/B618/B619.
  This task is above those implementations; do not replace direct calls with injected callbacks to hide a dependency
  cycle. Preserve mutation order and the legacy Cohere command-r default record.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py:
  AmazonInvokeConfig.transform_request L175-L279. litellm/llms/bedrock/chat/invoke_handler.py: AmazonCohereChatConfig.__init__
  L90-L110; AmazonCohereChatConfig.get_config L113-L128.


  Named case contracts: request_setup_order: Pop stream from optional_params, then pop custom_prompt_dict from litellm_params
  and replace falsey values with {}. Read hf_model_name without removing it. Select provider from the original model,
  but prompt conversion uses hf_model_name or model. Call B2205 prompt conversion before every family dispatch,
  including Claude/Nova/OpenAI where its output is unused; its failure prevents dispatch. Copy remaining options
  deeply and remove all twelve B590 aws_authentication_params from that copy only. classic_body_defaults: Apply
  each B613 config only for absent inference keys; explicit None wins. AI21 and Mistral use {prompt,**inference_params};
  meta,llama,deepseek_r1 use AmazonLlamaConfig with that shape. Caller prompt overrides generated prompt. Amazon
  Titan uses {inputText:prompt,textGenerationConfig:inference_params}, so an inference inputText cannot override
  the outer text. cohere_body_shapes: Only original model.startswith(cohere.command-r) selects AmazonCohereChatConfig.
  Prefixes such as invoke/ or a region therefore change the branch even when the provider is cohere. Command-r emits
  message plus inference parameters, then assigns chat_history whenever it is not None, including []; caller message
  may override generated message, but generated history overrides caller history. Other Cohere models use B613 defaults
  with prompt plus parameters and reinsert stream=True only when the popped stream is literally True. family_delegation:
  Claude B618, Nova B614, Pegasus B617 and OpenAI B619 receive original model/messages/headers and the mutated original
  options/litellm_params. They do not receive the filtered inference copy; authentication fields are still in original
  options. The stream and custom_prompt_dict keys have already been removed. Capture each actual call and returned
  body. unknown_provider: Unrecognized providers raise B682 BedrockError 404 with exact message Bedrock Invoke HTTPX:
  Unknown provider={provider}, model={model}. Try calling via converse route - `bedrock/converse/<model>`. Python
  None renders None. Recognized but unhandled qwen2,qwen3,stability,moonshot also take this error when the base
  selector itself is used; their own configs are selected elsewhere. cohere_class_defaults: AmazonCohereChatConfig
  settings documents,search_queries_only,preamble,max_tokens,temperature,p,k,prompt_truncation,frequency_penalty,presence_penalty,seed,return_prompt,stop_sequences,raw_prompting
  start as None. A constructor writes only values other than None into persistent class defaults; explicit False,0,empty
  string/list remain. get_config excludes dunder names, functions,builtins,classmethod,staticmethod and None, but
  retains single-underscore values and property descriptors. Use a typed settings record with equivalent reuse across
  later requests and reset fixture state between cases.


  Load custom_prompt_dict, hf_model_name, AmazonCohereChatConfig.documents, AmazonCohereChatConfig.search_queries_only,
  AmazonCohereChatConfig.preamble, AmazonCohereChatConfig.max_tokens, AmazonCohereChatConfig.temperature, AmazonCohereChatConfig.p,
  AmazonCohereChatConfig.k, AmazonCohereChatConfig.prompt_truncation, AmazonCohereChatConfig.frequency_penalty,
  AmazonCohereChatConfig.presence_penalty, AmazonCohereChatConfig.seed, AmazonCohereChatConfig.return_prompt, AmazonCohereChatConfig.stop_sequences,
  AmazonCohereChatConfig.raw_prompting through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest bedrock_invoke_request_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  custom_prompt_dict defaults to no registered template and hf_model_name to None; both are deployment inputs. The
  class-qualified keys above denote the existing LiteLLM configuration object fields, not a new upstream JSON envelope.
  Request URL handling is delegated unchanged to the selected family; local prompt acquisition follows the B2205
  deviation.


  Implement crates/betterlite-bedrock/src/invoke_request.rs with adjacent tests under invoke_request/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_invoke_request in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_request_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): request_setup_order, classic_body_defaults, cohere_body_shapes, family_delegation, unknown_provider, cohere_class_defaults.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_request* using HelperCase: kind:
  helper and the externally tagged bedrock_invoke_request variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_invoke_request that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 130 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 240 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 95 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
