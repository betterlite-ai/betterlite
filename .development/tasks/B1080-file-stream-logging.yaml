id: B1080
title: File stream lifecycle and credential projection
description: >-
  Implement the entire FileContentStreamingResponse class in betterlite-core::api::file_stream_logging,
  plus FileContentStreamingHandler.resolve_streaming_request_params and should_stream_file_content.
  Move the whole get_streaming_file_content_response and stream_file_content_with_logging functions
  to B1033: they call the SDK and belong above B1030, which consumes this lower-level wrapper.
  Inject B012 callbacks and clock; consume B1020's credential projection without an ambient router.

  Preserve separate logging-completed and close-completed flags. EOF emits success but does not
  itself close the underlying iterator; explicit close suppresses subsequent logging, including
  early client cancellation. Do not invent a successful completion on disconnect. Stream chunks
  are never accumulated in the logging response. Native state-machine tests use controlled iterators.
  B171 file_stream_projection helper cases cover only pure hidden metadata and credential projection.
  B2401 file_stream_logging HTTP cases wrap a real B173 mock-response stream directly, exercising
  this class without depending on B1030 or a proxy handler. No new decoder is required.
  Owned class plus two pure methods have 230 nonblank, non-comment lines; budget 230
  implementation, 160 tests, 100 fixtures, 110 adapters and 30 wiring lines, totaling 630.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_stream_logging.rs
  - crates/betterlite-core/src/api/file_stream_logging/**
  - tools/oracle/src/helpers/core_ops/file_stream_projection.rs
  - tools/oracle/src/helpers/core_ops/file_stream_projection/**
  - tools/oracle/helpers/file_stream_projection.py
  - tools/oracle/helpers/file_stream_projection/**
  - tools/oracle/fuzz/corpus/helper_case/file_stream_projection-*
  - tools/oracle/cases/helpers/file-stream-projection/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/file_stream_logging.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/file_stream_logging.py
  - tools/oracle/fuzz/corpus/sdk_http_case/file-stream-logging-*
  - tools/oracle/cases/sdk-http/file-stream-logging/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/streaming.py#L17-L231
  why: Full stream wrapper with independent close/log flags and callback payload construction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py#L15-L68
  why: Owns only provider/credential projection and supported-provider predicate, avoiding a reverse SDK edge.
dod:
- text: >-
    streaming_projection routes data={model:m,file_id:encoded,x:1} with credentials containing
    custom_llm_provider=openai,api_key=k and original_file_id=f: return provider=openai,id=f,
    a copied payload with credentials and internal trusted snapshot, no model, and x=1. Original
    input is unchanged. should_route=false or credentials=None returns the original payload and
    provider/id without copying or stripping model. Streaming predicate accepts exactly openai,
    hosted_vllm,litellm_proxy,vertex_ai; azure,bedrock,anthropic,empty and null do not qualify.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    hidden_stream_metadata uses id=f,model=m,provider=openai and truthy api_base=u in logging
    details: hidden fields are api_base=u,litellm_model_name=m,response_cost=null. Existing api_base
    and response_cost are preserved even when null; model name is always corrected from file id
    to model. Response is {id:f,object:file.content,model:m}; empty/null model omits response.model,
    but a non-null empty model still becomes payload.model="". Wrapper hidden fields override
    payload hidden fields; truthy hidden api_base wins payload.api_base. Payload status=success,
    custom_llm_provider is assigned when non-null, and an existing standard payload is cached unchanged.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    stream_success_once drains b"ab",b"cd": chunks remain exact, then one sync success callback,
    or async_success_handler followed by handle_sync_success_callbacks_for_async_calls. Repeated
    EOF adds none. A truthy logger.start_time is used; otherwise use injected current time. No
    logger means no callbacks/payload. Callback errors propagate after setting the completion flag,
    so no duplicate success/failure follows. Logging payload contains metadata, never file bytes.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    stream_failure_once raises ValueError("broken") after one chunk: sync failure_handler once;
    async failure_handler then async_failure_handler once, with the original exception/traceback
    and start/end times, followed by rethrow. No success follows. BaseException cancellation is
    outside the Exception catch and produces no failure callback. Calling sync iteration on an
    async-only stream raises TypeError "File content stream does not support sync iteration";
    the converse says "File content stream does not support async iteration" before any callback.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    explicit_close_suppresses_logging closes early without success or failure, swaps in an empty
    sync iterator, and calls the underlying close once even if cleanup raises. Async close is
    cancellation-shielded, prefers aclose, otherwise calls close and awaits a non-null result.
    Sync close calls only close, never aclose. Repeated close is inert; async iteration after close
    fails its capability check because the replacement iterator is synchronous.
  proof: [behavior-tests, oracle, python-adapters]
- text: Pure projection and real-stream cases each have new independent corpus inputs.
  proof: [new-cases, case-seeds, oracle, python-adapters]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: stream state transitions and logging payloads are not independently tested
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_stream_logging::tests::/) - test(/replays_/)'
  - id: python-adapters
    why: pure projection or real-stream adapter is missing
    run: test -f tools/oracle/helpers/file_stream_projection.py && test -f tools/oracle/sdk_http/file_stream_logging.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: case-seeds
    why: one of the two typed operations lacks a new seed or replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_stream_projection-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/file-stream-logging-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)' && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: real-stream lifecycle has no new oracle capture
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/file-stream-logging)"
oracle_cases:
- tools/oracle/cases/helpers/file-stream-projection/streaming-projection.yaml
- tools/oracle/cases/helpers/file-stream-projection/hidden-stream-metadata.yaml
- tools/oracle/cases/sdk-http/file-stream-logging/stream-success-once.yaml
- tools/oracle/cases/sdk-http/file-stream-logging/stream-failure-once.yaml
- tools/oracle/cases/sdk-http/file-stream-logging/explicit-close-suppresses-logging.yaml
deviations: []
out_of_scope:
- B1033 owns whole stream_file_content_with_logging and get_streaming_file_content_response methods, including SDK calls, proxy status updates, custom headers and StreamingResponse construction.
- B012 owns standard logging payload/callback internals, B1020 credential merging, B173 byte stream cleanup, B1128 the streaming result type.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_stream_projection in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_stream_projection.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_stream_projection.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- close sets logging_completed before cleanup, so early close intentionally emits no success callback.
- The source's model correction is required because the generic decorator mistakes positional file_id for model.
- Async failure callbacks run in sync-then-async order, unlike success callbacks.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
