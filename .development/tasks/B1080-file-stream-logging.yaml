out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- data reads 'litellm_call_id' with default ''; omission and an explicit value must not collapse into one case.
- Within FileContentStreamingResponse.__iter__\'s not hasattr(self.stream_iterator, '__next__') branch, preserve
  raise TypeError('File content stream does not support sync iteration') and its nested guards.
