id: B1080
title: File stream logging
description: >-
  Own file stream wrapping, hidden metadata, terminal success/failure logs and HTTP streaming parameter resolution.
  Consume an injected typed byte stream and cancellation handle from B009, reuse file-credentials for model hints,
  and expose the wrapper to file-content-stream without buffering content for logs.


  Implement crates/betterlite-core/src/api/file_stream_logging.rs. Use FileStreamLoggingInput and FileStreamLoggingResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions byte_stream_hidden_metadata, close_success_once, close_failure_once,
  client_disconnect_log, stream_query_parameters under api::file_stream_logging::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileStreamLogging in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_stream_logging: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/files/streaming.py: FileContentStreamingResponse.__init__ (L23-L45); litellm/files/streaming.py:
  FileContentStreamingResponse.__iter__ (L47-L50); litellm/files/streaming.py: FileContentStreamingResponse.__next__
  (L52-L63); litellm/files/streaming.py: FileContentStreamingResponse.__aiter__ (L65-L68); litellm/files/streaming.py:
  FileContentStreamingResponse.__anext__ (L70-L81); litellm/files/streaming.py: FileContentStreamingResponse.aclose
  (L83-L100); litellm/files/streaming.py: FileContentStreamingResponse.close (L102-L112); litellm/files/streaming.py:
  FileContentStreamingResponse._build_logging_response (L114-L121); litellm/files/streaming.py: FileContentStreamingResponse._sync_hidden_params
  (L123-L135); litellm/files/streaming.py: FileContentStreamingResponse._build_standard_logging_object (L137-L180);
  litellm/files/streaming.py: FileContentStreamingResponse._log_success_async (L182-L199); litellm/files/streaming.py:
  FileContentStreamingResponse._log_success_sync (L201-L213); litellm/files/streaming.py: FileContentStreamingResponse._log_failure_async
  (L215-L223); litellm/files/streaming.py: FileContentStreamingResponse._log_failure_sync (L225-L231); litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py:
  FileContentStreamingHandler.resolve_streaming_request_params (L17-L61); litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py:
  FileContentStreamingHandler.should_stream_file_content (L64-L68); litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py:
  FileContentStreamingHandler.stream_file_content_with_logging (L71-L92); litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py:
  FileContentStreamingHandler.get_streaming_file_content_response (L95-L146). Abstract/protocol declarations map
  to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 310 owned nonblank/non-comment/non-docstring Python lines (323 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 330 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 580 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B012
  (Logging pipeline, callback registry and redaction), B171 (Direct helper oracle and URL path encoding), B1020
  (File credentials), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
