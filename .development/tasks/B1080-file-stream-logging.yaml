checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_stream_logging::/) -
      test(/::replays_corpus$/)'
  - id: case-byte-stream-hidden-metadata
    why: the byte-stream-hidden-metadata behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_stream_logging::tests::byte_stream_hidden_metadata($|::)/)'
  - id: case-close-success-once
    why: the close-success-once behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_stream_logging::tests::close_success_once($|::)/)'
  - id: case-close-failure-once
    why: the close-failure-once behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_stream_logging::tests::close_failure_once($|::)/)'
  - id: case-client-disconnect-log
    why: the client-disconnect-log behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_stream_logging::tests::client_disconnect_log($|::)/)'
  - id: case-stream-query-parameters
    why: the stream-query-parameters behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_stream_logging::tests::stream_query_parameters($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_stream_logging.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_stream_logging-*)"
      && grep -qE "^[[:space:]]+file_stream_logging:" tools/oracle/fuzz/corpus/helper_case/file_stream_logging-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-stream-logging)"
