checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::vector_query_embedding::/)
      - test(/::replays_corpus$/)'
  - id: case-query-embedding-dispatch
    why: the query-embedding-dispatch behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_query_embedding::tests::query_embedding_dispatch($|::)/)'
  - id: case-configured-embedding-model
    why: the configured-embedding-model behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_query_embedding::tests::configured_embedding_model($|::)/)'
  - id: case-native-vector-search
    why: the native-vector-search behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_query_embedding::tests::native_vector_search($|::)/)'
  - id: case-internal-embedding-metadata
    why: the internal-embedding-metadata behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_query_embedding::tests::internal_embedding_metadata($|::)/)'
  - id: case-caller-model-not-authority
    why: the caller-model-not-authority behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_query_embedding::tests::caller_model_not_authority($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/vector_query_embedding.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_query_embedding-*)"
      && grep -qE "^[[:space:]]+vector_query_embedding:" tools/oracle/fuzz/corpus/helper_case/vector_query_embedding-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/vector-query-embedding)"
