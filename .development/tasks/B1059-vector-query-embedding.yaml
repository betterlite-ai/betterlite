id: B1059
title: Vector query embedding
description: >-
  Prepare vector query embeddings through B006/B014 with explicit operator-owned embedding model/config and provider-native/custom
  search execution. Carry request metadata to internal embedding calls and expose typed prepared vector queries
  to the search service.


  Implement crates/betterlite-core/src/api/vector_query_embedding.rs, crates/betterlite-provider/src/api/vector_query_embedding.rs.
  Use VectorQueryEmbeddingInput and VectorQueryEmbeddingResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions query_embedding_dispatch, configured_embedding_model, native_vector_search,
  internal_embedding_metadata, caller_model_not_authority under api::vector_query_embedding::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorQueryEmbedding in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_query_embedding: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.transform_search_vector_store_request
  (L262-L273); litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.atransform_search_vector_store_request
  (L275-L295); litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.query_text
  (L298-L299); litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.query_embedding_model
  (L302-L309); litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.query_embedding_configuration
  (L312-L316); litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.query_embedding_executor
  (L319-L328); litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.embed_query
  (L330-L343); litellm/llms/base_llm/vector_store/transformation.py: BaseQueryEmbeddingVectorStoreConfig.aembed_query
  (L345-L358); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.execute_search_vector_store_request
  (L369-L379); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.aexecute_search_vector_store_request
  (L382-L392); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.transform_search_vector_store_request
  (L394-L404); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.transform_search_vector_store_response
  (L406-L409); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.transform_create_vector_store_request
  (L411-L416); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.transform_create_vector_store_response
  (L418-L419); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.get_complete_url
  (L421-L426); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.get_auth_credentials
  (L428-L429); litellm/llms/base_llm/vector_store/transformation.py: BaseDirectVectorStoreConfig.get_vector_store_endpoints_by_type
  (L431-L432). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 148 owned nonblank/non-comment/non-docstring Python lines (153 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 168 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 426 total within the 430-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B006 (OpenAI embeddings), B014 (Call dispatch across providers and call types, shared
  settings and helpers), B171 (Direct helper oracle and URL path encoding), B1058 (Vector store contracts), B1087
  (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
