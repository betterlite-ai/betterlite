id: B1059
title: Query embedding and direct vector-store contracts
description: >-
  Build BaseQueryEmbeddingVectorStoreConfig and BaseDirectVectorStoreConfig from transformation.py:256-432.
  Provider-layer contracts take B1058's executor interface and B1131 records; core composes concrete
  executors. A text query is unchanged and a sequence is joined by one space. The embedding model comes
  only from nonempty string litellm_params.litellm_embedding_model. Configuration comes from the mapping
  litellm_embedding_config, with keys converted to strings; other values select an empty map. These are
  provider parameters, not global environment variables or new proxy config settings.

  Explicit executor wins over router, and router wins over the direct executor. embed_query/aembed_query
  resolve model/config/executor before their try block, wrap execution failures with "Failed to generate
  embedding for query: ", then validate only response.data[0].embedding after the catch. Keep these
  error boundaries distinct. Direct stores expose their own execution method, not a fake HTTP request;
  their inherited HTTP transforms raise NotImplementedError as specified below.

  Add helper vector_query_embedding for pure preparation/default methods and SDK HTTP vector_query_embedding
  for embed_query/aembed_query using B1058's real executor. A tiny concrete provider fixture may expose
  the base methods, but neither embedding function nor HTTP handler is mocked. Tests live in
  api::vector_query_embedding in core/provider. No new byte decoder is introduced. Count 157 nonblank/
  non-comment lines; budget 160 implementation, 160 tests, 130 adapters, 105 fixtures and 50 wiring/corpus,
  605 total within 640.
