references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/vector_store/transformation.py#L256-L432
  why: Complete query embedding methods separate model/config validation, provider execution and first-vector validation; direct stores reject HTTP transformation.
dod:
- text: >-
    query_preparation sends " a " unchanged, ["a","b"] to "a b", [] to "" and ["a","","b"] to "a  b".
    litellm_embedding_model="openai/text-embedding-3-small" and " " are accepted; missing,null,"",1 fail
    with ValueError("litellm_embedding_model is required in litellm_params for this vector store. Example: litellm_params['litellm_embedding_model'] = 'openai/text-embedding-3-small'").
    litellm_embedding_config={dimensions:2} is preserved; null/list/missing gives {}; integer key 1 becomes "1".
  proof: [embedding-tests, oracle, adapters]
- text: >-
    executor_precedence passes explicit executor plus router and expects the explicit executor; router
    alone produces a router executor with supplied request metadata; neither produces a direct executor.
    Omitted request metadata is {}. Async transform forwards vector_store_id,query,optional params,api_base,
    logging,litellm_params,extra_body and embedding_executor unchanged to the sync override exactly once.
  proof: [embedding-tests, oracle, adapters]
- text: >-
    first_embedding_vector calls embed_query/aembed_query with model=openai/text-embedding-3-small,
    config={dimensions:2},query_text="a b". Expect POST /v1/embeddings with model=text-embedding-3-small,
    input=["a b"],dimensions=2. Mock data with first embedding=[0.25,0.5] and second=[9,9] yields [0.25,0.5]
    only. A first embedding=[] yields []. Numeric strings accepted by the pinned vector validation are
    converted; a nonnumeric "bad" fails validation after execution, not as an embedding-execution error.
  proof: [embedding-tests, oracle, adapters]
- text: >-
    embedding_failure_boundaries supplies mock 401 invalid_api_key and expects plain Exception whose
    message begins "Failed to generate embedding for query: ", with no SDK status/type/param/code on that
    outer exception. Missing litellm_embedding_model fails before HTTP without that prefix. A valid mock
    embedding response with data=[] causes IndexError; data=[{}] causes KeyError("embedding"); those
    errors occur outside the execution catch. Native errors preserve these categories without panicking.
  proof: [embedding-tests, oracle, adapters]
- text: >-
    direct_store_defaults maps api_base=null or "" to "", and a supplied base to itself; credentials={}
    and endpoints={read:[],write:[]}. Search request transformation raises NotImplementedError("Direct vector store providers execute the search themselves; no HTTP request shape");
    response transformation raises NotImplementedError("Direct vector store providers execute the search themselves; no HTTP response shape").
    Create request/response transformation raises NotImplementedError with empty message. None makes an
    embedding or HTTP call. Concrete datastore execution belongs to the provider and is not simulated here.
  proof: [embedding-tests, oracle, adapters]
- text: New helper and SDK HTTP seeds replay through their existing typed case decoders.
  proof: [case-corpora]
checks:
  optional: []
  commands:
  - id: embedding-tests
    why: query preparation, first-vector validation or the direct-store defaults change
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::vector_query_embedding::/) - test(/::replays_corpus$/)'
  - id: adapters
    why: embedding I/O is compared as a fabricated helper result
    run: test -f tools/oracle/sdk_http/vector_query_embedding.py && test -f tools/oracle/helpers/vector_query_embedding.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: case-corpora
    why: query-embedding variants have no new corpus inputs
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_query_embedding-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-query-embedding-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus) | test(/^sdk_http::tests::replays_corpus$/)'
