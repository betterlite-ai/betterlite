id: B742
title: Role and pass-through route permissions
description: >-
  Implement role-based route admission with the source's branch order. _is_api_route_allowed requires
  a nonnull valid_token even for a proxy admin, then bypasses non-admin checks only when the live user
  row has role proxy_admin (B732). The non-admin chain first checks configured admin_only_routes,
  then B883 auth-enforced pass-through grants, B882 LLM routes and info routes. /key/info, /v2/user/info,
  /model/info and /team/info defer authorization to their handlers. /user/info denies a nonempty
  different user_id with 403 unless the role is proxy_admin_viewer; missing/empty IDs pass here.
  Global spend routes require permissions containing get_spend_routes. Only after these branches
  does the viewer-specific checker run: do not silently reorder it ahead of LLM admission.

  Next allow internal_user routes, B1229 organization-admin routes, internal_user_viewer routes,
  self-managed routes, /v1/mcp/ and /mcp-rest/ prefixes, B883 pass-through grants and team-service-account
  routes in that order. Organization administration uses the caller's request_data.organization_id
  and user organizations unchanged. The final allowed_routes fallback checks B882 template/prefix
  and wildcard matching for each entry; None or an unmatched/empty list raises a plain Exception,
  translated by B757 to 401 auth_error, param string None, code string 401. Keep the diagnostic role
  or 'unknown' and masked user ID: empty/length<=4 is '***'; length 5..8 is all asterisks; longer
  uses B244 SensitiveDataMasker with visible_prefix=6, visible_suffix=2, mask_char='*'.

  The direct viewer checker rejects LLM routes with 403. Before safe-method handling it checks
  management routes: /user/update may contain only user_email (empty mapping passes), and the
  _PROXY_ADMIN_VIEW_ONLY_BLOCKED_ROUTES table plus /key/ suffixes /regenerate and /reset_spend deny.
  Own the static tables at route_checks.py L22-L66 and L800-L832 with the checker, including every
  listed user/team/model/JWT/key write path and bulk alias. Then GET, HEAD and OPTIONS pass, with
  request=None treated as GET. Unsafe methods permit email-only /user/update, /user/password/change
  and /session/logout; deny the second write table and /key/*/regenerate; allow explicit admin-viewer
  and global-spend route sets, and otherwise deny 403. All these HTTPExceptions become auth_error
  with param string None and code string 403; source wording is compared only in helper diagnostics.

  JWT route admission expands named LiteLLMRoutes groups with Starlette template matching or uses
  B882 wildcard matching. PROXY_ADMIN uses admin_allowed_routes; TEAM uses team_allowed_routes,
  with a None value falling back to only openai_routes and info_routes. An empty list denies all;
  every other role returns False. B869 owns the typed default lists (admin management/spend/global
  spend/info; team openai/info/mcp/messages/count_tokens). allowed_route_check_inside_route permits
  admin/viewer, or matching nonnull caller/requested user IDs including empty strings; others fail.


  Build the production auth_route_policy module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/route_checks.py:
  RouteChecks._mask_user_id (L213-L231; 13 source lines), RouteChecks._raise_admin_only_route_exception
  (L234-L257; 21 source lines), RouteChecks.non_proxy_admin_allowed_routes_check (L260-L365; 95 source
  lines), RouteChecks.custom_admin_only_route_check (L368-L382; 14 source lines), RouteChecks._check_proxy_admin_viewer_access
  (L835-L951; 84 source lines). litellm/proxy/auth/auth_checks.py: _is_api_route_allowed (L1313-L1337;
  23 source lines), _allowed_routes_check (L1350-L1369; 18 source lines), allowed_routes_check (L1372-L1401;
  28 source lines), allowed_route_check_inside_route (L1404-L1417; 14 source lines).


  general_settings.admin_only_routes is absent by default and matches exact routes only. Source logs
  ERROR and skips it without premium_user=True; betterlite applies it without the license and returns
  403 auth_error for a listed non-admin request. JWT config loading stays with B869; this task consumes it.


  general_settings.admin_only_routes defaults absent; configured entries apply to non-admin callers without
  a premium flag.


  Add the auth_route_policy operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-route-policy-*
  seed to B171 helper_case, which already owns this decoder.


  B732 wires the route-policy service into actual protected handlers. HTTP cases exercise the listed
  role/route pairs and compare B757 status/type/param/code, including branches that return False
  without raising; do not invent a denial for a caller that ignores the returned boolean.


  Use B860 with POSTGRES_TEST_URL or testcontainers for distinct key owner, team administrator,
  organization administrator and unrelated caller identities; the role cases must not collapse them.


  Load absent, empty and populated admin_only_routes through B002 in admin_routes_absent,
  admin_routes_empty and admin_routes_exact tests, then exercise native route admission. There is
  no numeric parse or invalid-value fallback. The source helpers that import proxy_server globals
  are exercised through HTTP; pure role/masking/JWT projections use the helper adapter.


  Route-policy inputs are parsed requests/principals. The native admin_only_routes license removal
  is isolated from the equality corpus, which runs without the enterprise package.


  Sizing: 310 owned function lines plus 69 nonblank table lines; allow 300 production, 300 table-driven
  tests, 75 adapters, 65 wiring and 50 config lines, 790 within 800. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_configured_admin_only_routes_is_enforced_without_premium_user.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Server wiring tests live under betterlite-server::auth::auth_route_policy::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
