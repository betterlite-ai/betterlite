      custom_admin_check_first, pass_through_before_llm, llm_before_viewer_check,
      info_handler_deferral, other_user_info_403, empty_user_id_passes,
      viewer_other_user_info_passes, spend_permission_required, internal_user_routes,
      org_admin_body_scope, internal_viewer_routes, self_managed_routes,
      mcp_prefix_deferral, team_service_account_routes, explicit_allowed_route_match,
      empty_allowed_routes_401 and absent_allowed_routes_401.'
    proof:
      - behavior-tests
  - text: 'Viewer cases cover direct_llm_403, email_only_update, empty_update_allowed,
      extra_update_field_403, each_early_blocked_route, regenerate_and_reset_suffixes,
      safe_get_head_options, absent_request_get, password_change_allowed,
      logout_allowed, each_late_blocked_route, legacy_read_post_allowed and unknown_post_403.
      Masking cases cover empty_short_mask, five_to_eight_all_masked,
      long_id_six_two_visible and unknown_identity_masked. Run named HTTP cases for all denials.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'JWT and self-access cases name admin_default_groups, team_default_groups,
      team_none_two_group_fallback, empty_routes_deny, other_role_denied,
      route_group_template, route_wildcard, admin_viewer_self_check,
      matching_user_self_check and absent_user_not_self. Configured-admin license behavior
      has native tests; the MIT HTTP case asserts its warning and skipped policy.'
    proof: [behavior-tests, config-tests, oracle, helper-python]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_configured_admin_only_routes_is_enforced_without_premium_user.'
    proof:
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(/^(auth::)?auth_route_policy::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_route_policy.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-route-policy-*")"
        && grep -rlq "auth_route_policy" tools/oracle/fuzz/corpus/helper_case/auth-route-policy-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::auth_route_policy::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-route-policy-*")"
        && grep -rlq "admin_only_routes" crates/betterlite-config/fuzz/corpus/config_yaml/auth-route-policy-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_route_policy::tests::/)
        - test(/replays_the_/)'
