checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_agentic_stream::/)
      - test(/::replays_corpus$/)'
  - id: case-server-tool-held-back
    why: the server-tool-held-back behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_agentic_stream::tests::server_tool_held_back($|::)/)'
  - id: case-ping-during-interceptor
    why: the ping-during-interceptor behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_agentic_stream::tests::ping_during_interceptor($|::)/)'
  - id: case-followup-stream
    why: the followup-stream behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_agentic_stream::tests::followup_stream($|::)/)'
  - id: case-leaked-server-tool-error
    why: the leaked-server-tool-error behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_agentic_stream::tests::leaked_server_tool_error($|::)/)'
  - id: case-cancel-drains-owned-task
    why: the cancel-drains-owned-task behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_agentic_stream::tests::cancel_drains_owned_task($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/messages_agentic_stream)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/messages_agentic_stream.rs && grep -qF "decode_messages_agentic_strea"
      crates/betterlite-core/fuzz/fuzz_targets/messages_agentic_stream.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::messages_agentic_stream::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_agentic_stream.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_agentic_stream-*)"
      && grep -qE "^[[:space:]]+messages_agentic_stream:" tools/oracle/fuzz/corpus/helper_case/messages_agentic_stream-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-agentic-stream)"
