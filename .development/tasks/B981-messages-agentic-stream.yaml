- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_agentic_stream in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_agentic_stream.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_agentic_stream.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'agentic_streaming_iterator.py:361 emits the diagnostic ''AgenticStreamingIterator: Could not rebuild response
  from SSE bytes''; retain its level and fallback instead of turning it into a hard error.'
- 'agentic_streaming_iterator.py:392 emits the diagnostic ''AgenticStreamingIterator: Unexpected result type from
  hooks: %s''; retain its level and fallback instead of turning it into a hard error.'
