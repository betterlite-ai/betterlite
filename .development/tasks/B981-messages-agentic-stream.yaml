id: B981
title: Messages agentic stream
description: >-
  Implement the native agentic stream buffer/rebuilder and follow-up control using a statically injected interceptor
  outcome. Hold server-fulfilled tool calls until the interceptor runs, preserve pings and cancellation, and expose
  the seam for B119's later web-search/code-interpreter implementation without depending on B119.


  Implement crates/betterlite-core/src/api/messages_agentic_stream.rs. Use MessagesAgenticStreamInput and MessagesAgenticStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions server_tool_held_back, ping_during_interceptor, followup_stream, leaked_server_tool_error,
  cancel_drains_owned_task under api::messages_agentic_stream::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::messages_agentic_stream::decode_messages_agentic_strea(bytes:
  &[u8], limits: &ApiLimits), for json.loads input data_str at litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py:72;
  json.loads input partial at litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py:146. Place
  its implementation in crates/betterlite-core/src/api/messages_agentic_stream.rs and call it from the actual boundary.
  The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/messages_agentic_stream.rs passes arbitrary bounded
  bytes to that exact decoder; api::messages_agentic_stream::tests::replays_corpus replays newly committed seeds
  through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::MessagesAgenticStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_agentic_stream: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: is_server_fulfilled_tool_leak_error
  (L40-L41); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: _anext_or_none (L44-L48);
  litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: _parse_sse_events (L56-L78); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py:
  _handle_message_start (L81-L91); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: _handle_content_block_start
  (L94-L118); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: _handle_content_block_delta
  (L121-L136); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: _handle_content_block_stop
  (L139-L148); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: _handle_message_delta
  (L151-L166); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator.__init__
  (L182-L218); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator.has_buffered_provider_output
  (L221-L223); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator.__aiter__
  (L225-L226); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator.__anext__
  (L228-L248); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._drain_upstream
  (L250-L255); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._completed_within_ping_interval
  (L257-L262); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._anext_held_back
  (L264-L298); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._next_follow_up_chunk
  (L300-L309); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._buffer_holds_server_fulfilled_tool_use
  (L311-L324); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._settle_task
  (L327-L336); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator.aclose
  (L338-L347); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._process_agentic_hooks
  (L349-L403); litellm/llms/anthropic/pass_through/messages/agentic_streaming_iterator.py: AgenticAnthropicStreamingIterator._rebuild_anthropic_response_from_sse
  (L406-L457). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 349 owned nonblank/non-comment/non-docstring Python lines (384 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 369 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 679 total within the 680-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B978 (Messages sse events), B979 (Messages
  native stream), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
