dod:
- text: 'batch list after limit: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-batch-list-after-limit
  - oracle
- text: Every enumerated config/environment setting loads, defaults and changes the typed settings; existing YAML
    fuzz corpus exercises the new keys.
  proof:
  - config-tests
  - config-corpus
- text: The independent Rust/Python helper adapter and the externally tagged case seed execute through B171.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: Every listed case is a newly added parity fixture and compares independent native and pinned results.
  proof:
  - new-oracle-cases
  - oracle
  - helper-python
  - helper-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::batch_provider_list::/)
      - test(/::replays_corpus$/)'
  - id: case-batch-list-after-limit
    why: the batch-list-after-limit behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_provider_list::tests::batch_list_after_limit($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::batch_provider_list::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/batch-provider-list-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/batch_provider_list.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/batch_provider_list-*)"
      && grep -qE "^[[:space:]]+batch_provider_list:" tools/oracle/fuzz/corpus/helper_case/batch_provider_list-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/batch-provider-list)"
