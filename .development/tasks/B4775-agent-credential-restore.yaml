deviations:
  - what: The redacted litellm_params JSON string (the string input of redact_sensitive_agent_litellm_params) is compact serde_json text, where LiteLLM writes json.dumps text with a space after each comma and colon.
    why: Only the parsed content is read back. At the pin the only caller (endpoints.py L179) passes an object, so no client sees the string.
  - what: serialize_agent_kill_switch takes a typed AgentKillSwitchConfig, so LiteLLM's ValidationError for an invalid incoming dict cannot happen here. A request with an invalid kill_switch is rejected earlier, when the request body is parsed.
    why: Typed boundary from B4770. The rejection is the request parse error, not an error raised from the database layer.
out_of_scope:
  - "B4774 owns redact_kill_switch, restore_kill_switch and _with_auth in kill_switch.py. This task calls them."
  - "B4777 owns _dump_agent_params, _patched_kill_switch, _patched_access_group_ids, _permission_write, _managed_fields and the add, update and patch functions that call restore_redacted_litellm_params and serialize_agent_kill_switch."
  - "B4786 owns _resolve_agent_kill_switch in endpoints.py, which calls parse_agent_kill_switch."
  - "The routes in endpoints.py (list, get, create, replace, patch, delete) and the is_public injection at L455-L459 belong to the endpoint tasks, which call redact_sensitive_agent_fields."
  - "Reading enable_jwt_auth and agent_id_jwt_field from config is the caller's job. This task takes JwtAgentSettings."
  - "SensitiveDataMasker itself is B244. Only its is_sensitive_key is used here."
pitfalls:
  - The depth check comes first in the redaction walk, so a plain string at depth 10 becomes the marker. In the restore rule the marker check comes before the depth check, so the opposite order.
  - "A secret key never recurses, in redaction or in restore. An object under api_key redacts to the bare marker, and a non-marker object under a secret key is stored as sent."
  - Restore keeps a secret the incoming map omitted, but drops a non-secret key the incoming map omitted. Treating both the same either deletes credentials or keeps removed settings.
  - A nested marker with no stored counterpart restores to null, not to the marker and not to a dropped key. A top level secret key with the marker and no stored value is dropped.
  - When the stored value is itself the marker string, the nested rule keeps the incoming marker, so a corrupt stored marker is not restored from.
  - The stored list is paired by index only. If the admin reorders a list and echoes markers, the markers restore from the wrong positions; that is LiteLLM's documented limit, so do not add matching by content.
  - The jwt_auth_configured flag reads the original agent's identity, not the copy's, and the non-admin stripping runs after it.
  - parse_agent_kill_switch hides a stored switch that no longer parses. Do not add a fallback or a log line that prints the value, since the text holds secrets.
  - serialize_agent_kill_switch is the only place a secret is read with expose_secret, and the NUL strip must cover keys as well as values.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
