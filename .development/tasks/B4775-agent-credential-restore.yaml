    - id: params-tests
      why: parsing of a stored litellm_params column is missing or fails instead of returning an empty map
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_credentials::params::/)'
    - id: restore-tests
      why: restoring echoed markers, omitted secrets, nested values or the depth cap is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_credentials::restore::/)'
    - id: kill-switch-tests
      why: kill switch parsing, restore-then-store or NUL stripping is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_credentials::kill_switch::/)'
    - id: response-tests
      why: response redaction, the non-admin stripping or the jwt_auth_configured flag is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_credentials::response::/)'
    - id: oracle-cases
