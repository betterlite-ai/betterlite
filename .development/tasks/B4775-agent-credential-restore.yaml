dod:
  - text: A litellm_params value is redacted with the marker when its key has a secret segment (api_key, access_token, vertex_credentials), whatever its value, and keys like max_tokens, input_cost_per_token and model are left alone.
    proof: [redact-tests, oracle-cases]
  - text: Redaction walks nested objects and arrays, so a secret inside a list of provider configs is redacted, and any value reached at depth 10 or more, scalars included, becomes the marker.
    proof: [redact-tests, oracle-cases]
  - text: Redacting None gives None, a JSON string holding an object gives a JSON string with the secrets redacted, a string that is not a JSON object gives the marker, and other scalars pass through.
    proof: [redact-tests, oracle-cases]
  - text: parse_agent_litellm_params returns the map for an object or a JSON object string and an empty map for anything else, without failing.
    proof: [params-tests, oracle-cases]
  - text: Restoring takes the stored value for a secret key echoed as the marker, keeps a real incoming value or an empty string, and keeps a stored secret the incoming map leaves out.
    proof: [restore-tests, oracle-cases]
  - text: Restoring a marker with no stored value inside a nested object gives null, and a secret key echoed as the marker with no stored value is dropped.
    proof: [restore-tests, oracle-cases]
  - text: Restoring pairs array items with the stored array by position, recovers a nested secret under a non-secret key, and returns values unchanged at depth 10.
    proof: [restore-tests, oracle-cases]
  - text: parse_agent_kill_switch returns None for None, null, an unparseable string and an invalid object, and the config for a valid object or JSON string.
    proof: [kill-switch-tests]
  - text: serialize_agent_kill_switch stores `null` for a cleared switch, restores a marker secret from the stored switch of the same auth type, and writes the real secret under token, api_key or password in the stored text.
    proof: [kill-switch-tests]
  - text: The stored kill switch text holds no NUL character in any string or key.
    proof: [kill-switch-tests]
  - text: redact_sensitive_agent_fields returns copies, leaves the input unchanged, redacts litellm_params and kill switch auth secrets for admins and non-admins, and strips static_headers, extra_headers, keys, kill_switch and identity for non-admins.
    proof: [response-tests]
  - text: jwt_auth_configured is true only when JWT auth is enabled and the agent has an identity or the agent id JWT field is set, and a non-admin copy still gets the true value even though its identity is stripped.
    proof: [response-tests]
  - text: A redacted management response holds the marker `REDACTED_BY_LITELM` in the kill switch auth secret field, and sending that object back through serialize_agent_kill_switch restores the stored secret (test response_marker_round_trips_to_stored_secret).
    proof: [response-tests]
