id: B4775
title: Restore stored agent credentials and redact management responses
description: >-
  Build module agent_credentials in crates/betterlite-server. It keeps stored agent secrets out of management responses and puts them back when an admin saves an agent without retyping them. Every function is pure: no database, no HTTP, no global state. B4776 owns the in-memory registry, B4777 owns the database reads and writes that call these functions, and B4774 owns the kill switch auth redact and restore functions this task calls. All JSON values use the `AgentJson` alias from betterlite_core::agents::json, because clippy forbids serde_json::Value named directly. The marker is the string `REDACTED_BY_LITELM`; take it from one constant in this module.

  Which keys are secret. Use betterlite_redact::structured::SensitiveDataMasker built with `SensitiveDataMasker::with_patterns` and no extra patterns and no overrides (that is LiteLLM's `SensitiveDataMasker()` with the default patterns and the single override `cost`). Call `is_sensitive_key(key, &[])`. A key is split on `_` after `-` becomes `_` and it is lowercased, and it is secret when one whole segment is a pattern (`api_key`, `access_token`, `vertex_credentials` match, `max_tokens` and `input_cost_per_token` do not). Build the masker once per call site from the caller's constructor and pass it in, no static.

  1. Redaction, in agent_credentials/redact.rs. `redact_sensitive_agent_litellm_params(params: Option<&AgentJson>, masker) -> Option<AgentJson>`. None gives None. A JSON string is the stored form some callers hold: at depth 0 it must parse as a JSON object, otherwise the result is the marker string; a parsed object is redacted starting at depth 1 and returned as a JSON string again (compact serde_json text). Any other value is redacted starting at depth 0. The tree walk, with a depth argument: when depth is 10 or more, return the marker for any value at all, scalars included. An array becomes an array whose items are walked at depth + 1 (so a credential inside a list of provider configs is caught). An object becomes an object where a secret key gets the marker whatever its value is (null, an object, a number) and every other key is walked at depth + 1. A scalar passes through. Also expose `redact_agent_litellm_params_map(params: &BTreeMap<String, AgentJson>, masker) -> BTreeMap<String, AgentJson>` for the response path: it walks the map as an object at depth 0 and returns the map. The input is never changed.

  2. Parsing a stored column, in agent_credentials/params.rs. `parse_agent_litellm_params(value: Option<&AgentJson>) -> BTreeMap<String, AgentJson>`. A JSON string is parsed and must be an object; an object is taken as it is; anything else, a string that is not valid JSON, a string holding a non-object, null, or None gives an empty map. It never fails.

  3. Restoring secrets on write, in agent_credentials/restore.rs. `restore_redacted_litellm_params(incoming: &BTreeMap<String, AgentJson>, existing: &BTreeMap<String, AgentJson>, masker) -> BTreeMap<String, AgentJson>`, LiteLLM's `_restore_redacted_litellm_params` at depth 0. The result has one entry per key found in incoming or existing, decided per key:
  - Key in incoming and secret: if the incoming value is exactly the marker string, take the existing value for the key, and drop the key when existing has none. Any other incoming value, an empty string included, is kept as is (that is how an admin clears a credential). A secret key's value is never walked.
  - Key in incoming and not secret: the nested rule below, at the current depth.
  - Key only in existing and secret: keep the existing value. This is why leaving a secret out of a PUT does not delete it.
  - Key only in existing and not secret: dropped.
  The nested rule `restore_nested(incoming_value, existing_value: Option<&AgentJson>, depth)`: first, when the incoming value is the marker string and the existing value is not the marker string, return the existing value, and when existing is absent that is JSON null, so the result holds null, not the marker. Second, at depth 10 or more return the incoming value unchanged. Third, an incoming object is restored with the existing value if it is an object (otherwise an empty map) by calling the per-key rule above at depth + 1. Fourth, an incoming array is rebuilt item by item at depth + 1, each item paired with the existing array's item at the same index (a null when the existing value is not an array or is shorter). Anything else is returned unchanged.

  4. Kill switch storage, in agent_credentials/kill_switch.rs. `parse_agent_kill_switch(value: Option<&AgentJson>) -> Option<AgentKillSwitchConfig>` (the type from betterlite_core::agents::kill_switch): None and JSON null give None, a JSON string is parsed as JSON text first, and any value that fails to parse as a config gives None, with no error and no log. `serialize_agent_kill_switch(incoming: Option<&AgentKillSwitchConfig>, existing: Option<&AgentJson>) -> Result<String, AgentCredentialsError>`: parse the existing column with parse_agent_kill_switch, call B4774's restore_kill_switch(incoming, existing) (find it under crates/betterlite-server/src/kill_switch_management), and return the JSON text to store. A None result is the text `null`, because the database layer drops a None column value on update, so a cleared switch is stored as the JSON literal null. A config is stored as an object with keys url, method (the upper-case name), headers, query_params, body (null when absent) and auth. The core record's serializer leaves the auth secret out on purpose, so this function builds the object with serde_json::to_value and then inserts the secret itself: `token` for bearer, `api_key` for api_key and `password` for basic, each read with expose_secret. Nothing else in the crate exposes a secret. Before writing the text, remove NUL characters from every string and every object key in the value, since Postgres rejects \u0000 in jsonb.

  5. Management responses, in agent_credentials/response.rs. `redact_sensitive_agent_fields(agents: &[AgentResponse], is_admin: bool, jwt: JwtAgentSettings, masker) -> Result<Vec<AgentJson>, AgentCredentialsError>` with `JwtAgentSettings { enabled: bool, agent_id_field_set: bool }` (the caller fills it from `general_settings.enable_jwt_auth` and from whether `litellm_jwtauth.agent_id_jwt_field` is a non-empty string; reading config is not this task). It returns a deep copy of every agent in order and never changes the input. For each copy: set `jwt_auth_configured` to `jwt.enabled && (agent.identity.is_some() || jwt.agent_id_field_set)`, using the original agent's identity. When is_admin is false, set static_headers, extra_headers, keys, kill_switch and identity to None, after the jwt flag is computed. When litellm_params holds a non-empty map, replace it with redact_agent_litellm_params_map. Finally pass the kill switch through B4774's redact_kill_switch (a None stays None). The core record skips secrets when it serializes, so the builder serializes each copy with serde_json::to_value and then writes the marker constant itself into the auth secret field of the kill switch object (`token` for bearer, `api_key` for api_key, `password` for basic), the way serialize_agent_kill_switch inserts the real secret into the stored JSON. The returned JSON therefore has the LiteLLM marker in each secret field it redacted, and a client that does GET and sends the same object back in a PUT gets the stored secret restored by B4774's restore_kill_switch. Serializing can fail, so the function returns AgentCredentialsError. Admins get no extra access to secrets: provider credentials and kill switch auth secrets are redacted for every caller.

  Errors: AgentCredentialsError in agent_credentials/error.rs, with one variant for a serde_json failure while building the stored or response JSON. Nothing else here can fail.
