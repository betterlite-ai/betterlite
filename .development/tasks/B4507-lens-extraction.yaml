id: B4507
title: Extract supported observations from recorded executions
description: >-
  Build crates/betterlite-lens module extraction to review recorded executions
  against enabled checks, with execution-level catalog pages, root excerpt
  reading, and bounded feedback navigation. Extract observations from execution
  traces by iterating through model-guided reviews with targeted span reads,
  preserving stalled-read final decisions and per-check evidence filtering.
  Cover litellm/proxy/lens/analysis.py:201-206 (extract entry point);
  litellm/proxy/lens/analysis.py:209-361 (extract_stored with nested fetch,
  examine and review); litellm/proxy/lens/analysis.py:838-855
  (examine_executions with nested examine).
  Direct dependencies: B4500 for analysis_checks and Coverage record construction;
  B4506 for TraceStore, read_execution, TraceStore.parts/count/previous/get/
  add_reads/evidence/catalogs, overview_content, feedback_pages, structured_response,
  concurrent_results, evidence_valid, and shared Examined/Observation/TraceReview/
  Extraction records. The task exports examine_executions for the
  coordinator; extract and extract_stored are internal. Preserve stalled-read
  final decisions when span reads return no new evidence, per-check evidence
  filtering by ID, partial/unassessable status tracking, and loop detection
  in feedback navigation. Evidence quotes must validate against stored parts
  with exact matching across omission markers. At most 2 span reads per review
  turn. Observations filter only those with enabled check IDs, valid evidence
  and evidence that validates against stored spans; partially-assessed or
  unassessable coverage is recorded without manufacturing issues from missing
  content. No dependency on investigation or grouping; the coordinator
  consumes this stage through examine_executions.
