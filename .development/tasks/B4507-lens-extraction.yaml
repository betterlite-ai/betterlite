  paths:
    - crates/betterlite-lens/src/extraction.rs
    - crates/betterlite-lens/src/extraction/**
    - tools/oracle/cases/helpers/lens-extraction/**
    - tools/oracle/helpers/b4507.py
    - tools/oracle/helpers/b4507/**
    - tools/oracle/src/helpers/lens/b4507.rs
    - tools/oracle/src/helpers/lens/b4507/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/analysis.py#L201-L206
    why: extract entry point; wraps extract_stored with ValidationError catch for cannot_assess fallback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/analysis.py#L209-L361
    why: extract_stored main logic with multi-review catalog iteration, nested fetch/examine/review functions, evidence validation and filtering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/analysis.py#L838-L855
    why: examine_executions coordinator that calls extract concurrently over sample executions with progress reporting.
  - url: https://docs.rs/tokio/latest/tokio/
    why: Async runtime and task spawning for concurrent extraction.
dod:
  - text: extract takes a claim, execution, read callback and model callback, creates a temporary trace store, calls extract_stored with error fallback, and returns Examined with cannot_assess=true on ValidationError.
    proof: [extract-entrypoint-tests]
  - text: extract_stored iterates over TraceStore.catalogs partitions, calling examine on each catalog partition, collecting observations and deduplicating evidence by span_id.
    proof: [extract-catalog-iteration-tests]
  - text: examine reviews each catalog partition through iterative model calls, building context from catalog, root excerpt, previous observations and feedback.
    proof: [extraction-tests]
  - text: examine detects feedback navigation loops by tracking visited feedback_page values; when a repeated feedback_page or invalid page is requested, must_decide is forced.
    proof: [feedback-loop-detection-tests]
  - text: examine enforces at most 2 span reads per turn; requested reads are filtered to exclude reads already completed and only includes reads where the span exists in store.
    proof: [span-read-limit-tests]
  - text: examine returns final Extraction when must_decide=true or when no reads are requested and feedback_page does not change from previous value.
    proof: [extraction-tests]
  - text: fetch loads preceding span content from storage by calling read with the previous cursor, returning only parts matching the requested span_id.
    proof: [extraction-tests]
  - text: review builds a JSON prompt including task instructions, catalog complete flag, root excerpt, previous observations, completed read count, last completed read span_id, feedback page and response schema, calling structured_response for model inference.
    proof: [review-prompt-tests]
  - text: Observations are filtered to include only those with check_id in enabled checks, non-empty evidence, and evidence that validates through evidence_valid against stored parts.
    proof: [observation-filtering-tests]
  - text: Invalid observations (those filtered out) mark the result as partial=true and cannot_assess=true.
    proof: [partial-coverage-tests]
  - text: Evidence deduplication resolves each cited Evidence through store.evidence into a TracePart, then preserves order with dict-like keyset deduplication on the resolved TraceParts.
    proof: [evidence-dedup-tests]
  - text: examine_executions accepts a claim, sample, read callback, model callback and progress callback; calls extract concurrently over sample.executions with concurrency bounded by claim.job.settings.concurrency.
    proof: [examine-executions-concurrent-tests]
  - text: examine_executions reports progress with "Reading executions" stage name, Coverage with eligible/selected/screened counts updated per completed execution.
    proof: [examine-executions-progress-tests]
  - text: Partial status is set when page.partial=true, page.next_cursor exists, reads remain pending, or invalid observations were filtered.
    proof: [partial-status-tests]
checks:
  optional: []
  commands:
    - id: extract-entrypoint-tests
      why: extract function fails to create trace store or handle ValidationError fallback
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::extract::entrypoint/)'
    - id: extract-catalog-iteration-tests
      why: extract_stored fails to iterate catalogs or deduplicate evidence
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::extract_stored::catalog_iteration/)'
    - id: extraction-tests
      why: extraction main logic tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::/) and test(!replays_) and test(!examine_executions_)'
    - id: feedback-loop-detection-tests
      why: feedback navigation loop detection or forced final decision is missing
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::feedback_loop_detection/)'
    - id: span-read-limit-tests
      why: span read limit of 2 per turn or read filtering is not enforced
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::span_read_limit/)'
    - id: review-prompt-tests
      why: review prompt construction fails to include catalog or instruction details
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::review_prompt/)'
    - id: observation-filtering-tests
      why: observations are not filtered by check ID, evidence validity or evidence validation
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::observation_filtering/)'
    - id: partial-coverage-tests
      why: partial or cannot_assess status is not set when observations are filtered
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::partial_coverage/)'
    - id: evidence-dedup-tests
      why: evidence deduplication or order preservation fails
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::evidence_dedup/)'
    - id: examine-executions-concurrent-tests
      why: examine_executions concurrency or concurrent extraction fails
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::examine_executions::concurrent/)'
    - id: examine-executions-progress-tests
      why: examine_executions progress reporting is missing or incorrect
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::examine_executions::progress/)'
    - id: partial-status-tests
      why: partial status is not set when page is partial, reads are pending, or observations are filtered
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^extraction::partial_status/)'
