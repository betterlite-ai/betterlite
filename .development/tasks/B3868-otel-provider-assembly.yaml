id: B3868
title: OTel provider assembly and legacy initialization
description: >-
  Assemble tracer, meter and logger providers from already-built exporters and processor policies, including tenant/operator suppression filters. Construct the legacy OpenTelemetry logger's initialization, reuse-or-create provider semantics, and global-publication behavior to match LiteLLM.
  Cover the OpenTelemetry class initialization that configures capture modes, caches, and metric attribute filters; the _init_otel_logger_on_litellm_proxy method that registers the logger and guards against overwrite; the _get_or_create_provider orchestration that reuses existing global providers, creates new ones when needed, and respects skip_set_global for isolation; and the _init_tracing, _init_metrics, _init_logs factory methods that build TracerProvider with span processors, MeterProvider with metric readers, and LoggerProvider with log processors. Also build build_tracer_provider, which assembles providers from exporter specs, adds baggage processors for identity attributes, applies tenant overrides and operator scoping through _OverriddenBackendFilter, and gates headers-required exporters.
  The legacy logger shares opentelemetry.py with B3854/B3855/B3857/B3859, so scope paths name only the ranges in that file owned by B3868; other tasks' ranges in the same file stay out of scope.
scope:
  paths:
    - crates/betterlite-logging/src/otel_provider_assembly.rs
    - crates/betterlite-logging/src/otel_provider_assembly/**
  lint_tables: false
