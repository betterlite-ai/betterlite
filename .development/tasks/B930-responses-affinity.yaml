id: B930
title: Responses affinity
description: >-
  Expose pure Responses candidate filtering over B368 DeploymentCatalog's authorized deployment view and B303 credential-boundary
  facts, using response-id-codecs to recognize previous-response and encrypted-content affinity. Compare authorized
  encryption-boundary identities and strip only reasoning the target cannot decrypt. This is the Responses filter
  consumed later by B324, not the B324 deployment-affinity hook, so do not depend on B324.


  Implement crates/betterlite-core/src/api/responses_affinity.rs. Use ResponsesAffinityInput and ResponsesAffinityResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions previous_response_deployment, encrypted_same_boundary, different_key_strips_reasoning,
  anthropic_thinking_affinity, ineligible_pin_not_revived under api::responses_affinity::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesAffinity in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_affinity: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/router_utils/pre_call_checks/responses_api_deployment_check.py: ResponsesApiDeploymentCheck.__init__
  (L22-L31); litellm/router_utils/pre_call_checks/responses_api_deployment_check.py: ResponsesApiDeploymentCheck.async_filter_deployments
  (L33-L57); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck.__init__
  (L71-L80); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck.has_model_group_affinity_enabled
  (L87-L93); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._is_enabled_for_model_group
  (L95-L99); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._extract_model_id_from_input
  (L102-L125); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._model_id_of_input_item
  (L128-L144); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._anthropic_content_blocks
  (L147-L155); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._model_id_from_wrapped_encrypted_content
  (L158-L160); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._model_id_of_anthropic_block
  (L163-L167); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._extract_model_id_from_anthropic_messages
  (L170-L178); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._find_deployment_by_model_id
  (L181-L189); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._encryption_boundary_key
  (L192-L231); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._find_deployments_on_same_encryption_boundary
  (L233-L254); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck._strip_reasoning_the_target_cannot_decrypt
  (L256-L298); litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py: EncryptedContentAffinityCheck.async_filter_deployments
  (L304-L392). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 288 owned nonblank/non-comment/non-docstring Python lines (369 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 308 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 558 total within the 560-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B303 (Deployment client reuse and parallel
  request guards), B368 (Transactional deployment catalog updates), B903 (Response id codecs), B904 (Response id
  traversal), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the
  external B500-B859 ids retain ownership on the provider and keys/data branches.
