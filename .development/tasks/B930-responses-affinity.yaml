checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_affinity::/) -
      test(/::replays_corpus$/)'
  - id: case-previous-response-deployment
    why: the previous-response-deployment behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_affinity::tests::previous_response_deployment($|::)/)'
  - id: case-encrypted-same-boundary
    why: the encrypted-same-boundary behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_affinity::tests::encrypted_same_boundary($|::)/)'
  - id: case-different-key-strips-reasoning
    why: the different-key-strips-reasoning behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_affinity::tests::different_key_strips_reasoning($|::)/)'
  - id: case-anthropic-thinking-affinity
    why: the anthropic-thinking-affinity behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_affinity::tests::anthropic_thinking_affinity($|::)/)'
  - id: case-ineligible-pin-not-revived
    why: the ineligible-pin-not-revived behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_affinity::tests::ineligible_pin_not_revived($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_affinity.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_affinity-*)"
      && grep -qE "^[[:space:]]+responses_affinity:" tools/oracle/fuzz/corpus/helper_case/responses_affinity-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-affinity)"
