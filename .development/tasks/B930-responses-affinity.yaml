id: B930
title: Route encrypted Responses history within its credential boundary
description: >-
  Implement responses_affinity in betterlite-router for every EncryptedContentAffinityCheck
  function,including its nested per-call decryptability cache. Consume an already authorized
  healthy candidate list and B844's deployment lookup; never revive a filtered origin.
  B061 resolves named credentials,B903 decodes markers,B904 strips Responses reasoning,
  and B220 handles Anthropic encrypted signatures. Compare boundaries by effective
  (api_base,api_key) identity without exposing secrets in diagnostics or helper output.

  Constructor defaults are router=None,enable_global_affinity=true,model_group_affinity_config={}.
  B324 owns loading/registration for optional_pre_call_checks and model_group_affinity_config,
  including the encrypted_content_affinity flag; this lower filter receives resolved values
  and does not depend on its registrar. The deprecated ResponsesApiDeploymentCheck has no
  caller at the pin: its old flag is handled by DeploymentAffinityCheck in B324,so exclude
  both deprecated methods rather than building an unused previous-response selector.

  Register responses_affinity with B171 and compare chosen candidate IDs,input mutations
  and diagnostics using scripted catalog/credential snapshots. No outside bytes are parsed.
  Read 45 physical nonblank/non-comment lines in the excluded deprecated file and own 324
  in the live file,including docstrings. Budget 280 implementation,180 tests,130 cases,
  95 adapters and 25 wiring lines: 710 total.
scope:
  paths:
  - crates/betterlite-router/src/responses_affinity.rs
  - crates/betterlite-router/src/responses_affinity/**
  - tools/oracle/src/helpers/router/responses_affinity.rs
  - tools/oracle/src/helpers/router/responses_affinity/**
  - tools/oracle/helpers/responses_affinity.py
  - tools/oracle/helpers/responses_affinity/**
  - tools/oracle/fuzz/corpus/helper_case/responses_affinity-*
  - tools/oracle/cases/helpers/responses-affinity/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/encrypted_content_affinity_check.py#L1-L392
  why: Complete live filter selects origin/credential peers and strips unusable reasoning without disclosing origin existence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/responses_api_deployment_check.py#L1-L57
  why: Both deprecated methods are inspected but excluded because the pin has no production constructor caller.
dod:
- text: >-
    affinity_enablement returns candidates unchanged when global=false and the model group
    lacks encrypted_content_affinity. Global=true enables every group; group-only activation
    works with global=false. has_model_group_affinity_enabled is true when any group's list
    includes that literal and false for null/{}. Enabled filtering sets
    litellm_metadata.encrypted_content_affinity_enabled=true only if litellm_metadata already
    exists; it never creates that key and therefore preserves metadata tag-routing choice.
    Existing litellm_metadata=null raises TypeError "'NoneType' object does not support item assignment".
  proof: [affinity-tests, oracle, affinity-adapter]
- text: >-
    marker_precedence scans list input in order,ignores nondicts,and tries an encoded item
    ID before wrapped encrypted_content on each item. A decoded item with model_id=""
    returns that empty value without trying its cipher and stops the scan before later
    items; the final filter may then fall back to Anthropic messages. Input string/nonlist
    has no marker. Anthropic scans dict content blocks using B220 thinking.signature or
    redacted_thinking.data carrying litellm_encrypted_reasoning: plus a B903 wrapper.
    Explicit truthy messages wins over request_kwargs.messages; empty messages falls back.
  proof: [affinity-tests, oracle, affinity-adapter]
- text: >-
    healthy_origin_pin matches model_info.id using string conversion,so origin "7" matches
    numeric id=7,skipping malformed model_info/missing IDs. Return only the first matching
    healthy deployment,set _encrypted_content_affinity_pinned=true,and strip other-origin
    reasoning only when this target cannot decrypt it. Same target ID is sufficient without
    a router lookup. No marker returns the original healthy list with no pin flag. Debug
    logs are "EncryptedContentAffinityCheck: decoded model_id=%s from the request's encrypted content markers"
    and "EncryptedContentAffinityCheck: pinning -> deployment=%s" with the selected ID.
  proof: [affinity-tests, oracle, affinity-adapter]
- text: >-
    credential_boundary_peers uses effective api_base and api_key from named credential
    fields whenever present,including null; missing credential fields fall back to deployment
    fields. Missing credential yields {} and preserves both deployment values. Falsy base/key
    yields no boundary; dict and typed get-capable params behave alike,unsupported objects
    yield none. Origin A absent from healthy but catalogued with base=u,key=k selects all
    healthy peers with exactly (u,k),in their original order,not an unhealthy A. A different
    key or base never matches. No router/missing origin returns no peers. Debug names the
    origin and peer count,never the credential values.
  proof: [affinity-tests, oracle, affinity-adapter]
- text: >-
    selective_history_strip retains reasoning from target IDs or origins sharing any target
    boundary,using one cached catalog lookup per distinct origin within the call. It strips
    only undecryptable marked input items through B904 and marked Anthropic blocks through
    B220,in place so fallback snapshots see the mutation. Unmarked history remains. A
    request with A and B markers pinned to A retains B only when its catalog boundary matches.
  proof: [affinity-tests, oracle, affinity-adapter]
- text: >-
    unavailable_origin_fallback for unhealthy,removed,cross-group or forged origin with no
    healthy boundary peer returns the full supplied healthy pool,adds no pin flag and strips
    encrypted reasoning through B904/B220 while keeping readable Responses history. It does
    not raise an origin-specific HTTP error. Warning is
    "EncryptedContentAffinityCheck: model_id=%s cannot serve group %s and no deployment on the same encryption boundary is configured; forwarding without its encrypted reasoning",
    with origin truncated to its first 64 characters and the requested group. This fallback
    strips all encoded reasoning,not only the first marker's origin. Existing request flags
    are not reset merely because this pass did not find a pin.
  proof: [affinity-tests, oracle, affinity-adapter]
checks:
  optional: [mutants]
  commands:
  - id: affinity-tests
    why: routing can leak credential boundaries or replay undecryptable history
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^responses_affinity::/)'
  - id: affinity-adapter
    why: selected candidates and in-place stripping are not compared independently
    run: test -f tools/oracle/helpers/responses_affinity.py && grep -qE '^[[:space:]]+responses_affinity:' tools/oracle/fuzz/corpus/helper_case/responses_affinity-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-affinity/affinity-enablement.yaml
- tools/oracle/cases/helpers/responses-affinity/marker-precedence.yaml
- tools/oracle/cases/helpers/responses-affinity/healthy-origin-pin.yaml
- tools/oracle/cases/helpers/responses-affinity/credential-boundary-peers.yaml
- tools/oracle/cases/helpers/responses-affinity/selective-history-strip.yaml
- tools/oracle/cases/helpers/responses-affinity/unavailable-origin-fallback.yaml
deviations: []
out_of_scope:
- ResponsesApiDeploymentCheck.__init__ and async_filter_deployments have no caller at the pin; B324's live DeploymentAffinityCheck handles responses_api_deployment_check and previous_response_id.
- B324 owns callback installation/order and loading optional_pre_call_checks/model_group_affinity_config; B844 catalog lookup and B061 named credential access remain injected dependencies.
- B903/B904 and B220 own marker parsing/stripping; no new format or decoder is introduced.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_affinity in the router group. Replace the stub Op in tools/oracle/src/helpers/router/responses_affinity.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_affinity.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Named credential fields override deployment fields by presence,so an explicit null disables boundary matching.
- Do not create litellm_metadata merely to set the affinity flag; that changes which metadata carries routing tags.
- Missing origins strip and dispatch instead of returning distinguishable existence errors.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
