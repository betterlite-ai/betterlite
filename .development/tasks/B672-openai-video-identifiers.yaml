checks:
  optional:
  - mutants
  commands:
  - id: case-video-id-roundtrip
    why: The video-id-roundtrip behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_video_identifiers_cases::case_[0-9]+_video_id_roundtrip$/)'
  - id: case-character-id-roundtrip
    why: The character-id-roundtrip behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_video_identifiers_cases::case_[0-9]+_character_id_roundtrip$/)'
  - id: case-invalid-id-fallback
    why: The invalid-id-fallback behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_video_identifiers_cases::case_[0-9]+_invalid_id_fallback$/)'
  - id: case-input-reference-string-png
    why: The input-reference-string-png behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_video_identifiers_cases::case_[0-9]+_input_reference_string_png$/)'
  - id: case-multipart-input-file
    why: The multipart-input-file behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_video_identifiers_cases::case_[0-9]+_multipart_input_file$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_video_identifiers.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_video_identifiers*")"
      && grep -lq 'openai_video_identifiers' tools/oracle/fuzz/corpus/helper_case/openai_video_identifiers* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_video_identifiers$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_video_identifiers)"
      && grep -q 'decode_provider_video_id' crates/betterlite-openai/fuzz/fuzz_targets/openai_video_identifiers.rs
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_video_identifiers_corpus$/)'
