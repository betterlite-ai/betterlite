id: B672
title: Video provider identifiers and multipart input
description: >-
  Port the provider-tagged video and character id codecs and OpenAI input_reference multipart conversion, shared
  with video extension/edit operations. An input_reference string is the file body with PNG default; it is never
  fetched as a URL.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/videos/transformation.py:
  OpenAIVideoConfig._decode_character_ids_in_create_video_request L148-L175; OpenAIVideoConfig._add_image_to_files
  L574-L586; OpenAIVideoConfig._video_file_tuple L588-L595; OpenAIVideoConfig._add_video_to_files L597-L603; OpenAIVideoConfig._get_video_content_type
  L605-L628. litellm/types/videos/utils.py: DecodedCharacterId L20-L25; _add_base64_padding L28-L35; encode_video_id_with_provider
  L38-L56; decode_video_id_with_provider L59-L113; extract_original_video_id L116-L119; encode_character_id_with_provider
  L122-L133; decode_character_id_with_provider L136-L190; extract_original_character_id L193-L196.


  Call B997 ImageEditRequestUtils.get_image_content_type directly through its lower media helper module; do not
  copy its filename/header detection. This task owns identifier parsing, character-list rewrites and multipart tuples
  only. No environment variables or config settings are read.


  Named case contracts: video_id_roundtrip: Encode UTF-8 litellm:custom_llm_provider:{provider};model_id:{model_id
  or empty};video_id:{video_id} with standard padded base64 and video_ prefix; decode all three strings, preserving
  empty model_id rather than returning None. character_id_roundtrip: Use character_ and litellm:custom_llm_provider:{provider};model_id:{model_id
  or empty};character_id:{character_id}; extraction returns only the decoded original ID. invalid_id_fallback: Empty
  IDs, wrong prefixes, bad base64/UTF-8 and payloads with fewer than three semicolon-separated fields retain the
  entire original ID with provider/model None. Only decoding exceptions emit the debug error; absent separators
  do not. input_reference_string_png: Pass a string, including https://example.invalid/a.png, as the multipart body
  without fetching it; B997 determines image/png and filename input_reference.png for non-BufferedReader values.
  multipart_input_file: BufferedReader images use their exact name and original stream with B997 MIME; BytesIO/bytes
  keep input_reference.png even when image MIME is JPEG. Append to the supplied field name/list without replacing
  earlier fields. encode_identity_guards: An empty provider or empty ID returns the original unchanged; any successfully
  decoded non-None provider, including an empty string, prevents double encoding even when the requested provider/model
  differ. decode_permissive_fields: Pad to a multiple of four; replace every occurrence of the outer prefix, not
  just the first. Split on semicolons, use only the first three fields, and replace literal litellm:custom_llm_provider:,
  model_id:, video_id:/character_id: anywhere within each field without validating their prefixes; discard extra
  fields. character_list_rewrite: Only a list-valued characters is traversed. Copy dictionaries with string id and
  replace that id using the character decoder; retain other keys, non-dictionaries, missing/non-string ids and non-list
  characters unchanged. The outer request retains all unrelated fields. video_filename_mime: Video tuples use a
  truthy .name or input_video.mp4; any mimetypes guess starting video/ wins (including video/webm) before content
  inspection. An image or unknown filename falls back to video/mp4. video_probe_cursor: For BytesIO/BufferedReader
  read at most the first 64 bytes from offset zero and restore the original cursor on successful read; bytes use
  their first 64 bytes. ftyp anywhere in this prefix returns video/mp4; absent ftyp, unsupported input kinds and
  seek/read failures also return video/mp4 without warning. Preserve the source cursor behavior when a read/restore
  throws.


  Implement crates/betterlite-openai/src/openai_video_identifiers.rs with adjacent tests under openai_video_identifiers/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_video_identifiers_cases in betterlite-openai with these exact named cases (one per
  oracle file): video_id_roundtrip, character_id_roundtrip, invalid_id_fallback, input_reference_string_png, multipart_input_file,
  encode_identity_guards, decode_permissive_fields, character_list_rewrite, video_filename_mime, video_probe_cursor.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_video_identifiers* using HelperCase: kind:
  helper and the externally tagged openai_video_identifiers variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_video_identifiers that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_provider_video_id consumes caller-supplied video_/character_ base64 identifier bytes
  and upload MIME prefixes in crates/betterlite-openai/src/openai_video_identifiers.rs (or its scoped child module).
  Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_video_identifiers.rs calling that exact
  production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_video_identifiers.
  The adjacent test replays_the_openai_video_identifiers_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 204 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 265 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 65 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 720 planned, 725 maximum changed lines.
