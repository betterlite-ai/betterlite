id: B672
title: Video provider identifiers and multipart input
description: >-
  Port the provider-tagged video and character id codecs and OpenAI input_reference multipart conversion, shared
  with video extension/edit operations. An input_reference string is the file body with PNG default; it is never
  fetched as a URL.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/videos/transformation.py:
  OpenAIVideoConfig._decode_character_ids_in_create_video_request L148-L175; OpenAIVideoConfig._add_image_to_files
  L574-L586; OpenAIVideoConfig._video_file_tuple L588-L595; OpenAIVideoConfig._add_video_to_files L597-L603; OpenAIVideoConfig._get_video_content_type
  L605-L628. litellm/types/videos/utils.py: DecodedCharacterId L20-L25; _add_base64_padding L28-L35; encode_video_id_with_provider
  L38-L56; decode_video_id_with_provider L59-L113; extract_original_video_id L116-L119; encode_character_id_with_provider
  L122-L133; decode_character_id_with_provider L136-L190; extract_original_character_id L193-L196.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Implement crates/betterlite-openai/src/openai_video_identifiers.rs with adjacent tests under openai_video_identifiers/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation openai_video_identifiers in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_video_identifiers_cases in betterlite-openai with these exact named cases (one per
  oracle file): video_id_roundtrip, character_id_roundtrip, invalid_id_fallback, input_reference_string_png, multipart_input_file.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_video_identifiers* using HelperCase: kind:
  helper and the externally tagged openai_video_identifiers variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_video_identifiers that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_provider_video_id consumes caller-supplied video_/character_ base64 identifier bytes
  and upload MIME prefixes in crates/betterlite-openai/src/openai_video_identifiers.rs (or its scoped child module).
  Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_video_identifiers.rs calling that exact
  production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_video_identifiers.
  The adjacent test replays_the_openai_video_identifiers_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 204 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 490 planned, 500 maximum changed lines.
