pitfalls:
- 'The oracle helper for this task is pre-registered as openai_video_identifiers in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/video_identifiers.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_video_identifiers.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The video ID docstring says vid_, but the executable constant is video_.
- A semicolon inside a provider ID is not escaped, so only the third field survives extraction.
- An I/O exception during the video MIME probe can leave the file cursor changed; only successful probes restore
  it.
