oracle_cases: []
deviations:
  - what: >-
      Proxy failure hooks extract error information via B253's StandardLoggingPayloadSetup.get_error_information
      and convert numeric error_code values to HTTP status code; absent or non-numeric codes set status_code to None.
    why: >-
      LiteLLM follows the same pattern: extract error_code from the exception and convert to int
      when the code is a string digit. Betterlite preserves this behavior for compatibility.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L308-L315
  - what: >-
      User context extraction from B1106's LiteLLMProxyRequestSetup.get_sanitized_user_information_from_key
      provides sanitized principal fields. When proxy utilities are unavailable or exception occurs,
      fallback uses minimal fields (request_route, team_id, user_id, end_user_id) from user_api_key_dict.
    why: >-
      LiteLLM uses the same fallback pattern to handle cases where proxy is not available (e.g. SDK-only mode);
      betterlite retains the fallback behavior but uses B1106's sanitized values as the primary path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L317-L337
  - what: >-
      Proxy failure hook flushes queue when batch size is reached; service hooks enqueue events
      without immediate flush. Periodic_flush timeout handles delayed flushing for service events.
    why: >-
      LiteLLM only flushes proxy failures on batch-size threshold, not service failures;
      service events are batched and flushed by periodic_flush inherited from CustomBatchLogger.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L358-L359
  - what: >-
      Service success hook logs only service types in DD_LOGGED_SUCCESS_SERVICE_TYPES (currently only RESET_BUDGET_JOB);
      other service types are silently skipped. Service failures always log with WARN status.
    why: >-
      LiteLLM preserves this filtering to avoid spammy logging of every service success event;
      failures are always relevant for observability, while successes are filtered to reduce volume.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L656-L658
out_of_scope:
  - B3930's tag/source/service/hostname and trace-context helpers are called but not implemented here.
  - B3932's DatadogPayload type and DataDogStatus enum are used but not defined here.
  - B3933's flush_queue method and inherited CustomBatchLogger state are used but not implemented here.
  - B192's safe_dumps function is called but not implemented here.
  - B253's StandardLoggingPayloadSetup.get_error_information is called but not implemented here.
  - B1106's LiteLLMProxyRequestSetup.get_sanitized_user_information_from_key is called but not implemented here.
  - B012's service dispatcher that calls these hooks and supplies ServiceLoggerPayload.
pitfalls:
  - "Proxy failure hook checks error_code after extracting it via B253; if error_code is absent or non-numeric (not all-digits string), status_code remains None."
  - "User context fallback only extracts fields that exist on user_api_key_dict via hasattr checks; missing fields are omitted rather than set to None."
  - "Proxy hook flushes if batch size >= self.batch_size; service hooks do NOT flush. Only periodic_flush drains service events."
  - "Service success hook returns silently (without logging) if payload.service is not in DD_LOGGED_SUCCESS_SERVICE_TYPES; this is intentional filtering."
  - "Service hooks merge event_metadata as a dict into the payload dict before JSON serialization; event_metadata is None-safe (or {} handles None). Proxy failure hook has no event_metadata parameter."
  - "Exception logging in all hooks uses verbose_logger.exception, not raising; this preserves request processing even if logging fails."
  - "Only proxy failure hook attaches trace context via B3930; service hooks enqueue to the queue without span attachment."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
