    why: DD_LOGGED_SUCCESS_SERVICE_TYPES constant listing service types that produce success records.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L288-L362
    why: async_post_call_failure_hook implementation with error extraction, user context and batch-size flush.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L607-L678
    why: async_service_failure_hook and async_service_success_hook with event_metadata merging and service-type filtering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L6105-L6168
    why: StandardLoggingPayloadSetup.get_error_information extracting error_code, error_class, message and traceback.
dod:
  - text: DD_LOGGED_SUCCESS_SERVICE_TYPES is a list containing only RESET_BUDGET_JOB as the sole service type that produces success records.
    proof: [success-types]
  - text: async_post_call_failure_hook extracts error information via B253's StandardLoggingPayloadSetup.get_error_information, converting error_code to HTTP status code when present and numeric.
    proof: [proxy-error-extraction]
  - text: Proxy failure hook builds user_context from B1106's LiteLLMProxyRequestSetup.get_sanitized_user_information_from_key when available, falling back to minimal fields (request_route, team_id, user_id, end_user_id) when proxy utilities are unavailable.
    proof: [proxy-user-context]
  - text: Proxy failure hook enqueues payload with ERROR status and flushes queue when batch size is reached.
    proof: [proxy-queueing-flush]
  - text: async_service_failure_hook enqueues service failures with WARN status without flushing.
    proof: [service-failure-queueing]
  - text: async_service_success_hook checks if payload.service is in DD_LOGGED_SUCCESS_SERVICE_TYPES before enqueuing with INFO status; returns silently if service type does not match.
    proof: [service-success-filtering]
  - text: Service hooks merge event_metadata into the payload dict (if present) before JSON serialization; proxy failure hook has no event_metadata parameter.
    proof: [metadata-merging]
  - text: Only async_post_call_failure_hook attaches trace context via B3930's span accessors; service hooks do not.
    proof: [trace-context-attachment]
  - text: All hooks catch exceptions during logging and log them via verbose_logger.exception for diagnostics; exceptions do not propagate.
    proof: [exception-handling]
  - text: Every mutant in error extraction, user context fallback, service filtering and metadata merging is caught by a test.
    proof: [mutants]
