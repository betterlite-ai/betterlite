id: B3934
title: Datadog proxy and service failure events
description: >-
  Implement Datadog logging for proxy-level failures and adjacent-service success/failure events
  in betterlite-logging. Add async_post_call_failure_hook to enqueue proxy failures (auth, DB,
  network errors) with sanitized user context, error extraction and immediate batch-size flush.
  Add async_service_failure_hook and async_service_success_hook to enqueue adjacent-system
  events (Redis, Postgres, budget reset) with service payload integration and warning/info status
  respectively. Service hooks enqueue events without immediate flush; service failures always log,
  while service successes log only for RESET_BUDGET_JOB service type.

  Proxy failures resolve exception information via B253's StandardLoggingPayloadSetup.get_error_information
  and build error_code, error_class, exception message and traceback fields. User context comes from
  B1106's LiteLLMProxyRequestSetup.get_sanitized_user_information_from_key with fallback to minimal
  fields (request_route, team_id, user_id, end_user_id) when proxy utilities are unavailable. Proxy
  hook payloads use ERROR status and attach trace context from B3930's span accessors. Proxy failure
  hook has no event_metadata parameter.

  Service hooks receive ServiceLoggerPayload from B012 (service type, call_type, event metadata),
  merge event_metadata into the payload dict, and wrap with DatadogPayload (WARN for failures,
  INFO for successes). The DD_LOGGED_SUCCESS_SERVICE_TYPES constant lists service types that produce
  success records; only RESET_BUDGET_JOB appears at the pin. Service hooks do not attach trace context.
  Exceptions during logging are caught and logged for diagnostics only.
scope:
  paths:
    - crates/betterlite-logging/src/datadog.rs
    - crates/betterlite-logging/src/datadog/**
    - crates/betterlite-logging/src/datadog/tests.rs
  lint_tables: false
