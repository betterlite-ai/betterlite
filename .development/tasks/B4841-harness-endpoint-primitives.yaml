id: B4841
title: Account harness endpoint usage and protect session credentials
description: >-
  Implement credential filtering, endpoint auth/error helpers, SSE encoding, cumulative
  usage parsing and cost fallback independently of server registration or transport.
  Define endpoint state so neither forwarding nor route handlers need to call their caller.
  Build UsageTracker to accumulate tokens and cost, with add() and snapshot() methods.
  Implement SSEUsageParser to extract token usage from SSE streams line-by-line, handling
  Anthropic/OpenAI/Responses event types. Extract tokens from response headers and bodies
  independently using usage_from_mapping and usage_from_body for JSON responses, and detect
  cost in x-litellm-response-cost headers and _hidden_params. Compute cost using
  litellm.cost_per_token with fallback to zero for unknown models. Filter credentials from
  error messages and HTTP headers, dropping hop-by-hop headers, authorization, API keys and
  accept-encoding. Build authentication by comparing session tokens in constant time. Construct
  gateway headers with filtered incoming headers, adding bearer token, harness tags and optional
  metadata. Encode chunks for Anthropic/chat/responses streaming responses using the
  route-specific SSE encoder and format. Build ModelEndpoint with harness, model, gateway config,
  API credentials and session tracking. Implement route_of() helper to strip path prefixes.
  Uses B4830's Usage/GatewayTarget records and harness/error types; B1686's cost_per_token
  for price lookup. No dependency on B4842/B4843 server implementation. Authentication compares
  the 32-byte session token in constant time; error redaction covers gateway/API/session secrets.
  Chat [DONE] is a trailer, not an accounting event.
scope:
  paths:
    - crates/betterlite-harness/src/endpoint.rs
    - crates/betterlite-harness/src/endpoint/**
  lint_tables: false
references:
