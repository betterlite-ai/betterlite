deviations:
  - what: A provider error raised before the relay starts (a GigaChat token failure, Watsonx's missing-URL 401, or an IAM failure) answers HTTP 500 with a JSON detail whose only key is "error" and whose value is the message.
    why: LiteLLM lets the exception escape its route and the framework answers a plain-text 500. betterlite keeps the status and gives the message in the proxy's normal error shape. Open question in the notes.
  - what: A router 4xx or 5xx on the vllm router branch is relayed with the upstream status and body (B3618's relay_upstream_response).
    why: LiteLLM does not catch the router's HTTP status error on this branch, so the client sees a plain 500. Relaying matches B3618's router relay and loses nothing.
  - what: An invalid JSON body on the watsonx route gets B1100's 400, and a JSON body that is not an object counts as not streaming.
    why: LiteLLM calls request.json() and then .get with no handler, so a bad body or a JSON list ends as a plain 500. betterlite has one body decoder.
out_of_scope:
  - "create_pass_through_route, the relay, logging and cost for these providers: B3615, B3607 and the logging tasks own them; this task only builds the three route handlers and the gigachat_route flag."
  - "uses_router_model, is_streaming_body, request_is_streaming, router_request_metadata, provider_target_url, provider_factory_route, relay_upstream_response and RouterPassthrough: B3618. Its relay_router_model is not used here."
  - "PassthroughProcessor and its call type: B7324 declares them in passthrough_processor and builds base_passthrough_process_llm_request and the exception mapping behind them; this task imports them."
  - "VLLMPassthroughConfig and VLLMModelInfo (VLLM_API_BASE, the x-api-key header): B2220 and B3618's provider_factory_route use them."
  - "WatsonxPassthroughConfig and the IBMWatsonXMixin auth and URL functions: B5842 and B5970. This task calls them."
  - "GigaChatPassthroughConfig (llms/gigachat/passthrough) is not used by any route at the pin; its logging side is reached through B3607. B7325 declares and implements GigachatTokens and GigachatAuthError (litellm/llms/gigachat/authenticator.py): this task only calls them."
  - "The other routes in llm_passthrough_endpoints.py, get_passthrough_router_request_metadata callers and the shared helpers: B3618 to B3629."
pitfalls:
  - "The gigachat 400 check looks at the endpoint text with plain substring matching, so `v1/chat/completions`, `embeddings` and even `foo/completions-bar` all trigger it when the body has no string model."
  - "An empty-string `model` is falsy in the gigachat route, so it skips uses_router_model and gets the same 400 on completions and embeddings endpoints."
  - "A GET to a gigachat endpoint reads no body at all, because get_request_body returns an empty map for every method but POST; the direct path still reaches the token call."
  - "The gigachat direct path asks for the token before it reads the streaming flag, so a missing credential gives the token error even for a request with a bad body."
  - "The five keys are removed from the top level of the gigachat router record only; the parsed body stored under `json` keeps its own copy of `api_base` and `api_key`."
  - "`data.metadata` takes the caller's metadata only when it is a JSON object; a string or list metadata is replaced by the auth keys alone."
  - "The router record's `json` is the get_request_body result and `data` is a fresh B1100 read; for a JSON POST they are equal maps, but they are two reads of the cached bytes."
  - "The vllm router branch sends `json` only when the content type is JSON, so a form POST with a router model reaches the router with data None and json None."
  - "The vllm streaming reply takes the router result's own status and headers, while the gigachat router path leaves both to the common processor and only fills a missing Content-Type."
  - "The watsonx URL from get_complete_url has no `?version=`; the version reaches the upstream only through the query_params argument of create_pass_through_route."
  - "The watsonx query params are copied with dict(), so a repeated key in the caller's query string keeps only its last value."
  - "The watsonx route fetches the IAM token before it reads the body, and validate_environment is called with no key, so the key comes from B5970's environment lookup."
  - "Watsonx's stream flag uses truthiness of `stream`; a form field `stream=false` is the non-empty text \"false\" and counts as streaming."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
