id: B3627
title: Pass-through VLLM GigaChat and Watsonx routes
description: >-
  Build three provider pass-through routes in crates/betterlite-server as the module passthrough_vgw_routes, and register them with axum in that module. Each route checks its inputs, builds the upstream target and hands the request to B3615's create_pass_through_route handler, or to a router relay. All three need a valid virtual key (B052, the same as LiteLLM's user_api_key_auth dependency) and accept GET, POST, PUT, DELETE and PATCH. Shared helpers are not built here: B3618 owns uses_router_model, is_streaming_body, request_is_streaming, router_request_metadata, provider_factory_route, relay_upstream_response and the RouterPassthrough trait; B3602 owns get_credentials; B1100 and B1101 own the body reads. Every name below is at most 30 characters.

  VLLM route. Path `/vllm/{endpoint}`. Steps in order:
  1. Read the body with B1101's get_request_body (POST with a JSON or form body gives the parsed map, every other method gives an empty map; its errors pass through).
  2. Ask B3618's uses_router_model about the body. The streaming flag is B3618's is_streaming_body of the body.
  3. When the model is a router model and a router exists, call the router through B3618's RouterPassthrough trait with: model (the body's `model`), the request method, endpoint, the request query params, the request headers (B1100's cached read), the streaming flag, content/data/files/params/headers/cookies all None, `json` set to the body only when the request content type is JSON (else None), and litellm_metadata from B3618's router_request_metadata. This task does not call relay_router_model, because LiteLLM's vllm branch differs from it. A Buffered reply goes through B3618's relay_upstream_response. A StatusStream reply becomes a streaming response with the reply's own status and B3600's get_response_headers(headers, custom_headers None), with the byte stream unchanged and no SSE keepalive wrapper. A ByteStream reply has no status and gives HTTP 500.
  4. Otherwise call B3618's provider_factory_route with custom_llm_provider "vllm" and return its result. The base URL (env VLLM_API_BASE) and the `x-api-key` header come from that function and B2220, not from this task.

  GigaChat route. Path `/gigachat/{endpoint}`. Steps in order:
  1. Read the body with get_request_body. Take `model` only when it is a JSON string; any other type means no model.
  2. When the model is a non-empty string, ask uses_router_model. When there is no model (missing, not a string, or the empty string) and the endpoint text contains the substring `completions` or `embeddings`, answer HTTP 400 with detail `{"error": "Model is required in request body"}`. Other endpoints with no model go on to the direct path.
  3. When the model is a router model and a router exists, call `gigachat_router_model` (below).
  4. Direct path. Log debug "Gigachat passthrough: Using direct Gigachat model '%s' for endpoint '%s'". The base is config key gigachat_route.api_base (new section below, env GIGACHAT_API_BASE, default https://gigachat.devices.sberbank.ru/api/v1; an empty value counts as unset). Build the target with B3618's provider_target_url. Get the token from the trait `GigachatTokens` (below). Take the streaming flag from B3618's request_is_streaming. Call create_pass_through_route with the endpoint, the target, custom header `Authorization: Bearer {token}`, that flag, and no custom_llm_provider, so the call is typed as a generic endpoint. The token is fetched on every request, before the streaming flag is read.

  `GigachatTokens` is a trait that B7325 declares in crates/betterlite-http (module gigachat_tokens); import it from there and do not declare another. Its one async method `access_token(&self, request)` takes B7325's `GigachatTokenRequest` and returns a SecretString or B7325's `GigachatAuthError`. This route always passes a request with all four fields None, which is LiteLLM's get_access_token called with no argument (env GIGACHAT_ACCESS_TOKEN wins, else OAuth from GIGACHAT_CREDENTIALS or GIGACHAT_API_KEY with a cached token). Build the header from the secret's exposed value. Tests here use a fake implementation. A GigachatAuthError becomes HTTP 500 with detail `{"error": "<message>"}`, where the message is its Display text.

  `gigachat_router_model(model, endpoint, request, body, response, auth, router, processor)` replaces handle_gigachat_passthrough_router_model. It builds one ordered record and calls the passthrough processor:
  1. Read the body again with B1100's body read as a map (the `data`). Merge auth metadata into `data.metadata`: start from the existing `metadata` value when it is a JSON object, else an empty map, then set `user_api_key_user_id`, `user_api_key_team_id`, `user_api_key_org_id` and `agent_id` from the key, each only when it is not None. The key's values win over the caller's.
  2. Log debug "Gigachat router passthrough: model='%s', endpoint='%s', streaming=%s" where streaming is the body's `stream` value or false. It is only logged.
  3. Set, in this order after the existing fields: `model`, `method` (the request method), `endpoint`, `json` (the get_request_body result from the route, not the re-read map), `custom_llm_provider` "gigachat".
  4. Remove the keys `gigachat_auth_url`, `gigachat_access_token`, `gigachat_scope`, `api_base` and `api_key` from the record, so a caller cannot choose the token, the OAuth URL or the upstream host. Only these top-level record keys are removed.
  5. The record carries no `client`. LiteLLM attaches a pooled GigaChat client with a 600 second timeout and a 5 second connect timeout; the architect's processor wiring builds it from B173 when custom_llm_provider is "gigachat" (see notes).
  6. Call B7324's `PassthroughProcessor` (declared in passthrough_processor; import it and `PassthroughCall`, do not declare another) with the record, the request, the caller's response object, the key, the router and the model. Return its result or its error unchanged; B7324's processor already maps failures through the exception handler. When the result is a streaming response with no Content-Type header, set `Content-Type: text/event-stream; charset=utf-8`.

  Watsonx route. Path `/watsonx/{endpoint}`. Steps in order:
  1. Build the URL with B5842's WatsonxPassthroughConfig get_complete_url, with api_base None, api_key None, model empty, the endpoint, request_query_params None and empty litellm_params. The base is env WATSONX_API_BASE, then WATSONX_URL, WX_URL, WML_URL (B5970's get_base_url); with none set B5970's 401 error is raised. The URL carries no `version` here.
  2. Build the auth headers with B5970's validate_environment: empty headers, empty model, no messages, empty optional_params and litellm_params, no key, no base. They are the custom headers of the call (Content-Type and Accept application/json plus Authorization). With no token or zen key in env this fetches an IAM token.
  3. Streaming flag. Only a POST is checked. A multipart/form-data content type is read with B1101's form read, anything else with B1100's body read as JSON. The call is streaming when the map's `stream` is truthy (a JSON bool true; other values follow docs/compatibility.md). A body that is not a JSON object is treated as not streaming.
  4. Query params. Take the request's query params as a plain string map. If `version` is missing, add `version` = `2024-03-13` (WATSONX_DEFAULT_API_VERSION). A `version` the caller sent, even an empty one, is kept.
  5. Call create_pass_through_route with the endpoint, the target from step 1, the headers from step 2, the flag, custom_llm_provider "watsonx" and query_params from step 4. Return its result.
  A provider error raised in steps 1 and 2 becomes HTTP 500 with detail `{"error": "<message>"}` (see deviations).

  Config section. Add crates/betterlite-config/src/sections/gigachat_route.rs with one setting, api_base, read from env GIGACHAT_API_BASE and defaulting to https://gigachat.devices.sberbank.ru/api/v1. An unset var and an empty string both give the default. No code outside betterlite-config reads the environment.

  Tests. Rust tests live in tests.rs under passthrough_vgw_routes::tests and use recording fakes: for B3615's create_pass_through_route factory (endpoint, target, custom headers, custom_llm_provider, streaming flag and query params as called), for B3602's credentials, for RouterPassthrough, for PassthroughProcessor and for GigachatTokens. Test groups are vllm_route, gigachat_direct, gigachat_router and watsonx_route.
