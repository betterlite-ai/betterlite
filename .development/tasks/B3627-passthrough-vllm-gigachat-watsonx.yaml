dod:
  - text: The vllm route sends a router model to the router with the body as `json` only for a JSON content type and the key's litellm_metadata, relays a Buffered reply, streams a StatusStream reply with its own status and headers and no keepalive, and answers 500 for a ByteStream reply.
    proof: [vllm-route-tests, oracle]
  - text: The vllm route sends a body with no router model to provider_factory_route with provider vllm.
    proof: [vllm-route-tests, oracle]
  - text: The gigachat route answers 400 "Model is required in request body" when there is no string model and the endpoint contains completions or embeddings, and forwards other model-less requests.
    proof: [gigachat-direct-tests, oracle]
  - text: The gigachat direct path builds its target from gigachat_route.api_base, sends `Authorization Bearer` with the token from GigachatTokens, uses the request's own streaming flag, passes no custom_llm_provider, and turns a token failure into HTTP 500.
    proof: [gigachat-direct-tests, config-tests, oracle]
  - text: The gigachat router path builds the record in LiteLLM's key order, merges the four auth metadata keys over the caller's metadata, removes gigachat_auth_url, gigachat_access_token, gigachat_scope, api_base and api_key, and sets the SSE Content-Type on a streaming result that has none.
    proof: [gigachat-router-tests, oracle]
  - text: The watsonx route builds the target and headers through B5842 and B5970, reads the stream flag only on POST, keeps a caller `version` and otherwise sends version 2024-03-13, and passes custom_llm_provider watsonx.
    proof: [watsonx-route-tests, oracle]
  - text: The gigachat_route config section loads GIGACHAT_API_BASE from an injected environment and gives the default for an unset or empty value.
    proof: [config-tests, mutants]
