  commands:
    - id: vllm-route-tests
      why: the vllm route mishandles the router branch, the reply kinds or the generic fallback
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vgw_routes::tests::vllm_route(::|$)/)'
    - id: gigachat-direct-tests
      why: the gigachat direct path skips the model check, the Bearer header, the base URL or the token error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vgw_routes::tests::gigachat_direct(::|$)/)'
    - id: gigachat-router-tests
      why: the gigachat router record has the wrong keys, order, metadata or content type
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vgw_routes::tests::gigachat_router(::|$)/)'
    - id: watsonx-route-tests
      why: the watsonx route builds the wrong target, headers, stream flag or version parameter
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vgw_routes::tests::watsonx_route(::|$)/)'
    - id: config-tests
      why: the gigachat_route section does not load or mis-parses the env var
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::gigachat_route::/)'
