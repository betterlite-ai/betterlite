id: B148
title: Prove guardrail monitoring and tool policies and run the retained governance pages
description: >-
  Finish B148 with missing monitor/tool HTTP cases and a browser check of the actual retained
  pages. B9090 already takes in every covered file from the hash-checked archive. B9751 tests
  guardrail forms/submissions, B9752 policies/versions/attachments/pipelines and B9753 templates.
  This task implements no proxy handler, generated client or replacement React page. All
  product routes below have owners. Use their production mounts and B9750's optional governance
  database fixture, never a successful mock response for a management endpoint.

  Monitoring inventory. GuardrailsMonitorView defaults to today minus seven days through
  today. useGuardrailsUsageOverview and useGuardrailsUsageDetail use the retained typed $api
  client, not networking.tsx: GET /guardrails/usage/overview and GET /guardrails/usage/detail/
  <guardrail_id> with start_date,end_date as YYYY-MM-DD. B8772 owns both handlers and mounts;
  B3689 owns projection helpers. Overview reads rows[] with id,name,type,provider,status,
  requestsEvaluated,failRate,avgScore,avgLatency,trend,usageUnits,cost,
  untrackedUsageUnits; chart[] date/passed/blocked; totalRequests,totalBlocked,passRate,
  totalUsageUnits,totalCost,totalUntrackedUsageUnits. Detail reads guardrail_id/name,type,
  provider,status,description,requestsEvaluated,failRate,avgScore,avgLatency,trend,time_series,
  usage_units,usage_units_daily,usage_units_by_team/by_key,cost,cost_by_unit/by_team/by_key,
  untracked_usage_units and its by_team/by_key maps. Null cost is unpriced, never zero.

  GuardrailDetail calls networking.getGuardrailsUsageLogs: GET /guardrails/usage/logs with
  guardrail_id,page=1,page_size=50,start_date,end_date; no policy_id or action query is sent.
  Its local action filter and sample-size control do not fetch another page. Read logs[]
  id,timestamp,action,score,model,input_snippet,output_snippet,reason and total. B8772 also owns
  this route. Seed current and preceding-window metrics, priced and unpriced usage units,
  and an indexed blocked log tied to a config guardrail. Compare the populated overview,
  detail and log requests, then another valid window with no matching rows. B8772's planned
  empty-window/config-only/error cases do not exercise these populated responses.

  Both monitor and tool log viewers call uiSpendLogsCall when a row is opened: GET
  /spend/logs/ui?start_date=<UTC YYYY-MM-DD HH:mm:ss>&end_date=<UTC end-of-day>&page=1&
  page_size=10&request_id=<selected-id>. B1732 builds this route and B8662 mounts it through
  B069's spend composition. The caller finds data[].request_id, falling back to data[0], and
  passes that whole lean ViewLogsLogEntry to B147's LogDetailsDrawer. Compare its model,
  custom_llm_provider,spend,total_tokens,prompt_tokens,completion_tokens,startTime,endTime,
  metadata,team_id,api_key and user fields. The drawer then GETs /spend/logs/ui/<request_id>
  with start_date=<the same UTC window start>, reading messages,response,proxy_server_request
  from B1729's payload route, also mounted by B8662. This differs from B9741's row-startTime
  case, so include the exact window-start handoff in guardrail-logs-and-request-drawer.yaml.
  With a nonempty row.user, useUserLookup additionally GETs /user/list?user_ids=<id>&page=1&
  page_size=1 (B796), consuming users[].user_id,user_email,user_alias; reuse B9732's lookup
  case. LogViewer supplies no sessionId, so this entry does not send /spend/logs/session/ui.
  Do not require heavy message columns in B1732's deliberately lean list response.
  EvaluationSettingsModal GETs /model_group/info (B060), reads
  data[].model_group and fetchAvailableModels metadata and only stores its settings locally.
  Neither monitor caller supplies onRunEvaluation at the pin, so there is no evaluation API
  request to build. Reuse B9735's model-group case.

  ToolPoliciesPanel GET /v1/tool/list has no query/body; networking unwraps tools[] locally.
  B1607 owns it. The panel/table consumes tool_id,tool_name,input_policy,output_policy,
  call_count,created_at,team_id,key_hash,key_alias,user_agent and user.user_alias/user_email/
  user_id; filtering, sorting and new-today counts are local. Each dropdown separately POSTs
  /v1/tool/policy with {tool_name,input_policy} or {tool_name,output_policy}, omitting the other
  policy and all scope fields. B062 builds and mounts that route. The page ignores its return
  body and updates the local row cache after success. Compare a refetch after each partial
  write so the untouched policy cannot be lost. Preserve useCan("viewToolPolicies") and all
  server permissions; no subscription-only gate was found in the B148-covered components.

  ToolPoliciesView opens the retained B149 ToolDetail. Inventory its reachable requests here
  without claiming its source: GET /v1/tool/policy/options reads input_policies/output_policies
  value/label/description fields; GET /v1/tool/<encodeURIComponent(name)>/detail reads tool plus
  overrides[] override_id,tool_name,team_id,key_hash,key_alias,input_policy and timestamps;
  GET /v1/tool/<encoded-name>/logs sends page=1,page_size=50,start_date,end_date as UTC space-
  separated timestamps, initially a ninety-day window, and reads logs[] id,timestamp,model,
  input_snippet and total. All three are B1607, whose bare /v1/tool/<name> detail alias is not
  sent by the page. Test a slash-bearing name to reach the existing suffix dispatcher.
  Scoped block POST /v1/tool/policy sends tool_name,input_policy:"blocked" and either team_id
  or key_hash with optional key_alias. DELETE /v1/tool/<encoded-name>/overrides sends exactly
  one team_id or key_hash query, no body and only the auth header. B062 owns these writes;
  responses trigger detail refresh. B9762 now plans the exact ToolDetail logs and scoped
  write-read-delete transcript; reuse it and B1607's options-without-db and
  detail-overrides-and-slashes cases. Do not add another scoped override transcript here.
  TeamDropdown's actual default page_size=20 request is B9751's case; the size=100 key picker is B9752's,
  with ToolDetail additionally consuming keys[].token. The same spend-log request above opens
  tool invocation details. /v1/tool/spend is not called by this page.

  Audit. No existing on-disk HTTP case sends these monitor, tool or request-drawer calls.
  B1607 plans generic tool reads and B062 partial-update/override cases, but neither plans
  this full page sequence, both fixed date formats or the exact picker requests. B9762
  supplies the ToolDetail portion and B9732 the shared user lookup. If an
  identical dependency case lands first, reuse its path and document its matching request;
  do not recreate any endpoint. All new cases use Bearer auth with discovery's header name,
  default Authorization, compare status/content-type/error type/param/code and full stable
  projections, and capture only generated values and per-gateway IDs. Add admin-viewer and
  ordinary-user requests to prove the actual existing permission decisions, not invented
  UI access. Current defaults and accepted owner config/env keys remain unchanged.

  Browser. B144 explicitly provides the locked tools/dashboard/browser Playwright package,
  the betterlite-dashboard-browser test package and real-binary/database lifecycle. B144's
  tools/dashboard-browser/tests/support/mod.rs holds that lifecycle: a FixtureSeed and proxy
  config in, the URL out, owned process and database cleanup. Use that support in the new
  tools/dashboard-browser/tests/dashboard_governance.rs, test dashboard_governance_pages.
  Add tools/dashboard/browser/governance/*.spec.ts and run everything with bash
  tools/dashboard/browser-check.sh --test dashboard_governance. That script builds and installs
  the bundle, sets up the locked browser, runs strict TypeScript, eslint and prettier over the
  browser package and then exactly this test with --no-tests=fail. Do not modify the shared
  package, config, runner or support files. Missing Chromium, database or test is a failure.

  Sign in against the real proxy as admin; run at root and /gateway with the discovered
  header. Navigate guardrails, policies, guardrails-monitor and tool-policies. Create/read/
  PATCH a local content guardrail, create a policy draft and attachment, resolve its context,
  preview one template and consume enrichment SSE from a local provider fixture. Open a
  populated monitor detail/log drawer and change a tool input policy then reload the page.
  Assert displayed persisted values and captured outgoing request shapes from B9751-B9753,
  no unexpected 404/500, no hydration error and no missing first-party assets. Keep ordinary
  auth/management responses real; provider responses alone may be deterministic mocks.
  Choose the date window before selecting the guardrail, matching the pinned query cache.
  Assert the normal role-denial view in a second authenticated session. Keep test lifetimes
  bounded and cleanup owned by the shared support. Around 400 HTTP fixture/case lines and
  350 browser/runner lines fit this final part; zero upstream executable logic is ported.
scope:
  paths:
    - tools/oracle/cases/ui/governance-monitor-tools/**
    - tools/dashboard/browser/governance/**
    - tools/dashboard-browser/tests/dashboard_governance.rs
    - tools/dashboard-browser/tests/dashboard_governance/**
  lint_tables: false
