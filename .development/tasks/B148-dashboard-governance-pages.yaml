    why: The two typed-client monitor requests, outside networking.tsx.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/guardrails-monitor/_components/GuardrailDetail.tsx#L30-L94
    why: Fixed page/size, date arguments and consumed detail/log fields.
