dod:
  - text: Populated monitor/detail/log requests preserve date windows, usage units, unpriced costs and the actual request-drawer response through both booted proxies.
    proof: [monitor-tool-cases, oracle]
  - text: Tool table partial writes, scoped overrides and encoded-name detail/log reads persist without losing the untouched policy and preserve authorization.
    proof: [monitor-tool-cases, oracle]
  - text: The production dashboard completes guardrail, policy, template, monitoring and tool-policy interactions against betterlite at both deployment roots.
    proof: [governance-browser]
checks:
  optional: []
  commands:
    - id: monitor-tool-cases
      why: Existing empty monitor and generic tool cases cannot prove the page-specific populated sequence.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/governance-monitor-tools)"
    - id: governance-browser
      why: HTTP contracts may pass while the retained page cannot render, authenticate, submit or consume SSE.
      run: bash tools/dashboard/browser-check.sh --test dashboard_governance
oracle_cases:
  - tools/oracle/cases/ui/governance-monitor-tools/overview-detail-units-and-window.yaml
  - tools/oracle/cases/ui/governance-monitor-tools/guardrail-logs-and-request-drawer.yaml
  - tools/oracle/cases/ui/governance-monitor-tools/tool-list-and-partial-updates.yaml
  - tools/oracle/cases/ui/governance-monitor-tools/viewer-and-user-permissions.yaml
  - tools/oracle/cases/management/tool-reports/options-without-db.yaml
  - tools/oracle/cases/management/tool-reports/detail-overrides-and-slashes.yaml
  - tools/oracle/cases/ui/guardrail-forms/team-dropdown-and-visibility.yaml
  - tools/oracle/cases/ui/policy-workflows/team-and-key-alias-selectors.yaml
  - tools/oracle/cases/ui/management-selectors/model-groups-for-router-fallbacks.yaml
  - tools/oracle/cases/ui/mcp-tools/detail-log-dates-and-overrides.yaml
  - tools/oracle/cases/ui/users/infinite-picker-and-id-lookups.yaml
deviations: []
out_of_scope:
  - B9090 retains every covered UI function and test, including static monitor mockData and calculation helpers; B9091/B9092/B9093 own build, branding and serving, and B144 owns authentication/bootstrap and browser support.
  - B9750 owns fixture schema/rows; B9751-B9753 own the other page HTTP contracts. B148 never duplicates their route implementations or case files.
  - B8772 owns monitoring routes, B3689 projections, B1607 tool reads, B062 tool mutations, B1728/B1732 query/list handling, B1729 payloads, B8662 their mount and B060 model groups.
  - B149 retains ToolDetail source and its own MCP-page callers; B9762 supplies its shared HTTP transcript. B147 retains LogDetailsDrawer and fetchAvailableModels; B9732 supplies user lookup coverage.
  - B8667/B8668/B8669/B8790 own guardrail/policy production composition; B9321 owns B3250/B3252 route mounting and the enrichment model adapter.
pitfalls:
  - Monitor overview/detail use the generated $api client while the log fetch still uses networking.tsx; testing only one transport misses part of the page.
  - The guardrail log query key omits dates at the pin, so changing dates while that detail remains selected does not promise a new log fetch.
  - Tool input and output changes are separate POST bodies; a combined body cannot catch accidental deletion of the omitted policy.
  - EvaluationSettingsModal has no onRunEvaluation callback from either monitor caller at this pin, so inventing an evaluation endpoint creates unused work.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
