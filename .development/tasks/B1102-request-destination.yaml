id: B1102
title: Request model and destination policy
description: >-
  Implement the pure endpoint-specific model precedence and URL-valued destination rejection used by API routes.
  Preserve the source error status/type/param/code before any provider request.


  Implement crates/betterlite-core/src/api/request_destination.rs. Use RequestDestinationInput and RequestDestinationResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): litellm_pre_call_utils.py:423 status_code=400, exception_detail=FastAPI detail object. Compare
  the actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions endpoint_model_precedence, deployment_url_rejected, missing_model_source_error
  under api::request_destination::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RequestDestination in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {request_destination: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/common_utils/http_parsing_utils.py: resolve_inference_model (L32-L63); litellm/proxy/common_utils/http_parsing_utils.py:
  get_tags_from_request_body (L618-L651); litellm/proxy/common_utils/http_parsing_utils.py: populate_request_with_path_params
  (L654-L699); litellm/proxy/common_utils/http_parsing_utils.py: _add_vector_store_id_from_path (L702-L734); litellm/proxy/litellm_pre_call_utils.py:
  _reject_url_valued_destinations (L394-L408); litellm/proxy/litellm_pre_call_utils.py: reject_url_valued_destination
  (L411-L435). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 124 owned nonblank/non-comment/non-docstring Python lines (162 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 144 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 358 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B1100 (Shared
  request body decoding). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
