id: B365
title: Input and output token reservation primitives
description: 'Implement IoLimits, IoReservation and UsageTokens with minute-key ownership, input estimates,
  effective output caps and atomic input/output reservations. Reuse B013 token counts and B360 typed counters;
  implement both rollback paths through the same Rust primitive. Return the exact RateLimitError fields
  and reservation rather than executing calls. Configuration boundary keys introduced or consumed here:
  itpm, otpm. Pinned declaration defaults: itpm=None; otpm=None. Resolve env values once in betterlite-config,
  never in router code. Implement the owned native service in crates/betterlite-router/src/io_token_reservations.rs.
  Add ProbeOperation::IoTokenReservations in tools/oracle/src/router_probes/mod.rs and the corresponding B365 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_utils/pre_call_checks/io_token_rate_limit_check.py:
  set_io_token_rate_limit_request_kwargs (L48-L62), get_io_token_rate_limit_request_kwargs (L65-L66),
  seconds_until_minute_reset (L69-L71), get_deployment_io_token_limits (L74-L89), deployment_has_io_token_limits
  (L92-L94), _get_cache_keys (L97-L106), _estimate_input_tokens (L109-L122), _model_max_output_tokens
  (L125-L133), _resolve_max_tokens (L136-L153), _get_usage_tokens (L156-L177), _extract_response_usage
  (L180-L183), _usage_is_present (L186-L200), _resolve_reconcile_usage_tokens (L203-L234), _stash_reservation_in_metadata
  (L237-L258), _extract_reservation (L261-L269), _as_mutable_mapping (L272-L274), _reservation_channels
  (L277-L290), _read_reservation_from_kwargs (L293-L297), _clear_reservation_from_kwargs (L300-L309),
  _reservation_value (L312-L322), _rate_limit_error (L325-L343), _sync_increment_with_rollback (L346-L367),
  _increment_with_rollback (L370-L394), io_token_pre_call_check (L397-L456), async_io_token_pre_call_check
  (L459-L525). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
