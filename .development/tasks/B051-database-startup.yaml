id: B051
title: Database startup, migration jobs and readiness
description: >-
  Compose DatabaseEndpoints, native pools, MigrationRecovery, RequestLogIndexes, heartbeat, credential
  refresh and MigrationDriftCheck at startup; expose database state to B130 readiness without implementing
  its HTTP route. Wire only startup services B710-B719, B731, B854 and B857 and tools/betterlite-db-admin
  migrate. Preserve existing rows and drain owned tasks/pools at shutdown. The migration job waits for
  index completion; the server schedules it without delaying readiness.


  Build the production database_startup module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/prisma_client.py:
  PrismaManager._apply_replica_identity_full_if_requested (L883-L895; 12 source lines), PrismaManager._raise_if_partitioned_spend_logs
  (L898-L911; 14 source lines), PrismaManager.setup_database (L914-L985; 65 source lines), PrismaManager.build_request_log_indexes
  (L988-L997; 10 source lines), PrismaManager.start_request_log_index_build (L1000-L1009; 10 source lines),
  should_update_prisma_schema (L1012-L1036; 20 source lines). litellm-proxy-extras/litellm_proxy_extras/utils.py:
  ProxyExtrasDBManager.setup_database (L1285-L1315; 28 source lines), ProxyExtrasDBManager.build_request_log_indexes
  (L1318-L1330; 13 source lines), ProxyExtrasDBManager.run_migration_job (L1333-L1342; 10 source lines),
  ProxyExtrasDBManager.start_request_log_index_build (L1345-L1352; 8 source lines). litellm-proxy-extras/litellm_proxy_extras/prisma_toolchain.py:
  _timeout_from_env (L81-L100; 20 source lines), prisma_command_timeout (L103-L107; 5 source lines), migration_lock_timeout
  (L110-L111; 2 source lines), prisma_migrate_deploy_timeout (L121-L127; 7 source lines). Pinned settings
  read by this component (resolve once in betterlite-config, pass typed values): DISABLE_SCHEMA_UPDATE='false';
  DATABASE_URL=None; DIRECT_URL=None; USE_V2_MIGRATION_RESOLVER='true'; USE_PRISMA_DB_PUSH=None.


  general_settings.disable_prisma_schema_update defaults absent and overrides DISABLE_SCHEMA_UPDATE=false
  even when explicitly false. Preserve LITELLM_PRISMA_COMMAND_TIMEOUT=60, LITELLM_PRISMA_MIGRATE_DEPLOY_TIMEOUT=600
  and LITELLM_MIGRATION_LOCK_TIMEOUT=600 seconds with warning fallback for invalid, nonfinite or nonpositive
  values and deploy-timeout precedence. Accept PRISMA_OFFLINE_MODE, PRISMA_CLI_PATH, PRISMA_NODEENV_CACHE_DIR,
  LITELLM_PRISMA_BOOTSTRAP_TIMEOUT and LITELLM_MIGRATION_DIR as ignored bootstrap inputs and warn once.
  NPM_CONFIG_CACHE is outside database settings and is not rejected; MCP uses it.


  Add the database_startup operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a database-startup-*
  seed to B171 helper_case, which already owns this decoder.


  Also write tools/betterlite-db-admin::database_startup::tests::dispatches_native_operation and rejects_bad_arguments;
  the admin command check must fail without these real CLI dispatch tests.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::database_startup::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: after B1232 extracts the executable shell, allow 200 native startup/command-adapter code, 180
  behavior/Postgres tests, 65 helper adapters, 70 runtime wiring and 50 config lines, 565 within a 600-line
  gate; fixture/corpus/lock exclusions alone apply.


  Native-only deviation tests in this production module: native_prisma_bootstrap_variables_and_litellm_migration_dir_are_accepted_with,
  native_betterlite_db_admin_migrate_replaces_python_migrations_run_py_and_pris. Exercise the precise
  changed setting/output branch and assert its configured status/error/side effects; do not add these
  differing results to oracle equality cases.


  B1232 creates the database-admin package and typed command dispatcher. Extend its registry for this
  operation only; do not recreate its Cargo package or depend on betterlite-server from the admin tool.
  The operation adapter assembles native betterlite-db services directly.
