deviations:
  - what: Prisma bootstrap variables and LITELLM_MIGRATION_DIR are accepted with one startup warning and
      no toolchain side effects.
    why: Official images set these obsolete native-runtime inputs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/prisma_toolchain.py#L57-L278
  - what: betterlite-db-admin migrate replaces python migrations/run.py and prisma_migration.py; exit
      2 is unrecoverable migration failure, exit 1 is exhausted retries. B121 owns --skip_server_startup
      and forwards to this operation.
    why: Native SQL migrations do not run Prisma or Node.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L1426-L1447
