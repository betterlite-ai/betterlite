dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: existing_schema_no_rewrite,
      disabled_updates_warn_only, startup_migration_failure, shutdown_drains, migration_job_waits, migration_exit_codes,
      obsolete_bootstrap_warning, schema_update_setting_precedence, invalid_timeout_warning, deploy_timeout_precedence,
      postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The offline admin command invokes the native operation and preserves its exit/error contract.
    proof:
      - admin-tests
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_prisma_bootstrap_variables_and_litellm_migration_dir_are_accepted_with,
      native_betterlite_db_admin_migrate_replaces_python_migrations_run_py_and_pris.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^database_startup::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/database_startup.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-startup-*")"
        && grep -rlq "database_startup" tools/oracle/fuzz/corpus/helper_case/database-startup-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: admin-tests
      why: The offline command does not dispatch the named native operation or reject bad arguments.
      run: cargo nextest run --locked -p betterlite-db-admin --no-tests=fail -E 'test(/^database_startup::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/database_startup::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/database_startup::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_startup::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-startup-*")"
        && grep -rlq "DISABLE_SCHEMA_UPDATE" crates/betterlite-config/fuzz/corpus/config_yaml/database-startup-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
