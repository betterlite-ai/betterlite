id: B367
title: Wildcard deployment matching
description: 'Build PatternCatalog with ordered pattern registration/removal, star-only compilation, specificity
  ordering and model substitution. Return immutable candidate identities; do not construct clients, implement
  aliases or authorize callers. Literal regex characters remain escaped. Implement the owned native service
  in crates/betterlite-router/src/wildcard_catalog.rs. Add ProbeOperation::WildcardCatalog in tools/oracle/src/router_probes/mod.rs
  and the corresponding B367 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_utils/pattern_match_deployments.py:
  PatternUtils.calculate_pattern_specificity (L16-L31), PatternUtils.sorted_patterns (L34-L47), PatternMatchRouter.__init__
  (L59-L61), PatternMatchRouter.add_pattern (L63-L76), PatternMatchRouter.remove_deployment (L78-L87),
  PatternMatchRouter._pattern_to_regex (L89-L111), PatternMatchRouter._return_pattern_matched_deployments
  (L113-L123), PatternMatchRouter.route (L125-L159), PatternMatchRouter.set_deployment_model_name (L162-L208),
  PatternMatchRouter.get_pattern (L210-L222), PatternMatchRouter.get_deployments_by_pattern (L224-L238).
  Implement these behaviors through the typed Rust services above; synchronous facades and structural
  accessors reuse the same primitive instead of separate ports.'
scope:
  paths:
  - crates/betterlite-router/src/wildcard_catalog.rs
  - crates/betterlite-router/src/wildcard_catalog/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/mod/**
  - crates/betterlite-server/src/routing/wildcard_catalog.rs
  - crates/betterlite-server/src/routing/wildcard_catalog/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/strategy/**
  - crates/betterlite-router/src/context.rs
  - crates/betterlite-router/src/context/**
  - tools/oracle/src/router_probes/wildcard_catalog.rs
  - tools/oracle/src/router_probes/wildcard_catalog/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/wildcard_catalog.py
  - tools/oracle/cases/routing/wildcard-catalog/**
  - tools/oracle/helpers/b367.py
  - tools/oracle/helpers/b367/**
  - tools/oracle/src/helpers/router/b367.rs
  - tools/oracle/src/helpers/router/b367/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pattern_match_deployments.py#L16-L247
  why: Implementation boundary verified against the pinned checkout.
dod:
- text: Write tests named wildcard_catalog_behaviors and wildcard_catalog_boundaries under wildcard_catalog::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - wildcard-catalog-behaviors
  - wildcard-catalog-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: wildcard-catalog-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::wildcard_catalog_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: wildcard-catalog-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::wildcard_catalog_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/wildcard_catalog.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/wildcard_catalog.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/wildcard-catalog/wildcard-specificity.yaml
- tools/oracle/cases/routing/wildcard-catalog/wildcard-multiple-captures.yaml
- tools/oracle/cases/routing/wildcard-catalog/remove-last-pattern.yaml
deviations: []
out_of_scope:
- B302 owns final integration and the remaining functions listed in its implementation boundary.
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
