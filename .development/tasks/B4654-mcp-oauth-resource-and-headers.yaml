id: B4654
title: "MCP OAuth resource URLs and request header parsing"
description: >-
  Build two small pure modules in betterlite-mcp that the MCP route handlers and the MCP admission code call: oauth_resource (the URLs the gateway advertises and the RFC 8707 resource it sends upstream) and request_headers (what the gateway reads out of the inbound MCP request headers and path). Both take plain values, not framework requests. The caller reads the HTTP request, the config and the trusted-proxy decision and passes them in, so nothing here reads a global.


  oauth_resource has three submodules, each with a tests.rs beside it.


  base_url. strip_default_port(scheme, netloc) lowercases the netloc and drops the scheme's default port (http 80, https 443); for an IPv6 literal the port is whatever follows the closing bracket, and a port that is not a number leaves the lowercased netloc unchanged. normalize_proxy_base_url(raw) is LiteLLM's _resolve_proxy_base_url_env with the env read moved out: it takes the PROXY_BASE_URL text, trims it, returns None for empty text, returns scheme://netloc/path with a trailing slash removed when the scheme is http or https and there is a netloc (params, query and fragment are dropped), and otherwise logs a warning that PROXY_BASE_URL is not a valid http(s) URL and returns None. get_request_base_url(proxy_base_url, origin) takes a RequestOrigin value with the base_url Starlette would give (scheme://host[:port]/root_path), the X-Forwarded-Proto, X-Forwarded-Host and X-Forwarded-Port values as Option<&str>, and from_trusted_proxy: bool. Order: a normalized PROXY_BASE_URL wins; else the literal base_url without its trailing slash when the caller is not a trusted proxy; else the forwarded values, exactly as LiteLLM combines them (scheme from the proto header when it is non-empty; a host that already holds a colon and does not start with "[" is used as is and the port header is ignored; otherwise host plus port header; with no host header the base_url's own netloc gets the port header only when that netloc has no colon). A forwarded result is rebuilt with strip_default_port and the base_url's path.


  challenge. well_known_root_suffix(server_root_path) returns the SERVER_ROOT_PATH text, or "" when it is "/". route_relative_request_path takes the ASGI values (original_path, path, app_root_path, root_path, each optional except path) and returns the original path (first non-empty of original_path and path) with the root path removed on a whole-segment boundary; the root path is app_root_path when non-empty, else root_path, with trailing slashes removed. passthrough_resource_metadata_url(base_url, route_path, server_name, root_suffix) returns base_url + "/.well-known/oauth-protected-resource" + root_suffix + "/{server}/mcp" when the route path starts with "/{server}/mcp", else "/mcp/{server}". passthrough_www_authenticate returns Bearer, then error="invalid_token", when asked, then resource_metadata="url". byok_www_authenticate(proxy_base_url, request_root_path) returns Bearer resource_metadata="{base}{BYOK_RESOURCE_METADATA_PATH}", where base is the normalized PROXY_BASE_URL or else the request root path with trailing slashes removed (so it can be a bare path, as in LiteLLM). BYOK_RESOURCE_METADATA_PATH is "/v1/mcp/oauth/protected-resource". TOKEN_NO_CACHE_HEADERS is Cache-Control: no-store and Pragma: no-cache.


  resource_identity. A small python_url module reproduces the parts of Python's urlparse, urlsplit, urlunparse and urlunsplit that these functions use (scheme, netloc, path, params, query, fragment, hostname, port). Do not use the url crate for this; it normalizes differently (percent-encoding, IDNA, default ports). canonicalize_url_identity lowercases the scheme, drops userinfo (everything up to the last "@" of the netloc), applies strip_default_port, drops params, query and fragment, and removes trailing slashes from the path. canonical_resource_uri returns None when the URL has no scheme or no netloc, else the identity. resolve_upstream_resource(upstream_resource, url, server_id) trims the configured value; blank gives None; any value that is not "auto" (compared case-insensitively) is returned verbatim; "auto" derives canonical_resource_uri(url), and with no url or an unparseable url it logs a warning naming server_id and returns None. build_upstream_oauth2_token_request takes the same three server fields plus auth_method, client_id and client_secret, builds the client auth with B4650's normalize_token_auth_method and build_token_client_auth, and adds a resource entry to the body when resolve_upstream_resource gives one. redact_mcp_resource_url(url) reduces a URL to scheme://hostname[:port] for logs and spend metadata and returns None when there is no host or the port is invalid.


  request_headers has three submodules, each with a tests.rs beside it.


  raw_headers. RawHeaders is built from the ordered (name bytes, value bytes) pairs of the request, like LiteLLM's _safe_get_headers_from_scope. It first rejects a request with more than one Authorization header (name compared case-insensitively) with a typed error that carries status 400 and the detail "Multiple Authorization headers are not allowed". It then decodes names and values as latin-1, collapses exact-name duplicates the way a Python dict does (first position kept, last value wins), lowercases names, and keeps the header order. lookup(name) is case-insensitive and returns the first match.


  client_headers. Constants: x-litellm-api-key, Authorization, x-mcp-auth, x-mcp-servers, x-mcp-access-groups. get_litellm_api_key returns x-litellm-api-key when it is non-empty, else Authorization when non-empty, else None. mcp_auth_header returns the configured client-side header (default x-mcp-auth, from config) and logs the deprecation warning when it is present. server_auth_headers collects every x-mcp-{alias}-{header} header into alias -> header -> value, skipping x-mcp-servers and x-mcp-access-groups; the alias is the text before the first dash after "x-mcp-", the header name is the rest (lowercase, except "authorization" which becomes "Authorization"), and a later header with the same alias and name overwrites the earlier one. oauth2_headers returns {"Authorization": value} of the last header whose name starts with "authorization", or an empty map. parse_mcp_servers_header and parse_mcp_access_groups_header split a comma list, trim each item, drop empty items, return None when the header is absent and Some(empty list) when it is present but holds no items. The servers parser is the inline block in process_mcp_request; B4673 calls it.


  path_targets. extract_target_server_names_from_path(path) decides which MCP server a request path targets, and auth gating relies on it, so it must agree with LiteLLM on every input (the same function in server.py::_get_mcp_servers_in_path is what routing uses). It returns an empty list for "/mcp/sse" and "/mcp/sse/messages" (trailing slashes ignored); [first] for "/{server}/mcp[/...]" when the first segment is not "mcp"; a comma list for "/mcp/a,b[/tail]"; and one name (with at most one slash inside it) for "/mcp/{name}[/tail]". Anything else gives an empty list so callers fail closed. This is the decoder for outside input: add a cargo-fuzz target request_path_targets that feeds UTF-8 path text to it, with a corpus replay test. resolve_target_server_names(path, header_servers) returns the path targets when there are any, else the header list, else empty. cold_start_server_names(path, header_servers) returns the single path target, or None when the path gives no single target or the header names a server the path does not.


  mcp_client_side_auth_header_name is a config value: a small section crates/betterlite-config/src/sections/mcp_client_side_auth.rs reads the env var LITELLM_MCP_CLIENT_SIDE_AUTH_HEADER_NAME and general_settings.mcp_client_side_auth_header_name. If the env var is set, its value is used, and an empty value falls back to the default "x-mcp-auth"; else if the general_settings key is set, the same rule; else the default.


  The module and test names above are the contract; the skeleton creates the empty files. Sizing: about 320 non-blank LiteLLM source lines are owned, split roughly 150 in oauth_utils and 170 in user_api_key_auth_mcp.
