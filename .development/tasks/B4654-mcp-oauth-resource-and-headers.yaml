dod:
  - text: >-
      strip_default_port, normalize_proxy_base_url and get_request_base_url match LiteLLM for PROXY_BASE_URL set or invalid, an untrusted caller, and trusted forwarded proto, host, port and IPv6 combinations.
    proof: [base-url-tests, oracle]
  - text: >-
      well_known_root_suffix, route_relative_request_path, passthrough_resource_metadata_url, passthrough_www_authenticate and byok_www_authenticate return LiteLLM's strings for both path spellings, the invalid_token form, a root path and an unset PROXY_BASE_URL.
    proof: [challenge-tests, oracle]
  - text: >-
      canonicalize_url_identity, canonical_resource_uri and redact_mcp_resource_url match LiteLLM for default ports, userinfo, params, query, IPv6 literals, relative URLs and an invalid port.
    proof: [resource-identity-tests, oracle]
  - text: >-
      resolve_upstream_resource handles blank, verbatim and "auto" (with a url, without a url and with a relative url), and build_upstream_oauth2_token_request adds the resource to the body for client_secret_post and client_secret_basic.
    proof: [resource-identity-tests, oracle]
  - text: >-
      RawHeaders rejects two Authorization headers with status 400 and the exact detail, collapses exact-name duplicates last-wins, and looks names up case-insensitively.
    proof: [raw-headers-tests, oracle]
  - text: >-
      get_litellm_api_key, mcp_auth_header, server_auth_headers, oauth2_headers, parse_mcp_servers_header and parse_mcp_access_groups_header match LiteLLM on the cases in the oracle list.
    proof: [client-headers-tests, oracle]
  - text: >-
      extract_target_server_names_from_path, resolve_target_server_names and cold_start_server_names match LiteLLM on every path shape listed in the oracle cases.
    proof: [path-targets-tests, oracle]
  - text: >-
      extract_target_server_names_from_path has a cargo-fuzz target whose corpus replays without a panic.
    proof: [parser-corpus]
  - text: >-
      The mcp_client_side_auth section loads the env var and the general_settings key with LiteLLM's precedence and empty-value fallback.
    proof: [config-tests]
  - text: >-
      The oracle helper adapters pass strict Python checks and the new helper seeds replay.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: base-url-tests
      why: The base URL, port stripping or PROXY_BASE_URL tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_resource::base_url::tests::/)'
    - id: challenge-tests
      why: The well-known path, route path or WWW-Authenticate tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_resource::challenge::tests::/)'
    - id: resource-identity-tests
      why: The URL identity, upstream resource or token request tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_resource::resource_identity::tests::/)'
    - id: raw-headers-tests
      why: The request header collection and duplicate Authorization tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^request_headers::raw_headers::tests::/)'
    - id: client-headers-tests
      why: The client credential header, server auth header and list header tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^request_headers::client_headers::tests::/)'
    - id: path-targets-tests
      why: The path target parsing tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^request_headers::path_targets::tests::/) - test(/replays_the_/)'
    - id: parser-corpus
      why: The request_path_targets fuzz target, its added corpus or its replay test is missing or fails.
      run: test -f crates/betterlite-mcp/fuzz/fuzz_targets/request_path_targets.rs && grep -q request_path_targets crates/betterlite-mcp/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/request_path_targets)" && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(replays_the_request_path_targets_corpus)'
    - id: config-tests
      why: The mcp_client_side_auth section tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_client_side_auth::/)'
    - id: helper-python
      why: The helper adapter is missing or fails strict Python checks.
      run: test -f tools/oracle/helpers/b4654.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4654 operation reaches the shared helper case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-oauth-resource-*' 'tools/oracle/fuzz/corpus/helper_case/mcp-request-headers-*')" && grep -rlq b4654 tools/oracle/fuzz/corpus/helper_case/mcp-oauth-resource-* && grep -rlq b4654 tools/oracle/fuzz/corpus/helper_case/mcp-request-headers-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
