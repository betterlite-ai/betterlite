deviations:
  - what: Header values are not written to the debug log when a server auth header is found. LiteLLM logs the first 10 characters of the value.
    why: Ten characters of a bearer token or API key is a secret leak in a log line; the alias and header name are enough to debug.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L1437-L1442
  - what: The invalid PROXY_BASE_URL warning is logged each time normalize_proxy_base_url runs, not once per distinct value. The caller resolves it once at startup.
    why: LiteLLM keeps a module global to deduplicate the warning; betterlite keeps no module state, and one startup call gives the same single line.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/oauth_utils.py#L110-L127
  - what: LITELLM_MCP_CLIENT_SIDE_AUTH_HEADER_NAME is read from the process environment only, not from a configured secret manager.
    why: The secret manager lookup (get_secret_str) belongs to the secret manager task; the header name is not a credential, and the env var is the documented way to set it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L1458-L1478
  - what: A path that ends in a newline character is not treated as ending at the newline. LiteLLM's regex $ also matches just before a final newline.
    why: An HTTP request target cannot carry a raw newline, so no request reaches this case; the oracle cases send none.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L717-L737
  - what: The fallback to empty headers when an ASGI header entry is malformed (the AttributeError and TypeError branch) does not exist. RawHeaders takes typed name and value byte pairs.
    why: The server layer hands over bytes from the HTTP parser, so a malformed entry cannot occur.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L1519-L1529
