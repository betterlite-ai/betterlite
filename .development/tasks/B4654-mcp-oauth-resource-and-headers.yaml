pitfalls:
  - "extract_target_server_names_from_path with a comma list finds the tail with re.search(r\"/([^/,]+(?:/[^/,]+)*)$\"): a tail that contains a comma, an empty segment (\"a,b//c\") or only a trailing slash (\"a,b/\") changes where the name list ends, so \"a,b/\" yields [\"a\", \"b/\"]. Write cases for each."
  - "Path /mcp/mcp/foo does not hit the /{server}/mcp branch because the first segment is \"mcp\"; it falls to the /mcp/ branch and returns [\"mcp/foo\"]. Path /mcp//x returns [\"/x\"] because the single-server regex needs a non-slash first character."
  - "The /{server}/mcp branch runs before the /mcp/ branch and only checks the second segment, so /foo/mcp/bar is [\"foo\"] while a path with a query like /foo/mcp?x=1 is not (its second segment is \"mcp?x=1\") and returns []."
  - "Header names reach the parsers lowercased, but alias and header name in x-mcp-{alias}-{header} split on the first dash: x-mcp-my-server-authorization gives alias \"my\" and header \"server-authorization\". Only the header name \"authorization\" is capitalized."
  - "oauth2_headers matches any header whose name starts with \"authorization\" (authorization-foo as well) and the last match wins; the output key is always \"Authorization\"."
  - "get_litellm_api_key falls through an empty x-litellm-api-key to Authorization, but process_mcp_request's has_explicit_litellm_key only checks that x-litellm-api-key is present, so the two disagree on an empty value. Return both facts (value and is-present) and let B4673 use them."
  - "The configured LITELLM_MCP_CLIENT_SIDE_AUTH_HEADER_NAME is matched case-insensitively against the incoming headers, so lowercase it for the lookup. A configured name starting with x-mcp- and containing another dash is also picked up as a server auth header by server_auth_headers; keep that."
  - "get_byok_www_authenticate has no host: with PROXY_BASE_URL unset it returns a relative path such as Bearer resource_metadata=\"/litellm/v1/mcp/oauth/protected-resource\". Do not add the request origin."
  - "get_request_base_url trusts X-Forwarded-Proto verbatim (no lowercase, no comma split) and applies strip_default_port, which lowercases the netloc, only on the forwarded branch. The untrusted and PROXY_BASE_URL branches return their text unchanged except for the trailing slash."
  - "With no X-Forwarded-Host, the forwarded port is added to the base_url netloc only when that netloc has no colon, so an IPv6 base URL such as https://[::1]/ never gets the port."
  - "redact_mcp_resource_url drops IPv6 brackets (it uses the hostname), omits port 0 because it is falsy, and returns \"//host\" for a URL with no scheme but a netloc; a non-numeric or out-of-range port makes it return None, not an error."
  - "urlparse drops params, so canonicalize_url_identity of https://h/a;b/ is https://h/a. Python also raises on a netloc with an unmatched bracket; return a typed error there instead of panicking. Callers pass server URLs that come from the database."
  - "resolve_upstream_resource compares the trimmed value to \"auto\" case-insensitively but returns any other value verbatim with its original case, because the authorization server matches the resource exactly."
  - "build_upstream_oauth2_token_request must keep the client auth headers untouched and only add the resource key to the body; the RFC 8693 legs (OBO, id_jag) do not call it and carry audience instead."
  - "Duplicate Authorization is counted on the raw pairs before the dict collapse. Two headers named Authorization and authorization are a duplicate; one Authorization plus one x-litellm-api-key is not."
