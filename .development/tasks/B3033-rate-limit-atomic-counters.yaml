dod:
  - text: CHECK_AND_INCREMENT_BY_N_SCRIPT is defined as a Lua script string constant with all-or-nothing validation and per-descriptor 4-tuple ARGV layout (limit, increment, ttl, window_size).
    proof: [lua-script-tests]
  - text: _build_descriptor_atomic_payload returns a DescriptorAtomicGroup tuple of (keys, args, meta) with window_key and counter_key pairs for every rate_limit_type that has a positive limit.
    proof: [payload-building-tests]
  - text: Each descriptor's window_key uses hash-tag syntax {descriptor_key:descriptor_value}:window for Redis Cluster compatibility.
    proof: [payload-building-tests]
  - text: _build_atomic_response decodes status_code==1 (over-limit) to OVER_LIMIT with counter_index, current_counter, and limit from the Lua reply.
    proof: [response-decoding-tests]
  - text: _build_atomic_response decodes status_code==0 (success) to OK with new_counter and window_start values for each counter.
    proof: [response-decoding-tests]
  - text: RateLimitResponse includes reservation_windows as a frozenset of (counter_key, window_start, backend_source) tuples.
    proof: [response-decoding-tests]
  - text: _atomic_check_and_increment_in_memory performs the same validation as the Lua script using the local DualCache mirror (local_only=True).
    proof: [in-memory-fallback-tests]
  - text: Window expiry logic matches the Lua script (now - window_start >= window_size), using _get_current_time for consistency.
    proof: [in-memory-fallback-tests]
  - text: On window reset, all sibling counter keys (:requests, :tokens) are reset to 0 with the window_size TTL via async_set_cache.
    proof: [in-memory-fallback-tests]
  - text: In-memory mode accepts eventual divergence from Redis; divergence is bounded by the counter TTL.
    proof: [in-memory-fallback-tests]
  - text: Every default, literal window size, TTL handling, and validation threshold a user can observe is in a named case with input and outcome.
    proof: [oracle-cases-tests]

checks:
  optional: []
  commands:
    - id: lua-script-tests
      why: CHECK_AND_INCREMENT_BY_N_SCRIPT must define the atomic validation and return format
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^atomic_counter::lua_script(::|$)/)'
    - id: payload-building-tests
      why: _build_descriptor_atomic_payload must construct correct KEYS and ARGV for single/multi-limit descriptors
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^atomic_counter::payload(::|$)/)'
    - id: response-decoding-tests
      why: _build_atomic_response must decode OK and OVER_LIMIT statuses with correct indices and values
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^atomic_counter::response(::|$)/)'
    - id: in-memory-fallback-tests
      why: _atomic_check_and_increment_in_memory must replicate Lua logic locally and reset sibling counters on window expiry
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^atomic_counter::in_memory(::|$)/)'
    - id: oracle-cases-tests
      why: Oracle cases verify consistent behavior across single-counter, multi-counter, over-limit, and window-reset scenarios
      run: cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/atomic_counter -k 'b3033'

