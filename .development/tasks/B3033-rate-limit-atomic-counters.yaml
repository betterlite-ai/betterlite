  - tools/oracle/cases/atomic_counter/single-counter-ok.yaml
  - tools/oracle/cases/atomic_counter/single-counter-over-limit.yaml
  - tools/oracle/cases/atomic_counter/dual-counter-requests-tokens.yaml
  - tools/oracle/cases/atomic_counter/window-reset-sibling-keys.yaml
  - tools/oracle/cases/atomic_counter/in-memory-window-expiry.yaml

deviations:
  - what: >-
      CHECK_AND_INCREMENT_BY_N_SCRIPT uses redis.call('TIME') to obtain server-provided time rather than accepting a client timestamp.
    why: Prevents TOCTOU races across replicas with skewed clocks; Redis server time is deterministic for window reset decisions.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L226
  - what: >-
      _atomic_check_and_increment_in_memory uses local DualCache (local_only=True) when Redis is unavailable, accepting window/counter divergence until TTL expiry.
    why: Fallback ensures admission continues during cache outages; divergence is bounded and recovers when the cache recovers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L2430

out_of_scope:
  - Cross-descriptor rollback and refunds belong to B3034 (settlement and rollback).
  - Windowed rate-limit checking (should_rate_limit, admission path) belongs to B3036.
  - Window storage and Redis slot grouping belong to B3032.
  - Parallel concurrency gauges belong to B3035.
  - Token increment scripts and operations belong to B3037.
  - Cache transport (async_get_cache, async_set_cache implementations) awaits external ownership (question 1 in the outline).
  - Parent OTel span extraction and post-call batch logging belong to B3046.

pitfalls:
  - The Lua script's counter-index return value (1-based) must be decremented to match per_counter_meta (0-based) array indexing.
  - Window expiry detection (now - window_start >= window_size) compares integers; ensure window_start is an integer before subtraction.
  - Sibling counter keys (:requests, :tokens) must be reset as a group when the window expires; _sibling_counter_keys from B3031 derives both from a single :window key.
  - In-memory mode must use local_only=True on every async_get_cache/async_set_cache call to avoid cross-pollinating with Redis snapshots.
  - RateLimitStatus.descriptor_value must be populated in every OK/OVER_LIMIT status so upstream handlers can distinguish scopes (e.g., project ITPM vs OTPM).
  - The 4-tuple ARGV layout is per-descriptor in the Lua script comments but indexed per-counter in the return value; keep per_counter_meta and KEYS parallel at the counter level, not the descriptor level.

review_level: standard
