id: B3033
title: Atomic rate-limit counter evaluation
description: >-
  Build one descriptor's Lua arguments and status decoding, plus the locked local all-or-nothing counter algorithm.
  Redis uses server time and promises atomicity only within each script invocation; the next part (B3034) owns cross-descriptor rollback.
  The Lua script CHECK_AND_INCREMENT_BY_N_SCRIPT (owned by B3031) validates all descriptors against their limits before modifying any counter (all-or-nothing semantics).
  When Redis is unavailable, the in-memory fallback executes the same validation locally using the DualCache mirror, accepting eventual window/counter divergence until TTL expiry.
  _build_descriptor_atomic_payload constructs the KEYS and ARGV arrays for one descriptor, handling optional requests and tokens limits separately.
  _build_atomic_response decodes the Lua return value into RateLimitResponse (OK with updated counts and reservation windows, or OVER_LIMIT with the first blocked counter's details).

  Ownership:

  - _build_descriptor_atomic_payload: Construct KEYS (window_key, counter_key pairs), ARGV (limit, increment, ttl, window_size 4-tuples), and per-counter metadata (descriptor key/value, current limit, rate-limit type, window/counter keys, increment amount, TTL, window size). Shared hash-tag keys stay together via {key:value} syntax. Returns DescriptorAtomicGroup tuple of (keys, args, meta).

  - _atomic_check_and_increment_in_memory: In-memory all-or-nothing counter evaluation as fallback after Redis failure. Reads/writes local DualCache (local_only=True). Never panics on cache calls, converting None counter reads to 0 via int(raw_counter or 0). Window expiry short-circuits on None window_start before any int() conversion. When a window expires, iterate _sibling_counter_keys and call async_set_cache(key=sibling, value=0, ttl=window_size, local_only=True) for each (no deletion in in-memory path; Redis Lua handles DEL). Returns OK with new counter and window_start values, or OVER_LIMIT with current counter and limit.

  - _build_atomic_response: Decode CHECK_AND_INCREMENT_BY_N_SCRIPT Lua reply to RateLimitResponse. Over-limit reply {1, counter_index (1-based), current_counter, limit} maps counter_index to per_counter_meta. Success reply {0, new_counter_1, window_start_1, ...} lists alternating counter values and window starts for each counter in KEYS order. Includes reservation_windows as frozenset of (counter_key, window_start_str, "redis") tuples.

  Window size defaults to self.window_size when not specified in the descriptor's rate_limit object.
  Direct dependency: B3031 supplies create_rate_limit_keys, _sibling_counter_keys, _get_current_time and atomic counter records (AtomicCounterMeta, AtomicCounterState, RateLimitResponse, RateLimitStatus).
  Local cache read/write calls (async_get_cache/async_set_cache on DualCache) await their external owner.

