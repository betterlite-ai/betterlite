  remains with that prerequisite.


  Reuse ensure_bedrock_anthropic_messages_tool_names from B597 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse normalize_custom_field_on_tools from B597 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse normalize_tool_input_schema_types_for_bedrock_invoke from B597 (litellm/llms/bedrock/common_utils.py); its
  implementation remains with that prerequisite.


  Reuse strip_unsupported_bedrock_invoke_output_config_keys from B597 (litellm/llms/bedrock/common_utils.py); its
