id: B622
title: Bedrock Messages request and stream adaptation
description: >-
  Add BedrockMessagesRequest preparation and AWS-event-to-Anthropic-SSE bridge, retaining native Anthropic envelopes
  rather than converting to chat choices. Reuse existing request normalizers and bounded event decoder; preserve
  model-id path, signing and provider-specific beta body fields.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeMessagesConfig.custom_llm_provider L82-L83; AmazonAnthropicClaudeMessagesConfig.beta_headers_provider
  L86-L87; AmazonAnthropicClaudeMessagesConfig.get_error_class L91-L97; AmazonAnthropicClaudeMessagesConfig.__init__
  L99-L101; AmazonAnthropicClaudeMessagesConfig.validate_anthropic_messages_environment L103-L114; AmazonAnthropicClaudeMessagesConfig.sign_request
  L116-L137; AmazonAnthropicClaudeMessagesConfig.get_complete_url L139-L156; AmazonAnthropicClaudeMessagesConfig.transform_anthropic_messages_request
  L676-L795; AmazonAnthropicClaudeMessagesConfig.get_async_streaming_response_iterator L797-L815; AmazonAnthropicClaudeMessagesConfig.bedrock_sse_wrapper
  L817-L854.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Reuse AnthropicConfig._model_supports_effort_param from B569 (litellm/llms/anthropic/chat/transformation.py);
  its implementation remains with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


