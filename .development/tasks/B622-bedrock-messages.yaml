id: B622
title: Bedrock Messages request and stream adaptation
description: >-
  Add BedrockMessagesRequest preparation and AWS-event-to-Anthropic-SSE bridge, retaining native Anthropic envelopes
  rather than converting to chat choices. Reuse existing request normalizers and bounded event decoder; preserve
  model-id path, signing and provider-specific beta body fields.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeMessagesConfig.get_error_class L91-L97; AmazonAnthropicClaudeMessagesConfig.__init__ L99-L101;
  AmazonAnthropicClaudeMessagesConfig.validate_anthropic_messages_environment L103-L114; AmazonAnthropicClaudeMessagesConfig.sign_request
  L116-L137; AmazonAnthropicClaudeMessagesConfig.get_complete_url L139-L156; AmazonAnthropicClaudeMessagesConfig.transform_anthropic_messages_request
  L676-L795; AmazonAnthropicClaudeMessagesConfig.get_async_streaming_response_iterator L797-L815; AmazonAnthropicClaudeMessagesConfig.bedrock_sse_wrapper
  L817-L854.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  with direct dependencies. Provider leaves must never import betterlite-core, and no copied helper algorithm is
  permitted.


  Reuse AnthropicConfig._model_supports_effort_param from B569 (litellm/llms/anthropic/chat/transformation.py);
  its implementation remains with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse bedrock_request_metadata_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Reuse merge_bedrock_invoke_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation remains
  with that prerequisite.


  Reuse apply_bedrock_invoke_structured_output from B597 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse ensure_bedrock_anthropic_messages_tool_names from B597 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse normalize_custom_field_on_tools from B597 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse normalize_tool_input_schema_types_for_bedrock_invoke from B597 (litellm/llms/bedrock/common_utils.py); its
  implementation remains with that prerequisite.


  Reuse strip_unsupported_bedrock_invoke_output_config_keys from B597 (litellm/llms/bedrock/common_utils.py); its
  implementation remains with that prerequisite.


  Reuse tools_without_eager_input_streaming from B597 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AmazonInvokeConfig.__init__ from B2205 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AmazonInvokeConfig.get_complete_url from B2205 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AmazonInvokeConfig.sign_request from B2205 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Reuse normalize_bedrock_opus_output_config_effort from B690 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: messages_invoke_url: Initialize the B961 base Messages interface (its inherited object initializer
  has no provider logic) and B2205 Invoke config. Delegate get_complete_url and sign_request directly to B2205 with
  all source arguments, including stream/fake_stream, retaining its exact literal-True streaming and endpoint/proxy
  distinctions. Environment validation calls B596 metadata-header ownership/merge with no guardrail headers, returns
  api_base unchanged and ignores api_key; use the same metadata cases as B619. messages_native_body: Insert missing
  anthropic_version bedrock-2023-05-31, preserve an explicit version, then pop stream and model before Invoke signing;
  use B961 request assembly and system normalization. aws_event_to_sse: Construct the B609 inherited AWS event iterator
  with model and the B623 _chunk_parser override; pass httpx_response.aiter_bytes() and original response headers
  to aiter_bytes. Feed its parsed events through B623 usage promotion and B979 BaseAnthropicMessagesStreamingIterator(request_body,logging).async_sse_wrapper,
  yielding every produced byte chunk unchanged. On normal completion, failure or GeneratorExit, await inner sse_stream.aclose
  in finally, so B979 partial-spend finalization runs deterministically. adaptive_display_updates: Remember requested
  thinking.display=updates before base transformation, and restore {type: adaptive, display: updates} only if the
  translated thinking is adaptive. unsupported_output_config_warn_drop: After earlier normalizers, only global litellm.drop_params
  is literal True plus a dict output_config containing a non-format key plus no B569 Bedrock effort support triggers
  warning Dropping unsupported `output_config` for model={model} (drop_params=True). Effort is only supported on
  Opus 4.5+, Sonnet 4.6+, and Mythos Preview. Then remove the entire output_config, including format. A format-only/empty/non-dict
  value or merely truthy nonboolean drop_params does not enter this branch. B2201 owns the False default and loader.
  normalization_order: Capture B568 display updates before B621 raw-effort clamp, then call B961 AnthropicMessagesConfig
  preparation and system-role normalization. B692 web-search rejection precedes version insertion and removal of
  model/stream. Run B621 clear-thinking injection before TTL sanitation and before B692 context filtering. Shallow-copy
  dict output_config, then B597 structured-output rewriting, B690 effort normalization and B597 unsupported keys/custom-tool/schema/name
  normalization. Compute B692 betas from original messages/options plus the outgoing request and injection flag.
  Set anthropic_beta only when the result is truthy. Remove eager_input_streaming through B597, run the final warning/drop
  branch, then B692 allowlist. error_header_projection: Provider identity and beta fallback are B692. get_error_class
  constructs B682 BedrockError with supplied status/message/headers. Native error/message_start framing follows
  B609/B623/B979; this task does not convert native Messages errors into chat choices. messages_constructor: BaseAnthropicMessagesConfig
  has no explicit __init__: its inherited object initializer runs before B2205 Invoke initialization. Empty kwargs
  succeed; nonempty kwargs fail at that first call rather than silently configuring the Invoke base. Model request
  options remain separate from constructor kwargs. B608 owns the inherited AWS decoder initialization used before
  B609 aiter_bytes and B623 record projection.


  litellm.drop_params defaults false through the existing config owner B2201; consume the injected value and its
  existing loader coverage, with no environment read in this adapter. B568 owns is_thinking_display_updates_used
  and B692 owns the called beta/rejection/allowlist helpers.


  Write standalone Rust test bedrock_messages_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test bedrock_messages_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/messages.rs with adjacent tests under messages/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function messages_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  messages_invoke_url, messages_native_body, anthropic_beta_body, aws_event_to_sse, native_error_event, message_start_event,
  adaptive_display_updates, unsupported_output_config_warn_drop, normalization_order, error_header_projection, messages_constructor.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_messages* using HelperCase: kind: helper
  and the externally tagged bedrock_messages variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_messages that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 199 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 275 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 635 planned, 650 maximum changed lines.
