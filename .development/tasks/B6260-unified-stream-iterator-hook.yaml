dod:
  - text: The five streaming flags resolve in the order default, guardrail attribute, guardrail_config, optional_params, a wrong type or a sampling rate below 1 is refused, and any mode other than incremental_diff is block-only.
    proof: [settings-tests]
  - text: Buffering is turned off with the warning when mask_response_content is true, and buffering without release_on_scan forces end_of_stream_only.
    proof: [settings-tests]
  - text: No guardrail, a false gate and an unmapped call type send every chunk unchanged, and a gate error is the first stream item.
    proof: [passthrough-tests, oracle]
  - text: Sampling scans every Nth chunk, skips a redundant scan, and holds a buffered window while tool calls are in flight or the key is missing.
    proof: [sampling-tests, oracle]
  - text: A block or HTTP failure during a sampled scan sends the translation's block chunks or error items, measured against only the chunks already sent, and ends the stream.
    proof: [block-tests, oracle]
  - text: The end-of-stream scan releases buffered and pending chunks after a pass, sends only the block message after a block, and skips a redundant scan.
    proof: [end-scan-tests, oracle]
  - text: With incremental_diff and a chat route the stream goes to B6164's loop, and any other route logs the fallback warning and runs the block-only loop.
    proof: [transform-route-tests, oracle]
  - text: The stream-ended probe is true for chat, Responses and Anthropic exactly as their handlers say and false for every other variant.
    proof: [stream-end-tests]
  - text: Streamed requests through the booted proxy match LiteLLM for a clean stream, a mid-stream block, an end-of-stream block, buffered release and the incremental_diff fallback.
    proof: [oracle, http-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: settings-tests
      why: a flag source, a default, the type check or one of the two buffering rules is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::tests::settings_/)'
    - id: passthrough-tests
      why: a no-guardrail, gate or unmapped-call-type exit scans or drops chunks
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::tests::passthrough_/)'
    - id: sampling-tests
      why: the sampling modulo, the redundant-scan skip or the window hold is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::tests::sampling_/)'
    - id: block-tests
      why: a block or HTTP failure in a sampled scan sends the wrong chunks or keeps the stream open
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::tests::block_/)'
    - id: end-scan-tests
      why: the final scan releases, withholds or skips the wrong chunks
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::tests::end_scan_/)'
    - id: transform-route-tests
      why: incremental_diff picks the wrong loop or loses the fallback warning
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::tests::transform_route_/)'
    - id: stream-end-tests
      why: a variant of the stream-ended probe is wrong or missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::stream_end::tests::/)'
    - id: http-case-corpus
      why: the HTTP cases are not added in this change
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/guardrails/unified-stream-hook)"

oracle_cases:
  - tools/oracle/cases/guardrails/unified-stream-hook/clean-stream-sampled.yaml
  - tools/oracle/cases/guardrails/unified-stream-hook/mid-stream-block.yaml
  - tools/oracle/cases/guardrails/unified-stream-hook/end-of-stream-block.yaml
  - tools/oracle/cases/guardrails/unified-stream-hook/buffered-release.yaml
  - tools/oracle/cases/guardrails/unified-stream-hook/incremental-diff-fallback.yaml

deviations:
  - what: The guardrail to apply is the typed `guardrail` field of the hook params, not the "guardrail_to_apply" key that LiteLLM pops from the request data when the argument is missing.
    why: The same choice as B3680; clients see no difference.
  - what: A streaming flag of the wrong type, or a sampling rate below 1, ends the stream with an error item before the first chunk. LiteLLM fails on the first chunk with ZeroDivisionError or a type error.
    why: Rust types are checked up front; the declared flag types are the only supported input.
  - what: An empty call type list for a route counts as unresolved and falls back to inferring from the chunk. LiteLLM would raise IndexError on `call_types[0]`.
    why: The same rule as B3679's `resolve_endpoint_translation`; the route table never maps a route to an empty list.

out_of_scope:
  - The incremental transform loop and its rounds; B6164 owns it.
  - The registry type, `resolve_endpoint_translation`, `infer_call_type`, `is_redundant_scan`, `resolve_streaming_flag`, `handle_streaming_block` and `emit_streaming_http_error`; B3679 owns them.
  - The pre-call, moderation and post-call success hooks and the registry content; B3680 owns them.
  - The scan key, process_output_streaming_response and block chunk builders of each translation; B3669, B3672, B3673 and B3676 own them.
  - "`ProxyLogging`'s streaming wrapper that chooses between a guardrail's own iterator hook and this one (litellm/proxy/utils.py): not in this task, see notes."
  - "`GUARDRAIL_NAME` in unified_guardrail.py: no caller at the pin."

pitfalls:
  - The flags are read before the guardrail check, but the mask_response_content warning needs a guardrail, so skip it when there is none.
  - The sampling test is `chunk_counter % sampling_rate == 0` on the count of all items so far, including the one that set the call type.
  - On a sampled block the current item is in `responses_so_far` but not in `responses_yielded`, and the block continuation uses the second list.
  - With `buffer_until_moderated` on, a redundant scan releases the withheld items only when `hold_window` is false, and otherwise the loop goes to the next item with the window kept.
  - The end-of-stream path with `release_on_scan` clones the withheld items before the scan, because the scan may rewrite them; without it the originals are sent.
  - A pass-through for an unmapped call type sends the current item first and then the rest of the source, and never runs the end-of-stream scan.
  - The Anthropic stream-ended probe reads the SSE `event:` line, so a bytes chunk with only a `data:` line never ends the stream (B3673).
  - Pending end-of-stream items are pushed to `responses_yielded` only when they are actually sent, after the final scan.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
