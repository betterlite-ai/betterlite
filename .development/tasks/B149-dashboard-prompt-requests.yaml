id: B149
title: Complete the resource-page plan with prompt editor HTTP contracts
description: >-
  Finish the original resource-page entry with prompt HTTP scenarios only, approximately
  550 lines. B9760-B9766 cover MCP, agents, skills/search, vector stores, memory and
  workflows; B9767 mounts the one unallocated route composition found in that audit.
  This final task runs their listed UI acceptance cases as well as its new prompt cases,
  so each split part is a direct case dependency. B144's source/build/branding/static
  plan and B9090's verified archive intake retain every UI function; no dashboard source
  is hand-ported and no owned backend route is planned again. This task's own cases use
  B4061/B4062/B8672, B9010 and the shared B9735 catalogs directly, not B139/B141 umbrellas.

  Prompt read inventory. GET /prompts/list optionally sends a nonempty environment
  query; default is no query. Read prompts[] with prompt_id,version,environment,
  litellm_params,prompt_info,created/updated metadata. Reuse B9735's unfiltered prompt
  catalog case and add environment selection here. GET /prompts/{id}/info optionally
  sends environment and reads prompt_spec,raw_prompt_template,environments. Clicking
  a history version changes id to <base>.v<number> with the selected environment.
  GET /prompts/{id}/versions uses the same optional environment and reads prompts[].
  B4061 owns all three reads and the unused GET /prompts/{id} info alias; B8672 mounts
  them. PromptTable's GET /model_group/info reads data[].model_group and model metadata
  for its model picker (B060); reuse B9735's model-group case.

  Editor writes. POST /prompts sends {prompt_id,litellm_params:{prompt_integration:dotprompt,
  prompt_id,dotprompt_content},prompt_info:{prompt_type:db,environment}}. The editor
  normalizes its name by replacing characters outside a-z/A-Z/0-9/_/- with underscore
  and lowercasing; its initial environment is development. PUT /prompts/{id} sends
  that same complete payload to create the edited version. DELETE /prompts/{id} has
  no body; the table sends environment, while the info view omits it to remove all
  environments. B4062 owns these writes and its unused PATCH alias; B8672 mounts them.
  Create development and staging versions, read their info/history separately, edit,
  load an explicit .v1 record, delete one environment, then delete the remaining base.
  Writes are consumed as success followed by refetch, not a fabricated prompt wrapper.

  Import sequence. AddPromptForm POST /utils/dotprompt_json_converter uses multipart
  with one file field and a .prompt filename; read prompt_id,json_data. It then POSTs
  /prompts with the user-entered outer prompt_id, litellm_params containing
  {prompt_integration:dotprompt,prompt_id:<converted id>,prompt_data:<json_data>} and
  prompt_info:{prompt_type:db}, omitting environment. Preserve the difference between
  outer name and uploaded-file-derived id. B9010 owns conversion; its standalone
  upload cases are planned, not proof of this upload-to-registration sequence.

  Preview sequence. useConversation directly POSTs /prompts/test with application/json
  and the configured dashboard auth header. The first body is
  {dotprompt_content,prompt_variables:<values>}; later turns send
  {dotprompt_content,conversation_history:[prior messages,{role:user,content:input}]},
  without prompt_variables or a stream field. The endpoint forces streaming. The page
  reads SSE model,usage,choices[0].delta.content and [DONE]. B9010 owns this endpoint
  too. Its planned preview/history cases already cover standalone rendering; add only
  the editor-produced content and two-turn body choices with deterministic mock chunks,
  asserting upstream system/history order, SSE content and content-type. Do not route
  preview through a new /chat/completions alias. Code snippets displayed by the page
  are strings, not additional outbound requests.

  There are no on-disk prompt-page HTTP scenarios for these paths. The read/write
  owners have future generic cases, B9010 has future converter/preview cases, and
  B9735 has the shared catalog requests; all are named above and remain their owners'
  work. New cases use B860 isolated databases, HTTP setup and the standard mock model
  openai/gpt-4o-mini. Keep default Authorization Bearer/custom auth_header_name behavior,
  no-body deletes and browser multipart boundaries. Compare status, response envelopes,
  content-type and existing error type/param/code or detail; capture versions/ids rather
  than ignoring whole prompt records. Include ordinary-user write denial and preview's
  existing nonadmin allowance without installing enterprise modules.

  No browser check is added by this task. B144 does provide a real Playwright harness
  and dashboard_browser_boots; broader page scenarios would need registered fixtures,
  authenticated sessions, backend resource setup and scenario selection in that shared
  harness. The requested remainder is exact HTTP coverage, so it does not depend on
  npm build artifacts or broaden B144's harness here. No new parser requires fuzzing.
