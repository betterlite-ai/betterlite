    proof: [oracle]
  - text: Prompt editor CRUD and version/environment navigation send the exact page bodies and distinguish scoped deletion from deleting all environments.
    proof: [prompt-page-cases, oracle]
  - text: File conversion feeds the import registration body and the two-turn editor preview consumes real SSE with the same variables/history choices.
    proof: [prompt-page-cases, oracle]
