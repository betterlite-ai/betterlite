out_of_scope:
  - B9090 retains every prompt page/component/helper/test function and the complete networking module; B9091/B9092/B9093 handle build, branding and static serving.
  - B4061/B4062/B8672 and B9010 own all prompt HTTP logic; B060 owns the model picker endpoint and B9735 its exact request case.
  - B9760-B9767 hold the other original resource-page coverage and the discovery mount; no B139/B141 route is reimplemented here.
  - B144's browser fixture and runner need an explicit extension before page-level browser scenarios can be registered; HTTP-only cases require none.
pitfalls:
  - PromptInfo consumes raw_prompt_template, not an invented prompt_template response field.
  - Import omits environment while the editor explicitly sends development or its selected environment.
  - The info view deletes all environments by omitting the table's environment query.
