id: B377
title: Automatic router identity and dependency validation
description: 'Implement StrategyRouterKind, RouterDependencies and configuration-placement validation
  for semantic, complexity, quality and adaptive marker deployments. Enumerate classifier, embedding,
  evaluation and tier model dependencies using exact config keys, including custom tiers and prompts.
  Licensing capability-count/tuning helpers have no runtime equivalent under the accepted product decision.
  Implement the owned native service in crates/betterlite-server/src/router_dependencies.rs. Add ProbeOperation::RouterDependencies
  in tools/oracle/src/router_probes/mod.rs and the corresponding B377 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_utils/auto_router_model_naming.py:
  classify_strategy_router_model (L68-L84), is_complexity_router_model (L87-L89), _named (L92-L94), _pool
  (L97-L103), _mapping (L109-L110), strategy_router_dependencies (L113-L184), uses_heuristic_v2_classifier
  (L187-L189), defines_custom_tiers (L192-L198), defines_custom_classifier_prompt (L204-L221), uses_custom_tier_or_classifier_prompt
  (L224-L226), validate_complexity_router_config_write (L347-L372), carries_complexity_router_settings
  (L380-L389), validate_complexity_router_config_placement (L392-L411), validate_strategy_router_model_write
  (L414-L453). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
