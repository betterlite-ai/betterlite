out_of_scope:
- B2483 owns _scan_request, _extract_query_from_messages, _context_messages, _messages_with_context, _context_message, _requested_vector_store_ids and _configured_failure_mode as whole functions.
- B090 owns the two post-call decoration hooks; B1063 owns authorized store selection and B1064 search execution.
- B104 owns guardrail selection/execution semantics and their errors. Router implementation remains behind the injected runtime search handle.
pitfalls:
- Store litellm_params is expanded last and can override the actual search id/query while diagnostics retain the original registry id.
- Error mode runs after every selected store search, so a first failure does not skip later stores.
- Guardrail failures occur outside the augmentation catch and must not be swallowed as an optional retrieval failure.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
