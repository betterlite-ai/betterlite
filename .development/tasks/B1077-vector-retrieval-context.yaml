id: B1077
title: Retrieve and scan vector context before model calls
description: >-
  Implement the whole VectorStorePreCallHook pre-call execution path in core::api::vector_retrieval_context:
  constructor, async_get_chat_completion_prompt, _scanned_context_messages, _scan_through, _augment_messages
  and _search_one, plus the runtime/outcome/augmentation records at source lines 69-348. B2483 owns the
  seven pure query/context/failure-policy helpers, B1063 selects stores with database fallback, B1064
  executes searches and B104 supplies guardrail decisions/scans. Runtime router/database handles are
  injected; absent proxy runtime/import leaves each handle null. A router search handle is supplied by
  the caller when available, so this hook does not import the router that consumes it.

  Search stores sequentially, preserving their order and all successful/failed outcomes. The prompt
  hook catches only augmentation errors and returns the original tuple then. Failure-mode enforcement
  and guardrail scans occur outside that catch, so error mode or a guardrail block escapes. Write nonempty
  results/failures to logging before enforcing error mode. Read request metadata from
  model_call_details.litellm_params.metadata when litellm_params is a dictionary, otherwise {}.
  Store litellm_params overlays id,query,provider and request metadata in search kwargs.

  Add B2401 VectorRetrievalContext to run the actual hook and search SDK against the mock, projecting
  returned model/messages/non_default_params, logging details and ordered diagnostics. Pure helpers are
  tested in B2483, not reimplemented here. Named native tests in api::vector_retrieval_context use injected
  runtime/guardrail seams and real search execution. The remaining methods/records have 242 nonblank/
  non-comment lines. Budget 245 execution, 190 tests, 110 adapters, 150 fixtures and 45 wiring/corpus,
  740 total under 780. No new byte decoder or gateway route is introduced.
