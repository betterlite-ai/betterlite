references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py#L69-L348
  why: Complete runtime/augmentation methods define sequential searches, catch boundaries, logging and per-context guardrail scans.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L294-L315
  why: VectorStoreSearchError carries invalid_request_error and vector_store_search_failed rather than a generic search exception.
dod:
- text: >-
    retrieval_noop sends model=gpt-4o,messages=[{role:user,content:q}] with no registry, then a registry
    selecting no stores. Return the identical model/messages/non_default_params and zero requests. A selected
    store with no extracted query also makes no search and logs "No query found in messages for vector store search".
    Selection still happens before that query check and may have popped tool/id arguments. prompt_id,
    prompt_variables,prompt_spec,prompt_label,prompt_version and both ignore_prompt_manager flags do not
    alter the result; their defaults are null except the two false flags.
  proof: [retrieval-tests, oracle, python-adapter]
- text: >-
    retrieval_store_order selects vs_a then vs_b,query=q. Expect sequential POSTs to
    /v1/vector_stores/vs_a/search then /v1/vector_stores/vs_b/search with query=q. Mock text results a and b
    produce two user messages "Context:\n\na\n\n" and "Context:\n\nb\n\n" immediately before the last
    original message. Logging search_results contains both responses in that order. Empty successful data
    remains in search_results but produces no context. No chat completion request or second retrieval occurs.
  proof: [retrieval-tests, oracle, python-adapter]
- text: >-
    retrieval_store_params_override supplies request metadata={team:request} and a store
    {vector_store_id:vs_a,custom_llm_provider:openai,litellm_params:{vector_store_id:vs_override,query:override,metadata:{team:store}}}.
    Actual search targets vs_override with query=override and logs store metadata; failures still identify
    original vs_a/openai. Missing store id defaults "",provider null,litellm_params null/missing to {}.
    Non-dictionary request litellm_params yields {} metadata. A supplied runtime router search is preferred
    over direct SDK search; absent router uses B1064. Both paths must reach the provider mock.
  proof: [retrieval-tests, oracle, python-adapter]
- text: >-
    retrieval_failure_modes returns HTTP 500 for vs_a and a successful text=b for vs_b. Both searches
    run; the failure emits warning "Vector store search failed for vector_store_id=%s, continuing without its context: %s"
    and logs vector_store_search_failures with vs_a,provider and error string. Default annotate returns
    only b context and succeeds. Mode error raises VectorStoreSearchError,status=400,type=invalid_request_error,
    param=null,code=vector_store_search_failed after recording both results/failures. Its source message
    is "litellm.BadRequestError: The request could not be grounded in every configured vector store. 1 vector store search(es) failed: vs_a: "
    followed by the captured error string for vs_a. It performs no guardrail scan. Invalid mode uses B2483's warning/fallback.
    Ignore SDK-dependent failure wording only; retain the failure id, provider, status and code.
  proof: [retrieval-tests, oracle, python-adapter]
- text: >-
    augmentation_exception_fallback injects a registry lookup exception or malformed store params before
    _search_one's try. The prompt hook emits exception diagnostic "Error in VectorStorePreCallHook for vector_store_ids=%s: %s"
    and returns the original model/messages/params rather than applying error mode. A provider search
    exception inside _search_one becomes a SearchFailed instead. Prior argument mutations are retained;
    no rollback or atomicity is promised.
  proof: [retrieval-tests, oracle, python-adapter]
- text: >-
    context_guardrail_sequence installs callbacks [non_guardrail,disabled_guardrail,mask_a,mask_b]. Only
    CustomGuardrail callbacks whose should_run_guardrail(event_type=pre_call,data=B2483 scan request)
    is true run. For each store context in order, mask_a output becomes mask_b input; an empty result
    removes that context and multiple returned messages are flattened. Original conversation messages
    are never scanned by this hook. Make mask_b raise BadRequestError with message=blocked,model=gpt-4o,
    llm_provider=openai,body={type:guardrail_intervention,param:null,code:guardrail_blocked}. Expect that
    same class,status=400,type=guardrail_intervention,param=null,code=guardrail_blocked and source message
    "litellm.BadRequestError: blocked"; later scans stop. This is outside the augmentation catch and never
    becomes annotate-success. Other guardrail construction/mapping remains B104's contract.
  proof: [retrieval-tests, oracle, python-adapter]
- text: Every new vector_retrieval_context SDK seed replays through B2401, including zero-request fallbacks.
  proof: [sdk-corpus]
checks:
  optional: []
  commands:
  - id: retrieval-tests
    why: pre-call retrieval loses failure-mode boundaries, scan ordering or the model's original messages
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_retrieval_context::tests::/) - test(/::replays_corpus$/)'
  - id: python-adapter
    why: retrieval search effects are represented by helper fixtures instead of actual HTTP
    run: test -f tools/oracle/sdk_http/vector_retrieval_context.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: retrieval's typed SDK call lacks added replay inputs
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-retrieval-context-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
