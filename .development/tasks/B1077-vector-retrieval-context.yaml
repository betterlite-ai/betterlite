id: B1077
title: Vector retrieval context
description: >-
  Run authorized vector retrieval before chat completion, derive the query from messages and build context messages
  through source templates. Scan retrieved content through B104 and preserve annotate/error configuration with warnings;
  the registry chooses configured embeddings and callers cannot bypass tool permissions. Support litellm_settings.vector_store_search_failure_mode=annotate
  with enum annotate/error; invalid values warn and fall back to annotate. Context starts with the literal Context
  followed by colon and two newlines.


  _configured_failure_mode and _requested_vector_store_ids belong here below B090; B090 only appends response metadata
  after retrieval. Context text begins exactly Context:


  .


  Implement crates/betterlite-core/src/api/vector_retrieval_context.rs. Use VectorRetrievalContextInput and VectorRetrievalContextResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions query_from_last_user, retrieved_context_order, retrieval_guardrail_block,
  retrieval_annotate_warning, retrieval_error under api::vector_retrieval_context::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.vector_store_search_failure_mode
  defaults to 'annotate'. No environment reads occur outside betterlite-config. Test api::vector_retrieval_context::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorRetrievalContext in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_retrieval_context: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: _scan_request
  (L55-L66); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: ProxyRuntime.llm_router
  (L70-L70); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: ProxyRuntime.prisma_client
  (L72-L72); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: ProxyServerRuntime.llm_router
  (L77-L82); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: ProxyServerRuntime.prisma_client
  (L84-L89); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook.__init__
  (L124-L126); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook.async_get_chat_completion_prompt
  (L128-L205); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._scanned_context_messages
  (L207-L226); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._scan_through
  (L228-L239); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._augment_messages
  (L241-L306); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._search_one
  (L308-L347); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._extract_query_from_messages
  (L349-L376); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._context_messages
  (L378-L383); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._messages_with_context
  (L385-L392); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: VectorStorePreCallHook._context_message
  (L394-L413); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: _requested_vector_store_ids
  (L515-L519); litellm/integrations/vector_store_integrations/vector_store_pre_call_hook.py: _configured_failure_mode
  (L522-L532). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 301 owned nonblank/non-comment/non-docstring Python lines (323 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 321 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 604 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B014 (Call dispatch across providers
  and call types, shared settings and helpers), B104 (Guardrail framework, registry and guardrail API), B171 (Direct
  helper oracle and URL path encoding), B1063 (Vector tool selection), B1064 (Vector store search), B1087 (Api boundaries).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
