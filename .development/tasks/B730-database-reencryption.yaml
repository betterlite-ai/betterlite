id: B730
title: Transactional master-key ciphertext migration
description: >-
  Implement CiphertextMigration with explicitly injected old/new StoredCipher instances. Enumerate the
  pinned secret columns, count ciphertexts encrypted by each key, replace only decryptable values, and
  atomically update rows while preserving unknown ciphertexts and nulls. This does not implement the cryptographic
  format; B061 supplies it. Expose migration outcome and sanitized refusal counts for startup and credential-management
  routes.


  Build the production database_reencryption module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/master_key_migration.py:
  replace_ciphertexts (L54-L69; 16 source lines), count_values_encrypted_with (L72-L82; 10 source lines),
  count_values_encrypted_with_or_none (L85-L91; 7 source lines), reencrypt_stored_values (L94-L105; 11
  source lines), _secret_columns_in (L111-L121; 11 source lines), _rows_of (L124-L135; 12 source lines),
  _reencrypt_row (L138-L156; 19 source lines), _as_sql_parameter (L159-L160; 2 source lines), migrate_if_requested
  (L183-L203; 21 source lines), migrate_from_previous_master_key (L206-L222; 17 source lines), _migrate_or_failure
  (L225-L242; 18 source lines), _migrate (L245-L268; 24 source lines), describe_outcome (L271-L307; 37
  source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DEFAULT_MAX_RECURSE_DEPTH=100.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::database_reencryption::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 205 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  205 production, 154 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 439 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
  paths:
    - crates/betterlite-db/src/database_reencryption.rs
    - crates/betterlite-db/src/database_reencryption/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/src/database_reencryption/fixtures/**
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/config.rs
    - crates/betterlite-config/src/database_reencryption.rs
    - crates/betterlite-config/src/database_reencryption/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/database-reencryption-*
