dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: mixed_ciphertexts, nested_secret_columns,
      null_secret, old_key_not_matching, rollback_on_write_error, dry_count_no_mutation, postgres_pinned_rows,
      postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_reencryption::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_reencryption::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_reencryption::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_reencryption::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-reencryption-*")"
        && grep -rlq "DEFAULT_MAX_RECURSE_DEPTH" crates/betterlite-config/fuzz/corpus/config_yaml/database-reencryption-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Unknown ciphertext must be preserved rather than interpreted as decryptable plaintext.
budget:
  max_changed_lines: 450
  max_new_expects: 0
review_level: security
