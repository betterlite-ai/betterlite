dod:
  - text: "A refresh returns None, with no network call, for a token with no refresh_token, an unknown server, a server with no token URL, and a client auth misconfiguration that it logs."
    proof: [refresher-tests, helper-oracle, helper-tests, helper-python]
  - text: "In Enforce mode the first binding check runs before the POST with an empty token response and the presented refresh token as ownership, a denial gives None, and the second check with the real body runs for every server and a denial there gives None too."
    proof: [refresher-tests, helper-oracle, helper-tests, helper-python]
  - text: "The POST form is grant_type and refresh_token followed by the client auth body, and a missing or empty access_token in the answer, or no answer, gives None and persists nothing."
    proof: [refresher-tests, helper-oracle, helper-tests, helper-python]
  - text: "A rotated refresh_token replaces the old one, an omitted one is carried forward, omitted scope keeps the old scopes, empty scopes persist as None, and expires_at is the clock plus a parsed expires_in or None."
    proof: [refresher-tests, helper-oracle, helper-tests, helper-python]
  - text: "parse_expires_in and parse_scopes follow LiteLLM for booleans, integers, floats, numeric strings, junk and empty strings, and read_grant_body never panics on arbitrary bytes, including the added corpus."
    proof: [refresher-tests, grant-corpus, helper-oracle, helper-tests, helper-python]
  - text: "A persist failure is returned to the caller and a persist with no database handle writes nothing but still returns the token."
    proof: [refresher-tests, adapter-tests]
  - text: "PooledTokenPost sends the form with the Accept header (a given Accept wins) and turns a non-2xx status, a transport error and a non-object body into None."
    proof: [adapter-tests]
  - text: "DbCredentialReader fails with TokenStoreUnavailable when no database is connected, and DbCredentialPersist stores with skip_byok_guard true."
    proof: [adapter-tests]
  - text: "read_bound_credential hides a credential whose proof does not match only for an Enforce server and passes it through for audit, unbound and unknown servers."
    proof: [store-tests]
  - text: "LazyPerUserOAuthTokenStore.fetch invalidates the cache entry and returns None when an Enforce server's proof check fails, and returns the token unchecked for an unknown, unbound or audit server."
    proof: [store-tests, helper-oracle, helper-tests, helper-python]
  - text: "The lazy store builds the chain on first use, keeps a Redis chain, replaces an in-process chain once Redis is available only after in-flight local fetches finish, and builds a chain on invalidate when none exists."
    proof: [store-tests, helper-oracle, helper-tests, helper-python]
  - text: "The chain is Cached over Refreshing over V2PerUserTokenStore with a 300 second default TTL, and uses the Redis backend and coordinator only when RedisChain gives parts."
    proof: [store-tests]
  - text: "The oracle cases and the corpus seeds agree with LiteLLM on refresh and lazy_fetch."
    proof: [helper-oracle, helper-tests, helper-python, helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: refresher-tests
      why: the refresh step order, the two binding checks, the rotation rules or the expires_in parsing differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::authz_code_refresher::tests::/) - test(replays_the_refresh_grant_corpus)'
    - id: adapter-tests
      why: the pooled POST, the database reader or the persist adapter differ from LiteLLM on failure or on a missing database
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::per_user_oauth_store::tests::adapter_/)'
    - id: store-tests
      why: the bound credential read, the chain shape or the lazy store rules differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::per_user_oauth_store::tests::/) - test(/^mcp::outbound_credentials::per_user_oauth_store::tests::adapter_/)'
    - id: grant-corpus
      why: the refresh_grant_body fuzz target, its added corpus or its replay test is missing or fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/refresh_grant_body.rs &&
        grep -q refresh_grant_body crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/refresh_grant_body)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_refresh_grant_corpus)'
    - id: helper-tests
      why: the helper adapter does not reach the production refresher and lazy store
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::server::b4660::/) - test(/replays_the_/)'
    - id: helper-oracle
      why: the helper cases are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-per-user-oauth-refresh)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/mcp-per-user-oauth-refresh
    - id: helper-python
      why: the Python helper adapter is unchanged or fails the strict checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4660.py tools/oracle/helpers/b4660)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-per-user-oauth-refresh seed reaches the shared parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-per-user-oauth-refresh-*')" &&
        grep -lE 'b4660"?:' tools/oracle/fuzz/corpus/helper_case/mcp-per-user-oauth-refresh-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

