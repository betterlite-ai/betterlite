deviations:
  - what: The server lookup, the database handle, the Redis cache and coordinator, the cipher and the clock are passed in through constructors. LiteLLM reads them from proxy_server globals on each call.
    why: The repo rules forbid module-level state. The lazy rebuild when Redis appears is kept, so a Redis that connects after startup is still picked up.
  - what: Token endpoint requests go through the B173 pooled client behind PooledTokenPost, so its timeouts, redirect rules and body size cap apply.
    why: Every outbound request in betterlite goes through the pool.
  - what: expires_in strings are parsed with ASCII digits only and values outside the i64 range read as absent. Python's int() also takes other Unicode decimal digits and any size.
    why: An identity provider sends plain ASCII seconds, and the difference shows only for a deliberately odd string.
  - what: A token endpoint body that is JSON but not an object gives None. LiteLLM calls .get on it and fails with an AttributeError.
    why: A refresh must be a miss, never a server error; the declared type of the answer is a dict, so no oracle case sends a list.

out_of_scope:
  - "build_per_user_oauth_token_store: no caller at the pin. Only the private builder inside the lazy store is used."
  - "The production RedisChain (shared cache, Redis handle and B4657's coordinator), the production CredentialReader and the manager that builds the lazy store with get_mcp_server_by_id: wired by the composition root B137."
  - "OAuthToken, the cache stores, RefreshingTokenStore, V2PerUserTokenStore, OAuthTokenCacheCodec and DualCacheTokenCacheBackend: B4656 owns them. The runtime_refresh_coordinator itself is B4657's."
  - "enforce_oauth_identity_binding, credential_binding_matches and IdentityBinder: B4659 owns them behind B4715's OauthBindingPort."
  - "refresh_user_oauth_token and resolve_user_oauth_access_token in db.py, the older path that also refreshes: B4715."
  - "build_upstream_oauth2_token_request: B4654. get_user_oauth_credential and store_user_oauth_credential: B4713."

pitfalls:
  - The pre-check with an empty token response runs only for an Enforce binding and comes after the client auth build, so a misconfigured client returns None before any binding check.
  - The second binding check runs for every server, not only bound ones, and for Audit it returns no proof, so a refreshed audit token is persisted without identity_binding_proof.
  - The refresh token in refresh_ownership is the stored one that the refresher was handed (Presented), never the envelope form, so the port compares it with the stored credential.
  - DbCredentialPersist silently skips the write when no database is connected while DbCredentialReader raises, and the caller still gets the new token, so a no-database setup serves a token it never saved.
  - A body key from build_upstream_oauth2_token_request (client_id, client_secret, resource) is spread after grant_type and refresh_token in the form, so on a clash the body wins.
  - Scopes fall back to the old token's scopes only when the answer's scope is missing or an empty string, and an empty final list is persisted as None but returned as an empty list on the token.
  - A JSON float expires_in such as 3600.0 is None while the string "3600" is 3600, so no expiry is recorded for a float.
  - The proof check in fetch runs on every call, including cache hits from the chain, because the cached token carries its identity_binding_proof; a failing check invalidates the cached entry too.
  - Replacing the in-process chain waits for local fetches in flight, and an invalidate counts as a local fetch while the chain is not a Redis chain, so skipping that count would let two chains redeem one rotating refresh token.
  - uses_redis comes from the coordinator being present, and the same Redis check decides when to replace the chain, so the builder and the availability check must read the same RedisChain answer.
  - The decrypt label for cached tokens is "mcp_per_user_token" and a failed decrypt is None with a debug log, so a salt key change reads as a cache miss.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
