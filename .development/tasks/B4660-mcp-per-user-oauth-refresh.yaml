id: B4660
title: MCP bound per-user OAuth refresh
description: >-
  Build the refresh and the store chain that serve a user's own OAuth token (the authorization_code mode) to an MCP server call. When the stored access token is near expiry, the gateway trades the stored refresh_token at the server's token endpoint, saves the rotated token, and checks the upstream identity binding before it serves or saves anything. In LiteLLM this is authz_code_refresher.py (176 lines) and per_user_oauth_store.py (265 lines). The only caller at the pin is MCPServerManager.__init__ (mcp_server_manager.py L1931), which builds LazyPerUserOAuthTokenStore with get_mcp_server_by_id and hands it to the credential resolver. build_per_user_oauth_token_store (the public one that drops the Redis flag) has no caller at the pin, so it is not built.


  Place. Two modules in betterlite-server, next to B4656's types: crates/betterlite-server/src/mcp/outbound_credentials/authz_code_refresher.rs and per_user_oauth_store.rs, each with a tests.rs in a folder of the same name. Add betterlite-mcp (path dependency) to crates/betterlite-server/Cargo.toml if it is not there yet, and secrecy is already there. Do not add a dependency from betterlite-mcp or betterlite-db to betterlite-server. Read these on main before you write code, and use their names as they are, do not redefine them: B4656 (OAuthToken, TokenStoreUnavailable, OAuthTokenStore, InvalidatableOAuthTokenStore, TokenRefresher, TokenCacheBackend, RefreshCoordinator, InProcessRefreshCoordinator, RefreshingTokenStore, CachedOAuthTokenStore, V2PerUserTokenStore with its CredentialReader, OAuthTokenCacheCodec, DualCacheTokenCacheBackend with its AsyncCache); B4657 (the refresh coordinator factory that is LiteLLM's runtime_refresh_coordinator); B4654 (build_upstream_oauth2_token_request, whose result has headers and body, and its error when the client auth is misconfigured); B4713 (get_user_oauth_credential and store_user_oauth_credential in crates/betterlite-db/src/mcp_user_credentials.rs); B6590 (MCPServer in crates/betterlite-mcp/src/server_record.rs with server_id, effective_token_url, token_endpoint_auth_method, client_id, client_secret and oauth_identity_binding); B1600 (the stored cipher that encrypts and decrypts with the label "mcp_per_user_token"); B173 (the pooled client).


  Binding port. B4715 declares OauthBindingPort in crates/betterlite-db/src/oauth_token_resolution.rs with the associated types Server, Ownership and Denied and two methods: `enforce(&self, server, token_response: &serde_json::Map<String, serde_json::Value>, user_id: Option<&str>, grant_type: &str, ownership: Option<&Ownership>) -> Result<Option<String>, Denied>` and `proof_matches(&self, server, user_id: &str, stored_proof: Option<&str>) -> bool`. B4659's IdentityBinder (betterlite-mcp) implements it with Server = MCPServer, Ownership = RefreshOwnership and Denied = BindingDenied. Use that trait for every binding call in this task, as a generic parameter bounded by `OauthBindingPort<Server = MCPServer, Ownership = RefreshOwnership, Denied = BindingDenied>`, and do not use B4659's BindingValidator or credential_binding_matches directly. LiteLLM's validator call is enforce, and its credential_binding_matches call is proof_matches. Tests use a recording fake port, not IdentityBinder.


  authz_code_refresher.rs. AuthorizationCodeRefresher implements B4656's TokenRefresher. Its collaborators are injected through its constructor: a ServerLookup (trait with a sync `fn server(&self, server_id: &str) -> Option<Arc<MCPServer>>`, LiteLLM's get_mcp_server_by_id), a TokenEndpointPost (trait with `async fn post_form(&self, url: &str, form: &BTreeMap<String, String>, headers: &BTreeMap<String, String>) -> Option<serde_json::Map<String, serde_json::Value>>`, None for any transport, status or JSON failure), a CredentialPersist (trait with `async fn persist(&self, user_id, server_id, access_token: &str, refresh_token: Option<&str>, expires_in: Option<i64>, scopes: Option<&[String]>, identity_binding_proof: Option<&str>)` returning B4656's refresh error type on failure), the binding port, and a clock returning epoch seconds as f64 (default the system clock). Steps of refresh(user_id, server_id, token), in this order:

  1. token.refresh_token is None gives None.

  2. ServerLookup gives None gives None.

  3. effective_token_url missing or empty gives None.

  4. build_upstream_oauth2_token_request(server, auth_method = server.token_endpoint_auth_method, client_id, client_secret). Its misconfiguration error logs `tracing::warn` "MCP OAuth refresh misconfigured for server <server_id>: <error>" and gives None.

  5. When the server has a binding whose mode is Enforce, call port.enforce with an EMPTY token response, user_id Some(user_id), grant_type "refresh_token" and ownership Some(Presented(refresh_token)). This check runs before any network call. A denial gives None.

  6. Form = grant_type "refresh_token", refresh_token, then every key of the request body from step 4. A body key wins over the first two on a clash.

  7. post_form(token_url, form, request headers). None gives None.

  8. body["access_token"] must be a non-empty string, else None.

  9. Call port.enforce again with the real body, same user, grant_type "refresh_token" and the same Presented ownership. This second call runs for every server, whatever its mode (the port returns Ok(None) when there is no binding or it is not Audit or Enforce). A denial gives None. Its Ok value is the binding proof (None for audit and unbound).

  10. New refresh token = body["refresh_token"] when it is a non-empty string, else the old one. expires_in = parse_expires_in(body["expires_in"]). scopes = parse_scopes(body["scope"]) when that is Some, else token.scopes.

  11. persist(user_id, server_id, access_token, new refresh token, expires_in, scopes (None when the scopes list is empty), proof). A persist failure is returned to the caller, never swallowed and never turned into a token.

  12. Return the new OAuthToken: access_token, expires_at = clock() + expires_in when expires_in is Some (a zero or negative value is used as it is), else None, the new refresh token, scopes (may be empty) and the proof.


  Only a denial with status 403 becomes None; BindingDenied always has status 403, so every denial from the port gives None. Any other error is not a denial and passes through.


  parse_expires_in(value: &serde_json::Value) -> Option<i64> follows LiteLLM's _parse_expires_in on JSON values: a boolean gives None, a JSON integer is itself, a float such as 3600.0 gives None, a string goes through Python's int() rules (surrounding whitespace, an optional + or - sign, ASCII digits with single underscores between digits, so " +1_0 " is 10) and a failed parse gives None, anything else None. parse_scopes(value) -> Option<Vec<String>> gives the whitespace-split words of a non-empty string and None for an empty string or any other type. Put the body reading (access_token, refresh_token, expires_in, scope) in one decoder function `read_grant_body(body: &serde_json::Map<String, serde_json::Value>) -> Option<GrantBody>` where GrantBody has access_token, rotated_refresh (Option), expires_in and scopes, because it reads bytes an upstream server wrote and is fuzzed (see Fuzz).


  per_user_oauth_store.rs. Three adapters and the lazy store. Each adapter takes what it needs through its constructor, with no globals.

  PooledTokenPost implements TokenEndpointPost over B173's pooled client for httpxSpecialProvider.Oauth2Check: a POST with an urlencoded form, headers = {"Accept": "application/json"} plus the given headers (a given Accept replaces the default), a non-2xx status or an unreadable or non-object JSON body or any transport error logs `tracing::warn` "MCP OAuth refresh request failed: <error>" and gives None. A failed refresh is a miss, never a 500.

  DbCredentialReader implements B4656's CredentialReader: it holds an Option of the database handle B4713's functions take. With None it fails with TokenStoreUnavailable("Database not connected"); otherwise it returns get_user_oauth_credential(user_id, server_id).

  DbCredentialPersist implements CredentialPersist: with a None database handle it returns Ok without writing anything (this differs from the reader on purpose, and the refreshed token is still returned to the caller). Otherwise it calls store_user_oauth_credential with skip_byok_guard = true, the scopes list or None, and the proof.

  read_bound_credential(server_lookup, port, reader, user_id, server_id) is the CredentialReader that V2PerUserTokenStore gets: it reads the credential, looks the server up, and when the credential exists and the server's binding mode is Enforce and port.proof_matches(server, user_id, the credential's identity_binding_proof) is false, it returns None as if no credential were stored. Audit mode and unbound servers do not check.

  Chain. The store chain for one build is CachedOAuthTokenStore(RefreshingTokenStore(V2PerUserTokenStore(read_bound_credential), AuthorizationCodeRefresher, coordinator), default_ttl_seconds = 300.0, backend). The cache TTL for a token with no expiry is 300 seconds. expiry_skew_seconds and max_size stay at B4656's defaults (60 and 4096). When the Redis side is wired, the backend is DualCacheTokenCacheBackend over the shared cache with OAuthTokenCacheCodec(encrypt, decrypt) where decrypt uses the label "mcp_per_user_token" and returns None instead of failing, and the coordinator is B4657's Redis coordinator. When Redis is not wired, both are None and B4656's in-process defaults are used. A port trait `RedisChain` with `fn parts(&self) -> Option<RedisParts>` stands for LiteLLM's user_api_key_cache.redis_cache plus runtime_refresh_coordinator: Some when Redis is wired. The composition root (B137) implements it over the shared cache and Redis handle, so this task tests with a fake. The builder (trait StoreBuilder, `fn build(&self) -> BuiltStore` with the chain and a uses_redis flag that is true exactly when parts() was Some) is a struct that holds the server lookup, the port, the reader, the persist, the post and the RedisChain.

  LazyPerUserOAuthTokenStore implements B4656's InvalidatableOAuthTokenStore. It exists because Redis may become available after startup. Rules, copied from LiteLLM:

  - fetch(user_id, server_id): get the token by the chain below, then look the server up. When the token exists and the server's binding mode is Enforce and port.proof_matches(server, user_id, token.identity_binding_proof) is false, call self.invalidate(user_id, server_id) and return None. A server that is not found, an unbound one and an audit one return the token unchecked.

  - Getting the token: when uses_redis is true and a chain exists, use that chain at once. Otherwise take the chain under the lock: while a chain exists and it is not a Redis chain and Redis is now available and local fetches in flight is above 0, wait. Then, if there is no chain, or the chain is not a Redis chain and Redis is now available, build a new one and keep its uses_redis flag. When the chain is not a Redis chain, add 1 to the local fetches. Run the fetch outside the lock. In a finally step, for a non-Redis chain, subtract 1 and wake every waiter when it reaches 0. The wait lets in-flight fetches on the old in-process chain finish before it is replaced, so one refresh token is never redeemed by two coordinators.

  - invalidate(user_id, server_id) follows the same chain and counting rules. It builds the chain when none exists yet, so a shared Redis entry written by another worker is dropped too.

  - Use tokio::sync::Mutex and tokio::sync::Notify (or the same pattern with a waiter re-check) for the lock and the wait, not a std Mutex held across an await. Collaborators are generic parameters with native async fn in traits, as B4659 does, not dyn.


  Fuzz. read_grant_body and parse_expires_in read a body from an upstream token endpoint. The cargo-fuzz target refresh_grant_body in crates/betterlite-server/fuzz feeds arbitrary bytes to serde_json::from_slice and, when that gives an object, to read_grant_body. It must never panic. The test mcp::outbound_credentials::authz_code_refresher::tests::replays_the_refresh_grant_corpus replays crates/betterlite-server/fuzz/corpus/refresh_grant_body. Add corpus files: a normal grant, a body with a numeric string expires_in, a float expires_in, a boolean expires_in, an empty access_token, and a body that is a JSON array.


  Oracle. No route reaches this code yet (B137 wires the credential resolver, the manager and the tool-call routes), so the HTTP cases come with the umbrella B137. This task has helper cases only. The helper operation b4660 takes a field function, refresh or lazy_fetch. For refresh the Python side builds AuthorizationCodeRefresher with a server lookup that returns an MCPServer made from the case, a token_endpoint fake that records (url, form, headers) and returns the listed body or None, a persist fake that records its arguments, a fixed clock, and an identity_validator fake that records every call (grant_type, token_response, the refresh token in refresh_ownership) and returns the listed proof, None or raises HTTPException(403). It returns the resulting token (or null), the post record, the persist record and the validator records. The Rust side drives the production AuthorizationCodeRefresher through fakes built from the same case. For lazy_fetch the Python side builds LazyPerUserOAuthTokenStore with a store_builder fake and a redis_available fake that follow the case's step list (fetch, invalidate, set_redis_available) and a credential_binding_matches replacement for the module attribute, and returns the log of builder calls, fetch results and invalidations. The Rust side runs the same steps through the production LazyPerUserOAuthTokenStore. Cases that need ordering between concurrent fetches stay out, since asyncio and tokio schedule differently; the case steps run one after another. Add a mcp-per-user-oauth-refresh-* seed to the helper_case corpus for each function.

