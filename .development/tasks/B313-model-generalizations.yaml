  why: Previously uncovered helper owned by this task.
dod:
- text: Write tests named b313_behaviors and b313_boundaries under model_generalizations::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - b313-behaviors
  - b313-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/b313-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/b313-invalid.yaml;
    the valid seed contains fallback_generalizations. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - b313-boundaries
- text: Add crates/betterlite-router/fuzz/corpus/model_rules/b313-valid.json and crates/betterlite-router/fuzz/corpus/model_rules/b313-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target model_rules and normal replays_the_model_rules_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - b313-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: b313-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::b313_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: b313-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::b313_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/model_generalizations.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/model_generalizations.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/b313-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/b313-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/b313-" && grep -Fq 'fallback_generalizations' crates/betterlite-config/fuzz/corpus/config_yaml/b313-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-router/fuzz/corpus/model_rules/b313-valid.json && test -f crates/betterlite-router/fuzz/corpus/model_rules/b313-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/model_rules
      | grep -Fq "/b313-" && test -f crates/betterlite-router/fuzz/fuzz_targets/model_rules.rs && cargo
      nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_model_rules_corpus)'
