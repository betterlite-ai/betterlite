id: B313
title: Fallback provider and capability generalization rules
description: 'Implement the pinned cost-map generalization rules as a typed bounded rule engine consumed
  through B010/B013 integration points. Compile patterns once, separate provider inference from capability
  merging and exact-entry fill, and preserve legacy single-level parent expansion. This is model catalog
  fallback, not failure retry. Keep the rules in the router only as an adapter if B013 already owns an
  equivalent engine; do not duplicate it. Warn and skip malformed rules exactly as the pin does; preserve
  ignored descriptive fields without interpreting them. Use a maintained Python-compatible regex implementation
  with an explicit work bound. Unsupported valid Python constructs or exhausted work produce a named warning
  and skip the pattern; never silently reinterpret it. Keep the integration adapter in betterlite-server
  in this task module; consume predecessor public interfaces without editing their implementation crates.
  Configuration boundary keys introduced or consumed here: fallback_generalizations. Implement the owned
  native service in crates/betterlite-router/src/model_generalizations.rs. Add ProbeOperation::B313 in
  tools/oracle/src/router_probes/mod.rs and the corresponding B313 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/litellm_core_utils/fallback_generalizations.py:
  _resolve_legacy_extends (L69-L95), _resolve_legacy_extends.resolved (L85-L93), _parse_fill_missing_for_providers
  (L114-L127), _compile_rule (L130-L181), _FallbackGeneralizations.__init__ (L187-L191), _FallbackGeneralizations.set_rules
  (L193-L199), _FallbackGeneralizations.match_routing (L201-L207), _FallbackGeneralizations.match_capabilities
  (L209-L215), _FallbackGeneralizations.match_fill_missing (L217-L230), set_fallback_generalizations (L236-L244),
  get_fallback_generalization_rules (L247-L249), match_routing_generalization (L252-L257), match_capability_generalizations
  (L260-L266), match_fill_missing_generalizations (L269-L277). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports. Bound the model_rules outside-byte parser to 1048576 bytes before decoding; on excess
  use its typed invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback
  path).'
