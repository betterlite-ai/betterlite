id: B313
title: Fallback provider and capability generalization rules
description: >-
  Integrate the B2229 catalog generalization engine with B301 deployment selection and B361 routing context using
  B010/B013 interfaces. Own no new LiteLLM function body: all fallback_generalizations.py functions, regex compilation
  and the model-rules decoder/corpus are B2229. The router calls that lower implementation; do not keep a second
  registry or engine. Preserve first routing-rule selection, exact-entry precedence, ordered capability union and
  explicit-null preservation through catalog reloads. Keep existing typed warning/fallback outcomes and configured
  bounds.


  Add ProbeOperation::ModelGeneralizations in tools/oracle/src/router_probes/mod.rs and the corresponding B313 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.  Budget
  from zero owned LiteLLM function-body lines: 110 integration lines, 160 behavior-test lines, 90 Rust/Python adapter
  lines and 40 module/seed wiring lines; 400 planned and maximum changed lines. Integration cases exercise exact_entry_before_rule,
  first_routing_match, reload_replaces_rules and explicit_null_not_filled through the production engine and router
  boundary.
scope:
  paths:
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/mod/**
  - crates/betterlite-server/src/routing/model_generalizations.rs
  - crates/betterlite-server/src/routing/model_generalizations/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/strategy/**
  - crates/betterlite-router/src/context.rs
  - crates/betterlite-router/src/context/**
  - tools/oracle/src/router_probes/model_generalizations.rs
  - tools/oracle/src/router_probes/model_generalizations/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/model_generalizations.py
  - tools/oracle/cases/routing/model-generalizations/**
  - Cargo.toml
  - crates/betterlite-router/Cargo.toml
  - crates/betterlite-router/src/generalization_integration.rs
  - crates/betterlite-router/src/generalization_integration/**
  - crates/betterlite-config/src/sections/model_generalizations.rs
  - crates/betterlite-config/src/sections/model_generalizations/**
  - tools/oracle/helpers/b313.py
  - tools/oracle/helpers/b313/**
  - tools/oracle/src/helpers/server/b313.rs
  - tools/oracle/src/helpers/server/b313/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L74-L277
  why: Rule compilation, legacy inheritance, first-hit routing and merged capability lookup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L69-L95
  why: Previously uncovered helper owned by this task.
dod:
- text: Write tests named model_generalizations_behaviors and model_generalizations_boundaries under model_generalizations::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation and
    the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either check.
  proof:
  - model-generalizations-behaviors
  - model-generalizations-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier, provider
    requests, status, code and state changes; only /error/message may be ignored for betterlite wording. Every declared
    deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/model-generalizations-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/model-generalizations-invalid.yaml;
    the valid seed contains fallback_generalizations. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - model-generalizations-boundaries
- text: Add crates/betterlite-router/fuzz/corpus/model_rules/model-generalizations-valid.json and crates/betterlite-router/fuzz/corpus/model_rules/model-generalizations-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target model_rules and normal replays_the_model_rules_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - model-generalizations-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: model-generalizations-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::model_generalizations_behaviors(::|$)/) - test(/replays_the_.*_corpus/)'
  - id: model-generalizations-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::model_generalizations_boundaries(::|$)/) - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/model_generalizations.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/model_generalizations.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/model-generalizations-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/model-generalizations-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml |
      grep -Fq "/model-generalizations-" && grep -Fq 'fallback_generalizations' crates/betterlite-config/fuzz/corpus/config_yaml/model-generalizations-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: Integration must use the existing B2229 production rule decoder.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::replays_the_model_generalization_rules_corpus$/)'
oracle_cases:
- tools/oracle/cases/routing/model-generalizations/provider-first-match.yaml
- tools/oracle/cases/routing/model-generalizations/capabilities-last-match.yaml
- tools/oracle/cases/routing/model-generalizations/exact-entry-wins.yaml
- tools/oracle/cases/routing/model-generalizations/fill-missing-provider-filter.yaml
- tools/oracle/cases/routing/model-generalizations/legacy-single-level-parent.yaml
- tools/oracle/cases/routing/model-generalizations/case-insensitive-search.yaml
- tools/oracle/cases/routing/model-generalizations/no-match.yaml
- tools/oracle/cases/routing/model-generalizations/malformed-rule-warning-skip.yaml
- tools/oracle/cases/routing/model-generalizations/unknown-description-ignored.yaml
- tools/oracle/cases/routing/model-generalizations/duplicate-name-parent-last-wins.yaml
- tools/oracle/cases/routing/model-generalizations/bounded-regex-warning.yaml
- tools/oracle/cases/routing/model-generalizations/parser-byte-bound.yaml
deviations:
- what: A regex exceeding 2048 pattern bytes or 100000 match steps is warned about and skipped.
  why: The pin has no execution bound; bounded-inputs requires one. Keep supported Python syntax and first-match
    semantics within the bound.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L130-L181
- what: The model_rules byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite limit.
    Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L74-L277
out_of_scope:
- B2229 owns every fallback_generalizations.py function and the production decoder/fuzz target; this task owns router/server
  integration only.
pitfalls:
- Rust regex syntax is not all Python re syntax; unsupported constructs need an explicit error and a reported deviation.
- Do not reinterpret capability fallback as a retry chain.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become a hard
  request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules at the
  repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
