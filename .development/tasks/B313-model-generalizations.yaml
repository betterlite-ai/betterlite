deviations:
- what: A regex exceeding 2048 pattern bytes or 100000 match steps is warned about and skipped.
  why: The pin has no execution bound; bounded-inputs requires one. Keep supported Python syntax and first-match
    semantics within the bound.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L130-L181
- what: The model_rules byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L74-L277
out_of_scope:
- Downloading a newer price map or changing the B013 catalog pin.
pitfalls:
- Rust regex syntax is not all Python re syntax; unsupported constructs need an explicit error and a reported
  deviation.
- Do not reinterpret capability fallback as a retry chain.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
