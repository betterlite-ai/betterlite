id: B313
title: Fallback provider and capability generalization rules
description: Implement the pinned cost-map generalization rules as a typed bounded rule engine consumed
  through B010/B013 integration points. Compile patterns once, separate provider inference from capability
  merging and exact-entry fill, and preserve legacy single-level parent expansion. This is model catalog
  fallback, not failure retry. Keep the rules in the router only as an adapter if B013 already owns an
  equivalent engine; do not duplicate it. Reject malformed configuration by full path under the no-silent-drops
  rule. Use the existing Rust crate boundaries from B004 and B008; integrate through the server when the
  provider dispatcher or callbacks live in another core crate. This task's source slices are the linked
  ranges, not a port of their Python classes. Add the listed oracle cases and the matching adapters to
  B301's component runner where state is not observable over HTTP; adapters call production logic and
  never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons, and
  separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target and
  committed corpus for every newly accepted config form; unsupported keys still fail by full path. Add
  a cargo-fuzz target generalization_rules under crates/betterlite-router/fuzz and a normal replays_the_generalization_rules_corpus
  test using the production parser. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/model-generalizations/**
  - tools/oracle/src/router_probes/model-generalizations/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/model_generalizations.py
  - tools/oracle/litellm/probes/registry.py
  - Cargo.toml
  - deny.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L74-L277
  why: Rule compilation, legacy inheritance, first-hit routing and merged capability lookup.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(model_generalizations)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/generalization_rules.rs && test -n "$(ls -A
      crates/betterlite-router/fuzz/corpus/generalization_rules)" && cargo nextest run --locked -p betterlite-router
      --no-tests=fail -E 'test(replays_the_generalization_rules_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/model-generalizations/provider-first-match.yaml
- tools/oracle/cases/routing/model-generalizations/capabilities-last-match.yaml
- tools/oracle/cases/routing/model-generalizations/exact-entry-wins.yaml
- tools/oracle/cases/routing/model-generalizations/fill-missing-provider-filter.yaml
- tools/oracle/cases/routing/model-generalizations/legacy-single-level-parent.yaml
- tools/oracle/cases/routing/model-generalizations/case-insensitive-search.yaml
- tools/oracle/cases/routing/model-generalizations/no-match.yaml
deviations:
- what: Malformed generalization rules fail loading instead of being logged and skipped.
  why: The no-silent-drops rule forbids silently losing configuration.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L122-L180
out_of_scope:
- Downloading a newer price map or changing the B013 catalog pin.
pitfalls:
- The architect must confirm the B010/B013 engine location and add its exact crate paths before dispatch
  if they are not in the existing scoped crates.
- Rust regex syntax is not all Python re syntax; unsupported constructs need an explicit error and a reported
  deviation.
- Do not reinterpret capability fallback as a retry chain.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
