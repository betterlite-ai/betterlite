dod:
  - text: _parse_output_cap_value returns int for int/float/str numeric values (e.g., "4096" → 4096, 4.5 → 4), returns None for bool, non-numeric types, or ValueError/OverflowError.
    proof: [parse-output-cap]
  - text: no_max_tokens_output_floor returns baseline (DEFAULT_MAX_TOKENS_ESTIMATE / 4 = 1024) when no limit provided, returns min(baseline, max(1, limit / 4)) when limit provided, ensuring small TPM caps stay usable.
    proof: [no-max-tokens-floor]
  - text: _is_embedding_request returns true for call_type in (aembedding, embedding), false for call_type in (aresponses, responses), false for other call_types, and checks data.get("input") only when call_type is None or absent.
    proof: [embedding-detect]
  - text: _translate_google_genai_native_request returns None when data is not a dict or call_type not in Google native types, calls GoogleGenAIAdapter.translate_generate_content_to_completion with config/generationConfig field selection and returns the result.
    proof: [google-native-translate]
  - text: _get_explicit_output_cap returns None for non-dict data, returns max of Google maxOutputTokens/max_output_tokens for Google types, returns max(16, parsed) for Responses types, returns None for embeddings, handles max_tokens/max_completion_tokens/max_output_tokens fields per call type.
    proof: [explicit-output-cap]
  - text: _has_explicit_output_cap returns true when _get_explicit_output_cap is not None (explicit-zero counts as explicit).
    proof: [has-explicit-cap]
  - text: get_output_candidate_count returns 1 for non-Mapping data, returns max(1, n, best_of, candidateCount, candidate_count) across aliases with int() coercion and exception fallback, returns 1 on TypeError/ValueError/OverflowError.
    proof: [candidate-count]
  - text: _apply_implicit_output_cap modifies data in place, applies cap to max_tokens (or max_output_tokens for Responses, or maxOutputTokens for Google) when no explicit cap and the calculated floor is below the baseline, skips when floor >= baseline or has explicit cap or is embedding or Decisions endpoint, uses effective_cap = max(floor, configured_output_tokens or 0).
    proof: [apply-implicit-cap, apply-implicit-cap-skip]
  - text: _estimate_tokens_for_request returns input + (max_tokens * candidate_count), using _estimate_input_and_output_tokens for separate input and output budget.
    proof: [combined-tokens]
  - text: _estimate_input_and_output_tokens translates Google requests, selects field per call type (messages or prompt or input), returns (input_char_count / 4, output_floor or explicit_max_tokens or configured_output_tokens or max(input_estimate, floor)).
    proof: [input-output-tokens]
  - text: _estimate_audio_block_tokens returns DEFAULT_AUDIO_TOKEN_ESTIMATE (300) for missing data or no base64 input_audio.data, returns max(decoded_bytes / 1600, 300) for base64 data (length * 3 / 4 decoded).
    proof: [audio-block-tokens]
  - text: _estimate_audio_content_tokens returns 0 for non-list messages, returns sum of per-block audio estimates across all input_audio blocks in message content.
    proof: [audio-content-tokens]
  - text: _strip_audio_content_blocks returns messages unchanged for non-list or when audio_token_estimate is 0, reconstructs messages with input_audio blocks filtered out.
    proof: [strip-audio-blocks]
  - text: _responses_input_to_chat_messages returns empty sequence for non-dict, calls LiteLLMCompletionResponsesConfig.transform_responses_api_input_to_messages with input field (or "").
    proof: [responses-to-chat]
  - text: _count_pretokenized_embedding_input returns None for non-list, returns len(value) for flat int list, returns sum(len(token_ids) for token_ids in value) for nested list of ints, returns None for mixed/non-int elements.
    proof: [pretokenized-embedding]
  - text: _rerank_input_to_text returns query plus documents joined by newlines, handles documents as list or missing, converts non-str/non-dict parts to str().
    proof: [rerank-text]
  - text: _estimate_precise_input_tokens returns 0 for non-dict, detects Responses/embedding/rerank/completion types, handles pretokenized embeddings directly, strips audio blocks and adds audio estimate back, calls token_counter(model, messages, text, tools, tool_choice), falls back to cheap estimate on exception with audio added back.
    proof: [precise-input-tokens]
  - text: _estimate_input_and_output_tokens multiplies max_tokens_estimate by candidate count from get_output_candidate_count.
    proof: [candidate-multiplication]

pitfalls:
  - "_parse_output_cap_value rejects bool input even if it is 0 or 1; bool is checked before int/float/str type check, so all booleans return None."
  - "_estimate_tokens_for_request does not distinguish between zero input, zero output and zero budget; a call with zero total estimates still reserves zero tokens."
  - "_apply_implicit_output_cap modifies the request dict in place (rebind-ok in comments); callers that need immutability must copy first or use the return value concept differently."
  - "_responses_input_to_chat_messages returns empty sequence when input is absent, not a single empty-string message, so callers must check return length or it counts as zero input."
  - "no_max_tokens_output_floor uses integer division (// 4) and max(1, ...) so the floor never goes below 1 token even for very small limits."
  - "call_type parameter determines field selection: when absent or None, the function searches messages/prompt/input in order; when set, it picks only the matching field so a Responses call with messages field is ignored."
  - "Google GenAI requests may have config or generationConfig field; the function tries config first and falls back to generationConfig only if config is absent, so a request with both uses config."
  - "Responses API minimum output is 16 tokens and applies in _get_explicit_output_cap, but _apply_implicit_output_cap applies it again when computing the floor, so Responses requests get at least 16 either way."
  - "Audio estimates use a fixed 1600 bytes-per-token rate; this assumes the lowest reasonable bitrate and may over-estimate for highly compressed audio but ensures reservation never undercuts high-quality recordings."
  - "token_counter may raise ValueError, AssertionError or other exceptions; the fallback catches all exceptions (BLE001 noqa) and degrades to char-count estimate, so caller never sees the exception."
  - "_apply_implicit_output_cap skips the cap when capped_floor >= baseline_floor (i.e., when min_configured_tpm_limit is None or >= 4096), even if no max_tokens field is present, because the floor already provides no additional constraint."

out_of_scope:
  - get_str_from_messages in litellm/litellm_core_utils/prompt_templates/common_utils.py is called by _estimate_input_and_output_tokens; owned by B218, this task uses it as a black box for char counting.
  - GoogleGenAIAdapter.translate_generate_content_to_completion in litellm/google_genai/adapters/transformation.py is called by _translate_google_genai_native_request; owned by B3484.
  - offload_token_count in litellm/litellm_core_utils/token_counter.py is imported but not called in the owned ranges; its owner remains open and it may be a fallback for token_counter.
  - Call-family constants (EMBEDDING_API_CALL_TYPES, RESPONSES_API_CALL_TYPES, etc.) are defined in B3031 or supplied as imports; this task uses them for dispatch.

deviations:
  - what: Failed token_counter calls fall back to cheap char-count estimation instead of propagating the exception or returning None.
    why: LiteLLM degrades to char-count estimate on any token_counter error so small model name mismatches or missing tokenizers don't block the request; betterlite preserves this behavior to avoid rate-limit rejections from estimation failures.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L3734-L3738

