id: B3041
title: Request token estimates and implicit output caps
description: >-
  Implement combined and precise project-input token estimation across chat,
  completion, Responses, embeddings, rerank, audio and native Google requests.
  Build token estimates for reservation and reconciliation with accurate multimodal
  and audio content handling, and apply implicit output-token caps to prevent
  unbounded generation from overshooting quota before post-call reconciliation.

  Estimate combined tokens (input + output budget) for request-level TPM reservation
  using cheap char-count approximation (characters divided by 4, floor 1). Estimate
  precise project input tokens using litellm.token_counter for model-aware counting
  that includes image/tool/audio content, since the deployment-level ITPM check uses
  the same approach. For audio blocks, derive estimates from base64 payload size
  assuming the lowest reasonable bitrate (1600 bytes per token) so multimodal
  audio-heavy requests reserve proportionally more before post-call reconciliation.
  Preserve explicit-zero output caps (a legitimate zero-output request), candidate
  multiplication for n/best_of/candidateCount fields, Responses API minimum output
  (16 tokens), configured per-tenant output estimates and endpoint-specific
  implicit-cap exclusions (embeddings, Decisions). When no max_tokens field is
  present and the calculated output floor does not already exceed the configured
  TPM budget fraction, apply a conservative output floor (4096 divided by 4 = 1024
  tokens, capped to 1/4 of the smallest configured TPM limit per tenant) to every
  non-embedding request. Skip the cap when the floor already meets or exceeds the
  baseline (no additional constraint to enforce) or when the request has an explicit
  cap or is an embedding.

  Parse output-cap values defensively: accept int/float/str, reject bool,
  catch ValueError/OverflowError and return None. Translate Google GenAI native
  requests to chat-completion format via GoogleGenAIAdapter so native contents
  blocks count correctly. Detect request type via call_type (chat, completion,
  embedding, Responses, rerank, audio) and apply the correct field precedence
  and content-block handling for each. Strip input_audio content blocks before
  passing messages to token_counter (which raises on them), then add audio
  estimates back on top so the rest of the message still gets counted accurately.
  Detect Responses API input via call_type disambiguator and transform it to
  chat messages first so its multimodal content blocks get counted like messages.
  Count pretokenized embedding input (flat list of ints or nested lists of ints)
  directly without passing to token_counter. Convert rerank documents and query
  to text for the char-count estimate. Fall back to cheap char-count estimate if
  token_counter raises (unrecognized model, missing tokenizer), and add audio
  estimates on top of the fallback.

  Direct dependencies: B196 supplies litellm.token_counter; B218 supplies
  get_str_from_messages for char counting; B909 supplies
  LiteLLMCompletionResponsesConfig.transform_responses_api_input_to_messages;
  B3031 supplies call-family constants, estimate defaults and descriptor records;
  B3484 supplies GoogleGenAIAdapter.translate_generate_content_to_completion.
  offload_token_count is imported but not called in the owned ranges.

scope:
