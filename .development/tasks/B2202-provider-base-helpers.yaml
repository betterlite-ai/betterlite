  never for object responses. Preserve existing nonempty maps; callers that stamp results must copy explicitly.
  history_tool_and_thinking_predicates: has_tool_call_blocks accepts any role with non-None tool_calls including
  []; any_assistant_message_has_thinking_blocks needs assistant role and non-None thinking_blocks with no length
