budget:
  max_changed_lines: 800
  max_new_expects: 0
checks:
  commands:
  - id: helper-python
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/provider_base_helpers.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
    why: The operation adapter is absent, unchanged or fails strict Python checks.
  - id: helper-case-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/provider_base_helpers*")"
      && grep -lq 'provider_base_helpers' tools/oracle/fuzz/corpus/helper_case/provider_base_helpers* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_provider_base_helpers$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
  - id: case-base-error-projection
    why: Preserve status_code, message, headers/body (default None) and status_code_is_synthesized (default false).
      Truthy supplied request/response retained; otherwise synthesize POST https://docs.litellm.ai/docs and response
      with supplied status/request. Constructor does not invent error type/param/code; later exception mapping owns
      those.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_base_error_projection$/)'
  - id: case-class-config-filter
    why: Base init is no-op. get_config collects only own class dictionary, nonunderscore keys with non-None values,
      excluding functions,builtins,classmethod,staticmethod,property and every callable. Preserve false/zero/empty
      configured values; do not inherit unspecified defaults from a parent class.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_class_config_filter$/)'
  - id: case-thinking-option-presence
    why: Thinking enabled iff thinking is literal True, dict thinking.type=enabled, or reasoning_effort is non-None
      (including none/empty/false). adaptive thinking alone does not satisfy it. max-token presence tests key existence
      for max_tokens or max_completion_tokens, including None.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_thinking_option_presence$/)'
  - id: case-implicit-thinking-max-tokens
    why: After mapping, if thinking enabled in optional_params and neither max-token spelling was present in non_default_params,
      non-None dict thinking.budget_tokens sets max_tokens=budget+DEFAULT_MAX_TOKENS (integer env default4096).
      Existing optional max_tokens is overwritten; explicit key even None prevents it. Missing budget leaves options
      unchanged.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_implicit_thinking_max_tokens$/)'
  - id: case-append-tools
    why: Absent tools assigns supplied list, otherwise concatenate existing and new tools preserving order/duplicates;
      existing None is not treated as absent and retains source failure behavior.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_append_tools$/)'
  - id: case-dict-response-schema-refs
    why: None format returns None. Dict format with no ref_template or type!=json_schema returns unchanged. Otherwise
      deepcopy required json_schema.schema, traverse dict/list graph once per object and replace every $ref using
      its final slash segment in ref_template.format(model=...). Preserve extra schema/envelope fields, input immutability
      and missing-key/type errors; no fetch or definition expansion occurs here.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_dict_response_schema_refs$/)'
  - id: case-hidden-metadata-projection
    why: Normalize dict hidden metadata as-is, Pydantic model_dump record as its serialized mapping, all other values
      to empty dict. get_hidden_params_dict reads dict _hidden_params or object attribute; create=True attaches
      a new empty mapping only for dict responses with falsey normalized metadata, never for object responses. Preserve
      existing nonempty maps; callers that stamp results must copy explicitly.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_hidden_metadata_projection$/)'
  - id: case-history-tool-and-thinking-predicates
    why: has_tool_call_blocks accepts any role with non-None tool_calls including []; any_assistant_message_has_thinking_blocks
      needs assistant role and non-None thinking_blocks with no length or positive length. Last-assistant predicate
      considers only assistant tool_calls non-None, then returns true for missing/None/zero-length thinking_blocks,
      false if no qualifying message.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_history_tool_and_thinking_predicates$/)'
  - id: case-dummy-tool-literal
    why: Ignore custom_llm_provider argument and return exactly one function named dummy_tool, description This
      is a dummy tool call, parameters {type:object,properties:{}}; no tool execution occurs.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_dummy_tool_literal$/)'
  - id: config-default-max-tokens
    why: DEFAULT_MAX_TOKENS lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::provider_base_config_cases::case_[0-9]+_loads_default_max_tokens$/)'
  - id: config-modify-params
    why: modify_params lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::provider_base_config_cases::case_[0-9]+_loads_modify_params$/)'
  - id: config-litellm-modify-params
    why: LITELLM_MODIFY_PARAMS lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::provider_base_config_cases::case_[0-9]+_loads_litellm_modify_params$/)'
  - id: case-modify-params-default-and-env
    why: 'litellm_settings.modify_params defaultsfalse; initial LITELLM_MODIFY_PARAMS uses bool(os.getenv(...,False)):
      unset/empty ->false, every nonempty string including false,0,whitespace ->true. Explicit configured setting
      overrides the environment initialization. Snapshot once through B002; consumers must not parse this as a conventional
      boolean env flag.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_modify_params_default_and_env$/)'
  - id: case-base-responses-initializer
    why: 'BaseResponsesAPIConfig.__init__ is an empty no-op: constructing a base-compatible provider has no side
      effects or extra configuration. Reuse the native zero-state initialization at this lower boundary; do not
      depend on the upper B1114 provider contract merely to call pass.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_base_responses_initializer$/)'
  - id: case-base-image-edit-initializer
    why: BaseImageEditConfig.__init__ is an empty no-op, just like the base Responses initializer; provider construction
      adds no settings or side effects. Keep the zero-state initializer below image provider leaves.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::base_helpers_cases::case_[0-9]+_base_image_edit_initializer$/)'
  optional:
  - mutants
description: >-
  Implement shared provider base helpers below OpenAI, Anthropic and router callers in betterlite-openai. These
  primitives operate on typed option/message/hidden-metadata records and do not import betterlite-provider, betterlite-core
  or router dispatch. This completes the small superclass and utility calls that cannot depend on B010/B016/B157.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/base_llm/chat/transformation.py:
  BaseLLMException.__init__ L42-L65; BaseConfig.__init__ L69-L70; BaseConfig.get_config L72-L90; BaseConfig.is_thinking_enabled
  L95-L98; BaseConfig.is_max_tokens_in_request L100-L104; BaseConfig.update_optional_params_with_thinking_tokens
  L106-L123; BaseConfig._add_tools_to_optional_params L136-L147. litellm/llms/base_llm/base_utils.py: _dict_to_response_format_helper
  L140-L176; type_to_response_format_param None/dict branches L179-L191. litellm/router_utils/add_retry_fallback_headers.py:
  _normalize_hidden_params L188-L193; get_hidden_params_dict L196-L209. litellm/utils.py: has_tool_call_blocks L8132-L8141;
  any_assistant_message_has_thinking_blocks L8144-L8162; last_assistant_with_tool_calls_has_no_thinking_blocks L8165-L8194;
  add_dummy_tool L8197-L8215. litellm/llms/base_llm/responses/transformation.py: BaseResponsesAPIConfig.__init__
  L31-L32. litellm/llms/base_llm/image_edit/transformation.py: BaseImageEditConfig.__init__ L30-L31.


