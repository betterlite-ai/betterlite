  to call pass. base_image_edit_initializer: BaseImageEditConfig.__init__ is an empty no-op, just like the base
  Responses initializer; provider construction adds no settings or side effects. Keep the zero-state initializer
  below image provider leaves.


  Load DEFAULT_MAX_TOKENS through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest provider_base_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Load modify_params, LITELLM_MODIFY_PARAMS through betterlite-config, with injected environment lookup and the
  defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest provider_base_config_cases; each named loads_<key> case invokes the real B002 loader, checks
  explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Implement crates/betterlite-openai/src/base_helpers.rs with adjacent tests under base_helpers/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation provider_base_helpers in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function base_helpers_cases in betterlite-openai with these exact named cases (one per oracle file):
  base_error_projection, class_config_filter, thinking_option_presence, implicit_thinking_max_tokens, append_tools,
  dict_response_schema_refs, hidden_metadata_projection, history_tool_and_thinking_predicates, dummy_tool_literal,
  modify_params_default_and_env, base_responses_initializer, base_image_edit_initializer. Each case exercises its
  named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/provider_base_helpers* using HelperCase: kind:
  helper and the externally tagged provider_base_helpers variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_provider_base_helpers that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 210 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 275 production lines, 275 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 80 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 785 planned, 800 maximum changed lines.
