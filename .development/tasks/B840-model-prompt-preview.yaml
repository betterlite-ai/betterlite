  - text: 'Implement the owned behavior and ordered failure effects; named tests: default_prompt, custom_tier_labels,
      invalid_label_json, negative_context_window, custom_definitions_post, classification_examples.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The production decode_prompt_preview decoder is used by the service and its fuzz target and
      rejects malformed/oversize input without panic.
