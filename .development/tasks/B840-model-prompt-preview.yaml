id: B840
title: Model classifier prompt preview routes
description: >-
  Implement GET and POST /auto_router/classifier/default_prompt by calling B374 tier definitions and B375
  classifier prompt construction/normalization. Keep JSON query parsing, negative context-window rejection
  and body-only custom instructions; the preview renders the same prompt function used by the classifier.


  Build the production model_prompt_preview module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  _validated_labeled_tiers (L2937-L2949; 13 source lines), _labeled_tiers_from_query (L2952-L2965; 14
  source lines), preview_auto_router_classifier_prompt (L2989-L3015; 26 source lines), get_auto_router_classifier_default_prompt
  (L3024-L3065; 38 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /auto_router/classifier/default_prompt
  -> preview_auto_router_classifier_prompt; GET /auto_router/classifier/default_prompt -> get_auto_router_classifier_default_prompt.
  For each route send a typed successful request, an invalid or missing target, and a caller lacking that
  route permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This task owns the outside-byte boundary model_prompt_preview::decode_prompt_preview(&[u8]) -> Result<TypedValue,DecodeError>
  for untrusted labeled-tier query JSON. Production calls this decoder before its typed policy functions;
  the cargo-fuzz target model_prompt_preview calls that same function. Seed valid, truncated, malformed,
  duplicate-field and limit-boundary inputs and add model_prompt_preview::tests::replays_the_model_prompt_preview_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B770 owns crates/betterlite-server/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 91 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  91 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 349 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
