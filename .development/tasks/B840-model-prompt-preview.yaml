  - text: 'The recorded deviations are covered by native behavior tests: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_prompt_preview::tests::/)
        - test(/replays_the_/)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/model_prompt_preview.rs && grep -q "model_prompt_preview"
        crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-server/fuzz/corpus/model_prompt_preview)" && cargo nextest run --locked -p
        betterlite-server --no-tests=fail -E 'test(replays_the_model_prompt_preview_corpus)'
