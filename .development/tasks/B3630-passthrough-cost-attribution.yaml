deviations:
  - what: log_batch_registration_result takes the join result of a tokio task, so a task that panicked counts as a failed write, with the join error as the error text, where Python only saw a task exception or a cancel.
    why: asyncio.Task has no Rust twin; the join result is the same information, and a panic must still reach the log.
  - what: The debug log of the standard logging object is serialized with serde_json pretty printing, not Python's json.dumps(indent=4).
    why: Python's dumps formatting is runtime behavior (docs/compatibility.md); the line is a debug log and no client reads it.
  - what: A cost or payload error is caught as a typed error. LiteLLM's blanket `except Exception` also catches Python bugs such as a missing attribute, and betterlite has no such class of failure.
    why: Rust has no runtime attribute errors, and a panic is banned by the no-panics rule, so the typed error is the only case left.
out_of_scope:
  - "passthrough_chat_handler, _build_complete_streaming_response, _handle_logging_llm_collected_chunks and the abstract provider accessors of base_passthrough_logging_handler.py: B3650 owns them and its covers include the file. B3650 calls create_response_logging_payload from this task."
  - "anthropic_passthrough_handler, _create_anthropic_response_logging_payload and _handle_logging_anthropic_collected_chunks: B3634 owns them (the Anthropic response logging task). They call this task's cost, speed, model and message_start helpers."
  - "_stream_was_interrupted, _recover_interrupted_stream_output_tokens, _clear_placeholder_cost, record_partial_usage_for_failure, _usage_only_response_or_none, _assemble_streaming_response and _build_streaming_response_for_logging: B3632 owns the interrupted stream usage recovery; no backlog entry says so in words, see the notes."
  - "_split_sse_chunk_into_events, _build_complete_streaming_response, _collapse_pure_text_chunks, _build_complete_streaming_response_legacy, _extract_sse_data and _build_usage_only_response_from_chunks: B3631 owns the stream reconstruction."
  - "batch_creation_handler, _store_batch_managed_object and get_actual_model_id_from_router: B3633 owns Anthropic batch logging. It spawns the managed object write and calls log_batch_registration_result from here."
  - "The OpenAI override of _get_user_from_metadata (returns request_body['user'] unchanged) and every other function in openai_passthrough_logging_handler.py: B3635, B3636 and B3637 own them. B3637 must not call this task's end_user_from_request_body for that override."
  - "get_end_user_id_from_request_body (B880), completion_cost (B068), get_standard_logging_object_payload (B190), the per-call log (B247), the router model id helper (B253) and the custom pricing detection (B1717)."
  - "The PassthroughStandardLoggingPayload type from litellm/types/passthrough_endpoints/pass_through_endpoints.py: this task only reads its request_body, and the route tasks that fill the rest define the struct."
pitfalls:
  - The OpenAI handler overrides _get_user_from_metadata and returns the raw request_body["user"], while the base and Anthropic versions go through get_end_user_id_from_request_body; do not merge the three.
  - When the standard logging object step fails, the kwargs already hold response_cost, model and the user, but the response id and model and the call log "model" are not rewritten.
  - 'The user is set by replacing litellm_params["proxy_server_request"] with {"body": {"user": user}}, so any body, headers or url that was there is dropped.'
  - request_tags_from_metadata treats an empty tags list as absent for the request and falls to the key's tags, but returns an empty key list as is, so an empty list and none are different answers.
  - Only strings in a tags list survive, and each one loses its NUL bytes; a list of numbers gives an empty tuple, not none.
  - is_collection_route strips every trailing slash, so "/v1/messages/batches///" is the collection, while "/v1/messages/batches/abc" is not.
  - str.splitlines also breaks on \v, \f, \x1c to \x1e, \x85,   and  , so a JSON string value with one of those inside a data line splits the line; Rust's lines() would not.
  - extract_message_start_field returns the first non-empty string only; a message_start with an empty "model" does not end the scan, and a later message_start can still answer.
  - resolve_costing_model strips "passthrough/" once from the front of model_group with removeprefix, not every occurrence, and returns the original model when no source gives a better one.
  - compute_response_cost checks cache_hit with `is True`, so the string "true" or the number 1 in the call log does not give zero cost.
  - The provider prefix is added only when custom_llm_provider is truthy and the model does not already start with "{provider}/".
  - 'The OpenAI caller (B3637) passes request_body["user"] unchanged as end_user, while the default callers pass end_user_from_request_body(request_body); create_response_logging_payload must not look the user up itself.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
