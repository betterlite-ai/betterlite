dod:
  - text: optional_str, is_collection_route and request_tags_from_metadata follow the fall-through rules (request tags first, key tags only when the request gave none, an empty key list still returned).
    proof: [batch-tests, attribution-oracle]
  - text: log_batch_registration_result logs the error text for a failed or cancelled write with the right consequence for create and non-create, and the info text for a clean one.
    proof: [batch-tests]
  - text: extract_message_start_field splits like splitlines, skips bad JSON and events that are not message_start, keeps scanning past a message_start without the field, and returns a typed error on invalid UTF-8.
    proof: [fields-tests, attribution-oracle]
  - text: resolve_logged_model picks the request model, then the call log model, then the model seen in the chunks when the first is empty or "unknown".
    proof: [fields-tests]
  - text: The message_start decoder has a fuzz target that replays its corpus without a panic.
    proof: [fields-corpus]
  - text: cost_relevant_speed and resolve_costing_model return the specified values for the speed types, the "unknown" cases and the model_group prefix strip.
    proof: [costing-tests, attribution-oracle]
  - text: compute_response_cost returns zero on an exact cache hit and adds the provider prefix once; cost_partial_stream_or_zero turns an error into a warning and 0.0.
    proof: [costing-tests]
  - text: create_response_logging_payload runs its steps in order, keeps the effects of finished steps when a later one fails, replaces proxy_server_request wholesale and never returns an error.
    proof: [payload-tests]
  - text: create_response_logging_payload uses the end_user argument as given and never looks the user up itself, tested by payload_uses_end_user_argument (the default callers pass end_user_from_request_body, the OpenAI caller passes request_body["user"]).
    proof: [payload-tests]
  - text: The helper adapter's Python passes the strict lint and type check.
    proof: [helper-python]
checks:
  optional: []
  commands:
    - id: batch-tests
      why: the batch attribution tests fail, or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::batch_attribution::tests::batch_/)'
    - id: fields-tests
      why: the message_start readers or the logged model choice are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::stream_fields::tests::fields_/) - test(replays_the_message_start_field_corpus)'
    - id: fields-corpus
      why: the message_start decoder has no fuzz target, no new corpus seeds or the replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/message_start_field)" &&
        grep -q 'extract_message_start_field' crates/betterlite-server/fuzz/fuzz_targets/message_start_field.rs &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_message_start_field_corpus)'
    - id: costing-tests
      why: the speed, costing model or response cost helpers are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::response_costing::tests::costing_/)'
    - id: payload-tests
      why: the response logging payload steps, their order or the partial-failure behavior are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::response_payload::tests::payload_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3630)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3630 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3630/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/passthrough_attribution-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: attribution-oracle
      why: newly added helper cases are absent, do not use the b3630 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/passthrough-attribution)" &&
        grep -rlE '^[[:space:]]+b3630:' tools/oracle/cases/helpers/passthrough-attribution &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/passthrough-attribution
