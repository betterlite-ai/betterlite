id: B3630
title: Passthrough response cost and attribution primitives
description: >-
  Build the shared pieces that every provider pass-through logging handler uses to price a relayed response and to tie its spend to a key, tags and an end user.
  They live in betterlite-server under src/pass_through_logging, in four modules. The skeleton declares them.
  Every function is pure or takes its collaborators through the constructor or an argument: B068's completion_cost service, B1717's custom pricing detection, B253's router model id helper, B247's per-call log (LiteLLM's model_call_details and litellm_call_id), B190's get_standard_logging_object_payload and B880's get_end_user_id_from_request_body.
  Nothing here holds module-level state.


  batch_attribution (batch_attribution.py, all of it). optional_str(value) gives the string for a JSON string and none for anything else. is_collection_route(url_route, collection_suffix) cuts the route at the first "?", strips every trailing "/" and tests ends_with(collection_suffix); a POST to the collection is a batch create, an id-scoped route is not.
  request_tags_from_metadata(request_metadata) returns the tags for the batch spend row. First read request_metadata["tags"]: when it is a JSON array, keep only its string items with NUL characters removed, and when that gives at least one tag, return them. An array of no strings, a non-array or a missing key falls through. Then read request_metadata["user_api_key_auth_metadata"]: only when it is a JSON object, apply the same array rule to its "tags" and return the result even when it is empty (an empty list, not none). Any other case returns none.
  The NUL strip is one `replace('\0', "")` written as a private helper in this module. B3630 is its only caller at the pin, so it needs no shared owner.
  log_batch_registration_result(finished, provider, unified_object_id, model_object_id, is_batch_create) reports how the fire-and-forget write of the managed batch object ended. In Rust `finished` is the join result of the spawned task: `Result<Result<(), E>, tokio::task::JoinError>` with E: Display. A cancelled join, a join error or an inner Err logs at error level "Failed to store {provider} batch managed object with unified_object_id={unified_object_id}, batch_id={model_object_id}; {consequence}: {error}", where the consequence is "its cost will not be tracked" for a create and "its status and output file may be stale" otherwise, and the error text is the error, or "None" for a cancelled task (LiteLLM prints Python's None). An Ok(Ok(())) logs at info level "Stored {provider} batch managed object with unified_object_id={unified_object_id}, batch_id={model_object_id}".


  stream_fields (anthropic_passthrough_logging_handler.py, the message_start readers). extract_message_start_field(all_chunks, field) takes the raw chunks (each one is text or bytes) and returns the first non-empty string at message[field] of the first message_start event, or none. Decode bytes as strict UTF-8 and return a typed error on bad bytes, as LiteLLM lets UnicodeDecodeError out. Split each chunk into lines the way Python's str.splitlines does (\n, \r, \r\n, \v, \f, \x1c, \x1d, \x1e, \x85,  ,  ). Skip lines that do not start with "data:". Strip the rest of the line with Python's strip() whitespace rules and parse it as JSON; skip a line that fails to parse or is not an object. A message_start whose message lacks the field, holds a non-string or an empty string, does not stop the scan; later chunks are still read. extract_model_from_chunks asks for "model" and extract_response_id_from_chunks asks for "id".
  resolve_logged_model(call_log, request_body, all_chunks) takes request_body["model"] when it is a non-empty string, else the call log's "model" or the empty string. When that is not empty and not "unknown", return it. Otherwise return the model read from the chunks, and when there is none, the first value unchanged.
  This is the decoder for bytes from outside, so it gets a cargo-fuzz target and a corpus replay check.


  response_costing (anthropic_passthrough_logging_handler.py cost helpers). cost_relevant_speed(request_body) returns request_body["speed"] when it is a string, else none (a missing body is none). resolve_costing_model(model, call_log) returns the model when it is non-empty and not "unknown". Otherwise it tries the call log's litellm_params["model"] (same two tests), then litellm_params["metadata"]["model_group"] with one leading "passthrough/" removed, and last returns the model it was given. A missing or null litellm_params or metadata counts as empty.
  compute_response_cost(response, model, call_log) returns 0.0 when the call log's "cache_hit" is exactly true. Otherwise it reads custom_llm_provider from the call log, prefixes "{provider}/" to the model unless the model already starts with it or the provider is empty, and calls B068's completion_cost with that model, the provider, B1717's custom pricing detection on the call log's litellm_params and B253's router model id. Its errors come back as a typed error.
  cost_partial_stream_or_zero(partial_response, model, call_log) runs resolve_costing_model then compute_response_cost; any error logs at warn "Anthropic passthrough: could not cost the partial usage of an interrupted stream (model={model}): {error}" and returns 0.0.


  response_payload (base_passthrough_logging_handler.py, the two helpers the base class owns). end_user_from_request_body(request_body) returns B880's get_end_user_id_from_request_body(request_body) with no headers when the body is present and not empty, else none. It serves the Anthropic helper of the same name too; the two are the same code.
  create_response_logging_payload(response, model, kwargs, end_user, start_time, end_time, call_log) returns the kwargs, which are a typed ResponseLoggingKwargs struct (response_cost, model, the end user under litellm_params.proxy_server_request.body.user, standard_logging_object, and the passthrough request body it reads). The steps run in this order and each one's effect stays when a later one fails: cost with B068's completion_cost on the response and model; store response_cost and model on the kwargs; store response_cost in the call log's "response_cost" (the pass-through success path reads spend from there); when the kwargs carry a passthrough request body and the end_user argument (an optional string computed by the caller, not looked up here) is non-empty, set litellm_params.proxy_server_request to {"body": {"user": user}} replacing whatever was there; build B190's standard logging object with status "success" and store it; log it at debug level as indented JSON; set the response id to the call log's litellm_call_id, the response model to the model and the call log's "model" to the model. Any error in these steps logs at error level "Error creating LLM passthrough response logging payload: {error}" and returns the kwargs as they stand at that point, never an Err.


  Tests: module tests under pass_through_logging::batch_attribution::tests, ::stream_fields::tests, ::response_costing::tests and ::response_payload::tests, each test name starting with the group word the checks use (batch_, fields_, costing_, payload_). Fakes stand in for the cost service and the call log; the real B880 function runs where it is cheap.
  No route reaches this code yet, so the oracle cases are helper cases for the pure functions (is_collection_route, request_tags_from_metadata, the two extractors, resolve_costing_model, cost_relevant_speed); the umbrella B103 and the handlers that call these add the HTTP cases. The helper calls the pinned Python static functions with a stub logging object and never copies the algorithm.
