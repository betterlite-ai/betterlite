id: B984
title: Messages responses output
description: >-
  Translate Anthropic tools/tool_choice/context_management/thinking into Responses options and native Responses
  output into Anthropic messages. Carry reasoning blocks and usage through the split converter with no transport
  or credential handling.


  Implement crates/betterlite-core/src/api/messages_responses_output.rs. Use MessagesResponsesOutpuInput and MessagesResponsesOutpuResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions thinking_reasoning_options, context_management_option, tool_choice_required,
  responses_function_output, encrypted_reasoning_response under api::messages_responses_output::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.DEFAULT_MAX_TOKENS
  defaults to 4096. No environment reads occur outside betterlite-config. Test api::messages_responses_output::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::messages_responses_output::decode_messages_responses_out(bytes:
  &[u8], limits: &ApiLimits), for json.loads input item.arguments at litellm/llms/anthropic/pass_through/responses_adapters/transformation.py:668;
  json.loads input item.get('arguments', '{}') at litellm/llms/anthropic/pass_through/responses_adapters/transformation.py:708.
  Place its implementation in crates/betterlite-core/src/api/messages_responses_output.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/messages_responses_output.rs passes arbitrary
  bounded bytes to that exact decoder; api::messages_responses_output::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::MessagesResponsesOutput in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_responses_output: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_tools_to_responses_api
  (L386-L412); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_tool_choice_to_responses_api
  (L415-L426); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_context_management_to_responses_api
  (L429-L457); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_thinking_to_reasoning
  (L460-L496); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_request
  (L498-L621); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_response
  (L627-L737). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 276 owned nonblank/non-comment/non-docstring Python lines (301 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 296 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 30 wiring; 639 total within the 640-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B906 (Responses usage), B958 (Messages
  errors), B983 (Messages responses input), B1087 (Api boundaries), B962 (Messages thinking), B963 (Messages options),
  B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
