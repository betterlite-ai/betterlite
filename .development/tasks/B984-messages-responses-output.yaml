checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api|sections)::messages_responses_output::/)
      - test(/::replays_corpus$/)'
  - id: case-thinking-reasoning-options
    why: the thinking-reasoning-options behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_output::tests::thinking_reasoning_options($|::)/)'
  - id: case-context-management-option
    why: the context-management-option behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_output::tests::context_management_option($|::)/)'
  - id: case-tool-choice-required
    why: the tool-choice-required behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_output::tests::tool_choice_required($|::)/)'
  - id: case-responses-function-output
    why: the responses-function-output behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_output::tests::responses_function_output($|::)/)'
  - id: case-encrypted-reasoning-response
    why: the encrypted-reasoning-response behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_output::tests::encrypted_reasoning_response($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::messages_responses_output::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/messages-responses-output-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/messages_responses_output)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/messages_responses_output.rs && grep -qF "decode_messages_responses_out"
      crates/betterlite-core/fuzz/fuzz_targets/messages_responses_output.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::messages_responses_output::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_responses_output.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_responses_output-*)"
      && grep -qE "^[[:space:]]+messages_responses_output:" tools/oracle/fuzz/corpus/helper_case/messages_responses_output-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-responses-output)"
