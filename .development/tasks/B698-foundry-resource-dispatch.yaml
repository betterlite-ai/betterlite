checks:
  optional:
  - mutants
  commands:
  - id: case-image-edit
    why: Parameterize B555 Flux and MAI edits, preserving their different image fields and errors.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_image_edit$/)'
  - id: case-rerank
    why: Dispatch B556 rerank through the leaf with original ranking indices and usage.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_rerank$/)'
  - id: case-responses-decisions
    why: Parameterize B557 Responses and Decisions, including its inherited OpenAI policy and Foundry base URL.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_responses_decisions$/)'
  - id: case-vector-search
    why: Dispatch B558 Azure AI Search with its index paths and mapped query fields.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_vector_search$/)'
  - id: case-passthrough
    why: Dispatch B566 passthrough and response/logging projections; propagate the leaf unknown-route result unchanged.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_passthrough$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_resource_dispatch.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_resource_dispatch*")"
      && grep -lq 'foundry_resource_dispatch' tools/oracle/fuzz/corpus/helper_case/foundry_resource_dispatch* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_resource_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_unsupported_operation$/)'
  - id: case-image-generation
    why: Parameterize B553 Flux/DALL-E/GPT model selection and B554 MAI body/reply projection with fixture transport.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_image_generation$/)'
  - id: case-messages-count
    why: Parameterize B564 native Messages and B565 token count with separate native Anthropic endpoints.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_messages_count$/)'
