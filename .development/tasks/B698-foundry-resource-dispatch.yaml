pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_resource_dispatch in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/foundry_resource_dispatch.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_resource_dispatch.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Foundry image edit version defaults differ by Flux and MAI and must reach the leaf unchanged.
