  commands:
  - id: case-flux-image
    why: The flux-image behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_flux_image$/)'
  - id: case-mai-image
    why: The mai-image behavior is missing or differs from its pinned fixture.
