  - id: case-passthrough
    why: The passthrough behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_cases::case_[0-9]+_passthrough$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_resource_dispatch.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_resource_dispatch*")"
      && grep -lq 'foundry_resource_dispatch' tools/oracle/fuzz/corpus/helper_case/foundry_resource_dispatch* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_resource_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::foundry_resource_dispatch_unsupported_operation$/)'
