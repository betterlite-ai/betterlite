deviations: []
out_of_scope:
  - "The route logic, signing and checks: B3620, B3621 and B3625. The shared state: B8640."
pitfalls:
  - "`/comprehendmedical` and `/transcribe` take POST only; a GET there is axum's 405, not the fallback's 404."
  - "`/azure_speech/` with the trailing slash is its own route; register it, or an empty endpoint request falls to the fallback."
  - "The signed body travels in request state, so the extension the route sets must survive every layer this mount adds; add no layer that rebuilds the request."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
