id: B8607
title: Mount the Bedrock, Comprehend Medical and speech pass-through routes
description: >-
  B8640 builds the shared pass-through state and calls `aws_speech::mount` with a stub body. This task fills crates/betterlite-server/src/app/pass_through/routes/aws_speech.rs (and its folder for tests) so the AWS signed routes of B3621 and the speech routes of B3625 answer through the booted proxy. It takes over their HTTP oracle cases, which could not pass at their own gates.
  Everything comes from B8640's `PassThroughState`. Read B3621's and B3625's merged deps and fill each field from it: the general_settings map, the environment and secret readers (B198 and B8500), B594's AWS credential resolver and B595's SigV4 signer, the handler Arc for B3615's create_pass_through_route, and for /bedrock the router and the passthrough processor that B3620 calls for every non agent-runtime endpoint. When a field has no source there, stop and report.

  `mount(router, ps)` merges, inside the auth layers:
  - B3621's router: `/bedrock/{*endpoint}` for GET, POST, PUT, DELETE and PATCH, and `/comprehendmedical/{operation}` and `/comprehendmedical` for POST only;
  - B3625's router: `/azure_speech/{*endpoint}` and `/azure_speech/` for the five methods, and `/transcribe/{operation}` and `/transcribe` for POST only.
  A bare `/azure_speech` without the slash is not registered (B3625's deviation), so it reaches the configured endpoint fallback and answers 404 unless a configured endpoint owns it.

  Oracle cases. Take over B3621's 9 cases and B3625's 13 cases at their paths; do not move or rename the files. The Transcribe cases stop at a 400 because the upstream host is fixed; the Azure Speech forward cases use the mock upstream as B3625 describes.
scope:
  paths:
    - crates/betterlite-server/src/app/pass_through/routes/aws_speech.rs
    - crates/betterlite-server/src/app/pass_through/routes/aws_speech/**
    - tools/oracle/cases/server/bedrock-comprehend-routes/**
    - tools/oracle/cases/server/passthrough-speech-routes/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L1254-L1480
    why: The /bedrock and /comprehendmedical registrations and their methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L1525-L1771
    why: The /azure_speech and /transcribe registrations and their methods.
dod:
  - text: Every path of B3621 and B3625 reaches its handler through the merged app with exactly its listed methods, and other methods answer 405.
    proof: [registration-tests, oracle]
  - text: The Bedrock agent-runtime gate, the Comprehend Medical checks, the Azure Speech guard and forward and the Transcribe checks answer through the booted proxy as LiteLLM does.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: registration-tests
      why: an AWS or speech path is missing, takes the wrong methods, or collides with another family
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::pass_through::routes::aws_speech::tests::registration(::|$)/)'
oracle_cases:
