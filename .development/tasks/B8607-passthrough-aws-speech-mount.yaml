id: B8607
title: Mount the Bedrock, Comprehend Medical and speech pass-through routes
description: >-
  B8640 builds the shared pass-through state and calls `aws_speech::mount` with a stub body. This task fills crates/betterlite-server/src/app/pass_through/routes/aws_speech.rs (and its folder for tests) so the AWS signed routes of B3621 answer through the booted proxy. It takes over their HTTP oracle cases, which could not pass at their own gate. The speech routes of B3625 are later work: B3625 mounts its own /azure_speech and /transcribe routes in this file and takes its 13 cases when it lands; until then those paths reach the configured endpoint fallback, as a bare /azure_speech already does.
  Everything comes from B8640's `PassThroughState`. Read B3621's merged deps and fill each field from it: the general_settings map, the environment and secret readers (B198 and B8500), B10175's AWS credential chain (a clone of `state.shared.aws_credentials`, B594's resolution behind it) and B595's SigV4 signer, the handler Arc for B3615's create_pass_through_route, and for /bedrock the router and the passthrough processor that B3620 calls for every non agent-runtime endpoint. When a field has no source there, stop and report.

  `mount(router, ps)` merges, inside the auth layers:
  - B3621's router: `/bedrock/{*endpoint}` for GET, POST, PUT, DELETE and PATCH, and `/comprehendmedical/{operation}` and `/comprehendmedical` for POST only;

  Oracle cases. Take over B3621's 9 cases at their paths; do not move or rename the files.
scope:
  paths:
    - crates/betterlite-server/src/app/pass_through/routes/aws_speech.rs
    - crates/betterlite-server/src/app/pass_through/routes/aws_speech/**
    - tools/oracle/cases/server/bedrock-comprehend-routes/**
    - tools/oracle/cases/server/passthrough-speech-routes/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L1254-L1480
    why: The /bedrock and /comprehendmedical registrations and their methods.
dod:
  - text: Every path of B3621 reaches its handler through the merged app with exactly its listed methods, and other methods answer 405.
    proof: [registration-tests, oracle]
  - text: The Bedrock agent-runtime gate and the Comprehend Medical checks answer through the booted proxy as LiteLLM does.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: registration-tests
      why: an AWS path is missing, takes the wrong methods, or collides with another family
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::pass_through::routes::aws_speech::tests::registration(::|$)/)'
oracle_cases:
  - tools/oracle/cases/server/bedrock-comprehend-routes/agent-runtime-disabled-bool.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/agent-runtime-disabled-string.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-unsupported-operation.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-no-region.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-body-not-object.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-stream-member.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-sdk-missing-target.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-sdk-wrong-prefix.yaml
  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-sdk-empty-operation.yaml
deviations: []
out_of_scope:
  - "The route logic, signing and checks: B3620 and B3621; the speech routes and their mount: B3625. The shared state: B8640."
pitfalls:
  - "`/comprehendmedical` takes POST only; a GET there is axum's 405, not the fallback's 404."
  - "The signed body travels in request state, so the extension the route sets must survive every layer this mount adds; add no layer that rebuilds the request."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
