  commands:
  - id: case-invoke-stream-url
    why: POST supplied api_base unchanged with supplied headers and data, stream=not fake_stream. Sync Invoke uses
      signed_json_body whenever non-None including empty bytes, otherwise data; async uses data only. No URL/model
      path or retries added here. Default Invoke clients copy ssl_verify from logging_obj.litellm_params only when
      truthy; explicitFalse/empty is omitted, so default TLS policy applies. A supplied client bypasses this client-construction
      policy.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_http_stream_cases::case_[0-9]+_invoke_stream_url$/)'
  - id: case-http-error-before-frame
    why: All helpers require status exactly200 (201/204 also fail). Invoke sync/async status failures ->B682 BedrockError
      with original status, headers, response and error_response_text (unread body ->reason_phrase, no read). Existing
      BedrockError rethrows; HTTPStatusError maps its response likewise; TimeoutException ->408 Timeout error occurred.;
