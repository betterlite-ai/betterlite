  - id: case-converse-stream-headers
    why: Sync Converse uses default _get_httpx_client without SSL kwargs. Non200 explicitly response.read then str(bytes)
      as error message, retaining bytes-repr escapes, original status/headers/response; no Invoke generic/timeout
      catch applies here. Nonfake path constructs B608 base decoder with model/json_mode and B609 iter_bytes over
