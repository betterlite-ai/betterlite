id: B691
title: Bedrock Invoke and Converse streaming HTTP helpers
description: >-
  Port raw Invoke make_call/make_sync_call and Converse make_sync_call as reusable asynchronous HTTP opening/stream
  ownership helpers. Reuse B599 AWS frame decoding and B173 pooling; the Converse/Invoke caller injects its response
  projection.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_handler.py:
  make_sync_call L26-L85. litellm/llms/bedrock/chat/invoke_handler.py: make_call L185-L271; make_sync_call L274-L360.


  Implement crates/betterlite-bedrock/src/bedrock_http_stream.rs with adjacent tests under bedrock_http_stream/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation bedrock_http_stream in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_http_stream_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): invoke_stream_url, http_error_before_frame, converse_stream_headers, cancel_body. Each case exercises its
  named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_http_stream* using HelperCase: kind:
  helper and the externally tagged bedrock_http_stream variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_http_stream that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 216 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 81 behavior/config-test lines,
  71 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 432 planned, 450 maximum changed lines.
