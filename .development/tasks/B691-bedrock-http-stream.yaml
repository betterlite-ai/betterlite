id: B691
title: Bedrock Invoke and Converse streaming HTTP helpers
description: >-
  Implement the three raw Bedrock stream-opening helpers over B173 pooled transport. B609 owns provider stream selection/iteration,
  B608 owns the Converse projection, and B607 owns buffered fake-stream response conversion. Keep the distinct sync
  Converse error-body behavior and the Invoke/async exception mappings while sharing the native transport implementation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_handler.py:
  make_sync_call L26-L85. litellm/llms/bedrock/chat/invoke_handler.py: make_call L185-L271; make_sync_call L274-L360.


  Named case contracts: invoke_stream_url: POST supplied api_base unchanged with supplied headers and data, stream=not
  fake_stream. Sync Invoke uses signed_json_body whenever non-None including empty bytes, otherwise data; async
  uses data only. No URL/model path or retries added here. Default Invoke clients copy ssl_verify from logging_obj.litellm_params
  only when truthy; explicitFalse/empty is omitted, so default TLS policy applies. A supplied client bypasses this
  client-construction policy. http_error_before_frame: All helpers require status exactly200 (201/204 also fail).
  Invoke sync/async status failures ->B682 BedrockError with original status, headers, response and error_response_text
  (unread body ->reason_phrase, no read). Existing BedrockError rethrows; HTTPStatusError maps its response likewise;
  TimeoutException ->408 Timeout error occurred.; any other opening/conversion/logging exception ->500 str(error).
  Errors raised later by returned iterator are outside this catch. converse_stream_headers: Sync Converse uses default
  _get_httpx_client without SSL kwargs. Non200 explicitly response.read then str(bytes) as error message, retaining
  bytes-repr escapes, original status/headers/response; no Invoke generic/timeout catch applies here. Nonfake path
  constructs B608 base decoder with model/json_mode and B609 iter_bytes over response.iter_bytes(chunk_size=stream_chunk_size),
  forwarding response headers to tally and returning them unchanged. fake_stream_projection: For every helper fake_stream
  truthy sends stream=false, then B607 _transform_response with fresh ModelResponse, stream=true, optional_params={},
  api_key empty, originaldata/messages and globalencoding. json_mode is not passed to this buffered converter; it
  is supplied only to B609 MockResponseIterator afterwards. This can differ from ordinary buffered conversion and
  its synthetic-tool finish override. Nonfake Invoke selects B609 _stream_decoder with sync flag and provider. post_call_before_consumption:
  After opening and constructing iterator, log B249 post_call with input=messages,api_key empty, original_response
  literal first stream response received, complete_input_dict=data. Log occurs before the consumer reads a first
  frame, including empty/invalid streams. Fake conversion may already log its buffered response first; preserve
  both calls. Return iterator and original response headers.


  Write standalone Rust test bedrock_http_stream_body_lifetime: returned stream retains pooled client/response until
  EOF, consumer cancellation or error, then drops/closes it without retry. This is the native B173/B005 resource
  invariant, not a Python helper oracle case.


  Write standalone Rust test bedrock_http_stream_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test bedrock_http_stream_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B600. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/bedrock_http_stream.rs with adjacent tests under bedrock_http_stream/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_http_stream_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): invoke_stream_url, http_error_before_frame, converse_stream_headers, fake_stream_projection, post_call_before_consumption.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_http_stream* using HelperCase: kind:
  helper and the externally tagged bedrock_http_stream variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_http_stream that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 216 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 255 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.
