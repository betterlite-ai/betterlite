  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/bedrock_http_stream.rs
  - crates/betterlite-bedrock/src/bedrock_http_stream/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_http_stream.rs
  - tools/oracle/src/helpers/bedrock_http_stream/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_http_stream.py
  - tools/oracle/cases/helpers/providers/bedrock-http-stream/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_http_stream*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/converse_handler.py#L26-L85
  why: Own make_sync_call. Other functions in this file remain with the owners listed below.
