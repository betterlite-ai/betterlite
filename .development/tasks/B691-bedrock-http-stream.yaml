      unchanged.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_http_stream_cases::case_[0-9]+_converse_stream_headers$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_http_stream.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_http_stream*")"
      && grep -lq 'bedrock_http_stream' tools/oracle/fuzz/corpus/helper_case/bedrock_http_stream* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_http_stream$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-fake-stream-projection
    why: For every helper fake_stream truthy sends stream=false, then B607 _transform_response with fresh ModelResponse,
      stream=true, optional_params={}, api_key empty, originaldata/messages and globalencoding. json_mode is not
      passed to this buffered converter; it is supplied only to B609 MockResponseIterator afterwards. This can differ
