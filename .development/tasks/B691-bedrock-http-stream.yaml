  why: Own make_call, make_sync_call. Other functions in this file remain with the owners listed below.
dod:
- text: 'invoke stream url: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-http-stream/invoke-stream-url.yaml.'
  proof:
  - case-invoke-stream-url
  - oracle
  - helper-python
- text: >-
    http error before frame: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-http-stream/http-error-before-frame.yaml.
  proof:
  - case-http-error-before-frame
  - oracle
  - helper-python
- text: >-
    converse stream headers: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-http-stream/converse-stream-headers.yaml.
  proof:
  - case-converse-stream-headers
  - oracle
  - helper-python
- text: 'cancel body: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-http-stream/cancel-body.yaml.'
  proof:
  - case-cancel-body
  - oracle
  - helper-python
- text: New bedrock_http_stream seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-invoke-stream-url
    why: The invoke-stream-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_http_stream_cases::case_[0-9]+_invoke_stream_url$/)'
  - id: case-http-error-before-frame
    why: The http-error-before-frame behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_http_stream_cases::case_[0-9]+_http_error_before_frame$/)'
  - id: case-converse-stream-headers
    why: The converse-stream-headers behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_http_stream_cases::case_[0-9]+_converse_stream_headers$/)'
  - id: case-cancel-body
    why: The cancel-body behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_http_stream_cases::case_[0-9]+_cancel_body$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_http_stream.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_http_stream*")"
      && grep -lq 'bedrock_http_stream' tools/oracle/fuzz/corpus/helper_case/bedrock_http_stream* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_http_stream$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
