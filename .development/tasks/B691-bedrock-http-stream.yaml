pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_http_stream in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/http_stream.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_http_stream.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The post-call message says first stream response received before any event is consumed; do not delay it until
  the first parsed chunk.
- Sync Converse reads an error body and uses bytes repr, while Invoke uses unread-response reason_phrase without
  reading.
