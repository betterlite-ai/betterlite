    why: the cache invalidation that every mutation calls.

dod:
  - text: reload reuses an unchanged record only when updated_at is equal and a slot exists or the endpoints are resolved, otherwise rebuilds with env_vars_are_encrypted true.
    proof: [reload-stage-tests]
  - text: A row that fails to build or register is logged and skipped, and the reload still swaps in the rest.
    proof: [reload-stage-tests]
  - text: Short prefixes are assigned over the full staged set and a previous short_prefix is kept.
    proof: [reload-stage-tests]
  - text: Dropped ids lose their discovery state, changed ids invalidate caches, and the swap happens in one write-lock section.
    proof: [reload-swap-tests]
  - text: The shadowed and capturing warnings log once per changed set and reset when the set changes.
    proof: [reload-warn-tests]
  - text: add ignores non-eligible approval status and already-registered ids, and update evicts on a non-eligible status.
    proof: [reload-mutation-tests]
  - text: update keeps the previous short_prefix and carries OAuth endpoints forward, and remove falls back to server_name and warns when missing.
    proof: [reload-mutation-tests]
  - text: initialize_tool_owners maps the original and listed name of every tool to its server, skips slot and user-token servers, and logs and skips a server whose tool list fails.
    proof: [reload-mutation-tests]
  - text: cleanup removes OpenAPI tools by prefix and the owned mapping rows, and nothing else.
    proof: [reload-cleanup-tests]

checks:
  optional: []
  commands:
    - id: reload-stage-tests
      why: the reuse rule, the bad row skip or the prefix assignment is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry_reload::tests::stage_/)'
    - id: reload-swap-tests
      why: dropped ids, cache invalidation or the swap is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry_reload::tests::swap_/)'
    - id: reload-warn-tests
      why: a warning repeats, is missing or has the wrong text
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry_reload::tests::warn_/)'
    - id: reload-mutation-tests
      why: add, update or remove differs from the Python
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry_reload::tests::mutation_/)'
    - id: reload-cleanup-tests
      why: cleanup leaves stale tools or mapping rows, or removes too many
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry_reload::tests::cleanup_/)'

oracle_cases: []

deviations:
  - what: The database read is a ServerRows trait and caches are cleared through a CacheInvalidator trait, not a prisma client and imported singletons.
    why: the repo wires dependencies through constructors and has no module-level state.
  - what: The warned sets are RegistryMutator fields, and the swap is one RwLock write section.
    why: LiteLLM keeps them on the manager object and assigns a dict; Rust needs an explicit lock.

out_of_scope:
  - "Building a record from a row: B6763. Loading config servers: B6764."
  - "The registry type and its reads: B4731. Allowed-server unions: B6591."
  - "Health checks and toolset caches: B6592."
  - "The table repository (MCPServerRepository) and approval filter query: B4711."
  - "The management routes that call add, update and remove: the admin route tasks."

pitfalls:
  - "Rows in reload still carry encrypted env vars, but records handed to add and update are already decrypted; pass env_vars_are_encrypted true only in reload."
  - "Never hold the write lock while building records or registering tools; stage first, then swap."
  - "A reload that skips a bad row must still keep the remaining rows, so no error from stage one or two escapes."
  - "Compare previous and new records by value (PartialEq) when deciding which ids to invalidate, not by identity."
  - "The shadow and capture warning state is stored even when the set is empty, so a later reappearance warns again."
  - "update on an id that is not registered does nothing, it does not add the server."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
