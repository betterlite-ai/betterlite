id: B6765
title: MCP registry reload from the database, add, update, remove
description: >-
  Build the mutations of the database half of the MCP server registry: the full reload from the database table, and add, update and remove for one server. In LiteLLM these are `reload_servers_from_database`, `add_server`, `update_server`, `remove_server` and `_cleanup_server_tool_routing_artifacts` in mcp_server_manager.py. They write into `ServerRegistry::db_servers` (B4731) behind the SharedRegistry alias of B4731, and build records with the ServerBuilder of B6763.


  Code goes in the new betterlite-mcp module registry_reload: crates/betterlite-mcp/src/registry_reload.rs, registry_reload/** and tests beside each file. A RegistryMutator struct takes in its constructor: SharedRegistry (B4731), ServerBuilder (B6763), DiscoverySlots (B6762), a ServerRows trait (find_active() -> Vec<LiteLLM_MCPServerTable>, implemented by B4711's MCPServerRepository, it returns the rows whose approval_status is NULL, "active" or "approved"), an OpenApiToolSink (from B6764, with unregister_prefix), the tool name mapping owner from B4682/B4731 the InstructionsCache trait from B6764 (clear() is called at the start of a reload) and a CacheInvalidator trait (invalidate_server(server_id), implemented by B8614 over the prompt, resource and template discovery caches and the OAuth metadata cache).


  Items to build, as methods of RegistryMutator.

  1. `reload` (`reload_servers_from_database`). Clear the instructions caches. Load rows from ServerRows. Log "Found N MCP servers in database" at info. Stage one, per row: if the previous registry has the same server_id with equal updated_at (both present) and (a discovery slot exists for the id or not endpoints_unresolved(existing)), reuse the existing record. Otherwise run warn_on_server_name_fields, warn_if_newly_blocked_stdio, build with env_vars_are_encrypted true (rows come straight from the database), copy short_prefix from the previous record when it has one, and carry_forward_endpoints (B6760). A failing row is logged with its server id and alias and skipped, and never stops the reload. Stage two, over the staged set: assign_unique_short_prefix against the full staged set, then register OpenAPI tools without rebuilding the mapping, skipping the server (and logging) on error. Then, for ids that were in the previous registry and are missing now, drop the discovery state; for every id whose record changed (previous != new, needs PartialEq on MCPServer from B6590) invalidate the caches; swap db_servers in one write-lock section; warn_on_shared_identifier_prefixes; reconcile the discovery slots and prime discovery for the new records; rebuild the tool name mapping only when some server has a spec_path. Finish with the two warnings of item 4 and DCR hydration for config servers (B6764 hydrate_dcr_clients).

  2. `add` (`add_server`), input: a table record that is already env-decrypted. Return without doing anything when approval_status is not None, "active" or "approved". When the id is not in the registry: warn_if_newly_blocked_stdio with no previous, build with env_vars_are_encrypted false, assign_unique_short_prefix, invalidate caches, insert, register OpenAPI tools (with mapping rebuild), prime discovery for the one record. A server that is already registered is left untouched. Errors are logged at debug and returned.

  3. `update` (`update_server`). For a non-eligible approval_status evict the entry by server_id, else by server_name, run cleanup (item 5) and drop the discovery state, then return. Otherwise, when the id is registered: build with env_vars_are_encrypted false, keep the previous short_prefix when the new one is empty, carry_forward_endpoints, assign_unique_short_prefix, invalidate caches, replace, register OpenAPI tools, prime discovery. An id that is not registered is ignored. `remove` (`remove_server`): pop by server_id, else by server_name; if found log at debug, run cleanup and drop the discovery state; if not found log a warning "Server ID <id> not found in registry".

  4. Reload warnings, with state held in RegistryMutator fields (warned_shadowed and warned_capturing, each a BTreeSet<String>): shadowed ids are the config server ids that are also in the new db registry, and the capturing ids come from config_ids_capturing_db_identifiers (B6764). Log the warning (exact text at L6879-6896) only when the set is non-empty and differs from the stored set, then store the new set, also when it is empty.

  5. `cleanup_tool_routing_artifacts` (`_cleanup_server_tool_routing_artifacts`): invalidate the caches for the id; when the server has a spec_path and its normalized prefix is non-empty, unregister every tool whose key starts with prefix + the tool prefix separator (MCP_TOOL_PREFIX_SEPARATOR); delete every tool name mapping entry whose normalized mapped server is in the owned set (normalized known prefixes of the server plus its name). `owned_mapping_values` (`_owned_mapping_values`) builds that set. The other methods next to it in Python (server_exposes_tool, known_prefix_to_server, server_owning_tool_name_prefix) are B4731's.

  Tests use fakes for every trait and a SharedRegistry in a tokio::test. Cover: reuse of an unchanged row, skip of a bad row, prefix dedupe across the set, dropped ids, the shadow and capture warnings firing once per change, add of an unapproved record, update evicting, remove by name, and cleanup of OpenAPI tools and mapping rows.

  6. `initialize_tool_owners` (`initialize_tool_name_to_mcp_server_name_mapping` and its private async part, L6671-L6714). It fills the `tool_name_to_mcp_server_name_mapping` field, here the ToolOwners map of B4731. For each registry server in order, skip it when it has a discovery slot (B6762) or needs a user OAuth token, then list its tools through a ToolLister trait the caller supplies. An upstream auth error is logged at debug and skipped, any other error is logged at warning and skipped. For each tool, strip_known_server_prefix (B4682) gives the original name, and both the original and the listed name map to server.name. reload calls it only when OpenAPI tools were registered (L6869) and add calls it after registering them (L3275). LiteLLM runs it as a background task, so spawn it and do not wait. Tests cover a skipped slot server, a skipped token server and a failing server not stopping the rest.

