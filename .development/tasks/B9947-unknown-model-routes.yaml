dod:
- text: POST /chat/completions with an unknown model answers LiteLLM's 400 body with the "/chat/completions" text.
  proof: [chat-unknown-model, oracle]
- text: POST /completions with an unknown model answers LiteLLM's 400 body with the "/completions" text.
  proof: [completions-unknown-model, oracle]
- text: POST /embeddings with an unknown model answers LiteLLM's 400 body with the "/embeddings" text.
  proof: [embeddings-unknown-model, oracle]
- text: >-
    Each route asks the slot's read-through once with the request's model, picks again only when it answers true, and
    never asks it for a request without a model.
  proof: [chat-unknown-model, completions-unknown-model, embeddings-unknown-model]
- text: The other chat, completions, embeddings and server tests still pass.
  proof: [regressions]
checks:
  optional: []
  commands:
  - id: chat-unknown-model
    why: The chat route keeps its own text, skips the read-through or retries a request without a model.
    run: >-
      cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::chat::tests::unknown_model_/)'
  - id: completions-unknown-model
    why: The completions route keeps its own text, drops provider_specific_fields or skips the read-through.
    run: >-
      cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::completions::tests::unknown_model_/)'
  - id: embeddings-unknown-model
    why: The embeddings route keeps its own text, drops provider_specific_fields or skips the read-through.
    run: >-
      cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::embeddings::tests::unknown_model_/)'
  - id: regressions
    why: The slot, the retry call or the new render broke another chat, completions, embeddings or server test.
    run: >-
      cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::chat::tests::unknown_model_/)'
      && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::chat::/) | test(/^routes::completions::/) | test(/^routes::embeddings::/) | test(/^server::/)'
oracle_cases:
- tools/oracle/cases/chat/unknown-model.yaml
- tools/oracle/cases/auth/auth-model-patterns/generic-model-denial.yaml
- tools/oracle/cases/completions/unknown-model.yaml
- tools/oracle/cases/embeddings/unknown-model.yaml
deviations: []
out_of_scope:
- "ProxyModelNotFoundError and route_endpoint: B9964. route_with_read_through and ModelReadThrough: B9949."
- "The production models read-through: B9948. Filling this slot from Shared: B8610."
- "Moving these routes from the executor's deployment list onto the router (state.shared.router), and with it the rest of _route_request_single_attempt on them (team model names, wildcards, pass_through_all_models, default_deployment, deployment_names): no task owns it."
- "/v1/messages: B9800 raises the error through the same retry. The other model routes raise it in their own tasks."
pitfalls:
- 'The retry cannot find a model yet: these routes pick from the executor''s config list (ChatExecutor.deployments), and B9948''s read-through adds rows to B8611''s router. The second pick misses again, so return its not-found as it is and add no special case.'
- 'Give route_with_read_through the model as an Option from the request, never the "None" text the message uses, or a request without a model reaches the read-through.'
- 'routes/chat/tests.rs answers_failures_in_litellm_shape already expects provider_specific_fields for the unknown_model case, and error_normalization_tests_behavior sends a model that looks like a key; both must keep passing with the new text.'
- 'Write no message text in the routes: the detail and the hint come from B9964''s ProxyModelNotFoundError.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
