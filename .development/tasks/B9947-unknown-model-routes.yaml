  - crates/betterlite-server/src/state/model_read_through.rs
  - crates/betterlite-server/src/routes/chat.rs
  - crates/betterlite-server/src/routes/chat/tests.rs
  - crates/betterlite-server/src/routes/completions.rs
  - crates/betterlite-server/src/routes/completions/error.rs
  - crates/betterlite-server/src/routes/completions/tests.rs
  - crates/betterlite-server/src/routes/embeddings.rs
  - crates/betterlite-server/src/routes/embeddings/tests.rs
  - crates/betterlite-server/src/server.rs
  - tools/oracle/cases/chat/unknown-model.yaml
  - tools/oracle/cases/auth/auth-model-patterns/generic-model-denial.yaml
  - tools/oracle/cases/completions/unknown-model.yaml
