id: B9947
title: The chat, completions and embeddings routes answer an unknown model with LiteLLM's not-found error
description: >-
  Three routes on main answer a model with no deployment in their own words, with no read-through:
  /chat/completions (crates/betterlite-server/src/routes/chat.rs L163-L169, ChatError::UnknownModel, "no model_list
  entry is named <model>"), /completions (routes/completions.rs L188-L191 and completions/error.rs L32-L37, "no
  model_list entry serves the model <model>") and /embeddings (routes/embeddings.rs L143-L146 and L197-L201,
  EmbeddingError::UnknownModel). They are every route on main that picks a deployment by model name: `git grep -n
  'pick_deployment(' -- crates/betterlite-server/src/routes` finds these three calls and no other, and the other model
  routes (responses, images, audio, rerank, moderations, messages) are still stub files. LiteLLM's route_request raises
  ProxyModelNotFoundError when no deployment matches (route_llm_request.py L720-L725), retries once after the model
  registry read-through when the error allows it (L449-L466), and the handler answers 400 with "<route>: Invalid
  model name passed in model=<model>. Call `/v1/models` to view available models for your key.". This task makes all
  three routes raise B9964's ProxyModelNotFoundError through B9949's retry.


  The read-through slot. ServerState gets a `model_read_through` slot (crates/betterlite-server/src/state/model_read_through.rs).
  The plan commit already declares it in state.rs and builds it with Slot::new(config, &shared) over a unit Slot.
  Slot holds `pub read_through: Option<Arc<dyn ModelReadThrough>>` (B9949's trait), and Slot::new sets None, since
  Shared on main carries no read-through. B8610 later fills it from Shared with the instance B9948 builds.


  Each route. Where the route now calls pick_deployment, call B9949's `route_with_read_through(model,
  state.model_read_through.read_through.as_deref(), attempt)`. The attempt runs pick_deployment on the executor and
  turns a miss into `ProxyModelNotFoundError::new(route, model_text, true)`. The route is B9964's route_endpoint for the
  route type: "acompletion" gives "/chat/completions", "atext_completion" gives "/completions" and "aembedding" gives
  "/embeddings", whatever path the request came in on (/v1/..., /..., /engines/{model}/..., /openai/deployments/{model}/...).
  model_text is the model the route already resolves (the path model, else the body model), or "None" when there is
  neither, as main writes it today and as LiteLLM's f-string writes its None. The model given to
  route_with_read_through is that same model as an Option, so a request without one never reaches the read-through
  (LiteLLM requires a non-empty str, L450-L452).


  The answer. A ProxyModelNotFoundError that comes back renders the way LiteLLM's
  proxy_exception_from_http_exception renders an HTTPException with a dict detail: status 400, error.message the
  detail's error text, error.type "invalid_request_error", error.param null, error.code "400" and
  error.provider_specific_fields {"error": <the same text>}, with the call id header and body field each route already
  adds to its errors. The chat route renders through server.rs (plain_failure sets no provider_specific_fields today,
  so give it the field or add a sibling next to it), completions adds the field to its FailureAnswer render, and
  embeddings renders through its own route_error path. The message still goes through each route's redactor, as the
  old one did. Log the failure where the route logs a pick failure today.


  DispatchError::MissingDeployment stays: betterlite-core raises it when its own lookup by deployment id fails after
  the pick (crates/betterlite-core/src/dispatch.rs L147-L154), and no client model reaches it. Completions and
  embeddings stop building it for a pick miss.


  Tests. Each route's tests.rs gets tests named `unknown_model_`: the 400 body with LiteLLM's text on the /v1 path
  and on an engines path; a recording ModelReadThrough set in the slot that answers true is asked once with the
  request's model, the pick runs a second time and the second not-found comes back; one that answers false gets the
  first error back after one call; a request without a model never calls it and names "None"; a model that looks like
  an API key is still redacted in the message. HTTP oracle cases: chat/unknown-model.yaml and
  auth/auth-model-patterns/generic-model-denial.yaml ignore /error/message and /error/provider_specific_fields/error
  today because betterlite wrote its own text; drop both ignores. Add completions/unknown-model.yaml (POST
  /v1/completions) and embeddings/unknown-model.yaml (POST /v1/embeddings), each with one model_list entry, a request
  for another model, the master key, no upstream reply, and content-type compared with no ignores.
