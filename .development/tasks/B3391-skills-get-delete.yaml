id: B3391
title: Skill lookup and deletion with shared caller context
description: >-
  Build the get and delete native operations for betterlite-core::api::skills, with shared
  helper functions for caller context extraction and lazy-initialized hosted-handler access.
  Implement both sync (get_skill, delete_skill) and async (aget_skill, adelete_skill) entry
  points that share implementation via sync-to-async bridging. Reuse B3390's validate_environment,
  request transformations, and wire-format contracts (Skill, DeleteSkillResponse). Use B567's
  AnthropicModelInfo.get_api_base for credential resolution and B247's Logging.update_from_kwargs
  for pre-call logging. Route provider-specific calls through B185/B186's exception_type mapping
  and use B198's request_timeout constant (default 6000 seconds) when timeout is None or 0.

  _get_user_api_key_auth_from_kwargs extracts principal identity: check metadata.user_api_key_auth
  first (accepting any non-None value), then litellm_metadata.user_api_key_auth, returning None
  if neither key exists. _get_litellm_skills_handler lazily initializes and caches the hosted-
  handler transformation class. Both get and delete operations accept custom_llm_provider (default
  "anthropic"), extra_headers, extra_query (accepted but not forwarded), and optional per-call
  timeout. When custom_llm_provider="litellm_proxy", route to the hosted handler; otherwise select
  the provider config, validate environment, transform request, and dispatch via HTTP handler.

  The fallback Anthropic API base is "https://api.anthropic.com/v1", which already contains /v1;
  preserve this when building URLs so get_complete_url concatenation does not insert a duplicate.

scope:
  paths:
    - crates/betterlite-core/src/api/skills/get_delete.rs
    - crates/betterlite-core/src/api/skills/get_delete/**
  lint_tables: false

