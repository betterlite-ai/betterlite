  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/main.py#L504-L608"
    why: "get_skill sync entry point routing to hosted or external provider, with default provider
      selection, logging, and timeout handling."

  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/main.py#L611-L665"
    why: "adelete_skill async entry point with context-preserving executor bridge."

  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/main.py#L668-L772"
