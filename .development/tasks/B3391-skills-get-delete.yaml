  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/main.py#L59-L68"
    why: "_get_litellm_skills_handler lazily initializes the hosted-handler transformation class
