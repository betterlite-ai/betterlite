id: B833
title: Model PTU pricing validation and projection
description: >-
  Implement PtuModelPricing projections over B068 PTU feature-flag input, B013 catalog data and explicit
  deployment model_info. LITELLM_ENABLE_PTU_COST_ATTRIBUTION defaults false and is enabled only by literal
  true. Preserve fixed-cost versus per-token conflict checks, explicit clears, zeroed pricing and catalog
  lookup precedence. Costs remain Decimal through database writes.


  Build the production model_ptu_pricing module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  _is_nonzero_rate (L812-L813; 2 source lines), _is_nonzero_price (L816-L819; 4 source lines), _is_zero_price
  (L822-L827; 6 source lines), _raise_if_ptu_deployment_is_priced (L830-L855; 25 source lines), _ptu_zeroed_pricing
  (L858-L895; 35 source lines), _ptu_pricing_delta (L898-L928; 29 source lines), _ptu_priced_deployment
  (L931-L950; 18 source lines), _cost_map_entry (L953-L960; 8 source lines), _loaded_catalog_entry (L966-L972;
  7 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the model_ptu_pricing operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a model-ptu-pricing-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 134 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  134 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 374 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
