id: B334
title: Tier pools, request overrides and context placement
description: Turn B328/B329 tier outcomes into bounded candidate pools using B016/B323. Implement per-tier
  parameter forwarding, logical model versus raw response model naming and context-window/output-cap placement
  from B013. Keep a typed placement result that later modality/health gates can restrict. Share B324's
  atomic pin primitive where selecting a member within a tier needs affinity; do not implement the session
  replay policy here. Use the existing Rust crate boundaries from B004 and B008; integrate through the
  server when the provider dispatcher or callbacks live in another core crate. This task's source slices
  are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target
  and committed corpus for every newly accepted config form; unsupported keys still fail by full path.
  Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle cases are
  budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/complexity-placement/**
  - tools/oracle/src/router_probes/complexity_placement/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/complexity_placement.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2791-L2931
  why: Tier fallback and pool choice.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L3226-L3421
  why: Output ceilings, context facts and placement.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L13163-L13281
  why: Tier parameter pinning and carrier cleanup.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the complexity_placement prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(complexity_placement)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/complexity-placement/tier-pool-model-choice.yaml
- tools/oracle/cases/routing/complexity-placement/missing-tier-fallback.yaml
- tools/oracle/cases/routing/complexity-placement/tier-params-over-caller.yaml
- tools/oracle/cases/routing/complexity-placement/unsupported-tier-param.yaml
- tools/oracle/cases/routing/complexity-placement/raw-model-name-toggle.yaml
- tools/oracle/cases/routing/complexity-placement/input-plus-output-fit.yaml
- tools/oracle/cases/routing/complexity-placement/context-escalation.yaml
- tools/oracle/cases/routing/complexity-placement/all-contexts-too-small.yaml
deviations: []
out_of_scope:
- Modality/health gates and adaptive soft-floor selection, planned as separate parts.
- Session replay and plan-mode controls (B335).
pitfalls:
- Tier overrides cannot smuggle provider destinations or credentials through a passthrough map.
- A context limit must account for both input and effective output budget.
- Do not confuse display tier labels with lookup keys.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
