  why: adopt_model_cost_map and the sync entry point.
dod:
- text: "`get_model_info` returns LiteLLM's dict for the fixed model list and raises the same error text for an unmapped model."
  proof: [model-info-lookup]
- text: "`get_max_tokens` and `get_provider_info` match LiteLLM for mapped and unmapped names."
  proof: [model-info-lookup]
- text: A change to `betterlite.model_cost` or a `register_model` call shows in the next `get_model_info`, and no entry is re-sent when the generation is unchanged.
  proof: [model-info-sync]
- text: "`get_model_cost_map`, `refetch_model_cost_map` and `adopt_model_cost_map` give LiteLLM's results for a good body, a 429 then a good body, and a corrupt body."
  proof: [model-info-reload]
- text: The three reporters and `git_blob_id` return LiteLLM's shapes before and after a reload.
  proof: [model-info-reload]
- text: A non-default `client`, `sleep` or `rng` raises `UnsupportedCallArgument`.
  proof: [model-info-reload]
- text: JSON conversions for every native method parse without an interpreter, and malformed text gives an error, not a panic.
  proof: [model-info-native]
- text: The `_model_info` package passes ruff and strict basedpyright.
  proof: [python-lint]
- text: >-
    This task adds every Cargo.toml dependency it uses and no unused ones.
  proof: [model-info-lookup]
checks:
  optional: []
  commands:
  - id: model-info-lookup
    why: A lookup result or error text differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_model_info.py -k "lookup"
  - id: model-info-sync
    why: Runtime changes to the cost map do not reach the native lookup.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_model_info.py -k "sync"
  - id: model-info-reload
    why: A reload result or reporter differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_model_info.py -k "reload or reporter or unsupported"
  - id: model-info-native
    why: A conversion breaks or panics.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^model_info::/)'
  - id: python-lint
    why: A strict type error in the model info package.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`get_model_cost_map` and `refetch_model_cost_map` refuse an injected `client`, `sleep` or `rng`."
  why: A Python object cannot drive the Rust fetch, and ignoring it would send a request past a caller's own client or proxy.
- what: "`get_model_info.cache_info()` counts native lookups, not an `lru_cache`."
  why: Rust caches nothing the way functools does, and the counter only keeps the attribute present.
- what: This task has no helper oracle cases.
  why: The pytest file compares both packages, and the lookup cases belong to B205 and B193.
out_of_scope:
- "Lookup and fallback rules, `_get_model_info_helper`, `_get_potential_model_names`, the name strip helpers and `_get_model_cost_key` (utils.py L5501-L6407) are Rust (B205, B193)."
- "`register_model` and `reapply_runtime_model_cost_registrations` are B5365. `supports_*` flags are B5361."
- "`GetModelCostMap` file loading, `_expand_model_aliases`, the retry classes and background retry thread (get_model_cost_map.py L46-L360, L481-L555, L570-L616) are Rust (B194, B257)."
- "`mark_litellm_import_complete` (L207) is skipped, as B157 states."
pitfalls:
- "`get_model_info` with an `api_key` skips the cache, so send the key through to Rust and do not keep the result."
- "`loaded_at` is a `datetime` from `get_model_cost_map_loaded_at` and ISO text inside `get_model_cost_map_source_info`."
- "`adopt_model_cost_map` of an empty dict returns 0, not an error, and still bumps the generation."
- "Optional `ModelInfo` keys are present with `None` in LiteLLM's result, so a missing key is a test failure."
- "A `register_model` entry overrides the bundled one only for that key, so send entries that differ, never the whole map."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
