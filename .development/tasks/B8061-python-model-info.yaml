id: B8061
title: Python model info, max tokens and the model cost map functions
description: >-
  Give `betterlite` the model lookup functions users call: `get_model_info`, `get_max_tokens`, `get_provider_info`,
  `get_model_cost_mutation_generation` and the cost map API of litellm_core_utils/get_model_cost_map.py. The lookup rules
  (candidate names, provider match, fallbacks, the "This model isn't mapped yet" error) are Rust in B205 and B193, and the
  reload service is B194 with B257. This task adds the native family `model_info` and the Python layer. Python builds JSON,
  calls Rust, and returns the `ModelInfo` dict.


  Native family `model_info`, as B5659 describes it: `src/model_info.rs` with one `register` function, code in
  `src/model_info/**`, types in `python/betterlite/_native_model_info.pyi`. B5369 declares the `model_info` family in `lib.rs` and `_native.pyi` with a stub `register` that this task fills. A `#[pyclass] NativeCatalog` is built once from a JSON text and owns B205's resolver over B193's immutable price
  map and B194's reload service. Its methods are `model_info(request_json)`, `max_tokens(model)`, `provider_info(request_json)`,
  `set_runtime_entries(json)`, `reload_blocking(request_json)`, `reload_async(request_json)` (an awaitable through
  `pyo3_async_runtimes::tokio::future_into_py`, as B5659 does), `adopt(json)`, `source_info()` and `generation()`. Pure JSON
  conversions sit in `src/model_info/convert.rs` with tests named `model_info_request_` and `model_info_result_`.


  Python lives in `python/betterlite/_model_info/` with an explicit `__all__`. The user
  can assign into `betterlite.model_cost` and call `register_model` (B5365), so Python keeps the native catalog in step: each
  call reads `get_model_cost_mutation_generation()` and, only when it changed since the last call, sends the entries that differ
  from the bundled map through `set_runtime_entries`. `get_model_info(model, custom_llm_provider=None, api_base=None,
  api_key=None)` returns the `ModelInfo` TypedDict with every key LiteLLM returns, with `None` for an absent optional key. A
  miss raises the exception LiteLLM raises, with its message (`This model isn't mapped yet. model=..., custom_llm_provider=...`).
  It also has the attributes `cache_clear` and `cache_info` (utils.py L6502-L6503), backed by a counter of native lookups.
  `get_max_tokens(model)` returns `int | None` and raises the same unmapped error. `get_provider_info(model,
  custom_llm_provider)` returns the provider specific dict or `None`.


  Cost map API: `get_model_cost_map(url, timeout=5, max_attempts=..., ...)` returns the dict, `refetch_model_cost_map(url,
  ...)` is a coroutine that returns `ModelCostMapReloaded` or `ModelCostMapReloadUnavailable` (plain dataclasses with the
  fields at L212-L224), `adopt_model_cost_map(new_map)` rebinds `betterlite.model_cost`, bumps the generation, and returns the
  count of entries as in L556-L567, and the three reporters `get_model_cost_map_provenance`, `get_model_cost_map_source_info`
  and `get_model_cost_map_loaded_at` return the shapes at L431-L478, with `loaded_at` as ISO 8601 text or `None`.
  `git_blob_id(body)` (L60) is the SHA-1 of `blob <len>\0` plus the bytes. `LITELLM_LOCAL_MODEL_COST_MAP` is read at call
  time by Rust through B194's config. The injected `client`, `sleep` and `rng` arguments cannot drive the Rust fetch, so a
  non-default value raises `UnsupportedCallArgument` from `betterlite._completion.errors` (B158), and `mark_litellm_import_complete`
  is not built (B157).


  Tests compare `get_model_info` for a fixed model list (an OpenAI chat model, a prefixed Bedrock id, a Vertex model, a fine
  tune name, an unmapped name) against LiteLLM with the local map, and run reload against a local HTTP server that serves
  the bundled file, a 429 first, and a corrupt body.
scope:
  paths:
  - crates/betterlite-python/src/model_info.rs
  - crates/betterlite-python/src/model_info/**
  - crates/betterlite-python/python/betterlite/_native_model_info.pyi
  - crates/betterlite-python/Cargo.toml
  - Cargo.lock
  - crates/betterlite-python/python/betterlite/_model_info/**
  - crates/betterlite-python/tests/test_model_info.py
  - crates/betterlite-python/tests/model_map_server.py
  lint_tables: false
