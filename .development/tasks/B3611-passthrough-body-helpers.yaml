deviations:
- what: >-
    When a multipart form has file parts, non-file fields are grouped by name into lists and sent via
    httpx data=; when a form has no file parts, all fields are sent via files= as (name, (None, value))
    tuples with data=None. This prevents httpx downgrading a file-less data=-only payload to
    application/x-www-form-urlencoded.
  why: >-
    This follows LiteLLM's behavior exactly. httpx automatically sets the content-type header and
    boundary when it sees files=; without that parameter, it downgrades to form-urlencoded, which
    breaks multipart contracts. Sending all fields via files= when no files exist forces httpx to
    emit a valid multipart frame.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L507-L550

out_of_scope:
- >-
  The shared HTTP request/send transport via B173 (get_async_httpx_client, async_client.send with
  stream=True) is used by non_streaming_http_request_handler and make_multipart_http_request but
  owned elsewhere; this task calls it as a dependency.
- >-
  The _safe_get_request_headers predicate from B1100 (cached JSON/body access for streaming safety)
  is called by form parsing; this task calls it as a dependency.
- >-
  The get_form_data and ordered multipart input preservation are owned by B1101; this task uses them
  via form.multi_items().

pitfalls:
- >-
  make_multipart_http_request must call form.multi_items() instead of form.items() to preserve repeated
  field names; items() collapses duplicate keys to the last value.
- >-
  When the form has no file parts, send all fields via files= as (field_name, (None, field_value)) tuples,
  not via data=; httpx will downgrade data=-only payloads to application/x-www-form-urlencoded.
- >-
  Remove the content-type header from the outgoing request before calling httpx; httpx will set it
  with the correct boundary when it sees files=, or overwrite a mismatched user header.
- >-
  _parse_request_data_by_content_type returns a 4-tuple where the fourth element is the stream field;
  file_data is always None and is a placeholder for the 3-tuple that functions like this often return.
- >-
  _rewrite_vertex_live_setup_model must check setup.get("model") for a string value before passing it
  to the rewriter; a missing or non-string model field means no rewrite and return of the original frame.
- >-
  _json_object_frame must return None if the decoded JSON is not a dict, even on successful parsing;
  arrays and scalar values are rejected.
- >-
  _truncated_close_reason uses errors="ignore" on the final decode to avoid raising UnicodeDecodeError
  when truncating in the middle of a multi-byte character; the result is a valid UTF-8 string.
- >-
  SENDABLE_CLOSE_CODES is the set of all websockets.frames.CloseCode enum members except NO_STATUS_RCVD (1005),
  ABNORMAL_CLOSURE (1006), and TLS_HANDSHAKE (1015). Do not hardcode ranges like 1000-1014 because they
  omit 1007 (INVALID_DATA) and 1008 (POLICY_VIOLATION), which are real CloseCode members.
- >-
  _upstream_close_to_relay also permits the private close-code range 3000-4999; it checks both
  membership in SENDABLE_CLOSE_CODES and the range condition.
- >-
  _client_socket_is_open must check both client_state and application_state to match Starlette's
  two-half tracking; checking only one will not catch a half-closed socket.
- >-
  _extract_model_from_vertex_ai_setup must handle both direct ("model") and nested ("setup" > "model")
  fields in the setup response; the nested format is used by Vertex Live and the model name is extracted
  after the last "/models/" in the path.

