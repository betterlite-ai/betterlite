id: B3611
title: Pass-through HTTP body and WebSocket frame helpers
description: >-
  Implement multipart/non-streaming HTTP preparation plus small WebSocket JSON/setup/close-frame
  transforms. Build non_streaming_http_request_handler to dispatch GET requests with streaming
  semantics, multipart requests via make_multipart_http_request, and generic JSON requests with
  httpx stream=True. Build is_multipart to check for multipart/form-data in the content-type header.
  Build make_multipart_http_request to iterate form.multi_items(), separate uploaded files from
  non-file fields, preserve repeated field names, and send grouped non-file fields via data= when
  file parts exist (as a dict of lists by field name), or via files= with (name, (None, value))
  tuples when no file parts exist. When the form has file parts, real files are sent via files= as
  (name, (filename, content, content_type)) tuples and non-file fields via data=; when the form
  has no file parts, all fields go via files= as (name, (None, value)) tuples and data is not sent,
  preventing httpx downgrade to application/x-www-form-urlencoded. Build _build_request_files_from_upload_file
  to read and return (filename, content, content_type) from an UploadFile object.

  Build _parse_request_data_by_content_type to read query_params, custom_body, and stream from JSON
  bodies (application/json content-type), handle misconfigured clients sending JSON with multipart
  content-type by attempting JSON parsing first before falling back to actual multipart handling,
  extract query_params and custom_body from URL-encoded form data (application/x-www-form-urlencoded),
  and fall back to dict(request.query_params) when content-type is absent or unrecognized. Return a
  4-tuple (query_params_data, custom_body_data, file_data, stream) where file_data is always None
  and stream is extracted from the JSON body when present.

  Implement WebSocket and Vertex Live helpers: _rewrite_vertex_live_setup_model to extract the setup
  dict from a JSON message, pass its model field to a rewriter function, and return the rewritten JSON
  or the input unchanged if the rewriter is None, parsing fails, or the rewritten model matches the
  original. Build _resolved_vertex_live_setup to pass the rewriter through setup data before model
  extraction, allowing extractors to see the fully qualified path that reaches the upstream.
  Build _json_object_frame to parse a frame as JSON and return a dict if parsing succeeds and the
  decoded value is a dict, or None otherwise. Build _truncated_close_reason to encode a close reason
  to UTF-8, truncate it to CLOSE_REASON_MAX_BYTES bytes without splitting a character (using
  errors="ignore" on the final decode), and return the truncated reason.

  Build SENDABLE_CLOSE_CODES as every websockets.frames.CloseCode member except NO_STATUS_RCVD (1005),
  ABNORMAL_CLOSURE (1006), and TLS_HANDSHAKE (1015). Build the constant CLOSE_REASON_MAX_BYTES as 123
  (the maximum bytes a WebSocket close frame reason can hold). Build _client_socket_is_open to check
  that both halves of a Starlette WebSocket are not DISCONNECTED. Build _upstream_close_to_relay to
  return the upstream close frame if it's not a plain normal close (code 1000, empty reason), its code
  is in SENDABLE_CLOSE_CODES or in the private range 3000-4999, or None otherwise.
  Build _extract_model_from_vertex_ai_setup to extract a model name from Vertex AI Live setup
  responses in both direct format (setup_response["model"]) and nested format
  (setup_response["setup"]["model"]), extracting just the model name after the last "/models/" if
  present, and returning None on any exception or if the path format is unrecognized.

  Preserve raw signed request bodies, upload ordering, finite close-code rules and UTF-8 close-reason
  truncation exactly as LiteLLM does.

scope:
  paths:
  - crates/betterlite-http/src/lib.rs
  - crates/betterlite-http/src/passthrough.rs
  - crates/betterlite-http/src/passthrough/**
