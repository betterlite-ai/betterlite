id: B534
title: Azure embedding requests
description: >-
  Implement Azure embedding preparation and execution over the existing EmbeddingRequest/Reply. Retain dimensions,
  encoding_format and input shapes without injecting OpenAI SDK defaults. Reuse endpoint resolution and per-deployment
  credentials.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.aembedding
  L654-L742; AzureChatCompletion.embedding L744-L843.


  Named case contracts: dimensions_encoding: Build {model,input,**optional_params}, so options may override model/input.
  Truthy headers overwrite optional_params.extra_headers; empty headers leave an existing extra_headers alone. Standalone
  max_retries defaults to litellm.DEFAULT_MAX_RETRIES but is never forwarded to client construction; client settings
  come from litellm_params. embedding_usage: Delegate conversion to B004 response_type=embedding and B529 processed
  headers. Async additionally stores raw headers in hidden_params and rejects a non-EmbeddingResponse projection
  with AzureOpenAIError 500 embedding_response is not an instance of EmbeddingResponse; sync has neither extra check
  nor raw hidden_headers argument. embedding_error: Async logs and rethrows original errors. Sync preserves AzureOpenAIError;
  other failures use status_code attribute default 500, headers attribute or response.headers, and switch message
  from str(error) to response.text only when headers is None and a response exists. azure_embedding_client_types:
  Sync accepts AzureOpenAI/OpenAI, otherwise AzureOpenAIError 500 azure_client is not an instance of AzureOpenAI
  or OpenAI. Async accepts AsyncAzureOpenAI/AsyncOpenAI, otherwise ValueError Azure client is not an instance of
  AsyncAzureOpenAI or AsyncOpenAI. Only aembedding=True selects async. azure_embedding_raw_parse: Both paths use
  embeddings.with_raw_response.create(**data,timeout=timeout). String responses raise AzureOpenAIError with raw
  status or 500 and Unexpected string response from Azure: plus the first 500 characters. Async JSONDecodeError
  instead becomes AzureOpenAIError with raw status or 500 and Failed to parse raw Azure embedding response: <error>;
  sync JSON failure follows the generic wrapper.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-azure/src/embeddings.rs with adjacent tests under embeddings/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function embeddings_cases in betterlite-azure with these exact named cases (one per oracle file):
  string_and_token_input, list_input, dimensions_encoding, deployment_and_v1_path, embedding_usage, embedding_error,
  azure_embedding_client_types, azure_embedding_raw_parse. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_embeddings* using HelperCase: kind: helper
  and the externally tagged azure_embeddings variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_embeddings that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 166 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 195 production lines, 185 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 505 planned, 525 maximum changed lines.
