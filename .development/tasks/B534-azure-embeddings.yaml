pitfalls:
- 'The oracle helper for this task is pre-registered as azure_embeddings in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/embeddings.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_embeddings.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
