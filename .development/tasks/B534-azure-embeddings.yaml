id: B534
title: Azure embedding requests
description: >-
  Implement Azure embedding preparation and execution over the existing EmbeddingRequest/Reply. Retain dimensions,
  encoding_format and input shapes without injecting OpenAI SDK defaults. Reuse endpoint resolution and per-deployment
  credentials.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.aembedding
  L654-L742; AzureChatCompletion.embedding L744-L843.


  Implement crates/betterlite-azure/src/embeddings.rs with adjacent tests under embeddings/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_embeddings in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function embeddings_cases in betterlite-azure with these exact named cases (one per oracle file):
  string_and_token_input, list_input, dimensions_encoding, deployment_and_v1_path, embedding_usage, embedding_error.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_embeddings* using HelperCase: kind: helper
  and the externally tagged azure_embeddings variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_embeddings that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 166 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 195 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 398 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - crates/betterlite-azure/src/embeddings.rs
  - crates/betterlite-azure/src/embeddings/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_embeddings.rs
  - tools/oracle/src/helpers/azure_embeddings/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_embeddings.py
  - tools/oracle/cases/helpers/providers/azure-embeddings/**
  - tools/oracle/fuzz/corpus/helper_case/azure_embeddings*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/azure.py#L654-L843
  why: Own AzureChatCompletion.aembedding, AzureChatCompletion.embedding. Other functions in this file remain with
    the owners listed below.
dod:
- text: 'string and token input: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-embeddings/string-and-token-input.yaml.'
  proof:
  - case-string-and-token-input
  - oracle
  - helper-python
- text: 'list input: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-embeddings/list-input.yaml.'
  proof:
  - case-list-input
  - oracle
  - helper-python
- text: 'dimensions encoding: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-embeddings/dimensions-encoding.yaml.'
  proof:
  - case-dimensions-encoding
  - oracle
  - helper-python
- text: 'deployment and v1 path: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-embeddings/deployment-and-v1-path.yaml.'
  proof:
  - case-deployment-and-v1-path
  - oracle
  - helper-python
- text: 'embedding usage: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-embeddings/embedding-usage.yaml.'
  proof:
  - case-embedding-usage
  - oracle
  - helper-python
- text: 'embedding error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-embeddings/embedding-error.yaml.'
  proof:
  - case-embedding-error
  - oracle
  - helper-python
- text: New azure_embeddings seeds parse as the intended call variant and replay through the shared production parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-string-and-token-input
    why: The string-and-token-input behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_string_and_token_input$/)'
  - id: case-list-input
    why: The list-input behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_list_input$/)'
  - id: case-dimensions-encoding
    why: The dimensions-encoding behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_dimensions_encoding$/)'
  - id: case-deployment-and-v1-path
    why: The deployment-and-v1-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_deployment_and_v1_path$/)'
  - id: case-embedding-usage
    why: The embedding-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_embedding_usage$/)'
  - id: case-embedding-error
    why: The embedding-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_embedding_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_embeddings.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_embeddings*")"
      && grep -lq 'azure_embeddings' tools/oracle/fuzz/corpus/helper_case/azure_embeddings* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_embeddings$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
