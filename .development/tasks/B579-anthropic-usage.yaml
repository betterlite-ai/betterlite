id: B579
title: Anthropic usage and cache-token normalization
description: >-
  Add AnthropicUsage projection into existing normalized Usage, including cache-read/write breakdown, iteration
  totals, server tool use, speed, service tier and inference geography. Use checked integer arithmetic and exact
  decimal parsing for source numeric truncation, never floats. Supply an injected local reasoning token counter
  only for the source fallback; this is usage metadata, not billing calculation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig.thinking_tokens_from_usage L2256-L2263; AnthropicConfig._response_has_thinking_block L2266-L2274;
  AnthropicConfig._build_completion_token_details L2276-L2307; AnthropicConfig._sum_iteration_thinking_tokens L2309-L2315;
  AnthropicConfig.is_anthropic_usage_object L2318-L2330; AnthropicConfig._aggregate_cache_creation_token_details
  L2333-L2346; AnthropicConfig._resolve_cache_creation_token_details L2349-L2361; AnthropicConfig.calculate_usage
  L2363-L2467.


  Named case contracts: cache_read_write_total: Without truthy iterations, top-level input/output numeric int/float
  (including bool) truncate with int; None/falsey/nonnumeric strings become0. Add non-None cache_creation_input_tokens/cache_read_input_tokens
  unconditionally to prompt, default0; emit both raw cache fields, cached_tokens/cache_creation_tokens and text_tokens=prompt
  minus caches. total=prompt+completion. five_minute_one_hour_breakdown: Top-level cache_creation mapping becomes
  detail with ephemeral_5m_input_tokens/ephemeral_1h_input_tokens values, missing fields None; nonmapping means
  no detail. Do not infer a split from top-level creation total alone. iteration_usage_sum: Truthy iterations completely
  replace top-level input/output/cache counts with per-iteration sums of get(key,0) or0, then add both cache sums
  to prompt; empty iterations falls back to top-level. Iteration numeric strings are not handled by the top-level
  numeric guard. Preserve original iterations in Usage. partial_iteration_detail: If any iteration cache_creation
  is a mapping, sum int(value or0) across available 5m/1h breakdowns; sum all iteration creation totals; assign
  max(total-detailed5m-detailed1h,0) to 5m, retaining 1h. Breakdown sum exceeding total is not reduced. No iteration
  detail falls back to top-level breakdown. reported_thinking_capped: output_tokens_details must be mapping valid
  as extra-allow AnthropicOutputTokensDetails with optional int thinking_tokens; invalid values ->None. Use sum
  across iterations only when every iteration has a valid non-None count, else fallback top-level count. Clamp reported
  as min(max(0,count),completion_tokens), text=completion-reasoning; retain source order even for malformed negative
  totals. estimated_thinking_local: Only without reported count and with truthy reasoning_content call B196 token_counter(text,
  count_response_tokens=True) without model; cap min(estimate,completion), then max0, set remaining text. Counter
  errors propagate; no fallback zero/catch here. signed_thinking_without_count: Without reported/estimated count,
  any mapping thinking/redacted_thinking block in list response.content yields reasoning_tokens=None,text_tokens=None.
  Otherwise reasoning0/text=completion; empty content/nonlist does not signal thinking. tool_search_count_fallback:
  Use non-None server_tool_use.web_search_requests/tool_search_requests verbatim, including0. Only missing/None
  tool-search count scans response content for server_tool_use whose name contains case-sensitive tool_search; positive
  count emits it, zero leaves None. Emit server_tool_use only when either count is non-None. speed_tier_geography:
  usage.speed wins if string (including empty), otherwise use supplied speed; service_tier=get, inference_geo copies
  when non-None. Anthropic usage discriminator requires input_tokens key, no prompt_tokens key, and at least one
  cache_read_input_tokens/cache_creation_input_tokens key regardless of value.


  Implement crates/betterlite-anthropic/src/usage.rs with adjacent tests under usage/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function usage_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  cache_read_write_total, five_minute_one_hour_breakdown, iteration_usage_sum, partial_iteration_detail, reported_thinking_capped,
  estimated_thinking_local, signed_thinking_without_count, tool_search_count_fallback, speed_tier_geography. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_usage* using HelperCase: kind: helper
  and the externally tagged anthropic_usage variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_usage that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 192 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 230 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 605 planned, 625 maximum changed lines.
