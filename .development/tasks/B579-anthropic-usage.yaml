pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_usage in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/usage.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_usage.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Incomplete iteration thinking detail falls back to the top-level count, but partial cache-creation detail is aggregated
  and filled as 5m.
- An explicit server_tool_use.tool_search_requests=0 suppresses content-derived counting.
