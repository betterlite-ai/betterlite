id: B3500
title: Coordinate interaction cancellation and settled deletion
description: >-
  Implement sync and async interaction deletion and cancellation, performing background
  settlement only in the async deletion path. Build the public delete() and cancel() entry points
  accepting all OpenAPI parameters (interaction_id, extra_headers, timeout, custom_llm_provider
  and **kwargs), and their async variants adelete() and acancel() that delegate to the sync
  versions via a thread executor with context propagation.

  Apply lifecycle routing logic: if custom_llm_provider is absent or empty, default to 'gemini'.
  Call B3490's get_provider_interactions_api_config to select provider
  (GoogleAIStudioInteractionsConfig, VertexAIInteractionsConfig, or None); if config is None,
  raise ValueError with the message "Interactions API not supported for: {provider}".
  Extract GenericLiteLLMParams from kwargs.

  For delete operations only, call B3496's maybe_settle_background_interaction_before_delete
  in the async path only (adelete) to poll and settle queued/in-progress interactions before
  deletion; sync delete and both cancel operations skip settlement.
  For all operations, update logging metadata via B247's update_from_kwargs with
  interaction_id in optional_params and litellm_call_id in litellm_params.

  Then call B3494's delete_interaction or cancel_interaction with the provider config,
  custom_llm_provider, litellm_params, logging_obj, extra_headers, timeout, and _is_async flag.
  Preserve the _is_async delegation pattern: delete sets adelete_interaction=True, cancel sets
  acancel_interaction=True, then both extract the flag and pass it to dispatch sync/async paths.
  Wrap exceptions via B185/B186's exception_type, propagating context via B198 in the async path
  using contextvars.copy_context() and asyncio.get_event_loop().run_in_executor().
