deviations:
  - what: >-
      Delete/cancel operations preserve the un-settled synchronous path. The delete() function executes directly
      without calling maybe_settle_background_interaction_before_delete, while adelete() settles before delegating to delete().
    why: >-
      LiteLLM's sync path does not perform settlement. The async deletion path runs settlement to ensure usage is finalized
      before the interaction is removed. Betterlite preserves this distinction for consistency.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/main.py#L461-503
  - what: >-
      Context propagation in async delete and cancel uses contextvars.copy_context() and loop.run_in_executor
      to delegate to the sync path, preserving request-scoped state across the async boundary.
    why: >-
      This pattern preserves LiteLLM's context propagation without duplicating sync logic. B198 supplies resolved request_timeout
      and context injection; betterlite reuses that infrastructure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/main.py#L566-605
out_of_scope:
  - B3494 owns the HTTP delete_interaction and cancel_interaction handlers; this task calls them.
  - B3496 owns maybe_settle_background_interaction_before_delete; adelete calls it.
  - B3490 owns get_provider_interactions_api_config; all four functions call it.
  - B247 owns Logging.update_from_kwargs; delete and cancel call it.
  - "B185/B186 own exception_type; all four functions call it for exception wrapping."
  - Response result types (DeleteInteractionResult, CancelInteractionResult) are owned by B3481.
pitfalls:
  - "The adelete function must call maybe_settle_background_interaction_before_delete before delegating to delete(). Only async deletion is settled; sync delete() and both cancel operations (cancel/acancel) skip settlement."
  - "Default custom_llm_provider to 'gemini' when absent or empty; do not use None or empty string. The error message names the literal 'gemini' if settlement or provider config fails."
  - "When get_provider_interactions_api_config returns None, raise ValueError with the exact message 'Interactions API not supported for: {provider}'. Do not call a get_error_class method; litellm.exception_type will convert the ValueError to the appropriate exception class."
  - "The _is_async flag is set by adelete/acancel as adelete_interaction=True or acancel_interaction=True (not False), then extracted (pop) in the sync function so it does not leak into litellm_params."
  - "Context variables must be copied with contextvars.copy_context() before loop.run_in_executor to preserve request-scoped state (litellm_logging_obj, litellm_call_id, GenericLiteLLMParams) across the async boundary."
  - "Logging metadata is updated via update_from_kwargs with interaction_id in optional_params and litellm_call_id in litellm_params, model always None."
  - "Logging object is extracted from kwargs.get('litellm_logging_obj') before building GenericLiteLLMParams; missing litellm_logging_obj will fail at the update_from_kwargs call."
  - "If the delegated result from delete/cancel (returned from sync path) is a coroutine, await it; otherwise return directly (sync path execution inside executor returns a non-async result)."
