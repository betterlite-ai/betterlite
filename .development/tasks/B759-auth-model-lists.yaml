id: B759
title: Expand authorized model lists and fallbacks
description: >-
  Implement AuthorizedModels over catalog snapshots, visible key/team grants, access groups and wildcard
  deployment expansion. Keep wildcard credentials loaded through an injected credential lookup, never
  expose secrets in listing rows, and return all fallback names without granting them implicitly.


  A wildcard means any asterisk anywhere. Provider '*' calls B2328 get_valid_models without a provider;
  a provider in models_by_provider calls it with that provider, otherwise return null. Access-group
  expansion keeps literals not naming a group, explicitly included group names, and group names also
  deployed as models; then append all group members in input order. Key grants are copied, all-team
  replaces the entire list with team grants, a nested all-team is removed and adds proxy models plus
  optionally groups, and all-proxy replaces the list with proxy models plus optional groups. Deduplicate
  by first occurrence and DEBUG-log count. only_model_access_groups is unused in get_key_models.
  Team grants start as a set: all-team is removed and expands proxy models; all-proxy is expanded but
  remains in the list. Group expansion then deduplicates; order inherited from Python sets is unspecified.


  Complete lists choose nonempty key grants, else team grants, else proxy models plus optional groups,
  truthy user_model and inferred valid models. Remove no-default-models and preserve first occurrence.
  only_model_access_groups filters this list and returns before wildcard resolution. Otherwise remove
  wildcard entries, optionally append their original names, and expand each using B302 team-scoped
  deployments or a provider lookup without parameters. Append expansions without a final deduplication.
  Invalid deployment parameter construction here propagates. A wildcard '*' may use a provider wildcard
  from litellm_params.model. Patterns without slash return empty; choose provider from params when
  present, hydrate credentials, then list provider models. For a partial suffix remove every '*': if
  any model starts with that prefix, filter; otherwise prepend the prefix to all models. If a result
  does not start with the wildcard's prefix, replace a recognized provider segment but preserve unknown
  organization segments. This is starts-with logic, not an exact slash-prefix comparison.


  Move CredentialAccessor.find_credential/get_credential_values (credential_accessor.py L11-L24) down
  here as read-only methods over the injected credential snapshot: first matching name, missing gives
  empty map, and return a copy. B061 retains credential loading/storage/upsert. Hydration returns the
  original params for missing name or empty values; otherwise copy params, fill only fields declared by
  CredentialLiteLLMParams whose current value is null (empty strings are not null), and clear the name
  even if no field was filled. No stored credential mutation or re-encryption occurs.


  Model-info expansion keeps concrete model_name unchanged even if the provider model is wildcard.
  For wildcard names prefer its slash-containing pattern, then provider wildcard, then name alone.
  Missing/non-dict params are empty. Invalid typed params or empty expansion retains the original row;
  other lookup exceptions propagate. Each expanded row is a deep copy with model_name replaced and
  params.model replaced only for dict params. Permission lookup uses B725 ObjectPermissionRepository;
  absent DB/permission ID/row/servers or any query error returns [] silently. Fallback lookup defaults
  general, selects fallbacks/context_window_fallbacks/content_policy_fallbacks, returns [] without a
  router or config; an unknown type WARNs only when a router exists. B309 resolves the group; null
  becomes [], any resolver error ERROR-logs and returns []. There are no database writes.


  Build the production auth_model_lists module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/model_checks.py:
  _check_wildcard_routing (L24-L35; 11 source lines), get_provider_models (L38-L48; 10 source lines),
  _get_models_from_access_groups (L51-L68; 16 source lines), get_mcp_server_ids (L71-L94; 20 source lines),
  get_key_models (L97-L138; 38 source lines), get_team_models (L141-L180; 34 source lines), get_complete_model_list
  (L183-L244; 51 source lines), _hydrate_litellm_credential_name (L247-L262; 14 source lines), get_known_models_from_wildcard
  (L265-L323; 43 source lines), expand_wildcard_deployments_for_model_info (L326-L377; 44 source lines),
  _get_wildcard_models (L380-L410; 27 source lines), get_all_fallbacks (L413-L457; 36 source lines).


  Add the auth_model_lists operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-model-lists-*
  seed to B171 helper_case, which already owns this decoder.


  HTTP comparisons exercise existing /v1/models or /model/info listing routes, with production list
  services installed in B732 server state. These helpers are not an auth admission stage and produce
  no unauthorized-caller error of their own; route owners retain permissions and error translation.


  Permission-row lookups use B860 and POSTGRES_TEST_URL with testcontainers fallback. Wildcard and
  credential hydration cases instead inject distinct named credential snapshots and catalog entries.


  Listing transforms parsed deployment and credential records. It must not turn model discovery
  into a grant or overwrite encrypted credential storage while hydrating a copied parameter object.


  Sizing: about 358 source lines including the moved credential readers; allow 290 production,
  300 table-driven tests, 90 helper adapters and 100 wiring lines, 780 within an 800-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests under betterlite-server::auth::auth_model_lists::tests are listing_service_is_registered
  and listing_reads_authorized_models; invoke the actual constructor and listing route without turning
  these helpers into a request admission stage.
