dod:
  - text: 'Named cases: wildcard_any_asterisk_and_provider_lookup, group_name_model_collision,
      key_sentinel_replacement_and_ordered_dedup, key_only_groups_flag_unused,
      team_set_order_and_all_proxy_sentinel_retained, complete_key_then_team_then_proxy_precedence,
      no_default_sentinel_and_inferred_models, only_groups_returns_before_wildcards,
      team_scoped_wildcard_lookup_and_duplicates, wildcard_missing_slash_and_star_param_redirect,
      partial_suffix_filter_or_prepend, known_provider_prefix_replaced_org_prefix_preserved,
      credential_first_match_copy_and_null_only_fields, credential_name_clear_and_no_mutation,
      concrete_deployment_kept, invalid_params_or_empty_expansion_keeps_row,
      expanded_rows_deep_copy_and_params_model, wildcard_lookup_error_propagates,
      mcp_missing_context_and_query_error_silently_empty, fallback_three_categories,
      unknown_fallback_warns_only_with_router, fallback_resolver_error_logs_and_returns_empty.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor installs the listing service and existing model-list routes consume it.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_model_lists::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_model_lists.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-model-lists-*")"
        && grep -rlq "auth_model_lists" tools/oracle/fuzz/corpus/helper_case/auth-model-lists-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_model_lists::tests::/)
        - test(/replays_the_/)'
