deviations: []
out_of_scope:
  - B061 owns encrypted storage, loading and upsert of credential snapshots; this task owns only their
    read accessors and request-local hydration. Listing route owners redact output credentials.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Listing fallback names does not grant permission to call them.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
