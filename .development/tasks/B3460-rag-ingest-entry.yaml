id: B3460
title: RAG ingestion orchestration and call entry points
description: >-
  Build the part of LiteLLM's RAG ingest that ties the other RAG tasks together, in a new module
  `rag_ingest_entry` of betterlite-server (crates/betterlite-server/src/rag_ingest_entry.rs and the folder
  beside it). It has three submodules. `pipeline` is BaseRAGIngestion.ingest. `entry` is aingest and
  ingest from rag/main.py. `registry` is _execute_ingest_pipeline, the part that turns the request's
  vector_store record into one of the five provider objects. The module sits in betterlite-server because
  it needs betterlite-core (B3451 state, B3453 OpenAI, B3454 Gemini, B3455 Vertex) and betterlite-rag
  (B3457 Bedrock, B3459 S3 Vectors) together, and betterlite-rag already depends on betterlite-core, so
  no lower crate can see both. Nothing may depend on betterlite-server, and this module registers no route:
  B3465 calls `aingest` from the route handler.

  Read first: crates/betterlite-core/src/rag/ingestion.rs (B3451: the state type, upload, ocr, chunk and
  the abstract store contract), the provider modules B3453, B3454 and B3455 in betterlite-core/src/rag,
  the Bedrock and S3 Vectors modules in betterlite-rag, and the port structs from the two sibling tasks
  B7170 (store ports) and B7171 (step ports). Names below come from the task files and may differ a little
  in the merged code. Use the merged names, and if a needed item is missing or private, stop and say so in
  the report instead of copying it.

  Submodule `pipeline`. Declare a trait `IngestSteps` with the six calls the pipeline makes, so the pipeline
  can run against a scripted fake in tests and in the oracle helper: `ingest_id()`, `class_name()` (the Python
  class name, see below), `supports_existing_file_id()`, and async `upload`, `ocr`, `chunk` (sync in B3451),
  `embed` and `store`, each with the types B3451 and the providers already use. `run_ingest(steps, file_data,
  file_url, file_id)` is BaseRAGIngestion.ingest (base_ingestion.py L296-L371), in this order. 1. Call
  upload. An error from upload (no source, or a failed URL fetch) is returned to the caller as
  `IngestError::Upload`, never turned into a failed response, because Python runs upload before its try
  block. 2. From here every error becomes a failed response. If upload gave an existing_file_id and the
  provider does not support one, fail with the message "{class_name} does not support ingesting an existing
  file_id. Upload file data or provide file_url instead." before OCR. 3. ocr with the file content and content
  type. 4. chunk with the OCR text, the file content and `ocr_was_used` = the state's ocr config is present
  (not whether OCR returned text). 5. embed the chunks. 6. store with file content, filename, content type,
  chunks, embeddings and the existing file id. Success returns B3450's `RAGIngestResponse` with id = the
  ingest id, status "completed", vector_store_id = the store's id or "" when it is None or empty, and file_id
  = the store's file id, else the existing_file_id (Python `or`, so an empty file id also falls back; the
  field stays None when both are absent). Any error in steps 2 to 6 logs "RAG Pipeline failed: {error}" at
  error level and returns status "failed", vector_store_id "", file_id None and error = the error's text. The
  text is the Display of the failing step's error, and no step error may carry a credential, so it is safe
  to return. Nothing from earlier steps is rolled back.

  The Python class names that go into the existing-file message are `OpenAIRAGIngestion`,
  `BedrockRAGIngestion`, `GeminiRAGIngestion`, `S3VectorsRAGIngestion` and `VertexAIRAGIngestion`. Only
  OpenAI supports an existing file id (openai_ingestion.py L32); the other four keep the base default false.
  The base-class embed (base_ingestion.py L244-L267) is not built, see out_of_scope.

  Submodule `registry`. `ProviderIngestion` is an enum with one variant per provider, each holding the
  provider struct from its task (`OpenAiIngestion`, `BedrockProvisioner` with its B3451 state,
  `GeminiIngestion`, `S3VectorsWorkflow`, `VertexIngestion`). It implements `IngestSteps` by matching on the
  variant, so the five providers are an explicit list, not a lookup by name. `build_ingestion(options, deps,
  router)` is _execute_ingest_pipeline's construction half (main.py L94-L132). It picks the provider with
  B3450's selection function on the record's custom_llm_provider (a missing provider means "openai", as B5134
  made it), so an unknown provider returns B3450's error with the list of supported providers. It then builds
  the B3451 state from the options and the credential port, and the provider from its settings and the ports
  in `deps`. `RagIngestDeps` is one struct holding every port, built once at startup by the server and passed
  in: the OpenAI, Gemini and Vertex ports from B7170, the OCR, URL fetch, credential and embedding ports from
  B7171, the `AwsRagTransport` for Bedrock and S3 Vectors (B3457's `HttpRagTransport` over the shared
  `ProxiedClient`), and an `IdSource`. Bedrock and S3 Vectors take a `unique_id` of 8 lowercase hex characters
  (Python `uuid4().hex[:8]`): `IdSource::hex8()` returns it, the production impl uses uuid v4, and tests use
  a fixed value. Bedrock settings come from B3456's `from_vector_store_config` and S3 Vectors settings from
  B3459's `S3VectorsSettings` constructor plus the request's embedding options. A settings error is returned
  as `IngestError::Setup` carrying the typed lower error.

  Submodule `entry`. `aingest(options, file_data, file, file_url, file_id, router, deps)` is aingest and
  ingest (main.py L138-L204 and L451-L524) as one async function; the sync `ingest` and the executor and
  context-variable hand-off exist only for Python's event loop and are not built. If `file` is present and
  `file_data` is absent, build file_data from it: filename default "document", content default "" and
  content_type default "application/octet-stream"; content is base64. Decode it with the same function
  B3462 uses for the JSON `file.content` (crates/betterlite-core/src/rag/ingest_request.rs); do not write a
  second base64 decoder. When file_data is present, `file` is ignored. Then call `build_ingestion` and
  `run_ingest`. `router` is passed through to the state and the ports unchanged and never read here.
  Errors from `build_ingestion` and from upload are LiteLLM's exceptions caught by aingest's except
  branch, which calls exception_type with model None and custom_llm_provider = the record's raw
  custom_llm_provider value (None when absent). Do the same: map `IngestError` through betterlite-error's
  dispatch (crates/betterlite-error/src/dispatch.rs, B185 and B186) with that provider string, so the client
  sees the status and error type LiteLLM's mapping gives. Do not map a failed response, because it is a
  normal 200 body.

  Oracle helper. Helper cases run `BaseRAGIngestion.ingest` in Python against a test subclass whose ocr,
  chunk, embed and store return or raise what the case scripts, and the Rust side runs `run_ingest` against a
  scripted `IngestSteps` with the same script. Both sides project status, vector_store_id, file_id, error,
  whether the id starts with "ingest_" (the id itself is random), and for an upload error the exception
  kind and message. Cases that use `file` run Python's `ingest` conversion block and compare the resulting
  file_data tuple. The skeleton creates the helper operation named after this task id and the worker writes
  its adapter files. No HTTP case belongs here, because no route reaches `aingest` until B3465 registers
  /v1/rag/ingest and /rag/ingest; B3465 adds those.

  Size. The owned LiteLLM code is about 120 nonblank, non-comment lines (the registry and docstrings of
  main.py L46-L91 belong to B3450). Allow 260 implementation, 300 tests, 110 adapters and 130 case lines.

scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - Cargo.lock
    - crates/betterlite-server/src/rag_ingest_entry.rs
    - crates/betterlite-server/src/rag_ingest_entry/**
    - tools/oracle/cases/helpers/rag-ingest-entry/**
    - "tools/oracle/fuzz/corpus/helper_case/rag_ingest_entry-*"
    - tools/oracle/helpers/b3460.py
    - tools/oracle/helpers/b3460/**
    - tools/oracle/src/helpers/server_ops/b3460.rs
    - tools/oracle/src/helpers/server_ops/b3460/**
    - tools/oracle/src/helpers/server/b3460.rs
    - tools/oracle/src/helpers/server/b3460/**
  lint_tables: false

