    why: the one caller, passes file_data, file_url, file_id and router=llm_router and never passes file.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/__init__.py#L1-L19
    why: only re-exports the six classes; nothing to build.

dod:
  - text: run_ingest returns a completed response with the ingest id, the store's vector store id and its file id, and falls back to the existing file id and to "" as LiteLLM does.
    proof: [pipeline-completed, oracle, helper-python]
  - text: An upload error is returned to the caller as IngestError::Upload and is never turned into a failed response.
    proof: [pipeline-upload, oracle]
  - text: An existing file id on a provider that does not support it fails before OCR with the class-name message, and OpenAI accepts it.
    proof: [pipeline-existing-file, oracle]
  - text: An error in OCR, chunk, embed or store becomes a failed response with empty vector_store_id, no file_id and the error text, and later steps do not run.
    proof: [pipeline-failed, oracle]
  - text: The chunk step receives ocr_was_used from the presence of the OCR config, not from the OCR result.
    proof: [pipeline-ocr-flag]
  - text: build_ingestion picks the provider with B3450's selection, defaults to openai and returns the supported-provider error for an unknown one.
    proof: [registry-select]
  - text: build_ingestion builds all five provider variants from RagIngestDeps, and Bedrock and S3 Vectors get an 8 character hex unique id from the IdSource.
    proof: [registry-build]
  - text: aingest builds file_data from the file object with LiteLLM's defaults only when file_data is absent, and file_data wins when both are given.
    proof: [entry-file-object, oracle]
  - text: aingest maps an upload or setup error through betterlite-error with the raw custom_llm_provider, and a failed response is returned unmapped.
    proof: [entry-error-map]
  - text: Helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: pipeline-completed
      why: the completed response, its id fallbacks or the step order is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::pipeline::tests::completed_/)'
    - id: pipeline-upload
      why: an upload error is swallowed into a failed response or not returned
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::pipeline::tests::upload_error_/)'
    - id: pipeline-existing-file
      why: the existing file id check, its message or the OpenAI exception is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::pipeline::tests::existing_file_/)'
    - id: pipeline-failed
      why: a step error does not become a failed response or later steps still run
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::pipeline::tests::failed_/)'
    - id: pipeline-ocr-flag
      why: ocr_was_used is taken from the OCR result instead of the OCR config
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::pipeline::tests::ocr_flag_/)'
    - id: registry-select
      why: provider default or the unsupported-provider error is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::registry::tests::select_/)'
    - id: registry-build
      why: one of the five providers is not built from the ports or the unique id is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::registry::tests::build_/)'
    - id: entry-file-object
      why: the file object conversion or its defaults are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::entry::tests::file_object_/)'
    - id: entry-error-map
      why: upload and setup errors are not mapped with the raw provider, or failed responses are mapped
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^rag_ingest_entry::entry::tests::mapped_error_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3460)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3460 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3460/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added ingest entry cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/rag_ingest_entry-*")" &&
        grep -lE '^[[:space:]]+b3460:' tools/oracle/fuzz/corpus/helper_case/rag_ingest_entry-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/rag-ingest-entry/pipeline-completed.yaml
  - tools/oracle/cases/helpers/rag-ingest-entry/pipeline-id-fallbacks.yaml
  - tools/oracle/cases/helpers/rag-ingest-entry/pipeline-upload-error.yaml
  - tools/oracle/cases/helpers/rag-ingest-entry/pipeline-existing-file.yaml
  - tools/oracle/cases/helpers/rag-ingest-entry/pipeline-step-failures.yaml
  - tools/oracle/cases/helpers/rag-ingest-entry/file-object-defaults.yaml

deviations:
  - what: Only the async entry exists. LiteLLM's sync `ingest` (which runs the pipeline on the event loop) and aingest's executor and contextvars hand-off are not built, and `timeout` is not accepted.
    why: The gateway has no sync caller, and LiteLLM itself never reads `timeout` in either function (it is passed down and dropped). The B1028 task makes the same choice for sync file calls.
  - what: The failed-response error text is the Display of the step's typed error, not Python's str(exception) of a boto3, httpx or SDK exception.
    why: Typed lower errors replace those exceptions (B3453 to B3459 and the SDK ports). The text keeps the same lead phrases LiteLLM uses, but a provider's own error body wording can differ, and no text may include a credential.
  - what: Provider objects are built from an explicit five-variant enum instead of looking the class up in INGESTION_REGISTRY by name.
    why: The rules forbid reflection and auto-discovery. B3450 keeps the name list and the supported-provider error text, so a client sees the same message.

out_of_scope:
  - BaseRAGIngestion.embed (base_ingestion.py L244-L267) and its router.aembedding and litellm.aembedding calls. All five providers override embed (openai L41, gemini L45, vertex L96, bedrock L618, s3_vectors L399), so no caller reaches the base body at the pin. S3 Vectors embeds through B3459's embedder, which B7171 backs.
  - BaseRAGIngestion.custom_llm_provider property (base_ingestion.py L96-L99). Nothing reads it at the pin; the default "openai" is applied by B3450's selection (B5134) and by build_ingestion.
  - litellm/rag/ingestion/__init__.py. It only re-exports the six classes, so there is nothing to build.
  - get_rag_ingestion_class in litellm/rag/utils.py. It has no caller at the pin and imports litellm.llms.vertex_ai.rag_engine.ingestion, a different Vertex class than the one INGESTION_REGISTRY uses. The registry in rag/main.py (B3450) is the only one built.
  - aquery, query, _execute_query_pipeline and _suppressed_sub_call_billing in rag/main.py. B3461 owns them.
  - The @client decorator on aingest and ingest (callbacks, logging object, call ids). B012 owns the logging pipeline that route handlers attach, and B3465 wires it.
  - Request decoding, upload scanning and credential-field rejection. B3462 and B3452 own them.
  - The ports themselves. B7170 builds the OpenAI, Gemini and Vertex ports and B7171 builds the OCR, URL fetch, credential and embedding ports.
  - The /v1/rag/ingest and /rag/ingest routes, store persistence and authorization. B3465, B3463 and B3464 own them.

pitfalls:
  - Upload runs before the try block in LiteLLM, so an error from `upload` (ValueError for no source, a failed URL fetch) escapes as an exception, while the same kind of error from any later step is a 200 response with status "failed".
  - The existing-file check is the first thing inside the try block, so an unsupported existing file id fails before OCR and before any provider call, and the response still has status "failed", not an exception.
  - "Python truthiness applies to file_id (result_file_id or existing_file_id) and to vector_store_id (empty string becomes empty string), so an empty string from store behaves like None."
  - ocr_was_used is `self.ocr_config is not None`, which is true even when OCR returned no text, and chunk then skips the file-bytes fallback.
  - aingest passes ingest_options.get("vector_store", {}).get("custom_llm_provider") to exception_type unchanged, so a missing provider is None there even though the pipeline treats it as "openai".
  - The `file` object is used only when file_data is None, and its content is base64 text; Python's b64decode drops characters outside the base64 alphabet and fails on bad padding, so check B3462's decoder and list any difference as a deviation.
  - Bedrock and S3 Vectors need a fresh unique id for each ingest call, taken from IdSource; do not cache it in RagIngestDeps or two ingests would share one collection name.
  - Add betterlite-rag and betterlite-vertex to crates/betterlite-server/Cargo.toml only if the architect has not (this task's scope leaves Cargo.toml to the skeleton); do not create a cycle, since betterlite-rag depends on betterlite-core and nothing may depend on betterlite-server.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
