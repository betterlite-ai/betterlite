    why: BaseRAGIngestion.ingest, the six steps, the existing-file check, the completed and failed responses.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L45-L67
    why: supports_existing_file_id default and the constructor that builds the state B3451 owns.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/main.py#L94-L132
    why: _execute_ingest_pipeline, provider default, class lookup and the constructor call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/main.py#L138-L204
    why: aingest, including the exception_type wrap that uses the raw custom_llm_provider.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/main.py#L451-L524
    why: ingest, the file dict to file_data conversion and the async switch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/openai_ingestion.py#L32-L32
