id: B3031
title: Rate-limit records and request-owned state
description: >-
  Build the shared vocabulary every other rate-limit task uses: the typed records of the v3 limiter,
  the per-request state its callbacks share, the fail-closed 503 and the limiter's two env settings.
  Nothing here talks to Redis or decides a limit. The Lua scripts, the window store, the counter
  algorithms, the descriptor builders and the callbacks live in the sibling tasks and import these types.

  Three Rust modules in betterlite-rate-limit and one config section in betterlite-config.

  Module limiter_records holds plain data. Port RateLimitDescriptor (key, value, optional rate_limit)
  and its RateLimitDescriptorRateLimit object (requests_per_unit, tokens_per_unit, max_parallel_requests,
  window_size, all optional). Port ParallelRequestGauge (counter_key, limit, descriptor_key),
  ParallelSlotAcquisition (slot_id, counter_keys), RateLimitStatus (code, current_limit, limit_remaining,
  rate_limit_type, descriptor_key, optional descriptor_value), RateLimitResponse (overall_code, statuses,
  optional reservation_windows), RateLimitResponseWithDescriptors, WindowKeyMetadata, AtomicCounterMeta,
  AtomicCounterState, DescriptorAtomicGroup and CounterRefund. rate_limit_type is an enum RateLimitType
  with the exact wire strings "requests", "tokens" and "max_parallel_requests"; AtomicCounterMeta and
  WindowKeyMetadata use only the first two, so give them a narrower enum or a documented invariant.
  ReservationWindowIdentity is a struct of two strings and a ReservationBackend enum ("redis" or "local");
  reservation_windows is an ordered set of them (Python uses a frozenset). ReservationAwareIncrement wraps
  IncrementOperation (key, increment_value, ttl). betterlite-redis already has it in crates/betterlite-redis/src/cache_primitives/pipeline_increment.rs. Reuse it from betterlite-redis (betterlite-rate-limit's Cargo.toml gains that crate dependency); this task no longer waits for B4290. It adds the optional window_key,
  expected_window_start and reservation_backend. The status codes stay plain strings ("OK", "OVER_LIMIT");
  other tasks own what they mean. Also here: CacheCounterValue (int, float, text or bytes) and
  counter_values_from_reply, the port of _as_counter_values. Its input is a small enum ScriptReply
  (nil, int, float, text, bytes, array) that the Redis transport maps its client reply into. It returns
  the values of an array whose elements are all int, float, text or bytes, and a typed error that names
  the kind for a non-array reply or for a nil or nested element (Python raises TypeError there).

  limiter_records also holds the key helpers and constants. create_rate_limit_keys(key, value, type)
  returns "{key:value}:type" with literal braces (the braces are the Redis hash tag). sibling_counter_keys
  takes a window key, strips one trailing ":window" and returns the ":requests" and ":tokens" keys under
  that prefix. RateLimitedModel is a pair (requested, group) with limit_in(limits): the limit stored under
  the requested name, else the one under the group name, else none. Constants with LiteLLM's values:
  PROJECT_ITPM_DESCRIPTOR_KEY "model_per_project_itpm", PROJECT_OTPM_DESCRIPTOR_KEY "model_per_project_otpm",
  PARALLEL_REQUEST_SLOT_TTL_SECONDS 3600, DEFAULT_MAX_TOKENS_ESTIMATE 4096, DEFAULT_CHARS_PER_TOKEN 4,
  the TPM floor fraction 4, RESPONSES_API_MIN_OUTPUT_TOKENS 16, DEFAULT_AUDIO_TOKEN_ESTIMATE 300,
  the audio bytes per token 1600, and the call-type families RESPONSES_API_CALL_TYPES (aresponses, responses),
  EMBEDDING_API_CALL_TYPES (aembedding, embedding), TEXT_COMPLETION_API_CALL_TYPES (atext_completion,
  text_completion), RERANK_API_CALL_TYPES (rerank, arerank) and GOOGLE_GENAI_NATIVE_CALL_TYPES
  (generate_content, agenerate_content, generate_content_stream, agenerate_content_stream). The Redis
  cluster constants and the Lua scripts are not here: B3032, B3033, B3035 and B3037 own them.
  TagRateLimit (optional rpm_limit and tpm_limit) and the async seam TagRateLimitResolver
  (tag names in, map of tag name to TagRateLimit out) live here too; B3039 builds the production resolver.
  ModelGroupResolver is the sync seam (model name in, optional group name out) that replaces LiteLLM's
  import of proxy_server.llm_router; production wiring is B3055. LimiterClock is a trait with one method
  returning the current SystemTime, and current_time() on it is the port of _get_current_time.

  Module request_stash replaces the ContextVar. LiteLLM keeps a mutable RequestRateLimiterStash in a
  ContextVar so the pre-call hook can hand its bookkeeping to the success, failure and disconnect callbacks
  without putting it in the request body. Rust has no ContextVar and the rules forbid task-local state, so
  the request owns a RequestStashSlot and every hook receives it explicitly. The slot holds an optional
  Arc<RequestStash>. RequestStash has a std Mutex around StashState and a separate tokio Mutex
  (parallel_slot_release_lock) that the slot-release code in B3035 holds across its await points.
  StashState has LiteLLM's fields and defaults: owner_litellm_call_id (none), rate_limit_response (none),
  parallel_slot (none), reserved_tokens 0, reserved_model (none), reserved_scopes (empty set of
  (descriptor key, value) pairs), itpm_reserved_tokens 0, itpm_reserved_scopes, itpm_reserved_window_identities,
  otpm_reserved_tokens 0, otpm_reserved_scopes, otpm_reserved_window_identities, batch_enqueued_reservation
  (B1042's BatchEnqueuedTokenReservation, none), batch_tpd_refund_ops (empty list), reservation_released false
  and tpm_limited_tags (empty set). Slot methods, one per Python function: get (get_request_stash),
  get_or_create (get_or_create_request_stash), claim_for_call_id (claim_request_stash_for_data: get or create,
  then set the owner only when the call id is a string) and for_call (get_request_stash_for_call: none when
  nothing is stashed; the stash when either the owner or the given call id is none; the stash when both ids
  are equal; otherwise none). _call_id_from_callback_kwargs is not ported as a function: it only reads
  litellm_call_id out of an untyped kwargs dict, and the callbacks (B3046) get a typed record whose call id
  they pass to for_call directly.

  Module fail_closed holds general_settings.fail_closed_rate_limit_enforcement. RateLimitUnverifiableError
  carries status 503 and the detail {"error": RATE_LIMIT_UNVERIFIABLE_MESSAGE}; the message text is copied
  from LiteLLM byte for byte. FailClosedPolicy is a struct with the resolved bool and a method
  reject_if_unverifiable(failed_operation, error) that does nothing when disabled and otherwise logs at
  WARNING through B393's Redis failure logger with the message
  "fail_closed_rate_limit_enforcement: rejecting request, {failed_operation} could not verify the counters
  against Redis" and returns the error as Err. It is a Result, not a panic, so callers use `?`.

  Config section rate_limiter_settings (crates/betterlite-config/src/sections/rate_limiter_settings.rs).
  It reads three things and exposes them as config.sections.rate_limiter_settings. One: the bool
  general_settings.fail_closed_rate_limit_enforcement. Absent or null is false. A bool is used as given.
  A string goes through the shared env bool parser of betterlite-config (so an os.environ/ reference works).
  Any other value logs the LiteLLM warning "general_settings.fail_closed_rate_limit_enforcement=<value> is not
  a boolean, treating it as disabled" and is false. Two: env LITELLM_RATE_LIMIT_WINDOW_SIZE, an integer
  number of seconds, default 60. Three: env LITELLM_TPM_TOKEN_RESERVATION_ENABLED, default "true", and it is
  true only when the value lowercased equals "true" (so "1", "yes" and "on" turn it off, exactly as in LiteLLM).
  The handler constructor in B3055 copies these into the limiter; this task only exposes them.

scope:
