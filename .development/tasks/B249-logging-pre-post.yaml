id: B249
title: Pre-call and post-call logging dispatch
description: >-
  Implement _get_raw_request_body, _get_masked_api_base, _pre_call/pre_call, _print_llm_call_debugging_log, _get_request_body/_get_request_curl_command/_get_masked_headers
  and post_call. Dispatch installed enum callbacks in measured phase order using sanitized snapshots; credential-safe
  debug output never reconstructs secret curl arguments. Exporter-specific branches delegate to B110-B118. Inject
  clocks, queues and state. Budget 280 logic/types, 120 Rust/Python adapters, 300 tests and 60 wiring (760 total).
  Write the behavior rstest functions b249_behavior_tests_behavior in adjacent tests.rs files, with a named case
  for each behavior and failure in the DoD; corpus replay tests have separate names. Register helper operations
  logging_pre_post in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py; each operation has its
  own Rust and Python adapter file and corpus seed.


  Verbose print helpers now belong to B2239; reuse their injected sink and redaction contracts.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/lib.rs
  - crates/betterlite-logging/src/error.rs
  - crates/betterlite-logging/src/logging_pre_post.rs
  - crates/betterlite-logging/src/logging_pre_post/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/logging-pre-post/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
