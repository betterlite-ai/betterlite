id: B865
title: Management completion effects and cache eviction
description: >-
  Implement ManagementEffects around successful management handlers, preserving alert then span then key/user/team/customer
  eviction ordering and warning-only failure. On handler failure, emit the failure span without replacing
  the original error. Inject ManagementAlertSink and ManagementSpanSink; B116 and B110 install their transports,
  and B065 owns audit persistence. Cache eviction is concrete here through B734, not deferred to those
  later tasks. Register the wrapper once around each decorated route; an umbrella composes the route modules
  instead of registering aliases a second time.


  Build the production management_effects module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/utils.py:
  _delete_user_id_from_cache (L503-L514; 9 source lines), _delete_api_key_from_cache (L517-L528; 9 source
  lines), _delete_team_id_from_cache (L531-L542; 9 source lines), _delete_customer_id_from_cache (L545-L556;
  9 source lines), management_endpoint_wrapper (L755-L823; 57 source lines).


  Add the management_effects operation under B856 Management::models. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a management-effects-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 93 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  93 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 339 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  This component performs no SQL: test its cache/sink or SQLSTATE/transport inputs directly with typed
  collaborators. Real database execution belongs to B713-B715 and the mutation/repository owners; no fake
  Postgres row or rollback test is required here.
