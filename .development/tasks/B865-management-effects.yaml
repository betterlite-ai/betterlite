id: B865
title: Management completion effects and cache eviction
description: >-
  Implement the management completion wrapper with exact success/failure boundaries. Sample wall-clock
  start time before awaiting the handler and end time immediately on its return/exception. On success,
  use truthy kwargs.user_api_key_dict or a default B732 UserAPIKeyAuth; await B1228's alert projection
  first. Only with non-null parent_otel_span await B1228's success span using func, kwargs, start/end
  and the original result. Then synchronously evict key, user, team and customer cache entries in that
  order. All these effects share ONE inner try: the first error skips every later effect, logs DEBUG
  'Error in management endpoint wrapper: %s', and returns the handler's unchanged result. It does not
  emit a failure span for an alert/span/cache failure and does not roll back a successful handler.

  On handler exception, capture end time, resolve the same default auth object and, if parent span is
  non-null, attempt only the failure span with exception=e. Failure-span errors log DEBUG 'Error
  emitting OTEL span in management endpoint wrapper failure path: %s'; then rethrow the original
  handler exception. No success alert or cache eviction runs. A missing span silently skips span
  emission. Do not turn these debug logs into warnings. The wrapper preserves the wrapped function's
  name/identity for alerts and traces and neither creates an audit row nor registers a new route.

  Eviction inspects only kwargs.data, never positional arguments, result data or plain dict fields.
  UpdateKeyRequest deletes its key; KeyRequest with truthy keys deletes each key in sequence.
  UpdateUserRequest deletes user_id; DeleteUserRequest deletes each user_ids entry. UpdateTeamRequest
  deletes raw team_id; DeleteTeamRequest deletes each team_ids entry. UpdateCustomerRequest deletes
  raw user_id; DeleteCustomerRequest deletes each user_ids entry. Preserve duplicates and supplied
  strings, with no hash, team_id: prefix, end_user_id: prefix or null/empty filtering added here.
  Missing/null data and other request types do nothing. Delegate synchronous delete_cache to B733
  UserApiKeyCache, not B734 broadcast invalidation; other route-specific invalidations stay with their
  owners. A helper's direct cache exception propagates; only the wrapper catches it.

  B1228 owns alert/span payload sanitization and transport ports; consume those functions without
  copying serializers or logging raw credential results. Route owners apply this wrapper once at
  source-decorated routes. Native tests decorate an ordinary async test function and invoke this
  production wrapper with typed sink/cache collaborators, injected clock and recorded effects.


  Build the production management_effects module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/utils.py:
  _delete_user_id_from_cache (L503-L514; 9 source lines), _delete_api_key_from_cache (L517-L528; 9 source
  lines), _delete_team_id_from_cache (L531-L542; 9 source lines), _delete_customer_id_from_cache (L545-L556;
  9 source lines), management_endpoint_wrapper (L755-L823; 57 source lines).


  This wrapper and its eviction functions are effectful, so they do not get pure helper-oracle cases.
  Their decorated routes own booted HTTP comparisons (for example B828's member routes). Native tests
  cover every sink/cache failure boundary without executing a FastAPI handler in a helper subprocess.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  The five functions contain 88 nonblank noncomment lines excluding docstrings. Budget 130 production,
  290 ordered-effect tests and 35 wiring lines, 455 within 525. There is no SQL, config or new parser.


  This component performs no SQL: test its cache/sink or SQLSTATE/transport inputs directly with typed
  collaborators. Real database execution belongs to B713-B715 and the mutation/repository owners; no fake
  Postgres row or rollback test is required here.
