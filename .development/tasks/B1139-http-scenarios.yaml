    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^http_scenarios::tests::preserves_legacy_cases($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/http_scenarios)"
      && test -f tools/oracle/fuzz/fuzz_targets/http_scenarios.rs && grep -qF "decode_http_scenario" tools/oracle/fuzz/fuzz_targets/http_scenarios.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^http_scenarios::tests::replays_corpus$/)'
  - id: harness-self-check
    why: new harness fixtures or backwards-compatible HTTP modes fail
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/harness/http-scenarios)"
      && cargo run --locked --quiet -p betterlite-oracle -- --self-check tools/oracle/cases/harness/http-scenarios
      tools/oracle/cases/chat tools/oracle/cases/health
oracle_cases: []
deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
pitfalls:
- Captured response IDs are substituted only at declared JSON-pointer/path placeholders; secret values cannot enter
  artifacts.
- Seed the two proxies into distinct Postgres databases and Redis prefixes so one proxy cannot satisfy the other
  proxy's polling lookup.
review_level: security
budget:
  max_changed_lines: 530
  max_new_expects: 0
