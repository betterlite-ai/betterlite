dod:
- text: The listed controls, affinity, multipart and scoped outbound-header cases match pinned helper outputs.
  proof:
  - oracle
  - helper-python
- text: Client metadata cannot override credentials or a configured destination, and CR/LF/NUL values cannot become
    HTTP headers.
  proof:
  - provider-controls-tests
- text: Control size/depth limits fail explicitly; chat/config corpora exercise the added wire controls.
  proof:
  - provider-controls-tests
- text: Added config and chat fields remain covered by existing parser corpora.
  proof:
  - config-yaml-corpus
  - chat-request-corpus
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: provider-controls-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-models -p betterlite-config --no-tests=fail -E 'test(/::provider_controls_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'provider_affinity_header' crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: chat-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'provider_controls' tools/oracle/fuzz/corpus/helper_case && grep -rlq 'provider_affinity' tools/oracle/fuzz/corpus/helper_case
      && grep -rlq 'multipart_fields' tools/oracle/fuzz/corpus/helper_case && grep -rlq 'provider_headers' tools/oracle/fuzz/corpus/helper_case
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
