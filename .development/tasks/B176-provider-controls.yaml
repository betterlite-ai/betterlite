deviations: []
out_of_scope:
- Provider-specific signing and secret-manager lookups belong to provider tasks and B129.
- A request cannot supply arbitrary environment-variable references or outbound headers that bypass the typed policy.
- dot_notation_indexing.py is B213 (shared with JWT auth); pick_cheapest_chat_models_from_llm_provider is B019;
  get_proxy_server_request_headers is B206; non-JSON Langfuse object conversion is B164.
pitfalls:
- 'The oracle helper for this task is pre-registered as provider_controls and provider_affinity and multipart_fields and provider_headers in the models group. Replace the stub Op in tools/oracle/src/helpers/models/provider_controls.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/provider_controls.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A generated session identifier is not a stable affinity key.
- Header names are case insensitive, including duplicate detection.
- Dot-path reads and deletes use different grammars in LiteLLM; do not silently treat them as the same operation.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
