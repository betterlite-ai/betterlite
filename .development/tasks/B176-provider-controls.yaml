id: B176
title: Trusted controls, provider headers and affinity
description: >-
  Add provider control extraction, safe extra-body/multipart normalization, outbound request extra_headers selection
  scoped by custom_llm_provider and session-affinity helpers. Put them in betterlite-models/controls and /headers..
  Use typed trusted controls whose constructors are only called by config/server code, separate from request metadata;
  no request field may impersonate deployment credentials or internal metadata. Support the config keys these implemented
  helpers consume and reject the rest through B002. Preserve arbitrary provider payload only inside the existing
  named passthrough field, bounded by size/depth limits. Add helper operations for control extraction, affinity,
  multipart flattening; use B213 for any dot paths. Extend the config/chat corpus for new fields.  Seed B171's shared
  helper_case corpus with every added operation and replay it through the common typed parser. Trusted controls
  means ControlOptions.stream_chunk_size from types/litellm_params.py; B010 wires the config/server constructors.
  Load litellm_params.provider_affinity_header and use session_id, litellm_session_id and metadata/litellm_metadata.session_id
  as affinity inputs. _ensure_extra_body_is_safe is identity for JSON; Python object conversion belongs to SDK tasks.
  Budget 280 controls/affinity/header logic, 90 config/wire, 110 adapters and 290 tests (770 total). Write the behavior
  rstest functions provider_controls_tests_behavior in adjacent tests.rs files, with a named case for each
  behavior and failure in the DoD; corpus replay tests have separate names. The helper operations provider_controls, provider_affinity, multipart_fields, provider_headers are already registered;
  each operation has its own Rust and Python adapter file and corpus seed.


  These pure policies live in betterlite-models below the executable provider dispatcher. Use catalog/wire DTOs
  and closed config tags or caller-supplied policy projections, never an executable provider client. B010 reexports
  ProviderId and composes the provider enum; do not import betterlite-provider or betterlite-core here.
