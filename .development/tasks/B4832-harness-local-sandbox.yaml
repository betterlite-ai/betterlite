id: B4832
title: Run local sandbox commands with filtered credentials and owned processes
description: >-
  Implement the LocalSandbox backend in crates/betterlite-harness, which runs harness
  CLI commands and operations as confined subprocesses on the same machine.
  The sandbox filters provider credentials from the child environment, kills runaway
  processes with a grace period, confines file I/O to a root directory and its temp
  subdirs, manages temporary directories for isolated state, and reads/writes files
  through asyncio's thread pool to stay unblocking.

  LocalSandbox holds a workdir (absolute real path to an existing directory), collects
  live subprocesses so they die when the sandbox closes, and tracks temp directories
  created on demand to clean them up. On init, verify the path exists and is a directory,
  raise SandboxError if not. Environment filtering removes every environment variable
  whose name matches provider prefixes (ANTHROPIC_, OPENAI_, LITELLM_, AZURE_, AWS_,
  GEMINI_, CODEX_, CURSOR_, VERTEX, CLAUDE_CODE_, CLAUDE_PID, CLAUDECODE), contains
  API_KEY or TOKEN or SECRET (case-insensitive), or exactly matches GOOGLE_API_KEY or
  GOOGLE_APPLICATION_CREDENTIALS. The filtered base then overlays any extra vars, so
  extra always wins. Path resolution checks symlinks recursively and fails if a path
  escapes the sandbox root or any temp dir. Subprocess startup sets start_new_session=True
  to isolate process groups. Process shutdown sends SIGTERM and waits PROCESS_KILL_GRACE_SECONDS
  (5.0 seconds, from litellm.constants.HARNESS_PROCESS_KILL_GRACE_SECONDS but renamed to fit
  the 30-character code-name limit), then SIGKILL if the process is still alive.
  Kill attempts on already-dead processes succeed silently. The tmpdir prefix is
  literal "litellm-harness-". Subprocess stderr/stdout are read to EOF and decoded UTF-8
  with replacement chars on invalid sequences. Commands with no timeout raise SandboxError
  only on exec failure (binary not found) or real Sandbox state violations (closed, path
  escapes), never on nonzero exit. Timeout failures raise SandboxError with a message
  naming the timeout. host_url() returns http://127.0.0.1:<port>. which() searches
  the child's PATH from child_env(). snapshot() delegates to snapshot_local(workdir)
  from B4831. Everything is async/await; there is no sync wrapper here. The context
  manager __aenter__ returns self, __aexit__ calls close() unconditionally.
  exec() with an empty command list raises SandboxError('exec() needs a non-empty command').
  A cwd that resolves to a file, not a directory, raises SandboxError with the path in the message (e.g., 'cwd is not a directory: path').

