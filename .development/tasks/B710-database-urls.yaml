id: B710
title: Writer and reader database URL settings
description: >-
  Implement DatabaseURLSettings and password endpoint selection in betterlite-config and
  betterlite-db::database_urls. Use B2307's URL/query/flag policy and byte decoder. Own the settings
  declarations, from_env, tls_params, build_writer_url/build_reader_url, the password and precedence
  parts of _assemble_writer_url/_assemble_reader_url, _password_url, _raise_for_unsupported_scheme
  and the password-result part of apply_writer_url_to_env. Also own the older
  construct_database_url_from_env_vars CLI helper. B712 owns token strategy resolution, its minting
  branches and normalized enabled flags; B051 sequences those with password selection and B711 TLS.
  Receive a resolved auth mode from that caller, so this lower password module never calls B712.

  Settings are read at call time, case-insensitively, with extra fields ignored by this internal model.
  DATABASE_URL, DIRECT_URL, DATABASE_HOST, DATABASE_USER/DATABASE_USERNAME, DATABASE_NAME,
  DATABASE_SCHEMA, DATABASE_PASSWORD, DATABASE_SSLMODE and DATABASE_SSLROOTCERT default absent;
  DATABASE_PORT is the string '5432'. DATABASE_USER wins over DATABASE_USERNAME when both are
  supplied, including an explicitly empty USER. Every *_READ_REPLICA counterpart defaults absent,
  with USER preferred over USERNAME there too. DATABASE_DISABLE_PREPARED_STATEMENTS defaults false
  and uses B2307's strict boolean parser. DATABASE_MAX_IDLE_CONNECTION_LIFETIME is an optional integer,
  absent by default; invalid integer input stops settings loading, not a warning fallback.
  IAM_TOKEN_DB_AUTH and AZURE_POSTGRESQL_AUTH are strict false-by-default fields whose conflict and
  token behavior belong to B712. A truthy DATABASE_SSLROOTCERT with no truthy DATABASE_SSLMODE adds
  sslmode=verify-full; explicit nonempty sslmode wins. Empty TLS strings are omitted.

  With password auth a truthy pinned DATABASE_URL returns no replacement. Otherwise require truthy
  host, user and name; missing or empty required fields produce no URL, without warning. Encode user,
  database name and a truthy password using quote_plus: spaces become '+', reserved characters are
  escaped and an already percent-encoded input is encoded again. Missing/empty password omits both
  colon and password. Host and string port are interpolated as supplied. Append a truthy schema
  literally after '?schema=' before B2307 adds missing TLS keys; do not silently give this password
  path B712's normalized quoting. Pinned TLS query keys, including blanks, win over discrete fields.

  Reader assembly first requires a truthy DATABASE_HOST_READ_REPLICA, then preserves any truthy
  DATABASE_URL_READ_REPLICA. If assembling, reader port/user/name/schema/password each uses its truthy
  replica field or the writer discrete field, never fields parsed from DATABASE_URL. Thus an empty
  replica password falls back to the writer password, and a pinned writer URL alone cannot supply
  a reader username. Missing user or name produces no password reader URL. Pinned reader URLs are
  retained by the composing caller even when there is no reader host. A no-replacement result is
  distinct from an empty URL. apply_writer_url_to_env returns true only when a new writer is assembled;
  represent its ordered result as typed configuration updates rather than changing process globals.

  Preserve the older CLI helper separately: it reads DATABASE_USERNAME only, requires host/username/name,
  ignores DATABASE_USER and DATABASE_PORT, emits no ':5432', and otherwise uses the same quote_plus,
  optional password and literal-schema rules. It calls from_env only after its required fields pass
  to obtain TLS params; malformed unrelated settings can therefore fail this branch, while missing
  required fields return None without loading that model. This distinction needs named cases, not a
  replacement of both functions by one convenient assembler.

  Register general_settings.database_url (default None), database_connection_pool_limit=10,
  database_connection_timeout=None, database_connection_pool_timeout=None, database_connect_timeout=None,
  database_socket_timeout=None, database_disable_prepared_statements=false,
  database_extra_connection_params=None, database_max_idle_connection_lifetime=None,
  database_statement_timeout=None and database_lock_timeout=None through B002. A non-None database_url
  wins over DATABASE_URL, even an empty string; resolve its os.environ/ reference through B129 first.
  Only when both config URL and environment URL are absent does the CLI try discrete fields.
  database_connection_timeout wins when non-None, then database_connection_pool_timeout, then 60;
  zero survives. The pool limit defaults to 10 only when the key is absent. Optional connect/socket
  values are passed to the query policy; do not invent an invalid-number fallback. Statement/lock
  values use B2307's optional-float validation. YAML disable-prepared string values use B129's parser
  ('true' only after strip/lower); nonstrings use truthiness, and the strict env flag is ORed with it.
  Extra connection params override the named writer/direct params. Reader explicit values win and
  only B2307's allowlist follows the writer; B051 applies statement/lock options separately.

  The componentized path uses DATABASE_MAX_IDLE_CONNECTION_LIFETIME before the default 60. The CLI
  uses general_settings.database_max_idle_connection_lifetime before 60 and does not use that env
  variable as a lifetime fallback. In both paths a lifetime already pinned on a URL wins. Component
  scheme validation skips falsey URLs and checks writer, direct, reader in that order, raising
  RuntimeError with B2307's exact message before any URL update. CLI validation checks present writer
  and direct values, including empty strings, and exits 1 with that message; the CLI shell owns its
  colored stderr rendering. Do not attach invented HTTP status/type/param fields to startup failures.

  Differential helper cases call only the actual password/TLS/settings methods with explicit settings
  snapshots, including the CLI construction helper under an isolated env snapshot. Config tests must
  invoke the B002 loader for every named key and env alias. Connection side effects, token minting,
  process-env compatibility updates and TLS handshakes belong to their consuming services; this task
  does not connect to Postgres or write stored secrets. Seed B002's existing config_yaml corpus and
  B171's HelperCase corpus; all URL byte parsing and its fuzz manifest now come from B2307.

  The owned settings/password ranges contain about 195 nonblank noncomment lines including docstrings,
  plus the 26-line CLI construction helper. Allow 230 endpoint/config-policy, 300 behavior/config tests,
  70 adapters, 70 loader wiring and 35 registration lines, 705 within 800. Keep each Rust file below
  300 lines and avoid reproducing the lower query helpers.
scope:
  paths:
    - crates/betterlite-db/src/database_urls.rs
    - crates/betterlite-db/src/database_urls/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/config.rs
    - crates/betterlite-config/src/database_urls.rs
    - crates/betterlite-config/src/database_urls/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/database-urls-*
    - tools/oracle/src/helpers/database_urls.rs
    - tools/oracle/helpers/database_urls.py
    - tools/oracle/src/helpers/management/database.rs
    - tools/oracle/helpers/management/database.py
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/database-urls/**
    - tools/oracle/fuzz/corpus/helper_case/database-urls-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L312-L362
    why: Actual env aliases, case policy and defaults, read by from_env at call time.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L375-L409
    why: TLS defaults and writer composition; token resolution is supplied by B712.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L437-L475
    why: Pinned writer precedence and reader opt-in/fallback values.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L502-L578
    why: Password reader construction, raw schema interpolation and scheme guard/update results.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8399-L8433
    why: Older CLI password assembler ignores DATABASE_USER and DATABASE_PORT.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L1243-L1385
    why: Actual config read sites and the CLI lifetime, pool, URL and timeout precedence.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L580-L621
    why: B051's component composition uses env idle lifetime and preserves pinned reader params.
dod:
  - text: 'Password and TLS composition matches the pin; named cases: explicit_writer_no_replacement,
      empty_writer_assembles, required_writer_fields, password_absent_or_empty, quote_plus_credentials,
      already_encoded_password_reencoded, literal_schema_then_tls, root_only_verify_full,
      explicit_sslmode_and_blank_query, reader_host_opt_in, pinned_reader_no_replacement,
      reader_truthy_fallbacks, empty_reader_password_inherits, reader_does_not_parse_writer_url,
      writer_update_result, scheme_validation_order, falsey_component_urls_skipped,
      cli_username_only_no_port, cli_missing_fields_skips_settings_validation.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Real loader tests cover every setting and failure: env_defaults_and_alias_precedence,
      case_insensitive_env, strict_disable_env_flag, invalid_idle_integer_stops_loading,
      config_url_and_secret_precedence, explicit_empty_config_url, pool_timeout_precedence,
      optional_timeouts_and_extra_overrides, config_disable_string_vs_env,
      invalid_statement_timeout_stops_loading, component_idle_env_vs_cli_config,
      pinned_idle_value_wins, reader_query_allowlist, direct_no_added_statement_timeout,
      present_empty_cli_url_rejected.'
    proof: [config-tests, config-corpus]
  - text: New helper settings cases are dispatched through the existing typed management decoder.
    proof: [helper-python, helper-case-corpus, oracle]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Password construction, reader precedence and scheme failures are independently checked.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_urls::tests::/)'
    - id: config-tests
      why: Every named database setting must actually load and reach the endpoint/query policy.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_urls::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Password/settings adapters must call the pinned helpers and type-check.
      run: test -f tools/oracle/helpers/database_urls.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Added settings operations must be represented in new HelperCase seeds.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-urls-*")" && grep -rlq database_urls tools/oracle/fuzz/corpus/helper_case/database-urls-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-corpus
      why: New nested general_settings and env-resolution inputs must replay through the actual loader.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-urls-*")" && grep -rlq database_url crates/betterlite-config/fuzz/corpus/config_yaml/database-urls-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/database-urls/writer-password-precedence.yaml
  - tools/oracle/cases/helpers/database-urls/reader-fallbacks.yaml
  - tools/oracle/cases/helpers/database-urls/password-and-schema-encoding.yaml
  - tools/oracle/cases/helpers/database-urls/tls-defaults.yaml
  - tools/oracle/cases/helpers/database-urls/settings-validation.yaml
  - tools/oracle/cases/helpers/database-urls/scheme-guard-order.yaml
  - tools/oracle/cases/helpers/database-urls/cli-password-builder.yaml
deviations: []
out_of_scope:
  - B2307 owns idle_lifetime_params, add_missing_query_params, reader_shareable_params,
    connection_params_from_url, token_refresh_params_from_url, unsupported_db_scheme,
    unsupported_db_scheme_message and the URL byte decoder/fuzz workspace, plus the CLI query helpers.
  - B712 owns DatabaseURLSettings.token_auth, _assemble_writer_url L410-L435 and _assemble_reader_url
    L476-L500, and enabled-token normalization in apply_writer_url_to_env. These are composed above
    password policy and are not invoked through an upward dependency.
  - B711 owns translate_libpq_ssl_params and the native replacement of _VerifiedChainSource,
    _verified_chain_der, _server_trust_anchor, pin_bundle_root and _replace_file; B051 owns
    DatabaseURLSettings.apply_to_env composition without global env mutation.
  - B121 owns other proxy_cli.py entry/worker/diagnostic functions; B717 owns resolve_v2_migration_resolver.
    B051 invokes database settings and lowered URL helpers, without importing the CLI task.
  - B129 owns get_secret_str, get_secret and secret-manager str_to_bool used by CLI configuration policy.
  - B2302 owns proxy/utils.py get_server_root_path and normalize_route_for_root_path; B124 owns the
    remaining proxy utility functions outside construct_database_url_from_env_vars. They are not
    dependencies of password construction.
pitfalls:
  - DATABASE_USER and DATABASE_PORT affect DatabaseURLSettings but not the older CLI password builder.
  - An empty replica password inherits the writer password because the fallback uses truthiness.
  - The CLI does not apply DATABASE_MAX_IDLE_CONNECTION_LIFETIME as its idle-timeout fallback.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
