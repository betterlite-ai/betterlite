id: B710
title: Writer and reader database URL settings
description: >-
  Implement DatabaseSettings and password-auth DatabaseEndpoints in betterlite-config and parsed DbEndpoint
  in betterlite-db. Preserve explicit DATABASE_URL over discrete password fields, replica opt-in, percent
  encoding and reader pool-parameter allowlisting. Token strategy and token-dependent URL branches belong
  to B712 through an injected endpoint resolver; no reverse B710 dependency on token signing.


  DatabaseURLSettings._assemble_writer_url owns only password and precedence logic; its token branch L410-L435
  is B712.


  DatabaseURLSettings._assemble_reader_url owns only password and precedence logic; its token branch L476-L500
  is B712.


  Create crates/betterlite-db/fuzz/Cargo.toml and .gitignore exactly once here, register database_urls
  -> decode_database_url(&[u8]) -> Result<DbEndpoint,DbError>, and require later DB parsers to depend
  on this fuzz workspace. Configuration YAML itself uses B002 config_yaml.


  Build the production database_urls module in betterlite-db; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/db_url_settings.py:
  idle_lifetime_params (L111-L119; 8 source lines), add_missing_query_params (L122-L136; 14 source lines),
  reader_shareable_params (L257-L259; 3 source lines), connection_params_from_url (L262-L266; 5 source
  lines), token_refresh_params_from_url (L269-L279; 10 source lines), unsupported_db_scheme (L282-L298;
  15 source lines), unsupported_db_scheme_message (L301-L309; 9 source lines), DatabaseURLSettings.from_env
  (L360-L362; 3 source lines), DatabaseURLSettings.tls_params (L375-L392; 17 source lines), DatabaseURLSettings.build_writer_url
  (L394-L406; 12 source lines), DatabaseURLSettings._assemble_writer_url (L408-L449; 40 source lines),
  DatabaseURLSettings.build_reader_url (L451-L461; 10 source lines), DatabaseURLSettings._assemble_reader_url
  (L463-L512; 47 source lines), DatabaseURLSettings._password_url (L515-L538; 23 source lines), DatabaseURLSettings._raise_for_unsupported_scheme
  (L540-L558; 18 source lines), DatabaseURLSettings.apply_writer_url_to_env (L560-L578; 16 source lines).
  litellm/proxy/proxy_cli.py: _build_db_connection_url_params (L65-L97; 32 source lines). litellm/proxy/utils.py:
  construct_database_url_from_env_vars (L8399-L8433; 26 source lines). litellm-proxy-extras/litellm_proxy_extras/utils.py:
  str_to_bool (L36-L39; 4 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DATABASE_HOST=None;
  DATABASE_USERNAME=None; DATABASE_PASSWORD=None; DATABASE_NAME=None; DATABASE_SCHEMA=None; DATABASE_URL=''.


  general_settings.database_url=None resolves os.environ/ before DATABASE_URL/discrete fields. database_connection_pool_limit=10;
  database_connection_timeout falls back to database_connection_pool_timeout=60; database_connect_timeout=None,
  database_socket_timeout=None, database_statement_timeout=None and database_lock_timeout=None. Apply
  statement/lock timeouts to writer and reader options, never DIRECT_URL. database_disable_prepared_statements=false
  combines with DATABASE_DISABLE_PREPARED_STATEMENTS=false; native PgConnectOptions::statement_cache_capacity(0)
  and non-persistent queries implement disabled statement caching. database_extra_connection_params=None;
  database_max_idle_connection_lifetime=None falls back to DATABASE_MAX_IDLE_CONNECTION_LIFETIME then
  60. DATABASE_URL/DIRECT_URL/HOST/USER/USERNAME/NAME/SCHEMA/PASSWORD default absent, DATABASE_PORT=5432;
  every *_READ_REPLICA counterpart defaults absent and inherits the writer discrete value except HOST
  (reader opt-in). Writer config pool values override URL query parameters; explicit replica URL parameters
  win and only CONNECTION_PARAM_KEYS inherit, never schema/search_path.


  Add the database_urls operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a database-urls-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::database_urls::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary database_urls::decode_database_url(&[u8]) -> Result<TypedValue,DecodeError>
  for Postgres URL bytes, query pairs and discrete password endpoint inputs. Production calls this decoder
  before its typed policy functions; the cargo-fuzz target database_urls calls that same function. Seed
  valid, truncated, malformed, duplicate-field and limit-boundary inputs and add database_urls::tests::replays_the_database_urls_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B710 owns crates/betterlite-db/fuzz; create its manifest with this real decoder target
  here.


  Create the DB cargo-fuzz workspace and manifest once here; later DB decoder tasks depend directly on
  B710.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 312 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  312 production, 157 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 50 config lines, 659 changed lines estimated within a 675-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
