id: B086
title: Batch routes
description: >-
  Finish batch cancel routes and end-to-end lifecycle composition, preserving owner checks, provider/locally-executed
  cancellation and one-time refunds. Add native and executed create/retrieve/cancel sequences with injected repository/clock
  fixtures and verify source status/error/ID fields.


  Register cancel only under /{provider}/v1/batches/{batch_id:path}/cancel, /v1/batches/{batch_id:path}/cancel and
  /batches/{batch_id:path}/cancel. Router missing is 500; a managed batch id missing model_id is 400; no batch is
  404. Executed cancel returns 404 for no row and 400 for terminal status, with no owner check. require_managed_files
  triggers validate_managed_id_requirement; the absent OSS hook makes ownership validation unavailable (500). Do
  not claim unconditional executed-batch owner enforcement.


  In the actual OSS oracle, require_managed_files with a syntactically managed ID returns HTTP 500 with error.type
  internal_server_error, error.param null, error.code "500" and message Managed resource ownership validation is
  unavailable before any 403 predicate result; raw provider IDs return 400. The review's 403 requires a ManagedResourceAccessChecker
  supplied by the missing hook, so test that predicate purely in B1017 and preserve the OSS HTTP 500 here.


  Implement crates/betterlite-server/src/api/batch_routes.rs, crates/betterlite-core/src/api/batch_routes.rs. Use
  BatchRoutesInput and BatchRoutesResult with typed nested records; inject only the clock, repositories, transports
  and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient
  environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /{provider}/v1/batches/{batch_id:path}/cancel; POST /v1/batches/{batch_id:path}/cancel;
  POST /batches/{batch_id:path}/cancel. Each alias is exercised through the booted proxy. Every route factory is
  mounted once; a family composer mounts its child factories without re-registering their methods/paths.


  Route input projections: data.file_id (absent original_batch_id); data.custom_llm_provider (absent None); data.batch_id
  (absent None); data.litellm_call_id (absent ''); data.model (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:1157 status_code=500, exception_detail=FastAPI detail object; endpoints.py:1164
  status_code=400, exception_detail=FastAPI detail object. Compare the actual source status, error type, param and
  code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions cancel_provider_batch, cancel_executed_batch, cancel_refund_once, cancel_race_completion,
  cancel_no_router_500, cancel_missing_model_id_400, cancel_missing_batch_404, executed_terminal_400, required_managed_hook_500,
  required_managed_raw_400, route_aliases, auth_missing, auth_invalid under api::batch_routes::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/batches_endpoints/endpoints.py: cancel_batch (L1032-L1256). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 188 owned nonblank/non-comment/non-docstring Python lines (200 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 208 implementation,
  118 behavior tests, 156 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 520 total within the 520-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1017 (Managed resource access), B1038
  (Batch provider cancel), B1041 (Batch managed records), B1043 (Batch enqueued refund), B1049 (Executed batch runner),
  B1050 (Batch create route), B1051 (Batch read routes), B1087 (Api boundaries), B1112 (Batch route support), B1103
  (Authenticated request preparation), B1133 (Batch list route), B162 (Python Router class), B1019 (File routing
  ids), B1020 (File credentials), B1021 (File upload options), B1139 (Stateful HTTP oracle scenarios), B732 (Typed
  authentication principals and grant resolution), B855 (Authenticated request admission and budget handoff), B756
  (Authentication header selection and mode dispatch), B1048 (Executed batch input), B003 (HTTP server, health routes
  and master key auth), B856 (Management oracle namespaces and Postgres test fixture). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.


  The final handle_exception_on_proxy mapper converts HTTPException to ProxyException with type internal_server_error
  and the original HTTP status/code, including the raw-managed-ID 400. This is the final OpenAI error envelope,
  not a FastAPI detail response.
