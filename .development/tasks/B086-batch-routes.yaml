deviations:
- what: Executed batch cancellation returns 400 invalid_request_error/code="400" with the database-required message even when connected, because the MIT managed store hook is absent; no cancellation/refund runs.
  why: Max must decide managed files and batches. Preserve the current no-hook behavior without imposing an enterprise license gate or inventing a store implementation.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/batches_endpoints/endpoints.py#L89-L105
out_of_scope:
- B1112 owns endpoint support helpers L82-L215; B1050 create_batch L233-L524; B1051 retrieve_batch L542-L829; B1133 list_batches L847-L1014. Their route factories are only composed here.
- B1049 owns the runner's cancel method, terminal status checks and CAS retry. Without the ManagedBatchStore hook its invocation is unreachable from this route; B1043 refund work is not a direct dependency.
- B1041 owns database update/no-hook behavior; B1048 batch_error; B1020 model grants; B004 common request/call-id/header behavior; B2400 final error conversion.
pitfalls:
- Body custom_llm_provider outranks the header for cancellation, unlike file routes.
- The executed-batch factory's database error also means the required hook is missing.
- A successful cancellation hook may return null and is not type-checked before being returned.
review_level: security
budget:
  max_changed_lines: 640
  max_new_expects: 0
