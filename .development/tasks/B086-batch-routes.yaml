id: B086
title: Batch cancellation and route composition
description: >-
  Own complete cancel_batch with POST /batches/{batch_id:path}/cancel,
  /v1/batches/{batch_id:path}/cancel and /{provider}/v1/batches/{batch_id:path}/cancel.
  Implement betterlite-server::api::batch_routes and betterlite-core::api::batch_routes, then
  mount B1050 create, B1051 retrieve and B1133 list factories once. Do not re-register their paths.
  B1019 owns both ID formats, B1021 managed requirements, B1020 grants/credentials, B844 model-id
  name lookup, B1038 SDK cancellation, B162 router cancellation and B1112 fallback/runner selection.

  Correct the previous plan's executed-cancel expectations: the MIT factory requires a
  ManagedBatchStore hook, so without enterprise it returns 400 before the runner loads a row.
  Even a connected database and seeded executed batch do not make cancel reachable. Do not claim
  owner enforcement, refunds, terminal-status changes or race handling in this route. Those runner
  behaviors remain B1049; B1041's update_batch_in_database returns immediately without a hook.

  Validate the managed requirement before decoding/pre-call processing. Initialize data.batch_id,
  perform common route_type=acancel_batch, then B1103 authenticated preparation. Authorize any
  unified model id (resolved name when available) before dispatch. Preserve cancellation provider
  precedence path, body data.custom_llm_provider, custom-llm-provider header, query, then openai;
  this deliberately differs from file-route precedence. B2400 supplies final exception handling,
  B004 request call ids/logging/custom headers and B124 hooks/status updates.

  HTTP scenarios use B900/B1139, a configured sk-test master key, seeded virtual keys and the mock;
  no helper calls FastAPI and no enterprise hook is installed. Native callback-order tests live in
  api::batch_routes::tests in both crates. Source handler/decorators contain 200 nonblank,
  non-comment lines; budget 215 implementation, 170 tests, 210 fixtures and 45 composition lines,
  totaling 640. Existing request/ID decoders handle external input.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/api/batch_routes.rs
  - crates/betterlite-server/src/api/batch_routes/**
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/batch_routes.rs
  - crates/betterlite-core/src/api/batch_routes/**
  - tools/oracle/cases/api/batch-routes/**
  - tools/oracle/fixtures/http-scenarios/batch-routes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/batches_endpoints/endpoints.py#L1017-L1256
  why: All cancel decorators and the complete routing, persistence, hook and error sequence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/batches_endpoints/endpoints.py#L89-L105
  why: B1112's mandatory ManagedBatchStore hook prevents executed cancellation in the MIT route even with a database.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1444-L1479
  why: B1041's update helper returns before repository lookup when managed_files is absent.
dod:
- text: >-
    cancel_aliases_and_composition POSTs /batches/batch_a/cancel,/v1/batches/batch_a/cancel,
    /openai/v1/batches/batch_a/cancel with valid auth. Each makes one upstream cancel and returns
    200 with its batch object/status=cancelling. Native create/retrieve/list/cancel integration uses
    the composed child routes with no duplicate mount; slash-bearing ids stay one catch-all value.
    Missing/invalid auth gives 401/auth_error/param="None"/code="401" and B756's exact message
    before pre-call or provider requests with the master key configured.
  proof: [cancel-tests, oracle, new-cases]
- text: >-
    cancellation_provider_precedence configures openai and azure mocks; prove path=openai beats
    body/header/query=azure, body=openai beats header/query=azure, header=openai beats query=azure,
    query=openai selects alone, and empty values fall through. data.custom_llm_provider is popped
    before dispatch, then data.batch_id is removed before building CancelBatchRequest once. Team
    credentials are applied before fallback checking. No requested provider plus absent/empty
    data.api_key,litellm.api_key,litellm.openai_key,OPENAI_API_KEY gives 404/invalid_request_error/
    null/"404",message="No batch found with id 'batch_a'." An explicit provider bypasses that
    preliminary 404 and reaches its own credential/provider outcome. B1112 owns those setting defaults.
  proof: [cancel-tests, oracle, new-cases]
- text: >-
    encoded_cancel_credentials authorizes model m from a model-embedded batch id using context
    "batch cancellation (batch created with model)", decodes batch_a, merges credentials, moves
    the helper's file_id to batch_id, then calls B1038. Response id and truthy input/output/error
    file ids are encoded through B1019; absent/empty fields remain unchanged. DEBUG says
    "Cancelled batch using model: m, original_id: batch_a". Forbidden grants fail before HTTP.
    Native unified ids containing deployment id d resolve through B844; authorization receives its
    name or d when unresolved, before executed/router dispatch. Encoding never substitutes for grants.
  proof: [cancel-tests, oracle, new-cases]
- text: >-
    unified_cancel_router_errors sends a non-executed unified id to an admin fixture: missing
    router gives 500/internal_server_error/null/"500",message="{'error': 'LLM Router not initialized.
    Ensure models added to proxy.'}". With a router but no model_id it gives 400/internal_server_error/
    null/"400",message="{'error': 'Invalid LiteLLM managed batch ID. Missing model_id.'}" because
    B2400 maps HTTPException to internal_server_error even at 400. A valid model/id calls router
    acancel_batch with decoded batch_id and model; response hidden unified_batch_id stores the decoded
    legacy text, and missing/falsey hidden model_id is filled from data.model. Missing batch-id field
    retains B1019's extraction error instead of fabricating a not-found response.
  proof: [cancel-tests, oracle, new-cases]
- text: >-
    executed_cancel_without_hook sends an executed unified id with an authorized model and router:
    400/invalid_request_error/null/"400",message="LiteLLM-executed batches need a database: set
    DATABASE_URL so LiteLLM can keep the batch and its files". Repeat with database absent and present
    plus a seeded row: same error, no row lookup/update/refund. Without router, source batch_error is
    500/internal_server_error/null/"500",message="LLM Router not initialized. Ensure models added to proxy."
    Do not replace these cases with runner-level terminal-status or ownership tests.
  proof: [cancel-tests, oracle, new-cases]
- text: >-
    cancel_managed_requirement sets require_managed_files=true: raw batch_a returns
    400/internal_server_error/null/"400" with B1021's exact batch requirement message, while a
    syntactically unified id returns 500/internal_server_error/null/"500",message="Managed resource
    ownership validation is unavailable." Both occur before common pre-call, model grants and provider
    calls. The hypothetical injected checker's 403 is B1017, not a reachable MIT route outcome.
  proof: [cancel-tests, oracle, new-cases]
- text: >-
    cancellation_effect_order receives a provider success, calls B1041 update with operation=cancel
    (MIT no-op), then post_call_success_hook, then enqueues status=success with call id default "",
    then computes B004 headers including request_data. The success hook's return is used unconditionally,
    even null, unlike file upload/list. Hidden d/c/https://mock.test/v1?secret=x yields model-id=d,
    cache-key=c,model-api-base=https://mock.test/v1 under x-litellm- names, plus version/region/call-id.
    Missing values use ""; B004 owns header omission. A success-hook failure leaves the remote cancel
    in effect, runs failure hook and produces 500 without compensation or local refund.
  proof: [cancel-tests, oracle, new-cases]
- text: >-
    cancellation_error_envelope makes upstream 429 with message=slow: non-ProxyException becomes
    429/internal_server_error/null/"429" through B2400, preserving its message after B121 notice
    stripping. Existing ProxyException retains type/param/code and headers; x-litellm-call-id fills
    only an absent header when request_litellm_call_id finds a string. Failure hook precedes
    log_llm_api_exception and final mapping; early failures may lack a call id. These rules differ
    from file routes' status-sensitive error-type mapping and must not be shared accidentally.
  proof: [cancel-tests, oracle, new-cases]
checks:
  optional: []
  commands:
  - id: cancel-tests
    why: cancellation order, provider precedence or MIT hook boundary is untested
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::batch_routes::tests::/) - test(/replays_/)'
  - id: new-cases
    why: cancel aliases and failure branches have no new booted-proxy scenarios
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/batch-routes)"
