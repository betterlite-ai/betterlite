  - tools/oracle/cases/health/services-unknown-name.yaml
  - tools/oracle/cases/health/services-missing-name.yaml
  - tools/oracle/cases/health/services-mock-braintrust.yaml
  - tools/oracle/cases/health/services-unmatched-null.yaml
  - tools/oracle/cases/health/services-webhook-null.yaml
  - tools/oracle/cases/health/services-slack-not-configured.yaml
  - tools/oracle/cases/health/services-teams-not-configured.yaml
  - tools/oracle/cases/health/services-teams-no-url.yaml
  - tools/oracle/cases/health/test-route.yaml

deviations:
  - what: The 400 message lists betterlite's 22 accepted names, not the Python typing repr of the Literal.
    why: The repr text of a typing union is a Python runtime detail. The status, type, param and code match, and the oracle ignores /error/message for that case.
  - what: get_callback_identifier has no attribute or class-registry steps; a registered callback returns its registered name.
    why: B189's registry holds a closed enum with one registered name per callback, and there are no Python objects to inspect.
  - what: Vendor checks that LiteLLM runs by constructing a fresh logger (DataDogLogger(), ArizeLogger(), GalileoObserve(), SQSLogger()) run through injected probes over the configured integration.
    why: Construction reads the same env vars the integration already resolved at startup, and the repository rule keeps env reads in the config crate.
  - what: TEST_EMAIL_ADDRESS is read once when the config loads, not on every call.
    why: The repository rule keeps environment reads inside the config crate.

out_of_scope:
  - "The 22 vendor health checks themselves, the Slack alert sender, budget_alerts, the spend reports, the email sender and the mock completion: B3933, B3939, B3862, B3964, B3995, B3942, B3074, B3904, B4024, B4025, B4029, B4023 and B5656 own them. This task defines the traits and fakes only."
  - "The production implementations of MockRequests, IntegrationChecks, AlertActions and CallbackSource: B8540 builds them, because no leaf task depends on all of those crates."
  - "Every route of the file outside lines 176-612: B4448 (readiness, drain, backlog, details, license, OPTIONS, /settings, /active/callbacks, callback_name), B4446 (POST /health/test_connection and the admin helpers), B4445 owns /health, /health/history and /health/latest, B4444 owns /health/shared-status, and B8540 mounts every one of them."
  - "_is_proxy_admin (L921-L933): B4446 owns it. This task calls it."
  - "The unreachable `service is None` 400 (L284): Service is a required query parameter, so the branch has no caller at the pin."

pitfalls:
  - "The success-callback test comes before the vendor branches, so a datadog, arize or sqs service that is in the success-callback list runs the mock request and never its own health check; only langfuse and pointfive are excluded from it."
  - "openmeter, braintrust and generic_api take the mock branch even when not in the success-callback list."
  - "The webhook branch is an `if`, not an `elif`: after the alert it falls through the slack, ms_teams and email checks (none match) and the handler ends without a return, so the answer is HTTP 200 with a JSON null body."
  - "Names that are in the list but have no branch (otel, custom_callback_api, langsmith, langfuse_otel, datadog_llm_observability, signoz) answer 200 null unless they are in the success-callback list."
  - "The message map for slack ends with an `else` of \"Budget Alert test alert\", so spend_reports, new_model_added and every other type read like budget_alerts; the initial \"default test message\" is never sent."
  - "A webhook-per-type setup skips an alert type that is missing from alert_types only when alert_types is set; None means every type is sent."
  - "The monthly and weekly spend reports start as background tasks only when a database exists, and a failure inside them must not change the answer."
  - "The email branch ignores the sender's success flag and always answers the success body."
  - "pointfive reports an unhealthy check as \"PointFive is healthy\" when its error text is empty, and a missing key is a 200 with status unhealthy, not an error."
  - "sqs returns the error text as message even when healthy, so a healthy answer has message null."
  - "newrelic, pointfive and webhook check the role before building anything, and the admin check includes the view-only admin role."
  - "The 403, 422 and 400 answers are raised inside the catch-all and rewrapped, so their body is the proxy error shape with type auth_error, param \"None\" and the detail map as text, not a bare detail."
  - "The ms_teams timestamp uses local time as %H:%M:%S, so the test fixes the clock through the injected trait."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
