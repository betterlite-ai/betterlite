dod:
  - text: >-
      GET /test answers the request route, and GET /health/services without a service query gets the validation 422 and with an unknown name gets a 400 auth_error whose message starts `{'error': 'Service must be in list.`
    proof: [service-tests, route-tests, oracle]
  - text: The 22 service names parse and nothing else does.
    proof: [service-tests]
  - text: The success-callback test matches a plain name, a registered callback name or its identifier, and wins over every vendor branch except langfuse and pointfive.
    proof: [dispatch-tests, oracle]
  - text: openmeter, braintrust, generic_api and a listed callback make the mock request with the exact model, message, user and mock_response and answer the mock message; langfuse checks auth first and fails with the auth_check text.
    proof: [dispatch-tests, oracle]
  - text: datadog, datadog_metrics, arize, galileo, sqs, newrelic and pointfive answer the exact status and message texts, including the pointfive setup failure and its empty-error rule.
    proof: [vendor-tests]
  - text: newrelic, pointfive and webhook answer 403 for a caller who is not a proxy admin, and view-only admins pass.
    proof: [vendor-tests, alert-tests]
  - text: webhook sends the user-budget test alert and answers a JSON null body, as do the names that match no branch.
    proof: [alert-tests, route-tests, oracle]
  - text: slack and slack_budget_alerts answer 422 without "slack" in alerting, pick the per-type message, honor the active alert types, spawn the two spend reports only with a database, and list the active alert types.
    proof: [alert-tests, oracle]
  - text: ms_teams answers 422 without alerting config or without a webhook URL, posts the timestamped text, and turns a status of 400 or more into a 500.
    proof: [alert-tests, oracle]
  - text: email sends the key_created test event with TEST_EMAIL_ADDRESS and answers success whatever the send returns.
    proof: [alert-tests, health-services-config-tests]
  - text: Every failure logs the typo'd error line and the 500 fallback message reads "Authentication Error, <error>".
    proof: [route-tests]
  - text: The health_services section loads alerting and TEST_EMAIL_ADDRESS with their defaults, and the config corpus has the new seeds.
    proof: [health-services-config-tests, config-corpus]

checks:
  optional: [mutants]
  commands:
    - id: service-tests
      why: service name parsing or the unknown-name 400 is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_services::(.*::)?tests::service_/)'
    - id: dispatch-tests
      why: the success-callback test, its precedence, the identifier or the mock request is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_services::(.*::)?tests::(dispatch_|identifier_)/)'
    - id: vendor-tests
      why: a vendor health message, setup failure or admin gate is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_services::(.*::)?tests::vendor_/)'
    - id: alert-tests
      why: a webhook, slack, ms_teams or email test alert behavior is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_services::(.*::)?tests::alert_/)'
    - id: route-tests
      why: the route, error shape, null body or /test answer is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_services::(.*::)?tests::route_/)'
    - id: health-services-config-tests
      why: the health_services section keys, env var or defaults are missing
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::health_services::/) - test(replays_the_config_yaml_corpus)'
    - id: config-corpus
      why: the new health-services config seeds are missing or do not replay
      run: >-
        git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml | grep -Fq "/health-services-" &&
        test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'

