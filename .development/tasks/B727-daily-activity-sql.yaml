id: B727
title: Daily spend query and rollup builders
description: >-
  Implement DailyActivityScope and parameterized SQL builders for aggregate, entity rollup and key page
  queries. Retain timezone-adjusted date windows, PTU flat-cost attribution and filters without string-interpolating
  caller values. Return Decimal sums and typed query plans; actual execution is provided by daily activity
  repository.


  This task returns SQL plans over typed filters and executes no query. Helper cases call the pinned SQL
  builder only; real Postgres execution belongs to B729. There is no outside-byte decoder or task fuzz
  target here.


  Build the production daily_activity_sql module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/daily_activity_sql.py:
  adjust_dates_for_timezone (L43-L56; 14 source lines), build_where_clause (L59-L106; 48 source lines),
  _ptu_flat_cost_select (L109-L112; 4 source lines), _rollup_metric_select (L115-L132; 18 source lines),
  _validate_api_key_limit (L135-L137; 3 source lines), _top_api_keys_sql (L140-L148; 9 source lines),
  build_aggregated_sql (L151-L216; 66 source lines), build_entity_rollup_sql (L219-L261; 43 source lines),
  _key_spend_select (L264-L274; 11 source lines), build_key_page_sql (L277-L301; 25 source lines). litellm/types/repositories/daily_activity.py:
  DailyActivityScope.__post_init__ (L43-L45; 3 source lines), DailyActivityProxyReads.recover_key_metadata
  (L158-L160; 3 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the daily_activity_sql operation under B856 Management::database. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a daily-activity-sql-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 247 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  247 production, 148 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 490 changed lines estimated within a 500-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
