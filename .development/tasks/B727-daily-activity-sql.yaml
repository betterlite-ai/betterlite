  - tools/oracle/cases/helpers/daily-activity-sql/entity-scope.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/ptu-flat-cost.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/top-key-limit.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/empty-filter.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/malicious-filter-bound.yaml
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - 'litellm/repositories/daily_activity_sql.py: B728 owns _bounded_limit (L304-L306), build_key_search_sql
    (L309-L341), build_model_top_keys_sql (L344-L363), build_cache_leakage_keys_sql (L366-L380), build_export_sql
    (L383-L454), _export_grouping (L457-L509), _export_cursor_clause (L512-L526).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Caller filter values must remain bind parameters even when the query contains dynamic grouping or
    cursor predicates.
budget:
  max_changed_lines: 500
  max_new_expects: 0
review_level: security
