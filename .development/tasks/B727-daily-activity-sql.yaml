id: B727
title: Daily spend query and rollup builders
description: >-
  Implement daily_activity_sql L43-L301 and the expression constants L14-L15 in betterlite-db.
  Reuse B2312's scope, query and identifier contracts. Own adjust_dates_for_timezone,
  build_where_clause, _ptu_flat_cost_select, _rollup_metric_select, _validate_api_key_limit,
  _top_api_keys_sql, build_aggregated_sql, build_entity_rollup_sql, _key_spend_select and
  build_key_page_sql. These functions return SQL/ordered parameters without executing it.

  Time adjustment defaults include_current_utc_day=false and utc_now=None. With the flag off or
  offset=None, return both input strings unchanged without reading the clock. Otherwise calculate
  caller_local_today from UTC now MINUS offset minutes. If end_date sorts before that ISO date,
  retain the window; otherwise replace only end_date with max(input end, current UTC date).
  Offset zero still enters this path. Never shift start_date, parse the input dates, trim them,
  infer a timezone or truncate a future end_date. Inject the clock for both direct and nested calls.

  build_where_clause defaults start_index=1 and emits inclusive date >= and <= binds first.
  entity_ids=None omits its predicate; an empty tuple emits FALSE without a parameter; a nonempty
  tuple binds one text[] with the validated entity identifier. Nonempty exclusions bind another
  text[] and retain null entities through (field IS NULL OR NOT(field=ANY(...))). A truthy model
  adds equality; None and empty string omit it. api_keys follows the same None/empty/nonempty
  distinction as entity_ids. Bind order is dates, present entity array, exclusion array, model,
  present key array; absent/FALSE predicates consume no slots. Preserve array order/duplicates.
  Both empty inclusions can emit FALSE. start_index is supplied by internal callers, without
  invented positivity validation. Values containing quotes or SQL syntax stay parameters.

  PTU_SENTINEL_API_KEY is the static literal __ptu_flat_cost__. USAGE_TOP_API_KEYS_MAX=1000 and
  USAGE_KEY_PAGE_MAX=100 are static constants, not environment settings. Aggregate and entity
  builders calculate their WHERE before checking api_key_limit in inclusive 1..1000, otherwise
  ValueError "api_key_limit must be between 1 and 1000". Their final parameters append sentinel
  then limit. The shared top-key query excludes sentinel and null keys, groups by key, ranks
  SUM(spend::numeric) descending then api_key ascending, and counts all grouped keys before LIMIT.
  Selection is global across the scoped dates/entities, not a fresh top list per dimension.

  Rollup metrics are SUM(spend), SUM(ptu_flat_cost) only for TEAM and literal zero otherwise,
  plus SUM of prompt_tokens, completion_tokens, cache_read_input_tokens,
  cache_creation_input_tokens, compression_saved_tokens, compression_savings_spend,
  prompt_caching_savings_spend, gateway_injected_caching_savings_spend, autorouter_savings_spend,
  api_requests, successful_requests, failed_requests, total_response_time_ms and timed_requests.
  Preserve bigint casts for counters and the source monetary SQL projections with B2312's checked
  Decimal row conversion. There is no COALESCE in these sums: an empty grand total has null
  metrics, except non-team PTU zero. Non-team queries must not reference a nonexistent PTU column.
  The export-facing aggregate=false form prefixes scoped.ptu_flat_cost and omits its output alias.

  build_aggregated_sql UNION ALLs unrestricted totals, including the sentinel, with top-key-only
  breakdowns. Totals have grouping sets date; date/model; date/model_group; date/provider;
  date/mcp_namespaced_tool_name; date/endpoint; and the grand total (). Model group means
  COALESCE(NULLIF(model_group, ''), model). Its grouping mask is (GROUPING(date)<<6) | 32 |
  GROUPING(model, group-expression, provider, tool, endpoint). The keyed half adds api_key to
  each of the six dated sets, uses GROUPING(date,key,model,group,provider,tool,endpoint), and
  MAX(top_api_keys.distinct_api_keys); it has no grand-total set. Totals set api_key and
  distinct_api_keys null. Keep true null dimension values distinguishable by the mask. There
  is no overall ORDER BY or deduplication between the two halves.

  build_entity_rollup_sql coalesces null entity identifiers to the empty string. A separate CTE
  counts distinct nonsentinel keys per entity across the entire window. Daily entity totals
  include sentinel rows, set api_key=null/api_key_rolled=1 and join that count with fallback zero.
  Daily entity/key rows use the same GLOBAL top keys, api_key_rolled=0 and distinct_api_keys=null.
  Null and empty entity identifiers merge; the distinct count is not a per-day count. Again
  UNION ALL does not promise row ordering.

  _key_spend_select coalesces spend and each prompt/completion/request/success/failure/cache
  sum to zero. total_tokens is summed prompt plus completion, never a stored total column.
  build_key_page_sql first rejects limits outside 1..100 with "limit must be between 1 and 100",
  then negative offsets with "offset must be non-negative", before building WHERE. It groups
  nonsentinel keys, ranks numeric spend descending/key ascending, and appends sentinel, limit,
  offset binds. COUNT(*) over all ranked keys is returned through a LEFT JOIN LATERAL from
  one dummy row: empty/out-of-range pages still produce one row with total count and null page
  columns. B729 removes that placeholder; changing the SQL to return no row loses the count.

  Helper operation daily_activity_sql invokes the source builders with an injected clock and
  compares SQL structure, ordered parameters and validation failures. Normalize whitespace only,
  never predicates, aliases, grouping masks, casts or parameter positions. Each named case below
  has a helper fixture; execute representative plans against Postgres in B729. No SQL execution,
  request decoder or task-specific fuzz target belongs here. After moving the shared declarations
  to B2312, this part owns 243 nonblank noncomment lines excluding imports, including SQL strings. Allow 255
  production, 270 tests, 100 adapters and 35 wiring, 660 within 750; split source files by query family.
scope:
  paths:
    - crates/betterlite-db/src/daily_activity_sql.rs
    - crates/betterlite-db/src/daily_activity_sql/**
    - crates/betterlite-db/src/lib.rs
    - tools/oracle/src/helpers/daily_activity_sql.rs
    - tools/oracle/helpers/daily_activity_sql.py
    - tools/oracle/src/helpers/management/database.rs
    - tools/oracle/helpers/management/database.py
    - tools/oracle/cases/helpers/daily-activity-sql/**
    - tools/oracle/fuzz/corpus/helper_case/daily-activity-sql-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/daily_activity_sql.py#L43-L148
    why: Date extension, exact predicate/bind order, sums and global top-key validation/ranking.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/daily_activity_sql.py#L151-L301
    why: Grouping masks, entity counts and the count-preserving lateral key page.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L2163-L2169
    why: Static sentinel and the aggregate/key-page maxima read by the builders.
dod:
  - text: 'Timezone/filter cases name flag_false_does_not_read_clock, null_offset_unchanged,
      zero_offset_current_day, positive_offset_crosses_midnight, negative_offset_crosses_midnight,
      historical_end_unchanged, future_end_not_truncated, start_never_shifted,
      dates_compared_as_strings, nondefault_bind_start, null_filters_omitted,
      empty_entity_and_key_filters_false, exclusion_keeps_null_entity,
      empty_model_omitted, every_filter_bind_order, duplicate_filters_preserved and sql_values_bound.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Aggregate cases name aggregate_limit_one_and_thousand, aggregate_limit_zero_and_excess,
      team_ptu_sum_and_other_tables_zero, export_ptu_expression_without_alias,
      every_rollup_metric_projection, empty_total_keeps_null_sums, top_keys_global_not_per_day,
      sentinel_in_totals_not_keys, top_key_spend_tie_order, distinct_count_before_limit,
      six_dimensions_and_grand_total, grouping_bits_keep_real_nulls,
      empty_model_group_falls_back, entity_null_and_empty_merge,
      entity_distinct_count_whole_window, entity_sentinel_only_count_zero and union_has_no_order.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Key-page cases name key_page_limit_one_and_hundred, limit_error_before_offset_error,
      negative_offset_rejected, page_parameter_order, key_metrics_nulls_zero,
      total_tokens_prompt_plus_completion, key_page_numeric_rank_tie,
      empty_page_preserves_count_row and offset_past_end_preserves_count_row.'
    proof: [behavior-tests, helper-python, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Each query family must preserve its distinct filters, masks and placeholder-row behavior.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^daily_activity_sql::/)'
    - id: helper-python
      why: SQL comparisons must come from source builders with a controlled clock.
      run: test -f tools/oracle/helpers/daily_activity_sql.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Require new SQL-builder operation inputs before replaying the shared helper decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/daily-activity-sql-*")" && grep -rlq daily_activity_sql tools/oracle/fuzz/corpus/helper_case/daily-activity-sql-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/daily-activity-sql/clock-and-date-extension.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/filter-presence-and-bind-order.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/aggregate-limits-and-sentinel.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/metric-and-grouping-projections.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/entity-rollup-counts.yaml
  - tools/oracle/cases/helpers/daily-activity-sql/key-page-lateral-count.yaml
deviations: []
out_of_scope:
  - B2312 owns every type in types/repositories/daily_activity.py and SqlQuery/ExportCursor/PRISMA_TO_PG_TABLE in daily_activity_sql.py L18-L40.
  - B728 owns _bounded_limit, build_key_search_sql, build_model_top_keys_sql,
    build_cache_leakage_keys_sql, build_export_sql, _export_grouping and _export_cursor_clause, L304-L526.
  - B729 executes plans and converts rows; B074 validates route dates, pagination and authorized scopes.
pitfalls:
  - PTU sentinel spend remains in totals even when api_key_limit hides most real keys.
  - model_group='' falls back to model, but a real null grouped dimension is not a rolled-up dimension.
  - Empty key pages need the lateral placeholder to report the total count beyond the last page.
budget:
  max_changed_lines: 750
  max_new_expects: 0
review_level: security
