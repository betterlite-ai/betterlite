id: B8292
title: Langfuse pass-through route
description: >-
  Port litellm/proxy/vertex_ai_endpoints/langfuse_endpoints.py (227 lines). It serves `/langfuse/{endpoint:path}` for
  GET, POST, PUT, DELETE and PATCH. A Langfuse SDK points its host at the gateway and signs in with the gateway key as
  the Langfuse secret key. The route checks that key, picks the real Langfuse host and credentials, and hands the call to
  the pass-through factory (B3615's `create_pass_through_route`, a Rust function that returns a handler; call it, do not
  copy it). It registers its own route, so it also has HTTP oracle cases.

  Code goes in crates/betterlite-server/src/langfuse_passthrough.rs and langfuse_passthrough/. Files: route.rs (the
  router and the handler `langfuse_proxy_route`), basic_auth.rs, credentials.rs, target.rs and error.rs. The function
  `langfuse_router(deps: LangfuseDeps) -> axum::Router` returns the router; the architect adds it to the app once.
  `LangfuseDeps` holds the factory's handler (`Arc<PassThroughHandler>` as B3615 and B3613 define it), the bool
  `user_url_validation` (from B5082's `user_url_policy` section, default true) and these ports, each a small trait in
  this module so tests use fakes and no global is read:
  - `KeyAuthPort`: `authenticate(bearer_key: &str, request) -> Result<UserApiKeyAuth, ProxyException>`, the proxy key check of B052.
  - `LoggingSettingsPort`: `callback_vars(key: &UserApiKeyAuth) -> Option<HashMap<String, String>>`, LiteLLM's `_get_dynamic_logging_metadata` (B1102 to B1105 own it) reduced to its `callback_vars`.
  - `SecretPort`: `get_secret(name: &str) -> Option<String>`, LiteLLM's `litellm.utils.get_secret` (B8500).
  - `UrlGuardPort`: `validate_url(url: &str) -> Result<(String, String), String>`, B5082's SSRF check. It returns the URL to call and the Host header, or the error text.

  `langfuse_proxy_route(endpoint, request, response)` does this in order.
  1. Read the `Authorization` header ("" when absent). Remove every "Basic " in it. Base64-decode the rest (standard
     alphabet), decode the bytes as UTF-8, split on ":" and take the second piece as the gateway key. A bad base64 text, bad
     UTF-8 or a text without ":" is HTTP 500 with the gateway's generic internal error, as in LiteLLM, where the unhandled
     exception becomes a 500. Then call `KeyAuthPort.authenticate("Bearer <key>")`. A failure is that call's own error.
  2. Ask `LoggingSettingsPort.callback_vars`. The keys `langfuse_public_key`, `langfuse_secret_key` and `langfuse_host` are
     the dynamic public key, secret key and host. Other keys are ignored. `dynamic_host_supplied` is true when the host key exists.
  3. The base URL is the dynamic host, else the env var `LANGFUSE_HOST`, else "https://cloud.langfuse.com" (an empty env
     value also gives the default).
  4. `get_credentials` in credentials.rs. With a dynamic host, both dynamic keys must be non-empty, else HTTP 400 with
     JSON detail `{"error": "Dynamic Langfuse hosts must include dynamic Langfuse credentials"}` and the dynamic pair is used.
     Without a dynamic host each key is the dynamic one when non-empty, else `SecretPort.get_secret("LANGFUSE_PUBLIC_KEY")`
     or `"LANGFUSE_SECRET_KEY"`. A secret that is missing stays None and is written as the text "None" in step 6.
  5. `build_target` in target.rs, three steps.
     a. `validate_path(endpoint)`: percent-decode until the text stops changing (Python's `unquote`, invalid UTF-8 becomes
        U+FFFD). Refuse with HTTP 400 `{"error": "Invalid Langfuse endpoint path"}` when any character has a code below 32,
        when it holds a backslash, when it starts with "//", or when any segment of the result is "." or "..". The result is
        "/" plus the decoded text with its leading "/" characters removed.
     b. `normalize_base(base)`: when the text does not start with "http://" or "https://", put "http://" in front. Parse it
        (the `url` crate; a parse error is HTTP 400 `{"error": "Invalid Langfuse host: <error>"}`). A scheme other than
        http or https, or no host, is 400 `{"error": "Invalid Langfuse host"}`. A username or password is 400
        `{"error": "Langfuse host must not include credentials"}`.
     c. Replace the base URL's path with the step a path. If a dynamic host was supplied and `user_url_validation` is true,
        call `UrlGuardPort.validate_url`: an error is 400 `{"error": "Invalid Langfuse host: <text>"}`, and the result is the
        returned URL with the header `Host` set to the returned Host value. Otherwise the target is the URL as text with no custom headers.
  6. Set the custom header `Authorization` to "Basic " plus base64 of "<public>:<secret>" (standard alphabet, padded).
  7. Call B3615's factory with `endpoint` (the raw, undecoded text), the target URL, the custom headers and the request's
     query parameters as a map, and run the handler it returns with the request, the response and the authenticated key.
     Return what it returns.

  The gateway serves the route from the start. LiteLLM loads the module on the first request under "/langfuse"
  (litellm/proxy/_lazy_features.py), and a client sees no difference.

