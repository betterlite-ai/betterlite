dod:
  - text: The route serves /langfuse/{endpoint} for GET, POST, PUT, DELETE and PATCH and no other method.
    proof: [route-tests]
  - text: The Authorization header parse takes the part after the first colon as the key, and a bad base64 text, bad UTF-8 or a missing colon is HTTP 500.
    proof: [basic-auth-tests]
  - text: The base URL comes from the dynamic host, then LANGFUSE_HOST, then https://cloud.langfuse.com, and the credentials follow the dynamic or secret rule with the missing-credential 400 for a dynamic host.
    proof: [credentials-tests]
  - text: validate_path decodes until stable and refuses control characters, a backslash, a leading double slash and dot segments with the exact 400 text.
    proof: [path-tests, oracle]
  - text: normalize_base adds http:// to a bare host and refuses a bad scheme, no host and embedded credentials with the three exact texts.
    proof: [base-url-tests]
  - text: With a dynamic host and user_url_validation on, the SSRF check runs and the returned URL and Host header are used, with its error as a 400.
    proof: [target-tests]
  - text: The factory call gets the raw endpoint, the target, the custom headers with Authorization (and Host when set) and the query map.
    proof: [route-tests]

checks:
  optional: []
  commands:
    - id: route-tests
      why: a method is missing or extra, or the factory call has other arguments
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^langfuse_passthrough::route::tests::/)'
    - id: basic-auth-tests
      why: the key part of the Authorization header or an error status is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^langfuse_passthrough::basic_auth::tests::/)'
    - id: credentials-tests
      why: the host, key choice or the dynamic credential error is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^langfuse_passthrough::credentials::tests::/)'
    - id: path-tests
      why: an unsafe endpoint path is accepted or a safe one is refused
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^langfuse_passthrough::target::tests::path/)'
    - id: base-url-tests
      why: the host normalizing or one of its 400 texts is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^langfuse_passthrough::target::tests::base_url/)'
    - id: target-tests
      why: the SSRF branch, the Host header or the Authorization header is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^langfuse_passthrough::target::tests::target/)'

oracle_cases:
  - tools/oracle/cases/server/langfuse-passthrough/path-dot-segments-400.yaml
  - tools/oracle/cases/server/langfuse-passthrough/path-double-encoded-400.yaml
  - tools/oracle/cases/server/langfuse-passthrough/path-backslash-400.yaml
  - tools/oracle/cases/server/langfuse-passthrough/path-leading-double-slash-400.yaml
  - tools/oracle/cases/server/langfuse-passthrough/authorization-without-colon-500.yaml

deviations:
  - what: The route is registered at start. LiteLLM imports the module on the first request under /langfuse.
    why: The lazy load is a startup optimisation of Python and shows no difference to a client.
  - what: The base URL is parsed with the url crate. LiteLLM uses httpx.URL.
    why: Both normalise a host the same way for http and https hosts. An odd host that httpx accepts and url refuses becomes a 400 here, with the parse error text of url.

out_of_scope:
  - "create_pass_through_route and the handler it returns: B3615 and B3613."
  - "The proxy key check (user_api_key_auth): B052."
  - "_get_dynamic_logging_metadata: B1102 to B1105."
  - "validate_url and the SSRF rules: B5082."
  - "create_request_copy and default_vertex_config in this file: no caller at the pin (proxy_server.py reads its own default_vertex_config key)."
  - "Registering the router in the app: the architect."

pitfalls:
  - "The key is the piece after the first colon, so the Langfuse public key before the colon is never checked."
  - "A missing LANGFUSE_PUBLIC_KEY or LANGFUSE_SECRET_KEY secret is sent as the text None inside the Basic header. Do not turn it into an error."
  - "The factory gets the raw endpoint, but the target URL uses the decoded path. Do not pass the decoded path to the factory."
  - "Decode the path in a loop. A single decode lets %252e%252e through as %2e%2e and then as dot segments upstream."
  - "The Host header is set only for a dynamic host with validation on. A host from LANGFUSE_HOST is never SSRF-checked."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
