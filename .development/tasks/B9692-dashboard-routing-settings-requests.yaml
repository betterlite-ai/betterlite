id: B9692
title: Prove the router settings, routing group, retry and alias page requests through the booted proxy
description: >-
  Add HTTP oracle cases for the writes the Router Settings page and the model page's Retry
  Settings and Model Group Alias tabs send, each followed by the read the page does next.
  B9090 takes in the covered files unchanged and B9091 builds them. None of these components
  checks premiumUser, so there is no patch, and every route has an owner: B348 builds GET
  /router/settings and GET /router/fields, B8596 GET /get/config/callbacks, B8594 POST
  /config/update, and B8595 GET /config/list, POST /config/field/update and POST
  /config/field/delete, with B8675 mounting the B8594-B8596 routes. Nothing is registered here.

  Reads. The Loadbalancing tab loads GET /get/config/callbacks and keeps router_settings
  without model_group_retry_policy, then GET /router/settings, reading fields[].field_name,
  ui_field_name, field_description, options, link and field_value, the routing_strategy
  field's options and routing_strategy_descriptions. The Routing Groups tab reads GET
  /router/settings again for current_values.routing_groups and current_values.routing_strategy,
  with routing_group_strategies or the routing_strategy options as the strategy list, plus GET
  /router/fields, GET /model_group/info for model names and GET /get/ui_settings. B348's
  settings-current-values, fields-with-null-values, routing-groups-present and strategy-options
  cases send these GETs exactly (no query, no body), and B9735 covers /model_group/info and
  /get/ui_settings, so reuse them for the reads and assert only the read-backs here. The
  General and Prompt Caching tabs read GET /config/list?config_type=general_settings and use
  field_name, field_type, field_value, field_default_value and stored_in_db.

  Writes, all POST /config/update unless named. The Loadbalancing save sends {router_settings:
  {...}} holding every key the callbacks read returned except retry_policy,
  model_group_retry_policy and routing_groups; allowed_fails, cooldown_time, num_retries,
  timeout and retry_after are numbers, the literal "null" becomes null, model_group_alias is
  parsed JSON or null when blank, "true"/"false" become booleans, routing_strategy and
  enable_tag_filtering come from the form, and routing_strategy_args {lowest_latency_buffer,
  ttl} is sent only with latency-based-routing. The Routing Groups tab sends {router_settings:
  {routing_groups:[{group_name (trimmed), models, routing_strategy, routing_strategy_args
  (parsed JSON or null), model_priorities ({model: integer}, only with priority)}]}} for every
  add, edit and delete, so a delete sends the remaining list and the last delete sends [].
  ModelRetrySettingsPanel sends {router_settings:{retry_policy, model_group_retry_policy}}
  where either may be null, then reads the callbacks route again for both plus num_retries.
  model_group_alias_settings sends {router_settings:{model_group_alias:{alias: target}}} with
  the full map each time, and {} after the last alias is removed; ModelGroupAliasPanel reads it
  back from router_settings.model_group_alias. The General tab sends POST /config/field/update
  {field_name, field_value, config_type:"general_settings"} for a non-null value and POST
  /config/field/delete {field_name, config_type:"general_settings"} on reset or when a Select or
  List field is cleared; the Prompt Caching tab uses the same two calls for
  enable_anthropic_prompt_caching, anthropic_prompt_caching_ttl and openai_system_messages_first.

  Cases use B860's Postgres fixture and B5076's bootstrap with store_model_in_db true, so
  /config/update persists to the config table, and a config with two model groups behind the
  mock upstream. Compare the write status and body and the following read projection; the
  router_settings envelope must not grow keys the page never sent. Add a non-admin case: an
  internal_user and a proxy_admin_viewer sending the routing-group save, the retry save and a
  field update must get the real 403 bodies. The Fallbacks tab, the callback and alert forms
  and the cache settings tab are other tasks' (B9772 and B9771); do not cover them here.
  Coverage audit: no case on disk sends POST /config/update, /config/field/update or
  /config/field/delete, and B8594's planned cases are helper cases on redaction. About 420
  case lines.
scope:
  paths:
    - tools/oracle/cases/ui/routing-settings/**
  lint_tables: false
