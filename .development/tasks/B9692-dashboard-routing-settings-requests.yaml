dod:
  - text: Loadbalancing, latency args, routing groups, retry policies and aliases saved through /config/update read back the same way as LiteLLM.
    proof: [routing-settings-cases, oracle]
  - text: General and prompt caching field updates and resets match LiteLLM, and non-admin writes keep the server's 403.
    proof: [routing-settings-cases, oracle]
checks:
  optional: []
  commands:
    - id: routing-settings-cases
      why: No booted-proxy case sends the router settings page writes with their read-backs.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/routing-settings)" &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/ui/routing-settings
oracle_cases:
