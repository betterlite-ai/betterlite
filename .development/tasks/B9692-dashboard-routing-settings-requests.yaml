  - tools/oracle/cases/ui/routing-settings/latency-strategy-args.yaml
  - tools/oracle/cases/ui/routing-settings/routing-groups-add-edit-delete.yaml
  - tools/oracle/cases/ui/routing-settings/routing-group-priority-map.yaml
  - tools/oracle/cases/ui/routing-settings/retry-policy-set-and-null.yaml
  - tools/oracle/cases/ui/routing-settings/model-group-alias-set-and-empty.yaml
  - tools/oracle/cases/ui/routing-settings/general-field-update-and-reset.yaml
  - tools/oracle/cases/ui/routing-settings/prompt-caching-fields.yaml
  - tools/oracle/cases/ui/routing-settings/non-admin-writes-denied.yaml
  - tools/oracle/cases/routing/router-settings/settings-current-values.yaml
  - tools/oracle/cases/routing/router-settings/fields-with-null-values.yaml
  - tools/oracle/cases/routing/router-settings/routing-groups-present.yaml
  - tools/oracle/cases/routing/router-settings/strategy-options.yaml
deviations: []
out_of_scope:
  - B9090 retains every function in the covered settings components; B9091 builds them and B146 drives the pages in the browser.
  - B348, B8594, B8595 and B8596 own the handlers and B8675 the mounts; whether a saved routing group changes routing at request time is B323's.
  - The Fallbacks tab and callback reads are B9772's, the cache tab B9771's, and the shared /model_group/info and /get/ui_settings cases B9735's.
pitfalls:
  - The Loadbalancing save drops retry_policy, model_group_retry_policy and routing_groups on purpose; sending them back would overwrite the other tabs.
  - Deleting a routing group or an alias is a /config/update with the remaining list or map, not a DELETE request.
  - A cleared Select or List field goes to /config/field/delete, while a cleared text or number field is not sent at all.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
