id: B2228
title: Shared owned-parameter names
description: >-
  Provide the single LiteLLM-owned keyword registry below request filtering, provider batch conversion and SDK wrappers.
  Port the declared wire-name projection and membership predicate without enabling those settings or accepting trusted
  state from requests. Field names are data shared by their owning feature tasks, not a second request deserializer.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/types/litellm_params.py:
  wire L61-L62; registry declarations and wire_names/owned_wire_names L370-L391. litellm/types/utils.py: all_litellm_params
  registry and is_litellm_owned_kwarg L3963-L3972.


  Named case contracts: wire_name_projection: wire(name) returns immutable metadata with key wire_name. wire_names
  walks dataclass fields in declaration order, selecting metadata.wire_name when present or the field name otherwise.
  owned_wire_names walks each root leaf in order, requires each leaf type to be a dataclass, and concatenates its
  wire names; invalid leaves raise TypeError {Root}.{field} is not a dataclass leaf. Do not recursively descend
  beyond this one root/leaf level. owned_name_registry: Concatenate leaf wire names from ConnectionSettings, LiteLLMOptions
  and InternalState, then artifacts self/use_client/model_config/rust, then StandardCallbackDynamicParams annotations
  and inherited CustomPricingLiteLLMParams fields. Preserve declaration order/duplicates in the exported list; predicate
  membership uses exact case-sensitive names. The exact known literals are listed below and require a named row
  for each source declaration. internal_prefix_membership: is_litellm_owned_kwarg returns true for a registered
  name or any string starting with the exact INTERNAL_KWARG_PREFIX literal _litellm_. The prefix itself matches;
  litellm_ without the leading underscore is not a wildcard. Unknown ordinary names return false without warnings.
  This is classification only, not authorization or config support. subset_registries: AGENTIC_LOOP_KWARG_NAMES
  concatenates AgenticLoopState then AgenticLoopOptions wire names; BEDROCK_BATCH_KWARG_NAMES is BedrockBatchConnection
  wire names only. Preserve no-log and underscore aliases rather than the Rust/dataclass field spellings; allowed_openai_params
  remains owned even though B648 deliberately exempts it during filtering.


  The registry literal membership rows are api_key, api_base, api_version, region_name, headers, provider_specific_header,
