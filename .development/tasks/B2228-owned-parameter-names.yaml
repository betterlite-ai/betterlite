    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/owned_parameter_names*")"
      && grep -lq 'owned_parameter_names' tools/oracle/fuzz/corpus/helper_case/owned_parameter_names* && cargo nextest
