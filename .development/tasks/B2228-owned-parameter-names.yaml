  Write standalone Rust test owned_parameter_names_credential_identity_isolation in betterlite-context: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test owned_parameter_names_secret_safe_failure in betterlite-context: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-context/src/owned_parameter_names.rs with adjacent tests under owned_parameter_names/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function owned_parameter_names_cases in betterlite-context with these exact named cases (one per
  oracle file): wire_name_projection, owned_name_registry, internal_prefix_membership, subset_registries. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/owned_parameter_names* using HelperCase: kind:
  helper and the externally tagged owned_parameter_names variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_owned_parameter_names that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 24 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 315 production lines, 205 behavior/config-test lines, 110 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
