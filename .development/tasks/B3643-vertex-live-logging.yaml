    why: The aggregated field set, detail narrowing, grounding collection, the turn split, the per-turn grounding sum and the summed-field helper.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_ai_live_passthrough_logging_handler.py#L138-L289
    why: The lone-unpriced residual rule, per-modality totals, snapshot aggregation and the Usage record.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_ai_live_passthrough_logging_handler.py#L291-L361
    why: Per-turn pricing through the call's own calculator and the session merge with the fixed-margin correction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_ai_live_passthrough_logging_handler.py#L363-L450
    why: The handler, its defaults, log lines, stand-in response and error boundary.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/success_handler.py#L359-L379
    why: The only call site, which passes the list body as websocket_messages and spreads kwargs.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/grounding_requests.py#L7-L56
    why: calculate_grounding_requests, which this handler runs once per turn.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L1798-L1860
    why: _response_cost_calculator, the cache_hit default and the litellm_model_name argument the handler uses.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L1719-L1796
    why: set_cost_breakdown, whose argument list the session merge fills.
dod:
  - text: Snapshots are the object frames whose usageMetadata is an object, the counts are summed over all of them, an absent count is 0 and a non-integer count takes the error boundary.
    proof: [usage-tests, live-oracle]
  - text: A lone detail entry without tokenCount takes the snapshot's declared count minus the priced entries when that is above zero, and two or more such entries are left out.
    proof: [usage-tests, live-oracle]
  - text: Modality totals keep first-appearance order and only totals above zero, and the usage record maps TEXT, AUDIO, IMAGE and VIDEO exactly, drops other modalities, and falls back to the modality sum or to prompt plus completion when a count is 0.
    proof: [usage-tests, live-oracle]
  - text: Turns end at each usageMetadata frame, frames after the last one are ignored, and Search and Maps grounding is counted per turn and then added, with 0 becoming None.
    proof: [turn-tests, live-oracle]
  - text: Each turn is priced on its own usage through the cost recorder with the model override, and one unpriced turn or a turn without a breakdown makes the session cost None.
    proof: [cost-tests]
  - text: The session total subtracts the repeated fixed margin, margin_total_amount loses the same amount, and the summed and first-turn fields go into set_cost_breakdown as listed.
    proof: [cost-tests]
  - text: The handler returns no result and unchanged kwargs for a session without usage or after an internal error, and otherwise returns the stand-in response with its id, created, hidden response_cost and the model and provider written into kwargs.
    proof: [handler-tests]
  - text: Newly added helper cases replay through the shared helper-case parser, the strict Python adapter lints clean and betterlite agrees with LiteLLM on the cases.
    proof: [helper-python, helper-case-corpus, live-oracle]
checks:
  optional: []
  commands:
    - id: usage-tests
      why: snapshot sums, the residual rule, modality totals or the usage record are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_ai_live_logging::tests::usage_/)'
    - id: turn-tests
      why: the turn split or the per-turn grounding sum is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_ai_live_logging::tests::turn_/)'
    - id: cost-tests
      why: per-turn pricing, the unpriced-turn rule or the fixed-margin merge is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_ai_live_logging::tests::cost_/)'
    - id: handler-tests
      why: the handler defaults, error boundary, stand-in response or kwargs writes are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_ai_live_logging::tests::handler_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3643)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3643 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3643/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/vertex_ai_live-*")" &&
        grep -lE '^[[:space:]]+b3643:' tools/oracle/fuzz/corpus/helper_case/vertex_ai_live-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: live-oracle
      why: newly added helper cases are absent or betterlite and LiteLLM disagree on them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/server/pass-through-logging/vertex-ai-live)" &&
        grep -rlE '^[[:space:]]+b3643:' tools/oracle/cases/server/pass-through-logging/vertex-ai-live &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/server/pass-through-logging/vertex-ai-live
oracle_cases:
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/usage-sums-turns.yaml
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/usage-residual-lone-unpriced.yaml
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/usage-two-unpriced-left-out.yaml
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/usage-modality-names-and-document.yaml
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/usage-zero-count-fallbacks.yaml
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/usage-none-without-snapshots.yaml
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/turn-grounding-counted-per-turn.yaml
  - tools/oracle/cases/server/pass-through-logging/vertex-ai-live/turn-grounding-after-last-usage-ignored.yaml
deviations:
  - what: The handler returns HandlerOutcome directly and logs an internal failure instead of catching an exception.
    why: LiteLLM wraps the whole body in try/except Exception and returns no result; a count field that is not an integer is the Rust version of the TypeError that sum() would raise there.
  - what: The aggregated usage record does not carry the first snapshot's unrelated keys.
    why: LiteLLM copies them into a dict that nothing reads; the typed record keeps only what the usage builder uses.
  - what: The cost recorder is injected as a constructor argument and the logging object's breakdown is read through the typed logging handle.
    why: The module has no logging object attribute access and no module-level state; the order of calls and the reads stay LiteLLM's.
out_of_scope:
  - "BasePassthroughLoggingHandler's llm_provider_name, get_provider_config and _build_complete_streaming_response overrides (L121-L136): no caller at the pin on the Live path, since this handler never calls passthrough_chat_handler or the stream seam. B3604 owns the base class."
  - "is_vertex_ai_live_route and the choice of this handler in the elif chain belong to B3605 and B3606 (success_handler.py L572-L578 and L359-L379)."
  - "The WebSocket proxy route that collects the frames and the rest of the Live route (vertex_ai_live_passthrough_endpoint) belong to the realtime and pass-through route tasks, not here."
  - "completion_cost, the calculator behind _response_cost_calculator, and the cost breakdown store belong to B068, B1717 and B1682; this task calls them."
  - "Dispatching the result to callbacks and writing the spend row belong to B3607."
pitfalls:
  - "Grounding in a Live session sits in serverContent.groundingMetadata frames, never in usageMetadata, so the Search and Maps charge comes from the frame scan in the turn split and not from the token counts."
  - "The session usage is built from all snapshots, but the grounding sum and the cost use turns, so a groundingMetadata frame after the last usageMetadata frame is missing from both the usage grounding fields and the priced turns."
  - "The residual for a lone entry without tokenCount is worked out per snapshot against that snapshot's own declared count, before summing; resolving it against the summed count gives a different answer when turns differ."
  - "promptTokenCount 0 is falsy in LiteLLM, so prompt_tokens falls back to the sum of the TEXT/AUDIO/IMAGE/VIDEO totals and total_tokens falls back to prompt plus completion; the same for toolUsePromptTokenCount 0 becoming None."
  - "A modality outside TEXT, AUDIO, IMAGE and VIDEO (DOCUMENT, or lowercase 'text') is summed into the aggregate list but never reaches the usage record's detail fields."
  - "The calculator rewrites logging_obj.cost_breakdown on every turn, so after a failed session merge the logging object holds the last priced turn's breakdown, not the merged one."
  - "margin_fixed_amount in the merged breakdown is the first turn's value (a flat fee), while margin_total_amount is the sum minus the duplicated fixed fees; summing both would charge the fee once per turn."
  - "additional_costs and billed_token_rates are not passed to set_cost_breakdown, so a turn's extra costs vanish from the stored session breakdown."
  - "kwargs gets model and custom_llm_provider only on the path that returns a response; the no-usage and error paths hand back the kwargs untouched."
  - "The safe-model regex ends in $, which in Python also matches before a trailing newline, so a model name ending in a newline is logged as is; it only affects the debug line."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
