dod:
  - text: "`get_settings` answers the stored names in LiteLLM's order, leaves `max_retries` out until an update sets it, adds the dumped routing groups, and gives the latency args as text for `latency-based-routing`."
    proof: [settings-get]
  - text: The five integer settings follow `int()`, and a value it refuses is an error naming the key.
    proof: [settings-int, oracle]
  - text: A retry policy object is stored with every field, null clears it, and any other value keeps the old policy.
    proof: [settings-policy, oracle]
  - text: A changed strategy runs lar1 or the strategy init with LiteLLM's args, changed args run the args step once after the loop, and pre-call checks run in place and are not stored.
    proof: [settings-strategy, oracle, helper-python]
  - text: Routing groups are rebuilt with the new input or the stored one, and the stored input changes only when the rebuild succeeded.
    proof: [settings-groups, oracle]
  - text: Guardrail selection keeps only the asked name, fails with LiteLLM's message when none matches, and can pick every entry of a shared name.
    proof: [guardrail-select, oracle]
  - text: New helper corpus seeds call `b9711` and replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional:
  - mutants
  commands:
  - id: settings-get
    why: A name is missing, out of order, or `max_retries` shows before it is set.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_runtime_settings::tests::get_settings_/)'
  - id: settings-int
    why: A float, a numeric string or a bad value is handled unlike `int()`.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_runtime_settings::tests::update_int_/)'
  - id: settings-policy
    why: A retry policy is stored partly, or a non-object value replaces it.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_runtime_settings::tests::update_policy_/)'
  - id: settings-strategy
    why: A strategy change does not re-init, or the args step runs per pair instead of once.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_runtime_settings::tests::update_strategy_/)'
  - id: settings-groups
    why: A failed rebuild still replaces the stored groups input.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_runtime_settings::tests::update_groups_/)'
  - id: guardrail-select
    why: Another name is picked, the message differs, or an entry of a shared name is never picked.
    run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^router_guardrail_selection::tests::select_/)'
  - id: helper-python
    why: The b9711 adapter must exist and pass ruff and basedpyright.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b9711)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b9711 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b9711/pyrightconfig.json
  - id: helper-case-corpus
    why: b9711 needs fresh seeds that replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/router-runtime-settings-*")" && grep -lE '^[[:space:]]+b9711:' tools/oracle/fuzz/corpus/helper_case/router-runtime-settings-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/router-runtime-settings
deviations: []
out_of_scope:
  - "Applying saved settings and logging invalid routing groups is B8381's; `/config/update` and its allowlist check are B8594's; the router settings in `/get/config/callbacks` are B8596's, and their HTTP acceptance is B9772's."
  - "The steps behind the target: B364 (`set_optional_pre_call_checks`), B395 (`routing_strategy_init`, `_apply_updated_routing_strategy_args`), B350 (`apply_lar1_routing_strategy`), B323 (`_init_routing_groups` and the group dump). The target implementation over the live router belongs to the router's owner in each host: B8381 in the proxy, B162 in the Python wheel."
  - "Building `RouterGuardrail` and the list is B3683's; running the picked guardrail's hook is B8392's, behind its `GuardrailBalancer` trait."
  - "`Router.aguardrail` and `Router._aguardrail_helper` (L5183-L5239): no caller at the pin, so they are not built."
pitfalls:
  - "`update_settings` truncates `timeout: 30.5` to 30 with `int()`, while the constructor keeps a float timeout."
  - "`routing_strategy` is compared with the snapshot taken before the loop, so sending the strategy the router already has re-inits nothing and leaves the routing groups alone."
  - "The strategy init gets `routing_strategy_args` or `{}`, but lar1 gets that pair or None."
  - "`optional_pre_call_checks` is applied inside the loop and never shows in `get_settings`."
  - "A `retry_policy` that is a list or a string is dropped without an error, and the old policy stays."
  - "There is no rollback: when the routing group rebuild fails, every pair before it stays applied."
  - "With `latency-based-routing`, `routing_strategy_args` in `get_settings` is a JSON string, not an object."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
