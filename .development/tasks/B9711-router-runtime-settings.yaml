id: B9711
title: Router runtime settings and guardrail selection
description: >-
  Two things on LiteLLM's `Router` change or answer while the proxy runs, and no task builds either. First, router settings saved in the database (through `/config/update`, B8594) reach the live router on the next reconcile: B8381's `_apply_router_settings` calls `Router.update_settings(**router_settings)`, and the `/get/config/callbacks` route (B8596) shows `Router.get_settings()`. Second, when several guardrails share one name, B8392's load balancing asks the router to pick one with `Router.get_available_guardrail`. The out_of_scope lines of the router tasks credited the settings pair to B066 and the guardrail methods to B086; neither builds them. Build both here.


  Settings go in `crates/betterlite-router/src/router_runtime_settings.rs` and `router_runtime_settings/**`. `RUNTIME_UPDATABLE_ROUTER_SETTINGS` is a public array of LiteLLM's 18 names from constants.py L13-L34: `routing_strategy_args`, `routing_strategy`, `routing_groups`, `allowed_fails`, `cooldown_time`, `num_retries`, `timeout`, `max_retries`, `retry_after`, `fallbacks`, `context_window_fallbacks`, `retry_policy`, `model_group_retry_policy`, `model_group_alias`, `enable_weighted_failover`, `enable_tag_filtering`, `tag_routing_prefix` and `optional_pre_call_checks`. `RouterRuntimeSettings` holds the current values as a `serde_json::Map` plus `routing_groups_input: Option<Value>`. Whoever builds the router fills it with the values `Router.__init__` stores, which is every name of the `get_settings` list below except `max_retries`, since `__init__` never sets that attribute.


  `get_settings(&self, view: &SettingsView) -> Map` is router.py L12185-L12225. It answers, in this order, each of `routing_strategy_args`, `routing_strategy`, `allowed_fails`, `cooldown_time`, `num_retries`, `timeout`, `max_retries`, `retry_after`, `fallbacks`, `context_window_fallbacks`, `model_group_retry_policy`, `retry_policy`, `model_group_alias`, `enable_weighted_failover`, `enable_tag_filtering` and `tag_routing_prefix` that the map holds, then `routing_groups`. `SettingsView` carries what lives in other tasks' state: `routing_groups` (the router's groups already dumped by B323, each without `model_priorities` when that is null) and `latency_routing_args: Option<String>`. When `routing_strategy` is `latency-based-routing` and the caller passes latency args, `routing_strategy_args` is that text, the `.json()` string of the latency handler's routing args, not an object.


  `update_settings(&mut self, target: &mut dyn RouterSettingsTarget, kwargs: &[(String, Value)]) -> Result<(), RouterSettingsError>` is L12227-L12291, with `kwargs` in the caller's order. It snapshots `get_settings` first, then goes through the pairs. A name outside the 18 is skipped with the debug log "Setting %s is not allowed". `timeout`, `num_retries`, `retry_after`, `allowed_fails` and `cooldown_time` are stored as Python's `int()` gives them: an integer as is, a float truncated toward zero, a string parsed as a base-10 integer after trimming whitespace; any other value or a failed parse is `RouterSettingsError::NotAnInteger` naming the key. `routing_groups` only marks the groups for rebuilding. `optional_pre_call_checks` calls `target.set_optional_pre_call_checks(value)` at once and stores nothing. `retry_policy`: an object is checked against B306's retry policy type (the nine `*Retries` fields, unknown keys ignored, a wrong field type is `RouterSettingsError::RetryPolicy`) and stored as the full policy with null for unset fields; null is stored as null; any other value is ignored and the old policy stays. Every other name is stored as given. For `routing_strategy`, when the value differs from the snapshot, call `target.apply_lar1(args)` for `lar1` with `args` the `routing_strategy_args` pair or None, else `target.init_routing_strategy(value, args)` with `args` that pair or an empty object, and mark the groups for rebuilding. For `routing_strategy_args`, remember whether the value differs from the current one. After the loop, call `target.apply_updated_strategy_args()` when the args changed, and when the groups are marked, call `target.init_routing_groups(input)` with the `routing_groups` pair or else `routing_groups_input`, and store `input` as the new `routing_groups_input` only when that call succeeded. Finish with the debug log "Updated Router settings: %s".


  `RouterSettingsTarget` is the trait the router owner implements over its live state: `set_optional_pre_call_checks` (B364), `init_routing_strategy` and `apply_updated_strategy_args` (B395), `apply_lar1` (B350) and `init_routing_groups` (B323). Each returns `Result<(), RouterSettingsError>`, and `RouterSettingsError::Target { name, message }` carries the error of the step that failed, so B8381 can tell an invalid `routing_groups` (LiteLLM's `TypeError` or `ValueError`, which it logs and skips) from the rest.


  Guardrail selection goes in `crates/betterlite-guardrails/src/router_guardrail_selection.rs` and `router_guardrail_selection/**`, next to B3683's `RouterGuardrail`. `select_router_guardrail<'list, R: rand::Rng>(guardrails: &'list [RouterGuardrail], guardrail_name: &str, rng: &mut R) -> Result<&'list RouterGuardrail, GuardrailSelectionError>` is L5241-L5270: keep the entries whose `guardrail_name` equals the name; none is `GuardrailSelectionError::NotFound` with the text "No guardrail found with name: {guardrail_name}"; one is returned as is; several are picked uniformly. LiteLLM hands several to `simple_shuffle`, but a router guardrail entry carries only `guardrail`, `mode`, `api_key` and `api_base` in its params, so no `weight`, `rpm` or `tpm` is ever there and `simple_shuffle` falls through to `random.choice`. Add `rand` to crates/betterlite-guardrails/Cargo.toml with the version betterlite-router uses.


  Tests: `router_runtime_settings/tests.rs` with names that start with `get_settings_`, `update_int_`, `update_policy_`, `update_strategy_` and `update_groups_`, using a recording target; `router_guardrail_selection/tests.rs` with names that start with `select_`, using a seeded `rand::rngs::StdRng` to show that every entry of a shared name can be picked. The helper operation for this task takes `function`. `settings` takes `initial` (constructor arguments, only `routing_strategy`, `routing_strategy_args` and `routing_groups`) and `kwargs` (a list of name and value pairs). The Python side builds `Router(model_list=[], **initial)`, replaces `routing_strategy_init`, `set_optional_pre_call_checks`, `_apply_updated_routing_strategy_args` and `_init_routing_groups` on the instance and `apply_lar1_routing_strategy` in `litellm.router_strategy.lar1_routing` with recorders, calls `update_settings`, and answers `{"settings": {name: value}, "calls": [[step, argument]], "error": null or {"type", "message"}}`, where `settings` holds, for each name in `kwargs` that `get_settings` lists, its value after `fastapi.encoders.jsonable_encoder`, the way the route prints it. The Rust side seeds `RouterRuntimeSettings` with `initial`, runs the same pairs against a recording target and answers the same shape. `guardrail` takes `guardrails` (entries with `guardrail_name`, `id` and `litellm_params`) and `guardrail_name`, and both sides answer the picked entry's `guardrail_name` and `id`, or the error type and message; cases never hold two entries with the asked name, since the pick is random.
