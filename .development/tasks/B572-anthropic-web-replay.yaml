pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_web_replay in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/web_replay.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_web_replay.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A parseable server_tool_use is correlated by id without checking its name is web_search.
- One encrypted item protects the entire result tuple from flattening.
