id: B572
title: Anthropic web-search replay flattening
description: >-
  Add typed WebReplay projections for unencrypted server-tool/web-search history correlated within each message.
  Preserve encrypted result blocks, correlate tool-use ids and render only the source-supported search result fields;
  no provider request is executed by this transform.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  _flattenable_web_search_tool_result L1577-L1588; _replayed_server_tool_use L1591-L1595; _render_web_search_results
  L1598-L1618; _rewrite_replayed_web_search_block L1621-L1634; _flatten_web_search_results_in_message L1637-L1660;
  flatten_unencrypted_web_search_results_in_anthropic_messages L1663-L1678; _ReplayedSearchQuery L1529-L1532; _ReplayedWebSearchResult
  L1535-L1542; _ReplayedWebSearchToolResultError L1545-L1549; _ReplayedWebSearchToolResult L1552-L1557; _ReplayedServerToolUse
  L1560-L1565; _TextBlock L1568-L1570.


  Own the _ReplayedSearchQuery, _ReplayedWebSearchResult, _ReplayedWebSearchToolResultError, _ReplayedWebSearchToolResult,
  _ReplayedServerToolUse and _TextBlock declarations in common_utils.py:1529-1572, including extra=allow and default
  query/text fields.


  Named case contracts: unencrypted_search_result: Parse required literal web_search_tool_result, string tool_use_id
  and content as result tuple or web_search_tool_result_error. Result type is web_search_result with string url/title/snippet/encrypted_content
  default empty; error_code defaults empty; allow extra fields. Missing/wrong typed values leave the original block
  untouched. Render type=text only, dropping original extras. encrypted_search_preserved: Any truthy encrypted_content
  in any result protects the whole result block; empty encrypted_content does not. Invalid or encrypted blocks are
  unchanged; without a flattenable result the whole message is unchanged. Handle any mapping message with nonstring
  sequence content, regardless of role. server_tool_correlation: Correlate within the same message, independent
  of block order. Parse server_tool_use with required string id, input.query default empty, extra=allow; name is
  not checked. Last duplicate query id wins. Drop all parseable uses whose id occurs among flattenable results;
  preserve unrelated/invalid uses and flatten results even without matching use. missing_search_title_url: Header
  is Web search results for '<query>': when query truthy, else Web search results:. Preserve verbatim query. Nonempty
  title/url/snippet render Title: / URL: / Snippet: in that order joined by newline; results separated by two newlines.
  Empty list appends two newlines plus No results were returned.; error result appends Search failed: <error_code
  or unavailable>. One all-empty result renders only header, while multiple empty results preserve join-generated
  blank lines.


  Implement crates/betterlite-anthropic/src/web_replay.rs with adjacent tests under web_replay/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_web_replay in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function web_replay_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  unencrypted_search_result, encrypted_search_preserved, server_tool_correlation, missing_search_title_url. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_web_replay* using HelperCase: kind:
  helper and the externally tagged anthropic_web_replay variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_web_replay that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 118 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 180 behavior/config-test lines,
  90 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 485 planned, 500 maximum changed lines.
