id: B026
title: Foundry provider operation composition
description: >-
  Compose Foundry chat, image/text embedding, Anthropic and agents adapters using typed route results. Own main.py
  _complete_azure_ai; embeddings and redirect resolution remain with B552/B174 and are composed through their existing
  contracts. B698 installs all resource operations.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/main.py: _complete_azure_ai
  L1617-L1768.


  Agents and Claude calls without api_base raise ValueError. For Claude strip the base trailing slash, collapse
  any existing /anthropic suffix, and append /anthropic/v1/messages unless it already ends /v1/messages. Embedding
  api_base ranks explicit, litellm.api_base, AZURE_AI_API_BASE; api_key ranks explicit, litellm.api_key, AZURE_AI_API_KEY,
  then get_azure_ai_entra_token. Command-r messages stringify tool-call content; the 422 repair uses B551.


  Provider composition changes existing chat dispatch, not route registration: add the HTTP dispatch case through
  the booted proxy for POST /v1/chat/completions and /chat/completions with the source provider prefix. Assert upstream
  request, auth, response status, error type/param/code and response headers. Keep the existing router as the sole
  route owner; pure helper cases exercise the other typed provider operations without calling FastAPI globals.


  Named case contracts: foundry_chat_dispatch: Resolve B549 get_azure_ai_route first. Agents wins even if the model
  also contains claude. Otherwise case-insensitive claude selects B563; remaining models use B010 HTTP completion
  with B550/B551 config behavior. Each branch resolves base/key through B549; do not apply OpenAI or Azure chat
  defaults here. foundry_embedding_dispatch: Compose B552 text/image embedding adapters with their own B549 credential
  resolution. The embedding base chain explicit/global/AZURE_AI_API_BASE and key chain explicit/global/AZURE_AI_API_KEY/Entra
  are owned by those leaves, not by an invented branch in _complete_azure_ai. foundry_anthropic_dispatch: Drive
  both sync/async Claude returns through B563 and compare Anthropic provider model/header conversion and failures
  with the same selected base/key. foundry_agent_dispatch: Drive B562 agent calls with agent identifiers, stream
  and nonstream modes and verify its create-message/run/poll behavior remains owned by that leaf. agents_missing_base:
  The agents branch rejects only resolved api_base is None, ValueError: Azure AI Agents requests require an api_base.
  Set `api_base` or the AZURE_AI_API_BASE env var. Then call B562 with headers or global litellm.headers, stream/acompletion
  and the original optional map; this branch does not insert extra_headers or perform the later chat post_call.
  claude_missing_base: Claude rejects only resolved api_base is None, ValueError: Azure Anthropic requests require
  an api_base. Set `api_base` or the AZURE_AI_API_BASE env var. It passes the supplied headers directly (no global
  fallback), global custom_prompt_dict rather than the caller value, and the supplied client to B563. claude_url_rewrite:
  For a truthy Claude base strip trailing slashes. Preserve any exact /v1/messages suffix. Otherwise split at the
  first /anthropic substring if present, discard everything after it, append /anthropic, then /v1/messages; without
  that substring append both. This is literal string handling, not URL path parsing; an empty base bypasses rewriting.
  command_r_tool_content: Only the case-sensitive command-r substring in a non-Claude/non-agent model triggers B182
  stringify_json_tool_call_content. Preserve its JSON stringification and message order; Command-R does not trigger
  it. Normal headers use supplied truthy map or global headers; non-None extra_headers, including {}, overwrites
  the optional map. foundry_post_call: Claude post_call runs for truthy stream or acompletion is True and carries
  no additional_args.headers. Normal execution exceptions post_call the original error string plus headers then
  rethrow; only truthy stream triggers normal success post_call. Normal preparation errors occur outside the catch,
  and agent/Claude errors are not caught here.


  Write standalone Rust test foundry_provider_credential_identity_isolation in betterlite-provider: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test foundry_provider_secret_safe_failure in betterlite-provider: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  The B182 command-r helper changes only role=tool with string content that fails JSON decoding: replace it with
  JSON text {"result": original_content}. Already valid JSON text is unchanged, including scalar JSON; nonstring
  content is unchanged. The helper mutates the messages in place.


  Use B2230 for the shared Azure o-series predicate/Foundry route selector called by this dispatch branch; concrete
  provider transforms remain with their named leaves.


  Direct constructor/helper prerequisites used by this slice: B560. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-provider/src/foundry_dispatch.rs with adjacent tests under foundry_dispatch/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; leaf
  crates remain below this dispatcher and never import it. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function foundry_dispatch_cases in betterlite-provider with these exact named cases (one per oracle
  file): foundry_chat_dispatch, foundry_embedding_dispatch, foundry_anthropic_dispatch, foundry_agent_dispatch,
  agents_missing_base, claude_missing_base, claude_url_rewrite, command_r_tool_content, foundry_provider_dispatch_http,
  foundry_post_call. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_provider* using HelperCase: kind: helper
  and the externally tagged foundry_provider variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_foundry_provider that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 127 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 180 production lines, 255 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 590 planned, 600 maximum changed lines.
