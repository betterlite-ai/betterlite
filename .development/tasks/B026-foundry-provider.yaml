id: B026
title: Foundry provider operation composition
description: >-
  Compose Foundry chat, image/text embedding, Anthropic and agents adapters using typed route results. Own main.py
  _complete_azure_ai and the Azure AI embedding branch. The azure-openai-redirect case must call Provider::Azure,
  which is the direct reason for depending on B025. B698 installs all resource operations.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/main.py: _complete_azure_ai
  L1617-L1768.


  Agents and Claude calls without api_base raise ValueError. For Claude strip the base trailing slash, collapse
  any existing /anthropic suffix, and append /anthropic/v1/messages unless it already ends /v1/messages. Embedding
  api_base ranks explicit, litellm.api_base, AZURE_AI_API_BASE; api_key ranks explicit, litellm.api_key, AZURE_AI_API_KEY,
  then get_azure_ai_entra_token. Command-r messages stringify tool-call content; the 422 repair uses B551.


  Provider composition changes existing chat dispatch, not route registration: add the HTTP dispatch case through
  the booted proxy for POST /v1/chat/completions and /chat/completions with the source provider prefix. Assert upstream
  request, auth, response status, error type/param/code and response headers. Keep the existing router as the sole
  route owner; pure helper cases exercise the other typed provider operations without calling FastAPI globals.


  Implement crates/betterlite-provider/src/foundry_dispatch.rs with adjacent tests under foundry_dispatch/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation foundry_provider in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function foundry_dispatch_cases in betterlite-provider with these exact named cases (one per oracle
  file): foundry_chat_dispatch, foundry_embedding_dispatch, foundry_anthropic_dispatch, foundry_agent_dispatch,
  azure_openai_redirect, agents_missing_base, claude_missing_base, claude_url_rewrite, embedding_entra_key, command_r_tool_content,
  foundry_provider_dispatch_http. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream
  request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_provider* using HelperCase: kind: helper
  and the externally tagged foundry_provider variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_foundry_provider that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 127 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 155 production lines, 144 behavior/config-test lines,
  99 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 423 planned, 425 maximum changed lines.
