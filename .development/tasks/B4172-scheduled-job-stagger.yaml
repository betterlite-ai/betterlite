oracle_cases: []
deviations: []
out_of_scope:
  - "The job registration, scheduler lifecycle and calling convention: apply_scheduled_job_stagger is a pure function that modifies triggers, not a server startup step."
  - "The callback integration with FastAPI or any HTTP framework. attach_job_timing_logger is framework-agnostic."
  - The actual jobs' behavior; staggering only shifts their fire times.
pitfalls:
  - "offset_seconds uses sha256 digest[:8].from_bytes(big_endian) % window, not random offsets. The hashing is stable per process for logging and reproducibility."
  - "resolve_stagger_identity includes os.getpid(), which changes across restarts, so offsets change too. That is intentional: it stops a simultaneous rollout from converging onto the same instant."
  - "_is_staggerable checks hasattr(job, \"next_run_time\"), not job.trigger.next_run_time; APScheduler stores this on the job object."
  - "_window_for uses min() on a filtered tuple. If every limit is None (no period, no default cron horizon), the job has no staggerable trigger and should not reach this code; the caller must check _is_staggerable first."
  - "_clamped_override warns about \"replica duplication\" when override >= horizon, but the problem is jobs that fire while another is still running. An override of horizon-1 is the safe fallback, not horizon."
  - "_OffsetTrigger delegates with shifted clock arguments but returns a result shifted back; a trigger that does its own rounding (e.g., cron with minute granularity) will round the shifted time, not the rounded time shifted. The shifted behavior preserves the trigger's original semantics."
  - "Logging identity, window and applied offsets happens once during apply_scheduled_job_stagger; if a second caller applies stagger to the same scheduler, the log is not repeated."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
