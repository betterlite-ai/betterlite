id: B4172
title: Scheduled job staggering and process state
description: >-
  Build typed configuration and application of deterministic schedule offsets for the proxy's background jobs, keeping different jobs and different replicas on different firing instants.
  Add ScheduledJobStaggerSettings to betterlite-config and extend its loader to parse general_settings.scheduled_job_stagger, warning and defaulting on invalid input.
  Implement the offset calculation algorithm: hash sha256(job_id + NUL + identity) and use the first eight bytes big-endian modulo the window.
  Preserve staggerable job detection (interval jobs always, cron jobs only if their id is in LiteLLM's default list, jobs with explicit next_run_time are never shifted).
  Preserve window bounds: interval jobs offset by at most one period, cron jobs by at most their leader-election span (monthly-report/fallback-stats 3600s, PTU 900s).
  Clamp operator overrides to the job's dedup horizon minus one when they would separate replicas beyond the dedup span.
  Build the _OffsetTrigger wrapper that composes with any trigger, delegating to the base trigger with a shifted clock.
  Implement the scheduler sweep that modifies each eligible job's trigger before the scheduler starts, and the callback that logs job submissions with their scheduled vs actual start times.
  Build ProxyState with get/set methods for process-local variables like spend_logs_row_count, initialized to zero.
  Identity defaults to configured value or POD_NAME env var or HOSTNAME env var or socket.gethostname() or a UUID.
  Do not check enabled in stagger_trigger itself; its caller controls that.
scope:
  paths:
    - crates/betterlite/src/scheduled_job_stagger.rs
    - crates/betterlite/src/scheduled_job_stagger/**
    - crates/betterlite/src/proxy_state.rs
