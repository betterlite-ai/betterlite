dod:
  - text: betterlite-config loads general_settings.scheduled_job_stagger through the config loader and returns ScheduledJobStaggerSettings with defaults enabled=true, window=300 seconds, identity absent, offsets empty.
    proof: [config-stagger-defaults]
  - text: "Invalid scheduled_job_stagger config warns and falls back to defaults instead of failing startup (e.g. general_settings.scheduled_job_stagger.window_seconds: -1 logs a warning and uses the default 300)."
    proof: [config-stagger-invalid]
  - text: offset_seconds(job_id, identity, window_seconds) returns a stable value in [0, window_seconds) using sha256(job_id + NUL + identity) big-endian modulo window, and returns 0 for window_seconds <= 0.
    proof: [offset-calculation]
  - text: resolve_stagger_identity detects hostname from configured value or POD_NAME or HOSTNAME or socket.gethostname() or a UUID, including the process PID in the result.
    proof: [identity-resolution]
  - text: Interval jobs are always staggerable; cron jobs only if their id is one of MONTHLY_SPEND_REPORT_JOB_ID, PROMETHEUS_FALLBACK_STATS_JOB_ID, PTU_ROLLUP_JOB_ID; jobs with explicit next_run_time are never staggerable.
    proof: [staggerable-detection]
  - text: Window bounds are job-specific and minimum with settings.window_seconds, the interval period if the job is an interval trigger, and DEFAULT_CRON_DEDUPE_SECONDS.get(job_id); interval jobs never offset by more than one period, cron jobs never by more than their dedup horizon.
    proof: [window-bound]
  - text: Operator overrides in settings.offsets are clamped to the job's dedup horizon minus one if they would exceed that horizon, with a warning logged.
    proof: [override-clamping]
  - text: apply_scheduled_job_stagger modifies every eligible job's trigger before the scheduler starts, warns if the scheduler is already running, respects settings.enabled, and returns a mapping of applied offsets including zeroes.
    proof: [apply-stagger]
  - text: ProxyState.get_proxy_state_variable and set_proxy_state_variable manage spend_logs_row_count starting at zero, with type-safe access.
    proof: [proxy-state-tests]
  - text: attach_job_timing_logger registers a callback that logs each job submission with scheduled and actual start times, computing the delay.
    proof: [job-timing-logger]
  - text: Every mutant in the stagger and state implementations is caught by a test.
    proof: [mutants]
