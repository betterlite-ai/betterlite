deviations:
  - what: GET /health and the background loop report an embedding or text completion deployment as unhealthy with B4449's probe error.
    why: B4449's EmbeddingProbeCall and TextCompletionProbeCall have no production owner yet; LiteLLM's health check calls litellm.aembedding and atext_completion directly, and B8631's RouterEmbedder goes through the router and proxy hooks instead. This task passes `UnavailableProbe`, which implements both traits and returns B4449's HealthProbeError naming the mode.
out_of_scope:
  - "Route behavior: B4444 (/health/shared-status), B4445 (/health, /health/history, /health/latest), B4446 (/health/test_connection), B4447 (/test, /health/services) and B4448 (readiness, drain, backlog and the rest)."
  - "The health cycle, probe modes and persistence: B4443, B4440 to B4442 and B7640."
  - "The background health loop and its db-save gating (proxy_server.py L4265-L4678): B4444. Starting it at startup when background_health_checks is true is this task (see the description)."
  - "The lifespan order that calls start_shutdown and wait_for_drain: B8374. The ShutdownState in ServerState, the area aggregator calls and the move of B003's handlers out of routes.rs: B8610."
pitfalls:
  - B8610 moves B003's three health handlers into the app/health.rs stub; replace them there in the same change, or the merged router panics on a duplicate /health/readiness.
  - The auth exemption for /health/liveliness, /health/liveness and /health/readiness lives in auth.rs and must not move into the health router, since B052's auth layer runs before it.
  - openmeter, braintrust and generic_api run the mock completion even when they are not in success_callback, so the MockRequests adapter must not check the callback list itself.
  - The response cache and the coordination Redis are different objects; redis_configured is true when either one or the router's own Redis exists.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
