id: B8540
title: Mount the health routes and build their production adapters
description: >-
  The B130 parts each stop at a boundary. B4444 returns the GET /health/shared-status router, B4445 `health_status_routes(state)`
  for GET /health, /health/history and /health/latest, B4446 the POST /health/test_connection router, B4447
  `health_services_routes(state)` for GET /test and /health/services, and B4448 `readiness_routes(state)` for readiness, details,
  backlog, drain, license, OPTIONS, /settings and /active/callbacks. B4447 and B4448 define traits with fakes and leave the real
  implementations to the umbrella. Nothing merges these routers yet. This task joins them in the area app::health, mounted through
  B8610's aggregator like every other area: crates/betterlite-server/src/app/health.rs holds `mount`, `mount_public` and `start`,
  and app/health/ holds compose.rs, services.rs, readiness.rs and tests.rs (declared by the skeleton), following the composition style
  of .development/tasks/B8157-self-hosted-dispatch.yaml and .development/tasks/B8399-proxy-logging-wiring.yaml. This task never edits
  routes.rs, server.rs or app.rs: B8610 calls health::mount, mount_public and start, holds the server's B4448 ShutdownState in
  ServerState, and moves B003's three health handlers out of routes.rs into the app/health.rs stub, which this task replaces.

  compose.rs. `HealthSlot` (crates/betterlite-server/src/state/health.rs and state/health/, a ServerState slot built once with
  `HealthSlot::new(config: &Config, shared: &Shared)` like every B1100 slot, no globals, no lazy statics) holds the state values each
  part's route function takes and B4444's `HealthResultsCache` as its only Arc, so mount and start use the same cache. `mount` builds
  the five routers from that slot, calling each route function exactly once, and merges them inside the key auth layers: their
  public paths (readiness, drain, the OPTIONS paths) pass through the exemption lists B003 and B4448 keep in auth.rs and route_match.rs.
  `mount_public` adds GET /health/liveliness and GET /health/liveness, which LiteLLM serves with no key. Those two keep B003's bodies
  (200 with the JSON string "I'm alive!", or 503 with `{"status": "shutting_down"}` once shutdown started) and read the B4448
  `ShutdownState` that ServerState holds, the value B8374's lifespan teardown calls start_shutdown and wait_for_drain on, so the
  server's shutdown flips what the routes read. B4448's readiness router gets that same ShutdownState. The auth exemption lists in
  crates/betterlite-server/src/auth.rs and auth/route_match.rs stay as they are.

  B4445's `HealthResultsSource` returns the cache that the background health loop fills. That loop is B4444's `health_shared::background_loop` (proxy_server.py L4265-L4678,
  _run_background_health_check and the db-save helpers around it): it calls B4443's perform_health_check, B4444's perform_shared_health_check and B7640's
  changed-result save, and the results cache it fills is B4444's `HealthResultsCache`, its implementation of `HealthResultsSource`. HealthSlot holds that cache and hands it to B4445's routes,
  and `start` hands the same Arc to the loop. When `use_background_health_checks` is false the loop does not run and B4445 never reads the source, so its
  empty cache changes nothing a user sees in that mode. `start` reads general_settings.background_health_checks once (LiteLLM's use_background_health_checks, acted on at proxy_server.py L1523-L1524): when it is true it spawns background_loop on the server's TaskTracker (the tracker behind shared.http, B8610) and returns; when it is false or absent nothing is spawned.

  services.rs implements B4447's traits over the real crates. `MockRequests` calls B5656's completion entry with exactly the
  arguments B4447's text gives (model `openai/litellm-mock-response-model`, the one user message, user `litellm:/health/services`,
  mock_response `This is a mock response`), so no network call happens. `IntegrationChecks`: datadog() over B3933's health check,
  datadog_metrics() over B3939's, arize() over B3862's, galileo() over B3964's, newrelic() over B3942's, sqs() over B3995's,
  pointfive() over B3074's (its missing-key error maps to `PointFiveSetupError` with the same text) and langfuse_auth_check() over
  B3904's project lookup. Each method builds its logger from the settings that logger already reads; none reads a new env var.
  `AlertActions`: send_user_budget_test builds B4025's CallInfo (spend 1, max_budget 0) and calls its budget alert entry with type
  user_budget; the Slack methods (webhook_alert_types, active_alert_types, the send) go to B4020's settings and B4021's sender
  through B4024's destination selection; the two spend report spawns go to B4029; ms_teams_webhook_url reads B4020's settings and
  post_teams uses B4021's Adaptive Card builder with B173's pooled client; send_test_email calls B4023's
  send_key_created_or_user_invited_email; has_database answers whether the server holds a database pool. `CallbackSource` lists
  B189's registered success callbacks in registration order. `OcrProbe` implements B4449's `OcrProbeCall`: it turns B4440's ocr call arguments into B6809's aocr request, calls aocr and returns the response as B4449's reply with hidden_params.headers carried over; pass it to B4449's build_health_check_entry where the health check entry for these routes is built.

  readiness.rs implements B4448's traits. `DatabaseProbe`: configured() is whether DATABASE_URL produced a pool, health_check runs
  `SELECT 1` on B700's pool, attempt_reconnect forwards to B872's reconnect client with the reason and both timeouts it receives,
  and live_worker_count is B731's count_live_proxy_workers (its None stays None). `ReadinessSources`: success_callback_names from
  B189 through B4448's callback_name, cache_report from the server's response cache (None without one, its type string, or for a
  Redis semantic cache B4382's `RedisSemanticCache::index_info`), redis_configured true when the coordination cache or the router's
  own Redis exists, log_level from the active tracing level name, and version from the crate version.

  Tests in `app::health::tests` and `state::health::tests`: building the routers succeeds (a duplicate path would panic), every path and alias from the
  five parts answers something other than 404, liveliness and liveness answer without a key and flip to 503 after ShutdownState::start_shutdown, and each
  adapter forwards to the owning crate, OcrProbe included. start spawns the loop only when background_health_checks is true, and the loop fills the cache the /health route reads. Use the real B189 registry and fakes only where a crate needs a network or a database.

  HTTP oracle cases through the booted proxy, in tools/oracle/cases/health/wiring/: readiness-local-cache (config
  `litellm_settings: {cache: true, cache_params: {type: local}}`, GET /health/readiness, ignore /litellm_version and /db as
  tools/oracle/cases/auth/readiness.yaml does), liveness-alias (GET /health/liveness), services-openmeter-mock (GET
  /health/services?service=openmeter with the master key, which runs the mock completion), and services-ms-teams-no-webhook
  (general_settings.alerting ["ms_teams"], no MS_TEAMS_WEBHOOK_URL, the 422). The 17 HTTP cases of B4448 in tools/oracle/cases/health/ (readiness-public to active-callbacks, listed under oracle_cases) move here, because this task is the first to mount B4448's router; write each from B4448's text.
