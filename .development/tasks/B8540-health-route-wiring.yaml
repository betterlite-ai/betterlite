dod:
  - text: health::mount merges the five parts' routers once each inside the key layers, mount_public adds liveliness and liveness, and this task edits neither routes.rs nor server.rs.
    proof: [wiring-tests, oracle]
  - text: Liveliness, liveness and readiness read one ShutdownState that the server's shutdown path flips.
    proof: [wiring-tests, oracle]
  - text: The B4447 and B4448 traits have production implementations that forward to the crates that own each behavior.
    proof: [wiring-tests, oracle]
  - text: The four wiring cases match LiteLLM through the booted proxy.
    proof: [wiring-cases, oracle]
checks:
  optional: []
  commands:
    - id: wiring-tests
      why: The composed router, the ShutdownState handlers or an adapter is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::health::/) | test(/^state::health::/)'
    - id: wiring-cases
      why: Without new case files the oracle proof compares nothing for this task
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/health/wiring)"
