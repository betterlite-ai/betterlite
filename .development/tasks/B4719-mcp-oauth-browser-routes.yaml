id: B4719
title: MCP management OAuth browser navigation routes
description: >-
  Build the three routes the admin UI "Authorize and fetch token" flow calls from the browser, and the auth dependency that two of them use: GET /v1/mcp/server/oauth/{server_id}/authorize, POST /v1/mcp/server/oauth/{server_id}/token and POST /v1/mcp/server/oauth/{server_id}/register. LiteLLM mounts this router with the /v1/mcp prefix only, so there is no /mcp/... or /openai/v1/... alias. All three are include_in_schema=False, so they stay out of the OpenAPI document. The {server_id} is either a saved server (id or name), a config-declared server, or a temporary session made by POST /v1/mcp/server/oauth/session (B4718). The routes only choose the server, check OAuth rules that belong to the route and pick the arguments; the OAuth work itself (building the redirect, exchanging the code, registering a client) is done by the flow functions listed under Ports below.


  Code goes in betterlite-server, module mcp::oauth_routes: crates/betterlite-server/src/mcp/oauth_routes.rs (the router builder, the shared wire constants and the OauthRouteError enum with its status mapping), oauth_routes/ports.rs, oauth_routes/cookie_auth.rs, oauth_routes/route_auth.rs, oauth_routes/authorize_route.rs, oauth_routes/token_route.rs, oauth_routes/register_route.rs, oauth_routes/oauth2_gate.rs and a tests.rs beside each file. The worker of this task edits the manifests itself: it adds the jsonwebtoken dependency (for the cookie) and the form feature of axum to crates/betterlite-server/Cargo.toml, adds a [[bin]] entry for fuzz_targets/mcp_session_cookie.rs to crates/betterlite-server/fuzz/Cargo.toml, and lets Cargo.lock follow (jsonwebtoken is not pinned in Cargo.lock yet, so pick the current release and keep the lock change to that crate and its new dependencies). Nothing here keeps global state: the master key, the registry, B4718's SessionStore, the flow port, the auth port and the clock are fields of one struct, OauthRoutes, built by the composition root.


  Ports (traits in ports.rs, native async fn in the trait, taken as generics). LiteLLM imports these functions from discoverable_endpoints.py and _user_api_key_auth_builder from user_api_key_auth.py. B7321 implements the OauthFlows port with the discoverable_endpoints.py functions, so this task declares the trait and a fake, and the composition root wires B7321's implementation.

  1. OauthFlows has: `resolve_ephemeral_dcr_client(&self, request: &RequestParts, server: &MCPServer, code_challenge: Option<&str>, code_challenge_method: Option<&str>, redirect_uri: &str) -> Result<Option<EphemeralDcrClient>, FlowError>`; `authorize_with_server(&self, AuthorizeArgs) -> Result<FlowReply, FlowError>`; `exchange_token_with_server(&self, TokenArgs) -> Result<FlowReply, FlowError>`; `register_client_with_server(&self, RegisterArgs) -> Result<FlowReply, FlowError>`; the sync `redeem_passthrough_code(&self, code: Option<&str>, server: &MCPServer, code_verifier: Option<&str>) -> Result<Option<SealedCode>, FlowError>`; the sync `client_supplied_redirect_uris(&self, value: Option<&serde_json::Value>) -> Option<Vec<String>>`; and the sync `request_base_url(&self, request: &RequestParts) -> String` (B4654's get_request_base_url). The argument structs carry the same named fields as the Python keyword arguments (authorize: client_id, redirect_uri, state, code_challenge, code_challenge_method, response_type, scope, ephemeral_dcr_client; token: grant_type, code, redirect_uri, client_id, client_secret, code_verifier, refresh_token, scope, client_token_endpoint_auth_method; register: client_name, grant_types, response_types, token_endpoint_auth_method, fallback_client_id, persist_credentials, client_redirect_uris), each with the server and the request. RequestParts is the method, uri, headers and client address of the request. EphemeralDcrClient has client_id: String and nothing else this task reads. SealedCode has upstream_code: String, client_id: Option<String>, client_secret: Option<SecretString> and token_endpoint_auth_method: Option<String>. FlowReply is a status, headers and a JSON or redirect body, returned to the client as is. FlowError is a status plus a JSON `detail` (string or object) and is returned as {"detail": <detail>} with that status.

  2. RouteAuth has `authenticate(&self, request: &RequestParts, api_key: &str, request_data: &serde_json::Map<String, serde_json::Value>) -> Result<UserApiKeyAuth, AuthFailure>` and is the composition root's handle on _user_api_key_auth_builder (B855 and the auth builders it composes, azure/anthropic/google/apim header arguments all empty or None, so only api_key and request_data matter). AuthFailure maps to the status and body the auth builder already defines; this task passes it through.

  The routes also call these existing pieces: B4718's SessionStore::cached_temporary_server_or_404 (`_get_cached_temporary_mcp_server_or_404`, signature: server_id, the caller's auth, the optional request; it returns the runtime MCPServer or a SessionError that already maps to 404 {"detail": {"error": "MCP server <id> not found"}} or 403 {"detail": {"error": "Access denied to MCP server <id>"}}); B4717's user_is_full_admin (`_user_is_full_admin`, true only for PROXY_ADMIN); B4731's server_by_id and server_by_name; B1100's request body reader (`_read_request_body`: it caches the parsed body, an empty body gives an empty object and a urlencoded or multipart form is parsed into an object); B1102's populate_request_with_path_params; B741's get_request_route; B6590's MCPServer with its methods has_client_credentials and the fields auth_type, client_id, delegate_auth_to_upstream, server_name and name.


  Build, in this order.

  A. cookie_auth.rs, `decode_session_cookie(token: &str, master_key: &SecretString, now: DateTime<Utc>) -> Option<String>` (the cookie part of `_mcp_oauth_user_api_key_auth`). This reads bytes from outside, so it is the fuzzed decoder. Decode token as an HS256 JWT signed with the master key, with exp not required and not checked and aud not checked. Return the claim `key` when the claim `login_method` is "sso" or "username_password" and `key` is a non-empty string. Every other outcome is None: bad signature, wrong algorithm, malformed token, missing or other login_method, missing, empty or non-string key. PyJWT still checks nbf and iat when present, so a token whose nbf or iat lies after `now` is also None (jsonwebtoken checks nbf only when asked; set validate_nbf true and compare iat by hand). A decode failure never raises, it is just None.

  B. route_auth.rs, `route_auth` (`_mcp_oauth_user_api_key_auth`), inputs: the request parts, the path params and the cookies. Steps in this order. (1) api_key is the raw Authorization header value, or "" when the header is missing. LiteLLM passes the whole value and the auth builder strips "Bearer "; do the same. (2) When api_key is empty, the master key is configured and the "token" cookie is present and non-empty, decode_session_cookie gives the user's key and api_key becomes "Bearer <key>"; None changes nothing. (3) When api_key is still empty and the path has a non-empty server_id: look the server up in the registry with server_by_id(server_id, None), and only when that finds nothing server_by_name(server_id, None) (the registry is the global manager; B4718 sessions are not consulted here). When a server is found and ALL of these hold: auth_type is exactly oauth2 (not true_passthrough or oauth_delegate), delegate_auth_to_upstream is true, and has_client_credentials is false, then: if the lowercase request route (B741 get_request_route) with trailing "/" removed ends with "/token", read the body with B1100; when body.grant_type equals "authorization_code" return UserApiKeyAuth::default() (an anonymous principal with no role and no key) and for any other grant_type, or none, fall through to step 4 so a refresh_token grant needs a normal key; when the route does not end with "/token" (the authorize route) return UserApiKeyAuth::default(). (4) Read the body (B1100), add the path params (B1102 populate_request_with_path_params) and call RouteAuth::authenticate with api_key and that data. Its error is returned unchanged, so no credentials gives the auth builder's 401.

  C. oauth2_gate.rs, `ensure_oauth2` (`_raise_if_not_oauth2`, discoverable_endpoints.py L697-L722), input: the server. Returns Ok for auth_type oauth2, true_passthrough and oauth_delegate (B6760's UPSTREAM_OAUTH_DISCOVERY_AUTH_TYPES). Any other type is 400 with {"detail": {"error": "server_not_oauth2", "message": "MCP server '<server_name or name>' does not use OAuth (auth_type=<auth_type>). This server does not support the authorization-code flow; it has no client_id, authorize, token, or registration endpoint. Access is controlled by the server's configured auth_type and access groups"}}. It is also called inside each flow function in LiteLLM; the routes call it first, so a flow implementation may call it again. It is written here because all three routes need it and no task owns it; the architect may move it (see notes). The text of <auth_type> is the string form LiteLLM prints for the enum value; confirm it with an oracle case run against the real proxy and match it, and use the plain value (api_key) only if LiteLLM prints that.

  D. authorize_route.rs, `mcp_authorize` for GET /v1/mcp/server/oauth/{server_id}/authorize, dependency route_auth (it runs before query validation, so a missing key is 401 even when redirect_uri is missing). Query: client_id, state (default ""), code_challenge, code_challenge_method, response_type, scope, all optional, and redirect_uri required; a missing redirect_uri is 422 in FastAPI's error shape {"detail": [{"type": "missing", "loc": ["query", "redirect_uri"], "msg": "Field required", "input": null}]}. Steps: (1) cached_temporary_server_or_404(server_id, auth, request); (2) ensure_oauth2; (3) stored_or_supplied is server.client_id, else the query client_id, else "" (an empty string counts as unset, like Python's `or`); (4) only when stored_or_supplied is empty, call resolve_ephemeral_dcr_client(request, server, code_challenge, code_challenge_method, redirect_uri), else the minted client is None; (5) resolved_client_id is stored_or_supplied, else the minted client's client_id, else ""; (6) an empty resolved_client_id is 400 {"detail": {"error": "missing_client_id", "message": "No client_id available for this MCP server. Either configure the server with a client_id or supply one in the request."}}; (7) return authorize_with_server with the resolved client_id, redirect_uri, state, code_challenge, code_challenge_method, response_type, scope and the minted client. The reply is returned as the flow gave it (a redirect or JSON).

  E. token_route.rs, `mcp_token` for POST /v1/mcp/server/oauth/{server_id}/token, dependency route_auth. Body is application/x-www-form-urlencoded with grant_type required and code, redirect_uri, client_id, client_secret, code_verifier, refresh_token, scope optional; a missing grant_type is 422 {"detail": [{"type": "missing", "loc": ["body", "grant_type"], "msg": "Field required", "input": null}]}. Steps: (1) cached_temporary_server_or_404; (2) ensure_oauth2; (3) only when grant_type == "authorization_code", sealed = redeem_passthrough_code(code, server, code_verifier) (its error is returned as is), otherwise sealed is None, so a refresh_token grant never opens a sealed code; (4) resolved_code is sealed.upstream_code when sealed, else code; (5) resolved_redirect_uri is "<request_base_url>/callback" when sealed, else the form redirect_uri; (6) the caller's client_id and client_secret are the sealed ones when sealed, else the form ones; (7) resolved_client_id is server.client_id, else the caller's client_id, else ""; empty gives the same 400 missing_client_id body as in D; (8) return exchange_token_with_server with grant_type, resolved_code, resolved_redirect_uri, resolved_client_id, the caller's client_secret, code_verifier, refresh_token, scope and client_token_endpoint_auth_method set to sealed's value or None.

  F. register_route.rs, `mcp_register` for POST /v1/mcp/server/oauth/{server_id}/register, dependency is the plain user_api_key_auth (Authorization and the other key headers, no cookie fallback and no anonymous PKCE bypass; this differs from authorize and token). Steps: (1) cached_temporary_server_or_404; (2) read the body with B1100 (an empty body gives {}); (3) client_redirect_uris is client_supplied_redirect_uris(body.redirect_uris); (4) return register_client_with_server with client_name body.client_name or "", grant_types body.grant_types or an empty list, response_types body.response_types or an empty list, token_endpoint_auth_method body.token_endpoint_auth_method or "", fallback_client_id the server_id from the path, persist_credentials true only when user_is_full_admin, and client_redirect_uris. Missing keys use .get defaults (""/[]) but an explicit JSON null stays null, since Python's .get returns the null; pass it through as the Option the port declares. Unlike authorize and token, register does not call ensure_oauth2 itself; the flow does. The register route does not use a cookie, so a browser needs the key in the header.

  Errors: OauthRouteError (thiserror) wraps SessionError (#[from]) and FlowError and AuthFailure with the status mapping above, and has a variant for the 400 bodies built here. All error bodies are {"detail": ...} and none is the OpenAI error shape.

  Tests use synthetic servers (ids test-oauth-1, urls https://mcp.example.test/sse), fakes for OauthFlows (records every argument it is called with and returns a fixed FlowReply), RouteAuth (records api_key and request_data) and the SessionStore lookup, and a fixed clock. HTTP oracle cases run the booted proxy with a master key and no database; they cover auth, 404 and 422 only, because the flow functions have no betterlite owner yet.

