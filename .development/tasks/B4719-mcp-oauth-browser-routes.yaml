  - tools/oracle/cases/http/mcp-oauth-routes/register-unknown-server-404.yaml

deviations:
  - what: The token route accepts application/x-www-form-urlencoded bodies; a multipart/form-data body is not parsed as the token form.
    why: The browser flow and OAuth clients send urlencoded forms (RFC 6749). FastAPI also accepts multipart here; a multipart body answers 422 for the missing grant_type instead.
  - what: The OAuth flow functions (authorize_with_server, exchange_token_with_server, register_client_with_server, resolve_ephemeral_dcr_client, redeem_passthrough_code, client_supplied_redirect_uris) are ports in this task, not built here.
    why: They belong to discoverable_endpoints.py, which no task owns at this commit. The routes are complete and tested against fakes, and the HTTP oracle cases stop at the checks before the flow.
  - what: A resolution without a runtime server is the 500 B4718 returns as a typed error, where LiteLLM's assert raises AssertionError.
    why: Production code carries no assert, and the case cannot occur with a temp lookup and a registry as the only sources.

out_of_scope:
  - "B4718 owns _get_cached_temporary_mcp_server_or_404, get_cached_temporary_mcp_server and the session store; this task calls cached_temporary_server_or_404."
  - "B4717 owns _user_is_full_admin; B2314 owns user_api_key_has_admin_view (B4718 calls it); B4731 owns resolve_mcp_server, authorize_mcp_server, get_mcp_server_by_id and get_mcp_server_by_name."
  - "B1100 owns _read_request_body, B1102 owns populate_request_with_path_params, B741 owns get_request_route, and B4654 owns get_request_base_url."
  - "_user_api_key_auth_builder and user_api_key_auth: owned by the auth admission tasks (B855, B875, B876 and the tasks they compose); this task calls them through the RouteAuth port."
  - "authorize_with_server, exchange_token_with_server, register_client_with_server, resolve_ephemeral_dcr_client, redeem_passthrough_code and client_supplied_redirect_uris (discoverable_endpoints.py): no owner found, declared as the OauthFlows port here and implemented by B7321."
  - "The other routes of mcp_management_endpoints.py (create, update, delete, health, credentials, toolsets, preview): owned by B4710 to B4730; the session route /server/oauth/session is B4718."

pitfalls:
  - Only the authorize and token routes use the cookie-and-anonymous dependency; register depends on plain user_api_key_auth, so a browser cookie alone gets 401 there.
  - The anonymous arm needs auth_type exactly oauth2; true_passthrough and oauth_delegate servers pass ensure_oauth2 but never get anonymous access.
  - A refresh_token grant on a delegating server must fall through to normal auth, because the token route attaches the stored client_secret to the upstream request.
  - The registry lookup in route_auth tries the id first and the name only when the id finds nothing, and it never reads B4718 temporary sessions, so an unsaved session always needs a real key.
  - The token path test is on the lowercased route with a trailing "/" removed, so /TOKEN/ also reads the body for grant_type.
  - Python `or` makes an empty string client_id on the server or the query count as missing, and an empty body field become the default.
  - The cookie claim is `key`, not `token` or `api_key`, and the new api_key is "Bearer <key>" with the prefix added here, while the header value is passed on untouched.
  - PyJWT with verify_exp false still rejects a token whose nbf or iat is in the future; a decoder that skips those lets a token through that LiteLLM refuses.
  - authorize calls resolve_ephemeral_dcr_client only when no client id exists; calling it always would mint a client for servers that already have one.
  - The sealed code applies to the authorization_code grant only, and with a sealed code the redirect_uri sent upstream is "<base_url>/callback", never the form value.
  - fallback_client_id for register is the path server_id (which may be a name), not the resolved server's server_id.
  - Errors from this router carry a detail field holding an object or a string, so the 404, 403 and 400 bodies are not the OpenAI error shape.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
