dod:
  - text: >-
      The three routes are registered at GET /v1/mcp/server/oauth/{server_id}/authorize, POST /v1/mcp/server/oauth/{server_id}/token and
      POST /v1/mcp/server/oauth/{server_id}/register, are left out of the OpenAPI document, and have no other alias.
    proof: [route-tests, oracle]
  - text: >-
      decode_session_cookie returns the key only for a valid HS256 token signed with the master key whose login_method is sso or
      username_password and whose key is a non-empty string, ignores exp and aud, and returns None for a bad signature, another
      algorithm, a malformed token, another login_method, a missing or empty key, and an nbf or iat in the future.
    proof: [route-tests, cookie-corpus]
  - text: >-
      route_auth uses the Authorization header first, then the cookie key as "Bearer <key>" only when the header is empty and a
      master key is set, and passes api_key and the body with path params to the auth port.
    proof: [route-tests]
  - text: >-
      route_auth returns the anonymous principal without a key only for an oauth2 server with delegate_auth_to_upstream true and no client
      credentials: on authorize always, on token only for grant_type authorization_code. A refresh_token grant, a missing grant_type,
      a true_passthrough or oauth_delegate server, a client_credentials server, a non-delegating server and an unknown server all fall
      through to normal authentication. A server found by name works the same as one found by id.
    proof: [route-tests]
  - text: >-
      authorize answers 401 for no credentials before query validation, 422 for a missing redirect_uri, 404 and 403 from the shared
      lookup, 400 server_not_oauth2 for a non-OAuth server, and 400 missing_client_id when neither the server, the query nor a minted
      client gives an id. It calls the client minting only when the stored and supplied ids are both empty.
    proof: [route-tests, oracle]
  - text: >-
      authorize passes the resolved client_id, redirect_uri, state (default empty), code_challenge, code_challenge_method,
      response_type, scope and the minted client to the flow, preferring the server's client_id over the query's.
    proof: [route-tests]
  - text: >-
      token answers 422 for a missing grant_type, redeems a sealed code only for the authorization_code grant, then uses the sealed
      upstream code, the sealed client id and secret, the "<base>/callback" redirect and the sealed auth method; without a sealed code it
      forwards the form values. The server's client_id wins over the caller's, and no id at all is 400 missing_client_id.
    proof: [route-tests, oracle]
  - text: >-
      register uses the plain key dependency (no cookie, no anonymous arm), reads the body with empty defaults, passes
      fallback_client_id as the path server_id, sets persist_credentials only for PROXY_ADMIN (not PROXY_ADMIN_VIEW_ONLY) and passes
      the validated redirect_uris.
    proof: [route-tests, oracle]
  - text: >-
      The cookie decoder is shared by production, the fuzz target and the committed corpus replay.
    proof: [cookie-corpus]

checks:
  optional:
    - mutants
  commands:
    - id: route-tests
      why: the route module's auth dependency, the cookie decoder, the three routes or the argument mapping have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_routes::/) - test(/::replays_cookie_corpus$/)'
    - id: cookie-corpus
      why: the cookie decoder has no fuzz target or no new seed, or its replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/mcp_session_cookie)" && test -f crates/betterlite-server/fuzz/fuzz_targets/mcp_session_cookie.rs && grep -qF "decode_session_cookie" crates/betterlite-server/fuzz/fuzz_targets/mcp_session_cookie.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_routes::cookie_auth::tests::replays_cookie_corpus$/)'

