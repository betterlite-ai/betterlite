id: B10105
title: Pass-through batch registrations finish before the server shuts down
description: >-
  Fix a LiteLLM bug that B3633 and B3641 copied. When a client creates or reads a batch through the Anthropic or
  Vertex AI pass-through route, LiteLLM stores the batch's managed object for cost tracking with asyncio.create_task
  and keeps no reference to the task, so nothing waits for it at shutdown. A batch accepted just before the server
  stops can lose that write, and its cost is never attributed. B3633 built the same thing in
  crates/betterlite-server/src/pass_through_logging/anthropic_batch/registration.rs and B3641
  (https://github.com/betterlite-ai/betterlite/pull/3190) in vertex_batch_logging/registration.rs: each calls
  runtime.spawn for the registry write and again for the task that logs its result, and drops both handles. B3641's
  review flagged it under the async-hygiene rule.


  betterlite already has the fix in one place. B3649 holds every TinyFish billing poller in BillingTasks
  (crates/betterlite-server/src/pass_through_logging/tinyfish/tasks.rs), a TaskTracker the server owns for its
  lifetime, with a shutdown that closes it and waits, and a drop guard that warns when a poller is cancelled. Move
  that type up to crates/betterlite-server/src/pass_through_logging/background_tasks.rs as BackgroundTasks, the one
  tracker every pass-through handler spawns its background work on, and delete tinyfish/tasks.rs. Its spawn takes
  the warning a cancelled task logs, so TinyFish keeps its warning word for word: "TinyFish passthrough: billing
  poller cancelled mid-poll; the run may go unbilled".


  Then put one helper in batch_attribution.rs that spawns a registry write and the logging of its result
  (log_batch_registration_result, as now) as one task on a BackgroundTasks. Anthropic and Vertex AI both call it and
  lose their own runtime.spawn calls. A registration cancelled at shutdown warns "<provider> batch registration
  cancelled at shutdown; its cost will not be tracked" for a create, or "...; its status and output file may be
  stale" for a read, the same two consequences log_batch_registration_result already names.
  AnthropicBatchLogging::new and VertexBatchLogging::new take the BackgroundTasks, so every caller passes the tracker
  the server will drain. B8931 builds both loggers into the server and calls shutdown on that tracker.
