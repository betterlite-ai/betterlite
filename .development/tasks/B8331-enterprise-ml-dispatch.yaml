dod:
  - text: _complete_sap merges model_version and calls the SAP config through the shared handler with the global headers fallback.
    proof: [enterprise-ml-dispatch-tests, oracle]
  - text: _complete_watsonx_text resolves key, base, credentials and token in LiteLLM's order and pops the same keys.
    proof: [enterprise-ml-dispatch-tests, oracle]
  - text: _complete_watsonx, _complete_sagemaker_chat and _complete_sagemaker pass the context fields to their handlers with the right provider name.
    proof: [enterprise-ml-dispatch-tests, oracle]
  - text: The sap, watsonx and sagemaker embedding arms and the watsonx rerank selection reach their configs.
    proof: [enterprise-ml-dispatch-tests, oracle]
  - text: The SAP token and deployment lookups and the watsonx environment are filled from the real process and transports.
    proof: [enterprise-ml-dispatch-tests]
  - text: litellm_settings.sap_service_key loads into the enterprise_ml_credentials section.
    proof: [enterprise-ml-config-tests]
  - text: New HTTP cases for these providers exist.
    proof: [enterprise-ml-cases, oracle]
checks:
  optional: []
  commands:
    - id: enterprise-ml-dispatch-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^enterprise_ml_dispatch::/)'
      why: The module is a stub on the base branch, so no test matches.
    - id: enterprise-ml-config-tests
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::enterprise_ml_credentials::/)'
      why: The section has no tests on the base branch.
    - id: enterprise-ml-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/enterprise-ml)"
      why: The oracle proof compares nothing until these case files exist.
