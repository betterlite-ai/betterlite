id: B8331
title: SAP, watsonx and SageMaker dispatch in main.py
description: >-
  A wiring part of the cloud ML platform group (B042). SAP is built by B5845 (chat and embedding configs), B5950 (credentials, token, deployment lookup), B5951 and B5952; watsonx by B5970 (credentials, IAM token, URLs), B5971 (chat), B5972 (text generation) and B5842 (embedding, rerank); SageMaker by B5840 (signed runtime calls), B5960 (request and reply bodies) and B5961 (embedding and the stream decoder). None of it is reachable yet. This task adds the main.py dispatch for the three providers in the module enterprise_ml_dispatch of betterlite-provider, registers the arms in the dispatch table through B2230's selection (the B050 and B8157 way), fills the environment and transports the parts take as arguments, and adds the HTTP oracle cases. Unknown providers keep failing as before. Add betterlite-bedrock to betterlite-provider's dependencies if it is not there yet (betterlite-bedrock does not depend on betterlite-provider).


  _complete_sap (main.py L2344-L2387, arm L5915-L5916 for custom_llm_provider sap). headers is the context value, else the global headers. Merge the SAP chat config's class settings into optional_params for each key the request did not set: through the proxy that is model_version = "latest", because nothing calls the config constructor there. Then call the shared HTTP completion handler with the context fields, shared_session and the context provider (GenAIHubOrchestration adds nothing to the inherited path). SAP embedding arm (L7112-L7126): the shared embedding handler with empty litellm_params. Take the SAP branch of the embedding config selection (utils.py L8788-L8789), returning B5845's embedding config. Build one SAP config per call, as LiteLLM's factory does, and keep its deployment URL for that call only. Feed B5950: its SapEnvironment reads process variables (AICORE_* names, AICORE_SERVICE_KEY, AICORE_PROFILE, AICORE_HOME, VCAP_SERVICES), checks and reads files, and gives the home folder; its SapTokenTransport and the deployment lookup run on B173's pooled client, the token request with a 30 second timeout. The deployment lookup is GET {base_url}/lm/deployments, then GET {base_url}/lm/configurations/{configurationId} for each resource whose scenarioId is orchestration (sap/chat/transformation.py L169-L185); B5950 picks the newest URL. litellm.sap_service_key goes in as the service key setting.


  _complete_watsonx (L4307-L4341, arm L6024-L6025) passes the context fields to B5971's chat handler with custom_llm_provider "watsonx" and the dispatch client. _complete_watsonx_text (L4344-L4418, arm L6026-L6027) resolves before it calls the shared handler with provider "watsonx_text" and shared_session. api_key is the context value, else popped apikey, else WATSONX_APIKEY, WATSONX_API_KEY, WX_API_KEY. api_base is the context value, else (popping base_url, api_base and url) url, then api_base, then base_url, else WATSONX_API_BASE, WATSONX_URL, WX_URL, WML_URL. Then wx_credentials and watsonx_credentials are both popped, wx_credentials winning; when one is present its url replaces the base, apikey (else api_key) replaces the key and token (else watsonx_token) becomes the token. A token that is not None goes into optional_params as token. Watsonx embedding arm (L7068-L7091): call B5970's get_watsonx_credentials with optional_params, the key and the base, use its api_key and api_base, copy token into optional_params when the result has one, and call the shared embedding handler with empty litellm_params. Take the watsonx branches of the embedding config selection (L8786-L8787, B5842's embedding config) and of the rerank config selection (L8896-L8897, B5842's rerank config). Fill B5970's WatsonxEnvironment from the process at call time, one field per name it lists.


  _complete_sagemaker_chat (L4109-L4143, arm L6013-L6017 for sagemaker_chat and sagemaker_nova) calls the shared handler with the context provider, so B5960's chat config and B5840's signed request are picked by that name. _complete_sagemaker (L4146-L4171, arm L6018-L6020) calls B5840's completion with custom_prompt_dict, hf_model_name, logger_fn, the encoding and the acompletion flag; it passes no key and no base, since AWS values travel in optional_params. SageMaker embedding arm (L6962-L6971): B5840's embedding with the encoding and an empty embedding response. Take the sagemaker branch of the embedding config selection (L8848-L8853), which returns B5961's per-model config. Plug B196's text counter into B5960's TextTokenCounter, and pass B005's stream wrapper rule for sagemaker where B5960 asks for it.


  Config. Add the section enterprise_ml_credentials with litellm_settings.sap_service_key (default None). Every environment value above is read when the call runs, through betterlite-env, with an empty value counting as unset.


  Plan about 380 lines of module code, 260 of tests and 50 for the section and the cases. Where the source and this text differ, the source at the pinned commit wins.
