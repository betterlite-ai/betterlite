deviations:
  - what: Reply ids LiteLLM generates, token usage it estimates and the AWS signature headers are compared as present, not equal.
    why: The ids are random, usage depends on each side's tokenizer and the signature covers the request time.
out_of_scope:
  - "The watsonx branch of rerank_api/main.py (L492-L518) is B1079's; it calls B5970's get_watsonx_credentials."
  - "B3627 owns the /watsonx passthrough route; B5842 owns its config."
  - "No HTTP case covers sagemaker/ completion or the sagemaker embedding arm: their URL is always the AWS runtime host, which the mock cannot stand in for. The recording-transport tests cover them."
  - "The SAP chat config constructor arguments are reachable only from SDK code that builds the config by hand; the proxy merges model_version alone."
  - "B5840, B5960, B5961, B5845, B5950, B5951, B5952, B5970, B5971, B5972 and B5842 own every provider transform and signing step; only calls to them are here."
  - "Databricks, Snowflake and OCI are B8330; Hugging Face, Replicate and Predibase are B8332."
pitfalls:
  - "watsonx_text reads WATSONX_APIKEY before WATSONX_API_KEY and WX_API_KEY, the reverse of B5970's IAM order; keep each order where it is."
  - "The three base pops in _complete_watsonx_text run only when the context base is empty, and then all three keys leave optional_params even when url wins."
  - "wx_credentials and watsonx_credentials are both popped whatever the base, so neither reaches the request body."
  - "The sagemaker_chat arm also catches sagemaker_nova; both names must reach the shared handler unchanged so the selection picks the Nova config."
  - "_complete_sap passes the request api_key to the config, and B5845's validate_environment treats a non-empty key as the SAP service key."
  - "The watsonx embedding arm copies token only when the credentials carry the key, while watsonx_text copies it when it is not None."
  - "The SAP cases script every reply in the case field upstream, a list the mock answers in arrival order: the token reply, the deployments reply and the configurations reply in the order LiteLLM sends them, then the chat or embedding reply. A request past the end fails with provider answer sequence exhausted. Only case env values get the mock address, through {{upstream}}, so put it in the service key URLs in the env; reply bodies are sent as written."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: security
