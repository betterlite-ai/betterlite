checks:
  optional:
  - mutants
  commands:
  - id: case-titan-image-body
    why: The titan-image-body behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_models_cases::case_[0-9]+_titan_image_body$/)'
  - id: case-stability1-text-prompts
    why: The stability1-text-prompts behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_models_cases::case_[0-9]+_stability1_text_prompts$/)'
  - id: case-stability3-prompt
    why: The stability3-prompt behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_models_cases::case_[0-9]+_stability3_prompt$/)'
  - id: case-nova-canvas-task-body
    why: The nova-canvas-task-body behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_models_cases::case_[0-9]+_nova_canvas_task_body$/)'
  - id: case-size-n-quality-map
    why: The size-n-quality-map behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_models_cases::case_[0-9]+_size_n_quality_map$/)'
  - id: case-artifacts-to-b64-results
    why: The artifacts-to-b64-results behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_models_cases::case_[0-9]+_artifacts_to_b64_results$/)'
  - id: case-image-provider-error
    why: The image-provider-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_models_cases::case_[0-9]+_image_provider_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_image_models.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_models*")"
      && grep -lq 'bedrock_other_image_models' tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_models*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_image_models$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
