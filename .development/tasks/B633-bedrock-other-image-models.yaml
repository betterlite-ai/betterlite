id: B633
title: Bedrock image model request and reply maps
description: >-
  Add BedrockImageConfig variants for Titan, Stable Diffusion 1/3 and Nova Canvas, with typed family request bodies
  and OpenAI image result mapping. Preserve width/height/n, cfgScale/seed/quality/style/task fields and model selection;
  image prices stay B068.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_generation/amazon_titan_transformation.py:
  AmazonTitanImageGenerationConfig._is_titan_model L62-L71; AmazonTitanImageGenerationConfig.get_supported_openai_params
  L74-L75; AmazonTitanImageGenerationConfig.map_openai_params L78-L101; AmazonTitanImageGenerationConfig.transform_request_body
  L104-L126; AmazonTitanImageGenerationConfig.transform_response_dict_to_openai_response L129-L139. litellm/llms/bedrock/image_generation/amazon_stability1_transformation.py:
  AmazonStabilityConfig.__init__ L47-L58; AmazonStabilityConfig.get_config L61-L76; AmazonStabilityConfig.get_supported_openai_params
  L79-L80; AmazonStabilityConfig.map_openai_params L83-L94; AmazonStabilityConfig.transform_request_body L97-L117;
  AmazonStabilityConfig.transform_response_dict_to_openai_response L120-L130. litellm/llms/bedrock/image_generation/amazon_stability3_transformation.py:
  AmazonStability3Config.get_supported_openai_params L40-L44; AmazonStability3Config._is_stability_3_model L47-L66;
  AmazonStability3Config.transform_request_body L69-L74; AmazonStability3Config.map_openai_params L77-L83; AmazonStability3Config.transform_response_dict_to_openai_response
  L86-L105. litellm/llms/bedrock/image_generation/amazon_nova_canvas_transformation.py: AmazonNovaCanvasConfig.get_supported_openai_params
  L46-L48; AmazonNovaCanvasConfig._is_nova_model L51-L60; AmazonNovaCanvasConfig.transform_request_body L63-L148;
  AmazonNovaCanvasConfig.map_openai_params L151-L169; AmazonNovaCanvasConfig.transform_response_dict_to_openai_response
  L172-L185. litellm/llms/bedrock/image_generation/image_handler.py: BedrockImageGeneration.get_config_class L66-L74.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: titan_image_body: Titan supports size,n,quality. Mapping splits non-None size on literal
  x into exactly two Python integers, maps non-None n to numberOfImages, and maps hd/premium/high to premium, standard/medium/low
  to standard; auto/unknown quality adds nothing. If any mapped field exists, replace optional.imageGenerationConfig
  entirely with that new record. Body building pops imageGenerationConfig default {}, negativeText default None
  and taskType default TEXT_IMAGE; include negativeText only when truthy. A second pop of imageGenerationConfig
  necessarily sees its default after the first pop. Emit taskType,textToImageParams={text plus optional negativeText},imageGenerationConfig;
  ignore remaining optional fields and retain explicit taskType=None. The unused Titan class defaults do not enter
  this body. stability1_text_prompts: Stability 1 supports only size and maps a non-None size into top-level integer
  width,height. Deep-copy options, remove exact user, replace each host os.linesep in text with a space, and add
  class config fields only when absent, preserving explicit None. Emit text_prompts=[{text: normalized prompt,weight:1}],
  then overlay inference params so a supplied text_prompts replaces it. Constructor cfg_scale,seed,steps,width,height
  all default None and persist non-None values as class settings; get_config excludes dunder/functions/builtin/class/static
  methods and None but retains single-underscore data. Do not inject the numerical defaults described in the source
  docstring. stability3_prompt: Stability 3 supports [] and returns optional params unchanged from mapping. Build
  prompt=text plus keyword-expanded options, preserving all extras; an existing prompt causes a keyword-collision
  TypeError rather than an override. There is no user removal or class-default merge in this family. nova_canvas_task_body:
  Nova supports n,size,quality in that order. Pop taskType default TEXT_IMAGE, imageGenerationConfig default {},
  and model_id default None from the caller options; overlay all remaining options on the nested image config. For
  TEXT_IMAGE, COLOR_GUIDED_GENERATION and INPAINTING respectively remove textToImageParams,colorGuidedGenerationParams,inpaintingParams
  from that merged config, default {}, and overlay its fields on text=text so an explicit text wins. Emit that nested
  params record, taskType and remaining imageGenerationConfig. A different task, including None, raises NotImplementedError
  Task type {task_type} is not supported. TypedDict constructors retain arbitrary fields and values rather than
  enforcing annotations. size_n_quality_map: Nova maps non-None size to integer top-level width,height and n to
  numberOfImages; hd/premium quality becomes premium and standard becomes standard. Unlike Titan, high/medium/low/auto/unknown
  values are ignored and do not replace an existing quality. Size parsing in Titan, Stability 1 and Nova preserves
  split/int failures for malformed strings, accepts Python integer syntax and does not enforce positive or supported
  dimensions. artifacts_to_b64_results: Titan requires images and Stability 1 requires artifacts with each artifact.base64;
  missing accessed keys fail directly. Stability 3 and Nova default absent images to an empty list. For all families
  overwrite only model_response.data with ordered Image(b64_json=value) entries, preserving other response fields,
  with no decoding, URL construction or download. image_provider_error: Stability 3 filters finish_reasons by truthiness,
  then raises B682 BedrockError 400 with the retained strings joined by semicolon-space before mapping images; absent
  or all-falsey reasons pass. A malformed None/list item keeps its native iteration/join failure. Nova ignores its
  response error field and simply maps images; Titan and Stability 1 likewise do not invent provider-error validation.
  Nonmapping request config values fail at their actual mapping/keyword-expansion step, before the later TypedDict
  constructor catches. image_family_selection: Choose Titan for case-sensitive amazon.titan substring, else Nova
  for amazon.nova-canvas, else Stability 3 for sd3 or sd3.5 or stable-image, else Stability 1. Falsey model uses
  Stability 1. These are substring checks rather than strict provider prefixes, and Titan wins when a string contains
  multiple markers. Reuse the same selector from B634 and B068.


  Load cfg_scale, seed, steps, width, height through betterlite-config, with injected environment lookup and the
  defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest bedrock_image_models_config_cases; each named loads_<key> case invokes the real B002 loader,
  checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  These five config loader cases target AmazonStabilityConfig class settings only, each default None; Titan, Nova
  and Stability 3 do not read them. SDK-only nonstring keyword names can reach the Nova TypedDict constructor catch
  messages Error transforming text to image params, Error transforming color guided generation params, Error transforming
  inpainting params and Error transforming image generation config, each followed by : {error}. Got params: {params},
  Expected params: {annotations}. They cannot arise from JSON object keys; their Python adapter validation belongs
  to B159, and no fake proxy failure case is added.


  Implement crates/betterlite-bedrock/src/image_models.rs with adjacent tests under image_models/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_image_models in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_models_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  titan_image_body, stability1_text_prompts, stability3_prompt, nova_canvas_task_body, size_n_quality_map, artifacts_to_b64_results,
  image_provider_error, image_family_selection. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_models* using HelperCase:
  kind: helper and the externally tagged bedrock_other_image_models variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_image_models that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 309 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 280 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 75 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 765 planned, 775 maximum changed lines.
