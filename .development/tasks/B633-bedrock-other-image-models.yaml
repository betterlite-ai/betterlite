id: B633
title: Bedrock image model request and reply maps
description: >-
  Add BedrockImageConfig variants for Titan, Stable Diffusion 1/3 and Nova Canvas, with typed family request bodies
  and OpenAI image result mapping. Preserve width/height/n, cfgScale/seed/quality/style/task fields and model selection;
  image prices stay B068.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_generation/amazon_titan_transformation.py:
  AmazonTitanImageGenerationConfig.__init__ L30-L41; AmazonTitanImageGenerationConfig.get_config L44-L59; AmazonTitanImageGenerationConfig._is_titan_model
  L62-L71; AmazonTitanImageGenerationConfig.get_supported_openai_params L74-L75; AmazonTitanImageGenerationConfig.map_openai_params
  L78-L101; AmazonTitanImageGenerationConfig.transform_request_body L104-L126; AmazonTitanImageGenerationConfig.transform_response_dict_to_openai_response
  L129-L139. litellm/llms/bedrock/image_generation/amazon_stability1_transformation.py: AmazonStabilityConfig.__init__
  L47-L58; AmazonStabilityConfig.get_config L61-L76; AmazonStabilityConfig.get_supported_openai_params L79-L80;
  AmazonStabilityConfig.map_openai_params L83-L94; AmazonStabilityConfig.transform_request_body L97-L117; AmazonStabilityConfig.transform_response_dict_to_openai_response
  L120-L130. litellm/llms/bedrock/image_generation/amazon_stability3_transformation.py: AmazonStability3Config.get_config
  L22-L37; AmazonStability3Config.get_supported_openai_params L40-L44; AmazonStability3Config._is_stability_3_model
  L47-L66; AmazonStability3Config.transform_request_body L69-L74; AmazonStability3Config.map_openai_params L77-L83;
  AmazonStability3Config.transform_response_dict_to_openai_response L86-L105. litellm/llms/bedrock/image_generation/amazon_nova_canvas_transformation.py:
  AmazonNovaCanvasConfig.get_config L28-L43; AmazonNovaCanvasConfig.get_supported_openai_params L46-L48; AmazonNovaCanvasConfig._is_nova_model
  L51-L60; AmazonNovaCanvasConfig.transform_request_body L63-L148; AmazonNovaCanvasConfig.map_openai_params L151-L169;
  AmazonNovaCanvasConfig.transform_response_dict_to_openai_response L172-L185.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/image_models.rs with adjacent tests under image_models/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_image_models in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_models_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  titan_image_body, stability1_text_prompts, stability3_prompt, nova_canvas_task_body, size_n_quality_map, artifacts_to_b64_results,
  image_provider_error. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_models* using HelperCase:
  kind: helper and the externally tagged bedrock_other_image_models variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_image_models that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 360 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 375 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 591 planned, 600 maximum changed lines.
