id: B221
title: Mid-conversation system placement
description: >-
  Implement All mapping/role/part helpers and place_mid_conversation_system, preserving the distinction between
  flagged and unflagged models and rendered thinking blocks. Model flags are explicit constructor inputs; never
  consult a global catalog. Keep transforms separately callable over typed messages, with bounded output and no
  network or shared mutation. Budget 280 transforms/types, 100 adapters, 300 tests and 60 wiring (740 total). Write
  the behavior rstest functions system_placement_behavior_tests_behavior in adjacent tests.rs files, with a named case for each
  behavior and failure in the DoD; corpus replay tests have separate names. The helper operation system_placement is already registered; each operation has its own Rust and Python
  adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/system_placement.rs
  - crates/betterlite-prompts/src/system_placement/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/prompts/system_placement.rs
  - tools/oracle/src/helpers/prompts/system_placement/**
  - tools/oracle/helpers/system_placement.py
  - tools/oracle/helpers/system_placement/**
  - tools/oracle/cases/helpers/system-placement/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-openai/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/mid_conversation_system.py#L61-L418
  why: Complete function ownership in this slice.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
- text: New message-field corpus seeds replay the production chat parser.
  proof:
  - chat-request-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::system_placement_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'system_placement' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: chat-request-corpus
    why: the required new behavior or its evidence is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/system-placement/leading-system.yaml
- tools/oracle/cases/helpers/system-placement/mid-system-flagged.yaml
- tools/oracle/cases/helpers/system-placement/mid-system-unflagged.yaml
- tools/oracle/cases/helpers/system-placement/thinking-only.yaml
- tools/oracle/cases/helpers/system-placement/system-after-user.yaml
- tools/oracle/cases/helpers/system-placement/cache-control.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B179 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as system_placement in the prompts group. Replace the stub Op in tools/oracle/src/helpers/prompts/system_placement.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/system_placement.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
