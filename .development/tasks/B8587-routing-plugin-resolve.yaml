id: B8587
title: Python routing plugin resolution and the startup hooks port
description: >-
  Two startup pieces need betterlite's embedded Python host (B165), so they wait for it in this task and the plain checks
  of B8378 and the lifespan of B8374 do not. This task also declares the StartupHooks port the lifespan calls, so B8374
  depends on this task and never the other way round.

  Routing plugins. A complexity router config and router_settings can name routing and classifier plugins as Python
  dotted paths ("module.attr"). LiteLLM resolves them at config load with get_instance_fn, so a bad module refuses startup
  instead of failing the first request. Build crates/betterlite-server/src/routing_plugins.rs (declared by the skeleton)
  with the error enum `PluginResolveError` (thiserror) and three functions over B165's `PythonHooks`:
  `resolve_routing_plugins(hooks: Option<&PythonHooks>, paths, config_path, label)` loads every string entry with
  `load_hook(HookSlot::RoutingPlugin, path)`, in order, and returns the handles. `resolve_classifier_plugin(hooks, path,
  config_path, label)` does the same for one path with `HookSlot::ClassifierPlugin`.
  `resolve_complexity_plugins(hooks, model_name, config, config_path)` ports resolve_complexity_router_plugins: when
  complexity_router_config.plugins is a list, resolve it with the label "complexity_router_config.plugins on model
  {model_name!r}"; when classifier_plugin is a string, resolve it with "complexity_router_config.classifier_plugin on
  model {model_name!r}"; anything else is left alone. Non-string entries cannot come from YAML here.

  The interface check runs on each loaded object. A routing plugin needs an async `run(context)` and a classifier an async
  `classify(context)`; otherwise fail with `PluginResolveError::NotRoutingPlugin` or `NotClassifierPlugin`, whose texts are
  LiteLLM's: "{label} entry {path!r} resolved to {repr}, which does not implement the RoutingPlugin interface (an async
  `run(context)` method). Fix the referenced module before starting the proxy." and the ClassifierPlugin form ("an async
  `classify(context)` method"). A load failure keeps B165's HooksError as its source. When `hooks` is None (no Python
  host) and any plugin path is present, fail with `PluginResolveError::PythonHostMissing`, naming the config key from
  the label.

  Startup hooks port and adapter. LITELLM_WORKER_STARTUP_HOOKS names Python functions that run first in the lifespan
  (proxy_server.py L1256-L1278). B8374 reads and splits the variable and calls a port, and B165's
  `PythonHooks::run_startup_hooks(specs: &[String]) -> Result<(), HooksError>` runs the specs. This task declares the port
  and the adapter between them in `crates/betterlite/src/startup_hooks_py.rs` (declared by the skeleton). The port is
  `pub trait StartupHooks: Send + Sync` with one method, `fn run<'a>(&'a self, specs: &'a [String]) -> BoxFuture<'a,
  Result<(), StartupHookError>>`, where BoxFuture is the std-only alias `crate::job_scheduler::BoxFuture` already on main,
  so B8374 holds the port as `Option<Arc<dyn StartupHooks>>` in LifespanInputs and crates/betterlite/Cargo.toml needs no
  new dependency. The module's error enum is `StartupHookError` (thiserror) with one variant, `Python { #[source] source:
  HooksError }`, displayed as "worker startup hook failed". `PyStartupHooks { pub hooks: Arc<PythonHooks> }` in
  startup_hooks_py/adapter.rs implements the port: it hands the specs unchanged to run_startup_hooks and wraps a HooksError
  in StartupHookError::Python. B165 owns the spec check, the order, the awaiting and the log lines, so the adapter adds
  none of them.

  Tests write small Python modules to a temporary folder next to a temporary config file and load them through B165's
  PythonHooks: good and bad routing and classifier plugins, a sync `def classify`, a missing host (hooks None), and,
  called through an `Arc<dyn StartupHooks>` over PyStartupHooks, a startup hook list whose first spec runs (its side
  effect shows) and whose second raises, which returns StartupHookError::Python with B165's HooksError as its source. No
  oracle case: LiteLLM's answer is a refused startup with the same text, which the helper cases cannot drive without
  loading user modules.
scope:
  paths:
    - crates/betterlite-server/src/routing_plugins.rs
    - crates/betterlite-server/src/routing_plugins/**
    - crates/betterlite/src/startup_hooks_py.rs
    - crates/betterlite/src/startup_hooks_py/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L4965-L5028
    why: resolve_routing_plugins and resolve_complexity_router_plugins with the interface check and the two labels.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5138-L5158
    why: resolve_classifier_plugin and its async classify check.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1256-L1278
    why: The worker startup hook loop the port stands for; B8374 splits the variable, B165 runs each spec, the adapter connects them.
dod:
  - text: Routing and classifier plugin paths resolve through the Python host in order, and an object without the async method fails with LiteLLM's interface text naming the config key.
    proof: [routing-plugin-tests]
  - text: Without a Python host, any plugin path fails with PythonHostMissing naming the config key, and a config without plugin paths passes.
    proof: [routing-plugin-tests]
  - text: StartupHooks works as an Arc<dyn StartupHooks>, and PyStartupHooks forwards the specs to run_startup_hooks in order and returns its failure as StartupHookError::Python with B165's HooksError as the source.
    proof: [startup-hooks-tests]
checks:
  optional: []
  commands:
    - id: routing-plugin-tests
      why: Plugin resolution, the interface check or PythonHostMissing is missing or differs from LiteLLM
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routing_plugins::/)'
    - id: startup-hooks-tests
      why: The StartupHooks port is not dyn-compatible, or the adapter over PythonHooks is missing or does not forward a failure
      run: >-
        cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^startup_hooks_py::/)'
oracle_cases: []
deviations:
  - what: Routing and classifier plugin paths need betterlite's embedded Python host; without it, startup fails naming the config key.
    why: The plugins are Python objects; this follows the startup hooks decision for B8374.
out_of_scope:
  - "The deployment checks and the model id pin: B8378. The Python host, HookSlot, HooksError and run_startup_hooks: B165. Reading and splitting LITELLM_WORKER_STARTUP_HOOKS, calling the port, and LifespanError::StartupHooksNeedPython when no port is given: B8374."
  - "Making the one PythonHooks and passing PyStartupHooks over it in LifespanInputs: the code that builds LifespanInputs (B8375's proxy_cli)."
  - "Calling these at config load (L5015 for a complexity router, L6978 for router_settings.plugins): the router build from config calls them, as it calls B8378's checks."
pitfalls:
  - A sync `def run` or `def classify` passes Python's runtime_checkable isinstance, so the check must also require the method to be async.
  - "B8378 pins the model id from the raw params before these paths are swapped for loaded objects; keep that order when both run on one deployment."
  - "An `async fn run` in the trait is not dyn-compatible, and B8374 stores the port as Option<Arc<dyn StartupHooks>>, so return the boxed future and keep a test that calls through Arc<dyn StartupHooks>."
  - "The adapter neither trims nor filters the specs and logs nothing: B8374 already skipped blank entries, and B165 already logs \"Worker startup hook '{spec}' failed: {error}\", so a second line would log the failure twice."
review_level: standard
budget:
  max_changed_lines: 900
  max_new_expects: 0
