id: B661
title: Bedrock realtime session configuration
description: >-
  Add NovaRealtimeSession and typed session.update/session.created/session.updated mappings with an injected id
  source. Defaults are max_tokens=1024, top_p=0.9, temperature=0.7, voice=matthew, output sample rate=24000 Hz and
  input=16000 Hz; both use 16-bit mono base64 SPEECH audio/lpcm and text uses text/plain. Preserve tools inputSchema
  JSON strings, system instructions and update acknowledgments. All decimal settings use the established exact wire
  parser; realtime transport is separate.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/transformation.py:
  BedrockRealtimeConfig.__init__ L83-L124; BedrockRealtimeConfig.get_error_class L126-L132; BedrockRealtimeConfig.validate_environment
  L134-L136; BedrockRealtimeConfig.get_complete_url L138-L140; BedrockRealtimeConfig.requires_session_configuration
  L142-L144; BedrockRealtimeConfig.session_configuration_request L146-L190; BedrockRealtimeConfig._transform_tools_to_bedrock_format
  L192-L214; BedrockRealtimeConfig._map_audio_format_to_sample_rate L216-L233; BedrockRealtimeConfig.transform_session_update_event
  L235-L356; BedrockRealtimeConfig._session_object L670-L682; BedrockRealtimeConfig.session_created_event L684-L694;
  BedrockRealtimeConfig.session_updated_event L696-L707.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/realtime_session.rs with adjacent tests under realtime_session/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_realtime_session in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_session_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): default_session_configuration, session_update_options, pcm16_input_output_rates, g711_rates, explicit_sample_rate,
  tool_configuration, system_instructions, created_updated_events. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_session* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_session variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_session that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 248 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 499 planned, 500 maximum changed lines.
