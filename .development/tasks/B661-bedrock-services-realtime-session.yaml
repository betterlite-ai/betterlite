id: B661
title: Bedrock realtime session configuration
description: >-
  Add NovaRealtimeSession and typed session.update/session.created/session.updated mappings with an injected id
  source. Defaults are max_tokens=1024, top_p=0.9, temperature=0.7, voice=matthew, output sample rate=24000 Hz and
  input=16000 Hz; both use 16-bit mono base64 SPEECH audio/lpcm and text uses text/plain. Preserve tools inputSchema
  JSON strings, system instructions and update acknowledgments. All decimal settings use the established exact wire
  parser; realtime transport is separate.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/transformation.py:
  BedrockContentEnd and usage record defaults L47-L71; BedrockRealtimeConfig.__init__ L83-L124; BedrockRealtimeConfig.get_error_class
  L126-L132; BedrockRealtimeConfig.validate_environment L134-L136; BedrockRealtimeConfig.get_complete_url L138-L140;
  BedrockRealtimeConfig.requires_session_configuration L142-L144; BedrockRealtimeConfig.session_configuration_request
  L146-L190; BedrockRealtimeConfig._transform_tools_to_bedrock_format L192-L214; BedrockRealtimeConfig._map_audio_format_to_sample_rate
  L216-L233; BedrockRealtimeConfig.transform_session_update_event L235-L356; BedrockRealtimeConfig._session_object
  L670-L682; BedrockRealtimeConfig.session_created_event L684-L694; BedrockRealtimeConfig.session_updated_event
  L696-L707.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: default_session_configuration: Constructor allocates three independent UUID strings prompt_name,content_name,audio_content_name;
  prompt_started/client_audio_streamed=False; user transcript activeFalse,generation_stageNone,item_idNone,bufferempty,cumulative/reported
  usage all0 including nested input/output speechTokens/textTokens. Defaults max_tokens1024,top_p0.9,temperature0.7,voice
  matthew; output24000/input16000Hz,16bits,1channel,encoding base64,audioType SPEECH,mediaType audio/lpcm; textMedia
  text/plain. No environment inputs. session_configuration_request returns one JSON marker object with session_start.event.sessionStart.inferenceConfiguration
  maxTokens/topP/temperature and prompt_start.event.promptStart containing promptName,textOutputConfiguration,audioOutputConfiguration.
  It does NOT set prompt_started. session_update_options: session defaults{}. By key presence update max_response_output_tokens,temperature,voice
  evenNone/empty; top_p is ignored and stays0.9. Preserve existing values for absent keys. Always emit serialized
  sessionStart then promptStart and set prompt_started=True before optional instruction frames. Repeated updates
  restart using SAME prompt_name, without closing prior prompt or resetting audio/transcript/usage state. Unknown
  session fields ignored; no implied validation of max token or temperature ranges. pcm16_input_output_rates: Exact
  pcm16 maps output24000/input16000. Unknown format values, includingNone, use the same defaults. Format changes
  only sample rate; mediaType remains audio/lpcm and bit width16. g711_rates: g711_ulaw and g711_alaw set sample
  rate8000 for input/output but do not convert encoding or replace audio/lpcm media type; preserve this source wire
  shape. explicit_sample_rate: After audio-format mapping, explicit output_sample_rate_hertz/input_sample_rate_hertz
  override by key presence, even0/None. Input rate affects later B662 audio content, not promptStart output configuration.
  tool_configuration: Only truthy tools list adds toolUseOutputConfiguration.mediaType application/json and toolConfiguration.tools.
  Keep only entries with type=function, read nested function default{}, name/description defaultempty, inputSchema.json
  = json.dumps(parameters default{}), including explicitnull. Unsupported types silently ignored; a truthy list
  of only unsupported types still adds empty tools config. Flattened Realtime function definitions without nested
  function do not supply their top-level name/parameters here. system_instructions: Truthy instructions adds three
  frames after session/prompt starts: contentStart with fresh UUID,typeTEXT,interactiveFalse,roleSYSTEM,textInputConfiguration.mediaType
  text/plain; textInput same prompt/content names and supplied instructions unchanged; contentEnd same names. Empty/None
  instructions adds no frames. Model argument has no effect on these serialized configurations. created_updated_events:
  _session_object id=logging.litellm_trace_id,modalities default[text,audio] only whenNone,explicit[] retained;
  include model only whenstr andnotNone,includingempty. session.created/session.updated event_id is bare UUID string
  with no event_ prefix. Created uses defaultmodalities; updateduses suppliedmodalities. These acks do not echo
  temperature/voice/tool settings. requires_session_configuration=True,get_complete_url returns api_base or empty,validate_environment
  returns headers; error factory B682 unchanged.


  Implement crates/betterlite-bedrock/src/realtime_session.rs with adjacent tests under realtime_session/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_session_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): default_session_configuration, session_update_options, pcm16_input_output_rates, g711_rates, explicit_sample_rate,
  tool_configuration, system_instructions, created_updated_events. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_session* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_session variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_session that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 263 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 275 production lines, 295 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 710 planned, 725 maximum changed lines.
