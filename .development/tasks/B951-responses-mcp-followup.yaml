- 'litellm/responses/mcp/litellm_proxy_mcp_handler.py: B10121 owns MCPToolResult L54-L57, and B10122 owns _should_auto_execute_tools L540-L563, _extract_tool_calls_from_response L566-L577 and _extract_tool_call_details L604-L635; this task reads the records and calls extract_tool_call_details.'
- 'litellm/responses/mcp/litellm_proxy_mcp_handler.py: B10123 owns _create_follow_up_messages_for_chat L975-L1017, and B10124 owns _is_persistence_disabled L1020-L1022 and _create_follow_up_input L1025-L1101; their output is the input of the pending plan.'
- 'litellm/responses/mcp/mcp_streaming_iterator.py: B952 owns create_mcp_call_events L180-L261; B953 and B954 own MCPEnhancedStreamingIterator construction and iteration, so this task supplies typed events and a pending iterator plan but does not implement stream lifecycle.'
- 'litellm/responses/main.py and litellm/responses/mcp/chat_completions_handler.py: B932 and the consuming route tasks own public SDK/HTTP entry points, authentication, status/type/param/code serialization and the mock-provider route transcript; this task only forwards the exact follow-up call arguments.'
- 'No owned function reads an environment variable, config key or query parameter, writes a database row, or emits a warning-and-drop path; the assistant-conversion diagnostic went to B10123 with the chat messages.'
- 'Provider-specific aresponses transport, URL construction and credential resolution remain with B932 and provider tasks; Python package exports and sync wrappers remain B158-B161.'
deviations:
- link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/mcp/litellm_proxy_mcp_handler.py#L1104-L1118
  what: Betterlite returns a typed pending follow-up call plan at this boundary instead of recursively invoking a public Responses endpoint.
  why: The native API boundary owns one provider dispatch and prevents a follow-up from re-entering route authentication; the consuming B932/provider seam still sends the same input, model, tools, previous_response_id and call parameters to the mock provider.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_mcp_followup in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_mcp_followup.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_mcp_followup.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- '_build_request_params lets kwargs overwrite call_params and lets call_params overwrite the core input/model/tools keys; merging in the reverse order changes a caller-supplied input or model.'
- '_prepare_follow_up_call_params removes tool_choice after restoring stream, including the value "required"; retaining it asks the provider for another tool choice during result submission.'
- '_add_mcp_output_elements_to_response mutates the supplied response and appends fetched-tools before tool-results; returning a copied response or reversing these two items changes the final output order.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
