- 'litellm/responses/mcp/litellm_proxy_mcp_handler.py: B949 owns _get_mcp_tools_from_manager L234-L352, _process_mcp_tools_to_openai_format L417-L447, _process_mcp_tools_without_openai_transform L450-L503, _transform_mcp_tools_to_openai overloads and implementation L505-L537, _deduplicate_mcp_tools L355-L386, and _filter_mcp_tools_by_allowed_tools L389-L414; this task consumes their selected tools and map.'
