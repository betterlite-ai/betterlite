  why: The called MCP event builder supplies the exact event names and completed/failed item fields consumed here.
dod:
- text: >-
    request_param_precedence asserts core input/model/tools, conditional previous_response_id, call_params overwrite,
    kwargs overwrite, and the user_api_key_auth fallback used by the streaming wrapper.
  proof:
  - case-request-param-precedence
  - oracle
- text: >-
    tool_execution_event_order asserts unknown/empty defaults, first matching tool call, output_index=0, mcp_ IDs,
    five events per result, and sequence starts after the prior event count.
  proof:
  - case-tool-execution-event-order
  - oracle
- text: >-
    call_parameter_streaming asserts initial stream=false for auto execution, follow-up stream restoration for both
    true and false, and removal of every tool_choice value before the follow-up provider plan.
  proof:
  - case-call-parameter-streaming
  - oracle
- text: >-
    output_element_append_order asserts in-place preservation of existing output followed by completed system
    mcp_tools_fetched and tool_execution_results items, their ID prefixes, output_text fields, indent=2 JSON and
    annotations=[] in that order.
  proof:
  - case-output-element-append-order
  - oracle
- text: >-
    provider_call_error asserts the mock provider receives input, model, tools, previous_response_id and call
    parameters unchanged, and that the provider error reaches the B932 seam without local status/type/param/code
    rewriting.
  proof:
  - case-provider-call-error
  - oracle
- text: The helper adapter, its shared-parser seed and all five named parity fixtures compare independently scripted Rust and pinned MIT results, including ordered diagnostics and provider-call effects.
  proof:
  - new-oracle-cases
  - oracle
  - helper-python
  - helper-corpus
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The Responses MCP follow-up module or one of its named behavior tests is absent; corpus replay is not a substitute.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::/)'
  - id: case-request-param-precedence
    why: Request parameter insertion and overwrite precedence is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::request_param_precedence($|::)/)'
  - id: case-tool-execution-event-order
    why: MCP execution defaults, event counts or sequence order is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::tool_execution_event_order($|::)/)'
  - id: case-call-parameter-streaming
    why: Initial/follow-up stream settings or tool_choice removal is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::call_parameter_streaming($|::)/)'
  - id: case-output-element-append-order
    why: MCP output item fields, JSON formatting or append order is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::output_element_append_order($|::)/)'
  - id: case-provider-call-error
    why: The follow-up provider request or unchanged provider error fields are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::provider_call_error($|::)/)'
  - id: helper-python
    why: The Responses MCP follow-up Python adapter is absent or fails ruff/basedpyright.
    run: test -f tools/oracle/helpers/responses_mcp_followup.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The responses_mcp_followup helper tag has no added shared-parser seed or the helper corpus replay fails.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_mcp_followup-*)" && grep -qE '^[[:space:]]+responses_mcp_followup:' tools/oracle/fuzz/corpus/helper_case/responses_mcp_followup-* && cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-core-ops --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: No new Responses MCP follow-up parity fixture was added on this branch.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-mcp-followup)"
