checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The Responses MCP follow-up module or one of its named behavior tests is absent; corpus replay is not a substitute.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::/)'
  - id: case-chat-message-defaults
    why: Chat assistant repair or tool-message fallback fields are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::chat_message_defaults($|::)/)'
  - id: case-response-input-order
    why: Responses input omission, grouping or function-call-output order is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::response_input_order($|::)/)'
  - id: case-persistence-response-id
    why: store=false identity behavior or the no-write persistence effect is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::persistence_response_id($|::)/)'
  - id: case-request-param-precedence
    why: Request parameter insertion and overwrite precedence is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::request_param_precedence($|::)/)'
  - id: case-tool-execution-event-order
    why: MCP execution defaults, event counts or sequence order is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::tool_execution_event_order($|::)/)'
  - id: case-call-parameter-streaming
    why: Initial/follow-up stream settings or tool_choice removal is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::call_parameter_streaming($|::)/)'
  - id: case-output-element-append-order
    why: MCP output item fields, JSON formatting or append order is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::output_element_append_order($|::)/)'
  - id: case-assistant-conversion-warning
    why: The assistant conversion warning-and-drop path is missing or becomes an error.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::assistant_conversion_warning($|::)/)'
  - id: case-provider-call-error
    why: The follow-up provider request or unchanged provider error fields are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::provider_call_error($|::)/)'
  - id: helper-python
    why: The Responses MCP follow-up Python adapter is absent or fails ruff/basedpyright.
    run: test -f tools/oracle/helpers/responses_mcp_followup.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The responses_mcp_followup helper tag has no added shared-parser seed or the helper corpus replay fails.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_mcp_followup-*)" && grep -qE '^[[:space:]]+responses_mcp_followup:' tools/oracle/fuzz/corpus/helper_case/responses_mcp_followup-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: No new Responses MCP follow-up parity fixture was added on this branch.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-mcp-followup)"
