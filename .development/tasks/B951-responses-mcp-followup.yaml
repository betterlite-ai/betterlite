  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::/)
      - test(/::replays_corpus$/)'
  - id: case-persistence-disabled-history
    why: the persistence-disabled-history behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_followup::tests::persistence_disabled_history($|::)/)'
  - id: case-mcp-output-item-order
