deviations:
- link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/mcp/litellm_proxy_mcp_handler.py#L1104-L1118
  what: Betterlite returns a typed pending follow-up call plan at this boundary instead of recursively invoking a public Responses endpoint.
  why: The native API boundary owns one provider dispatch and prevents a follow-up from re-entering route authentication; the consuming B932/provider seam still sends the same input, model, tools, previous_response_id and call parameters to the mock provider.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_mcp_followup in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_mcp_followup.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_mcp_followup.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- '_create_follow_up_messages_for_chat catches every exception raised while reading choices[0] or model_dump, logs "Failed to convert assistant message for MCP flow" with exception severity, and continues; converting that warning into an error loses the tool-result-only response.'
- '_create_follow_up_input groups all message content before function_call/reasoning turn items, even when response.output interleaves them; preserving source-item order for the whole assistant list changes the provider payload.'
- '_is_persistence_disabled uses identity with False: integer 0 and string "false" do not disable persistence, while boolean False does.'
- '_create_tool_execution_events treats a missing result as the empty string and therefore completed, but an explicit null result as failed; both cases have different event counts and sequence starts for the next result.'
- '_build_request_params lets kwargs overwrite call_params and lets call_params overwrite the core input/model/tools keys; merging in the reverse order changes a caller-supplied input or model.'
- '_prepare_follow_up_call_params removes tool_choice after restoring stream, including the value "required"; retaining it asks the provider for another tool choice during result submission.'
- '_add_mcp_output_elements_to_response mutates the supplied response and appends fetched-tools before tool-results; returning a copied response or reversing these two items changes the final output order.'
review_level: standard
budget:
  max_changed_lines: 600
  max_new_expects: 1
