id: B951
title: Responses mcp followup
description: >-
  Implement the typed follow-up plan and output composition used after Responses or Chat Completions MCP tool
  execution. The service must preserve the pinned input order and field names, and must return a pending follow-up
  call to the consuming Responses dispatcher instead of recursively entering a public endpoint.


  Implement crates/betterlite-core/src/api/responses_mcp_followup.rs with ResponsesMcpFollowupInput and
  ResponsesMcpFollowupResult records. Inject the clock/ID source, provider-call seam, event builder, and resolved
  settings through constructors. No function in this slice reads an environment variable, config key or query
  parameter, writes a database row, or assigns an HTTP status/type/param/code; provider error fields remain those
  produced by B932, and route serialization remains with the consuming route task.


  Preserve these exact transformations. Chat follow-up messages deep-copy and convert original_messages first, append
  the first Choices message only when choices[0] is a Choices with a message, dump it without None fields, and add
  function.arguments="{}" when a dumped tool call has a function mapping without arguments. Then append one tool
  message per tool result with role="tool", tool_call_id from get("tool_call_id") (otherwise None), name from
  get("name") (otherwise None), and content from get("result", "") (otherwise the empty string). A failure while
  reading or dumping the first choice logs the exception diagnostic "Failed to convert assistant message for MCP
  flow" and drops only that assistant message; the original messages and tool-result messages still return in order.


  A Responses follow-up starts with original_input only when it is truthy: a string "hello" becomes
  {type:"message",role:"user",content:"hello"}, a list is extended item-for-item, and another truthy value is
  appended unchanged. For each response.output item, model_dump(exclude_none=True) is used for a non-dict model;
  function_call items use call_id or id, retain only truthy call_id and name, and copy type="function_call", call_id,
  name and arguments. A reasoning item is retained only when preserve_reasoning=true. A message item contributes its
  list content item-for-item or contributes its scalar content as one item. The assistant message is omitted when
  its collected content is empty; unknown item types and function calls missing a truthy call_id or name are ignored.
  Tool results are then appended as type="function_call_output", call_id=tool_result["tool_call_id"],
  output=tool_result["result"], in input order; a missing required key raises the same missing-key error rather
  than silently inventing a value.


  Persistence is disabled only when call_params.get("store") is the boolean False (not when the key is absent,
  None, 0 or the string "false"). The caller passes previous_response_id when persistence is disabled and the
  prior response id otherwise; this slice makes no persistence write. _make_follow_up_call forwards input, model,
  tools, previous_response_id and every call parameter to aresponses, preserving provider-returned success or
  error behavior. Its pending plan must retain tools=None and previous_response_id=None when those values are absent.


  Build streaming request parameters in this order: {input, model, tools}; add previous_response_id only when it is
  not None; overwrite with call_params; then overwrite again with kwargs. The streaming wrapper constructs
  MCPEnhancedStreamingIterator with base_iterator=None, the supplied discovery events, tool_server_map,
  mcp_tools_with_litellm_proxy, and user_api_key_auth from kwargs["user_api_key_auth"] or
  kwargs["litellm_metadata"]["user_api_key_auth"]. An absent metadata mapping uses {}, while a present non-mapping
  value reaches its .get failure. Initial parameters copy call_params and force stream=false only when
  should_auto_execute=true. Follow-up parameters copy call_params, set stream to the supplied original boolean, and
  remove tool_choice whether its old value was "auto", "required", a named tool, None, or absent.


  For every tool result, find the first tool call with the same tool_call_id. Missing tool_call_id or result uses
  "unknown" and "" respectively; an explicit null keeps null. A matching falsy name or arguments becomes
  tool_name="unknown" or tool_arguments="{}". Create MCP call events with base_item_id="mcp_" plus eight
  hexadecimal ID characters, output_index=0, and sequence_start=len(events)+1. The event builder supplies
  response.mcp_call.in_progress, response.mcp_call_arguments.delta, response.mcp_call_arguments.done and then
  response.mcp_call.completed plus response.output_item.done when result is not None; result=None instead ends with
  response.mcp_call.failed. Preserve result
  order and the resulting sequence gaps (five events for a non-null result, four for null).


  Append two output items to the existing ResponsesAPIResponse.output without reordering existing items. The first
  has type="mcp_tools_fetched", id beginning "mcp_tools_" and eight hexadecimal ID characters after the prefix,
  status="completed", role="system", and one OutputText item with type="output_text", annotations=[], and
  json.dumps(mcp_tools_fetched, indent=2, default=str). The second has type="tool_execution_results", id beginning
  "tool_results_", status="completed", role="system", annotations=[], and the same OutputText fields with
  json.dumps(tool_results, indent=2, default=str). The append order is fetched tools, then tool results.


  Write tests.rs beside the module under api::responses_mcp_followup::tests. Each named behavior function must call
  production code and compare the exact typed records, ordered diagnostics and effects: chat_message_defaults,
  response_input_order, persistence_response_id, request_param_precedence, tool_execution_event_order,
  call_parameter_streaming, output_element_append_order, assistant_conversion_warning, and provider_call_error.
  Use rstest cases for falsey/missing values. This slice transforms decoded records and adds no outside-byte parser,
  so it adds no cargo-fuzz target; replays_corpus is not required.


  Register HelperCall::ResponsesMcpFollowup in tools/oracle/src/helpers/mod.rs (and helpers.rs when it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each helper fixture uses call:
  {responses_mcp_followup: <typed input>}; responses_mcp_followup is the Python protocol key, not a fixture tag.
  The Rust adapter calls this production service and the Python adapter invokes the pinned MIT functions with
  independently scripted choices, response items, tool results, call params and injected IDs. The provider-call
  case uses the mock provider seam and compares the exact follow-up request fields plus the returned provider error;
  it does not compare a fixture with itself. HTTP auth and route response cases remain with the route callers.


  The owned ranges contain 247 nonblank, non-comment, non-docstring Python lines (282 nonblank, non-comment
  physical lines including signatures and docstrings). Estimate 267 implementation lines, 120 behavior-test lines,
  80 helper fixtures, 90 Rust/Python adapter lines and 30 wiring lines: 587 changed lines, within the 600-line cap.
  Direct inputs are B012's diagnostic seam, B171's helper oracle, B902's Responses records, B950's typed MCP tool
  results, B1087's API limits, B932's Responses provider-call seam and B952's MCP event builder. These are callable
  owners, not umbrella provider dependencies.
