id: B951
title: Responses mcp followup
description: >-
  Build chat and Responses follow-up inputs, tool-execution events and final MCP output composition using responses-mcp-execute
  results. Respect persistence-disabled history, preserve output order and expose typed pending-followup plans rather
  than recursively invoking an endpoint.


  Implement crates/betterlite-core/src/api/responses_mcp_followup.rs. Use ResponsesMcpFollowupInput and ResponsesMcpFollowupResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions persistence_disabled_history, mcp_output_item_order, followup_tool_results,
  failure_event_fields, parent_request_tags under api::responses_mcp_followup::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesMcpFollowup in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_mcp_followup: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._create_follow_up_messages_for_chat
  (L975-L1017); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._is_persistence_disabled
  (L1020-L1022); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._create_follow_up_input
  (L1025-L1101); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._make_follow_up_call
  (L1104-L1118); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._create_mcp_streaming_response
  (L1146-L1188); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._build_request_params
  (L1191-L1222); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._create_tool_execution_events
  (L1225-L1272); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._prepare_initial_call_params
  (L1275-L1288); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._prepare_follow_up_call_params
  (L1291-L1308); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._add_mcp_output_elements_to_response
  (L1311-L1357). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 247 owned nonblank/non-comment/non-docstring Python lines (282 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 267 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 517 total within the 520-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B012 (Logging pipeline, callback registry and redaction), B171 (Direct helper oracle and
  URL path encoding), B902 (Responses shapes), B950 (Responses mcp execute), B1087 (Api boundaries), B932 (Responses
  create call), B952 (Responses mcp events). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
