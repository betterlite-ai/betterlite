dod:
- text: >-
    chat_message_defaults asserts original-message preservation, assistant function.arguments="{}" repair, and
    tool messages with role="tool", None tool_call_id/name and empty content defaults in their exact append order.
  proof:
  - case-chat-message-defaults
  - oracle
- text: >-
    response_input_order asserts truthy string/list/record input handling, assistant content grouping, function-call
    call_id-or-id selection, reasoning preservation, ignored incomplete items and ordered function_call_output records.
  proof:
  - case-response-input-order
  - oracle
- text: >-
    persistence_response_id asserts that only store=false selects the prior response id, while absent, null, 0 and
    "false" leave persistence enabled and no repository write is recorded.
  proof:
  - case-persistence-response-id
  - oracle
- text: >-
    request_param_precedence asserts core input/model/tools, conditional previous_response_id, call_params overwrite,
    kwargs overwrite, and the user_api_key_auth fallback used by the streaming wrapper.
  proof:
  - case-request-param-precedence
  - oracle
- text: >-
    tool_execution_event_order asserts unknown/empty defaults, first matching tool call, output_index=0, mcp_ IDs,
    five events for a non-null result, four for null, and sequence starts after the prior event count.
  proof:
  - case-tool-execution-event-order
  - oracle
- text: >-
    call_parameter_streaming asserts initial stream=false for auto execution, follow-up stream restoration for both
    true and false, and removal of every tool_choice value before the follow-up provider plan.
  proof:
  - case-call-parameter-streaming
  - oracle
- text: >-
    output_element_append_order asserts in-place preservation of existing output followed by completed system
    mcp_tools_fetched and tool_execution_results items, their ID prefixes, output_text fields, indent=2 JSON and
    annotations=[] in that order.
  proof:
  - case-output-element-append-order
