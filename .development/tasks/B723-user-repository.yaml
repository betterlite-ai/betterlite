id: B723
title: User and organization repositories
description: >-
  Implement UserRepository, OrganizationRepository and ProjectRepository against exact LiteLLM tables.
  Keep case-insensitive email lookup/backfill, shadow placeholder resolution, ordered team membership
  and spend writes. count_billable_users remains a reporting query but imposes no paid-tier cap. Use bound
  array parameters and DB constraints, not in-memory uniqueness assumptions.


  Build the production user_repository module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/user_repository.py:
  UserRepository.__init__ (L43-L45; 3 source lines), UserRepository.table (L48-L50; 3 source lines), UserRepository.model_class
  (L53-L54; 2 source lines), UserRepository._to_model (L56-L66; 10 source lines), UserRepository.find_by_id
  (L68-L69; 2 source lines), UserRepository.find_by_email (L71-L74; 4 source lines), UserRepository.find_by_emails
  (L76-L99; 22 source lines), UserRepository.find_by_sso_id (L101-L103; 3 source lines), UserRepository.find_by_organization_id
  (L105-L107; 3 source lines), UserRepository.find_by_team_id (L109-L111; 3 source lines), UserRepository.find_shadowing_placeholders
  (L113-L116; 4 source lines), UserRepository.count_billable_users (L118-L130; 11 source lines), UserRepository.create_user
  (L132-L193; 61 source lines), UserRepository.update_user (L195-L256; 61 source lines), UserRepository.backfill_null_user_email
  (L258-L267; 9 source lines), UserRepository.delete_user (L269-L271; 3 source lines), UserRepository.update_spend
  (L273-L275; 3 source lines), UserRepository.add_to_team (L277-L282; 5 source lines), UserRepository.remove_from_team
  (L284-L296; 11 source lines). litellm/repositories/organization_repository.py: _OrganizationDb.litellm_organizationtable
  (L20-L20; 1 source lines), _PrismaClientView.db (L27-L27; 1 source lines), OrganizationRepository.table
  (L34-L36; 3 source lines), OrganizationRepository.model_class (L39-L40; 2 source lines), OrganizationRepository.find_by_id
  (L42-L45; 4 source lines), OrganizationRepository.find_by_alias (L47-L50; 4 source lines), OrganizationRepository.create_organization
  (L52-L78; 26 source lines), OrganizationRepository.update_organization (L80-L103; 23 source lines),
  OrganizationRepository.delete_organization (L105-L107; 3 source lines), OrganizationRepository.update_spend
  (L109-L111; 3 source lines). litellm/repositories/project_repository.py: ProjectRepository.table (L20-L21;
  2 source lines), ProjectRepository.model_class (L24-L25; 2 source lines), ProjectRepository.find_by_id
  (L27-L28; 2 source lines), ProjectRepository.find_by_alias (L30-L33; 4 source lines), ProjectRepository.find_by_team_id
  (L35-L37; 3 source lines), ProjectRepository.create_project (L39-L79; 40 source lines), ProjectRepository.update_project
  (L81-L119; 38 source lines), ProjectRepository.delete_project (L121-L123; 3 source lines), ProjectRepository.update_spend
  (L125-L127; 3 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the user_repository operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a user-repository-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 390 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  390 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 639 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
