id: B723
title: User lookups, SCIM placeholders and organization/project readers
description: >-
  Implement the live user_repository paths over B700 repository operations, B714 db/writer_db
  routing and B720/B721 rows. Own UserRepository.__init__, table, model_class, _to_model,
  find_by_id, find_by_emails, find_shadowing_placeholders, count_billable_users and
  backfill_null_user_email, with its JSON field set, placeholder SQL and row adapter. Own
  OrganizationRepository table/model_class/find_by_id and its database protocols, and
  ProjectRepository table/model_class/find_by_id. Raw table access remains available to the
  management owners; unused convenience methods below are not production CRUD policy.

  UserRepository use_writer defaults false, choosing client.db.litellm_usertable; true chooses
  writer_db. Organization and project readers always take the supplied client.db and exact tables
  litellm_organizationtable/litellm_projecttable, so a caller can supply B714's pinned handle.
  find_by_id defaults the identifying field to user_id, organization_id or project_id respectively;
  delegate query/result/error semantics to B700, including None when no row is returned. Do not
  attach a public 404/authentication error or extra related-row query at this layer.

  User _to_model returns None for None. Otherwise B700 record_to_dict supplies fields; independently
  JSON-decode strings only for metadata, model_spend and model_max_budget into a fresh mapping,
  then validate B720 UserTable. Invalid JSON propagates, not {} or a warning. Decoded null is valid
  for all three fields; decoded arrays/scalars fail their dict types. Already decoded values pass
  through unchanged, and fields such as teams/models/organization_memberships are not string-decoded.
  A second embedded JSON string is not recursively parsed. B720 normalizes user spend/models/teams
  nulls and excludes password from dumps; this repository never hashes or encrypts a password.
  Organization/project use B700's ordinary conversion and have no equivalent JSON-string prepass.

  find_by_emails first takes an exact, case-sensitive set of input strings, sorts it lexically, then
  issues sequential case-insensitive membership queries in 5000-value slices. Do not lowercase
  before deduplicating, trim addresses, treat '%'/'_' as patterns or add a per-query limit/order.
  Implement each page with bound values and database case folding under the existing collation.
  Empty input returns an empty sequence without even accessing the client. Concatenate page results
  in page order without deduplicating output: differently cased spellings separated across page
  boundaries can return the same user twice. Within a page row order remains unspecified. A later
  query/decode failure aborts the whole result, with no partial return. B700's single-array deviation
  for generic find_many_in does not change this separate method's pagination/snapshot behavior.

  find_shadowing_placeholders executes the compiled SQL on its explicit transaction argument,
  ignoring the repository's ordinary read handle. Select candidate p with sso_user_id IS NULL and
  no VerificationToken whose user_id matches p.user_id; even an expired or blocked key disqualifies
  p. Join a different user r when r.sso_user_id exactly equals p.user_id OR LOWER(r.user_email)
  equals LOWER(p.user_id). The email match does not use p.user_email. Empty sso_user_id is not NULL.
  One matching r contributes once even if both OR predicates match; multiple resolved users are
  array_agg ordered by r.user_id, and placeholder rows order by p.user_id. Preserve p.teams as
  team_ids with its stored order/duplicates, grouped with p.user_id. B720 SCIMPlaceholder validates
  every returned row; SQL NULL teams fails its tuple field instead of being silently repaired. A
  malformed result rejects the whole operation. This query does not merge/delete any user or team.

  count_billable_users makes two separate reads: total users, then metadata path ['scim_active']
  equal to JSON boolean false. Return max(0,total-deactivated). Missing metadata/path, SQL or JSON
  null, true, the string 'false', zero and a JSON-string-encoded metadata object still count. Do
  not collapse the two queries into a snapshot count: concurrent changes may make the second
  larger than the first, which is why the source clamps to zero. It remains a reporting operation;
  there is no premium_user branch or license-limit enforcement in these owned functions.

  backfill_null_user_email executes one conditional UPDATE for user_id AND user_email IS NULL,
  setting the supplied email verbatim and returning the affected row count. No row or an already
  non-NULL value, including '', returns zero. Two competing backfills leave the first winner's
  value and the loser returns zero. Do not first SELECT then overwrite or normalize the supplied
  email. No new transaction or audit write is added. Database and row-conversion errors propagate;
  there are no owned warn-and-drop paths, environment reads or configuration settings.

  B860 Postgres cases run through POSTGRES_TEST_URL or testcontainers, failing if setup fails.
  Verify the case/page boundaries, SQL join predicates and conditional-update race with actual
  rows and independent connections. Instrument the two billable-count reads to insert a concurrent
  change between them. Only pure UserRepository._to_model is an oracle helper in B856's database
  namespace, invoked on a repository with no client; effectful methods are not mocked Python helper
  cases. Add B171 envelope seeds. decode_user_record handles the three external JSON-string fields;
  register a user_record target in B2307's fuzz workspace with 1048576-byte/depth-64 bounds on each
  new decode. Replay malformed/truncated JSON, nullable fields, duplicate keys and limit boundaries.

  Caller pruning leaves about 105 nonblank noncomment lines including the placeholder SQL and
  structural declarations. Budget 155 native query/projection code, 320 behavior/Postgres tests,
  60 oracle adapters, 45 fuzz and 30 wiring, 610 within 700. Keep projection, email lookup,
  placeholders and reporting in separate modules below 300 lines.
scope:
  paths:
    - crates/betterlite-db/src/user_repository.rs
    - crates/betterlite-db/src/user_repository/**
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/user_record.rs
    - crates/betterlite-db/fuzz/corpus/user_record/**
    - tools/oracle/src/helpers/db/user_repository.rs
    - tools/oracle/src/helpers/db/user_repository/**
    - tools/oracle/helpers/user_repository.py
    - tools/oracle/helpers/user_repository/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/user-repository/**
    - tools/oracle/fuzz/corpus/helper_case/user-repository-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/user_repository.py#L21-L69
    why: JSON field set, exact placeholder SQL, writer selection and user-id default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/user_repository.py#L76-L99
    why: Exact-string deduplication, sorted 5000-item sequential pages and no output deduplication.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/user_repository.py#L113-L130
    why: Explicit transaction query and the two-read billable count with a zero floor.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/user_repository.py#L258-L267
    why: Null-only conditional email update and raw affected-row count.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/organization_repository.py#L16-L45
    why: Organization table protocol and default organization_id lookup, with no custom row decoder.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/project_repository.py#L16-L28
    why: Project table/model selection and default project_id lookup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/chunked_in.py#L19-L22
    why: The 5000-item constant used by the distinct case-insensitive email lookup.
dod:
  - text: 'Pure oracle cases name absent_user_record, three_user_json_columns,
      nullable_json_text_and_invalid_scalar_shapes, malformed_user_json_propagates,
      unlisted_user_fields_not_decoded, no_recursive_string_decode,
      original_record_unchanged and decoded_user_retains_password_exclusion.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Lookup tests name user_writer_selection_and_default_ids, organization_project_default_ids,
      missing_rows_and_errors_preserved, email_empty_skips_missing_client,
      postgres_email_matching_literal_case_insensitive, email_exact_set_then_sort,
      email_five_thousand_page_boundary, email_page_order_and_duplicate_output,
      email_later_page_error_no_partial_result, postgres_shadow_placeholder_predicates,
      placeholder_or_match_not_duplicated, placeholder_order_and_team_order,
      placeholder_uses_explicit_transaction and placeholder_null_teams_validation_failure.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Write/reporting tests name postgres_email_backfill_race,
      existing_empty_or_different_email_unchanged, backfill_missing_row_zero,
      backfill_supplied_email_verbatim, postgres_billable_json_boolean_only,
      billable_two_reads_and_concurrent_zero_floor and count_error_propagates.
      native_user_record_field_limits proves the recorded decoder caps; corpus replay calls
      decode_user_record rather than a stand-alone test parser.'
    proof: [behavior-tests, postgres-tests, parser-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Email pagination, row projection and count sequencing require independent assertions.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^user_repository::tests::/) - test(replays_the_user_record_corpus)'
    - id: helper-python
      why: Only the real pure user-row conversion is callable by this helper adapter.
      run: test -f tools/oracle/helpers/user_repository.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: A newly added user_repository operation must replay through the existing helper envelope.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/user-repository-*")" && grep -rlq user_repository tools/oracle/fuzz/corpus/helper_case/user-repository-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Real joins, case matching, update races and JSON predicates must determine results.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/user_repository::tests::postgres_email_matching_literal_case_insensitive$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/user_repository::tests::postgres_shadow_placeholder_predicates$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/user_repository::tests::postgres_email_backfill_race$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/user_repository::tests::postgres_billable_json_boolean_only$/)'
    - id: parser-corpus
      why: Stored user JSON fields must use the same bounded decoder in production and fuzz replay.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/user_record.rs && grep -q user_record crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/user_record)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_user_record_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/user-repository/three-json-columns.yaml
  - tools/oracle/cases/helpers/user-repository/null-invalid-and-unlisted-fields.yaml
deviations:
  - what: Stored user JSON-string fields above 1048576 bytes or depth 64 produce a typed decode-limit error.
    why: Bound the new field decoder without dropping corrupt data; native_user_record_field_limits covers both boundaries.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/user_repository.py#L56-L66
out_of_scope:
  - UserRepository.find_by_email, find_by_sso_id, find_by_organization_id, find_by_team_id,
    create_user, update_user, delete_user, update_spend, add_to_team and remove_from_team have no
    live caller at the pin. Actual membership/password/spend writes remain with their route/job owners.
  - OrganizationRepository.find_by_alias, create_organization, update_organization,
    delete_organization and update_spend have no caller at the pin.
  - ProjectRepository.find_by_alias, find_by_team_id, create_project, update_project,
    delete_project and update_spend have no caller at the pin.
pitfalls:
  - 'The oracle helper for this task is pre-registered as user_repository in the db group. Replace the stub Op in tools/oracle/src/helpers/db/user_repository.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/user_repository.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Case-sensitive input deduplication can return one user twice when differently cased emails fall in different pages.
  - A placeholder with any key is excluded even when that key is expired or blocked.
  - Billable-user counting uses two reads, so concurrent changes can exercise the explicit zero floor.
budget:
  max_changed_lines: 700
  max_new_expects: 0
review_level: security
