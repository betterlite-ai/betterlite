deviations: []
out_of_scope:
- Identity/prefix primitives lines 19-277 are B209; defaults and _dashscope_family_chat_config lines 566-936 are
  B210/B211.
- is_registered_custom_provider and Python custom-provider registration are B164; actual provider authentication/execution
  belongs to B024-B050.
pitfalls:
- 'The oracle helper for this task is pre-registered as provider_resolution in the models group. Replace the stub Op in tools/oracle/src/helpers/models/provider_resolution.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/provider_resolution.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The native OpenRouter model openrouter/auto is not the same prefix case as openrouter/anthropic/claude-3.5-sonnet.
- Do not add betterlite-provider as a dependency of betterlite-openai if the executable dispatcher will depend on
  betterlite-openai; pass resolved inputs from the caller.
- No flat provider trait-object registry is allowed by the closed-set rule.
- get_llm_provider runs OAuth device flows for PROVIDERS_THAT_AUTHENTICATE_ON_PROVIDER_INFO (github_copilot/chatgpt);
  compare declarations only and exclude those providers from oracle resolver calls.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
