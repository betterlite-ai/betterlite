id: B174
title: Provider identity and model resolution
description: >-
  Finish get_llm_provider resolution in betterlite-models/src/resolution.rs using B209 identity/prefix primitives
  and B210/B211 default tables. Own lines 278-562 endpoint/catalog inference, missing-provider errors, full inferred_provider
  behavior and composition; ProviderId is defined by B209 and the executable Provider enum by B010. Use B193 catalog
  and injected resolved config, preserve model suffixes, and support litellm_params.custom_llm_provider in config/server
  deployment construction. Endpoint inference compares parsed host and path locally and does not need B009 transport.
  Budget 280 resolver/integration, 110 adapters, 300 tests and 50 wiring (740 total). Write the behavior rstest
  functions provider_resolution_tests_behavior in adjacent tests.rs files, with a named case for each behavior
  and failure in the DoD; corpus replay tests have separate names. The helper operation provider_resolution is already registered; each operation has its own Rust and Python
  adapter file and corpus seed.


  These pure policies live in betterlite-models below the executable provider dispatcher. They use catalog/wire
  DTOs and closed config tags or caller-supplied policy projections, never an executable provider client. B010 reexports
  ProviderId and composes the final provider enum; do not introduce a reverse import from this crate to betterlite-provider
  or betterlite-core.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-models/**
  - crates/betterlite-config/**
  - crates/betterlite-openai/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/models/provider_resolution.rs
  - tools/oracle/src/helpers/models/provider_resolution/**
  - tools/oracle/helpers/provider_resolution.py
  - tools/oracle/helpers/provider_resolution/**
  - tools/oracle/cases/helpers/provider-resolution/**
  - crates/betterlite-server/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L19-L155
  why: Endpoint boundary checks and declared versus inferred provider identity.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L158-L277
  why: Explicit provider, prefix, OpenRouter native IDs and registry precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L278-L562
  why: Known endpoint/model inference and unknown-model errors.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L577-L936
  why: Provider defaults and credential-name metadata; adapters retain actual authentication.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/README.md#L1-L11
  why: Keep transformation code with the provider that owns it.
dod:
- text: All listed provider-resolution cases compare model, identity, base and synthetic key selection with the
    pinned Python function.
  proof:
  - oracle
  - helper-python
- text: Resolution never enables an absent adapter, reaches the network, reads ambient environment or leaks a credential
    through Debug/errors.
  proof:
  - provider-resolution-tests
- text: Only configuration can select a base or environment credential, and existing OpenAI chat behavior survives
    the integration.
  proof:
  - provider-resolution-tests
  - oracle
  - helper-python
- text: The existing config parser corpus includes the new typed provider field.
  proof:
  - config-yaml-corpus
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: provider-resolution-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-models -p betterlite-config --no-tests=fail -E 'test(/::provider_resolution_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'custom_llm_provider' crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'provider_resolution' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
