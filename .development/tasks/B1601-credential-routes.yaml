id: B1601
title: Credential registry, config loading and credential handlers over store ports
description: >-
  Implement CredentialRegistry and all functions in credential_accessor.py and the handlers and helpers of
  credential_endpoints/endpoints.py as a library in crates/betterlite-server/src/credentials.rs (add your modules next to
  the existing migration and rotation lines) and credentials/**. Use B725's row types, B1600 encryption and B732
  identities. The handlers take their collaborators as traits: a credential store (create, read by name, update, delete,
  over the encrypted B721 row shape) and the deployment lookup by model id that GET /credentials/by_model needs. Expose a
  router builder for POST/GET /credentials, GET /credentials/by_name/{credential_name:path},
  GET /credentials/by_model/{model_id} and PATCH/DELETE /credentials/{credential_name:path} (no /v1 aliases) over a state
  that holds the registry, an optional store and the lookup. The store is optional because LiteLLM answers POST, PATCH
  and DELETE with 500 and CommonProxyErrors.db_not_connected_error when prisma_client is None.


  Decode bounded bodies with decode_credential_request(&[u8]) and distinguish unset, empty and nonstring values.
  model_id overrides explicit credential_values. Encrypt a copy for storage and update memory only after the write
  succeeds. Preserve first-match lookup and the original-name snapshot during bulk upsert. PATCH encrypts only supplied
  values, retains the source's unusual credential_info membership test, and does not warm a DB-only credential. Export
  update_db_credential with the store as a parameter, for B1700's rotation. GET reads memory; by_name and by_model masking
  shows four characters followed by four asterisks.


  credential_list config. The loader refuses top-level keys no section claims (crates/betterlite-config/src/loader.rs
  load_document, unknown_paths), and no section claims credential_list yet. Add the section the way B1006 and B918 did:
  crates/betterlite-config/src/sections/credential_list.rs with a Raw that reads the top-level credential_list and a
  Settings holding Vec<CredentialItem>, plus its `pub mod` line and its entry in the `sections!` list in sections.rs.
  CredentialItem and its parsing live in crates/betterlite-config/src/credentials.rs; config values and mutations use
  the same secret-bearing registry. B8590 calls this parsing at boot and B8610 holds the one registry in Shared.


  Rust tests drive the router with tower's oneshot over a fake store and a fake lookup: success, the 404 missing-target
  answers, the 409 duplicate, the 400 invalid body, the 500 no-database answer, ciphertext in what the store receives,
  failed-write memory state, rename ordering and duplicate upserts. Fuzz credential_request and extend the existing
  config_yaml corpus.


  This task does not mount anything. B1100's stubs crates/betterlite-server/src/routes/credentials.rs and
  state/credentials.rs stay as they are: no database handle reaches a slot before B8610, so B9987 implements the store
  over shared.db, fills both stubs after B8610, and owns the HTTP oracle cases. Ownership totals about 300 nonblank,
  noncomment source lines; allow 350 implementation, 220 tests and 120 decoder, config and fuzz lines.
scope:
  paths:
    - "crates/betterlite-config/src/loader.rs"
    - "crates/betterlite-config/src/types.rs"
    - "crates/betterlite-config/src/sections/usage_v2_accounting/tests.rs"
    - "crates/betterlite-config/src/sections/password_policy/tests.rs"
    - "crates/betterlite-config/src/providers"
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/credentials.rs
    - crates/betterlite-server/src/credentials/**
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/credential_request.rs
    - crates/betterlite-server/fuzz/corpus/credential_request/**
    - crates/betterlite-config/src/credentials.rs
    - crates/betterlite-config/src/credentials/**
    - crates/betterlite-config/src/sections.rs
    - crates/betterlite-config/src/sections/credential_list.rs
    - crates/betterlite-config/fuzz/corpus/config_yaml/credentials-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/credential_endpoints/endpoints.py#L32-L400
    why: Credential helpers and the complete decorated route implementations.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/credential_accessor.py#L10-L36
    why: Ordered lookup and upsert behavior.
dod:
  - text: The credential router answers success, missing-target, duplicate, invalid-body and no-database requests with LiteLLM's statuses and error bodies over a fake store.
    proof: [credential-tests]
  - text: Persistence failures leave memory unchanged and a cold PATCH does not create a resident entry.
    proof: [credential-tests]
  - text: Configured credentials load and credential body/config seeds replay through production decoders.
    proof: [credential-config-tests, credential-corpus]
checks:
  optional: [mutants]
  commands:
    - id: credential-tests
      why: Credential handlers, encryption placement or registry updates are incorrect.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^credentials::/) - test(replays_the_credential_request_corpus)'
    - id: credential-config-tests
      why: The config loader cannot construct typed credential_list entries.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^credentials::tests::loads_credential_list/)'
    - id: credential-corpus
      why: Credential-specific body and config corpus additions are missing or fail replay.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/credential_request.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/credential_request)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/credentials-*')" && cargo nextest run --locked -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(replays_the_credential_request_corpus) | test(replays_the_config_yaml_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
  - B785 owns the static /credentials/migrate-encryption and /credentials/migrate-encryption/check paths; compose them without a duplicate wildcard registration.
  - Ciphertext algorithms, bearer encryption and encrypted maps remain in B1600.
  - "B9987: the store over shared.db, routes/credentials.rs and state/credentials.rs, the Postgres fixture's credential rows and the HTTP oracle cases, including the permission answers that come from the auth layer."
pitfalls:
  - A PATCH of a DB row absent from credential_list deliberately leaves the GET list unchanged until refresh.
  - update_db_credential checks for the literal credential_info key inside the old info map before retaining it.
  - Duplicate creation returns HTTP 409 before any in-memory replacement.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
