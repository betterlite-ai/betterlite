id: B1601
title: Manage reusable credentials in Postgres and memory
description: >-
  Implement CredentialRegistry and all functions in credential_accessor.py and credential_endpoints/endpoints.py.
  Use B725 CredentialsRepository, B1600 encryption, B844 deployment lookup and B732 identities.
  Register POST/GET /credentials, GET /credentials/by_name/{credential_name:path},
  GET /credentials/by_model/{model_id}, PATCH/DELETE /credentials/{credential_name:path}, with no /v1 aliases.
  Decode bounded bodies with decode_credential_request(&[u8]); reuse B721 row types and distinguish
  unset, empty and nonstring values. model_id overrides explicit credential_values. Encrypt a copy
  for storage and update memory only after the write succeeds. Preserve first-match lookup and the
  original-name snapshot during bulk upsert. PATCH encrypts only supplied values, retains the source's
  unusual credential_info membership test, and does not warm a DB-only credential. Export
  update_db_credential for rotation callers. Load top-level credential_list through B002 with a
  loads_credential_list test; config values and mutations use the same secret-bearing registry.
  GET reads memory; by_name/by_model masking exposes four characters followed by four asterisks.
  Exercise every method through B860's independent database-backed HTTP proxies, comparing status,
  error type/param/code and content-type, ignoring only /error/message wording. Rust tests inspect
  ciphertext, failed-write memory state, rename ordering and duplicate upserts. Fuzz credential_request
  and extend the existing config_yaml corpus. Ownership totals 375 nonblank, noncomment source lines;
  allow 350 implementation, 180 tests, 120 decoder/config/fuzz and 100 wiring lines, total 750.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/credentials.rs
    - crates/betterlite-server/src/credentials/**
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/credential_request.rs
    - crates/betterlite-server/fuzz/corpus/credential_request/**
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/credentials.rs
    - crates/betterlite-config/src/credentials/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/credentials-*
    - tools/oracle/cases/management/credentials/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/credential_endpoints/endpoints.py#L32-L400
    why: Credential helpers and the complete decorated route implementations.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/credential_accessor.py#L10-L36
    why: Ordered lookup and upsert behavior.
dod:
  - text: Credential HTTP methods retain success, missing-target, duplicate, invalid-body and permission responses.
    proof: [oracle, credential-tests]
  - text: Persistence failures leave memory unchanged and a cold PATCH does not create a resident entry.
    proof: [credential-tests]
  - text: Configured credentials load and credential body/config seeds replay through production decoders.
    proof: [credential-config-tests, credential-corpus]
checks:
  optional: [mutants]
  commands:
    - id: credential-tests
      why: Credential handlers, encryption placement or registry updates are incorrect.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^credentials::/) - test(replays_the_credential_request_corpus)'
    - id: credential-config-tests
      why: The config loader cannot construct typed credential_list entries.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^credentials::tests::loads_credential_list/)'
    - id: credential-corpus
      why: Credential-specific body and config corpus additions are missing or fail replay.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/credential_request.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/credential_request)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/credentials-*')" && cargo nextest run --locked -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(replays_the_credential_request_corpus) | test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/management/credentials/create-and-duplicate.yaml
  - tools/oracle/cases/management/credentials/model-id-precedence.yaml
  - tools/oracle/cases/management/credentials/list-memory-masking.yaml
  - tools/oracle/cases/management/credentials/name-with-slashes.yaml
  - tools/oracle/cases/management/credentials/model-lookup-missing.yaml
  - tools/oracle/cases/management/credentials/patch-rename-and-empty-info.yaml
  - tools/oracle/cases/management/credentials/cold-patch.yaml
  - tools/oracle/cases/management/credentials/delete-twice.yaml
  - tools/oracle/cases/management/credentials/missing-database.yaml
  - tools/oracle/cases/management/credentials/auth-and-invalid-body.yaml
deviations: []
out_of_scope:
  - B785 owns the static /credentials/migrate-encryption and /credentials/migrate-encryption/check paths; compose them without a duplicate wildcard registration.
  - Ciphertext algorithms, bearer encryption and encrypted maps remain in B1600.
pitfalls:
  - A PATCH of a DB row absent from credential_list deliberately leaves the GET list unchanged until refresh.
  - update_db_credential checks for the literal credential_info key inside the old info map before retaining it.
  - Duplicate creation returns HTTP 409 before any in-memory replacement.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
