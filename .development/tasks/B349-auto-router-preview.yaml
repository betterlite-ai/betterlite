id: B349
title: Validate and preview automatic-router configurations
description: Add POST /auto_router/validate_complexity_router_config, /auto_router/availability and /auto_router/test_routing
  using B343's shared authorization service and the production complexity pipeline. Use a temporary immutable
  configuration rather than registering a live router. Route classifier and embedding calls through the
  normal caller identity and spend checks, with typed output. Build a bounded read-only catalog through
  B051; preserve ownership checks while returning unlimited capability/tuning allowance under the accepted
  no-paid-tier decision. Use the existing Rust crate boundaries from B004 and B008; integrate through
  the server when the provider dispatcher or callbacks live in another core crate. This task's source
  slices are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the
  matching adapters to B301's component runner where state is not observable over HTTP; adapters call
  production logic and never reproduce it. Use deterministic candidate sets or supplied random samples
  for comparisons, and separate seeded distribution tests for random choices. Add a cargo-fuzz target
  auto_router_preview under crates/betterlite-server/fuzz and a normal replays_the_route_probe_corpus
  test using the production parser. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/auto-router-preview/**
  - tools/oracle/src/router_probes/auto_router_preview/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/auto_router_preview.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L211-L617
  why: Authorization, saved-router resolution and the three preview routes.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/auto_router_endpoints.py#L18-L171
  why: Preview body variants and validation responses.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/auto_router_availability.py#L29-L148
  why: Catalog decoding and allowance result.
dod:
- text: Every listed case compares production behavior against pinned LiteLLM; any declared difference
    asserts exact reference and Rust outcomes through B361 instead of ignoring the difference.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the auto_router_preview prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(auto_router_preview)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-server/fuzz/fuzz_targets/route_probe.rs && test -n "$(ls -A
      crates/betterlite-server/fuzz/corpus/route_probe)" && cargo nextest run --locked -p betterlite-server
      --no-tests=fail -E 'test(replays_the_route_probe_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/auto-router-preview/config-valid-or-error-no-save.yaml
- tools/oracle/cases/routing/auto-router-preview/member-own-team-only.yaml
- tools/oracle/cases/routing/auto-router-preview/saved-model-owner-only.yaml
- tools/oracle/cases/routing/auto-router-preview/saved-model-404.yaml
- tools/oracle/cases/routing/auto-router-preview/catalog-unavailable-503.yaml
- tools/oracle/cases/routing/auto-router-preview/unlimited-allowances.yaml
- tools/oracle/cases/routing/auto-router-preview/prompt-versus-messages.yaml
- tools/oracle/cases/routing/auto-router-preview/saved-versus-inline-config.yaml
- tools/oracle/cases/routing/auto-router-preview/heuristic-no-provider-call.yaml
- tools/oracle/cases/routing/auto-router-preview/classifier-billed-to-caller.yaml
- tools/oracle/cases/routing/auto-router-preview/classifier-budget-denied.yaml
- tools/oracle/cases/routing/auto-router-preview/main-model-never-called.yaml
- tools/oracle/cases/routing/auto-router-preview/preview-no-decision-400.yaml
deviations:
- what: Availability returns uncapped capability and tuning allowances.
  why: The accepted product decision omits LiteLLM's enterprise license checks while retaining ownership
    and team authorization.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L395-L435
out_of_scope:
- Saving a router, editing quotas or serving a dashboard.
pitfalls:
- Dry-run classification can incur real classifier or embedding spend even though the chosen main model
  is never called.
- A member cannot supply plugin entrypoints, private ownership metadata or arbitrary upstream locations
  through a preview body.
- A validation failure is the typed valid=false response, not necessarily an HTTP error.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
