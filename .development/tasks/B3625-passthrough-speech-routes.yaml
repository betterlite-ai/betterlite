dod:
  - text: /azure_speech/{endpoint} and /azure_speech/ take GET, POST, PUT, DELETE and PATCH, and /transcribe/{operation} and /transcribe take only POST.
    proof: [route-table-tests]
  - text: "azure_speech_clean_path cuts at ? and #, percent-decodes, resolves dot segments and repeated slashes, keeps a trailing slash and always returns one leading slash."
    proof: [azure-path-tests]
  - text: resolve_azure_speech_base_url picks the family by prefix, lets api_base win over the region, builds https://{region}.{domain} otherwise, and returns None for an unknown prefix or when neither api_base nor region is set.
    proof: [azure-base-tests]
  - text: The Azure route answers 400 for an unsupported path, then 403 for a non-admin key on a batch path (every /speechtotext/ path except the fast transcription path), then 400 for a missing key, in that order, with the exact detail texts.
    proof: [azure-guard-tests, oracle]
  - text: The Azure route builds the target from the base and the cleaned path, sends only content-type, accept and Ocp-Apim-Subscription-Key upstream, never the caller's Authorization, passes the original endpoint, provider azure_speech and no streaming flag to the factory, and sets the raw body state value.
    proof: [azure-forward-tests, oracle]
  - text: The cleaned path never holds a dot segment, a double slash or a missing leading slash, and the decoder has a fuzz target and a corpus added on this branch.
    proof: [path-corpus]
  - text: The Transcribe route checks in order the operation, the region (three env vars in order), the body read, the object shape, the stream key and the unpriceable reason, each with its exact 400 text.
    proof: [transcribe-checks-tests, oracle]
  - text: The Transcribe route runs the admin-only, bucket, owner-tag and job-access policies of B3644 in LiteLLM's order and only for the operations LiteLLM names, and turns each refusal into its own status and detail.
    proof: [transcribe-policy-tests]
  - text: The Transcribe route signs the serialized body for service transcribe with the Transcribe.{operation} target header, passes only the signed headers and provider transcribe to the factory, uses the operation as the endpoint, and sets both request-state values (owner-tagged body and exact signed bytes).
    proof: [transcribe-signing-tests]
  - text: transcribe_sdk_route reads x-amz-target case-insensitively, rejects a wrong prefix or empty operation with the exact 400 text, and forwards the part after the first dot.
    proof: [transcribe-sdk-tests, oracle]
checks:
  optional: []
  commands:
    - id: route-table-tests
      why: a route path or method is missing, or a Transcribe route accepts a method other than POST
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::route_table(::|$)/)'
    - id: azure-path-tests
      why: the path cut, decode, dot-segment or slash rules are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::azure_path(::|$)/)'
    - id: azure-base-tests
      why: the family choice, api_base precedence or region host is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::azure_base_url(::|$)/)'
    - id: azure-guard-tests
      why: a 400 or 403 check is missing, out of order or has another text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::azure_guard(::|$)/)'
    - id: azure-forward-tests
      why: the target, the forwarded headers, the factory arguments or the raw body state value are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::azure_forward(::|$)/)'
    - id: path-corpus
      why: azure_speech_clean_path has no fuzz target, no new seed or a failing replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/azure_speech_clean_path)" && test -f crates/betterlite-server/fuzz/fuzz_targets/azure_speech_clean_path.rs && grep -qF "azure_speech_clean_path" crates/betterlite-server/fuzz/fuzz_targets/azure_speech_clean_path.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::replays_corpus$/)'
    - id: transcribe-checks-tests
      why: a Transcribe validation step is missing, out of order or has the wrong text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::transcribe_checks(::|$)/)'
    - id: transcribe-policy-tests
      why: a B3644 policy call is missing, runs for the wrong operation or loses its status and detail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::transcribe_policy(::|$)/)'
    - id: transcribe-signing-tests
      why: the signing inputs, signed bytes, forwarded headers, provider name or state values are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::transcribe_signing(::|$)/)'
    - id: transcribe-sdk-tests
      why: the SDK route reads the wrong header, splits at the wrong dot or has the wrong 400 text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_speech_routes::tests::transcribe_sdk(::|$)/)'
