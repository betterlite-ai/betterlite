deviations:
  - what: "Settings and environment variables arrive through injected parts (the secret reader, the general_settings map, the credential and signer traits), not from proxy globals or os.environ."
    why: "betterlite wires dependencies through constructors; a client sees the same values."
  - what: "The Transcribe body is serialized with serde_json (compact), not Python json.dumps with spaced separators and ASCII escapes. The signature covers the bytes actually sent, so AWS accepts either."
    why: "Reproducing json.dumps spacing buys nothing; the signed bytes and the sent bytes are the same value."
  - what: "A body that cannot be read on the Transcribe route gives 400 Request body must be valid JSON followed by the message where the message is B1100's wording, not Python's JSONDecodeError text."
    why: "The decoder is shared B1100 code, and LiteLLM's text is Python's parser message."
  - what: "azure_speech_clean_path does not parse a scheme or an authority inside the endpoint (`x:y/z`, `//host/z`); the text is treated as a path."
    why: "httpx would read those as URL parts and drop them; the endpoint is a path segment of the route, and the result is still checked against the same two families and the same base."
  - what: "A bare `/azure_speech` with no trailing slash is not registered."
    why: "LiteLLM's router answers it by redirect or 404 depending on FastAPI settings; betterlite's server fallback answers it."
  - what: "B3644's refusal messages (unpriceable reason, admin-only, bucket, owner tag, job access) keep their status codes but use betterlite's wording."
    why: "B3644 rewrote them under the errors-match-litellm rule; this route passes them through."
out_of_scope:
  - "create_pass_through_route, the state-key cleanup and the upstream send: B3615 and B6510. join_base_and_endpoint_path and the state-key constants: B3600."
  - "get_credentials: B3602. Header reads and the raw body read: B1100. is_proxy_admin: B1018."
  - "Transcribe policy functions (operations, cost rate, unpriceable reason, admin-only, buckets, storage, owner tag, job access) and the transcribe_job_lookup contract: B3644 owns the policy and B3645 owns TranscribeJobLookup, the media probe and pricing. Delayed spend logging for Transcribe: B3646."
  - "The Azure Speech logging handler, the route classifiers and the duration and cost rules (AZURE_SPEECH_SHORT_AUDIO_MODEL, AZURE_SPEECH_PRICING_MODEL, tick constants): B3652. Dispatch to it by custom_llm_provider: B3606."
  - "is_opaque_audio_pass_through_request and the auth-time body skip for /azure_speech: B1100."
  - "get_aws_dns_suffix: B198. get_credentials, sign_aws_json_post and run_aws_signing: B594 and B595."
  - "_proxy_general_settings and _json_request_body: not built; the settings map is injected and B1100 reads the body."
  - "_resolve_aws_passthrough_region exists once in LiteLLM; B3621 builds its own aws_passthrough_region for the Comprehend route and this task builds transcribe_region, because B3618 keeps single-route readers with the route that uses them."
  - "The /azure_speech and /transcribe entries in LiteLLMRoutes.llm_api_routes (proxy/_types.py L495-L496) and any route-to-call-type map: the auth route tables, not this module."
  - "Every other @router route in llm_passthrough_endpoints.py (Azure OpenAI and Milvus: B3624; Bedrock and Comprehend: B3621; the rest: B3619, B3626, B3627, B3628)."
pitfalls:
  - "The Azure family and admin guard are decided on the cleaned path, not the raw endpoint, so `speech/../speechtotext/v3.2/transcriptions` is a batch path and needs an admin key."
  - "The fast transcription path /speechtotext/transcriptions:transcribe starts with the batch prefix but is the one batch-prefix path a non-admin key may call; compare the whole cleaned path, not a prefix."
  - "An unknown prefix gives 400 even for an admin key, and a missing region and api_base gives the same 400 text as an unknown prefix; the 403 check comes after both."
  - "A missing Azure key is HTTP 400 here, not 401 as on the Fal route."
  - "api_base is returned as is (no region, no domain), so a custom domain serves both the short audio and the batch family."
  - "The factory gets the original endpoint string, not the cleaned path; only the target uses the cleaned path."
  - "The caller's Authorization header holds the LiteLLM key and must not reach Azure; only content-type and accept are copied, so a caller's x-api-key or cookie never goes upstream either."
  - "The Azure body is read as raw bytes and put in the raw-body state value; parsing it as JSON or form data would break audio uploads."
  - "The unsupported-operation check runs before the region and body checks, so an unknown operation is a 400 on a proxy with no AWS settings."
  - "A Transcribe body with \"stream\": false is still rejected; only the key's presence counts."
  - "The unpriceable check runs before the admin-only check, so even a non-admin key asking for StartCallAnalyticsJob sees the unpriced 400, not a 403."
  - "Bucket and owner-tag policies run only for StartTranscriptionJob, and the job-access check only for GetTranscriptionJob and DeleteTranscriptionJob; ListTranscriptionJobs and the other operations reach the signer after the admin-only check alone."
  - "The job-access check reads TranscriptionJobName from the original body, so a missing or non-string name gives B3644's 400 for a non-admin key, and an admin key skips it."
  - "The owner-tagged body is what is signed and sent for StartTranscriptionJob; the custom-body state value must hold that same tagged body, not the caller's."
  - "The SDK route splits X-Amz-Target at the first dot only, and the prefix is \"Transcribe\", not the Comprehend prefix."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
