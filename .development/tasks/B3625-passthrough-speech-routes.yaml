id: B3625
title: Pass-through Azure Speech and Transcribe routes
description: >-
  Register LiteLLM's two speech pass-through families as the module passthrough_speech_routes in crates/betterlite-server: the Azure AI Speech relay under /azure_speech and the Amazon Transcribe relay under /transcribe.
  Every route needs a valid virtual key (B052's authentication, LiteLLM's user_api_key_auth). Each route ends by building B3615's create_pass_through_route handler, calling it with the request, the response and the authenticated key, and returning its result unchanged.
  Values come from injected parts, never from globals or the process environment: the secret reader of B002 (LiteLLM's get_secret_str), B3602's get_credentials, the general_settings map, B594's credential resolver, B595's signer, B198's get_aws_dns_suffix, B3645's TranscribeJobLookup and B3615's handler factory. The module declares one small trait, `SpeechRates`, with `cost_per_second() -> Option<Decimal>`; B102's wiring implements it with B3644's transcribe_cost_per_second over the model cost catalog (the same split B3646 uses). Every name below is at most 30 characters; LiteLLM's longer names are renamed on purpose.

  Routes. `/azure_speech/{*endpoint}` takes GET, POST, PUT, DELETE and PATCH, and `/azure_speech/` (empty endpoint) is registered for the same five methods. `/transcribe/{operation}` and `/transcribe` take POST only; any other method is axum's 405. There is no /v1 or other alias. The architect adds the routes to the server route table once. The architect also adds betterlite-transcribe to betterlite-server's dependencies.

  Azure constants (LiteLLM keeps them in constants.py, which no task owns, so define them here as Rust consts): provider "azure_speech", route prefix "/azure_speech", short audio path prefix "/speech/", batch path prefix "/speechtotext/", fast transcription path "/speechtotext/transcriptions:transcribe", STT domain "stt.speech.microsoft.com", cognitive services domain "api.cognitive.microsoft.com", subscription key header "Ocp-Apim-Subscription-Key". `AZURE_SPEECH_FAMILIES` is the ordered pair (short audio prefix, STT domain), (batch prefix, cognitive services domain). The forwarded caller headers are `content-type` and `accept`.

  `azure_speech_clean_path(endpoint)` replaces canonical_azure_speech_endpoint_path. Take the path of the endpoint as httpx does: cut at the first `?` or `#`, then percent-decode. An empty result is "/". Then drop every leading `/`, put exactly one back, and resolve `.` and `..` segments and repeated slashes the way posixpath.normpath does (a `..` at the root stays at the root). When the decoded path ended with `/` and the result is not "/", add one `/` at the end. The result always starts with one `/`, and has no `.` segment, no `..` segment and no `//`. This path decides the endpoint family and the admin guard and is the path sent upstream, so all three agree.

  `resolve_azure_speech_base_url(path, api_base, region)` returns Option<Url>. Pick the first family in AZURE_SPEECH_FAMILIES whose prefix the path starts with; none gives None. With a family: a non-empty api_base is returned as the base (it wins over the region and serves both families); otherwise a non-empty region gives `https://{region}.{domain}`; otherwise None.

  `azure_batch_admin_only(path)` replaces azure_speech_path_manages_shared_resources. True when the path starts with "/speechtotext/" and is not exactly "/speechtotext/transcriptions:transcribe".

  `azure_speech_proxy_route(endpoint, request, response, auth, deps)` replaces azure_speech_proxy_route. Steps in order:
  1. path = azure_speech_clean_path(endpoint).
  2. Read AZURE_SPEECH_API_BASE and AZURE_SPEECH_REGION through the secret reader and call resolve_azure_speech_base_url. None gives HTTP 400 with the plain string detail "Unsupported Azure Speech path: {path}. Supported prefixes are /speech/ and /speechtotext/; set AZURE_SPEECH_REGION or AZURE_SPEECH_API_BASE in the proxy environment."
  3. If azure_batch_admin_only(path) and the key is not a proxy admin (B1018's is_proxy_admin), answer HTTP 403 with detail "{METHOD} {path} manages batch transcription resources that belong to the proxy's Azure Speech subscription and whose cost is unknown at request time, so it is limited to proxy admin keys. Use /speechtotext/transcriptions:transcribe for transcription that is priced per request." METHOD is the request method.
  4. Read the key with get_credentials(custom_llm_provider "azure_speech", region None). Env fallback is AZURE_SPEECH_API_KEY. None gives HTTP 400 (not 401) with detail "Azure Speech credentials not found. Set AZURE_SPEECH_API_KEY in the proxy environment."
  5. The target is the base with its path replaced by B3600's join_base_and_endpoint_path(base, path). Call that function directly; do not call B3618's provider_target_url, which would percent-decode the already cleaned path a second time.
  6. Custom headers: for each of `content-type` and `accept`, in that order, copy it from the caller's headers (B1100's cached header read, names compared lowercase) when present, then add `Ocp-Apim-Subscription-Key: {key}`. The caller's Authorization header is the LiteLLM key and is never copied.
  7. Read the request body as raw bytes through B1100 (audio and multipart bodies stay opaque and are not parsed).
  8. Build the handler with create_pass_through_route(endpoint = the original endpoint string, not the cleaned path, target, custom_headers, custom_llm_provider "azure_speech"). The streaming flag is not passed. Set the request-state value under B3600's LITELLM_PASS_THROUGH_RAW_BODY_STATE_KEY to the raw bytes, call the handler and return its result. B3615 clears the key afterwards.

  `transcribe_route(operation, request, response, auth, deps)` replaces transcribe_proxy_route. Every failure is an HTTPException with a plain string detail. Steps in order:
  1. If operation is not in B3644's transcribe_operations(), answer 400 "Unsupported Amazon Transcribe operation: {operation}. Supported operations: {names sorted in byte order, joined with ', '}". The match is case-sensitive.
  2. `transcribe_region()` replaces _resolve_aws_passthrough_region. It returns the first non-empty value of AWS_REGION_NAME, AWS_REGION, AWS_DEFAULT_REGION through the secret reader, in that order, else None. None gives 400 "AWS region not found. Set AWS_REGION_NAME in the proxy environment."
  3. Read the body as JSON through B1100's cached body read, whatever the content type is (the AWS SDK sends application/x-amz-json-1.1). A read failure gives 400 "Request body must be valid JSON: {message}".
  4. A body that is not a JSON object gives 400 "Request body must be a JSON object".
  5. A body object with a `stream` key, whatever its value, gives 400 "'stream' is not an Amazon Transcribe request member".
  6. Call B3644's unpriceable_request_reason(operation, body text, rates.cost_per_second()). A reason gives 400 with that text.
  7. Call B3644's transcribe_admin_only_refusal(operation, principal). A refusal gives its status_code and detail.
  8. Only for StartTranscriptionJob: call transcribe_storage_refusal(body text, transcribe_media_buckets(general_settings as JSON text), principal). A refusal gives its status_code and detail.
  9. Only for StartTranscriptionJob: call transcribe_owned_start_request(body text, principal). An Err refusal gives its status_code and detail; the Ok value is the request body from here on. Every other operation keeps the parsed body unchanged.
  10. Only for GetTranscriptionJob and DeleteTranscriptionJob: call B3644's transcribe_job_access_refusal with the JSON text of the original body's `TranscriptionJobName` member (the text `null` when the member is missing), the principal and a TranscribeJobLookup built from the region, the signer and the pooled client (B3645). A refusal gives its status_code and detail (404 for a job the caller does not own).
  11. Target `https://transcribe.{region}.{suffix}/`, with the suffix from B198's get_aws_dns_suffix(region). Serialize the request body to JSON once. Sign it with B595's sign_aws_json_post, run the way B595's run_aws_signing runs it (off the request task): credentials from B594's get_credentials with the region set and nothing else, service name "transcribe", the region, the target, the serialized body, and the headers `Content-Type: application/x-amz-json-1.1` and `X-Amz-Target: Transcribe.{operation}`.
  12. Build the handler with create_pass_through_route(endpoint = the operation, target = the signed request's URL, custom_headers = the signed request's headers exactly, custom_llm_provider "transcribe"). The streaming flag is not passed. Set B3600's LITELLM_PASS_THROUGH_CUSTOM_BODY_STATE_KEY to the request body (the owner-tagged one for StartTranscriptionJob) and LITELLM_PASS_THROUGH_RAW_BODY_STATE_KEY to the exact signed bytes, call the handler and return its result.

  `transcribe_sdk_route(request, response, auth, deps)` replaces transcribe_sdk_proxy_route. Read the `x-amz-target` request header (name case-insensitive, missing means empty). Split at the first ".": the part before it must equal "Transcribe" and the part after it must be non-empty, otherwise 400 "Expected an X-Amz-Target header of the form Transcribe.<Operation>" (the text ends with the literal characters <Operation>). Then return transcribe_route with that operation. The header "Transcribe.A.B" gives operation "A.B", which fails step 1.

  Fuzz. azure_speech_clean_path takes route text from outside, so add the cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/azure_speech_clean_path.rs (register its [[bin]] in the fuzz Cargo.toml like the existing targets). It feeds arbitrary UTF-8 text to the function and asserts the result starts with one `/` and has no `.` segment, no `..` segment and no `//`. Add seed files under crates/betterlite-server/fuzz/corpus/azure_speech_clean_path/ (dot segments, repeated slashes, `%2e%2e`, `%3F`, a trailing slash, the empty string) and the test passthrough_speech_routes::tests::replays_corpus that feeds every seed to the same function and asserts the same property.

  Tests. Rust tests live in tests.rs under passthrough_speech_routes::tests and use fakes: a recording fake for the secret reader, one for get_credentials, one for the handler factory (so a test sees the exact endpoint, target, custom headers, custom_llm_provider, streaming flag and state values it was called with), one for the signer and one for JobLookup. Test groups are route_table, azure_path, azure_base_url, azure_guard, azure_forward, transcribe_checks, transcribe_policy, transcribe_signing and transcribe_sdk. HTTP oracle cases are named below; the cases that reach the Azure forward use the mock upstream through `{{upstream}}`, set as AZURE_SPEECH_API_BASE under `environment_variables` in the case's config text. The oracle master key is a proxy admin, so the admin guard branches are proven by the Rust tests, not by HTTP cases. The Transcribe upstream is the fixed AWS host, so no Transcribe case reaches it; its cases stop at a 400.
