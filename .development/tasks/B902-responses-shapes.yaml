id: B902
title: Responses shapes
description: >-
  Define typed Responses input, output, usage, deletion and streaming event records alongside B004 OpenAI models,
  and the base Responses operation contract used by B010 adapters. Reuse existing OpenAI records; model function/custom-tool,
  web-search, code-interpreter, image-generation and commentary/final_answer variants. Abstract Python methods become
  closed request/result enums and capability data, not runtime class registries.


  Own Responses shape builders and compose the separate response-object, event-record and provider-contract parts;
  expose wire types from betterlite-openai and provider contracts from betterlite-provider. B1113 owns the event
  union and all event records, B1138 owns usage/response objects.


  Implement crates/betterlite-core/src/api/responses_shapes.rs, crates/betterlite-openai/src/api/responses_shapes.rs.
  Use ResponsesShapesInput and ResponsesShapesResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions web_search_result_sources, code_interpreter_stderr, delete_null_fields,
  output_phase under api::responses_shapes::tests. Each named function drives production code and asserts its case
  result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-openai::api::responses_shapes::decode_responses_shapes(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/responses_shapes.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-openai/fuzz/fuzz_targets/responses_shapes.rs passes arbitrary bounded bytes to that exact decoder;
  api::responses_shapes::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  Register HelperCall::ResponsesShapes in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_shapes: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/types/responses/main.py: build_web_search_call (L44-L71); litellm/types/responses/main.py:
  build_code_interpreter_log_outputs (L101-L116); litellm/types/responses/streaming_websocket.py: ResponsesClientWebSocket.send_text
  (L13-L13); litellm/types/responses/streaming_websocket.py: ResponsesClientWebSocket.receive_text (L15-L15); litellm/types/responses/streaming_websocket.py:
  ResponsesBackendWebSocket.recv (L21-L21); litellm/types/responses/streaming_websocket.py: ResponsesBackendWebSocket.send
  (L23-L23); litellm/types/responses/streaming_websocket.py: ResponsesBackendWebSocket.close (L25-L25); litellm/types/responses/streaming_websocket.py:
  PresidioGuardrailCallback.get_presidio_settings_from_request_data (L35-L35); litellm/types/responses/streaming_websocket.py:
  PresidioGuardrailCallback.check_pii (L37-L43); litellm/types/responses/streaming_websocket.py: ResponsesWebSocketRequestDefaults.merged_into
  (L53-L54). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 131 owned nonblank/non-comment/non-docstring Python lines (164 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 151 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 451 total within the 460-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B010 (Provider framework, provider resolution
  and parameter mapping), B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B1114 (Responses
  provider contract), B1138 (Responses objects and usage), B1113 (Responses streaming event records). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
