checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_shapes::/)
      - test(/::replays_corpus$/)'
  - id: case-web-search-result-sources
    why: the web-search-result-sources behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_shapes::tests::web_search_result_sources($|::)/)'
  - id: case-code-interpreter-stderr
    why: the code-interpreter-stderr behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_shapes::tests::code_interpreter_stderr($|::)/)'
  - id: case-delete-null-fields
    why: the delete-null-fields behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_shapes::tests::delete_null_fields($|::)/)'
  - id: case-output-phase
    why: the output-phase behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_shapes::tests::output_phase($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/responses_shapes)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/responses_shapes.rs && grep -qF "decode_responses_shapes"
      crates/betterlite-openai/fuzz/fuzz_targets/responses_shapes.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::responses_shapes::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_shapes.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_shapes-*)"
      && grep -qE "^[[:space:]]+responses_shapes:" tools/oracle/fuzz/corpus/helper_case/responses_shapes-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-shapes)"
