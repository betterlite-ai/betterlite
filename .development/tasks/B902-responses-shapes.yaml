id: B902
title: Responses output shapes and builders
description: >-
  Put the records from types/responses/main.py in betterlite-openai::api::responses_shapes,
  below the response object and provider contracts. Own both complete builders and
  ResponsesWebSocketRequestDefaults.merged_into; translate the socket and Presidio protocols
  into injected interfaces without importing proxy code. Response objects, events and
  provider execution consume these records; they are not prerequisites for defining them.

  Keep nullable required fields distinct from fields with defaults. OutputText requires type,
  text and annotations even when null; OutputFunctionToolCall requires arguments, call_id,
  name, type, id and status, with phase default null. GenericResponseOutputItem requires
  type, id, status, role and content; its phase also defaults null. Phase accepts commentary,
  final_answer and null. CustomToolCallOutputItem requires type=custom_tool_call, call_id,
  name and input; id and status default null. Image and code-interpreter outputs retain their
  four status values in_progress, completed, incomplete and failed. DeleteResponseResult's
  id, object and deleted are required but nullable; _hidden_params is private, initially empty.
  DecodedResponseId is the optional-field record custom_llm_provider, model_id, response_id.

  Decode these JSON records through decode_responses_shapes(bytes, limits), with a local
  WireDecodeLimits record containing max_json_bytes, max_event_bytes and max_items. The core
  boundary supplies its resolved limits without introducing a wire-to-core dependency.
  Fuzz this decoder and replay committed seeds with replays_corpus. Register the pure
  responses_shapes operation in B171's Rust and Python dispatch; Python constructs the pinned
  types and invokes the builders, including merged_into. Keep its case input typed.

  The two files contain 164 nonblank, non-comment lines. Allow 190 implementation lines,
  150 tests, 85 adapters, 100 fixtures, 65 fuzz/replay and 30 wiring: 620 changed lines.
scope:
  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/responses_shapes.rs
  - crates/betterlite-openai/src/api/responses_shapes/**
  - crates/betterlite-openai/fuzz/Cargo.toml
  - crates/betterlite-openai/fuzz/fuzz_targets/responses_shapes.rs
  - crates/betterlite-openai/fuzz/corpus/responses_shapes/**
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/openai/responses_shapes.rs
  - tools/oracle/src/helpers/openai/responses_shapes/**
  - tools/oracle/helpers/responses_shapes.py
  - tools/oracle/helpers/responses_shapes/**
  - tools/oracle/fuzz/corpus/helper_case/responses_shapes-*
  - tools/oracle/cases/helpers/responses-shapes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/responses/main.py#L1-L173
  why: Own output records, nullable field requirements and the complete web-search and interpreter-log builders.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/responses/streaming_websocket.py#L1-L54
  why: Own structural socket interfaces and the fill_missing, request, overrides merge order.
dod:
- text: >-
    web_search_sources builds tool_id=t, query=cats and content containing a web_search_result
    with url=https://a.test, a non-result object and a numeric url. Expect id=ws_t,
    type=web_search_call,status=completed,action={type:search,query:cats,queries:[cats],
    sources:[{type:url,url:https://a.test}]}. Missing/non-string query becomes query="",queries=[].
    A string content yields no sources; content={type:web_search_tool_result_error} yields
    status=failed, while explicit status=searching wins. Neither branch fetches URLs.
  proof: [shape-tests, oracle, helper-python]
- text: >-
    interpreter_logs sends stdout="out",stderr="err" and expects [{type:logs,logs:"outSTDERR: err"}].
    stdout alone yields "out", stderr alone "STDERR: err", and empty/non-dict content yields null.
  proof: [shape-tests, oracle, helper-python]
- text: >-
    nullable_records round-trips a deletion with id=null,object=null,deleted=null but rejects
    omission of deleted. It accepts all output status/phase literals in the description, rejects
    phase=analysis and function status=failed, and verifies missing custom-call id/status become
    null while missing input is a validation error. Hidden fields never serialize.
  proof: [shape-tests, oracle, helper-python]
- text: >-
    websocket_defaults merges fill_missing={model:a,temperature:1},request={model:b,input:hi},
    overrides={model:c}; expect {model:c,temperature:1,input:hi} without changing any input map.
  proof: [shape-tests, oracle, helper-python]
- text: Arbitrary bytes and newly added malformed/valid record seeds exercise the same bounded decoder used by callers.
  proof: [shape-corpus]
checks:
  optional: [mutants]
  commands:
  - id: shape-tests
    why: output defaults, source filtering or websocket precedence are missing
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_shapes::/) - test(/::replays_corpus$/)'
  - id: shape-corpus
    why: the wire parser is absent from fuzzing or no new corpus exercises it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/responses_shapes)" && grep -qF decode_responses_shapes crates/betterlite-openai/fuzz/fuzz_targets/responses_shapes.rs && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::responses_shapes::tests::replays_corpus$/)'
  - id: helper-python
    why: the pinned builders are not independently called by a checked adapter
    run: test -f tools/oracle/helpers/responses_shapes.py && grep -qE '^[[:space:]]+responses_shapes:' tools/oracle/fuzz/corpus/helper_case/responses_shapes-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-shapes/web-search-sources.yaml
- tools/oracle/cases/helpers/responses-shapes/interpreter-logs.yaml
- tools/oracle/cases/helpers/responses-shapes/nullable-records.yaml
- tools/oracle/cases/helpers/responses-shapes/websocket-defaults.yaml
deviations: []
out_of_scope:
- B1138 owns ResponsesAPIResponse and ResponseAPIUsage in types/llms/openai.py; B1113 owns its event records and event union.
- B1114 owns every BaseResponsesAPIConfig method in llms/base_llm/responses/transformation.py; this task does not cover that file.
- B939-B941 own socket execution; these protocol declarations neither open sockets nor run guardrails.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_shapes in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/responses_shapes.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_shapes.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'The log builder inserts no newline between stdout and the literal "STDERR: ".'
- A nullable Pydantic field without a default remains required, unlike custom-call id and status.
- The web-search failure marker is a mapping in content; a list containing that marker does not select failed.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
