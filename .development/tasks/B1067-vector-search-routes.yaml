id: B1067
title: Vector search, create and index routes
description: >-
  Register POST /v1/vector_stores/{vector_store_id:path}/search and /vector_stores/{vector_store_id:path}/search,
  POST /v1/vector_stores and /vector_stores, and POST/GET /v1/indexes. Own the whole handlers and
  reject_caller_embedding_selection_params, build_request_data_from_managed_vector_store and
  _update_request_data_with_litellm_managed_vector_store_registry. B1068 calls the last helper. Use B1100
  body decoding, B1060 access checks, B1062 registries, B726 index repository, B1131 index records and
  B004 request processing with route_type avector_store_search/avector_store_create, model=null. B003
  authenticates all aliases. Forward injected proxy config/general settings and user_model, user_temperature,
  user_request_timeout, user_max_tokens, user_api_base unchanged to B004; this task adds no settings.

  Build server::api::vector_search_routes and HTTP fixtures through the booted proxy, not helper calls
  that fabricate globals. Reuse parsed B1131 records and the B1100 JSON decoder; add corpus inputs there.
  Index persistence writes created_by/updated_by from the caller user_id, with no transaction added.
  MIT startup has no managed_vector_stores enterprise hook. Preserve its unavailable multi-model branch.
  The owned ranges contain 291 nonblank/non-comment lines; 270 implementation, 190 route tests,
  170 HTTP fixtures and 85 decoder/wiring lines fit 715 of the 790 budget.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/vector_search_routes.rs
  - crates/betterlite-server/src/api/vector_search_routes/**
  - crates/betterlite-server/fuzz/corpus/request_body/vector-search-*
  - tools/oracle/cases/api/vector-search-routes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/endpoints.py#L30-L283
  why: Selection blocking precedes registry overlay, while create removes target_model_names and branches before common processing.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/endpoints.py#L548-L642
  why: Index decorators, admin checks, duplicate detection and persisted caller ownership are complete here.
dod:
- text: >-
    search_aliases_and_path_id sends {query:hello,vector_store_id:body_id} to both search aliases with
    path id=vs_a and expects upstream vs_a,query=hello and 200 mock search record. A path id containing
    a slash is captured whole and encoded by the provider. Missing/invalid bearer credentials fail before
    lookup or HTTP with B003's 401,authentication_error,param=null,code="401"; valid key reaches provider
    using its configured key, never the caller proxy key. Compare content-type application/json and B004
    response headers. Provider 429 is 429,rate_limit_error,param=null,code="429" with Retry-After retained.
  proof: [route-tests, oracle, new-cases]
- text: >-
    caller_embedding_selection_is_rejected sends each of embedding_model,litellm_embedding_model,
    litellm_embedding_config,litellm_credential_name even with null value; expect HTTP 400
    {detail:{error:"'<key>' cannot be set in the search request body. Embedding configuration comes from the vector store's server-side registration."}},
    with no error type/param/code and no lookup/provider send. With all four keys the first is embedding_model
    (sorted); an unrelated key is accepted. This occurs before overwriting body vector_store_id.
  proof: [route-tests, oracle]
- text: >-
    registered_search_overlay loads store vs_a with top-level provider=openai,credential=outer and
    litellm_params={api_key:sk-server,litellm_credential_name:inner}. Its nested credential wins and registry
    values override caller fields after access succeeds. Unknown store leaves request unchanged. A denied
    store returns B1060's 403 detail envelope before B004. Native helper case with auth=null skips access;
    absent/null litellm_params uses only present top-level provider/credential keys, preserving explicit nulls.
  proof: [route-tests, oracle]
- text: >-
    create_target_models_without_enterprise sends {name:notes} on both create aliases and expects 200
    and one OpenAI create request. target_model_names null,"",[] or 0 is removed and follows ordinary
    creation. Nonempty number 1 gives 400 detail="target_model_names must be a comma-separated string or list of model names".
    " gpt-4, ,gemini-2.0 " parses to [gpt-4,"",gemini-2.0]; a list is unchanged. Both nonempty forms on MIT
    return 500 detail="Managed vector stores not configured. Please ensure the proxy is initialized with database support."
    and no provider call; this precedes the absent-router check. These detail errors have no type/param/code.
  proof: [route-tests, oracle]
- text: >-
    index_admin_create_and_list tests both /v1/indexes methods: non-admin gets 403 before DB access,
    detail="Only proxy admins can create vector store indexes. Contact your LiteLLM administrator."
    (list substitutes "list"), without type/param/code;
    admin without DB gets 500 detail="DB not connected. This endpoint needs a database; set DATABASE_URL to a PostgreSQL connection string (postgresql://...) to enable it. See https://docs.litellm.ai/docs/proxy/virtual_keys".
    Admin create {index_name:docs,litellm_params:{vector_store_index:real,vector_store_name:azure-ai-search}}
    writes caller user_id to both audit fields and returns the created model at 200. Existing docs gives
    400 detail="Index docs already exists", no write. GET returns {data:[...]} from B1062 including empty [].
    Missing required index_name is 422 detail validation, without OpenAI error fields. No provider HTTP occurs.
  proof: [route-tests, oracle, request-corpus]
checks:
  optional: []
  commands:
  - id: route-tests
    why: an alias, selection check or index persistence rule is missing
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_search_routes::tests::/) - test(/::replays_corpus$/)'
  - id: new-cases
    why: routes are not compared through real authenticated HTTP
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/vector-search-routes)"
  - id: request-corpus
    why: the index and search request forms lack decoder regression input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/request_body/vector-search-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/api/vector-search-routes/search-aliases-and-path-id.yaml
- tools/oracle/cases/api/vector-search-routes/caller-embedding-selection-is-rejected.yaml
- tools/oracle/cases/api/vector-search-routes/registered-search-overlay.yaml
- tools/oracle/cases/api/vector-search-routes/create-target-models-without-enterprise.yaml
- tools/oracle/cases/api/vector-search-routes/index-admin-create-and-list.yaml
deviations:
- what: >-
    Pending the managed-resource decision, nonempty target_model_names returns the MIT 500 detail error
    above. betterlite does not install the enterprise managed_vector_stores hook or create stores across models.
  why: Preserve the checked-out open-source behavior until Max chooses the managed-files/batches/resource policy.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/endpoints.py#L221-L244
out_of_scope:
- B1068 owns retrieve/list/update/delete in this file; B1064 owns SDK create/search and its provider calls.
- Enterprise hook invocation and the downstream "LLM Router not initialized. Ensure models are added to proxy." branch cannot run without that hook and are not built.
- B004 owns processing/error conversion, B1060 detailed access messages and B1062 index DB projection; their APIs are called rather than copied.
pitfalls:
- Four embedding-selection keys are forbidden by presence, even when their values are null.
- target_model_names is removed before either creation path, so an empty list is not sent upstream.
- Search accepts slash-containing ids, but the retrieve/update/delete decorators in B1068 do not use the path converter.
review_level: security
budget:
  max_changed_lines: 790
  max_new_expects: 0
