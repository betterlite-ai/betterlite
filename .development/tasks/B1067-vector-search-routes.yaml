id: B1067
title: Vector search routes
description: >-
  Install vector-store create/search and index create/list routes using managed registry resolution and explicit
  embedding-parameter rejection. Require admin authority for index lifecycle, retain source alias/query/body precedence
  and return only the source public result fields.


  Implement crates/betterlite-server/src/api/vector_search_routes.rs, crates/betterlite-core/src/api/vector_search_routes.rs.
  Use VectorSearchRoutesInput and VectorSearchRoutesResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/vector_stores/{vector_store_id:path}/search; POST /vector_stores/{vector_store_id:path}/search;
  POST /v1/vector_stores; POST /vector_stores; POST /v1/indexes; GET /v1/indexes. Each alias is exercised through
  the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without re-registering
  their methods/paths.


  Route input projections: data.target_model_names (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:43 status_code=400, exception_detail=FastAPI detail object; endpoints.py:235
  status_code=500, exception_detail=FastAPI detail string; endpoints.py:241 status_code=500, exception_detail=FastAPI
  detail string; endpoints.py:227 status_code=400, exception_detail=FastAPI detail string; endpoints.py:582 status_code=500,
  exception_detail=FastAPI detail string; endpoints.py:594 status_code=400, exception_detail=FastAPI detail string;
  endpoints.py:636 status_code=500, exception_detail=FastAPI detail string. Compare the actual source status, error
  type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions vector_search_route, caller_embedding_model_re_36be, managed_store_search,
  vector_create_route, index_admin_only, route_aliases, auth_missing, auth_invalid under api::vector_search_routes::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/vector_store_endpoints/endpoints.py: reject_caller_embedding_selection_params
  (L40-L49); litellm/proxy/vector_store_endpoints/endpoints.py: build_request_data_from_managed_vector_store (L57-L68);
  litellm/proxy/vector_store_endpoints/endpoints.py: _update_request_data_with_litellm_managed_vector_store_registry
  (L71-L97); litellm/proxy/vector_store_endpoints/endpoints.py: vector_store_search (L108-L176); litellm/proxy/vector_store_endpoints/endpoints.py:
  vector_store_create (L181-L283); litellm/proxy/vector_store_endpoints/endpoints.py: index_create (L552-L609);
  litellm/proxy/vector_store_endpoints/endpoints.py: index_list (L617-L642). Abstract/protocol declarations map
  to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 235 owned nonblank/non-comment/non-docstring Python lines (283 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 255 implementation,
  88 behavior tests, 96 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 477 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1061 (Vector endpoint access), B1062
  (Vector store registry), B1064 (Vector store search), B1087 (Api boundaries), B1100 (Shared request body decoding),
  B732 (Typed authentication principals and grant resolution), B855 (Authenticated request admission and budget
  handoff), B756 (Authentication header selection and mode dispatch), B1060 (Vector store access), B003 (HTTP server,
  health routes and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces
  and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
