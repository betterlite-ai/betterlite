id: B3341
title: Video character calls
description: >-
  Build character create/get orchestration in betterlite-core::api, defaulting to OpenAI and
  accepting a 600-second timeout. Implement four functions: avideo_create_character (async),
  video_create_character (sync), avideo_get_character (async), and video_get_character (sync).

  For create operations, accept name (required string) and video (required uploaded file).
  For get operations, accept character_id (required string). Both sets accept optional
  timeout (default 600s, fallback to B198's REQUEST_TIMEOUT when falsey), custom_llm_provider
  (default "openai"), extra_headers, extra_query and extra_body. Accept mock_response
  for testing: parse JSON strings and construct CharacterObject directly, skipping the provider.

  Update logging with update_environment_variables per operation: request_params dict contains
  only the primary arguments (name for create, character_id for get), litellm_call_id from kwargs,
  and the provider. Set call_type to video_create_character or video_get_character. Both default
  to OpenAI without decoding a character provider in this layer. Forward timeout and is_async
  state to B3335's handlers via video_create_character_handler and video_get_character_handler.

  Capture local_vars at function entry and use it in all exception paths. Wrap provider lookups:
  when get_provider_video_config returns None, raise ValueError. Async functions run their sync
  counterpart through loop.run_in_executor with context propagation (contextvars.copy_context
  and ctx.run); handle both direct returns and coroutines. All exceptions map through
  litellm.exception_type with model="", the custom_llm_provider, the original exception and
  both completion and extra kwargs.

  Build production code in betterlite-core; separate tests in tests.rs modules by domain
  (character_creation_behaviors, character_get_behaviors). Consume B3330's CharacterObject
  validation, B3332's get_provider_video_config selector, and B3335's multipart/GET handlers.
  Reuse B198's DEFAULT_REQUEST_TIMEOUT constant, B247's update_environment_variables logging,
  and B185/B186's exception_type dispatch.

