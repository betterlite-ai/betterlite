out_of_scope:
  - B3330 owns CharacterObject validation and optional request field declarations.
  - B3332 owns video provider selection and ProviderConfigManager.get_provider_video_config.
  - B3335 owns video_create_character_handler, video_get_character_handler and the multipart/GET
    character transport implementation.
  - B198 owns CoreSettings, DEFAULT_REQUEST_TIMEOUT and context propagation equivalents.
  - B247 owns Logging.update_environment_variables and Logging.update_from_kwargs.
  - B185 and B186 own exception_type dispatch and error mapping.
  - Character provider decoding and proxy ID-based routing are owned separately (B3345).

pitfalls:
  - >-
    The oracle helper for this task is pre-registered as b3341 in the core group.
    Replace the stub Op in tools/oracle/src/helpers/core_ops/b3341.rs with an impl
    Helper whose Input is the typed input, and write run in tools/oracle/helpers/b3341.py.
    The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task's to edit.
  - Mock responses parse JSON strings on demand; construct CharacterObject before returning
    to skip all provider calls when mock_response is present.
  - Falsey timeout (zero or None) falls back to DEFAULT_REQUEST_TIMEOUT; the condition is
    (timeout or DEFAULT_REQUEST_TIMEOUT), not an explicit None check.
  - Both create and get default custom_llm_provider to "openai" and never decode it from
    character_id; proxy-side ID decoding routes requests independently.

