dod:
  - text: >-
      Pure cases avideo_create_character_defaults_and_openai, video_create_character_mock_string_and_object,
      video_create_character_openai_fallback, avideo_create_character_context_propagation,
      avideo_get_character_defaults_and_openai, video_get_character_mock_string_and_object,
      video_get_character_openai_fallback and avideo_get_character_context_propagation compare
      exact signature, defaults, mock decoding and provider selection. Native cases
      create_character_request_params, create_character_logging_updates, get_character_request_params
      and get_character_logging_updates exercise all request preparation and logging paths.
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: >-
      Provider ValueError and handler invocation without decoding a character provider;
      exception_type mapping with empty model, custom_llm_provider and all kwargs.
    proof: [behavior-tests]
  - text: >-
      Falsey timeout uses DEFAULT_REQUEST_TIMEOUT, truthy timeout passes through; async
      coroutines are awaited, direct responses are returned.
    proof: [behavior-tests]

checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_character_calls::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b3341.py && uv run --locked --project
        tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
        tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/video-character-calls-*")"
        && grep -rlq "video_character_calls" tools/oracle/fuzz/corpus/helper_case/video-character-calls-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

