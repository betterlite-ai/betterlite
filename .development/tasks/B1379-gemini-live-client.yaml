id: B1379
title: Translate Live client audio, turn boundaries and tool replies
description: >-
  Add gemini_live_client with per-connection LiveSessionState containing the ordered
  256-entry call-id/name map, pending provider usage and unbilled input-audio byte count.
  Own realtime/transformation.py L138-L162, L244-L275 and L524-L640, 138 nonblank
  noncomment lines, plus common_utils.py L432-L467's 33-line SDK-value encoder and
  gemini.py L44-L99's server/input records. decode_gemini_live_client_event parses bounded
  incoming JSON bytes, retaining missing versus null fields and reporting Invalid JSON
  message on syntax failure. Delegate session.update to B1378. response.create,
  input_audio_buffer.clear and unknown event types return no provider messages; clear
  deliberately does not reset the audio accounting counter. Audio append requires audio,
  forwards it under realtimeInput.audio, and for strings adds max(character_count*3/4
  minus terminal base64 padding,0) to unbilled bytes without validating base64. Default
  MIME is audio/pcm;rate=24000, with pcmu/pcma aliases for explicit g711 formats and
  application/octet-stream fallback. Commit/end sends activityEnd only when decoded setup
  has automaticActivityDetection.disabled literally true; malformed setup falls back to
  audioStreamEnd. Neither operation emits a synthetic response.create.
  conversation.item.create dispatches function_call_output or user text. Join truthy
  input_text parts with spaces and emit one user clientContent turnComplete=true; no text
  returns no messages. Parse string tool output as JSON where possible, retain malformed
  text, and wrap every non-object as result. Look up call_id without removing it, refresh
  its LRU position on a truthy name and warn on a miss; include id only for Studio when
  truthy, omit it for the B1365 Vertex override, and include name only when known.
  Keep the source SDK encoder's behavior: dictionary bytes use URL-safe base64, datetimes
  use ISO text, recursion stops only beyond B1307's DEFAULT_MAX_RECURSE_DEPTH. The list's
  two independent if statements overwrite the attempted all-bytes conversion; bytes in
  lists remain unsupported for final JSON serialization, while all-datetime lists work.
  Helper gemini_live_client cases invalid_json, audio_padding_estimate, clear_keeps_usage,
  manual_commit, malformed_setup_commit, joined_user_text, scalar_tool_result,
  retried_tool_name, unknown_tool_warning and sdk_list_encoding cover transitions on
  supplied state without IO. Budget 250 implementation/types, 190 tests, 100 adapters and
  95 fuzz/seed lines within 700.
