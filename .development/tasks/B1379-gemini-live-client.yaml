    why: Audio-size estimate, connection-local state and setup/content predicates.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/realtime/transformation.py#L244-L275
    why: Audio MIME defaults and manual-versus-automatic turn termination.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/realtime/transformation.py#L524-L640
    why: Client event dispatch, tool response correlation and ignored events.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/common_utils.py#L432-L467
    why: SDK bytes/datetime conversion and the all-bytes-list overwrite behavior.
