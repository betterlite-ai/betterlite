dod:
  - text: Client events preserve turn boundaries, audio estimates and retryable tool-name correlation.
    proof: [live-client-tests, live-client-python, oracle]
  - text: SDK value projection retains the source's depth cutoff and list serialization behavior.
    proof: [live-client-tests, live-client-python, oracle]
  - text: Client-event bytes and helper envelopes have fresh replay cases at their actual parser boundaries.
    proof: [live-client-corpus, live-client-seeds]
checks:
  optional: []
  commands:
    - id: live-client-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_live_client::/) - test(replays_the_gemini_live_client_corpus)'
      why: Stateful fixtures assert returned messages and the resulting connection-local counters/LRU order.
    - id: live-client-python
      run: test -f tools/oracle/helpers/gemini_live_client.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Source client transforms run on fixture session state and tagged SDK scalar values.
    - id: live-client-corpus
      run: test -f crates/betterlite-vertex/fuzz/fuzz_targets/gemini_live_client.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-vertex/fuzz/corpus/gemini_live_client)" && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(replays_the_gemini_live_client_corpus)'
      why: decode_gemini_live_client_event receives malformed event JSON, missing audio and nested tool output.
    - id: live-client-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/gemini_live_client*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::vertex::gemini_live_client::/)'
      why: Every added envelope must parse as call.gemini_live_client.
