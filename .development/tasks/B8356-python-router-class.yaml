dod:
  - text: "`Router.__init__` has LiteLLM's signature, and `get_valid_args()` returns LiteLLM's names."
    proof: [router-class-signature]
  - text: A router built from a model list answers a completion through the native router, with mutable defaults not shared between instances.
    proof: [router-class-build]
  - text: An argument the native router does not support is sent only when it differs from the default, and then raises `ValueError` naming it.
    proof: [router-class-settings]
  - text: "`enable_weighted_failover=True` reaches the settings text as `enable_weighted_failover`, the `router_settings` key B8440's `config.sections.weighted_failover` reads, and the default False is left out."
    proof: [router-class-settings]
  - text: "`print_deployment` masks the key on a copy, and `reset` clears the retry policy."
    proof: [router-class-methods]
  - text: "`betterlite.router` and `betterlite.types.router` export `CustomRoutingStrategyBase`, and `betterlite.router` exports `Router`."
    proof: [router-class-exports]
  - text: The files pass strict basedpyright and ruff.
    proof: [python-lint]
checks:
  optional: []
  commands:
  - id: router-class-signature
    why: A parameter name, kind or default differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_class.py -k signature
  - id: router-class-build
    why: The router cannot be built or called, or two routers share a default list.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_class.py -k build
  - id: router-class-settings
    why: A default value is refused, or a changed unsupported value is ignored.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_class.py -k settings
  - id: router-class-methods
    why: The key is shown, the input is changed, or reset keeps the policy.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_class.py -k methods
  - id: router-class-exports
    why: An import LiteLLM users write fails.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_class.py -k exports
  - id: python-lint
    why: Type drift against the mixins and stubs.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
  - what: A constructor argument the native router does not read yet (for example `redis_host`, `plugins` or `fallback_access_check`) raises `ValueError` naming it when set to a non-default value.
    why: LiteLLM would use it; silently ignoring it would change routing without a sign.
  - what: "`print_deployment` masks only `api_key`, also when `redact_user_api_key_info` is set."
    why: LiteLLM's masker for that flag is part of its logging code, which the wheel does not carry.
  - what: "`discard` and `flush_cache` do nothing, and `reset` only clears `retry_policy`."
    why: The wheel has no global callback lists, and the router caches live in Rust with no flush method yet.
out_of_scope:
  - "B5078 owns the chat methods, B8355 the other call methods, B6022 the native router and its settings keys, B165 CustomRoutingStrategyBase."
  - "B8584 ports the pydantic models of litellm/types/router.py into `betterlite._router_types`; this task only re-exports them."
  - "Router._remove_optional_callbacks_of_type and the callback registration in __init__ manage LiteLLM's global callback lists, which the wheel does not have."
pitfalls:
  - "`model_group_alias` defaults to `{}` but `default_fallbacks` to None; compare each argument with its own default, not with a falsy check."
  - "`router_general_settings` defaults to an instance, `RouterGeneralSettings()`, so compare by value, not identity."
  - "`get_valid_args` reads the betterlite constructor, so it stays equal to LiteLLM's only while the signature does; the signature test guards both."
  - "`apply_default_settings` runs last in `__init__`, after the native router exists."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
