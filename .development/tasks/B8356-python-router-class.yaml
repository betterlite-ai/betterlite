id: B8356
title: Python Router class and constructor
description: >-
  `from litellm import Router` is how most SDK users meet the router. B5078 and B8355 wrote the call methods as mixins and B6022 the native router, but nothing builds the `Router` class itself, its constructor, or the modules `betterlite.router` and `betterlite.types.router` that B165 waits on. Build them here.


  Files. `python/betterlite/_router/__init__.py` defines `class Router(RouterCalls, RouterEndpoints)` (B5078, B8355) with `__all__ = ["Router"]`. `python/betterlite/_router/settings.py` turns the constructor arguments into the settings JSON text that B6022's `NativeRouter` reads. `python/betterlite/router.py` re-exports `Router` and, from `betterlite._custom_routing`, `CustomRoutingStrategyBase` (B165). `python/betterlite/types/router.py` re-exports every name of B8584's `betterlite._router_types` with one star import and `CustomRoutingStrategyBase` from the same B165 module, and `_router/settings.py` takes `RetryPolicy`, `AllowedFailsPolicy`, `AlertingConfig`, `RouterGeneralSettings` and `RoutingStrategy` from `betterlite._router_types`. Each has an explicit `__all__`. The top-level export follows B5369's rule for Python modules: `betterlite/__init__.py` holds a `from betterlite._router import *` star line and `_router/__init__.py` starts as an empty stub, both written by B5369 (or by the architect when B5369 has merged first), and this task fills the stub, so `__all__ = ["Router"]` makes `from betterlite import Router` work. Never edit `betterlite/__init__.py`, `src/lib.rs` or `_native.pyi`.


  `Router.__init__` (router.py L772-L1237) takes every parameter LiteLLM's takes, with the same names, kinds, order and defaults, from `model_list` to `auto_router_capability_limit`; the test compares `inspect.signature` with LiteLLM's. Mutable defaults (`cache_kwargs={}`, `fallbacks=[]`, `model_group_alias={}` and the like) are copied, never shared. It keeps `model_list`, `num_retries`, `retry_policy`, `fallbacks`, `context_window_fallbacks`, `content_policy_fallbacks`, `default_litellm_params`, `cache_responses`, `routing_strategy` and `model_names` (the set of `model_name` values) as attributes, builds the settings text, creates the `NativeRouter` and the `NativeRouterEndpoints`, then calls `apply_default_settings()` as the last step. The settings text carries a key only when the caller's value differs from LiteLLM's default, so an unsupported argument left at its default never reaches the native check, and one set to another value is refused by B6022 with `ValueError` naming the key. `routing_strategy` accepts the `RoutingStrategy` enum or a string and sends the string value, as `Router._normalize_strategy` (L1325-L1332) does. A `RetryPolicy`, `AllowedFailsPolicy` or `AlertingConfig` model is sent as its `model_dump(exclude_none=True)`. `default_litellm_params` defaults to an empty dict when None.


  Small methods. `get_valid_args()` (L1240-L1248) is a static method that returns the parameter names of `Router.__init__` without `self`, read with `inspect.getfullargspec`. `apply_default_settings()` (L1250-L1256) adds the default optional pre-call checks, an empty list, so it changes nothing and returns None. `discard()` (L1258-L1279), `flush_cache()` (L14745-L14750) and `reset()` (L14752-L14759) exist with LiteLLM's names: `reset` sets `retry_policy` to None and calls `flush_cache`, and `discard` and `flush_cache` return None, because the wheel keeps no global callback lists and the router caches live in Rust. `print_deployment(deployment)` (L2440-L2459) returns a deep copy where `litellm_params.api_key`, when present, keeps its first two characters followed by ten `*`.


  Tests go in `tests/test_router_class.py`: the signature matches LiteLLM's, `get_valid_args()` equals LiteLLM's list, a router built with a model list and fallbacks answers `acompletion` against a local mock server, an unsupported argument set to a non-default value raises `ValueError` naming it, `print_deployment` masks the key and does not change the input, and `from betterlite.router import CustomRoutingStrategyBase` and `from betterlite.types.router import CustomRoutingStrategyBase` give B165's class.
