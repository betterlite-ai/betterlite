id: B185
title: OpenAI-family error mapping
description: >-
  Finish OpenAI error classification with _map_openai_exception (275-524) and exception_type preamble/openai/litellm_proxy
  branches (2358-2485) in crates/betterlite-error/src/dispatch.rs. Use B236 shared extraction/parser/status, B237
  Azure/OpenRouter and B245 OpenAI-like classifiers. Preserve timeout-string precedence before provider dispatch
  and already-mapped/guardrail identity. B186 extends the same dispatch.rs with native families. Integrate B004/B005
  error handling before the first stream chunk, retaining typed causes and B187 redaction. Extend provider_error
  seeds for these branches. Budget 290 OpenAI/preamble, 100 adapters, 290 tests/fuzz and 100 integration (780 total).
  Write the behavior rstest functions openai_errors_openai_error_tests_behavior in adjacent tests.rs files, with a named
  case for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation provider_error is already registered; each operation has its
  own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - crates/betterlite-error/src/openai.rs
  - crates/betterlite-error/src/openai/**
  - crates/betterlite-error/src/parse.rs
  - crates/betterlite-error/src/parse/**
  - crates/betterlite-error/src/status.rs
  - crates/betterlite-error/src/status/**
  - crates/betterlite-error/fuzz/**
  - crates/betterlite-openai/**
  - crates/betterlite-server/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/error/provider_error.rs
  - tools/oracle/src/helpers/error/provider_error/**
  - tools/oracle/helpers/provider_error.py
  - tools/oracle/helpers/provider_error/**
  - tools/oracle/cases/helpers/openai-errors/**
  - tools/oracle/cases/errors/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-error/src/dispatch.rs
  - crates/betterlite-error/src/dispatch/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L39-L272
  why: Shared classifiers, safe response extraction and proxy exception reconstruction.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L275-L524
  why: OpenAI-specific precedence.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L732-L851
  why: OpenAI-like errors.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1926-L2349
  why: Azure, OpenRouter and generic status mapping.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2358-L2485
  why: Preamble and OpenAI/proxy dispatch owned here.
dod:
- text: >-
    The listed provider error cases preserve classifier/status precedence and compare complete error metadata with
    Python.
  proof:
  - oracle
  - helper-python
- text: >-
    HTML, malformed JSON and invalid UTF-8 never panic or leak raw bodies, while typed causes remain inspectable
    internally.
  proof:
  - openai-error-tests
  - provider-error-corpus
- text: Vendor cookies, CORS headers, authorization and query secrets are removed from all exposed diagnostics.
  proof:
  - openai-error-tests
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: openai-error-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-error -p betterlite-openai -p betterlite-server --no-tests=fail -E
      'test(/::openai_errors_openai_error_tests_behavior($|::)/) - test(/replays_the_/)'
  - id: provider-error-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-error/fuzz/corpus/provider_error)"
      && test -f crates/betterlite-error/fuzz/fuzz_targets/provider_error.rs && test -n "$(ls -A crates/betterlite-error/fuzz/corpus/provider_error)"
      && cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(replays_the_provider_error_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'provider_error' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/openai-errors/context-before-status.yaml
- tools/oracle/cases/helpers/openai-errors/rate-limit-before-context.yaml
- tools/oracle/cases/helpers/openai-errors/model-not-found.yaml
- tools/oracle/cases/helpers/openai-errors/content-policy.yaml
- tools/oracle/cases/helpers/openai-errors/invalid-encrypted-content.yaml
- tools/oracle/cases/helpers/openai-errors/proxy-roundtrip.yaml
- tools/oracle/cases/chat/upstream-400.yaml
- tools/oracle/cases/chat/upstream-401.yaml
- tools/oracle/cases/chat/upstream-429.yaml
- tools/oracle/cases/chat/upstream-500.yaml
- tools/oracle/cases/errors/upstream-html.yaml
- tools/oracle/cases/errors/upstream-null.yaml
- tools/oracle/cases/errors/upstream-504.yaml
- tools/oracle/cases/helpers/openai-errors/timeout-before-status.yaml
- tools/oracle/cases/helpers/openai-errors/already-mapped.yaml
- tools/oracle/cases/helpers/openai-errors/guardrail-identity.yaml
- tools/oracle/cases/errors/stream-upstream-500.yaml
deviations: []
out_of_scope:
- Native non-OpenAI classifiers are B186.
- No retry or fallback is initiated by classification.
- >-
  Shared checkers/parser/status B236; Azure/OpenRouter B237; OpenAI-like B245; native classifiers and remainder
  of exception_type B186; exception_logging and _add_key_name_and_team_to_alert B012.
pitfalls:
- 'The oracle helper for this task is pre-registered as provider_error in the error group. Replace the stub Op in tools/oracle/src/helpers/error/provider_error.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/provider_error.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Python checks error strings before some status branches, so a status-only table is insufficient.
- Ignore only client message wording, not type/code/param or header semantics.
- A synthetic response status must not override more meaningful transport information.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
