deviations:
  - what: A missing OPENAI_API_KEY on the HTTP route gives HTTP 500 with the message in the proxy's error envelope, where LiteLLM's bare Exception gives whatever its unhandled-error path renders.
    why: betterlite has one error mapper. The status and the message match; the oracle case ignores the body shape, as the auth missing-key case does. Open question in the notes.
  - what: The OpenAI and Deepgram WebSocket routes read the socket through the RouteSocket trait and the relay through WebSocketRelayPort, and take the already authenticated key as an argument.
    why: Python gets these from FastAPI dependencies. Rust needs seams for tests and the real adapters come later. What a client sees is the same.
  - what: LiteLLM's _OpenAIWebsocketRefusal, the two error TypedDicts, the model-allowlist Protocol and the relay Protocol become plain Rust records and the two ports.
    why: Same shapes; Rust needs closed types. The error frame JSON is built from a typed record and has the same bytes as json.dumps of the dict would carry for these ASCII keys, apart from spacing, which the native test compares as parsed JSON.
out_of_scope:
  - "create_request_copy, uses_router_model, is_streaming_body, request_is_streaming, deployment_model_name, models_served_by_group, RelayRejection, router_request_metadata, provider_factory_route, relay_upstream_response, relay_upstream_bytes and relay_router_model: B3618 owns them and this task calls them."
  - "create_pass_through_route and the HTTP handler it returns: B3615. join_base_and_endpoint_path and get_response_headers: B3600. get_credentials: B3602. The WebSocket relay itself: B3612."
  - "nvidia_nim_model_group_in_path and the other NVIDIA path hints: B2324. NvidiaNimPassthroughConfig (the provider side that strips the model group and builds the upstream URL): B5837."
  - "Every deepgram_listen_* helper (target, requested model, callback params, pricing key, usage figures): B1542. Deepgram usage billing after the relay: B3653."
  - "user_api_key_auth, user_api_key_auth_websocket and user_api_key_auth_websocket_for_model: B052. enforced_model_allowlists: B885. get_request_body: B1101. get_model_list: B844. _is_assistants_api_request: B882."
  - "The /openai_passthrough HTTP route (openai_passthrough_endpoints.py, L1-L42): B3619 owns it and calls openai_proxy_route."
  - "The Azure routes (azure_proxy_route, _relay_azure_router_model, _relay_azure_body_model_group): B3624 owns them and calls openai_pass_through and join_url_paths from this task."
  - "create_generic_websocket_passthrough_endpoint (L3758-L3797): no caller at the pin, and the function it wraps is not built (see B3612). No cases."
  - "open_sse_before_first_byte: B7324 builds the real function; this task calls it. The production axum adapters for RouteSocket and the tokio-tungstenite connector are B8642's; the mount is B8606's. B8606 registers GET `/openai_passthrough/{endpoint}` and sends an upgrade there to openai_websocket_route, so this module's router serves only `/openai/{endpoint}` in both forms and the Deepgram and NVIDIA paths."
  - "_proxy_general_settings, _proxy_model_allowlists and _websocket_relay: they only bind proxy_server globals for FastAPI dependencies. The config section, the ModelAllowlistPort and the WebSocketRelayPort replace them."
pitfalls:
  - "The same path `/openai/{endpoint:path}` is both an HTTP route and a WebSocket route; pick by the Upgrade header, or a plain GET /openai/v1/models stops working."
  - "The OpenAI handler sends both `authorization: Bearer <key>` and `api-key: <key>`, both lowercase, even to api.openai.com."
  - "Streaming on the OpenAI handler comes only from the word `stream` in the final URL; a `stream: true` body does not set it, and a path like `/v1/stream-test` does."
  - "join_url_paths inserts `/v1` only when `/v1/` is missing from the whole URL, so the bare path `/v1` becomes `https://api.openai.com/v1/v1`. Keep that."
  - "str.replace in the v1 rule changes every `api.openai.com/` in the URL string, not just the host."
  - "The OpenAI-Beta check looks for the exact key `OpenAI-Beta`; an extra header spelled `openai-beta` does not stop the default being added, and both then go out."
  - "The assistants test is a substring test on the route, so any path containing `thread` or `assistant` gets the beta header."
  - "The refusal is checked in order: switch first, allowlists second. With the switch off no allowlist is read, so no database call is made for a refused client."
  - "Allowlist entries are compared as text; `no-default-models` and any real model name count as a restriction, while an empty list does not."
  - "A refusal accepts the socket first, then sends the error frame, then closes with 1008. A missing key does the opposite: close with 1011 and no accept, which a client sees as a failed handshake."
  - "Both WebSocket routes pass `websocket.url.path` (with the /openai or /deepgram prefix) to the relay as the endpoint, not the endpoint path parameter, and pass accept_websocket false because they accepted already."
  - "Deepgram authenticates with `Token <key>` and OpenAI with `Bearer <key>`; neither forwards client headers."
  - "The Deepgram checks run in a fixed order: key (no accept), accept, callback params, price. A callback request is accepted and then closed with 1008."
  - "The NVIDIA 400 detail is an object with an `error` field, so the body is `{detail: {error: ...}}` and not a plain string detail."
  - "The NVIDIA body read raises for a POST with a content type that is neither JSON nor form; a GET gives an empty body and is never streaming."
  - "A WebSocket close reason longer than 123 bytes is invalid on the wire; keep the exact texts above and note that the Deepgram unpriced reason grows with the model name."
