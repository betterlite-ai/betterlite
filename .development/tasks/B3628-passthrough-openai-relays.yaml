id: B3628
title: Pass-through OpenAI Deepgram and Nvidia relays
description: >-
  Build the OpenAI, Deepgram and NVIDIA NIM pass-through routes of llm_passthrough_endpoints.py in betterlite-server, as three modules: passthrough_openai_routes, passthrough_deepgram_ws and passthrough_nvidia_relay.
  This task registers its own routes (the registration task B3616 only handles configured endpoints) and adds one small config section for the OpenAI WebSocket switch.
  The shared helpers come from B3618 (is_streaming_body, relay_router_model, RelayRejection), the HTTP factory from B3615 (create_pass_through_route), the socket relay from B3612 (WebSocketRelay, WebSocketArgs, ClientSocket) and the key lookup from B3602 (get_credentials). Call them; do not copy them.
  Every name below is at most 30 characters; LiteLLM's longer names are renamed on purpose.

  OpenAI target URL. `join_url_paths(base_url, path, provider)` replaces _join_url_paths. Join the base and the path with B3600's join_base_and_endpoint_path, put that path on the base (scheme, host, port and query of the base stay) and render the URL as a string.
  Then, only for the OpenAI provider and only when the string has no `/v1/` anywhere in it, replace every `api.openai.com/` in the string with `api.openai.com/v1/`. Other providers (Azure, Azure AI) get the joined string unchanged. `provider` is the provider type that B174 declares (read its merged name; the variants Openai, Azure and AzureAi are the ones used).
  Examples: base `https://api.openai.com/` with path `/models` gives `https://api.openai.com/v1/models`; with path `/v1/models` it stays as is; base `http://localhost:9000/proxy` with path `/models` gives `http://localhost:9000/proxy/models`.

  OpenAI headers. `append_openai_beta_header(headers, request)` adds `OpenAI-Beta: assistants=v2` when B882's assistants test (the request route contains `thread` or `assistant`) is true and the map has no key spelled exactly `OpenAI-Beta`. `assemble_openai_headers(api_key, request, extra_headers)` starts from an empty map.
  With a key it holds `authorization: Bearer <key>` and `api-key: <key>` (both keys lowercase). Then `extra_headers` are merged over it (an extra header with the same key wins), then append_openai_beta_header runs on the result. With no key and no extras the map is empty (apart from the beta header).

  OpenAI handler. `openai_pass_through(args)` replaces BaseOpenAIPassThroughHandler._base_openai_pass_through_handler and is also called by the Azure route task, so it is `pub` in the crate. `OpenAiPassThroughArgs` holds endpoint, the request, the response, the authenticated key, handler (the shared `Arc<PassThroughHandler>` of B3613 that B3615's create_pass_through_route takes), base_target_url, api_key (Option), the provider and extra_headers (Option).
  Steps: take the path of the endpoint the way httpx.URL(endpoint).path does (query and fragment dropped) and add a leading `/` when missing; parse base_target_url; build the URL with join_url_paths; the call is streaming only when the URL string contains the text `stream` (the body is not looked at);
  build the headers with assemble_openai_headers; call B3615's create_pass_through_route with the handler Arc from args, endpoint, the URL as target, those custom headers, the streaming flag and custom_llm_provider set to the provider's string value (`openai`, `azure`, `azure_ai`); call the handler it returns with the request, response and key, and return the result.

  OpenAI HTTP route. `openai_proxy_route` serves `/openai/{endpoint:path}` for GET, POST, PUT, DELETE and PATCH. The base URL is the process env var OPENAI_API_BASE, or `https://api.openai.com/` when it is unset or empty. The key is B3602's get_credentials("openai", None). A missing key is a plain error that becomes HTTP 500 with the message `Required 'OPENAI_API_KEY' in environment to make pass-through calls to OpenAI.`
  Otherwise call openai_pass_through with provider Openai and no extra headers. B3619's `/openai_passthrough/{endpoint:path}` HTTP route calls this same function, so it takes endpoint, request, response, key and the shared handler Arc and nothing else.

  OpenAI WebSocket route. `openai_websocket_route` serves the WebSocket form of `/openai/{endpoint:path}` and `/openai_passthrough/{endpoint:path}`. The same two paths also serve HTTP, so the route dispatch must pick the handler by the Upgrade header. The caller is already authenticated by B052's WebSocket auth adapter (user_api_key_auth_websocket); the route function takes the authenticated key.
  The route needs a few things B3612's ClientSocket lacks, so this module declares `RouteSocket`, a trait with ClientSocket as a supertrait and three more methods: `accept_with_protocol(subprotocol: Option<&str>)`, `path()` (the request path) and `query()` (the raw query string, empty when none). Production adapters are not built here (see out_of_scope). Socket seam: the router this module returns also takes `SocketServePort` in its deps, one async method `serve(request: axum::extract::Request, auth: SocketAuth, route: SocketRoute) -> Response`, where `SocketAuth` is `Key` (run B052's user_api_key_auth_websocket first and pass the key) or `Route` (the route authenticates itself, as Deepgram does) and `SocketRoute` is a boxed `FnOnce(Arc<dyn RouteSocket>, Option<UserApiKeyAuth>)` returning the route future. The GET handler on `/openai/{endpoint}` calls it for an upgrade request (`connection: upgrade` and `upgrade: websocket`, case-insensitive) and the HTTP route otherwise, and both Deepgram paths always call it with `Route`. B8640 supplies the production port over B8642's bridge; tests use a fake port that runs the route with a fake socket.
  The route also takes two ports declared here so tests use fakes: `WebSocketRelayPort` (one async method relay(args: &WebSocketArgs, client: &dyn ClientSocket, auth) that B3612's WebSocketRelay implements) and `ModelAllowlistPort` (one async method returning the list of allowlists, backed by B885's enforced_model_allowlists).
  Steps in order:
  1. `negotiated_subprotocol(socket)`: split the `sec-websocket-protocol` header on commas, trim each piece, drop empty pieces and take the first one, or None. Call it once at the start.
  2. Refusal. `openai_ws_refusal(settings, key, allowlists)` returns None or a refusal. If `enable_openai_websocket_passthrough` is not on, the refusal is the disabled one. Only then look up the allowlists; if any model string in any of them is not one of `all-proxy-models`, `all-team-models` or `*`, the refusal is the model-restricted one.
  A refusal is handled by: accept with the negotiated subprotocol, send one text frame of JSON `{"type":"error","error":{"type":"invalid_request_error","message":<message>}}`, close with code 1008 and the refusal's close reason, and return. Disabled: close reason `OpenAI websocket passthrough is disabled`, message `OpenAI websocket passthrough is disabled on this gateway. A proxy admin can turn it on by setting general_settings.enable_openai_websocket_passthrough to true.`
  Model-restricted: close reason `Keys with model restrictions cannot use OpenAI websocket passthrough`, message `Keys with model restrictions cannot use OpenAI websocket passthrough, because this route relays frames to the provider without reading which model they ask for.`
  3. Base URL and key as in the HTTP route. With no key, close the socket with code 1011 and reason `Required 'OPENAI_API_KEY' in environment to make pass-through calls to OpenAI.` without accepting it, and return.
  4. Target. Take the endpoint path as httpx does, add a leading `/`, build the URL with join_url_paths (provider Openai), turn a leading `https://` into `wss://` and a leading `http://` into `ws://` (any other prefix stays), and when the request has a query string append it with `&` if the target already holds a `?`, else with `?`.
  5. Accept with the negotiated subprotocol, then call the relay with: target, custom headers `{Authorization: Bearer <key>}`, forward_headers false, endpoint = the full request path (socket.path(), with the `/openai` prefix), cost_per_request None, accept_websocket false.

  OpenAI WebSocket switch. `general_settings.enable_openai_websocket_passthrough` is read by a new config section `passthrough_websocket` (crates/betterlite-config/src/sections/passthrough_websocket.rs). Default off. A YAML boolean true is on. A string is on only when B8500's str_to_bool gives true (trimmed, case-insensitive `true`); `false`, any other text, numbers (even 1), null and a missing key are off. The section reaches other crates as config.sections.passthrough_websocket. Its tests live in the section's tests.rs.

  Deepgram route. `deepgram_listen_route` in passthrough_deepgram_ws serves the WebSocket paths `/deepgram/v1/listen` and `/deepgram/listen`. Auth comes first and uses the requested model: call B052's model-aware WebSocket auth adapter (user_api_key_auth_websocket_for_model) with B1542's deepgram_listen_requested_model(query), which is the first `model` query value or `nova-3`. An auth failure is that adapter's close; this route adds nothing. It reuses RouteSocket, WebSocketRelayPort and negotiated_subprotocol from the OpenAI module. Steps:
  1. Key = get_credentials("deepgram", None). Missing: close with 1011 and reason `Required 'DEEPGRAM_API_KEY' in environment to make pass-through calls to Deepgram.` without accepting, and return.
  2. Accept with the negotiated subprotocol.
  3. B1542's deepgram_listen_callback_params(query). If it is not empty, close with 1008 and reason `Deepgram callback delivery is not supported through the proxy: remove <names joined with ", ">`, and return.
  4. target = B1542's deepgram_listen_websocket_target(api_base, query), where api_base is B8500's get_secret_str("DEEPGRAM_API_BASE"). If B1542's deepgram_listen_is_priced(target) is false, close with 1008 and reason `No streaming price for '<registry key>': add it to the model cost map to enable it`, where the registry key is B1542's deepgram_listen_registry_key(target). Return.
  5. Call the relay with target, custom headers `{Authorization: Token <key>}`, forward_headers false, endpoint = the request path, accept_websocket false.

  NVIDIA NIM. `nvidia_nim_proxy_route` in passthrough_nvidia_relay serves `/nvidia_nim/{endpoint:path}` for GET, POST, PUT, DELETE and PATCH. It reads the request body with B1101's get_request_body (POST with a JSON or form content type is parsed; any other method gives an empty object; a POST with another content type is an error that becomes HTTP 500) and calls `relay_nvidia_nim_request(router, endpoint, request, body, key)`.
  The router is optional. The model group is B2324's nvidia_nim_model_group_in_path(endpoint, deployments) where deployments are B844's router.get_model_list() with no arguments; with no router there is no group.
  No router or no group: HTTP 400 whose detail is the JSON object `{"error": "no NVIDIA NIM model group in the path; call /nvidia_nim/{model_group}/v1/infer with a model group from your `model_list` whose deployments all use `nvidia_nim/` models"}` (use B3618's RelayRejection; the braces in the message are literal). The response body is `{"detail": {"error": ...}}`.
  Otherwise streaming = B3618's is_streaming_body(body) and the result is open_sse_before_first_byte(relay_router_model(router, model_group, endpoint, request, body, streaming, key), ping_interval_seconds) where ping_interval_seconds is the `sse_keepalive_ping_interval_seconds` setting (B002, default none) for a streaming call and none otherwise.
  The endpoint goes to relay_router_model unchanged, with the model group still in it; the provider config removes it later.
