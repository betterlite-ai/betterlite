dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports. B8606 mounts the routes and proves the OpenAI and NVIDIA HTTP routes over HTTP with the oracle cases that were listed here; the helper cases stay.
    proof: [openai-route-tests]
  - text: join_url_paths keeps the base path prefix, inserts `/v1` after api.openai.com only for the OpenAI provider and only when the URL has no `/v1/`, and leaves Azure and Azure AI URLs unchanged.
    proof: [join-url-tests, oracle]
  - text: assemble_openai_headers sets lowercase `authorization` and `api-key` from the key, merges extra headers over them, and adds `OpenAI-Beta` only for an assistants route when no `OpenAI-Beta` key exists.
    proof: [openai-header-tests, oracle]
  - text: openai_pass_through marks a call streaming only when the URL text contains `stream`, passes the provider string as custom_llm_provider, and hands the headers and URL to B3615's factory.
    proof: [openai-handler-tests]
  - text: openai_proxy_route reads OPENAI_API_BASE (default `https://api.openai.com/`), fails with HTTP 500 and the exact message when no key exists, and forwards the request with the key to the upstream.
    proof: [openai-route-tests]
  - text: openai_ws_refusal returns the disabled refusal unless the switch is on, returns the model-restricted refusal for any model outside `all-proxy-models`, `all-team-models` and `*`, and does not read the allowlists while the switch is off.
    proof: [ws-refusal-tests, oracle]
  - text: negotiated_subprotocol takes the first non-empty trimmed entry of `sec-websocket-protocol` and gives none for a missing or empty header.
    proof: [subprotocol-tests, oracle]
  - text: openai_websocket_route sends the refusal frame and the 1008 close after accepting, closes with 1011 and no accept when the key is missing, and otherwise accepts once and calls the relay with the wss target, the Bearer header, forward_headers false, the full request path and accept_websocket false.
    proof: [ws-route-tests]
  - text: The OpenAI WebSocket target turns https into wss and http into ws, keeps a base path prefix and joins the request query with `?` or `&`.
    proof: [ws-target-tests, oracle]
  - text: deepgram_listen_route authenticates with the requested model, closes with 1011 before accept when the key is missing, then accepts, closes with 1008 for callback parameters or an unpriced target, and otherwise relays to the listen target with a `Token` header.
    proof: [deepgram-route-tests]
  - text: relay_nvidia_nim_request answers 400 with the exact `detail.error` text when the router or the model group is missing, and otherwise calls relay_router_model with the unchanged endpoint and the keepalive interval only for streaming bodies.
    proof: [nvidia-relay-tests]
  - text: The passthrough_websocket config section is off by default, is on for YAML true and the string `true` in any case, and is off for `false`, `1`, other text and null.
    proof: [ws-switch-config-tests]
checks:
  optional: []
  commands:
    - id: join-url-tests
      why: the OpenAI URL join keeps the wrong path, misses the v1 insertion or inserts it for Azure
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::join_url(::|$)/)'
    - id: openai-header-tests
      why: the OpenAI header assembly or the assistants beta header is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::openai_header(::|$)/)'
    - id: openai-handler-tests
      why: the shared OpenAI handler sets the wrong streaming flag, provider string, headers or target
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::openai_handler(::|$)/)'
    - id: openai-route-tests
      why: the OpenAI HTTP route reads the wrong base URL, hides the missing-key error or drops the key
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::openai_route(::|$)/)'
    - id: ws-refusal-tests
      why: the OpenAI WebSocket refusal decision or its order is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::ws_refusal(::|$)/)'
    - id: subprotocol-tests
      why: the negotiated subprotocol picks the wrong entry
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::subprotocol(::|$)/)'
    - id: ws-route-tests
      why: the OpenAI WebSocket route accepts at the wrong time, sends a wrong frame or calls the relay with wrong arguments
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::ws_route(::|$)/)'
    - id: ws-target-tests
      why: the OpenAI WebSocket target scheme, path or query is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_openai_routes::tests::ws_target(::|$)/)'
    - id: deepgram-route-tests
      why: the Deepgram route skips auth with the model, mis-orders accept and close, or sends a wrong header
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_deepgram_ws::tests::/)'
    - id: nvidia-relay-tests
      why: the NVIDIA relay rejection, group lookup, endpoint or keepalive interval is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_nvidia_relay::tests::/)'
    - id: ws-switch-config-tests
      why: the WebSocket switch section is missing or reads a value wrongly
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::passthrough_websocket::/)'
