id: B2211
title: Claude Platform workspace and signing inputs
description: >-
  Implement Claude Platform on AWS workspace selection, endpoint/auth inputs and body filtering shared by chat and
  native Messages. Preserve the source precedence, including caller optional settings that precede deployment values.
  This lower helper part does not register routes.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/claude_platform/common_utils.py:
  constants L13-L26; filter_claude_platform_request_body L29-L48; resolve_unsupported_override L51-L72; strip_claude_platform_route
  L75-L78; get_error_class L82-L88; _get_workspace_id L90-L104; _get_required_aws_region_name L106-L123; get_complete_url
  L125-L145; sign_request L147-L170.


  Named case contracts: workspace_alias_precedence: Evaluate truthy chain optional.workspace_id,litellm.workspace_id,optional.aws_workspace_id,litellm.aws_workspace_id,optional[anthropic-workspace-id],litellm[anthropic-workspace-id].
  Only if resulting value is None evaluate optional.anthropic_workspace_id or litellm.anthropic_workspace_id. Any
  non-None result becomes str, including empty/False/0 at the final position; only None falls back to ANTHROPIC_AWS_WORKSPACE_ID
  or ANTHROPIC_WORKSPACE_ID through B129. Missing defaultsNone; preserve the difference between falsey and None,
  and optional-before-deployment alias precedence. explicit_region_required: Region chain truthy optional.aws_region_name,AWS_REGION_NAME,AWS_REGION,AWS_DEFAULT_REGION.
  Result None -> AuthenticationError status401,provider bedrock,model empty,message Missing AWS region for Claude
  Platform on AWS. Pass `aws_region_name` or set a standard AWS region environment value. Otherwise stringify then
  call B591 _validate_aws_region_name; do not default us-west-2. Final empty environment value follows validation,
  not missing-None branch. api_base_before_region: Base chain explicit api_base,litellm.api_base,ANTHROPIC_AWS_BASE_URL,ANTHROPIC_AWS_API_BASE;
  only final None requires region and builds https://aws-external-anthropic.{region}.api.aws. If not exact endswith
  /v1/messages append it after rstrip slash; already complete path remains, trailing /v1/messages/ becomes /v1/messages/v1/messages.
  Empty final base becomes /v1/messages without region validation. platform_route_prefix: strip_claude_platform_route
  removes exactly one leading claude_platform/ and leaves other prefixes and later occurrences unchanged. unsupported_override:
  Resolve non-None optional.claude_platform_unsupported_params before deployment value. None uses default {context_management};
  list/set/frozenset/tuple stringify every item and form set, including numeric/None entries. Empty sequence is
  an intentional empty override, allowing context_management through. Other types warn bedrock/claude_platform:
  ignoring claude_platform_unsupported_params of type {type}; expected a list of param names. Using the default
  unsupported-param set. and fall back; log_invalid=False suppresses only that warning. No invalid-override error.
  filtered_body_fields: Always remove workspace_id,aws_workspace_id,anthropic_workspace_id,anthropic-workspace-id,claude_platform_unsupported_params
  and every key starting aws_. Also remove override/default unsupported names; warn only for present unsupported-set
  keys, in original map order, when log_dropped=True: bedrock/claude_platform: dropping unsupported Messages API
  param(s) {tuple} from the request body; the Claude Platform on AWS endpoint rejects unknown fields. The request
  will proceed without them. No warning for nonrequest/aws_ removals unless also in unsupported set. Preserve other
  keys and values, including None. platform_signing: Truthy explicit api_key or ANTHROPIC_AWS_API_KEY returns supplied
  headers,None without signing; this helper does not add x-api-key itself. Otherwise B595 _sign_request service
  aws-external-anthropic with original args but no explicit api_key argument. Thus its ordinary fallback AWS_BEARER_TOKEN_BEDROCK
  behavior remains applicable; do not invent a forced SigV4-only gate. get_error_class delegates B682 unchanged.


  Load workspace_id, aws_workspace_id, anthropic-workspace-id, anthropic_workspace_id through betterlite-config,
  with injected environment lookup and the defaults/precedence stated here. Deployment inputs use litellm_params
  and global inputs use litellm_settings. Add config rstest claude_workspace_aliases_config_cases; each named loads_<key>
  case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml parser seeds. Reject
  unrelated keys.


  All six newly owned environment/override fields and all four workspace aliases default None. Keep underscore and
  hyphen aliases distinct in loader rstest names; name the hyphen-key loader loads_anthropic_hyphen_workspace_hyphen_id.
  api_base and standard AWS environment loaders keep their existing owners B500/B591; B129 supplies get_secret_str.


  Implement crates/betterlite-bedrock/src/claude_platform_inputs.rs with adjacent tests under claude_platform/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation claude_platform_inputs in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function claude_platform_inputs_cases in betterlite-bedrock with these exact named cases (one per
  oracle file): workspace_alias_precedence, explicit_region_required, api_base_before_region, platform_route_prefix,
  unsupported_override, filtered_body_fields, platform_signing. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/claude_platform_inputs* using HelperCase: kind:
  helper and the externally tagged claude_platform_inputs variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_claude_platform_inputs that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/claude_platform_inputs.rs
  and its loader wiring: ANTHROPIC_AWS_WORKSPACE_ID, ANTHROPIC_WORKSPACE_ID, ANTHROPIC_AWS_BASE_URL, ANTHROPIC_AWS_API_BASE,
  ANTHROPIC_AWS_API_KEY, claude_platform_unsupported_params. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest claude_platform_inputs_config_cases
  with named cases loads_anthropic_aws_workspace_id, loads_anthropic_workspace_id, loads_anthropic_aws_base_url,
  loads_anthropic_aws_api_base, loads_anthropic_aws_api_key, loads_claude_platform_unsupported_params, plus rejects_unrelated_key.
  Each loads case calls the real config loader with that key and asserts the resolved value, default, precedence
  and secret redaction where applicable. Seed B002 config_yaml with new claude_platform_inputs* files for every
  key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone claude_platform_inputs_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone claude_platform_inputs_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 143 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 200 production lines, 275 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 130 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 745 planned, 750 maximum changed lines.
