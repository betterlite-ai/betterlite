      None requires region and builds https://aws-external-anthropic.{region}.api.aws. If not exact endswith /v1/messages
      append it after rstrip slash; already complete path remains, trailing /v1/messages/ becomes /v1/messages/v1/messages.
      Empty final base becomes /v1/messages without region validation.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::claude_platform_inputs_cases::case_[0-9]+_api_base_before_region$/)'
  - id: case-platform-route-prefix
    why: strip_claude_platform_route removes exactly one leading claude_platform/ and leaves other prefixes and
      later occurrences unchanged.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::claude_platform_inputs_cases::case_[0-9]+_platform_route_prefix$/)'
  - id: case-unsupported-override
    why: 'Resolve non-None optional.claude_platform_unsupported_params before deployment value. None uses default
      {context_management}; list/set/frozenset/tuple stringify every item and form set, including numeric/None entries.
      Empty sequence is an intentional empty override, allowing context_management through. Other types warn bedrock/claude_platform:
      ignoring claude_platform_unsupported_params of type {type}; expected a list of param names. Using the default
      unsupported-param set. and fall back; log_invalid=False suppresses only that warning. No invalid-override
      error.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::claude_platform_inputs_cases::case_[0-9]+_unsupported_override$/)'
  - id: case-filtered-body-fields
    why: 'Always remove workspace_id,aws_workspace_id,anthropic_workspace_id,anthropic-workspace-id,claude_platform_unsupported_params
      and every key starting aws_. Also remove override/default unsupported names; warn only for present unsupported-set
      keys, in original map order, when log_dropped=True: bedrock/claude_platform: dropping unsupported Messages
      API param(s) {tuple} from the request body; the Claude Platform on AWS endpoint rejects unknown fields. The
      request will proceed without them. No warning for nonrequest/aws_ removals unless also in unsupported set.
      Preserve other keys and values, including None.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::claude_platform_inputs_cases::case_[0-9]+_filtered_body_fields$/)'
  - id: case-platform-signing
    why: Truthy explicit api_key or ANTHROPIC_AWS_API_KEY returns supplied headers,None without signing; this helper
      does not add x-api-key itself. Otherwise B595 _sign_request service aws-external-anthropic with original args
      but no explicit api_key argument. Thus its ordinary fallback AWS_BEARER_TOKEN_BEDROCK behavior remains applicable;
      do not invent a forced SigV4-only gate. get_error_class delegates B682 unchanged.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::claude_platform_inputs_cases::case_[0-9]+_platform_signing$/)'
  - id: config-workspace-alias-workspace-id-underscore
    why: workspace_id lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::claude_workspace_aliases_config_cases::case_[0-9]+_loads_workspace_id$/)'
