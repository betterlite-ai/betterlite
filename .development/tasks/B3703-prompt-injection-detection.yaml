dod:
  - text: >-
      The keyword generator returns the 376 lowercased phrases in verb, adjective, preposition order, keeping only
      phrases of more than 2 words, so "ignore previous" is absent and "do not follow" is present.
    proof: [keywords-tests, oracle]
  - text: >-
      The matcher ratio equals Python SequenceMatcher(None, a, b).ratio() for identical strings, disjoint strings,
      repeated characters where longest-match ties matter, and non-ASCII text.
    proof: [matcher-tests, oracle]
  - text: >-
      check_user_input_similarity lowercases the input, uses windows of the keyword's character length, needs a ratio
      strictly above the threshold (a ratio exactly equal to it does not match), and finds nothing in an input shorter
      than every keyword.
    proof: [similarity-tests, oracle]
  - text: >-
      The heuristics pool runs at most heuristics_max_threads checks at the same time and rejects a zero size by
      treating it as 1 in the config section, not in the pool.
    proof: [pool-tests]
  - text: >-
      pre_call passes untouched any call type outside the seven accepted ones, treats embeddings as an empty prompt,
      scans when params is None, scans only when heuristics_check is true when params is set, and does nothing for
      vector_db_check.
    proof: [pre-call-tests]
  - text: >-
      pre_call rejects a detected attack with status 400 and detail {"error": "Rejected message. This is a prompt
      injection attack."}, returns that message as RejectedAsMessage when reject_as_response is true, and logs and
      passes the request when the prompt cannot be built.
    proof: [pre-call-tests]
  - text: >-
      moderation returns None without params or with an empty prompt, never runs heuristics, calls the judge only
      when llm_api_check, llm_api_name and stored model names are all present, rejects on a case-sensitive substring
      of llm_api_fail_call_string in the first choice, returns Some(false) otherwise, and propagates prompt-building
      and judge errors.
    proof: [moderation-tests]
  - text: >-
      update_environment fails with the exact "Model List not set" and "Invalid LLM API Name" messages only when
      llm_api_check is true, and accepts anything otherwise.
    proof: [environment-tests]
  - text: prompt_injection_detection_default_pt returns the exact LiteLLM string.
    proof: [template-tests]
  - text: >-
      The config section loads prompt_injection_params with LiteLLM's defaults, applies the three llm_api_check
      validation messages in order (empty strings count as missing), keeps None distinct from all-false params, and
      resolves PROMPT_INJECTION_HEURISTICS_MAX_THREADS (default 1, floor 1) and
      DEFAULT_PROMPT_INJECTION_SIMILARITY_THRESHOLD (default 0.7, typed error when unparseable).
    proof: [config-tests]
  - text: Fresh prompt_injection_params YAML corpus entries replay through the config decoder without a panic.
    proof: [config-corpus]

checks:
  optional: [mutants]
  commands:
    - id: keywords-tests
      why: the keyword list differs from LiteLLM's in content, order or the word-count filter
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::keywords::/)'
    - id: matcher-tests
      why: the SequenceMatcher port gives a ratio that differs from difflib
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::matcher::/)'
    - id: similarity-tests
      why: the sliding-window check, the lowercasing or the strict threshold comparison is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::similarity::/)'
    - id: pool-tests
      why: the heuristics pool does not bound concurrent checks
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::pool::/)'
    - id: pre-call-tests
      why: the pre-call hook gates call types, params or rejection output differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::pre_call::/)'
    - id: moderation-tests
      why: the moderation hook, its judge call or its fail-string test is missing or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::moderation::/)'
    - id: environment-tests
      why: update_environment does not validate the model list or the model name
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::environment::/)'
    - id: template-tests
      why: the default system prompt string is missing or changed
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^prompt_injection::template::/)'
    - id: config-tests
      why: the prompt_injection section does not load params, validate them or resolve its two environment values
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::prompt_injection::/) - test(replays_the_config_yaml_corpus)'
    - id: config-corpus
      why: no new prompt_injection_params corpus entries were added, or the config decoder fails on one
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/prompt-injection-*')"
        && grep -rlq 'prompt_injection_params' crates/betterlite-config/fuzz/corpus/config_yaml
        && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'

