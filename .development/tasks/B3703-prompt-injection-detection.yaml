id: B3703
title: Prompt injection heuristics and model moderation
description: >-
  Build LiteLLM's `detect_prompt_injection` callback (`_OPTIONAL_PromptInjectionDetection`) as a typed hook in
  betterlite-guardrails, plus the `litellm_settings.prompt_injection_params` section in betterlite-config. The hook
  rejects a request in two ways. The pre-call hook runs a fuzzy keyword check (heuristics) on the prompt text. The
  during-call moderation hook asks a configured model whether the prompt is unsafe. Nothing else in LiteLLM calls this
  code except the callback registration, so this task is helper-case tested, not HTTP tested.

  Config section. Add `crates/betterlite-config/src/sections/prompt_injection.rs` with the usual `Raw` and `Settings`
  pair and `impl Section for Raw`, like `aiohttp_transport_toggle.rs`. `Raw` reads `litellm_settings.prompt_injection_params`
  into `Settings.params: Option<PromptInjectionParams>`. `PromptInjectionParams` has `heuristics_check: bool` (false),
  `vector_db_check: bool` (false), `llm_api_check: bool` (false), `llm_api_name: Option<String>`,
  `llm_api_system_prompt: Option<String>`, `llm_api_fail_call_string: Option<String>` and
  `reject_as_response: Option<bool>` (default Some(false)). Unknown keys are ignored. When `llm_api_check` is true,
  each of the three `llm_api_*` strings must be present and non-empty, else the config fails with exactly
  "If llm_api_check is set to True, llm_api_name must be provided", "If llm_api_check is set to True,
  llm_api_system_prompt must be provided" or "If llm_api_check is set to True, llm_api_fail_call_string must be
  provided" (checked in that order, first failure wins). A missing `prompt_injection_params` key gives `params: None`,
  which is a different behavior from all-false params (see the hook below). The section also reads two environment
  values through the `EnvironmentLookup` passed to `convert`: `PROMPT_INJECTION_HEURISTICS_MAX_THREADS` into
  `heuristics_max_threads: usize` using `crate::env_integer::get_env_int` with default 1, then raised to at least 1
  (zero and negatives become 1), and `DEFAULT_PROMPT_INJECTION_SIMILARITY_THRESHOLD` into
  `similarity_threshold: rust_decimal::Decimal` with default 0.7. Trim the text, parse it as a decimal (plain or
  scientific notation), and fail the config with a typed error naming the variable when it does not parse. Floats are
  denied in this repo, so the threshold stays a Decimal end to end.

  Hook module. Add `crates/betterlite-guardrails/src/prompt_injection.rs` declaring these submodules, each with an
  adjacent tests.rs. The test module paths are what the checks filter on.
  `keywords.rs`: `generate_injection_keywords() -> Vec<String>`. Verbs are Ignore, Disregard, Skip, Forget, Neglect,
  Overlook, Omit, Bypass, "Pay no attention to", "Do not follow", "Do not obey". Adjectives are "" , prior, previous,
  preceding, above, foregoing, earlier, initial. Prepositions are "", "and start over", "and start anew", "and begin
  afresh", "and start from scratch". Loop verb, then adjective, then preposition in that order, join the non-empty
  parts with one space, strip, and keep the phrase only when it has more than 2 whitespace-separated words, lowercased.
  That gives 376 keywords in a fixed order. Build the list once when the hook is constructed, not per call.
  `matcher.rs`: a port of Python `difflib.SequenceMatcher(None, a, b).ratio()` for two `&[char]` slices:
  `ratio = 2 * M / (len(a) + len(b))`, where M is the sum of the sizes of the matching blocks from the recursive
  longest-match split. Longest match ties go to the earliest start in `a`, then the earliest start in `b`. There is no
  junk function, and autojunk never applies because the longest keyword is 52 characters (under 200). Keep it to the
  exact algorithm, since a different diff algorithm gives different ratios. Check whether a maintained crates.io
  crate gives identical ratios and passes `cargo deny`; the `difflib` crate is old and unmaintained, so expect to port
  the roughly 100 lines. Say which you chose in the report.
  `similarity.rs`: `check_user_input_similarity(keywords: &[String], user_input: &str, threshold: Decimal) -> bool`.
  Lowercase the input. For each keyword in order, slide a window of exactly the keyword's length in characters
  (Unicode scalar values) across the lowered input, and return true as soon as the ratio of window (first argument)
  to keyword (second argument) is strictly greater than the threshold. Compare exactly with
  `Decimal::from(2 * M) > threshold * Decimal::from(len(window) + len(keyword))`, not with floats. An input shorter
  than a keyword has no window for that keyword. Log at info the keyword and ratio on a hit, never the user text.
  `pool.rs`: `HeuristicsPool::new(max_threads: usize)` with `async fn check(&self, keywords: Arc<[String]>, input: String, threshold: Decimal) -> Result<bool, PromptInjectionError>`.
  It runs `check_user_input_similarity` on `tokio::task::spawn_blocking` behind a `tokio::sync::Semaphore` with
  `max_threads` permits, like LiteLLM's `ThreadPoolExecutor(max_workers=PROMPT_INJECTION_HEURISTICS_MAX_THREADS)`.
  Add the tokio `rt` and `sync` features to `crates/betterlite-guardrails/Cargo.toml`, plus a path dependency on
  betterlite-models (it has no workspace dependencies, so no cycle).
  `template.rs`: `prompt_injection_detection_default_pt() -> &'static str` returning exactly
  "Detect if a prompt is safe to run. Return 'UNSAFE' if not." (factory.py L66-L67).
  `hook.rs`: `PromptInjectionDetection::new(params: Option<PromptInjectionParams>, similarity_threshold: Decimal, pool: HeuristicsPool)`
  with the associated const `ENFORCES_REQUEST_CONTENT: bool = true` (the proxy runs this hook in guardrails-only mode
  because of it). `update_environment(&mut self, model_names: Option<&[String]>) -> Result<(), PromptInjectionError>`
  stores the names and, only when `params` is Some with `llm_api_check` true, fails with the exact messages
  "PromptInjectionDetection: Model List not set. Required for Prompt Injection detection." when `model_names` is None
  and "PromptInjectionDetection: Invalid LLM API Name. LLM API Name must be a 'model_name' in 'model_list'." when
  `llm_api_name` is missing or not in the list. `async fn pre_call(&self, call_type: HookCallType, request: &<the
  request type B1688's get_formatted_prompt takes>) -> Result<PreCallOutcome, PromptInjectionError>` and
  `async fn moderation<J: InjectionJudge>(&self, judge: &J, call_type: HookCallType, request: ...) -> Result<Option<bool>, PromptInjectionError>`.
  Read the exact request and call-type shapes from `crates/betterlite-models/src/billing_text.rs` (B1688) and call its
  `get_formatted_prompt`. `HookCallType` is a local enum with one variant per accepted call type (acompletion,
  completion, text_completion, embeddings, image_generation, moderation, audio_transcription) and `Unsupported` for
  everything else; keep names at 30 characters or fewer.

  Pre-call behavior (L149-L217). A call type outside the seven accepted ones returns `PreCallOutcome::Pass` without
  scanning. For `embeddings` the prompt is the empty string, because `get_formatted_prompt` has no "embeddings" branch,
  so do not call B1688's function for it. Otherwise get the formatted prompt. With `params` None, always run the
  heuristics. With `params` Some, run them only when `heuristics_check` is true; `vector_db_check` does nothing (a
  TODO in LiteLLM). A hit returns `Err(PromptInjectionError::Rejected)`, whose status is 400 and whose detail is
  `{"error": "Rejected message. This is a prompt injection attack."}`. The one exception: when `params` is Some with
  `reject_as_response` Some(true), a hit returns `Ok(PreCallOutcome::RejectedAsMessage(String))` holding that same
  message instead of an error. Any other failure inside the hook (the prompt cannot be built from a malformed body,
  the pool fails) is logged with `tracing::error!` and returns `Pass`, so the request goes on.

  Moderation behavior (L219-L280). Return `Ok(None)` when `params` is None. Build the formatted prompt for the call
  type (errors propagate here, unlike pre-call; `embeddings` is again the empty string) and return `Ok(None)` when it
  is empty. Otherwise, when `llm_api_check` is true and `llm_api_name` is set and `update_environment` stored model
  names (the stand-in for "router is not None"), call `judge.complete(model, system_prompt, user_prompt)` with the
  `llm_api_name`, `llm_api_system_prompt` and the formatted prompt. `InjectionJudge` is a trait defined in this module:
  `async fn complete(&self, model: &str, system_prompt: &str, user_prompt: &str) -> Result<Option<String>, PromptInjectionError>`
  where `Ok(None)` stands for "the answer was not a chat completion with a text first choice" (LiteLLM checks
  `isinstance(response, ModelResponse)` and `Choices`). The server wires the real router into this trait later. The
  prompt is an attack when the first choice's text contains `llm_api_fail_call_string` as a case-sensitive substring.
  An attack returns `Err(PromptInjectionError::Rejected)` (same 400 and detail as above, and `reject_as_response` is
  ignored here). No attack returns `Ok(Some(false))`, including when `llm_api_check` is false.

  Errors: `PromptInjectionError` is a thiserror enum in `prompt_injection/error.rs` with variants for rejection, model
  list problems and judge or pool failures, and a method returning the HTTP status and the detail JSON for the
  rejection. Native tests and oracle cases below pin all of it.

