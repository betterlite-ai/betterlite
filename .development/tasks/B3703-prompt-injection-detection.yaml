deviations:
  - what: The info log line on a heuristics hit names the keyword and the ratio but leaves out the user's text.
    why: LiteLLM logs "Rejected user input - {user_input}", which copies a possibly sensitive prompt into the proxy log.
  - what: A DEFAULT_PROMPT_INJECTION_SIMILARITY_THRESHOLD value that is not a finite decimal (text, nan, inf) fails config loading with an error that names the variable.
    why: Python fails at import with a ValueError for text, and accepts nan and inf, which make every comparison false or true; a finite Decimal keeps the strict comparison exact.
  - what: Verbose output has no `print` to stdout when `litellm.set_verbose` is on; only tracing log lines are written.
    why: betterlite has no global verbose flag, and the repo rules forbid global state.
  - what: The model call goes through an injected `InjectionJudge` trait instead of `llm_router.acompletion`.
    why: betterlite-guardrails cannot depend on the router or server crates; the server implements the trait over its router.

out_of_scope:
  - "get_formatted_prompt: B1688 builds it in betterlite-models::billing_text; this task only calls it."
  - "Registering the detect_prompt_injection callback name (callback_utils.py L325-L338, a branch of initialize_callbacks_on_proxy): no owner. B189 covers the file but merged without that function, and B3683 ports only the part the legacy default_on guardrails need. This task gives it PromptInjectionDetection::new and the config section."
  - "ProxyStartupEvent._attach_router_to_prompt_injection_detectors (proxy_server.py L10145-L10151): B124 (the proxy_server umbrella, no task file yet) calls update_environment; this task only provides it."
  - "Router.acompletion and its ModelResponse: the server implements InjectionJudge over its router."
  - "Pre-call and during-call dispatch, the guardrails-only gate on enforces_request_content, and the mapping of a returned string to RejectedRequestError or HTTP 400 (proxy/utils.py): B124 (it lists ProxyLogging.pre_call_hook and during_call_hook, no task file yet). RejectedRequestError itself: B163. The string mapping has no task of its own."
  - "LiteLLMPromptInjectionParams as a pydantic class in proxy/_types.py: built here only as the config section; the rest of _types.py is owned by its own tasks."
  - "Every other function in factory.py: owned by B177 and B222 to B229; this task owns only prompt_injection_detection_default_pt."
  - "vector_db_check: LiteLLM leaves it a TODO that does nothing at the pin, so it is parsed and ignored."
  - "SkillPromptInjectionHandler (llms/litellm_proxy/skills/prompt_injection.py), Lakera and Aporia prompt injection hooks: different features, owned by B1504 and the vendor guardrail tasks."

pitfalls:
  - The accepted call-type list says "embeddings" (plural) but get_formatted_prompt only has an "embedding" branch, so an embeddings request passes the gate and is scanned as an empty string and never rejected.
  - Call types outside acompletion, completion, text_completion, embeddings, image_generation, moderation and audio_transcription (responses, rerank and the like) return the data untouched with no scan.
  - Params None means heuristics always run in pre-call, while params present with heuristics_check false means pre-call never scans; do not collapse the two.
  - Pre-call swallows every non-HTTP error (a request with no "messages", a moderation input list holding a non-string) by logging and returning None, so the request goes through; the moderation hook has no such guard.
  - reject_as_response only matters in pre-call, where it returns the message string; the moderation hook always raises the 400.
  - llm_api_system_prompt is read with getattr on a field that always exists, so the default template never applies; with llm_api_check true the validator already required a non-empty prompt.
  - The fail-string test looks at the first choice content only, is case-sensitive, and treats None content or a non-chat answer as safe.
  - A keyword needs more than 2 words after joining, so "ignore previous" (2 words) is dropped while "ignore and start over" stays.
  - The window is cut from the lowered input to the keyword's length in characters, not bytes, and SequenceMatcher gets the window first and the keyword second, which matters for tie-breaking.
  - The threshold test is strictly greater, so a ratio of exactly 0.7 (14 matched characters over a 20-character window and keyword, for example) is not a hit.
  - The pool default is 1 worker, so heuristics checks run one at a time unless PROMPT_INJECTION_HEURISTICS_MAX_THREADS is raised, and each check does about 376 matcher runs per input position, so keep test inputs short.
  - The pydantic validator runs before type coercion and tests `llm_api_check is True`, and an empty string for any llm_api_* field counts as missing.
  - update_environment stores the router even when llm_api_check is false and only validates when it is true.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
