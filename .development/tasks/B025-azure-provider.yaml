id: B025
title: Azure provider registration and operation composition
description: >-
  Compose Azure chat, stream, embedding and text call variants using the Azure leaf modules; B695 and B696 install
  media and resource families. Own main.py _complete_azure and _complete_azure_text: resolve api_base and api_version
  once, merge absent provider defaults, route o-series models and retain extra_headers/max_retries. Reuse B2200/B531
  credential resolution rather than reading environment in the dispatcher.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/main.py: _complete_azure
  L1338-L1469; _complete_azure_text L1472-L1563.


  api_base ranks explicit, litellm.api_base, AZURE_API_BASE. Chat api_version also falls back to AZURE_DEFAULT_API_VERSION;
  Azure text has no final default and a missing base raises ValueError. Keys rank explicit, litellm.api_key, litellm.azure_key,
  AZURE_OPENAI_API_KEY, AZURE_API_KEY; extra_body.azure_ad_token precedes AZURE_AD_TOKEN. AZURE_API_TYPE defaults
  azure. Pass these resolved inputs to B529/B531.


  Provider composition changes existing chat dispatch, not route registration: add the HTTP dispatch case through
  the booted proxy for POST /v1/chat/completions and /chat/completions with the source provider prefix. Assert upstream
  request, auth, response status, error type/param/code and response headers. Keep the existing router as the sole
  route owner; pure helper cases exercise the other typed provider operations without calling FastAPI globals.


  Named case contracts: azure_chat_dispatch: Before resolving defaults, only a supplied AzureOpenAI/AsyncAzureOpenAI
  client is checked by B531 _check_dynamic_azure_params using the original api_version. A changed non-None version
  discards that client; absent version or matching version retains it. Non-Azure client handles bypass this check.
  No chat-owned missing-base error is added. azure_embedding_dispatch: Install B534 embeddings directly; its Azure
  and azure_text provider modes retain their own endpoint/model/credential defaults and SDK response conversion.
  The main chat token-pop and default merge do not run for embeddings. azure_text_dispatch: Text also merges AzureOpenAIConfig
  B684, then calls B540 with api_type and callable token provider. It has no final API version default. Text post_call
  runs on truthy stream or acompletion is True; chat only on truthy stream. Preserve response/header/error shapes
  from the chosen leaf; neither owned dispatcher catches leaf errors. azure_openai_regression: Exercise Azure and
  OpenAI deployments sequentially with distinct bases, versions, organization and credentials through their installed
  variants; Azure resolution and token body removal remain per-call and do not alter the OpenAI configuration. azure_missing_base:
  Only Azure text rejects api_base is None with ValueError: api_base is required for Azure OpenAI LLM provider.
  Either set it dynamically or set the AZURE_API_BASE environment variable. An empty final environment value is
  not None and passes this guard. azure_config_ranks: Chat/text api_base use truthy explicit, litellm.api_base,
  AZURE_API_BASE. api_version uses explicit, litellm.api_version, AZURE_API_VERSION; chat alone then defaults to
  B531 AZURE_DEFAULT_API_VERSION=2025-02-01-preview. API key uses explicit, global api_key, azure_key, AZURE_OPENAI_API_KEY,
  AZURE_API_KEY. AZURE_API_TYPE defaults azure. Pop azure_ad_token from kwargs.extra_body (default {}), then truthy-fallback
  to AZURE_AD_TOKEN; the removal mutates the body even when falling back, and malformed extra_body fails. Forward
  azure_ad_token_provider only if callable. azure_o_series_dispatch: Use B532 is_model_o_series_model on the resolved
  Azure detection model. Merge B532 O1 defaults and call B533 o-series handler with model, token and provider identifier,
  without the normal api_type or azure_ad_token_provider argument. Other models merge B684 AzureOpenAIConfig defaults
  and call B533 AzureChatCompletion with those arguments. azure_header_retry_merge: headers uses a truthy supplied
  map or litellm.headers. Non-None extra_headers, including {}, overwrites optional extra_headers on chat and text.
  Chat alone inserts a non-None max_retries (including 0/False); text does not. Merge selected config defaults only
  for absent keys, preserving explicit None.


  Write standalone Rust test azure_provider_credential_identity_isolation in betterlite-provider: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test azure_provider_secret_safe_failure in betterlite-provider: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Use B2230 for the shared Azure o-series predicate/Foundry route selector called by this dispatch branch; concrete
  provider transforms remain with their named leaves.


  Implement crates/betterlite-provider/src/azure_dispatch.rs with adjacent tests under azure_dispatch/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; leaf crates
  remain below this dispatcher and never import it. The production function is the only Rust implementation used
  by tests and oracle adapters.


  Register helper operation azure_provider in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_dispatch_cases in betterlite-provider with these exact named cases (one per oracle
  file): azure_chat_dispatch, azure_embedding_dispatch, azure_text_dispatch, azure_openai_regression, azure_missing_base,
  azure_config_ranks, azure_o_series_dispatch, azure_provider_dispatch_http, azure_header_retry_merge. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use
  the booted proxy and assert both client response and captured upstream request. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_provider* using HelperCase: kind: helper
  and the externally tagged azure_provider variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_azure_provider that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 190 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 270 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 655 planned, 675 maximum changed lines.
