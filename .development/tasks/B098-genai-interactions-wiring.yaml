deviations: []
out_of_scope:
  - "litellm/google_genai/Readme.md is documentation; nothing is built from it."
  - "The re-exports in litellm/google_genai/__init__.py, google_genai/adapters/__init__.py, interactions/__init__.py, interactions/agents/__init__.py and interactions/litellm_responses_transformation/__init__.py hold no logic. The Rust modules are declared by the skeleton; the Python package re-exports are B7844 (google_genai) and B7845 (interactions)."
  - "Every function in litellm/proxy/google_endpoints/agents_endpoints.py is B3508's, and B8774 mounts its routes."
  - "Streamed interaction logging (_get_assembled_streaming_response's interaction branch and _assemble_completed_interaction_response, litellm_logging.py L4141-L4171) is B9840's, inside the production StreamAssembler that the server composition root builds once; this task adds no assembler and no wrapper."
  - "The streamed interaction cases check the client's answer only; the usage the success callbacks log for them comes from B9840 and shows once the server's success handlers hold its LoggedStreamAssembler."
  - "The response a generateContent or agenerate_content call logs (_handle_non_streaming_google_genai_generate_content_response_logging, litellm_logging.py L2521-L2525 and L4300-L4320) is B9840's logged-result conversion, and the adapter cases check the client's answer only."
  - "The bridge's request and response transforms are B3497's, its event synthesis B3498's, the create entry B3499's, and the routes B3506, B3507 and B3508 with B8774's mount."
  - "Background interaction creates (background=true) get no case here: the cost poll fetches the upstream again after the response, outside one scripted exchange. B3481 and B3496 test the poll and settlement."
pitfalls:
  - "The interaction create route sets custom_llm_provider to gemini when the body has none, and only the deployment's own provider prefix (openai/oracle-model) replaces it, so a bridge case on a model without a prefix goes to native Gemini instead."
  - "The bridge forwards every extra kwarg (api_base, api_key, litellm_metadata) into the Responses request, so the deployment's credentials reach the Responses call; dropping them sends the case to the real OpenAI host."
  - "A bridge stream ends with a synthesized step.stop and interaction.completed when the upstream never sends response.completed; the case without that event checks them."
  - "Gemini's interactions URL is {api_base}/v1beta/interactions, with ?alt=sse added on a stream, and it raises before any request when no api_key is set."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
