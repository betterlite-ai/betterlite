id: B329
title: Custom complexity tiers and bounded dimensions
description: Extend B328's schema with custom tier definitions, non-reasoning tier, display labels, fallback
  tier, tier pools and per-tier parameter overrides. Add custom dimension keywords/patterns, binary/match-count
  scoring and the pinned bounded-pattern validation. Normalize once at configuration load into typed structures;
  B334 consumes pools and B331 consumes custom classifier prompts. Reject unimplemented optional keys
  until their owning tasks land and never silently reduce a custom ladder to the four default tiers. Use
  the existing Rust crate boundaries from B004 and B008; integrate through the server when the provider
  dispatcher or callbacks live in another core crate. This task's source slices are the linked ranges,
  not a port of their Python classes. Add the listed oracle cases and the matching adapters to B301's
  component runner where state is not observable over HTTP; adapters call production logic and never reproduce
  it. Use deterministic candidate sets or supplied random samples for comparisons, and separate seeded
  distribution tests for random choices. Extend the existing config_yaml fuzz target and committed corpus
  for every newly accepted config form; unsupported keys still fail by full path. Keep the implementation,
  adapters and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/complexity-config/**
  - tools/oracle/src/router_probes/complexity-config/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/complexity_config.py
  - tools/oracle/litellm/probes/registry.py
  - Cargo.toml
  - deny.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L97-L273
  why: Tier models, labels and custom prompt normalization.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L737-L842
  why: Custom pattern work limits and dimensions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L1508-L1603
  why: Tier and marker normalization.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L1743-L2184
  why: Cross-field validation for ladders, overrides and matching.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(complexity_config)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/complexity-config/custom-ladder-order.yaml
- tools/oracle/cases/routing/complexity-config/non-reasoning-tier.yaml
- tools/oracle/cases/routing/complexity-config/display-labels-not-boundary-keys.yaml
- tools/oracle/cases/routing/complexity-config/string-object-mixed-pool.yaml
- tools/oracle/cases/routing/complexity-config/tier-override-validation.yaml
- tools/oracle/cases/routing/complexity-config/custom-binary-and-count.yaml
- tools/oracle/cases/routing/complexity-config/pattern-work-limit.yaml
- tools/oracle/cases/routing/complexity-config/invalid-cross-field-config.yaml
deviations: []
out_of_scope:
- The actual pooled deployment choice (B334).
- LLM classifier credentials and response parsers.
pitfalls:
- Python's bounded-pattern validator is a policy as well as a parser; a linear Rust regex engine does
  not automatically reproduce its accepted language.
- Keep duplicate tier model entries visible for validation rather than overwriting them in a map.
- Do not enable plugin fields until B021 supplies their runtime.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
