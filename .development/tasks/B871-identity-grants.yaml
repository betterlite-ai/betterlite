id: B871
title: Resolve user and membership authentication grants
description: >-
  Build betterlite-auth::identity_grants for the whole grants.py resolver and team_grants.py
  projection. These are lower services used by JWT and session refresh, not a new auth backend or
  route. Use the actual B736 user reader, B737 team reader and B2318 membership reader as direct
  dependencies; none depends on this task. Injectable versions serve deterministic ordering tests,
  with identical arguments and results. B859 supplies team/member/budget accessors, B720 user rows,
  B2310 object permissions and B732 UserNotFoundError. Do not attribute membership reads to B736's
  old ownership or hide a needed dependency behind a success stub.

  Own UserLoader, TeamLoader, MembershipLoader protocols; UserLookup, ResolvedGrants, UserGone,
  TeamGone, NotAMember, LookupDegraded and outcome unions; _UserModelColumn and _MODELS_COLUMN;
  all GrantResolver methods and the three free functions. UserLookup requires user_id (nullable),
  with user_email/sso_user_id=None and upsert=false. ResolvedGrants carries nullable user, team,
  membership and effective_user_id. Denials carry IDs; LookupDegraded retains the original error,
  distinguishable from proved absence. Constructor requires DB/cache and defaults span/logging to
  None, with production loaders as defaults. All loads receive exactly that DB/cache/span/logging.
  User loads also receive requested user_id, user_email, sso_user_id and upsert unchanged.

  resolve_identity loads a user only for a truthy requested user_id, so None/'' skips lookup even
  when email/SSO hints or upsert are supplied. canonical_user_id uses a present row's truthy ID,
  otherwise the requested ID. A changed ID emits DEBUG "Auth: rebinding user_id %r -> DB user_id %r
  (email/sso match)". Membership is loaded only when both effective ID and team_id are truthy,
  with the CANONICAL ID. It runs even when user loading returned None but the requested ID remains
  truthy. Return (user, membership, effective ID); this method catches no loader error and never
  loads the team or checks the user's teams array.

  resolve first calls resolve_identity. UserNotFoundError from either user OR membership loading
  becomes UserGone(requested_user_id or ''); any other ordinary error, including TeamNotFoundError
  in this phase, becomes LookupDegraded. Cancellation propagates. With team_id=None, immediately
  return ResolvedGrants(user,None,membership,effective ID). Otherwise, a present user whose teams
  array lacks the exact team_id becomes NotAMember using the row's ID; a membership row does not
  override that denial. A missing user skips this check, and an absent membership does not deny
  access if the array contains the team. Only then load the team. TeamNotFoundError becomes
  TeamGone; all other ordinary team-load errors become LookupDegraded, including UserNotFoundError.
  Empty team_id still reaches this phase, although membership lookup skipped it. Success returns
  all three snapshots. No DB writes, role checks, fallback grants or error logging occur here.

  raise_public maps UserGone to ProxyException status 401, type auth_error, param user_id,
  string code '401', message "Authentication Error, user '{user_id}' no longer exists." TeamGone
  invokes B737 TeamNotFoundError, HTTP 404 with detail {error: "Team doesn't exist in db.
  Team={team_id}. Create team via `/team/new` call."}. NotAMember raises HTTP 403 with detail
  "Team '{team_id}' is not in your team memberships." B757's existing boundary turns those HTTP
  exceptions into auth_error, param 'None', codes '404'/'403', retaining detail shape. This helper
  takes only the denial union, not LookupDegraded. B738 decides whether session snapshots may stand
  in after degraded reads; do not turn that outcome into automatic denial or an HTTP success here.

  user_models dumps only models and validates the whole column as tuple[str,...], default ().
  Preserve ordering/duplicates, but any ValidationError (including one nonstring item) returns ()
  silently rather than salvaging valid items. canonical_user_id accepts a null row or empty row ID
  without raising. Both are pure functions and do not change the row.

  In team_grants.py own TeamModelAliasTable, _TeamJsonColumns, TeamGrants, both column adapters and
  _decode_model_aliases/_json_columns/team_model_aliases/team_grants. decode_model_aliases parses
  ONLY strings as JSON dict[str,str]; invalid JSON, nonobject JSON or a nonstring value returns None
  after ValidationError, without warning. Nonstrings pass to the outer field validation unchanged.
  _json_columns dumps exactly metadata and nested litellm_model_table.model_aliases; validation of
  EITHER field failing discards BOTH into a fresh model with metadata=None/model table=None. Thus an
  invalid alias JSON string becomes null aliases while metadata survives, whereas an invalid direct
  alias mapping can discard metadata too. team_model_aliases(None) returns None; otherwise it returns
  this validated nested map or None, preserving an empty map. It does not merge global aliases.

  team_grants(None,...) returns an EMPTY mapping, not all null defaults. For a team, populate all
  eighteen fields: team_alias; team_tpm_limit/rpm_limit/tpd_limit; team_max_budget/soft_budget/
  model_max_budget/spend; team_models as an ordered tuple; team_blocked; team_metadata/model_aliases
  from the shared JSON projection; team_object_permission_id/object_permission directly from the
  row; team_member as the FIRST members_with_roles entry whose user_id matches a nonnull supplied
  user_id, including ''. No email match or role normalization is performed. team_member_spend is
  membership.spend or None, and team_member_tpm_limit/rpm_limit use B859's safe accessors or None.
  They preserve zero/negative/null values. Do not require the supplied membership IDs to match the
  team/user, and do not infer membership from team_member. Reuse Decimal for typed money, retaining
  B859's checked storage boundary rather than adding positivity checks in this projection.

  Native resolver tests cover user_hints_and_upsert_forwarded, falsey_user_skips_lookup,
  canonical_rebind_before_membership, no_user_still_loads_membership, membership_error_classification,
  team_none_short_circuit, teams_array_controls_membership, missing_membership_not_denial,
  empty_team_still_loaded, missing_user_allows_team_load, team_error_classification and
  cancellation_not_degraded, recording all effects. Postgres integration through the real three
  readers uses POSTGRES_TEST_URL when set, otherwise testcontainers; configured connection failure
  fails the test. Native public_denial_envelopes composes raise_public with B757 exactly once.

  Pure oracle operations call source user_models, canonical_user_id, raise_public, team_model_aliases
  and team_grants under B856 Management::auth. No async resolver with a fake DB goes into helper cases.
  Compare every projected field and raw denial category/detail; HTTP-route integration belongs to
  B738/B765/B877, their actual callers. Alias JSON is an external stored-string boundary: expose
  decode_model_aliases, add the team_model_aliases cargo-fuzz target in betterlite-auth, and replay
  seeds for invalid UTF-8/JSON, scalars, nested values, valid empty maps and Unicode strings. A
  decoded string follows the source null-on-validation-error behavior; malformed bytes cannot panic.
  The existing HelperCase decoder receives separate identity-grants operation seeds.

  The two full source files contain 294 nonblank noncomment lines with imports, excluding docstrings.
  Allow 285 production, 310 behavior/Postgres tests, 75 adapters, 65 fuzz/decoder and 35 wiring lines,
  770 within 800. Separate resolver, grant records and team projection into files below 300 lines.
scope:
  paths:
    - crates/betterlite-auth/src/identity_grants.rs
    - crates/betterlite-auth/src/identity_grants/**
    - crates/betterlite-auth/src/lib.rs
    - crates/betterlite-auth/Cargo.toml
    - crates/betterlite-auth/fuzz/Cargo.toml
    - crates/betterlite-auth/fuzz/fuzz_targets/team_model_aliases.rs
    - crates/betterlite-auth/fuzz/corpus/team_model_aliases/**
    - tools/oracle/src/helpers/identity_grants.rs
    - tools/oracle/src/helpers/identity_grants/**
    - tools/oracle/helpers/identity_grants.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/auth.rs
    - tools/oracle/helpers/management/auth.py
    - tools/oracle/cases/helpers/identity-grants/**
    - tools/oracle/fuzz/corpus/helper_case/identity-grants-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/resolvers/grants.py#L43-L139
    why: Required loader arguments, lookup defaults, typed outcomes and model-column shape.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/resolvers/grants.py#L142-L172
    why: Pure model/id accessors and exact denial exceptions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/resolvers/grants.py#L185-L267
    why: User then membership then team ordering, canonical ID logging and phase-sensitive failures.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/team_grants.py#L25-L126
    why: Alias string parsing, all-or-nothing loose-column validation and eighteen grant fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks.py#L3122-L3140
    why: B737's existing TeamNotFoundError has a dictionary detail, not the UserGone envelope.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_exception_handler.py#L47-L83
    why: B757 converts HTTP denials to auth_error while preserving ProxyException.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1409-L1452
    why: B738's caller, rather than GrantResolver, decides to keep minted grants on LookupDegraded.
dod:
  - text: Named resolver tests and Postgres readers prove argument forwarding, canonical-ID ordering, phase-sensitive denial/degradation and no membership-array bypass.
    proof: [behavior-tests]
  - text: Pure oracle cases and per_field projection rows cover every TeamGrants field, empty/malformed data, alias validation and raw public denial details.
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: Alias decoder's new fuzz corpus proves malformed input follows null/drop behavior without panic and without erasing valid metadata for the string-error branch.
    proof: [behavior-tests, alias-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Grant resolution or projection assertions are missing.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^identity_grants::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Pure source adapter is missing or incorrectly typed.
      run: test -f tools/oracle/helpers/identity_grants.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new projection operation has no added decoder seed.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/identity-grants-*")" && grep -rlq identity_grants tools/oracle/fuzz/corpus/helper_case/identity-grants-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: alias-corpus
      why: Stored alias strings have no production decoder target or fresh replay corpus.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/team_model_aliases.rs && grep -q team_model_aliases crates/betterlite-auth/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-auth/fuzz/corpus/team_model_aliases)" && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(replays_the_team_model_aliases_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/identity-grants/canonical-user-id-truthy-fallback.yaml
  - tools/oracle/cases/helpers/identity-grants/user-models-ordered-and-invalid-column.yaml
  - tools/oracle/cases/helpers/identity-grants/user-gone-401.yaml
  - tools/oracle/cases/helpers/identity-grants/not-a-member-403.yaml
  - tools/oracle/cases/helpers/identity-grants/team-gone-dictionary-404.yaml
  - tools/oracle/cases/helpers/identity-grants/no-team-empty-grants.yaml
  - tools/oracle/cases/helpers/identity-grants/all-eighteen-team-grants.yaml
  - tools/oracle/cases/helpers/identity-grants/member-first-exact-id-not-email.yaml
  - tools/oracle/cases/helpers/identity-grants/membership-null-zero-negative-limits.yaml
  - tools/oracle/cases/helpers/identity-grants/mismatched-membership-still-projects.yaml
  - tools/oracle/cases/helpers/identity-grants/alias-json-valid-and-empty-map.yaml
  - tools/oracle/cases/helpers/identity-grants/alias-json-invalid-keeps-metadata.yaml
  - tools/oracle/cases/helpers/identity-grants/alias-mapping-invalid-drops-both-columns.yaml
  - tools/oracle/cases/helpers/identity-grants/metadata-invalid-drops-aliases.yaml
  - tools/oracle/cases/helpers/identity-grants/no-team-aliases-none.yaml
deviations: []
out_of_scope:
  - B736 get_user_object, B737 get_team_object/TeamNotFoundError and B2318 get_team_membership own actual storage/cache/upsert behavior; their effects are preserved through the direct loader interfaces.
  - B738 refreshes session grants and decides LookupDegraded fallback; B765/B877 select JWT teams and call resolve_identity. This task adds no separately registered middleware or HTTP route.
  - B859 owns safe_get_team_member_tpm_limit/rpm_limit and typed team rows; B720 owns user rows and B2310 object permissions. B757 owns final auth-error serialization.
pitfalls:
  - A loaded membership row cannot grant access when the live user's teams array excludes that team.
  - A malformed alias JSON string and a malformed alias mapping follow different metadata-drop paths.
  - Empty team_id skips membership loading but does not skip the team lookup in resolve.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
