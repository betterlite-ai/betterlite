    - crates/betterlite-server/src/auth.rs
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/app.rs
    - tools/oracle/cases/auth/identity-grants/**
    - crates/betterlite-server/src/auth/identity_grants.rs
    - crates/betterlite-server/src/auth/identity_grants/**
