id: B4668
title: MCP object permission hydration
description: >-
  Implement object permission hydration and server/tool permission resolution for MCP access control.
  This task loads MCP permissions from the database when referenced by object_permission_id but not
  pre-loaded by the auth flow, then applies those permissions to resolve what MCP servers and tools
  a principal (key, team, end-user, user, agent, or org) is allowed to access. Hydration is lazy:
  permissions are loaded on-demand and cached via user_api_key_cache, using a unified check that raises
  UnloadableEntitlementError when a row NAMES a permission that cannot be read (known entitlement,
  unknown contents), preserving the distinction from "no permission" (no row, or row names nothing).
  Permission resolution stacks level-by-level with different union/intersection rules per level
  (key/team inherit or intersect, end-user/user/agent narrow, org ceilings), and every level can
  restrict via direct mcp_servers entries, tag-style mcp_access_groups, per-server mcp_tool_permissions,
  or mcp_toolsets (which resolve server/tool grants once and cache them). The keyless gateway-admitted-user
  path resolves permissions per team (each team is a source with separate org ceilings), while key auth
  uses a single key/team pair and org. Toolset resolution may raise UnloadableEntitlementError when
  declared toolsets yield no grants (deleted/unknown ids or DB fault); this is caught and converted to
  deny rather than silent allow-all. Per-team MCP rate-limit metadata is gathered for admitted subjects
  and stamped onto their auth object. All LiteLLM defaults apply: mcp_servers absent means no restriction
  (allow-all), MCP_ALL_TOOLS_WILDCARD means tool-level unrestricted for that level, the no_mcp_servers
  sentinel disallows every server from that level and below.
scope:
  paths:
    - crates/betterlite-mcp/src/auth.rs
    - crates/betterlite-mcp/src/auth/**
    - tools/oracle/helpers/b4668.py
    - tools/oracle/helpers/b4668/**
    - tools/oracle/src/helpers/mcp/b4668.rs
    - tools/oracle/src/helpers/mcp/b4668/**
  lint_tables: false

