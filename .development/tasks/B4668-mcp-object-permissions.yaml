id: B4668
title: MCP object permission hydration
description: >-
  Implement object permission hydration for MCP access control. This task loads MCP permissions from the database when a principal references an object_permission_id the auth flow did not pre-load. It owns the object permission getters for key, team, org, end-user, user and agent, _load_named_object_permission, the toolset helpers and _union_tool_grants.

  Hydration is lazy and cached through user_api_key_cache. UnloadableEntitlementError marks a row that NAMES a permission that cannot be read (known entitlement, unknown contents), which differs from "no permission" (no row, or the row names nothing). Toolset resolution raises the same error when declared toolsets yield no grants, and the caller turns that into a deny, not allow-all. MCP_ALL_TOOLS_WILDCARD means tool-level unrestricted for that level.

  Server and tool resolution per level is not here: B4669 owns key and team, B4670 owns the org, end-user, user and agent ceilings.
scope:
  paths:
    - crates/betterlite-mcp/src/auth.rs
    - crates/betterlite-mcp/src/auth/**
    - tools/oracle/helpers/b4668.py
