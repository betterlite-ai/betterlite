deviations:
  - what: >-
      betterlite does not persist the complete LiteLLM_ObjectPermissionTable type with all
      field types and validation; it marshals only the permission fields that betterlite
      needs (mcp_servers, mcp_access_groups, mcp_tool_permissions, mcp_toolsets).
    why: >-
      LiteLLM's type carries many unrelated fields (cost limits, team management, etc.);
      betterlite's table only needs the MCP-specific fields for this auth path.

out_of_scope:
  - "get_mcp_server_access: orchestration function that calls multiple hydration levels; owned by B4671"
  - "reload_admitted_user, reload_admitted_principal: session/envelope admission and policy reload (bridge token flows); owned by B4673"
  - "resolve_admitted_subject_servers, admitted_source_grants: orchestration of sources and union of per-team grants for keyless subjects; owned by B4671"
  - "_roster_team_object: checks roster membership for admitted subject sources; owned by B4671"
  - "attributing_source_for_server: determines which source bills for a call to a server; owned by B4671"
  - "_admitted_subject_team_rpm_limits: gathers per-team rate-limit metadata for admitted subjects; owned by B4671"
  - "resolve_admitted_subject_tools: orchestration of admitted subject tool access; owned by B4672"
  - "agent_caller_auth is owned by B4778; managed_agent_policy and managed_agent_tools are owned by B4772"
  - "The no-mcp-servers sentinel and its early return: owned by B4669"
  - "Server and tool ceilings (_get_allowed_mcp_servers_for_org, _for_end_user, _for_user, get_allowed_mcp_servers_for_agent, _apply_primary_org_ceiling, _apply_user_server_ceiling, apply_agent_caller_ceiling, _user_places_mcp_ceiling, admin_view_unscoped, _agent_capped_servers, _get_agent_access_group_server_ceiling, the five tool ceilings and get_agent_tool_permissions_for_server): owned by B4670"
  - "Tool access control beyond permission resolution (tool_is_granted): owned by B4672"
  - "Access group resolution (_get_mcp_servers_from_access_groups): owned by B735"
  - "Tool permission expansion (global_mcp_server_manager.expand_tool_permissions): owned by B136"
  - "Toolset resolution (global_mcp_server_manager.resolve_toolset_tool_permissions): owned by B136"
  - "Key and team server resolution (_get_allowed_mcp_servers_for_key, _get_allowed_mcp_servers_for_team, _allowed_mcp_servers_for_single_team) and the fail-closed handling for the key path: owned by B4669"

pitfalls:
  - "For a principal row, UnloadableEntitlementError comes only from _load_named_object_permission, when a principal row NAMES an object_permission_id that fails to load; it is the signal to deny (union operator will convert it to deny for that principal). Swallowed read failures (main auth's get_object_permission path) mean the field is unhydrated, not that the permission is absent."
  - "_load_named_object_permission is the one place a principal row mints UnloadableEntitlementError, so the org, end-user and agent paths call it for DB loads and every handler uses that error to decide fail-open/closed consistently."
  - "A permission row naming nothing (object_permission_id is None or falsy) is different from an unreadable permission row (names an id but read fails); the first returns None, the second raises UnloadableEntitlementError."
  - "Team's object_permission is pre-loaded by get_team_object in the main auth flow; _get_team_object_permission just returns it without fetching again (team row does not have its own unhydrated path)."
  - "Keyless admitted subjects resolve per-team: each source has its own team_id and org_id, so org ceilings must be resolved per source (owner by later task); key auth uses one team_id and one org_id."
  - "Toolset grants are resolved once (not per-server) and cached; _toolset_tool_permissions raises UnloadableEntitlementError when declared but no grants result, so the caller converts this to deny not allow-all."
  - "MCP_ALL_TOOLS_WILDCARD makes a level tool-unrestricted; it is checked in _union_tool_grants before combining direct and toolset grants."
  - "Access group expansion (names/aliases to server ids) is not betterlite's job here; caller expands names to IDs before passing to this scope."
  - "When object_permission_id is unhydrated in key auth, _key_object_permission_hydrated loads it; org, end-user and agent inline the same load via _load_named_object_permission; the user path doesn't."
  - "Expose _key_object_permission_hydrated, _get_key_object_permission and _toolset_tool_permissions as pub(crate) items. B4669 owns the key and team server functions (_get_allowed_mcp_servers_for_key, _get_allowed_mcp_servers_for_team, _allowed_mcp_servers_for_single_team) and calls these three."

review_level: security
