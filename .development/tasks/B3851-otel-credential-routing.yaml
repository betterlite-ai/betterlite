id: B3851
title: OTel credential routing and destination resolution
description: >-
  Build the other four vendor presets (agentops, newrelic, signoz, langfuse), the preset registry with the per-request routing functions, and the tenant destination resolver, in betterlite-logging under `otel/presets/`. B3850 already built the `Preset` trait and `PresetError` (`presets/base.rs`), `ensure_mappers` and `credential_gated_exporters` (`presets/utils.rs`), the arize, phoenix, levo, weave and langtrace presets, and the dynamic header builders `arize_dynamic_headers`, `weave_dynamic_headers` and `phoenix_project_headers`, which take a `&BTreeMap<String, String>`. This task calls them and never rebuilds them.

  Every preset is a unit struct that implements `Preset`: `fn build(&self, env: &dyn EnvironmentLookup, base: Settings, allow_missing_credentials: bool) -> Result<Settings, PresetError>`. `EnvironmentLookup` is the trait in crates/betterlite-config/src/loader.rs and nothing in this task reads `std::env`. `Settings` is the V2 settings type of B3842 (`otel/config.rs`) and has no `Default`, so the caller builds the base. A preset returns a changed copy of the base: it appends its exporter after the existing ones and never removes or reorders them. Environment names are read in upper case only.

  `presets/agentops.rs`, struct `AgentopsPreset`. It reads AGENTOPS_API_KEY, AGENTOPS_SERVICE_NAME (default `agentops`) and AGENTOPS_ENVIRONMENT. It appends `ExporterSpec { kind: "agentops", endpoint: Some("https://otlp.agentops.ai/v1/traces"), owner: Some(ExporterOwner::Agentops), options: Some({"api_key": key}) only when the key is non-empty, ..default }`. The resource attributes are the base ones with `service.name` set to the service name, `telemetry.sdk.name` set to `agentops`, and `deployment.environment` added only when AGENTOPS_ENVIRONMENT is non-empty; these three win over the same keys in the base. An empty AGENTOPS_SERVICE_NAME stays empty (only an unset one gets the default). It does not change `mapper_names`, does not touch `Settings.deployment_environment`, and does no network call. It cannot fail.
  The `agentops` exporter kind is not one of the built-in kinds, so this file also builds `pub fn agentops_exporter_factory(clients: &HttpClients) -> ExporterFactory` (types from `otel/plumbing/exporters.rs`, B3848) and `pub const AGENTOPS_EXPORTER_KIND: &str = "agentops"`. The architect's assembly code puts the factory in the `custom` map of `ExporterFactories::new` under that kind. The factory builds the normal OTLP/HTTP protobuf span exporter (`SpanSink::Otlp`) with the spec's endpoint used exactly as given (no `/v1/traces` rewrite), on top of a wrapper around `clients.traces` that implements `opentelemetry_http::HttpClient` (copy the shape of `ConfiguredHeadersClient` in `plumbing/exporters/header_rewrite.rs`). The wrapper mints the JWT lazily on the first `send_bytes`, not at build time: when `options["api_key"]` is set it POSTs `{"api_key": "<key>"}` to `https://api.agentops.ai/v3/auth/token` through the same inner client with headers `Content-Type: application/json` and `Connection: keep-alive`, under a 10 second `tokio::time::timeout`. A 200 response whose JSON has a non-empty string `token` makes every later request carry `Authorization: Bearer <token>`. Any other outcome (no key, timeout, non-200, bad JSON, no token) logs a debug line `AgentOps JWT fetch failed: <reason>` and sends the request without the header. The attempt happens at most once per exporter, success or failure, and concurrent first exports share it (a `tokio::sync::OnceCell` field; add the `sync` feature to the `tokio` dependency in Cargo.toml).

  `presets/newrelic.rs`, struct `NewrelicPreset`. It reads NEW_RELIC_LICENSE_KEY, NEW_RELIC_REGION and NEW_RELIC_AI_MONITORING_RECORD_CONTENT_ENABLED. The region table is `us` -> `https://otlp.nr-data.net` and `eu` -> `https://otlp.eu01.nr-data.net`, exported as `pub fn newrelic_endpoint_for_region(region: &str) -> Option<&'static str>` (a proxy config validator reads the table, so keep it public). The preset lowercases `NEW_RELIC_REGION or "us"` and falls back to the US endpoint for an unknown region without any log line. It appends `ExporterSpec { kind: "otlp_http", endpoint, headers: Some("api-key=<key>") only when the key is non-empty, owner: Newrelic, requires_headers: true, ..default }` and appends mapper `genai` through `ensure_mappers`. When the record-content variable is set it also sets `capture_message_content` to `SpanOnly` for a true value and `NoContent` for a false one; when unset it leaves the base value. The value is read like pydantic reads a bool: `1 true t yes y on` are true and `0 false f no n off` are false, case-insensitive, and anything else (the empty string included) fails the preset with `NewrelicPresetError::RecordContent { value }`.
  Two dynamic functions take a `&BTreeMap<String, String>` of the request's dynamic parameters. `newrelic_dynamic_headers` returns `{"api-key": <newrelic_api_key>}` when that parameter is non-empty, else an empty map. `newrelic_dynamic_endpoint` returns a `String` and never falls through to the operator's region: no `newrelic_region` gives the US endpoint, a known region (any case) gives its endpoint, and an unknown one logs the warning `New Relic: unknown newrelic_region '<value>'; supported regions: eu, us. Using the default (US) endpoint.` and gives the US endpoint.

  `presets/signoz.rs`, struct `SignozPreset`, plus `pub const SIGNOZ_INGESTION_ENDPOINT_ENV: &str = "SIGNOZ_INGESTION_ENDPOINT"`. It reads that variable and SIGNOZ_INGESTION_KEY. It appends `ExporterSpec { kind: "otlp_http", endpoint: <variable value as is, Some("") stays Some("")>, headers: Some("signoz-ingestion-key=<key>") when the key is non-empty, owner: Signoz, requires_headers: <key is non-empty>, ..default }` and mapper `genai`. It cannot fail, and a missing endpoint is not an error here. `signoz_dynamic_endpoint(params, allowed_hosts)` returns `Option<String>`: `None` unless `signoz_ingestion_endpoint` is non-empty and starts with `http://` or `https://`; then `None` (with the warning `SigNoz: not exporting to key/team endpoint '<endpoint>'. Set signoz_ingestion_key alongside it; a keyless collector needs the global callback`) when `signoz_ingestion_key` is empty; then `None` (warning `SigNoz: not exporting to key/team endpoint '<endpoint>'. Add its host to litellm_settings.provider_url_destination_allowed_hosts to permit it`) when B009's destination check rejects the endpoint against `allowed_hosts`; else the endpoint. `signoz_dynamic_headers(params, allowed_hosts)` returns an empty map when `signoz_ingestion_key` is empty, or when `signoz_ingestion_endpoint` is non-empty but `signoz_dynamic_endpoint` gives `None` for it (including a non-http scheme); else `{"signoz-ingestion-key": <key>}`.

  `presets/langfuse.rs`, struct `LangfusePreset`. The Langfuse environment and header logic belongs to B3910 (`crates/betterlite-logging/src/langfuse_otel.rs`): its host resolver (LANGFUSE_OTEL_HOST, then LANGFUSE_HOST), `get_langfuse_otel_config` (fails when LANGFUSE_PUBLIC_KEY or LANGFUSE_SECRET_KEY is missing), the Basic authorization header, the header set `Authorization` plus `x-langfuse-ingestion-version: 4`, the formatted header string and `LANGFUSE_CLOUD_US_ENDPOINT`. Read B3910's merged code for the exact Rust names and call them; do not copy them. The preset first computes the mappers as `ensure_mappers(base.mapper_names, "langfuse")`. Then it calls `get_langfuse_otel_config`. On success it appends `ExporterSpec { kind: "otlp_http", endpoint: <config endpoint>, headers: <config header string>, owner: LangfuseOtel, ..default }`. On failure with `allow_missing_credentials` false it returns the error (add a `Langfuse` variant with `#[from]` for B3910's error to `PresetError` in `presets/base.rs`, and the same for `NewrelicPresetError`). On failure with it true it returns the base with the new mappers and `credential_gated_exporters(base.exporters, ExporterOwner::LangfuseOtel)`. `langfuse_dynamic_headers(params)` returns B3910's header set built from `langfuse_public_key` and `langfuse_secret_key` when both are non-empty, else an empty map.

  `presets.rs` is the registry (the `__init__.py` of LiteLLM) and sits above B3850's preset files. `pub fn preset_for(callback_name: &str) -> Option<&'static dyn Preset>` maps `agentops`, `arize`, `arize_phoenix` (phoenix), `langfuse_otel`, `langtrace`, `levo`, `newrelic`, `signoz` and `weave_otel` to the nine presets and any other name to `None`. The routing functions all take the callback name as `Option<&str>` (None counts as the empty name, which matches nothing) and the dynamic parameters as `&StandardCallbackDynamicParams` (the `Json` alias in betterlite-models). A private conversion turns that `Json` object into a `BTreeMap<String, String>` that keeps only string values and drops everything else; a value that is not an object gives an empty map.
  `dynamic_otlp_headers(callback_name, dynamic_params, allowed_hosts) -> Option<BTreeMap<String, String>>` uses the builder table arize -> `arize_dynamic_headers`, langfuse_otel -> `langfuse_dynamic_headers`, newrelic -> `newrelic_dynamic_headers`, signoz -> `signoz_dynamic_headers`, weave_otel -> `weave_dynamic_headers`. It returns `None` for a callback without a builder, for empty parameters, and when the builder returns an empty map. `dynamic_otlp_endpoint(callback_name, dynamic_params, allowed_hosts) -> Option<String>` uses newrelic (`newrelic_dynamic_endpoint`, always `Some`) and signoz (`signoz_dynamic_endpoint`); other callbacks and empty parameters give `None`. `project_routing_headers(callback_name, auth_metadata: Option<&BTreeMap<String, String>>) -> BTreeMap<String, String>` calls `phoenix_project_headers` for `arize_phoenix` and returns an empty map for every other name. The parameters it takes for project routing come from key and team config the proxy resolved, never from request metadata, so it gets its own function and table and is never merged into `dynamic_otlp_headers`. `allowed_hosts` is the operator's `provider_url_destination_allowed_hosts` list, in the form B009's check function takes it (parsed from `config.sections.provider_url_destination`). The caller passes it in; nothing here reads config.

  `presets/destinations.rs` turns a key's or team's callback variables into an `OtelDestination` (`otel/config/destination.rs`, B3842). `pub fn destination_capable_backends() -> BTreeSet<&'static str>` is the names that have both a destination resolver and a dynamic header builder: `langfuse_otel`, `arize`, `weave_otel`, `newrelic`. `pub fn destination_for(env: &dyn EnvironmentLookup, allowed_hosts, callback_name: &str, params: &StandardCallbackDynamicParams, service_name: Option<&str>) -> Option<OtelDestination>` does this, in order. A name outside that set gives `None`. It builds the headers with the callback's dynamic builder; empty headers, or headers missing one of the required names, give `None`. Required names: langfuse_otel `Authorization`; arize `arize-space-id` and `api_key`; weave_otel `Authorization` and `project_id`; newrelic `api-key`. Then it resolves the endpoint and protocol; `None` from there gives `None`. The result has that endpoint, the headers, `resource_attributes` of `{"service.name": <service_name>}` only when the name is non-empty, `callback_name` set, the protocol, and `span_scope` `LlmOnly` when the callback is `langfuse_otel` and parameter `langfuse_span_scope` is `llm_only` (every other case `Full`).
  Endpoint rules per callback. langfuse_otel: tenant host is parameter `langfuse_host` when non-empty; host is the tenant host, else B3910's host resolver on `env`. No host gives US cloud (`LANGFUSE_CLOUD_US_ENDPOINT`). Otherwise add `https://` unless the host starts with `http`, strip trailing slashes, add `/api/public/otel`. A tenant host must pass B009's destination check on the final endpoint or the result is `None` with the warning `OTel V2: not exporting to key/team Langfuse host '<host>'. Add it to litellm_settings.provider_url_destination_allowed_hosts to permit it`; the operator's own host is never checked. The protocol is `None`. arize: `ArizeConfig::from_env(env)` (B3850); endpoint and protocol kind string (`otlp_grpc` or `otlp_http`) come from it, and the request's parameters are ignored. weave_otel: `weave_otel_endpoint(env.lookup("WANDB_HOST"))` (B3850), protocol `None`. newrelic: `newrelic_dynamic_endpoint(params)`, protocol `None`.
