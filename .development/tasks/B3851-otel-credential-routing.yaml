deviations:
  - what: >-
      The three allowlist warnings (Langfuse host, SigNoz host, SigNoz endpoint without key) are logged on every call. LiteLLM wraps each in an lru_cache of 128, so a given host or endpoint is logged once.
    why: Rule `no module-level state` leaves no place for the cache. The text of each warning is the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/presets/destinations.py#L25-L32
  - what: >-
      The AgentOps exporter fetches its JWT through the proxy's own HTTP client for OTLP traffic (`HttpClients.traces`, with its TLS policy and proxy settings) inside an async send. LiteLLM opens a separate blocking httpx client with a 10 second timeout in the batch worker thread. The 10 second timeout, the request body, the headers and the once-only attempt are the same.
    why: A Rust export is already async and off the request path, and a second client would skip the TLS and proxy policy of the first.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/presets/agentops.py#L120-L133
  - what: >-
      The AgentOps exporter does not read OTEL_EXPORTER_OTLP_HEADERS, OTEL_EXPORTER_OTLP_TIMEOUT or the certificate variables. LiteLLM builds the stock Python OTLPSpanExporter, which reads them.
    why: Rule `no reading the environment outside the config crate`; B3842 makes the same choice for the certificate variables.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/presets/agentops.py#L102-L117
  - what: >-
      Environment names are read in upper case only (NEW_RELIC_*, AGENTOPS_*, SIGNOZ_*). LiteLLM reads them through pydantic-settings with case_sensitive=False, so a lower-case spelling also works there.
    why: Environment names on Linux are case-sensitive and every documented spelling is upper case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/presets/newrelic.py#L32-L41
out_of_scope:
  - "Preset, PresetError, ensure_mappers, credential_gated_exporters, is_unconfigured_placeholder, the arize, phoenix, levo, weave and langtrace presets, arize_dynamic_headers, weave_dynamic_headers, phoenix_project_headers, ArizeConfig, weave_otel_endpoint: B3850. This task only adds two variants to PresetError."
  - "Everything in litellm/integrations/langfuse/langfuse_otel.py (host resolver, config getters, authorization header, header set, header formatting, dynamic config, constants): B3910. The preset and the resolver call it."
  - "LangfuseSpanAttributes and LangfuseOtelConfig in litellm/types/integrations/langfuse_otel.py: the file is removed from this entry's covers. LangfuseOtelConfig has no caller at the pin, and LangfuseSpanAttributes is used only by langfuse_otel.py, so B3909 owns the enum (see the architect note)."
  - "register_exporter_factory and the process-wide factory registry: B3848 builds ExporterFactories with an explicit map. This task builds the agentops factory and the assembly code inserts it."
  - "is_url_destination_allowed_by_host and the allowlist config: B009."
  - "The per-request tracer cache, TenantRoute and the code that calls dynamic_otlp_headers, dynamic_otlp_endpoint and project_routing_headers: B3852. The proxy code that calls destination_for with a key's callback variables, and the callback validator that reads the New Relic region table: the proxy tasks."
  - "_maybe_construct_otel_v2 and the legacy SigNoz/AgentOps/Langfuse logger paths in litellm_logging.py: B3868."
pitfalls:
  - "The AgentOps JWT is never fetched while the preset builds. A fetch there would block the proxy's startup, and the exporter factory exists only to move it to the first export."
  - "AgentOps `project.id` is not a resource attribute. The JWT carries the project, so do not add one."
  - "NEW_RELIC_REGION is lowercased in the preset but an unknown value is silent there; only newrelic_dynamic_endpoint logs. Do not add a warning to the preset."
  - "newrelic_dynamic_endpoint never returns None and never reads the operator's NEW_RELIC_REGION, so a team that saved only its key is sent to the US endpoint even when the operator runs EU."
  - "The SigNoz preset sets requires_headers from the key, while the New Relic preset sets it to true always. Copying one into the other changes which exporters credential gating drops."
  - "SIGNOZ_INGESTION_ENDPOINT is passed through as is: the legacy path adds `/v1/traces`, this preset does not, and an empty value becomes Some(\"\"), not None."
  - "A SigNoz tenant endpoint that is set but unusable (no http scheme, no key, not allowlisted) also empties signoz_dynamic_headers, so the key alone is never sent to the operator's collector."
  - "SigNoz has dynamic headers and a dynamic endpoint but no destination resolver, so it is not destination capable and destination_for returns None for it."
  - "Langfuse computes the mapper list before reading credentials, so the gated branch still gets mapper langfuse."
  - "destination_for checks the required header names after the builder runs. Arize with only api key set builds `api_key` but not `arize-space-id`, so the destination is None."
  - "destination_for resolves the Arize destination from the operator's ARIZE_* variables, not from the request's parameters. Only the headers are per-tenant."
  - "A tenant Langfuse host must pass the allowlist after `https://` and `/api/public/otel` are added, so the allowlist entry matches the host, not the full path."
  - "project_routing_headers takes key and team metadata the proxy set. It must never receive the dynamic parameters, which clients can influence."
