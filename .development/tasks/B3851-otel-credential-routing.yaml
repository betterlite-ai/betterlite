dod:
  - text: >-
      AgentopsPreset appends one `agentops` exporter at https://otlp.agentops.ai/v1/traces with owner Agentops, puts api_key in options only when AGENTOPS_API_KEY is non-empty, sets service.name (default agentops, empty value kept), telemetry.sdk.name and deployment.environment (only when non-empty) over the base attributes, and leaves mapper_names alone.
    proof: [agentops-tests, helper-python]
  - text: >-
      The agentops exporter factory builds an OTLP/HTTP exporter whose first export fetches the JWT once (POST with the api_key body to the auth URL) and sends Authorization Bearer on that and every later request. A failed fetch, a missing key or a missing token sends requests without the header and is never retried.
    proof: [agentops-tests]
  - text: >-
      NewrelicPreset picks the endpoint from NEW_RELIC_REGION (case-insensitive, unknown or unset gives US with no log), sets headers only when the key is non-empty and requires_headers always, appends mapper genai once, and sets capture_message_content from the record-content flag only when it is set. An unparsable flag value returns the error.
    proof: [newrelic-tests, helper-python]
  - text: >-
      newrelic_dynamic_headers returns the api-key header only for a non-empty newrelic_api_key. newrelic_dynamic_endpoint returns the team region's endpoint, US when the region is unset, and US with the warning for an unknown region, never the operator's region.
    proof: [newrelic-tests, helper-python]
  - text: >-
      SignozPreset appends one otlp_http exporter with the variable's endpoint unchanged, the key header and requires_headers only when the key is non-empty, and mapper genai once. signoz_dynamic_endpoint and signoz_dynamic_headers refuse a tenant endpoint that has no http or https scheme, no key, or a host outside allowed_hosts, and then return no endpoint and no headers.
    proof: [signoz-tests, helper-python]
  - text: >-
      LangfusePreset appends mapper langfuse and an otlp_http exporter with owner LangfuseOtel built from B3910's config. Missing keys return the error when allow_missing_credentials is false, and return the base with the mapper and a gated exporter (owner LangfuseOtel, requires_headers true, placeholder dropped) when it is true. langfuse_dynamic_headers needs both dynamic keys.
    proof: [langfuse-tests, helper-python]
  - text: >-
      preset_for maps exactly the nine callback names to their presets. dynamic_otlp_headers and dynamic_otlp_endpoint return None for unsupported callbacks, empty parameters and empty results, and ignore non-string parameter values. project_routing_headers answers only for arize_phoenix.
    proof: [registry-tests, helper-python]
  - text: >-
      destination_capable_backends is exactly langfuse_otel, arize, weave_otel and newrelic. destination_for returns None for any other name, for headers that are empty or lack a required name, and for a tenant Langfuse host outside allowed_hosts, and it never checks the operator's own host.
    proof: [destinations-tests, helper-python]
  - text: >-
      destination_for builds the Langfuse, Arize, Weave and New Relic endpoints and protocols by the rules in the description, adds service.name only for a non-empty service name, and sets span scope LlmOnly only for langfuse_otel with langfuse_span_scope llm_only.
    proof: [destinations-tests, helper-python]
checks:
  optional: [mutants]
  commands:
    - id: agentops-tests
      why: AgentOps preset or lazy JWT exporter tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::agentops::/)'
    - id: newrelic-tests
      why: New Relic preset and dynamic function tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::newrelic::/)'
    - id: signoz-tests
      why: SigNoz preset and dynamic function tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::signoz::/)'
    - id: langfuse-tests
      why: Langfuse preset tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::langfuse::/)'
    - id: registry-tests
      why: Registry and routing function tests fail or do not exist, or PresetError tests of B3850 broke
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::(tests|base)::/)'
    - id: destinations-tests
      why: Destination resolver tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::destinations::/)'
    - id: helper-python
      why: Preset, routing and destination results must match LiteLLM run on the same environment
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/otel-routing)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3851::/)'
