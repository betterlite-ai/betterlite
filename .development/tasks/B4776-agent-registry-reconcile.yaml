  - tools/oracle/cases/agent-registry/ids-for-agent-and-stable-id.yaml
  - tools/oracle/cases/agent-registry/public-list-legacy-alias.yaml
  - tools/oracle/cases/agent-registry/deregister-removes-all-by-name.yaml
deviations:
  - what: The registry and the reconcile lock are fields of one AgentRegistry value that the server builds and passes around, not module globals (`global_agent_registry`, `AGENT_RECONCILE_LOCK`). Callers take the lock through `reconcile()`.
    why: betterlite wires dependencies through constructors and keeps no module-level state. Behavior is the same since every LiteLLM user takes the one registry and the one lock.
  - what: get_public_agent_list takes the public group list as an argument instead of reading `litellm.public_agent_groups`.
    why: There is no settings global in betterlite. The caller passes the loaded `litellm_settings.public_agent_groups`.
  - what: Database agents arrive as typed AgentResponse values, so LiteLLM's "db_agents must be a list of dictionaries" error cannot happen. Config entries arrive as JSON values and a non-object entry returns "agent_config must be a list of dictionaries", the same text.
    why: A typed boundary replaces the runtime isinstance check. The config entry stays raw because the legacy id hashes every field of it.
  - what: A config entry with a key AgentResponse does not have, or that already holds `agent_id`, fails with an error that names the key. LiteLLM ignores unknown keys, and a duplicate `agent_id` raises a Python TypeError.
    why: B4770's records reject unknown fields. The legacy id still covers the full raw entry, so ids stay the same as LiteLLM's for entries both accept.
  - what: Integers outside the i64 and u64 range in a config entry are rejected when computing the legacy id.
    why: serde_json::Value cannot hold them. YAML configs do not use them for agent fields.
  - what: The lookups cannot fail, so LiteLLM's `except Exception` wrappers that re-raise a generic "Error getting agent from DB" error are not built.
    why: Nothing inside those try blocks can raise in Rust, and the message was never reachable by a caller at the pin.
out_of_scope:
  - "B4777 owns add_agent_to_db, delete_agent_from_db, patch_agent_in_db, update_agent_in_db, get_all_agents_from_db, _permission_write, _managed_fields, _patched_access_group_ids, _patched_kill_switch and the AgentRecord, AgentTableClient and AgentIdWhere protocols."
  - "B4775 owns redact_sensitive_agent_litellm_params, parse_agent_litellm_params, parse_agent_kill_switch, serialize_agent_kill_switch and the _restore_redacted_* functions."
  - "agents_table and object_permission_table are repository accessors. B726 owns the agentstable and objectpermissiontable bindings that replace them."
  - "Reading the `agents` and `agent_list` config keys and calling load_agents_from_config at startup (proxy_server.py L7060-L7066) has no owner yet. See the notes."
  - "Spawning run_grant_id_migration at startup belongs to B8374, the periodic _init_agents_in_db reload to B8384 and the read-through resync (registry_read_through._resync_agents) to B8231. They call this task's methods."
  - "AgentResponse and AgentConfig records are B4770. Cache invalidation after a config sync is not part of the registry."
pitfalls:
  - The legacy id hashes the raw entry exactly as loaded, so the serializer must not drop null values, reorder lists (only object keys are sorted) or normalize numbers. `1` and `1.0` give different ids.
  - Python's ensure_ascii escapes DEL (0x7F) as `\u007f` and writes hex digits in lowercase. A serializer that copies serde_json's escaping gets both wrong.
  - Float text follows Python's repr, not Rust's. `1e16` is `1e+16`, `0.00001` is `1e-05`, `100000.0` stays `100000.0`, and a float that is a whole number keeps `.0`.
  - The legacy map is built from every entry with a name and card params, before the collision skip, so an entry shadowed by a database agent still has its legacy id mapped to the stable id of its name.
  - Two config entries with the same name give two legacy ids that both map to one stable id, and only the first entry is registered.
  - Calling load_agents_from_config with None leaves everything alone but an empty slice clears the remembered config agents and the legacy map. Do not collapse the two into one empty check.
  - load_agents_from_db_and_config resets the list before it registers anything, and the reconcile lock is the caller's job. Do not take the lock inside the method or the server's reload deadlocks.
  - The migration only selects ids where legacy differs from stable, but the per-row mapping runs stable_agent_id over every id in the array, so an id that is already stable passes through unchanged and an unknown id is kept.
  - The write's `agents = $snapshot` compares arrays in order. A reordered array counts as a concurrent edit and ends up in missed.
  - deregister_agent matches agent_name, not agent_id. Access group code deregisters by name and registers a modified copy, so ids can repeat for a moment.
  - get_agent_by_id tries the exact id before the legacy translation, so a legacy id that equals some other agent's real id returns that other agent.
review_level: security
