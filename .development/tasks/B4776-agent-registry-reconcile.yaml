dod:
  - text: The stable id is the lowercase hex sha256 of the UTF-8 agent_name, and the legacy id is the lowercase hex sha256 of the Python-compatible sorted json.dumps of the whole entry.
    proof: [ids-tests, oracle-cases]
  - text: The Python-compatible serializer escapes non-ASCII and DEL as lowercase \uXXXX (surrogate pairs above U+FFFF), sorts keys by code point at every depth, uses the comma-space and colon-space separators, and writes floats, NaN and Infinity as Python does.
    proof: [json-compat-tests, oracle-cases]
  - text: ids_for_agent returns the id plus every legacy id mapped to it, and stable_agent_id maps a known legacy id to its stable id and leaves any other id unchanged.
    proof: [ids-tests, oracle-cases]
  - text: load_agents_from_config registers entries with the stable id in order, skips entries with an empty agent_name or empty agent_card_params, skips an entry whose name is already registered, and does nothing for None.
    proof: [config-load-tests, oracle-cases]
  - text: A config list holding a non-object entry returns "agent_config must be a list of dictionaries" and leaves the remembered config agents, legacy map and agent list unchanged.
    proof: [config-load-tests]
  - text: load_agents_from_config builds the legacy map from every entry with a name and card params, including an entry skipped for a name collision, and an empty slice clears the remembered config agents.
    proof: [config-load-tests, oracle-cases]
  - text: load_agents_from_db_and_config registers database agents first, so a config entry with the same name is dropped, and falls back to the remembered config agents when no config is given.
    proof: [reload-tests, oracle-cases]
  - text: register_agent allows duplicates, deregister_agent removes every agent with the name, get_agent_list filters by names in list order, and get_public_agent_list returns nothing for None groups and matches legacy aliases for Some.
    proof: [registry-ops-tests, oracle-cases]
  - text: get_agent_by_id matches an exact id first, then a legacy id through the map, then returns None, and get_agent_by_name returns the first match.
    proof: [lookup-tests, oracle-cases]
  - text: The reconcile lock serializes two tasks that each hold the guard across a read and a register, and the registry methods work without taking it.
    proof: [reconcile-lock-tests]
  - text: migrate_legacy_grant_ids returns (0, 0) without a query when no legacy id differs from its stable id, and otherwise rewrites object_permission.agents rows that hold a legacy id to stable ids with duplicates removed and order kept.
    proof: [grant-migration-tests]
  - text: A row whose agents array changed between the read and the write is left untouched and counted in missed, and a second run after a clean first run rewrites nothing.
    proof: [grant-migration-tests]
  - text: run_grant_id_migration stops after a pass with missed 0, makes at most 3 attempts with a 5 second pause between them, logs the three texts, and swallows database errors.
    proof: [migration-retry-tests]
checks:
  optional: []
  commands:
    - id: ids-tests
      why: stable id, legacy id, ids_for_agent or stable_agent_id are missing or wrong
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::ids::/)'
    - id: json-compat-tests
      why: the Python-compatible json.dumps serializer is missing or differs from Python on a covered value
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::python_json::/)'
    - id: config-load-tests
      why: loading config agents does not register, skip, validate or remember entries as LiteLLM does
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::config_load::/)'
    - id: reload-tests
      why: the database plus config rebuild has the wrong order or loses config agents
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::reload::/)'
    - id: registry-ops-tests
      why: register, deregister, list filters or the public list are missing or wrong
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::registry_ops::/)'
    - id: lookup-tests
      why: get_agent_by_id or get_agent_by_name does not resolve exact, legacy and missing ids
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::lookup::/)'
    - id: reconcile-lock-tests
      why: the reconcile lock does not serialize two holders
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::reconcile_lock::/)'
    - id: grant-migration-tests
      why: the grant rewrite or its compare-and-swap write is missing or wrong against real Postgres
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::grant_migration::/)'
    - id: migration-retry-tests
      why: the startup retry loop does not stop, pause, log or swallow errors as specified
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_registry::migration_retry::/)'
    - id: oracle-cases
      why: the registry ids, loads and lookups differ from LiteLLM's on the same input
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/agent-registry)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::auth::b4776::/)'
