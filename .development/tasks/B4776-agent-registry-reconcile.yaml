id: B4776
title: Reconcile agent registry entries and migrate stable grant ids
description: >-
  Build the in-memory agent registry and the one-time grant id migration in crates/betterlite-auth, module agent_registry. The registry holds the agents the proxy serves right now: the rows read from the database plus the agents declared in config.yaml under `agents` (alias `agent_list`). It also remembers how to turn an old config-agent id into the new one, so a key or team that stored the old id keeps working.

  Two ids exist for a config agent. The stable id is the lowercase hex sha256 of the agent_name bytes (UTF-8). The legacy id is the lowercase hex sha256 of Python's `json.dumps(entry, sort_keys=True)` over the whole raw config entry, secrets included, so it changes whenever a field of the entry changes. Grants (`object_permission.agents` rows) written before the stable id existed hold legacy ids. The legacy id must be byte-identical to LiteLLM's, because it is compared with ids already stored in databases. Write a small serializer in agent_registry/python_json.rs that takes a serde_json::Value and emits exactly what Python emits: separators `, ` and `: `, keys sorted by code point (Rust String order is the same as code point order), ensure_ascii on (every char outside 0x20..0x7E becomes `\uXXXX` in lowercase hex, with a surrogate pair above U+FFFF, and 0x7F is escaped too), the short escapes `\"`, `\\`, `\n`, `\r`, `\t`, `\b`, `\f`, integers as digits, floats as Python repr (shortest round-trip digits, `1.0` for whole values, exponent form only below 1e-4 or from 1e16, written like `1e+16`, `1e-05`, `1.5e-07`), `NaN`, `Infinity`, `-Infinity`, `true`, `false`, `null`. Get the shortest digits from Rust's `{:e}` float formatting and lay them out by Python's rule. No crate does this, which is why it is written here.

  AgentRegistry is a struct built once by the server and passed to its users (no static). It owns an RwLock around its state (agent list, config entries, legacy-to-stable map) and a tokio Mutex called the reconcile lock, handed out by `reconcile()` as a guard. The database reload and the read-through resync each take that guard around their read-then-register sequence. The registry methods never take it themselves. The public group list (`litellm_settings.public_agent_groups`, an optional list of ids, default none) is not read here: `get_public_agent_list` takes it as an argument.

  Methods, with LiteLLM's names:
  - `register_agent(AgentResponse)` appends, and duplicates are allowed. `deregister_agent(name)` removes every agent with that agent_name. `reset_agent_list()` empties the list.
  - `get_agent_list(names: Option<&[String]>)` returns clones in list order; with names it keeps only agents whose name is in the slice (an empty slice returns nothing).
  - `ids_for_agent(id)` returns the set of the id plus every legacy id whose stable id equals it. `stable_agent_id(id)` returns the mapped stable id, or the id itself when it is not a known legacy id.
  - `get_public_agent_list(public_agent_groups: Option<&[String]>)` returns nothing for None, otherwise every agent whose `ids_for_agent(agent_id)` shares at least one id with the groups.
  - `load_agents_from_config(Option<&[serde_json::Value]>)`. None changes nothing. Some first checks that every entry is a JSON object and returns the error "agent_config must be a list of dictionaries" if one is not, before touching state. Then it stores the entries as the remembered config agents (an empty slice clears them) and rebuilds the legacy map from every entry that has a non-empty `agent_name` and a non-empty `agent_card_params` (stable id from the name, legacy id from the entry). Then, in order, it registers each such entry as an AgentResponse with `agent_id` set to the stable id, skipping an entry whose name is already registered (so a database row, or an earlier config entry with the same name, wins). Entries with an empty name or empty card params are skipped without error.
  - `load_agents_from_db_and_config(config: Option<&[Value]>, db_agents: Option<&[AgentResponse]>)` resets the list, registers the database agents in order, then calls `load_agents_from_config` with the given config, or with the remembered config agents when None is given. It returns the new list. An error half way leaves the list as it was at that moment (no rollback).
  - `get_agent_by_id(id)` returns the first agent with that exact agent_id. Failing that, if the id is a known legacy id, it returns the first agent with the matching stable id. Otherwise None. `get_agent_by_name(name)` returns the first agent with that name.

  Grant migration: `migrate_legacy_grant_ids` returns GrantMigrationResult { rewritten, missed }. It takes the legacy ids whose legacy id differs from the stable id. With none, it returns (0, 0) and does no query. Otherwise it reads the rows of `LiteLLM_ObjectPermissionTable` whose `agents` array overlaps those ids (SQL `agents && $1`), and for each row computes the new array: every id mapped through `stable_agent_id`, duplicates removed, first-seen order kept. Each row is then written with one `UPDATE ... SET agents = $new WHERE object_permission_id = $id AND agents = $snapshot`, where $snapshot is the array read a moment ago. The writes run together, and their affected row counts add up to `rewritten`. `missed` is the number of rows read minus `rewritten`. A row edited by someone else between read and write is not changed (zero rows affected) and counts as missed. The runtime alias in `ids_for_agent` and `get_agent_by_id` keeps covering it and the next boot tries again. Use the object-permission table binding from B726 and the PostgresStore and DbSession from B700. The two statements live in agent_registry/grant_migration.rs, since B726 has no helper for array overlap or array equality. A database error propagates unchanged.

  Startup retry: `run_grant_id_migration` repeats the migration up to 3 times. After a pass it logs info "Rewrote {n} object_permission rows from legacy config agent ids" when rewritten is above zero and returns when missed is 0. When missed is above zero it logs a warning "Legacy agent grant id migration attempt {attempt}/3 left {missed} rows unmigrated". When the migration returns an error it logs a warning "Legacy agent grant id migration attempt {attempt}/3 failed: {error}" and carries on. Between attempts (not after the third) it waits 5 seconds with tokio::time::sleep, so tests run under tokio's paused clock. It never returns an error. The server spawns it as a background task after the database connects; that wiring is not part of this task.

  LiteLLM's own calls into the registry from other modules (the read-through resync that registers a row under the lock, access group detach that deregisters and registers a copy, display names that call `ids_for_agent`) belong to their owners and use these methods.
