deviations:
  - what: A batch is not rejected with the license-limit-exceeded 403 when it exceeds licensed seats.
    why: README Decisions removes paid-tier user caps; the owned code really calls is_over_limit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/bulk_user_creation.py#L795-L806
out_of_scope:
  - B1222 owns bulk HTTP routes and problem serialization; B2334 owns public request/response contracts.
    B1201 owns shared pending/prepared/team records, row adapters, concurrency constant and user-row
    metadata storage; B893 owns key generation/storage; B797 owns audits; B828 owns org-member writes.
  - 'litellm/proxy/management_helpers/bulk_user_creation.py: B1201 owns _user_table (L260-L261), _user_create_payload
    (L375-L408), _bounded (L411-L418), _insert_users (L421-L469), _assignments_by_team (L472-L484), _default_member_budget_id
    (L501-L510), _team_tx_db (L513-L514), _membership_tx_db (L517-L518), _write_team_roster (L521-L581),
    _detach_failed_teams (L584-L601), _publish_team_writes (L604-L630), _error_message (L185-L192), _row_teams
    (L735-L745).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - The first invalid duplicate still reserves its email, and the database email query does not strip it.
  - success=true can accompany an error; meta.created counts the persisted user, not successful follow-ups.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
