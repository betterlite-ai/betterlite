id: B793
title: Bulk user creation and team roster reconciliation
description: >-
  Implement the injected bulk-create service consumed by B1222 POST /management/v1/users/bulk.
  B2334 owns the 1..500 wire limit, default auto_create_key=false and password/invite rejection;
  this helper itself accepts any sequence, including empty. It does not register a route or
  perform a global caller-role check. Cases empty_batch and request_contract_handoff pin those edges.

  Assign a UUID for every falsey user_id, then record FIRST indexes by ID and normalized email
  (strip().lower() only for truthy email; empty is null, whitespace becomes empty string).
  Later duplicate IDs fail before duplicate emails, before row validation, even if the earlier
  row is itself invalid. Error literals are 'Duplicate user_id in request: {id}' and
  'Duplicate user_email in request: {original_email}'. Cases falsey_id_uuid,
  email_empty_whitespace_case, duplicate_id_before_email and invalid_first_reserves_identity.
  Requested admin/admin-viewer roles require proxy_admin, otherwise return the descriptive
  administrative-user error naming requested/caller roles. Validate budget duration through B861,
  then caller permissions through B892; any exception becomes a row error via B1201's
  HTTP-detail/error extractor. Cases admin_role_row_error and row_validation_error_order.

  Teams select non-null legacy team_id first, including empty string; otherwise explicit teams
  (empty suppresses defaults), otherwise B1226 default teams. Convert strings to records with
  role=user, budget=null, preserve duplicate team IDs and order. Team-resolution exceptions are
  OUTSIDE the per-row validation catch and abort the service. Cases team_selector_precedence,
  explicit_empty_teams, default_team_records and malformed_default_aborts.

  Query sorted requested IDs once and sorted unique ORIGINAL truthy emails once with mode=insensitive;
  normalized input is not used in that email query. Empty pending skips both. Normalize returned
  email rows for comparison, so whitespace-padded input can miss an existing unpadded email.
  Load sorted distinct requested team IDs once, validate rows, then gather B800 TEAM_OR_ORG_ADMIN
  checks. Missing team error is 'Team id={id} does not exist'; denied is 'Call not allowed. User
  not proxy admin OR team admin. team_id={id}'. Query/permission exceptions propagate globally.
  Reject rows in ID-conflict, email-conflict, team-errors order, joining team errors with '; '
  in requested order, including duplicates. Cases set_queries_and_empty_skip,
  original_email_query_spacing, conflict_precedence, unusable_team_errors and preflight_query_failure.

  Count billable users even when none are creatable. Source then rejects the ENTIRE creatable
  batch if LicenseCheck.is_over_limit(existing+creatable), before preparation/writes, with
  ManagementProblem status=403,type=urn:litellm:error:license-limit-exceeded,title='License limit
  exceeded',detail='License is over limit. Please contact support@berri.ai to upgrade your license.'.
  There are no OpenAI param/code fields in that problem. MIT without license data has no cap.
  Betterlite has no paid-tier cap per README; native_bulk_users_no_license_seat_cap proves this
  deliberate difference. Equality cases billable_count_before_prepare and mit_no_license_cap use
  the reachable uncapped MIT branch, not a fabricated premium entitlement.

  Prepare rows SEQUENTIALLY: dump request except user_id, inject assigned ID, apply B790 defaults,
  validate JSON object, call B816 _set_object_permission, validate object and B1201 _UserRow.
  Any failure warns with row index and exception class only, then returns a row failure; a
  permission row written earlier is not rolled back. Cases preparation_serial_order,
  prepare_failure_warns_class and permission_row_survives_prepare_failure. B1201 owns shared
  pending/prepared/user/team records and their field defaults; reuse its extra-ignore row adapter.

  Call B1201 insert-many/fallback, then each locked team write in assignment iteration order,
  detach failed team assignments, and publish team metrics/cache effects. These are separate
  operations, not one transaction; unexpected collaborator failure aborts after earlier writes.
  Only then perform per-user key work, then organization work, then audit reads/writes. Cases
  insert_roster_detach_publish_order, no_global_rollback and followups_after_rosters prove the
  orchestration; B1201 owns insert fallback, roster locking and compensation internals.

  Key work selects truthy auto_create_key, invokes B893 generate_key_helper_fn with
  request_type=key,table_name=key and NON-NULL fields ONLY from this exact include set:
  user_id,team_id,agent_id,duration,key_alias,models,aliases,config,permissions,blocked,spend,
  budget_fallbacks,budget_limits,metadata,max_parallel_requests,tpm_limit,rpm_limit,
  allowed_cache_controls,model_max_budget,model_rpm_limit,model_tpm_limit,mcp_rpm_limit,
  tag_rpm_limit,guardrails,policies,prompts,object_permission_id. In particular max_budget and
  budget_duration are not forwarded. Validate returned token as string; extra fields are ignored.
  B893 owns callback-variable encryption through metadata_json_with_limits before key storage;
  B1201 owns the same user-row metadata projection. Cases key_field_allowlist,
  key_max_budget_not_forwarded, key_response_validation and callback_storage_handoff.

  Per-user work is bounded to BULK_NEW_USER_CONCURRENCY=10 through B1201 _bounded, retaining
  exceptions as outcomes. Organizations for ONE user are added serially in original order,
  preserving duplicates, with OrgMember(role=internal_user), original caller and synthetic path
  /user/bulk_new; first exception stops that user's remaining orgs. Calls use injected B828
  services, never FastAPI wrappers in native code or oracle adapters. Cases concurrency_ten,
  organizations_serial_stop and followup_failure_is_result.

  Audit rereads sorted created IDs once (empty skips), then bounded B797 created audits with
  caller.user_id changed-by, before=null, after=row JSON excluding nulls. Read failures propagate;
  individual audit exceptions warn with class and continue. Cases audit_sorted_reread,
  audit_read_failure_after_writes and audit_row_warning. No background scheduling here.
  Return original input order. Created rows remain success=true even when teams/key/orgs fail:
  error joins team errors, 'Failed to create key: ...', then 'Failed to add user to organizations: ...'.
  Teams lists only landed teams; key is string or null; clean error=null. Failed rows have
  success=false,teams=null,key=null. Meta counts created by success, not error absence. Cases
  success_with_followup_error, combined_error_order, failure_null_fields and result_indexes_and_counts.


  Build the production user_bulk_create module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/bulk_user_creation.py:
  _requested_teams (L195-L201; 7 source lines), _row_error (L204-L218; 15 source lines), _normalized_email
  (L221-L222; 2 source lines), _partition_rows (L225-L257; 31 source lines), _existing_user_conflicts
  (L264-L280; 17 source lines), _load_teams (L283-L287; 5 source lines), _team_permission_error (L290-L293;
  4 source lines), _unusable_teams (L296-L315; 20 source lines), _db_failure (L318-L334; 17 source lines),
  _prepare_user (L337-L348; 12 source lines), _generate_key (L669-L675; 7 source lines), _add_to_organizations
  (L678-L689; 12 source lines), _run_per_user (L692-L699; 8 source lines), _write_audit_logs (L702-L732;
  31 source lines), _to_result (L748-L756; 9 source lines), _failure_result (L759-L760; 2 source lines),
  bulk_create_users (L763-L863; 94 source lines). Also own _CreatedUser L165-L171,
  _KeyResponse/_KEY_RESPONSE L177-L182 and _KEY_FIELDS L633-L666. Shared concurrency=10
  and row/team declarations L77-L163, plus JSON/error adapters L174-L175, belong to lower B1201.


  Add the user_bulk_create operation under B856 Management::users. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a user-bulk-create-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 293 function lines before docstring removal plus about 45 owned record/allowlist lines;
  allow 335 production, 355 behavior/Postgres tests, 65 adapters and 30 wiring, 785 changed lines
  within an 800-line gate. Shared lower-level records are counted in B1201, not duplicated here.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation test in this module: native_bulk_users_no_license_seat_cap.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
