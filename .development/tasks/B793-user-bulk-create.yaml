dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: duplicate_input_email,
      existing_user_conflict, unusable_team, key_follow_up_error, postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: 'The recorded deviations are covered by native behavior tests: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.'
    proof:
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_bulk_create::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/user_bulk_create.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/user-bulk-create-*")"
        && grep -rlq "user_bulk_create" tools/oracle/fuzz/corpus/helper_case/user-bulk-create-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_bulk_create::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_bulk_create::tests::postgres_failure_effects$/)'
oracle_cases:
  - tools/oracle/cases/helpers/user-bulk-create/duplicate-input-email.yaml
  - tools/oracle/cases/helpers/user-bulk-create/existing-user-conflict.yaml
  - tools/oracle/cases/helpers/user-bulk-create/unusable-team.yaml
  - tools/oracle/cases/helpers/user-bulk-create/key-follow-up-error.yaml
deviations:
  - what: License checks and paid-tier quotas are absent; the MIT behavior is available without a premium_user
      entitlement.
    why: README Decisions specifies no paid tier and no user/team cap.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/bulk_user_creation.py#L1-L863
