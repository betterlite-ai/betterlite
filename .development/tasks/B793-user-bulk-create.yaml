  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - 'litellm/proxy/management_helpers/bulk_user_creation.py: B1201 owns _user_table (L260-L261), _user_create_payload
    (L375-L408), _bounded (L411-L418), _insert_users (L421-L469), _assignments_by_team (L472-L484), _default_member_budget_id
    (L501-L510), _team_tx_db (L513-L514), _membership_tx_db (L517-L518), _write_team_roster (L521-L581),
    _detach_failed_teams (L584-L601), _publish_team_writes (L604-L630), _error_message (L185-L192), _row_teams
    (L735-L745).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
