deviations: []
out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- An absent api_base allows identity exchange without parsing, but an explicitly non-HTTPS base disables it even
  if its hostname is OpenAI.
- The identity cache is keyed by file path, not token-file contents; refreshed subject tokens must come from the
  same provider object.
- SDK 2.54.0 omits client_id from token-exchange JSON even though LiteLLM sets client_id=litellm in its workload
  identity record.
