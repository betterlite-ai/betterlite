id: B501
title: OpenAI workload identity credentials
description: >-
  Add OpenAiIdentity settings and an injected token-exchange client over betterlite-http. Resolve OPENAI_IDENTITY_PROVIDER_ID,
  OPENAI_SERVICE_ACCOUNT_ID and OPENAI_IDENTITY_TOKEN_FILE only from configuration; all three are required and a
  nonempty static key disables identity exchange. Read only that operator-selected token file asynchronously, refresh
  through the credential provider, and preserve client_id=litellm in the LiteLLM workload-identity record. Compare
  reusable OAuth/token-exchange libraries before choosing one; SDK import/version wrappers are represented by the
  same typed credential failure, without embedding Python. The oracle uses OpenAI SDK 2.54.0 installed in the B001
  oracle venv; exercise its auth object with an injected HTTP transport and clock, never live identity calls. Preserve
  its token-exchange request/response and refresh behavior; do not shell out to obtain identity tokens. Exchange
  JSON at https://auth.openai.com/oauth/token uses grant_type urn:ietf:params:oauth:grant-type:token-exchange, subject_token,
  subject_token_type urn:ietf:params:oauth:token-type:jwt, identity_provider_id and service_account_id; timeout
  is 10 seconds. Trim the local token file, reject empty tokens, parse access_token/expires_in, preserve OAuth failures
  on 400/401/403, refresh at lifetime minus min(1200 seconds, lifetime/2), and coalesce concurrent refreshes with
  an injected monotonic clock.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/workload_identity.py:
  OpenAIWorkloadIdentityConfig.to_sdk_workload_identity L32-L40; resolve_openai_workload_identity_config L43-L66;
  get_workload_identity_bearer_token L69-L70; _targets_openai_api L73-L77; _workload_identity_auth L80-L83; _load_sdk_workload_identity_auth
  L86-L91; _load_sdk_k8s_token_provider L94-L99.


  Named case contracts: static_key_disables_wif: Strip explicit api_key and OPENAI_API_KEY using B129 normalize_nonempty_secret_str;
  either nonblank key disables workload identity, including an env key after an explicit whitespace-only key. https_openai_host_only:
  Effective base is api_base, litellm.api_base, OPENAI_BASE_URL, OPENAI_API_BASE; an absent base allows WIF, otherwise
  require HTTPS plus B500 api.openai.com/subdomain classification. Foreign/HTTP hosts disable it; URL parse failures
  propagate. identity_cache_boundary: Cache WorkloadIdentityAuth by the frozen identity_provider_id/service_account_id/token_file
  triple with maxsize=16; equal configs reuse the auth object, changed identities do not, and the seventeenth distinct
  entry evicts the least recently used. sdk_auth_unavailable_500: Import failure for either WorkloadIdentityAuth
  or k8s_service_account_token_provider raises B668 OpenAIError 500 with the original cause and a diagnostic requiring
  openai>=2.32.0 and naming all three identity environment variables.


  B129 owns get_secret_str and normalize_nonempty_secret_str; configuration injects the resulting snapshots. Treat
  SDK availability as an injectable capability for oracle comparison, without requiring a Python runtime in production.


  Implement crates/betterlite-openai/src/workload_identity.rs with adjacent tests under workload_identity/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_workload_identity in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function workload_identity_cases in betterlite-openai with these exact named cases (one per oracle
  file): static_key_disables_wif, three_fields_required, https_openai_host_only, kubernetes_token_exchange, token_refresh_and_error,
  exchange_json_fields, refresh_half_life_boundary, empty_subject_token, oauth_status_errors, concurrent_refresh_single_flight,
  identity_cache_boundary, sdk_auth_unavailable_500. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_workload_identity* using HelperCase: kind:
  helper and the externally tagged openai_workload_identity variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_workload_identity that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_token_exchange consumes OAuth token response bytes in crates/betterlite-openai/src/workload_identity.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_workload_identity.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_workload_identity.
  The adjacent test replays_the_openai_workload_identity_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/openai/workload_identity.rs
  and its loader wiring: OPENAI_IDENTITY_PROVIDER_ID, OPENAI_SERVICE_ACCOUNT_ID, OPENAI_IDENTITY_TOKEN_FILE. Module-level
  settings enter litellm_settings; deployment settings enter litellm_params; environment lookup is injected. Keep
  the defaults and precedence specified above and in the linked branches; existing key owners remain unchanged.
  Write config rstest openai_workload_identity_config_cases with named cases loads_openai_identity_provider_id,
  loads_openai_service_account_id, loads_openai_identity_token_file, plus rejects_unrelated_key. Each loads case
  calls the real config loader with that key and asserts the resolved value, default, precedence and secret redaction
  where applicable. Seed B002 config_yaml with new openai_workload_identity* files for every key; reuse its parser/fuzz
  target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone openai_workload_identity_credential_identity_isolation in betterlite-openai for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone openai_workload_identity_secret_safe_failure in betterlite-openai for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 56 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 210 production lines, 220 behavior/config-test lines, 110 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 40 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 660 planned, 675 maximum changed lines. The production allowance includes 70 lines for the referenced
  SDK protocol that LiteLLM delegates.
