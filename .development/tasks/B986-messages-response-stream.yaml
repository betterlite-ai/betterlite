id: B986
title: Messages response stream
description: >-
  Translate Responses SSE into Anthropic message/content-block events using a bounded per-stream state machine.
  Preserve text, tool arguments, reasoning signatures, usage and terminal errors; close upstream on cancellation
  and keep output block indexes stable.


  Implement crates/betterlite-core/src/api/messages_response_stream.rs. Use MessagesResponseStreamInput and MessagesResponseStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions terminal_failed_to_error, early_eof_error under api::messages_response_stream::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesResponseStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_response_stream: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper.__init__
  (L117-L138); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper.__aiter__
  (L437-L438); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper.__anext__
  (L440-L484); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper.async_anthropic_sse_wrapper
  (L486-L494). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 71 owned nonblank/non-comment/non-docstring Python lines (85 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 91 implementation,
  52 behavior tests, 24 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 287 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B925 (Responses stream events), B978
  (Messages sse events), B984 (Messages responses output), B1087 (Api boundaries), B1119 (Responses to Messages
  event transitions). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
