id: B235
title: Media metadata and MIME inference
description: >-
  Implement extract_file_metadata/extract_file_data for supplied bytes and metadata (common_utils.py 789-914), _get_image_mime_type_from_url
  and infer_content_type_from_url_and_content (1439-1594). A filename is only metadata, never permission to read
  a local path; B159-B161 own SDK PathLike/file objects. Preserve MIME inference precedence and extension/query
  handling. Never fetch URLs here. Budget 250 metadata/MIME, 100 adapters, 300 tests/fuzz and 50 wiring (700 total).
  Add the media_metadata cargo-fuzz target, call the production parser, and commit/replay malformed and boundary
  seeds. Write the behavior rstest functions b235_behavior_tests_behavior in adjacent tests.rs files, with a named
  case for each behavior and failure in the DoD; corpus replay tests have separate names. Register helper operations
  media_metadata in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py; each operation has its
  own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/lib.rs
  - crates/betterlite-prompts/src/error.rs
  - crates/betterlite-prompts/src/media_metadata.rs
  - crates/betterlite-prompts/src/media_metadata/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/media-metadata/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-prompts/fuzz/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L789-L914
  why: File metadata/data helpers.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L1439-L1594
  why: MIME inference.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
- text: The outside-byte parser has its target and newly committed production replay corpus.
  proof:
  - media-metadata-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::b235_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'media_metadata' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: media-metadata-corpus
    why: the required new behavior or its evidence is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-prompts/fuzz/corpus/media_metadata)"
      && test -f crates/betterlite-prompts/fuzz/fuzz_targets/media_metadata.rs && test -n "$(ls -A crates/betterlite-prompts/fuzz/corpus/media_metadata)"
      && cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(replays_the_media_metadata_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/media-metadata/bytes-metadata.yaml
- tools/oracle/cases/helpers/media-metadata/bare-path-rejected.yaml
- tools/oracle/cases/helpers/media-metadata/mime-precedence.yaml
- tools/oracle/cases/helpers/media-metadata/extension-query.yaml
- tools/oracle/cases/helpers/media-metadata/unknown-mime.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B183 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
