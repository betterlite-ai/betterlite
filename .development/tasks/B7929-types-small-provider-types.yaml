out_of_scope:
- >-
  The larger provider files (anthropic, bedrock, gemini, vertex_ai, oci, openai, watsonx) have their own parts.
pitfalls:
- >-
  `HiddenParams` derives from `OpenAIObject`, which B5657 owns. If the class there lacks an attribute `HiddenParams` sets, say so in the task notes and do not add it from this task.
- >-
  `llms/databricks.py` defines its own `GenericStreamingChunk` TypedDict, separate from the one in `llms/bedrock.py`; keep both.
dod:
- text: Every name in the covered LiteLLM files exists with the same keys, required keys, Literal values, Enum members and field defaults.
  proof: [names]
- text: Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: names
    why: A name, key or value differs from LiteLLM.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_small_provider_types.py -k names
  - id: python-lint
    why: Strict typing has to hold for every ported module.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Names imported from the openai, httpx or pydantic packages are replaced by local equivalents or left out.
  why: The wheel depends only on python-dotenv.
budget:
