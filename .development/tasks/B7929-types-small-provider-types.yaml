id: B7929
title: Python types for the small provider files and llms/base.py (types/llms aiml to xai)
description: >-
  Seventeen short files under `litellm/types/llms/` hold request params and message shapes for single providers. This task
  ports them into one module each under `crates/betterlite-python/python/betterlite/types/llms/`: `aiml`, `azure`, `azure_ai`, `base`, `cohere`, `custom_http`, `databricks`,
  `langgraph`, `meta`, `mistral`, `ollama`, `openrouter`, `recraft`, `rerank`, `stability`, `triton` and `xai`. `azure.py` has 3 lines and
  `triton.py` is empty, so those two modules are near empty. It is Python only.


  The biggest is `stability.py` (228 lines, nine request TypedDicts; `StabilityImageEditRequest` derives from
  `StabilityImageGenerationRequest`). `base.py` has the pydantic bases `LiteLLMPydanticObjectBase` and
  `BaseLiteLLMOpenAIResponseObject`, `HiddenParams` (derives from `OpenAIObject`, from B5657) and `CachedTokensDetails`. Its
  `HiddenParams` must keep its attribute defaults. `custom_http.py` has the `httpxSpecialProvider` string Enum. `ollama.py` has
  a class `OllamaToolCallFunction` plus three TypedDicts.
