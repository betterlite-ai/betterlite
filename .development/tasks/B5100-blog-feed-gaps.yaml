deviations: []
out_of_scope:
- >-
    The no-one-line-functions finding on handle_start in parser.rs stays open; it belongs to B5094,
    which owns the padded one-line function lists under .ast-grep/rules/.
pitfalls:
- >-
    The CRLF fix only exists inside handle_text and handle_cdata once quick-xml goes back to 0.41.0;
    those byte-based helpers return after e9fce563 is reverted, and the fix is the one-method swap from
    decode() to xml10_content() inside them, not a change to any str-native match arm, since those arms
    disappear with the revert.
- >-
    GeneralRef keeps using plain decode(), unchanged: XML 1.0 EOL normalization only applies to literal
    line-end bytes in source text, not to character references like "&#13;", so a reference still gives
    "\r" after the fix.
- >-
    typespec, by way of the azure_core dependency chain, pins quick-xml to "0.41.0" in its own Cargo.toml;
    reverting betterlite's own pin to the same version removes the Cargo.lock duplicate without touching
    typespec.
- >-
    Python's zone parsing treats a token that fails int() as "no zone", not as invalid; only a token that
    parses as an integer can fail the 86400-second bound, which is why "+12a4" stays valid while a bare
    "2500" becomes invalid.
- >-
    run_sequence and get_blog_posts_sequence currently recompute the same cache_hit check that
    get_blog_posts already makes, so no input today can make the two disagree; the fix removes the
    duplicate check itself; it is not provable as a standalone red-before-green case.
- The blog feed oracle helper operation stays named blog_feed in the server group; this task adds no new operation and touches no registry file.
review_level: standard
budget:
  max_changed_lines: 650
  max_new_expects: 0
