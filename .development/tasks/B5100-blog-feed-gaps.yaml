- tools/oracle/cases/helpers/blog_feed/local-posts-load.yaml
- tools/oracle/cases/helpers/blog_feed/malformed-document-fallback.yaml
- tools/oracle/cases/helpers/blog_feed/missing-title-url-skipped.yaml
- tools/oracle/cases/helpers/blog_feed/multiple-items-limited.yaml
- tools/oracle/cases/helpers/blog_feed/namespace-channel.yaml
- tools/oracle/cases/helpers/blog_feed/parse-failure-fallback.yaml
