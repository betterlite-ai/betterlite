pitfalls:
- 'The oracle helper for this task is pre-registered as openai_media_dispatch in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/openai_media_dispatch.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_media_dispatch.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Image variation and image editing must select different upstream routes even though they share reply records.
