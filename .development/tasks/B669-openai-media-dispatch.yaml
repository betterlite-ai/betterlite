id: B669
title: OpenAI media operation composition
description: >-
  Install image generation/edit/variation, speech/transcription and video operations in the closed provider dispatcher.
  Call each native adapter with fixture transport and compare its actual HTTP request and result; preserve existing
  chat variants.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Install these completed leaf operations: B511 OpenAI image generation variants; B512 OpenAI image edit multipart
  mapping; B513 OpenAI image variation requests; B514 OpenAI binary speech generation; B515 OpenAI audio transcription
  mapping; B525 OpenAI video create list and retrieval; B526 OpenAI video edits extensions and characters. Each
  dispatch fixture must reach its leaf with a fake transport and assert the resulting request or reply; accept already
  normalized settings and reuse leaf errors.


  Named case contracts: image_generation: Dispatch both DALL-E and GPT-image models through B511 and compare its
  prepared URL, body and reply; do not select editing from a shared image response type. image_edit: Dispatch B512
  multipart edits, including image/mask field names and duplicate input-image parts. image_variation: Dispatch B513
  /images/variations independently of /images/edits. speech: Dispatch B514 binary speech with request model/voice
  and exact upstream bytes. transcription: Dispatch B515 audio transcription with multipart file and leaf response
  projection. video_create: Dispatch B525 create with decoded character IDs and its multipart policy. video_lifecycle:
  Parameterize B525 list, retrieve status, delete, content and remix operations; assert distinct method/path, encoded-ID
  handling, JSON versus binary output and leaf failure propagation. video_extended_operations: Parameterize B526
  edit, extension, create character and get character; assert each reaches its own leaf and retains its typed video/character
  result.


  Each parameterized operation uses a distinct fixture row in the named case file and reaches the existing leaf
  production entry point. The composition layer introduces no new defaults, headers, errors, parsers or config keys:
  leaf-owned outcomes and warnings pass through unchanged. Test at least one leaf error per family to detect accidental
  conversion to unsupported_operation. No HTTP route is registered or called by these helper cases.


  Implement crates/betterlite-provider/src/openai_media_dispatch.rs with adjacent tests under openai_media_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_media_dispatch_cases in betterlite-provider with these exact named cases (one per
  oracle file): image_generation, image_edit, image_variation, speech, transcription, video_create, video_lifecycle,
  video_extended_operations. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_media_dispatch* using HelperCase: kind:
  helper and the externally tagged openai_media_dispatch variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_media_dispatch that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone openai_media_dispatch_unsupported_operation in betterlite-provider for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 155 production lines, 210 behavior/config-test lines, 145 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 550 planned, 550 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
