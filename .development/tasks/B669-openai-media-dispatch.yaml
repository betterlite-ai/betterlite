checks:
  optional:
  - mutants
  commands:
  - id: case-image-generation
    why: Dispatch both DALL-E and GPT-image models through B511 and compare its prepared URL, body and reply; do
      not select editing from a shared image response type.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_image_generation$/)'
  - id: case-image-edit
    why: Dispatch B512 multipart edits, including image/mask field names and duplicate input-image parts.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_image_edit$/)'
  - id: case-image-variation
    why: Dispatch B513 /images/variations independently of /images/edits.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_image_variation$/)'
  - id: case-speech
    why: Dispatch B514 binary speech with request model/voice and exact upstream bytes.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_speech$/)'
  - id: case-transcription
    why: Dispatch B515 audio transcription with multipart file and leaf response projection.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_transcription$/)'
  - id: case-video-create
    why: Dispatch B525 create with decoded character IDs and its multipart policy.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_video_create$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_media_dispatch.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_media_dispatch*")"
      && grep -lq 'openai_media_dispatch' tools/oracle/fuzz/corpus/helper_case/openai_media_dispatch* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_media_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_unsupported_operation$/)'
  - id: case-video-lifecycle
    why: Parameterize B525 list, retrieve status, delete, content and remix operations; assert distinct method/path,
      encoded-ID handling, JSON versus binary output and leaf failure propagation.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_video_lifecycle$/)'
  - id: case-video-extended-operations
    why: Parameterize B526 edit, extension, create character and get character; assert each reaches its own leaf
      and retains its typed video/character result.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_media_dispatch_cases::case_[0-9]+_video_extended_operations$/)'
