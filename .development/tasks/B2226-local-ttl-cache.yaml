deviations:
- what: Typed native cache values use bounded canonical serialized size (opaque internal credential handles use
    their typed size charge), rather than Python object-layout __sizeof__. Keys are limited to 1024 bytes and serialized
    values to 1 MiB. Eviction or rejection can occur at a different boundary for the same Python object. Cache debug
    events redact values and credentials.
  why: Carry the existing B390 bounded native value policy down to its shared owner and obey credential-redaction
    rules without reproducing Python heap layout.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/in_memory_cache.py#L56-L91
out_of_scope:
- InMemoryCache async wrappers, pipelines, sets, batch reads, increments, flush/disconnect and remaining TTL/oldest-key
  helpers stay B390/B391. DualCache Redis construction, LimitedSizeOrderedDict and Redis read/write/backfill branches
  remain B125; only its no-Redis provider-cache path is owned here. Cache logging is an injected redacted event
  sink; no Redis transport is called by this task.
- 'Function ownership inventory litellm/caching/in_memory_cache.py: InMemoryCache.async_get_cache L238-L239; InMemoryCache.async_batch_get_cache
  L241-L246; InMemoryCache.async_increment L248-L249; InMemoryCache.async_increment_pipeline L251-L258; InMemoryCache.flush_cache
  L260-L263; InMemoryCache.disconnect L265-L266; InMemoryCache.async_get_ttl L271-L275; InMemoryCache.async_get_oldest_n_keys
  L277-L283 belong to B125.'
- 'Function ownership inventory litellm/caching/in_memory_cache.py: InMemoryCache.async_set_cache L179-L180; InMemoryCache.async_set_cache_pipeline
  L182-L187; InMemoryCache.async_set_cache_sadd L189-L198; InMemoryCache.batch_get_cache L223-L228; InMemoryCache.increment_cache
  L230-L236 belong to B390.'
pitfalls:
- An insertion can evict an existing entry before discovering that the replacement is too large.
- Read expiry uses > while insertion pruning uses <=.
