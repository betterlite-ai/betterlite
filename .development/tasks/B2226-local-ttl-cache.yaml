id: B2226
title: Shared local TTL cache primitives
description: >-
  Move shared bounded local-cache primitives below Azure token/AWS credential consumers and router storage. Inject
  clocks and typed values; B390 owns routing value types and batch/increment adapters, while B125 owns Redis composition.
  Provider caches use the memory-only DualCache branch, never router storage or the HTTP client pool.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/caching/in_memory_cache.py:
  InMemoryCache.__init__ L32-L54; check_value_size L56-L91; _is_key_expired L93-L97; _remove_key L99-L104; evict_cache
  L106-L141; allow_ttl_override L148-L156; set_cache L158-L177; evict_element_if_expired L200-L209; get_cache L211-L221;
  delete_cache L268-L269. litellm/caching/dual_cache.py: local constructor fields L98-L100 and L106-L106; set_cache
  local-tier/error branches L150-L157 and L161-L162; get_cache local-tier/error branches L185-L199 and L211-L216.


  Named case contracts: cache_defaults: max_size_in_memory defaults 200 and only explicit None restores 200; zero
  disables insertion and negative values retain the source failure behavior. default_ttl uses value or 600 seconds.
  max_size_per_item uses value or MAX_SIZE_PER_ITEM_IN_MEMORY_CACHE_IN_KB (integer environment default 1024), with
  the constructor default itself 1024. State begins with empty value/expiry maps and heap; inject the wall-clock
  source. expiry_and_overwrite: Reads expire only when now is strictly greater than expiry; equality remains readable.
  Insertion first prunes heap roots whose expiry no longer matches the map, then roots with expiry <= now, then
  evicts earliest expirations until live length is below capacity, even when overwriting an existing key. Equal
  expiries break ties by key ordering. Missing/outdated heap state can raise and the DualCache wrapper handles it.
  nonrefreshing_ttl: After capacity eviction and size acceptance store the value. Set a new expiry only when the
  previous TTL is absent or strictly before now; an unexpired overwrite retains its original expiry and ignores
  a requested new TTL. Supplied ttl=0/negative is used, while absent/None uses default_ttl. Delete removes both
  maps but leaves the heap entry for lazy pruning. Failed value-size admission occurs after eviction and can therefore
  evict an item without storing a replacement. value_size_policy: The Python oracle fast-paths bool/int/float/string
  when len(str(value)) is strictly below max_size_per_item times the loaded KiB constant; bytes use sys.getsizeof/1024
  <= cap, then __sizeof__ is tried before BaseModel/datetime/JSON fallback. Size-check exceptions reject without
  insertion. Native cache values use the bounded canonical-size policy stated in deviations, with opaque credential/client
  handles charged by an internal typed size projection, never a caller-supplied HTTP size. cached_json_projection:
  On a cache hit attempt JSON parsing of the stored value; if it succeeds return the parsed value (including None/False/0),
  otherwise return the original object/value. A missing or expired key returns None. Use decode_cached_json only
  for stored string/byte payloads and keep typed credential handles out of JSON conversion. dual_local_defaults_errors:
  For the no-Redis branch, use a supplied truthy memory cache or create the default. default_in_memory_ttl uses
  truthy constructor value then litellm.default_in_memory_ttl (None by default). Only when ttl is absent and that
  setting is non-None add it; an explicit ttl=None bypasses the override and reaches the memory default. set_cache
  catches failures and emits its verbose event; get_cache catches failures, logs LiteLLM Cache: exception in get_cache
  and returns None. A cached False/0 is a hit, but None is treated as absent. Apply B187 redaction to get cache:
  cache result: {value} and error events.


  Load MAX_SIZE_PER_ITEM_IN_MEMORY_CACHE_IN_KB, default_in_memory_ttl through betterlite-config, with injected environment
  lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest local_ttl_cache_config_cases; each named loads_<key> case invokes the real B002 loader, checks
  explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  MAX_SIZE_PER_ITEM_IN_MEMORY_CACHE_IN_KB parses an integer and malformed input fails the loader; default_in_memory_ttl
  is the global litellm_settings value and defaults None. Do not add provider-specific copies of either setting.


  Write standalone Rust test local_ttl_cache_credential_identity_isolation in betterlite-context: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test local_ttl_cache_secret_safe_failure in betterlite-context: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Outside-byte boundary: decode_cached_json consumes bounded stored string/byte JSON values, returning parsed value
  or original-value fallback in crates/betterlite-context/src/local_ttl_cache.rs or its scoped child module. Use
  that production decoder from the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-context/fuzz/fuzz_targets/cached_json.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_cached_json_corpus that
  checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Implement crates/betterlite-context/src/local_ttl_cache.rs with adjacent tests under local_ttl_cache/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation local_ttl_cache in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function local_ttl_cache_cases in betterlite-context with these exact named cases (one per oracle
  file): cache_defaults, expiry_and_overwrite, nonrefreshing_ttl, value_size_policy, cached_json_projection, dual_local_defaults_errors.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/local_ttl_cache* using HelperCase: kind: helper
  and the externally tagged local_ttl_cache variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_local_ttl_cache that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 156 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 265 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 65 parser target/replay lines, 40 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 745 planned, 750 maximum changed lines.
