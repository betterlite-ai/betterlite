id: B10224
title: The LogContext copies in core, bedrock and provider and anthropic's Logging take betterlite-logging's LogContext
description: >-
  B10225 puts `LogContext<'borrow, 'env>` in crates/betterlite-logging/src/logging_pre_post/context.rs: `pub state: &'borrow mut LoggingState` beside `pub env: &'borrow PrePostEnv<'env>`, the logging object of one call and the pre and post call environment its records go through. Twenty-one structs in betterlite-core, betterlite-bedrock, betterlite-provider and betterlite-anthropic still declare those two fields themselves. Eighteen even share the name, and some users already take one family's copy for another: betterlite-python's genai/session.rs L26 and search_ocr/session.rs L11 import vector_store_http_write's. This task deletes the twenty-one and points every user at the home. Every crate involved, the oracle and bedrock's fuzz crate already depend on betterlite-logging, so no crate gains a dependency. It is a refactor: no record, log line, header or error changes, and nothing a user sees changes.


  The LogContext copies. Each is `pub struct LogContext<'borrow, 'env>` with the home's two fields, so its users keep writing `LogContext` and only the import changes, to `use betterlite_logging::logging_pre_post::context::LogContext;` or `context::LogContext` inside an existing `betterlite_logging::logging_pre_post::{...}` group. Core: api/bfl/generation_call.rs L42-L45, file_http_content/service.rs L83-L86, file_http_upload/service.rs L87-L90, responses_compact_http/service.rs L75-L78, responses_create_http/service.rs L70-L73, responses_read_http/service.rs L88-L91, responses_write_http/service.rs L100-L103, vector_file_http_create_list/service.rs L81-L84, vector_file_http_read/service.rs L66-L69, vector_file_http_write/service.rs L65-L68, vector_store_http_write/service.rs L86-L89, video_remix_list_transport.rs L29-L33 and videos_http_transport/generation.rs L27-L31 (the last two with their comment line). Bedrock: embedding_call.rs L59-L62, image_call/plan.rs L69-L72 and rerank/plan.rs L54-L57. Provider: api/image_edit_http/service.rs L58-L61 and api/speech_http.rs L99-L102. Each goes, and so do the LoggingState and PrePostEnv imports that only it used; clippy's unused import lint names any left.


  Three copies under other names. Provider's `RerankLogContext` (api/rerank_http.rs L50-L53) goes, and its users write `LogContext`: rerank_http.rs L70 and L169, rerank_http/logging.rs L8 and L18, rerank_http/tests.rs L43 and L166, betterlite-python's rerank/operations.rs L21 and L203, and the oracle's sdk_http rerank_http/native.rs, rerank_call/support.rs and rerank_provider_plan/providers.rs. Core's `GenerationCallEnvironment` (video_generation_call/call.rs L40-L44) names its state field `logging`: it goes, call.rs L76 and L119 take `LogContext<'call, '_>`, L78 destructures `LogContext { state: logging, env }` so the body keeps its binding, and its builders write `state:` (betterlite-python's video_calls/operations.rs L104-L107, betterlite-server's health_native_backend/video_generation.rs L90-L93, call/tests/support.rs L483). Anthropic's `Logging<'logging>` (response.rs L42-L45) uses one lifetime for both borrows; the home's two lifetimes cover every caller, so it goes, each `Logging<'_>` reads `LogContext<'_, '_>`, each `Logging { state, env }` reads `LogContext { state, env }`, and the `Logging as ResponseLogging` imports (anthropic chat_call/tests/fixture.rs L37, foundry anthropic/tests/support.rs L23) import the home under its own name. Its users: anthropic's response.rs, chat_call (send.rs, config.rs, tests/fixture.rs), batches (handler.rs, result.rs, tests/cases.rs, tests/support.rs) and response/tests/fixture.rs, bedrock claude_invoke (response.rs, tests/support.rs) and invoke_response/delegate.rs, vertex vertex_claude_chat/response.rs L36, foundry anthropic/tests/support.rs, provider anthropic_dispatch.rs L116 and L165, anthropic_dispatch/native/config.rs and foundry_dispatch/fixtures/claude.rs, server pass_through_logging/anthropic_passthrough_logging/transform.rs, and the oracle's helpers anthropic (batches/cases.rs, batches/retrieve.rs, chat_call/fixture.rs, response/fixture.rs), bedrock/claude_invoke/response.rs and foundry/anthropic/tests/fixture.rs. delegate.rs L60-L65 and L105-L109 destructure image_call's LogContext only to build anthropic's Logging or a new LogContext from the same two fields; with one type each passes `call.log` on as it is.


  Files other tasks add or move first. B7877 adds betterlite-python's vector_files/calls.rs (vector_file_http_read's LogContext), vector_files/service.rs (`LogContext as FileLogContext` from vector_file_http_create_list) and vector_files/write_service.rs (`LogContext as WriteLogContext` from vector_file_http_write); each imports the home once under its own name and builds `LogContext {`. B7889 adds realtime_calls/http.rs, which imports vector_store_http_write's. B10183 moves the GenAI session, whose `run` takes `log: &mut LogContext<'_, '_>`, into betterlite-vertex's genai/session.rs and genai/session/, and betterlite-python's genai/session.rs keeps building the LogContext it passes in. B10200, B10216 and B10217 rewrite the `service::{...}` import groups and transport files these copies sit in, so this task starts from their result.


  Every site. The scope lists each file that names a copy on main, plus the four B7877 and B7889 add and the vertex session B10183 fills. `rg -nw 'LogContext|RerankLogContext|GenerationCallEnvironment|FileLogContext|WriteLogContext' crates tools` lists them on the base, and the anthropic paragraph above names every user of its Logging; every hit that names a deleted path or name changes, and a hit that only writes `LogContext<'_, '_>` stays. Bedrock's converse_call/tests/fixtures/run.rs L101, L113, L155 and L198 spell `super::bedrock::image_call::plan::LogContext` in full, and bedrock's fuzz target fuzz_targets/bedrock_invoke_response.rs L11 imports image_call's; both name the home.


  Tests. No new test: the owners' tests already pin the pre-call and post-call records each family writes, and they must pass with only imports and names changed. The oracle files change only imports and names, and CI's clippy lane builds them.


  What users see: nothing.
