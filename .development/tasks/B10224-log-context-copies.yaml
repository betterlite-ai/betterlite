  - text: No LogContext copy, RerankLogContext, GenerationCallEnvironment or anthropic Logging is left, so betterlite-logging's LogContext is the only struct holding the logging state and the pre and post call environment.
    proof: [log-context-copies]
  - text: Every user names the home, and the owners' tests in core, bedrock, provider, python, server, anthropic, vertex and foundry pass with only imports and names changed.
    proof: [core-log-context-tests, bedrock-log-context-tests, provider-log-context-tests, python-log-context-tests, server-log-context-tests, anthropic-log-context-tests, vertex-log-context-tests, foundry-log-context-tests]
checks:
  optional: []
  commands:
    - id: log-context-copies
      why: a module still declares its own LogContext, RerankLogContext, GenerationCallEnvironment or anthropic Logging, or a user still aliases a copy
      run: |-
        test -z "$(grep -rlE '^pub struct (LogContext|RerankLogContext|GenerationCallEnvironment|Logging)<' crates tools --include=*.rs | grep -vx 'crates/betterlite-logging/src/logging_pre_post/context.rs')" &&
        test -z "$(grep -rnwE 'RerankLogContext|GenerationCallEnvironment|FileLogContext|WriteLogContext|ResponseLogging' crates tools --include=*.rs)"
    - id: core-log-context-tests
      why: a core handler family no longer writes its pre-call or post-call records through the logging pair it is handed
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^(api::(bfl|file_http_content|file_http_metadata|file_http_upload|genai|genai_http|messages_response_call|responses_compact_call|responses_compact_http|responses_create|responses_create_call|responses_create_http|responses_lifecycle_call|responses_lifecycle_write|responses_read_http|responses_write_http|search_http|vector_file_http_create_list|vector_file_http_read|vector_file_http_write|vector_file_read|vector_search_execution|vector_store_http_create_read|vector_store_http_write|vector_store_read|vector_store_search|video_generation_call|video_list_call|video_remix_call|video_remix_list_transport|videos_http_transport)|search)::/) - test(/replays_/)'
    - id: bedrock-log-context-tests
      why: a bedrock family lost its logging pair on the way to pre_call or to anthropic's transform
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^(batch_call|bedrock_http_stream|claude_invoke|converse_call|converse_response|embedding_call|embedding_jobs|image_call|image_edits|invoke_response|invoke_stream|nova_chat|qwen_deepseek|rerank)::/) - test(/replays_/)'
    - id: provider-log-context-tests
      why: a provider transport or dispatch no longer hands its logging pair to the call it wraps
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^(api::(image_edit_http|realtime_http_transport|rerank_http|speech_http|transcription_http)|anthropic_dispatch|azure_media_dispatch|bedrock_image_dispatch|foundry_dispatch|watsonx_transcription)::/) - test(/replays_/)'
    - id: python-log-context-tests
      why: a Python session no longer builds the logging pair its core or provider call takes
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^(genai|realtime_calls|rerank|search_ocr|vector_files|vector_search|video_calls)::/)'
    - id: server-log-context-tests
      why: the video generation health check or the Anthropic pass-through transform no longer builds the logging pair
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^(health_native_backend::video_generation|pass_through_logging::anthropic_passthrough_logging)::/) - test(/replays_/)'
    - id: anthropic-log-context-tests
      why: anthropic's transform, chat call or batch retrieve no longer logs through the pair it is handed
      run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^(response|chat_call|batches)::/) - test(/replays_/)'
    - id: vertex-log-context-tests
      why: the GenAI session or the Vertex Claude transform no longer logs through the pair it is handed
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^(genai|vertex_claude_chat)::/) - test(/replays_/)'
    - id: foundry-log-context-tests
      why: foundry's Anthropic tests no longer hand anthropic's transform its logging pair
      run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/^anthropic::/) - test(/replays_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "B10225's copies, which land first and create the home: provider's seven CallLogging, the ten PrePostLogger in openai, azure and core soniox, and core eval_http's EvalLogging."
  - "Not copies: core responses_lifecycle_call's `LifecycleLog` (service.rs L27-L30) owns its PrePostEnv and lends it to a LogContext; the oracle sdk_http `Fixture` structs and the bedrock helpers' `Run` structs own a LoggingState; core's VideoCallDeps, GenerationHandlerEnvironment and the other structs that carry the pair beside call data have more fields. They stay."
  - "`BatchesError::Logging` (anthropic batches/error.rs L37) and the oracle's `TranscriptionError::Logging` are error variants that share a word with anthropic's struct and stay."
pitfalls:
  - "B7877's vector_files/service.rs and write_service.rs alias two different copies; after the merge both aliases name one type, so drop the alias rather than keep `LogContext as FileLogContext`, and the copies check fails while either alias is left."
  - "Bedrock's converse_call/tests/fixtures/run.rs writes `super::bedrock::image_call::plan::LogContext` inline at four places and no `use` line names it, so a search over imports alone misses them."
  - "GenerationCallEnvironment's field is `logging`, not `state`: three builders and one destructure change their field name, and the rest of call.rs keeps reading the `logging` binding."
  - "Anthropic's Logging is taken by value everywhere (`logging: Logging<'_>`), and that stays: write `LogContext<'_, '_>` by value, not `&mut LogContext`, so anthropic_dispatch.rs L165 and the batch handlers keep their shape."
  - "anthropic_dispatch.rs is `#[rustfmt::skip]` from L145; edit L165 by hand and keep it on one line."
  - "Files near the line caps: tools/oracle/src/helpers/bedrock/other_rerank/driver.rs has 298 of 300 counted lines and core responses_write_http/service.rs 295; keep the home import on the line the old import held."
  - "B10216 rewrites the `service::{ClientKind, LogContext, SuppliedClient, ...}` groups in these files before this task starts; take LogContext out of the group it left and add the home import, without restoring anything it removed."
  - "A dispatched run builds nothing, so walk every hit of the rg line in the description on the base before committing; each missed import costs a CI round."
review_level: standard
budget:
  max_changed_lines: 900
  max_new_expects: 0
