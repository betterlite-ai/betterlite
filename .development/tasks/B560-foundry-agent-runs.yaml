id: B560
title: Foundry agent thread and run execution
description: >-
  Execute Foundry agent thread/message/run requests using typed records and B173 transport. Preserve exactly 60
  polling attempts at one-second intervals independently of the timeout argument, then AzureAIAgentsError status
  408. AzureAIAgentsConfig.completion calls get_azure_ad_token with azure_scope=https://ai.azure.com/.default when
  api_key is None and raises ValueError if no token is obtained.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/agents/handler.py:
  AzureAIAgentsHandler.completion L302-L350; AzureAIAgentsHandler._execute_agent_flow_sync L352-L421; AzureAIAgentsHandler.acompletion
  L426-L478; AzureAIAgentsHandler._execute_agent_flow_async L480-L549. litellm/llms/azure_ai/agents/transformation.py:
  AzureAIAgentsConfig.completion L310-L397.


  Reuse get_azure_ad_token from B529 (litellm/llms/azure/common_utils.py); its implementation remains with that
  prerequisite.


  Named case contracts: new_thread_run_flow: For sync and async, falsey thread_id creates a thread; the empty dict
  is sent as no request body, not JSON {}. Create thread/message/run accept only 200 or 201; status/list accept
  only 200. GET sends no body; POST serializes only truthy payloads. existing_thread_message_flow: Reuse a truthy
  thread_id; post every user/system message as role=user in order, preserve explicit content=None, default only
  missing content to empty string, and skip assistant/tool roles. Run body has assistant_id plus instructions only
  when the key exists, including None/empty. failed_cancelled_expired_run: failed/cancelled/expired raise AzureAIAgentsError
  500 with Run <status>: <last_error.message>, default Unknown error only for absent fields. Other/missing statuses
  continue polling. nonexpected_status: Preserve response status and the B559 error projection with operation prefixes
  Failed to create thread, Failed to add message, Failed to create run, Failed to get run status, Failed to get
  messages; no later request occurs after failure. sixty_polls_408: completed immediately stops polling and fetches
  messages; otherwise perform exactly 60 polls and 60 one-second sleeps then AzureAIAgentsError 408 Run timed out
  waiting for completion. Use an injected clock, never a real-minute oracle wait. agent_entra_forced_scope: Only
  api_key=None invokes B529 after copying litellm_params and overriding azure_scope=https://ai.azure.com/.default;
  empty string bypasses resolution. Preserve the input mapping. agent_token_missing_value_error: If resolution remains
  None, ValueError text is api_key (Azure AD token) is required for Azure Foundry Agents. Either pass api_key directly,
  or set AZURE_TENANT_ID, AZURE_CLIENT_ID, and AZURE_CLIENT_SECRET environment variables for Service Principal auth.
  Manual token: az account get-access-token --resource 'https://ai.azure.com'. dispatch_and_client_defaults: Truthy
  acompletion plus truthy stream chooses B561 native async SSE; sync ignores stream and runs normal polling. None
  client creates B173 sync/azure_ai async transport with ssl_verify from litellm_params, default None; a supplied
  client is reused. timeout is never passed to these GET/POST calls.


  Use B561 reply construction and streaming dispatch and B559 URL/auth/error preparation directly. Cancellation
  is a Rust transport ownership invariant, not a terminal status supplied by this source.


  Write standalone Rust test agent_runs_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test agent_runs_secret_safe_failure in betterlite-foundry: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B2202. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-foundry/src/agent_runs.rs with adjacent tests under agent_runs/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agent_runs_cases in betterlite-foundry with these exact named cases (one per oracle file):
  new_thread_run_flow, existing_thread_message_flow, failed_cancelled_expired_run, nonexpected_status, sixty_polls_408,
  agent_entra_forced_scope, agent_token_missing_value_error, dispatch_and_client_defaults. Each case exercises its
  named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_agent_runs* using HelperCase: kind: helper
  and the externally tagged foundry_agent_runs variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_foundry_agent_runs that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_agent_run_status consumes thread/run/message HTTP JSON bytes in crates/betterlite-foundry/src/agent_runs.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_agent_runs.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_agent_runs.
  The adjacent test replays_the_foundry_agent_runs_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone foundry_agent_runs_credential_identity_isolation in betterlite-foundry for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone foundry_agent_runs_secret_safe_failure in betterlite-foundry for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 273 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 220 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 605 planned, 625 maximum changed lines.
