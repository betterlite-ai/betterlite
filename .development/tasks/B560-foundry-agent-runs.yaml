- 'The oracle helper for this task is pre-registered as foundry_agent_runs in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/agent_runs.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_agent_runs.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
