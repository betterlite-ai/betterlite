id: B560
title: Foundry agent thread and run execution
description: >-
  Execute Foundry agent thread/message/run requests using typed records and B173 transport. Preserve exactly 60
  polling attempts at one-second intervals independently of the timeout argument, then AzureAIAgentsError status
  408. AzureAIAgentsConfig.completion calls get_azure_ad_token with azure_scope=https://ai.azure.com/.default when
  api_key is None and raises ValueError if no token is obtained.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/agents/handler.py:
  AzureAIAgentsHandler.completion L302-L350; AzureAIAgentsHandler._execute_agent_flow_sync L352-L421; AzureAIAgentsHandler.acompletion
  L426-L478; AzureAIAgentsHandler._execute_agent_flow_async L480-L549. litellm/llms/azure_ai/agents/transformation.py:
  AzureAIAgentsConfig.completion L310-L397.


  Reuse get_azure_ad_token from B529 (litellm/llms/azure/common_utils.py); its implementation remains with that
  prerequisite.


  Implement crates/betterlite-foundry/src/agent_runs.rs with adjacent tests under agent_runs/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation foundry_agent_runs in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agent_runs_cases in betterlite-foundry with these exact named cases (one per oracle file):
  new_thread_run_flow, existing_thread_message_flow, completed_run, failed_cancelled_expired_run, poll_limit, run_cancellation,
  nonexpected_status, sixty_polls_408, timeout_does_not_change_poll_count, agent_entra_forced_scope, agent_token_missing_value_error.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_agent_runs* using HelperCase: kind: helper
  and the externally tagged foundry_agent_runs variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_foundry_agent_runs that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_agent_run_status consumes thread/run/message HTTP JSON bytes in crates/betterlite-foundry/src/agent_runs.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_agent_runs.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_agent_runs.
  The adjacent test replays_the_foundry_agent_runs_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone foundry_agent_runs_credential_identity_isolation in betterlite-foundry for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone foundry_agent_runs_secret_safe_failure in betterlite-foundry for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 273 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 295 production lines, 174 behavior/config-test lines,
  99 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 648 planned, 650 maximum changed lines.
