  - tools/oracle/cases/helpers/mcp-user-env-vars/decode-undecryptable-and-empty.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/decode-not-an-object.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/get-missing-row.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/bulk-empty-ids-no-query.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/bulk-omits-missing-and-keeps-unreadable.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/merge-creates-row.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/merge-overlay-and-prune.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/merge-empty-result-written.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/merge-replaces-unreadable-row.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/merge-lock-key-signed.yaml
  - tools/oracle/cases/helpers/mcp-user-env-vars/delete-missing-row.yaml

deviations:
  - what: A stored object with a non-string value decodes to an empty map and logs a warning. LiteLLM turns every value into text with str().
    why: LiteLLM only ever writes dict[str, str], and str() of a number, bool or null is Python repr text that docs/compatibility.md leaves out. A hand-edited row therefore reads as unset and the user is asked again, as for any unreadable blob.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L2239-L2240
  - what: Values are held as SecretString and the warning texts carry no variable name or value.
    why: The values are credentials and rule secrets-stay-secret keeps them out of logs and Debug output. LiteLLM's two warnings already carry none.

out_of_scope:
  - rotate_mcp_user_env_vars_master_key (db.py L1482-L1523), rotate_mcp_user_credentials_master_key, rotate_mcp_server_credentials_master_key, _reencrypt_global_env_var_values and _reencrypt_mcp_credentials_blob; B2332 owns all of them with the same mcp_user_env_vars key name. B4711's out_of_scope text says B4714 owns them, which is wrong (see notes).
  - _user_env_var_actions, _MCPUserEnvVarsRepository, _db_find_user_env_var_rows, _db_transaction_manager and the transaction Protocol types; B4711 owns the table handles and the transaction trait this module calls.
  - _encrypt_global_env_var_values, decrypt_global_env_var_values and _decrypt_env_vars_on_returned_row; those handle the admin's global values on the server row and belong to B4710.
  - The gateway read cache around get_user_env_vars in mcp_server_manager.py (TTL, invalidate_user_env_vars_cache) and the "no database" RuntimeError; the manager task owns them.
  - The /v1/mcp/server/{server_id}/user-env-vars routes, their allowed-name derivation and their HTTP oracle cases; B4724 owns them.
  - encrypt_value_helper and decrypt_value_helper themselves; B1600 owns them.

pitfalls:
  - Per-user credentials accept legacy plain base64 and per-user env vars do not, so a base64 fallback in the decoder would turn old ciphertext into garbage values.
  - The cipher key name is the literal mcp_user_env_vars, not the column name values_b64, and it must match B2332's rotation or rotated rows stop decrypting.
  - The lock text is `{user_id}:{server_id}` with no prefix, so reusing B4711's lock-key function would lock a different number and let a merge race an identifier write on nothing, or fail to serialize two merges.
  - Python's int.from_bytes(..., signed=True) is a big-endian i64, so the key is i64::from_be_bytes and not from_le_bytes or an unsigned cast.
  - The lock must be taken before find_unique. Reading first and locking after lets two merges from one user lose an update.
  - allowed_names prunes the existing map as well as the updates, so a stored name the admin retired disappears on the user's next merge even when the update does not mention it.
  - get_user_env_vars_bulk returns an entry for an undecryptable row (empty map) but none for a missing row, so callers can tell "never set" from "needs re-entering".
  - Empty server_ids returns before any query, because an empty `in` list is a pointless round trip and LiteLLM skips it.
  - delete_many, not delete, is what makes a missing row a no-op, since delete raises on zero rows.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
