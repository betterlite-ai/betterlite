id: B965
title: Messages system, metadata and thinking options for Chat
description: >-
  Implement the remaining option translations in betterlite-core::api::messages_chat_options: thinking-to-effort
  bucketing and summary wrapping, in-sequence/top-level system handling, target capability checks, metadata,
  stop sequences, thinking carriers and untranslated parameter copying. B2431 owns all tool/schema methods;
  B1117 provides cache/name/model primitives, B175 supported OpenAI parameters and budget bucketing, and B962
  session cache-key extraction and the resolved auto-summary setting. Do not resolve a provider implicitly from
  the model prefix: absent custom_llm_provider suppresses capability probes here.

  A Claude-family model keeps thinking verbatim, but carrying an adaptive effort tier is a separate decision.
  Bedrock-prefixed or ARN targets get output_config without format; other Claude targets get a plain effort
  string only when their resolved provider declares reasoning_effort. Non-Claude targets use the bucketed effort
  and optional summary object. This task adds no HTTP call or byte parser. Add messages_chat_options to B171's
  helper dispatch, comparing both output kwargs and the input mutation from popping litellm_metadata.

  Own 230 nonblank/non-comment lines after the B2431 split. Reserve 225 implementation, 155 tests, 155 fixtures,
  85 adapters and 30 wiring, 650 lines; the source bounds below do not bisect any function.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_chat_options.rs
  - crates/betterlite-core/src/api/messages_chat_options/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/messages_chat_options.rs
  - tools/oracle/src/helpers/core_ops/messages_chat_options/**
  - tools/oracle/helpers/messages_chat_options.py
  - tools/oracle/helpers/messages_chat_options/**
  - tools/oracle/fuzz/corpus/helper_case/messages_chat_options-*
  - tools/oracle/cases/helpers/messages-chat-options/**
  - Cargo.lock
  lint_tables: false
