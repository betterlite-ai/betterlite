  why: Own system insertion, provider capability probes and metadata pop/user/cache-key behavior.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L1054-L1064
  why: Only truthy stop_sequences becomes Chat stop.
