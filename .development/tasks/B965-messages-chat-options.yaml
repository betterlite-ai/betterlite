id: B965
title: Messages chat options
description: >-
  Translate Anthropic thinking, tool_choice, tool schemas, metadata, stop sequences and output_format into B175
  chat parameter mappings. Expose target-capability decisions separately from message conversion, with checked reasoning
  budgets and explicit dropped-field diagnostics.


  LiteLLMAnthropicMessagesAdapter.translate_thinking_for_model (litellm/llms/anthropic/pass_through/adapters/transformation.py:L703-L737)
  has no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and
  no behavior case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/messages_chat_options.rs. Use MessagesChatOptionsInput and MessagesChatOptionsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions thinking_to_effort, bedrock_arn_target, strict_output_schema, tool_choice_any,
  prompt_cache_key_metadata, unsupported_thinking_drop under api::messages_chat_options::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesChatOptions in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_chat_options: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_anthropic_thinking_to_reasoning_effort
  (L642-L669); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._apply_reasoning_summary_wrapping
  (L740-L761); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_anthropic_tool_choice_to_openai
  (L763-L779); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_anthropic_tools_to_openai
  (L781-L848); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_anthropic_output_format_to_openai
  (L850-L887); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._add_additional_properties_false
  (L890-L921); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_midturn_system_message_to_openai
  (L923-L944); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._add_system_message_to_messages
  (L946-L979); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._supports_prompt_cache_key
  (L982-L990); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._target_declares_reasoning_effort
  (L993-L1015); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_metadata_to_openai
  (L1017-L1037); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_tool_choice_to_openai
  (L1039-L1052); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_stop_sequences_to_openai
  (L1054-L1064); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_tools_to_openai
  (L1066-L1099); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_thinking_to_openai
  (L1101-L1173); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._translate_output_format_to_openai
  (L1175-L1201); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter._copy_untranslated_anthropic_params
  (L1203-L1212). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 336 owned nonblank/non-comment/non-docstring Python lines (420 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 356 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 624 total within the 630-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B175 (Provider parameter capabilities
  and mapping), B178 (Tool argument parsing and schema transforms), B180 (Anthropic prompt and tool conversion helpers),
  B1087 (Api boundaries), B1117 (Messages content primitives), B962 (Messages thinking). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
