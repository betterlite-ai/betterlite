deviations: []
out_of_scope:
- B2431 owns tools/schema methods L763-L921,L1039-L1052,L1066-L1099,L1175-L1201 in adapters/transformation.py.
- B1117 owns primitives L25-L93,L213-L225,L357-L454,L672-L700,L1290-L1343; B964 owns L352-L353,L456-L639 messages.
- B966 owns output L1345-L1766; B967 owns L229-L345,L1214-L1288 composition. create_tool_name_mapping and translate_thinking_for_model have no caller at the pin.
- B962 owns reasoning_auto_summary config and session JSON parsing; B175 owns the threshold env vars and capability dispatch.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_chat_options in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_chat_options.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_chat_options.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- litellm_proxy is excluded from derived prompt cache keys but remains eligible for declared reasoning_effort.
- The system-list branch keeps empty text in the top-level prompt and drops it from an in-sequence system turn.
- The last passthrough copy can overwrite a translated effort or stop value; preserve that order.
review_level: standard
