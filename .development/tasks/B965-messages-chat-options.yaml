  why: The final copy can overwrite earlier translated values with unrecognized passthrough keys.
dod:
- text: >-
    thinking_budget_buckets maps non-dict thinking to none, {} and type=disabled to effort=none, type=adaptive
    to medium and unknown type to none. Enabled budget absent/0/1023 maps minimal; 1024/2047 low; 2048/4095 medium;
    4096/8192 high under B175's default thresholds. A changed B175 threshold is consumed, not duplicated here.
    Disabled thinking with summary=detailed stays plain none; enabled summary=concise yields {effort:low,summary:concise},
    empty summary falls through to the auto-summary flag, and enabled auto-summary produces summary=detailed.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    system_text_selection keeps nonempty in-sequence strings and text blocks, but skips empty text, non-text blocks
    and non-list/nonstring content. A top-level system list differs: a text block missing text becomes text=""
    and is inserted at messages index 0. Empty top-level system is skipped. Cache_control follows B1117 model rules;
    prompt_cache_breakpoint=false survives both paths. Top-level insertion does not merge an existing system message.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    metadata_user_and_session sets user to metadata.user_id verbatim, even null or empty when the key exists.
    A JSON user_id containing session_id=session_a additionally sets prompt_cache_key=session_a only for a nonempty
    model and resolved provider whose supported params contain prompt_cache_key. provider=litellm_proxy always
    suppresses that key; missing provider/model and a null capability list also suppress it. litellm_metadata={x:1}
    is popped from the input and stored in output metadata, independently of Anthropic metadata and even if null.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    claude_thinking_carriers keeps thinking={type:adaptive,display:updates} for a Claude target. For
    bedrock/anthropic.claude-sonnet-4-5, converse/anthropic.claude-sonnet-4-5, invoke/anthropic.claude-sonnet-4-5 or
    a Bedrock application-profile ARN, output_config={effort:high,format:{},other:7} becomes {effort:high,other:7}
    and no reasoning_effort is set. For vertex_ai/claude-sonnet-4-5 with reasoning_effort declared, effort=high
    becomes the plain string high while thinking keeps display; no effort produces no tier. A provider declaring
    thinking alone, or an absent provider, gets only thinking. litellm_proxy is allowed for this capability probe.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    nonclaude_thinking_carriers sends adaptive thinking and output_config.effort=high to gpt-4o and gets
    reasoning_effort=high, with summary wrapping when requested. Enabled thinking ignores output_config.effort
    and buckets budget_tokens instead. Falsey thinking skips the operation; disabled gives none without summary.
    For a Claude target with a non-adaptive thinking block, a supplied output_config.effort alone does not create
    reasoning_effort; the tier is carried only for adaptive thinking.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    passthrough_option_order maps stop_sequences=[END] to stop=[END], skips empty/null stop sequences, and copies
    max_tokens=0,stream=false,temperature=null and unknown=7 unchanged. The excluded keys are exactly messages,
    metadata,system,tool_choice,tools,thinking,output_format,output_config,stop_sequences. Explicit passthrough
    reasoning_effort=low or stop=[OVERRIDE] overwrites an earlier translated value when the final copy runs.
  proof: [behavior-tests, oracle, helper-python]
- text: The registered option helper compares capability-probe effects, metadata mutation and exact resulting kwargs.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: system or reasoning carrier branches have no native regression tests
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_options::/)'
  - id: helper-python
    why: option parity lacks the independent pinned method calls
    run: test -f tools/oracle/helpers/messages_chat_options.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the chat-options tag is absent from shared parser replay
    run: grep -qE '^[[:space:]]+messages_chat_options:' tools/oracle/fuzz/corpus/helper_case/messages_chat_options-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no new option-transform cases were committed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-chat-options)"
