deviations:
  - what: When a model is a Vertex partner model (e.g., anthropic models on Vertex), the setup returns None for the provider config to signal adapter fallback, and the caller handles the conversion to chat format.
    why: betterlite delegates provider routing to get_provider_google_genai_generate_content_config exactly as LiteLLM does. None means use the adapter, not an error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L10054-10060
  - what: The logging object is required at setup time and raises ValueError if missing, rather than being optional.
    why: All calls supply a logging object for proper request tracking, and the error is caught immediately rather than cascading later.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/main.py#L192-193
out_of_scope:
  - B3480 owns the provider config trait and methods that setup_generate_content_call calls.
  - B1368 owns the provider-specific trait implementations for GoogleGenAIConfig and VertexAIGoogleGenAIConfig.
  - B1306 owns VertexAIPartnerModels.is_vertex_partner_model check that setup calls.
  - B174 owns get_llm_provider that setup calls to resolve provider from model string.
  - B247 owns Logging.update_from_kwargs that setup calls to track request metadata.
  - The four actual GenAI call handlers (generate_content, agenerate_content, generate_content_stream, agenerate_content_stream) are owned by B3489, not this setup path.
  - mock_generate_content_response is owned by B3489 and called from generate_content to return a mock response when a string mock_response is supplied with stream=False.
  - Call execution and response transformation are owned by B3486, B3487 and B3488.
pitfalls:
  - The four top-level fields (safetySettings, toolConfig, cachedContent, labels) are extracted by name from B3480's get_generate_content_request_top_level_fields and passed verbatim to the merge function. Do not hard-code the field names.
  - _merge_native_request_fields must preserve empty extra_body={} dicts by returning them, not None. Return None only when both native_request_fields and extra_body are genuinely absent.
  - Vertex partner models like Anthropic must return None from get_provider_google_genai_generate_content_config to signal adapter fallback, not raise an error. This tells the caller to use the chat adapter, not the native path.
  - String mock responses must raise ValueError when stream is falsy, never return a mock response from setup. When stream=True, the check is skipped and setup proceeds normally. Callers check this and return the mock early before calling the setup path.
  - The logging object is required and never None at the setup point. A ValueError is raised immediately if missing, preventing silent None handling later.
  - Native field extraction must only include fields that are actually present in kwargs, not all four potential fields every time.
