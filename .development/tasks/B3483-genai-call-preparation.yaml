id: B3483
title: Resolve native GenAI calls and preserve top-level fields
description: >-
  Build call setup logic that prepares native GenAI requests by resolving provider configuration, extracting native REST fields from kwargs, and preserving explicit extra_body values.
  Implement setup_generate_content_call to unify the common setup path for all four GenAI call modes.
  The setup function should resolve the model's provider (Gemini, Vertex with native models, or other), select whether to use the native API or fall back to the chat adapter, and handle the missing-logger error when a logger object is required.
  Implement get_provider_google_genai_generate_content_config to dispatch on provider type, return None for non-partner Vertex partner models to signal adapter fallback, and return the native provider config for Gemini and non-partner Vertex models.
  Implement _merge_native_request_fields to overlay native top-level fields into extra_body with explicit extra_body values winning on conflict, preserving empty extra_body dicts and returning None only when there is genuinely nothing to forward.
  Implement _mark_async_entrypoint to record async entry point markers in the logging object's model_call_details.
  Build the GenerateContentSetupResult record holding all outputs: resolved model, custom_llm_provider, request body, provider config, native request fields, config dict, litellm_params, logging object and call ID.
  Preserve the string mock response path that raises ValueError when a mock_response is a string and stream is falsy (handlers reject it and return the mock early; the setup path never returns a mock response). With stream=True, the check is skipped and setup proceeds normally.
  Extract only the named top-level fields from kwargs when they are present, leaving all others as config dict entries for optional params.
