dod:
  - text: setup_generate_content_call resolves the model's provider and returns the correct GenerateContentSetupResult with provider config for Gemini and non-partner Vertex models, or None config for partner models and other providers.
    proof: [setup-provider-dispatch]
  - text: The setup result includes all native REST top-level fields that were present in kwargs, extracted by name from B3480's get_generate_content_request_top_level_fields.
    proof: [native-field-extraction]
  - text: Native request fields are merged into extra_body with explicit extra_body values taking precedence, and _merge_native_request_fields returns None only when there are no fields and no extra_body.
    proof: [merge-field-precedence]
  - text: Mock response rejection preserves the ValueError when a string mock_response is supplied with stream=False, while setup proceeds normally when stream=True, never returning a mock from the setup path.
    proof: [mock-response-rejection]
  - text: The logging object is required and raises ValueError when missing, and is correctly updated with optional params, model and call metadata.
    proof: [logging-required-and-updated]
  - text: The setup function correctly calls B3480's provider config methods and B1368's transform methods to construct the request body.
    proof: [provider-config-calls]
checks:
  optional: []
  commands:
    - id: setup-provider-dispatch
      why: Provider dispatch and config selection are missing or return incorrect result for native vs adapter paths
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^genai_setup::.*provider_dispatch/) and not test(/replays/)'
    - id: native-field-extraction
      why: Top-level native fields are not extracted from kwargs or missing required fields
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^genai_setup::.*native_fields/) and not test(/replays/)'
    - id: merge-field-precedence
      why: Native fields are not merged correctly or precedence is wrong when extra_body is present
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^genai_setup::.*merge/) and not test(/replays/)'
    - id: mock-response-rejection
      why: String mock responses are not rejected with ValueError or mock response is returned from setup path
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^genai_setup::.*mock/) and not test(/replays/)'
    - id: logging-required-and-updated
      why: Logging object is not required or is not correctly updated with model, optional params and call metadata
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^genai_setup::.*logging/) and not test(/replays/)'
    - id: provider-config-calls
      why: Provider config methods or B3480/B1368 transforms are not called correctly to construct the request body
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^genai_setup::.*request_body/) and not test(/replays/)'
