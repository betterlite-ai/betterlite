    why: CachePredictionArm, CacheCostScenario, CacheTokenBuckets, CacheEvidence response types
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/prompt_cache_prediction.py#L10-L20
    why: has_request_transforms implementation for transform eligibility checking

dod:
  - text: price_cache_tokens selects custom deployment tariff via _select_model_name_for_cost_calc, validates all required prices per token buckets, and returns None on any missing price or invalid completion_tokens.
    proof: [pricing-validation-cases]
  - text: _valid_price returns true only for non-negative finite numbers (excluding booleans).
    proof: [price-validation-cases]
  - text: _has_required_prices checks input_cost_per_token (always required), cache_read_input_token_cost (if cache_read_tokens > 0), cache_creation_input_token_cost (if 5m creation tokens > 0), cache_creation_input_token_cost_above_1hr (if 1h creation tokens > 0), output_cost_per_token (if completion_tokens > 0), and all *_above_* variants matching required bases.
    proof: [required-prices-cases]
  - text: AnthropicCacheRouting.request_body validates URL ends with /v1/messages, checks supported_prediction_headers, merges body and request_kwargs with native options, and returns typed validated JSON.
    proof: [request-body-cases]
  - text: AnthropicCacheRouting.from_body parses max_tokens as positive integer, calls parse_prompt, and returns None if prefix or max_tokens missing/invalid.
    proof: [from-body-cases]
  - text: AnthropicCacheRouting.supports returns true only when resolve_prediction_target returns NativePredictionTarget.
    proof: [supports-cases]
  - text: AnthropicCacheRouting.is_warm returns true only when observation is found, fingerprint matches, and expires_at > now.
    proof: [is-warm-cases]
  - text: AnthropicCacheRouting.fits returns true only when both max_input_tokens and max_output_tokens are present and fit the request within limits.
    proof: [fits-cases]
  - text: AnthropicCacheRouting.predict calls predict_arm and returns a CachePredictionArm with all three scenarios or a reason why prediction failed.
    proof: [predict-cases]
  - text: AnthropicCacheRouting.cost calls price_cache_tokens with arm.estimate tokens and output_tokens, returns None if estimate unavailable.
    proof: [cost-cases]
  - text: AnthropicCacheRouting.count_tokens calls count_prompt_tokens with deployment API key and returns token count or None on failure.
    proof: [count-tokens-cases]
  - text: _buckets builds CacheTokenBuckets with correct token distribution per TTL, assigning creation tokens only to matching 5m or 1h bucket.
    proof: [buckets-cases]
  - text: _scenario calls price_cache_tokens and returns CacheCostScenario with tokens and cost, or None if pricing fails.
    proof: [scenario-cases]
  - text: predict_arm determines cache_state (warm/partial/stale/unknown/disabled), reason, and constructs all three scenarios with pinned_billing_time for cold, warm and estimate, returning unknown with appropriate reason on any failure.
    proof: [predict-arm-cases]
  - text: predict_arm returns disabled state with below_cache_minimum reason when cacheable tokens are less than minimum, with disabled scenario repeated across all three arms.
    proof: [minimum-tokens-cases]
  - text: has_request_transforms returns true when custom loggers exist with overridden pre-call/pre-request/pre-deployment hooks beyond built-in implementations.
    proof: [transforms-cases]
  - text: CacheTokenBuckets.total_tokens sums all four token bucket fields (uncached, cache_read, 5m_creation, 1h_creation).
    proof: [total-tokens-cases]

