    why: Core pricing logic for cache token scenarios, price validation and cost computation
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/cache_aware_routing.py#L65-L236
    why: AnthropicCacheRouting service, cache state determination, and predict_arm orchestration
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/cache_aware_routing.py#L1-L64
