oracle_cases: []

deviations:
  - what: price_cache_tokens returns None on any pricing failure, including missing model_info or custom tariff lookup, rather than falling back to catalog.
    why: "LiteLLM's completion_cost tries catalog as fallback; betterlite follows explicit tariff selection (B1682/B2225 owned behavior) and returns None when tariff resolution or pricing validation fails, so cache prediction itself can report the reason to the user."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/prompt_cache_pricing.py#L99-L100"

out_of_scope:
  - "LiteLLM's per-provider count_prompt_tokens implementations; B3121 owns count_prompt_tokens service contract and B585 owns Anthropic count-tokens handler."
  - "Observation lookup and caching; B3122 owns lookup and PromptCacheObserver."
  - "Prompt parsing and cache plan prediction; B3120 owns parse_prompt, PromptPrefix and PromptCachePlan."
  - "Cache-aware routing model selection and deployment filtering; B3124 owns eligible_models, candidate selection and choose_cached_model orchestration."
  - "Management endpoints for predict-cache and prompt-caching-requests routes; B3125 owns the route registrations and HTTP adapter."
  - "Authorization checks and model allowlist filtering; B886 and B732 own those decisions."
  - "Cost calculation for non-cache scenarios; B068 and B2225 own completion_cost and tariff resolution."
  - "Minimum prompt cache token threshold with env-var override and default fallback (get_prompt_cache_min_tokens); B157 (unplanned)."

pitfalls:
  - "price_cache_tokens returns None for negative completion_tokens, even when other prices are valid; the sign check comes before price validation."
  - "required prices map names use underscores and include _above_ variants, not hyphens; the cache_creation check keys split 5m and 1h TTLs into separate field names."
  - "_has_required_prices checks not whether a price exists in the mapping, but whether its value passes _valid_price, so a zero price counts as present."
  - "_buckets creation tokens go into 5m or 1h bucket only if TTL matches exactly (300 or 3600 seconds); mismatched or zero TTL puts all creation tokens in the disabled bucket."
  - "AnthropicCacheRouting.is_warm requires both fingerprint match AND expiry check; a fresh observation with mismatched fingerprint is not warm."
  - "predict_arm uses observation.cached_tokens for the cacheable estimate and read count, not the prefix token count; inconsistent values between observations trigger inconsistent_prefix_token_count reason."
  - "pinned_billing_time wraps all three scenario price calls; the billing instant is identical across cold, warm and estimate, not re-evaluated per scenario."
  - "cache_state determined as warm only when observation is fresh AND exact; partial (fresh but stale fingerprint) and stale (expired observation) are distinct states."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 1
