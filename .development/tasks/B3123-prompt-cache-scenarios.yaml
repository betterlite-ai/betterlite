id: B3123
title: Price cache scenarios and expose native routing predictions
description: >-
  Implement `betterlite-anthropic::cache_aware_routing` to build typed cache cost scenarios
  and the `AnthropicCacheRouting` service, with model/usage DTOs and injected counting,
  observation and cost services. Preserve unknown/disabled/stale/partial/warm cache state
  distinctions, custom deployment pricing via `_select_model_name_for_cost_calc`, zero-versus-missing
  price handling, minimum-prefix checks via `get_prompt_cache_min_tokens`, and the common
  billing timestamp (pinned_billing_time) for cold, warm and estimate scenarios. The published
  basis remains input cost before discounts and margins. Pricing functions validate required
  prices per scenario token buckets, read from custom deployment tariffs before catalog,
  and return None on any missing price field or completion_tokens mismatch.

