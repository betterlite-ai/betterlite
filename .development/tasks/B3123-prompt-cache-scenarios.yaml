    - crates/betterlite-anthropic/src/cache_aware_routing.rs
    - crates/betterlite-anthropic/src/cache_aware_routing/**
    - crates/betterlite-core/src/cost/prompt_cache_scenarios.rs
    - crates/betterlite-core/src/cost/prompt_cache_scenarios/**
    - tools/oracle/cases/prompt-cache/**
  lint_tables: false

