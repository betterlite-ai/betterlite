id: B210
title: OpenAI-compatible defaults A
description: >-
  Implement the pure configured-base/credential precedence table for _get_openai_compatible_provider_info branches
  from JSON registry precedence and perplexity through litellm_proxy (lines 566-757) under src/provider_defaults_a.rs.
  Follow each called XConfig._get_openai_compatible_provider_info at the pin, representing default URLs, environment-key
  precedence and model/provider rewrites as typed entries over B209 ProviderId. Inject values already resolved by
  config; never read environment here or instantiate a provider. Each branch gets one helper case and a named rstest
  row, with explicit overrides and missing credentials covered. Generate one operation invocation per YAML case
  rather than packing multiple providers into one input. JSON registry identities use pinned MIT registry data;
  executable adapters are separate. Exclude github_copilot/chatgpt OAuth providers from executable oracle cases.
  Budget 280 table/resolution, 140 adapters, 300 tests and 40 wiring (760 total). Write the behavior rstest functions
  b210_behavior_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure in the
  DoD; corpus replay tests have separate names. Register helper operations provider_defaults_a in tools/oracle/src/helpers/mod.rs
  and tools/oracle/helpers/dispatch.py; each operation has its own Rust and Python adapter file and corpus seed.
  The complete branch case list is constructed from this bounded reference range and must include every elif provider
  literal, with distinct filenames named after the provider.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-provider/Cargo.toml
  - crates/betterlite-provider/src/lib.rs
  - crates/betterlite-provider/src/error.rs
  - crates/betterlite-provider/src/provider_defaults_a.rs
  - crates/betterlite-provider/src/provider_defaults_a/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/provider-defaults-a/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L566-L757
  why: Exact default table branch ownership.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::b210_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'provider_defaults_a' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/provider-defaults-a/explicit-overrides.yaml
- tools/oracle/cases/helpers/provider-defaults-a/environment-precedence.yaml
- tools/oracle/cases/helpers/provider-defaults-a/missing-key.yaml
- tools/oracle/cases/helpers/provider-defaults-a/model-rewrite.yaml
deviations: []
out_of_scope:
- >-
  Identity and prefix parsing B209; final get_llm_provider integration B174; github_copilot/chatgpt authentication
  flows B045/B159, never called by these tests.
pitfalls:
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
