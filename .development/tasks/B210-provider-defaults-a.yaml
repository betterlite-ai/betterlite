pitfalls:
- 'The oracle helper for this task is pre-registered as provider_defaults_a in the models group. Replace the stub Op in tools/oracle/src/helpers/models/provider_defaults_a.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/provider_defaults_a.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
