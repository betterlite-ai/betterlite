id: B3344
title: Video content and remix HTTP routes
description: >-
  Register GET /v1/videos/{video_id}/content, GET /videos/{video_id}/content, POST /v1/videos/{video_id}/remix and POST /videos/{video_id}/remix exactly once,
  in betterlite-server::api::video_content_remix_routes, filled into the stub module crates/betterlite-server/src/routes/video_content_remix.rs.
  Do not touch the other video routes: B3343 owns create, list and status, B3345 owns the character routes. Do not edit routes.rs or state.rs, B1100 declares the stub.
  Both routes sit behind the virtual key authentication of B052, and a missing or wrong key answers 401 before any route code runs.
  The calls behind them are B3339 (video_content, avideo_content) and B3340 (video_remix, avideo_remix) in betterlite-core. Fill the two core dispatch entries B014 registers for them,
  operation/video_content.rs with dispatch/video_content.rs and operation/video_remix.rs with dispatch/video_remix.rs. The content entry sends route type avideo_content and its result is the raw bytes. The remix entry sends route type avideo_remix and its result is the video object as JSON.
  B004 owns the common request processing and the exception handling (LiteLLM's ProxyBaseLLMRequestProcessing and _handle_llm_api_exception). These routes only build the data map and hand it over.

  Content route steps, in order. (1) Start data as {video_id}. The video_id is the whole path segment. (2) Call B672 decode_video_id_with_provider(video_id) and keep its custom_llm_provider and model_id.
  (3) Pick custom_llm_provider as the first truthy value of: the custom-llm-provider header, the custom_llm_provider query parameter (both from B2400), the custom_llm_provider key of the JSON body (B2400, which reads the body through B1100), the provider from the decoded id. The body is only read when the header and the query are both empty, and a malformed body then fails with the 400 invalid_request_error from B1100 before the processing try block.
  (4) When the pick is truthy, set data["custom_llm_provider"]. (5) When the decoded model_id is truthy and a router is loaded, call B844 resolve_model_name_from_model_id; when it gives a name, set data["model"]. (6) Call the common processing with route type avideo_content and model none.
  (7) Return a new response with the bytes as the body, media type video/mp4 and the single header Content-Disposition: attachment; filename=video_{video_id}.mp4. The step is inside the same try as the processing, so a failure goes through the common exception handling.
  Nothing else from the query reaches the call: variant, extra_query and every other query key are dropped, because data is only built from the steps above.

  Remix route steps. (1) Read the JSON body with B1100 before any try block, and set data["video_id"] to the path segment (the path wins over a body video_id). (2) Decode the id as above. (3) Pick custom_llm_provider as the first truthy value of: the header, the query, data["custom_llm_provider"] from the body, the provider from the decoded id.
  (4) When the pick is truthy, overwrite data["custom_llm_provider"]; when none is truthy, the body's own falsy value stays. (5) Resolve the model from the decoded model_id exactly as in the content route, and a resolved name replaces a body "model". (6) Call the common processing with route type avideo_remix and model none, and return its result unchanged.
  The body is not validated here: prompt, extra_body and the rest go straight to the call. A JSON body that is not an object fails before the try block and is not shaped by the common exception handling; mirror what LiteLLM returns and record it in a case.

  Why the video calls need no model: when data has no model, the dispatch calls the SDK function directly with custom_llm_provider (route_llm_request.py), and when a model was resolved it tries the router first and falls back to the direct call on any router error. B014 owns that dispatch; this task only fills the two entries so both paths reach B3339 and B3340.

  Tests: rstest functions named content_route_behavior, remix_route_behavior and provider_pick_behavior in api::video_content_remix_routes (betterlite-server), with a mock upstream server and fake collaborators for the model resolver and the calls, one named case per DoD item. Core entry tests are named video_entry_behavior.
  The task parses no new bytes (B1100 owns the body decoder), so there is no fuzz target. Oracle cases are plain HTTP cases through the booted proxy, in tools/oracle/cases/api/video-content-remix-routes, with the mock provider as the openai upstream (config api_base "{{upstream}}", master key oracle-master as in tools/oracle/cases/chat/upstream-429.yaml).
  The OpenAI video config calls GET {api_base}/videos/{original_id}/content and POST {api_base}/videos/{original_id}/remix with JSON {"prompt": ...}.
  Encoded ids for the cases, all built as "video_" plus base64 of "litellm:custom_llm_provider:<provider>;model_id:<model or empty>;video_id:<id>": openai with model sora-2 and id video_123 is bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOm9wZW5haTttb2RlbF9pZDpzb3JhLTI7dmlkZW9faWQ6dmlkZW9fMTIz,
  openai with no model and id video_456 is bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOm9wZW5haTttb2RlbF9pZDo7dmlkZW9faWQ6dmlkZW9fNDU2 (use the literal prefix "video_" in front when the case sends it as a path segment).
  B3343 left the status and generation cases to itself and left the content HTTP cases to this task.
