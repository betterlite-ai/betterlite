dod:
  - text: >-
      content_route_aliases: GET /videos/video_123/content and GET /v1/videos/video_123/content with the master key each make one upstream GET to /videos/video_123/content.
      Both answer 200 with the upstream bytes, content-type video/mp4 and content-disposition "attachment; filename=video_video_123.mp4".
    proof: [route-tests, oracle, new-cases]
  - text: >-
      content_response_headers: the client gets no x-litellm-* header written by the common processing, because the route returns a new response, and the upstream content-type is replaced by video/mp4.
    proof: [route-tests, oracle]
  - text: >-
      content_provider_pick: the header wins over the query, the query over a body custom_llm_provider, the body over the provider inside an encoded id; an empty header falls through. The body is not read while the header or query is set.
    proof: [route-tests, oracle]
  - text: >-
      content_drops_query: GET .../content?variant=thumbnail reaches the upstream without a variant query, as in LiteLLM.
    proof: [route-tests, oracle]
  - text: >-
      remix_route_aliases: POST /videos/video_123/remix and POST /v1/videos/video_123/remix with {"prompt":"new"} each make one upstream POST to /videos/video_123/remix with JSON {"prompt":"new"} and return the upstream video object with status 200.
    proof: [route-tests, oracle, new-cases]
  - text: >-
      remix_provider_and_model: an encoded id with provider openai and model_id sora-2 sets custom_llm_provider and, when sora-2 is a configured model name or the tail of a configured litellm_params.model, sets data model so the deployment's api_base is used; an unresolved model_id keeps a body "model".
      A body video_id never overrides the path id. A header, query or body provider beats the decoded one.
    proof: [route-tests, oracle]
  - text: >-
      content_remix_failures: an upstream 404 on content and on remix, a malformed JSON remix body, and an encoded id naming an unknown provider give the same status, error.type, error.param and error.code as LiteLLM (message text ignored). A malformed body is rejected before any upstream request.
    proof: [route-tests, oracle]
  - text: >-
      content_remix_auth: no Authorization header and a wrong Bearer key give 401 auth_error with param "None" and code "401" on all four paths, with zero upstream requests; GET on the remix paths and POST on the content paths give 405.
    proof: [route-tests, oracle]
  - text: The video_content and video_remix core entries call B3339 and B3340, return bytes and the video object, and no longer answer NotBuilt.
    proof: [entry-tests]
checks:
  optional: []
  commands:
    - id: route-tests
      why: the four routes, the provider and model picks or the content response are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_content_remix_routes::/)'
    - id: entry-tests
      why: the core video_content and video_remix entries are still stubs
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^(operation|dispatch)::video_(content|remix)::/)'
    - id: new-cases
      why: the branch added no booted-proxy cases for these routes
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/video-content-remix-routes)"
