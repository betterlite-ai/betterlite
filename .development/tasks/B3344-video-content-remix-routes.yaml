  - tools/oracle/cases/api/video-content-remix-routes/content-route-aliases.yaml
  - tools/oracle/cases/api/video-content-remix-routes/content-provider-pick.yaml
  - tools/oracle/cases/api/video-content-remix-routes/content-drops-query.yaml
  - tools/oracle/cases/api/video-content-remix-routes/remix-route-aliases.yaml
  - tools/oracle/cases/api/video-content-remix-routes/remix-provider-and-model.yaml
  - tools/oracle/cases/api/video-content-remix-routes/content-remix-failures.yaml
  - tools/oracle/cases/api/video-content-remix-routes/content-remix-auth.yaml
deviations: []
out_of_scope:
  - "B3343 owns POST/GET /videos and GET /videos/{video_id}, with their cases. B3345 owns the character routes. The edits and extensions routes in the same file have no task yet, see the planner notes."
  - "B3339 and B3340 own the call functions, B3334 the remix transport and B3333 the content transport; B672 owns the id codec; B844 owns resolve_model_name_from_model_id."
  - "B004 owns the common request processing, response headers and exception handling; B2400 the provider accessors; B1100 the body read; B052 authentication."
  - "video_reference_to_id, extract_model_from_target_model_names, get_custom_provider_from_data and encode_character_id_in_response in video_endpoints/utils.py are not used by these two routes."
pitfalls:
  - The content route returns a new response, so custom headers set by the common processing are lost and only Content-Disposition is added.
  - The content filename is video_{video_id}.mp4 with the full path segment, so a segment that already starts with video_ gives video_video_123.mp4.
  - The content route reads the JSON body of a GET only when the header and query provider are empty, and a bad body then answers 400 invalid_request_error with param request_body.
  - Remix overwrites a body custom_llm_provider only with a truthy header, query or decoded provider, so an empty body value survives otherwise.
  - Content never forwards variant, even though the OpenAI config builds ?variant= when the call receives one.
  - The body video_id in remix is replaced by the path segment, and a resolved model replaces a body model.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
