id: B1343
title: Vertex multimodal embedding pairing and media usage
description: >-
  Implement multimodal_embedding_records from all methods in multimodal_embeddings/transformation.py
  (255 nonblank noncomment lines) and vertex_ai.py L526-L568 instance/prediction declarations.
  Reuse B006 embedding output types. Media detection uses substring gs://, substring mp4 for
  video and the pinned data:-only base64 predicate: decode split(',')[1] strictly and require
  canonical re-encoding equality; it is not a URL or file-extension parser.
  A text element merges only with the immediately following media string, consuming both;
  leading media remains standalone. Mapping-valued inputs pass through as native instances.
  Explicit optional_params.instances wins over input. A scalar string replaces the optional
  instance fields; dimensions becomes parameters.dimension through outputDimensionality.
  Image base64 strings with commas use split(',')[1], not the full remainder. Headers force
  Content-Type=application/json; charset=utf-8 and Authorization after caller headers.
  Complete replies require status 200 and predictions, with missing predictions producing
  InternalServerError. Choose textEmbedding before imageEmbedding before videoEmbeddings;
  each video segment keeps its prediction's index. Usage tokens stay zero; character_count
  counts non-whitespace characters in concatenated truthy text, image_count counts truthy image
  objects, and video_length_seconds sums every endOffsetSec-startOffsetSec using exact decimals.
  Empty text leaves character_count absent. Use decode_multimodal_embedding for bounded response
  JSON and classify_embedding_media for bounded base64 recognition, both exercised by the
  multimodal_embedding fuzz target. Pure helper multimodal_embedding_records compares
  text_then_image, image_then_text, substring_video, explicit_instances, text_vector_precedence,
  repeated_video_index and whitespace_character_usage. Budget 290 mapping/decoder, 180 tests,
  110 adapters and 90 fuzz lines, maximum 750.
scope:
