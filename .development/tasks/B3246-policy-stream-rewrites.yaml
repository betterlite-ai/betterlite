id: B3246
title: Pipeline streaming rewrite observation and legacy adaptation
description: >-
  Build streaming guardrail rewrite adapters that sit between pipeline steps and endpoint translations,
  observing whether unified guardrails or legacy post-call hooks rewrote the streamed response.
  Deliver text and tool-call rewrites on translations that support ended-stream write-back
  (those with delivers_ended_stream_rewrites = true); for translations without write-back,
  or rewrites that drop/add tool calls, discard the rewrite and release the original buffered chunks
  with a warning so the client gets the unmodified stream.
  Legacy guardrails (those with no apply_guardrail or use_native_lifecycle_hooks = true) run their
  post-call hooks against the assembled response through an adapter that rescans it with the translation
  to detect whether the hook changed texts or tool calls. Guardrails without streaming capability
  continue running on their own. Preserve the executor's pass/fail classification for exceptions,
  the translation's empty-input handling (tool-only streams stay deliverable), and the absence
  of the guardrail from the applied-guardrails header when its rewrite was discarded.
  Wire capability checks and callback lookup here so streaming adaptation does not depend on the
  step runner orchestration.
scope:
  paths:
    - crates/betterlite-core/src/guardrails/streaming_rewrite.rs
    - crates/betterlite-core/src/guardrails/streaming_rewrite/**
    - tools/oracle/cases/streaming/**
    - Cargo.toml
    - tools/oracle/helpers/b3246.py
    - tools/oracle/helpers/b3246/**
    - tools/oracle/src/helpers/core_ops/b3246.rs
    - tools/oracle/src/helpers/core_ops/b3246/**
  lint_tables: false
