  - tools/oracle/cases/streaming/unified-text-rewrite.yaml
  - tools/oracle/cases/streaming/unified-tool-rewrite.yaml
  - tools/oracle/cases/streaming/legacy-hook-text-rewrite.yaml
  - tools/oracle/cases/streaming/legacy-hook-tool-rewrite.yaml
  - tools/oracle/cases/streaming/rewrite-undeliverable-no-writes.yaml
  - tools/oracle/cases/streaming/rewrite-undeliverable-count-change.yaml
  - tools/oracle/cases/streaming/rewrite-rescanned-mismatch.yaml
  - tools/oracle/cases/streaming/empty-stream-no-rewrite.yaml
deviations:
  - what: betterlite logs discard reasons to stderr through tracing instead of verbose_proxy_logger, so the warning format differs.
    why: betterlite uses structured JSON logging for observability; LiteLLM's proxy_logger is Python-only.
  - what: betterlite does not log the step guardrail name in every streaming step execution; only discards log.
    why: The full step-by-step logging lives in the executor (B3247), not the rewrite adapter. The adapter only logs exceptional cases (discards).
out_of_scope:
  - "B3247 owns execution orchestration (_run_step, _prepare_hook_input) and when _run_streaming_step is called, how streaming steps are chosen, and on_error/on_fail fallback."
  - "B888 (or the concrete endpoint-translation task) owns BaseTranslation.post_call_hook_response, process_output_response, process_output_streaming_response methods and delivers_ended_stream_rewrites class attribute."
  - "B189 owns callback registration, discovery in litellm.callbacks, and add_guardrail_to_applied_guardrails_header function in callback_utils.py."
  - "B3664/B3665/B3666 (split from B104) own CustomGuardrail class definition, apply_guardrail and async_post_call_success_hook methods, and use_native_lifecycle_hooks, records_own_guardrail_information, structured_messages_cover_full_request attributes."
  - "B3679-B3681 (split from B104) own UnifiedLLMGuardrails lifecycle hooks and pre/post hook interface that _run_step coordinates."
  - "B164-B165 own CustomLogger base class and lifecycle contract."
  - "B3247 owns CustomGuardrail._is_guardrail_intervention and exception handling classification beyond UndeliverableStreamRewrite."
pitfalls:
  - A _LegacyHookStreamAdapter wraps the guardrail to run its post-call hook only; the hook's lifecycle exceptions are caught by the executor, not the adapter.
  - _ScannedTextRecorder is a dummy guardrail; it must mark its methods as recorded_own_guardrail_information=false so the executor doesn't skip the real guardrail's logging.
  - Tool-call detection uses model_dump() on BaseModel and get("function") on dicts; a tool call that is not a dict or lacks a function key becomes (None, None) without error.
  - The originals deepcopy must happen before hook_input.pop("response"), so a legacy hook cannot accidentally see a leftover response from a prior step.
  - add_guardrail_to_applied_guardrails_header is called only when the observer confirms no discard; if discarded, the step result must show the guardrail never ran.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
