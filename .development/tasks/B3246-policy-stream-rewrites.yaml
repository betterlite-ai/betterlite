    why: supports_unified_execution, supports_streaming_execution, find_guardrail_callback capability checks.
dod:
  - text: UndeliverableStreamRewrite exception captures the guardrail name and discard reason, with __str__ matching LiteLLM's message format.
    proof: [streaming-rewrite-oracle, helper-python]
  - text: _StreamRewriteObserver detects text rewrites, tool-call rewrites, and tool-call count changes, and reports discard reason on translations without write-back.
    proof: [streaming-rewrite-oracle, helper-python]
  - text: _LegacyHookStreamAdapter runs a legacy post-call hook against the assembled response, rescans it, and raises UndeliverableStreamRewrite on text/tool-call mismatch.
    proof: [streaming-rewrite-oracle, helper-python]
  - text: _release_original_chunks restores the original buffered chunks and logs a warning with the guardrail name and discard reason.
    proof: [streaming-rewrite-oracle, helper-python]
  - text: _run_streaming_step wraps the guardrail, coordinates the translation, detects and releases unrewritable rewrites, and calls add_guardrail_to_applied_guardrails_header only when the rewrite is deliverable.
    proof: [streaming-rewrite-oracle, helper-python]
  - text: >-
      supports_unified_execution checks for apply_guardrail in the type dict and use_native_lifecycle_hooks false.
      supports_streaming_execution checks for unified support or post-call-hook-only with no streaming-iterator override.
      find_guardrail_callback looks up a registered guardrail by name from litellm.callbacks.
    proof: [streaming-rewrite-oracle, helper-python]
  - text: Every helper function for text/tool-call inspection and comparison preserves LiteLLM's exact mismatch reporting and count-change detection.
    proof: [streaming-rewrite-oracle, helper-python]
  - text: Streaming cases test unified guardrails, legacy hooks, rewrites on deliverable/undeliverable translations, and count changes.
    proof: [streaming-rewrite-oracle, helper-python]
checks:
  optional: []
  commands:
    - id: streaming-rewrite-oracle
      why: streaming rewrite cases fail or oracle adapter is missing
      run: |-
        cargo nextest run --locked -p betterlite-core -p betterlite-server --no-tests=fail -E 'test(streaming_rewrite)' \
        && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/helpers/b3246)" \
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail
    - id: helper-python
      why: Python oracle helper adapters fail strict Python checks
      run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
