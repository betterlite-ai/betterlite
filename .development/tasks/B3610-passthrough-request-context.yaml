deviations:
- what: >-
    Trace context injection is a no-op when the litellm.integrations.otel module is not
    available; headers are returned unchanged. betterlite does not mandate OpenTelemetry
    integration; it is optional.
  why: >-
    This follows LiteLLM's behavior exactly. Tracing is an optional feature, and gateways
    must not require external instrumentation.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L2303-L2308
- what: >-
    Callback resolution logs exceptions at error level but continues without dynamic callbacks,
    since a broken logging config must not break the upstream passthrough request. The websocket
    is already accepted by the time this runs.
  why: >-
    This follows LiteLLM's behavior. Callback validation failures are recoverable; the
    request proceeds without those callbacks rather than failing the customer's call.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L828-L841

out_of_scope:
- >-
  The SESSION_ID_OMITTED_METADATA_KEY constant is imported from a shared logging module
  (owned by B206); this task calls it but does not define it.
- >-
  The LiteLLMProxyRequestSetup.get_sanitized_user_information_from_key and
  LiteLLMProxyRequestSetup.get_logged_api_key methods are imported from auth modules
  (owned by B1106); this task calls them but does not implement them.
- >-
  The request_dispatched_to_pass_through_endpoint function is imported from a shared
  logging module (owned by B746); this task calls it in _init_kwargs_for_pass_through_endpoint
  to skip budget tracking on user-defined routes.
- >-
  The get_metadata_variable_name_from_kwargs and get_or_create_metadata_bucket functions
  are imported from a shared metadata module (owned by B206); this task calls them
  in _carry_guardrail_logging_info.
- >-
  The _get_dynamic_logging_metadata function is imported from a shared callback metadata
  module (owned by B1109); this task calls it in _resolve_team_callback_wiring.
- >-
  The should_redact_message_logging function is imported from a shared redaction module
  (owned by B188); this task calls it in _log_passthrough_upstream_failure to substitute
  the upstream_error_body with REDACTED_BY_LITELLM, affecting both the logged warning and
  the HTTPException detail returned to the caller.
- >-
  The TRUSTED_CALLBACK_VARS_FIELD constant is imported from litellm/types/litellm_params.py
  (owned by B120); validate_no_callback_env_reference is imported from logging callback modules;
  this task uses them but does not implement them.
- >-
  The PASSTHROUGH_UPSTREAM_ERROR_BODY_MAX_LOG_CHARS constant is defined in a shared module;
  this task reads it but does not define it.
- >-
  The REDACTED_BY_LITELLM constant and verbose_proxy_logger are imported from shared logging
  modules; this task uses them but does not define them.
- >-
  The proxy_logging_obj global is accessed from litellm.proxy.proxy_server; this task calls
  its post_call_failure_hook method in _log_passthrough_upstream_failure and _relay_reporting_failures.

pitfalls:
- >-
  The _init_kwargs_for_pass_through_endpoint function must set internal keys AFTER merging
  client-supplied metadata, so a request body that mirrors user_api_key, parent_otel_span,
  etc. cannot clobber the authenticated values. Stamp them on _metadata after the merge.
- >-
  The per-model budget tracking is skipped only on user-defined pass-through routes, not on
  built-in provider routes. Use request_dispatched_to_pass_through_endpoint to distinguish them.
- >-
  The _carry_guardrail_logging_info function uses setdefault() to initialize the target list
  only if missing; if the key is already populated, new entries are silently discarded, never appended.
- >-
  The _resolve_team_callback_wiring function must not raise exceptions even if callback
  resolution fails; catch all exceptions, log at error level, and return an empty _TeamCallbackWiring.
  The websocket is already accepted by the time this runs, so failures cannot be returned to the caller.
- >-
  The _truncate_upstream_error_body and _sanitize_upstream_error_body functions are applied
  independently; always sanitize before truncating (sanitize first, then truncate the result)
  to avoid preserving non-printable characters at the truncation point.
- >-
  The _error_body_preview_and_relay function must handle UTF-8 decoding errors gracefully
  with errors='replace', not errors='ignore', so invalid sequences are visible as replacement
  characters rather than silently dropped.
- >-
  The _read_error_body_preview function must check total bytes AFTER appending each chunk,
  not before, so it collects at least one chunk even if the first chunk exceeds the budget.
- >-
  The _headers_without_body_framing function uses .lower() on header names for case-insensitive
  comparison; httpx.Headers.raw is a list of (name_bytes, value_bytes) tuples, not dicts.
- >-
  The _log_passthrough_upstream_failure function logs upstream errors at warning level (not error),
  must skip logging if status_code < 400, and must substitute REDACTED_BY_LITELLM for the error
  body when should_redact_message_logging applies; the redacted text flows into both the logged
  warning and the HTTPException detail.
- >-
  The _relay_reporting_failures function must call post_call_failure_hook only if upstream_status < 400,
  so it does not double-log upstream failures that _log_passthrough_upstream_failure already logged.
- >-
  The _update_metadata_with_tags_in_header function reads both 'tags' and 'x-litellm-tags' headers
  and concatenates them; both are comma-separated and must be stripped before extending the list.
  Do not create the 'tags' key if neither header is present.
- >-
  The _with_trace_context function calls inject_trace_context with parent_span passed through,
  not parent_span=parent_span if the function signature changed.

review_level: security

