id: B3610
title: Pass-through request metadata and failure relay
description: >-
  Prepare request logging metadata, callback provenance and bounded upstream error previews,
  then replay consumed prefixes before the rest of a failed response. Keep trace context and
  team callback setup reusable by HTTP and WebSocket lifecycles.

  Implement _init_kwargs_for_pass_through_endpoint to extract litellm_params from the request
  body, merge authenticated-key metadata with request-supplied metadata, stamp internal keys
  (user_api_key, parent_otel_span, budget_reservation, model_access_groups), skip per-model
  budget tracking on user-defined pass-through routes, and return a typed kwargs dict with
  litellm_params, call_type, litellm_call_id and passthrough_logging_payload. Preserve the
  behavior that SESSION_ID_OMITTED_METADATA_KEY is not user-clobberable, and model_call_details
  holds the passthrough_logging_payload for later logging.

  Implement _carry_guardrail_logging_info to copy guardrail logging entries from hook_data
  to request_data when guardrails block; missing guardrail data is a no-op. Extract the
  standard_logging_guardrail_information from guardrail_data, call get_or_create_metadata_bucket,
  and initialize the target metadata list via setdefault only if missing; new entries are
  silently discarded if the key is already populated.

  Implement _build_passthrough_failure_request_payload to merge parsed_body, kwargs, logging_obj
  and custom_llm_provider into a single request_data dict passed to post_call_failure_hook;
  supply upstream_usage only when both response_cost and combined_usage_object are needed.
  If model is missing from kwargs, copy it from parsed_body. Write custom_llm_provider to the
  payload when supplied and the key is absent.

  Implement _TeamCallbackWiring as a frozen dataclass with success_callbacks, failure_callbacks
  and logging_kwargs fields (all mutable-ok for Logging.__init__). Implement _resolve_team_callback_wiring
  to call _get_dynamic_logging_metadata, validate callback_vars for env references, build
  logging_kwargs with callback_vars and TRUSTED_CALLBACK_VARS_FIELD, and return early on
  any exception without breaking the passthrough request.

  Implement _truncate_upstream_error_body to limit error messages to PASSTHROUGH_UPSTREAM_ERROR_BODY_MAX_LOG_CHARS
  with a (truncated at X chars) suffix. Implement _sanitize_upstream_error_body to replace
  non-printable characters with spaces and collapse whitespace sequences to one space.

  Implement _PrefixReplayStream(httpx.AsyncByteStream) to yield a byte prefix, then relay
  the rest of an async iterator without buffering; aclose() closes the upstream response.
  Implement _no_more_chunks as a no-op async generator. Implement _read_error_body_preview
  to collect chunks until PASSTHROUGH_UPSTREAM_ERROR_BODY_MAX_LOG_CHARS bytes are read or
  the iterator ends, returning (bytes, rest_iterator); on httpx.HTTPError, log warning and
  return (partial, _no_more_chunks()).

  Implement _headers_without_body_framing to return a new httpx.Headers dict excluding
  content-encoding and content-length headers. Implement _error_body_preview_and_relay
  to read a limited preview of response bytes, decode with fallback to replace on invalid
  UTF-8, and return the preview text plus a _PrefixReplayStream wrapper that replays
  prefix + rest without the body-framing headers.

  Implement _log_passthrough_upstream_failure to log upstream 4xx/5xx with truncated and
  sanitized preview at warning level, skip logging if response.status_code < 400, substitute
  REDACTED_BY_LITELLM for upstream_error_body when should_redact_message_logging applies,
  synthesize an HTTPException with the (possibly redacted) body in its detail, call
  post_call_failure_hook with the exception (logged at warning level when hook fails),
  and return a wrapped response that relays the body bytes.

  Implement _relay_reporting_failures as an async generator that yields chunks from
  the input stream; on exception, call post_call_failure_hook only if upstream_status < 400
  (no double-logging for upstream failures), and re-raise the exception. Catch exceptions
  from the hook itself and continue, since a broken logging config must not mask stream errors.

  Implement _update_metadata_with_tags_in_header to read 'tags' and 'x-litellm-tags'
  headers (comma-separated, stripped), and extend the metadata['tags'] list; skip the key
  entirely if no tags are found. Implement _with_trace_context to call inject_trace_context
  (imported from litellm.integrations.otel) or return a copy of headers if the import fails.

scope:
  paths:
  - crates/betterlite-http/src/lib.rs
  - crates/betterlite-http/src/passthrough.rs
  - crates/betterlite-http/src/passthrough/**
