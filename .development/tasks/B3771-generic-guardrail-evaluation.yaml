id: B3771
title: Generic guardrail evaluation and Gray Swan verdict enforcement
description: >-
  Implement service invocation and response handling for generic guardrail API and Gray Swan,
  including metadata extraction, request orchestration, verdict enforcement (BLOCKED vs pass-through),
  and error policies (fail_open, fail_closed). Generic guardrail's apply_guardrail method extracts user
  API key metadata from multiple request context locations (litellm_metadata preferred over metadata),
  calls the external guardrail service with unified request format, and handles the response. A BLOCKED
  verdict raises invalid_request_error; other verdicts return modified or original inputs. Metadata extraction
  tries litellm_metadata.user_api_key_* and metadata.user_api_key_*, merging both and preferring litellm_metadata
  when both exist. When user_api_key_token is present, it aliases to user_api_key_hash even if metadata.user_api_key_hash
  was also present, overriding the earlier copy.

  Error handling routes connection failures, timeouts and 5xx responses based on unreachable_fallback policy
  (fail_closed raises 400, fail_open logs critical and returns original inputs). The fail_on_error flag allows
  silencing all errors including unreachable ones (5xx, timeout, connection), overriding unreachable_fallback
  for monitoring scenarios. Response construction reconciles echoed rows: when the server returns rows unchanged,
  betterlite returns the original objects; when modified, it returns the guardrail's version.

  Gray Swan's apply_guardrail extracts texts and post-call response tool_calls, builds conversation context
  by reconstructing request history for post-call scanning, and prepares payload with messages, tools, and
  dynamic parameters (categories, policy_id, reasoning_mode). It calls /cygnal/monitor and processes response.
  Violation score >= threshold flags content. The on_flagged_action is BLOCK (raise 400), MONITOR (passthrough),
  or PASSTHROUGH (replace on post-call, raise exception on pre-call). Threshold and reasoning_mode read from
  environment variables (GRAYSWAN_VIOLATION_THRESHOLD default 0.5, GRAYSWAN_REASONING_MODE) or config.
  Failures follow fail_open policy: log and return inputs if true, raise GraySwanGuardrailAPIError if false.

  Configuration goes in the generic_guardrail_api and grayswan sections of betterlite-config, registered as
  stubs. Each reads its entries from the guardrails list the way lasso_classification does.
