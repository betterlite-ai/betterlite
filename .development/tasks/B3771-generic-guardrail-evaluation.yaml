dod:
  - text: >-
      Generic guardrail apply_guardrail extracts user API key metadata from litellm_metadata.user_api_key_*
      and metadata.user_api_key_* fields, merging both locations and preferring litellm_metadata when both exist.
    proof: [generic-metadata]
  - text: >-
      Generic guardrail user_api_key_token field aliases to user_api_key_hash even when metadata.user_api_key_hash
      is also present, overriding the prior copy from the field merge loop.
    proof: [generic-metadata, metadata-token-alias]
  - text: >-
      Generic guardrail calls POST to api_base with GenericGuardrailAPIRequest payload,
      returning BLOCKED verdict as 400 invalid_request_error, other verdicts as modified or original inputs.
    proof: [oracle]
  - text: >-
      Generic guardrail handles connection failure, timeout, 5xx response and decode error according
      to unreachable_fallback: fail_closed raises 400, fail_open logs and returns original inputs.
    proof: [generic-error]
  - text: >-
      Generic guardrail fail_on_error flag allows silent passthrough of all errors including unreachable ones
      (5xx status, timeout, connection failures), overriding unreachable_fallback policy.
    proof: [generic-error, fail-on-error-all]
  - text: >-
      Gray Swan apply_guardrail extracts texts and post-call tool_calls, reconstructs conversation context from request history.
    proof: [grayswan-context]
  - text: >-
      Gray Swan prepares payload with messages, tools, and dynamic parameters (categories, policy_id, reasoning_mode)
      from both config and request metadata, calls /cygnal/monitor.
    proof: [grayswan-payload]
  - text: >-
      Gray Swan violation_score >= violation_threshold flags content; BLOCK raises 400, MONITOR logs and returns inputs,
      PASSTHROUGH replaces on post-call or raises exception on pre-call.
    proof: [grayswan-verdict]
  - text: >-
      Gray Swan fail_open true logs error and returns inputs unchanged; fail_open false raises GraySwanGuardrailAPIError.
    proof: [grayswan-error]
  - text: >-
      Gray Swan violation_threshold defaults to 0.5, read from GRAYSWAN_VIOLATION_THRESHOLD env var if set.
      Reasoning_mode read from GRAYSWAN_REASONING_MODE env var, must be in {off, hybrid, thinking}.
    proof: [config]
  - text: >-
      Generic guardrail configuration loads api_key (required, GENERIC_GUARDRAIL_API_KEY env), api_base
      (optional, GENERIC_GUARDRAIL_API_BASE env, appends /beta/litellm_basic_guardrail_api if needed).
    proof: [config]
  - text: >-
      Gray Swan configuration loads api_key (required, GRAYSWAN_API_KEY env), api_base (optional,
      GRAYSWAN_API_BASE env, default https://api.grayswan.ai), and all settable parameters.
    proof: [config]
checks:
  optional: [mutants]
  commands:
    - id: generic-metadata
      why: user API key metadata extraction fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^generic_guardrail.*metadata/)'
    - id: metadata-token-alias
      why: user_api_key_token aliasing to user_api_key_hash fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^generic_guardrail.*token.*alias/)'
    - id: generic-error
      why: error handling or fail_open/fail_closed policy fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^generic_guardrail.*error/)'
    - id: fail-on-error-all
      why: fail_on_error silencing unreachable errors or overriding unreachable_fallback fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^generic_guardrail.*fail.*error.*(unreachable|override)/)'
    - id: grayswan-context
      why: post-call context extraction fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^grayswan.*context/)'
    - id: grayswan-payload
      why: payload preparation or dynamic parameter merging fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^grayswan.*payload/)'
    - id: grayswan-verdict
      why: verdict enforcement (block/monitor/passthrough) or violation message formatting fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^grayswan.*(verdict|block|monitor|passthrough)/)'
    - id: grayswan-error
      why: fail_open policy or GraySwanGuardrailAPIError fails or does not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^grayswan.*error/)'
    - id: config
      why: Generic guardrail or Gray Swan configuration does not load from environment or files
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::(generic_guardrail_api|grayswan)::/)'
