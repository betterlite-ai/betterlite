deviations:
  - what: >-
      Generic guardrail error messages in outage scenarios use betterlite's own wording, not LiteLLM's.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status codes unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/generic_guardrail_api/generic_guardrail_api.py#L390-L392
  - what: >-
      Gray Swan violation message formatting is betterlite's own template, not LiteLLM's exact wording.
    why: Error messages are betterlite's own per rule errors-match-litellm; status code 400 matches.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/grayswan/grayswan.py#L738-L756
out_of_scope:
  - 'Header allowlisting, sanitization and extraction; belong to B3770.'
  - 'Type definitions and contracts for GenericGuardrailAPI request/response; belong to B3770.'
  - 'Guardrail framework lifecycle, decorator wrappers and hook registration; belong to B107.'
  - 'Gray Swan HTTP client initialization and post-call context handler setup; belong to B3772.'
  - 'The utility functions effective_scan_only_tool_results_for_guardrail, effective_skip_system_message_for_guardrail,
    effective_skip_tool_message_for_guardrail and scoped_structured_message_indices from litellm/llms/base_llm/guardrail_translation/utils.py;
    they belong to B3663.'
  - 'The function get_call_types_for_route from litellm/litellm_core_utils/api_route_to_call_types; it belongs to B207.'
  - Other guardrail providers (Alice, Conduct, Cisco, etc.); each has its own task.
pitfalls:
  - Generic guardrail metadata extraction prefers litellm_metadata over metadata when both exist; both carry user_api_key_* fields that must be merged, then user_api_key_token unconditionally aliases to user_api_key_hash.
  - The fail-on-error flag silences all errors including unreachable ones (5xx, timeout, connection), overriding unreachable_fallback; set fail_on_error=False to enforce fail_closed for unreachable errors.
  - Gray Swan post-call context reconstruction only runs on response input_type; it loads call_type and resolves structured messages per call type.
  - Gray Swan PASSTHROUGH on pre-call raises ModifyResponseException to short-circuit the LLM call, unlike post-call which modifies inputs.
  - Gray Swan dynamic parameters (categories, policy_id, reasoning_mode) come from request metadata and override config values.
  - Both api_key parameters must never appear in logs or Debug output; mark as SecretString.
review_level: security
budget:
