deviations:
  - what: On backend errors other than HTTPException, the guardrail raises HTTPException with status 500 and includes error details.
    why: LiteLLM wraps non-HTTPException backend errors and propagates them; betterlite preserves this behavior.
  - what: Text completions are wrapped in a single user message for Pangea and the response is extracted back to the prompt field.
    why: LiteLLM uses the same wrapping pattern to make text completions compatible with the chat-based Pangea API.
  - what: Response choices are serialized from Choices objects to dicts before sending to Pangea.
    why: LiteLLM serializes Choices to dicts before sending to Pangea; betterlite preserves this behavior for API compatibility.
out_of_scope:
  - The CustomGuardrail base class and its __init__, framework event hook registration, and the log_guardrail_information decorator are owned elsewhere (U1).
  - The observation and logging framework that interfaces with the callback manager is owned elsewhere (U1).
  - Message/response type conversions beyond what is shown in the apply_guardrail methods (U1).
  - Applied-guardrail header bookkeeping beyond calling add_guardrail_to_applied_guardrails_header (U3).
pitfalls:
  - "The api_key is read from the config parameter or PANGEA_API_KEY environment variable in __init__; it must never be logged or placed in error details to prevent secret leakage."
  - "PangeaGuardrailMissingSecrets is raised when api_key is missing; test both paths when api_key comes from config vs environment."
  - "Text completion requests are wrapped in a single user message for Pangea, but the prompt is extracted from messages[0]['content']; test both wrapping and unwrapping."
  - "Response choices must be serialized to dicts if they are Choices objects; test both Choices and dict input types."
  - "HTTPException with status 400 is raised for blocked responses; status 500 is raised for other exceptions; ensure both paths propagate correctly."
  - "The api_base endpoint is constructed as {api_base}/v1beta/guard for all calls; preserve the trailing slash handling from the configured base URL."
  - "event_type must be set to 'input' for pre_call hooks and 'output' for post_call hooks in the payload."
  - "applied-guardrail headers are added after successful Pangea calls; ensure the header addition does not fail silently."
  - "async_handler is obtained via get_async_httpx_client; it already has the timeout configured as a dependency from B173."
  - "Environment variables are read in __init__ using or chains with defaults; the config loader from B002 supplies these values when not hardcoded in the guardrail config."
