dod:
  - text: The guardrail reads PANGEA_API_KEY, PANGEA_API_BASE, PANGEA_INPUT_RECIPE, and PANGEA_OUTPUT_RECIPE from the environment or config, with api_key required and api_base defaulting to https://ai-guard.aws.us.pangea.cloud.
    proof: [pangea-env-resolution]
  - text: When PANGEA_API_KEY is not found in the environment or config, the guardrail raises PangeaGuardrailMissingSecrets with the message "Pangea API Key not found. Set PANGEA_API_KEY environment variable or pass it in litellm_params."
    proof: [pangea-missing-api-key]
  - text: For text completions, the guardrail transforms the prompt to a user message, sends it to Pangea, and updates the prompt if result.transformed=true.
    proof: [pangea-text-completion-transform, oracle-text-completion-input-transform]
  - text: For chat messages, the guardrail sends input messages to Pangea with event_type="input" and updates them if result.transformed=true.
    proof: [oracle-request-input-transform]
  - text: For responses, the guardrail sends input messages and choices to Pangea with event_type="output" and updates response.choices if result.transformed=true.
    proof: [oracle-response-output-transform]
  - text: When Pangea returns result.blocked=true, the guardrail raises HTTPException with status 400 and error detail including "Violated Pangea guardrail policy".
    proof: [oracle-request-blocked, oracle-response-blocked]
  - text: On other backend exceptions, the guardrail raises HTTPException with status 500.
    proof: [oracle-backend-error]
  - text: The guardrail supports pre_call and post_call event hooks.
    proof: [oracle-event-hooks]
  - text: Applied-guardrail headers are added for both input and output hooks.
    proof: [pangea-unit-tests]
  - text: The configuration model has api_key, api_base, pangea_input_recipe, and pangea_output_recipe fields with the documented defaults and description.
    proof: [pangea-config-model]
