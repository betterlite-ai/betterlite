id: B3785
title: Pangea input and output transformations
description: >-
  Build Pangea `v1beta/guard` calls and apply returned transformations to requests and responses,
  including text completions.
  The guardrail accepts requests with chat messages or text completions, calls the Pangea AI Guard service,
  and applies transformations to messages or choices based on the returned output.

  The guardrail reads PANGEA_API_KEY (required), PANGEA_API_BASE (default https://ai-guard.aws.us.pangea.cloud),
  PANGEA_INPUT_RECIPE (optional, used in pre_call hook), and PANGEA_OUTPUT_RECIPE (optional, used in post_call hook)
  from the environment or the guardrail config.

  For requests, the guardrail detects text_completion vs chat calls and extracts messages accordingly.
  Text completions are transformed to a single user message containing the prompt.
  The guardrail calls Pangea at `{api_base}/v1beta/guard` with event_type="input" for requests.
  If the response includes `result.transformed=true` and `result.output.messages`, the guardrail updates
  the request messages or text completion prompt and returns the modified data.

  For responses, the guardrail extracts input messages and response choices, calls Pangea with event_type="output",
  and if `result.transformed=true` and `result.output.choices` are present, updates response.choices.

  On blocked responses, Pangea returns `result.blocked=true`, and the guardrail raises HTTPException with status 400
  and error detail including "Violated Pangea guardrail policy" and the guardrail name.
  On other backend errors or exceptions, the guardrail raises HTTPException with status 500.

  Applied-guardrail headers are added via add_guardrail_to_applied_guardrails_header.
