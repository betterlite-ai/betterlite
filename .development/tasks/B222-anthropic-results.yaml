id: B222
title: Anthropic tool results and image blocks
description: >-
  Implement _replace_invalid_tool_use_id_chars, _sanitize_anthropic_tool_use_id, _is_anthropic_document_data_uri,
  convert_to_anthropic_tool_result, convert_function_to_anthropic_tool_invoke and _find_server_tool_result. Also
  own image conversion functions 772-880; _sanitize_bedrock_tool_use_id is B228. All functions are pure and bounded,
  use injected policy and preserve source values. Budget 280 transforms/types, 110 adapters, 300 tests and 60 wiring
  (750 total). Write the behavior rstest functions anthropic_results_behavior_tests_behavior in adjacent tests.rs files, with
  a named case for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation anthropic_results is already registered; each operation
  has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/anthropic_results.rs
  - crates/betterlite-prompts/src/anthropic_results/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/prompts/anthropic_results.rs
  - tools/oracle/src/helpers/prompts/anthropic_results/**
  - tools/oracle/helpers/anthropic_results.py
  - tools/oracle/helpers/anthropic_results/**
  - tools/oracle/cases/helpers/anthropic-results/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L1530-L1741
  why: Exact function/branch ownership.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L772-L880
  why: Generic and Anthropic image block conversion.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::anthropic_results_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'anthropic_results' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/anthropic-results/tool-result.yaml
- tools/oracle/cases/helpers/anthropic-results/document-data-uri.yaml
- tools/oracle/cases/helpers/anthropic-results/image-data.yaml
- tools/oracle/cases/helpers/anthropic-results/function-invoke.yaml
- tools/oracle/cases/helpers/anthropic-results/server-result.yaml
- tools/oracle/cases/helpers/anthropic-results/invalid-id.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B180 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_results in the prompts group. Replace the stub Op in tools/oracle/src/helpers/prompts/anthropic_results.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_results.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
