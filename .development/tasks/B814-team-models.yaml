id: B814
title: Team model allowlist mutation
description: >-
  Implement POST /team/model/add and /team/model/delete and the append_team_models service called by
  BYOK writers. Both request types require team_id and models, accepting an empty list. Neither handler
  expands groups, validates model existence nor checks the parent organization's model ceiling. Each
  checks database (500 detail.error="No db connected"), reads the team (404 "Team not found, passed
  team_id=..."), then allows B800 proxy/team/org administrators; denial is 403 "Only proxy admin or team
  admin can modify team models", even for org-admin authorization. Cases required_fields_and_empty,
  database_then_target_then_scope and arbitrary_model_grants prove the actual validation boundary.

  Addition executes one parameterized SQL UPDATE. Treat null or zero-cardinality existing models as
  ['all-proxy-models'], concatenate the requested strings and SELECT DISTINCT unnest into an array.
  Deduplication has no stable order promise; compare sets in append_union and unrestricted_sentinel,
  including an empty append to null/empty existing models. Concurrent appends do not lose either grant.
  Then separately update updated_at to UTC now through the writer, including litellm_model_table and
  object_permission, so the returned/cache row is current and retains both relations. A missing returned
  row raises the same 404; a failed re-fetch does not roll back the first SQL statement. B801 refreshes
  the team cache after the write, and that failure also leaves the stored models. Native Postgres cases
  concurrent_appends, writer_refresh_relations and append_partial_write cover those boundaries.

  Deletion reads the old list (null becomes []), filters every occurrence whose exact string is in the
  request, and writes that snapshot list with the same two included relations. Preserve remaining order
  and duplicates; deleting the final grant stores [] and thus restores unrestricted semantics. A
  concurrent append can be overwritten by this read/filter/write path: do not replace it with the
  append SQL's atomic merge. Missing update result is 404; cache refresh occurs afterward. Cases
  delete_all_occurrences, delete_last_grant, delete_snapshot_race and cache_failure_after_write exercise
  this asymmetry. No license branch, environment variable or local exception wrapper exists here.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  team_model_add (L6057-L6112; 46 source lines), append_team_models (L6115-L6164; 38 source lines), team_model_delete
  (L6173-L6247; 58 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/model/add -> team_model_add;
  POST /team/model/delete -> team_model_delete. Exercise both through B001 with B052 auth and B865
  decorators. Errors use B003's HTTPException envelope, including type/param/code, rather than an invented
  handle_exception_on_proxy call. Native database tests use POSTGRES_TEST_URL when configured, otherwise
  B860 testcontainers, and fail on startup/connect errors. The unused add_new_models_to_team remains
  excluded; its Python set conversion must not replace the live SQL algorithm.


  Sizing: 142 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  160 production, 300 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 525 changed lines estimated within a 550-line gate.


