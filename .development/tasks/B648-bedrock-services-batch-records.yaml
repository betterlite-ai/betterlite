id: B648
title: Bedrock batch chat text and Responses records
description: >-
  Add typed OpenAiBatchRecord to Bedrock recordId/modelInput JSONL conversion for chat, text completions, Responses
  and embeddings. Reuse provider transformers and an injected alias map rather than bypassing router identity; preserve
  target-model fallback and CALL0000000 default record ids. JSONL framing has a committed fuzz corpus and errors
  identify the record index without logging content. The leaf receives an injected batch-model resolver returning
  provider-local ResolvedBatchModel and preserves its warning/fallback outcome; B030 wires the upper B174 resolver,
  so this leaf never imports betterlite-provider. Likewise inject the option-mapping callback over native request
  records; B030 adapts B175 ParameterMapping at the upper boundary.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  BedrockFilesConfig._transform_text_completion_body_to_chat_body L822-L843; BedrockFilesConfig._transform_responses_body_to_chat_body
  L846-L855; BedrockFilesConfig._transform_batch_body_to_chat_body L858-L874; BedrockFilesConfig._map_openai_to_bedrock_params
  L876-L952; BedrockFilesConfig._resolve_batch_record_model_and_provider L954-L965; BedrockFilesConfig._transform_openai_jsonl_content_to_bedrock_jsonl_content
  L967-L1024; BedrockFilesConfig.transform_create_file_request L1026-L1108.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Reuse AmazonConverseConfig.__init__ from B600 (litellm/llms/bedrock/chat/converse_transformation.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-bedrock/src/batch_records.rs with adjacent tests under batch_records/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_batch_records in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batch_records_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  chat_batch_record, text_completion_to_chat, responses_to_chat, embedding_batch_record, alias_and_target_model,
  default_record_id, jsonl_blank_lines, malformed_jsonl_line. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_records* using HelperCase:
  kind: helper and the externally tagged bedrock_services_batch_records variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_batch_records that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_batch_input_line consumes uploaded OpenAI batch JSONL bytes in crates/betterlite-bedrock/src/batch_records.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_batch_records.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_batch_records.
  The adjacent test replays_the_bedrock_services_batch_records_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 235 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 544 planned, 550 maximum changed lines.
