id: B648
title: Bedrock batch chat text and Responses records
description: >-
  Add typed OpenAiBatchRecord to Bedrock recordId/modelInput JSONL conversion for chat, text completions, Responses
  and embeddings. Reuse provider transformers and an injected alias map rather than bypassing router identity; preserve
  target-model fallback and CALL0000000 default record ids. JSONL framing uses decode_batch_input_line and preserves
  the original JSON/UTF-8 failure category; it does not invent a record-index error wrapper. Call the lower B643
  routing-prefix helpers and B175 parameter mapper directly through their typed interfaces. B030 composes this leaf;
  it does not supply a second resolver algorithm.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  BedrockFilesConfig._transform_text_completion_body_to_chat_body L822-L843; BedrockFilesConfig._transform_responses_body_to_chat_body
  L846-L855; BedrockFilesConfig._transform_batch_body_to_chat_body L858-L874; BedrockFilesConfig._map_openai_to_bedrock_params
  L876-L952; BedrockFilesConfig._resolve_batch_record_model_and_provider L954-L965; BedrockFilesConfig._transform_openai_jsonl_content_to_bedrock_jsonl_content
  L967-L1024; BedrockFilesConfig.transform_create_file_request L1026-L1108.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Reuse AmazonConverseConfig.__init__ from B600 (litellm/llms/bedrock/chat/converse_transformation.py); its implementation
  remains with that prerequisite.


  Named case contracts: chat_batch_record: Missing messages defaults [], and developer-role rewriting uses the shared
  base helper. Remove only model/messages from optional fields. provider anthropic uses B618 constructor/request
  and B175 get_optional_params with invoke/ routing model, custom_llm_provider bedrock and rewritten messages. Filter
  LiteLLM-owned kwargs except allowed_openai_params; strip json_mode from mapped output. Pass litellm_params={}
  and headers={} to the request transformer. Reuse B618 request cases for its body/header/default outcomes. text_completion_to_chat:
  Missing/None prompt raises ValueError Batch record for /v1/completions is missing required `prompt` field: model={body
  model default empty}. Otherwise remove prompt, preserve remaining keys, and append messages from B218 text_completion_prompt_to_messages;
  this overwrites an existing messages key in the B643 frozen mapping. Exercise string/list/token prompt fixtures
  through the shared helper. responses_to_chat: Delegate the full body to B1025 responses_batch_body_to_chat_body
  and run its input/instructions/max_output_tokens/tool projection fixtures here. Explicit embedding kind passed
  to the chat normalizer raises ValueError Embedding batch records do not have a chat-completion equivalent; chat
  returns its body unchanged. embedding_batch_record: Classify each original record with B647 before conversion;
  embeddings call its mapper directly with the selected model. Preserve all B647 URL precedence, Titan schema, input-shape
  errors and mapping cases through this composition. alias_and_target_model: Read litellm.model_alias_map default
  {} once per record-model lookup, with original model fallback. B643 strips routing prefix only to identify the
  invoke provider via B2205; return the original resolved record model if its provider is known or target_model
  is falsey. Only when target has a known provider does it replace an unknown record model. Do not rewrite each
  body model or recursively resolve aliases. default_record_id: Missing custom_id produces CALL plus zero-based
  index padded to seven digits, e.g. CALL0000000; explicit empty or None is preserved, and wide indices are not
  truncated. Emit only recordId and modelInput, discarding method,url and other outer keys. Stop on the first failing
  row; no partial successful upload. jsonl_blank_lines: Extract B235 file data; file None -> ValueError file is
  required, content None -> file content is required. Use B1015 is_batch_jsonl_file (purpose/content_type policy),
  B644 content extraction and strict JSON for each nonblank splitlines row. Join transformed rows with newline and
  no trailing newline using Python-compatible JSON serialization. Empty input emits empty text. malformed_jsonl_line:
  Malformed JSON and strict UTF-8 failures propagate their original parse error, without added row-index text. Non-object
  rows/body values retain the source wrong-shape failure instead of silently skipping. Nonbatch bytes decode UTF-8,
  strings remain unchanged, any other extracted type -> ValueError Unsupported file content type. nova_batch_record:
  Only provider nova uses B600 constructor/map_openai_params with drop_params=False, then B604 transform_request
  with empty litellm_params/headers. Reuse its image blocks, inferenceConfig, defaults and strict unsupported-parameter
  cases. Other providers, including openai/qwen/deepseek and None, return messages plus remaining optional fields
  unchanged; do not run the general Invoke dispatcher B611. upload_signing_handoff: Target model is truthy explicit
  model, else litellm_params.model only if string, else empty. After conversion call B644 get_complete_file_url
  (which may parse original data again), merge credentials B596, then truthy litellm_params.s3_region_name or optional_params.s3_region_name
  overwrites aws_region_name unconditionally. Resolve KMS through B643 and call B644 _sign_s3_request. Only after
  success set litellm_params.upload_url and _s3_upload_content_length to UTF-8 byte length, not codepoints. Return
  method PUT,url,headers,data=(signed_body or file_content). Failures before signing completion leave these handoff
  fields unchanged.


  Load model_alias_map through betterlite-config, with injected environment lookup and the defaults/precedence stated
  here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest batch_records_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Global litellm_settings.model_alias_map defaults to an empty map. Reuse the configured trusted credential/region
  loaders from B590/B643/B644; no batch-local credential cache.


  Write standalone Rust test batch_records_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test batch_records_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Use B2228 is_litellm_owned_kwarg and its declared wire-name registry, not B1035 or a duplicate filter list; B2214
  owns shared developer-role conversion.


  Direct constructor/helper prerequisites used by this slice: B591. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/batch_records.rs with adjacent tests under batch_records/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_batch_records in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batch_records_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  chat_batch_record, text_completion_to_chat, responses_to_chat, embedding_batch_record, alias_and_target_model,
  default_record_id, jsonl_blank_lines, malformed_jsonl_line, nova_batch_record, upload_signing_handoff. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_records* using HelperCase:
  kind: helper and the externally tagged bedrock_services_batch_records variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_batch_records that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_batch_input_line consumes uploaded OpenAI batch JSONL bytes in crates/betterlite-bedrock/src/batch_records.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_batch_records.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_batch_records.
  The adjacent test replays_the_bedrock_services_batch_records_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 235 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 270 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 40 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 790 planned, 800 maximum changed lines.
