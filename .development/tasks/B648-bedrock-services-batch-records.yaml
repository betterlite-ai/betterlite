  commands:
  - id: case-chat-batch-record
    why: The chat-batch-record behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_records_cases::case_[0-9]+_chat_batch_record$/)'
  - id: case-text-completion-to-chat
