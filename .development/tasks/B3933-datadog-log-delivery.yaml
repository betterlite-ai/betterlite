dod:
  - text: DD_BATCH_SIZE environment variable resolves to an integer between 1 and DD_MAX_BATCH_SIZE; invalid strings log a warning and use the default; invalid-string warning includes the variable name and default value.
    proof: [batch-size-resolution]
  - text: Logger initialization with no dd_agent_host falls back to environment, then tries direct API; explicit dd_api_key and dd_site override environment; allow_env_credentials false prevents DD_API_KEY lookup.
    proof: [credentials-resolution]
  - text: Agent endpoint uses port default 10518 from LITELLM_DD_AGENT_PORT environment variable; direct API endpoint uses DD_SITE environment variable fallback.
    proof: [endpoint-configuration]
  - text: DD_BASE_URL environment variable overrides intake_url when set; when unset, no override is applied.
    proof: [endpoint-configuration]
  - text: Sync log_success_event builds and sends immediately without async queuing; async_log_success_event and async_log_failure_event queue events for batch delivery.
    proof: [sync-async-delivery]
  - text: Payloads are queued and flushed when batch size is reached or periodic_flush timeout fires; flush_queue sends all queued events under lock.
    proof: [batch-queueing]
  - text: Batches are compressed with gzip and sent with Content-Encoding=gzip and DD-API-KEY headers; requests expect HTTP 202 (Accepted) status.
    proof: [compression-headers]
  - text: Payloads exceeding Datadog's 5MB uncompressed limit are proactively split in half before sending; a 413 response triggers half-splitting recursion; lone events that 413 are dropped with DD_ERRORS.DATADOG_413_ERROR message.
    proof: [dd-413-splitting]
  - text: Transient (non-413) delivery errors requeue only the undelivered events; BatchSendCancelled exceptions requeue and raise CancelledError.
    proof: [error-requeue]
  - text: Health check creates dummy payload, sends to intake endpoint, and returns healthy if HTTP 202 or unhealthy with error message for any other status or exception.
    proof: [health-check]
  - text: get_request_response_payload returns None for DataDogLogger (payload inspection not implemented).
    proof: [payload-inspection-noop]
  - text: Every helper operation in datadog delivery has a committed shared-parser corpus seed and replays successfully.
    proof: [corpus-replay]
  - text: Mutants in batch-size resolution, credential precedence, endpoint configuration, compression headers and delivery error classification are caught by tests.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: batch-size-resolution
      why: DD_BATCH_SIZE resolution tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_batch_size_resolution_behavior($|::)/)'
    - id: credentials-resolution
      why: credential resolution and precedence tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_credentials_resolution_behavior($|::)/)'
    - id: endpoint-configuration
      why: endpoint configuration tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_endpoint_configuration_behavior($|::)/)'
    - id: sync-async-delivery
      why: sync/async event delivery tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_delivery_sync_async_behavior($|::)/)'
    - id: batch-queueing
      why: batch queueing and flushing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_batch_queueing_behavior($|::)/)'
    - id: compression-headers
      why: compression and header tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_compression_headers_behavior($|::)/)'
    - id: dd-413-splitting
      why: 413 splitting tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_413_splitting_behavior($|::)/)'
    - id: error-requeue
      why: error requeue and cancellation tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_error_requeue_behavior($|::)/)'
    - id: health-check
      why: health check tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_health_check_behavior($|::)/)'
    - id: payload-inspection-noop
      why: payload inspection no-op tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_payload_inspection_noop_behavior($|::)/)'
    - id: corpus-replay
      why: the fuzz corpus is missing, empty or replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/datadog_logs)"
        && grep -rlq 'datadog' tools/oracle/fuzz/corpus/datadog_logs && test -f tools/oracle/fuzz/fuzz_targets/datadog_logs.rs
        && test -n "$(ls -A tools/oracle/fuzz/corpus/datadog_logs)" && cargo nextest run --locked -p betterlite-oracle
        --no-tests=fail -E 'test(replays_the_datadog_logs_corpus)'
