deviations:
  - what: >-
      When DD_BATCH_SIZE environment variable is not a valid integer, a warning is logged
      and DD_MAX_BATCH_SIZE is used as fallback instead of silently using it.
    why: >-
      Betterlite follows LiteLLM's strict-fallback pattern for config values: invalid
      inputs produce diagnostics so users discover typos rather than silent behavior changes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L87-L100
  - what: >-
      Explicit constructor arguments (dd_api_key, dd_site, dd_agent_host, dd_agent_port)
      take precedence over environment variables; allow_env_credentials false prevents
      DD_API_KEY environment lookup.
    why: >-
      LiteLLM also prefers explicit arguments and supports allow_env_credentials;
      betterlite retains the same credential isolation for team/key-scoped loggers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L113-L177
  - what: >-
      Health check exceptions (httpx.HTTPStatusError, other exceptions) return unhealthy
      with error message; network/timeout exceptions do not return healthy.
    why: >-
      LiteLLM returns unhealthy for all exceptions; betterlite preserves the same behavior
      (no swallowing of transport failures as healthy).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L824-L839
out_of_scope:
  - "`_span_attribute`, `_add_trace_context_to_payload` and `_get_active_trace_context` (called by async_health_check for trace ID injection) are owned by B3930."
  - "The datadog_mock_client.py module is Python test-only infrastructure replaced by injected test transports per B191; betterlite does not ship DATADOG_MOCK as a production feature."
  - The payload construction for standard and legacy v0 logging formats (owned by B3932).
  - Tag normalization, source, service, hostname and base-URL resolution (owned by B3930).
  - The truncate_standard_logging_payload_content function (owned by B3931).
  - Initialization parameters and exporter options (owned by B3931).
  - The CustomBatchLogger base class, periodic_flush and batch size defaults (owned by B256).
  - HTTP client creation and pooling (owned by B173).
  - JSON serialization and safe_dumps function (owned by B192).
  - Proxy failure hooks and service callbacks (owned by B3934).
  - LLM Observability span assembly and delivery (owned by B3938).
  - Dynamic logger cache and credential-scoped selection (owned by B113 and B3945).
  - The injected logger registration and callback dispatch that invokes these methods.
pitfalls:
  - DD_BATCH_SIZE environment variable must be clamped after string-to-int conversion; an empty or negative value should be clamped to at least 1.
  - allow_env_credentials true allows DD_API_KEY lookup when no explicit dd_api_key is provided; allow_env_credentials false disables it entirely.
  - LITELLM_DD_AGENT_HOST and LITELLM_DD_AGENT_PORT use the LITELLM_ prefix, not DD_AGENT_HOST, to avoid conflicts with ddtrace's own DD_AGENT_HOST.
  - The async_client is obtained from B173's get_async_httpx_client() and sync_client from _get_httpx_client(); both must be stored as instance variables.
  - A 413 response from async_send_compressed_data is raised as httpx.MaskedHTTPStatusError by raise_for_status(); it is caught and triggers _send_with_413_split retry, not returned as a response.
  - Lone events that still exceed intake limits after individual sending are dropped silently with a DD_ERRORS.DATADOG_413_ERROR message, not requeued.
  - BatchSendCancelled exception must be caught and its undelivered list requeued before raising CancelledError.
  - Health check does not use the request/response payload inspection; it only checks HTTP status. A non-202 status from async_send_compressed_data raises HTTPStatusError, not returned.
  - get_request_response_payload is live dispatch through AdditionalLoggingUtils.payload_reading_on_dd but only for DataDogLogger instances; a return value of None is correct.
  - flush_queue requires a flush_lock (asyncio.Lock) acquired in __init__ by the parent CustomBatchLogger; it must not be None during operation.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
