id: B3933
title: Datadog log delivery and health checks
description: >-
  Implement Datadog log delivery pipeline in betterlite-logging: initialize logger with explicit credentials before environment fallback,
  configure agent or direct API endpoints with caller-controlled allow_env_credentials flag,
  deliver batches with gzip compression to /api/v2/logs endpoint, split oversized payloads on 413 responses and proactively when they would exceed
  Datadog's 5MB uncompressed limit, handle cancellation by requeueing undelivered events, and check service health.

  Resolve and clamp DD_BATCH_SIZE environment variable to 1–1,000 with invalid-string warning and fallback to DD_MAX_BATCH_SIZE constant.
  Support agent port default 10518 via LITELLM_DD_AGENT_PORT environment variable (note: LITELLM_DD_AGENT_HOST, not DD_AGENT_HOST, to avoid ddtrace conflicts),
  direct API via DD_SITE and DD_API_KEY, and DD_BASE_URL override for testing. Preserve explicit constructor arguments before environment lookup;
  allow_env_credentials false prevents reading DD_API_KEY for team/key-scoped loggers with caller-supplied destinations.

  Log sync/async success and failure events by building payloads, queuing them, and flushing on batch-size threshold or timeout via inherited periodic_flush.
  Send payloads with gzip Content-Encoding header. Accept only HTTP 202 (Accepted) status; other responses trigger 413-split retry or error requeue.
  Health check creates a dummy payload, sends it, and returns healthy or unhealthy with error message based on response status.

  Health POST exceptions (network errors, timeouts) return unhealthy with string error; do not turn every transport exception into a healthy result.
  The payload-inspection no-op method get_request_response_payload returns None and is live through AdditionalLoggingUtils dispatch on DataDogLogger instances only.
scope:
  paths:
    - crates/betterlite-logging/src/datadog_logging.rs
    - crates/betterlite-logging/src/datadog_logging/**
    - tools/oracle/cases/datadog/**
