    - crates/betterlite-core/Cargo.toml
    - crates/betterlite-core/src/api/search_providers/google_pse.rs
    - crates/betterlite-core/src/api/search_providers/google_pse/**
    - crates/betterlite-core/src/api/search_providers/searchapi.rs
    - crates/betterlite-core/src/api/search_providers/searchapi/**
    - crates/betterlite-config/src/providers/google_pse.rs
    - crates/betterlite-config/src/providers/google_pse/**
    - crates/betterlite-config/src/providers/searchapi.rs
    - crates/betterlite-config/src/providers/searchapi/**
    - crates/betterlite-core/fuzz/Cargo.toml
    - crates/betterlite-core/fuzz/fuzz_targets/google_pse_reply.rs
    - crates/betterlite-core/fuzz/fuzz_targets/searchapi_reply.rs
    - crates/betterlite-core/fuzz/corpus/google_pse_reply/**
    - crates/betterlite-core/fuzz/corpus/searchapi_reply/**
    - tools/oracle/cases/helpers/google-searchapi-search/**
    - tools/oracle/helpers/b8024.py
    - tools/oracle/helpers/b8024/**
    - tools/oracle/src/helpers/core_ops/b8024.rs
    - tools/oracle/src/helpers/core_ops/b8024/**
  lint_tables: false
review_level: security
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/google_pse/search/transformation.py#L58-L259
    why: Engine id rule, double key resolution, num cap, siteSearch handling, gl uppercasing and the params record.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/searchapi/search/transformation.py#L54-L241
    why: Key in the query string, site clause with AND, num cap, doseq encoding and organic_results reply.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/search/transformation.py#L137-L189
    why: The shared host check that keeps a server key away from a caller-chosen host.
  - url: https://docs.python.org/3/library/urllib.parse.html#urllib.parse.urlencode
    why: urlencode quoting that the query string must match.
dod:
  - text: Google PSE key and engine id checks, parameter mapping and URL match the source, and a server key is refused for an untrusted caller base.
    proof: [google-searchapi-tests, oracle]
  - text: SearchAPI key check, parameter mapping, AND-joined site clause and doseq URL match the source, with the same refusal.
    proof: [google-searchapi-tests, oracle]
  - text: Neither key appears in logs or error text, and both replies project the pinned fields.
    proof: [google-searchapi-tests, google-searchapi-corpus, oracle]
checks:
  optional: [mutants]
  commands:
    - id: google-searchapi-tests
      why: Google PSE or SearchAPI mapping, URL building, key handling or settings loading is missing
      run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::search_providers::(google_pse|searchapi)::/) - test(replays_the_google_pse_corpus) - test(replays_the_searchapi_corpus) | test(google_pse_search_settings) | test(searchapi_search_settings)'
    - id: google-searchapi-corpus
      why: The Google PSE or SearchAPI reply decoder has no new corpus inputs
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/google_pse_reply)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/searchapi_reply)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(replays_the_google_pse_corpus) | test(replays_the_searchapi_corpus)'
