  - tools/oracle/cases/helpers/google-searchapi-search/searchapi-untrusted-base-with-env-key.yaml
deviations: []
out_of_scope:
  - B3270 owns the shared records and the host check.
  - Both package initializers only re-export the config class.
  - B048 registers both configs, and B3272 runs the request.
pitfalls:
  - Both keys sit in the GET URL, so any log line or error text that shows the URL has to hide the key and api_key values.
  - Google PSE uppercases country into gl, while SearchAPI lowercases it, and Google also caps num at 10 with no floor.
  - Google PSE joins nothing with AND. Only the first listed domain is sent as siteSearch and the rest are dropped.
  - Google PSE checks the host twice, once in validate_environment and once in transform_search_request, and the second call only sees the api_base argument.
  - SearchAPI's default base already ends in /api/v1/search, so get_complete_url never appends a path.
  - SearchAPI joins its site clause with AND inside the parentheses pair, which is not the shape Serper uses.
  - The unified max_tokens_per_page is dropped by both, and neither forwards a caller num or gl option once the body has it.
  - "The url crate (form_urlencoded) is needed in crates/betterlite-core/Cargo.toml by B8023, B8024 and B048. The first part to merge adds the line and the others keep it."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
