id: B8024
title: Map Google PSE and SearchAPI.io GET searches with keys in the URL
description: >-
  Add api::search_providers::google_pse and api::search_providers::searchapi to betterlite-core on the B3270
  base hooks. Both are GET and both put the API key into the query string, so the key must never be logged or
  put in an error message. betterlite-config gets google_pse_search_settings (GOOGLE_PSE_API_KEY unset,
  GOOGLE_PSE_ENGINE_ID unset, GOOGLE_PSE_API_BASE default https://www.googleapis.com/customsearch/v1) and
  searchapi_search_settings (SEARCHAPI_API_KEY unset, SEARCHAPI_API_BASE default
  https://www.searchapi.io/api/v1/search). Display names are "Google PSE" and "SearchAPI.io (Google Search)".

  Google PSE validate_environment resolves the key with the shared policy, fails with "GOOGLE_PSE_API_KEY is not
  set. Set `GOOGLE_PSE_API_KEY` environment variable." when empty, then takes the engine id from the
  search_engine_id keyword or GOOGLE_PSE_ENGINE_ID and fails with the matching GOOGLE_PSE_ENGINE_ID message
  when empty. It sets only Content-Type. transform_search_request resolves the key again with its own api_key
  and api_base arguments (so the host check runs a second time), and fails with "GOOGLE_PSE_API_KEY is
  required" or "GOOGLE_PSE_ENGINE_ID is required". The record is q, cx, key, then num (max_results capped at 10
  above, no lower clamp), then siteSearch plus siteSearchFilter "i" (the first entry of a nonempty list, or a
  string as given; an empty list adds nothing), then gl (country uppercased). Other options copy in unless
  unified or already present. The record is returned as _google_pse_params and get_complete_url appends it
  with urlencode (no doseq) to the caller base, else GOOGLE_PSE_API_BASE, else the default, with no path
  handling. Reply: items with title, link (as url), snippet; dates null; a missing items gives none.

  SearchAPI validate_environment resolves the key (fail text "SEARCHAPI_API_KEY is not set. Set
  `SEARCHAPI_API_KEY` environment variable.") and sets Content-Type only. transform_search_request resolves it
  again and builds: engine "google", q, api_key, then num (max_results capped at 10), then q rewritten as (q)
  AND (site:a OR site:b) for a nonempty domain list, then gl (country lowercased), then other options unless
  unified or present. The search_engine_id argument is accepted and unused. The record is _searchapi_params and
  get_complete_url encodes it with doseq true onto the base, which already holds the full path. Reply:
  organic_results with title, link, snippet and date. transform_search_response accepts a missing logging
  object.

  Add fuzz targets google_pse_reply and searchapi_reply with replays_the_google_pse_corpus and
  replays_the_searchapi_corpus. The source holds 406 nonblank lines; plan 310 production and config lines, 240
  test lines and 170 oracle and fuzz lines. Encode with the form encoder from the url crate and correct it to
  Python quote_plus (keep `~`, encode `*`).
scope:
