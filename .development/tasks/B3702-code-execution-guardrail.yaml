oracle_cases: []

deviations:
  - what: "The DEFAULT_EVENT_HOOKS values are stored as strings (pre_call, post_call) in LiteLLM; betterlite uses GuardrailEventHooks enum variants. The constructor accepts both Literal strings and enum variants, normalizing to enum before passing to parent."
    why: "Rust uses enums for type safety and clarity; the wire format and config remain unchanged."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/block_code_execution/__init__.py#L13-L16"
  - what: "The apply_guardrail method is decorated with @log_guardrail_information in LiteLLM; in Rust, logging is called explicitly in the finally block instead, since decorators do not have equivalent semantics."
    why: "Both achieve the same goal: logging happens always, even on exceptions. The Rust implementation is more explicit about when and how logging occurs."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/block_code_execution/block_code_execution.py#L516-L588"

out_of_scope:
  - "CustomGuardrail base class and init (belongs to B104)"
  - "raise_passthrough_exception implementation (belongs to B104)"
  - "add_standard_logging_guardrail_information_to_request_data implementation (belongs to B104)"
  - "GuardrailConfigModel base schema (belongs to B104)"
  - "Text scanning and detection logic (_scan_text, _find_blocks, execution intent checking) (belongs to B3701)"
  - "Configuration loading from YAML/environment (belongs to B002)"
  - "Logging callback manager and request tracing infrastructure (belongs to B189)"

pitfalls:
  - "event_hook parameter normalization must handle three cases: None (default to [pre_call, post_call]), single string Literal (convert to enum and wrap in list), list of strings (convert each to enum). Typos in hook names raise ValueError from GuardrailEventHooks constructor."
  - "confidence_threshold clamping happens in the constructor via max(0.0, min(1.0, value)), not in apply_guardrail. Panics happen if clamping is not done; use saturating/checked arithmetic to ensure [0.0, 1.0] bounds."
  - "blocked_languages None and empty list have different meanings: None enables block_all mode (block everything), empty list also enables block_all (per LiteLLM logic). Set block_all = blocked_languages is None or len(blocked_languages) == 0. Store the original list in self.blocked_languages."
  - "apply_guardrail processes all texts before raising on should_raise=true. The exception is raised only after processing is complete and detections are accumulated. Early return on first raise breaks accumulation, so loop through all texts first, then raise if needed."
  - "When should_raise is true from _scan_text, determine the language from the first CodeBlockDetection with action_taken=='block'. Iterate detections in source order and break on first matching detection. Default language to 'unknown' if no match is found."
  - "HTTPException for responses (is_output=true) needs status_code=400 and detail as dict (not string). Detail dict keys are 'error' (message), 'guardrail' (name), 'language'. Raise before returning inputs."
  - "raise_passthrough_exception for requests (is_output=false) takes violation_message, request_data, detection_info dict. This raises an exception that the proxy converts to a response; it does not return a value."
  - "Max confidence from detections must handle None values in CodeBlockDetection['confidence']. Use: max_conf = max((d['confidence'] for d in detections if d.get('confidence') is not None), default=None)."
  - "event_type in tracing_detail is GuardrailEventHooks.pre_call for request input_type, GuardrailEventHooks.post_call for response. Do not use during_call even though it is in get_supported_event_hooks; during_call is supported but not logged."
  - "The finally block in apply_guardrail runs on normal completion, HTTPException, ModifyResponseException, and other exceptions. Status assignment happens inside the try/except, then logging happens in finally. Do not skip finally on any path."

review_level: standard

