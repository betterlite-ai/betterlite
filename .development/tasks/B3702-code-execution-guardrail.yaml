id: B3702
title: Code execution guardrail lifecycle and registration
description: >-
  Build the BlockCodeExecutionGuardrail class, its initialization, event-hook registration and apply_guardrail entry point that orchestrates detection and enforcement.

  The guardrail integrates the fenced-code detection from B3701 into a configurable, registerable guardrail. Owns the complete object lifecycle: construction with parameter validation, configuration model exposure for HTTP routes, event hook enumeration, request/response scanning orchestration, and error handling with distinct paths for request-side passthrough exceptions vs response-side HTTP 400.

  Build crates/betterlite-guardrails/src/block_code_execution/:
  - lifecycle.rs: BlockCodeExecutionGuardrail constructor (L331-L364 LiteLLM) accepting guardrail_name, blocked_languages (list[str] | None), action (Literal["block"|"mask"], default "block"), confidence_threshold (float, default 0.5, clamped to [0.0, 1.0]), detect_execution_intent (bool, default true), event_hook (Literal["pre_call"|"post_call"|"during_call"] | list[str] | None), and default_on (bool, default false). Normalize event_hook string or list to GuardrailEventHooks list; default to [pre_call, post_call] when None. Compute block_all = blocked_languages is None or empty. Call parent CustomGuardrail.__init__ with guardrail_name="block_code_execution" (or override), supported_event_hooks=[pre_call, post_call, during_call], event_hook (normalized list), and default_on. Store blocked_languages, block_all, action, confidence_threshold, detect_execution_intent as instance fields.
  - error_handling.rs: _raise_block_error (L496-L514 LiteLLM) accepting language (str), is_output (bool), request_data (dict). Generate message: "Content blocked: execution request detected" if language=="execution_request", else "Content blocked: executable code block detected (language: {language})". When is_output=true, raise HTTPException(status_code=400, detail={"error": msg, "guardrail": self.guardrail_name, "language": language}). When is_output=false, call self.raise_passthrough_exception(violation_message=msg, request_data=request_data, detection_info={"language": language}).
  - registration.rs: get_config_model (L366-L372 LiteLLM) static method returning type[BlockCodeExecutionGuardrailConfigModel]. get_supported_event_hooks (L374-L380 LiteLLM) returning [GuardrailEventHooks.pre_call, GuardrailEventHooks.post_call, GuardrailEventHooks.during_call]. apply_guardrail (L516-L588 LiteLLM) async decorated method: extract texts from inputs.get("texts", []), return inputs unchanged if empty. For each text, call self._scan_text(text, detections, input_type) from B3701, append modified text to processed. If should_raise, determine language from first detection with action_taken=="block" (default "unknown"), call self._raise_block_error(lang, is_output, request_data). Set inputs["texts"]=processed, return inputs. Try/except HTTPException/ModifyResponseException (status="guardrail_intervened"), other Exception (status="guardrail_failed_to_respond"), finally: build detection_dicts from detections, compute max_confidence (None if empty), call self.add_standard_logging_guardrail_information_to_request_data with guardrail_provider="block_code_execution", guardrail_json_response=detection_dicts or exception_str, status, start_time, end_time, duration, event_type (pre_call for request, post_call for response), tracing_detail (guardrail_id, detection_method="fenced_code_block", match_details, confidence_score if not None).
  - initializer.rs: _get_param (L19-L32 CODE_INIT) accepting litellm_params (LitellmParams), guardrail (Guardrail), key (str), default (object). Read getattr(litellm_params, key, default); if found and not None return it. Otherwise read guardrail.get("litellm_params") and access dict[key] if present. Return default if not found. initialize_guardrail (L35-L77 CODE_INIT) accepting litellm_params and guardrail, extracting guardrail_name (required, raise ValueError("Block Code Execution guardrail requires a guardrail_name") if missing/empty). Use _get_param to read: blocked_languages (list[str] | None, default None), action ("block"|"mask", default "block"), confidence_threshold (float, default 0.5, cast and clamp), detect_execution_intent (bool, default true), mode (str|None override for event_hook, default None). Compute event_hook = mode or DEFAULT_EVENT_HOOKS. Construct BlockCodeExecutionGuardrail with all parameters. Call litellm.logging_callback_manager.add_litellm_callback(instance). Return instance. Expose guardrail_initializer_registry (dict keyed by SupportedGuardrailIntegrations.BLOCK_CODE_EXECUTION.value) mapping to initialize_guardrail. Expose guardrail_class_registry mapping to BlockCodeExecutionGuardrail.

  Depend on B3690 (BlockCodeExecutionGuardrailConfigModel, CodeBlockDetection, CodeBlockActionTaken), B3701 (_scan_text), B189 (LoggingCallbackManager.add_litellm_callback), B002 (config loader). Unresolved B104: CustomGuardrail.__init__, raise_passthrough_exception, add_standard_logging_guardrail_information_to_request_data, ModifyResponseException, HTTPException.

  Default mode is pre_call plus post_call, action is "block", confidence_threshold is 0.5, detect_execution_intent is true, default_on is false.

