dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: issuer_scoped_mapping,
      inactive_mapping, missing_claim, fallback_team_mapping, auto_register_after_policy, registration_race,
      managed_agent_mapping_denied, postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_key_resolution::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/jwt_key_resolution.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/jwt-key-resolution-*")"
        && grep -rlq "jwt_key_resolution" tools/oracle/fuzz/corpus/helper_case/jwt-key-resolution-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/jwt_key_resolution::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/jwt_key_resolution::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^jwt_key_resolution::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/jwt-key-resolution-*")"
        && grep -rlq "virtual_key_mapping_cache_ttl" crates/betterlite-config/fuzz/corpus/config_yaml/jwt-key-resolution-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::jwt_key_resolution::tests::/)
        - test(/replays_the_/)'
