id: B766
title: Resolve verified JWT claims to virtual keys
description: >-
  Implement JwtKeyResolution for issuer-scoped claim mapping and pending auto-registration. Resolve only
  already verified claims; auto-registration runs after JWT permission/email/custom validation and persists
  the key first and the mapping second, without a transaction. Keep configured failure action, legacy issuer
  handling and fallback-team-mapping behavior as typed alternatives.


  Build the production jwt_key_resolution module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _auto_register_jwt_mapping (L942-L1081; 112 source lines), _lookup_jwt_mapping_token_hash (L1084-L1118;
  33 source lines), _resolve_jwt_to_virtual_key (L1121-L1307; 145 source lines).


  Read litellm_jwtauth.virtual_key_mapping_cache_ttl=300, virtual_key_claim_field=None and
  unregistered_jwt_client_behavior='fallback_team_mapping', including B869's issuer-specific
  overrides and jwt_client_id_field compatibility alias. B213 owns get_nested_value; B738 owns
  mapping lookup/cache keys; B733/B734 own cache reads/writes; B753 owns _raw_cache; B870 owns
  IdentityStore.resolve/key_from_principal; B893 owns generate_key_helper_fn; B2314 owns hash_token.
  Own _PendingAutoRegister's four fields (L923-L939) and the '__JWT_PROXY_ADMIN__' constant (L914)
  alongside these callers. The upstream function's race-safety docstring is not a transaction.

  disabled_claim_mapping returns None; issuer_nonstring_global uses only a string normalized issuer;
  nested_claim_stringified preserves str(claim_value), including empty/false/numeric values.
  missing_claim_fallback returns None without cache writes; missing_claim_reject and
  missing_claim_auto_register are HTTP 403. admin_sentinel_auto_register returns None to rerun
  policy; admin_sentinel_policy_changed ignores the old sentinel and looks up again.
  cached_miss_reject is 403; cached_miss_fallback returns None; cached_miss_auto_register evicts
  '__NO_MAPPING__' before returning pending identity, with HTTP 500 on both cached and fresh
  no-DB paths. fresh_reject caches the miss before 403; fresh_fallback caches it before None;
  fresh_pending does not cache a miss. Cache failures propagate; no warning/fallback is invented.

  issuer_scoped_mapping wins over global_mapping; global_cache_hit accepts only strings other than
  '__NO_MAPPING__'. global_row_cached_separately never stores a global result under an issuer key.
  inactive_mapping follows B738's is_active filtering; mapped_key_resolution uses B870 and never
  bypasses a missing/revoked key. B757 translates these HTTP failures into auth_error, param 'None',
  code equal to status string; a missing mapping is distinct from B870's token_not_found_in_db.

  auto_register_after_policy passes table_name='key', request_type='key', llm_router=None and
  validated team/user/org/agent IDs to B893, with metadata auto_registered=true, jwt_claim_field and
  jwt_claim_value. Hash the returned plaintext token before inserting the mapping. Store issuer
  None as '', created_by=updated_by='auto_register', then cache the hash for the configured TTL,
  then resolve identity and set org_id/end_user_id/api_key=token on a non-null result.
  registration_race recognizes case-insensitive 'unique' or 'p2002', deletes its orphan key,
  fetches the winner and continues. orphan_delete_warns retains the orphan when deletion fails;
  winner_disappeared is 503 without caching a miss. mapping_insert_failed leaves the already
  created key on any other failure; cache_write_failed leaves both rows. These are distinct
  Postgres failure cases, with POSTGRES_TEST_URL and testcontainers fallback.


  Add the jwt_key_resolution operation under B856 Management::jwt for typed lookup/cache policy only.
  Auto-registration calls B893's server-state-dependent creation service and is tested through
  the real HTTP flow and Postgres, never by calling a handler in a helper adapter. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-key-resolution-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::jwt_key_resolution::tests::loads_settings, defaults_and_precedence,
  issuer_override, legacy_claim_alias and invalid_behavior_rejected.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 290 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  300 production including the pending result, 300 behavior/Postgres tests, 65 helper adapters,
  65 route/manifests/wiring, 0 decoder/fuzz and 50 config lines: 780 lines within an 800-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::jwt_key_resolution::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
