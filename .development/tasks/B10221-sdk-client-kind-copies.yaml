id: B10221
title: One ClientKind and SuppliedClient in betterlite-http for the OpenAI SDK, anthropic and foundry client class copies
description: >-
  Six betterlite-openai modules, anthropic's chat call and foundry's embeddings each declare their own two-variant enum for the class of the client a caller hands LiteLLM: the sync or the async one (OpenAI or AsyncOpenAI, HTTPHandler or AsyncHTTPHandler), the class LiteLLM's isinstance checks test. Anthropic and foundry also pair it with a borrowed transport in a struct of their own. Core has the same pair as `ClientKind` and `SuppliedClient<'client, Client>` in crates/betterlite-core/src/api/vector_store_http_write/service.rs, but these crates sit below betterlite-core and cannot import it. This task writes one ClientKind and one SuppliedClient into the empty module crates/betterlite-http/src/client_kind.rs (the stub and its `pub mod client_kind;` line in lib.rs are on main) and points every copy's users at it. betterlite-openai, betterlite-anthropic, betterlite-foundry, betterlite-azure, every crate above them and every oracle helper group in scope already depend on betterlite-http, so no Cargo.toml changes and no new crate edge. B10220 moves core's pair onto the same home once B10216 and B10217 have landed. It is a refactor: what each family sends, logs, raises and reports stays the same.


  The home. `#[derive(Debug, Clone, Copy, PartialEq, Eq, Deserialize, Serialize)]` and `#[serde(rename_all = "snake_case")]` over `pub enum ClientKind { Sync, Asynchronous }`, with `#[serde(rename = "async")]` on Asynchronous and a one-line comment saying what the class is. The variant is spelled Asynchronous as core's is, so B10220 renames no core user. The serde names are "sync" and "async", the names openai's batches and text_completion_transport enums read and write today and the names every oracle case sends. `impl ClientKind` holds `#[must_use] pub const fn label(self) -> &'static str` giving "sync" and "async", the method image_variations and speech carry today. `pub struct SuppliedClient<'client, Client> { pub kind: ClientKind, pub transport: &'client Client }` follows, with no derives, as anthropic's and foundry's have none. Its tests go in client_kind/tests.rs behind `#[cfg(test)] mod tests;`: both values serialize with serde_json to "sync" and "async" and read back, and label gives the same two names.


  The copies, all `Sync, Async`. betterlite-openai: assistants/client.rs L52-L56, batches/sdk.rs L11-L16 (with the serde derives), image_variations/client.rs L9-L13 plus its label impl L15-L23, speech/client.rs L10-L14 plus its label impl L16-L24, text_completion_transport/sdk.rs L13-L19 (comment, serde derives) and transcription/client.rs L10-L14. betterlite-anthropic: chat_call/transport.rs L10-L15 (`ClientKind` and its comment) and L16-L19 (`SuppliedChatClient<'clients, Client> { kind, transport }`). betterlite-foundry: embeddings/call.rs L23-L27 (`EmbeddingMode`) and L29-L33 (`SuppliedClient<'client, Client> { mode, client }` and its comment). Each goes, and its module imports `betterlite_http::client_kind::ClientKind` (and `SuppliedClient` for anthropic and foundry) in its place.


  The users. Every `ClientKind::Async` of these enums becomes `ClientKind::Asynchronous`, also where a file renames the import: azure's transcription/call.rs L15, call/client.rs L7 and call/reply.rs L9 import openai's transcription ClientKind as `CallKind`, and provider's azure_resource_dispatch/tests/files_batches_cases.rs L18 and the oracle's azure/batches/fixture.rs L14 import openai's batches ClientKind as `SdkKind`. `EmbeddingMode` becomes `ClientKind`; the fields that hold it (`mode` on TextEmbeddingCall L45, FoundryEmbeddingRequest L69 and the test support) keep their names. foundry's supplied client takes the home's field names, so `mode` and `client` become `kind` and `transport` wherever one is built or read. `SuppliedChatClient` becomes `SuppliedClient`. The users by crate: betterlite-openai's assistants, batches, image_variations, speech, text_completion_execution, text_completion_transport, thread_runs, threads and transcription; betterlite-azure's assistants, azure_assistant_definitions, azure_message_attachments, azure_thread_messages, batches and transcription; anthropic's chat_call; foundry's anthropic and embeddings; core's api::assistant_read_delete, assistant_run_sdk (its tests reach the type through `use super::*`) and assistant_threads; provider's adapters/vertex_agent_stream, anthropic_dispatch, azure_resource_dispatch, bytez_stream_call, foundry_dispatch, langgraph_stream, openai_assistant_dispatch, openai_dispatch/fixtures/text_transport.rs and openai_resource_dispatch; server's api::assistant_dispatch; and the oracle helpers under tools/oracle/src/helpers/anthropic, azure, foundry, openai and provider. The scope lists each file.


  The oracle's wire copies. Eight helper enums read the case's "sync" or "async" only to turn it into one of these classes: `KindName` in tools/oracle/src/helpers/azure/assistant_definitions.rs L25-L29, assistants.rs L27-L30, message_attachments.rs L26-L29 and thread_messages.rs L25-L29, `KindName` in openai/assistants/input.rs L56-L59, `Kind` in openai/image_variations/input.rs L19-L22, `SuppliedKind` in openai/speech/input.rs L48-L51 and `ModeName` in foundry/embeddings/input.rs L32-L35. Each field that holds one takes `ClientKind` itself, and the converters go with them: `client_kind` in azure's assistants/steps.rs L200, assistant_definitions/steps.rs L167, message_attachments/steps.rs L148 and thread_messages/steps.rs L159, `kind_of` in openai/assistants.rs L108, `ModeName::mode` (foundry/embeddings/input.rs L37-L44) and the inline matches in openai/image_variations.rs L82-L83 and openai/speech/input.rs L91-L92. Five hand-written `ClientKind::Sync => "sync"` matches (azure's assistant_definitions/reports.rs L49, assistants/reports.rs L42, message_attachments/reports.rs L66, thread_messages/reports.rs L55 and openai/assistants.rs L169) call `label()` instead. The two azure KindName enums derive Default with Sync as the default, but no struct that holds one derives Default, so nothing reads it.


  Not merged. openai's files.rs ClientKind (L57-L60) carries the FilesClient in each variant, so it is a supplied client, not a class. speech's `SuppliedClient` (client.rs L31-L40), assistants' `SdkClient` (client.rs L58-L59) and image_variations' `ImageVariationClient` (client.rs L29-L39) carry the constructor settings, not a borrowed transport, so they keep their structs and only their `kind` fields take the home type. azure's endpoints::projection `ClientKind` has five variants (AzureOpenAi, AsyncAzureOpenAi, OpenAi, AsyncOpenAi, Other), so it and its `SuppliedClient` stay. foundry's AgentRunMode and anthropic `Style`, azure's image_transport CallStyle, openai's codestral_call Mode, cohere_legacy_embedding SdkMode, compatible_embedding Mode and compatible_line_stream Mode pick which LiteLLM call runs, sync or async, not the class of a supplied client; that is a different concept and stays.


  Tests. The home's tests.rs is the only new test. The families' tests already pick a supplied client by class and rebuild the other class, and they pass with only the import, the variant name and foundry's field names changed.


  What users see: nothing.
