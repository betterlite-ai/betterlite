references: []
dod:
  - text: betterlite-http's client_kind module holds the one ClientKind, with Sync and Asynchronous, the serde names "sync" and "async" and label, and the one SuppliedClient with kind and transport, and its tests pass.
    proof: [http-home-shape, http-kind-tests]
  - text: anthropic's chat_call, foundry's embeddings and openai's assistants, batches, image_variations, speech, text_completion_transport and transcription declare no client class enum or supplied client pair of their own, and no user spells the async class Async.
    proof: [sdk-kind-copies, sdk-kind-variants]
  - text: The oracle helpers read the supplied client's class straight into the home ClientKind, with no wire enum, converter or hand-written label of their own.
    proof: [sdk-kind-wire-copies]
  - text: The families' tests in openai, anthropic, foundry, azure, provider, core and server pass unchanged apart from the import, the variant name and foundry's field names.
    proof: [openai-kind-tests, anthropic-kind-tests, foundry-kind-tests, azure-kind-tests, provider-sdk-kind-tests, core-assistant-kind-tests, server-assistant-kind-tests]
checks:
  optional: []
  commands:
    - id: http-home-shape
      why: the home lost its async serde name, its label or its supplied client
      run: |-
        grep -qxF 'pub enum ClientKind {' crates/betterlite-http/src/client_kind.rs &&
        grep -qxF '    Asynchronous,' crates/betterlite-http/src/client_kind.rs &&
        grep -qxF '    #[serde(rename = "async")]' crates/betterlite-http/src/client_kind.rs &&
        grep -qF 'pub const fn label(self)' crates/betterlite-http/src/client_kind.rs &&
        grep -qxF "pub struct SuppliedClient<'client, Client> {" crates/betterlite-http/src/client_kind.rs
    - id: sdk-kind-copies
      why: a crate below core still declares its own client class enum, supplied client pair or label
      run: |-
        test -z "$(grep -lE '^pub enum (ClientKind|EmbeddingMode)\b' crates/betterlite-anthropic/src/chat_call/transport.rs crates/betterlite-foundry/src/embeddings/call.rs crates/betterlite-openai/src/assistants/client.rs crates/betterlite-openai/src/batches/sdk.rs crates/betterlite-openai/src/image_variations/client.rs crates/betterlite-openai/src/speech/client.rs crates/betterlite-openai/src/text_completion_transport/sdk.rs crates/betterlite-openai/src/transcription/client.rs)" &&
        test -z "$(grep -lE '^pub struct (SuppliedChatClient|SuppliedClient)\b' crates/betterlite-anthropic/src/chat_call/transport.rs crates/betterlite-foundry/src/embeddings/call.rs)" &&
        test -z "$(grep -rnwE 'SuppliedChatClient|EmbeddingMode' crates/betterlite-anthropic/src crates/betterlite-foundry/src crates/betterlite-provider/src tools/oracle/src/helpers/anthropic tools/oracle/src/helpers/foundry tools/oracle/src/helpers/provider --include=*.rs)" &&
        test -z "$(grep -rnF 'const fn label(self)' crates/betterlite-openai/src/image_variations crates/betterlite-openai/src/speech --include=*.rs)"
    - id: sdk-kind-variants
      why: a user still spells the async class Async, so it names a deleted enum
      run: |-
        test -z "$(grep -rnwE '(ClientKind|CallKind|SdkKind)::Async' crates/betterlite-anthropic/src crates/betterlite-foundry/src crates/betterlite-openai/src crates/betterlite-azure/src crates/betterlite-core/src/api/assistant_read_delete crates/betterlite-core/src/api/assistant_run_sdk crates/betterlite-core/src/api/assistant_threads crates/betterlite-provider/src/adapters crates/betterlite-provider/src/anthropic_dispatch crates/betterlite-provider/src/azure_resource_dispatch crates/betterlite-provider/src/bytez_stream_call crates/betterlite-provider/src/foundry_dispatch crates/betterlite-provider/src/langgraph_stream crates/betterlite-provider/src/openai_assistant_dispatch crates/betterlite-provider/src/openai_dispatch crates/betterlite-provider/src/openai_resource_dispatch crates/betterlite-server/src/api/assistant_dispatch tools/oracle/src/helpers/anthropic tools/oracle/src/helpers/azure tools/oracle/src/helpers/foundry tools/oracle/src/helpers/openai tools/oracle/src/helpers/provider --include=*.rs | grep -vF '::Async(')"
    - id: sdk-kind-wire-copies
      why: an oracle helper still reads the class into a wire enum of its own or spells its label by hand
      run: |-
        test -z "$(grep -nE '^(pub(\((crate|super)\))? )?enum (KindName|Kind|SuppliedKind|ModeName)\b' tools/oracle/src/helpers/azure/assistant_definitions.rs tools/oracle/src/helpers/azure/assistants.rs tools/oracle/src/helpers/azure/message_attachments.rs tools/oracle/src/helpers/azure/thread_messages.rs tools/oracle/src/helpers/openai/assistants/input.rs tools/oracle/src/helpers/openai/image_variations/input.rs tools/oracle/src/helpers/openai/speech/input.rs tools/oracle/src/helpers/foundry/embeddings/input.rs)" &&
        test -z "$(grep -rnE 'ClientKind::Sync => "sync"' tools/oracle/src/helpers/azure tools/oracle/src/helpers/openai --include=*.rs)"
    - id: http-kind-tests
      why: the home's serde names or label no longer match "sync" and "async"
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^client_kind::/)'
    - id: openai-kind-tests
      why: an openai family no longer picks or rebuilds the SDK client by class
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^(assistants|batches|image_variations|speech|text_completion_execution|text_completion_transport|thread_runs|threads|transcription)::/) - test(/replays_/)'
    - id: anthropic-kind-tests
      why: anthropic's chat call no longer reuses a supplied client of the matching class
      run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^chat_call::/) - test(/replays_/)'
    - id: foundry-kind-tests
      why: foundry's embeddings or anthropic route no longer pick the supplied client by class
      run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/^(anthropic|embeddings)::/) - test(/replays_/)'
    - id: azure-kind-tests
      why: an azure assistants, batches or transcription call no longer reaches the OpenAI SDK class through the home
      run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/^(assistants|azure_assistant_definitions|azure_message_attachments|azure_thread_messages|batches|transcription)::/) - test(/replays_/)'
    - id: provider-sdk-kind-tests
      why: a provider dispatch no longer hands the class of its supplied client to the openai, anthropic or foundry call
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^(adapters::vertex_agent_stream|anthropic_dispatch|azure_resource_dispatch|bytez_stream_call|foundry_dispatch|langgraph_stream|openai_assistant_dispatch|openai_dispatch|openai_resource_dispatch)::/) - test(/replays_/)'
    - id: core-assistant-kind-tests
      why: core's assistant calls no longer pass the SDK class to openai's assistants client
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(assistant_read_delete|assistant_run_sdk|assistant_threads)::/)'
    - id: server-assistant-kind-tests
      why: the server's assistant routes no longer build the supplied SDK client with its class
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::assistant_dispatch::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "B10220: core's ClientKind and SuppliedClient in vector_store_http_write::service, their users in core, provider, bedrock, vertex, python and server, and the oracle's sdk_http Mode enums that convert into them. They move onto this home after B10216 and B10217 land."
  - "openai's files.rs ClientKind, whose variants carry the FilesClient, and the settings-carrying SuppliedClient, SdkClient and ImageVariationClient structs, which only take the home type in their `kind` fields."
  - "azure's endpoints::projection ClientKind and SuppliedClient, five classes that tell Azure from OpenAI clients."
  - "The Sync and Async enums that pick which LiteLLM call runs rather than the class of a supplied client: foundry's AgentRunMode and anthropic Style, azure's CallStyle, openai's codestral_call Mode, cohere_legacy_embedding SdkMode, compatible_embedding Mode and compatible_line_stream Mode, router's semantic_embeddings EmbeddingMode and the oracle's entry point enums."
  - "betterlite-redis's ClientKind (the redis-py client class for a connection) and betterlite-router's deployment_clients ClientKind (the cache key for a deployment's client), which are other concepts."
pitfalls:
  - "openai's files.rs ClientKind keeps `Async(FilesClient)`, so a blanket rename of `ClientKind::Async` in openai, provider or the oracle breaks files callers; rename only users of the six copies, and leave `ClientKind::Async(` alone."
  - "Several files reach a copy without naming its module: azure's transcription imports openai's ClientKind as `CallKind`, provider's files_batches_cases.rs and the oracle's azure/batches/fixture.rs as `SdkKind`, text_completion_transport.rs through `use self::sdk::{...}`, and core's assistant_run_sdk tests through `use super::*`. Each still needs the Asynchronous spelling."
  - "speech/client.rs keeps its settings-carrying `pub struct SuppliedClient`; only the enum and its label impl leave that file, and the speech module imports only ClientKind from the home, since importing the home's SuppliedClient there clashes with the local name. The same goes for azure files that import projection's SuppliedClient."
  - "The batches and text_completion_transport enums serialize today; the home's `#[serde(rename = \"async\")]` keeps their output \"async\", so the oracle answers do not change. Without it serde writes \"asynchronous\"."
  - "The home lives in betterlite-http so every crate can name it; do not leave a `pub use` of it in openai, anthropic or foundry, since that is one more path to the same name. Each user imports `betterlite_http::client_kind` directly."
