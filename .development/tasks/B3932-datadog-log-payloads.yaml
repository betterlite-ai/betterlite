id: B3932
title: Datadog standard and legacy log payloads
description: >-
  Build crates/betterlite-logging/datadog to create Datadog log payload structures for standard LLM logging and legacy formats.

  Implement a DatadogPayload type as a TypedDict with required fields ddsource, ddtags, hostname, message, service, status (from B3930's DataDogStatus enum: INFO, WARN, ERROR)
  and optional trace fields dd.trace_id and dd.span_id. Both required and optional fields serialize via B192's JSON serialization.

  Implement standard_logging_to_datadog: given a StandardLoggingPayload (from B254), status (DataDogStatus), and configuration (from B3930's tag getters and hostname), create a DatadogPayload.
  The message field is the JSON-serialized StandardLoggingPayload via B192. Use B3931's truncation to limit error_str, messages and response fields to 10,000 characters before serialization.

  Implement legacy_v1_logging_to_datadog: given the old logging kwargs dict format, response_obj, start/end timestamps, status and configuration, create a DatadogPayload.
  The message field serializes the old dict with id (from response_obj or generated), call_type, cache_hit, start_time, end_time, response_time, model, user, model_parameters,
  spend (response_cost), messages, response, usage and metadata (with endpoint/caching_groups/previous_models filtered out). The helper cleans metadata before logging.

  Both payload builders attach trace context via B3930's span context module when a trace ID is available, setting dd.trace_id and dd.span_id (when present).

  Every default, environment variable and config key comes from B3930 (DD_SOURCE defaults to "litellm", DD_SERVICE to "litellm-server", etc., and DD_BASE_URL is read but has no literal default).

scope:
  paths:
    - crates/betterlite-logging/src/datadog.rs
    - crates/betterlite-logging/src/datadog/**
    - crates/betterlite-logging/src/datadog/tests.rs
    - crates/betterlite-logging/src/datadog/tests/**
  lint_tables: false
