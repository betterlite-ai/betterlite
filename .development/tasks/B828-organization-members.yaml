id: B828
title: Organization member addition, patch and deletion
description: >-
  Implement organization_members in betterlite-server for POST /organization/member_add,
  PATCH /organization/member_update and DELETE /organization/member_delete. B826 supplies
  _verify_org_access and the typed table accessors; B723 supplies user/organization reads, B726
  OrganizationMembershipRepository, B124 PrismaClient.insert_data, B1227 internal-user defaults,
  B829 budget creation/update, B732 the request/principal contracts and B052 authentication.
  Decorate add and update with B865 ManagementEffects; delete has no such decorator.


  Build the production organization_members module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/organization_endpoints.py:
  organization_member_add (L1281-L1397; 94 source lines), find_member_if_email (L1400-L1420; 20 source
  lines), organization_member_update (L1430-L1572; 119 source lines), organization_member_delete (L1580-L1621;
  34 source lines), add_member_to_organization (L1624-L1706; 71 source lines).


  Organization member budgets use checked Decimal values while retaining the existing budget columns.


  Addition checks the database (500, detail.error "No db connected"), organization access, then
  existence (404). Accept a single member or a list, including an empty list, and return organization_id,
  updated_users and updated_organization_memberships in input order. Resolve user_id first; only when
  absent from the database try user_email. Create a missing user with the supplied nonempty id or UUID
  and B1227 defaults, then create the membership with organization_id, user_id and user_role. The request's
  max_budget_in_organization is ignored on add. There is no encompassing transaction or duplicate
  membership upsert. Preserve earlier users/members if a later create fails. Email lookup exceptions,
  the source's len(email_row)>1 rejection (400 before wrapping), a missing returned user and the
  defensive user-not-found branch become ValueError in add_member_to_organization, then 500 auth_error
  at the route. Its own except block converts HTTPException to auth_error with the original status,
  preserves ProxyException, and converts other exceptions to 500 auth_error, param "None"; numeric
  codes are serialized by the shared ProxyException contract. Log the addition failure once there.


  Update resolves email only if user_id is None. find_member_if_email returns 400 for either a missing
  row or a lookup exception, with the diagnostic asking for user_id. The organization must exist
  (400), membership lookup errors are 400 and a missing membership is 404. A global proxy_admin or
  proxy_admin_viewer target can be changed only by a proxy_admin (403 otherwise). Write a non-null
  role first. A non-null max_budget_in_organization, including zero, creates a UUID budget if budget_id
  is None or updates the existing budget through B829, then writes budget_id back to membership;
  return a fresh membership including litellm_budget_table, or 400 if the final read is empty.
  Omitted/null fields do not clear values. B829's budget validation can therefore fail after the role write.
  Delete resolves email by the same rule, deletes only the composite user_id_organization_id row and
  returns that row: no last-admin guard, team/key cleanup, budget deletion or user deletion exists here.
  Both update and delete use the CommonProxyErrors database diagnostic, log failures and rethrow;
  HTTPException remains a detail response without invented error.type/param/code fields. They do not
  use handle_exception_on_proxy. The shared server exception handlers own unhandled repository errors.


  Run the three organization routes through both booted proxies with independently seeded equivalent
  databases; choose principals that distinguish proxy admin from an admin of the specific organization.


  Organization membership fixtures use B860 against POSTGRES_TEST_URL, or testcontainers when that
  variable is absent. A configured connection failure fails the test. Isolate each schema and verify
  the user, organization membership and budget rows separately after each injected write failure.


  Use HTTP cases for the three handlers, comparing JSON/detail versus error envelopes, status, nulls
  and content-type; error message text alone may differ under errors-match-litellm. Postgres tests
  postgres_pinned_rows cover id/email precedence, new-user defaults, empty/single/list additions,
  ignored add budget, role-only/no-op patch, new/existing/zero budgets and delete retention. In
  postgres_failure_effects inject failure after user insertion, on the second membership, after role
  update and after budget creation; assert exactly the preceding writes survive. Fault cases
  email_lookup_error, email_row_length, missing_insert_result, missing_final_member and
  membership_lookup_error exercise the defensive branches against the real repository boundary.
  The owned functions contain 293 nonblank noncomment lines excluding docstrings; allow 300 production,
  340 tests and 80 wiring lines, 720 total within 750. No owned code checks premium_user or stores secrets.
