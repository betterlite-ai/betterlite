id: B828
title: Organization membership mutation and info routes
description: >-
  Implement organization list/info (including deprecated POST info), member add/update/delete and email
  identity resolution. Preserve member roles, per-member budgets and parent-team/key cleanup rules; no
  paid-tier member cap applies.


  Build the production organization_members module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/organization_endpoints.py:
  organization_member_add (L1281-L1397; 94 source lines), find_member_if_email (L1400-L1420; 20 source
  lines), organization_member_update (L1430-L1572; 119 source lines), organization_member_delete (L1580-L1621;
  34 source lines), add_member_to_organization (L1624-L1706; 71 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Register these actual HTTP routes and aliases exactly once: POST /organization/member_add -> organization_member_add;
  PATCH /organization/member_update -> organization_member_update; DELETE /organization/member_delete
  -> organization_member_delete. For each route send a typed successful request, an invalid or missing
  target, and a caller lacking that route permission through B001 HttpCase against the running pinned
  MIT proxy and betterlite. Public login/session routes instead prove bad credentials or invalid/expired
  codes. Compare status, response model including null/absent fields, error type/param/code, content-type,
  redirect/cookie headers and litellm-changed-by where read. Do not reduce endpoint checks to direct helper
  invocations. handle_exception_on_proxy controls management error mapping; keep source partial writes
  visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 338 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  338 production, 151 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 554 changed lines estimated within a 575-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
