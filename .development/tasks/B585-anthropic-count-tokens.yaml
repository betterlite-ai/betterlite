id: B585
title: Anthropic native token counting
description: >-
  Add AnthropicCountRequest and native count_tokens execution, preserving selection policy, message/system/tool
  conversion, model validation and required beta headers. Keep fallback local token counting explicit with its warning;
  no Hugging Face downloads or request-media fetching is introduced.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/count_tokens/handler.py:
  AnthropicCountTokensHandler.handle_count_tokens_request L31-L128. litellm/llms/anthropic/count_tokens/token_counter.py:
  AnthropicTokenCounter.should_use_token_counting_api L20-L24; AnthropicTokenCounter.count_tokens L26-L106. litellm/llms/anthropic/count_tokens/transformation.py:
  AnthropicCountTokensConfig.get_anthropic_count_tokens_endpoint L29-L36; AnthropicCountTokensConfig.transform_request_to_count_tokens
  L38-L65; AnthropicCountTokensConfig.get_required_headers L67-L88; AnthropicCountTokensConfig.validate_request
  L90-L125.


  Reuse AnthropicError.__init__ from B567 (litellm/llms/anthropic/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse optionally_handle_anthropic_oauth from B567 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-anthropic/src/count_tokens.rs with adjacent tests under count_tokens/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_count_tokens in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function count_tokens_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): count_endpoint, messages_system_tools, required_beta_header, model_validation, native_count_success, count_api_failure_fallback,
  count_selection. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_count_tokens* using HelperCase: kind:
  helper and the externally tagged anthropic_count_tokens variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_count_tokens that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 229 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 471 planned, 475 maximum changed lines.
