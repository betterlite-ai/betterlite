id: B585
title: Anthropic native token counting
description: >-
  Add AnthropicCountRequest and native count_tokens execution, preserving selection policy, message/system/tool
  conversion, model validation and required beta headers. Keep missing-input None separate from explicit native
  error records; this counter never invokes a local tokenizer; no Hugging Face downloads or request-media fetching
  is introduced.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/count_tokens/handler.py:
  AnthropicCountTokensHandler.handle_count_tokens_request L31-L128. litellm/llms/anthropic/count_tokens/token_counter.py:
  AnthropicTokenCounter.should_use_token_counting_api L20-L24; AnthropicTokenCounter.count_tokens L26-L106. litellm/llms/anthropic/count_tokens/transformation.py:
  AnthropicCountTokensConfig.get_anthropic_count_tokens_endpoint L29-L36; AnthropicCountTokensConfig.transform_request_to_count_tokens
  L38-L65; AnthropicCountTokensConfig.get_required_headers L67-L88; AnthropicCountTokensConfig.validate_request
  L90-L125 litellm/llms/anthropic/common_utils.py: AnthropicModelInfo.get_token_counter L1202-L1213.


  Reuse AnthropicError.__init__ from B567 (litellm/llms/anthropic/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse optionally_handle_anthropic_oauth from B567 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: count_endpoint: Handler uses truthy explicit api_base as a complete endpoint verbatim, otherwise
  https://api.anthropic.com/v1/messages/count_tokens. No ANTHROPIC_API_BASE/BASE_URL lookup or suffix append here.
  Timeout uses explicit non-None including0 else B198 request_timeout (default6000). messages_system_tools: Request
  is model/messages unchanged, include system/tools iff non-None (including empty), and copy only optional_params
  thinking,tool_choice,output_config. Validate as dict[str,JsonValue], allowing arbitrary JSON fields inside messages/tools;
  no B577 prompt/system/tool normalization occurs. required_beta_header: Content-Type=application/json,x-api-key=given
  key,anthropic-version=2023-06-01,anthropic-beta=ANTHROPIC_TOKEN_COUNTING_BETA_VERSION env defaulttoken-counting-2024-11-01;
  apply B567 OAuth mutator with its beta merge/browser header. Reuse exactly the shared beta loader in B565. model_validation:
  Validate in order: falsey model -> ValueError model parameter is required; all falsey messages/system/tools ->
  messages parameter is required; non-list messages -> messages must be a list; each nondict -> Message <i> must
  be a dictionary; missing role/content -> Message <i> must have a 'role'/'content' field. A list with no messages
  but truthy system/tools is valid at the handler layer. native_count_success: Only HTTP200 succeeds, decode response
  bytes as dict[str,JsonValue] without requiring input_tokens; counter maps result input_tokens default0, request_model/model_used,
  tokenizer_type=anthropic_api, original_response. No result returns None. count_selection: Only exact provider
  anthropic selects API. Falsey messages return None even with system/tools; contents ignored. Use truthy deployment
  litellm_params.api_key then ANTHROPIC_API_KEY only; absent key warns No Anthropic API key found for token counting
  and returns None. Counter does not forward deployment api_base/timeout/optional_params or use ANTHROPIC_AUTH_TOKEN/globalkey.
  token_counter_factory: AnthropicModelInfo.get_token_counter always returns the native Anthropic counter supplied
  by this service; it never selects a tokenizer based on model. count_api_error_result: Non200 -> AnthropicError
  raw status/text; HTTPStatusError -> response status/text; all other validation/JSON/transport errors -> AnthropicError500
  CountTokens processing error: <error>. Counter catches AnthropicError and warns Anthropic CountTokens API error:
  status=<status>, message=<message>, returns error=true,total_tokens0,status/error_message. Other exceptions warn
  Error calling Anthropic CountTokens API: <error> and return500 error record; no local fallback.


  Load ANTHROPIC_TOKEN_COUNTING_BETA_VERSION through betterlite-config, with injected environment lookup and the
  defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest anthropic_count_config_cases; each named loads_<key> case invokes the real B002 loader, checks
  explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Outside-byte boundary: decode_count_response consumes native count-response JSON bytes as a JSON object in crates/betterlite-anthropic/src/count_tokens.rs
  or its scoped child module. Use that production decoder from the request path, Rust oracle adapter and cargo-fuzz
  target crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_count_tokens.rs. Add valid, malformed, truncated
  and boundary corpus inputs and adjacent test replays_the_anthropic_count_tokens_corpus that checks outcome categories
  through this decoder. The B171 HelperCase parser is a separate boundary.


  Write standalone Rust test count_tokens_credential_identity_isolation in betterlite-anthropic: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test count_tokens_secret_safe_failure in betterlite-anthropic: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-anthropic/src/count_tokens.rs with adjacent tests under count_tokens/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_count_tokens in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function count_tokens_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): count_endpoint, messages_system_tools, required_beta_header, model_validation, native_count_success, count_selection,
  token_counter_factory, count_api_error_result. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_count_tokens* using HelperCase: kind:
  helper and the externally tagged anthropic_count_tokens variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_count_tokens that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 239 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 250 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 30 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 730 planned, 750 maximum changed lines.
