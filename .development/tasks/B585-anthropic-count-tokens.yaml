checks:
  optional:
  - mutants
  commands:
  - id: case-count-endpoint
    why: The count-endpoint behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_count_endpoint$/)'
  - id: case-messages-system-tools
    why: The messages-system-tools behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_messages_system_tools$/)'
  - id: case-required-beta-header
    why: The required-beta-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_required_beta_header$/)'
  - id: case-model-validation
    why: The model-validation behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_model_validation$/)'
  - id: case-native-count-success
    why: The native-count-success behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_native_count_success$/)'
  - id: case-count-api-failure-fallback
    why: The count-api-failure-fallback behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_count_api_failure_fallback$/)'
  - id: case-count-selection
    why: The count-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_count_selection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_count_tokens.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_count_tokens*")"
      && grep -lq 'anthropic_count_tokens' tools/oracle/fuzz/corpus/helper_case/anthropic_count_tokens* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_count_tokens$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
