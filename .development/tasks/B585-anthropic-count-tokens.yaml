    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_count_tokens*")"
      && grep -lq 'anthropic_count_tokens' tools/oracle/fuzz/corpus/helper_case/anthropic_count_tokens* && cargo
