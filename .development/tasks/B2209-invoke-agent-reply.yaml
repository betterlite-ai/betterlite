  even if status200. No own HTTP-status guard before parsing.


  Implement crates/betterlite-bedrock/src/invoke_agent_reply.rs with adjacent tests under invoke_agent_reply/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation invoke_agent_reply in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_agent_reply_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): agent_event_stream_content, chunk_parse_and_decode, agent_error_frame, trace_json_warning, preprocess_trace_usage,
  orchestration_model, agent_reply_and_failure. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/invoke_agent_reply* using HelperCase: kind: helper
  and the externally tagged invoke_agent_reply variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_invoke_agent_reply that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_agent_trace consumes AWS frame payload JSON and nested base64 chunk bytes in crates/betterlite-bedrock/src/invoke_agent_reply.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/invoke_agent_reply.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/invoke_agent_reply.
  The adjacent test replays_the_invoke_agent_reply_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 236 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 275 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 725 planned, 725 maximum changed lines.
