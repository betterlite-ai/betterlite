pitfalls:
- 'The oracle helper for this task is pre-registered as invoke_agent_reply in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/invoke_agent_reply.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/invoke_agent_reply.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The frame parser swallows its own BedrockError, so an exception frame can disappear while a corrupt framing checksum
  fails the whole response.
- No trace model leaves model=None in the reply because the initialized usage record already contains the model
  key.
