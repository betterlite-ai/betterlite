budget:
  max_changed_lines: 725
  max_new_expects: 0
checks:
  commands:
  - id: helper-python
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/invoke_agent_reply.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
    why: The operation adapter is absent, unchanged or fails strict Python checks.
  - id: helper-case-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/invoke_agent_reply*")"
      && grep -lq 'invoke_agent_reply' tools/oracle/fuzz/corpus/helper_case/invoke_agent_reply* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_invoke_agent_reply$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
  - id: parser-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/invoke_agent_reply)"
      && grep -q 'decode_agent_trace' crates/betterlite-bedrock/fuzz/fuzz_targets/invoke_agent_reply.rs && cargo
      nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_invoke_agent_reply_corpus$/)'
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
  - id: case-agent-event-stream-content
    why: 'Consume the complete response through B599 EventStreamBuffer-compatible framing and EventStreamJSONParser
      shape. Header keys :event-type,:content-type,:message-type map to event_type/content_type/message_type default
      empty; header extraction failures debug Error extracting headers: {error} then use empty headers. Only chunk
      and trace event types are processed. Unknown types debug Unknown event type: {type} and are ignored, including
      exception-type frames with no recognized event-type.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_reply_cases::case_[0-9]+_agent_event_stream_content$/)'
  - id: case-chunk-parse-and-decode
    why: 'For each recognized frame parse event.to_response_dict with shared shape first. Parsed chunk presence
      wins; falsey chunk returns None, otherwise its bytes decode UTF-8. If no chunk key use nonempty raw body decoded
      UTF-8. Empty/failed messages are omitted. Successful chunk text is re-encoded as base64 bytes then decoded
      again during extraction; concatenate in arrival order without separators. Direct malformed base64/UTF-8 extraction
      warns Failed to decode chunk content: {error} and skips that chunk.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_reply_cases::case_[0-9]+_chunk_parse_and_decode$/)'
  - id: case-agent-error-frame
    why: 'Non200 frame constructs BedrockError from raw decoded body prefixed by :exception-type plus space, but
      the broad inner catch swallows this and all parser/decode errors, debugs Error parsing message from event:
      {error}, and returns None. Do not turn a swallowed frame into a client error. Errors processing one frame
      log Error processing event: {error} and continue; framing/CRC errors raised by buffer iteration occur outside
      that catch and fail the whole response.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_reply_cases::case_[0-9]+_agent_error_frame$/)'
  - id: case-trace-json-warning
    why: 'Trace messages JSON-decode into payload, retaining even nonobject JSON until later shape use. Invalid
      trace JSON warns Failed to parse trace event JSON: {error} and drops only that frame. A falsey parsed trace
      payload does not contribute usage. Keep structural-error categories distinct from malformed JSON.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_reply_cases::case_[0-9]+_trace_json_warning$/)'
  - id: case-preprocess-trace-usage
    why: Start inputTokens=0,outputTokens=0,model=None. Only event_type trace with non-None payload qualifies; read
      payload.trace default{}, skip falsey trace. Sum preProcessingTrace.modelInvocationOutput.metadata.usage inputTokens/outputTokens
      (missing0), skipping each falsey intermediate. Orchestration usage is not counted; explicit wrong types may
      raise rather than coerce.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_reply_cases::case_[0-9]+_preprocess_trace_usage$/)'
  - id: case-orchestration-model
    why: Take foundationModel from orchestrationTrace.modelInvocationInput of the first trace returning a value
      other than None; an empty string is a selected value. Subsequent traces do not replace it. Missing model remains
      None, and _build_model_response uses usage_info.get(model, supplied_model), so it writes None rather than
      falling back when the key exists.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_reply_cases::case_[0-9]+_orchestration_model$/)'
  - id: case-agent-reply-and-failure
    why: 'Mutate supplied response choices to one assistant message with concatenated text,index0,finish_reason
      stop. Always attach usage for the normal nonempty initialized usage record, including all-zero usage; total
      is input plus output. Preserve unrelated id/created/hidden fields. Any uncaught outer failure logs Error processing
      Bedrock Invoke Agent response: {error} and raises B682 BedrockError message Error processing response: {error},status=raw
      response status,headers unchanged, even if status200. No own HTTP-status guard before parsing.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_reply_cases::case_[0-9]+_agent_reply_and_failure$/)'
  optional:
  - mutants
description: >-
  Decode the buffered InvokeAgent AWS event stream and project its text/trace usage into the supplied chat response.
  Reuse B599 framing and its response stream shape; this lower part is callable without the request/signing adapter.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_agent/transformation.py:
  AmazonInvokeAgentConfig._parse_aws_event_stream L164-L224; AmazonInvokeAgentConfig._parse_message_from_event L226-L264;
  AmazonInvokeAgentConfig._extract_headers_from_event L266-L280; AmazonInvokeAgentConfig._get_response_stream_shape
  L282-L285; AmazonInvokeAgentConfig._extract_response_content L287-L308; AmazonInvokeAgentConfig._extract_usage_info
  L310-L341; AmazonInvokeAgentConfig._is_trace_event L343-L348; AmazonInvokeAgentConfig._get_trace_data L350-L357;
  AmazonInvokeAgentConfig._extract_and_update_preprocessing_usage L359-L382; AmazonInvokeAgentConfig._extract_orchestration_model
  L384-L396; AmazonInvokeAgentConfig._build_model_response L398-L428; AmazonInvokeAgentConfig.transform_response
  L430-L473.


