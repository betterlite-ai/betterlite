dod:
  - text: MCPEndUserPermissionGuardrail applies to pre_call events only and filters tools on the request side.
    proof: [mcp-permission-tests]
  - text: End user ID is resolved from user_api_key_end_user_id in request_data, litellm_metadata or metadata, and end user object is fetched through the same cached auth path as B739.
    proof: [mcp-permission-tests]
  - text: When no end_user_id, missing DB, lookup failure or empty mcp_servers and mcp_access_groups restrictions exist, all tools pass through unchanged, with a warning logged on lookup failure.
    proof: [mcp-permission-tests]
  - text: MCP tool names are split at the first hyphen; tools without a hyphen or non-MCP format are kept unchanged.
    proof: [mcp-permission-tests]
  - text: Tools filtered by the end-user guardrail are removed from the request tools list, and a debug message logs removed count and names.
    proof: [mcp-permission-tests]
  - text: MCPSecurityGuardrail applies to pre_call events and detects unregistered litellm_proxy MCP server references.
    proof: [mcp-security-tests]
  - text: Server names are extracted from tools with type=mcp and server_url starting with LITELLM_PROXY_MCP_SERVER_URL_PREFIX.
    proof: [mcp-security-tests]
  - text: Unregistered servers are detected by comparing against MCPServerManager::get_registry keys and reported as HTTP 400 when on_violation=block.
    proof: [mcp-security-tests]
  - text: MCPSecurityGuardrail defaults off (default_on=false) unless explicitly enabled in configuration.
    proof: [mcp-security-tests]
  - text: When on_violation is alert (default when not explicitly block), a warning is logged instead of raising an exception.
    proof: [mcp-security-tests]
  - text: The two argument functions copy name, mode and default_on as LiteLLM's initializers do, and the security one refuses an empty name and maps on_violation to block or alert.
    proof: [mcp-permission-tests, mcp-security-tests]
  - text: Both wire names build their HookSpec through B8521's hook registry with their classes' event hooks instead of answering NotBuilt.
    proof: [hook-arm-tests, hook-registry-tests]
  - text: All behavior from the listed oracle cases matches LiteLLM on tool filtering, permission handling and server validation.
    proof: [mcp-oracle]
checks:
  optional: []
  commands:
    - id: hook-arm-tests
      why: mcp_end_user_permission or mcp_security still answers NotBuilt or keeps the wrong arguments
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^hook_registry::tests::mcp_end_user_permission_arm/) | test(/^hook_registry::tests::mcp_security_arm/)'
    - id: hook-registry-tests
      why: the two new variants or arms broke another hook registry arm
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^hook_registry::/)'
    - id: mcp-permission-tests
      why: end-user permission guardrail tests fail, do not exist or have missing behavior cases
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(mcp_end_user_permission::)'
    - id: mcp-security-tests
      why: MCP security guardrail tests fail, do not exist or have missing behavior cases
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(mcp_security::)'
    - id: mcp-oracle
      why: the listed oracle cases fail or do not exist
      run: cargo run --locked -p betterlite-oracle -- tools/oracle/cases/guardrails/mcp_end_user_permission/ tools/oracle/cases/guardrails/mcp_security/
