id: B3815
title: Filter end-user MCP tools and check registered server references
description: >-
  Build two guardrails that filter MCP tool access. The end-user permission guardrail restricts tool definitions to the end user's direct MCP servers and access groups from their object_permission; it defaults on and passes through when no restrictions exist. The security guardrail validates that MCP servers referenced in litellm_proxy URLs are registered on the gateway; it defaults to alert (not block) and only blocks when on_violation is literally "block".

  The end-user guardrail runs on request input only (pre_call), using the same cached get_end_user_object path that auth already uses so no extra database round-trip occurs when the cache is warm. Missing end_user_id, missing DB, missing identity, lookup failure and empty permission restrictions all pass through, with a warning on lookup failure. Split MCP tool names at the first hyphen to extract the server name (github-create_issue → github); non-MCP tools and unrecognized formats are kept unchanged.

  The security guardrail extracts server names from tools with type=mcp and litellm_proxy server_url prefix, compares against the registered MCP server manager's registry keys and reports unregistered names sorted alphabetically in HTTP 400 errors when blocking. It defaults off (default_on=false) and defaults to alert behavior unless on_violation is explicitly set to "block". It does not branch on input_type despite its request-only documentation.

  Both guardrails register through initialize_guardrail functions following the existing callback pattern. End-user defaults to on unless the raw guardrail dict explicitly sets default_on to false; the security initializer maps anything except literal on_violation=block to alert. Both use the cached auth lookup from B739; preserve its existing failure boundary and behavior.
