dod:
  - text: MCPEndUserPermissionGuardrail applies to pre_call events only and filters tools on the request side.
    proof: [mcp-permission-tests]
  - text: End user ID is resolved from user_api_key_end_user_id in request_data or litellm_metadata, and end user object is fetched through the same cached auth path as B739.
    proof: [mcp-permission-tests]
  - text: When no end_user_id, missing DB, lookup failure or empty mcp_servers and mcp_access_groups restrictions exist, all tools pass through unchanged, with a warning logged on lookup failure.
    proof: [mcp-permission-tests]
  - text: MCP tool names are split at the first hyphen; tools without a hyphen or non-MCP format are kept unchanged.
    proof: [mcp-permission-tests]
  - text: Tools filtered by the end-user guardrail are removed from the request tools list, and a debug message logs removed count and names.
    proof: [mcp-permission-tests]
  - text: MCPSecurityGuardrail applies to pre_call events and detects unregistered litellm_proxy MCP server references.
    proof: [mcp-security-tests]
  - text: Server names are extracted from tools with type=mcp and server_url starting with LITELLM_PROXY_MCP_SERVER_URL_PREFIX.
    proof: [mcp-security-tests]
  - text: Unregistered servers are detected by comparing against MCPServerManager::get_registry keys and reported as HTTP 400 when on_violation=block.
    proof: [mcp-security-tests]
  - text: MCPSecurityGuardrail defaults off (default_on=false) unless explicitly enabled in configuration.
    proof: [mcp-security-tests]
  - text: When on_violation is alert (default when not explicitly block), a warning is logged instead of raising an exception.
    proof: [mcp-security-tests]
  - text: Guardrail initializers register via logging_callback_manager.add_litellm_callback and follow the callback pattern established in B189.
    proof: [mcp-permission-tests, mcp-security-tests]
  - text: All behavior from the listed oracle cases matches LiteLLM on tool filtering, permission handling and server validation.
    proof: [mcp-oracle]
