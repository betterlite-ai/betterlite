deviations: []
out_of_scope:
  - Tool permission evaluation at call time (B3813) and response enforcement (B3814).
  - Access group expansion via MCPRequestHandler._get_mcp_servers_from_access_groups, owned by B4669.
  - MCP server registry management beyond registry lookups.
  - Configuration UI and settings exposure beyond the basic config model.
  - CustomGuardrail base class implementation and callback dispatcher integration (B104 foundation).
  - Tool name extraction from LiteLLM's lower tool_name_extraction module.
pitfalls:
  - The end-user guardrail defaults to on (default_on=true) only when the raw guardrail dict does not explicitly set default_on to false; normalize the None case upfront to avoid confusion with Pydantic's false normalization.
  - Split MCP tool names at the first hyphen only; names like "my-github-repo-read" must become "my", not traverse multiple hyphens.
  - Server name extraction from litellm_proxy URLs must check the full prefix and only strip the prefix when the remainder is non-empty to avoid adding an empty string to the set.
  - The security guardrail maps every on_violation value except literal "block" to "alert"; do not default to "block" at application time if initialization sets it to "alert".
  - End-user object lookup uses the same cache and failure boundary as auth (B739); preserve the warning on lookup failure and the passthrough on None, do not add new exception handling.
review_level: standard
