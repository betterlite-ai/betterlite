id: B3815
title: Filter end-user MCP tools and check registered server references
description: >-
  Build two guardrails that filter MCP tool access. The end-user permission guardrail restricts tool definitions to the end user's direct MCP servers and access groups from their object_permission; it defaults on and passes through when no restrictions exist. The security guardrail validates that MCP servers referenced in litellm_proxy URLs are registered on the gateway; it defaults to alert (not block) and only blocks when on_violation is literally "block".

  The end-user guardrail runs on request input only (pre_call), using the same cached get_end_user_object path that auth already uses so no extra database round-trip occurs when the cache is warm. Missing end_user_id, missing DB, missing identity, lookup failure and empty permission restrictions all pass through, with a warning on lookup failure. Split MCP tool names at the first hyphen to extract the server name (github-create_issue → github); non-MCP tools and unrecognized formats are kept unchanged.

  Read the end user id from the route's own metadata key too: user_api_key_end_user_id at the top level, in litellm_metadata, and in `metadata` (the key chat completions use, per metadata_variable_name_for_route). LiteLLM reads only the first two, so on /v1/chat/completions it never finds the end user and never filters. This is a deviation.

  The security guardrail extracts server names from tools with type=mcp and litellm_proxy server_url prefix, compares against the registered MCP server manager's registry keys and reports unregistered names sorted alphabetically in HTTP 400 errors when blocking. It defaults off (default_on=false) and defaults to alert behavior unless on_violation is explicitly set to "block". It does not branch on input_type despite its request-only documentation.

  The two initialize_guardrail functions become argument functions that register nothing, the way B8217 writes the third-party initializers. `initialize_mcp_end_user_permission(params, guardrail_name) -> McpEndUserPermissionArgs` in mcp_end_user_permission/init.rs keeps the name, mode as the event hook, and default_on true unless the params set default_on to false; LitellmParams keeps default_on as Option<bool>, so None is the "not set" that LiteLLM reads from the raw guardrail dict. `initialize_mcp_security(params, guardrail_name)` in mcp_security/init.rs returns McpSecurityArgs or the error "MCP Security: guardrail_name is required" for an empty name, maps every on_violation except literal "block" to alert, and falls back to default_on false. Both use the cached auth lookup from B739; preserve its existing failure boundary and behavior.

  B8521's hook registry answers mcp_end_user_permission and mcp_security with HookRegistryError::NotBuilt until this task lands. Put both arms in place of those answers in hook_registry/kinds.rs, keep the args as `HookSpec::McpEndUserPermission` and `HookSpec::McpSecurity` in spec.rs with their settings arms, let the security initializer's error come back as HookRegistryError::Init, and give each name in hooks.rs the event hooks its class sets. B8521's `unbuilt_mcp_end_user_permission` and `unbuilt_mcp_security` tests become `mcp_end_user_permission_arm` and `mcp_security_arm`, and both names leave the not-built row in docs/deviations/B8521.yaml. Should these two be the last NotBuilt answers, the same change deletes the NotBuilt variant and its skips_startup arm in hook_registry/error.rs, the NotBuilt half of `hook_errors_at_startup` and that row.
