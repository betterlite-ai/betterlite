  commands:
  - id: case-marengo3-model-detection
    why: 'Recognize the exact case-sensitive substring marengo-embed-3- in model or empty string; no prefix constraint.
      Marengo3Params is frozen with extra=ignore and all supported fields default None: inputType,input_type,media_source,media_sources,bucketOwner,startSec,endSec,segmentation,embeddingOption,embeddingType,embeddingScope,inferenceId,textTruncate,lengthSec,useFixedLengthSec,minClipSec.
      Resolve truthy inputType then input_type then text. Validate types before dropping unsupported parameters:
      input type must be text,image,video,audio,text_image,multi_input; media sources map strings to strings; numeric
      times follow source float coercion. Unknown fields are silently ignored.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_marengo3_model_detection$/)'
  - id: case-named-media-sources
    why: 'Build nested records named by inputType: text.inputText, image.mediaSource, video/audio.mediaSource plus
      timed options, text_image.inputText and mediaSource, multi_input.mediaSources. Each named media source preserves
      mapping iteration order and contains name,mediaType=image and the source fields. Include multi_input.inputText
      only for truthy input; text and text_image retain an empty inputText. Include inferenceId whenever not None,
      including empty string. No extra top-level inference fields survive.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_named_media_sources$/)'
  - id: case-required-bucket-owner
    why: Only exact s3:// strings use s3Location with uri and bucketOwner; missing/None owner raises BedrockError
      400 with s3:// media requires the 'bucketOwner' parameter, the account id that owns the bucket. An empty owner
      is accepted. Other strings call B183 get_base64_str and emit base64String without validation or fetching.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_required_bucket_owner$/)'
  - id: case-text-versus-timed-options
    why: Timed fields are startSec,endSec,segmentation,embeddingOption,embeddingType,embeddingScope, emitted only
      when not None for video/audio. Valid option enums are visual/audio/transcription, separate_embedding/fused_embedding,
      and clip/asset respectively. Segmentation requires method=fixed with fixed.durationSec integer or method=dynamic
      with dynamic.minDurationSec integer; retain source coercion and extra-ignore behavior. For other input types,
      non-None timed fields fail with BedrockError 400 Input type '{input_type}' does not accept {comma_space_joined_fields};
      set drop_params to drop them, unless drop_params is truthy. Preserve source declaration order in field lists.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_text_versus_timed_options$/)'
  - id: case-reject-27-only-options
    why: After parameter validation, reject non-None textTruncate,lengthSec,useFixedLengthSec,minClipSec before
      checking timed fields. BedrockError 400 message is Marengo 3.0 does not accept the Marengo 2.7 parameters
      {comma_space_joined_fields}; set drop_params to drop them. False, zero and empty strings count as supplied;
      None does not. A truthy drop_params silently omits these fields, with no warning.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_reject_27_only_options$/)'
  - id: case-drop-policy
    why: 'Invalid parameter validation is never bypassed by drop_params. Wrap Pydantic ValidationError as BedrockError
      400 Invalid Marengo 3.0 parameters: {details}, where details joins each dotted error location and source message
      as location: message separated by semicolon-space. Preserve error order, including union validation errors,
      and B682 error fields; do not invent an error param. For valid records, drop_params defaults False and truthiness
      controls unsupported-field rejection only.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_drop_policy$/)'
  - id: case-require-input-media
    why: text_image requires media_source not None, otherwise BedrockError 400 Input type 'text_image' requires
      the 'media_source' parameter; an empty string is allowed. multi_input requires a truthy media_sources mapping,
