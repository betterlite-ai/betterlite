    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_drop_policy$/)'
  - id: case-require-input-media
    why: The require-input-media behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::marengo_three_cases::case_[0-9]+_require_input_media$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_marengo_three.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_marengo_three*")"
      && grep -lq 'bedrock_other_marengo_three' tools/oracle/fuzz/corpus/helper_case/bedrock_other_marengo_three*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_marengo_three$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
