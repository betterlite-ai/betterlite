id: B630
title: Bedrock TwelveLabs Marengo 3 input validation
description: >-
  Add typed Marengo3Request and route-specific option validation. Preserve multiple named media sources, bucketOwner
  requirements, text versus timed media shape, 2.7-only option rejection/drop and input-type selection. This leaf
  owns only Marengo 3 input validation/building; B629 reuses it and owns vector responses, and B631 executes the
  call.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/twelvelabs_marengo_3_transformation.py:
  is_marengo_3_model L56-L57; Marengo3Params.resolved_input_type L81-L82; Marengo3Params.timed_media_options L84-L85;
  Marengo3Params.given_timed_media_options L87-L88; Marengo3Params.given_2_7_only_params L90-L91; _require_bucket_owner
  L94-L100; _media_source L103-L109; _named_media_source L112-L118; _timed_media_input L121-L126; _describe L129-L132;
  _validated_params L135-L139; _reject_unless_dropped L142-L145; _require L148-L151; _require_media_sources L154-L160;
  _request_base L163-L168; build_marengo_3_request L171-L239.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: marengo3_model_detection: Recognize the exact case-sensitive substring marengo-embed-3-
  in model or empty string; no prefix constraint. Marengo3Params is frozen with extra=ignore and all supported fields
  default None: inputType,input_type,media_source,media_sources,bucketOwner,startSec,endSec,segmentation,embeddingOption,embeddingType,embeddingScope,inferenceId,textTruncate,lengthSec,useFixedLengthSec,minClipSec.
  Resolve truthy inputType then input_type then text. Validate types before dropping unsupported parameters: input
  type must be text,image,video,audio,text_image,multi_input; media sources map strings to strings; numeric times
  follow source float coercion. Unknown fields are silently ignored. named_media_sources: Build nested records named
  by inputType: text.inputText, image.mediaSource, video/audio.mediaSource plus timed options, text_image.inputText
  and mediaSource, multi_input.mediaSources. Each named media source preserves mapping iteration order and contains
  name,mediaType=image and the source fields. Include multi_input.inputText only for truthy input; text and text_image
  retain an empty inputText. Include inferenceId whenever not None, including empty string. No extra top-level inference
  fields survive. required_bucket_owner: Only exact s3:// strings use s3Location with uri and bucketOwner; missing/None
  owner raises BedrockError 400 with s3:// media requires the 'bucketOwner' parameter, the account id that owns
  the bucket. An empty owner is accepted. Other strings call B183 get_base64_str and emit base64String without validation
  or fetching. text_versus_timed_options: Timed fields are startSec,endSec,segmentation,embeddingOption,embeddingType,embeddingScope,
  emitted only when not None for video/audio. Valid option enums are visual/audio/transcription, separate_embedding/fused_embedding,
  and clip/asset respectively. Segmentation requires method=fixed with fixed.durationSec integer or method=dynamic
  with dynamic.minDurationSec integer; retain source coercion and extra-ignore behavior. For other input types,
  non-None timed fields fail with BedrockError 400 Input type '{input_type}' does not accept {comma_space_joined_fields};
  set drop_params to drop them, unless drop_params is truthy. Preserve source declaration order in field lists.
  reject_27_only_options: After parameter validation, reject non-None textTruncate,lengthSec,useFixedLengthSec,minClipSec
  before checking timed fields. BedrockError 400 message is Marengo 3.0 does not accept the Marengo 2.7 parameters
  {comma_space_joined_fields}; set drop_params to drop them. False, zero and empty strings count as supplied; None
  does not. A truthy drop_params silently omits these fields, with no warning. drop_policy: Invalid parameter validation
  is never bypassed by drop_params. Wrap Pydantic ValidationError as BedrockError 400 Invalid Marengo 3.0 parameters:
  {details}, where details joins each dotted error location and source message as location: message separated by
  semicolon-space. Preserve error order, including union validation errors, and B682 error fields; do not invent
  an error param. For valid records, drop_params defaults False and truthiness controls unsupported-field rejection
  only. require_input_media: text_image requires media_source not None, otherwise BedrockError 400 Input type 'text_image'
  requires the 'media_source' parameter; an empty string is allowed. multi_input requires a truthy media_sources
  mapping, otherwise BedrockError 400 Input type 'multi_input' requires a non-empty 'media_sources' mapping of name
  to media. Validate all fields and reject unsupported options before these missing-media checks. Neither helper
  requires nonempty media strings or downloads URLs.


  Implement crates/betterlite-bedrock/src/marengo_three.rs with adjacent tests under marengo_three/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function marengo_three_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  marengo3_model_detection, named_media_sources, required_bucket_owner, text_versus_timed_options, reject_27_only_options,
  drop_policy, require_input_media. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_marengo_three* using HelperCase:
  kind: helper and the externally tagged bedrock_other_marengo_three variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_marengo_three that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 136 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 275 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 645 planned, 650 maximum changed lines.
