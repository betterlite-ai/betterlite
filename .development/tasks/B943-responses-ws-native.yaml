pitfalls:
- 'The oracle helper for this task is pre-registered as responses_ws_native in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_ws_native.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_ws_native.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'The first frame is authorized by B942 before _store_input; RateLimitError("quota full") therefore emits only the exact rate_limit_exceeded error, has no pre_call or storage, and leaves the receive loop open.'
- '_store_event runs after unmasking, output masking and response wrapping but before send_text, so stored failure and callback messages contain the transformed JSON rather than backend bytes.'
- 'recv(decode=False) is attempted before recv() without arguments; a scripted peer exposing only recv() must raise TypeError on the first call to reach the fallback.'
- '_wrap_output_item_encrypted_content does not inspect event type; only _wrap_response_event supplies response.output_item.added and response.output_item.done, so the helper must retain its arbitrary-event direct-call behavior.'
- '_failure_exception selects the first stored error or response.failed; response.incomplete, unknown events and an empty or multi-key service-tier partition do not create failure dispatch, and the latter records service_tier=None.'
