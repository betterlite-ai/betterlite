id: B943
title: Responses ws native
description: >-
  Relay native Responses WebSockets using B009 configured transport, B010 provider endpoint selection and the frame
  policy service. Keep response events, input capture and terminal logging per connection; apply deployment reasoning
  defaults only through the prepared first frame and preserve cancellation in both directions.


  B901 transcripts use the service driver native_responses_relay with typed arguments and scripted client frames.
  Python calls responses.main.aresponses_websocket and ResponsesAPIStreamingIterator native relay directly with
  injected transport/clock/logging interfaces; Rust calls this production service. No FastAPI route/global proxy
  state is recreated. Route authentication and alias parity are exclusively B941/B1125 gateway-driver transcripts.


  Implement crates/betterlite-core/src/api/responses_ws_native.rs. Use ResponsesWsNativeInput and ResponsesWsNativeResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions native_ws_response_create, defaults_on_first_frame, provider_close,
  client_disconnect, failure_usage_logging under api::responses_ws_native::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.api_base
  defaults to None; litellm_settings.api_key defaults to None; litellm_settings.openai_key defaults to None; env.OPENAI_API_KEY
  defaults to unset (None). No environment reads occur outside betterlite-config. Test api::responses_ws_native::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Use B901 kind: websocket transcripts with the typed native_responses_relay service driver, comparing upstream
  handshake status, negotiated subprotocol, per-direction frame ordering and close code/reason. Route gateway cases
  also compare pre-accept HTTP status. No helper calls a WebSocket route function.


  Callable ownership: litellm/responses/main.py: _build_litellm_metadata_for_ws (L2287-L2292); litellm/responses/main.py:
  _deployment_reasoning_default (L2298-L2306); litellm/responses/main.py: _first_ws_frame_with_routed_input (L2312-L2327);
  litellm/responses/main.py: _build_responses_websocket_request_defaults (L2330-L2340); litellm/responses/main.py:
  _aresponses_websocket (L2344-L2445); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming.__init__
  (L1900-L1932); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._should_store_event (L1934-L1935);
  litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._store_event (L1937-L1949); litellm/responses/streaming_iterator.py:
  ResponsesWebSocketStreaming._collect_input_from_client_event (L1951-L1984); litellm/responses/streaming_iterator.py:
  ResponsesWebSocketStreaming._store_input (L1986-L1989); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._failure_exception
  (L1991-L1999); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._log_messages (L2001-L2016);
  litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._record_usage_for_failure (L2018-L2031);
  litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming._wrap_response_event (L2033-L2049); litellm/responses/streaming_iterator.py:
  ResponsesWebSocketStreaming.backend_to_client (L2051-L2099); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming.client_to_backend
  (L2439-L2458); litellm/responses/streaming_iterator.py: ResponsesWebSocketStreaming.bidirectional_forward (L2460-L2477).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 330 owned nonblank/non-comment/non-docstring Python lines (340 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 350 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 42 config tests/seeds and
  30 wiring; 642 total within the 650-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B012 (Logging pipeline, callback registry and
  redaction), B171 (Direct helper oracle and URL path encoding), B942 (Responses ws frame policy), B1087 (Api boundaries),
  B508 (OpenAI Responses replies and event decoding), B905 (Responses parameters), B931 (Responses provider selection),
  B925 (Responses stream events), B904 (Response id traversal), B901 (Websocket oracle), B002 (Load LiteLLM config.yaml
  into typed config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
