id: B943
title: Responses ws native
description: >-
  Build the native Responses WebSocket relay and its pinned transcript adapter. The private SDK entry is
  `_aresponses_websocket(model, websocket, api_base=None, api_key=None, timeout=None, **kwargs)`; it passes the
  resolved provider call to the injected WebSocket handler and returns the first mapped `error` or `response.failed`
  exception, or `None` after a clean close. This is not a route: B941 owns authentication and `/responses`,
  `/v1/responses` and `/openai/v1/responses`, including gateway provider aliases, while B901 supplies the booted
  transcript and scripted provider socket.

  Preserve the SDK call boundary. `model`, explicit `api_base` and explicit `api_key` go to provider resolution;
  B931 supplies `provider_model`, `_custom_llm_provider`, `dynamic_api_key` and `dynamic_api_base`, and its routing
  prefix removal supplies `resolved_model`. The handler receives base in this order:
  `dynamic_api_base`, `kwargs["api_base"]` through `GenericLiteLLMParams`, `litellm.api_base`, then `None`; the
  key order is `dynamic_api_key`, `kwargs["api_key"]`, `litellm.api_key`, `litellm.openai_key`, then
  `get_secret_str("OPENAI_API_KEY")`. `litellm.api_base`, `litellm.api_key` and `litellm.openai_key` default to
  `None`; an unset `OPENAI_API_KEY` also resolves to `None`. A non-`None` custom provider calls
  `ProviderConfigManager.get_provider_responses_api_config` with `resolved_model`, `LlmProviders(provider)` and the
  selected base; a `None` provider passes `responses_api_provider_config=None`. `timeout=None` is forwarded as
  `None`. The unchanged `user_api_key_dict`, custom provider and logging object are forwarded. `input`,
  `previous_response_id`, `user_api_key_dict`, `litellm_metadata`, `custom_llm_provider`, `model`, `websocket`,
  `litellm_logging_obj`, `api_base`, `api_key`, `timeout` and `first_message` are removed from the remaining
  deployment kwargs; only `input` and `previous_response_id` are removed before request-default extraction.
  A non-string or absent `first_message` becomes `None`, and `previous_response_id` is a routing hint rather than a
  provider kwarg. Before resolving the selected base and key, the call writes the result of
  `infer_openai_data_residency(_custom_llm_provider, dynamic_api_base or kwargs["api_base"] or litellm.api_base)` to
  `litellm_params_dict["data_residency"]`, then calls `update_from_kwargs` with `optional_params={}`, the resolved
  model, user and provider; provider configuration and the handler call happen afterward.

  Build metadata from `kwargs["litellm_metadata"] or {}`. Select `kwargs["metadata"]["guardrails"]` when it is
  truthy, otherwise top-level `kwargs["guardrails"]`, otherwise `[]`; omit `metadata["guardrails"]` when that
  selected value is falsey. Build `ResponsesWebSocketRequestDefaults` from the optional response parameters. A
  present `reasoning` suppresses `reasoning_effort`; a scalar `reasoning_effort="high"` is mapped by B918, while
  `reasoning_effort={"effort": "high"}` is validated as and retained as the same JSON object. `extra_body=None`
  gives `overrides={}`, and a mapping such as `{"reasoning": {"effort": "low"}, "service_tier": "flex"}` wins
  over deployment defaults and client-frame fields. A truthy non-mapping `litellm_metadata=[1]` raises
  `TypeError: 'list' object is not a mapping`; `metadata=["x"]` raises `AttributeError: 'list' object has no
  attribute 'get'`; and `extra_body=[1]` raises the Pydantic JSON-object `ValidationError`. B918 owns
  `litellm.reasoning_auto_summary=False` and `LITELLM_REASONING_AUTO_SUMMARY="false"`; this task only forwards its
  returned value.

  `_first_ws_frame_with_routed_input` returns the exact original frame for `first_message="not-json"`, JSON
  `"null"`, `routed_input=None`, and an already matching nested or flat input. For a different routed input it
  rewrites nested `response.input` when `response` is an object with an input, otherwise top-level `input`, preserving
  every unrelated key. The native event allowlist stores only `response.created`, `response.completed`,
  `response.failed`, `response.incomplete` and `error`; malformed JSON and `{"type":"response.output_text.delta"}`
  are dropped without a warning, while a JSON array reaches `.get` and raises `AttributeError`.
  The text-block mask declaration consumed by B942 contains exactly `input_text`, `output_text` and `text`.

  Client input logging accepts `{"type":"response.create","input":"hello"}` as
  `{"role":"user","content":"hello"}` and a user message with
  `[{"type":"input_text","text":"world"}]` as one `world` message. Empty `input_text`, non-user messages,
  non-object array items, malformed JSON, malformed client objects and non-`response.create` objects contribute
  nothing. Every stored client frame calls `pre_call(input=<masked frame>, api_key="")` before backend send when a
  logging object exists; a missing logging object skips it.

  `backend_to_client` first awaits `backend_ws.recv(decode=False)` and calls `recv()` only after a `TypeError` from
  that first call. Bytes use UTF-8 decoding. With any output guardrail callback it drops, before masking, exactly
  `response.output_text.delta`, `response.reasoning_summary_text.delta`, `response.refusal.delta`,
  `response.function_call_arguments.delta`, `response.output_text.done`, `response.content_part.done`,
  `response.output_item.done`, `response.function_call_arguments.done`, `response.reasoning_summary_text.done` and
  `response.reasoning_summary_part.done`; malformed JSON and other event types continue through the relay. The
  remaining event order is unmask, output-mask, response-wrap, store, then `send_text`. Invalid UTF-8 reaches the
  outer exception path without a send. `ConnectionClosed` logs debug
  `Responses WS backend connection closed: %s`; another exception logs exception
  `Error in responses WS backend_to_client: %s`; both paths run final logging.

  `_wrap_response_event` leaves malformed JSON and events without an object `response` unchanged, sends response IDs
  to B904, and asks encrypted-content wrapping only for `response.output_item.added` and
  `response.output_item.done`. `_wrap_output_item_encrypted_content` returns no replacement unless
  `encrypted_content_affinity_enabled=true`, `model_info.id="dep-1"` (or another non-empty string), an object item,
  and non-empty string `item.encrypted_content` are all present; then it changes only that field through B904.
  A valid JSON array in `_wrap_response_event` raises `AttributeError` when the response object is read and is handled
  by the backend exception path.

  `client_to_backend` sends an accepted non-null first frame before receiving later text frames. B942's quota
  rejection sends exactly `{"type":"error","error":{"type":"rate_limit_exceeded","message":"quota full"}}`,
  stores and forwards neither the rejected frame nor a `pre_call`, keeps the socket open, and swallows an error while
  sending that error frame. Other client exceptions are swallowed after debug
  `Responses WS client_to_backend ended: %s`. `bidirectional_forward` starts backend forwarding, cancels and awaits
  it when client forwarding ends, swallows `CancelledError`, attempts backend close even when close raises, and
  returns the first stored failure exception or `None`.

  `_log_messages` returns for a missing logger or empty `messages`. With input messages it first writes
  `model_call_details["messages"]`; with no failure it schedules
  `dispatch_success_handlers(messages, prefer_async_handlers=True)`. With the first stored `error` or
  `response.failed`, it calls B068's `ResponsesWebSocketTokenUsageProcessor` helpers, uses `service_tier=None` unless
  exactly one tier is present, constructs `LiteLLMRealtimeStreamLoggingObject`, converts a falsey cost including
  `None` to `0.0`, records partial usage, formats the traceback, and schedules
  `dispatch_failure_handlers(exception, traceback, prefer_async_handlers=True)`. For
  `response.failed` containing `{"type":"server_error","message":"upstream broke","code":"E_UP"}`, the
  mapped failure has status `500`, type `internal_server_error`, no param, and message
  `litellm.InternalServerError: Error code: 500 - {'error': {'message': 'upstream broke', 'type': 'server_error', 'code': 'E_UP'}}`.
  `response.incomplete`, unknown events, and a completed success do not dispatch failure usage; a completed success
  schedules only the success handlers.

  Own these complete callables and declarations: `main.py:2287-2340`
  (`_build_litellm_metadata_for_ws`, `_deployment_reasoning_default`, `_first_ws_frame_with_routed_input`,
  `_build_responses_websocket_request_defaults`); `main.py:2343-2445` (`_aresponses_websocket` and its `@client`
  decorator); `streaming_iterator.py:1817-1829` (the four event declarations), `1869-1884`
  (`_wrap_output_item_encrypted_content`), `1900-2099` (the constructor, storage/input/failure/logging methods,
  wrapping and backend forwarding), and `2439-2477` (`client_to_backend` and `bidirectional_forward`). B942 owns
  authorization, request defaults, quota rejection and masking; B925 owns shared JSON/error conversion; B904 owns
  response-ID and encrypted-content codecs; B918 owns scalar reasoning mapping; B173/B010 and provider tasks own
  provider WebSocket execution, URL construction, TLS and handshake behavior; the B247-B254 owners below own the
  logging object methods; B068 owns Responses WebSocket usage calculation. This task performs no route registration,
  database write, environment read in core, decoder or fuzz target, warning emission, or database-backed state write.
  It loads `litellm_settings.api_base`, `litellm_settings.api_key` and `litellm_settings.openai_key` through B002.

  The source ownership is 346 nonblank, non-comment, non-docstring Python lines. The implementation, seven native
  behavior cases, seven independent transcripts, adapters and configuration fixtures must fit the 800-line budget.
