dod:
- text: >-
    native_ws_response_create sends model="gpt-4o", timeout=7, api_base=None, api_key=None and first_message
    {"type":"response.create","input":"hello"}. With api_base=None, api_key=None, openai_key=None and
    OPENAI_API_KEY="sk-env", the mock OpenAI provider receives api_key="sk-env", base=None and timeout=7; it
    returns created then completed frames, the client sees those frames in order, and the relay returns None after
    clean backend close.
  proof: [case-native-ws-response-create, oracle]
- text: >-
    request_defaults_and_routing passes first_message="not-json" and separately first_message="null"; each exact
    string is forwarded unchanged. It passes input="routed", previous_response_id="resp_prev" and
    {"type":"response.create","response":{"input":"old"},"other":1}; the provider receives response.input="routed",
    other=1 and no previous_response_id deployment kwarg. It compares flat rewrite, nested rewrite and matching
    no-op. reasoning_effort="high" with no reasoning yields {"effort":"high"}; reasoning_effort={"effort":"high"}
    yields the unchanged validated object; reasoning={"effort":"none"} suppresses the effort default; and
    extra_body={"reasoning":{"effort":"low"},"service_tier":"flex"} wins. The exact malformed inputs
    litellm_metadata=[1], metadata=["x"] and extra_body=[1] produce TypeError, AttributeError and Pydantic
    ValidationError respectively.
  proof: [case-request-defaults-and-routing, oracle]
- text: >-
    metadata_and_credentials passes litellm_metadata={"trace":"t1"}, metadata={"guardrails":["pii"]},
    guardrails=["fallback"], explicit api_base="https://caller.test", explicit api_key="sk-call", and resolver
    dynamic_api_base="wss://dynamic.test", dynamic_api_key="sk-dynamic"; the handler receives metadata
    {"trace":"t1","guardrails":["pii"]}, base="wss://dynamic.test" and key="sk-dynamic". Empty metadata
    guardrails selects top-level ["fallback"], and both empty omits the key. Separate fixtures set
    litellm_settings.api_base="https://global.test", api_key="sk-global", openai_key="sk-openai", then unset
    each value to exercise every fallback through OPENAI_API_KEY="sk-env" and finally all None. The provider config
    is non-None for provider="openai" and None for provider=None.
  proof: [case-metadata-and-credentials, config-tests, config-corpus, oracle]
- text: >-
    event_capture_and_input_log constructs a relay with request_data omitted, non-object litellm_metadata=[1],
    custom_llm_provider=None, guardrail_callbacks=None, output_guardrail_callbacks=None, quota_callbacks=None,
    authorized_model=None and request_defaults=None; the fields become {}, empty callback sequences, (), and None.
    It forwards response.create input="hello" and one user input_text block "world", calls pre_call with api_key="",
    and stores only response.created and response.completed. It drops response.output_text.delta, {"type":"unknown"},
    malformed "not-json", malformed client JSON, non-user input, empty text, non-object items and non-response.create
    objects. It compares encrypted-content affinity true/model_info.id="dep-1"/encrypted_content="cipher" with false
    affinity, missing id, non-object item and empty content; only the first calls B904 and rewrites that field.
  proof: [case-event-capture-and-input-log, oracle]
- text: >-
    backend_close_and_disconnect feeds b'{"type":"response.created"}' to a peer whose recv(decode=False) raises
    TypeError and recv() returns bytes; the event is stored before send_text. With an output callback, every one of the
    ten listed delta/done literals is absent from sends, while malformed JSON is sent. A JSON array [1,2,3] raises
    AttributeError in wrapping and is not sent. Invalid UTF-8 sends nothing; ConnectionClosed logs
    "Responses WS backend connection closed: %s" and another exception logs
    "Error in responses WS backend_to_client: %s", with final logging in both. Client termination cancels backend
    forwarding, attempts close even when close raises, and returns the first stored failure or None.
  proof: [case-backend-close-and-disconnect, oracle]
- text: >-
    rate_limit_drop makes B942's quota callback raise RateLimitError("quota full"). The client receives exactly
    {"type":"error","error":{"type":"rate_limit_exceeded","message":"quota full"}}, with no code or param;
    the rejected frame has no pre_call, stored message or backend send, a following accepted frame is forwarded, and
    a send failure while reporting the error is swallowed.
  proof: [case-rate-limit-drop, oracle]
- text: >-
    failure_usage_logging stores response.failed with response.error {"type":"server_error","message":"upstream
    broke","code":"E_UP"}; the first mapped exception has status=500, type="internal_server_error", param absent,
    and the exact LiteLLM message stated above. Usage is combined, service_tier=None when the partition is not exactly
    one key, cost None becomes 0.0, partial usage is recorded before traceback dispatch, and failure dispatch receives
    prefer_async_handlers=True. A response.created followed by response.completed schedules success dispatch only and
    does not record failure usage; response.incomplete and unknown events do neither.
  proof: [case-failure-usage-logging, oracle]
- text: The seven named transcript fixtures execute the native service and pinned MIT service independently and compare handshake, frame order, close outcome, stored messages, callback arguments, exact drops and logger effects.
  proof: [new-oracle-cases, service-python, oracle]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: A native relay branch or its focused production test is absent; transcript replay cannot prove every helper and ordering outcome.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::responses_ws_native::/) - test(/::replays_corpus$/)'
  - id: case-native-ws-response-create
    why: The mock handshake, None defaults, OPENAI_API_KEY fallback, timeout=7 or clean-close result is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_native::tests::native_ws_response_create($|::)/)'
  - id: case-request-defaults-and-routing
    why: The not-json/null no-op, mapping reasoning object, nested/flat rewrite, previous_response_id removal, precedence, extra_body override or typed malformed-input error is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_native::tests::request_defaults_and_routing($|::)/)'
  - id: case-metadata-and-credentials
    why: Guardrail precedence, global/config credential order, dynamic resolver precedence, provider config branch or None fallback is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_native::tests::metadata_and_credentials($|::)/)'
  - id: case-event-capture-and-input-log
    why: Constructor defaults, event allowlist, input extraction, empty pre-call key or encrypted output-item guard is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_native::tests::event_capture_and_input_log($|::)/)'
  - id: case-backend-close-and-disconnect
    why: The recv fallback, UTF-8 outcome, ten output drops, malformed/array handling, logger literals or cancellation/close result is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_native::tests::backend_close_and_disconnect($|::)/)'
  - id: case-rate-limit-drop
    why: The exact rate_limit_exceeded frame, rejected-frame effects or send-error swallowing is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_native::tests::rate_limit_drop($|::)/)'
  - id: case-failure-usage-logging
    why: First-failure status/type/message mapping, usage processor calls, service-tier fallback, cost zeroing, traceback dispatch or success/failure ordering is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_native::tests::failure_usage_logging($|::)/)'
  - id: config-tests
    why: api_base, api_key, openai_key and OPENAI_API_KEY lack explicit set and unset loader outcomes.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_ws_native::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: No added config seed reaches the production loader for the three settings and OPENAI_API_KEY fallback.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/responses-ws-native-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: service-python
    why: The native WebSocket adapter is absent or fails locked ruff and basedpyright checks.
    run: test -f tools/oracle/helpers/responses_ws_native.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: new-oracle-cases
    why: A named native relay outcome has no newly added transcript fixture.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/responses-ws-native)"
