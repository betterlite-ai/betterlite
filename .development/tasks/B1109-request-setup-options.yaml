id: B1109
title: Request setup options and session policy
description: >-
  Resolve metadata slot names, dynamic callback settings, model groups and missing-session policy before preparation.
  Preserve source flag defaults and warnings through the config loader.


  Implement crates/betterlite-core/src/api/request_setup_options.rs. Use RequestSetupOptionsInput and RequestSetupOptionsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): litellm_pre_call_utils.py:845 type=ProxyErrorTypes.bad_request_error, param='session_id',
  code=400. Compare the actual source status, error type, param and code; ignore only error wording except in message-extraction
  tests.


  Write adjacent tests.rs behavior functions metadata_slot_selection, dynamic_callback_disabling, missing_session_policy
  under api::request_setup_options::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.allow_dynamic_callback_disabling
  defaults to True. No environment reads occur outside betterlite-config. Test api::request_setup_options::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RequestSetupOptions in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {request_setup_options: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/litellm_pre_call_utils.py: apply_missing_session_id_policy (L835-L858); litellm/proxy/litellm_pre_call_utils.py:
  should_auto_drop_params_for_agentic_cli (L861-L875); litellm/proxy/litellm_pre_call_utils.py: safe_add_api_version_from_query_params
  (L878-L887); litellm/proxy/litellm_pre_call_utils.py: convert_key_logging_metadata_to_callback (L890-L940); litellm/proxy/litellm_pre_call_utils.py:
  _get_validated_callback_metadata (L943-L952); litellm/proxy/litellm_pre_call_utils.py: KeyAndTeamLoggingSettings.get_key_dynamic_logging_settings
  (L961-L964); litellm/proxy/litellm_pre_call_utils.py: KeyAndTeamLoggingSettings.get_team_dynamic_logging_settings
  (L967-L970); litellm/proxy/litellm_pre_call_utils.py: _get_dynamic_logging_metadata (L973-L1031); litellm/proxy/litellm_pre_call_utils.py:
  _tenant_otel_params (L1037-L1041); litellm/proxy/litellm_pre_call_utils.py: _dynamically_disabled_backends (L1047-L1072);
  litellm/proxy/litellm_pre_call_utils.py: resolve_tenant_otel_destinations (L1075-L1150); litellm/proxy/litellm_pre_call_utils.py:
  _tenant_service_name (L1153-L1170). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 328 owned nonblank/non-comment/non-docstring Python lines (373 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 348 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 595 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B732 (Typed authentication principals and grant resolution), B171 (Direct helper oracle
  and URL path encoding), B1087 (Api boundaries), B1105 (Untrusted request controls), B1106 (Principal metadata
  and tags), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
