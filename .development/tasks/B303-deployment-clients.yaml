deviations:
- what: Request destination overrides never reach client URL construction.
  why: The architect requires configuration-only URLs; B052 owns the api_base 400. Client-key overrides
    remain supported.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/clientside_credential_handler.py#L76-L105
out_of_scope:
- New HTTP transports or provider authentication mechanisms.
- Retries and global admission queues.
- Request api_base rejection and is_request_body_safe belong to B052; request URL overrides are not a
  routing feature.
- 'litellm/router_utils/clientside_credential_handler.py: B052 owns: _admin_config_fields_to_clear_on_base_override
  (L19-L63).'
pitfalls:
- Request API keys remain SecretString and never enter Debug or oracle logs.
- B009 owns HTTP construction; do not instantiate reqwest clients in the router.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
