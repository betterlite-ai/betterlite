id: B303
title: Deployment client reuse and parallel request guards
description: Connect B302 catalog entries to the B009 outbound-client pool and B010 provider configuration.
  Implement per-deployment parallel request guards and request credential overrides through typed secrets.
  Preserve distinct client identities for distinct credentials and close retired clients through the server-owned
  task lifecycle. Derive the configured concurrency cap using the referenced helper, releasing its guard
  only when a stream ends or is dropped. Reject caller api_base and base_url before any network request
  under the bounded-inputs rule; this explicit deviation is not a parity case. Use the existing Rust crate
  boundaries from B004 and B008; integrate through the server when the provider dispatcher or callbacks
  live in another core crate. This task's source slices are the linked ranges, not a port of their Python
  classes. Add the listed oracle cases and the matching adapters to B301's component runner where state
  is not observable over HTTP; adapters call production logic and never reproduce it. Use deterministic
  candidate sets or supplied random samples for comparisons, and separate seeded distribution tests for
  random choices. Extend the existing config_yaml fuzz target and committed corpus for every newly accepted
  config form; unsupported keys still fail by full path. Keep the implementation, adapters and tests within
  800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/deployment-clients/**
  - tools/oracle/src/router_probes/deployment-clients/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/deployment_clients.py
  - tools/oracle/litellm/probes/registry.py
  - Cargo.toml
  - deny.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/client_initalization_utils.py#L16-L78
  why: Non-waiting deployment concurrency guards.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/clientside_credential_handler.py#L16-L105
  why: Credential identity and endpoint override handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L12293-L12332
  why: Cached client selection.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(deployment_clients)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/deployment-clients/same-credentials-reuse.yaml
- tools/oracle/cases/routing/deployment-clients/different-key-isolation.yaml
- tools/oracle/cases/routing/deployment-clients/parallel-limit-429.yaml
- tools/oracle/cases/routing/deployment-clients/stream-holds-slot.yaml
- tools/oracle/cases/routing/deployment-clients/release-after-provider-error.yaml
deviations:
- what: Caller-supplied api_base and base_url are rejected rather than redirected.
  why: The bounded-inputs rule allows outbound destinations only from configuration.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/clientside_credential_handler.py#L76-L105
out_of_scope:
- New HTTP transports or provider authentication mechanisms.
- Retries and global admission queues.
pitfalls:
- Request API keys remain SecretString and never enter Debug or oracle logs.
- B009 owns HTTP construction; do not instantiate reqwest clients in the router.
- The URL override rejection needs architect acknowledgement before dispatch.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
