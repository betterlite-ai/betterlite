dod:
- text: Write tests named deployment_clients_behaviors and deployment_clients_boundaries under deployment_clients::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - deployment-clients-behaviors
  - deployment-clients-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/deployment-clients-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/deployment-clients-invalid.yaml;
    the valid seed contains max_parallel_requests. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - deployment-clients-boundaries
- text: Add crates/betterlite-openai/fuzz/corpus/chat_request/deployment-clients-valid.json and crates/betterlite-openai/fuzz/corpus/chat_request/deployment-clients-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target chat_request and normal replays_the_chat_request_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - chat-corpus
  - deployment-clients-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: deployment-clients-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::deployment_clients_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: deployment-clients-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::deployment_clients_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/deployment_clients.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/deployment_clients.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/deployment-clients-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/deployment-clients-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/deployment-clients-" && grep -Fq 'max_parallel_requests' crates/betterlite-config/fuzz/corpus/config_yaml/deployment-clients-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: chat-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-openai/fuzz/corpus/chat_request/deployment-clients-valid.json && test -f crates/betterlite-openai/fuzz/corpus/chat_request/deployment-clients-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request
      | grep -Fq "/deployment-clients-" && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
