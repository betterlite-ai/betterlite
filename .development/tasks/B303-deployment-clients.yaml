id: B303
title: Deployment client reuse and parallel request guards
description: 'Connect B302 catalog identities to B009 clients and B010 provider configuration using typed
  SecretString request api_key overrides. Preserve credential-specific client identity and per-deployment
  parallel guards through stream completion. The URL builder accepts only validated configuration; request
  api_base/base_url fields cannot flow into it. B052 owns the request api_base 400 via is_request_body_safe;
  do not add another rejection handler or fetch a supplied URL. Configuration boundary keys introduced
  or consumed here: max_parallel_requests, default_max_parallel_requests, client_ttl. Pinned declaration
  defaults: client_ttl=3600. Resolve env values once in betterlite-config, never in router code. client_ttl
  defaults to 3600 seconds. calculate_max_parallel_requests uses explicit max_parallel_requests, then
  rpm, then max(1, floor(tpm/1000*6)), with default_max_parallel_requests only when none is set; a falsy
  result installs no cap. Constructor source fields for secret clearing on URL redirection belong to B052
  because request URL redirection is unavailable here. Implement the owned native service in crates/betterlite-router/src/deployment_clients.rs.
  Add ProbeOperation::DeploymentClients in tools/oracle/src/router_probes/mod.rs and the corresponding B303 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_utils/client_initalization_utils.py:
  MaxParallelRequestsLimit.__init__ (L20-L24), MaxParallelRequestsLimit.__enter__ (L26-L27), MaxParallelRequestsLimit.__exit__
  (L29-L32), MaxParallelRequestsLimit.acquire (L34-L47), MaxParallelRequestsLimit.release (L49-L50), InitalizeCachedClient.set_max_parallel_requests_client
  (L55-L78). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports. Function coverage in litellm/router_utils/clientside_credential_handler.py:
  is_clientside_credential (L69-L73), get_dynamic_litellm_params (L76-L105). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
