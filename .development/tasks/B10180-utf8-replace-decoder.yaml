out_of_scope:
  - "B10169's StreamItem move, stream_item_value and the server's raw-frame adapters stay as B10169 builds them; this task only swaps the decoder they call."
  - "B10181 fixes the ten copies that decode differently from Python: the seven that cut at the first invalid byte, the Latin-1 fallback in http's agents_create_read.rs, the dropped bytes in cli's commands/debug/fetch.rs and the BOM sniffing in openai's image_variations/request.rs."
  - "Decoders with another error handler stay: errors=\"ignore\" in core's messages_stream_restamp/python_text.rs L49-L77 and rag's valkey_vector_store/wire.rs L113-L121, the strict reads in guardrails' presidio_analysis/body.rs, presidio_actions/anonymize.rs and anthropic_sse/sse_stream.rs, and bedrock's charset-aware file_content.rs L128-L162."
  - "Incremental decoders stay: aleph_alpha's LineDecoder and decode_chunk, server's sse_data_generator, provider's oci_stream split_text carry and bytez_stream_call decode."
  - "The 'N bytes that are not UTF-8' readers across the workspace refuse instead of decoding, as their deviation rows say, and are not copies of this decoder."
  - "The plain String::from_utf8_lossy calls in tools/oracle helpers run under the oracle group's crate-wide expect and stay, and test-only copies (mcp sso_assertions/assertion/tests.rs L94, logging passthrough_logging_state/tests/support.rs L379) are not touched."
pitfalls:
  - "B10169 lands first and rewrites sse_events.rs and unended.rs, so the server call sites are wherever its merged code calls betterlite_guardrails' decode_replacing_invalid, and its no-copies grep for utf8_replacing_invalid and decoded_text must stay empty."
  - "auth_pubsub's repaired_text borrows valid input through a Cow; the home always allocates, which is fine because the message is already bounded by MAX_MESSAGE_BYTES, so don't add a Cow variant to the home."
  - "aleph_alpha/lines.rs keeps decode_chunk and the encoding_rs import for LineDecoder; only the one-shot decode_text goes."
  - "request_form.rs pushes the decoded escape run into a String that already holds Latin-1 characters, so the call stays a push_str at both places and the Latin-1 bytes in between are not decoded."
  - "db's url_codec takes percent_decode(...).decode_utf8_lossy() from the percent-encoding crate it already uses, not the home, because the library feature exists."
  - "Moving the prompts and aleph_alpha decode tables into the home's table keeps every case they had, the BOM case included, since encoding_rs without BOM handling and utf8_chunks agree on it."
