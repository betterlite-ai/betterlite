id: B10180
title: One errors="replace" UTF-8 decoder in betterlite-models
description: >-
  Python's `bytes.decode("utf-8", errors="replace")`, and httpx 0.28.1's `Response.text`, which decodes with the same error handler when no charset is declared, turn each invalid byte sequence into one U+FFFD using the Unicode maximal-subpart rule. `String::from_utf8_lossy` does exactly that, but clippy.toml L45 bans it, so the workspace grew 33 private copies of the same `utf8_chunks` loop in product code and 3 more in fuzz targets, two one-shot encoding_rs decodes and four `String::from_utf8_lossy` calls under `#[expect(clippy::disallowed_methods)]`. Every copy below decodes the same way Python does. This task moves the decoder once into betterlite-models, the lowest crate every caller already depends on (betterlite-models itself depends only on betterlite-env and betterlite-error), deletes every copy and points every caller at it. No output changes anywhere.


  Home. crates/betterlite-models/src/utf8_text.rs, an empty stub on main with its `pub mod utf8_text;` line in models' lib.rs, gets `#[must_use] pub fn decode_replacing_invalid(bytes: &[u8]) -> String`: a String with the input's capacity, then for each `bytes.utf8_chunks()` chunk push `chunk.valid()` and, when `chunk.invalid()` is not empty, push `char::REPLACEMENT_CHARACTER`. Keep one comment line saying clippy.toml bans String::from_utf8_lossy, which does the same. Tests in utf8_text/tests.rs, one rstest table `decode_replacing_invalid_follows_python` with Python's results: plain (b"abc"), empty (b""), unicode ("\u{e9}\u{2713}" as bytes, unchanged), lone_invalid_byte (b"a\xffb" gives "a\u{FFFD}b"), truncated_sequence (b"a\xe2\x82" gives "a\u{FFFD}", one character for the cut sequence), bad_continuation (b"\xe2\x28\xa1" gives "\u{FFFD}(\u{FFFD}"), overlong (b"\xc0\xaf" gives two U+FFFD), surrogate (b"\xed\xa0\x80" gives three), above_max (b"\xf4\x90\x80\x80" gives four) and bom_is_kept (b"\xef\xbb\xbfx" gives "\u{feff}x"). The decode tables in prompts' gitlab_client/payload/tests.rs (L8-L16) and openai's aleph_alpha/tests.rs (L518-L526) test copies that this task deletes, so their cases move into this table and those two test functions go.


  Copies to delete; each caller calls `betterlite_models::utf8_text::decode_replacing_invalid` instead. betterlite-anthropic: `decoded_text` in batches/decode.rs L164-L173 (callers decode.rs L177 and batches/handler.rs L26, L141) and `replaced_text` in response.rs L47-L57 (caller L102). betterlite-auth: `repaired_text` in auth_pubsub/decode.rs L47-L60, which returns a Cow; L43 becomes `parser::parse_object(&decode_replacing_invalid(bytes))`. betterlite-bedrock: `replaced_text` in invoke_response/error.rs L120-L130 (callers L65, L78). betterlite-core: `replaced_text` in api/assistant_records/error.rs L262-L272 (caller L165), api/fal/vision_chat/reply.rs L113-L123 (callers L54, L63) and api/soniox/prepare/decode.rs L101-L110 (caller L46); `lossy_text` in api/file_http_content/service/facts.rs L51-L61 (caller L46); `body_text` in api/video_character_transport/service/wire.rs L18-L28 (caller L68, and the four body_text asserts in tests/helpers.rs L7 and L12-L15 go, since the home's table covers them); `response_text` in rag/vertex_ingestion/json.rs L21-L31 (callers corpus.rs L13, L66, L71, L177 and upload.rs L12, L55). betterlite-db: `decode_percent_bytes` in database_url_policy/url_codec.rs L289-L299 needs no home: unquote_plus (L283-L287) becomes `percent_decode(space_separated.as_bytes()).decode_utf8_lossy().into_owned()`, the percent-encoding crate's own lossy decode that azure_urls.rs and the logging crate already use for urllib's unquote. betterlite-foundry: `decode_replacing_invalid` in mai_images/reply.rs L93-L103 (caller L41). betterlite-guardrails: headroom/text.rs is the `lossy_text` copy and nothing else, so the file goes with its `pub(crate) mod text;` line in headroom.rs L3, and its importers call the home (headroom_compression/compress.rs L10, L90, headroom_retrieval/retrieve.rs L4, L65, L67, hiddenlayer_authentication/detection.rs L4, L35 and token.rs L10, L81); the loop inside data_payload in panw_prisma_airs/hooks/streaming/raw.rs L52-L58 becomes one `let line = decode_replacing_invalid(raw_line);`. betterlite-harness: `decode_lossy` in cli_handler/io.rs L58-L68 (callers io.rs L78 and cli_handler.rs L143; its test assert in cli_handler/tests.rs L17 and L508 goes), `decode_utf8` in sandbox/docker/process.rs L219-L228 (callers process.rs L213-L214, docker.rs L155, L158, docker/commands.rs L3, L22, L37, L43, docker/files.rs L3, L29, L49, docker/snapshot.rs L5, L42, L50) and `decode_utf8` in sandbox/local/process.rs L194-L203 (callers L177-L178). betterlite-http: `body_text` in interactions/lifecycle.rs L187-L197 (caller L183). betterlite-logging: `lossy_text` in passthrough_stream_logging/lines.rs L16-L26 (caller L3). betterlite-openai: the loops in codestral_records.rs record_text L29-L33 (`Ok(decode_replacing_invalid(body))` after the size check) and perplexity_embedding/reply.rs L97-L104; `lossy_text` in image_edits/response.rs L23-L31 (caller L17); and the public encoding_rs copy `decode_text` in aleph_alpha/lines.rs L34-L44, called by aleph_alpha/adapter.rs L10, L75, L114, betterlite-provider's adapters/vertex_agent_stream.rs L15 and langgraph_stream/wrapper.rs L9, betterlite-vertex's gemini_call/sync_call.rs L6, gemini_http/call.rs L7 and gemini_http/stream.rs L5, provider's fuzz target langgraph_stream.rs L3, L10 and provider's langgraph_stream/tests.rs L12, L514. `decode_chunk` and `LineDecoder` stay in lines.rs: they are httpx's incremental decoder, a different function. betterlite-prompts: the public `decode_text` in gitlab_client/payload.rs L29-L39, called by gitlab_client.rs L65, gitlab_templates/tests.rs L15, L53, betterlite-bedrock's embedding_jobs/status.rs, betterlite-openai's ovhcloud_audio/reply.rs, ovhcloud_embedding/reply.rs and scaleway_audio/reply.rs, and betterlite-provider's data_cloud_dispatch/embed.rs, embed/snowflake.rs, oauth.rs and oci_stream.rs (whose split_text keeps its incremental carry and only swaps the call). betterlite-provider: `lossy_text` in azure_media_dispatch/parts.rs L37-L45 (callers edit.rs L24, L63 and transcription.rs L31, L99) and `replaced_text` in bedrock_interactive_dispatch/responses.rs L210-L220 (caller L234). betterlite-proxy: `decode_line` in agent_endpoints/a2a_stream/lines.rs L42-L52 (callers L20, L25, L37). betterlite-server: `push_replaced_utf8` in api/request_form.rs L149-L157 appends into the caller's String, so its two calls at L124 and L145 become `decoded.push_str(&decode_replacing_invalid(&escaped))`; the public `lossy_utf8` in mcp/transport_checks/peek.rs L43-L53 (callers peek.rs L193, the corpus replay in peek/tests.rs L294 and the fuzz target fuzz_targets/mcp_routing_peek.rs L4, L12; the rstest `lossy_text_matches_pythons_decoding` in peek/tests.rs L189-L198 tests the copy and goes with its name in the L19 import); the loop in pass_through_logging/tinyfish/sse.rs L13-L19; and `UTF_8.decode_without_bom_handling(raw).0` in mcp/debug/preview.rs L85 with its now unused `use encoding_rs::UTF_8;` at L11. betterlite-tokenizer: `replacement_string` in engine/tiktoken.rs L128-L138 (caller L115). betterlite-vertex: `body_text` in gemini_embedding_call/execute.rs L29-L39 (callers L117, L177) and `decode_lossy` in google_genai_guardrail/sse.rs L5-L15 (caller L19, `.map(decode_replacing_invalid)`).


  After B10169. B10169 (todo, its flow running now) makes guardrails' private `decode_replacing_invalid` in guardrail_message_scope/stream_chunk_events.rs (L17-L27 on main, called at L12) public, adds `stream_item_value` beside it and deletes the server's two copies, `utf8_replacing_invalid` in guardrails/anthropic_translation/sse_events.rs L36-L46 (called at L62) and `decoded_text` in process_stream/unended.rs L17-L27 (called at L32), pointing their callers at the guardrails function. That function is then one more copy of the home: it goes, the calls in stream_chunk_events.rs (the events reader at L12 and stream_item_value) call the home, and every server caller B10169 left imports the home instead. Read the three files as B10169 merged them, not at the main lines above.


  Fuzz targets. The `lossy_text` copies in crates/betterlite-logging/fuzz/fuzz_targets/passthrough_upstream_usage.rs (L14, L19-L28), crates/betterlite-mcp/fuzz/fuzz_targets/mcp_sealed_code.rs (L23, L29-L38) and sso_assertion_decode.rs (L8, L20-L29) go and the targets call the home.


  Lint expectations. Four sites call `String::from_utf8_lossy` under `#[expect(clippy::disallowed_methods)]`, and each calls the home instead and loses its expect: cli's autoroute/process/liveliness.rs L58-L62 (`let text = decode_replacing_invalid(&bytes);`), http's passthrough/error_body.rs L106-L111, http's skill_archive.rs L231-L232 and openai's chat_choices/reply.rs L47-L51.


  Manifests. betterlite-proxy (crates/betterlite-proxy/Cargo.toml) and the fuzz crates crates/betterlite-mcp/fuzz/Cargo.toml and crates/betterlite-provider/fuzz/Cargo.toml do not list betterlite-models yet; each gets `betterlite-models = { path = ... }` in alphabetical order beside its other betterlite paths, and Cargo.lock follows. Every other caller crate lists betterlite-models already, and betterlite-models depends on no caller, so no cycle appears.
