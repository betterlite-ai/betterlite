references:
  - url: https://docs.python.org/3/library/codecs.html#error-handlers
    why: The "replace" error handler puts U+FFFD in place of each malformed sequence when decoding.
  - url: https://github.com/encode/httpx/blob/0.28.1/httpx/_models.py#L641-L672
    why: Response.text and Response.encoding in the httpx release LiteLLM pins (uv.lock), UTF-8 unless a charset is declared.
  - url: https://github.com/encode/httpx/blob/0.28.1/httpx/_decoders.py#L306-L318
    why: TextDecoder builds its incremental decoder with errors="replace".
  - url: https://doc.rust-lang.org/std/str/struct.Utf8Chunks.html
    why: utf8_chunks splits at maximal invalid subparts, the same rule CPython's UTF-8 decoder follows, and String::from_utf8_lossy is built on it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L5151
    why: One of the bytes.decode("utf-8", errors="replace") calls the copies port; the others are the error_body.decode, chunk.decode and raw.decode calls across llms/, harness/ and proxy/.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/sandbox/local.py#L122-L123
    why: The harness sandboxes decode stdout and stderr with errors="replace", the calls harness's decode_utf8 copies port.
dod:
  - text: betterlite-models' utf8_text holds the one decode_replacing_invalid, and its table pins Python's errors="replace" output for valid, cut, overlong, surrogate, out-of-range and BOM input.
    proof: [home-tests]
  - text: No hand-written copy, encoding_rs copy or expected String::from_utf8_lossy call of the decoder is left in the files this task touches, headroom/text.rs is gone, and no caller imports the deleted public copies.
    proof: [no-copies, no-imports]
  - text: betterlite-proxy and the mcp and provider fuzz crates list betterlite-models.
    proof: [manifests]
  - text: Every owner's tests still pass with the home in place, so no output changed.
    proof: [anthropic-tests, auth-tests, bedrock-tests, cli-tests, core-tests, db-tests, foundry-tests, guardrails-tests, harness-tests, http-tests, logging-tests, openai-tests, prompts-tests, provider-tests, proxy-tests, server-tests, tokenizer-tests, vertex-tests]
checks:
  optional: []
  commands:
    - id: home-tests
      why: The home is missing or decodes differently from Python's errors="replace".
      run: grep -q 'pub fn decode_replacing_invalid' crates/betterlite-models/src/utf8_text.rs && cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^utf8_text::/)'
    - id: no-copies
      why: A copy of the decoder, a lossy call under an expect or the encoding_rs one-liner is still in place.
      run: >-
        test -z "$(grep -lE 'utf8_chunks|from_utf8_lossy|decode_without_bom_handling|REPLACEMENT_CHARACTER|u[{][fF][fF][fF][fF][}]'
        crates/betterlite-anthropic/src/batches/decode.rs crates/betterlite-anthropic/src/response.rs
        crates/betterlite-auth/src/auth_pubsub/decode.rs crates/betterlite-bedrock/src/invoke_response/error.rs
        crates/betterlite-cli/src/autoroute/process/liveliness.rs crates/betterlite-core/src/api/assistant_records/error.rs
        crates/betterlite-core/src/api/fal/vision_chat/reply.rs crates/betterlite-core/src/api/file_http_content/service/facts.rs
        crates/betterlite-core/src/api/soniox/prepare/decode.rs crates/betterlite-core/src/api/video_character_transport/service/wire.rs
        crates/betterlite-core/src/rag/vertex_ingestion/json.rs crates/betterlite-db/src/database_url_policy/url_codec.rs
        crates/betterlite-foundry/src/mai_images/reply.rs crates/betterlite-guardrails/src/panw_prisma_airs/hooks/streaming/raw.rs
        crates/betterlite-harness/src/cli_handler/io.rs crates/betterlite-harness/src/sandbox/docker/process.rs
        crates/betterlite-harness/src/sandbox/local/process.rs crates/betterlite-http/src/interactions/lifecycle.rs
        crates/betterlite-http/src/passthrough/error_body.rs crates/betterlite-http/src/skill_archive.rs
        crates/betterlite-logging/src/passthrough_stream_logging/lines.rs crates/betterlite-logging/fuzz/fuzz_targets/passthrough_upstream_usage.rs
        crates/betterlite-mcp/fuzz/fuzz_targets/mcp_sealed_code.rs crates/betterlite-mcp/fuzz/fuzz_targets/sso_assertion_decode.rs
        crates/betterlite-openai/src/codestral_records.rs crates/betterlite-openai/src/image_edits/response.rs
        crates/betterlite-openai/src/perplexity_embedding/reply.rs crates/betterlite-openai/src/chat_choices/reply.rs
        crates/betterlite-prompts/src/gitlab_client/payload.rs crates/betterlite-provider/src/azure_media_dispatch/parts.rs
        crates/betterlite-provider/src/bedrock_interactive_dispatch/responses.rs crates/betterlite-proxy/src/agent_endpoints/a2a_stream/lines.rs
        crates/betterlite-server/src/api/request_form.rs crates/betterlite-server/src/mcp/transport_checks/peek.rs
        crates/betterlite-server/src/pass_through_logging/tinyfish/sse.rs crates/betterlite-server/src/mcp/debug/preview.rs
        crates/betterlite-tokenizer/src/engine/tiktoken.rs crates/betterlite-vertex/src/gemini_embedding_call/execute.rs
        crates/betterlite-vertex/src/google_genai_guardrail/sse.rs
        crates/betterlite-guardrails/src/guardrail_message_scope/stream_chunk_events.rs
        crates/betterlite-server/src/guardrails/anthropic_translation/sse_events.rs
        crates/betterlite-server/src/guardrails/anthropic_translation/process_stream/unended.rs)"
        && test ! -e crates/betterlite-guardrails/src/headroom/text.rs
        && test -z "$(grep -n 'fn decode_text' crates/betterlite-openai/src/aleph_alpha/lines.rs)"
    - id: no-imports
      why: A caller still imports one of the deleted public copies.
      run: test -z "$(grep -rnE 'payload::decode_text|aleph_alpha::lines::[{]?[^;]*decode_text|lossy_utf8|headroom::text|stream_chunk_events::[{]?[^;]*decode_replacing_invalid' crates --include=*.rs)"
    - id: manifests
      why: A crate that now calls the home does not list betterlite-models.
      run: grep -q '^betterlite-models' crates/betterlite-proxy/Cargo.toml && grep -q '^betterlite-models' crates/betterlite-mcp/fuzz/Cargo.toml && grep -q '^betterlite-models' crates/betterlite-provider/fuzz/Cargo.toml
    - id: anthropic-tests
      why: The batch or response text of an Anthropic reply changed.
      run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^(batches|response)::/)'
    - id: auth-tests
      why: An auth cache invalidation message decodes differently, or its corpus replay broke.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_pubsub::/)'
    - id: bedrock-tests
      why: A Bedrock invoke error or embedding job status text changed.
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^(invoke_response|embedding_jobs)::/)'
    - id: cli-tests
      why: The autoroute log tail changed.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::process::/)'
    - id: core-tests
      why: An assistants, fal, file content, Soniox, video character or Vertex ingestion message changed.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^(api::(assistant_records|fal::vision_chat|file_http_content|soniox::prepare|video_character_transport)|rag::vertex_ingestion)::/)'
    - id: db-tests
      why: unquote_plus on a database URL decodes a percent escape differently.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_url_policy::/)'
    - id: foundry-tests
      why: A MAI image error message changed.
      run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/^mai_images::/)'
    - id: guardrails-tests
      why: A Headroom, HiddenLayer, Prisma AIRS or stream chunk body or line reads differently.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^(headroom|hiddenlayer|panw_prisma_airs|guardrail_message_scope::stream_chunk_events)/)'
    - id: harness-tests
      why: A CLI harness tail line or a sandbox stdout or stderr text changed.
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^(cli_handler|sandbox::(docker|local))::/)'
