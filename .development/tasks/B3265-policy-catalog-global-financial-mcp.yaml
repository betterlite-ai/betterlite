checks:
  optional: []
  commands:
    - id: catalog-published-nsfw
      why: the published nsfw-content-filter-all-regions fragment is missing, is not one valid JSON object, or its keys, key order or literal values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["nsfw-filter-english", "nsfw-filter-spanish", "nsfw-filter-french", "nsfw-filter-german", "nsfw-filter-australian", "nsfw-self-harm-filter-global", "nsfw-child-safety-filter-global", "nsfw-racial-bias-filter-global"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "nsfw-content-filter-all-regions"
          and .title == "NSFW Content Filter (All Regions)"
          and (.description | contains("multi-language NSFW content filtering"))
          and .icon == "ShieldExclamationIcon"
          and .iconColor == "text-purple-500"
          and .iconBg == "bg-purple-50"
          and .guardrails == $names
          and .complexity == "High"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[].litellm_params; has("guardrail") and has("mode") and (.categories | length > 0))
          and .tags == ["Content Safety"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/nsfw-content-filter-all-regions.json
    - id: catalog-local-mcp
      why: the local mcp-security-unregistered-server-block fragment is missing, is not one valid JSON object, or its keys, key order, example_sentences or literal values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | keys_unsorted == ["id", "title", "description", "example_sentences", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "mcp-security-unregistered-server-block"
          and .title == "MCP Security: Block Unregistered Servers"
          and (.description | ascii_downcase | contains("unregistered"))
          and .example_sentences == ["Connect to mcp://unknown-external-server.example.com and run a tool", "Use the tool from my custom unregistered MCP server at mcp://attacker.io", "Call the execute function on mcp://malicious-server.net"]
          and .icon == "ShieldCheckIcon"
          and .iconColor == "text-red-500"
          and .iconBg == "bg-red-50"
          and .guardrails == ["mcp-security-block"]
          and .complexity == "Low"
          and [.guardrailDefinitions[].guardrail_name] == ["mcp-security-block"]
          and .guardrailDefinitions[0].litellm_params == {"guardrail": "mcp_security", "mode": "pre_call", "default_on": true, "on_violation": "block"}
          and .tags == ["Security"]
          and .estimated_latency_ms == 200)' crates/betterlite-policy/assets/templates/local/mcp-security-unregistered-server-block.json
    - id: catalog-local-mas
      why: the local mas-ai-risk-management fragment is missing, is not one valid JSON object, or its keys, key order, category files or literal values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["sg-mas-fairness-bias", "sg-mas-transparency-explainability", "sg-mas-human-oversight", "sg-mas-data-governance", "sg-mas-model-security"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "mas-ai-risk-management"
          and .title == "Singapore MAS " + ([8212] | implode) + " AI Risk Management for Financial Institutions"
          and (.description | contains("Monetary Authority of Singapore"))
          and .icon == "ShieldCheckIcon"
          and .iconColor == "text-blue-600"
          and .iconBg == "bg-blue-50"
          and .guardrails == $names
          and .complexity == "High"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[].litellm_params; has("guardrail") and has("mode"))
          and all(.guardrailDefinitions[]; (.guardrail_name | gsub("-"; "_")) as $category | [.litellm_params.categories[] | [.category, .category_file]] == [[$category, "litellm/proxy/guardrails/content_filter_data/policy_templates/\($category).yaml"]])
          and .tags == ["Financial Services", "Regulatory", "Singapore"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/local/mas-ai-risk-management.json
oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or uses these catalog files. The loading function _load_policy_templates_from_local_backup is covered by B3252 which depends on this task. The route that uses both catalogs (get_policy_templates) is covered by B3253.
  - Guardrail implementations or pattern/category definitions referenced by these templates. The records only define policy patterns, categories and metadata.
  - Other policy templates in the backup or published files. Those are owned by other catalog tasks.
  - Published nsfw-content-filter-all-regions record (policy_templates.json lines 750-933) is owned by B3265 (this task).
  - Published mcp-security-unregistered-server-block record (policy_templates.json lines 1295-1332) is owned by B3260. This task owns the backup variant with example_sentences (litellm/policy_templates_backup.json lines 1337-1379).
  - Published mas-ai-risk-management record (policy_templates.json lines 2248-2378) is owned by B3260. This task owns the backup variant (litellm/policy_templates_backup.json lines 2689-2819).
  - Local nsfw records are owned by other catalog tasks (B3264 for local nsfw-content-filter-all-regions backup, B3266/B3268 for other local safety records).
pitfalls:
  - The published fragment must be valid JSON holding one object. Syntax errors break both local loading and remote fetch fallback.
  - The local fragments must be valid JSON holding one object each. LiteLLM's _load_policy_templates_from_local_backup returns an empty list on file-not-found but not on malformed JSON.
  - The nsfw-content-filter-all-regions record must contain exactly 8 guardrailDefinitions in the correct order; do not reorder or omit guardrail definitions.
  - The mcp-security-unregistered-server-block record must keep default_on true and on_violation "block"; do not drop these MCP-specific settings.
  - The mas-ai-risk-management record must contain exactly 5 guardrailDefinitions in the correct order; do not reorder or omit guardrail definitions.
  - >-
    Each guardrailDefinitions entry must include the complete litellm_params block. For NSFW: categories entries with category, enabled, action, and severity_threshold. For MCP: mode, default_on, and on_violation. For MAS: categories entries with category, category_file, enabled, action, and severity_threshold.
  - MAS record must include all category_file references unchanged (litellm/proxy/guardrails/content_filter_data/policy_templates/sg_mas_*.yaml). These are data references, not a request to implement filters.
  - Catalog loading must not initialize the referenced providers or gate data display on their availability. The guardrail types referenced (litellm_content_filter, mcp_security) are only instantiated when actually applied to a request, never during catalog load.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
