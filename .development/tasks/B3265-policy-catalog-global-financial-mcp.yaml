id: B3265
title: "Published global safety and local financial AI and MCP records"
description: >-
  Retain published global content safety plus local MAS and MCP-security records as pure policy catalog data.
  These are catalog records with no implementation; their descriptions reference guardrail definitions owned by policy engine tasks, not this data task.
  Own the published nsfw-content-filter-all-regions record (policy_templates.json lines 750-933) with all eight guardrailDefinitions (nsfw-filter-english, nsfw-filter-spanish, nsfw-filter-french, nsfw-filter-german, nsfw-filter-australian, nsfw-self-harm-filter-global, nsfw-child-safety-filter-global, nsfw-racial-bias-filter-global).
  Own the local mcp-security-unregistered-server-block record (backup lines 1337-1379) with one guardrailDefinition (mcp-security-block).
  Own the local mas-ai-risk-management record (backup lines 2689-2819) with five guardrailDefinitions (sg-mas-fairness-bias, sg-mas-transparency-explainability, sg-mas-human-oversight, sg-mas-data-governance, sg-mas-model-security).
  The published NSFW record covers multi-language content filtering for profanity, sexual content, self-harm, child safety and racial bias in English, Spanish, French, German and Australian.
  The MCP record blocks requests referencing MCP servers not registered on the gateway.
  The local MAS record covers Singapore financial AI risk management covering fairness, bias, transparency, explainability, human oversight, data governance and model security.
  Preserve the exact field order and values from the pinned LiteLLM commit. All records include complete litellm_params with category definitions or pattern configurations and category_file references where applicable.
scope:
  paths:
    - policy_templates.json
    - litellm/policy_templates_backup.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L750-L933
    why: The complete published nsfw-content-filter-all-regions record in the root catalog with 8 guardrailDefinitions for multi-language NSFW content filtering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L1337-L1379
    why: The complete local mcp-security-unregistered-server-block record in the backup file with guardrailDefinition for blocking unregistered MCP servers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L2689-L2819
    why: The complete local mas-ai-risk-management record in the backup file with 5 guardrailDefinitions covering Singapore MAS AI Risk Management guidelines.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624
    why: The _load_policy_templates_from_local_backup function that loads the backup catalog file.
