dod:
  - text: lookup returns an entry only while it is unexpired, and a negative entry (None payload) is returned as a hit.
    proof: [cache-tests]
  - text: prune removes expired entries first, then the earliest-expiring overflow above 128 with ties going to the older insert, then idle locks of evicted keys and generations with no fetch in flight.
    proof: [cache-tests]
  - text: store is refused after invalidate bumped the generation during a fetch, and works when the generation is unchanged.
    proof: [cache-tests]
  - text: invalidate removes only the named server's entries and idle locks, keeps a held lock, and bumps or removes the generation depending on a fetch in flight.
    proof: [cache-tests]
  - text: enter_fetch serializes callers of one key, and a cancelled waiter gives its fetcher count back.
    proof: [cache-tests]
  - text: hydrate returns false without reading the store when the server already has a client_id.
    proof: [hydration-tests]
  - text: hydrate overlays client_id, client_secret and token_endpoint_auth_method from the store, decrypting the first two and keeping an undecryptable value as stored.
    proof: [hydration-tests]
  - text: A store read error, a missing row, an empty or malformed blob and an empty client_id each give false and leave the server unchanged.
    proof: [hydration-tests]
  - text: redirect_uri_not_registered is false for missing or empty redirect_uris and true only when the current uri is absent from a non-empty list.
    proof: [hydration-tests]

checks:
  optional: []
  commands:
    - id: cache-tests
      why: the metadata cache tests are missing or fail
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_metadata_cache::/)'
    - id: hydration-tests
      why: the DCR hydration tests are missing or fail
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^dcr_hydration::/)'

oracle_cases: []

deviations:
  - what: The cache and its locks are one OAuthMetadataCache value passed in, not module-level dicts, and time is an argument.
    why: the repo allows no module state, and tests run on paused time.
  - what: DcrClientStore is a trait and an undecryptable value is handled by the injected Decryptor.
    why: betterlite-mcp cannot import the database code in betterlite-server, so the architect wires the adapter.
  - what: token_endpoint_auth_method from the store is kept as text on PersistedDcrCredentials and converted with the MCPTokenEndpointAuthMethod parser when it is applied; text that does not parse leaves the field None and logs at debug.
    why: Python assigns the raw string without validation, while the Rust record holds the typed enum.

out_of_scope:
  - "fetch_upstream_oauth_protected_resource and is_network_error (the upstream fetch that reads and fills this cache), and every route handler of discoverable_endpoints: no owner found, see the architect notes."
  - "_resolve_persisted_dcr_client, _reuse_persisted_dcr_client_if_available, _persisted_dcr_redirect_uri_is_stale and _persist_dcr_client_registration (the register flow, which reads the same types): no owner found, see the architect notes."
  - "get_mcp_server_oauth_client_credentials, the real store read: B4712."
  - "decrypt_value_helper and the Decryptor trait: B2303 and B6763."
  - "_hydrate_config_servers_dcr_clients, the loop that calls hydrate for each server: B6764. _invalidate_server_definition_caches, the caller of invalidate: B6765 and the other registry writers."
  - "The MCPServer record: B6590."

pitfalls:
  - "An entry whose expires_at equals now is expired, in lookup and in prune (the Python tests use <= for pruning and > for a hit)."
  - "Lock.locked() is false between one holder's release and the next waiter waking, so idleness must also check the fetcher count, or prune and invalidate would delete a lock that a waiter is about to use."
  - "FetchSlot must release the Mutex before it lowers the fetcher count, and must exist before the await on the Mutex, or a cancelled waiter leaks a count and its key is never pruned."
  - "A fetch that started before invalidate must not repopulate the cache: it reads the generation first and store compares it again, and the generation entry exists only while a fetch is in flight."
  - "The overflow eviction sorts by expiry only, so equal expiry needs the insert sequence to match Python's stable sort over dict order."
  - "hydrate must not read the store when client_id is already set, because a client_id from config.yaml wins over a persisted one."
  - "A stored client_id that decrypts to an empty string is no client: apply returns false before it touches any field."
  - "The blob can arrive as a JSON string or as an already parsed object, and both an empty string and an empty object mean no credentials."
  - "client_secret is replaced with None when the stored client has none, so a leftover secret from config never pairs with a different stored client_id (hydrate only runs when client_id was unset)."
  - "Never put client_secret or the decrypted values in a log line or an error text."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
