pitfalls:
  - 'The oracle helper for this task is pre-registered as default_user_teams in the server group. Replace the stub Op in tools/oracle/src/helpers/server/default_user_teams.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/default_user_teams.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - all() accepts the empty teams list before the dictionary-record branch.
  - return_exceptions=True hides enrollment failures from this helper's caller after successful writes remain committed.
  - An empty teams list is falsey in get_user_object, so the port must return before add_new_user_to_default_team runs.
