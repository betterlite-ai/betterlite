id: B1226
title: Default user teams and enrollment contract
description: >-
  Decode default_internal_user_params.teams as homogeneous strings or typed NewUserRequestTeam records.
  Mixed invalid entries log and yield no defaults. Enrollment calls an injected TeamEnrollment::add(UserId,TeamId,Role,Option<Decimal>)->Result<(),MembershipError>;
  B790/B808 implement the management-policy operation and B056 registers it. Retain gather-with-returned-exceptions
  semantics; this helper cannot depend on authentication lookup or member endpoint registration.


  Injected port instead of a reverse dependency on B790: TeamEnrollment::add(UserId,TeamId,Role,Option<Decimal>)->Result<(),MembershipError>;
  B790 implements the source member-policy call after B808 exists. A configured but unregistered implementation
  is a named startup error, never a success stub.


  Build the production default_user_teams module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  check_if_default_team_set (L413-L434; 22 source lines), add_new_user_to_default_team (L437-L467; 30
  source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.default_internal_user_params=None.


  Add the default_user_teams operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a default-user-teams-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::default_user_teams::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 52 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  65 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 352 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
  paths:
    - crates/betterlite-auth/src/default_user_teams.rs
    - crates/betterlite-auth/src/default_user_teams/**
    - crates/betterlite-auth/src/lib.rs
