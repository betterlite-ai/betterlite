    why: Own check_if_default_team_set; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/internal_user_endpoints.py#L437-L467
    why: Own add_new_user_to_default_team; preserve caller-visible values and failure ordering.
