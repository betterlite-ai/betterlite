    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/auth.rs
    - tools/oracle/helpers/management/auth.py
    - tools/oracle/cases/helpers/default-user-teams/**
    - tools/oracle/fuzz/corpus/helper_case/default-user-teams-*
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/config.rs
    - crates/betterlite-config/src/default_user_teams.rs
    - crates/betterlite-config/src/default_user_teams/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/default-user-teams-*
