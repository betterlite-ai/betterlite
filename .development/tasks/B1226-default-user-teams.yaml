id: B1226
title: Default user teams and enrollment contract
description: >-
  Read default_internal_user_params.teams for default enrollment. Missing settings or missing/null teams
  returns None; an empty sequence returns an empty list, not None. Homogeneous strings pass through in
  order, including duplicate IDs and empty strings. Homogeneous dicts become NewUserRequestTeam records
  using team_id, max_budget_in_team (both default None) and user_role (default user only when absent).
  B790 owns NewUserRequestTeam: team_id must be a string, and role must be user/admin. Thus an absent/null
  team_id or null/invalid role raises model validation; explicit null budget remains valid. Propagate these errors.
  Mixed or unsupported entries log ERROR Invalid team type in default internal user params with the teams
  value and return None. Do not turn this into a warning or catch record-validation errors as that fallback.


  Enrollment passes user_id, user_email and the supplied UserAPIKeyAuth through to B790 _add_user_to_team,
  which calls B808 team_member_add with its management authorization and write behavior. A string team
  means role user and no budget; a typed record keeps its role and budget, including zero. Reject other
  team values with ValueError Invalid team type before gathering any operations. Submit all collected
  operations with gather(return_exceptions=True), wait for all, discard their results and return None.
  One failed team does not cancel successful enrollment or roll it back. This layer emits no additional
  log for returned exceptions; B790 owns its duplicate/missing-team debug and other error logging.
  The prisma_client argument is unused here; do not introduce a separate DB write or transaction.


  Build the production default_user_teams module in betterlite-server, next to B790's user fields, and
  implement B736's DefaultTeamEnrollment port with it: the port call runs check_if_default_team_set and,
  for a truthy result, add_new_user_to_default_team with the identity and proxy_admin auth B736 passes.
  The module lives in the server crate because it calls B790 and B808 there; betterlite-auth only owns
  the port. B056 installs this implementation into the auth user lookup, so this task registers nothing
  in server state. Extend B736's default_internal_user_params config record with the teams field rather
  than declaring a second record. Reuse the typed dependencies listed in the backlog. Keep Rust
  implementation files below 300 lines by using named domain submodules with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  check_if_default_team_set (L413-L434; 22 source lines), add_new_user_to_default_team (L437-L467; 30
  source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.default_internal_user_params=None.


  Use B856 Management::auth helper cases only for the settings-to-team-record projection. Exercise
  enrollment through the real membership service and Postgres, using POSTGRES_TEST_URL or testcontainers
  when unset. Verify partial success and exact propagated identity/role/budget; a fake enrollment callback
  alone cannot prove that the B790/B808 policy path is used.


  Production B002 config tests settings_absent, teams_null_and_empty, string_defaults,
  record_defaults_and_nulls, mixed_entries_error_and_drop and malformed_record_fails cover the different
  outcomes; there is no general invalid-value fallback. The source iterates teams without first checking
  it is a list: a string iterates as characters, a mapping as keys, and a noniterable raises. Preserve and
  name those cases at the config boundary. No dedicated environment variable overrides these settings;
  seed config_yaml with nested defaults and ordinary os.environ/ resolution.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 52 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  65 production, 220 behavior/Postgres tests, 45 pure-helper adapters, 30 wiring, 0 decoder/fuzz
  and 60 config lines, 420 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
