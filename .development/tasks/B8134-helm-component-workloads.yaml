dod:
  - text: serverEnv variables (writer, reader, token modes, conflicts, Redis, cluster mode, pool) render in the gateway, backend and Job as described.
    proof: [env-suites]
  - text: The probes, volumes, replica rule, strategy and security settings render for each component.
    proof: [pod-suites]
  - text: The metrics and collector containers render only when enabled, with the port guard.
    proof: [sidecar-suites]
  - text: The migrations Job runs betterlite-db-admin migrate with both hook styles, the service account rule and the deadline.
    proof: [job-suites]
  - text: The chart lints and renders with the minimum values.
    proof: [chart-lint]
checks:
  optional: []
  commands:
    - id: env-suites
      why: an environment behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite tests/database_auth_tests.yaml tests/redis_env_tests.yaml tests/connection_pool_tests.yaml
    - id: pod-suites
      why: a pod behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite tests/probe_tests.yaml tests/deployment_volumes_tests.yaml tests/pod_hardening_tests.yaml tests/replica_count_tests.yaml tests/rollout_strategy_tests.yaml
    - id: sidecar-suites
      why: a sidecar behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite tests/collector_tests.yaml tests/metrics_server_tests.yaml
    - id: job-suites
      why: a migrations Job behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite tests/migration_job_tests.yaml tests/migration_job_hooks_tests.yaml
    - id: chart-lint
      why: the chart does not lint or render
      run: test -f packaging/helm/betterlite/templates/gateway/deployment.yaml && sh packaging/helm/tests/helm_checks.sh lint packaging/helm/betterlite packaging/helm/betterlite/tests/values/required.yaml
oracle_cases: []
deviations:
  - what: The Job and pods run the betterlite image and the Job command is betterlite-db-admin migrate, not python migrations/run.py in a separate migrations image.
    why: B1232 owns the native migration command.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm/templates/migrations-job.yaml#L50-L60
  - what: The config file is mounted at /etc/betterlite/config.yaml instead of /app/config/config.yaml.
    why: The native image has no /app folder.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm/templates/gateway/deployment.yaml#L58-L62
  - what: The metrics and collector containers run betterlite subcommands from values instead of python -m litellm.proxy.prometheus_metrics_server and litellm.proxy.collector.
    why: No Python in the image; the commands are overridable values because no task builds those entrypoints yet.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm/templates/gateway/deployment.yaml#L125-L175
out_of_scope:
  - Values, helpers, ServiceAccounts and the gateway ConfigMap belong to B8133.
  - Ingress, HPAs, PDBs and the ServiceMonitor belong to B8135.
  - The database admin binary (B1232) and the collector program (B1708) are not built here.
pitfalls:
  - >-
    The Job selector is generated by the controller, so podLabels may override a chart label there (use merge); a Deployment selector is fixed, so betterlite.podLabels rejects those keys.
  - >-
    The Deployment leaves replicas out when hpa.enabled is true, and an unset (null) replicaCount also leaves it out; a replicaCount of 0 is written.
  - >-
    The collector and metrics containers get the same securityContext as the gateway container, but the metrics container takes no database variables.
  - >-
    The migrations Job sets restartPolicy Never here, while the single-deployment chart uses OnFailure.
  - >-
    The backend mounts the gateway's ConfigMap, so its volume name must differ from the gateway's only if the pod needs both; each pod mounts only its own copy.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
