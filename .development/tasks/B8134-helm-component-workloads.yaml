id: B8134
title: Component chart Deployments, Services and migrations Job
description: >-
  Add the workload templates of the component chart packaging/helm/betterlite (B8133 wrote values.yaml and the helpers): templates/gateway/deployment.yaml, templates/backend/deployment.yaml, templates/ui/deployment.yaml, templates/gateway/service.yaml, templates/backend/service.yaml, templates/ui/service.yaml, templates/gateway/service-metrics.yaml and templates/migrations-job.yaml. Use the helpers from B8133 and do not edit them or values.yaml.
  Gateway Deployment (when gateway.enabled): name from betterlite.gateway.fullname, replicas written only when gateway.hpa.enabled is false and replicaCount is set, strategy, selector with betterlite.gateway.selectorLabels, a checksum/config annotation (sha256 of gateway/configmap.yaml when gateway.config.create), pod labels checked by betterlite.podLabels, serviceAccountName and automountServiceAccountToken from serviceAccounts.gateway, imagePullSecrets, podSecurityContext. Container "gateway" listens on 4000 (port name http), env from betterlite.serverEnv, CONFIG_FILE_PATH=/etc/betterlite/config.yaml when gateway.config.create, NUM_WORKERS from gateway.numWorkers, the pool variables when database.connectionPool.enabled, PROMETHEUS_MULTIPROC_DIR when gateway.metricsServer.enabled (fail with "gateway.metricsServer.port must differ from the gateway port 4000" when the port is 4000), the collector variables when gateway.collector.enabled, envFrom from envConfigMaps and envSecrets, the config volume mount at /etc/betterlite/config.yaml, the multiproc and collector-socket volumes, user volumes and mounts, the three probes and lifecycle from values, resources, and nodeSelector, affinity, tolerations, topologySpreadConstraints and terminationGracePeriodSeconds only when set (an empty string or unset leaves it out). A "metrics" container (gateway.metricsServer.enabled) and a "collector" container (gateway.collector.enabled, with LITELLM_JOB_ROLE=collector) use the same image; their commands come from gateway.metricsServer.command and gateway.collector.command (B8133 values define them, with the defaults ["betterlite", "metrics-server", "--port", "<port>"] built in the template and ["betterlite", "collector"]). extraContainers pass through tpl.
  Backend Deployment (backend.enabled) is the same shape on port 4001 with container "backend", serverEnv and no config, collector or metrics parts; the config volume is the gateway ConfigMap only when gateway.config.create, mounted the same way. UI Deployment (ui.enabled) runs container "ui" on port 3000 with LITELLM_LOG, LITELLM_BACKEND_URL when ui.backendUrl is set, user env, probes, resources and scheduling from the ui block, and no database or master key variables.
  Services: <component fullname> of type service.type on the component port, targetPort http, selector from the component labels. service-metrics.yaml renders <gateway fullname>-metrics (ClusterIP, port gateway.metricsServer.port, targetPort metrics) only when the metrics server is on.
  migrations-job.yaml (migrationJob.enabled): a Job <fullname>-migrations with the Helm pre-install and pre-upgrade hook annotations when hooks.helm.enabled (delete policy before-hook-creation, weight default "0") and ArgoCD PreSync annotations when hooks.argocd.enabled, backoffLimit, ttlSecondsAfterFinished, optional activeDeadlineSeconds, restartPolicy Never, the service account from betterlite.migrations.serviceAccountName, pod labels merged over the chart labels plus app.kubernetes.io/component migrations, and one container "db-migrations" with the migrationJob image, env from betterlite.serverEnv (component migrationJob) and the command ["betterlite-db-admin", "migrate"].
