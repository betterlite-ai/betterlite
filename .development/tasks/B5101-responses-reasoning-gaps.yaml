deviations: []
out_of_scope:
- The ToolCalls enum, tool_calls() and has_nonempty_tool_calls() in trailing.rs stay as functions; only their Value payload becomes a list. Deleting them and inlining their expression is B5094's padded-one-line-function sweep, not this task.
- Content::Other and is_empty_value's Bool/Number/Object arms stay. The kept finding only asks to type tool_calls as a list; content's own "any other JSON value LiteLLM stores unexamined" fallback is untouched.
pitfalls:
- "record_kind attribute is the only path through serialize_record that forces a key present; dict-kind records pass straight through ChatRecord's own serde with no adapter logic, so fixing the None handling must not touch the Dict branch or reasoning-explicit-null-fields (dict-kind) starts failing instead."
- "tool_calls stays double_option (Option<Option<Vec<Value>>>): only the inner type changes from Value to Vec<Value>, not the missing-vs-null shape, or trailing_assistant_hosted_search_preserves_explicit_null_tool_calls breaks."
- docs/compatibility.md forbids an oracle case that sends tool_calls a value outside its declared type, so the rejection test for finding two is a plain Rust test, not a helper case.
review_level: standard
budget:
  max_changed_lines: 350
  max_new_expects: 0
