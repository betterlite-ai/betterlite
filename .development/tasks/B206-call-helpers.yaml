deviations: []
out_of_scope:
- Cost calculations and reservation behavior are B068-B069; this part carries their typed optional metadata only.
- Python deep-copy of arbitrary object graphs and callable filtering are B166.
- max_retries_per_request_hit is B017; redact_nested_match_and_regex_keys is B104 guardrail compliance logging;
  is_codex_user_agent is B024 OpenAI client compatibility.
- get_proxy_server_request_headers from llm_request_utils.py is implemented here as a typed request-header projection;
  pick_cheapest_chat_models_from_llm_provider remains B019.
- Budget reservation helpers 369-406 and response cost setters 758-772 belong to B069; parent OpenTelemetry span
  extraction 429-450 is B110. remove_index_from_tool_calls, remove_items_at_indices, add_missing_spend_metadata_to_litellm_metadata,
  get_metadata_variable_name_from_kwargs, get_or_create_metadata_bucket, proxy_stamped_used_client_oauth_token,
  get_litellm_metadata_from_kwargs, reconstruct_model_name and response hidden-header accessors are built here as
  pure typed projections. safe_deep_copy,filter_exceptions_from_params,independent_snapshot,filter_internal_params
  belong to B2204 below provider and core callers; B166 owns Python wrapper object classification.
pitfalls:
- A typed source exception is retained inside Rust even when omitted from a serializable logging projection.
- Do not let a request set the proxy-stamped OAuth or budget reservation markers.
- Provider headers are broadly forwarded with prefixing; an allowlist would wrongly drop rate-limit and vendor metadata.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
