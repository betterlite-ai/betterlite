id: B206
title: Common call metadata and response helpers
description: >-
  Implement the common pure metadata/response helpers in betterlite-models/call_helpers using existing typed requests,
  errors and B198 context. Cover finish-reason normalization, checked token-limit coercion, expected-client-error
  classification, metadata bucket choice, trusted flags, model-name reconstruction, response header projection and
  B2204 independent snapshots. Preserve optional billing/provider fields for their future consumers without calculating
  costs or activating budget reservations. Reuse B2204 request-record projection for copying/filtering; Python object
  construction/classification convenience remains in B166. Add call_helpers helper cases for each pure operation
  and injection/isolation tests for internal fields, reusing the chat parser for external metadata.  Seed B171's
  shared helper_case corpus with every added operation and replay it through the common typed parser. process_response_headers
  forwards every provider header as llm_provider-<name>, keeps OPENAI_RESPONSE_HEADERS bare too, and preserves bare
  x-litellm-* only from a typed trusted internally-owned map. Raw upstream x-litellm-* are prefixed so they cannot
  spoof trusted markers. Apply B184 cookie/CORS security drops in both forms; keep all other provider headers. Include
  normalize_drop_params/drop_params_flag/drop_params_env_flag with config-resolved LITELLM_DROP_PARAMS (unset/blank
  false; malformed nonblank warns and true, unlike malformed request flags which warn and false), plus Decimal safe_divide/safe_divide_seconds
  preserving their zero/nonpositive-denominator defaults. No process environment read belongs here. Write the behavior
  rstest functions call_helpers_call_helper_tests_behavior in adjacent tests.rs files, with a named case for each behavior
  and failure in the DoD; corpus replay tests have separate names. Register helper operations call_helpers in tools/oracle/src/helpers/mod.rs
  and tools/oracle/helpers/dispatch.py; each operation has its own Rust and Python adapter file and corpus seed.
  Budget 310 pure helpers, 110 adapters, 260 tests and 90 config/replay wiring (770 total).


  These pure helpers live in betterlite-models alongside B175 metadata. Upper betterlite-core callers import this
  implementation; provider leaves never import betterlite-core for finish reasons or header projection. B198 remains
  a context-only leaf.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-models/Cargo.toml
  - crates/betterlite-models/src/lib.rs
  - crates/betterlite-models/src/error.rs
  - crates/betterlite-models/src/call_helpers.rs
  - crates/betterlite-models/src/call_helpers/**
  - crates/betterlite-openai/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/call-helpers/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-config/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/core_helpers.py#L54-L194
  why: Settings, arithmetic, expected failures and token-limit coercion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/core_helpers.py#L253-L425
  why: Finish reasons, metadata provenance and model reconstruction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/core_helpers.py#L453-L799
  why: Headers, snapshots and internal parameter filtering.
dod:
- text: Every listed pure helper matches pinned outputs, including overflow, finish reasons and metadata precedence.
  proof:
  - oracle
  - helper-python
- text: Snapshots are independent and trusted flags/internal headers cannot be forged; ordinary provider headers
    survive prefixing while B184 cookie/CORS exclusions hold.
  proof:
  - call-helper-tests
- text: Any added external metadata fields replay through the chat corpus.
  proof:
  - chat-request-corpus
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
- text: Injected LITELLM_DROP_PARAMS input has a new config corpus seed; malformed values use the source-specific
    warning fallback.
  proof:
  - config-yaml-corpus
  - call-helper-tests
checks:
  optional:
  - mutants
  commands:
  - id: call-helper-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::call_helpers_call_helper_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: chat-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'call_helpers' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-yaml-corpus
    why: the required new behavior or its evidence is missing
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'LITELLM_DROP_PARAMS' crates/betterlite-config/fuzz/corpus/config_yaml && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
