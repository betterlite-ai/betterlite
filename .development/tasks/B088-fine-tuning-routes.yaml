checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::fine_tuning_routes::/)
      - test(/::replays_corpus$/)'
  - id: case-fine-tuning-create-route
    why: the fine-tuning-create-route behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::fine_tuning_create_route($|::)/)'
  - id: case-fine-tuning-retrieve-route
    why: the fine-tuning-retrieve-route behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::fine_tuning_retrieve_route($|::)/)'
  - id: case-fine-tuning-list-route
    why: the fine-tuning-list-route behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::fine_tuning_list_route($|::)/)'
  - id: case-training-file-access-denied
    why: the training-file-access-denied behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::training_file_access_denied($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::route_aliases($|::)/)'
  - id: case-auth-missing
    why: the auth-missing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::auth_missing($|::)/)'
  - id: case-auth-invalid
    why: the auth-invalid behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::auth_invalid($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/fine_tuning_routes)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/fine_tuning_routes.rs && grep -qF "decode_fine_tuning_routes"
      crates/betterlite-server/fuzz/fuzz_targets/fine_tuning_routes.rs && cargo nextest run --locked -p betterlite-server
      --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::replays_corpus$/)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/fine-tuning-routes)"
