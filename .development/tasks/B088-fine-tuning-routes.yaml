id: B088
title: Fine-tuning create, retrieve and list HTTP routes
description: >-
  Register POST and GET /v1/fine_tuning/jobs and /fine_tuning/jobs, plus GET
  /v1/fine_tuning/jobs/{fine_tuning_job_id:path} and /fine_tuning/jobs/{fine_tuning_job_id:path} in
  server::api::fine_tuning_routes. Own all three complete handlers at endpoints.py:62-492. B003 authenticates,
  B004 supplies common pre-call, resolved-model execution and custom headers, B012 hooks/status work,
  B1021 managed-id validation, B1019 unified-id detection, B1141 finetune_settings lookup and B1052/B1053
  SDK execution. B2400 converts caught errors. Inject a typed resolved-model executor for Router calls;
  its catalog/credential services remain B302/B303, not a dependency on a later family composer.

  Remove premium_user checks under README Decisions, keeping other MIT branches. Create binds a
  LiteLLMFineTuningJobCreate request; decode_fine_tuning_create(bytes,ApiLimits) uses B518's job fields and
  the nullable openai/azure/vertex_ai provider plus allowed extra fields. Missing model/training_file is
  framework 422, not an SDK error. Add fine_tuning_create fuzz target/corpus for that actual decoder.
  GET retrieve uses B1100 raw JSON, recovering {} only on decode failure. List query defaults provider,
  target_model_names,after,limit to null. These 370 nonblank/non-comment lines share common services;
  allow 250 code, 200 tests, 190 HTTP fixtures and 100 decoder/wiring, 740 under 800.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/fine_tuning_routes.rs
  - crates/betterlite-server/src/api/fine_tuning_routes/**
  - crates/betterlite-server/fuzz/Cargo.toml
  - crates/betterlite-server/fuzz/fuzz_targets/fine_tuning_create.rs
  - crates/betterlite-server/fuzz/corpus/fine_tuning_create/**
  - tools/oracle/cases/api/fine-tuning-routes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/fine_tuning_endpoints/endpoints.py#L62-L492
  why: Three whole handlers expose all six paths and different body, query, managed-id and success-hook behavior.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L1118-L1160
  why: Create requires model/training_file, permits hyperparameter extras and defaults optional fields/provider to null.
dod:
- text: >-
    create_job_aliases_and_validation posts {model:gpt-4o-mini,training_file:file_train,custom_llm_provider:openai,
    hyperparameters:{n_epochs:2}} on both aliases with matching finetune_settings. Expect SDK POST and
    200 queued job ft_a. Request model_dump excludes null fields but retains seed=0,suffix="",integrations=[]
    and permitted extras. Config map overlays caller fields, including model. Missing model/training_file
    or provider=unknown is 422 detail validation with no error type/param/code and no pre-call/provider call.
    Non-managed file with missing/null provider yields 500,internal_server_error,param=null,code="500",
    source message="Invalid request, No litellm managed file id or custom_llm_provider provided.".
  proof: [route-tests, oracle, create-corpus, new-cases]
- text: >-
    create_managed_file_order validates training_file then validation_file after common pre-call.
    require_managed_files=true rejects raw training/validation id with 400,internal_server_error,param=null,
    code="400" and the B1021 message "Raw provider file ids cannot be used when require_managed_files is enabled in litellm_settings. Use the LiteLLM managed file id returned when the file was created.".
    Null validation_file is a no-op. A unified id without MIT ownership hook gives 500 with
    message="Managed resource ownership validation is unavailable.". Default false allows detection/routing;
    no router yields 500,internal_server_error,code="500",param=null with source detail
    {error:"LLM Router not initialized. Ensure models added to proxy."}. A scripted resolved-model success
    sets response.training_file and hidden unified_file_id to the decoded litellm_proxy:... string, not the
    incoming base64. The encoded training id takes precedence over custom_llm_provider routing.
  proof: [route-tests, oracle]
- text: >-
    retrieve_provider_body_over_query calls both id aliases with ?custom_llm_provider=openai and JSON
    {custom_llm_provider:azure}; body truthy azure selects its config. Empty/null body provider falls back
    to query. Invalid/empty JSON is ignored; valid [] or null fails .get with 500 internal_server_error,
    param=null,code="500". Query provider outside openai/azure is 422 before handler, while body string
    is not constrained by the query enum. No selected provider and native id yields 400,
    internal_server_error,param=null,code="400", message="Invalid request, No litellm managed file id or custom_llm_provider provided.".
    The path id is authoritative. A matching config overlays data; no match in [] calls SDK default openai.
    Unset finetune_settings gives 500 with "fine_tuning_config is not set, set it on your config.yaml file.".
  proof: [route-tests, oracle]
- text: >-
    retrieve_managed_job checks require_managed_files before common pre-call. Raw ft_a under true gives
    400 internal_server_error,param=null,code="400" and message="Raw provider fine-tuning job ids cannot be used when require_managed_files is enabled in litellm_settings. Use the LiteLLM managed fine-tuning job id returned when the fine-tuning job was created.".
    Unified id without checker gives 500 "Managed resource ownership validation is unavailable.". With
    requirement false and missing router, detected unified id gives the same router-missing 500 as create.
    A resolved-model success adds hidden unified_finetuning_job_id equal to decoded string but leaves
    public id unchanged. A slash-containing native job id is captured whole on both retrieve aliases.
  proof: [route-tests, oracle]
- text: >-
    list_target_model_and_pagination calls both list aliases with provider=openai,after=ft_prev,limit=7;
    SDK receives those values. No after/limit leaves both null rather than setting 20; 0 and empty after
    remain literal. Invalid limit text/query provider produces 422 detail. target_model_names=" a "
    routes model=" a " without trimming; "a,b" or "a," yields 400,internal_server_error,param=null,code="400",
    message="target_model_names on list fine-tuning jobs must be a list of one model name. Example: ['gpt-4o']".
    One target with no router gives 500 with "LLM Router not initialized. Ensure models added to proxy.".
    Empty target falls through to provider selection; absent both gives the invalid-request 400 above.
    The target-model path returns immediately and adds no route custom headers or success hook/status event.
  proof: [route-tests, oracle]
- text: >-
    tuning_route_hooks_and_errors proves create/retrieve replace a success-hook result only when it is
    a LiteLLMFineTuningJob, then enqueue status=success with call id or "". List never calls that success
    hook/status update. Non-early returns build B004 headers from hidden model_id/cache_key/api_base or ""
    and caller allowed_model_region or "". Caught errors invoke failure hook, log, then B2400: provider 404
    becomes 404,internal_server_error,param=null,code="404"; HTTPException 400 retains status but type is
    internal_server_error. Missing/invalid bearer on all six routes yields 401,authentication_error,
    param=null,code="401" before handler. Success response is application/json with source x-litellm-* headers.
  proof: [route-tests, oracle]
checks:
  optional: []
  commands:
  - id: route-tests
    why: a fine-tuning alias, source default or operation-specific hook path is absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::/) - test(/::replays_corpus$/)'
  - id: create-corpus
    why: typed fine-tuning request validation is not fuzzed through its production decoder
    run: test -f crates/betterlite-server/fuzz/fuzz_targets/fine_tuning_create.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/fine_tuning_create)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::fine_tuning_routes::tests::replays_corpus$/)'
  - id: new-cases
    why: create/retrieve/list lack new real HTTP comparisons
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/fine-tuning-routes)"
oracle_cases:
- tools/oracle/cases/api/fine-tuning-routes/create-job-aliases-and-validation.yaml
- tools/oracle/cases/api/fine-tuning-routes/create-managed-file-order.yaml
- tools/oracle/cases/api/fine-tuning-routes/retrieve-provider-body-over-query.yaml
- tools/oracle/cases/api/fine-tuning-routes/retrieve-managed-job.yaml
- tools/oracle/cases/api/fine-tuning-routes/list-target-model-and-pagination.yaml
- tools/oracle/cases/api/fine-tuning-routes/tuning-route-hooks-and-errors.yaml
deviations:
- what: >-
    betterlite permits authenticated fine-tuning without a license. Default MIT reference premium_user=false
    returns 500 internal_server_error,code="500" with "Only premium users can use this endpoint" instead.
  why: README Decisions removes paid-tier gates. Compare the remaining HTTP behavior with only the reference premium flag enabled and a separate default-license deviation case; never install enterprise code.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/fine_tuning_endpoints/endpoints.py#L117-L119
- what: Managed files/jobs retain MIT default raw-id handling and the explicit 400/500 require_managed_files errors in these cases.
  why: Max's managed-files/batches decision is still open; no ownership hook is fabricated.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/fine_tuning_endpoints/endpoints.py#L143-L178
out_of_scope:
- B1141 owns provider config helpers at 32-59; B1054 owns complete cancellation handler at 495-638.
- B1052/B1053 own SDK calls and B518 typed jobs; B1021 owns managed-id policy/config. Router model selection uses injected B004 execution backed by B302/B303, without owning a fragment of Router.factory_function.
pitfalls:
- Create's invalid-selector branch is a ValueError mapped to 500, while retrieve/list explicitly return HTTP 400.
- List target names are split on commas without trimming and return before custom response headers.
- Managed create returns a decoded training-file string, not the incoming encoded id.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
