dod:
  - text: CustomCodeGuardrailError and CustomCodeCompilationError are exception types with message and optional details dict.
    proof: [custom-code-error-types]
  - text: CustomCodeGuardrailConfigModel loads custom_code string and optional timeout (default 30 seconds, must be positive).
    proof: [custom-code-config-tests]
  - text: CustomCodeGuardrail.__init__ validates timeout, initializes a compile lock and calls _compile_custom_code.
    proof: [custom-code-init-tests]
  - text: _compile_custom_code compiles the user code once using compile_sandboxed and build_sandbox_globals, caches the bytecode, and raises CustomCodeCompilationError on syntax/runtime errors.
    proof: [custom-code-compilation-tests]
  - text: >-
      apply_guardrail prepares safe request_data (extracting model, user_id, team_id, end_user_id and metadata),
      calls _call_compiled, and processes the result to allow/block/flag/modify.
      Example: block("reason") raises HTTPException with status 400.
    proof: [custom-code-apply-tests]
  - text: >-
      _call_compiled dispatches sync functions to call_with_timeout and async functions to await_with_timeout
      or call_off_loop_with_timeout, managing the execution deadline.
    proof: [custom-code-dispatch-tests]
  - text: _prepare_safe_request_data returns only model, user_id, team_id, end_user_id and metadata; sensitive fields are excluded.
    proof: [custom-code-metadata-tests]
  - text: >-
      _process_result handles allow (return inputs unchanged), block (raise HTTPException with detection_info),
      flag (log guardrail_flagged and return inputs unchanged), modify (return modified inputs with texts/images/tool_calls).
      Unknown action defaults to allow, non-dict result logs a warning and returns inputs unchanged.
    proof: [custom-code-result-tests]
  - text: >-
      apply_guardrail logs timeout as CustomCodeExecutionError and execution exceptions as CustomCodeExecutionError.
      Example: timeout after 30 seconds logs the guardrail_name and remaining timeout.
    proof: [custom-code-error-handling-tests]
  - text: get_supported_event_hooks returns pre_call, during_call, post_call, pre_mcp_call, during_mcp_call and logging_only.
    proof: [custom-code-event-hooks-tests]
  - text: get_config_model returns CustomCodeGuardrailConfigModel.
    proof: [custom-code-config-model-tests]
  - text: initialize_guardrail raises ValueError with message "Custom code guardrail requires a guardrail_name" when guardrail_name is missing.
    proof: [custom-code-init-validation-name-tests]
  - text: initialize_guardrail raises ValueError with message "Custom code guardrail requires 'custom_code' in litellm_params" when custom_code is missing.
    proof: [custom-code-init-validation-code-tests]
  - text: initialize_guardrail instantiates CustomCodeGuardrail with litellm_params.custom_code and registers it via add_litellm_callback.
    proof: [custom-code-init-guardrail-tests]
  - text: >-
      RESPONSE_REJECTION_CODE is a Python-like string constant that checks response input_type,
      lowercases response texts, and returns block() when a response text contains a rejection phrase
      (case-insensitive substring match). Default phrases include "i can't help with that" and similar.
    proof: [response-rejection-program-tests]
