oracle_cases: []
deviations:
  - what: Execution timeout defaults to 30 seconds when not set; LiteLLM has the same default.
    why: Custom guardrail code must not stall the proxy; 30 seconds matches LiteLLM's user-facing default.
  - what: apply_guardrail converts ExecutionTimeoutError to CustomCodeExecutionError with the timeout value and guardrail name.
    why: Timeout is a user-facing error condition; preserving the timeout helps diagnose slow custom code.
  - what: _prepare_safe_request_data extracts only model, user_id, team_id, end_user_id and a metadata dict; other request fields are excluded.
    why: Custom guardrail code is untrusted; redacting sensitive request fields (api_keys, auth headers) prevents credential leakage.
  - what: Block with input_type=request raises passthrough exception for synthetic response; input_type=response raises HTTP 400.
    why: Pre-call blocks return an HTTP response without calling the LLM; post-call blocks reject the response as-is.
  - what: Unknown result actions (not allow/block/flag/modify) default to allow() with a warning log.
    why: Unexpected user code results should not stall or crash; allowing through with a log preserves availability.
  - what: Compilation errors raise CustomCodeCompilationError instead of CustomCodeExecutionError; compilation is startup-time validation.
    why: Guardrail routes at startup must fail immediately if the code has syntax errors, not silently skip the guardrail.
out_of_scope:
  - "update_custom_code (custom_code_guardrail.py:479-519): no caller at the pin."
  - "B3802 owns compile_sandboxed, build_sandbox_globals, call_with_timeout, call_off_loop_with_timeout and await_with_timeout."
  - "B189 owns add_litellm_callback and callback manager registration."
  - "Request/response type contracts and guardrail framework base class (CustomGuardrail.__init__, log_guardrail_information decorator, raise_passthrough_exception)."
  - "HTTP exception raising and status code selection; betterlite-core provides response construction."
pitfalls:
  - Compilation happens inside the __init__ lock; a reentrant call to _compile_custom_code from module-level code will deadlock. Keep module-level code simple.
  - _call_compiled checks if the result is a coroutine after calling sync functions; a sync function returning an awaitable crashes the guardrail. Document that sync functions must not return coroutines.
  - Timeout applies to both compilation (load_module) and execution (apply_guardrail); if compilation takes >30 seconds, the guardrail fails at startup, not per-request.
  - _prepare_safe_request_data returns a plain dict, not a MappingProxyType or frozen struct; custom code can modify it in place, but changes do not propagate back to the original request.
  - Rejection phrase matching is case-insensitive substring match (text.lower().contains(phrase)), not regex or exact match; partial matches count (e.g., "no help" matches "no help with it").
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
