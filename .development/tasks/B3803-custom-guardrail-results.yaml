id: B3803
title: Custom guardrail results and rejection detection
description: >-
  Build custom-code invocation, result processing and the response-rejection guardrail program.
  The main guardrail entry point calls the compiled apply_guardrail function and processes its result:
  allow() passes the inputs through; block() raises an HTTP exception; flag() logs a non-blocking violation;
  modify() transforms the texts, images or tool_calls and returns modified inputs.
  Preserve the 30-second execution timeout default, metadata projection from request_data
  (user_id, team_id, end_user_id from metadata.litellm_metadata), and compilation caching via a write lock.
  Include the live response-rejection program for checking response text against rejection phrases.
  The policy endpoint (not a dependency: it is a caller) instantiates this guardrail with the program.
scope:
  paths:
  - crates/betterlite-guardrails/src/custom_code.rs
  - crates/betterlite-guardrails/src/custom_code/**
  lint_tables: false
