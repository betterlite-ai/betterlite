dod:
- text: Write tests named galileo_payload_construction and galileo_timestamp_handling under
    galileo_payloads::tests. The first asserts correct message normalization, trace/span structure,
    and token metric aggregation for all listed cases. The second asserts UTC conversion from naive
    datetimes in both standard_logging_object and start_time/end_time fallback paths.
  proof:
  - galileo-payload-tests
  - galileo-timestamp-tests
- text: Every listed oracle case exercises content extraction and asserts exact selected input/output
    text, message structure and node type across response families. Content markers (embeddings-output,
    speech-output) and serialized tool calls must match the source exactly.
  proof:
  - oracle
- text: Message normalization preserves role and concatenates multi-part content. Timestamp
    normalization appends Z when the source string lacks timezone suffix and converts naive
    datetimes to local time before UTC conversion.
  proof:
  - galileo-payload-tests
  - galileo-timestamp-tests
- text: Token metrics handle missing fields with zero and compute totals when total is missing.
    Cost is preserved when present; embedding and speech responses return content markers; tool
    calls remain JSON strings.
  proof:
  - galileo-payload-tests
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any
    or broad suppressions.
  proof:
  - probe-python
  - oracle
