out_of_scope:
- Galileo authentication and health checking (B3964).
- Galileo trace delivery and queue management (B3964).
- Callback record admission control and buffering (B3965).
- Timer installation and flush scheduling.
- Providers other than those listed above.
pitfalls:
- >-
  Naive datetimes without tzinfo are assumed to be in local time, not UTC. Convert to local tzinfo
  before calling astimezone(timezone.utc), not after.
- >-
  The message normalization fallback to [{"role": "user", "content": input_text}] triggers on any
  falsy messages value, including empty list [], None, or missing messages; empty message lists are
  not preserved and are replaced by the fallback.
- >-
  Tool calls in response content must remain as serialized JSON strings, not be decomposed or
  rewritten as typed records.
- >-
  Timestamp normalization must handle ISO 8601 variants with offset notation (±HH:MM) and Z suffix;
  strings without timezone suffix are assumed to be lacking timezone info and need Z appended.
- >-
  Token metric extraction must compute total_tokens from sum when total is zero but individual counts
  are present; cost may be None and must not be included in the metrics dict if missing.
- >-
  The embeddings and speech families return literal marker strings ("embedding-output", "speech-output")
  instead of attempting to serialize binary data or vector fields.
review_level: standard
budget:
