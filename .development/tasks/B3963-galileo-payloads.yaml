id: B3963
title: Galileo response projection and trace payloads
description: >-
  Build Galileo's typed record, trace/span projection, UTC timestamp handling and content selection
  across response families. Implement pure functions for message normalization, timestamp formatting
  in ISO 8601 UTC format, token metric extraction, trace/span envelope construction and response
  content selection across chat, text completion, embedding, image, transcription, rerank and
  responses API families. Keep this layer pure apart from injected clock/UUID inputs so delivery
  (B3964) and admission control (B3965) can both call it. The LLMResponse typed record carries
  latency milliseconds, status code, input/output text, node type, model, token counts, cost,
  optional logprobs and user-supplied tags/metadata. Naive datetimes from kwargs.standard_logging_object
  use local timezone before conversion to UTC; fallback timestamps from start_time/end_time parameters
  are converted to UTC if they lack timezone info. The _get_galileo_input_output_content function
  is the content selection entry point, handling call_type and response_obj type dispatch to extract
  input text, output text and input message structure suitable for both record projection and B3965's
  admission control. Embeddings and speech produce markers instead of vectors/binary data. Tool calls
  remain serialized JSON strings, not decomposed tool-call records. Token metrics compute totals from
  per-token counts and preserve cost when available.
