id: B818
title: Prevent resource grant escalation by keys
description: >-
  Implement ResourceDelegation over team permissions and canonical MCP IDs, including all-proxy-MCP administrator
  grants, grandfathered existing key grants, access groups/toolsets and vector/search tool scopes. Run
  before key or team permission writes; caller-requested grant sets cannot override parent restrictions.


  Build the production resource_delegation module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/object_permission_utils.py:
  enforce_all_proxy_mcp_servers_grant_is_admin_only (L498-L528; 29 source lines), _get_grandfathered_key_mcp_server_ids
  (L531-L558; 28 source lines), _get_team_allowed_mcp_servers (L561-L599; 34 source lines), _extract_requested_mcp_server_ids
  (L602-L625; 20 source lines), _extract_requested_mcp_access_groups (L628-L638; 10 source lines), _extract_requested_mcp_toolsets
  (L641-L651; 10 source lines), validate_key_mcp_servers_against_team (L654-L794; 120 source lines), _validate_requested_toolsets
  (L797-L839; 42 source lines), _extract_requested_vector_stores (L842-L851; 10 source lines), validate_key_vector_stores_against_team
  (L854-L879; 26 source lines), _extract_requested_search_tools (L882-L891; 10 source lines), validate_key_search_tools_against_team
  (L894-L941; 43 source lines).


  Add the resource_delegation operation under B856 Management::models. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a resource-delegation-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 382 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  382 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 628 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
