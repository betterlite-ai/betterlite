id: B818
title: Prevent resource grant escalation by keys
description: >-
  Implement resource-grant validation with B816 permission records, B817 MCP resolution and B747 unified
  access-group MCP lookup. Helpers raise HTTPException with detail.error, status 403 and no local
  type/param/code override; each calling route owns its wire mapping. None writes the database. Defaults
  are prisma_client=null, is_proxy_admin=false and existing_key_object_permission=null. The all-proxy
  team grant guard returns immediately for proxy admins or requests without "all-proxy-mcpservers";
  otherwise permit only an already-stored sentinel. A falsey existing ID/missing DB/row cannot grandfather
  it and gives 403 "Only a proxy admin can grant a team access to all proxy MCP servers
  ('all-proxy-mcpservers').". Native all_proxy_new_vs_stored and all_proxy_admin_short_circuit cover this.

  Extract requested servers from list mcp_servers (discard only "no-mcp-servers") plus dict tool-map
  keys. Groups/toolsets require lists; missing, empty, non-dict outer records and wrong-shaped fields
  yield empty sets. If all three are empty, return the same object without DB/registry work. For a team,
  union B747 unified group resources, retaining unresolved names, with B817's object-permission grants;
  a missing team grants nothing. Add B817 allow_all_keys registry IDs. Resolve requested aliases to every
  matching canonical ID; warn once with sorted stale identifiers and remove them from the mutable input
  before authorization. Preserve the original resolving aliases via B817 cleanup. A teamless proxy admin
  may choose any resolved server; an admin with a team still obeys its ceiling. Cases empty_grants_no_io,
  unified_and_direct_team_grants, stale_warning_mutates_before_denial and personal_vs_team_admin distinguish
  these branches.

  Grandfather only canonical IDs resolved from the old key's direct mcp_servers and tool-map keys,
  excluding both sentinel literals. Missing old permission or DB returns an empty set; unresolved names
  grandfather nothing and old access groups/toolsets contribute nothing. Use B817's stored tool JSON
  decoder (including malformed/non-map errors) without another parser. Subtract allowed and grandfathered
  IDs from active requested IDs. Team denial says "Key requests MCP servers not allowed by team
  '<team_id>': <sorted>. Team allows: <sorted>. Global (allow_all_keys) servers: <sorted>."; personal
  denial says "Key is not in a team. Only globally available (allow_all_keys) MCP servers can be assigned:
  <sorted>. Disallowed servers: <sorted>.". Native grandfather_resolved_only and mcp_denial_messages
  include a shrinking team allowlist and aliases shared by allowed/disallowed servers.

  Check groups after servers and toolsets last. MCP access groups must be a subset of the TEAM'S
  object_permission.mcp_access_groups, not its unified access_group_ids. Only a teamless admin bypasses
  that restriction; groups are never grandfathered. Team error is "Key requests MCP access groups not
  allowed by team '<id>': <sorted>. Team allows: <sorted>."; personal error is "Key is not in a team.
  MCP access groups cannot be assigned to keys outside of a team. Disallowed groups: <sorted>.".
  Toolsets: empty requests pass, teamless admins pass, other personal callers get "Key is not in a team.
  MCP toolsets cannot be assigned to personal keys by non-admin callers. Disallowed toolsets: <sorted>.".
  A team's absent/null/empty toolset allowlist is UNRESTRICTED; a nonempty list enforces subset even for
  proxy admins, with "Key requests MCP toolsets not allowed by team '<id>': <sorted>. Team allows:
  <sorted>.". Cases group_source_not_unified, group_not_grandfathered, server_group_toolset_error_order
  and toolset_empty_ceiling_vs_subset cover these literal/error distinctions.

  Vector-store extraction takes truthy list entries, stringifies and deduplicates them. Empty requests,
  any team key and proxy admins pass; there is no team vector-store subset check. Personal non-admin
  denial is "Key is not in a team. Vector stores cannot be assigned to personal keys by non-admin callers.
  Disallowed vector stores: <sorted>.". Search-tool extraction stringifies truthy list entries but keeps
  duplicates; a personal non-admin gets "Key is not in a team. search_tools cannot be assigned to personal
  keys by non-admin callers. Disallowed search tools: <sorted requested list>.". A missing/empty team search
  allowlist permits any names; a nonempty ceiling uses set difference and raises "Key requests search
  tools not allowed by team '<id>': <sorted disallowed>. Team allows: <sorted team list>.". Cases
  extractor_falsey_shapes, vector_personal_gate_only, search_personal_duplicates and search_nonempty_ceiling
  are pure parity tests. No toolset existence check, premium branch or configuration is added.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/object_permission_utils.py:
  enforce_all_proxy_mcp_servers_grant_is_admin_only (L498-L528; 29 source lines), _get_grandfathered_key_mcp_server_ids
  (L531-L558; 28 source lines), _get_team_allowed_mcp_servers (L561-L599; 34 source lines), _extract_requested_mcp_server_ids
  (L602-L625; 20 source lines), _extract_requested_mcp_access_groups (L628-L638; 10 source lines), _extract_requested_mcp_toolsets
  (L641-L651; 10 source lines), validate_key_mcp_servers_against_team (L654-L794; 120 source lines), _validate_requested_toolsets
  (L797-L839; 42 source lines), _extract_requested_vector_stores (L842-L851; 10 source lines), validate_key_vector_stores_against_team
  (L854-L879; 26 source lines), _extract_requested_search_tools (L882-L891; 10 source lines), validate_key_search_tools_against_team
  (L894-L941; 43 source lines).


  The B856 helper operation exposes only the pure extractors, toolset check and vector/search validators
  (the latter are async without I/O). Compare 403 details and input preservation with B171 seeds. Native
  MCP tests inject the registry and use real Postgres via POSTGRES_TEST_URL, falling back to B860
  testcontainers only when absent; connection errors fail. Do not call global-dependent resolvers from
  the Python helper. This task registers no endpoint; callers own HTTP integration.


  Sizing: 382 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  300 production (source count includes long docstrings), 370 behavior/Postgres tests, 70 helper adapters,
  30 route/manifests/wiring, 0 decoder/fuzz and 0 config lines, 770 within an 800-line gate.
