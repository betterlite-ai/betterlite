deviations: []
out_of_scope:
- >-
  bedrock.rs itself. The classifier already gives LiteLLM's answer for every input above, so no product
  code changes. A new row that fails on today's code is a classifier bug to report as a blocker, not
  something to patch around in tests.rs.
- >-
  The SageMaker mapper in sagemaker.rs, its tests and the branch-1046 to branch-1133 cases. The review
  found no gap there.
- >-
  The fixed status per error class. B5102 already merged it, so response_branches_answer_the_provider_status
  and bedrock-access-denied-status.yaml stay as they are.
- >-
  Padded one-line functions. They belong to B5094, and this task doesn't touch the legacy lists under
  .ast-grep/rules/.
pitfalls:
- >-
  A compare.ignore pointer that hits no field fails the case with "compare.ignore points to no field", so
  branch-882.yaml drops its /value/result/message ignore once its answer is null, and branch-863.yaml keeps
  ignore: [].
- >-
  RateLimit and Timeout nest the shared fields under context, so bedrock-lowercase-throttling.yaml and
  bedrock-read-timed-out.yaml ignore /value/result/context/message; every other new case ignores
  /value/result/message.
- >-
  "ThrottlingException" does not contain "throttlingException", since the match is case-sensitive, so the
  lowercase_throttling_rate_limit row must spell it with a lowercase t and carry no capitalized copy.
- >-
  Each needle row must hold only its own needle. "Too many input tokens" does not contain "too many
  tokens" (capital T, and the word input in between), and none of the four strings may add another
  needle, or deleting its own needle would leave the row green.
- >-
  Only bedrock and bedrock_mantle reach _map_bedrock_exception at the pin, so the literal-provider rows use
  bedrock_mantle, not an invented provider. Their error_str must not contain invalid_request_error or
  validation_error, or the Mantle block could answer first.
- >-
  rstest names each row case_<position>_<name>, and inserting rows shifts the positions, so every filter
  matches case_[0-9]+_ before the row name.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
