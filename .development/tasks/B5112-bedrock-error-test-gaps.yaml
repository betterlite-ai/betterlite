  why: The Mantle message helper, whose keyword guard returns None before the token-count regex runs (gap six).
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L882-L904
  why: The Mantle block, gated on custom_llm_provider == "bedrock_mantle" and run before the elif chain, then the six context-window needles (gaps one, four and seven).
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L926-L963
  why: The authentication, rate limit and timeout OR predicates and the image branch with its getattr default of 500 (gaps two and three).
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L964-L992
  why: The 500, 401, 400 and 404 status branches. They hard-code llm_provider="bedrock" like every text branch above them (gap five).
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2516-L2525
  why: The dispatcher sends both bedrock and bedrock_mantle into _map_bedrock_exception, so bedrock_mantle is the caller that tells the literal provider apart (gap five).
dod:
- text: >-
    Rows context_window_input_is_too_long, context_window_prompt_is_too_long,
    context_window_prompt_length_range and context_window_too_many_input_tokens, and the cases
    bedrock-input-is-too-long.yaml, bedrock-prompt-is-too-long.yaml, bedrock-prompt-length-range.yaml and
    bedrock-too-many-input-tokens.yaml, each send one needle with bedrock_mantle and no status and expect
    context_window_exceeded with provider bedrock. None of them exists on today's main, so
    context-window-needles fails there. Once they exist, deleting any of the four needles from
    CONTEXT_WINDOW_NEEDLES turns its row and case red.
  proof: [context-window-needles, bedrock-tests, oracle]
- text: >-
    Rows security_token_invalid_auth, lowercase_throttling_rate_limit and read_timed_out_timeout, and the
    cases bedrock-security-token-invalid.yaml, bedrock-lowercase-throttling.yaml and
    bedrock-read-timed-out.yaml, send only the second string of their OR predicate and expect
    authentication, rate_limit and timeout (original status 408) with provider bedrock. None exists on
    today's main, so second-alternatives fails there. Once they exist, deleting that second string from
    TEXT_CANDIDATES turns its row and case red.
  proof: [second-alternatives, bedrock-tests, oracle]
- text: >-
    Row could_not_process_image_explicit_500_status and case bedrock-image-status-500.yaml send "Could not
    process image data" with status 500 and expect internal_server with provider bedrock. Neither exists
    on today's main, so image-status-500 fails there. Once they exist, an image check rewritten as
    status_code.is_none() gives service_unavailable and turns both red.
  proof: [image-status-500, bedrock-tests, oracle]
- text: >-
    Row mantle_match_wins_over_chain_needle and case bedrock-mantle-before-chain.yaml send a Mantle
    token-count error that also holds "prompt is too long" and expect context_window_exceeded with
    provider bedrock_mantle. Neither exists on today's main, so mantle-before-chain fails there. Once they
    exist, running classify_by_predicate before mantle_classification reports provider bedrock and turns
    both red.
  proof: [mantle-before-chain, bedrock-tests, oracle]
- text: >-
    The thirteen literal-provider rows and cases named in gap five send custom_llm_provider bedrock_mantle
    and still expect provider bedrock. On today's main they send bedrock and pass even when Provider::Literal
    returns the caller's value, and literal-provider-cases fails there. After the change, that swap turns
    them red.
  proof: [literal-provider-cases, bedrock-tests, oracle]
- text: >-
    Row branch_863_mantle_guard_rejects_bare_token_message and branch-863.yaml send "prompt tokens (500)
    exceed model maximum (400)" with bedrock_mantle and no status and expect no class. Today's
    branch_863_mantle_guard_neither_keyword row and branch-863.yaml send "an unrelated failure" and pass
    with the keyword guard deleted, and mantle-keyword-guard fails there. After the change, deleting that
    guard gives context_window_exceeded and turns both red.
  proof: [mantle-keyword-guard, bedrock-tests, oracle]
- text: >-
    Row branch_882_bedrock_provider_skips_mantle_match and branch-882.yaml send custom_llm_provider bedrock
    with "invalid_request_error: prompt tokens (500) exceed model maximum (400)" and no status and expect
    no class. Today's branch_882_non_mantle_provider_skips_mantle_block row and branch-882.yaml send "too
    many tokens were supplied" and pass with the provider check deleted, and mantle-provider-guard fails
    there. After the change, deleting that check gives context_window_exceeded and turns both red.
  proof: [mantle-provider-guard, bedrock-tests, oracle]
checks:
  optional: [mutants]
  commands:
  - id: bedrock-tests
    why: the bedrock rows were not touched, or a changed row or one of the other bedrock tests fails
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-error/src/aws_errors/bedrock/tests.rs)"
      && cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^aws_errors::bedrock::tests::/)'
  - id: context-window-needles
    why: the four untested context-window needles still have no row or case
    run: >-
      test "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
      tools/oracle/cases/helpers/aws-errors/bedrock-input-is-too-long.yaml
      tools/oracle/cases/helpers/aws-errors/bedrock-prompt-is-too-long.yaml
      tools/oracle/cases/helpers/aws-errors/bedrock-prompt-length-range.yaml
      tools/oracle/cases/helpers/aws-errors/bedrock-too-many-input-tokens.yaml | wc -l)" -eq 4
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^aws_errors::bedrock::tests::aws_errors_behavior_tests_behavior::case_[0-9]+_context_window_(input_is_too_long|prompt_is_too_long|prompt_length_range|too_many_input_tokens)$/)'
  - id: second-alternatives
    why: the second strings of the authentication, rate limit and timeout predicates still have no row or case
    run: >-
      test "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
      tools/oracle/cases/helpers/aws-errors/bedrock-security-token-invalid.yaml
      tools/oracle/cases/helpers/aws-errors/bedrock-lowercase-throttling.yaml
      tools/oracle/cases/helpers/aws-errors/bedrock-read-timed-out.yaml | wc -l)" -eq 3
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^aws_errors::bedrock::tests::aws_errors_behavior_tests_behavior::case_[0-9]+_(security_token_invalid_auth|lowercase_throttling_rate_limit|read_timed_out_timeout)$/)'
  - id: image-status-500
    why: the image branch with an explicit status 500 still has no row or case
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/aws-errors/bedrock-image-status-500.yaml)"
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^aws_errors::bedrock::tests::aws_errors_behavior_tests_behavior::case_[0-9]+_could_not_process_image_explicit_500_status$/)'
  - id: mantle-before-chain
    why: no row or case matches both the Mantle block and a chain needle
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/aws-errors/bedrock-mantle-before-chain.yaml)"
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^aws_errors::bedrock::tests::aws_errors_behavior_tests_behavior::case_[0-9]+_mantle_match_wins_over_chain_needle$/)'
  - id: literal-provider-cases
    why: a literal-provider case still sends custom_llm_provider bedrock, so it can't tell the literal from the caller's value
    run: >-
      test -z "$(grep -L 'custom_llm_provider: bedrock_mantle$'
      tools/oracle/cases/helpers/aws-errors/branch-891.yaml
      tools/oracle/cases/helpers/aws-errors/branch-905.yaml
      tools/oracle/cases/helpers/aws-errors/branch-912.yaml
      tools/oracle/cases/helpers/aws-errors/branch-919.yaml
      tools/oracle/cases/helpers/aws-errors/branch-926.yaml
      tools/oracle/cases/helpers/aws-errors/branch-936.yaml
      tools/oracle/cases/helpers/aws-errors/branch-943.yaml
      tools/oracle/cases/helpers/aws-errors/branch-950.yaml
      tools/oracle/cases/helpers/aws-errors/branch-957.yaml
      tools/oracle/cases/helpers/aws-errors/branch-965.yaml
      tools/oracle/cases/helpers/aws-errors/branch-972.yaml
      tools/oracle/cases/helpers/aws-errors/branch-979.yaml
      tools/oracle/cases/helpers/aws-errors/branch-986.yaml)"
  - id: mantle-keyword-guard
    why: the branch-863 row and case still send a string the Mantle regex misses anyway
    run: >-
      grep -qF 'error_str: "prompt tokens (500) exceed model maximum (400)"' tools/oracle/cases/helpers/aws-errors/branch-863.yaml
      && grep -q 'custom_llm_provider: bedrock_mantle$' tools/oracle/cases/helpers/aws-errors/branch-863.yaml
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^aws_errors::bedrock::tests::aws_errors_behavior_tests_behavior::case_[0-9]+_branch_863_mantle_guard_rejects_bare_token_message$/)'
  - id: mantle-provider-guard
    why: the branch-882 row and case still send a string the Mantle matcher misses anyway
    run: >-
      grep -qF 'error_str: "invalid_request_error: prompt tokens (500) exceed model maximum (400)"' tools/oracle/cases/helpers/aws-errors/branch-882.yaml
      && grep -q 'custom_llm_provider: bedrock$' tools/oracle/cases/helpers/aws-errors/branch-882.yaml
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^aws_errors::bedrock::tests::aws_errors_behavior_tests_behavior::case_[0-9]+_branch_882_bedrock_provider_skips_mantle_match$/)'
