id: B5112
title: Close the B239 Bedrock error test gaps
description: >-
  B239 ported LiteLLM's _map_bedrock_exception as map_bedrock_exception in
  crates/betterlite-error/src/aws_errors/bedrock.rs. It is tested by the aws_errors_behavior_tests_behavior
  rstest function in crates/betterlite-error/src/aws_errors/bedrock/tests.rs and by helper cases in
  tools/oracle/cases/helpers/aws-errors/ that call the aws_errors operation. An Opus review after merge
  found seven places where a branch has no test or a test can't fail. In all seven the classifier
  already gives LiteLLM's answer, so this task changes only that tests.rs and those case files, and
  bedrock.rs stays as it is. Each new row uses the function's five columns (custom_llm_provider,
  error_str, status_code, expected family, expected provider). Each new case copies its neighbours:
  provider bedrock under aws_errors, model claude-3, env {} and the name aws-errors-<file stem>.


  Gap one. LiteLLM raises ContextWindowExceededError with llm_provider "bedrock" for six needles
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L891-L904).
  Only "too many tokens" (rows branch_882 and branch_891) and "expected maxLength:" (branch-891.yaml)
  are tested, so deleting "Input is too long", "prompt is too long", "prompt: length: 1.." or "Too many
  input tokens" from CONTEXT_WINDOW_NEEDLES keeps every test and case green. Add one row and one case
  per needle: context_window_input_is_too_long with "Input is too long for requested model.",
  context_window_prompt_is_too_long with "prompt is too long: 210000 tokens > 200000 maximum",
  context_window_prompt_length_range with "prompt: length: 1..200000" and
  context_window_too_many_input_tokens with "Too many input tokens. Max input tokens: 8192". Each sends
  custom_llm_provider bedrock_mantle and no status and expects context_window_exceeded with provider
  bedrock. The cases are bedrock-input-is-too-long.yaml, bedrock-prompt-is-too-long.yaml,
  bedrock-prompt-length-range.yaml and bedrock-too-many-input-tokens.yaml.


  Gap two. Three OR predicates have a second string with no test. LiteLLM sends "The security token
  included in the request is invalid" to AuthenticationError
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L926-L935),
  lowercase "throttlingException" to RateLimitError
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L943-L949)
  and "timed out" to Timeout with status 408
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L950-L956),
  each with llm_provider "bedrock". Deleting the second string of any of the three from TEXT_CANDIDATES
  passes today. Add rows security_token_invalid_auth ("The security token included in the request is
  invalid."), lowercase_throttling_rate_limit ("throttlingException: rate exceeded") and
  read_timed_out_timeout ("Read timed out. (read timeout=600)"). Each sends bedrock_mantle and no status
  and expects authentication, rate_limit and timeout in that order, all with provider bedrock. The cases
  are bedrock-security-token-invalid.yaml, bedrock-lowercase-throttling.yaml and
  bedrock-read-timed-out.yaml.


  Gap three. LiteLLM's image branch compares getattr(original_exception, "status_code", 500) with 500
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L957-L963),
  so an explicit status 500 still gives InternalServerError with provider bedrock. The rows cover only
  no status (branch_957) and 503, so writing that check in classify_by_predicate as
  status_code.is_none() passes. A client whose error carries an explicit 500 would then get
  ServiceUnavailable from the status fallback. Add row could_not_process_image_explicit_500_status
  (bedrock_mantle, "Could not process image data", Some(500)) expecting internal_server with provider
  bedrock, and case bedrock-image-status-500.yaml with status_code 500.


  Gap four. LiteLLM raises the Mantle ContextWindowExceededError, with llm_provider set to the caller's
  bedrock_mantle, before the elif chain runs
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L882-L891).
  No row matches both, so swapping mantle_classification and classify_by_predicate in
  map_bedrock_exception passes, and a Mantle error that also holds a chain needle would then report
  provider bedrock. Add row mantle_match_wins_over_chain_needle (bedrock_mantle, "invalid_request_error:
  prompt tokens (500) exceed model maximum (400); prompt is too long", no status) expecting
  context_window_exceeded with provider bedrock_mantle, and case bedrock-mantle-before-chain.yaml.


  Gap five. Every text branch, the image branch and the 500, 401, 400 and 404 status branches hard-code
  llm_provider="bedrock"
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L899-L992),
  and LiteLLM's dispatcher sends both bedrock and bedrock_mantle into this function
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2516-L2525).
  Every row and case that reaches one of those branches sends custom_llm_provider bedrock, the same
  string as the literal. So bedrock_context could return input.custom_llm_provider for Provider::Literal
  and nothing would fail, while a Mantle client would see provider bedrock_mantle where LiteLLM says
  bedrock. These can't fail today: rows branch_891_context_window_text,
  branch_905_conversation_tool_blocks, branch_912_malformed_input,
  branch_919_conversation_must_start_user, branch_926_credentials_auth, branch_936_access_denied,
  branch_943_throttling, branch_950_connect_timeout, branch_957_image_processing_default_status,
  branch_965_status_500, branch_972_status_401, branch_979_status_400 and branch_986_status_404, and the
  cases branch-891, branch-905, branch-912, branch-919, branch-926, branch-936, branch-943, branch-950,
  branch-957, branch-965, branch-972, branch-979 and branch-986. Each switches custom_llm_provider to
  bedrock_mantle and keeps expecting provider bedrock. The new rows and cases of gaps one to three send
  bedrock_mantle for the same reason.


  Gap six. _get_bedrock_mantle_context_window_message returns None before its regex runs when error_str
  holds neither "invalid_request_error" nor "validation_error"
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L857-L869).
  Row branch_863_mantle_guard_neither_keyword and branch-863.yaml send "an unrelated failure", and the
  regex misses that too. So deleting the keyword check in mantle_context_window_matches still returns
  None, and both still pass. Rename the row to branch_863_mantle_guard_rejects_bare_token_message and
  give it error_str "prompt tokens (500) exceed model maximum (400)" with bedrock_mantle and no status,
  still expecting no class. branch-863.yaml takes the same error_str.


  Gap seven. LiteLLM runs the Mantle block only when custom_llm_provider is "bedrock_mantle"
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L882-L890).
  Row branch_882_non_mantle_provider_skips_mantle_block and branch-882.yaml send bedrock with "too many
  tokens were supplied". The Mantle matcher misses that string anyway, so deleting the provider check in
  mantle_classification still passes. Rename the row to branch_882_bedrock_provider_skips_mantle_match
  with custom_llm_provider bedrock, error_str "invalid_request_error: prompt tokens (500) exceed model
  maximum (400)" and no status, expecting no class: LiteLLM skips the Mantle block, and no chain needle
  or status matches after it. branch-882.yaml takes the same input and drops its /value/result/message
  ignore, since the answer is null.
