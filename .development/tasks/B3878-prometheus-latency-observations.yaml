id: B3878
title: Prometheus latency and guardrail observations
description: >-
  Port the PrometheusLogger code that turns one finished request into latency histogram samples, and the code that records guardrail time and counts.
  Everything goes in crates/betterlite-logging/src/prometheus_latency.rs. It takes typed inputs and writes through the collector handles B3874 builds, the label factory B3873 supplies and the end-user series cap B3876 supplies. It reads no config itself.

  Request latency, from _set_latency_metrics. The inputs are the request start_time, end_time, api_call_start_time and completion_start_time (each optional), the stream flag, the optional queue_time_seconds from litellm_params.metadata, and an optional input_sequence_length bucket string.
  A timestamp that is missing gives no duration. safe_duration_seconds(start, end) returns Some(seconds) only when both exist, and may be negative.
  When end_time is absent, use the current time from the injected clock. Never read the system clock inside the module.
  Four histograms follow. litellm_llm_api_time_to_first_token_metric gets api_call_start_time to completion_start_time, only when the stream flag is exactly true. For a non-stream request write one debug log line instead.
  litellm_llm_api_latency_metric gets api_call_start_time to end_time.
  litellm_request_total_latency_metric gets start_time to end_time, plus queue_time_seconds when it is present and 0 or more.
  litellm_request_queue_time_seconds gets queue_time_seconds when it is present and 0 or more.
  Each sample goes through prometheus_label_factory with the metric's own label list from get_labels_for_metric, then through the end-user series cap (B3876) with the same labels.
  When an input_sequence_length is given, the first three histograms use a copy of the label values with input_sequence_length set, and a fresh label context built from that copy, so the end-user cache is not shared. The queue time histogram always uses the original values and the original context.

  Input length bucket, from _get_input_sequence_length. It returns one of the bucket strings of B3870's get_input_sequence_length_bucket ("0-1k", "1k-4k", "4k-16k", "16k-64k", "64k+", "unknown"). Take typed inputs: the payload prompt_tokens, whether a combined usage object exists, the total_tokens of the upstream reported usage object, whether the response carries a usage value, the usage_object mapping from payload metadata (absent or a mapping with an optional prompt_tokens), and, for a response given as a JSON object, the prompt_tokens of its usage after B254's get_usage_as_dict normalization. Apply these steps in this order and stop at the first that returns.
  1. prompt_tokens is nonzero: bucket of prompt_tokens.
  2. A combined usage object exists and the upstream reported usage has a total_tokens: "unknown".
  3. The response has no usage value and there is no combined usage object: "unknown".
  4. The metadata usage_object is a mapping: bucket of its prompt_tokens.
  5. No combined usage object and the response is a JSON object: bucket of the normalized usage prompt_tokens.
  6. Otherwise bucket of prompt_tokens (0 gives "0-1k", absent gives "unknown").

  Guardrail overhead, from _guardrail_is_additive, _get_guardrail_overhead_seconds and _set_overhead_with_guardrails_metric. The additive modes are pre_call and post_call only. A guardrail counts when it has at least one mode and every mode it carries is pre_call or post_call. The mode field is one value or a list. Items that are not plain mode names (a GuardrailMode object with tags) are ignored, so a record whose only mode is such an object is not additive, and a list of pre_call plus such an object is additive. during_call, logging_only and the MCP modes never count.
  The overhead is the sum of duration over additive records, with a missing duration as 0. A payload may carry guardrail_information as a list or as a single record; a single record counts as a list of one.
  litellm_overhead_with_guardrails_latency_metric gets (litellm_overhead_time_ms / 1000) + guardrail seconds, with a missing overhead as 0. Skip the sample only when the overhead is absent and the guardrail seconds are 0 or less. An overhead of exactly 0 with guardrail time still records.

  Guardrail series, from _record_guardrail_metrics. Take guardrail_name, latency_seconds, status ("success", "error" or "intervened"), optional error_type and hook_type. Observe litellm_guardrail_latency_seconds with labels guardrail_name, status, error_type (the text "none" when error_type is absent or empty) and hook_type. Increment litellm_guardrail_requests_total with guardrail_name, status, hook_type. Only when status is "error" and error_type is nonempty, increment litellm_guardrail_errors_total with guardrail_name, error_type, hook_type. These three use fixed label lists and bypass the label factory and the end-user cap. Any failure inside (for example a collector that rejects labels) is caught, logged at debug as "Error recording guardrail metrics", and never returned to the caller. The first failure skips the metrics after it.

  Tests live under prometheus_latency/tests/ with the module names guardrail_overhead, input_sequence_length, latency_histograms and guardrail_series. Add oracle helper cases for the pure functions: guardrail overhead seconds, the input length bucket, and safe_duration_seconds.
scope:
  paths:
    - crates/betterlite-logging/src/prometheus_latency.rs
    - crates/betterlite-logging/src/prometheus_latency/**
    - tools/oracle/cases/prometheus/latency-guardrail-overhead-modes.yaml
    - tools/oracle/cases/prometheus/latency-guardrail-overhead-single-record.yaml
    - tools/oracle/cases/prometheus/latency-input-length-prompt-tokens.yaml
    - tools/oracle/cases/prometheus/latency-input-length-combined-usage.yaml
    - tools/oracle/cases/prometheus/latency-input-length-metadata-usage.yaml
    - tools/oracle/cases/prometheus/latency-safe-duration.yaml
    - tools/oracle/helpers/b3878.py
    - tools/oracle/helpers/b3878/**
    - tools/oracle/src/helpers/logging/b3878.rs
    - tools/oracle/src/helpers/logging/b3878/**
  lint_tables: false
