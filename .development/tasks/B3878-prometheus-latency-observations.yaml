dod:
  - text: safe_duration_seconds returns Some only when both timestamps exist, returns a negative value unchanged, and returns None when either is missing.
    proof: [latency-histogram-tests, latency-oracle-cases]
  - text: A streaming request with api_call_start_time and completion_start_time observes litellm_llm_api_time_to_first_token_metric once; a request whose stream flag is not true, or that lacks either timestamp, observes nothing there.
    proof: [latency-histogram-tests]
  - text: litellm_llm_api_latency_metric is observed with end_time minus api_call_start_time, and not observed when api_call_start_time is missing.
    proof: [latency-histogram-tests]
  - text: litellm_request_total_latency_metric is observed with end_time minus start_time, plus queue_time_seconds when it is 0 or more, and queue_time_seconds below 0 is left out of both the total and the queue histogram.
    proof: [latency-histogram-tests]
  - text: litellm_request_queue_time_seconds is observed with queue_time_seconds when it is present and 0 or more.
    proof: [latency-histogram-tests]
  - text: With an input_sequence_length, the first three histograms carry that label value and the queue time histogram uses the original label values; without one, none of them is changed.
    proof: [latency-histogram-tests]
  - text: When end_time is absent the injected clock supplies it, and a test with a fixed clock sees the result.
    proof: [latency-histogram-tests]
  - text: Each latency sample calls the end-user series cap after observing, with the labels used for the sample.
    proof: [latency-histogram-tests]
  - text: The input length bucket follows the six steps in order, including nonzero prompt_tokens first, "unknown" for a combined usage with upstream total_tokens, and prompt_tokens 0 falling to "0-1k".
    proof: [input-length-tests, latency-oracle-cases]
  - text: A guardrail with modes pre_call and post_call is additive; one with during_call, logging_only or an MCP mode, or a mixed list such as pre_call plus during_call, is not; a record with no mode is not.
    proof: [guardrail-overhead-tests, latency-oracle-cases]
  - text: A GuardrailMode-style mode item is ignored, so a record whose only mode is such an item is not additive and a list of pre_call plus such an item is additive.
    proof: [guardrail-overhead-tests, latency-oracle-cases]
  - text: Guardrail overhead sums duration over additive records only, treats a missing duration as 0, and accepts a single record as a list of one.
    proof: [guardrail-overhead-tests, latency-oracle-cases]
  - text: litellm_overhead_with_guardrails_latency_metric observes overhead_ms / 1000 plus guardrail seconds, records for an overhead of 0 with guardrail time, and records nothing when the overhead is absent and guardrail seconds are 0 or less.
    proof: [guardrail-overhead-tests]
  - text: record_guardrail_metrics observes the latency histogram, increments the request counter, and increments the error counter only for status "error" with a nonempty error_type; an absent or empty error_type labels the histogram with "none".
    proof: [guardrail-series-tests]
  - text: record_guardrail_metrics never returns an error when a collector rejects the labels, logs at debug, and does not touch the metrics after the failing one.
    proof: [guardrail-series-tests]
  - text: Oracle helper cases for the overhead, the input length bucket and the duration run against LiteLLM and betterlite with equal output.
    proof: [latency-oracle-cases]
checks:
  optional: []
  commands:
    - id: latency-histogram-tests
      why: the four latency histograms, label switch or clock fallback are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_latency::latency_histograms::/)'
    - id: input-length-tests
      why: the input length bucket choice is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_latency::input_sequence_length::/)'
    - id: guardrail-overhead-tests
      why: the guardrail overhead sum or the overhead-with-guardrails histogram is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_latency::guardrail_overhead::/)'
    - id: guardrail-series-tests
      why: the guardrail latency, request and error series are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_latency::guardrail_series::/)'
    - id: latency-oracle-cases
      why: the oracle helper cases for the pure functions are missing or differ from LiteLLM
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/prometheus/latency-guardrail-overhead-modes.yaml tools/oracle/cases/prometheus/latency-input-length-prompt-tokens.yaml)" && cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/prometheus
oracle_cases:
  - tools/oracle/cases/prometheus/latency-guardrail-overhead-modes.yaml
  - tools/oracle/cases/prometheus/latency-guardrail-overhead-single-record.yaml
  - tools/oracle/cases/prometheus/latency-input-length-prompt-tokens.yaml
  - tools/oracle/cases/prometheus/latency-input-length-combined-usage.yaml
  - tools/oracle/cases/prometheus/latency-input-length-metadata-usage.yaml
  - tools/oracle/cases/prometheus/latency-safe-duration.yaml
deviations:
  - what: Timestamps are one typed instant, so LiteLLM's mixed naive and timezone-aware datetime subtraction (a TypeError that the whole success hook swallows) cannot occur.
    why: Python only fails there because datetimes carry two kinds; the typed payload from B254 has one.
  - what: The current time used when end_time is absent comes from an injected clock.
    why: Tests need a fixed time and the project forbids hidden clock reads.
out_of_scope:
  - "async_log_success_event and the order in which it calls these functions, and the output-token, spend and cache counters; B3877 owns them."
  - "The plain litellm_overhead_latency_metric observation and the call to set_overhead_with_guardrails_metric inside set_llm_deployment_success_metrics; B3881 owns that method and calls this task's function."
  - "ProxyLogging._emit_guardrail_metrics and _run_guardrail_with_metrics in litellm/proxy/utils.py, which call record_guardrail_metrics and decide status, error_type and hook_type; B786 owns them."
  - "Creating the latency, overhead and guardrail histograms and counters with their buckets and label lists, and the _ExcludedLabelMetric wrapper; B3874 and B3875."
  - "prometheus_label_factory, PrometheusLabelFactoryContext and the end-user series cap; B3873 and B3876."
  - "get_input_sequence_length_bucket and the bucket table; B3870. get_usage_as_dict and the guardrail_information record type; B254."
  - "The budget reset hours helper _get_remaining_hours_for_budget_reset; B3882 and B3884 own it, it is not a latency function."
  - "Reading prometheus_emit_input_sequence_length_label; B3874 owns the setting and B3877 decides when to pass the bucket in."
pitfalls:
  - "The queue time histogram is built from the original label values, not the copy with input_sequence_length, so it never carries that label even when the others do."
  - "total latency adds queue_time_seconds to start_time-to-end_time because the request clock starts after auth; a negative queue time is dropped from both the total and the queue histogram, not clamped to 0."
  - "Time to first token needs stream to be exactly true; a stream flag of null or a missing key takes the debug-log branch."
  - "A GuardrailMode object in guardrail_mode is not a string, so it is skipped when collecting modes; an all-skipped list leaves an empty set, which is not additive."
  - "A mixed mode list such as [pre_call, during_call] is not additive because every mode must be in the allowed set."
  - "The overhead-with-guardrails sample is skipped only when the overhead is absent and guardrail seconds are not above 0; an overhead of 0.0 is present and still records."
  - "Step 1 of the bucket choice tests prompt_tokens for being nonzero, so 0 does not return there and can reach step 6 as the \"0-1k\" bucket."
  - "The guardrail latency histogram labels error_type with the text \"none\" for absent or empty, but the error counter is incremented only for a nonempty error_type."
  - "The three guardrail series use their own fixed label lists, so excluding a label with prometheus_exclude_labels must not change the labels passed here; a rejected label set is the failure the debug log hides."
  - "record_guardrail_metrics is the only function here that swallows errors; the latency functions return their errors to the caller, which is the success hook that already catches them."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
