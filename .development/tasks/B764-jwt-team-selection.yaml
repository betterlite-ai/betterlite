id: B764
title: Select an authorized JWT team and request header
description: >-
  Implement JwtTeamSelection using verified claims, agent lookup, team/model grants and trusted selected-team
  headers. Team candidates are a set, so do not invent stable ordering between equally eligible teams.
  A header outside the claims may select a provisional DB team; B891 performs the later membership check.


  Build the production jwt_team_selection module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTAuthManager.resolve_agent_id (L1499-L1520; 22 source lines), JWTAuthManager.find_and_validate_specific_team_id
  (L1523-L1620; 83 source lines), JWTAuthManager.get_all_team_ids (L1623-L1629; 5 source lines), JWTAuthManager._team_has_passthrough_route_access
  (L1632-L1653; 18 source lines), JWTAuthManager._raise_team_passthrough_route_denial (L1656-L1663; 8
  source lines), JWTAuthManager.find_team_with_model_access (L1666-L1750; 75 source lines), JWTAuthManager.validate_object_id
  (L1890-L1902; 13 source lines), JWTAuthManager._team_header_value (L1905-L1909; 5 source lines), JWTAuthManager._raise_header_team_not_allowed
  (L1912-L1919; 8 source lines), JWTAuthManager._team_id_by_alias (L1922-L1943; 22 source lines), JWTAuthManager.resolve_team_from_header
  (L1946-L2006; 57 source lines), JWTAuthManager._raise_header_team_membership_denial (L2358-L2371; 14
  source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.team_id_jwt_field=None;
  litellm_jwtauth.team_id_upsert=False; litellm_jwtauth.team_allowed_routes=['openai_routes', 'info_routes',
  'mcp_routes', '/v1/messages', '/v1/messages/count_tokens']; litellm_jwtauth.team_alias_jwt_field=None;
  litellm_jwtauth.agent_id_jwt_field=None; litellm_jwtauth.enforce_team_based_model_access=False; litellm_jwtauth.team_claim_fallback=False;
  litellm_jwtauth.fallback_to_db_teams=False.

  Also consume B760's team_id_default=None and team_ids_jwt_field=None, and enforce_rbac=False
  for validate_object_id. Use B737 team/alias lookup, B742 route expansion, B886 can_team_access_model,
  B871 team_model_aliases, B883 pass-through grants, B761 AgentLookup and B869 HeaderTeam.
  Move the two-line has_legacy_identity predicate from agent_endpoints/identity.py L11-L12 into
  this leaf: the B141 registry depends on auth and cannot be called in reverse. It tests presence
  of the identity key even when its value is null. Registry reads are injected through AgentLookup.

  agent_absent, agent_id_before_name, agent_unknown, agent_managed, agent_identity_present and
  agent_legacy_null prove missing claims return None and all bound/unknown agents fail HTTP 403.
  team_id_before_alias, alias_before_default, explicit_upsert_override and claim_404_fallback
  check the ID/alias precedence and that only HTTP 404 with team_claim_fallback yields (None,None);
  claim_non404_propagates covers other errors. required_team_missing, dot_index_hint and
  bracket_index_hint cover the plain missing-team exception and operator hints (HTTP 401).
  group_set_deduplicates proves get_all_team_ids only includes plural groups, despite its docstring.

  no_groups_enforced gives 403 only when enforce_team_based_model_access and not fallback_to_db_teams.
  candidate_lookup_swallowed continues on every exception; candidate_models_null skips that team;
  candidate_no_model still checks routes. candidate_model_alias and candidate_model_grant call the
  real B886 grant service. all_unresolved_fallback returns None only with team_claim_fallback;
  resolved_model_denied gives 403 even with fallback enabled. pass_through_method_upper,
  pass_through_config_grant, pass_through_metadata_grant and pass_through_denial_priority prove
  method normalization, team-only metadata and the pass-through 403 taking precedence over model denial.

  header_missing_empty and header_casefold check x-litellm-team-id; explicit_team_header performs
  no DB query. alias_header and alias_ambiguous_denied resolve only unique aliases among allowed IDs.
  provisional_id_disables_upsert, absent_id_tries_alias, id_read_error_membership_denial,
  alias_no_db, alias_client_error_denied and alias_server_error_propagates preserve the different
  ID and alias failure handling. The membership-denial message must not reveal a resolved team ID;
  the claim-denial message lists sorted allowed IDs. object_identity_required is 403 only for
  enforced non-admin RBAC with neither user nor team. B757 maps HTTP exceptions to auth_error,
  param 'None', code equal to the status string; only message wording is ignored by HTTP comparison.


  Add the jwt_team_selection operation under B856 Management::jwt for header normalization,
  object validation and agent projection only. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-team-selection-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  All team lookup, candidate and provisional-header cases run through HTTP/Postgres; find_team_with_model_access
  reads proxy_server.llm_router and must not be invoked by a helper adapter. Database fixtures use
  POSTGRES_TEST_URL or testcontainers and fail rather than skip when neither can start.

  Write betterlite-config::jwt_team_selection::tests::loads_settings, defaults_and_precedence and invalid_type_rejected.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: the twelve original ranges total 330 source lines before excluding docstrings, plus two
  lines for has_legacy_identity. Allow 300 production, 300 parameterized behavior/Postgres tests,
  65 helper adapters, 65 wiring and 50 config lines: 780 changed lines within an 800-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::jwt_team_selection::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
