id: B382
title: Request-scoped routing read batches
description: 'Implement RoutingReadBatch and RoutingPrefetch ownership over B360 typed batch reads. Merge
  cooldown and usage key sets, settle or roll back reservations on cancellation, backfill local cache
  and consume each result once per request. Keep this service independent of selector implementations
  by passing typed key groups. Implement the owned native service in crates/betterlite-router/src/routing_read_batch.rs.
  Add ProbeOperation::RoutingReadBatch in tools/oracle/src/router_probes/mod.rs and the corresponding B382 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_utils/routing_read_batch.py: _backfill_prefetched_cache
  (L35-L49), RoutingPrefetch.release (L62-L66), RoutingPrefetch._settle (L68-L82), RoutingPrefetch.arm
  (L85-L122), RoutingPrefetch.armed (L125-L127), RoutingPrefetch.take (L130-L140), RoutingReadBatch.__init__
  (L149-L151), RoutingReadBatch.scoped (L155-L160), RoutingReadBatch.active (L163-L164), RoutingReadBatch.for_strategy
  (L167-L173), RoutingReadBatch.async_get_cooldown_deployments (L175-L210), RoutingReadBatch._read_prefetched
  (L213-L235). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
