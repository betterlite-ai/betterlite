id: B047
title: Connect speech and transcription providers to native and HTTP calls
description: >-
  Compose B1540-B1551 in core api::speech_providers over B010/B174 and the prepared speech and
  transcription seams B1084/B1082. ElevenLabs/Deepgram use the generic HTTP transcription contract;
  ElevenLabs/Polly implement speech; Riva invokes its gRPC SDK service; Soniox runs the resource-aware
  pipeline. Expose B1542's common listen metadata service for B094's future passthrough consumer
  without mounting that route here. Existing lower provider crates receive contracts and identities,
  never an import of betterlite-core.

  Own SonioxAudioTranscriptionHandler.audio_transcriptions at 111-172. Choose its default config
  only when none/falsey is supplied, use async only for atranscription exactly true, retain the client
  only when its mode matches, and normalize falsey headers to empty. max_retries is accepted but
  ignored: a provider 429 during this pipeline surfaces after one attempt unless the existing router
  retries the whole operation. Register call.speech_provider_dispatch for source-backed native cases
  soniox_sync_client, soniox_async_client and ignored_max_retries, stubbing only the pipeline seam.

  Load missing Riva environment projections in betterlite-config, reusing any existing B002 fields:
  NVIDIA_RIVA_API_BASE, NVIDIA_RIVA_API_KEY and NVIDIA_NIM_API_KEY all default unset. Explicit truthy
  base wins, otherwise NVIDIA_RIVA_API_BASE; no public endpoint is invented. Explicit truthy key wins,
  then NVIDIA_RIVA_API_KEY, then NVIDIA_NIM_API_KEY. riva_dispatch_settings loads these keys and checks
  precedence. Forward Soniox, ElevenLabs, Deepgram and AWS resolved settings from their owners.

  Reuse B083's route registrations for POST /v1/audio/speech, /audio/speech, /v1/audio/transcriptions
  and /audio/transcriptions. Booted-proxy cases cover each supported provider on both aliases,
  ElevenLabs voice query and multipart language, Polly signed-body/format behavior, Deepgram raw
  audio/diarization, Riva final-only recognition and missing endpoint, Soniox upload/fetch/cleanup,
  SRT/VTT/text/verbose results, upstream 401/429 and proxy authentication before provider effects.
  Assert actual status, error.type/param/code, response media type/headers and provider request fields.
  HTTP transcription still requires the file form field at this pin; native Soniox file_id/audio_url
  support does not relax that route requirement. Use B900 for multipart comparisons.

  For HTTP Riva fixtures, preload a test-only module through B165's existing callback loading seam
  in both proxies. Replace only external riva-client Auth/ASRService/protobuf constructors, capture
  their arguments through the oracle mock endpoint, and return deterministic SDK results; retain
  actual gateway routing, audio decoding and provider code. This needs no production mock switch.
  Check that Python fixture and the dispatch helper with ruff/basedpyright. Test speech_providers in
  core/server and the named config loader. The remaining owned source is 54 dispatch lines plus
  docstring-only package initializers; allow 190 composition/config, 230 tests, 220 HTTP/helper
  fixtures and 90 SDK fixture lines under an 800-line cap. All parsers remain with their leaf tasks.
