dod:
  - text: Supported speech/transcription providers run through both existing aliases with correct payloads, response formats and authentication.
    proof: [speech-provider-tests, oracle, speech-provider-python]
  - text: Soniox mode/client selection and unused retries, plus loaded Riva credential precedence, remain source-compatible.
    proof: [speech-provider-tests, oracle, speech-provider-python]
checks:
  optional: [mutants]
  commands:
    - id: speech-provider-tests
      why: provider composition, booted route cases or Riva environment loading are missing
      run: uv run --locked --project tools/oracle/litellm cargo nextest run --locked -p betterlite-core -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(/speech_providers::/) | test(riva_dispatch_settings)'
    - id: speech-provider-python
      why: native dispatch helper or booted Riva SDK fixture is absent or unchecked
      run: grep -qE '^[[:space:]]+speech_provider_dispatch:' tools/oracle/fuzz/corpus/helper_case/speech_provider_dispatch* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/speech_provider_dispatch.py tools/oracle/fixtures/speech/riva_sdk.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json tools/oracle/fixtures/speech/riva_sdk.py
