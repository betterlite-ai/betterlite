id: B535
title: Azure image HTTP execution and operation polling
description: >-
  Provide AzureImageTransport for the direct HTTP image branches and asynchronous operation responses, with an injected
  polling clock. Load AZURE_OPERATION_POLLING_TIMEOUT=120 seconds through config, preserve retry-after with a 10-second
  fallback and terminal response/errors. Only configured provider origin may supply followed operation paths; never
  accept a request URL as a destination.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.make_async_azure_httpx_request
  L845-L971; AzureChatCompletion.make_sync_azure_httpx_request L973-L1088. litellm/llms/azure/image_generation/http_utils.py:
  azure_deployment_image_generation_json_body L6-L30.


  Reuse B009 assert_same_origin for operation-location; the pin already returns 502 for a foreign origin. Poll until
  AZURE_OPERATION_POLLING_TIMEOUT, without a second caller-deadline cutoff in this loop. Missing operation-location
  returns 500, missing status 502, polling timeout 408, failed operation 400 with the provider error body; non-integer
  retry-after raises ValueError.


  Implement crates/betterlite-azure/src/image_transport.rs with adjacent tests under image_transport/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_image_transport in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_transport_cases in betterlite-azure with these exact named cases (one per oracle file):
  image_immediate_result, operation_location_poll, retry_after_poll, failed_operation, missing_operation_location,
  poll_deadline, poll_default_timeout_120, retry_after_default_10, foreign_operation_origin_rejected, same_origin_502,
  missing_operation_location_500, missing_status_502, polling_timeout_408, failed_operation_400, retry_after_not_integer.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_image_transport* using HelperCase: kind:
  helper and the externally tagged azure_image_transport variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_image_transport that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_image_operation consumes polling operation response bytes in crates/betterlite-azure/src/image_transport.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_image_transport.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_image_transport.
  The adjacent test replays_the_azure_image_transport_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/image_transport.rs
  and its loader wiring: AZURE_OPERATION_POLLING_TIMEOUT. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest azure_image_transport_config_cases
  with named cases loads_azure_operation_polling_timeout, plus rejects_unrelated_key. Each loads case calls the
  real config loader with that key and asserts the resolved value, default, precedence and secret redaction where
  applicable. Seed B002 config_yaml with new azure_image_transport* files for every key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_image_transport_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_image_transport_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 233 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 217 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 28 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 695 planned, 700 maximum changed lines.
