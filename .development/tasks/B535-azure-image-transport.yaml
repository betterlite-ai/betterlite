pitfalls:
- 'The oracle helper for this task is pre-registered as azure_image_transport in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/image_transport.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_image_transport.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The timeout clock starts after the first operation GET and uses >, not >=, so a terminal result is not rejected
  by the loop deadline.
- Only the initial poll explicitly guards a missing status; applying that 502 guard to every iteration would change
  later failures.
- The preview branch mutates data by popping model, while the direct deployment-body helper returns a new mapping
  only when it rewrites model.
