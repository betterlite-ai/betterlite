id: B706
title: Postgres migrations for policy resources
description: >-
  Supply the 32 scoped SQL migrations from baseline_diff through health_check_latest_per_model_index
  after B705's identity-history checkpoint. Copy bytes unchanged and register full directory names in
  order, retaining separate entries when their timestamp prefixes are equal. This task owns immutable
  SQL and schema_policy_resources regression tests. B873 alone deploys files, handles the concurrent
  index and writes the ledger; B716 owns recovery. No new migration executor belongs here.

  DailyGuardrailMetrics/DailyPolicyMetrics use composite primary keys (guardrail_id/date or policy_id/
  date), four required BIGINT counters requests_evaluated/passed_count/blocked_count/flagged_count
  default 0, nullable DOUBLE PRECISION avg_score/avg_latency_ms, required created_at now and updated_at
  without default. Each has entity/date lookup indexes. SpendLogGuardrailIndex has required
  (request_id,guardrail_id) primary key/start_time, nullable policy_id, and guardrail_id+start_time and
  policy_id+start_time indexes. Replace six daily-spend entity-only indexes with (entity,date) indexes
  for agent/end-user/organization/tag/team/user, retaining their other indexes and data. Ensure nullable
  VerificationToken.project_id exists without repairing or inventing a missing foreign key.

  Policy versioning drops unique policy_name, adds required is_latest=true/version_number=1/
  version_status='production', nullable parent_version_id/production_at/published_at, an ordinary
  (policy_name,version_status) index and unique (policy_name,version_number). Existing rows become
  production version 1; multiple versions may both be is_latest=true because SQL adds no unique latest
  constraint. ManagedObject.batch_processed is required false; SpendLogs.request_duration_ms is
  nullable INTEGER. MCP spec_path is added, then dropped (losing data), then re-added empty/nullable.
  Keep all three historical steps, even though the final column name matches the first.

  ToolTable requires TEXT tool_id/name, unique name, call_policy='untrusted', INTEGER call_count=0,
  nullable assignments JSONB {}, origin/key_hash/team_id/key_alias/actors and both timestamps now.
  Index call_policy/team_id. Later rename call_policy to input_policy preserving values, add required
  output_policy='untrusted', nullable user_agent/last_used_at, drop the old policy index and add input/
  output policy indexes. Its rename guard is not schema-qualified. ObjectPermission.blocked_tools and
  later models/mcp_toolsets are nullable TEXT arrays default []. SpendLogToolIndex uses composite
  (request_id,tool_name), required start_time and (tool_name,start_time) index, with no inferred foreign
  key to logs. Agents gain nullable object_permission_id with delete SET NULL/update CASCADE, and
  live/deleted keys gain nullable agent_id without a new foreign key.

  ClaudeCodePluginTable requires TEXT id/name and enabled=true; name is unique. Nullable version/
  description/manifest_json/files_json/created_by are TEXT, files_json defaults the string '{}', and
  nullable created_at/updated_at default now. It is not a JSONB files column. Add SpendLogs
  (startTime,request_id) index. MCP available_on_public_internet changes its default to true without
  updating existing false rows. Guardrails gain required status='active', nullable reviewed_at/
  submitted_at and a status index. Agents gain spend=0, nullable static_headers JSONB {}, extra_headers
  TEXT[] [], and nullable INTEGER tpm_limit/rpm_limit/session_tpm_limit/session_rpm_limit.

  MCP BYOK fields are nullable byok_api_key_help_url, byok_description TEXT[] [], tool_name_to_description/
  tool_name_to_display_name JSONB {}, and required is_byok=false. MCPUserCredentials requires TEXT
  id/user_id/server_id/credential_b64, both timestamps now, and unique (user_id,server_id); SQL neither
  decodes nor encrypts credential_b64 and creates no user/server foreign keys. JWTKeyMapping requires
  id/jwt_claim_name/jwt_claim_value/token, is_active=true and timestamp defaults now, with nullable
  description/actors; index claim name/value/active and uniquely constrain name/value independently
  of active. Its token foreign key deletes RESTRICT and updates CASCADE. ConfigOverrides requires TEXT
  config_type primary key, JSONB config_value, created_at now and updated_at without default.

  MCP approval_status is nullable TEXT default 'active'; submitted_by/submitted_at/reviewed_at/
  review_notes/source_url are nullable, with an approval_status index. The later restore migration
  repeats IF NOT EXISTS additions and leaves existing values untouched. Team gains organization_id,
  team_alias and created_at indexes. MCPToolset requires toolset_id/unique toolset_name, JSONB tools
  default [], timestamp defaults now, nullable description/actors. Prompt environment is required
  TEXT default 'development', created_by nullable; replace (prompt_id,version) uniqueness with
  (prompt_id,version,environment) plus a (prompt_id,environment) index. Its unguarded ADD COLUMN and
  CREATE INDEX statements make replay fail, rather than repair an already applied migration.

  Live keys/teams gain nullable budget_limits JSONB. Budget.allowed_models and Team.default_team_member_models
  are nullable TEXT arrays default []; MCP instructions is nullable TEXT. The final health index is
  exactly one CREATE INDEX CONCURRENTLY IF NOT EXISTS statement on (model_id,model_name,checked_at DESC).
  A focused SQL test runs it outside a transaction and inspects validity and descending order; running
  it inside an explicit transaction must fail with active_sql_transaction 25001. B873 owns recovery of
  an interrupted/invalid concurrent index, so no atomic rollback is promised here.


  Execute reference/candidate histories in B860's separate temporary databases using POSTGRES_TEST_URL
  or testcontainers when absent. B700 supplies query sessions; unavailable Postgres fails tests and
  cleanup runs after errors. Keep direct column/type/default/nullability and full index/FK comparisons,
  with named historical data checks below. There are 234 nonblank, noncomment SQL lines, but copying
  exact bytes costs 418 production lines. Budget 330 tests and 30 registrations, 778 within 800. The
  SQL-data task has no new runtime config parser, byte decoder or HTTP helper.
