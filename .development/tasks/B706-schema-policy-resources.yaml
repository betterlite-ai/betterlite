dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: pinned_sql_checksums,
      cohort_catalog_facts, cohort_preserves_rows, postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_policy_resources::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/schema_policy_resources::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/schema_policy_resources::tests::postgres_failure_effects$/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - The migration directory name is part of the Prisma ledger identity and cannot be renamed.
  - A checksum test compares SQL bytes with the pinned source, not with a checksum generated from the
    candidate itself.
budget:
  max_changed_lines: 525
  max_new_expects: 0
review_level: standard
