  - text: pinned_sql_checksums validates all 32 files and distinct full identities with equal timestamps; postgres_catalog compares all owned defaults, column/constraint facts and index ordering independently.
    proof: [behavior-tests, postgres-tests]
  - text: 'postgres_policy_history covers guardrail_policy_metric_zero_counters_and_nullable_averages,
      spend_guardrail_index_pairs, six_entity_date_indexes, project_column_only_repair,
      policy_default_production_version_one, multiple_versions_same_latest_allowed,
      policy_version_duplicate_rejected, managed_batch_processed_false,
      nullable_request_duration and spec_path_add_drop_readd_loses_old_values.'
    proof: [postgres-tests]
  - text: 'postgres_tool_agent_fields covers untrusted_policy_and_zero_count,
      rename_input_policy_preserves_value, output_untrusted_and_policy_indexes,
      tool_rename_guard_other_schema_failure, blocked_tools_and_model_arrays,
      spend_tool_composite_key, agent_permission_set_null_and_key_agent_nullable,
      plugin_text_files_and_enabled_true, spend_time_request_index,
      public_internet_default_true_existing_false_unchanged, guardrail_active_status_index,
      agent_zero_spend_headers_and_four_integer_limits.'
    proof: [postgres-tests]
  - text: 'postgres_mcp_and_prompt_fields covers byok_false_and_empty_metadata,
      mcp_user_credential_raw_text_unique_pair, jwt_mapping_active_default_and_unique_claim_pair,
      jwt_token_delete_restrict_update_cascade, config_override_required_json_and_updated_at,
      approval_fields_restore_preserves_values, team_lookup_indexes, toolset_empty_tools_unique_name,
      prompt_development_backfill, prompt_environment_distinct_versions,
      prompt_environment_repeat_42701, nullable_budget_limits,
      member_allowed_models_empty_defaults and nullable_mcp_instructions.'
    proof: [postgres-tests]
  - text: postgres_concurrent_health_index checks a single outside-transaction statement, checked_at_descending_and_valid and explicit_transaction_error_25001 without invoking the B873 runner.
    proof: [postgres-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_policy_resources::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Policy/tool/MCP schema history or concurrent-index SQL behavior differs from the pinned migration.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_policy_resources::tests::postgres_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B705 supplies the preceding schema, B707-B709 later cohorts and B701 final schema checks.
  - B873 owns concurrent-index deployment, invalid-index recovery and migration ledger effects; B716 owns locks/recovery decisions.
  - B136 and agent credential persistence own secret transforms; this task preserves SQL column contents and does not decode credential_b64 or headers.
  - B087 owns the managed-batch runtime hook decision; adding batch_processed=false does not install that hook.
pitfalls:
  - MCP spec_path returns later in the cohort, but its old values were destroyed by the intervening DROP.
  - SET DEFAULT true changes new MCP rows without rewriting existing available_on_public_internet=false.
  - Policy is_latest=true is not uniquely constrained, and plugin files_json is TEXT despite its JSON-looking default.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
