id: B706
title: Postgres migrations for policy resources
description: >-
  Preserve this exact ordered cohort of pinned migration.sql files as production SQL under crates/betterlite-db/migrations
  with original directory names and content checksums. Add the cohort to MigrationCatalog without rewriting
  earlier checksums or collapsing historical migrations. Verify execution against an empty schema for
  the baseline or the immediately preceding historical checkpoint for later cohorts; compare pg_catalog
  facts against an independently applied copy of upstream SQL. Preserve data through every ALTER and compare
  pg_catalog against a separately applied copy of the pinned SQL. This task owns data plus focused migration
  regression cases, not the recovery algorithm. This cohort includes the explicitly nontransactional concurrent
  health-check index migration: retain its single statement, execute it outside a transaction and verify
  the existing ledger/recovery semantics rather than promising rollback of concurrent DDL.


  This cohort supplies immutable SQL data and a catalog registration only; it does not create a SchemaBaseline
  service. Verify each migration.sql byte checksum against the pinned file, then execute this cohort on
  the prior checkpoint and compare catalog facts and preserved rows. B716 owns deploy ledger checksums
  and restart-skips-applied tests, so this data task never depends on the deploy runner.


  Build the production schema_policy_resources module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 339 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  339 production, 145 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 514 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
