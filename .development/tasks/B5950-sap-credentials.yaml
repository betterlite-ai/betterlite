id: B5950
title: SAP AI Core credentials, OAuth token and orchestration deployment lookup
description: >-
  Add `sap_auth` to betterlite-provider. It is the pure port of litellm/llms/sap/credentials.py plus the
  two copies of `deployment_url` discovery (chat and embed). Nothing here reads the process environment,
  the disk, the clock or the network itself. Callers hand in a `SapEnvironment` trait object (env var lookup,
  file exists, file read, home directory) and, for the token, a `SapTokenTransport` trait object and a clock.
  Follow the trait style the sibling modules in crates/betterlite-provider/src use for injected transports.
  Credentials and settings are plain arguments, so add no config section.

  Credential resolution. `fetch_credentials(env, service_key, litellm_sap_service_key) -> Result<Credentials, SapAuthError>`.
  The service key argument order is `service_key`, then `litellm_sap_service_key` (the `litellm.sap_service_key` setting,
  passed in by the caller), then env `AICORE_SERVICE_KEY`; the first truthy one is used (an empty string falls through).
  A string service key is parsed once as JSON; invalid JSON logs a warning and the source is skipped; a JSON object is used as is.
  Sources are tried in this order and the first source that yields at least one credential wins, with no per-key merging:
  service key, environment (`AICORE_<NAME>` upper case), config file, VCAP service. The `kwargs` source is out of scope (see below).
  The eight credential names and their VCAP keys are `client_id` (clientid), `client_secret` (clientsecret),
  `auth_url` (url), `base_url` (serviceurls, AI_API_URL), `cert_url` (certurl), `cert_file_path`, `key_file_path`
  (no VCAP key), `cert_str` (certificate) and `key_str` (key). Transforms: `auth_url` and `cert_url` get
  `/oauth/token` appended unless they already end with it (after trimming trailing slashes); `base_url` gets `/v2`
  unless it already ends with it; `cert_str` and `key_str` turn the two characters `\n` into a newline.
  Service key lookup tries `credentials.<vcap key path>` first (or the bare name when the credential has no VCAP key)
  and then the same path from the document root; the VCAP source only tries the `credentials.` path. A path
  step on a string value parses that string as JSON (a non-JSON string warns and gives nothing); a step through a non-object
  warns and gives nothing; a missing key gives nothing silently. Values are turned into strings; null is nothing.
  The config source reads `AICORE_<NAME>` from the config JSON when present and non-null, else the plain lower-case name.
  `resource_group` is resolved separately over the same source order, first value wins, default `default`, and is always
  set. When `cert_url` is present it replaces `auth_url`. Nothing found in any source is
  `SapAuthError::NoCredentials` with the text "No credentials found in any source".

  Config file. `AICORE_CONFIG` names the file; otherwise `$AICORE_HOME` (default `<home>/.aicore`) plus `config.json`, or
  `config_<profile>.json` when `AICORE_PROFILE` is set to anything other than empty or `default`. A missing file returns an
  empty map unless `AICORE_CONFIG` was set or a non-default profile was asked for, which is a `FileNotFound` error naming the
  path and the home folder. A file that is not valid JSON is a `ConfigNotJson` error with the text
  "<path> is not valid JSON. Please fix or remove it!". The VCAP source reads `VCAP_SERVICES`
  (JSON object of service lists) and picks the first entry whose `label` is `aicore`; invalid JSON or an empty value means none.

  Validation. `validate_credentials` keeps both messages byte for byte: the missing auth_url, client_id or base_url message
  that starts "SAP AI Core credentials not found." and the "SAP AI Core credentials are incomplete." message. Exactly one
  of three modes must hold: a non-empty client_secret; cert_str with key_str; cert_file_path with key_file_path.

  Token. `build_token_request(credentials) -> TokenRequest` returns the URL, a form of `grant_type=client_credentials`,
  `client_id` and `client_secret` (only when non-empty), and a `ClientIdentity` (none, in-memory PEM pair, or file pair).
  The choice order is secret, then PEM strings, then files. `parse_token_response` reads `access_token` and `expires_in`
  (default 3600) and returns `Bearer <token>` with an expiry of now plus expires_in. Any failure in the transport or the
  parse is `SapAuthError::TokenRequest` with the text "Token request failed: <body text>" (the response body when there
  was a response, else the error text). `TokenCache::token(&self, clock, transport)` is mutex guarded, refetches when no
  token is cached or the remaining life is under `expiry_buffer_minutes` (60), and otherwise returns the cached string.

  Deployment lookup. `select_orchestration_deployment(listing: &Json, mode, configuration_for)` takes the body of
  GET `{base_url}/lm/deployments` and a trait object that fetches GET `{base_url}/lm/configurations/{configurationId}`.
  For each resource with `scenarioId == "orchestration"` it fetches the configuration, keeps the pair
  (`deploymentUrl`, `createdAt`) when the configuration's `executableId == "orchestration"`, and returns the
  `deploymentUrl` of the pair with the greatest `createdAt` string. `mode` is Chat or Embedding. Chat reads missing
  `scenarioId` and `executableId` as no match (dict `.get`), Embedding fails on a missing key (subscript). Both fail
  on a missing `configurationId`, `deploymentUrl` or `createdAt` of a matching resource. No match is
  `SapAuthError::NoOrchestrationDeployment`. `orchestration_headers(token, resource_group)` returns `Authorization`
  (the token string as is), `AI-Resource-Group`, `Content-Type: application/json` and `AI-Client-Type: LiteLLM`.
  Callers cache the deployment URL per config object, so the function stays stateless.

  The JSON that arrives from outside is the service key, the config file text and `VCAP_SERVICES`. Add a cargo-fuzz target
  `sap_credentials` that feeds arbitrary bytes to each of the three decoders and replays new seeds. Helper cases cover
  resolution order, transforms, validation messages, token parsing with a fixed clock and deployment selection.
  There are about 330 nonblank, noncomment LiteLLM lines in credentials.py plus 25 in the two deployment copies.
scope:
  paths:
    - crates/betterlite-provider/src/sap_auth.rs
    - crates/betterlite-provider/src/sap_auth/**
    - crates/betterlite-provider/fuzz/Cargo.toml
    - crates/betterlite-provider/fuzz/fuzz_targets/sap_credentials.rs
    - crates/betterlite-provider/fuzz/corpus/sap_credentials/**
    - tools/oracle/cases/helpers/sap-credentials/**
    - "tools/oracle/fuzz/corpus/helper_case/sap_credentials-*"
    - tools/oracle/helpers/b5950.py
    - tools/oracle/helpers/b5950/**
    - tools/oracle/src/helpers/provider/b5950.rs
    - tools/oracle/src/helpers/provider/b5950/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sap/credentials.py#L20-L296
    why: Source order, credential names, VCAP keys, transforms, config file lookup and the service key walk.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sap/credentials.py#L299-L370
    why: Validation messages and the three authentication modes, then the token body and expiry.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sap/credentials.py#L373-L499
    why: Token request, the cache with its 60 minute buffer, and the three client authentication cases.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sap/chat/transformation.py#L139-L185
    why: Chat headers and the deployment_url loop (the Chat mode copy).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sap/embed/transformation.py#L87-L112
    why: Embedding headers and the deployment_url loop (the Embedding mode copy with subscript reads).
dod:
  - text: Credentials come from the first source that has any value, in service key, environment, config file, VCAP order, with the URL and PEM transforms and the resource group default.
    proof: [sap-auth-tests, sap-credentials-python, oracle]
  - text: The config file path, profile rules and the missing, wrong-JSON and explicit-path errors match LiteLLM.
    proof: [sap-auth-tests, oracle]
  - text: Validation accepts exactly one authentication mode and keeps both error texts.
    proof: [sap-auth-tests, oracle]
  - text: Token requests, response parsing, the default one hour expiry and the 60 minute refresh buffer match LiteLLM, and failures carry the response body.
    proof: [sap-auth-tests, oracle]
  - text: Deployment lookup picks the newest orchestration deployment and differs between Chat and Embedding mode on missing keys.
    proof: [sap-auth-tests, oracle]
  - text: New credential seeds replay through the fuzz target and the helper case parser.
    proof: [sap-credentials-corpus, sap-credentials-seeds]
checks:
  optional: [mutants]
  commands:
    - id: sap-auth-tests
      why: resolution order, transforms, validation, token handling or deployment selection is missing
      run: >-
        cargo nextest run --locked -p betterlite-provider --no-tests=fail
        -E 'test(/^sap_auth::/) - test(replays_the_sap_credentials_corpus)'
    - id: sap-credentials-python
      why: the strict oracle adapter fails lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5950)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5950 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5950/pyrightconfig.json
    - id: sap-credentials-corpus
      why: the credential decoder fuzz target or its new replay seeds are missing
      run: >-
        test -f crates/betterlite-provider/fuzz/fuzz_targets/sap_credentials.rs &&
        grep -q 'name = "sap_credentials"' crates/betterlite-provider/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/sap_credentials)" &&
        cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_sap_credentials_corpus)'
    - id: sap-credentials-seeds
      why: new helper seeds are missing or do not select this helper operation
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/sap_credentials-*")" &&
        grep -lE '^[[:space:]]+b5950:' tools/oracle/fuzz/corpus/helper_case/sap_credentials-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/sap-credentials/source-order.yaml
  - tools/oracle/cases/helpers/sap-credentials/url-and-pem-transforms.yaml
  - tools/oracle/cases/helpers/sap-credentials/service-key-lookup.yaml
  - tools/oracle/cases/helpers/sap-credentials/config-file-and-profile.yaml
  - tools/oracle/cases/helpers/sap-credentials/validate-modes.yaml
  - tools/oracle/cases/helpers/sap-credentials/token-expiry.yaml
  - tools/oracle/cases/helpers/sap-credentials/deployment-selection.yaml
deviations:
  - what: PEM certificate and key strings go to the HTTP client in memory, with no temporary directory and files.
    why: The Rust client takes a PEM identity directly, and writing a private key to disk adds nothing.
  - what: A missing orchestration deployment is a typed `NoOrchestrationDeployment` error, not Python's IndexError text "list index out of range".
    why: The IndexError text is a Python runtime detail and a typed error lets the caller report it properly.
  - what: The token request has no 30 second default in this module. The caller's transport owns the timeout and uses 30 seconds.
    why: This module does no I/O.
out_of_scope:
  - The `kwargs` credential source, the `profile` argument, `timeout` and `expiry_buffer_minutes` arguments of get_token_creator and fetch_credentials. The only callers at the pin are transformation.py:141 `get_token_creator(service_key)` and embed/transformation.py:85 `get_token_creator()`, so only the defaults are reachable. The profile still comes from `AICORE_PROFILE`.
  - credentials.py `_env_name` has no caller at the pin.
  - The `litellm.sap_service_key` setting is read by the config settings task; this module takes it as an argument.
  - Real HTTP for the token, the deployment listing and the configuration lookup, reading `VCAP_SERVICES` from the process, and the home directory. B8331 wires the real transports and environment.
  - The chat and embedding config classes that call these functions; B5845 owns them.
pitfalls:
  - The token response status is never checked. A 401 with a JSON body that lacks `access_token` fails only because the key is missing, and the error carries the response text. A non-JSON body fails at the parse.
  - With `expires_in` absent the expiry is 3600 seconds, which is already under the 60 minute buffer, so every call to `token()` refetches. Keep that.
  - '`fetch_credentials` does not validate. `validate_credentials` runs once, after resolution, inside the token creator, and `cert_url` has already replaced `auth_url` by then.'
  - An empty string credential is still "found" (only null is skipped), so an `AICORE_CLIENT_ID=` env var wins over later sources.
  - Credentials without a VCAP key (`cert_file_path`, `key_file_path`) are read at `<name>` directly, not under `credentials.`, in the service key and the VCAP source.
  - The service key lookup falls back to the document root only when the `credentials.` path gave nothing.
  - '`AICORE_HOME` is read when the function runs, but the default `<home>/.aicore` comes from the caller''s home folder.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
