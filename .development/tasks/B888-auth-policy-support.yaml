dod:
  - text: 'Cases guardrail_four_keys_three_locations, guardrail_false_and_null_count,
      guardrail_json_object_and_malformed, modify_false_only_denies, no_team_allows,
      tool_key_overrides_team, tool_empty_key_falls_back, tool_bad_effective_allows,
      tool_route_skip, tool_exact_string_names_and_duplicates, tool_team_argument_unused,
      tool_all_eight_call_types, standalone_empty_stops, handler_empty_continues,
      missing_handler_empty, chat_and_legacy_names, responses_custom_and_mcp_names,
      gemini_declarations, mcp_name_precedence, anthropic_both_names,
      extraction_falsey_names_and_wrong_objects and extraction_noniterable_error cover policy and names.'
    proof:
      - behavior-tests
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'Context cases safe_fetch_rethrows_three_auth_errors, safe_fetch_other_debug_drop,
      reconstructed_team_all_fields, dashboard_vouches_for_missing_team, missing_team_never_vouches,
      nonempty_team_models_bypass_outage_setting, empty_models_consult_outage_setting,
      org_id_inherits_first, any_populated_org_field_skips, org_lookup_missing_db_or_id,
      org_missing_row_noop, org_without_budget_copies_identity and org_budget_fields_copy.'
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_policy_support::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_policy_support.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-policy-support-*")"
        && grep -rlq "auth_policy_support" tools/oracle/fuzz/corpus/helper_case/auth-policy-support-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_policy_support::tests::/)
        - test(/replays_the_/)'
