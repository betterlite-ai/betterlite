id: B888
title: Guardrail tool and token-inherited auth policy
description: >-
  Implement the guardrail/tool admission helpers and trusted context fallbacks used by CommonAuthChecks.
  Guardrail detection checks metadata, litellm_metadata and the root, in that order, for the presence
  of guardrails, disable_global_guardrails, disable_global_guardrail or opted_out_global_guardrails;
  false/null values still count. Dicts and JSON-string objects count; malformed JSON and other roots
  are ignored through B192's existing decoder. Move _GUARDRAIL_MODIFICATION_KEYS (L785-L790) and
  guardrail_helpers.can_modify_guardrails (L13-L23) here from B104. Only a dict team.metadata.guardrails
  whose modify_guardrails is literally False denies; no team, absent settings and other values allow.
  Denial is HTTPException 403 with detail.error 'Your team does not have permission to modify guardrails.';
  the caller's auth projector exposes auth_error, param string None and code 403. Do not invent an
  explicit-permission requirement where the source defaults to allowing modifications.

  Tool checks skip missing tokens, unknown/non-tool routes and empty extracted names. A nonempty list
  token.metadata.allowed_tools overrides team_metadata.allowed_tools; empty or malformed key values
  fall back to the team value, and empty/malformed effective values allow everything. Convert list
  entries to strings, preserve request name order and duplicates, compare exact case-sensitive names,
  and raise 403 tool_access_denied, param tools, code 403 listing all disallowed names. The separate
  team_object argument is unused: do not refresh policy from it.

  Move tool_name_extraction.py's functions/constants (L16-L86) below B104 into this task, together
  with the three extract_request_tool_names methods: OpenAI chat handler L257-L268, Responses handler
  L662-L673 and Anthropic handler L918-L921. Use B207's route mapping and a native typed extractor
  registry rather than depending on guardrail execution. Tool-capable values are completion,
  acompletion, responses, aresponses, anthropic_messages, generate_content, agenerate_content and
  call_mcp_tool. Register standalone Gemini/MCP extractors once; an existing nonempty registry is
  unchanged. Gemini reads tools[].functionDeclarations[].name; MCP prefers truthy name over
  mcp_tool_name. Standalone returns immediately even if empty; other matching handlers continue
  until names are nonempty, missing handlers/unsupported call types yield no names. Chat reads
  function tools' function.name then legacy functions[].name. Responses reads function/custom name
  or mcp server_label. Also move base_llm/guardrail_translation/utils.py anthropic_tool_names
  (L295-L303) here: it accepts nonempty string flat names and, only for type function, nonempty
  string function.name, returning both in that order. Anthropic flattens these pairs. Ignore wrong
  object shapes and falsey names; retain truthy names after source string conversion, duplicates and
  order. Truthy noniterable tools/declarations propagate the source error rather than becoming an
  allow-all result. B104 retains dynamic Python discovery and all other translation behavior.

  _safe_fetch debug-logs and rethrows HTTPException, ProxyException and BudgetExceededError;
  other exceptions debug-log 'swallowed' and return None. The reconstructed cached team copies
  team_id, max/soft/model budgets, spend, tpm/rpm/tpd, blocked, models via B753, metadata and
  object_permission_id; it does not synthesize organization_id or team_alias. Team id is required.
  For vouching, litellm-dashboard always wins, even over TeamNotFoundError; other missing teams
  never vouch. Otherwise truthy team_models vouch before B1217's outage setting is consulted.
  Empty team_models use that setting. The policy does not inspect the exception's transport class.

  Organization inheritance first fills a missing org_id from the team. Any nonnull organization_alias,
  organization_max_budget, organization_tpm_limit, organization_rpm_limit or organization_metadata
  suppresses the entire lookup, including zero/empty values. Missing org id or DB also skips it.
  B879 supplies the org; None changes nothing, otherwise assign alias/metadata before testing for a
  budget row, then copy max_budget/tpm/rpm. Do not fill holes in a partially populated token.


  Build the production auth_policy_support module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _guardrail_modification_check (L793-L844; 44 source lines), check_tools_allowlist (L847-L885; 38 source
  lines). litellm/proxy/auth/user_api_key_auth.py: _safe_fetch (L2625-L2651; 27 source lines), _team_obj_from_token
  (L2654-L2673; 20 source lines), _token_can_vouch_for_team (L2676-L2703; 25 source lines), _inherit_org_identity
  (L2706-L2744; 39 source lines).


  Add the auth_policy_support operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-policy-support-*
  seed to B171 helper_case, which already owns this decoder.


  Guardrail and tool fixtures send the exact presence/null/false combinations through B732 auth wiring.
  Team lookup cases use B860 with POSTGRES_TEST_URL or testcontainers, while extractor cases compare
  only the source's native tool-name lists and leave provider calls out of the test.


  Sizing: 193 lines in the initial ranges before docstring exclusion plus the small extracted leaves;
  allow 280 production, 320 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring,
  no new decoder or config loader, 730 changed lines within an 800-line gate. Only fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_policy_support::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
