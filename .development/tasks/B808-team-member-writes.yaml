id: B808
title: Add team members and update member roles and budgets
description: >-
  Implement POST /team/member_add and /team/member_update using MemberChangePlan and member budget patches.
  B1207 separately owns deletion. Add calls B807 input checks, B861 duration validation, then B737
  get_team_object with check_cache_only=false, check_db_only=true and parent_otel_span=None. A None
  row is 404 Team not found; lookup exceptions retain B737's contract. Validate the typed row, run
  B807 duplicate preflight BEFORE permissions, then its administrator/available-team permission check.
  B1206 resolves existing identities, validates caller-supplied ID provisioning, populates ID/email
  sequentially, and computes pre-existing user IDs before B807's locked addition transaction.
  Preserve the original before-roster for auditing. Earlier identity-population effects outside that
  transaction survive a later failed addition; do not move them under an invented route transaction.

  After addition commits, B734 deletes team cache by ID/alias, B878 evicts/broadcasts sorted updated
  user IDs, then B805 evicts created membership caches. B807 emits the member metric and schedules
  new-user/team audits only after those awaited cache effects. Return expanded stored team fields
  plus updated_users and updated_team_memberships through B1231.TeamAddMemberResponse. Cache failures
  leave committed rows and prevent subsequent effects; metric failures are swallowed by B807.

  Update rejects no database (500 No db connected), null team_id (400 No team id passed in), then
  absent BOTH user_id/email (400 Either user_id or user_email needs to be passed in), and validates
  budget_duration via B861. Omit its local admin-role premium check as recorded below. A missing
  stored team is 400, unlike the add route. B800 accepts proxy/team/org admins; denial is 403 with
  source detail naming /team/member_delete even here. Call B812.team_info with key_limit=None to
  obtain memberships and hydrated roster, preserving that service's effects/errors.

  A nonnull requested user_id wins, including empty string; otherwise find the first exact email in
  team_info. Unresolved email is 400 User id doesn't exist in team table. Take the first matching
  membership's budget_id and a string metadata.team_member_budget_id (including empty) as the default.
  B862.member_budget_patch computes the supplied limits. Within one transaction, B807 changes a
  nonnull requested role under its team lock BEFORE B862._upsert_budget_and_membership; failure of
  either rolls both back. With role=None, no roster lock/membership-existence precheck is added by
  this handler: a budget-only patch for an existing user absent from the roster follows B862's write.
  Shared-default clone behavior comes from B862, not a direct B802 call.

  Only a nonempty budget patch invalidates B734 member spend state after commit. A role change then
  updates the response snapshot and schedules B807 membership audit; identical before/after skips it.
  Return team_id, resolved user_id and the REQUEST's user_email/max_budget_in_team/tpm_limit/rpm_limit/
  budget_duration/allowed_models/temp_budget_increase/temp_budget_expiry, including nulls. Do not
  replace these with inherited stored limits or add role to this response projection.

  Neither route calls handle_exception_on_proxy. Add only catches/rethrows initial HTTPException;
  all later failures and every update failure propagate through B003 and B865. HTTP fixtures compare
  status, actual type/param/code, response nulls and content-type; ignore only message wording. There
  is no litellm-changed-by argument here; membership audit scheduling supplies None. Audit enablement,
  available teams and provisioning config remain with B065/B803/B1206.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  team_member_add (L3356-L3505; 129 source lines), team_member_update (L3763-L3915; 128 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/member_add -> team_member_add;
  POST /team/member_update -> team_member_update. Exercise the named source errors below through
  B001 HTTP fixtures, including permitted available-team self-join instead of a blanket non-admin denial.


  B860 provisions membership/role rows through POSTGRES_TEST_URL or testcontainers when no URL is
  configured; test setup failures fail, and post-commit faults must leave the changed roster visible.


  Sizing: 257 nonblank, noncomment source lines; allow 260 production, 390 behavior/Postgres tests
  and 65 route wiring lines, 715 within 750.


  Native-only deviation test in this production module: update_admin_without_license.
  Assert an authorized role promotion succeeds without premium_user and still produces the locked
  roster write, audit and invalidation; that promotion is excluded from MIT equality comparisons.


  Both member-write routes use B052 key authentication followed by their B865 decorators.
