  - text: 'Implement the owned behavior and ordered failure effects; named tests: add_member, update_role,
      non_admin_denied, postgres_pinned_rows, postgres_failure_effects, add_required_fields,
      invalid_duration, add_db_only_lookup, add_missing_team_404, duplicate_before_permission,
      available_self_join, provisioning_before_add, identity_partial_effects, add_cache_order,
      add_response_expansion, metric_warning_continues, add_cache_failure_committed,
      update_missing_db, update_missing_team_id, update_missing_identity, update_missing_team_400,
      org_admin_update, denied_update_route_detail, info_unlimited_keys, user_id_before_email,
      first_email_match, email_not_found, explicit_nonroster_budget, role_budget_rollback,
      default_budget_clone, budget_only_invalidation, role_only_no_budget_eviction,
      role_audit_after_commit, unchanged_role_no_audit, echoed_request_limits and error_passthrough.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: update_admin_without_license accepts an authorized role promotion without premium_user;
      unauthorized promotions still fail and B807 owns the corresponding add-route gate removal.
    proof:
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_member_writes::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_member_writes::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_member_writes::tests::postgres_failure_effects$/)'
