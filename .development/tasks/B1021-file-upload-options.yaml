id: B1021
title: File target options and managed-id requirements
description: >-
  Implement the complete callable slice common_utils.py L889-L1130 in
  betterlite-core::api::file_upload_options: FileCreationParams,
  extract_file_creation_params, the target-storage and target-model-name extractors,
  validate_managed_files_requirement, validate_managed_id_requirement and
  _extract_model_param. B1100 supplies the cached parsed body and B1101 supplies an
  ordered multipart field view; this task consumes those typed values and does not add
  another byte or multipart decoder. HTTP route registration and final error envelopes
  remain with B1032, B086, B088 and the other route owners.

  FileCreationParams has target_storage="default", target_model_names=[] and model=null
  as its constructor defaults. Its __post_init__ turns only a falsy target_storage (None
  or "") into "default", turns None target_model_names into [], and strips and removes
  empty model names. It does not strip target_storage: direct construction with
  target_storage=" azure_storage " remains " azure_storage ", and direct construction
  with target_storage="   " remains "   ". The form extractor is different: a truthy
  target_storage form value is stripped by _extract_target_storage_simple before the
  dataclass is built, so " azure_storage " becomes "azure_storage" and "   " becomes
  "default" only after that helper returns "" and __post_init__ applies its falsy rule.
  Model strings are never stripped. Comma-separated text is split literally, so JSON
  looking text is not decoded; only the raw multipart fallback deduplicates names in
  first-seen order.

  extract_file_creation_params reads B1100's request body exactly once only when its
  request_body argument is None, replacing a falsey read result with {}. It extracts
  target_storage from the explicit form argument, uses the explicit simple
  target_model_names argument first, falls back to ordered request.form().multi_items()
  only when that simple result is empty, and resolves model from body, query parameter
  model, then x-litellm-model header. Load litellm_settings.require_managed_files through
  B002 with LiteLLM's default false; only the actual boolean true enables either managed
  check, and the source performs no environment lookup. Keep non-enterprise MIT behavior
  when no ManagedResourceAccessChecker is installed. The owned span has no database write
  or warn-and-drop call; ignored unrelated, non-bracket, non-string and malformed form
  values are covered as silent outcomes.

  Add pure helper and config behavior tests under api::file_upload_options::tests and
  direct helper-oracle adapters over typed inputs. Provider-reaching route behavior,
  multipart HTTP status mapping and the route's authentication/error headers belong to
  their route tasks. The 185 nonblank, non-comment source lines in the owned span allow
  165 production, 130 tests, 90 fixtures, 75 adapters, 55 config tests/seeds and 35
  wiring lines, 550 changed lines total.
