references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L889-L956
  why: FileCreationParams and extract_file_creation_params define the constructor normalization, body-read condition, form precedence and model resolution that the worker must preserve.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L959-L1019
  why: These four helpers specify stripping, comma splitting, bracket-key recognition, ordered multi-item collection, silent skips and first-seen deduplication.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1022-L1118
  why: These validators specify the literal managed-upload and managed-id status/detail outcomes, strict-True gate and checker dispatch.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1121-L1130
  why: _extract_model_param fixes body, query and x-litellm-model precedence and preserves falsey fallthrough without trimming.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L396-L396
  why: The process setting litellm.require_managed_files starts as the literal boolean False and is tested with `is True` by both validators.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L4409-L4417
  why: The managed-id decoder owned by B1019 recognizes strings beginning with the literal prefix `litellm_proxy`; this supplies a stable encoded-id fixture without inventing an enterprise hook.
dod:
- text: >-
    creation_defaults_direct constructs FileCreationParams() and gets
    target_storage="default", target_model_names=[] and model=null. Direct construction
    with target_storage="" and target_storage=null gets "default"; direct construction
    with target_storage=" azure_storage " stays " azure_storage ", and with
    target_storage="   " stays "   ". Direct construction with target_model_names=null
    gets [], while [" a ", "", "  b  "] becomes ["a", "b"]. No __post_init__ branch
    trims storage whitespace.
  proof: [behavior-tests]
- text: >-
    creation_extraction reads a supplied request_body once without calling B1100 again;
    with request_body={"model":" b "}, query model="q" and header x-litellm-model="h",
    the model is " b " and target_storage_form=" azure_storage " becomes
    "azure_storage". With target_storage_form="   ", _extract_target_storage_simple
    returns "" and the constructed value is "default". When request_body is absent,
    B1100 is called once and a falsey result becomes {}; body model="" falls through to
    query "q", then header "h", and a final header value of "" is returned as "".
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    simple_targets sends target_model_names_form=" a, b,,a " and gets ["a", "b", "a"];
    the duplicate remains because the simple parser does not deduplicate. A compatibility
    list [" a ", 0, 2, " "] is parsed as ["a", "2", ""] before dataclass post-init
    and becomes ["a", "2"] in FileCreationParams; None, "" and a non-list/non-string
    value produce []. Text "[\"a\",\"b\"]" is split into literal fragments
    ["[\"a\"", "\"b\"]"], never JSON-decoded. A nonempty simple result does not
    call the raw form fallback; " " has an empty simple result and does call it.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    repeated_targets iterates form pairs in order and collects string values for the exact
    key "target_model_names" and any key beginning "target_model_names[" and ending "]".
    Ordered pairs target_model_names[]=a, target_model_names[0]=" b,a ",
    target_model_names=a, target_model_names[xyz]=b, target_model_names_extra=c,
    target_model_names[unterminated=d and target_model_names[]=a produce ["a", "b",
    "a", "a", "b", "a"] before first-seen deduplication and ["a", "b"] after it.
    An UploadFile/non-string value, target_model_names_extra and the missing-closing-bracket
    key are silently ignored; repeated values are never reduced to the last map value.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    managed_upload_errors sets litellm_settings.require_managed_files to the actual bool
    true. targets=[] and model="m" raises HTTPException status_code=400 with the exact
    detail "target_model_names is required when require_managed_files is enabled in
    litellm_settings. Provide one or more model aliases via the target_model_names form
    field (e.g. target_model_names=my-model-alias)." before checking model. targets=["a"]
    and model="m" raises status_code=400 with the exact detail "model is not allowed when
    require_managed_files is enabled in litellm_settings. Uploads must go through managed
    files using target_model_names instead of the model parameter." targets=["a"] and
    model="" passes. False, null, 0, 1 and "true" are disabled compatibility values and
    pass both inputs. These direct helper exceptions expose no type, param or code field;
    B1032 owns their later HTTP error mapping.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    managed_id_gate uses resource_kind="file", "batch" and "fine-tuning job". With the
    gate true, resource_id=null and resource_id="" return without decoding or checking;
    raw ids "file-1", "batch-1" and "job-1" raise HTTPException status_code=400 with
    respectively the exact details "Raw provider file ids cannot be used when
    require_managed_files is enabled in litellm_settings. Use the LiteLLM managed file id
    returned when the file was created.", "Raw provider batch ids cannot be used when
    require_managed_files is enabled in litellm_settings. Use the LiteLLM managed batch id
    returned when the batch was created.", and "Raw provider fine-tuning job ids cannot be
    used when require_managed_files is enabled in litellm_settings. Use the LiteLLM managed
    fine-tuning job id returned when the fine-tuning job was created.". An encoded id whose
    decoded text begins "litellm_proxy" and managed_files_obj=null raises status_code=500
    with detail "Managed resource ownership validation is unavailable.". These exceptions
    have no type, param or code field, and false/none/0/1/"true" gate values bypass every
    branch.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    managed_id_checker_contract injects a structural ManagedResourceAccessChecker. For an
    encoded id beginning "litellm_proxy", resource_kind="file" calls
    can_user_call_unified_file_id(id, user_api_key_dict), while "batch" and
    "fine-tuning job" call can_user_call_unified_object_id(id, user_api_key_dict). A true
    result returns None; a false result raises HTTPException status_code=403 with exact
    detail "The caller does not have access to this managed file id." or the same string
    with "batch" or "fine-tuning job" substituted. No checker is installed globally as a
    replacement for LiteLLM's missing MIT managed_files hook.
  proof: [behavior-tests]
- text: >-
    settings_loader loads omitted litellm_settings.require_managed_files as false, explicit
    false as false and explicit true as true through the production Config loader; named
    compatibility inputs null, 0, 1 and "true" remain disabled and never become true.
    The loader reads no environment variable for this key. The config and helper corpus
    seeds reach the same production decoders, and managed_id_gate records the no-enterprise
    encoded-id outcome as status_code=500 rather than a paid-tier rejection or fabricated
    owner. The owned span performs no database write and emits no warning while dropping a
    field.
  proof: [config-tests, config-corpus, helper-corpus, behavior-tests, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: The file-upload options production helpers or their literal edge cases are missing or failing.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_options::/)'
  - id: config-tests
    why: require_managed_files is not loaded and tested through the production Config path.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_options::tests::settings_loader($|::)/)'
  - id: config-corpus
    why: A newly added file-upload-options YAML seed is absent or the config corpus replay fails.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/file-upload-options-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: The file-upload-options Python adapter is missing or fails strict ruff or basedpyright checks.
    run: test -f tools/oracle/helpers/file_upload_options.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: A helper-case corpus seed does not dispatch file_upload_options or its replay fails.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_upload_options-*)" && grep -qE '^[[:space:]]+file_upload_options:' tools/oracle/fuzz/corpus/helper_case/file_upload_options-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: No new file-upload-options oracle cases were added for the literal helper outcomes.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-upload-options)"
oracle_cases:
- tools/oracle/cases/helpers/file-upload-options/creation-extraction.yaml
- tools/oracle/cases/helpers/file-upload-options/simple-targets.yaml
- tools/oracle/cases/helpers/file-upload-options/repeated-targets.yaml
- tools/oracle/cases/helpers/file-upload-options/managed-upload-errors.yaml
- tools/oracle/cases/helpers/file-upload-options/managed-id-gate.yaml
deviations:
- what: >-
    With litellm_settings.require_managed_files=true and an encoded id, betterlite returns
    status 500 with detail "Managed resource ownership validation is unavailable." when no
    ManagedResourceAccessChecker is installed; raw ids still return status 400 with the
    exact resource-specific detail above.
  why: >-
    The pinned open-source package has no enterprise managed_files hook in this checkout.
    Betterlite follows that MIT fallback and does not fabricate ownership, silently allow
    cross-tenant access or add a paid-tier/license rejection.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1085-L1118
out_of_scope:
- B1019 owns ManagedResourceAccessChecker, _is_base64_encoded_unified_file_id and the other common_utils.py id/list helpers through L309; this task calls that decoder but does not reimplement or change its permissive startswith("litellm_proxy") rule.
- B1020 owns common_utils.py credential and model-routing functions L317-L709; no function in this task crosses into that slice.
- detect_content_type_from_filename, normalize_mime_type_for_provider, is_gemini_supported_mime_type and get_content_type_from_file_object at L772-L882 have no live MIT caller at the pin; their MIME tables and cases are excluded.
- B1041 owns common_utils.py batch-response/database functions L1138-L1549, including all database writes and their order; the owned L889-L1130 span performs no database write.
- Route decorators, multipart HTTP decoding, route status/type/param/code serialization, authentication and provider calls belong to B1032, B086, B088 and the other route owners; this task tests the pure helper exception fields before route mapping.
- The enterprise package, premium-user gates and managed_files implementation are excluded by the MIT checkout; the only supported hook input is an injected structural checker in the native contract test.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_upload_options in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_upload_options.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_upload_options.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  The review-sensitive storage distinction is real: _extract_target_storage_simple("   ")
  returns "", so extraction ends at "default", while FileCreationParams(target_storage="   ")
  remains three spaces because __post_init__ tests truthiness and never calls strip().
- >-
  _extract_target_model_names_simple('["a","b"]') splits on commas into '["a"' and
  '"b"]'; JSON decoding would change LiteLLM's literal output.
- >-
  Only the raw form fallback deduplicates, and it deduplicates after flattening every
  qualifying multi-item string; simple input preserves duplicate "a" values.
- >-
  A key such as target_model_names[unterminated is rejected because it does not end with
  "]", while target_model_names[xyz] qualifies even though the bracket contents are not numeric.
- >-
  require_managed_files uses identity with True: numeric 1 and string "true" must not enable
  either validator even if a config compatibility decoder accepts them.
- >-
  Empty resource_id returns before base64 recognition and checker dispatch, so required-id
  validation and this helper's managed check cannot be merged into one branch.
- >-
  A decoded id beginning "litellm_proxy" is enough for recognition; the helper does not
  verify a colon, UUID, ownership record or resource-kind-specific encoding before asking the checker.
- >-
  The file checker method is distinct from the object checker method: only resource_kind="file"
  calls can_user_call_unified_file_id; both "batch" and "fine-tuning job" call
  can_user_call_unified_object_id.
review_level: security
budget:
  max_changed_lines: 550
  max_new_expects: 0
