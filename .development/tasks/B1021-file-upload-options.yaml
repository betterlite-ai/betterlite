id: B1021
title: File upload options
description: >-
  Parse file creation form fields into typed target_storage, target_model_names, model, purpose and MIME records.
  Preserve filename/content MIME normalization and managed-files requirement checks, including repeated and JSON-encoded
  target names; no form string can become a local path.


  is_gemini_supported_mime_type (litellm/proxy/openai_files_endpoints/common_utils.py:L824-L846) has no MIT runtime
  caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior case
  exercises that unused entry point.


  get_content_type_from_file_object (litellm/proxy/openai_files_endpoints/common_utils.py:L849-L882) has no MIT
  runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior
  case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/file_upload_options.rs. Use FileUploadOptionsInput and FileUploadOptionsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): common_utils.py:1115 status_code=403, exception_detail=FastAPI detail string; common_utils.py:1042
  status_code=400, exception_detail=FastAPI detail string; common_utils.py:1052 status_code=400, exception_detail=FastAPI
  detail string; common_utils.py:1092 status_code=400, exception_detail=FastAPI detail string; common_utils.py:1102
  status_code=500, exception_detail=FastAPI detail string. Compare the actual source status, error type, param and
  code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions target_models_repeated_form, target_models_json_form, gemini_mime_alias,
  managed_required, target_storage_selected, filename_mime under api::file_upload_options::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.require_managed_files
  defaults to False. No environment reads occur outside betterlite-config. Test api::file_upload_options::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileUploadOptions in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_upload_options: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/openai_files_endpoints/common_utils.py: detect_content_type_from_filename (L772-L793);
  litellm/proxy/openai_files_endpoints/common_utils.py: normalize_mime_type_for_provider (L796-L821); litellm/proxy/openai_files_endpoints/common_utils.py:
  FileCreationParams.__post_init__ (L905-L915); litellm/proxy/openai_files_endpoints/common_utils.py: extract_file_creation_params
  (L918-L956); litellm/proxy/openai_files_endpoints/common_utils.py: _extract_target_storage_simple (L959-L971);
  litellm/proxy/openai_files_endpoints/common_utils.py: _extract_target_model_names_simple (L974-L989); litellm/proxy/openai_files_endpoints/common_utils.py:
  _is_target_model_names_key (L992-L993); litellm/proxy/openai_files_endpoints/common_utils.py: _extract_target_model_names_from_form
  (L996-L1019); litellm/proxy/openai_files_endpoints/common_utils.py: validate_managed_files_requirement (L1022-L1059);
  litellm/proxy/openai_files_endpoints/common_utils.py: validate_managed_id_requirement (L1062-L1118); litellm/proxy/openai_files_endpoints/common_utils.py:
  _extract_model_param (L1121-L1130). Abstract/protocol declarations map to native types and synchronous/async wrappers
  share one implementation; a partial function span is the explicit preparation/transition stage described above,
  with typed values passed to the following stage.


  Sizing: 143 owned nonblank/non-comment/non-docstring Python lines (219 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 163 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 464 total within the 470-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1015 (File contracts), B1016 (Managed
  resource ids), B1087 (Api boundaries), B1100 (Shared request body decoding), B1019 (File routing ids), B002 (Load
  LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
