  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_options::/)
      - test(/::replays_corpus$/)'
  - id: case-target-models-repeated-form
    why: the target-models-repeated-form behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_options::tests::target_models_repeated_form($|::)/)'
  - id: case-target-models-json-form
    why: the target-models-json-form behavior or its assertions are absent
