dod:
  - text: Tool calls are extracted from response choices using both modern tool_calls and legacy function_call fields, with stable synthetic IDs for legacy function calls.
    proof: [extraction-cases]
  - text: Anthropic tool_use content blocks are detected with _is_tool_use_block and converted to ChatCompletionMessageToolCall format with anthropic_to_tool_call.
    proof: [anthropic-conversion-cases]
  - text: All extracted tool calls are evaluated through _evaluate_tool_calls, which applies permission rules from B3811 and collects denied tools without stopping.
    proof: [evaluation-cases]
  - text: Denied tool calls in OpenAI responses are removed via rewrite_openai_responses; error messages are appended to choice.message.content; finish_reason is changed to stop when all tools are removed.
    proof: [openai-rewrite-cases]
  - text: Denied tool_use blocks in Anthropic responses are removed via rewrite_anthropic_responses; error text is appended; stop_reason changes to end_turn when no tool_use blocks remain.
    proof: [anthropic-rewrite-cases]
  - text: async_post_call_success_hook skips guardrail evaluation when should_run_guardrail returns false and passes through responses with no tool calls.
    proof: [success-hook-cases]
  - text: streaming_iterator_hook buffers all chunks before evaluation, detects OpenAI-style streams with stream_chunk_builder and Anthropic SSE with assemble_anthropic_sse_stream, and passes unrecognized non-raw chunks through.
    proof: [streaming-detection-cases]
  - text: Unparseable raw SSE streams raise GuardrailRaisedException with a blocking message before yielding chunks.
    proof: [streaming-error-cases]
  - text: Reconstructed streams from evaluated ModelResponse use MockResponseIterator to yield chunks; Anthropic streams are re-encoded with anthropic_sse_chunks_from_response.
    proof: [stream-reconstruction-cases]
  - text: When stream buffer capacity is exceeded, GuardrailRaisedException is raised with a clear message before unlimited collection occurs.
    proof: [buffer-overflow-cases]

checks:
  optional: []
  commands:
    - id: extraction-cases
      why: tool call extraction from responses is missing, incomplete or incorrect
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::(extract|legacy)/)'
    - id: anthropic-conversion-cases
      why: Anthropic tool_use block detection or conversion is missing or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::(anthropic|tool_use)/)'
    - id: evaluation-cases
      why: permission evaluation on tool calls is missing or stops at first denial
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::evaluate/)'
    - id: openai-rewrite-cases
      why: OpenAI response rewriting is missing, incomplete or incorrect
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::openai_rewrite/)'
    - id: anthropic-rewrite-cases
      why: Anthropic response rewriting is missing, incomplete or incorrect
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::anthropic_rewrite/)'
    - id: success-hook-cases
      why: success hook guard checks or passthrough are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::success_hook/)'
    - id: streaming-detection-cases
      why: streaming format detection or chunk buffering is missing or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::(streaming|detect)/)'
    - id: streaming-error-cases
      why: unparseable SSE error handling is missing or doesn't block
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::unparseable/)'
    - id: stream-reconstruction-cases
      why: stream reconstruction with MockResponseIterator or anthropic_sse_chunks_from_response is missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::reconstruct/)'
    - id: buffer-overflow-cases
      why: stream buffer overflow detection is missing or doesn't raise
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_permission_responses::buffer_overflow/)'

