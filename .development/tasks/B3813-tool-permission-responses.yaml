deviations:
  - what: Stream buffer capacity for streamed responses has an explicit limit; exceeding it raises GuardrailRaisedException rather than collecting unbounded chunks as LiteLLM does.
    why: A gateway on the public internet must bound memory allocation to untrusted streams. The limit is configurable; the default is set to a reasonable per-request capacity.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/tool_permission.py#L892-L953
out_of_scope:
  - "add_guardrail_to_applied_guardrails_header callback utility is owned by B189 (callback infrastructure)."
  - "should_run_guardrail check and @log_guardrail_information decorator are owned by B3664 (CustomGuardrail)."
  - "GuardrailRaisedException constructor and translation to HTTP responses is owned by a lower guardrail infrastructure task, not listed here."
  - "anthropic_sse.is_raw_sse_stream, assemble_anthropic_sse_stream, anthropic_sse_chunks_from_response SSE decoding and encoding are owned by the lower SSE assembly task."
  - "base_model_iterator.MockResponseIterator constructor and async iteration are owned by the lower model iterator task."
  - "stream_chunk_builder from B2227 (betterlite-streaming::streamed_response_assembly) is used as-is; do not reimplement."
pitfalls:
  - "Evaluate all tool calls before selecting the first denial to raise; _evaluate_tool_calls collects all denials without stopping, and only the first denial is raised in block mode."
  - "Legacy function calls need synthetic IDs derived from choice index; the same ID must be used when looking up the error result to avoid mismatches."
  - "Anthropic tool_use blocks are removed by ID match; a tool_use block without an id field (falsey) never matches an error result and stays in the response."
  - "finish_reason changes only when all tool_calls in a choice are removed, not when some are removed; the finish_reason must be a tool-calling reason (tool_calls or function_call) before changing it."
  - "Anthropic content blocks are replaced in place, and the response object is mutated directly; logging of the response sees the rewritten version."
  - "Streaming path does not call should_run_guardrail locally; the check happens at the ProxyLogging caller before this hook is invoked."
  - "Non-raw SSE chunks that fail to assemble (return None from assemble_anthropic_sse_stream) are passed through unchanged, not treated as errors."
  - "Raw SSE streams that cannot be parsed are blocked immediately with GuardrailRaisedException, not passed through or partially processed."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
