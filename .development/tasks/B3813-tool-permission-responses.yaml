id: B3813
title: Enforce tool permissions on complete and streamed model responses
description: >-
  Evaluate and rewrite modern tool calls, legacy function calls and Anthropic tool-use blocks
  in complete responses and buffered streams. Extract tool calls from response choices using
  extract_response_tools to collect all modern tool_calls and legacy function_call
  fields, anthropic_to_tool_call to convert Anthropic tool_use content blocks to
  the unified ChatCompletionMessageToolCall format, and legacy_to_tool_call to
  synthesize OpenAI-compatible tool calls from legacy function_call objects with stable IDs.
  Evaluate every extracted tool call through _evaluate_tool_calls, which applies the same
  permission rules from B3811 and collects only the denied tools, raising a GuardrailRaisedException
  on the first denial in block mode. Rewrite denied tool calls in place: rewrite_openai_responses
  removes denied tool_calls and function_call entries from OpenAI responses, appends error messages
  to choice.message.content, and changes finish_reason from tool_calls or function_call to stop
  when all tools are removed. For Anthropic responses, rewrite_anthropic_responses
  removes tool_use blocks, appends error text blocks and changes stop_reason from tool_use to
  end_turn. Keep all response conversion and rewriting below the streaming hook so the streaming
  path never depends on a later integration task.

  The async_post_call_success_hook processes complete responses; the streaming_iterator_hook
  buffers every chunk, detects whether the stream is OpenAI-style (assembled with stream_chunk_builder)
  or Anthropic SSE (assembled with assemble_anthropic_sse_stream), applies the same evaluation and
  rewrite helpers, and reconstructs the stream for output. Pass unrecognized non-raw chunks through;
  block and raise GuardrailRaisedException when an allegedly raw SSE stream is unparseable. The streaming
  path does not call should_run_guardrail locally; that check happens at the caller.

