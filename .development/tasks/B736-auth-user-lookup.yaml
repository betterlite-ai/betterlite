deviations:
  - what: Truthy non-mapping default_internal_user_params and non-finite or unrepresentable max_budget fail startup with the setting name instead of reaching a later Python mapping or database failure.
    why: Config is typed and money is Decimal; falsey-to-empty defaults and finite numeric conversions retain source behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks.py#L2679-L2697
  - what: A failed background SSO-ID write produces a redacted operation diagnostic and is drained at shutdown instead of an unhandled detached-task exception report.
    why: The async lifetime and secret-handling rules require an owned task; request success and write ordering stay unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks.py#L2576-L2582
