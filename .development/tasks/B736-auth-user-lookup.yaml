id: B736
title: User lookup, fuzzy identity matching and role permissions
description: >-
  Implement UserLookup in betterlite-auth::auth_user_lookup over B723 UserRepository, B733 AuthCache
  and B2315's deadline-bound user reads. Compose its public lookup services with B2318 MembershipLookup;
  the latter owns all membership loads and their shared-task lifetime. This task owns auth_checks.py
  L395-L396 and L2473-L2768, plus _types.py L5173-L5190 role permission contracts. It is a lookup
  service, not an independently registered authentication stage or HTTP route.

  get_user_object returns None for a None user_id before any cache/DB work; an empty ID is still a
  lookup. check_db_only defaults to None and otherwise follows its boolean value. Unless true, read
  the typed user cache under the exact requested ID. A hit runs null-email backfill and returns.
  These cache/backfill failures, and the subsequent No db connected error when a DB is needed,
  occur outside the catch block: do not log them as budget lookup failures or wrap them as missing
  users. A cache hit needs no DB unless email backfill can run.

  Keep the injected 100-entry last_db_access_time index with B125 LimitedSizeOrderedDict semantics.
  Keys are user_id:{requested_id}. _should_check_db samples the clock on every call, returns true
  for an absent entry or any stored non-None value, and suppresses only a stored None until elapsed
  time is >= db_cache_expiry. db_cache_expiry uses B735's DEFAULT_IN_MEMORY_TTL integer env setting,
  default 5 seconds; malformed/empty values fail startup, zero or negative expire immediately.
  Backward clock movement keeps a negative suppressed. Reading does not refresh the timestamp.
  Updates store (value,new_time); at capacity the source evicts the oldest entry even when updating
  an existing key. Positive values never suppress reads after the main cache misses.

  check_db_only=true bypasses both caches and forces the primary find_unique(user_id) to the writer,
  including organization_memberships. Otherwise cadence decides whether to make that bounded read.
  A primary miss calls fuzzy lookup: first exact sso_user_id when non-None, then case-insensitive
  user_email find_first when non-None. Empty strings are used, no trimming or uniqueness check is
  added, and the email query has no ordering. Fuzzy lookup uses normal repository routing even on
  a check_db_only request. It does not retry user_id with the SSO value or create users itself.

  A fuzzy email match with a non-None SSO ID schedules an update of that row's canonical user_id
  to the supplied sso_user_id. This overwrites an existing SSO ID without a compare-and-set and
  does not wait before returning. Track and drain this work through the injected server task owner;
  observe a failure without failing the completed lookup or exposing credentials. B2315 bounds
  reads only; normal repository write timeout applies to this update.

  If no response remains, user_id_upsert=false records a negative cadence entry only after a real
  attempted lookup, then raises B732 UserNotFoundError unchanged. A suppressed miss does not extend
  the negative window. user_id_upsert=true instead creates a user even if cadence skipped the read.
  Read litellm_settings.default_internal_user_params, default None, with source falsey-to-empty
  normalization. Omit only teams and available_teams from scalar defaults. Merge requested user_id,
  optional non-None user_email, then those defaults: defaults can override both identity fields,
  including an explicit null. Do not silently turn this into a safe-fields-only or caller-wins merge.
  Other fields use B720's user schema and repository create validation, including its errors.

  A non-None budget_duration with absent/null budget_reset_at is calculated by B2317 before create;
  a supplied reset time stays unchanged. Create includes organization_memberships, then call the
  DefaultTeamEnrollment port this task defines with the ORIGINAL requested ID/email and a B2314
  UserAPIKeyAuth having user_role=proxy_admin. The port stands for the source's
  check_if_default_team_set and add_new_user_to_default_team pair: B1226 implements it over the real
  team membership service and B056 installs it, so this lookup never depends on management writes.
  UserLookup takes the port in its constructor; NoDefaultTeams enrolls nobody and is the value used
  until B056 installs the real one, while tests here use a recording port. An error the port returns
  goes through this block's failure classification like any other create-path error, and the created
  row stays. Never replace enrollment with a direct array patch. No SSO ID is implicitly added to the
  create payload. There is no outer transaction over these steps.

  For a nonempty organization_memberships sequence, drop None entries and validate each remaining
  model_dump with B2310's membership model; preserve order and duplicates. None/empty sequences are
  left for B720's user model validation. Validate the whole response, run null-email backfill, take
  its model dump, write the typed user under the REQUESTED cache key with management TTL, then store
  that positive dump and a fresh timestamp in the cadence index. A canonical fuzzy ID can differ
  from this cache key. A failed cache write leaves prior user/team/backfill/SSO effects intact and
  does not publish a new positive cadence entry.

  Null-email backfill is skipped if the supplied email is None, stored email is non-None (including
  empty string), or DB is absent. Otherwise B723 performs its user_email IS NULL conditional write,
  then find_by_id using normal routing. A missing reread returns the original object. A returned
  row supplies ONLY the copied user_email, including a competing writer's value or replica-lagged
  null; do not assume the input email won. Write that shallow-copied user under its canonical ID
  with management TTL and return it. On a DB lookup this may precede a second cache write under
  the requested ID. Backfill performs no broad user overwrite.

  Inside the DB/upsert block, UserNotFoundError is rethrown without logging. Every other ordinary
  exception goes to B2315 _log_budget_lookup_failure("user",error). B1217's database-unavailable
  classification returns that same error unchanged; other errors become the source ValueError
  category explaining missing user and /user/new, with a typed retained cause and native wording.
  Cancellation propagates without being relabeled. This layer invents no HTTP status, type, param
  or code; B052/B765/B871 and management callers translate these distinguishable failures.

  general_settings.role_permissions defaults to None. RBAC_ROLES accepts only proxy_admin, team
  and internal_user; OIDCPermissions has models=None and routes=None, and RoleBasedPermissions
  requires role and forbids extra fields. Validate the ENTIRE configured list before selecting
  the first matching role. Duplicate roles and duplicate/empty string model/route entries remain
  in order; an earlier matching None or [] wins over later entries. No configured list or no match
  returns None. A bad later entry still fails even if an earlier one would match. The models/routes
  accessors share this selection; they do not expand route groups or check the model catalog.

  Both settings load through B002, including os.environ/ references; neither has a dedicated env
  variable. Keep type/unknown-field validation failures, not invalid_value_fallback. B1226 later adds
  the teams portion of default_internal_user_params to the config record defined here; this task
  only reads the scalar fields and leaves teams and available_teams out of the create payload. B002's unknown-config rejection still applies. Config parsing uses B002's existing decoder.
  Startup already validates role_permissions at proxy_server.py L6874-L6876. For dictionary user
  defaults, L6444-L6455 converts a non-None max_budget with float(), retains the other fields and
  emits a redacted DEBUG setting diagnostic. Accept finite numeric strings and source boolean
  zero/one through checked Decimal conversion; invalid text fails startup. Do not stringify or
  log the entire defaults record. Source falsey non-mapping defaults act empty during upsert;
  truthy non-mappings fail when the mapping operation is attempted. Native config rejects the
  latter at startup with the field name, as recorded below.

  Pure auth_user_lookup oracle cases call source cadence, role selection and error classification
  functions with controlled state/time. They never invoke asynchronous lookups through proxy globals.
  Native cache-port tests assert the effect trace; Postgres tests use B860 POSTGRES_TEST_URL, else
  testcontainers only when absent. Broken supplied URLs fail. Compare actual case-insensitive lookup,
  null-only update and create rows against independent pinned fixtures, including partial failures.
  B2318's separate task frees this one to budget 235 production, 350 tests, 90 adapters, 55 config
  and 45 wiring lines, 775 within 800, for 233 owned nonblank noncomment lines excluding docstrings.
