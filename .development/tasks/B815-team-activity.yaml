id: B815
title: Team daily spend and per-user activity
description: >-
  Implement the daily and per-user team spend routes with their shared scope resolver. Split truthy
  team_ids/exclude_team_ids on commas without trimming, deduplicating or discarding empty segments;
  falsey strings become null. B2314 admin-view callers bypass user membership checks. Other callers
  use B736 get_user_object with user_id_upsert=false and check_db_only=true; no row raises 404
  "User= ... not found". Omitted teams use user.teams; each explicit team outside that list raises 404
  "User does not belong to Team= .... Call `/user/info` to see user's teams". Organization-admin status
  alone adds no scope here. Cases raw_comma_filters, admin_view_all, missing_user and explicit_membership_404
  capture these rules with detail.error envelopes.

  Fetch team aliases with an IN filter only for a truthy team list, otherwise an unfiltered query;
  metadata contains team_alias even when null. For a non-admin with both nonempty requested teams and
  returned rows, require is_team_admin or explicit /team/daily/activity permission on EVERY returned
  team for full view. Otherwise fetch all caller keys and retain truthy tokens; even zero keys yields []
  as a restrictive filter. A truthy requested api_key must belong to that list or becomes []; a falsey
  key uses the whole list. Without restriction pass the input key unchanged. Missing team rows are not
  separately rejected by this loop. Cases all_teams_must_allow_full_view, own_keys_and_empty_keys,
  requested_key_intersection and empty_or_missing_team_rows test the exact behavior, including the
  absence of an org-admin shortcut.

  /team/daily/activity defaults every optional filter/date to null, page=1 and page_size=10 with no
  handler-level positive/max bounds. No DB produces 500 CommonProxyErrors.db_not_connected_error.
  After scope resolution call B3091 get_daily_activity with table_name="litellm_dailyteamspend",
  entity_id_field="team_id", alias metadata and the resolved include/exclude/key filters. B3091 owns
  daily date validation, pagination and timezone behavior; this route must not add a 400-day cap.
  Cases daily_defaults_and_forwarded_scope and daily_dependency_errors prove the call contract through
  HTTP. Neither route has management_endpoint_wrapper or a local catch/handle_exception_on_proxy call.

  /team/spend/by_user defaults team_ids/start_date/end_date to null. Check DB, then date range, then
  require truthy team_ids (400 "Please provide team_ids") before resolving scope. aggregated_date_range_error
  uses B3090 canonical YYYY-MM-DD parsing: missing dates -> "Please provide start_date and end_date",
  malformed -> "start_date and end_date must be valid YYYY-MM-DD dates", reversed -> "end_date must
  be on or after start_date", difference greater than 400 days -> "Date range must be at most 400 days".
  All are 400 detail.error. Exactly 400 days is allowed (401 inclusive calendar dates). Empty resolved
  teams return an empty tuple with original date strings and no SQL. Cases dates_before_team_scope,
  canonical_dates_and_400_boundary and empty_scoped_spend prove these branches.

  Own the parameterized _team_user_spend_sql, _TeamUserSpendDbRow and scope record declarations. Bind
  dates as $1/$2, team IDs from $3 and the optional user ID last. A non-null scope.api_key_filter, even [],
  selects sl.user=caller.user_id or ""; do not filter this query by API-key hashes. Read raw SpendLogs,
  left join users, include startTime >= start timestamp and < end timestamp + INTERVAL '1 day', group by
  team/user/email/alias and order spend DESC, team_id, user. Sum spend as float and tokens as bigint;
  count all requests, status='failure' failures and IS DISTINCT FROM 'failure' successes (including null).
  Retain null joined email/alias, convert null/empty user ID to "", and return a team alias only if its
  metadata value is a string. Cases spend_timestamp_edges, deleted_user_left_join, failure_status_counts,
  user_restriction_not_key_filter and deterministic_spend_order use actual Postgres rows. No new
  environment/config setting is read; B3094's team resolver and the B3096-B3098 routes can consume an injected scope/date
  service implemented here rather than importing these HTTP handlers back into their core query layer.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  _daily_activity_error (L6512-L6515; 4 source lines), resolve_team_daily_activity_scope (L6525-L6623;
  75 source lines), get_team_daily_activity (L6631-L6689; 55 source lines), aggregated_date_range_error
  (L6695-L6705; 11 source lines), _team_user_spend_sql (L6708-L6731; 24 source lines), get_team_spend_by_user
  (L6753-L6821; 63 source lines), _team_alias_or_none (L6824-L6826; 3 source lines).


  Register these actual HTTP routes and aliases exactly once: GET /team/daily/activity -> get_team_daily_activity;
  GET /team/spend/by_user -> get_team_spend_by_user. B001 cases compare JSON content-type, exact status
  and B003 type/param/code envelopes through B052 authentication. Test query effects with B860 fixtures
  using POSTGRES_TEST_URL when present or testcontainers otherwise; failures never silently skip.


  Sizing: 235 nonblank, noncomment function/SQL lines plus the scope and row declarations and 400-day
  constant at L6518-L6522, L6692 and L6734-L6745; allow 260 production, 400 behavior/Postgres tests,
  0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz and 0 config lines, 725 within a 750-line gate.


