  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L19949-L19953
    why: The public routers included on the app.
dod:
  - text: mount_public merges the provider routes, the docs router and the openapi_url route once each, all reachable without a key, with no fallback.
    proof: [public-tests, oracle]
  - text: The OpenAPI document is built once from the eleven LLM POST routes and the WebSocket routes and served at openapi_url, which OPENAPI_URL moves and NO_OPENAPI removes.
    proof: [openapi-tests, public-tests, oracle]
  - text: The six public and OpenAPI cases and the eight docs cases moved from B7740 match LiteLLM through the booted proxy.
    proof: [public-cases, oracle]
checks:
  optional: []
  commands:
    - id: openapi-tests
      why: the document inputs miss a route, a WebSocket stub or the root path
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::edge::openapi::/)'
    - id: public-tests
      why: a public route is missing, needs a key, is registered twice or carries a fallback
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::edge::tests::public_/)'
    - id: public-cases
      why: without new case files the oracle proof compares nothing for the mounted routes
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/edge/public tools/oracle/cases/docs)"
oracle_cases:
  - tools/oracle/cases/docs/swagger-at-root.yaml
  - tools/oracle/cases/docs/redoc-page.yaml
  - tools/oracle/cases/docs/oauth2-redirect-page.yaml
  - tools/oracle/cases/docs/swagger-asset-css.yaml
  - tools/oracle/cases/docs/swagger-asset-missing.yaml
  - tools/oracle/cases/docs/swagger-post-method.yaml
  - tools/oracle/cases/docs/no-docs-flag.yaml
  - tools/oracle/cases/docs/docs-url-with-root-redirect.yaml
  - tools/oracle/cases/edge/public/providers-list-no-key.yaml
  - tools/oracle/cases/edge/public/provider-fields-no-key.yaml
  - tools/oracle/cases/edge/public/endpoints-no-key.yaml
  - tools/oracle/cases/edge/public/openapi-default-url.yaml
  - tools/oracle/cases/edge/public/openapi-custom-url.yaml
  - tools/oracle/cases/edge/public/openapi-disabled.yaml
deviations:
  - what: The OpenAPI document lists only the eleven LLM API POST routes and the realtime and Responses WebSocket routes, without request body schemas.
    why: axum has no route introspection and no pydantic models, so the full route list and the request schemas need a route catalog no task builds yet (see the report notes). LiteLLM documents every registered route.
  - what: info.version in the document is the betterlite version.
    why: LiteLLM writes its own package version there.
out_of_scope:
  - "The handlers: B3190 (provider routes), B7740 (docs pages, assets, DocsEnv) and B123 (build_document and its parts). /public/agents/fields: B8647."
  - "A route catalog that documents every mounted route and the request body schemas: no owner yet, see the report notes."
  - "The edge layers and the UI static mounts: B8680. The Lens routes: B8682."
pitfalls:
  - Every route here is public in LiteLLM; merged through mount instead of mount_public it would answer 401 without a key.
  - docs_url defaults to "/", so GET / is the Swagger page, and the root redirect only exists when docs_url is not "/".
  - NO_OPENAPI removes the docs and ReDoc pages too, because FastAPI registers them only with an openapi_url.
  - Serve the same document bytes every time; LiteLLM caches the first build and never rebuilds it.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
