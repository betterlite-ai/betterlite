id: B308
title: Cooldown error policy and callback events
description: Implement cooldown policy over B011 error categories and B304's minute counters, using B307
  records. Add deployment-level and router-level allowed-fails policy configuration, failure-ratio evaluation
  with Decimal or integer cross-products, and typed cooldown events into B012. Keep policy and event notification
  separate so notification errors cannot alter the selected deployment or mask a provider error. Use the
  existing Rust crate boundaries from B004 and B008; integrate through the server when the provider dispatcher
  or callbacks live in another core crate. This task's source slices are the linked ranges, not a port
  of their Python classes. Add the listed oracle cases and the matching adapters to B301's component runner
  where state is not observable over HTTP; adapters call production logic and never reproduce it. Use
  deterministic candidate sets or supplied random samples for comparisons, and separate seeded distribution
  tests for random choices. Extend the existing config_yaml fuzz target and committed corpus for every
  newly accepted config form; unsupported keys still fail by full path. Keep the implementation, adapters
  and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/cooldown-policy/**
  - tools/oracle/src/router_probes/cooldown-policy/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/cooldown_policy.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/cooldown_handlers.py#L103-L424
  why: Deployment override, legacy threshold, failure-ratio and exemptions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/cooldown_handlers.py#L427-L671
  why: Store writes, counts and caller-timeout classification.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/cooldown_callbacks.py#L21-L97
  why: Cooldown event data.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(cooldown_policy)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/cooldown-policy/deployment-policy-over-router.yaml
- tools/oracle/cases/routing/cooldown-policy/allowed-fails-strict-boundary.yaml
- tools/oracle/cases/routing/cooldown-policy/429-multiple-versus-single.yaml
- tools/oracle/cases/routing/cooldown-policy/failure-ratio-minimum-samples.yaml
- tools/oracle/cases/routing/cooldown-policy/auth-and-notfound.yaml
- tools/oracle/cases/routing/cooldown-policy/caller-timeout-not-provider-failure.yaml
- tools/oracle/cases/routing/cooldown-policy/disabled-cooldown.yaml
- tools/oracle/cases/routing/cooldown-policy/single-event-per-failure.yaml
deviations: []
out_of_scope:
- Prometheus exporter implementation (B111).
pitfalls:
- allowed_fails is a strict exceeded threshold, not an at-least threshold.
- A caller's deadline and a provider's timeout do not always trigger the same cooldown.
- Avoid counting the same failed attempt in both fallback and callback paths.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
