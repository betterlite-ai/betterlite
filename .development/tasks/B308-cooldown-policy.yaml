id: B308
title: Cooldown error policy and callback events
description: 'Apply B369 CooldownDecision using B307 cooldown records and B304 deployment counters. Emit
  B012 typed cooldown events exactly once, keep notification failures from masking provider errors, and
  implement disabled-cooldown and debug snapshots. Prometheus export remains B111. Implement the owned
  native service in crates/betterlite-router/src/cooldown_policy.rs. Add ProbeOperation::CooldownPolicy in tools/oracle/src/router_probes/mod.rs
  and the corresponding B308 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_utils/cooldown_callbacks.py:
  router_cooldown_event_callback (L21-L78), _get_prometheus_logger_from_callbacks (L81-L97). Implement
  these behaviors through the typed Rust services above; synchronous facades and structural accessors
  reuse the same primitive instead of separate ports. Function coverage in litellm/router_utils/cooldown_handlers.py:
  _set_cooldown_deployments (L427-L489), _async_get_cooldown_deployments (L492-L515), _async_get_cooldown_deployments_with_debug_info
  (L518-L531), _get_cooldown_deployments (L534-L558). Implement these behaviors through the typed Rust
  services above; synchronous facades and structural accessors reuse the same primitive instead of separate
  ports.'
