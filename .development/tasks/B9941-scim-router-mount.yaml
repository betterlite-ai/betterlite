  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/scim/scim_v2.py#L262-L266
    why: The /scim/v2 prefix and the premium-user dependency the betterlite router leaves out.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_lazy_features.py#L281-L286
    why: LiteLLM includes scim_router in the app once, on the first /scim request.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/scim/scim_v2.py#L1407-L1417
    why: The two discovery base aliases, "" and "/" under the prefix, that the merge must keep as separate routes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/scim/scim_v2.py#L991-L1058
    why: Key blocking reads blocked as NULL, false or true and marks SCIM blocks with the scim_blocked metadata key, which the key overlay seeds.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/scim/scim_v2.py#L1610-L1616
    why: User directory reads order by created_at descending, so cases need distinct seeded timestamps.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/team.py#L19-L42
    why: A Member has optional user_id and user_email and a role of admin or user; members_with_roles holds a list of these.
dod:
  - text: scim_router merges the six route-set stubs and the group-patch stub, and routes.rs merges scim_router exactly once in router() before the auth layers.
    proof: [scim-mount, scim-mount-tests]
  - text: The merged router builds, and a /scim/v2 path no part serves answers the Not Found fallback.
    proof: [scim-mount-tests]
  - text: The fixture's scim seed writes the listed user, team and key columns onto seeded rows, reads them back from Postgres, and refuses overlays that name missing or repeated rows or a conflicting role.
    proof: [scim-seed-tests]
checks:
  optional: []
  commands:
    - id: scim-mount
      why: routes.rs does not merge scim_router once, or a route-set stub is missing or not merged in scim.rs, so a SCIM part would have to edit scim.rs or routes.rs.
      run: |-
        test "$(grep -cF 'scim_router(&state)' crates/betterlite-server/src/routes.rs)" = 1 || { echo "routes.rs must merge scim_router exactly once"; exit 1; }
        for module in scim_user_lifecycle scim_user_patch scim_group_lifecycle scim_directory_reads scim_discovery scim_placeholder_repair scim/group_patch; do
          name=${module#scim/}
          if ! grep -qF 'pub(crate) fn routes(' "crates/betterlite-server/src/$module.rs" || ! grep -qF "$name::routes(state)" crates/betterlite-server/src/scim.rs; then
            echo "route set $module is not a merged stub"
            exit 1
          fi
        done
    - id: scim-mount-tests
      why: The SCIM merge panics on a duplicate path, or an unserved SCIM path stops answering the Not Found fallback.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^scim::tests::/)'
    - id: scim-seed-tests
      why: The Postgres fixture cannot seed or refuse the SCIM user, team and key columns.
      run: cargo nextest run --locked -p betterlite-postgres-fixture --no-tests=fail -E 'test(/^scim::/)'
oracle_cases: []
deviations:
  - what: Authenticated SCIM requests reach provisioning and discovery without a license; stock open-source LiteLLM answers them with HTTP 403 from its premium-user dependency.
    why: The README makes every MIT feature available to every deployment and has no paid tier.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/scim/scim_v2.py#L262-L266
out_of_scope:
  - "Every SCIM handler: B1638 user lifecycle, B1639 user PATCH, B1640 group lifecycle, B1641 directory reads, B1642 discovery, B1643 placeholder repair and B064 group PATCH. Each fills its own stub and leaves scim.rs and routes.rs as they are."
  - "The Prisma client the oracle's LiteLLM needs to boot on a case database is B9942; the database handle betterlite routes read (shared.db) is B8610."
  - "SCIM_MAX_PAGE_SIZE at scim_v2.py L268 is B1641's, and every handler range is listed by owner in B064's out_of_scope."
pitfalls:
  - Merge, never nest. The parts register full /scim/v2 paths, so `Router::nest("/scim/v2", ...)` would double the prefix and hide every route.
  - Axum joins methods on one path only when the parameter names match; the parts must all use LiteLLM's {user_id} and {group_id}, so the stubs carry no paths that could fix a different name.
  - A stub routes function has a one-line body because its owner replaces it; do not prefill it with paths or handlers, and keep the `mutants::skip` attribute team_lists.rs carries.
  - The base seed inserts users and teams with default created_at, which both gateways see as different times; only the scim overlay sets them, and only through UPDATE after the base inserts.
  - members_with_roles defaults to '{}' in the baseline schema, but LiteLLM writes a JSON array, so the overlay always writes an array, even an empty one.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
