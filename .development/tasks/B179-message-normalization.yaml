id: B179
title: Shared message normalization and system placement
description: >-
  Add shared message normalization under betterlite-prompts/messages and /system using typed B004 message records
  extended with the content variants needed by these pure transforms. Implement the common conversions, search-result
  text extraction, role/name/internal-field filtering, continuation placement, prefix/system insertion, reasoning
  signature preservation, tool-message media hoisting and text-prompt bridge from the referenced common_utils.py
  slices. Keep each operation separately callable so provider adapters explicitly choose transforms and no global
  normalization changes every provider. Add the mid-conversation system-placement helper with typed model capabilities
  and compare original-versus-normalized message arrays in direct oracle cases. Preserve input values by ownership
  or an explicit snapshot, cap list sizes and output expansion, and extend chat_request corpus seeds for new wire
  variants. Budget 320 transform lines, 150 wire additions and 280 tests.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/lib.rs
  - crates/betterlite-prompts/src/error.rs
  - crates/betterlite-prompts/src/messages.rs
  - crates/betterlite-prompts/src/messages/**
  - crates/betterlite-prompts/src/system.rs
  - crates/betterlite-prompts/src/system/**
  - crates/betterlite-openai/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/messages/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L53-L487
  why: Shared text/content/role conversion and continuation handling.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L1699-L2143
  why: Internal fields, prefix/system insertion and reasoning handling.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L2146-L2321
  why: Media hoisting, tool references and consecutive system messages.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L2564-L2582
  why: Text prompt conversion and rejection of token prompts on the chat path.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/mid_conversation_system.py#L98-L418
  why: Leading and mid-turn system message placement.
dod:
- text: Every listed normalization operation matches the helper oracle, including tool/reasoning and mid-conversation
    system cases.
  proof:
  - oracle
- text: Transforming one provider's copy does not modify another call's input, and list/output limits fail by name.
  proof:
  - message-tests
- text: The extended wire variants are present in the chat parser replay corpus.
  proof:
  - chat-request-corpus
checks:
  optional:
  - mutants
  commands:
  - id: message-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/message_normalization|system_placement/)'
  - id: chat-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/messages/content-list.yaml
- tools/oracle/cases/helpers/messages/search-results.yaml
- tools/oracle/cases/helpers/messages/strip-internal.yaml
- tools/oracle/cases/helpers/messages/continuation.yaml
- tools/oracle/cases/helpers/messages/system-runs.yaml
- tools/oracle/cases/helpers/messages/mid-system-flagged.yaml
- tools/oracle/cases/helpers/messages/mid-system-unflagged.yaml
- tools/oracle/cases/helpers/messages/prefix-message.yaml
- tools/oracle/cases/helpers/messages/reasoning-signature.yaml
- tools/oracle/cases/helpers/messages/tool-media-hoist.yaml
- tools/oracle/cases/helpers/messages/text-prompt.yaml
- tools/oracle/cases/helpers/messages/token-prompt-rejected.yaml
deviations: []
out_of_scope:
- Model-file ID rewriting and media decoding are B183.
- Provider-specific tool exchange ordering is B180-B182.
pitfalls:
- A mid-conversation system message cannot simply be moved ahead of every earlier message.
- Do not erase encrypted reasoning signatures when extracting readable reasoning.
- Provider-specific transforms must be opt-in calls, not mutations performed by serde deserialization.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
