id: B4567
title: Codex catalog projection and fallback instructions
description: >-
  Build the codex_catalog module for betterlite-management-cli, translating LiteLLM's
  catalog projection to Rust. The module builds a Codex model_catalog_json that
  preserves installed metadata for known models, filters upgrade targets to served
  models only, and supplies fallback metadata plus base_instructions for unknown models.
  The catalog is built from the proxy's chat model listing and stock models from
  installed Codex, then serialized to JSON. A model the installed Codex knows keeps its
  full metadata from `codex debug models` output, but only the proxy decides priority
  (enumeration order), visibility, supported_in_api flag, and whether an upgrade target
  is listed (filtering to served models only). A model Codex does not know gets a
  fallback CodexModel entry with standard defaults plus the base_instructions asset so
  the agent always runs with a system prompt. An empty chat catalog returns None instead
  of an empty JSON object since Codex refuses an empty catalog. The base_instructions
  asset provides the fallback system prompt across all Codex versions, matching what
  Codex itself uses for unknown models.
scope:
  paths:
    - tools/management-cli/src/codex_catalog.rs
    - tools/management-cli/src/codex_catalog/tests.rs
    - tools/management-cli/src/codex_base_instructions.md
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/agents.py#L393-L507
    why: The complete catalog code with model classes, catalog entry builder and main catalog function.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/agents.py#L393-L427
    why: CodexTruncationPolicy and CodexModel classes defining fallback metadata schema.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/agents.py#L429-L458
    why: Stock model classes and catalog containers preserving Codex release schema.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/agents.py#L460-L478
    why: codex_catalog_entry builder dispatching on stock model availability and filtering upgrades.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/agents.py#L481-L505
    why: codex_model_catalog orchestration filtering chat models, building served set and final catalog JSON.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/codex_base_instructions.md#L1-L275
    why: The bundled base_instructions asset used for fallback metadata on unknown models.
dod:
  - text: >-
      CodexTruncationPolicy struct has mode="bytes" default and limit=10000 default;
      CodexModel struct has all fields including slug, display_name, priority,
      context_window, base_instructions with proper defaults matching Codex fallback behavior.
    proof: [catalog-schemas]
  - text: >-
      StockCodexUpgrade and StockCodexModel structs preserve Codex schema with serde
      default and unknown field handling so fields from future Codex versions ride
      along untouched.
    proof: [stock-schema-passthrough]
  - text: >-
      codex_catalog_entry returns a CodexModel for unknown models (stock is None)
      with slug, display_name, priority, context_window, base_instructions fields set
      from the listed model and provided instructions.
    proof: [unknown-model-entry]
  - text: >-
      codex_catalog_entry returns a modified stock model for known models, overwriting
      priority, visibility, supported_in_api, and upgrade fields while preserving all
      other stock fields untouched.
    proof: [known-model-entry]
  - text: >-
      codex_catalog_entry filters the stock model's upgrade field to None unless the
      upgrade target model slug is in the served frozenset, preventing upgrades to
      unavailable models.
    proof: [upgrade-filtering]
  - text: >-
      codex_model_catalog returns None if there are no chat models (empty catalog),
      never an empty JSON object {"models": []}.
    proof: [empty-catalog-none]
  - text: >-
      codex_model_catalog filters input models to only chat models where mode is None
      or in ["chat", "responses"], excluding all other modes.
    proof: [chat-filtering]
  - text: >-
      codex_model_catalog builds a frozenset of served model IDs from chat-mode models,
      used to filter upgrade targets so only accessible models can be upgrade destinations.
    proof: [served-set]
  - text: >-
      codex_model_catalog indexes stock models by slug to determine which proxy models
      have known Codex metadata, returning None for unknown models via get().
    proof: [stock-lookup]
  - text: >-
      codex_model_catalog returns the final catalog as JSON string via serde serialization.
    proof: [json-serialization]
  - text: >-
      Priority is assigned by enumeration index in the models sequence, so first chat
      model gets priority 0, second gets priority 1, preserving input order in the
      output catalog.
    proof: [priority-enumeration]
  - text: >-
      codex_base_instructions.md exists and is non-empty, providing the fallback system
      prompt asset bundled at build time for unknown models.
    proof: [base-instructions-asset]
