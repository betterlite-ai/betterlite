  optional: []
  commands:
    - id: catalog-schemas
      why: CodexTruncationPolicy or CodexModel do not have correct defaults or fields
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::schema_/)'
    - id: stock-schema-passthrough
      why: Stock model structs do not preserve unknown fields or schema matches LiteLLM
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::stock_schema_/)'
    - id: unknown-model-entry
      why: codex_catalog_entry does not create fallback entry for unknown models correctly
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::unknown_model_/)'
    - id: known-model-entry
      why: codex_catalog_entry does not copy and modify stock models correctly
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::known_model_/)'
    - id: upgrade-filtering
      why: Upgrade filtering does not check if upgrade target is in served models
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::upgrade_filter_/)'
    - id: empty-catalog-none
      why: codex_model_catalog does not return None for empty chat models
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::empty_catalog_/)'
    - id: chat-filtering
      why: codex_model_catalog does not filter to chat-mode models correctly
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::chat_filter_/)'
    - id: served-set
      why: Served models set is not built correctly from chat model IDs
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::served_set_/)'
    - id: stock-lookup
      why: Stock models are not indexed by slug for efficient lookup
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::stock_lookup_/)'
    - id: json-serialization
      why: Final catalog is not serialized to JSON correctly
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::json_serialize_/)'
    - id: priority-enumeration
      why: Priority is not assigned by enumeration index or order is not preserved
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_catalog::tests::priority_enum_/)'
    - id: base-instructions-asset
      why: codex_base_instructions.md does not exist or is empty
      run: test -f tools/management-cli/src/codex_base_instructions.md && test -s tools/management-cli/src/codex_base_instructions.md
oracle_cases: []
deviations: []
out_of_scope:
  - Model sync and discovery from the proxy. The models argument comes from B4566's
    fetch_model_listing or elsewhere in the sync path; this module consumes a pre-fetched
    list.
  - Stock model fetch from installed Codex. The stock argument is built by B4568's
    stock_codex_models function from Codex's debug output.
  - Codex executable or process launching. The catalog JSON is written to disk and
    passed as environment variable by callers in B4568.
  - The chat_models filter function and ListedModel type. Those are owned and defined
    by B4566.
pitfalls:
  - >-
    StockCodexModel and StockCodexCatalog must preserve all fields from the installed
    Codex version, including those added in newer releases. Use serde(flatten) or
    equivalent to allow extra fields so one catalog parses on all Codex versions;
    strict schema matching causes validation errors on older versions that do not
    provide defaults.
  - >-
    CodexModel must define every field required by Codex since model_catalog_json was
    added (0.105.0) so one catalog parses on all Codex versions. Missing fields cause
    validation errors when the catalog is loaded by older Codex versions.
  - >-
    An empty chat_models list returns None, never Some({"models": []}). Codex rejects
    an empty model list and this is the correct behavior when no chat models are served.
  - >-
    Priority is assigned by enumerate index starting from 0, so models[0] gets priority
    0 and models[n] gets priority n. The priority determines the order in Codex's model
    picker. Do not remap or sort after building.
  - >-
    The upgrade field is conditional: stock models keep their upgrade only when the
    target model slug is in the served frozenset. A known model with an upgrade pointing
    to an unavailable model has upgrade set to None. Filtering ensures the agent can
    only upgrade to a model that exists on the proxy.
  - >-
    Stock is a sequence that may not be ordered or unique by slug. If two stock models
    have the same slug (from corrupted Codex output), the index-based lookup returns
    the first match and others are overwritten during iteration. This is not an error;
    the catalog processes the first occurrence.
  - >-
    The instructions argument is the same for all fallback models, provided at catalog
    build time from codex_base_instructions.md. A model's prior context_window does not
    affect which instructions it receives; all unknown models get the same fallback text.
  - >-
    The served frozenset is built from chat_models IDs, so it includes only models in
    the chat list, not all input models. Upgrade targets are checked against this set
    so non-chat models cannot be upgrade destinations.
review_level: standard
