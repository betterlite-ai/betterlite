id: B8272
title: Serve model insights and task insights routes
description: >-
  Register `GET /model-insights` and `GET /model-insights/tasks` (no aliases) in betterlite-server and read their numbers from the `LiteLLM_DailyModelUsage` table. These two routes are the admin UI's Model Insights page backend. Files: `crates/betterlite-server/src/model_insights_routes.rs` and its folder for the routes and the shaping, and `crates/betterlite-db/src/model_usage_reads.rs` for the three grouped reads. B1734 owns the write side (`model_usage_rollup`) and the `ModelInsightTask` record plus `load_model_insight_tasks` with the twenty-entry task catalog; call those, do not rebuild them. The response records are this task's: `ModelInsightMetric`, `ModelInsightDailyMetric`, `ModelInsightDailyTotal`, `ModelInsightTaskSummary`, `ModelInsightsResponse` and `ModelInsightTasksResponse` (litellm/types/model_insights.py), with the field order LiteLLM prints. `pub fn routes()` is built like the sibling route modules; the architect mounts it.

  Constants (litellm/constants.py L1796-L1799): top models 10, max range 365 days, default task `uncategorized`.

  Window (`_resolve_window`, run in this order). (1) The caller's role must be `proxy_admin` or `proxy_admin_viewer`; any other role gets 403 `{"detail": "Only proxy admins can view deployment-wide model insights"}`. (2) No database gives 500 with the `db_not_connected_error` text (B003/B861 own the constant; reuse it). (3) `end_date` defaults to today in UTC; `start_date` defaults to end minus 364 days. A value that is not `YYYY-MM-DD` gives 400 `{"detail": "Dates must use YYYY-MM-DD"}` (end is parsed before start). (4) If start is after end, or the span in days (end minus start) is 365 or more, 400 `{"detail": "Date range must be between 1 and 365 days"}`. The date filter is `date >= start and date <= end`, on the stored ISO date text.

  `metric` is a query parameter with the values `requests`, `spend`, `tokens`; the default is `tokens` for `/model-insights` and `spend` for `/model-insights/tasks`. Another value is the usual 422 enum error. `start_date` and `end_date` are optional strings.

  `GET /model-insights`. Three grouped reads over the window, each summing `spend`, `prompt_tokens`, `completion_tokens`, `request_count`, `successful_requests`, `failed_requests`: (a) by `model_group`, `model`, `custom_llm_provider`; (b) by `date`, `model_group`, `model`, `custom_llm_provider`, ordered by date ascending, restricted to the deployments chosen in (a), and skipped (empty) when (a) returned no rows; (c) by `date` alone, over the whole window and ordered by date ascending. Rank the rows of (a) by the metric, highest first, and keep 10: `requests` ranks by request_count, `spend` by spend, `tokens` by prompt plus completion tokens. The sort is stable, so ties keep the database's row order. The response is `{start_date, end_date, daily, daily_totals, top_models}` in that order, with `top_models` and `daily` carrying `provider` (from custom_llm_provider) and `requests` (from request_count), and each daily row also `date`. `daily_totals` rows carry `date`, `spend`, `prompt_tokens`, `completion_tokens`, `requests` only.

  `GET /model-insights/tasks`. One grouped read by `task_type`, `model_group`, `model`, `custom_llm_provider` over the window. Group the rows by task type in first-seen order. For each task: its total is the sum of the metric over its rows; its leader is the row with the highest metric value (the first one wins a tie); `share` is total divided by the grand total times 100, or 0 when the grand total is 0. Sort tasks by total descending (stable on first-seen order). A task type found in the catalog takes its label and category; an unknown one is `Uncategorized` / `General` with the task_type replaced by the unknown value. Each summary is `{task_type, label, category, value, share, leader, provider}`, where leader is the leader row's model_group and provider is its custom_llm_provider. The response is `{start_date, end_date, tasks}`.

  The grouped reads sit behind a trait `ModelUsageReads` (three methods, typed rows, a window as two date strings) implemented in betterlite-db over sqlx against `LiteLLM_DailyModelUsage`; the route tests use a fake. Sums of an empty group read as 0. Use the integer and float types of the table's columns (B709 owns the schema) and convert as LiteLLM's float fields print.
