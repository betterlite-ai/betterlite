dod:
  - text: Both routes answer on exactly their paths for GET, need a valid key, and answer 403 for any role other than proxy_admin and proxy_admin_viewer.
    proof: [route-tests, oracle]
  - text: With no database the routes answer 500 with the db-not-connected text; the 403 check comes first.
    proof: [window-tests, oracle]
  - text: A bad date gives 400 "Dates must use YYYY-MM-DD", a reversed or 365-day-or-longer range gives 400 "Date range must be between 1 and 365 days", and the defaults are today in UTC and 364 days before.
    proof: [window-tests]
  - text: An unknown metric value gives the usual 422, and the metric defaults are tokens and spend for the two routes.
    proof: [window-tests, oracle]
  - text: The top 10 models are ranked by the chosen metric, daily rows cover only those models and are empty when there are none, and daily_totals cover the whole window.
    proof: [insights-tests]
  - text: Task summaries are ordered by total, carry share, leader and provider as described, and an unknown task type shows as Uncategorized / General with its own task_type.
    proof: [tasks-tests]
  - text: The grouped reads in betterlite-db sum the six columns per group, filter on the date window and the deployment list, and order by date where asked.
    proof: [reads-tests]
checks:
  optional: [mutants]
  commands:
    - id: route-tests
      why: a route path, method, role check or response shape is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_insights_routes::tests::route_/)'
    - id: window-tests
      why: the date window, the database gate or the metric parameter is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_insights_routes::tests::window_/)'
    - id: insights-tests
      why: top model ranking, the daily rows or the daily totals are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_insights_routes::tests::insights_/)'
    - id: tasks-tests
      why: task grouping, share, leader or the uncategorized rule is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_insights_routes::tests::tasks_/)'
    - id: reads-tests
      why: the grouped database reads are missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^model_usage_reads::/)'
    - id: new-cases
      why: the model insights routes have no HTTP parity case on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/model-insights)"
oracle_cases:
  - tools/oracle/cases/model-insights/auth-required.yaml
  - tools/oracle/cases/model-insights/no-database.yaml
  - tools/oracle/cases/model-insights/tasks-no-database.yaml
  - tools/oracle/cases/model-insights/invalid-metric.yaml
deviations: []
out_of_scope:
  - "ModelInsightTask, load_model_insight_tasks and the JSON catalog: B1734. The daily model usage upsert: B1734."
  - "The LiteLLM_DailyModelUsage migration: B709."
  - "The admin UI page that calls these routes: B146."
  - "Prisma's group_by itself and DailyModelUsageRepository (table_repositories.py): the typed reads in this task replace them."
pitfalls:
  - "The role check runs before the database check, so a non-admin with no database gets 403, not 500."
  - "Ranking is stable: two models with the same metric value keep the order the group read returned them in, so the read needs a fixed order for tests (order by the three key columns)."
  - "The daily read is filtered by an OR over (model_group, model, custom_llm_provider) triples, not by model_group alone; two providers behind one group name stay separate."
  - "daily_totals comes from its own read over every model in the window, not from the daily rows, so it still counts models outside the top 10."
  - "A task_type not in the catalog keeps its own task_type string in the summary while taking the Uncategorized label and General category."
  - "The span test is (end - start).days >= 365, so a 365-day request with start and end 364 days apart is valid and 365 days apart is not."
  - "daily_totals is a tuple in LiteLLM and prints as a JSON list; the fields spend and the token counts of the totals have no model fields."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
