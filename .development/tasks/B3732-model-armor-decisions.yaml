id: B3732
title: Model Armor configuration and verdict projection
description: >-
  Build Model Armor construction, sanitized error/log projections and filter-result decisions for blocking or de-identification. Preserve the default us-central1 location, recursive sensitive-content redaction and the source's distinct inspect/deidentify matching rules.

  Implement the core Model Armor guardrail type in betterlite-guardrails (or the designated guardrail crate) with Rust serde types matching LiteLLM's wire format. Build:

  - ModelArmorGuardrail: class constructor accepting template_id, project_id, location (default us-central1), credentials, api_endpoint, sanitize_error_detail and async_handler. Initialize as a CustomGuardrail subclass with VertexBase for credential resolution.
  - ModelArmorAPIError: exception type with sanitized detail field, raised on non-2xx responses.
  - ModelArmorGuardrailConfigModel: configuration record with template_id, project_id, location, credentials, api_endpoint, fail_on_error and sanitize_error_detail fields; ui_friendly_name returns "Google Cloud Model Armor".
  - _redact_scanned_content: recursive redaction of text/sanitizedText/findings/maliciousUriMatchedItems keys up to DEFAULT_MAX_RECURSE_DEPTH.
  - _extract_content_from_response: extract text from ModelResponse objects; return empty string for non-text types (TTS, images).
  - _build_api_error_detail: format API error messages with optional sanitization of raw response text.
  - _build_block_error_detail: format blocking decision details with optional armor_response inclusion.
  - _build_logging_response: redact sensitive scan data for logging.
  - _raise_if_fail_closed: raise ModelArmorAPIError when fail_on_error is true.
  - _should_block_content: check if armor response indicates content should be blocked based on filter result matches (RAI, PI/Jailbreak, Malicious URI, CSAM, Virus, SDP inspect/deidentify); allow_sanitization parameter gates deidentify blocking.
  - _get_sanitized_content: extract sanitized text from deidentifyResult when match is found, or from inspectResult fallback; return None if matching but no sanitized output.
  - _filter_result_items: flatten armor response filterResults from dict or list into list of filter entries.
  - _has_deidentify_match: check if any SDP deidentify filter matched.
  - _append_armor_response: accumulate scan responses (return single on first, list on subsequent) to preserve both file and text scan results.
  - update_litellm_params: preserve sanitize_error_detail on config updates.

  get_supported_event_hooks returns [pre_call, during_call, post_call, pre_mcp_call, during_mcp_call, logging_only]. get_config_model returns ModelArmorGuardrailConfigModel. No helper here calls file scanners, native hooks or stream executors.

