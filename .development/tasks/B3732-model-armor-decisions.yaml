pitfalls:
  - "The _redact_scanned_content function only redacts specific keys (text, sanitizedText, findings, maliciousUriMatchedItems); other keys pass through unchanged. Ensure the key set matches _SCANNED_CONTENT_KEYS exactly."
  - "The location parameter defaults to 'us-central1', not None. If location is not explicitly provided, this default must be applied during construction."
  - "The _should_block_content function's allow_sanitization parameter is a separate boolean gate for deidentify results. It is set based on mask_response_content or mask_request_content at the call site, not computed here."
  - "The _filter_result_items function normalizes both dict and list shapes to a single list. An empty filterResults dict returns an empty list, not a dict."
  - "The _has_deidentify_match function checks only sdpFilterResult.deidentifyResult.matchState == 'MATCH_FOUND', not other filter types. It is used separately from _should_block_content to determine if sanitization is required."
  - "The _append_armor_response function returns a list only after the second call. The first response object is returned as-is, and only on a second response is a list created. This is important for logging accumulation."
  - "Configuration fields like template_id, project_id and location must be set and validated by the caller before use. This task does not validate template_id format or project_id existence."
  - "The get_supported_event_hooks method lists all events the guardrail can be triggered on, but the actual event subscriptions are set in the constructor's event_hook parameter. Do not confuse these."

review_level: security

