  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L870-L898
    why: Authentication precedes enrichment stream startup.
dod:
  - text: Request policies and attachments apply once, remove inherited guards correctly and never leak the selection field to the provider.
    proof: [inference-transcripts, oracle]
  - text: Passing, blocking, missing-callback and replacement-chain pipelines have the pinned observable call order and client outcome.
    proof: [inference-transcripts, oracle]
  - text: Queued Responses defer scanning, completed retrieval reconstructs matching post-call pipelines only, and aliases/auth/header behavior remains visible.
    proof: [inference-transcripts, oracle]
checks:
  optional: []
  commands:
    - id: inference-transcripts
      why: helper parity alone cannot show that production hooks invoke the policy engine
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/policies/inference-http)"
oracle_cases:
  - tools/oracle/cases/policies/inference-http/dynamic-policy-and-strip.yaml
  - tools/oracle/cases/policies/inference-http/inherited-remove.yaml
  - tools/oracle/cases/policies/inference-http/pre-call-short-circuit.yaml
  - tools/oracle/cases/policies/inference-http/pre-call-block.yaml
  - tools/oracle/cases/policies/inference-http/pipeline-error-actions.yaml
  - tools/oracle/cases/policies/inference-http/post-call-chain.yaml
  - tools/oracle/cases/policies/inference-http/auth-before-policy.yaml
  - tools/oracle/cases/policies/inference-http/retrieval-post-call.yaml
  - tools/oracle/cases/policies/inference-http/retrieval-filtered.yaml
  - tools/oracle/cases/policies/inference-http/retrieval-pre-call-excluded.yaml
deviations: []
out_of_scope:
  - B1108 owns policy selection, B3247 execution, B8399 hooks, B8802/B8805 production adapters and B3269 retrieval reconstruction.
  - B9320 supplies shared state and typed config; B9321 mounts the management routes called by the auth transcript.
  - B8803/B8804 install the production pre-call step into the existing routes; B8636/B080 own Responses composition/handlers and B8993 native streaming rewrites.
  - B9322 proves config matching through inspection and B079 database-version changes; no implementation is re-owned here.
pitfalls:
  - Body-selected policies cannot govern a later GET that has no submission body; use a model attachment for retrieval parity.
  - The queued response must not claim post-call policy execution before the scanner has run.
  - pass_data false still propagates a post-call replacement to the next pipeline step.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
