id: B9323
title: Compare policy enforcement and background retrieval at the HTTP boundary
description: >-
  Add the missing inference evidence for policy helpers after B9320 connects their shared runtime. B1108 already
  selects policies, B3247 executes pipelines, B8399/B8802 assemble real hooks, and B8805 supplies B3269's retrieval
  adapter. B8803 installs the production step into chat and B8804 into Responses and retrieval; wait for those
  callers rather than only their port factory. Put ten ordinary HTTP cases under
  policies/inference-http, roughly 700-800 lines, with named OpenAI deployments, stable model_info.id, inert
  api_key and api_base {{upstream}}. Set general_settings.master_key oracle-master and router retries zero for
  deliberate failures. There is no database in this suite.

  Configure generic_guardrail_api guards at the scripted mock, with mode pre_call or post_call and default_on
  false. A scanner pass returns action NONE; a block returns action BLOCKED and blocked_reason; replacement
  content is in texts. Policies and policy_attachments are normal top-level config, with every pipeline step's
  guard also in guardrails.add. Never send _guardrail_pipelines, precomputed callback results or private registry
  metadata. Each transcript owns its entire starting config and compares the sequence of scanner/provider calls.

  dynamic-policy-and-strip.yaml attaches one policy only to a second model. A first request to another model
  selects it using request policies, calls its scanner and emits x-litellm-applied-policies without forwarding
  policies to the provider. A second request uses the attached model and repeats the policy name in its explicit
  list; it still applies once. inherited-remove.yaml attaches a child inheriting a parent's single guard and
  removing it; the provider runs with no scanner call. pre-call-short-circuit.yaml gives a two-step pipeline a
  first passing step with on_pass allow and proves only that step runs before inference. pre-call-block.yaml
  makes the first step block and proves no provider request occurs.

  pipeline-error-actions.yaml registers no guards, but declares a policy add name whose callback is missing.
  Compare the default on_error, which follows on_fail block, with explicit on_error next, which reaches the
  provider. Use two policy definitions in the same config and select each explicitly. post-call-chain.yaml uses
  a two-step post_call pipeline whose first scanner returns replacement texts, on_pass next and pass_data false;
  the second scanner sees the replacement and the client receives the final text. This flag gates pre-call
  propagation, not post-call replacement chaining. An extra standalone invocation of a pipeline-managed guard
  must fail upstream capture comparison.

  Distribute POST /v1/chat/completions, /chat/completions, /engines/{model}/chat/completions and
  /openai/deployments/{model}/chat/completions across the six inference cases. auth-before-policy.yaml sends no
  credentials to GET /policy/info/child, POST /policy/test and POST /policy/templates/enrich/stream; expect the
  shared 401 and no scanner/model traffic. Management paths have no versioned aliases. Check attribution headers
  x-litellm-applied-policies, x-litellm-applied-guardrails and x-litellm-policy-sources when present and their
  absence when filtered out. Preserve actual error shapes, including handlers that use detail instead of error.

  retrieval-post-call.yaml submits background true to POST /v1/responses. The mock first returns queued with a
  stable provider id; capture the encoded gateway id, then GET /v1/responses/{response_id} with a completed mock
  reply. A model-attached post_call pipeline must defer scanning and its attribution on the queued response, then
  scan and rewrite the completed retrieval once. retrieval-filtered.yaml makes the policy condition fail and
  observes no scanner call. retrieval-pre-call-excluded.yaml permits its configured pre_call scan on creation
  but proves that retrieval never reconstructs that pipeline as post_call. Spread /responses and
  /openai/v1/responses, and their /{response_id} GET aliases, across those last two cases. Use provider ids,
  not the litellm_poll_* Redis path. Requests contain no body-only dynamic policy override in the retrieval cases,
  since retrieval cannot reproduce that submission context.

  Run these as booted betterlite-versus-LiteLLM cases, with kind absent. Keep response status, content-type,
  stable JSON, provenance headers and provider method/path/auth/body compared. Captured ids are local to each
  gateway; ignore their individual output leaves and measured timestamps/durations only. Human error messages
  may be normalized at their exact leaves, while type, param, code and pipeline outcomes remain checked. Native
  helper tests retain malformed attached metadata, alias warnings and deduplication that would require injecting
  private request state. B8993 separately covers native streaming rewrites. This task adds no parser or fuzz code.
