id: B7811
title: MongoDB sidecar vector store
description: >-
  Build the MongoDB BETA sidecar vector store as pure typed functions in betterlite-openai, module mongodb_vector_store, over
  B1131 wire records (mongodb/vector_stores/transformation.py, 388 lines). The store is search-only and talks to a separate
  sidecar over HTTP. The caller (B1064 and B2484) embeds the query and sends the request, and passes MongoEnv with the
  sidecar key from MONGODB_SIDECAR_API_KEY. Every failure is one typed error enum, MongoDbError, with the variants BadRequest,
  Authentication, Timeout and ServiceUnavailable and the exact LiteLLM message for each. Each message names llm_provider
  "mongodb".

  Parameters. litellm_params is validated first. A non-null mongodb_connection_string fails with the message that tells the
  user to move it to MONGODB_CONNECTION_STRING in the sidecar. Any key that starts with "mongodb_" and is not one of
  mongodb_database, mongodb_collection, mongodb_text_field, mongodb_embedding_field, mongodb_num_candidates fails with
  "Unrecognised MongoDB vector store parameter(s): <sorted, comma joined>. Supported: <sorted, comma joined>." A non-empty
  extra_body fails. filters, ranking_options and rewrite_query each fail when not null. The remaining keys must parse as the
  typed view: litellm_embedding_model (string), litellm_embedding_config (map), the four mongodb_ strings and
  mongodb_num_candidates (integer), other keys ignored; a parse failure gives "Invalid MongoDB vector-store configuration.
  Check the database, collection, fields, and candidate count." Then require, in this order, mongodb_database,
  mongodb_collection, and litellm_embedding_model, each with its own message from the pin. Defaults: text field "text",
  embedding field "embedding".

  Limits. The query text is a string, or a list joined by one space; it fails when blank after strip ("query must not be
  empty") or longer than 32000 characters. max_num_results defaults to 10 and must be 1 to 50. num_candidates is the
  configured value (it must be at least the limit and at most 10000) or min(max(limit*10, 100), 10000). The timeout becomes
  timeout_ms: no timeout is 30000, a read timeout of a timeout object is used, a non-positive or non-finite value fails, and
  the result is max(1, int(seconds*1000)).

  Environment and URL. Headers need litellm_params (else "Configure api_base and api_key for the MongoDB BETA sidecar."),
  run the unknown-parameter check, take the explicit key else MONGODB_SIDECAR_API_KEY, and set Authorization "Bearer <key>"
  and Content-Type application/json over the given headers. The base URL must be http or https with a host, port other than
  0, and no user, password, query or fragment; plain http is allowed only for a loopback IP address (a name such as
  localhost is refused). The result has trailing slashes removed.

  Request. After the embedding comes back, it must have data and a non-empty vector of finite numbers. The request is POST
  {base}/v1/vector_stores/{id percent-encoded with nothing safe}/search with the body query, query_vector, mongodb_database,
  mongodb_collection, mongodb_embedding_field, mongodb_text_field, mongodb_num_candidates, max_num_results and timeout_ms.
  Response. decode_mongodb_search parses strict JSON with object "vector_store.search_results.page", search_query, and data
  rows that have score (number or null, finite), content ([{type "text", text}]), file_id and filename (string or null).
  Any mismatch gives the ServiceUnavailable message "MongoDB sidecar returned an invalid search response. Check the sidecar
  version and deployment." Error statuses: 400 gives BadRequest with the sidecar text, 401 "MongoDB sidecar rejected
  api_key." as Authentication, 408 Timeout with the sidecar text, anything else ServiceUnavailable "MongoDB sidecar is
  unavailable. Check its address, health, and logs." Create-store, its request and its response all fail with the search-only
  message. Endpoints are empty. Add a fuzz target for decode_mongodb_search. About 345 LiteLLM lines.
