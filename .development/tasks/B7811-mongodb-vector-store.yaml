deviations: []
out_of_scope:
  - B1064 and B2484 read MONGODB_SIDECAR_API_KEY, run the embedding through B1058 and B1059 executors, and send the HTTP request.
  - Turning MongoDbError into an HTTP status for the client is done by the caller that wires the provider. The error variants name the LiteLLM exception class.
  - The Mongo sidecar itself is not built.
pitfalls:
  - The parameter check order is connection string, unknown keys, extra_body, unsupported options, typed parse, then database, collection and embedding model. A test that sets two faults sees the first one only.
  - localhost is refused over http because only a literal loopback IP passes. 127.0.0.1 and ::1 pass.
  - get_error_class raises for every status and its 400 branch passes the sidecar text through unchanged, but 401 and 5xx replace it with a fixed message.
  - max_num_results of 0 or 51 fails before any embedding, and a configured mongodb_num_candidates below the limit fails too.
  - The vector is sent as a list of numbers, and an integer in the vector is valid.
budget: {max_changed_lines: 1500, max_new_expects: 1}
