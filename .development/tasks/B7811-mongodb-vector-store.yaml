    why: Request body, response validation, error mapping and the search-only create calls.
dod:
  - text: Parameter validation rejects the connection string, unknown mongodb_ keys, extra_body and the three unsupported options with LiteLLM's messages and order.
    proof: [mongodb-tests, oracle]
  - text: Query, limit, candidate count and timeout rules match, including the 32000 character cap and the 1 to 50 limit.
    proof: [mongodb-tests, oracle]
  - text: The sidecar URL accepts https and loopback http only and strips trailing slashes.
    proof: [mongodb-tests, oracle]
  - text: The search request has the nine body keys and a percent-encoded store id, and rejects an empty or non-finite vector.
    proof: [mongodb-tests, oracle]
  - text: Response decoding is strict and every sidecar status maps to the right error.
    proof: [mongodb-tests, oracle]
  - text: Sidecar response bytes replay through decode_mongodb_search without a panic.
    proof: [mongodb-corpus]
checks:
  optional: []
  commands:
    - id: mongodb-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^mongodb_vector_store::/) - test(replays_the_mongodb_vector_store_corpus)'
      why: Fixtures cover validation order, limits, URL rules, request body, response and error mapping.
    - id: mongodb-corpus
      run: test -f crates/betterlite-openai/fuzz/fuzz_targets/mongodb_vector_store.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/mongodb_vector_store)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_mongodb_vector_store_corpus)'
      why: Added corpus files replay through the strict response decoder.
