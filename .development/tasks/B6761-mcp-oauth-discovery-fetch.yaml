    why: authorization server metadata paths and issuer rule.

dod:
  - text: parse_www_authenticate returns the resource_metadata url for quoted and bare values and None otherwise, and never panics.
    proof: [discovery-parse-tests]
  - text: A resource_metadata url on another authority is not followed and logs a warning with redacted origins.
    proof: [discovery-parse-tests]
  - text: Each failure class (not found, http error, transport, invalid body) maps to its DiscoveryStatus and error text carries only redacted origins.
    proof: [discovery-fetch-tests]
  - text: Resource and authorization server documents are tried in the RFC order and parsed into MCPOAuthMetadata, with the issuer anchored variant failing on an issuer mismatch.
    proof: [discovery-flow-tests]
  - text: The Azure tenant fallback builds authorize and token urls from the tenant path.
    proof: [discovery-flow-tests]
  - text: The oauth_metadata fuzz target exists and its corpus replays without a panic.
    proof: [discovery-fuzz-replay]

checks:
  optional: []
  commands:
    - id: discovery-parse-tests
      why: header parsing or the same authority gate is missing or panics
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_discovery::tests::parse_/)'
    - id: discovery-fetch-tests
      why: a failure class is not mapped or the error text leaks a full url
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_discovery::tests::fetch_/)'
    - id: discovery-flow-tests
      why: candidate order, issuer anchoring or the Azure fallback is missing
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_discovery::tests::flow_/)'
    - id: discovery-fuzz-replay
      why: the fuzz target or its corpus is missing, or a seed makes a decoder panic
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/replays_the_oauth_metadata_corpus/)'

oracle_cases: []

deviations:
  - what: Network access is a MetadataFetcher trait and DiscoveryOutcome is a typed enum, not exceptions and httpx responses.
    why: the crate stays free of an HTTP client dependency and tests run offline; the architect wires betterlite-http.

out_of_scope:
  - "Retry delays, backoff, slot state, tasks and the 503 on failure: B6762."
  - "Trust rules for discovered endpoints (restrict_to_corroborated, carry forward, merge): B6760."
  - "The MCPOAuthMetadata record itself: B6590."
  - "canonicalize_url_identity and redact_mcp_resource_url: B4654."
  - "hydrate_config_server_dcr_client and invalidate_oauth_metadata_cache in discoverable_endpoints: no owner found, see the architect notes."

pitfalls:
  - "Only follow a 401 resource_metadata url when it has the same scheme, host and port as the server url; any other host is an SSRF vector."
  - "Treat 404, 405 and 410 as 'not here, try the next candidate', and every other non-2xx as an error that is recorded but does not stop the candidate loop."
  - "The issuer anchored fetch must not fall back to the server url, so a failed fetch leaves the endpoints None."
  - "Error text built from a transport error must pass through sanitized_error_text, since reqwest errors embed the full url with query."
  - "Path-aware candidates come before the root candidate for a server url with a path, and the path has its trailing slash removed."
  - "LITELLM_MCP_METADATA_TIMEOUT is read once into DiscoverySettings, an invalid or non-positive value falls back to 10.0."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
