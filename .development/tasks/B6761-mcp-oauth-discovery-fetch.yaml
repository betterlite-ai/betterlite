id: B6761
title: MCP upstream OAuth metadata discovery fetch
description: >-
  Build the code that fetches and parses OAuth metadata for an MCP server: the protected resource document (RFC 9728), the authorization server document (RFC 8414 and OpenID configuration) and the 401 WWW-Authenticate hint. In LiteLLM these are the `_fetch_*`, `_descovery_metadata` and `_attempt_well_known_discovery` methods of MCPServerManager. This task does the network step and the parse only. It decides nothing about retries, caching or when to run (B6762) and applies no trust rules (B6760).


  Code goes in the new betterlite-mcp module oauth_discovery: crates/betterlite-mcp/src/oauth_discovery.rs, oauth_discovery/** and tests beside each file. The record types are MCPOAuthMetadata (B6590, server_record). Network access goes through a trait port, MetadataFetcher, with one method get_json(url, headers) returning a FetchedDocument (status, headers, body bytes) or a FetchError. The architect wires the real implementation from betterlite-http (B171 async_safe_get and B173 pooled client) in the server. Tests use a fake MetadataFetcher that serves canned documents by url. A DiscoverySettings struct holds metadata_timeout, read from env LITELLM_MCP_METADATA_TIMEOUT with default 10.0 seconds, and the fetcher implementation applies it (the port takes a Duration argument).


  Items to build.

  1. `parse_www_authenticate` (`_parse_www_authenticate_header`): from a WWW-Authenticate value return the resource_metadata url if the header has a Bearer challenge with a resource_metadata="..." parameter, else None. Parameter names are case-insensitive, values may be quoted or bare. Never panics on bytes of any shape.

  2. `is_same_authority_metadata_url` (`_is_same_authority_metadata_url`): true when the candidate url has the same scheme, host and port as the server url (default ports normalized). A resource_metadata url from a 401 is only followed when this is true, and a mismatch logs one warning with both redacted origins (redact_mcp_resource_url from B4654).

  3. `fetch_oauth_discovery_url` (`_fetch_oauth_discovery_url`): GET one url through the port and return the parsed JSON object, or a DiscoveryStatus: NotFound (404, 405, 410), HttpError(status) for other non-2xx, Transport(text) for network errors, Invalid for a body that is not a JSON object. The error text goes through sanitized_error_text (`_sanitized_error_text`) which strips urls to redacted origins. `redacted_origin_list` (`_redacted_origin_list`) joins redacted origins of a url list with ", ".

  4. `fetch_oauth_metadata_from_resource` (`_fetch_oauth_metadata_from_resource`): fetch the protected resource document and return a ResourceMetadata with authorization_servers (strings only), scopes_supported and the resource field. `attempt_well_known_discovery` (`_attempt_well_known_discovery`): build the candidate list for a server url in the order RFC 9728 gives (path-aware /.well-known/oauth-protected-resource/<path> first, then root), try each, stop at the first success, and return the resource metadata plus the attempts made for logging.

  5. `fetch_authorization_server_metadata` (`_fetch_authorization_server_metadata`), `fetch_single_authorization_server_metadata` and `fetch_issuer_anchored_metadata` (`_fetch_issuer_anchored_oauth_metadata`): for an authorization server url try /.well-known/oauth-authorization-server then /.well-known/openid-configuration (path-aware forms first), and parse into MCPOAuthMetadata with authorization_url, token_url, registration_url, scopes (via extract_scopes from B6760), discovered_issuer and from_origin_fallback. The issuer anchored variant fetches only the configured issuer and requires the document's issuer to equal it with issuer_matches (B6760); a mismatch is a DiscoveryStatus::IssuerMismatch.

  6. `build_azure_authorization_server_metadata` (`_build_azure_authorization_server_metadata`): for a login.microsoftonline.com tenant authorization server that serves no metadata, synthesize the authorize and token urls from the tenant path.

  7. `discover_metadata` (`_descovery_metadata`) is the entry point and returns DiscoveryOutcome: Found(MCPOAuthMetadata), or a failure value carrying the DiscoveryStatus list for B6762 to classify as retryable or not. `discover_after_status_error` (`_discover_after_status_error`) handles a 401 from the server url by reading WWW-Authenticate and trying the hinted resource url. `discover_recording_attempts` (`_discover_metadata_recording_attempts`) is the same entry returning the attempts list, which B6762 uses to decide stale versus failed.

  8. Decoder safety: parse_www_authenticate and the JSON metadata decoder (a serde function that reads the document bytes) take outside bytes. Add a cargo-fuzz target `oauth_metadata` under crates/betterlite-mcp/fuzz/fuzz_targets/oauth_metadata.rs that feeds both, add the entry to fuzz/Cargo.toml (create the file if B4683 did not), keep the corpus in fuzz/corpus/oauth_metadata/** with at least five seeds, and add a test replays_the_oauth_metadata_corpus that runs every corpus file through both decoders and asserts no panic. Follow the layout of B4683.

  Tests: fake fetcher, synthetic hosts (idp.test, mcp.test), one test per status class and per candidate order.

scope:
  paths:
    - Cargo.lock
    - crates/betterlite-mcp/Cargo.toml
    - crates/betterlite-mcp/src/oauth_discovery.rs
    - crates/betterlite-mcp/src/oauth_discovery/**
    - crates/betterlite-mcp/fuzz/fuzz_targets/oauth_metadata.rs
    - crates/betterlite-mcp/fuzz/Cargo.toml
    - crates/betterlite-mcp/fuzz/corpus/oauth_metadata/**
  lint_tables: false

