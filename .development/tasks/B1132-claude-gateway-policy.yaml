pitfalls:
- 'The oracle helper for this task is pre-registered as claude_gateway_policy in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/claude_gateway_policy.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/claude_gateway_policy.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
