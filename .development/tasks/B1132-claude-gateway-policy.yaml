id: B1132
title: Claude gateway enable and settings policy
description: >-
  Load gateway enable/settings and expose the pure enabled guard used by Messages aliases and gateway routes, preserving
  each route's disabled response.


  Implement crates/betterlite-core/src/api/claude_gateway_policy.rs. Use ClaudeGatewayPolicyInput and ClaudeGatewayPolicyResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): gateway_endpoints.py:115 status_code=404, exception_detail=FastAPI detail string. Compare
  the actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions source_success, source_failure, source_defaults under api::claude_gateway_policy::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): general_settings.enable_claude_code_gateway
  defaults to false; general_settings.claude_code_gateway_managed_settings defaults to None. No environment reads
  occur outside betterlite-config. Test api::claude_gateway_policy::tests::loads_settings uses the production Config
  loader and an injected environment map, with a named rstest case for every key above, explicit override, unset/default
  and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key report;
  a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder rather
  than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ClaudeGatewayPolicy in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {claude_gateway_policy: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/anthropic_endpoints/gateway_endpoints.py: _general_settings (L101-L104); litellm/proxy/anthropic_endpoints/gateway_endpoints.py:
  _is_gateway_enabled (L107-L108); litellm/proxy/anthropic_endpoints/gateway_endpoints.py: ensure_gateway_enabled
  (L111-L115); litellm/proxy/anthropic_endpoints/gateway_endpoints.py: _managed_settings (L118-L122). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 14 owned nonblank/non-comment/non-docstring Python lines (14 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 34 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 284 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B171 (Direct helper oracle and URL
  path encoding), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
