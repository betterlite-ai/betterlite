dod:
  - text: >-
      logging_hook detects running event loops, runs async_logging_hook in ThreadPoolExecutor for nested
      contexts, and otherwise runs it directly in a new event loop.
    proof: [presidio-logging-hook-tests]

  - text: >-
      async_logging_hook masks input message content (string or list items) via concurrent check_pii calls for
      /chat/completions and /acompletion requests, and processes the result (ModelResponse or Anthropic dict).
    proof: [presidio-async-logging-tests]

  - text: >-
      async_post_call_success_hook applies output masking when apply_to_output=true, otherwise unmasks
      (when output_parse_pii=true) using pii_tokens from request_data metadata.
    proof: [presidio-post-call-hook-tests]

  - text: >-
      _is_anthropic_message_response returns true for dicts with type=="message" and content as a list,
      false otherwise.
    proof: [presidio-response-type-tests]

  - text: >-
      _process_anthropic_response_for_pii processes Anthropic content blocks with type=="text", applying
      check_pii (mask mode) or _unmask_pii_text (unmask mode) to text fields.
    proof: [presidio-anthropic-response-tests]

  - text: >-
      _process_response_for_pii processes ModelResponse choices for content (string or list items),
      tool_calls (function.arguments), and legacy function_call.arguments in both mask and unmask modes.
    proof: [presidio-model-response-tests]

  - text: >-
      _mask_output_response returns non-ModelResponse unchanged, skips ModelResponseStream, and calls
      _process_response_for_pii with mode="mask".
    proof: [presidio-mask-output-tests]

