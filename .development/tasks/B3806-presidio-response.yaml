id: B3806
title: Presidio response and logging transformations
description: >-
  Build Presidio response and logging transformations for chat, embeddings, images and
  Anthropic messages. The task covers logging-hook masking of input messages, selective
  output masking based on apply_to_output (default false from instance config), and
  unmasking via pii_tokens in request metadata. Preserve mask-output versus unmask-response
  policy, response-type-specific behavior and the source's truncated-token fallback for
  masked placeholders.

  Core methods:

  - `logging_hook`: Synchronous wrapper that schedules async_logging_hook on a new event
    loop, handling nested event loop detection (yields to ThreadPoolExecutor if a loop
    is already running).
  - `async_logging_hook`: For /chat/completions and /acompletion requests, gather
    concurrent check_pii calls for each message content (string or list items), replace
    masked content in-place, and process the response if present (ModelResponse or
    Anthropic native dict).
  - `async_post_call_success_hook`: Check apply_to_output setting; if true, delegate to
    _mask_output_response (chat) or _process_anthropic_response_for_pii (Anthropic).
    Otherwise, if output_parse_pii is true, unmask the response using tokens from
    request_data.metadata.pii_tokens.
  - `_is_anthropic_message_response`: Return true if the response is a dict with
    type=="message" and content is a list (Anthropic native message format).
  - `_process_anthropic_response_for_pii`: Iterate content blocks with type=="text",
    apply check_pii (mask mode) or _unmask_pii_text (unmask mode) to each text block.
    Logs debug message on missing pii_tokens for unmask operations.
  - `_process_response_for_pii`: For each choice in a ModelResponse, process message
    content (string or list items with text field), tool_calls (function.arguments
    field), and legacy function_call.arguments. Apply check_pii (mask mode) or
    _unmask_pii_text (unmask mode). Skips missing or non-string content.
  - `_mask_output_response`: Check response type; return non-ModelResponse unchanged.
    Skip ModelResponseStream. Call _process_response_for_pii with mode="mask".

  Settings and behavior: apply_to_output and output_parse_pii are instance fields
  resolved by the lifecycle task from request config. pii_tokens dict in
  request_data.metadata maps masked tokens to original text for unmasking. presidio_config
  is resolved from request_data via get_presidio_settings_from_request_data (B3805).

