deviations: []

out_of_scope:
  - "Analyzer and anonymizer calls, token mapping, and block exception handling (B3805)."
  - "Request-level presidio settings resolution and environment configuration (B3805)."
  - "PII token reversal fallback for truncated tokens (B3805 _unmask_pii_text)."
  - "Buffered streaming response assembly and Anthropic SSE reconstruction (B3807)."
  - "Stream chunk building via stream_chunk_builder from LiteLLM (B2227)."
  - "Framework metadata observation, guardrail scheduling and role predicates (U1)."
  - "apply_to_output and output_parse_pii resolution from request config (lifecycle/B108)."

pitfalls:
  - "logging_hook yields to ThreadPoolExecutor only when asyncio.get_running_loop() succeeds; RuntimeError from no running loop means safe synchronous execution."
  - "async_logging_hook maps responses back to message indices using task_mappings list; order must match the order tasks were appended or masking writes to wrong indices."
  - "Message content can be string (replace in-place) or list (replace each item's text field); non-string list items and missing text fields are skipped without error."
  - "async_post_call_success_hook checks apply_to_output first; if true, it delegates and returns early (no unmasking in that path). Only when apply_to_output is false does it check output_parse_pii."
  - "_process_response_for_pii uses getattr for optional fields (message, content, tool_calls, function_call); missing fields are silently skipped, not errors."
  - "_unmask_pii_text fallback for truncated tokens checks only the end of the text; it replaces at most one truncated match per token with min_overlap threshold."
  - "Anthropic message responses have type=='message' and content is a list; non-Anthropic dicts or dicts with different structure return false immediately."

review_level: standard

