dod:
- text: |-
    Pattern compilation reads prebuilt patterns from B3691 catalog or accepts custom regex,
    applies case-insensitive matching and keyword-context filtering when configured. Missing pattern_name
    for prebuilt patterns raises ValueError with message 'pattern_name is required for prebuilt patterns',
    missing pattern for regex patterns raises ValueError with message 'pattern is required for regex patterns',
    and unknown pattern_type raises ValueError with message 'Unknown pattern_type: {pattern_type}'.
  proof:
    - pattern-matching-tests
- text: Blocked-word YAML files with invalid per-word entries (missing keyword or action fields) log warnings
    and skip those entries without failing the load.
  proof:
    - pattern-matching-tests
- text: Blocked-word YAML files missing the blocked_words key raise ValueError with exact error message;
    missing files raise FileNotFoundError.
  proof:
    - pattern-matching-tests
- text: Overlapping pattern spans merge correctly before masking; no mask truncates or overlaps another.
  proof:
    - pattern-matching-tests
- text: Spelled-out digit sequences (zero, oh, one, two...nine) separated by space or hyphen convert to digit strings
    and match against regex patterns when allow_word_numbers is true.
  proof:
    - pattern-matching-tests
- text: Gap analysis between keyword and value spans rejects gaps containing digits or more than one word (MAX_KEYWORD_VALUE_GAP_WORDS=1),
    correctly allowing adjacent and single-space separators.
  proof:
    - pattern-matching-tests
- text: Wildcard asterisks in keywords escape to re.escape, then translate to .? for single-character matching;
    case-insensitive matching uses re.IGNORECASE.
  proof:
    - pattern-matching-tests
- text: Blocked-word YAML corpus files exist, are committed, and replay without panic.
  proof:
    - blocked-words-yaml-corpus
checks:
  optional:
    - mutants
  commands:
    - id: pattern-matching-tests
      why: the required pattern matching behavior tests fail or the filter selects no tests
      run: |-
        cargo nextest run --locked -p betterlite --no-tests=fail \
          -E 'test(/::pattern_matching_behavior($|::)/)'
    - id: blocked-words-yaml-corpus
      why: the blocked words YAML fuzz target or committed corpus is missing, or corpus replay fails
      run: |-
        test -f crates/betterlite/fuzz/fuzz_targets/blocked_words_yaml.rs && \
        test -n "$(ls -A crates/betterlite/fuzz/corpus/blocked_words_yaml)" && \
        cargo nextest run --locked -p betterlite --no-tests=fail \
          -E 'test(replays_the_blocked_words_yaml_corpus)'
