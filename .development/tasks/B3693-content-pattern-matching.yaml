deviations: []
out_of_scope:
  - Category keyword scanning and conditional sentence matching (_check_category_keywords, _check_conditional_categories), handled by B3694.
  - Phrase pattern matching (_check_phrase_patterns), handled by B3694.
  - Pattern action execution (BLOCK vs MASK decisions and HTTP responses), handled by B3695.
  - Final guardrail constructor, registration and initialization, handled by B105.
  - Image processing, tool argument filtering and competitor intent policy, handled by B3699.
pitfalls:
  - Pattern name lookups into PATTERN_EXTRA_CONFIG use case-sensitive string keys matching pattern_name exactly; prebuilt patterns always load through get_compiled_pattern.
  - Word-number conversion applies only when allow_word_numbers is true (per pattern in PATTERN_EXTRA_CONFIG); digits in gaps between keyword and value prevent matches.
  - Overlapping span merging must preserve order after sorting; masking applies redaction tags left-to-right without re-parsing redacted text.
  - Blocked-word YAML validation checks both the outer structure (blocked_words key) and per-entry presence (keyword/action); warnings on invalid entries do not stop the file load.
  - Keyword-to-regex pattern calls re.escape first, then replaces the escaped wildcard \* with .? (single-character match, not zero-or-more).
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 2
