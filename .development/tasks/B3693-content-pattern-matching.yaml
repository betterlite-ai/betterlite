id: B3693
title: Content pattern compilation and contextual span matching
description: >-
  Build pattern compilation for custom and prebuilt regex patterns, blocked-word file decoding
  and contextual span matching with nearby keyword context. Preserve case-insensitive matching,
  overlapping-span merging, wildcard keyword escaping (convert * to .? in regex), exact masking
  tag format strings, and spelled-out digit conversion (zero/oh → 0, one → 1, etc.). Span detection
  applies optional keyword-context rules: when a pattern has a keyword_pattern extra, a match
  counts only if a keyword match appears within a bounded token gap; word-number sequences matching
  the pattern are treated as additional matches when allow_word_numbers is true. Span merging
  removes redundant overlaps before masking, and gap analysis rejects gaps containing digits
  or more than one word between keyword and value spans. Write behavior rstest functions
  pattern_matching_behavior in adjacent tests.rs files, with a named case for each behavior
  and failure in the DoD; corpus replay tests have separate names.
scope:
  paths:
    - crates/betterlite/src/guardrails/pattern_matching.rs
    - crates/betterlite/src/guardrails/pattern_matching/**
    - crates/betterlite/fuzz/fuzz_targets/blocked_words_yaml.rs
    - crates/betterlite/fuzz/corpus/blocked_words_yaml
    - tools/oracle/cases/guardrails/pattern-matching/**
    - tools/oracle/helpers/b3693.py
    - tools/oracle/helpers/b3693/**
    - tools/oracle/src/helpers/server/b3693.rs
    - tools/oracle/src/helpers/server/b3693/**
  lint_tables: false
