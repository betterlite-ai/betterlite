deviations:
- what: redis-py version detection relies on hasattr(node_class, "update_active_connections_for_reconnect")
    rather than string version comparison; warning is emitted when redis.__version__ is
    not in _VERIFIED_REDIS_VERSIONS ({"5.3.1"}).
  why: The pinned checkout uses two code paths selected at factory runtime; betterlite emits
    a warning to users about untested versions but does not silently skip or disable the feature
    when installed redis-py differs from the verified set, preserving the policy from LiteLLM.
out_of_scope:
- Connection pool recovery and persistent retry logic beyond per-node disconnect; B4323
  and B4325 handle topology triggers and state recovery.
- Redis Cluster topology updates triggered by other mechanisms; B4323 owns client factory
  and pool construction that receive the returned class.
- Configuration and diagnostic output; B4323 constructs the client and provides settings.
