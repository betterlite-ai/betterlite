pitfalls:
- 'The oracle helper for this task is pre-registered as redis_cluster_node_isolation in the redis group. Replace the stub Op in tools/oracle/src/helpers/redis/cluster_node_isolation.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/redis_cluster_node_isolation.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The timeout-tolerant wrapper always re-raises every TimeoutError; what it suppresses
  is only the shared cluster-wide _initialize reinit flag for the first two consecutive
  timeouts per node (tracked in _litellm_consecutive_timeouts). The third and later consecutive
  timeouts on the same node drop the per-node counter and leave the reinit flag set, allowing
  upstream to proceed. Version branches are selected not by version string comparison but by
  testing for the update_active_connections_for_reconnect method.
- Consecutive timeout counts are tracked per-node (by name) in the newer branch; a successful
  command on a different node or on a later command must clear that node's counter, not all
  counters.
- MovedError and MOVED slot redirects trigger full-cluster reinitialization checks using reinitialize_counter
  and reinitialize_steps only when reinitialize_steps is nonzero; slots and their redirects are
  permanent topology updates, not transient node errors.
- TryAgainError after exhausting half the TTL (RedisClusterRequestTTL/2 elapsed retries) sleeps
  0.05 seconds, not a per-error sleep; this pattern is in the older 5.3.1 branch only.
- The overridden _execute_command methods mirror upstream redis-py protocol contracts and pass
  **kwargs through untouched; kwargs include internal redis-py request metadata, not user-facing
  betterlite configuration.
- Disconnect is await node.disconnect(), not node.close() or manual pooling. ClusterDownError
  and SlotNotCoveredError trigger full aclose(), not node disconnect.
- The factory function returns the selected subclass itself (not an instance), so test harnesses
  and adapters call it once at client construction, not per-command.
dod:
- text: Write tests named redis_cluster_node_isolation_behaviors and redis_cluster_node_isolation_boundaries
    under the redis_cluster_node_isolation module. The first asserts successful paths, redirects
    preserved, and per-node timeout counts; the second asserts version detection, protocol errors
    and boundary conditions (TTL exhaustion, reinit steps, read replicas). Use rstest cases
    for tables.
  proof:
  - cluster-isolation-behaviors
  - cluster-isolation-boundaries
- text: Every listed oracle case exercises the helper against the production redis-py library
    selected at runtime and asserts exact node isolation, redirect preservation, error classification
    and version-specific code paths. No test isolation means using real mock cluster fixtures
    or stubbed redis-py interfaces.
  proof:
  - oracle
- text: The task adapter invokes production helper logic and passes strict ruff/basedpyright
    without Any or broad suppressions.
  proof:
  - helper-python
  - oracle
