id: B4322
title: Isolate Redis Cluster node failures and preserve redirects
description: 'Implement the transport policy that confines transient failures to the affected
  Cluster node while preserving MOVED, ASK, CLUSTERDOWN and retry exhaustion. Cover both
  pinned library branches: older clients disconnect only the failed node, while the newer
  wrapper tolerates two consecutive node timeouts without erasing another request''s pending
  reinitialization. The two versions select at runtime by testing whether redis-py ClusterNode
  has update_active_connections_for_reconnect (8.x+) versus the 5.3.1 branch that requires
  an override copy. No configuration, environment, or external constructor calls. Preserve
  the RedisClusterRequestTTL loop semantics, slot-not-covered sleep duration, async sleep
  scaling and per-node timeout tracking across the two code paths. Implement the native betterlite-redis
  helper in tools/oracle/src/helpers/ (registration and naming deferred to the architect).
  Handle protocol mismatches between redis-py versions by emitting the version-unknown warning
  when pinned 5.3.1 differs from the installed library; omit silent fallback.'
scope:
