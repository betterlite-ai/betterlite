id: B8461
title: MCP upstream client creation and credential resolution
description: >-
  Build mcp::upstream_client in betterlite-server. It is the one place where the gateway turns an
  MCP server record into a connected client: LiteLLM's MCPServerManager._create_mcp_client and the
  methods it leans on. Listing (B8462, B8463), tool calls (B8465), the connection preview (B4730)
  and the health probes (B6592) all build their clients through it. Make it a struct
  UpstreamClients holding the credential provider (B4667), the OAuth discovery slots (B6762), the
  per-user env var reader (B4714's get_user_env_vars behind a trait so tests use a fake) and a
  clock, passed in by constructor.

  UpstreamClients also holds B8254's `JwtSignerSlot` and exposes `jwt_signer(&self) -> Option<Arc<McpJwtSigner>>`, the slot's `get` read on every call (LiteLLM's get_mcp_jwt_signer). B8462's tools/list JWT gate in _get_tools_from_server reads the signer there. This task signs nothing itself.


  create_client(server, mcp_auth_header, extra_headers, stdio_env, subject_token, auth, raw_headers,
  client_ip, protocol_override) follows _create_mcp_client step by step. Record AuthResolution
  unresolved through B8194's record_auth_resolution. Run B6762's ensure_oauth_metadata_discovered
  and use the returned record from then on. The protocol is the override, else the record's
  protocol_version. The transport defaults to sse. The spec is None for stdio, else B8460's
  spec_fail_closed. A spec is dropped (legacy path) when a mcp_auth_header is present and the spec
  config is not authorization_code, id_jag, passthrough or token_exchange. On the legacy path the
  auth value comes from B4662's resolve_mcp_auth and the header name from resolved_token_header.
  Sampling and elicitation callbacks come from B8191's legacy callbacks, only when allow_sampling or
  allow_elicitation is set on the record; the sampling callback carries the caller auth, raw headers
  and client ip as its operation context.


  stdio: when B4716's stdio policy is disabled, fail with 403 and MCP_STDIO_DISABLED_MESSAGE. The env
  is stdio_env, else a copy of the record's env; when there is an env without NPM_CONFIG_CACHE,
  add NPM_CONFIG_CACHE set to MCP_NPM_CACHE_DIR (default "/tmp/.npm_mcp_cache", B4744). The command's
  base name, lowercased, or the same name with one of .exe, .cmd, .bat, .com removed, must be in
  MCP_STDIO_ALLOWED_COMMANDS (B4716), else 403 with "MCP stdio command '<command>' is not in the
  allowlist (<sorted list>). Add it to LITELLM_MCP_STDIO_EXTRA_COMMANDS to allow this command.".
  A stdio config exists only when command is set and args is not None. Record not_applicable.


  HTTP with a spec: for a passthrough config, the inbound token is taken out of extra_headers with
  B8460's take_forwarded_authorization and replaced by B8460's passthrough_token(mcp_auth_header)
  when that is Some. Then resolve_v2_auth decides the credential, and B4667's prepare_mcp_client
  finishes the client. HTTP without a spec: aws_sigv4 servers get B4742's signer from the record's
  aws_* fields. The recorded source is aws_sigv4, then extra_headers when extra_headers already hold
  the auth header name (default "Authorization"), then per_request_header when mcp_auth_header is
  set, then static_token when there is an auth value, then extra_headers when any are present, else
  no_auth. The timeout is the record's timeout, else LITELLM_MCP_CLIENT_TIMEOUT (default 60.0, B4740).


  resolve_v2_auth runs B4667's resolve_credentials_with_source for the subject (caller auth plus
  subject token). On success, when the credential sets no named header or there are no extra
  headers, record extra_headers if the source was no_auth and extra headers exist, else the source,
  and return both. When the extra headers lack that header name, keep both. When they hold it, a
  token_exchange, authorization_code, id_jag or client_credentials config wins and that header is
  dropped from the extra headers; any other config yields no credential and keeps the caller's
  header, recorded as extra_headers. On failure record failed; an unauthorized error on
  authorization_code raises B4667's raise_user_oauth_challenge, on token_exchange
  raise_token_exchange_challenge with the error's claims, anything else raise_public.


  preflight_token_exchange runs only for oauth2_token_exchange with a bearer in oauth2_headers, or
  for oauth2_id_jag with no subject token. It resolves the record, needs a token_exchange or id_jag
  spec, raises the token-exchange challenge when token_exchange has no subject, then resolves the
  credential once and maps an error like resolve_v2_auth. has_user_oauth_token is false without a
  spec, else the provider's has_user_token.


  Static headers: references_user_env(server) is _references_per_user_env_var. static_headers is
  _resolve_static_headers_with_env_vars with B6594's parse_admin_env_vars, collect_env_var_references
  and interpolate_headers. Empty global values are ignored and globals win over user values. Only
  referenced user names that have no global value are loaded. With raise_on_missing (tool call) a
  load error propagates, missing names are re-read once with force_refresh, and names still missing
  raise B6594's MCPMissingUserEnvVarsError with the server id, server_name or name, the sorted names
  and build_env_var_setup_url. Without it (listing) a load error logs the warning
  "MCPServerManager: best-effort user env var load failed for server=<id>: <error>" and the
  available values are used. load_user_env returns empty for no auth record or an empty user_id,
  serves a cache entry younger than 60 seconds keyed by (user_id, server_id) unless force_refresh,
  fails with "MCP per-user env vars require a database connection, but none is configured. Connect
  a database to your proxy to use per-user MCP env vars." without a database, and writes the cache
  after a read. skip_blocked_stdio(server, listing) is true and logs at debug when the stdio policy
  blocks the server's transport.

