    - crates/betterlite-server/src/mcp/upstream_client.rs
    - crates/betterlite-server/src/mcp/upstream_client/**
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/cases/helpers/mcp-upstream-client/**
    - tools/oracle/helpers/b8461.py
    - tools/oracle/helpers/b8461/**
    - tools/oracle/src/helpers/server/b8461.rs
    - tools/oracle/src/helpers/server/b8461/**
  lint_tables: false

