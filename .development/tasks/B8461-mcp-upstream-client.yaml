  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L4659-L4665
    why: The stdio listing skip.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L6367-L6377
    why: has_user_oauth_token.

dod:
  - text: >-
      The stdio arm refuses a disabled gate and a command outside the allowlist with the Python's
      status and text, accepts a base name with a .exe, .cmd, .bat or .com suffix, and adds
      NPM_CONFIG_CACHE only when it is missing.
    proof: [upstream-client-tests, oracle]
  - text: >-
      resolve_v2_auth keeps or drops the caller's header and records the same AuthResolution as the
      Python for each config kind, and maps an unauthorized error to the matching challenge.
    proof: [upstream-client-tests]
  - text: >-
      The legacy path records aws_sigv4, extra_headers, per_request_header, static_token or no_auth
      in the Python's order.
    proof: [upstream-client-tests, oracle]
  - text: >-
      static_headers interpolates globals over user values, re-reads once before raising the
      missing-variable error on the call path, and stays best-effort on the listing path.
    proof: [upstream-client-tests]

checks:
  optional: []
  commands:
    - id: upstream-client-tests
      why: Client creation, credential choice or env var handling differs from the Python.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^mcp::upstream_client::/)'

oracle_cases:
  - tools/oracle/cases/helpers/mcp-upstream-client

deviations:
  - what: >-
      LiteLLM returns no sampling or elicitation callback when its installed mcp SDK lacks the
      feature (MCP_SAMPLING_AVAILABLE, MCP_ELICITATION_AVAILABLE). betterlite always has both, so
      the record's allow_sampling and allow_elicitation flags alone decide.
    why: The flags only report the Python SDK version; with a current SDK both are true.

out_of_scope:
  - invalidate_user_env_vars_cache is B4724's; the env var routes call it.
  - "MCPClient sessions and transports: B4744. prepare_mcp_client and the credential provider: B4667."
  - "ensure_oauth_metadata_discovered and the discovery slots: B6762. _remember_upstream_initialize_instructions: B6592."
  - The helper cases cover the pure decisions (stdio command check, legacy source order, v2 header keep or drop); the HTTP cases come with the MCP routes in B136.

pitfalls:
  - >-
    The stdio env copy happens only when stdio_env is None; a stdio_env passed in is changed in
    place by the NPM_CONFIG_CACHE insert, so build_stdio_env's result carries it to the retry.
  - >-
    record_auth_resolution is called with the original server id before discovery runs, and the
    final source is recorded on every return path, including stdio's not_applicable.
  - >-
    The allowlist error prints the sorted allowlist as a Python list, for example ['docker', 'npx'],
    so format it with single quotes and ", ".
  - >-
    A per-request mcp_auth_header drops the spec only for client_credentials and other configs
    outside the four named kinds; for a passthrough spec it becomes the inbound token instead.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
