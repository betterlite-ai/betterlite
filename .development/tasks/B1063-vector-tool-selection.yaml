  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_tool_selection::/)
      - test(/::replays_corpus$/)'
  - id: case-vector-tool-id-selection
    why: the vector-tool-id-selection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_tool_selection::tests::vector_tool_id_selection($|::)/)'
  - id: case-vector-tool-name-selection
    why: the vector-tool-name-selection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_tool_selection::tests::vector_tool_name_selection($|::)/)'
  - id: case-tool-call-vector-ids
