id: B1063
title: Consume recognized retrieval tools and select cached stores
description: >-
  Implement get_and_pop_recognised_vector_store_tools,get_vector_store_to_run,
  get_litellm_managed_vector_store_from_registry_by_name and pop_vector_stores_to_run_with_db_fallback
  as whole methods in core::api::vector_tool_selection. Use B1062 ordered registry operations, B1131
  tool records, B206 remove_items_at_indices and B726/B858 repository records. This code does no permission
  check; callers own authorization. It recognizes any tool with nonempty vector_store_ids when every
  id is present in memory, irrespective of tool type. Only then remove that tool from the original list.

  Pop non_default_params.vector_store_ids before reading tools. Preserve duplicate ids and request order
  in the consuming path; first-store lookup uses B1062's stable deduplicated ids instead. Copy selected
  records and merge tool params with stored litellm_params last. Revalidate database-owned cache entries
  against find_unique; config-owned entries skip that read. Deleted entries are evicted, then normal
  database fallback is still attempted. Failures to verify preserve stale cache entries with debug logs.
  No transaction or rollback spans these operations.

  B171 VectorToolSelection compares typed snapshots plus ordered scripted repository effects; no provider
  or route is called. Tests live under api::vector_tool_selection. The four methods contain 121 nonblank/
  non-comment lines; estimate 140 implementation, 155 tests, 95 adapters, 100 fixtures and 35 wiring/corpus,
  525 total under 560. There are no new settings or byte decoders.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_tool_selection.rs
  - crates/betterlite-core/src/api/vector_tool_selection/**
  - tools/oracle/src/helpers/core_ops/vector_tool_selection.rs
  - tools/oracle/src/helpers/core_ops/vector_tool_selection/**
  - tools/oracle/helpers/vector_tool_selection.py
  - tools/oracle/helpers/vector_tool_selection/**
  - tools/oracle/cases/helpers/vector-tool-selection/**
  - tools/oracle/fuzz/corpus/helper_case/vector_tool_selection-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L141-L213
  why: Complete tool consumption and first-store lookup differ in mutation and deduplication.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L250-L259
  why: Name lookup returns the first stored match without a database fallback.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L303-L385
  why: Whole consuming fallback method verifies cached database records and lets stored params overwrite tool params.
dod:
- text: >-
    recognized_tools_are_consumed starts registry=[vs_a,vs_b] and tools=[{type:custom,vector_store_ids:[vs_a],max_num_results:2},
    {type:file_search,vector_store_ids:[vs_a,unknown]},{type:file_search,vector_store_ids:[]}]. Only the first
    tool is removed; append vs_a to the supplied id list and return params_by_id.vs_a.max_num_results=2.
    All-or-nothing recognition keeps the mixed tool intact. Missing/empty tools yield {} without mutation.
    A later recognized tool for the same id replaces its parameter record, while its id is appended again.
  proof: [selection-tests, oracle, helper-python]
- text: >-
    selection_order_and_overrides starts ids=[vs_b,vs_a,vs_b,unknown] and a recognized vs_a tool with
    max_num_results=2,filters={tool:x}. Stored vs_a params={max_num_results:9,filters:{stored:y},api_key:k}
    win, producing those exact three fields. Returned stores follow vs_b,vs_a,vs_b,vs_a after the tool id
    append; unknown is skipped and vector_store_ids is removed from params. Registry records remain
    unchanged. Missing/null/empty top-level ids start []; absent/null stored params allow tool values.
  proof: [selection-tests, oracle, helper-python]
- text: >-
    first_store_and_name_lookup uses ids=[unknown,vs_b,vs_a] and returns the stored vs_b without popping
    params or tools. Name lookup for duplicate vector_store_name=notes returns the first record; a miss
    yields null and no database call. No selection method invokes the endpoint authorization checker.
  proof: [selection-tests, oracle, helper-python]
- text: >-
    cache_verification tests cached vs_a with is_config=true: no database verification. With false or
    missing flag, issue find_unique(where={vector_store_id:vs_a}). A returned row keeps the cached record,
    even if its database fields differ. Null evicts it, logs "Vector store %s found in memory but deleted from database, removing from cache",
    then performs B1062 fallback find_many(order={created_at:desc}); a found record is cached and selected.
    Verification exception logs "Error verifying vector store %s in database: %s" and still selects stale
    memory. Fallback exception logs "Error fetching vector store %s from database: %s" and skips the id.
    With no database, only memory participates. Duplicate ids can repeat verification calls.
  proof: [selection-tests, oracle, helper-python]
- text: >-
    tool_parameter_failure passes a recognized tool with rewrite_query=false. B1062 extraction raises
    TypeError before deferred tool removal, but the consuming method has already popped top-level ids
    and appended the recognized ids to its local list. Preserve those effects and propagate the exception;
    the hook caller B1077 owns its log-and-return fallback. Commit a new vector_tool_selection helper seed.
  proof: [selection-tests, oracle, helper-python, helper-corpus]
checks:
  optional: []
  commands:
  - id: selection-tests
    why: recognized-tool removal or cache verification changes ordered selection effects
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_tool_selection::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: selection snapshots are not compared to the actual pinned methods
    run: test -f tools/oracle/helpers/vector_tool_selection.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: new selection operations lack helper-case decoder coverage
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_tool_selection-*)" && grep -qE '^[[:space:]]+vector_tool_selection:' tools/oracle/fuzz/corpus/helper_case/vector_tool_selection-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
