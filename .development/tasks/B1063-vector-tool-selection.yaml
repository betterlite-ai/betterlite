id: B1063
title: Vector tool selection
description: >-
  Select vector stores from request tools/tool_calls and source defaults, including database fallback and name/ID
  lookup. Remove only recognized retrieval tools with typed diagnostics and return authorized selection inputs;
  preserve tool ordering and requested IDs for response metadata.


  VectorStoreRegistry.pop_vector_stores_to_run (litellm/vector_stores/vector_store_registry.py:L261-L301) has no
  MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior
  case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/vector_tool_selection.rs. Use VectorToolSelectionInput and VectorToolSelectionResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions vector_tool_id_selection, vector_tool_name_selection, tool_call_vector_ids,
  database_fallback, unknown_tool_kept under api::vector_tool_selection::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorToolSelection in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_tool_selection: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.get_and_pop_recognised_vector_store_tools
  (L141-L188); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.get_vector_store_to_run (L190-L213);
  litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.get_litellm_managed_vector_store_from_registry_by_name
  (L250-L259); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.pop_vector_stores_to_run_with_db_fallback
  (L303-L385). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 91 owned nonblank/non-comment/non-docstring Python lines (121 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 111 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 361 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1061 (Vector endpoint access), B1062
  (Vector store registry), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
