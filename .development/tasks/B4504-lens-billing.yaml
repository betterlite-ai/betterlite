  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/billing.py#L34-L98
    why: complete, the in-process request, ordering of authorize, reserve and pipeline, the cost header read, the 402 mapping and the reservation release in finally.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L3938-L3977
    why: authorize_internal_virtual_key, the port complete calls (owned by B052).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/budget_reservation.py#L468-L478
    why: release_unbound_budget_reservation skips a reservation marked callback_bound (owned by B3003).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/inference.py#L18-L87
    why: Deployment, Completion and Prices models, the system text, deployment_prices and quote.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/inference.py#L89-L154
    why: analyze up to the model call, the reserve transform, the request body and the scopes around complete.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/inference.py#L155-L184
    why: Result decoding, the settle transform and completion_charge.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/state.py#L17-L24
    why: current_job and replace_job as the reserve and settle transforms use them (built by B4500).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/endpoints.py#L446-L452
    why: The one call site of analyze (the worker model route, owned by B4505).
dod:
  - text: validate_key returns None for no key, rejects a blocked key and a session key with status 400 "Choose an active virtual key for Lens analysis", and passes the key id to the resolver unchanged.
    proof: [key-validation-tests]
  - text: complete builds the in-process POST /v1/chat/completions request with the exact headers, scheme, server and client address rules, and authorizes before it reserves and reserves before it runs the pipeline.
    proof: [internal-request-tests, completion-flow-tests]
  - text: The x-litellm-response-cost header is None for missing, empty and "None" values and a number otherwise, and a budget-exceeded error becomes status 402 with the budget detail.
    proof: [completion-flow-tests]
  - text: The budget reservation is released after success and after every failure unless it is marked callback_bound.
    proof: [completion-flow-tests]
  - text: quote follows the byte-length and rate formula, takes the highest tier rate across all deployments, and prefers custom rates over catalog prices.
    proof: [quote-tests, oracle]
  - text: The reserve transform rejects a missing, reassigned, wrong-worker or expired job with 409, rejects an over-budget estimate with 402 and accepts an estimate that exactly fills the budget.
    proof: [reservation-tests, oracle]
  - text: The settle transform replaces the estimate by the real cost on the job, adjusts spent only inside the reserved month, never goes below 0, and tolerates a missing job.
    proof: [settlement-tests, oracle]
  - text: completion_charge uses custom rates for a single custom-priced deployment, otherwise the computed cost when positive, otherwise the estimate; a billed header cost wins over both.
    proof: [charge-tests, oracle]
  - text: analyze fails with 503, 409 and 400 on its three early conditions and returns "{}" content for a missing or empty first choice message.
    proof: [analyze-flow-tests]
  - text: The request body carries the fixed model call settings, the system text and the lens, run, worker and team metadata.
    proof: [request-body-tests, oracle]
  - text: The Lens spend flag and the message-privacy scope are held around the chat call and dropped on success and on error.
    proof: [analyze-flow-tests]
  - text: The oracle adapter lints and type-checks.
    proof: [helper-python]
checks:
  optional: []
  commands:
    - id: key-validation-tests
      why: validate_key rules are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_billing::key_validation::/)'
    - id: internal-request-tests
      why: the in-process request shape is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_billing::internal_request::/)'
    - id: completion-flow-tests
      why: ordering, cost header, 402 mapping or reservation release is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_billing::completion::/)'
    - id: quote-tests
      why: the quote formula is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_inference::quote::/)'
    - id: reservation-tests
      why: the reserve transform is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_inference::reservation::/)'
    - id: settlement-tests
      why: the settle transform is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_inference::settlement::/)'
    - id: charge-tests
      why: completion_charge is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_inference::charge::/)'
    - id: request-body-tests
      why: the model call body is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_inference::request_body::/)'
    - id: analyze-flow-tests
      why: analyze early failures, scopes or the empty content fallback are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_inference::analyze::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4504)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4504 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4504/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/helpers/lens-billing/quote-single-custom-rates.yaml
  - tools/oracle/cases/helpers/lens-billing/quote-max-tier-rate.yaml
  - tools/oracle/cases/helpers/lens-billing/quote-multibyte-prompt.yaml
  - tools/oracle/cases/helpers/lens-billing/reserve-accepted.yaml
  - tools/oracle/cases/helpers/lens-billing/reserve-exact-budget-fits.yaml
  - tools/oracle/cases/helpers/lens-billing/reserve-over-budget.yaml
  - tools/oracle/cases/helpers/lens-billing/reserve-expired-lease.yaml
  - tools/oracle/cases/helpers/lens-billing/reserve-other-worker.yaml
  - tools/oracle/cases/helpers/lens-billing/reserve-new-month-resets-spent.yaml
  - tools/oracle/cases/helpers/lens-billing/settle-same-month.yaml
  - tools/oracle/cases/helpers/lens-billing/settle-other-month.yaml
  - tools/oracle/cases/helpers/lens-billing/settle-clamps-at-zero.yaml
  - tools/oracle/cases/helpers/lens-billing/settle-missing-job.yaml
  - tools/oracle/cases/helpers/lens-billing/charge-single-custom-rates.yaml
  - tools/oracle/cases/helpers/lens-billing/request-body-fields.yaml
deviations:
  - what: Money in the Lens records (spent, job cost, monthly budget, the estimate and the cost returned in ModelResult) is a Decimal, converted once from the f64 that the price formula produces.
    why: B4500 keeps all Lens money as Decimal. Cases use rates and prompts whose result is exact in both, so the oracle compares equal values.
  - what: A catalog price that is null for the above-200k or above-128k tier counts as 0.
    why: At the pin, Prices(float = 0) rejects the null that get_model_info puts in those keys, so a plain catalog model fails with a validation error (500). Treating null as 0 is the evident intent. A null or negative base input or output rate still fails, as status 500 with a typed error naming the model.
  - what: The in-process request is a plain struct passed to the chat pipeline, not an ASGI Request with a replayed body.
    why: There is no ASGI layer in betterlite. The observable parts (path, content-type, client address, scheme) are kept.
out_of_scope:
  - "ChatRunner implementation: B004 does not cover _handle_llm_api_exception, so it does not own it. B5102 owns only that handler's status mapping. No task owns the failure hook itself (limit release and failure recording), so the ChatRunner implementation owner must be named when the proxy chat route task is written; this task only calls the hook."
  - "Routes and access checks: B4503 owns the billing-key route that calls validate_key, B4505 owns the worker model route that calls analyze. This task registers nothing, so HTTP oracle cases come with those tasks."
  - "authorize_internal_virtual_key and its route, budget and rate checks: B052 owns them. Reservation counters and release_unbound_budget_reservation: B3003. This task only calls them."
  - "get_model_list, get_model_info and completion_cost: B844, B2225 and B068 own them. Message privacy scope: B188. The Lens spend flag: B4001. Client IP resolution: B743."
  - "Repository persistence and the version-checked update: B4501. Lens records and renew_budget, current_job, replace_job: B4500."
pitfalls:
  - A failed model call is not refunded. The estimate stays in spent and in the job cost when complete errors after the reserve step, because settle only runs after a successful call.
  - The reserve transform reads the clock a second time for the lease check, separate from the now used for the month. Use the injected clock twice, not one value.
  - The lease check is lease_until <= now means expired, so a lease that ends exactly now is rejected, while spent + estimate == monthly_budget is accepted.
  - The month used for settle is the now taken before the call, not the time of settling, so a call that crosses midnight at a month change adjusts only the job cost, not spent.
  - x-litellm-response-cost values "" and "None" mean no billed cost and fall through to completion_charge; a billed cost of 0 is a real value and is used as is.
  - completion_charge falls back to the estimate only when the computed cost is not greater than 0, and the custom-rate branch needs exactly one deployment with both rates set.
  - quote uses the UTF-8 byte length of prompt plus the system text, not the character count, and takes the maximum tier rate over every deployment, not the first one.
  - The key id handed to the authorizer is the stored hashed token, never a bearer value from the worker request, and the worker's own request headers are not forwarded.
  - content falls back to "{}" for a missing content and also for the empty string.
  - The user_api_key_team_id metadata key is null, not absent, when the billing key has no team, and the same team_id feeds get_model_list.
  - The reservation release in the finally step must also run when the authorizer or the reserve callback fails, and it must be skipped for a callback_bound reservation.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
