id: B4504
title: Authorize and charge Lens analysis calls
description: >-
  Build the two server modules that let a Lens worker spend money: lens_billing in crates/betterlite-server/src/lens_billing.rs
  and lens_inference in crates/betterlite-server/src/lens_inference.rs (a folder of submodules each, with adjacent tests.rs files).
  Both sit in betterlite-server because they need key auth, the chat pipeline and the router, and betterlite-server is the top crate.
  Add betterlite-lens to the server's Cargo.toml (no cycle: betterlite-lens depends on no betterlite crate). The Lens records come from B4500
  (Lens, Job, Worker, ModelRequest, ModelResult) and the pure job helpers renew_budget, current_job and replace_job come from B4500 too.
  Repository writes go through B4501's LensRepository.update(lens_id, transform), which returns None when it could not apply the transform
  after its own retries. B4503 and B4505 are the callers: B4503 calls validate_key when a billing key is assigned to a worker, and B4505's
  worker model route calls analyze. This task registers no route.

  Every outside service comes in through a trait on the struct's constructor, so tests use fakes. Ports: KeyResolver (B870 IdentityStore.resolve
  by hashed token, giving the resolved key with blocked, is_session_token and team_id), InternalAuthorizer (B052's internal-job adapter,
  authorize_internal_virtual_key, which resolves the stored key hash and runs the route and budget checks as if the key had called
  /v1/chat/completions), ChatRunner (the B014 chat dispatch plus the B004 chat route's error mapping, returning the validated completion and
  the value of the x-litellm-response-cost response header), ReservationReleaser (B3003 release of an unbound budget reservation),
  ClientIp (B743 get_mcp_client_ip), ModelCatalog (B844 get_model_list(model_name, team_id)), ModelPrices (B2225 get_model_info) and
  CostCalculator (B068 completion_cost, with the optional custom per-token rates). The Lens flag that marks spend rows as Lens traffic is
  the B4001 lens_analysis scope and the B188 inherit_message_logging_privacy(true) scope: hold both around the chat call and drop them after it,
  on success and on error.

  lens_billing::key_validation: validate_key(resolver, key_id: Option<&str>). None returns None. Otherwise resolve the key by the hashed token
  as given (never hash it again). A key with blocked = true or is_session_token = true fails with status 400 and detail
  "Choose an active virtual key for Lens analysis". A resolver error propagates unchanged.

  lens_billing::internal_request and lens_billing::completion: complete(key_id, data, reserve, incoming) returns (the completion, Option<f64> billed cost).
  It builds an in-process request: method POST, path /v1/chat/completions, empty query, one header content-type: application/json, scheme taken from the
  incoming request (default "http"), server litellm.internal:80, client address = ClientIp of the incoming request paired with the incoming request's port (0 when
  the incoming request has no client), and no client when ClientIp is empty. The body is data serialized as JSON. Then, in this order: authorize the key with
  InternalAuthorizer, await the reserve callback, run the chat pipeline with route type acompletion, read the x-litellm-response-cost header. The billed cost is
  None when the header is missing, "" or "None", otherwise the parsed f64 (an unparsable value is an internal error, status 500). A budget-exceeded error from any step before or inside
  the pipeline becomes status 402 with detail "The analysis key or its owner has reached a budget limit". Any other pipeline error goes through ChatRunner's failure
  hook (which releases rate limits and records the failure) and then propagates. In every case, success or not, after the call finishes release the request's budget reservation
  through ReservationReleaser unless the reservation is already marked callback_bound (a bound reservation is settled by the logging callbacks).

  lens_inference::request_body: the fixed system text _SYSTEM (copy the five sentences exactly from the reference) and build_request(model, prompt, lens id, run id, worker id, team id)
  giving the JSON body: model = job.settings.model; messages = [system message, user message with the prompt]; max_tokens 4096; stream false; timeout 120; num_retries 0;
  disable_fallbacks true; response_format {"type": "json_object"}; metadata {tags: ["litellm-lens"], lens_id, lens_run_id (the job id), lens_worker_id, user_api_key_team_id (null when the key has no team)}.

  lens_inference::quote: Deployment (litellm_params.model, optional input_cost_per_token and output_cost_per_token; other fields ignored), Prices (input and output cost per token, each >= 0,
  plus the four above_200k and above_128k tier rates defaulting to 0) and deployment_prices(deployment): when both custom rates are set use only those two (tiers 0), otherwise take the
  ModelPrices answer for litellm_params.model. quote(deployments, prompt) is ((utf8 byte length of prompt + _SYSTEM) + 1024) * input_rate + 4096 * output_rate, all times 2,
  where input_rate is the maximum over all deployments of the maximum of the base, above-200k and above-128k input rates, and output_rate is the same for output. Compute in f64 as the source does,
  then convert the final value once to the Decimal the Lens records use (see deviations).

  lens_inference::reservation: reserve_transform(lens, job_id, worker_id, estimate, now_for_month, clock) applied inside LensRepository.update. Renew the budget month with renew_budget(lens, now_for_month) (now_for_month is the time taken before the call), find current_job, and fail
  with status 409 "Job was cancelled or reassigned" when there is no active job, its id differs, its worker_id differs, its lease_until is None, or lease_until is not after the clock's current time (read the clock again here, not now_for_month).
  Fail with status 402 "Monthly lens budget reached; increase it or wait for next month" when spent + estimate is greater than settings.monthly_budget (equal passes). Otherwise add estimate to the job's cost and to the lens's spent and return the lens
  through replace_job. The reserve callback passed to complete runs this through the repository and fails with status 409 "Could not reserve analysis budget" when update returns None.

  lens_inference::settlement: settle_transform(lens, job_id, estimate, cost, now_for_month): spent becomes max(0, spent - estimate + cost) only when lens.budget_month equals now_for_month's "%Y-%m"; the job with job_id, if it still exists in lens.jobs, gets cost max(0, cost_before - estimate + cost).
  A missing job leaves jobs unchanged. The result of the settle update is ignored, as in the source.

  lens_inference::charge: completion_charge(deployments, response, estimate). When there is exactly one deployment and it has both custom rates, return CostCalculator.completion_cost with that model and those two rates. Otherwise compute completion_cost with no custom rates and return it when it is greater than 0, else return the estimate.

  lens_inference::analyze(repo, lens, job, worker, body, request) ties it together. Steps, with the status and detail of each failure: no router configured gives 503 "No analysis models are configured"; worker.analysis_key_id None gives 409 "Assign an analysis key to this worker in Lens setup";
  validate_key on that id; team_id from the validated key; ModelCatalog.get_model_list(job.settings.model, team_id) as Deployments, and an empty list gives 400 "Analysis model is no longer available"; estimate = quote(...); take now (UTC); build the body; run complete under the Lens and privacy scopes with the reserve callback;
  decode the completion (extra fields ignored, choices needs at least one entry, message.content optional); cost = billed cost if present, else completion_charge; run settle through repo.update; return ModelResult with content = first choice content, or "{}" when it is missing or the empty string, and the cost.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/lens_billing.rs
    - crates/betterlite-server/src/lens_billing/**
    - crates/betterlite-server/src/lens_inference.rs
    - crates/betterlite-server/src/lens_inference/**
    - tools/oracle/cases/helpers/lens-billing/**
    - tools/oracle/helpers/b4504.py
    - tools/oracle/helpers/b4504/**
    - tools/oracle/src/helpers/server/b4504.rs
    - tools/oracle/src/helpers/server/b4504/**
  lint_tables: false
references:
