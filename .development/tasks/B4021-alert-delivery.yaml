dod:
  - text: Squash payloads by (URL, alert_type, text) and preserve count of identical alerts.
    proof: [alert-batching-tests]
  - text: First item in each squash group determines the formatted message and headers used in the webhook POST.
    proof: [alert-batching-tests]
  - text: Webhook delivery returns success only on HTTP 200 status and logs debug messages on errors.
    proof: [alert-batching-tests]
  - text: Transport errors are caught and logged at debug level, not propagated; console logging happens in finally.
    proof: [alert-batching-tests]
  - text: Teams Adaptive Cards use version 1.4 with a single TextBlock body element containing the alert text.
    proof: [alert-teams-tests]
  - text: MS_TEAMS_WEBHOOK_URL is resolved from environment and logs error with drop on missing value.
    proof: [alert-teams-tests]
  - text: WEBHOOK_URL is resolved from environment and raises Exception on missing value.
    proof: [alert-delivery-tests]
  - text: Digest entries retain first message, severity level, webhook URL and start timestamp.
    proof: [alert-digest-tests]
  - text: Digest buckets flush when interval since start_time exceeds alert_type_config.digest_interval.
    proof: [alert-digest-tests]
  - text: Flushed digests render a formatted summary with start/end times, alert type, level, count and original message.
    proof: [alert-digest-tests]
  - text: Periodic flush task is created lazily on first send_alert call (when alerting is non-empty) or on update_values, not on SlackAlerting init.
    proof: [alert-delivery-tests]
  - text: Periodic flush runs digest bucket draining then queue flush on a timed interval.
    proof: [alert-delivery-tests]
  - text: async_send_batch concurrently sends squashed alerts via AsyncHTTPHandler.post and clears the queue.
    proof: [alert-batching-tests]
  - text: Teams and Slack alerts can squash together when URL, type and text match, because format is not part of the key.
    proof: [alert-batching-tests]
