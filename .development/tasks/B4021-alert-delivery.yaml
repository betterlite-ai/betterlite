    - id: alert-teams-tests
      why: Teams payload building or webhook URL resolution tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^alert_teams::/)'
    - id: alert-digest-tests
      why: digest bucket management or flushing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^alert_digest::/)'
    - id: alert-delivery-tests
      why: periodic flush, async batch sending or webhook alert delivery tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^alert_delivery::/)'
oracle_cases: []
deviations:
  - what: WebhookEvent carries budget spend data (spend, max_budget, soft_budget) and a hashed key token; webhook POST serializes all fields to JSON and sends to an externally configured URL.
    why: B4021 delivers structured budget webhooks to external endpoints specified by configuration; this is a data exposure path requiring security review.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1193-L1222
  - what: Digest formatted messages include PROXY_BASE_URL as a footer when set, matching the source behavior.
    why: B4021 renders digest summaries directly and must preserve the source's formatting including optional PROXY_BASE_URL.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1643-L1645
  - what: Batch transport errors are caught broadly and logged at debug level; the alert queue clears regardless.
    why: LiteLLM swallows all delivery errors to avoid blocking the main request path, and console emission in finally ensures observability.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/batching_handler.py#L73-L76
out_of_scope:
  - Alert production and alert type decisions are owned by B4025-B4030.
  - Alert destination selection and filtering before delivery are owned by B4024.
  - Webhook event record definitions and validation are owned by B4020.
  - Async HTTP transport is owned by B173; this task uses its AsyncHTTPHandler.post method.
  - Custom batch logger queue management and flush_queue callback are owned by B256; this task calls it.
  - Timer task startup, admission and drain are owned by B191; this task uses its facilities.
pitfalls:
  - "Squash key (URL, alert_type, text) does not include format, so Teams and Slack can squash together when their text matches."
  - "Squashing over reversed(queue) with a dict comprehension keeps the first-enqueued item's headers for each key (last write wins in the reversed iteration is the oldest original item), matching DoD item 2."
  - "HTTP 200 is the only success code; response.status_code != 200 is logged and treated as failed delivery."
  - "MS_TEAMS_WEBHOOK_URL missing is an error log and silent drop; WEBHOOK_URL missing is an Exception that raises."
  - "Digest start_time is set when first alert enters a bucket; elapsed seconds are compared against AlertTypeConfig.digest_interval."
  - "Periodic flush runs on a fixed interval set by SlackAlerting.flush_interval; digest draining is before queue flush each cycle."
  - "Digest entries preserve webhook_url as-is (string or list); the formatter must handle both without coercion."
  - "Console logging payload contains the formatted message with count prefix, not the original event; log_to_console guards it."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
