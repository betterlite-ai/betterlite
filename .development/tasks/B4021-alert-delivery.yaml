id: B4021
title: Batched Slack and Teams delivery and digest flushing
description: >-
  Build batched alert delivery to Slack, Teams and webhooks with squashing by URL/type/text.
  Implement the batching handler with payload squashing, first-item headers preservation, HTTP-200-only
  success checks, swallowed batch transport errors and console emission in finally blocks.
  Build MS Teams Adaptive Card generation with version 1.4, using environment variable resolution
  for webhook URLs with loud failures on missing WEBHOOK_URL and logging-only drops for missing
  MS_TEAMS_WEBHOOK_URL. Build structured budget webhooks with WEBHOOK_URL resolution.
  Implement digest bucket management: timed digest draining with start/last timestamps, formatted summary
  messages and webhook URL preservation. Teams alerts can squash with Slack alerts when their URL/type/text
  match because format is absent from the squash key. Preserve first-item behavior in digest entries.
  Build the periodic flush task with owned task coordination through B191, async batch sending with
  concurrent webhook posts via B173's AsyncHTTPHandler, and periodic interval-based digest bucket draining.
  Do not call B4024's send_alert from the flush path; render and enqueue digest text directly.
  Keep async context throughout and handle both single URLs and list-of-URLs webhook destinations.
scope:
