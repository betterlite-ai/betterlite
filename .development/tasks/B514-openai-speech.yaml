id: B514
title: OpenAI binary speech generation
description: >-
  Add SpeechRequest and an owned streaming byte result that keeps upstream cancellation and deadlines. Model model,
  input, voice, response_format, speed and instructions through typed wire values, using exact decimals. B083 owns
  public content negotiation; this provider method returns body, content type and safe response metadata.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/openai.py: OpenAIChatCompletion.audio_speech
  L1556-L1618; OpenAIChatCompletion.async_audio_speech L1620-L1666.


  Named case contracts: voice_and_format: Call audio.speech.create with required model,voice,input and untouched
  optional_params; omitted response_format stays omitted at this wrapper and SDK defaults remain SDK behavior. binary_body:
  Wrap response.response as HttpxBinaryResponseContent without JSON/text conversion and project provider headers
  through B206. speech_error: Neither method catches SDK/transport failures; preserve the existing exception status/type/param/code
  and let the upstream owner normalize it. speech_client_options: Select async only for aspeech is True; pass api_key,api_base,timeout,max_retries,client
  and shared_session into B004 _get_openai_client. Accepted organization and project arguments are not forwarded
  by either implementation. speech_logging_projection: Use the B238 speech_request_body helper to log model,voice
  and options independently of the separately supplied input; do not add credentials or raw binary response to that
  record.


  speech_request_body omits extra_headers from telemetry while forwarding those headers in optional_params to the
  SDK call; retain model/voice and the other options.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-openai/src/speech.rs with adjacent tests under speech/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function speech_cases in betterlite-openai with these exact named cases (one per oracle file): voice_and_format,
  speed_and_instructions, binary_body, chunked_binary_body, speech_error, speech_client_options, speech_logging_projection.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_speech* using HelperCase: kind: helper
  and the externally tagged openai_speech variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_openai_speech that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 105 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 145 production lines, 130 behavior/config-test lines,
  90 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 390 planned, 400 maximum changed lines.
