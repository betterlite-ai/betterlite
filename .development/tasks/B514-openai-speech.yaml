checks:
  optional:
  - mutants
  commands:
  - id: case-voice-and-format
    why: Call audio.speech.create with required model,voice,input and untouched optional_params; omitted response_format
      stays omitted at this wrapper and SDK defaults remain SDK behavior.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_voice_and_format$/)'
  - id: case-speed-and-instructions
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-speech/speed-and-instructions.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_speed_and_instructions$/)'
  - id: case-binary-body
    why: Wrap response.response as HttpxBinaryResponseContent without JSON/text conversion and project provider
      headers through B206.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_binary_body$/)'
  - id: case-chunked-binary-body
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-speech/chunked-binary-body.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_chunked_binary_body$/)'
  - id: case-speech-error
    why: Neither method catches SDK/transport failures; preserve the existing exception status/type/param/code and
      let the upstream owner normalize it.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_speech_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_speech.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_speech*")"
      && grep -lq 'openai_speech' tools/oracle/fuzz/corpus/helper_case/openai_speech* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_speech$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-speech-client-options
    why: Select async only for aspeech is True; pass api_key,api_base,timeout,max_retries,client and shared_session
      into B004 _get_openai_client. Accepted organization and project arguments are not forwarded by either implementation.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_speech_client_options$/)'
  - id: case-speech-logging-projection
    why: Use the B238 speech_request_body helper to log model,voice and options independently of the separately
      supplied input; do not add credentials or raw binary response to that record.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_speech_logging_projection$/)'
