pitfalls:
- 'The oracle helper for this task is pre-registered as openai_speech in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/speech.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_speech.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- organization and project appear in both signatures but are absent from _get_openai_client calls.
- The create call uses explicit model/voice/input keywords, so duplicate entries in optional_params fail instead
  of overriding those fields.
