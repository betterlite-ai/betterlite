dod:
  - text: plan_file_scans reads inline file parts (data URI or bare base64) and document parts into attachments with the right ByteDataType for every row family of the MIME table, and skips other part kinds, image types and wrongly typed parts without counting them.
    proof: [plan-tests, oracle, helper-python]
  - text: Reference parts (empty data, gs://, http://, https://) and supported parts whose base64 does not decode count as unscannable and produce no attachment.
    proof: [plan-tests, oracle, helper-python]
  - text: A declared format or filename type beats a conflicting data URI header type, and the header type is used only when nothing is declared.
    proof: [plan-tests, oracle, helper-python]
  - text: Base64 decoding is strict (padding required, no whitespace or foreign characters) and accepts non-zero trailing bits.
    proof: [plan-tests]
  - text: sanitize_url, api_endpoint and the text and file request bodies match LiteLLM for both sources, with the default endpoint https://modelarmor.us-central1.rep.googleapis.com.
    proof: [transport-tests, oracle, helper-python]
  - text: make_model_armor_request sends POST with the Bearer header and Content-Type, uses the injected token source, fills in the resolved project only when none is configured, and returns the decoded JSON on 200.
    proof: [transport-tests]
  - text: Any non-200 answer becomes ModelArmorAPIError with the detail B3732 builds, sanitized or full by sanitize_error_detail; timeouts and decode failures stay separate typed errors; neither content nor a file gives NoContent and a missing template gives MissingTemplate before any request.
    proof: [transport-tests]
  - text: Debug logs never contain byteData or the access token, and the text-body and response-body log lines appear only when sanitize_error_detail is false.
    proof: [transport-log-tests]
  - text: scan_request_files returns at once without touching the request data when there is nothing to scan, and records the guardrail name once in applied_guardrails otherwise.
    proof: [request-files-tests]
  - text: Unscannable references block with the exact 400 detail unless fail_on_error is false or skip_unscannable_attachments is true; oversize documents block or are skipped by the same rule.
    proof: [request-files-tests]
  - text: A matching document blocks with 400 even when a de-identify match could be masked, and the logged response and the status key are updated in the order LiteLLM does it, with blocked staying sticky.
    proof: [request-files-tests]
  - text: Model Armor API errors and other transport errors per attachment follow fail_on_error and never stop the remaining attachments from being scanned when it is false.
    proof: [request-files-tests]
  - text: The fuzz target model_armor_files exists with seed files added on this branch and the corpus replays without a panic.
    proof: [files-corpus]

checks:
  optional: []
  commands:
    - id: plan-tests
      why: document classification, MIME mapping, data URI precedence or strict base64 behavior is missing
      run: >-
        cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
        -E 'test(/^model_armor::file_scanning::/) - test(replays_the_model_armor_files_corpus)'
    - id: transport-tests
      why: URL, body, header, project resolution or error mapping behavior of the Model Armor call is missing
      run: >-
        cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
        -E 'test(/^model_armor::transport::tests::(url|body|request|error)_/)'
    - id: transport-log-tests
      why: the debug log lines print scanned bytes, the token or a body they should hide
      run: >-
        cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
        -E 'test(/^model_armor::transport::tests::log_/)'
    - id: request-files-tests
      why: the request file scan flow, its fail-open and fail-closed branches or its metadata writes are missing
      run: >-
        cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
        -E 'test(/^model_armor::request_files::/)'
    - id: files-corpus
      why: the fuzz target or its fresh seed corpus is missing or does not replay
      run: >-
        test -f crates/betterlite-guardrails/fuzz/fuzz_targets/model_armor_files.rs &&
        grep -q 'name = "model_armor_files"' crates/betterlite-guardrails/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-guardrails/fuzz/corpus/model_armor_files)" &&
        cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(replays_the_model_armor_files_corpus)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3733)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3733 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3733/pyrightconfig.json

