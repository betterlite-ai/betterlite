deviations:
  - what: A missing template_id returns a typed MissingTemplate error before any network call. LiteLLM formats the URL with the text "None" and lets Google answer 404.
    why: Sending a request to a URL built from None can only fail and spends a token fetch. The error still goes through fail_on_error exactly like a Model Armor API error would.
  - what: The mime of a filename comes from the mime_guess crate, not from Python's mimetypes module, which also reads the host's /etc/mime.types.
    why: The Python answer depends on the machine, so no fixed table matches it. Both give application/pdf, text/csv and text/plain for .pdf, .csv and .txt, the extensions the oracle cases use.
  - what: Pydantic's block validation is replaced by serde structs that accept the same declared field types (optional strings, required `file` or `source` object) and skip a part that does not fit.
    why: Python's duck typing beyond the declared types is not copied (docs/compatibility.md).

out_of_scope:
  - "ModelArmorGuardrail construction, config, ModelArmorAPIError, build_api_error_detail, build_block_error_detail, build_logging_response, raise_if_fail_closed, should_block_content, append_armor_response and the other verdict functions belong to B3732."
  - "The four lifecycle hooks, _process_response and apply_guardrail belong to B3734; they call scan_request_files and make_model_armor_request from here."
  - "Buffered stream enforcement (_resolve_streaming_outcome, the stream surfaces and their error frames) belongs to B3735."
  - "The pooled HTTP client and its size and header limits belong to B173; the injected Vertex credential lookup (_ensure_access_token_async) belongs to B1303 and is wired outside this task."
  - "get_metadata_variable_name_from_kwargs and get_or_create_metadata_bucket belong to B206."
  - "The skip_unscannable_attachments and fail_on_error config keys are parsed by the guardrail params tasks; this task only reads their parsed values."

pitfalls:
  - A file part with file_data "data:application/pdf,abc" has no ";base64," so the whole string is treated as raw base64 and fails to decode, which counts as unscannable, not as a skip.
  - The declared type wins over the data URI header even when the header is a clean match for a different family, and only a differing pair logs the warning.
  - An inline part whose type resolves to nothing (an image, application/octet-stream with no filename) is dropped silently and is not unscannable, while an inline supported part whose base64 is broken is unscannable.
  - The size limit is checked on the decoded bytes, not on the base64 length, and the check happens before any request is sent.
  - With fail_on_error false an oversize or failed attachment is skipped but the loop goes on to the next one, so a later bad file still blocks.
  - The applied_guardrails name is recorded only after the early return, so a request with no documents leaves the metadata untouched.
  - The status key stays "blocked" once set, even when a later attachment scans clean.
  - Document scans pass allow_sanitization false on purpose; masking applies to text only, because Model Armor returns findings for a document and no sanitized file.
  - AsyncHTTPHandler.post raises for every non-2xx answer, so the non-200 branch after it only ever sees 2xx answers such as 204.
  - byteData is the full base64 of the document and must never reach a log line at any level; log the byte count instead.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
