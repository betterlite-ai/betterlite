id: B3733
title: Model Armor transport and document scanning
description: >-
  Build the part of the Model Armor guardrail that talks to Google and reads documents out of chat messages. Three modules in betterlite-guardrails, all under crates/betterlite-guardrails/src/model_armor/: file_scanning, transport and request_files. B3732 owns the guardrail type, its config, ModelArmorAPIError and the verdict functions (should_block_content, append_armor_response, build_logging_response, build_block_error_detail, build_api_error_detail, raise_if_fail_closed); this task calls them and never rebuilds them. B3734 and B3735 call the functions built here.


  file_scanning turns message content into byte payloads Model Armor can scan. Public types: ByteDataType (enum, serialized as the strings PDF, WORD_DOCUMENT, EXCEL_DOCUMENT, POWERPOINT_DOCUMENT, CSV, TXT), FileAttachment { file_bytes: Vec<u8>, byte_data_type }, FileScanPlan { attachments: Vec<FileAttachment>, unscannable_count: usize }, the constant MAX_FILE_SIZE_BYTES = 4 * 1024 * 1024, and `plan_file_scans(messages: &[Message]) -> FileScanPlan` where Message is B218's type in betterlite-prompts (message_content.rs). Only messages whose content is `Content::Parts` are looked at. A part with kind "file" must carry a `file` object with optional string fields file_data, format and filename. A part with kind "document" must carry a `source` object with optional string fields data and media_type. Deserialize each part into those typed structs with serde, ignoring unknown fields. A part of any other kind, or one whose fields have the wrong type or are missing the required `file` or `source` object, is skipped and not counted.


  Classification per recognized part, in this order. (1) Reference check: a document part with empty or missing source.data, or a file part whose file_data is empty, missing, or after strip and lowercase starts with gs://, http:// or https://, counts as unscannable (unscannable_count + 1) and yields no attachment. (2) Resolve type and data. Document part: type comes from source.media_type, data is source.data. File part: if file_data starts with "data:" and contains ";base64,", split at the first ";base64,": the header minus the leading "data:" (None when empty) is the URI mime and the rest is the data; otherwise there is no URI mime and the data is the whole file_data string. The declared type is the first supported type among the part's `format` and the mime guessed from `filename` (in that order). The header type is the type of the URI mime. If there is no declared type, use the header type. If the header type exists and differs from the declared type, log a warning naming both and use the declared type. Otherwise use the declared type. (3) No type means a recognized inline part that Model Armor cannot scan, such as an image: skip it, not counted. (4) Decode the data as strict standard base64 (padding required, alphabet only, no whitespace; trailing bits that are not zero are accepted, as Python's b64decode(validate=True) does). A decode failure logs a warning and counts as unscannable. Success yields a FileAttachment.


  Mime mapping: lowercase the mime, cut at the first ";", trim, then look it up in this table. application/pdf is PDF. WORD_DOCUMENT: application/msword, and the application/vnd.openxmlformats-officedocument.wordprocessingml.document and .template forms, application/vnd.ms-word.document.macroenabled.12 and application/vnd.ms-word.template.macroenabled.12. EXCEL_DOCUMENT: application/vnd.ms-excel, the application/vnd.openxmlformats-officedocument.spreadsheetml.sheet and .template forms, application/vnd.ms-excel.sheet.macroenabled.12 and application/vnd.ms-excel.template.macroenabled.12. POWERPOINT_DOCUMENT: application/vnd.ms-powerpoint, the application/vnd.openxmlformats-officedocument.presentationml.presentation, .template and .slideshow forms, and application/vnd.ms-powerpoint.presentation.macroenabled.12, .template.macroenabled.12 and .slideshow.macroenabled.12. text/csv is CSV and text/plain is TXT. Copy the table from file_scanning.py lines 33 to 57 and test one row per family. For filename guessing use the mime_guess crate already in betterlite-guardrails (the stand-in for Python's mimetypes.guess_type).


  transport builds and sends the Model Armor call. A struct ModelArmorTransport holds the guardrail's template_id, project_id, location (already defaulted to us-central1 by B3732), api_endpoint, sanitize_error_detail, the request timeout (Option, from the guardrail's timeout setting; None uses the pooled client's default), the pooled client from B173 for the guardrail-callback purpose (LiteLLM's get_async_httpx_client with httpxSpecialProvider.GuardrailCallback; B3732 holds it as async_handler) and an injected token source. Define the trait `ArmorTokens` with one async method returning `(access_token, resolved_project_id)`; LiteLLM's constructor has the same seam as access_token_provider, and its default is the Vertex credential lookup (_ensure_access_token_async with custom_llm_provider "vertex_ai", B1303). betterlite-guardrails does not depend on betterlite-vertex, so the default implementation of this trait is wired outside this task (see notes). The resolved project id is kept in a std::sync::OnceLock<String> inside the transport and used only when the configured project_id is empty; a configured project id is never replaced.


  Functions. `api_endpoint()` returns the configured api_endpoint when it is non-empty, else `https://modelarmor.{location}.rep.googleapis.com`. `sanitize_url(source)` returns `{endpoint}/v1/projects/{project}/locations/{location}/templates/{template}:sanitizeUserPrompt` for source user_prompt and `:sanitizeModelResponse` for model_response (an enum Source { UserPrompt, ModelResponse }). `text_body(content, source)` returns `{"userPromptData":{"text":content}}` or `{"modelResponseData":{"text":content}}`. `file_body(file_bytes, byte_data_type, source)` returns `{"userPromptData":{"byteItem":{"byteDataType":T,"byteData":B64}}}` or the modelResponseData form, with B64 the standard padded base64 of the bytes. `make_model_armor_request(content: Option<&str>, source, file: Option<(&[u8], ByteDataType)>)` gets the token pair, resolves the project, builds the URL, picks the file body when a file is given, else the text body when content is Some (an empty string counts as present), else returns TransportError::NoContent. It sends POST with headers Content-Type: application/json and Authorization: Bearer <token>, then reads the JSON body into the same armor response type B3732's decision functions take as input. Any non-2xx answer, and any 2xx answer other than 200, becomes B3732's ModelArmorAPIError whose detail is build_api_error_detail(status, response text); log it at error level with the status and that detail only. Connection errors, timeouts and JSON decode failures stay typed TransportError values (they are not ModelArmorAPIError). If template_id is missing return TransportError::MissingTemplate before any network call (see deviations).


  Debug logging with tracing::debug. Before the request: for a file request log the URL, the byteDataType and the byte count, never byteData and never the token; for a text request log only the URL when sanitize_error_detail is true, else the URL and the body. After the response: log only the status when sanitize_error_detail is true, else the status and the body text.


  request_files holds `scan_request_files(messages, request_data, ...)`, LiteLLM's _scan_request_files and _unscannable_block_error. It takes the message slice, the request data map (B206's get_or_create_metadata_bucket picks the bucket, so a caller's own metadata field never splits state), the transport, and the B3732 guardrail settings it reads: fail_on_error (default true), skip_unscannable_attachments (default false), guardrail_name. Steps: call plan_file_scans. When skip_unscannable_attachments is true and unscannable_count is above 0, log a warning with the count and treat the unscannable count as 0. If there are no attachments and the unscannable count is 0, return Ok at once, touching nothing. Otherwise append guardrail_name to the bucket's applied_guardrails list if it is not already there (create the list if absent; skip when the name is None). Then: when the unscannable count is above 0, log a warning; if fail_on_error, set bucket key _model_armor_status to "blocked" and return the blocked error with reason "{n} attachment(s) reference a document with no inline bytes (file_id or remote URL) that Model Armor cannot scan". Then for each attachment in order: if its length is above MAX_FILE_SIZE_BYTES, log a warning; with fail_on_error false go to the next attachment, else set status "blocked" and return the blocked error with reason "attachment of {len} bytes exceeds Model Armor's 4194304 byte scan limit". Send it through make_model_armor_request with source UserPrompt and the file. A ModelArmorAPIError goes through B3732's raise_if_fail_closed (return it when fail_on_error is true, else go to the next attachment). Any other TransportError logs at error level; return it when fail_on_error is true, else go to the next attachment. On success: blocked = should_block_content(response, allow_sanitization = false), so a de-identify match blocks a document even when mask_request_content is on. Set bucket key _model_armor_response to append_armor_response(existing value, build_logging_response(response)). Set _model_armor_status to "blocked" when blocked or when it already says "blocked", else "success". When blocked, return a ScanError::Blocked with status 400 and detail build_block_error_detail("Content blocked by Model Armor", response). The unscannable and oversize errors are also ScanError::Blocked with status 400 and detail `{"error": "Model Armor could not scan an attachment and blocked the request: {reason}"}`. ScanError has the variants Blocked { status, detail }, Api(ModelArmorAPIError) and Transport(TransportError); B3734 maps them to the HTTP answer.


  Tests live in tests.rs files next to each module, and use a local axum server for the transport tests (axum is already a dev-dependency). The parser of outside bytes is `plan_file_scans` fed with a JSON message array; add the cargo-fuzz target model_armor_files in crates/betterlite-guardrails/fuzz that deserializes bytes into Vec<Message> and calls plan_file_scans, with seed corpus files, and a native test replays_the_model_armor_files_corpus that runs every seed through the same call.

