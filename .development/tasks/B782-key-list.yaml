id: B782
title: Paginated key lists and aliases
description: >-
  Expose GET /key/list and /key/aliases once, with B865 wrappers on both. /key/list defaults page=1,
  size=10 (page>=1, 1<=size<=100); user_id, team_id, organization_id, key_hash, key_alias, search,
  sort_by, expand, status, project_id, access_group_id, agent_id and expires are null. The booleans
  return_full_object, include_team_keys, include_created_by_keys and substring_matching default
  false; sort_order is desc. Cases list_query_defaults, list_pagination_422 and list_selector_forwarding
  assert every default and pass-through argument to B897 _list_key_helper. Its full-object expansion,
  sort allowlist, filters and returned keys/total_count/current_page/total_pages remain B897's contract.

  Validate status when non-null against active, expired, revoked, deleted, and string expires against
  active, expired; invalid values raise HTTPException 400 before B781 authorization. Run B781 scope
  validation then fetch team objects once iff include_team_keys or include_created_by_keys. Compute
  member IDs in that case (otherwise null), and admin plus /key/list-permission team IDs only when
  include_team_keys (otherwise null). Their union is deduplicated without a promised ordering.
  Cases list_invalid_status, list_invalid_expires, list_validation_before_scope,
  list_team_fetch_once, list_creator_member_scope and list_permission_team_union cover composition.

  Proxy admin and proxy_admin_viewer can omit user_id for all users; non-admin falsey user_id becomes
  caller.user_id. User substring matching requires both the flag and admin/viewer role; alias substring
  matching needs only the flag. Default matching remains exact, so alice must not select alice2.
  Cases list_default_self, list_admin_unscoped, list_user_exact_default,
  list_admin_user_substring and list_member_alias_substring distinguish the two flags.

  /key/aliases defaults page=1,size=50 (same bounds), search=null,team_id=null. Its first bound value
  is UI_SESSION_TOKEN_TEAM_ID, exactly litellm-dashboard. Select non-null, nonempty key_alias rows
  whose team_id is null or not that value; use B781 alias scope for non-admin/viewer callers.
  A truthy search adds ILIKE with %<search>% (SQL wildcard characters are not escaped); truthy
  team_id adds equality. Count matching rows, not distinct aliases. A second query selects key_alias
  ordered ASC with bound size and (page-1)*size; retain duplicates and skip falsey returned aliases.
  Empty count results mean zero; total_pages is ceil(count/size) or zero. Return aliases,total_count,
  current_page,total_pages,size. Cases aliases_defaults, aliases_ui_session_exclusion,
  aliases_duplicate_rows_count, aliases_wildcards_and_bound_parameters, aliases_team_intersection,
  aliases_empty_count and aliases_out_of_range_page cover query and response literals. Count and page
  are separate reads, not a snapshot transaction; aliases_concurrent_change permits their source race.

  Each route has its own except block (L6667-L6684 and L6823-L6840), not a call to
  handle_exception_on_proxy. HTTPException becomes internal_server_error with its status and param
  attribute or the string None; ProxyException passes through unchanged. Other exceptions, including
  missing DB, become 500 internal_server_error, param string None, code 500, with an authentication-error
  message prefix in LiteLLM. Thus B781's bad_request_error denials stay intact. Cases list_scope_error_shape,
  list_filter_error_shape, aliases_database_error and list_database_error compare these fields using
  README-permitted message wording. Neither route reads litellm-changed-by or mutates rows.


  Build the production key_list module in betterlite-server; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  list_keys (L6492-L6684; 164 source lines), key_aliases (L6727-L6840; 93 source lines).


  All route cases use B001 HTTP against independent Postgres schemas, using POSTGRES_TEST_URL
  when set and testcontainers otherwise. Infrastructure failures fail the tests. Seed duplicate aliases,
  UI tokens, null-team keys and distinct member/admin/list-permission teams to distinguish the policies.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 257 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  257 production, 320 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 642 changed lines estimated within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
scope:
  paths:
    - crates/betterlite-server/src/key_list.rs
    - crates/betterlite-server/src/key_list/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/key-list/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L6486-L6684
    why: Own list_keys; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L6721-L6840
    why: Own key_aliases; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1725-L1725
    why: Exact UI-session team ID read by the aliases SQL predicate.
dod:
  - text: Every named route case above proves the defaults, scope composition, bound SQL values,
      duplicate alias counts and route-local exception envelopes through HTTP.
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_list::tests::/)
        - test(/replays_the_/)'
