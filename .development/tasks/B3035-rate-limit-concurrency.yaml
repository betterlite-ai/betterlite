deviations:
- what: In-flight slot count is stored as integer in local cache when Redis is authoritative (integer mirror), not as a full dict of {slot_id → timestamp}.
  why: During Redis recovery, the integer mirror carries forward the count of in-flight requests on the Redis side, preventing double-admission. A fresh dict would briefly double the admitted concurrency.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1854-L1859
- what: Slot release is deferred to active_post_call_redis_batch only in logging callbacks (in_logging_callback=True); pre-response releases go to Redis immediately.
  why: Deferred release avoids stalling the callback while still freeing local capacity immediately. The batch settles after the response leaves; a newer acquire on this worker refreshes the gauge.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1954-L1962
- what: Integer mirror count is max(0, int(...)), never negative even when Redis returns a count lower than expected.
  why: LiteLLM protects against negative in-flight reporting that could allow unbounded admission.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1992

out_of_scope:
- Cache dual-transport implementation (async_get_cache, async_set_cache, async_batch_get_cache) is owned by B4293 and B4294; this task calls them.
- Redis script registration and lifecycle; B3055 owns script registration in the handler constructor.
- active_post_call_redis_batch creation and lifecycle; B4331 owns batch lifecycle and settlement.
- Parent OpenTelemetry span extraction; spans are passed through but not created.
- The parallel_slot field of RequestRateLimiterStash is initialized by B3031; this task only reads and writes it.

pitfalls:
- "Lua script uses 1-based indexing for KEYS (Lua convention). The PARALLEL_ACQUIRE_SCRIPT return value [1, key_index, ...] uses 1-based key_index; convert to 0-based when indexing the gauges array with int(raw[1]) - 1."
- "A cached integer mirror carries forward the Redis count during outages. Do not discard it as stale; it is the authoritative count of in-flight requests on Redis until local acquisition writes a fresh dict."
- "Slot TTL is 3600 seconds (LiteLLM: PARALLEL_REQUEST_SLOT_TTL_SECONDS), used in both Lua scripts (ZREMRANGEBYSCORE) and local cache writes. A mismatch between Lua TTL and cache TTL causes slots to be pruned inconsistently."
- "Deferred release only returns true if all three conditions are met: in_logging_callback=True, active_post_call_redis_batch returns a batch (not None), and parallel_release_script is not None. Otherwise it returns false and the release happens immediately in-memory."
- "A release without a matching acquire or a double-fired release (slot_id not in dict) is a no-op for dict registries and decrements the integer mirror only once. Do not track release attempts separately; rely on cache state."
- "Slot expiry uses Redis TIME (server clock), not local clock. In the in-flight count converter and in-memory acquisition function, use _get_current_time() for consistent pruning cutoff across both code paths."
- "All-or-nothing acquisition: if any gauge is over-limit, return early without modifying any cache state. The reverse is also true: if all pass the check, acquire all atomically before returning."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
