dod:
- text: PARALLEL_ACQUIRE_SCRIPT constant is defined with correct Lua syntax, uses Redis TIME for server-clock consistency, prunes slots older than TTL with ZREMRANGEBYSCORE, atomically validates all gauges before acquiring any slots, registers slots with ZADD and TTL expiry, and returns success [0, in_flight_1, ...] or over-limit [1, key_index (1-based), in_flight, limit].
  proof:
  - lua-script-validation
  - check-acquire-redis-success
- text: PARALLEL_RELEASE_SCRIPT constant is defined with correct Lua syntax, removes slot by ID per gauge with ZREM (no-op if absent/expired), and returns remaining in-flight count per key.
  proof:
  - lua-script-validation
  - release-redis-success
- text: PARALLEL_COUNT_SCRIPT constant is defined with correct Lua syntax, prunes expired slots with ZREMRANGEBYSCORE using Redis TIME, and returns current in-flight count per key.
  proof:
  - lua-script-validation
- text: The batch gauge-value reader calls internal_usage_cache.async_batch_get_cache with local_only=True and returns sequence of ParallelGaugeCacheValue or None.
  proof:
  - batch-get-tests
- text: The gauge status builder constructs RateLimitStatus with rate_limit_type="max_parallel_requests", descriptor_key from gauge, limit_remaining as max(0, limit - in_flight), and code "OK" or "OVER_LIMIT".
  proof:
  - status-builder-tests
- text: The in-flight count converter returns 0 for None input, counts non-expired slots for dict input (filtering by timestamp >= now - TTL), and returns max(0, int()) for integer mirror input.
  proof:
  - cache-value-conversion-tests
- text: The gauge check function with read_only=True uses parallel_count_script if available (fallback to local read on Redis failure), builds statuses with code "OK" or "OVER_LIMIT" based on in_flight >= limit, and returns overall_code aggregated from all statuses.
  proof:
  - check-read-only-redis
  - check-read-only-local-fallback
- text: The gauge check function with read_only=False checks local counts first, rejects immediately on over-limit (without Redis acquire), calls parallel_acquire_script if available, returns over-limit on [1, ...] return, and mirrors in_flight counts to local cache on success.
  proof:
  - check-acquire-local-precheck
  - check-acquire-redis-success
  - check-acquire-redis-failure-fallback
  - check-acquire-in-memory-fallback
  - check-acquire-redis-failure-fail-closed
- text: When Redis script fails and fail_closed_rate_limit_enforcement_enabled is true, the gauge check function calls the fail-closed rejection helper (from B3031) instead of falling back to in-memory, raising a 503 RateLimitUnverifiableError in both read_only and acquire paths.
  proof:
  - check-read-only-redis-failure-fail-closed
  - check-acquire-redis-failure-fail-closed
- text: The local gauge count reader calls the batch gauge-value reader and converts each cached value using the in-flight count converter, returning [0, ...] if batch read returns None.
  proof:
  - batch-read-tests
- text: The in-memory slot acquisition function holds caller's lock, reads current cache value, prunes expired slots from dict, returns early on over-limit (all-or-nothing), then acquires for all gauges atomically.
  proof:
  - acquire-in-memory-dict-registry
  - acquire-in-memory-integer-mirror
  - acquire-in-memory-early-rejection
  - acquire-in-memory-all-or-nothing
- text: The in-memory slot acquisition function with dict registry adds new slot_id with current timestamp; with integer mirror increments by 1.
  proof:
  - acquire-in-memory-dict-registry
  - acquire-in-memory-integer-mirror
- text: The stashed slot release dispatcher calls the deferred release helper if in_logging_callback=True and Redis batch is available, otherwise calls the direct release function, then sets stash.parallel_slot=None.
  proof:
  - release-stash-immediate
  - release-stash-deferred
  - release-stash-already-released
- text: The direct slot release function calls parallel_release_script if available, mirrors returned counts to local cache, and falls back to in-memory on Redis failure.
  proof:
  - release-redis-success
  - release-redis-failure-fallback
- text: The deferred release helper calls the in-memory release function immediately, registers the release in active_post_call_redis_batch, and returns true only if batch and script are available.
  proof:
  - defer-release-immediate-local
  - defer-release-batch-registration
  - defer-release-no-batch
- text: The deferred release helper's settle callback logs Redis failure without raising when future completes with exception or cancellation.
  proof:
  - defer-release-batch-failure
- text: The release count mirror function stores max(0, int(remaining)) for each counter_key with TTL=3600 seconds, skipping non-numeric values.
  proof:
  - mirror-count-storage
- text: The in-memory release function holds lock, reads each gauge's cache, skips if slot_id not in dict (or cache is None), removes slot_id from dict (preserving others), decrements integer mirror by 1 (floored at 0), and writes updated value.
  proof:
  - release-in-memory-dict-removal
  - release-in-memory-integer-decrement
  - release-in-memory-unmatched-slot
  - release-in-memory-double-fired
- text: Every literal slot TTL constant, descriptor field name, error message and rate_limit_type value in the owned code matches LiteLLM at the pin.
  proof:
  - constant-validation
