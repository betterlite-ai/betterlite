id: B3035
title: Per-request concurrency slots and release
description: >-
  Implement per-request concurrency slot acquisition and release for max_parallel_requests enforcement.
  Build three atomic Lua scripts for gauge-based concurrency control: PARALLEL_ACQUIRE_SCRIPT enforces
  limits and registers slots atomically; PARALLEL_RELEASE_SCRIPT removes slots by ID; PARALLEL_COUNT_SCRIPT
  reads current in-flight counts with leak pruning. Port both the Redis-backed acquisition path and the
  in-memory fallback from litellm/proxy/hooks/parallel_request_limiter_v3.py (lines 337–398, 1400–1410,
  1716–2022).

  Each gauge is a sorted set keyed by descriptor, storing per-request slot IDs scored by acquire
  timestamp. Admission requires in_flight + 1 <= limit across unexpired slots; rejected requests never
  occupy slots. Unlike windowed counters, gauges never reset while requests are in flight, and leaked
  slots self-heal after PARALLEL_REQUEST_SLOT_TTL_SECONDS (3600 seconds). A slot release removes exactly
  this request's ID, so unmatched or double-fired releases cannot free another request's capacity.

  In-memory cache values are either authoritative registries (dict of slot_id → timestamp) or mirrored
  integer counts from the last successful Redis script call. During Redis outages, the integer mirror
  carries forward the count of in-flight requests on the Redis side, preventing double-admission during
  recovery. Local releases are immediate; deferred releases from logging callbacks use active_post_call_redis_batch
  to avoid stalling the callback.

  Direct dependencies: B393 supplies log_redis_failure for degraded Redis paths; B3031 supplies
  _get_current_time, _reject_if_rate_limit_unverifiable, ParallelRequestGauge/ParallelSlotAcquisition
  typed records, RequestRateLimiterStash for slot tracking, and RateLimitResponse/RateLimitStatus for
  responses. B4293 supplies DualCache.async_get_cache and async_set_cache; B4294 supplies
  DualCache.async_batch_get_cache; B4331 supplies active_post_call_redis_batch for deferred release
  batching.

  Build tests with named rstest cases for each literal input/outcome: Lua script validation with all
  success and rejection paths, cache value type conversions (dict registry vs integer mirror), acquisition
  with pre-check local rejection, in-memory fallback on Redis failure, and release behavior covering
  immediate path, deferred batch path, and double-fired release guards.

  Budget 200 Rust impl/tests, 100 route/integration (300 total), 1500 max_changed_lines.
