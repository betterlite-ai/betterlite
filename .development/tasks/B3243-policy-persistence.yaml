id: B3243
title: Policy and attachment persistence and refresh
description: >-
  Implement policy and attachment persistence operations in betterlite-db::policy_persistence,
  providing database writes, reads and sync operations. Preserve config-defined policies when
  syncing from the database, auto-promote production status only on creation, enforce draft-only
  editing, and restore production registries before loading non-production versions by ID.

  add_policy_to_db accepts PolicyCreateRequest and creates a new v1 production policy in the database,
  then parses and adds it to the in-memory registry via _parse_policy and add_policy. Build the insertion data
  with policy_name, version_number=1, version_status="production", is_latest=true, production_at=now,
  guardrails_add/remove (default []), created_at/updated_at=now, and optional inherit/description/condition/pipeline
  and created_by/updated_by fields. Validate pipeline as GuardrailPipeline if present and store its model_dump
  as JSON. Return the database row converted to PolicyDBResponse.

  update_policy_in_db accepts PolicyUpdateRequest and updates a draft-status policy. Fetch by policy_id,
  and reject non-draft versions by raising Exception with message "Only draft versions can be updated. This policy has status '{status}'.".
  (Note: the HTTP 400 response with different message is handled by the route handler in B3248; this function only raises the plain exception, which is re-wrapped
  by the catch-all into "Error updating policy in DB: Only draft versions can be updated. This policy has status '{status}'.")
  Build update data with updated_at=now and updated_by from supplied headers, including only non-None
  fields from the request. Validate pipeline and store as JSON. Return the updated row as PolicyDBResponse.
  Do not update the in-memory registry (drafts are not loaded).

  delete_policy_from_db deletes by policy_id, fetches the version_status, and removes from in-memory registry
  only if it was production via remove_policy. If the policy_id is not found, raise Exception with message "Policy with ID {policy_id} not found"
  (which is re-wrapped by catch-all into "Error deleting policy from DB: Policy with ID {policy_id} not found").
  If production was deleted and a config-defined policy of the same name exists, return 200 with warning "Production version was deleted. The config-defined policy with the same
  name is active again.". If no config fallback, return warning "Production version was deleted. No other version
  was promoted. Promote another version to production if this policy should remain active." Draft/published deletions
  return success without warnings.

  get_all_policies_from_db fetches from _policy_table with optional version_status filter, ordering descending
  by created_at, returning list[PolicyDBResponse].

  sync_policies_from_db loads production policies first, builds the _policies map with conflict resolution
  (DB version wins), and preserves config snapshots in _sources. Then loads draft/published policies into
  _policies_by_id by policy_id for request-body overrides, mapping policy_id→(policy_name, policy object).
  Set _initialized=true after loading. Log the counts: "Synced N production policies and M draft/published
  (by ID) from DB to in-memory registry (C config-defined policies preserved)".

  resolve_guardrails_from_db fetches all production policies from the database, builds a temporary in-memory
  map, and calls PolicyResolver.resolve_policy_guardrails to resolve the target policy. Return sorted(resolved.guardrails).

  add_attachment_to_db accepts PolicyAttachmentCreateRequest, inserts into the database via PolicyAttachmentRepository,
  adds to in-memory registry via add_attachment, and returns PolicyAttachmentDBResponse.

  delete_attachment_from_db deletes by attachment_id and calls sync_attachments_from_db to refresh in-memory state
  (in-memory attachments have no IDs, so sync is required). If the attachment_id is not found, raise Exception with message "Attachment with ID {attachment_id} not found"
  (which is re-wrapped by catch-all into "Error deleting attachment from DB: Attachment with ID {attachment_id} not found").
  Return {"message": "Attachment {id} deleted successfully"}.

  get_attachment_by_id_from_db fetches by attachment_id, returning PolicyAttachmentDBResponse or None on miss.

  get_all_attachments_from_db fetches all attachments ordered descending by created_at, returning list[PolicyAttachmentDBResponse].

  sync_attachments_from_db loads all attachments from the database, converts to PolicyAttachment objects,
  concatenates config-defined attachments first then database attachments, and stores in _attachments.
  Set _initialized=true. Log "Synced N attachments from DB to in-memory registry (C config-defined attachments preserved)".

  All database operations use existing table handles from B3242 (_policy_table, PolicyAttachmentRepository.table).
  All operations accept PrismaClient and use async/await. Exceptions log via verbose_proxy_logger.exception
  and re-raise as generic Exception with context. Preserve source partial-write behavior and config state
  after database overrides.

