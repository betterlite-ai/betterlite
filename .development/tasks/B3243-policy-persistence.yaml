deviations:
  - what: "All operations use async/await with PrismaClient passed as a parameter instead of a shared global."
    why: "Explicit dependency injection enables testing without global state and supports multiple concurrent database contexts."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_registry.py#L381"
  - what: "Pipeline validation uses the existing GuardrailPipeline type from B3240 instead of inlining validation."
    why: "Reusing the shared type ensures consistency between creation, updates and the memory registry's parsing."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_registry.py#L424"
  - what: "Exceptions are caught, logged via verbose_proxy_logger, and re-raised as generic Exception rather than custom error types."
    why: "The source follows this pattern for consistency with the LiteLLM proxy codebase; error boundaries are defined by HTTP route handlers (B3248)."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_registry.py#L446"

out_of_scope:
  - "B3240 owns PolicyCondition, PolicyScope, PolicyGuardrails, Policy, PolicyAttachment, GuardrailPipeline validation and resolve_policy_guardrails."
  - "B3241 owns _parse_policy, add_policy, remove_policy, add_attachment, config snapshot storage, and is_initialized/get_source accessors."
  - "B3242 owns _policy_table, _policy_version_source_table, _row_to_policy_db_response, and the typed CRUD record definitions."
  - "B726 owns PolicyRepository and PolicyAttachmentRepository table handles, create/update/delete/find_many operations and PrismaClient lifecycle."
  - "B003 owns user_api_key_auth HTTP dependency and error boundary registration."
  - "PolicyResolver.resolve_policy_guardrails is owned by B3240; this task calls it with a temporary policy map."

pitfalls:
  - >-
    New policies are created with version_status="production" and is_latest=true on the first insertion; there is
    no draft→production promotion on creation. version_number always starts at 1 for new policies.
  - >-
    update_policy_in_db is draft-only; any non-draft version raises Exception with message "Only
    draft versions can be updated. This policy has status '{status}'.", which is re-wrapped into
    "Error updating policy in DB: Only draft versions can be updated. This policy has status '{status}'."
    The HTTP 400 response with a different message is handled by the route handler in B3248. Do not update config-defined policies.
  - >-
    delete_policy_from_db removes from in-memory registry only if version_status=="production". Draft and published
    deletions do not affect the registry. No other version is auto-promoted; admin must explicitly promote via B3244.
    When the policy_id is not found, raise Exception with the exact message "Policy with ID {policy_id} not found",
    which is re-wrapped by catch-all into "Error deleting policy from DB: Policy with ID {policy_id} not found".
  - >-
    sync_policies_from_db publishes production policies into _policies first (with DB-wins conflict resolution),
    then loads draft/published by policy_id into _policies_by_id. This order ensures request-body policy_<uuid>
    overrides find the non-production version without needing a second database fetch.
  - >-
    The _policies_by_id map uses policy_id as key, storing (policy_name, policy object) tuples. Request-body
    overrides use this for non-production versions; production uses the _policies by-name map.
  - >-
    Config-defined policies are preserved during sync by reading _config_policies and _config_attachments. Log when
    a policy name exists in both config and database; the database version takes precedence. Never remove config-defined
    policies from the registry, only override their entries.
  - >-
    delete_attachment_from_db must call sync_attachments_from_db after deletion because in-memory attachments do not
    carry attachment_id; resync rebuilds the list from the database to maintain consistency.
    When the attachment_id is not found, raise Exception with the exact message "Attachment with ID {attachment_id} not found",
    which is re-wrapped by catch-all into "Error deleting attachment from DB: Attachment with ID {attachment_id} not found".
  - >-
    resolve_guardrails_from_db loads only production policies to avoid circular/override inheritance issues when
    resolving a non-production target. The temporary map is discarded after resolution.

