id: B197
title: Image and document token accounting
description: >-
  Complete token accounting for image/document/file content and maximum-output adjustment. Reuse B183's bounded
  data-URL and image-header parsing without fetching media URLs; implement the pinned resize/tile arithmetic, image
  detail/default-image modes, document title/context/text/nested content, Anthropic tool blocks and OpenAI file-name
  accounting. Use checked integer/rational arithmetic with explicit truncation matching Python; never allocate decoded
  pixels merely to count dimensions. Add get_modified_max_tokens using the injected catalog, explicit buffer settings
  and B196 counts; return typed warnings when compatibility falls back to the caller's token limit. Direct media_tokens
  cases cover header formats, dimensions, nested content, fallback token counts and context/output limits. Add token_media
  fuzz target and reuse the upstream media corpus. Budget 330 accounting lines, 80 integration and 330 tests. Seed
  B171's shared helper_case corpus with every added operation and replay it through the common typed parser.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-tokenizer/Cargo.toml
  - crates/betterlite-tokenizer/src/lib.rs
  - crates/betterlite-tokenizer/src/error.rs
  - crates/betterlite-tokenizer/src/media.rs
  - crates/betterlite-tokenizer/src/media/**
  - crates/betterlite-tokenizer/src/limits.rs
  - crates/betterlite-tokenizer/src/limits/**
  - crates/betterlite-tokenizer/fuzz/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/media-tokens/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L58-L189
  why: Output limits, resize arithmetic and image tile counts.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L196-L329
  why: Image formats/dimensions and image detail accounting.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L693-L951
  why: Document, file and nested Anthropic content counting.
dod:
- text: Image/document/file/tool counts and maximum-output adjustments match helper cases, including rounding boundaries.
  proof:
  - oracle
- text: Malformed image headers, zero dimensions, huge dimensions, overflow and excess nesting fail without network
    access or pixel allocation.
  proof:
  - media-token-tests
  - token-media-corpus
- text: A remote URL requiring exact image dimensions is rejected unless the caller explicitly chose the documented
    default-count mode.
  proof:
  - media-token-tests
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: media-token-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/media_tokens|max_token_limit/)'
  - id: token-media-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/token_media.rs && test -n "$(ls -A crates/betterlite-tokenizer/fuzz/corpus/token_media)"
      && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(replays_the_token_media_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/media-tokens/low-auto-high.yaml
- tools/oracle/cases/helpers/media-tokens/default-image.yaml
- tools/oracle/cases/helpers/media-tokens/png-gif-jpeg.yaml
- tools/oracle/cases/helpers/media-tokens/webp-variants.yaml
- tools/oracle/cases/helpers/media-tokens/unknown-header.yaml
- tools/oracle/cases/helpers/media-tokens/resize-boundaries.yaml
- tools/oracle/cases/helpers/media-tokens/document-text-context.yaml
- tools/oracle/cases/helpers/media-tokens/nested-tool-content.yaml
- tools/oracle/cases/helpers/media-tokens/file-name.yaml
- tools/oracle/cases/helpers/media-tokens/default-on-error.yaml
- tools/oracle/cases/helpers/media-tokens/shared-context-limit.yaml
- tools/oracle/cases/helpers/media-tokens/separate-output-limit.yaml
- tools/oracle/cases/helpers/media-tokens/unknown-model-limit.yaml
deviations:
- what: High-detail counting of a remote URL requires explicit default-image mode or locally supplied bytes.
  why: B009 and the bounded-inputs rule forbid fetching request-supplied media URLs.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L219-L248
out_of_scope:
- Exact provider token-count endpoints are owned by their provider tasks.
- No spend or budget decisions are made from these counts in M1.
pitfalls:
- Several image formats expose dimensions in headers without needing full decoding.
- Python floors intermediate resize results; rounding only at the end changes tile boundaries.
- A caller-selected fallback token count is distinct from swallowing every parse failure.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
