id: B197
title: Image and document token accounting
description: >-
  Complete token accounting for image/document/file content and maximum-output adjustment. Compose B258's image
  header/default/tile operations with document title/context/text/nested content, Anthropic tool blocks and OpenAI
  file-name accounting. Use checked integer/rational arithmetic with explicit truncation matching Python; never
  allocate decoded pixels merely to count dimensions. Add get_modified_max_tokens using the injected catalog, explicit
  buffer settings and B196 counts; return typed warnings when compatibility falls back to the caller's token limit.
  Direct media_tokens cases cover header formats, dimensions, nested content, fallback token counts and context/output
  limits. Add token_media fuzz target and reuse the upstream media corpus.  Seed B171's shared helper_case corpus
  with every added operation and replay it through the common typed parser. Pre-call context checks, rate-limit
  consumers and /utils/token_counter request callers explicitly use default-count mode for remote images and receive
  a typed warning so the request can proceed. Their endpoint owners wire this mode; exact direct helper calls still
  require local bytes. B258 owns format defaults, truncated-header errors and the shared media_data corpus; this
  task owns recursive token_media input parsing and maximum-output limits. Write the behavior rstest functions b197_media_token_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. Register helper operations media_tokens in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed. Own token_counter.py 58-131 and 693-951;
  all image primitives 134-329 are B258 and text/tool formatting is B196/B259. Budget 300 content/limits, 110 adapters,
  260 tests, 60 fuzz/replay and 40 wiring (770 total).
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-tokenizer/Cargo.toml
  - crates/betterlite-tokenizer/src/lib.rs
  - crates/betterlite-tokenizer/src/error.rs
  - crates/betterlite-tokenizer/src/media.rs
  - crates/betterlite-tokenizer/src/media/**
  - crates/betterlite-tokenizer/src/limits.rs
  - crates/betterlite-tokenizer/src/limits/**
  - crates/betterlite-tokenizer/fuzz/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/media-tokens/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L58-L131
  why: Maximum output limit adjustment.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L693-L951
  why: Document, file and nested Anthropic content counting.
dod:
- text: >-
    Image/document/file/tool counts and maximum-output adjustments match helper cases, including rounding boundaries.
  proof:
  - oracle
  - helper-python
- text: >-
    Recursive content and checked arithmetic/depth failures are typed; the token_media parser never allocates decoded
    pixels or fetches remote input.
  proof:
  - media-token-tests
  - token-media-corpus
- text: >-
    Request-path remote images use default-count mode with a typed warning and do not fail the request; B258 proves
    format defaults.
  proof:
  - oracle
  - media-token-tests
  - helper-python
- text: >-
    A remote URL requiring exact image dimensions is rejected unless the caller explicitly chose the documented
    default-count mode.
  proof:
  - media-token-tests
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: media-token-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/::b197_media_token_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: token-media-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/token_media)"
      && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/token_media.rs && test -n "$(ls -A crates/betterlite-tokenizer/fuzz/corpus/token_media)"
      && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(replays_the_token_media_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'media_tokens' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/media-tokens/document-text-context.yaml
- tools/oracle/cases/helpers/media-tokens/nested-tool-content.yaml
- tools/oracle/cases/helpers/media-tokens/file-name.yaml
- tools/oracle/cases/helpers/media-tokens/default-on-error.yaml
- tools/oracle/cases/helpers/media-tokens/shared-context-limit.yaml
- tools/oracle/cases/helpers/media-tokens/separate-output-limit.yaml
- tools/oracle/cases/helpers/media-tokens/unknown-model-limit.yaml
- tools/oracle/cases/helpers/media-tokens/request-remote-default.yaml
deviations:
- what: >-
    Request-path remote images use default-image counting with a typed warning; exact direct counting requires local
    bytes.
  why: B009 and the bounded-inputs rule forbid fetching request-supplied media URLs.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L219-L248
- what: >-
    Open, waiting for Max: keep no remote image fetches with default-count request behavior, or share SSRF-checked
    remote dimensions with the B009/B183 downloader.
  why: >-
    The public helper defaults use_default_image_token_count=false and may fetch; no new downloader is built pending
    the shared decision.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L408-L443
out_of_scope:
- Exact provider token-count endpoints are owned by their provider tasks.
- No spend or budget decisions are made from these counts in M1.
- >-
  All image header/resize/tile primitives 134-329 are B258; source 343-690 and 954-1051 belong to B195/B196/B259.
pitfalls:
- Several image formats expose dimensions in headers without needing full decoding.
- Python floors intermediate resize results; rounding only at the end changes tile boundaries.
- A caller-selected fallback token count is distinct from swallowing every parse failure.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
