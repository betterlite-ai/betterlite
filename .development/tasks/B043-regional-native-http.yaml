  - tools/oracle/cases/providers/regional-native/qwen-platform-embedding.yaml
  - tools/oracle/cases/providers/regional-native/gigachat-embedding.yaml
  - tools/oracle/cases/providers/regional-native/brand-missing-key.yaml
  - tools/oracle/cases/providers/regional-native/dashscope-rerank.yaml
  - tools/oracle/cases/providers/regional-native/qwencloud-rerank.yaml
  - tools/oracle/cases/providers/regional-native/qwen-platform-rerank.yaml
