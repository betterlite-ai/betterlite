dod:
  - text: The Qwen embedding brands and GigaChat embedding flow match LiteLLM through all embedding aliases, including missing keys, OAuth credential order and per-item usage conversion.
    proof: [regional-native-fixtures, oracle]
  - text: All DashScope brands reach native rerank and image APIs with the correct keys, overridden destinations, request shapes and converted replies.
    proof: [regional-native-fixtures, oracle]
  - text: ModelScope image output and errors, and MiniMax voice mapping, audio decoding and handled errors, agree with the source through existing HTTP routes.
    proof: [regional-native-fixtures, oracle]
  - text: The completed regional suite also runs chat, Volcengine Responses and GigaChat upload fixtures supplied by B9230, B9231 and B9232 against the built gateway.
    proof: [regional-suite-inputs, oracle]
checks:
  optional: []
  commands:
    - id: regional-native-fixtures
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/regional-native)"
        && for case in qwencloud-embedding qwen-platform-embedding gigachat-embedding brand-missing-key
        dashscope-rerank qwencloud-rerank qwen-platform-rerank rerank-provider-error dashscope-image
        qwencloud-image qwen-platform-image modelscope-image minimax-speech-hex minimax-speech-base64
        minimax-speech-errors; do test -f "tools/oracle/cases/providers/regional-native/$case.yaml" || exit 1; done
      why: Every native operation fixture must be present, with newly added coverage on this branch.
    - id: regional-suite-inputs
      run: >-
        test -f tools/oracle/cases/providers/regional-native/gigachat-embedding.yaml
        && test -d tools/oracle/cases/providers/regional-chat
        && test -d tools/oracle/cases/providers/volcengine-responses
        && test -d tools/oracle/cases/providers/gigachat-upload
      why: The final regression consumes all three new parts and fails on the base before its own native fixtures exist.
