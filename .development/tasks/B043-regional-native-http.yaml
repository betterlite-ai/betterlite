  - tools/oracle/cases/providers/regional-native/qwencloud-image.yaml
  - tools/oracle/cases/providers/regional-native/qwen-platform-image.yaml
  - tools/oracle/cases/providers/regional-native/modelscope-image.yaml
  - tools/oracle/cases/providers/regional-native/minimax-speech-hex.yaml
