  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7313-L7334
    why: GigaChat embedding credentials prefer GIGACHAT_CREDENTIALS to GIGACHAT_API_KEY.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8621-L8662
    why: MiniMax speech's already-owned dispatch and voice extraction are tested over HTTP.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/common_utils.py#L24-L109
    why: Family selectors, rerank remap and key rules, implemented by B8171/B8172.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/embed/transformation.py#L41-L191
    why: Embedding options, headers, URL and reply usage exercised with brand subclasses.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/qwencloud.py#L11-L65
    why: QwenCloud's four policies and separate image/rerank environment destinations.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/qwen_ai_platform.py#L11-L65
    why: Qianwen's domestic bases and DashScope key fallback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/rerank/transformation.py#L62-L250
    why: Existing rerank request filtering, string-document normalization, token metadata and provider errors.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/image_generation/transformation.py#L48-L213
    why: Chat-base rejection, image size mapping, nested input and output extraction under test.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/embedding/transformation.py#L58-L197
    why: List normalization, per-item usage aggregation and bearer headers, owned by B8178.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/authenticator.py#L64-L115
    why: OAuth-before-embedding uses the same B7325 token service already composed by B8312.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/minimax/text_to_speech/transformation.py#L74-L409
    why: Voice mapping, request shape, status/ced errors, hex/base64 decoding and native endpoint.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/modelscope/image_generation/transformation.py#L76-L239
