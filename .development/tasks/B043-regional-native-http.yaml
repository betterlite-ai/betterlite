id: B043
title: Regional embeddings, rerank, image and speech HTTP parity
description: >-
  Finish the regional-host umbrella with the HTTP checks its native operation parts
  leave behind. B8312 already constructs the configurations and covers plain
  DashScope/Volcengine embeddings, MiniMax chat and NLP Cloud chat. Its HTTP list does
  not cover the Qwen embedding brands, GigaChat embeddings, DashScope-family rerank
  or images, ModelScope images or MiniMax speech. Add those cases and run B9230's chat
  and B9231's Responses cases plus B9232's image-upload flows in the same final task gate. These dependencies supply
  actual fixture inputs, not a wait for every child of the umbrella. Regional production
  functions belong to existing tasks: this task owns zero new LiteLLM logic lines and about
  750 lines of fixtures. Report failures to the existing implementation owner instead
  of creating a parallel provider or mounting a route here.

  Each deployment uses a public model_name, a fixed model_info.id, a mock-only
  api_base and dummy provider credentials. general_settings.master_key is sk-test,
  router_settings.num_retries is 0, and request x-litellm-call-id is fixed. Environment
  destinations use {{upstream}} in the case env and os.environ/NAME where referenced
  by config. The HTTP runner supports an ordered upstream list and steps in one case;
  use its ordinary untagged HTTP representation. Compare method/path/body and chosen
  upstream authorization/content-type/accept headers, downstream status/body,
  content-type and stable x-litellm-* headers. Keep all provider usage, data and error
  type/param/code fields significant. Ignore /error/message for betterlite's wording
  and only narrowly identified generated ids/times elsewhere. The built-in oracle
  check must compare the built gateway with the pin, not run --self-check.

  qwencloud-embedding uses qwencloud/text-embedding-v4 with a brand key and a distinct
  DASHSCOPE_API_KEY; qwen-platform-embedding uses qwen_ai_platform/text-embedding-v4
  with only the DashScope fallback. Pass dimensions, encoding_format=float and user,
  and retain the upstream usage in the comparison. Set QWENCLOUD_API_BASE or
  QWEN_AI_PLATFORM_API_BASE to local /compatible-mode/v1 bases; absent values would
  select the international or domestic DashScope host respectively. gigachat-embedding
  uses gigachat/Embeddings, a string input, and separate GIGACHAT_CREDENTIALS and
  GIGACHAT_API_KEY values with GIGACHAT_AUTH_URL pointing at the mock. Queue OAuth
  then an embedding reply containing per-item usage. Credentials take the opposite
  environment precedence to chat, input becomes a list, item usage disappears and
  the total is rebuilt. Spread these cases and brand-missing-key over POST
  /v1/embeddings, /embeddings, /engines/{model:path}/embeddings and
  /openai/deployments/{model:path}/embeddings. The missing-key case has no upstream
  answers and compares the source error envelope.

  dashscope-rerank, qwencloud-rerank and qwen-platform-rerank use each provider prefix
  with qwen3-rerank and cover POST /v2/rerank, /v1/rerank and /rerank once each. Send
  query, string documents, top_n and return_documents, plus supported caller-level
  rank_fields which the native mapper discards. Return one string document and one
  object document, explicit id and usage.total_tokens; check normalized document.text
  and both usage metadata fields. Use DASHSCOPE_API_BASE_RERANK,
  QWENCLOUD_API_BASE_RERANK and QWEN_AI_PLATFORM_API_BASE_RERANK to redirect the default
  /compatible-api/v1/reranks endpoints. A configured base on an aliyuncs.com host with
  path /compatible-mode/v1 is remapped, but the rerank environment override wins;
  make this case stay local rather than contacting that configured public host.
  rerank-provider-error returns a non-2xx code/message envelope and compares the error.

  The three family image cases use dashscope/qwen-image-2.0, qwencloud/qwen-image-2.0
  and qwen_ai_platform/qwen-image-2.0 on POST /v1/images/generations,
  /images/generations and /openai/deployments/{model:path}/images/generations. Configure
  each deployment with a chat-shaped base and redirect through its *_API_BASE_IMAGE
  setting. Plain DashScope and QwenCloud default to dashscope-intl.aliyuncs.com for
  images; Qianwen defaults to dashscope.aliyuncs.com. The path is
  /api/v1/services/aigc/multimodal-generation/generation, not /images/generations.
  Send n and size=800x600, then compare parameters.size=800*600 and
  input.messages[0].content[0].text. The reply contains image and non-image content
  entries; only images become data[].url. modelscope-image uses
  modelscope/Qwen/Qwen-Image-Edit, an explicit /v1/ base and n/size/user; the native
  /images/generations reply preserves url, b64_json and revised_prompt. Default
  MODELSCOPE_API_BASE is https://api-inference.modelscope.cn/v1; its key has no default.
  A second step returns an error object with upstream status 400 to exercise that
  provider's error class through the route.

  minimax-speech-hex and minimax-speech-base64 cover POST /v1/audio/speech and
  /audio/speech using minimax/speech-02-hd. The base here is a host without /v1;
  MINIMAX_API_BASE defaults to https://api.minimax.io and /v1/t2a_v2 is appended.
  A voice object chooses voice_id before id before name, then the OpenAI voice name
  maps to the provider voice. Send speed=2.5 and verify it clamps to 2.0. The request
  is text plus voice_setting/audio_setting, stream=false and output_format=hex.
  Supply short UTF-8-compatible audio bytes as data.audio in hex, then the same bytes
  as top-level audio_file in base64 in the other fixture. Compare the actual response
  bytes and content-type retained by the source; do not assume the provider JSON
  content-type becomes audio/mpeg. minimax-speech-errors has a status=2, ced error
  reply and a separate data.audio_url reply; the latter produces the source's 500
  without downloading the URL. base_resp.status_code is not the error discriminator
  this pinned implementation reads.

  All settings are consumed through B8312 and the already-owned config sections.
  This task loads no new key and decodes no new byte format, so it adds neither a
  config section nor a fuzz target. B9230 verifies authentication refusal and chat
  alias composition, B9231 covers Responses aliases, and B9232 proves image uploads.
  The oracle list below reruns all three directories alongside these native cases.
scope:
  paths:
    - tools/oracle/cases/providers/regional-native/**
  lint_tables: false
references:
