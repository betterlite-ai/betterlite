deviations: []
out_of_scope:
  - B8171 implements all DashScope embedding/rerank methods, errors and rerank base helpers; B8172 implements the family selectors, key/message functions, image config and Qwen overrides. B8170 owns DashScope chat and cost functions.
  - B8173 owns every AI21, MiniMax, Tencent and ModelScope chat function and Tencent cost; B1430 owns Tencent/MiniMax native Messages methods; B8580/B8634 own their binding and selector composition, with existing HTTP cases.
  - B8174 owns all MiniMax speech and ModelScope image methods and the called ModelScope image factory. The unused get_dashscope_image_generation_config in dashscope/image_generation/__init__.py has no caller at the pin and needs no implementation or case.
  - B8175 owns Volcengine chat, embedding and common helpers; B8176 owns every Responses override and helper. B9231 adds their Responses HTTP proof.
  - B7325 owns all GigaChat authenticator functions; B8177 owns chat, stream and utility functions; B8178 owns embedding, file and passthrough functions, with inherited get_models supplied by B3570. upload_file_async and its private async download helper have no live caller at the pin.
  - B8179 owns NLP Cloud config, completion handler, stream cleaner and error constructor. Its empty embedding stub has no caller at the pin. B8312 already owns ordinary NLP Cloud HTTP proof.
  - B8312 owns the regional main.py dispatch functions, embedding branches, speech branch and config assembly; all other main.py functions remain with their facade/provider owners. B1686 owns price dispatch, so neither cost registry nor call accounting is wired here.
  - B006, B082, B083, B085, B080 and B938 own the endpoint functions. B1100/B8610 own route composition, B8636 fills rerank/Responses production ports, and B8609 mounts GigaChat passthrough once. B8626/B8701/B8728 are MCP area mounts and do not leave a regional route to register.
pitfalls:
  - A chat-shaped base is discarded for DashScope images but remapped for rerank; use the operation-specific environment override so both cases reach the local mock.
  - MiniMax speech reads top-level status and ced, and the fallback audio_file is top-level too; the older prose describing base_resp or data.audio_file is not the pinned behavior.
  - GigaChat embedding rebuilds usage even if the reply supplies a different aggregate, and that difference must not be hidden by ignores.
  - ModelScope image selection accepts any model; Qwen-Image-Edit here still calls generation, not an invented regional image-edit route.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
