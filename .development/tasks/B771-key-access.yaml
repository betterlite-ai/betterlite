id: B771
title: Key ownership and delegated permission checks
description: >-
  Implement KeyWriteAccess using authenticated caller and stored owner/team/org context. Keep personal/team/service-account
  distinctions and generation permissions. B892 owns delegated budget/permission ceilings and route
  presets; do not claim those checks here. The source does not universally call this service for
  deletion, so route owners retain their own authorization sequence.


  Build the production key_access module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _check_custom_key_allowed (L490-L503; 12 source lines), _is_team_key (L506-L507; 2 source lines), _is_allowed_to_make_key_request
  (L582-L605; 19 source lines), _team_key_operation_team_member_check (L608-L651; 39 source lines), _key_generation_required_param_check
  (L654-L665; 11 source lines), _team_key_generation_check (L668-L703; 31 source lines), _personal_key_membership_check
  (L706-L719; 12 source lines), _object_permission_to_dict (L722-L727; 6 source lines), _personal_key_generation_check
  (L730-L755; 21 source lines), key_generation_check (L758-L800; 39 source lines), raise_on_invalid_key_logging_config
  (L803-L811; 8 source lines), common_key_access_checks (L814-L846; 32 source lines), validate_team_id_used_in_service_account_request
  (L1074-L1102; 26 source lines), _check_model_access_group (L4494-L4513; 17 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.disable_custom_api_keys=False;
  No separate top-level disable_custom_api_keys binding exists.


  litellm_settings.key_generation_settings=None; absent allowed_team_member_roles uses ["admin", "user"].
  general_settings.disable_custom_api_keys=false. Preserve the key-generation membership checks at key_management_endpoints.py:676-681
  and 737-743.

  Call B120 coerce_bool, B800 _get_user_in_team/_get_caller_team_role and
  TeamMemberPermissionChecks, B246 logging_metadata_config_error, B770 typed requests/table handles,
  B724 TeamRepository and B2314 is_team_service_account. No B736/B737 lookup or B892 delegation
  helper is called by these ranges. _is_team_key checks non-null, so even '' means team scope.

  custom_key_absent bypasses the switch; custom_key_disabled warns then returns HTTP 403 with
  detail.error explaining auto-generation, including for an empty custom key. custom_bool_coercion
  preserves coerce_bool: None/bools unchanged, strings equal to 'true' ignoring case only, all
  other values by truthiness; ' true ' and '1' are false. personal_key_owner passes admins and
  absent user_id, otherwise asserts identity equality. common_owner_denial maps that assertion
  to HTTP 403 string detail; common_unexpected_error maps any other exception there to 500.
  caller_user_override uses user_id or data.user_id. The litellm-dashboard team condition does
  not bypass the preceding user check and does not itself verify any membership.

  assigned_user_before_admin checks assigned membership before the lower-level helper's admin
  shortcut. caller_missing_member and assigned_missing_member are 400; team_role_disallowed is
  400 when an explicit allowed_team_member_roles list excludes the caller. Team generation's
  outer proxy-admin shortcut skips that whole sequence. default_team_roles accepts admin/user;
  configured_team_roles_missing does not restore that default. team_endpoint_permission invokes
  B800's endpoint grant, then required_fields_presence uses exclude_unset (explicit null counts),
  then team_access_groups_opt_in enforces B800's separate assignment permission.
  personal_access_groups_first performs that check before any personal role setting; personal_roles
  permits all if settings or allowed_user_roles is absent, otherwise nonmembers receive 400.
  service_account_cross_team is 403 before either generation branch. missing_team_settings is 400
  even for admins when key_generation_settings is non-null; missing_team_admin_unconfigured
  permits admins only when the whole setting is None. Other missing teams are 400.

  service_team_required, service_db_required and service_team_unknown each return distinct 400
  string details before any further generation work. object_permission_unset returns None or a
  model dump containing only supplied fields. logging_metadata_rejected wraps B246's first
  diagnostic in HTTP 400 detail.error; logging_metadata_valid returns normally. No database
  writes occur in this task. Helpers preserve HTTPException status/detail without inventing
  ProxyException type/param/code; B055/B775 own the route wrapping, tested in their HTTP tasks.


  Add the key_access operation under B856 Management::keys. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-access-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::key_access::tests::loads_settings, generation_defaults and custom_bool_coercion.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 275 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  275 production, 285 behavior tests, 65 helper adapters, 30 wiring and 50 config lines,
  705 changed lines estimated within a 750-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: model_access_group_without_license.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
