      run: grep -q "struct SensitiveDataRoutingHandler" crates/betterlite-router/src/sensitive_data_routing.rs && grep -q "internal_usage_cache" crates/betterlite-router/src/sensitive_data_routing.rs && grep -q "ttl_seconds" crates/betterlite-router/src/sensitive_data_routing.rs
