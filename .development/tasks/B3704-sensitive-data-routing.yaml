id: B3704
title: Tenant-scoped sensitive data session routing
description: >-
  Build sticky sensitive-data routing that stores session-to-model overrides keyed by the authenticated principal, with Redis-first reads, local in-memory fallback, and remaining-TTL propagation. Preserve the behavior where Redis SET always runs first but a failure falls back to local-only cache; GET tries Redis before local with TTL inheritance. Store the key as "{sensitive_route:<tenant>:<session_id>}:model" where tenant is the hashed api_key if present, otherwise a stable identity built from non-empty user/team/org fields or "default" for keyless auth.

  Implement the pre-call hook that checks for an existing routing override and applies it by updating the request's model field and metadata fields (sensitive_data_routing_applied: bool, sensitive_data_routing_original_model: str). The hook returns early if no session_id is found or no routing exists for the session. Add set_session_routing for guardrails to store routing decisions (called when sensitive data is detected), parameterized by session_id, model, optional principal identity and optional guardrail_name for logging context. Load LITELLM_SENSITIVE_ROUTING_TTL from config (default 3600 seconds).

