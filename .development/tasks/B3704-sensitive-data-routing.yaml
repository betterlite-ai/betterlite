dod:
  - text: SensitiveDataRoutingHandler struct exists and stores internal_usage_cache and ttl_seconds (u64) loaded from config.
    proof: [handler-struct-exists]
  - text: _make_cache_key creates keys in the format "{sensitive_route:<tenant>:<session_id>}:model".
    proof: [cache-key-format]
  - text: _resolve_tenant returns hashed api_key if present, otherwise joins user/team/org in order as "user:<id>|team:<id>|org:<id>", or "default" if none exist.
    proof: [tenant-resolution]
  - text: _get_routed_model tries Redis first with async_get_cache, propagates remaining TTL on success to in-memory cache, falls back to in-memory on Redis error, and returns the routed model or None.
    proof: [routed-model-logic]
  - text: set_session_routing tries Redis SET first without falling back (logs warning on failure), then always sets in-memory cache with local_only=true and the TTL.
    proof: [session-routing-set]
  - text: async_pre_call_hook checks for session_id, looks up routed model, updates request.model and request.metadata on mismatch, and returns the modified data dict.
    proof: [pre-call-hook]
  - text: Configuration integration loads LITELLM_SENSITIVE_ROUTING_TTL with default 3600 from B002 config.
    proof: [config-integration]
  - text: All test cases cover success (Redis and in-memory), Redis failures with fallback, cache misses, identical model (no routing), and metadata updates.
    proof: [behavior-tests]

