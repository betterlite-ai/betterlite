  - "InternalUsageCache.async_get_cache, async_set_cache (belong to B124)"
  - "RedisCache.async_set_cache (belongs to B126)"
  - "log_redis_failure implementation (belongs to B393)"
  - "Request/response translation and hook registration (belongs to B105)"

pitfalls:
  - "The cache key format uses single braces and a colon-separated structure; any deviation breaks tenant scoping and session isolation."
  - "Redis SET is not optional: LiteLLM tries Redis first and only falls back to in-memory on exception. A future change that makes Redis SET optional must preserve this behavior."
  - "User/team/org identity fallback depends on at least one being non-empty; if all three are None, tenant becomes 'default', which could cause collisions between different keyless callers."
  - "TTL propagation from Redis to in-memory cache uses the remaining TTL from async_get_ttl; if that method returns None, the full TTL_SECONDS is used instead."
  - "The pre_call_hook returns the modified data dict; callers expect it to mutate the request in place or return the mutation, never return a new dict without updating the caller's reference."
  - "Metadata fields sensitive_data_routing_applied and sensitive_data_routing_original_model are strings set by the hook; any code that reads them must handle the case where they are absent or have unexpected types."

review_level: security

