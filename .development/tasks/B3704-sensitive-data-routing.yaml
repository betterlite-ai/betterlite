    - id: pre-call-hook
      why: async_pre_call_hook is missing or does not update request model and metadata
      run: grep -q 'async_pre_call_hook' crates/betterlite-router/src/sensitive_data_routing.rs && grep -q 'sensitive_data_routing_applied' crates/betterlite-router/src/sensitive_data_routing.rs && grep -q 'sensitive_data_routing_original_model' crates/betterlite-router/src/sensitive_data_routing.rs
