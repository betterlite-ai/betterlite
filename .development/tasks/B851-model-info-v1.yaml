id: B851
title: Model info v1 route and public-name projection
description: >-
  Expose /model/info using authorized deployment lists, source v1 response shape and team public-name
  translation. Strip credential-bearing fields using the typed model response projection and B187 redaction.
  The v1 route remains compatible while sharing all grant decisions with v2.


  Build the production model_info_v1 module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/proxy_server.py:
  _deployment_matches_allowed_model_names (L15956-L15969; 13 source lines), _get_v1_model_info_allowed_model_names
  (L15972-L16001; 30 source lines), _filter_v1_model_info_deployments (L16004-L16010; 7 source lines),
  _translate_model_name_for_response (L16013-L16037; 24 source lines), _get_proxy_model_info (L16040-L16041;
  2 source lines), _model_info_json_response (L16044-L16048; 5 source lines), model_info_v1 (L16061-L16275;
  182 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.infer_model_from_keys=False;
  infer_model_from_keys=False.


  Register these actual HTTP routes and aliases exactly once: GET /model/info -> model_info_v1; GET /v1/model/info
  -> model_info_v1. For each route send a typed successful request, an invalid or missing target, and
  a caller lacking that route permission through B001 HttpCase against the running pinned MIT proxy and
  betterlite. Public login/session routes instead prove bad credentials or invalid/expired codes. Compare
  status, response model including null/absent fields, error type/param/code, content-type, redirect/cookie
  headers and litellm-changed-by where read. Do not reduce endpoint checks to direct helper invocations.
  handle_exception_on_proxy controls management error mapping; keep source partial writes visible in fixture
  inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::model_info_v1::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 263 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  263 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 526 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
