id: B851
title: Model info v1 route and public-name projection
description: >-
  Register GET /model/info and /v1/model/info with B052 auth and identical application/json output.
  Query defaults are litellm_model_id/teamId=None, include_team_models/healthy_only=False. Normalize
  non-bool include_team_models to False and non-string teamId to None for native calls. user_model
  takes precedence over every router/DB/query path: query B2225 metadata, catch any failure as {},
  construct B301 Deployment(model_name='*', backend=user_model), redact with B124 preserving the
  credential name, and return data as ONE OBJECT. All other success paths return data as a list.

  Without user_model, require llm_model_list then llm_router, raising HTTP 500 detail.error respectively
  'LLM Model List not loaded in. Make sure you passed models in your config.yaml or on the LiteLLM
  Admin UI. - https://docs.litellm.ai/docs/proxy/configs' and the same wording beginning 'LLM Router
  is not loaded in.'. Missing DB is permitted unless include_team_models or nonblank teamId is set,
  then raise 500 detail.error CommonProxyErrors.db_not_connected_error. No route catch block calls
  handle_exception_on_proxy; collaborators' HTTP detail errors propagate and auth retains its envelope.

  A non-null litellm_model_id looks up B844 get_deployment. Missing or B124 listing-callback-hidden
  deployments raise HTTP 400 detail.error 'Model id = {id} not found on litellm proxy'. Enrich with
  B849 and translate the public name; with DB, populate B848 annotations, optionally filter accessible
  rows, then optionally B1216 filter stripped teamId. Return data as a list (possibly empty).
  This path skips key/name-list expansion, BYOK list scoping, health and discoverability filtering;
  do not add a new permission check to it. Listing callbacks still run for the targeted deployment.

  For the list path deepcopy router rows AND B844 alias rows, B759 expand wildcard deployments,
  resolve allowed names using B847 access groups, B844 model names and B759 get_key_models/get_team_models.
  If both grants are empty, allowed names is None and the original list survives; otherwise call
  get_complete_model_list(return_wildcard_routes=False) and match internal OR string public names.
  Filter B1216 foreign BYOK rows before metadata projection. With DB always populate B848 annotations,
  but only filter them for include_team_models. Enrich/redact, translate public names, apply stripped
  teamId (403 for nonmembers, empty for an admin's missing team), then B842 health and discoverable_rows.
  Build first-seen unique string names, invoke B124 listing callbacks, and drop hidden names. Preserve
  list order/duplicates and log only the already projected visible rows. No agents are appended here.

  Public-name translation returns a shallow copy only when model_info is a dict, team_public_model_name
  and team_id are truthy, and the current name begins exactly model_name_{team_id}_. Otherwise return
  unchanged, including malformed model_info; never rewrite the router index. Name membership accepts
  the internal name first, then a string public name, without wildcard matching in this predicate.
  _model_info_json_response wraps data with orjson semantics (non-string keys allowed and B124's
  JSON-compatible datetime encoding); no extra auth/type/param/code fields appear on detail errors.


  Build the production model_info_v1 module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/proxy_server.py:
  _deployment_matches_allowed_model_names (L15956-L15969; 13 source lines), _get_v1_model_info_allowed_model_names
  (L15972-L16001; 30 source lines), _filter_v1_model_info_deployments (L16004-L16010; 7 source lines),
  _translate_model_name_for_response (L16013-L16037; 24 source lines), _get_proxy_model_info (L16040-L16041;
  2 source lines), _model_info_json_response (L16044-L16048; 5 source lines), model_info_v1 (L16061-L16275;
  182 source lines).


  The only setting read here is general_settings.infer_model_from_keys, .get default False at L15997;
  it is passed to B759, not read from an environment variable. The call occurs only for restricted
  lists, where B759 gives key/team models precedence and does not infer provider names. Test the
  setting through the real B002 loader even though this call path suppresses inference.


  B001 HTTP cases exercise both aliases, missing bearer, authorized restricted keys, exact detail errors,
  field redaction and object/list response differences. B860 Postgres uses POSTGRES_TEST_URL or
  testcontainers; unavailable fixtures fail. Native public_name_no_mutation, public_name_prefix_gate,
  malformed_public_metadata and internal_name_first tests cover the pure projection used by B850.


  Seed equivalent B860 databases for direct-ID, unrestricted-list and restricted team-name fixtures.
  POSTGRES_TEST_URL takes precedence over testcontainers; connection failure fails these HTTP cases.


  Write betterlite-config::model_info_v1::tests::loads_infer_model_from_keys and
  infer_model_from_keys_default_false through the production loader with true/false/null and absent
  values. There is no local invalid-value catch or warning to test as a fallback. Shared B002 config
  validation owns rejected scalar types. Add config_yaml seeds for this nested setting.


  The seven owned functions contain 207 nonblank noncomment lines excluding docstrings. Allow 230
  production, 330 tests, 65 route wiring and 45 config lines, 670 within 750.
