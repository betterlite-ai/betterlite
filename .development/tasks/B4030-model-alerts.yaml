id: B4030
title: Model deprecation, management and fallback alerts
description: >-
  Build the four alert producers that LiteLLM's SlackAlerting class has for model events, in
  `crates/betterlite-server/src/alerting/model_alerts.rs` with one submodule per producer:
  `model_added`, `model_deprecation`, `fallback_stats` and `key_event`, each with an adjacent
  `tests.rs`. Every producer builds a message and calls B4024's `send_alert` entry point. This
  task never formats the final Slack payload, never filters by alert type and never delivers
  anything: B4024 and B4021 do that. Every outside thing is passed in through a constructor
  as a small trait: the alert sender, the usage cache, the clock, the sleeper, the pod lock,
  the router source, the model catalog source and the Prometheus fallback source. No module-level state.


  `model_added`: `model_added_alert(model_name, litellm_model_name, base_model: Option<&str>)`.
  If `base_model` is present (even an empty string), look the model up in the raw catalog by
  `base_model` and prefix the message with the line "Base Model: `<base_model>`\n"; otherwise look
  up `litellm_model_name`. An unknown name gives an empty model info. B193's typed `CatalogEntry`
  loses the raw key order, so the lookup goes through a `RawModelInfoSource` trait that returns the
  entry as an ordered `serde_json::Map` in the JSON file's key order (see notes: the architect
  decides who adds this to B193). Render one line `key: value` per key, in order. The keys
  `input_cost_per_token` and `output_cost_per_token` render as fixed point with eight decimals
  (Python `f"{v:.8f}"`, so `1.63e-06` becomes `0.00000163`); a non-number value there is a typed
  error, as in Python where the format raises. Other values: strings as they are, integers and
  floats in their shortest decimal form, `true` and `false` as `True` and `False`, null as `None`,
  nested lists and objects as compact JSON (deviation below). The message is the literal template
  at L1068-L1094 with the exact blank lines and the trailing space after `Model Info:`; the base
  URL line is `PROXY_BASE_URL` when that variable is set, even to an empty string, and
  `http://0.0.0.0:4000` only when it is unset. The alert goes out at level Low with alert type
  `new_model_added` and empty `alerting_metadata`. Read the variable through B002's environment
  access, not `std::env` directly. Errors from the sender are returned to the caller; the route
  that calls this (model_management_endpoints.py:2493) owns the try/except.


  `model_deprecation`: `ModelDeprecationAlerts` holds the alert settings view (alerting enabled
  and the alert type list), the usage cache and the injected pieces.
  `deprecation_alerts_enabled()` is true when alerting is set and `model_deprecation_warnings` is
  in the alert types. `send_model_deprecation_alert(router, pod_lock)` returns false when disabled;
  otherwise it calls B843's `collect_model_deprecations` and `format_deprecation_alert_message`; a
  `None` message returns false before any lock is taken. Only then it claims the daily window:
  with no pod lock the claim succeeds; with one, it calls B1690's `acquire_lock` with cronjob id
  `slack_model_deprecation_warning`, ttl 86400 (B843's `DEFAULT_DEPRECATION_CHECK_INTERVAL_SECONDS`)
  and `allow_reentrant` false, and only an explicit `false` result refuses (no Redis, which B1690
  reports as `None`, still proceeds). Then it sends: level High when the deprecated list is not
  empty, otherwise Medium, alert type `model_deprecation_warnings`, and `alerting_metadata`
  holding `deprecated_count`, `imminent_count` and `upcoming_count`. After the send it writes the
  usage cache key `model_deprecation_alert_sent` (the `deprecation_alert_sent_key` value, with no
  deployment prefix) with the current Unix time as a float and ttl 86400, and returns true. If the
  send fails nothing is stamped and the error goes up.
  `run_deprecation_alert_pass(router, pod_lock)` returns false when the router is `None`, the alert
  is disabled or the stamp key is present in the cache; otherwise it returns what
  `send_model_deprecation_alert` returns. `run_scheduled_deprecation_check(get_router, pod_lock)`
  loops until cancelled: run one pass; on `Ok` sleep 30 seconds (`DEPRECATION_IDLE_POLL_SECONDS`);
  on `Err` log with the error text and sleep 86400 seconds, then loop again. The loop stops through
  a cancellation token, checked at each sleep, so tests end it without waiting. The scheduling call
  sites (proxy/utils.py:1265-1303) belong to the proxy startup task.


  `fallback_stats`: `send_fallback_stats_from_prometheus()` calls B3888's
  `get_fallback_metric_from_prometheus`, builds `*Fallback Statistics:*\n<text>`, and sends it at
  level Low with type `fallback_reports` and empty metadata. Any error from the Prometheus query
  or the send is logged at error level as "Error sending weekly spend report <error>" and
  swallowed, so the function always returns `()`. The cron job and lock around it
  (proxy_server.py:11315-11345, `PROMETHEUS_FALLBACK_STATS_SEND_TIME_HOURS` default 9) are not here.


  `key_event`: define `VirtualKeyEvent { created_by_user_id, created_by_user_role, created_by_key_alias: Option<String>, request_kwargs }`
  (the pydantic model at _types.py:4586-4590); `request_kwargs` is an insertion-ordered map of JSON values.
  `send_virtual_key_event_slack(key_event, alert_type, event_name)` builds: "`<event_name>`\n", then
  "*Action Done by:*\n", then one line "<field>: `<value>`\n" for each of the three `created_by_*`
  fields in declaration order (a missing alias prints `None`), then "\n*Arguments passed:*\n", then
  one such line per `request_kwargs` entry in insertion order, skipping the key `user_api_key_dict`.
  Send at level High with the given alert type and empty metadata. Any error (the render or the
  send) is logged at error level as "Error sending send_virtual_key_event_slack <error>" and
  swallowed. B1228 calls this function. Do not redact values here; LiteLLM does not.


  Helper cases cover the two pure formatters, `render_model_added_message` (given model name,
  optional base model and a raw model info map) and the deprecation level and metadata choice.
  Rust tests cover the loop, the claim, the cache stamp and both swallowed-error producers with
  fake traits and a fake clock.

scope:
  paths:
    - crates/betterlite-server/src/alerting/model_alerts.rs
    - crates/betterlite-server/src/alerting/model_alerts/**
    - tools/oracle/cases/helpers/model-alerts/**
    - "tools/oracle/fuzz/corpus/helper_case/model_alerts-*"
  lint_tables: false

