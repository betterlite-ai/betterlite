    why: model_added_alert message template, base model branch, fixed-point cost formatting; model_removed_alert is an empty body.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1100-L1145
