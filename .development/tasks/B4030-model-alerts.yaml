dod:
  - text: The model-added message matches LiteLLM byte for byte, including the trailing space after `Model Info:`, with the Base Model line only when a base model is given.
    proof: [model-added-tests, oracle, helper-python]
  - text: A base model that is present but empty still takes the base model branch, and an unknown catalog name renders an empty model info.
    proof: [model-added-tests]
  - text: input_cost_per_token and output_cost_per_token render with eight decimals and other values render in Python text form (True, None, plain numbers).
    proof: [model-added-tests, oracle, helper-python]
  - text: The base URL line uses PROXY_BASE_URL when it is set, including an empty value, and http://0.0.0.0:4000 only when it is unset.
    proof: [model-added-tests]
  - text: The model-added alert goes out at level Low with type new_model_added and empty metadata, and a sender error is returned.
    proof: [model-added-tests]
  - text: send_model_deprecation_alert returns false without collecting when alerting is off or the type is not enabled.
    proof: [deprecation-tests]
  - text: A None formatted message returns false before the pod lock is touched.
    proof: [deprecation-tests]
  - text: The lock is claimed with id slack_model_deprecation_warning, ttl 86400 and no reentry; only an explicit false refuses, and no pod lock or a None result proceeds.
    proof: [deprecation-tests]
  - text: The deprecation alert level is High with deprecated models and Medium without, and the metadata holds the three counts.
    proof: [deprecation-tests, oracle, helper-python]
  - text: After a send the key model_deprecation_alert_sent is stamped with the Unix time and ttl 86400; a failed send stamps nothing.
    proof: [deprecation-tests]
  - text: A pass returns false for a missing router, a disabled alert or an existing stamp, and otherwise sends.
    proof: [deprecation-tests]
  - text: The scheduled loop sleeps 30 seconds after an Ok pass and 86400 seconds after an error, logs the error, and stops on cancellation.
    proof: [deprecation-tests]
  - text: The fallback statistics alert sends "*Fallback Statistics:*\n<text>" at level Low with type fallback_reports, and a Prometheus or send error is logged and swallowed.
    proof: [fallback-and-key-event-tests]
  - text: The virtual key event message lists the three created_by fields then request_kwargs in order, skips user_api_key_dict, sends at level High, and swallows errors.
    proof: [fallback-and-key-event-tests]
  - text: Newly added helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: []
  commands:
    - id: model-added-tests
      why: model-added message template, cost formatting, base model branch or sender behavior is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^alerting::model_alerts::model_added::tests::/)'
    - id: deprecation-tests
      why: deprecation claim, level, stamp, pass or scheduled loop behavior is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^alerting::model_alerts::model_deprecation::tests::/)'
    - id: fallback-and-key-event-tests
      why: fallback statistics or virtual key event message and error swallowing is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^alerting::model_alerts::(fallback_stats|key_event)::tests::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4030)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4030 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4030/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added model alert cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/model_alerts-*")" &&
        grep -lE '^[[:space:]]+b4030:' tools/oracle/fuzz/corpus/helper_case/model_alerts-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/model-alerts/model-added-with-base-model.yaml
  - tools/oracle/cases/helpers/model-alerts/model-added-without-base-model.yaml
  - tools/oracle/cases/helpers/model-alerts/model-added-cost-formatting.yaml
  - tools/oracle/cases/helpers/model-alerts/deprecation-level-and-metadata.yaml

deviations:
  - what: In the model-added message, a model info value that is a list or an object is written as compact JSON, not as Python repr text.
    why: docs/compatibility.md leaves Python repr text out; scalar values keep their Python text (True, False, None).
  - what: A non-number input_cost_per_token or output_cost_per_token returns a typed error instead of raising a Python TypeError.
    why: The route that calls this catches every error and only logs it, so the caller sees the same result.
  - what: Values in the virtual key event lines are written as JSON for non-string values, not Python str() text.
    why: docs/compatibility.md leaves Python str and repr text out; strings and None keep the same text.

out_of_scope:
  - "model_removed_alert (L1097-L1098), deployment_in_cooldown and deployment_removed_from_cooldown (L194-L198): empty bodies with no caller at the pin."
  - "_request_is_completed (L2094-L2109): no caller at the pin."
  - "collect_model_deprecations and format_deprecation_alert_message: B843 owns them; this task calls them."
  - "get_fallback_metric_from_prometheus and the Prometheus query: B3888 owns them."
  - "send_alert, destination choice and digest admission: B4024. Batching and delivery: B4021. AlertType, DEFAULT_ALERT_TYPES and the cache key enum: B4020."
  - "PodLockManager: B1690. Catalog loading and typed fields: B193."
  - "failed_tracking_alert: B4025. response_taking_too_long: B4027. send_daily_reports and its scheduler: B4028."
  - "The management route that calls model_added_alert and the key/team/user event mapping that calls send_virtual_key_event_slack: B1228 and the model management route owner."
  - "The APScheduler cron job for fallback stats and the task that starts run_scheduled_deprecation_check: the proxy startup owner."

pitfalls:
  - 'The Model Info line is "Model Info: " with a trailing space, and the first line of the message is empty, so the string starts with a newline.'
  - "`PROXY_BASE_URL` set to an empty string stays empty in the base_url line; only an unset variable gives `http://0.0.0.0:4000`."
  - "`base_model` branch is chosen by `is not None`, so an empty string still prints \"Base Model: ``\" and looks up the empty name."
  - The model-added message lists catalog keys in the JSON file's order, not alphabetical, so a BTreeMap gives the wrong text.
  - A failed deprecation send leaves the pod lock claimed for its 86400 second ttl and the stamp unset, so the retry after the error backoff finds the lock still held and returns false.
  - The lock check is `is not False`, so a `None` from a missing Redis cache proceeds and a plain falsy value is not a refusal.
  - The Ok-pass sleep is 30 seconds even after a successful alert; what stops a second alert is the stamp key, not the sleep.
  - The fallback alert and the key event alert swallow every error including the send, while the model-added and deprecation alerts let the sender error out.
  - The Prometheus text for failed fallbacks still says "successful fallback requests"; pass B3888's text through unchanged.
  - "`request_kwargs` entry `user_api_key_dict` is skipped by exact key; every other key, including secrets-looking ones, is printed."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
