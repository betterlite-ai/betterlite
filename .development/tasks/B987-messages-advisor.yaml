id: B987
title: Messages advisor
description: >-
  Implement the advisor interceptor's typed tool loop, context injection and max-use termination. Resolve advisor
  credentials only from authorized deployment/config unless the exact source allow-client-credentials setting is
  enabled; redact all credential failures and keep advisor child-call provenance explicit. Use B732 resolved caller
  credentials; general_settings.allow_client_side_credentials defaults to unset/false for advisor credential overrides.


  _inject_max_uses_error (litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py:L356-L380) has no
  MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior
  case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/messages_advisor.rs. Use MessagesAdvisorInput and MessagesAdvisorResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions advisor_tool_loop, advisor_max_uses, caller_credentials_disabled, advisor_deployment_credentials,
  advisor_context_injection under api::messages_advisor::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): general_settings.allow_client_side_credentials
  defaults to None; env.DEFAULT_MAX_TOKENS defaults to 4096. No environment reads occur outside betterlite-config.
  Test api::messages_advisor::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesAdvisor in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_advisor: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: AdvisorOrchestrationHandler.can_handle
  (L48-L57); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: AdvisorOrchestrationHandler.handle
  (L59-L186); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _allow_client_side_advisor_credentials
  (L194-L205); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _resolve_advisor_credentials
  (L208-L248); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _make_synthetic_advisor_tool
  (L251-L266); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _find_advisor_tool_use (L269-L277);
  litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _extract_response_text (L280-L286); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py:
  _build_advisor_context (L292-L325); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _inject_advisor_turn
  (L328-L353); litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _resolve_advisor_router (L383-L398);
  litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _call_messages_handler (L401-L427); litellm/llms/anthropic/pass_through/messages/interceptors/base.py:
  MessagesInterceptor.can_handle (L22-L27); litellm/llms/anthropic/pass_through/messages/interceptors/base.py: MessagesInterceptor.handle
  (L30-L41); litellm/llms/anthropic/pass_through/messages/interceptors/__init__.py: get_messages_interceptors (L11-L17).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 299 owned nonblank/non-comment/non-docstring Python lines (377 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 319 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 605 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B014 (Call dispatch across providers
  and call types, shared settings and helpers), B061 (Stored credentials and their encryption), B171 (Direct helper
  oracle and URL path encoding), B967 (Messages chat transform), B1087 (Api boundaries), B732 (Typed authentication
  principals and grant resolution). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.
