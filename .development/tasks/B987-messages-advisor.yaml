out_of_scope:
- 'litellm/llms/anthropic/pass_through/messages/interceptors/advisor.py: _inject_max_uses_error L356-L380 are out
  of scope: no MIT runtime caller at the pin; unused entry point is not rebuilt.'
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_advisor in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_advisor.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_advisor.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Within AdvisorOrchestrationHandler.can_handle\'s not tools branch, preserve return False and its nested guards.
- AdvisorOrchestrationHandler.can_handle uses t.get('type'); retain its missing-value behavior and field spelling
  in the typed projection.
