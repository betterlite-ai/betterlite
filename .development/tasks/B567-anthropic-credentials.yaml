    why: The LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::anthropic_credentials_config_cases::case_[0-9]+_loads_litellm_anthropic_disable_url_suffix$/)'
      && grep -lq 'LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX' crates/betterlite-config/fuzz/corpus/config_yaml/anthropic_credentials*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::anthropic_credentials_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/anthropic_credentials*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_credentials_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_credentials_secret_safe_failure$/)'
  - id: case-oauth-direct-key-headers
    why: Raw api_key starting sk-ant-oat removes all x-api-key casings but does not remove alternate-cased Authorization;
      writes lowercase authorization plus the same beta/browser headers. Bearer-prefixed key is not recognized by
      this mutator; non-OAuth inputs pass through unchanged. A falsey existing beta returns the new beta directly.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_oauth_direct_key_headers$/)'
