pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_credentials in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/credentials.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_credentials.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- OAuth detection accepts Bearer-prefixed keys, but get_auth_header adds another Bearer prefix to them.
- The direct-key OAuth mutator can retain an uppercase Authorization alongside lowercase authorization.
