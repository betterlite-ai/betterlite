id: B567
title: Anthropic settings and OAuth credential projection
description: >-
  Create betterlite-anthropic as a leaf crate using existing OpenAI wire and prompt records. Add AnthropicSettings
  with api_base, api_key, auth_token, use_bearer_for_custom_base (false) and native version (2023-06-01); resolve
  ANTHROPIC_API_BASE, ANTHROPIC_BASE_URL, ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN in config. Default base is
  https://api.anthropic.com. OAuth tokens remain SecretString and preserve the pinned sk-ant-oat prefix classification,
  beta merge and browser-access header behavior. The model-list accessor makes the HTTP fetch specified below; the
  concrete token-counter accessor is owned by B585.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  is_anthropic_oauth_key L225-L231; resolve_used_client_oauth_token L237-L240; _merge_beta_headers L243-L249; optionally_handle_anthropic_oauth
  L252-L285; AnthropicError.__init__ L310-L316; AnthropicModelInfo._make_api_key_auth_header L943-L949; AnthropicModelInfo.get_api_base
  L1123-L1131; AnthropicModelInfo.get_api_key L1134-L1137; AnthropicModelInfo.get_auth_token L1140-L1148; AnthropicModelInfo.get_auth_header
  L1151-L1170; AnthropicModelInfo.get_base_model L1173-L1174; AnthropicModelInfo.get_models L1176-L1200.


  get_models makes GET {api_base}/v1/models through B173 with anthropic-version: 2023-06-01 and the selected auth
  header. Map each data[].id to anthropic/<id>; missing base or credential raises ValueError and non-2xx raises
  plain Exception. Load LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX as a boolean default false for B027; model listing
  is an HTTP fetch, not a catalog lookup.


  Named case contracts: key_before_auth_token: Truthy explicit key then ANTHROPIC_API_KEY wins over ANTHROPIC_AUTH_TOKEN;
  a resolved empty env key is still non-None and produces x-api-key empty. OAuth key becomes lowercase authorization=Bearer
  <resolved key>; a key already prefixed Bearer sk-ant-oat is detected but produces Bearer Bearer sk-ant-oat here.
  Auth-token values likewise gain Bearer unconditionally. base_env_precedence: Truthy explicit base, ANTHROPIC_API_BASE,
  ANTHROPIC_BASE_URL, then https://api.anthropic.com; api_key/auth_token use truthy explicit value then their respective
  environment variables. Global litellm.api_base/api_key are not read by these helpers. get_base_model removes every
  case-sensitive anthropic/ occurrence, returning None for falsey input. oauth_key_prefix: is_anthropic_oauth_key
  strips one exact Bearer prefix and tests case-sensitive sk-ant-oat; None/other casing fail. resolve_used_client_oauth_token
  returns None for non-bool, false for false or any provider other than exactly anthropic (including azure_ai),
  true only for true plus anthropic. oauth_existing_authorization: Header OAuth path chooses the first case-insensitive
  authorization key only; exact Bearer sk-ant-oat triggers extraction, removes every casing of authorization and
  x-api-key, writes lowercase authorization, merges sorted unique trimmed nonempty lowercase anthropic-beta tokens
  with oauth-2025-04-20, and sets anthropic-dangerous-direct-browser-access=true. A non-OAuth first authorization
  blocks checking later authorization keys. custom_base_bearer_opt_in: Default false; opt-in needs truthy base lacking
  substring api.anthropic.com anywhere and key not beginning sk-ant-. Then preserve an existing exact Bearer prefix
  or add it. Otherwise x-api-key remains, including lookalike hosts/path/query containing api.anthropic.com. missing_credential:
  Missing auth raises ValueError: ANTHROPIC_API_BASE/ANTHROPIC_BASE_URL or ANTHROPIC_API_KEY/ANTHROPIC_AUTH_TOKEN
  is not set. Please set the environment variable, to query Anthropic's `/models` endpoint. Missing base cannot
  occur with the real default resolver, so do not stub it to invent a separate oracle case. models_http_fetch: GET
  literal base+/v1/models without trimming slashes, anthropic-version=2023-06-01 plus resolved auth, no beta/browser
  mutation. Decode required data and required id; prefix every returned id anthropic/ even if already prefixed;
  no pagination or catalog fallback. models_non_2xx: raise_for_status failure becomes plain Exception: Failed to
  fetch models from Anthropic. Status code: <status>, Response: <text>; JSON/required-field failures propagate unchanged.
  AnthropicError delegates status/message/headers to B668 BaseLLMException. oauth_direct_key_headers: Raw api_key
  starting sk-ant-oat removes all x-api-key casings but does not remove alternate-cased Authorization; writes lowercase
  authorization plus the same beta/browser headers. Bearer-prefixed key is not recognized by this mutator; non-OAuth
  inputs pass through unchanged. A falsey existing beta returns the new beta directly.


  Shared provider base helper implementations are B2202: use its owned primitives directly when called by these
  ranges. Do not reintroduce a dependency on B010/B016 for these small helpers.


  Implement crates/betterlite-anthropic/src/credentials.rs with adjacent tests under credentials/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function credentials_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  key_before_auth_token, base_env_precedence, oauth_key_prefix, oauth_existing_authorization, custom_base_bearer_opt_in,
  missing_credential, models_http_fetch, models_non_2xx, oauth_direct_key_headers. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_credentials* using HelperCase: kind:
  helper and the externally tagged anthropic_credentials variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_credentials that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_anthropic_models consumes Anthropic models endpoint JSON response bytes in crates/betterlite-anthropic/src/credentials.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_credentials.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_credentials.
  The adjacent test replays_the_anthropic_credentials_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/anthropic/credentials.rs
  and its loader wiring: ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_API_BASE, ANTHROPIC_BASE_URL, use_bearer_for_custom_base,
  LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX. Module-level settings enter litellm_settings; deployment settings enter
  litellm_params; environment lookup is injected. Keep the defaults and precedence specified above and in the linked
  branches; existing key owners remain unchanged. Write config rstest anthropic_credentials_config_cases with named
  cases loads_anthropic_api_key, loads_anthropic_auth_token, loads_anthropic_api_base, loads_anthropic_base_url,
  loads_use_bearer_for_custom_base, loads_litellm_anthropic_disable_url_suffix, plus rejects_unrelated_key. Each
  loads case calls the real config loader with that key and asserts the resolved value, default, precedence and
  secret redaction where applicable. Seed B002 config_yaml with new anthropic_credentials* files for every key;
  reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone anthropic_credentials_credential_identity_isolation in betterlite-anthropic for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone anthropic_credentials_secret_safe_failure in betterlite-anthropic for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 121 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 165 production lines, 255 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 43 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 653 planned, 675 maximum changed lines.
