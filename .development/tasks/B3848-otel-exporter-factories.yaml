id: B3848
title: OTel exporter factories, codec, and datastore attributes
description: >-
  Build the exporter factory registry, the codec for OTLP/JSON encoding, the span processors
  for individual exporters, and the database endpoint module. Implement register_exporter_factory
  and _exporter_from_spec to build exporters keyed by a spec's kind field, with built-in support
  for OTLP/HTTP, OTLP/gRPC, console, in-memory, and a custom OTLP/JSON exporter that sends JSON
  encoding instead of protobuf. Add LiteLLMBaggageSpanProcessor to stamp baggage entries onto
  every span at start, with _is_allowed to check allowlisted keys and prefixes, and _processor_for
  to pick Simple or Batch processors. Implement the database endpoint module with parse_database_endpoint
  and postgres_endpoint to extract the non-sensitive PostgreSQL identity (host, port, database, schema)
  from DATABASE_URL and DATABASE_URL_READ_REPLICA environment variables, reading both path and libpq
  query parameters and handling Unix sockets, Cloud SQL connectors and RDS IAM rotation. Return None
  for replicas, missing URLs or unparseable schemes. Implement db_span_attributes to stamp server.address,
  server.port, db.namespace and db.system on database spans. Add build_span_exporter, build_resource,
  build_meter_provider, resolve_meter_provider, build_metric_reader, build_log_exporter, build_logger_provider,
  resolve_logger_provider, get_meter, and get_event_logger builder functions reusing the same exporter
  selection, with 5-second metric export intervals matching LiteLLM. Build the GenAIEventRecorder in
  events.py to emit gen_ai.client.operation.exception log events for failed model calls. Implement per-exporter
  W3C Baggage header decoding and OTLP endpoint signal path rewriting. Every provided function comes from
  LiteLLM at the pinned commit and reimplements its behavior exactly. Every deviation from LiteLLM is
  written down below and linked from deviations. This task covers exporter construction and codec logic;
  tenant-scoped span routing and per-destination redaction belong to B3849.
