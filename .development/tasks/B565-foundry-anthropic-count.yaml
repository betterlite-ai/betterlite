checks:
  optional:
  - mutants
  commands:
  - id: case-count-tokens-endpoint
    why: Strip trailing slashes, append /anthropic only when that substring is absent anywhere, then always append
      /v1/messages/count_tokens. Existing messages/count_tokens suffixes are duplicated rather than normalized;
      query text can suppress /anthropic insertion.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_cases::case_[0-9]+_count_tokens_endpoint$/)'
  - id: case-azure-auth-and-beta
    why: Send Content-Type=application/json, anthropic-version=2023-06-01, anthropic-beta from ANTHROPIC_TOKEN_COUNTING_BETA_VERSION
      (default token-counting-2024-11-01), x-api-key=explicit key. Insert api_key into params only when absent,
      then merge B2200 auth; native x-api-key remains even with a different params key or Bearer auth.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_cases::case_[0-9]+_azure_auth_and_beta$/)'
  - id: case-native-count-result
    why: Only provider azure_ai selects this counter. Falsey messages return None without requests (contents unused).
      Success maps input_tokens default 0, request_model/model_used, tokenizer_type=azure_ai_anthropic_api and preserves
      original_response; result None returns None.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_cases::case_[0-9]+_native_count_result$/)'
  - id: case-optional-native-selection
    why: Resolve truthy deployment litellm_params.api_key/api_base then AZURE_AI_API_KEY/AZURE_AI_API_BASE, without
      global fallbacks. Missing key logs No Azure AI API key found for token counting; missing base logs No Azure
      AI API base found for token counting; both return None. Credentials are required here even if params could
      support Entra auth.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_cases::case_[0-9]+_optional_native_selection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_anthropic_count.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_anthropic_count*")"
      && grep -lq 'foundry_anthropic_count' tools/oracle/fuzz/corpus/helper_case/foundry_anthropic_count* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_anthropic_count$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_anthropic_count)"
      && grep -q 'decode_foundry_count_reply' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_anthropic_count.rs
      && cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_anthropic_count_corpus$/)'
  - id: case-count-failure-error-result
    why: 'Handler validates and transforms via B585, posts JSON with explicit timeout even zero or litellm.request_timeout
      otherwise; only status 200 succeeds. Preserve raw non-200 status/text and HTTPStatusError status/text as AnthropicError;
      other exceptions become 500 CountTokens processing error: <error>. Counter catches AnthropicError and returns
      error=true, total_tokens=0, error_message and original status; arbitrary exception gives status 500. It does
      not perform a local tokenizer fallback.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_cases::case_[0-9]+_count_failure_error_result$/)'
  - id: case-count-error-warnings
    why: 'Counter AnthropicError warns Azure AI Anthropic CountTokens API error: status=<status>, message=<message>;
      generic exception warns Error calling Azure AI Anthropic CountTokens API: <error>. Preserve distinction between
      error records and missing-input None.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_cases::case_[0-9]+_count_error_warnings$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_count_secret_safe_failure$/)'
