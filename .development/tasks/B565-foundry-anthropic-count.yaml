out_of_scope:
- B026 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_anthropic_count in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/anthropic_count.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_anthropic_count.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The counter refuses an absent API key before calling Azure auth, even when Entra credentials are configured.
- The endpoint builder appends count_tokens to an already complete count endpoint.
