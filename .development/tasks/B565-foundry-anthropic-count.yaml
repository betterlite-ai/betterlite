id: B565
title: Foundry Anthropic token counting
description: >-
  Add Foundry Anthropic count-token endpoint and auth overrides with its own explicit error-result contract. Preserve
  configured base and count route construction, including native messages transformations; no tokenizer assets are
  downloaded.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/anthropic/count_tokens/handler.py:
  AzureAIAnthropicCountTokensHandler.handle_count_tokens_request L27-L127. litellm/llms/azure_ai/anthropic/count_tokens/token_counter.py:
  AzureAIAnthropicTokenCounter.should_use_token_counting_api L22-L26; AzureAIAnthropicTokenCounter.count_tokens
  L28-L121. litellm/llms/azure_ai/anthropic/count_tokens/transformation.py: AzureAIAnthropicCountTokensConfig.get_required_headers
  L25-L64; AzureAIAnthropicCountTokensConfig.get_count_tokens_endpoint L66-L88.


  Reuse BaseAzureLLM._base_validate_azure_environment from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicError.__init__ from B567 (litellm/llms/anthropic/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: count_tokens_endpoint: Strip trailing slashes, append /anthropic only when that substring
  is absent anywhere, then always append /v1/messages/count_tokens. Existing messages/count_tokens suffixes are
  duplicated rather than normalized; query text can suppress /anthropic insertion. azure_auth_and_beta: Send Content-Type=application/json,
  anthropic-version=2023-06-01, anthropic-beta from ANTHROPIC_TOKEN_COUNTING_BETA_VERSION (default token-counting-2024-11-01),
  x-api-key=explicit key. Insert api_key into params only when absent, then merge B2200 auth; native x-api-key remains
  even with a different params key or Bearer auth. native_count_result: Only provider azure_ai selects this counter.
  Falsey messages return None without requests (contents unused). Success maps input_tokens default 0, request_model/model_used,
  tokenizer_type=azure_ai_anthropic_api and preserves original_response; result None returns None. optional_native_selection:
  Resolve truthy deployment litellm_params.api_key/api_base then AZURE_AI_API_KEY/AZURE_AI_API_BASE, without global
  fallbacks. Missing key logs No Azure AI API key found for token counting; missing base logs No Azure AI API base
  found for token counting; both return None. Credentials are required here even if params could support Entra auth.
  count_failure_error_result: Handler validates and transforms via B585, posts JSON with explicit timeout even zero
  or litellm.request_timeout otherwise; only status 200 succeeds. Preserve raw non-200 status/text and HTTPStatusError
  status/text as AnthropicError; other exceptions become 500 CountTokens processing error: <error>. Counter catches
  AnthropicError and returns error=true, total_tokens=0, error_message and original status; arbitrary exception
  gives status 500. It does not perform a local tokenizer fallback. count_error_warnings: Counter AnthropicError
  warns Azure AI Anthropic CountTokens API error: status=<status>, message=<message>; generic exception warns Error
  calling Azure AI Anthropic CountTokens API: <error>. Preserve distinction between error records and missing-input
  None.


  Reuse the B585 config loaders for ANTHROPIC_TOKEN_COUNTING_BETA_VERSION and the shared transport loader for request_timeout/REQUEST_TIMEOUT;
  load AZURE_AI_API_KEY/AZURE_AI_API_BASE through B549. No new downloader or local fallback is introduced.


  Write standalone Rust test anthropic_count_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test anthropic_count_secret_safe_failure in betterlite-foundry: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-foundry/src/anthropic_count.rs with adjacent tests under anthropic_count/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_count_cases in betterlite-foundry with these exact named cases (one per oracle
  file): count_tokens_endpoint, azure_auth_and_beta, native_count_result, optional_native_selection, count_failure_error_result,
  count_error_warnings. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_anthropic_count* using HelperCase: kind:
  helper and the externally tagged foundry_anthropic_count variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_anthropic_count that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_foundry_count_reply consumes native Anthropic count response JSON bytes in crates/betterlite-foundry/src/anthropic_count.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_anthropic_count.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_anthropic_count.
  The adjacent test replays_the_foundry_anthropic_count_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 203 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 210 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 585 planned, 600 maximum changed lines.
