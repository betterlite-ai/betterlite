deviations:
  - what: Reads go through a typed `CeilingReads` trait instead of importing proxy_server globals (prisma_client, user_api_key_cache, global_mcp_server_manager).
    why: betterlite has no module-level state; the observable results are the same.
  - what: Lists that LiteLLM builds from a Python set come back de-duplicated in first-seen order.
    why: Python's set order is not stable, so no client can rely on it; tests compare as sets.
  - what: The `[]` versus `None` returns of the org and user server lists are the `CeilingServers` enum, and the (list, flag) tuples are `Capped`.
    why: Rust has no truthiness-based reading of an empty list, and the enum keeps "no ceiling", "unresolved" and "empty list" apart in types.
  - what: Only agent_capped_servers has oracle cases; every other function is covered by Rust tests with a fake `CeilingReads`.
    why: the rest read proxy_server globals, and a helper adapter cannot drive them; the HTTP cases come with the umbrella that wires the MCP routes.

out_of_scope:
  - "get_mcp_server_access, get_allowed_mcp_servers, the key/team intersection, require_end_user_mcp_access_defined and the order of the ceilings: B4671."
  - "get_allowed_tools_for_server, tool_is_granted, is_tool_allowed_for_server, is_tool_allowed and the admitted subject tool paths: B4672."
  - "_get_org_object_permission, _get_end_user_object_permission, _get_user_object_permission, _user_object_permission_id, _agent_object_permission_id, _get_agent_object_permission, _load_named_object_permission, _toolset_tool_permissions, _toolset_tools_for_server, _union_tool_grants, _get_team_object_permission and _key_object_permission_hydrated: B4668. This task calls them."
  - "_get_allowed_mcp_servers_for_key, _get_allowed_mcp_servers_for_team and servers from access groups: B4669."
  - "agent_caller_auth and resolve_agent_access_group_ceiling: B4778. managed_agent_policy: B4772. This task calls them through CeilingReads."
  - "managed_agent_access.py, the other caller of apply_agent_caller_ceiling and get_agent_tool_permissions_for_server: the managed agent tasks."
  - "_is_mcp_admitted_user_subject: one field read (mcp_admitted_user_subject == true) done inline in admin_view_unscoped."
  - "MCPServerManager.expand_permission_list, expand_tool_permissions and resolve_toolset_tool_permissions bodies: the server manager task."

pitfalls:
  - The end user server list adds no toolset servers, while the org, user and agent lists do, so an end user with only mcp_toolsets reads as "no restriction" on the servers axis.
  - user_servers turns an unreadable named permission into Unresolved, because the user getter raises a plain ValueError and not UnloadableEntitlementError, so the user server ceiling then fails with the unresolved error instead of the Unloadable deny.
  - An org permission whose lists union to nothing gives `Servers([])`, and apply_primary_org_ceiling then reads it as no ceiling, the same as NoRestriction; do not turn it into a deny-all.
  - apply_primary_org_ceiling replaces the list with the org list only for a key with no lower restriction; a keyless source (the admitted model unions grants) may only be capped, never given the org list.
  - An Unresolved org empties a keyless source but leaves a key untouched, and an Unloadable org error is never turned into Unresolved, so it denies both shapes.
  - apply_user_tool_ceiling answers `Some(empty)` on any user permission read error, since the caller's own handler would read a raise as allow-all for key auth, but an error from the toolset read right after it is not caught there.
  - apply_agent_caller_ceiling caps by the echoed team only when `team_servers` is non-empty, so a caller team with no MCP grants widens nothing and narrows nothing, and `restricts` is then decided by the user step alone.
  - apply_agent_caller_tool_ceiling denies with an empty list when the caller team cannot be read, but a caller with no echoed headers (no caller auth) leaves the tools untouched.
  - An empty `agent_servers` list means "no direct restriction", yet an empty access group ceiling set means "deny every server"; agent_capped_servers must tell them apart by `None` versus empty.
  - For a managed agent (policy attached to the auth) any resolution error is returned and never swallowed into an empty list, which for a plain agent means no restriction.
  - admin_view_unscoped treats an admitted subject's own object_permission.mcp_servers (empty by database default) as no scope, but a credential's explicit list, even an empty one, always disqualifies the admin.
  - agent_tool_permissions_for_server reads direct tool grants only when `mcp_tool_permissions` is non-empty, while the org tool step checks the same condition on the org permission; a wildcard direct grant makes the level None whatever the toolsets say.

review_level: security

