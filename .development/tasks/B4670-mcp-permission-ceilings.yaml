dod:
  - text: >-
      The org server list is the union of expanded mcp_servers, access group servers, tool permission keys and toolset keys; no permission gives NoRestriction, an unreadable named permission or unresolvable
      declared toolsets return the Unloadable error, and every other error gives Unresolved.
    proof: [org-tests]
  - text: >-
      The org ceiling application leaves the list alone for no org_id, NoRestriction or an empty org list, empties it for an Unresolved org on a keyless source and keeps it for a key, caps by membership when a lower
      restriction exists or the source is keyless, and replaces the list otherwise, with the flag true only in the last two cases.
    proof: [org-tests]
  - text: >-
      The end user server list returns an empty list for no end_user_id, no database, no permission or an error inside the union, returns the Unloadable error from the getter, and contains no toolset servers.
    proof: [end-user-tests]
  - text: >-
      The user server list includes toolset servers, gives NoRestriction for no permission, and gives Unresolved for every error including an unreadable named permission.
    proof: [user-tests]
  - text: >-
      The user server ceiling skips a keyless source without reading, errors when the entitlement is Unresolved, leaves the list when the user restricts nothing and caps it otherwise;
      user_places_ceiling is true for Unresolved or a non-empty list.
    proof: [user-tests]
  - text: >-
      admin_view_unscoped is false for no auth, mcp_explicit_grants_only, a non-admin role, or a non-admitted credential whose own object_permission sets mcp_servers (even to an empty list);
      otherwise it is true exactly when the user places no ceiling.
    proof: [user-tests]
  - text: >-
      The agent server list returns an empty list for no agent_id or no permission, includes toolset and tool permission servers, returns Unloadable errors, and also returns any other error for a managed agent
      but turns it into an empty list for a plain agent.
    proof: [agent-tests]
  - text: >-
      agent_capped_servers returns no cap when the agent names no servers and has no access group ceiling, treats an empty access group ceiling as deny-all, intersects both when both exist, and keeps the allowed list's order;
      the agent access group ceiling expands the group server ids and is None without an agent_id or attached groups.
    proof: [agent-tests, oracle]
  - text: >-
      The agent caller server ceiling leaves the list alone without an echoed caller, caps by the caller team's servers only when that list is non-empty, then applies the user ceiling to the echoed user,
      and reports restricts when either step did.
    proof: [agent-tests]
  - text: >-
      The user and end user tool ceilings intersect with the entitlement's grants on the server, adopt those grants when the incoming tools are None, ignore a wildcard or absent grant,
      and the user ceiling returns an empty list on any read error or leaves a keyless source untouched.
    proof: [tool-tests]
  - text: >-
      The agent caller tool ceiling denies every tool when the caller team cannot be read, intersects with the team's grants, then applies the user tool ceiling; the agent tool permissions for a server return None for
      no restriction and the Unloadable or managed-agent errors; the agent and org tool ceilings intersect both, and an unresolvable org is skipped for a key but returned for a keyless source or an Unloadable error.
    proof: [tool-tests]
  - text: Helper cases for agent_capped_servers are present, replay through the shared parser and agree with LiteLLM.
    proof: [helper-case-corpus, helper-python, helper-tests, oracle]

checks:
  optional: []
  commands:
    - id: org-tests
      why: the org server list or the org ceiling application is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^ceilings::tests::org_/)'
    - id: end-user-tests
      why: the end user server list is missing, adds toolset servers, or swallows the Unloadable error
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^ceilings::tests::end_user_/)'
    - id: user-tests
      why: the user server list, user server ceiling, user_places_ceiling or admin_view_unscoped is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^ceilings::tests::user_/)'
    - id: agent-tests
      why: the agent server list, agent caps, access group ceiling or agent caller server ceiling is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^ceilings::tests::agent_/)'
    - id: tool-tests
      why: one of the tool ceilings (user, end user, agent caller, agent and org) is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^ceilings::tests::tool_/)'
    - id: helper-tests
      why: the helper adapter does not agree with LiteLLM on agent_capped_servers
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::mcp::b4670::/) - test(/replays_the_/)'
    - id: helper-python
      why: the Python helper adapter is missing or fails the strict checks
      run: test -f tools/oracle/helpers/b4670.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-ceilings helper case reaches the shared parser
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-ceilings-*')" && grep -rlq b4670 tools/oracle/fuzz/corpus/helper_case/mcp-ceilings-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

