id: B4670
title: MCP user, organization and agent permission ceilings
description: >-
  Build the ceilings that narrow an MCP caller's server list and tool list after the key and team levels
  (B4669) have run: the organization, end user, internal user and agent levels, plus the agent caller
  (the user and team an agent echoes back in x-litellm-user-id and x-litellm-team-id). Put the code in
  `crates/betterlite-mcp/src/ceilings.rs` and `ceilings/**`, with its own `CeilingsError` enum. Combining the levels in
  order (get_mcp_server_access, get_allowed_tools_for_server) is B4671 and B4672; this task only supplies the pieces they call.
  Reuse, do not rebuild: the resolved-key record `UserApiKeyAuth` (B2314: fields `org_id`, `end_user_id`, `user_id`, `agent_id`,
  `team_id`, `object_permission`, `requires_fresh_policy`, `mcp_explicit_grants_only`, `mcp_admitted_user_subject`, `agent_caller`,
  `user_role`, and its `user_api_key_has_admin_view` predicate), B4668's `ObjectPermission` row (`mcp_servers`, `mcp_access_groups`,
  `mcp_tool_permissions`, `mcp_toolsets`), `UnloadableEntitlementError`, its object permission getters, `toolset_tool_permissions`,
  `toolset_tools_for_server` and `union_tool_grants`, and B4669's `team_servers` and `servers_from_access_groups`.

  Everything outside this module goes through one trait, `CeilingReads`, received by the constructor of `Ceilings<R: CeilingReads>`
  (generic, no trait object, no global). All methods are async and return `Result<_, CeilingReadError>`, an enum with
  `Unloadable(UnloadableEntitlementError)` and `Failed(String)`: `has_database() -> bool` (sync); `org_object_permission(auth) -> Option<ObjectPermission>`,
  `end_user_object_permission(auth)`, `user_object_permission(auth)`, `agent_object_permission(auth)` and `team_object_permission(auth)`
  (B4668's getters, each already applying its own rules for absent rows, unreadable rows and the database being down);
  `servers_from_access_groups(groups, fresh) -> Vec<String>` and `team_servers(auth) -> Vec<String>` (B4669);
  `toolset_tool_permissions(permission, fresh) -> Map<server_id, Vec<tool>>` and `toolset_tools_for_server(permission, server_id, fresh) -> Option<Vec<String>>`
  (B4668, which return `Unloadable` when declared toolsets resolve to nothing); `expand_permission_list(names) -> Vec<String>` and
  `expand_tool_permissions(map) -> Map<server_id, Vec<tool>>` (the server manager's registry expansion, sync, no owner at the pin, see notes);
  `agent_access_group_server_ids(agent_id) -> Option<Vec<String>>` (B4778's resolve_agent_access_group_ceiling, `mcp_server_ids` of the attached groups, `None` when none attached);
  `agent_caller_auth(auth) -> Option<UserApiKeyAuth>` (B4778: a bare record holding only the echoed user_id and team_id and the caller's `requires_fresh_policy`, `None` when nothing was echoed)
  and `is_managed_agent(auth) -> bool` (B4772's managed_agent_policy is present). Tests use an in-memory fake of `CeilingReads`; the production implementation
  is a thin struct that forwards to those owners and is built in this task.

  Shared result shapes. `CeilingServers` is an enum: `NoRestriction` (LiteLLM's `[]`), `Unresolved` (LiteLLM's `None`) and `Servers(Vec<String>)`.
  `Capped { servers: Vec<String>, restricts: bool }` is the (list, flag) pair LiteLLM returns from the server ceilings. Tool lists are `Option<Vec<String>>`:
  `None` is unrestricted, `Some(empty)` denies every tool. Lists LiteLLM builds from a Python set come back de-duplicated in first-seen order.

  Server level functions (each a method on `Ceilings`, LiteLLM name in backticks):
  1. `org_servers` (`_get_allowed_mcp_servers_for_org`). Read `org_object_permission`. No permission gives `NoRestriction`. Otherwise the union of
  `expand_permission_list(mcp_servers)`, `servers_from_access_groups(mcp_access_groups, fresh)`, the keys of `expand_tool_permissions(mcp_tool_permissions)` and the keys of
  `toolset_tool_permissions`. An `Unloadable` error from the getter or from the toolset read is returned as `CeilingsError::Unloadable` (deny for every caller shape). Any
  other error is logged as a warning and gives `Unresolved`. Note the union can come out empty, which then reads as `Servers([])`, not `NoRestriction`.
  2. `apply_primary_org_ceiling` (`_apply_primary_org_ceiling`), inputs: the current list, the auth, `has_lower_level_restrictions`, `keyless_source`. No auth or no `org_id`: list unchanged, `restricts=false`.
  Read `org_servers`. `Unresolved`: a keyless source gets an empty list, a key keeps its list, `restricts=false`, warn either way. `NoRestriction` and `Servers([])` both leave the list unchanged with `restricts=false`
  (an empty org list means no ceiling). A non-empty org list caps the list by membership (order of the current list kept) when `has_lower_level_restrictions` or `keyless_source`; otherwise the org list replaces
  the current list. `restricts=true` in both of those arms.
  3. `end_user_servers` (`_get_allowed_mcp_servers_for_end_user`). No auth, no `end_user_id`, or no database gives an empty list. Read `end_user_object_permission`; `None` gives an empty list; an `Unloadable` error from it is returned.
  Otherwise the union of expanded `mcp_servers`, access group servers and the keys of `expand_tool_permissions(mcp_tool_permissions)`. Any error inside that union is warned and gives an empty list. This level does NOT add toolset servers.
  4. `user_servers` (`_get_allowed_mcp_servers_for_user`). Read `user_object_permission`; `None` gives `NoRestriction`. Otherwise the same union as the org level, including toolset keys. Every error, `Unloadable` included, is warned and gives `Unresolved`.
  5. `apply_user_server_ceiling` (`_apply_user_server_ceiling`), input `keyless_source`. A keyless source returns the list unchanged with `restricts=false` and reads nothing. Otherwise `user_servers`: `Unresolved` returns
  `CeilingsError::UserCeilingUnresolvable { user_id }`; `NoRestriction` or an empty list leaves the list unchanged with `restricts=false`; a non-empty list caps by membership with `restricts=true`.
  6. `user_places_ceiling` (`_user_places_mcp_ceiling`): true when `user_servers` is `Unresolved` or a non-empty list. `admin_view_unscoped` (`admin_view_unscoped`): false for no auth, `mcp_explicit_grants_only`, or a role that is not proxy admin or proxy admin viewer (use B2314's `user_api_key_has_admin_view`).
  False when the auth is not an admitted user subject (`mcp_admitted_user_subject != true`) and its own `object_permission` has `mcp_servers` set to a list (including an empty list). Otherwise the negation of `user_places_ceiling`.
  7. `agent_servers` (`get_allowed_mcp_servers_for_agent`). No auth or no `agent_id` gives an empty list. Use the pre-fetched permission when the caller passes one, else `agent_object_permission` (its `Unloadable` error is returned). No permission gives an empty list.
  Otherwise the union of expanded `mcp_servers`, access group servers, the keys of `toolset_tool_permissions` and the keys of `expand_tool_permissions(mcp_tool_permissions)`. On error: return it when the agent is managed (`is_managed_agent`) or the error is `Unloadable`, else warn and give an empty list.
  8. `agent_access_group_ceiling` (`_get_agent_access_group_server_ceiling`): no `agent_id` or `agent_access_group_server_ids` answering `None` gives `None`; otherwise `Some(expand_permission_list(sorted ids))`, which can be an empty set that denies every server.
  `agent_capped_servers` (`_agent_capped_servers`, pure): when `agent_servers` is empty and the ceiling is `None`, return `None` (no cap). Otherwise keep each allowed server that is in `agent_servers` (skipped when `agent_servers` is empty) and in the ceiling (skipped when the ceiling is `None`), in the allowed list's order.
  9. `apply_agent_caller_ceiling` (`apply_agent_caller_ceiling`). `agent_caller_auth` of the auth gives `None`: list unchanged, `restricts=false`. Otherwise `team_servers(caller_auth)`; non-empty caps the list by membership, empty leaves it. Then `apply_user_server_ceiling` on that result with the caller auth and `keyless_source=false`
  (its error is returned). `restricts` is true when the team list was non-empty or the user ceiling restricted.

  Tool level functions (the tools axis; B4672 chains them):
  10. `apply_user_tool_ceiling` (`_apply_user_tool_ceiling`), inputs: allowed tools, `server_id`, auth, `keyless_source`. A keyless source returns the tools unchanged. Read `user_object_permission`; ANY error gives `Some(empty)` (deny, because key auth would otherwise
  read a raise as allow-all). No permission returns the tools unchanged. Otherwise `union_tool_grants(expand_tool_permissions(mcp_tool_permissions)[server_id], toolset_tools_for_server(permission, server_id, fresh))`: `None` returns the tools unchanged;
  `Some(grants)` becomes the list when the incoming tools are `None`, else their intersection. An error from the toolset read here is returned, not turned into a deny.
  11. `apply_end_user_tool_ceiling` (`_apply_end_user_tool_ceiling`): no auth, no `end_user_id` or no database returns the tools unchanged. Same narrowing as 10 on `end_user_object_permission`; errors are returned.
  12. `apply_agent_caller_tool_ceiling` (`apply_agent_caller_tool_ceiling`). `agent_caller_auth` gives `None`: tools unchanged. Read the caller's `team_object_permission` and its `toolset_tools_for_server`; any error there returns `Some(empty)`.
  Team grants are `union_tool_grants(direct tools for the server, toolset tools)`; `None` keeps the incoming tools, else it becomes the list (incoming `None`) or the intersection. Then run 10 on the result with the caller auth.
  13. `agent_tool_permissions_for_server` (`get_agent_tool_permissions_for_server`). No auth or no `agent_id` gives `None`. Pre-fetched permission or `agent_object_permission`; no permission gives `None`. Direct tools are read only when `mcp_tool_permissions` is non-empty. Result is
  `union_tool_grants(direct, toolset_tools_for_server(...))`. Errors: returned for a managed agent or `Unloadable`, else warn and `None`.
  14. `apply_agent_and_org_tool_ceilings` (`_apply_agent_and_org_tool_ceilings`). With an `agent_id`: fetch the agent permission once, call 13, and intersect (or adopt when incoming is `None`) when it is non-`None`. With an `org_id`: read `org_object_permission`; on error, a keyless source or an `Unloadable` error is returned,
  any other error is warned and the tools so far are returned. Org tools are `union_tool_grants(direct tools for the server when the org has `mcp_tool_permissions`, toolset_tools_for_server)`; non-`None` intersects (or is adopted when incoming is `None`).

  All names, sentinels and defaults are LiteLLM's: `no-mcp-servers`, `all-proxy-mcpservers` and the wildcard tool name `*` (MCP_ALL_TOOLS_WILDCARD) stay inside B4668 and B4669. There is no config key or env var in these functions.
  They run on every MCP request, so keep the reads to the ones listed above.

