id: B3961
title: Athina Greenscale and PromptLayer event delivery
description: >-
  Implement three small, synchronous event adapters for HTTP analytics services over the shared
  outbound transport. Each logger reads a single API key from environment, forwards it in
  outbound headers or request bodies, and handles service-specific metadata filtering, time units
  and error swallowing without re-raising.

  Athina logger reads ATHINA_API_KEY and ATHINA_BASE_URL (default https://log.athina.ai) from B002;
  POSTs to /api/v1/log/inference with athina-api-key header and JSON body containing model,
  request, response, token usage, latency and additional metadata fields (environment, prompt_slug,
  customer_id, customer_user_id, session_id, external_reference_id, context, expected_response,
  user_query, tags, user_feedback, model_options, custom_attributes extracted from litellm_params.metadata).
  Skip streaming calls that lack complete_streaming_response in kwargs; log the assembled response
  in non-streaming mode and the buffered completion_response in streaming mode.

  Greenscale logger reads GREENSCALE_API_KEY and GREENSCALE_ENDPOINT (no default) from B002;
  POSTs to the configured GREENSCALE_ENDPOINT with api-key header and JSON body containing modelId,
  input/outputTokenCount, timestamp (UTC ISO 8601), invocationLatency (milliseconds) and tags array.
  Extract greenscale_project and greenscale_application metadata to top-level data fields; collect
  remaining greenscale_* prefixed metadata keys as tag objects with key/value pairs.

  PromptLayer logger reads PROMPTLAYER_API_KEY from B002; implements a two-step process. First,
  POST to https://api.promptlayer.com/rest/track-request with function_name="openai.ChatCompletion.create",
  kwargs dict, tags list, request_response (pydantic BaseModel converted to dict via model_dump()),
  request_start_time and request_end_time (integer seconds since Unix epoch), and api_key.
  Extract pl_tags from litellm_params.metadata for the tags field. If the first request succeeds
  (success=true in response) and request_id exists, conditionally POST to https://api.promptlayer.com/rest/track-metadata
  with request_id, api_key and remaining metadata (pl_tags removed) only when metadata dict is non-empty.

  Use B173 for module_level_client.post calls. Build on B002's environment lookup for
  ATHINA_API_KEY, ATHINA_BASE_URL, GREENSCALE_API_KEY, GREENSCALE_ENDPOINT, PROMPTLAYER_API_KEY.
  Every call swallows exceptions; log errors via print_verbose but never re-raise.

