deviations:
  - what: >-
      Athina skips logging entirely when stream=true and complete_streaming_response is not in kwargs.
      This differs from Greenscale and PromptLayer, which log all successful responses regardless of
      streaming mode.
    why: >-
      The source explicitly checks for streaming and complete_streaming_response (lines 39-46),
      returning early if streaming without the buffered response. This is the exact source behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/athina.py#L39-L46

  - what: >-
      Greenscale requires GREENSCALE_ENDPOINT to be set; the logger raises an exception at runtime
      if the endpoint is None, unlike Athina and PromptLayer which have defaults or accept None.
    why: >-
      The source checks "if self.greenscale_logging_url is None" in log_event and raises
      Exception (line 48), making this a runtime validation, not an initialization time check.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/greenscale.py#L47-L48

  - what: >-
      Greenscale uses UTC ISO 8601 timestamp format (YYYY-MM-DDTHH:MM:SSZ) while Athina and PromptLayer
      use milliseconds/integer seconds respectively.
    why: >-
      The source calls datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ") (line 28),
      producing a literal ISO 8601 formatted string for each log event.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/greenscale.py#L28

  - what: >-
      PromptLayer converts pydantic BaseModel responses to dict via model_dump() if the response is
      a BaseModel instance, passing dicts unchanged, then sends the result in the request_response field.
    why: >-
      The source checks "isinstance(response_obj, BaseModel)" and calls response_obj.model_dump()
      if true (lines 44-45), ensuring the JSON body contains a dict, not a model instance.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prompt_layer.py#L44-L45

  - what: >-
      PromptLayer sends request_start_time and request_end_time as integer seconds (Unix timestamp),
      not milliseconds or datetime objects. Both timestamps are computed using int(timestamp()).
    why: >-
      The source calls int(start_time.timestamp()) and int(end_time.timestamp()) (lines 54-55),
      which returns integer seconds since epoch, not milliseconds.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prompt_layer.py#L54-L55

  - what: >-
      PromptLayer always sends function_name="openai.ChatCompletion.create" as a literal string,
      regardless of the actual completion method or provider used.
    why: >-
      The source hardcodes "openai.ChatCompletion.create" in the track-request POST (line 50).
      This is not derived from the call context but sent as a fixed string for all calls.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prompt_layer.py#L50

  - what: >-
      PromptLayer only sends the track-metadata request if three conditions are met: the first
      track-request succeeds (success=true in response), the response includes a request_id, and
      the metadata dict is non-empty after removing pl_tags.
    why: >-
      The source checks 'if "request_id" in response_json' (line 70) and then 'if metadata:' (line 71)
      inside the success block. Metadata is built by removing pl_tags and keeping all other
      litellm_params.metadata keys (lines 36-37). No POST occurs if either condition fails.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prompt_layer.py#L70-L79

out_of_scope:
  - B002 owns environment variable lookup and default value injection for ATHINA_API_KEY, ATHINA_BASE_URL, GREENSCALE_API_KEY, GREENSCALE_ENDPOINT, PROMPTLAYER_API_KEY.
  - B173 owns pooled HTTP client and module_level_client.post execution.
  - Exception handling that calls print_verbose is preserved as-is from the source; no additional logging or retry logic is added beyond the source behavior.

pitfalls:
  - The oracle helper at tools/oracle/src/helpers/logging/b3961.rs is pre-registered by the skeleton; do not add it to registry files.
  - Athina skips the entire log_event when streaming without complete_streaming_response; this is not a fallback to response_obj, but an early return.
  - Greenscale's GREENSCALE_ENDPOINT check happens at runtime in log_event, not at initialization; the logger initializes with None if the env var is missing.
  - Greenscale extracts greenscale_project and greenscale_application to top-level data fields; other greenscale_* keys go to tags array with key/value objects, not direct inclusion.
  - PromptLayer's response conversion uses model_dump() only if isinstance(response_obj, BaseModel); dicts pass through unchanged (line 45 is a no-op for dicts).
  - PromptLayer's first POST endpoint is https://api.promptlayer.com/rest/track-request (literal, with path /rest/track-request).
  - PromptLayer's request_response field is a dict built from pydantic BaseModel.model_dump() or passed unchanged from dict responses.
  - PromptLayer's second POST endpoint is https://api.promptlayer.com/rest/track-metadata (literal, with path /rest/track-metadata), only called if request_id exists and metadata dict is non-empty.
  - PromptLayer's track-metadata request only occurs if request_id exists in the first response and metadata dict is non-empty; an empty metadata dict does not trigger a second POST.
  - All three loggers swallow exceptions via try/except and log to print_verbose; exceptions do not bubble up to the caller.
  - Athina's additional_keys list includes 13 specific metadata field names; only these keys from litellm_params.metadata are added to the payload.
  - PromptLayer uses "openai.ChatCompletion.create" as a literal string, not a reflection of the actual call type or provider.
  - PromptLayer's pl_tags extraction is a list (not a single tag); it is placed in the top-level "tags" field of the track-request POST.

