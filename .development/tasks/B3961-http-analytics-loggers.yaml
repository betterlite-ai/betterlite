dod:
  - text: "AthinaLogger initializes with ATHINA_API_KEY, ATHINA_BASE_URL (default https://log.athina.ai) and additional_keys list; builds athina-api-key header."
    proof: [athina-init-test, athina-init-oracle]

  - text: "Athina log_event skips streaming calls without complete_streaming_response in kwargs; logs complete_streaming_response in streaming mode and response_obj in non-streaming mode."
    proof: [athina-streaming-test, athina-streaming-oracle]

  - text: "Athina log_event extracts response_time from start_time and end_time as milliseconds, extracts prompt from messages if present, extracts tools and functions from optional_params, extracts additional metadata keys from litellm_params.metadata."
    proof: [athina-payload-test, athina-payload-oracle]

  - text: "Athina log_event POSTs to /api/v1/log/inference endpoint with athina-api-key header and JSON body (using default=str serializer). On any status code, logs response via print_verbose and does not re-raise."
    proof: [athina-post-test, athina-post-oracle]

  - text: "GreenscaleLogger initializes with GREENSCALE_API_KEY and GREENSCALE_ENDPOINT; raises exception if GREENSCALE_ENDPOINT is None."
    proof: [greenscale-init-test, greenscale-init-oracle]

  - text: "Greenscale log_event extracts modelId, inputTokenCount, outputTokenCount from response usage; sets timestamp to UTC ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ)."
    proof: [greenscale-timestamp-test, greenscale-timestamp-oracle]

  - text: "Greenscale log_event extracts invocationLatency from start_time and end_time as milliseconds; extracts greenscale_project and greenscale_application to top-level fields and remaining greenscale_* prefixed keys to tags array with key/value objects."
    proof: [greenscale-metadata-test, greenscale-metadata-oracle]

  - text: "Greenscale log_event POSTs to GREENSCALE_ENDPOINT with api-key header and JSON body (using default=str serializer). On any status code, logs response via print_verbose and does not re-raise."
    proof: [greenscale-post-test, greenscale-post-oracle]

  - text: "PromptLayerLogger initializes with PROMPTLAYER_API_KEY from environment."
    proof: [promptlayer-init-test, promptlayer-init-oracle]

  - text: "PromptLayer log_event converts pydantic BaseModel response to dict via model_dump() or passes dict as-is; collects pl_tags from litellm_params.metadata as tags list and remaining metadata as dict (pl_tags removed)."
    proof: [promptlayer-conversion-test, promptlayer-conversion-oracle]

  - text: "PromptLayer log_event POSTs to https://api.promptlayer.com/rest/track-request with function_name=openai.ChatCompletion.create, kwargs (model and messages from kwargs plus optional_params), tags array, request_response dict, request_start_time and request_end_time as integer seconds, and api_key."
    proof: [promptlayer-track-request-test, promptlayer-track-request-oracle]

  - text: "PromptLayer track-request POST response includes request_id on success; if request_id exists and metadata dict is non-empty, conditionally POST to https://api.promptlayer.com/rest/track-metadata with request_id, api_key and metadata."
    proof: [promptlayer-track-metadata-test, promptlayer-track-metadata-oracle]

  - text: "PromptLayer log_event swallows all exceptions and logs them via print_verbose without re-raising. Athina and Greenscale also swallow exceptions with print_verbose logging."
    proof: [http-analytics-error-test, http-analytics-error-oracle]

