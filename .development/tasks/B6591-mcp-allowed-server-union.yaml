dod:
  - text: A managed agent returns B4671's servers (limited to the given access), and a non-admitted key that lists no-mcp-servers returns an empty list before any open channel is added.
    proof: [union-tests]
  - text: The union holds the resolved grants (the whole registry for an unscoped admin), the allow-all servers, the caller's own submitted servers and, for an anonymous caller, the passthrough servers; keys with their own mcp_servers list or explicit-grants-only get no submitted servers.
    proof: [union-tests]
  - text: With mcp_allow_all_keys_respects_mcp_scope on, a virtual key with a scoped or unresolved access loses the allow-all servers it was not granted, and keeps submitted ones unless its scope is unresolved.
    proof: [union-tests]
  - text: A keyless admitted subject with a session resource scope gets only that one server from every branch, the error fallback included, and any error in the union falls back to allow-all plus submitted servers or to nothing for explicit-grants-only callers.
    proof: [union-tests]
  - text: Open server ids are empty inside a toolset or explicit-grants scope, and the admitted-subject exception keeps a user's own submissions despite an empty mcp_servers row.
    proof: [open-tests]
  - text: The submitted server read uses the 60 second cache, ignores cache faults, returns an empty list on a database fault and only ids the registry still holds; invalidation deletes the key.
    proof: [submitted-tests]
  - text: Toolset permissions are cached under the sorted-ids key, skip the cache and the replica when fresh, return an empty map for no ids and, on a fault, an empty map when not fresh and the error when fresh.
    proof: [toolset-tests]
  - text: allowed_tables returns the table of each allowed id and skips unknown ids with a warning.
    proof: [union-tests]
  - text: The allow-all scope setting defaults to false and loads from general_settings.mcp_allow_all_keys_respects_mcp_scope.
    proof: [config-tests]
  - text: The production reads map store results and errors to the port values.
    proof: [reads-tests]

checks:
  optional: []
  commands:
    - id: union-tests
      why: the allowed server union, its guard fallback or the table list is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^allowed_union::tests::/)'
    - id: open-tests
      why: the open channel server ids are missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^allowed_union::open::tests::/)'
    - id: submitted-tests
      why: the submitted server cache read or invalidation is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^allowed_union::submitted::tests::/)'
    - id: toolset-tests
      why: the toolset permission resolution or its cache is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^allowed_union::toolsets::tests::/)'
    - id: config-tests
      why: the allow-all scope setting does not load or has the wrong default
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_allow_all_scope::/)'
    - id: reads-tests
      why: the production reads map a store result to the wrong port value
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::union_reads::tests::/)'

oracle_cases: []

deviations:
  - what: Stores, the shared cache and the grant functions go through typed ports (UnionReads, ToolsetCache, GrantSource), not proxy_server globals.
    why: betterlite has no module-level state; the observable results are the same.
  - what: The returned list is de-duplicated in a fixed order (grants, open channels, passthrough), where LiteLLM returns a Python set in arbitrary order.
    why: set order is not stable, so no client can rely on it; tests compare as sets where order is not part of the contract.
  - what: The mcp_allow_all_keys_respects_mcp_scope flag is read once at config load.
    why: betterlite config is immutable after load.

out_of_scope:
  - "get_mcp_server_access, get_allowed_mcp_servers of MCPRequestHandler and admitted subject sources: B4671. admin_view_unscoped: B4670."
  - "Registry reads, lookups and table building: B4731. The MCPServer record: B6590."
  - "invalidate_toolset_cache and get_toolset_by_name_cached: B6592 owns them. B4681 owns the toolset storage they read."
  - "get_all_mcp_servers_with_health_and_teams and health_check_server: B6592 owns them."
  - "Wiring ServerUnion and LiveUnionReads into application state, and every route: B8621 (state), B8625, B8701 and B8626 (routes)."

pitfalls:
  - "The managed agent branch and the no-mcp-servers opt-out return before any open channel is added, so the opt-out stays absolute; the opt-out does not apply to a keyless admitted subject."
  - "An empty object_permission.mcp_servers list is an explicit scope for a key and means no submitted servers, but for an admitted subject it is just the default of the user's row and must not hide submissions."
  - "The session resource scope is applied last, over the whole union and over the fallback, so an error never widens a scoped bearer."
  - "The error fallback returns allow-all plus submitted servers, but nothing at all when the caller has explicit-grants-only."
  - "restrict_allow_all keeps submitted servers in the 'not removed' set unless the access scope is unresolved, and it needs a virtual key, not any auth."
  - "A cache fault in the submitted server read is a miss. After a database fault the empty list is still written to the cache for 60 seconds, as LiteLLM does."
  - "resolve_toolset_permissions raises only when fresh policy is requested; a revocation check must never turn a read fault into no grants."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
