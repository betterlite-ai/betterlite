id: B6591
title: MCP allowed server union and open channels
description: >-
  Build the per-caller list of MCP servers the registry hands out: the grants from B4671 plus the servers anyone may reach (allow_all_keys servers, the caller's own submitted servers and passthrough servers), bounded by the session resource scope. In LiteLLM that is MCPServerManager.get_allowed_mcp_servers, operator_open_server_ids, _admitted_session_resource_scope, the BYOM submitted-server cache and resolve_toolset_tool_permissions, plus get_all_allowed_mcp_servers. B4717 and the tool paths call these, and B4671's RegistryReads port gets its toolset method from here.


  Code goes in betterlite-mcp, module allowed_union: crates/betterlite-mcp/src/allowed_union.rs, allowed_union/** and a tests.rs beside each file. The production reads go in betterlite-server, module mcp::union_reads (crates/betterlite-server/src/mcp/union_reads.rs with a tests.rs). The config key goes in betterlite-config, section mcp_allow_all_scope (crates/betterlite-config/src/sections/mcp_allow_all_scope.rs with a tests.rs): general_settings.mcp_allow_all_keys_respects_mcp_scope, a boolean defaulting to false, exposed as config.sections.mcp_allow_all_scope. Do not add the key to the shared loader outside that file's own tests. The crates already depend in this direction, so no Cargo.toml changes.


  ServerUnion<U: UnionReads, G: GrantSource, C: ToolsetCache> holds settings: UnionSettings { respects_scope: bool }, registry: &ServerRegistry (B4731) or a shared pointer to it, reads: U, grants: G and cache: C, all in a struct literal. GrantSource is the port to B4671 and B4670 with these methods: managed_servers(auth) -> Result<Vec<String>, UnionError> (B4671's allowed_servers for an auth that has a managed agent policy), access(auth) -> Result<ServerAccess, UnionError> (B4671's server_access) and admin_unscoped(auth) -> Result<bool, UnionError> (B4670's admin_view_unscoped). B4731 does not depend on this task, so no cycle. UnionReads is the async store port: submitted_server_ids(user_id) -> Result<Vec<String>, UnionError> (B4711's get_active_submitted_mcp_server_ids_for_user) and toolsets(toolset_ids, use_writer) -> Result<Vec<ToolsetRow>, UnionError> (B4681's list_mcp_toolsets) with ToolsetRow { tools: Vec<ToolRef { server_id, tool_name }> }. ToolsetCache has async get(key) -> Option<Cache value> and set(key, value, ttl_secs) and delete(key), each returning a Result whose failure the callers below log and ignore, with the value type JSON (serde_json::Value). The cache TTL for toolset permissions is LiteLLM's get_management_object_ttl of the shared cache. Take it as a field toolset_ttl_secs: u64 in UnionSettings, filled by the wave 17 part B8620 (default 60).


  Functions to build (LiteLLM name in backticks, each a method on ServerUnion).

  1. `session_scope` (`_admitted_session_resource_scope`): None for no auth or an auth that is not a keyless admitted subject (B4679's key_identity(auth).mcp_admitted_user_subject); else the auth's mcp_session_resource_server_id.

  2. `open_server_ids` (`operator_open_server_ids`), inputs: auth, optional allow_all_server_ids and optional submitted_server_ids. An auth with mcp_toolset_id set or mcp_explicit_grants_only true gives an empty set. Otherwise start with the allow-all ids (registry.get_allow_all_keys_server_ids() when not given). The auth has an explicit object permission when it is not an admitted subject, it has an object_permission and that permission's mcp_servers is not None (an empty list counts). Without an explicit object permission, add the submitted ids (given, else submitted_for(auth)). The admitted-subject exception matters: its object permission is the user's own row, whose mcp_servers is [] by default, so the rule must not hide the user's own submissions.

  3. `submitted_for` (`_get_active_submitted_mcp_server_ids_for_user`): no auth or no user_id gives an empty list. Cache key byom_submitted_servers:<user_id>. A cache read fault is warned ("Failed to read BYOM submitted MCP server cache") and treated as a miss. On a miss, call reads.submitted_server_ids(user_id); a fault there is warned ("Failed to read BYOM submitted MCP servers from database") and gives an empty list. With no database the reads port answers an empty list. The result, even when empty, is written back with a 60 second TTL (a write fault is warned and ignored). Return only ids that registry.server_by_id(id, no ip) still finds. `invalidate_submitted` (`invalidate_byom_submitted_servers_cache`): no user_id does nothing; else delete the cache key and warn on a fault.

  4. `allowed_servers` (`get_allowed_mcp_servers`), inputs: optional auth and optional access: Option<ServerAccess>. Returns Vec<String> and never fails except through managed_servers.
    a. Managed agent policy present (B4772's managed_agent_policy): managed = grants.managed_servers(auth)?; with access given keep only ids in access.server_ids; return. This branch is outside the guard in step f.
    b. allow_all = registry.get_allow_all_keys_server_ids(). explicit_only = auth.mcp_explicit_grants_only. admitted = auth is a keyless admitted subject.
    c. If not admitted and the auth has an object permission whose mcp_servers contains the literal no-mcp-servers, return an empty list now (before open channels).
    d. submitted = empty when the auth has an explicit object permission (as in step 2) or explicit_only; else submitted_for(auth).
    e. Inside the guard (any error here goes to step f): admin_unscoped = grants.admin_unscoped(auth). resolved_access = ServerAccess with no ids and the default scope when admin_unscoped, else the given access, else grants.access(auth). resolved ids = every registry server id when admin_unscoped, else resolved_access.server_ids. combined starts as resolved ids. Add open_server_ids(auth, allow_all, submitted). Anonymous caller: no auth, or an auth with none of user_id, user_role and api_key set; for it add every registry server whose auth_type is true_passthrough. If settings.respects_scope and the auth exists and auth.via_virtual_key and resolved_access.scope is not Unscoped: remove from combined the ids in allow_all that are not in resolved ids and, unless the scope is Unresolved, not in submitted. Finally keep only the id equal to session_scope(auth) when there is one. Return the ids de-duplicated, resolved ids first, then open ids, then passthrough ids, each group in registry order.
    f. Guard failure: log at error "Failed to get allowed MCP servers; team-level object_permission grants may be dropped. Falling back to global and submitted servers.", then return allow_all followed by submitted, de-duplicated in order, filtered by session_scope, and an empty list when explicit_only. The fallback never widens a scoped session bearer.

  5. `resolve_toolset_permissions` (`resolve_toolset_tool_permissions`), inputs: toolset_ids and requires_fresh_policy (default false). Returns Result<BTreeMap<String, Vec<String>>, UnionError>. Empty ids or no database give an empty map. Cache key toolset_perms:<sorted ids joined by comma>; unless fresh, a cache hit is returned as is. Otherwise reads.toolsets(ids, use_writer = fresh); for each toolset and each tool append tool_name to the list of tool.server_id once (first-seen order). Write the map to the cache with settings.toolset_ttl_secs and return it. A fault in the read or the cache write: fresh propagates it; not fresh warns ("Failed to resolve toolset permissions") and returns an empty map. A cache READ fault is part of this guard too. B4671's RegistryReads::resolve_toolset_scope is this method with the keys of the map taken by its caller.

  6. `allowed_tables` (`get_all_allowed_mcp_servers`), input: auth: the ids from allowed_servers(auth), then for each id registry.server_by_id (no ip) and registry.server_table of it; an id the registry does not know is warned ("MCP Server ... not found in registry") and skipped.

  Production reads. LiveUnionReads in betterlite-server holds B4711's submitted-server read and B4681's toolset list as fields and maps their errors to UnionError::Failed(String). Keep the mapping in plain functions so tests need no Postgres.


  Tests use fakes that record calls, synthetic servers, users and keys, and names with the prefix test-. No route reaches this code at this commit, so there are no oracle cases.

