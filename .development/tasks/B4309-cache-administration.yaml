    why: "_extract_cache_params: safely extract and mask cache parameters from the backend instance."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L50-L119
    why: "GET /cache/ping route: health check with optional Redis write test, status 503 on init/ping failure."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L122-L162
    why: "POST /cache/delete route: delete keys from cache, 500 for non-Redis, 503 for Redis failure."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L165-L177
    why: "_get_redis_client_info: safely get CLIENT LIST, fallback to warning message if unavailable."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L180-L213
    why: "GET /cache/redis/info route: Redis server state, 500 for non-Redis, 503 on failure."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L216-L249
    why: "POST /cache/flushall route: flush all cache entries, 500 for unsupported types, 503 on failure."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/caching.py#L1-L50
    why: "CachePingResponse and HealthCheckCacheParams type definitions."
dod:
  - text: >-
      GET /cache/ping returns status 503 when cache is uninitialized (litellm.cache is None)
      or when backend ping() fails for Redis type. Returns status 200 with ping_response=true
      for successful Redis ping and set_cache operations, or without ping_response for
      non-Redis types.
    proof: [oracle, ping-tests]

  - text: >-
      GET /cache/ping extracts and masks cache parameters with HealthCheckCacheParams
      validation, returning them in the response only when cache is initialized.
    proof: [oracle, ping-param-tests]

  - text: >-
      POST /cache/delete requires keys parameter (list of strings), returns 500 when
      cache is uninitialized (due to blanket exception rewrite), 500 when backend is not Redis,
      and 200 with status=success when deletion completes. All exceptions return 500.
    proof: [oracle, delete-tests]

  - text: >-
      GET /cache/redis/info returns 503 when cache is uninitialized or backend is not
      Redis (blanket exception rewrite), and 503 when redis info() fails. Returns num_clients,
      clients list (with fallback message if CLIENT LIST unavailable), and redis info dict.
    proof: [oracle, redis-info-tests]

  - text: >-
      POST /cache/flushall returns 503 when cache is uninitialized, 503 when backend
      is not Redis (blanket exception rewrite), and 200 with status=success when flushall()
      completes. All exceptions return 503.
    proof: [oracle, flushall-tests]

  - text: >-
      All four routes require user API key authentication through user_api_key_auth dependency.
    proof: [oracle, auth-tests]

  - text: >-
      SensitiveDataMasker masks cache parameters in /ping response; credential fields
      (host, port, password, connection strings) are redacted.
    proof: [masking-tests]

  - text: >-
      CLIENT LIST restriction on managed Redis is handled gracefully: fallback returns
      a warning message and num_clients=-1 instead of raising an exception.
    proof: [oracle, client-list-fallback-test]

checks:
  optional: [mutants]
  commands:
    - id: ping-tests
      why: /cache/ping does not health check or return correct initialization/ping status
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::ping::/)'

    - id: ping-param-tests
      why: /cache/ping does not extract, validate or mask cache parameters correctly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::ping_params::/)'

    - id: delete-tests
      why: /cache/delete does not parse keys, check cache type or return correct status
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::delete::/)'

    - id: redis-info-tests
      why: /cache/redis/info does not return Redis state or handle CLIENT LIST fallback
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::redis_info::/)'

    - id: flushall-tests
      why: /cache/flushall does not flush Redis or return correct error status
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::flushall::/)'

    - id: auth-tests
      why: routes do not require authentication or return 401 for missing/invalid keys
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::auth::/)'

    - id: masking-tests
      why: cache parameters in response are not masked or do not exclude sensitive fields
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::masking::/)'

    - id: client-list-fallback-test
      why: CLIENT LIST exception is not caught or does not return a fallback message with num_clients=-1
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_routes::redis_info::client_list_restricted/)'

