id: B4309
title: Serve cache health, deletion and Redis administration routes
description: >-
  Register four cache management routes in crates/betterlite-server: GET /cache/ping for health
  checks with backend connectivity test, POST /cache/delete for selective key removal, GET
  /cache/redis/info for Redis server state, and POST /cache/flushall for complete cache drain.
  Each route requires user API key auth (from B003). Preserve LiteLLM's error status codes and
  exception-to-status rewrites: /ping raises 503 when cache is uninitialized or backend ping
  fails; /delete returns 500 when cache is uninitialized and for all exceptions (blanket rewrite);
  /redis/info returns 503 for uninitialized cache, non-Redis backend, and all failures (blanket
  rewrite); /flushall returns 503 when cache is uninitialized, non-Redis backend, and all exceptions
  (blanket rewrite). Extract and clean cache params for the /ping response, masking sensitive fields
  with SensitiveDataMasker.mask_dict. Handle CLIENT LIST restriction on managed Redis by falling
  back to a warning message when unavailable. When /cache/ping tests a Redis cache, return
  ping_response=true only when Redis ping completes (not its underlying boolean), and write a test
  key to verify set_cache succeeds.
  Dependencies: B4299 Cache.ping and delete_cache_keys; B4297 Cache.async_add_cache for test
  writes; B4290 CachePingResponse and HealthCheckCacheParams types; B244 SensitiveDataMasker
  for credential masking; B003 HTTP routing and error integration through user_api_key_auth.
scope:
  paths:
    - crates/betterlite-server/src/cache_routes.rs
    - crates/betterlite-server/src/cache_routes/**
    - tools/oracle/cases/cache/**
    - tools/oracle/helpers/b4309.py
    - tools/oracle/helpers/b4309/**
    - tools/oracle/src/helpers/server/b4309.rs
    - tools/oracle/src/helpers/server/b4309/**
  lint_tables: false
references:
