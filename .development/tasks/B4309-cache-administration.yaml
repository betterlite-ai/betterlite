deviations:
  - what: |-
      /cache/ping returns ping_response=true only when Redis ping completes (a boolean
      conversion from backend.ping()), not when it is awaited without exception.
    why: |-
      Distinguishes a backend that returns a true ping result from one that raises
      silently on failure. LiteLLM converts the result to the string "True" in the response.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L81-L82

  - what: |-
      /cache/delete returns 500 when cache is uninitialized. The check at line 142 raises
      HTTPException(503), but the blanket exception handler at lines 158-162 catches it
      and rewrites to 500 with "Cache Delete Failed" message.
    why: |-
      LiteLLM's exception handler catches all exceptions during Redis delete operations
      and returns 500, not 503, uniformly.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L141-L162

  - what: >-
      /cache/redis/info returns 503 for both uninitialized cache (line 190) and
      non-Redis backend (line 192-196), even though the checks raise HTTPException(500).
      The blanket exception handler at lines 209-213 rewrites all exceptions to 503.
    why: >-
      LiteLLM's blanket handler treats initialization and backend-type failures uniformly
      with 503, not 500, for /redis/info endpoint.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L188-L213

  - what: >-
      /cache/flushall returns 503 for non-Redis backend. The check at line 241-244
      raises HTTPException(500), but the blanket exception handler at lines 245-249
      rewrites it to 503 with "Service Unhealthy" message.
    why: >-
      LiteLLM's blanket exception handler catches all exceptions during flushall operations
      and returns 503, rewriting the 500 from the backend-type check.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/caching_routes.py#L232-L249

out_of_scope:
  - B4299 owns Cache.ping, delete_cache_keys, and _supports_async; they are called
    through dependency injection, not reimplemented.

  - B4297 owns Cache.async_add_cache used in /cache/ping for test writes; this task
    calls it, does not implement caching logic.

  - B4290 owns CachePingResponse and HealthCheckCacheParams types; this task uses them
    for serialization, does not define them.

  - B244 owns SensitiveDataMasker and its mask_dict method; this task calls it to redact
    credentials in responses.

  - B003 owns user_api_key_auth dependency and HTTP error integration; this task applies
    them as route guards and error handling.

  - Redis client_list, info, flushall operations are owned by Redis backend task(s)
    (B360 or lower); this task calls them through the RedisCache trait, does not implement
    Redis protocol.

  - safe_dumps JSON serialization is owned by B192; this task calls it
    to format response bodies.

  - Virtual key auth (user_api_key_auth with token validation) is owned by B052; this task
    reuses the dependency as injected by B003.

pitfalls:
  - The /cache/ping route calls backend.ping() for Redis type only; non-Redis backends
    have no ping implementation, so the response omits ping_response field entirely.

  - /cache/delete raises HTTPException(503) on cache uninitialization at line 142, which
    is caught by the blanket exception handler at lines 158-162 and rewritten to 500;
    ensure betterlite preserves this exception-rewrite behavior.

  - /cache/redis/info raises HTTPException(500) on uninitialized cache (line 189) and
    non-Redis backend (line 192-196), both inside the try block; the blanket exception
    handler at lines 209-213 catches them and rewrites to 503 uniformly.

  - /cache/flushall raises HTTPException(503) on uninitialized cache (line 233) and
    HTTPException(500) on non-Redis backend (line 241-244), both inside the try block;
    the blanket exception handler at lines 245-249 catches all and rewrites to 503.

  - CLIENT LIST command is unavailable on managed Redis (AWS ElastiCache, Azure Cache);
    catch the exception and return -1 for num_clients and a warning message, not an error
    status, per lines 175-177 of LiteLLM code.

  - Cache parameters include nested dicts (redis_kwargs, ssl_certs); HealthCheckCacheParams
    must filter these into safe displayable fields before masking.

  - The test_key written in /cache/ping uses hardcoded model="test-model" and
    messages with role="user", content="test from litellm"; preserve these exact values.

  - /cache/ping catches HTTPException and re-raises it to skip the generic exception
    handler (lines 105-106 in LiteLLM); ensure exception typing and re-raise logic
    matches this pattern.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
