id: B3099
title: Report cache activity, errors and available filters
description: >-
  Build the module `cache_activity_routes` in betterlite-server. It serves one route for the Admin UI cache dashboard:
  GET `/global/activity/cache_hits`, authenticated by B052, hidden from /openapi.json (LiteLLM sets
  include_in_schema=False; keep it out of the schema too). It is the only path; there is no /v1 or other alias.
  The route reads the LiteLLM_SpendLogs table and answers `CacheActivityResponse`. The route is not scoped to the caller:
  every admitted caller sees all rows, as in LiteLLM (B867 decides which roles may reach the path). This task adds no
  role check. Expose one public function that returns the axum route; B8482 composes it into the app and this task adds
  no registration of its own.

  Query parameters. `start_date` and `end_date` are required strings. `key_aliases` and `models` are optional and can
  repeat (`?models=a&models=b`); a missing list becomes an empty list, and a repeated empty value stays one empty string.
  A missing date answers 422 in the envelope B003 uses for other query validation errors.

  Order inside the handler. First the caller is authenticated (B052), so a missing or bad credential answers 401 before
  anything else. Then the query string is checked, so a missing date is a 422 even when the database is missing. Then the
  database handle: a missing handle answers HTTP 500 with detail `{"error": "Database not connected. Connect a database to
  your proxy - https://docs.litellm.ai/docs/simple_proxy#managing-auth---virtual-keys"}`. That text is not
  CommonProxyErrors.db_not_connected_error; copy it from this route (analytics_endpoints.py L47-L53). Only after that are
  the dates parsed, start first and then end; the first bad one answers HTTP 400 with detail
  `{"error": "<param_name> must be a YYYY-MM-DD date, got <repr>"}`, where param_name is `start_date` or `end_date` and
  `<repr>` is Python's repr of the string: single quotes, but double quotes when the value contains a single quote and no
  double quote, with backslash, newline, tab, carriage return and other control characters escaped (`\\`, `\n`, `\t`,
  `\r`, `\xNN`). Write one small function for the repr and cover it with tests. A start date after the end date is not an
  error; it selects nothing and answers an empty report.

  Date parsing is Python's `datetime.strptime(value, "%Y-%m-%d")` with UTC attached, at 00:00:00. It accepts a four digit
  year, a month of 1 to 12 with or without a leading zero, and a day of 1 to 31 with or without a leading zero or with a
  space in place of it (`2024-01- 5`). It rejects a day that does not exist in that month (`2024-02-30`), trailing text and
  surrounding whitespace. Non-ASCII digits are rejected (see deviations). Years before 0001 do not exist, so `0000` is an
  error.

  Queries. Four SQL statements run in one database round, and any database error leaves the handler uncaught, so it
  becomes the server's generic internal error response (this route adds no "Failed to fetch" wrapper). Copy the four
  statements from cache_activity.py L125-L192 without changing a character of the SQL: GROUPS_SQL, ERROR_BREAKDOWN_SQL,
  KEY_ALIAS_OPTIONS_SQL and MODEL_OPTIONS_SQL. Bind positions: $1 start date and $2 end date as timestamptz at midnight
  UTC; $3 and $4 in the first two statements are the key alias list and the model list; the last one or two parameters are
  the info routes list. GROUPS_SQL and ERROR_BREAKDOWN_SQL take ($1 start, $2 end, $3 key aliases, $4 models, $5 info
  routes). KEY_ALIAS_OPTIONS_SQL and MODEL_OPTIONS_SQL take ($1 start, $2 end, $3 info routes), and they ignore the user's
  key alias and model filters, so the filter dropdowns always show every option in the range. Every list parameter is a
  JSON array of strings bound as jsonb (the SQL casts `$n::jsonb`). The info routes list is B868's `INFO_ROUTES` in
  betterlite-auth (the same values as LiteLLMRoutes.info_routes), in its order. Rows whose call_type is one of those
  routes are left out of all four statements, so dashboard reads of /key/info, /models and the like do not count. The end
  date is inclusive: the SQL adds one day.

  Row decoding. A group row has call_type (text), api_requests, cache_hits, failed_requests, cached_completion_tokens and
  generated_completion_tokens (all int4, since the SQL casts `::int`). An error row has call_type, error_code, error_class
  (text) and count (int4). An option row has one text column. A statement that returns no rows gives an empty list. Keep
  the row order the database returns; do not sort in Rust. Decode by column name through typed row structs, not by
  position.

  Totals. `compute_totals(groups)` sums api_requests, cache_hits, failed_requests and cached_completion_tokens over the
  groups. `all_requests` is api_requests + cache_hits + failed_requests (the sums), and `cache_hit_ratio` is
  `cache_hits / all_requests * 100` as f64 when all_requests is greater than zero, otherwise `0.0`. The ratio is a
  percentage from 0 to 100, not a fraction. Sums are over i64 so large groups cannot overflow.

  Response types, in this task's files, with LiteLLM's names and field order: `CacheActivityGroup { call_type,
  api_requests, cache_hits, failed_requests, cached_completion_tokens, generated_completion_tokens }`,
  `CacheActivityTotals { api_requests, cache_hits, failed_requests, cached_completion_tokens, cache_hit_ratio }`,
  `CacheActivityFilterOptions { key_aliases, models }`, `CacheActivityErrorBucket { call_type, error_code, error_class,
  count }` and `CacheActivityResponse { groups, totals, filter_options, error_breakdown }`. `error_breakdown` is a JSON
  array. The counts serialize as integers and `cache_hit_ratio` as a JSON number (`0.0` when zero).

  Tests. Native tests build small LiteLLM_SpendLogs and LiteLLM_VerificationToken tables in a unique schema through B700's
  PostgreSQL fixture (columns: request_id, call_type, api_key, model, startTime, status, cache_hit, completion_tokens,
  metadata jsonb; token, key_alias) and run the four statements against seeded rows. HTTP oracle cases run the route
  through the booted proxy next to LiteLLM. The seeded database has users, keys and teams and no usable spend log rows, so
  the cases cover the empty report, parameter validation, date errors, the check order, authentication and the missing
  database; row grouping, totals and the error breakdown are covered by the native Postgres tests.
