deviations:
  - what: Dates with non-ASCII digits (for example Arabic-Indic digits) answer 400, where Python's strptime accepts some of them.
    why: The format is a calendar date in ASCII; docs/compatibility.md covers what Python's runtime accepts beyond the declared type, and no client sends these.
  - what: A database error in a statement answers with the server's generic internal error body, not Python's exception text.
    why: The wording of an internal error cannot match Python's exception strings; the 500 status is the same.
out_of_scope:
  - "B8482 composes this route into the app, like the analytics_router include at proxy_server.py L19981; this task exposes only the route function."
  - "B867 owns the internal_user_routes entry for this path and B868 owns info_routes; this task reads INFO_ROUTES and adds no role check."
  - "_SupportsQueryRaw, _SupportsRawQueryDb and the Pydantic TypeAdapters (L76-L86, L195-L206) are Python typing helpers with no Rust counterpart."
  - "UNKNOWN_CALL_TYPE (cache_activity.py L72) has no caller at the pin; the SQL spells 'Unknown' itself, so it is not built."
  - "B700 owns the PostgreSQL pool and session; the database handle and the generic internal error response come from the server crate and B003."
pitfalls:
  - The missing-database 500 uses this route's own text ("Database not connected. Connect a database to your proxy - ..."), not CommonProxyErrors.db_not_connected_error that the daily activity routes use.
  - A missing date is a 422 and wins over the missing database 500, but a malformed date is a 400 that comes after the database check, so a bad date with no database answers 500.
  - api_requests is COUNT(*) minus cache hits minus failures, so a row that is both a cache hit and a failure is subtracted twice and can push a group below zero; copy the SQL and do not clamp.
  - cache_hit is a text column compared with 'True' after COALESCE(..., ''); a native boolean bind or a lowercase 'true' matches nothing.
  - Failure rows are the ones with status = 'failure', and cache hits are counted in the same pass, so a failed cache hit appears in both counters.
  - metadata is nullable jsonb, and a missing error_information or an empty error_code gives 'Unknown' through NULLIF and COALESCE; do not decode it in Rust.
  - The key alias filter compares COALESCE(vt.key_alias, 'Unnamed Key'), so keys without a row in LiteLLM_VerificationToken are matched by the literal alias "Unnamed Key".
  - The GROUPS_SQL ORDER BY COUNT(*) DESC leaves ties in database order, and ORDER BY 1 on the option lists follows the database collation; oracle cases must not seed ties and must compare the lists with the same collation on both sides.
  - The end date is exclusive in SQL after adding one day, so both dates are midnight UTC and the end day is fully included; never add the day in Rust as well.
  - $3 and $4 are jsonb parameters; binding a Rust Vec<String> as text[] fails the `$3::jsonb` cast, so bind serde_json values.
  - The route is not under any prefix that other daily activity routes use, and the same path under /v1 does not exist, so an oracle case for it must expect the unknown-path answer.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
