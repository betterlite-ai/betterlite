dod:
  - text: GET /global/activity/cache_hits answers CacheActivityResponse with groups, totals, filter_options and error_breakdown in that order, and the path is absent from /openapi.json.
    proof: [oracle, route-tests]
  - text: A missing start_date or end_date answers 422, and a missing credential answers 401 before it.
    proof: [oracle, route-tests]
  - text: A missing database answers 500 with the "Database not connected. Connect a database to your proxy" text before any date is parsed, and after the 422 check.
    proof: [oracle, route-tests]
  - text: A bad start_date or end_date answers 400 with detail.error naming the parameter and the Python repr of the value, start checked first.
    proof: [oracle, date-tests]
  - text: The date parser accepts non-padded months and days and a space before a one digit day, and rejects impossible days, trailing text, whitespace and non-ASCII digits.
    proof: [date-tests]
  - text: The groups statement counts cache hits, failures and other requests apart, merges an empty call_type into "Unknown", orders by request count, and leaves out info route call types.
    proof: [query-tests]
  - text: The date range is inclusive of the whole end day, and key_aliases and models filters apply to groups and errors but not to the filter option lists.
    proof: [query-tests]
  - text: The error breakdown counts failures only, by call_type, error_code and error_class, with "Unknown" for empty or missing error information.
    proof: [query-tests]
  - text: Totals sum the groups, and cache_hit_ratio is a percentage that is 0.0 when there are no requests.
    proof: [totals-tests]
  - text: A database error in any of the four statements is not wrapped and reaches the server's generic internal error response.
    proof: [route-tests]
checks:
  optional: []
  commands:
    - id: route-tests
      why: the route, its check order, authentication, 422 or 500 answers or the schema hiding are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_activity_routes::tests::route_/)'
    - id: date-tests
      why: the strptime-compatible date parser or the Python repr in the 400 body is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_activity_routes::tests::date_/)'
    - id: query-tests
      why: the four SQL statements, their parameters or the info route exclusion do not behave on a real PostgreSQL database
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_activity_routes::tests::query_/)'
    - id: totals-tests
      why: compute_totals or the response serialization is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_activity_routes::tests::totals_/)'
