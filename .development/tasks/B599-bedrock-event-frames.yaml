id: B599
title: AWS event-stream decoding and native errors
description: >-
  Add AwsEvent decoder backed by an existing AWS event-stream framing library, including length/CRC/header type
  checks and split-frame reads. Separate BedrockEvent decoding from provider content transformation; preserve native
  exception event status/code and undecoded error-body diagnostics through the shared redactor. Keep bounded frame/header/body
  buffers under B173 limits and typed SSE wrapper records for Messages reuse. The iter_bytes/aiter_bytes wrapper
  takes an injected typed chunk projection; B609 owns provider-family _chunk_parser and supplies it at composition,
  avoiding a framing-to-provider-selector dependency. Oracle framing cases capture the raw payload at that seam.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/__init__.py:
  get_bedrock_event_stream_decoder L9-L25. litellm/llms/bedrock/common_utils.py: _load_bedrock_response_stream_shape
  L1639-L1659; get_bedrock_response_stream_shape L1663-L1670; build_bedrock_stream_error L1679-L1701; BedrockEventStreamDecoderBase.__init__
  L1709-L1712; BedrockEventStreamDecoderBase._parse_message_from_event L1714-L1739; _decoded_json_value L1742-L1744;
  get_anthropic_beta_from_headers L1747-L1783. litellm/llms/bedrock/chat/invoke_handler.py: _stream_decoder L169-L182;
  _response_header L363-L364; _EventStreamTally.__init__ L368-L372; _EventStreamTally.add_chunk L374-L377; _EventStreamTally.add_event
  L379-L381; _EventStreamTally.undecoded_stream_error L383-L403; AWSEventStreamDecoder.iter_bytes L745-L765; AWSEventStreamDecoder.aiter_bytes
  L767-L786; AWSEventStreamDecoder._parse_message_from_event L788-L813. litellm/types/llms/bedrock.py: ServerSentEvent.__init__
  L455-L469; ServerSentEvent.event L472-L473; ServerSentEvent.id L476-L477; ServerSentEvent.retry L480-L481; ServerSentEvent.data
  L484-L485; ServerSentEvent.json L487-L488; ServerSentEvent.__repr__ L491-L492.


  Implement crates/betterlite-bedrock/src/event_frames.rs with adjacent tests under event_frames/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_event_frames in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function event_frames_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  split_frame, crc_mismatch, header_type_values, exception_frame, unknown_frame, truncated_frame, json_payload_error,
  error_before_first_event. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream
  request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_event_frames* using HelperCase: kind:
  helper and the externally tagged bedrock_event_frames variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_event_frames that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_aws_event_frame consumes AWS event-stream bytes split at arbitrary boundaries in
  crates/betterlite-bedrock/src/event_frames.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_event_frames.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_event_frames.
  The adjacent test replays_the_bedrock_event_frames_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 257 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 564 planned, 575 maximum changed lines.
