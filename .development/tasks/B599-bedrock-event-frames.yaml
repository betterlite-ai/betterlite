  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/event_frames.rs
  - crates/betterlite-bedrock/src/event_frames/**
  - Cargo.toml
  - deny.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/event_frames.rs
  - tools/oracle/src/helpers/bedrock/event_frames/**
  - tools/oracle/helpers/bedrock_event_frames.py
  - tools/oracle/helpers/bedrock_event_frames/**
  - tools/oracle/cases/helpers/providers/bedrock-event-frames/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_event_frames*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_event_frames.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_event_frames/**
  lint_tables: false
