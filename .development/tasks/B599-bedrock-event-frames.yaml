deviations:
- what: Reject event frames larger than16 MiB or aggregate frame headers larger than64 KiB with a typed upstream502
    error before allocation. Secret-bearing first-byte diagnostics are redacted in errors/logs.
  why: B173 bounded buffers and B187 secret-redaction policy apply; the pin retains up to200 raw diagnostic bytes
    and delegates framing limits to botocore. The normal modeled status and safe diagnostic fields remain unchanged.
