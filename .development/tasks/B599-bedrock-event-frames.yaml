id: B599
title: AWS event-stream decoding and native errors
description: >-
  Implement AwsEvent framing with a maintained AWS event-stream decoder, then decode modeled Bedrock payloads and
  errors. Preserve lengths, CRC/header-type failures, chunk bytes, fallback raw bodies and error tally diagnostics.
  B609 owns iter_bytes/aiter_bytes and provider decoder construction above this task; it feeds each framed payload
  to B608/B581 provider mapping. This task never calls a provider chunk converter. B682 owns BedrockError, B187
  redacts diagnostics, and B173 supplies bounded transport inputs.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  _load_bedrock_response_stream_shape L1639-L1659; get_bedrock_response_stream_shape L1663-L1670; build_bedrock_stream_error
  L1679-L1701; BedrockEventStreamDecoderBase.__init__ L1709-L1712; BedrockEventStreamDecoderBase._parse_message_from_event
  L1714-L1739; _decoded_json_value L1742-L1744; get_anthropic_beta_from_headers L1747-L1783. litellm/llms/bedrock/chat/invoke_handler.py:
  _response_header L363-L364; _EventStreamTally.__init__ L368-L372; _EventStreamTally.add_chunk L374-L377; _EventStreamTally.add_event
  L379-L381; _EventStreamTally.undecoded_stream_error L383-L403; AWSEventStreamDecoder._parse_message_from_event
  L788-L813. litellm/types/llms/bedrock.py: ServerSentEvent.__init__ L455-L469; ServerSentEvent.event L472-L473;
  ServerSentEvent.id L476-L477; ServerSentEvent.retry L480-L481; ServerSentEvent.data L484-L485; ServerSentEvent.json
  L487-L488; ServerSentEvent.__repr__ L491-L492.


  Named case contracts: exception_frame: For non200 events parse modeled response first, then build BedrockError
  from raw UTF8 body. If truthy :exception-type prefix message as <type> <decoded body>; otherwise body only. When
  that type has modeled error.httpStatusCode, int-convert it and override raw status. Native examples internalServerException500,serviceUnavailableException503,modelTimeoutException408,modelStreamErrorException424,validationException400;
  unknown/missing type or absent modeled status uses raw status (usually400). No JSON message extraction or synthesized
  error param/code here; invalid UTF8/status conversion propagates. unknown_frame: Both BedrockEventStreamDecoderBase
  and AWSEventStreamDecoder._parse_message_from_event use identical cases. On200, parsed chunk key wins; falsey
  chunk ->None, otherwise decode chunk.bytes UTF8. Without chunk key use raw body, falsey ->None, otherwise UTF8
  text. Missing chunk.bytes is not replaced with empty bytes. Preserve unknown-frame body fallback and parser failure
  ordering before non200 classification. error_before_first_event: Tally all input chunk lengths and retain first
  200 raw bytes across chunk boundaries. Every framed event increments event count and decoded bytes by prelude.total_length,
  even if payload is ignored. At EOF no events ->BedrockError502 Bedrock answered the stream with HTTP 200 but its
  body decoded to no events (content-type=<repr>, x-amzn-requestid=<repr>, <N> bytes received, first bytes=<bytes
  repr>), including empty input. Header lookup is mapping.get of exact lowercase names; httpx.Headers itself is
  case-insensitive, plain mappings are not. shape_load_failure: Lazily cache bedrock-runtime service-2 ResponseStream
  shape once (including None). Loader failure warns litellm: could not load bedrock-runtime response stream shape
  — Bedrock event-stream decoding will be unavailable. Error: <exception> and returns None; attempting either event
  parser then raises BedrockError500 Bedrock event-stream shape could not be loaded from botocore. Ensure botocore
  is correctly installed. Rust ships required modeled metadata, so missing Python SDK is an oracle setup failure;
  a missing native model table must remain explicit500 rather than silently decode unknown shapes. leftover_frame_after_events:
  At EOF with events and received-decoded!=0 ->BedrockError502 Bedrock stream ended with <undecoded> undecoded bytes
  after <events> events (content-type=<repr>, x-amzn-requestid=<repr>, <N> bytes received). Do not include first
  bytes here. Complete frames with no leftover succeed even when no payload emitted; B609 surfaces same errors after
  any prior yielded chunks. anthropic_beta_header_forms: Lookup only exact anthropic-beta. Missing/falsey ->[].
  Existing list returned unchanged including nonstrings, whitespace and duplicates. String strip first; if it begins[
  and ends], json.loads and list -> each element Pythonstr then strip. JSONDecodeError falls through to comma split/strip
  preserving empty members and duplicates; whitespace-only original string yields [empty string], while original
  empty string yields[]. Nonstring/nonlist ->[]. No case-insensitive header lookup or deduplication. sse_record_and_json:
  ServerSentEvent defaults dataNone to empty string, eventfalsey toNone, id/retry preserved includingempty/zero.
  Accessors return original values. json parses data as arbitrary JSON value without requiring object; malformed/empty
  raises JSONDecodeError. repr is exactly ServerSentEvent(event=<value>, data=<value>, id=<value>, retry=<value>)
  with string interpolation, not repr escaping. _decoded_json_value shares JSON decoding for beta strings.


  decode_aws_event_frame consumes arbitrary network chunks and yields validated frames; also expose decode_bedrock_json
  for ServerSentEvent.json and beta-array text. Extend the existing bedrock_event_frames cargo-fuzz target/replay
  to exercise both production decoders with a tagged seed, including malformed/truncated UTF8 and JSON, never a
  parallel test-only parser. B609 calls the shared frame/error helpers and owns its payload JSON parse. Named split_frame,crc_mismatch,header_type_values,truncated_frame
  cases compare library framing with pinned botocore, including frame-length bounds before allocation.


  Add standalone Rust test event_frames_limits_and_redaction for the16 MiB/64 KiB preallocation limits and secret-safe
  diagnostic projection, with exact upstream502 outcome; it is a deviation test, not a Python equality fixture.


  Implement crates/betterlite-bedrock/src/event_frames.rs with adjacent tests under event_frames/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function event_frames_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  split_frame, crc_mismatch, header_type_values, exception_frame, unknown_frame, truncated_frame, json_payload_error,
  error_before_first_event, shape_load_failure, leftover_frame_after_events, anthropic_beta_header_forms, sse_record_and_json.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_event_frames* using HelperCase: kind:
  helper and the externally tagged bedrock_event_frames variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_event_frames that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_aws_event_frame consumes AWS event-stream bytes split at arbitrary boundaries in
  crates/betterlite-bedrock/src/event_frames.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_event_frames.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_event_frames.
  The adjacent test replays_the_bedrock_event_frames_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 188 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 245 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 80 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 705 planned, 725 maximum changed lines.
