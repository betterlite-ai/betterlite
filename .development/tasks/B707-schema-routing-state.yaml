      memory_globally_unique_key_and_nullable_owners, member_total_spend_zero,
      workflow_pending_and_required_updated_at, workflow_session_uniqueness,
      child_sequence_uniqueness_and_run_delete_restrict, child_run_update_cascade,
      managed_team_owner_stays_null_and_descending_indexes and proxy_model_false_blocked.'
