id: B707
title: Postgres migrations for routing state
description: >-
  Add the 36 routing-state migration files after B706, preserving byte checksums, full directory
  identities and order. schema_routing_state tests cover actual catalog/default/data effects while
  B873 owns deployment and ledger handling. Retain all directories sharing 20260717000000; a timestamp
  alone is not a migration identity. Some CREATE/ADD statements are unguarded, so this cohort is not
  generally replayable without the deploy ledger.

  AdaptiveRouterState has composite (router_name,request_type,model_name) primary key, required DOUBLE
  PRECISION alpha/beta without defaults, total_samples INTEGER 0 and last_updated_at now. AdaptiveRouterSession
  has composite (session_id,router_name,model_name), required classified_type, seven INTEGER 0 counters
  misalignment/stagnation/disengagement/satisfaction/failure/loop/exhaustion_count, nullable last user/
  assistant content, required tool_call_history JSONB [], pending_tool_calls {}, turn_count=0,
  last_processed_turn=-1, clean_credit_awarded=false, nullable terminal_status and last_activity_at now.
  Index last_activity_at. These CREATE TABLE/INDEX statements are unguarded; a second execution fails
  with duplicate_table 42P07 rather than resetting learned state.

  MemoryTable requires memory_id/key/value TEXT, timestamp defaults now, nullable metadata/user_id/
  team_id/actors, globally unique key and separate user/team indexes. Uniqueness is not tenant-scoped.
  TeamMembership.total_spend becomes required DOUBLE PRECISION 0; ObjectPermission.search_tools is
  nullable TEXT[] default []. WorkflowRun requires run_id/unique session_id/workflow_type, status='pending',
  created_at now/updated_at without default and nullable created_by/input/output/metadata. WorkflowEvent
  requires event_id/run_id/event_type/step_name/INTEGER sequence_number, nullable data and created_at now.
  WorkflowMessage requires message_id/run_id/role/content/sequence_number, nullable session_id and
  created_at now. Each child has unique (run_id,sequence_number), a run_id index and a run reference
  that deletes RESTRICT/updates CASCADE. Run indexes cover workflow_type+status, session_id, created_at
  and created_by. Preserve the unguarded DDL and the distinction between globally unique run session
  and optional message session.

  ManagedFile/ManagedObject/singular ManagedVectorStore gain nullable team_id and (team_id,created_at
  DESC) indexes. Existing rows keep team_id NULL; no inferred ownership backfill is allowed. This
  leaves legacy rows without a team owner for team-only runtime listings, whose hook activation remains
  B087's open decision. ProxyModel.blocked, MCP.delegate_auth_to_upstream and MCP.oauth_passthrough are
  required false. MCP env_vars is nullable JSONB default []; MCPUserEnvVars requires id/user_id/server_id/
  values_b64 TEXT and both timestamps now, with unique (user_id,server_id) and user/server indexes.
  This SQL does not decrypt or re-encrypt values_b64, nor add user/server foreign keys.

  MCP oauth2_flow, token_exchange_endpoint/audience/subject_token_type/token_exchange_profile/issuer
  are nullable TEXT without defaults. timeout is nullable DOUBLE PRECISION; max_concurrent_requests
  nullable INTEGER; dcr_bridge and ObjectPermission.mcp_tool_search_enabled nullable BOOLEAN. The
  timeout/concurrency/dcr/tool-search ADD COLUMN statements are unguarded and repeat with duplicate_column
  42701. Both live/deleted keys gain nullable key_type through unguarded ADD, required budget_fallbacks
  JSONB {} through guarded ADD, and later nullable settings_updated_at TIMESTAMP(3), with no automatic
  timestamp backfill. DailyTeamSpend.ptu_flat_cost defaults required DOUBLE PRECISION 0.

  DailyUser/Organization/EndUser/Agent/Team/TagSpend each gain required BIGINT compression_saved_tokens=0
  and DOUBLE PRECISION compression_savings_spend/prompt_caching_savings_spend/autorouter_savings_spend=0.
  Existing counter/spend values survive. MCPServerOAuthClient has TEXT server_id primary key, nullable
  credentials JSONB and timestamp defaults now. SSOIdentityAssertion has TEXT user_id primary key,
  required assertion_b64 and timestamp defaults now. Neither table infers a user/server foreign key or
  transforms stored credentials. JWTKeyMapping.token's old RESTRICT foreign key is dropped and recreated
  with DELETE CASCADE/UPDATE CASCADE: key deletion now removes mappings, while other keys' mappings remain.

  Add SpendLogToolIndex.start_time index. DailyToolSpend has composite (date,tool_name), spend DOUBLE
  PRECISION 0, BIGINT total_tokens/request_count=0, created_at now and required updated_at. Config gains
  nullable last_run_at and required BIGINT reload_revision=0. ManagedObject gains nullable api_key and
  request_tags JSONB []; no existing key attribution is synthesized. DailyGatewayRequests has composite
  (date,category,route), successful_requests/failed_requests BIGINT 0, created_at now, required updated_at
  and a date index. BudgetWindowSpend has composite (entity_type,entity_id,window_duration), required
  window_start without default, spend=0, created_at now and required updated_at. window_start is not
  part of its key, so a second row for the same entity/duration conflicts even at another start time.

  AutoRouterSession has composite (api_key,session_id,router_name); router_type/first_turn_at/last_turn_at/
  last_model are required without defaults. models and later tier_turns are required JSONB {};
  INTEGER turns/unordered_turns/covered_turns/cache_hits/same_model_turns/same_model_hits/
  first_visit_turns/first_visit_hits/return_turns/return_hits/return_expired_misses/
  return_within_ttl_misses/ttl_5m_turns/ttl_1h_turns default 0, total_tokens BIGINT 0 and spend/saved_spend
  DOUBLE PRECISION 0. Index last_turn_at. No default turns these database rows into a scheduled job.


  Use B860's independent temporary databases, backed by POSTGRES_TEST_URL or testcontainers when unset,
  and B700 sessions to compare catalog facts against separately applied upstream SQL. Failure to obtain
  Postgres is a failing test, not a skip. Check state before/after each destructive or unguarded boundary
  and clean up fixtures after failures. Static migration bytes add no decoder or HTTP helper. Count
  253 nonblank, noncomment SQL lines and 407 physical production lines; reserve 340 tests plus 30
  registration lines, 777 within 800, with adjacent test modules below 300 lines.
