      env_var_definitions_array_and_raw_user_values, mcp_user_env_unique_pair_and_indexes,
      nullable_oauth_exchange_issuer_fields, unguarded_nullable_columns_repeat_42701,
      key_type_nullable_both_tables, budget_fallbacks_empty_both_tables,
      settings_updated_at_nullable_no_backfill, oauth_client_raw_json_and_timestamp_defaults,
      sso_assertion_raw_text_and_timestamp_defaults and jwt_key_delete_now_cascades_only_its_mappings.'
    proof: [postgres-tests]
  - text: 'postgres_usage_rollups covers team_ptu_zero, six_compression_token_defaults,
      six_three_savings_defaults_preserve_existing_spend, spend_tool_start_index,
      daily_tool_zero_counters_and_composite_key, config_revision_zero_last_run_null,
      managed_object_key_null_tags_array, gateway_zero_counters_and_date_index,
