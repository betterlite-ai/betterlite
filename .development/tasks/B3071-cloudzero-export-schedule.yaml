dod:
  - text: CloudZeroLogger inherits from CustomLogger and initializes with api_key, connection_id, and timezone parameters that fall back to CLOUDZERO_API_KEY, CLOUDZERO_CONNECTION_ID and CLOUDZERO_TIMEZONE environment variables respectively.
    proof: [behavior-tests]
  - text: export_usage_data validates that api_key and connection_id are non-empty before querying, raising ValueError with the literal message "CloudZero configuration missing. Please set CLOUDZERO_API_KEY and CLOUDZERO_CONNECTION_ID environment variables." when either is missing.
    proof: [behavior-tests]
  - text: export_usage_data accepts operation parameter defaulting to "replace_hourly" and forwards it unchanged to CloudZeroStreamer.send_batched; "sum" is an accepted alternate value.
    proof: [behavior-tests]
  - text: dry_run_export_usage_data accepts only a limit parameter (defaults to 10000) with no time bounds, does not validate credentials, and returns a dict with usage_data, cbf_data and summary fields.
    proof: [behavior-tests]
  - text: dry_run_export_usage_data summary contains total_records, total_cost, total_tokens, unique_accounts and unique_services computed from CBF records.
    proof: [behavior-tests]
  - text: initialize_cloudzero_export_job acquires a lock using pod_lock_manager with cronjob_id "cloudzero_export_usage_data", exports once if acquired, and releases the lock afterward; if lock acquisition fails, no export runs and release_lock is not called.
    proof: [behavior-tests]
  - text: initialize_cloudzero_export_job exports directly without locking when redis is unavailable (pod_lock_manager is None or redis_cache is None).
    proof: [behavior-tests]
  - text: _hourly_usage_data_export computes the export time window as current UTC time minus twice CLOUDZERO_EXPORT_INTERVAL_MINUTES (two-times-interval lookback) and calls export_usage_data with operation "replace_hourly".
    proof: [behavior-tests]
  - text: init_cloudzero_background_job registers a scheduler job that calls initialize_cloudzero_export_job on an interval (in minutes) read from CLOUDZERO_EXPORT_INTERVAL_MINUTES.
    proof: [behavior-tests]
  - text: Every mutant in the schedule logic is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
