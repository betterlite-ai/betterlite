      why: initialization, credential validation, export operation defaults, dry-run isolation, lock handling, interval scheduling or export window calculation differs from source
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cloudzero_schedule($|::)/) - test(/replays_the_/)'
oracle_cases: []
deviations:
  - what: Credential validation happens at export time, not during initialization. If credentials are missing, export_usage_data raises an error immediately.
    why: betterlite validates at the operation boundary rather than at logger construction, allowing dry-run previews (which need no credentials) to work with a logger instance created before credentials are available.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/cloudzero/cloudzero.py#L119-L122"
  - what: Logging uses injected instrumentation (tracing or the owner's logger) instead of litellm.verbose_logger inline.
    why: betterlite uses structured logging infrastructure rather than side-channel console output, allowing callers to control verbosity.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/cloudzero/cloudzero.py#L40-L41"
  - what: The scheduler and pod lock manager are injected rather than imported from global proxy_server state.
    why: Injected dependencies enable testing without global state and allow callers to control scheduling and locking behavior.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/cloudzero/cloudzero.py#L59"
out_of_scope:
  - Daily usage row querying (covered by B3060).
  - CZRN and CBF record transformation (covered by B3069).
  - CloudZero delivery and batching (covered by B3070).
  - HTTP client pooling and credential management (covered by B173).
  - Scheduler and pod lock manager implementation (covered by B002, B189, B1690).
  - The screen display renderer _display_cbf_data_on_screen (no caller at the pin).
pitfalls:
  - The operation parameter flows unchanged from export_usage_data into CloudZeroStreamer.send_batched; "replace_hourly" is the default but "sum" must be accepted as well. _hourly_usage_data_export explicitly passes "replace_hourly", showing the parameter is configurable for other callers.
  - When acquire_lock returns false, no export runs and release_lock is never called. The job simply returns without exporting and without error.
  - _hourly_usage_data_export's lookback window is twice CLOUDZERO_EXPORT_INTERVAL_MINUTES (two times the interval), not the interval itself, to mitigate missing spend from ephemeral environment restarts.
  - dry_run_export_usage_data accepts only a limit parameter with a default of 10000; it takes no start_time_utc or end_time_utc parameters, unlike export_usage_data.
  - The literal ValueError message for missing credentials is exactly "CloudZero configuration missing. Please set CLOUDZERO_API_KEY and CLOUDZERO_CONNECTION_ID environment variables." with no variation.
  - dry_run_export_usage_data returns a dict with usage_data (first 50 rows as dicts), cbf_data (all transformed records as dicts) and summary (statistics); do not return a list or raw DataFrame.
  - Credentials passed to CloudZeroLogger.__init__ take precedence over environment variables; only fall back to environment lookups when constructor parameters are None or empty.
  - The scheduler job is registered with an interval in minutes, not seconds or hours; read CLOUDZERO_EXPORT_INTERVAL_MINUTES as the minutes value directly.
review_level: security
