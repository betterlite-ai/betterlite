id: B3071
title: Run CloudZero exports and previews
description: >-
  Build CloudZero export orchestration, preview summaries and scheduling in `betterlite-server::finops::cloudzero`.
  CloudZeroLogger coordinates hourly exports and on-demand dry-runs, integrating with the pod lock manager for multi-pod safety.
  The logger loads CLOUDZERO_API_KEY and CLOUDZERO_CONNECTION_ID from environment or constructor parameters (required for actual exports, optional for dry-run previews).
  It reads CLOUDZERO_TIMEZONE (default "UTC"), CLOUDZERO_EXPORT_INTERVAL_MINUTES (the scheduled interval, e.g., 60) and CLOUDZERO_MAX_FETCHED_DATA_RECORDS (the row cap for database queries).
  export_usage_data accepts optional start_time_utc and end_time_utc bounds, a limit on fetched records, and an operation parameter (defaults to "replace_hourly", also accepts "sum"); all three flow through to the database query and CloudZero streamer.
  dry_run_export_usage_data accepts only a limit parameter (defaults to 10000, no time bounds), queries the database without credentials validation, transforms and summarizes records to dict format, and returns structured JSON with usage_data sample, cbf_data records and summary statistics (total_records, total_cost, total_tokens, unique_accounts, unique_services).
  initialize_cloudzero_export_job runs on startup: if a pod lock manager exists and acquire_lock succeeds, it exports once and releases the lock; if the lock cannot be acquired, no export runs and release_lock is not called; if redis is unavailable, it exports directly without locking.
  init_cloudzero_background_job wires the scheduler to call initialize_cloudzero_export_job on an interval matching CLOUDZERO_EXPORT_INTERVAL_MINUTES.
  Keep the 60-minute default interval, twice-interval lookback window for hourly exports, 50,000 record cap and `cloudzero_export_usage_data` lease key.
  When CLOUDZERO_API_KEY or CLOUDZERO_CONNECTION_ID is missing during export_usage_data, raise ValueError with the literal message: "CloudZero configuration missing. Please set CLOUDZERO_API_KEY and CLOUDZERO_CONNECTION_ID environment variables."
