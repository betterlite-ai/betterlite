dod:
- text: Embedding classes default and dump as in LiteLLM.
  proof: [embedding-objects]
- text: Text completion classes default and dump as in LiteLLM, for streaming too.
  proof: [text-objects]
- text: Image classes pick fields through the same selector and dump as in LiteLLM, and the transcription response carries its text and extra fields.
  proof: [media-objects]
- text: The adapter stream ends on None or "None" on both paths and turns StopIteration into StopAsyncIteration.
  proof: [adapter-stream]
- text: BudgetConfig aliases, the fine tuning job error rule, the realtime object, the prompt param list and the abstract classes match LiteLLM.
  proof: [small-types]
- text: The new type files stay clean under ruff and strict basedpyright.
  proof: [python-lint]
