oracle_cases: []
deviations: []
out_of_scope:
- The functions that return these objects are B159, B160 and B161.
- All other classes in litellm/types/** are B167.
pitfalls:
- '`_nested_selector` works on dicts and lists, so a selector for a missing key must not add one.'
- '`AdapterCompletionStreamWrapper` compares with the text "None" as well as the None value.'
- '`EmbeddingResponse` sets `data` to `[]` for any falsy value, so an empty tuple gives a list.'
- '`LiteLLMFineTuningJob` checks every field of `error`, so one non-None field keeps the object.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
