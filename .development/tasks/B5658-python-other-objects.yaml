id: B5658
title: Python response objects for other endpoints and small types
description: >-
  B5657 built the chat objects on `ResponseObject`. This task adds the rest of the classes in litellm/types/utils.py that
  belong to this entry, so the next Python entries for embeddings, images and speech have their return types ready. They go
  into new files under `python/betterlite/types/utils/` and the names join `__all__` in that package's `__init__.py`.


  `Embedding` (L2280) and `EmbeddingResponse` (L2298): the response object is `list`, `data` is `[]` when falsy and `usage`
  defaults to `Usage()`. `Logprobs` (L2373), `TextChoices` (L2380) and `TextCompletionResponse` (L2424): `stream` true gives
  `text_completion.chunk` and `[TextChoices()]`. `ImageObject` (L2534), `ImageUsage` (L2596) and `ImageResponse` (L2613):
  `_serialize_image_data` (L2625) uses `_nested_selector` (L94-L111) to pick the fields. `TranscriptionResponse` (L2744).


  `AdapterCompletionStreamWrapper` (L2810-L2840) wraps an adapter's stream. A chunk of "None" or None ends the stream. The
  blocking path catches the failure, logs it and returns None, and the async path turns `StopIteration` into
  `StopAsyncIteration`. `CustomStreamingDecoder` (L3622-L3630) is an abstract class with `iter_bytes` and `aiter_bytes`.


  `BudgetConfig` (L3992-L4007) maps its aliases `time_period` to `budget_duration` and `budget_limit` to `max_budget`.
  `LiteLLMLoggingBaseClass` (L4251-L4255) is an abstract base with `pre_call` and `post_call`. `LiteLLMFineTuningJob`
  (L4311-L4317) turns an error whose fields are all None into None and carries `_hidden_params`.
  `LiteLLMRealtimeStreamLoggingObject` (L4354-L4375) holds the results and usage of a realtime stream.
  `DynamicPromptManagementParamLiteral.list_all_params` (L4477-L4479) gives `cache_control_injection_points`,
  `knowledge_bases` and `vector_store_ids`.


  As in B5657, a test builds each class from both packages with the same arguments and compares `model_dump()`.
