id: B3784
title: Ovalix checkpoint corrections
description: >-
  Build actor/session identities and checkpoint evaluation in reverse text order.
  The guardrail calls the Ovalix Tracker service to evaluate prompts and responses
  at pre-call and post-call checkpoints, applying corrections or blocking based
  on the Tracker's response action_type.

  The guardrail resolves user identities from request metadata (user_api_key_user_email or
  user_api_key_user_id, else "unknown"), normalizes them to a fixed-length actor id via SHA-256,
  and builds session_id as "{actor_hash}_{YYYY-MM-DD UTC date}_{application_id}" joined with underscores,
  where actor_hash is the 8-character hex prefix of SHA-256(actor) and the date uses UTC timezone.
  For each text in reverse order, it calls the Tracker endpoint at
  /tracking/custom_application/checkpoint with application_id, checkpoint_id, actor, session_id, data_type=TEXT
  and data={"content": text}.
  If action_type is "block" and it is the first (current) response, raise a typed exception with status 400.
  If action_type is "block" and it is an earlier response, replace it with the blocking_message.
  Otherwise, replace the text with the corrected message from modified_data.content if present,
  else keep the original text. On any exception, log and propagate as GuardrailRaisedException.

  The guardrail reads environment variables OVALIX_TRACKER_API_BASE (required),
  OVALIX_TRACKER_API_KEY (required), OVALIX_APPLICATION_ID (required),
  OVALIX_PRE_CHECKPOINT_ID (required if pre_call hook), OVALIX_POST_CHECKPOINT_ID (required if post_call hook).
  At least one of the checkpoint IDs must be provided; if a checkpoint ID is set but
  the hook is not in supported_event_hooks, auto-add the hook.
  The integration supports pre_call and post_call event hooks.
