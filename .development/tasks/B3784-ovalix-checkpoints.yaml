dod:
  - text: The guardrail reads OVALIX_TRACKER_API_BASE, OVALIX_TRACKER_API_KEY, OVALIX_APPLICATION_ID, OVALIX_PRE_CHECKPOINT_ID, and OVALIX_POST_CHECKPOINT_ID from environment or config, with api_base, api_key, and application_id required.
    proof: [ovalix-env-resolution]
  - text: The guardrail normalizes actor identity from user_api_key_user_email or user_api_key_user_id to a SHA-256-based actor id and builds session_id as actor_id + date + application_id.
    proof: [ovalix-session-identity]
  - text: For each text in reverse order, the guardrail calls the Tracker checkpoint endpoint and applies action_type logic (block current, replace earlier, or correct).
    proof: [oracle-pre-call-block, oracle-post-call-correct, oracle-earlier-block]
  - text: When action_type is "block" for the first response, the guardrail raises a blocked-exception type with status 400.
    proof: [oracle-current-block, ovalix-exception-status]
  - text: When action_type is "block" for earlier responses, the guardrail replaces them with the blocking message from the Tracker response, or falls back to a constant blocking message if the response lacks modified_data.
    proof: [oracle-earlier-block]
  - text: The guardrail supports pre_call and post_call event hooks, and auto-adds hooks when checkpoint IDs are set.
    proof: [oracle-event-hooks, ovalix-unit-tests]
  - text: On checkpoint API errors, the guardrail logs and propagates as GuardrailRaisedException.
    proof: [oracle-backend-error]
  - text: The configuration model has tracker_api_base, tracker_api_key, application_id, pre_checkpoint_id, post_checkpoint_id fields with documentation.
    proof: [ovalix-config-model]
