deviations:
  - what: On checkpoint API errors other than HTTPException, the guardrail logs the error and propagates as GuardrailRaisedException.
    why: LiteLLM wraps and propagates errors the same way; betterlite preserves this behavior.
  - what: The fallback message for blocked content is a constant blocking message when modified_data.content is not present.
    why: LiteLLM uses the same fallback when the Tracker response lacks modified_data; betterlite preserves this behavior.
  - what: Actor normalization uses SHA-256 hashing truncated to 8 characters for compact, stable actor ids.
    why: LiteLLM uses the same normalization; betterlite preserves the algorithm.
out_of_scope:
  - The CustomGuardrail base class, its __init__, framework event hook registration, and the log_guardrail_information decorator are owned elsewhere (U1).
  - The observation and logging framework that interfaces with the callback manager is owned elsewhere (U1).
  - Message/response type conversions beyond what is shown in the apply_guardrail method.
pitfalls:
  - "Text evaluation processes in reverse order (reversed(texts)), but corrected texts are inserted at index 0 to preserve order; test both forward and multi-message cases."
  - "is_first_response flag tracks position only within the reversed loop; the current (first in reversed order) and earlier messages have different block behavior."
  - "HTTPException from _call_checkpoint is logged and then wrapped as GuardrailRaisedException; ensure both logging and exception handling paths are tested."
  - "Actor identity is sourced from metadata or litellm_metadata in request_data; test both paths and the unknown fallback."
  - "Session_id includes the current UTC date; tests must mock datetime.datetime.now or use a fixed date."
  - "Environment variables are read in __init__ using or chains with defaults; the config loader from B002 supplies these values when not hardcoded in the guardrail config."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
