      why: environment variable reading or default values differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ovalix::environment/)'
    - id: ovalix-session-identity
      why: actor/session id normalization differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ovalix::session_identity/)'
    - id: ovalix-exception-status
      why: OvalixGuardrailBlockedException status code is not 400
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ovalix::exception_status/)'
    - id: ovalix-config-model
      why: the config model structure or defaults do not match LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ovalix::config_model/)'
    - id: ovalix-unit-tests
      why: unit tests for checkpoint payload construction or text processing fail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ovalix::/)'
    - id: oracle-pre-call-block
      why: the oracle comparison fails for a blocked pre-call request
      run: cargo gate run B3784 --only oracle
    - id: oracle-post-call-correct
      why: the oracle comparison fails for a corrected post-call response
      run: cargo gate run B3784 --only oracle
    - id: oracle-earlier-block
      why: the oracle comparison fails when an earlier response is blocked
      run: cargo gate run B3784 --only oracle
    - id: oracle-current-block
      why: the oracle comparison fails when the current response is blocked
      run: cargo gate run B3784 --only oracle
    - id: oracle-backend-error
      why: the oracle comparison fails for checkpoint API error handling
      run: cargo gate run B3784 --only oracle
    - id: oracle-event-hooks
      why: the oracle comparison fails for pre_call or post_call event hooks
      run: cargo gate run B3784 --only oracle
