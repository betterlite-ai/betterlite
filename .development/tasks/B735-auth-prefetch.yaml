id: B735
title: Batch identity and permission prefetch
description: >-
  Implement auth_prefetch in betterlite-auth for all auth_object_prefetch.py declarations, the
  two prefetch entry helpers at user_api_key_auth.py L3364-L3392 and get_object_permission at
  auth_checks.py L3982-L4034. B2315 now owns the structural adapters/deadline boundary and budget
  lookup logging formerly grouped here. B2316 supplies admission counter binding, below both this
  code and spend accounting. Reuse B714 raw-query routing, B715 metrics, B726 permission repository,
  B733 cache/TTL/key contracts and the B720/B721/B859/B2310/B2314 row types.

  AuthObjectRefs is frozen with user_id/team_id/membership_user_id/organization_id/project_id all
  None by default. from_token copies those IDs, taking organization_id from org_id, and supplies
  membership_user_id only when BOTH team_id and user_id are nonnull; empty strings count as IDs.
  Generate entries in this order: bare user_id with management TTL; team_id:{id} with management
  TTL; {team_id}_{user_id} membership with fixed TTL 5; team_membership:{user_id}:{team_id} with
  TTL None; org_id:{id} and org_id:{id}:with_budget with DEFAULT_IN_MEMORY_TTL; project_id:{id}
  with management TTL. Do not deduplicate these entries or escape delimiters. TTL None means omit
  the memory setter argument, except database write-back explicitly substitutes the cache default.

  Owner prefetch always consults the ORDINARY memory partition, even if a bare user_id happens to
  match B733's 64-hex key partition rule. Only None is a miss; false/empty/malformed nonnull values
  suppress this prefetch. If Redis is configured, MGET sorted missing keys, preserving duplicates.
  With an active request pipeline await its mget result; an ordinary pipeline error logs DEBUG
  and returns an empty mapping so DB fill continues. Without a pipeline use B126's direct MGET;
  a propagated error reaches the outer catch and skips this call's DB fill. Validate only the
  returned string-keyed map, then place every nonnull returned value into ordinary memory with
  the entry TTL. Do not validate individual Redis rows here. Recheck just the original missing
  entries afterward; without a DB stop here, otherwise query still-missing row kinds.

  Execute the pinned single SELECT on B714's writer raw-query path. Bind user_id only for a missing
  user row; team_id for either team or membership; membership_user_id only for membership;
  organization_id only for organization; project_id only for project. All other parameters are
  SQL NULL. The five scalar subqueries return nullable user_row/team_row/membership_row/
  organization_row/project_row; no row result becomes an empty mapping. This is a read, not a
  write transaction or a per-object N+1 fallback. Do not add B2315's per-table read deadline to
  this raw SELECT; existing database operation limits still apply.

  Preserve the full JSON projections. User NULL arrays teams/models/allowed_cache_controls/policies
  become []; organization_memberships is an unsorted jsonb_agg of that user's membership rows or []
  when absent. Team NULL arrays admins/members/models/team_member_permissions/access_group_ids/
  policies/default_team_member_models become []; join its model row by model_id, remove aliases
  and emit it as model_aliases. Team also gets object_permission. Membership joins its nullable
  litellm_budget_table. Organization and project normalize models to [] and join both budget and
  object_permission. Budget allowed_models and permission mcp_servers/mcp_access_groups/mcp_toolsets/
  blocked_tools/vector_stores/agents/agent_access_groups/models/search_tools/skills each normalize
  SQL NULL to []. Preserve missing related rows as null, other stored columns unchanged and
  input array order/duplicates. Source JSON-string normalization remains the row model's job.

  After the query take one clock reading. Validate each requested row kind once, stamping that
  time onto team/project only and overriding any stored last_refreshed_at. None rows are silently
  skipped. A ValidationError warns with row kind/model and drops just that row; do not negative-cache
  it. Other exceptions leave through the outer warning path. Serialize all successful entry/model
  pairs before writing any memory, then write them in entry order into ordinary memory. Membership
  and organization twins share the validated row, not another DB read. With Redis absent stop;
  without a request batch send one pipeline with each entry's original TTL, including None;
  with a batch queue each SET for the next flush without awaiting its delivery. A later write
  failure never rolls back earlier memory writes or queued commands. The outer prefetch catch
  logs WARNING and lets per-object getters enforce policy; cancellation escapes.

  Identity prefetch differs: without Redis it does nothing, otherwise deduplicate keys in first-seen
  order and consult B733's selected memory partition for each. MGET sorted misses and validate
  the result mapping. Its try/catch includes Redis read and management TTL selection only; a memory
  write failure in the subsequent loop PROPAGATES. Redis/mapping failures warn and return. Each
  nonnull value is stored without row validation in the selected partition. Strings, not just a
  known sentinel, use min(REGISTRY_ERROR_NEGATIVE_CACHE_TTL=30, management_ttl); all other values
  use management_ttl. Missing Redis values remain misses, recorded by B126's active batch so the
  later getter can avoid a duplicate GET. No database read belongs to identity prefetch.

  _identity_cache_keys includes SHA-256 of the entire supplied API key unless key_is_resolved is
  true, then end_user_id:{id} and end_user_restricted_registry only for a truthy end user, then
  model_access_group_registry always. It uses B2314 hash_token directly, without Bearer stripping
  or safe-form classification. _prefetch_referenced_auth_objects first binds B2316 admission
  counters with falsey end_user_id normalized to None, then warms owner rows from the token;
  callers invoke it only after model authorization, and this helper must not move that check.

  get_object_permission first requires a DB even for a warm cache hit, otherwise raises the
  missing-DB error with virtual-key help guidance. check_db_only defaults false. Normal mode reads
  object_permission_id:{id} as B2310's permission model; nonnull hit returns. Cache-read failures
  occur OUTSIDE its try and propagate. Database mode uses the writer and skips the cache read;
  normal mode uses normal repository routing. Inside the try, bounded find_unique uses label
  object_permission and that ID; absent row returns None normally, or HTTPException 403 with
  detail "Referenced object permission does not exist" in DB-only mode. Validate the row, write
  the typed cache entry with management TTL, then return it. Any ordinary DB/validation/cache-write
  exception returns None normally and propagates in DB-only mode; no negative entry is stored.
  B715's decorator still records the actual result/failure, and cancellation is not swallowed.

  Load DEFAULT_IN_MEMORY_TTL in betterlite-config from its int-parsed env, default 5, used by both
  organization entries. Empty/noninteger input stops startup; zero/negative values pass through.
  Do not invent a YAML key or let management TTL override this org TTL, fixed membership TTL 5 or
  fixed negative-registry cap 30. B733 owns the management fallback and override settings.

  Pure auth_prefetch oracle cases call source refs/entry/key/row-validation/TTL functions. Native
  async tests check transport/error order; real Postgres tests compare the native SELECT projections
  against the pinned SQL using B860 POSTGRES_TEST_URL, else testcontainers. A supplied unusable URL
  fails; tests never skip. The cache and DB dependencies already decode bytes, so no new decoder
  or fuzz target is added. Count all owned SQL/declarations, not just function bodies, and keep
  SQL, row projection, cache fill and permission lookup in separate files below 300 lines.
  The owned source has 361 nonblank noncomment lines excluding docstrings, including static SQL.
  Allow 280 implementation, 350 tests, 85 adapters, 30 config and 30 wiring, 775 within 800.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_object_prefetch.py:
  _lists_as_json (L42-L44; 3 source lines), _budget_json (L80-L84; 5 source lines), _permission_json (L87-L91;
  5 source lines), AuthObjectRefs.from_token (L151-L159; 9 source lines), _InMemoryCache.get_cache (L163-L163;
  1 source lines), _InMemoryCache.set_cache (L164-L164; 1 source lines), _iter_entries (L175-L204; 30
  source lines), _entries (L207-L208; 2 source lines), _missing_in_memory (L211-L212; 2 source lines),
  _set_in_memory (L215-L219; 5 source lines), _read_redis_rows (L222-L231; 10 source lines), _fill_from_redis
  (L234-L242; 9 source lines), _validate_row (L245-L258; 14 source lines), _fetch_rows (L261-L272; 12
  source lines), _write_back (L275-L290; 16 source lines), _fill_from_db (L293-L308; 16 source lines),
  prefetch_auth_objects (L311-L326; 16 source lines), _identity_memory_ttl (L329-L331; 3 source lines),
  prefetch_identity_keys (L334-L358; 25 source lines). litellm/proxy/auth/auth_checks.py: get_object_permission
  (L3982-L4034; 46 source lines). litellm/proxy/auth/user_api_key_auth.py: _identity_cache_keys (L3364-L3376;
  13 source lines), _prefetch_referenced_auth_objects (L3379-L3392; 14 source lines).


