id: B735
title: Batch identity and permission prefetch
description: >-
  Implement AuthObjectRefs and bounded batch loads over key/user/team/membership/org/project/permission
  references. Preserve local then Redis then DB read order and row validation; SQL keeps named array/JSON
  projections from the source. Adapters for the Python table protocols are native typed repository calls,
  not generated wrapper classes.


  Build the production auth_prefetch module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_object_prefetch.py:
  _lists_as_json (L42-L44; 3 source lines), _budget_json (L80-L84; 5 source lines), _permission_json (L87-L91;
  5 source lines), AuthObjectRefs.from_token (L151-L159; 9 source lines), _InMemoryCache.get_cache (L163-L163;
  1 source lines), _InMemoryCache.set_cache (L164-L164; 1 source lines), _iter_entries (L175-L204; 30
