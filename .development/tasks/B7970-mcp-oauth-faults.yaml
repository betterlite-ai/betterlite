dod:
  - text: classify_token_rejection and classify_dcr_rejection never fail on any body and read error, error_description and error_uri only when they are non-empty JSON strings, cut to 500 characters.
    proof: [faults-tests, faults-corpus, oracle]
  - text: Blame assignment follows the order server_error and temporarily_unavailable, invalid_target, credential codes for GatewayStored only, then the caller, and the DCR classifier always treats the source as CallerSupplied.
    proof: [faults-tests, oracle]
  - text: A body without a usable error field is a ProtocolFault with the HTTP status in its note, except a DCR 401 or 403, which is RegistrationRefused.
    proof: [faults-tests, oracle]
  - text: render_token_fault gives the status, JSON body and no-store headers of each variant, with 401 only for CallerRejected invalid_client, and dcr_fault_detail gives the status and detail string of each variant.
    proof: [faults-tests, oracle]
  - text: The listing classifier, list_failure_carrier, upstream_auth_challenge, outcome_wire_value and list_fault_http_status follow LiteLLM's order and values.
    proof: [faults-tests, oracle]
  - text: error_chain returns the error and its sources outermost first.
    proof: [faults-tests]
  - text: OauthFaultRenderer implements the dcr_rejection, token_rejection and protocol_fault methods of the port with no rule of its own, and sets invalid_grant only for a CallerRejected invalid_grant.
    proof: [adapter-tests]

checks:
  optional: []
  commands:
    - id: faults-tests
      why: the faults package has no passing behavior tests
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^faults::/) - test(/::replays_fault_corpus$/)'
    - id: faults-corpus
      why: the fault body classifier has no fuzz target or no new seed, or its replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/oauth_fault_body)" && test -f crates/betterlite-mcp/fuzz/fuzz_targets/oauth_fault_body.rs && grep -qF "classify_token_rejection" crates/betterlite-mcp/fuzz/fuzz_targets/oauth_fault_body.rs && grep -qF "classify_dcr_rejection" crates/betterlite-mcp/fuzz/fuzz_targets/oauth_fault_body.rs && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^faults::classify::tests::replays_fault_corpus$/)'
    - id: adapter-tests
      why: the fault renderer adapter has no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_faults::/)'

