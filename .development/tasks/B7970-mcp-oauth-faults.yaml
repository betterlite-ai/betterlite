deviations:
  - what: classify_token_rejection, classify_dcr_rejection and list_failure_carrier have shorter names than LiteLLM's classify_upstream_token_rejection, classify_upstream_dcr_rejection and raise_classified_list_failure, and list_failure_carrier returns the carrier instead of raising it.
    why: A repository rule refuses names over 30 characters, and Rust errors are values the caller returns.
  - what: The classifiers take a status and a body string, not an httpx response, and the list classifier takes a flattened ListFailure, not an exception tree.
    why: The package must not depend on an HTTP client type or on Python's exception model. The caller builds the view in LiteLLM's traversal order.
  - what: error_chain follows source() only, so exception group members and the incidental context link are not walked.
    why: Rust errors have no group or context link, and a source chain has no cycle. The cycle check is not needed.
  - what: An MCP upstream body that is JSON with duplicate keys or non-finite numbers is read like any JSON document, following docs/compatibility.md.
    why: Python runtime behavior beyond the declared types is not an oracle case.

out_of_scope:
  - "The FaultRenderer trait, UpstreamReply and the flows that call it: B7531 for the trait and the registration flow, B7532 for the token methods and the token flow. This task implements the trait and never declares it."
  - "FlowReply and FlowError: B4719. TOKEN_NO_CACHE_HEADERS: B4654. The gateway OauthError bodies and the bridge refresh error reply (B7532 turns an invalid_grant outcome into InvalidRefresh): B4674 and B4666."
  - "MCPServerListError and MCPUpstreamAuthError as exception types, their to_http_exception, and the tools/list callers of classify_list_exception (rest_endpoints.py, operations.py): the MCP REST and operations tasks, which build ListFailure and use ListCarrier. mcp_debug.py's use of iter_exception_tree: its owner under B136 calls error_chain."
  - "faults/__init__.py is only re-exports; faults.rs holds the same."

pitfalls:
  - The upstream HTTP status never decides blame; only the error code and the credential source do, so a 500 with error invalid_grant is still CallerRejected.
  - Fields are cut to 500 characters, not 500 bytes, so a multi-byte description must be cut on a character boundary and never panic.
  - A non-string, empty or missing error field means no contract, so an error of 5 or "" is a ProtocolFault (or RegistrationRefused for DCR 401 and 403), not a CallerRejected.
  - Only the token classifier honours GatewayStored; invalid_client from a DCR reply stays CallerRejected, and invalid_target is GatewayRejected for both.
  - RegistrationRefused through render_token_fault is 400 unauthorized_client, but through dcr_fault_detail it is 403.
  - The 401 status is only for the exact code invalid_client; unauthorized_client from the caller is 400.
  - GatewayRejected and ProtocolFault never show the upstream description or body to the caller; the description only goes to the warn log.
  - forbidden always renders 403 in list_fault_http_status, but auth_required relays the upstream status_code (401 when it is absent).
  - upstream_auth_challenge keeps scanning past non-auth responses, so a 401 behind an earlier 500 is still found.
  - dcr_bridge servers pass suppress_challenge true, and the carrier then keeps the 401 or 403 status but drops the www_authenticate value.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
