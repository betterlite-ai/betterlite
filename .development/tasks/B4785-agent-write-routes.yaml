  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/agent_endpoints/agent_writes.rs
    - crates/betterlite-server/src/agent_endpoints/agent_writes/**
    - tools/oracle/cases/agents/writes/**
