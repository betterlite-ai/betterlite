dod:
  - text: POST, PUT, PATCH and DELETE on the agents paths run the feature check, then the admin-only permission check, then the database check, in that order, and answer 403 for a non-admin and 500 `Prisma client not initialized` (POST, DELETE) or the DB not connected text (PUT, PATCH) without a database.
    proof: [route-tests]
  - text: The identity request is Absent when the key is missing, Null when it is null and Value when it is set, for AgentConfig and for PatchAgentRequest, and the execution mode is copied.
    proof: [identity-request-tests]
  - text: The card merge answers 400 with the Unsupported protocolVersion message (naming the version and listing 0.3 and 1.0) for an unsupported version, builds the proxy url `<proxy_base>/a2a/<agent_id>`, and uses the card's own name before the agent name.
    proof: [card-tests, oracle]
  - text: POST validates the identity request and the legacy identity in that order, answers 400 `Agent with name <name> already exists` before any write, pre-generates the agent id only when a card is present, stores the merged card, registers the result in the registry and answers the redacted record.
    proof: [create-tests]
  - text: PUT and PATCH answer 404 `Agent with ID <id> not found` before any identity check, validate the identity request against the existing agent, merge the card only when the request carries one, and replace the registry entry by the old name.
    proof: [update-tests]
  - text: DELETE answers 404 `Agent with ID <id> not found in DB.`, deletes through the store, removes the registry entry by name and answers a JSON object whose message key holds `Agent <id> deleted successfully`.
    proof: [remove-tests]
  - text: A persistence error answers 409 for a conflict, 503 or 400 for an identity failure by its code, and 500 with its text for anything else, and an IdentityAdminError keeps its own status and detail.
    proof: [error-tests]
  - text: The oracle helper cases give LiteLLM's answers for the merged card.
    proof: [oracle]
  - text: The four handlers are tested with tower's oneshot over agent_write_routes and fake ports; B8647 mounts them and proves the 401 and no-database answers over HTTP with the oracle cases moved there.
    proof: [route-tests]
checks:
  optional: []
  commands:
    - id: route-tests
      why: a write route is missing, carries the wrong tag or runs its checks in another order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_writes::tests::/)'
    - id: identity-request-tests
      why: the identity request merges the missing key and the null key, or drops the execution mode
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_writes::identity_request::/)'
    - id: card-tests
      why: the protocol version check, the proxy url or the name choice of the merged card differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_writes::card::/)'
    - id: create-tests
      why: the create route differs in its step order, its conflict check, its id handling or its registry write
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_writes::create::/)'
    - id: update-tests
      why: the replace or patch route differs in its 404, its identity checks, its card merge or its registry swap
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_writes::update::/)'
    - id: remove-tests
      why: the delete route differs in its 404 text, its registry removal or its response
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_writes::remove::/)'
    - id: error-tests
      why: a persistence or identity error answers with another status than the one LiteLLM sends
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_writes::error::/)'
oracle_cases:
  - tools/oracle/cases/agents/writes/merged-card-basic.yaml
  - tools/oracle/cases/agents/writes/merged-card-unsupported-version.yaml
  - tools/oracle/cases/agents/writes/merged-card-name-from-card.yaml
  - tools/oracle/cases/agents/writes/merged-card-name-from-agent.yaml
deviations:
  - what: The routes take the registry, the stores, the proxy URL port and the settings as constructor values and return typed errors that carry a status and a string detail, instead of importing proxy_server globals and raising HTTPException.
    why: betterlite has no global prisma_client or registry and no exceptions; the status codes and detail strings are the same.
  - what: The card merge goes through serde_json between the core agent card and the betterlite-a2a card.
    why: The two crates define separate records with one wire shape and none depends on the other's type.
  - what: A persistence failure that is not a conflict or an identity failure answers 500 with betterlite's own error text, not Python's exception text.
    why: The wording of a Python exception cannot be matched; the status is the same.
out_of_scope:
  - "GET /v1/agents and GET /v1/agents/{agent_id} belong to B4784, and /v1/agents/identity/providers and /v1/agents/{agent_id}/identity to B4781. The kill switch and make_public routes belong to B4786."
  - "AgentStore and its SQL belong to B4777, the redaction and restore functions to B4775, AgentRegistry to B4776, reject_legacy_identity and managed_write_fields to B4772, check_feature_access_for_user to B864 and merge_agent_card to B4811."
  - "get_custom_url (proxy/utils.py) is owned by B7323; this task defines the ProxyUrls port only."
  - "Building IdentitySettings, JwtAgentSettings and the stores from config, and composing agent_write_routes into the app, is B8647's and is not built here."
pitfalls:
  - PUT and PATCH read the existing agent and answer 404 before they check the identity request, and both 404 texts say `not found` while DELETE says `not found in DB.`.
  - The identity request keeps a missing `identity` key and a null identity apart; null means no binding and skips the check, while a missing key falls back to the stored binding.
  - The conflict check on POST reads only the in-memory registry, so a name that exists in the database but not in the registry reaches B4777 and answers its 409 `Agent name or Entra application is already registered`.
  - POST pre-generates the agent id only when `agent_card_params` is present, because the merged card needs the id for its `/a2a/<agent_id>` url before the row exists; without a card the id comes from the database layer.
  - PUT and PATCH merge the card with the path agent_id and deregister the agent by its name from before the write, so a rename removes the old registry entry.
  - A PATCH without `agent_card_params` leaves the stored card alone, while PUT and POST with a card always merge, so the proxy security scheme and supportedInterfaces are applied on every re-registration.
  - The route answers with the first element of redact_sensitive_agent_fields called with is_admin true, so a kill switch auth secret in the response is the marker, not the secret.
  - The feature check (check_feature_access_for_user) runs before the admin check, so with disable_agents_for_internal_users on, a non-admin sees the feature error and not the `Only proxy admins` error.
  - The no-database texts differ per route. POST and DELETE say `Prisma client not initialized`, PUT and PATCH say the longer DB not connected text.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
