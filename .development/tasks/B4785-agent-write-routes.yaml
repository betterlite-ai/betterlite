id: B4785
title: Create, replace, patch and delete registered agents
description: >-
  Build the write side of the agents API in betterlite-server, module `agent_writes` under agent_endpoints (LiteLLM's create_agent, update_agent, patch_agent and delete_agent in endpoints.py, plus its `_proxy_base_url`, `_validate_protocol_version` and `_build_merged_agent_card`). Four routes: POST `/v1/agents`, PUT `/v1/agents/{agent_id}`, PATCH `/v1/agents/{agent_id}` and DELETE `/v1/agents/{agent_id}`. POST, PUT and PATCH carry the tag "[beta] A2A Agents" and answer with an AgentResponse; DELETE carries the tag "Agents" (not the beta one). All four are authenticated by B052 before anything else runs. The pure pieces and the database layer belong to other tasks and this task calls them in LiteLLM's order. Read the existing files first for exact names and use them: crates/betterlite-core/src/agents.rs (AgentConfig, PatchAgentRequest, AgentResponse, ExecutionMode), crates/betterlite-server/src/agent_endpoints/identity_admin (B4781), agent_reads.rs and agent_listing.rs (B4784), agent_credentials (B4775), agent_persistence (B4777), crates/betterlite-auth/src/agent_registry (B4776), agent_identity (B4772) and crates/betterlite-a2a/src/agent_card (B4811). All JSON values use the `AgentJson` alias from betterlite_core::agents::json. Expose one function, `agent_write_routes`, that returns the axum routes for the four method and path pairs; B8647 composes it. This task registers nothing else: GET on the same paths belongs to B4784 and axum merges the methods by itself.

  Ports and wiring, in agent_writes.rs. Native async fn, no statics, no trait objects; tests use in-memory fakes. `AgentWriteStore` has `add_agent(&self, agent: &AgentConfig, created_by: &str, agent_id: Option<&str>)`, `update_agent(&self, agent_id: &str, agent: &AgentConfig, updated_by: &str)`, `patch_agent(&self, agent_id: &str, agent: &PatchAgentRequest, updated_by: &str)` (each returns `Result<AgentResponse, AgentPersistenceError>`) and `delete_agent(&self, agent_id: &str) -> Result<(), AgentPersistenceError>`. The production implementation `PgAgentWriteStore<P>` (agent_writes/pg.rs) holds B4777's `AgentStore<P>` and forwards each call to the method of the same name; it adds no logic. The existing-agent read and the "has a database" test use B4784's `AgentReads` port (`has_database()` and `agent_row(agent_id)`), so no second SQL read is written here. `ProxyUrls` is a second port with `custom_url(&self, request_base_url: &str, request_root_path: &str) -> String` (LiteLLM's `get_custom_url(request_base_url, route=None)`: PROXY_BASE_URL when set, else the request base URL, then joined with the request root path). The route handler gets the root path from B4200's `get_request_root_path` and passes it in. B7323's `CustomUrls::custom_url(&self, request_base_url, request_root_path)` is the real implementation behind ProxyUrls and the server wires it in. This task defines the port and tests with a fake. The routes also take the caller's UserApiKeyAuth from B052 (its user_id and user_role), the B4775 `SensitiveDataMasker` built once in the constructor, the `JwtAgentSettings` value (built by the server from `general_settings.enable_jwt_auth` and `litellm_jwtauth.agent_id_jwt_field`, exactly as B4784's listing route takes it), and the `AgentRegistry` handle the same way B4784 takes it.

  Common order for every route. a. `check_feature_access_for_user(caller, "agents")` from B864 (its error goes out unchanged). b. `check_agent_management_permission(&auth)` from B4781 (`crate::agent_endpoints::identity_admin::permission::check_agent_management_permission`); turn its `IdentityAdminError` into the response with the status and detail it already carries, and do not rebuild the check. c. No database (`has_database()` is false) answers 500 with the plain string detail: `Prisma client not initialized` for POST and DELETE, and the text of CommonProxyErrors.db_not_connected_error for PUT and PATCH (`DB not connected. This endpoint needs a database; set DATABASE_URL to a PostgreSQL connection string (postgresql://...) to enable it. See https://docs.litellm.ai/docs/proxy/virtual_keys`). Every error answers in the envelope B003 uses for LiteLLM's HTTPException: the status and `{"detail": <detail>}`. A body that does not fit AgentConfig or PatchAgentRequest answers 422 in the B003 envelope, after authentication, as FastAPI does. Everything below runs only after steps a to c.

  Error mapping, in agent_writes/error.rs. `AgentWriteError` is this module's error enum with a `status()` and a string `detail`. A B4781 `IdentityAdminError` keeps its status and detail. B4777's `AgentPersistenceError` maps as its task says: `Conflict` answers 409 with its text, `Identity` answers 503 when its failure code is policy_unavailable and 400 otherwise (the failure message as the detail), and every other variant answers 500 with its Display text. A failure of the card merge round trip (section 2) answers 500 with its text. LiteLLM wraps each route body in `except HTTPException: raise` / `except Exception -> 500 str(e)`; here every typed error above already carries its status, so nothing is caught twice. Log the unexpected ones with `tracing::error!` and the text `Error adding agent to db: <text>` (POST), `Error updating agent: <text>` (PUT and PATCH) and `Error deleting agent: <text>` (DELETE).

  1. The identity request, in agent_writes/identity_request.rs. `identity_request_from_config(&AgentConfig) -> IdentityRequest` and `identity_request_from_patch(&PatchAgentRequest) -> IdentityRequest`, both building B4781's `IdentityRequest` (module `agent_endpoints::identity_admin::validate`; its `IdentityField` is Absent, Null or Value). The record's `identity` is `Option<Option<EntraIdentityConfig>>`: None gives Absent, Some(None) gives Null, Some(Some(config)) gives Value(the config serialized with serde_json::to_value). `execution_mode` is copied as it is. The two functions differ only in the record type, so write one generic body only if the two records share a trait; otherwise keep both plain. They are the place where "key missing" and "key set to null" stay different, since a PATCH or PUT with `identity: null` must not read the stored identity.

  2. The merged card, in agent_writes/card.rs. `build_merged_agent_card(upstream: &AgentCard, agent_id: &str, proxy_base: &str, agent_name: &str) -> Result<AgentCard, AgentWriteError>` with the core record from betterlite_core::agents. First LiteLLM's `_validate_protocol_version`: when the card's protocol version does not pass B4811's `normalize_protocol_version` (give it the version text as an `AgentJson` string), answer 400 with the plain string detail `Unsupported protocolVersion '<version>'. Supported versions: 0.3, 1.0.` Then call B4811's `merge_agent_card(Some(&card), "<proxy_base>/a2a/<agent_id>", proxy_base, name, None)`, where name is the card's own name when it is not empty, else agent_name (the card name wins, as the discovery UI edits it). The core card (betterlite-core) and the B4811 card (betterlite-a2a) are two records with the same wire shape and no conversion between them exists: go through serde_json (to_value, then from_value into the a2a card, merge, then to_value and from_value back into the core card). A failed step is an `AgentWriteError` answering 500. Add betterlite-a2a to crates/betterlite-server/Cargo.toml. `proxy_base` is `ProxyUrls::custom_url` of the request base URL and the request root path, with no trailing slash added or removed beyond what the port returns. The request base URL is `<scheme>://<Host header>/` of the incoming request (scheme http unless the request URI carries one).

  3. POST `/v1/agents`, in agent_writes/create.rs (`create_agent`). After the common steps: created_by = auth.user_id, or the text `unknown` when it is None. Then in this order, and the first failure stops the request. a. `validate_managed_identity_request(&identity_request_from_config(&agent), None, &settings)` from B4781; its `IdentitySettings` comes from the same constructor value B4781's routes take. b. `reject_legacy_identity(agent.litellm_params)` from B4772 (400, litellm_params.identity is not supported). c. Name conflict: `registry.get_agent_by_name(agent_name)` finding an agent answers 400 `Agent with name <agent_name> already exists` (a plain string). This reads the in-memory registry only. d. When `agent_card_params` is present: new_agent_id = a fresh UUID v4 text, the card = build_merged_agent_card for it, and the stored config is the request with that card; when the card is absent, no id is made here, the request is stored as it came, and `add_agent` is called with `agent_id` None (B4777 makes the id). A plain chat agent therefore never gets a made-up A2A card. e. `add_agent(&config, created_by, new_agent_id)`. f. `registry.register_agent(result.clone())` and log at info `Successfully registered agent '<agent_name>' (ID: <agent_id>) in memory`. g. Answer 200 with `redact_sensitive_agent_fields(&[result], true, jwt, masker)` from B4775, first element (is_admin is true because step b of the common order passed).

  4. PUT and PATCH, in agent_writes/update.rs (`update_agent`, `patch_agent`), same shape. After the common steps: existing = `agent_row(agent_id)`; None answers 404 `Agent with ID <agent_id> not found`. Then `validate_managed_identity_request(&identity_request, Some(&existing), &settings)`, then `reject_legacy_identity(litellm_params)`; updated_by = auth.user_id or `unknown`. Re-run the card merge when the request carries `agent_card_params` (for PUT, an update is a re-registration; for PATCH, a request without the card keeps the stored card untouched), using the path agent_id (not a new one) and the request's agent_name (PATCH: its Option). Then `update_agent` or `patch_agent`, then `registry.deregister_agent(existing.agent_name)` (the name from before the write, so a rename drops the old entry) and `registry.register_agent(result.clone())`, then log at info `Successfully updated agent '<existing name>' (ID: <agent_id>) in memory`. Answer 200 with the redacted first element as in POST. A PUT without `agent_card_params` is handled inside B4777's replace (it turns into a patch); this task still passes the AgentConfig through unchanged.

  5. DELETE `/v1/agents/{agent_id}`, in agent_writes/remove.rs (`delete_agent`). After the common steps: existing = `agent_row(agent_id)`; None answers 404 `Agent with ID <agent_id> not found in DB.` (note the trailing `in DB.`, which PUT and PATCH do not have). Then `delete_agent(agent_id)`, then `registry.deregister_agent(existing.agent_name)`, then 200 with `{"message": "Agent <agent_id> deleted successfully"}`. DELETE builds no identity request and does not touch the card or the redaction. B4777 already retires a managed identity and removes the agent's keys inside its delete transaction; this route does nothing extra for that.

