id: B056
title: Register user creation and UI identity services
description: >-
  Expose /user/new and install the split user/login/password/session routes in server state. Compose preflight
  identity/password policy, optional generated key, team/org enrollment and lifecycle events; preserve
  partial side-effect/error behavior observed by upstream oracle. This task consumes the reusable write
  services rather than reimplementing their queries.


  Build the production user_management module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  new_user (L482-L672; 155 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /user/new -> new_user. For each route
  send a typed successful request, an invalid or missing target, and a caller lacking that route permission
  through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session routes
  instead prove bad credentials or invalid/expired codes. Compare status, response model including null/absent
  fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by where read.
  Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls management
  error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 155 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  155 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 368 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
scope:
  paths:
    - crates/betterlite-server/src/user_management.rs
    - crates/betterlite-server/src/user_management/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/app.rs
    - tools/oracle/cases/management/user-management/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/internal_user_endpoints.py#L482-L672
    why: Own new_user; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L1939-L1967
    why: NewUserRequest request/response fields and defaults.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8205-L8321
    why: Management exception HTTP status and public error translation.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: new_user_http, new_user_with_key,
      invited_user, login_then_logout, password_reset_restriction, unauthorized_user_create.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: 'The recorded deviations are covered by native behavior tests: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.'
    proof:
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_management::tests::/)
        - test(/replays_the_/)'
