id: B056
title: User creation route and ordered enrollment
description: >-
  Own internal_user_endpoints.py new_user L482-L672. Register POST /user/new once with B052 auth,
  B790 NewUserRequest/NewUserResponse and B865 management effects. B790 owns request defaults and
  password rejection (any supplied password422); auto_create_key defaults true, spend zero, and
  absent optional identity/budget/team fields retain their typed defaults. Do not implement unrelated
  login/password/session routes in this task. B899 owns public login and its cookie/session behavior.

  Require a database or HTTP400 with CommonProxyErrors.db_not_connected_error as plain detail; the
  subsequent database500 guard is unreachable. Run B861 budget-duration validation, then B790 duplicate
  user_id and email checks in that order. Source next counts billable users and calls the license
  limit check only for a truthy count; its403 quota message is removed by the explicit no-cap deviation.
  Preserve the remaining role check: only a proxy admin may create proxy_admin or proxy_admin_viewer,
  otherwise403 naming attempted and caller roles. B892 checks caller permission delegation next.

  Dump the request, apply B790 internal-new-user parameter normalization, then persist B816 object
  permissions before any user/key write. Remove password defensively. Only teams=None invokes B1226
  default-team selection; an explicit [] suppresses defaults. Remove organizations from forwarded
  parameters. Invoke B893 generate_key_helper_fn with request_type=user and llm_router=None. This
  service owns user/key hashing and writes; do not replace it with plaintext storage or a transaction
  spanning this route. A nonnull deprecated team_id takes precedence over teams and calls B790
  _add_user_to_team with response.user_id, input email, max_budget_in_team=None and user_role=user.
  Otherwise nonnull teams goes to B1226 enrollment. If response.user_id exists and either team source
  was nonnull, fetch the user's actual team IDs, even after an explicit empty teams list. Then add
  organizations only when both the popped list and response user ID are nonnull, including an empty list.

  Construct the response from fields declared by NewUserResponse, excluding token and token_id. Set
  key=response.get(token, "") (present null remains null); replace teams with fetched IDs when available.
  Validate the response, schedule B797 async_user_created_hook with original data/validated response/
  caller, then return. Background hook work is not awaited here. Preserve partial writes: object
  permission, generated user/key, team enrollment and organization enrollment occur in that order;
  a later failure never rolls earlier work back. The route's broad except logs /user/new and delegates
  to B124 handle_exception_on_proxy: HTTP status/detail retained with internal_server_error, existing
  ProxyException preserved, other errors status_code or500 and internal_server_error. Match all fields.

  At server assembly, install B1226's default-team enrollment into the DefaultTeamEnrollment port of
  B736's user lookup, replacing NoDefaultTeams. Auth sits below management, so this route task is the
  first place that can see both; B052 and B736 must not import B1226. Test
  upserted_user_joins_default_teams runs get_user_object with user_id_upsert=true on the assembled state
  and Postgres, with default_internal_user_params.teams set, and checks the membership rows B808 wrote.

  Implement user_management with files below300 lines and adjacent tests. B860 independent Postgres
  fixtures use POSTGRES_TEST_URL or testcontainers. B001 cases exercise real HTTP success and errors,
  inspect tables after injected failures and prove the generated raw key authenticates while only its
  hash is stored by B893. Reuse request/row decoders; no new parser. Allow 180 production, 330 tests
  and 90 wiring lines, 600 within a 625-line gate.
scope:
  paths:
    - crates/betterlite-server/src/user_management.rs
    - crates/betterlite-server/src/user_management/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/user-management/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/internal_user_endpoints.py#L482-L672
    why: Actual creation order, role checks, response filtering and exception mapping.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8205-L8241
    why: Shared mapping actually called by this route.
dod:
  - text: 'Named cases: request_defaults_and_password422, no_database400_no_reachable500,
      duration_before_duplicate_id_before_duplicate_email, nonadmin_administrative_role403,
      permission_delegation_before_any_write, object_permission_written_before_generation,
      password_removed_and_orgs_not_forwarded, generation_user_type_router_none,
      teams_none_uses_default_empty_suppresses, legacy_team_id_precedes_teams,
      enrollment_user_role_and_null_member_budget, actual_teams_refetched,
      organizations_after_team_fetch, response_fields_no_token_id_key_default,
      response_validation_before_scheduled_user_hook, failure_keeps_prior_rows,
      generated_key_authenticates_hash_only_storage, route_logs_and_maps_each_error_class.'
    proof: [behavior-tests, oracle]
  - text: native_user_creation_has_no_license_count_or_cap proves README no-paid-tier behavior.
    proof: [behavior-tests]
  - text: The assembled user lookup enrolls an upserted user in the configured default teams through B1226.
    proof: [default-team-port-installed]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Ordered creation, public errors or partial writes differ from the source.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_management::tests::/) - test(/replays_the_/)'
    - id: default-team-port-installed
      why: The auth user lookup still runs with NoDefaultTeams, so upserted users join no default team.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_management::tests::upserted_user_joins_default_teams$/)'
oracle_cases:
  - tools/oracle/cases/management/user-management/new-user-with-and-without-key.yaml
  - tools/oracle/cases/management/user-management/password-and-duplicate-errors.yaml
  - tools/oracle/cases/management/user-management/administrative-role-denial.yaml
  - tools/oracle/cases/management/user-management/team-default-empty-and-legacy-precedence.yaml
  - tools/oracle/cases/management/user-management/organization-failure-keeps-user-and-team.yaml
  - tools/oracle/cases/management/user-management/response-fields-and-generated-key.yaml
deviations:
  - what: User creation never counts users for a license cap or returns the source license-over-limit403.
    why: README Decisions removes paid tiers and user caps; native_user_creation_has_no_license_count_or_cap proves it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/internal_user_endpoints.py#L569-L575
out_of_scope:
  - B790 owns request defaults and duplicate/enrollment helpers; B893 owns generated user/key persistence.
  - B816 owns object-permission persistence, B1226 default teams and B797 event delivery; B736 owns the enrollment port this task fills.
  - B899 owns public login/session routes. They do not gain an auth requirement through this task.
pitfalls:
  - Object permissions can remain after generation fails; team writes can remain after organization failure.
  - An explicit empty teams list suppresses defaults but still triggers the post-write team-ID read.
budget:
  max_changed_lines: 625
  max_new_expects: 0
review_level: security
