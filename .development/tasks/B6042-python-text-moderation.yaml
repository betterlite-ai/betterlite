  - crates/betterlite-python/src/moderation.rs
  - crates/betterlite-python/src/moderation/**
  - crates/betterlite-python/python/betterlite/_native_moderation.pyi
  - crates/betterlite-python/python/betterlite/_text/**
  - crates/betterlite-python/python/betterlite/main.py
  - crates/betterlite-python/tests/test_text_completion.py
  - crates/betterlite-python/tests/test_moderation.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7390-L7460
  why: atext_completion and its model lookup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7460-L7740
  why: text_completion, prompt splitting, the chat fallback and the result conversion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7767-L7870
  why: moderation and amoderation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L7325-L7400
  why: TextCompletionStreamWrapper.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/convert_dict_to_response.py#L465-L520
  why: The conversion of a chat response to a text completion response.
dod:
- text: The four functions keep LiteLLM's signatures.
  proof: [text-signature]
- text: A prompt string, a prompt list and a token list reach the server, and several prompts join with the right indexes.
  proof: [text-prompts]
- text: A chat-only provider gets the prompt as a user message and the result is a text completion.
  proof: [text-chat-fallback]
- text: Streaming returns a TextCompletionStreamWrapper that yields completion chunks, sync and async.
  proof: [text-stream]
- text: Moderation returns results, uses the default model and fails with the authentication class on a bad key.
  proof: [moderation-call]
- text: The native register function adds the session and error class, and conversion has tests without an interpreter.
  proof: [text-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: text-signature
    why: A changed default or order breaks positional callers.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_text_completion.py -k signature
  - id: text-prompts
    why: A multi-prompt call returns one choice or repeats an index.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_text_completion.py -k prompts
  - id: text-chat-fallback
    why: A chat provider gets a raw prompt and answers with an error.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_text_completion.py -k chat
  - id: text-stream
    why: A stream yields chat chunks, so callers read `choices[0].text` and fail.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_text_completion.py -k stream
  - id: moderation-call
    why: The default model or the key lookup is wrong.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_moderation.py
  - id: text-native
    why: The native conversion loses a field of the request or the error.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^moderation::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Untyped dicts creep in at the native boundary.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`ModerationCreateResponse` is a plain object and not the openai package class."
  why: The wheel has no openai dependency. Attributes and `model_dump` match.
out_of_scope:
- The shared helpers are B6040. The completion path and `CustomStreamWrapper` are B158.
- Transcription caching and audio are B6045.
pitfalls:
- A one-item prompt list is sent as a string, and a token list is never split.
- The chat fallback must pop `prompt` and must not send both `prompt` and `messages`.
- A text stream ends with a chunk that has `finish_reason` set, and `usage` goes on the last chunk only.
review_level: standard
budget:
  max_changed_lines: 1400
  max_new_expects: 0
