id: B6042
title: Python text_completion, atext_completion, moderation and amoderation
description: >-
  Add `betterlite.text_completion`, `atext_completion`, `moderation` and `amoderation` so they work where LiteLLM's do. They
  share one native family called `moderation`, since the code is small, and they share B6040's call path.


  Native side, `src/moderation.rs` with `pub(crate) fn register(module: &Bound<'_, PyModule>) -> PyResult<()>`. It adds the
  class `NativeTextSession` and the exception `NativeTextError`. The architect writes the `mod` line, the call line and the
  `.pyi` import. Do not edit `lib.rs`. Methods: `text_completion`, `atext_completion`, `moderation` and `amoderation`, each
  taking `(payload_text, blobs)` and returning JSON text. Sync ones use `block_on` inside `py.detach`, async ones use
  `future_into_py`. Conversion code is in `src/moderation/convert.rs`, with tests that start with `request_` and `error_`.
  The Rust SDK call for text completion goes through the chat path (the SDK completion entry), with a prompt turned into a
  user message when the provider is a chat one. The moderation call uses the SDK moderation entry.


  Python side, the package `python/betterlite/_text/` with an explicit `__all__`. One star line is written by the architect. Never
  edit `python/betterlite/__init__.py`. `main.py` re-exports the names. Signatures keep LiteLLM's (main.py L7390-L7460,
  L7460-L7740, L7767-L7870).


  `text_completion` rules (main.py L7460-L7740): `prompt` may be a string, a list of strings, a list of ints or a list of lists
  of ints. A list of strings with more than one item is sent as one call per prompt, and the results join into one
  `TextCompletionResponse` whose `choices` get `index` from the position, as LiteLLM's loop does. A single-item list is sent as
  that string. `model` defaults the way the signature says. When `custom_llm_provider` is "openai" or "text-completion-openai"
  or the model is a known text model, the call goes to `/v1/completions` and the result is the response as is. When the
  provider is a chat one, the prompt becomes `[{"role": "user", "content": prompt}]`, the call goes through chat completion,
  and the result is turned back to a `TextCompletionResponse` with `text` from `message.content`. `stream=True` returns a
  `TextCompletionStreamWrapper` (utils.py L7325-L7400), which wraps B158's `CustomStreamWrapper`, turns each
  `ModelResponseStream` chunk to a `TextCompletionResponse` with `object` "text_completion", and has `__iter__`, `__next__`,
  `__aiter__`, `__anext__`. `logprobs` of the chat form maps to the completion form, with `token_logprobs`, `tokens`,
  `top_logprobs` and `text_offset`. `echo`, `suffix`, `best_of` and `logit_bias` pass through. `atext_completion` is a coroutine
  function that reads the model from `args[0]` or `kwargs["model"]` first.


  `moderation(input, model=None, api_key=None, **kwargs)` returns a `ModerationCreateResponse` (types/llms/openai.py is not
  needed: use B5658's class if it has one, else a `ResponseObject` with `id`, `model` and `results`, each result with
  `flagged`, `categories`, `category_scores` and `category_applied_input_types`). The default model is
  "omni-moderation-latest" (main.py L7767). With no `api_key` it reads `OPENAI_API_KEY` through `get_secret_str`. B6040's
  `read_settings` is used for settings. `amoderation` is the async twin and uses the same path with `future_into_py`.


  `_transcription_response_from_cached_dict` belongs to B6045, not here.
scope:
