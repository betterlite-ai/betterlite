id: B4837
title: Adapt Deep Agents messages, tool permissions and usage accounting
description: >-
  Translate LangChain messages and LangGraph updates into harness events, configure
  approval/filter policy and count model usage with price fallback. Keep middleware
  callbacks below the graph handler so filtering and accounting never depend on its driver.

  Message and update translation functions extract plain text, reasoning deltas and tool
  calls from LangChain message objects and LangGraph state updates, returning Event lists
  suitable for the turn engine. gateway_headers adds attribution tags and optional metadata
  for gateway mode. chat_model_kwargs returns a ChatLiteLLM constructor dict for gateway
  or SDK mode. Tool-name helpers (native_tool_name, normalized_tool_name) map between
  native Deep Agents tool names and a shared normalized vocabulary. blocked_tools returns
  native tool names the model must not see, based on permissions mode (read-only, edit,
  ask, full) and disable_tools list. interrupt_config builds the interrupt_on policy for
  permissions='ask'. recursion_limit computes the max LangGraph steps from ctx.max_turns.

  ToolFilterMiddleware hides filtered tools from the model and refuses calls to them by
  wrapping model and tool-call handlers. UsageCallback counts every model call in the graph,
  subagents and summarization included, reading usage_metadata and cost_per_token with
  fallback to zero for unmapped models. message_cost extracts the reported response_cost
  or computes it from tokens; record_llm_usage increments session counters and catches
  exceptions to prevent accounting failures from breaking a turn.

  DeepAgentsHarnessConfig.validate_environment checks that ctx.model is set (model is
  required for Deep Agents). The permissions-to-capabilities mapping is validated in B4844.

