oracle_cases: []
deviations:
- what: _parse_code returns empty string for any JSON parse error, including malformed JSON, missing code field, and non-string code values.
  why: Display-only parsing trades strictness for resilience so the loop doesn't crash on malformed arguments; the execution path (_run_tool_call) parses again strictly and rejects errors.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/code_interpreter_interception/handler.py#L688-L706
out_of_scope:
- Sandbox provider implementations, container lifecycle and code execution (B4121).
- Configuration, deployment hooks, agentic loop gates and plan construction (B4122).
- Tool call detection across response formats beyond extraction; B4111 recognizes intercepted tool names.
- Message record definitions (ChatCompletionAssistantMessage, ChatCompletionToolMessage); B004 owns ModelResponse and chat wire types.
- Metadata marker storage and constant definitions (B004 for marker constants that predate this task).
pitfalls:
- _narrow_tool_call always sets name to litellm_code_execution regardless of input; do not preserve original tool name.
- _parse_code is intentionally permissive and never panics on invalid JSON. Its match is a fallback; _run_tool_call parses strictly.
- _extract_session_id checks both metadata and litellm_metadata keys, not just one; keep the preference order.
- _to_model_response catches ValidationError (Pydantic v2) not ValueError; check the correct exception type.
- _merge_code_interpreter_calls inserts before the first message-type item, not at a fixed position; find the insertion point dynamically.
- Tool call IDs in CodeExecutionToolCall come from either id or call_id field with call_id as fallback; never invent or overwrite them.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
