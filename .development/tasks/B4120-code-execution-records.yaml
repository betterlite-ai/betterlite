id: B4120
title: Code execution tool records arguments and metadata filtering
description: >-
  Build typed tool shapes, result extraction, follow-up filtering and metadata-marker transformations shared
  by code interception. Preserve the distinction between Responses and chat tools, exact code-execution name
  litellm_code_execution, first-choice chat parsing and the permissive display-only _parse_code fallback. Fuzz
  its JSON decoder to catch malformed arguments.

  These helpers normalize tool calls and response items across Responses and Chat Completions dialects, filtering
  metadata markers that track interception state between request boundaries. Keep responses as dict/object pairs, handle
  None fields gracefully, and reject non-object JSON in _parse_code without panicking. Preserve tool call IDs from
  call_id or id fields; when both are missing use the source ID.

  Responses dialect: tool calls carry call_id and arguments directly. Chat Completions: calls are nested in message.tool_calls
  with id and function.arguments, and tool results are ChatCompletionToolMessage dicts with tool_call_id and content.
  Agent follow-up filtering removes agentic-loop metadata and logging globals that a later agent should not inherit.

  Owned metadata fields: _code_interpreter_interception_active (boolean), _code_interpreter_interception_sandbox_key
  (string or None), _code_interpreter_interception_session_scoped (boolean), _code_interpreter_interception_converted_stream
  (boolean). Write them to litellm_metadata and strip them on follow-up so their markers do not leak to the model.

