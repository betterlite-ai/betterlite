dod:
  - text: Compatible hosts and JSON descriptors select their own leaves through executable dispatch.
    proof: [compatible-provider-tests, compatible-provider-http, oracle]
  - text: Nine provider dispatchers preserve setting precedence, client arguments and ordered hooks.
    proof: [compatible-provider-tests, compatible-provider-settings, compatible-provider-http, oracle]
  - text: Existing API aliases serve native supported families and preserve auth, error and upstream contracts.
    proof: [compatible-provider-http, oracle]
checks:
  optional: []
  commands:
    - id: compatible-provider-tests
      run: cargo nextest run --locked -p betterlite-provider -p betterlite-core --no-tests=fail -E 'test(/^compatible_providers::/)'
      why: Dispatch tests must reach each leaf and capture sync/async hook order and explicit client forwarding.
    - id: compatible-provider-settings
      run: cargo nextest run --locked -p betterlite-config --test compatible_provider_settings --no-tests=fail
      why: Main-dispatch globals and env aliases need loader coverage beyond provider config identity methods.
    - id: compatible-provider-http
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/compatible-a-l)" && cargo run --locked -p betterlite-oracle -- tools/oracle/cases/providers/compatible-a-l
      why: Exercise booted gateways with fresh provider and alias scenarios, never only a selector helper.
oracle_cases:
  - tools/oracle/cases/providers/compatible-a-l/json-registry-chat-slugs.yaml
  - tools/oracle/cases/providers/compatible-a-l/native-chat-policies-and-aliases.yaml
  - tools/oracle/cases/providers/compatible-a-l/deepseek-thinking-and-tools.yaml
  - tools/oracle/cases/providers/compatible-a-l/gradient-global-base-precedence.yaml
  - tools/oracle/cases/providers/compatible-a-l/gdc-project-auth-and-model-prefix.yaml
  - tools/oracle/cases/providers/compatible-a-l/bytez-preflight-errors.yaml
  - tools/oracle/cases/providers/compatible-a-l/inception-fim-aliases-and-stream.yaml
  - tools/oracle/cases/providers/compatible-a-l/comet-and-generic-embeddings.yaml
  - tools/oracle/cases/providers/compatible-a-l/aiml-comet-image-aliases.yaml
  - tools/oracle/cases/providers/compatible-a-l/deepinfra-rerank-aliases.yaml
  - tools/oracle/cases/providers/compatible-a-l/json-responses-and-native-messages.yaml
  - tools/oracle/cases/providers/compatible-a-l/auth-errors-and-upstream-failures.yaml
deviations: []
out_of_scope:
  - B1424, B1425, B1426 and B1428–B1440 own the extracted provider source; B1427's shared line iterator remains a B042 part used by B1428.
  - B1440 owns the shared openai_like/llamafile/lm_studio and CometAPI embedding branches plus the enumerated API selectors; B2230 owns the chat selector.
  - Other main.py functions retain the callable owners recorded by B500; the nine listed dispatchers are the only main.py bodies owned here.
  - B004, B006, B202, B203, B080, B081, B082 and B085 retain route registration and wire parsing; compatible_providers only supplies operation bindings.
  - B068 integrates provider cost callbacks and B845 schedules model discovery; this task exports their leaf interfaces without implementing either service.
pitfalls:
  - Gradient's outer dispatch prefers litellm.api_base over a caller context base before its own endpoint policy runs.
  - CometAPI's extra post_call occurs at the handler-return stage, which precedes awaiting an async result.
  - FIM short-circuit evaluation can leave an unused base_url option in the body options.
budget: {max_changed_lines: 800, max_new_expects: 0}
review_level: security
