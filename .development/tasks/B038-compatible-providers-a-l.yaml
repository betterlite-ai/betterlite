id: B038
title: JSON-configured and A–L compatible provider execution
description: >-
  Compose B1424–B1440's applicable leaves behind B010's closed Provider and B678's
  operation extension points, using compatible_providers in betterlite-provider and
  betterlite-core. Bind openai_like, the 31 pinned JSON descriptors, aiml, baseten,
  bytez, cerebras, clarifai, cometapi, compactifai, datarobot, deepinfra, deepseek,
  empower, featherless_ai, friendliai, galadriel, gdc, github, gradient_ai, heroku,
  hyperbolic, inception, lambda_ai and text-completion-inception. Pass B1424's descriptor
  projection to B210/B211 identity resolution and B2230 chat selection; instantiate
  B1426's policies only after selection, supplying B2221 capabilities. Standard compatible
  chat uses B004/B005 execution and B500 fallback credentials where its existing common
  path does; expose B1428's separate legacy handler for its consumers without substituting
  it for all compatible chat. Bind B1425 model discovery as an injected callable and
  B1440's shared embedding operation without adding a refresh scheduler.

  Own main.py _complete_deepseek, _complete_heroku, _complete_cometapi,
  _complete_compactifai, _complete_datarobot, _complete_text_completion_inception,
  _complete_gradient_ai, _complete_gdc and _complete_bytez. DeepSeek and Heroku pass
  resolved context through the HTTP handler, post_call with original error text and
  supplied headers on failure, then rethrow. CometAPI resolves key explicit/cometapi_key/
  COMETAPI_KEY/api_key and base explicit/api_base/COMETAPI_API_BASE/
  https://api.cometapi.com/v1; its additional post_call runs after obtaining the handler
  result, including the async-handle stage before awaiting. CompactifAI resolves key
  explicit/COMPACTIFAI_API_KEY/api_key and base explicit/https://api.compactif.ai/v1.
  DataRobot adds no fallback beyond its selected policy. Gradient gives litellm.api_base
  precedence over the context base and passes shared_session but no caller client or
  explicit provider_config. Preserve each dispatcher's forwarded fields in native tests.

  GDC resolves key explicit/gdc_key/GDC_API_KEY/api_key and base explicit/gdc_api_base/
  GDC_API_BASE/api_base, then uses B1438/B1439 with its fixed GDC config. Bytez resolves
  key explicit/bytez_key/BYTEZ_API_KEY/api_key and selects B1435's custom stream path.
  These unqualified settings denote litellm globals, absent by default. Add
  compatible_provider_settings loader cases for every listed global/env alias, including
  CometAPI's ignored image-only aliases, Gradient's global-base preference and GDC's
  host/project settings from B1438. Keep existing typed settings shared with leaf loaders.

  Inception FIM short-circuits explicit base, popped optional api_base and popped base_url;
  later aliases remain unpopped when an earlier source wins. Then use INCEPTION_API_BASE
  or https://api.inceptionlabs.ai/v1, trim slashes and append /fim unless already present.
  Fill key from explicit/inception_key/INCEPTION_API_KEY only when the selected caller
  base is None or an explicit key is truthy. Invoke B2238 with provider text-completion-inception
  and B1434's FIM policy. Convert to chat via B2237 only for sync, nonstream calls with
  text_completion=false; stream or async paths invoke post_call with the returned handle.
  Unlike chat identity, FIM's base decision uses the short-circuit result, so retain the
  empty-alias edge. B202/B203 retain public text routing and streaming.

  Compose B1440's API-family identifiers with B1430 DeepSeek Messages, B1426 generic/JSON
  Messages and Responses, B1431 AIML/CometAPI images, B1436 DeepInfra rerank and B1437
  CometAPI embeddings. Keep native Messages composition in core, above provider leaves.
  The existing API services own native-versus-emulated fallback and route factories.
  Do not promote a descriptor to an API absent from supported_endpoints.

  Use booted HTTP oracle cases for chat aliases /v1/chat/completions, /chat/completions,
  /engines/{model:path}/chat/completions and /openai/deployments/{model:path}/chat/completions;
  embeddings and completions use the same four forms with their respective suffixes.
  Responses creation uses /v1/responses, /responses and /openai/v1/responses. Messages
  uses /v1/messages plus /claude_code_gateway/v1/messages when B1132 enables that alias.
  Image generation uses /v1/images/generations, /images/generations and
  /openai/deployments/{model:path}/images/generations. Rerank uses /v2/rerank, /v1/rerank
  and /rerank. Mount each existing factory once. B1139 scenarios compare actual auth,
  status, error type/param/code, selected response headers and captured upstream requests;
  ignore only error.message. Exercise each descriptor and host in bounded scenarios,
  plus cross-family alias coverage and upstream 401/429/5xx. Bytez's fixed external root
  must never be contacted by the HTTP oracle: cover its preflight failures through the
  booted gateway and rely on B1435's injected transport tests for successful streaming.
  Other successful cases use explicit mock bases. Test GDC with a fixture bearer key,
  not a live service-account exchange. The nine dispatchers contain 356 nonblank/noncomment
  lines; allow 275 binding/orchestration, 290 tests, 105 configuration and 105 shared
  exports/operation wiring lines, capped at 800. All byte parsers remain in the leaves.
