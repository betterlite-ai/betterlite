    - crates/betterlite-provider/Cargo.toml
    - crates/betterlite-provider/src/{lib,provider,operation,prepared,bedrock_dispatch_contract,compatible_providers}.rs
    - crates/betterlite-provider/src/compatible_providers.rs
    - crates/betterlite-provider/src/compatible_providers/**
    - crates/betterlite-core/Cargo.toml
    - crates/betterlite-core/src/{lib,dispatch,operation,compatible_providers}.rs
    - crates/betterlite-core/src/compatible_providers.rs
    - crates/betterlite-core/src/compatible_providers/**
    - crates/betterlite-core/src/api/{responses_routes,anthropic_messages_routes,image_generation_call,rerank_call}.rs
    - crates/betterlite-server/src/{state,routes}.rs
    - crates/betterlite-config/src/{lib,settings,providers}.rs
    - crates/betterlite-config/src/providers/{mod,compatible_providers}.rs
    - crates/betterlite-config/tests/compatible_provider_settings.rs
    - Cargo.lock
    - tools/oracle/cases/providers/compatible-a-l/**
    - tools/oracle/helpers/b038.py
    - tools/oracle/helpers/b038/**
    - tools/oracle/src/helpers/provider/b038.rs
    - tools/oracle/src/helpers/provider/b038/**
  lint_tables: false
