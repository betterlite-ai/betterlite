  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L368-L452
    why: _sync_get_cache; preserve error detail and sync callback dispatch path.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L275
    why: Calls B110's _get_parent_otel_span_from_kwargs to extract OTel parent span once at entry.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L258-L263
    why: Cache eligibility checks no-cache controls and caching parameter.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L287-L335
    why: Full cache hit path; convert result and invoke logging/callback dispatch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L336-L358
    why: Partial embedding hit path; process per-input cache hits and return uncached indices.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L360-L366
    why: No-hit and disabled-caching returns.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L398-L412
    why: Sync path error detail preservation (cached_result with "detail" key).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L437-L450
    why: Cache key stamping into _hidden_params for both paths.
dod:
  - text: >-
      Async cache lookup eligibility is checked before expensive operations; caching=null or true
      and no-cache=false enables the async path, and async no-cache controls are preserved.
    proof: [cache-lookup-eligibility]
  - text: >-
      Sync cache lookup eligibility is checked for call type support only; cache hits invoke result
      conversion regardless of caching parameter, and sync error detail (any cached_result with
      "detail" key) is preserved without further processing.
    proof: [cache-lookup-eligibility]
  - text: >-
      Cache hits are converted to appropriate response types and logging context is updated with
      cache duration, original provider and model; cache key is computed from preset key, request
      parameter or computed from kwargs, then stamped into _hidden_params.
    proof: [cache-lookup-context]
  - text: >-
      For full cache hits, async_success_handler is enqueued through B191 and sync_success_callbacks
      are dispatched through the logging object; stream callback deferral to callers is preserved.
    proof: [cache-lookup-callbacks]
  - text: >-
      For async partial embedding hits, per-input cached entries are validated and merged, embedding
      count does not include the full-hit path, and CachingHandlerResponse carries embedding_uncached_input
      for fresh lookups.
    proof: [cache-lookup-embedding]
  - text: >-
      Cache lookup returns CachingHandlerResponse with null cached_result when caching is disabled or
      no eligible hit is found, and S3Cache is excluded from partial embedding writes.
    proof: [cache-lookup-absence]
checks:
  optional: []
  commands:
    - id: cache-lookup-eligibility
      why: Cache eligibility checks, async/sync dispatch selection, or preserved controls fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::lookup_eligibility(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: cache-lookup-context
      why: Cache-hit context recording, response conversion, or cache key stamping fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::lookup_context(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: cache-lookup-callbacks
      why: Async callback enqueueing, sync callback dispatch, or stream deferral fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::lookup_callbacks(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: cache-lookup-embedding
      why: Partial embedding hit merging, validation, or uncached index tracking fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::lookup_embedding(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: cache-lookup-absence
      why: No-hit or disabled-caching return paths, or S3Cache exclusion fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::lookup_absence(::|$)/) - test(/replays_the_.*_corpus/)'
