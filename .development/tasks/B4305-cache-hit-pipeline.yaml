deviations: []
out_of_scope:
  - B4300 implements cache eligibility filtering, kwarg normalization and per-input embedding retrieval; this task only calls it.
  - B4301 implements cache-hit context recording and both callback paths; this task only calls them.
  - B4302 implements cached result conversion to all supported response types; this task only calls it.
  - B4303 implements partial embedding hit merging and token aggregation; this task only calls it.
  - B4296 computes cache keys from request parameters; this task only calls get_cache_key.
  - B4297 implements cache get/async_get semantics; this task only calls them.
  - B174 implements get_llm_provider; this task only calls it with cache-hit metadata.
  - B250 implements async_success_handler and sync success callback dispatch; this task only calls them.
  - B110 implements _get_parent_otel_span_from_kwargs; this task calls it once at the entry to _async_get_cache to extract the OTel parent span.
pitfalls:
  - >-
    Async no-cache control is checked via kwargs.get("cache", {}).get("no-cache", False) is not True;
    the nested dict access with False default differs from the sync path which has no such check and relies only on call-type eligibility.
  - >-
    Cache-hit timing is measured from cache_check_start_time to cache_check_end_time; cache_duration_ms must use
    these same perf_counter values, not the datetime.now() values used for logging context timestamps.
  - >-
    Sync path preserves cached error detail by checking if "detail" key is present in cached_result before attempting
    conversion; a conversion attempt on an error dict would corrupt the error message.
  - >-
    Partial embedding hits check isinstance(cached_result, list) only after confirming not a full hit; the list
    indicates multiple per-input results rather than a single response, and S3Cache is excluded from bulk embedding writes.
  - >-
    Cache key stamping must preserve None in the preset_cache_key path (preset_cache_key or self.request_kwargs.get("cache_key")),
    not mistakenly compute one when all three sources are absent; the key may legitimately be None for cache stamping purposes.
  - >-
    Stream callback deferral is checked via _should_defer_streaming_cache_hit_callbacks before dispatching;
    streaming results and some response types defer callbacks to the caller, not to the hit path.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
