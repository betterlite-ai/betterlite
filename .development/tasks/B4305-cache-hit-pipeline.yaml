id: B4305
title: Execute synchronous and asynchronous response cache lookup
description: >-
  Compose cache eligibility, lookup, hit conversion and logging into the sync/async request paths.
  Implement _async_get_cache and _sync_get_cache to perform complete cache retrieval pipelines,
  including no-cache control checks, per-request cache state initialization, and cache-hit
  recording. Both methods check call-type eligibility, retrieve results from the cache, validate
  freshness, convert cached responses to the proper output format, update logging context,
  and stamp the cache key into hidden parameters. The async path defers stream callbacks and
  handles partial embedding hits; the sync path preserves error detail and dispatches success
  callbacks through the logging object. Both methods avoid expensive operations until caching
  eligibility is confirmed and return CachingHandlerResponse with null when caching is disabled.
  The OTel parent span is extracted once at the start using B110's helper and stored in kwargs
  for all descendant calls.
scope:
  paths:
    - crates/betterlite-core/src/caching/lookup.rs
    - crates/betterlite-core/src/caching/lookup/**
    - tools/oracle/cases/caching/async-cache-lookup.yaml
    - tools/oracle/cases/caching/sync-cache-lookup.yaml
    - tools/oracle/cases/caching/cache-error-detail.yaml
    - tools/oracle/cases/caching/partial-embedding-hits.yaml
    - tools/oracle/helpers/b4305.py
    - tools/oracle/helpers/b4305/**
    - tools/oracle/src/helpers/core_ops/b4305.rs
    - tools/oracle/src/helpers/core_ops/b4305/**
  lint_tables: false
