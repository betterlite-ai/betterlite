    - packaging/helm/betterlite-helm/templates/deployment.yaml
    - packaging/helm/betterlite-helm/templates/migrations-job.yaml
    - packaging/helm/betterlite-helm/templates/service.yaml
    - packaging/helm/betterlite-helm/templates/service-metrics.yaml
    - packaging/helm/betterlite-helm/templates/extra-resources.yaml
    - packaging/helm/betterlite-helm/templates/NOTES.txt
    - packaging/helm/betterlite-helm/tests/deployment_tests.yaml
    - packaging/helm/betterlite-helm/tests/deployment_command_args_labels_tests.yaml
    - packaging/helm/betterlite-helm/tests/migrations_job_tests.yaml
    - packaging/helm/betterlite-helm/tests/collector_tests.yaml
    - packaging/helm/betterlite-helm/tests/metrics_server_tests.yaml
    - packaging/helm/betterlite-helm/tests/service_tests.yaml
  lint_tables: false
