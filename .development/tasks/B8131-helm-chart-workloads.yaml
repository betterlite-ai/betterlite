id: B8131
title: Single-deployment chart proxy workload and migration Job
description: >-
  Add the workload templates of the betterlite-helm chart (B8130 wrote its values.yaml and helpers): templates/deployment.yaml, templates/migrations-job.yaml, templates/service.yaml, templates/service-metrics.yaml, templates/extra-resources.yaml and templates/NOTES.txt. Use the helpers betterlite.fullname, betterlite.labels, betterlite.selectorLabels, betterlite.proxyEnv, betterlite.proxyMetricsEnv, betterlite.collectorEnv, betterlite.collector.socketDir and betterlite.serviceAccountName from B8130 and do not edit them.
  Deployment: name <fullname>, annotations from deploymentAnnotations, labels plus deploymentLabels. spec.replicas is written only when neither keda.enabled nor autoscaling.enabled. strategy comes from values, minReadySeconds from deploymentMinReadySeconds when non-zero. The pod gets checksum/config (sha256 of configmap-betterlite.yaml, only when proxyConfigMap.create), podAnnotations rendered through tpl, podLabels, imagePullSecrets, serviceAccountName, podSecurityContext, extraInitContainers, and terminationGracePeriodSeconds (default 90). The main container is named after betterlite.name, uses image.repository:(image.tag or Chart.AppVersion), the env from betterlite.proxyEnv and betterlite.proxyMetricsEnv (plus betterlite.collectorEnv when collector.enabled), envFrom from environmentSecrets and environmentConfigMaps, the command from values when set, and the args from values or else "--config /etc/betterlite/config.yaml" plus "--num_workers N" when numWorkers is set. Ports: http on service.port and metrics on metricsServer.port when enabled. Liveness, readiness and startup probes are httpGet on port "http" with every field from the matching values block. It mounts the config ConfigMap at /etc/betterlite/config.yaml, mounts emptyDir volumes for /tmp when securityContext.readOnlyRootFilesystem is true, the collector socket folder when collector.enabled and its address starts with unix://, and the user volumeMounts. lifecycle, extraContainers (through tpl), volumes, nodeSelector, affinity, tolerations and topologySpreadConstraints come from values.
  The collector sidecar (collector.enabled) is a second container named <name>-collector with the same image, securityContext and betterlite.proxyEnv, plus betterlite.collectorEnv, LITELLM_JOB_ROLE=collector and CONFIG_FILE_PATH=/etc/betterlite/config.yaml unless envVars sets it. Its command is collector.command from values; the default in values.yaml is ["betterlite", "collector"] and the chart treats it as opaque.
  Migrations Job (migrationJob.enabled): name <fullname>-migrations, ArgoCD PreSync annotations when hooks.argocd.enabled, Helm pre-install and pre-upgrade hook annotations (delete policy before-hook-creation, weight default "1") when hooks.helm.enabled, and a checksum/config annotation. The container is named db-migrations, runs command ["betterlite-db-admin", "migrate"] from PATH (B1232), takes the database variables of the existing database or DATABASE_URL for the bundled one, envVars, extraEnvVars, and sets DISABLE_SCHEMA_UPDATE=false last. It uses betterlite.migrationServiceAccountName, restartPolicy OnFailure, ttlSecondsAfterFinished, backoffLimit and activeDeadlineSeconds from migrationJob.
  Service: type, port, annotations, loadBalancerClass for type LoadBalancer, targetPort "http". service-metrics: a ClusterIP Service <fullname>-metrics on metricsServer.port when enabled. extra-resources: each entry of extraResources as its own document. NOTES.txt prints how to reach the Service by ingress, NodePort, LoadBalancer or ClusterIP port-forward and the PDB line.
scope:
