    why: The whole Deployment including the collector sidecar and volumes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/migrations-job.yaml#L1-L125
    why: Job hooks, environment and the always-run DISABLE_SCHEMA_UPDATE override.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/service.yaml
    why: Service fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/service-metrics.yaml
    why: Metrics Service.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/NOTES.txt
    why: Post-install notes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/tests/deployment_tests.yaml#L1-L494
    why: Behaviors to cover in the deployment suites.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/tests/migrations-job_tests.yaml#L1-L344
    why: Hook, env, service account and deadline behaviors of the Job.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/tests/collector_tests.yaml#L1-L272
    why: Sidecar behaviors.
dod:
  - text: The Deployment renders the replica rule, strategy, env, args, ports, three probes, volumes and scheduling fields from values.
    proof: [deployment-suites]
  - text: The collector sidecar renders only when enabled, with its role variable, socket volume and command from values.
    proof: [collector-suite]
  - text: The migrations Job runs betterlite-db-admin migrate with the right hooks, service account, deadline and DISABLE_SCHEMA_UPDATE=false.
    proof: [job-suite]
  - text: The Services, the metrics Service and the metrics port render as described.
    proof: [service-suites]
  - text: The chart lints and renders as a whole with the CI values.
    proof: [chart-lint]
checks:
  optional: []
  commands:
    - id: deployment-suites
      why: a Deployment behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/deployment_tests.yaml tests/deployment_command_args_labels_tests.yaml
    - id: collector-suite
      why: the collector sidecar behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/collector_tests.yaml
    - id: job-suite
      why: a migrations Job behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/migrations_job_tests.yaml
    - id: service-suites
      why: a Service behavior is missing
      run: sh packaging/helm/tests/helm_checks.sh unittest packaging/helm/betterlite-helm tests/service_tests.yaml tests/metrics_server_tests.yaml
    - id: chart-lint
      why: the chart does not lint or render once the workload templates exist
      run: test -f packaging/helm/betterlite-helm/templates/deployment.yaml && sh packaging/helm/tests/helm_checks.sh lint packaging/helm/betterlite-helm packaging/helm/betterlite-helm/ci/test-values.yaml
oracle_cases: []
deviations:
  - what: The migrations Job runs betterlite-db-admin migrate, with no python, workingDir or prisma_migration.py.
    why: B1232 owns the native migration command; the image has no Python or Prisma.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/migrations-job.yaml#L58-L62
  - what: The container mounts only an emptyDir at /tmp when readOnlyRootFilesystem is true, not /.cache and /.npm.
    why: Those two folders belong to Node and Prisma, and the native image has neither.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/templates/deployment.yaml#L175-L183
  - what: The test-values USE_DDTRACE variable has no effect.
    why: B5070 makes the entrypoint ignore it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/helm/litellm-helm/ci/test-values.yaml
out_of_scope:
  - Values, helpers, Secrets and the ConfigMap belong to B8130.
  - hpa, keda, pdb, ingress, servicemonitor and the helm test pods belong to B8132 and B152.
  - The collector program and the betterlite-db-admin binary are not built here (B1708 and B1232).
pitfalls:
  - >-
    The pod annotation checksum/config includes configmap-betterlite.yaml by template path, so renaming that file in B8130 breaks the include.
  - >-
    The migrations Job and the Deployment both list envVars, and the Job sets DISABLE_SCHEMA_UPDATE=false after them while the Deployment sets true after them; both must stay last.
  - >-
    A command or args value of {} (the values.yaml default) is falsy in the template, so the default args apply; a list replaces them completely.
  - >-
    The trailing space after the initContainers block in the LiteLLM Job template is not needed and must not be copied.
  - >-
    ArgoCD hooks default to enabled and Helm hooks to disabled in this chart; the componentized chart has the opposite defaults.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
