id: B869
title: JWT configuration defaults and dependent field validation
description: >-
  Define typed litellm_jwtauth settings for every field in LiteLLM_JWTAuth and its issuer/routing-override
  records. Preserve defaults, deprecated jwt_client_id_field alias precedence, paired role-field validation,
  object-id/role-map dependency and scope-mapping validation. Represent custom_validate as an unresolved
  configured callable reference; fail startup until B054 registers B165 callable support. Do not import
  Python or perform JWKS/network requests in the config loader.


  Config fuzzing uses the existing config_yaml target, which calls the production config loader; do not
  create a second fuzz crate.


  Build the production jwt_settings module in betterlite-config; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/_types.py:
  LiteLLM_JWTAuth (L5331-L5576; 212 source lines), JWTLiteLLMRoleMap (L5198-L5200; 3 source lines), JWTRoutingOverride
  (L5211-L5232; 18 source lines), UnregisteredJWTClientBehavior (L5235-L5251; 15 source lines), JWTIssuerConfig
  (L5254-L5325; 68 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.admin_jwt_scope='litellm_proxy_admin';
  litellm_jwtauth.admin_allowed_routes=['management_routes', 'spend_tracking_routes', 'global_spend_tracking_routes',
  'info_routes']; litellm_jwtauth.team_id_jwt_field=None; litellm_jwtauth.team_id_upsert=False; litellm_jwtauth.team_ids_jwt_field=None;
  litellm_jwtauth.upsert_sso_user_to_team=False; litellm_jwtauth.team_allowed_routes=['openai_routes',
  'info_routes', 'mcp_routes', '/v1/messages', '/v1/messages/count_tokens']; litellm_jwtauth.team_id_default=None;
  litellm_jwtauth.team_alias_jwt_field=None; litellm_jwtauth.org_id_jwt_field=None; litellm_jwtauth.org_alias_jwt_field=None;
  litellm_jwtauth.user_id_jwt_field=None; litellm_jwtauth.user_email_jwt_field=None; litellm_jwtauth.user_allowed_email_domain=None;
  litellm_jwtauth.user_roles_jwt_field=None; litellm_jwtauth.user_allowed_roles=None; litellm_jwtauth.user_id_upsert=False;
  litellm_jwtauth.end_user_id_jwt_field=None; litellm_jwtauth.agent_id_jwt_field=None; litellm_jwtauth.mcp_client_id_jwt_field=None;
  litellm_jwtauth.public_key_ttl=600; litellm_jwtauth.public_key_stale_ttl=DEFAULT_JWKS_STALE_TTL; litellm_jwtauth.public_allowed_routes=['public_routes'];
  litellm_jwtauth.enforce_rbac=False; litellm_jwtauth.roles_jwt_field=None; litellm_jwtauth.role_mappings=None;
  litellm_jwtauth.object_id_jwt_field=None; litellm_jwtauth.scope_mappings=None; litellm_jwtauth.enforce_scope_based_access=False;
  litellm_jwtauth.enforce_team_based_model_access=False; litellm_jwtauth.custom_validate=None; litellm_jwtauth.jwt_litellm_role_map=None;
  litellm_jwtauth.sync_user_role_and_teams=False; litellm_jwtauth.oidc_userinfo_endpoint=None; litellm_jwtauth.oidc_userinfo_enabled=False;
  litellm_jwtauth.oidc_userinfo_cache_ttl=300; litellm_jwtauth.virtual_key_claim_field=None; litellm_jwtauth.virtual_key_mapping_cache_ttl=300;
  litellm_jwtauth.unregistered_jwt_client_behavior=UnregisteredJWTClientBehavior.FALLBACK_TEAM_MAPPING;
  litellm_jwtauth.routing_overrides=None; litellm_jwtauth.team_claim_fallback=False; litellm_jwtauth.fallback_to_db_teams=False;
  litellm_jwtauth.issuers=None; JWTLiteLLMRoleMap.jwt_role=required; JWTLiteLLMRoleMap.litellm_role=required;
  JWTRoutingOverride.iss=required; JWTRoutingOverride.client_id=None; JWTRoutingOverride.scope=None; JWTRoutingOverride.aud=None;
  JWTRoutingOverride.path='oauth2'; JWTIssuerConfig.issuer=required; JWTIssuerConfig.jwks_url=None; JWTIssuerConfig.audience=None;
  JWTIssuerConfig.disable_audience_validation=False; JWTIssuerConfig.user_id_jwt_field=None; JWTIssuerConfig.user_email_jwt_field=None;
  JWTIssuerConfig.team_id_jwt_field=None; JWTIssuerConfig.team_ids_jwt_field=None; JWTIssuerConfig.org_id_jwt_field=None;
  JWTIssuerConfig.end_user_id_jwt_field=None; JWTIssuerConfig.virtual_key_claim_field=None; JWTIssuerConfig.unregistered_jwt_client_behavior=None.


  Add the jwt_settings operation under B856 Management::jwt. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-settings-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::jwt_settings::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 316 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  316 production, 148 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 609 changed lines estimated within a 625-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
