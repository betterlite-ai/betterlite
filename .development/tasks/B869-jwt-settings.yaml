id: B869
title: JWT configuration defaults and dependent field validation
description: >-
  Implement general_settings.litellm_jwtauth construction and its pure accessors in
  betterlite-config::jwt_settings. Preserve every field below, including nullable values versus empty
  strings/lists and route-group names as strings. No dedicated environment variable is read here.
  At startup proxy_server L10363-L10378 resolves top-level os.environ/ values with get_secret before
  construction; B002 provides that configuration boundary. An absent settings object constructs all
  defaults. This stage does not contact an issuer, verify a JWT, or enforce the routing rules itself.

  Constructor order matters. Pop the non-field config_file_path context first. Pop jwt_client_id_field,
  copying its value to virtual_key_claim_field only if the new key is ABSENT; an explicitly null or empty
  new field wins. Compute unknown keys from the annotated fields. If custom_validate is nonnull,
  resolve it and validate its Literal[True] return annotation BEFORE rejecting unknown keys or checking
  dependent fields. Define an injected ValidatorLoader contract carrying module reference and optional
  config-file context; B165/B054 install the real loader above this task. An unregistered loader with
  configured custom_validate is a startup error, never a silently ignored validator. Preserve local
  import failures and the remote-loading config-file gate from get_instance_fn; annotation bool,
  unannotated, Literal[False] and unions fail with TypeError "Custom validator must be annotated to
  return Literal[True], got {return_type}". Do not invoke the validator while loading settings.

  Then unknown keys raise ValueError "Invalid arguments provided: {invalid}. Allowed arguments are:
  {allowed}." Allowed names follow annotation order; unknown-key set ordering is not stable, so compare
  names as a set only within that message fragment. Either user_roles_jwt_field or user_allowed_roles
  without the other raises "user_allowed_roles must be provided if user_roles_jwt_field is set." These
  are None checks: '' and [] count as supplied. A nonnull object_id_jwt_field with null/absent
  role_mappings raises "if object_id_jwt_field is set, role_mappings must also be set. Needed to infer
  if the caller is a user or team." An empty role_mappings list satisfies this check; role_mappings
  without object_id is accepted. Nonnull scope_mappings with a falsey ORIGINAL enforce_scope_based_access
  raises "scope_mappings must be set if enforce_scope_based_access is true." Despite that text, true
  enforcement without mappings is accepted, [] with enforcement false is rejected, and a truthy
  string 'false' passes the precheck before Pydantic converts it to false. Base validation runs last.
  fallback_to_db_teams=True with user_id_upsert=False is accepted here despite the field description;
  team-claim runtime policy belongs to B891. There is no warning-and-fallback for invalid field types.

  RoleMapping requires role:string and internal_role from B736 RBAC_ROLES (proxy_admin, team,
  internal_user), ignoring extra fields like BaseModel. JWTLiteLLMRoleMap requires jwt_role:string and
  any B2314 LitellmUserRoles value, also ignoring extras. ScopeMapping adds required scope:string to
  B736 OIDCPermissions (models/routes default None) and forbids extras. JWTRoutingOverride requires iss
  as string or list of strings; client_id/scope/aud use the same union plus null, and path is only
  'oauth2', default 'oauth2'. Empty selectors are accepted here, extra fields are rejected, and no
  wildcard matching is done during construction. UnregisteredJWTClientBehavior accepts exactly
  fallback_team_mapping, reject and auto_register; their runtime effects belong to B767/B877.

  JWTIssuerConfig requires issuer:string, forbids extras and accepts audience as string/list/null.
  Its after-validator first rejects audience=None with disable_audience_validation=false using
  "JWT issuer {issuer} must configure audience or set disable_audience_validation=True". Then any
  nonnull audience with that flag true raises "JWT issuer {issuer} cannot set audience and
  disable_audience_validation=True together". Empty string and [] are NONNULL audiences and pass
  with the flag false. No URL validation, issuer uniqueness check or positivity bound is added.
  public_key_stale_ttl alone has ge=0 and defaults to the literal 3600 at L5328; zero is accepted,
  negatives rejected. Other float TTLs accept negative and zero values in this source model.

  get_issuer_config returns None for null issuer/issuers and otherwise the FIRST exact string match;
  no normalization or wildcard matching. is_virtual_key_mapping_configured tests nonnull global or
  any issuer field, so '' is configured. get_virtual_key_claim_field and
  get_unregistered_jwt_client_behavior prefer a matched issuer's nonnull override, else the global
  value; null and unknown issuer fall back globally. Preserve issuer-list order and duplicate entries.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/_types.py:
  LiteLLM_JWTAuth (L5331-L5576; 189 code lines), RoleMapping (L5193-L5195; 3),
  JWTLiteLLMRoleMap (L5198-L5200; 3), ScopeMapping (L5203-L5208; 5), JWTRoutingOverride
  (L5211-L5232; 9), UnregisteredJWTClientBehavior (L5235-L5251; 4), JWTIssuerConfig
  (L5254-L5325; 60) and DEFAULT_JWKS_STALE_TTL (L5328; 1).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.admin_jwt_scope='litellm_proxy_admin';
  litellm_jwtauth.admin_allowed_routes=['management_routes', 'spend_tracking_routes', 'global_spend_tracking_routes',
  'info_routes']; litellm_jwtauth.team_id_jwt_field=None; litellm_jwtauth.team_id_upsert=False; litellm_jwtauth.team_ids_jwt_field=None;
  litellm_jwtauth.upsert_sso_user_to_team=False; litellm_jwtauth.team_allowed_routes=['openai_routes',
  'info_routes', 'mcp_routes', '/v1/messages', '/v1/messages/count_tokens']; litellm_jwtauth.team_id_default=None;
  litellm_jwtauth.team_alias_jwt_field=None; litellm_jwtauth.org_id_jwt_field=None; litellm_jwtauth.org_alias_jwt_field=None;
  litellm_jwtauth.user_id_jwt_field=None; litellm_jwtauth.user_email_jwt_field=None; litellm_jwtauth.user_allowed_email_domain=None;
  litellm_jwtauth.user_roles_jwt_field=None; litellm_jwtauth.user_allowed_roles=None; litellm_jwtauth.user_id_upsert=False;
  litellm_jwtauth.end_user_id_jwt_field=None; litellm_jwtauth.agent_id_jwt_field=None; litellm_jwtauth.mcp_client_id_jwt_field=None;
  litellm_jwtauth.public_key_ttl=600; litellm_jwtauth.public_key_stale_ttl=3600; litellm_jwtauth.public_allowed_routes=['public_routes'];
  litellm_jwtauth.enforce_rbac=False; litellm_jwtauth.roles_jwt_field=None; litellm_jwtauth.role_mappings=None;
  litellm_jwtauth.object_id_jwt_field=None; litellm_jwtauth.scope_mappings=None; litellm_jwtauth.enforce_scope_based_access=False;
  litellm_jwtauth.enforce_team_based_model_access=False; litellm_jwtauth.custom_validate=None; litellm_jwtauth.jwt_litellm_role_map=None;
  litellm_jwtauth.sync_user_role_and_teams=False; litellm_jwtauth.oidc_userinfo_endpoint=None; litellm_jwtauth.oidc_userinfo_enabled=False;
  litellm_jwtauth.oidc_userinfo_cache_ttl=300; litellm_jwtauth.virtual_key_claim_field=None; litellm_jwtauth.virtual_key_mapping_cache_ttl=300;
  litellm_jwtauth.unregistered_jwt_client_behavior=UnregisteredJWTClientBehavior.FALLBACK_TEAM_MAPPING;
  litellm_jwtauth.routing_overrides=None; litellm_jwtauth.team_claim_fallback=False; litellm_jwtauth.fallback_to_db_teams=False;
  litellm_jwtauth.issuers=None; JWTLiteLLMRoleMap.jwt_role=required; JWTLiteLLMRoleMap.litellm_role=required;
  JWTRoutingOverride.iss=required; JWTRoutingOverride.client_id=None; JWTRoutingOverride.scope=None; JWTRoutingOverride.aud=None;
  JWTRoutingOverride.path='oauth2'; JWTIssuerConfig.issuer=required; JWTIssuerConfig.jwks_url=None; JWTIssuerConfig.audience=None;
  JWTIssuerConfig.disable_audience_validation=False; JWTIssuerConfig.user_id_jwt_field=None; JWTIssuerConfig.user_email_jwt_field=None;
  JWTIssuerConfig.team_id_jwt_field=None; JWTIssuerConfig.team_ids_jwt_field=None; JWTIssuerConfig.org_id_jwt_field=None;
  JWTIssuerConfig.end_user_id_jwt_field=None; JWTIssuerConfig.virtual_key_claim_field=None; JWTIssuerConfig.unregistered_jwt_client_behavior=None.


  Add the pure jwt_settings operation under B856 Management::jwt to construct actual MIT models and
  invoke their accessors. Compare model dumps, exception category, field locations and exact constraint
  text; do not pretend configuration failures have HTTP status/type/param/code. Custom loader execution
  belongs to native ordered-port tests and B054's integration, not a helper that imports arbitrary modules.
  All fields get named field_<field> rstest rows for omitted/default, null, explicit accepted and invalid
  values. Nested records get the same treatment, plus extra-forbidden versus extra-ignored cases.
  loads_all_jwt_fields and env_top_level_resolution call the real B002 loader with the general_settings
  nesting. aliases_presence_precedence and constructor_validation_order exercise the production path;
  invalid_types_reject replaces the fictitious invalid-value fallback. Replay added jwt-settings seeds
  through existing config_yaml and helper_case decoders. No additional parser or database is needed.

  There are 274 nonblank noncomment source lines excluding docstrings. Allow 280 records/validators,
  330 focused tests, 90 adapters and 50 loader/dispatch/corpus wiring lines, 750 within 800.
