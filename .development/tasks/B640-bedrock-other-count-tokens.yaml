deviations: []
out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- 'validate_count_tokens_request L281-L282 (messages must be a list) is unreachable through the real detector: only
  a list can select converse; do not stub the detector to invent an oracle case.'
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_other_count_tokens in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/other_count_tokens.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_other_count_tokens.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- invokeModel.body is base64 of Python json.dumps with comma-space and colon-space separators and ensure_ascii;
  compare decoded JSON or preserve those bytes explicitly.
- A content block with a type key selects invokeModel even when type is null; a role/content validation failure
  is observable only after converse selection.
- setdefault does not replace explicit null max_tokens or anthropic_version, and the sanitizer does not prefix an
  empty name.
budget:
  max_changed_lines: 600
  max_new_expects: 0
review_level: standard
