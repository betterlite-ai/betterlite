  - id: case-typed-block-invoke-model
    why: The typed-block-invoke-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::count_tokens_cases::case_[0-9]+_typed_block_invoke_model$/)'
  - id: case-untyped-messages-converse
