id: B640
title: Bedrock native count-token shapes
description: >-
  Build the Bedrock CountTokens envelope and convert the reply to Anthropic-shaped input_tokens. Detect converse
  only when messages is a list containing no block with a type field; all other input is invokeModel. Reuse BaseAWSLLM
  inputs from B590 and get_bedrock_base_model from B2203; B641 owns signing, execution and any fallback.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/count_tokens/transformation.py:
  _json_dict L23-L24; _json_list L27-L28; _to_converse_content L31-L36; _to_converse_message L39-L44; _sanitized_bedrock_tool_name
  L47-L50; _to_bedrock_tool_spec L53-L62; BedrockCountTokensConfig._detect_input_type L75-L101; BedrockCountTokensConfig.transform_anthropic_to_bedrock_count_tokens
  L103-L141; BedrockCountTokensConfig._transform_to_converse_format L143-L164; BedrockCountTokensConfig._transform_system
  L166-L175; BedrockCountTokensConfig._transform_tools L177-L184; BedrockCountTokensConfig._transform_to_invoke_model_format
  L186-L203; BedrockCountTokensConfig.get_bedrock_count_tokens_endpoint L205-L238; BedrockCountTokensConfig.transform_bedrock_response_to_anthropic
  L240-L258; BedrockCountTokensConfig.validate_count_tokens_request L260-L298.


  Reuse get_bedrock_base_model from B2203 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: untyped_messages_converse: Any messages list without a typed content block selects converse,
  including empty lists and malformed elements; nonlist messages selects invokeModel. tool_name_schema: Replace
  characters outside [A-Za-z0-9_] with _, prefix a nonempty name whose first character is not a letter with t_,
  then cut at 64 characters; empty/nonstring names stay empty. Description falls back to that name and missing input_schema
  becomes {type: object, properties: {}} inside inputSchema.json. count_endpoint_path: B591 strips routing/region
  and bedrock/ prefixes, encodes the model id, and chooses api_base before aws_bedrock_runtime_endpoint before the
  regional runtime; append /model/{encoded_model_id}/count-tokens. count_to_anthropic_result: Map inputTokens to
  input_tokens, defaulting to 0 only when absent, preserving explicit None. invoke_body_defaults: When messages
  is a body key, set missing anthropic_version to bedrock-2023-05-31 and max_tokens to 1024; preserve explicit values
  including None, remove model, and leave prompt-only bodies without these defaults. converse_content_system: String
  content becomes [{text: value}], lists stay unchanged and other content becomes []; missing content defaults to
  empty text. System strings become text blocks; list entries retain text only with an empty-string default and
  skip nondictionaries. count_model_missing: Missing or false model raises ValueError (model parameter is required).
  count_messages_empty: An empty messages list selects converse and raises ValueError (messages parameter is required
  for Converse input). count_message_not_object: A nondictionary message in a converse list raises ValueError naming
  its index and requiring a dictionary. count_message_role_missing: A converse dictionary without role raises ValueError
  naming its index and missing role field. count_message_content_missing: A converse dictionary with role but no
  content raises ValueError naming its index and missing content field. count_invoke_model_only: An invokeModel
  request containing only model raises ValueError (Request must contain content to count tokens). empty_tools_omission:
  False tools omits toolConfig; a truthy nonlist tools value yields toolConfig with an empty tools list.


  Direct shared helper ownership: B2203. Reuse these named lower helpers at the source call sites rather than reproducing
  them.


  Implement crates/betterlite-bedrock/src/count_tokens.rs with adjacent tests under count_tokens/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function count_tokens_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  typed_block_invoke_model, untyped_messages_converse, tool_name_schema, count_endpoint_path, count_to_anthropic_result,
  invoke_body_python_json_spacing, invoke_body_defaults, converse_content_system, count_model_missing, count_messages_empty,
  count_message_not_object, count_message_role_missing, count_message_content_missing, count_invoke_model_only,
  empty_tools_omission. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_count_tokens* using HelperCase:
  kind: helper and the externally tagged bedrock_other_count_tokens variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_count_tokens that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 193 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 225 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 595 planned, 600 maximum changed lines.
