checks:
  optional:
  - mutants
  commands:
  - id: case-rerank-url-api-version
    why: None base raises ValueError Azure AI API Base is required. api_base=None. Set in call or via `AZURE_AI_API_BASE`
      env var.; non-absolute URL raises the absolute-URL diagnostic with repr(base). Trim path trailing slashes;
      keep paths ending /v1/rerank or /v2/rerank, append /rerank for paths ending /v1 or /v2, otherwise B668 appends
      /v1/rerank. Preserve query/fragment; never inject api-version here.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_rerank_url_api_version$/)'
  - id: case-query-documents-top-n
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rerank/query-documents-top-n.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_query_documents_top_n$/)'
  - id: case-model-group-normalization
    why: 'After B037 Cohere response conversion read hidden llm_provider-azureml-model-group: offer-cohere-rerank-mul-paygo
      maps azure_ai/cohere-rerank-v3-multilingual, offer-cohere-rerank-eng-paygo maps azure_ai/cohere-rerank-v3-english,
      unknown strings stay and None stays. Always set hidden model, even None.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_model_group_normalization$/)'
  - id: case-relevance-scores
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rerank/relevance-scores.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_relevance_scores$/)'
  - id: case-return-documents
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rerank/return-documents.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_return_documents$/)'
  - id: case-rerank-error
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-rerank/rerank-error.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_rerank_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_rerank.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_rerank*")"
      && grep -lq 'foundry_rerank' tools/oracle/fuzz/corpus/helper_case/foundry_rerank* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_rerank$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-foundry-rerank-auth
    why: Only None api_key consults AZURE_AI_API_KEY then litellm.azure_key; explicit empty suppresses that fallback
      and enters B549 Entra auth. Construct lowercase accept/content-type=application/json, then merge caller headers
      last, including caller Authorization. Auth resolution runs before caller override and can still fail.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_foundry_rerank_auth$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_rerank_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_rerank_secret_safe_failure$/)'
