id: B556
title: Foundry rerank requests
description: >-
  Add typed FoundryRerankRequest/Reply for query, document list, top_n, return_documents and relevance scores. Preserve
  Foundry provider endpoint paths, native auth policy and model/usage normalization. Exact-decimal scores use the
  existing wire decimal parser; B085 supplies the public rerank API.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/rerank/transformation.py:
  AzureAIRerankConfig.get_complete_url L24-L61; AzureAIRerankConfig.validate_environment L63-L85; AzureAIRerankConfig.transform_rerank_response
  L87-L110; AzureAIRerankConfig._get_base_model L112-L119.


  Reuse get_azure_ai_auth_headers from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: rerank_url_api_version: None base raises ValueError Azure AI API Base is required. api_base=None.
  Set in call or via `AZURE_AI_API_BASE` env var.; non-absolute URL raises the absolute-URL diagnostic with repr(base).
  Trim path trailing slashes; keep paths ending /v1/rerank or /v2/rerank, append /rerank for paths ending /v1 or
  /v2, otherwise B668 appends /v1/rerank. Preserve query/fragment; never inject api-version here. model_group_normalization:
  After B037 Cohere response conversion read hidden llm_provider-azureml-model-group: offer-cohere-rerank-mul-paygo
  maps azure_ai/cohere-rerank-v3-multilingual, offer-cohere-rerank-eng-paygo maps azure_ai/cohere-rerank-v3-english,
  unknown strings stay and None stays. Always set hidden model, even None. foundry_rerank_auth: Only None api_key
  consults AZURE_AI_API_KEY then litellm.azure_key; explicit empty suppresses that fallback and enters B549 Entra
  auth. Construct lowercase accept/content-type=application/json, then merge caller headers last, including caller
  Authorization. Auth resolution runs before caller override and can still fail.


  Write standalone Rust test foundry_rerank_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test foundry_rerank_secret_safe_failure in betterlite-foundry: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-foundry/src/rerank.rs with adjacent tests under rerank/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation foundry_rerank in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function rerank_cases in betterlite-foundry with these exact named cases (one per oracle file): rerank_url_api_version,
  query_documents_top_n, model_group_normalization, relevance_scores, return_documents, rerank_error, foundry_rerank_auth.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_rerank* using HelperCase: kind: helper
  and the externally tagged foundry_rerank variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_foundry_rerank that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 80 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 100 production lines, 160 behavior/config-test lines, 90 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 375 planned, 400 maximum changed lines.
