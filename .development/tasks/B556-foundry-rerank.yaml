out_of_scope:
- B026 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_rerank in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/rerank.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_rerank.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A caller Authorization header does not bypass credential resolution, which runs before header merging.
- The inferred base model is written to hidden model, not the public response model field.
