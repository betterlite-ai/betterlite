    why: ROUTE_ENDPOINT_MAPPING for the eleven eval route types, including the /cancel suffix on acancel_run.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L151-L159
    why: ProxyModelNotFoundError and its detail text.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L38-L73
    why: _route_user_config_request and _raise_if_model_fully_blocked with its 403 "Model is blocked".
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L493-L544
    why: The branches before the router branch (api_key or api_base, user_config, router_settings_override) and the settings the override copies.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L545-L582
    why: The eval branch, its credential lookup by id then by group, data.update and the swallowed lookup error.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L717-L725
    why: No router and no user_model ends in ProxyModelNotFoundError named by the endpoint mapping.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L10286-L10322
    why: get_deployment_credentials and get_deployment_by_model_group_name, the two reads behind EvalDeployments.
dod:
  - text: prepare follows LiteLLM's order for the eleven eval route types, merging the named deployment's credentials over the caller's values.
    proof: [eval-call-route-tests]
  - text: Blocked, not-found and missing-router-method outcomes carry LiteLLM's status and text, the not-found text naming the endpoint mapping's path.
    proof: [eval-call-route-tests]
  - text: The router adapter reads credentials by id and by group, honors blocked deployments, and eval_call_route builds the value with and without a model_list.
    proof: [eval-deployments-tests]
checks:
  optional: []
  commands:
    - id: eval-call-route-tests
      why: a step is missing or out of order, the merge keeps a caller value, or an error carries the wrong text or status
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_call_route::/)'
    - id: eval-deployments-tests
      why: the adapter reads the wrong deployment, ignores the blocked flag, or eval_call_route builds the wrong value
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::eval_deployments::/)'
oracle_cases: []
deviations:
  - what: A request whose data carries `user_config` fails with the 500 "'Router' object has no attribute '<route type>'" without building a router from that config, so a user_config the Router constructor would reject still gets this error instead of the constructor's.
    why: LiteLLM builds a throwaway Router per request and then calls an eval method the Router doesn't have; betterlite has no per-request router, and the outcome a valid config gets is the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L38-L50
out_of_scope:
  - "The rest of _route_request_single_attempt that every route type runs (the required-param check, the shared aiohttp session, the mock-testing param gate, enable_tag_filtering removal) and the model registry read-through retry around it: B004 and B014, as B7430 records; the read-through itself is B8231."
  - "The eleven SDK operations prepare feeds: B3421 to B3425. The routes that call prepare: B3426, B3427, B3428 and B096."
  - "get_deployment_credentials and _is_deployment_blocked: B2306. The model-name index: B844. The shared router handles and RouteViews: B8611. BlockedModels: B8692."
pitfalls:
  - "LiteLLM's comment says the merge doesn't override user-provided values, but the code is `data.update(deployment_creds)`, so the deployment's api_base, api_key and model replace the caller's."
  - "The group lookup returns the deployment's whole litellm_params (model, custom_llm_provider and every non-null setting), while the id lookup returns only the CredentialLiteLLMParams fields; the two shapes differ on purpose."
  - "acancel_run's endpoint text is \"/evals/{eval_id}/runs/{run_id}/cancel\" although the proxy route has no /cancel suffix; the not-found message must keep the mapping's text."
  - "With a router, an eval request that sends api_key or api_base in its body fails with 500, because LiteLLM calls the eval method on the Router object, which has none."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
