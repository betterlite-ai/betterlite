id: B10206
title: The sync places that read secrets get async seams before the secret lookup turns async
description: >-
  B10205 makes `SecretLookup::get_secret` async (crates/betterlite-secret-managers/src/secret_lookup.rs L38-L91). The workspace denies clippy's pedantic group (Cargo.toml L121), so a function can only turn async once it awaits something, and every function on a sync path to the lookup has to change in the same commit. Seven of those paths end in code that cannot just gain an `async`: sync trait methods, a std Mutex held around the read, a blocking call inside the chain, or the logger catalog. This task gives each one its async seam while the lookup is still sync, so B10205 only adds `.await` and the async keyword along the chains. Nothing here changes what a caller gets back.


  The provider contracts. `ResponsesProviderConfig::validate_environment` and `complete_url` (crates/betterlite-provider/src/api/responses_provider_contract/config.rs L64 and L73, a trait that is already `#[async_trait]`) become async. `BaseConfig::get_complete_url` (api/file_contracts/base.rs L5) and BaseFilesConfig's `transform_create_file_request`, `transform_retrieve_file_request`, `transform_delete_file_request`, `transform_list_files_request` and `transform_file_content_request` (api/file_contracts/config.rs L96, L113, L128, L142, L166) become async through `#[async_trait]` on both traits. The only implementors in crates are ManusFilesConfig (manus_files.rs L83 and L201) and ManusResponsesConfig (manus_responses.rs L109), whose bodies keep calling their sync helpers for now; the oracle's minimal_config.rs and responses_provider_contract/fixtures.rs implement them too. Every caller awaits. The three `ChatCompletionHandler` traits (agent_platform_dispatch/handler.rs L9, data_cloud_dispatch/handler.rs L6, ragflow_chat/dispatch/handler.rs L6) gain `Send + Sync`, so a dispatch future that holds `&dyn ChatCompletionHandler` across an await stays Send.


  SageMaker. `sagemaker::complete` (enterprise_ml_dispatch/sagemaker.rs L91-L115) drives `completion_call::completion_stream` and `completion` with `block_in_place` and `Handle::current().block_on` (L106-L112). It becomes an async fn that awaits them, and `sagemaker_completion` (enterprise_ml_dispatch/chat.rs L100) and enterprise_ml's `chat::dispatch` (chat.rs L32) turn async with it. block_in_place panics on a current-thread runtime and blocks a worker once its caller is async.


  The PTU flag. `PtuAttribution::enabled` (crates/betterlite-server/src/jobs/ptu/attribution.rs L15-L17) becomes `#[async_trait] async fn enabled(&self) -> bool`, since LiteLLM reads the flag through get_secret_bool on every call (ptu_pricing.py L26). Its users await it: jobs/ptu/task.rs L45 and L61 (`registration` turns async), model_ptu_pricing/zeroed.rs, model_ptu_pricing/delta.rs, model_effective_fields/ptu.rs and ui_settings_state/derived.rs (`PtuCostFlag: PtuAttribution`), and the oracle's two impls (model_ptu_pricing/answers.rs L32, model_effective_fields/support.rs L15).


  The Foundry agent token. `get_azure_ai_agent_entra_token` (crates/betterlite-foundry/src/credentials/agent.rs L132-L144) reads seven config secrets in `AgentSecrets::resolve` (L36-L50) and then calls the sync token providers in `request.sources`. Split it: `AgentSecrets::resolve` becomes the pub step that reads secrets (B10205 makes it async), and `get_azure_ai_agent_entra_token` and `resolve_agent_auth_header` (L147) take the resolved `AgentSecrets` and stay sync, for the async caller to run off the runtime as the comment at L146 says. The oracle's credentials/steps.rs L89-L91 calls the two steps in order.


  The sandbox registry. `SandboxToolRegistry::register` (crates/betterlite-provider/src/sandbox_dispatch/registry.rs L36-L79) resolves api_key and api_base through `resolve_value` (L81-L96), and Python's `register_tools` (crates/betterlite-python/src/decision_calls/core/sandbox.rs L14-L26) calls it while it holds the registry's std Mutex (L22-L24). Split it into two steps: `resolve_tool_entries(entries, lookup, environment)` reads the secrets and answers the resolved tools, and the caller runs a sync `install(resolved)` under the lock, so B10205's await never sits inside the guard (clippy's await_holding_lock). The oracle's core_ops/b3519.rs L66 calls both.


  PointFive. `PointFiveLogger::new` (crates/betterlite-logging/src/finops/pointfive/logger.rs L48-L55) refuses to start without a key by building an upload client, as LiteLLM's logger does at init (pointfive/logger.py L57-L80), and it runs inside the logger catalog's sync build (registry/catalog/pointfive.rs L14-L44). `LoggerResolver::resolve` (registry/catalog.rs L278-L286) reaches that build at request time too. `UploadClientSource::upload_client` (finops/pointfive/logger/client.rs L25 and L126-L145) and `PointFiveCore::upload_client` (logger/core.rs L49) become async; their callers in logger.rs, logger/send.rs and logger/flush.rs are async already. The startup check follows AgentOps (registry/catalog/agentops.rs L25-L35 and L67-L84, catalog.rs L171): a new `pub async fn connect_pointfive(inputs: &CatalogInputs) -> Result<PointFiveStartup, CatalogError>` builds the upload client once for a pointfive listed in litellm_settings (catalog.rs L108 `listed_in_settings`) and answers the init error LiteLLM raises when the key is missing, and `LoggerCatalog::with_pointfive(startup)` wraps the build so the arm hands the startup client to `PointFiveLogger::new`. A pointfive that only a key or team callback names builds without the startup check, and its first flush logs the missing key. docs/deviations/B10206.yaml records that difference with the pointfive link.


  Tests. Existing tests of the changed functions turn into `#[tokio::test]`. enterprise_ml_dispatch/tests/chat.rs gains `sagemaker_completes_on_a_current_thread_runtime`, a plain `#[tokio::test]` (current-thread) over the existing SageMaker fixture that panics in block_in_place on main. registry/catalog/pointfive/tests.rs gains `a_listed_pointfive_without_a_key_refuses_at_startup` (connect_pointfive answers the init error and the catalog builds no logger) and `a_pointfive_named_only_by_a_key_builds_without_the_startup_check`. sandbox_dispatch/registry/tests.rs gains `resolved_tools_install_as_registered`: resolve then install gives the registry the old `register` gave for the existing cases.
