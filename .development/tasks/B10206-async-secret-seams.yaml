dod:
  - text: The Manus file and responses contracts, the PTU attribution port and UploadClientSource are async, and the three ChatCompletionHandler traits are Send + Sync.
    proof: [seams, provider-tests, server-tests, logging-tests]
  - text: SageMaker awaits its completion futures and runs on a current-thread runtime.
    proof: [seams, provider-tests]
  - text: The sandbox registry resolves outside the Python lock, the Foundry agent token reads its secrets in a separate step, and the oracle helpers answer as before.
    proof: [seams, provider-tests, foundry-python-tests, oracle-cases]
  - text: A listed pointfive is checked at startup through connect_pointfive, and the deviation row says what a key-only pointfive does.
    proof: [seams, logging-tests]
checks:
  optional: [mutants]
  commands:
    - id: seams
      why: a seam is still sync, SageMaker still blocks in place, or the registry still resolves under the lock
      run: |-
        grep -q 'async fn enabled' crates/betterlite-server/src/jobs/ptu/attribution.rs &&
        grep -q 'async fn validate_environment' crates/betterlite-provider/src/api/responses_provider_contract/config.rs &&
        grep -q 'async fn transform_create_file_request' crates/betterlite-provider/src/api/file_contracts/config.rs &&
        grep -q 'async fn get_complete_url' crates/betterlite-provider/src/api/file_contracts/base.rs &&
        grep -q 'pub async fn complete' crates/betterlite-provider/src/enterprise_ml_dispatch/sagemaker.rs &&
        test -z "$(grep -n 'block_in_place' crates/betterlite-provider/src/enterprise_ml_dispatch/sagemaker.rs)" &&
        grep -q 'fn resolve_tool_entries' crates/betterlite-provider/src/sandbox_dispatch/registry.rs &&
        grep -q 'pub async fn connect_pointfive' crates/betterlite-logging/src/registry/catalog/pointfive.rs &&
        grep -q 'fn with_pointfive' crates/betterlite-logging/src/registry/catalog.rs
    - id: provider-tests
      why: a Manus contract, SageMaker, an agent platform or the sandbox registry answers differently after its seam turned async
      run: grep -q 'fn sagemaker_completes_on_a_current_thread_runtime' crates/betterlite-provider/src/enterprise_ml_dispatch/tests/chat.rs && grep -q 'fn resolved_tools_install_as_registered' crates/betterlite-provider/src/sandbox_dispatch/registry/tests.rs && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^manus_files::/) | test(/^manus_responses::/) | test(/^enterprise_ml_dispatch::/) | test(/^agent_platform_dispatch::/) | test(/^data_cloud_dispatch::/) | test(/^ragflow_chat::/) | test(/^sandbox_dispatch::/) | test(/^api::file_contracts::/) | test(/^api::responses_provider_contract::/)'
    - id: server-tests
      why: PTU attribution, pricing or effective fields changed once the flag became async
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^jobs::ptu::/) | test(/^model_ptu_pricing::/) | test(/^model_effective_fields::/) | test(/^ui_settings_state::/)'
    - id: logging-tests
      why: PointFive refuses or builds differently at startup, or its flushes lost the upload client
      run: grep -q 'fn a_listed_pointfive_without_a_key_refuses_at_startup' crates/betterlite-logging/src/registry/catalog/pointfive/tests.rs && grep -q 'fn a_pointfive_named_only_by_a_key_builds_without_the_startup_check' crates/betterlite-logging/src/registry/catalog/pointfive/tests.rs && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^finops::pointfive::/) | test(/^registry::catalog::/)'
    - id: foundry-python-tests
      why: the agent token or the sandbox registration answers differently after the split
      run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/^credentials::/)' && cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^decision_calls::/)'
    - id: oracle-cases
      why: a helper whose seam turned async no longer answers as LiteLLM does
      run: cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-provider,betterlite-oracle-groups/betterlite-oracle-core-ops,betterlite-oracle-groups/betterlite-oracle-models,betterlite-oracle-groups/betterlite-oracle-server -- tools/oracle/cases/helpers/manus-responses tools/oracle/cases/helpers/manus-files tools/oracle/cases/providers/enterprise-ml tools/oracle/cases/sandbox tools/oracle/cases/helpers/model-ptu-pricing tools/oracle/cases/helpers/model-effective-fields
oracle_cases: []
deviations:
  - what: A pointfive that only a key or team callback names, never litellm_settings, builds without the missing-key check, and its first flush logs the missing key; LiteLLM refuses to build that logger.
    why: The logger catalog resolves names synchronously and the key read is async once B10205 lands, so the check runs in the startup step, as AgentOps' token fetch does (B10008).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/pointfive/logger.py#L57-L80
out_of_scope:
  - "Making SecretLookup::get_secret, the dispatch protocols and the OIDC ports async, and adding .await along the chains: B10205."
  - "An async logger catalog, so a key-only pointfive or agentops builds with LiteLLM's checks: the catalog resolver stays sync."
  - "Running connect_pointfive and connect_agentops at server startup: the lifespan wiring (B8613)."
pitfalls:
  - "clippy's unused_async fires on a plain async fn with no await, so only trait methods (through #[async_trait]) and functions that already await turn async here; the helper chains below the seams stay sync until B10205."
  - "Don't hold the registry's std Mutex guard across an await, and don't build a runtime or call block_on in production code; the oracle helpers drive async calls with a current-thread runtime as the oracle does elsewhere."
  - "The oracle's sdk_http/file_http_content/support.rs implements core's sync FileContentConfig and calls ManusFilesConfig inside it: resolve the Manus values before the core call instead of starting a runtime inside a runtime."
  - "B8610 and B8613 own the server startup: connect_pointfive is built and tested here, not called from the server."
review_level: standard
budget:
  max_changed_lines: 650
  max_new_expects: 0
