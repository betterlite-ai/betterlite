budget:
  max_changed_lines: 675
  max_new_expects: 0
checks:
  commands:
  - id: helper-python
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/request_records.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
    why: The operation adapter is absent, unchanged or fails strict Python checks.
  - id: helper-case-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/request_records*")"
      && grep -lq 'request_records' tools/oracle/fuzz/corpus/helper_case/request_records* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_request_records$/)' && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
  - id: case-safe-copy-mode-and-fallback
    why: litellm_settings.safe_memory_mode defaultsfalse; only literal True returns original record unchanged with
      no span rewriting. Otherwise deepcopy each top-level value independently, preserving original reference for
      a value whose copy fails; non-dict copies once with whole-object fallback. Native serializable fields clone,
      opaque typed handles preserve identity; Python fixtures provide real uncopyable objects to the pinned helper,
      not a copied algorithm.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::request_records_cases::case_[0-9]+_safe_copy_mode_and_fallback$/)'
  - id: case-safe-copy-span-order
    why: For dict input, metadata then litellm_metadata containing litellm_parent_otel_span each pop the span and
      write literal placeholder before copying. One saved variable is overwritten by the later bucket. If saved
      span is non-None, restore that last span to every original bucket that has the key; copied output retains
      placeholder. If saved spanNone, original placeholders remain too. Invalid nonmapping metadata preserves source
      membership/mutation failure. Do not turn this into independent_snapshot, which has different alias/restoration
      semantics.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::request_records_cases::case_[0-9]+_safe_copy_span_order$/)'
  - id: case-independent-snapshot
    why: Always attempt per-key deepcopy even when safe_memory_mode true. Sanitize only dict metadata/litellm_metadata
      by replacing span with placeholder without mutating originals; each copied metadata restores its own original
      span identity. Failed top-level copy uses original value for that key. No whole-map alias and no cross-bucket
      span overwrite.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::request_records_cases::case_[0-9]+_independent_snapshot$/)'
  - id: case-parameter-filter-null-and-depth
    why: filter_exceptions_from_params defaults max_depth20; <=0 returns the input unchanged before inspecting its
      kind. Otherwise omit Exception instances, callable instances except class objects, and objects whose exact
      type name is Logging,LiteLLMLoggingObj,Router. Traverse dict/list values in order with depth-1, dropping items
      whose filtered result isNone (including ordinary JSON null) and values that raise during filtering. Direct
      exception/callable children are skipped before depth recursion, even at cutoff; preserve class objects and
      other scalars/typed handles. No tuple traversal. Implement iteration with the same depth semantics.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::request_records_cases::case_[0-9]+_parameter_filter_null_and_depth$/)'
  - id: case-internal-parameter-names
    why: filter_internal_params returns non-dict unchanged; dict produces a new map excluding exact skip_mcp_handler,mcp_handler_context,_skip_mcp_handler
      plus truthy additional_internal_params set. Preserve other underscore keys, nested copies/values and None;
      no recursive key filtering or warning.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::request_records_cases::case_[0-9]+_internal_parameter_names$/)'
  - id: case-gateway-injection-bucket
    why: added<=0 returns without changes. Choose first dict bucket from litellm_metadata then metadata, including
      empty dict; if none, return without creating one. If bucket.litellm_gateway_injected_cache equals empty string
      sentinel, preserve it. injected_for_every_deployment truthy sets marker empty string; otherwise model_info
      dict supplies id with defaultempty string, retaining explicitNone/false/zero, and nondict model_info usesempty
      string. Per-deployment marks overwrite earlier deployment marks, but never narrow the every-deployment sentinel.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::request_records_cases::case_[0-9]+_gateway_injection_bucket$/)'
  - id: case-gateway-injection-attempt-scope
    why: 'Exercise retries/fallbacks sharing metadata: adding a breakpoint for deploymentA credits onlyA, laterB
      placement overwritesA, zero/negative reentry preserves previous marker; an earlier every-deployment marker
      remains universal. Calling with no metadata bucket must not create metadata and collide with an explicit Responses
      metadata argument. This helper records identity, not a count or a permission flag.'
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::request_records_cases::case_[0-9]+_gateway_injection_attempt_scope$/)'
  - id: config-safe-memory-mode
    why: safe_memory_mode lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::request_records_config_cases::case_[0-9]+_loads_safe_memory_mode$/)'
  optional:
  - mutants
description: >-
  Implement RequestRecordProjection and GatewayCacheAttribution in betterlite-context below provider assembly, hook
  and core callers. Preserve JSON null filtering, internal-key removal, copy/alias behavior and attempt-scoped attribution.
  Python runtime object construction remains B166; typed internal handles carry a closed kind and identity without
  accepting arbitrary Python objects or allowing HTTP callers to forge internal kinds.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/litellm_core_utils/core_helpers.py:
  safe_deep_copy L514-L563; independent_snapshot L566-L617; filter_exceptions_from_params L620-L680; filter_internal_params
  L683-L712. litellm/integrations/anthropic_cache_control_hook.py: AnthropicCacheControlHook.record_gateway_injection
  L864-L936.


  Named case contracts: safe_copy_mode_and_fallback: litellm_settings.safe_memory_mode defaultsfalse; only literal
  True returns original record unchanged with no span rewriting. Otherwise deepcopy each top-level value independently,
  preserving original reference for a value whose copy fails; non-dict copies once with whole-object fallback. Native
  serializable fields clone, opaque typed handles preserve identity; Python fixtures provide real uncopyable objects
  to the pinned helper, not a copied algorithm. safe_copy_span_order: For dict input, metadata then litellm_metadata
  containing litellm_parent_otel_span each pop the span and write literal placeholder before copying. One saved
  variable is overwritten by the later bucket. If saved span is non-None, restore that last span to every original
  bucket that has the key; copied output retains placeholder. If saved spanNone, original placeholders remain too.
  Invalid nonmapping metadata preserves source membership/mutation failure. Do not turn this into independent_snapshot,
  which has different alias/restoration semantics. independent_snapshot: Always attempt per-key deepcopy even when
  safe_memory_mode true. Sanitize only dict metadata/litellm_metadata by replacing span with placeholder without
  mutating originals; each copied metadata restores its own original span identity. Failed top-level copy uses original
  value for that key. No whole-map alias and no cross-bucket span overwrite. parameter_filter_null_and_depth: filter_exceptions_from_params
  defaults max_depth20; <=0 returns the input unchanged before inspecting its kind. Otherwise omit Exception instances,
  callable instances except class objects, and objects whose exact type name is Logging,LiteLLMLoggingObj,Router.
  Traverse dict/list values in order with depth-1, dropping items whose filtered result isNone (including ordinary
  JSON null) and values that raise during filtering. Direct exception/callable children are skipped before depth
  recursion, even at cutoff; preserve class objects and other scalars/typed handles. No tuple traversal. Implement
  iteration with the same depth semantics. internal_parameter_names: filter_internal_params returns non-dict unchanged;
  dict produces a new map excluding exact skip_mcp_handler,mcp_handler_context,_skip_mcp_handler plus truthy additional_internal_params
  set. Preserve other underscore keys, nested copies/values and None; no recursive key filtering or warning. gateway_injection_bucket:
  added<=0 returns without changes. Choose first dict bucket from litellm_metadata then metadata, including empty
  dict; if none, return without creating one. If bucket.litellm_gateway_injected_cache equals empty string sentinel,
  preserve it. injected_for_every_deployment truthy sets marker empty string; otherwise model_info dict supplies
  id with defaultempty string, retaining explicitNone/false/zero, and nondict model_info usesempty string. Per-deployment
  marks overwrite earlier deployment marks, but never narrow the every-deployment sentinel. gateway_injection_attempt_scope:
  Exercise retries/fallbacks sharing metadata: adding a breakpoint for deploymentA credits onlyA, laterB placement
  overwritesA, zero/negative reentry preserves previous marker; an earlier every-deployment marker remains universal.
  Calling with no metadata bucket must not create metadata and collide with an explicit Responses metadata argument.
  This helper records identity, not a count or a permission flag.


  Load safe_memory_mode through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest request_records_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Implement crates/betterlite-context/src/request_records.rs with adjacent tests under request_records/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function request_records_cases in betterlite-context with these exact named cases (one per oracle
  file): safe_copy_mode_and_fallback, safe_copy_span_order, independent_snapshot, parameter_filter_null_and_depth,
  internal_parameter_names, gateway_injection_bucket, gateway_injection_attempt_scope. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/request_records* using HelperCase: kind: helper
  and the externally tagged request_records variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_request_records that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 225 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 240 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 655 planned, 675 maximum changed lines.
