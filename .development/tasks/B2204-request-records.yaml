pitfalls:
- 'The oracle helper for this task is pre-registered as request_records in the context group. Replace the stub Op in tools/oracle/src/helpers/context/request_records.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/request_records.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Filtering drops ordinary JSON null values as well as nonserializable objects; replacing it with a no-op typed
  clone changes provider bodies.
- safe_deep_copy and independent_snapshot restore span identities differently when both metadata buckets exist.
