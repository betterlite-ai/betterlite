pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_s3_access in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_s3_access.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_s3_access.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Bucket selection happens before the ValueError-to-BedrockError catch, so missing configuration is not the same
  400 path as a rejected file ID.
- The plain CommonBatchFilesUtils S3 parser accepts empty bucket/key components and must not substitute for authorization.
