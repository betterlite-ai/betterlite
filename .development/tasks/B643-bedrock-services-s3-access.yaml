    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_access_cases::case_[0-9]+_legacy_id_opt_in$/)'
  - id: case-request-credentials-rejected
    why: Request-supplied s3_bucket_name,s3_output_bucket_name and a plain dict pretending to be _litellm_internal_model_credentials
      do not authorize a bucket; ignore them and use trusted snapshot/environment. A malformed genuinely trusted
      snapshot preserves Pydantic validation errors. _frozen_mapping constructs an immutable shallow MappingProxyType
      over a fresh dict of input pairs, with the last duplicate key winning; nested values are not recursively frozen.
      Native fixtures distinguish a trusted snapshot from a JSON mapping.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_access_cases::case_[0-9]+_request_credentials_rejected$/)'
  - id: case-kms-owner-precedence
    why: resolve_s3_encryption_key_id and resolve_s3_bucket_owner call _resolve_s3_setting with s3_encryption_key_id/AWS_S3_ENCRYPTION_KEY_ID
      or s3_bucket_owner/AWS_S3_BUCKET_OWNER. Choose the first nonempty string from litellm_params then optional_params,
      otherwise B129 get_secret_str(env), then None. Ignore explicit nonstrings and empty strings, retain whitespace
      strings, and do not trim or validate KMS/account syntax. These two settings may come from request optional_params,
      unlike trusted bucket authorization.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_access_cases::case_[0-9]+_kms_owner_precedence$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_s3_access.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
