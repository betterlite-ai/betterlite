    why: CommonBatchFilesUtils construction creates B590 BaseAWSLLM. Its model helper removes one exact leading
      bedrock/ and otherwise preserves the model. _strip_llm_routing_prefix calls B174 get_llm_provider(model,custom_llm_provider=None)
