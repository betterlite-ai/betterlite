id: B643
title: Bedrock managed S3 object authorization
description: >-
  Implement Bedrock native S3 file-ID extraction, trusted bucket selection, shared object authorization and batch
  model-name helpers. Keep native S3 storage operations distinct from the absent enterprise managed-files hook.
  B2208 owns common URI/path validation and the trusted legacy flag; this task adds Bedrock wrappers, exact error
  propagation and configuration selection. Call the shared B174 resolver from its lower-level implementation rather
  than copying its algorithm or hiding the dependency behind an injected provider callback.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  _frozen_mapping L87-L88; _invoke_route_model L95-L96; _strip_llm_routing_prefix L99-L108; extract_s3_uri_from_file_id
  L166-L186; _trusted_s3_model_credentials L192-L198; get_configured_s3_bucket_name L201-L212; get_configured_s3_bucket_names
  L215-L230; _validate_file_id_against_configured_buckets L233-L250; _rejected_file_id L256-L266; _resolve_managed_s3_object
  L269-L279. litellm/llms/bedrock/common_utils.py: resolve_s3_encryption_key_id L1786-L1796; resolve_s3_bucket_owner
  L1799-L1809; _resolve_s3_setting L1812-L1822; CommonBatchFilesUtils.__init__ L1831-L1835; CommonBatchFilesUtils.get_bedrock_model_id_from_litellm_model
  L1837-L1849; CommonBatchFilesUtils.parse_s3_uri L1851-L1871. litellm/llms/bedrock/files/handler.py: BedrockFilesHandler.__init__
  L30-L34.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Named case contracts: managed_file_id_decode: decode_managed_file_id adds = padding to a multiple of4, decodes
  URL-safe base64 with the source permissive decoder and decodes UTF-8. If decoded text starts litellm_proxy and
  contains llm_output_file_id,, return the substring after its first occurrence up to the next such marker or semicolon.
  It need not be an S3 URI at this extraction stage. Swallow every decoding error, then accept the original string
  only when it starts exact s3://; otherwise ValueError file_id must be a managed LiteLLM S3 file id. Raw percent-encoded
  schemes are not accepted by this wrapper even though the lower URI validator decodes once. configured_input_output_buckets:
  _trusted_s3_model_credentials reads only a MappingProxyType under _litellm_internal_model_credentials; otherwise
  return default s3_bucket_name=None,s3_output_bucket_name=None. Copy and validate the trusted snapshot as an extra-ignore
  Pydantic record with optional string fields. Single-bucket lookup uses truthy trusted s3_bucket_name then os.getenv
  AWS_S3_BUCKET_NAME. Multi-bucket lookup independently selects input and output from trusted values then AWS_S3_BUCKET_NAME/AWS_S3_OUTPUT_BUCKET_NAME,
  removes falsey values and deduplicates in input-before-output order. A missing single bucket or empty tuple raises
  ValueError S3 bucket_name is required. Set 's3_bucket_name' in proxy config or AWS_S3_BUCKET_NAME for Bedrock
  file content retrieval. An output-only configuration is sufficient for the multi-bucket method, but not the single-bucket
  method. configured_prefix_boundary: Delegate B2208 validate_managed_cloud_file_id with scheme=s3:// and ordered
  allowed prefixes litellm-bedrock-files-,litellm-bedrock-files/,litellm-batch-outputs/. _validate_file_id_against_configured_buckets
  tries all but the last configured bucket while suppressing only ValueError, then returns or raises the last result.
  Preserve B2208 configured-prefix boundary and one-pass decoding cases. This helper is called with a nonempty tuple
  from bucket selection; do not fabricate an empty-tuple proxy case. foreign_bucket_rejected: _resolve_managed_s3_object
  resolves configured buckets and B2208 legacy policy before entering its try. Only extraction/authorization ValueError
  inside the try becomes B682 BedrockError status400 with the original message and a synthetic HTTP400 response
  whose text matches and request is GET https://litellm.ai. Missing configuration and trusted-snapshot validation
  errors occur before the catch and remain their original errors. If several buckets reject, expose the last bucket's
  error, not the first. legacy_id_opt_in: Reuse B2208 trusted legacy-policy cases: default False, true bool or case-insensitive
  trimmed strings 1,true,yes,on opt in; numeric1 and untrusted request values do not. Legacy mode relaxes managed-name
  prefix only, retaining configured-bucket/prefix and path validation. B2208 owns the loader and corpus; do not
  define another flag or environment variable. request_credentials_rejected: Request-supplied s3_bucket_name,s3_output_bucket_name
  and a plain dict pretending to be _litellm_internal_model_credentials do not authorize a bucket; ignore them and
  use trusted snapshot/environment. A malformed genuinely trusted snapshot preserves Pydantic validation errors.
  _frozen_mapping constructs an immutable shallow MappingProxyType over a fresh dict of input pairs, with the last
  duplicate key winning; nested values are not recursively frozen. Native fixtures distinguish a trusted snapshot
  from a JSON mapping. kms_owner_precedence: resolve_s3_encryption_key_id and resolve_s3_bucket_owner call _resolve_s3_setting
  with s3_encryption_key_id/AWS_S3_ENCRYPTION_KEY_ID or s3_bucket_owner/AWS_S3_BUCKET_OWNER. Choose the first nonempty
  string from litellm_params then optional_params, otherwise B129 get_secret_str(env), then None. Ignore explicit
  nonstrings and empty strings, retain whitespace strings, and do not trim or validate KMS/account syntax. These
  two settings may come from request optional_params, unlike trusted bucket authorization. s3_model_helpers: CommonBatchFilesUtils
  construction creates B590 BaseAWSLLM. Its model helper removes one exact leading bedrock/ and otherwise preserves
  the model. _strip_llm_routing_prefix calls B174 get_llm_provider(model,custom_llm_provider=None) and returns the
  selected model; on any exception log at exception level litellm.llms.bedrock.files.transformation.py::_strip_llm_routing_prefix()
  - Error inferring custom_llm_provider - %s and return the original model. _invoke_route_model then removes one
  leading invoke/ from that result and prepends invoke/. Preserve resolver errors as this logged fallback, not as
  a new rejection. plain_s3_uri_parser: CommonBatchFilesUtils.parse_s3_uri is deliberately simpler than authorization:
  require exact s3:// and at least one slash afterward, else ValueError Invalid S3 URI format: {s3_uri}. Split only
  the first slash and return bucket,key without percent decoding or validation; empty bucket/key and traversal are
  accepted here and must not acquire authorization merely by parsing. BedrockFilesHandler._parse_s3_uri instead
  delegates B2208 full authorization with the three managed prefixes and its explicit legacy argument default False.
  files_handler_initialization: BedrockFilesHandler calls B590 base initialization and gets the B173 async client
  for LlmProviders.BEDROCK. Its extraction and single-bucket methods delegate to this task's shared functions with
  identical errors; no extra lookup or request is made during construction.


  Load s3_bucket_name, s3_output_bucket_name, s3_encryption_key_id, s3_bucket_owner through betterlite-config, with
  injected environment lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and
  global inputs use litellm_settings. Add config rstest bedrock_services_s3_access_config_cases; each named loads_<key>
  case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml parser seeds. Reject
  unrelated keys.


  All four environment variables and their four deployment settings default None. The real B002 loader cases for
  deployment bucket names feed the immutable B1021 credential snapshot; request fields do not. Environment bucket
  lookups use os.getenv semantics, whereas KMS/owner lookups use B129 secret resolution. Reuse B2208 allow_legacy_cloud_file_ids
  configuration. Separate S3 static credentials belong to B644, not this authorization task.


  Implement crates/betterlite-bedrock/src/s3_access.rs with adjacent tests under s3_access/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function s3_access_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  managed_file_id_decode, configured_input_output_buckets, configured_prefix_boundary, foreign_bucket_rejected,
  legacy_id_opt_in, request_credentials_rejected, kms_owner_precedence, s3_model_helpers, plain_s3_uri_parser, files_handler_initialization.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_access* using HelperCase:
  kind: helper and the externally tagged bedrock_services_s3_access variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_s3_access that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  Outside-byte boundary: decode_managed_file_id consumes caller-provided base64 encoded managed file identifiers
  in crates/betterlite-bedrock/src/s3_access.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_s3_access.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_s3_access.
  The adjacent test replays_the_bedrock_services_s3_access_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/s3_access.rs
  and its loader wiring: AWS_S3_BUCKET_NAME, AWS_S3_OUTPUT_BUCKET_NAME, AWS_S3_ENCRYPTION_KEY_ID, AWS_S3_BUCKET_OWNER.
  Module-level settings enter litellm_settings; deployment settings enter litellm_params; environment lookup is
  injected. Keep the defaults and precedence specified above and in the linked branches; existing key owners remain
  unchanged. Write config rstest bedrock_services_s3_access_config_cases with named cases loads_aws_s3_bucket_name,
  loads_aws_s3_output_bucket_name, loads_aws_s3_encryption_key_id, loads_aws_s3_bucket_owner, plus rejects_unrelated_key.
  Each loads case calls the real config loader with that key and asserts the resolved value, default, precedence
  and secret redaction where applicable. Seed B002 config_yaml with new bedrock_services_s3_access* files for every
  key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_s3_access_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_services_s3_access_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 169 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 265 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 75 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 745 planned, 750 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/s3_access.rs
  - crates/betterlite-bedrock/src/s3_access/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/services_s3_access.rs
  - tools/oracle/src/helpers/bedrock/services_s3_access/**
  - tools/oracle/helpers/bedrock_services_s3_access.py
  - tools/oracle/helpers/bedrock_services_s3_access/**
  - tools/oracle/cases/helpers/providers/bedrock-services-s3-access/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_access*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_s3_access.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_services_s3_access/**
  - crates/betterlite-config/Cargo.toml
  - crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_s3_access*
  - crates/betterlite-config/src/sections/bedrock_services_s3_access.rs
  - crates/betterlite-config/src/sections/bedrock_services_s3_access/**
  lint_tables: false
