id: B864
title: Feature and organization key generation switches
description: >-
  Implement two guards, not route registration. FeatureName accepts agents or vector_stores. Exact
  proxy_admin and proxy_admin_viewer roles (enum or equivalent string) return before reading settings.
  Others read disable_{feature}_for_internal_users with default False and pass when falsy. Despite the
  name, a truthy disable flag blocks every non-proxy-admin role, including org_admin, external users
  and absent roles. Only if disabled AND allow_{feature}_for_team_admins is truthy call B863
  _user_has_admin_privileges with caller, DB and cache, omitting the logger. A True result permits both
  team AND org administrators; False denies. Missing DB/user and lookup failure become False under
  B863; a thrown collaborator error is not locally caught. Denial is HTTP 403 detail.error exactly
  'Access to {agents|vector_stores} is disabled for your role. Contact your proxy admin.' No local
  ProxyException type/param/code or warning is added.

  check_org_admin_can_generate_keys returns immediately for every role except exact org_admin. For
  that role, falsy disable_key_generate_for_org_admin passes and truthy fails HTTP 403 detail.error
  'key generation is disabled for org admins. Contact your proxy admin.'. A caller with an org-admin
  membership but global role internal_user is not blocked by this helper; general key permissions
  remain the caller's responsibility. No paid-tier branch or license bypass exists in this file.


  Build the production management_rbac module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/rbac_utils.py:
  check_feature_access_for_user (L17-L68; 42 source lines), check_org_admin_can_generate_keys (L71-L96;
  22 source lines).


  All five general_settings keys default False: disable_agents_for_internal_users,
  allow_agents_for_team_admins, disable_vector_stores_for_internal_users,
  allow_vector_stores_for_team_admins and disable_key_generate_for_org_admin. There are no environment
  bindings. The Python branch uses truthiness, not 'is True': null/empty/zero are false and a nonempty
  string such as 'false' is true if present in the runtime settings map. Do not invent int parsing,
  startup fallback or a warn-and-ignore path here.


  Add Management::models.management_rbac for policy-only cases with an injected immutable settings
  snapshot and no database. Python calls the pinned guard, not an endpoint or copied predicate. The
  B863 exemption branch is tested natively with recorded calls and configured True/False/error
  outcomes; actual membership reads remain B863's Postgres tests. Compare exact 403 detail objects.


  Config tests loads_agents_switches, loads_vector_store_switches, loads_org_key_switch,
  all_switches_default_false and runtime_truthiness call B002's loader and consume the resulting
  values in both guards. Include true, false, null and the accepted scalar truthiness cases. Use the
  existing config_yaml corpus with all five nested keys; no second settings parser is introduced.


  The two functions contain 50 nonblank noncomment lines excluding docstrings. Allow 70 guards,
  210 tests, 70 adapters, 50 config and 30 wiring lines, 430 within 500.
