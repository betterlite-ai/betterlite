deviations:
  - what: The router handle is injected through betterlite-server rather than read from a global proxy_server import.
    why: betterlite isolates mutable shared state into the server crate; judge primitives in betterlite-models remain pure functions.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_judge.py#L21-L27
  - what: _provider_qualified is built in Rust with lru crate instead of Python's @lru_cache decorator.
    why: betterlite is Rust; the cache semantics are equivalent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_judge.py#L61-L76
  - what: JudgeTarget.models field is immutable (frozenset) and accessed through methods rather than direct mutation.
    why: betterlite values immutability for concurrent dispatch; the API remains the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_judge.py#L79-L90

out_of_scope:
  - "`default_router_provider`: owned by B118 as part of the shadow eval logger callback setup; B4080 owns only the judge primitives and dispatch."
  - "`litellm.Router.acompletion` (question 1): this native operation awaits resolution of which task owns it."
  - "`litellm.Router.resolved_litellm_models` (question 1): this native operation awaits resolution of which task owns it."
  - "`litellm.acompletion` fallback path (question 2): the SDK completion executor awaits resolution of which task owns it."
  - "LLM-as-a-judge guardrails and decision-model guardrails: they call judge_target and judge_acompletion but are owned elsewhere; they must depend on B4080 rather than B118."
  - "proxy/management_endpoints/auto_router_endpoints.py:20 caller: it will depend on B4080 when that endpoint task is assigned."

pitfalls:
  - "JSON fence extraction must accept optional ```json marker; preserve first fence found even if followed by prose."
  - "Outermost-brace fallback requires rfind(\"}\") to find the closing brace; do not use a greedy regex that may skip to a later object."
  - "parse_json_verdict must reject non-object JSON (arrays, scalars, null); check isinstance(parsed, dict) after json.loads."
  - "extract_text_from_content on multimodal lists iterates over all parts and joins text fields; skip dict parts without type==\"text\" or missing text."
  - "_provider_qualified returns None for unmapped names, not an error; a None result means the model is unresolvable and should not be used."
  - "judge_target with no router must not panic; the None router is valid and falls back to SDK-only resolution."
  - "team_id is part of the question (passed to judge_target), not a refinement; a team-public name resolves only for its own team."
  - "judge_acompletion preserves num_retries=0 and fallbacks=[] to prevent judge failures from multiplying spend; drop_params=True filters unsupported optional arguments."
  - "Cache size for _provider_qualified is exactly 512 entries; do not scale it with configuration or runtime state."

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 2
