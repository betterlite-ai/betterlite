    why: "judge_acompletion: dispatches through router or SDK with fixed params (num_retries=0, fallbacks=[], drop_params=True)."

dod:
  - text: parse_json_verdict extracts JSON from markdown fences with optional ```json marker and whitespace.
    proof: [verdict-parser-tests, verdict-parse-fuzz]
  - text: parse_json_verdict falls back to extracting text between outermost braces when no fence is found.
    proof: [verdict-parser-tests, verdict-parse-fuzz]
  - text: parse_json_verdict rejects parsed JSON that is not a dict and raises ValueError.
    proof: [verdict-parser-tests, verdict-parse-fuzz]
  - text: extract_text_from_content returns the input string unchanged if content is a str.
    proof: [content-text-tests]
  - text: extract_text_from_content extracts and joins text fields from multimodal content lists.
    proof: [content-text-tests]
  - text: extract_text_from_content returns empty string for unrecognized content types.
    proof: [content-text-tests]
  - text: _provider_qualified caches results up to 512 entries and returns None for unmapped names.
    proof: [provider-qualified-tests]
  - text: _provider_qualified normalizes mapped names to provider-qualified form (provider/model).
    proof: [provider-qualified-tests]
  - text: JudgeTarget is a frozen dataclass with via (literal "router"/"sdk"/"nothing") and models (frozenset).
    proof: [judge-target-tests]
  - text: judge_target returns "router" when router.resolved_litellm_models yields results for the model and team.
    proof: [oracle]
  - text: judge_target returns "sdk" when _provider_qualified resolves the model to a provider-qualified name.
    proof: [oracle]
  - text: judge_target returns "nothing" when both router and SDK paths fail to resolve the model.
    proof: [oracle]
  - text: judge_acompletion dispatches through router.acompletion when judge_target.via is "router" with num_retries=0 and drop_params=True.
    proof: [oracle]
  - text: judge_acompletion dispatches through litellm.acompletion when judge_target.via is "sdk" with num_retries=0 and drop_params=True.
    proof: [oracle]
  - text: judge_acompletion forwards the team_id to judge_target to preserve team-scoped resolution.
    proof: [oracle]

checks:
  optional: [mutants]
  commands:
    - id: verdict-parser-tests
      why: parse_json_verdict tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^judge_verdict_parsing::/)'
    - id: content-text-tests
      why: extract_text_from_content tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^content_text_extraction::/)'
    - id: provider-qualified-tests
      why: _provider_qualified tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^provider_qualified::/)'
    - id: judge-target-tests
      why: judge_target and JudgeTarget tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^judge_target::/)'
    - id: verdict-parse-fuzz
      why: verdict parser fuzz corpus is missing or does not replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-models/fuzz/corpus/judge_verdict_parser)" && cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(replays_the_judge_verdict_parser_corpus)'

