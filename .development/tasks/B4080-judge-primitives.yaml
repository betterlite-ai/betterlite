    why: "parse_json_verdict: fence extraction, outermost-brace fallback, non-object rejection."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_judge.py#L50-L58
