id: B4080
title: Parse judge verdicts and resolve team-scoped judge targets
description: >-
  Build shared text and verdict parsing in betterlite-models, and judge target resolution
  and dispatch in betterlite-server. The judge target identifies where a model name resolves
  for a given caller and team, and dispatch routes the call through the proxy's router
  (for configured deployments) or through the SDK (for provider-qualified names) with zero
  retries and empty fallbacks.

  In betterlite-models, add parse_json_verdict (tolerates markdown fences and surrounding
  prose, extracts JSON from fences or falls back to outermost braces, rejects non-object results),
  extract_text_from_content (returns plain text from a string or multimodal content list),
  and _provider_qualified with an LRU cache of 512 entries (calls get_llm_provider from B174
  and normalizes a model name to its provider-qualified form, returning None if unmapped).
  Add the JudgeTarget dataclass with via (literal "router", "sdk", or "nothing") and models
  (a frozenset of resolved model names).

  In betterlite-server, add judge_target (queries the router's resolved models or falls back
  to _provider_qualified, returns JudgeTarget with the dispatch path) and judge_acompletion
  (dispatches through router or SDK with drop_params=True, num_retries=0 and fallbacks=[]).
  The router handle is injected, not global. Preserve team-aware identity resolution: a team
  name resolves only for its own team, and a team's own deployment resolves for nobody else.
  When judge_target returns "nothing", dispatch declines the call without marking it failed.
  Dispatch remains distinct from target resolution: do not invent a top-level team_id argument
  on completion calls where the source supplies identity through metadata.

  parse_json_verdict is an outside-text parser; preserve the first-fence extraction, outermost-brace
  fallback and rejection of non-object JSON. Add a fuzz target and replay tests.

