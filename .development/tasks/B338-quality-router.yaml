id: B338
title: Quality-tier and keyword routing
description: Add the quality_router marker with its typed config and per-deployment routing preferences.
  Reuse B328's classifier and B013 prices, build the sorted quality index once per catalog snapshot and
  publish the existing x-litellm-quality-router-* metadata through B016. Keep keyword overrides and tier
  resolution distinct so ordering can be tested without the classifier. Use the existing Rust crate boundaries
  from B004 and B008; integrate through the server when the provider dispatcher or callbacks live in another
  core crate. This task's source slices are the linked ranges, not a port of their Python classes. Add
  the listed oracle cases and the matching adapters to B301's component runner where state is not observable
  over HTTP; adapters call production logic and never reproduce it. Use deterministic candidate sets or
  supplied random samples for comparisons, and separate seeded distribution tests for random choices.
  Extend the existing config_yaml fuzz target and committed corpus for every newly accepted config form;
  unsupported keys still fail by full path. Keep the implementation, adapters and tests within 800 changed
  lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/quality-router/**
  - tools/oracle/src/router_probes/quality_router/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/quality_router.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/quality_router/config.py#L10-L74
  why: Quality config and preference order.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/quality_router/quality_router.py#L45-L304
  why: Index, keyword ties and tier resolution.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/quality_router/quality_router.py#L306-L452
  why: Decision/header metadata and pre-routing hook.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the quality_router prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(quality_router)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/quality-router/keyword-before-complexity.yaml
- tools/oracle/cases/routing/quality-router/quality-before-order-before-price.yaml
- tools/oracle/cases/routing/quality-router/name-last-tiebreak.yaml
- tools/oracle/cases/routing/quality-router/exact-round-up-round-down.yaml
- tools/oracle/cases/routing/quality-router/missing-tier-default.yaml
- tools/oracle/cases/routing/quality-router/no-user-message.yaml
- tools/oracle/cases/routing/quality-router/text-content-blocks.yaml
- tools/oracle/cases/routing/quality-router/quality-response-headers.yaml
deviations: []
out_of_scope:
- Learning quality from feedback; that belongs to the adaptive router.
pitfalls:
- Higher quality wins before an explicit lower order value.
- A missing quality tier first rounds up, then down, before using default_model.
- Price arithmetic and serialization remain Decimal.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
