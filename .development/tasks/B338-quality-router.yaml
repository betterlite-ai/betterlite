- tools/oracle/cases/routing/quality-router/unknown-config-fields-warning.yaml
deviations: []
out_of_scope:
- Learning quality from feedback; that belongs to the adaptive router.
- litellm/router_strategy/quality_router/__init__.py has no functions at the pin; its exports/data are
  accounted for by the owning native module, with no Python wrapper port.
- litellm/router_strategy/quality_router/config.py has no functions at the pin; its exports/data are accounted
  for by the owning native module, with no Python wrapper port.
pitfalls:
- Higher quality wins before an explicit lower order value.
- A missing quality tier first rounds up, then down, before using default_model.
- Price arithmetic and serialization remain Decimal.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
