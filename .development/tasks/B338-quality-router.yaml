id: B338
title: Quality-tier and keyword routing
description: 'Add the quality_router marker with its typed config and per-deployment routing preferences.
  Reuse B328''s classifier and B013 prices, build the sorted quality index once per catalog snapshot and
  publish the existing x-litellm-quality-router-* metadata through B016. Keep keyword overrides and tier
  resolution distinct so ordering can be tested without the classifier. Configuration boundary keys introduced
  or consumed here: available_models, complexity_to_quality, default_model, quality_tier, keywords, order.
  Pinned declaration defaults: available_models=list; complexity_to_quality=lambda: DEFAULT_COMPLEXITY_TO_QUALITY.copy();
  default_model=None; keywords=(); order=None. Resolve env values once in betterlite-config, never in
  router code. QualityRouterConfig and RoutingPreferences accept extra fields at the pin: preserve accepted
  values and warn about ignored extras, rather than turning them into a startup failure. Implement the
  owned native service in crates/betterlite-router/src/quality_router.rs. Add ProbeOperation::QualityRouter in
  tools/oracle/src/router_probes/mod.rs and the corresponding B338 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/quality_router/quality_router.py:
  QualityRouter.__init__ (L45-L93), QualityRouter._tier_to_models (L96-L100), QualityRouter._get_routing_preferences
  (L102-L121), QualityRouter._get_deployment_input_cost (L123-L146), QualityRouter._get_deployment_model_name
  (L148-L152), QualityRouter._build_tier_index (L154-L219), QualityRouter._order_key (L221-L224), QualityRouter._cost_key
  (L226-L229), QualityRouter._keyword_override (L231-L269), QualityRouter._keyword_override.sort_key (L259-L266),
  QualityRouter._resolve_model_for_quality_tier (L271-L304), QualityRouter._stash_decision (L306-L320),
  QualityRouter.async_pre_routing_hook (L322-L452). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
