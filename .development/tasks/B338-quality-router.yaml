dod:
- text: Write tests named quality_router_behaviors and quality_router_boundaries under quality_router::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - quality-router-behaviors
  - quality-router-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/quality-router-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/quality-router-invalid.yaml;
    the valid seed contains available_models. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - quality-router-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: quality-router-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::quality_router_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: quality-router-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::quality_router_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/quality_router.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/quality_router.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/quality-router-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/quality-router-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/quality-router-" && grep -Fq 'available_models' crates/betterlite-config/fuzz/corpus/config_yaml/quality-router-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/quality-router/keyword-before-complexity.yaml
- tools/oracle/cases/routing/quality-router/quality-before-order-before-price.yaml
- tools/oracle/cases/routing/quality-router/name-last-tiebreak.yaml
- tools/oracle/cases/routing/quality-router/exact-round-up-round-down.yaml
- tools/oracle/cases/routing/quality-router/missing-tier-default.yaml
- tools/oracle/cases/routing/quality-router/no-user-message.yaml
- tools/oracle/cases/routing/quality-router/text-content-blocks.yaml
