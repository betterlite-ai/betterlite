dod:
  - text: Each function copies the listed fields and applies the listed defaults.
    proof: [init-tests]
  - text: The cisco, crowdstrike, grayswan, guardrails_ai and headroom functions refuse the missing name or guard_name with the documented message.
    proof: [init-tests]
  - text: The optional_params lookups for cisco, generic_api and grayswan follow the order of the LiteLLM helpers, including null entries.
    proof: [init-tests]
  - text: The grayswan streaming fields and the conduct timeout use their defaults.
    proof: [init-tests]

checks:
  optional: [mutants]
  commands:
    - id: init-tests
      why: an initializer argument, default or refusal differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^third_party_init_a::/)'

deviations:
  - what: The initializers return argument structs and register nothing.
    why: The callback classes have their own tasks and B3682 owns the registry and the registration, as with B3681.
  - what: A refusal is a ThirdPartyInitAError, not a Python ValueError or Exception.
    why: Same outcome with a Rust error type.

out_of_scope:
  - 'The twelve callback classes and their behaviour: their own hook tasks.'
  - 'The initializer registry, the class registry and the registration with the callback manager: B3682.'
  - 'initialize_lasso and the other functions of guardrail_initializers.py: B3681.'

pitfalls:
  - 'Cisco, Gray Swan, Pillar-style helpers do not agree on the order of optional_params and the top-level param, so read each helper and do not share one.'
  - 'akto and grayswan use guardrail_timeout, and the others use timeout.'
  - 'Gray Swan treats 0 and false as unset for the two streaming fields because LiteLLM uses an or-chain.'
  - 'Conduct falls back to 8.0 only when the timeout is None, and an explicit 0 stays 0.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0

oracle_cases: []
