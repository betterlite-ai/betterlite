dod:
  - text: >-
      With mock_response set (a JSON string or a map) the sync call returns a VideoObject before the provider lookup, the logging
      update and the handler call, for both edit and extension.
      Example: mock_response '{"id":"video_1","object":"video","status":"completed"}' gives id video_1 and records zero handler calls.
    proof: [edit-call-tests, extension-call-tests]
  - text: >-
      With custom_llm_provider none the provider comes from decode_video_id_with_provider(video_id), and "openai" is used when the
      decoded provider is none or empty; an explicit custom_llm_provider skips the decode.
    proof: [edit-call-tests, extension-call-tests]
  - text: >-
      A provider whose video config is none fails with "video edit is not supported for <provider>" or "video extension is not
      supported for <provider>", and an unknown provider string fails at the provider conversion; both go through exception_type with model "".
    proof: [call-error-tests]
  - text: >-
      The logging object gets update_environment_variables with model "", user from the loose keywords, optional_params {video_id, prompt}
      for edit or {video_id, prompt, seconds} for extension, and litellm_params with litellm_call_id first; its call type is then set to
      video_edit or video_extension.
    proof: [edit-call-tests, extension-call-tests]
  - text: >-
      The handler receives the video file (edit) or the unchanged seconds string (extension), extra_headers, extra_body, the config,
      the provider, the client loose keyword and the async flag, and does not receive extra_query or an api_key.
    proof: [edit-call-tests, extension-call-tests]
  - text: >-
      The handler timeout is `timeout or request_timeout`: the default 600 is passed as 600, while 0 and none become B198's
      request_timeout (6000 unless REQUEST_TIMEOUT is set).
    proof: [edit-call-tests, extension-call-tests]
  - text: >-
      async_call counts only when it is exactly true: a string "true" or the number 1 leaves the handler on its sync path.
    proof: [edit-call-tests, extension-call-tests]
  - text: >-
      avideo_edit and avideo_extension set async_call true, run the sync function with the caller's call context, await a pending
      future and return a plain value as is, and they do no provider inference.
    proof: [edit-call-tests, extension-call-tests]
  - text: >-
      A missing litellm_logging_obj, a mock decode error and a handler error each reach exception_type once with model "", the
      provider known at that point and the loose keywords as extra kwargs.
    proof: [call-error-tests]
checks:
  optional: []
  commands:
    - id: edit-call-tests
      why: the edit call tests are missing or the mock shortcut, provider decode, logging update, timeout or async hand-off differ
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_edit_call::(.*::)?edit_call_behavior::/)'
    - id: extension-call-tests
      why: the extension call tests are missing or the seconds pass-through, logging params, timeout or async hand-off differ
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_extension_call::(.*::)?extension_call_behavior::/)'
    - id: call-error-tests
      why: the unsupported-provider text or the exception_type boundary differs in either module
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_(edit|extension)_call::(.*::)?call_error_behavior::/)'
oracle_cases: []
deviations:
  - what: Python's executor thread with a copied contextvars context is replaced by B198's explicit call context passed to the sync path, and the async function awaits the handler's future directly.
    why: betterlite keeps no ContextVars and its handlers are async, so the caller sees the same result.
  - what: A provider string that LiteLLM's LlmProviders enum rejects fails with betterlite's typed unknown-provider error, not Python's ValueError text "'x' is not a valid LlmProviders".
    why: The Rust provider type is a closed enum parsed from the name; the status and error class after exception_type stay the same, only the message text differs.
out_of_scope:
  - "The @client wrapper that creates litellm_logging_obj, fills litellm_call_id and applies caching, retries and callbacks belongs to the SDK wrapper tasks; this task receives the logging object in the loose keywords."
  - "video_edit_handler, async_video_edit_handler, video_extension_handler and async_video_extension_handler: B3336."
  - "async_video_delete_handler (llm_http_handler.py 8528-8602): no caller at the pin, no owner."
  - "Generation, content, remix, list, status and character calls in litellm/videos/main.py: B3338, B3339, B3340 and B3341."
  - "decode_video_id_with_provider: B672. get_provider_video_config: B3332. GenericLiteLLMParams: B010. update_environment_variables: B247. exception_type: B185 and B186."
  - "The /v1/videos/edits and /v1/videos/extensions proxy routes and their multipart parsing: the video endpoint tasks under B093."
  - "litellm/videos/__init__.py re-exports and the router's avideo_edit and avideo_extension factory wiring: module wiring is B093 and the router tasks."
pitfalls:
  - The mock check reads mock_response with get, not pop, and runs before the provider decode, so a mocked call never needs a valid video id or provider.
  - The unsupported message differs by call ("video edit is not supported for" and "video extension is not supported for"), and it names the provider only, never the video id.
  - The logging update passes model "" and only video_id, prompt (and seconds for extension) as params; the video file, extra_headers and extra_body are left out, and litellm_call_id comes first in litellm_params.
  - extension's seconds is a string and goes to the handler unchanged; do not parse it as a number or validate it.
  - extra_query is a named argument in both calls and no code reads it after that.
  - async_call is removed from the loose keywords before GenericLiteLLMParams is built, but client, mock_response and litellm_call_id stay in them.
  - The video file of edit is keyword-only in Python, so the Rust edit entry points take it as a named field and not as a position.
  - exception_type gets model "" in both the sync and the async functions, unlike avideo_generation, which uses model or "sora-2".
  - The sync function's except clause reads custom_llm_provider as it is at the failure, so an error before the decode step reports a none provider.
review_level: standard
