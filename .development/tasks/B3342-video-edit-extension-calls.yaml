id: B3342
title: Video edit and extension calls
description: >-
  Build the four SDK call functions for video edit and video extension in betterlite-core::api: video_edit, avideo_edit,
  video_extension and avideo_extension (litellm/videos/main.py). Two modules, `api::video_edit_call` and
  `api::video_extension_call`, one file tree each. Each call decides the provider, checks the mock shortcut, builds the
  provider config lookup, updates the logging object and hands one prepared request to the transport handler that B3336
  owns (`api::video_edit_transport` and its extension twin, both on one struct). Follow the shape of B3338
  (video_generation_call) and B3339 (video_content_call). The two calls differ only in their arguments, the unsupported
  message and the logging call type, so write each module on its own and do not share a helper between them.

  Inputs. Edit takes video_id, prompt, timeout (default 600), custom_llm_provider, extra_headers, extra_query, extra_body, the
  keyword-only video file (B3330's file content type) and the loose keyword map. Extension takes video_id, prompt, seconds
  (a string, passed on unchanged), timeout, custom_llm_provider, extra_headers, extra_query, extra_body and the loose
  keyword map. The logging object arrives in the loose keywords under litellm_logging_obj, supplied by the SDK wrapper.

  Sync path (video_edit, video_extension), steps in this order. (1) Take litellm_logging_obj out of the loose keywords; a
  missing one is an error. (2) Read litellm_call_id from the loose keywords without removing it. (3) Take async_call out of
  the loose keywords; it counts as async only when it is exactly true. (4) If mock_response is present and not null, decode
  it as JSON when it is a string, build a VideoObject (B3330) from the map and return it at once, with no provider lookup,
  no logging update and no handler call; an async caller gets the object directly, not a future. The mock key is read, not
  removed, so it still reaches GenericLiteLLMParams below. (5) When custom_llm_provider is none, run B672's
  decode_video_id_with_provider on video_id and take its custom_llm_provider, using "openai" when that is none or empty. (6)
  Build GenericLiteLLMParams (B010) from the remaining loose keywords. (7) Select the video config with B3332's
  get_provider_video_config with model none and the provider. A provider string that is not a known provider name fails in
  this step with LiteLLM's ValueError for an invalid LlmProviders value; a known provider with no video config makes the
  selector return none, and then the call fails with "video edit is not supported for <provider>" (edit) or "video
  extension is not supported for <provider>" (extension). (8) Merge the loose keywords into the error-context map that
  exception_type will receive later. (9) Call B247's update_environment_variables on the logging object with model "" (the
  empty string, not none), user = the loose keyword user, optional_params = the request params, litellm_params = a map with
  litellm_call_id first and then the request params, and the provider. Request params are {video_id, prompt} for edit and
  {video_id, prompt, seconds} for extension. The video file and extra_* arguments are not in them. (10) Set the logging
  call type to "video_edit" or "video_extension". (11) Call the B3336 handler with prompt, video_id, the video file (edit)
  or seconds (extension), the config, provider, litellm params, logging object, extra_headers, extra_body, timeout =
  `timeout or DEFAULT_REQUEST_TIMEOUT` (argument default 600; 0 or none falls back to B198's request_timeout, REQUEST_TIMEOUT
  env var, default 6000 seconds), the async flag, and the client loose keyword (read, not removed). extra_query is accepted
  and never used. api_key is never passed, so the handler falls back to the params' api_key.

  Any failure in steps 1 to 11, including the ones raised by the handler and the mock decode, goes through B185/B186's
  exception_type with model "" (empty string), the provider as known at that moment (none when the failure came before step
  5 finished), the original error, the call's arguments plus loose keywords as completion kwargs, and the loose keywords as
  extra kwargs. exception_type runs once; do not map an already mapped error again.

  Async path (avideo_edit, avideo_extension). Set async_call to true in the loose keywords, run the sync function with the
  same arguments and the caller's B198 call context (no global state, no executor hop), and await the result when it is a
  pending future; a plain value (the mock object) is returned as is. Unlike avideo_generation there is no provider inference
  here, so the provider stays whatever the caller passed, possibly none. Errors from the whole async function go through
  exception_type with model "" and the caller's custom_llm_provider argument, which makes the same error pass through
  exception_type twice when the sync part already mapped it; keep this order and let exception_type's own idempotence
  (B185/B186) decide the final error. Expose each pair as two Rust entry points (sync, async) sharing one private
  implementation, and no flag argument.

  Name the rstest functions `edit_call_behavior`, `extension_call_behavior` and `call_error_behavior`, one named case per DoD
  item, using a recording fake of the B3336 handler trait and a fake logging handle. The task changes no wire format, so
  there is no fuzz target.
