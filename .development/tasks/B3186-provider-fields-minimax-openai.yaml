oracle_cases: []
deviations: []
out_of_scope:
  - Consuming or assembling this fragment into a larger catalog. B3190 loads all fragments in source order.
  - Network behavior or credential validation. This task only preserves the form metadata.
  - Provider resolution or model execution. The task provides data only.
pitfalls:
  - "The JSON file must be a plain array, not an object with a key. B3190's loader expects JSON.load(file) to yield a list directly."
  - "Every null value in options, placeholder or tooltip must be preserved exactly; missing the null and writing an empty string changes the wire format."
  - >-
    NVIDIA Riva's default_model_placeholder includes the provider prefix:
    "nvidia_riva/nvidia/parakeet-ctc-1_1b-asr", not just
    "nvidia/parakeet-ctc-1_1b-asr".
  - "NVIDIA Riva's api_base field is required (unlike most other providers) and has a gRPC endpoint placeholder and detailed tooltip about NVCF vs self-hosting."
  - "Ollama and Ollama Chat are distinct providers with distinct litellm_provider identifiers (ollama and ollama_chat); only Ollama carries a default_value for api_base."
  - "Moonshot, Morph, Nebius, NLP_Cloud, Novita, Nscale, NVIDIA_NIM and Oobabooga all have minimal credential fields with no required fields, placeholders or tooltips (all null or false)."
  - "OpenAI's organization field has no tooltip despite being optional; its placeholder clarifies \"[OPTIONAL]\" in the label."
review_level: standard
budget:
  max_changed_lines: 650
  max_new_expects: 0
