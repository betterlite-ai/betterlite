id: B3186
title: Provider form catalog from MiniMax through OpenAI
description: >-
  Create the ordered catalog fragment for the public provider form endpoint, covering thirteen provider definitions from MiniMax through OpenAI.
  This fragment holds credential field metadata, display names, and model placeholders for each provider, consumed by B3190's get_provider_fields function as part of its assembled catalog.
  Preserve every credential field name, label, placeholder, tooltip, required flag, field_type and options value exactly as LiteLLM defines them at the pinned commit, including NVIDIA Riva's gRPC endpoint metadata and required api_base field with its distinct default_model_placeholder prefix.
  Store this fragment in its own asset path crates/betterlite-server/assets/provider_create_fields_minimax_openai.json so parallel workers do not rewrite a shared file; B3190 later assembles all fragments in the source order.
scope:
  paths:
    - crates/betterlite-server/assets/provider_create_fields_minimax_openai.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/provider_create_fields.json#L2156-L2529
    why: All thirteen provider definitions from MINIMAX through OpenAI with their credential fields, defaults and model placeholders.
dod:
  - text: All thirteen provider records (MINIMAX through OpenAI) are preserved byte-for-byte from the LiteLLM source at the pinned commit.
    proof: [provider-records-preserved]
  - text: "Every credential field for all thirteen providers (MINIMAX, MOONSHOT, MORPH, NEBIUS, NLP_CLOUD, NOVITA, NSCALE, NVIDIA_NIM, NVIDIA_RIVA, Ollama, OLLAMA_CHAT, OOBABOOGA, OpenAI) has exact required, field_type, label, placeholder, tooltip and default_value values matching LiteLLM's field order."
    proof: [minimax-fields, moonshot-fields, morph-fields, nebius-fields, nlp-cloud-fields, novita-fields, nscale-fields, nvidia-nim-fields, nvidia-riva-fields, ollama-fields, ollama-chat-fields, oobabooga-fields, openai-fields]
  - text: NVIDIA Riva's default_model_placeholder is the exact value "nvidia_riva/nvidia/parakeet-ctc-1_1b-asr" with the provider prefix, and its api_base field is required with gRPC endpoint placeholder and tooltip.
    proof: [nvidia-riva-fields]
  - text: Ollama and Ollama Chat are distinct providers with distinct litellm_provider identifiers (ollama and ollama_chat); Ollama's api_base has the default_value "http://localhost:11434".
    proof: [ollama-fields, ollama-chat-fields]
  - text: The JSON file is a JSON array of thirteen provider records in the expected order.
    proof: [provider-json-parses]
checks:
  optional: []
  commands:
    - id: provider-records-preserved
      why: the thirteen provider records do not appear in the expected order or count
      run: >-
        jq -e '[.[].provider] == ["MINIMAX", "MOONSHOT", "MORPH", "NEBIUS", "NLP_CLOUD", "NOVITA", "NSCALE", "NVIDIA_NIM", "NVIDIA_RIVA", "Ollama", "OLLAMA_CHAT", "OOBABOOGA", "OpenAI"]'
        crates/betterlite-server/assets/provider_create_fields_minimax_openai.json
    - id: minimax-fields
      why: MINIMAX credential fields do not match LiteLLM's exact structure
      run: |
        jq -e '.[0] | .provider == "MINIMAX" and .default_model_placeholder == "minimax/MiniMax-M2" and (.credential_fields | length) == 2' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[0].credential_fields[0] | .key == "api_key" and .label == "API Key" and .field_type == "password" and .required == true and .placeholder == "your-minimax-api-key"' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[0].credential_fields[1] | .key == "api_base" and .label == "API Base URL" and .field_type == "text" and .required == false and .default_value == "https://api.minimax.io/v1"' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json
    - id: moonshot-fields
      why: MOONSHOT credential fields do not match LiteLLM exactly
      run: |
        jq -e '.[1] | .provider == "MOONSHOT" and (.credential_fields | length) == 2' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[1].credential_fields[0] | .key == "api_base" and .label == "API Base" and .field_type == "text" and .required == false and .placeholder == null and .tooltip == null and .default_value == null' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[1].credential_fields[1] | .key == "api_key" and .label == "API Key" and .field_type == "password" and .required == false and .placeholder == null and .tooltip == null' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json
    - id: morph-fields
