        jq -e '.[4].credential_fields[1] | .key == "api_key" and .label == "API Key" and .field_type == "password" and .required == false and .placeholder == null and .tooltip == null' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json
    - id: novita-fields
