    - id: nscale-fields
      why: NSCALE credential fields do not match LiteLLM exactly
      run: |
        jq -e '.[6] | .provider == "NSCALE" and (.credential_fields | length) == 2' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[6].credential_fields[0] | .key == "api_base" and .label == "API Base" and .field_type == "text" and .required == false and .placeholder == null and .tooltip == null' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[6].credential_fields[1] | .key == "api_key" and .label == "API Key" and .field_type == "password" and .required == false and .placeholder == null and .tooltip == null' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json
    - id: nvidia-nim-fields
      why: NVIDIA_NIM credential fields do not match LiteLLM exactly
      run: |
        jq -e '.[7] | .provider == "NVIDIA_NIM" and (.credential_fields | length) == 2' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[7].credential_fields[0] | .key == "api_base" and .label == "API Base" and .field_type == "text" and .required == false and .placeholder == null and .tooltip == null' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
        jq -e '.[7].credential_fields[1] | .key == "api_key" and .label == "API Key" and .field_type == "password" and .required == false and .placeholder == null and .tooltip == null' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json
    - id: nvidia-riva-fields
      why: NVIDIA_RIVA credential fields, gRPC endpoint metadata or default_model_placeholder do not match LiteLLM exactly
      run: |
        jq -e '.[8] | .provider == "NVIDIA_RIVA" and .litellm_provider == "nvidia_riva" and .default_model_placeholder == "nvidia_riva/nvidia/parakeet-ctc-1_1b-asr" and (.credential_fields | length) == 3' crates/betterlite-server/assets/provider_create_fields_minimax_openai.json &&
