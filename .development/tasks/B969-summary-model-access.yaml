id: B969
title: Authorize the configured compaction summary model
description: >-
  Implement summary_model_access in betterlite-core and its two general_settings fields in betterlite-config.
  Own compact.py L97-L194 types/settings helpers and the whole _check_summary_model_access L197-L392.
  The result is a boolean policy decision, not an HTTP exception. B2432 turns denial into a visible skipped
  compaction. Summary requests do not reenter normal authentication, so check every applicable parent scope
  in source order and stop at the first denial. Reuse B732 principals, B747 model matching, B736 user/member
  lookup, B879 project lookup and B886 user/project grants. Inject repository availability and policy failures;
  importing proxy globals is represented by an explicit absent-proxy context.

  general_settings.context_management_summary_model defaults to null; only a nonempty string is retained,
  including whitespace. general_settings.context_management_summary_max_tokens defaults to 4096 and accepts
  positive Python integers, including true as 1. These functions do not read DEFAULT_MAX_TOKENS or any env var.
  B968 supplies the constants. Config tests must load both keys through B002, confirm they are supported, and
  replay added config_yaml seeds. Do not create another YAML decoder.

  Register HelperCall::SummaryModelAccess with settings and access actions. The independent Python adapter
  invokes the actual helper with scripted repositories and policy checks and records the ordered calls and
  diagnostics. Fixtures include a real B747 allowlist/alias check, not only scripted booleans. Protocol declarations
  become typed injected interfaces. Parsed principal records require no new byte decoder. Own 263 nonblank,
  non-comment physical lines; budget 260 implementation, 150 tests, 140 fixtures, 90 adapters, 65 config/wiring,
  705 total. Tests live under api::summary_model_access in core and config.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/summary_model_access.rs
  - crates/betterlite-core/src/api/summary_model_access/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/summary-model-access-*
  - tools/oracle/src/helpers/core_ops/summary_model_access.rs
  - tools/oracle/src/helpers/core_ops/summary_model_access/**
  - tools/oracle/helpers/summary_model_access.py
  - tools/oracle/helpers/summary_model_access/**
  - tools/oracle/fuzz/corpus/helper_case/summary_model_access-*
  - tools/oracle/cases/helpers/summary-model-access/**
  - crates/betterlite-config/src/sections/summary_model_access.rs
  - crates/betterlite-config/src/sections/summary_model_access/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L97-L194
  why: Own typed seams, tool-result predicate and settings readers; the token fallback is 4096 without environment lookup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L197-L392
  why: Own all five authorization scopes and the distinct lookup-versus-policy failure behavior.
dod:
- text: >-
    loads_summary_settings loads absent/null/empty/numeric summary_model as null, " " unchanged and "openai/gpt-4o-mini"
    unchanged. Missing,0,-1,1.5,"2",false max_tokens becomes 4096; 2 stays 2 and true becomes 1. A supplied
    DEFAULT_MAX_TOKENS=17 has no effect. Unavailable proxy settings give null/4096. The identity helper returns its
    input and the tool-result predicate accepts only a dict with type=tool_result, not a string or type=tool_use.
  proof: [behavior-tests, config-tests, config-corpus, oracle, helper-python]
- text: >-
    summary_scope_order supplies key/team/user/project/member allowlists and expects checks in that order on
    summary_model, never the client model. Empty key/team lists skip those checks. Key and team checks receive
    team_model_aliases,team_id,llm_router and object_type=key/team; member checks use object_type=team. A key alias
    resolving to the allowed summary model passes; denial at any scope returns false and prevents later lookups.
    No principal or unavailable proxy dependencies returns true without policy work.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    backing_objects_control_scope uses user_id/project_id with a database and observes user_id_upsert=false.
    Null ids or absent database skip the corresponding lookups; empty-string ids still look up. Missing user or
    project objects skip their check; a project with models=[] also skips it. User/project lookup error "offline"
    logs debug "compact_20260112: user object lookup failed for summary_model=sum access check; skipping user-level scope: offline"
    or the project/project-level equivalent, then continues. A loaded user is checked even with an empty model list.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    membership_lookup_is_fail_closed requires both user_id and team_id plus a database. Missing membership,
    missing litellm_budget_table or empty allowed_models imposes no member scope. Lookup error "offline" returns
    false with warning "compact_20260112: team membership lookup failed for summary_model=sum access check; denying access: offline".
    A nonempty member list is checked after project access, with aliases and team id preserved.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    policy_failures_deny scripts ProxyException at each of key,team,user,project,member and expects false without
    the unexpected-error warning. Other exception "broken" returns false and warning
    "compact_20260112: unexpected error during key-level access check for summary_model=sum; denying access: broken",
    substituting team-level,user-level,project-level,member-level for the other cases. No failure escapes as a
    status/type/param/code here and no summary request is made by this policy helper.
  proof: [behavior-tests, oracle, helper-python]
- text: The access operation has new fixtures and a tagged parser seed; the comparisons include diagnostic level and call order.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: access ordering, lookup failure or a settings boundary is untested
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api|sections)::summary_model_access::/)'
  - id: config-tests
    why: the loader has not accepted and applied both summary settings
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::summary_model_access::tests::loads_summary_settings/)'
  - id: config-corpus
    why: summary settings have no added production-loader seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/summary-model-access-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the access fixture does not execute a checked Python implementation
    run: test -f tools/oracle/helpers/summary_model_access.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the access action is not wired to the shared oracle decoder
    run: grep -qE '^[[:space:]]+summary_model_access:' tools/oracle/fuzz/corpus/helper_case/summary_model_access-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: the permission matrix has no new oracle inputs
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/summary-model-access)"
oracle_cases:
- tools/oracle/cases/helpers/summary-model-access/loads-summary-settings.yaml
- tools/oracle/cases/helpers/summary-model-access/summary-scope-order.yaml
- tools/oracle/cases/helpers/summary-model-access/backing-objects-control-scope.yaml
- tools/oracle/cases/helpers/summary-model-access/membership-lookup-is-fail-closed.yaml
- tools/oracle/cases/helpers/summary-model-access/policy-failures-deny.yaml
deviations: []
out_of_scope:
- B970 owns budget and rate-limit helpers at compact.py L395-L627; B971 owns history/prompt/token helpers at L630-L1016 and L1114-L1157.
- B2432 owns summary calls and apply_compact_20260112 at L1019-L1111 and L1160-L1380; B972 owns the dispatcher.
- B736/B879 own object retrieval and B747/B886 own the underlying grant policy; this task only sequences those calls for a summary.
pitfalls:
- 'The oracle helper for this task is pre-registered as summary_model_access in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/summary_model_access.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/summary_model_access.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A failed user or project read skips that scope, but a failed team membership read denies the summary.
- Whitespace is a nonempty summary-model setting; trimming it changes which model is attempted.
- No key/team policy is inferred for SDK calls with no principal.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
