id: B969
title: Summary model access
description: >-
  Authorize configured context-summary models using B052 model/team/key permissions. Resolve general_settings.context_management_summary_model
  and summary token defaults through config as named by the source, separating client-requested models from trusted
  summary overrides. The actual keys are general_settings.context_management_summary_model (absent means current
  model) and context_management_summary_max_tokens (positive integer, default 4096; invalid values use 4096), not
  litellm_settings keys.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-core/src/api/summary_model_access.rs. Use SummaryModelAccessInput and SummaryModelAccessResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions summary_model_denied, team_model_allowlist, key_model_allowlist, internal_summary_provenance,
  missing_summary_setting under api::summary_model_access::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): general_settings.context_management_summary_model
  defaults to None means current request model; general_settings.context_management_summary_max_tokens defaults
  to 4096; positive integer only, invalid values fall back to 4096; env.DEFAULT_MAX_TOKENS defaults to 4096. No
  environment reads occur outside betterlite-config. Test api::summary_model_access::tests::loads_settings uses
  the production Config loader and an injected environment map, with a named rstest case for every key above, explicit
  override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the
  unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's
  existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::SummaryModelAccess in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {summary_model_access: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _as_object (L97-L98);
  litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _is_tool_result_block (L101-L102);
  litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _SummaryAcompletion.__call__ (L120-L125);
  litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _CreateRateLimitDescriptors.__call__
  (L129-L137); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _AddModelRateLimitDescriptor.__call__
  (L141-L147); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _CreateOrgRateLimitDescriptors.__call__
  (L151-L153); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _GetProxyHook.__call__
  (L157-L157); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _ShouldRateLimit.__call__
  (L161-L167); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _read_summary_model_setting
  (L170-L177); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _read_summary_max_tokens_setting
  (L180-L194); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _check_summary_model_access
  (L197-L392). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 235 owned nonblank/non-comment/non-docstring Python lines (263 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 255 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 39 config tests/seeds and
  30 wiring; 544 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B171 (Direct helper oracle and URL
  path encoding), B198 (Injected call context and shared settings), B1087 (Api boundaries), B732 (Typed authentication
  principals and grant resolution). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.
