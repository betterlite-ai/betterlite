pitfalls:
  - "A keyless admitted subject returns its source union with the default scope Unscoped, while the no-mcp-servers opt-out and every managed agent result are Scoped, so the same empty list can carry different scopes."
  - "The managed agent check sits outside the guard, so its failure is a 503 identity error and the other steps' failures are a quiet empty deny; do not wrap the first in the second."
  - "The deny on a fault is Scoped only when the key itself declares mcp_servers, and Unresolved otherwise, which tells the caller the answer is unknown rather than empty."
  - "require_key_mcp_access_defined zeroes only a real key's inherited team grants; a source of an admitted subject passes keyless_source = true so team membership still grants, and the flag is never checked on the admitted branch at all."
  - "An end user with servers filters the list by membership in order, but an end user with none is ignored, and only require_end_user_mcp_access_defined turns that into a deny."
  - "The agent step sets has_lower only when agent_capped_servers returns something, so an agent that names no servers and has no access group ceiling leaves the org free to substitute its own list."
  - "Delegated managed agents pass an EMPTY team set, not None, when the agent has no team_id: None means every team the human belongs to, an empty set means only the human's own grants."
  - "Every error inside managed_agent_servers, including a plain bug, becomes the 503 policy_unavailable identity failure; do not let it escape as another error."
  - "admitted_subject_sources returns only the user's own source when the user has no id or there is no database, and the team list is read live, so a team in a cached user record that no longer lists the user as a member is dropped here and nowhere else."
  - "The roster check, not the user's teams array, decides which teams count; one team's read fault or over-budget state removes only that source, never the others, and never raises."
  - "toolset_scope returns an empty map, not None, when a pinned toolset resolves to nothing (the registry swallows read faults unless fresh policy is set), and an empty scope empties every source's grants; only a missing mcp_toolset_id means no scope."
  - "attributing_source_for_server recomputes the grants when it is handed an EMPTY list as well as when it is handed none, so the rpm limit code must pass the one list it already built."
  - "A server the user's own source reaches never bills a team, even when a team grants it too, and among several granting teams the lowest team_id string wins so billing does not follow map order."
  - "The rpm map reads each team again through roster_team (a second set of reads and budget checks), and a limit key is a server name or alias that expands to ids before the grant check; stop at the first id that attributes to the team."
  - "billing_auth_for_tool_call swallows every error and bills the user, since attribution must never fail a call that was already authorized."
  - "scoped_source_auth must not copy user_role: an admin role would make the server manager grant every server to a team source."

