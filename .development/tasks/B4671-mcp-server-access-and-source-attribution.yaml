deviations:
  - what: Reads go through typed ports (AccessReads, RegistryReads, GrantReads, CeilingReads, DelegatedHuman) instead of importing proxy_server globals (prisma_client, user_api_key_cache, proxy_logging_obj, global_mcp_server_manager).
    why: betterlite has no module-level state; the observable results are the same.
  - what: Server lists LiteLLM builds from a Python set come back de-duplicated in first-seen order, and sources and grants are lists with the user's own source first.
    why: Python's set order is not stable, so no client can rely on it; tests compare as sets where order is not part of the contract.
  - what: The reload of the delegated human goes through the DelegatedHuman port, not a direct call.
    why: reload_admitted_user is in B4673, which depends on this task, so a direct call would be a cycle.
  - what: The two general_settings flags are read once into typed booleans at config load, not from the live dict on every call.
    why: betterlite config is immutable after load; a changed setting needs a reload, like every other section.
  - what: Only scoped_source_auth and the attribution choice have oracle cases; every other function is covered by Rust tests with fakes.
    why: the rest read proxy_server globals, and a helper adapter cannot drive them; the HTTP cases come with the umbrella that wires the MCP routes.

