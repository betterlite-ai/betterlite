dod:
  - text: >-
      server_access for a managed agent returns managed_agent_servers with scope Scoped and does not enter the guard, so its error is returned and not turned into a deny;
      a keyless admitted subject returns the source union with scope Unscoped before the key and team steps.
    proof: [server-access-tests]
  - text: >-
      The key and team step returns an empty Scoped list for no-mcp-servers in the key list, the team list for a key with no servers, the intersection when both restrict, and an empty base for a key with no servers
      when require_key_mcp_access_defined is true unless keyless_source is true; the key's access group servers are added on top.
    proof: [server-access-tests]
  - text: >-
      The end user, agent, agent caller, user and org steps run in that order on the list; an end user with no servers is ignored unless require_end_user_mcp_access_defined is true, which returns an empty Scoped list,
      and the scope is Scoped when any lower level restricted, the org restricted or the key declares mcp_servers.
    proof: [server-access-tests]
  - text: >-
      Any error after the managed agent check returns an empty list with scope Scoped when the key declares mcp_servers and Unresolved otherwise, an Unloadable error included.
    proof: [server-access-tests]
  - text: >-
      scoped_source_auth carries user_id, the trace span handle, requires_fresh_policy and mcp_explicit_grants_only, carries the user's own object_permission, object_permission_id and access_group_ids only when asked,
      and never carries a key, a role, a budget or the admitted marker; billed_auth changes only team_id and org_id.
    proof: [source-auth-tests, helper-tests, oracle]
  - text: >-
      The sources are the user's own first, then each roster team in the order B4669 returns them, with the team's own organization or the user's as the source org; a user with no id, no database or an
      allowed_team_ids set that excludes a team gets no source for it, and an empty allowed set leaves only the user's own source.
    proof: [sources-tests]
  - text: >-
      A team counts only when the read succeeds, the user is in its member list and the team and its org are within budget; a read fault, a missing row, a non-member, an exceeded budget and a budget check fault each give no team without an error.
    proof: [roster-tests]
  - text: >-
      The source grants are each source's keyless server set intersected with the keys of the toolset scope when mcp_toolset_id is set, and the admitted union is the union of those sets.
    proof: [sources-tests]
  - text: >-
      Attribution keeps the sources that grant the server, bills nobody-team (None) when the user's own source is among them, else picks the lowest team_id, and recomputes the grants only when none are given;
      billing_auth_for_tool_call returns the auth unchanged for a non-admitted caller, an unknown tool, no attributing team or any error, else a copy with the team and its org.
    proof: [attribution-tests, helper-tests, oracle]
  - text: >-
      The team rpm limits map holds, per team, only the limit entries whose expanded server ids that team's own grant reaches and for which that team is the attributed source; an empty or missing limit, an unattributed
      server and any error give no entry or None.
    proof: [rpm-tests]
  - text: >-
      managed_agent_servers intersects the agent's servers with every expanded ceiling and the caller ceiling, returns them sorted for an autonomous agent, nothing for a delegated agent with no user, and the
      human's servers (limited to the agent's team, or to no team when it has none) for a delegated agent; any failure is the 503 policy_unavailable identity failure.
    proof: [managed-tests]
  - text: The access requirement settings default to false and load from general_settings.require_key_mcp_access_defined and general_settings.require_end_user_mcp_access_defined.
    proof: [config-tests]
  - text: The production reads map a team row, a budget outcome and a read error to SourceTeam, BudgetState and AccessReadError.
    proof: [reads-tests]
  - text: Helper cases for scoped_source_auth and the attribution choice are present, replay through the shared parser and agree with LiteLLM.
    proof: [helper-case-corpus, helper-python, helper-tests, oracle]

checks:
  optional: []
  commands:
    - id: server-access-tests
      why: the combination of key, team and ceilings, its scope value or its deny-on-fault guard is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^access::server_access::tests::/)'
    - id: sources-tests
      why: the admitted subject sources, source grants or the admitted union are missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^access::sources::tests::/)'
    - id: roster-tests
      why: the roster and budget gate on a team source is missing or lets a non-member or over-budget team grant servers
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^access::roster::tests::/)'
    - id: attribution-tests
      why: the billing source choice or billing_auth_for_tool_call is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^access::attribution::tests::/)'
    - id: rpm-tests
      why: the per-team rpm limit map is missing or charges a team that did not provide the access
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^access::rpm_limits::tests::/)'
    - id: managed-tests
      why: the managed agent server list, the delegated human subject or the policy_unavailable conversion is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^access::managed_agents::tests::/)'
    - id: source-auth-tests
      why: scoped_source_auth, billed_auth or the identity views are missing or carry the wrong fields
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^source_auth::tests::/)'
    - id: config-tests
      why: the access requirement settings do not load or have the wrong defaults
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_access_requirements::/)'
    - id: reads-tests
      why: the production reads map a store result to the wrong port value
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::source_reads::tests::/)'
    - id: helper-tests
      why: the helper adapter does not reach the production functions
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::mcp::b4671::/) - test(/replays_the_/)'
    - id: helper-python
      why: the Python helper adapter is missing or fails the strict checks
      run: test -f tools/oracle/helpers/b4671.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-access helper case reaches the shared parser
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-access-*')" && grep -rlq b4671 tools/oracle/fuzz/corpus/helper_case/mcp-access-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

