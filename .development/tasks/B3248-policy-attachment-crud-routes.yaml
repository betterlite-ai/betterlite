id: B3248
title: Policy and attachment CRUD routes
description: >-
  Build the ten HTTP routes that list, create, read, update and delete single policies and policy attachments, plus the pure body decoders they
  use. LiteLLM keeps them in policy_endpoints.py. B3241 gives the in-memory policy and attachment registries (with `list_config_policies` and
  `get_config_attachments`), B3242 gives the request and response records and the single-row lookup `get_policy_by_id_from_db`, B3243 gives the
  database operations (`add_policy_to_db`, `update_policy_in_db`, `delete_policy_from_db`, `get_all_policies_from_db`,
  `resolve_guardrails_from_db`, `add_attachment_to_db`, `get_attachment_by_id_from_db`, `delete_attachment_from_db`,
  `get_all_attachments_from_db`) and B3245 gives `PolicyValidator::find_invalid_scope_entries`. Use the exact names and types as they exist
  when you start and re-implement none of them. Other tasks own the rest of the `/policies` paths: B3244 the version routes (`/policies/name/...`,
  `/policies/{policy_id}/status`, `/policies/compare`), B3247 `POST /policies/test-pipeline`, B3249 `POST /policies/attachments/estimate-impact`,
  B3250 `/policies/resolve` and the `/policy/...` routes. This task registers none of those.

  All code goes in crates/betterlite-server/src/policy_crud_routes.rs and policy_crud_routes/ (routes.rs, config_view.rs, request.rs,
  error.rs). The state struct `PolicyCrudState` takes through its constructor: the B3243 persistence handle as an `Option` (`None` stands for
  LiteLLM's `prisma_client is None`), the policy registry handle, the attachment registry handle and the `PolicyValidator`. LiteLLM's
  `get_policy_registry()` and `get_attachment_registry()` singletons and its `from litellm.proxy.proxy_server import prisma_client, llm_router`
  imports become those handles; the task holds no module-level state. Every route has tag `Policies` and sits in the standard authenticated group
  (B003, B855, B756 and B732 own the auth). `created_by` and `updated_by` are the authenticated key's `user_id` from B732's principal. The routes
  are listed with their LiteLLM line ranges below. Errors use `PolicyCrudError`, a `thiserror` enum in error.rs that turns into the JSON
  `{"detail": <text>}` body with the status named in each route. Log each handled failure at error level with the prefix shown (LiteLLM's
  `verbose_proxy_logger.exception`); a deliberate 404 or 400 raised as `HTTPException` is not logged.

  Routes that need the database check it first: with no database they answer HTTP 500 with `detail` `Database not connected`, after the body
  validation (a bad body is 422 even with no database). `GET /policies/list` and `GET /policies/attachments/list` do not check it and just skip the
  database half.

  Policies (policy_endpoints.py L67-L219 and L383-L555):
  - GET `/policies/list`, optional query `version_status`. Read the database rows with `get_all_policies_from_db(version_status)` (empty when
    there is no database). Collect the names of rows whose `version_status` is `production`. Config policies are added only when `version_status`
    is absent or `production`, skipping every config policy whose name is in that set. Each config policy becomes a `PolicyDBResponse` in
    config_view.rs: `policy_id` and `policy_name` both the config name, `version_number` 1, `version_status` `production`, `inherit` and
    `description` from the policy, `guardrails_add` and `guardrails_remove` the policy's add and remove lists (empty when unset), `condition`
    and `pipeline` the full dumped JSON of the config objects or null when absent, `definition_location` `config`, and every other field at its
    default (dates and users null). Return `PolicyListDBResponse` with database rows first, then config rows, and `total_count` the length of the
    joined list. A version_status that is not draft, published or production is not an error (empty database part, config part only for the
    names above). Failure prefix `Error listing policies: `, status 500.
  - POST `/policies`, body `PolicyCreateRequest`. Call `add_policy_to_db(request, created_by)` and return its `PolicyDBResponse`. On a failure whose
    text, lowercased, contains `unique constraint` the answer is 400 with `Policy with name '<policy_name>' already exists`; every other failure
    is 500 with the error text. Prefix `Error creating policy: `.
  - GET `/policies/{policy_id}`. `get_policy_by_id_from_db`; a missing row is 404 `Policy with ID <policy_id> not found`; other failures 500
    (prefix `Error getting policy: `).
  - PUT `/policies/{policy_id}`, body `PolicyUpdateRequest`. Read the row; missing is 404 with the same text. A row whose `version_status` is not
    `draft` is 400 `Only draft versions can be updated. Publish or create a new version to change published/production.` (this is the route's text;
    B3243's plain error text is different and never reaches the client). Otherwise call `update_policy_in_db(policy_id, request, updated_by)` and
    return the row. Other failures 500, prefix `Error updating policy: `.
  - DELETE `/policies/{policy_id}`. Read the row; missing is 404 `Policy with ID <policy_id> not found`. Then `delete_policy_from_db(policy_id)` and
    return its map unchanged (`message`, and `warning` when a production row was deleted). Other failures 500, prefix `Error deleting policy: `.
  - GET `/policies/{policy_id}/resolved-guardrails`. Read the row (missing is 404 as above), call `resolve_guardrails_from_db(policy_name)` and
    return `{"policy_id", "policy_name", "resolved_guardrails"}` (the sorted list). Every failure is 500 with the error text, prefix
    `Error resolving guardrails: `. The LiteLLM handler also has an `except ValueError` branch for 400, but `resolve_guardrails_from_db` wraps every
    error in a plain `Exception`, so that branch never fires at the pin; do not build it.

  Attachments (policy_endpoints.py L561-L889):
  - GET `/policies/attachments/list`. Database rows from `get_all_attachments_from_db` (none when there is no database), then one row per config
    attachment: `attachment_id` `config-<index>` (index in the config list, starting at 0), `policy_name` the attachment's policy, `scope`, `teams`,
    `keys`, `models` and `tags` (empty when unset), `priority`, `default`, `definition_location` `config`, the rest at defaults. Return
    `PolicyAttachmentListResponse` with `total_count` the joined length. Failure prefix `Error listing policy attachments: `, 500.
  - POST `/policies/attachments`, body `PolicyAttachmentCreateRequest`. In this order: (1) `get_all_policies_from_db(version_status="production")` and
    check that `policy_name` is among those names, else 404 `Policy '<policy_name>' not found. Create the policy first.`; (2) call
    `find_invalid_scope_entries(policy_name, teams, keys, models)` (tags are not checked) and, when it returns errors, answer 400 with each error's
    `message` joined by ` | `; (3) `add_attachment_to_db(request, created_by)` and return the row. Other failures 500, prefix
    `Error creating policy attachment: `.
  - GET `/policies/attachments/{attachment_id}`. Missing is 404 `Attachment with ID <attachment_id> not found`; other failures 500, prefix
    `Error getting policy attachment: `.
  - DELETE `/policies/attachments/{attachment_id}`. Read the row first (missing is the same 404), then `delete_attachment_from_db` and return its
    `{"message": ...}`. Prefix `Error deleting policy attachment: `, other failures 500.

  Routing. Axum picks static segments over parameters, so `/policies/list`, `/policies/attachments/...`, B3244's `/policies/compare` and
  `/policies/name/...` win over `/policies/{policy_id}`. The umbrella (B079) composes this router with the others and never registers a path again.

  Body decoders in request.rs pull the three JSON bodies out of bytes and return the shared 422 on failure: `decode_policy_create(bytes: &[u8]) ->
  Result<PolicyCreateRequest, PolicyCrudRequestError>`, `decode_policy_update(bytes: &[u8]) -> Result<PolicyUpdateRequest, PolicyCrudRequestError>` and
  `decode_attachment_create(bytes: &[u8]) -> Result<PolicyAttachmentCreateRequest, PolicyCrudRequestError>`. Each takes a JSON object and ignores
  unknown fields. `policy_name` is required in create and attachment bodies; list fields hold strings; `condition` is an object whose optional
  `model` is a string; `pipeline` is any JSON object; `priority` is an integer in -2147483648..=2147483647; `default` is a boolean. Add one cargo-fuzz
  target that feeds all three decoders.

  Tests. Name native tests under `policy_crud_routes::tests` with the prefixes `policy_`, `attachment_`, `config_` and `body_`, since the checks filter
  on them. The `policy_` and `attachment_` tests run each route against a real Postgres through POSTGRES_TEST_URL or testcontainers, with the
  registries built by B3241, and also cover the no-database 500. The `config_` tests build the config-policy and config-attachment rows from a
  registry loaded with config and check the list merge rules. The `body_` tests check the decoders. There are no helper cases: the routes read
  and write rows and registries, which a helper adapter cannot do.

  Oracle. HTTP cases go in tools/oracle/cases/policies/crud/. They send the real request to the booted proxy with the master key, an empty config
  and no database. They cover the two list routes (200 with empty lists), the 500 for every database route, the 422 for a bad body, and the 401
  without a key. The database paths are covered by the native tests.

