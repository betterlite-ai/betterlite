deviations:
  - what: GET `/policies/attachments/resolved-guardrails` reaches the attachment route (attachment id `resolved-guardrails`) and answers as a missing attachment. In LiteLLM it reaches the resolved-guardrails route for a policy whose id is `attachments`.
    why: Axum always prefers the static `attachments` segment, while FastAPI uses registration order; no real policy_id is the string `attachments`, so no usable request changes.
  - what: The 422 body for a bad request body uses the server's shared validation response and wording, not FastAPI's `loc` and `msg` strings.
    why: Every route in the server shares one validation response; status 422 matches.
  - what: Unknown fields in the three bodies are ignored, and the wrong JSON type for a known field is 422.
    why: Pydantic's default config ignores extra fields, and the decoders do the same.

out_of_scope:
  - "B3241 owns the in-memory registries, `list_config_policies` and `get_config_attachments` (policy_registry.py, attachment_registry.py); this task only reads them."
  - "B3242 owns the request and response records, the row adapter and get_policy_by_id_from_db (resolver_types.py L113-L360, policy_registry.py L564-L589)."
  - "B3243 owns every database operation the routes call (policy_registry.py L381-L760 and the attachment registry's database methods)."
  - "B3245 owns PolicyValidator and find_invalid_scope_entries (policy_validator.py L176-L240)."
  - "B3244 owns the version routes (policy_endpoints.py L222-L380); B3247 owns POST /policies/test-pipeline; B3249 and B3250 own the estimate-impact, resolve and /policy/... routes."
  - "B003, B855, B756 and B732 own authentication, route admission, header selection and the principal."

pitfalls:
  - "`resolve_guardrails_from_db` wraps every error in a plain `Exception`, so the handler's `except ValueError` to 400 is dead code: an inheritance cycle or a missing parent gives 500 `Error resolving guardrails from DB: ...`."
  - "The PUT draft check answers 400 `Only draft versions can be updated. Publish or create a new version to change published/production.`, while `update_policy_in_db` raises its own shorter text; the route checks first, so only the route's text is ever seen."
  - "In list_policies only production database rows hide a config policy. A draft or published row with the same name leaves the config row in the list, and a `version_status=draft` query returns no config rows at all."
  - "A config policy's `condition` is dumped from a model with `model` as a string, a list or null, and `pipeline` is dumped with every default field, so both are full JSON objects (null only when the config has none)."
  - "Config attachment ids are `config-<index>` over the config list alone, so the index does not shift when database rows are added to the list."
  - "POST /policies/attachments looks the policy up among production rows only, so a policy that exists only as a draft or published version is 404 `Policy '<name>' not found. Create the policy first.`."
  - "Scope errors from `find_invalid_scope_entries` cover teams, keys and models; `tags` entries are never validated."
  - "`/policies/list` and `/policies/attachments/list` work with no database (config rows only), while all other routes here answer 500 `Database not connected`."
  - "The unique-constraint check on POST /policies is a lowercase substring test on the error text, so it relies on B3243 passing the database message through in its error text."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
