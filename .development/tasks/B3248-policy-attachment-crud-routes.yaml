dod:
  - text: >-
      GET /policies/list returns database rows first and then config policies not hidden by a production database row, adds config rows only when
      version_status is absent or production, and builds each config row with LiteLLM's field values.
    proof: [config-tests, policy-route-tests, oracle]
  - text: >-
      GET /policies/attachments/list returns database rows first and then config attachments with ids config-<index> and definition_location config.
    proof: [config-tests, attachment-route-tests, oracle]
  - text: >-
      POST /policies returns the created row, answers 400 `Policy with name '<name>' already exists` for a unique-constraint failure and 500 for
      other failures.
    proof: [policy-route-tests]
  - text: >-
      GET, PUT and DELETE /policies/{policy_id} answer 404 `Policy with ID <id> not found` for a missing row; PUT answers 400 for a non-draft row with
      the route's text and returns the updated row for a draft.
    proof: [policy-route-tests]
  - text: >-
      DELETE /policies/{policy_id} returns the persistence map including its warning, and the resolved-guardrails route returns the sorted list with
      policy_id and policy_name and answers 500, never 400, for a resolution failure.
    proof: [policy-route-tests]
  - text: >-
      POST /policies/attachments answers 404 for a policy without a production row, 400 with the scope errors joined by ` | ` and the created row
      otherwise, in that order.
    proof: [attachment-route-tests]
  - text: >-
      GET and DELETE /policies/attachments/{attachment_id} answer 404 `Attachment with ID <id> not found` for a missing row and return the row or
      the delete message otherwise.
    proof: [attachment-route-tests]
  - text: >-
      Every database route answers 500 `Database not connected` with no database, after the body validation, and a bad or missing body is 422.
    proof: [policy-route-tests, attachment-route-tests, oracle]
  - text: >-
      The three body decoders reject malformed bytes and wrong shapes (including a priority outside the int32 range) without panicking and have
      committed corpus inputs.
    proof: [body-tests, request-corpus]

checks:
  optional: []
  commands:
    - id: policy-route-tests
      why: a policy route, its status mapping or its no-database answer is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_crud_routes::.*tests::policy_/)'
    - id: attachment-route-tests
      why: an attachment route, its check order or its status mapping is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_crud_routes::.*tests::attachment_/)'
    - id: config-tests
      why: the config row converters or the list merge rules are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_crud_routes::.*tests::config_/)'
    - id: body-tests
      why: a body decoder accepts a wrong shape or rejects a valid one
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_crud_routes::.*tests::body_/)'
    - id: request-corpus
      why: the body decoders have no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/policy_crud_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_policy_crud_request_corpus)'

