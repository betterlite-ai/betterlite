id: B251
title: Failure callback dispatch and partial usage
description: >-
  Implement record_partial_usage_for_failure, record_assembled_response_for_failure, dispatch_failure_handlers,
  _failure_handler_helper_fn, special_failure_handlers, failure_handler/_failure_handler_body, async_failure_handler/_async_failure_handler_body
  and _should_run_sync_failure_callbacks_for_async_calls. Preserve partial usage and exactly-once sync/async claims,
  sanitize diagnostics, restore context and enqueue without awaiting capacity. Router/cache/spend-specific special
  handlers remain B016/B125/B069. Budget 280 logic/types, 120 Rust/Python adapters, 300 tests and 60 wiring (760
  total). Write the behavior rstest functions logging_failure_behavior_tests_behavior in adjacent tests.rs files, with a named
  case for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation logging_failure is already registered; each operation has its
  own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/lib.rs
  - crates/betterlite-logging/src/error.rs
  - crates/betterlite-logging/src/logging_failure.rs
  - crates/betterlite-logging/src/logging_failure/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/logging/failure.rs
  - tools/oracle/src/helpers/logging/failure/**
  - tools/oracle/helpers/logging_failure.py
  - tools/oracle/helpers/logging_failure/**
  - tools/oracle/cases/helpers/logging-failure/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
