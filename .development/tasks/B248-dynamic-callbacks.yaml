id: B248
title: Per-request callback selection
description: >-
  Implement add_dynamic_callback, _with_dynamic_callback, process_dynamic_callbacks, _process_dynamic_callback_list,
  _resolve_dynamic_callback_string and initialize_standard_callback_dynamic_params; also get_combined_callback_list
  and the callback-name/internal-callback helpers (4037-4106). Resolve only installed B189 enum variants, preserve
  dynamic/global selection and B188 privacy/provenance, and reject unavailable callbacks explicitly. No Python import
  machinery. Budget 280 logic/types, 120 Rust/Python adapters, 300 tests and 60 wiring (760 total). Write the behavior
  rstest functions dynamic_callbacks_behavior_tests_behavior in adjacent tests.rs files, with a named case for each behavior
  and failure in the DoD; corpus replay tests have separate names. The helper operation dynamic_callbacks is already registered; each operation has its own Rust and Python
  adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/lib.rs
  - crates/betterlite-logging/src/error.rs
  - crates/betterlite-logging/src/dynamic_callbacks.rs
  - crates/betterlite-logging/src/dynamic_callbacks/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/logging/dynamic_callbacks.rs
  - tools/oracle/src/helpers/logging/dynamic_callbacks/**
  - tools/oracle/helpers/dynamic_callbacks.py
  - tools/oracle/helpers/dynamic_callbacks/**
  - tools/oracle/cases/helpers/dynamic-callbacks/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L729-L858
  why: Primary source seam; additional named methods below.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L729-L738
  why: add_dynamic_callback
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L741-L745
  why: _with_dynamic_callback
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L747-L776
  why: process_dynamic_callbacks
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L778-L811
  why: _process_dynamic_callback_list
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L813-L849
  why: _resolve_dynamic_callback_string
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L851-L858
  why: initialize_standard_callback_dynamic_params
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L4037-L4040
  why: get_combined_callback_list
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::dynamic_callbacks_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'dynamic_callbacks' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/dynamic-callbacks/dynamic-input.yaml
- tools/oracle/cases/helpers/dynamic-callbacks/dynamic-success.yaml
- tools/oracle/cases/helpers/dynamic-callbacks/dynamic-failure.yaml
- tools/oracle/cases/helpers/dynamic-callbacks/global-merge.yaml
- tools/oracle/cases/helpers/dynamic-callbacks/internal-filter.yaml
- tools/oracle/cases/helpers/dynamic-callbacks/unknown-callback.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B190 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
- >-
  Exporter-specific setup/delivery B110-B118; prompt management methods 1012-1312 B117; MCP hooks 1633-1709 B140;
  cost and baseline helpers 1719-2115/2395-2451 B068/B069/B125; background interactions B098; native response logging
  4147-4320 B080/B081/B098; A2A response conversion 4322-4343 B142.
- >-
  Enterprise callback controls are excluded by repository licensing rules; no enterprise implementation is read
  or ported.
pitfalls:
- 'The oracle helper for this task is pre-registered as dynamic_callbacks in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/dynamic_callbacks.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/dynamic_callbacks.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
