id: B4060
title: Prompt backend registration and registry mutation
description: >-
  Build supported backend initializer selection and ordered registration, replacement,
  database synchronization and deletion. Implement get_prompt_initializer_from_integrations:
  a function that discovers and collects prompt initializer callables (from dotprompt,
  gitlab, bitbucket, generic_prompt_management) into a registry keyed by integration name.
  Use a closed native enum of supported integrations (compile-time known) instead of scanning
  directories at runtime, so the available backends are static and adding a new integration
  requires code changes and recompilation.

  Extend InMemoryPromptRegistry with initialize_prompt: store the parsed prompt and callback
  in both maps (by registry_key_for_prompt result), look up the initializer by integration
  name, call it with (litellm_params, prompt), validate the result is a PromptManagementClient,
  and register the callback with betterlite-logging's add_litellm_callback. Implement
  _build_prompt_callback: extract and parse litellm_params, validate prompt_integration
  presence, call the initializer, and return both the parsed PromptSpec and callback.
  Implement reload_prompt: build a new callback, remove the stale callback from all lists,
  build and register the new one, update both maps. Implement sync_prompt_from_db: compare
  a database-loaded prompt to the in-memory version; skip reload if litellm_params and
  prompt_info are equal (using value equality, not identity), otherwise call reload_prompt.

  Implement remove_prompt by registry_key: pop both maps and call remove_callback_from_all_lists
  if a callback exists. Implement delete_prompts_by_base_id: find all keys matching the
  base_prompt_id (scoped to optional environment), delete each one via remove_prompt, and
  return the list of deleted registry keys. Declare the module-level IN_MEMORY_PROMPT_REGISTRY
  singleton as InMemoryPromptRegistry().

  Preserve: the equality test in sync_prompt_from_db (skip reload if litellm_params and
  prompt_info are equal), callback removal ordering (pop dict entry, then call remove_callback_from_all_lists),
  construction of replacement callback before removing the stale one, and ValueError for
  missing integration/unsupported type (endpoint code maps these to HTTP 400).
