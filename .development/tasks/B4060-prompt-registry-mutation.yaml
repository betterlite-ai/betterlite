dod:
  - text: get_prompt_initializer_from_integrations returns a map of integration names to initializer callables (or similar) for dotprompt, gitlab, bitbucket, and generic_prompt_management, without scanning directories at runtime.
    proof: [initializer-discovery-tests]
  - text: A module-level prompt_initializer_registry constant holds the initializers, keyed by integration name, and is populated once on module load (not lazily).
    proof: [registry-population-tests]
  - text: initialize_prompt stores the parsed PromptSpec and callback in both IN_MEMORY_PROMPTS and prompt_id_to_custom_prompt by registry_key_for_prompt result, calls add_litellm_callback, and returns the PromptSpec.
    proof: [initialize-prompt-tests]
  - text: initialize_prompt returns early and unchanged on repeat call with the same registry key, without rebuilding the callback.
    proof: [initialize-idempotent-tests]
  - text: _build_prompt_callback extracts litellm_params, validates prompt_integration presence, looks up the initializer, calls it with (litellm_params, prompt), validates result type, and returns (PromptSpec, PromptManagementClient) tuple.
    proof: [callback-build-tests]
  - text: reload_prompt constructs the replacement callback first, then removes the stale one; if construction fails, the stale callback remains registered.
    proof: [reload-safety-tests]
  - text: reload_prompt updates both maps in place and calls remove_callback_from_all_lists before adding the new callback.
    proof: [reload-order-tests]
  - text: sync_prompt_from_db uses value equality (==) to compare litellm_params and prompt_info; if both equal the existing values, skip reload.
    proof: [sync-equality-tests]
  - text: sync_prompt_from_db initializes a not-yet-registered prompt and reloads if either litellm_params or prompt_info differs.
    proof: [sync-init-and-reload-tests]
  - text: remove_prompt by registry_key pops both maps and calls remove_callback_from_all_lists if a callback was found; absent prompts are handled gracefully.
    proof: [remove-prompt-tests]
  - text: delete_prompts_by_base_id finds all registry keys with matching base_prompt_id (filtered by environment if given), calls remove_prompt for each, and returns the list of deleted keys.
    proof: [delete-by-base-id-tests]
  - text: IN_MEMORY_PROMPT_REGISTRY is instantiated once at module level as InMemoryPromptRegistry().
    proof: [module-singleton-tests]
