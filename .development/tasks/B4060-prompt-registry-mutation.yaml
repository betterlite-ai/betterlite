oracle_cases: []
deviations:
  - what: betterlite uses a compile-time known set of supported integrations instead of scanning directories at runtime; the available backends are static and adding a new integration requires code changes and recompilation.
    why: Runtime module discovery via importlib and dynamic registry updates are not idiomatic in Rust; static composition is safer and decouples startup from filesystem state.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_registry.py#L99-L163
out_of_scope:
  - litellm/proxy/prompts/prompt_registry.py:21-96 (get_base_prompt_id, get_version_number, prompt_environment_or_default, registry_key_for_prompt, parse_prompt_version, _spec_version, _default_serve_environment); owned by B4059 for registry selection.
  - litellm/proxy/prompts/prompt_registry.py:171-183 (InMemoryPromptRegistry.__init__); owned by B4059.
  - litellm/proxy/prompts/prompt_registry.py:267-308 (resolve_prompt_spec, get_prompt_callback_for_prompt, has_config_prompt); owned by B4059 for lookups.
  - Langfuse and Arize Phoenix prompt initializers; question 3 in the outline notes these are unresolved owners and must be assigned separately.
  - The B4058 completion-hook adapters (get_chat_completion_prompt, async_get_chat_completion_prompt); registration stores compiler identity but does not invoke those hooks.
  - Custom Python extension execution through prompt management hooks; this task builds the registration machinery only.
pitfalls:
  - initialize_prompt returns early without rebuilding the callback when registry_key is already in IN_MEMORY_PROMPTS (LiteLLM lines 198-200); tests must verify that the cached PromptSpec is returned unchanged on repeat calls.
  - The equality check in sync_prompt_from_db compares litellm_params and prompt_info using ==, not reference equality; if PromptLiteLLMParams or PromptInfo implements __eq__ in Rust, the comparison must honor that implementation.
  - reload_prompt constructs a new callback first, then removes the stale one; if callback construction fails, the exception propagates and the old callback remains registered (no automatic rollback).
  - The supported integrations set must be closed (known at compile time); runtime discovery by scanning directories is not done in betterlite.
  - The registry key includes the environment (from registry_key_for_prompt); deleting without specifying environment deletes all versions of a prompt across every environment.
  - Initializer functions return PromptManagementClient; the return type validation (checking isinstance/match in LiteLLM, type checking in Rust) is essential and not optional.
  - IN_MEMORY_PROMPTS and prompt_id_to_custom_prompt maps are keyed by registry_key_for_prompt result and must stay synchronized; every mutation operation must update both or update neither.
  - Callback unregistration calls remove_callback_from_all_lists from the logging callback manager (B189, external); this is not a local remove operation and cannot fail silently without losing registered callbacks.
  - Arize Phoenix is reachable through automatic discovery in LiteLLM; question 3 in the outline notes it requires explicit ownership assignment if betterlite intends to support it.
