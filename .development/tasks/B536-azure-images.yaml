id: B536
title: Azure image generation and edits
description: >-
  Compose Azure image generation/edit mappings with shared OpenAI typed image types and Foundry Flux/MAI URL selection.
  Preserve body-model removal only for deployment URLs, masks and multipart metadata, v1 path/query handling and
  model family dispatch. The tiny inherited config classes in image_generation are aliases over OpenAI image mappings.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.create_azure_base_url
  L1090-L1140; AzureChatCompletion.aimage_generation L1142-L1226; AzureChatCompletion.image_generation L1228-L1360.
  litellm/llms/azure/image_generation/__init__.py: get_azure_image_generation_config L20-L34. litellm/llms/azure/image_edit/transformation.py:
  AzureImageEditConfig.azure_deployment_image_edit_form_data L15-L25; AzureImageEditConfig.validate_environment
  L27-L68; AzureImageEditConfig.get_complete_url L70-L135; AzureImageEditConfig.finalize_image_edit_request_data
  L137-L138.


  Reuse the existing image reply decoder from the image-generation result owner; this slice adds no parallel JSON
  parser.


  Reuse BaseAzureLLM._base_validate_azure_environment from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse BaseAzureLLM.get_azure_v1_image_url from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: deployment_body_drops_model: Edit finalization removes model only when request URL contains
  both images/edits and /openai/deployments/; preserve model everywhere else. Generation body rewrites and preview
  polling are delegated to B535 and keep its three URL/body-shape cases. dalle2_dalle3_gpt_selection: Lowercase
  model and remove hyphens/underscores; empty or containing dalle2 selects DALL-E2, then dalle3, then B554 MAI,
  otherwise GPT-image with debug logging. The selector never returns None. Async applies every selected response
  transform; sync special-cases only MAI and otherwise uses B004 generic image projection. image_edit_deployment_url:
  Edit auth builds GenericLiteLLMParams and fills its api_key from the positional argument only when params.api_key
  is None (empty blocks that fill), then calls B2200 auth. Base resolves explicit/global/AZURE_API_BASE or raises
  the exact Azure-AI-Studio ValueError. Version resolves params, litellm.api_version, AZURE_API_VERSION, then 2025-02-01-preview.
  preview_image_path: Dated generation keeps a base containing /openai/deployments/ unchanged before blindly appending
  /images/generations?api-version=<version>; otherwise append /openai/deployments/<model> first. This legacy concatenation
  does not preserve an existing query like the v1 helper does. flux2_and_mai_target: URL base is azure_endpoint
  or base_url or empty, stripped of trailing slashes; None model becomes empty. MAI predicate receives base_model
  or model and wins before FLUX2 (which uses deployment model alone), then B2200 v1 handling, then dated deployment
  routing. configured_base_query: Edit first asks B2200 for the v1 image URL. Dated edit copies original query to
  a dict, preserves existing api-version including empty, and appends /openai/deployments/<model>/images/edits through
  B668 only if /openai/deployments/ is absent anywhere in the base string; otherwise retain even a deployment base
  missing the edits suffix. azure_image_body_and_retry: Normalize falsy model to None. If response and litellm_params.base_model
  are non-None set hidden model; pop extra_body default {}, flatten it over options, then build {model:base_model-or-model,prompt,**flattened}.
  Pop max_retries literal default 2, rejecting non-int (including explicit None, but not bool) with AzureOpenAIError
  422 max retries must be an int; the popped value is not sent to initializer. azure_image_auth: Copy litellm_params
  then overlay non-None azure_ad_token/provider and initialize B531 with is_async=False even for async image calls.
  B529 preserves existing auth header names case-insensitively or supplies token/key and redacts telemetry; do not
  log the raw credentials. Both image send helpers receive client=None regardless of the supplied client. azure_image_errors:
  Async logs and rethrows original exceptions. Sync preserves AzureOpenAIError, otherwise wraps str(error) with
  its non-None status_code or 500; it does not forward error headers.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-azure/src/images.rs with adjacent tests under images/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation azure_images in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function images_cases in betterlite-azure with these exact named cases (one per oracle file): deployment_body_drops_model,
  v1_keeps_model, dalle2_dalle3_gpt_selection, image_edit_deployment_url, preview_image_path, flux2_and_mai_target,
  configured_base_query, azure_image_body_and_retry, azure_image_auth, azure_image_errors. Each case exercises its
  named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_images* using HelperCase: kind: helper
  and the externally tagged azure_images variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_images that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 353 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 375 production lines, 255 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 770 planned, 775 maximum changed lines.
