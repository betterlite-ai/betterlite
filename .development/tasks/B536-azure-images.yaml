  commands:
  - id: case-deployment-body-drops-model
    why: The deployment-body-drops-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::images_cases::case_[0-9]+_deployment_body_drops_model$/)'
  - id: case-v1-keeps-model
