  - id: case-v1-keeps-model
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-images/v1-keeps-model.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::images_cases::case_[0-9]+_v1_keeps_model$/)'
  - id: case-dalle2-dalle3-gpt-selection
