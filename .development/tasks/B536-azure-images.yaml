id: B536
title: Azure image generation and edits
description: >-
  Compose Azure image generation/edit mappings with shared OpenAI typed image types and Foundry Flux/MAI URL selection.
  Preserve body-model removal only for deployment URLs, masks and multipart metadata, v1 path/query handling and
  model family dispatch. The tiny inherited config classes in image_generation are aliases over OpenAI image mappings.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.create_azure_base_url
  L1090-L1140; AzureChatCompletion.aimage_generation L1142-L1226; AzureChatCompletion.image_generation L1228-L1360.
  litellm/llms/azure/image_generation/__init__.py: get_azure_image_generation_config L20-L34. litellm/llms/azure/image_edit/transformation.py:
  AzureImageEditConfig.azure_deployment_image_edit_form_data L15-L25; AzureImageEditConfig.validate_environment
  L27-L68; AzureImageEditConfig.get_complete_url L70-L135; AzureImageEditConfig.finalize_image_edit_request_data
  L137-L138.


  Reuse the existing image reply decoder from the image-generation result owner; this slice adds no parallel JSON
  parser.


  Reuse BaseAzureLLM._base_validate_azure_environment from B531 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse BaseAzureLLM.get_azure_v1_image_url from B531 (litellm/llms/azure/common_utils.py); its implementation remains
  with that prerequisite.


  Implement crates/betterlite-azure/src/images.rs with adjacent tests under images/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation azure_images in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function images_cases in betterlite-azure with these exact named cases (one per oracle file): deployment_body_drops_model,
  v1_keeps_model, dalle2_dalle3_gpt_selection, image_edit_deployment_url, preview_image_path, flux2_and_mai_target,
  configured_base_query. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_images* using HelperCase: kind: helper
  and the externally tagged azure_images variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_images that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 353 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 370 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 586 planned, 600 maximum changed lines.
