checks:
  optional:
  - mutants
  commands:
  - id: case-files
    why: Parameterize B516 create, retrieve, delete, list, buffered content and streaming content; retain byte streams
      and pagination parameters.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_resource_dispatch_cases::case_[0-9]+_files$/)'
  - id: case-batches
    why: Parameterize B517 create, retrieve, cancel and list; preserve its endpoint/completion_window and leaf errors.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_resource_dispatch_cases::case_[0-9]+_batches$/)'
  - id: case-fine-tuning
    why: Parameterize B518 create, retrieve, cancel and list with its normalized SDK response.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_resource_dispatch_cases::case_[0-9]+_fine_tuning$/)'
  - id: case-containers
    why: Parameterize B522 container create/list/retrieve/delete and container-file list/content; preserve binary
      file content and path IDs.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_resource_dispatch_cases::case_[0-9]+_containers$/)'
  - id: case-evals
    why: Parameterize B523 eval create/list/get/update/delete/cancel and run create/list/get/cancel/delete, including
      their different ID paths.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_resource_dispatch_cases::case_[0-9]+_evals$/)'
  - id: case-vector-stores
    why: Parameterize every B527 search/create/store lifecycle and attached-file operation listed in that leaf,
      including OpenAI-Beta and its metadata sanitation; use the actual leaf implementation.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_resource_dispatch_cases::case_[0-9]+_vector_stores$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_resource_dispatch.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_resource_dispatch*")"
      && grep -lq 'openai_resource_dispatch' tools/oracle/fuzz/corpus/helper_case/openai_resource_dispatch* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_resource_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_resource_dispatch_unsupported_operation$/)'
