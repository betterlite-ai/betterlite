id: B670
title: OpenAI resource operation composition
description: >-
  Install files, batches, fine-tuning, containers, evals and vector-store operations through exhaustive provider
  dispatch. Each fixture invokes a leaf prepare/decode path using a real dispatcher and fixture transport.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Install these completed leaf operations: B516 OpenAI file lifecycle and streaming content; B517 OpenAI batch lifecycle;
  B518 OpenAI fine-tuning jobs; B522 OpenAI containers and container files; B523 OpenAI evals and eval runs; B527
  OpenAI vector stores and attached files. Each dispatch fixture must reach its leaf with a fake transport and assert
  the resulting request or reply; accept already normalized settings and reuse leaf errors.


  Named case contracts: files: Parameterize B516 create, retrieve, delete, list, buffered content and streaming
  content; retain byte streams and pagination parameters. batches: Parameterize B517 create, retrieve, cancel and
  list; preserve its endpoint/completion_window and leaf errors. fine_tuning: Parameterize B518 create, retrieve,
  cancel and list with its normalized SDK response. containers: Parameterize B522 container create/list/retrieve/delete
  and container-file list/content; preserve binary file content and path IDs. evals: Parameterize B523 eval create/list/get/update/delete/cancel
  and run create/list/get/cancel/delete, including their different ID paths. vector_stores: Parameterize every B527
  search/create/store lifecycle and attached-file operation listed in that leaf, including OpenAI-Beta and its metadata
  sanitation; use the actual leaf implementation.


  Each parameterized operation uses a distinct fixture row in the named case file and reaches the existing leaf
  production entry point. The composition layer introduces no new defaults, headers, errors, parsers or config keys:
  leaf-owned outcomes and warnings pass through unchanged. Test at least one leaf error per family to detect accidental
  conversion to unsupported_operation. No HTTP route is registered or called by these helper cases.


  Implement crates/betterlite-provider/src/openai_resource_dispatch.rs with adjacent tests under openai_resource_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation openai_resource_dispatch in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_resource_dispatch_cases in betterlite-provider with these exact named cases (one
  per oracle file): files, batches, fine_tuning, containers, evals, vector_stores. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_resource_dispatch* using HelperCase: kind:
  helper and the externally tagged openai_resource_dispatch variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_resource_dispatch that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone openai_resource_dispatch_unsupported_operation in betterlite-provider for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 155 production lines, 210 behavior/config-test lines, 145 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 550 planned, 550 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
