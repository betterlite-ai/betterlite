id: B4173
title: Process memory and runtime diagnostic snapshots
description: >-
  Build typed process, cache, router and runtime diagnostic snapshot functions that capture system state at a point in time, independent of HTTP handlers. These functions feed the debug routes registered in B4174 and the config reports built in B4171.


  The snapshots capture process memory usage (RSS, virtual, percent of system), garbage collection statistics, object type histograms, cache memory use, router data structure sizes, and process-level info from /proc/self/statm or psutil. Implement in betterlite-core as pure functions that snapshot data but do not persist or serve HTTP—the routes belong to B4174.


  For process memory, try psutil.Process() first; fall back to reading /proc/self/statm and /proc/meminfo on Linux when psutil is unavailable. On other platforms without psutil, return an unsupported error that handlers can surface as HTTP 501. Memory thresholds are fixed: critical at >80%, warning at >60%, healthy otherwise. When process info cannot be read (psutil fails or /proc is unavailable), return an error-status snapshot so handlers see a consistent response type; on that error, default to healthy status instead of failing the whole endpoint.


  The Rust implementation cannot provide CPython GC generations, object type names, tracemalloc sites, or asyncio coroutine introspection that only Python has. Accepted interim behavior is to return `error.type="unsupported_runtime"` with `error.code="unsupported_runtime"` for endpoints that ask for those measurements; startup GC configuration warns but does not fail. Cache and router snapshots remain independently implementable by reading runtime state without Python introspection.


  Preserve Linux /proc decoding with fuzz coverage, memory threshold comparisons at exact >80 and >60 boundaries, per-section error handling so a cache-read failure does not silence router stats, and deterministic samples in tests so dynamic runtime measures can be validated.
scope:
  paths:
    - crates/betterlite-core/**
    - Cargo.toml
  lint_tables: false
