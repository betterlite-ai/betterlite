id: B8391
title: Policy pipeline slots, streaming gates and model-level guardrails
description: >-
  The policy engine writes its resolved guardrail pipelines into the request's metadata, and ProxyLogging reads them back in several places: which pipelines run now, which guardrails a pipeline already handles, which post-call pipelines a stream can be gated through, and what to withdraw when a background response cannot be checked yet. This task ports those readers and the model-level guardrail merge, as plain functions over `serde_json::Map<String, Value>` request data. Code goes in crates/betterlite-server/src/guardrails/pipeline_slots.rs and pipeline_slots/ (slots.rs, streaming.rs, deferral.rs, model_guardrails.rs, tests.rs). Pipelines are B3247's `GuardrailPipeline` values with `mode` and `steps`.

  slots.rs. `policy_state_metadata(data)` (L547-L566) returns the first of `metadata` and `litellm_metadata` that is a map holding `_guardrail_pipelines` or `_pipeline_managed_guardrails`, else an empty map. `policy_pipelines(data)` (L569-L575) reads `_guardrail_pipelines` from it as (policy name, pipeline) pairs. `step_guardrail_names(pipelines)` (L578-L579), `pipeline_managed_names(data, mode)` (L582-L587, pre_call or post_call) and `post_call_pipelines(data)` (L652-L655). `merge_pipeline_metadata_writes(data, modified)` (L610-L636) copies each of the two buckets from the pipeline's working copy back onto the request, skipping the `guardrails` key; a bucket that is not a map is ignored, and a missing bucket on the request is created. `is_pending_background_response(response)` (L658-L662) is true for a Responses API object whose status is `queued` or `in_progress`.

  streaming.rs. `step_supports_streaming(name, translation, finder)` (L639-L649) asks B3247's `PipelineExecutor` lookups (find_guardrail_callback, supports_unified_execution, supports_streaming_execution) through a small `PipelineCallbacks` trait: no callback is false, unified execution is true, else it needs a translation that assembles streamed responses and a callback with streaming execution. `unsupported_streaming_guardrails` (L777-L786) keeps first-seen order without repeats. `pipeline_is_streamable` (L789-L803) warns with the policy name and the names when anything is unsupported. `stream_gated_guardrail_names(data, translation)` (L811-L823) and `streamable_post_call_pipelines(data, translation, route)` (L826-L858): no post-call pipelines gives none; no translation warns once with the route and the policy names and gives none. The translation comes from B3679's `resolve_endpoint_translation(user_api_key_dict, None)`, taken by the caller and passed in.

  deferral.rs. `defer_post_call_pipelines(data, response_id, status, policies)` (L722-L753) runs when a background response is still pending: it logs at debug, warns when a deferred policy was matched through a request tag (`policy_sources` value containing `tag:`, L756-L766) and when one was selected by the request body (no `policy_sources` entry, L769-L774), then withdraws the claims (L697-L719): policies with no guardrail outside the pipeline leave `applied_policies` and `policy_sources`, and step guardrails that do not run elsewhere (pre-call pipelines, standalone pre-call guardrails, or outside the deferred pipeline) leave `applied_guardrails`. `without_names` (L682-L694) removes the slot entirely when the list ends empty. The two lookups it needs, the policy's resolved guardrail set (`PolicyResolver.resolve_policy_guardrails` in the policy engine; B8399 implements the trait over the policy registry) and the standalone pre-call guardrail names (L672-L679), come in through a `DeferralContext` trait. The metadata bucket is the one `get_or_create_metadata_bucket` picks (B3247 uses the same rule).

  model_guardrails.rs. `check_and_merge_model_level_guardrails(data, router, trust_client_model_info, model_alias)` (L8013-L8097) and `merge_guardrails_with_existing` (L8100-L8125). With no router, return the data unchanged. With a trusted `metadata.model_info.id`, read that deployment's `litellm_params.guardrails` (a list, or one value wrapped); an unknown id returns the data unchanged. Otherwise use the alias (model_alias or data.model), union the guardrails of every deployment in that group for the team id from `metadata` or `litellm_metadata` `user_api_key_team_id`, in first-seen order. The merge works on a copy, sets `metadata.guardrails` to the set union of the existing and model-level names, and never touches the original. The router reaches this file through a `DeploymentGuardrails` trait (get_deployment by id, get_model_list by name and team) that B8399 implements over the router.
