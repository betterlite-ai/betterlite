    - tools/oracle/src/helpers/server/b8391/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L547-L858
    why: Every pipeline slot, streaming gate and deferral function this task ports.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8013-L8125
    why: The model-level guardrail lookup and merge.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/policy_engine/pipeline_executor.py
    why: The PipelineExecutor lookups the streaming checks ask, owned by B3247.
dod:
  - text: policy_state_metadata, policy_pipelines, pipeline_managed_names and merge_pipeline_metadata_writes read and write the buckets like LiteLLM.
    proof: [slots-tests, oracle]
  - text: The streaming gate keeps a pipeline only when every step can run on the stream, and warns when it drops one or the route has no translation.
    proof: [slots-tests]
  - text: Deferring a pending background response warns for tag and body matches and withdraws only claims that nothing else backs.
    proof: [slots-tests]
  - text: Model-level guardrails come from the trusted deployment id or the union over the alias group, and merge into a copy.
    proof: [slots-tests, oracle]
checks:
  optional: []
  commands:
    - id: slots-tests
      why: a pipeline slot reader, streaming gate, deferral step or model guardrail merge is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::pipeline_slots::/)'
oracle_cases:
  - tools/oracle/cases/helpers/pipeline-slots/merge-metadata-writes.yaml
  - tools/oracle/cases/helpers/pipeline-slots/merge-guardrails-with-existing.yaml
  - tools/oracle/cases/helpers/pipeline-slots/policy-state-bucket-choice.yaml
deviations:
  - what: The router, policy registry and pipeline executor reach these functions through traits instead of module globals.
    why: betterlite keeps no globals; the results are the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8037-L8040
out_of_scope:
  - "_maybe_execute_pipelines and _handle_pipeline_result: B8393. _pipeline_gated_stream: B6370."
  - "PipelineExecutor and its lookups: B3247. resolve_endpoint_translation: B3679. PolicyResolver: B3243."
pitfalls:
  - merge_guardrails_with_existing builds a set, so the order of metadata.guardrails is not kept; tests compare as sets.
  - The alias union compares non-string guardrail entries by their text form, so two equal maps count once.
  - With trust_client_model_info false the deployment id is ignored even when present, which is the pre-call path's spoofing guard.
  - merge_pipeline_metadata_writes must not copy the guardrails key, since that is the executor's per-step activation flag.
  - A pending background response defers only post_call pipelines; pre_call pipeline names count as running elsewhere.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
