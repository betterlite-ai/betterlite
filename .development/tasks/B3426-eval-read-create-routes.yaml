deviations:
  - what: "Malformed JSON request bodies return 400 Bad Request with parse error details."
    why: "LiteLLM returns 500 Internal Server Error for malformed JSON because orjson.loads() raises an exception caught by the global exception handler. Betterlite explicitly decodes before the route handler's try block and returns 400 for malformed JSON, providing more specific error information and failing fast on parse errors."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_evals_endpoints/endpoints.py#L76-L77"
out_of_scope:
  - "ProxyBaseLLMRequestProcessing.base_process_llm_request implementation and its internal processing steps; owned by the handler/transport owner identified by B096's external-calls table."
  - "ProxyBaseLLMRequestProcessing._handle_llm_api_exception implementation; owned by the handler/transport owner identified by B096's external-calls table."
  - "Authentication and user_api_key_auth dependency injection; B756 or another auth task owns that."
  - "The concrete operation implementations (acreate_eval, alist_evals, aget_eval) owned by B3421 and B3422; routes only dispatch to them."
pitfalls:
  - "Model selection must check body (truthy), then query, then header `x-litellm-model` in that exact order, despite any comments in LiteLLM suggesting otherwise. Comments in the LiteLLM code are misleading; the actual line order is the authority."
  - "For list_evals, query params are used as defaults only when the same key is absent from the body. A body with null pagination fields still counts as present and blocks the query default."
  - "custom_llm_provider must never default to openai when a body value (including null) is present. Only apply the default when the key is entirely absent from the body."
  - "create_eval accepts metadata in the request but does not pass it to the handler. The handler receives metadata only via extra_body, which can override the request's value."
  - "Path eval_id overwrites body eval_id unconditionally; this is not a precedence rule, it is always the source of truth."
  - "Body parsing with orjson must happen outside the try block so parse errors are visible as 400 responses, not caught by exception handlers."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
