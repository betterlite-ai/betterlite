id: B3426
title: Eval create list and retrieval routes
description: >-
  Register POST and GET `/v1/evals` and GET `/v1/evals/{eval_id}` routes in `betterlite-server::api::eval_read_create_routes`.
  The module exports a function that registers these three routes with the server and returns a router factory. Decode optional request
  bodies with orjson and apply model selection precedence: truthy body `model`, then query `model`, then header `x-litellm-model`.
  For create_eval, accept `metadata` in the request but pass it only when explicitly provided through `extra_body` (create does not
  forward it from the request itself, matching LiteLLM). For list_evals, read an optional GET body and use query defaults (`limit=20`)
  only when absent from that body; merge explicit non-None query params with body params, giving body precedence. Path `eval_id`
  overwrites any body value. A present body `custom_llm_provider`, even when null, is not replaced by the query default `openai`.
  Decode request bodies before the try/catch block so malformed JSON is a 400 parse error. Hand off to authenticated common processing
  through `ProxyBaseLLMRequestProcessing.base_process_llm_request` on route_type `acreate_eval`, `alist_evals`, or `aget_eval`, and
  catch exceptions through `ProxyBaseLLMRequestProcessing._handle_llm_api_exception`. Response models are `Eval` and `ListEvalsResponse`
  from B3420's contracts.
scope:
