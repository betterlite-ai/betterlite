id: B4111
title: Web search tool dialects and interception records
description: >-
  Build three tool definitions for web search, recognition rules that differ by API surface,
  and typed outcomes for search execution. Build the oracle helper cases for all tool detection
  functions: create cases under tools/oracle/cases/helpers/websearch_tools/ that invoke the
  websearch_tools helper (a pure-function oracle helper), register a new HelperCall variant in
  the oracle, and implement tools/oracle/helpers/websearch_tools.py to call the LiteLLM builder
  and detection functions via dispatch. The canonical tool uses the name `litellm_web_search`
  with an input schema offering required `query`, optional `objective` and `search_queries`
  (two to five short strings).

  Export builders for the Anthropic format (plain dict with name, description, input_schema),
  the OpenAI Chat Completions format (function type with nested function dict), and the
  Responses format (flat function type with top-level name/parameters).

  Build three recognition functions. `is_web_search_tool_responses` detects Responses-API tools:
  OpenAI native types prefixed with `web_search_` or `litellm_web_search` as a function.
  `is_web_search_tool_chat_completion` is strict for Chat Completions, matching only the
  exact LiteLLM name in Anthropic or OpenAI format, never native types. `is_web_search_tool`
  is permissive: detects LiteLLM standard, OpenAI format, native Anthropic types, Claude Code's
  `web_search` with a type field, and the legacy `WebSearch` marker — but only when absent of
  an `input_schema`, to avoid hijacking real Cowork client tools that carry their own schema.

  Build typed records for search outcomes: `SearchSucceeded` with text and optional response,
  `SearchFailed` with error code and message, and `SearchOutcome` as their union. Include the
  `RichWebSearchInput` struct (or TypedDict equivalent) projecting optional objective and
  up-to-five search_queries from tool calls. Build `AnthropicSearchQuery` and
  `AnthropicServerToolUseBlock` for native citation blocks in web-search result messages.
  Build the `WebSearchInterceptionConfig` struct with fields for enabled_providers,
  search_tool_name and max_agentic_loops, used in proxy config under litellm_settings.

  The exact error codes in `WebSearchToolResultErrorCode` are invalid_tool_input, unavailable,
  max_uses_exceeded, too_many_requests, query_too_long, request_too_large.

