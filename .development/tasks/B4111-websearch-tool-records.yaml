    - id: websearch-tools-responses
      why: Responses-API detection does not exist or fails on the expected cases
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/web_search_tool_responses/)'
    - id: websearch-tools-chat
      why: Chat Completions detection does not exist or fails on the expected cases
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/web_search_tool_chat_completion/)'
    - id: websearch-tools-general
      why: General tool detection does not exist or fails on the expected cases
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^web_search_tool$/)'
    - id: websearch-tools-types
      why: Type records do not exist or fail structure tests
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/web_search.*type/)'
    - id: behavior-tests
      why: behavior tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail
    - id: websearch-tools-oracle
      why: web search tool detection helper cases fail against LiteLLM
      run: cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/helpers/websearch_tools/

