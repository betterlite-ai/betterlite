pitfalls:
  - 'The oracle helper for this task is pre-registered as websearch_tool_records in the websearch group. Replace the stub Op in tools/oracle/src/helpers/websearch/tool_records.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/websearch_tool_records.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - >-
    The legacy `WebSearch` tool name (lines 296-299 in tools.py) is a marker only when
    `input_schema` is absent. Clients like Cowork send a real `WebSearch` with their own
    schema and expect it to pass through unchanged; matching it would hijack the tool and
    break citation rendering in the client when it sends its own nested `web_search_20250305`
    request.
  - >-
    `is_web_search_tool_responses` accepts native types prefixed `web_search_` (e.g.
    `web_search_20250305`, `web_search_preview_2025_03_11`), but `is_web_search_tool_chat_completion`
    rejects them entirely. Chat Completions never sees native Anthropic types; they only come
    through the Responses path.
  - >-
    `is_web_search_tool` is a union of all three: it must detect the same tool via all three
    routes. A tool with name `litellm_web_search` should match in all three functions, but a
    native `web_search_20250305` should only match `is_web_search_tool_responses` and the general
    `is_web_search_tool`, never the chat-completion-strict check.
  - >-
    The OpenAI format has the tool name nested inside a `function` dict (line 99 in tools.py).
    Both the Chat Completions and Responses detections must check for it; Responses additionally
    accepts native types.
  - >-
    The input schema is mutable-ok in comments (line 20, tools.py) because it's returned fresh
    each time and modified by the caller. In Rust, this suggests owned Vec/HashMap, not borrowed
    slices.

dod:
  - text: >-
      The three tool builders return correctly-shaped dicts: Anthropic with name/description/input_schema,
      OpenAI Chat Completions with type/function/function.name/function.parameters, Responses with
      type/name/description/parameters at the top level. Helper cases pass the oracle against LiteLLM
      for each builder, matching shape and field values.
    proof: [websearch-tools-builders, websearch-tools-oracle]
  - text: >-
      `is_web_search_tool_responses` detects OpenAI native types prefixed `web_search_`,
      `web_search_preview_*` and the function `litellm_web_search`. Helper cases pass against
      LiteLLM for native prefixes, function-format detection and rejection of non-web-search tools.
    proof: [websearch-tools-responses, websearch-tools-oracle]
  - text: >-
      `is_web_search_tool_chat_completion` detects only the exact name `litellm_web_search`
      in Anthropic format or OpenAI function format, never native types. Helper cases pass
      against LiteLLM for exact matches, function nesting and rejection of native types.
    proof: [websearch-tools-chat, websearch-tools-oracle]
  - text: >-
      `is_web_search_tool` detects all three plus Claude Code `web_search` with a type field
      and the legacy `WebSearch` marker without `input_schema`. Helper cases pass against LiteLLM
      for native types, legacy markers, schema-gating and rejection of client tools carrying schema.
    proof: [websearch-tools-general, websearch-tools-oracle]
  - text: >-
      All type records are present: `SearchSucceeded` and `SearchFailed` for outcomes,
      `SearchOutcome` union, `RichWebSearchInput` with optional objective and search_queries,
      `AnthropicSearchQuery`, `AnthropicServerToolUseBlock`, `WebSearchInterceptionConfig`.
    proof: [websearch-tools-types, behavior-tests]
  - text: The exact error codes are `invalid_tool_input`, `unavailable`, `max_uses_exceeded`, `too_many_requests`, `query_too_long`, `request_too_large`.
    proof: [websearch-tools-types]

