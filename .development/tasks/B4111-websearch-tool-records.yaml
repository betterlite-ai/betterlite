deviations:
  - what: |-
      betterlite exports the three tool builders as Rust functions returning serialized JSON,
      while LiteLLM's Python returns dicts. The wire format and contracts downstream stay identical;
      the only observable difference is that builders are functions called at tool-injection time,
      not module-level constants.
    why: Rust's type system requires explicit returns; dynamic dicts are not idiomatic.
  - what: >-
      The `input_schema` is always a newly-constructed dict in LiteLLM and consumed by callers.
      In Rust, builders return owned values so callers can mutate them if needed.
    why: Matching LiteLLM's mutation allowance requires owned types.

out_of_scope:
  - SearchResponse contract, the external search-execution provider record referenced by SearchSucceeded.
  - ProviderConfigManager.get_provider_search_config and ProviderConfigManager.get_provider_anthropic_messages_config.
  - BaseSearchConfig.supports_rich_search_input provider capability checks.
  - The is_anthropic_native_web_search_tool function, owned by B568.
  - Actual search execution or tool interception integration hooks.

