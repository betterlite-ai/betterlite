out_of_scope:
  - "The prompt handlers: B4061 and B4062. The registry and the row conversions: B4059."
  - "Handing the prompt registry to Shared: the foundation parts."
pitfalls:
  - GET /prompts/list must stay a static path next to GET /prompts/{prompt_id}; axum prefers the static segment, so do not add a second list route under the parameter.
  - A missing database answers 500 on writes and is not a reason to skip the mount; the read routes still serve the config prompts from the registry.
