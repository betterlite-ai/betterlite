      why: Agent/MCP filtering, skill hub manifest parsing or HTTP 500 behavior is missing or
        incorrect.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^public_endpoints::resource_hubs::/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^public_endpoints::resource_hubs_/)'
