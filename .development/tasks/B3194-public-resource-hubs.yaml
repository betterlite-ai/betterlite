dod:
  - text: Agent hub returns agents from the global registry filtered by public_agent_groups allowlist,
      with a public URL per agent, or empty list when the allowlist is None.
    proof: [resource-hub-tests, oracle]
  - text: MCP hub returns MCP servers filtered by public_mcp_servers allowlist, with server_id
      membership tested explicitly.
    proof: [resource-hub-tests, oracle]
  - text: Skill hub returns enabled plugins with manifests fully parsed and all string fields
      extracted using .get(), timestamps stringified, and HTTP 500 raised on any exception
      in parsing or field access.
    proof: [resource-hub-tests, oracle, resource-hubs-corpus]
  - text: Config keys litellm_settings.public_agent_groups (set or None) and litellm_settings.public_mcp_servers
      (tuple or None) are read through B002 and default to None and empty tuple respectively.
    proof: [resource-hub-tests]
  - text: Routes are registered at the correct paths and return the correct response models;
      unauthenticated access is allowed on all three.
    proof: [oracle]

