out_of_scope:
  - B4777 owns `global_agent_registry.get_public_agent_list()` and `ids_for_agent()` (litellm/proxy/agent_endpoints/agent_registry.py);
    B3194 calls them to retrieve and filter agents.
  - B136 owns `global_mcp_server_manager.get_public_mcp_servers()` (litellm/proxy/_experimental/mcp_server/mcp_server_manager.py);
    B3194 calls it to retrieve and filter MCP servers.
  - B000 or the Anthropic endpoints module owns `_get_prisma_client` (litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py);
    B3194 uses it to fetch the prisma client for plugin table queries.
  - B002 owns loading config keys `litellm_settings.public_agent_groups` and `litellm_settings.public_mcp_servers`;
    B3194 reads them to filter registries.

pitfalls:
  - The oracle helper for this task is pre-registered as b3194 in the server group. Replace
    the stub Op in tools/oracle/src/helpers/server/b3194.rs with an impl Helper, and write
    run in tools/oracle/helpers/b3194.py. Do not edit the registry files (helpers/mod.rs,
    group files, dispatch.py).
  - >-
    Manifest field extraction must use .get() to return None for missing fields and default
    strings, not raise a KeyError; any exception inside the request handler (json.loads parse
    failure, PluginListItem validation failure, type mismatch) raises HTTP 500, it is not
    handled gracefully.
  - >-
    Agent allowlist filtering uses set.isdisjoint(): if the agent's ID set and the allowlist
    have no common members, the agent is public. An incorrect boolean logic (e.g., all() or
    any() instead of isdisjoint) would expose non-public agents to unauthenticated callers.
  - Timestamps extracted from plugin.created_at and plugin.updated_at are None or datetime;
    stringify them with str() to match the response model type.
  - >-
    MCP server filtering checks server_id membership explicitly; the is_public field in the
    response is always true for servers returned from get_public_mcp_servers, and the
    is_public_explicit field records whether the server_id was in the explicit allowlist.

