id: B3194
title: Public agent MCP and skill hub projections
description: >-
  Build GET `/public/agent_hub`, `/public/mcp_hub` and `/public/skill_hub` in
  `betterlite-server::public_endpoints::resource_hubs`. Each route returns an unauthenticated
  projection of a resource registry filtered by an allowlist setting.

  Agent hub returns agents from the global agent registry where the agent's ID intersects
  `litellm.public_agent_groups` (a set of allowed agent IDs, default empty, loaded through B002).
  Each agent card gets a public URL built from the request base and the agent ID. Return empty
  list if the allowlist is None (feature disabled). MCP hub returns MCP servers where each
  server's `server_id` is in `litellm.public_mcp_servers` (a tuple of allowed IDs, default empty).
  Both read their source registries from globals: `global_agent_registry.get_public_agent_list()`
  (owned by B4777, called without auth) and `global_mcp_server_manager.get_public_mcp_servers()`
  (owned by B2305, called without auth).

  Skill hub returns enabled Claude Code plugins from the database, extracting each
  plugin's manifest JSON into a PluginListItem. Manifest is stored as JSON text or parsed
  object; extract string fields (source, description, version, category, keywords, author,
  homepage, domain, namespace) from the parsed manifest using .get() with defaults. Timestamps
  are stringified. Collect all items into ListPluginsResponse with count. Raise HTTP 500 on
  any exception (parse failure, database error, Prisma lookup failure, type error). Load
  prisma_client through the _get_prisma_client callback from B000's Anthropic endpoints module.

  Load `litellm_settings.public_agent_groups` (default None, type: set[str] or None) and
  `litellm_settings.public_mcp_servers` (default None, type: tuple[str, ...] or None) through B002.
  Register the three routes at `/public/agent_hub`, `/public/mcp_hub` and `/public/skill_hub` in
  B003's server as response-model endpoints returning AgentCard list, MCPPublicServer list and
  ListPluginsResponse respectively. Use B860 Postgres fixtures for plugin table tests and
  database lookup failures. Install oracle cases through the booted proxy. Every call to an
  unresolved callee (global_agent_registry, global_mcp_server_manager, _get_prisma_client,
  _plugin_table, or the response model types) must wait for that task to provide it.

