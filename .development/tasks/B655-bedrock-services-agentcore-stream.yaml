  - id: case-incremental-sse-stream
    why: The incremental-sse-stream behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_stream_cases::case_[0-9]+_incremental_sse_stream$/)'
  - id: case-first-event-inspection
