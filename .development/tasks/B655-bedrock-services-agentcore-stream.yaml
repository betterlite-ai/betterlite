id: B655
title: Bedrock AgentCore streaming adapters
description: >-
  Implement AgentCore stream wrappers and fake-stream fallback with the pinned line protocol, not a standard SSE
  event decoder. Split text chunks on newline, retain only data: lines, parse each line independently as JSON and
  skip invalid JSON; do not join multiple data lines. Each emitted chunk gets a fresh chatcmpl-uuid id and created=0.
  Reuse B654 projections and injected ids, transport and cancellation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/agentcore/transformation.py:
  AmazonAgentCoreConfig._stream_agentcore_response_sync L531-L632; AmazonAgentCoreConfig.get_sync_custom_stream_wrapper
  L634-L750; AmazonAgentCoreConfig._stream_agentcore_response L752-L853; AmazonAgentCoreConfig.get_async_custom_stream_wrapper
  L855-L971.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: incremental_sse_stream: Run every protocol case against both sync and async wrappers. Buffer
  arbitrary text reads until newline; strip each complete line and require data:. Ignore blank/nondata/empty data
  and valid nondict JSON. Parse each remaining line independently; event must be dict. Truthy contentBlockDelta.delta.text
  emits one assistant content delta,finish_reason=None,index0; no text validation beyond source typed constructor.
  nonstream_json_fake_stream: Require HTTP status exactly200 before inspecting lowercased content-type. If it contains
  application/json, read the entire body and parse strict JSON, then B654 _parse_json_response. Emit exactly TWO
  chunks: assistant content (even empty),finish_reason=None, then empty Delta with finish_reason stop. Do not attach
  usage, calculate tokens or honor arbitrary custom_llm_provider; wrap with B005 CustomStreamWrapper provider bedrock.
  Run B654 JSON/A2A/raw fallback cases here. stream_usage: Within one dict event emit text first, then metadata
  usage when metadata truthy and usage KEY exists. Empty {} usage still emits a stop chunk with all counts0; None/wrong
  type fails rather than skipping. Usage inputTokens/outputTokens/totalTokens each default0 independently. A top-level
  dict message then emits another stop chunk; one line can emit content,usage-stop,message-stop in that order. stream_terminal_event:
  Any top-level message dict, even empty, emits an empty stop delta without its content. This does not terminate
  parsing: later lines continue. [DONE] is invalid JSON and skipped, and EOF adds no stop sentinel. Repeated metadata/message
  events may emit repeated stops; only B005 outer stream normalization owns subsequent policy. multiline_data_not_joined:
  Consecutive data: lines parse separately even within one SSE event; do not join them with newline. CRLF is handled
  by line.strip, and leading whitespace before data: is accepted. Split inside JSON text chunks is buffered until
  newline. bad_json_skipped: JSON syntax failures alone debug Skipping non-JSON SSE line: {first100chars} and skip.
  Type/attribute/Usage validation errors propagate through the stream, and are not caught by this JSONDecodeError
  branch. fresh_id_created_zero: Every emitted content,usage and stop chunk independently calls UUID4 and uses id
  chatcmpl-{uuid},created0,model=supplied model,object chat.completion.chunk,index0. Fix UUID sequence in oracle;
  never reuse one completion id across the underlying adapter emissions. unterminated_line: Discard residual buffer
  at EOF even if it contains complete valid JSON after data:. Empty stream yields no chunks. This deliberately differs
  from buffered B654 response parsing. stream_http_request: Use supplied correct-kind HTTPHandler/AsyncHTTPHandler
  or B173 shared default client(params={}, async provider BEDROCK). POST api_base with caller headers,data=truthy
  signed_json_body else json.dumps(data),stream=True,logging_obj; empty signed bytes take JSON fallback. No explicit
  timeout passed. post_call via B249 uses input messages,api_key empty,original_response first stream response received,complete_input_dict
  data only after status200. stream_http_errors: Non200 raises B682 with raw status,headers,response and message
  Python str(response.read/aread bytes), not decoded body text. JSON response read/parse failure -> BedrockError
  raw status/headers and AgentCore: Failed to read/parse JSON response body: {error}. The subsequent B654 projection
  is outside that catch; projection errors propagate directly.


  Cancellation has no explicit branch in the owned LiteLLM methods. Add standalone Rust test agentcore_stream_releases_transport_on_drop
  using a captured upstream stream and B173 transport ownership; keep this resource invariant out of Python differential
  cases.


  Implement crates/betterlite-bedrock/src/agentcore_stream.rs with adjacent tests under agentcore_stream/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agentcore_stream_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): incremental_sse_stream, nonstream_json_fake_stream, stream_usage, stream_terminal_event, multiline_data_not_joined,
  bad_json_skipped, fresh_id_created_zero, unterminated_line, stream_http_request, stream_http_errors. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_agentcore_stream* using HelperCase:
  kind: helper and the externally tagged bedrock_services_agentcore_stream variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_agentcore_stream that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_agentcore_line consumes incremental newline-delimited data: JSON lines, without
  SSE multiline joining in crates/betterlite-bedrock/src/agentcore_stream.rs (or its scoped child module). Add cargo-fuzz
  target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_agentcore_stream.rs calling that exact production
  function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_agentcore_stream.
  The adjacent test replays_the_bedrock_services_agentcore_stream_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 378 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 295 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 770 planned, 775 maximum changed lines.
