id: B655
title: Bedrock AgentCore streaming adapters
description: >-
  Implement AgentCore stream wrappers and fake-stream fallback with the pinned line protocol, not a standard SSE
  event decoder. Split text chunks on newline, retain only data: lines, parse each line independently as JSON and
  skip invalid JSON; do not join multiple data lines. Each emitted chunk gets a fresh chatcmpl-uuid id and created=0.
  Reuse B654 projections and injected ids, transport and cancellation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/agentcore/transformation.py:
  AmazonAgentCoreConfig._stream_agentcore_response_sync L531-L632; AmazonAgentCoreConfig.get_sync_custom_stream_wrapper
  L634-L750; AmazonAgentCoreConfig._stream_agentcore_response L752-L853; AmazonAgentCoreConfig.get_async_custom_stream_wrapper
  L855-L971.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/agentcore_stream.rs with adjacent tests under agentcore_stream/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_agentcore_stream in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agentcore_stream_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): incremental_sse_stream, first_event_inspection, nonstream_json_fake_stream, stream_usage, stream_terminal_event,
  upstream_cancel, multiline_data_not_joined, bad_json_skipped, fresh_id_created_zero, unterminated_line. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use
  the booted proxy and assert both client response and captured upstream request. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_agentcore_stream* using HelperCase:
  kind: helper and the externally tagged bedrock_services_agentcore_stream variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_agentcore_stream that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_agentcore_line consumes incremental newline-delimited data: JSON lines, without
  SSE multiline joining in crates/betterlite-bedrock/src/agentcore_stream.rs (or its scoped child module). Add cargo-fuzz
  target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_agentcore_stream.rs calling that exact production
  function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_agentcore_stream.
  The adjacent test replays_the_bedrock_services_agentcore_stream_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 378 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 395 production lines, 135 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 705 planned, 725 maximum changed lines.
