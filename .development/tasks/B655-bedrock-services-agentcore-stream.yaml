pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_agentcore_stream in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_agentcore_stream.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_agentcore_stream.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A metadata event with usage={} emits a terminal chunk, but usage=None fails; testing only truthy usage misses
  this distinction.
- The final-message event emits only a stop marker, so its text never appears unless content deltas already carried
  it.
