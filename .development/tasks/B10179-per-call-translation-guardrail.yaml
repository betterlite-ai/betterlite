id: B10179
title: BaseTranslation takes the guardrail per call
description: >-
  LiteLLM's BaseTranslation (litellm/llms/base_llm/guardrail_translation/base_translation.py L58-L265) is ported twice. B3661's BaseTranslation (crates/betterlite-guardrails/src/guardrail_translation.rs L55-L129) is the full port, with 16 production implementers in betterlite-server, LlmPassthroughRouteHandler in betterlite-guardrails and the b3679 oracle fake. B3246's StreamTranslation (crates/betterlite-core/src/guardrails/streaming_rewrite/traits.rs L99-L126, commented "LiteLLM's BaseTranslation") is a second port of the stream half, and only two fakes implement it: core's streaming_rewrite/tests.rs L206 and tools/oracle/src/helpers/core_ops/b3246/fakes.rs L144. The second port exists because B3661 fixed the guardrail type per translation (`type Guardrail`, L56), while LiteLLM passes guardrail_to_apply on every call (base_translation.py L148-L201). The pipeline step needs that: in one call it hands the same translation an observer wrapping the guardrail, or an observer wrapping the legacy hook adapter, and the adapter calls the translation again from inside its apply_guardrail with a scanned-text recorder (pipeline_executor.py L222-L265 and L450-L472). Every production translation is built for one guardrail type, GuardrailToApply<G> (crates/betterlite-server/src/guardrails/unified_guardrail/translation.rs L36-L55), so no real translation can be handed to B3246's step and B3247 cannot call it. This task gives BaseTranslation the per-call guardrail. B10182 then moves the step onto it and deletes StreamTranslation, so the class is ported once. Line numbers here are main at 1b9a032aedd; B10169 lands first and shifts some of them.


  The trait stays in betterlite-guardrails. Its signature is made of guardrails types (GuardrailContract, GuardrailApiInputs, GuardrailFailure, GuardrailLogTarget, GuardrailMessage), every implementer imports it from there, and betterlite-core has no translation, so moving it into core would drag those types down and still leave the guardrail type fixed.


  Shape. `GuardrailToApply<G>`, its five fields and its GuardrailContract impl (crates/betterlite-server/src/guardrails/unified_chat.rs L30-L66) move unchanged into guardrail_translation.rs, and unified_chat.rs keeps `pub use betterlite_guardrails::guardrail_translation::GuardrailToApply;` so its importers keep their path. It holds betterlite-auth's Principal, so betterlite-guardrails gains `betterlite-auth = { path = "../betterlite-auth" }`; betterlite-auth depends on neither betterlite-core nor betterlite-guardrails, so the edge adds no cycle. `type Guardrail` goes from BaseTranslation, and its three guardrail methods take the guardrail per call: `process_input_messages<G>(&self, data, guardrail: &GuardrailToApply<G>, logging_obj)`, `process_output_response<G>(&self, response, guardrail: &GuardrailToApply<G>, call)` and `process_streaming_response<G>(&self, responses_so_far, guardrail: &GuardrailToApply<G>, call)`, each with `where G: GuardrailContract + Send + Sync` and the same return types as today. Nothing else in the trait changes.


  Implementers. Each of these takes the new signatures, and the guardrail type parameter each one carries goes with its PhantomData, since nothing reads it once the guardrail comes per call (unified_simple/completion.rs L12 says it exists only for the fixed type): the six unified_simple adapters (completion, embeddings, image, speech, transcription, video) become unit structs that derive Default; RerankTranslation, GoogleGenAiTranslation and McpTranslation in unified_guardrail/other_adapters become unit structs; A2ATranslation (a2a_translation/adapter.rs), PassthroughEndpointTranslation and BedrockPassthroughTranslation<H> (unified_passthrough) drop G; ChatTranslation<S, A>, ResponsesTranslation<S> and AnthropicTranslation<S> (unified_chat) drop G and keep reading guardrail.guardrail, guardrail_name, principal, skip_flags and global_flags. An adapter that passed its guardrail to a helper generic over GuardrailContract keeps passing it, since GuardrailToApply<G> is a GuardrailContract. LlmPassthroughRouteHandler<H> (crates/betterlite-guardrails/src/llm_passthrough_dispatch.rs L25-L31) forwards the generic methods to H. B3680's `UnifiedTranslation<G, S, A, H>` becomes `UnifiedTranslation<S, A, H>`, and forward_fallible! (translation.rs L82-L88) forwards the generic methods with their where clause. entries.rs's `Entries` and `build_registry` drop G, and hooks.rs's `Translation<G, S, A, H>` alias (L88) becomes the plain `UnifiedTranslation<S, A, H>`. UnifiedGuardrailHooks keeps its G for GuardrailToRun<G> and goes on passing GuardrailToApply<RecordedGuardrail<G>> to the translation as `admitted` builds it today. StreamEndCheck's impl (unified_stream_hook/stream_end.rs L18) drops G. The b3679 oracle fake ScriptedTranslation (tools/oracle/src/helpers/guardrails/b3679/emit.rs L59-L60, `type Guardrail = ()`) takes the generic methods and ignores the guardrail as it does now.


  Generic callers. Every function bounded on `T: BaseTranslation<Guardrail = G, ..>` drops that binding and takes `&GuardrailToApply<G>`: B6260's unified_stream_hook end_scan.rs (L17), run.rs (L69, L171) and block_only.rs (L54, L105, L149), B6164's unified_stream inspect.rs (L21), run.rs (L49, L95), tail.rs (L20) and round.rs (L53, L89, L115), and B3666's LoggingHook::logging_hook and LoggedScan (crates/betterlite-guardrails/src/guardrail_deployment/logging_hook.rs L57-L62 and L218-L240). Those two take a G type parameter beside T.


  Undeliverable failures keep their type. B10182's step runs on UnifiedTranslation, whose Failure is GuardrailFailure, and must tell an undeliverable rewrite from every other failure, as LiteLLM's step catches UndeliverableStreamRewrite by class (pipeline_executor.py L476-L478). Today B3680's AdapterFailure (unified_guardrail/failures.rs L99-L124) turns the three adapter variants that carry one, EndedStreamError::Undeliverable inside ChatTranslationError::Stream (chat_guardrail_translation/rewrites/error.rs L67), ResponsesTranslationError::Undeliverable (unified_chat/responses.rs L44) and ProcessStreamError::Undeliverable inside AnthropicTranslationError::Stream (anthropic_translation/process_stream/error.rs L25), into GuardrailFailure::Other with their text. B5471's GuardrailFailure (crates/betterlite-guardrails/src/guardrail_base/failure.rs L32-L63) gains `#[error(transparent)] Undeliverable(UndeliverableStreamRewrite)`, with B3246's betterlite_core::guardrails::streaming_rewrite::failure::UndeliverableStreamRewrite, so the text it prints is the text the Other carried. is_intervention gives false for it, as it did for Other, and the three AdapterFailure arms give it back typed. A guardrail that fails with it reaches the caller unchanged through the existing Guardrail arms. Every exhaustive match on GuardrailFailure names the new variant in the arm that holds Other, so code that got it as Other behaves the same: unified_chat.rs failure_parts and modify_response (L90, L112), unified_guardrail/hooks.rs L293, catalog_apply/error.rs L140 and L174, unified_stream_hook/block_only.rs L212, anthropic_translation/process_stream/error.rs L57, unified_stream/round.rs L234 and inspect.rs L47, grayswan/grayswan_monitoring/helpers.rs L55, and the oracle helpers b3699/projection.rs L81, b3722.rs L108, b3724.rs L224, b3725.rs L218, b3794.rs L233, b8212.rs L181, b8214.rs L206, b8773/projection.rs L117 and bedrock/b3726/values.rs L53. The one exception is wrap_unexpected in bedrock_incremental_guardrail/batch.rs (L146-L160), whose Other arm binds its text: the variant joins the arm that passes typed failures through, since a Bedrock call never raises it.


  Tests. In crates/betterlite-guardrails/src/guardrail_translation/tests.rs, tests named per_call_guardrail_*: one translation value is called with a GuardrailToApply over one fake guardrail type and then over a second, different fake type, for process_input_messages, process_output_response and process_streaming_response, and each call reaches the guardrail it was given. In crates/betterlite-server/src/guardrails/unified_guardrail/tests.rs, tests named undeliverable_*: UnifiedTranslation::Chat's process_streaming_response with deliver_ended_stream_rewrites true over a two-choice chat stream whose guardrail changes a tool call's arguments fails with GuardrailFailure::Undeliverable carrying that guardrail's name and the reason "the stream carries 2 choices and tool-call rewrites are only written back on single-choice streams"; into_failure on the Responses and Anthropic undeliverable variants gives GuardrailFailure::Undeliverable with the same value and the same to_string; and a guardrail whose apply_guardrail fails with GuardrailFailure::Undeliverable gets it back unchanged from UnifiedTranslation::Chat. In crates/betterlite-guardrails/src/guardrail_base/tests.rs: undeliverable_is_not_an_intervention. Existing tests and test fakes that implement BaseTranslation or call a translation switch to the new signatures, wrap their fake guardrail in a GuardrailToApply, and keep their assertions. The exhaustive GuardrailFailure matches in the xecguard_runtime, azure_prompt_shield, azure_text_moderation and alice tests and in the unified_stream, unified_stream_hook and unified_dispatch test support name the new variant the same way.
