dod:
  - text: BaseTranslation has no guardrail type; one translation value takes a GuardrailToApply over any guardrail type on each call.
    proof: [per-call-tests, one-guardrail-shape]
  - text: GuardrailToApply is defined once, in betterlite-guardrails, and no translation, registry or loop carries a guardrail type parameter or a PhantomData for it.
    proof: [one-guardrail-shape]
  - text: An undeliverable rewrite comes out of UnifiedTranslation as GuardrailFailure::Undeliverable with its text unchanged and is not an intervention, and every match that took it as Other keeps doing what it did.
    proof: [undeliverable-tests, one-guardrail-shape, guardrails-tests, server-tests]
  - text: The owners' tests and the b3679 helper cases still pass, and the oracle helper groups whose matches changed still build.
    proof: [guardrails-tests, server-tests, dispatch-oracle, oracle-groups-build]
checks:
  optional: [mutants]
  commands:
    - id: per-call-tests
      why: a translation still fixes its guardrail type, or a call does not reach the guardrail it was given
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_translation::tests::per_call_guardrail_/)'
    - id: undeliverable-tests
      why: an undeliverable rewrite still comes out of UnifiedTranslation as Other, changes its text, or counts as an intervention
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::tests::undeliverable_/)' && cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::undeliverable_/)'
    - id: one-guardrail-shape
      why: GuardrailToApply is still defined in the server, a fixed guardrail type or its PhantomData is left, or GuardrailFailure has no Undeliverable variant
      run: >-
        grep -q 'pub struct GuardrailToApply' crates/betterlite-guardrails/src/guardrail_translation.rs &&
        grep -q 'pub use betterlite_guardrails::guardrail_translation::GuardrailToApply' crates/betterlite-server/src/guardrails/unified_chat.rs &&
        test -z "$(grep -n 'struct GuardrailToApply' crates/betterlite-server/src/guardrails/unified_chat.rs)" &&
        grep -q 'Undeliverable(UndeliverableStreamRewrite)' crates/betterlite-guardrails/src/guardrail_base/failure.rs &&
        test -z "$(grep -rnE 'type Guardrail\b|&Self::Guardrail\b|T::Guardrail\b|H::Guardrail\b|Guardrail = G\b|UnifiedTranslation<G\b|PhantomData'
        crates/betterlite-guardrails/src/guardrail_translation.rs
        crates/betterlite-guardrails/src/llm_passthrough_dispatch.rs
        crates/betterlite-guardrails/src/guardrail_deployment/logging_hook.rs
        crates/betterlite-server/src/guardrails/unified_simple
        crates/betterlite-server/src/guardrails/unified_chat/chat.rs
        crates/betterlite-server/src/guardrails/unified_chat/responses.rs
        crates/betterlite-server/src/guardrails/unified_chat/anthropic.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/translation.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/entries.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/hooks.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/other_adapters.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/other_adapters/google_genai.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/other_adapters/mcp.rs
        crates/betterlite-server/src/guardrails/unified_passthrough/bedrock.rs
        crates/betterlite-server/src/guardrails/unified_passthrough/endpoint.rs
        crates/betterlite-server/src/guardrails/unified_passthrough/kinds.rs
        crates/betterlite-server/src/guardrails/a2a_translation/adapter.rs
        crates/betterlite-server/src/guardrails/unified_stream
        crates/betterlite-server/src/guardrails/unified_stream_hook
        tools/oracle/src/helpers/guardrails/b3679/emit.rs | grep -v '/tests')"
    - id: guardrails-tests
      why: a B3661 contract, B3574 pass-through, B3666 logging hook, B5471 base, B3772 Gray Swan, B3727 Bedrock batch or B3679 dispatch test broke
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^(guardrail_translation|llm_passthrough_dispatch|guardrail_deployment|guardrail_base|grayswan|bedrock_incremental_guardrail|unified_dispatch)::/) - test(replays_the_helper_case_corpus)'
    - id: server-tests
      why: an adapter, registry, unified hook, stream loop, stream hook, pipeline gate, catalog or Anthropic stream test broke on the new signatures
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::(unified_chat|unified_simple|unified_guardrail|unified_passthrough|a2a_translation|unified_stream|unified_stream_hook|pipeline_slots|catalog_apply|anthropic_translation)::/)'
    - id: dispatch-oracle
      why: the b3679 helper cases or their corpus no longer agree with LiteLLM
      run: >-
        cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-guardrails -- tools/oracle/cases/helpers/unified-guardrail-dispatch &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-guardrails --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: oracle-groups-build
      why: a guardrails or bedrock oracle helper whose GuardrailFailure match changed no longer builds or replays its corpus
      run: cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-guardrails,betterlite-oracle-groups/betterlite-oracle-bedrock --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
  - "Moving B3246's streaming step, observer, recorder and legacy hook adapter onto BaseTranslation and deleting StreamTranslation, StreamGuardrail and StreamInputs from betterlite-core: B10182. It depends on this task."
  - "The OCR translation and its UnifiedTranslation arm: B036 builds the translation and B8665 adds the arm, both on this shape."
  - "The adapters' own stream handling, the StreamItem lists and the decoders: B10169. This task waits for it."
  - "Other partial ports of CustomGuardrail (GuardrailContract, betterlite-server's callback_caps GuardrailCallback and ProxyCallback, and core's NamedGuardrail): they stay as they are."
pitfalls:
  - "forward_fallible! writes each forwarding method itself, so it must carry the method's <G> and its where clause, or UnifiedTranslation stops implementing the trait."
  - "G needs Send + Sync, not only GuardrailContract: GuardrailToApply holds an Arc<G> across an await inside a future the trait requires to be Send."
  - "GuardrailToApply moves with its fields and its GuardrailContract impl unchanged; the chat adapters read guardrail_name, principal, skip_flags and global_flags off it."
  - "The Undeliverable variant prints through #[error(transparent)], since every adapter variant that carries one is transparent and the old Other text was exactly UndeliverableStreamRewrite's message."
  - "wrap_unexpected's Other arm binds its detail text, so the variant goes into the typed arm there; anywhere else it joins the arm that holds Other, and no match gets a wildcard."
  - "ChatTranslation, ResponsesTranslation and AnthropicTranslation are built field by field in entries.rs, so dropping their _guardrail field changes those constructors too."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
