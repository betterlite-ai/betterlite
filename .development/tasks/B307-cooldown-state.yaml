dod:
- text: Write tests named cooldown_state_behaviors and cooldown_state_boundaries under cooldown_state::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - cooldown-state-behaviors
  - cooldown-state-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/cooldown-state-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/cooldown-state-invalid.yaml;
    the valid seed contains enable_health_check_routing. The cargo-fuzz target config_yaml and normal
    replays_the_config_yaml_corpus test call the production bounded parser. Both new files must be added
    relative to GATE_BASE.
  proof:
  - config-corpus
  - cooldown-state-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: cooldown-state-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::cooldown_state_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: cooldown-state-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::cooldown_state_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/cooldown_state.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/cooldown_state.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/cooldown-state-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/cooldown-state-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/cooldown-state-" && grep -Fq 'enable_health_check_routing' crates/betterlite-config/fuzz/corpus/config_yaml/cooldown-state-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
