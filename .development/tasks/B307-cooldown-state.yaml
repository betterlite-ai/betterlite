id: B307
title: Cooldown expiry and deployment health snapshots
description: 'Add typed cooldown records and health snapshots to B304''s store, with injected wall/monotonic
  time and bounded storage reads. Preserve the distinction between a missing health observation and an
  explicit unhealthy state. Connect snapshot reads to the eligibility phase but expose snapshot writes
  as a reusable interface for later B130 probes. Implement remaining cooldown duration, minimum retry
  delay and local/shared snapshot selection without implementing the error policy in this part. Configuration
  boundary keys introduced or consumed here: enable_health_check_routing, health_check_staleness_threshold,
  health_check_ignore_transient_errors, DEFAULT_COOLDOWN_REDIS_READ_INTERVAL_SECONDS. DEFAULT_COOLDOWN_REDIS_READ_INTERVAL_SECONDS
  defaults to 1 second from the environment; corrected local cooldown TTL is capped at 60 seconds by the
  source. Implement the owned native service in crates/betterlite-router/src/cooldown_state.rs. Add ProbeOperation::CooldownState
  in tools/oracle/src/router_probes/mod.rs and the corresponding B307 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_utils/cooldown_cache.py:
  CooldownCache.__init__ (L40-L59), CooldownCache.cooldown_store (L62-L74), CooldownCache._common_add_cooldown_logic
  (L76-L94), CooldownCache.add_deployment_to_cooldown (L96-L128), CooldownCache.get_cooldown_cache_key
  (L132-L133), CooldownCache._corrected_active_cooldown (L135-L157), CooldownCache.async_get_active_cooldowns
  (L159-L166), CooldownCache.active_cooldowns_from_results (L168-L185), CooldownCache.get_active_cooldowns
  (L187-L204), CooldownCache.get_min_cooldown (L206-L223). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports. Function coverage in litellm/router_utils/health_state_cache.py: _read_shared_health_snapshot
  (L31-L38), DeploymentHealthCache.__init__ (L52-L54), DeploymentHealthCache.set_deployment_health_states
  (L56-L88), DeploymentHealthCache._extract_unhealthy_ids (L90-L101), DeploymentHealthCache.async_get_unhealthy_deployment_ids
  (L103-L113), DeploymentHealthCache.get_unhealthy_deployment_ids (L115-L125). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
