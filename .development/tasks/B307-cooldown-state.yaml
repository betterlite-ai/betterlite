id: B307
title: Cooldown expiry and deployment health snapshots
description: Add typed cooldown records and health snapshots to B304's store, with injected wall/monotonic
  time and bounded storage reads. Preserve the distinction between a missing health observation and an
  explicit unhealthy state. Connect snapshot reads to the eligibility phase but expose snapshot writes
  as a reusable interface for later B130 probes. Implement remaining cooldown duration, minimum retry
  delay and local/shared snapshot selection without implementing the error policy in this part. Use the
  existing Rust crate boundaries from B004 and B008; integrate through the server when the provider dispatcher
  or callbacks live in another core crate. This task's source slices are the linked ranges, not a port
  of their Python classes. Add the listed oracle cases and the matching adapters to B301's component runner
  where state is not observable over HTTP; adapters call production logic and never reproduce it. Use
  deterministic candidate sets or supplied random samples for comparisons, and separate seeded distribution
  tests for random choices. Extend the existing config_yaml fuzz target and committed corpus for every
  newly accepted config form; unsupported keys still fail by full path. Keep the implementation, adapters
  and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/cooldown-state/**
  - tools/oracle/src/router_probes/cooldown_state/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/cooldown_state.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/cooldown_cache.py#L40-L223
  why: Expiry correction and remaining cooldown calculations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/health_state_cache.py#L27-L125
  why: Snapshot TTL and unhealthy extraction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L14476-L14597
  why: Blocked, cooldown and health filters.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the cooldown_state prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(cooldown_state)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/cooldown-state/cooldown-expiry-boundary.yaml
- tools/oracle/cases/routing/cooldown-state/stale-cache-ttl.yaml
- tools/oracle/cases/routing/cooldown-state/minimum-active-delay.yaml
- tools/oracle/cases/routing/cooldown-state/missing-versus-unhealthy.yaml
- tools/oracle/cases/routing/cooldown-state/shared-health-snapshot.yaml
- tools/oracle/cases/routing/cooldown-state/all-unhealthy-safety-net.yaml
- tools/oracle/cases/routing/cooldown-state/health-probe-bypass.yaml
deviations: []
out_of_scope:
- Active health routes and probes (B130).
- Which failures trigger cooldown (B308).
pitfalls:
- Health probes must not be filtered out by the state they are meant to repair.
- A stale local TTL must not extend a shared cooldown.
- B130 owns active HTTP probes, so do not create a second health scheduler.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
