deviations: []
out_of_scope:
- Active health routes and probes (B130).
- Which failures trigger cooldown (B308).
pitfalls:
- Health probes must not be filtered out by the state they are meant to repair.
- A stale local TTL must not extend a shared cooldown.
- B130 owns active HTTP probes, so do not create a second health scheduler.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
