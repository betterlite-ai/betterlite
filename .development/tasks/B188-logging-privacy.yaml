- tools/oracle/cases/helpers/logging-privacy/blocked-dd-site.yaml
- tools/oracle/cases/helpers/logging-privacy/blocked-gcs-bucket.yaml
deviations: []
out_of_scope:
- Exporter implementations and their config activation remain in M5.
- SDK mutable Python globals are B157 and custom Python hook execution is B165.
- >-
  redact_messages.py _redact_responses_api_output/_dict are B080; redacted_standard_logging_payload/_redact_standard_logging_object
  are B190; text-completion snapshots B202/B203.
pitfalls:
- 'The oracle helper for this task is pre-registered as logging_privacy in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/privacy.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/logging_privacy.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  The should_redact_message_logging docstring differs from its implementation; derive precedence from the pinned
  code and oracle.
- Redacted streaming callbacks must not mutate the chunks sent to the client.
- Content privacy and secret redaction are separate decisions.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
