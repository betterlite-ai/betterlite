id: B188
title: Message privacy and safe callback metadata
description: >-
  Create betterlite-logging with typed privacy decisions, callback metadata provenance and per-callback redacted
  snapshots. Reuse B187 for unconditional credential scrubbing, and implement the pinned message-redaction policy
  separately so disabling content redaction never disables secret protection. Support turn_off_message_logging and
  redact_user_api_key_info in config and typed request privacy metadata, preserving the actual header/dynamic/global
  precedence measured by helper cases. Only config resolves environment references; dynamic callback metadata cannot
  request an environment lookup, replace a configured exporter destination or impersonate trusted internal-call
  metadata. Cover chat/stream and embeddings using B005/B006 types; B202/B203 own text-completion privacy, B080
  owns Responses privacy and B190 owns standard-payload privacy. Child privacy inherits through an explicit context
  value; callers receive independent snapshots rather than shared mutable JSON. Add helper cases and chat/config
  corpus seeds for added wire fields; use the existing chat_request production parser for privacy metadata rather
  than adding another parser.  Seed B171's shared helper_case corpus with every added operation and replay it through
  the common typed parser. Request-supplied blocked callback params (gcs_bucket_name, gcs_path_service_account,
  dd_api_key, dd_site, dd_agent_host, dd_agent_port, newrelic_api_key, newrelic_region, signoz_ingestion_endpoint,
  signoz_ingestion_key) are skipped for export with a warning naming the field, matching LiteLLM. os.environ/ references
  in allowed dynamic fields still fail before lookup. Write the behavior rstest functions logging_privacy_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. The helper operation logging_privacy is already registered;
  each operation has its own Rust and Python adapter file and corpus seed. Budget 270 privacy transforms, 110 adapters,
  280 tests and 100 config/replay wiring (760 total).
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/**
  - crates/betterlite-config/**
  - crates/betterlite-openai/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/logging/privacy.rs
  - tools/oracle/src/helpers/logging/privacy/**
  - tools/oracle/helpers/logging_privacy.py
  - tools/oracle/helpers/logging_privacy/**
  - tools/oracle/cases/helpers/logging-privacy/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/redact_messages.py#L41-L325
  why: Per-callback copies and redacted input/output shapes.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/redact_messages.py#L328-L437
  why: Actual policy precedence and user-api-key metadata redaction.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/initialize_dynamic_callback_params.py#L16-L210
  why: Inherited privacy and request-supplied environment-reference rejection.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/internal_call_metadata.py#L57-L168
  why: Safe forwarding of trusted metadata.
dod:
- text: >-
    Policy precedence and redacted payloads match direct helper cases, including the legacy disable-redaction header.
  proof:
  - oracle
  - helper-python
- text: >-
    Two callbacks with different content privacy settings receive independent snapshots and neither can expose credentials
    or restore an inherited private child payload.
  proof:
  - logging-privacy-tests
- text: >-
    Blocked destination/credential callback fields are ignored for export with field-naming warnings; allowed dynamic
    fields containing os.environ/ and impersonated internal flags fail before lookup.
  proof:
  - logging-privacy-tests
- text: Privacy, chat and config external-input parsers have replay corpus coverage.
  proof:
  - chat-request-corpus
  - config-yaml-corpus
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: logging-privacy-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-logging -p betterlite-config --no-tests=fail -E 'test(/::logging_privacy_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: chat-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'turn_off_message_logging' crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq 'redact_user_api_key_info'
      crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'logging_privacy' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/logging-privacy/global.yaml
- tools/oracle/cases/helpers/logging-privacy/dynamic-over-global.yaml
- tools/oracle/cases/helpers/logging-privacy/disable-header.yaml
- tools/oracle/cases/helpers/logging-privacy/enable-header.yaml
