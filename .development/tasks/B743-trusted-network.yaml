deviations:
  - what: New otherwise unbounded byte decoders reject over 1048576 bytes or JSON depth 64, respecting
      smaller inherited limits.
    why: Bound the specific outside-byte decoder named in this task; typed helpers inherit no artificial
      parser behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/network.py#L26-L38
out_of_scope:
  - B732 owns NetworkContext at network.py L15-L18 below Principal; this task owns network resolution.
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
pitfalls:
  - 'The oracle helper for this task is pre-registered as trusted_network in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/trusted_network.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/trusted_network.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - IPv4-mapped IPv6 must normalize before CIDR and forwarded-hop checks.
budget:
  max_changed_lines: 775
  max_new_expects: 0
review_level: security
