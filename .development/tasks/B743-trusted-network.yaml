id: B743
title: Trusted proxies and client network identity
description: >-
  Implement TrustedProxyConfig and network resolution using B732's NetworkContext record and a maintained CIDR/IP parser. Keep IPv4-mapped IPv6
  normalization, trusted-proxy ranges, X-Forwarded-For hop selection and HTTPS source precedence. Only
  a trusted immediate peer can supply proxy-auth headers; malformed and missing addresses preserve the
  source fallback/denial distinction.


  Build the production trusted_network module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/network.py:
  normalize_cidr_ranges (L26-L38; 13 source lines), parse_trusted_proxy_ranges (L41-L50; 10 source lines),
  _unmapped (L53-L56; 4 source lines), ip_in_networks (L59-L67; 9 source lines), _is_valid_ip (L70-L75;
  6 source lines), resolve_client_ip (L78-L92; 15 source lines), resolve_network_context (L95-L101; 7
  source lines). litellm/proxy/auth/ip_address_utils.py: IPAddressUtils.parse_internal_networks (L67-L79;
  13 source lines), IPAddressUtils.parse_trusted_proxy_networks (L82-L97; 16 source lines), IPAddressUtils.is_trusted_proxy
  (L100-L111; 12 source lines), IPAddressUtils.is_internal_ip (L114-L138; 19 source lines), IPAddressUtils.is_request_from_trusted_proxy
  (L141-L194; 47 source lines), IPAddressUtils.is_request_https (L197-L224; 25 source lines), IPAddressUtils.extract_client_ip_from_xff_hops
  (L227-L253; 25 source lines), IPAddressUtils._resolve_num_trusted_hops (L256-L278; 23 source lines),
  IPAddressUtils.get_mcp_client_ip (L281-L371; 76 source lines). litellm/proxy/auth/trusted_proxy_utils.py:
  _get_proxy_general_settings (L15-L21; 6 source lines), get_trusted_proxy_cidrs (L24-L37; 13 source lines),
  _get_direct_client_ip (L40-L45; 6 source lines), require_trusted_proxy_request (L48-L84; 34 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.mcp_trusted_proxy_ranges=None;
  general_settings.use_x_forwarded_for=False; PROXY_BASE_URL=''; general_settings.mcp_xff_num_trusted_hops=None;
  mcp_trusted_proxy_ranges=None; use_x_forwarded_for=False; mcp_xff_num_trusted_hops=None.


  Add the trusted_network operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a trusted-network-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::trusted_network::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary trusted_network::decode_network_headers(&[u8]) -> Result<TypedValue,DecodeError>
  for Forwarded/X-Forwarded-For and CIDR strings. Production calls this decoder before its typed policy
  functions; the cargo-fuzz target trusted_network calls that same function. Seed valid, truncated, malformed,
  duplicate-field and limit-boundary inputs and add trusted_network::tests::replays_the_trusted_network_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B733 owns crates/betterlite-auth/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 379 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  379 production, 151 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 45 decoder/fuzz
  and 50 config lines, 755 changed lines estimated within a 775-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Server wiring tests live under betterlite-server::auth::trusted_network::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
