id: B1031
title: File upload policy and destination routing
description: >-
  Implement the complete upload-routing helpers at files_endpoints.py:111-527, including
  executed-provider selection, Vertex passthrough validation, scan coordination, first-record
  model extraction, files_settings resolution, deprecated router upload and route_create_file.
  Put runtime policy in betterlite-core::api::file_upload_routing and settings in
  betterlite-config::api::file_upload_routing. Use B303/B844 catalog access, B1020 authorization,
  B1048 executed-provider probing, B1023/B1024 scans, B235 file extraction, B1027 storage and
  B1028 SDK upload. The complete router upload facade belongs to B162, not a route caller.

  files_settings starts unset; set_files_config(None) leaves existing state unchanged. A list
  resolves string values starting os.environ/ through B002 once. loadbalancing uses
  litellm_settings.enable_loadbalancing_on_batch_endpoints, default null, only literal true.
  Pure helper file_upload_policy tests projections/validation only. B2401 SDK HTTP operation
  file_upload_routing calls production routing with injected catalog/principal/callbacks and
  captures uploads/probes; it never imports the FastAPI handler. B1032 tests the HTTP route.
  First-record JSON decoding is decode_file_first_record(bytes, limits), reusing B1022's
  Python-compatible JSON encoding rules; add its own core fuzz target for record selection.
  Native tests use api::file_upload_routing::tests. The 360 owned nonblank/non-comment lines
  budget as 270 implementation, 160 tests, 115 cases, 100 adapters, 55 fuzz, 55 config and 35 wiring,
  790 total. Enterprise-only continuations remain inactive.
