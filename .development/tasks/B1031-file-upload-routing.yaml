deviations:
- what: Managed-target upload returns 500 internal_server_error, code="500", message="Managed files hook not found"; automatic executed-batch storage reaches B1027's target_model_names 400 instead.
  why: Keep observable MIT behavior pending Max's managed files and batches decision, without installing an enterprise hook or license gate.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L473-L480
out_of_scope:
- B1032 owns create_file; B1033 get_file_content; B1034 get_file/list_files/_as_file_list_page; B087 delete_file.
- The managed-hook continuation L481-L498 cannot run in the MIT checkout. Its router/type checks and managed upload belong to the excluded enterprise capability, not fabricated test doubles.
pitfalls:
- Explicit storage still follows executed-provider authorization; it is not a bypass for a forbidden model.
- files_settings is merged after team credentials, so its matching record can replace them.
- First-record JSON selection accepts values other than objects despite its annotation.
review_level: security
budget:
  max_changed_lines: 790
  max_new_expects: 0
