references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L111-L527
  why: Complete helper call graph below create_file; storage, explicit model, managed targets, legacy routing, then direct provider.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L395-L395
  why: Legacy file/batch load-balancing setting defaults to None, not false or enabled.
dod:
- text: >-
    file_settings_lookup loads files_settings=null then [] then records with custom_llm_provider
    and api_key=os.environ/FILE_TEST_KEY; injected environment resolves the key, including missing
    secret behavior from B002. Null setter retains the previous list; non-list raises ValueError
    "invalid files config, expected a list is not a list". Vertex lookup always returns null,
    even without settings. Other providers with unset settings raise "files_settings is not set,
    set it on your config.yaml file." First matching record wins; no match returns null.
    Non-dict list elements survive loading and fail on lookup's .get, not a new silent drop.
  proof: [behavior-tests, config-tests, config-corpus, oracle, python-adapters]
- text: >-
    upload_destination_order rejects explicit target_storage=litellm_db with 400,
    type=invalid_request_error,param=target_storage,code="400",message="target_storage=litellm_db
    is not a storage a caller can pick: LiteLLM chooses it on its own for the batch input files
    of a model whose batches it runs itself, so upload with purpose=batch and name that model
    instead of target_storage". Other non-default storage wins over model/targets; storage=null,
    empty or default does not. Executed model selection is attempted before all other destinations.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    executed_upload_selection authorizes candidates known as executed providers before honoring
    explicit storage. Router absent returns null; model non-null (even "") replaces targets.
    With no explicit storage, probe all candidates through B1048; no executed provider returns null.
    One executed model m and purpose=assistants gives 400 invalid_request_error/purpose/"400":
    "The server behind m has no Files API, so LiteLLM keeps only batch input files for it and runs
    the batch itself: upload with purpose=batch; got purpose=assistants". Candidates [m,n] with m
    executed give 400 invalid_request_error/target_model_names/"400": "LiteLLM runs batches for m
    itself and keeps their input files, so a batch input file can target only that one model; got
    target_model_names=m, n". Single m/batch selects litellm_db with targets=[m], then B1027's
    absent managed hook produces its 400 before storage writes; do not invent a managed registration.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    passthrough_upload_errors checks in order purpose, storage, named deployments. Non-batch
    assistants yields 400 invalid_request_error/passthrough/"400", message="`passthrough` uploads
    the file bytes unchanged for a native Vertex batch, so purpose must be 'batch', got 'assistants'."
    target_storage=azure_storage yields param=target_storage and "`passthrough` writes the native
    batch file to the Vertex AI deployment's GCS bucket, so it cannot be combined with
    target_storage='azure_storage'." No model/targets yields param=target_model_names and
    "`passthrough` needs the Vertex AI deployment that will run the batch, since native rows carry
    no model: pass `target_model_names` or `model`." A non-Vertex m yields param=model (or
    target_model_names for a target) and "`passthrough` is only supported for Vertex AI deployments;
    'm' does not resolve to vertex_ai deployments only." All resolved deployments with model_info.id
    must be Vertex; missing ids are skipped, an empty list passes if the named credential is Vertex.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    scan_upload_gates skips non-batch, bytes input or absent pre-call guardrails. A guarded native
    passthrough stream fails 400 invalid_request_error/passthrough/"400", message="Batch guardrails
    cannot scan native Vertex batch rows, so a `passthrough` upload is refused when the key, team,
    or request has pre-call guardrails configured. The file was not forwarded to the provider."
    Otherwise use B1024, publish B1023 failures and reject changed scans with zero submitted records
    using its exact nothing-to-submit error. No provider request follows failure.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    first_record_routing skips blank lines, reads only the first nonblank record, supports BOM and
    Python JSON byte encodings, rewinds seekable files to zero, and returns null on empty input,
    malformed JSON, invalid encoding, OSError or ValueError. A parsed scalar/list remains that value;
    get_model_from_json_obj expects an object, returns body.model only for object body, and does
    not coerce its value to string. A missing/string body returns null. Native tests preserve the
    read/seek failure order rather than guaranteeing rewind after an exception.
  proof: [behavior-tests, decoder-corpus, oracle, python-adapters]
- text: >-
    routed_upload_paths gives explicit model m priority over targets, obtains authorized credentials
    with operation_context="file upload", uploads via B1028, and encodes a truthy result id through
    B1019, logging DEBUG "Encoded file ID: <old> -> <new> (model: m)". Missing/empty id is unchanged.
    Targets without model produce 500 internal_server_error,param=null,code="500",message="Managed
    files hook not found" in MIT. With no targets, literal-true loadbalancing plus known router_model
    calls B162; missing router raises HTTPException500 detail.error="LLM Router not initialized.
    Ensure models added to proxy." Otherwise apply team credentials, then matching files_settings
    overrides those values, remove custom_llm_provider from the request and pass the selected
    provider separately. Test source errors and successful upstream multipart capture.
  proof: [behavior-tests, oracle, python-adapters]
- text: Added config, decoder, helper and SDK seeds replay through their production boundaries.
  proof: [config-tests, config-corpus, decoder-corpus, case-seeds, new-cases, oracle, python-adapters]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: destination precedence or upload gates lack native cases
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_routing::tests::/) - test(/replays_/)'
  - id: config-tests
    why: file settings or literal-true legacy routing is not loaded by production config
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_routing::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: new file settings keys have no loader corpus input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/file-upload-routing-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: decoder-corpus
    why: first-record selection is not replayed against boundary inputs
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/file_first_record)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_routing::tests::replays_first_record_corpus$/)'
  - id: python-adapters
    why: either pure policy or SDK routing comparison is missing
    run: test -f tools/oracle/helpers/file_upload_policy.py && test -f tools/oracle/sdk_http/file_upload_routing.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: case-seeds
    why: typed policy and SDK inputs lack added seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_upload_policy-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/file-upload-routing-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)' && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: no new upload-routing network comparison exists
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/file-upload-routing)"
oracle_cases:
- tools/oracle/cases/helpers/file-upload-policy/file-settings-lookup.yaml
- tools/oracle/cases/helpers/file-upload-policy/passthrough-upload-errors.yaml
