checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_routing::/)
      - test(/::replays_corpus$/)'
  - id: case-vertex-only-passthrough
    why: the vertex-only-passthrough behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_routing::tests::vertex_only_passthrough($|::)/)'
  - id: case-mixed-provider-passthrough-denied
    why: the mixed-provider-passthrough-denied behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_routing::tests::mixed_provider_passthroug_b883($|::)/)'
  - id: case-first-json-model
    why: the first-json-model behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_routing::tests::first_json_model($|::)/)'
  - id: case-deprecated-loadbalance-warning
    why: the deprecated-loadbalance-warning behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_routing::tests::deprecated_loadbalance_warning($|::)/)'
  - id: case-managed-upload-no-hook-500
    why: the managed-upload-no-hook-500 behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_routing::tests::managed_upload_no_hook_500($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_routing::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/file-upload-routing-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/file_upload_routing)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/file_upload_routing.rs && grep -qF "decode_file_upload_routing"
      crates/betterlite-core/fuzz/fuzz_targets/file_upload_routing.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::file_upload_routing::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_upload_routing.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_upload_routing-*)"
      && grep -qE "^[[:space:]]+file_upload_routing:" tools/oracle/fuzz/corpus/helper_case/file_upload_routing-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-upload-routing)"
