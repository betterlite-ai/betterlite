id: B854
title: Refresh short-lived database credentials
description: >-
  Implement DatabaseRefreshLoop over B713 PoolGeneration and B712 DatabaseTokenAuth. Parse an encoded
  URL BEFORE decoding only its password, preserving embedded token '?' delimiters; missing/empty
  password, None or any URL parse error yields None silently. Do not require a Postgres scheme in
  this extraction helper. B712 parses expiry only when both token and auth exist. Read the selected
  credential snapshot (writer DATABASE_URL by default, reader DATABASE_URL_READ_REPLICA when supplied).
  Scheduling constants are 180 seconds buffer, 600 fallback and 30 minimum sleep; none is configurable.
  Unparseable expiry logs debug 'Could not parse token expiration, using fallback interval of %ss'
  and returns 600. Otherwise max(30,expiry minus 180 minus UTC now). There is NO jitter. is_token_expired
  returns true immediately for missing URL, or logs debug 'Could not parse token expiration, treating
  as expired' for unparseable expiry; a valid token is expired only when now > expiry, not at equality.
  _token_refresh_not_needed is true only with more than 180 seconds remaining; equality must refresh.

  Minting returns None when auth is disabled. Prefer the explicit IAMEndpoint (reader) without reading
  writer endpoint env fields. Otherwise require truthy DATABASE_HOST, DATABASE_USER, DATABASE_NAME
  in that order and raise RuntimeError 'Cannot mint a database token: {comma-separated missing names}
  unset. Set them so the connection URL can be reassembled around a freshly minted token.'
  DATABASE_PORT defaults string '5432' only when absent; empty/non-numeric values are passed to B712,
  not replaced or parsed at import. DATABASE_SCHEMA defaults None. Build B712's URL with a new token,
  then B2307 add_missing_query_params using token_refresh_params_from_url of the old URL. Preserve
  its exact refresh allowlist and existing new-URL values; publish the selected URL before replacement.
  No credential is persisted in Postgres and logs must not include its value.

  Starting with token auth disabled logs debug and creates no task; any existing task handle logs
  'Token refresh task already running' and is retained even if done. A new task logs Started with
  B713's optional prefix and B712's label. Each loop logs its 180-second buffer, scheduled seconds
  rounded to zero decimal places and minutes to one, sleeps, logs Proactively refreshing, then calls
  safe refresh. Ordinary errors log error 'Error in {label} refresh loop: {error}. Retrying in 600s...'
  and sleep 600; cancellation during normal work logs loop cancelled, cancellation during error sleep
  exits silently. No warn-level message is generated here. Stop without a handle is a no-op; otherwise
  cancel and await, swallow cancellation, clear the handle and log Stopped. Other task errors propagate.

  Hold B713's shared reconnection lock around the second freshness check, mint and replacement. A
  fresh token logs debug and skips minting. Snapshot the previous URL, mint/publish, then call B713's
  connect-before-swap replacement. On failure OR cancellation restore the exact prior URL (remove
  the value when absent) and rethrow; the candidate-connection failure keeps the old pool, but a
  callback failure AFTER B713 publication leaves the new generation live while restoring the URL.
  Do not promise rollback of the pool in that case. Success sets last_refresh_time only after the
  replacement returns and logs refreshed successfully. A falsey minted URL logs Failed to generate
  new token, changes no timestamp and returns normally, so the loop uses its normal next schedule.
  Install these functions into B713's injected refresh-trigger port; never make B713 depend on this
  higher lifecycle task. Test competing triggers with barriers and injected UTC time.


  Build the production database_refresh_loop module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/prisma_client.py:
  PrismaWrapper._extract_token_from_db_url (L349-L368; 16 source lines), PrismaWrapper._parse_token_expiration
  (L370-L378; 8 source lines), PrismaWrapper._calculate_seconds_until_refresh (L380-L415; 24 source lines),
  PrismaWrapper.is_token_expired (L417-L430; 10 source lines), PrismaWrapper.get_rds_iam_token (L432-L450;
  17 source lines), PrismaWrapper._endpoint_from_env (L453-L476; 21 source lines), PrismaWrapper.start_token_refresh_task
  (L646-L667; 19 source lines), PrismaWrapper.stop_token_refresh_task (L669-L688; 18 source lines), PrismaWrapper._token_refresh_loop
  (L690-L744; 47 source lines), PrismaWrapper._safe_refresh_token (L746-L789; 37 source lines), PrismaWrapper._token_refresh_not_needed
  (L791-L806; 15 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DATABASE_HOST=None;
  DATABASE_USER=None; DATABASE_NAME=None; DATABASE_PORT=DEFAULT_POSTGRES_PORT; DATABASE_SCHEMA=None.


  Refresh integration uses B860 Postgres through POSTGRES_TEST_URL, falling back to testcontainers
  only if unset. Connection failure must fail. Test old/new pool reachability and snapshot restoration
  with real connections and injected token minting; no AWS credential or database-row mutation is needed.


  Config tests loads_writer_endpoint, explicit_reader_endpoint_wins, endpoint_missing_fields_order,
  absent_port_5432 and empty_port_not_default call B002's real loader and consume its snapshot.
  Do not add an invalid_value_fallback: missing required values raise at mint time, and port is a
  string passed through. Reuse B710's endpoint schema without adding another env binding.


  Expose extract_refresh_password(&str) through B2307 URL primitives and fuzz the production function
  in the existing DB workspace with encoded delimiters, percent escapes, empty passwords, bracket
  errors and Unicode. Register only extraction/expiry-clock arithmetic as pure B856 database helper
  cases; Python calls actual methods on a minimal wrapper with fixed clock/auth descriptor. Minting,
  environment/snapshot changes, locks and loops use native tests, not helper cases.


  The eleven methods contain 176 nonblank noncomment lines excluding docstrings, plus three constants.
  Allow 200 production, 300 lifecycle/Postgres tests, 80 adapters, 50 config, 60 fuzz and 35 wiring
  lines, 725 within 800. B712 owns token claim parsing; B713 owns pool publication/draining.
