id: B854
title: Refresh short-lived database credentials
description: >-
  Implement DatabaseRefreshLoop over PoolGeneration and DatabaseTokenAuth. Preserve token endpoint extraction,
  expiry calculation, 180-second buffer, 600-second unparseable-expiry fallback and 30-second minimum
  sleep, with bounded jitter and injected time. Refresh failure retains the live pool and retries with
  source warning behavior; shutdown cancels and joins the loop.


  Build the production database_refresh_loop module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/prisma_client.py:
  PrismaWrapper._extract_token_from_db_url (L349-L368; 16 source lines), PrismaWrapper._parse_token_expiration
  (L370-L378; 8 source lines), PrismaWrapper._calculate_seconds_until_refresh (L380-L415; 24 source lines),
  PrismaWrapper.is_token_expired (L417-L430; 10 source lines), PrismaWrapper.get_rds_iam_token (L432-L450;
  17 source lines), PrismaWrapper._endpoint_from_env (L453-L476; 21 source lines), PrismaWrapper.start_token_refresh_task
  (L646-L667; 19 source lines), PrismaWrapper.stop_token_refresh_task (L669-L688; 18 source lines), PrismaWrapper._token_refresh_loop
  (L690-L744; 47 source lines), PrismaWrapper._safe_refresh_token (L746-L789; 37 source lines), PrismaWrapper._token_refresh_not_needed
  (L791-L806; 15 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DATABASE_HOST=None;
  DATABASE_USER=None; DATABASE_NAME=None; DATABASE_PORT=DEFAULT_POSTGRES_PORT; DATABASE_SCHEMA=None.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::database_refresh_loop::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 232 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  232 production, 154 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 466 changed lines estimated within a 475-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
