pitfalls:
  - 'The oracle helper for this task is pre-registered as database_refresh_loop in the db group. Replace the stub Op in tools/oracle/src/helpers/db/database_refresh_loop.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/database_refresh_loop.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Expiry equality is not expired, but exactly 180 seconds of runway is already eligible for refresh.
  - A replacement callback can fail after publication; restoring credentials then does not restore the old pool.
  - There is no random jitter and no warn-level fallback in this loop.
