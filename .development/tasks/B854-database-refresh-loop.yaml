dod:
  - text: 'Named lifecycle cases disabled_start, duplicate_handle_start, loop_log_levels,
      fixed_schedule_no_jitter, error_sleep_600, cancel_normal_vs_error_sleep, stop_clears_handle,
      lock_rechecks_freshness, mint_failure_no_publish, falsey_mint_no_timestamp,
      candidate_failure_restores_url, cancel_restores_absent_url, callback_error_after_swap,
      success_sets_timestamp and writer_reader_isolation cover effects in order.'
    proof: [behavior-tests, postgres-tests]
  - text: Pure extraction and schedule cases use the pinned methods and both new corpora replay production decoders.
    proof: [oracle, helper-python, parser-corpus, helper-case-corpus]
  - text: 'Implement the owned behavior and ordered failure effects; named tests: expiry_buffer, unknown_expiry_fallback,
      cached_token_minimum_sleep, refresh_failure_keeps_pool, reader_token_refresh, shutdown_joins, postgres_pinned_rows,
      postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: helper-python
      why: Clock/extraction comparisons must import the pinned functions.
      run: test -f tools/oracle/helpers/database_refresh_loop.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: parser-corpus
      why: Password extraction must replay added malformed URL seeds through production code.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/refresh_password)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_refresh_password_corpus)'
    - id: helper-case-corpus
      why: The new operation must pass the shared HelperCase decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/database-refresh-loop-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_refresh_loop::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_refresh_loop::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_refresh_loop::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::database_refresh_loop::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-refresh-loop-*")"
        && grep -rlq "DATABASE_HOST" crates/betterlite-config/fuzz/corpus/config_yaml/database-refresh-loop-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
