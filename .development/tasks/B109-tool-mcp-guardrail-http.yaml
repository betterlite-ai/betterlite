id: B109
title: Booted-proxy cases for the tool permission, tool policy, MCP permission and MCP JWT signer guardrails
description: >-
  B109's parts built five guardrails and the MCP JWT signer, all before a booted proxy could run a guardrail, so every
  one of them was proved with helper cases or unit tests only: B3810 to B3813 the tool_permission guardrail, B3814 the
  tool_policy guardrail, B3815 mcp_end_user_permission and mcp_security, B3816 and B3817 the signer and its claims, B8254
  the signer's initializer and its JwtSignerSlot. B3818's MCP translation already has HTTP cases in B8992. What is left
  is the proof that these pieces answer a real request the way LiteLLM does once they are composed: B3682 and B8521
  register the wire names, B3683 starts the config guardrails, B8666 runs a held guardrail through its class, B8613
  installs the callbacks and the signer slot, B8399 runs the proxy hooks, B3680 runs the unified apply_guardrail path,
  and the routes come from B004 and B6370 (chat), B081 (/v1/messages), B8626 (/mcp-rest), B8624 (the well-known
  documents), B830 (/end_user/new), B062 (/v1/tool/policy) and B055 (/key/generate), B8464 hands the signer's headers
  to the MCP call, and B9850 lets a case skip one captured request body or header value. This task writes no Rust and
  registers no route, guardrail kind, class or callback. A case that fails because a part answers differently from
  LiteLLM goes back to that part's task as a finding and is never patched here.


  Cases go in tools/oracle/cases/guardrails/tool-mcp-http. Use the booted-proxy case format (kind http_scenario where a
  case has more than one request) with general_settings.master_key oracle-master and router_settings.num_retries 0.
  The chat deployment is `chat` on `openai/gpt-oracle` with api_base {{upstream}} and api_key oracle-key; the messages
  deployment is `claude` on `anthropic/claude-oracle` with the same api_base and key. Configure each guardrail in the
  top-level `guardrails:` list with litellm_params.guardrail set to its wire name (tool_permission, tool_policy,
  mcp_security, mcp_end_user_permission, mcp_jwt_signer) and default_on true unless a case says otherwise. Compare
  status, content-type, every error field and x-litellm-applied-guardrails where LiteLLM records it. Compare the
  provider requests the mock captured, so a 200 can't hide a skipped check, and so a rewrite is checked on the request
  the provider got. Ignore a field only where a case below names it, each with its reason, never a whole error or
  every header.


  tool_permission. All but the last two cases call POST /v1/chat/completions. The guardrail's options are rules (each
  with id, tool_name or tool_type as a fullmatch regex, decision allow or deny, optional allowed_param_patterns),
  default_action (default deny) and on_disallowed_action (default block). tool-permission-request-block: mode
  pre_call, one rule {id: deny-bash, tool_name: Bash, decision: deny}, default_action allow, and a request with
  function tools Bash and Read; the client gets 400 with {"error": "Violated guardrail policy", "detection_message":
  "Tool 'Bash' denied by rule 'deny-bash'"} and the provider is never called. tool-permission-request-rewrite: the
  same rule with on_disallowed_action rewrite, and the request also forces tool_choice {type: function, function:
  {name: Bash}}; the provider receives only the Read tool and tool_choice "none". tool-permission-default-deny: no
  rule matches Write, default_action deny, a rule {id: allow-read, tool_name: Read, decision: allow} and rewrite; the
  provider receives only Read. tool-permission-not-selected: default_on false and no `guardrails` list in the body,
  so the provider receives Bash untouched; a second step names the guardrail in the body's `guardrails` list and gets
  the 400.


  tool-permission-response-rewrite: mode post_call, rewrite, and the provider answers with finish_reason tool_calls and
  two tool calls, Bash (id call_bash) and Read (id call_read); the client gets only the Read call, and the message
  content is "Permission denied: Tool 'Bash' denied by rule 'deny-bash' (Rule: deny-bash)". tool-permission-response-block:
  the same answer with on_disallowed_action block; the client gets the guardrail error LiteLLM raises from
  GuardrailRaisedException. tool-permission-argument-pattern: post_call, rewrite, default_action deny and one rule
  {id: read-workspace, tool_name: Read, decision: allow, allowed_param_patterns: {path: "/workspace/.*"}}; the
  provider calls Read with arguments {"path": "/etc/passwd"} and no other tool, so the call is dropped, the content
  carries the pattern failure "Value '/etc/passwd' for path 'path' does not match allowed pattern '/workspace/.*' for
  tool 'Read'" with no rule suffix, and finish_reason turns into stop. tool-permission-stream-rewrite: stream true,
  post_call, rewrite; the provider streams a Bash tool call whose arguments arrive in two deltas and ends with
  finish_reason tool_calls; compare the decoded SSE events the client receives after LiteLLM rebuilds the stream,
  ignoring only the chunk id and created with their reason. tool-permission-messages-rewrite: POST /v1/messages to
  `claude`, post_call, rewrite; the provider answers an Anthropic message with a text block and a tool_use block for
  Bash (id toolu_bash); the client gets the text block followed by one text block holding the denial and stop_reason
  end_turn.


  tool_policy. These cases are http_scenarios on the isolated Postgres database (general_settings.database_url
  {{postgres}}), so the tool policy registry starts initialized. tool-policy-blocked: POST /v1/tool/policy
  {tool_name: Bash, input_policy: blocked} with the master key, then a pre_call chat request with the Bash function
  tool; the client gets 400 with {"error": "Violated tool policy", "blocked_tools": ["Bash"], "message": ...} and the
  provider is never called. tool-policy-key-override: POST /key/generate with the master key, capture /key as a
  secret and /token, POST /v1/tool/policy {tool_name: Read, input_policy: blocked, key_hash: ${capture.token}}, then
  send a chat request with the Read tool once with the new key (400) and once with the master key (the provider
  answers), so the override reaches only that key's object permission. tool-policy-trust-chain: set Bash to
  input_policy trusted and web_fetch to output_policy untrusted, then send a post_call chat request whose messages
  hold an assistant tool call web_fetch (id call_web) and its tool result, and let the provider answer with a Bash
  tool call; the client gets 400 with blocked_tools ["Bash"], untrusted_sources ["web_fetch"] and the message "Bash
  requires trusted input but conversation contains untrusted output from web_fetch.".


  mcp_security and mcp_end_user_permission. mcp-security-unregistered-block: one mcp_servers entry `github` with url
  {{upstream}} and transport http, an mcp_security guardrail with mode pre_call and on_violation block, and a chat
  request whose tools are three `type: mcp` tools with server_url litellm_proxy/mcp/github, litellm_proxy/mcp/zeta and
  litellm_proxy/mcp/alpha; the client gets 400 with {"error": "Violated guardrail policy", "guardrail":
  "mcp_security", "unregistered_servers": ["alpha", "zeta"], "detection_message": "MCP Security: request references
  unregistered MCP server(s): alpha, zeta. Only servers registered on this gateway are allowed."} and neither the
  provider nor the MCP server is called. mcp-end-user-filter is an http_scenario on Postgres: an mcp_end_user_permission
  guardrail with mode pre_call and no default_on key (its initializer turns that into on), POST /end_user/new
  {user_id: eu-restricted, object_permission: {mcp_servers: [github]}} and {user_id: eu-open}, then POST /v1/messages
  to `claude` with Anthropic tools github-create_issue, jira-create_ticket and local_lookup. Sent with header
  x-litellm-end-user-id eu-restricted, the provider receives github-create_issue and local_lookup only; with eu-open
  and with no end user header it receives all three. A last step sends the eu-restricted request with OpenAI function
  tools to /v1/chat/completions. LiteLLM looks for the end user id only at the top level and in litellm_metadata, and
  chat requests keep it in metadata, so LiteLLM forwards all three tools there. betterlite filters them (B3815's
  deviation row reads the metadata key too), so betterlite's provider receives github-create_issue and local_lookup
  only. This step ignores the captured provider body (B9850's /upstream/{i}/body selector for that step's call)
  with that reason, and compares the rest; B3815's unit tests prove the filter on the metadata key.


  mcp_jwt_signer. Every signer case configures the guardrail with mode pre_mcp_call. jwt-jwks-configured-key: env
  MCP_JWT_SIGNING_KEY holds a synthetic RSA-2048 PKCS#8 PEM generated for this case and used nowhere else; GET
  /.well-known/jwks.json returns one key {kty RSA, alg RS256, use sig, kid, n, e}, all compared, with Cache-Control
  "public, max-age=3600". jwt-jwks-generated-key: no signing key, so each side generates its own; ignore
  /keys/0/kid and /keys/0/n with that reason, and compare the rest and "public, max-age=300". jwt-jwks-no-signer: no
  signer guardrail at all; the answer is {"keys": []} with "public, max-age=60". That contrast proves the earlier two read the
  slot the signer filled. jwt-openid-configuration: GET /.well-known/openid-configuration with a signer configured
  carries jwks_uri ending in /.well-known/jwks.json and id_token_signing_alg_values_supported ["RS256"]; ignore only the
  URL-valued fields, since each side builds them from its own port. jwt-introspection-inactive: access_token_discovery_uri
  {{upstream}}/.well-known/openid-configuration, token_introspection_endpoint {{upstream}}/introspect, one mcp_servers
  entry `github` with url {{upstream}}, and POST /mcp-rest/tools/call {server_id: github, name: create_issue,
  arguments: {title: oracle}} with Authorization "Bearer oracle-master". The master key has no dots, so the signer
  introspects it: after the startup listing (see pitfalls), the mock's answer is {"active": false}, its captured request is a form POST of token=oracle-master,
  and the client gets 401 with detail {"error": ...}. Ignore /detail/error with B3816's deviation as the reason (the
  text after "incoming token verification failed: " is betterlite's own). jwt-required-claims: required_claims [email]
  and no discovery uri, so an API key caller has no claims and the client gets 403 with detail {"error": ...} before
  any MCP traffic; ignore /detail/error because it prints the missing list as Python list text, and
  docs/compatibility.md leaves that text to betterlite.


  jwt-signed-tool-call: MCP_JWT_SIGNING_KEY holds the same synthetic PEM as jwt-jwks-configured-key, the signer has
  no discovery uri, one mcp_servers entry `github` has url {{upstream}} and transport http, and POST
  /mcp-rest/tools/call {server_id: github, name: create_issue, arguments: {title: oracle}} goes out with Authorization
  "Bearer oracle-master". The mock captures six requests: LiteLLM's startup listing of every configured server
  (initialize, notifications/initialized, tools/list, with no caller and so no signed token), then the call's own
  session (initialize, notifications/initialized, tools/call {name: create_issue, arguments: {title: oracle}}), every
  one of those three carrying the signed Authorization header. Script the answers in that order: an initialize result
  without an Mcp-Session-Id header, 202 with an empty body for each notification, a tools/list result that lists
  create_issue, and a tools/call result with one text content block; each JSON-RPC answer echoes the id its request
  carries, which counts from 1 in each session. The client gets 200 with that tool result. List authorization in
  upstream_headers, so the startup listing shows the header absent on both sides. Name five selectors, each with its
  why: `/upstream/0/body` and `/upstream/3/body`, since each initialize carries its own side's clientInfo, and
  `/upstream/3/headers/authorization`, `/upstream/4/headers/authorization` and `/upstream/5/headers/authorization`,
  since the token's iat and exp come from the clock. The tools/list and tools/call bodies stay compared, and the
  token's claims stay with B3816's and B3817's tests.
