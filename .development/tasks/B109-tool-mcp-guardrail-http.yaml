dod:
  - text: Booted-proxy cases show tool_permission blocking and rewriting request tools and a forced tool_choice, its default action, and that a guardrail with default_on false runs only when the request names it.
    proof: [oracle]
  - text: Booted-proxy cases show tool_permission rewriting and blocking tool calls in chat answers, a failed argument pattern, a rebuilt stream, and an Anthropic messages answer.
    proof: [oracle]
  - text: Booted-proxy cases on Postgres show tool_policy blocking a globally blocked tool, a per-key override that leaves the master key alone, and a trust chain violation.
    proof: [oracle]
  - text: Booted-proxy cases show mcp_security blocking unregistered MCP servers with the sorted list, and mcp_end_user_permission filtering an end user's tools on /v1/messages and behaving as LiteLLM does on chat.
    proof: [oracle]
  - text: Booted-proxy cases show the JWKS document for a configured and a generated key and without a signer, the OpenID document's signer fields, a 401 for an inactive introspected token and a 403 for missing required claims.
    proof: [oracle]
  - text: A booted-proxy case shows a signed MCP tool call sending a signed Authorization header on every request of its upstream session and none on the startup listing, with the tools/call body compared.
    proof: [oracle]
