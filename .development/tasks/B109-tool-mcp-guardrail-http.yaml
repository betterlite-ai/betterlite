deviations: []
out_of_scope:
  - "Every function of mcp_jwt_signer.py and mcp_jwt_signer/__init__.py: B3816 (keys, JWKS, IdP documents, incoming token, pre-call flow, upstream helper), B3817 (claims, scope, debug header) and B8254 (initialize_guardrail, the registry entries and JwtSignerSlot for get_mcp_jwt_signer). The two registries become B8521's mcp_jwt_signer arm; get_supported_event_hooks is B8521's supported_event_hooks list."
  - "The guardrail classes: B3810 to B3813 (tool_permission), B3814 (tool_policy), B3815 (mcp_end_user_permission and mcp_security). Registry arms: B3682 and B8521. Running a held guardrail: B8666. Callbacks and the signer slot at startup: B8613 and B8610. Proxy hooks: B8399. The unified apply_guardrail path: B3680. The tool policy registry and its refresh: B1606 and B8384, wired by B8665."
  - "Routes and mounts: B004 and B6370 (chat), B081 (/v1/messages), B8626 (/mcp-rest), B8624 over B7321 (the well-known documents), B830 (/end_user/new), B062 (/v1/tool/policy), B055 (/key/generate). The MCP tool pre-check that hands the signer its bearer token: B8464; the tools/list JWT gate: B8462 over B8461."
  - "B3818's MCP guardrail translation over HTTP: B8992."
  - "The compare.ignore selector forms jwt-signed-tool-call and the startup listing use: B9850. The claims inside the signed token, which a header selector leaves uncompared: B3816's and B3817's tests."
  - "mcp_security with on_violation alert and a request that names only registered servers: past the guardrail the request enters B140's MCP tool handling, which this task doesn't depend on."
  - "The pre_mcp_call mode check in the signer's initializer: it fails at startup, and the oracle has no startup-failure case kind. B8254's tests cover it."
  - "An Anthropic SSE stream through tool_permission: raw-frame stream guardrails wait on B8993's blocker."
  - "violation_message_template on tool_permission: B3811 renders the default text until B3664's render_violation_message lands, so a template case would fail on a part this task can't fix."
pitfalls:
  - "tool_permission skips request tools whose type isn't function, so Anthropic-style request tools on /v1/messages are never checked at pre_call; use post_call there."
  - "Rewrite turns a forced tool_choice naming a denied tool into the string \"none\", not into auto, and drops only function tools whose name was denied."
  - "When an allowed_param_patterns rule fails and default_action is deny, the message is the pattern failure text and has no (Rule: ...) suffix, because the rule id is None."
  - "post_call block raises GuardrailRaisedException, not the HTTPException with detection_message that pre_call raises, so the two block cases have different error bodies."
  - "tool_policy's registry is only initialized when the proxy has a database, so a tool_policy case without {{postgres}} passes every tool through."
  - "/key/generate returns the raw key in key and its hash in token; /v1/tool/policy takes the hash as key_hash, and the hash differs on each side, so ignore /key_hash in that answer with this reason."
  - "mcp_security only reads tools of type mcp whose server_url starts with litellm_proxy/mcp/; a server_url with a full http URL is not checked by this guardrail."
  - "mcp_end_user_permission takes the server name as the part of the tool name before the first hyphen, so name tools github-create_issue and jira-create_ticket, and keep local_lookup free of hyphens so it is kept as a non-MCP tool."
  - "The JWT signer treats a bearer token with exactly two dots as a JWT and anything else as opaque, so the master key oracle-master goes to introspection; a master key with two dots would fetch the discovery document instead."
  - "LiteLLM lists the tools of every mcp_servers entry at startup (mcp_server_manager.py L6683-L6714), so any case with `github` on {{upstream}} first captures initialize, notifications/initialized and tools/list: script those three answers ahead of the case's own, give that initialize `/upstream/0/body` with the clientInfo reason, and in jwt-introspection-inactive the introspection answer {\"active\": false} comes fourth. Run each signer case with --self-check first and take the indices from its capture."
  - "The signed Authorization goes into the MCP session's transport headers, so the call session's initialize and notifications/initialized carry it too, not only tools/call; a selector on tools/call alone leaves the other two failing."
