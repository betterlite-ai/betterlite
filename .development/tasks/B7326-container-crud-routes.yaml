    why: create_container, from its two decorators through the body read, the provider chain with the body source, the guarded processing call and the ownership recording outside it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/endpoints.py#L161-L263
    why: list_containers, its declared after, limit and order parameters, the data map, fetch_page and the admin or owned-list split.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/endpoints.py#L266-L369
    why: retrieve_container, with the access check and forwarding params before the guarded call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/endpoints.py#L372-L475
    why: delete_container, the same shape as retrieve with route type adelete_container.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/endpoints.py#L478-L483
