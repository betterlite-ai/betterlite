id: B7326
title: Container create, list, retrieve and delete routes
description: >-
  Register the four container routes of litellm/proxy/container_endpoints/endpoints.py and build the handler behind each, in betterlite-server as module api::container_routes
  (crates/betterlite-server/src/api/container_routes.rs and container_routes/**), mounted once from a route stub module routes/containers.rs that B8635 fills and mounts.
  Each route is registered at the `/v1` prefix and at the bare path, so eight registrations: POST /v1/containers and POST /containers (create, route type acreate_container), GET /v1/containers and
  GET /containers (list, alist_containers), GET /v1/containers/{container_id} and GET /containers/{container_id} (retrieve, aretrieve_container), DELETE /v1/containers/{container_id} and
  DELETE /containers/{container_id} (delete, adelete_container). Every route sits behind B756 authentication and reads the authenticated caller (LiteLLM lists user_api_key_auth as a route dependency and as a
  handler parameter, and it runs once). Use the path syntax the workspace's axum version takes for `{name}` segments. The five container file routes under /containers/{container_id}/files
  are B3372 and share no path and method with these. The route type text comes from B7430's `ContainerRouteType::name`, not from string literals in this module.

  Wiring. B3371 declares the `ContainerAccess` and `RequestProcessing` traits, `ProviderHints` and `pick_provider`; B3372 shows the same wiring for the file routes. This task builds one `ContainerRoutes`
  value that holds `Arc<dyn ContainerAccess>`, `Arc<dyn RequestProcessing>` and a new trait `ContainerOwners` declared here. `ContainerOwners` has two async methods, both thin adapters in
  production over B3362: `list_owned(pages, after, limit, caller, provider)` (B3362's list_owned_containers, where `pages` is a `&dyn ContainerPages`, a trait declared here with
  `async fn fetch_page(&self, after: Option<String>, limit: Option<i64>) -> Result<Value, ContainerRouteError>`) and `record_owner(reply, caller, provider)` (record_container_owner, which returns
  the reply it was given). The production `RequestProcessing` runs B8801's shared PreCall step (keep `Arc<dyn PreCall<UserAPIKeyAuth>>` in the route state, built with `PreCallStep::standalone` in routes(state), which B8804 swaps for the production step) and then B004's common request processing, which reaches the container route types through B7430's ContainerCall dispatch entry; this task
  passes the route type name and the data map and nothing else. `ContainerRouteError` is this module's error enum: Body (B1100's body error), Access (B3362's 403 "Forbidden", kept as it is),
  Owner (an error from record_owner, with its status and detail), Query (a bad `limit`, see list) and Processing (the mapped error that `handle_exception` returns). Each variant keeps its source by `#[from]`.

  Provider pick. For list, retrieve and delete the provider is B3371's `pick_provider` (custom-llm-provider header, then the custom_llm_provider query value, then "openai"; an empty value falls through).
  Create has one more source between the query value and the default: the `custom_llm_provider` key of the JSON body (B2400's body accessor). So create takes the header, then the query value, then the body
  value, then "openai", each only when non-empty. Build create's pick from the two `ProviderHints` fields and the body value in this module; do not change pick_provider.

  Create (endpoints.py L29-L158). (1) Read the JSON body into the data map with B1100's body reader; a body failure is B1100's error and never reaches `handle_exception`. (2) Pick the provider as above
  and set `data["custom_llm_provider"]` to it, replacing any body value. No ownership check: a new container has no id yet. (3) Inside the guarded section call `RequestProcessing::process(data,
  "acreate_container", caller)` with no model; any failure goes to `handle_exception` once. (4) Outside that guarded section call `ContainerOwners::record_owner(reply, caller, picked provider)` with the
  provider picked in step 2 (not any provider the reply names). If it fails with an HTTP error (B3362 raises 403 "Unable to record container ownership: caller has no identity scope.", 403 "Forbidden" and
  500 "Unable to track container"), return that error as `{"detail": ...}` with its status, not through `handle_exception`. If it fails with any other error, log it at error level with the text
  "Container ownership recording failed after upstream create; returning response with untracked ownership" and return the upstream reply unchanged with status 200. On success return what
  record_owner returned. The upstream container already exists in the failing cases, and that is LiteLLM's behavior.

  List (L161-L263). `after` (string), `limit` (integer) and `order` (string) are declared query parameters. A `limit` that is not an integer is rejected before the handler runs with HTTP 422 and
  FastAPI's validation body (detail list with type "int_parsing", loc ["query", "limit"]); the oracle case below pins the exact body. Steps. (1) `query_params` is every query parameter as a map of
  strings, a repeated key keeping its last value. (2) The provider is `pick_provider`. (3) The base data is `{"query_params": that map, "model": the query value of "model" or null, "order": the order
  value or null, "custom_llm_provider": the pick}`. Undeclared query names reach data only inside "query_params", and `after` and `limit` are not in the base data. (4) `fetch_page(page_after,
  page_limit)` builds a fresh copy of the base data plus `after` and `limit` (both keys present, null when absent), then runs `process` with "alist_containers" and no model, with failures going to
  `handle_exception`. A fresh processor per page means one fetch is one `process` call. (5) If the caller is a proxy admin (B1018's is_proxy_admin: role PROXY_ADMIN), return `fetch_page(after, limit)`
  unchanged, one upstream call and no filtering. (6) Otherwise return `ContainerOwners::list_owned` with the fetcher, `after`, `limit`, the caller and the pick. B3362 owns the filtering, the 100-item pages and the
  five-page cap; this task only supplies the fetcher. The ownership lookup is not wrapped in `handle_exception`, but each page fetch inside it is.

  Retrieve (L266-L369) and delete (L372-L475) differ only in the route type ("aretrieve_container", "adelete_container"). Steps. (1) data starts as `{"container_id": the path value}`. No query parameter
  and no body is forwarded. (2) The provider is `pick_provider`. (3) `ContainerAccess::check_access(container_id, caller, provider)` returns the original container id and the resolved provider (a 403
  `{"detail": "Forbidden"}` for a caller who does not own the container, admins bypass). (4) `forwarding_params(container_id, original_container_id, resolved_provider)` returns container_id,
  custom_llm_provider and model_id when present; update data with it, overwriting earlier keys. Steps 3 and 4 run before the guarded section, so a denial is the plain detail body and never
  goes through `handle_exception`. (5) In the guarded section call `process` with the route type and no model and return the reply unchanged.

  Responses. A success is HTTP 200 with the reply as JSON and the response headers B004 set (the x-litellm-* headers), the same as B3372's file routes. Error bodies from B004 keep its OpenAI error
  object; the 403 and 500 above are `{"detail": ...}`.

  HTTP oracle cases. These are new routes a client sees, so B8635, which mounts them, adds cases under tools/oracle/cases/api/container-routes, run against LiteLLM and betterlite with master_key=sk-test, a second
  non-admin virtual key (created through the key route) and the OpenAI mock provider's container endpoints (B3363 owns the provider side). They check: create on both prefixes with the data the provider
  received (a body custom_llm_provider is replaced by the picked one; the header beats the query value, which beats the body value); the list route on both prefixes with admin and with the non-admin key (the
  non-admin key sees only the containers it created through POST /v1/containers, and limit, order and after reach the provider as strings with an unknown query name absent); a non-integer limit answering 422;
  retrieve and delete on both prefixes for the owner and for a second key that gets 403 `{"detail": "Forbidden"}` with zero provider requests; and a missing or wrong key giving 401 on all eight paths. Where the fixture needs
  an owned container it creates one through POST /v1/containers with the owner key. B3372's 403 case relies on this route: its fixture can create containers through it once this task merges.

  Tests in api::container_routes::tests use fakes for the three traits. Name them route_aliases, create_data, create_owner, list_data, list_scope, item_flow, item_access, error_bodies and auth_failures.
  Budget from about 120 owned LiteLLM lines (four handlers of about 30 lines each; the file-route mount at the end of the file is B3372's call): 280 implementation, 450 tests and 130 oracle fixtures.
scope:
  paths:
    - crates/betterlite-server/src/api/container_routes.rs
    - crates/betterlite-server/src/api/container_routes/**
    - crates/betterlite-server/src/routes/containers.rs
    - crates/betterlite-server/src/routes/containers/**
    - tools/oracle/helpers/b7326.py
    - tools/oracle/helpers/b7326/**
    - tools/oracle/src/helpers/server/b7326.rs
    - tools/oracle/src/helpers/server/b7326/**
  lint_tables: false
references:
