  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/ownership.py#L177-L249
    why: record_container_owner, whose HTTP errors create lets through and whose other errors it swallows (B3362).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/ownership.py#L433-L455
    why: list_owned_containers and the fetch_page callback shape that the list handler supplies (B3362).
dod:
  - text: >-
      The four routes are registered once each at the /v1 prefix and the bare path with their methods (POST and GET on /containers, GET and DELETE on /containers/{container_id}), the other methods on those paths answer 405, and a request without a valid key gets 401 from B756 with no provider request, on all eight paths.
    proof: [route-aliases, auth-failures]
  - text: >-
      Create picks the provider from the header, then the query value, then the body value, then "openai", puts it in data over any body value, passes the route type acreate_container with no model, and runs no ownership check before processing.
    proof: [create-data]
  - text: >-
      Create records the owner after processing with the picked provider; an HTTP error from the recorder is returned with its status and a plain detail body and skips exception handling, any other recorder error is logged and the upstream reply is returned with status 200, and a good record returns what the recorder returned.
    proof: [create-owner, error-bodies]
  - text: >-
      List builds the data map with the full query map under "query_params", the model query value, order and the pick, adds after and limit (null when absent) per page, and passes route type alist_containers with no model.
    proof: [list-data]
  - text: >-
      An admin caller gets one unfiltered page fetch, any other caller goes through list_owned with a fetcher that makes one process call per page, and a limit that is not an integer answers 422 before any processing.
    proof: [list-scope]
  - text: >-
      Retrieve and delete check access with the picked provider, update data with the forwarding result over earlier keys, send only container_id, custom_llm_provider and model_id with route types aretrieve_container and adelete_container, and return the reply unchanged.
    proof: [item-flow]
  - text: >-
      A caller that does not own the container gets 403 with the body {"detail": "Forbidden"} on retrieve and delete, no provider request is made, and the denial never goes through exception handling.
    proof: [item-access, error-bodies]
  - text: Tests drive the handlers with tower's oneshot over the module's own Router and fake ports; B8635 mounts the routes and proves them over HTTP.
    proof: [route-aliases, auth-failures]
checks:
  optional: []
  commands:
    - id: route-aliases
      why: one of the eight paths is missing, registered twice, or answers the wrong method
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::route_aliases($|::)/)'
    - id: create-data
      why: the create provider chain, the data map or the route type is wrong, or an ownership check runs before processing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::create_data($|::)/)'
    - id: create-owner
      why: the owner is not recorded, recorded before processing, or its errors are handled the wrong way
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::create_owner($|::)/)'
    - id: list-data
      why: the list data map, the null after and limit keys or the route type is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::list_data($|::)/)'
    - id: list-scope
      why: admins are filtered, other callers are not, a page fetch is repeated, or a bad limit is accepted
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::list_scope($|::)/)'
    - id: item-flow
      why: retrieve or delete skips the forwarding update, sends extra keys, or uses the wrong route type
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::item_flow($|::)/)'
    - id: item-access
      why: the access check is missing, runs after processing, or uses a provider other than the pick
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::item_access($|::)/)'
    - id: error-bodies
      why: a 403 or 500 is shaped as an OpenAI error object or goes through exception handling
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::error_bodies($|::)/)'
    - id: auth-failures
      why: a route is reachable without a valid key or reaches the provider first
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_routes::tests::auth_failures($|::)/)'
oracle_cases: []
deviations:
  - what: The authenticated caller is read once per request.
    why: LiteLLM lists user_api_key_auth as a route dependency and as a handler parameter, and FastAPI runs it once for both; the client sees the same 401.
out_of_scope:
  - "The ownership service (record_container_owner, assert_user_can_access_container, get_container_forwarding_params, list_owned_containers and the 100-item, five-page filter): B3362. This task calls it through the ContainerOwners and ContainerAccess traits."
  - "pick_provider, ContainerAccess, RequestProcessing and ProviderHints: B3371. The five container file routes, their JSON processor and the register_container_file_endpoints call at endpoints.py L478-L483: B3372."
  - "The mapping from the four container route types to the SDK calls (route choice, router wrappers, direct calls): B7430. The SDK create, list, retrieve and delete calls: B3369 and B3370."
  - "ProxyBaseLLMRequestProcessing.base_process_llm_request and _handle_llm_api_exception: B004. Request body decoding: B1100. The provider accessors: B2400. Authentication: B756 and B732. is_proxy_admin: B1018."
pitfalls:
  - "Create is the only route that reads the body and the only one whose provider chain has a body step (header, query, body, default); list, retrieve and delete stop at the query value."
  - "Create has no access check, and its record_owner call sits outside the try block, so a 403 or 500 from it is a plain {\"detail\": ...} after the container already exists upstream."
  - "A record_owner error that is not an HTTP error is logged and swallowed, so the client still gets the upstream reply with 200 and the container stays untracked (later calls by a non-admin key get 403)."
  - "List puts `after` and `limit` in each page's data as null keys when absent, but not in the base data; `model` and `order` are always present and null when absent."
  - "An admin caller's list is one upstream call with the client's own after and limit, while any other caller's list asks upstream for pages of 100 whatever limit the client sent (B3362)."
  - "`limit` is typed as an integer in LiteLLM's signature, so limit=abc is a 422 from FastAPI before the handler, and it is checked even for admins."
  - "Retrieve and delete send only container_id, custom_llm_provider and optional model_id, so a client's query string and custom-llm-provider header influence only the pick, never data directly."
  - "The forwarding update overwrites container_id and custom_llm_provider, so the id the provider receives is the decoded original and not the path value when the path carries a wrapped id."
  - "The access check and forwarding lookup run before the try block, so a 403 does not become an OpenAI error object; the non-owner and an unknown container look the same (403) because untracked containers are admin-only."
  - "The custom-llm-provider header is the one with dashes and the query key is custom_llm_provider with underscores; the body key on create uses underscores too."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
