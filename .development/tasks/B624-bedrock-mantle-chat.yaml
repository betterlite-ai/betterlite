deviations:
- what: 'Open, waiting for Max: keep request image/PDF/file URLs unfetched (current behavior), or permit controlled
    request-URL downloads. This task keeps URLs as provider-forwardable descriptors and rejects a URL when local
    bytes are required; only supplied bytes or already authorized local file handles may be read.'
  why: The URL-download product decision is open. Build no downloader, request-path filesystem access or follow-on
    feature that depends on fetching.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/mantle/transformation.py#L39-L143
out_of_scope:
- B028 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_mantle_chat in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/mantle_chat.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_mantle_chat.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The Messages beta helper mutates the original lowercase header key but does not remove differently cased variants.
- Chat calls only the parent body builder, so the parent's document conversion and automatic beta construction do
  not run.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
