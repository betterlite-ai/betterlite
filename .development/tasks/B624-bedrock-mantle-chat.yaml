checks:
  optional:
  - mutants
  commands:
  - id: case-mantle-chat-url
    why: The mantle-chat-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_chat_cases::case_[0-9]+_mantle_chat_url$/)'
  - id: case-mantle-message-url
    why: The mantle-message-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_chat_cases::case_[0-9]+_mantle_message_url$/)'
  - id: case-beta-header-not-body
    why: The beta-header-not-body behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_chat_cases::case_[0-9]+_beta_header_not_body$/)'
  - id: case-model-body-restoration
    why: The model-body-restoration behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_chat_cases::case_[0-9]+_model_body_restoration$/)'
  - id: case-mantle-native-sse
    why: The mantle-native-sse behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_chat_cases::case_[0-9]+_mantle_native_sse$/)'
  - id: case-mantle-usage-fields
    why: The mantle-usage-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_chat_cases::case_[0-9]+_mantle_usage_fields$/)'
  - id: case-remote-url-current-rejection
    why: The remote-url-current-rejection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_chat_cases::case_[0-9]+_remote_url_current_rejection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_mantle_chat.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_chat*")"
      && grep -lq 'bedrock_mantle_chat' tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_chat* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_mantle_chat$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
