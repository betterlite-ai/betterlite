- what: >-
    Open, waiting for Max: keep request image/PDF/file URLs unfetched (current behavior), or permit controlled request-URL
    downloads. This task keeps URLs as provider-forwardable descriptors and rejects a URL when local bytes are required;
    only supplied bytes or already authorized local file handles may be read.
  why: The URL-download product decision is open. Build no downloader, request-path filesystem access or follow-on
    feature that depends on fetching.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/mantle/transformation.py#L39-L143
