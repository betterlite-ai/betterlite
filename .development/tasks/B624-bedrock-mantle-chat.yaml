    AmazonMantleConfig.async_transform_request, AmazonMantleConfig._restore_mantle_body_fields, AmazonMantleConfig.has_custom_stream_wrapper,
    AmazonMantleConfig.get_model_response_iterator. Other functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/messages/mantle_transformation.py#L43-L181
  why: >-
    Own _move_betas_into_header, AmazonMantleMessagesConfig.beta_headers_provider, AmazonMantleMessagesConfig.should_filter_anthropic_beta_headers,
    AmazonMantleMessagesConfig.get_complete_url, AmazonMantleMessagesConfig.validate_anthropic_messages_environment,
    AmazonMantleMessagesConfig.transform_anthropic_messages_request, AmazonMantleMessagesConfig.transform_anthropic_messages_response,
    AmazonMantleMessagesConfig.get_async_streaming_response_iterator. Other functions in this file remain with the
    owners listed below.
