id: B624
title: Bedrock Mantle Claude chat and Messages
description: >-
  Add Mantle native Claude chat/Message overrides, using configured endpoint selection, beta-header relocation,
  model/body restoration and Anthropic SSE decoding rather than AWS event frames. Preserve usage/body fields returned
  by Mantle and native request header filtering.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/mantle/transformation.py:
  AmazonMantleConfig.get_complete_url L39-L53; AmazonMantleConfig.validate_environment L55-L77; AmazonMantleConfig.transform_request
  L79-L104; AmazonMantleConfig.async_transform_request L106-L120; AmazonMantleConfig._restore_mantle_body_fields
  L123-L125; AmazonMantleConfig.has_custom_stream_wrapper L128-L129; AmazonMantleConfig.get_model_response_iterator
  L131-L143. litellm/llms/bedrock/messages/mantle_transformation.py: _move_betas_into_header L43-L48; AmazonMantleMessagesConfig.beta_headers_provider
  L60-L61; AmazonMantleMessagesConfig.should_filter_anthropic_beta_headers L63-L64; AmazonMantleMessagesConfig.get_complete_url
  L66-L80; AmazonMantleMessagesConfig.validate_anthropic_messages_environment L82-L116; AmazonMantleMessagesConfig.transform_anthropic_messages_request
  L118-L147; AmazonMantleMessagesConfig.transform_anthropic_messages_response L149-L166; AmazonMantleMessagesConfig.get_async_streaming_response_iterator
  L168-L181.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  with direct dependencies. Provider leaves must never import betterlite-core, and no copied helper algorithm is
  permitted.


  remote-url-current-rejection supplies an http:// image or PDF URL requiring local bytes and expects ImageFetchError
  status 400 before transport under the current open request-download decision; inject the same failed-download
  seam into the pinned helper. Inline bytes continue to compare normally; provider-forwardable URL descriptors remain
  unchanged where the source forwards them.


  Reuse ModelResponseIterator.__init__ from B581 (litellm/llms/anthropic/chat/handler.py); its implementation remains
  with that prerequisite.


  Reuse build_mantle_messages_url from B690 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: mantle_chat_url: Chat resolves region through B591 using original model/options, then calls
  B690 build_mantle_messages_url(api_base, optional_params.aws_bedrock_runtime_endpoint, region). Preserve that
  helper's exact endpoint and suffix rules. Chat environment validation uses B2205 Invoke validation, including
  guardrail/metadata header cases, then a truthy litellm_params.aws_bedrock_project_id overwrites the exact anthropic-workspace
  key; falsey values leave existing headers unchanged. B598 owns the project-id configuration loader (default None).
  mantle_message_url: Messages uses the identical B591/B690 URL call and cases. Its environment validation instead
  calls B622, then adds a truthy anthropic-workspace project ID and adds anthropic-version: 2023-06-01 only if no
  existing header name matches anthropic-version case-insensitively. An existing version with an empty value still
  blocks the default. Preserve the resolved api_base returned by the parent; exact-key workspace overwrite may coexist
  with a differently cased caller key. beta_header_not_body: Messages sets beta_headers_provider=bedrock_mantle
  and should_filter_anthropic_beta_headers=False. Remove the first mantle/ occurrence, call B622 request preparation
  with that model, then validate the result as dict[str,object]. Validate request.anthropic_beta or () as tuple[str,...];
  accepted list/tuple preserves order and duplicates. A nonempty result sets the exact lowercase anthropic-beta
  header to comma-joined values; an empty result removes only that lowercase key, leaving differently cased keys
  alone. Mutate the same header dict that will be signed. Remove anthropic_version and anthropic_beta from the body,
  then add model only if truthy and stream only for literal True. Chat does not perform this header/body relocation;
  keep that distinction. model_body_restoration: Chat removes the first mantle/ occurrence anywhere in model using
  replace(...,1), not just a leading prefix. Call B618 _build_bedrock_anthropic_request_base directly, bypassing
  its document-URL conversion and computed beta-list step. Return a copy restoring model unconditionally, including
  empty string; add stream=True only when original options.stream is literally True. _restore_mantle_body_fields
  alone retains any preexisting stream field when no new one is added. Async first runs B183 async_inline_remote_media,
  then the same sync method. mantle_native_sse: Chat has_custom_stream_wrapper is False and get_model_response_iterator
  constructs B581 ModelResponseIterator with streaming_response,sync_stream,json_mode unchanged. Messages calls
  B962 AnthropicMessagesConfig.get_async_streaming_response_iterator directly, with model/http response/request
  body/logging unchanged. Both consume native Anthropic SSE; neither invokes the AWS event decoder or B623 stop-usage
  promotion in these overrides. mantle_usage_fields: Messages first uses B962 inherited native response decode and
  its raw-status AnthropicError behavior. Let existing_usage=response.usage or {}; return a copy with usage defaults
  input_tokens=0,output_tokens=0 overwritten by every existing usage item. Preserve explicit None counts, cache
  fields, extra keys and all other response fields. Truthy malformed nonmapping usage fails instead of becoming
  {}. No token estimation or header-based count promotion runs here.


  Add standalone Rust test mantle_claude_never_fetches_request_urls: public URLs that require B183 async inlining
  fail with ImageFetchError status 400 and zero outbound attempts. The helper oracle remote_url_current_rejection
  uses blocked loopback input; chat sync only preserves provider-forwardable document descriptors because it deliberately
  bypasses B618 document conversion.


  Write standalone Rust test mantle_claude_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test mantle_claude_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/mantle_chat.rs with adjacent tests under mantle_chat/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function mantle_chat_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  mantle_chat_url, mantle_message_url, beta_header_not_body, model_body_restoration, mantle_native_sse, mantle_usage_fields,
  remote_url_current_rejection. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_chat* using HelperCase: kind:
  helper and the externally tagged bedrock_mantle_chat variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_mantle_chat that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 213 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 235 production lines, 275 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines.
