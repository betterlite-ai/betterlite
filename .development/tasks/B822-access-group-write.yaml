id: B822
title: Create, update and delete access groups
description: >-
  Implement /v1/access_group create/put/delete using typed inputs and transaction-scoped membership synchronization.
  Keep agent detachment, registry/cache patching and source 201/204 response behavior; registered-agent
  mutations are injected and tested without duplicating B142.


  Also own POST /v1/unified_access_group and PUT/DELETE /v1/unified_access_group/{access_group_id}; preserve
  201 create and 204 delete status, AccessGroupCreateRequest and AccessGroupResponse. Agent registry mutation
  port belongs to B141, not B142.


  Build the production access_group_write module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/access_group_endpoints.py:
  _sync_add_access_group_to_teams (L317-L325; 9 source lines), _sync_remove_access_group_from_teams (L328-L336;
  9 source lines), _sync_add_access_group_to_keys (L339-L347; 9 source lines), _sync_remove_access_group_from_keys
  (L350-L358; 9 source lines), _without_access_group (L361-L362; 2 source lines), _detach_access_group_from_agents
  (L365-L376; 12 source lines), _detach_access_group_from_agent_registry (L379-L393; 15 source lines),
  _patch_team_caches_add_access_group (L401-L427; 27 source lines), _patch_team_caches_remove_access_group
  (L430-L450; 21 source lines), _patch_key_caches_add_access_group (L453-L478; 26 source lines), _patch_key_caches_remove_access_group
  (L481-L500; 20 source lines), create_access_group (L513-L577; 57 source lines), update_access_group
  (L620-L710; 76 source lines), delete_access_group (L717-L813; 78 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /v1/access_group -> create_access_group;
  POST /v1/unified_access_group -> create_access_group; PUT /v1/access_group/{access_group_id} -> update_access_group;
  PUT /v1/unified_access_group/{access_group_id} -> update_access_group; DELETE /v1/access_group/{access_group_id}
  -> delete_access_group; DELETE /v1/unified_access_group/{access_group_id} -> delete_access_group. For
  each route send a typed successful request, an invalid or missing target, and a caller lacking that
  route permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 370 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  370 production, 157 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 592 changed lines estimated within a 600-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
