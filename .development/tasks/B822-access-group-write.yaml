id: B822
title: Create, update and delete access groups
description: >-
  Implement the create, PUT and DELETE access-group routes with B821 request models/guards/projections
  and B2340 assignment/cache effects. All first require proxy_admin (viewers are denied with B821's 403)
  then B124's connected-DB check (500); neither check is inside the route try. There is no management
  effects decorator. Create and PUT return AccessGroupResponse at 201 and 200; DELETE returns an empty
  204. Register each original and unified alias once. Cases write_roles_and_db_order and
  unified_write_statuses exercise every method/path through B052.

  Create opens a transaction, looks up the requested name, rejects a duplicate with 409 string detail
  "Access group '<name>' already exists", then B821-validates assigned team IDs (400 sorted unknown
  IDs). Create the group with description unchanged, all five nullable list fields converted through
  value-or-[] and created_by/updated_by set to caller user_id, including null. Do not normalize order or
  duplicates in the group arrays or validate model/MCP/agent/key existence. B2340 adds reverse team links
  then key links; unknown keys are skipped but their hashes remain in assigned_key_ids. Commit before
  caching the group, patching team caches, patching key caches, then response enrichment. Cases
  create_null_defaults_and_actor, duplicate_name_409, unknown_team_rolls_back, unknown_key_retained and
  create_commit_cache_response_order cover all effects.

  PUT uses exclude_unset: always set updated_by, preserve omitted fields, turn explicit null into []
  only for the five lists, and keep explicit null name/description for the database to handle. In the
  transaction, require the group (404 "Access group '<id>' not found"), validate supplied teams, compute
  old teams with B821's repaired attached projection but old keys from the stored array only. For each
  supplied assignment field compute set differences; omitted assignments use old sets and cause no
  reverse-link changes, even when the read projection found drift. Update the group using the original
  ordered/duplicate request arrays, then add teams, remove teams, add keys, remove keys. Commit; cache
  the group, perform those same four cache patches in order, and enrich the response. Cases
  update_absent_null_and_empty, repaired_team_delta_vs_stored_key_delta, unchanged_assignment_no_heal
  and update_effect_order inspect source behavior without promising concurrent serialization: there
  is no explicit lock/CAS around these reads and writes.

  Create/PUT rethrow HTTPException; transaction exceptions whose text contains case-insensitive
  "unique constraint" or exact "P2002" become 409 with the same name message (PUT uses the updated
  name or "" when absent). Other exceptions propagate. Their cache/enrichment failures are outside
  this catch and occur after commit. Native unique_race_mapping and post_commit_response_failure verify
  the distinction; do not apply handle_exception_on_proxy.

  DELETE finds the group inside a transaction or returns the same 404. Query teams carrying this group
  and keys carrying it, retaining the union with the stored assignment IDs for later cache patches.
  Remove group IDs from returned team rows directly, then B2340-remove stored-only team IDs; do the same
  for keys. B2340 detaches all matching agent rows, then delete the group and commit. Afterward invalidate
  the group through B819, detach the returned agents from B141's registry via B2340, patch team caches,
  then key caches. No alias/token transforms or credential writes occur. Cases delete_drifted_both_sides,
  delete_agent_then_group and delete_post_commit_effect_order verify the sequence. Failed registry/cache
  effects leave the deletion committed and may prevent subsequent effects.

  DELETE's catch covers both transaction and post-commit work. HTTPException passes through; other
  exceptions log the group ID/error. B872 infrastructure classification takes precedence and yields
  503 with string detail=CommonProxyErrors.db_not_connected_error; otherwise exact "P2025" or both
  case-insensitive "record" and "not found" yields 404; all others yield 500 "Failed to delete access
  group. Please try again.". Native delete_exception_precedence exercises each branch including cache
  failures. B003 maps those HTTPExceptions to its error type/param/code envelope. postgres_pinned_rows
  and postgres_failure_effects cover full transaction rollback versus post-commit failures. These
  handlers read no setting/environment and contain no license branch.


  Also own POST /v1/unified_access_group and PUT/DELETE /v1/unified_access_group/{access_group_id}; preserve
  201 create and 204 delete status, AccessGroupCreateRequest and AccessGroupResponse. B2340 owns the
  B141 registry mutation calls so this final part composes them without duplicating the leaf implementation.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/access_group_endpoints.py:
  create_access_group (L513-L577; 57 source lines), update_access_group
  (L620-L710; 76 source lines), delete_access_group (L717-L813; 78 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /v1/access_group -> create_access_group;
  POST /v1/unified_access_group -> create_access_group; PUT /v1/access_group/{access_group_id} -> update_access_group;
  PUT /v1/unified_access_group/{access_group_id} -> update_access_group; DELETE /v1/access_group/{access_group_id}
  -> delete_access_group; DELETE /v1/unified_access_group/{access_group_id} -> delete_access_group. For
  each alias use B001 HTTP cases for the named create/update/delete behavior, including JSON response
  content-type and an actually empty DELETE body. Database/cache faults are native tests, not simulated
  FastAPI helper calls. B821 owns decoding; B2340's extracted effects keep the full work below 800 lines.


  B860 assignment-route fixtures use POSTGRES_TEST_URL or, if absent, testcontainers; database setup
  failures fail, and every rollback assertion distinguishes the group transaction from later cache effects.


  Sizing after splitting B2340's 159 helper lines: 211 nonblank, noncomment handler lines plus write alias
  declarations; allow 240 production, 350 behavior/Postgres tests, 0 helper adapters, 75 route/wiring,
  0 decoder/fuzz and 0 config lines, 665 changed lines within a 700-line gate.


