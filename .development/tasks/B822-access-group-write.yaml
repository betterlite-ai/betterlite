dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: create_201, update_assignments,
      unknown_team, delete_detaches_agent, delete_204, transaction_rollback, non_admin_write_denied, postgres_pinned_rows,
      postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^access_group_write::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/access_group_write::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/access_group_write::tests::postgres_failure_effects$/)'
