id: B8310
title: Fireworks, Together, Groq, Cloudflare, Perplexity and NVIDIA NIM dispatch
description: >-
  The provider parts of the aggregator group build pure configs and leave the call sites to the umbrella: B6070 to B6072 and B5832 (Fireworks), B5831 (Together), B5833 (Groq), B5836 (Cloudflare), B5834 and B6120 (Perplexity) and B5837 (NVIDIA NIM). This task owns those call sites. Put them in the module hosted_platform_dispatch of betterlite-provider and plug each arm into the dispatch table through B2230's chat selection and B5360's media and resource selection, the same way B8157 does for the self-hosted providers. Unknown providers still fail as before.


  Settings. Add the config section hosted_platform_keys. It reads the litellm_settings globals api_key, api_base, headers, groq_key and cloudflare_api_key, and the env vars GROQ_API_KEY, GROQ_API_BASE, CLOUDFLARE_API_KEY, CLOUDFLARE_API_BASE, CLOUDFLARE_ACCOUNT_ID, and FIREWORKS_AI_API_KEY. Every value defaults to None, and an empty string counts as unset, since LiteLLM chains them with `or`. The dispatch functions take the section as config.sections.hosted_platform_keys and never read the environment themselves.


  _complete_fireworks_ai (main.py L1853-L1907). Take the context fields as B050 lists them. When the provider config is the Fireworks chat config, replace optional_params with that config's map_extra_body_params(optional_params, model) from B6071; with any other config keep them as they are. Call the shared HTTP completion handler with provider_config. No key or base is resolved here: get_llm_provider already filled them (B211's fireworks_ai branch). When the handler fails, log post_call with the error text as original_response and additional_args {"headers": headers}, then return the same error unchanged.


  _complete_together_ai (L1910-L1957). Pass every context field to the shared HTTP completion handler with provider_config, and log post_call on failure in the same way as Fireworks.


  _complete_groq (L2111-L2170). api_base is api_base, else the global api_base, else GROQ_API_BASE, else "https://api.groq.com/openai/v1". api_key is api_key, else the global api_key, else the groq_key global, else GROQ_API_KEY. headers is headers, else the global headers. Then merge GroqChatConfig.get_config() (B5833) into optional_params: a key from the config is added only when optional_params lacks it, so a request value wins. Call the handler without provider_config, so it picks the Groq config from the provider name. There is no post_call and no error catch here.


  _complete_cloudflare (L4576-L4612). api_key is api_key, else cloudflare_api_key, else the global api_key, else CLOUDFLARE_API_KEY. api_base is api_base, else the global api_base, else CLOUDFLARE_API_BASE, with no default; pass it and CLOUDFLARE_ACCOUNT_ID to B5836's URL rule, which builds the URL when the base is missing. headers are passed as they came, with no global fallback. The function sends custom_llm_provider "cloudflare", no provider_config and no client, so the handler uses its own client. LiteLLM also computes custom_prompt_dict here and never passes it on, so nothing is done with it.


  Arms in the completion dispatch: fireworks_ai and together_ai (L5889-L5893), groq (L5903-L5904) and cloudflare (L6038-L6039). Keep the order: the text completion arm at L5881-L5888 (B024's) comes first, so a fireworks_ai or together_ai call with text_completion true goes there.


  Embedding arms in main.py embedding(). fireworks_ai (L6986-L6999): api_key is api_key, else the global api_key, else FIREWORKS_AI_API_KEY; api_base is passed as it came; the call is the OpenAI client embedding with no headers. perplexity (L7335-L7348): the shared HTTP embedding handler with api_base and api_key as they came and empty litellm_params. The together_ai and nvidia_nim embeddings go through the OpenAI branch at L6504-L6555, which B044 builds, so nothing is added for them.


  Config wiring. Where B2230 or B5360 returns a tag for these providers, build the config from its part: Fireworks chat, completion, Responses, embedding and rerank (B6070, B6071, B6072, B5832), Together chat, completion and rerank (B5831), Groq chat and transcription (B5833), Cloudflare chat and decisions (B5836), Perplexity chat, embedding, Responses, search and decisions (B5834, B6120), and NVIDIA NIM chat, embedding, rerank and passthrough (B5837). Chat for perplexity and nvidia_nim reaches B024's OpenAI-compatible arm (L5930-L5956), which takes the config this wiring builds.


  HTTP oracle cases through the booted proxy prove the parts end to end, since this is the first place a route reaches them: POST /v1/chat/completions for fireworks_ai, together_ai, groq (non-streaming and streaming) and cloudflare models with api_base set to the mock upstream, and POST /v1/embeddings for a fireworks_ai model. Use model names LiteLLM's model map lists at the pin, for example fireworks_ai/accounts/fireworks/models/llama-v3p1-8b-instruct, together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo, groq/llama-3.1-8b-instant and cloudflare/@cf/meta/llama-3.1-8b-instruct. Helper cases cover the key and base chains (groq, cloudflare, fireworks embedding).
