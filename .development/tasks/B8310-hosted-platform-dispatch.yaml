dod:
  - text: The Fireworks, Together, Groq and Cloudflare dispatch functions resolve key, base and headers as LiteLLM does and pass or omit provider_config the same way.
    proof: [hosted-dispatch-tests, oracle]
  - text: Fireworks and Together log post_call on a handler error and return the error unchanged; Groq and Cloudflare do not catch it.
    proof: [hosted-dispatch-tests]
  - text: The fireworks_ai and perplexity embedding arms match LiteLLM.
    proof: [hosted-dispatch-tests, oracle]
  - text: The hosted_platform_keys section loads every listed global and env var, with None defaults.
    proof: [hosted-keys-tests]
  - text: Chat and embedding calls for these providers through the proxy return the same status, body and upstream headers as LiteLLM.
    proof: [hosted-cases, oracle]
checks:
  optional: [mutants]
  commands:
    - id: hosted-dispatch-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^hosted_platform_dispatch::/)'
      why: Without the dispatch functions there are no such tests, so the check fails on the base branch.
    - id: hosted-keys-tests
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::hosted_platform_keys::/)'
      why: Without the section its loader tests are missing.
    - id: hosted-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/hosted-platforms tools/oracle/cases/helpers/hosted-platform-dispatch)"
      why: Without new case files the oracle proof passes with nothing compared.
oracle_cases:
  - tools/oracle/cases/hosted-platforms/fireworks-chat.yaml
  - tools/oracle/cases/hosted-platforms/together-chat.yaml
  - tools/oracle/cases/hosted-platforms/groq-env-key.yaml
  - tools/oracle/cases/hosted-platforms/groq-stream.yaml
  - tools/oracle/cases/hosted-platforms/cloudflare-chat.yaml
  - tools/oracle/cases/hosted-platforms/fireworks-embedding.yaml
  - tools/oracle/cases/helpers/hosted-platform-dispatch/groq-key-order.yaml
  - tools/oracle/cases/helpers/hosted-platform-dispatch/cloudflare-key-order.yaml
deviations:
  - what: Reply ids LiteLLM generates and token usage estimates are compared as present, not equal, in the HTTP cases.
    why: The ids are random and usage comes from each side's tokenizer.
out_of_scope:
  - "The provider configs and transforms belong to B5831, B5832, B5833, B5834, B5836, B5837, B6070, B6071, B6072 and B6120; picking a config from the provider name is B2230 and B5360."
  - "The OpenAI embedding branch that together_ai and nvidia_nim share (main.py L6504-L6555) is B044's, and the OpenAI-compatible chat arm is B024's."
  - "The provider defaults filled by get_llm_provider (get_llm_provider_logic.py) are B210 and B211."
  - "The Cloudflare branch of validate_environment (utils.py L6957) belongs to B5364 with the rest of that function."
  - "Rerank routes and the shared rerank handler are B1014's; this task adds no route."
  - "The NVIDIA NIM branch of rerank() (rerank_api/main.py L334-L360) with its key error, base chain and case rerank-together-jina-nvidia.yaml: B1079 owns the whole rerank function."
pitfalls:
  - "Groq puts the global api_key before groq_key, while Cloudflare puts cloudflare_api_key before the global api_key; keep each order."
  - "_complete_groq and _complete_cloudflare pass no provider_config; add a test that the handler gets None."
  - "_complete_cloudflare passes no client argument, unlike every other function here."
  - "map_extra_body_params runs only when the provider config is the Fireworks chat config, not for any other config a caller passed."
  - "The GroqChatConfig merge never overwrites a key the request already set."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
