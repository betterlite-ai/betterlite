deviations: []
out_of_scope:
  - "B9300 owns load_local_blog_posts, fetch_rss_feed, validate_blog_posts, get_blog_posts and the module-level get_blog_posts wrapper in get_blog_posts.py, the production BlogFeed and BlogPostsResponse, the 16 MiB response cap and the choice of 64 as the public nesting cap."
  - "The oracle helper's fetch mock, cache, validate_blog_posts and sequence runners in blog_feed.rs and blog_feed/logic.rs keep their logic here and only change their parser calls; B9300 switches them to its BlogFeed, so get_blog_posts exists once after it lands."
  - "No new helper operation and no new oracle case: the existing blog_feed operation and its 24 cases prove the move."
  - "B10167 owns betterlite-core's email_date (python_int, parsedate_tz, mktime_tz) and both Retry-After readers; this task only calls parsedate_tz."
pitfalls:
  - The gate counts the diff with --no-renames, so the move and the date rewrite cost about 1,130 of the 1,500 changed lines (the moved tests.rs files and the corpus do not count); make no edits beyond the ones the description lists.
  - email_date.parsedate_tz saturates a huge zone instead of dropping it, so timezone_overflows_i64 keeps its raw text only if parse_date checks the offset bound with unsigned_abs and does not treat a saturated i64::MIN as small.
  - The corpus replay used to sit at "../../../fuzz/corpus/blog_feed" from the oracle group crate; under crates/betterlite-server the path is "fuzz/corpus/blog_feed", and an rstest files glob or a read_dir on the old path finds nothing.
  - The helper's parse_failure_class matches ParseFailure exhaustively, so the new TooDeep variant has to get its arm there in the same change or the oracle server group stops compiling.
  - The oracle fuzz manifest lists chrono and quick-xml under [package.metadata.cargo-shear] ignored only because the path includes hid their use; remove the ignore entries with the dependencies, or cargo shear reports them.
  - A git mv of the corpus shows up as a rename in plain git diff, so a corpus check without --no-renames never sees an added seed; the new deep-nesting.xml is the one file the blog-corpus check looks for.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
