dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports; B8702 mounts the routes and proves the items below over HTTP with the cases that moved there.
    proof: [router-tests]
  - text: The routes are exactly the nine listed paths and methods, none of the paths owned by B4678, B7321, B7972 or B4719, and the merged router builds without a duplicate.
    proof: [router-tests]
  - text: The callback follows its three arms, with the 302 redirect, the cookie clearing rules, the 400 JSON for an untrusted redirect on success and the escaped HTML pages.
    proof: [callback-tests]
  - text: The callback forwards the raw code, the sealed bridge code or the sealed passthrough code by the state fields LiteLLM tests, in that order.
    proof: [callback-tests]
  - text: Authorize sends gateway DCR client ids without a path name to the native or aggregate flow, and everything else through the name-then-id lookup, the single-OAuth2-server fallback, ensure_oauth2 and the client_id rule with LiteLLM's 404 and 400 bodies.
    proof: [authorize-tests]
  - text: Register returns the dummy reply for an unknown server, routes redirect_uris requests without a name to register_aggregate_client with a 201, and passes the right fallback_client_id and defaults to the flow.
    proof: [register-tests]
  - text: The connect flow routes pass the session user, the lookups and the form values to B4675, with 422 for a missing flow, and the vendor credential state maps absent, valid, refreshable and read failures as LiteLLM does.
    proof: [connect-tests]
  - text: GatewayReply values become responses with the status, headers and cookie header text above.
    proof: [reply-tests]

