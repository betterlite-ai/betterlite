      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_browser::(connect|vendor_state)::/)'

oracle_cases: []

deviations:
  - what: The state decoded in the callback is B7530's typed OauthState, so a state JSON that lacks base_url fails to decode and answers like any decode failure (HTML, 200 on success, 400 on an IdP error), where LiteLLM would read base_url with .get and answer 400 "Invalid redirect URI" when client_redirect_uri is also missing.
    why: Only betterlite seals states and it always writes both keys, so the two differ only for a hand-made state that decrypts. Typed fields keep the callback free of untyped maps.

out_of_scope:
  - "State, sealed codes, the state cookie helpers, append_query_params and client_supplied_redirect_uris: B7530. register_client_with_server and resolve_ephemeral_dcr_client: B7531. authorize_with_server and exchange_token_with_server: B7532. The OauthFlows trait, RequestParts and ensure_oauth2: B4719."
  - "aggregate_authorize, native_client_authorize, is_proxy_api_resource, describe_connect_flow, complete_connect_flow and native_client_auth_contract: B4675. register_aggregate_client and the DCR contracts: B4674."
  - "Cookie decode and liveness for the session reader, and validate_trusted_redirect_uri: B4655. get_request_base_url: B4654. get_mcp_client_ip: B743. Registry reads: B4731. Credential reads and oauth_grant_state: B4713."
  - "The discovery documents, jwks, POST /token, /revoke, /introspect and OauthFlowsImpl: B7321. The bare /.well-known/oauth-authorization-server route: B4678. The protected-resource routes and the aggregate authorization-server route: B7972. The faults package: B7970."

pitfalls:
  - The root authorize route uses name-then-id lookup, while B4719's cookie auth uses id-then-name; copying one into the other changes which server a shared value picks.
  - The single-server fallback counts only auth_type oauth2 exactly, and only when one such server is visible to the client ip, so two OAuth servers give 404 on /authorize and the dummy reply on /register.
  - The 400 for a missing client_id here has the detail object with the key error and the text "client_id is required but was not supplied", not the missing_client_id body of the /v1/mcp/server/oauth routes.
  - /register with a non-empty redirect_uris and no path name never reaches the single-server branch, even when the list would be rejected by client_supplied_redirect_uris.
  - register never sets persist_credentials and uses the path name, not the record's server_id, as fallback_client_id; the root branch uses server_name or name.
  - In the callback, a state cookie is cleared only when the request carried it, and the 400 JSON from an untrusted redirect on the success arm leaves the cookie in place, while the IdP error arm clears it for the same failure.
  - The IdP error redirect puts state last and only when original_state is present, and it drops empty error_description and error_uri.
  - Python repr quotes the missing names with single quotes, and html.escape then turns each into &#x27;, so the missing-parameter page shows &#x27;code&#x27;.
  - Both seal branches need non-empty strings for mcp_server_id and the user or client id, otherwise the raw code is forwarded, and an empty dcr_client_secret becomes None, not an empty secret.
  - /authorize/complete reads a form, so a request with no flow field is 422 before B4675 sees it; a bad delivery with a flow field present is B4675's 400.
  - The route for /authorize/mcp-session must not be shadowed by /{mcp_server_name}/authorize; axum prefers the static segment, but the router test must request both.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
