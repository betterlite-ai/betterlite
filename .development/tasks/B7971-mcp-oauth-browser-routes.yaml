    - id: reply-tests
      why: the reply conversion and the cookie header text have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_browser::reply::/)'
    - id: callback-tests
      why: the callback arms, the sealing choice or the HTML pages have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_browser::callback::/)'
    - id: authorize-tests
      why: the authorize routes have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_browser::authorize::/)'
    - id: register-tests
      why: the register routes have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_browser::register::/)'
