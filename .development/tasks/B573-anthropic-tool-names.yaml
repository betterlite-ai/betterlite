checks:
  optional:
  - mutants
  commands:
  - id: case-invalid-tool-name-characters
    why: Replace every non-ASCII a-zA-Z0-9_- character with _, then truncate to 128 characters. Empty/nonstring
      names pass through basic sanitizer but are skipped by map construction. Do not invent a fallback name.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::tool_names_cases::case_[0-9]+_invalid_tool_name_characters$/)'
  - id: case-name-collision-suffix
    why: Reserve every already-valid original before rewriting any name, regardless of order. Rewritten collisions
      gain _2, _3 and so on, truncating candidate head to retain the 128-character cap. Duplicate invalid originals
      reuse their first mapping. Among invalid names, input order determines which gets the unsuffixed candidate.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::tool_names_cases::case_[0-9]+_name_collision_suffix$/)'
  - id: case-reverse-name-map
    why: Forward/reverse maps contain changed names only; valid originals never appear, so foo_bar cannot be remapped
      to foo/bar from another request. Internal reverse-map key is _anthropic_tool_name_map in litellm_params (B577
      storage), never optional_params/body; isolate concurrent requests.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::tool_names_cases::case_[0-9]+_reverse_name_map$/)'
  - id: case-tool-choice-rewrite
    why: Only nonempty list tools with dict type=custom and nonempty string name participate. Hosted/nameless/raw
      tools do not reserve names. Copy changed tool entries and replace optional_params.tools; rewrite dict tool_choice
      only for type=tool and mapped string name, preserving unrelated fields. No forward map means no tool/choice
      mutation.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::tool_names_cases::case_[0-9]+_tool_choice_rewrite$/)'
  - id: case-tool-message-rewrite
    why: An empty map returns messages unchanged. Otherwise rewrite matching string function.name within list tool_calls
      and legacy function_call.name using copies; preserve arguments/ids and malformed/nonmapped entries. Do not
      rewrite message.content native tool blocks or arbitrary name fields.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::tool_names_cases::case_[0-9]+_tool_message_rewrite$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_tool_names.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_tool_names*")"
      && grep -lq 'anthropic_tool_names' tools/oracle/fuzz/corpus/helper_case/anthropic_tool_names* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_tool_names$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
