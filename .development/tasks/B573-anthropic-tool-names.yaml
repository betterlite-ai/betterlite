id: B573
title: Anthropic reversible tool-name mapping
description: >-
  Add ToolNameMaps scoped to a single request, collision-aware sanitation, tool-choice/message rewriting. Expose
  the reverse map as trusted provider metadata for the response adapter; never write it into public request metadata
  or share it across concurrent calls.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  _basic_sanitize_anthropic_tool_name L193-L202; _build_anthropic_tool_name_maps L205-L265; AnthropicConfig._rewrite_tool_names_in_messages
  L1000-L1048; AnthropicConfig._sanitize_tool_names_in_request L1079-L1151.


  Named case contracts: invalid_tool_name_characters: Replace every non-ASCII a-zA-Z0-9_- character with _, then
  truncate to 128 characters. Empty/nonstring names pass through basic sanitizer but are skipped by map construction.
  Do not invent a fallback name. name_collision_suffix: Reserve every already-valid original before rewriting any
  name, regardless of order. Rewritten collisions gain _2, _3 and so on, truncating candidate head to retain the
  128-character cap. Duplicate invalid originals reuse their first mapping. Among invalid names, input order determines
  which gets the unsuffixed candidate. reverse_name_map: Forward/reverse maps contain changed names only; valid
  originals never appear, so foo_bar cannot be remapped to foo/bar from another request. Internal reverse-map key
  is _anthropic_tool_name_map in litellm_params (B577 storage), never optional_params/body; isolate concurrent requests.
  tool_choice_rewrite: Only nonempty list tools with dict type=custom and nonempty string name participate. Hosted/nameless/raw
  tools do not reserve names. Copy changed tool entries and replace optional_params.tools; rewrite dict tool_choice
  only for type=tool and mapped string name, preserving unrelated fields. No forward map means no tool/choice mutation.
  tool_message_rewrite: An empty map returns messages unchanged. Otherwise rewrite matching string function.name
  within list tool_calls and legacy function_call.name using copies; preserve arguments/ids and malformed/nonmapped
  entries. Do not rewrite message.content native tool blocks or arbitrary name fields.


  Implement crates/betterlite-anthropic/src/tool_names.rs with adjacent tests under tool_names/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function tool_names_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  invalid_tool_name_characters, name_collision_suffix, reverse_name_map, tool_choice_rewrite, tool_message_rewrite.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_tool_names* using HelperCase: kind:
  helper and the externally tagged anthropic_tool_names variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_tool_names that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 158 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 210 production lines, 185 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 520 planned, 525 maximum changed lines.
