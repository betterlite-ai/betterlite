pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_tool_names in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/tool_names.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_tool_names.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Valid names reserve their slots before invalid names, even when they appear later in the input.
- Hosted tools do not participate in collision reservations because only type=custom is collected.
