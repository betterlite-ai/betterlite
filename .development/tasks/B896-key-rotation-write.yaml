id: B896
title: Apply key regeneration writes and grace records
description: >-
  Rotate an authorized key with the source's nontransactional ordering. First B892 rejects ownership
  rebinding; then a changed nonnull organization_id requires B772 membership unless proxy admin.
  For a body, enforce B745 output-token estimates and batch limits against stored dict metadata,
  then B1219 end-user budget reassignment using B894's requested-id sentinel and B739's stored id.
  Only then obtain a new secret. get_new_token checks B771's custom-key policy before validating
  a supplied new_key: require sk- prefix and length >= MINIMUM_CUSTOM_KEY_LENGTH (16 by default),
  both failures HTTP 400 detail.error with the source requirement. Missing new_key uses sk- plus
  token_urlsafe(LENGTH_OF_LITELLM_GENERATED_KEY), default 16 random bytes. Hash unconditionally
  through B2362 and always abbreviate with B881; DISABLE_KEY_NAME is not consulted on rotation.

  With a body, adapt to an update request and run B1224's legacy update hook if nonnull, enforce
  B772 upperbounds with fill_defaults False, prepare fields through B894 and validate key_alias
  only when its prepared value differs from the existing alias. The unified custom policy runs
  even without a body, with operation regenerate and an empty RegenerateKeyRequest default.
  Only after it succeeds persist object permissions via B894/B816; merge returned fields into
  token hash/key_name and serialize through B2362. A secret may already have been generated before
  these policy failures. Callback metadata passes through B894's B2304 transform, including its
  ciphertext preservation and original-value-on-encryption-failure behavior.

  Snapshot B738 JWT mapping cache keys BEFORE changing the token; then B777 archives the old row,
  then attempt deprecated overlap, then update the verification token by old hash with B770's
  settings stamp. The FK cascade updates mapping rows but does not invalidate their old cache.
  These are separate writes, not one transaction. In particular this path never calls B894's
  soft-budget transaction; preserve the actual prepared-field/database outcome rather than fixing
  rotation by adding that transaction. A None update result becomes an empty dict then fails
  extracting token; preserve this failure and earlier writes.

  Build response data with raw new key and token_id taken from the returned token. Invalidate
  old/new object-permission ids, then delete old key cache using hash_if_needed(key) when either
  supplied key or old hash is truthy, then B878 evicts/broadcasts the snapshotted mapping keys.
  Only AFTER credential invalidation call B819's access-group hash swap. A group-sync failure
  therefore leaves the key rotated and old cache evicted. Validate GenerateKeyResponse and queue
  B784's rotated event last with data/old row/response/caller/changed-by. No general catch rolls
  back or suppresses these failures. Use supervised event delivery; caller B895 owns HTTP mapping.

  Deprecated overlap chooses a truthy request grace_period, otherwise
  LITELLM_KEY_ROTATION_GRACE_PERIOD, default empty. Empty means immediate revoke. B199 duration
  ValueError warns with the invalid format and skips the row; other parse errors propagate.
  Zero/negative duration also skips without warning. Positive duration uses UTC now plus seconds,
  upserts by old hash and sets active_token_id/new hash and revoke_at on both create and update.
  Any upsert exception warns and returns, allowing rotation to continue without overlap; success
  debug-logs retention. This helper does not later expire/delete the deprecated key.


  Build the production key_rotation_write module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  get_new_token (L5448-L5467; 19 source lines), _insert_deprecated_key (L5470-L5528; 54 source lines),
  _execute_virtual_key_regeneration (L5531-L5698; 145 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): MINIMUM_CUSTOM_KEY_LENGTH=16;
  LENGTH_OF_LITELLM_GENERATED_KEY=16; LITELLM_KEY_ROTATION_GRACE_PERIOD=''.


  The key_rotation_write helper operation compares get_new_token with deterministic randomness and
  an injected custom-key-policy result. Native Postgres cases execute the write service and inspect
  archive/deprecated/current rows and ordered invalidations; never use a helper adapter to invoke
  regenerate_key_fn. Add the shared helper seed only for token generation/validation.


  postgres_pinned_rows observes old/new token rows and deprecated-token grace state. Inject each failure
  in postgres_failure_effects and assert the exact surviving archive, permission and key rows. Both use
  betterlite-postgres-fixture with POSTGRES_TEST_URL or testcontainers; no in-memory substitute can prove
  the deliberately separate commits.


  Config tests key_rotation_write::tests::key_length_defaults_and_overrides,
  invalid_integer_length_stops_startup and grace_request_env_precedence use B002's real loader.
  Both lengths are import-time int() reads; malformed values stop startup. Grace is a string and
  an invalid duration warns/skips during rotation instead. Reuse B881/B893's typed length settings.


  Sizing: 218 source lines before docstring exclusion; allow 250 production, 340 ordered-effects/
  Postgres tests, 45 token adapters, 30 wiring and 40 config tests, 705 within 800.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
