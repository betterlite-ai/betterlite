dod:
  - text: 'Cases ownership_org_estimate_batch_budget_guard_order, custom_policy_before_prefix_length,
      new_key_prefix_and_length_boundaries, generated_secret_length, rotation_always_sets_key_name,
      random_before_update_policy, upperbounds_do_not_fill_defaults, alias_only_when_changed,
      unified_policy_without_body, permissions_after_policy, jwt_mapping_snapshot_before_write,
      archive_grace_key_write_order, grace_request_env_empty_zero_negative,
      grace_invalid_warns, grace_write_failure_warns_continues, grace_repeated_upsert,
      key_update_none_failure, soft_budget_does_not_gain_a_transaction,
      permission_key_mapping_cache_order, group_sync_after_credential_invalidation,
      response_then_event, event_carries_changed_by, postgres_pinned_rows and postgres_failure_effects
      cover every failure boundary without asserting a whole-operation rollback.'
    proof:
      - behavior-tests
      - postgres-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_rotation_write::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/key_rotation_write.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/key-rotation-write-*")"
        && grep -rlq "key_rotation_write" tools/oracle/fuzz/corpus/helper_case/key-rotation-write-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/key_rotation_write::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/key_rotation_write::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^key_rotation_write::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/key-rotation-write-*")"
        && grep -rlq "MINIMUM_CUSTOM_KEY_LENGTH" crates/betterlite-config/fuzz/corpus/config_yaml/key-rotation-write-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
