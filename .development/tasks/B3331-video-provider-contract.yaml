id: B3331
title: Video provider operation contract
description: >-
  Build the typed video operation contract as a trait in betterlite-provider::api::video_contracts,
  defining the interface each provider must implement. Include abstract methods for request/response
  transformation on all video operations (create, content, remix, list, status, character create/get,
  edit, extension), inherited fallback behavior, and unsupported operation defaults that raise NotImplementedError.

  Implement BaseVideoConfig as a trait with 28 required and optional methods: __init__, get_supported_openai_params,
  map_openai_params, validate_environment, get_complete_url, use_multipart_form_data, transform_video_create_request,
  transform_video_create_response, transform_video_content_request, transform_video_content_response, async_transform_video_content_response,
  transform_video_remix_request, transform_video_remix_response, transform_video_list_request, transform_video_list_response,
  transform_video_status_retrieve_request, transform_video_status_retrieve_response, async_transform_video_status_retrieve_response,
  transform_video_create_character_request, transform_video_create_character_response, transform_video_get_character_request,
  transform_video_get_character_response, get_video_edit_prefetch_params, transform_video_edit_request, transform_video_edit_response,
  transform_video_extension_request, transform_video_extension_response, and get_error_class.

  Preserve default non-multipart request behavior (use_multipart_form_data returns false), sync fallback for async response transforms
  (async methods call their sync counterparts by default), absent edit prefetch (get_video_edit_prefetch_params returns None),
  and unsupported operation methods that raise NotImplementedError with the exact message "video {operation} is not supported for this provider"
  for character creation/retrieval and edit/extension operations.

  The contract accepts typed request parameters from B3330 (VideoCreateOptionalRequestParams, VideoObject, CharacterObject)
  and returns or accepts those same types. Abstract declarations specify operation signatures and return types; concrete implementations
  are selected by callers in transport and provider selection tasks. The base error constructor calls B2202's BaseLLMException with
  status_code, message and headers.

  The owned LiteLLM ranges total approximately 300 nonblank/non-comment source lines (including signatures and docstrings).
  Budget this task: 200 production contract lines, 150 test lines, 100 oracle case lines, 80 adapter lines and 20 module wiring lines,
  550 total changed lines.
