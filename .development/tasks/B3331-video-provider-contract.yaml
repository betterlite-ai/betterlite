      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::video_contracts::async_content_/)'
    - id: async-status-fallback
      why: async_transform_video_status_retrieve_response does not fall back to sync version or passes wrong arguments
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::video_contracts::async_status_/)'
    - id: unsupported-errors
