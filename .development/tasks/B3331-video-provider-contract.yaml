deviations:
  - what: Async fallback methods call their corresponding sync methods without forwarding the client/http_handler argument to the sync version.
    why: The client parameter is only used by the async implementation (for status response hook); the sync fallback does not need it. LiteLLM's async_transform_video_status_retrieve_response omits the client argument when calling the sync method.
  - what: Unsupported operation methods raise NotImplementedError at method definition (as default implementations), not as abstract method stubs.
    why: Rust traits require either an implementation or explicit abstract declaration; Python's `raise NotImplementedError` in the method body becomes an inherited default implementation that raises when called.
  - what: Character, edit and extension operation method names use the exact verb sequence from LiteLLM (create_character, get_character, edit, extension), not shortened or reordered names.
    why: Wire formats and provider integrations call these methods by the exact name from the base contract; name changes would require updates across all provider leaf implementations.
out_of_scope:
  - "litellm/llms/base_llm/videos/transformation.py:36-53 (BaseVideoConfig.get_config): no caller at the pin. This configuration reflection method is a dead code path left from a prior version; it is not called by any provider transformation."
  - "litellm/llms/base_llm/videos/transformation.py:229-250 (transform_video_delete_request and transform_video_delete_response): no caller at the pin. There is no public delete function, router registration or proxy delete route; the only caller is a dead async_video_delete_handler."
  - Video request/response transformation for specific providers (OpenAI, Azure, Vertex AI, Gemini), owned by B525, B526, B547, B1361, B1362, B1363, B1364.
  - HTTP transport and routing for video operations, owned by B3333–B3337 and B3343–B3345.
  - Video provider selection logic and dispatcher, owned by B3332.
  - Video record types and proxy input helpers, owned by B3330.
  - BaseLLMException construction and error handling, owned by B2202.
pitfalls:
  - "The trait has 28 methods; some are required abstract methods (transform_video_create_request, transform_video_create_response, etc.), some have default implementations (use_multipart_form_data, get_video_edit_prefetch_params), and some override default implementations (async_transform_video_content_response, async_transform_video_status_retrieve_response)."
  - "Unsupported operations raise NotImplementedError with distinct operation names: 'video create character is not supported for this provider' for transform_video_create_character_request/response, 'video get character is not supported for this provider' for transform_video_get_character_request/response, 'video edit is not supported for this provider' for transform_video_edit_request/response, and 'video extension is not supported for this provider' for transform_video_extension_request/response."
  - "The async fallback for async_transform_video_status_retrieve_response must NOT forward the client argument to the sync method; the client is only used by async code that fetches the artifact from provider-specific URLs."
  - "The get_error_class method constructs BaseLLMException with named arguments status_code, message and headers; preserve the order and argument names to match B2202's constructor."
  - "Request parameters VideoCreateOptionalRequestParams is used only as a type hint; it is a TypedDict in Python and a reference type in Rust."
  - "Response types VideoObject and CharacterObject are records built and serialized by B3330 and B525/B526; do not redefine them."
  - "The contract defines request/response signatures; concrete provider implementations in B525/B526 and provider leaves provide the bodies and return actual typed instances."
review_level: standard
