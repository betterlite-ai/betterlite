pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_params in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/params.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_params.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The two max-token spellings overwrite in input order, rather than assigning a fixed preferred spelling.
- reasoning_effort=none removes the whole output_config, including a structured-output format.
