id: B576
title: Anthropic chat parameter and context mapping
description: >-
  Add AnthropicOptions and the final parameter mapper, composing thinking and tool policy. Resolve max_tokens through
  model output capacity with the pinned fallback, stop sequences, user metadata, sampling, web search and context-management
  edits. Treat native compaction options as wire fields only; B100 executes compression. No cost computation is
  performed.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig.__init__ L307-L320; AnthropicConfig.custom_llm_provider L323-L324; AnthropicConfig._resolved_provider
  L327-L328; AnthropicConfig.get_config L331-L338; AnthropicConfig.get_max_tokens_for_model L341-L354; AnthropicConfig._map_stop_sequences
  L1230-L1248; AnthropicConfig.map_web_search_tool L1389-L1414; AnthropicConfig.map_openai_context_management_to_anthropic
  L1417-L1471; AnthropicConfig.map_openai_params L1473-L1654; AnthropicConfig._apply_output_config L2082-L2128;
  _valid_user_id L2795-L2808.


  Implement crates/betterlite-anthropic/src/params.rs with adjacent tests under params/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation anthropic_params in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function params_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  default_max_tokens, stop_sequence_filter, max_token_option_precedence, reasoning_none_clears_thinking, web_search_context_size,
  context_compaction_edit, output_format_with_effort_drop_warning, invalid_output_effort, speed_drop_policy. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases
  use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_params* using HelperCase: kind: helper
  and the externally tagged anthropic_params variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_params that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 332 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 350 production lines, 126 behavior/config-test lines,
  91 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 592 planned, 600 maximum changed lines.
