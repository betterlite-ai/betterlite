id: B576
title: Anthropic chat parameter and context mapping
description: >-
  Add AnthropicOptions and the final parameter mapper, composing thinking and tool policy. Resolve max_tokens through
  model output capacity with the pinned fallback, stop sequences, user metadata, sampling, web search and context-management
  edits. Treat native compaction options as wire fields only; B100 executes compression. No cost computation is
  performed.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig.map_openai_params L1473-L1654; AnthropicConfig._apply_output_config L2082-L2128.


  Named case contracts: max_token_option_precedence: Iterate non_default_params in insertion order: max_tokens/max_completion_tokens
  both overwrite max_tokens, so last encountered wins. Actual ints including bool/negative/zero pass unchanged;
  other numbers use Python round then int and clamp >=1. Unknown options silently remain unmapped. Run shared update_optional_params_with_thinking_tokens
  after mapping. reasoning_none_clears_thinking: reasoning_effort dict extracts effort; nonstrings are ignored.
  String none removes thinking and the entire output_config, including format. Other values map through B569; adaptive
  effort mapping is minimal/low->low,medium/high/xhigh/max unchanged, replacing existing output_config with effort-only,
  and invalid strings raise B569 BadRequestError. Do not claim existing output effort always wins. output_format_with_effort_drop_warning:
  _apply_output_config ignores absent/falsey/non-dict options. When global drop_params is True, any key other than
  format plus unsupported effort capability warns Dropping unsupported `output_config` for model=<model> (drop_params=True).
  Effort is only supported on Opus 4.5+, Sonnet 4.6+, and Mythos Preview. Preserve non-None format alone in both
  data/options; otherwise remove output_config from both. Per-call drop does not trigger this branch. invalid_output_effort:
  Otherwise allow non-None effort only high,medium,low,xhigh,max; invalid raises BadRequestError with model/resolved
  provider and Invalid effort value: <repr>. Must be one of: 'high', 'medium', 'low', 'xhigh', 'max'. Then apply
  B569 max/xhigh capability error and assign output_config unchanged, preserving extra keys. A format-only mapping
  needs no effort capability. speed_drop_policy: Replay the same unsupported-speed rejection/warning cases as B569
  through map_openai_params, with global/per-call OR drop. Nonstring speed is ignored at this mapping layer. adaptive_to_legacy_cap:
  Explicit thinking.type=adaptive on nonadaptive models maps medium legacy budget and caps against truthy max_completion_tokens-or-max_tokens.
  If cap fails, warn Dropping adaptive `thinking` for model=<model>: max_tokens is too small to fit the minimum
  thinking budget. and remove thinking. Other thinking values assign then invoke B688 legacy-to-adaptive translation.
  parameter_body_rewrites: Tools append through shared base helper after B575 mapping; nonempty MCP list replaces
  mcp_servers. Tool choice/parallel branches jointly use B575 and B688 forced-tool gate. stream only literal True;
  stop uses B2201; temperature/top_p use B688 sampling gate. Valid string user replaces metadata with user_id only;
  invalid/email/phone silently ignored. extra_headers copied even None; speed only string uses B569; cache_control
  only dict copied; context and search use B2201. structured_format_selection: Capability supports_native_structured_output
  via B688 selects B574 output_format; otherwise B574 tool fallback appends json_tool_call, forcing it only when
  initial non_default_params is not thinking-enabled and forced use is supported. Native path sets json_mode=True
  even when no output_format results; fallback with no tool continues without json_mode. Preserve input option ordering,
  which can replace previously selected tool_choice.


  B2201 owns config defaults, stop/user validation and small web/context projections. BaseConfig is_thinking_enabled,
  update_optional_params_with_thinking_tokens and _add_tools_to_optional_params must come from the shared lower
  base-policy owner, not a provider dispatcher. No names are sanitized here; B573/B577 do that at assembly.


  Shared provider base helper implementations are B2202: use its owned primitives directly when called by these
  ranges. Do not reintroduce a dependency on B010/B016 for these small helpers.


  Implement crates/betterlite-anthropic/src/params.rs with adjacent tests under params/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation anthropic_params in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function params_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  max_token_option_precedence, reasoning_none_clears_thinking, output_format_with_effort_drop_warning, invalid_output_effort,
  speed_drop_policy, adaptive_to_legacy_cap, parameter_body_rewrites, structured_format_selection. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_params* using HelperCase: kind: helper
  and the externally tagged anthropic_params variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_params that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 197 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 235 production lines, 265 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines.
