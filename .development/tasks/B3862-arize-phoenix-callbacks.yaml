id: B3862
title: Arize and Phoenix tracing callbacks
description: >-
  Build Arize sampling and Phoenix project-routing callbacks over the shared legacy provider/lifecycle implementation.
  Preserve callback registration behavior, project-provider retention, health checks and request-specific span context.

  For Arize, implement sampling at the request level: read arize_success_sampling_rate and arize_error_sampling_rate from
  standard_callback_dynamic_params, reject sampled-out requests with a cached decision before calling the base handler,
  and override set_attributes to route to _utils.set_attributes with ArizeOTELAttributes. construct_dynamic_otel_headers
  extracts arize_space_id, arize_space_key and arize_api_key from dynamic params and returns them as header pairs for
  per-request credential override. Do not register on the proxy's open_telemetry_logger; Arize coexists alongside the
  primary otel callback.

  For Phoenix, implement per-project TracerProvider caching with an LRU limit of 64 providers per instance. Route request
  and guardrail spans to the project's tracer, building project context from metadata (phoenix_project_name_override, then
  phoenix_project_name) with a fallback to environment variables and then "default". In proxy mode, create a parent span
  on Phoenix's tracer to preserve hierarchy; in SDK mode, propagate traceparent headers for distributed tracing without
  a local parent. Cache providers in an OrderedDict protected by a reentrant lock. Per-request header injection happens
  through the base exporter infrastructure (B3850), not through an override of construct_dynamic_otel_headers.

  Both callbacks override _init_tracing to build private TracerProviders instead of using the global provider. Health checks
  verify credentials by calling the config getter functions. Both inherit the base success/failure lifecycle from OpenTelemetry (B3859).
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-logging/src/otel.rs
    - crates/betterlite-logging/src/otel/**
  lint_tables: false
