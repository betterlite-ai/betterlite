    why: Per-project TracerProvider management, project name resolution, proxy context and span handling
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/arize/arize_phoenix.py#L386-L445
