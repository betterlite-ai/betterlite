    why: get_arize_config reads ARIZE_SPACE_ID, ARIZE_SPACE_KEY, ARIZE_API_KEY, ARIZE_PROJECT_NAME, ARIZE_ENDPOINT, ARIZE_HTTP_ENDPOINT; derives protocol and endpoint
