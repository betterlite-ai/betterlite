id: B3421
title: Eval creation and listing operations
description: >-
  Build eval creation and listing orchestration in `betterlite-core::api::eval_create_list`. Implement `create_eval`, `acreate_eval`, `list_evals`, and `alist_evals` with native sync/async semantics, preserving the extra-body/query merge order and provider selection. Each operation constructs typed requests from user parameters, validates the provider config, transforms through the OpenAI implementation, logs the operation before transport, and maps provider errors to user-facing exceptions.

  In `create_eval`: accept `data_source_config` (required), `testing_criteria` (required), `name` (optional), `metadata` (optional, not forwarded unless overridden by `extra_body`), `extra_headers`, `extra_query`, `extra_body`, `timeout`, and `custom_llm_provider`. Select provider: `custom_llm_provider` becomes `"openai"` if `None`. Construct `CreateEvalRequest` with required fields and optional `name`, apply `extra_body` updates, validate environment through the config, transform the request, call the logging updater with the full request body as optional params, and dispatch to the transport handler with resolved timeout (`timeout or request_timeout`).

  In `list_evals`: accept pagination parameters `limit`, `after`, `before`, `order`, `order_by` (all optional), `extra_headers`, `extra_query`, `timeout`, and `custom_llm_provider`. Build `ListEvalsParams` from non-None explicit parameters only, apply `extra_query` overrides afterward, validate environment, transform request, log with query params as optional params, dispatch with the same timeout resolution.

  Async wrappers `acreate_eval` and `alist_evals` run their sync counterparts in a thread pool via `loop.run_in_executor`, copy context with `contextvars.copy_context`, and await the result. If the result is a coroutine, await it; otherwise return it.

  Unsupported providers are rejected with `ValueError` after `ProviderConfigManager.get_provider_evals_api_config` returns `None`. Exception mapping uses the same `litellm.exception_type` dispatch as the provider transforms: OpenAI errors through B185, other or unmapped errors through B186. Store `local_vars = locals()` before the try block to capture arguments and defaults.

  Preserve module-level `DEFAULT_OPENAI_API_BASE = "https://api.openai.com"` as a Final constant. Import and bind `BaseLLMHTTPHandler()` at module level; the instance is shared across all operations.

