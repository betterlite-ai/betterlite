deviations:
  - what: "Async wrappers call sync counterparts via thread pool and contextvars copy, matching the @client decorator in LiteLLM but betterlite has its own context/logging mechanism."
    why: "The pattern (sync function, async wrapper running it in executor with context) is preserved; logging and context types come from betterlite's observability layer."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L44-102
  - what: "Metadata supplied by the user is captured in local_vars for error reporting but not added to the outgoing request unless extra_body includes it."
    why: "LiteLLM accepts and documents metadata but does not forward it; only extra_body can override the behavior, matching the pinned behavior exactly."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L113-175

out_of_scope:
  - Provider factory owned by B523 or a utility owner (ProviderConfigManager.get_provider_evals_api_config).
  - HTTP handler implementation and transport dispatch (owned by the handler/transport owner identified by B096's external-calls table).
  - Request/response transformation for OpenAI (owned by B523).
  - Logging infrastructure and observability (B247).
  - Exception type mapping from provider errors to OpenAI vs. other/fallback (B185, B186).
  - Async runtime, context variables and request tracing beyond what local operations require.
  - Client-wrapper decorator or its side effects on operation selection (betterlite's routing replaces this).

pitfalls:
  - "metadata is user-supplied but not forwarded by default; extra_body can override it, so the request may lack or include metadata depending on user intent and the transform. This is intentional and security-sensitive: do not 'fix' it to always forward metadata."
  - "list_evals merges extra_query after explicit parameters, so extra_query overwrites pagination keys. This order is load-bearing: build ListEvalsParams from explicit params first, then apply extra_query updates."
  - "Timeout resolution uses: supplied timeout if not None, otherwise request_timeout constant. On None inputs, this becomes the module default, not a per-request timeout."
  - "Async wrappers must handle both direct returns and coroutines from create_eval/list_evals; contextvars.copy_context and loop.run_in_executor preserve request context across the thread boundary."
  - "local_vars = locals() must be called before the try block to include all function parameters and defaults in error reporting."
  - "ProviderConfigManager returns None for unsupported providers; do not silently fall back to openai on None, raise ValueError with the provider name."
  - "Both functions use the @client decorator in LiteLLM, which the outline marks as external; betterlite's @client decorator (or its equivalent) is not in scope here; the signature and parameter capture belong to this module."

