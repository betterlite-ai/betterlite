id: B1082
title: Transcription SDK dispatch and duration metadata
description: >-
  Implement complete transcription and atranscription plus _transcription_response_from_cached_dict in
  betterlite-core::api::transcription_call. B515/B539 own OpenAI/Azure transport; B2453 native HTTP. Resolve
  model/provider with api_base or base_url and api_key, then replace the explicit key whenever dynamic_api_key
  is non-None, even empty. Named language,prompt,response_format,timestamp_granularities,temperature,user
  default None; timeout=600,max_retries defaults OpenAI's 2 independently of litellm.num_retries. Remove tags,
  pop atranscription=false/client=None, filter nondefault options through B157 and map with B175. Log client
  string when logging exists, then update environment with optional_params={} and metadata default None.

  B157's provider config selector controls native transport. OpenAI and compatibles use B515 unless config
  has_native_transcription_endpoint=true. azure/azure_ai with no config use B539: base and version call/global/
  AZURE_API_BASE or AZURE_API_VERSION; token kwargs.azure_ad_token or AZURE_AD_TOKEN; key call,litellm.api_key,
  litellm.azure_key,AZURE_API_KEY. Unlike speech, AZURE_OPENAI_API_KEY is not read here. Add extra_headers to
  Azure options even if None. OpenAI base uses call,litellm.api_base,OPENAI_BASE_URL,OPENAI_API_BASE,
  https://api.openai.com/v1; key call,litellm.api_key,litellm.openai_key,OPENAI_API_KEY. Organization uses
  litellm.organization,OPENAI_ORGANIZATION,None and is applied per request rather than a cross-request global.

  NVIDIA Riva has B047's gRPC operation, Soniox B047's dedicated operation and Bedrock B642's sync/async
  operation. Inject B010 prepared operations for downstream provider implementations. Soniox retains only
  HTTPHandler/AsyncHTTPHandler clients and receives extra_headers; generic native HTTP applies the same client
  filter but passes headers={}. Bedrock gets file/key/base/provider/extra_headers/options/timeout and the
  selected sync/async method. A remaining non-None config goes through B2453; no selected response is a ValueError.

  Both sync results and awaited async results get B1001 duration only when public duration is None. Store it
  solely in _hidden_params.audio_transcription_duration, including zero. Existing public duration=0 suppresses
  calculation. Async wrapper takes model from args[0] or required keyword model before try and file only from
  kwargs, forces atranscription=true and preserves context. Dict results use the cached converter, typed
  responses pass through, coroutines are awaited; unexpected results cause a second sync call before the
  final type check. B011 owns exception mapping and provider=openai fallback. Cached conversion is a typed
  response constructor, not a second provider JSON decoder.

  Add B2401 SDK HTTP operation transcription_call, config loader tests for every named global/env chain and
  parser seeds. Count 279 nonblank/non-comment lines including the cached converter; budget 260 implementation,
  170 tests,140 HTTP fixtures,80 adapters,60 config/corpus and 40 wiring, total 750. Existing provider decoders
  and B1001's bounded audio-duration decoder handle external bytes.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/transcription_call.rs
  - crates/betterlite-core/src/api/transcription_call/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/transcription-call-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/transcription_call.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/transcription_call.py
  - tools/oracle/cases/sdk-http/transcription-call/**
  - tools/oracle/fuzz/corpus/sdk_http_case/transcription-call-*
  - crates/betterlite-config/src/sections/transcription_call.rs
  - crates/betterlite-config/src/sections/transcription_call/**
  - tools/oracle/helpers/b1082.py
  - tools/oracle/helpers/b1082/**
  - tools/oracle/src/helpers/core_ops/b1082.rs
  - tools/oracle/src/helpers/core_ops/b1082/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7870-L8195
  why: Both complete transcription calls, transport selection and hidden duration handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L753-L754
  why: Own the whole cached-dict conversion called by atranscription.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1046-L1046
  why: OpenAI-compatible membership alone is insufficient when the config opts into its native endpoint.
dod:
- text: >-
    transcription_openai_form sends openai/whisper-1,file=a.wav with a one-second fixture,language=en,prompt=hint,
    response_format=verbose_json,timestamp_granularities=[word,segment],temperature=0. One /v1/audio/transcriptions
    multipart request preserves fields/file bytes. Default timeout/retries are 600/2; explicit max_retries=0 stays
    zero and global num_retries=9 does not replace default 2. A mock {text:Hello,words:[{word:Hello,start:0,end:1}]}
    is returned with its words, no added public duration,hidden audio_transcription_duration=1. Text/srt/vtt mocks
    follow B515's response format representation without forcing JSON on the provider.
  proof: [behavior-tests, config-tests, oracle, sdk-python]
- text: >-
    transcription_credential_precedence independently sets every base/version/key/organization fallback listed
    above and checks actual OpenAI/Azure mock requests. Dynamic key="" replaces the call key before subsequent
    truthy global/env fallback; AZURE_OPENAI_API_KEY alone does not fill this branch's key. Azure token is popped
    from kwargs but a params snapshot made earlier remains as the source provides it. Empty globals fall through.
    Explicit api_base beats base_url; B157 config lookup sees the normalized model/provider.
  proof: [behavior-tests, config-tests, oracle, sdk-python]
- text: >-
    transcription_native_selection gives a compatible config has_native_transcription_endpoint=true: expect
    B2453 HTTP, not OpenAI SDK transport. Azure with a non-None config also takes native HTTP. Native HTTP gets
    headers={} even when extra_headers={x:caller}; Soniox gets x:caller and matching HTTP clients only. Riva
    invokes its gRPC operation, Bedrock invokes the method matching atranscription. Those downstream concrete
    protocols are their owners' fixtures; native injected-operation tests assert the complete typed call here.
    Unknown provider with no response raises ValueError("Unmapped provider passed in. Unable to get the response.")
    before any fabricated successful result. A provider 429 retains B011's SDK class/status and nullable fields.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    transcription_async_results converts cached {text:Hello} to TranscriptionResponse, passes a typed response
    through and awaits a coroutine once. An integer first result triggers a second call; a final integer raises
    ValueError("Invalid response from transcription provider, expected TranscriptionResponse, but got <class 'int'>").
    Missing model raises KeyError("model") before try. kwargs.file permits async duration calculation; a file
    passed only positionally is not read by the outer duration step. Public duration=0 or 2 is preserved and
    avoids recalculation; unavailable/invalid audio gives no hidden key; a zero-duration valid file stores 0.
    A synchronous immediate response may be measured in both layers because hidden duration does not satisfy
    the public-duration check. No duration field is added to ordinary JSON output.
  proof: [behavior-tests, oracle, sdk-python]
- text: SDK calls use real captured provider HTTP and new config/SDK parser seeds cover this dispatch operation.
  proof: [corpora, new-cases, oracle, sdk-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Native transport opt-in and hidden-only duration metadata affect both request and response contracts.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api|sections)::transcription_call::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: Transcription's Azure/OpenAI fallback chains must load from real settings and injected env.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::transcription_call::tests::loads_settings($|::)/)'
  - id: sdk-python
    why: Transcription reaches providers and must use the SDK HTTP driver.
    run: test -f tools/oracle/sdk_http/transcription_call.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpora
    why: Config keys and transcription invocation require newly added parser seeds.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/transcription-call-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/transcription-call-*)" && cargo nextest run --locked -p betterlite-oracle -p betterlite-config --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_config_yaml_corpus)'
  - id: new-cases
    why: Form and hidden-duration behavior need actual new provider exchanges.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/transcription-call)"
oracle_cases:
- tools/oracle/cases/sdk-http/transcription-call/transcription-openai-form.yaml
- tools/oracle/cases/sdk-http/transcription-call/transcription-credential-precedence.yaml
- tools/oracle/cases/sdk-http/transcription-call/transcription-native-selection.yaml
- tools/oracle/cases/sdk-http/transcription-call/transcription-async-results.yaml
deviations: []
out_of_scope:
- B1122 owns every transcription base-contract method; B1001 audio extraction/duration; B175 get_optional_params_transcription; B157 get_non_default_transcription_params and ProviderConfigManager.get_provider_audio_transcription_config.
- B515 and B539 own OpenAI/Azure execution, B047 Riva/Soniox, B642 Bedrock and B2453 generic native HTTP. Downstream implementations are injected B010 operations rather than backward dependencies.
- B1083/B1084 own aspeech/speech; B158 retains other general main.py SDK facade methods and provider umbrellas retain their _complete_* functions. The cached transcription converter is owned here in full.
pitfalls:
- Azure transcription omits AZURE_OPENAI_API_KEY from its key chain even though speech includes it.
- The outer async wrapper only finds file in kwargs, so positional uploads do not get its duration calculation.
- Existing public duration=0 prevents fallback; existing hidden duration alone does not.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
