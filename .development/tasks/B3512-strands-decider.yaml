id: B3512
title: Strands Decider HTTP and AgentCore requests
description: >-
  Implement the Strands decision adapter for direct HTTP or ARN-addressed AgentCore execution with injected AWS credentials. Build the Strands provider configuration inheriting from B3511's BaseDecisionsConfig, preserving optional bearer authentication, deterministic default session IDs, reserved-header warnings, canonical invocation URL checks and runtime-error status translation.

  The ARN parser validates runtime ARNs (arn:aws(-region-code)*:bedrock-agentcore:region:account:runtime/name), extracts the region, and builds the invocations URL (https://bedrock-agentcore.{region}.{dns-suffix}/runtimes/{encoded-arn}/invocations). The default session ID is deterministic: litellm-decider-{sha256(arn).hex()}. The agentcore_runtime_session_id setting in litellm_params overrides the default sha256 session ID when present; when absent or None, the default is used. Direct HTTP (non-ARN) API bases bypass Strands logic and inherit parent behavior.

  When signing with AWS, the handler injects AWS credentials through BaseAWSLLM, prepares session headers (dropping reserved x-amzn-bedrock-agentcore-runtime-* and x-amz-* headers with a warning), and passes the JSON body through AWS SigV4 signing. A bearer token (non-None api_key) bypasses signing; a missing token requires signed request bytes. Strands configuration has no default api_base and no required key (resolve through STRANDS_DECIDER_API_KEY and STRANDS_DECIDER_API_BASE). The host header is reserved and removed during session-header building.

  Response errors from an AgentCore runtime appear as JSON with code and message fields (bad_request, invalid_request, loading map to 400, 400, 503 respectively; others default to 500). A runtime error stops execution with a BaseLLMException naming the code and message. Non-ARN responses fall through to parent transform_decisions_response.

