dod:
  - text: The ARN regex rejects non-conforming strings and parses valid ARNs to extract region and runtime name.
    proof: [strands-arn-parsing]
  - text: The invocations URL builds correctly from an ARN and matches the oracle test cases.
    proof: [strands-url-building, oracle]
  - text: The default session ID is deterministic and matches LiteLLM's sha256 hash of the ARN.
    proof: [strands-session-id]
  - text: The agentcore_runtime_session_id setting in litellm_params overrides the default session ID when set and is used in the session header.
    proof: [strands-session-id-override]
  - text: Direct HTTP (non-ARN) API bases bypass Strands logic and return inherited parent behavior.
    proof: [strands-http-fallback]
  - text: Reserved headers (host, x-amzn-bedrock-agentcore-runtime-*, x-amz-*) are dropped with a warning, and other headers pass through.
    proof: [strands-header-filtering]
  - text: When signing with AWS, the request is signed with SigV4 on bedrock-agentcore service, and bearer tokens bypass signing.
    proof: [strands-aws-signing, oracle]
  - text: Runtime response errors (bad_request, invalid_request, loading) map to 400, 400, 503; other codes default to 500.
    proof: [strands-error-mapping]
  - text: A runtime error raises BaseLLMException with the code and message from the response.
    proof: [strands-error-response, oracle]
  - text: Non-runtime responses fall through to parent transform_decisions_response behavior.
    proof: [strands-non-runtime, oracle]

checks:
  optional: [mutants]
  commands:
    - id: strands-arn-parsing
      why: The ARN regex is missing, accepts invalid ARNs, or rejects valid ones like arn:aws:bedrock-agentcore:us-east-1:123456789012:runtime/my-runtime
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_parsing::test_arn/)'
    - id: strands-url-building
      why: The invocations URL builder is missing or does not produce the correct bedrock-agentcore endpoint
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_url::/)'
    - id: strands-session-id
      why: The default session ID is not deterministic or does not use sha256 of the ARN
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_session::test_default_session_id/)'
    - id: strands-session-id-override
      why: The agentcore_runtime_session_id setting in litellm_params does not override the default session ID or is not used in the session header
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_session::test_override_session_id/)'
    - id: strands-http-fallback
      why: Non-ARN API bases do not fall through to parent behavior
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_http::test_direct_http_fallback/)'
    - id: strands-header-filtering
      why: Reserved headers are not dropped, not warned about, or are dropped from non-reserved headers
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_headers::/)'
    - id: strands-aws-signing
      why: AWS signing is not applied when signing_with_aws is true, or bearer tokens do not bypass it
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_signing::test_(?:aws_signing|bearer_bypass)/)'
    - id: strands-error-mapping
      why: Runtime error codes bad_request, invalid_request, loading do not map to 400, 400, 503, or unknown codes do not default to 500
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_errors::test_error_status_mapping/)'
    - id: strands-error-response
      why: A runtime error does not raise BaseLLMException with the code and message
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_errors::test_runtime_error_response/)'
    - id: strands-non-runtime
      why: Non-runtime responses do not fall through to parent transform_decisions_response
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^strands_response::test_non_runtime_fallthrough/)'

