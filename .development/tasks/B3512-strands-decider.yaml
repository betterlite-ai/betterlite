    why: The complete Strands Decider implementation—ARN/URL parsing, session ID generation, header handling, AWS signing, and error translation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/decisions/transformation.py#L309-L394
