out_of_scope:
  - B3510 owns the DecisionsIRRequest and DecisionsIRResponse records.
  - B3511 owns the BaseDecisionsConfig base class and its shared methods (get_complete_url, resolve_api_base, resolve_api_key, missing_api_base_message, transform_decisions_request, unwrap_response, parse_response, get_error_class).
  - B198 provides get_aws_dns_suffix; B590 provides BaseAWSLLM and its credential injection; B594 provides resolve_credentials; B595 provides sign_aws_json_post; B682 provides AwsAuthParams; B2202 provides BaseLLMException.
  - B3513 and B3514 own decision request preparation and sending; this task only handles the Strands provider transformation.
  - The Strands provider is registered in a decision factory owned by B3513; this task does not register routes or expose public entrypoints.

pitfalls:
  - >-
    The ARN regex is strict: arn:aws(-region-code)*:bedrock-agentcore:region:account:runtime/name, with regions matching
    [a-z0-9-]+ and accounts exactly 12 digits. Test boundaries: arn:aws (no bedrock), missing account, account with letters,
    trailing slashes in runtime name.
  - >-
    The session header X-Amzn-Bedrock-AgentCore-Runtime-Session-Id is always set, defaulting to sha256(arn).hex() when
    not configured. The agentcore_runtime_session_id key in litellm_params overrides the default when present; when absent or None,
    the sha256 default is used. The header name is case-insensitive in HTTP but must match LiteLLM's casing exactly in the oracle.
  - >-
    Reserved header filtering drops both the Bedrock prefix and AWS prefix, then adds the session header. Headers like
    X-Custom-Header pass through; x-amz-anything does not. Test both lowercased and mixed-case reserved headers.
  - >-
    When api_key is present (bearer token), sign_request returns the headers unchanged and None as the body, skipping AWS
    signing entirely. JSON signing only happens when the key is None.
  - >-
    The _runtime_error function returns None if the response is not valid JSON or if answers is not None (replies without
    errors or with answers are not errors). A valid error JSON must have code, message, and answers=None.
  - >-
    Status codes: bad_request and invalid_request map to 400 (both), loading maps to 503, unknown codes default to 500.
    This mapping is case-sensitive on the code string.

review_level: security

