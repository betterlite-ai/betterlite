  - tools/oracle/cases/helpers/watsonx-text/template-order-and-gpt-oss.yaml
  - tools/oracle/cases/helpers/watsonx-text/llama3-instruct-wrapper.yaml
  - tools/oracle/cases/helpers/watsonx-text/ibm-mistralai-provider.yaml
  - tools/oracle/cases/helpers/watsonx-text/param-mapping-extra-body.yaml
  - tools/oracle/cases/helpers/watsonx-text/request-payload-layout.yaml
  - tools/oracle/cases/helpers/watsonx-text/deployment-stream-url.yaml
  - tools/oracle/cases/helpers/watsonx-text/reply-without-results.yaml
  - tools/oracle/cases/helpers/watsonx-text/stream-chunks.yaml
deviations:
  - what: A created_at without a UTC offset is read as UTC.
    why: Python's datetime.fromisoformat gives a naive value and timestamp() then uses the server's local time zone, which a Rust service cannot copy without reading the machine zone. watsonx.ai sends a Z suffix, so real replies are unaffected.
out_of_scope:
  - B5970 owns get_api_params, prepare_payload, get_base_url, add_api_version_to_url, validate_environment and WatsonxError.
  - "B5971 owns the chat config. The ValueError for text params under the watsonx provider is in get_optional_params in utils.py (B668 owns utils.py) and calls is_watsonx_text_param from here."
  - "Custom prompt dictionaries: both call sites of convert_watsonx_messages_to_prompt pass an empty dict, so the custom_prompt branch for model in custom_prompt_dict has no caller at the pin."
  - "IBMWatsonXAIConfig.__init__ (class-level defaults) and get_config have no caller at the pin."
  - "ibm_granite_pt and mistral_instruct_pt belong to B214, hf_chat_template to B215, custom_prompt and prompt_factory to B177, map_finish_reason to B024."
  - "The logging_obj.post_call call in transform_response belongs to the caller that runs the request."
  - B042 owns the main.py registration of the watsonx_text provider and its HTTP oracle cases.
pitfalls:
  - 'The oracle helper for this task is pre-registered as b5972 by the skeleton. Write its Rust and Python files as the skeleton leaves them; the registry files are not this task''s to edit.'
  - moderations is a text param and is read in the request body, but map_openai_params never maps it, so it only arrives as an explicit option.
  - The mapped token (watsonx_token) is not removed by get_api_params, so it stays inside the parameters object of the body.
  - stop_reason "not_finished" passes through as the finish_reason string of a non-final chunk.
  - 'The gpt-oss branch returns None when the template result is empty and does not try the Llama 3 branch.'
  - The model argument to transform_request keeps its provider prefix, so provider is the text before the first slash (for example ibm-mistralai for ibm-mistralai/mixtral).
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
