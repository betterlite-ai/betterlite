dod:
  - text: Prompt template selection follows the substring order, swallows hf_chat_template errors and falls back to prompt_factory.
    proof: [watsonx-prompt-tests, oracle]
  - text: Parameter mapping splits top-level and extra_body fields and drops unmapped keys.
    proof: [watsonx-text-tests, oracle]
  - text: The request body has input, moderations, parameters and id fields in the source layout, and URLs match for plain, deployment and stream calls.
    proof: [watsonx-text-tests, oracle]
  - text: Replies and stream chunks give the same text, finish reason, usage and created time as the source, and a reply without results fails with 500.
    proof: [watsonx-text-tests, oracle]
  - text: The reply decoder rejects malformed bodies without panicking and its corpus replays.
    proof: [watsonx-text-corpus]
  - text: New helper cases for these functions exist.
    proof: [watsonx-text-cases]
checks:
  optional: [mutants]
  commands:
    - id: watsonx-prompt-tests
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^watsonx::/)'
      why: A generic prompt factory has no watsonx substring order and no Llama 3 wrapper.
    - id: watsonx-text-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^watsonx_text::/) - test(replays_the_watsonx_text_reply_corpus)'
      why: The payload layout, leftover parameters and chunk finish rules are only visible in these tests.
    - id: watsonx-text-corpus
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/watsonx_text_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/watsonx_text_reply)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_watsonx_text_reply_corpus)'
      why: Reply and stream chunk bytes come from outside and need a fuzz target with a replayed corpus.
    - id: watsonx-text-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/watsonx-text)"
      why: Without new case files the oracle proof passes with nothing compared.
