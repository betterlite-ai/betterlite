id: B5972
title: Watsonx text generation requests, replies, streams and prompt templates
description: >-
  Build the watsonx_text provider (watsonx.ai /ml/v1/text/generation) in two places. The prompt half goes in
  betterlite-prompts as crates/betterlite-prompts/src/watsonx.rs and its folder, next to the other per-provider prompt
  modules. The request half goes in betterlite-provider as crates/betterlite-provider/src/watsonx_text.rs and its folder
  (add betterlite-prompts to that crate's Cargo.toml). It uses B5970 for errors, credentials and URLs. This is
  IBMWatsonXAIConfig, WatsonxTextCompletionResponseIterator and the prompt functions of common_utils.py and
  chat/transformation.py.

  Prompt half. WatsonxModelPattern constants: granite-chat, ibm-mistral, ibm-mistralai, openai/gpt-oss,
  meta-llama/llama-3-instruct. apply_prompt_template(model, messages) checks substrings of the model in this order and
  returns the first branch that matches, never falling to a later one: granite-chat gives B214's ibm_granite_pt,
  ibm-mistral gives B214's mistral_instruct_pt, openai/gpt-oss takes the text after "watsonx/" (else after
  "watsonx_text/", else the whole model) and returns B215's hf_chat_template result only when it is non-empty, and any
  Err from that call gives None (the async variant also logs at debug "Failed to apply HuggingFace template for model
  <name>: <error>"); meta-llama/llama-3-instruct gives B177's custom_prompt with the three Llama 3 role wrappers
  (<|start_header_id|>role<|end_header_id|>\n before, <|eot_id|> after), initial value <|begin_of_text|> and final value
  <|start_header_id|>assistant<|end_header_id|>\n. No match gives None. The sync and async variants share one body; only
  the template call differs. convert_watsonx_messages_to_prompt(model, messages, provider) returns mistral_instruct_pt
  when provider equals ibm-mistralai, otherwise apply_prompt_template, and when that is None or empty it calls
  B177's prompt_factory with custom_llm_provider watsonx. Expose apply_prompt_template as the adapter that B177's
  prompt_factory calls for its watsonx branch.

  Request half. Supported params: temperature, max_tokens, top_p, frequency_penalty, stop, seed, stream.
  map_openai_params copies max_tokens to max_new_tokens, frequency_penalty to repetition_penalty, seed to random_seed,
  stop to stop_sequences, and temperature, top_p, stream under their own names. decoding_method, top_k,
  truncate_input_tokens, length_penalty, time_limit and return_options go to a nested extra_body map, and min_tokens goes
  there as min_new_tokens. Every other key, including moderations, is dropped. extra_body is written only when it is not
  empty. is_watsonx_text_param is true for decoding_method, max_new_tokens, min_new_tokens, length_penalty,
  stop_sequences, top_k, repetition_penalty, truncate_input_tokens, include_stop_sequences, return_options, random_seed,
  moderations and min_tokens. map_special_auth_params copies project, region_name and token to watsonx_project,
  watsonx_region_name and watsonx_token. get_eu_regions returns eu-de, eu-gb and get_us_regions returns us-south.

  transform_request: provider is the model text before the first slash; the prompt comes from convert (the
  custom prompt dictionary is always empty at both call sites). The body is built by popping extra_body and overlaying it
  on the options, running B5970's get_api_params (which removes the project, space and region keys), then
  {input: prompt, moderations: popped moderations or {}, parameters: the remaining options, then the prepare_payload
  fields}. Leftover keys such as stream and watsonx_token stay inside parameters. get_complete_url uses /ml/v1/text/generation
  or generation_stream, and the deployments form for deployment/<id> models, then the version suffix like chat.
  transform_response needs a results key (else WatsonxError 500 "Error: Invalid response from Watsonx.ai API: <body>"),
  reads results[0] generated_text, input_token_count, generated_token_count and stop_reason (through B024's
  map_finish_reason), sets created from created_at or now, and usage as the two counts and their sum.
  decode_text_generation_reply(bytes) is the typed decoder; a missing results[0] field is an error, not a default.
  The stream iterator maps one parsed chunk: a non-empty results list gives text generated_text (default ""),
  finish_reason stop_reason, is_finished true unless stop_reason is exactly "not_finished" (a missing stop_reason counts
  as finished), and usage with both counts defaulting to 0; an empty or absent results list gives empty text, not
  finished, finish_reason "stop", no usage. The line framing comes from B1427's line stream and B2214's iterator.
