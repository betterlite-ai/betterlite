id: B4566
title: Agent model listing and OpenCode provider projection
description: >-
  Build the opencode module for betterlite-management-cli, translating LiteLLM's
  model listing decoder and OpenCode provider projection. Fetch the proxy's model
  list with GET /v1/models using Bearer auth and a 10-second timeout, returning
  a tuple of ListedModel or a skip reason on network error, non-200 status or
  invalid JSON. Filter models to entries where mode is None or in {"chat",
  "responses"}, omitting other modes and incomplete limits. Generate OpenCode's
  OPENCODE_CONFIG_CONTENT JSON string declaring the proxy as the litellm provider
  with npm package "@ai-sdk/openai-compatible", including one model entry per
  chat-capable model with limits only when both max_input_tokens and max_output_tokens
  are present. The opencode_model_sync_env function fetches models, checks that
  OPENCODE_CONFIG_CONTENT_ENV is not already set, wraps the list as config JSON
  and returns it as an env dict or a skip reason. Own ListedModel, ModelSyncSkipped,
  ModelSyncArgs and ModelSyncResult contracts for B4567 and B4568 to consume. The
  module consumes OPENAI_API_KEY_ENV, OPENCODE_CONFIG_CONTENT_ENV, OPENCODE_PROVIDER_ID,
  OPENCODE_PROVIDER_NAME and OPENCODE_PROVIDER_NPM constants from B4564.
scope:
  paths:
    - tools/management-cli/src/opencode.rs
    - tools/management-cli/src/opencode/tests.rs
  lint_tables: false
