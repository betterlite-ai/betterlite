id: B198
title: Injected call context and shared settings
description: >-
  Create betterlite-core for injected call context and shared settings, above provider/error/logging layers and
  below the server/Python adapters. Define immutable per-call identity, deadline, parent/internal-call provenance,
  privacy, phase and pinned billing timestamp; child contexts derive explicitly from their parent and no HTTP field
  may construct trusted internal flags. Snapshot supported config settings into a typed CoreSettings at construction,
  keeping unsupported module-level settings a named config error. Add shared AWS partition/ARN helpers and typed
  clock/ID generation inputs, replacing UUID monkeypatching, asyncify/thread-pool wrappers and import caches with
  explicit native dependencies. Do not add global environment reads, Python interpreters or a runtime callback registry.
  Add call_context and aws_partition helper cases, using synthetic IDs/time in Python; verify request isolation
  and deadline inheritance in Rust tests. Budget 300 context/settings lines, 100 config integration and 300 tests.
  Seed B171's shared helper_case corpus with every added operation and replay it through the common typed parser.
scope:
  paths:
  - Cargo.toml
  - deny.toml
  - crates/betterlite-core/**
  - crates/betterlite-config/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/call-context/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_internal_context.py#L20-L54
  why: Internal-call, phase and pinned billing context.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_uuid.py#L1-L15
  why: Call ID generation boundary.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/aws_partition.py#L6-L55
  why: Region partition, DNS suffix and ARN helpers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/core_helpers.py#L54-L104
  why: Shared drop settings and arithmetic boundaries.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L568-L576
  why: Existing timeout defaults, not a reason to add global state.
dod:
- text: Explicit context/phase/billing-time projections and AWS partition helpers match listed oracle cases.
  proof:
  - oracle
- text: Concurrent calls and children cannot overwrite settings, IDs or billing time, and request metadata cannot
    forge internal-call provenance.
  proof:
  - call-context-tests
- text: Every environment-dependent setting is resolved by config and unsupported settings still fail by complete
    key path.
  proof:
  - call-context-tests
  - config-yaml-corpus
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: call-context-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/call_context|aws_partition/)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/call-context/phase-nesting.yaml
- tools/oracle/cases/helpers/call-context/pinned-billing-time.yaml
- tools/oracle/cases/helpers/call-context/child-inheritance.yaml
- tools/oracle/cases/helpers/call-context/aws-commercial.yaml
- tools/oracle/cases/helpers/call-context/aws-china.yaml
- tools/oracle/cases/helpers/call-context/aws-gov.yaml
- tools/oracle/cases/helpers/call-context/arn-prefix.yaml
deviations: []
out_of_scope:
- Python module globals, import caches, sync/async reflection and version API are B157-B166; native code exposes
  explicit settings instead.
- Duration and calendar parsing is B199, batch scheduling B201 and call execution B014.
pitfalls:
- The current billing time is fixed for a call even if pricing crosses a time window during execution.
- An SDK sync wrapper must not start a nested Tokio runtime inside an async call.
- Environment helpers belong at the config boundary, not in betterlite-core.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
