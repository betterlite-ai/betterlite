deviations: []
out_of_scope:
- Python module globals, import caches, sync/async reflection and version API are B157-B166; native code exposes
  explicit settings instead.
- Duration and calendar parsing is B199, batch scheduling B201 and call execution B014.
- All remaining constants belong to their consuming feature tasks; core_helpers drop_params flags are B206, not
  this leaf context task.
- All other main.py functions keep their existing owners; B024-B028 own their provider dispatch branches.
pitfalls:
- 'The oracle helper for this task is pre-registered as call_context in the context group. Replace the stub Op in tools/oracle/src/helpers/context/call_context.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/call_context.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The current billing time is fixed for a call even if pricing crosses a time window during execution.
- An SDK sync wrapper must not start a nested Tokio runtime inside an async call.
- Environment helpers belong at the config boundary, not in betterlite-core.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
