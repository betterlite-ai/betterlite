deviations:
  - what: The 422 body for a bad request body uses the server's shared validation response and wording, not FastAPI's `loc` and `msg` strings.
    why: Every route in the server shares one validation response; the status code matches.
  - what: The guardrail lookup and the policy registry are handles passed in at construction, not a global callback manager and `get_policy_registry()`.
    why: Rust code here has no module-level state; the lookup answers the same names LiteLLM's does.
  - what: The response_rejection guardrail is built once per request, on the first input that needs it, not once per input.
    why: The guardrail holds no per-input state, so a client cannot tell; it saves a compile per input.
  - what: A guardrail failure message is the Display text of B5471's `GuardrailFailure`, not Python's `str()` of the exception.
    why: "Python prints an HTTP error as status, colon, detail repr, which Rust cannot reproduce. No oracle case reaches it, since the oracle proxy has no guardrail that fails."
  - what: The agent call is an in-process call through the `AgentChat` trait with B004's typed request, not a fake Starlette request posted to `/v1/chat/completions`.
    why: Rust has no request-object trick; the principal and body are the same, so the model, key limits and logging see the same call.
  - what: The unreachable `raise ValueError("Either inputs or inputs_list must be provided")` after the return (endpoints.py L378) is not built.
    why: Code after a `return` never runs.

out_of_scope:
  - "B3250 owns POST /policy/validate, GET /policy/list, GET /policy/info/{policy_name} and POST /policy/test (endpoints.py L383-L604). B3249 owns POST /policy/templates/test (L1123-L1265). B3252 and B3253 own the template routes (L607-L1120)."
  - "GuardrailApplyError (endpoints.py L67-L78): no caller at the pin, nothing raises it."
  - "B3240 owns resolve_policy_guardrails. B3241 owns the policy and attachment registries. B3682 owns the guardrail registry and get_initialized_guardrail_callback. B5471 owns GuardrailContract, GuardrailApiInputs and GuardrailFailure."
  - "B3803 owns CustomCodeGuardrail, its block and result handling and the response-rejection program. B3668 owns process_output_response for completed chat responses."
  - "B865 owns the management completion wrapper. B2400 owns handle_exception_on_proxy. B004 owns the chat completion path and its request type."
  - "The production AgentChat implementation and the production ComplianceGuardrails implementation that reach the chat handler and each guardrail class: the architect's skeleton wires them (see notes). This task writes the traits and fakes."
  - "The mount of this route into the app and the list of route modules: the umbrella (B079) and the skeleton."
  - "The imports of sse_keepalive and CustomGuardrail's other paths in endpoints.py: used only by other routes in the file."

pitfalls:
  - "A failing guardrail never fails the request: its text goes in `guardrail_errors` and the next guardrail still runs on the inputs from before the failure, so one bad guardrail cannot hide the rest."
  - "Names run in sorted string order, not in policy order, and a name that comes from both `guardrail_names` and a policy runs once."
  - "Policy names resolve with no match context, so a policy whose `condition.model` would not match still adds its guardrails."
  - "A guardrail with no `apply_guardrail` of its own is skipped even when it is found, so a request that names only such guardrails returns the inputs untouched and no error."
  - "`input_type` is the one value for every input and every guardrail; only `request` or `response` is accepted, and `request` is the default."
  - "The response_rejection guardrail returns allow for `request` input, so it only matters because the route runs the chat answer through it as a response."
  - "The agent answer is checked against 16 fixed lowercase phrases by substring after lowercasing (`i can't help with that`, `i cannot assist` and the rest), so a long answer that quotes a phrase is flagged."
  - "A failure in the chat call is not caught per item: the first one ends the request and drops the results already built."
  - "`request_data` is merged into the chat body's `metadata`, not the top level, and is also the request data the guardrails see."
  - "`agent_response` is the chat answer without fields the provider never set, so a field set to null by the provider stays and one it omitted is absent."
  - "An unknown key inside one `inputs_list` item is dropped from the echoed `inputs`, because the item is decoded as GenericGuardrailAPIInputs."
  - "`policy_names` with an uninitialized registry is not an error: it logs at debug and adds nothing."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
