id: B3251
title: Batch policy and guardrail compliance testing
description: >-
  Build the compliance test route POST /utils/test_policies_and_guardrails and the `apply_policies` function behind it, all in betterlite-server. An admin sends a list of
  guardrail inputs plus policy names and/or guardrail names. The route runs every input through the guardrails separately and returns, per input, the final inputs and the list of
  guardrail failures. It never fails because a guardrail failed. When the body has an `agent_id`, the route also sends each input to that model as a chat request, and runs the
  model's answer through a "response rejection" guardrail, so the UI can show which answers were refusals. B3240 and B3241 give the policy registry and `resolve_policy_guardrails`,
  B3682 gives the live guardrail registry, B5471 gives `GuardrailContract` and `GuardrailApiInputs`, B3803 gives `CustomCodeGuardrail` (crates/betterlite-guardrails/src/custom_code.rs) and `RESPONSE_REJECTION_GUARDRAIL_CODE`,
  B3668 gives `process_output_response` (crates/betterlite-server/src/guardrails/chat_guardrail_translation/rewrites.rs), the completed-response guardrail pass. Use their exact names as they exist when you start, and re-implement none of them. LiteLLM's `get_policy_registry()` global and
  the fresh `GuardrailRegistry()` it builds per call become handles passed in through constructors, with no module-level state.

  Put it in crates/betterlite-server/src/policy_compliance_routes.rs and policy_compliance_routes/ with these files. `request.rs` holds `TestPoliciesRequest` and its decoder
  `decode_test_request(bytes: &[u8]) -> Result<TestPoliciesRequest, ComplianceRequestError>`. Fields: `policy_names` (optional list of strings), `guardrail_names` (optional list of strings),
  `inputs_list` (list of `GuardrailApiInputs`, default empty), `request_data` (JSON object, default empty), `input_type` (`request` or `response`, default `request`) and `agent_id` (optional
  string). Any other body field is ignored. A wrong type, or an `input_type` other than the two values, is the shared 422 response. Each input is decoded as `GuardrailApiInputs`, which ignores
  keys it does not know. `apply.rs` holds `apply_policies`. `agent.rs` holds the chat call and the response-rejection pass. `routes.rs` holds the state struct and the route. `error.rs`
  holds `ComplianceRequestError`.

  `apply_policies(policy_names, inputs, request_data, input_type, guardrail_names) -> ApplyPoliciesResult` follows endpoints.py L120-L211. `ApplyPoliciesResult` has `inputs` and
  `guardrail_errors` (a list of `GuardrailErrorEntry { guardrail_name, message }`). It collects names into one sorted, de-duplicated set. First every entry of `guardrail_names`. Then, when
  `policy_names` is non-empty and the policy registry is initialized, each policy name goes through B3240's `resolve_policy_guardrails(name, all policies, no context)` and its
  guardrails join the set. A policy name the registry does not hold adds nothing (the resolver returns no guardrails for it; read B3240 for the exact result). When the registry is not
  initialized, log at debug `apply_policies: policy engine not initialized, skipping policy-resolved guardrails` and add nothing. An empty set returns the inputs untouched with no errors.
  Otherwise walk the names in sorted order and look each one up in B3682's handler through `get_initialized_guardrail_callback`. Not found: log at debug `apply_policies: guardrail
  '<name>' not found, skipping` and go on. Found but it has no `apply_guardrail` of its own: log at debug `apply_policies: guardrail '<name>' has no apply_guardrail, skipping` and go on.
  Otherwise call its `apply_guardrail` with the running inputs, a mutable copy of `request_data`, the `input_type` and no logging target, and pass the returned inputs to the next guardrail. A
  failure is caught, logged at debug `apply_policies: guardrail '<name>' failed: <text>`, pushed as `GuardrailErrorEntry { guardrail_name, message: <failure text> }`, and the running inputs stay
  as they were before that guardrail. Every other guardrail still runs. Declare the lookup as a small trait the state takes, `ComplianceGuardrails`, with one method that answers `NotFound`,
  `NoApplyGuardrail` or `Done(Result<GuardrailApiInputs, GuardrailFailure>)` for a name, inputs, request data and input type. The production implementation wraps B3682's handler and
  matches on the callback's spec to reach each class task's `apply_guardrail`; tests use a fake. The trait keeps `GuardrailContract`'s `impl Future` return off the route state.

  `agent.rs`, for a request with `agent_id` set, runs after `apply_policies` for each input. Build the chat body with `chat_body_from_inputs(inputs, agent_id, request_data)` (endpoints.py
  L214-L231): `model` is the `agent_id`, `stream` is false, `messages` come from `structured_messages` when it is non-empty, else from `texts` (one `user` message with the single text, or
  one `user` message with all texts joined by `\n`), else one `user` message with the text `Hello`. When `request_data` is non-empty, its keys are merged into the body's `metadata` object, creating
  it when absent. Send the body to the chat completion path as an in-process call with the same authenticated principal as the route, through an injected trait `AgentChat` with one async
  method taking B004's typed chat request and the principal and returning the typed chat response or a proxy error. The route state takes a `Box<dyn AgentChat>` or a generic for it (the
  architect wires the production one to the chat handler; see the task notes). Use B004's request type for the body and put `metadata` in its passthrough field. Do not build a fake HTTP
  request as LiteLLM does with `_request_with_json_body`. The answer is stored as `agent_response`: the chat response as JSON with fields the provider never set left out
  (`model_dump(exclude_unset=True)`). A failure of the chat call is not caught here and fails the whole route (see error mapping).

  Then run the answer through the response-rejection guardrail. Build B3803's custom-code guardrail from B3803's `RESPONSE_REJECTION_GUARDRAIL_CODE` with the guardrail name
  `response_rejection`. Build it once per request, on the first input that needs it, and reuse it. Read the answer back into B3668's typed completed-response record and call B3668's
  `process_output_response` with that guardrail and the principal. Any failure of the read-back or the pass is caught: take the failure's HTTP detail when it is an object with an `error`
  key and use that string, else use the detail's text when there is one, else the failure's own text, and push `GuardrailErrorEntry { guardrail_name: "response_rejection", message }` after the
  errors `apply_policies` produced. The guardrail only blocks `response` input, and its block is an HTTP 400 whose detail is `{"error": <reason>, "guardrail": "response_rejection",
  "detection_info": {...}}`, so a refusal such as "I can't help with that" gives the message `Response indicates the model rejected the user request.`.

  The route (endpoints.py L280-L380) is POST `/utils/test_policies_and_guardrails`, tag `utils`, in the standard authenticated group (B732 owns the principal; the auth
  group is mounted by the skeleton), wrapped by B865's management completion wrapper as `@management_endpoint_wrapper` does. The path is in no role list, so route access follows the shared route checks for an
  unlisted path; do not special-case it. The route loops over `inputs_list` in order and, for each input, runs `apply_policies`, copies `inputs` and `guardrail_errors` into the item, adds
  `agent_response` and the response-rejection step when `agent_id` is set, and appends the item. The answer is 200 `{"results": [item, ...]}`. An empty or missing `inputs_list` gives `{"results":
  []}` and runs nothing, and no check requires `inputs`. Any error that escapes (the chat call, the guardrail registry) is turned into the OpenAI-style proxy error by B2400's
  `handle_exception_on_proxy`: an HTTP error keeps its status and message with type `internal_server_error`. Add one cargo-fuzz target `compliance_request` that feeds arbitrary bytes to
  `decode_test_request`. The test named `replays_the_compliance_request_corpus` replays its corpus.

  Tests. Native tests live under `policy_compliance_routes::tests` with prefixes `apply_` (the set building, skip rules, error capture, running inputs), `agent_` (chat body building, the
  `agent_response` shape, the response-rejection messages and the once-per-request build), `route_` (status mapping, ordering, empty list, management wrapper use) and `decode_`. Use fakes
  for `ComplianceGuardrails` and `AgentChat`, and B3241's registries filled by hand for policy resolution. Oracle. HTTP cases go in tools/oracle/cases/policies/compliance/ and send the real
  request to the booted proxy with the master key `oracle-master`, no database and no `policies` config. See the case list under oracle_cases. Compare status and body, and ignore
  the fields of `agent_response` that differ on every run (ids, `created`).

