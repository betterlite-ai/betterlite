dod:
  - text: >-
      apply_policies unions guardrail_names with the guardrails its policy names resolve to, sorts and de-duplicates them, and returns the inputs untouched with no errors
      when the set is empty or the policy registry is not initialized and no guardrail name was given.
    proof: [apply-tests, oracle]
  - text: >-
      apply_policies skips a name with no live callback and a callback with no apply_guardrail of its own, runs the others in sorted order with each result feeding the next,
      and records a failing guardrail as an error entry while keeping the inputs from before it and still running the rest.
    proof: [apply-tests]
  - text: >-
      The chat body for agent_id uses structured_messages first, then texts (one text as is, several joined by a newline), then a `Hello` user message, sets stream false, and merges
      request_data into metadata.
    proof: [agent-tests]
  - text: >-
      With agent_id set, each item carries agent_response (the chat answer without unset fields), and an answer that matches a rejection phrase adds a response_rejection error entry with
      the guardrail's reason, after the apply_policies entries.
    proof: [agent-tests, oracle]
  - text: >-
      A failure while reading the answer back or in the rejection pass becomes a response_rejection error entry (detail.error when the detail is an object with that key, else the detail text,
      else the failure text), and a failure of the chat call fails the whole request through the proxy error mapping.
    proof: [agent-tests, route-tests]
  - text: >-
      POST /utils/test_policies_and_guardrails returns 200 with one result per input in order, `{"results": []}` for an empty or missing inputs_list, 422 for a wrong body type or an input_type
      outside request and response, and 401 without a key.
    proof: [route-tests, oracle]
  - text: >-
      The route runs inside B865's management completion wrapper and builds the response-rejection guardrail once per request.
    proof: [route-tests]
  - text: >-
      The body decoder rejects malformed bytes and wrong shapes without panicking, ignores unknown fields, and has committed corpus inputs.
    proof: [request-corpus, route-tests]

checks:
  optional: []
  commands:
    - id: apply-tests
      why: the guardrail name set, the skip rules, the error capture or the input chaining of apply_policies is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_compliance_routes::.*tests::apply_/)'
    - id: agent-tests
      why: the chat body, the agent_response shape or the response_rejection step is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_compliance_routes::.*tests::agent_/)'
    - id: route-tests
      why: the route, its status mapping, its result order or the body decoder is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_compliance_routes::.*tests::(route_|decode_)/) - test(replays_the_compliance_request_corpus)'
    - id: request-corpus
      why: the request decoder has no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/compliance_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_compliance_request_corpus)'
