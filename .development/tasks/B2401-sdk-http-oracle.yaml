id: B2401
title: HTTP oracle execution for SDK operations
description: >-
  Add kind=sdk_http to the oracle so a task that calls a provider can compare real outbound HTTP without
  depending on the later proxy route that calls it. Each case runs a native production service and the pinned
  LiteLLM SDK independently against the mock provider. This is an HTTP capture driver, not HelperCall and not
  a FastAPI-function adapter. Keep the existing gateway HTTP, multipart, helper and WebSocket drivers unchanged.

  SdkHttpCase contains name, env, call, upstream and compare. call is an externally tagged SdkHttpCall enum;
  begin with openai_chat {model,messages,api_key,timeout_seconds}. Resolve api_base only from the harness's
  freshly bound loopback mock, never an arbitrary destination from the case. Native openai_chat calls B004's
  typed OpenAI execution directly; Python calls litellm.completion with custom_llm_provider=openai, the same
  model/messages/key/timeout and the mock api_base. It sets num_retries=0. Keep the normal SDK decorator and
  exception mapper active. Subsequent API tasks add typed enum variants and their two dispatch implementations.
  A case cannot supply a Python module/function name or executable code. No production server route is added.

  Reuse B001's canned upstream answers, captured requests, comparator and artifacts. Reuse B900 for byte and
  multipart HTTP bodies. Capture an SDK result as success{value} or failure{class,status,type,param,code,message},
  with optional exception fields absent/null distinguished by the typed projection. SDK code is not the proxy's
  stringified HTTP-status code: never manufacture a client HTTP response for an SDK exception. Each operation
  owns its result projection. Compare actual provider method/path/query/headers/body and result values. Compare
  zero expected requests too; an unexpected request must fail rather than borrow the next case's canned answer.

  Start a separate mock capture per implementation and case; do not partition captures by the number of canned
  answers. --self-check uses two fresh LiteLLM SDK processes. Normal mode uses one native service and one fresh
  pinned Python process. Reuse the no-enterprise uv environment and LITELLM_LOCAL_MODEL_COST_MAP=True. Pass only
  the case environment plus harness-required variables. The Python protocol reads one bounded JSON call from
  stdin and writes one typed result; logs go to stderr. Retain both logs and captures on mismatch or crash.

  Implement decode_sdk_http_case(bytes:&[u8],limits:&OracleLimits) in tools/oracle/src/sdk_http.rs and route the
  CLI's sdk_http cases through it. Cap case and result input at 1 MiB, each captured body at 16 MiB, requests at
  128 and each execution at 120 seconds. The same decoder is called by the sdk_http_case fuzz target and replay.
  A timeout kills and joins the Python child, closes native work and joins the mock; cancellation does the same.
  Unknown/duplicate fields and unsupported operation tags fail before launching either implementation.
  decode_sdk_http_result(bytes,limits) validates the child's bounded JSON result. The fuzz input's first byte
  selects case YAML (0) or result JSON (1); the remaining bytes reach the corresponding production decoder.

  No LiteLLM function changes ownership here; B004 remains the chat execution owner and B001 the base oracle
  owner. Size from the tooling work: 250 Rust driver/dispatch lines, 90 Python protocol lines, 160 tests,
  100 fixture lines, 55 fuzz/replay and 40 wiring, 695 total. Keep adapter code limited to typed input/output
  projection; it must not reproduce SDK parameter mapping or return the fixture's expected value.
