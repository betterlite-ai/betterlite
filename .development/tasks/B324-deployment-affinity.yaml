out_of_scope:
- Provider-affinity HTTP headers already owned by B010.
- Encrypted-content response affinity outside this backlog slice.
- B372 owns affinity identity and atomic pin claims; consume its tested public interface.
- 'litellm/caching/affinity_cache.py: B372 owns: set_local_affinity_pin (L50-L53), _legacy_pin_matches
  (L56-L59), claim_affinity_pin_in_memory (L62-L78), _decode_pin (L81-L85), claim_affinity_pin (L88-L125).'
- 'litellm/router_utils/pre_call_checks/deployment_affinity_check.py: B372 owns: DeploymentAffinityCheck._get_effective_flags
  (L93-L112), DeploymentAffinityCheck._looks_like_sha256_hex (L115-L122), DeploymentAffinityCheck._hash_user_key
  (L125-L137), DeploymentAffinityCheck._get_model_map_key_from_litellm_model_name (L140-L165), DeploymentAffinityCheck._get_model_map_key_from_deployment
