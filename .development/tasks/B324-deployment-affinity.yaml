id: B324
title: Atomic caller and session deployment affinity
description: 'Compose B372 affinity identities/claims with B080 previous-response IDs and B323 priority-group
  flags in the B016 candidate filter. Preserve previous-response, session and key precedence; replace
  expired or ineligible pins without reviving filtered deployments. Wire the deployment pre-call hook
  through the server''s authenticated routing context. Configuration boundary keys introduced or consumed
  here: optional_pre_call_checks, model_group_affinity_config, deployment_affinity_ttl_seconds. Pinned
  declaration defaults: optional_pre_call_checks=None; model_group_affinity_config=None. Resolve env values
  once in betterlite-config, never in router code. Implement the owned native service in crates/betterlite-router/src/deployment_affinity.rs.
  Add ProbeOperation::DeploymentAffinity in tools/oracle/src/router_probes/mod.rs and the corresponding B324 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_utils/pre_call_checks/deployment_affinity_check.py:
  warn_on_unknown_model_group_affinity_flags (L45-L60), DeploymentAffinityCheck.__init__ (L74-L91), DeploymentAffinityCheck.async_filter_deployments
  (L348-L476), DeploymentAffinityCheck.async_pre_call_deployment_hook (L478-L617). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
