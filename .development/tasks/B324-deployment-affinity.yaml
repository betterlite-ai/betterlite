id: B324
title: Atomic caller and session deployment affinity
description: Implement the deployment/session affinity pre-check using B304 storage, B052 caller identity
  and B080 response-ID decoding. Keep the precedence and priority-group bypass in typed routing context.
  Add first-writer claims, TTL refresh and replacement of ineligible pins using atomic store operations;
  Redis outage uses the bounded local claim path. Reuse credential hashing without logging raw keys. Fuzz
  persisted pin decoding because Redis values are outside bytes. Use the existing Rust crate boundaries
  from B004 and B008; integrate through the server when the provider dispatcher or callbacks live in another
  core crate. This task's source slices are the linked ranges, not a port of their Python classes. Add
  the listed oracle cases and the matching adapters to B301's component runner where state is not observable
  over HTTP; adapters call production logic and never reproduce it. Use deterministic candidate sets or
  supplied random samples for comparisons, and separate seeded distribution tests for random choices.
  Extend the existing config_yaml fuzz target and committed corpus for every newly accepted config form;
  unsupported keys still fail by full path. Add a cargo-fuzz target affinity under crates/betterlite-router/fuzz
  and a normal replays_the_affinity_corpus test using the production parser. Keep the implementation,
  adapters and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
  Extend B004's typed chat request fields only for the routing controls this task consumes, and extend
  its existing chat_request fuzz corpus; router-only fields never reach the provider body.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - crates/betterlite-openai/**
  - tools/oracle/cases/routing/deployment-affinity/**
  - tools/oracle/src/router_probes/deployment_affinity/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/deployment_affinity.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/deployment_affinity_check.py#L93-L346
  why: Flags, key identity and caller/session extraction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/deployment_affinity_check.py#L348-L617
  why: Precedence, pinning and claim hooks.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/affinity_cache.py#L18-L125
  why: Atomic shared/local claims and eligible replacement.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the deployment_affinity prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
- text: Routing controls have valid and invalid chat parser corpus seeds and are consumed before upstream
    serialization.
  proof:
  - chat-corpus
  - oracle
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(deployment_affinity)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/affinity.rs && test -n "$(ls -A crates/betterlite-router/fuzz/corpus/affinity)"
      && cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_affinity_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
  - id: chat-corpus
    why: routing request controls lack chat parser corpus coverage or replay fails
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
oracle_cases:
- tools/oracle/cases/routing/deployment-affinity/previous-response-before-session.yaml
- tools/oracle/cases/routing/deployment-affinity/session-before-key.yaml
- tools/oracle/cases/routing/deployment-affinity/group-specific-flags.yaml
- tools/oracle/cases/routing/deployment-affinity/priority-group-bypass.yaml
- tools/oracle/cases/routing/deployment-affinity/same-session-different-key.yaml
- tools/oracle/cases/routing/deployment-affinity/concurrent-first-writer.yaml
- tools/oracle/cases/routing/deployment-affinity/expired-and-ineligible-pin.yaml
- tools/oracle/cases/routing/deployment-affinity/legacy-string-pin.yaml
- tools/oracle/cases/routing/deployment-affinity/redis-outage-local-pin.yaml
deviations: []
out_of_scope:
- Provider-affinity HTTP headers already owned by B010.
- Encrypted-content response affinity outside this backlog slice.
pitfalls:
- Affinity never restores a deployment removed by earlier health or access filters.
- Do not hash a value twice merely because it arrived through a different metadata channel.
- The pin decoder must cap bytes before deserialization.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
