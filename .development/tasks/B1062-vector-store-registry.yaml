id: B1062
title: Vector store registry
description: >-
  Load/update typed vector store and index registry snapshots from B002 config and B726 typed repositories, recording
  config-owned versus database-owned entries. Extract recognized tool parameters and return secret-bearing credentials
  only to trusted execution; use injected immutable snapshots rather than module globals. Load top-level vector_store_registry
  list and database-backed vector_store_indexes records using their pinned field records and os.environ/ credential
  references, defaulting to empty lists.


  Registry selection traversals live in B1063 above this registry storage API; get_and_pop_recognised_vector_store_tools
  and get_vector_store_to_run are not callbacks from the registry into its caller.


  VectorStoreIndexRegistry.delete_vector_store_index (litellm/vector_stores/vector_store_registry.py:L65-L69) has
  no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no
  behavior case exercises that unused entry point.


  VectorStoreRegistry.list_all_vector_stores (litellm/vector_stores/vector_store_registry.py:L438-L454) has no MIT
  runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior
  case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/vector_store_registry.rs. Use VectorStoreRegistryInput and VectorStoreRegistryResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions config_registry_load, database_registry_fallback, config_owned_mark,
  index_upsert, recognized_vector_tool under api::vector_store_registry::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): vector_store_registry
  defaults to None or configured vector-store records; environment-backed credentials stay secret. No environment
  reads occur outside betterlite-config. Test api::vector_store_registry::tests::loads_settings uses the production
  Config loader and an injected environment map, with a named rstest case for every key above, explicit override,
  unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key
  report; a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder
  rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorStoreRegistry in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_store_registry: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/vector_stores/vector_store_registry.py: VectorStoreIndexRegistry.__init__ (L35-L36);
  litellm/vector_stores/vector_store_registry.py: VectorStoreIndexRegistry.get_vector_store_indexes (L38-L42); litellm/vector_stores/vector_store_registry.py:
  VectorStoreIndexRegistry.get_vector_store_index_by_name (L44-L51); litellm/vector_stores/vector_store_registry.py:
  VectorStoreIndexRegistry.upsert_vector_store_index (L53-L63); litellm/vector_stores/vector_store_registry.py:
  VectorStoreIndexRegistry.is_vector_store_index (L71-L78); litellm/vector_stores/vector_store_registry.py: VectorStoreIndexRegistry._get_vector_store_indexes_from_db
  (L85-L100); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.__init__ (L104-L106); litellm/vector_stores/vector_store_registry.py:
  VectorStoreRegistry._extract_tool_params (L108-L121); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.get_vector_store_ids_to_run
  (L123-L139); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.get_litellm_managed_vector_store_from_registry
  (L215-L222); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.get_litellm_managed_vector_store_from_registry_or_db
  (L224-L248); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry._get_vector_store_ids_from_tool_calls
  (L387-L397); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.load_vector_stores_from_config
  (L399-L436); litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.is_config_vector_store (L456-L458);
  litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.add_vector_store_to_registry (L460-L470);
  litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.delete_vector_store_from_registry (L472-L480);
  litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry.update_vector_store_in_registry (L482-L489);
  litellm/vector_stores/vector_store_registry.py: VectorStoreRegistry._get_vector_stores_from_db (L496-L511); litellm/vector_stores/vector_store_registry.py:
  VectorStoreRegistry.get_credentials_for_vector_store (L513-L526). Abstract/protocol declarations map to native
  types and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 154 owned nonblank/non-comment/non-docstring Python lines (206 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 174 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 457 total within the 460-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B061 (Stored credentials and their
  encryption), B171 (Direct helper oracle and URL path encoding), B1058 (Vector store contracts), B1087 (Api boundaries),
  B726 (Managed resources and transaction repositories), B858 (Typed managed-resource and analytics rows). These
  are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on
  the provider and keys/data branches.
