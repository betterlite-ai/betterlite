id: B1062
title: Vector-store and index registry state
description: >-
  Implement registry storage/lookup in core::api::vector_store_registry with ordered records, B726
  repositories, B858 database rows, B061 credential lookup and B1131 wire types. Own index constructor,
  list/name lookup/upsert/is-index/database loading; store constructor, _extract_tool_params,
  get_vector_store_ids_to_run, id lookup with optional database fallback, _get_vector_store_ids_from_tool_calls,
  config loading, is_config, add/delete/update, database loading and get_credentials_for_vector_store.
  B1063 owns consuming selection, name lookup and tool removal. There is no callback from this layer into it.

  Load top-level vector_store_registry through Config; omission means no configured registry and an empty
  list loads no entries. Store records default to empty ordered lists. Inject a clock for the two UTC
  timestamps and repositories/accessor for deterministic native tests. Helpers compare these state transitions
  with scripted repository answers, never invoke FastAPI globals or a provider. Add vector_store_registry
  to B171 and config YAML corpus seeds. No new JSON parser is needed: json.dumps in the source is logging,
  not input decoding. Excluded unused methods are named below. Owned spans contain 206 nonblank/non-comment
  lines; budget 210 code, 190 tests, 100 adapters, 110 fixtures and 65 config/corpus/wiring, 675 under 720.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/vector_store_registry.rs
  - crates/betterlite-core/src/api/vector_store_registry/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/vector_store_registry.rs
  - crates/betterlite-config/src/api/vector_store_registry/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-registry-*
  - tools/oracle/src/helpers/core_ops/vector_store_registry.rs
  - tools/oracle/src/helpers/core_ops/vector_store_registry/**
  - tools/oracle/helpers/vector_store_registry.py
  - tools/oracle/helpers/vector_store_registry/**
  - tools/oracle/cases/helpers/vector-store-registry/**
  - tools/oracle/fuzz/corpus/helper_case/vector_store_registry-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L35-L140
  why: Index order/upsert, registry initialization, tool parameter extraction and stable id deduplication; exclude the unused index delete method.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L215-L248
  why: Registry-first lookup caches a database hit and swallows database errors at debug level.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L387-L436
  why: Tool ids are appended without a tool-type check; config records require non-null ids/providers and are appended without deduplication.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L456-L526
  why: Config-owned update protection, deletion semantics, descending database reads and named-credential lookup.
dod:
- text: >-
    registry_config_records loads vector_store_registry=[{vector_store_name:notes,litellm_params:{vector_store_id:vs_a,
    custom_llm_provider:openai,vector_store_description:d,vector_store_metadata:{tag:x}}}]. Expect one record
    preserving those params, name/description/metadata, is_config=true and two injected UTC timestamps.
    No name yields null; null litellm_params becomes {} and fails missing id. Missing/null id raises
    ValueError("vector_store_id is required for initializing vector store, got vector_store_id=None");
    missing/null provider raises ValueError("custom_llm_provider is required for initializing vector store, got custom_llm_provider=None").
    Empty strings are accepted. Duplicate config ids append twice; an invalid later entry leaves earlier
    entries appended. loads_registry_config verifies these inputs with the production config loader.
  proof: [registry-tests, config-tests, oracle, helper-python, corpora]
- text: >-
    ordered_registry_mutations starts [vs_a,vs_b]. add vs_a with changed fields keeps the first record;
    add vs_c appends. update vs_b replaces its entire record, not a merge; is_config=true prevents that
    replacement. Updating a missing id appends even if updated_data has a different id. Delete vs_a removes
    every matching entry, including config-owned entries. is_config returns false for missing ids/default
    flags. Index upsert matches index_name, replaces the first match in place or appends; lookup returns
    the first matching name and is-index is false for a miss. Default registries have empty contents.
  proof: [registry-tests, oracle, helper-python]
- text: >-
    registry_database_fallback finds memory vs_a without a repository call. A missing id with no database
    returns null. With a database it calls find_many(order={created_at:desc}), selects the first matching
    id, caches it and returns it. A miss returns null; lookup failure logs "Error fetching vector store from database: %s"
    and returns null. Direct store/index database-load methods return [] without a client, preserve row
    order and propagate repository/model-conversion errors; only the fallback wrapper catches them.
  proof: [registry-tests, oracle, helper-python]
- text: >-
    registry_id_and_tool_params sends non_default vector_store_ids=[vs_b,vs_a,vs_b] and tools with ids=[vs_c,vs_a].
    Expect [vs_b,vs_a,vs_c] with no removal or mutation of params/tools. A non-list top-level ids value is
    ignored; tool type is not checked. Tool params filters={},max_num_results=0,ranking_options={} survive,
    missing values default null. A tool carrying rewrite_query=false raises TypeError because that recognized
    name is absent from VectorStoreToolParams's constructor; do not quietly drop it.
  proof: [registry-tests, oracle, helper-python]
- text: >-
    registry_named_credentials uses a matching store with litellm_credential_name=cred and accessor result
    {api_key:secret}. Return that map; missing id or falsey credential name returns {} and skips the accessor.
    A missing named credential gives {}. Inline litellm_params.api_key is not returned by this function.
    Lookup exceptions propagate to B1111, which owns their silent fallback. Native Debug and diagnostics
    redact credentials; see the explicit diagnostic deviation below.
  proof: [registry-tests, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: registry-tests
    why: registry ordering, database fallback or config ownership changes
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_registry::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: registry entries are declared but not loaded through Config
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::vector_store_registry::tests::loads_registry_config($|::)/)'
  - id: helper-python
    why: registry state transitions lack an independent pinned comparison
    run: test -f tools/oracle/helpers/vector_store_registry.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: corpora
    why: registry configuration and helper inputs have no added replay seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_store_registry-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-registry-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vector-store-registry/registry-config-records.yaml
- tools/oracle/cases/helpers/vector-store-registry/ordered-registry-mutations.yaml
- tools/oracle/cases/helpers/vector-store-registry/registry-database-fallback.yaml
- tools/oracle/cases/helpers/vector-store-registry/registry-id-and-tool-params.yaml
- tools/oracle/cases/helpers/vector-store-registry/registry-named-credentials.yaml
deviations:
- what: The debug diagnostic "all loaded vector stores = %s" redacts credential values rather than serializing raw api_key fields from litellm_params.
  why: Repository secret-redaction rules forbid exposing credential material in logs; registry selection and returned execution credentials are unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/vector_store_registry.py#L433-L436
out_of_scope:
- B1063 owns get_and_pop_recognised_vector_store_tools,get_vector_store_to_run,get_litellm_managed_vector_store_from_registry_by_name,pop_vector_stores_to_run_with_db_fallback.
- delete_vector_store_index,list_all_vector_stores and pop_vector_stores_to_run have no caller at the pin; do not build or test these unused entry points.
- B061 owns credential resolution; B726/B858 own repository schema/rows. This registry layer performs no store permission check.
pitfalls:
- 'The oracle helper for this task is pre-registered as vector_store_registry in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/vector_store_registry.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vector_store_registry.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Config loading appends incrementally and does not roll back earlier records when a later one is invalid.
- Registry updates preserve config-owned entries, but registry deletion itself does not protect them.
- rewrite_query is in the advertised search parameter list but is not accepted by VectorStoreToolParams.
review_level: security
budget:
  max_changed_lines: 720
  max_new_expects: 0
