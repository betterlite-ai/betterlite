id: B2322
title: Authoritative spend reads and cold-counter reseeding
description: >-
  Extract spend_counter_reseed.py L47-L413 into betterlite-auth::spend_reseed below B739/B751/B752's
  current-spend caller. Own constants, _as_utc, SpendCounterReseed._get_lock, increment_in_memory,
  from_db, _counter_row, end_user_from_db, _is_key_or_team_window_counter, _read_active_batch,
  coalesced, window_from_table, window_from_db and window_from_spend_logs. B070 retains coalesced_window
  L416-L491 and later write integration. Use B715 gates, typed repositories and B2316 batch answers.

  SPEND_COUNTER_RESEED_LOCKS_MAX_SIZE is int(os.getenv(...,10000)) at import: absent10000, malformed
  or empty fails startup, zero/negative are accepted and evict each newly inserted lock. Keep an LRU
  lock registry protected by one registry lock; hits move to the end and overflow evicts one oldest
  entry even if held. increment_in_memory takes the same per-key lock and increments local_only=true,
  refresh_ttl=true; errors propagate. Native cancellation releases held locks.

  from_db skips missing DB and valid key/team :window:<duration> counters. Use the last :window:
  suffix and B199 duration parser; invalid/empty durations do not suppress a normal row lookup. Only
  spend:key:, spend:team:, spend:team_member:, spend:user:, spend:org:, spend:project: map to repositories
  B722/B724/B726/B723; strip that exact prefix, allowing empty IDs. Team-member suffix splits at the
  last colon and requires one, yielding user_id/team_id composite. B715 bounded lookup name is
  spend_counter with the gate inside; query failures exception-log and return None. Missing rows
  return None; missing/falsey spend becomes0. Float conversion after the catch can still fail.
  End-user floor reads accept only spend:end_user:, query B726 by user_id under end_user_spend bound,
  exception-log query failures and return None, otherwise float(spend or0). Tags/groups do not reseed.

  coalesced defaults require_cache_warm=false. Under the per-key lock use a nonnull B2316 batch value
  first; any existing batch answer establishes a clean Redis miss even when its verified flag is false.
  Otherwise read Redis: hit returns float, clean miss forbids local fallback, Redis exception silently
  permits local cache fallback. A local hit returns float. Read DB only after these miss. Missing DB
  spend returns None; zero must be warmed. Redis SET NX initializes once across pods; a loser reads
  the winner, using DB spend if the winner already vanished. Set local cache then record the request
  batch. Without Redis re-read local value and store max(DB,local), preventing an in-flight local delta
  being lost. Warm failure exception-logs and returns current_value unless require_cache_warm=true,
  which rethrows; earlier writes remain. Do not multiply seed values with INCRBYFLOAT.

  Window types map Key/Team to key/team entity labels and api_key/team_id log fields; unsupported types
  and missing DB return None. Maintained row lookup uses entity_type/entity_id/window_duration compound
  key. Query failure logs and returns None; missing or window_start older than expected returns None.
  Naive timestamps gain UTC; aware timestamps retain their zone; equality and future row starts are
  trusted. Return float(spend or0). window_from_db tries this row only for nonnull duration, otherwise
  or on a miss aggregates B726 SpendLogs by its entity field with startTime>=window_start, sum spend.
  Query failure logs and returns None; empty aggregate returns0. Read only the first aggregate row,
  accepting mapping or attribute _sum/spend shapes, and normalize falsey spend to0. Conversion errors
  outside query catches propagate. There are no database writes; only cache mutations described above.

  B856 auth spend_reseed helper operations use the real source methods with repository/cache/clock
  fixtures and production Rust. B860 Postgres fixtures use POSTGRES_TEST_URL or testcontainers and
  independent schemas; test real reset rows and query shapes. B002 loader cases reseed_lock_default10000,
  invalid_integer_stops_startup and zero_negative_lock_bound_consumer cover the actual env read, with
  config_yaml seeds. Existing B733 cache decoders suffice; no new byte parser. The 270 nonblank
  non-comment lines excluding docstrings
  allow 285 production, 280 tests, 80 adapters, 65 config and 60 wiring, 770 within800.
