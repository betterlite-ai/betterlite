dod:
  - text: 'Named cases: lru_hit_overflow_zero_negative_and_held_eviction, local_increment_same_lock,
      all_primary_prefixes_and_empty_ids, member_last_colon_split, valid_window_only_suppresses_key_team,
      primary_query_bound_gate_error_log_and_none, conversion_after_query_catch,
      enduser_prefix_floor_read_and_no_tag_reseed, batch_hit_and_clean_miss_precedence,
      redis_hit_miss_error_local_fallback, one_db_load_per_lock, zero_warmed,
      multipod_nx_winner_not_multiplied, vanished_nx_winner_uses_db, local_delta_max_preserved,
      warm_failure_partial_effects_default_vs_required, window_entity_mapping_and_compound_key,
      window_old_equal_future_naive_and_aware, absent_duration_skips_maintained_row,
      aggregate_entity_start_filter_empty_and_first_row, mapping_and_attribute_sum_shapes,
      query_failure_falls_back_but_conversion_propagates.'
    proof: [behavior-tests, oracle, helper-python]
  - text: Environment loader and helper cases have new production-decoder seeds.
    proof: [config-tests, config-corpus, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Spend reads, concurrency or ordered cache effects differ from source.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^spend_reseed::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: The integer setting falls back instead of failing startup or is not consumed.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^spend_reseed::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: New config seed is absent or fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/spend-reseed-*")" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: The independent source adapter is missing or invalid.
      run: test -f tools/oracle/helpers/spend_reseed.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new helper operation has no corpus seed.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/spend-reseed-*")" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/spend-reseed/primary-counter-routing.yaml
  - tools/oracle/cases/helpers/spend-reseed/singleflight-nx-and-partial-warm.yaml
  - tools/oracle/cases/helpers/spend-reseed/window-freshness-and-aggregate.yaml
deviations: []
out_of_scope:
  - B070 retains coalesced_window L416-L491 and spend writes; it consumes these lower primitives.
  - B2316 owns request batching, B126 Redis operations, B715 query deadlines and B199 durations.
pitfalls:
  - 'The oracle helper for this task is pre-registered as spend_reseed in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/spend_reseed.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/spend_reseed.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A clean Redis miss must not fall back to stale process memory, even after a batch miss.
  - The bounded LRU can evict an acquired lock; do not promise universal singleflight across eviction.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
