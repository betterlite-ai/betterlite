dod:
  - text: >-
      Cases noop_slot, present_end_user_null_budget_no_lookup, missing_end_user_resolves_budget,
      no_budget_keeps_token, replace_all_five_fields, custom_caps_fill_only_none,
      reservation_clears_old_state, reservation_disabled, skip_no_raw_body_read,
      strict_boolean_reservation_flags, billing_policy_forces_fail_closed,
      reserve_passes_raw_and_typed_context, request_none, request_state_after_success,
      reservation_error_no_state_write, missing_model_or_router_not_free and zero_cost_skip
      exercise the handoff and exact field mutation. reserve_after_policy is proved by server wiring.
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^budget_admission_handoff::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/budget_admission_handoff.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/budget-admission-handoff-*")"
        && grep -rlq "budget_admission_handoff" tools/oracle/fuzz/corpus/helper_case/budget-admission-handoff-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::budget_admission_handoff::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/budget-admission-handoff-*")"
        && grep -rlq "disable_budget_reservation" crates/betterlite-config/fuzz/corpus/config_yaml/budget-admission-handoff-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::budget_admission_handoff::tests::/)
        - test(/replays_the_/)'
