id: B1225
title: Budget admission handoff after authentication
description: >-
  Hand off to B071 reserve_budget_for_request after auth checks; use its actual implementation, not an
  uninstalled callback port. First clear token.budget_reservation even if skipping. Reserve only when
  skip_budget_checks is false and general_settings.disable_budget_reservation is not boolean true.
  Pass request body, route/router, token, team/user/end-user objects, DB/cache/logging context and
  B1100 read_raw_json_body(request), including request=None. apply_user_budget_to_team_keys is enabled
  only for boolean true; fail_closed_budget_enforcement is enabled for boolean true OR any non-null
  token.billing_agent_policy. Absent settings are None and effectively false; string true does not satisfy
  these identity comparisons. There are no top-level aliases or environment reads. After success or a
  skipped reservation, copy token.budget_reservation to request.state if a request exists. If reservation
  raises, propagate it without writing request.state; B757 owns its final HTTP envelope.

  Overlay a key default end-user budget by taking end_user_object.litellm_budget_table when an end-user
  object exists, even if that relation is None; only an absent object invokes B739
  resolve_default_end_user_budget. No budget means no changes. With keep_token_limits=false replace all
  five token fields end_user_max_budget, end_user_tpm_limit, end_user_rpm_limit, end_user_tpd_limit and
  end_user_model_max_budget, including None values. With true fill only None fields, preserving zero or
  empty maps supplied by custom auth. _noop_none supplies an empty result slot for B1221's gather.

  _should_skip_budget_checks resolves the model through B881 request context, with team_id default
  None, and calls B750 _is_model_cost_zero only if both model and router exist; otherwise false.
  A zero-cost result bypasses reservations but still clears old token/request reservation state.
  Source helper equality covers only this pure decision with a configured router; stateful reservation
  and overlay use native tests and booted HTTP cases with POSTGRES_TEST_URL or testcontainers.


  Build the production budget_admission_handoff module in betterlite-auth; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _noop_none (L3113-L3116; 4 source lines), _apply_key_end_user_default_budget_to_token (L3119-L3156;
  37 source lines), _reserve_budget_after_common_checks (L3159-L3202; 43 source lines), _should_skip_budget_checks
  (L3205-L3221; 17 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  The B002 loader retains the three general_settings flags' explicit boolean identity semantics.


  Limit B856 Management::auth helper comparisons to _should_skip_budget_checks with the real configured
  router and typed request context. Seed that operation in B171 helper_case; native and HTTP tests own
  reservations and budget lookups. No Python helper adapter calls a management handler or reservation DB path.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::budget_admission_handoff::tests::absent_flags, boolean_flags and
  string_true_is_not_boolean_true. Each must call the production B002 config loader, set each listed field,
  assert the resulting typed value is consumed by this component, and exercise the specified warning/ignore/error
  branch. A grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml
  with the actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 101 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  101 production, 230 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 511 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::budget_admission_handoff::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
