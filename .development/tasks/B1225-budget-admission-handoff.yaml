pitfalls:
  - 'The oracle helper for this task is pre-registered as budget_admission_handoff in the server group. Replace the stub Op in tools/oracle/src/helpers/server/budget_admission_handoff.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/budget_admission_handoff.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - An existing end-user with no budget relation prevents a fallback budget lookup; an absent end-user does not.
  - Reservation failure leaves request.state untouched although token.budget_reservation was already cleared.
