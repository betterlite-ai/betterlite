      run: >-
        cargo run --locked -p betterlite-oracle -- --self-check
        tools/oracle/cases/helpers/mcp-rest-tool-execution

oracle_cases: []

deviations:
  - what: >-
      Upstream authentication challenges (client-forwarded OAuth2 401) are relayed as HTTP 401
      with original WWW-Authenticate header so MCP clients can re-run upstream OAuth instead of
      receiving a generic error.
    why: MCP clients expect standards-compliant OAuth2 flows; relaying the upstream challenge preserves that contract.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/rest_endpoints.py#L305-L351

out_of_scope:
  - >-
    Manager execute_mcp_tool, complete_call_tool_result wire conversion and tool calling
    semantics (Q2 manager leaves).
  - >-
    Manager _get_tools_from_server, ID/name lookup, allowed-server resolution and IP filtering
    (Q2 manager).
  - >-
    fire_mcp_tool_call_logging, fire_mcp_tool_call_failure_logging and their logging
    destinations (Q2 manager).
  - >-
    Virtual tool handlers: coerce_top_k, handle_agent_search, handle_skill_search,
    handle_mcp_tool_search, handle_mcp_tool_call (Q4 catalog/OpenAPI).
  - >-
    MCPRequestHandler header extraction methods (part of B4726).
  - >-
    common_processing_pre_call_logic, MCPRequestContext.resolve_guardrail_context, pre-call/
    guardrail ordering (Q7 shared pre-call service).
  - >-
    acting_user_auth, reject_disallowed_mcp_client, build_effective_auth_contexts,
    _apply_toolset_scope (Q6 shared proxy/auth).
  - >-
    get_request_base_url for redirect binding (Q4 catalog/OpenAPI).
  - >-
    Authentication and authorization enforcement (Q6 shared proxy/auth).
  - >-
    MCPUpstreamAuthError, GuardrailRaisedException, BlockedPiiEntityError,
    ModifyResponseException exception types and their semantics.

pitfalls:
  - >-
    Logging failures must not turn into HTTP error responses; catch, warn and return the result.
    Only guardrail rejections and cancellations propagate as exceptions.
  - >-
    The skip_guardrails=true flag in pre-call data signals that guardrails run inside
    execute_mcp_tool; do not double-guard in the endpoint.
  - >-
    Virtual-call guardrail rejections propagate unhandled to the catch-all upstream auth relay,
    the same as the direct call path.
  - >-
    Upstream 401 from either direct or virtual execution must relay with WWW-Authenticate so MCP
    clients can re-run OAuth; info-level logging (expected reauth signal, not operator error).
  - >-
    Locally generated denials (permission, IP filtering, BYOK constraints) must log at error level
    for visibility into restriction probing.
  - >-
    Per-user OAuth header prefetch checks if the target server exists and uses OAuth2; skip on
    missing/non-OAuth servers.
  - >-
    The metadata stamp must resolve server name after pre-call processing, in case the
    processing/caching layer has stale information.
  - >-
    The client-forwarded token auth types (true_passthrough, oauth_delegate) determine whether
    to pass caller OAuth2 headers instead of/in addition to per-user headers.

review_level: security

