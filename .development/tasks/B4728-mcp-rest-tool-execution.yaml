dod:
  - text: >-
      _stamp_mcp_tool_metadata resolves server by UUID or name through the manager and
      captures tool name and server name in logging metadata.
    proof: [tool-execution-tests]
  - text: >-
      fire_tool_call_logging fires post-call logging, re-raises GuardrailRaisedException/
      BlockedPiiEntityError/ModifyResponseException/HTTPException/CancelledError, suppresses other
      failures with warning, and returns the result.
    proof: [tool-execution-tests]
  - text: >-
      fire_tool_call_failure_logging fires post-call failure logging and suppresses
      logging errors with warning; no failures propagate.
    proof: [tool-execution-tests]
  - text: >-
      relay_upstream_auth converts MCPUpstreamAuthError into HTTPException with
      status 401, original Challenge header, and base_url/path context.
    proof: [tool-execution-tests, tool-execution-oracle]
  - text: >-
      _handle_virtual_mcp_tool checks mcp_tool_search_enabled, runs pre-call pipeline with spend
      logging, dispatches to virtual tool handler (agent_search/skill_search/mcp_tool_search/mcp_tool_call),
      re-raises guardrail rejections, suppresses logging failures, and converts upstream auth errors.
    proof: [tool-execution-tests, tool-execution-oracle]
  - text: >-
      call_tool_rest_api validates server_id and tool name as required, stamps metadata, resolves
      allowed servers with IP filtering, prefetches per-user OAuth headers, and executes the tool.
    proof: [tool-execution-tests, tool-execution-oracle]
  - text: >-
      Execution calls manager's execute_mcp_tool with skip_guardrails=true, pre-call result, allowed
      servers, per-user/caller OAuth headers, and converts result through complete_call_tool_result(WireCompat.LEGACY).
    proof: [tool-execution-tests, tool-execution-oracle]
  - text: >-
      Post-call logging fires with start/end times, user auth and request data; guardrail rejections
      and cancellations propagate as exceptions while logging failures are suppressed.
    proof: [tool-execution-tests, tool-execution-oracle]
  - text: >-
      Failure exceptions (missing env vars, blocked PII, guardrails, upstream auth, local denials,
      unexpected errors) return HTTP 412/400/400/401/403,400,412/500 with detail.error/message
      and endpoint-specific fields.
    proof: [tool-execution-tests, tool-execution-oracle]
  - text: >-
      Every observable config key default, header, status code, error type/message, and param
      is in a named case with literal input and expected outcome.
    proof: [tool-execution-tests, tool-execution-oracle]
  - text: Every mutant in tool execution logic is caught by a test.
    proof: [mutants]

