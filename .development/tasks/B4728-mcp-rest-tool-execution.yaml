id: B4728
title: MCP REST tool execution and logging completion
description: >-
  Build POST `/mcp-rest/tools/call` REST endpoint for MCP tool execution with logging completion,
  metadata stamping, failure handling and virtual tool dispatch. The endpoint preserves pre-call
  and guardrail ordering, post-call logging success/failure distinction, and upstream authentication
  challenges.

  `stamp_mcp_tool_metadata` captures tool and server identity in logging metadata from the manager
  by server_id (UUID/name lookup).

  `fire_tool_call_logging` fires post-call logging for successful execution results,
  catching guardrail rejections and cancellations to re-raise while suppressing other logging
  failures with a warning and returning the result to send to the client.

  `fire_tool_call_failure_logging` fires post-call failure logging and suppresses logging
  failures with a warning; the failure is re-raised to the endpoint's exception handler.

  `relay_upstream_auth` converts MCPUpstreamAuthError (client-forwarded passthrough
  or OAuth delegate 401 from an upstream server) into an HTTPException carrying the original
  WWW-Authenticate header, so MCP clients can re-run upstream OAuth instead of receiving a generic
  500.

  `_handle_virtual_mcp_tool` gates agent_search/skill_search/mcp_tool_search/mcp_tool_call against
  mcp_tool_search_enabled on the key, enforces pre-call processing with spend logging and guardrail
  checks, and distinguishes virtual-call guardrail failures (which propagate) from logging failures
  (which are caught and suppressed).

  The main `call_tool_rest_api` endpoint accepts server_id, tool name, tool arguments and optional
  MCP server/auth headers. It stamps metadata, resolves allowed servers with IP filtering and per-
  user OAuth headers, executes the tool, fires post-call logging, and distinguishes exception
  types: missing user env vars (412), blocked PII (400), guardrails (400), upstream auth (401 with
  relay), local denials (403/400/412 at error level), and unexpected errors (500).

  Execution calls the manager's execute_mcp_tool directly with pre-call processing result,
  skip_guardrails=true in call_mcp_tool data (so the guardrails run inside execute_mcp_tool
  instead), allowed_mcp_servers result, per-user OAuth headers and caller headers. The result is
  converted through complete_call_tool_result(executed, WireCompat.LEGACY) before logging.

