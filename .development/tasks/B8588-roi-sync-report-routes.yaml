    why: The startup caller that registers the scheduled sync.
dod:
  - text: The six routes exist on exactly their paths and methods; reads take the read admin check, writes the write admin check, and a caller without credentials gets the usual 401.
    proof: [route-tests, oracle]
  - text: GET sync answers the store status or the manager status with next_update; POST answers 409 when not ready or already running and 202 with the status otherwise; DELETE cancels store and manager in that order.
    proof: [sync-tests, oracle]
  - text: The report route answers the demo summary without reading the stored report, null without a report, and the summary with the stored identity map otherwise.
    proof: [report-tests, oracle]
  - text: The identity map route folds the login, rejects an empty login or a bad email with 422, removes on a null email, keeps the stored encrypted secrets and answers the new map with the summary or null.
    proof: [identity-tests, oracle]
  - text: Setup reset answers 409 when the lease is taken, otherwise empties repos, clears the report and answers the public settings, and always finishes the lease as idle after a good acquire.
    proof: [reset-tests, oracle]
  - text: next_update and run_scheduled_sync follow every early return in the description and start the manager with the scheduled interval only when the next update is due.
    proof: [schedule-tests]
checks:
  optional: [mutants]
  commands:
    - id: route-tests
      why: a route path, method or admin check is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_routes::tests::route_/)'
    - id: sync-tests
      why: the sync status, start or cancel route is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_routes::tests::sync_/)'
    - id: report-tests
      why: the report route or its demo mode is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_routes::tests::report_/)'
    - id: identity-tests
      why: the identity map route is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_routes::tests::identity_/)'
    - id: reset-tests
      why: the setup reset route or its lease is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_routes::tests::reset_/)'
    - id: schedule-tests
      why: next_update or the scheduled sync step is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_routes::tests::schedule_/)'
    - id: new-cases
      why: the ROI routes have no HTTP parity case on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/management/roi_routes)"
oracle_cases:
  - tools/oracle/cases/management/roi_routes/sync-status-no-credentials.yaml
  - tools/oracle/cases/management/roi_routes/sync-start-not-ready-409.yaml
  - tools/oracle/cases/management/roi_routes/report-live-empty.yaml
  - tools/oracle/cases/management/roi_routes/identity-map-empty-login-422.yaml
  - tools/oracle/cases/management/roi_routes/setup-reset-view-only-403.yaml
deviations: []
out_of_scope:
  - "GET and PUT /roi-calculator/settings, the admin checks, the repository lookup and the settings and report loaders: B3158. /roi-calculator/repositories, /roi-calculator/connections/test, the spend reader and the completion caller: B3161."
  - "The sync runner: B3157. The sync lease store: B3155. summarize and normalize_email: B3151. sample_report: B8273."
  - "register_scheduled_sync, the 30 second interval job with id roi_calculator_refresh, max one instance and replace_existing, belongs to the scheduler (B8372); it calls run_scheduled_sync from here."
pitfalls:
  - "The demo report still passes the read admin check and the repository lookup first, so a proxy with no database answers 500 even for mode=demo."
  - "The identity map save reuses the stored encrypted github_token and estimator_key text; encrypting the decrypted values again would change them."
  - "setup/reset must finish its lease even when a save fails, or the next sync stays blocked until the lease runs out."
  - "DELETE /roi-calculator/sync cancels the store before the manager, so another pod sees the cancel even when this pod has no running task."
  - "POST /roi-calculator/sync answers 202, not 200, and its 409 text differs from the connection test's 409 text."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
