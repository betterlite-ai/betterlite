id: B8588
title: Serve the ROI sync, report, identity map and setup reset routes
description: >-
  Build the rest of LiteLLM's management_endpoints/roi_calculator_endpoints.py in betterlite-server, module `roi_routes` (crates/betterlite-server/src/roi_routes.rs and roi_routes/**): six routes, `next_update` and the scheduled sync step. `pub fn routes()` returns the axum router like the sibling route modules; the wave 17 ROI wiring part mounts it. B3158 already builds GET and PUT `/roi-calculator/settings` and the pieces this task reuses: the read admin check (proxy_admin or proxy_admin_viewer, else 403 "Only proxy admins can access the ROI Calculator."), the write admin check (proxy_admin only, else 403 "Only proxy admins can change ROI Calculator settings."), the repository lookup that answers 500 with the db_not_connected text when there is no database, and the ports of `_load_settings`, `_load_stored_settings`, `_save_settings`, `_load_report` and `_public_settings`. B3161 builds `/roi-calculator/repositories`, `/roi-calculator/connections/test`, the spend reader and the completion caller. Call theirs and do not write them again.

  Collaborators. B3155's `SyncStore` (betterlite-db, `status`, `cancel`, `acquire`, `finish`, `clear_report`), B3157's `SyncManager` (betterlite-server::roi_sync, `start`, `cancel` and its current status), B3151's `summarize` and `normalize_email` and B8273's `sample_report` (betterlite-roi), and the records `ROISyncStatus`, `ROIReport`, `ROIReportResponse`, `ROIIdentityMapUpdate` and `ROIIdentityMapResponse` already in betterlite-roi. `RoiRouteState` takes, by constructor: one shared SyncManager for the whole process (LiteLLM keeps a single module-level `_SYNC_MANAGER`), the repository source, the SyncStore source, a clock, the router model list B3158 reads estimator models from, and B3161's spend reader and completion caller factories. Tests use fakes for all of them.

  GET `/roi-calculator/sync` (read admin). The status is the store's status, or the manager's status when the store has none. Load settings and the report, then answer that status with `next_update` set to next_update as ISO text, or null.
  POST `/roi-calculator/sync` (write admin, 202 on success). Load settings. When the public settings are not ready, answer 409 "Connect GitHub, select repositories, and choose a router model.". Otherwise start the manager with the settings, the repository, the spend reader, the completion caller, no GitHub transport, the router estimator models for settings.estimator_model and the store as coordinator. A false start answers 409 "A sync is already running."; a true one answers the manager's status.
  DELETE `/roi-calculator/sync` (write admin). Cancel the store, then the manager, then answer the store's status or, when it has none, the manager's.
  GET `/roi-calculator/report` (read admin) with query `mode`, `live` or `demo`, default `live`. Demo answers `{"report": summarize(sample_report(now), empty map)}` and reads no report. Live loads the report: none answers `{"report": null}`, otherwise `{"report": summarize(report, settings.identity_map)}`.
  PUT `/roi-calculator/identity-map` (write admin) with an ROIIdentityMapUpdate body. login is github_login with surrounding whitespace stripped and then case folded the way Python's str.casefold does. Load the settings and the stored settings. When email is given, new_email is normalize_email(email). An empty login, or an email given whose normalized form is empty, answers 422 "Enter a GitHub login and a valid email address.". A null email removes login from the map; otherwise login maps to new_email, replacing any old value. Save the settings with the new map and the stored, already encrypted github_token and estimator_key as they are. Answer `{"report": <summary with the new map, or null without a report>, "identity_map": <the new map>}`.
  POST `/roi-calculator/setup/reset` (write admin). owner is a new UUID v4 as text. Try store.acquire(owner, status) with status running true, phase "spend", stage "Restarting setup", done, total, estimated, reused and needs_attention 0 and error null. A failed acquire answers 409 "Cancel the running analysis before restarting setup.". Otherwise load settings and stored settings, save the settings with repos emptied and the stored encrypted secrets, clear the stored report, and answer the public settings. After a good acquire, finish the claim with that status changed to running false, phase "idle", stage "Idle", also when a step in between fails.

  `next_update(settings, status, report)`: none when there is no report, settings.repos is empty, estimator_model is empty, update_interval_minutes is 0, or status.running is true. Otherwise the anchor is status.finished_at, else status.started_at, else report.synced_at, read as an ISO date-time where a trailing "Z" means +00:00 and a time without an offset is UTC; the answer is the anchor in UTC plus update_interval_minutes minutes (a float).
  `run_scheduled_sync(state)` (L573-L596): with no database return. Load settings; return when update_interval_minutes is 0 or the public settings are not ready. Read the status (store, else manager) and the report; return when next_update is none or later than now. Otherwise start the manager like POST does, with scheduled_interval set to update_interval_minutes. Its errors propagate to the caller.
