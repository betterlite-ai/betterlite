id: B1071
title: Vector file contracts
description: >-
  Define typed vector-store file create/list/retrieve/content/update/delete records and provider transforms, including
  chunking_strategy and attributes. Preserve endpoint-specific optional/query parameter projection and signed configured
  request preparation.


  BaseVectorStoreFilesConfig.prepare_chunking_strategy (litellm/llms/base_llm/vector_store_files/transformation.py:L207-L211)
  has no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and
  no behavior case exercises that unused entry point.


  chunking-strategy-auto/static exercise the live create optional-parameter projection, not the unused prepare_chunking_strategy
  convenience method.


  Implement crates/betterlite-core/src/api/vector_file_contracts.rs, crates/betterlite-openai/src/api/vector_file_contracts.rs,
  crates/betterlite-provider/src/api/vector_file_contracts.rs. Use VectorFileContractsInput and VectorFileContractsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions chunking_strategy_auto, chunking_strategy_static, file_attributes,
  file_list_query, file_content_records under api::vector_file_contracts::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  The production external-byte decoder is betterlite-openai::api::vector_file_contracts::decode_vector_file_contracts(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/vector_file_contracts.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-openai/fuzz/fuzz_targets/vector_file_contracts.rs passes arbitrary bounded bytes to that
  exact decoder; api::vector_file_contracts::tests::replays_corpus replays newly committed seeds through the same
  function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::VectorFileContracts in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_file_contracts: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.get_supported_openai_params
  (L35-L41); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.map_openai_params
  (L43-L53); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.get_auth_credentials
  (L56-L56); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.get_vector_store_file_endpoints_by_type
  (L59-L61); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.validate_environment
  (L64-L70); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.get_complete_url
  (L73-L82); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_create_vector_store_file_request
  (L85-L91); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_create_vector_store_file_response
  (L94-L98); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_list_vector_store_files_request
  (L101-L107); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_list_vector_store_files_response
  (L110-L114); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_retrieve_vector_store_file_request
  (L117-L123); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_retrieve_vector_store_file_response
  (L126-L130); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_retrieve_vector_store_file_content_request
  (L133-L139); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_retrieve_vector_store_file_content_response
  (L142-L146); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_update_vector_store_file_request
  (L149-L156); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_update_vector_store_file_response
  (L159-L163); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_delete_vector_store_file_request
  (L166-L172); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.transform_delete_vector_store_file_response
  (L175-L179); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.get_error_class
  (L181-L194); litellm/llms/base_llm/vector_store_files/transformation.py: BaseVectorStoreFilesConfig.sign_request
  (L196-L205); litellm/vector_store_files/utils.py: VectorStoreFileRequestUtils._filter_params (L15-L17); litellm/vector_store_files/utils.py:
  VectorStoreFileRequestUtils.get_create_request_params (L20-L24); litellm/vector_store_files/utils.py: VectorStoreFileRequestUtils.get_list_query_params
  (L27-L29); litellm/vector_store_files/utils.py: VectorStoreFileRequestUtils.get_update_request_params (L32-L36).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 260 owned nonblank/non-comment/non-docstring Python lines (264 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 280 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  46 wiring; 606 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B1015 (File contracts), B1087 (Api boundaries). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
