id: B1071
title: Attached vector-file records and parameter filters
description: >-
  Define vector_store_files.py records in betterlite-openai, BaseVectorStoreFilesConfig contracts in
  betterlite-provider and VectorStoreFileRequestUtils in betterlite-core. Create retains file_id,attributes,
  chunking_strategy; list retains after,before,filter,limit,order; update retains attributes. All three
  filters discard only unknown keys and values equal to null, without validating the TypedDict annotations.
  Provider defaults and response records must not depend on core. B527 supplies concrete OpenAI transforms.

  Own transformation.py:33-205, every type in types/vector_store_files.py and all four functions in
  vector_store_files/utils.py. prepare_chunking_strategy at 207-211 has no caller at the pin and is excluded.
  Add HelperCall::VectorFileContracts for the pure filters and base defaults. Record tests compare actual
  pinned construction/validation at the caller boundary rather than inventing runtime TypedDict validation.
  decode_vector_file_contracts(kind,bytes,WireDecodeLimits) is the leaf JSON boundary; its fuzz input uses
  one kind byte followed by JSON. replays_corpus calls that same decoder. Use B204 decimals for numeric
  attributes and retain bool as a separate attribute type. Count 232 implemented nonblank/non-comment lines; estimate
  250 implementation, 160 tests, 90 adapters, 80 fixtures, 60 fuzz/replay and 40 wiring, 680 under 720.
