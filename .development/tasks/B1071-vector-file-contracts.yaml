references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/vector_store_files/transformation.py#L33-L211
  why: Abstract file operations and base URL/error/signing defaults; the final unused chunking convenience method is excluded.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/vector_store_files.py#L1-L91
  why: Optional attachment, page, deletion and text-content fields and the exact status/chunking literals.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_store_files/utils.py#L11-L36
  why: The one shared filter drops nulls and unknown names but preserves false, zero, empty collections and invalid annotated values.
dod:
- text: >-
    attachment_parameter_filters passes file_id=file_a,attributes={},chunking_strategy={type:auto},unknown=1
    to create and expects only the first three keys. Null attributes/chunking_strategy disappear; omitted
    file_id is not synthesized or rejected by this filter. Static {type:static,static:{max_chunk_size_tokens:800,
    chunk_overlap_tokens:400}} survives unchanged. Update accepts attributes={} and ignores file_id/unknown;
    attributes=null produces {}. The wrapper that later restores mandatory fields is B1072/B1074.
  proof: [contracts-tests, oracle, helper-python]
- text: >-
    list_query_filter sends after="",before=file_b,filter=failed,limit=0,order=asc,unknown=1 and gets the
    first five fields. Explicit nulls disappear. filter=unexpected,order=sideways and limit=-1 also survive
    because filtering does not validate values. Named variants retain in_progress,completed,failed,cancelled
    and asc/desc without adding a default limit or order.
  proof: [contracts-tests, oracle, helper-python]
- text: >-
    attachment_record_fields round-trips id=file_a,object=vector_store.file,created_at=1,usage_bytes=2,
    vector_store_id=vs_a,status=in_progress/completed/failed/cancelled,last_error={code:bad,message:failed},
    chunking_strategy={type:auto},attributes={text:x,integer:2,decimal:0.25,boolean:false}. Nullable fields
    also retain explicit null independently from absence. Static chunking preserves max_chunk_size_tokens
    and chunk_overlap_tokens without an invented range check. List replies retain object=list,data,
    first_id,last_id,has_more=false; deletion retains id,object=vector_store.file.deleted,deleted=true;
    content retains file_id,filename=null,attributes,content=[{type:text,text:hello}]. Auth records preserve
    headers and query_params, including missing maps. Empty total=False records stay empty.
  proof: [contracts-tests, oracle, helper-python]
- text: >-
    file_provider_defaults exposes the concrete base method bodies through a minimal implementation of
    abstract methods. supported params for create/list/read/update/delete are (); mapping returns supplied
    optional_params unchanged even with drop_params=true. validate_environment returns {}; get_complete_url
    returns an explicit "" or supplied URL unchanged and null raises ValueError("api_base is required").
    sign_request returns the same headers and null body; get_error_class(message=bad,status=429,headers={Retry-After:3})
    raises BaseLLMException retaining 429,bad and Retry-After=3. These methods issue no HTTP requests.
  proof: [contracts-tests, oracle, helper-python]
- text: Malformed attachment JSON and every record-kind selector replay through decode_vector_file_contracts; new helper tag seeds replay too.
  proof: [wire-corpus, helper-corpus]
checks:
  optional: [mutants]
  commands:
  - id: contracts-tests
    why: attachment fields or null-only parameter filtering are lost in one of the three implementation crates
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider -p betterlite-openai --no-tests=fail -E 'test(/^api::vector_file_contracts::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: file filters and defaults have no independently typed pinned comparison
    run: test -f tools/oracle/helpers/vector_file_contracts.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: wire-corpus
    why: attachment JSON can bypass the fuzzed decoder
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/vector_file_contracts.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/vector_file_contracts)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::vector_file_contracts::tests::replays_corpus$/)'
  - id: helper-corpus
    why: no newly added vector_file_contracts input exercises B171
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_file_contracts-*)" && grep -qE '^[[:space:]]+vector_file_contracts:' tools/oracle/fuzz/corpus/helper_case/vector_file_contracts-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vector-file-contracts/attachment-parameter-filters.yaml
- tools/oracle/cases/helpers/vector-file-contracts/list-query-filter.yaml
- tools/oracle/cases/helpers/vector-file-contracts/attachment-record-fields.yaml
- tools/oracle/cases/helpers/vector-file-contracts/file-provider-defaults.yaml
deviations: []
out_of_scope:
- BaseVectorStoreFilesConfig.prepare_chunking_strategy has no caller at the pin; no oracle case exercises that unused method.
- B527 owns OpenAI attribute cleaning, header defaults, URL encoding and concrete request/response transformations.
- B204 owns exact-number limits; file SDK wrappers own timeout/provider selection, and routes own HTTP authentication.
pitfalls:
- 'The oracle helper for this task is pre-registered as vector_file_contracts in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/vector_file_contracts.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vector_file_contracts.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An attributes map can contain false and numeric values here even though OpenAI later removes its non-string entries.
- The list filter does not reject an unknown status or a negative limit just because its TypedDict annotation is narrower.
- A missing file_id remains missing in create filtering; the public wrapper inserts its explicit argument afterwards.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
