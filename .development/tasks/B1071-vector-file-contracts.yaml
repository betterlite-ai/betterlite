checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai -p betterlite-provider --no-tests=fail
      -E 'test(/^api::vector_file_contracts::/) - test(/::replays_corpus$/)'
  - id: case-chunking-strategy-auto
    why: the chunking-strategy-auto behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_contracts::tests::chunking_strategy_auto($|::)/)'
  - id: case-chunking-strategy-static
    why: the chunking-strategy-static behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_contracts::tests::chunking_strategy_static($|::)/)'
  - id: case-file-attributes
    why: the file-attributes behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_contracts::tests::file_attributes($|::)/)'
  - id: case-file-list-query
    why: the file-list-query behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_contracts::tests::file_list_query($|::)/)'
  - id: case-file-content-records
    why: the file-content-records behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_contracts::tests::file_content_records($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/vector_file_contracts)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/vector_file_contracts.rs && grep -qF "decode_vector_file_contracts"
      crates/betterlite-openai/fuzz/fuzz_targets/vector_file_contracts.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::vector_file_contracts::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/vector_file_contracts.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_file_contracts-*)"
      && grep -qE "^[[:space:]]+vector_file_contracts:" tools/oracle/fuzz/corpus/helper_case/vector_file_contracts-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/vector-file-contracts)"
