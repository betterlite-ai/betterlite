id: B1017
title: Managed resource access
description: >-
  Build managed-resource ownership and list-query predicates using B052 principals, and filter authorized candidate
  deployments using stored mappings. Retain user-or-team visibility, service-account team fallback, key-hash identity
  and deny-without-query when no identity exists; never accept caller-supplied owner fields.


  Own pure isolation predicates only. PROXY_ADMIN_VIEW_ONLY counts as admin and can_access_resource permits modification.
  With no user/team, created_by is key:<token or api_key>. Do not substitute resource_ownership.py semantics for
  this isolation.py predicate.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-core/src/api/managed_resource_access.rs. Use ManagedResourceAccessInput and ManagedResourceAccessResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs functions user_or_team_resource, service_account_team, key_hash_owner, none_owner_denied,
  view_only_admin_can_modify, key_token_owner under api::managed_resource_access::tests; each independently drives
  the production result and effects described here. HelperCase replay remains in B171.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ManagedResourceAccess in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {managed_resource_access: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/managed_resources/isolation.py: resolve_resource_owner_id (L23-L46);
  litellm/llms/base_llm/managed_resources/isolation.py: build_list_page (L49-L59); litellm/llms/base_llm/managed_resources/isolation.py:
  build_owner_filter (L62-L100); litellm/llms/base_llm/managed_resources/isolation.py: can_access_resource (L103-L126).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 60 owned nonblank/non-comment/non-docstring Python lines (101 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 80 implementation,
  88 behavior tests, 96 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 384 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1016 (Managed resource ids), B1087
  (Api boundaries), B732 (Typed authentication principals and grant resolution). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.


  All cases here call isolation.py predicates; admin listing and deployment filtering from BaseManagedResource are
  unreachable MIT template bodies and have no implementation or oracle cases.
