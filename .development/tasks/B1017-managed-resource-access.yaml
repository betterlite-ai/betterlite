id: B1017
title: Managed resource access
description: >-
  Implement isolation.py's four complete functions in betterlite-core::api::managed_resource_access.
  These are the owner stamp, Prisma owner filter, access predicate and OpenAI list-page projection used
  by MIT managed-id rewriting and file listing. Take B732's authenticated principal; there is no database
  or provider call here. In particular, user and team visibility are alternatives, not an intersection.
  Use native typed filter variants so a denied query (None) cannot be confused with the admin filter ({}).

  is-not-None tests deliberately preserve empty user_id and team_id strings. The token fallback prefers
  token over api_key and applies only when both user_id and team_id are None. Both proxy_admin and
  proxy_admin_viewer have admin view and may pass the read/modify predicate. This differs from B1018's
  resource_ownership.py policy, which bypasses only for proxy_admin.

  Add adjacent tests under api::managed_resource_access::tests with the names in the DoD. Register
  HelperCall::ManagedResourceAccess and the managed_resource_access Python dispatch operation; pass
  typed principals and resource records to the real functions and compare filter shapes and booleans.
  No decoder, settings or HTTP routes are introduced. The 84 nonblank, non-comment owned function lines need
  about 100 implementation, 115 tests, 75 fixtures, 80 adapters and 30 wiring lines: a 400-line budget.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/managed_resource_access.rs
  - crates/betterlite-core/src/api/managed_resource_access/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/managed_resource_access.rs
  - tools/oracle/src/helpers/core_ops/managed_resource_access/**
  - tools/oracle/helpers/managed_resource_access.py
  - tools/oracle/helpers/managed_resource_access/**
  - tools/oracle/fuzz/corpus/helper_case/managed_resource_access-*
  - tools/oracle/cases/helpers/managed-resource-access/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/managed_resources/isolation.py#L23-L126
  why: Owns owner resolution, list response construction, owner query filters and access checks, including their different None tests.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/managed_id_rewriter.py#L390-L408
  why: MIT rewriting calls the access predicate on stored row ownership; decoded ids alone do not authorize access.
dod:
- text: >-
    user_and_team_visibility passes user_id=u and team_id=t. Owner is u; filter is
    {OR: [{created_by: u}, {team_id: t}]}; created_by=u/team=x and created_by=v/team=t both pass,
    while created_by=v/team=x fails. With user only the filter is {created_by: u}.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    service_account_scope supplies user_id=null, team_id=t, token=k. Owner is null and filter
    {team_id: t}; a row owned by key:k on another team fails, and a row on team t succeeds.
    empty_identity_fields supplies user_id="" and team_id="" separately and expects literal empty
    owner/filter values and a match on an empty, non-null corresponding row field.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    token_owner_precedence gives no user/team, token=hash_a and api_key=hash_b: owner key:hash_a,
    filter {created_by: "key:hash_a"}, matching access true and key:hash_b false. An empty token
    falls back to api_key; both empty produce owner=null, filter=null and access=false, even to a
    row with created_by=null/team_id=null. identityless_denial proves no shared null owner exists.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    admin_view_permissions checks proxy_admin and proxy_admin_viewer with no identities: filter={},
    access=true for null and foreign owners. internal_user with the same inputs gets filter=null
    and false. Owner stamping remains independent of the role.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    list_page_boundaries supplies [] and expects object=list, data=[], first_id=null, last_id=null,
    has_more=false. Items with ids a,b retain order and yield first_id=a/last_id=b; explicit
    has_more=true is retained even for an empty list.
  proof: [behavior-tests, oracle, helper-python]
- text: The helper enum tag and new isolation cases parse and run against independent Python functions.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: owner filtering or page construction has no executable assertion
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_access::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: the isolation adapter is missing or cannot typecheck
    run: test -f tools/oracle/helpers/managed_resource_access.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the managed_resource_access tag has no new parser seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/managed_resource_access-*)" && grep -qE '^[[:space:]]+managed_resource_access:' tools/oracle/fuzz/corpus/helper_case/managed_resource_access-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: this branch adds no ownership comparisons
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/managed-resource-access)"
oracle_cases:
- tools/oracle/cases/helpers/managed-resource-access/user-and-team-visibility.yaml
- tools/oracle/cases/helpers/managed-resource-access/service-account-scope.yaml
- tools/oracle/cases/helpers/managed-resource-access/empty-identity-fields.yaml
- tools/oracle/cases/helpers/managed-resource-access/token-owner-precedence.yaml
- tools/oracle/cases/helpers/managed-resource-access/identityless-denial.yaml
- tools/oracle/cases/helpers/managed-resource-access/admin-view-permissions.yaml
- tools/oracle/cases/helpers/managed-resource-access/list-page-boundaries.yaml
deviations: []
out_of_scope:
- >-
  All BaseManagedResource methods and its _ManagedResourceRecord/_ManagedResourceTable protocols in
  base_managed_resource.py have no MIT subclass/caller at the pin. Keep the abstract creation,
  storage, mapping, filtering and pagination template inactive; do not install an enterprise hook.
- B1018 owns resource_ownership.py's separate legacy and prefixed owner-scope predicates.
- B087 owns HTTP file-list authentication and conversion to FileListPage; B102 owns managed-id rewriting.
pitfalls:
- 'The oracle helper for this task is pre-registered as managed_resource_access in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/managed_resource_access.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/managed_resource_access.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An empty string is a valid identity in isolation.py because it checks None; copying B1018's truthiness tests changes access.
- Admin view permits mutation here, including proxy_admin_viewer; replacing it with is_proxy_admin denies source-compatible requests.
- A filter of None means skip the repository query, whereas {} deliberately permits an unscoped admin query.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
