id: B8993
title: Responses and Anthropic guardrail stream HTTP parity
description: >-
  B3672 and B3676 leave their asynchronous streaming paths to HTTP integration,
  while B6260/B6370 currently prove only chat streams. Add about 700 lines of
  native Responses and Anthropic HTTP cases. Build no iterator, endpoint, registry
  or SSE parser here. Use B080's POST /v1/responses, /responses and
  /openai/v1/responses, and B081's POST /v1/messages and
  /claude_code_gateway/v1/messages with general_settings.enable_claude_code_gateway
  enabled for the latter. /anthropic/v1/messages is a different passthrough
  route and is not an alias of these handlers.

  Configure named generic_guardrail_api guards with dummy credentials and mock
  api_base. For delivered rewrites, configure a policy with pipeline.mode post_call,
  a step naming the guardrail, on_pass allow and on_fail block, and attach the policy
  using policy_attachments with scope "*". These are normal top-level policies and
  guardrails config, not injected _guardrail_pipelines in the request. A pipeline
  buffers the stream and opts into deliver_ended_stream_rewrites through B3246.
  Merely setting streaming_buffer_until_moderated on an ordinary guardrail does not
  enable that policy writeback contract. Use streaming_end_of_stream_only true and
  streaming_sampling_rate 1 only in the standalone blocking cases, where B6260 owns
  the flags and error timing.

  Responses fixtures use a native OpenAI Responses deployment and valid created,
  output-item, output-text delta/done and terminal events. The completed-text case
  rewrites two content parts and compares every earlier delta/done event with the
  completed envelope; the client must not receive the original text in one and the
  masked text in the other. A terminal-incomplete case preserves incomplete status
  and usage while rewriting partial output. A truncated stream without an envelope
  still places the rewrite into the first writable output_text position and clears
  the remaining positions. A separate truncated stream containing only a scanned
  reasoning delta has no writable output_text position: the pipeline warns and
  releases the original stream rather than silently dropping the text. A post-call
  block must use native Responses error events and preserve the served prefix and
  terminal semantics that B937/B3679 provide. Distribute the three route aliases
  across those cases and keep all event type, item id and output/content indices.

  Anthropic fixtures use a native Anthropic deployment and message_start,
  content_block_start/delta/stop, message_delta and message_stop framing. A completed
  text rewrite puts the full replacement in the first text_delta and blanks later
  text deltas without altering surrounding block framing. A stream that ends before
  reporting stop_reason still uses that writeback. A stream block must terminate in
  the Anthropic protocol rather than OpenAI chunks; compare the input/output usage
  fields that survive blocking. Exercise the gateway alias with the same enabled
  configuration. The capture and returned event bodies must prove raw SSE frames
  were scanned, not merely forwarded through B8632's stream bridge.

  Add one response tool-argument rewrite per protocol using Vigil from B8990,
  configured as vigil_guard with mode post_call, api_base at the mock and api_key
  dummy. Its remote SANITIZED reply changes arguments while preserving the tool
  call count, name and id. Responses function_call delta, done and completed item
  arguments must agree; Anthropic input_json_delta fragments must reconstruct the
  rewritten arguments, with the first fragment carrying the new value and later
  fragments blank. Use a tool-only output so no unrelated text scan consumes the
  scripted Vigil reply. GenericGuardrailAPI does not copy tool_calls from its remote
  response, so it cannot stand in for this case.

  Compare the HTTP status, content-type, error type/param/code and complete ordered
  event sequence, as well as the scanner requests and provider URL/auth/body. Strip
  only generated ids and timing fields already normalized by the endpoint's cases;
  never ignore delta text, usage, terminal status or error payloads. Reuse the oracle's
  existing SSE fixtures and decoder and run the ordinary betterlite-versus-LiteLLM
  check. A new case missing on base is red automatically. Any production bridge fix
  belongs to B8632/B6370/B6260, whose contracts must carry raw text/bytes through
  guardrail scanning before this task runs; do not hide a bypass in expected differences.
