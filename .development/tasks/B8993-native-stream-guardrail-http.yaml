deviations: []
out_of_scope:
  - B3672 implements Responses streaming transformations; B3673/B3676 implement Anthropic stream interpretation and writeback.
  - B3246 owns rewrite observation and restoration, B3247 pipeline execution, B6370 pipeline/iterator composition and B6260 sampling/buffering.
  - B080/B081 register the HTTP routes, B8636 provides Responses production ports, and B8632 alone builds the streaming bridge.
  - Chat stream tests remain B6260/B6370 and B105; native Google/A2A stream cases are B8992.
pitfalls:
  - Pipeline writeback is a different switch from ordinary streaming_buffer_until_moderated.
  - An Anthropic body passed around the iterator as raw Bytes without scanning makes a blocking fixture falsely pass only if the capture assertion is missing.
  - An undeliverable rewrite releases the original stream with a warning; replacing it with an empty success changes LiteLLM behavior.
  - GenericGuardrailAPI remote replies cannot rewrite tool_calls, whereas Vigil's response scan can rewrite function.arguments.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
