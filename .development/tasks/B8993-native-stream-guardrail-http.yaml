    why: Text and tool writeback across parsed events and raw SSE frames.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/vigil_guard/vigil_guard.py#L223-L268
    why: Response tool argument sanitization used by the tool-only fixtures.
dod:
  - text: Responses completed, incomplete and truncated streams deliver coherent rewrites, while an undeliverable rewrite releases original events.
    proof: [oracle]
  - text: Anthropic ended and unended streams deliver one replacement across their original framing on both Messages routes.
    proof: [oracle]
  - text: Native stream blocks retain each protocol's errors and usage, and tool argument rewrites agree across every emitted representation.
    proof: [oracle]
