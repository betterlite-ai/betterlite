    why: _declared_query_params and _process_request, the JSON data map, ownership check and processing call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/handler_factory.py#L164-L357
