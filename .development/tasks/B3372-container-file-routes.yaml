id: B3372
title: Container file route registration and JSON requests
description: >-
  Register the five container file routes and build the JSON request processor behind them, in betterlite-server as module api::container_file_routes (crates/betterlite-server/src/api/container_file_routes.rs
  and container_file_routes/**), mounted once from a route stub module routes/container_files.rs that the architect registers. LiteLLM builds these routes at import from endpoints.json
  (register_container_file_endpoints, handler_factory.py L449-L506), each at the `/v1` prefix and the bare path. Every route sits behind B756 authentication and its handler also reads the
  authenticated caller (LiteLLM uses the user_api_key_auth dependency twice; it runs once). The five entries come from B3360's catalog (`container_endpoints()`), in file order.

  Paths and methods (each registered at `/v1{path}` and `{path}`): GET /containers/{container_id}/files (list, route type alist_container_files), POST /containers/{container_id}/files
  (upload, aupload_container_file), GET /containers/{container_id}/files/{file_id} (retrieve, aretrieve_container_file), DELETE /containers/{container_id}/files/{file_id} (delete,
  adelete_container_file), GET /containers/{container_id}/files/{file_id}/content (content, aretrieve_container_file_content). Mount all ten registrations once. Use the path syntax the
  workspace's axum version takes for `{name}` segments. The container routes of proxy/container_endpoints/endpoints.py (create, list, retrieve, delete a container) are B7326 and
  share no path or method with these.

  Handler choice (`_create_handler_for_path_params`, L56-L161), as an enum `HandlerKind` and a function `handler_kind(entry)` with this order. (1) `returns_binary` and path params exactly
  [container_id, file_id]: Binary. (2) `is_multipart`: Multipart. (3) path params [container_id]: ContainerId. (4) path params [container_id, file_id]: ContainerFile. (5) anything else:
  NoParams (no catalog entry reaches it at the pin; build it anyway because it is part of the function, and test it with a made-up entry). The catalog gives Binary to the content entry, Multipart to
  upload, ContainerId to list and ContainerFile to retrieve and delete. Binary and Multipart pass their route's own data to B3371's two functions; the other three call the JSON processor below.

  Binary handler. Calls B3371's `process_file_content_request(parts, container_id, file_id, caller)` and builds the response from the `ContainerFileDownload` it returns: status 200, the body
  bytes, every header it carries, and `Content-Type` set from the media type. A media type that starts with `text/` gets "; charset=utf-8" appended (text/csv becomes "text/csv; charset=utf-8",
  text/plain becomes "text/plain; charset=utf-8"); image/png, application/json and the others stay bare. This route has no JSON response class. Multipart handler. Calls B3371's
  `process_file_upload_request(parts, container_id, route_type, caller, form)` with the entry's async_name and returns the JSON result with status 200 and the headers B004 set. Errors from
  either function are B3371's `ContainerFileRequestError`: AccessDenied answers 403 {"detail": "Forbidden"}, MissingFileField answers 400 {"detail": "Missing required 'file' field"}, a Form error
  keeps B1101's status and body, and Processing keeps B004's mapped error and its x-litellm-* headers. These are plain `{"detail": ...}` bodies, not OpenAI error objects.

  JSON request processor, `process_json_request(parts, route_type, path_params, query_param_names, caller)`, which is `_process_request` (L364-L446) and `_declared_query_params` (L360-L361). Steps.
  (1) `query_params` is every query parameter as a map of strings; a repeated key keeps its last value. (2) data starts with `query_params` (that whole map) under the key "query_params", then
  the declared query params: for each name in the catalog entry's query_params (list has after, limit and order; the other entries have none), the name and its string value when the request has it; undeclared
  names never reach data except inside the "query_params" map. Then the path params (container_id, file_id), which win on any clash. (3) The provider is B3371's `pick_provider` (custom-llm-provider header, then
  custom_llm_provider query value, then "openai"; an empty value falls through). (4) If path_params has container_id: call `ContainerAccess::check_access(container_id, caller, provider)`, then
  `forwarding_params(container_id, original_container_id, resolved_provider)`, and update data with the result (container_id, custom_llm_provider and model_id when present), overwriting any
  earlier key of the same name. Both run before the guarded section, so a denial is 403 {"detail": "Forbidden"} and never goes through exception handling. (5) If path_params has no container_id,
  set data["custom_llm_provider"] to the picked provider. (6) Inside the guarded section call `RequestProcessing::process(data, route_type, caller)` with no model and return the result
  unchanged; any failure goes to `handle_exception` once. This processor reads no request body, and the DELETE and GET routes carry none.

  Wiring. B3371 declares the `ContainerAccess` and `RequestProcessing` traits and takes them by constructor; this task builds the single `ContainerFileRoutes` value that holds them with the
  catalog and passes them to B3371's `ContainerFileRequests` and to the JSON processor. The production `ContainerAccess` adapter is B3371's. The production `RequestProcessing` is B004's
  common request processing, which reaches the container route types through B7430's ContainerCall dispatch entry; this task passes the route type string and the data map and nothing else.
  `get_all_route_types` and `_get_container_provider_config` are not built (see out_of_scope).

  HTTP oracle cases. The routes are new behavior a client sees, so the branch adds cases under tools/oracle/cases/api/container-file-routes, run against LiteLLM and betterlite with master_key=sk-test
  and the OpenAI mock provider's container endpoints (B3363 owns the provider side). They check: the list, retrieve and delete routes on `/v1` and the bare paths with the data the provider received
  (limit, order and after reach the provider as strings, an unknown query name does not); GET content on both prefixes with the bytes and the content-type header for an id ending in .png, .csv and with
  no extension; a key that does not own the container getting 403 {"detail": "Forbidden"} on all five routes with zero provider requests; a multipart upload with no `file` part answering 400
  {"detail": "Missing required 'file' field"}; a multipart upload whose form also sends container_id and custom_llm_provider fields, where the provider receives the path container and the picked
  provider and not the form values, while a form field named purpose is forwarded; and a missing or wrong key giving 401 on every alias. Where the fixture needs an owned container, it creates
  it with the owner key through POST /v1/containers when that route exists on the branch, and otherwise seeds the ownership row that B3362 reads (a LiteLLM_ManagedObjectTable row with file_purpose "container").

  Tests in api::container_file_routes::tests use fakes for the two traits and the file request functions. Name them route_aliases, handler_kind, json_data, json_access, binary_response, upload_response,
  error_bodies and auth_failures. Budget from about 135 owned LiteLLM lines: 300 implementation, 380 tests and 150 oracle fixtures.
