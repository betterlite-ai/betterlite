  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/endpoints.py#L478-L483
    why: The one call that mounts the file routes on the container router.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/container_endpoints/ownership.py#L317-L334
    why: assert_user_can_access_container, the source of the 403 Forbidden (B3362).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/unit/proxy/container_endpoints/test_handler_factory.py#L35-L62
    why: LiteLLM's own test for the declared query params that reach the list call.
dod:
  - text: >-
      The five entries are registered once each at the /v1 prefix and the bare path with their catalog methods, the other methods on those paths answer 405, and a request without a valid key gets 401 from B756 with no provider request, on all ten paths.
    proof: [route-aliases, auth-failures, oracle]
  - text: >-
      handler_kind picks Binary, Multipart, ContainerId, ContainerFile and NoParams in that order, so the content entry is Binary, upload is Multipart, list is ContainerId, retrieve and delete are ContainerFile, and a returns_binary entry with other path params is not Binary.
    proof: [handler-kind]
  - text: >-
      The JSON data map holds the full query map under "query_params", then only the declared query params that the request has, then the path params; a repeated query key keeps its last value and an undeclared name reaches data only inside "query_params".
    proof: [json-data, oracle]
  - text: >-
      The JSON processor checks ownership before processing with the picked provider, overwrites data with the forwarding result, sets custom_llm_provider itself when there is no container_id, passes no model, and returns the processing result unchanged; ownership failures are 403 {"detail": "Forbidden"} and skip exception handling.
    proof: [json-access, error-bodies, oracle]
  - text: >-
      The content route answers 200 with the bytes, the headers B004 set and a content type from the file id, with "; charset=utf-8" appended to text/* types only.
    proof: [binary-response, oracle]
  - text: >-
      The upload route passes the entry's async_name as the route type, answers 400 {"detail": "Missing required 'file' field"} with no file part, and lets the container_id and custom_llm_provider values from the path and the checks win over form fields of the same name.
    proof: [upload-response, error-bodies, oracle]
  - text: "A non-owner key gets 403 with the body {\"detail\": \"Forbidden\"} on every container file route with zero provider requests."
    proof: [json-access, error-bodies, oracle]
  - text: The branch adds HTTP oracle cases for the container file routes.
    proof: [new-cases, oracle]
checks:
  optional: []
  commands:
    - id: route-aliases
      why: one of the ten paths is missing, registered twice, or answers the wrong method
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::route_aliases($|::)/)'
    - id: handler-kind
      why: the handler choice order differs from binary, multipart, container_id, container_id and file_id, none
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::handler_kind($|::)/)'
    - id: json-data
      why: the query map, declared query params or path params are put into data in the wrong way
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::json_data($|::)/)'
    - id: json-access
      why: the ownership check is missing, runs after processing, or the forwarding result does not overwrite data
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::json_access($|::)/)'
    - id: binary-response
      why: the content response has the wrong status, headers or content type
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::binary_response($|::)/)'
    - id: upload-response
      why: the upload route type, the missing file answer or the form field overwrite is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::upload_response($|::)/)'
    - id: error-bodies
      why: a 403 or 400 is shaped as an OpenAI error object or goes through exception handling
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::error_bodies($|::)/)'
    - id: auth-failures
      why: a route is reachable without a valid key or reaches the provider first
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::container_file_routes::tests::auth_failures($|::)/)'
    - id: new-cases
      why: the branch adds no HTTP oracle cases for the container file routes
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/container-file-routes)"
oracle_cases:
  - tools/oracle/cases/api/container-file-routes/container-file-json-routes.yaml
  - tools/oracle/cases/api/container-file-routes/container-file-content.yaml
  - tools/oracle/cases/api/container-file-routes/container-file-forbidden.yaml
  - tools/oracle/cases/api/container-file-routes/container-file-upload.yaml
  - tools/oracle/cases/api/container-file-routes/container-file-upload-errors.yaml
  - tools/oracle/cases/api/container-file-routes/container-file-form-overwrite.yaml
  - tools/oracle/cases/api/container-file-routes/container-file-auth.yaml
deviations:
  - what: The catalog is read from B3360's embedded copy of endpoints.json, not from a file path at startup.
    why: LiteLLM opens containers/endpoints.json relative to its source tree; a compiled gateway has no source tree, and the embedded copy is the pinned file byte for byte.
  - what: The authenticated caller is read once per request.
    why: LiteLLM lists user_api_key_auth as a route dependency and as a handler parameter, and FastAPI runs it once for both; the client sees the same 401.
out_of_scope:
  - "get_all_route_types (handler_factory.py L37-L40): no caller at the pin (grep finds only its definition). Route type names reach B7430 as ContainerRouteType and the catalog's async_names."
  - "_load_endpoints_config (L30-L34): replaced by B3360's embedded catalog, see deviations; no separate function is built."
  - "_get_container_provider_config (L43-L53): no caller at the pin (grep finds only its definition). Provider config lookup is B3361's."
  - "_process_binary_request and _process_multipart_upload_request (L164-L357) and `pick_provider`: B3371. The ownership service and its 403: B3362. Request form reading: B1101. The header and query provider accessors: B2400."
  - "ProxyBaseLLMRequestProcessing.base_process_llm_request and _handle_llm_api_exception: B004. Authentication: B756 and B732."
  - "The core dispatch that maps the container route types (aupload_container_file, aretrieve_container_file_content and the others) to B3368's acontainer_file_call, the router wrappers and route_llm_request's container branch: B7430."
  - "The generated container file operations that the route type finally reaches: B3368. Container create, list, retrieve and delete routes in proxy/container_endpoints/endpoints.py: B7326."
pitfalls:
  - "The JSON data map nests every query parameter under \"query_params\" and also spreads the declared ones, so list gets limit=\"1\" as a string next to query_params {\"limit\": \"1\"}; retrieve and delete declare none and get only the nested map."
  - "Binary is checked before Multipart and needs path params exactly [container_id, file_id] in that order; a returns_binary entry with other params falls to the later shapes."
  - "The ownership check and forwarding lookup run before the try block in all three processors, so a 403 is a plain {\"detail\": \"Forbidden\"} body and never an OpenAI error object."
  - "The multipart missing-file answer is HTTP 400 with {\"detail\": \"Missing required 'file' field\"} and comes before the ownership check, so a non-owner uploading with no file gets 400, not 403."
  - "Starlette adds \"; charset=utf-8\" to every text/* media type it is given, so .csv and .txt content comes back as \"text/csv; charset=utf-8\" and \"text/plain; charset=utf-8\" while image/png and application/json stay bare."
  - "The no-container_id branch of the JSON processor (data[\"custom_llm_provider\"] set to the pick) is unreachable with the five catalog entries; the forwarding update replaces the provider in every real route."
  - "Forwarding params overwrite container_id and custom_llm_provider from the form or query, so a client cannot choose the provider by a form field named custom_llm_provider; other form fields such as purpose still reach the call."
  - "The content route has no response class, so its error bodies are the same {\"detail\": ...} or B004 envelopes as the other routes, while the JSON routes declare ORJSON for success only."
  - "The 403 oracle case needs a container the owner key made; B7326 builds POST /v1/containers, so until it merges the fixture seeds the ownership row that B3362 reads."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
