id: B4787
title: Scope agent daily activity to the caller's grants
description: >-
  Build module agent_daily_activity in crates/betterlite-server and register GET /agent/daily/activity (LiteLLM's get_agent_daily_activity, tag "Agent Management", response SpendAnalyticsPaginatedResponse). The route decides which agents a caller may read daily spend for, then hands the result to B3091's get_daily_activity. B3095 also calls the scope resolver for the shared /agent/daily/activity/aggregated, /search, /keys, /model_top_keys and /export routes, so the resolver must work without the plain route.

  The resolver. `AgentActivityResolver<A: AgentGrants, R: AgentRows, F: AgentsFeatureGate>` is built once with a struct literal holding `grants: A`, `rows: R` and `features: F` (agent_daily_activity/scope.rs, native async fn, no trait objects, no statics). The database handle lives inside `rows`, so callers do not pass one. All three ports are traits defined in agent_daily_activity/ports.rs:
  - `AgentGrants`: `async fn agent_access(&self, auth: &UserApiKeyAuth) -> Result<AgentAccess, AgentAccessError>`. This is LiteLLM's `AgentRequestHandler.resolve_agent_access(user_api_key_auth=...)` with strict false. Implement the trait in the same file for B4780's `AgentAccessResolver<G, T, H>` by calling its `resolve_agent_access(Some(auth), false)`, so the server passes the real resolver and tests pass a fake. `AgentAccess` is B4778's enum (Unrestricted, or Restricted(BTreeSet<String>) where an empty set denies every agent). Do not rebuild any grant check.
  - `AgentRows` (reads of the litellm_agentstable rows, B726's agents binding and B700's find_many_in behind it): `async fn all_agents(&self) -> Result<Vec<AgentRow>, StoreError>` (find_many with an empty filter), `async fn agents_created_by(&self, user_id: &str) -> Result<Vec<AgentRow>, StoreError>` (find_many where created_by equals user_id) and `async fn agents_with_ids(&self, agent_ids: &[String]) -> Result<Vec<AgentRow>, StoreError>` (B700's find_many_in on agent_id; it removes duplicate ids in first-seen order and runs no SQL for an empty list). `AgentRow { agent_id: String, agent_name: String }` is the only part of a row this module reads. StoreError is the error type B700 returns; take its exact name from B700's module.
  - `AgentsFeatureGate`: `async fn check_agents(&self, auth: &UserApiKeyAuth) -> Result<(), FeatureAccessError>` is B864's check_feature_access_for_user(auth, "agents"). The production implementation forwards to B864; if B864 takes B732's AuthContext, convert inside the implementation, not in the resolver. FeatureAccessError is B864's error (HTTP 403 with detail.error "Access to agents is disabled for your role. Contact your proxy admin.").

  `AgentActivityError` (agent_daily_activity/error.rs) has one `#[from]` variant per source: `Feature(FeatureAccessError)`, `Access(AgentAccessError)` and `Store(StoreError)`. Each keeps its own status and body; nothing is translated. `AgentActivityScope { agent_ids: Option<Vec<String>>, agent_metadata: BTreeMap<String, AgentMetadata> }` with `AgentMetadata { agent_name: String }` serializing as `{"agent_name": ...}`. Some(empty) and None are different: Some(empty) means "no agents", None means "every agent".

  `resolve_scope(&self, agent_ids: Option<Vec<String>>, auth: &UserApiKeyAuth) -> Result<AgentActivityScope, AgentActivityError>` is LiteLLM's resolve_agent_daily_activity_scope (endpoints.py L353-L375), with the helpers _owned_agent_ids, _permitted_daily_activity_agent_ids and _resolve_daily_activity_agent_ids (L316-L350). Steps in order:
  1. features.check_agents(auth). A failure returns at once, before any read.
  2. If B2314's user_api_key_has_admin_view(auth) is true (proxy_admin and proxy_admin_viewer only), resolved = agent_ids unchanged. No grant lookup happens and unknown ids stay in the list.
  3. Otherwise access = grants.agent_access(auth). Unrestricted: permitted = the agent_id of every row from agents_created_by(user_id), or the empty set when auth has no user_id (no read then). Restricted(ids): permitted = ids (raw ids, no stable id mapping, no ownership union).
  4. Then resolved = requested ids kept only when in permitted, in the order requested with repeats kept, when agent_ids is Some and not empty. For None or an empty list, resolved = every permitted id in ascending string order (see deviations).
  5. Rows: when resolved is None, all_agents(); otherwise agents_with_ids(resolved). agent_metadata maps each row's agent_id to its agent_name. A resolved id with no row gets no entry and stays in agent_ids.
  Errors from the ports propagate in the order above; nothing is caught.

  The request. `parse_agent_query` in agent_daily_activity/request.rs turns the raw query values into `AgentActivityQuery { agent_ids: Option<Vec<String>>, exclude_agent_ids: Option<Vec<String>>, start_date, end_date, model, api_key: Option<String>, page: i64, page_size: i64 }`. A non-empty `agent_ids` or `exclude_agent_ids` string splits on "," with no trimming and no deduplication ("a,,b" gives "a", "", "b"); an empty or missing string gives None. page defaults to 1 and page_size to 10, with no bounds. Query decoding errors (a non-integer page) come from B003's shared decoder, not from this module.

  The handler `get_agent_daily_activity(query, auth)` in agent_daily_activity/request.rs runs, in this order: features.check_agents(auth); then, when the server has no database, HTTP 500 with detail `{"error": <CommonProxyErrors.db_not_connected_error text>}` (the text "DB not connected. This endpoint needs a database; set DATABASE_URL to a PostgreSQL connection string (postgresql://...) to enable it. See https://docs.litellm.ai/docs/proxy/virtual_keys"); then resolve_scope (which checks the feature gate a second time, as LiteLLM does); then, when agent_ids is Some(empty), the empty response below without calling B3091; otherwise B3091's get_daily_activity with table_name litellm_dailyagentspend, entity_id_field agent_id, entity_id = agent_ids (None or the list), entity metadata = agent_metadata, exclude_entity_ids = exclude_agent_ids, and start_date, end_date, model, api_key, page, page_size as given. Take the exact Rust signature from B3091's module and map AgentMetadata into the metadata type it expects. The route has no try/except and no management wrapper, so every error passes to B003's envelopes untouched.

  The empty response is SpendAnalyticsPaginatedResponse (B3090) with results [] and a DailySpendMetadata that has every field at its default except page = the requested page, total_pages = 0 and has_more = false (so total_spend 0.0, all totals 0, api_key_limit, total_api_keys and entity_total_api_keys null, and total_pages 0 where the default is 1).

  `routes/agent_daily_activity.rs` exports `routes(state: &Arc<ServerState>) -> Router` like a B1100 stub, but no B1100 entry merges it: B8661 merges it in app/spend.rs. Fill only that file (it only calls the handler) and leave routes.rs and state.rs alone. Register GET /agent/daily/activity exactly once with B052 authentication.

  Oracle. B8661 mounts the route, so it owns the HTTP cases in tools/oracle/cases/agent-activity/ and proves the route over HTTP with the Postgres fixtures B860 provides. Here the tests drive the handler with tower's oneshot over the module's own Router and fake ports. Do not add a helper operation: every function here reaches the route.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/agent_daily_activity.rs
    - crates/betterlite-server/src/agent_daily_activity/**
    - crates/betterlite-server/src/routes/agent_daily_activity.rs
    - crates/betterlite-server/src/routes/agent_daily_activity/**
    - tools/oracle/helpers/b4787.py
    - tools/oracle/helpers/b4787/**
    - tools/oracle/src/helpers/server/b4787.rs
    - tools/oracle/src/helpers/server/b4787/**
  lint_tables: false
