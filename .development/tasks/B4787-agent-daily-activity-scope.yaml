dod:
  - text: resolve_scope runs the "agents" feature gate before anything else and returns its error without any read.
    proof: [scope-tests]
  - text: For a proxy_admin or proxy_admin_viewer caller, resolve_scope returns the requested ids unchanged (None stays None, unknown ids stay) and does not ask for grants.
    proof: [scope-tests]
  - text: For another caller with Unrestricted access, the permitted ids are the agents whose created_by is the caller's user_id, and a caller without a user_id gets none and triggers no read.
    proof: [scope-tests]
  - text: For another caller with Restricted access, the permitted ids are the granted ids as they are, and Restricted(empty) permits nothing.
    proof: [scope-tests]
  - text: Requested ids are kept only when permitted, in request order with repeats; a missing or empty request gives every permitted id in ascending order.
    proof: [scope-tests]
  - text: Metadata comes from all_agents when the scope is None and from agents_with_ids otherwise, maps agent_id to agent_name, skips ids with no row and runs no read for Some(empty).
    proof: [scope-tests]
  - text: Errors from the feature gate, the grant lookup and the row reads pass through with their own status and body.
    proof: [scope-tests]
  - text: parse_agent_query splits non-empty agent_ids and exclude_agent_ids on commas without trimming or deduplication, gives None for empty or missing strings, and defaults page to 1 and page_size to 10.
    proof: [request-tests]
  - text: The handler checks the feature gate, then the database (500 with detail.error set to the db_not_connected_error text), then resolves the scope, and checks the gate before the database check.
    proof: [request-tests]
  - text: An empty resolved scope returns the empty SpendAnalyticsPaginatedResponse (page as requested, total_pages 0, has_more false, all totals zero) without calling get_daily_activity.
    proof: [request-tests]
  - text: A non-empty or unrestricted scope calls get_daily_activity with table litellm_dailyagentspend, entity field agent_id, the scoped ids (None or the list), the metadata, the exclusions and every date, model, key and page argument.
    proof: [request-tests]
  - text: The handler answers GET /agent/daily/activity through tower's oneshot over the module's own Router with fake ports; B8661 merges the route behind B052 authentication and proves it over HTTP.
    proof: [request-tests]
checks:
  optional: []
  commands:
    - id: scope-tests
      why: the scope resolver differs from LiteLLM in gate order, admin bypass, ownership, restricted ids, filtering or metadata
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_daily_activity::scope::/)'
    - id: request-tests
      why: query parsing, check order, the empty response or the get_daily_activity arguments differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_daily_activity::request::/)'
oracle_cases: []
deviations:
  - what: resolve_agent_daily_activity_scope is named resolve_scope on AgentActivityResolver, and it takes no database argument.
    why: A name over 30 characters is refused by the lint rule, and betterlite passes the database to a dependency through its constructor.
  - what: The AgentRequestHandler call, the agents table reads and the feature gate are three port traits passed to the resolver's constructor.
    why: betterlite wires dependencies through constructors and has no module globals such as prisma_client and general_settings. The calls and their order are the same.
  - what: For a non-admin caller with no (or an empty) requested list, the permitted ids are sorted ascending. LiteLLM turns a frozenset into a tuple in hash order.
    why: A set has no defined order and the daily rows are ordered by date, so only the order of the SQL parameter list differs.
  - what: Errors are the typed AgentActivityError, not HTTPException values.
    why: betterlite errors are typed, and B003 turns each variant's status and body into the response LiteLLM sends.
out_of_scope:
  - "B4780 owns AgentAccessResolver and resolve_agent_access, and B4778 owns AgentAccess; this task only calls them."
  - "B864 owns check_feature_access_for_user, B2314 owns user_api_key_has_admin_view, B700 owns find_many_in and B726 owns the agents table binding."
  - "B3091 owns get_daily_activity and B3090 owns the response types; this task calls them and builds one empty response."
  - "B3095 owns the /agent entity resolver constant and the dispatch for /agent/daily/activity/aggregated, /search, /keys, /model_top_keys and /export, and B3096 to B3098 own those routes."
  - "The other routes in endpoints.py belong to B4781, B4783, B4784, B4785 and B4786."
pitfalls:
  - A non-admin caller with Unrestricted access gets only the agents they created (created_by), not every agent; Restricted ids are not unioned with owned agents.
  - Granted ids are used as raw ids and never mapped through the registry's stable_agent_id, unlike accessible_agents in B4780.
  - agent_ids is truthy-tested, so an empty list behaves like None for a non-admin caller (all permitted agents) but an admin passes it through unchanged.
  - Some(empty) and None are different scopes; collapsing Some(empty) into None would return every agent's spend.
  - A request for "," splits into two empty strings, so it is a non-empty list that matches nothing and gives the empty response, not all agents.
  - The route checks the feature gate before the database check, and the resolver checks it again; a disabled gate gives 403 even when there is no database.
  - The empty response sets total_pages to 0 where DailySpendMetadata defaults to 1, and the metadata keeps page as requested.
  - The route has no except block, so database and activity errors are not turned into 500 "Error ..." text.
  - Unknown requested ids stay in an admin's scope and in the get_daily_activity call; only the metadata lacks them.
  - Names stay at 30 characters or fewer, so the LiteLLM name resolve_agent_daily_activity_scope cannot be used.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
