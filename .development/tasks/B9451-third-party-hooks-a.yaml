dod:
  - text: AIM skips non-conversational calls unless inspect_embeddings is set, keeps moderation read-only and checks every output choice, rejecting with content_policy_violation or writing the redacted text.
    proof: [hook-tests, helper-python, oracle]
  - text: Akto checks requests and blocks with 403 and a background ingest, sends responses in the background only, and skips an input type its mode does not handle.
    proof: [hook-tests, helper-python, oracle]
  - text: Building a Conduct guardrail fails with LiteLLM's missing-package text.
    proof: [hook-tests, oracle]
  - text: The legacy Lakera hooks honor moderation_check without an event_hook and the gate with one, and the check builds LiteLLM's v1 body from enabled roles, function input and input texts.
    proof: [hook-tests, helper-python, oracle]
  - text: Lasso's hooks pick classify or classifix, write masked text back, scan model output with COMPLETION and map transport errors like LiteLLM.
    proof: [hook-tests, helper-python, oracle]
checks:
  optional: [mutants]
  commands:
    - id: hook-tests
      why: a hook body is missing or takes a different branch than LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^third_party_hooks_a::/)'
    - id: helper-python
      why: the oracle adapter for the hook cases is missing or fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- 'tools/oracle/helpers/b9451*')" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/guardrails/third-party-hooks-a/aim-embeddings-skipped.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/aim-embeddings-inspected.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/aim-moderation-keeps-data.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/aim-output-blocked.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/aim-output-redacted.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/akto-request-allowed.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/akto-request-blocked.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/akto-response-background.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/akto-mode-mismatch.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/akto-unreachable.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/conduct-missing-package.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/lakera-in-parallel-pre-call-skips.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/lakera-role-order.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/lakera-system-function-input.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/lakera-enabled-roles.yaml
