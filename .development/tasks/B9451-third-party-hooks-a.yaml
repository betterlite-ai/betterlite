  - tools/oracle/cases/guardrails/third-party-hooks-a/lasso-output-masked.yaml
  - tools/oracle/cases/guardrails/third-party-hooks-a/lasso-api-timeout.yaml
deviations:
  - what: Lasso's moderation hook runs with the shared conversation cache when the during-call dispatch reaches it.
    why: LiteLLM's dispatch calls async_moderation_hook without the cache argument Lasso's signature requires, so every during_call Lasso request fails with a TypeError (500). This follows the hook's intent; the choice is the owner's to confirm.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L206-L232
  - what: The legacy Lakera check merges dynamic request body params into the messages body, as it does for the input body.
    why: LiteLLM passes them to json.dumps as keyword arguments on the messages path, so any extra_body for this guardrail fails the request with a TypeError (500). This follows the input path; the choice is the owner's to confirm.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lakera_ai.py#L208-L212
  - what: A Conduct guardrail never builds.
    why: LiteLLM's working class extends ConductGuard from the separate conduct-litellm-guard package, and LiteLLM doesn't ship it; without it LiteLLM's constructor raises the same message.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/conduct/conduct.py#L104-L119
out_of_scope:
  - "AIM's transport, redaction, streaming hook and config model: B3750. Akto's payload, send, unreachable and config helpers: B3751. Conduct's request_payload, decision_status, record_decision, apply_conduct_guardrail and binds_unreachable_fallback: B3752. Lakera v1's constructor and initializer: B3777; _check_response_flagged: B3755. Lasso's constructor, transport and response checks: B3778; masking expansion and write-back: B3779."
  - "lakera_ai_v2.py: B3779 and B8522."
  - "Building each class from its spec and forwarding ProxyLogging's hooks to these functions: B8666. The litellm_settings.callbacks binding of lakera_prompt_injection: B107."
  - "The CustomGuardrail gate, dynamic body params and non-conversational call types: B3665. should_proceed_based_on_metadata: B3663. The log_guardrail_information records: B3664."
pitfalls:
  - "AIM's moderation hook returns the data it got even when Aim anonymized it, so only pre_call can rewrite the request."
  - "Akto compares str(event_hook) with \"pre_call\" and \"post_call\"; a list mode never matches, so both input types run for it."
  - "Legacy Lakera without an event_hook defaults to moderation_check in_parallel, so its pre_call does nothing and only the moderation hook calls Lakera."
  - "When add_function_to_prompt is true the system message is dropped from the Lakera input entirely, not sent without the suffix."
  - "Lakera's enabled roles come from the legacy guardrail named prompt_injection, not from the lakera_prompt_injection callback name."
  - "Lasso's post-call masking always calls /classifix, while the pre-call path falls back to /classify for non-string content."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
