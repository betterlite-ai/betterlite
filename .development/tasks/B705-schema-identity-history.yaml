dod:
  - text: 'pinned_sql_checksums verifies all 25 original byte sequences; cohort_catalog_facts uses named
      rstest cases deleted_history_defaults, skills_storage, mcp_metadata_defaults, router_settings_defaults,
      team_guardrail_defaults, team_soft_budget_nullable, daily_endpoint_indexes, lower_email_expression,
      policy_storage, vector_store_ownership, managed_vector_store_catalog, deprecated_token_catalog,
      key_lookup_indexes, access_group_history, guardrail_owner, end_user_permission_fk and key_history_additions.'
    proof:
      - behavior-tests
  - text: 'postgres_pinned_rows compares catalog snapshots with independently applied upstream SQL;
      cohort_preserves_rows verifies the access_model_ids loss, empty access_model_names, other surviving
      data, inserted defaults, endpoint-aware uniqueness and both foreign-key actions. Reapplying these
      guarded DDL statements succeeds without changing their schema facts.'
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_identity_history::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: SQL catalog, default and destructive-ALTER assertions are absent or differ from Postgres.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/schema_identity_history::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/schema_identity_history::tests::cohort_preserves_rows$/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B873 deploys the catalog and owns ledger updates; B716 handles recovery and B717 classifies historical migrations.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 20260108_add_user_email_lower_idx has eight timestamp digits, so B716's fourteen-digit parser returns
    zero; do not rename it to make chronological parsing succeed.
  - ManagedVectorStoresTable and ManagedVectorStoreTable are distinct tables in this cohort.
  - The end-user foreign-key guard checks conname without a namespace filter, so independent fixtures
    must not accidentally suppress the constraint by sharing another schema's same-named constraint.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: standard
