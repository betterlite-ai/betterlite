id: B333
title: JEV classifier transport and attribution
description: 'Add the JEV classifier adapter through B099 Decisions dispatch or a configured B009 HTTP
  endpoint, using typed request/response models and B012 attribution. Reuse B331 classifier outcomes and
  timeout recovery. Preserve config-only URL/key sourcing and SecretString boundaries; B358 owns offline
  heuristic_v2 prediction. Configuration boundary keys introduced or consumed here: jev_classifier_config,
  TYPESAFE_API_KEY, TYPESAFE_API_BASE. Pinned declaration defaults: jev_classifier_config=None. Resolve
  env values once in betterlite-config, never in router code. jev_classifier_config.model defaults to
  jev-latest, timeout_ms=3000, circuit_breaker_enabled=true and circuit_breaker_cooldown_seconds=30.0.
  Direct API configuration falls back to TYPESAFE_API_KEY and TYPESAFE_API_BASE (then https://api.typesafe.ai);
  an explicit new base requires an explicit key. Implement the owned native service in crates/betterlite-router/src/jev_classifier.rs.
  Add ProbeOperation::JevClassifier in tools/oracle/src/router_probes/mod.rs and the corresponding B333 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/jev_classifier.py:
  JevClassifierClient.evaluate (L79-L84), _DecisionsRouter.adecisions (L88-L102), RouterJevClassifierClient.__init__
  (L109-L111), RouterJevClassifierClient.evaluate (L113-L152), HttpJevClassifierClient.__init__ (L156-L159),
  HttpJevClassifierClient.evaluate (L161-L184), HttpJevClassifierClient._log_response (L187-L258), build_jev_request
  (L278-L287), jev_classifier_cost (L290-L304). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Bound the jev_verdict outside-byte parser to 1048576 bytes before decoding; on excess use its typed
  invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback path).'
