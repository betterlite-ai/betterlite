deviations:
- what: The jev_verdict byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/jev_classifier.py#L109-L304
out_of_scope:
- Offline artifact prediction, which belongs to B358.
- Retraining the classifier or running an online judge service.
pitfalls:
- This task waits for B099 so it does not invent the Decisions wire API.
- An upstream classifier URL and secret come only from validated operator configuration.
- JEV output must remain untrusted bytes until the typed parser validates it.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
