id: B333
title: JEV classifier transport and attribution
description: Add the JEV classifier adapter through B099 Decisions dispatch or a configured B009 HTTP
  endpoint, using typed request/response models and B012 attribution. Reuse B331 classifier outcomes and
  timeout recovery. Preserve config-only URL/key sourcing and SecretString boundaries; B358 owns offline
  heuristic_v2 prediction. Use the existing Rust crate boundaries from B004 and B008; integrate through
  the server when the provider dispatcher or callbacks live in another core crate. This task's source
  slices are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the
  matching adapters to B301's component runner where state is not observable over HTTP; adapters call
  production logic and never reproduce it. Use deterministic candidate sets or supplied random samples
  for comparisons, and separate seeded distribution tests for random choices. Extend the existing config_yaml
  fuzz target and committed corpus for every newly accepted config form; unsupported keys still fail by
  full path. Add a cargo-fuzz target jev_verdict under crates/betterlite-router/fuzz and a normal replays_the_jev_verdict_corpus
  test using the production parser. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/jev-classifier/**
  - tools/oracle/src/router_probes/jev_classifier/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/jev_classifier.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/jev_classifier.py#L109-L304
  why: Router/direct JEV transport and cost.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2159-L2252
  why: JEV verdict outcome.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the jev_classifier prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(jev_classifier)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/jev_verdict.rs && test -n "$(ls -A crates/betterlite-router/fuzz/corpus/jev_verdict)"
      && cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_jev_verdict_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/jev-classifier/jev-direct-versus-deployment.yaml
- tools/oracle/cases/routing/jev-classifier/jev-timeout-fallback.yaml
- tools/oracle/cases/routing/jev-classifier/jev-key-not-forwarded-to-other-base.yaml
- tools/oracle/cases/routing/jev-classifier/malformed-verdict-fallback.yaml
- tools/oracle/cases/routing/jev-classifier/negative-and-nonfinite-cost.yaml
- tools/oracle/cases/routing/jev-classifier/model-and-cost-attribution.yaml
- tools/oracle/cases/routing/jev-classifier/cancelled-call-no-late-update.yaml
deviations: []
out_of_scope:
- Offline artifact prediction, which belongs to B358.
- Retraining the classifier or running an online judge service.
pitfalls:
- This task waits for B099 so it does not invent the Decisions wire API.
- An upstream classifier URL and secret come only from validated operator configuration.
- JEV output must remain untrusted bytes until the typed parser validates it.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
