id: B2227
title: Shared streamed-response assembly
description: >-
  Own the shared main.py stream-to-response assembly orchestration below passthrough collectors and callback consumers.
  Reuse B2232/B2233/B2234/B2235 ChunkProcessor for sorting, base response, content/tool/thinking/audio joins and
  usage estimation; this task owns choosing those operations and merging their results. Reuse B068 cost calculators
  and B068 logging cost projection without moving transport or SSE decoding into the assembler.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/main.py: stream_chunk_builder_text_completion
  L8856-L8907; _reported_cost_is_priced_by_calculator L8913-L8917; _stream_builder_response_cost L8920-L8932; _joined_streamed_citations
  L8935-L8938; _stream_builder_model_map_cost L8941-L8950; _set_stream_builder_response_cost L8953-L8958; _stamp_streaming_usage_cost
  L8961-L8968; _stream_choice_delta L8983-L8989; _delta_carries_more_than_text L8992-L8993; _simple_text_part L8996-L9001;
  stream_chunk_builder L9004-L9271.


  Named case contracts: empty_and_error_boundary: None chunks raises APIError 500, provider/model empty, source
  message Error building chunks for logging/streaming usage calculation. Empty input or empty B005 normalized chunks
  returns None. Any error in chat assembly, delegated text assembly, token estimation or metadata/cost application
  logs litellm.main.py::stream_chunk_builder() - Exception occurred - {error} with exception context and becomes
  that same APIError 500 through B184. start_time/end_time are accepted but unused. text_completion_assembly: After
  B005 normalization, the first chunk with choices selects the text branch only when its first choice is TextChoices.
  Use id/object/created/model and optional system_fingerprint from the first chunk, finish_reason/logprobs from
  the last first choice. Join all non-None choice.text values across all chunks/choices that expose the text attribute;
  emit one choice index=0. Prompt token-counter failure logs token_counter failed, assuming prompt tokens is 0 and
  uses zero; completion count errors escape to the outer builder boundary. Compute total as prompt+completion via
  B196. simple_text_path: Choice deltas may be mappings or Pydantic records; unsupported shapes become {}. Any non-None
  tool_calls/function_call/reasoning_content/thinking_blocks/annotations/audio/images/provider_specific_fields in
  any choice disables the fast path, including empty lists/maps. Otherwise use the first delta content when string,
  else empty string; skip chunks with no choices, join nonempty parts and leave the base response content unchanged
  when no parts exist. Use reasoning_tokens=0 in B005 usage calculation. complex_content_order: For a non-simple
  stream collect tool-call chunks when any choice has non-None tool_calls, then function_call from the first choice;
  either sets content=None and delegates its join to B005. Later non-None content chunks overwrite that None via
  B005 combined content. Independently join thinking_blocks, reasoning_content and audio. Annotations and images
  concatenate every first-choice list in stream order; do not deduplicate or keep only the last one. provider_fields_citations:
  Consider first-choice provider_specific_fields values that are dicts. Collect non-None citation values; if all
  are lists, generated citations is the list of those lists, otherwise it is one outer list containing all collected
  values. Merge generated citations then the original maps in stream order, skipping singular citation keys. Later
  fields overwrite earlier ones, including an explicit citations value overriding the generated value. Assign only
  a truthy combined map. usage_hidden_metadata: Compute completion content through B218 get_content_from_model_response
  and reasoning tokens through B005 on the complex path, then calculate and assign usage with messages/model/count_prompt_tokens
  callback. In reverse chunk order, take the first hidden-params dict containing provider_specific_fields, update
  the response hidden map and stop, even if that chosen map is empty. Finally stamp usage cost, set hidden response_cost,
  then apply B005 provider-assembled streaming metadata in that order. reported_cost_precedence: A numeric usage.cost
  (including Python bool) becomes hidden response_cost via float conversion unless logging says provider xai. With
  logging present and no eligible reported cost return None rather than calling completion_cost here. Without logging
  call B068 completion_cost using hidden custom_llm_provider; any failure falls back to cost_per_token only when
  response.model is truthy and usage is Usage, summing prompt+completion prices, and catches that failure to None.
  Preserve existing hidden response_cost when the computed result is None. usage_cost_stamping: With no logging
  do nothing. Any existing numeric usage.cost, including zero/negative/bool, prevents recomputation. Otherwise call
  the B190 logging response-cost calculator; stamp only a numeric value greater than zero. XAI is excluded only
  from direct reported-cost pricing, not from the existing-cost guard. Use exact Decimal for native monetary arithmetic
  under the existing project policy; preserve source branch decisions.


  Call B2232 for base metadata, B2233 for tools/functions, B2234 for text/thinking/audio and B2235 for usage. B005
  is a caller of this builder, never a prerequisite.


  Use B2239 for main/utils print_verbose at the owned call sites; these are verbose hooks, not pre_call/post_call.


  Implement crates/betterlite-streaming/src/streamed_response_assembly.rs with adjacent tests under streamed_response_assembly/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation streamed_response_assembly in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function streamed_response_assembly_cases in betterlite-streaming with these exact named cases (one
  per oracle file): empty_and_error_boundary, text_completion_assembly, simple_text_path, complex_content_order,
  provider_fields_citations, usage_hidden_metadata, reported_cost_precedence, usage_cost_stamping. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/streamed_response_assembly* using HelperCase:
  kind: helper and the externally tagged streamed_response_assembly variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_streamed_response_assembly that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 325 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 310 production lines, 285 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 755 planned, 775 maximum changed lines.
