  lint_tables: false
references:
- url: https://github.com/betterlite-ai/betterlite/blob/c281c850b6/crates/betterlite-core/src/api/interactions/lifecycle/tests/support.rs#L319-L360
  why: serve, serve_on and the polling accept that panicked under load; the other copies follow the same shape.
- url: https://github.com/betterlite-ai/betterlite/blob/c281c850b6/tools/oracle/src/helpers/core_ops/b3505.rs#L60-L86
  why: The oracle helper joins its fixture after every operation, including the one that never sends a request.
- url: https://github.com/betterlite-ai/betterlite/blob/c281c850b6/crates/betterlite-http/src/tls/tests/local_tls.rs#L72-L145
  why: thread::scope joins the origin and tunnel threads on unwind, so a blocking accept there needs spawned threads.
- url: https://github.com/betterlite-ai/betterlite/blob/c281c850b6/.config/nextest.toml#L4-L5
  why: The 10-minute limit that ends a hung test, and the 60 s slow-test period the read timeout matches.
- url: https://github.com/betterlite-ai/betterlite/blob/c281c850b6/tools/postgres-fixture/Cargo.toml
  why: The test-support crate the new one copies its manifest from, taken as a dev-dependency by crates and as a dependency by tools.
dod:
- text: >-
    A fixture whose client connects 6 s after serve still answers it, and nothing in tools/http-fixture polls the
    listener or reads a clock.
  proof: [late-client, clock-free]
- text: >-
    finish returns the request the client sent, and returns FixtureError::NoRequest at once for a fixture the client
    never reached.
  proof: [fixture-behavior]
- text: >-
    The copied servers, readers, reply builders and polling accepts are gone from the files the description lists,
    and tools/oracle/src/helpers/core_ops/b3505/server.rs is deleted.
  proof: [no-copies]
- text: >-
    betterlite-core's agent item, interactions get and lifecycle, and passthrough stream tests pass on the shared
    fixture.
  proof: [core-tests]
- text: >-
    delete_forwards_the_caller_timeout no longer bounds its call at 5 s.
  proof: [timeout-bound]
- text: >-
    betterlite-http's interactions, local TLS, health probe and OTLP client tests pass on the shared fixture, and
    local_tls starts its origin and tunnel on spawned threads instead of scoped ones.
  proof: [http-tests, local-tls-threads]
- text: >-
    The twelve agent item oracle cases answer as before, including item-unsupported-provider-error, which never
    reaches the fixture.
  proof: [oracle]
checks:
  optional: []
  commands:
  - id: late-client
    why: The shared fixture still gives up on a client that connects after the old 5 s deadline.
    run: >-
      cargo nextest run --locked -p betterlite-http-fixture --no-tests=fail
      -E 'test(/^server::tests::answers_a_client_that_connects_after_the_old_deadline$/)'
  - id: clock-free
    why: The shared fixture polls a nonblocking listener or measures elapsed time again.
    run: >-
      test -f tools/http-fixture/src/server.rs
      && ! grep -r -n -E 'Instant|elapsed\(|set_nonblocking|park_timeout|WouldBlock' tools/http-fixture/src
  - id: fixture-behavior
    why: finish hangs or loses the request, or the reader misreads the head or the body.
    run: >-
      cargo nextest run --locked -p betterlite-http-fixture --no-tests=fail
      -E 'test(/^(server|request)::tests::/) - test(/^server::tests::answers_a_client_that_connects_after_the_old_deadline$/)'
  - id: no-copies
    why: A copy of the server, its reader, its reply builder or its polling accept is still in a caller.
    run: >-
      test ! -e tools/oracle/src/helpers/core_ops/b3505/server.rs
      && ! git grep -n -E 'never connected to the fixture|client did not connect|client did not reach its configured destination|fn (accept|connected|read_head|read_request|content_length|reply|http_reply|serve_on|serve_once|serve_post|serve_with_body)\('
      -- crates/betterlite-core/src/api/agents/item crates/betterlite-core/src/api/interactions/get
      crates/betterlite-core/src/api/interactions/lifecycle crates/betterlite-core/src/passthrough_stream
      crates/betterlite-http/src/interactions crates/betterlite-http/src/tls/tests crates/betterlite-http/src/health_probe
      crates/betterlite-http/src/otlp_client tools/oracle/src/helpers/core_ops/b3505.rs
  - id: core-tests
    why: A betterlite-core caller broke on the shared fixture.
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail
      -E 'test(/^api::agents::item::agent_item_calls::/) | test(/^api::interactions::(get|lifecycle)::tests::/) | test(/^passthrough_stream::/)'
  - id: timeout-bound
    why: delete_forwards_the_caller_timeout still fails a call that a loaded machine makes slower than 5 s.
    run: "! grep -n -F 'Duration::from_secs(5)' crates/betterlite-core/src/api/agents/item/tests/agent_item_calls.rs"
  - id: http-tests
    why: A betterlite-http caller broke on the shared fixture.
    run: >-
      cargo nextest run --locked -p betterlite-http --no-tests=fail
      -E 'test(/^interactions::/) | test(/^tls::tests::local_tls::/) | test(/^health_probe::tests::/) | test(/^otlp_client::tests::/)'
  - id: local-tls-threads
    why: local_tls still runs its origin or tunnel inside thread::scope, which waits on a blocked accept when the test panics.
    run: "! grep -n -E 'scope[.]spawn[(]move [|][|] (serve|tunnel)[(]' crates/betterlite-http/src/tls/tests/local_tls.rs"
oracle_cases:
- tools/oracle/cases/agents/item-get-basic.yaml
- tools/oracle/cases/agents/item-get-with-name-metadata.yaml
- tools/oracle/cases/agents/item-delete-basic.yaml
- tools/oracle/cases/agents/item-delete-with-name-metadata.yaml
- tools/oracle/cases/agents/item-list-versions-basic.yaml
- tools/oracle/cases/agents/item-list-versions-with-pagination.yaml
- tools/oracle/cases/agents/item-provider-absent-defaults-gemini.yaml
- tools/oracle/cases/agents/item-unsupported-provider-error.yaml
- tools/oracle/cases/agents/item-http-error-wrapping.yaml
- tools/oracle/cases/agents/item-async-get-delegates-to-sync.yaml
- tools/oracle/cases/agents/item-async-delete-delegates-to-sync.yaml
- tools/oracle/cases/agents/item-async-list-versions-delegates-to-sync.yaml
deviations: []
out_of_scope:
- >-
  crates/betterlite-guardrails/src/straiker/delivery/payload_delivery/tests.rs. Its tokio accept runs under
  tokio::join! with the client, so its 10 s timer starts with the client after setup, and its comment says it keeps
  join! from waiting forever on a client that never connects.
- >-
  The other polling accepts with a deadline: crates/betterlite-guardrails/src/ibm_detector_client/client/tests.rs
  (TLS_TIMEOUT inside thread::scope), crates/betterlite-cli/src/cli/tests/support.rs and
  crates/betterlite-cli/src/commands/tests/support.rs (ACCEPT_DEADLINE, about 110 call sites).
- >-
  Tests that bind 127.0.0.1:0, drop the listener and expect the port to refuse (dead_address in the http support
  files, delete_reports_a_transport_failure_through_the_value_error_class, proxied_client_reports_a_failed_connection).
  Another test can bind that port in between, the race B9959 removed for server ports.
- >-
  Server pauses raced against short client timeouts, such as agents_create_read's 200 ms pause against a 20 ms
  timeout; thread::sleep only removes park_timeout's early wake.
- Client-side request timeouts, the protocols.rs exchange timeout and the tunnel's connect_timeout in local_tls.
- The TLS handshake loops in base support, local_tls.rs and ibm_detector_client, which stay where they are.
- Hand-written servers that run until a stop flag, such as agent_collection_calls support and the oracle runner mock.
pitfalls:
- The fixture crate's src is library code to clippy and the hooks, so no unwrap, expect, panic, indexing or one-line function there; only its tests.rs files unwrap.
- Give Serving no Drop and never finish from a Drop, so a test that panics before finish never blocks on a join.
- Keep the listener Arc in Serving until finish has joined; closing it first lets finish's connect reach a port another test bound since.
- finish reads the address from self.listener.local_addr(), which also keeps the listener field from being dead code.
- Keep "fixture" as the reason phrase in core and b3505 replies ("200 fixture"), so the tests and the oracle cases send the same bytes as before.
- protocols.rs imports TIMEOUT from local_tls.rs, so the constant stays there for the client timeouts.
- The sleep test is the only one that waits 6 s; every other test in the crate connects at once and asserts no timing.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 2
