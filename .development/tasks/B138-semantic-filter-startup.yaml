id: B138
title: Start the MCP semantic tool filter and make it a proxy callback
description: >-
  LiteLLM turns the MCP semantic tool filter on at startup. When litellm_settings.mcp_semantic_tool_filter is set and
  its enabled flag is true, ProxyStartupEvent._initialize_semantic_tool_filter builds a SemanticToolFilterHook through
  SemanticToolFilterHook.initialize_from_config and adds it to litellm.callbacks, where ProxyLogging runs its pre-call
  hook and its response header hook on every request. B4685 built the filter and B8201 the hook with its
  initialize_from_config. Nothing yet calls them at startup or puts the hook where the proxy runs callbacks: B8373 left
  _initialize_semantic_tool_filter without an owner. This task builds that startup step, the holder that stands in for
  the hook's place in litellm.callbacks, and the ProxyCallback type that lets ProxyLogging run the hook.


  Where the code goes. betterlite-server, the new module hooks::semantic_filter_proxy:
  crates/betterlite-server/src/hooks/semantic_filter_proxy.rs and its folder. The architect's skeleton creates the empty
  file and adds `pub mod semantic_filter_proxy;` to hooks.rs, so do not touch hooks.rs. Read
  crates/betterlite-server/src/hooks/mcp_semantic_filter.rs and its folder (B8201) and
  crates/betterlite-server/src/mcp/semantic_filter.rs (B4685) first, and use their types as they are: SemanticToolFilterHook,
  SemanticToolFilterConfig, initialize_from_config, the hook's pre-call method (the port of async_pre_call_hook) and its
  response header method (the port of async_post_call_response_headers_hook). Change none of their files. Request maps
  are `betterlite_openai::openai_base_config::Object`, the map ProxyCallback::pre_call receives.


  The holder. LiteLLM keeps the hook in the module list litellm.callbacks. betterlite has no module-level state, so
  `SemanticFilterSlot` holds `std::sync::RwLock<Option<Arc<SemanticToolFilterHook>>>` and is shared as one
  Arc<SemanticFilterSlot>. Never hold the lock across an await. Methods, each the Rust form of a
  LoggingCallbackManager call for this one class:
  - `new()` is empty.
  - `add(&self, hook: Arc<SemanticToolFilterHook>) -> bool` is add_litellm_callback. When a hook is already held, keep
  that first one, log at debug "Custom logger of type SemanticToolFilterHook already exists in callbacks, not adding
  again" and return false; otherwise store the hook and return true. LiteLLM skips the second one because every
  SemanticToolFilterHook gets the same _get_custom_logger_key (its class name plus the base CustomLogger flags, since
  the filter attribute is not a str, bool or int).
  - `remove_all(&self) -> bool` is remove_callbacks_by_type(litellm.callbacks, SemanticToolFilterHook): empty the slot
  and return whether a hook was there.
  - `current(&self) -> Option<Arc<SemanticToolFilterHook>>` is get_custom_loggers_for_type(SemanticToolFilterHook),
  which can hold at most one here.
  - `callback(&self) -> Option<Arc<dyn ProxyCallback>>` gives a SemanticFilterCallback over the held hook, or None
  while the slot is empty, so a proxy without the filter lists no extra callback.
  - The slot implements B8399's `ProxyCallbackSource`, answering with callback() as a list of at most one. B8610 holds
  the one Arc<SemanticFilterSlot> and passes it to ProxyLogging::add_proxy_callbacks, so ProxyLogging asks it every time
  it lists callbacks and a reload that empties or refills the slot shows at once.


  The proxy callback. `SemanticFilterCallback` holds an Arc<SemanticToolFilterHook> and implements B8390's
  ProxyCallback (crates/betterlite-server/src/guardrails/callback_caps/traits.rs). class_name is
  "SemanticToolFilterHook". overrides() sets request.pre_call, headers.response_headers and headers.accepts_call_info
  (LiteLLM's class defines async_pre_call_hook and async_post_call_response_headers_hook with the litellm_call_info
  parameter) and nothing else. is_base_logger, enforces_request_content and use_native_lifecycle_hooks are false, and
  guardrail() is None. pre_call calls the hook's pre-call method with the principal, the request map and the call type.
  When B8201's method edits the map in place, answer Ok(PreCallReturn::Unchanged); when it hands back a new map, answer
  Ok(PreCallReturn::Data(map)); when it gives nothing, answer Ok(PreCallReturn::Unchanged). The one error the hook lets
  out is the context window block (LiteLLM raises HTTPException(status_code=400, detail={"error": str(e)})); map it to
  ProxyHookError::Http with status 400 and the error's message as detail. response_headers calls the hook's header
  method with the request map and returns its headers (x-litellm-semantic-filter and x-litellm-semantic-filter-tools),
  or an empty map when it gives none. Every other ProxyCallback method keeps its default.


  The startup step. `initialize_semantic_tool_filter(settings: Option<&SemanticToolFilterConfig>, router, slot:
  &SemanticFilterSlot)` is _initialize_semantic_tool_filter, async, returning nothing. router is the Option of the router
  handle B8201's initialize_from_config takes; pass it through unchanged. In order:
  1. settings is None, or its enabled is absent or false: log at debug "Semantic tool filter not configured or not
  enabled, skipping initialization" and return. initialize_from_config is not called.
  2. Log at debug "Initializing semantic tool filter: llm_router={router.is_some()}, config=..." with the settings.
  3. Await initialize_from_config(settings, router). It already logs and swallows every failure (no router, a failed
  router build) and returns None for them.
  4. A hook came back: slot.add(hook) and log at debug "Semantic tool filter hook registered". None: log at warning
  "Semantic tool filter hook was configured but failed to initialize".
  LiteLLM wraps the call in the lifespan with a try that logs "Semantic filter init failed: %s" at error. Here the step
  cannot fail, so the step has no error type and the caller needs no such branch.


  The caller passes the typed litellm_settings.mcp_semantic_tool_filter block (B1663 parses it) converted into B8201's
  SemanticToolFilterConfig, with the router the proxy built. That call sits in the proxy lifespan (B8374) after the mock
  testing warning and before JWT setup, and ProxyLogging (B8399) lists slot.callback() after its registered callbacks.
  Neither is in this task's scope; the architect wires them.


  Oracle helper. The skeleton registers this task's helper operation b138 in the server group and adds its files to the
  scope. Input: litellm_settings (the mapping that would hold mcp_semantic_tool_filter) and router (bool). The Python
  adapter builds a Router with one embedding deployment (model_name "embed", litellm_params model
  openai/text-embedding-3-small, api_key "oracle-key") when router is true and None otherwise, removes every
  SemanticToolFilterHook from litellm.callbacks, awaits ProxyStartupEvent._initialize_semantic_tool_filter(llm_router=...,
  litellm_settings=...), reads litellm.logging_callback_manager.get_custom_loggers_for_type(SemanticToolFilterHook), removes
  them again and answers {"registered": n, "embedding_model", "top_k", "similarity_threshold"} from the first hook's
  filter (null when none). The MCP registry is empty in the helper process, so the filter's startup build returns at "MCP
  registry is empty" and no embedding call happens. The Rust adapter runs initialize_semantic_tool_filter against a fresh
  slot with an empty MCP registry and the same router choice, and answers the same fields from slot.current().


  Size. The owned LiteLLM spans are about 35 non-blank lines in proxy_server.py plus the three callback manager rules this
  class needs. Estimated 220 lines of Rust and 250 of tests, plus the adapters the skeleton adds. Nothing here parses
  outside bytes, so there is no fuzz target.
