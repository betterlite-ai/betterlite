dod:
  - text: initialize_semantic_tool_filter does nothing for an absent block, a block without enabled and enabled false, and calls initialize_from_config only when enabled is true.
    proof: [startup-step, oracle, helper-python, helper-case-corpus, new-oracle-cases]
  - text: A hook that comes back is added to the slot with LiteLLM's settings and defaults, and a None (for example with no router) leaves the slot empty and logs the warning.
    proof: [startup-step, oracle, helper-python, helper-case-corpus, new-oracle-cases]
  - text: SemanticFilterSlot keeps the first hook on a second add, empties on remove_all and reports whether it held one, and callback() is None while empty.
    proof: [slot]
  - text: SemanticFilterCallback reports class_name SemanticToolFilterHook with only pre_call, response_headers and accepts_call_info overridden, forwards pre_call and response_headers to the hook, and answers the context window block as ProxyHookError::Http with status 400.
    proof: [proxy-callback]
  - text: Every mutant in the module is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: startup-step
      why: the enabled gate, the call to initialize_from_config or the slot add after it is wrong or untested
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^hooks::semantic_filter_proxy::tests::startup_/)'
    - id: slot
      why: the slot's add, remove_all, current or callback rule is wrong or untested
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^hooks::semantic_filter_proxy::tests::slot_/)'
    - id: proxy-callback
      why: the ProxyCallback flags, the forwarding or the 400 mapping is wrong or untested
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^hooks::semantic_filter_proxy::tests::callback_/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b138)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b138 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b138/pyrightconfig.json
    - id: helper-case-corpus
      why: the added helper cases have no seed in the helper corpus or the shared parser rejects them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/semantic_filter_startup-*")" &&
        grep -lE '^[[:space:]]+b138:' tools/oracle/fuzz/corpus/helper_case/semantic_filter_startup-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: new-oracle-cases
      why: no new oracle case exists on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/semantic-filter-startup)"
oracle_cases:
  - tools/oracle/cases/helpers/semantic-filter-startup/block-absent.yaml
  - tools/oracle/cases/helpers/semantic-filter-startup/enabled-false.yaml
  - tools/oracle/cases/helpers/semantic-filter-startup/enabled-missing.yaml
  - tools/oracle/cases/helpers/semantic-filter-startup/enabled-defaults.yaml
  - tools/oracle/cases/helpers/semantic-filter-startup/enabled-custom-values.yaml
  - tools/oracle/cases/helpers/semantic-filter-startup/enabled-without-router.yaml
deviations:
  - what: The hook lives in a SemanticFilterSlot that ProxyLogging lists next to its callbacks, not in the module list litellm.callbacks.
    why: The repository forbids module-level state. The add, remove and lookup rules for this class are LiteLLM's, so the hooks that run are the same.
  - what: The semantic filter hook does not count against LITELLM_MAX_CALLBACKS (default 100).
    why: LiteLLM skips the add with a warning when litellm.callbacks already holds that many entries; the slot sits outside that list, so the filter still starts on such a proxy.
  - what: "The 400 for a context window block carries the message but no provider_specific_fields {\"error\": message}."
    why: ProxyHookError::Http holds a string detail, so the dict detail LiteLLM raises has no field to carry its copy. Status, error type and message match.
out_of_scope:
  - "SemanticToolFilterHook, SemanticToolFilterConfig, initialize_from_config, _truncate_csv_at_tool_name_boundary and the rest of hooks/mcp_semantic_filter/hook.py and __init__.py: B8201."
  - "SemanticMCPToolFilter, SemanticToolFilterContextWindowError and the rest of _experimental/mcp_server/semantic_tool_filter.py: B4685."
  - "Parsing litellm_settings.mcp_semantic_tool_filter and its admin routes: B1663. The database reload of the block (_init_semantic_filter_settings_in_db): B8383."
  - "The lifespan call of the startup step (proxy_server.py L1461-L1474): B8374. Listing slot.callback() in ProxyLogging's callback list and running pre-call and header hooks on the routes: B8399."
  - "LoggingCallbackManager itself is B189's (logging_callback_manager.py); the slot copies only its add, remove and lookup rules for this one class."
  - "HTTP oracle cases through /v1/chat/completions and /v1/responses come with the task that calls the step at startup and lists the callback, since no route reaches it before that."
  - "The other B138 parts: the tool registry (B4680), toolset storage (B4681), catalog guards (B4682), OpenAPI tools (B4683), search primitives (B4684) and search handlers (B4686). Their startup and route wiring is B8620, B8701, B6591, B6592, B8462, B4727 and B4728."
pitfalls:
  - The gate is on enabled alone. A block with embedding_model, top_k or similarity_threshold but no enabled key starts nothing, and those values never reach initialize_from_config.
  - A second add keeps the first hook. Only B8383's reload replaces it, and it calls remove_all first.
  - initialize_from_config with no router returns None after its own warning, so this step logs a second warning ("configured but failed to initialize"). Both lines are LiteLLM's.
  - The hook runs for completion, acompletion and aresponses call types only; the callback passes every call type on and lets B8201's method skip the rest.
  - callback() must give None while the slot is empty. A callback that is always listed but does nothing would still show SemanticToolFilterHook in the proxy's callback lists and capability flags.
  - Clone the Arc out of the RwLock before awaiting the hook; the lock guard must not live across the await.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
