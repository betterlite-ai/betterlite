id: B392
title: Typed routing probe IPC and child lifecycle
description: 'Add the typed ProbeRequest/ProbeReply JSON IPC parser and bounded child runner in oracle
  tooling. Limit input/reply to 1 MiB, operation time to 30 seconds and build time to 300 seconds; reject
  unknown operations and malformed replies. Own injected clock/sample serialization, stdout/stderr separation,
  child cancellation and strict Python validation. Seed an Echo operation used only by tooling tests;
  production routing calls and case registration are B301. Implement the owned native service in tools/oracle/src/routing_probe_ipc.rs
  (oracle tooling). Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140
  Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use
  only the existing checks.yaml exclusions. Reuse predecessor services instead of copying their algorithms.'
scope:
  paths:
  - tools/oracle/src/lib.rs
  - tools/oracle/src/main.rs
  - tools/oracle/src/error.rs
  - tools/oracle/src/routing_probe_ipc.rs
  - tools/oracle/src/routing_probe_ipc/**
  - tools/oracle/src/case.rs
  - tools/oracle/src/case/**
  - tools/oracle/src/runner.rs
  - tools/oracle/src/runner/**
  - tools/oracle/src/compare.rs
  - tools/oracle/src/compare/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/bin/betterlite-router-probe.rs
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/pyproject.toml
  - tools/oracle/litellm/uv.lock
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/tests/**
  - Cargo.toml
  - deny.toml
  - tools/oracle/fuzz/Cargo.toml
  - tools/oracle/fuzz/fuzz_targets/probe_ipc.rs
  - tools/oracle/fuzz/corpus/probe_ipc/routing-probe-ipc-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/simple_shuffle.py#L17-L67
  why: Implementation boundary verified against the pinned checkout.
dod:
- text: Write tests named routing_probe_ipc_behaviors and routing_probe_ipc_boundaries under routing_probe_ipc::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - routing-probe-ipc-behaviors
  - routing-probe-ipc-boundaries
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - routing-probe-ipc-behaviors
- text: Add tools/oracle/fuzz/corpus/probe_ipc/routing-probe-ipc-valid.json and tools/oracle/fuzz/corpus/probe_ipc/routing-probe-ipc-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target probe_ipc and normal replays_the_probe_ipc_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - routing-probe-ipc-boundaries
checks:
  optional: []
  commands:
  - id: routing-probe-ipc-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::routing_probe_ipc_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: routing-probe-ipc-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::routing_probe_ipc_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/protocol.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/protocol.py)" && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f tools/oracle/fuzz/corpus/probe_ipc/routing-probe-ipc-valid.json && test -f tools/oracle/fuzz/corpus/probe_ipc/routing-probe-ipc-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/probe_ipc | grep
      -Fq "/routing-probe-ipc-" && test -f tools/oracle/fuzz/fuzz_targets/probe_ipc.rs && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(replays_the_probe_ipc_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
- B301 owns final integration and the remaining functions listed in its implementation boundary.
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
