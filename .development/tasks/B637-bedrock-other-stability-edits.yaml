- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/image_edit/stability_transformation.py#L55-L407
  why: Own BedrockStabilityImageEditConfig._is_stability_edit_model, BedrockStabilityImageEditConfig.get_error_class,
    BedrockStabilityImageEditConfig.get_supported_openai_params, BedrockStabilityImageEditConfig.map_openai_params,
    BedrockStabilityImageEditConfig.transform_image_edit_request, BedrockStabilityImageEditConfig.transform_image_edit_response,
    BedrockStabilityImageEditConfig.use_multipart_form_data, BedrockStabilityImageEditConfig.get_complete_url, BedrockStabilityImageEditConfig.validate_environment.
    Other functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/stability.py#L177-L183
  why: Exact five-entry size mapping, reused from the native Stability type owner B046.
