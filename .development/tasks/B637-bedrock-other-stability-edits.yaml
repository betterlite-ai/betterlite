id: B637
title: Bedrock Stability image edit transformations
description: >-
  Add StabilityEditRequest/Reply for the source stability image-edit model families. Preserve model selection, image/mask
  conversion, seed/negative-prompt/native fields and body/auth/url validation. Reuse existing upload descriptors
  and no-fetch media policy.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_edit/stability_transformation.py:
  BedrockStabilityImageEditConfig._is_stability_edit_model L55-L86; BedrockStabilityImageEditConfig.get_error_class
  L88-L94; BedrockStabilityImageEditConfig.get_supported_openai_params L96-L105; BedrockStabilityImageEditConfig.map_openai_params
  L107-L158; BedrockStabilityImageEditConfig.transform_image_edit_request L160-L277; BedrockStabilityImageEditConfig.transform_image_edit_response
  pre-cost branch L279-L340 and return L349-L349; BedrockStabilityImageEditConfig.use_multipart_form_data L351-L355;
  BedrockStabilityImageEditConfig.get_complete_url L357-L374; BedrockStabilityImageEditConfig.validate_environment
  L376-L407.


  Reuse the B068 image-price projection for llm_provider-x-litellm-response-cost and the existing Stability aspect-ratio
  table; this slice does not calculate money.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: stability_edit_model_selection: A truthy lowercased model qualifies only if it contains
  stability. and one of upscale,outpaint,inpaint,erase,remove-background,search-recolor,search-replace,control-sketch,control-structure,style-guide,style-transfer.
  These are substring tests; empty/None is false. No raw-catalog flag is required. Base initialization is B2202
  no-op. image_and_mask_fields: Start output_format=png and include non-None/nonempty prompt. Optional image bytes
  become base64, strings pass through unchanged, file-like objects read from their current position (no Canvas seek-to-zero),
  and other SDK values use bytes conversion in B159. For a case-insensitive style-transfer substring put the image
  under init_image, otherwise image. Missing image is allowed. For mask,init_image,style_image take the first item
  of a nonempty list only, encode bytes/read bytes, retain strings, and otherwise use Python string conversion;
  an empty list becomes the literal [] string. Options can overwrite a generated init_image. native_edit_options:
  Skip underscore-prefixed and None options. Convert left,right,up,down,seed with int and strength,creativity,control_strength,grow_mask,fidelity,composition_fidelity,style_strength,change_strength
  with float; ValueError/TypeError preserves the original value, while other conversion errors propagate. Pass negative_prompt,aspect_ratio,output_format,model,mode,style_preset,select_prompt,search_prompt
  unchanged. Ignore all remaining keys. Return body and an empty second mapping; _n does not trigger a request loop
  and _response_format never creates URLs. stability_artifact_results: Decode JSON, then if errors key is present
  raise B682 error with original status/headers and Bedrock Stability error: {errors}, regardless of images or error
  truthiness. Otherwise inspect only the first finish_reasons element when the container and element are truthy;
  raise status400 with Bedrock Stability error: {first_reason}. Later nonempty reasons do not matter. Success maps
  truthy images entries to ordered ImageObject(b64_json=value,url=None,revised_prompt=None); absent/empty/all-falsey
  images are permitted. This path reads images, not artifacts, and constructs fresh shared ImageResponse defaults.
  filtered_result_error: decode_stability_reply failure becomes B682 error with original status/headers and Error
  parsing Bedrock Stability response: {decoder_error}; parsed malformed records fail outside that catch. The provider
  transform does not itself reject non-200 HTTP status without an errors/finish-reason indication; B638 transport
  owns HTTP rejection. B068 adds llm_provider-x-litellm-response-cost from output_cost_per_image with absent default0
  and None omitted, without multiplying by image count; catalog or conversion failures propagate, unlike B636. stability_edit_url:
  use_multipart_form_data returns False. get_complete_url returns literal bedrock://image-edit placeholder, unused
  by B638 native URL construction. validate_environment uses an empty mapping for None, adds Content-Type=application/json
  only if that exact key is absent, and preserves other headers; it performs no credential lookup. get_error_class
  delegates B682 preserving message/status/headers. stability_option_mapping: Supported params are n,size,response_format,mask
  in that order. Copy options; map exact sizes 1024x1024,512x512,256x256 to aspect_ratio=1:1, 1792x1024 to 16:9
  and 1024x1792 to 9:16. Unknown sizes add nothing. Store n as _n and response_format as _response_format, then
  remove size,n,response_format. An unsupported key with falsey drop_params raises ValueError Parameter {key} is
  not supported for model {model}. Supported parameters are ['n', 'size', 'response_format', 'mask']. Set drop_params=True
  to drop unsupported parameters. With truthy drop_params the code does not remove unknown keys from its initial
  copy, despite the comment; retained fields may later be accepted by request building.


  Implement crates/betterlite-bedrock/src/stability_edits.rs with adjacent tests under stability_edits/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stability_edits_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): stability_edit_model_selection, image_and_mask_fields, native_edit_options, stability_artifact_results,
  filtered_result_error, stability_edit_url, stability_option_mapping. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_stability_edits* using HelperCase:
  kind: helper and the externally tagged bedrock_other_stability_edits variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_stability_edits that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_stability_reply consumes Stability artifact JSON response bytes in crates/betterlite-bedrock/src/stability_edits.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_stability_edits.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_other_stability_edits.
  The adjacent test replays_the_bedrock_other_stability_edits_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 270 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 280 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 740 planned, 750 maximum changed lines.
