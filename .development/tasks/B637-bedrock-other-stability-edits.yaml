  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/stability_edits.rs
  - crates/betterlite-bedrock/src/stability_edits/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/other_stability_edits.rs
  - tools/oracle/src/helpers/bedrock/other_stability_edits/**
  - tools/oracle/helpers/bedrock_other_stability_edits.py
  - tools/oracle/helpers/bedrock_other_stability_edits/**
  - tools/oracle/cases/helpers/providers/bedrock-other-stability-edits/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_stability_edits*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_stability_edits.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_other_stability_edits/**
  lint_tables: false
