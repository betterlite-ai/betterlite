id: B1046
title: Batch input accounting
description: >-
  Read authorized managed batch files and count per-line input/output usage, checking each row's model access before
  submission. Use batch-records parsing and B013 offline token counts; preserve source fallback estimates and record
  denied rows without exposing file contents.


  Implement crates/betterlite-core/src/api/batch_input_accounting.rs. Use BatchInputAccountingInput and BatchInputAccountingResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): batch_rate_limiter.py:1070 status_code=403, exception_detail=FastAPI detail object; batch_rate_limiter.py:1118
  status_code=403, exception_detail=FastAPI detail object. Compare the actual source status, error type, param and
  code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions mixed_model_row_access, batch_input_tokens, batch_output_estimate,
  managed_file_fetch_auth, unsupported_row_estimate under api::batch_input_accounting::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::batch_input_accounting::decode_batch_input_accounting(bytes:
  &[u8], limits: &ApiLimits), for json.loads input raw_line at litellm/proxy/hooks/batch_rate_limiter.py:950. Place
  its implementation in crates/betterlite-core/src/api/batch_input_accounting.rs and call it from the actual boundary.
  The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/batch_input_accounting.rs passes arbitrary bounded
  bytes to that exact decoder; api::batch_input_accounting::tests::replays_corpus replays newly committed seeds
  through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::BatchInputAccounting in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_input_accounting: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter.count_input_file_usage
  (L843-L1020); litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter._enforce_batch_file_model_access
  (L1022-L1126); litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter._fetch_managed_file_content
  (L1128-L1178). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 237 owned nonblank/non-comment/non-docstring Python lines (267 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 257 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 567 total within the 570-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B013 (Model cost map, provider capability data and token counting), B171 (Direct helper
  oracle and URL path encoding), B1020 (File credentials), B1030 (File content stream), B1035 (Batch records), B1044
  (Batch limit descriptors), B1087 (Api boundaries), B1019 (File routing ids), B1039 (Batch output usage). These
  are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on
  the provider and keys/data branches.
