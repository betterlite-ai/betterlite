checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_input_accounting::/)
      - test(/::replays_corpus$/)'
  - id: case-mixed-model-row-access
    why: the mixed-model-row-access behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_input_accounting::tests::mixed_model_row_access($|::)/)'
  - id: case-batch-input-tokens
    why: the batch-input-tokens behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_input_accounting::tests::batch_input_tokens($|::)/)'
  - id: case-batch-output-estimate
    why: the batch-output-estimate behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_input_accounting::tests::batch_output_estimate($|::)/)'
  - id: case-managed-file-fetch-auth
    why: the managed-file-fetch-auth behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_input_accounting::tests::managed_file_fetch_auth($|::)/)'
  - id: case-unsupported-row-estimate
    why: the unsupported-row-estimate behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_input_accounting::tests::unsupported_row_estimate($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/batch_input_accounting)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/batch_input_accounting.rs && grep -qF "decode_batch_input_accounting"
      crates/betterlite-core/fuzz/fuzz_targets/batch_input_accounting.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::batch_input_accounting::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/batch_input_accounting.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/batch_input_accounting-*)"
      && grep -qE "^[[:space:]]+batch_input_accounting:" tools/oracle/fuzz/corpus/helper_case/batch_input_accounting-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/batch-input-accounting)"
