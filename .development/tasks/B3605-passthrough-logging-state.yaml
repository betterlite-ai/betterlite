    why: Logger constructor with injected dispatch, the tracked route tables, the _log_dispatch choice and _handle_logging.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/success_handler.py#L526-L594
    why: Route predicates for anthropic, cohere, assemblyai, comprehend medical, azure speech, transcribe, typesafe, openrouter decisions, langfuse, vertex live and cursor.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/success_handler.py#L644-L673
    why: _set_cost_per_request and the rule that an upstream-reported cost always wins.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L1418-L1421
