    why: Call site for apply_upstream_reported_usage on the non-streaming path, owned by B3613.
dod:
  - text: parse_upstream_reported_usage returns None when neither header is present and Some when either is, reading names case-insensitively and joining repeated headers with ", ".
    proof: [usage-parse-tests, oracle, helper-python]
  - text: parse_response_cost returns None, with the matching warning, for an absent, unparseable (abc), non-finite (nan, inf) or negative value, and keeps 0, "-0" and decimal or exponent forms.
    proof: [cost-parse-tests, oracle]
  - text: parse_total_tokens returns None, with the matching warning, for an absent, unparseable (1.5, abc) or negative value, and keeps 0 and "-0".
    proof: [token-parse-tests, oracle]
  - text: apply_upstream_reported_usage writes only the fields the upstream reported, stores the marker even when both values are unusable, and changes nothing when neither header is present.
    proof: [usage-apply-tests, oracle]
  - text: has_upstream_reported_usage is true after a header with an unusable value and false when no header was sent.
    proof: [usage-apply-tests, oracle]
  - text: set_cost_per_request writes cost_per_request (including 0) to both the kwargs slot and the state, and writes nothing when the upstream reported usage or the payload has no cost.
    proof: [cost-per-request-tests, oracle]
  - text: The default dispatcher passes cache_hit false and prefer_async_handlers true to B250 whatever the caller's cache_hit, and an injected dispatcher replaces it.
    proof: [dispatch-tests]
  - text: safe_response_text returns the text for a read body and an empty string for an unread one.
    proof: [response-text-tests]
  - text: The route predicates and tracked route tables match LiteLLM, including the cohere embeddings exclusion, the assemblyai hostname-or-path rule and the cursor hostname rule.
    proof: [route-predicate-tests, oracle]
  - text: The upstream-usage parser survives arbitrary bytes and the committed corpus replays.
    proof: [usage-corpus]
  - text: Newly added helper cases replay through the shared helper-case parser and the strict Python adapter lints clean.
    proof: [helper-case-corpus, helper-python]
checks:
  optional: []
  commands:
    - id: usage-parse-tests
      why: header presence, lookup or joined-duplicate parsing is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::usage_parse_/)'
    - id: cost-parse-tests
      why: cost parsing or its warnings are missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::cost_parse_/)'
    - id: token-parse-tests
      why: token parsing or its warnings are missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::token_parse_/)'
    - id: usage-apply-tests
      why: applying reported usage or the marker rule is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::usage_apply_/)'
    - id: cost-per-request-tests
      why: the cost-per-request rule is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::cost_per_request_/)'
    - id: dispatch-tests
      why: the default or injected log dispatch is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::dispatch_/)'
    - id: response-text-tests
      why: safe_response_text is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::response_text_/)'
    - id: route-predicate-tests
      why: a route predicate or route table is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_logging_state::tests::route_/)'
    - id: usage-corpus
      why: the usage parser fuzz target or its fresh replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-logging/fuzz/fuzz_targets/passthrough_upstream_usage.rs &&
        grep -q 'name = "passthrough_upstream_usage"' crates/betterlite-logging/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-logging/fuzz/corpus/passthrough_upstream_usage)" &&
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(replays_the_passthrough_upstream_usage_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3605)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3605 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3605/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/passthrough_logging_state-*")" &&
        grep -lE '^[[:space:]]+b3605:' tools/oracle/fuzz/corpus/helper_case/passthrough_logging_state-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
