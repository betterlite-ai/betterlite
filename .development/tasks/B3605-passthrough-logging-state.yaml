  - tools/oracle/cases/logging/passthrough-logging-state/usage-parse-absent.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/usage-parse-cost-only.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/usage-parse-unusable-values.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/usage-parse-repeated-header.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/usage-apply-keeps-derived-tokens.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/usage-apply-unusable-marker.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/cost-per-request-set.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/cost-per-request-zero.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/cost-per-request-upstream-wins.yaml
  - tools/oracle/cases/logging/passthrough-logging-state/route-predicates-matrix.yaml
deviations:
  - what: Python's float() and int() accept underscore digit separators ("1_0") and integers of any size; betterlite treats "1_0" as unparseable and an integer above i64 as unparseable.
    why: No real upstream sends either, and an i64 token count is the type the rest of betterlite uses. Both cases log the unparseable warning and record 0.
  - what: A url_route written as a network-path reference ("//host/path") is treated as a plain path with no hostname.
    why: The url crate rejects it without a base, and no betterlite caller builds such a route; Python's urlparse would read a hostname.
  - what: PassThroughEndpointLogging holds only the injected dispatcher and the route tables. The provider handler instances (transcribe, assemblyai) stay with the tasks that call them.
    why: Those handlers belong to provider leaves that this task must not depend on, so B3607 owns constructing and holding them.
out_of_scope:
  - "normalize_llm_passthrough_logging_payload (success_handler.py:151-410) and the route predicates that call a provider handler's own helper: is_vertex_route, is_openai_route, is_gemini_route, _is_supported_openai_endpoint and is_tinyfish_route. B3606 owns them."
  - "pass_through_async_success_handler (success_handler.py:412-517) with its TinyFish, AssemblyAI, Langfuse and Transcribe early returns and the StandardPassThroughResponseObject fallback. B3607 owns it and calls the pieces built here."
  - "Calling apply_upstream_reported_usage on a live response and building the failure payload from its result: pass_through_endpoints.py:1418 and :1506 belong to the HTTP request lifecycle (B3613), and _build_passthrough_failure_request_payload to B3610."
  - "dispatch_success_handlers itself belongs to B250; this task only calls it from the default dispatcher."
  - "Decoding response bytes into text (charset handling) and converting the body to UpstreamBodyText belong to B3607."
  - "The streaming counterpart that reads the marker in streaming_handler.py belongs to B3608 and B3609."
pitfalls:
  - "The marker is stored whenever either header is present, so a request with x-litellm-response-cost=abc has has_upstream_reported_usage true and a cost of None; set_cost_per_request must still not apply cost_per_request."
  - "apply_upstream_reported_usage skips a None field instead of writing 0, so an upstream that sends only x-litellm-response-cost keeps the token usage LiteLLM derived."
  - "The absent-header warning fires for the missing one of the two headers whenever the other is present, even when the upstream deliberately sends only one."
  - "nan and inf parse as floats in Python and are then rejected as out-of-range, so the warning text is 'out-of-range', not 'unparseable'; a Rust parser that rejects them at parse time prints the wrong message."
  - "response_cost < 0 is false for -0.0, so 'x-litellm-response-cost: -0' is accepted and recorded as a zero cost, not discarded."
  - "A repeated header is joined with ', ', so '0.5, 0.5' is unparseable and logs the unparseable warning with the whole joined text in the message."
  - "cost_per_request of 0 is 'set' (the check is `is not None`), and config-defined endpoints default to 0, which is why the upstream-reported cost has to win."
  - "handle_logging ignores its own cache_hit parameter and always dispatches with cache_hit False and prefer_async_handlers True, so async-only loggers such as the spend logger fire."
  - "is_cohere_route skips '/v1/embed' only when '/v1/embeddings' is a substring of the route, so '/v1/embed/v2' still matches and '/v1/embeddings' does not."
  - "is_assemblyai_route is true for hostname exactly api.assemblyai.com or any path containing '/transcript'; B3607 combines it with 'not is_azure_speech_route'."
  - "is_cursor_route is true for custom_llm_provider 'cursor' or any hostname containing 'api.cursor.com'. The tracked /v0/ routes only match when the provider is already 'cursor', so a bare /v0/agents URL with another provider is false."
  - "is_langfuse_route checks the parsed path only, while is_vertex_ai_live_route checks the whole route string and returns false for an empty string."
  - "is_openrouter_decisions_route needs both custom_llm_provider 'openrouter' and a path ending in '/alpha/decisions'; the query string is not part of the path."
  - "The response object enum needs a video variant (Gemini predictLongRunning in B3640)."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
