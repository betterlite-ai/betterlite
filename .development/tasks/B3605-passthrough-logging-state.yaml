    - tools/oracle/cases/logging/passthrough-logging-state/**
    - "tools/oracle/fuzz/corpus/helper_case/passthrough_logging_state-*"
    - tools/oracle/helpers/b3605.py
    - tools/oracle/helpers/b3605/**
    - tools/oracle/src/helpers/logging/b3605.rs
    - tools/oracle/src/helpers/logging/b3605/**
  lint_tables: false
