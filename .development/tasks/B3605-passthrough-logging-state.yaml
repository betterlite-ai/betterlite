id: B3605
title: Pass-through logging state and upstream usage
description: >-
  Build the shared state of the pass-through success logger in betterlite-logging, in the new module
  passthrough_logging_state (crates/betterlite-logging/src/passthrough_logging_state.rs and its folder). It holds three things:
  the upstream-reported usage contract, the cost-per-request rule, and the route predicates that need no provider handler.
  Later tasks (B3606 provider dispatch, B3607 success completion, B3608 streams, B3610 failure payload) call it.

  Upstream usage. Some pass-through targets run several models for one HTTP request and report the totals in two response
  headers: `x-litellm-response-cost` and `x-litellm-total-tokens`. Build `UpstreamReportedUsage { response_cost: Option<f64>,
  total_tokens: Option<i64> }` and these functions. `parse_upstream_reported_usage(headers: &http::HeaderMap) ->
  Option<UpstreamReportedUsage>` returns None when neither header is present, otherwise Some with each field parsed on its own.
  Header lookup is case-insensitive. When a header is repeated, join the values with ", " in order (httpx does the same), so
  "1, 2" is unparseable. Decode header bytes the way httpx does: ASCII first, then UTF-8, then ISO-8859-1.
  `parse_response_cost(raw: Option<&str>) -> Option<f64>` turns an absent, unparseable, non-finite or negative value into None
  and logs a warning for each case (four messages, text below); "-0" is accepted and kept as -0.0.
  `parse_total_tokens(raw: Option<&str>) -> Option<i64>` does the same for absent, unparseable or negative values. Both functions
  are pure over a str so a fuzz target can feed them bytes.
  Warning texts, logged at the tracing warn level: absent cost
  "pass_through_endpoint: upstream did not send x-litellm-response-cost; recording 0 cost for this request"; unparseable
  "pass_through_endpoint: upstream sent unparseable x-litellm-response-cost='<raw>'; recording 0 cost for this request";
  out of range "pass_through_endpoint: upstream sent out-of-range x-litellm-response-cost='<raw>'; recording 0 cost for this request".
  The token messages are the same with x-litellm-total-tokens, "tokens" instead of "cost", "did not send", "unparseable" and
  "negative" (not "out-of-range"). `<raw>` is the value in Python repr style, single quotes. Note the header-absent warning
  fires when the other header is present and this one is not.

  `PassThroughCallState` is the typed slice of LiteLLM's model_call_details that this module touches: `upstream_reported_usage:
  Option<UpstreamReportedUsage>`, `response_cost: Option<f64>` and `combined_usage_total_tokens: Option<i64>` (LiteLLM stores
  `Usage(total_tokens=n)` under combined_usage_object, and total_tokens is the only field set). B3607 owns embedding this record in
  the per-request logging state. `apply_upstream_reported_usage(state: &mut PassThroughCallState, headers: &http::HeaderMap) ->
  Option<UpstreamReportedUsage>` calls the parser; on None it changes nothing. On Some it stores the value in
  upstream_reported_usage (even when both fields are None), sets response_cost only if the cost field is Some, and sets
  combined_usage_total_tokens only if the tokens field is Some, so a target that reports only cost keeps the token count that
  LiteLLM derived. `has_upstream_reported_usage(state: &PassThroughCallState) -> bool` is true whenever the marker is stored, even
  if both reported values were unusable: an upstream that speaks this contract owns the request cost, and an unparseable value
  means zero, never a fallback to an estimate.

  Cost per request. `set_cost_per_request(state: &mut PassThroughCallState, kwargs_response_cost: &mut Option<f64>,
  cost_per_request: Option<Decimal>)` mirrors _set_cost_per_request: if has_upstream_reported_usage is true it returns at once and
  writes nothing; else if cost_per_request is Some (0 counts as set) it converts it to f64 with rust_decimal's ToPrimitive and
  writes the same value to the kwargs response_cost slot and to state.response_cost. B3607 passes the payload's `cost_per_request`
  from betterlite-server's PassthroughLogPayload.

  Logger state. `PassThroughEndpointLogging` holds an optional injected `Arc<dyn PassThroughLogDispatch>` and exposes the tracked
  route tables as associated consts with LiteLLM's values: vertex methods generateContent, streamGenerateContent, predict,
  rawPredict, streamRawPredict, search, predictLongRunning, embedContent, batchEmbedContents; vertex resources batchPredictionJobs;
  anthropic "/messages" and "/v1/messages/batches"; cohere "/v2/chat" and "/v1/embed"; langfuse "/langfuse/"; gemini
  generateContent, streamGenerateContent, predictLongRunning; cursor "/v0/agents", "/v0/me", "/v0/models", "/v0/repositories";
  vertex live "/vertex_ai/live". `PassThroughLogDispatch` is an async trait with one method taking a `PassThroughLogCall`
  (response object enum or None, result string, start and end time, cache_hit, and the shared logging kwargs as a typed map).
  The default dispatcher, `handle_logging`, hands the call to B250's dispatch_success_handlers with the response object, the same
  times, `cache_hit: false` and `prefer_async_handlers: true`. It ignores the cache_hit it was given and never passes the
  `result` string on (LiteLLM only does that for a dict result, which the declared str type rules out). `log_dispatch()` returns the
  injected dispatcher when set, else the default.

  Response text. `safe_response_text(body: &UpstreamBodyText) -> String` where `UpstreamBodyText` is `Read(String)` or `NotRead`.
  Streamed responses are never read into memory, so NotRead gives an empty string and Read gives the text. The caller decodes bytes.

  Route predicates on PassThroughEndpointLogging, all pure over url_route and custom_llm_provider: is_anthropic_route,
  is_cohere_route, is_assemblyai_route, is_comprehend_medical_route, is_azure_speech_route, is_transcribe_route, is_typesafe_route,
  is_openrouter_decisions_route, is_langfuse_route, is_vertex_ai_live_route, is_cursor_route. Rules are in the pitfalls. Split a
  url_route with the url crate when it parses as an absolute URL; otherwise treat the whole string up to the first ? or # as the
  path with no hostname, as Python urlparse does for a string without a scheme.

  Tests live under passthrough_logging_state::tests and are named by group (see checks). Add the fuzz target
  passthrough_upstream_usage in crates/betterlite-logging/fuzz that feeds arbitrary bytes, as lossy UTF-8, to parse_response_cost
  and parse_total_tokens, with a committed corpus and a test replays_the_passthrough_upstream_usage_corpus.
