dod:
  - text: The blocked-word lookup returns the first literal substring match in insertion order with its action and optional description, preserving duplicate-key replacement and lowercase behavior.
    proof: [lookup-tests, oracle, helper-python]
  - text: Fresh b105 helper-case seeds replay through the existing typed helper decoder.
    proof: [helper-corpus]
  - text: Booted-proxy cases cover category and competitor policy effects, aliases and activation, ordered masking and credential redaction, images, chat/MCP tool arguments, stream masking and late blocks, and both code-execution outcomes.
    proof: [oracle]
  - text: The apply aliases preserve redacted text and auth, and a process with both prompt-injection and content-filter configuration runs each check on its triggering request.
    proof: [oracle]
  - text: A real generated key's nonempty cache-control allowlist permits an authorized control and rejects an unauthorized control with 403, while an empty allowlist permits it.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: lookup-tests
      why: the lookup is absent, regex-based, loses insertion order or returns the wrong stored value
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/::blocked_lookup_cases($|::)/)'
    - id: helper-python
      why: the new pure-function oracle adapter fails the strict Python checks
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-corpus
      why: no seed exercises b105 or the existing helper-case decoder rejects the new typed input
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/blocked-word-lookup-*')" && grep -rlq 'b105:' tools/oracle/fuzz/corpus/helper_case/blocked-word-lookup-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
