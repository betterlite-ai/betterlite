id: B105
title: Built-in filter lookup and HTTP composition parity
description: >-
  Finish the content-filter umbrella after its class, matchers, streaming hook and
  initializers. The only unassigned method in content_filter.py is
  _check_blocked_words at L1173-L1207: upstream tests call it, although production
  filtering uses the separate all-word loop in _filter_single_text. Build its typed
  lookup and add HTTP parity cases for the built-in combinations that the earlier
  helper-only tasks could not reach. B8613 installs B8666's real classes, B8399 runs
  proxy hooks, B8668 mounts apply_guardrail, and B8626 mounts MCP REST. Call those
  existing paths; no route, callback registry, constructor, matcher or stream wrapper
  is registered or implemented again here. B8850 supplies the missing prompt-injection
  callback and its own HTTP cases; the final mixed case here uses it with a content filter.

  Put check_blocked_words in crates/betterlite-guardrails/src/blocked_word_lookup.rs
  and its tests in blocked_word_lookup/tests.rs. Accept an insertion-ordered map from
  already-lowercased keywords to (B3690's ContentFilterAction, optional description),
  plus text, and return the first matching keyword, action and description, or None.
  Lowercase the text and use literal substring matching: no word boundaries, wildcard
  conversion, regex compilation, redaction or detection logging. Preserve map order;
  when configuration repeated a keyword, the initializer kept its first position and
  last value. Reuse the workspace's ordered map and str substring operations.
  The list-to-map recovery at L1183-L1197 is an old Python instance-shape repair,
  outside the declared dict field type, so docs/compatibility.md applies and no Rust
  union or malformed-instance case is added. Keep the debug log on a match.

  The helper operation supplied by the skeleton is b105. Its typed input carries a
  list of valid blocked-word records and text. Its Python adapter builds LiteLLM's
  actual ContentFilterGuardrail with that list and calls _check_blocked_words; the
  Rust adapter prepares the ordered map and calls the production lookup. Return
  null or {keyword, action, description}. Four helper cases cover first insertion
  winning over text position, duplicate keyword replacement after lowercasing,
  a literal asterisk rather than a wildcard, and a miss with an empty table. Native
  rstest cases named blocked_lookup_cases also cover an embedded word and Unicode
  lowercase. Add a b105-tagged seed to the existing helper-case decoder corpus;
  the function itself takes parsed records and introduces no new byte parser.

  HTTP cases live in tools/oracle/cases/guardrails/builtin-content-http. Use the
  normal booted-proxy HTTP case format, a configured master key, no database except
  for cache-control-permissions, mock
  OpenAI deployments with api_base {{upstream}}, and router_settings.num_retries 0.
  Set guardrails[].litellm_params.guardrail to litellm_content_filter and select each
  guardrail through the request's guardrails list unless a case tests default_on.
  Modes are pre_call, post_call or pre_mcp_call as named below. Content filter action
  names are BLOCK and MASK, and its default severity_threshold is medium. Capture
  provider requests as well as responses so a 200 cannot hide a skipped input scan.
  Compare status, error type/param/code, content-type and x-litellm-applied-guardrails
  when the source emits it. On errors ignore only human-readable string leaves with
  the betterlite-wording reason: /error/message when scalar, or the error/message
  string inside a structured detail. Keep category, severity, keyword, description,
  pattern, intent and confidence fields compared. Ignore only justified generated
  ids/times elsewhere, never the whole error or all response headers.

  auto-enable-and-aliases uses one HTTP scenario with the four existing POST chat
  paths /v1/chat/completions, /chat/completions,
  /engines/{model:path}/chat/completions and
  /openai/deployments/{model:path}/chat/completions. A default_on true MASK word runs
  without a request guardrails list; a separate default-off case leaves that same
  word unchanged. pattern-and-word-order puts a prebuilt us_ssn MASK before a
  blocked-word rule matching the resulting US_SSN_REDACTED tag, proving the ordered
  initializer/class/evaluator composition rather than merely the regex helper.
  secret-pattern-mask configures the bundled aws_access_key pattern with MASK and
  sends the synthetic fixture AKIA0000000000000000; the provider must receive
  [AWS_ACCESS_KEY_REDACTED]. This is the built-in credential pattern, without the
  enterprise-only hide_secrets callback.
  category-conditional-block loads denied_financial_advice and sends "Should I buy
  stock?"; category-exception-pass sends "What is the return policy?" with the same
  category. category-conditional-mask uses MASK and the first sentence to prove that
  the conditional branch warns but leaves the provider input unchanged.

  competitor-refuse uses the generic checker with competitors [Acme], comparison_words
  [better], policy.competitor_comparison refuse and input "Is Acme better?"; it must
  stop before the provider. competitor-reframe uses reframe and an explicit
  reframe_message_template "Please ask about our service" and compares the synthetic
  chat response and absence of provider traffic. The template is operator input,
  not generated error wording, so compare its text exactly. airline-brand-excluded
  uses competitor_intent_type airline, brand_self [Emirates] and a comparison mentioning
  Emirates, proving that B3697's bundled list and B8773's constructor compose.

  tool-request-mask supplies an assistant message with a function call whose arguments
  contain nested string values matching a MASK word; compare the provider's parsed
  arguments. tool-response-mask returns the same kind of tool call from the mock
  provider in post_call mode. tool-key-mask-block uses the masked word as an object
  key, which is not rewritable and must block. image-description-block configures a
  separate image_model deployment returning the blocked word in its description;
  verify the description request's system prompt "Describe the image in detail."
  and that the main chat deployment is never called. Use a fixture data image URL,
  not a real external image service.

  streamed-split-mask sends a provider SSE stream whose us_ssn value spans chunks
  and ends at finish_reason; compare decoded SSE choices, the redacted text, final
  flush and absence of an extra trailing space. streamed-block-after-prefix emits
  enough harmless text to pass the 50-character holdback before a BLOCK word and
  compares the resulting stream error framing, not an invented replacement HTTP
  status after headers have already been sent. B3700 owns holdback and B6370 owns
  the outer wrapper; failures here must be reported to those owners, not repaired
  by adding a second streaming implementation.

  mcp-argument-mask calls the existing POST /mcp-rest/tools/call with server_id,
  name and arguments, one mcp_servers entry with transport http, url {{upstream}}
  and a pinned server_id, and a default-on
  pre_mcp_call content filter. Compare the tools/call arguments observed by the MCP
  mock, including nested string redaction and unchanged bool/numeric fields. The
  mock captures six requests: LiteLLM's startup listing of the server
  (initialize, notifications/initialized, tools/list), then the call's own session
  (initialize, notifications/initialized, tools/call). Script the replies in that
  order with the existing upstream answer queue: initialization returns no
  Mcp-Session-Id, notifications return 202, and each JSON-RPC reply echoes its
  request's id, which counts from 1 in each session. Do not assume an OpenAI
  completion response is an MCP reply. Each initialize body carries its own side's
  clientInfo, so name B9850's `/upstream/0/body` and `/upstream/3/body` in
  compare.ignore with that reason. Keep protocol methods, ids and arguments in the
  other four bodies compared. Do not build a transport or mount /mcp,
  /mcp/proxy, /toolset/{toolset_name}/mcp or /{mcp_server_name}/mcp, which B8728 owns.
  apply-aliases masks text through POST /guardrails/apply_guardrail and /apply_guardrail
  in a two-step scenario and compares response_text. no-auth uses the canonical
  apply path without authorization and checks refusal before class execution.

  code-request-response-block configures block_code_execution with blocked_languages
  [python], confidence_threshold 0.5, detect_execution_intent false and action block.
  One scenario sends a fenced Python block as input and then obtains one in the
  provider response with the appropriate pre_call and post_call guardrails. Input
  blocking is a passthrough ModifyResponse result; output blocking raises HTTP 400,
  so do not collapse the two. mixed-injection-and-content configures B8850's callback
  with heuristics_check true beside a pre_call content filter; two requests separately
  trip the heuristic phrase "do not follow" and a content-filter BLOCK word, proving
  both installed mechanisms run in the same process without reaching the provider.

  cache-control-permissions is an http_scenario using the existing isolated Postgres
  setup. Call B055's POST /key/generate with the master key, models [chat] and
  allowed_cache_controls [no-cache], capture /body/key as a secret, then use that
  key in Authorization for three chat requests: cache {no-cache: true} passes,
  cache {no-store: true} returns 403 before provider traffic, and an absent cache
  object passes. Create a second key with allowed_cache_controls [] and prove
  no-store is permitted. Compare the chat status/error fields and provider traffic;
  ignore only generated key/id/time fields in the creation responses with reasons.
  The harness's KeyRow has no allowlist field, so use the real key route, not a
  made-up fixture property or a forged authenticated principal. B055/B1100 already
  own that route and its registry entry; this task does not mount it.

  All other behavior remains with the parts listed below. Basic cross-endpoint
  pre/during/post-call cases already belong to B3680, and generic API hook/header
  cases to B8399. The sensitive-data hook is registered by B8399 and its cache
  behavior is B3704's: the open-source built-ins never call
  handle_sensitive_data_detection at this pin, so do not invent a built-in detector
  that populates its sticky cache. The examples README and benchmark datasets/results
  are reference material, not a runtime API or a latency contract; the pytest-only
  benchmark runner is not ported. llamaguard_prompt.txt has no caller in the
  open-source checkout, and hide_secrets depends on the unavailable enterprise
  implementation, so neither becomes a new detector in this task.
