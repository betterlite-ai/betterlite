  - "_normalize_patterns, _normalize_blocked_words, _add_pattern, _lookup_pattern_extra, _load_blocked_words_file, _find_pattern_spans, _match_near_keyword, _gap_text_allowed, _merge_spans, _mask_spans, _convert_word_number_sequence, _check_patterns, _keyword_to_regex_pattern and _mask_content are B3693."
  - "_check_conditional_categories, _check_phrase_patterns and _check_category_keywords are B3694; _handle_conditional_match, _handle_category_keyword_match, _handle_pattern_match, _handle_blocked_word_match and _filter_single_text are B3695."
  - "_count_masked_entities, _build_match_details, _get_detection_methods, _get_patterns_checked_count, _get_policy_templates, _compute_risk_score and _log_guardrail_information are B3698."
  - "_process_images, _describe_image_response_content, _apply_competitor_intent_policy, _get_mcp_tool_name, _assert_argument_label_clean, _filter_argument_value, _scan_mcp_tool_call_arguments, _get_tool_call_arguments, _set_tool_call_arguments, _filter_tool_call_arguments and _scan_tool_call_arguments are B3699."
  - "_streamed_scan_plan, _cut_breaks_wider_context, _trim_streamed_choice_buffer, _merge_detections and async_post_call_streaming_iterator_hook are B3700. ContentFilterGuardrail.__init__, _init_competitor_intent_checker, apply_guardrail, get_config_model and get_supported_event_hooks are B8773."
  - "__init__.py initialize_guardrail arguments are B8219; its registry entries are B8521 over B3682, with B8666 constructing live classes. B8521's covers must gain this __init__.py through the architect. B3691 owns the pattern/category assets, B3696 and B3697 the competitor implementations."
  - "test_eval.py is exclusively pytest evaluation infrastructure: _load_jsonl, _run, _print_confusion_report, _save_confusion_results, _confusion_matrix, _content_filter, _llm_judge, both checker classes' __init__/check methods and every blocker/cases/test_confusion_matrix fixture/test stay upstream; no production caller exists. Its CSV/JSONL eval inputs, JSON result snapshots and BENCHMARKS.md remain reference data, not new Rust APIs or performance assertions."
  - "examples/README.md documents B3697/B8773 behavior and needs no executable port; llamaguard_prompt.txt has no caller at the pin in the open-source checkout, so no loader is built."
  - "SensitiveDataRoutingHandler and its cache policy are B3704, its registration is B8399, and handling a SensitiveDataRoute exception is B8392. No open-source built-in emits that exception at the pin. The cache-control hook is B3705 and is likewise installed by B8399."
  - "Code execution class/detection are B3701/B3702. Prompt-injection logic is B3703 and binding is B8850. hide_secrets is the missing-enterprise-package outcome owned by B3681, not a native secret detector."
  - "Route ownership remains B8610 for the root, B8667/B8668/B8669/B8790 for the guardrail area, B8626 for MCP REST, B8701 for toolsets, B9950 for sessions and B8728 for MCP transport. No route or mount is added by this umbrella."
pitfalls:
  - "_check_blocked_words uses literal substring search, whereas _filter_single_text turns an asterisk into .? and evaluates every configured word."
  - "The four chat aliases include engines and deployments paths; /openai/v1/chat/completions is not a decorator on this handler."
  - "A conditional MASK leaves the text intact, so a test that expects [KEYWORD_REDACTED] would contradict LiteLLM."
  - "ContentFilterGuardrail's during_call MASK warning explicitly describes a race, so deterministic masking cases use pre_call or post_call."
  - "block_code_execution uses lowercase block/mask, unlike the content filter's uppercase BLOCK/MASK."
  - "A stream block after the first emitted data cannot be tested as an ordinary HTTP 400 response."
  - "Benchmark expected labels and recorded timings are not the oracle; compare the pinned running implementation, including its false positives and false negatives."
  - "compare.ignore reaches a captured MCP request only through B9850's whole-body selector, so a pointer to a JSON-RPC id inside a body is refused; the dispatcher of mcp 2.3.0 (the version tools/oracle/litellm/uv.lock installs) numbers ids from 1 in each session (jsonrpc_dispatcher.py _allocate_id), so they need no ignore."
  - "LiteLLM lists every mcp_servers entry's tools at startup (mcp_server_manager.py L6683-L6714), so mcp-argument-mask's first three captures come before its own request; run it with --self-check first and take the selector indices from that capture."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
