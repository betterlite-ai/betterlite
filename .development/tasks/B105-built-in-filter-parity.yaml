  paths:
    - crates/betterlite-guardrails/src/blocked_word_lookup.rs
    - crates/betterlite-guardrails/src/blocked_word_lookup/**
    - tools/oracle/cases/helpers/blocked-word-lookup/**
    - tools/oracle/cases/guardrails/builtin-content-http/**
    - tools/oracle/fuzz/corpus/helper_case/blocked-word-lookup-*
    - tools/oracle/helpers/b105.py
    - tools/oracle/helpers/b105/**
    - tools/oracle/src/helpers/guardrails/b105.rs
    - tools/oracle/src/helpers/guardrails/b105/**
  lint_tables: false
