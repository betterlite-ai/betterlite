deviations:
  - what: Record decoding uses Rust's `serde` with `#[serde(deny_unknown_fields)]` instead of Pydantic's extra="forbid"; the behavior is equivalent.
    why: Pydantic is Python-only; Rust's serde provides the same strict validation across both server and worker.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/models.py#L7-L8
  - what: Monetary amounts use `rust_decimal::Decimal` instead of Python float to avoid precision loss in budget tracking and spend calculations.
    why: Budgets and spend are financial values that must round-trip and sum correctly; floats introduce precision errors that accumulate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/models.py#L45
out_of_scope:
  - B4501 owns job persistence, repository queries and optimistic updates; these state functions are pure and own no database access.
  - B4502 owns source storage integration and sample/evidence fetching; record construction here is separated from retrieval.
  - B4503/B4505/B4504 own HTTP routes, authorization and billing; they call these state functions as pure operations.
  - B132 owns worker implementation and the server's route factories; these records are shared by both.
pitfalls:
  - 'The oracle helper for this task is pre-registered as lens_state in the lens group. Replace the stub Op in tools/oracle/src/helpers/lens/state.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/lens_state.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Claim job only succeeds if the worker has access to the lens scope; denial does not error, it returns the original lens unchanged.
  - Finding identity uses a 24-character SHA256 prefix, and legacy identity uses a different hash to support finding migration from older versions.
  - Occurrence sets deduplicate by execution_id and must be sorted for determinism; they contain only support evidence, not counterexamples.
  - Budget month format uses strftime("%Y-%m") so renewal happens exactly at calendar month boundaries, not rolling 30-day windows.
  - The settling window of two minutes before now ensures executions from shortly before the job creation time are included in the analysis.
  - "snapshot_finding overwrites the merged finding's title, description, suggestion, limitation and evidence from the draft, then resets first_seen, last_seen and occurrences to the draft's support evidence only, discarding all accumulated occurrence history. This is distinct from merge_finding's accumulation behavior."
  - "merge_finding evidence deduplication deduplicates on (execution_id, span_id, quote) using a dict key and caps the final list at 20 entries with [-20:], so evidence older than the 20 most recent is discarded once a finding accumulates more than 20 pieces."
  - "LensSettings.unique_checks has three distinct validation errors with different literal messages: 'Each check must have a unique ID' for duplicate IDs, 'Describe expected behavior or add an enabled check' for empty context with no enabled check, and 'expected_behavior is reserved for the behavior description' for a check ID of 'expected_behavior'."
