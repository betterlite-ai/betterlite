    why: Complete record definitions with validation, defaults and field constraints.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/state.py#L1-L151
    why: Pure state transitions including lease/budget renewal, job queuing, and finding merge logic.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/state.py#L48-L81
    why: Claim job lease attempt tracking and three-attempt reclaim limit on failure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/state.py#L91-L135
    why: Deterministic finding identity computation, occurrence deduplication and status reopening.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/state.py#L138-L151
    why: snapshot_finding overwrites fields from draft and resets occurrence tracking, distinct from merge behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/models.py#L47-L55
    why: "LensSettings.unique_checks validator: duplicate ID, missing-enabled-check, and reserved ID errors."
dod:
  - text: All records decode from JSON and bytes without accepting extra fields, every field with a constraint validates that constraint, and all defaults match the pinned source.
    proof: [records-validation-tests, lens-decode-tests]
  - text: State transitions preserve job lease timeouts, budget month renewal, three-attempt reclaim, and finding identity matching with legacy backwards compatibility.
    proof: [state-transition-tests, finding-identity-tests]
  - text: "snapshot_finding overwrites merged finding fields from draft and resets first_seen, last_seen and occurrences to draft's support evidence, discarding accumulated occurrence history."
    proof: [snapshot-finding-tests]
  - text: "LensSettings.unique_checks rejects duplicate check IDs, empty context with no enabled check, and reserved \"expected_behavior\" check IDs with distinct error messages."
    proof: [check-validation-tests]
  - text: "merge_finding evidence deduplication caps the final list at 20 entries; entries beyond the 20 most recent are discarded."
    proof: [evidence-cap-tests]
  - text: Record decoders support both JSON and raw byte input, with separate fuzzing corpus for the byte path.
    proof: [lens-decode-fuzz, lens-decode-corpus]
checks:
  optional: []
  commands:
    - id: records-validation-tests
      why: Record field constraints (lengths, patterns, ranges, enums) or extra-field rejection are missing.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^models::/)'
    - id: state-transition-tests
      why: Job queuing, claiming with lease renewal, budget renewal, or attempt limits are absent.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^state::transitions::/)'
    - id: finding-identity-tests
      why: Finding identity determinism, legacy hash compatibility, occurrence dedup or status reopening are missing.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^state::finding_identity::/)'
    - id: snapshot-finding-tests
      why: snapshot_finding does not overwrite draft fields or reset occurrences correctly.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^state::snapshot_finding::/)'
    - id: check-validation-tests
      why: "LensSettings.unique_checks does not validate all three conditions: duplicate IDs, missing enabled check with empty context, and reserved \"expected_behavior\" ID."
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^models::check_validation::/)'
    - id: evidence-cap-tests
      why: merge_finding does not cap evidence at 20 entries or discard older entries correctly.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^state::evidence_cap::/)'
    - id: lens-decode-tests
      why: Record JSON decoding with constraint validation or rejection of extra fields is absent.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^models::decode::/)'
    - id: lens-decode-fuzz
      why: Byte-string record decoder lacks implementation or test harness.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(replays_the_lens_model_corpus)'
    - id: lens-decode-corpus
      why: No seed corpus exists for byte-string record decoding.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-lens/fuzz/corpus/lens_model/lens-record-*)"
