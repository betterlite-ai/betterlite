id: B4500
title: Lens records, job transitions and finding identity
description: >-
  Build the shared Lens wire records and pure state transitions that underpin all
  Lens analysis tasks. Implement strict extra-field rejection across all records,
  deterministic finding identity from lens id/check id/kind/title hashes with legacy
  backwards compatibility, and lease tracking with three-attempt reclaim limits.
  Preserve the two-minute settling window for execution lookback, five-minute worker
  leases with renewal through progress updates, and budget month tracking for monthly
  spend renewal. Keep all defaults: source=traces, lookback_hours=24, interval_minutes=15,
  sample_size=null, sample_percent=100, concurrency=8, monthly_budget=100. Findings
  reopen only when resolved and new supporting execution evidence arrives. Occurrence
  sets track only support evidence, not counterexamples. The record decoder must support
  byte-string decoding for shared use by server routes and the worker executable with
  no duplicate record definitions. Use Decimal for monetary amounts throughout. Pure
  state functions take and return immutable records, never modify in place.
scope:
  paths:
    - crates/betterlite-lens/Cargo.toml
    - crates/betterlite-lens/src/models.rs
    - crates/betterlite-lens/src/models/**
    - crates/betterlite-lens/src/state.rs
    - crates/betterlite-lens/src/state/**
    - crates/betterlite-lens/fuzz/corpus/lens_model/lens-record-*
    - crates/betterlite-lens/fuzz/fuzz_targets/lens_model.rs
    - tools/oracle/src/helpers/lens/state.rs
    - tools/oracle/src/helpers/lens/state/**
    - tools/oracle/helpers/lens_state.py
    - tools/oracle/helpers/lens_state/**
    - tools/oracle/cases/helpers/lens-state/**
  lint_tables: false
