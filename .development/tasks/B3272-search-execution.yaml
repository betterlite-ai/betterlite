id: B3272
title: Search call preparation and execution
description: >-
  Build crates/betterlite-core::search with shared native search invocation, preserving string/list query
  validation, explicit-option precedence over provider kwargs, provider lookup, initial credential/URL validation,
  logging updates and exception conversion. Both public sync and async semantics use the same operation, including
  the async None-response error, without copying Python executor mechanics into Rust. B3276 owns the HTTP handler
  dispatch (BaseLLMHTTPHandler.search and async_search).

  Export from betterlite-core::search: async search function (async_search_impl or similar) that takes query
  (string or list), provider name, optional parameters (max_results, search_domain_filter, max_tokens_per_page,
  country), api_key, api_base, timeout, extra_headers and kwargs, and returns SearchResponse on success or raises
  an exception. The sync search function wraps the async one or invokes it in a context-preserving executor.
  Both functions build optional parameters from explicit arguments (precedence over kwargs), validate the query
  type and contents, construct the provider config, validate the environment, resolve the full URL, log the
  request, call the HTTP handler via B3276, and convert exceptions through the error dispatch layer.

  Query validation: string or list of strings only; reject other types or lists with non-strings.
  Optional parameter precedence: explicit arguments win over kwargs; kwargs contribute only unset options.
  Provider lookup: raise ValueError if the provider has no search config; use BaseSearchConfig contract.
  Credential/URL validation: call validate_environment for headers and resolve api_base trust; call get_complete_url
  for the full URL. Logging: use Logging.update_from_kwargs with model name, optional_params and litellm_params.
  Exception conversion: use litellm.exception_type (from betterlite-error) to wrap all exceptions with model,
  provider, original exception and completion_kwargs, preserving the custom_llm_provider and custom_llm_provider_response_headers.
  The async path invokes the sync function in a thread context that preserves contextvars, detects
  synchronous (immediate SearchResponse) vs. asynchronous (Coroutine) returns, and raises ValueError if the
  response is None.

