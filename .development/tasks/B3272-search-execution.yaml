deviations:
  - what: Rust's type system enforces query string/list validation at compile time; runtime type checks validate list contents only.
    why: Rust does not have the same dynamic type checking as Python, so validation is static where possible and deferred where not.
  - what: Optional parameters are merged into a map from explicit arguments and then filtered kwargs, not built separately for each provider.
    why: A single merged map is simpler and avoids duplicating precedence logic; explicit arguments win by construction.
  - what: Provider lookup raises ValueError immediately if the search config is not available, not returning None with fallback logic elsewhere.
    why: betterlite prefers errors to None returns and no-op defaults; the caller decides whether to retry or skip.
  - what: The async path uses Tokio's spawn_blocking or similar executor, not the Python loop.run_in_executor API.
    why: Rust async execution is task-based, not loop-based; the native async runtime handles blocking operations.
  - what: Logging is initialized before the HTTP handler call, not asynchronously after.
    why: Logging should reflect the request about to be sent, not the response received; it is safer to log before.

out_of_scope:
  - Provider-specific transforms (validate_environment, get_complete_url, sign_request overrides); each provider implements its own BaseSearchConfig via B3270.
  - HTTP transport and request dispatch (httpx, headers, streaming); that is B3276.
  - Router selection, fallback execution and credential override; that is B3273.
  - Pricing and cost calculation; that is B3274.
  - Management routes and search tool registry; that is B3271 and B3275.
  - "ProviderConfigManager.get_provider_search_config factory (litellm/utils.py:9859-9916), filter_out_litellm_params function (L4196-4199) and client decorator (L1674-L2315) are owned by B157; they are dependencies only."
  - The get_secret_str function and server-credential lookup policy; that is B3270 scope for trust checks only.
  - Exception alert side effects and async retry orchestration; that is handled by the router fallback executor.

pitfalls:
  - "Query validation checks isinstance(query, str or list) and rejects list items that are not strings; non-string lists like ['a', 1] are rejected."
  - "Optional parameters built by explicit arguments only; kwargs are filtered and merged, but explicit arguments always win."
  - "Provider lookup uses ProviderConfigManager.get_provider_search_config(SearchProviders(provider_name)); failure raises ValueError, not None return."
  - "Timeout precedence: timeout argument or request_timeout constant; zero timeout selects the default, not a zero-duration operation."
  - "Async execution detects None response and raises ValueError; None is treated as a fatal error, not an empty result."
  - "Logging object is obtained before HTTP call and updated with the full URL, not mock-logged or deferred."
  - "Exception conversion preserves original_exception and completion_kwargs (locals() at function entry); custom_llm_provider and custom_llm_provider_response_headers pass through."
  - "The sync function returns SearchResponse or Coroutine unchanged from the handler; mixed types (sometimes sync, sometimes async) are allowed."

