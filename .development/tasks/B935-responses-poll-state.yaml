id: B935
title: Responses polling state and selection
description: >-
  Own polling_handler.py in full. Build ResponsePollingStore in betterlite-core with B126 Redis,
  injected clock/UUID, B1138 response records and B1087 decoding limits. Keep the key prefix
  litellm:polling:response: and ID prefix litellm_poll_. State updates are read/modify/write,
  resetting the TTL on every write; they are not transactions or compare-and-swap operations.
  A typed deployment projection supplied by the caller contains the model-name index and
  deployment parameters needed by should_use_polling_for_request; no router method is called.

  Load litellm_settings.responses.background_mode.polling_via_cache=false, native_background_mode=[]
  and ttl=3600 through B002. Support false, "all" and provider lists for selection; other scalar
  selector values are accepted but select nothing, matching the source. TTL passes to B126 without
  clamping. No new environment variable exists. Add named config-loader cases for all three keys,
  defaults and overrides, including environment-reference resolution through B002. Invalid object
  shapes/types use the typed-config deviation below, not an invented LiteLLM warning fallback.

  Preserve the architect's private PollRecord {owner,response} envelope. B732 supplies trusted
  user/team/admin identity and key fingerprint, B929 the identified-owner policy. Require equal
  fingerprints if neither user nor team exists; legacy ownerless records fail closed when auth
  is enabled. Anonymous records are accessible only in configured auth-disabled mode. B080
  supplies owner at admission; updates never replace it. B938 maps denied access to 403 with
  type=permission_error,param=null,code="403". Public successful JSON contains only response.

  HelperCall::ResponsesPollState compares the actual pinned handler using independently scripted
  Redis effects; no provider call occurs here. Compare response projections, keys, TTL and warning
  order; inspect the private envelope natively. decode_responses_poll_state(bytes,ApiLimits) is
  the bounded Redis JSON boundary used by get/update and its fuzz target/replay. Keep valid JSON
  extension fields; malformed JSON errors propagate, not cache misses. Add typed invalid-shape
  tests separately from the source's dynamic exceptions. Source count 244 plus 15 settings-branch
  lines; budget 240 logic, 155 tests, 80 fixtures, 85 adapters, 65 decoder/fuzz, 80 config and
  35 wiring, 740 total under 780.
