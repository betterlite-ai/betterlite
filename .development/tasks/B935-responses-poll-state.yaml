references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/polling_handler.py#L1-L319
  why: Complete state store, truthiness-sensitive patch semantics and provider-based polling selection.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6552-L6566
  why: The exact nested settings names and default false, empty list and 3600-second TTL.
dod:
- text: >-
    queued_record_and_cache_key injects UUID=00000000-0000-4000-8000-000000000001,time=1700000000
    and request metadata={trace:a},model=gpt-4o. Expect ID=litellm_poll_00000000-0000-4000-8000-000000000001,
    key=litellm:polling:response: followed by that ID, object=response,status=queued,created_at=1700000000,
    output=[],usage=null,metadata={trace:a}. The request model is not copied into this initial state;
    remaining model defaults are B1138's. TTL=3600 or an injected 17 reaches Redis. No Redis still
    returns the queued response without writing. is_polling_id("litellm_poll_") is true without UUID
    validation; "resp_a" is false. Missing metadata defaults to {}, not the whole request.
  proof: [queued-state, oracle, python-adapter]
- text: >-
    polling_patch_truthiness starts from status=queued,output=[old],usage={total_tokens:1},error={code:old}.
    status="" leaves status; output=[] replaces output. usage={},error={},incomplete_details={}
    leave existing values. A nonempty error={code:bad,message:failed} forces status=failed even
    with requested status=completed. reasoning={},tool_choice="",tools=[],model="",instructions="",
    temperature=0,top_p=0,max_output_tokens=0,previous_response_id="",text={},truncation="",
    parallel_tool_calls=false,user="",store=false all replace their fields because they are non-null.
    Null values leave fields untouched. Every successful update resets TTL and logs resulting status/output count.
  proof: [patch-state, oracle, python-adapter]
- text: >-
    polling_missing_cancel_delete observes absent Redis: get=null,update=no-op,cancel=true,delete=false.
    Missing or empty cached value makes update warn "No cached state found for polling_id: %s"
    and perform no set; cancel still returns true. Existing cancel writes status=cancelled with
    refreshed TTL but does not signal a running provider. Delete with Redis calls async_delete_cache
    and returns true regardless of whether a key existed. Redis get/set/delete errors propagate.
    Corrupt JSON is an error; valid get returns the stored projection without a new TTL write.
  proof: [missing-state, oracle, python-adapter]
- text: >-
    polling_selection requires background=true, a truthy selector and Redis. "all" selects every
    model except an exact native_background_mode match. Provider list [openai] selects openai/gpt-4o;
    anthropic/model never consults a router alias even if its deployments include OpenAI. An
    unprefixed alias scans every indexed deployment, preferring nonempty custom_llm_provider over
    its model prefix; any match enables polling. Missing router, empty indices, true, "openai"
    and unmatched lists return false. A bad index logs "Could not resolve provider for model %s: %s"
    at debug and returns false. A native-mode skip and successful alias match keep their debug events.
  proof: [selection, oracle, python-adapter]
- text: >-
    polling_owner_retention keeps owner user=a,team=t,key fingerprint=k through patch/cancel and
    removes it with expiry/delete; the public response never exposes owner. Same user/team and
    proxy admin follow B929; ownerless identities require fingerprint equality. Other owners,
    legacy ownerless records with enabled auth and Anonymous records outside auth-disabled mode
    produce a typed denial for B938's 403 permission_error envelope. These are native deviation
    tests; the MIT helper cannot prove the extra ownership restriction.
  proof: [owner-state]
- text: >-
    loads_polling_settings runs B002's real loader: absent keys yield false,[],3600; overrides
    "all",[gpt-4o],17 are accepted/applied, as is provider selector [openai]. ttl=0/-1 is not
    clamped before B126. Scalar selector true or "other" loads but selects false. ttl="oops"
    and native_background_mode=7 fail with their full configuration paths under the stated deviation.
    New config, Redis JSON and helper-case corpora replay through their production decoders.
  proof: [config-tests, config-corpus, parser-corpus, helper-corpus]
checks:
  optional: [mutants]
  commands:
  - id: queued-state
    why: polling IDs, initial fields or cache TTL differ
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::queued_record_and_cache_key($|::)/)'
  - id: patch-state
    why: false/empty patches are treated uniformly instead of using the pinned per-field rules
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::polling_patch_truthiness($|::)/)'
  - id: missing-state
    why: missing state becomes a false cancellation or cache errors are silently swallowed
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::polling_missing_cancel_delete($|::)/)'
  - id: selection
    why: a prefixed model incorrectly falls through to router deployment scanning
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::polling_selection($|::)/)'
  - id: owner-state
    why: owner information is lost, exposed or bypassed on a legacy record
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::polling_owner_retention($|::)/)'
  - id: config-tests
    why: the polling keys are accepted without affecting the typed settings
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_poll_state::tests::loads_polling_settings($|::)/)'
  - id: config-corpus
    why: polling settings have no newly committed loader input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/responses-poll-state-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: corrupt Redis bytes bypass the production polling decoder
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/responses_poll_state.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_poll_state)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::replays_corpus$/)'
  - id: python-adapter
    why: state comparisons do not execute the pinned Redis state machine
    run: test -f tools/oracle/helpers/responses_poll_state.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the polling state helper lacks a new tagged seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_poll_state-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/responses-poll-state/queued-record-and-cache-key.yaml
- tools/oracle/cases/helpers/responses-poll-state/polling-patch-truthiness.yaml
- tools/oracle/cases/helpers/responses-poll-state/polling-missing-cancel-delete.yaml
- tools/oracle/cases/helpers/responses-poll-state/polling-selection.yaml
deviations:
- what: Authenticated access to another polling owner or an ownerless legacy record returns 403 permission_error,param=null,code="403"; successful response JSON is unchanged.
  why: Preserve the architect's polling-ownership decision and use the same 403 classification as Responses ID security.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/polling_handler.py#L40-L82
- what: Invalid polling configuration shapes such as ttl="oops" fail startup with the named key instead of failing later during Redis use; no HTTP listener starts.
  why: B002's typed configuration boundary rejects values that cannot form the configured operation.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6552-L6566
out_of_scope:
- B080 owns polling admission and queued HTTP response; B936 owns background consumption and B938 read/delete/cancel routes.
- All other proxy_server.py settings stay with their named config/API owners; only the responses background_mode branch is consumed here.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_poll_state in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_poll_state.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_poll_state.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A nonempty error overrides a requested completed status, but an empty error does not clear a prior error.
- cancel_polling returns true even without Redis and never cancels upstream work.
- A model containing slash does not fall back to router deployments after its prefix misses the provider list.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
