checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::responses_poll_state::/)
      - test(/::replays_corpus$/)'
  - id: case-queued-state-ttl
    why: the queued-state-ttl behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::queued_state_ttl($|::)/)'
  - id: case-update-missing-state-warning
    why: the update-missing-state-warning behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::update_missing_state_warning($|::)/)'
  - id: case-failed-update-error
    why: the failed-update-error behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::failed_update_error($|::)/)'
  - id: case-cancel-polling
    why: the cancel-polling behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::cancel_polling($|::)/)'
  - id: case-delete-polling
    why: the delete-polling behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::delete_polling($|::)/)'
  - id: case-background-cache-selection
    why: the background-cache-selection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::background_cache_selection($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_poll_state::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/responses-poll-state-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_poll_state)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/responses_poll_state.rs && grep -qF "decode_responses_poll_state"
      crates/betterlite-core/fuzz/fuzz_targets/responses_poll_state.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::responses_poll_state::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_poll_state.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_poll_state-*)"
      && grep -qE "^[[:space:]]+responses_poll_state:" tools/oracle/fuzz/corpus/helper_case/responses_poll_state-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-poll-state)"
  - id: poll-owner-tests
    why: trusted polling owner data is lost, exposed, or unavailable to authorization
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_state::tests::poll_owner_retention($|::)/)'
