id: B935
title: Responses poll state
description: >-
  Implement ResponsePollingHandler as typed Redis state transitions using B126 and injected clock/ID source. Expose
  queued state, partial updates, get/cancel/delete and polling selection with source TTL 3600 and litellm:polling:response:/litellm_poll_
  prefixes; add the exact polling config key consumed by the source, not a renamed knob. Load litellm_settings.responses.background_mode.polling_via_cache=false
  (false, all, or provider list), native_background_mode=[] and ttl=3600 seconds; read all environment references
  through betterlite-config.


  Implement crates/betterlite-core/src/api/responses_poll_state.rs. Use ResponsesPollStateInput and ResponsesPollStateResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions queued_state_ttl, update_missing_state_warning, failed_update_error,
  cancel_polling, delete_polling, background_cache_selection under api::responses_poll_state::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.responses.background_mode.native_background_mode
  defaults to []; litellm_settings.responses.background_mode.ttl defaults to 3600 seconds; litellm_settings.responses.background_mode.polling_via_cache
  defaults to false; also accepts all or a provider list. No environment reads occur outside betterlite-config.
  Test api::responses_poll_state::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  The production external-byte decoder is betterlite-core::api::responses_poll_state::decode_responses_poll_state(bytes:
  &[u8], limits: &ApiLimits), for json.loads input cached_state at litellm/proxy/response_polling/polling_handler.py:148;
  json.loads input cached_state at litellm/proxy/response_polling/polling_handler.py:224. Place its implementation
  in crates/betterlite-core/src/api/responses_poll_state.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-core/fuzz/fuzz_targets/responses_poll_state.rs passes arbitrary bounded bytes to that
  exact decoder; api::responses_poll_state::tests::replays_corpus replays newly committed seeds through the same
  function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesPollState in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_poll_state: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/response_polling/polling_handler.py: ResponsePollingHandler.__init__ (L21-L23);
  litellm/proxy/response_polling/polling_handler.py: ResponsePollingHandler.generate_polling_id (L26-L28); litellm/proxy/response_polling/polling_handler.py:
  ResponsePollingHandler.is_polling_id (L31-L33); litellm/proxy/response_polling/polling_handler.py: ResponsePollingHandler.get_cache_key
  (L36-L38); litellm/proxy/response_polling/polling_handler.py: ResponsePollingHandler.create_initial_state (L40-L82);
  litellm/proxy/response_polling/polling_handler.py: ResponsePollingHandler.update_state (L84-L213); litellm/proxy/response_polling/polling_handler.py:
  ResponsePollingHandler.get_state (L215-L226); litellm/proxy/response_polling/polling_handler.py: ResponsePollingHandler.cancel_polling
  (L228-L238); litellm/proxy/response_polling/polling_handler.py: ResponsePollingHandler.delete_polling (L240-L248);
  litellm/proxy/response_polling/polling_handler.py: should_use_polling_for_request (L251-L319). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 182 owned nonblank/non-comment/non-docstring Python lines (244 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 234 implementation,
  124 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 39 config tests/seeds
  and 40 wiring; 659 total within the 660-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B126 (Redis, Redis Cluster and Valkey),
  B171 (Direct helper oracle and URL path encoding), B198 (Injected call context and shared settings), B902 (Responses
  shapes), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Add internal PollRecord { owner: PollOwner, response: ResponsesAPIResponse }; PollOwner stores trusted user_id/team_id
  plus the B732 key fingerprint (never a raw API key), with an explicit Anonymous variant only for configured authentication-disabled
  mode. B080 supplies it after admission and before caching; keep it on every update/cancel and expire/delete it
  with the response in the same Redis value. Return only the response field to clients. Use B929 user/team/admin
  policy for identified callers, require a matching key fingerprint when no user/team identity exists, and reject
  missing legacy owner data when authentication is enabled. Disabled-auth Anonymous records are accessible only
  in that configured mode. The source stores only the response; this internal envelope implements the already decided
  polling-ownership change, not an enterprise feature. For oracle equality compare the response projection, keys
  and TTL; native tests inspect the private owner envelope rather than ignoring a wire difference. Add tests::poll_owner_retention
  covering initial write, partial update, cancel, delete, expiry and legacy records.


  The polling ownership denial uses HTTP 403 and {error: {type: authentication_error, param: null, code: "403"}};
  code is a string. This is a native-only deviation test, not a differential equality seed.
