deviations:
- what: Polling cache values carry a private trusted owner envelope; authenticated reads without a matching owner,
    including legacy owner-less records, return 403 authentication_error with param null and code "403" through
    B938. Public successful Responses JSON remains unchanged.
  why: 'ARCHITECT DECISION: extend ownership checks to polling IDs; retaining identity is required to enforce that
    decision.'
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/polling_handler.py#L40-L82
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- 'polling_handler.py:211 emits the diagnostic ''Updated polling state for %s: status=%s, output_items=%s''; retain
  its level and fallback instead of turning it into a hard error.'
- polling_handler.py:280 emits the diagnostic 'Model %s is in native_background_mode list, skipping polling via
  cache'; retain its level and fallback instead of turning it into a hard error.
review_level: security
budget:
  max_changed_lines: 660
  max_new_expects: 1
