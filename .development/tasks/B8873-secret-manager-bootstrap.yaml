id: B8873
title: Initialize the secret manager before resolving the rest of the config
description: >-
  Port ProxyConfig._initialize_secret_manager_from_raw_config, which get_config calls
  immediately before its general environment/secret-reference pass. B8379 leaves it to
  B4412, but B4412 only builds AWS/Google KMS clients and does not implement this wrapper.
  Without the wrapper, a credential that exists only in the selected manager can be
  resolved to null before that manager is available. Build the early bootstrap in
  betterlite::config_boot::raw_secret_manager, using B8590's select_secret_manager and
  B8500's existing SecretLookup. It must update the same manager state used by later
  config resolution and management reloads, not a temporary manager that is discarded.

  Own sections::secret_manager_bootstrap in betterlite-config. It projects the already
  parsed raw config into the presence and unresolved values of general_settings.
  key_management_system and general_settings.key_management_settings, preserving the
  original tree. These are existing keys, not a second policy schema: resolve and
  validate the settings through B4410's KeyManagementSettings implementation. The
  architect exposes the parsed-config stage before B002's whole-file reference
  resolution and registers this section there; never load and resolve the whole file
  merely to discover which manager should have resolved it. This projection consumes
  the existing parsed config value, not a new YAML byte parser.

  First inspect whether the shared state already has a manager client. If it does,
  return without reading or replacing its settings, even if the new config names a
  different system. If general_settings is absent, or no string-valued system resolves,
  return without initializing anything. Resolve an os.environ/ system name with the
  environment-only SecretLookup, since no manager exists at this point. A literal string
  is passed unchanged, including an empty or unsupported string so B8590 supplies its
  normal error. When key_management_settings is a mapping, resolve references in a
  clone using the existing recursive resolver and validate it as KeyManagementSettings;
  do not mutate the raw manager settings or any model credential in the original config.
  With no settings mapping, retain the current settings. Then call select_secret_manager
  with the resolved name, those settings, the operator config path and the injected
  environment. Install its returned client into the shared lookup before allowing the
  general reference pass to continue.

  Ordering is observable on failure. Settings are updated before manager selection;
  do not roll them back when selection fails. Propagate validation and manager-selection
  errors as their existing source errors. Preserve B8590's Azure Key Vault warning and
  no-client result when AZURE_KEY_VAULT_URI is missing; without a client a later call may
  try again. Existing-client short circuit must check the client, not merely whether
  a manager name/settings record exists. There is no new global or process-environment
  mutation. Own RawSecretManagerError locally for adapter failures with source chains.

  Defaults remain B4410's: no system/client, hosted_keys null, access_mode read_only,
  primary_secret_name null and store_virtual_keys false. The source has no dedicated
  bootstrap env flag. The config projection tests load absent and explicit settings,
  an environment-named system and nested environment references through the production
  staged loader, proving those keys are accepted without resolving model credentials
  early. Reuse B002's config_yaml decoder and add key-bearing corpus seeds; do not add
  another YAML decoder or cargo-fuzz target.

  Native binary tests under config_boot::raw_secret_manager::tests cover
  existing_client_skips_new_settings, absent_system_noop, system_from_environment,
  raw_config_unchanged, settings_before_selection, selection_error_keeps_settings,
  missing_azure_uri_can_retry and manager_only_credential_resolves_on_first_load.
  The last test drives the staged production load with a recording manager implementation
  whose credential is absent from the environment and verifies it remains a string in
  the final model parameters. A second get_config read must skip this bootstrap while
  that client exists; this does not remove any later explicit B8590 manager selection
  in load_config. No live cloud
  account is needed. B8379/B8613 call this adapter at the existing get_config boundary;
  their shared call-site changes are for the architect before dispatch. B129 already
  adds booted HTTP secret-resolution cases, and B124 adds a native startup regression
  for this call order, so do not create a helper that mutates proxy globals. Allow
  160 implementation/config lines, 240 tests and 30 corpus lines.
scope:
  paths:
    - crates/betterlite/src/config_boot/raw_secret_manager.rs
    - crates/betterlite/src/config_boot/raw_secret_manager/**
    - crates/betterlite/Cargo.toml
    - crates/betterlite-config/src/sections/secret_manager_bootstrap.rs
    - crates/betterlite-config/src/sections/secret_manager_bootstrap/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/secret-manager-bootstrap-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5789-L5830
    why: Complete owned bootstrap wrapper, including existing-client return and copy-before-resolution.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6064-L6076
    why: Bootstrap occurs before the full config reference pass and before runtime settings are applied.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5748-L5787
    why: Existing recursive reference resolver, used on the cloned manager settings only at this stage.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7179-L7239
    why: B8590's manager selection and client creation, reused rather than reimplemented.
dod:
  - text: Bootstrap reads unresolved manager settings without changing the raw config and initializes the shared client before a manager-only model credential is resolved.
    proof: [bootstrap-tests, config-tests]
  - text: Existing clients short-circuit reload, while selection failures retain the prior settings update and the Azure no-client fallback remains retryable.
    proof: [bootstrap-tests]
  - text: The staged config loader accepts existing manager keys and the added seeds replay through the shared YAML decoder.
    proof: [config-tests, config-corpus]
checks:
  optional: [mutants]
  commands:
    - id: bootstrap-tests
      why: A manager-only credential becomes null, the client is rebuilt on reload or failure ordering changes.
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^config_boot::raw_secret_manager::tests::/)'
    - id: config-tests
      why: The early manager view is missing, resolves too much or does not load through production config.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::secret_manager_bootstrap::/) - test(/replays_the_/)'
    - id: config-corpus
      why: No new manager-bootstrap seed exercises the existing config byte decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/secret-manager-bootstrap-*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
  - B8590 owns initialize_secret_manager and Azure Key Vault error handling; B4412 owns only the AWS/Google KMS implementations it calls. B8500 owns get_secret and B4410 manager contracts/settings.
  - B3662 owns _check_for_os_environ_vars and _resolved_config_value, and B002/B4142 own parsing/includes; this task projects their parsed input and orders their existing operations.
  - B8379 owns the rest of get_config and DB overlays; B8613 owns the startup caller. The other ProxyConfig methods and routes retain the owners listed in B124.
  - B129 owns the already planned secret-manager HTTP cases; its prerequisite list must include this early bootstrap rather than assuming late manager selection covers it.
pitfalls:
  - Resolving the whole config to obtain manager settings permanently loses manager-only credentials before client initialization.
  - A configured manager name without a client does not trigger the existing-client short circuit.
  - Updating settings and then failing manager selection is not an atomic operation in LiteLLM.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
