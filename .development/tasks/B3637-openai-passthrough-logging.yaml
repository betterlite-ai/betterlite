dod:
  - text: A route matching none of the five OpenAI predicates returns no result and the input kwargs; a route that matches picks its branch in the order chat, embeddings, image generation, image editing, Responses.
    proof: [openai-route-tests]
  - text: The model is the request body's model when the key is present, else the response body's, else empty, and an empty model sends every endpoint to the fallback chat handler with a warning.
    proof: [openai-model-tests]
  - text: The chat branch passes messages, optional_params, the request body, json_mode and the kwargs litellm_params to the transform, prices without a call type, and sets response_cost, model and custom_llm_provider on the kwargs and the call log.
    proof: [openai-chat-tests]
  - text: The embeddings branch stores the cost in the response's hidden params and a failed embedding cost gives 0.0 with no error.
    proof: [openai-embed-tests]
  - text: Image generation and editing both set call_type to the image generation value, build an ImageResponse from response_body["data"], and use their own cost helper.
    proof: [openai-image-tests]
  - text: The Responses branch uses B3635's builder and its cost, and a failure in it returns no result without the chat fallback.
    proof: [openai-responses-tests]
  - text: The end user is request_body["user"] as is, merged into proxy_server_request.body.user without dropping other keys, and B3630's end-user function is not used on the OpenAI paths.
    proof: [openai-user-tests]
  - text: An error in a chat branch falls back to the base chat handler with the kwargs written so far, an error in any other branch returns no result with those kwargs, and a fallback error is returned.
    proof: [openai-fallback-tests]
  - text: The streaming entry builds the response from Responses terminal parse or chat assembly, prices with the right call type, stores the standard logging object in the kwargs, and returns no result with empty kwargs on none or on any error.
    proof: [openai-stream-tests]
