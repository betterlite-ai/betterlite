deviations:
  - what: LiteLLM's static method and **kwargs become a struct method that takes B3650's typed input, and the streaming entry takes B3650's CollectedChunksInput plus url_route.
    why: Rust has no keyword spreading; B3606's adapter and B3608 build the structs from the same values. result, cache_hit, the unused model argument and the endpoint_type and success handler arguments are never read, so they are not parameters.
  - what: A failed non-streaming branch is caught as a typed error. LiteLLM's blanket `except Exception` also catches Python bugs such as a missing key or attribute.
    why: Rust has no runtime attribute errors and the no-panics rule leaves typed errors as the only case.
  - what: The streaming entry writes the end user into the kwargs copy of litellm_params only. LiteLLM copies the call log's litellm_params one level deep, so a nested proxy_server_request dict is shared and the write also shows in the call log.
    why: Rust holds a deep copy. The success handler reads the kwargs and the stored standard logging object, so the call log's nested copy is not read afterwards.
out_of_scope:
  - "OpenAI and Azure URL classification, the route predicates and the image, embedding and Responses cost helpers: B3635 owns them; this task calls them."
  - "count_relayed_prompt_tokens and _build_complete_streaming_response: B3636 owns them. B3636 also serves Azure's collector, which calls the same assembly."
  - "The shared base handler passthrough_chat_handler and the PassthroughProvider trait: B3650 owns them; this task calls the handler for the fallback."
  - "create_response_logging_payload and end_user_from_request_body: B3630 owns them. This task owns only OpenAI's user rule."
  - "OpenAIConfig.transform_response (B668), parse_terminal_response_from_stream_chunks (B508), completion_cost (B068) and get_standard_logging_object_payload (B190)."
  - "Choosing this handler for a route (is_openai_route, _is_supported_openai_endpoint) and the adapter that builds PassthroughChatInput: B3606 owns them."
  - "Stream routing and the call into the collected-chunks handler: B3608 owns it."
pitfalls:
  - The no-model branch is outside the guarded block and runs for every endpoint, so an embeddings or image request with no model goes to the chat transform and its error is returned, not swallowed.
  - The model test is key presence on request_body, so a present but empty "model" wins over response_body["model"] and then triggers the no-model branch.
  - Only the chat branch passes messages, optional_params, request_body and json_mode to the transform; the fallback and the trait method pass empty ones, so the same reply can transform differently on the two paths.
  - The end user is written with setdefault chains, so existing proxy_server_request keys and body keys survive; Anthropic's and the base payload step replace the whole proxy_server_request.
  - The non-streaming path builds the standard logging object and discards it, while the streaming path stores it in kwargs["standard_logging_object"]; do not copy one into the other.
  - Image editing sets the same call_type, "passthrough-image-generation", as image generation; there is no separate editing value.
  - The streaming error path returns empty kwargs, while the non-streaming non-chat error path returns the kwargs as they stand.
  - The streaming model default is "gpt-4o" only when the key is missing; an empty string stays empty and goes to the assembler and cost as is.
  - The Responses predicate matches any path containing "/responses", and in the stream path it alone picks the terminal-event parser and the "responses" call type; every other route uses the chat assembler.
  - The fallback runs only for chat completions; Responses, embeddings and image errors end with no result, and that response is then not priced by this module at all.
review_level: security
