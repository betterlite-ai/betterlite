id: B3637
title: OpenAI passthrough response and stream logging
description: >-
  Build the OpenAI leaf of pass-through response logging in betterlite-server, in the module openai_passthrough_logging (crates/betterlite-server/src/pass_through_logging/openai_passthrough_logging.rs and its folder; the skeleton declares it).
  It turns a relayed OpenAI or Azure OpenAI reply, whole or streamed, into the response object and the kwargs that the success logger prices and writes as spend. It covers five endpoints: chat completions, embeddings, image generation, image editing and the Responses API.
  A wrong cost or a lost end user here means wrong spend for the key, so the order of steps and the fallbacks below are exact.
  Nothing here holds module-level state. The struct takes its collaborators in its constructor. This task writes glue and the order of calls; the work itself is done by tasks already merged, so call them and do not copy their logic.


  Collaborators, called and not defined here. B3635 (betterlite-core): the route predicates for chat completions, embeddings, image generation, image editing and Responses, the image cost helpers, the embedding cost helper (zero on failure) and the Responses builder that returns a response with its cost. B3636 (betterlite-core): the relayed stream assembly that turns raw chunk strings into one chat response, or none. B508: OpenAIResponsesAPIConfig.parse_terminal_response_from_stream_chunks. B668: OpenAIConfig.transform_response (betterlite-openai). B004: convert_to_model_response_object for the embedding shape. B1035: the EmbeddingResponse and ImageResponse types. B068: completion_cost. B190: get_standard_logging_object_payload. B247: CallLog, the per-call log (LiteLLM's logging object with model_call_details, call_type and litellm_call_id). B3605: the response-object enum. B3608: CollectedChunksHandler, CollectedChunksCall, HandlerOutcome and HandlerError. B3630: ResponseLoggingKwargs. B3650: PassthroughProvider, PassthroughChatLogger, PassthroughChatInput, CollectedChunksInput, PassthroughOutcome and PassthroughLoggingError. Read the merged code for the exact Rust names and signatures and use them; the names above are the roles. If a function you need is not there, say so in the report notes and stop.


  Constructor and public surface, pinned. B3606 (the provider dispatcher) and B102 (the wiring) call these, so names and argument lists do not change.
  `pub struct OpenAiPassthroughLogger` with `OpenAiPassthroughLogger::new(tools: Arc<dyn OpenAiLoggingTools>, payload: <the payload collaborator type that PassthroughChatLogger::new takes>) -> OpenAiPassthroughLogger`. The constructor builds its own PassthroughChatLogger from an OpenAiProvider (below) and that payload, and keeps it for the fallback path.
  `OpenAiLoggingTools` is a trait so tests can fake the calls; one production struct, OpenAiLoggingToolbox, forwards each method to the task named in brackets. Methods: `chat_response` (B668 transform_response with the full argument list of the chat branch below), `embedding_response` (B004 convert_to_model_response_object, embedding shape), `embedding_cost` (B3635), `image_cost` for generation and for editing (B3635), `responses_with_cost` (B3635), `terminal_response` (B508), `stream_response` (B3636), `completion_cost` (B068, with an optional call type) and `standard_logging_object` (B190, status "success"). The trait returns this module's typed errors.
  The handler, synchronous: `impl OpenAiPassthroughLogger { pub fn openai_passthrough_handler(&self, input: PassthroughChatInput<'_>) -> Result<PassthroughOutcome, OpenAiPassthroughError> }`. It takes B3650's PassthroughChatInput as is (upstream reply, parsed response_body, call log, url_route, times, request_body, kwargs), so B3606's adapter builds one struct for every shape. The full path is betterlite_server::pass_through_logging::openai_passthrough_logging::OpenAiPassthroughLogger.
  The streaming entry: `impl OpenAiPassthroughLogger { pub fn openai_collected_chunks(&self, input: CollectedChunksInput<'_>, url_route: &str) -> Result<PassthroughOutcome, OpenAiPassthroughError> }` and `impl CollectedChunksHandler for OpenAiPassthroughLogger`, which B3608 calls once a stream ends and which forwards to openai_collected_chunks with call.url_route. Get the CallLog from CollectedChunksCall the way B3640's collected-chunks handlers do.
  `OpenAiPassthroughError` is this module's thiserror enum with variants Tools (wrapping the typed error of a collaborator, with `source`), Chat (wrapping PassthroughLoggingError) and MissingLitellmParams. It converts into HandlerError. Only the fallback chat path can return it from the non-streaming handler; the streaming entry never returns Err.
  `OpenAiProvider` implements B3650's PassthroughProvider: provider_name is OpenAi; transform_chat_response is B668's transform with no messages, empty optional params, empty api key, empty request data, json_mode false and empty litellm params (the same call the base handler makes); build_complete_streaming_response is B3636's assembly with no messages.


  openai_passthrough_handler, in LiteLLM's order.
  1. Classify url_route with B3635's five predicates. When none is true, return result None and the input kwargs unchanged.
  2. model is request_body["model"] when the key is present (even when its value is null or empty), else response_body["model"] when present, else "". When model is empty (or null), log at warning level "No model found in request or response for OpenAI passthrough cost tracking" and return the result of the fallback chat handler (step 6) with the kwargs as given. This applies to every endpoint, not only chat, and an error from that call comes back as Err because nothing wraps it.
  3. Everything from here to the return is one guarded block. custom_llm_provider is the kwargs value when set, else "openai". The branches are exclusive and tested in this order: chat completions, embeddings, image generation, image editing, Responses.
  Chat completions: B668's transform_response over the upstream reply with model, messages = request_body["messages"] (empty list when missing), optional_params = request_body["optional_params"] (empty map when missing), empty api key, request_data = the whole request body, json_mode true only when request_body["response_format"]["type"] is "json_object" (a missing response_format counts as no json mode), and litellm_params = the kwargs litellm_params (empty when missing or null). Then response_cost = completion_cost(response, model, custom_llm_provider) with no call type.
  Embeddings: the embedding response built from response_body with B004; response_cost = B3635's embedding cost (0.0 and a warning on any failure); store the cost in the response's hidden params under "response_cost".
  Image generation: response_cost = B3635's image generation cost from model, response_body and request_body. Set the call log's call_type to "passthrough-image-generation". The response is an ImageResponse with data = response_body["data"] (empty list when missing) and the model; store the cost in its hidden params.
  Image editing: the same as image generation but with B3635's image editing cost. It also sets call_type to "passthrough-image-generation" (the image generation value, as LiteLLM does).
  Responses: B3635's responses builder gives the response and its cost from the upstream reply, the model and the provider.
  Then set kwargs response_cost, model and custom_llm_provider.
  4. End user. When the kwargs carry a passthrough logging payload that is not empty, take the user with OpenAI's rule: when the payload's request_body is present and not empty, its "user" value as is, else none. Do not call B3630's end_user_from_request_body here; that function reads more keys and OpenAI's override does not. When the user is a non-empty string, write it at kwargs litellm_params.proxy_server_request.body.user, creating proxy_server_request and body when missing and keeping every other key already in them (LiteLLM's setdefault chain). This differs from the Anthropic and base payload steps, which replace proxy_server_request whole. A missing litellm_params at this point is the error case of step 6 (LiteLLM raises KeyError here).
  5. Build B190's standard logging object from the kwargs and the response with status "success" and drop it: the non-streaming path does not store it in the kwargs. Write model, custom_llm_provider and response_cost to the call log. Log at debug level "OpenAI passthrough cost tracking - Endpoint: {endpoint}, Model: {model}, Cost: ${cost:.6f}" with the endpoint named chat_completions, embeddings, image_generation, image_editing or responses. Return the response as the result with the kwargs.
  6. On any error in step 3 to 5, log at error level "Error in OpenAI passthrough cost tracking: {error}". For every endpoint except chat completions return result None with the kwargs as they stand (whatever the failed steps already wrote into kwargs and the call log stays). For chat completions run the fallback: B3650's PassthroughChatLogger.passthrough_chat_handler with the same input, the kwargs as they stand, and the OpenAI provider. A fallback error comes back as Err.


  The fallback and OpenAI's end-user rule. LiteLLM's base payload step calls the overridable _get_user_from_metadata, and OpenAI overrides it with `request_body["user"]` as is, so the fallback must use OpenAI's rule too. B3630's create_response_logging_payload calls end_user_from_request_body inside. If the merged function takes the lookup as an argument or a trait, pass OpenAI's rule from step 4 and write no copy. If it does not, write one private function in this module that repeats B3630's steps in the same order (cost, kwargs, call log response_cost, user, standard logging object stored in kwargs, debug log, response id, model, call log model, the same error log text) with only the user rule changed, wire it as the payload collaborator the constructor passes to PassthroughChatLogger, and say so in the report notes.


  openai_collected_chunks, the streaming entry. Every error in it is swallowed; the entry never returns Err.
  1. model = request_body["model"] when the key is present, else "gpt-4o". is_responses = B3635's Responses predicate on url_route. The kwargs start empty.
  2. complete response: for a Responses route B508's terminal-response parse of all_chunks, otherwise B3636's assembly of all_chunks with that model and no messages.
  3. When it gives none, log at warning level "Failed to build complete response from OpenAI streaming chunks" and return result None with empty kwargs.
  4. custom_llm_provider = the call log's value, else "openai". response_cost = completion_cost(response, model, custom_llm_provider), with call type "responses" on a Responses route and no call type otherwise.
  5. kwargs: response_cost, model, custom_llm_provider, call_type (the call log's call_type), messages (the call log's "messages" entry, none when missing) and litellm_params, a copy of the call log's litellm_params (empty when missing or null).
  6. End user: the same rule and write as step 4 above, reading the passthrough logging payload from the call log's "passthrough_logging_payload" entry and writing into the kwargs litellm_params copy.
  7. Build B190's standard logging object (status "success") and, when it is not none, store it in kwargs["standard_logging_object"]. This is stored here, unlike the non-streaming path, so the success handler adopts it and keeps the prompt/completion token split of a Responses reply.
  8. Write model, custom_llm_provider and response_cost to the call log. Log at debug level "OpenAI streaming passthrough cost tracking - Model: {model}, Cost: ${cost:.6f}". Return the response with the kwargs.
  Any error in steps 2 to 8 logs at error level "Error in OpenAI streaming passthrough cost tracking: {error}" and returns result None with empty kwargs (not the partial kwargs).


  Tests are native: module tests under pass_through_logging::openai_passthrough_logging::tests, every name starting with the group word the checks use (openai_route_, openai_model_, openai_chat_, openai_embed_, openai_image_, openai_responses_, openai_user_, openai_fallback_, openai_stream_). Fakes stand in for OpenAiLoggingTools and the call log; the real route predicates run. No route reaches this code until B3606 and B102 wire it, and the handler needs a live logging object, so there are no helper cases here; B3606 and B103 add the HTTP cases.
