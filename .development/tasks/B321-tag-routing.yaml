pitfalls:
- Fail-open is conditional on the source and recognition of the tag, not a blanket fallback to all deployments.
- A request cannot forge inherited constraints or disable an operator's routing policy.
- Apply filtering to the healthy pool without reviving cooled or blocked candidates.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
