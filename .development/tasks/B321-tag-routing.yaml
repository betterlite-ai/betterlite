id: B321
title: Tag policy across aliases and fallback chains
description: 'Wire B320 matching into B016 with typed policy resolution for router, group and server-supplied
  request controls. Carry inherited constraints and consumed routing tags through aliases, pre-routing
  decisions and B310 fallback hops. Use authenticated B052 context for trusted policy overrides and preserve
  diagnostic metadata without exposing unrelated caller metadata. Configuration boundary keys introduced
  or consumed here: enable_tag_filtering, tag_filtering_match_any, tag_routing_prefix. Pinned declaration
  defaults: enable_tag_filtering=None; tag_routing_prefix=None. Resolve env values once in betterlite-config,
  never in router code. Implement the owned native service in crates/betterlite-router/src/tag_routing.rs.
  Add ProbeOperation::TagRouting in tools/oracle/src/router_probes/mod.rs and the corresponding B321 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/tag_based_routing.py: _chain_allows_fail_open
  (L280-L288), _trusted_only_pool (L291-L320), _resolve_or_fail_open (L323-L349), _resolve_constraint_only_pool
  (L352-L377), _all_deployments_or_fallback (L380-L388), _chain_tag_filtering_override (L391-L410), _inherited_constraint_sets
  (L413-L432), _tag_known_to_group (L435-L450), _request_tags_after_router_consumption (L453-L474), get_deployments_for_tag
  (L477-L647), _tags_in_metadata (L650-L665), _get_tags_from_request_kwargs (L668-L695). Implement these
  behaviors through the typed Rust services above; synchronous facades and structural accessors reuse
  the same primitive instead of separate ports.'
