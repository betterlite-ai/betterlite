checks:
  optional:
  - mutants
  commands:
  - id: tag-routing-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::tag_routing_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: tag-routing-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::tag_routing_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/tag_routing.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/tag_routing.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/tag-routing-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/tag-routing-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/tag-routing-" && grep -Fq 'enable_tag_filtering' crates/betterlite-config/fuzz/corpus/config_yaml/tag-routing-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: chat-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-openai/fuzz/corpus/chat_request/tag-routing-valid.json && test -f crates/betterlite-openai/fuzz/corpus/chat_request/tag-routing-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request
      | grep -Fq "/tag-routing-" && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
