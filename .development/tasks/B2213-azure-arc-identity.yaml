id: B2213
title: Azure Arc managed-identity challenge protocol
description: >-
  Implement the Azure Arc credential protocol reached through azure-identity 1.25.2 and MSAL 1.37.0, the versions
  in the pinned LiteLLM uv.lock. Inject host platform, environment, file metadata/reader, transport and clock; the
  challenge may select only a basename under the operator host token directory.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Named case contracts: arc_endpoint_selection: MSAL uses IDENTITY_ENDPOINT when both that key and IMDS_ENDPOINT
  exist, including empty values. Otherwise an installed /opt/azcmagent/bin/himds on linux or ${ProgramFiles}\AzureConnectedMachineAgent\himds.exe
  on win32 enables http://localhost:40342/metadata/identity/oauth2/token. No process is executed. Preserve hosted-protocol
  precedence in caller B699/B676. arc_challenge_request: GET endpoint with api-version=2020-06-01, resource and
  Metadata: true; parse WWW-Authenticate case-insensitively regardless of first-response status. Require exactly
  one = and left side case-insensitive basic realm, with no trimming or quote removal. Missing/malformed header
  raises ManagedIdentityError Unrecognizable WWW-Authenticate header: {headers}, wrapped by the SDK as ClientAuthenticationError
  with Azure Arc managed identity configuration not found in environment. prefix. arc_restricted_key: Resolve only
  basename(challenge value), remove its last extension and add .key under /var/opt/azcmagent/tokens on linux or
  expanded %ProgramData%\AzureConnectedMachineAgent\Tokens on win32. Do not open the supplied directory, do not
  require its original suffix to be .key. Check stat size before read: 4096 bytes allowed, larger raises Local key
  file shall not be larger than 4KB. Preserve file-not-found/read errors and unsupported platform error Platform
  {platform} was undefined and unsupported. arc_second_request: Read the entire key file as text without stripping
  newline; make one further GET with the same query plus Authorization: Basic {secret} (no base64 encoding). Never
  put the secret in query, error or debug output. No arbitrary request URL or file path is fetched. arc_token_reply:
  Truthy access_token and expires_in yield integer expiry duration, token_type default Bearer and optional resource;
  SDK computes expiry from its clock. Missing/falsey fields or malformed JSON produce error invalid_request and
  response.text; outer SDK returns CredentialUnavailableError with Token request error: (invalid_request) {text}.
  Preserve negative and numeric-string durations. arc_user_identity: MSAL rejects user-assigned identity before
  sending: Invalid managed_identity parameter. Azure Arc supports only system-assigned managed identity, See also
  https://learn.microsoft.com/en-us/azure/service-fabric/configure-existing-cluster-enable-managed-identity-token-service;
  SDK wraps it as ClientAuthenticationError, not an unavailable fallthrough.


  Load PROGRAMDATA, ProgramFiles through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest azure_arc_identity_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  PROGRAMDATA/ProgramFiles default absent and are operator environment inputs used only for Windows path expansion;
  fixtures inject the platform and path expansion. These are not request body fields.


  Implement crates/betterlite-azure/src/azure_arc_identity.rs with adjacent tests under azure_arc_identity/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_arc_identity_cases in betterlite-azure with these exact named cases (one per oracle
  file): arc_endpoint_selection, arc_challenge_request, arc_restricted_key, arc_second_request, arc_token_reply,
  arc_user_identity. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_arc_identity* using HelperCase: kind: helper
  and the externally tagged azure_arc_identity variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_azure_arc_identity that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_arc_identity_reply consumes Arc challenge header bytes and JSON token reply bytes
  in crates/betterlite-azure/src/azure_arc_identity.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_arc_identity.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_arc_identity.
  The adjacent test replays_the_azure_arc_identity_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_arc_identity_credential_identity_isolation in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_arc_identity_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 205 production lines, 215 behavior/config-test lines, 105 combined
  Rust/Python adapter lines, 65 parser target/replay lines, 25 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines. The production allowance includes 310 lines for the referenced
  SDK protocol that LiteLLM delegates.
