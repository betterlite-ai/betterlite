deviations: []
out_of_scope:
- B676 owns ManagedIdentityCredential selection/IMDS and hosted environment config; B699 owns App Service, Azure
  ML, Cloud Shell and Service Fabric. Legacy azure.identity._credentials.azure_arc ArcChallengeAuthPolicy/_validate_key_file
  are not called by the selected MsalManagedIdentityClient; do not port their different status gate/path checks.
- The Python package bridge is B159. This native protocol uses the lower HTTP pool B173 and redaction B187, not
  the Python SDK at runtime.
- 'Function ownership inventory litellm/secret_managers/get_azure_ad_token_provider.py: infer_credential_type_from_environment
  L11-L34; get_azure_ad_token_provider L37-L135 belong to B677.'
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_arc_identity in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/arc_identity.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_arc_identity.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The active Arc path does not require the first reply to be 401 before reading WWW-Authenticate.
- The challenge path contributes only its basename, and an arbitrary extension is replaced with .key.
budget:
  max_changed_lines: 650
  max_new_expects: 0
review_level: security
