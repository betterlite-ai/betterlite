id: B3874
title: Prometheus configuration and collector factories
description: >-
  Port litellm/integrations/prometheus.py:102-112, 165-188, 257-265, 881-1021,
  1027-1099, 1105-1232 to Rust in crates/betterlite-prometheus. Build validated
  include/exclude filtering, frozen metric label sets, registry lookup and
  disabled/excluded-label collectors. Expose the native collector interface
  used by independent emitters, with decimal finite values and explicit
  infinity/NaN handling so metrics do not force floats into money or gateway code.

  Build _NON_ENUM_METRIC_LABELS, a frozenset of label names that are not part of
  the UserAPIKeyLabelNames enum: guardrail_name, status, error_type, hook_type,
  purpose, file_type, result. These labels appear on guardrail and service metrics.

  Build _ExcludedLabelMetric, a wrapper around a Prometheus metric that filters
  excluded labels from every labels(...) call. When a metric is registered with
  a full set of labelnames and then prometheus_exclude_labels removes some,
  _ExcludedLabelMetric drops the excluded labels from the call and returns the
  underlying metric with only the kept labels, or returns the metric directly if
  no labels remain.

  Implement get_instance, a static lookup that scans the callback registry to find
  a registered PrometheusLogger. This enables other parts of the system to emit
  metrics without depending on B3875's constructor.

  Build configuration parsing: _parse_prometheus_config reads
  prometheus_metrics_config (a list of PrometheusMetricsConfig dicts or objects),
  validates all metrics and labels, and returns a dict mapping metric name to
  included label lists for label filtering. _parse_exclude_config reads
  prometheus_exclude_metrics and prometheus_exclude_labels, validates them against
  all possible labels, and raises on invalid names.

  Implement validation: _all_defined_labels returns the union of UserAPIKeyLabelNames
  values, _NON_ENUM_METRIC_LABELS, and custom prometheus_metadata_labels and
  custom_prometheus_tags (all sanitized). _validate_all_configurations chains
  _validate_single_metric_name and _validate_single_metric_labels over all configs,
  collecting errors. _validate_single_metric_name checks that a metric name is in
  DEFINED_PROMETHEUS_METRICS. _validate_single_metric_labels checks that every
  label in include_labels is valid for that metric by calling
  PrometheusMetricLabels.get_labels.

  Implement pretty printing (optional for CLI display): pretty_print_validation_errors
  formats MetricValidationError and LabelValidationError using console output if
  available, else falls back to logging. pretty_print_prometheus_config displays
  enabled metrics and label filters after parsing succeeds.

  Implement the metric factory pattern: _is_metric_enabled returns true iff the
  metric is not in exclude_metrics and either no enabled_metrics were configured,
  enabled_metrics is empty, or the metric is in enabled_metrics. _create_metric_factory
  takes a Prometheus metric class and returns a factory function that returns NoOpMetric
  if disabled, _ExcludedLabelMetric if labels are excluded, or the real metric otherwise.
  The factory extracts the metric name from the first positional arg or the "name"
  kwarg and the labelnames from the labelnames kwarg.

  Implement get_labels_for_metric, which returns the resolved label list for a metric:
  start with PrometheusMetricLabels.get_labels, drop excluded labels, then keep only
  labels in label_filters[metric_name] if that metric is in label_filters. Cache
  results on the instance so the label set stays frozen even if toggles change after
  instantiation. The metric interface is _MetricLike: either NoOpMetric or
  _ExcludedLabelMetric or a real Prometheus MetricWrapperBase.

