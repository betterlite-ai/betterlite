checks:
  optional: []
  commands:
    - id: config-and-factory-tests
      why: Configuration parsing, validation, factory or registry tests are missing or fail
      run: cargo nextest run --locked -p betterlite-prometheus --no-tests=fail -E 'test(/^prometheus_config|^prometheus_factory|^excluded_label_metric|^prometheus_registry/) - test(replays_the_)'
    - id: compile
      why: The crate does not compile
      run: cargo build --locked -p betterlite-prometheus

oracle_cases: []

deviations:
  - what: Betterlite exposes the native collector interface (labels, inc, set, observe,
      remove) directly on metrics, rather than wrapping all operations in logger methods.
    why: The independent emitters in B3876–B3882 need to call collector operations
      directly without a logger dependency. This makes metrics injection simpler and
      avoids circular dependencies.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L1183-L1232
  - what: Betterlite handles infinity and NaN explicitly as enum/type variants, never
      as float values in metrics, so money calculations in budget code never receive
      or produce unrepresentable numbers.
    why: LiteLLM stores float prices and can produce inf/NaN in calculations; betterlite
      uses Decimal for money and represents special values explicitly so they cannot
      corrupt accounting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/prometheus.py#L1146-L1162
  - what: pretty_print_validation_errors and pretty_print_prometheus_config are
      optional output helpers that log to stderr or fall back to logging if console
      is unavailable, rather than failing startup.
    why: LiteLLM uses rich for visual output but makes it optional; betterlite
      follows the same pattern for observability.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L1027-L1167

out_of_scope:
  - Emission of metrics or calling collector methods at runtime; that is B3876 and its consumers.
  - Registration of collectors into the exporter; that is B3875.
  - Reading config values directly; B002 supplies the prometheus_metrics_config, prometheus_exclude_metrics,
      prometheus_exclude_labels, custom_prometheus_metadata_labels, custom_prometheus_tags,
      prometheus_emit_stream_label, prometheus_emit_rate_limit_labels and
      prometheus_emit_input_sequence_length_label settings.
  - Callback registration; B189 provides the registry lookup for get_instance.

pitfalls:
  - _parse_prometheus_config must validate before building label_filters; a metric
      with an invalid name should not appear in label_filters even if include_labels
      were provided.
  - _ExcludedLabelMetric.labels drops excluded labels by position (zip original names
      with values, keeping only non-excluded), so it assumes labelvalues tuple length
      matches original_labelnames length.
  - _all_defined_labels must include sanitized custom labels, not raw ones; failing
      to sanitize leaves validation gaps.
  - get_labels_for_metric returns a fresh list every call from the default schema,
      then filters; callers that mutate the returned list will not affect the cache.
  - _is_metric_enabled defaults to true when no config is provided (enabled_metrics
      is not set); only explicit exclusion or explicit enable lists gate metrics.
  - PrometheusLogger.get_instance scans litellm.callbacks at call time, not cached,
      so the callback must be registered before calling get_instance.
  - _NON_ENUM_METRIC_LABELS is a frozenset of strings, not label enum variants; it
      represents names that appear on metrics but are not part of UserAPIKeyLabelNames.

