id: B1364
title: Studio Veo operation decoding and generated video retrieval
description: >-
  Add studio_veo_operation for _json_payload, resolution usage normalization and all methods
  from create response through get_error_class, about 290 nonblank noncomment method lines,
  plus Gemini operation types L301-L355. decode_studio_veo_operation must require name, default
  done=false, accept absent metadata/response/error and validate nested generatedSamples/video/uri
  when a response exists. Create requires a truthy name, returns processing and optionally
  encodes provider/model through B672. Usage follows B1362's configured duration and sampleCount
  helper; resolution None or empty string is absent, but a whitespace-only string becomes an
  included empty string after stripping. Poll URL is base/v1beta/decoded-operation with an
  empty parameter map. Status uses done alone, ignoring error, and provider ID encoding uses
  model=None; it does not copy metadata timestamps into the result. Content preparation first
  performs a status GET using injected B173 transport and the supplied headers, requires
  success/done/response, then selects generatedSamples[0].video.uri as the provider download
  target. The subsequent content response returns its bytes unchanged. Preserve an empty
  sample-list failure rather than scanning for another artifact. This is retrieval of a
  provider-produced artifact, not fetching a URL from a request image/file field. Keep status
  lookup asynchronous in async operations and close both responses on cancellation. Native
  tests assert lookup_then_download, status_failure_stops_download and cancel_closes_status.
  The studio_veo_operation pure helper compares missing_name, done_with_error_completed,
  status_id_loses_model, whitespace_resolution_retained and first_sample_uri. Keep all
  remix/list/delete/character/edit/extension request and response methods unsupported, and
  GeminiError retains status/headers. Fuzz provider operation JSON; do not put the effectful
  content-request method in a helper adapter. Budget 290 code, 200 tests, 125 oracle and 85
  fuzz lines, maximum 775.
scope:
