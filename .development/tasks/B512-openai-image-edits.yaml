checks:
  optional:
  - mutants
  commands:
  - id: case-single-image-and-mask
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-edits/single-image-and-mask.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_single_image_and_mask$/)'
  - id: case-multiple-image-array
    why: Other models use repeated image[] fields, preserving order and skipping None entries; select only the first
      mask from a list, with an empty list producing no mask.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_multiple_image_array$/)'
  - id: case-dalle2-fields
    why: Lowercase model and remove hyphens/underscores; exactly dalle2 selects DALL-E 2. It uses field image and
      rejects an image list of length >1 as BadRequestError 400 for model/provider openai, even if later elements
      are None.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_dalle2_fields$/)'
  - id: case-gpt-image-optional-fields
    why: Supported names are image,prompt,background,input_fidelity,mask,model,n,quality,response_format,size,user,extra_headers,extra_query,extra_body,timeout.
      Mapping copies all supplied options rather than filtering; explicit non-None image/prompt overrides options
      and remove only image/mask from form data.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_gpt_image_optional_fields$/)'
  - id: case-filename-and-mime
    why: Use B1120 get_image_content_type; authorized BufferedReader descriptors keep their name, other images default
      image.png and masks mask.png. No request string authorizes filesystem reads.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_filename_and_mime$/)'
  - id: case-inline-data-edit
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-edits/inline-data-edit.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_inline_data_edit$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_image_edits.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_image_edits*")"
      && grep -lq 'openai_image_edits' tools/oracle/fuzz/corpus/helper_case/openai_image_edits* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_image_edits$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-edit-auth-and-endpoint
    why: Overwrite Authorization from explicit api_key, litellm.api_key,litellm.openai_key,OPENAI_API_KEY (Bearer
      None if absent). Base is explicit api_base,litellm.api_base,OPENAI_BASE_URL,OPENAI_API_BASE,https://api.openai.com/v1;
      trim trailing slashes and append /images/edits.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_auth_and_endpoint$/)'
  - id: case-edit-reply-error
    why: Reuse B511 decoding and ImageResponse validation; JSON extraction failure becomes B668 OpenAIError with
      raw status/body diagnostic, while shape-validation failure propagates outside that wrapper.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_reply_error$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_image_edits_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_image_edits_secret_safe_failure$/)'
