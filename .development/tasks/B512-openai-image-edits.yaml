id: B512
title: OpenAI image edit multipart mapping
description: >-
  Add typed ImageEditRequest with supplied byte/file descriptors and bounded multipart serialization through betterlite-http.
  Preserve DALL-E 2 versus GPT image fields, image-array part names, masks, filenames and media types. SDK local-path
  opening stays with B159; proxy request strings never authorize filesystem reads.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/image_edit/__init__.py:
  get_openai_image_edit_config L15-L31. litellm/llms/openai/image_edit/transformation.py: OpenAIImageEditConfig.get_supported_openai_params
  L35-L55; OpenAIImageEditConfig.map_openai_params L57-L64; OpenAIImageEditConfig._add_image_to_files L66-L78; OpenAIImageEditConfig.transform_image_edit_request
  L80-L140; OpenAIImageEditConfig.transform_image_edit_response L142-L153; OpenAIImageEditConfig.validate_environment
  L155-L169; OpenAIImageEditConfig.get_complete_url L171-L191. litellm/llms/openai/image_edit/dalle2_transformation.py:
  DallE2ImageEditConfig.transform_image_edit_request L30-L98.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Reuse the existing image reply decoder from the image-generation result owner; this slice adds no parallel JSON
  parser.


  Named case contracts: multiple_image_array: Other models use repeated image[] fields, preserving order and skipping
  None entries; select only the first mask from a list, with an empty list producing no mask. dalle2_fields: Lowercase
  model and remove hyphens/underscores; exactly dalle2 selects DALL-E 2. It uses field image and rejects an image
  list of length >1 as BadRequestError 400 for model/provider openai, even if later elements are None. gpt_image_optional_fields:
  Supported names are image,prompt,background,input_fidelity,mask,model,n,quality,response_format,size,user,extra_headers,extra_query,extra_body,timeout.
  Mapping copies all supplied options rather than filtering; explicit non-None image/prompt overrides options and
  remove only image/mask from form data. filename_and_mime: Use B1120 get_image_content_type; authorized BufferedReader
  descriptors keep their name, other images default image.png and masks mask.png. No request string authorizes filesystem
  reads. edit_auth_and_endpoint: Overwrite Authorization from explicit api_key, litellm.api_key,litellm.openai_key,OPENAI_API_KEY
  (Bearer None if absent). Base is explicit api_base,litellm.api_base,OPENAI_BASE_URL,OPENAI_API_BASE,https://api.openai.com/v1;
  trim trailing slashes and append /images/edits. edit_reply_error: Reuse B511 decoding and ImageResponse validation;
  JSON extraction failure becomes B668 OpenAIError with raw status/body diagnostic, while shape-validation failure
  propagates outside that wrapper.


  Write standalone Rust test openai_image_edits_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_image_edits_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B2202. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-openai/src/image_edits.rs with adjacent tests under image_edits/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation openai_image_edits in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_edits_cases in betterlite-openai with these exact named cases (one per oracle file):
  single_image_and_mask, multiple_image_array, dalle2_fields, gpt_image_optional_fields, filename_and_mime, inline_data_edit,
  edit_auth_and_endpoint, edit_reply_error. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_image_edits* using HelperCase: kind: helper
  and the externally tagged openai_image_edits variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_image_edits that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 198 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 165 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 535 planned, 550 maximum changed lines.
