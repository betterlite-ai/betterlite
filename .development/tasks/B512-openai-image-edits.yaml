deviations: []
out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- DALL-E 2 checks the list length before skipping None images, so [image, None] still fails.
- The mask list is truncated to its first element without validating or sending later masks.
- The request comment says non-None values only, but arbitrary optional form fields are not globally filtered for
  None.
