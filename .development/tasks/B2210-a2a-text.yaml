checks:
  optional:
  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/a2a_text.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
      --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/a2a_text*")"
      && grep -lq 'a2a_text' tools/oracle/fuzz/corpus/helper_case/a2a_text* && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(/::helper_seeds_select_a2a_text$/)' && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-a2a-text-parts
    why: 'Message None or depth>=max_depth returns empty; defaults depth0,max_depth10. parts missing defaults[].
      Iterate in order: kind=text appends text default empty, otherwise a parts key recurses and appends only nonempty
