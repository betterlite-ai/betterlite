    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::a2a_text_cases::case_[0-9]+_a2a_text_parts$/)'
  - id: case-a2a-depth-limit
    why: At depth9 text is included, nested depth10 contributes nothing. Caller max_depth0 returns empty immediately;
