id: B2210
title: Shared A2A text projection
description: >-
  Implement the pure A2A text projection used by AgentCore and agent-platform providers below either provider composition.
  These helpers inspect parsed records and do not authenticate, invoke agents or register routes.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/a2a/common_utils.py:
  extract_text_from_a2a_message L66-L93; extract_text_from_a2a_response L96-L145.


  Named case contracts: a2a_text_parts: Message None or depth>=max_depth returns empty; defaults depth0,max_depth10.
  parts missing defaults[]. Iterate in order: kind=text appends text default empty, otherwise a parts key recurses
  and appends only nonempty nested result. Join with a single space, so empty text parts create leading/trailing/repeated
  spaces; text kind wins over nested parts. Do not flatten with empty separators or trim. a2a_depth_limit: At depth9
  text is included, nested depth10 contributes nothing. Caller max_depth0 returns empty immediately; explicit smaller/larger
  limit applies consistently. Inputs are already parsed bounded records; no network or separate byte decoder. a2a_result_priority:
  Nondict result yields empty. Presence of result.parts wins even when [] and prevents fallback. Then choose truthy
  result.message, truthy dict result.artifact, truthy status.message when status is dict, then first artifacts item
  only when artifacts truthy/nonempty. Each selected source returns its extraction directly, even when empty; never
  concatenate artifacts or inspect kind to choose these strategies. a2a_wrong_shapes: Preserve malformed-record
  errors for noniterable parts, nondict parts/message and nonstring text during joining; do not silently coerce
  or skip them. No warning is emitted by these helpers. AgentCore outer response owner maps failures to its error;
  the helper itself does not assign HTTP status.


  Implement crates/betterlite-context/src/a2a_text.rs with adjacent tests under a2a_text/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The
  Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture transport/SDK
  constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local model map; intercept
  HTTP before external IO. A native-only binding is captured at its call seam where specified above. Compare omissions,
  warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function a2a_text_cases in betterlite-context with these exact named cases (one per oracle file):
  a2a_text_parts, a2a_depth_limit, a2a_result_priority, a2a_wrong_shapes. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/a2a_text* using HelperCase: kind: helper and
  the externally tagged a2a_text variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_a2a_text that parses every prefixed seed with the production HelperCase parser,
  asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 52 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 95 production lines, 185 behavior/config-test lines, 90 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 400 planned, 400 maximum changed lines.
