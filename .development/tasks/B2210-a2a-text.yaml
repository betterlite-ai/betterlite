pitfalls:
- 'The oracle helper for this task is pre-registered as a2a_text in the context group. Replace the stub Op in tools/oracle/src/helpers/context/a2a_text.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/a2a_text.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An empty result.parts list is authoritative and prevents a later message/artifact from supplying text.
- Empty text parts still add join separators, while empty recursively extracted parts are omitted.
