      or separate byte decoder.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::a2a_text_cases::case_[0-9]+_a2a_depth_limit$/)'
  - id: case-a2a-result-priority
    why: Nondict result yields empty. Presence of result.parts wins even when [] and prevents fallback. Then choose
      truthy result.message, truthy dict result.artifact, truthy status.message when status is dict, then first
      artifacts item only when artifacts truthy/nonempty. Each selected source returns its extraction directly,
      even when empty; never concatenate artifacts or inspect kind to choose these strategies.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::a2a_text_cases::case_[0-9]+_a2a_result_priority$/)'
  - id: case-a2a-wrong-shapes
    why: Preserve malformed-record errors for noniterable parts, nondict parts/message and nonstring text during
