dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports; B8625 mounts the routes and proves the items below over HTTP with the cases that moved there.
    proof: [catalog-tests]
  - text: >-
      GET /v1/mcp/registry.json answers 404 "MCP registry is not enabled" when enable_mcp_registry is false or absent without needing a key,
      and when it is true returns the built-in gateway entry first, then the ip-filtered servers sorted by alias, server_name or server_id, with the exact entry shape and the remote url built from the request base url and the server prefix.
    proof: [registry-feed-tests, config-tests]
  - text: >-
      The enable_mcp_registry key is read by a betterlite-config section that defaults it to false and loads true and false from a config file.
    proof: [config-tests]
  - text: >-
      GET /v1/mcp/tools returns {"tools": [...]} from the tool lister called with the auth only, GET /v1/mcp/access_groups returns the sorted union of config and table groups and survives a table error,
      and GET /v1/mcp/network/client-ip returns the resolved ip or null.
    proof: [small-reads-tests]
  - text: >-
      GET /v1/mcp/server follows steps a to h: team_id handling (blank value ignored, restricted key 403, non-member 403, admin bypass), team-scoped union with allow-all-keys servers, display-order sorting,
      the connected app and has_user_credential annotations with their conditions, and the virtual key, non-admin and full-admin exits.
    proof: [server-list-tests]
  - text: >-
      GET /v1/mcp/server/health returns server_id and status rows, maps reachable to unknown unless include_reachability is true, uses the unfiltered check in view_all mode,
      and merges auth contexts first-seen without checking a server twice.
    proof: [health-routes-tests]
  - text: >-
      GET /v1/mcp/server/{server_id} checks the database first (500 object detail), resolves and authorizes with the exact 404 and 403 texts and the catalog-view rule,
      adds database servers to the registry, attaches the health result or the unknown fallback, and redacts or sanitizes by role.
    proof: [server-detail-tests]
  - text: >-
      GET /v1/mcp/discover and GET /v1/mcp/openapi-registry answer 403 with the exact role text to callers without admin view;
      discover filters by query and category and lists categories from the full catalog, and the embedded catalog equals the pinned file.
    proof: [discovery-tests, catalog-data]
  - text: All nine routes are registered once under /v1/mcp with the methods and paths in the description, and /server/health does not fall into the /server/{server_id} handler.
    proof: [catalog-tests]

checks:
  optional: [mutants]
  commands:
    - id: catalog-tests
      why: the module's route table or shared error mapping is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_views::tests::/)'
    - id: small-reads-tests
      why: the tools, access group or client ip route is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_views::small_reads::/)'
    - id: registry-feed-tests
      why: the public registry document, its flag gate, its ordering or its entry shape is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_views::registry_feed::/)'
    - id: server-list-tests
      why: the server list route, its team branch, its annotations or its role exits are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_views::server_list::/)'
    - id: health-routes-tests
      why: the health route or its status mapping is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_views::health_routes::/)'
    - id: server-detail-tests
      why: the single server route, its authorization, its registry add or its health fallback is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_views::server_detail::/)'
    - id: discovery-tests
      why: the discovery or OpenAPI registry route is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_views::discovery::/)'
    - id: config-tests
      why: the enable_mcp_registry section is missing or does not load the key
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_registry::/)'
    - id: catalog-data
      why: the embedded discovery catalog is missing or differs from the pinned LiteLLM file
      run: |
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/data/mcp_registry.json)" && sha256sum --check --quiet <<'SUMS'
        d05e9b1e729d659440e4a0799563c0cea5d4b2bbb64baa8986566da53ad01be2  crates/betterlite-server/data/mcp_registry.json
        SUMS

oracle_cases: []

deviations:
  - what: The discovery catalog is embedded in the binary at build time and read from memory, not opened from a file next to the code on the first request.
    why: A binary has no source tree beside it. The only visible difference is that a missing file can no longer give an empty list with a warning; a catalog that fails to parse still does.
  - what: The Role text in the discover and openapi-registry 403 details prints the role's string value; a key without a role prints "None".
    why: LiteLLM formats the enum or None with Python's str; betterlite follows the text B2314 defines for the role values.
  - what: The tool listing behind GET /v1/mcp/tools is reached through the ToolLister port.
    why: LiteLLM's _list_mcp_tools lives in operations.py, which no task owns yet. See the report notes.

out_of_scope:
  - "_get_user_mcp_management_mode, _resolve_accessible_mcp_servers, _is_restricted_virtual_key_request, _user_is_full_admin, _redact_mcp_credentials, _redact_mcp_credentials_list and the four sanitize functions: owned by B4717; this task only calls them."
  - "get_prisma_client_or_throw, get_mcp_server, _db_find_user_credential_rows and the server table handle: owned by B4711."
  - "resolve_mcp_server, authorize_mcp_server, get_mcp_server_by_id, get_filtered_registry and _build_mcp_server_table: owned by B4731."
  - "get_allowed_mcp_servers: owned by B6591. health_check_server, get_all_mcp_servers_with_health_and_teams, get_all_mcp_servers_with_health_unfiltered and add_server: owned by B6592."
  - "is_ui_session_credential, admitted_user_context and build_effective_auth_contexts: owned by B4672. user_api_key_has_admin_view: owned by B2314."
  - "get_team_object: owned by B737. _get_team_allowed_mcp_servers: owned by B818. _get_allow_all_keys_server_ids: owned by B817."
  - "get_mcp_client_ip: owned by B743. get_request_base_url: owned by B4654. get_server_prefix: owned by B6594."
  - "The OpenAPI catalog data and its loader (_load_openapi_registry): owned by B4231; route 9 only serves what it loads."
  - "_list_mcp_tools (operations.py): no task owns it at the time of writing; this task calls it through a port."
  - "The other routes in mcp_management_endpoints.py: the user credential routes belong to B4723, the toolset and session routes to B4725, the env var routes to B4724, the OAuth browser routes to B4719, the create, import, edit, delete and make-public routes to B4721, the submission and pinned tool routes to B4722, the preview and test routes to B4729 and the temporary OAuth session routes to B4718."

pitfalls:
  - GET /v1/mcp/registry.json is the one route here without the key dependency, so a missing Authorization header must not give 401; the flag check is the only gate.
  - Config servers store access groups in access_groups and table rows in mcp_access_groups, and the access group route reads both spellings, with draft rows included and a database error swallowed after a debug log.
  - The registry document skips a server with an empty prefix silently, so the list can be shorter than the registry, and the built-in entry is never subject to the ip filter.
  - The registry sort key is alias, then server_name, then server_id, not the dashboard's lowercase display order, so "Zeta" sorts before "alpha" there.
  - A team_id of "   " is treated as no team_id, not as an error, and a restricted virtual key only gets the 403 for a non-blank team_id.
  - The 403 strings in route 5 are plain strings under "detail", while the 403 and 404 texts of routes 7, 8 and 9 and the 500 of route 7 are objects with an "error" key.
  - Route 5 loads the team a second time inside the team-scoped list, after the membership check loaded it once, so a fake team lookup is called twice for a non-admin.
  - has_user_credential counts any credential row for the user and server, including an OAuth row, because BYOK and OAuth rows share one table and the batch query has no type filter.
  - The annotations in route 5 are set before the sanitizers run; B4717 decides which of them survive for a restricted key or a non-admin, so do not strip them here.
  - Route 6 passes the ids collected before each auth context as checked_server_ids, so a server reachable through two contexts is checked once and keeps its first status; with include_reachability false a "reachable" status is reported as "unknown".
  - Route 6 in view_all mode never builds auth contexts, so a key with no MCP grant still sees every registered server's status.
  - Route 7 checks the database before anything else, so a config-only server also answers 500 on a proxy started without a database.
  - Route 7 calls add_server for a server that came from the database, so a plain GET can put a row into the live registry; do not skip it as a side effect.
  - Route 7 allows a catalog view only for a row that is both in the registry and has approval_status None, "active" or "approved"; a pending or rejected row stays 404 for a non-admin, not 403 (non_admin_missing is "not_found").
  - The health fallback in route 7 stamps last_health_check with the local naive time, so its text has no "Z" or offset, unlike the stored timestamps elsewhere.
  - The discover query filter reads the keys with a default of the empty string, and categories use the default "Other" only for the category list, not for the category filter.
  - Route 9 has no dependencies entry on the decorator; the key still comes from the handler argument's Depends, so it is still required.

