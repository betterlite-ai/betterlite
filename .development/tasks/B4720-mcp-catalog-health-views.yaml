id: B4720
title: MCP server catalog and health views
description: >-
  Build the nine read-only routes of the MCP management router that list and describe servers, in betterlite-server module mcp::catalog_views, plus one config section.
  All nine sit under the router prefix /v1/mcp (LiteLLM mounts this router with that prefix only, so there is no /mcp/... or /openai/v1/... alias).
  Errors are FastAPI HTTPException values: a string detail gives {"detail": "..."} and an object detail gives {"detail": {"error": "..."}}. The texts below say which one each error uses.
  Nothing here writes to the database. The one write-like effect is the registry add in route 7.


  Layout. crates/betterlite-server/src/mcp/catalog_views.rs holds CatalogViews (a struct whose fields are the ports and values the routes need, built by B8625 with a struct literal), the CatalogError enum (thiserror, one variant per failure, a status mapping used by the routes) and `routes()` which returns the axum router with the nine routes.
  The files beside it, each with a tests.rs: small_reads.rs (routes 1 to 3), registry_feed.rs (route 4), server_list.rs (route 5), health_routes.rs (route 6), server_detail.rs (route 7), discovery.rs (routes 8 and 9).
  No global state. The LiteLLM globals become fields: the registry (B4731 ServerRegistry behind B6592's shared handle), the health service (B6592), the database port (B4711), the settings (B4717's management mode, this task's registry flag), the clock and the tool lister.


  Config section. crates/betterlite-config/src/sections/mcp_registry.rs reads general_settings.enable_mcp_registry, a boolean that defaults to false, and exposes it as config.sections.mcp_registry. LiteLLM tests it with bool(...), and the declared type is a boolean, so only a boolean is accepted. Its tests live in the section's tests.rs and load a config file with the key set to true, to false and absent. The skeleton adds the stub, the `pub mod` line and the name in the sections! list; do not edit sections.rs or any shared config file.


  Route 1. GET /v1/mcp/tools (any valid key) returns {"tools": [...]}, every tool of the caller's key serialized with its aliased field names (inputSchema, not input_schema) and with null fields kept.
  The tool list comes from LiteLLM's _list_mcp_tools called with only the auth: no auth header, no server filter, no per-server headers, no client ip. Define a port trait ToolLister with one async method list_tools(auth) -> Result<Vec<tool>, ListToolsError>, where the tool type is the one the MCP client crates already define (read crates/betterlite-mcp for the Tool type and its serde names). B8625 wires the real lister; this task only calls the port. Only the tools are returned, not the per-server outcome that the listing also carries.

  Route 2. GET /v1/mcp/access_groups (any valid key, no role check) returns {"access_groups": [...]}, the sorted union of the access group names of every config-loaded server and of every row of the MCP server table.
  Config servers carry the names in their access_groups field and table rows carry them in mcp_access_groups, so the two spellings differ. Skip empty lists.
  The table read is a plain find-many on the server table through B4711's table handle, with no approval filter, so draft and pending rows count. It is skipped when there is no database. A database error is logged at debug level and swallowed, and the answer is built from what was read so far (the config groups). Sort by string code point and remove duplicates.

  Route 3. GET /v1/mcp/network/client-ip (any valid key) returns {"ip": <string or null>} where the ip is B743's get_mcp_client_ip(request), the caller's address as the proxy sees it.

  Route 4. GET /v1/mcp/registry.json is the only route here that takes no key. It serves the public MCP registry document (spec https://github.com/modelcontextprotocol/registry).
  When the flag enable_mcp_registry is false the answer is 404 with detail "MCP registry is not enabled" (a plain string). The flag is checked before anything else, including the ip.
  Otherwise: client_ip is B743's get_mcp_client_ip(request); base_url is B4654's get_request_base_url(request); the response is {"servers": [{"server": entry}, ...]}. The first element is the built-in entry for this gateway, then one element per record of B4731's filtered_registry(client_ip) (get_filtered_registry), values only, sorted by the registry name, a stable sort on the plain string.
  The registry name of a record is its alias, else its server_name, else its server_id (the first non-empty one).
  An entry is {"name": N, "title": N, "description": N, "version": "1.0.0", "remotes": [{"type": "streamable-http", "url": U}]} with N the registry name. For a record U is base_url with trailing slashes removed, then "/", then B6594's get_server_prefix(record), then "/mcp". A record whose prefix is empty is skipped (LiteLLM raises ValueError and the loop catches it, logging at debug level "Skipping MCP server %s in registry: %s").
  The built-in entry uses the gateway name and description and U = base_url without trailing slashes + "/mcp". The gateway name is the env var LITELLM_MCP_SERVER_NAME (default "litellm-mcp-server") and the description is LITELLM_MCP_SERVER_DESCRIPTION (default "MCP Server for LiteLLM"). CatalogViews takes both as plain string fields that B8625 fills from B8620's config section; the module reads no environment variable itself.
  Key order inside an entry is name, title, description, version, remotes.

  Route 5. GET /v1/mcp/server lists servers for the dashboard. Query: team_id (optional string) and connected_app_view (bool, default false). The response model is a list of B858's LiteLLM_MCPServerTable, every field serialized, nulls included.
  Steps, in this order.
  a. Let restricted = B4717's is_restricted_virtual_key_request(auth). A team_id that is a string with non-blank content takes the team branch (a blank or whitespace-only value takes the normal branch, not an error).
  b. Team branch. A restricted key gets 403 with the string detail "Restricted virtual keys cannot query team-scoped MCP servers." The id is trimmed. A caller without admin view (B2314's user_api_key_has_admin_view: PROXY_ADMIN and PROXY_ADMIN_VIEW_ONLY) loads the team with B737's get_team_object(team_id, check_db_only true), which raises its own error for an unknown team and that error passes through unchanged. If no member of the team has user_id equal to the caller's user_id (members with a None user_id never match) the answer is 403 with the string detail "You do not have permission to view MCP servers for this team." Then the list is the team-scoped list (step c), sorted.
  c. Team-scoped list (`_get_team_scoped_mcp_server_list`). Load the team again with get_team_object(team_id, check_db_only true). The id set is B818's _get_team_allowed_mcp_servers(team) united with B817's _get_allow_all_keys_server_ids(). An empty set gives []. Otherwise each id is read with B4731's server_by_id (no ip), ids the registry does not know are skipped, and each found record becomes a table row with B4731's server_table. The rows are then redacted with B4717's redact list function.
  d. Normal branch: B4717's resolve_accessible_mcp_servers(auth), then B4717's redact list function, then sorted.
  e. Sort key (`_mcp_server_display_order`): the lowercase of server_name, else alias, else server_id, then the server_id as a tie breaker.
  f. connected_app_view: only when the flag is true and B4672's is_ui_session_credential(auth) is true, set connected_app_reachable on every row to whether its server_id is in the reachable set. The reachable set (`_connected_app_reachable_server_ids`) is empty when B4672's admitted_user_context(auth) is None, else B6591's allowed_servers(admitted).
  g. has_user_credential: only when the caller has a non-empty user_id and a database exists. Take the rows with is_byok true. If there are any, read the credential rows of B4711's _db_find_user_credential_rows with where user_id = the caller and server_id in those ids (one query), and set has_user_credential on each BYOK row to whether its id is among them. Any credential row counts, BYOK or OAuth, because both share the table and the query has no type filter.
  h. A restricted key gets B4717's sanitize list for virtual key. Else a caller who is not a full admin (B4717's user_is_full_admin: PROXY_ADMIN only) gets B4717's sanitize list for non-admin. Else the redacted rows are returned.
  This route needs no database for the normal branch: without one the answer is built from the registry alone.

  Route 6. GET /v1/mcp/server/health. Query: server_ids (repeatable, optional) and include_reachability (bool, default false). It returns a JSON list of {"server_id": id, "status": s}.
  s goes through `_mcp_health_status_for_response`: the value "reachable" becomes "unknown" unless include_reachability is true, and every other value (healthy, unhealthy, unknown, or null) is unchanged, null staying null.
  When B4717's get_user_mcp_management_mode is "view_all" and the key is not restricted, the rows come from B6592's with_health_unfiltered(server_ids), in its order.
  Otherwise, for each context in B4672's build_effective_auth_contexts(auth), call B6592's with_health_and_teams(context, server_ids, checked) where checked is a copy of the ids already collected before this call, and keep a server's status the first time it is seen. The output order is the order of first sight. Nothing is health-checked twice.

  Route 7. GET /v1/mcp/server/{server_id} describes one server. Query: include_reachability (bool, default false). The static path /server/health must win over this path.
  Steps, in this order.
  a. No database gives 500 with the object detail {"error": "Database not connected. Connect a database to your proxy"} (B4711's get_prisma_client_or_throw). This runs first, before the id is looked at.
  b. client_ip = B743's get_mcp_client_ip(request). is_admin_view = user_api_key_has_admin_view(auth).
  c. B4731's resolve_server(server_id, no temp lookup, db lookup = B4711's get_mcp_server, id_client_ip = client_ip, name_client_ip = client_ip, match_name true), then authorize_server with: is_admin_view; not_found_detail {"error": "MCP Server with id <id> not found"}; forbidden_detail {"error": "User does not have permission to view mcp server with id <id>. You can only view mcp servers that you have access to."}; non_admin_missing "not_found"; and allow_catalog_view = management mode is "view_all" AND key not restricted AND the resolved row exists AND its approval_status is None, "active" or "approved" AND the registry knows the id (server_by_id with no ip is Some).
  d. When the authorized source is the database, add the server to the registry with B6592's add_server(row). This changes shared state on a read.
  e. Health: B6592's check_server(server_id). On success set status to the `_mcp_health_status_for_response` value (null becomes "unknown"), last_health_check and health_check_error from the result. On any error from it: status "unknown", last_health_check = the current time as a naive ISO-8601 datetime in the process's local time (no zone suffix), health_check_error = the error text, and a debug log line "Error performing health check on server %s: %s".
  f. B4717's redact. A restricted key gets sanitize for virtual key; else a non-full-admin gets sanitize for non-admin; else the redacted row.

  Route 8. GET /v1/mcp/discover is the curated list of well-known servers for the dashboard's add-server grid. Query: query (optional) and category (optional).
  A caller without admin view gets 403 with the object detail {"error": "Only proxy admins can access MCP discovery. Your role=<user_role>"}, where <user_role> is the role's string value as LiteLLM prints it (read B2314 for the enum's text; a key without a role prints None).
  Data: crates/betterlite-server/data/mcp_registry.json, a byte-for-byte copy of litellm/proxy/mcp_registry.json at the pin (32 entries), embedded with include_str!. Parse it once when CatalogViews is built; a parse failure logs a warning and uses an empty server list. Typed entries (DiscoveryServer): name, title, description, icon_url, category, registry_url, transport, then url (http and sse entries) or command and args (stdio entries), then env_vars, a list of {name, description, secret}. Serialize in that order and omit the keys an entry does not have. The catalog is the file's "servers" array.
  The answer is {"servers": S, "categories": C}. S is the entries after filtering. query is a case-insensitive substring test against name, title and description (any one matches), applied only when query is non-empty. category is an exact, case-sensitive match against the entry's category, applied only when non-empty; an entry without a category never matches. C is the sorted set of every entry's category from the full unfiltered list, with "Other" for an entry that has none. The order is the file's order for S and code point order for C.

  Route 9. GET /v1/mcp/openapi-registry returns the OpenAPI picker catalog. A caller without admin view gets 403 with the object detail {"error": "Only proxy admins can access the OpenAPI registry. Your role=<user_role>"}. Otherwise it returns the catalog that B4231's openapi_registry module loads, unchanged, and {"apis": []} when that loader reports a failure (log a warning "Failed to load OpenAPI registry from <path>: <error>" in LiteLLM; here the path is the embedded resource's name).

  Tests use synthetic servers (ids like test-srv-1, urls like https://mcp.example.test/sse), fakes for the registry, the health service, the database port, the tool lister and the team lookup, and a fixed clock. They cover every branch above, including the order of the checks in routes 5 and 7.

