dod:
- text: Repeated calls reuse a local connection, different security policies remain isolated, and concurrent deployments
    never exchange authorization or cookies.
  proof:
  - http-pool-tests
- text: Deadlines, decompression/body/header limits, read failure and cancellation release capacity and close resources
    without retrying.
  proof:
  - http-pool-tests
- text: JSON, bytes and multipart transport behavior, body ownership and query collisions are exercised against
    local servers.
  proof:
  - http-pool-tests
- text: The existing chat stream remains incremental and shutdown waits for tracked work with a bounded deadline.
  proof:
  - http-pool-tests
  - chat-regression
- text: Only betterlite-http builds production outbound clients and deny.toml retains its layering rule.
  proof:
  - clippy
  - deny
  - layering
- text: URL query wins collisions with explicit params, while repeated entries within one source keep their order.
  proof:
  - http-pool-tests
checks:
  optional:
  - mutants
  commands:
  - id: http-pool-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-http -p betterlite-server --no-tests=fail -E 'test(/::b173_http_pool_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: chat-regression
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-openai -p betterlite-server --no-tests=fail -E 'test(/::b173_chat_regression_behavior($|::)/)
      - test(/replays_the_/)'
  - id: layering
    why: the required new behavior or its evidence is missing
    run: test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-http/src)" && grep -qE 'crate = "reqwest",
      wrappers = \[[^]]*"betterlite-http"' deny.toml
oracle_cases:
- tools/oracle/cases/chat/openai-basic.yaml
- tools/oracle/cases/chat/openai-stream.yaml
deviations:
- what: litellm_settings.disable_aiohttp_transport and DISABLE_AIOHTTP_TRANSPORT are accepted no-ops.
  why: The selected Python engine has no Rust equivalent; B208 explicitly owns environment proxy semantics.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1213-L1242
- what: Repeated query values from one source remain ordered; URL values still win collisions with explicit params.
  why: Avoid silent loss within a caller-provided sequence while matching source precedence.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1459-L1469
- what: Buffered bodies have a 16 MiB limit and decoded response headers a 64 KiB acceptance limit.
  why: Bound untrusted provider responses; HTTP/1 parser allocation is governed by its separate library ceiling.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L713-L798
out_of_scope:
- Endpoint request/response schemas in the large HTTP handler belong to B024-B050 and B080-B099; this part owns
  only their shared transport.
- Retries and backoff are B017, WebSocket protocols are their endpoint tasks, and synchronous Python wrappers are
  B157-B161.
pitfalls:
- A request timeout must still cover body consumption after headers have arrived.
- Do not derive a cache key by concatenating arbitrary parameter strings.
- No detached client cleanup task may survive server shutdown.
- Reqwest retries protocol NACKs by default; disabling router retries alone is insufficient.
- Reqwest redirect policy cannot mutate headers and its built-in stripping does not cover provider API-key headers;
  B009 owns explicit redirect replay.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
