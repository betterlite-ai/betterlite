id: B173
title: Pooled outbound requests and response limits
description: >-
  Refine B004's betterlite-http into the shared transport all provider adapters call. Keep one async reqwest implementation
  and injected policy/client ownership, replacing the Python httpx/aiohttp backend distinction with the same observable
  request contract. Pool by immutable TLS/proxy/HTTP policy and keep authorization per request; bound the pool to
  configured deployments and retain client ownership through each streamed body. Provide typed method, headers,
  query, body and deadline inputs for JSON, bytes and multipart callers, without implementing endpoint-specific
  transformations from llm_http_handler.py or container_handler.py. Disable implicit retries and cookies, keep network
  and source errors typed, enforce separate connect/read and total deadlines, and cap buffered success/error bodies
  and headers, including decompressed bytes. Use constructor limits (16 MiB buffered body, 64 KiB aggregate headers
  unless the existing stricter limit applies); streaming stays incremental with bounded buffers. Wire the existing
  OpenAI adapter and server shutdown to the pool, and test connection reuse, cancellation, malformed length/encoding,
  TLS policy isolation, drain and no retry.  On a key collision between URL query and explicit params, the URL value
  wins. Preserve repeated entries only within a single source, and document the retained duplicate behavior as a
  deviation from dict conversion. Support litellm_settings.disable_aiohttp_transport and DISABLE_AIOHTTP_TRANSPORT
  as accepted no-ops. Explicitly call .retry(reqwest::retry::never()). Enforce the 64 KiB aggregate response-header
  acceptance limit by checked summation of decoded header names and values immediately after headers, before reading
  a body; configure the HTTP/2 header-list cap too. HTTP/1 parser allocation uses the bounded upstream library parser
  ceiling, not an invented reqwest 64 KiB setting; document and test that ceiling independently. Keep multipart
  to transport body serialization only. Budget 280 transport, 140 integration and 350 tests (770 total); there are
  no helper adapters in this task. Write the behavior rstest functions b173_http_pool_tests_behavior, b173_chat_regression_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names.


  Reuse B2236 for configured network_mock transport and its loader. In _get_async_http_client/_get_sync_http_client
  preserve the non-None configured client_session override before the truthy network_mock check. Run named transport
  tests mock_after_supplied_client and mock_before_network_options for both variants, alongside B2236 mock_selection
  helper output. Do not conflate this operator-controlled transport with the oracle fixture transport.
scope:
  paths:
  - Cargo.toml
  - deny.toml
  - crates/betterlite-http/**
  - crates/betterlite-openai/**
  - crates/betterlite-server/**
  - crates/betterlite-config/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L181-L226
  why: Client ownership, stream anchoring and blocked cookies.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L713-L798
  why: Bounded response reads and closure on every exit.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1713-L1810
  why: Cache identity and reuse.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L442-L540
  why: Common async/sync send boundary, distinct from per-endpoint conversion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/container_handler.py#L101-L139
  why: Path and query construction consumed by future container endpoints.
- url: https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html
