id: B4085
title: Gate shadow spending and run every comparison arm
description: >-
  Build the detached evaluation pipeline in betterlite-server: require a database, check the
  key and team evaluation budgets through advisory lookups, then execute every arm sequentially
  with an independent attempt outcome. Gate once per sampled request, not between arms; a
  budget crossed during the loop may overshoot by the remaining arms. When the database is
  unavailable, record one withheld funnel increment and skip all arms without provider spend.
  Known-cost recording and failure diagnostics persist after shadow or judge failure, so one
  arm's fault never silences its sibling arm.

  _key_or_team_is_over_budget reads the shadowed caller's identity from metadata, performs
  advisory budget checks against the same auth operations the request path uses (never blocking
  real traffic, only racing requests in flight), and returns False on any read failure. The key
  lookup is required; team lookup happens only when the key holds a team assignment.

  _run_shadow_eval gates once per sampled request by checking the database, budget and team/key
  state, then invokes _run_shadow_arm for each router in the job's comparison arms. The prisma
  gate sits above dispatch so no provider spend happens without a place to record the outcome,
  and budget reads live here rather than at the success-hook entry. Withheld requests count one
  request-level funnel increment before any arm runs.

  _run_shadow_arm runs one arm's three-stage pipeline: call the shadow router with the control
  request messages, run a blind pairwise judge on the real and shadow responses, then record
  one attempt row capturing this arm's outcome. Every stage exit records the arm's outcome, so
  success records real_cost/real_classifier_cost/real_cache_hit from the control request and
  shadow_cost/shadow_classifier_cost from the shadow, with judge_cost on judge completion;
  shadow failure records only real costs and the shadow cost if the shadow call billed;
  pipeline errors record real costs alone, never provider spend.

