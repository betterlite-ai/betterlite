dod:
  - text: _key_or_team_is_over_budget returns false when metadata lacks UserAPIKeyAuth or is not a valid dict.
    proof: [advisory-budget-tests]
  - text: _key_or_team_is_over_budget calls _virtual_key_max_budget_check with the key and logs/returns false on BudgetExceededError.
    proof: [advisory-budget-tests]
  - text: _key_or_team_is_over_budget calls get_team_object with check_cache_only=True and _team_max_budget_check when the key holds a team_id.
    proof: [advisory-budget-tests]
  - text: _key_or_team_is_over_budget returns false and logs at debug level when any auth read fails (ImportError, lookup, check exception).
    proof: [advisory-budget-tests]
  - text: _run_shadow_eval returns immediately if prisma_provider() is None, recording one withheld funnel event and making no provider calls.
    proof: [pipeline-tests]
  - text: _run_shadow_eval gates on over-budget status and reads the evaluation budget spend, recording withheld for budget gatekeeping failures (read error, exhausted).
    proof: [pipeline-tests]
  - text: _run_shadow_eval iterates every arm in job.arm_router_names sequentially and awaits _run_shadow_arm for each.
    proof: [pipeline-tests]
  - text: _run_shadow_arm calls _call_router_shadow and records a pipeline-error attempt if the call raises (not a _CallFailure).
    proof: [arm-tests]
  - text: _run_shadow_arm records a shadow-failure attempt when _call_router_shadow returns a _CallFailure, including shadow_cost.
    proof: [arm-tests]
  - text: _run_shadow_arm calls _call_judge only when the shadow call succeeds (returns _ShadowResponse, not _CallFailure).
    proof: [arm-tests]
  - text: _run_shadow_arm records a judge-failure attempt when _call_judge returns a _CallFailure, including shadow_cost and judge_cost.
    proof: [arm-tests]
  - text: _run_shadow_arm records a success attempt with the judge verdict when both shadow and judge calls succeed.
    proof: [arm-tests]
  - text: _run_shadow_arm records an outcome row at every exit (pipeline error, shadow error, judge error, success) so one arm fault never silences a sibling.
    proof: [arm-tests]
  - text: _run_shadow_arm passes the control request metadata and shadow_params to _call_router_shadow; the team_id comes from parent_metadata.
    proof: [arm-tests]
  - text: _run_shadow_arm passes messages, tool definitions from shadow_params, and real/shadow text to _call_judge via job.judge_model and parent_metadata.
    proof: [arm-tests]

checks:
  optional: []
  commands:
    - id: advisory-budget-tests
      why: budget lookup and advisory gate tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_evaluation::advisory_budget::/)'
    - id: pipeline-tests
      why: _run_shadow_eval and gating tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_evaluation::pipeline::/)'
    - id: arm-tests
      why: _run_shadow_arm stage tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_evaluation::arm::/)'

