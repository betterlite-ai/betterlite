deviations:
  - what: Advisory budget checks read from async auth operations injected through betterlite-auth, not from global proxy imports.
    why: betterlite isolates shared state into auth and DB crates; the advisory gate accepts the same read errors and fail-open behavior as the source.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L631-L660
  - what: Withheld funnel events are recorded via the injected _record_funnel callback instead of a shared funnel object.
    why: betterlite-server owns the pipeline orchestration; funnel persistence is delegated to B4083.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L1068-L1084

out_of_scope:
  - "Active job loading and metadata: owned by B4083."
  - "Shadow call execution: owned by B4084."
  - "Judge call execution: owned by B4084."
  - "Attempt record insertion: owned by B4083."
  - "Funnel event recording: owned by B4083."
  - "get_current_spend and increment_spend_counter: unresolved, question 4 in the outline."
  - "User/team lookup and auth identity validation: owned by B732, B737 respectively; this task only passes injected references to advisory checks."

pitfalls:
  - "Budget checks are advisory: a read error must return false and log at debug, never raise; real traffic already passed auth, so the race gate only closes a slot."
  - "No provider spend happens until prisma_provider() returns non-None; withheld funnel events are request-level, not per-arm."
  - "The evaluation budget is read once before the loop; a budget crossed mid-loop lets the remaining arms overshoot by one sample, the same as in-flight samples when the cap is crossed."
  - "Every exit from _run_shadow_arm records an attempt row, including exceptions that did not bill a provider; the outcome field distinguishes success/error/shadow-failure/judge-failure."
  - "_run_shadow_arm receives the control request's real_text/real_model/real_cost and shadow_params; shadow text and costs are read from call outcomes, not from request metadata."
  - "When _call_router_shadow raises an exception (not returning _CallFailure), record pipeline-error with no shadow cost; when it returns _CallFailure, record shadow_cost from the failure outcome."
  - "Team lookup runs only when the key holds a team_id; team_id is None or a string, never a missing key; both key and team read failures are logged and considered advisory."
  - "The judge call is skipped entirely if the shadow call failed; success outcome includes verdict.preference and verdict.confidence from the judge's _JudgeVerdict record."
  - "Judge-only failures (verdict is _CallFailure) still record the shadow_cost; this is the case where spending billed but the judgment failed."

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
