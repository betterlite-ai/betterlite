id: B1078
title: Responses create plan
description: >-
  Build the typed create-call plan before execution: snapshot optional arguments, merge forwarded headers/text format,
  apply prompt-management and model resolution once, and produce native/chat/MCP/file-search dispatch inputs. Internal
  skip/encrypted-task flags are trusted context fields, never public JSON fields. Complete execution is responses-create-call.


  At the MCP/file-search decision points in responses(), return CreateDispatch::GatewayMcp / EmulatedFileSearch
  / Native / Chat plus the prepared arguments. B080 composes B955 execution above this plan. The planner does not
  invoke _responses_try_dispatch_mcp_gateway or _responses_try_dispatch_emulated_file_search as runtime calls; tests
  assert the emitted variant and call-order trace.


  Implement crates/betterlite-core/src/api/responses_create_plan.rs. Use ResponsesCreatePlanInput and ResponsesCreatePlanResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions forwarded_header_merge, text_format_precedence, prompt_hook_once, model_prefix_plan,
  request_cannot_set_intern_94df, no_native_file_search under api::responses_create_plan::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesCreatePlan in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_create_plan: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/main.py: _has_file_search_tool (L98-L102); litellm/responses/main.py: mock_responses_api_response
  (L105-L154); litellm/responses/main.py: responses (L1128-L1367). Abstract/protocol declarations map to native
  types and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 253 owned nonblank/non-comment/non-docstring Python lines (258 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 273 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 541 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B176 (Trusted controls, provider headers
  and affinity), B198 (Injected call context and shared settings), B905 (Responses parameters), B931 (Responses
  provider selection), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
