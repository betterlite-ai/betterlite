id: B1078
title: Responses synchronous create execution
description: >-
  Own the whole responses function, _has_file_search_tool and mock_responses_api_response in
  main.py, replacing the former split inside a call argument list. Implement responses_create
  in betterlite-core. B932 owns only aresponses above it. B905 handles forwarded headers/text
  format/options, B931 prefix/provider/prompt/file mapping, B176 affinity, B918 reasoning-effort
  mapping, B916 chat execution, B2414 native HTTP, B904 item/response IDs, B247 logging, B500
  residency and B185/B186 errors. B010 supplies generic parameters, B174 provisional resolution,
  B206 drop_params normalization and B198 REQUEST_TIMEOUT=6000.

  Keep one complete create state machine. Define a CreateInterception port here with MCP and
  file-search operations and typed Continue/Handled results. B080 supplies B955 at composition;
  this task does not import that dependent. Send MCP the prepared call before capability checks,
  then file-search the mapped reasoning/options before native/chat execution. The port preserves
  the source's complete argument lists and returns an intercepted result immediately. This is
  dependency inversion at an actual call boundary, not a split of responses into line stages.
  Default no-interception execution supports native/chat SDK cases before the outer composition.

  All named optional create arguments default null. Pop trusted aresponses and
  _require_encrypted_task_support with exact-true semantics, _skip_mcp_handler with ordinary
  truthiness and use_chat_completions_api through B931. Public JSON cannot manufacture trusted
  controls under B176; direct SDK/config callers can supply them. Merge headers, convert text,
  normalize prefix, run prompt management and affinity before the truthy-string mock shortcut.
  Afterwards resolve full provider, map supplied file IDs, invoke MCP, check encrypted support,
  overlay locals with kwargs, map reasoning, invoke file search and choose chat/native.

  Register SdkHttpCall::ResponsesCreate with real provider calls through B2401 and a pure
  HelperCall::ResponsesCreateLiterals for the mock builder/predicate via B171. The latter alone
  is a helper; HTTP tests must record actual requests. Keep input decoding in B902/B1087 and
  transport decoding below B2414. Owned source count 335 nonblank/non-comment lines. Estimate
  285 implementation, 160 tests, 115 fixtures, 130 adapters and 35 wiring, 725 total under 790.
