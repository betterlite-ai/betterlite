references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L98-L154
  why: File-search predicate and every fixed field/default of the local mock response.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L1127-L1458
  why: The complete decorated create function, including both dispatch calls and native execution tail.
dod:
- text: >-
    native_create_options_and_ids sends model=openai/gpt-4o,input=hello,headers={X-Trace:a},
    extra_headers={x-trace:b},text_format={type:json_object},temperature=0.2,service_tier=flex,
    safety_identifier=user-a. Expect POST /v1/responses with model=gpt-4o,input=hello,text.format.type=json_object,
    temperature=0.2,service_tier=flex,safety_identifier=user-a and only the winning trace value b.
    Null optional fields are omitted. A complete mock response id=resp_a is B904-encoded with
    provider=openai/model_id=deployment_a and hidden custom_llm_provider=openai. An encoded encrypted
    input item ID is restored before HTTP. extra_query={ignored:yes} is not sent on native create.
  proof: [native-create, oracle, python-sdk]
- text: >-
    chat_create_prefix_and_reasoning sends openai/chat_completions/gpt-4o and gets one POST
    /v1/chat/completions through B916 with the normalized model, not /responses. use_chat_completions_api=true
    does the same; absent native config also bridges. reasoning={effort:low} beats reasoning_effort=high;
    reasoning=null with reasoning_effort=low uses B918's {effort:low} plus its configured summary policy.
    Native timeout=null/0 becomes 6000 (or injected REQUEST_TIMEOUT=17); bridge timeout=0 remains 0,
    while null uses that shared default. allowed_openai_params and normalized drop_params reach
    B905; client_metadata is removed from bridge kwargs even if explicitly allowed.
  proof: [chat-create, oracle, python-sdk]
- text: >-
    create_affinity_and_interception_order sets provider_affinity_header=X-Session,session_id=s:
    upstream receives X-Session=s unless an existing case-insensitive header already supplies x.
    A session containing newline fails before mock/provider dispatch with BadRequestError,status=400,
    cause "session_id cannot contain HTTP header control characters",type=null,param=null,code=null.
    B176 owns invalid header-name literals. Native call traces show prompt then affinity then
    mock/full-resolution then file mapping then MCP then encrypted-capability then file search.
    A handled MCP result skips capability/native work. Its argument set omits service_tier,
    safety_identifier,text_format,allowed_openai_params; file-search receives all four. Its reasoning
    is mapped, while MCP receives the originally bound reasoning. True encrypted-support demand
    rejects an incapable/bridged target via B931's exact compatibility cause; 1 does not demand it.
  proof: [create-order, oracle, python-sdk]
- text: >-
    create_logging_metadata_precedence logs mapped options plus aresponses,call_id,model_info,
    data_residency and provider_affinity_header. A present litellm_metadata=null overrides the
    fallback metadata lookup; the named metadata argument remains a provider option, not that
    kwargs fallback. B500 supplies eu/us/null residency. Native execution receives client,
    shared_session, metadata default={} and provider should_fake_stream(model,original stream,provider).
    A typed returned response is ID-encoded/stamped; an iterator or coroutine is left for its
    consuming layer. HTTP 401 projects AuthenticationError,status=401,type=null,param=null,code=null
    under B185, with the shared bounded-message deviation rather than invented provider-body fields.
  proof: [create-logging, oracle, python-sdk]
- text: >-
    mock_response_literals calls the actual helper with text=hi and without an argument. The
    default text is "In a peaceful grove beneath a silver moon, a unicorn named Lumina discovered
    a hidden pool that reflected the stars. As she dipped her horn into the water, the pool began
    to shimmer, revealing a pathway to a magical realm of endless night skies. Filled with wonder,
    Lumina whispered a wish for all who dream to find their own hidden magic, and as she glanced
    back, her hoofprints sparkled like stardust." Expect id=resp_67ccd2bed1ec8190b14f964abc0542670bb6a6b452d3795b,
    message id=msg_67ccd2bf17f0819081ff3bb2cf6508e60bb6a6b452d3795b,created_at=1741476542,
    object=response,status=completed,model=gpt-4.1-2025-04-14, one assistant message/status=completed
    with output_text and annotations=[]. error,incomplete_details,instructions,max_output_tokens,
    previous_response_id,user and reasoning.effort/summary are null; parallel_tool_calls/store=true,
    temperature/top_p=1.0,text.format.type=text,tool_choice=auto,tools=[],truncation=disabled,metadata={}.
    Usage is input=36,cached=0,output=87,output_tokens_details={},total=123. SDK mock_response="hi"
    returns this without provider HTTP even if stream=true; empty string/non-string does not take
    the shortcut. File-search predicate is true only for a dict tool whose type is file_search;
    null,[],a different type or a non-dict item alone yields false.
  proof: [mock-literals, oracle, python-helper, python-sdk]
- text: Both SDK and pure-literal operation tags have new committed decoder seeds.
  proof: [case-corpora, oracle, python-sdk, python-helper]
checks:
  optional: []
  commands:
  - id: native-create
    why: native creation changes parameter/header precedence or ID provenance
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create::tests::native_create_options_and_ids($|::)/)'
  - id: chat-create
    why: the prefix reaches Responses HTTP or reasoning/zero-timeout behavior changes
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create::tests::chat_create_prefix_and_reasoning($|::)/)'
  - id: create-order
    why: interception bypasses the wrong preparation or credential-affinity checks
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create::tests::create_affinity_and_interception_order($|::)/)'
  - id: create-logging
    why: provider response identity or metadata precedence is lost
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create::tests::create_logging_metadata_precedence($|::)/)'
  - id: mock-literals
    why: the fixed mock payload/default text or file-search predicate changes
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create::tests::mock_response_literals($|::)/)'
  - id: python-sdk
    why: create parity lacks real decorated SDK calls against the provider mock
    run: test -f tools/oracle/sdk_http/responses_create.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: python-helper
    why: literal helper results are copied rather than independently executed
    run: test -f tools/oracle/helpers/responses_create_literals.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: case-corpora
    why: one of the two create operation tags has no new parser input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/responses-create-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_create_literals-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_helper_case_corpus)'
