deviations:
- what: Internal SDK errors retain status/class but use B184/B187 bounded messages instead of Python traceback text.
  why: The existing diagnostic policy applies to create's exception mapper too.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L1450-L1458
out_of_scope:
- B932 owns aresponses, B931 shared helpers, B1116 delete/cancel, B933 retrieve/input-items, B934 compact and B943 websocket functions.
- B955 owns whole MCP/file-search dispatch helpers and aresponses_api_with_mcp; B080 installs them behind the port defined here.
- The defensive custom_llm_provider=null native-send error is unreachable after a null config selects chat; do not invent a production branch to test it.
- B234 owns supplied managed-file mappings behind B931; managed storage and URL downloads are not performed by this create function.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_create_literals in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_create_literals.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_create_literals.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Mock response returns before full model resolution and response-ID stamping, but after prompt and affinity processing.
- Native timeout=0 falls back while chat-bridge timeout=0 is preserved.
- MCP receives bound reasoning before reasoning_effort mapping and omits four arguments present in file-search dispatch.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
