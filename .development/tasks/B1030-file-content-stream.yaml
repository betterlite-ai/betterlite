id: B1030
title: File content stream
description: >-
  Implement file-content bytes/streaming with incremental forwarding, success/failure logging and deterministic
  stream closure using B009/B012. Resolve authorized file/model parameters before opening the stream, preserve content-type/disposition
  and do not aggregate large files merely for logs.


  In file_binary_content, include a Bedrock provider-config case: utils.py L9425-L9428 always constructs BedrockFilesConfig,
  so files/main.py L938-L957 delegates the generic HTTP content path using B645 request preparation and B646 binary
  reply handling, then returns. The later BedrockFilesHandler boto3 branch L1009-L1018 is unreachable with the pinned
  registry and has no live caller; do not port it or mock away the registry merely to exercise it.


  Implement crates/betterlite-core/src/api/file_content_stream.rs. Use FileContentStreamInput and FileContentStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions file_binary_content, file_stream_cancel, content_provider_error, stream_terminal_logging,
  streaming_query_selection under api::file_content_stream::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.vertex_project
  defaults to None; env.VERTEXAI_PROJECT defaults to unset (None); litellm_settings.vertex_location defaults to
  None; env.VERTEXAI_LOCATION defaults to unset (None); env.VERTEXAI_CREDENTIALS defaults to unset (None). No environment
  reads occur outside betterlite-config. Test api::file_content_stream::tests::loads_settings uses the production
  Config loader and an injected environment map, with a named rstest case for every key above, explicit override,
  unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key
  report; a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder
  rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileContentStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_content_stream: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/files/main.py: _should_sdk_support_streaming (L83-L89); litellm/files/main.py: _file_content_logging_obj
  (L92-L104); litellm/files/main.py: afile_content (L806-L849); litellm/files/main.py: file_content (L853-L1031);
  litellm/files/main.py: file_content_streaming (L1034-L1138). Abstract/protocol declarations map to native types
  and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 312 owned nonblank/non-comment/non-docstring Python lines (323 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 332 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 45 config tests/seeds and
  30 wiring; 627 total within the 630-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B012
  (Logging pipeline, callback registry and redaction), B171 (Direct helper oracle and URL path encoding), B1015
  (File contracts), B1020 (File credentials), B1080 (File stream logging), B1087 (Api boundaries), B516 (OpenAI
  file lifecycle and streaming content), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
