id: B1030
title: File content SDK dispatch and streaming selection
description: >-
  Implement whole _should_sdk_support_streaming, _file_content_logging_obj, afile_content,
  file_content and file_content_streaming in betterlite-core::api::file_content_stream.
  The provider registry always returns configs for Vertex and Bedrock, so their later legacy
  handler branches never execute. Remove the former task's VERTEXAI_PROJECT, VERTEXAI_LOCATION
  and VERTEXAI_CREDENTIALS loader work: those reads exist only in that unreachable fallback;
  concrete Vertex configs retain their own live credential settings.

  Use B2463 for generic binary/streamed HTTP, B516 compatible content, B694 Azure, B500/B2200
  credentials, B174 model resolution, B176 trusted controls, B1080 stream logging and B012 logger
  construction. B2464 owns file config and timeout selection. xAI batch-results detection/handling
  stays with its existing B1407 provider owner.
  Register B2401 SDK HTTP operation file_content_stream for both SDK modes, actual bytes/headers,
  error facts and close effects. No helper oracle, route authorization or new parser belongs here.
  Tests are in api::file_content_stream::tests. Counted owned spans have 324 nonblank/non-comment
  lines; 250 implementation, 170 tests, 140 fixtures, 100 adapters and 30 wiring lines total 690.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_content_stream.rs
  - crates/betterlite-core/src/api/file_content_stream/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/file_content_stream.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/file_content_stream.py
  - tools/oracle/cases/sdk-http/file-content-stream/**
  - tools/oracle/fuzz/corpus/sdk_http_case/file-content-stream-*
  - tools/oracle/helpers/b1030.py
  - tools/oracle/helpers/b1030/**
  - tools/oracle/src/helpers/core_ops/b1030.rs
  - tools/oracle/src/helpers/core_ops/b1030/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/main.py#L83-L104
  why: Exact supported-provider predicate and fallback logging identity.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/main.py#L805-L1138
  why: Whole buffered/streamed SDK functions and nested wrappers; no argument list is split.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9410-L9445
  why: Vertex and Bedrock configs return before the obsolete credential/handler fallbacks.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L4185-L4193
  why: The streaming set is exactly openai, hosted_vllm, litellm_proxy and vertex_ai.
dod:
- text: >-
    file_content_defaults calls afile_content(file_id=f): provider=openai,stream=false,
    chunk_size=1048576,extra_headers/extra_body=null; returned bytes b"\x00\xff" remain binary.
    Sync undecorated provider defaults None; only afile_content=true selects async internally.
    Model resolution occurs when model is non-null, swallows resolution errors and retains the
    previous provider. Trusted credentials are copied before api_key/api_base are assigned, including null.
    timeout or request_timeout or 600 selects the deadline; numeric text is converted to float;
    HTTP timeout objects survive openai/azure/bedrock and otherwise reduce to read or 600.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    buffered_content_dispatch tests openai,hosted_vllm,litellm_proxy via B516; azure via B694;
    anthropic,bedrock,vertex_ai through B2463's config path. xai with its recognized batch-results
    id uses B1407 before config lookup, while an ordinary xai file uses its config. Generic clients
    are accepted only as HTTPHandler/AsyncHTTPHandler; Azure gets the supplied client, compatible
    buffered calls do not. extra_headers/extra_body stay in FileContentRequest and provider transforms
    decide their use. Provider 404/429 statuses and error type/param/code/message survive unchanged.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    sdk_stream_selection sends stream=true: openai,hosted_vllm,litellm_proxy return streamed bytes
    and headers; vertex_ai does so only asynchronously. azure,bedrock,anthropic still take their
    buffered path without warning. Sync vertex_ai raises BadRequestError 400,type=null,param=null,
    code=null,message="litellm.BadRequestError: Streaming 'file_content' for vertex_ai is only
    supported through 'afile_content'.", model=n/a,response body="Unsupported provider",request
    method=file_content. Explicit chunk_size=3 reaches the stream adapter; default is 1048576.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    streaming_logging_identity passes a real logging object unchanged; otherwise construct
    model="",messages=[],stream=false,call_type=file_content/afile_content,clock start_time,
    litellm_call_id=str(truthy supplied id or UUID),function_id=str(id or ""). Streaming then
    writes logger.model and details.model=model or "", details.custom_llm_provider, and writes
    details.litellm_params.api_base only if optional api_base is non-null (empty string is retained).
    B1080 wraps the returned iterator and preserves headers, EOF/error/cancellation callbacks.
    Compatible streaming accepts only OpenAI/AsyncOpenAI clients; Vertex accepts only AsyncHTTPHandler.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    unsupported_file_content uses enum-valid cohere, gets BadRequestError 400,type=null,param=null,
    code=null,message="litellm.BadRequestError: LiteLLM doesn't support cohere for 'file_content'.
    Supported providers are 'openai', 'azure', 'vertex_ai', 'bedrock', 'manus', 'anthropic'.",
    model=n/a,response body="Unsupported provider",request method=create_thread and
    URL=https://github.com/BerriAI/litellm. Unknown provider text fails enum conversion instead.
    Neither failure fetches content. The unreachable streaming-helper unsupported-provider branch
    is not made reachable by patching the supported-provider predicate.
  proof: [behavior-tests, oracle, sdk-python]
- text: Actual byte-stream captures and the SDK content operation seed are newly added.
  proof: [new-cases, sdk-seeds, oracle, sdk-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: stream selection, credential projection and logger identity lack native coverage
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_content_stream::tests::/) - test(/replays_/)'
  - id: sdk-python
    why: content SDK adapter does not execute and type-check independently
    run: test -f tools/oracle/sdk_http/file_content_stream.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-seeds
    why: SDK binary content operation has no new seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/file-content-stream-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: file content has no new SDK provider captures
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/file-content-stream)"
oracle_cases:
- tools/oracle/cases/sdk-http/file-content-stream/file-content-defaults.yaml
- tools/oracle/cases/sdk-http/file-content-stream/buffered-content-dispatch.yaml
- tools/oracle/cases/sdk-http/file-content-stream/sdk-stream-selection.yaml
- tools/oracle/cases/sdk-http/file-content-stream/streaming-logging-identity.yaml
- tools/oracle/cases/sdk-http/file-content-stream/unsupported-file-content.yaml
deviations: []
out_of_scope:
- B1028 owns upload/delete, B1029 retrieve/list; B1080 owns FileContentStreamingResponse and B1033 the proxy stream pump/response constructor.
- Legacy Vertex/Bedrock handler branches L988-L1018 and the unsupported streaming-provider branch have no reachable caller at the pin. Do not add fake registry fallthrough or duplicate their configuration.
- B2464 supplies file config/timeout selection; provider transformations remain their existing owners. B2463 executes their content plans, while B036 owns xAI batch results.
pitfalls:
- stream=true is silently ignored for providers outside the four-member streaming set.
- Content fallback logging uses truthiness for litellm_call_id; retrieve/delete use a missing-key default instead.
- Vertex's live config prevents every environment read in the later legacy Vertex branch.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
