id: B2360
title: Request credential and callback field ban catalog
description: >-
  Supply the ordered RequestBanCatalog consumed by B884 without importing callback implementations.
  Own auth_utils.py _build_banned_observability_params L281-L303 and its supporting constant tables
  L231-L277 and L306-L377. The builder is called at module initialization. Its source field names are
  protocol data, not permission to implement pricing or callback execution. Retain the exact base order,
  then sorted observability names, then sorted CustomPricingLiteLLMParams field names including inherited
  MirroredPricingParams. Duplicate entries remain as at the pin; first failing field order is observable.

  Base banned names are api_base, base_url, user_config, aws_sts_endpoint, aws_web_identity_token,
  aws_role_name, aws_profile_name, aws_session_name, aws_external_id, aws_session_tags, vertex_credentials,
  azure_ad_token, aws_bedrock_runtime_endpoint, aws_bedrock_project_id, workspace_id, aws_workspace_id,
  anthropic_workspace_id, anthropic-workspace-id, bedrock_tags, agentcore_runtime_session_id,
  s3_endpoint_url, sagemaker_base_url, deployment_url, nvcf_function_id, use_ssl, rust, model_list and
  vertex_ai_credentials. Nested config slots are litellm_embedding_config and extra_body; metadata
  slots are metadata and litellm_metadata. The root-only unconditional model_list rule remains B884's.

  Observability bans union the supported callback fields minus langfuse_prompt_version and
  langsmith_sampling_rate with request-blocked names and four extras. The resulting names are
  langfuse_public_key, langfuse_secret, langfuse_secret_key, langfuse_host, langfuse_environment,
  langsmith_api_key, langsmith_project, langsmith_base_url, langsmith_tenant_id, humanloop_api_key,
  arize_api_key, arize_space_key, arize_space_id, arize_success_sampling_rate, arize_error_sampling_rate,
  posthog_api_key, posthog_host, braintrust_api_key, braintrust_project, braintrust_host, slack_webhook_url,
  lunary_public_key, dd_api_key, dd_site, dd_agent_host, dd_agent_port, newrelic_api_key, newrelic_region,
  signoz_ingestion_endpoint, signoz_ingestion_key, turn_off_message_logging, gcs_bucket_name,
  gcs_path_service_account, posthog_api_url, user_api_key_auth_metadata, wandb_api_key and weave_project_id.
  phoenix_project_name and phoenix_project_name_override are intentionally absent because this proxy
  reads trusted key/team metadata for them. Preserve the two informational exceptions even though they
  occur in the callback source table.

  Pricing names include input_cost_per_token, output_cost_per_token, input_cost_per_character,
  output_cost_per_character, cache_read_input_token_cost, cache_creation_input_token_cost and tiered_pricing.
  The subclass adds cost_per_second, input_cost_per_second, output_cost_per_second,
  output_cost_per_second_1080p, output_cost_per_second_480p, output_cost_per_second_720p,
  output_cost_per_second_768p, output_cost_per_second_2k, output_cost_per_second_4k,
  output_cost_per_image_512, output_cost_per_image_1024, output_cost_per_image_1536,
  input_cost_per_pixel, output_cost_per_pixel, input_cost_per_token_flex, input_cost_per_token_priority,
  input_cost_per_token_balanced, input_cost_per_token_ultrafast, cache_creation_input_token_cost_above_1hr,
  cache_creation_input_token_cost_above_200k_tokens, cache_creation_input_token_cost_above_272k_tokens,
  cache_creation_input_token_cost_above_272k_tokens_priority, cache_creation_input_token_cost_above_272k_tokens_flex,
  cache_creation_input_token_cost_above_272k_tokens_ultrafast, cache_creation_input_token_cost_flex,
  cache_creation_input_token_cost_priority, cache_creation_input_token_cost_ultrafast,
  cache_creation_input_audio_token_cost, cache_read_input_token_cost_flex, cache_read_input_token_cost_priority,
  cache_read_input_token_cost_balanced, cache_read_input_token_cost_ultrafast,
  cache_read_input_token_cost_above_200k_tokens, cache_read_input_token_cost_above_200k_tokens_priority,
  cache_read_input_token_cost_above_272k_tokens_priority, cache_read_input_token_cost_above_272k_tokens_flex,
  cache_read_input_token_cost_above_272k_tokens_ultrafast, cache_read_input_token_cost_batches,
  cache_read_input_token_cost_above_200k_tokens_batches, cache_read_input_token_cost_above_272k_tokens_batches,
  cache_creation_input_token_cost_batches, cache_creation_input_token_cost_above_200k_tokens_batches,
  cache_creation_input_token_cost_above_272k_tokens_batches, cache_read_input_audio_token_cost,
  cache_read_input_image_token_cost, input_cost_per_character_above_128k_tokens, input_cost_per_audio_token,
  input_cost_per_token_cache_hit, input_cost_per_token_above_128k_tokens, input_cost_per_token_above_200k_tokens,
  input_cost_per_token_above_200k_tokens_priority, input_cost_per_token_above_272k_tokens_priority,
  input_cost_per_token_above_272k_tokens_flex, input_cost_per_token_above_272k_tokens_ultrafast,
  input_cost_per_token_above_200k_tokens_batches, input_cost_per_token_above_272k_tokens_batches,
  input_cost_per_query, input_cost_per_image, input_cost_per_image_above_128k_tokens,
  input_cost_per_audio_per_second, input_cost_per_audio_per_second_above_128k_tokens,
  input_cost_per_video_per_second, input_cost_per_video_per_second_above_128k_tokens,
  input_cost_per_video_per_second_above_15s_interval, input_cost_per_video_per_second_above_8s_interval,
  input_cost_per_audio_token_batches, input_cost_per_image_token_batches, input_cost_per_token_batches,
  input_cost_per_video_token_batches, output_cost_per_token_batches, output_cost_per_token_flex,
  output_cost_per_token_priority, output_cost_per_token_balanced, output_cost_per_token_ultrafast,
  output_cost_per_audio_token, output_cost_per_token_above_128k_tokens, output_cost_per_token_above_200k_tokens,
  output_cost_per_token_above_200k_tokens_priority, output_cost_per_token_above_272k_tokens_priority,
  output_cost_per_token_above_272k_tokens_flex, output_cost_per_token_above_272k_tokens_ultrafast,
  output_cost_per_token_above_200k_tokens_batches, output_cost_per_token_above_272k_tokens_batches,
  output_cost_per_character_above_128k_tokens, output_cost_per_image, output_cost_per_image_token,
  output_cost_per_video_token, output_cost_per_reasoning_token, output_cost_per_reasoning_token_flex,
  output_cost_per_reasoning_token_priority, output_cost_per_video_per_second, output_cost_per_audio_per_second,
  search_context_cost_per_query, google_maps_grounding_cost_per_query, citation_cost_per_token,
  cache_read_input_token_cost_above_272k_tokens, cache_read_input_token_cost_above_512k_tokens,
  input_cost_per_image_token, input_cost_per_video_token, input_cost_per_token_above_272k_tokens,
  input_cost_per_token_above_512k_tokens, output_cost_per_token_above_272k_tokens,
  output_cost_per_token_above_512k_tokens, output_vector_size, ocr_cost_per_page, ocr_cost_per_page_batches,
  ocr_cost_per_credit, annotation_cost_per_page, annotation_cost_per_page_batches,
  regional_processing_uplift_multiplier_eu, regional_processing_uplift_multiplier_us and
  regional_endpoint_uplift_multiplier. Values/defaults and strip_custom_pricing_fields are not owned here.

  Provide a named rstest field-membership case for each literal above, using the field's Rust-safe name,
  plus ordered_base_then_sorted_sets, inherited_pricing_included, safe_callback_exclusions,
  phoenix_inert_fields_absent and nested_slot_order. The Python oracle reads the actual MIT constants
  and invokes the builder; it does not carry a copied expected table. Add request_ban_catalog under
  B856 Management::auth in both dispatchers and seed B171 helper_case. No new decoder, SQL or settings.
  The owned table/builder has 68 executable source lines and consumes 165 additional pricing/callback
  declaration lines; allow 220 production/table lines, 230 tests, 65 adapters and 30 wiring, 545 within
  600. Keep implementation modules below 300 lines and tests adjacent.
scope:
  paths:
    - crates/betterlite-auth/src/request_ban_catalog.rs
    - crates/betterlite-auth/src/request_ban_catalog/**
    - tools/oracle/src/helpers/auth/request_ban_catalog.rs
    - tools/oracle/src/helpers/auth/request_ban_catalog/**
    - tools/oracle/helpers/request_ban_catalog.py
    - tools/oracle/helpers/request_ban_catalog/**
    - tools/oracle/cases/helpers/request-ban-catalog/**
    - tools/oracle/fuzz/corpus/helper_case/request-ban-catalog-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L231-L377
    why: Own the static request ban tables and observability union builder.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L3711-L3843
    why: Read every inherited and declared pricing field name; no pricing calculations are implemented here.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/initialize_dynamic_callback_params.py#L85-L144
    why: The canonical supported and blocked callback fields used by the union.
dod:
  - text: Every named field has its own membership case; the order, inheritance and deliberate exclusions match the pin.
    proof: [behavior-tests, oracle, helper-python]
  - text: The new request_ban_catalog helper operation runs both implementations and has an added decoder seed.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Field-level policy cases are missing or a request field disappeared from the catalog.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^request_ban_catalog::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The catalog adapter is missing or fails strict Python checking.
      run: test -f tools/oracle/helpers/request_ban_catalog.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The operation was not added to the helper decoder corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/request-ban-catalog-*')" && grep -rlq request_ban_catalog tools/oracle/fuzz/corpus/helper_case/request-ban-catalog-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/request-ban-catalog/ordered-fields.yaml
  - tools/oracle/cases/helpers/request-ban-catalog/callback-exceptions.yaml
deviations: []
out_of_scope:
  - B884 applies the tables and owns request traversal, opt-ins and error mapping; the other auth_utils functions retain their existing B741-B746, B880-B882 and B054 owners.
  - B189 owns dynamic callback initialization; this task reads its field contract without executing callbacks.
pitfalls:
  - 'The oracle helper for this task is pre-registered as request_ban_catalog in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/request_ban_catalog.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/request_ban_catalog.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - CustomPricingLiteLLMParams.model_fields includes its seven inherited fields; inspecting only the subclass loses basic per-token overrides.
  - user_api_key_auth_metadata is banned even though phoenix_project_name is not.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
