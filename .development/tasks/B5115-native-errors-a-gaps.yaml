deviations: []
out_of_scope:
  - Padded one-line functions in these files. They belong to B5094, and B5094 clears the no-one-line-functions and no-padded-one-line-functions legacy lists. This task does not touch .ast-grep/rules/.
  - The fixed status per error class. B5102 owns it and has merged.
  - Cloudflare. The review found no gap there, so cloudflare.rs and cloudflare/tests.rs stay as they are.
  - huggingface.rs and ai21.rs. They already run LiteLLM's order, and only their tests change.
  - native.rs, dispatch.rs and tools/oracle/src/helpers/error/native_errors_a.rs. dispatch_native returns the mapper's class before the catchall runs, and the Rust adapter serializes whatever class the mapper returns.
  - ErrorClass::Unclassified itself. The litellm_proxy branch still uses it.
  - The helper case fuzz corpus under tools/oracle/fuzz/corpus/helper_case.
pitfalls:
  - The re-raise answer carries model Some(String::new()) and provider Some(String::new()), not the request's model and "cohere", because LiteLLM's outer handler builds APIConnectionError(llm_provider="", model="").
  - ErrorClass::Unclassified is no stand-in, since its metadata writes type and param as the string "None" where APIConnectionError has null.
  - describe in cohere/tests.rs panics on ApiConnection today. It gains an api_connection arm, and Unclassified moves into the panic list.
  - The new order rows pass on main, since the code is already right. Prove each one by moving its clause in a scratch edit, watching the row and its case fail, and reverting before you commit.
  - rstest numbers cases once a function has more than nine, as case_01_name, so the filters match case_[0-9]+_name.
  - rate_limit and api results nest the message under context, so those cases ignore /value/result/context/message. Every other classified case ignores /value/result/message. A null result and the native_error dispatch case use an empty ignore list, as generic-fallback.yaml does.
  - Hugging Face cases use model hf/model-a and error_str. AI21 cases use model ai21/model-a and message, not error_str. Cohere cases use model command-r and always send exception_type.
  - B5094 also edits cohere.rs and cohere/tests.rs. Merge main before you start and keep whatever shape it left.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
