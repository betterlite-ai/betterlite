checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::anthropic_beta_config::/)
      - test(/::replays_corpus$/)'
  - id: case-local-beta-matrix
    why: the local-beta-matrix behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::local_beta_matrix($|::)/)'
  - id: case-invalid-matrix-fallback
    why: the invalid-matrix-fallback behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::invalid_matrix_fallback($|::)/)'
  - id: case-remote-fetch-failure-local
    why: the remote-fetch-failure-local behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::remote_fetch_failure_local($|::)/)'
  - id: case-reload-matrix
    why: the reload-matrix behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::reload_matrix($|::)/)'
  - id: case-provider-name-normalization
    why: the provider-name-normalization behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::provider_name_normalization($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/anthropic-beta-config-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/anthropic_beta_config)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/anthropic_beta_config.rs && grep -qF "decode_beta_matrix"
      crates/betterlite-core/fuzz/fuzz_targets/anthropic_beta_config.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/anthropic_beta_config.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/anthropic_beta_config-*)"
      && grep -qE "^[[:space:]]+anthropic_beta_config:" tools/oracle/fuzz/corpus/helper_case/anthropic_beta_config-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/anthropic-beta-config)"
