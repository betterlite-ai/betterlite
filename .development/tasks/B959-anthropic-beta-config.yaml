id: B959
title: Anthropic beta configuration loading and cache
description: >-
  Build the process-local beta matrix loader in betterlite-core::api::anthropic_beta_config. Own every function
  in anthropic_beta_headers_manager.py L47-L212, including explicit reload and one-hop provider alias lookup.
  Bundle the complete pinned anthropic_beta_headers_config.json, including description and all seven provider
  maps; do not replace it with a smaller supported-header sample. B960 consumes the resulting snapshot.

  B002 resolves LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS, default empty string, by lowercasing and comparing to true
  without trimming. LITELLM_ANTHROPIC_BETA_HEADERS_URL initializes litellm_settings.anthropic_beta_headers_url,
  default https://raw.githubusercontent.com/BerriAI/litellm/main/litellm/anthropic_beta_headers_config.json.
  A configured URL is operator input. Fetch through B009 with GET, a five-second timeout and status checking.
  Cache the first result even when it is the empty local fallback; reload clears it before attempting another load.
  Log debug after a cache fill and info on reload; a cache hit performs neither I/O nor another load diagnostic.

  decode_beta_matrix(bytes, ApiLimits) handles bounded UTF-8 JSON from disk or HTTP. Validation only requires a
  nonempty object containing anthropic, azure_ai, bedrock, bedrock_converse or vertex_ai. It does not validate the
  provider value shape; retain that distinction in typed dynamic configuration nodes, without unsafe indexing.
  JSON decode failure is a fetch failure, while a parsed invalid shape causes an integrity warning as well as the
  shape-specific warning. The bundled-file failure seam returns the exact six empty objects in the case below.

  B171 helper cases cover validation and alias lookup with injected snapshots; B2401 sdk_http cases cover loading,
  caching and reload against an actual mock configuration endpoint. Add AnthropicBetaConfig to both typed dispatches.
  SDK capture projects the matrix, diagnostics and GET count; no request can select an arbitrary URL. Fuzz the
  production JSON decoder and replay it separately from behavior tests. Config tests use B002's real loader.

  Count 128 nonblank/non-comment Python lines and 253 JSON lines. Budget 140 loader/decoder, 253 bundled data,
  115 tests, 70 fixtures, 85 adapters, 50 fuzz/replay and 50 config/wiring lines, 763 total.
