references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_beta_headers_manager.py#L47-L212
  why: Load, validate, fetch, cache, reload and resolve one alias; warnings select local fallback rather than rejecting startup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_beta_headers_config.json#L1-L253
  why: The complete fallback matrix is observable, including null entries and the absence of provider_aliases.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L434-L437
  why: The environment override initializes the configurable remote URL even when its value is empty.
dod:
- text: >-
    local_matrix_snapshot sets local mode=True and compares the entire loaded object to the pinned bundled JSON,
    including every header spelling/value/null. Its provider keys are anthropic,azure_ai,bedrock_converse,bedrock,
    bedrock_mantle,vertex_ai,databricks; there is no provider_aliases. In particular bedrock advanced-tool-use-2025-11-20
    maps to tool-search-tool-2025-10-19, anthropic compact-2026-09-04 maps to itself, azure_ai compact-2026-01-12 is
    null, and bedrock_mantle claude-code-20250219 maps to itself. No HTTP request is made.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    matrix_validation accepts {anthropic:{}} and {anthropic:null}; rejects [], {}, {provider_aliases:{}},
    {databricks:{}} and {bedrock_mantle:{}}. Rejections log respectively not-a-dict, empty or missing-provider-key
    warning, then the integrity-check warning, and return the complete local matrix. A corrupt local file logs
    error and returns {anthropic:{},azure_ai:{},bedrock:{},bedrock_converse:{},vertex_ai:{},provider_aliases:{}}.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    remote_matrix_cache gets mock 200 {anthropic:{custom:renamed}} once and returns that object on two loads;
    reload gets a second response {bedrock:{custom:null}}, logs info before GET and debug after loading, and the
    next load returns the second object without GET. The fetch timeout is 5 seconds. HTTP 503, invalid JSON and
    timeout each produce one fetch-warning and fall back to the local snapshot, which is also cached.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    provider_alias_resolution injects {anthropic:{},provider_aliases:{first:second,second:anthropic}}. first resolves
    to second, not anthropic; second resolves to anthropic; unknown remains unknown. The bundled configuration
    leaves vertex_ai_beta unchanged because it contains no alias table.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    loads_beta_settings checks omitted, empty, false, 1 and " true " local flags all allow remote loading, while
    true, TRUE and True select local-only. The URL defaults to the literal GitHub URL in the description; a test
    URL replaces it, an explicitly empty URL stays empty and therefore fetches unsuccessfully with local fallback,
    and litellm_settings.anthropic_beta_headers_url overrides the environment-initialized value.
  proof: [config-tests, config-corpus, oracle, adapters]
- text: The beta JSON decoder rejects oversize and malformed input within limits, and new seeds exercise the production decoder and helper tag.
  proof: [parser-corpus, helper-corpus, new-cases]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: beta cache and validation behavior is missing in core or config
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::anthropic_beta_config::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: local mode or URL precedence is not supported by the config loader
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::loads_beta_settings($|::)/)'
  - id: config-corpus
    why: the new beta settings have no config parser seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/anthropic-beta-config-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: remote matrix JSON does not reach the tested decoder
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/anthropic_beta_config.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/anthropic_beta_config)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::anthropic_beta_config::tests::replays_corpus$/)'
  - id: adapters
    why: the validation helper or real HTTP loader has no independently checked Python driver
    run: test -f tools/oracle/helpers/anthropic_beta_config.py && test -f tools/oracle/sdk_http/anthropic_beta_config.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: helper-corpus
    why: the pure matrix operation is not accepted by the helper protocol
    run: grep -qE '^[[:space:]]+anthropic_beta_config:' tools/oracle/fuzz/corpus/helper_case/anthropic_beta_config-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no configuration HTTP captures or validation fixtures were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/anthropic-beta-config)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/anthropic-beta-config)"
oracle_cases:
- tools/oracle/cases/sdk-http/anthropic-beta-config/local-matrix-snapshot.yaml
- tools/oracle/cases/sdk-http/anthropic-beta-config/remote-matrix-cache.yaml
- tools/oracle/cases/sdk-http/anthropic-beta-config/load-settings.yaml
- tools/oracle/cases/helpers/anthropic-beta-config/matrix-validation.yaml
- tools/oracle/cases/helpers/anthropic-beta-config/provider-alias-resolution.yaml
deviations: []
out_of_scope:
- B960 owns filter_and_transform_beta_headers, update_headers_with_filtered_beta and update_request_with_filtered_beta.
- is_beta_header_supported, get_provider_beta_header and get_unsupported_headers have no caller at the pin and are not rebuilt.
- B124 owns the administrative proxy routes that trigger reload; this task exports the reload operation only.
pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_beta_config in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/anthropic_beta_config.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_beta_config.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A matrix containing only databricks or bedrock_mantle is rejected despite both providers appearing in the bundled JSON.
- Cache presence is tested against null, so an empty fallback must not trigger repeated fetching.
- The local-only flag does not trim spaces and is not a general boolean parser.
review_level: standard
budget:
  max_changed_lines: 780
  max_new_expects: 0
