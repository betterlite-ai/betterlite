  - oracle
- text: 'invalid matrix fallback: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-invalid-matrix-fallback
  - oracle
- text: 'remote fetch failure local: the named production behavior test asserts the result and effects described
    above.'
  proof:
  - case-remote-fetch-failure-local
  - oracle
- text: 'reload matrix: the named production behavior test asserts the result and effects described above.'
