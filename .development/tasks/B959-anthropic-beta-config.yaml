out_of_scope:
- 'litellm/anthropic_beta_headers_manager.py: B960 owns filter_and_transform_beta_headers L215-L266, update_headers_with_filtered_beta
  L321-L356, update_request_with_filtered_beta L359-L392.'
- 'litellm/anthropic_beta_headers_manager.py: is_beta_header_supported L269-L288, get_provider_beta_header L291-L318,
  get_unsupported_headers L395-L410 are out of scope: no MIT runtime caller at the pin; unused entry point is not
  rebuilt.'
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
