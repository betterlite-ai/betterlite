id: B959
title: Anthropic beta config
description: >-
  Load and validate the pinned beta-header provider matrix using local JSON with an injected configured refresh
  fetcher. Preserve local-beta behavior, documented source URL override, validation fallback and reload semantics;
  remote config destinations are operator configuration, never request fields. Store the source JSON as a fixture
  with its pin. Resolve LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS (unset/empty means false, case-insensitive true means
  local-only) and LITELLM_ANTHROPIC_BETA_HEADERS_URL (default https://raw.githubusercontent.com/BerriAI/litellm/main/litellm/anthropic_beta_headers_config.json);
  a fetch or integrity failure warns and uses the pinned bundled matrix.


  Implement crates/betterlite-core/src/api/anthropic_beta_config.rs. Use AnthropicBetaConfigInput and AnthropicBetaConfigResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions local_beta_matrix, invalid_matrix_fallback, remote_fetch_failure_local,
  reload_matrix, provider_name_normalization under api::anthropic_beta_config::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.LITELLM_ANTHROPIC_BETA_HEADERS_URL
  defaults to 'https://raw.githubusercontent.com/BerriAI/litellm/main/litellm/anthropic_beta_headers_config.json';
  env.LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS defaults to ''. No environment reads occur outside betterlite-config.
  Test api::anthropic_beta_config::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  The production external-byte decoder is betterlite-core::api::anthropic_beta_config::decode_beta_matrix(bytes:
  &[u8], limits: &ApiLimits), for bounded bundled or configured remote JSON bytes. Place its implementation in crates/betterlite-core/src/api/anthropic_beta_config.rs
  and call it from the actual boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/anthropic_beta_config.rs
  passes arbitrary bounded bytes to that exact decoder; api::anthropic_beta_config::tests::replays_corpus replays
  newly committed seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::AnthropicBetaConfig in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {anthropic_beta_config: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/anthropic_beta_headers_manager.py: GetAnthropicBetaHeadersConfig.load_local_beta_headers_config
  (L47-L64); litellm/anthropic_beta_headers_manager.py: GetAnthropicBetaHeadersConfig._check_is_valid_dict (L67-L98);
  litellm/anthropic_beta_headers_manager.py: GetAnthropicBetaHeadersConfig.validate_beta_headers_config (L101-L107);
  litellm/anthropic_beta_headers_manager.py: GetAnthropicBetaHeadersConfig.fetch_remote_beta_headers_config (L110-L119);
  litellm/anthropic_beta_headers_manager.py: get_beta_headers_config (L122-L159); litellm/anthropic_beta_headers_manager.py:
  _load_beta_headers_config (L162-L183); litellm/anthropic_beta_headers_manager.py: reload_beta_headers_config (L186-L197);
  litellm/anthropic_beta_headers_manager.py: get_provider_name (L200-L212). Abstract/protocol declarations map to
  native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 87 owned nonblank/non-comment/non-docstring Python lines (128 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 107 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 36 config tests/seeds
  and 30 wiring; 453 total within the 460-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B009 (Outbound HTTP clients, proxies,
  TLS and connection reuse for every provider), B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
