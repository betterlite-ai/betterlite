  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/bedrock_embedding_io.rs
  - crates/betterlite-bedrock/src/bedrock_embedding_io/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_embedding_io.rs
  - tools/oracle/src/helpers/bedrock_embedding_io/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_embedding_io.py
  - tools/oracle/cases/helpers/providers/bedrock-embedding-io/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_embedding_io*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_embedding_io.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_embedding_io/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/embed/embedding.py#L51-L252
  why: >-
    Own _sign_get_request, BedrockEmbedding._load_credentials, BedrockEmbedding._load_credentials, BedrockEmbedding._load_credentials,
    BedrockEmbedding._make_sync_call, BedrockEmbedding._make_async_call, BedrockEmbedding._transform_response. Other
    functions in this file remain with the owners listed below.
dod:
- text: >-
    signed embedding request: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-embedding-io/signed-embedding-request.yaml.
  proof:
  - case-signed-embedding-request
  - oracle
  - helper-python
- text: >-
    provider json response: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-embedding-io/provider-json-response.yaml.
  proof:
  - case-provider-json-response
  - oracle
  - helper-python
- text: 'embedding usage: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-embedding-io/embedding-usage.yaml.'
  proof:
  - case-embedding-usage
  - oracle
  - helper-python
- text: 'http error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-embedding-io/http-error.yaml.'
  proof:
  - case-http-error
  - oracle
  - helper-python
- text: New bedrock_embedding_io seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_embedding_response has newly committed malformed and boundary inputs replayed through production
    parsing.
  proof:
  - parser-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-signed-embedding-request
    why: The signed-embedding-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_embedding_io_cases::case_[0-9]+_signed_embedding_request$/)'
  - id: case-provider-json-response
    why: The provider-json-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_embedding_io_cases::case_[0-9]+_provider_json_response$/)'
  - id: case-embedding-usage
    why: The embedding-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_embedding_io_cases::case_[0-9]+_embedding_usage$/)'
  - id: case-http-error
    why: The http-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_embedding_io_cases::case_[0-9]+_http_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_embedding_io.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_embedding_io*")"
      && grep -lq 'bedrock_embedding_io' tools/oracle/fuzz/corpus/helper_case/bedrock_embedding_io* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_embedding_io$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_embedding_io)"
      && grep -q 'decode_embedding_response' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_embedding_io.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_embedding_io_corpus$/)'
