id: B693
title: Bedrock embedding HTTP and result projection
description: >-
  Port embedding credential loading, signed GET helper, HTTP send and typed response normalization. B631 retains
  provider selection/fanout and calls these reusable IO operations.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/embedding.py:
  _sign_get_request L51-L62; BedrockEmbedding._load_credentials L67-L71; BedrockEmbedding._load_credentials L74-L78;
  BedrockEmbedding._load_credentials L80-L106; BedrockEmbedding._make_sync_call L111-L142; BedrockEmbedding._make_async_call
  L144-L176; BedrockEmbedding._transform_response L178-L252.


  Named case contracts: signed_embedding_request: _sign_get_request signs method GET with data=None, supplied headers
  and URL, SigV4 service bedrock and the supplied region, then returns the prepared request. Use the B595 signing
  library implementation; no bearer override is applied. Missing boto3 is the Python-only ImportError Missing boto3
  to call bedrock. Run 'pip install boto3'.; the Rust signer is compiled in. provider_json_response: Create a B173
  client only when the supplied client is absent or the wrong sync/async handler type. Pass timeout only when not
  None; numeric int/float values become the equivalent HTTP timeout, while an existing timeout record is retained.
  Async client provider is BEDROCK. POST exact URL, signed headers and JSON-dumped data, then raise_for_status and
  decode_embedding_response on response bytes. Supplied compatible clients retain their own timeout. JSON decoding
  failures occur after the transport catch block and propagate as decoder errors; other transport failures are not
  converted by this method. embedding_usage: For regular replies choose exact model amazon.titan-embed-image-v1
  -> B627 multimodal with batch_data, amazon.titan-embed-text-v1 and amazon.titan-embed-g1-text-02 -> B627 G1, amazon.titan-embed-text-v2:0
  -> B627 V2, before selecting provider=twelvelabs -> B629 or nova -> B628, both with batch_data. Preserve delegated
  data, usage and model. No matching branch raises generic Exception Unable to map model response to known provider
  format. model={model}. Cohere replies are not transformed here. http_error: Sync and async POST catch HTTPStatusError
  and raise B682 BedrockError preserving response status,text,headers and response. Catch timeout separately as
  status 408 with Timeout error occurred. and B682 default fields. A malformed successful JSON body is not mislabeled
  as an HTTP-status failure. embedding_credentials: Call B590 pop_aws_auth_params, then pop aws_region_name from
  the caller options. If the region is None, read B129 get_secret AWS_REGION_NAME and then AWS_REGION; only string
  values count, including empty strings, and AWS_REGION overrides AWS_REGION_NAME. If still None use us-west-2.
  An explicit region bypasses both lookups and is not validated by this helper. Any bearer_token other than None,
  including empty string, bypasses B594 resolve_credentials and returns credentials=None. Otherwise resolve with
  the extracted auth fields and chosen region. Reuse B590/B591 config loaders rather than duplicate the keys. async_embedding_single_arn:
  Only truthy is_async_invoke with exactly one response containing invocationArn enters the async reply branch,
  including an explicit None ARN. Delegate twelvelabs to B629 and nova to B628; all other providers return one index-0
  object=embedding with empty vector, zero prompt/total usage and HiddenParams._invocation_arn. Multiple ARN records
  or an absent ARN instead take regular model/provider dispatch, including its failures. Exercise the same placeholder
  shape as B628/B629.


  Write standalone Rust test bedrock_embedding_io_credential_identity_isolation in betterlite-bedrock: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test bedrock_embedding_io_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B682. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/bedrock_embedding_io.rs with adjacent tests under bedrock_embedding_io/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_embedding_io_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): signed_embedding_request, provider_json_response, embedding_usage, http_error, embedding_credentials, async_embedding_single_arn.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_embedding_io* using HelperCase: kind:
  helper and the externally tagged bedrock_embedding_io variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_embedding_io that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_embedding_response consumes Bedrock embedding HTTP JSON response bytes in crates/betterlite-bedrock/src/bedrock_embedding_io.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_embedding_io.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_embedding_io.
  The adjacent test replays_the_bedrock_embedding_io_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 164 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 205 production lines, 235 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.
