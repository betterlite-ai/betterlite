dod:
  - text: >-
      POST /v1/mcp/server runs the database check, payload validation, the oauth2 flow stamp, the admin gate, the reserved id check and the existing id check in that order with the exact texts,
      forces approval_status active and clears submitted_by and submitted_at, answers 201 with the redacted row, and maps a conflict to 400 and a write error to 500.
    proof: [create-tests, oracle]
  - text: >-
      A failing registry refresh after a successful create is logged and the route still answers 201 with the redacted row.
    proof: [create-tests]
  - text: >-
      POST /v1/mcp/server/import converts, classifies against existing and earlier aliases, creates entries one at a time in order, reloads the registry once and only when something was imported,
      and returns imported, skipped and errors lists with LiteLLM's exact skip and error texts; a bad entry never fails the request.
    proof: [import-tests, oracle]
  - text: >-
      PUT /v1/mcp/server validates before the admin gate, snapshots the stored row with a swallowed read error, applies the discovery and DCR checks with their read-failed rules,
      maps conflict to 400 and a missing row to 404, updates and reloads the registry, purges per-user OAuth tokens only when the token identity changed, and answers 202 with the redacted row.
    proof: [update-tests, oracle]
  - text: >-
      DELETE /v1/mcp/server/{server_id} checks the database then the admin gate, answers 404 for an unknown id, removes the server from the registry and reloads it, and answers 202 with an empty body.
    proof: [delete-tests, oracle]
  - text: >-
      POST /v1/mcp/make_public reads the config before the admin check, answers 403 and 404 with their exact detail shapes, saves litellm_settings.public_mcp_servers, updates the live setting
      and returns message, public_mcp_servers and updated_by; an unexpected error is a 500 with a string detail.
    proof: [public-tests, oracle]
  - text: >-
      The five routes are registered once under /v1/mcp with the methods, paths and status codes in the description, every error body has the object or string detail shape the description names,
      and a view-only admin is refused by all five.
    proof: [admin-tests, oracle]

checks:
  optional: [mutants]
  commands:
    - id: admin-tests
      why: the route table, the shared error mapping or the role gates of the module are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::server_admin::tests::/)'
    - id: create-tests
      why: the create route, its check order, its forced fields or its best-effort registry refresh is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::server_admin::create::/)'
    - id: import-tests
      why: the import route, its classification, its per-entry outcomes or its single reload is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::server_admin::import::/)'
    - id: update-tests
      why: the update route, its snapshot, its two pre-checks, its reload or its token purge is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::server_admin::update::/)'
    - id: delete-tests
      why: the delete route, its 404, its registry removal or its empty 202 is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::server_admin::delete::/)'
    - id: public-tests
      why: the make-public route, its config order, its detail shapes or its saved list is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::server_admin::public_servers::/)'

