id: B4721
title: MCP administrative create, import, update and delete routes
description: >-
  Build the five administrative write routes of the MCP management router in betterlite-server, module mcp::server_admin: create a server, bulk-import connectors, update a server, delete a server, and set the public server list.
  All five sit under the router prefix /v1/mcp (LiteLLM mounts this router with that prefix only, so there is no /mcp/... or /openai/v1/... alias).
  The routes are glue. The payload checks, the table writes, the registry mutations, the redaction and the token purge already belong to other tasks, so this task only decides the order of the calls, the role gates, the status codes and the exact error bodies.
  Errors are FastAPI HTTPException values. A detail that is an object gives {"detail": {"error": "..."}} and a detail that is a string gives {"detail": "..."}. The texts below say which one each error uses. A request body that fails to parse gives FastAPI's 422 with a list under "detail", and that comes from the request types of B4716 and the body extractor, not from this module.


  Layout. crates/betterlite-server/src/mcp/server_admin.rs holds ServerAdmin (a struct whose fields are the ports and values the routes need, built by the composition root with a struct literal), the AdminError enum (thiserror, one variant per failure, with a method that gives the HTTP status and the JSON detail) and `routes()` which returns the axum router with the five routes.
  The files beside it, each with a tests.rs: create.rs (route 1), import.rs (route 2), update.rs (route 3), delete.rs (route 4), public_servers.rs (route 5).
  No global state. LiteLLM's globals become fields of ServerAdmin: the database handle and writes (B4711, B4712), the registry for reads (B4731 SharedRegistry), the registry mutator (B6765 RegistryMutator), the payload rules and stdio policy (B4716 PayloadRules and StdioPolicy), the token cache port (B4715 UserTokenCaches), and two ports declared in this module for route 5 (below).
  Every handler of routes 1 to 4 runs inside B865's management_endpoint_wrapper; route 5 does not (its decorator has no wrapper), so build it without that layer. Each route needs a valid key (the Depends(user_api_key_auth) argument); use the same authenticated-caller extractor that B4720 and B4723 use.
  The litellm_changed_by header that routes 1, 3 and 4 declare is never read. Do not declare it.
  The name stored as touched_by is the caller's user_id, or the string "default_user_id" (LiteLLM's LITELLM_PROXY_ADMIN_NAME) when the caller has none. Call it touched_by below.
  The database-missing error is B4711's get_prisma_client_or_throw called with a message. It answers 500 with the object detail {"error": <message>}. Routes 1 and 2 pass "Database not connected. Connect a database to your proxy". Routes 3 and 4 pass "Database not connected. Connect a database to your proxy - https://docs.litellm.ai/docs/simple_proxy#managing-auth---virtual-keys". The two texts are different, keep both exactly.
  Admin means the caller's role is exactly PROXY_ADMIN (B732's role). PROXY_ADMIN_VIEW_ONLY is not enough for any of these routes.


  Route 1. POST /v1/mcp/server creates one server. Body NewMCPServerRequest (B4716). Status 201. Response model LiteLLM_MCPServerTable (B858), every field serialized, nulls kept.
  Steps, in this order, each stopping the request on failure.
  a. Database check (500, route 1 text above).
  b. B4716's validate_and_normalize_payload(payload, rules). A PayloadError becomes 400 with the object detail {"error": <the error's Display text>}.
  c. B4716's stamp_omitted_oauth2_flow(payload). This route does not call validate_required_fields; that check belongs only to the submission route.
  d. Role gate: not admin gives 403 with the object detail {"error": "User does not have permission to create mcp servers. You can only create mcp servers if you are a PROXY_ADMIN."}. The validation in b and c runs before this gate, so a non-admin with a bad name gets the 400, not the 403.
  e. Reserved ids: a server_id equal to "all-team-mcpservers" or "all-proxy-mcpservers" (LiteLLM's SpecialMCPServerName) gives 400 {"error": "MCP Server with id <server_id> is special and cannot be used."}.
  f. When server_id is set, B4731's resolve_server(server_id) with the manager as the registry, the database read get_mcp_server (B4711) as the DbLookup, no temp lookup and match_name false. Any hit (a database row or a config server) gives 400 {"error": "MCP Server with id <server_id> already exists. Cannot create another."}.
  g. Force the lifecycle fields: approval_status = active, submitted_by = None, submitted_at = None, whatever the caller sent.
  h. B4712's create_mcp_server_if_identifier_free(payload, touched_by). Any error from it gives 500 {"error": "Error creating mcp server: <error text>"} and an error-level log "Error creating mcp server: <error text>". A McpIdentifierConflict result gives 400 with the object detail {"error": B4716's identifier_conflict_message(conflict)}.
  i. B4716's warn_if_id_jag_server_outruns_sso for the created row (the caller computes the gap with B1617's id_jag_assertion_capture_gap, as B4716 describes).
  j. Registry refresh, best effort: RegistryMutator::add(created) and then RegistryMutator::reload(), both inside one guard. A failure of either is logged at error level with the text "MCP server <server_id> created but in-memory registry refresh failed: <error>" and the request still succeeds, because the row is committed and a 500 would make the caller retry and create a duplicate.
  k. Return B4717's redact function applied to the created row.

  Route 2. POST /v1/mcp/server/import creates many servers from Anthropic connector JSON. Body ConnectorImportRequest (B4716; mcp_servers as a mapping or a list). Status 200. Response MCPConnectorImportResponse (B4716): imported, skipped, errors, in that field order, each a list.
  Steps.
  a. Database check (500, route 1 text), then the role gate: not admin gives 403 {"error": "User does not have permission to import mcp servers. You can only import mcp servers if you are a PROXY_ADMIN."}. Unlike route 1 the database check comes first here too, and the validation of entries happens per entry later, never as a request error.
  b. conversions = B4716's convert_connector_entries(request, stdio), one outcome per entry in input order (Converted or Failed).
  c. existing names: B4711's get_all_mcp_servers (it leaves drafts out). The set is the lowercased alias and the lowercased server_name of every row, skipping empty values.
  d. Classify every conversion by index, using only the state before any create. A Failed conversion stays as it is. A Converted one whose lowercased alias (an absent alias counts as the empty string) is in the existing names becomes Skipped(name, "An MCP server named '<alias>' already exists."). Else, when an earlier entry of the same payload (any index below this one whose outcome is Converted, even one that was itself skipped in this step) has the same lowercased alias, it becomes Skipped(name, "Duplicate connector name '<alias>' in the import payload."). Otherwise it stays Converted.
  e. Create the Converted entries one at a time in input order, awaiting each before the next, so a later entry sees the rows an earlier entry wrote. For one entry: (1) B4716's validate_and_normalize_payload on conversion.request; a PayloadError becomes Failure(name, <Display text>) and nothing is written. (2) B4712's create_mcp_server_if_identifier_free(request, touched_by); an error becomes Failure(name, <error text>) with an error log "Error importing mcp server <name>: <error>". (3) A McpIdentifierConflict becomes Skipped(name, B4716's identifier_conflict_message(conflict)). (4) Otherwise RegistryMutator::add(created), whose error is only logged ("Imported mcp server <name> committed but in-memory registration failed: <error>"), and the outcome is Imported(name, server_id = created.server_id, alias = created.alias or "").
  f. When at least one entry was Imported, call RegistryMutator::reload() once. Its error is logged ("MCP connector import committed but registry refresh failed: <error>") and never changes the response.
  g. Build the response from the outcomes in input order: imported = the Imported ones; skipped = the Skipped ones (from step d and from e.3); errors = the Failed conversions (turned into MCPConnectorImportFailure with the same name and error text) and the Failure outcomes of e.1 and e.2, interleaved in input order.
  The route does not call stamp_omitted_oauth2_flow and does not look at reserved ids, since converted entries carry no server_id.

  Route 3. PUT /v1/mcp/server updates one server. Body UpdateMCPServerRequest (B4716). Status 202. Response model LiteLLM_MCPServerTable, with the body B4717's redact function returns.
  LiteLLM treats an omitted field as "keep the stored value" and a field sent as null as "clear it". The set of keys the caller sent is payload.fields_set(). B4716's UpdateMCPServerRequest does not record it, so this module reads the raw JSON body first, keeps its top-level key names as a BTreeSet<String> (fields_set), and then calls UpdateMCPServerRequest::from_value on the same value. B4712's update_mcp_server takes that set.
  Steps, in this order.
  a. Database check (500, route 3 text).
  b. B4716's validate_and_normalize_payload(payload, rules) (400 as in route 1). It runs before the role gate.
  c. Role gate: not admin gives 403 {"error": "Call not allowed to update MCP server. User is not a proxy admin. route=PUT /v1/mcp/server"}.
  d. Snapshot the stored row: B4711's get_mcp_server(server_id). Any error is logged at warning level "MCP server <server_id>: could not snapshot the pre-update record; skipping the stale-token check: <error>", the snapshot is treated as absent and read_failed is set. The edit goes on.
  e. Discovery check, only when the payload's per_server_oauth_discovery is truthy and (the snapshot exists or read_failed). eligible is false when the snapshot is absent (read_failed), otherwise B4716's is_per_server_oauth_discovery_eligible(auth_type, oauth2_flow, delegate_auth_to_upstream), where each value comes from the payload when its name is in fields_set and from the snapshot otherwise. Not eligible gives 400 {"error": "per_server_oauth_discovery is only supported for auth_type oauth2 with oauth2_flow authorization_code and without delegate_auth_to_upstream."}.
  f. DCR check, only when dcr_bridge is truthy, the payload's auth_type is None (absent or null) and (the snapshot exists or read_failed). stored = the snapshot's auth_type, or None when there is no snapshot. When stored is neither true_passthrough nor oauth_delegate the answer is 400 {"error": "dcr_bridge is only supported for auth_type true_passthrough or oauth_delegate (stored auth_type: <R>). Include the server's auth_type in the update payload or configure one of the client-forwarded token modes first."}, where R is the Python repr of the stored value's string form: the string in single quotes ('oauth2') or None.
  g. B4712's update_mcp_server(payload, touched_by, fields_set). A McpIdentifierConflict gives 400 {"error": <identifier_conflict_message>}. None gives 404 {"error": "MCP Server not found, passed server_id=<server_id>"}.
  h. B4716's warn_if_id_jag_server_outruns_sso for the updated row.
  i. RegistryMutator::update(updated), then RegistryMutator::reload(). Neither is guarded here: an error from either is an unhandled server error (500), because LiteLLM has no try around them in this route.
  j. Stale token purge. When a snapshot exists and B4715's mcp_oauth_token_identity(snapshot) differs from mcp_oauth_token_identity(updated), call B4715's purge_user_oauth_credentials_for_server(server_id). A purge error is logged at warning level "MCP server <server_id>: failed to purge stale per-user OAuth tokens after config change: <error>" and ignored; a purge count above zero is logged at info level "MCP server <server_id>: purged <n> stale per-user OAuth token(s) after a mint-relevant config change". No snapshot (read failed or absent) means no purge.
  k. Return B4717's redact function applied to the updated row.

  Route 4. DELETE /v1/mcp/server/{server_id} deletes one server. Status 202 with an empty body (LiteLLM returns a bare Response, so no JSON and no content type).
  Steps. a. Database check (500, route 3 text). b. Role gate: not admin gives 403 {"error": "Call not allowed to delete MCP server. User is not a proxy admin. route=DELETE /v1/mcp/server"}. c. B4712's delete_mcp_server(server_id); None gives 404 {"error": "MCP Server not found, passed server_id=<server_id>"}. d. RegistryMutator::remove(deleted_row), then RegistryMutator::reload(); neither is guarded, so an error is a 500 after the row is already gone. e. Return the empty 202.
  B4712 already removes the credential, env var and OAuth client rows and the cached tokens of the server; do not repeat that here.

  Route 5. POST /v1/mcp/make_public sets which servers the AI Hub shows. Body MakeMCPServersPublicRequest { mcp_server_ids: Vec<String> } (declared in this module; a missing field or a non-list is a 422). Status 202.
  The whole handler body is one guard. An HTTPException passes through; any other error becomes 500 with the string detail <error text> and an error log "Error making agent public: <error>" (LiteLLM's own wording, keep it).
  Steps. a. Read the stored config through the ConfigStore port (below), before any role check. b. Role gate: not admin gives 403 with the object detail {"error": "Only proxy admins can update public mcp servers. Your role=<role>"}, where <role> is the role's string value as LiteLLM prints it (a key without a role prints None; read how B4720 prints it for the same kind of text). c. For each id in order, B4731's server_by_id(id) with no client ip (config servers and database servers both count); the first unknown id gives 404 with the string detail "MCP Server with ID <id> not found". d. Set config["litellm_settings"]["public_mcp_servers"] = ids (create litellm_settings when it is missing or null). e. ConfigStore::save_config(config). f. PublicServerSetting::set(ids), which updates the live public list in memory. g. Log at debug level "Updated public mcp servers to: <ids> by user: <user_id>". h. Return {"message": "Successfully updated public mcp servers", "public_mcp_servers": <ids>, "updated_by": <caller user_id or null>}, keys in that order.
  Two ports are declared here for route 5. ConfigStore: get_config() -> serde_json::Value and save_config(Value), the same stored configuration LiteLLM's ProxyConfig reads and writes (see notes; no task owns it yet at the time of writing). PublicServerSetting: set(Vec<String>), which the composition root implements over the live RegistrySettings.public_mcp_servers of B4731.

  Tests use synthetic servers (ids like test-srv-1, names like test-weather, urls like https://mcp.example.test/sse), fakes for every port, a recording fake for the registry mutator and the token purge, and a fake database whose methods can fail on demand. They cover every branch above, including the order of the checks in routes 1, 3 and 5 and the order of the calls to the registry mutator.


