deviations:
  - what: >-
      The 500 text "Error creating mcp server: <error text>" and the 500 detail of make_public carry betterlite's error text for the failed write or config save, not a Python exception string.
    why: The wrapped error comes from the Rust database and config code, so its wording cannot match Python's repr of a Prisma or driver exception. The prefix, the status and the detail shape are identical.
  - what: The role text in the make_public 403 prints the role's string value as B2314 and B732 define it; a key without a role prints "None".
    why: LiteLLM formats the enum or None with Python's str; betterlite follows the text the role task defines.

out_of_scope:
  - "validate_and_normalize_mcp_server_payload, stamp_omitted_oauth2_flow, warn_if_id_jag_server_outruns_sso, mcp_identifier_conflict_message, raise_mcp_identifier_conflict, _validate_mcp_required_fields and the request and response models: owned by B4716. This task calls them and puts their errors into HTTP bodies."
  - "get_prisma_client_or_throw, the server table handle, get_mcp_server, get_all_mcp_servers and McpIdentifierConflict: owned by B4711."
  - "create_mcp_server_if_identifier_free, update_mcp_server and delete_mcp_server, including the credential and token cleanup on delete: owned by B4712."
  - "mcp_oauth_token_identity and purge_user_oauth_credentials_for_server: owned by B4715."
  - "_redact_mcp_credentials, _user_is_full_admin and the sanitizers: owned by B4717."
  - "resolve_mcp_server and get_mcp_server_by_id (resolve_server, server_by_id): owned by B4731. add_server, update_server, remove_server and reload_servers_from_database: owned by B6765."
  - "management_endpoint_wrapper: owned by B865. The audit log placeholders in routes 3 and 4 (is_audit_logging_enabled followed by pass) do nothing at the pin and are not built."
  - "ProxyConfig.get_config and save_config: no task owns them yet; route 5 calls them through the ConfigStore port."
  - "POST /server/register, the submission review routes and the pinned tool routes belong to B4722. The temporary OAuth session route belongs to B4718, the preview routes of rest_endpoints.py to B4729, the read-only catalog and health routes to B4720, the user credential routes to B4723, the env var routes to B4724, the toolset and gateway session routes to B4725 and the OAuth browser routes to B4719."

pitfalls:
  - Route 1 validates and stamps the payload before the admin gate, so a non-admin sending a server name with the separator character gets 400, not 403; route 2 does the opposite and gates first.
  - Route 3 also validates before its admin gate, but its database check comes first, so without a database every caller gets the 500 whatever the payload holds.
  - The server_id existence check in route 1 goes through resolve_server, so an id that only exists in config.yaml is refused with the same "already exists" text as a database row.
  - Route 1 overwrites approval_status, submitted_by and submitted_at even when the caller sent others, so a caller cannot plant a fake pending entry.
  - A failed registry add or reload after the insert in routes 1 and 2 is swallowed and logged, while the same calls in routes 3 and 4 are not guarded; do not copy the guard across.
  - The import classifier tests the existing names first and the in-payload duplicates second, and the duplicate test uses the alias of every earlier Converted entry whatever happened to that entry, so two entries with the same alias that already exists both report "already exists".
  - Import entries are created strictly one after another, so a duplicate that slipped past classification (same alias after normalization) is caught by the identifier-free insert and reported as a skip with the identifier conflict text, not as an error.
  - The import errors list mixes conversion failures and create failures in input order, and both are shown as {name, error}; the skipped list is not part of errors.
  - In route 3 the read_failed case counts as "not eligible" for the discovery check and as "stored auth_type None" for the DCR check, so a snapshot failure turns those two payloads into 400s instead of letting them through.
  - In route 3 a snapshot of None without a read error (an unknown server) skips both pre-checks, so an unknown server_id with per_server_oauth_discovery still ends in the 404 from step g.
  - The stored auth_type in the DCR error text is printed as a Python repr, with single quotes around the string ('oauth2') or the bare word None.
  - The purge compares the identity of the snapshot with that of the row the update returned, and B4715 compares client_id and client_secret decrypted; comparing the stored ciphertext would purge tokens on every save.
  - Route 4 answers an empty body, not {} and not null, with status 202, and a repeated delete of the same id gives the 404 text, not another 202.
  - Route 5 reads the config before it checks the role, so a non-admin call still hits the config store, and route 5 has no database check at all.
  - Route 5 raises the 404 with a plain string under detail ("MCP Server with ID x not found") while its 403 uses the object detail with the key error; every other 4xx in this task uses the object detail.
  - Route 5 saves the list as given, so an empty list and a list with repeated ids are both accepted and stored unchanged.

