id: B046
title: Compose image, video and Runway speech providers in the gateway
description: >-
  Connect black_forest_labs, recraft, stability, topaz, fal_ai and runwayml operations through
  api::media_providers in betterlite-core, composing B1517-B1539. Extend B010's closed provider
  identities/contracts and B174 selection at the upper layer; lower provider crates must not import
  core services. Feed prepared image calls into B998/B999, Topaz native variations into B1000,
  Runway speech into B1084 and queued video operations into B093's existing executor. Register the
  provider pricing functions once. B1534's settings are shared by Runway operations; this composer
  adds no settings or parsers.

  Own the Fal image configuration selector and package exports, _complete_fal_ai at main.py
  3652-3680, and the Runway speech branch at 8590-8620. Fal image selection lowercases the model and
  tests substrings in source order: gpt-image-2; nano-banana/gemini-25-flash-image; imagen4/imagen-4;
  recraft; bria; flux-pro with ultra subtest; flux/dev/flux-dev; flux/schnell/flux-schnell/schnell;
  bytedance/seedream; bytedance/dreamina; ideogram; stable-diffusion; generic fallback. Preserve these
  collisions rather than choosing by final path component. Fal chat rejects stream at dispatch,
  resolves explicit-or-global API key before the provider environment fallback, forwards caller-or-
  global headers and dispatch context, then performs the source post_call. Runway speech reports the
  missing-configuration BadRequestError or invokes B1536 with aspeech default false.

  Existing route factories alone mount POST /v1/images/generations, /images/generations,
  /openai/deployments/{model:path}/images/generations and their edits counterparts; POST /v1/audio/speech
  and /audio/speech; and the four chat paths /v1/chat/completions, /chat/completions,
  /engines/{model}/chat/completions, /openai/deployments/{model}/chat/completions. Compose B093's paired
  /v1/videos and /videos prefixes for POST create and GET list, GET /{video_id}, GET /{video_id}/content,
  POST /{video_id}/remix, POST /characters, GET /characters/{character_id}, POST /edits and POST
  /extensions. Unsupported provider operations reach their existing error paths. No variations or
  video-delete HTTP route exists at this pin; exercise those native operations through Rust tests.

  Boot both proxies with deterministic mock jobs and artifact servers. Parameterized HTTP fixtures
  cover every alias, each image provider, local multipart edits, Fal selector collisions and vision
  chat/stream rejection, BFL terminal/timeout errors, Runway default-host polling and binary speech,
  Fal/Runway video create-retrieve-content, unsupported video methods, upstream errors and absent/
  invalid proxy keys. Compare status, error.type/param/code, returned content/headers and upstream
  method/path/body/authentication; verify no artifact receives provider credentials. Use B900 multipart
  expectations and existing endpoint fixtures. Tests under media_providers run in core and server.
  The selector/module surface is 102 nonblank/non-comment lines and main dispatch adds 55; budget
  220 composition, 270 tests and 210 fixtures, capped at 800 changed lines.
