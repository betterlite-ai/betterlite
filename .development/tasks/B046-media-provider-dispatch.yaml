dod:
  - text: Each media provider selects its implemented operation and executes through the preexisting API families without duplicate mounts.
    proof: [media-provider-tests, oracle]
  - text: Mocked job lifecycles, credential boundaries and source-compatible error envelopes are observable through every relevant HTTP alias.
    proof: [media-provider-tests, oracle]
