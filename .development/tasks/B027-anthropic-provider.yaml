id: B027
title: Anthropic provider composition
description: >-
  Register Provider::Anthropic and compose all native Anthropic operations and exported typed records. Consume the
  already selected anthropic_text or anthropic dispatch branch; expose file/batch/count methods for later public
  API tasks. Keep native Messages public endpoint translation in B081 and cache prediction in B075. Exercise installed
  operations through the closed dispatcher and existing text/chat bridges.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/__init__.py:
  get_anthropic_config L7-L13. litellm/main.py: _complete_anthropic_text L2827-L2879; _complete_anthropic L2882-L2945.
  litellm/llms/anthropic/chat/handler.py: AnthropicChatCompletion.completion provider-config lookup/error branch
  L363-L368.


  Own _complete_anthropic_text and _complete_anthropic in main.py. Default bases are https://api.anthropic.com/v1/complete
  and https://api.anthropic.com/v1/messages. Precedence is explicit api_base, litellm.api_base, ANTHROPIC_API_BASE,
  ANTHROPIC_BASE_URL, default. Append the corresponding suffix unless LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX is true;
  B567 wires that boolean (default false). Credential priority is explicit api_key, litellm.anthropic_key, litellm.api_key,
  ANTHROPIC_API_KEY.


  Provider composition changes existing chat dispatch, not route registration: add the HTTP dispatch case through
  the booted proxy for POST /v1/chat/completions and /chat/completions with the source provider prefix. Assert upstream
  request, auth, response status, error type/param/code and response headers. Keep the existing router as the sole
  route owner; pure helper cases exercise the other typed provider operations without calling FastAPI globals.


  Named case contracts: anthropic_chat_dispatch: Use truthy explicit api_key, litellm.anthropic_key, litellm.api_key,
  then raw ANTHROPIC_API_KEY from the injected environment; this last lookup does not call the secret manager. Chat
  passes global custom_prompt_dict even though it computed caller-or-global earlier, forwards supplied headers/client
  and delegates B584. Post_call runs for truthy optional stream or acompletion is True. anthropic_legacy_dispatch:
  Legacy uses the same key chain and B010 HTTP completion with provider forced to anthropic_text, stream, shared_session
  and B196 encoding. It computes caller-or-global custom_prompt_dict but never forwards it to that call; no owned
  post_call or exception catch is added. anthropic_count_dispatch: Install B585 count_tokens and retain its model,
  system/tool/image translation and input_tokens result; use its configured transport and key policy rather than
  invoking chat dispatch. anthropic_batch_file_dispatch: Install B586 batch create/retrieve/cancel/list/results
  and B587/B588 upload/retrieve/list/delete/content operations through the closed operation enum. Preserve beta
  headers, multipart boundaries, pagination and result streams from those leaves; public API routes remain B081
  and their file/batch family owners. messages_default_base: For messages choose explicit base, litellm.api_base,
  ANTHROPIC_API_BASE, ANTHROPIC_BASE_URL, then https://api.anthropic.com/v1/messages. Empty values fall through.
  Existing loaders belong to B567/B500, and ANTHROPIC_API_KEY raw environment lookup preserves an empty final value.
  legacy_default_base: The legacy chain is identical except its final URL is https://api.anthropic.com/v1/complete.
  B567 owns LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX, default False. url_suffix_enabled: Append /v1/messages or /v1/complete
  unless the resolved string already ends with that exact suffix. Do not strip trailing slash or parse query strings:
  a slash-ended host produces //v1/... and suffix?query receives another suffix. url_suffix_disabled: With LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX
  true leave the URL unchanged and emit the exact debug message LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX is set, skipping
  /v1/messages suffix or the corresponding /v1/complete suffix. provider_config_selection: At the composition boundary
  select the Anthropic chat config for model/provider before B584 execution. Invalid LlmProviders value retains
  ValueError; a missing selected config raises ValueError Provider config not found for model: {model} and provider:
  {provider}. The shared closed config selector owns factory selection, while this task owns the handler lookup/error
  branch; no reverse B584-to-umbrella call is allowed. config_url_selector: get_anthropic_config selects B586 AnthropicBatchesConfig
  only when the supplied URL contains both case-sensitive substrings messages/batches and results, anywhere and
  in either order. Otherwise select B576 AnthropicConfig. Do not parse a route or require adjacent path segments.


  Write standalone Rust test anthropic_provider_credential_identity_isolation in betterlite-provider: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test anthropic_provider_secret_safe_failure in betterlite-provider: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  ProviderConfigManager.get_provider_chat_config selection is B2230. Consume its closed tag and call the selected
  existing provider constructor at this composition boundary; do not call B157.


  Implement crates/betterlite-provider/src/anthropic_dispatch.rs with adjacent tests under anthropic_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  leaf crates remain below this dispatcher and never import it. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_dispatch_cases in betterlite-provider with these exact named cases (one per oracle
  file): anthropic_chat_dispatch, anthropic_legacy_dispatch, anthropic_count_dispatch, anthropic_batch_file_dispatch,
  messages_default_base, legacy_default_base, url_suffix_enabled, url_suffix_disabled, anthropic_provider_dispatch_http,
  provider_config_selection, config_url_selector. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and
  captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_provider* using HelperCase: kind: helper
  and the externally tagged anthropic_provider variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_anthropic_provider that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 119 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 180 production lines, 280 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.
