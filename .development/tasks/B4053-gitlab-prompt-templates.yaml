oracle_cases: []
deviations:
  - what: "GitLabClient's eager auth header setup (Private-Token vs Bearer) happens in __init__, not on each request; auth_method=\"oauth\" uses Authorization: Bearer, else uses Private-Token."
    why: LiteLLM behavior at the pinned commit; HTTP handler reuses headers dict on every request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gitlab/gitlab_client.py#L127-L135
  - what: "get_file_content falls back to JSON endpoint only on 404 from raw endpoint, not on other errors."
    why: LiteLLM behavior at the pinned commit; other errors surface to the caller rather than triggering fallback.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gitlab/gitlab_client.py#L179-L219
  - what: "_parse_prompt_file swallows invalid YAML with no warning and returns empty metadata rather than raising."
    why: LiteLLM behavior at the pinned commit; silent fallback preserves repository-supplied templates even with broken metadata.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gitlab/gitlab_prompt_manager.py#L187-L195
out_of_scope:
  - "GitLabPromptManager class and all its methods (__init__, integration_name, prompt_manager, get_prompt_template, pre_call_hook, post_call_hook, get_available_prompts, reload_prompts, should_run_prompt_management, _compile_prompt_helper, async_compile_prompt_helper, get_chat_completion_prompt, async_get_chat_completion_prompt, _parse_prompt_to_messages): owned by B4054."
  - "GitLabClient.list_files, get_repository_info, test_connection, get_branches, get_file_metadata, close: no caller at the pin outside tests."
  - "GitLabTemplateManager.load_all_prompts, list_templates, _repo_path_to_id: no caller at the pin outside the excluded cache chain."
  - "GitLabPromptCache class and all methods: no caller at the pin outside tests/examples."
  - Custom Python extension execution through litellm_logging or user hooks; this task is purely about HTTP client and template loading.
  - Integration with completion hooks and compiler dispatch; B4054 owns the GitLabPromptManager that uses these types.
pitfalls:
  - "GitLabClient.__init__ must set self.ref = str(self.tag or self.branch), preferring tag over branch, and must allow None tag (tag defaults to None, not \"main\")."
  - "GitLabClient.get_file_content only falls back to JSON on 404 from raw endpoint; other HTTP errors (401, 403) raise immediately without fallback."
  - "percent-encoding uses quote(path, safe=\"\"), encoding slashes and special chars; safe=\"\" is required for GitLab project path encoding."
  - "_parse_yaml_basic is a fallback parser when the yaml module is not available; it must be simpler than the full YAML spec but must handle the type inference (booleans, numbers, strings)."
  - "_parse_prompt_file swallows YAML errors and returns empty metadata; there is no warning or error logging."
  - "Role prefix matching in _parse_prompt_to_messages uses case-insensitive comparison (.lower()), matching only capitalized System:, User: and Assistant: prefixes (after lowercasing)."
  - "GitLabTemplateManager uses ImmutableSandboxedEnvironment to block attribute access (__class__.__init__.__globals__) and method calls on mutable types; templates cannot assign to context variables."
  - "Handlebars delimiters {{ }}, {# #}, {% %} and select_autoescape for html/xml must match dotprompt's sandbox configuration."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
