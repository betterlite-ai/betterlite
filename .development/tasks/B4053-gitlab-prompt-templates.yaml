id: B4053
title: GitLab prompt transport and templates
description: >-
  Add GitLab file fetching and template management to crates/betterlite-prompts.
  Build GitLabClient to authenticate with GitLab (token or OAuth), fetch raw/JSON file content,
  handle 404 fallback from raw to JSON endpoint, and support tag/branch ref selection.
  Build GitLabPromptTemplate struct to hold template content, metadata, model override and optional params.
  Build GitLabTemplateManager to load .prompt files from a named folder within a repository,
  parse YAML frontmatter, render templates with a sandboxed Jinja2 environment, and provide
  lookups by template ID.
  Include encode_prompt_id and decode_prompt_id helpers to map between file paths and scoped IDs
  (converting "invoice/extract" to "gitlab::invoice::extract" for prefixed storage).
  Preserve GitLabClient's auth_method selection (Private-Token header vs Bearer), base_url default
  to "https://gitlab.com/api/v4", branch default to "main", tag-over-branch ref precedence,
  percent-encoding with empty safe characters, 404 fallback from raw to JSON endpoint,
  base64 decoding with UTF-8 fallback, and prompts_path/folder scoping for template lookup.
  Support per-prompt and per-call ref overrides.
  Keep GitLab's frontmatter and metadata behavior distinct from dotprompt: template metadata
  is not validated against input schemas by this task.
  Use Jinja2's ImmutableSandboxedEnvironment for the same RCE protection as dotprompt.
  Fuzz raw/JSON/base64/frontmatter boundaries to ensure parser robustness.
scope:
  paths:
    - crates/betterlite-prompts/Cargo.toml
    - crates/betterlite-prompts/src/gitlab_client.rs
    - crates/betterlite-prompts/src/gitlab_client/**
    - crates/betterlite-prompts/src/gitlab_templates.rs
    - crates/betterlite-prompts/src/gitlab_templates/**
    - crates/betterlite-prompts/fuzz/fuzz_targets/gitlab_templates.rs
    - crates/betterlite-prompts/fuzz/corpus/gitlab_templates/**
  lint_tables: false
