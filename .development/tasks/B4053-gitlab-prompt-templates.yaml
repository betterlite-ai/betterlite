dod:
  - text: "GitLabClient.__init__ validates project and access_token are required, raises ValueError if either is missing."
    proof: [gitlab-client-init-tests]
  - text: "GitLabClient.__init__ sets branch default to \"main\" and base_url default to \"https://gitlab.com/api/v4\"."
    proof: [gitlab-client-config-tests]
  - text: "GitLabClient.__init__ prefers tag over branch when both are present (ref = tag or branch)."
    proof: [gitlab-client-config-tests]
  - text: "GitLabClient.__init__ sets auth_method default to \"token\"; when \"oauth\", uses Authorization: Bearer header, else uses Private-Token header."
    proof: [gitlab-client-auth-tests]
  - text: "GitLabClient._file_raw_url and _file_json_url percent-encode file paths and refs with empty safe characters."
    proof: [gitlab-client-url-tests]
  - text: "GitLabClient.set_ref raises ValueError if ref is empty string."
    proof: [gitlab-client-auth-tests]
  - text: "GitLabClient.get_file_content tries raw endpoint first, returns None on 404, falls back to JSON endpoint if raw is 404."
    proof: [gitlab-client-fetch-tests]
  - text: "GitLabClient.get_file_content decodes base64 content from JSON fallback with UTF-8 fallback decoding on error."
    proof: [gitlab-client-fetch-tests]
  - text: "GitLabClient.get_file_content returns file content as UTF-8 string, or None if 404."
    proof: [gitlab-client-fetch-tests]
  - text: "GitLabClient.get_file_content raises with distinct messages for 401 (authentication), 403 (permission denied) and other exceptions."
    proof: [gitlab-client-fetch-tests]
  - text: "GitLabPromptTemplate.__init__ extracts model, input, content from metadata into restricted_keys; stores remaining metadata as optional_params."
    proof: [gitlab-template-tests]
  - text: "GitLabPromptTemplate.__init__ stores temperature and max_tokens from metadata if present."
    proof: [gitlab-template-tests]
  - text: "encode_prompt_id converts \"invoice/extract\" to \"gitlab::invoice::extract\" and idempotent on already-encoded IDs."
    proof: [gitlab-encoding-tests]
  - text: "decode_prompt_id converts \"gitlab::invoice::extract\" to \"invoice/extract\" and idempotent on unencoded paths."
    proof: [gitlab-encoding-tests]
  - text: "GitLabTemplateManager.__init__ accepts gitlab_config, prompt_id, ref, gitlab_client parameters and initializes Jinja2 sandboxed environment with Handlebars delimiters."
    proof: [gitlab-manager-init-tests]
  - text: "GitLabTemplateManager.__init__ scopes prompts_path from config[\"prompts_path\"] or config[\"folder\"], default to empty string."
    proof: [gitlab-manager-init-tests]
  - text: "GitLabTemplateManager._id_to_repo_path maps \"chat/greeting\" to \"prompts/chat/greeting.prompt\" when prompts_path is \"prompts\"."
    proof: [gitlab-manager-path-tests]
  - text: "_load_prompt_from_gitlab fetches file content via gitlab_client, parses with _parse_prompt_file, stores in self.prompts keyed by prompt_id."
    proof: [gitlab-load-tests]
  - text: "_load_prompt_from_gitlab raises Exception with the prompt ID and cause on fetch or parse failure."
    proof: [gitlab-load-tests]
  - text: "_parse_prompt_file splits on ^---\\s*\\n(.*?)\\n---\\s*\\n, parses YAML frontmatter, returns GitLabPromptTemplate with content and metadata."
    proof: [gitlab-parse-tests]
  - text: "_parse_prompt_file falls back to _parse_yaml_basic if yaml module import fails."
    proof: [gitlab-parse-tests]
  - text: "_parse_prompt_file swallows YAML parse errors and returns empty metadata dict."
    proof: [gitlab-parse-tests]
  - text: "_parse_yaml_basic parses key: value lines, inferring bool (true/false), int, float and string types, returning a dict."
    proof: [gitlab-parse-tests]
  - text: "render_template retrieves template by ID, renders with Jinja2 from_string using the sandboxed environment and supplied variables."
    proof: [gitlab-render-tests]
  - text: "render_template raises ValueError with exact message \"Template '<template_id>' not found\" when template_id is not in self.prompts."
    proof: [gitlab-render-tests]
  - text: "get_template returns GitLabPromptTemplate or None from self.prompts lookup."
    proof: [gitlab-render-tests]
  - text: "GitLabTemplateManager uses ImmutableSandboxedEnvironment with Handlebars delimiters ({{ }}, {% %}, {# #}), select_autoescape for html/xml, and immutable restrictions enforced."
    proof: [gitlab-sandbox-tests]
  - text: "The crate has a cargo-fuzz target at crates/betterlite-prompts/fuzz/fuzz_targets/gitlab_templates.rs seeded with raw/JSON/base64/frontmatter fixtures, and replays_the_gitlab_templates_corpus loads every corpus file without panic."
    proof: [gitlab-fuzz-corpus]
  - text: "Every mutant in the client and template code is caught by a test."
    proof: [mutants]
