dod:
  - text: >-
      The four RAG paths answer through the application router, each registered once inside the auth layers: no key
      gives B003's 401 and the master key reaches B3465's handlers.
    proof: [rag-mount-tests, rag-cases, oracle]
  - text: >-
      Ingest runs on the production ports over the shared client, with a registry store's credentials and with a
      credential_list credential, uploads a file under LiteLLM's generated name and content type, and refuses a
      private file_url and a shebang upload as LiteLLM does.
    proof: [rag-mount-tests, rag-cases, oracle]
  - text: >-
      Query searches with the registry store's credentials, completes through the shared router, reranks through
      Cohere and streams through the production generator, as LiteLLM does.
    proof: [rag-mount-tests, rag-cases, oracle]
  - text: >-
      Without a database the ingest store is absent, the save is skipped and the ingest still answers 200.
    proof: [rag-mount-tests]
  - text: >-
      B3465's sixteen route cases pass over HTTP through the booted proxy.
    proof: [rag-cases, oracle]

checks:
  optional: []
  commands:
    - id: rag-mount-tests
      why: the RAG router is not mounted, mounted outside the key check, or built with a stand-in service, client, router or store
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::rag::/)'
    - id: rag-cases
      why: the RAG routes or their production services have no booted-proxy case on this branch
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/rag/routes)" &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/rag/wiring)"

