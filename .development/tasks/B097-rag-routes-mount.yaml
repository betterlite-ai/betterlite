deviations: []

out_of_scope:
  - "The handlers and the four routes: B3465. aingest and the ingest pipeline: B3460. aquery, retrieval, rerank and billing: B3461. parse_rag_ingest_request and _secure_uploaded_file: B3462. The store-id scan, authorization, option merge and provider check: B3463. _build_file_metadata_entry and _save_vector_store_to_db_from_rag_ingest: B3464. This task only builds their inputs and mounts the router."
  - "The port implementations: B7170 (OpenAI, Gemini, Vertex), B7171 (OCR, URL fetch, credential, embedding) and B3457 (HttpRagTransport). The upload scanner: B3452."
  - "_as_string_keyed_mapping and _response_attr (endpoints.py L63-L70) are Python typing helpers with nothing to port, as B3464 and B3465 record; _upstream_status_code (L73-L75) is B3465's."
  - "rag_endpoints/__init__.py only re-exports the router; B3465's routes function stands for it."
  - "rag/__init__.py (aingest, aquery, ingest, query, arag_ingest, rag_ingest) and rag/utils.py (get_rag_ingestion_class, get_rag_transformation_class): B7888 builds the Python facade. Nothing in the proxy calls the two utils getters at the pin, and B3460's registry replaces get_rag_ingestion_class."
  - "The route lists that put /rag/ingest and /rag/query among LiteLLM's native routes for key permissions: B868."
  - "Shared, its fields and the area aggregator: B8610. The vector store registry loaded from vector_store_registry: B8614. The credential_list loader and registry: B1601."

pitfalls:
  - "LiteLLM's own docstring shows `-F 'ingest_options=...'` (endpoints.py L555), but parse_rag_ingest_request reads a part named `request` holding the whole JSON body (L442-L447), so a case with an `ingest_options` part gets \"ingest_options must contain 'vector_store' configuration\"."
  - "Every accepted upload is renamed to `uuid4().hex` plus the detected extension (upload_security.py L205-L206), so the upload case names that one filename with B9850's `/upstream/0/parts/1/filename` selector; a `/upstream/0/body` selector there would also hide the bytes and the content type, and a case that sends file bytes upstream without the selector fails on every run."
  - "The upload's extension and content type come from content inspection, not from the client: notes.md sent as text/markdown reaches the provider as `.txt` with text/plain."
  - "`api_key` and `api_base` in ingest_options.vector_store are refused with 400, and retrieval_config's own api_base never reaches the search, so a case points the store at the mock only through a `vector_store_registry` entry or a `credential_list` entry."
  - "Rerank calls `litellm.arerank` directly, never the router (main.py L298), so the rerank case points `COHERE_API_BASE` at the mock; a model_list entry for the rerank model is never used."
  - "Hand B3465 the `Arc<RouterHandle>`, never the router it holds at mount time, or a router swapped by a reload or a database sync never reaches RAG queries."
  - "A second `CredentialRegistry` built from config.yaml would miss credentials added through POST /credentials, so the credential port takes B1601's one registry."
  - "Merging the RAG router anywhere but app::inference::mount (for example after the auth layers through mount_public) serves ingest and query without a key."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
