deviations:
  - what: The document is built from typed route entries (`RouteDoc`) and not from route handlers, so request and response schemas of ordinary routes appear only when the route entry carries them.
    why: axum has no route introspection and no pydantic models. LiteLLM's FastAPI output for every management route cannot be reproduced mechanically; B8681 supplies the entries.
  - what: The `openapi` field is "3.1.0" and the document has no lazy-feature stub paths, no `/lazy/warm` tag stubs and no `lazy` snapshot fragments.
    why: LiteLLM registers some routers on first use and shows placeholders until then. betterlite registers every route at startup, so `/openapi.json` always lists the real routes; the committed `_lazy_openapi_snapshot.json` and its generator have no purpose here.
  - what: Operation ids of multi-method routes are built from an explicit single method per `RouteDoc`, so they never depend on set iteration order.
    why: LiteLLM needs `_stabilize_multi_method_route_ids` and `_normalize_operation_ids` because FastAPI derives the id suffix from a Python set; betterlite has no set to order.
  - what: The enterprise-only `DOCS_FILTERED` branch (`custom_openapi`) and the `DOCS_TITLE` and `DOCS_DESCRIPTION` overrides are not built.
    why: They run only when `premium_user` is true, an enterprise license check betterlite does not have; the open-source path is `get_openapi_schema`.
  - what: The served `/openapi.json` is the built document in insertion order as compact JSON; only the committed snapshot file is key-sorted and indented.
    why: LiteLLM's route answer is FastAPI's JSONResponse and its snapshot file is a different artifact in a different format; each keeps its own.
out_of_scope:
  - "litellm/proxy/openapi.json (7 KB hand-written OpenAPI sketch of /chat/completions and a few more paths): no caller at the pin; nothing in litellm loads or serves it."
  - "litellm/proxy/_lazy_openapi_snapshot.json (1.8 MB) and the generator litellm/proxy/_lazy_openapi_snapshot.py: only inject_lazy_stubs in _lazy_features.py reads them, and betterlite has no lazy route loading (see deviations)."
  - "litellm/proxy/common_utils/openapi_schema_compat.py get_openapi_schema_with_compat: it patches pydantic's GenerateSchema._unknown_type_schema so FastAPI survives types like openai.Timeout, and falls back to an empty document on PydanticSchemaGenerationError. There is no pydantic here, so nothing can fail the same way."
  - "litellm/proxy/common_utils/custom_openapi_spec.py everything except the leftover decorators in part 4: B4230 owns the schema transforms, inline_request_body and the helper functions. _extract_field_schema has no caller at the pin (B4230 lists it too)."
  - "litellm/proxy/common_utils/swagger_utils.py is built here; litellm/proxy/swagger/** (the four static files) is B7740's."
  - "Registering the openapi_url route and choosing the full route list for the document is B8681's job (see notes); this task registers no route and has no HTTP oracle cases."
pitfalls:
  - ERROR_RESPONSES is attached to one decorator only, `/openai/deployments/{model:path}/chat/completions`. The `engines`, `/chat/completions` and `/v1/chat/completions` operations have only the plain 200, so error_responses is a per-route flag and not a default.
  - The status table collapses 20 exception classes into nine statuses; InternalServerError is listed twice and 400 is claimed by five classes. The winner is the last class in the list, not the first or the most specific.
  - litellm's own exception classes set status_code in __init__, so `hasattr(cls, "status_code")` is false for them, while the openai base classes have it as a class attribute. A Rust table that follows the instance status codes gets 401 and 429 right and 503 or 500 wrong.
  - Only RateLimitError has a docstring, and cleandoc keeps its blank lines and the `:attr:` markup as written; every other description is the bare class name.
  - The websocket stub path is cut at the first `{`, so `/openai/deployments/{model}/realtime` becomes `/openai/deployments/`, and a trailing `?` is stripped but a trailing `/` is kept.
  - A websocket route that shares its path with an HTTP route must not erase the HTTP operations; only an existing `get` blocks the stub.
  - The request body decorators use `{model}` in their path list, while FastAPI paths in the document are `{model}` too; a list written with `{model:path}` matches nothing and silently skips the endpoint.
  - ensure_unique_operation_ids visits operations in document order and the first operation with a duplicated id is rewritten too, not just the later copies, because the rewrite test is "count greater than one".
  - The `servers` entry is written for the root path "/" as "/", since `"/" + "/".strip("/")` is "/".
  - Snapshot key sorting must also sort inside examples and schema properties, because json.dumps(sort_keys=True) sorts every object; an array keeps its order.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
