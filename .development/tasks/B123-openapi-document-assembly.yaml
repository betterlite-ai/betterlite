id: B123
title: OpenAPI document assembly, error response table and snapshot check
description: >-
  Build the OpenAPI document that betterlite serves at `openapi_url`, in the existing crate betterlite-openapi, on top of
  B4230's `add_request_schema` and `JsonObject`/`JsonTree` types. The swagger pages and the `/swagger` assets are B7740's.
  LiteLLM builds the document in `get_openapi_schema()` (proxy_server.py L1806-L1846): FastAPI's `get_openapi`, then
  WebSocket stubs, then `CustomOpenAPISpec.add_llm_api_request_schema_body`, then lazy-feature stubs, then
  `ensure_unique_openapi_operation_ids`, then the `servers` entry when SERVER_ROOT_PATH is set. betterlite has no FastAPI
  to introspect, so routes arrive as plain typed data (see `RouteDoc`). The lazy-feature step does not exist (see deviations).


  New modules, all pure, no I/O except the exporter binary:

  1. `error_responses`. `error_responses() -> Vec<ErrorStatus>` with `ErrorStatus { status: u16, description: String }`, and
  `error_response_schema() -> JsonObject`, the `ErrorResponse` component. LiteLLM builds `ERROR_RESPONSES`
  (swagger_utils.py L1-L53) from `LITELLM_EXCEPTION_TYPES`, one entry per status where a later exception overwrites an
  earlier one and the key keeps its first position. `get_status_code` reads a class-level `status_code` (the openai
  subclasses have one, litellm's own classes set it only in `__init__`) and otherwise gives 408 for `Timeout`, 503 for
  `APIConnectionError` and 500. The description is the class docstring cleaned with `inspect.cleandoc`, or the class name
  when it has none. By reading, the final table in key order is 401 AuthenticationError, 404 NotFoundError, 400
  ContentPolicyViolationError, 422 UnprocessableEntityError, 408 Timeout, 403 PermissionDeniedError, 429 (the cleaned
  RateLimitError docstring, a multi-line text), 500 JSONSchemaValidationError, 503 APIConnectionError. Do not trust this
  reading: the oracle helper's LiteLLM side must print the real table and the Rust table must equal it. The schema
  `ErrorResponse` has one required property `detail`, an object that allows extra keys, with the example
  `{"error": {"message": "Error message", "type": "error_type", "param": "error_param", "code": "error_code"}}`; copy its
  exact JSON from what FastAPI emits for the pydantic model, again through the helper.

  2. `operation_ids`. `stable_operation_id(name, path_format, methods) -> String` is `_generate_stable_operation_id`
  (proxy_server.py L1648-L1653): replace every non-word character of `name + path_format` with `_`, and append `_<method
  lowercase>` only when the route has exactly one method (methods sorted first). `ensure_unique_operation_ids(document:
  &mut JsonObject, reserved: Option<&mut BTreeSet<String>>)` is `ensure_unique_openapi_operation_ids` (L1684-L1724) with
  its helper `_strip_operation_id_method_suffix` (L1677-L1681), keeping the visiting order: paths in document order, then
  methods in each path item's order, only the eight methods delete, get, head, options, patch, post, put, trace, and only
  operations whose `operationId` is a string. An id is rewritten when it occurs more than once in the document, or is in
  the reserved set, or was already taken by an earlier operation; the new id is the id without a trailing `_<method>`
  plus `_<this operation's method>`, and when that is taken too, `_2`, `_3` and so on are appended after the method. After
  the loop the used ids are copied into the reserved set when one was passed.

  3. `websocket_stubs`. `inject_websocket_stubs(document, routes: &[WebsocketRoute])` is
  `_inject_websocket_stubs_into_openapi_schema` (L1762-L1803). `WebsocketRoute { path, name: Option<String>, query_params:
  Vec<QueryParam> }`, `QueryParam { name, required }`. For each route the stub path is the route path cut at the first `{`
  with trailing `?` characters removed. The path item is created when absent and keeps its existing operations. A `get`
  stub is added only when the path item has no `get`: summary `WebSocket: <name or stub path>`, description `WebSocket
  connection endpoint`, operationId `websocket_<name>` or, with no name, `websocket_` plus the stub path with every `/`
  replaced by `_`, parameters from the query params (`in: query`, schema `{"type": "string"}`), responses
  `{"101": {"description": "WebSocket Protocol Switched"}}` and tags `["WebSocket"]`.

  4. `llm_request_bodies`. `add_llm_request_bodies(document, schemas: &LlmRequestSchemas)` is the leftover of
  `CustomOpenAPISpec` (custom_openapi_spec.py L14-L31 and L292-L400) that B4230 left to this task. `LlmRequestSchemas {
  chat_completion, embedding, responses: Option<JsonObject> }` are the JSON Schemas of ProxyChatCompletionRequest,
  EmbeddingRequest and ResponsesAPIRequestParams; the caller supplies them and None means LiteLLM's ImportError or
  schema-failure branch, which skips that endpoint silently. Order: chat completion, embedding, responses. Each calls B4230's
  `add_request_schema` with the schema name and these exact path lists. Chat completion, name `ProxyChatCompletionRequest`:
  `/v1/chat/completions`, `/chat/completions`, `/engines/{model}/chat/completions`,
  `/openai/deployments/{model}/chat/completions`. Embedding, name `EmbeddingRequest`: `/v1/embeddings`, `/embeddings`,
  `/engines/{model}/embeddings`, `/openai/deployments/{model}/embeddings`. Responses, name `ResponsesAPIRequestParams`:
  `/v1/responses`, `/responses`, `/openai/v1/responses`. The path strings use `{model}`, not FastAPI's `{model:path}`.

  5. `document_builder`. The glue. `RouteDoc { path, method, name, summary: Option<String>, tags, parameters:
  Vec<ParamDoc>, request_body: Option<JsonObject>, error_responses: bool }` is one HTTP operation; `ParamDoc { name,
  location, required, schema }`. `OpenApiInfo { title, version, description }`. `DocumentInputs { info, routes,
  websockets: Vec<WebsocketRoute>, llm_schemas: LlmRequestSchemas, server_root_path }`, serde-derived so a JSON file can
  hold it. `build_document(&DocumentInputs) -> JsonObject` returns `openapi: "3.1.0"`, `info`, `paths`, `components`.
  Each route becomes an operation with `operationId` from `stable_operation_id`, a `summary` (the given one, else FastAPI's
  default: the name with `_` replaced by spaces and each word capitalized), the tags, the parameters, the request body, and
  responses `200` (`Successful Response`, JSON content with an empty schema); when `error_responses` is true, one more
  response per `ErrorStatus`, each `{"description": ..., "content": {"application/json": {"schema": {"$ref":
  "#/components/schemas/ErrorResponse"}}}}`, and the `ErrorResponse` component is added. Then in this order:
  `inject_websocket_stubs`, `add_llm_request_bodies`, `ensure_unique_operation_ids` (no reserved set), and last, when
  `server_root_path` is non-empty, `servers: [{"url": "/" + root.trim('/')}]` (so "/" gives "/"). The default title is
  `LiteLLM API` and the default description is `Proxy Server to call 100+ LLMs in the OpenAI format. [**Customize Swagger
  Docs**](https://docs.litellm.ai/docs/proxy/enterprise#swagger-docs---custom-routes--branding)` followed by a blank line
  and the three UI link lines built from the root path (proxy_server.py L1031-L1051); expose them as
  `default_info(server_root_path, version) -> OpenApiInfo`. `build_document` never fails; LiteLLM's compat wrapper and its
  minimal-schema fallback exist only for pydantic errors (see out_of_scope).

  6. `snapshot_render` and the exporter. `render_snapshot(&JsonObject) -> String` writes the document with object keys
  sorted at every level, two-space indent, and one trailing newline (the format of LiteLLM's `main()` in
  _lazy_openapi_snapshot.py: `json.dumps(..., indent=2, sort_keys=True) + "\n"`). `check_snapshot(committed: &str,
  rendered: &str) -> Result<(), SnapshotDrift>` is Ok only on byte equality and otherwise names which `paths` keys were
  added, removed or changed, so the failure message is readable. The binary `src/bin/export_openapi.rs` takes
  `--write <inputs.json> <out.json>` (regenerates the file) or `--check <inputs.json> <out.json>` (exit 1 with the drift
  and the exact `--write` command to run when the file differs or is missing). This is how betterlite keeps a generated
  schema file honest, the same job as LiteLLM's check-ui-api-types.yml: nobody edits the generated file by hand, a
  change in code or inputs is followed by `--write`, and the `--check` run in the gate fails on any difference. The
  committed pair is crates/betterlite-openapi/tests/fixtures/document_inputs.json (hand-written: the 11 LLM paths of part
  4 as POST routes, one route with `error_responses: true` at `/openai/deployments/{model}/chat/completions`, one websocket
  at `/v1/realtime`, root path empty) and crates/betterlite-openapi/tests/fixtures/openapi.generated.json (produced only by
  the binary). B8681 serves the document at openapi_url; a server-wide route list waits for a route catalog; see notes.
