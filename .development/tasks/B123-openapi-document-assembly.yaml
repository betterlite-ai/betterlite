dod:
  - text: >-
      error_responses() equals the table LiteLLM's ERROR_RESPONSES holds, same statuses in the same order with the same
      descriptions (nine entries by the reading above), and error_response_schema() equals the ErrorResponse component
      FastAPI emits for it.
    proof: [error-responses-tests, oracle]
  - text: >-
      stable_operation_id appends the lowercase method only for single-method routes and replaces every non-word
      character, so name `chat_completion` with path_format `/engines/{model}/chat/completions` and one POST gives
      `chat_completion_engines__model__chat_completions_post`.
    proof: [operation-ids-tests, oracle]
  - text: >-
      ensure_unique_operation_ids rewrites an id that repeats, an id in the reserved set and an id taken earlier, strips
      only a trailing known method token before adding the operation's own method, adds `_2`, `_3` on further clashes,
      leaves unique ids and non-string ids alone, and fills the reserved set when given one.
    proof: [operation-ids-tests, oracle]
  - text: >-
      inject_websocket_stubs adds a get stub at the path cut at `{` with trailing `?` removed, keeps every existing
      operation on that path, skips the stub when a get exists, and builds operationId and summary from the route name or
      the stub path.
    proof: [websocket-stubs-tests, oracle]
  - text: >-
      add_llm_request_bodies registers the three components and decorates exactly the 4, 4 and 3 listed paths in the
      order chat, embedding, responses, and an absent schema leaves its endpoint and component untouched.
    proof: [llm-request-bodies-tests, oracle]
  - text: >-
      build_document runs websocket stubs, request bodies, unique ids and the servers entry in that order, attaches the
      error responses and the ErrorResponse component only to routes that ask for them, sets servers only for a
      non-empty root path, and default_info gives the LiteLLM API title and the description with the three UI links.
    proof: [document-builder-tests]
  - text: >-
      render_snapshot sorts keys at every depth with two-space indent and one trailing newline, check_snapshot names added,
      removed and changed paths on drift, and the committed generated fixture is exactly what the exporter writes from the
      committed inputs.
    proof: [snapshot-render-tests, openapi-snapshot-check]
checks:
  optional: []
  commands:
    - id: error-responses-tests
      why: the error response table or its schema is wrong or untested
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^error_responses::/)'
    - id: operation-ids-tests
      why: stable ids or the uniqueness rewrite are wrong or untested
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^operation_ids::/)'
    - id: websocket-stubs-tests
      why: websocket stubs are wrong or untested
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^websocket_stubs::/)'
    - id: llm-request-bodies-tests
      why: the three request body decorators are wrong or untested
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^llm_request_bodies::/)'
    - id: document-builder-tests
      why: the assembly order, error responses and servers entry are wrong or untested
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^document_builder::/)'
    - id: snapshot-render-tests
      why: the snapshot format or the drift report is wrong or untested
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^snapshot_render::/)'
    - id: openapi-snapshot-check
      why: the committed generated file must equal what the exporter writes from the committed inputs
      run: cargo run --locked -p betterlite-openapi --bin export_openapi -- --check crates/betterlite-openapi/tests/fixtures/document_inputs.json crates/betterlite-openapi/tests/fixtures/openapi.generated.json
