id: B3884
title: Prometheus paginated budget refresh
description: >-
  Build the background job that re-reads every team, key, user, organization and customer budget from the
  database page by page and writes the budget gauges, then sets the three count gauges. LiteLLM runs it
  every few minutes so gauges stay right for budgets nobody has spent against recently. It ports
  litellm/integrations/prometheus.py lines 3617-3891 and 4537-4563 plus the startup condition at
  litellm/proxy/proxy_server.py lines 11062-11067. Put the code in crates/betterlite-server/src/prometheus_budget_refresh.rs
  and prometheus_budget_refresh/** (betterlite-server is the only crate that sees the team list, key list,
  Postgres and pod lock code at once, and betterlite-logging cannot depend on it). The gauge setters are B3882's
  and the collectors are B3875's PrometheusCollectors; this task only fetches pages and calls them.

  Page walk. Write it once, as a generic function over a small trait with two methods, fetch(page_size, page)
  and apply(rows). It is LiteLLM's _initialize_budget_metrics. The page size is the constant 50. If no database
  is configured it returns at once. Otherwise fetch page 1; a missing total (None) becomes the number of rows
  fetched; total_pages is ceil(total / 50) using integer arithmetic; apply page 1 (even when total_pages is 0);
  then for page 2 up to and including total_pages fetch and apply each page, ignoring the total those later
  fetches return. Any error from a fetch or an apply stops the walk for that entity, is logged at error level
  as "Error initializing <teams|keys|users|orgs|customers> budget metrics: <error>", and is not returned to
  the caller, so the next entity still runs. Build five implementations of the trait, one per entity, in
  their own files (teams, keys, users, orgs, customers). Each turns its rows into B3882's plain input records
  and calls B3882's list setter (set_team_list_budget_metrics, set_key_list_budget_metrics,
  set_user_list_budget_metrics, set_org_list_budget_metrics, set_customer_budget_metrics_from_row for each
  customer). The database access sits behind a trait BudgetPageSource that this module defines (one method per
  entity returning a Page { rows, total_count: Option<u64> } or this module's error), so the page walk and the
  entity code are tested with a fake source. PostgresBudgetPageSource is the real implementation.

  Per-entity fetches. Teams: when no database is configured log at debug "Prometheus: skipping team metrics
  initialization, DB not initialized" and return. Call B813's get_paginated_teams (page_size, page) which
  counts first, reads the page sorted by team_alias ascending, and on any error logs and returns (empty, 0),
  so a team failure never reaches the walk's error log. Keys: skip with the debug text "Prometheus: skipping key
  metrics initialization, DB not initialized" without a database. Call B897's key list query (the _list_key_helper
  port) with page, size 50, user_id None, team_id None, key_alias None, key_hash None, organization_id None,
  exclude_team_id "litellm-dashboard" (UI_SESSION_TOKEN_TEAM_ID) and return_full_object true; its result gives
  keys and an optional total_count (None becomes the number of keys). Users: B723's UserRepository raw table,
  find_many with skip (page - 1) * 50 and take 50, order created_at descending; the total is a fresh
  count() of the same table on every page. Orgs: B723's OrganizationRepository raw table, the same skip, take and
  order, plus the joined litellm_budget_table row; the total is again a count() on every page. Customers:
  first return if no database is configured (debug "Prometheus: skipping customer metrics initialization, DB
  not initialized"); then return if B3882's customer_budget_gauges_are_noop is true; then return if B3882's
  customer_budget_metrics_enabled is false (debug "Prometheus: skipping customer metrics initialization,
  end_user tracking disabled"). Check in exactly that order. Then call B3883's get_default_customer_budget once.
  Read the end user table (B726's endusertable binding) in pages ordered by user_id ascending with the joined
  budget table; the filter is "has a budget_id" only when there is no default budget, and no filter when there
  is one (every customer then gets the default). The count is made only on page 1 and uses the same filter;
  later pages return no total. Each row goes to B3882's set_customer_budget_metrics_from_row with the default budget.
  Rows with a spend of None are passed as None to the user, team and key setters (the remaining budget is then the whole limit).

  Count gauges. After the five entities, set litellm_total_users to the count of the user table, then
  litellm_active_users to B723's count_billable_users, then litellm_teams_count to the count of the team table
  (B726's teamtable binding). These are three reads in that order; the first error stops the rest, is logged
  at error level as "Error initializing user/team count metrics: <error>" and is not returned. Without a database
  log at debug "Prometheus: skipping user/team count metrics initialization, DB not initialized".

  Whole refresh. initialize_remaining_budget_metrics (the public entry the job calls) takes the pod lock first
  when it can. If the pod lock manager exists and has a Redis cache (B1690 PodLockManager), acquire the lock for the
  job name prometheus_emit_budget_metrics (PROMETHEUS_EMIT_BUDGET_METRICS_JOB_NAME); when the answer is not
  true, do nothing and return; when it is true, run the refresh and release the lock afterwards on every exit.
  Without a manager or without a Redis cache just run the refresh. The
  refresh logs "Emitting key, team, user, org, customer budget metrics...." at debug and runs teams, keys,
  users, orgs, customers and the count gauges in that order.

  Job registration. Config section prometheus_budget_refresh (crates/betterlite-config/src/sections/prometheus_budget_refresh.rs)
  holds litellm_settings.prometheus_initialize_budget_metrics (default false; the job is only wanted when it is
  exactly true) and the environment variable PROMETHEUS_BUDGET_METRICS_REFRESH_INTERVAL_MINUTES, an integer
  with default 5. Expose budget_refresh_job(settings, loggers) -> Option<BudgetRefreshJob>. It returns None when the
  setting is not exactly true, and also None, with debug "found 0 prometheus loggers", when B189's registry holds
  no PrometheusLogger. With one or more loggers it uses the first (debug "found N prometheus loggers") and
  returns BudgetRefreshJob { id: "prometheus_budget_metrics_job", interval_minutes, logger }, with the
  semantics "run every interval_minutes, first run one interval after startup, replace any job with the same id".
  B124's startup scheduler registers the handle; this task does not own a scheduler and nothing runs the
  refresh at startup. Do not add a second route or a startup call.

scope:
  paths:
    - crates/betterlite-server/src/prometheus_budget_refresh.rs
    - crates/betterlite-server/src/prometheus_budget_refresh/**
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-config/src/sections/prometheus_budget_refresh.rs
    - crates/betterlite-config/src/sections/prometheus_budget_refresh/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/prometheus-budget-refresh-*
  lint_tables: false

