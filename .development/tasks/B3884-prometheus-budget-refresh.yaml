dod:
  - text: The page walk fetches page 1, treats a missing total as the page's row count, applies page 1 even when the total is 0, then fetches and applies pages 2 to ceil(total / 50), and an error ends only that entity after an error log.
    proof: [page-walk-tests]
  - text: Teams, keys, users and orgs are fetched with the page size, order, exclusions and joins listed above, and a missing database skips each with its debug text.
    proof: [source-tests, postgres-tests]
  - text: The customer refresh checks database, no-op gauges and the enabled gate in that order, uses the default budget when there is one, and counts only on page 1.
    proof: [customer-refresh-tests]
  - text: The count gauges are set in the order total users, billable users, teams, and the first failing read stops the rest without an error to the caller.
    proof: [count-gauge-tests]
  - text: The whole refresh takes the prometheus_emit_budget_metrics lock only with a manager that has Redis, skips when the lock is not granted, releases after every run, and runs the six steps in order.
    proof: [refresh-lock-tests]
  - text: budget_refresh_job returns a job only when the setting is exactly true and a PrometheusLogger exists, with id prometheus_budget_metrics_job and the configured interval.
    proof: [job-tests]
  - text: The config section loads prometheus_initialize_budget_metrics (default false) and PROMETHEUS_BUDGET_METRICS_REFRESH_INTERVAL_MINUTES (default 5) and refuses a malformed or non-positive interval at startup.
    proof: [config-tests, config-corpus]

checks:
  optional: [mutants]
  commands:
    - id: page-walk-tests
      why: the generic page walk is missing or paginates wrongly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_budget_refresh::page_walk::/)'
    - id: source-tests
      why: an entity reads the wrong page size, order, exclusion or join, or skips without the debug text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_budget_refresh::teams::/) | test(/^prometheus_budget_refresh::keys::/) | test(/^prometheus_budget_refresh::users::/) | test(/^prometheus_budget_refresh::orgs::/)'
    - id: postgres-tests
      why: the real queries are unproved against Postgres rows
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_budget_refresh::postgres_source::/)'
    - id: customer-refresh-tests
      why: the customer refresh order, filter or page-1 count is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_budget_refresh::customers::/)'
    - id: count-gauge-tests
      why: the user and team count gauges are missing or set in the wrong order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_budget_refresh::counts::/)'
    - id: refresh-lock-tests
      why: the pod lock handling or the step order is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_budget_refresh::refresh::/)'
    - id: job-tests
      why: the job handle is missing or built under the wrong condition
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_budget_refresh::job::/)'
    - id: config-tests
      why: the section does not load or validate its two settings
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::prometheus_budget_refresh::/) - test(/replays_the_/)'
    - id: config-corpus
      why: no seed for the new keys exercises the config decoder
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/prometheus-budget-refresh-*')" && grep -rlq PROMETHEUS_BUDGET_METRICS_REFRESH_INTERVAL_MINUTES crates/betterlite-config/fuzz/corpus/config_yaml/prometheus-budget-refresh-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'

oracle_cases: []

deviations:
  - what: The refresh reads rows through a BudgetPageSource trait and hands B3882 plain input records, not prisma models.
    why: betterlite-logging cannot depend on the table crates, and the walk is tested with a fake source.
  - what: The interval from PROMETHEUS_BUDGET_METRICS_REFRESH_INTERVAL_MINUTES must be at least 1 and a bad value stops startup with a config error naming the variable.
    why: LiteLLM passes any int to its scheduler without a check, and a zero or negative interval has no useful meaning.
  - what: The job is a BudgetRefreshJob handle that B124's scheduler registers, not a call to AsyncIOScheduler.add_job.
    why: betterlite has no APScheduler; the scheduler belongs to the startup task.
  - what: Money values stay Decimal from the row to B3882's input records.
    why: money is never a float in betterlite.

out_of_scope:
  - "The gauge setters, the list setters, _customer_budget_metrics_enabled and _customer_budget_gauges_are_noop: B3882."
  - "_get_default_customer_budget: B3883 (this task calls it)."
  - "Collector creation and registration, including the litellm_total_users, litellm_active_users and litellm_teams_count gauges: B3875."
  - "get_paginated_teams (team_endpoints.py:5934-5965): B813. _list_key_helper: B897. UserRepository, OrganizationRepository and count_billable_users: B723. The teamtable and endusertable bindings: B726. PodLockManager: B1690."
  - "Scheduler startup, the scheduler itself and the call site at proxy_server.py:11062-11067 beyond the condition: B124. The type-specific loggers' lookup in the callback list (get_custom_loggers_for_type): B189."
  - "_increment_remaining_budget_metrics and the per-request budget updates: B3883 and the per-request owner."
  - "_mount_metrics_endpoint (prometheus.py:4565-4592): B3886."

pitfalls:
  - Nothing runs the refresh at startup; the docstring says so but the only caller is the interval job, so the first gauge write happens one interval after boot.
  - The users and orgs total is a new count() on every page, so the number of pages can change while the walk runs; the customers total is counted on page 1 only and the later pages' totals are ignored.
  - When a default customer budget exists the customer filter is dropped, so customers with no budget_id are also written; with no default budget only rows with a budget_id are read.
  - The customer path checks gauges-are-noop before the enabled gate, and both before the default budget lookup.
  - get_paginated_teams already turns a failure into (empty, 0), so a broken team table logs the "[Non-Blocking]" message and the walk sees an empty page, not an error.
  - A key page may hold plain token strings next to full records, and B3882's list setter skips the strings; pass return_full_object true and do not count skipped strings as failures.
  - The lock is acquired only when the manager has a Redis cache, and None, false and a denied acquire all mean skip; the lock job name is prometheus_emit_budget_metrics, not the job id prometheus_budget_metrics_job.
  - Release the lock on every exit of the refresh, since an early error in one entity must not keep the lock for the 60 second default TTL.
  - total_pages is 0 for an empty table, and page 1 is still applied, so a count that reports 0 while the page holds rows still writes those rows.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
