  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L3727-L3778
    why: User and organization fetchers, with the count repeated on every page and the budget table join for orgs.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L3780-L3821
    why: Customer fetcher, the check order, the default budget filter and the page-1-only count.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L3823-L3891
    why: Pod lock wrapper, the order of the six steps and the user, billable user and team count gauges.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4536-L4563
    why: initialize_budget_metrics_cron_job, the first logger, the job id and the interval trigger.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L11062-L11067
