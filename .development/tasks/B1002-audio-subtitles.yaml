id: B1002
title: Timestamped transcription subtitle synthesis
description: >-
  Reimplement every callable in subtitle_utils.py under betterlite-openai::api::audio_subtitles, using typed
  SubtitleToken,SubtitleCue,Word and TranscriptionWordTiming records. Merge nonempty subword tokens at whitespace,
  speaker or CJK boundaries, retain the first available start and last available end, then group whole words
  into cues. Empty/no-start cues are omitted; missing end falls back to start. No text trimming occurs until
  cue construction. Width counts Unicode East Asian W/F as 2 and other characters as 1.

  Break before a new word for a known speaker change, gap >=700ms, width >84 or duration >7000ms, and after
  sentence endings . ! ? 。 ！ ？ ؟ ۔ । ॥ ։ ።. CJK ranges are U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,
  U+3040-309F,U+30A0-30FF,U+31F0-31FF. Do not break before 、。，．！？：；・ー…」』）〉》】〕 or after
  「『（〈《【〔. These punctuation exceptions apply to CJK word boundaries, not to the other cue-break rules.

  SRT numbering starts at 1 with comma milliseconds; WebVTT has WEBVTT and a blank header line and dot
  milliseconds. Clamp each rendered timestamp to zero without changing cue records; hours can exceed two
  digits. Parsed word timings ignore unknown fields and default word="",start=None,end=None,speaker=None.
  Invalid timing records reject the whole list to (), silently. Seconds-to-ms uses Python round-to-even;
  non-finite values accepted by the timing model fail later at rounding rather than becoming zero.

  This task transforms parsed records, not raw provider JSON; consuming providers own byte decoding. B171's
  audio_subtitles helper calls these production transforms and the pinned functions independently. Count 206
  nonblank/non-comment lines including constants; budget 170 implementation, 130 tests, 110 cases,
  90 adapters and 30 wiring, 530 lines. B204 is unnecessary: subtitles do no token accounting.
scope:
  paths:
  - crates/betterlite-openai/src/lib.rs
  - crates/betterlite-openai/src/error.rs
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/audio_subtitles.rs
  - crates/betterlite-openai/src/api/audio_subtitles/**
  - crates/betterlite-openai/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - tools/oracle/src/helpers/openai/audio_subtitles.rs
  - tools/oracle/src/helpers/openai/audio_subtitles/**
  - tools/oracle/helpers/audio_subtitles.py
  - tools/oracle/helpers/audio_subtitles/**
  - tools/oracle/cases/helpers/audio-subtitles/**
  - tools/oracle/fuzz/corpus/helper_case/audio_subtitles-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/audio_utils/subtitle_utils.py#L11-L279
  why: Own all timing records, Unicode boundary rules, cue thresholds and both subtitle renderers.
dod:
- text: >-
    subtitle_rendering merges tokens {text:Hel,start_ms:0},{text:lo,end_ms:1000} into one cue 0..1000 Hello.
    SRT is "1\n00:00:00,000 --> 00:00:01,000\nHello\n"; VTT is
    "WEBVTT\n\n00:00:00.000 --> 00:00:01.000\nHello\n". Empty tokens or tokens without any start render
    SRT="" and VTT="WEBVTT\n"; synthesize_subtitle_document returns None for either format when no cue remains.
    A cue start=-1,end=-2 retains those values internally but renders both timestamps 00:00:00,000.
    Missing end uses start; end earlier than start is not repaired. A timestamp 360000000 renders 100:00:00,000.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    subtitle_thresholds adds a second word after a 699ms gap and keeps one cue; a 700ms gap splits. Duration
    exactly 7000ms stays together; 7001ms splits. Width exactly 84 stays together; 85 splits at the word
    boundary. A single overlong word is never split. Known speaker a to b splits; known to None does not
    itself split. A later known b splits if an earlier cue word had known speaker a, even with intervening
    unknown speakers. Each listed sentence-ending punctuation ends the cue at the next word boundary.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    subtitle_cjk_boundaries checks both endpoints of every listed CJK interval and adjacent nonmembers.
    Chinese/Japanese character pairs become words without spaces; comma/closing punctuation stays on the
    preceding word and opening punctuation on the following word. W/F characters count 2, including fullwidth
    Latin; combining marks and narrow characters each count 1. Empty tokens are removed before boundaries,
    and first/last non-None timestamps survive merged subwords without inventing missing timestamps.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    subtitle_word_timing_input supplies [{word:Hello,start:0,end:1,extra:ignored}] with srt and expects
    "1\n00:00:00,000 --> 00:00:01,000\nHello\n". The equivalent vtt has the header and dot timestamps.
    Unsupported response_format=json or uppercase SRT returns None. Numeric strings are coerced by the
    timing model; a list containing a bad start="bad" or speaker=7 produces no cues for the whole list,
    without warnings. Missing word gives a whitespace token whose empty cue is dropped. 0.0005 seconds
    rounds to 0ms,0.0015 to 2ms. NaN timing raises ValueError and infinity raises OverflowError during rounding;
    do not conflate those with the model-validation fallback to ().
  proof: [behavior-tests, oracle, helper-python]
- text: Newly added audio_subtitles helper seeds select the production parsed-record transformer.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Exact line endings, Unicode boundaries and threshold inclusivity each affect returned subtitle bytes.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::audio_subtitles::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: Subtitle comparison must use the pinned renderer and pass strict adapter checks.
    run: test -f tools/oracle/helpers/audio_subtitles.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: Timing records and non-finite tagged fixtures must parse under the new helper operation.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/audio_subtitles-*)" && grep -qE '^[[:space:]]+audio_subtitles:' tools/oracle/fuzz/corpus/helper_case/audio_subtitles-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Subtitle tests need new independent timing and rendering fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/audio-subtitles)"
oracle_cases:
- tools/oracle/cases/helpers/audio-subtitles/subtitle-rendering.yaml
- tools/oracle/cases/helpers/audio-subtitles/subtitle-thresholds.yaml
- tools/oracle/cases/helpers/audio-subtitles/subtitle-cjk-boundaries.yaml
- tools/oracle/cases/helpers/audio-subtitles/subtitle-word-timing-input.yaml
deviations: []
out_of_scope:
- Provider response byte decoding remains with transcription providers; this file contains only parsed-record transforms and every callable is owned here, including nested next_start.
pitfalls:
- 'The oracle helper for this task is pre-registered as audio_subtitles in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/audio_subtitles.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/audio_subtitles.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Empty VTT is "WEBVTT\n", whereas empty SRT is empty and the synthesis convenience function returns None.
- Cue limits are checked only between words, so an overlong single word is retained intact.
- Timing model validation failures drop the whole list silently; NaN/Infinity fail later and are not caught there.
review_level: standard
budget:
  max_changed_lines: 550
  max_new_expects: 1
