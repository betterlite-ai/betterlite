checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_subtitles::/) - test(/::replays_corpus$/)'
  - id: case-srt-timestamps
    why: the srt-timestamps behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_subtitles::tests::srt_timestamps($|::)/)'
  - id: case-webvtt-header
    why: the webvtt-header behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_subtitles::tests::webvtt_header($|::)/)'
  - id: case-cjk-word-boundaries
    why: the cjk-word-boundaries behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_subtitles::tests::cjk_word_boundaries($|::)/)'
  - id: case-cue-duration-break
    why: the cue-duration-break behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_subtitles::tests::cue_duration_break($|::)/)'
  - id: case-invalid-word-timing
    why: the invalid-word-timing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_subtitles::tests::invalid_word_timing($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/audio_subtitles.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/audio_subtitles-*)"
      && grep -qE "^[[:space:]]+audio_subtitles:" tools/oracle/fuzz/corpus/helper_case/audio_subtitles-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/audio-subtitles)"
