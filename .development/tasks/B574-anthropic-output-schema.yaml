  - id: case-constraint-description
    why: 'Remove exactly these keys and append notes in this declaration order, regardless of input key order: minItems
      -> minimum number of items: {}; maxItems -> maximum number of items: {}; uniqueItems -> all array items must
      be unique; contains -> array must contain an item matching: {}; minContains -> minimum number of matching
      items: {}; maxContains -> maximum number of matching items: {}; prefixItems -> leading items must match, in
      order: {}; minimum -> minimum value: {}; maximum -> maximum value: {}; exclusiveMinimum -> exclusive minimum
      value: {}; exclusiveMaximum -> exclusive maximum value: {}; multipleOf -> must be a multiple of {}; minLength
      -> minimum length: {}; maxLength -> maximum length: {}; minProperties -> minimum number of properties: {};
      maxProperties -> maximum number of properties: {}; patternProperties -> properties whose names match each
      pattern must satisfy: {}; propertyNames -> property names must satisfy: {}; dependentRequired -> dependent
      required properties: {}; dependentSchemas -> dependent schemas: {}; unevaluatedProperties -> unevaluated properties
      must satisfy: {}; if -> conditional (if): {}; then -> conditional (then): {}; else -> conditional (else):
      {}; not -> must not match: {}. Notes are Note: <comma-space joined labels>. with one preceding space after
      a truthy existing description. Dict/list constraint values use Python JSON serialization; other values use
      Python formatting. Unknown keys remain.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_constraint_description$/)'
  - id: case-false-constraint-ignored
    why: Boolean false constraints are removed without adding notes; numeric zero, empty strings/arrays/objects
      and None still add notes. Non-dict schema nodes pass through unchanged.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_false_constraint_ignored$/)'
  - id: case-enum-type-conflict
    why: With list enum and present type, drop type when it is a list (even matching/empty enum), or any value mismatches
      a known scalar type. null/boolean/integer/number/string/array/object checks distinguish bool from int/number;
      integer rejects floats. Unknown type or nonlist enum does not trigger dropping. Preserve enum.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_enum_type_conflict$/)'
  - id: case-oneof-to-anyof
    why: Recurse only through dict properties, dict items, dict $defs and list anyOf/allOf/oneOf; merge oneOf into
      anyOf in source key encounter order, preserving duplicates. Wrong-shaped recognized keys and other nested
      objects remain untouched.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_oneof_to_anyof$/)'
  - id: case-object-additional-properties
    why: After type conflict filtering, exact type=object forces additionalProperties=false regardless of supplied
      value; a removed/conflicting type does not trigger insertion.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_object_additional_properties$/)'
  - id: case-bounded-def-expansion
    why: Extract response_schema by key presence before json_schema.schema (even response_schema=None), then deepcopy.
      Pop both $defs and definitions, prefer $defs if present; truthy definitions expand through B217 with max_inlined_bytes=10000000
      before filtering. Empty schema is valid, None returns no format; do not mutate input.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_bounded_def_expansion$/)'
  - id: case-json-tool-fallback
    why: Output format returns {type:json_schema,schema:<filtered>}. Tool fallback returns name=json_tool_call,
      input_schema starts type=object then supplied schema overrides it without output-schema filtering/defs expansion.
      Direct helper None produces additionalProperties=true,properties={}. optional_params and is_thinking_enabled
      arguments have no effect here.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_json_tool_fallback$/)'
  - id: case-text-format-no-tool
    why: None or value.type=text produces no tool; other types require an extracted schema, and missing type raises
      KeyError at this layer. Pydantic extraction delegates B160 type_to_response_format_param with literal ref_template=/$defs/{model};
      Rust receives serialized schema, no Python-model emulation.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::output_schema_cases::case_[0-9]+_text_format_no_tool$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_output_schema.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_output_schema*")"
      && grep -lq 'anthropic_output_schema' tools/oracle/fuzz/corpus/helper_case/anthropic_output_schema* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_output_schema$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
