id: B574
title: Anthropic structured-output schema filtering
description: >-
  Add AnthropicOutputFormat and bounded recursive schema filtering. Preserve constraint-to-description projection,
  enum/type conflict handling, anyOf/oneOf treatment, object additionalProperties and bounded definition expansion
  through existing schema utilities. Pydantic object-to-schema extraction remains B160; this Rust boundary receives
  serialized schemas.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  _enum_conflicts_with_declared_type L172-L181; AnthropicConfig.filter_anthropic_output_schema L530-L665; AnthropicConfig.get_json_schema_from_pydantic_object
  L667-L670; AnthropicConfig._extract_json_schema_from_response_format L1328-L1337; AnthropicConfig.map_response_format_to_anthropic_output_format
  L1339-L1364; AnthropicConfig.map_response_format_to_anthropic_tool L1366-L1387; AnthropicConfig._create_json_tool_call_for_response_format
  L1656-L1682.


  Named case contracts: constraint_description: Remove exactly these keys and append notes in this declaration order,
  regardless of input key order: minItems -> minimum number of items: {}; maxItems -> maximum number of items: {};
  uniqueItems -> all array items must be unique; contains -> array must contain an item matching: {}; minContains
  -> minimum number of matching items: {}; maxContains -> maximum number of matching items: {}; prefixItems -> leading
  items must match, in order: {}; minimum -> minimum value: {}; maximum -> maximum value: {}; exclusiveMinimum ->
  exclusive minimum value: {}; exclusiveMaximum -> exclusive maximum value: {}; multipleOf -> must be a multiple
  of {}; minLength -> minimum length: {}; maxLength -> maximum length: {}; minProperties -> minimum number of properties:
  {}; maxProperties -> maximum number of properties: {}; patternProperties -> properties whose names match each
  pattern must satisfy: {}; propertyNames -> property names must satisfy: {}; dependentRequired -> dependent required
  properties: {}; dependentSchemas -> dependent schemas: {}; unevaluatedProperties -> unevaluated properties must
  satisfy: {}; if -> conditional (if): {}; then -> conditional (then): {}; else -> conditional (else): {}; not ->
  must not match: {}. Notes are Note: <comma-space joined labels>. with one preceding space after a truthy existing
  description. Dict/list constraint values use Python JSON serialization; other values use Python formatting. Unknown
  keys remain. false_constraint_ignored: Boolean false constraints are removed without adding notes; numeric zero,
  empty strings/arrays/objects and None still add notes. Non-dict schema nodes pass through unchanged. enum_type_conflict:
  With list enum and present type, drop type when it is a list (even matching/empty enum), or any value mismatches
  a known scalar type. null/boolean/integer/number/string/array/object checks distinguish bool from int/number;
  integer rejects floats. Unknown type or nonlist enum does not trigger dropping. Preserve enum. oneof_to_anyof:
  Recurse only through dict properties, dict items, dict $defs and list anyOf/allOf/oneOf; merge oneOf into anyOf
  in source key encounter order, preserving duplicates. Wrong-shaped recognized keys and other nested objects remain
  untouched. object_additional_properties: After type conflict filtering, exact type=object forces additionalProperties=false
  regardless of supplied value; a removed/conflicting type does not trigger insertion. bounded_def_expansion: Extract
  response_schema by key presence before json_schema.schema (even response_schema=None), then deepcopy. Pop both
  $defs and definitions, prefer $defs if present; truthy definitions expand through B217 with max_inlined_bytes=10000000
  before filtering. Empty schema is valid, None returns no format; do not mutate input. json_tool_fallback: Output
  format returns {type:json_schema,schema:<filtered>}. Tool fallback returns name=json_tool_call, input_schema starts
  type=object then supplied schema overrides it without output-schema filtering/defs expansion. Direct helper None
  produces additionalProperties=true,properties={}. optional_params and is_thinking_enabled arguments have no effect
  here. text_format_no_tool: None or value.type=text produces no tool; other types require an extracted schema,
  and missing type raises KeyError at this layer. Pydantic extraction delegates B160 type_to_response_format_param
  with literal ref_template=/$defs/{model}; Rust receives serialized schema, no Python-model emulation.


  Shared provider base helper implementations are B2202: use its owned primitives directly when called by these
  ranges. Do not reintroduce a dependency on B010/B016 for these small helpers.


  Implement crates/betterlite-anthropic/src/output_schema.rs with adjacent tests under output_schema/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function output_schema_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): constraint_description, false_constraint_ignored, enum_type_conflict, oneof_to_anyof, object_additional_properties,
  bounded_def_expansion, json_tool_fallback, text_format_no_tool. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_output_schema* using HelperCase: kind:
  helper and the externally tagged anthropic_output_schema variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_output_schema that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 187 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 250 production lines, 240 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 635 planned, 650 maximum changed lines.
