pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_output_schema in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/output_schema.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_output_schema.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
