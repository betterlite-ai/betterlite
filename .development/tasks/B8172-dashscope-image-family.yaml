id: B8172
title: DashScope image generation and Qwen brand variants
description: >-
  Build dashscope_image and dashscope_family in crates/betterlite-openai. dashscope_image covers
  litellm/llms/dashscope/image_generation/transformation.py. dashscope_family covers litellm/llms/dashscope/qwencloud.py,
  litellm/llms/dashscope/qwen_ai_platform.py and the selector and key functions of litellm/llms/dashscope/common_utils.py
  (L42-L109) that B8171 left out. The image_generation/__init__.py file only re-exports. Nothing reads an environment
  variable. The caller passes every key and base as a plain argument. Dispatch wiring and the main.py credential call
  site (main.py L7204-L7213) belong to B8312.

  dashscope_family. enum DashscopeFamily { Dashscope, QwenCloud, QwenAiPlatform }. For each variant, functions build the
  inputs the earlier tasks take. chat_policy(family, env) returns B8170's ChatBasePolicy. embedding_identity and
  rerank_settings return B8171's FamilyIdentity and rerank settings. image_identity returns the ImageIdentity below. The
  values are these. QwenCloud: chat default https://dashscope-intl.aliyuncs.com/compatible-mode/v1, env base
  QWENCLOUD_API_BASE (used for provider info and for the chat URL, so env_in_complete_url is true), rerank default
  https://dashscope-intl.aliyuncs.com/compatible-api/v1/reranks with env QWENCLOUD_API_BASE_RERANK, image default
  https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation with env
  QWENCLOUD_API_BASE_IMAGE, key order api_key, QWENCLOUD_API_KEY, DASHSCOPE_API_KEY, and the missing-key message "QwenCloud
  API key is required. Set 'QWENCLOUD_API_KEY' or 'DASHSCOPE_API_KEY' env var or pass api_key explicitly." Qianwen AI
  Platform: the same shape with the host dashscope.aliyuncs.com (chat default
  https://dashscope.aliyuncs.com/compatible-mode/v1, rerank https://dashscope.aliyuncs.com/compatible-api/v1/reranks, image
  https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation), env names QWEN_AI_PLATFORM_API_BASE,
  QWEN_AI_PLATFORM_API_BASE_RERANK and QWEN_AI_PLATFORM_API_BASE_IMAGE, key order api_key, QWEN_AI_PLATFORM_API_KEY,
  DASHSCOPE_API_KEY, and the message "Qianwen AI Platform API key is required. Set 'QWEN_AI_PLATFORM_API_KEY' or
  'DASHSCOPE_API_KEY' env var or pass api_key explicitly." For both brands an empty api_key counts as unset
  (empty_key_is_set false). The chat provider info for a brand returns its key without raising when nothing is found.

  resolve_family_api_key(family, api_key, brand_key, dashscope_key) is resolve_dashscope_family_api_key: for Dashscope it
  is api_key or dashscope_key (non-empty wins). For the brands it is api_key, then brand_key, then dashscope_key.
  missing_family_key_message(family) returns the three texts of missing_dashscope_family_key_message: "Missing API key for
  QwenCloud. Set QWENCLOUD_API_KEY or DASHSCOPE_API_KEY environment variable or pass api_key parameter.", the same with
  "Qianwen AI Platform" and QWEN_AI_PLATFORM_API_KEY, and for Dashscope "Missing API key for DashScope. Set
  DASHSCOPE_API_KEY environment variable or pass api_key parameter." The three selector functions become
  embedding_config(family), rerank_config(family) and image_config(family), each returning the matching config built with that
  family's settings.

  dashscope_image. DashscopeImageConfig takes an ImageIdentity { missing_key_message, env_key, fallback_key,
  env_image_base, default_image_base }. Plain DashScope: message "DASHSCOPE_API_KEY is not set", env_key the DASHSCOPE_API_KEY
  value, env_image_base the DASHSCOPE_API_BASE_IMAGE value, default
  https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation (the international host, unlike
  the chat default). The key rule is api_key when non-empty, else env_key, else fallback_key, else a ValueError with the
  message. Supported options are n and size. map_openai_params walks non_default_params. It skips a key already in
  optional_params and a key outside n and size. size maps through the table 256x256, 512x512, 1024x1024, 1792x1024,
  1024x1792, 2048x2048 to the same numbers joined by *, and any other size string has every x replaced by *. n is copied. It
  returns only the mapped entries, not optional_params merged with them. The URL ignores api_base when it is empty or when
  its trailing-slash-trimmed form ends in /compatible-mode/v1. Then it is api_base, else env_image_base, else the default,
  used as is. Headers get Authorization Bearer {key} and Content-Type application/json added to the caller headers. The body
  is {model, input: {messages: [{role: user, content: [{text: prompt}]}]}, parameters: every optional_params entry}. The
  reply decoder decode_dashscope_image_reply(bytes, status, headers) works like this. A status other than 200 gives a
  BaseLLMException (B2202) with the status, the body text and the headers. A body that is not JSON gives one with "Failed to
  parse DashScope image generation response: {reason}". A body with a code key and no output key gives one with the message
  field as text, else the body as JSON text (docs/compatibility.md). Otherwise walk output.choices, each choice's
  message.content list, and collect {url: image} for every item with a non-empty image. No images gives an empty data list,
  not an error. The decoder gets a fuzz target.

  Size. The LiteLLM code owned here is about 270 nonblank, non-comment lines. Plan 280 production, 300 tests, 100 adapters,
  60 fuzz and 20 wiring lines. No split.
scope:
  paths:
    - crates/betterlite-openai/src/dashscope_image.rs
    - crates/betterlite-openai/src/dashscope_image/**
    - crates/betterlite-openai/src/dashscope_family.rs
    - crates/betterlite-openai/src/dashscope_family/**
    - crates/betterlite-openai/fuzz/Cargo.toml
    - crates/betterlite-openai/fuzz/fuzz_targets/dashscope_image_reply.rs
    - crates/betterlite-openai/fuzz/corpus/dashscope_image_reply/**
    - tools/oracle/cases/helpers/dashscope-family/**
    - tools/oracle/helpers/b8172.py
    - tools/oracle/helpers/b8172/**
    - tools/oracle/src/helpers/openai/b8172.rs
    - tools/oracle/src/helpers/openai/b8172/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/image_generation/transformation.py#L48-L213
    why: Image options, size table, URL rule, body and reply conversion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/qwencloud.py#L11-L65
    why: QwenCloud bases, key order and the four config overrides.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/qwen_ai_platform.py#L11-L65
    why: Qianwen AI Platform bases, key order and the four config overrides.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/common_utils.py#L42-L109
    why: The family selectors, key resolver and missing-key messages.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7204-L7213
    why: The only caller of the key resolver and the message function.
dod:
  - text: Image options, size mapping, URL rule, headers and body match LiteLLM, and the mapping returns only the mapped entries.
    proof: [dashscope-image-tests, oracle]
  - text: The image reply decoder handles non-200, non-JSON, code-without-output and normal replies, and a reply with no images gives an empty list.
    proof: [dashscope-image-tests, oracle]
  - text: A malformed image reply fails with a typed error and does not panic, and the corpus replays.
    proof: [dashscope-image-corpus]
  - text: The QwenCloud and Qianwen AI Platform settings, key order and messages match the pinned values, and the key resolver and message function match for all three families.
    proof: [dashscope-family-tests, oracle]
  - text: The new oracle cases exist and call this task's helper.
    proof: [dashscope-family-cases]
checks:
  optional: [mutants]
  commands:
    - id: dashscope-image-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^dashscope_image::/) - test(/replays_the_/)'
      why: An OpenAI-shaped image config would send a flat prompt body, keep WxH sizes and read data[].url from the reply.
    - id: dashscope-image-corpus
      run: test -f crates/betterlite-openai/fuzz/fuzz_targets/dashscope_image_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/dashscope_image_reply)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_dashscope_image_reply_corpus)'
      why: The reply body comes from the network and needs a fuzz target with a replayed corpus.
    - id: dashscope-family-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^dashscope_family::/)'
      why: Reusing the DashScope hosts and keys for the brands would send QwenCloud traffic to the wrong region.
    - id: dashscope-family-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/dashscope-family)" && /usr/bin/grep -rlE '^  b8172:' tools/oracle/cases/helpers/dashscope-family
      why: Without cases that call the B8172 helper nothing compares these functions with LiteLLM.
oracle_cases:
  - tools/oracle/cases/helpers/dashscope-family/image-params-and-size.yaml
  - tools/oracle/cases/helpers/dashscope-family/image-url-and-key.yaml
  - tools/oracle/cases/helpers/dashscope-family/image-request-and-reply.yaml
  - tools/oracle/cases/helpers/dashscope-family/family-settings.yaml
  - tools/oracle/cases/helpers/dashscope-family/family-key-and-message.yaml
deviations:
  - what: An image reply whose output, choices or content has the wrong type fails with a typed BaseLLMException, status 500.
    why: LiteLLM raises a raw AttributeError there. 500 is the status LiteLLM's generic exception mapping gives an unclassified exception (to be confirmed by the architect, see notes).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/dashscope/image_generation/transformation.py#L205-L211
out_of_scope:
  - B8170 owns ChatBasePolicy and the chat config. B8171 owns DashscopeError, FamilyIdentity, the embedding config, the rerank config and the rerank base resolver. B2202 owns BaseLLMException.
  - B2230 and B5360 own choosing a config from the provider name. B8312 owns the credential call site and dispatch wiring.
  - The brand aliases qwencloud and qwen_ai_platform as provider names in the registry belong to the provider registry tasks.
pitfalls:
  - The plain DashScope image default is the international host dashscope-intl.aliyuncs.com, while its chat and rerank defaults are dashscope.aliyuncs.com. QwenAiPlatform uses dashscope.aliyuncs.com for image.
  - An api_base that ends in /compatible-mode/v1 is dropped for image calls, so the chat base set for a deployment never reaches the image endpoint.
  - map_openai_params returns a fresh map and does not merge optional_params, and a key already in optional_params is skipped.
  - size 512x512 maps through the table and 800x600 through the replace rule, and a size with an x elsewhere (for example "auto" has no x but "xlarge" has) is also rewritten by the replace rule.
  - The image key rule treats an empty api_key as unset and the plain embedding rule does not, so each config keeps its own rule.
  - An empty content item or an item without image adds nothing, and a reply with no images is a success with empty data.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
