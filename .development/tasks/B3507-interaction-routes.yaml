checks:
  optional: []
  commands:
    - id: interaction-routes-http
      why: HTTP routes, auth, interaction_id extraction, custom_llm_provider default, or response format are missing or incorrect
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/http_case/interaction-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
