  - text: "GET /v1beta/interactions/{interaction_id} and GET /interactions/{interaction_id} both serve the same handler and dispatch via aget_interaction."
    proof: [interaction-routes-http]
  - text: "DELETE /v1beta/interactions/{interaction_id} and DELETE /interactions/{interaction_id} both serve the same handler and dispatch via adelete_interaction."
    proof: [interaction-routes-http]
  - text: "POST /v1beta/interactions/{interaction_id}/cancel and POST /interactions/{interaction_id}/cancel both serve the same handler and dispatch via acancel_interaction."
    proof: [interaction-routes-http]
  - text: "The create route reads the request body and passes it to base_process_llm_request."
    proof: [interaction-routes-http]
  - text: "The get, delete and cancel routes do not read a body; they extract interaction_id from the path and set it in the data dict."
    proof: [interaction-routes-http]
