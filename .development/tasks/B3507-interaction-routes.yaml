id: B3507
title: Serve interaction create retrieve delete and cancel routes
description: >-
  Register HTTP routes for interaction create, retrieve, delete, and cancel operations in betterlite-server.
  Serve POST /v1beta/interactions, POST /interactions, GET /v1beta/interactions/{interaction_id}, GET /interactions/{interaction_id},
  DELETE /v1beta/interactions/{interaction_id}, DELETE /interactions/{interaction_id},
  POST /v1beta/interactions/{interaction_id}/cancel, and POST /interactions/{interaction_id}/cancel.
  Each route receives requests from LiteLLM API clients using the Google Interactions API.
  Parse the JSON body (using B1100's request decoder for create; no body for get/delete/cancel),
  authenticate via B052's virtual key auth, extract the interaction_id from the path where needed,
  set custom_llm_provider to "gemini" as default when not provided, and dispatch to B3499's create,
  B3495's get, B3500's delete, and B3500's cancel handlers via B014's base_process_llm_request.
  Return the same error status, type, param and code LiteLLM returns on provider errors (rule
  errors-match-litellm), with betterlite's own message. On exceptions during dispatch, extract
  the error and reraise it through the exception handler so the error response middleware (from B003)
  returns the correct HTTP response. Clients that read x-litellm-* response headers must see the
  ones LiteLLM sends: call id, model id, model group, model api base, and others the oracle cases
  show.
scope:
  paths:
    - crates/betterlite-server/src/api/interaction_routes.rs
    - crates/betterlite-server/src/api/interaction_routes/**
    - tools/oracle/cases/interactions/**
    - tools/oracle/fuzz/corpus/http_case/interaction-*
    - tools/oracle/helpers/b3507.py
    - tools/oracle/helpers/b3507/**
    - tools/oracle/src/helpers/server/b3507.rs
    - tools/oracle/src/helpers/server/b3507/**
  lint_tables: false
