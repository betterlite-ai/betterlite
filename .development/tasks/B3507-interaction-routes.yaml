deviations:
  - what: All routes default custom_llm_provider to "gemini" when not provided in the request data, applying a fixed default before dispatching to base_process_llm_request.
    why: The create, get, delete and cancel handlers in LiteLLM all set this default at lines 275, 343, 411, and 479 respectively; betterlite preserves this behavior for consistency with LiteLLM's provider selection.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L273-L276
  - what: Interaction ID is extracted from the path and placed in the data dict for get, delete and cancel operations; these operations do not read a request body.
    why: LiteLLM's routes (lines 343, 411, 479) build a minimal data dict with only interaction_id and custom_llm_provider, delegating all parameter handling to the call pipeline tasks (B3495, B3500).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L343
  - what: Create operations read the full request body (parsed via B1100's _read_request_body) and pass all data to base_process_llm_request; the route does not extract specific fields.
    why: LiteLLM's create handler (lines 271-272) reads the body and passes it through with only the custom_llm_provider default applied; parameter extraction is owned by B3499's create call handler.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L271-L276
out_of_scope:
  - Interaction creation logic and request parameter handling; B3499 owns the acreate_interaction call entry point.
  - Interaction retrieval logic and request parameter handling; B3495 owns the aget_interaction call entry point.
  - Interaction deletion and cancellation logic and request parameter handling; B3500 owns both adelete_interaction and acancel_interaction call entry points.
  - Streaming response assembly and logging; B252 and B2227 handle buffered chunk assembly and completion callbacks.
  - Request/response transformation and provider dispatch; B014 owns base_process_llm_request and exception handling.
  - Cost tracking headers (x-litellm-response-cost) and key-limit headers; they need spend tracking (B069) and virtual keys (B052).
pitfalls:
  - >-
    The two routes (/v1beta/ and /) for each operation (create, get, delete, cancel) must
    share the same async handler function, not duplicate it, to avoid maintenance divergence.
  - >-
    The custom_llm_provider default must be set in the data dict *before* calling base_process_llm_request,
    so the downstream handler sees the default when no custom_llm_provider is provided.
  - >-
    The interaction_id from the path must be extracted and placed in the data dict with the key
    ""interaction_id"", matching the case the call handlers expect.
  - >-
    The create route reads the full request body via _read_request_body and passes all data through;
    do not extract and transform fields here. The call handler owns parameter extraction.
  - >-
    The get, delete and cancel routes do not read a request body. They build a minimal data dict
    with only interaction_id and custom_llm_provider, then delegate to base_process_llm_request.
  - >-
    When the upstream fails before sending the first byte, return the provider's error status
    and type, not a gateway error, so clients see the real failure.
  - >-
    The exception handler expects exceptions raised from the dispatcher, not errors in status
    codes; re-raise provider errors from the exception handler rather than returning them directly.
  - >-
    ORJSONResponse must be used for all responses to match LiteLLM's JSON serialization behavior
    and header handling.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
