    why: create_interaction route and handler with POST /v1beta/interactions and POST /interactions paths, body parsing, custom_llm_provider default, and delegation to base_process_llm_request with route_type acreate_interaction
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L306-L371
    why: get_interaction route and handler with GET /v1beta/interactions/{interaction_id} and GET /interactions/{interaction_id} paths, interaction_id path parameter, custom_llm_provider default, and delegation to base_process_llm_request with route_type aget_interaction
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L374-L439
    why: delete_interaction route and handler with DELETE /v1beta/interactions/{interaction_id} and DELETE /interactions/{interaction_id} paths, interaction_id path parameter, custom_llm_provider default, and delegation to base_process_llm_request with route_type adelete_interaction
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L442-L507
    why: cancel_interaction route and handler with POST /v1beta/interactions/{interaction_id}/cancel and POST /interactions/{interaction_id}/cancel paths, interaction_id path parameter, custom_llm_provider default, and delegation to base_process_llm_request with route_type acancel_interaction
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L1-15
    why: Router initialization, dependencies import and user_api_key_auth usage pattern
