deviations:
- what: Query-parameter litellm_params_template on GET /v1beta/agents is read and JSON-decoded; if malformed, it becomes empty dict rather than propagating a JSON error.
  why: This matches LiteLLM's agents_endpoints.py _merge_query_params_into_data at lines 99-107, which catches json.JSONDecodeError and ValueError, setting template to empty dict.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/agents_endpoints.py#L99-L107
- what: Non-dict litellm_params_template (after JSON decode) is treated as no template; only dict templates are merged.
  why: LiteLLM's _merge_query_params_into_data checks isinstance(template, dict) at line 105 before merging.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/agents_endpoints.py#L105
out_of_scope:
- B3504 owns acreate and alist entry points that these routes delegate to.
- B014 owns base_process_llm_request and _handle_llm_api_exception methods; this task only calls them.
- B052 owns user_api_key_auth dependency and UserAPIKeyAuth type.
- B1100 owns _read_request_body and _safe_get_request_query_params.
- FastAPI/Starlette Request, Response and HTTPException types; this task uses them as they are provided.
- The proxy's installed route registration and dispatcher lifecycle; this task only defines two route handlers.
pitfalls:
- >-
  _enforce_caller_supplied_provider_key checks data.get("api_key") for truthiness, not data.get("api_key") is not None.
  A data dict with api_key=None or api_key="" (empty string) fails the check and raises 401, even though the key
  is present. This is intentional: only a non-empty api_key satisfies the guard.
- >-
  POST /v1beta/agents merges litellm_params_template from the body *before* calling _enforce_caller_supplied_provider_key,
  so a template containing api_key satisfies the guard. GET /v1beta/agents does the same order: merge query params first,
  then check. Body/query precedence is preserved because setdefault is used; existing keys are not overwritten.
- >-
  Both routes set custom_llm_provider to gemini as the default *before* the merge, so _merge_query_params_into_data
  cannot override it. The fixed provider in the route handler takes precedence over the template.
- >-
  The security guard runs after the merge and before base_process_llm_request. If _enforce_caller_supplied_provider_key
  raises HTTPException(401), that exception propagates directly to the HTTP response without being caught by the
  surrounding try/except block that wraps base_process_llm_request's exceptions.
- >-
  _proxy_server_imports is called once per request; it reimports the same module globals each time. No caching or
  lazy loading is applied; each request pays the import cost.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
