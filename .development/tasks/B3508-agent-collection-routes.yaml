id: B3508
title: Enforce managed-agent credentials and serve collection routes
description: >-
  Build the caller-supplied-key guard and JSON query-template merge, then register POST/GET `/v1beta/agents`.
  Implement _is_proxy_admin to check if a user is a proxy admin by role. Implement _enforce_caller_supplied_provider_key
  to require non-admin callers to provide an api_key via body or litellm_params_template; proxy admins may use the
  env fallback GOOGLE_API_KEY or GEMINI_API_KEY. On violation, raise HTTPException with 401 Unauthorized.
  Implement _merge_query_params_into_data to read a JSON litellm_params_template query parameter and merge it into
  the data dict without overwriting existing keys; malformed JSON becomes empty dict. Implement _proxy_server_imports
  to return a dict of imported proxy_server globals. Register POST /v1beta/agents that reads the request body,
  extracts litellm_params_template from body, merges it into data preserving precedence (body > template),
  sets custom_llm_provider to gemini as default, calls _enforce_caller_supplied_provider_key, then routes through
  base_process_llm_request with route_type acreate_agent to B3504's acreate. Register GET /v1beta/agents that
  initializes data with custom_llm_provider gemini, calls _merge_query_params_into_data to handle query-param
  credentials, calls _enforce_caller_supplied_provider_key, then routes through base_process_llm_request with route_type
  alist_agents to B3504's alist. Both routes return ORJSONResponse. Preserve the security guard's 401 occurrence
  before base_process_llm_request's exception catch. Implement all six functions in betterlite-server's agents
  collection-routes module, with Rust/Python oracle adapters.
scope:
