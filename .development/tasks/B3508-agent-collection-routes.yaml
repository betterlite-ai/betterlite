dod:
- text: >-
    Proxy admin detection matches LiteLLM: _is_proxy_admin returns true when user_role equals or matches
    LitellmUserRoles.PROXY_ADMIN.
  proof:
    - behavior-tests
- text: >-
    Non-admin callers without an api_key raise HTTPException with status 401 and include the credential requirement
    message. Proxy admins and callers with api_key in data pass through.
  proof:
    - security-tests
- text: >-
    Query parameter litellm_params_template is JSON-decoded; malformed JSON becomes empty dict. Decoded values
    are merged into data without overwriting existing keys.
  proof:
    - behavior-tests
- text: >-
    POST /v1beta/agents extracts litellm_params_template from body, merges it while preserving body precedence,
    sets custom_llm_provider to gemini as default, enforces caller-supplied key, and calls base_process_llm_request
    with route_type acreate_agent.
  proof:
    - oracle-routes
- text: >-
    GET /v1beta/agents initializes data with custom_llm_provider gemini, merges query-param litellm_params_template,
    enforces caller-supplied key, and calls base_process_llm_request with route_type alist_agents.
  proof:
    - oracle-routes
- text: >-
    Both routes return ORJSONResponse. The security guard's 401 occurs before base_process_llm_request's exception
    catch, so the 401 is not wrapped in generic exception handling.
  proof:
    - oracle-routes
