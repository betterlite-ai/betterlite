dod:
  - text: >-
      process_output_streaming_response routes to _process_streaming_block_only or
      _process_streaming_transform based on stream_transform_sink presence, accumulating
      text deltas per choice and managing responses_so_far mutability.
    proof: [streaming-dispatch-cases]
  - text: >-
      _process_streaming_block_only detects stream termination by finish_reason, accumulates
      text per choice, applies guardrail via apply_guardrail, and for ended streams
      rebuilds per-choice responses with text and tool-call rewrites via stream_chunk_builder.
    proof: [block-only-cases]
  - text: >-
      _process_streaming_transform runs guardrail over accumulated text per choice without
      mutating responses_so_far, reports guardrailed text and stream_holdback_chars per
      choice on StreamTransformSink, and handles absent texts gracefully.
    proof: [transform-cases]
  - text: >-
      get_streaming_scan_key returns StreamingScanKey with accumulated texts, tool-call
      fingerprints (when stream ended), stream_ended flag, and tool_calls_in_flight boolean.
    proof: [scan-key-cases]
  - text: >-
      _as_tool validates a tool object (BaseModel or dict) against the Pydantic adapter
      and returns it or None, with invalid tools logged as dropped.
    proof: [tool-validation-cases]
  - text: >-
      _indexed_keys returns (key_string, ordinal) tuples for tools with indexed duplicate
      handling, where key is "type:name" for chat tools or "type:server_label/name" for others.
    proof: [indexed-key-cases]
  - text: >-
      merge_guardrailed_tools accepts original_tools, flattened_groups, and guardrailed_tools,
      reconstructs namespace members from flattened outputs, and returns merged result with
      appended new tools not owned by original namespaces.
    proof: [merge-tools-cases]
  - text: >-
      _rebuilt_namespace preserves namespace structure while rebuilding member descriptions
      by stripping namespace prefix and custom-tool grammar suffix from guardrailed members.
    proof: [rebuild-namespace-cases]
  - text: >-
      is_anthropic_sse_stream detects Anthropic SSE by checking event types in raw frames,
      returning true only for frames containing Anthropic message types (not Google streams).
    proof: [anthropic-detect-cases]
  - text: >-
      assemble_anthropic_sse_stream joins raw SSE bytes with UTF-8 decoding, parses events,
      extracts message_start, assembles via the PassthroughLoggingHandler, and optionally
      restores model and id from message_start when restore_identity is true.
    proof: [anthropic-assemble-cases]
  - text: >-
      anthropic_sse_error_frames generates Anthropic error event frames for post-header
      failures with guardrail_error type and supplied message text.
    proof: [anthropic-error-cases]
  - text: >-
      model_response_text extracts assistant text from assembled responses for guardrail
      rewrite detection.
    proof: [model-text-cases]
  - text: >-
      is_raw_sse_stream detects unparsed bytes in chunk sequences to distinguish raw SSE
      frames from assembled ModelResponseStream objects.
    proof: [sse-raw-detect-cases]
  - text: >-
      is_sse_error_stream returns true only for sequences of pure error frames (all chunks
      are bytes/str, all events are type "error" or carry error mapping), failing closed
      on mixed streams containing real response content.
    proof: [sse-error-detect-cases]
  - text: >-
      anthropic_sse_chunks_from_response converts assembled ModelResponse to Anthropic wire
      format via LiteLLMAnthropicMessagesAdapter, then iterates FakeAnthropicMessagesStreamIterator
      to produce SSE chunk bytes.
    proof: [sse-chunk-generation-cases]

