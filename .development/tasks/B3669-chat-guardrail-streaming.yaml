id: B3669
title: Chat guardrail streaming and lossless tool merging
description: >-
  Implement streaming guardrail processing for chat completions with block-only
  and incremental transform paths, handling text accumulation per choice with
  holdback preservation. Supply lossless tool merging for Responses namespace
  and custom-tool rewrites with indexed duplicate-name handling. Provide raw
  Anthropic SSE conversion used by the shared stream dispatcher.

  Block-only streaming: accumulate text deltas per choice, run guardrail on
  accumulated text (leaving responses_so_far untouched for raw accumulation),
  detect stream termination by finish_reason, and emit block frames when
  guardrail blocks. For ended streams, rebuild per-choice responses using
  stream_chunk_builder with text and tool-call rewrites, preserving stream
  order and detecting undeliverable tool rewrites.

  Incremental transform: run guardrail over accumulated text every round on
  the transform path (never mutating responses_so_far), report guardrailed
  text plus requested holdback per choice on a StreamTransformSink out-parameter,
  and handle stream_holdback_chars coercion. Provide get_streaming_scan_key
  to support shared scan key generation from streamed responses with tool-call
  fingerprints and stream-ended state.

  Tool merging: implement lossless merge of Responses namespace tools and
  custom tools by preserving original namespace structure while rebuilding
  member descriptions, handling indexed duplicate names (same key with ordinal),
  and reconstructing namespace members from flattened guardrail outputs. Supply
  merge_guardrailed_tools entry point that takes original tools, flattened
  groupings, and guardrailed tools, and returns the merged result ready for
  the wire.

  Anthropic SSE: provide SSE parsing and ModelResponse reconstruction, stream
  type detection using event types, raw stream joining with UTF-8 handling,
  message-start extraction for model and id restoration, and error-frame
  generation for post-header failures. Supply is_anthropic_sse_stream to
  distinguish Anthropic SSE from other raw streams (like Google's
  streamGenerateContent). Support both restore_identity off (default, keep
  wire shape) and on (stamp message id and model) for assembled responses.

