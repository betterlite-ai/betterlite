pitfalls:
  - >-
    _process_streaming_transform returns None; it never returns responses_so_far. The
    dispatcher process_output_streaming_response is what returns the accumulator after
    calling _process_streaming_transform. The transform path writes results out of band
    through the sink out-parameter only.
  - >-
    stream_transform_sink is mutable and its fields (mutated_text_per_choice,
    holdback_per_choice) are dicts keyed by choice index; empty dicts are valid
    and signal no text/holdback for that choice.
  - >-
    get_streaming_scan_key examines all chunks in responses_so_far, not just
    ModelResponseStream items; filtering to chunks is necessary for consistent state.
  - >-
    _indexed_keys requires stable ordering of tools by key; tuple(map(...)) preserves
    input order so enumerate(indices) in the merge logic maps back correctly.
  - >-
    _rebuilt_member compares flattened_function fields, not top-level function key;
    the function object is nested under tool.get("function") for chat tools only.
  - >-
    merge_guardrailed_tools uses frozenset(flattened_keys) to track ownership; tools
    with keys not in that set are appended as new, not merged into namespaces.
  - >-
    is_anthropic_sse_stream requires actual event type presence in parsed events; checking
    only frozenset membership is insufficient to distinguish from other SSE protocols.
  - >-
    assemble_anthropic_sse_stream depends on AnthropicPassthroughLoggingHandler which
    is a private import; if that handler changes, raw SSE reassembly may break.
  - >-
    model_response_text joins only text content (strings), skipping image and tool-call
    blocks; an all-image response returns empty string.
  - >-
    anthropic_sse_error_frames embeds the message in a JSON string field; message must
    be sanitized by the caller to avoid injection.

