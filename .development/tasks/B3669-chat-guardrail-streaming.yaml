deviations:
  - what: Streaming text accumulation never mutates the caller's responses list on the transform path, whereas LiteLLM's implementation reuses the same responses object.
    why: betterlite separates raw accumulation (for stream replay) from transform state, so the transform sink receives computed values independently.
  - what: Holdback coercion handles stream_holdback_chars as-is and does not validate against text length or enforce holdback positions, unlike some guardrail implementations.
    why: Stream position tracking is delegated to the client that consumes the sink; betterlite reports holdback without assuming client buffering strategy.
  - what: Tool merging does not dynamically import or resolve function schemas; original tool objects are preserved structurally and guardrailed members are validated only against Pydantic BaseModel.
    why: Schema resolution is delegated to the guardrail and the client; merging only reconstructs structure without introspection.

