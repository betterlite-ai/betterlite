id: B3791
title: Prompt Security file sanitization
description: >-
  Implement the Prompt Security file sanitization integration for betterlite:
  image and document upload, polling for completion, content replacement, and
  header/log redaction. Sanitize standalone data URLs embedded in requests and
  multimodal content within structured messages. Config keys:
  `file_sanitization_timeout` (defaults to 30 seconds),
  `file_sanitization_fail_open` (defaults to true),
  `block_on_file_modify` (defaults to true). Environment variables:
  `PROMPT_SECURITY_API_KEY` (required, no default),
  `PROMPT_SECURITY_API_BASE` (required, no default). HTTP upload and poll
  endpoints timeout at 30 seconds by default and fail open on timeout when
  fail_open is true, distinct from exhausted polling retries that raise 408.
  Sanitization wraps base64 content and binary files; modified images and
  documents are re-encoded and replaced in the request. API key is redacted
  from debug logs via _redact_headers.

scope:
  paths:
    - Cargo.toml
    - crates/betterlite-guardrails/**
    - tools/oracle/cases/prompt_security_files/**
  lint_tables: false

