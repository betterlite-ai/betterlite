oracle_cases: []
deviations:
  - what: "HTTP timeout for upload and poll requests uses self.timeout from the CustomGuardrail base class when set; requests default to client timeout if not overridden."
    why: "File upload and polling require completion guarantees within the configured timeout window. betterlite inherits CustomGuardrail's timeout field for consistency with other guardrails."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/prompt_security/prompt_security.py#L465-L592"
  - what: "When file_sanitization_fail_open is true (default), timeout or exception in sanitize_file_content returns a fail_open_result with action='allow' and content=None, distinct from exhausted polling which raises HTTPException(408)."
    why: "A timeout after valid polling responses are received indicates the polling window expired, which is a retriable client error (408). A timeout before polling completes is treated as vendor unavailability and fails open to preserve availability."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/prompt_security/prompt_security.py#L465-L501"
  - what: "block_on_file_modify defaults to true, so 'modify' action sanitization results raise HTTPException(400) unless explicitly disabled in config."
    why: "File modification indicates content redaction was applied; the default is to block rather than silently return modified content, consistent with LiteLLM's block-first guardrail pattern."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/prompt_security/prompt_security.py#L594-L603"

out_of_scope:
  - "CustomGuardrail base class, @log_guardrail_information decorator, and config initialization: owned by the guardrail framework."
  - "httpxSpecialProvider and get_async_httpx_client: owned by the HTTP client crate."
  - "get_config_model and get_supported_event_hooks implementations for config model discovery: owned by the guardrail framework."
  - "verbose_proxy_logger and debug logging infrastructure: owned by the logging layer."
  - "message_slot_texts and message_with_slot_texts from message translation utilities: owned by the guardrail framework."
  - "Protection verdict and request/response guardrail apply_guardrail calls: owned by B3792 (Prompt Security conversation protection)."

pitfalls:
  - "APP-ID header is the Prompt Security vendor API key; it must be redacted in all debug logs via _redact_headers to prevent key leakage."
  - "_SANITIZE_FILE_QUEUED_STATUSES = {'created', 'in progress'}; any other status value raises HTTPException(500), not 408 timeout."
  - "sanitize_file_content wraps _sanitize_file_content timeout but HTTP client timeout is inherited from CustomGuardrail.timeout; two separate timeout windows apply."
  - "Missing jobId from upload response raises 500, not 408, because the upload itself succeeded but the response was malformed."
  - "Exhausted polling after max_poll_attempts iterations raises HTTPException(408) with 'File sanitization timeout', distinct from asyncio.TimeoutError in the wrapper which returns fail_open_result."
  - "_process_image_url_item and _process_document_item catch HTTPException and re-raise it; other exceptions are caught and re-raised as HTTPException(500) with the exception message."
  - "Image and document content is re-encoded with base64.b64encode().decode() after sanitization; sanitized_content may be bytes or string and must be handled accordingly."
  - "Document MIME type inference defaults to application/pdf when mime_type is absent; extension matching checks for 'pdf', 'word', 'docx', 'excel', 'xlsx' substrings."
  - "process_message_files returns a new list of messages with modified content; original message structure (role, content type) is preserved, only content URLs/data are replaced."
  - "X-LiteLLM-Key-Alias header is included in both upload and poll requests when user_api_key_alias is present; it is not redacted in logs."

