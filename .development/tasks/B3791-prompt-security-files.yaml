    proof: [missing-jobid-cases]
  - text: "_sanitize_file_content polls {api_base}/api/sanitizeFile up to max_poll_attempts (30) with poll_interval (2 seconds) between attempts, returning result when status='done'."
    proof: [polling-cases]
  - text: "_sanitize_file_content raises HTTPException(500) with 'Unexpected sanitization status: {status}' when poll response status is neither 'done' nor in _SANITIZE_FILE_QUEUED_STATUSES (created/in progress)."
    proof: [unexpected-status-cases]
  - text: "_sanitize_file_content raises HTTPException(408) with 'File sanitization timeout' when max_poll_attempts is exhausted without receiving 'done' status."
    proof: [poll-exhausted-timeout-cases]
  - text: "_raise_if_file_blocked checks action against 'block' and 'modify' with block_on_file_modify flag, raises HTTPException(400) with {resource_name} blocked message and violations list when condition is met."
