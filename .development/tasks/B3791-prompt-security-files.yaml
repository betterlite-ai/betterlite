  - text: "_process_document_item detects data: URL or base64-encoded document field, decodes content, infers extension from mime_type (defaults to application/pdf), calls sanitize_file_content, calls _raise_if_file_blocked, re-encodes and replaces data or url field on modify."
    proof: [document-item-cases]
  - text: "_process_document_item raises HTTPException(500) with 'Document sanitization failed: {exception}' when base64 operations or content replacement fails."
    proof: [document-exception-cases]
  - text: "process_message_files iterates message content list, applies _process_image_url_item for type='image_url' items, applies _process_document_item for type='document' or type='file' items, returns modified messages."
