  - text: "sanitize_file_content wraps _sanitize_file_content with asyncio.wait_for using self.file_sanitization_timeout, catches TimeoutError/httpx.TimeoutException/LiteLLMTimeout, raises HTTPException(408) when fail_open is false, returns fail_open_result with action='allow' and content=None when fail_open is true (default)."
    proof: [timeout-wrapper-cases]
  - text: "_sanitize_file_content uploads file with POST to {api_base}/api/sanitizeFile, builds headers with APP-ID={api_key} and X-LiteLLM-Key-Alias when present, parses jobId from upload response, polls with GET and jobId param."
