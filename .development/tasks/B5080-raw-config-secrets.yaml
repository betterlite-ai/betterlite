id: B5080
title: Keep raw config secrets in SecretString
description: >-
  Five config fields still hold a real secret in a plain String inside a Debug type, so a Debug print of the raw config shows the key. Type each one secrecy::SecretString from the moment serde reads it, and delete the three ignore entries in .ast-grep/rules/no-plain-secret-fields.yml that let them through. LiteLLM's values and lookups stay the same; only the Rust type changes.


  The fields are RawParams.api_key (crates/betterlite-config/src/raw.rs L36, litellm_params.api_key of every model_list entry), RawGeneral.master_key (raw.rs L53, general_settings.master_key), redis_credentials RawSettings.azure_redis_ad_token (sections/redis_credentials.rs L26, litellm_settings.cache_params.azure_redis_ad_token) and resource_sdk_settings RawSettings.api_key (sections/resource_sdk_settings.rs L19, litellm_settings.api_key). The same resource_sdk_settings struct holds openai_key and azure_key as plain Strings too; the ast-grep regex misses those names, but they are the same kind of secret, so type them SecretString in this task as well.


  The readers change with them. loader.rs convert_params (L172) and convert_general (L211) call resolve_secret on the raw Option<String>. Add a resolve.rs function that takes Option<SecretString>, exposes the text only to strip the os.environ/ prefix through resolve_string, and returns Option<SecretString> with the same ConfigError::MissingEnvironment path; use it at those two call sites and in resource_sdk_settings RawSettings::convert for api_key, openai_key and azure_key. Keep resolve_secret for its other callers. sections/redis_credentials/provider.rs azure_ad_token_enabled reads azure_redis_ad_token as a flag: LiteLLM turns Azure AD auth on only when the configured value, or REDIS_AZURE_AD_TOKEN when the configured value is missing or empty, equals "true" in any case. Keep that exactly, reading the text through expose_secret.


  Write three Debug tests that fail today. raw::tests::raw_config_debug_hides_secrets parses a config with litellm_params.api_key and general_settings.master_key set to marker strings and asserts the Debug output of the raw config contains neither marker. sections::redis_credentials::tests::raw_settings_debug_hides_azure_ad_token and sections::resource_sdk_settings::tests::raw_settings_debug_hides_keys do the same for their raw structs. The existing loader, os.environ/ and Azure flag tests must keep passing unchanged.
scope:
  paths:
  - .ast-grep/rules/no-plain-secret-fields.yml
  - crates/betterlite-config/src/raw.rs
  - crates/betterlite-config/src/raw/**
  - crates/betterlite-config/src/loader.rs
  - crates/betterlite-config/src/resolve.rs
  - crates/betterlite-config/src/sections/redis_credentials.rs
  - crates/betterlite-config/src/sections/redis_credentials/**
  - crates/betterlite-config/src/sections/resource_sdk_settings.rs
  - crates/betterlite-config/src/sections/resource_sdk_settings/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L322-L325
  why: litellm_params.api_key is a plain optional string credential on every deployment.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6696-L6703
  why: general_settings.master_key falls back to LITELLM_MASTER_KEY and resolves os.environ/ references before hashing.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L585-L588
  why: azure_redis_ad_token or REDIS_AZURE_AD_TOKEN enables Azure AD auth only when its text is "true".
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L276-L283
  why: litellm_settings.api_key, openai_key and azure_key become module-level SDK credentials.
- url: https://docs.rs/secrecy/latest/secrecy/type.SecretString.html
  why: SecretString deserializes from a string and redacts itself in Debug.
dod:
- text: The raw model_list api_key and general_settings master_key never show in Debug output of the raw config.
  proof:
  - raw-debug
- text: The raw cache_params azure_redis_ad_token never shows in Debug output of the redis raw settings.
  proof:
  - redis-debug
- text: The raw litellm_settings api_key, openai_key and azure_key never show in Debug output of the SDK raw settings.
  proof:
  - sdk-debug
- text: The three config ignore entries are gone from the ast-grep rule, so the shared hooks check now scans these files.
  proof:
  - ignores-removed
checks:
  optional:
  - mutants
  commands:
  - id: raw-debug
    why: the raw config Debug test is missing or a raw secret still prints
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^raw::tests::raw_config_debug_hides_secrets$/)'
  - id: redis-debug
    why: the redis raw settings Debug test is missing or the Azure AD token still prints
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::redis_credentials::tests::raw_settings_debug_hides_azure_ad_token$/)'
  - id: sdk-debug
    why: the SDK raw settings Debug test is missing or a key still prints
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::resource_sdk_settings::tests::raw_settings_debug_hides_keys$/)'
  - id: ignores-removed
    why: an ignore entry for a fixed config file is still in the ast-grep rule
    run: "! grep -qE 'betterlite-config/src/(raw|sections/redis_credentials|sections/resource_sdk_settings)[.]rs' .ast-grep/rules/no-plain-secret-fields.yml"
oracle_cases: []
deviations: []
out_of_scope:
- The other ast-grep ignores (team_rows/archived.rs, cloudzero/records.rs, focus_records/transformer.rs, trace_types.rs) belong to the tasks that own those crates.
- Typed config fields in types.rs already hold SecretString; this task changes only the raw serde structs and their readers.
- Other plain secret Strings outside betterlite-config are not part of this task.
pitfalls:
- loader.rs is exactly 300 lines, the file_size limit, so put the new SecretString resolver in resolve.rs and make the loader lines shorter, never longer.
- LiteLLM's empty azure_redis_ad_token falls through to REDIS_AZURE_AD_TOKEN because Python's `or` treats "" as false, so the empty check must run on the exposed text before the environment fallback.
- The old resolve_secret has ten other callers, so keep its signature and make its body a call into the new resolver; two near copies would fail the shared similarity check.
- SecretString's Debug prints a redaction marker, so a test that checks only for "REDACTED" passes even when another field leaks; assert the marker string is absent.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
