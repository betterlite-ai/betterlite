    why: Complete FocusExportEngine class with __init__, _init_serializer, export_all, export_window, _serialize_and_upload, _build_filename, _sum_column, _count_unique.
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/destinations/factory.py#L15-L84"
