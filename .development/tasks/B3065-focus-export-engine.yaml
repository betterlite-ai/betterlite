id: B3065
title: Compose FOCUS export destinations and execution
description: >-
  Build destination selection and the FOCUS query/transform/serialize/upload engine in betterlite-logging::finops::focus.
  The FocusDestinationFactory creates destination instances based on provider name and resolved configuration,
  with provider/config precedence: command-line overrides take priority over environment variables, which supply defaults.
  The FocusExportEngine fetches usage data through B3060's query interface, transforms it through B3061's transformer,
  serializes through B3061's serializers (CSV or Parquet), and delivers through the selected destination's deliver method.
  Preserve the lazy destination failures (exceptions during destination creation are raised, not deferred),
  empty-data skips (both export_all and export_window return silently when data or normalized data is empty),
  and filenames containing both UTC window start and end times in YYYYMMDDTHHMMSSz format.

  Configuration precedence per provider:
  S3: bucket_name (FOCUS_S3_BUCKET_NAME), region_name (FOCUS_S3_REGION_NAME), endpoint_url (FOCUS_S3_ENDPOINT_URL),
      aws_access_key_id (FOCUS_S3_ACCESS_KEY), aws_secret_access_key (FOCUS_S3_SECRET_KEY),
      aws_session_token (FOCUS_S3_SESSION_TOKEN).
  Vantage: api_key (VANTAGE_API_KEY), integration_token (VANTAGE_INTEGRATION_TOKEN),
           base_url (VANTAGE_BASE_URL, defaults to https://api.vantage.sh).
  GCS: bucket_name (FOCUS_GCS_BUCKET_NAME), service_account_json (FOCUS_GCS_PATH_SERVICE_ACCOUNT).
  Mavvrik: api_key (MAVVRIK_API_KEY), api_endpoint (MAVVRIK_API_ENDPOINT), connection_id (MAVVRIK_CONNECTION_ID).
  S3 and GCS require bucket_name; Vantage requires both api_key and integration_token; Mavvrik credentials are optional.
  The factory validates presence of required values before returning a destination instance.

  Export methods: export_all(limit) exports all available rows without time filtering;
  export_window(window, limit) exports rows within the window's start_time and end_time.
  Both return early if raw data or normalized data is empty.
  Filename format: usage_<start_utc>_<end_utc>.<extension>.
