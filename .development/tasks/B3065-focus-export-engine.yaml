    - crates/betterlite-logging/src/finops/focus.rs
    - crates/betterlite-logging/src/finops/focus/engine.rs
    - crates/betterlite-logging/src/finops/focus/destinations/factory.rs
    - crates/betterlite-logging/src/finops/focus/destinations.rs
    - crates/betterlite-logging/src/finops/focus/engine/**
    - crates/betterlite-logging/src/finops/focus/destinations/factory/**
  lint_tables: false
references:
