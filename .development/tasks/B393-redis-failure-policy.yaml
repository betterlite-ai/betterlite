id: B393
title: Routing Redis circuit and failure policy
description: 'Implement RedisFailurePolicy with closed/open/half-open generations, separate timeout streaks,
  explicit-cause classification and throttled warnings. Preserve the pinned env defaults through B002
  config injection; no globals or logging secrets. B360 uses this service around client operations, while
  general response-cache integration stays B126. Config reads REDIS_CIRCUIT_BREAKER_ENABLED=true, REDIS_CIRCUIT_BREAKER_FAILURE_THRESHOLD=5,
  REDIS_CIRCUIT_BREAKER_RECOVERY_TIMEOUT=60, REDIS_CIRCUIT_BREAKER_TIMEOUT_MIN_DURATION=5.0 and REDIS_TIMEOUT_LOG_INTERVAL=5.0.
  Enabled compares lowercased text to true; preserve timeout streak duration and half-open behavior. Configuration
  boundary keys introduced or consumed here: REDIS_CIRCUIT_BREAKER_ENABLED, REDIS_CIRCUIT_BREAKER_FAILURE_THRESHOLD,
  REDIS_CIRCUIT_BREAKER_RECOVERY_TIMEOUT, REDIS_CIRCUIT_BREAKER_TIMEOUT_MIN_DURATION, REDIS_TIMEOUT_LOG_INTERVAL.
  Implement the owned native service in crates/betterlite-router/src/redis_failure_policy.rs. Add ProbeOperation::RedisFailurePolicy
  in tools/oracle/src/router_probes/mod.rs and the corresponding B393 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/caching/redis_cache.py:
  RedisCircuitBreaker.__init__ (L188-L206), RedisCircuitBreaker.generation (L209-L211), RedisCircuitBreaker.is_open
  (L213-L227), RedisCircuitBreaker._should_open (L229-L236), RedisCircuitBreaker.record_failure (L238-L262),
  RedisCircuitBreaker.record_success (L264-L273), RedisCircuitBreaker._set_state (L275-L281), _redis_health_error_types
  (L318-L333), _is_redis_health_failure (L336-L341), _redis_timeout_error_types (L345-L356), _explicit_causes
  (L362-L368), is_redis_timeout_failure (L371-L378), _record_swallowed_redis_failure (L434-L446), _RedisTimeoutLogThrottle.__init__
  (L456-L461), _RedisTimeoutLogThrottle.admit (L463-L473), log_redis_failure (L479-L504), _enter_circuit_breaker
  (L513-L517), _exit_circuit_breaker (L520-L533), _run_under_circuit_breaker (L536-L554), _run_under_circuit_breaker_sync
  (L557-L571), _redis_circuit_breaker_guard (L574-L593), _redis_circuit_breaker_guard.wrapper (L588-L591),
  _redis_circuit_breaker_guard_sync (L596-L601). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
