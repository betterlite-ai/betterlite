id: B101
title: Prove the passthrough SDK call's errors, block and header rules over HTTP
description: >-
  B101's parts build LiteLLM's `allm_passthrough_route` and everything around it: B8690 the SDK call, B3572 the stream relay, B8691 the router executor, B8692 the route choice, B8693 the reply shaping and exception mapping, and B8694 the proxy pipeline that runs them for route type `allm_passthrough_route`. None of them could run an HTTP case at its own gate, and each one points at B8640 for that. B8640's cases only reach configured pass-through endpoints and the config routes, so they never touch this call. B8609 mounts the `/vllm` and `/gigachat` routes and takes over B3627's router-model cases, but those only cover a 200 answer. Nothing proves over HTTP what a client sees when the upstream fails, when the model is blocked, or which caller headers reach the upstream. This task adds those cases. It writes no Rust: the code already exists in the parts, and the cases prove it through the booted proxy.


  Where. Seven HTTP cases in tools/oracle/cases/server/passthrough-sdk-call/, one file each, with these names and `name` fields that repeat the file name with a `passthrough-sdk-call-` prefix. Every case sends `authorization: Bearer oracle-master` and `content-type: application/json`, and a fixed `x-litellm-call-id` so the call id header is comparable. Every config sets `router_settings: {num_retries: 0}`, so a failed upstream gets exactly one request and the request counts match.


  Two configs. The GigaChat cases use one deployment, `model_name: gigachat-oracle` with litellm_params `{model: gigachat/GigaChat-2, api_base: "{{upstream}}"}` and `model_info: {id: oracle-gigachat-1}`, and env `GIGACHAT_ACCESS_TOKEN: oracle-gigachat-token`. With that env value LiteLLM's get_access_token returns the token at once and makes no OAuth call, so the mock gets only the provider request. A request to `/gigachat/chat/completions` with `model: gigachat-oracle` takes the router-model branch (handle_gigachat_passthrough_router_model), which runs base_passthrough_process_llm_request and so the whole pipeline: pre-call, route choice, the router hop, the SDK call, reply shaping and _handle_llm_api_exception. The VLLM cases use `model_name: vllm-oracle` with litellm_params `{model: hosted_vllm/oracle-model, api_base: "{{upstream}}", api_key: oracle-vllm-key}`. Their requests go to `/vllm/v1/chat/completions` with `model: vllm-oracle`, and that route calls the router's allm_passthrough_route directly with the caller's headers and query parameters.


  The cases.

  1. gigachat-upstream-400.yaml. Body `{model: gigachat-oracle, messages: [{role: user, content: hi}]}`. The mock answers 400 with content-type application/json and body `{status: 400, message: "Invalid params: temperature"}`. allm_passthrough_route rethrows httpx.HTTPStatusError unchanged (passthrough/main.py L351-L354), and _handle_llm_api_exception turns it into an HTTPException with the upstream status and detail `{"error": <the upstream body decoded as UTF-8 text>}` (common_request_processing.py L3709-L3721). The client gets 400 with body `{"detail": {"error": "..."}}`. Compare headers content-type, x-litellm-call-id, x-litellm-model-id and llm_provider-content-type (the upstream headers come back with the llm_provider- prefix from get_response_headers), and upstream headers authorization, content-type and accept (GigaChat's validate_environment sets all three).

  2. gigachat-upstream-503-text.yaml. The same request; the mock answers 503 with content-type text/plain and the string body `upstream overloaded`. The client gets 503 and `{"detail": {"error": "upstream overloaded"}}`: the text is put in as it is, never parsed as JSON. Compare the same headers as case 1.

  3. gigachat-stream-upstream-429.yaml. The body adds `stream: true`. The mock answers 429 with content-type application/json, `retry-after: "7"`, `x-ratelimit-remaining-requests: "0"` and body `{status: 429, message: "Too many requests"}`. GigaChat's is_streaming_request reads `stream` from the json, so the call sends with stream=True, and the stream wrapper checks the status before the first chunk, reads the body and raises (passthrough/main.py L107-L129). The client gets a 429 JSON error with the same detail shape as case 1, never an event stream. Compare headers content-type, x-litellm-call-id, llm_provider-retry-after, llm_provider-x-ratelimit-remaining-requests and x-ratelimit-remaining-requests (get_response_headers copies the four x-ratelimit- names without a prefix too). No retry-after header without the prefix: _apply_router_cooldown_retry_after adds one only for a RouterRateLimitError.

  4. gigachat-stream-relay.yaml. The body adds `stream: true`; the mock answers 200 with content-type text/event-stream, `x-request-id: gc-oracle-1` and two events, a GigaChat chunk `{"choices":[{"delta":{"role":"assistant","content":"Hi"},"index":0}],"created":1700000000,"model":"GigaChat-2","object":"chat.completion"}` and `[DONE]`. The client gets 200 with the upstream bytes unchanged. Compare headers content-type, x-request-id and x-litellm-call-id. This is the one success case here, kept because B8609's GigaChat cases send no stream.

  5. gigachat-blocked-model.yaml. The deployment's model_info is `{id: oracle-gigachat-1, blocked: true}`. Router.get_model_names still lists a blocked model, so the route takes the router-model branch, and route_request's _raise_if_model_fully_blocked (route_llm_request.py L58-L73, L545-L546) raises PermissionDeniedError "Model is blocked". The client gets 403 with LiteLLM's error envelope and `upstream: []`; the mock must see no request. Compare headers content-type and x-litellm-call-id.

  6. vllm-xpass-protected.yaml. Body `{model: vllm-oracle, messages: [{role: user, content: hi}]}` with request headers `x-pass-x-oracle-tag: tag-1`, `x-pass-authorization: Bearer client-secret`, `x-pass-x-api-key: client-key` and `x-pass-x-amz-date: 20260101T000000Z`. The mock answers 200 JSON. forward_headers_from_request runs with forward_headers false (passthrough/utils.py L58-L103), so only x-pass- headers reach the upstream, with the prefix cut off, and the protected names are skipped. The upstream gets `x-oracle-tag: tag-1` and none of authorization, x-api-key or x-amz-date. Compare upstream headers x-oracle-tag, authorization, x-api-key and x-amz-date, so a value on either side fails the case.

  7. vllm-query-and-model.yaml. Path `/vllm/v1/chat/completions?oracle_tag=q1`, the same body. The mock answers 200 JSON. The upstream request target keeps `?oracle_tag=q1` (VLLM's get_complete_url passes the request query params to format_url), the upstream body's `model` is `oracle-model` (the resolved model, with the hosted_vllm/ prefix and the gateway name both gone), and the upstream gets no x-api-key although the deployment has api_key oracle-vllm-key, since VLLM's get_api_key always returns None (vllm/common_utils.py L55-L57). Compare upstream headers x-api-key and authorization.


  When a case fails against betterlite, the bug is in a part's module, not here: say in the report which case failed, the difference the oracle printed and the task that owns the code (B8690 for the request it builds, B3572 for the stream status check, B8692 for the block, B8693 for the error body and headers, B8694 for the pipeline), and change nothing outside the case folder.


  Size. Seven cases of about 30 lines each, about 210 lines. The task reimplements no LiteLLM function body; the LiteLLM code it proves is listed in references.
scope:
  paths:
    - tools/oracle/cases/server/passthrough-sdk-call/**
  lint_tables: false
