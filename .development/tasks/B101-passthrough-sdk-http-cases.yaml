    why: allm_passthrough_route; an httpx.HTTPStatusError leaves it unchanged (L351-L354), so the proxy sees the upstream status and body.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/main.py#L107-L129
    why: The stream wrapper raises on a 4xx or 5xx before the first chunk, after reading the body; case 3.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/main.py#L604-L633
    why: _async_passthrough_request reads a non-streaming body and raises for its status; cases 1 and 2.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/utils.py#L11-L28
    why: The protected header names and the x-amz- prefix that an x-pass- header may not set; case 6.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/utils.py#L58-L103
    why: forward_headers_from_request with forward_headers false forwards only x-pass- headers, prefix cut off; case 6.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L3074-L3109
    why: base_passthrough_process_llm_request runs the common pipeline with route type allm_passthrough_route.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L3650-L3721
    why: The failure headers (custom headers over the llm_provider- copy of the upstream headers, unsafe names dropped) and the HTTPStatusError branch that answers detail {"error" text}; cases 1 to 3.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/get_headers.py#L5-L49
    why: get_response_headers prefixes every upstream header with llm_provider- and copies the four x-ratelimit- names as they are; case 3.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L58-L73
    why: _raise_if_model_fully_blocked and its PermissionDeniedError "Model is blocked"; case 5.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L545-L546
    why: The block check runs first whenever a router exists.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11757-L11763
    why: A model is fully blocked when every deployment has model_info.blocked true.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L3801-L3861
    why: The /gigachat route and its router-model check.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L3894-L4022
    why: handle_gigachat_passthrough_router_model, the record it builds, its pooled client and the exception handling around the pipeline.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L481-L540
    why: The /vllm route calls the router directly with the request headers, the query params and the json body.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/passthrough/transformation.py#L24-L69
    why: GigaChat's passthrough config, its streaming flag from the json and the three headers validate_environment sets.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/authenticator.py#L64-L88
    why: GIGACHAT_ACCESS_TOKEN returns the token without an OAuth call, so the mock sees only the provider request.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vllm/common_utils.py#L31-L57
    why: VLLM sets x-api-key only from the api key get_api_key returns, and get_api_key always returns None; case 7.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vllm/passthrough/transformation.py#L11-L32
    why: VLLM's URL keeps the request query params; case 7.
dod:
  - text: An upstream 4xx or 5xx on the GigaChat router-model path answers the upstream status with detail {"error" text} and LiteLLM's failure headers, for a JSON body, a text body and a streaming request.
    proof: [sdk-call-cases, oracle]
  - text: A streaming GigaChat router-model call relays the upstream events and headers as LiteLLM does.
    proof: [sdk-call-cases, oracle]
  - text: A model whose deployments are all blocked answers 403 and sends nothing upstream.
    proof: [sdk-call-cases, oracle]
  - text: On the VLLM router-model path only x-pass- headers reach the upstream, protected names never do, the query string is kept and the model is the resolved one.
    proof: [sdk-call-cases, oracle]
checks:
  optional: []
  commands:
    - id: sdk-call-cases
      why: the passthrough SDK call's error, block or header cases are missing on this branch
      run: test "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/server/passthrough-sdk-call | wc -l)" -ge 7
oracle_cases:
  - tools/oracle/cases/server/passthrough-sdk-call/gigachat-upstream-400.yaml
  - tools/oracle/cases/server/passthrough-sdk-call/gigachat-upstream-503-text.yaml
  - tools/oracle/cases/server/passthrough-sdk-call/gigachat-stream-upstream-429.yaml
  - tools/oracle/cases/server/passthrough-sdk-call/gigachat-stream-relay.yaml
  - tools/oracle/cases/server/passthrough-sdk-call/gigachat-blocked-model.yaml
  - tools/oracle/cases/server/passthrough-sdk-call/vllm-xpass-protected.yaml
  - tools/oracle/cases/server/passthrough-sdk-call/vllm-query-and-model.yaml
deviations: []
out_of_scope:
  - "AsyncPassthroughStreamingResponse, PassthroughStreamingResponse, _SpendCollection, _as_async_generator, _as_generator and _async_passthrough_request (passthrough/main.py L30-L265, L604-L633): B3572."
  - "allm_passthrough_route and llm_passthrough_route (passthrough/main.py L267-L601): B8690, which builds the async call and records the blocking path as a deviation."
  - "passthrough/__init__.py only re-exports allm_passthrough_route, llm_passthrough_route and BasePassthroughUtils: B8690 owns the Rust call, B3571 the utils, and B7890 the Python package's names."
  - "passthrough/README.md is documentation; B7890 and B161 cover it."
  - "llms/pass_through/__init__.py holds only a module docstring: B3574."
  - "The router executor and its RouterGeneric registration: B8691 and B8631. The route choice: B8692. Reply shaping and exception mapping: B8693. The pipeline and its ports: B8694. The /vllm and /gigachat mounts: B8609."
  - "An upstream error on the /vllm router-model branch: B3627 relays the upstream status and body where LiteLLM answers 500, and records that as its deviation, so no case here sends one."
pitfalls:
  - "The failure body is `{\"detail\": {\"error\": \"<text>\"}}` from an HTTPException, not LiteLLM's `{\"error\": {...}}` envelope; only the block in case 5 goes through ProxyException and its envelope."
  - "Leave `GIGACHAT_ACCESS_TOKEN` in every GigaChat case's env; without it get_access_token goes to the OAuth URL, which is not the mock, and the case hangs or fails on both sides."
  - "The gigachat route removes `api_base` and `api_key` from the record, so the mock's address has to come from the deployment's litellm_params, never from the request body."
  - "Keep `router_settings: {num_retries: 0}`; with retries the router sends the failing request again and the upstream request counts no longer match the one scripted answer."
  - "Case 7's deployment carries api_key on purpose: the point is that VLLM's get_api_key returns None, so no key header reaches the upstream."
  - "x-pass-x-amz-date is blocked by the x-amz- prefix rule, not by the name list; keep it in case 6 so both rules are proven."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
