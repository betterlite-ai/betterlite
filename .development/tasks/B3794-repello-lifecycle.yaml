id: B3794
title: Repello scan lifecycle and stream blocking
description: >-
  Build Argus scan requests and hook/error behavior, including buffering output before a streamed block.
  Preserve permanent configuration errors versus transient failures and `ARGUS_API_KEY` precedence over `REPELLOAI_API_KEY`.

  The Repello guardrail sends prompt and response text to the Argus API for scanning. Scan requests POST to either
  `{api_base}/analyze/prompt` or `{api_base}/analyze/response` with an `asset_id` and the text under `scan_data.prompt`
  or `scan_data.response`. Configuration is resolved with `ARGUS_API_KEY` taking precedence over `REPELLOAI_API_KEY`,
  and the default API base is `https://argusapi.repello.ai/sdk/v1`. The `asset_id` is required and raises at initialization
  if missing.

  A response with status in {400, 401, 403, 404, 422} signals a permanent misconfiguration (bad key, unknown asset,
  malformed payload), never a transient outage. These status codes always raise an HTTPException with status 500 and
  error type "repelloai_guardrail_is_misconfigured", regardless of the `unreachable_fallback` setting. Other HTTP
  errors are treated as transient: when `unreachable_fallback="fail_closed"` they raise an HTTPException with
  status 500 and error type "repelloai_guardrail_unreachable"; when `"fail_open"` they return None (allow-through).

  The response verdict is one of "blocked", "flagged", or "passed". Unrecognized verdicts cause the guardrail
  to block and log a warning. A block verdict raises HTTPException with status 400 and detail message built from
  the `policies_violated` list: each policy includes policy_name (mandatory), action_taken (optional) and
  details.score (optional). The message format is "Blocked by RepelloAI Argus guardrail. Policies violated:
  <policy_name> (action: <action>, score: <score>); ...". A flagged verdict is allowed but logged as a warning
  with the policies list.

  On pre_call, the hook extracts prompt text from the request, calls `_call_analyze` with stage="prompt",
  raises if blocked, and adds the guardrail name to the applied-guardrails header (U3). On post_call (non-streamed),
  the hook extracts response text, calls `_call_analyze` with stage="response", raises if blocked, and updates
  the applied-guardrails header. The event_hook configuration (a Mode or list of GuardrailEventHooks) is coerced
  in the __init__ file so the guardrail only runs at configured phases.

  On post_call_streaming_iterator_hook, the hook buffers every chunk from the input stream, assembles them with
  `stream_chunk_builder`, extracts response text, calls `_call_analyze` asynchronously, and raises `StreamingCallbackError`
  if blocked before yielding any chunk back. If the verdict is flagged, it logs a warning. If text extraction fails
  (e.g., the assembled response is not a ModelResponse), it logs a warning and yields every buffered chunk as-is.

  The timeout applies to each `_call_analyze` call and is injected at initialization. HTTP exceptions from the
  analyze call (invalid JSON response, request failures) are caught, logged with status/duration, and re-raised
  or converted to allow-through based on unreachable_fallback. The response is validated against
  `RepelloAIAnalyzeResponse` TypedDict; validation errors raise HTTPException with status 500 and
  error type "repelloai_guardrail_returned_invalid_json".

  The config model exposes api_key, api_base, asset_id, and unreachable_fallback as optional config fields, all
  resolved at initialization from the LitellmParams. The ui_friendly_name returns "RepelloAI Argus".

