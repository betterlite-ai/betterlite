deviations:
  - what: >-
      When ARGUS_API_KEY and REPELLOAI_API_KEY are both missing from environment and api_key parameter is None,
      betterlite raises RepelloAIGuardrailMissingSecrets, whereas LiteLLM calls get_secret_str("ARGUS_API_KEY")
      as a final fallback to consult its configured secret manager.
    why: Full secret-manager dispatch is unresolved (U4); betterlite uses only the env var lookup supplied by B002.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/repelloai/repelloai.py#L153

out_of_scope:
  - Guardrail decorator registration and CustomGuardrail.__init__; owned by B104 (U1).
  - add_guardrail_to_applied_guardrails_header; owned by B104 (U3).
  - get_secret_str and full secret-manager dispatch; owned by B129 (U4).
  - Content extraction helpers _extract_prompt_text, _extract_response_text, and all their nested functions; owned by B3793.
  - stream_chunk_builder and streaming response assembly; owned by B2227.
  - Framework method should_run_guardrail on CustomGuardrail; owned by B104 (U1).
  - Request/response routing and framework dispatch; those come from the guardrail lifecycle in B104.

pitfalls:
  - >-
      _call_analyze sets status in a try/except/finally chain; the finally block always runs even on exception.
      Do not initialize status inside the try, as it may not be defined on some paths. Status must be a local
      variable visible to the finally block.
  - >-
      _verdict_blocks returns true for unrecognized verdicts; do not silently return false or filter out
      unexpected responses. Log a warning when the verdict is not in the known set (blocked/flagged/passed).
  - >-
      HTTPException raised in the try block before repelloai_response assignment will not have repelloai_response
      converted to dict in the finally block. Check repelloai_response is not None before dict() conversion.
  - >-
      CONFIG_ERROR_STATUS_CODES (400/401/403/404/422) must always block regardless of unreachable_fallback setting.
      _raise_for_config_error raises before the try/except path, so it will not be caught as HTTPException
      and will not trigger the finally block logging.
  - >-
      Streaming hook must call stream_chunk_builder on the entire chunks list to assemble a complete response,
      not assume the assembled result is a ModelResponse. Check isinstance(assembled, ModelResponse) before
      calling _extract_response_text.
  - >-
      add_guardrail_to_applied_guardrails_header is called only when text is present and not blocked in the
      streaming hook. Do not call it in the error path or when no text is extracted.
  - >-
      The X-API-Key header must match the exact spelling and casing of the key name expected by Argus.
      Do not use different header names or auth schemes.
  - >-
      Argus expects a single text value under scan_data[stage], not a list or nested structure.
      Do not wrap the text in extra containers.

review_level: security

