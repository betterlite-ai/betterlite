dod:
  - text: >-
      __init__ accepts api_key, api_base, asset_id, unreachable_fallback (default fail_closed),
      guardrail_name, event_hook, default_on, and timeout parameters; resolves api_key to
      ARGUS_API_KEY env, then REPELLOAI_API_KEY env, raises RepelloAIGuardrailMissingSecrets
      if both are missing; validates asset_id is not empty and raises ValueError if missing.
    proof: [init-secrets-cases]
  - text: >-
      __init__ resolves api_base to api_base parameter, then REPELLOAI_API_BASE env var,
      then DEFAULT_REPELLOAI_API_BASE (https://argusapi.repello.ai/sdk/v1).
    proof: [init-api-base-cases]
  - text: >-
      __init__ normalizes unreachable_fallback: stores "fail_open" if input is "fail_open",
      otherwise stores "fail_closed".
    proof: [init-fallback-cases]
  - text: >-
      __init__ calls get_async_httpx_client with GuardrailCallback provider and timeout parameter,
      chains parent CustomGuardrail.__init__ with guardrail_name, event_hook, default_on,
      supported_event_hooks from get_supported_event_hooks, and timeout.
    proof: [init-handler-cases]
  - text: >-
      _call_analyze constructs endpoint {api_base}/analyze/{stage} where stage is "prompt" or "response",
      builds request with asset_id and scan_data: {stage: text}, POSTs with X-API-Key header,
      calls _raise_for_config_error on response, raises HTTPException 500 on non-200 status.
    proof: [api-call-cases]
  - text: >-
      _call_analyze parses response via TypeAdapter(RepelloAIAnalyzeResponse).validate_json,
      raises HTTPException 500 if validation fails, returns RepelloAIAnalyzeResponse on success.
    proof: [api-call-cases]
  - text: >-
      _call_analyze initializes status to "success", updates to "guardrail_intervened" if _verdict_blocks returns true;
      on HTTPException catches update status to "guardrail_failed_to_respond";
      on HTTPError catches update status to "guardrail_failed_to_respond";
      on other Exception catches update status to "guardrail_failed_to_respond";
      calls add_standard_logging_guardrail_information_to_request_data in finally block
      with guardrail_json_response dict-converted from response if not None, or str() of exception otherwise.
    proof: [verdict-classification-cases]
  - text: >-
      _raise_for_config_error raises HTTPException(500) with error detail if response status_code
      is in {400, 401, 403, 404, 422}.
    proof: [config-error-cases]
  - text: >-
      _verdict_blocks returns true if verdict == "blocked", false if verdict in ("passed", "flagged"),
      logs warning and returns true for unrecognized verdicts.
    proof: [verdict-classification-cases]
  - text: >-
      _handle_unreachable logs warning for HTTPError, raises HTTPException(500) if unreachable_fallback
      is "fail_closed", returns None if "fail_open".
    proof: [transient-error-cases]
  - text: >-
      _raise_if_blocked returns early if response is None, calls _verdict_blocks, raises HTTPException(400)
      with formatted detail if blocked, calls _log_flagged_verdict if not blocked.
    proof: [error-format-cases]
  - text: >-
      _format_blocked_detail extracts policies_violated list, iterates each policy extracting
      policy_name (default "unknown_policy"), action_taken (if present), score from details dict (if present),
      joins all policies with action/score suffix, returns formatted string or default message.
    proof: [error-format-cases]
  - text: >-
      _log_flagged_verdict checks verdict == "flagged" and logs warning with policies_violated if true.
    proof: [flagged-log-cases]
  - text: >-
      async_pre_call_hook calls should_run_guardrail with pre_call event, returns data unchanged
      if false, extracts prompt text via B3793 _extract_prompt_text, returns data if no text,
      calls _call_analyze with stage "prompt", calls _raise_if_blocked, calls
      add_guardrail_to_applied_guardrails_header, returns data.
    proof: [pre-call-hook-cases]
  - text: >-
      async_post_call_success_hook calls should_run_guardrail with post_call event, returns response
      unchanged if false, extracts response text via B3793 _extract_response_text, returns response if no text,
      calls _call_analyze with stage "response", calls _raise_if_blocked, calls
      add_guardrail_to_applied_guardrails_header, returns response.
    proof: [post-call-hook-cases]
  - text: >-
      async_post_call_streaming_iterator_hook calls should_run_guardrail with post_call event,
      yields all chunks and returns early if false; otherwise buffers all chunks via
      stream_chunk_builder from B2227, extracts response text if assembled is ModelResponse,
      calls _call_analyze if text present, raises StreamingCallbackError if _verdict_blocks returns true,
      calls add_guardrail_to_applied_guardrails_header if text present, yields all buffered chunks.
    proof: [streaming-hook-cases]
  - text: >-
      get_config_model returns RepelloAIGuardrailConfigModel class.
    proof: [config-model-cases]
  - text: >-
      _event_hook_from_mode returns input if already GuardrailEventHooks or Mode,
      converts list of strings to list of GuardrailEventHooks via GuardrailEventHooks(item),
      converts single string to GuardrailEventHooks.
    proof: [event-hook-cases]
  - text: >-
      initialize_guardrail instantiates RepelloAIGuardrail with guardrail_name, api_key/api_base/asset_id/
      unreachable_fallback/timeout from litellm_params, converts mode via _event_hook_from_mode,
      calls litellm.logging_callback_manager.add_litellm_callback with instance, returns instance.
    proof: [initialize-cases]

