dod:
- text: >-
    is_explicit_keepalive_disable is true for 0, -1, "0", " -2.5 " and "-inf", and false for 5, "5", "abc", "nan", null and a missing value.
  proof: [keepalive-tests, oracle, helper-python]
- text: >-
    deployment_keepalive returns None without a router and for a model_id the router no longer knows, reads a known deployment's
    keepalive_seconds and override flag, and without a model_id returns the shared pair only when every deployment of the group agrees.
  proof: [keepalive-tests]
- text: >-
    resolve_keepalive_seconds returns 0 for a deployment's explicit disable even when an allowed client sends a positive value,
    uses the client value only when the deployment allows it, falls back to the deployment value and then the global setting,
    returns 0 for zero, negative and unparsable values, and clamps to 1.0..=300.0 with NaN giving 1.0 and infinity giving 300.0.
  proof: [keepalive-tests]
- text: >-
    KeepaliveResolver serves a repeated model_id from its memo for under five seconds, resolves again after five seconds or for a
    different id, and always resolves fresh for a chunk without a model_id.
  proof: [keepalive-tests]
- text: >-
    with_keepalive forwards items without a timer while the interval is 0, yields Ping after each quiet interval without losing
    the pending item, re-resolves the interval after every real item (turning heartbeats on or off mid-stream), and ends when the items end.
  proof: [keepalive-tests]
checks:
  optional: []
  commands:
  - id: keepalive-tests
    why: the disable rule, the deployment lookup, the resolve order, the clamp, the memo or the heartbeat wrapper is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^stream_keepalive::/)'
  - id: helper-python
    why: the explicit disable rule has no pinned LiteLLM comparison through the b8603 helper
    run: grep -qE '^[[:space:]]+b8603:' tools/oracle/fuzz/corpus/helper_case/b8603-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/stream-keepalive/explicit-disable-values.yaml
- tools/oracle/cases/helpers/stream-keepalive/not-a-disable.yaml
deviations:
- what: The router and the global interval reach this module through the KeepaliveRouter trait and a constructor argument instead of the llm_router and litellm module globals.
  why: betterlite wires dependencies through constructors; the interval a client sees is the same.
out_of_scope:
- "async_data_generator (L9830-L10079), which starts the wrapper and writes `: ping` frames: B8604. The chunk shaping and SSE frame helpers (L9344-L9623): B8602."
- "coerce_keepalive_interval, ttft_keepalive_interval and the first-byte keepalive in common_request_processing.py and sse_keepalive.py: B7324 and B005. They decide the ping before the first upstream byte, while this module decides it between chunks."
- "Loading litellm_settings.sse_keepalive_ping_interval_seconds: the config section of B089 (assistant_keepalive) loads it, and the composition root passes its value here."
- "The rest of litellm/proxy/proxy_server.py: owners by area are listed in the proxy_server.py inventory head of B1216, B1125, B850, B848, B779, B899, B849 and B851."
pitfalls:
- 'A model_id the router no longer resolves returns None at once; it must not fall through to the group rule, because a sibling deployment never served this stream.'
- 'A deployment keepalive_seconds of 0 (or "0", "-1") disables heartbeats even when allow_client_keepalive_override is true and the client sends keepalive_seconds 5.'
- 'When the group of deployments disagrees, there is no deployment config at all, so the client value is ignored and the global sse_keepalive_ping_interval_seconds applies.'
- 'A deployment that leaves keepalive_seconds unset counts as its own value in the group rule, so one such deployment next to a configured one makes the group disagree.'
- 'An unparsable string such as "fast" resolves to 0 (off); it does not fall back to the deployment or global value.'
- 'f64::clamp keeps NaN; LiteLLM''s max(1.0, min(nan, 300.0)) gives 1.0, so write the comparison by hand.'
- 'A ping does not re-resolve the interval; only a real item does, and the memo is keyed only on a non-empty string model_id.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
