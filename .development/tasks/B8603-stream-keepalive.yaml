id: B8603
title: Stream keepalive heartbeats
description: >-
  Build the keepalive pieces of LiteLLM's proxy streaming generator (litellm/proxy/proxy_server.py L9626-L9827): the per-deployment interval lookup, the interval resolver with its short memo, and the stream wrapper that writes a heartbeat while the upstream is quiet. The SSE data generator (B8604) uses them; this task writes no SSE text itself. Everything goes in crates/betterlite-server, module `stream_keepalive` (stream_keepalive.rs and stream_keepalive/), with tests in stream_keepalive/tests.rs. Every name stays at 30 characters or fewer.

  Constants. `KEEPALIVE_MIN_SECONDS` is 1.0, `KEEPALIVE_MAX_SECONDS` is 300.0 and `KEEPALIVE_CACHE_TTL` is 5 seconds.

  Router port. The trait `KeepaliveRouter` stands for the two llm_router calls the code makes. `deployment_params(&self, model_id: &str) -> Option<Map<String, Value>>` replaces `llm_router.get_deployment(model_id=...)` and gives that deployment's litellm_params as a JSON object, or None when no deployment has that id. `group_deployments(&self, model_name: Option<&str>) -> Vec<Value>` replaces `llm_router.get_model_list(model_name=...)` and gives the deployment objects as JSON. The architect wires the real router behind it; tests use a fake.

  `DeploymentKeepalive { seconds: Option<Value>, allow_client_override: bool }` replaces _DeploymentKeepaliveConfig. `deployment_keepalive(router: Option<&dyn KeepaliveRouter>, request_data: &Map<String, Value>, hidden: &Map<String, Value>) -> Option<DeploymentKeepalive>` replaces _keepalive_from_deployment_config (L9690-L9732). `hidden` is the `_hidden_params` of the response or chunk. No router gives None. When `hidden["model_id"]` is a non-empty string, ask `deployment_params` for it: None gives None (the deployment was removed, so the stream does not borrow a sibling's policy), and a found deployment gives its `keepalive_seconds` (a missing key or JSON null is None) and `allow_client_override` true only when `allow_client_keepalive_override` is the JSON bool true. Without a model_id, list `group_deployments` for `request_data["model"]` (None when that is not a string) and build each deployment's pair of `litellm_params.keepalive_seconds` (missing or null counts as no value) and the override flag, where a missing or non-object `litellm_params` gives (no value, false). When exactly one distinct pair remains, return it; with zero or several, return None. Two numbers are the same value when they are equal as f64 (5 and 5.0 match), and a string never equals a number.

  `is_explicit_keepalive_disable(raw: Option<&Value>) -> bool` replaces _is_explicit_keepalive_disable (L9735-L9741). Only a JSON number or string can disable. A number disables when it is zero or below. A string is parsed like Python's float(): surrounding whitespace is ignored, and a sign, a decimal point, an exponent, single underscores between digits and the words inf, infinity and nan (any case) are accepted; it disables when the parsed value is zero or below, so "-inf" disables and "nan" does not. A string that does not parse does not disable. Put that parse in one function `parse_python_float(text: &str) -> Option<f64>` in this module and use it in both places below.

  `resolve_keepalive_seconds(router, request_data, hidden, global: Option<&PingSetting>) -> f64` replaces _resolve_keepalive_seconds (L9744-L9785). `PingSetting` is B7324's type in crates/betterlite-server/src/keepalive_interval.rs (`Seconds(f64)` or `Text(String)`), and `global` is LiteLLM's `litellm.sse_keepalive_ping_interval_seconds` (default none), which the caller passes in. Steps: look up `deployment_keepalive`; when its seconds value is an explicit disable, return 0.0. The client value is `request_data["keepalive_seconds"]` only when the deployment config exists and allows the override; a JSON null client value counts as absent. The raw value is the client value, else the deployment value, else the global value. A number gives itself, a string goes through parse_python_float (a failed parse returns 0.0), and anything else (absent, a bool, an object) gives 0.0. A value of zero or below returns 0.0. Otherwise clamp it into 1.0..=300.0 the way Python's `max(1.0, min(value, 300.0))` does: infinity gives 300.0 and NaN gives 1.0. When the clamped value differs from the value (NaN always differs), log at info "keepalive_seconds={value} clamped to {clamped} [min=1.0, max=300.0]".

  `KeepaliveResolver` replaces _make_keepalive_resolver (L9791-L9827) and its inner _resolve. It is built with the router (`Option<Arc<dyn KeepaliveRouter>>`), the request data (`Arc<Map<String, Value>>`) and the global setting, and has `resolve(&mut self, hidden: &Map<String, Value>) -> f64`. When `hidden["model_id"]` is a non-empty string equal to the last remembered id and less than KEEPALIVE_CACHE_TTL has passed since that id was resolved, return the remembered value without calling the router. Otherwise call resolve_keepalive_seconds, and when the model_id is a non-empty string remember the id, the value and the time. A chunk without a model_id always resolves fresh and does not touch the memo. Read the time from `tokio::time::Instant` so paused-clock tests control it.

  Wrapper. The trait `KeepaliveSource` has `fn hidden_params(&self) -> Option<&Map<String, Value>>`; the generator implements it for its items. `Beat<T>` is `Item(T)` or `Ping`. `with_keepalive(items, resolver, initial_seconds) -> impl Stream<Item = Beat<T>>` replaces _iter_with_keepalive (L9634-L9682); `items` is any `Stream<Item = T> + Send + 'static` with `T: KeepaliveSource`. While the current interval is 0 or below, forward each item as soon as it arrives with no timer. Otherwise wait for the next item for at most the interval: when the wait times out, yield `Ping` and wait again with the same interval; when an item arrives, yield it. After every real item, set the current interval to `resolver.resolve(hidden)` with the item's hidden params (an empty map when it has none). The stream ends when `items` ends. A timeout on `StreamExt::next()` is cancel safe, so no item is lost and no task is spawned; dropping the wrapper drops the pending wait. The first interval comes from the caller, which resolves it against the response's own hidden params.

  Tests use `tokio::time::pause` so no test sleeps, and a recording fake router that counts calls. Helper oracle cases compare is_explicit_keepalive_disable with LiteLLM through the operation named b8603; the rest reads the router and LiteLLM's module settings, so it is covered by Rust tests, and the wave 17 inference wiring part proves the heartbeat over HTTP.
