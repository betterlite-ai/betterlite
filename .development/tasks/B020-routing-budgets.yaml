id: B020
title: Budget-aware filtering and policy composition
description: Finish policy routing by filtering B016's eligible pool against B326 provider, deployment
  and tag budget state. Integrate the filter with tags, reserved access windows, routing groups and affinity
  using the pinned phase ordering. Connect remaining-budget observations to B012 without implementing
  exporters. Enable MIT tag-budget logic without a paid-tier check, as the project decision requires;
  use component probes on the MIT filter for parity instead of asserting the proprietary gate. Preserve
  the pinned read-failure and zero-budget behavior unless the architect approves the stricter policy noted
  in pitfalls. Use the existing Rust crate boundaries from B004 and B008; integrate through the server
  when the provider dispatcher or callbacks live in another core crate. This task's source slices are
  the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target
  and committed corpus for every newly accepted config form; unsupported keys still fail by full path.
  Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle cases are
  budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/routing-budgets/**
  - tools/oracle/src/router_probes/routing_budgets/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/routing_budgets.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L130-L288
  why: Budget filter boundaries and cache-miss behavior.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L697-L793
  why: Provider/tag lookup and remaining-budget observations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L915-L935
  why: MIT tag initialization contains a paid-tier gate to omit.
dod:
- text: Every listed case compares production behavior against pinned LiteLLM; any declared difference
    asserts exact reference and Rust outcomes through B361 instead of ignoring the difference.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the routing_budgets prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(routing_budgets)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/routing-budgets/provider-budget-at-limit.yaml
- tools/oracle/cases/routing/routing-budgets/deployment-budget-at-limit.yaml
- tools/oracle/cases/routing/routing-budgets/tag-budget-filter.yaml
- tools/oracle/cases/routing/routing-budgets/zero-budget-truthiness.yaml
- tools/oracle/cases/routing/routing-budgets/missing-spend.yaml
- tools/oracle/cases/routing/routing-budgets/shared-read-unavailable.yaml
- tools/oracle/cases/routing/routing-budgets/all-candidates-over-budget.yaml
- tools/oracle/cases/routing/routing-budgets/budget-before-affinity.yaml
- tools/oracle/cases/routing/routing-budgets/runtime-budget-update.yaml
deviations:
- what: Tag budgets are available without a paid-tier flag.
  why: The accepted product decision removes licensing gates and ships all MIT features.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L915-L935
out_of_scope:
- Budget CRUD and account reservations (B059/B071).
- Prometheus exporter (B111).
pitfalls:
- The pin treats falsy zero budgets as unenforced and missing spend as zero; the architect must decide
  whether to keep that compatibility or approve fail-closed enforcement before dispatch.
- Do not silently turn the router's post-call budget estimate into a hard concurrent account reservation.
- Budget and access filtering precede affinity.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
