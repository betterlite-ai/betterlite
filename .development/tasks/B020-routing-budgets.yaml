id: B020
title: Budget-aware filtering and policy composition
description: 'Finish policy routing by filtering B016''s eligible pool against B326 provider, deployment
  and tag budget state. Integrate the filter with tags, reserved access windows, routing groups and affinity
  using the pinned phase ordering. Connect remaining-budget observations to B012 without implementing
  exporters. Enable MIT tag-budget logic without a paid-tier check, as the project decision requires;
  use component probes on the MIT filter for parity instead of asserting the proprietary gate. Preserve
  zero-budget and missing-spend fail-open behavior, including unavailable shared reads; emit a warning
  without credentials or money rounding. Configuration boundary keys introduced or consumed here: optional_pre_call_checks.
  Pinned declaration defaults: optional_pre_call_checks=None. Resolve env values once in betterlite-config,
  never in router code. Implement the owned native service in crates/betterlite-router/src/routing_budgets.rs.
  Add ProbeOperation::RoutingBudgets in tools/oracle/src/router_probes/mod.rs and the corresponding B020 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/budget_limiter.py: _LiteLLMParamsDictView.__init__
  (L61-L62), _LiteLLMParamsDictView.__getattr__ (L64-L65), _LiteLLMParamsDictView.__getitem__ (L67-L68),
  _LiteLLMParamsDictView.__contains__ (L70-L71), _LiteLLMParamsDictView.get (L73-L74), _LiteLLMParamsDictView.keys
  (L76-L77), _LiteLLMParamsDictView.values (L79-L80), _LiteLLMParamsDictView.items (L82-L83), _LiteLLMParamsDictView.__iter__
  (L85-L86), _LiteLLMParamsDictView.__len__ (L88-L89), _LiteLLMParamsDictView.dict (L91-L92), _LiteLLMParamsDictView.model_dump
  (L94-L95), RouterBudgetLimiting.async_filter_deployments (L130-L204), RouterBudgetLimiting._filter_out_deployments_above_budget
  (L206-L288), RouterBudgetLimiting._get_budget_config_for_deployment (L697-L703), RouterBudgetLimiting._get_budget_config_for_provider
  (L705-L708), RouterBudgetLimiting._get_budget_config_for_tag (L710-L713), RouterBudgetLimiting._get_llm_provider_for_deployment
  (L715-L736), RouterBudgetLimiting._track_provider_remaining_budget_prometheus (L738-L751), RouterBudgetLimiting._get_current_provider_spend
  (L753-L777), RouterBudgetLimiting._get_current_provider_budget_reset_at (L779-L793), RouterBudgetLimiting._init_tag_budgets
  (L915-L935). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
