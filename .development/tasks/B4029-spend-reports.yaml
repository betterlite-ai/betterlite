id: B4029
title: Spend reports and per-user anomaly alerts
description: >-
  Build the three spend alert producers of LiteLLM's SlackAlerting class, plus the rules for the three background jobs that
  call them. Code goes in crates/betterlite-server/src/alerting/, in three modules: spend_reports (weekly and monthly team
  and tag reports), user_spend_alerts (per-user thresholds and anomalies) and spend_report_jobs (job rules). All outside
  parts come in through small traits defined in these modules: `SpendAlertSender` (send a message with a level of Low,
  Medium or High, an `AlertType` from B4020 and empty alerting metadata; the real one calls B4024's send_alert entry
  point), `SpendAlertCache` (get a key, set a key to "SENT" with a TTL in seconds; the real one is the internal usage
  cache, B4293), `SpendReportSource` (the team and tag totals for two dates; the real one calls B1725's
  _get_spend_report_for_time_range), `UserSpendSource` (the per-user rows, see below), `SpendPodLock` (acquire a lock by job
  id with a TTL and allow_reentrant false; the real one is B1690's PodLockManager) and a clock trait that gives the local
  date and the UTC date. Tests use fakes. Settings come from B4020's `SlackAlertingArgs` and `AlertType`. A service struct
  holds `alerting` (an Option of destination names such as "slack"), the enabled alert types and the args, all passed to
  its constructor. It also takes `hours_in_a_day`, which is 24 unless the caller read the HOURS_IN_A_DAY env var.

  Weekly report, `send_weekly_spend_report(time_range)`, default "7d". Return at once when `alerting` is None or
  spend_reports is not in the alert types. Everything after that is inside a catch-all that logs and never raises; a
  time range that does not parse logs "Invalid time range format". Parse days as the integer before the last character,
  and fail when the last character is not "d" or "D". Today is the clock's local date and the start date is today minus
  days. The sent marker key is `weekly_spend_report_sent_{start:%Y-%m-%d}_{today:%Y-%m-%d}`; when the cache holds
  anything for it, return. Ask the source for start and end as "%Y-%m-%d" strings. Return when the answer is None or both
  lists are empty. The message starts `*💸 Spend Report for `{start:%m-%d-%Y} - {today:%m-%d-%Y}` ({days} days)*` and a
  newline. When the team list is not None add `\n*Team Spend Report:*\n` and one line per row, ``Team: `{team_alias}` |
  Spend: `${spend}` `` plus a newline, where spend is round(total_spend, 4) printed like Python prints a float, and a team
  alias of None prints as `None`. When the tag list is not None add `\n*Tag Spend Report:*\n` and lines
  ``Tag: `{individual_request_tag}` | Spend: `${spend}` ``. Send it with level Low and alert type spend_reports, then set
  the marker to "SENT" with ttl duration_in_seconds(time_range) from B199.

  Monthly report, `send_monthly_spend_report()`. It has no alerting or alert type guard, so it runs even when spend_reports
  is not listed, and the send itself then drops the message. Whole body inside a catch-all that logs and never raises. First
  day of the month is today with day 1 and the last day comes from the calendar month length. The marker key is
  `monthly_spend_report_sent_{first:%Y-%m-%d}_{last:%Y-%m-%d}`. The source gets the first and last day. The message header
  is `*💸 Monthly Spend Report for `{first:%m-%d-%Y} - {last:%m-%d-%Y}` *` with a space before the closing star and a newline
  after. The team and tag sections are the same as the weekly ones. The marker TTL is 30 * hours_in_a_day * 3600.

  Per-user alerts, `send_user_spend_alerts(has_database)`. Return when `alerting` is None or does not contain "slack",
  when neither user_spend_thresholds nor user_spend_anomalies is enabled, or when there is no database. The rest is inside
  a catch-all that logs and never raises, so a source error, or a cache or sender error, ends the pass. Today is the
  clock's UTC date. Fetch rows through `UserSpendSource` with today and spend_anomaly_baseline_days. Build the events with
  `evaluate_user_spend` for every row, in row order. Read the cache key of every event; drop the events whose key holds a
  value. Then, for user_spend_thresholds and after it user_spend_anomalies, skip a type with no events, else send the
  messages joined with a blank line (`\n\n`) at level High with that alert type, and only after that send set each event's
  key to "SENT" with the event's TTL. A sender error on the first type stops the pass, so the second type is not sent and
  no key of the failed type is written.

  `evaluate_user_spend(row, args, today, thresholds_enabled, anomalies_enabled)` is a pure function that returns events in
  this order: daily threshold, monthly threshold, anomaly. A `UserSpendRow` has user_id, daily_spend, monthly_spend and
  baseline_spend. An event has kind (daily_threshold, monthly_threshold or anomaly), alert type, message, cache key and
  cache TTL. Daily threshold: none when daily_spend_per_user_threshold is None or daily_spend is below it, so equal alerts.
  Message, one line each: `User Daily Spend Threshold Crossed:`, ``User: `{user_id}` ``, ``Spend Today: `${daily:.2f}` ``,
  ``Daily Threshold: `${threshold:.2f}` ``. Key `user_spend_alert_daily_{user_id}_{today:%Y-%m-%d}`, TTL one day in seconds
  (hours_in_a_day * 3600), alert type user_spend_thresholds. Monthly threshold: the same with
  monthly_spend_per_user_threshold, header `User Monthly Spend Threshold Crossed:`, lines ``Spend This Month: `${monthly:.2f}` ``
  and ``Monthly Threshold: `${threshold:.2f}` ``, key `user_spend_alert_monthly_{user_id}_{today:%Y-%m}` and TTL 32 days.
  Anomaly: none when daily_spend is below spend_anomaly_min_spend. The daily average is baseline_spend divided by
  spend_anomaly_baseline_days. None when baseline_spend is above zero and daily_spend is at most multiplier times the
  average. So a user with no baseline alerts as soon as the daily spend reaches the minimum. Alert type
  user_spend_anomalies, key `user_spend_alert_anomaly_{user_id}_{today:%Y-%m-%d}`, TTL one day. Message lines:
  `User Spend Anomaly Detected:`, ``User: `{user_id}` ``, ``Spend Today: `${daily:.2f}` ``,
  ``Daily Average (last {baseline_days} days): `${avg:.2f}` ``, and
  ``Trigger: spend above `{multiplier}x` the daily average (minimum `${min:.2f}`)``, where the multiplier prints like a
  Python float (3.0, 2.5). The threshold events come only when thresholds_enabled and the anomaly event only when
  anomalies_enabled.

  User spend query. `PgUserSpendSource` implements `UserSpendSource` with the SQL of USER_SPEND_QUERY (user_spend_alerts.py
  lines 18-28) on LiteLLM_DailyUserSpend, using the postgres access from B700. The date column is a text column, so the
  three parameters are "%Y-%m-%d" strings: today, the first day of today's month, and today minus max(baseline_days, 1)
  days. Daily spend is the sum for date = today, monthly is the sum for date from month start, baseline is the sum for date
  from the baseline start and before today. Rows with a null user_id and users with monthly spend not above zero are left
  out. Sums are coalesced to 0 and cast to float. A row that does not decode is an error.

  Job rules in spend_report_jobs, because the LiteLLM scheduler setup lives in proxy_server.py
  `_initialize_slack_alerting_jobs` (lines 11229-11325) and nothing else plans it. `plan_spend_jobs(spend_report_frequency,
  args)` returns the settings of three jobs and does not start a scheduler. The frequency is the general_settings key
  spend_report_frequency, default "7d" and also "7d" when empty. Days are the integer before the last character; an unparsable
  number, a last character other than "d" or "D", or days of zero or less is a typed error "spend_report_frequency must be a
  positive number of days, e.g., '1d', '7d'". Weekly job: id weekly_spend_report_job, interval days, lock TTL
  duration_in_seconds(frequency) minus 3600, first run in 10 plus a random 0 to 300 seconds. Monthly job: id
  monthly_spend_report_job, cron on day 1, lock TTL 3600. User job: id user_spend_alerts_job, interval
  user_spend_check_interval seconds, lock TTL max(interval - 60, 60), first run in 10 plus a random 0 to 60 seconds. Each job
  runner, `run_weekly`, `run_monthly` and `run_user_spend`, acquires its lock with allow_reentrant false and skips the run only
  when the lock answer is exactly false; "no cache" (None) runs the job. Random first-run offsets come through an injected
  trait so tests are fixed. The APScheduler-like registration, the Prometheus fallback stats job and the app wiring are not
  built here.

  Oracle. `evaluate_user_spend` is pure, so it gets helper cases against LiteLLM's own function (the skeleton makes the
  helper operation b4029; its adapter builds a UserSpendRow and a SlackAlertingArgs from the case and returns the events).
  Messages of the two spend reports are covered by exact-string native tests, since LiteLLM builds them inline in async
  methods that need the proxy.
scope:
  paths:
    - crates/betterlite-server/src/alerting/spend_reports.rs
    - crates/betterlite-server/src/alerting/spend_reports/**
    - crates/betterlite-server/src/alerting/user_spend_alerts.rs
    - crates/betterlite-server/src/alerting/user_spend_alerts/**
    - crates/betterlite-server/src/alerting/spend_report_jobs.rs
    - crates/betterlite-server/src/alerting/spend_report_jobs/**
    - crates/betterlite-server/Cargo.toml
    - Cargo.lock
    - tools/oracle/cases/helpers/user-spend-alerts/**
    - "tools/oracle/fuzz/corpus/helper_case/user_spend_alerts-*"
    - tools/oracle/helpers/b4029.py
    - tools/oracle/helpers/b4029/**
    - tools/oracle/src/helpers/server/b4029.rs
    - tools/oracle/src/helpers/server/b4029/**
  lint_tables: false
