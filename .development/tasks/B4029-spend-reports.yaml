dod:
  - text: The weekly report does nothing without alerting or without spend_reports in the alert types, and sends nothing when the marker key is already set or both lists are empty.
    proof: [spend-weekly-tests]
  - text: The weekly report text has the header with local dates as mm-dd-yyyy and the day count, the team section, the tag section, spend rounded to 4 decimals and printed like Python, and a None team alias printed as None.
    proof: [spend-weekly-tests]
  - text: The weekly report is sent at level Low with alert type spend_reports, then the marker is set to SENT with the duration_in_seconds TTL of the time range; a bad time range or any error is logged and not raised.
    proof: [spend-weekly-tests]
  - text: The monthly report runs without an alert type guard, uses the month window and marker key, its header keeps the space before the closing star, and its marker TTL is 30 days.
    proof: [spend-monthly-tests]
  - text: Any error inside the monthly report is logged and not raised.
    proof: [spend-monthly-tests]
  - text: evaluate_user_spend builds daily and monthly threshold events that fire at equal spend, with the exact message, cache key and TTL, and only when thresholds are enabled.
    proof: [user-spend-evaluate-tests, oracle, helper-python, helper-case-corpus]
  - text: The anomaly event needs the minimum spend, uses the baseline average and multiplier, alerts at once for a user with no baseline, and only when anomalies are enabled.
    proof: [user-spend-evaluate-tests, oracle, helper-python, helper-case-corpus]
  - text: send_user_spend_alerts returns early without slack, without an enabled alert type or without a database, and drops events whose cache key is set.
    proof: [user-spend-send-tests]
  - text: User alerts are sent per alert type at level High with messages joined by a blank line, cache keys are written only after that type was sent, and a failed first send stops the pass; errors are logged and not raised.
    proof: [user-spend-send-tests]
  - text: PgUserSpendSource returns daily, monthly and baseline sums per user from text dates, leaves out null users and users with no monthly spend, and uses the baseline window before today.
    proof: [user-spend-query-tests]
  - text: plan_spend_jobs rejects a bad spend_report_frequency, and returns the three jobs with their ids, intervals, lock TTLs and first-run offsets.
    proof: [spend-jobs-tests]
  - text: Each job runner skips only when the lock answer is false, runs when the lock answer is true or None, and acquires with allow_reentrant false.
    proof: [spend-jobs-tests]
checks:
  optional: []
  commands:
    - id: spend-weekly-tests
      why: weekly spend report guard, text, marker or error tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^alerting::spend_reports::.*weekly/)'
    - id: spend-monthly-tests
      why: monthly spend report window, text, marker or error tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^alerting::spend_reports::.*monthly/)'
    - id: user-spend-evaluate-tests
      why: threshold and anomaly event tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^alerting::user_spend_alerts::.*evaluate/)'
    - id: user-spend-send-tests
      why: send_user_spend_alerts guard, dedupe, grouping or cache write tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^alerting::user_spend_alerts::.*send/)'
    - id: user-spend-query-tests
      why: the per-user spend query tests against Postgres fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^alerting::user_spend_alerts::.*query/)'
    - id: spend-jobs-tests
      why: job plan or lock handling tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^alerting::spend_report_jobs::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4029)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4029 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4029/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added user spend cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/user_spend_alerts-*")" &&
        grep -lE '^[[:space:]]+b4029:' tools/oracle/fuzz/corpus/helper_case/user_spend_alerts-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/user-spend-alerts/daily-threshold.yaml
  - tools/oracle/cases/helpers/user-spend-alerts/monthly-threshold.yaml
  - tools/oracle/cases/helpers/user-spend-alerts/anomaly-with-baseline.yaml
  - tools/oracle/cases/helpers/user-spend-alerts/anomaly-no-baseline.yaml
  - tools/oracle/cases/helpers/user-spend-alerts/below-limits.yaml
  - tools/oracle/cases/helpers/user-spend-alerts/types-disabled.yaml
deviations:
  - what: Cache, sender, report source, user spend source, pod lock, clock and the random first-run offsets are injected traits, not the proxy logging object's internal_usage_cache, send_alert, proxy_server's prisma_client and the module level scheduler.
    why: betterlite has no module state, and the real implementations are wired by the architect from B4293, B4024, B1725, B700 and B1690.
  - what: send_user_spend_alerts takes a has_database flag, and the real query source is built only when a database is connected.
    why: LiteLLM reads the global prisma_client from proxy_server, which betterlite does not have.
  - what: Job rules are returned as plain job settings by plan_spend_jobs and the runners, with no scheduler started in this task.
    why: LiteLLM registers them on APScheduler inside proxy_server.py, and betterlite's startup wiring owns scheduling.
  - what: HOURS_IN_A_DAY is a constructor value that defaults to 24, not read here from the environment.
    why: No backlog task owns that constant, so the caller reads the env var.
out_of_scope:
  - send_alert and the Slack, Teams, email and webhook delivery behind it belong to B4024 and B4021.
  - AlertType, SlackAlertingArgs and their defaults belong to B4020.
  - _get_spend_report_for_time_range and its SQL belong to B1725; this task only consumes its result through SpendReportSource.
  - duration_in_seconds belongs to B199, PodLockManager to B1690 and the internal usage cache to B4293.
  - The health endpoint test alert, which also starts both reports once (_health_endpoints.py L524-L525), belongs to the health route task.
  - send_fallback_stats_from_prometheus and its scheduled job (proxy_server.py L11311-L11325) are not part of the spend entry and belong to the fallback reports task.
  - Registering the scheduler and the startup call to _initialize_slack_alerting_jobs (proxy_server.py L10804) belong to the proxy startup wiring.
pitfalls:
  - The weekly report returns early without spend_reports in the alert types, but the monthly report has no such check, so a monthly report is still built and queried when the type is off.
  - Weekly dates use the local date (datetime.now().date()) and the user spend pass uses the UTC date, so the two clocks must stay separate.
  - The weekly marker TTL is duration_in_seconds(time_range) and the monthly one is a fixed 30 days, while the user monthly marker TTL is 32 days; do not share one constant.
  - The monthly header is "Monthly Spend Report for `a - b` " with a space before the closing star, and the weekly header has "(N days)" after it.
  - The tag and team sections are added whenever the list is not None, even when it is empty, so a report with teams and an empty tag list still prints the Tag Spend Report heading.
  - A team with no alias comes back from the LEFT JOIN as None and is printed as `None`, not skipped and not an empty string.
  - Spend is round(float, 4) and printed with Python's float text, so 1.0 stays "1.0", 0.00001 becomes "0.0" and 12.34567 becomes "12.3457"; use Rust's {:?} on the rounded f64 for values below 1e16.
  - A threshold event fires at equal spend (the check is "below threshold returns none"), and the anomaly check skips only when baseline_spend is above zero and daily_spend is at most the multiplier times the average.
  - The anomaly average divides by spend_anomaly_baseline_days, but the SQL window uses max(baseline_days, 1) days; the setting has ge=1, so both agree.
  - The anomaly message prints the multiplier with Python float text (3.0x), but the money values with two decimals.
  - The cache is read for all events first, then written per type after its send, so one type's failed send leaves its keys unset and the other type unsent.
  - The user spend lock TTL is max(user_spend_check_interval - 60, 60) and the weekly one is the frequency in seconds minus 3600; a lock answer of None (no cache) must still run the job.
  - The LiteLLM_DailyUserSpend.date column is a string, so the SQL compares text and the parameters must be bound as text, not as dates.
  - "crates/betterlite-server/Cargo.toml and Cargo.lock are in scope because the worker adds betterlite-logging to the server dependencies."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
