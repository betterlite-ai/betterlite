    why: send_monthly_spend_report, which has no alert type guard and a header with a space before the closing star.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1963-L2023
