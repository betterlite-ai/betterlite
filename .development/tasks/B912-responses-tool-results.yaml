id: B912
title: Responses tool results and call correlation
description: >-
  Implement tool-result and function/custom-call conversion in betterlite-core::api::responses_tool_results.
  Own the two full input-conversion methods, including the nested output normalizer, plus
  _tool_call_id_from_responses_item and both outbound function/apply_patch converters. Use
  B907's argument serializer and attribute conversion and an injected shared call cache
  from B2226. B004 provides chat/tool records. B913 writes the cache; this task only reads it
  and must not depend on its writer. No network or byte decoding occurs in this conversion.

  The responses_tool_results helper compares tool message order, JSON argument strings,
  cache hits and provider-specific fields. Count 234 nonblank/non-comment source lines
  including the lengthy examples. Budget 210 implementation, 160 tests, 100 fixtures,
  85 adapters and 25 wiring, 580 lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_tool_results.rs
  - crates/betterlite-core/src/api/responses_tool_results/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_tool_results.rs
  - tools/oracle/src/helpers/core_ops/responses_tool_results/**
  - tools/oracle/helpers/responses_tool_results.py
  - tools/oracle/helpers/responses_tool_results/**
  - tools/oracle/fuzz/corpus/helper_case/responses_tool_results-*
  - tools/oracle/cases/helpers/responses-tool-results/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L1552-L1738
  why: Full tool-output normalization/cache expansion and function/custom input reconstruction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2306-L2403
  why: Canonical versus index-shaped call IDs and outbound function/apply_patch conversion.
dod:
- text: >-
    tool_output_content returns [] for absent/empty/zero call_id. With call_id=c,output=null
    expect [{role:tool,tool_call_id:c,content:""}]; a string stays unchanged. Text blocks of
    type input_text,output_text,text join without separators; empty/non-string text is ignored.
    Input_image/image_url blocks accept image_url string, image_url.url or fallback url and
    normalize to {type:image_url,image_url:{url:<value>}}, dropping detail/extra fields. If any
    image exists, preserve text and image blocks in order; otherwise use joined text. A list
    with no recognized content becomes its JSON string, including [] -> "[]"; objects/numbers
    are JSON-serialized and unserializable values fall back to Python str. Numeric call_id=7
    produces tool_call_id="7" while cache lookup still receives the original key value.
  proof: [result-tests, oracle, result-adapter]
- text: >-
    cached_call_output supplies a cached definition for c and expects an assistant wrapper
    immediately before the tool message, with one call,index=0,default id="",type=function,
    name="",arguments="" for missing/falsy fields. Cached object arguments {x:1} serialize
    to '{"x": 1}'. A falsy/missing cache entry produces only the tool message.
  proof: [result-tests, oracle, result-adapter]
- text: >-
    input_function_call maps function_call,call_id=c,id=fc_i,name=f,namespace=ns,arguments="{}"
    to assistant content=null,one function tool call id=c,name=ns__f,arguments="{}",index=0.
    Missing call_id falls back to id then "". arguments=redacted-by-litellm becomes "{}".
    custom_tool_call ignores namespace and wraps input=patch as arguments='{"content": "patch"}'
    only when arguments is falsy; empty input yields "". Nonempty arguments wins over input.
  proof: [result-tests, oracle, result-adapter]
- text: >-
    output_call_identity preserves call_id=call_unique over id=fc_i but uses fc_i for
    call_id=call_0,call_123 or absent call_id. Without item id, call_0 survives; both absent
    yields "". Function conversion copies name/arguments and truthy provider_specific_fields
    into both function and call, converting attribute-based extension objects through B907.
    Supplied index=4 is deliberately ignored and output index=0. apply_patch conversion uses
    call_id directly, function.name=apply_patch, JSON operation.model_dump() as arguments and
    retains the supplied index=4. Test create_file/update_file/delete_file operation records.
  proof: [result-tests, oracle, result-adapter]
checks:
  optional: []
  commands:
  - id: result-tests
    why: tool content, cached wrapper order or correlation IDs differ
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_results::/)'
  - id: result-adapter
    why: tool result cases do not independently exercise pinned conversion
    run: test -f tools/oracle/helpers/responses_tool_results.py && grep -qE '^[[:space:]]+responses_tool_results:' tools/oracle/fuzz/corpus/helper_case/responses_tool_results-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-tool-results/tool-output-content.yaml
- tools/oracle/cases/helpers/responses-tool-results/cached-call-output.yaml
- tools/oracle/cases/helpers/responses-tool-results/input-function-call.yaml
- tools/oracle/cases/helpers/responses-tool-results/output-call-identity.yaml
deviations: []
out_of_scope:
- Other transformation.py methods are B907 tool primitives, B908 options, B909 input dispatch, B910 merges, B911 repair, B913 namespaces/cache writes, B914 response assembly, B915 session history and B1115 details.
- The unused deduplicate and ensure-output-correspondence methods at L925-L995 have no caller at the pin.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_tool_results in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_tool_results.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_tool_results.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Input reconstruction prefers call_id even when it is call_0; the outbound Responses-item converter alone applies the index-shaped-ID fallback.
- Function output conversion always emits index=0, whereas apply_patch honors its index argument.
- A tool-result list with no recognized parts becomes JSON text instead of an empty message.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
