id: B944
title: Responses ws history
description: >-
  Implement the constructor and connection-local preparation helpers of
  litellm.responses.streaming_iterator.ManagedResponsesWebSocketHandler. The owned code does not register an
  HTTP or WebSocket route, read an environment variable, read a config key or query parameter, call a provider, or
  write a database row. B945 owns the caller that catches warmup/provider/send failures, invokes a provider, and
  saves a completed turn; this task owns the values and mutations that caller consumes. Keep history in an
  unbounded map keyed by the decoded provider response id. An unknown previous_response_id is not persisted: it is
  put back in call_kwargs for B945's downstream reconstruction.


  The constructor receives a WebSocket sink, model, logging object, optional user_api_key_dict, optional
  litellm_metadata, api_key, api_base, timeout, custom_llm_provider, first_message, quota_callbacks and arbitrary
  kwargs. With model openai/gpt-4o-mini, all optional arguments absent, and kwargs
  {extra_headers: {X-Test: yes}, litellm_call_id: drop, aresponses: drop, litellm_logging_obj: drop,
  _aresponses_websocket: drop, user_api_key_dict: drop}, it stores litellm_metadata {}, model_group None,
  _connection_provider openai, first_message None, api_key/api_base/timeout/custom_llm_provider None, quota_callbacks
  (), an empty _session_history, and extra_kwargs {extra_headers: {X-Test: yes}}. The skip literals are exactly
  litellm_logging_obj, litellm_call_id, aresponses, _aresponses_websocket and user_api_key_dict. A metadata map with
  model_group router-alias beats deployment_model_name deployment-alias; model_group "" or an absent model_group
  falls through to deployment_model_name, while truthy model_group 7 and falsey/non-string deployment_model_name
  leave model_group None. A missing metadata map and an empty metadata map both result in a fresh {} value. A missing
  or empty quota_callbacks value results in (), and a nonempty sequence is converted to a tuple.


  Build _RESPONSE_CREATE_PARAMS from ResponsesAPIRequestParams.__required_keys__ and __optional_keys__. The exact
  accepted names are input, model, include, instructions, max_output_tokens, metadata, parallel_tool_calls,
  previous_response_id, reasoning, store, background, stream, temperature, text, tool_choice, tools, top_p,
  truncation, user, service_tier, safety_identifier, prompt, max_tool_calls, prompt_cache_key,
  prompt_cache_retention, prompt_cache_options, stream_options, top_logprobs, partial_images and context_management.
  For a flat object containing type response.create, input hello, model openai/gpt-4o-mini, store false, and
  unknown extra ignored, _build_base_call_kwargs returns only the accepted non-None fields, including store false;
  an accepted field set to null is omitted. A nonempty dict response source wins over every flat field, while an
  absent, null, non-dict, or empty response source selects all top-level fields except type. B945 adds stream true
  after this helper, so this task must not invent a second stream default.


  _serialize_chunk tries model_dump_json(exclude_none=True), then model_dump(exclude_none=True) encoded with
  json.dumps(default=str), then a dict encoded with json.dumps(default=str), then json.dumps(str(value)). Thus a
  model-dump-json object, a model-dump-only object, {n: 7}, integer 7 and None each have a distinct case, with the
  last two serialized as JSON strings 7 and None respectively. Any exception from those four attempts logs the exact
  debug diagnostic ManagedResponsesWS: failed to serialize chunk: %s and returns None. _send_error with message
  quota exceeded and its default error_type server_error sends one text frame containing
  {type: error, error: {type: server_error, message: quota exceeded}}; with error_type invalid_request_error it
  uses that literal type. An exception from send_text is swallowed and produces no second frame or replacement
  error.


  _parse_message("not-json") sends one text frame whose JSON is
  {type: error, error: {type: invalid_request_error, message: Invalid JSON in response.create event}} and returns
  None. A valid {type: ping} object returns None without a frame. Because B925's _load_json_object is plain
  json.loads and this method catches only json.JSONDecodeError, valid top-level [], null, 7 and "text" reach .get
  and raise the normal object-shape exception instead of becoming invalid_request_error. A response.create object
  proceeds unchanged.


  A response.create object with flat generate false, or with response {generate: false}, is a warmup. The selected
  source is the nonempty nested response dict, otherwise the flat object without type. generate 0 is not warmup
  because the source uses identity comparison with False. _build_warmup_response uses source model when truthy, then
  model_group, then the constructor model; it emits object response, output [], status completed, usage
  {input_tokens: 0, output_tokens: 0, total_tokens: 0}, current int(time.time()), and an id matching
  resp_warmup_[0-9a-f]{32}. _send_warmup_ack sends response.created/status in_progress before
  response.completed/status completed, copying the same response fields into both frames. If serialization of one
  frame returns None, that frame is dropped and the loop attempts the other frame. send_text exceptions propagate to
  B945, which owns their log and recovery.


  _input_to_messages("hello") returns one message with type message, role user and content
  [{type: input_text, text: hello}]. An input array [{type: message, role: user}, 7, "drop"] keeps the first dict
  only; missing, null, {}, 7 and "hello" as the whole input return []. _extract_output_messages keeps only dict
  output items. A message with role absent and content [{type: output_text, text: A}, {type: text, text: B},
  {type: input_text, text: C}] becomes one message with role assistant and content
  [{type: output_text, text: AB}]. role null remains null; an empty joined text drops the message; an item type
  function_call is appended unchanged; every other item is dropped. If a selected output_text/text part has
  integer text 7, joining raises the source TypeError.


  _extract_response_id returns None for response {}, response {id: null}, response {id: 7} and response {id: ""}.
  For an encoded id resp_bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOm9wZW5haTttb2RlbF9pZDpncHQtNG8tbWluaTtyZXNwb25zZV9pZDpyYXctMQ==,
  it returns raw-1 through B903's decoder. _store_history("raw-1", [message-A]) followed by
  _get_history_messages(encoded-id) returns an equal new outer list, and a second _store_history("raw-1",
  [message-B]) replaces message-A. An unencoded unknown id returns [], and neither lookup nor replacement writes a
  database row.


  _apply_history leaves call_kwargs unchanged for previous_response_id None and "". With previous_response_id
  raw-1, prior history [{type: message, role: user, content: []}] and current messages [{type: message, role: user,
  content: [{type: input_text, text: next}]}], it sets input to prior history followed by current messages and logs
  ManagedResponsesWS: prepended 1 history messages for previous_response_id=%s with raw-1. With raw-2 and no prior
  history, it leaves current input unchanged, sets previous_response_id to raw-2 and logs
  ManagedResponsesWS: no in-memory history for previous_response_id=%s; falling back to DB-based session
  reconstruction with raw-2. With resp_warmup_0123456789abcdef0123456789abcdef, it leaves call_kwargs unchanged and
  logs ManagedResponsesWS: ignoring synthetic warmup previous_response_id=%s. None of these branches writes a
  database row.


  _resolve_provider returns openai for openai/gpt-4o-mini, anthropic for
  anthropic/claude-3-5-sonnet-20241022, and None for "" or the resolver-failure input not-a-real-provider/model.
  The constructor with not-a-real-provider/model and custom_llm_provider proxy stores _connection_provider proxy.
  _same_provider is true for no frame model and the exact connection model, true when another model resolves to the
  connection provider, and false for an unresolvable or different-provider model. _inject_credentials independently
  copies non-None api_key key-1, api_base https://api.example.test, and timeout 7.5. It copies custom_llm_provider
  proxy only on a true same-provider result, copies a truthy metadata map {trace_id: t1} as a new dict, and adds no
  absent-value keys. A different-provider frame therefore still receives key-1, the base and 7.5, but not proxy.


  _update_proxy_request evaluates
  (call_kwargs.get("litellm_metadata") or {}).get("proxy_server_request") or {}. With no proxy request and
  call_kwargs {input: [hello], store: null, tools: null, tool_choice: auto, instructions: null,
  metadata: {tenant: t1}}, model openai/gpt-4o-mini, it creates body {input: [hello], store: null,
  model: openai/gpt-4o-mini, tool_choice: auto, metadata: {tenant: t1}}, preserves any existing body keys, creates
  litellm_metadata {} when absent, and stores the updated request under both call_kwargs.proxy_server_request and
  call_kwargs.litellm_metadata.proxy_server_request. tools, tool_choice, instructions and metadata are copied only
  when their values are non-null; input, store and model are always written, including null input/store. A present
  truthy non-dict such as not-a-dict returns without mutation; absent, null, {} and other falsey values use the fresh
  request path. This function changes kwargs only; it performs no database write.


  Add production-driven tests under api::responses_ws_history::tests with the exact names constructor_defaults_and_passthrough,
  serialization_and_error_drop, parse_message_cases, warmup_ack_without_provider, input_and_output_message_projection,
  response_id_history, base_call_kwargs, apply_history_paths, same_provider_credentials,
  different_provider_does_not_copy_credentials and proxy_request_projection. Assert exact frames, JSON values,
  mutation keys, ordered warmup sends and diagnostics. Add independent B171 helper cases for these pure functions;
  they do not call a FastAPI/WebSocket route or a provider. The raw JSON decoder remains B925's implementation and
  this task adds no decoder or fuzz target.
