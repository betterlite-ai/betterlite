dod:
- text: The constructor case proves the exact five skip literals, metadata/model_group precedence, None and empty defaults, provider fallback and empty history for the stated openai/gpt-4o-mini and proxy inputs.
  proof:
  - case-constructor-defaults-and-passthrough
  - behavior-tests
- text: The serialization case proves all four serializer branches, the integer and None JSON-string results, the exact debug drop diagnostic, both error types and swallowed sink failures.
  proof:
  - case-serialization-and-error-drop
  - behavior-tests
  - oracle
- text: The parser case proves the exact invalid_request_error frame for not-json, silent ping drop, and object-shape exceptions for valid array, null, number and string JSON.
  proof:
  - case-parse-message-cases
  - behavior-tests
  - oracle
- text: The warmup case proves flat and nested generate=false selection, generate=0 rejection, model fallback, response.created then response.completed ordering, literal statuses/usage/output/object fields, id shape, timestamp type and serialization-drop continuation.
  proof:
  - case-warmup-ack-without-provider
  - behavior-tests
  - oracle
- text: The message projection case proves string/array input filtering, output_text/text concatenation, assistant and null-role behavior, empty-output drops, unchanged function_call items, unknown-item drops and the integer-text TypeError.
  proof:
  - case-input-and-output-message-projection
  - behavior-tests
  - oracle
- text: The response-id case proves raw-id decoding, missing/non-string/empty rejection, copied lookup results, replacement order and zero database writes.
  proof:
  - case-response-id-history
  - behavior-tests
  - oracle
- text: The base-kwargs case proves nested nonempty precedence, flat fallback for absent/null/non-dict/empty response, exact accepted names and omission of null and unknown fields.
  proof:
  - case-base-call-kwargs
  - behavior-tests
  - oracle
- text: The history case proves None/empty no-ops, one-message prepend and diagnostic, raw-2 downstream fallback and diagnostic, synthetic warmup no-op and zero database writes.
  proof:
  - case-apply-history-paths
  - behavior-tests
  - oracle
- text: The provider case proves openai/anthropic/None resolution, custom-provider fallback, same-provider truth values, independent api_key/api_base/timeout copies, conditional custom_llm_provider and copied metadata.
  proof:
  - case-same-provider-credentials
  - case-different-provider-does-not-copy-credentials
  - behavior-tests
  - oracle
- text: The proxy case proves body preservation and insertion order, null input/store/model writes, non-null optional-field filtering, fresh metadata creation, both literal proxy_server_request locations and the truthy non-dict early return.
  proof:
  - case-proxy-request-projection
  - behavior-tests
  - oracle
- text: The independent helper adapters, tagged seeds and named parity cases execute the pure functions against independently scripted pinned LiteLLM and exclude route/provider calls.
  proof:
  - oracle
  - helper-python
  - helper-corpus
  - new-oracle-cases
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The scoped Responses WebSocket helper behavior is absent, incomplete or represented only by corpus replay.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::/) - test(/::replays_corpus$/)'
  - id: case-constructor-defaults-and-passthrough
    why: Constructor filtering, defaults, model-group precedence or provider fallback is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::constructor_defaults_and_passthrough($|::)/)'
  - id: case-serialization-and-error-drop
    why: Serializer precedence, exact error envelopes or sink-error swallowing is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::serialization_and_error_drop($|::)/)'
  - id: case-parse-message-cases
    why: Invalid JSON framing, non-response.create drop or non-object propagation is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::parse_message_cases($|::)/)'
  - id: case-warmup-ack-without-provider
    why: Warmup selection, exact acknowledgement fields, ordering or serialization-drop continuation is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::warmup_ack_without_provider($|::)/)'
  - id: case-input-and-output-message-projection
    why: Input filtering, output concatenation, role defaults or function-call preservation is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::input_and_output_message_projection($|::)/)'
  - id: case-response-id-history
    why: Decoded-id keying, copy-on-read, replacement or invalid-id behavior is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::response_id_history($|::)/)'
  - id: case-base-call-kwargs
    why: Nested/flat source selection or the exact non-null allowlist is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::base_call_kwargs($|::)/)'
  - id: case-apply-history-paths
    why: History prepend, database reconstruction fallback or synthetic warmup handling is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::apply_history_paths($|::)/)'
  - id: case-same-provider-credentials
    why: Same-provider resolution or credential/metadata injection is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::same_provider_credentials($|::)/)'
  - id: case-different-provider-does-not-copy-credentials
    why: Different-provider custom-provider isolation is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::different_provider_does_not_copy_credentials($|::)/)'
  - id: case-proxy-request-projection
    why: Proxy body projection, fresh metadata creation or the top-level proxy_server_request key is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::proxy_request_projection($|::)/)'
  - id: helper-python
    why: The independent helper adapter is absent or fails strict Python checks.
    run: test -f tools/oracle/helpers/responses_ws_history.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The helper has no newly added tagged seed or its shared corpus replay fails.
    run: test -n "$(git diff --name-only --diff-filter=A \"$GATE_BASE\" -- tools/oracle/fuzz/corpus/helper_case/responses_ws_history-*)" && grep -qE "^[[:space:]]+responses_ws_history:" tools/oracle/fuzz/corpus/helper_case/responses_ws_history-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: No B944 parity case was added on this branch.
    run: test -n "$(git diff --name-only --diff-filter=A \"$GATE_BASE\" -- tools/oracle/cases/helpers/responses-ws-history)"
