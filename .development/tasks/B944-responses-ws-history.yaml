checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::/)
      - test(/::replays_corpus$/)'
  - id: case-warmup-no-provider-call
    why: the warmup-no-provider-call behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::warmup_no_provider_call($|::)/)'
  - id: case-previous-response-history
    why: the previous-response-history behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::previous_response_history($|::)/)'
  - id: case-unknown-history-id
    why: the unknown-history-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::unknown_history_id($|::)/)'
  - id: case-same-provider-credentials
    why: the same-provider-credentials behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::same_provider_credentials($|::)/)'
  - id: case-different-provider-no-credential-copy
    why: the different-provider-no-credential-copy behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_history::tests::different_provider_no_cre_1ae1($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_ws_history.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_ws_history-*)"
      && grep -qE "^[[:space:]]+responses_ws_history:" tools/oracle/fuzz/corpus/helper_case/responses_ws_history-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-ws-history)"
