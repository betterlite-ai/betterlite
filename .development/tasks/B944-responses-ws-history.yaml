id: B944
title: Responses ws history
description: >-
  Build managed WebSocket history and warmup primitives: parse response.create, extract output messages, apply previous_response_id
  history, build warmup acknowledgements and authorize provider credential reuse. Store bounded connection-local
  history; credentials stay SecretString and can only come from the selected deployment.


  Implement crates/betterlite-core/src/api/responses_ws_history.rs. Use ResponsesWsHistoryInput and ResponsesWsHistoryResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions warmup_no_provider_call, previous_response_history, unknown_history_id,
  same_provider_credentials, different_provider_no_cre_1ae1 under api::responses_ws_history::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesWsHistory in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_ws_history: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler.__init__ (L2519-L2556);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._serialize_chunk (L2563-L2575); litellm/responses/streaming_iterator.py:
  ManagedResponsesWebSocketHandler._send_error (L2577-L2583); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._get_history_messages
  (L2585-L2594); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._store_history (L2596-L2603);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._extract_response_id (L2606-L2617);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._extract_output_messages (L2620-L2654);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._input_to_messages (L2657-L2672); litellm/responses/streaming_iterator.py:
  ManagedResponsesWebSocketHandler._parse_message (L2678-L2688); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._is_warmup_frame
  (L2691-L2695); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._is_warmup_response_id
  (L2698-L2704); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._warmup_source_params
  (L2707-L2711); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._build_warmup_response
  (L2713-L2729); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._send_warmup_ack (L2731-L2751);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._build_base_call_kwargs (L2754-L2768);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._apply_history (L2770-L2801); litellm/responses/streaming_iterator.py:
  ManagedResponsesWebSocketHandler._resolve_provider (L2804-L2814); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._same_provider
  (L2816-L2823); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._inject_credentials (L2825-L2841);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._update_proxy_request (L2844-L2860).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 255 owned nonblank/non-comment/non-docstring Python lines (298 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 275 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 525 total within the 530-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B903 (Response id codecs), B909 (Responses input messages), B1087 (Api boundaries),
  B732 (Typed authentication principals and grant resolution), B925 (Responses stream events). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
