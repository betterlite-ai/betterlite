- 'litellm/responses/streaming_iterator.py: B928 owns _HasModelDump.model_dump L1329-L1331 and _HasModelDumpJson.model_dump_json L1334-L1336; B944 only tests their dispatch order through the injected serializer cases.'
- 'litellm/litellm_core_utils/get_llm_provider_logic.py: B174 owns get_llm_provider L158-L562; B944 only catches its resolver exceptions and compares the returned provider string.'
- 'litellm/responses/utils.py: B903 owns _build_responses_api_response_id L611-L621 and _decode_responses_api_response_id L624-L674; B944 consumes the decoded response_id and does not implement base64 encoding/decoding.'
- 'litellm/types/llms/openai.py: B909 owns the Responses input item records and transformations; B944 consumes the request-key declarations and converts already-decoded input/output dicts.'
- 'litellm/responses/streaming_iterator.py: B942 owns frame quota/policy and encrypted-id helpers L1752-L1884 plus native ResponsesWebSocketStreaming L1900-L2477.'
- 'litellm/responses/streaming_iterator.py: B945 owns _stream_and_forward L2862-L2890, _save_turn_history L2892-L2911, _process_response_create L2917-L2990 and run L2996-L3016, including provider I/O, route lifecycle, quota admission, call ordering, warmup exception recovery and database reconstruction.'
- 'litellm/llms/custom_httpx/llm_http_handler.py: B945 owns async_responses_websocket L6513-L6562, which constructs this handler for non-native providers and calls run; B944 registers no route and makes no provider request.'
- 'All other declarations and functions in the shared streaming_iterator.py file remain with their existing B925, B926, B927, B928, B942, B943 or B945 owner; B944 changes only the constructor/constants and methods described in the owned references.'
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_ws_history in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_ws_history.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_ws_history.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'The constructor applies or before isinstance: model_group 7 suppresses deployment_model_name deployment-alias, while model_group "" reaches deployment_model_name; do not use a type check before the truthiness decision.'
- 'A nonempty nested response dict hides flat input/model/store values even when those flat values are present; only an empty dict falls back to the flat fields.'
- 'json.loads accepts [] and null here, and _parse_message catches only JSONDecodeError, so object-shape failures must remain exceptions rather than becoming invalid_request_error frames.'
- 'Warmup checks generate is False, making JSON 0 a normal frame; nested response parameters also control the warmup model independently of flat model.'
- 'The output role default is get("role", "assistant"), so role null survives, and joining a selected part whose text is integer 7 raises TypeError.'
- 'Response history uses the decoded raw id and returns list(...) on lookup but stores the supplied message list directly; replacing raw-1 must not be changed into append or copy-on-write semantics.'
- 'Missing history restores previous_response_id for downstream reconstruction, whereas a decoded resp_warmup_ id is ignored; neither branch performs a database write.'
- 'api_key, api_base and timeout are copied before the provider comparison, but custom_llm_provider is copied only when _same_provider is true.'
- 'The proxy projection always writes input, store and model, including nulls, and writes the updated request to call_kwargs.proxy_server_request as well as call_kwargs.litellm_metadata.proxy_server_request; no top-level proxy_request field exists.'
- 'A truthy non-dict proxy_server_request returns before mutation, while absent, null or empty values are replaced with a new request and can create litellm_metadata {}.'
- 'A serializer failure is a debug diagnostic plus None, and a warmup acknowledgement drops only that failed event before trying the next status.'
