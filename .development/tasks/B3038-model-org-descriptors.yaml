id: B3038
title: Model and organization rate-limit descriptors
description: >-
  Build the descriptor builders of the v3 limiter that depend on which model the caller asked for, plus the
  organization descriptor. Each builder turns already-parsed key, team, organization and project limits into
  RateLimitDescriptor records (B3031) that the later admission code counts against. Nothing here reads Redis,
  counts anything or raises a rate-limit error. One Rust module, model_descriptors, in betterlite-rate-limit.

  The module holds a struct ModelDescriptorBuilder. It is made with the limiter window size (the value of
  rate_limiter_settings.window_size from B3031's config section, default 60) and a boxed ModelGroupResolver
  (the B3031 trait). Every descriptor it builds carries that window size in rate_limit.window_size. All methods
  are plain sync functions that take the caller as a UserAPIKeyAuth (betterlite-auth) and return or append
  RateLimitDescriptor values. The builder never reads global state.

  rated_model(requested) is the port of _rate_limited_model. A missing or empty requested name gives none.
  Otherwise it returns a B3031 RateLimitedModel with requested set to the name and group set to the resolver's
  answer, falling back to the requested name when the resolver answers none or an empty string.

  organization_descriptors(auth, requested_model) is create_organization_rate_limit_descriptor and returns a
  Vec in this order. First, when org_id is set and organization_rpm_limit or organization_tpm_limit is set, a
  descriptor key "organization", value org_id, requests_per_unit the rpm limit, tokens_per_unit the tpm limit
  (either may be none). Second, when rated_model gives a model, it reads the organization_metadata maps
  model_rpm_limit and model_tpm_limit through B745's get_model_rate_limit_from_metadata and picks each limit
  with RateLimitedModel.limit_in. When at least one is set it adds key "model_per_organization", value
  "<org_id>:<group>", the two limits and the window size. The two descriptors are independent: the model one is
  built even when no global organization limit exists.

  key_model_descriptor(auth, requested_model, out) is _add_model_per_key_rate_limit_descriptor. It reads the
  key's limits with B745's get_key_model_rpm_limit and get_key_model_tpm_limit, called with model_name set to
  the group (so B745's deployment default for that group applies), and picks each with limit_in. When at least
  one limit is set it appends key "model_per_key", value "<api_key>:<group>". Which source B745 uses (key
  metadata, key model_max_budget, team metadata, deployment default) is B745's job, not repeated here.

  team_model_descriptor(auth, requested_model, out) is _add_team_model_rate_limit_descriptor_from_metadata. For
  rpm and for tpm separately it takes the team_metadata limit (get_model_rate_limit_from_metadata with
  "team_metadata" and limit_in) and drops it when the key owns a limit for that model. A key owns a limit when
  limit_in on B745's get_key_own_model_rate_limit (key metadata first, then model_max_budget) is not none, so an
  own limit of 0 still counts as owned. When at least one limit survives it appends key "model_per_team",
  value "<team_id>:<group>". Dropping one of the two does not drop the other: a key that owns only the tpm limit
  still gets the team's rpm limit.

  project_model_descriptor(auth, requested_model, out) is _add_project_model_rate_limit_descriptor_from_metadata.
  It reads project_metadata model_rpm_limit and model_tpm_limit, picks with limit_in, and when one is set
  appends key "model_per_project", value "<project_id>:<group>". It does not check project_id.

  project_io_descriptors(auth, requested_model, out) is
  add_project_io_token_rate_limit_descriptors_from_metadata. It returns without adding anything when there is no
  model or project_id is none. Otherwise it reads project_metadata model_itpm_limit and model_otpm_limit,
  picks with limit_in, and appends up to two descriptors that share the value "<project_id>:<group>": first
  key PROJECT_ITPM_DESCRIPTOR_KEY ("model_per_project_itpm") when the input limit is set, then
  PROJECT_OTPM_DESCRIPTOR_KEY ("model_per_project_otpm") when the output limit is set. Both have
  requests_per_unit none and tokens_per_unit the limit. The python sink protocol becomes a plain &mut
  Vec<RateLimitDescriptor>. B3042 calls this function.

  key_owns_tpm_from_request_metadata(request_metadata, model) is
  _key_owns_model_tpm_limit_from_request_metadata, used by the success callback (B3045) to decide whether the
  team's model_per_team scope is charged. It returns false when model is none. Otherwise it builds a
  UserAPIKeyAuth with UserAPIKeyAuth::construct from a dict holding only "metadata" (the request metadata's
  user_api_key_metadata, or an empty map when missing, none or empty) and "model_max_budget" (the request
  metadata's user_api_key_model_max_budget, same fallback), then returns whether the key owns a model_tpm_limit
  for that model. A value that does not fit the UserAPIKeyAuth field types is a typed error from this module,
  not a panic.

  Descriptor ordering matters: B3040 appends these in the order LiteLLM's _create_rate_limit_descriptors does,
  and the organization ones are added by the pre-call hook (B3055), so this module only guarantees the order
  inside each method.

  Direct dependencies: B2314 supplies UserAPIKeyAuth and its construct function; B745 supplies
  get_model_rate_limit_from_metadata, get_key_own_model_rate_limit, get_key_model_rpm_limit and
  get_key_model_tpm_limit; B3031 supplies RateLimitDescriptor, RateLimitDescriptorRateLimit, RateLimitedModel,
  ModelGroupResolver and the two PROJECT_*_DESCRIPTOR_KEY constants.

