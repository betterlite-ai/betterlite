dod:
  - text: rated_model returns none for a missing or empty name, uses the resolver's group when it answers, and falls back to the requested name when the resolver answers none or an empty string.
    proof: [model-descriptor-tests, rate-limit-model-descriptors-oracle, helper-python, helper-case-corpus]
  - text: The organization descriptor appears only when org_id and at least one of the organization rpm and tpm limits are set, with value org_id, the two limits and the configured window size.
    proof: [model-descriptor-tests, rate-limit-model-descriptors-oracle, helper-python, helper-case-corpus]
  - text: model_per_organization has value "<org_id>:<group>", reads organization_metadata, prefers the requested-name limit over the group limit, and is built even when there is no global organization limit.
    proof: [model-descriptor-tests, rate-limit-model-descriptors-oracle, helper-python, helper-case-corpus]
  - text: model_per_key reads the key limits for the group name, and no descriptor is added when neither limit is set.
    proof: [model-descriptor-tests, rate-limit-model-descriptors-oracle, helper-python, helper-case-corpus]
  - text: model_per_team drops a team limit only for the kind (rpm or tpm) the key owns, counts an own limit of 0 as owned, and keeps the other kind.
    proof: [model-descriptor-tests, rate-limit-model-descriptors-oracle, helper-python, helper-case-corpus]
  - text: model_per_project reads project_metadata with value "<project_id>:<group>" and is added when either limit is set.
    proof: [model-descriptor-tests, rate-limit-model-descriptors-oracle, helper-python, helper-case-corpus]
  - text: The project input-output builder adds nothing without a model or a project_id, adds the ITPM descriptor before the OTPM one, and each has requests_per_unit none.
    proof: [model-descriptor-tests, rate-limit-model-descriptors-oracle, helper-python, helper-case-corpus]
  - text: key_owns_tpm_from_request_metadata is false without a model, reads only user_api_key_metadata and user_api_key_model_max_budget, treats missing, none and empty values as an empty map, and returns a typed error for a value of the wrong shape.
    proof: [model-descriptor-tests]
  - text: Every descriptor carries the window size the builder was made with, not a fixed 60.
    proof: [model-descriptor-tests]
  - text: Newly added model and organization descriptor cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: model-descriptor-tests
      why: the model, organization, team, project or request-metadata descriptor tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^model_descriptors::/)'
    - id: rate-limit-model-descriptors-oracle
      why: the oracle cases for the model and organization descriptors are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/rate-limit-model-descriptors)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/rate-limit-model-descriptors
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3038)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3038 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3038/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added descriptor cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/rate_limit_model_descriptors-*")" &&
        grep -lE '^[[:space:]]+b3038:' tools/oracle/fuzz/corpus/helper_case/rate_limit_model_descriptors-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/rate-limit-model-descriptors/rated-model-group.yaml
  - tools/oracle/cases/helpers/rate-limit-model-descriptors/organization-global.yaml
  - tools/oracle/cases/helpers/rate-limit-model-descriptors/organization-model.yaml
  - tools/oracle/cases/helpers/rate-limit-model-descriptors/key-model.yaml
  - tools/oracle/cases/helpers/rate-limit-model-descriptors/team-model-key-owned.yaml
  - tools/oracle/cases/helpers/rate-limit-model-descriptors/project-model.yaml
  - tools/oracle/cases/helpers/rate-limit-model-descriptors/project-io-tokens.yaml

deviations:
  - what: key_owns_tpm_from_request_metadata returns a typed error when the request metadata values do not fit the UserAPIKeyAuth field types.
    why: LiteLLM's model_validate raises a pydantic ValidationError that the callback does not catch, so the success callback fails. The error type is Rust's, and B3045 decides how the callback reports it. Request metadata the proxy built itself always fits.
  - what: The output sink is a &mut Vec<RateLimitDescriptor> and the builders are methods on ModelDescriptorBuilder, not methods of the limiter.
    why: The limiter object is built by B3055. The builder holds only the two things these methods read (window size and the group resolver), so tasks that need descriptors do not need the whole limiter.

out_of_scope:
  - "The api_key, user, team, team_member and end_user descriptors and _create_rate_limit_descriptors, _should_enforce_rate_limit, _get_enforced_limit, _is_dynamic_rate_limiting_enabled and _check_model_has_recent_failures: B3040."
  - "Tag, MCP, agent and session descriptors (_add_tag_per_key_..., _add_mcp_per_key_..., _add_mcp_per_team_..., _create_agent_rate_limit_descriptors, _get_resolved_agent_id, _get_session_id_from_data, _create_tag_rate_limit_descriptors): B3039."
  - "RateLimitedModel, limit_in, ModelGroupResolver, the descriptor records and the PROJECT_*_DESCRIPTOR_KEY constants: B3031. _resolve_model_group_alias_via_proxy_router and the production resolver wiring: B3055."
  - "get_key_model_rpm_limit, get_key_model_tpm_limit, get_key_own_model_rate_limit, get_model_rate_limit_from_metadata and the deployment default limits: B745."
  - "Reserving and enforcing the ITPM and OTPM quotas (reserve_io_tokens, enforce_project_io_token_quota_for_frame): B3042 and B3043. This task only builds their descriptors."
  - "Calling these builders from the pre-call hook, the order of the full descriptor list and dropping the model_per_team scope at settlement time: B3040, B3055 and B3045."
  - "_handle_rate_limit_error: B3030."

pitfalls:
  - limit_in is called on a map that may hold both the requested name and the group name (alias "gpt4" for group "gpt-4"), so the requested-name limit must be preferred and a requested-name limit of 0 must not fall through to the group.
  - model_per_key asks B745 for the key limits with model_name set to the group, not the requested name, so the deployment default is looked up under the group; the descriptor value also uses the group.
  - The three owners differ in where limits come from. model_per_key uses key then team then deployment default through B745. model_per_organization and model_per_project read only their own metadata map. model_per_team skips a kind when the key owns it, so one request can charge a key descriptor and a team descriptor for the same model.
  - The team ownership check is per kind. A key that owns only model_tpm_limit leaves the team's model_rpm_limit in force, and the descriptor is added with tokens_per_unit none.
  - get_key_own_model_rate_limit returns key metadata only when the limit map is non-empty, and builds the model_max_budget map only from entries whose rpm_limit or tpm_limit is not none; an empty result is none, so a key whose metadata holds an empty model_tpm_limit map owns nothing.
  - get_model_rate_limit_from_metadata returns none for empty or missing metadata; a present map is used whole, with no filtering to the requested model.
  - The global "organization" descriptor does not need a model, and the model one does not need a global limit; build each on its own condition.
  - The descriptor values are built by string formatting, so an absent id prints as "None" in LiteLLM ("None:gpt-4" for model_per_team without a team_id); keep that text, since two keys with no team share one counter in LiteLLM too.
  - The ITPM and OTPM descriptors have requests_per_unit none and use tokens_per_unit for their limit; model_per_project_itpm and model_per_project_otpm are separate counters from model_per_project.
  - The request-metadata key view fills only metadata and model_max_budget; missing or none values become an empty map, so the "or {}" fallback must not turn a falsy but valid map into an error.
  - window_size comes from the builder, which is LITELLM_RATE_LIMIT_WINDOW_SIZE (default 60) copied by B3055; do not read the env var here.

review_level: security

