id: B4001
title: Project and batch ClickHouse spend rows with trace context
description: >-
  Build the spend-row projection from standard logging payloads, keeping trace/session
  identity, cache counters and message privacy. Implement an injected ClickHouse batch
  writer that queues rows until a batch fills or the flush interval expires, with bounded
  retries and Lens context below tracing callers. Expose schema setup and Lens context
  helpers so tracing and Lens-consuming tasks can depend on this leaf without bringing
  in the full logger.

  Implement ClickHouseBatchLogger extending CustomBatchLogger (B256). On __init__, accept
  an optional ClickHouseStorage instance or read CLICKHOUSE_DATABASE (default "litellm")
  and CLICKHOUSE_URL (default "") via clickhouse_storage_from_env. Start a periodic flush
  task on first enqueue; flush at CLICKHOUSE_FLUSH_INTERVAL_SECONDS (default 1.0) intervals
  or when queue reaches CLICKHOUSE_BATCH_SIZE (default 10,000). Queue never exceeds
  CLICKHOUSE_MAX_BUFFERED_ROWS (default 200,000). Requeue failed batches at front before
  new arrivals; drop after CLICKHOUSE_MAX_RETRIES (default 3) failures with error log.

  Implement ClickHouseSpendLogger projecting StandardLoggingPayload to SpendLogRecord rows.
  Capture W3C traceparent header (version-traceid-parentid-flags) from custom or proxy
  request headers; reject all-zeros trace or span IDs. Strip only terminal _cache_hit[timestamp]
  suffix from request IDs to recover raw provider response ID. Spend values are float,
  matching LiteLLM's wire format. Ignore POST /v1/traces OTLP exports as non-LLM requests.
  Cache counters come from OpenAI prompt_tokens_details, with Anthropic cache fields as
  fallback. Redact messages and response when litellm.turn_off_message_logging is True.
  Both success and failure callbacks enqueue the same row.

  Build pure helper functions: parse_traceparent validates W3C format and rejects zero IDs,
  returning (trace_id, span_id) or ("", ""). strip_cache_hit_suffix removes _cache_hit[timestamp]
  suffix. Converters: _int rejects booleans, _to_ms multiplies seconds to milliseconds,
  _json serializes with default=str, _cache_tokens extracts from OpenAI or Anthropic fields,
  _find_traceparent searches custom then proxy headers case-insensitive, _request_tags
  returns list or empty, _session_id returns explicit/metadata/trace session_id or empty,
  _is_trace_ingest checks call_type prefix.

  Implement is_lens_analysis returning current flag, lens_analysis context manager setting
  True. Implement ensure_schema forwarding to ClickHouseStorage.ensure_schema with retention
  parameters. Define SPEND_LOGS_TABLE constant.
scope:
  paths:
    - crates/betterlite-logging/src/clickhouse.rs
    - crates/betterlite-logging/src/clickhouse/**
    - crates/betterlite-config/src/sections/clickhouse_spend_logging.rs
    - crates/betterlite-config/src/sections/clickhouse_spend_logging/**
  lint_tables: false
