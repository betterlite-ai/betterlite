dod:
  - text: >-
      Tool call arguments and schema descriptions are projected as string leaves; tool description is prepended. Guardrails see a single OpenAI-compatible tool definition with all texts in one apply_guardrail call.
    proof: [input-projection-tests]
  - text: >-
      Guardrail-returned texts that differ from originals are written back to their original positions. Descriptions and schemas are written back separately if rewritten; arguments preserve structure and field name keys.
    proof: [input-writeback-tests]
  - text: >-
      Arguments exceeding MAX_STRUCTURED_CONTENT_SCAN_DEPTH fail closed with HTTP 400. Schema description scanning and discovery output also fail closed when nested too deeply.
    proof: [nesting-depth-tests]
  - text: >-
      Guardrails returning wrong text count fail closed; a mismatch prevents positional write-back.
    proof: [text-count-mismatch-tests]
  - text: >-
      Two concurrent guardrails cannot both rewrite the same argument leaf to different values. Detect conflicts by comparing current leaves to scanned originals and flag mismatched rewrites.
    proof: [concurrent-conflict-tests]
  - text: >-
      Tool result content list text blocks and structuredContent string leaves are scanned together. Non-string labels that match a masking rule are rejected with HTTP 400.
    proof: [output-projection-tests]
  - text: >-
      Tool results are rewritten in place so logging payloads captured before this hook see the masked version.
    proof: [result-mutation-tests]
  - text: >-
      Absent or missing mcp_tool_name returns data unchanged. Absent mcp_arguments or empty input schema supply empty defaults to projection.
    proof: [fallback-behavior-tests]
  - text: >-
      The guardrail_translation_mappings dict maps CallTypes.call_mcp_tool and CallTypes.list_mcp_tools to MCPGuardrailTranslationHandler.
    proof: [mapping-registration-tests]

checks:
  optional: []
  commands:
    - id: input-projection-tests
      why: Tool call input (description, schema descriptions, argument leaves) is projected as separate texts in a single OpenAI-compatible tool definition.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::process_input::/)'
    - id: input-writeback-tests
      why: Guardrail-returned texts are written back only when changed; descriptions, schemas and arguments are written separately with structure preserved.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::input_writeback::/)'
    - id: nesting-depth-tests
      why: Arguments and schemas exceeding MAX_STRUCTURED_CONTENT_SCAN_DEPTH fail closed with HTTP 400.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::nesting_depth::/)'
    - id: text-count-mismatch-tests
      why: Guardrails returning wrong text count fail closed and prevent positional write-back.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::text_count_mismatch::/)'
    - id: concurrent-conflict-tests
      why: Two concurrent guardrails rewriting the same argument leaf to different values are detected and rejected with HTTP 400.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::concurrent_conflict::/)'
    - id: output-projection-tests
      why: Tool result content and structuredContent are scanned together; non-string labels that match masking rules are rejected.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::process_output::/)'
    - id: result-mutation-tests
      why: Tool results are rewritten in place so logging payloads see the masked version.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::result_mutation::/)'
    - id: fallback-behavior-tests
      why: Missing mcp_tool_name returns data unchanged; missing arguments and empty schemas supply empty defaults.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::fallback_behavior::/)'
    - id: mapping-registration-tests
      why: guardrail_translation_mappings dict maps both call_mcp_tool and list_mcp_tools to MCPGuardrailTranslationHandler.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_guardrail_translation::mapping_registration::/)'

