id: B3818
title: Translate and redact MCP discovery calls and tool results
description: >-
  Project MCP discovery call arguments and tool results into unified guardrail inputs, apply guardrails, and write back only the rewrites that guardrails actually performed. Reject incompatible output lengths, excessive nesting, conflicting concurrent argument rewrites and masking of non-rewritable structured labels.

  MCP tool calls and discovery scans arrive at guardrail translation with a tool name, optional description, input schema (for discovery only), and arguments (for calls only). `process_input_messages` builds a single-tool OpenAI-compatible shape with the tool definition from name/description/schema and every string leaf of arguments or schema descriptions as separate texts. The guardrail sees the full payload in a single call, applies its rules to every text, and returns a rewritten texts sequence. Write back only the argument leaves that changed, preserving the original structure; write back description and schema separately if they changed.

  `process_output_response` receives a CallToolResult object with a content list and optional structuredContent. Scan every text block in the content list and every string leaf of structuredContent together in a single guardrail call. Guardrails cannot rewrite non-string labels (object keys or numeric values); detect and reject any attempt. Rewrite the result object in place (not a copy) so logging that captured it before this hook runs sees the masked version.

  Tool call arguments and output responses that exceed MAX_STRUCTURED_CONTENT_SCAN_DEPTH fail closed with HTTP 400. Two guardrails running concurrently (run_in_parallel: true) cannot both rewrite the same argument leaf to different values; detect conflicts and reject. A guardrail that returns the wrong number of texts fails closed. Arguments that already hold the text this guardrail was handed, or already hold this guardrail's own replacement, are safe to write.

  Port both complete files of LiteLLM's guardrail_translation/ directory into mcp_guardrail_translation, including the guardrail_translation_mappings dict that registers call_mcp_tool and list_mcp_tools operations. Count: **233 lines** (handler.py 223 + __init__.py 10).

