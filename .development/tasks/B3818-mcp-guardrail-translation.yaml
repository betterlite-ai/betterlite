out_of_scope:
  - >-
      CustomGuardrail.apply_guardrail contract and constructor; these are injected. BaseTranslation abstract base; its implementation and subclass hierarchy. Guardrail initialization and handler dispatch (B109). Route registration and discovery endpoint ownership (other MCP umbrella tasks).
  - >-
      Utility functions for JSON leaf extraction, unrewritable label detection, MCP content item and result access (json_string_leaves, json_unrewritable_labels, mcp_content_item_text, mcp_tool_result_content_list, mcp_tool_result_structured_content, set_mcp_tool_result_structured_content, with_json_string_leaves, with_mcp_content_item_text, JSONLeafPath, MAX_STRUCTURED_CONTENT_SCAN_DEPTH). These are lower transformations owned by MCP utilities.
  - >-
      transform_mcp_tool_to_openai_tool conversion; owned by experimental MCP client tools. ProxyLogging._convert_mcp_to_llm_format; context injection and callers.
  - >-
      ChatCompletionToolParam and ChatCompletionToolParamFunctionChunk wire types; provided by openai SDK types. GenericGuardrailAPIInputs wire type; provided by unified guardrails infrastructure.

pitfalls:
  - >-
      Guardrails return the full texts array with the original length, not just the changed ones. A guardrail that returns fewer texts fails closed because positional write-back would scramble the payload.
  - >-
      Tool description masking is written separately from argument masking to mcp_tool_description and mcp_input_schema, not merged back into the arguments. Schema description leaves are separate from argument leaves in the texts array.
  - >-
      Concurrent guardrail conflicts are detected by comparing the paths of the current leaves to the scanned originals; if they do not match (structure reshaped), all replacements fail as a conflict because positional write-back would be wrong.
  - >-
      Non-string labels in structuredContent (object keys and numeric values) that match a masking rule trigger HTTP 400 rejection because they cannot be rewritten without breaking the payload contract.
  - >-
      Tool result rewriting mutates the content list and structuredContent in place rather than returning a new result. Logging that captured the object before this hook runs will see the masked version, which is the intended behavior.
  - >-
      Missing or empty mcp_tool_name skips projection and returns data unchanged; discovery operations with no tool name are silently skipped.
  - >-
      The mcp_arguments/arguments fallback applies consistently across input projection, conflict detection and writeback, preserving both field names where they coexist.

