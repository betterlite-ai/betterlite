id: B215
title: Bounded local Jinja prompt rendering
description: >-
  Implement _render_chat_template and the supplied-local-bytes portions of _fetch_and_extract_template/_afetch_and_extract_template,
  hf_chat_template/ahf_chat_template and Hugging Face token extraction. Use minijinja with minijinja-contrib pycompat
  after dependency comparison, for Python .strip() and string behavior. Disable network/filesystem loaders and inject
  strftime_now; bound template bytes, fuel and output. raise_exception returns a displayable Exception value, rendering
  Error message - <msg>; it does not raise, so system probing returns true in that case. Only real rendering errors
  trigger alternation fallback, which omits add_generation_prompt. Public input is typed LocalTemplate {chat_template,
  bos_token, eos_token}; no new config key or remote acquisition is introduced while Max decides. Budget 240 renderer/local
  extraction, 110 adapters, 330 tests/fuzz and 70 wiring (750 total). Add the prompt_template cargo-fuzz target,
  call the production parser, and commit/replay malformed and boundary seeds. Write the behavior rstest functions
  jinja_prompts_behavior_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure in the
  DoD; corpus replay tests have separate names. The helper operation jinja_prompts is already registered; each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/jinja.rs
  - crates/betterlite-prompts/src/jinja/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/prompts/jinja_prompts.rs
  - tools/oracle/src/helpers/prompts/jinja_prompts/**
  - tools/oracle/helpers/jinja_prompts.py
  - tools/oracle/helpers/jinja_prompts/**
  - tools/oracle/cases/helpers/jinja-prompts/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-prompts/fuzz/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L376-L611
  why: Rendering and supplied template extraction.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/huggingface_template_handler.py#L28-L161
  why: Clock and token/config shapes.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
- text: The outside-byte parser has its target and newly committed production replay corpus.
  proof:
  - prompt-template-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::jinja_prompts_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'jinja_prompts' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: prompt-template-corpus
    why: the required new behavior or its evidence is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-prompts/fuzz/corpus/prompt_template)"
      && test -f crates/betterlite-prompts/fuzz/fuzz_targets/prompt_template.rs && test -n "$(ls -A crates/betterlite-prompts/fuzz/corpus/prompt_template)"
      && cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(replays_the_prompt_template_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/jinja-prompts/raise-exception-value.yaml
- tools/oracle/cases/helpers/jinja-prompts/system-probe.yaml
- tools/oracle/cases/helpers/jinja-prompts/real-render-error.yaml
- tools/oracle/cases/helpers/jinja-prompts/alternation-no-generation-flag.yaml
- tools/oracle/cases/helpers/jinja-prompts/python-strip.yaml
- tools/oracle/cases/helpers/jinja-prompts/special-token-string.yaml
- tools/oracle/cases/helpers/jinja-prompts/special-token-object.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B177 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
- >-
  Remote template/tokenizer-config HTTP fetch functions remain blocked by B177 open decision; do not create an acquisition
  API or new config key.
pitfalls:
- 'The oracle helper for this task is pre-registered as jinja_prompts in the prompts group. Replace the stub Op in tools/oracle/src/helpers/prompts/jinja_prompts.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/jinja_prompts.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
