deviations:
  - what: >-
      File URL downloads are rejected at the HTTP boundary with a 400 error before reaching
      BaseRAGIngestion.upload. The proposal in the outline records that B009 explicitly withholds
      downloads under bounded-inputs, and betterlite enforces this as a pre-dispatch check in the
      ingestion route handler rather than in the base class.
    why: >-
      The configured source precedence (inline file_data wins, URL downloads are the fallback)
      is preserved in the type layer: callers can still configure a URL source and pass it to
      the pipeline. Native code validates at the HTTP boundary that URLs from request bodies are
      forbidden, matching the repository's existing security posture for download sources.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L122-L129
  - what: >-
      Chunk configuration validation (rejecting chunk_size<=0, chunk_overlap<0, or
      chunk_overlap>=chunk_size) is typed and returns before splitting. LiteLLM can hang or fail
      on nonprogressing values with the depth fallback; betterlite fails fast with a named error.
    why: >-
      Invalid configuration is a build error, not a runtime surprise. When reached inside an
      ingestion pipeline, this error returns status=failed with the error message preserved,
      matching the pipeline's existing failed-result semantics for OCR/chunk/embed/store errors.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L227-L242

out_of_scope:
  - BaseRAGIngestion.custom_llm_provider property (not called in ingestion instances; provider dispatch reads vector_store_config directly; owned by B3460).
  - BaseRAGIngestion.embed method lines 244-267 (all five registered providers override it; no caller reaches this base implementation; owned by B3460).
  - BaseRAGIngestion.ingest orchestration lines 296-371 (the full pipeline entry point is built there; owned by B3460).

pitfalls:
  - Stored credentials are loaded once at __init__; removal of absent fields (api_base, aws_sts_endpoint, aws_web_identity_token) only happens when CredentialAccessor returns values (empty dict does not trigger removal).
  - "OCR requires both ocr_config presence and file_content; either being None means OCR returns None (distinguish config presence from success)."
  - chunk rejects nonprogressing sizes before calling the splitter (zero or negative chunk_size is a config error, not a hang-on-split).
  - Fetched file_url responses use response.headers.get with default application/octet-stream (the pin literal when content-type absent).
  - "OCR base64 encoding includes content-type and semicolon exactly as data:mime/type;base64,encoded with no spaces."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 1
