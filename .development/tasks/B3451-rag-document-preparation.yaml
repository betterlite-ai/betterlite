    why: CredentialAccessor.get_credential_values from B1601 credential registry.

dod:
  - text: >-
      BaseRAGIngestion.__init__ stores ingest_options, generates ingest_id with "ingest_"
      prefix, extracts ocr/chunking_strategy/embedding/vector_store configs, and calls
      _load_credentials_from_config.
    proof: [init-lifecycle]
  - text: >-
      _load_credentials_from_config reads litellm_credential_name from vector_store_config,
      fetches stored values via B1601's CredentialAccessor, merges them into
      vector_store_config, and removes api_base/aws_sts_endpoint/aws_web_identity_token if
      absent from stored values.
    proof: [credential-load]
  - text: >-
      upload precedence: file_data tuple returns immediately, file_url fetches via RAG client
      and parses headers, file_id returns as existing_file_id, else raises ValueError.
    proof: [upload-precedence]
  - text: >-
      upload fetches file_url through get_async_httpx_client(RAG provider) and async_safe_get,
      extracting content-type from response headers and generating filename from URL path.
    proof: [upload-fetch]
  - text: >-
      ocr reads model from ocr_config (default mistral/mistral-ocr-latest), detects image vs
      document content-type, encodes file_content as base64 data URL, calls router.aocr or
      litellm.aocr, and extracts markdown text from pages.
    proof: [ocr-dispatch]
  - text: >-
      chunk reads chunk_size (default 1000), chunk_overlap (default 200), separators from
      chunking_strategy, extracts text from OCR result or UTF-8 file decode or PDF extraction,
      splits via RecursiveCharacterTextSplitter, and returns chunks.
    proof: [chunk-splitting]
  - text: >-
      chunk validates chunk_size > 0, chunk_overlap >= 0, and chunk_overlap < chunk_size,
      raising a typed configuration error on violation.
    proof: [chunk-validation]
  - text: >-
      store is an abstract async method returning (vector_store_id, file_id) tuple;
      provider subclasses implement it.
    proof: [store-contract]
  - text: >-
      ocr returns None when ocr_config is absent or file_content is empty, and chunk returns
      empty list on UTF-8 decode failure, PDF extraction failure, or when no text source is
      available. Other exceptions from ocr and chunk propagate to the caller (caught by the
      ingestion pipeline in B3460).
    proof: [ocr-dispatch, chunk-splitting]

