id: B3451
title: RAG ingestion state and document preparation
description: >-
  Build reusable ingestion state, credential overlay and source/OCR/chunk preparation
  in `betterlite-core::rag`, with an injected OCR operation. Keep upload-source precedence,
  remove caller endpoint overrides absent from a stored credential, and distinguish upload
  failure from the later pipeline's failed-result envelope.

  BaseRAGIngestion constructor stores ingest_options (OCR config, chunking strategy,
  embedding config, vector store config, ingest name) and generates an ingest_id prefixed
  with "ingest_". Load stored credentials from litellm_credential_name in vector_store
  config, with stored values winning and removing absent api_base, aws_sts_endpoint,
  aws_web_identity_token from caller-supplied values.

  upload method returns (filename, file_content, content_type, existing_file_id) by
  precedence: file_data tuple, file_url fetched through the RAG HTTP client, or existing
  file_id. File URL is the configured source when no file_data is present; an absent
  configured source raises ValueError. Fetched URL responses provide headers for content-type
  and generate default filename from the last path segment.

  ocr method performs OCR on file content when ocr_config is present and file_content is
  not None. Reads ocr model from config (default mistral/mistral-ocr-latest), detects
  content-type (image vs document), encodes file_content as base64 data URL, calls router
  aocr if available (with vector_store_config as router), else litellm.aocr, and extracts
  text from response pages. Returns extracted text or None.

  chunk method splits text into chunks using RecursiveCharacterTextSplitter from B3450,
  reading chunk_size (default 1000), chunk_overlap (default 200), and separators from
  chunking_strategy. Text comes from OCR output if present, else UTF-8 decode of
  file_content with PDF fallback (via B3450's extract_text_from_pdf), else empty list.
  Rejects chunk_size<=0, chunk_overlap<0, or chunk_overlap>=chunk_size with a typed
  configuration error.

  abstract store method declares the typed storage-operation contract as abstract;
  provider subclasses implement it with their backend. It takes file_content, filename,
  content_type, chunks, embeddings and optional existing_file_id; returns (vector_store_id,
  file_id). This task builds only the interface; no backend implementation.

  Import and declare all records and enums from litellm/rag/ingestion/base_ingestion.py,
  including supports_existing_file_id=False. This is the file's default owner; B3460
  owns ingest and the HTTP route. The unused custom_llm_provider property and overridden
  base embedding implementation are excluded.

