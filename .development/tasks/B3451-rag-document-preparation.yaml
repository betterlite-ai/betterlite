    why: ocr encodes base64 data URL, calls router/litellm aocr, extracts markdown pages.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L184-L242
