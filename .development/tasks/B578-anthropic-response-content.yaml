id: B578
title: Anthropic reply content and tool-result projection
description: >-
  Add AnthropicContentReply projection to existing OpenAI choices, preserving text concatenation, citations with
  supported_text, thinking/redacted thinking, compaction, web-search results, code-execution outputs and JSON-mode
  mixed tool calls. Keep provider-specific fields in the established named passthrough slot; raw content never enters
  diagnostic text.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig.convert_tool_use_to_openai_format L357-L384; AnthropicConfig._resolve_json_mode_non_streaming
  L2130-L2160; AnthropicConfig.extract_response_content L2162-L2253; AnthropicConfig._build_code_by_id_map L2469-L2482;
  AnthropicConfig._build_code_interpreter_results L2484-L2507; AnthropicConfig._build_web_search_calls L2509-L2536;
  AnthropicConfig._build_provider_specific_fields L2538-L2582; AnthropicConfig._convert_tool_response_to_message
  L2762-L2785. litellm/llms/base_llm/base_utils.py: _convert_tool_response_to_message L114-L137.


  Named case contracts: text_and_citations: Concatenate required text fields without separators; collect citations
  as a nested list per block having citations non-None (including []), overriding each supported_text with block.text
  default empty. Unknown blocks can contribute citations; tool_search_tool_result is skipped before citation handling.
  tool_use_index: tool_use and server_tool_use require id/name/input; emit type=function with JSON-dumped input,
  preserving caller by key presence including None. Index is original content position, not dense tool-call count.
  Preserve literal name before later B580 reversal. thinking_redacted_content: Keep thinking/redacted_thinking blocks
  verbatim; no blocks gives None reasoning_content, any blocks gives concatenation of non-None thinking fields,
  possibly empty string. Do not remove signature-only blocks here. json_tool_only: Only literal json_mode=True and
  at least one tool named json_tool_call activates projection. If all tools are internal, convert only first internal
  arguments and discard all tool calls; first arguments=None instead preserves all calls and no message. Missing
  internal tools or falsey/nonliteral mode leaves list unchanged. json_tool_with_real_tools: Mixed tools remove
  every json_tool_call and convert only first internal arguments to extra content; real tool order/indices preserved
  even if first internal arguments is None. Conversion JSON parses first arguments; non-None dict values field (including
  false/zero/empty) is JSON-dumped instead of whole object, values=None keeps the object. Malformed JSON returns
  original argument text; None returns no message. Run the identical shared base_utils helper through these same
  case rows. web_search_tool_results: web_search_tool_result and web_fetch_tool_result remain raw provider web_search_results.
  Build B902 web_search_calls only for result dict type=web_search_tool_result with string tool_use_id matching
  same-response server_tool_use name=web_search with mapping input; last duplicate input id wins, web-fetch/unmatched
  results produce no call. code_interpreter_output: Other *_tool_result blocks remain raw tool_results except tool_search_tool_result,
  which is omitted. Only bash_code_execution_tool_result yields code_interpreter_call with status=completed, tool_use_id
  default empty, code from parsed tool argument command keyed by string id (last wins, nonstring command -> empty;
  all parse exceptions swallowed), container dict id or None, and B902 stdout/stderr log projection. Other code-execution
  result types do not produce a normalized interpreter call. compaction_provider_field: Always include provider
  citations/thinking_blocks even None. Include context_management/container when non-None, web_search_results plus
  calls when not None even empty, tool_results plus interpreter results when not None, and compaction_blocks when
  not None; preserve all raw compaction block fields.


  B902 owns build_web_search_call and build_code_interpreter_log_outputs; reuse those exact parsed-record projections
  rather than a separate Responses model. decode_json_mode_arguments handles both argument-to-message conversion
  and code-command extraction, preserving their different failure handling.


  Implement crates/betterlite-anthropic/src/response_content.rs with adjacent tests under response_content/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function response_content_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): text_and_citations, tool_use_index, thinking_redacted_content, json_tool_only, json_tool_with_real_tools,
  web_search_tool_results, code_interpreter_output, compaction_provider_field. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_response_content* using HelperCase:
  kind: helper and the externally tagged anthropic_response_content variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_anthropic_response_content that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  Outside-byte boundary: decode_json_mode_arguments consumes provider JSON tool-argument strings in crates/betterlite-anthropic/src/response_content.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_response_content.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_response_content.
  The adjacent test replays_the_anthropic_response_content_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 276 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 300 production lines, 240 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 730 planned, 750 maximum changed lines.
