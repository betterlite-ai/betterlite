id: B578
title: Anthropic reply content and tool-result projection
description: >-
  Add AnthropicContentReply projection to existing OpenAI choices, preserving text concatenation, citations with
  supported_text, thinking/redacted thinking, compaction, web-search results, code-execution outputs and JSON-mode
  mixed tool calls. Keep provider-specific fields in the established named passthrough slot; raw content never enters
  diagnostic text.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig.convert_tool_use_to_openai_format L357-L384; AnthropicConfig._resolve_json_mode_non_streaming
  L2130-L2160; AnthropicConfig.extract_response_content L2162-L2253; AnthropicConfig._build_code_by_id_map L2469-L2482;
  AnthropicConfig._build_code_interpreter_results L2484-L2507; AnthropicConfig._build_web_search_calls L2509-L2536;
  AnthropicConfig._build_provider_specific_fields L2538-L2582; AnthropicConfig._convert_tool_response_to_message
  L2762-L2785.


  Implement crates/betterlite-anthropic/src/response_content.rs with adjacent tests under response_content/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_response_content in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function response_content_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): text_and_citations, tool_use_index, thinking_redacted_content, json_tool_only, json_tool_with_real_tools,
  web_search_tool_results, code_interpreter_output, compaction_provider_field. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert
  both client response and captured upstream request. Existing API tasks retain route registration; this task must
  not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_response_content* using HelperCase:
  kind: helper and the externally tagged anthropic_response_content variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_anthropic_response_content that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  Outside-byte boundary: decode_json_mode_arguments consumes provider JSON tool-argument strings in crates/betterlite-anthropic/src/response_content.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_response_content.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_response_content.
  The adjacent test replays_the_anthropic_response_content_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 257 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 564 planned, 575 maximum changed lines.
