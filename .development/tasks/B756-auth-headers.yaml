id: B756
title: Authentication header selection and mode dispatch
description: >-
  Implement CredentialHeaders and AuthMode selection over B003 six-key-header support, custom key header
  and pass-through endpoint configuration. Unverified JWT claims may select an installed validator but
  cannot grant permissions; do not register JWT/custom implementations here. Preserve bearer parsing,
  duplicated-header precedence and mode overrides through typed selectors.


  Both bearer helpers recognize only Bearer, bearer and Basic followed by a space and remove all
  occurrences of that exact prefix after the starts-with check; they neither trim nor decode Basic.
  AWS4-HMAC-SHA256 uses Credential=Bearer followed by whitespace first, then plain Credential=,
  stopping at slash, whitespace or comma. The permissive helper preserves unmatched input; the strict
  helper returns an empty string, including malformed AWS credentials. Unknown case BEARER is not
  recognized. get_api_key chooses custom-header string even empty, then nonempty Authorization,
  then Azure, Anthropic, Google and APIM header strings even empty, then a truthy generateContent
  query key, finally exact configured pass-through paths. It returns the original passed_in_key too;
  multiple matching pass-through declarations overwrite in list order. B003 owns duplicate wire headers.


  The second pass-through check normalizes the root via B2302 and accepts mapped path prefixes;
  litellm_user_api_key replaces the credential even when empty. Exact configured paths default auth
  to true; any value that is not exactly true returns an empty UserAPIKeyAuth immediately. The langfuse
  parser strips Basic plus whitespace, base64-decodes UTF-8 and takes text before the first colon;
  malformed base64/UTF-8 propagates. Its other custom-header branch executes only for dict headers,
  not Starlette's normal Headers object. Preserve that distinction in helper cases.


  Custom-header-name lookup lowercases names and the received header map. A truthy value uses the
  strict parser and logs only its abbreviation; missing/empty logs the missing-header exception text
  and returns empty. Do not reproduce the source DEBUG dump of all request headers: the native logger
  records names only. Public-route normalization strips trailing slashes except root; metrics always
  requires auth unless litellm.require_auth_for_metrics_endpoint is exactly false, regardless of
  general_settings. Development no-auth mode requires master_key is null (empty does not count) and
  all enable_jwt_auth/enable_oauth2_auth/enable_oauth2_proxy_auth flags falsey; custom auth is not a flag.


  A null routing selector matches anything. Otherwise stringify scalar/list selectors and claims;
  absent claims fail, empty lists never match. All iss/client_id/scope/aud selectors must match, with
  any cross-product value accepted per selector. Only scope splits a stripped string containing an
  internal ASCII space; tabs alone do not split. Case-sensitive fnmatch runs only if selector has * or ?;
  a bracket-only selector is literal. For nonscope wildcard matching, any claim whitespace blocks a
  match; exact full-string matches may contain spaces. Empty/missing overrides or unreadable B760
  unverified claims return false. First matching path=oauth2 logs DEBUG and selects introspection,
  without granting identity. B890 is_admin maps get_rbac_role to PROXY_ADMIN or TEAM.


  Build the production auth_headers module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _normalize_public_auth_route (L160-L163; 4 source lines), _route_requires_auth_despite_public (L166-L171;
  5 source lines), _get_bearer_token_or_received_api_key (L491-L511; 16 source lines), _routing_selector_matches_claim
  (L514-L552; 26 source lines), _matches_routing_override (L555-L565; 11 source lines), _should_route_jwt_to_oauth2_override
  (L568-L582; 12 source lines), _get_bearer_token (L585-L610; 22 source lines), get_rbac_role (L793-L798;
  6 source lines), get_api_key (L801-L858; 57 source lines), check_api_key_for_custom_headers_or_pass_through_endpoints
  (L861-L905; 34 source lines), get_api_key_from_custom_header (L3580-L3612; 30 source lines), is_no_auth_dev_mode
  (L2747-L2751; 5 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.require_auth_for_metrics_endpoint=True;
  litellm_jwtauth.routing_overrides=None.


  general_settings.litellm_key_header_name=None; query ?key=
  supplies credentials only on generateContent routes. pass_through_endpoints remains unavailable until
  B102 installs PassThroughRegistry, where a missing auth-key declaration defaults to enforced authentication.


  Add the auth_headers operation under B856 Management::auth. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-headers-*
  seed to B171 helper_case, which already owns this decoder.


  Real requests exercise credential precedence, custom header emptiness and the metrics override
  through B732 state. Record the chosen validator without trusting unverified JWT selectors as grants.


  Give each competing header a different B860 fixture key, using POSTGRES_TEST_URL or testcontainers,
  so the response identity proves precedence rather than merely accepting either credential.


  Write betterlite-config::auth_headers::tests::metrics_default_true_and_explicit_false,
  general_settings_metrics_is_not_read_here, routing_overrides_default_none_and_validation,
  custom_header_name_default_none, passthrough_auth_default_true and no_auth_mode_flags.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary auth_headers::decode_auth_headers(&[u8]) -> Result<TypedValue,DecodeError>
  for credential value bytes, including the langfuse base64 payload; B003 already parses HTTP headers
  and B002 parses configured names. Production calls this decoder before its typed
  policy functions; the cargo-fuzz target auth_headers calls that same function. Seed valid, truncated,
  malformed, duplicate-field and limit-boundary inputs and add auth_headers::tests::replays_the_auth_headers_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; cap any otherwise unbounded credential
  value at 1048576 bytes. There is no JSON-depth limit on a header string. Return auth_error
  401 without echoing credentials on the native limit branch, without panicking or
  fetching URLs. B733 owns crates/betterlite-auth/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  Authentication-mode services are injected independently of the MIT header parsers. B102 installs
  the passthrough registry later through B2302; configured unavailable modes fail initialization.


  Sizing: allow 228 production, 260 table-driven tests, 80 helper adapters, 90 wiring, 55 decoder/fuzz
  and 60 config lines, 773 changed lines within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: credential_size_limit_rejects_without_echo,
  custom_header_logs_never_contain_header_values.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Server wiring tests live under betterlite-server::auth::auth_headers::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
