id: B709
title: Postgres migrations for agent identity
description: >-
  Finish the pinned SQL catalog with the seven scoped migrations after B708. Store exact bytes under
  their original names, including agent_engine followed by lens_run_history and rename_lens. Implement
  schema_agent_identity tests for table defaults, identity uniqueness, delete effects and the final
  rename; B873 owns running the catalog and writing deployment history. This task does not implement
  identity authentication or a new migration recovery service.

  AgentsTable gains required enabled=true, execution_mode='autonomous', identity_managed=false and
  later nullable JSONB kill_switch. SpendLogs.billing_agent_id is nullable TEXT. AgentIdentity has
  agent_id TEXT primary key, active=true, required provider/issuer/tenant_id/client_id/revision, nullable
  service_principal_id/last_authenticated_at, nullable required_roles TEXT[] default [] and nullable
  required_scopes TEXT[] default ['user_impersonation']. The arrays remain nullable despite their
  defaults. Unique indexes cover (provider,tenant_id,client_id) and (issuer,service_principal_id);
  multiple null principals under one issuer are allowed when the provider tuple differs.

  RetiredAgentIdentity has binding_id TEXT primary key, nullable agent_id and required provider/issuer/
  tenant_id/client_id, with its own unique provider tuple. SQL does not enforce uniqueness across live
  and retired tables. RetiredAgent has original_agent_id TEXT primary key and required retired_at now,
  with no foreign key back to AgentsTable. VerifiedSubject requires subject_id/issuer/tenant_id/oid,
  kind='human', verified_via='sso_interactive' and verified_at now, nullable user_id, a user lookup index
  and unique (issuer,tenant_id,oid). These TEXT defaults are not enum CHECK constraints.

  AgentIdentity.agent_id deletes CASCADE and updates CASCADE from AgentsTable. RetiredAgentIdentity's
  nullable agent_id deletes SET NULL and updates CASCADE instead, preserving retired binding records.
  VerifiedSubject.user_id deletes and updates CASCADE from UserTable. The migration does not create
  a RetiredAgent record when an agent is deleted; that is application behavior. Preserve the named
  foreign keys and their source conname guards. MCPServer.pinned_tools is nullable JSONB default {};
  adding it neither validates tool schemas nor fetches a server.

  DailyModelUsage has composite primary key (date,model_group,model,custom_llm_provider,task_type),
  all required TEXT. DOUBLE PRECISION spend and BIGINT prompt_tokens/completion_tokens/request_count/
  successful_requests/failed_requests default 0. created_at defaults now, updated_at is required
  without default, and separate indexes cover date/model_group. No NULL dimension is permitted here,
  unlike the earlier daily-spend tables.

  Engine initially has id TEXT primary key, required INTEGER version=0 and JSONB data without default.
  EngineWorker has id primary key, required unique TEXT token_hash and required JSONB data. EngineRun
  requires id primary key, engine_id, created_at without default and JSONB data, with an
  (engine_id,created_at) index and no engine foreign key. The final DO block renames tables in order
  Engine to Lens, EngineRun to LensRun and EngineWorker to LensWorker; it renames engine_id to lens_id
  only if pg_attribute finds a live old column through to_regclass('"LiteLLM_LensRun"'). Then rename
  all three primary-key indexes, the worker token_hash unique index and the run lookup index to their
  Lens spellings. Preserve OIDs, rows, version/data/token_hash bytes and uniqueness. A repeated rename
  with only final names is a no-op, but an occupied destination name is an error; do not merge tables
  or discard either. A late index-rename collision rolls back the DO statement's earlier renames.


  Use B700 query sessions and B860's independent temporary database fixtures, preferring
  POSTGRES_TEST_URL and starting testcontainers only when absent. Compare all column/default/nullability,
  unique-index and foreign-key facts with separately applied pinned SQL, and clean up on failures.
  The seven files contain 121 nonblank, noncomment SQL lines and cost 155 physical production lines;
  allow 230 Postgres/identity test lines plus 30 registration lines, 415 within 450. No byte parser or
  HTTP adapter is added; keep adjacent test modules below 300 lines.
