dod:
  - text: pinned_sql_checksums validates the seven exact files/order; postgres_catalog compares all column defaults and named index/FK definitions against independent SQL application.
    proof: [behavior-tests, postgres-tests]
  - text: 'postgres_identity_defaults covers agent_enabled_autonomous_unmanaged,
      billing_agent_and_kill_switch_nullable, identity_active_and_nullable_role_scope_defaults,
      identity_provider_tuple_unique, issuer_principal_unique_with_nulls,
      live_and_retired_tuple_uniqueness_separate, retired_timestamp_no_agent_fk,
      verified_human_interactive_defaults_and_unique_subject, text_defaults_not_enum_checks,
      agent_delete_live_cascade_retired_set_null, user_delete_subject_cascade,
      identity_parent_updates_cascade and no_automatic_retired_record.'
    proof: [postgres-tests]
  - text: 'postgres_usage_and_lens covers pinned_tools_nullable_empty_object,
      daily_model_five_counters_zero_required_dimensions_and_updated_at,
      engine_zero_version_required_json, worker_unique_hash_unchanged,
      engine_run_required_created_at_without_fk, lens_names_and_five_index_renames,
      rename_preserves_oids_rows_and_hash_bytes, rename_already_final_noop,
      rename_existing_destination_error and late_index_collision_rolls_back_do.'
    proof: [postgres-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_agent_identity::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Identity defaults/deletion or the data-preserving Lens rename differs from the pinned SQL.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_agent_identity::tests::postgres_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B708 supplies preceding SQL; B701 verifies the complete final schema and B873 records migration execution.
  - B2305 validates MCP pinned-tools values and B858 projects them into MCP rows; this migration only adds the JSONB column.
  - Agent authentication and Lens worker token hashing are runtime callers; this SQL retains existing token_hash bytes and creates no credential codec.
pitfalls:
  - required_scopes defaults to user_impersonation but still accepts NULL at the database layer.
  - Deleting an agent removes its live identity while retaining the retired binding with agent_id=NULL.
  - Engine-to-Lens renaming includes index names; renaming only tables leaves the pinned catalog mismatched.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
