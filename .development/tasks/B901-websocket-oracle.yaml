  why: Lines 35-107 supply the OpenAI base URL https://api.openai.com/, Authorization and conditional OpenAI-Beta headers, URL scheme/path rewriting, query insertion and the None event-normalizer result.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/realtime/handler.py#L109-L190
  why: Lines 109-190 define api_base and api_key failure order, query_params=None model insertion, the connect metadata and max-size setting, plus InvalidStatus delegation and the 1011 exception close.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L648-L707
  why: >-
