id: B901
title: Websocket oracle
description: >-
  Add a bounded WebSocket transcript format and driver to betterlite-oracle. The worker owns the transcript parser,
  scripted client/provider peers, direction-aware comparison, barrier scheduling, gateway-driver wiring, and the
  service-driver process seam. Existing HTTP and helper cases keep their current dispatch and startup paths; this task
  adds the WebSocket path without changing those paths.

  A fixture in tools/oracle/cases/harness/websocket-oracle/ has kind: websocket. Its handshake must carry path,
  headers, requested_subprotocols, expected_http_status and negotiated_subprotocol. Each frame has exactly one of text
  or binary, direction client_to_provider or provider_to_client, action send or expect, and an optional barrier name.
  The close record has initiator client or provider, an integer code and a reason string. The comparator keeps client and
  provider sequences independent: provider [ready, delta] and client [setup, followup] still match when the global
  arrival order is setup, ready, delta, followup. A client send bearing barrier after_provider_ready waits until the
  provider observation named after_provider_ready has been recorded. A pre-upgrade refusal is represented by the HTTP
  handshake status and has no accepted WebSocket close frame.

  OracleLimits rejects a case with more than 1024 frames, a text or binary payload larger than 1_048_576 bytes, more
  than 16_777_216 captured traffic bytes, or an execution lasting more than 120 seconds. The boundary values 1024,
  1_048_576, 16_777_216 and 120 seconds are accepted. decode_ws_case(bytes, &OracleLimits) is the only production
  decoder for the bounded YAML. It rejects an unknown field or duplicate field before starting either peer, resolves a
  binary fixture only below tools/oracle/fixtures/websocket-oracle/, and rejects a path such as ../outside.bin. A
  decoded case cannot create an unbounded allocation, detached task or unreaped child. The fuzz target and
  websocket_oracle::tests::replays_corpus call decode_ws_case directly.

  The gateway driver boots both proxies and selects a route from the booted gateway. It supports the three pinned
  aliases /openai/v1/realtime, /v1/realtime and /realtime. A valid model=realtime-a handshake expects HTTP 101 and
  one upstream connection for each alias. With valid authentication, no model and no intent expects bare HTTP 403 before
  upgrade; intent=transcription with no model authorizes gpt-realtime-whisper and sends upstream only
  intent=transcription. Only explicit model and intent enter the upstream query. For guardrails=" first, ,second ",
  the route observation is data.guardrails=["first","second"] and no upstream guardrails key. The first nonempty
  trimmed token in Sec-WebSocket-Protocol=" realtime, second " is negotiated as realtime; an absent protocol header
  leaves negotiated_subprotocol empty. A gateway case selecting a service driver is rejected before a socket starts.

  The externally tagged service driver accepts only native_responses_relay, managed_responses_turns and realtime_probe.
  It sends one JSON object on stdin, {operation: <service tag>, input: <typed arguments and scripted frames>}, to
  tools/oracle/helpers/websocket_dispatch.py as a fresh bounded child. The child returns one JSON object on stdout,
  either {ok: <transcript result>} or {error: {class, status, type, param, code, message}}, and writes diagnostics on
  stderr. register_service(tag, adapter) is the only registration point; an unknown tag fails before a service or
  upstream connection starts. B943, B945 and B1011 register their own tags once and service execution uses the native
  service entry point, not a FastAPI handler. A service connects independently to its scripted upstream WebSocket.

  Provider fixtures preserve these pinned OpenAI realtime observations. query_params=None becomes {model: realtime-a}
  for the service call, query_params={} stays empty, and a nonempty mapping keeps its supplied key/value order. The
  default base https://api.openai.com/ becomes wss://api.openai.com/v1/realtime; http://provider.test/ becomes
  ws://provider.test/v1/realtime; the path is always /v1/realtime. OpenAI-Beta: realtime=v1 is forwarded only when
  the client sent that header. api_key=None returns ValueError with message "api_key is required for OpenAI realtime
  calls". Auth fixtures compare Authorization: Bearer sk-test before api-key: sk-test, then the first matching
  openai-insecure-api-key.sk-test subprotocol. No credential returns HTTP 403 detail "No API key provided" after an
  attempted close code 1008; Authorization: Basic wrong returns HTTP 403 detail "Invalid Authorization header format"
  after the same attempted code.

  After the client receives HTTP 101, an upstream handshake refusal status 401, 403, 429 or 503 produces an error event
  of type server_error with the literal message "Upstream realtime handshake rejected with HTTP <status>" and closes
  with 1008, 1008, 1013 or 1011 respectively. The event has no param or code field. These four status-to-close-code
  values and the message are compared from B1004's pinned realtime_errors.py contract. B901 adds no database write,
  environment read, warning-and-drop branch or provider transform; its adapters record observations and return them to
  the transcript comparator. B1011/B528 supply resolved values for REALTIME_CREDENTIAL_RESOLUTION_TIMEOUT_SECONDS
  (LiteLLM's unset default is the string "20.0", parsed as 20.0) and
  REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES (LiteLLM's unset default is None); B901 does not load either variable.

  Implement tools/oracle/src/websocket_oracle.rs and websocket_driver modules with typed records plus injected clock,
  transport, repository and resolved-settings interfaces. Add behavior tests named transcript_schema, bounded_inputs,
  direction_order, barrier_gates_send, preaccept_status, route_aliases, service_driver_isolation, realtime_route_inputs,
  provider_preparation, websocket_auth, upstream_refusal and changed_peer under websocket_oracle::tests. Keep
  websocket_oracle::tests::replays_corpus as the sole corpus replay name. Self-check must continue to run existing
  health and chat HTTP cases through their old driver.

  LiteLLM ownership is protocol context only: B1125 owns proxy_server.py:12856-13045 and all three route aliases; B528
  owns every OpenAIRealtime callable in handler.py:35-190; B756 owns user_api_key_auth_websocket_for_model in
  user_api_key_auth.py:648-707; B1004 owns realtime_errors.py:41-71; and B1011/B528 own the two environment-backed
  constants. B901 owns no LiteLLM callable. The pinned README documents /v1/realtime, intent=transcription,
  /v1/realtime/client_secrets, /v1/realtime/transcription_sessions and providers OpenAI, Azure OpenAI, Bedrock,
  Vertex AI and xAI. The source references below are the checked protocol inputs for the fixtures, not new ownership.

  Sizing: the task owns 0 nonblank, non-comment LiteLLM implementation lines. Allow 330 implementation/tooling lines,
  125 native behavior-test lines, 95 transcript-fixture lines, 60 decoder fuzz/replay lines and 30 wiring lines, for a
  640-line changed-line budget. Its direct implementation input is B171's oracle runner and URL path encoding; route
  and provider tasks register adapters and consume this harness.
