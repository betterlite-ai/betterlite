id: B901
title: Websocket oracle
description: >-
  Extend the oracle with independently executed WebSocket transcripts, preserving gateway startup, bounded transport
  and existing HTTP/helper dispatch.


  Use kind: websocket and tools/oracle/cases/websocket/<domain>/*.yaml. Transcript fields: handshake (path, headers,
  requested subprotocols, expected HTTP status and negotiated subprotocol), frames (direction client_to_provider
  or provider_to_client, action send or expect, text or binary fixture, optional barrier), and close (initiator,
  code, reason). Scripts drive sends while observations are compared per direction; do not impose a single total
  order on concurrent relays. A barrier gates the next send until named observations occur. Capture pre-accept refusal
  as HTTP 403, not an accepted close frame. Fixtures live only under tools/oracle/fixtures/websocket-oracle/; cap
  frames at 1024, each frame at 1 MiB, total capture at 16 MiB and execution at 120 seconds. decode_ws_case reads
  bounded transcript YAML; the sole replay test is websocket_oracle::tests::replays_corpus. Self-check also runs
  existing health/chat HTTP cases.


  The default driver is gateway and always boots both proxies. A separate service driver is an externally tagged
  ServiceCall with typed arguments and scripted client frames: native_responses_relay, managed_responses_turns or
  realtime_probe. It invokes only the pinned native service entry point, never a FastAPI route; the Rust driver
  invokes the corresponding production service. Both independently connect to the scripted B901 upstream WebSocket
  server, capture handshake/frames/close, and receive a bounded scripted client sink. This makes lower service tasks
  testable without depending on a route that calls them. Service adapters are registered by the service-owning tasks;
  gateway route/auth cases may not select this driver.


  Implement tools/oracle/src/websocket_oracle.rs. Use WebsocketOracleInput and WebsocketOracleResult with typed
  nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Define OracleLimits for the concrete harness caps above; product ApiLimits is not a tooling dependency.


  Write adjacent tests.rs behavior functions per_direction_order, barrier_gates_send, preaccept_http_status, service_driver_isolation,
  rejects_unknown_field, rejects_duplicate_field, detects_changed_peer, rejects_oversize_input, preserves_legacy_cases
  under websocket_oracle::tests. Each named function drives production code and asserts its case result; use named
  rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-oracle::websocket_oracle::decode_ws_case(bytes: &[u8], limits:
  &OracleLimits), for bounded transcript YAML. Place its implementation in tools/oracle/src/websocket_oracle.rs
  and call it from the actual boundary. The cargo-fuzz target tools/oracle/fuzz/fuzz_targets/websocket_oracle.rs
  passes arbitrary bounded bytes to that exact decoder; websocket_oracle::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  This task owns the declarative types/tooling boundary named above, not additional LiteLLM callables. Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 0 owned nonblank/non-comment/non-docstring Python lines (0 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 320 implementation,
  94 behavior tests, 80 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 584 total within the 590-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
