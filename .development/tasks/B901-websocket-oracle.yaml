- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_errors.py#L41-L71
  why: >-
    Lines 41-71 are B1004's checked close contract: 401 and 403 map to 1008, 429 maps to 1013, every other status
