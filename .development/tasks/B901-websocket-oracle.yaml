- tools/oracle/cases/harness/websocket-oracle/changed-peer.yaml
deviations: []
out_of_scope:
- >-
  B1125 owns the complete proxy_server.py:12856-13045 call graph, including _realtime_query_params_template,
  _release_realtime_budget_reservation, _release_realtime_max_parallel_slot, _reject_realtime_session, its nested
  return_body and realtime_websocket_endpoint. It also owns the three route aliases, route authentication handoff,
  guardrail lifecycle, redaction, cleanup order, database/budget effects and every warn-and-drop debug path in that
  range; B901 only supplies transcript inputs and records observations.
- >-
  B528 owns the complete OpenAIRealtime handler.py:35-190 call graph: _get_default_api_base, _get_additional_headers,
  _get_ssl_config, _construct_url, _make_event_normalizer and async_realtime. B901 does not open a provider socket or
  read provider settings.
- >-
  B756 owns user_api_key_auth_websocket_for_model and its nested return_body in user_api_key_auth.py:648-707, including
  Authorization/api-key/subprotocol precedence, user key lookup and the 403/1008 failure paths.
- >-
  B1004 owns realtime_errors.py:41-71, including client_close_code, upstream_handshake_close_code and
  close_after_upstream_handshake_refusal. B901 tests their 401/403/429/503 outputs through a mock provider but does not
  reimplement the mapping or event serializer.
- >-
  B1011 and B528 own loading REALTIME_CREDENTIAL_RESOLUTION_TIMEOUT_SECONDS (unset string default "20.0", parsed as
  20.0) and REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES (unset default None). B901 receives resolved settings and
  performs no environment read.
- >-
  Provider frame transformations, route lifecycle calls, credential persistence, database writes and provider-specific
  service adapters remain with B1004, B1125, B528, B756, B943, B945 and B1011 as applicable; B901 has no database or
  warning-and-drop behavior of its own.
pitfalls:
- 'The oracle helper for this task is pre-registered as websocket_oracle in the oracle group. Replace the stub Op in tools/oracle/src/helpers/oracle/websocket_oracle.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/websocket_oracle.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  A preaccept refusal is reported by the HTTP handshake, so storing the route's attempted 1008 as an accepted client
  close makes a valid 403 transcript fail.
- >-
  The transcription fallback has two different values: route authorization uses gpt-realtime-whisper, while the
  explicit upstream query contains only intent=transcription; one fixture field must not be reused for the other.
- >-
  The first matching credential subprotocol is not the negotiated protocol: auth extracts
  openai-insecure-api-key.sk-test, while the route negotiates the first nonempty token realtime.
- >-
  A duplicate YAML mapping key can be silently overwritten by a generic YAML value parser; duplicate detection must
  happen before typed decoding and before child startup.
- >-
  The refusal table's 503 entry is the default 1011 branch rather than an explicit dictionary entry; a status-only
  lookup that handles only the listed 401, 403 and 429 keys produces the wrong transcript.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
