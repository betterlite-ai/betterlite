oracle_cases: []
deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
pitfalls:
- Realtime OpenAI forces upstream /v1/realtime and rewrites http:// to ws://.
- OpenAI-Beta is forwarded only if the client sent it; the first requested subprotocol is echoed.
- WebSocket credentials may arrive through Authorization, api-key or an openai-insecure-api-key. subprotocol.
review_level: standard
budget:
  max_changed_lines: 590
  max_new_expects: 0
