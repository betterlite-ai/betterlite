dod:
- text: >-
    transcript_schema decodes kind=websocket with path=/v1/realtime, headers={}, requested_subprotocols=[],
    expected_http_status=101, negotiated_subprotocol=null, one text client_to_provider send and one text
    provider_to_client expect; the same decoder rejects an unknown field and a duplicate field before either peer
    process is started.
  proof:
  - case-transcript-schema
- text: >-
    bounded_inputs rejects 1025 frames, a 1_048_577-byte frame, 16_777_217 captured bytes and a 121-second
    execution, while accepting exactly 1024 frames, 1_048_576 bytes, 16_777_216 bytes and 120 seconds; a binary
    fixture path ../outside.bin is rejected and a timed child is reaped.
  proof:
  - case-bounded-inputs
  - parser-corpus
- text: >-
    direction_order accepts provider frames [ready, delta] and client frames [setup, followup] in global order
    setup, ready, delta, followup, and barrier_gates_send holds client send followup until provider observation
    after_provider_ready exists.
  proof:
  - case-direction-order
  - case-barrier-gates-send
- text: >-
    preaccept_status records a route refusal as HTTP 403 with no accepted close frame, while route_aliases selects
    /openai/v1/realtime, /v1/realtime and /realtime exactly once and boots both proxies without duplicate route
    registration.
  proof:
  - case-preaccept-status
  - case-route-aliases
  - gateway-self-check
- text: >-
    service_driver_isolation dispatches native_responses_relay, managed_responses_turns and realtime_probe only to
    their registered typed adapters, rejects an unknown tag before opening a socket, and rejects service-driver
    selection from a gateway case; the adapter observes its independently scripted upstream.
  proof:
  - case-service-driver-isolation
- text: >-
    realtime_route_inputs compares model=realtime-a as HTTP 101 with one upstream connection on all three aliases,
    model absent with no intent as HTTP 403, intent=transcription with no model as route model gpt-realtime-whisper
    and upstream query intent=transcription without model, guardrails=" first, ,second " as
    data.guardrails=["first","second"] without an upstream guardrails key, and protocol " realtime, second " as
    negotiated realtime.
  proof:
  - case-realtime-route-inputs
- text: >-
    provider_preparation compares query_params=None as {model: realtime-a}, query_params={} as an empty query,
    supplied pairs in order, https://api.openai.com/ as wss://api.openai.com/v1/realtime, http://provider.test/ as
    ws://provider.test/v1/realtime, OpenAI-Beta: realtime=v1 only when supplied, and api_key=None as ValueError
    message "api_key is required for OpenAI realtime calls".
  proof:
  - case-provider-preparation
- text: >-
    websocket_auth compares Authorization: Bearer sk-test, api-key: sk-test and the first matching
    openai-insecure-api-key.sk-test subprotocol as credentials; absent credentials return HTTP 403 detail "No API key
    provided", Authorization: Basic wrong returns HTTP 403 detail "Invalid Authorization header format", both have
    zero provider connections and attempted close code 1008, and Authorization takes precedence over api-key.
  proof:
  - case-websocket-auth
- text: >-
    upstream_refusal compares mock statuses 401, 403, 429 and 503 after client HTTP 101 as a server_error event
    with the exact substituted message "Upstream realtime handshake rejected with HTTP <status>" and close codes
    1008, 1008, 1013 and 1011; the event has no param or code field and the close reason is the same literal message.
  proof:
  - case-upstream-refusal
- text: >-
    changed_peer identifies the first changed client frame, provider frame or close field with its peer label and
    stable JSON pointer, while legacy-dispatch keeps existing health and chat HTTP cases on the old driver and corpus
    replay calls decode_ws_case directly.
  proof:
  - case-changed-peer
  - legacy-self-check
  - parser-corpus
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The WebSocket oracle module has no production-backed behavior tests, or only its corpus replay exists.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::/) - test(/::replays_corpus$/)'
  - id: case-transcript-schema
    why: The decoder accepts a malformed discriminator, missing frame shape, unknown field or duplicate field, or starts a peer before rejecting it.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::transcript_schema($|::)/)'
  - id: case-bounded-inputs
    why: A concrete frame, traffic, execution, fixture-root or child-lifecycle boundary is missing.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::bounded_inputs($|::)/)'
  - id: case-direction-order
    why: The comparator requires a single global event order instead of the two direction-local sequences.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::direction_order($|::)/)'
  - id: case-barrier-gates-send
    why: A client frame with after_provider_ready is sent before its named provider observation.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::barrier_gates_send($|::)/)'
  - id: case-preaccept-status
    why: The driver turns an HTTP 403 before upgrade into an accepted socket close or loses the absence of a close frame.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::preaccept_status($|::)/)'
  - id: case-route-aliases
    why: The gateway driver cannot select one alias or mounts the realtime handler more than once.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::route_aliases($|::)/)'
  - id: case-service-driver-isolation
    why: An unregistered service tag starts a child or provider socket, or a registered service is routed through FastAPI.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::service_driver_isolation($|::)/)'
  - id: case-realtime-route-inputs
    why: The gateway transcript loses a named realtime alias, default model, query projection, guardrail value or protocol negotiation.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::realtime_route_inputs($|::)/)'
  - id: case-provider-preparation
    why: The service transcript changes the pinned OpenAI URL, query insertion, header forwarding or missing-key exception.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::provider_preparation($|::)/)'
  - id: case-websocket-auth
    why: The transcript changes credential precedence or either exact preaccept 403 detail and attempted 1008 close.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::websocket_auth($|::)/)'
  - id: case-upstream-refusal
    why: A refusal status changes the exact server_error message, status mapping, close reason or absence of param/code fields.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::upstream_refusal($|::)/)'
  - id: case-changed-peer
    why: A changed frame or close reports the wrong peer or an unstable comparison pointer.
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::changed_peer($|::)/)'
  - id: parser-corpus
    why: The committed fuzz target or replay does not invoke decode_ws_case, or no websocket seed was added.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle)" && test -f tools/oracle/fuzz/fuzz_targets/websocket_oracle.rs && grep -qF "decode_ws_case" tools/oracle/fuzz/fuzz_targets/websocket_oracle.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: legacy-self-check
    why: Adding WebSocket dispatch changes the existing health or chat HTTP execution path.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/harness/websocket-oracle)" && cargo run --locked --quiet -p betterlite-oracle -- --self-check tools/oracle/cases/harness/websocket-oracle tools/oracle/cases/chat tools/oracle/cases/health
  - id: gateway-self-check
    why: The new gateway fixtures do not boot both proxies or omit one of the three realtime aliases.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/harness/websocket-oracle)" && grep -R -qE '/(openai/v1/realtime|v1/realtime|realtime)' tools/oracle/cases/harness/websocket-oracle
