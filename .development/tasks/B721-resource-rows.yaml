  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/project.py#L1-L40
    why: Own row_contracts; preserve caller-visible values and failure ordering.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: model_json_columns,
      blocked_model, membership_email_population, credential_params, project_row, permission_arrays, postgres_pinned_rows,
      postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: The production decode_resource_rows decoder is used by the service and its fuzz target and rejects
      malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^resource_rows::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/resource_rows.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/resource-rows-*")"
        && grep -rlq "resource_rows" tools/oracle/fuzz/corpus/helper_case/resource-rows-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/resource_rows::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/resource_rows::tests::postgres_failure_effects$/)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/resource_rows.rs && grep -q "resource_rows"
        crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-db/fuzz/corpus/resource_rows)" && cargo nextest run --locked -p betterlite-db
        --no-tests=fail -E 'test(replays_the_resource_rows_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/resource-rows/model-json-columns.yaml
  - tools/oracle/cases/helpers/resource-rows/blocked-model.yaml
  - tools/oracle/cases/helpers/resource-rows/membership-email-population.yaml
  - tools/oracle/cases/helpers/resource-rows/credential-params.yaml
  - tools/oracle/cases/helpers/resource-rows/project-row.yaml
  - tools/oracle/cases/helpers/resource-rows/permission-arrays.yaml
deviations:
  - what: New otherwise unbounded byte decoders reject over 1048576 bytes or JSON depth 64, respecting
      smaller inherited limits.
    why: Bound the specific outside-byte decoder named in this task; typed helpers inherit no artificial
      parser behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/access_group.py#L1-L25
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
pitfalls:
  - Credential parameters stay encrypted behind StoredCipher even though model/config JSON accepts string
    storage.
budget:
  max_changed_lines: 525
  max_new_expects: 0
review_level: security
