id: B721
title: Typed organization and resource database rows
description: >-
  Add typed organization, project, model, access-group, config, credential and object-permission database
  row types for every field in the listed files. Preserve model blocked/team metadata, JSON/string coercion
  and membership email projection. Keep encryption behind StoredCipher; these are storage contracts, not
  feature execution.


  The byte boundary is decode_resource_rows(&[u8]) for stored JSON/string columns read from Postgres and
  Redis; its fuzz target calls this production decoder. Count field declarations as well as validators
  when implementing the complete row contracts.


  Build the production resource_rows module in betterlite-db; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/models/access_group.py:
  row_contracts (L1-L25; 20 source lines). litellm/models/config.py: row_contracts (L1-L13; 9 source lines).
  litellm/models/credentials.py: row_contracts (L1-L38; 26 source lines). litellm/models/model.py: row_contracts
  (L1-L60; 49 source lines). litellm/models/object_permission.py: row_contracts (L1-L26; 21 source lines).
  litellm/models/organization.py: row_contracts (L1-L29; 24 source lines). litellm/models/organization_membership.py:
  row_contracts (L1-L40; 31 source lines). litellm/models/project.py: row_contracts (L1-L40; 33 source
  lines).


  Add the resource_rows operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a resource-rows-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This task owns the outside-byte boundary resource_rows::decode_resource_rows(&[u8]) -> Result<TypedValue,DecodeError>
  for stored model/budget/object-permission JSON columns. Production calls this decoder before its typed
  policy functions; the cargo-fuzz target resource_rows calls that same function. Seed valid, truncated,
  malformed, duplicate-field and limit-boundary inputs and add resource_rows::tests::replays_the_resource_rows_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B710 owns crates/betterlite-db/fuzz; depend on it and register this decoder target without
  recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 213 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  213 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 507 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
