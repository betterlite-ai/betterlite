id: B2234
title: Stream text thinking and audio assembly
description: >-
  Implement shared typed chunk assembly in betterlite-streaming, below provider and SSE execution. Parsed chunk
  DTOs come from B004; this task does not create another SSE/JSON parser. Use bounded outputs and injected clock/counters
  where the source reads them.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/litellm_core_utils/streaming_chunk_builder_utils.py:
  ChunkProcessor.get_combined_content L667-L684; get_combined_thinking_content L686-L742; get_combined_reasoning_content
  L744-L745; get_combined_audio_content L747-L775; concatenate_base64_list L1177-L1191.


  Named case contracts: content_and_reasoning: Concatenate selected content or reasoning_content from all choices
  in order; absent key contributes empty and None is skipped. Do not flatten content arrays or coerce nonstring
  values: join failure propagates. thinking_signature_boundaries: Only list thinking_blocks are traversed. Accumulate
  truthy thinking text until a truthy signature arrives; then emit a thinking block and reset. Unsigned trailing
  text disappears. Every redacted_thinking block flushes/reset pending state before optionally emitting truthy data.
  Unknown/missing types take ordinary thinking handling. Return None if no complete blocks, preserve signature-only
  empty-thinking blocks. audio_fragments_and_expiry: Across all choices, collect only string data/transcript (including
  empty), last non-None integer expires_at (including bool), last non-None string id. Decode each base64 fragment
  independently, concatenate decoded bytes and re-encode once; invalid padding fails. Concatenate transcripts. Expiry
  falsey including0 uses integer injected now+3600; negative expiry survives. ID remains None or empty if last supplied
  that value. audio_base64_decoder: decode_stream_audio_fragment matches Python base64.b64decode permissive alphabet
  handling, including ignored nonalphabet characters and padding errors; empty input emits empty bytes. Bound decoded
  output, replay malformed and valid fragments through the same production decoder.


  Outside-byte boundary: decode_stream_audio_fragment consumes one untrusted provider audio base64 string in crates/betterlite-streaming/src/stream_content_assembly.rs
  or its scoped child module. Use that production decoder from the request path, Rust oracle adapter and cargo-fuzz
  target crates/betterlite-streaming/fuzz/fuzz_targets/stream_content_assembly.rs. Add valid, malformed, truncated
  and boundary corpus inputs and adjacent test replays_the_stream_content_assembly_corpus that checks outcome categories
  through this decoder. The B171 HelperCase parser is a separate boundary.


  Implement crates/betterlite-streaming/src/stream_content_assembly.rs with adjacent tests under stream_content_assembly/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation stream_content_assembly in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_content_assembly_cases in betterlite-streaming with these exact named cases (one
  per oracle file): content_and_reasoning, thinking_signature_boundaries, audio_fragments_and_expiry, audio_base64_decoder.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/stream_content_assembly* using HelperCase: kind:
  helper and the externally tagged stream_content_assembly variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_stream_content_assembly that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 105 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 150 production lines, 240 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 590 planned, 600 maximum changed lines.
