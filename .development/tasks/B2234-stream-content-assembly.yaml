checks:
  optional:
  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/stream_content_assembly.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/stream_content_assembly*")"
      && grep -lq 'stream_content_assembly' tools/oracle/fuzz/corpus/helper_case/stream_content_assembly* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_stream_content_assembly$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-content-and-reasoning
    why: 'Concatenate selected content or reasoning_content from all choices in order; absent key contributes empty
      and None is skipped. Do not flatten content arrays or coerce nonstring values: join failure propagates.'
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/::stream_content_assembly_cases::case_[0-9]+_content_and_reasoning$/)'
  - id: case-thinking-signature-boundaries
    why: Only list thinking_blocks are traversed. Accumulate truthy thinking text until a truthy signature arrives;
