    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/::stream_content_assembly_cases::case_[0-9]+_thinking_signature_boundaries$/)'
  - id: case-audio-fragments-and-expiry
    why: Across all choices, collect only string data/transcript (including empty), last non-None integer expires_at
      (including bool), last non-None string id. Decode each base64 fragment independently, concatenate decoded
