      && grep -q 'decode_stream_audio_fragment' crates/betterlite-streaming/fuzz/fuzz_targets/stream_content_assembly.rs
      && cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/::replays_the_stream_content_assembly_corpus$/)'
