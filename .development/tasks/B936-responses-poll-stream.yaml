id: B936
title: Responses poll stream
description: >-
  Reduce live Responses stream events into polling snapshots and run the background call as a server-owned task
  that outlives the initiating HTTP disconnect. Preserve flush scheduling, terminal incomplete/error fields and
  cancellation polling; drain the task on server shutdown and use the source's flush thresholds. Flush dirty polling
  output every 150 milliseconds or on terminal state, matching UPDATE_INTERVAL=0.150.


  Implement crates/betterlite-core/src/api/responses_poll_stream.rs. Use ResponsesPollStreamInput and ResponsesPollStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions disconnect_keeps_polling, partial_text_flush, terminal_output_replaces__c218,
  cancel_stops_upstream, error_marks_failed under api::responses_poll_stream::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesPollStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_poll_stream: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/response_polling/background_streaming.py: _sse_frame_data (L78-L79); litellm/proxy/response_polling/background_streaming.py:
  _never_receive (L82-L84); litellm/proxy/response_polling/background_streaming.py: detach_request_from_client (L87-L93);
  litellm/proxy/response_polling/background_streaming.py: background_streaming_task (L96-L427). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 307 owned nonblank/non-comment/non-docstring Python lines (326 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 327 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 577 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B171 (Direct helper oracle and
  URL path encoding), B932 (Responses create call), B935 (Responses poll state), B1087 (Api boundaries). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.
