checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::/)
      - test(/::replays_corpus$/)'
  - id: case-disconnect-keeps-polling
    why: the disconnect-keeps-polling behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::disconnect_keeps_polling($|::)/)'
  - id: case-partial-text-flush
    why: the partial-text-flush behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::partial_text_flush($|::)/)'
  - id: case-terminal-output-replaces-deltas
    why: the terminal-output-replaces-deltas behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::terminal_output_replaces__c218($|::)/)'
  - id: case-cancel-stops-upstream
    why: the cancel-stops-upstream behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::cancel_stops_upstream($|::)/)'
  - id: case-error-marks-failed
    why: the error-marks-failed behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::error_marks_failed($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_poll_stream.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_poll_stream-*)"
      && grep -qE "^[[:space:]]+responses_poll_stream:" tools/oracle/fuzz/corpus/helper_case/responses_poll_stream-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-poll-stream)"
