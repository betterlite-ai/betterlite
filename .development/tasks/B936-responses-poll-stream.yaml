id: B936
title: Responses background stream consumption
description: >-
  Implement the whole background_streaming.py module in betterlite-core api/responses_poll_stream,
  including its nested flush function and detached-request adapter. B004 supplies the real
  request-processing port; B935 owns Redis transitions, B1087 limits and B1138 response records.
  Change state to in_progress, force data.stream=true, remove background, and call route_type=aresponses
  with skip_pre_call_logic=true and model=null. Preserve the preprocessed request scope/auth/body
  while its receive operation never reports client disconnect. The task continues after the
  initiating HTTP connection closes. B003 owns bounded server task tracking and shutdown.

  Buffer output by insertion-ordered item ID and text by (item_id,content_index). Flush dirty
  output after an event when at least 0.150 seconds elapsed, or force at end; there is no timer
  flushing while idle. Terminal events collect fields but do not break iteration. Their output
  items merge into the existing map by ID; an empty terminal output does not clear prior items.
  EOF or [DONE] without a terminal event ends as completed. The source never polls cancellation
  state: a cached cancelled status can be overwritten by the eventual terminal result.

  Use SdkHttpCall::ResponsesPollStream in B2401 for the provider-reaching background worker.
  Python calls background_streaming_task (not a route handler) with real ProxyBaseLLMRequestProcessing,
  prepared request/auth context and a capture Redis fixture; its provider base is the mock.
  Native calls the production worker. Only clock, admission outcome and cache are controlled;
  do not replace the processor or return expected provider results. HTTP create/read/cancel route
  composition remains B080/B938. Add a separate pure HelperCall::ResponsesPollFrame for the
  source frame selector/JSON parser, with B171 adapters and tagged seed.

  decode_poll_stream_frame(bytes,ApiLimits) consumes one body-iterator chunk, checks UTF-8, selects
  the first line beginning exactly "data: ", strips its payload and decodes JSON. It does not
  buffer split frames or combine data lines. Bound its bytes via B1087 and add its fuzz target
  and replay corpus. Malformed JSON warns and skips; other decoder/event-shape errors reach the
  worker failure path. Native invalid-shape errors use bounded shared diagnostics. The 326 owned
  source lines need 280 implementation, 150 tests, 110 HTTP/helper fixtures, 120 adapters,
  70 fuzz/replay and 35 wiring lines, 765 total under 800.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_poll_stream.rs
  - crates/betterlite-core/src/api/responses_poll_stream/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/responses_poll_stream.rs
  - crates/betterlite-core/fuzz/corpus/responses_poll_stream/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/responses_poll_stream.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/responses_poll_stream.py
  - tools/oracle/cases/sdk-http/responses-poll-stream/**
  - tools/oracle/fuzz/corpus/sdk_http_case/responses-poll-stream-*
  - tools/oracle/src/helpers/core_ops/responses_poll_frame.rs
  - tools/oracle/src/helpers/core_ops/responses_poll_frame/**
  - tools/oracle/helpers/responses_poll_frame.py
  - tools/oracle/helpers/responses_poll_frame/**
  - tools/oracle/cases/helpers/responses-poll-frame/**
  - tools/oracle/fuzz/corpus/helper_case/responses_poll_frame-*
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/background_streaming.py#L1-L427
  why: Detached request, complete worker, 150ms event-driven flushing and all terminal/error transitions.
dod:
- text: >-
    polling_provider_call_survives_disconnect starts with stream=false,background=true and an admitted
    request. Expect one mock POST /v1/responses with stream=true and no background field, initial
    cache status=in_progress and exactly one admission overall. Closing the client receive channel
    does not cancel provider reading. EOF completes the cache record; server shutdown still joins
    or cancels its tracked task through B003. Capture route_type=aresponses,model=null and
    skip_pre_call_logic=true at the real processor seam.
  proof: [worker-http, oracle, python-sdk]
- text: >-
    polling_text_flush_order receives item m with content=[], adds an output_text part, then
    deltas "he" and "llo" at index=0; expect content[0].text="hello". At elapsed 0.149 no batch
    write occurs; the next event at 0.150 flushes output once, and EOF force-flushes remaining
    dirty data. No idle timer write occurs. Missing item IDs and unknown item references are
    ignored. Duplicate item IDs replace values without changing insertion order. content_part.done
    replaces the selected part and output_item.done replaces the item. Negative index=-1 updates
    the last existing part for a delta, but done compares enumerated nonnegative indices and does
    not replace it. Out-of-range positive indices leave content unchanged while marking dirty.
  proof: [output-reducer, oracle, python-sdk]
- text: >-
    polling_terminal_merge keeps accumulated m1 when terminal output contains only m2; both remain
    in that order. Terminal output=[] also keeps m1. response.completed/failed/incomplete/cancelled
    map to completed/failed/incomplete/cancelled unless response.status supplies another value.
    Terminal usage,reasoning,tool_choice,tools,model,instructions,temperature,top_p,max_output_tokens,
    previous_response_id,text,truncation,parallel_tool_calls,user,store,incomplete_details reach
    B935 unchanged, including 0,false,[] and {} under its per-field rules. Error is captured only
    from failed/incomplete events; a nonempty error makes B935 status=failed. Later terminal events
    can replace earlier fields. response.in_progress writes status immediately. No terminal defaults
    to completed even when body_iterator is absent, which also emits the source misconfiguration warning.
  proof: [terminal-state, oracle, python-sdk]
- text: >-
    polling_cancel_does_not_stop_upstream writes cancelled into the cache while a mock stream is
    held, releases its completed terminal event, and observes completed afterwards. There is no
    cache read or provider cancellation from this worker. A provider/processor failure with typed
    message=boom instead writes status=failed,error={type:internal_error,message:boom,
    code:background_streaming_error}; param is absent. Log the worker error; a failure of this
    final cache write propagates rather than recursively retrying it.
  proof: [cancel-failure, oracle, python-sdk]
- text: >-
    poll_frame_literal_selection compares the actual pure selector: "data:{...}" and comment-only
    chunks produce no event; "data:  {\"type\":\"x\"}  " yields type=x. Two data lines/frames
    in one chunk select only the first; split JSON is not reassembled and warns "Failed to parse
    streaming chunk: %s" before being skipped. Exact trimmed [DONE] ends the worker immediately.
    Invalid UTF-8 and JSON scalars that lack event fields fail the worker, not the JSON-warning
    branch. Unknown object event types are no-ops but still permit a due dirty-state flush.
  proof: [frame-decoder, oracle, python-helper, parser-corpus]
- text: SDK and helper tags each have a new case-parser seed; byte fuzz/replay calls the production chunk decoder.
  proof: [case-corpora, parser-corpus, python-sdk, python-helper]
checks:
  optional: []
  commands:
  - id: worker-http
    why: the background worker reruns admission or terminates on the original disconnect
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::polling_provider_call_survives_disconnect($|::)/)'
  - id: output-reducer
    why: delta indexing, replacement order or event-driven batching changes cached output
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::polling_text_flush_order($|::)/)'
  - id: terminal-state
    why: a terminal response clears earlier items or drops completion metadata
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::polling_terminal_merge($|::)/)'
  - id: cancel-failure
    why: cancellation is invented or background errors lose their stored code
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::polling_cancel_does_not_stop_upstream($|::)/)'
  - id: frame-decoder
    why: polling accepts data without the source's required space or reassembles chunks
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::poll_frame_literal_selection($|::)/)'
  - id: python-sdk
    why: the background HTTP adapter replaces the real processor with a scripted response
    run: test -f tools/oracle/sdk_http/responses_poll_stream.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: python-helper
    why: pure frame parity lacks its independent Python selector/parser
    run: test -f tools/oracle/helpers/responses_poll_frame.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: parser-corpus
    why: the production polling byte boundary has no newly added fuzz/replay coverage
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/responses_poll_stream.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_poll_stream)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_poll_stream::tests::replays_corpus$/)'
  - id: case-corpora
    why: one of the SDK/pure-frame operations lacks an external-tag seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/responses-poll-stream-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_poll_frame-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/sdk-http/responses-poll-stream/polling-provider-call-survives-disconnect.yaml
- tools/oracle/cases/sdk-http/responses-poll-stream/polling-text-flush-order.yaml
- tools/oracle/cases/sdk-http/responses-poll-stream/polling-terminal-merge.yaml
- tools/oracle/cases/sdk-http/responses-poll-stream/polling-cancel-does-not-stop-upstream.yaml
- tools/oracle/cases/helpers/responses-poll-frame/poll-frame-literal-selection.yaml
deviations:
- what: Invalid decoded event shapes and external failures use bounded redacted messages in error.message; status=failed,type=internal_error,code=background_streaming_error remain unchanged.
  why: B184/B187 prevent exception dumps from entering cached public responses.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/background_streaming.py#L414-L427
out_of_scope:
- B080 owns initial polling admission and the create route; B938 owns cancellation HTTP and polling owner authorization.
- B935 owns serialization, TTL, private owners and patch truthiness; B004 owns provider dispatch and pre-call processing.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_poll_frame in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_poll_frame.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_poll_frame.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Terminal output is merged by ID, so stale accumulated items survive an empty final output list.
- There is no cancellation-state read anywhere in the worker; cached cancellation can be overwritten.
- The 150ms interval is checked after events, not by a background timer.
- Only JSONDecodeError is warn-and-skip; invalid UTF-8 and event-shape failures mark the polling record failed.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
