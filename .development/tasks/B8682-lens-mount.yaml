deviations:
  - what: With CLICKHOUSE_URL and general_settings.tracing set, the Lens routes still behave as if tracing were off.
    why: No task builds the ClickHouse trace storage or its Lens queries yet (LiteLLM's litellm-rust traces crate); see the report notes.
out_of_scope:
  - "The routes and their checks: B4503 and B4505. The repository: B4501. The analyze flow and its ports: B4504."
  - "The ClickHouse Lens storage queries (lens_availability, lens_agents, lens_sample, lens_content, lens_evidence) and the trace receiver that provides them: no owner; see the report notes."
  - "The edge layers: B8680. Public and docs routes: B8681."
pitfalls:
  - The worker routes must stay outside the key layer; merged through mount, every worker request without a virtual key gets 401 before worker_auth runs.
  - Read shared.router once per call, not once at mount; the router is installed after the response cache at startup and B8381 can install one later from the database.
  - LiteLLM passes no ModelNames when llm_router is None, so create and update answer 400 "Choose a model configured on this LiteLLM instance" without a router; an empty list from a fake router hides that branch.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
