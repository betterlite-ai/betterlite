  - tools/oracle/cases/http/lens-admin-routes/read-without-database-503.yaml
  - tools/oracle/cases/http/lens-admin-routes/runs-negative-offset-422.yaml
  - tools/oracle/cases/http/lens-admin-routes/availability-without-tracing-200.yaml
  - tools/oracle/cases/http/lens-admin-routes/agents-without-tracing-200.yaml
  - tools/oracle/cases/http/lens-admin-routes/preview-without-tracing-501.yaml
  - tools/oracle/cases/http/lens-admin-routes/preview-naive-as-of-422.yaml
  - tools/oracle/cases/http/lens-admin-routes/register-bad-key-id-422.yaml
  - tools/oracle/cases/http/lens-admin-routes/billing-key-without-database-503.yaml
  - tools/oracle/cases/http/lens-admin-routes/revoke-without-database-503.yaml
  - tools/oracle/cases/http/lens-admin-routes/evidence-without-database-503.yaml
  - tools/oracle/cases/http/lens-worker-routes/claim-without-bearer.yaml
  - tools/oracle/cases/http/lens-worker-routes/claim-basic-scheme.yaml
  - tools/oracle/cases/http/lens-worker-routes/claim-without-database-503.yaml
  - tools/oracle/cases/http/lens-worker-routes/claim-bad-query-without-database-503.yaml
  - tools/oracle/cases/http/lens-worker-routes/progress-without-database-503.yaml
