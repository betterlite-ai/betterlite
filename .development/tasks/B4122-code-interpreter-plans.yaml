id: B4122
title: Code interpreter interception hooks and rerun plans
description: >-
  Build code-interpreter configuration, initial tool rewriting, activation gates and separate
  chat/Responses rerun plans. Preserve server-minted request keys, identity/session keys,
  buffered-stream markers, sequential tool execution and deletion on plan-building errors.

  The pre-call hook strips interception metadata on root requests, rewrites the native code_interpreter
  tool to a function tool, converts streams to buffered calls, and seeds session or request sandbox keys.
  The gate decides whether to run a code-loop by detecting code-execution tool calls in the response.
  Plan builders execute each tool call, build typed rerun messages and catch exceptions to clean up
  on failure. Chat Completions and Responses dialects use different message/output shapes; both delete
  request-scoped containers and preserve session-scoped ones through plan execution.

  Configuration: enabled (default true), enabled_providers (unrestricted when absent),
  sandbox_tool_name (none/None for no sandbox). Settings-level code_interpreter_interception_params
  wins over callback-specific parameters; both resolve from proxy_config and schema/litellm settings.
  Metadata keys: _code_interpreter_interception_active (boolean), _code_interpreter_interception_sandbox_key
  (string), _code_interpreter_interception_session_scoped (boolean), _code_interpreter_interception_converted_stream
  (boolean). Identity is user_api_key_hash; session scope activates when session_id is present in metadata.
  Request-scoped sandbox keys use uuid.uuid4().hex; session-scoped keys are identity:session_id or session_id.

scope:
  paths:
  - crates/betterlite-openai/src/code_interpreter_plans.rs
  - crates/betterlite-openai/src/code_interpreter_plans/**
  - crates/betterlite-models/src/code_interpreter_config.rs
  - crates/betterlite-models/src/code_interpreter_config/**
  lint_tables: false
