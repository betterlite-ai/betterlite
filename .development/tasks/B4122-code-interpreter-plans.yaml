dod:
- text: CodeInterpreterInterceptionLogger initializes with enabled, enabled_providers (list or None), sandbox_tool_name (string or None) and sandbox_config (protocol or None), storing all in instance fields.
  proof:
  - logger-initialization
- text: from_config_yaml constructs the logger from CodeInterpreterInterceptionConfig dict, extracting enabled (default true), enabled_providers and sandbox_tool_name.
  proof:
  - yaml-configuration
- text: initialize_from_proxy_config reads proxy settings, preferring litellm_settings code_interpreter_interception_params over callback_specific_params, and falls back to empty config when both are missing.
  proof:
  - proxy-configuration
- text: async_pre_call_deployment_hook strips interception metadata on root requests (_agentic_loop_depth is None/falsy), returns None when disabled/wrong call type/no tools/no code_interpreter tool.
  proof:
  - strip-root-metadata
- text: async_pre_call_deployment_hook sets _code_interpreter_interception_active to true, seeds sandbox key (identity:session_id if session_scoped, uuid.uuid4().hex otherwise), marks session scope with _session_scoped, and writes all to litellm_metadata.
  proof:
  - sandbox-key-seeding
- text: async_pre_call_deployment_hook converts stream=true to stream=false and sets _converted_stream marker when stream is present.
  proof:
  - stream-conversion
- text: async_pre_call_deployment_hook rewrites each code_interpreter tool to a function tool using _get_function_tool, preserving all other tools in list order.
  proof:
  - tool-rewriting
- text: async_pre_call_deployment_hook rewrites tool_choice when it targets code_interpreter to the function tool choice, leaving other tool_choice values unchanged.
  proof:
  - tool-choice-rewriting
- text: _resolve_provider extracts custom_llm_provider if present and non-empty, falls back to litellm.get_llm_provider(model) returning the provider string, returns None on exception or non-string model.
  proof:
  - provider-resolution
- text: "async_should_run_agentic_loop returns (false, {}) when disabled, interception not active in kwargs, or provider not in enabled_providers list; returns (true, {tool_calls: <list>}) when code-execution calls are detected."
  proof:
  - gate-conditions
- text: async_should_run_agentic_loop detects code-execution tool calls using the appropriate extractor per API surface (chat vs responses dialect).
  proof:
  - gate-detection
- text: async_build_agentic_loop_plan prunes the sandbox cache, extracts tool_calls/sandbox_key/session scope, gets or creates container, and executes each tool call sequentially, building typed CodeInterpreterCall records.
  proof:
  - plan-execution-sequence
- text: Responses plan builder builds code_interpreter_calls list with id (ci_<uuid>), type, status completed, code (from _parse_code), container_id and outputs (logs if stdout present).
  proof:
  - code-interpreter-calls
- text: Responses plan builder constructs input_list as array of function_call and function_call_output dicts, maintaining order of execution and stdout/error output.
  proof:
  - responses-message-format
- text: Responses plan builder deletes container on exception (any Exception type, not caught selectively), then re-raises the exception for caller handling.
  proof:
  - error-cleanup
- text: Responses plan builder returns AgenticLoopPlan with run_agentic_loop=true, request_patch (model, messages, tools, optional_params, kwargs), and metadata (tool_type, sandbox_key, is_session_scoped, code_interpreter_calls).
  proof:
  - plan-assembly-responses
- text: _build_chat_completion_agentic_loop_plan prunes cache, extracts tool_calls/sandbox_key/session scope, gets or creates container, and builds tool result messages sequentially.
  proof:
  - chat-plan-sequence
- text: _build_chat_completion_tool_result executes tool call and returns tuple (ChatCompletionToolMessage dict, CodeInterpreterCall record), using tool_call.id or call_id or uuid.uuid4().hex as tool_call_id.
  proof:
  - tool-result-pair
- text: Chat Completions plan builder constructs messages list as original + assistant message with all tool calls + tool result messages for each execution.
  proof:
  - chat-message-format
- text: Chat Completions plan builder returns AgenticLoopPlan with response_format "openai" in metadata, distinguishing the dialect for post-hook processing.
  proof:
  - plan-assembly-chat
- text: Plan builders call _get_followup_tools to preserve non-code_interpreter tools and rewrite code_interpreter tools as function tools per call type.
  proof:
  - followup-tools-rewrite
- text: Plan builders call _get_followup_optional_params to drop tools key and tool_choice only when tool_choice targets code_interpreter.
  proof:
  - followup-params-filtering
- text: Plan builders call _filter_agentic_loop_kwargs to exclude litellm_logging_obj, acompletion, and interception-internal keys from follow-up kwargs.
  proof:
  - followup-kwargs-filtering
- text: Sandbox key extraction via _extract_sandbox_key returns the string value of _sandbox_key from kwargs, or None if absent/non-string.
  proof:
  - sandbox-key-retrieval
- text: Session scope detection reads _session_scoped from kwargs via bool(kwargs.get(_SESSION_SCOPED_KEY)) in plan builders, evaluating to true when present and truthy, false otherwise.
  proof:
  - session-scope-flag
- text: Container identity is user_api_key_hash for session-scoped containers, None for request-scoped; used for LRU eviction when identity is non-None.
  proof:
  - identity-tracking
