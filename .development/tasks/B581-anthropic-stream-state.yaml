id: B581
title: Anthropic streaming block and usage state
description: >-
  Add AnthropicStreamState with a current-content-block delta buffer (reset on each block start), thinking signatures,
  citation state, usage and web/code tool snapshots. Bound accumulators by existing transport body/event limits
  and keep JSON tool state distinct from normal text. This state machine consumes decoded native events; framing
  and event dispatch are separate tasks.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  ModelResponseIterator.__init__ L546-L602; ModelResponseIterator.accumulated_json L605-L606; ModelResponseIterator.accumulated_json
  L609-L610; ModelResponseIterator.check_empty_tool_call_args L612-L633; ModelResponseIterator._handle_usage L635-L646;
  ModelResponseIterator._content_block_delta_helper L648-L732; ModelResponseIterator._handle_redacted_thinking_content
  L734-L750; ModelResponseIterator.get_content_block_start L752-L763; ModelResponseIterator._web_search_call_snapshot
  L765-L766; ModelResponseIterator._complete_web_search_call L768-L776; ModelResponseIterator._build_code_interpreter_results
  L778-L809; ModelResponseIterator._handle_message_delta L1096-L1116.


  Named case contracts: empty_tool_arguments: No content_blocks returns false. First delta type text_delta/thinking_delta
  returns false regardless of later blocks; otherwise concatenate only input_json_delta.partial_json default empty
  and return whether length zero. This does not treat whitespace as empty. partial_input_json: A delta containing
  text key returns its value immediately and is not buffered, regardless of type/other keys. Other deltas append
  to content_blocks. partial_json emits function argument chunk with id/name=None and current tool_index only when
  current block is tool_use/server_tool_use; suppress it on result/other blocks. Branch precedence is text,partial_json,citation,thinking/signature,compaction.
  thinking_signature: Nonempty string thinking appends to stream-wide reasoning text and emits a thinking block
  plus reasoning_content. Nonempty signature emits one signed thinking block containing concatenated string thinking
  from the current block buffer (including same event), replaces the emitted thinking list and sets reasoning_content
  empty only if none was emitted. Empty/nonstring thinking/signature adds no thinking fields. redacted_thinking:
  Start projection preserves required opaque data as {type:redacted_thinking,data:...} in both thinking list/provider
  fields. get_content_block_start uses tool-use TypedDict shape only for exact tool_use, text shape for all other
  types; these Python TypedDict constructors do not independently validate payload schemas. usage_start_and_delta:
  Shallow-merge each usage mapping over cumulative prior values, including explicit None replacing earlier count;
  nested output_tokens_details is replaced, not deep-merged. B579 receives concatenated reasoning text or None plus
  current speed, but no completion_response; returned non-None speed updates state. web_search_snapshot: Snapshot
  copies current id->call mapping. Completion ignores nonstring/untracked tool_use_id, otherwise rebuilds its B902
  call with stored server input default{} and result; no phantom start entry is created. code_output_buffer: Rebuild
  full cumulative list on every emission, only bash_code_execution_tool_result, required normalized type=code_interpreter_call/status=completed/id
  defaultempty, code from dict server input.command defaultempty (not B578 string-filtered), current container id,
  B902 log outputs. Do not emit a delta-only list. stop_reason_state: Message delta maps stop_reason default stop
  and falsey fallback stop through B206, then overrides stop if converted_response_format_tool. Usage is processed
  by key presence; container is returned from delta without storing it here. citation delta passes its value under
  citation; compaction_delta requires type=compaction_delta and content key, retained verbatim. initial_state: Create
  one injected response id, served_model=None, tool_index=-1, json_mode=False unless passed, speed from input, reverse-map=passed
  truthy map or empty; cumulative usage/map/list buffers empty, both JSON-tool flags false, chunk_type=valid_json,
  current block/server-tool/container ids None. sync_stream is accepted but unused. accumulated_json property delegates
  B005 snapshot/set, not a separate string accumulator.


  Direct constructor/helper prerequisites used by this slice: B2201. Reuse the named implementations; do not copy
  them at this call boundary.


  The _generate_id helper called during iterator initialization belongs to B2214; inject its UUID source and preserve
  chatcmpl- formatting.


  Implement crates/betterlite-anthropic/src/stream_state.rs with adjacent tests under stream_state/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_stream_state in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_state_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): empty_tool_arguments, partial_input_json, thinking_signature, redacted_thinking, usage_start_and_delta,
  web_search_snapshot, code_output_buffer, stop_reason_state, initial_state. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_stream_state* using HelperCase: kind:
  helper and the externally tagged anthropic_stream_state variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_stream_state that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 226 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 225 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.
