    why: The empty-tool-arguments behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_state_cases::case_[0-9]+_empty_tool_arguments$/)'
  - id: case-partial-input-json
