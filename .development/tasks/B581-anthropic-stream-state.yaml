id: B581
title: Anthropic streaming block and usage state
description: >-
  Add AnthropicStreamState with per-content-block tool buffers, thinking signatures, citation state, usage and web/code
  tool snapshots. Bound accumulators by existing transport body/event limits and keep JSON tool state distinct from
  normal text. This state machine consumes decoded native events; framing and event dispatch are separate tasks.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  ModelResponseIterator.__init__ L546-L602; ModelResponseIterator.accumulated_json L605-L606; ModelResponseIterator.accumulated_json
  L609-L610; ModelResponseIterator.check_empty_tool_call_args L612-L633; ModelResponseIterator._handle_usage L635-L646;
  ModelResponseIterator._content_block_delta_helper L648-L732; ModelResponseIterator._handle_redacted_thinking_content
  L734-L750; ModelResponseIterator.get_content_block_start L752-L763; ModelResponseIterator._web_search_call_snapshot
  L765-L766; ModelResponseIterator._complete_web_search_call L768-L776; ModelResponseIterator._build_code_interpreter_results
  L778-L809; ModelResponseIterator._handle_message_delta L1096-L1116.


  Implement crates/betterlite-anthropic/src/stream_state.rs with adjacent tests under stream_state/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_stream_state in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_state_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): empty_tool_arguments, partial_input_json, thinking_signature, redacted_thinking, usage_start_and_delta,
  web_search_snapshot, code_output_buffer, stop_reason_state. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_stream_state* using HelperCase: kind:
  helper and the externally tagged anthropic_stream_state variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_stream_state that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 226 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 250 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 479 planned, 500 maximum changed lines.
