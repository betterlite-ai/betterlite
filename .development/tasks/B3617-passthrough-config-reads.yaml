id: B3617
title: Pass-through config reads and team visibility
description: >-
  Read pass-through endpoint definitions from configuration and database, filter
  by team permissions, and serve the GET configuration routes.

  Implement functions to load endpoints from the config file (marked read-only),
  load endpoints from the database (editable via UI), merge them with database
  taking precedence for duplicate paths, and filter team-visible endpoints by
  the allowed_passthrough_routes metadata. Expose two GET routes:
  GET /config/pass_through_endpoint with optional query parameters endpoint_id
  and team_id, and GET /config/pass_through_endpoint/team/{team_id} taking team_id
  as a path parameter. Both routes combine config and database endpoints, respecting
  the team's allowed routes when team_id is provided.

  Preserve the is_from_config flag to distinguish persistent configuration from
  database-stored endpoints, and keep the difference between persisted state and
  installed route registry observable. Configuration endpoints use auto-generated
  IDs at read time, while database endpoints have stable IDs. When filtering by
  endpoint ID, return only database endpoints since config endpoints have
  generated IDs. When filtering by team, validate the team exists and return 404
  if not found, then apply the allowed_passthrough_routes metadata filter. Return
  status 500 with error code db_not_connected_error when prisma_client is None.
