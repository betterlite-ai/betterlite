deviations:
  - what: When a database endpoint read fails, an empty list is returned instead of propagating the error.
    why: LiteLLM's code catches all exceptions and returns an empty list, treating connectivity issues gracefully.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L3464-L3471
  - what: "Both routes return status 500 with error code db_not_connected_error and detail {\"error\": \"db_not_connected_error\"} when prisma_client is None."
    why: LiteLLM explicitly checks for database availability and returns this error; it prevents serving stale or inconsistent endpoint data when the database is unreachable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L3574-L3578
  - what: Config endpoint IDs are auto-generated at read time and not stable across calls.
    why: LiteLLM endpoints from config files are not persisted with IDs, so filtering by endpoint_id only queries the database.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L3591-L3595
out_of_scope:
  - Config field parsing and schema validation (owned by config-related tasks).
  - Database client initialization and connection pooling.
  - Route decorator registration beyond what the route handler sets.
  - Config general settings retrieval (depends on get_config_general_settings from B002).
  - Update/create/delete operations on endpoints (owned by B102).
pitfalls:
  - Malformed endpoints in config are logged with a warning and skipped, not propagated as errors.
  - is_from_config is a response-only field set at read time, never stored in config or database.
  - Database precedence means an endpoint with the same path in both config and database shows only the database version.
  - Team lookup validates the team exists but does not check team membership of the requesting user.
  - When endpoint_id is provided, only database endpoints are returned because config endpoints use generated IDs.
  - The allowed_passthrough_routes team metadata must be a Sequence[str] of path values for filtering to work.
review_level: standard
