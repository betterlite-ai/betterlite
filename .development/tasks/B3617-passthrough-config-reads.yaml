dod:
  - text: _get_pass_through_endpoints_from_config returns endpoints from config_passthrough_endpoints with is_from_config=true, skips malformed endpoints with a warning, and returns empty list if config is None.
    proof: [config-read-tests]
  - text: _get_pass_through_endpoints_from_db returns all database endpoints with is_from_config=false, or filters to a specific endpoint_id if provided, handling connection failures gracefully.
    proof: [db-read-tests]
  - text: _filter_endpoints_by_team_allowed_routes raises 404 if team is not found, and filters endpoints to only those whose path is in team metadata allowed_passthrough_routes when the metadata exists.
    proof: [team-filter-tests]
  - text: GET /config/pass_through_endpoint with query parameters merges config and database endpoints, with database taking precedence for duplicate paths, and returns all endpoints or filters by endpoint_id and/or team_id.
    proof: [route-tests, oracle]
  - text: GET /config/pass_through_endpoint/team/{team_id} with path parameter returns only the endpoints the team is allowed to access (filtered by allowed_passthrough_routes metadata), or 404 if team not found.
    proof: [team-param-route-tests, oracle]
  - text: Both routes return status 500 with error code db_not_connected_error when prisma_client is None.
    proof: [no-database-tests, oracle]
  - text: _find_endpoint_by_id returns the endpoint matching the given ID, handling both dict and PassThroughGenericEndpoint types, and returns None if not found.
    proof: [find-endpoint-tests]
  - text: Both routes require user_api_key_auth dependency and return PassThroughEndpointResponse.
    proof: [route-tests, oracle]
