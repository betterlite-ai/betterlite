id: B8790
title: Mount the policy test, impact, compliance and catalog routes and set the guardrail embedder
description: >-
  B3247 (crates/betterlite-server/src/pipeline_test_route), B3249 (attachment_impact and template_preview), B3251
  (policy_compliance_routes) and B3253 (policy_catalog_routes) build routes that nothing mounts, so the pipeline test,
  the attachment impact estimate, the template preview, the compliance test and the template catalog and suggestion
  routes answer 404. LiteLLM serves them under the policy_engine and policy_resolve lazy features (/policies,
  /policies/resolve, /policies/attachments/estimate-impact), behind user_api_key_auth. This task fills
  crates/betterlite-server/src/app/guardrails/policy_tools.rs, whose `mount(router, state, routes: &GuardrailRouteState)`
  and `async fn start(state)` B8667 wrote as stubs and already calls, and puts its code in
  app/guardrails/policy_tools/** (embedder.rs, agent_chat.rs, tests.rs). Read each route module before writing and use
  the route function and state type it exports.


  Embedder (embedder.rs and start). B8666's semantic guard embeds through an `EmbedderSlot` that is empty until the
  server state exists. `RouterGuardEmbedder` implements B8666's `GuardEmbedder` over B8631's `RouterEmbedder` from
  `app::inference::router_embedder(state)`, forwarding the model and the texts and mapping its error. `start` builds it
  once and sets it into `state.shared.guardrails.classes.embedder()`; a router embedder error is logged at error and
  the slot stays empty, so a semantic guard fails to build with LiteLLM's "requires llm_router" text as it does in
  LiteLLM without a router. start runs before the listener, so no request sees the empty slot when a router exists.


  State. B3247's `PipelineExecutor` takes B3246's lookup, B3680's `UnifiedGuardrailHooks` and
  `state.shared.guardrails.classes` (B8666's `GuardrailClasses`) for the non-unified hooks. B3249 takes the same
  classes as its `ContentFilterRunner`, and whatever policy registries its impact route reads. B3251 takes the classes
  as `ComplianceGuardrails` and an `AgentChat` (agent_chat.rs: one chat completion through the router completion B8630
  assembles from `state`, the same call path as /v1/chat/completions). B3253 takes B8665's `SdkSuggestModel` built with
  `state.shared.http`. Take the database handles from `routes`, B8667's shared route state. Build everything once in
  mount, never per request, and never a second GuardrailClasses.


  Mount. Merge B3247's, B3249's (both modules), B3251's and B3253's routes, each once. Do not register a path twice, do
  not call .fallback and do not touch app/guardrails.rs.


  HTTP oracle cases through the booted proxy. The cases below moved here from B3247, B3249, B3251 and B3253; write each
  from that task's text, with the config its name implies (master key set, no database unless the name says db). Their
  helper cases stay with them. Tests in policy_tools/tests.rs (names start with `mount_` and `embedder_`) assert that
  start fills the slot once, that the routes reuse the one GuardrailClasses, and that a request without a key gets 401.
scope:
  paths:
    - crates/betterlite-server/src/app/guardrails/policy_tools.rs
    - crates/betterlite-server/src/app/guardrails/policy_tools/**
    - tools/oracle/cases/policies/test-pipeline/**
    - tools/oracle/cases/policies/attachment-impact/**
    - tools/oracle/cases/policies/template-test/**
    - tools/oracle/cases/policies/compliance/**
    - tools/oracle/cases/policies/templates-catalog/**
    - tools/oracle/cases/policies/templates-suggest/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_lazy_features.py#L80-L90
    why: The policy_engine and policy_resolve lazy features and their path prefixes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_resolve_endpoints.py
    why: The resolve and estimate-impact routes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/semantic_text_index.py#L75-L98
    why: router_embedder, which the semantic guard embeds through.
dod:
  - text: start sets the guardrail embedder slot once from the router embedder, and leaves it empty with an error log when the router embedder cannot be built.
    proof: [mount-tests]
  - text: The pipeline test, impact, template preview, compliance and catalog state is built once and reuses the one GuardrailClasses and the shared route state.
    proof: [mount-tests]
  - text: Those routes answer through the booted proxy as LiteLLM does, and a request without a key gets 401.
    proof: [mount-tests, oracle]
checks:
  optional: []
  commands:
    - id: mount-tests
      why: the embedder slot stays empty, a route family is not mounted, builds a second GuardrailClasses or skips the auth layers
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::guardrails::policy_tools::/)'
deviations: []
out_of_scope:
  - "The handlers and their unit tests: B3247, B3249, B3251 and B3253."
  - "The guardrail class dispatch, ComplianceGuardrails, ContentFilterRunner and the embedder slot type: B8666. SdkSuggestModel: B8665. The router embedder: B8631."
  - "The shared route state and the area file: B8667."
pitfalls:
  - "Building a second GuardrailClasses for the routes would give the pipeline and compliance tests their own class cache, so a semantic guard would build its route index twice."
  - "The embedder slot is a OnceLock; setting it twice fails, so start sets it exactly once."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
