id: B330
title: Build bounded classifier context from request messages
description: 'Build the typed classifier input from B010 structured messages: opening/current asks, prior
  turns, reminder blocks, caller constraints and bounded image parts. Retain provenance for system text
  versus quoted user text and normalize Responses/Messages through existing adapters. Separate classifier
  context from the provider request so truncation and reminder removal never alter what the selected provider
  receives. Feed the same context to local and later external classifiers. Use the existing Rust crate
  boundaries from B004 and B008; integrate through the server when the provider dispatcher or callbacks
  live in another core crate. This task''s source slices are the linked ranges, not a port of their Python
  classes. Add the listed oracle cases and the matching adapters to B301''s component runner where state
  is not observable over HTTP; adapters call production logic and never reproduce it. Use deterministic
  candidate sets or supplied random samples for comparisons, and separate seeded distribution tests for
  random choices. Extend the existing config_yaml fuzz target and committed corpus for every newly accepted
  config form; unsupported keys still fail by full path. Keep the implementation, adapters and tests within
  800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.'
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/classifier-context/**
  - tools/oracle/src/router_probes/classifier_context/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/classifier_context.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L487-L965
  why: Message extraction, reminder removal, human turns and context budgets.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2019-L2044
  why: Classifier image filtering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2391-L2442
  why: Caller constraints and classifier context payload.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2702-L2789
  why: Native and normalized classifier request forms.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the classifier_context prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(classifier_context)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/classifier-context/opening-task-and-latest-followup.yaml
- tools/oracle/cases/routing/classifier-context/tool-only-continuation.yaml
- tools/oracle/cases/routing/classifier-context/reminder-only-turn.yaml
- tools/oracle/cases/routing/classifier-context/nested-unclosed-reminders.yaml
- tools/oracle/cases/routing/classifier-context/bounded-prior-turns.yaml
- tools/oracle/cases/routing/classifier-context/unicode-budget.yaml
- tools/oracle/cases/routing/classifier-context/image-limit.yaml
- tools/oracle/cases/routing/classifier-context/system-constraints-not-user-spoof.yaml
deviations: []
out_of_scope:
- Decrypting provider-owned encrypted content.
- Making external classifier calls.
pitfalls:
- Untrusted user text cannot impersonate an operator or system plan-mode marker.
- Count characters or bytes exactly as the referenced helper does; they differ on Unicode.
- Classifier truncation is not provider prompt truncation.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
