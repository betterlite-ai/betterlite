references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/sqs.py#L257-L267
    why: SQSLogger asks get_credentials with all nine sqs_aws_* values and the queue region.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L570-L580
    why: S3Logger v2 asks get_credentials with the s3_aws_* values for each signed PUT.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3.py#L208-L220
    why: the legacy S3 logger builds a boto3 client with optional static keys, so boto3's default chain applies without them.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dynamodb.py#L28
    why: the DynamoDB logger uses boto3's default chain at AWS_REGION_NAME.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/destinations/s3_destination.py#L63-L78
    why: the FOCUS S3 destination passes its optional keys to boto3.client.
dod:
  - text: betterlite-logging asks for AWS credentials through one AwsCredentials port that AwsCredentialChain implements; SQS's EnvironmentCredentials and effective copy, ConfiguredCredentials and both refusal lists are gone, and StaticCredentials stays only for fixed keys.
    proof: [no-static-sources, chain-logging-tests]
  - text: SQS and S3 v2 send their profile, role, web identity and STS settings to get_credentials, and DynamoDB, legacy S3 and FOCUS S3 fall back to the SDK default chain without keys.
    proof: [logger-tests, chain-logging-tests, oracle-batch-cases]
  - text: The four deviation rows about static-only logger credentials are gone or trimmed.
    proof: [no-static-sources]
checks:
  optional: []
  commands:
    - id: no-static-sources
      why: a logger still refuses a credential flow, keeps its own fallback or static source, or a deviation row still says so
      run: |-
        test -z "$(grep -rnE 'struct (EnvironmentCredentials|ConfiguredCredentials)\b|fn (effective|validate_params|unsupported_flow|configured_credentials)\b' crates/betterlite-logging/src | grep -v '/tests')" &&
        test -z "$(grep -rnE 'CredentialFlow|MissingCredentials' crates/betterlite-logging/src/s3_batch)" &&
        grep -q 'pub trait AwsCredentials' crates/betterlite-logging/src/aws_credentials.rs &&
        test -z "$(grep -n 'sqs_aws_profile_name' docs/deviations/B3995.yaml)" &&
        test -z "$(grep -n 's3_aws_profile_name' docs/deviations/B3994.yaml)" &&
        test -z "$(grep -n 'DynamoDB credentials come from' docs/deviations/B3991.yaml)"
    - id: chain-logging-tests
      why: the chain answers a request from the wrong source
      run: grep -rq 'fn logging_requests_resolve_through_the_chain' crates/betterlite-bedrock/src/credentials/chain && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^credentials::chain::/)'
    - id: oracle-batch-cases
      why: the S3 v2 batch logger no longer uploads and signs as LiteLLM does once its keys come through the port
      run: cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-logging -- tools/oracle/cases/helpers/s3-log-batches-s3-batch
    - id: logger-tests
      why: a logger drops a credential setting, asks for the wrong request, or lost its signing
      run: grep -rq 'fn profile_and_role_settings_reach_the_credential_port' crates/betterlite-logging/src/sqs_logging && grep -rq 'fn role_settings_reach_the_credential_port' crates/betterlite-logging/src/s3_batch && test "$(grep -rl 'fn missing_keys_ask_for_the_default_chain' crates/betterlite-logging/src/legacy_s3 crates/betterlite-logging/src/legacy_dynamodb crates/betterlite-logging/src/finops/focus/destinations | wc -l)" -ge 3 && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^(sqs_logging|s3_batch|s3_v2|s3_transport|legacy_s3|legacy_dynamodb|registry::catalog|finops::focus::destinations|s3_audit|audit|cold_storage_locator)::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "Filling CatalogInputs.aws in the server: B8742, which builds the catalog from Shared."
  - "The SigV4 steps: B10190 moves the S3 signer (s3_transport/signing.rs L67-L122) and B10191 the SQS and DynamoDB signers (sqs_logging/signing.rs, legacy_dynamodb/signing.rs) onto betterlite-sigv4. This task changes only the credential seam."
  - "Region rules of the loggers (B3991 and B3062's region rows): unchanged."
  - "Redis ElastiCache IAM (crates/betterlite-server/src/redis_cloud_auth/aws.rs L21-L26): it loads the SDK default chain, as LiteLLM's botocore session does (_redis_credential_provider.py L150-L159)."
pitfalls:
  - "betterlite-logging must not depend on betterlite-bedrock (bedrock depends on logging): the port and BoundCredentials live in logging, the impl in bedrock."
  - "DefaultChain must not apply LiteLLM's AWS_ROLE_NAME or AWS_PROFILE_NAME names: boto3's default chain doesn't read them, so it goes to native.load, never to get_credentials."
  - "Every test map that reaches the SDK chain sets AWS_EC2_METADATA_DISABLED=true and gives keys, so nothing reaches instance metadata."
  - "37 files build CatalogInputs literals (grep -rl 'CatalogInputs {'); give them the one stub from the test support module instead of a stub per file."
  - "Build on B10190 and B10191: s3_transport::signing's Credentials is then betterlite_sigv4's, and the SQS and DynamoDB signers take that type, so BoundCredentials and both clients pass the port's value as it is. Add no From impl or field-by-field copy."
review_level: security
budget:
  max_changed_lines: 1200
  max_new_expects: 0
