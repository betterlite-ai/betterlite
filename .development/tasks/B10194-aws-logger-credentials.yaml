id: B10194
title: The SQS, S3, DynamoDB and FOCUS S3 loggers get AWS credentials through the credential chain
description: >-
  betterlite-logging's AWS loggers sign only with static keys, because the crate sits below betterlite-bedrock and had no way to reach a credential chain. Each documents what it gives up. SQS refuses sqs_aws_profile_name, sqs_aws_role_name, sqs_aws_web_identity_token and sqs_aws_sts_endpoint at build (crates/betterlite-logging/src/sqs_logging/credentials.rs L84-L99, docs/deviations/B3995.yaml), where LiteLLM's SQSLogger passes all nine sqs_aws_* values to get_credentials (sqs.py L257-L267). The S3 v2 batch logger refuses the same four s3_aws_* settings (s3_batch/logger/setup.rs L29-L49) and signs only with a static pair (L62-L93, docs/deviations/B3994.yaml), where S3Logger v2 calls get_credentials with them (s3_v2.py L570-L580). The DynamoDB logger reuses SQS's `EnvironmentCredentials` (registry/catalog/dynamodb.rs L28-L38, docs/deviations/B3991.yaml), the legacy S3 logger and the FOCUS S3 destination read only a static pair or AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (legacy_s3/credentials.rs L35-L61, focus_s3_destination.rs L130-L139, docs/deviations/B3062.yaml), where LiteLLM hands their optional keys to boto3, which falls back to its default chain (dynamodb.py L28, s3.py L208-L220, focus/destinations/s3_destination.py L63-L78). SQS also keeps its own copy of LiteLLM's AWS_* fallback (`effective`, credentials.rs L55-L82), which B10192 put into the resolver. B10175's chain can serve both kinds of call, so each logger asks it through one port.


  The port. crates/betterlite-logging/src/aws_credentials.rs, the empty module the plan declares in betterlite-logging's lib.rs, holds `pub enum CredentialRequest { GetCredentials(AwsSettings), DefaultChain { keys: Option<Credentials>, region: Option<String> } }` (AwsSettings from betterlite-config's bedrock_settings; Credentials is `betterlite_sigv4::credentials::Credentials`, so betterlite-logging adds betterlite-sigv4), `AwsCredentialsError` (thiserror, one variant with the boxed source and the text "AWS credentials could not be resolved") and `#[async_trait] pub trait AwsCredentials: Send + Sync { async fn resolve(&self, request: &CredentialRequest) -> Result<Credentials, AwsCredentialsError>; }`. GetCredentials stands for BaseAWSLLM.get_credentials, DefaultChain for a boto3 client built with optional static keys: both keys given answer them as they are, otherwise the AWS SDK default chain at that region. `BoundCredentials { aws: Arc<dyn AwsCredentials>, request: CredentialRequest }` in the same module implements s3_transport's `CredentialSource` (s3_transport/signing.rs L34-L38) by resolving its request, so the S3 transport keeps its seam. `StaticCredentials` (L40-L52) stays for fixed keys in the transport tests and the b3993 oracle helper; legacy_s3's `ConfiguredCredentials` goes. The port answers betterlite_sigv4's `Credentials`, which B10190 makes s3_transport's `Credentials` and B10191 hands to the SQS and DynamoDB signers, so nothing copies credentials field by field: build this after both. s3_transport's `CredentialError::Unavailable` (signing.rs L28-L32) becomes `Unavailable(#[source] AwsCredentialsError)` with its text kept, so the chain's reason reaches the upload error; the FOCUS tests at finops/focus/destinations/tests/focus_s3_destination.rs L326 and L349 match `Unavailable(_)`.


  The chain implements it. `impl AwsCredentials for AwsCredentialChain` goes in a new file crates/betterlite-bedrock/src/credentials/chain/logging.rs, declared in chain.rs: GetCredentials calls `get_credentials(&settings, None)`; DefaultChain answers the keys when given and otherwise `native.load` with only the region set. A failure is the port error with the CredentialError or SourceError as its source.


  The loggers. `CatalogInputs` (registry/catalog.rs L98-L105) gains `pub aws: Arc<dyn AwsCredentials>`, and B8742 fills it from `Shared.aws_credentials`. SQS: `CredentialParams`, `EnvironmentCredentials`, `effective`, `validate_params`, `CredentialError::Unsupported` and `Missing` and the trait in sqs_logging/credentials.rs go; SqsDeps takes `credentials: Arc<dyn AwsCredentials>`, the settings keep the nine values as an `AwsSettings` with sqs_region_name as its region, and each send asks for GetCredentials with it. The nine *_VARIABLE constants go with `effective` unless a test of the settings still reads one. S3 v2: `unsupported_flow` and `configured_credentials` go with `InitError::CredentialFlow` and `MissingCredentials` (s3_batch/logger.rs L42-L49), and the batch logger signs through `BoundCredentials` over GetCredentials with the s3_aws_* values and s3_region_name; an empty configured value still counts as unset, as `secret` does today (setup.rs L50-L60). A logger without keys now builds and asks the chain at upload time, as LiteLLM does, so the test at s3_batch/logger/tests.rs L514 becomes one that the request carries no keys. `S3BatchDeps` (s3_batch/logger.rs L26-L35) gains `aws: Arc<dyn AwsCredentials>`, filled from `inputs.aws` in registry/catalog/s3_v2.rs L41 and s3_audit/dedicated.rs L43. The b3994 oracle helper (tools/oracle/src/helpers/logging/b3994.rs L181) passes a port of its own that answers the access key, secret key and session token of its GetCredentials settings, since every case in tools/oracle/cases/helpers/s3-log-batches-s3-batch sets s3_aws_access_key_id and s3_aws_secret_access_key. SQS's `SendError::Credentials` (sqs_logging/sender.rs L30-L31) and DynamoDB's `PutItemError::Credentials` (legacy_dynamodb/client.rs L40-L41) wrap `AwsCredentialsError` with their texts kept, and DynamoDB's `credentials` and `params` fields (client.rs L82-L83) become `aws` and a `CredentialRequest`. DynamoDB asks for DefaultChain with no keys at the logger's region. Legacy S3 and the FOCUS S3 destination ask for DefaultChain with their configured pair when both parts are set, at their region. `FocusDestinationFactory` (finops/focus/destinations/factory.rs L42-L49) gains `aws: Arc<dyn AwsCredentials>`, which `S3Connection` carries.


  Deviations. B3995.yaml loses its row about the refused profile, role, web identity and STS settings; B3994.yaml loses its row about static-only signing; B3991.yaml loses its DynamoDB credentials row; B3062.yaml's FOCUS row keeps only its region and endpoint_url parts.


  Tests. A test stub `NoAwsCredentials` (answers an error) in aws_credentials' tests support fills `aws` in every test CatalogInputs and FocusDestinationFactory literal. In betterlite-bedrock, credentials/chain/tests gains `logging_requests_resolve_through_the_chain`: GetCredentials with static keys in the settings answers them, DefaultChain with keys answers those keys, and DefaultChain without keys answers AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY from the chain's map (with AWS_EC2_METADATA_DISABLED=true). In betterlite-logging, with a recording fake port: sqs_logging's tests gain `profile_and_role_settings_reach_the_credential_port` (a logger with sqs_aws_role_name, sqs_aws_session_name and sqs_aws_profile_name builds, and its send asks for GetCredentials with those values and the queue's region); s3_batch/logger/tests gains `role_settings_reach_the_credential_port` (the same for s3_aws_role_name and s3_aws_web_identity_token); and legacy_s3, legacy_dynamodb and focus_s3_destination each gain `missing_keys_ask_for_the_default_chain` (no keys gives DefaultChain with None keys and the region; both keys give them as keys).


  What users see. An SQS or S3 v2 logger configured with a profile, a role, web identity or an STS endpoint now starts and signs with those credentials, as LiteLLM does, instead of refusing to start. The DynamoDB, legacy S3 and FOCUS S3 loggers without static keys now use the AWS SDK default chain (shared profile, IRSA, container and instance roles) instead of failing every upload.
