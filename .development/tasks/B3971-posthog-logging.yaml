deviations:
  - what: >-
      Dynamic posthog_api_url from standard_callback_dynamic_params allows per-request endpoint
      override, conflicting with B188's prohibition on request-selected export destinations.
    why: >-
      The source implements _get_credentials_for_request (lines 315-339) which checks
      standard_callback_dynamic_params.posthog_api_url before falling back to self.posthog_host.
      This decision point affects where credentials and events are routed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/posthog.py#L315-L339

out_of_scope:
  - B002 owns environment variable lookup and default value injection.
  - B173 owns HTTP pool and sync/async request execution (sync_client.post and async_client.post).
  - B189 owns CustomLogger initialization contract and callback registry.
  - B192 owns safe_dumps serialization for payloads.
  - B256 owns CustomBatchLogger base class, batch_size defaults, periodic_flush task setup and flush_queue implementation.
  - Mock client creation via should_use_posthog_mock() and create_mock_posthog_client() is from posthog_mock_client module and not rewritten.
  - The litellm._uuid module and verbose_logger are external dependencies not owned by this task.

pitfalls:
  - Batch size is 100; override via POSTHOG_MAX_BATCH_SIZE constant (only checked in types).
  - Queue structure stores {event, api_key, api_url} dicts to group by credentials during batch send.
  - Async setup via _ensure_async_setup is idempotent; first call creates flush_lock and starts periodic_flush.
  - Sync and async event creation both call create_posthog_event_payload; async queues it while sync POSTs it immediately.
  - Metadata filtering preserves user-provided keys outside litellm_internal_fields, which include endpoint, caching_groups, API key fields, budgets and spans.
  - _flush_on_exit is registered via atexit.register in __init__ and runs after other callbacks; it must not raise to prevent process hang.
  - Per-request credentials (posthog_api_key and posthog_api_url) override initialized values if present in standard_callback_dynamic_params.
  - Distinct ID selection falls back to UUID if all preferred sources are absent.

review_level: security
