id: B3971
title: PostHog analytics and credential grouped batches
description: >-
  Build PostHog event/property projection, distinct-ID selection and per-credential batch
  delivery. Support sync immediate sends, lazy async setup and shutdown draining without
  mixing events belonging to different credential/URL pairs.

  Read POSTHOG_API_KEY and POSTHOG_API_URL (default https://us.i.posthog.com) from B002;
  use B173 for sync/async POST to /batch/; use B192 for safe_dumps serialization; build
  on B189's CustomLogger initialization contract and B256's batch base, periodic flush and
  flush_queue. Construct PostHog payloads with event type (calling type embedding selects
  $ai_embedding, others $ai_generation), built-in properties ($ai_model, $ai_provider,
  $ai_input, $ai_output_choices, $ai_input_tokens, $ai_output_tokens, $ai_total_cost_usd,
  $ai_latency, $ai_is_error, $ai_error, $ai_trace_id, $ai_span_id, $ai_parent_id if
  present) and user-provided metadata filtered to exclude internal fields.

  Distinct ID selection: prefer user_id from metadata, then end_user from standard logging
  object, then trace_id, fallback to UUID. Get credentials per-request from
  standard_callback_dynamic_params.posthog_api_key/posthog_api_url, falling back to
  initialized POSTHOG_API_KEY and POSTHOG_API_URL.

  Sync log_success_event: resolve credentials, create event payload, POST immediately with
  /batch/ endpoint constructed from api_url, swallow errors in verbose_logger.exception.
  Async async_log_success_event and async_log_failure_event: lazy-initialize flush_lock
  and call periodic_flush (from B256) on first async entry, then call _log_async_event to
  queue the event. On batch-size threshold (100 by default from
  POSTHOG_MAX_BATCH_SIZE), call flush_queue from B256.

  Batch delivery: group log_queue by (api_key, api_url) tuple, building separate batches
  for each unique pair. Send each batch to its own /batch/ endpoint (constructed from
  api_url). Queue structure: [{event: PostHogEventPayload, api_key, api_url}, ...]. Async
  async_send_batch groups by credentials and POSTs all batches, clearing log_queue on
  success (after raise_for_status). Metadata is applied after built-in properties and can
  overwrite them unless explicitly in litellm_internal_fields.

  Register atexit handler in __init__ to call _flush_on_exit, which synchronously groups
  the remaining queue by credentials and POSTs each batch using sync_client. The queue
  is cleared only when all batches in the flush send successfully; on any send failure
  it is left untouched, and the error is logged via verbose_logger.error without raising.

  Preserve the batch size (100); only call type embedding selects $ai_embedding. Mock mode
  enabled via should_use_posthog_mock() passes to create_mock_posthog_client() in __init__.

