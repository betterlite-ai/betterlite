deviations: []
out_of_scope:
  - The remaining bodies of _complete_custom_openai and _complete_text_completion_openai are B024; _complete_aiohttp_openai, _complete_aleph_alpha, _custom_api_first_output, _complete_custom, _complete_custom_providers and the custom/proxy embedding branches are B044.
  - Provider-specific main.py completion functions retain their owners by suffix — azure/azure_text B025; azure_ai B026; anthropic/anthropic_text B027; bedrock/bedrock_mantle B028; vertex_ai/vertex_ai_beta B031; xai/mistral/text_completion_codestral B036; cohere_chat B037.
  - The remaining _complete_ suffix groups are deepseek/heroku/groq/cometapi/bytez B038; minimax/amazon_nova/text_completion_inception B039; hosted_vllm/oobabooga/vllm/ollama/ollama_chat/triton/lemonade B040; fireworks_ai/together_ai/replicate/huggingface/openrouter/vercel_ai_gateway/edenai/predibase/petals B041; sap/oci/databricks/datarobot/sagemaker_chat/sagemaker/watsonx/watsonx_text/cloudflare/snowflake/gdc/ovhcloud B042; gigachat/nlp_cloud/maritalk/compactifai/nadir/gradient_ai B043; fal_ai B046; ragflow B049; a2a/langgraph/langflow B050.
  - Shared main.py helper ownership is B500 for _is_openai_backed_api_base and _resolve_openai_api_base, B195 for _load_default_encoding, B196 for _load_module_encoding/_get_encoding, B198 for _provider_config_items/_locals_snapshot/_dispatch_metadata and the three _dispatch_client helpers, and B2239 for print_verbose.
  - B2227 retains all main.py stream assembly and cost helpers from stream_chunk_builder through _simple_text_part; all other main.py facade, mock, bridge, pricing-registration, retry and adapter callables remain B158, including completion/embedding outside the explicitly owned stanzas.
pitfalls:
  - A Copilot Responses request with no model bypasses the per-model capability check.
  - The common OpenAI handler already inserts extra_headers and must not receive a second independent insertion path.
  - Mounting an additional copy of an API family route would panic before any subscription request can run.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
