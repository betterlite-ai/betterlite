id: B045
title: Connect ChatGPT and Copilot subscription operations to the gateway
description: >-
  Install chatgpt and github_copilot in B010's closed provider dispatcher through an upper-layer
  api::subscription_dispatch service in betterlite-core. Compose B1507-B1516 without moving their
  core-dependent adapters into a lower provider crate. B174 and B2230 select the subscription identity;
  B024 supplies common OpenAI completion dispatch. Own main.py's Copilot authorization stanza inside
  _complete_custom_openai at 2635-2646 and its embedding branch at 6488-6503. The chat stanza obtains
  a subscription key, builds defaults and then overlays extra_headers; preserve B024's normal versus
  EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER=false dispatch semantics. The embedding branch forwards
  the common call context to B1516, whose authentication supersedes the forwarded key.

  Install ChatGPT chat normalization and forced-stream Responses buffering, Copilot native-reply chat
  repair, embedding and Messages policy, and the Copilot Responses capability predicate. Model=None
  permits native Copilot Responses; otherwise B1515 decides native versus the existing chat bridge.
  Allocate all stream maps per call. Share the configured token stores and operator login sink without
  exposing token/device-code values to client errors or logs. Retain the resolved base and settings
  from the leaf services; there are no new environment variables in this composition layer.

  Exercise the booted proxy using temporary subscription token files and a mock upstream. Existing
  factories remain the sole route registrars. Cover POST /v1/chat/completions, /chat/completions,
  /engines/{model}/chat/completions and /openai/deployments/{model}/chat/completions; /v1/embeddings,
  /embeddings, /engines/{model}/embeddings and /openai/deployments/{model}/embeddings; /v1/responses,
  /responses and /openai/v1/responses; /v1/messages and /claude_code_gateway/v1/messages with the
  gateway enabled. Parameterize alias cases within the named fixtures. Assert proxy auth, exact
  upstream model/headers/body, status, error.type/param/code and returned headers. Include chatgpt
  repeated tool IDs, ChatGPT SSE returned as JSON, Copilot extra-header precedence under both handlers,
  native-versus-chat Responses models, embedding prefix removal, Messages trusted-host enforcement,
  empty-key 401 and missing proxy-key rejection before upstream I/O. Do not use helper calls for routes.

  The two owned dispatch spans contain 26 nonblank/non-comment lines; composition adds about 150
  Rust lines and 260 test/fixture lines. Test subscription_dispatch in both betterlite-core and
  betterlite-server. Reuse operation parsers and their fuzz corpora; cap the complete change at 550.
