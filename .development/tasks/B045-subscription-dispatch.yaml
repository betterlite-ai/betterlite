dod:
  - text: Both subscription names execute their supported operations through existing routes with the correct upstream credentials and transformations.
    proof: [subscription-tests, oracle]
  - text: Token failures, proxy authentication and Messages host restriction remain observable at the HTTP boundary.
    proof: [subscription-tests, oracle]
checks:
  optional: []
  commands:
    - id: subscription-tests
      why: subscription composition or its booted gateway coverage is missing
      run: cargo nextest run --locked -p betterlite-core -p betterlite-server --no-tests=fail -E 'test(/subscription_dispatch::/)'
