id: B4813
title: A2A error classification and client reconstruction
description: >-
  Build exception classification for A2A SDK errors and recovery for clients whose cards
  contain localhost URLs. Preserve the existing pooled HTTP client and call-context headers
  while changing the target card URL and streaming mode.

  A2AExceptionCheckers provides three static methods for error inspection: is_connection_error
  checks if an error message contains connection-failure patterns; is_localhost_url delegates
  to B4800's is_localhost_or_internal_url to detect development URLs; is_agent_card_error
  detects card-related failures by substring matching.

  map_a2a_exception examines an exception and optional card/API URLs, then raises the
  appropriate A2A exception type: A2ALocalhostURLError if the error is a connection failure
  to a localhost URL (checked first, enabling retry), A2AAgentCardError if the error message
  contains card-related keywords, A2AConnectionError for other connection failures, and
  A2AError as the default. Error strings are checked case-insensitively.

  handle_a2a_localhost_retry receives an A2ALocalhostURLError, the current agent card, the
  current A2A client, and a streaming flag. It performs five steps in order: check that the
  agent card is not None (raise RuntimeError if missing), log a warning via LiteLLM's
  verbose_logger with the localhost URL and base URL, call B4800's set_agent_card_url to
  mutate the card to the base URL, extract the retained httpx_client from the existing
  a2a_client's _litellm_httpx_client attribute (raise RuntimeError if absent), then use the
  A2A SDK's create_client with the mutated card and a ClientConfig specifying the retained
  httpx_client and streaming mode, attach both the client and call-context to the new client
  for subsequent operations, and return the reconstructed client. The A2A SDK is imported
  conditionally; if unavailable, raise ImportError.

  This task does not call B4801's create_a2a_client, so there is no recovery/transport
  dependency cycle.

scope:
