    why: A2AExceptionCheckers class with is_connection_error, is_localhost_url, is_agent_card_error static methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/exception_mapping_utils.py#L97-L157
    why: map_a2a_exception function maps SDK exceptions to typed A2A exception variants by checking localhost, card, connection and generic patterns.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/exception_mapping_utils.py#L160-L227
    why: handle_a2a_localhost_retry reconstructs a client with mutated card, retained httpx_client and call-context.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1-L30
