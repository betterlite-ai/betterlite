id: B3882
title: Prometheus budget gauge projection
description: >-
  Build the code that turns one budget record (a team, an organization, a virtual key, a user or a
  customer) into Prometheus gauge samples, plus the two small gauges that sit next to them. Put it in
  crates/betterlite-logging/src/prometheus/budget_gauges.rs and budget_gauges/**. It ports
  litellm/integrations/prometheus.py lines 161-162, 3597-3615, 3893-3934, 4017-4072, 4136-4182,
  4230-4310, 4469-4519.

  The gauges are the collectors B3874 builds (crates/betterlite-prometheus) and the label sets come
  from get_labels_for_metric (B3874) and prometheus_label_factory (B3873) fed with UserAPIKeyLabelValues
  (B3870). A disabled gauge is B3874's no-op collector, so a setter here never checks for it. Define one
  plain input record per entity, so the caller builds it and no setter needs the auth or table types:
  TeamBudgetGaugeInput (team_id, team_alias: Option, spend: Option<Decimal>, max_budget: Option<Decimal>,
  budget_reset_at: Option<DateTime<Utc>>), OrgBudgetGaugeInput (org_id, org_alias, spend, max_budget,
  budget_reset_at), KeyBudgetGaugeInput (token, key_alias: Option, spend, max_budget, budget_reset_at),
  UserBudgetGaugeInput (user_id, user_email: Option, user_alias: Option, spend, max_budget,
  budget_reset_at) and CustomerBudgetGaugeInput (end_user_id, spend, max_budget, budget_reset_at).
  Money is rust_decimal::Decimal. Hours are f64.

  Shared helpers. remaining_budget(max_budget, spend) returns RemainingBudget::Unlimited when max_budget
  is None, the max_budget alone when spend is None, and max_budget minus spend otherwise (it can be
  negative). Unlimited is written to the gauge as positive infinity through the explicit infinity value
  B3874's collector exposes; never convert it to a large number. remaining_hours_for_budget_reset(reset_at,
  now) is (reset_at minus now) in seconds divided by 3600, negative when the reset time has passed. Take
  `now` as an argument from an injected clock so tests are exact.

  Each setter follows one shape. First the remaining-budget gauge is always set. Then the max-budget gauge
  is set only when max_budget is Some. Then the remaining-hours gauge is set only when budget_reset_at is
  Some. Per entity:
  set_team_budget_metrics uses labels team = team_id and team_alias = alias or "" and the metrics
  litellm_remaining_team_budget_metric, litellm_team_max_budget_metric, litellm_team_budget_remaining_hours_metric.
  set_org_budget_metrics uses org_id and org_alias and the three litellm_*_org_* metrics
  (litellm_remaining_org_budget_metric, litellm_org_max_budget_metric, litellm_org_budget_remaining_hours_metric).
  set_key_budget_metrics uses hashed_api_key = token and api_key_alias = alias or "" with
  litellm_remaining_api_key_budget_metric, litellm_api_key_max_budget_metric,
  litellm_api_key_budget_remaining_hours_metric.
  set_user_budget_metrics uses user, user_email or "" and user_alias or "" with litellm_remaining_user_budget_metric,
  litellm_user_max_budget_metric, litellm_user_budget_remaining_hours_metric.
  set_customer_budget_metrics uses the end_user label with litellm_remaining_customer_budget_metric,
  litellm_customer_max_budget_metric, litellm_customer_budget_remaining_hours_metric. It builds the labels
  once with the remaining-budget metric's label list. When the resulting end_user label is None (the
  end-user cost-tracking policy suppressed it) it returns without writing anything. After every customer
  set it calls B3876's track_end_user_metric_series for that gauge so the end-user series cap applies.
  The team, org and user setters rebuild the label set for each gauge from that gauge's own label list.
  The key setter does not: its remaining-hours gauge reuses the label set of the most recent label build,
  which is the max-budget gauge's labels when max_budget is Some and the remaining-budget gauge's labels
  when it is None. Keep that, because a user can give those two metrics different label lists.

  Smaller pieces. set_team_members_metric sets litellm_team_members_metric to the number of members the
  team has, with team and team_alias (alias or "") labels; its input is the team id, alias and a member
  count. track_provider_remaining_budget(provider, spend, budget_limit) sets
  litellm_provider_remaining_budget_metric for the single label value `provider`, with no label factory,
  to remaining_budget(budget_limit, spend). customer_budget_metrics_enabled(gate) is true only when
  litellm.enable_end_user_cost_tracking_prometheus_only is exactly true and litellm.disable_end_user_cost_tracking
  is not truthy; both settings default to None, so it is false by default. The gate is a small struct of two
  Option<bool> fields that the caller fills from the settings B1716 already loads. customer_budget_gauges_are_noop
  is true when all three customer gauges are the no-op collector.

  Bulk setters used by the refresh job (B3884). set_key_list_budget_metrics takes a list whose entries are
  either a full key record or just a key string, and sets metrics only for full records; strings are
  skipped. set_team_list_budget_metrics and set_user_list_budget_metrics call the single setter for each
  entry in order. set_org_list_budget_metrics reads each org row: org_id = organization_id or "", org_alias
  = organization_alias or "", spend = spend or 0, and max_budget and budget_reset_at from the joined budget
  table, both None when the row has no budget table. set_customer_budget_metrics_from_row(customer,
  default_budget) uses the customer's own budget table when it has one, else the default budget (may be
  None), and passes that table's max_budget and budget_reset_at. Note this is the one customer path that
  does pass budget_reset_at; the per-request customer path (B3883) always passes None.

