deviations:
  - what: Each setter takes a plain input record (TeamBudgetGaugeInput and the like) instead of LiteLLM_TeamTable, UserAPIKeyAuth, LiteLLM_UserTable or a prisma row.
    why: betterlite-logging cannot depend on the auth or table crates, and the caller already holds typed data.
  - what: spend and max_budget are Decimal, and the gauge value is converted once at the collector call; an unlimited budget is written as the collector's explicit positive-infinity value.
    why: money is never a float in betterlite, and LiteLLM's float("inf") needs an explicit form (see B3874's deviation).
  - what: budget_reset_at is a UTC timestamp, so a reset time without a timezone is not accepted; LiteLLM's datetime.now(reset_at.tzinfo) would use local time for a naive value.
    why: the carried snapshots (B3890) and stored columns are UTC, and a local-time clock would make the gauge depend on the host.
  - what: The hours calculation takes `now` from an injected clock.
    why: tests and oracle cases need exact values.

out_of_scope:
  - "The per-request lookups that build the input record (_set_team_budget_metrics_after_api_request, _assemble_team_object, _set_org_budget_metrics_after_api_request, _set_customer_budget_metrics_after_api_request, _get_default_customer_budget, _set_api_key_budget_metrics_after_api_request, _assemble_key_object, _set_user_budget_metrics_after_api_request, _assemble_user_object): B3883."
  - "_increment_remaining_budget_metrics (the asyncio.gather fan-out with the PROMETHEUS_BUDGET_METRICS_PER_REQUEST_TIMEOUT wait_for, default 5 seconds) and _get_budget_metrics_per_request_timeout: no task owns them at the moment; it calls B3883's functions, so it cannot sit here. See the notes in the report."
  - "The paginated refresh job and its cron (_initialize_budget_metrics and the _initialize_*_budget_metrics functions at prometheus.py:3617-3860, initialize_budget_metrics_cron_job): B3884."
  - "The gauge definitions and registration (prometheus.py:427-530, 636): B3874 builds the collectors and B3875 registers them."
  - "_track_end_user_metric_series and the series tracker: B3876."
  - "prometheus_label_factory and the end-user label resolution: B3873."
  - "Counters for usage and spend: B3877. Latency, guardrail and _safe_duration_seconds: B3878. Rate-limit gauges: B3879."
  - "The deployment-level budget and tpm/rpm gauges and the callers of track_provider_remaining_budget in routing: their own tasks (B020 and the routing budget tasks call this function)."

pitfalls:
  - The key setter reuses `_labels` from the max-budget build for the remaining-hours gauge, but the team, org and user setters rebuild labels for their hours gauge; do not unify them.
  - remaining_budget with max_budget None is infinity even when spend is set, and with spend None it is the whole max_budget, so a fresh key with a limit shows the limit.
  - "A max_budget of zero is still Some, so the max-budget gauge is written with 0. Test Some versus None, never truthiness."
  - The hours gauge is written for a reset time in the past, with a negative value; do not clamp it to zero.
  - litellm_team_budget_remaining_hours_metric's help text in LiteLLM says "days" while the gauge is hours; keep B3874's registered text and write hours.
  - The customer path returns before any write when the label factory resolves end_user to None, so the remaining-budget gauge is not written either.
  - team_alias, api_key_alias, user_email, user_alias, org_alias are written as "" when absent, not left out of the label set.
  - The org list setter has no budget table for an org created without a budget, so max_budget and budget_reset_at are both None and only the remaining-budget gauge (infinity) is written.
  - track_provider_remaining_budget passes the provider as the only positional label value, so it must not go through the label factory or the label include/exclude filters.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
