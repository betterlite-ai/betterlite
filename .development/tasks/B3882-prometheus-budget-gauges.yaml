dod:
  - text: remaining_budget returns Unlimited for no max_budget, max_budget when spend is None, and max_budget minus spend (negative allowed) otherwise; Unlimited is written as positive infinity.
    proof: [remaining-budget-tests]
  - text: remaining_hours_for_budget_reset returns (reset_at - now) in hours and is negative once the reset time has passed.
    proof: [reset-hours-tests]
  - text: Team, org, key and user setters always set the remaining-budget gauge, set the max-budget gauge only when max_budget is Some, and set the remaining-hours gauge only when budget_reset_at is Some, with the alias and email fallbacks to "".
    proof: [entity-setter-tests]
  - text: The key setter's remaining-hours gauge uses the label set of the last label build, so it takes the max-budget gauge's labels when max_budget is Some.
    proof: [key-label-reuse-tests]
  - text: The customer setter writes nothing when the resolved end_user label is None, and calls the end-user series tracker after each gauge it sets.
    proof: [customer-setter-tests]
  - text: customer_budget_metrics_enabled is true only for enable flag exactly true with the disable flag not truthy, and false when both are None.
    proof: [customer-gate-tests]
  - text: customer_budget_gauges_are_noop is true only when all three customer gauges are no-op collectors.
    proof: [customer-gate-tests]
  - text: set_team_members_metric and track_provider_remaining_budget set their gauges with the labels described, the provider one without the label factory.
    proof: [small-gauge-tests]
  - text: The key list setter skips string entries, the org list setter defaults a missing id, alias and spend and a missing budget table to None limits, and the customer row setter falls back to the default budget and passes its reset time.
    proof: [list-setter-tests]
  - text: The setters give the same sample names, label sets and values as LiteLLM for the recorded cases.
    proof: [helper-case-corpus]

checks:
  optional: []
  commands:
    - id: remaining-budget-tests
      why: the remaining-budget rule is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::remaining_budget::/)'
    - id: reset-hours-tests
      why: the hours-to-reset calculation is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::reset_hours::/)'
    - id: entity-setter-tests
      why: team, org, key or user setters skip a gauge or mislabel one
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::team::/) | test(/^prometheus::budget_gauges::org::/) | test(/^prometheus::budget_gauges::key::/) | test(/^prometheus::budget_gauges::user::/)'
    - id: key-label-reuse-tests
      why: the key hours gauge does not reuse the previous label set
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::key_label_reuse::/)'
    - id: customer-setter-tests
      why: the customer setter emits without an end_user label or skips series tracking
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::customer::/)'
    - id: customer-gate-tests
      why: the customer opt-in gate or the no-op check is wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::customer_gate::/)'
    - id: small-gauge-tests
      why: the team members or provider remaining budget gauge is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::small_gauges::/)'
    - id: list-setter-tests
      why: the bulk setters used by the refresh job are missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus::budget_gauges::lists::/)'
    - id: helper-case-corpus
      why: the recorded LiteLLM gauge samples are missing or differ
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/budget-gauges)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

