id: B686
title: Azure assistant definition operations
description: >-
  Port Azure assistant client preparation and list/create/delete definition operations using B519 SDK wire records
  and decoders, the Azure endpoint resolver and assistants=v2 header. Keep threads/messages/runs in their own parts.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/assistants.py:
  AzureAssistantsAPI.__init__ L37-L38; AzureAssistantsAPI.get_azure_client L40-L64; AzureAssistantsAPI.async_get_azure_client
  L66-L92; AzureAssistantsAPI.async_get_assistants L96-L120; AzureAssistantsAPI.get_assistants L125-L136; AzureAssistantsAPI.get_assistants
  L139-L150; AzureAssistantsAPI.get_assistants L154-L190; AzureAssistantsAPI.async_create_assistants L908-L932;
  AzureAssistantsAPI.create_assistants L934-L971; AzureAssistantsAPI.async_delete_assistant L974-L998; AzureAssistantsAPI.delete_assistant
  L1000-L1037.


  Named case contracts: list_assistants: Call beta.assistants.list() with NO order/limit/before/after arguments,
  sync and async. Return cursor page unchanged. Unlike B519 OpenAI, Azure does not add desc/20 defaults at this
  wrapper layer. create_assistant: Forward every create_assistant_data field unchanged to beta.assistants.create;
  return SDK assistant unchanged, no local model rewrite or response normalization. delete_assistant: Forward assistant_id
  to beta.assistants.delete and return its result unchanged; do not apply the Azure Files empty-response fallback.
  assistants_beta_default: The shared SDK beta namespace supplies OpenAI-Beta: assistants=v2 for list/create/delete.
  Use the same header contract and fixtures as B519/B520/B527; Azure endpoint and api-version remain from B531,
  with model_name empty. azure_assistant_client_inputs: Only client is None triggers B531 initialize_azure_sdk_client(litellm_params
  or {},api_key,api_base,model_name="",api_version,is_async). Supplied client is returned as-is with no class guard.
  Explicit method azure_ad_token,timeout,max_retries are accepted but NOT forwarded to the initializer; values inside
  litellm_params still take effect. Test conflicting arguments versus litellm_params. azure_assistant_async_flags:
  Only literal True for aget_assistants,async_create_assistants,async_delete_assistants chooses async; missing/None/False
  and other truthy facade values stay sync. Constructors and SDK calls have no catch; preserve failures.


  Write standalone Rust test azure_assistant_definitions_credential_identity_isolation in betterlite-azure: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test azure_assistant_definitions_secret_safe_failure in betterlite-azure: Debug and owned
  failure paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-azure/src/azure_assistant_definitions.rs with adjacent tests under azure_assistant_definitions/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_assistant_definitions in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_assistant_definitions_cases in betterlite-azure with these exact named cases (one
  per oracle file): list_assistants, create_assistant, delete_assistant, assistants_beta_default, azure_assistant_client_inputs,
  azure_assistant_async_flags. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_assistant_definitions* using HelperCase:
  kind: helper and the externally tagged azure_assistant_definitions variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_azure_assistant_definitions that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 254 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 235 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 630 planned, 650 maximum changed lines.
