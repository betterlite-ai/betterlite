id: B686
title: Azure assistant definition operations
description: >-
  Port Azure assistant client preparation and list/create/delete definition operations using B519 wire records,
  the Azure endpoint resolver and assistants=v2 header. Keep threads/messages/runs in their own parts.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/assistants.py:
  AzureAssistantsAPI.__init__ L37-L38; AzureAssistantsAPI.get_azure_client L40-L64; AzureAssistantsAPI.async_get_azure_client
  L66-L92; AzureAssistantsAPI.async_get_assistants L96-L120; AzureAssistantsAPI.get_assistants L125-L136; AzureAssistantsAPI.get_assistants
  L139-L150; AzureAssistantsAPI.get_assistants L154-L190; AzureAssistantsAPI.async_create_assistants L908-L932;
  AzureAssistantsAPI.create_assistants L934-L971; AzureAssistantsAPI.async_delete_assistant L974-L998; AzureAssistantsAPI.delete_assistant
  L1000-L1037.


  Implement crates/betterlite-azure/src/azure_assistant_definitions.rs with adjacent tests under azure_assistant_definitions/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_assistant_definitions in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_assistant_definitions_cases in betterlite-azure with these exact named cases (one
  per oracle file): list_assistants, create_assistant, delete_assistant, azure_beta_header. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_assistant_definitions* using HelperCase:
  kind: helper and the externally tagged azure_assistant_definitions variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_azure_assistant_definitions that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 254 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 275 production lines, 81 behavior/config-test lines,
  71 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 467 planned, 475 maximum changed lines.
