checks:
  optional:
  - mutants
  commands:
  - id: case-list-assistants
    why: Call beta.assistants.list() with NO order/limit/before/after arguments, sync and async. Return cursor page
      unchanged. Unlike B519 OpenAI, Azure does not add desc/20 defaults at this wrapper layer.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_cases::case_[0-9]+_list_assistants$/)'
  - id: case-create-assistant
    why: Forward every create_assistant_data field unchanged to beta.assistants.create; return SDK assistant unchanged,
      no local model rewrite or response normalization.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_cases::case_[0-9]+_create_assistant$/)'
  - id: case-delete-assistant
    why: Forward assistant_id to beta.assistants.delete and return its result unchanged; do not apply the Azure
      Files empty-response fallback.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_cases::case_[0-9]+_delete_assistant$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_assistant_definitions.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_assistant_definitions*")"
      && grep -lq 'azure_assistant_definitions' tools/oracle/fuzz/corpus/helper_case/azure_assistant_definitions*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_assistant_definitions$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-assistants-beta-default
    why: 'The shared SDK beta namespace supplies OpenAI-Beta: assistants=v2 for list/create/delete. Use the same
      header contract and fixtures as B519/B520/B527; Azure endpoint and api-version remain from B531, with model_name
      empty.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_cases::case_[0-9]+_assistants_beta_default$/)'
  - id: case-azure-assistant-client-inputs
    why: Only client is None triggers B531 initialize_azure_sdk_client(litellm_params or {},api_key,api_base,model_name="",api_version,is_async).
      Supplied client is returned as-is with no class guard. Explicit method azure_ad_token,timeout,max_retries
      are accepted but NOT forwarded to the initializer; values inside litellm_params still take effect. Test conflicting
      arguments versus litellm_params.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_cases::case_[0-9]+_azure_assistant_client_inputs$/)'
  - id: case-azure-assistant-async-flags
    why: Only literal True for aget_assistants,async_create_assistants,async_delete_assistants chooses async; missing/None/False
      and other truthy facade values stay sync. Constructors and SDK calls have no catch; preserve failures.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_cases::case_[0-9]+_azure_assistant_async_flags$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_assistant_definitions_secret_safe_failure$/)'
