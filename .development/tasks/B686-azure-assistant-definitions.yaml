dod:
- text: 'list assistants: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-assistant-definitions/list-assistants.yaml.'
  proof:
  - case-list-assistants
  - oracle
  - helper-python
- text: 'create assistant: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-assistant-definitions/create-assistant.yaml.'
  proof:
  - case-create-assistant
  - oracle
  - helper-python
- text: 'delete assistant: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-assistant-definitions/delete-assistant.yaml.'
  proof:
  - case-delete-assistant
  - oracle
  - helper-python
- text: 'azure beta header: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-assistant-definitions/azure-beta-header.yaml.'
  proof:
