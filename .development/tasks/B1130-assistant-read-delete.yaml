dod:
- text: 'assistant list page: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-assistant-list-page
  - oracle
- text: 'assistant delete: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-assistant-delete
  - oracle
- text: Every enumerated config/environment setting loads, defaults and changes the typed settings; existing YAML
    fuzz corpus exercises the new keys.
  proof:
  - config-tests
  - config-corpus
- text: The independent Rust/Python helper adapter and the externally tagged case seed execute through B171.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: Every listed case is a newly added parity fixture and compares independent native and pinned results.
