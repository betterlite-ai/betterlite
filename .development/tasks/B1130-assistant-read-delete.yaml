id: B1130
title: Assistant list and delete SDK calls
description: >-
  Implement whole get/aget_assistants and delete/adelete_assistant in core::api::assistant_read_delete.
  Use B519 OpenAI and B686 Azure operations, B174 provider resolution, B176 controls and B010 GenericLiteLLMParams,
  B011 async exception mapping and B2487 settings. B2401 AssistantReadDelete compares actual SDK HTTP.
  Provider is required, delete also needs assistant_id; client/api_key/api_base/api_version are nullable.
  Getter flags default null; list rejects a nonboolean with Exception and delete with ValueError.
  Share settings projection with creation but preserve list's different Azure client handling.

  The four complete functions own 255 nonblank/non-comment lines at 38-190 and 374-520. Allocate 205
  implementation, 165 tests, 85 adapters, 140 fixtures and 40 corpus/wiring, 635 total. B2487 owns the
  listed credential/env chains and loader tests; B519 owns assistant wire decoding. Extend SDK case
  corpus only. No helper adapter, route registration or new outside-byte parser belongs here.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/assistant_read_delete.rs
  - crates/betterlite-core/src/api/assistant_read_delete/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/assistant_read_delete.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/assistant_read_delete.py
  - tools/oracle/cases/sdk-http/assistant-read-delete/**
  - tools/oracle/fuzz/corpus/sdk_http_case/assistant-read-delete-*
  - tools/oracle/helpers/b1130.py
  - tools/oracle/helpers/b1130/**
  - tools/oracle/src/helpers/core_ops/b1130.rs
  - tools/oracle/src/helpers/core_ops/b1130/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L38-L190
  why: List's full wrappers validate aget_assistants, omit pagination forwarding and retain a supplied Azure client.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L374-L520
  why: Delete validates its own async flag, drops OpenAI-instance clients on Azure and treats a null response as an internal error.
dod:
- text: >-
    assistant_list_discards_sdk_pagination supplies after=asst_a,before=asst_z,limit=3,order=asc to both
    SDK modes; none is passed to B519, whose defaults send GET /v1/assistants?order=desc&limit=20. Return
    mock {object:list,data:[<asst_b>],has_more:true,first_id:asst_b,last_id:asst_b} unchanged. Both OpenAI
    and Azure use their provider beta header. No assistant records are synthesized or recursively altered.
  proof: [read-delete-tests, oracle, python-adapter]
- text: >-
    delete_assistant_identifier sends asst_a in both modes and observes DELETE /v1/assistants/asst_a,
    response {id:asst_a,object:assistant.deleted,deleted:true}. B519 handles id encoding; wrapper does not
    parse a managed id. Native supplied-client capture proves Azure delete discards isinstance(OpenAI)
    clients (including AzureOpenAI), whereas Azure list keeps them. Async clients are not discarded by
    that sync-class check. Both wrappers preserve copied context and await only coroutine results.
  proof: [read-delete-tests, oracle, python-adapter]
- text: >-
    assistant_read_credentials enumerates B2487 precedence with request/global/env keys and bases:
    OpenAI request then litellm.api_base then OPENAI_BASE_URL then OPENAI_API_BASE then https://api.openai.com/v1;
    key request then litellm.api_key then litellm.openai_key then OPENAI_API_KEY; organization request then
    litellm.organization then OPENAI_ORGANIZATION. Azure base/version request then global then AZURE_API_BASE/
    AZURE_API_VERSION, key request then global api_key then azure_key then AZURE_OPENAI_API_KEY then AZURE_API_KEY.
    Distinct sentinels and empty-string fallthrough prove each winner in upstream URL/auth/header. Default
    timeout is 600, timeout=0/request_timeout=8 selects 8, "7.5" converts, structured timeout is retained.
  proof: [read-delete-tests, oracle, python-adapter]
- text: >-
    assistant_read_azure_extra_body sets AZURE_AD_TOKEN=env-token: omitted/{} extra_body gives no token,
    explicit null uses env-token, {azure_ad_token:body-token} uses and removes body-token from that map.
    Native calls retain B176 litellm_params and max_retries. Both providers forward client in list; only
    delete applies the Azure discard rule. Extra query/body pagination does not alter the list URL.
  proof: [read-delete-tests, oracle, python-adapter]
- text: >-
    assistant_read_flags_and_failures sends 1/"true" for aget_assistants and gets Exception
    "Invalid value passed in for aget_assistants. Only bool or None allowed"; async_delete_assistants gets
    ValueError with its corresponding flag name. null,false,true are legal. Unsupported anthropic yields
    BadRequestError,400,type/param/code=null and source "LiteLLM doesn't support anthropic for 'get_assistants'. Only 'openai' is supported."
    or the delete_assistant variant. Null list provider result repeats the get_assistants BadRequestError;
    null delete result is InternalServerError,500,type=internal_server_error,param/code=null,message="No response returned from 'delete_assistant'".
    Mock 404 body {error:{message:missing,type:invalid_request_error,param:assistant_id,code:missing}}
    stays NotFoundError,404 with those body fields in sync; async maps through B011 with empty model and
    completion_kwargs={}, yielding null type/param/code. Capture before asserting; never apply a proxy envelope.
  proof: [read-delete-tests, oracle, python-adapter, sdk-corpus]
checks:
  optional: []
  commands:
  - id: read-delete-tests
    why: assistant read/delete wrappers lose pagination omission, client selection or error distinctions
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_read_delete::tests::/) - test(/::replays_corpus$/)'
  - id: python-adapter
    why: assistant list/delete has no independent SDK HTTP comparison
    run: test -f tools/oracle/sdk_http/assistant_read_delete.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: no new list/delete case exercises the SDK operation decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/assistant-read-delete-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/assistant-read-delete/assistant-list-discards-sdk-pagination.yaml
- tools/oracle/cases/sdk-http/assistant-read-delete/delete-assistant-identifier.yaml
- tools/oracle/cases/sdk-http/assistant-read-delete/assistant-read-credentials.yaml
- tools/oracle/cases/sdk-http/assistant-read-delete/assistant-read-azure-extra-body.yaml
- tools/oracle/cases/sdk-http/assistant-read-delete/assistant-read-flags-and-failures.yaml
deviations: []
out_of_scope:
- B1055 owns assistant creation; B1056 threads; B1057 messages; B089 and its SDK split runs. B1085 owns HTTP aliases.
- B2487 owns resource settings and finite-timeout deviation; B519/B686 implement provider methods and beta headers.
pitfalls:
- SDK list pagination kwargs are accepted but never forwarded to the provider method.
- List and delete use different exception classes for invalid async flags.
- A null list result is a bad request, while a null delete result is an internal server error.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
