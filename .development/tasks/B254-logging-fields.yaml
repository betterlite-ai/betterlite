id: B254
title: Typed standard logging fields and normalization
description: >-
  Define StandardLoggingPayload and related typed metadata/error/status records from types/utils.py 3570-3615 in
  betterlite-logging/src/fields.rs. Preserve all roughly 45 fields, with absent optional auth/spend/guardrail values
  rather than fake zeros. Represent startTime, endTime, completionStartTime and response_time as Decimal seconds
  serialized as JSON numbers; costs/rates also use Decimal. Implement StandardLoggingPayloadSetup cleanup_timestamps,
  append_system_prompt_messages, get_usage_from_response_obj/get_usage_as_dict and get_final_response_obj plus _get_status_fields/_extract_response_obj_and_hidden_params.
  Other setup helpers are B253 and final assembly B190. Budget 300 fields/normalizers, 100 adapters, 300 tests and
  60 wiring (760 total). Write the behavior rstest functions logging_fields_behavior_tests_behavior in adjacent tests.rs files,
  with a named case for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation logging_fields is already registered; each
  operation has its own Rust and Python adapter file and corpus seed. Also own _provider_response_id, _timestamp_seconds,
  get_response_ms and _transform_usage_objects as scalar/typed projections; keep native response variants with their
  endpoint owners.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/fields.rs
  - crates/betterlite-logging/src/fields/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/logging/fields.rs
  - tools/oracle/src/helpers/logging/fields/**
  - tools/oracle/helpers/logging_fields.py
  - tools/oracle/helpers/logging_fields/**
  - tools/oracle/cases/helpers/logging-fields/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L3570-L3615
  why: All standard payload fields.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L5640-L5705
  why: Time and message normalization.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L5863-L5921
  why: Usage projections.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L5961-L5979
  why: Final response.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L6347-L6447
  why: Status and response normalization.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::logging_fields_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'logging_fields' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/logging-fields/timestamps-decimal.yaml
- tools/oracle/cases/helpers/logging-fields/usage.yaml
- tools/oracle/cases/helpers/logging-fields/optional-fields.yaml
- tools/oracle/cases/helpers/logging-fields/failure-status.yaml
- tools/oracle/cases/helpers/logging-fields/response-hidden.yaml
- tools/oracle/cases/helpers/logging-fields/system-messages.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B190 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as logging_fields in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/fields.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/logging_fields.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
