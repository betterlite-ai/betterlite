id: B891
title: JWT database team fallback and membership validation
description: >-
  Resolve team context for JWT callers while preserving the three distinct failure policies. Admin
  attachment reads exactly x-litellm-team-id and runs only for a truthy header on B882 LLM routes;
  management routes ignore it. Pass the explicit team_id_upsert argument when nonnull, otherwise
  use the handler setting (default False). Any exception from team lookup warns and returns with
  admin access intact and no team attribution/limits. A successful call assigns the header id and
  returned team object, even if that object is None. Do not turn this warning fallback into denial.

  Single-team fallback requires user.teams length exactly one. Load with the supplied upsert value;
  HTTPException debug-logs and returns (None,None,None), and a None row also returns that tuple.
  Other team lookup errors escape. A falsey user_id returns id/row without membership; a truthy id
  calls B2318. Membership failures propagate rather than falling back without member limits.

  Database fallback reads teams in stored order and computes route permission once before the loop.
  Skip only HTTPException from B737 team loading. Mark any_team_resolved after a successful call,
  then, for a truthy requested_model, run B886.can_team_access_model with B871's team aliases and
  the injected production router. Only ProxyException skips that candidate. Check route permission
  after the model check; an excluded route still performs the model checks but no membership load.
  The first usable team debug-logs selection and loads membership only for a truthy user_id. No
  candidate plus enforce_team_based_model_access False returns the empty tuple. With enforcement
  True, requested_model plus any resolved candidate raises HTTP 403 saying no member team can
  access the requested model and referring to /models, even if the actual obstacle was route
  permission. Otherwise raise HTTP 403 saying the user is not a member of any team. Both pass to
  the caller as auth_error, string None param, code 403. Non-HTTP team failures, non-Proxy model
  failures and membership errors propagate; the auth outage projector may turn DB failures into 503.

  Route permission uppercases a string method, otherwise uses None. B883 auth-enforced passthrough
  short-circuits to allowed; all other routes call B742.allowed_routes_check as TEAM with B869's
  team_allowed_routes, whose default is openai_routes, info_routes, mcp_routes, /v1/messages and
  /v1/messages/count_tokens. This exemption does not bypass the caller's later team passthrough
  grant check. Header membership validation accepts only exact inclusion in the user's stored team
  ids. Otherwise B764's common 403 names the original header value, never the resolved alias id,
  with 'does not resolve to a team id or a unique team alias among your team memberships'.


  Build the production jwt_db_teams module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTAuthManager._attach_team_from_header_for_admin (L2133-L2175; 39 source lines), JWTAuthManager._resolve_single_team_fallback
  (L2178-L2233; 52 source lines), JWTAuthManager._resolve_db_team_fallback (L2236-L2335; 95 source lines),
  JWTAuthManager._is_team_route_allowed (L2338-L2355; 18 source lines), JWTAuthManager._validate_header_team_in_db_membership
  (L2374-L2388; 15 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.team_id_upsert=False;
  litellm_jwtauth.team_allowed_routes=['openai_routes','info_routes','mcp_routes','/v1/messages','/v1/messages/count_tokens'].
  fallback_to_db_teams=False and enforce_team_based_model_access=False are caller-owned B877/B869
  switches; this helper receives the selected fallback operation and enforcement boolean. It does
  not reread fallback_to_db_teams. Provisional-header upsert suppression is B877's call argument,
  not a universal ban on this task's upsert path.


  Add the jwt_db_teams operation under B856 Management::jwt. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-db-teams-*
  seed to B171 helper_case, which already owns this decoder.


  Test the real native JWT stage with B732 server state for admin warning continuation, membership
  denial and membership outage. These cases sit outside HTTP equality: MIT rejects enabled JWT
  at B875's license gate before these helpers run. Pure helper comparisons still invoke the actual
  MIT methods with injected repositories; do not call a FastAPI handler through the helper adapter.


  Database-team selection uses native JWT integration with B860's POSTGRES_TEST_URL/testcontainers
  fixture and deliberately ordered candidate rows. A forbidden first candidate must not hide a later
  permitted team; a non-HTTP failure must still terminate selection where the source does.


  Exercise the shared B869 schema through B002 in jwt_db_teams::tests::team_defaults,
  configured_upsert_and_routes_consumed and invalid_team_setting_shapes_fail. Invalid booleans or
  route-list shapes fail config loading rather than choosing defaults. Postgres fixtures use
  POSTGRES_TEST_URL and otherwise testcontainers; assert any upsert row survives later membership
  failure, because these helpers open no encompassing transaction.


  Sizing: 219 nonblank, noncomment lines before docstring exclusion; allow 220 production,
  300 behavior/Postgres tests, 65 helper adapters, 65 server wiring and 40 config lines,
  690 within a 750-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::jwt_db_teams::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
