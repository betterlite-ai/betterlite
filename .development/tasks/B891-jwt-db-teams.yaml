      admin_all_lookup_errors_warn_continue, admin_success_assigns_header,
      single_team_zero_one_many, single_team_http_debug_skip, single_team_none_row,
      single_team_other_error_propagates, falsey_user_skips_membership,
      membership_error_never_drops_limits, db_team_order_and_first_usable,
      db_http_skip_proxy_model_skip, db_other_errors_propagate, model_check_before_route_reject,
      db_no_candidates_optional_empty, db_enforced_no_membership_message,
      db_enforced_model_message_even_for_route_denial, passthrough_method_uppercase,
      team_route_group_defaults, header_alias_denial_uses_original_value and
      postgres_upsert_survives_late_failure cover the five helpers.'
    proof:
      - behavior-tests
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Native server cases native_admin_lookup_warning_continues,
      native_header_membership_denial and native_membership_outage_stops_downstream exercise
      the B875 enabled-JWT behavior outside the MIT equality corpus.
    proof: [stage-wiring-tests]
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_db_teams::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/jwt_db_teams.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/jwt-db-teams-*")"
        && grep -rlq "jwt_db_teams" tools/oracle/fuzz/corpus/helper_case/jwt-db-teams-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^jwt_db_teams::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/jwt-db-teams-*")"
        && grep -rlq "team_id_upsert" crates/betterlite-config/fuzz/corpus/config_yaml/jwt-db-teams-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::jwt_db_teams::tests::/)
        - test(/replays_the_/)'
