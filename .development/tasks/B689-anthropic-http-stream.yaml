id: B689
title: Anthropic streaming HTTP ownership
description: >-
  Port the HTTP stream opening helpers and acompletion_stream_function with B583 event decoding. Preserve status-before-first-event
  errors and body ownership; B584 selects this stream or buffered path.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  make_call L72-L129; make_sync_call L132-L197; AnthropicChatCompletion.acompletion_stream_function L204-L252.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Named case contracts: stream_post: Reuse supplied clients or injected module_level_aclient/module_level_client;
  POST supplied data/headers with stream=True and timeout. Build B583 iterator with sync_stream matching the call
  and json_mode unchanged. handshake_error: HTTPStatusError becomes AnthropicError with response status, read body
  and exception headers falling back to response.headers in both sync and async helpers. non_http_error_500: An
  unrecognized exception becomes AnthropicError 500 with its diagnostic; an existing LITELLM_EXCEPTION_TYPES exception
  is re-raised unchanged. sync_status_guard: Only make_sync_call checks a returned status != 200 after POST; a stubbed
  nonraising async client reaches iterator construction on that same returned status. stream_flag_and_context: acompletion_stream_function
  overwrites data.stream with true before json.dumps, forwards optional_params.speed and the B573 tool-name reverse
  map to B583, and wraps with custom_llm_provider anthropic. response_headers: Pass returned response headers through
  B570 process_anthropic_headers before constructing CustomStreamWrapper, including prefixed originals and rate-limit
  aliases.


  B583 owns cancellation and partial-body decoding oracle behavior. Add standalone Rust tests anthropic_http_stream_partial_body_close
  and anthropic_http_stream_cancel_upstream for resource ownership, without inventing Python oracle outcomes in
  this slice.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B581, B567. Reuse the named implementations; do not
  copy them at this call boundary.


  Implement crates/betterlite-anthropic/src/anthropic_http_stream.rs with adjacent tests under anthropic_http_stream/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_http_stream_cases in betterlite-anthropic with these exact named cases (one per
  oracle file): stream_post, handshake_error, non_http_error_500, sync_status_guard, stream_flag_and_context, response_headers.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_http_stream* using HelperCase: kind:
  helper and the externally tagged anthropic_http_stream variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_http_stream that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 160 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 185 production lines, 150 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 455 planned, 475 maximum changed lines.
