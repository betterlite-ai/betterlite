pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_http_stream in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/http_stream.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_http_stream.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The synchronous helper rejects a non-200 returned response even when the HTTP client did not raise; adding that
  check to the asynchronous helper changes the tested seam.
- The stream-opening logger uses api_key="" and does not receive the upstream authorization value.
