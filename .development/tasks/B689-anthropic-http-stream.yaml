id: B689
title: Anthropic streaming HTTP ownership
description: >-
  Port the HTTP stream opening helpers and acompletion_stream_function with B583 event decoding. Preserve status-before-first-event
  errors, cancellation and body ownership; B584 selects this stream or buffered path.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  make_call L72-L129; make_sync_call L132-L197; AnthropicChatCompletion.acompletion_stream_function L204-L252.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Implement crates/betterlite-anthropic/src/anthropic_http_stream.rs with adjacent tests under anthropic_http_stream/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation anthropic_http_stream in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_http_stream_cases in betterlite-anthropic with these exact named cases (one per
  oracle file): stream_post, handshake_error, partial_body_close, cancel_upstream. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy
  and assert both client response and captured upstream request. Existing API tasks retain route registration; this
  task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_http_stream* using HelperCase: kind:
  helper and the externally tagged anthropic_http_stream variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_http_stream that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 160 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 81 behavior/config-test lines,
  71 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 382 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-anthropic/Cargo.toml
  - crates/betterlite-anthropic/src/lib.rs
  - crates/betterlite-anthropic/src/error.rs
  - crates/betterlite-anthropic/src/anthropic_http_stream.rs
  - crates/betterlite-anthropic/src/anthropic_http_stream/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/anthropic_http_stream.rs
  - tools/oracle/src/helpers/anthropic_http_stream/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/anthropic_http_stream.py
  - tools/oracle/cases/helpers/providers/anthropic-http-stream/**
  - tools/oracle/fuzz/corpus/helper_case/anthropic_http_stream*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L72-L252
  why: Own make_call, make_sync_call, AnthropicChatCompletion.acompletion_stream_function. Other functions in this
    file remain with the owners listed below.
dod:
- text: 'stream post: the production result, omission or failure matches tools/oracle/cases/helpers/providers/anthropic-http-stream/stream-post.yaml.'
  proof:
  - case-stream-post
  - oracle
  - helper-python
- text: 'handshake error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/anthropic-http-stream/handshake-error.yaml.'
  proof:
  - case-handshake-error
  - oracle
  - helper-python
- text: 'partial body close: the production result, omission or failure matches tools/oracle/cases/helpers/providers/anthropic-http-stream/partial-body-close.yaml.'
  proof:
  - case-partial-body-close
  - oracle
  - helper-python
- text: 'cancel upstream: the production result, omission or failure matches tools/oracle/cases/helpers/providers/anthropic-http-stream/cancel-upstream.yaml.'
  proof:
  - case-cancel-upstream
  - oracle
  - helper-python
- text: New anthropic_http_stream seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-stream-post
    why: The stream-post behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_stream_post$/)'
  - id: case-handshake-error
    why: The handshake-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_handshake_error$/)'
  - id: case-partial-body-close
    why: The partial-body-close behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_partial_body_close$/)'
  - id: case-cancel-upstream
    why: The cancel-upstream behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_cancel_upstream$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_http_stream.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_http_stream*")"
      && grep -lq 'anthropic_http_stream' tools/oracle/fuzz/corpus/helper_case/anthropic_http_stream* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_http_stream$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/anthropic-http-stream/stream-post.yaml
