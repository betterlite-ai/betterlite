checks:
  optional:
  - mutants
  commands:
  - id: case-stream-post
    why: Reuse supplied clients or injected module_level_aclient/module_level_client; POST supplied data/headers
      with stream=True and timeout. Build B583 iterator with sync_stream matching the call and json_mode unchanged.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_stream_post$/)'
  - id: case-handshake-error
    why: HTTPStatusError becomes AnthropicError with response status, read body and exception headers falling back
      to response.headers in both sync and async helpers.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_handshake_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_http_stream.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_http_stream*")"
      && grep -lq 'anthropic_http_stream' tools/oracle/fuzz/corpus/helper_case/anthropic_http_stream* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_http_stream$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-non-http-error-500
    why: An unrecognized exception becomes AnthropicError 500 with its diagnostic; an existing LITELLM_EXCEPTION_TYPES
      exception is re-raised unchanged.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_non_http_error_500$/)'
  - id: case-sync-status-guard
    why: Only make_sync_call checks a returned status != 200 after POST; a stubbed nonraising async client reaches
      iterator construction on that same returned status.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_sync_status_guard$/)'
  - id: case-stream-flag-and-context
    why: acompletion_stream_function overwrites data.stream with true before json.dumps, forwards optional_params.speed
      and the B573 tool-name reverse map to B583, and wraps with custom_llm_provider anthropic.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_stream_flag_and_context$/)'
  - id: case-response-headers
    why: Pass returned response headers through B570 process_anthropic_headers before constructing CustomStreamWrapper,
      including prefixed originals and rate-limit aliases.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cases::case_[0-9]+_response_headers$/)'
  - id: partial-body-close
    why: Stream resources survive partial_body_close.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_partial_body_close$/)'
  - id: cancel-upstream
    why: Stream resources survive cancel_upstream.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::anthropic_http_stream_cancel_upstream$/)'
