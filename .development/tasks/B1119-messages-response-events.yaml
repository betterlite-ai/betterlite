id: B1119
title: Responses to Messages event transitions
description: >-
  Convert one parsed Responses event into Anthropic block/usage transitions, preserving stable block indexes and
  reasoning closure. Stream lifetime/error handling stays with B986.


  Implement crates/betterlite-core/src/api/messages_response_events.rs. Use MessagesResponseEventsInput and MessagesResponseEventsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions responses_text_to_message, reasoning_block_close, tool_arguments_input_json
  under api::messages_response_events::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesResponseEvents in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_response_events: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: _UpstreamFailure.http_error_status_or_none
  (L43-L51); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: _UpstreamFailure.str_or_none
  (L55-L56); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: _original_failure (L71-L75);
  litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: _failure_status_and_message (L78-L85);
  litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: _anthropic_error_chunk (L88-L98);
  litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper._make_message_start
  (L140-L158); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper._next_block_index
  (L160-L162); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper._open_block
  (L164-L175); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper._field
  (L178-L179); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper._close_reasoning_item
  (L181-L207); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper._process_event
  (L209-L431); litellm/llms/anthropic/pass_through/responses_adapters/streaming_iterator.py: AnthropicResponsesStreamWrapper._fail_stream
  (L433-L435). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 339 owned nonblank/non-comment/non-docstring Python lines (340 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 359 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 573 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B902 (Responses shapes), B983 (Messages responses input), B1113 (Responses streaming event
  records), B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B925 (Responses stream events),
  B963 (Messages options), B958 (Messages errors). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
