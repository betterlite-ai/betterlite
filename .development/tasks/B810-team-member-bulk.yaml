id: B810
title: Bulk team member additions and permissions
description: >-
  Implement the four team_member_bulk routes with B1231 request/response types. Bulk add is a single
  B808 team_member_add call, not a loop of independently successful additions. Check the database first
  (500 db_not_connected); all_users defaults false and requires proxy_admin (403), then replaces supplied
  members with every user ordered created_at descending, role user and their ID/email. Reject an empty
  result with 400 and more than 500 members with 400 before entering the try block. Pass only team_id,
  members and max_budget_in_team (default null) to B808. Match each result in input order to the first
  updated user by truthy ID OR truthy email, and to membership by truthy ID only. A missing match still
  has success=true and null expanded rows. Return the entire delegated model_dump as updated_team.
  Any exception inside this try, including result construction, is logged and becomes HTTP 200 with
  every input marked failed, error=str(exception), zero successes and updated_team=null. Earlier writes
  are not undone. Cases bulk_all_users_replaces_input, bulk_empty_and_501, bulk_first_match_and_null_rows,
  bulk_delegate_failure_is_200 and bulk_failure_preserves_writes cover these distinct paths.

  Permissions reads use B737 database-only team lookup and B801 accessors. Allow B2314 admin-view,
  B800 proxy/team/org administrators, or an available team under B803; otherwise 403 retains the source
  /team/member_add diagnostic. Missing database is 500 with detail.error="No db connected". Only null
  stored permissions expand to B800 defaults; an explicit empty list remains empty. Return all available
  permissions in B800 group order. Updating requires B800 administrative scope even for available teams,
  stores the supplied list unchanged, returns the updated team, and returns 404 if update returns no row.
  This update handler has neither management_endpoint_wrapper nor explicit cache eviction/audit; do not
  add them. Cases read_scope_matrix, null_vs_empty_permissions, write_scope_and_exact_list and
  vanished_update_row cover the asymmetric contracts.

  Bulk permission update checks database then proxy_admin (403 "Only proxy admins can bulk-update team
  permissions"). Empty permissions return "No permissions provided", teams_updated=0 and the response
  model's permissions_appended=null before validating targets. Defaults are team_ids=null and
  apply_to_all_teams=false. Neither target mode produces 400 "Must provide team_ids or set
  apply_to_all_teams=true"; both produce 400 "Cannot set both apply_to_all_teams=true and team_ids".
  Specific IDs are fetched once; any missing IDs produce 404 "Team(s) not found: [...]" with sorted IDs
  before any update. Merge sets, skip teams already containing every permission, sort changed lists
  alphabetically and commit one B724 batch. All-team mode reads 500 rows ordered team_id ascending,
  advances by last ID with skip=1, and commits each page separately; a later failure preserves earlier
  batches. Return "Team permissions updated successfully", the number changed (not scanned), and the
  original permission list including duplicates/order. Cases empty_permissions_precedes_target_check,
  exclusive_target_modes, missing_ids_before_write, merge_sorted_changed_only, original_append_echo,
  all_team_cursor_500 and later_page_failure_preserves_batch prove these rules. Unknown permission enums
  fail B1231 decoding with 422 before the handler.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  _create_results_from_response (L4126-L4162; 31 source lines), bulk_team_member_add (L4172-L4308; 115
  source lines), team_member_permissions (L6256-L6313; 49 source lines), update_team_member_permissions
  (L6321-L6374; 45 source lines), bulk_update_team_member_permissions (L6384-L6436; 44 source lines),
  _compute_and_batch_updates (L6439-L6460; 20 source lines), _append_permissions_to_specific_teams (L6463-L6479;
  15 source lines), _append_permissions_to_all_teams (L6482-L6509; 21 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/bulk_member_add -> bulk_team_member_add;
  GET /team/permissions_list -> team_member_permissions; POST /team/permissions_update -> update_team_member_permissions;
  POST /team/permissions_bulk_update -> bulk_update_team_member_permissions. B001 HTTP cases exercise
  these handlers with B052 authentication; compare null fields, content-type and B003 error envelopes
  including type/param/code. Only bulk addition catches exceptions locally; none of these handlers calls
  handle_exception_on_proxy. Use B865 effects for the other three source-decorated routes, excluding
  permissions_update. Missing bearer is middleware behavior, not a fabricated handler branch.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary,
  using POSTGRES_TEST_URL when set and testcontainers otherwise; an unusable configured URL fails.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Sizing: 340 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  300 production, 400 behavior/Postgres tests, 0 helper adapters, 80 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 780 changed lines estimated within an 800-line gate.


  No environment variable or config key is read in these owned ranges. Native tests exercise matching,
  pagination, exception timing and Postgres effects without a helper adapter that invokes handlers.
