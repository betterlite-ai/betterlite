dod:
  - text: Each provider's supported params, map_openai_params and provider info (api base, api key, defaults) match LiteLLM.
    proof: [local-server-configs-tests, local-server-configs-cases]
  - text: Docker Model Runner builds the same URL and messages.
    proof: [local-server-configs-tests, local-server-configs-cases]
  - text: Oobabooga requests and replies, and its error class, match.
    proof: [local-server-configs-tests, local-server-configs-cases]
  - text: Xinference image params and the lemonade cost pair match.
    proof: [local-server-configs-tests, local-server-configs-cases]
  - text: New helper cases for these functions exist.
    proof: [local-server-configs-cases]
checks:
  optional: [mutants]
  commands:
    - id: local-server-configs-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^local_servers::/)'
      why: Without this provider code there are no such tests, so the check fails on the base branch.
    - id: local-server-configs-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/local-server-configs)"
      why: Without new case files the oracle proof passes with nothing compared.
