id: B8152
title: docker_model_runner, llamafile, lm_studio, oobabooga, xinference and lemonade cost
description: >-
  Build the small self-hosted provider configs in betterlite-openai as crates/betterlite-openai/src/local_servers.rs and its folder, one file per provider. All are pure transforms; the HTTP calls and the main.py dispatch stay with B8157.

  docker_model_runner: DockerModelRunnerChatConfig with the _transform_messages overloads, _get_openai_compatible_provider_info, get_complete_url, get_supported_openai_params and map_openai_params.

  llamafile: LlamafileChatConfig with _resolve_api_key, _resolve_api_base and _get_openai_compatible_provider_info.

  lm_studio: LMStudioChatConfig (_get_openai_compatible_provider_info, map_openai_params) and LmStudioEmbeddingConfig (get_config, get_supported_openai_params, map_openai_params). B1440 supplies the lm_studio and llamafile branch of the shared embedding dispatch and calls these.

  oobabooga: OobaboogaError, OobaboogaConfig (get_error_class, transform_response, validate_environment) and the request and reply parts of oobabooga.py completion and embedding. The reply is decoded with a typed struct.

  xinference: XInferenceImageGenerationConfig with get_supported_openai_params and map_openai_params, over the image contracts of B997.

  lemonade: cost_per_token from cost_calculator.py, returning LiteLLM's prompt and completion cost pair for a lemonade model. B1686 owns the cost dispatch that calls it; this task builds the function only.

  Where the source and this text differ, the source at the pinned commit wins.
