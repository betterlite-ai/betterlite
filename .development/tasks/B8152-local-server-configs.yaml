out_of_scope:
  - "B8157 owns the main.py _complete_* dispatch functions."
  - "B1440 owns the shared openai_like embedding dispatch. B2224 owns lemonade get_model_info; B1686 owns the cost dispatch that must call lemonade cost_per_token, which it does not mention yet."
  - "B2230 selects the chat configs for these providers."
pitfalls:
  - "The oracle helper for this task is pre-registered as b8152 by the skeleton. Write its Rust and Python files as the skeleton leaves them; the registry files are not this task's to edit."
  - "Several providers share the OpenAI base chat config of B668; override only what the source overrides."
  - "The oobabooga reply shape is not OpenAI-shaped; copy transform_response step by step, including its error texts."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
