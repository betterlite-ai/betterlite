oracle_cases: []

deviations:
  - what: Conditional category matches with MASK action log a warning but do not redact text. The source explicitly handles conditional MASK separately from other MASK actions.
    why: LiteLLM preserves this behavior; conditional matches are phrase patterns detected by B3694 that cannot be redacted with simple span-based masking since their structure differs from regex patterns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1242-L1247

out_of_scope:
  - B3690 defines detection records and action enum variants.
  - B3693 owns _find_pattern_spans, _mask_spans, _keyword_to_regex_pattern; this task calls them.
  - B3694 owns _check_conditional_categories, _check_phrase_patterns, _check_category_keywords; this task calls them.
  - B3692 owns category loading and _load_categories; this task only reads loaded_categories.
  - B3698 handles detection logging and risk calculation; this task only appends to detections list.
  - Final guardrail constructor and initialization (B105).

pitfalls:
  - Conditional matches and phrase patterns both call handle_conditional_match with identical error detail structure (error, category, matched_phrase, severity), making the two call sites indistinguishable at the handler level. Do not implement a field-name branch between the two.
  - MASK action for conditional categories logs a warning but does not redact; other MASK actions apply redaction tags to text. Do not accidentally apply redaction to conditional matches.
  - Pattern redaction format uses pattern_name.to_uppercase() before substituting into the format string; if the format contains {pattern_name}, ensure case conversion matches.
  - Blocked word matching updates text_lower after each masked match; skipping this causes subsequent searches to run against stale text or unmasked state.
  - Keyword-to-regex-pattern conversion is called from within action handlers, not once per keyword; do not cache regex results across different keywords.
  - The exceptions list must be collected from all loaded categories before any check runs; passing wrong exceptions to a check function silently accepts text that should be skipped.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
