id: B3695
title: Content filtering actions and ordered text evaluation
description: >-
  Build the action handlers for content filter detection and the single-text evaluator
  that applies all content filtering checks in sequence: conditional categories, phrase
  patterns, category keywords, regex patterns and blocked words. Each handler appends
  a detection record to the detections list (or does nothing if detections is None) and
  then executes the configured BLOCK or MASK action. BLOCK raises HTTP 400 with error detail.
  MASK applies redaction tags to matched text except for conditional matches, where MASK logs a warning
  instead (no redaction for conditional categories). The single-text evaluator orchestrates
  the checks in order, collecting exceptions from loaded categories, and returns filtered
  text with all matched text redacted where applicable.

  Build Rust functions that preserve LiteLLM behavior:
  - handle_conditional_match: appends CategoryKeywordDetection (type, category, keyword, severity, action) before action check; BLOCK raises HTTP 400; MASK logs warning without redacting
  - handle_category_keyword_match: appends CategoryKeywordDetection (type, category, keyword, severity, action) before action check; BLOCK raises HTTP 400; MASK applies keyword_redaction_tag
    via regex pattern matching (case-insensitive)
  - handle_pattern_match: appends PatternDetection (type, pattern_name, action) before action check; BLOCK raises HTTP 400; MASK applies pattern_redaction_format tag
    via span redaction
  - handle_blocked_word_match: appends BlockedWordDetection (type, keyword, action, description) before action check; BLOCK raises HTTP 400; MASK applies keyword_redaction_tag
  - filter_single_text: orchestrates all checks (conditional, phrase, category keyword,
    pattern, blocked word) in order; collects exceptions from loaded categories and passes
    them to check functions; returns filtered text

scope:
