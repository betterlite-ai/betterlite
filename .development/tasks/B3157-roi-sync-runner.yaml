    - id: cancel-lifecycle
      why: cancel method does not stop task or update status correctly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_sync::.*cancel/)'
    - id: heartbeat-lifecycle
      why: heartbeat task does not renew lease or detect loss
