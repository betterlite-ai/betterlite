id: B3157
title: Run and cancel coordinated ROI analyses
description: >-
  Build SyncManager and its coordinated ROI analysis runner in `betterlite-server::roi_sync`.
  This module orchestrates the entire sync workflow: initializing state with a GitHub factory
  and clock provider, acquiring distributed leases, processing pull requests with three workers
  (PR_CONCURRENCY=3) in parallel, maintaining a one-second heartbeat to renew the lease,
  and publishing the final report once all estimates complete.
  The runner accepts injected dependencies (GitHub transport, estimator models, spend reader,
  completion callback) and preserves LiteLLM's behavior: cached pull reuse, ordered result
  publication, lease-loss cancellation, source-error fallthrough to warnings, partial-repository
  handling, and publication guarding when the coordinator replaces the run.
  Async workers process indexed pulls by stride across the queue, refreshing cached identities
  and capturing status updates (done, estimated, reused, needs_attention) at every estimate.
  Heartbeat monitors watch for lease loss and coordinate publication directly; cancellation
  stops workers cleanly and updates phase/stage without writing partial results.
  The three worker tasks run independently inside _run's nested scope; neither `process` nor
  `worker` is split to an upper task.
