oracle_cases: []
deviations:
  - what: "Async workers use asyncio.gather with return_exceptions=True to collect results even when one task fails; failures are propagated only after all workers complete."
    why: "This preserves LiteLLM's behavior of graceful task cleanup and ensures that a single-worker failure does not orphan other workers. A task cancellation via lease loss will interrupt all workers at once."
  - what: "Lease loss during _run cancels the current task but does not prevent the heartbeat monitor from notifying the coordinator of cancellation in the finally block."
    why: "The coordinator must be notified of every state change so it can release the lease for other runners. A lease loss already means this runner's ownership is lost; the final notification is informational."
  - what: "When the coordinator.finish call returns false (the run was replaced), a SourceError is raised to prevent the local repository store and update the status.error before cleanup."
    why: "This matches LiteLLM's design: a replaced run means another runner has taken over, and this runner must not overwrite that runner's report."
out_of_scope:
  - "B3156 owns _read_repositories, _previous_report, cache_key, _cached_record, _cache_estimated_pull, _unavailable_record, _estimate_with_fallback, _report_record, _processed_records and settings_fingerprint."
  - "B3154 owns Estimator and EstimatorModel contracts."
  - "B3153 owns GitHub.evidence and pull query methods."
  - "B3152 owns GitHub.__init__, .profile_email, .close and retry policy."
  - "B3155 owns SyncStore lease operations and the SpendReader contract implementation."
  - "B3150 owns ROISyncStatus and ROIReport type definitions and validators."
  - "B725 owns ConfigRepository.get_param and .set_param contracts."
  - "The demo report generation and scheduled sync routes (B076) are not part of this task."
pitfalls:
  - "PR_CONCURRENCY must be 3; workers start at offsets 0, 1, 2 and process every third pull. Stride iteration is off-by-one when range(offset, len, PR_CONCURRENCY) is not used."
  - "The monitor task must be created before _run starts so it outlives all workers. Cancelling the monitor in finally will cause it to exit before the coordinator.finish call if the timing is tight."
  - "Cached pull identity refresh must call github.profile_email with the fallback parameter to use the previous profile email if the new lookup fails."
  - "The cache key is None for pulls fetched from GitHub evidence, not for cached pulls; cached pulls retain their original key from the index."
  - "Cached record conversion to typed ROIPullRecord must use TypeAdapter.validate_python on the MappingProxyType to ensure correct model construction."
  - "Results must be indexed by position (the original queue index) before building the final report, not by pull number or URL."
  - "The heartbeat loop has a bare `except Exception` to catch coordination failures; this is intentional and must not be narrowed to specific exception types."
  - "A CancelledError in the heartbeat loop must be suppressed with contextlib.suppress; awaiting a cancelled task raises CancelledError again."
  - "Status updates use MappingProxyType to preserve immutability; the internal _status dict must be replaced, not mutated in place."
  - "Estimated status counter counts only pulls with estimate['status'] == 'estimated', not pulls with cached=True or other estimate statuses."
  - "The needs_attention counter is the count of pulls where estimated is False; when every estimate is 'error', needs_attention equals done."
  - "Reused counter counts only pulls with cached=True in the estimate dict, not pulls that were served from the previous_report map."
