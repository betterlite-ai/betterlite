dod:
  - text: "SyncManager.__init__ stores a GitHub factory, a clock, initial idle status, and an asyncio lock for start serialization."
    proof: [sync-init]
  - text: "SyncManager.status computes elapsed seconds from started_at to finished_at (or now), and remaining seconds when running and at least PR_CONCURRENCY pulls have been processed."
    proof: [status-compute]
  - text: "SyncManager.start acquires the lock, validates settings.repos and estimator_model, cancels any running task, acquires a coordinator lease with initial status, creates a UUID owner, spawns the async _run task and returns true only if acquired."
    proof: [start-lifecycle]
  - text: "SyncManager.cancel stops the task with asyncio.cancel, waits for it, updates phase to cancelled, notifies the coordinator of completion, and returns true only if there was a task to cancel."
    proof: [cancel-lifecycle]
  - text: "SyncManager._heartbeat runs a one-second sleep loop, calls coordinator.heartbeat at every iteration, cancels the monitored task on heartbeat failure, and exits cleanly on any exception."
    proof: [heartbeat-lifecycle]
  - text: "SyncManager._run coordinates the entire analysis: read spend, fetch repositories, create indexed pull queue, initialize estimator, run three parallel workers across indexed pulls by stride, publish ordered results, finalize report."
    proof: [run-phases]
  - text: "The three worker tasks process indexed pulls with stride PR_CONCURRENCY starting from their offset (0, 1, 2), each calling the nested process function on assigned indices."
    proof: [worker-concurrency]
  - text: "The process callback checks local and repository cache for each pull, reuses cached records with refreshed profile email, falls back to GitHub evidence and estimation on cache miss, and marks metadata-unavailable on SourceError."
    proof: [process-cache]
  - text: "Cached record refresh reads profile_email from GitHub and merges it with commit_emails without re-estimating."
    proof: [cache-identity-refresh]
  - text: "Results are collected by index and ordered into the final report tuple without loss."
    proof: [ordered-results]
  - text: "Coordinator.finish is called with the completed status and serialized report; if it returns false, SourceError prevents publication."
    proof: [coordinator-final]
  - text: "When no coordinator is present, the report is stored directly in the repository config."
    proof: [local-report]
  - text: "A lease loss (heartbeat returns false) cancels the task; a source error updates status.phase to error; an unexpected exception updates status with a generic error message."
    proof: [error-handling]
  - text: "The finally block closes the GitHub client only when status.phase != 'complete', separately from the task.done() check cancel() uses to short-circuit when there is no running task."
    proof: [cancellation-cleanup]
  - text: "_update_status mutates the internal status using typed keyword arguments that match ROISyncStatus fields."
    proof: [status-update]
  - text: "_update_estimate_progress increments done, estimated, reused, and needs_attention counters based on estimate status and cached flag."
    proof: [progress-update]
  - text: "Every mutant in status computation, worker concurrency, caching logic and error handling is caught by a test."
    proof: [mutants]
