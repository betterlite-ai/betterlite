dod:
  - text: Both estimate_request_max_cost and estimate_request_input_cost count each candidate model exactly once and return the maximum cost across all cost-info shapes.
    proof: [reservation-cost-behaviors, reservation-cost-boundaries]
  - text: Input cost returns the floor cost when any model-specific pricing is found; output estimate returns 16384 fallback or model ceiling when requested value is absent.
    proof: [reservation-cost-behaviors]
  - text: Image-generation cost applies only to image_generation/image_edit modes and sums both input_ and output_cost_per_image fields.
    proof: [reservation-cost-behaviors]
  - text: Output tokens account for n and best_of multipliers, reasoning rates use max(standard, reasoning), and tiered selection uses B1666's tier_rate.
    proof: [reservation-cost-behaviors]
  - text: count_request_input_tokens returns a map keyed by model name; both estimates reuse its result when provided.
    proof: [reservation-cost-behaviors]
  - text: Embeddings, rerank and moderation routes return 0 output tokens and skip output cost.
    proof: [reservation-cost-behaviors]
  - text: Every oracle case exercises the full request-to-cost chain and asserts exact cost value, None return, and model-lookup source for cached vs fallback paths.
    proof: [cost-oracle]
  - text: All metadata-lookup exceptions log and return empty estimates rather than failing admission.
    proof: [reservation-cost-boundaries]
  - text: The task adapter and probe operations use the production estimation functions and pass strict linting.
    proof: [probe-python, cost-oracle]
