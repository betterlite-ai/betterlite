out_of_scope:
  - B3000 owns _to_float, _to_int and _get_value; this task calls betterlite-auth::budget_values's versions directly.
  - B746 owns get_model_from_request and route parsing.
  - B844/B845/B846 own Router.get_model_list, cached_deployment_model_info and cached_model_group_info
    method implementations; this task calls those services as-is.
  - B1666 owns select_tier_for_input, tier_rate and tiered-pricing table structure.
  - B1695 owns count_input_tokens and count_input_tokens_for_model implementations and tokenizer dispatch.
  - B2225 owns litellm.get_model_info implementation and the public model catalog.
pitfalls:
  - 'estimate_request_max_cost filters out None values before taking max(); one unknown-cost model kills
    the whole estimate if it is the only candidate.'
  - 'Image-generation cost is None when cost_per_image <= 0, so zero-cost image models return None and bypass
    image-generation path entirely.'
  - 'Tiered pricing requires isinstance(tiered_pricing, list) and tiered_pricing to be truthy; a model
    with an empty tiered_pricing list falls through to flat-pricing path.'
  - 'Reasoning rate uses max(output_cost_per_token, output_cost_per_reasoning_token), so either being None
    must be handled correctly; both None causes output_rate to be 0.0 and later None returns.'
  - 'Output token ceiling is min(requested or default, model_max or default), not just model_max, so requesting
    max_tokens=999999999 is clamped to 16384 and then to model ceiling.'
  - 'The mode gate for image generation is strict: mode must be "image_generation" or "image_edit", not substring-matched.'
  - 'Multiple candidate models in an estimate use max() across costs, but None values are filtered first; this means
    a second model with unknown pricing does not override a first model''s known cost.'
  - 'Inference config is checked with isinstance(inference_config, Mapping) before dict access, so non-dict inferenceConfig values are silently skipped.'
  - 'The tiered_pricing list can come from either the group cost info or a per-deployment override; both are
    collected and cost-estimated together, so a deployment-specific tier overrides group pricing for that shape only.'
  - 'Exception handling during metadata lookup is silently caught and logged; admission proceeds with an empty
    estimate (None return), not an error.'
budget:
