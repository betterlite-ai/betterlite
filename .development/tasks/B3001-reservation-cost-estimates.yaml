      why: task-specific behavior tests for cost estimation are missing, skipped or fail
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/::reservation_cost_behaviors(::|$)/)
        - test(/replays_the_.*_corpus/)'
    - id: reservation-cost-boundaries
      why: task-specific boundary/error tests for cost estimation are missing or fail
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/::reservation_cost_boundaries(::|$)/)
        - test(/replays_the_.*_corpus/)'
    - id: probe-python
      why: the new adapter is missing, unchanged, untyped or fails lint
      run: test -f tools/oracle/litellm/probes/reservation_cost.py && test -n "$(git diff --name-only "$GATE_BASE"
        -- tools/oracle/litellm/probes/reservation_cost.py)" && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
        tools/oracle/litellm/probes
    - id: cost-oracle
      why: oracle cases or the full request-cost chain are missing or fail
      run: test -d tools/oracle/cases/auth/reservation-cost && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
