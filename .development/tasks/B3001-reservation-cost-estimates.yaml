id: B3001
title: Estimate reservation input and maximum request cost
description: >-
  Implement betterlite-auth::reservation_cost as standalone estimation functions
  to count each candidate model once and reserve the maximum supported pricing shape,
  with separate accounting for input-only cancellation floors. Preserve the 16384
  output fallback for open-ended requests, model-specific ceilings, field precedence
  (max_completion_tokens > max_tokens > max_output_tokens > default), image-mode gating,
  and reasoning-rate maximization where both standard and reasoning costs exist. Return
  None (skip reservation) when no pricing is known. Preserve unknown-price no-reservation
  semantics: a model with zero known costs in every candidate shape returns None, not
  zero. Multiple models in a request reserve once at the maximum cost across all
  candidates. The estimate is performed before routing, so deployment-specific tiered
  pricing tables must be pulled and cost against the group-flat rates to ensure any
  eligible deployment can be served without under-reservation. Load model info from the
  router's cached metadata services (cached_deployment_model_info, cached_model_group_info)
  when available, falling back to litellm.get_model_info, and retain the cache-generation
  order and error behavior. Input-cost estimates floor cancellations; output estimates
  account for concurrent reservations. Estimate image-generation cost only when mode is
  image_generation or image_edit, and sum both output_ and input_cost_per_image fields
  when present, since naming is inconsistent across provider catalogs. Guard against
  multimodal vision-input cost fields (mode not set, image-cost fields present) so
  vision-priced models fall through to token-based reservation. Expose standalone
  `estimate_request_max_cost`, `estimate_request_input_cost`, and owned `count_request_input_tokens`
  in betterlite-auth; other helpers remain private. The request_body and route allow
  these estimates to dispatch without a live deployment, but llm_router may be None.
  On any exception loading metadata, log and return empty estimates rather than failing
  the admission gate. Tiered-pricing selection uses B1666's select_tier_for_input and
  tier_rate helpers; preserve their semantics and error handling. The max_tokens /
  max_output_tokens field fallback for missing max_completion_tokens is explicit in the
  source rather than a platform default. Testing must cover call chains through all three
  router methods plus litellm.get_model_info fallback, models with tiered and flat
  pricing separately, image generation and chat/embedding/rerank routes, reasoning models,
  and cancellation-window behavior.
