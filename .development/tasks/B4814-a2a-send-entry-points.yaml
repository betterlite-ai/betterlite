oracle_cases: []

deviations:
  - what: asend_message is decorated with @client for LiteLLM logging and tracking; asend_message_streaming is undecorated and builds its own Logging object manually via _build_streaming_logging_obj.
    why: Only asend_message uses the @client decorator; asend_message_streaming handles logging object construction directly without a decorator wrapper.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/main.py#L403
  - what: asend_message and asend_message_streaming call LiteLLMSendMessageResponse.from_a2a_response and from_dict; these response wrapper methods are supplied by B4771 as part of the native agent provider contracts.
    why: B4771 owns LiteLLMSendMessageResponse which wraps A2A SDK responses with betterlite's _hidden_params for cost tracking and logging.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L468-505
  - what: A2A trace and agent header generation uses UUID4 generation and datetime.now() replaced with injected execution/ID facilities from B198.
    why: asend_message generates trace IDs from logging object or uuid; this UUID source belongs to B198's injected boundary (replacing uuid.uuid4).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/main.py#L490

out_of_scope:
  - Native A2A client creation and send/stream retry loops; owned by B4801.
  - Completion bridge handler implementation; owned by B4809.
  - Streaming iterator and terminal logging dispatch; owned by B4810.
  - Card resolution and URL retrieval; owned by B4800.
  - Usage calculation from request/response; owned by B4802.
  - Logging object construction and field setters; owned by B247/B4810.
  - Unused A2AClient class and excluded send_message/aget_agent_card wrappers; not rebuilt.

pitfalls:
  - Agent headers must be merged into trace/agent headers AFTER setting X-LiteLLM-Trace-Id/X-LiteLLM-Agent-Id so agent headers take precedence.
  - "custom_llm_provider must be explicitly checked and truthy; a missing key or None value falls through to native A2A flow."
  - "Usage calculation uses asyncify wrapper on the synchronous A2ARequestUtils.calculate_usage_from_request_response; the function returns a tuple (prompt, completion, total)."
  - "litellm_params merging into logging uses only _a2a_cost_params keys (explicit pricing keys, not all of litellm_params)."
  - "For streaming, logging_obj may already exist in kwargs (as litellm_logging_obj); check isinstance(..., Logging) to reuse or build a new one."
  - "Trace ID from logging object takes precedence over other sources; check logging_obj.litellm_trace_id when logging_obj exists."
  - "asend_message_streaming has a three-tier trace ID fallback: logging_obj.litellm_trace_id, then str(request.id) if request.id is set, then generated uuid4. This differs from asend_message's two-tier fallback (logging_obj.litellm_trace_id or uuid4) which never consults request.id."
  - Agent headers overlay (update) trace/agent headers; do not replace them.
  - "For streaming with completion bridge, api_base is optional (some providers derive endpoint from model)."
  - "Request params must be extracted via model_dump(mode=\"json\") for Pydantic models or dict() fallback before passing to bridge handler."
  - "Response wrapping uses from_dict for bridge responses and from_a2a_response for native responses; both methods are supplied by B4771."

review_level: standard

