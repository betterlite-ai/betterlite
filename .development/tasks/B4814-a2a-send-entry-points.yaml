id: B4814
title: A2A send entry points and provider bridge selection
description: >-
  Build the public async send entry points that choose native A2A or the completion bridge and attach accounting context. Preserve trace/agent header precedence, response-ID wrapping and distinct streaming/non-streaming logging paths.

  asend_message is decorated with @client for LiteLLM logging and tracking. asend_message_streaming is undecorated and builds its own Logging object manually. Detect custom_llm_provider in litellm_params to route through completion bridge; otherwise use native A2A client. If a2a_client is not provided but api_base exists, create one with X-LiteLLM-Trace-Id header (from logging_obj.litellm_trace_id or generated uuid for asend_message; from logging_obj.litellm_trace_id, str(request.id) if set, or generated uuid for asend_message_streaming), X-LiteLLM-Agent-Id when agent_id provided, then merge in agent_extra_headers (agent headers take precedence). Call _execute_a2a_send_with_retry for non-streaming and _execute_a2a_stream_with_retry for streaming. Calculate usage from request/response and set on logging object via _set_usage_on_logging_obj. Set litellm params on logging object via _set_litellm_params_on_logging_obj (only pricing keys). Set agent_id on logging object via _set_agent_id_on_logging_obj. For streaming, reuse or build logging object through _build_streaming_logging_obj, then wrap in A2AStreamingIterator.

  _send_message_via_completion_bridge is called by both entry points when custom_llm_provider is truthy. Extract params from request via model_dump or dict(), call A2ACompletionBridgeHandler.handle_non_streaming, return LiteLLMSendMessageResponse.from_dict. Omit agent_extra_headers parameter name in bridge entry description text.

scope:
  paths:
    - crates/betterlite-a2a/src/send.rs
    - crates/betterlite-a2a/src/send/**
    - crates/betterlite-a2a/src/send/tests.rs
    - crates/betterlite-a2a/src/send/tests/**
  lint_tables: false

