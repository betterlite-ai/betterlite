    why: _send_message_via_completion_bridge routes through completion bridge handler and wraps response.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/main.py#L403-552
    why: asend_message detects custom_llm_provider, creates client if needed, preserves trace/agent headers, calculates usage and sets logging fields; decorated with @client.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/main.py#L627-764
    why: asend_message_streaming routes through bridge or native, builds logging object, wraps in A2AStreamingIterator; undecorated, manages Logging object manually.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/main.py#L1-87
    why: Module-level imports, constants and shared helpers for both send functions.

dod:
  - text: asend_message detects custom_llm_provider in litellm_params and routes to completion bridge via _send_message_via_completion_bridge when truthy.
    proof: [send-routing-tests]
  - text: asend_message creates a2a_client from api_base when not provided, with X-LiteLLM-Trace-Id from logging_obj.litellm_trace_id or generated uuid, X-LiteLLM-Agent-Id when agent_id provided, merged with agent_extra_headers taking precedence.
    proof: [send-client-tests]
  - text: asend_message calls _execute_a2a_send_with_retry with a2a_client, request, agent_card, card_url, api_base and agent_name.
    proof: [send-client-tests]
  - text: asend_message calculates usage from request/response via A2ARequestUtils.calculate_usage_from_request_response and sets on logging object.
    proof: [send-usage-tests]
  - text: asend_message sets litellm_params on logging object via _set_litellm_params_on_logging_obj with only pricing keys.
    proof: [send-usage-tests]
  - text: asend_message sets agent_id on logging object via _set_agent_id_on_logging_obj.
    proof: [send-usage-tests]
  - text: asend_message returns LiteLLMSendMessageResponse from a2a_response via from_a2a_response.
    proof: [send-response-tests]
  - text: _send_message_via_completion_bridge extracts params from request, calls A2ACompletionBridgeHandler.handle_non_streaming, returns LiteLLMSendMessageResponse.from_dict.
    proof: [bridge-routing-tests]
  - text: asend_message_streaming detects custom_llm_provider and routes through completion bridge via A2ACompletionBridgeHandler.handle_streaming.
    proof: [stream-routing-tests]
  - text: asend_message_streaming creates a2a_client when not provided, with X-LiteLLM-Trace-Id from logging_obj.litellm_trace_id, then str(request.id) if request.id is set, then generated uuid, and X-LiteLLM-Agent-Id when agent_id provided.
    proof: [stream-client-tests]
  - text: asend_message_streaming builds or reuses logging object, sets agent_id, wraps stream in A2AStreamingIterator.
    proof: [stream-logging-tests]
  - text: asend_message_streaming yields chunks from A2AStreamingIterator.
    proof: [stream-iterator-tests]

