id: B3364
title: Container create and list HTTP execution
description: >-
  Implement the concrete collection HTTP steps in betterlite-core over existing provider
  transforms, preserving logging before send and transport-error conversion before response
  transformation. The create handler accepts a container name, create request params, provider
  config, litellm_params, logging object, optional headers, timeout (default 600), async flag
  and optional HTTP client. It validates environment to get headers with auth, overlays extra
  headers after validation, fetches api_base from provider config with the params dict, transforms
  the request to JSON, logs the pre-call state, POSTs with the timeout argument, catches transport
  exceptions and delegates to _handle_error, validates response status with raise_for_error_status,
  and transforms the response to ContainerObject. The list handler follows the same outline for
  GET: validates environment, overlays extra headers, gets api_base, transforms request (returning
  url and params), logs, GETs without timeout argument using the selected client's deadline (and
  passes params or None to preserve any query string already in api_base, e.g. Azure api-version),
  catches transport errors, validates status and transforms response to ContainerListResponse.
  Both handlers support sync execution with delegation to async when _is_async=True; the async
  implementations are separate coroutines. Client selection defaults to a new httpx instance by
  type checking when not supplied. Clients must be pooled instances supplied from B173; the
  handler selects between them by sync/async type. Header overlays use the map after provider
  validation, including any in-place auth mutation.
