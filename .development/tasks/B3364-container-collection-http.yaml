deviations:
  - what: Create handler passes timeout explicitly to the httpx POST call, while list handler omits timeout and uses the selected client's existing deadline instead.
    why: The LiteLLM source explicitly passes timeout to create POST but omits it for list GET, retaining the selected client's own deadline behavior for the list operation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L8874-8875
  - what: List handler passes params or None to httpx GET; an empty dict becomes None to preserve any query string already in api_base (e.g. Azure api-version).
    why: An empty dict passed as params to httpx strips the URL's own query string, breaking Azure container list URLs with api-version; None leaves them intact and matches the source behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L9044
out_of_scope:
  - B3360 owns the typed container operation contracts, create/list optional params and response types; no contract definitions are built here.
  - B3363 owns the generic container file handler and raise_for_error_status; this task reuses those without modification.
  - B522 owns provider transformations (validate_environment, get_complete_url, transform_container_create_request, transform_container_create_response, transform_container_list_request, transform_container_list_response); this task calls them without reimplementation.
  - B547 owns Azure-specific provider overrides; inherited methods are used as configured.
  - B173 owns HTTP client pooling and async selection; this task uses its provided clients.
  - B249 owns logging facade and pre_call method; this task calls it with the transformed request data.
  - B2402 owns _handle_error conversion; this task delegates transport errors to it before raising.
pitfalls:
  - Create handler passes timeout explicitly to POST; list handler omits timeout for GET, retaining the client's deadline; a future caller must not assume per-call timeout control on list operations.
  - Extra headers overlay the map after provider validation, overriding headers set by validate_environment including auth mutations; order matters.
  - Empty params dict must become None before GET call to preserve any query string already in api_base; passing an empty dict strips the URL's query string and breaks Azure container listing.
  - Both handlers catch all exceptions from the HTTP layer and convert them through _handle_error; non-HTTP errors surface as transformed LiteLLM exceptions.
  - The sync variant returns a Union that resolves to a Coroutine when _is_async=True; callers must await the result in async contexts.
