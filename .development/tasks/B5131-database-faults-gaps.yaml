dod:
- text: >-
    classify_sqlstate maps SQLSTATE 40001 (SqlState::T_R_SERIALIZATION_FAILURE) to NativeFault::Deadlock
    next to 40P01, matching the P2034 answer LiteLLM's pinned prisma engine gives a serialization
    failure. sqlstate_classification_matrix in native/tests.rs gains the case
    serialization_failure("40001", NativeFault::Deadlock). The case is missing on today's main, and once
    written it fails until classify_sqlstate changes, since 40001 comes back Unclassified there.
  proof: [serialization-failure, behavior-tests]
- text: >-
    transport_keyword_matrix is an rstest with the twelve cases cant_reach_database_server,
    cannot_reach_database_server, cant_connect, cannot_connect, connection_error, connection_closed,
    timed_out, timeout, connection_refused, network_is_unreachable, no_route_to_host and broken_pipe.
    Each holds one phrase alone in mixed case, asserts true on ErrorType::Prisma and false on
    ErrorType::Other. The new oracle case transport-phrases.yaml sends the same twelve messages on
    prisma errors plus an other row and matches LiteLLM. Today's main has neither the cases nor the case
    file, and deleting any one phrase from TRANSPORT_WORDS fails both once they exist.
  proof: [transport-phrases, oracle]
- text: >-
    deadlock_code_and_phrases is an rstest with the cases prisma_code, write_conflict_phrase,
    deadlock_phrase, sqlstate_phrase, connect_with_code and other_with_phrase, the last two expecting
    false. The new oracle case deadlock-markers.yaml sends the same rows and matches LiteLLM. Today's main
    has neither, and once they exist, dropping the P2034 check, any of the three phrases or the Prisma
    gate in is_deadlock_error fails a case.
  proof: [deadlock-markers, oracle]
- text: >-
    read_only_code_and_phrase is an rstest with the cases quoted_code, phrase, unquoted_code,
    connect_quoted_code and other_phrase, the last three expecting false. The new oracle case
    read-only-markers.yaml sends the same rows and matches LiteLLM. Today's main has neither, and once
    they exist, dropping the read-only phrase, the Prisma gate or the quotes around 25006 fails a case.
  proof: [read-only-markers, oracle]
- text: >-
    nondata_no_sqlstate is an rstest with the cases prisma and client_not_connected. Each sets meta_code
    "23505" and the message 'PostgresError { code: "40001"' and asserts postgres_sqlstate returns None.
    The new oracle case sqlstate-non-data.yaml sends both rows plus a data row with the same fields and
    matches LiteLLM. Today's main has neither, and once they exist, deleting the is_data_type gate in
    postgres_sqlstate fails both cases.
  proof: [non-data-sqlstate, oracle]
- text: >-
    Every test under database_faults::, the reconnect tests and the native tests included, still passes
    after the edits to the shared test files.
  proof: [behavior-tests]
checks:
  optional: []
  commands:
  - id: serialization-failure
    why: SQLSTATE 40001 still comes back Unclassified, or the matrix has no 40001 row
    run: >-
      list=$(cargo nextest list --locked -p betterlite-db -E 'test(/^database_faults::native::tests::sqlstate_classification_matrix::/)' --message-format oneline) &&
      for name in serialization_failure; do grep -qE "sqlstate_classification_matrix::case_[0-9]+_${name}$" <<< "$list" || { echo "missing case $name"; exit 1; }; done &&
      cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::native::tests::/)'
  - id: transport-phrases
    why: a transport phrase has no case of its own, or the matching oracle case is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/database-faults/transport-phrases.yaml)" &&
      list=$(cargo nextest list --locked -p betterlite-db -E 'test(/^database_faults::tests::transport_keyword_matrix::/)' --message-format oneline) &&
      for name in cant_reach_database_server cannot_reach_database_server cant_connect cannot_connect connection_error connection_closed timed_out timeout connection_refused network_is_unreachable no_route_to_host broken_pipe; do grep -qE "transport_keyword_matrix::case_[0-9]+_${name}$" <<< "$list" || { echo "missing case $name"; exit 1; }; done &&
      cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::tests::transport_keyword_matrix::/)'
  - id: deadlock-markers
    why: the write conflict phrase or the Prisma gate of is_deadlock_error has no case, or the matching oracle case is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/database-faults/deadlock-markers.yaml)" &&
      list=$(cargo nextest list --locked -p betterlite-db -E 'test(/^database_faults::tests::deadlock_code_and_phrases::/)' --message-format oneline) &&
      for name in prisma_code write_conflict_phrase deadlock_phrase sqlstate_phrase connect_with_code other_with_phrase; do grep -qE "deadlock_code_and_phrases::case_[0-9]+_${name}$" <<< "$list" || { echo "missing case $name"; exit 1; }; done &&
      cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::tests::deadlock_code_and_phrases::/)'
  - id: read-only-markers
    why: the read-only phrase, the Prisma gate or the quotes around 25006 have no case, or the matching oracle case is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/database-faults/read-only-markers.yaml)" &&
      list=$(cargo nextest list --locked -p betterlite-db -E 'test(/^database_faults::tests::read_only_code_and_phrase::/)' --message-format oneline) &&
      for name in quoted_code phrase unquoted_code connect_quoted_code other_phrase; do grep -qE "read_only_code_and_phrase::case_[0-9]+_${name}$" <<< "$list" || { echo "missing case $name"; exit 1; }; done &&
      cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::tests::read_only_code_and_phrase::/)'
  - id: non-data-sqlstate
    why: a non-data error with a meta_code and a PostgresError message has no case, or the matching oracle case is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/database-faults/sqlstate-non-data.yaml)" &&
      list=$(cargo nextest list --locked -p betterlite-db -E 'test(/^database_faults::tests::nondata_no_sqlstate::/)' --message-format oneline) &&
      for name in prisma client_not_connected; do grep -qE "nondata_no_sqlstate::case_[0-9]+_${name}$" <<< "$list" || { echo "missing case $name"; exit 1; }; done &&
      cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::tests::nondata_no_sqlstate::/)'
  - id: behavior-tests
    why: the edits to the shared test files broke another database_faults test
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-db/src/database_faults)" &&
      cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_faults::/)'
oracle_cases:
- tools/oracle/cases/helpers/database-faults/classification-matrix.yaml
- tools/oracle/cases/helpers/database-faults/data-error-not-outage.yaml
- tools/oracle/cases/helpers/database-faults/deadlock-markers.yaml
- tools/oracle/cases/helpers/database-faults/deadlock-sqlstate.yaml
- tools/oracle/cases/helpers/database-faults/permanent-fault-no-retry.yaml
- tools/oracle/cases/helpers/database-faults/read-only-markers.yaml
- tools/oracle/cases/helpers/database-faults/reconnect-effects.yaml
- tools/oracle/cases/helpers/database-faults/reconnect-timeouts.yaml
- tools/oracle/cases/helpers/database-faults/sqlstate-extraction.yaml
- tools/oracle/cases/helpers/database-faults/sqlstate-non-data.yaml
- tools/oracle/cases/helpers/database-faults/transport-phrases.yaml
deviations: []
out_of_scope:
- >-
    crates/betterlite-db/src/database_faults.rs stays as it is. Its padded contains_any helper is on
    B5094's no-padded-one-line-functions list, and B5094 is running now; this task edits no
    .ast-grep/rules/ file.
- >-
    The database_faults helper operation, tools/oracle/src/helpers/db/database_faults.rs,
    tools/oracle/helpers/database_faults.py and the helper_case fuzz corpus stay unchanged. The new
    cases only add rows of the input shape both adapters already read.
- >-
    The fixed status per error class belongs to B5102, already merged. The service unavailable
    functions in exception_handler.py stay with B1217, as B872's out_of_scope says.
pitfalls:
- >-
    The Python adapter sets code and meta only on the prisma family; a connect row becomes
    httpx.ConnectError(message) and drops its code. So connect_with_code in deadlock-markers.yaml pins
    only betterlite's Prisma gate, and other_with_phrase is the row that pins both sides.
- >-
    Keep each transport message to one phrase. "connection closed after a timeout" or "can't connect:
    connection refused" match two of the twelve, and deleting one of them would then leave the case green.
- >-
    The quoted code is the five digits inside double quotes, '"25006"'. A message holding 25006
    without the quotes must answer false, so don't strip the quotes from the test messages.
- >-
    Map 40001 inside the existing Deadlock branch of classify_sqlstate. No new NativeFault variant: a
    serialization failure (P2034) and a real deadlock (the "deadlock detected" or "40p01" text) get the
    same answer from LiteLLM's is_deadlock_error, and its callers retry both the same way.
- >-
    On the engine's raw query path
    (https://github.com/prisma/prisma-engines/blob/5.4.2/query-engine/connectors/sql-query-connector/src/error.rs#L50-L70)
    a 40001 raised by the statement itself falls to RawError::Database instead of P2034. It surfaces as
    P2010 "Raw query failed", and LiteLLM's raw daily spend upsert
    (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_spend_update_writer.py#L2490-L2560)
    doesn't retry it. classify_sqlstate has no caller yet, so a later native caller that mirrors that raw
    path checks the SQLSTATE itself.
- >-
    The case names above must stay exactly as written: each check greps
    case_<number>_<name> at the end of the nextest name, so a renamed case fails its check.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
