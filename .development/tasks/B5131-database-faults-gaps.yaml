id: B5131
title: Close the B872 database fault audit gaps
description: >-
  Fix the gaps an Opus review found in B872's database fault classifiers after it merged. One is a
  behavior gap in the native SQLSTATE map. The other four are tests that can't fail on the behavior they
  name. All five findings hold against the LiteLLM checkout at the pin, so none is left out. The code
  change is one line in crates/betterlite-db/src/database_faults/native.rs. The rest is tests in
  crates/betterlite-db/src/database_faults/tests.rs and native/tests.rs, plus four new helper oracle
  cases for the existing database_faults operation.


  Gap one. LiteLLM's is_deadlock_error answers true for any prisma error whose code is P2034
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/exception_handler.py#L224-L237).
  The spend writer retries a failed update when it does
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_spend_update_writer.py#L1998-L2017,
  line 2010), and so does the spend log writer through _is_transient_spend_log_write_error
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L7836-L7837).
  LiteLLM locks prisma 0.11.0
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/uv.lock#L7202-L7204),
  and that client runs prisma engines 5.4.2
  (https://github.com/RobertCraigie/prisma-client-py/blob/v0.11.0/src/prisma/_config.py#L25-L28). That
  engine maps SQLSTATE 40001, serialization_failure, to TransactionWriteConflict
  (https://github.com/prisma/prisma-engines/blob/5.4.2/quaint/src/connector/postgres/error.rs#L174-L181)
  and reports it as P2034 with the message "Transaction failed due to a write conflict or a deadlock.
  Please retry your transaction"
  (https://github.com/prisma/prisma-engines/blob/5.4.2/libs/user-facing-errors/src/query_engine/mod.rs#L318-L323).
  So under repeatable read or serializable isolation LiteLLM treats a serialization failure as a
  deadlock and retries it. betterlite's classify_sqlstate maps only 40P01
  (SqlState::T_R_DEADLOCK_DETECTED) to NativeFault::Deadlock and leaves 40001 as
  NativeFault::Unclassified. The fix adds SqlState::T_R_SERIALIZATION_FAILURE to the Deadlock branch.
  sqlstate_classification_matrix in native/tests.rs has no 40001 row, so nothing on main can catch this.
  It gains the case serialization_failure("40001", NativeFault::Deadlock). B872's behavior-tests filter
  (^database_faults::tests::) never ran native/tests.rs at all. This task's checks do.


  Gap two. LiteLLM's is_database_transport_error lowercases the message of any PrismaError and answers
  true when it holds one of twelve phrases
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/exception_handler.py#L175-L215,
  the list at L197-L210). betterlite keeps the same list as TRANSPORT_WORDS in database_faults.rs.
  transport_keyword_matrix only checks "NETWORK IS UNREACHABLE", and the other unit tests and oracle
  cases only add "can't reach database server" and "connection refused". Any of the other nine phrases
  can be deleted with every test still green. transport_keyword_matrix becomes an rstest with one case
  per phrase: cant_reach_database_server, cannot_reach_database_server, cant_connect, cannot_connect,
  connection_error, connection_closed, timed_out, timeout, connection_refused, network_is_unreachable,
  no_route_to_host and broken_pipe. Each case holds its phrase alone in mixed case. It asserts true on
  ErrorType::Prisma and false on ErrorType::Other with the same message, so deleting a phrase or the
  lowercase step fails a case. The HttpClientClosed assertion moves to a plain test of its own. The new
  oracle case transport-phrases.yaml sends the same twelve messages on prisma errors, plus an other row
  carrying a phrase, and compares every predicate with LiteLLM.


  Gap three. LiteLLM's is_deadlock_error returns false for anything that isn't a PrismaError. For a
  PrismaError it answers true on code P2034 or when the lowercased message holds "deadlock detected",
  "40p01" or "write conflict or a deadlock"
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/exception_handler.py#L224-L237).
  LiteLLM's own tests pin the engine's write conflict text as a positive and a plain
  RuntimeError("deadlock detected") as a negative
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/unit/proxy/db/test_exception_handler.py#L635-L664).
  deadlock_code_and_phrases only checks a Prisma error with code P2034. No test or case uses the write
  conflict phrase, and none gives a non-Prisma error a deadlock code or phrase. So dropping that phrase
  or the Prisma gate in is_deadlock_error leaves every test green. The test becomes an rstest over error
  type, code, message and the expected answer, with these cases: prisma_code (Prisma, P2034, empty
  message, true), write_conflict_phrase (Prisma, "Transaction failed due to a write conflict or a
  deadlock. Please retry your transaction", true), deadlock_phrase (Prisma, "Deadlock Detected", true),
  sqlstate_phrase (Prisma, "ERROR: 40P01", true), connect_with_code (Connect, P2034, false) and
  other_with_phrase (Other, "deadlock detected", false). The new oracle case deadlock-markers.yaml sends
  the same rows.


  Gap four. LiteLLM's is_read_only_transaction_error returns false for anything that isn't a
  PrismaError. Otherwise it answers true when the lowercased message holds the quoted '"25006"' or
  "read-only transaction"
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/exception_handler.py#L254-L263).
  Its own tests use "cannot execute INSERT in a read-only transaction" as a positive and
  ValueError('"25006"') as a negative
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/unit/proxy/db/test_exception_handler.py#L712-L738).
  read_only_code_and_phrase only checks a Prisma error holding the quoted code, and no oracle case sets
  any read-only marker. Dropping the phrase, the Prisma gate or the quotes around 25006 leaves every test
  green. The test becomes an rstest with these cases: quoted_code (Prisma, 'ERROR "25006"', true), phrase
  (Prisma, "cannot execute INSERT in a READ-ONLY TRANSACTION", true), unquoted_code (Prisma, "SQLSTATE
  25006", false), connect_quoted_code (Connect, '"25006"', false) and other_phrase (Other, "read-only
  transaction", false). The new oracle case read-only-markers.yaml sends the same rows.


  Gap five. LiteLLM's postgres_sqlstate returns None for anything that isn't a prisma DataError, before
  it looks at meta or the message
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/exception_handler.py#L240-L251,
  the gate at L244). nondata_no_sqlstate passes a Prisma error with no meta_code and an empty message.
  postgres_sqlstate returns None for that even with its is_data_type gate deleted, and no oracle case
  gives a non-data error a meta_code or a PostgresError message. The test becomes an rstest with the
  cases prisma and client_not_connected. Each sets meta_code to "23505" and the message to
  'PostgresError { code: "40001"' and asserts None. The new oracle case sqlstate-non-data.yaml sends
  those two rows plus a data row with the same fields, where both sides answer "23505".
scope:
  paths:
  - crates/betterlite-db/src/database_faults/native.rs
  - crates/betterlite-db/src/database_faults/native/tests.rs
  - crates/betterlite-db/src/database_faults/tests.rs
  - tools/oracle/cases/helpers/database-faults/transport-phrases.yaml
  - tools/oracle/cases/helpers/database-faults/deadlock-markers.yaml
  - tools/oracle/cases/helpers/database-faults/read-only-markers.yaml
  - tools/oracle/cases/helpers/database-faults/sqlstate-non-data.yaml
  lint_tables: false
