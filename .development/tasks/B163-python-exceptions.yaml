id: B163
title: Python exception classes raised with LiteLLM's names and fields
description: >-
  Code written for LiteLLM does `except litellm.RateLimitError as e` and reads `e.status_code`, `e.llm_provider`, `e.model`,
  `e.num_retries` and `str(e)`. Build the same classes in the wheel as the package `betterlite.exceptions`, so
  `from betterlite.exceptions import RateLimitError` and `betterlite.RateLimitError` both work. The Python
  side of B158 builds these classes from the native error JSON, so the names, constructor parameter names and attribute names
  must match litellm/exceptions.py exactly.


  The wheel depends only on python-dotenv, so there is no `openai` and no `httpx`. LiteLLM's classes inherit from
  `openai.APIStatusError` and friends and build `httpx.Response` objects. Replace both with two small private modules.
  `_http.py` has `Request(method, url)` and `Response(status_code, request=None, headers=None, content=None)`. `Response` keeps
  `status_code`, a case-insensitive `headers` mapping (`get`, `items`, `__getitem__`, `__contains__`), `content` as bytes, and `text`.
  Its `request` property raises `RuntimeError` when none was given, the way httpx does, because `BadRequestError` tests for a
  usable request. `_openai_base.py` has the classes of openai-python's `_exceptions.py` at the version in
  `tools/oracle/litellm/uv.lock`, with the same names, base classes and attribute rules: `OpenAIError`, `APIError(message,
  request, *, body)`, `APIResponseValidationError`, `APIStatusError`, `APIConnectionError`, `APITimeoutError`, `BadRequestError`,
  `AuthenticationError`, `PermissionDeniedError`, `NotFoundError`, `ConflictError`, `UnprocessableEntityError`, `RateLimitError`
  and `InternalServerError`. `APIError` copies `code`, `param` and `type` from a dict body (`type` is None when the body is not a dict).
  `APIStatusError` takes `status_code` from the response and `request_id` from its `x-request-id` header. The status classes
  have no code of their own beyond that. In the LiteLLM classes below, import this module as `base` and write
  `class AuthenticationError(base.AuthenticationError)`, so the name clash with LiteLLM's own classes never needs an alias.


  Files under `python/betterlite/exceptions/`, each under the 300-line limit: `__init__.py` imports by name and has the
  explicit `__all__`, `_rate_limit.py`, `_text.py`, `_status.py`, `_server.py` and `_process.py`. `_rate_limit.py` has
  `RateLimitErrorCategory`, `RateLimitType`, `validate_rate_limit_category` and `validate_rate_limit_type` (L24-L115), with the same
  values. `_text.py` has one mixin, `RetryText`, with the `__str__` and `__repr__` that all of LiteLLM's classes repeat: the
  message, then " LiteLLM Retried: N times" when `num_retries` is truthy, then ", LiteLLM Max Retries: N" when `max_retries` is truthy.
  Put it first in each class's bases, so its methods win over the base's. `MidStreamFallbackError` writes its own.


  `_status.py` has the classes with a fixed status: `AuthenticationError` (401), `NotFoundError` (404), `BadRequestError` (400),
  `ImageFetchError`, `VectorStoreSearchError`, `UnprocessableEntityError` (422), `PermissionDeniedError` (403),
  `ContextWindowExceededError`, `RejectedRequestError`, `ContentPolicyViolationError`, `UnsupportedParamsError`,
  `InvalidRequestError` and `LiteLLMUnknownProvider`. `_server.py` has `Timeout`, `RateLimitError`, `ServiceUnavailableError`,
  `BadGatewayError`, `InternalServerError`, `APIError`, `APIConnectionError`, `APIResponseValidationError`,
  `JSONSchemaValidationError`, `OpenAIError`, `MockException`, `MidStreamFallbackError` and the list
  `LITELLM_EXCEPTION_TYPES` (L970-L991, in that order, with `InternalServerError` twice). `_process.py` has `ModelNotMappedError`,
  `BudgetExceededError`, `GuardrailRaisedException`, `BlockedPiiEntityError`, `ModifyResponseException` and
  `SensitiveDataRouteException`, which are plain `Exception` subclasses. Port each `__init__` line by line from its linked range:
  the order of assignments matters, because the base constructor overwrites `message`, `status_code` and `response`.
  Every constructor keeps LiteLLM's parameter names, order and defaults, with real types in place of the missing annotations
  (`str`, `str | None`, `int | None`). No `Any`: a body is `object | None`, and `request_data` is `dict[str, object]`.


  Text and defaults to carry over: every message gets the prefix `litellm.<ClassName>: ` (the prefix says `litellm` on purpose, tests
  match on it). `BudgetExceededError.status_code` reads `betterlite.budget_exceeded_status_code` (B157, default 422) when the error
  is built, so `import betterlite` at the top of `_process.py` and read the attribute in `__init__`. `LiteLLMUnknownProvider` formats the string
  `"Unmapped LLM provider for this endpoint. You passed model={model}, custom_llm_provider={custom_llm_provider}. Check supported provider and route: https://docs.litellm.ai/docs/providers"`
  (types/utils.py L151). Keep it as a constant in `_status.py`, since `LiteLLMCommonStrings` is not part of this task.
  `VectorStoreSearchFailure` (types/vector_stores.py L104-L108) is a three-key `TypedDict` in `_status.py` for the same reason, and
  `VECTOR_STORE_SEARCH_FAILED_CODE` is "vector_store_search_failed".


  The tests are `tests/test_exceptions_status.py`, `tests/test_exceptions_server.py`, `tests/test_exceptions_process.py` and
  `tests/test_exceptions_exports.py`. Each builds the same instance with LiteLLM and with betterlite from one parameter table
  (pytest `parametrize`) and compares `str`, `repr`, `args`, `message`, `status_code`, `llm_provider`, `model`, `num_retries`,
  `max_retries`, `litellm_debug_info`, `code`, `param`, `type`, `body`, `headers`, `response.status_code`, `response.headers`,
  `request.method` and `request.url`, plus the class names of `__mro__` with the `openai` and `httpx` modules ignored.
  Class names that the two sides share are the contract; nothing is compared by identity.
scope:
