dod:
- text: >-
    Every class and helper in litellm/exceptions.py exists in `betterlite.exceptions` with the same parameter names, order and
    defaults, and `__all__` lists exactly those public names.
  proof: [exceptions-exports]
- text: >-
    The status classes (401, 404, 400, 422, 403, ContextWindow, Rejected, ContentPolicy, UnsupportedParams, InvalidRequest,
    ImageFetch, VectorStoreSearch, LiteLLMUnknownProvider) match LiteLLM in `str`, `repr`, attributes, response and class order.
  proof: [exceptions-status]
- text: >-
    `Timeout`, `RateLimitError`, 503, 502, 500, `APIError`, `APIConnectionError`, `APIResponseValidationError`,
    `JSONSchemaValidationError`, `OpenAIError`, `MockException` and `MidStreamFallbackError` match LiteLLM the same way, and
    `RateLimitError` keeps its category, rate_limit_type, headers and detail rules.
  proof: [exceptions-server]
- text: >-
    The plain exceptions match LiteLLM, and `BudgetExceededError.status_code` follows `betterlite.budget_exceeded_status_code` at the
    time the error is built.
  proof: [exceptions-process]
- text: >-
    The new Python files pass ruff and basedpyright in strict mode, with no `Any` and no `type: ignore`.
  proof: [exceptions-lint]
checks:
  optional: []
  commands:
  - id: exceptions-exports
    why: A name or a signature is missing, so `from betterlite.exceptions import X` fails or takes other arguments.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_exceptions_exports.py
  - id: exceptions-status
    why: A fixed-status class differs from LiteLLM in text, status or response, so `except` clauses and retries act differently.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_exceptions_status.py
  - id: exceptions-server
    why: A timeout, rate-limit or server error loses a field that the router and callbacks read.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_exceptions_server.py
  - id: exceptions-process
    why: A guardrail or budget exception differs in message, status code or fields.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_exceptions_process.py
  - id: exceptions-lint
    why: The other-languages rule needs clean strict checks.
    run: test -d crates/betterlite-python/python/betterlite/exceptions && uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python/betterlite/exceptions
      crates/betterlite-python/tests/test_exceptions_status.py crates/betterlite-python/tests/test_exceptions_server.py crates/betterlite-python/tests/test_exceptions_process.py
      crates/betterlite-python/tests/test_exceptions_exports.py && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: >-
    The classes do not inherit from `openai.*` and do not use `httpx.Request` or `httpx.Response`. Their bases are copies in
    `betterlite.exceptions._openai_base` and their `request` and `response` objects come from `betterlite.exceptions._http`.
  why: The wheel depends only on python-dotenv. A user's `except openai.RateLimitError` does not catch betterlite's error, and
    `isinstance(e.response, httpx.Response)` is False.
- what: This task has no helper oracle cases.
  why: The pytest files import both packages and compare instances directly, and a helper adapter cannot construct Python exceptions.
out_of_scope:
- The Anthropic error format in litellm/anthropic_interface/exceptions/** is B5790.
- >-
  The table from the native error `type` to these classes, `UnknownNativeError` and the mock-exception rule are B158. The
  native side that produces the JSON is B5659.
- >-
  Setting `budget_exceeded_status_code` and the star line `from betterlite.exceptions import *` in `python/betterlite/__init__.py`
  belong to B157 and the architect. This task never edits that file.
- '`LiteLLMCommonStrings` and `VectorStoreSearchFailure` are not ported as types; only the one string and the one TypedDict above.'
- The Rust error types in litellm/exceptions.py and their mapping were done by B184 and B011.
pitfalls:
- >-
  The base constructor overwrites what the subclass set earlier: `APIStatusError` sets `status_code` from the response, and
  `APIError` sets `message` again. Assign the attributes in LiteLLM's order, and test `status_code` after a response with a different status.
- >-
  `UnsupportedParamsError` never calls its base constructor. It has no `response`, `args` is empty and its `status_code` argument is
  ignored. Copy that, and do not add the call.
- >-
  `Timeout` calls `APITimeoutError(request)` first and only then sets `message`, so `args` still holds "Request timed out.";
  it sets `response` only when one is passed, and `status_code` is `exception_status_code or 408`.
- >-
  `RateLimitError` does not copy headers from `response`: only the `headers=` argument reaches `self.headers`, as strings. It builds a new
  429 response from the old content and its headers, and sets `code = "429"` and `type = "throttling_error"` after the base
  constructor, which overrides what the body gave.
- >-
  503, 502 and 500 rebuild their response against the URL " https://cloud.google.com/vertex-ai/" with a leading space. Keep the space.
  `InternalServerError` also sets `type = "internal_server_error"` after the base call.
- >-
  `BadRequestError` keeps a given response only when it is a `Response` whose private `_request` is set. Otherwise it uses the one cached
  400 response, shared by all errors. `ContextWindowExceededError` adds its prefix after the base call, and passes the plain message in.
- '`APIConnectionError` ignores its `request` argument and always builds a POST to https://api.openai.com/v1; its `status_code` is 500.'
- >-
  `MidStreamFallbackError` takes `status_code` from `original_exception.status_code` when it is set, runs the 503 constructor, then
  restores `status_code`, `response`, `request`, `message` and `args`. Its `__str__` appends " Original exception: Type: text".
- >-
  `JSONSchemaValidationError` builds a message that starts with "litellm.JSONSchemaValidationError:", and `APIResponseValidationError` then
  puts its own prefix in front, so `str(e)` carries both. Test the final text.
- '`BudgetExceededError` stores `category` "litellm_rate_limit" and `rate_limit_type` "budget" as plain strings, not enum members.'
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
