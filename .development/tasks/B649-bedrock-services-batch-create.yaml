checks:
  optional:
  - mutants
  commands:
  - id: case-batch-role-required
    why: The batch-role-required behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_batch_role_required$/)'
  - id: case-managed-input-model
    why: The managed-input-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_managed_input_model$/)'
  - id: case-output-bucket-fallback
    why: The output-bucket-fallback behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_output_bucket_fallback$/)'
  - id: case-tags-validation
    why: The tags-validation behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_tags_validation$/)'
  - id: case-24h-window
    why: The 24h-window behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_input_24h_window$/)'
  - id: case-create-status-mapping
    why: The create-status-mapping behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_create_status_mapping$/)'
  - id: case-metadata-sanitization
    why: The metadata-sanitization behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_metadata_sanitization$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_batch_create.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_create*")"
      && grep -lq 'bedrock_services_batch_create' tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_create*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_batch_create$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_batch_create)"
      && grep -q 'decode_created_batch' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_batch_create.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_batch_create_corpus$/)'
  - id: config-aws-batch-role-arn
    why: The AWS_BATCH_ROLE_ARN setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_batch_create_config_cases::case_[0-9]+_loads_aws_batch_role_arn$/)'
      && grep -lq 'AWS_BATCH_ROLE_ARN' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_batch_create*
  - id: config-bedrock-tags
    why: The bedrock_tags setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_batch_create_config_cases::case_[0-9]+_loads_bedrock_tags$/)'
      && grep -lq 'bedrock_tags' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_batch_create*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_batch_create_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_batch_create*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_batch_create_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_batch_create_secret_safe_failure$/)'
