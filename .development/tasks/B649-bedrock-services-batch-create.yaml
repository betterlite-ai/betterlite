id: B649
title: Bedrock batch creation requests and replies
description: >-
  Add BedrockBatchCreate and input-file/model extraction, preserving model-invocation-job request path, configured
  output bucket and role ARN, bucket-owner/KMS settings, tags and 24h completion window. Resolve AWS_BATCH_ROLE_ARN
  and bedrock_tags at config boundary; retain original request metadata through a typed owned context. Batch ids
  and output prefixes keep the source wire naming.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/batches/transformation.py:
  _build_s3_input_config L55-L58; _build_s3_output_config L61-L72; _validate_bedrock_tags L75-L82; titan_embedding_usage_from_batch_output
  L85-L96; BedrockBatchesConfig.__init__ L104-L106; BedrockBatchesConfig.custom_llm_provider L109-L110; BedrockBatchesConfig.validate_environment
  L147-L162; BedrockBatchesConfig.get_complete_batch_url L164-L186; BedrockBatchesConfig.transform_create_batch_request
  L188-L299; BedrockBatchesConfig.transform_create_batch_response L301-L373; BedrockBatchesConfig._get_openai_compatible_batch_metadata
  L376-L394. litellm/llms/bedrock/common_utils.py: CommonBatchFilesUtils.generate_unique_job_name L1965-L1984.


  Named case contracts: batch_role_required: Missing/falsey input_file_id first raises ValueError input_file_id
  is required for Bedrock batch creation. Parse S3 with B643 CommonBatchFilesUtils.parse_s3_uri, not its stricter
  authorized download resolver. Role precedence is truthy litellm_params.aws_batch_role_arn, optional_params.aws_batch_role_arn,
  AWS_BATCH_ROLE_ARN; all absent/empty -> ValueError AWS IAM role ARN is required for Bedrock batch jobs. Set 'aws_batch_role_arn'
  in litellm_params or AWS_BATCH_ROLE_ARN env var. Only after that, falsey model -> ValueError Could not determine
  Bedrock model ID. Please pass `model` in your request body. output_bucket_fallback: Output bucket is truthy litellm_params.s3_output_bucket_name
  then AWS_S3_OUTPUT_BUCKET_NAME, else parsed input bucket; optional_params does not participate. Emit inputDataConfig.s3InputDataConfig.s3Uri
  and outputDataConfig.s3OutputDataConfig.s3Uri = s3://{output_bucket}/litellm-batch-outputs/{job_name}/. Do not
  apply cloud-object-name sanitization or trusted bucket authorization in this function. tags_validation: Choose
  litellm_params.bedrock_tags when not None, otherwise optional_params.bedrock_tags; [] overrides fallback and is
  emitted. Strict list of BedrockTag string key/value records; reject tuples/nonstring fields/missing fields according
  to its TypedDict adapter, while extra keys follow the source adapter policy. ValueError text: Invalid 'bedrock_tags'
  value. Expected a list of {'key': <str>, 'value': <str>} dicts, e.g. [{'key': 'team', 'value': 'genai'}]. Got:
  {raw_tags!r}. create_status_mapping: decode_created_batch: JSON failure -> ValueError Failed to parse Bedrock
  batch response: {error}. Map Submitted/Validating to validating, Scheduled/InProgress to in_progress, PartiallyCompleted/Completed
  to completed, Failed to failed, Stopping to cancelling, Stopped to cancelled, Expired to expired. Missing status
  defaults Submitted; unknown/None stringifies then defaults validating silently. No own HTTP-status guard; a parseable
  error-status response follows the same projection. metadata_sanitization: Nondict metadata -> {}. Drop exact standard_logging_guardrail_information
  and None values. Stringify keys, keep string values unchanged, otherwise call B192 safe_dumps (including its NUL
  policy). Unlike OpenAI metadata helper, do not drop hidden_params, cap sixteen entries, or discard nonstrings.
  generated_job_name: CommonBatchFilesUtils.generate_unique_job_name ignores model and emits {prefix}-batch-{str(uuid4)[:8]},
  default prefix litellm. Do not include model or enforce the docstring claim of 63 characters. Inject UUID and
  preserve caller prefix verbatim. Creation sets modelId to the supplied model without stripping provider prefixes.
  owner_and_kms: Resolve owner/KMS via B643. Omit s3BucketOwner only for None; empty string is included when directly
  testing the builders. Include s3EncryptionKeyId only on output config and only when not None. Input never gets
  encryption metadata. Validate_environment returns caller headers unchanged. input_24h_window: Only exact truthy
  completion_window=24h adds timeoutDurationInHours=24. Missing, empty, 48h and other values are ignored without
  warning or rejection. create_signed_request: Merge credentials B596, resolve region B591, and use B198 partition
  DNS in https://bedrock.{region}.{suffix}/model-invocation-job, ignoring supplied api_base/api_key. Sign POST through
  B595 CommonBatchFilesUtils.sign_aws_request service bedrock. Return method POST,url,headers and signed bytes decoded
  UTF-8; no S3 credentials, bearer shortcut or clientRequestToken field is added. create_reply_defaults: jobArn
  defaults empty; object batch; original_batch_request defaults {} and provides endpoint default /v1/chat/completions,input_file_id
  default empty,completion_window default 24h,metadata default {}. Explicit supplied values follow source .get/Pydantic
  behavior. created_at is current integer clock; in_progress_at is a separately sampled clock only for exact InProgress,
  not Scheduled. errors,output_file_id,error_file_id,expires_at,finalizing_at,completed_at,failed_at,expired_at,cancelling_at,cancelled_at,request_counts
  are None regardless of status. Constructor uses B2214 base no-op and B643 CommonBatchFilesUtils/BaseAWS state;
  custom_llm_provider is bedrock. titan_batch_token_usage: Return None unless embedding OR embeddingsByType key
  is present (even null), and inputTextTokenCount is an int but not bool. Negative integers remain allowed. Return
  Usage prompt_tokens=total_tokens=count,completion_tokens=0; absence/wrong type yields None. API B1039 calls this
  helper; it does not belong to B650 status projection.


  Load deployment aws_batch_role_arn default None, AWS_BATCH_ROLE_ARN default None, and bedrock_tags default None.
  Existing role loader must exercise deployment/optional/environment precedence and explicit empty fallback; add
  a separate environment loader test as named below. Reuse B643 output-bucket/owner/KMS loaders. original_batch_request
  is an internal handoff from the API caller, not an operator config key. Native S3 batch creation works in open-source
  LiteLLM and does not require the enterprise managed-files hook.


  Load AWS_BATCH_ROLE_ARN through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest batch_create_environment_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Implement crates/betterlite-bedrock/src/batch_create.rs with adjacent tests under batch_create/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batch_create_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  batch_role_required, output_bucket_fallback, tags_validation, input_24h_window, create_status_mapping, metadata_sanitization,
  generated_job_name, owner_and_kms, create_signed_request, create_reply_defaults, titan_batch_token_usage. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_create* using HelperCase:
  kind: helper and the externally tagged bedrock_services_batch_create variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_batch_create that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_created_batch consumes model-invocation-job creation JSON bytes in crates/betterlite-bedrock/src/batch_create.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_batch_create.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_batch_create.
  The adjacent test replays_the_bedrock_services_batch_create_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/batch_create.rs
  and its loader wiring: AWS_BATCH_ROLE_ARN, bedrock_tags. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest bedrock_services_batch_create_config_cases
  with named cases loads_aws_batch_role_arn, loads_bedrock_tags, plus rejects_unrelated_key. Each loads case calls
  the real config loader with that key and asserts the resolved value, default, precedence and secret redaction
  where applicable. Seed B002 config_yaml with new bedrock_services_batch_create* files for every key; reuse its
  parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_batch_create_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_services_batch_create_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 256 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 280 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 35 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 800 planned, 800 maximum changed lines.
