checks:
  optional:
  - mutants
  commands:
  - id: case-batch-role-required
    why: Missing/falsey input_file_id first raises ValueError input_file_id is required for Bedrock batch creation.
      Parse S3 with B643 CommonBatchFilesUtils.parse_s3_uri, not its stricter authorized download resolver. Role
      precedence is truthy litellm_params.aws_batch_role_arn, optional_params.aws_batch_role_arn, AWS_BATCH_ROLE_ARN;
      all absent/empty -> ValueError AWS IAM role ARN is required for Bedrock batch jobs. Set 'aws_batch_role_arn'
      in litellm_params or AWS_BATCH_ROLE_ARN env var. Only after that, falsey model -> ValueError Could not determine
      Bedrock model ID. Please pass `model` in your request body.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_batch_role_required$/)'
  - id: case-output-bucket-fallback
    why: Output bucket is truthy litellm_params.s3_output_bucket_name then AWS_S3_OUTPUT_BUCKET_NAME, else parsed
      input bucket; optional_params does not participate. Emit inputDataConfig.s3InputDataConfig.s3Uri and outputDataConfig.s3OutputDataConfig.s3Uri
      = s3://{output_bucket}/litellm-batch-outputs/{job_name}/. Do not apply cloud-object-name sanitization or trusted
      bucket authorization in this function.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_output_bucket_fallback$/)'
  - id: case-tags-validation
    why: 'Choose litellm_params.bedrock_tags when not None, otherwise optional_params.bedrock_tags; [] overrides
      fallback and is emitted. Strict list of BedrockTag string key/value records; reject tuples/nonstring fields/missing
      fields according to its TypedDict adapter, while extra keys follow the source adapter policy. ValueError text:
      Invalid ''bedrock_tags'' value. Expected a list of {''key'': <str>, ''value'': <str>} dicts, e.g. [{''key'':
      ''team'', ''value'': ''genai''}]. Got: {raw_tags!r}.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_tags_validation$/)'
  - id: case-create-status-mapping
    why: 'decode_created_batch: JSON failure -> ValueError Failed to parse Bedrock batch response: {error}. Map
      Submitted/Validating to validating, Scheduled/InProgress to in_progress, PartiallyCompleted/Completed to completed,
      Failed to failed, Stopping to cancelling, Stopped to cancelled, Expired to expired. Missing status defaults
      Submitted; unknown/None stringifies then defaults validating silently. No own HTTP-status guard; a parseable
      error-status response follows the same projection.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_create_status_mapping$/)'
  - id: case-metadata-sanitization
    why: Nondict metadata -> {}. Drop exact standard_logging_guardrail_information and None values. Stringify keys,
      keep string values unchanged, otherwise call B192 safe_dumps (including its NUL policy). Unlike OpenAI metadata
      helper, do not drop hidden_params, cap sixteen entries, or discard nonstrings.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_metadata_sanitization$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_batch_create.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_create*")"
      && grep -lq 'bedrock_services_batch_create' tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_create*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_batch_create$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_batch_create)"
      && grep -q 'decode_created_batch' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_batch_create.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_batch_create_corpus$/)'
  - id: config-aws-batch-role-arn
    why: The AWS_BATCH_ROLE_ARN setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_batch_create_config_cases::case_[0-9]+_loads_aws_batch_role_arn$/)'
      && grep -lq 'AWS_BATCH_ROLE_ARN' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_batch_create*
  - id: config-bedrock-tags
    why: The bedrock_tags setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_batch_create_config_cases::case_[0-9]+_loads_bedrock_tags$/)'
      && grep -lq 'bedrock_tags' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_batch_create*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_batch_create_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_batch_create*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_batch_create_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_batch_create_secret_safe_failure$/)'
  - id: case-generated-job-name
    why: CommonBatchFilesUtils.generate_unique_job_name ignores model and emits {prefix}-batch-{str(uuid4)[:8]},
      default prefix litellm. Do not include model or enforce the docstring claim of 63 characters. Inject UUID
      and preserve caller prefix verbatim. Creation sets modelId to the supplied model without stripping provider
      prefixes.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_generated_job_name$/)'
  - id: case-owner-and-kms
    why: Resolve owner/KMS via B643. Omit s3BucketOwner only for None; empty string is included when directly testing
      the builders. Include s3EncryptionKeyId only on output config and only when not None. Input never gets encryption
      metadata. Validate_environment returns caller headers unchanged.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_owner_and_kms$/)'
  - id: case-create-signed-request
    why: Merge credentials B596, resolve region B591, and use B198 partition DNS in https://bedrock.{region}.{suffix}/model-invocation-job,
      ignoring supplied api_base/api_key. Sign POST through B595 CommonBatchFilesUtils.sign_aws_request service
      bedrock. Return method POST,url,headers and signed bytes decoded UTF-8; no S3 credentials, bearer shortcut
      or clientRequestToken field is added.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_create_signed_request$/)'
  - id: case-create-reply-defaults
    why: jobArn defaults empty; object batch; original_batch_request defaults {} and provides endpoint default /v1/chat/completions,input_file_id
      default empty,completion_window default 24h,metadata default {}. Explicit supplied values follow source .get/Pydantic
      behavior. created_at is current integer clock; in_progress_at is a separately sampled clock only for exact
      InProgress, not Scheduled. errors,output_file_id,error_file_id,expires_at,finalizing_at,completed_at,failed_at,expired_at,cancelling_at,cancelled_at,request_counts
      are None regardless of status. Constructor uses B2214 base no-op and B643 CommonBatchFilesUtils/BaseAWS state;
      custom_llm_provider is bedrock.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_create_reply_defaults$/)'
  - id: case-titan-batch-token-usage
    why: Return None unless embedding OR embeddingsByType key is present (even null), and inputTextTokenCount is
      an int but not bool. Negative integers remain allowed. Return Usage prompt_tokens=total_tokens=count,completion_tokens=0;
      absence/wrong type yields None. API B1039 calls this helper; it does not belong to B650 status projection.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_titan_batch_token_usage$/)'
  - id: config-environment-aws-batch-role-arn
    why: AWS_BATCH_ROLE_ARN lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::batch_create_environment_config_cases::case_[0-9]+_loads_aws_batch_role_arn$/)'
  - id: case-input-24h-window
    why: Only exact truthy completion_window=24h adds timeoutDurationInHours=24. Missing, empty, 48h and other values
      are ignored without warning or rejection.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_create_cases::case_[0-9]+_input_24h_window$/)'
