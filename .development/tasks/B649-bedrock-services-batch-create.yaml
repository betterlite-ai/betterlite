pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_batch_create in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_batch_create.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_batch_create.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The job-name docstring says it includes the model and fits 63 characters, but the body does neither.
- This creation function parses the S3 URI without invoking the stricter download authorization helper; apply authorization
  at its actual API owner.
