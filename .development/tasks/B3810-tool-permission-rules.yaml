deviations:
  - what: "When duplicate rule IDs appear, both stay in the ordered rule list but the last one wins in the compiled_targets and compiled_patterns lookups."
    why: "Matches LiteLLM's behavior exactly. The no-silent-drops rule requires this to be explicit, not a hidden overwrite."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/tool_permission.py#L125-L153
  - what: "Regex dialect compatibility is not resolved; fullmatch is LiteLLM's specified behavior. Unsupported features will be discovered at pattern compile time"
    why: "Python regex and Rust regex differ on backreferences, lookarounds and other features. Users porting patterns from LiteLLM may need to adjust"
out_of_scope:
  - Decision evaluation and enforcement logic; B3811 checks permissions against tool calls, B3812 evaluates requests, B3813 filters responses.
  - CustomGuardrail.__init__ base class and its dependencies, owned by B3664.
  - The log_guardrail_information and add_guardrail_to_applied_guardrails_header functions; owned by other tasks.
  - The update_in_memory_litellm_params method (lines 162-207), which has no caller at the pinned commit.
pitfalls:
  - "Rule compilation must fail atomically: on any regex error, leave prior maps intact so a partial update doesn't corrupt the live ruleset"
  - "_matches_regex returns true for None pattern (wildcard match) and false for None value (no string matches a pattern)"
  - "Whitespace-to-None normalization applies only to tool_name and tool_type patterns, not to rule IDs, decisions or parameter paths"
  - "Duplicate rule IDs overwrite compiled lookup but both rules stay in the ordered list; this is the last-wins-by-ID behavior built to match LiteLLM"
  - allowed_param_patterns is a dict that may be None or empty; both compile to no parameter constraints.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
