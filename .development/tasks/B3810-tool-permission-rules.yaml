id: B3810
title: Compile tool permission rules and expose validated configuration
description: >-
  Port tool permission guardrail compilation to betterlite. Build typed permission rules, default actions, and compiled pattern lookups so both pre-call and post-call enforcement paths use identical matching semantics. The ToolPermissionGuardrail class inherits from CustomGuardrail and loads rules from config at init time.

  Implement core helpers: _object_mapping and _object_list cast to dict/list without panic, _rule_from_fields validates a dict into ToolPermissionRule, _load_rules parses and compiles all regex patterns, atomically swapping compiled maps only after every pattern compiles. _matches_regex tests a compiled pattern against a string (None pattern always matches). _rule_matches_tool returns whether a rule matches and whether parameter checks apply. _get_mapping_value reads dict keys or object attributes, returning None on miss.

  Keep default_action as "deny", on_disallowed_action as "block", whitespace-to-None targets and lowercase normalization. Regex compilation uses fullmatch, not search. When duplicate rule IDs appear, both rules stay in the ordered list but the last one wins in the compiled lookup maps; this matches LiteLLM's behavior. Every regex error raises ValueError with the rule ID before any state changes.

  Expose get_config_model and get_supported_event_hooks for the proxy to read the configuration shape and [pre_call, post_call] hook list. The config model ui_friendly_name returns "LiteLLM Tool Permission Guardrail". Normalize default_action and on_disallowed_action to lowercase at init. Log debug message with rule count and default action once at initialization.

  Own all imports, module-level constants (GUARDRAIL_NAME), class/field declarations and the _ToolPermissionRuleFields shape. This task compiles rules; B3811 and B3812 evaluate them against requests, B3813 enforces them in responses.
