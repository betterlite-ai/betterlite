dod:
  - text: ToolPermissionRule requires at least tool_name or tool_type; whitespace-only fields normalize to None; decision and action fields normalize to lowercase.
    proof: [rule-validation]
  - text: _load_rules compiles all regex patterns and builds lookup maps only after every pattern compiles; invalid regex raises ValueError with rule ID and pattern; prior state untouched on error.
    proof: [rule-validation]
  - text: _matches_regex returns true when pattern is None, false when value is None, and uses fullmatch (not search) when both are present.
    proof: [rule-matching]
  - text: _rule_matches_tool returns overall match and whether parameter checks apply based on name pattern presence and match.
    proof: [rule-matching]
  - text: get_config_model returns the configuration model class; get_supported_event_hooks returns [pre_call, post_call].
    proof: [interface-tests]
  - text: Every guarded code path (regex compile, rule match, field access, value cast) has behavior tests covering success and error outcomes.
    proof: [behavior-tests]
  - text: ToolPermissionGuardrail.__init__ logs debug message once with rule count and default_action.
    proof: [behavior-tests]
