checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_credentials::/) - test(/::replays_corpus$/)'
  - id: case-model-hint-authorized
    why: the model-hint-authorized behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_credentials::tests::model_hint_authorized($|::)/)'
  - id: case-model-hint-denied
    why: the model-hint-denied behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_credentials::tests::model_hint_denied($|::)/)'
  - id: case-team-provider-credentials
    why: the team-provider-credentials behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_credentials::tests::team_provider_credentials($|::)/)'
  - id: case-credential-precedence
    why: the credential-precedence behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_credentials::tests::credential_precedence($|::)/)'
  - id: case-deployment-model-info
    why: the deployment-model-info behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_credentials::tests::deployment_model_info($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_credentials.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_credentials-*)"
      && grep -qE "^[[:space:]]+file_credentials:" tools/oracle/fuzz/corpus/helper_case/file_credentials-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-credentials)"
