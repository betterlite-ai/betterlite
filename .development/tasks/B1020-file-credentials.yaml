id: B1020
title: File credentials
description: >-
  Resolve and authorize model/deployment/team credentials for file operations using B052/B061 and B302 catalog resolution,
  B303 prepared credentials and B396 pass-through selection. Carry SecretString credentials and immutable model_info
  into prepared requests, with explicit precedence for team versus operator credentials and no request-controlled
  destination.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-core/src/api/file_credentials.rs. Use FileCredentialsInput and FileCredentialsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): common_utils.py:379 status_code=500, exception_detail=FastAPI detail object. Compare the
  actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions model_hint_authorized, model_hint_denied, team_provider_credentials,
  credential_precedence, deployment_model_info under api::file_credentials::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileCredentials in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_credentials: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/openai_files_endpoints/common_utils.py: extract_model_from_sources (L317-L348);
  litellm/proxy/openai_files_endpoints/common_utils.py: get_credentials_for_model (L351-L391); litellm/proxy/openai_files_endpoints/common_utils.py:
  authorize_model_for_key (L394-L418); litellm/proxy/openai_files_endpoints/common_utils.py: get_authorized_credentials_for_model
  (L421-L433); litellm/proxy/openai_files_endpoints/common_utils.py: get_team_provider_credentials (L436-L553);
  litellm/proxy/openai_files_endpoints/common_utils.py: apply_team_provider_credentials (L556-L575); litellm/proxy/openai_files_endpoints/common_utils.py:
  add_internal_model_credentials (L578-L600); litellm/proxy/openai_files_endpoints/common_utils.py: add_deployment_model_info
  (L603-L619); litellm/proxy/openai_files_endpoints/common_utils.py: prepare_data_with_credentials (L622-L644);
  litellm/proxy/openai_files_endpoints/common_utils.py: handle_model_based_routing (L647-L709). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 213 owned nonblank/non-comment/non-docstring Python lines (322 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 233 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 483 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B061 (Stored credentials and their encryption), B171 (Direct helper oracle and URL path
  encoding), B302 (Deployment catalog, aliases and wildcard routes), B303 (Deployment client reuse and parallel
  request guards), B396 (Pass-through deployment selection), B1019 (File routing ids), B1087 (Api boundaries), B732
  (Typed authentication principals and grant resolution), B855 (Authenticated request admission and budget handoff),
  B756 (Authentication header selection and mode dispatch). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
