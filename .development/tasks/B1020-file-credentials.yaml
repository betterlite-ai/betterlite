id: B1020
title: File credential selection and model authorization
description: >-
  Port every complete function in common_utils.py L317-L709 to api::file_credentials. Use typed
  request hints, B732 principals and injected catalog/grant ports; keep secrets in SecretString and
  trusted credential snapshots distinct from caller data. B1019 decodes routing ids, B886 authorizes
  resolved models, B303 supplies credential deployments, B844 lists model names, B847 lists access
  groups, B759 expands key/team grants and B004 supplies ProxyModelNotFoundError. Neither B061's
  credential persistence nor B396's deployment scheduler is called here.

  extract_model_from_sources returns the decoded-id model and, separately, body.model or query.model
  or x-litellm-model, in that actual order despite its docstring. handle_model_based_routing prefers
  an embedded model unless check_file_id_encoding=false, authorizes before credentials, and returns
  the original provider id only on the embedded-model branch. No model returns false/null/null/null.
  No environment or config values are read; the caller handles credential fallback.

  Keep get_team_provider_credentials as one whole function including _key_may_use and
  _provider_credentials. Its ordered catalog search prefers team BYOK rows, then expanded visible
  models, and excludes credentials' model field from the returned provider-only data. Call catalog
  ports with team_id where the source does. This module does no provider HTTP or database lookup of
  its own. B171 cases exercise pure hint/merge policy and static catalog snapshots; native tests
  exercise authorization order with an injected grant port, and consuming routes test real auth.

  Write the named tests under api::file_credentials::tests. Register file_credentials for pure
  adapters only. This range has 322 nonblank, non-comment physical lines; budget 245 implementation,
  175 native tests, 100 helper cases, 85 adapters and 35 wiring lines, 640 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_credentials.rs
  - crates/betterlite-core/src/api/file_credentials/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/file_credentials.rs
  - tools/oracle/src/helpers/core_ops/file_credentials/**
  - tools/oracle/helpers/file_credentials.py
  - tools/oracle/helpers/file_credentials/**
  - tools/oracle/fuzz/corpus/helper_case/file_credentials-*
  - tools/oracle/cases/helpers/file-credentials/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L317-L709
  why: Owns hint selection, authorized lookup, team BYOK search, credential merging and routing orchestration.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L151-L160
  why: B004's missing-model error is HTTP 400 with detail.error and a false read-through retry flag here.
dod:
- text: >-
    model_hint_precedence supplies embedded model=id, body=model_body, query=model_query and
    header=model_header. Extraction yields (id,model_body); empty body falls to query and empty
    query to header, while an empty final header remains "". Routing returns id and the decoded
    provider file; check_file_id_encoding=false chooses model_body and original_id=null.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    authorize_before_lookup records grant(model=m,llm_model_list=null,principal,router) before
    lookup(m). A denied grant preserves its original ProxyException status/type/param/code and
    makes zero credential calls. Missing router after successful authorization gives HTTPException
    500 detail.error="Router not initialized. Cannot use model-based routing." Missing m gives
    HTTPException 400 detail.error="file operation: Invalid model name passed in model=m. Call
    `/v1/models` to view available models for your key.", retryable_with_model_read_through=false.
    Embedded-id context instead starts "file operation (file created with model):".
  proof: [behavior-tests]
- text: >-
    team_credential_search seeds ordered team t deployments with ids d1,d2, public names a,b and
    different api_key markers. Matching team BYOK/provider=openai wins before global credentials;
    a restricted key models=[b] skips d1. team_public_model_name wins over model_name when checking
    access. Rows with another team, missing id or a different custom_llm_provider are skipped.
    Return excludes model but retains api_key/api_base and other provider credentials.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    provider_grant_fallback supplies no matching BYOK row: expanded key models are tried first in
    deduplicated order, otherwise team models. all-proxy-models in team models becomes an empty
    team allowlist over the team-scoped catalog; a key containing all-proxy-models or all-team-models
    does not narrow that team list. Plain restricted keys expand access groups and wildcards through
    B759. An empty expanded key set follows the source's unrestrained _key_may_use predicate.
    Missing router/no matching provider yields null, and apply_team_provider_credentials leaves
    data untouched so the caller can use its existing fallback.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    credential_merge_and_snapshot merges credentials {api_key: server, model: resolved,
    custom_llm_provider: openai} over caller api_key=caller, removes custom_llm_provider and leaves
    file_id untouched when file_id=null. Explicit file_id="" writes an empty id. With
    include_internal_credentials=true, _litellm_internal_model_credentials retains a separate
    immutable snapshot including custom_llm_provider; later mutation of input credentials cannot
    change it. The false default does not overwrite an existing snapshot field.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    deployment_accounting_hints puts the complete resolved model_info under litellm_metadata.model_info,
    replacing that subfield while retaining other metadata. Missing deployment/router leaves data
    unchanged. add_internal_model_credentials with model_id=null, missing credentials or a thrown
    lookup error leaves data unchanged and emits no warning; successful lookup installs the snapshot.
  proof: [behavior-tests, oracle, helper-python]
- text: Pure policy comparisons have added seeds and strict independent adapters.
  proof: [helper-corpus, new-cases, helper-python, oracle]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: credential precedence or grant-before-lookup is not tested
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_credentials::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: credential policy adapter is missing or invalid
    run: test -f tools/oracle/helpers/file_credentials.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: credential policy lacks a new typed helper seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_credentials-*)" && grep -qE '^[[:space:]]+file_credentials:' tools/oracle/fuzz/corpus/helper_case/file_credentials-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no credential selection comparisons were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-credentials)"
oracle_cases:
- tools/oracle/cases/helpers/file-credentials/model-hint-precedence.yaml
- tools/oracle/cases/helpers/file-credentials/team-credential-search.yaml
- tools/oracle/cases/helpers/file-credentials/provider-grant-fallback.yaml
- tools/oracle/cases/helpers/file-credentials/credential-merge-and-snapshot.yaml
- tools/oracle/cases/helpers/file-credentials/deployment-accounting-hints.yaml
deviations: []
out_of_scope:
- B1019 owns common_utils.py's limit/legacy/routing-id functions through L309; validate_file_list_purpose has no caller at the pin.
- B1021 owns creation/managed-requirement helpers L889-L1130; the MIME inference/normalization functions and is_gemini_supported_mime_type/get_content_type_from_file_object have no live caller at the pin.
- B1041 owns the batch-response and database helpers L1138-L1549; map_raw_file_ids_to_unified and apply_unified_file_ids have no caller at the pin.
- B886 owns the exact key/team/project grant errors, B303 credential resolution, B844/B847 catalog projections and B759 model-list expansion; these algorithms are not reimplemented here.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_credentials in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_credentials.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_credentials.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The extraction docstring advertises header precedence, but executable code gives body then query then header.
- Provider-only selection removes model from credentials; the common merge then removes custom_llm_provider too.
- Failure to resolve an accounting snapshot is deliberately ignored so an old batch remains retrievable.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
