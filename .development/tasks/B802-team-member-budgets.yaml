id: B802
title: Default team member budgets and bulk budget updates
description: >-
  Implement TeamMemberBudgets with distinct team-default and bulk-member write paths. Strip only
  team_member_budget_id from caller metadata dictionaries; non-dicts are untouched. should_create_budget
  returns true if ANY of budget/rpm/tpm/duration is nonnull, including zero or empty duration. Generated
  IDs are team-<alias with spaces replaced by hyphens>-budget-<uuid hex>, or team-budget-<uuid hex>
  when alias is None (an empty alias still takes the first branch). Create through B829.new_budget,
  then put its returned ID in metadata and remove the four team_member_* input fields. Omitted
  member duration inherits the team's truthy duration; explicit null means no reset, and a nonnull
  member duration overrides either. Preserve the other metadata fields.

  Upsert first normalizes a null existing metadata map to {}. Any string team_member_budget_id,
  including empty, selects B829.update_budget; a missing/non-string ID selects create. For updates,
  pass each field when nonnull OR explicitly present, retaining null clears. Explicit null duration
  also clears budget_reset_at. Log the successful update, then merge the returned budget ID into
  updated metadata and strip input-only fields. clear_team_member_budget_fields updates only a
  string existing ID, clearing just the named fields; no default ID means no write. It strips the
  four inputs regardless. These helpers call real budget-route services, whose errors/effects belong
  to B829; they do not wrap the team's eventual write in a new transaction.

  Backfill skips an empty roster. Read all team memberships once; create missing nonnull member IDs
  from either Member or raw dict with skip_duplicates=true, then update EVERY existing null budget_id
  in that team, including memberships absent from the supplied roster. Existing nonnull IDs remain
  unchanged even when they point at an older default. Log creation and healing counts separately with
  CR/LF-sanitized team/budget IDs via B801. A failure healing nulls leaves the earlier inserts in place.

  Bulk updates read TeamRepository through B714.WriterPinnedClient BEFORE the 60-second transaction;
  no advisory/roster lock is acquired. Missing team and forbidden caller use B1202's ManagementProblem
  team-not-found 404 and forbidden 403, respectively. B800 allows proxy/team/org admins. Resolve an
  explicit user_id against the roster first; otherwise match email exactly and take the first ID.
  Reject later repeated request identities (B1202) and later identities resolving to the same user.
  If nothing applies, return original-order failures with Duplicate member in request or User not
  found in team and do not transact, invalidate or audit.

  In the transaction, read selected memberships including budgets, detect shared budget IDs across
  ALL teams, then apply patches in request order via B862.member_budget_patch/_upsert_budget_and_membership.
  That dependency clones shared/default rows; do not mutate them here. Reread written memberships
  and the string-valued default budget ID before commit. After commit, invalidate member spend state
  via B734 for sorted user IDs, then await B065.create_object_audit_log (TEAM_TABLE_NAME, updated,
  supplied changed-by header). Cache/audit failure cannot roll back the budget writes. Audit JSON
  nests team_member_budgets, sorts by user_id, drops null fields, preserves allowed_models order and
  includes user_id/budget_id/max_budget/tpm_limit/rpm_limit/budget_duration/budget_reset_at/allowed_models.
  Missing expanded budget records still retain the membership's nonnull budget_id in audits.

  Return one result per original input. Failed entries echo requested ID/email with success=false.
  Successful entries use resolved ID and requested email; return own budget ID/rates/duration/models.
  max_budget inherits only when own max_budget is None and team default is strictly positive, with
  source team_default; otherwise a nonnull own amount (including zero) has source member, else None.
  Inheritance of max_budget does not replace the other per-member limit fields.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  TeamMemberBudgetHandler.strip_system_managed_metadata_keys (L516-L521; 6 source lines), TeamMemberBudgetHandler.should_create_budget
  (L524-L538; 15 source lines), TeamMemberBudgetHandler.create_team_member_budget_table (L541-L598; 47
  source lines), TeamMemberBudgetHandler.upsert_team_member_budget_table (L601-L669; 60 source lines),
  TeamMemberBudgetHandler._clean_team_member_fields (L672-L677; 6 source lines), TeamMemberBudgetHandler.clear_team_member_budget_fields
  (L680-L713; 31 source lines), TeamMemberBudgetHandler.backfill_team_member_budget_entries (L716-L780;
  53 source lines). litellm/proxy/management_helpers/bulk_team_member_budgets.py: _membership_tx_db (L60-L61;
  2 source lines), _budget_tx_db (L64-L65; 2 source lines), _roster_user_id (L68-L72; 5 source lines),
  _team_default_budget_id (L75-L77; 3 source lines), _shared_budget_ids (L80-L86; 7 source lines), _audited_member_budget
  (L112-L125; 14 source lines), _limits_audit_value (L128-L134; 7 source lines), _result (L137-L165; 29
  source lines), bulk_update_team_member_budgets (L168-L258; 84 source lines).


  The team_member_budgets helper operation under B856 Management::teams compares only the pure strip,
  presence, roster, result and audit projections. Exercise create/upsert/clear/backfill and bulk
  transactions in native Postgres tests, because B829's handlers read proxy globals. Later management
  routes own their HTTP cases; no handler is invoked through this pure oracle adapter.


  Run member-budget row and transaction-failure cases on B860 schemas from POSTGRES_TEST_URL;
  testcontainers supplies Postgres only if that variable is absent. Unavailable databases fail the tests.


  Sizing: 371 nonblank, noncomment function lines include extensive docstrings; budget 335 production,
  350 tests, 75 pure adapters and 30 wiring lines, 790 within an 800-line gate.
