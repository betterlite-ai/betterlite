dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: default_budget_create,
      member_override, clear_member_cap, backfill_roster, shared_budget_preserved, bulk_invalid_member,
      rollback, postgres_pinned_rows, postgres_failure_effects, strip_only_server_key,
      zero_limit_present, alias_budget_id, empty_alias_budget_id, member_duration_inheritance,
      explicit_null_duration, explicit_limit_null, bad_default_id_creates, empty_id_updates,
      clear_without_default, input_fields_removed, empty_roster_no_read, backfill_raw_member,
      duplicate_insert_skipped, heal_nonroster_nulls, old_default_preserved, sanitized_backfill_log,
      writer_roster_before_tx, team_missing_problem, scope_forbidden_problem, id_before_email,
      duplicate_resolved_user, all_invalid_no_effects, cross_team_shared_budget, sorted_evictions,
      audit_after_eviction, audit_null_projection, result_order, positive_default_inheritance,
      zero_member_cap and inheritance_keeps_rates.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_member_budgets::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/team_member_budgets.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/team-member-budgets-*")"
        && grep -rlq "team_member_budgets" tools/oracle/fuzz/corpus/helper_case/team-member-budgets-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_member_budgets::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_member_budgets::tests::postgres_failure_effects$/)'
