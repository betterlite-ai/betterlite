deviations: []
out_of_scope:
  - "The route logic: B3622, B3623, B3624 and B3629. The adapters: B8641. The shared state and the socket port: B8640."
pitfalls:
  - "The hyphen alias `/vertex-ai/{*endpoint}` is a separate registration; leaving it out answers the fallback's 404."
  - "B3629's Live route and B3623's HTTP route must read the same token state, since LiteLLM caches Vertex tokens at module level for the Live path."
  - "PassthroughLookup is optional in VertexRouteDeps; pass it even when no router is configured, since it answers no deployment then."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
