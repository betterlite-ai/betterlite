id: B4170
title: Safe bug report records and issue links
description: >-
  Add crates/betterlite-reporting with typed bug report records and safe issue-link formatting.
  The module builds issue links by composing stack frames, exception type, environment metadata and optional config lines, preserving request/error text omission and URL-length bounds.
  Two public records, EnvironmentReport and BugReport, hold immutable typed data; helper functions format them into GitHub issue URLs.
  build_environment_report captures the surface (sdk or proxy), LiteLLM version, Python version, optional deployment type and optional config lines.
  build_bug_report captures an exception, surface, call type, provider and stream flag, extracting exception frames and filtering to litellm package paths only.
  bug_report_enabled reads the LITELLM_DISABLE_BUG_REPORT_LINK environment variable (case-insensitive true disables); should_report_bug checks that reporting is enabled and the exception has no status_code field (a sign of an HTTP error already reported).
  bug_report_issue_url formats a report into a bounded GitHub issue URL by iterating candidates in two phases: first holding frames full and shrinking config lines from all down to empty, then holding config empty and shrinking frames from all-but-first down to empty, returning the first that fits under 6,000 characters.
  strip_bug_report_notice and bug_report_notice add and remove the safe-report prefix from error messages.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-reporting/**
  lint_tables: false
