id: B10210
title: LiteLLM's dashboard team id and proxy budget user are defined once, in special_proxy_strings
description: >-
  LiteLLM keeps two more proxy strings that betterlite copies. UI_TEAM_ID, "litellm-dashboard", is the team every dashboard session key is minted under, and auth answers TeamNotFoundError for it instead of reading a team row (_types.py L5140; constants.py L1725 holds the same value as UI_SESSION_TOKEN_TEAM_ID). LITELLM_PROXY_BUDGET_NAME, "litellm-proxy-budget", is the user row that carries a proxy-wide max_budget and is charged with every spend (constants.py L1739). On main 109d4e3cf8c betterlite writes the first value in five production consts under two names, and betterlite-mcp's principal.rs gives it a third; it writes the second in three consts. B753, running now, adds a fourth spelling of the second as a literal in betterlite-auth's auth_model_budgets/rows.rs. B10207 makes crates/betterlite-error/src/proxy_enums/special_proxy_strings.rs the home of LiteLLM's proxy identity strings and adds an ast-grep rule against new copies; this task starts once B10207 has merged and moves these two values there too.


  The home. special_proxy_strings.rs gains `pub const UI_TEAM_ID: &str = "litellm-dashboard";` and `pub const LITELLM_PROXY_BUDGET_NAME: &str = "litellm-proxy-budget";` after B10207's two consts. UI_TEAM_ID is the only name betterlite keeps for the dashboard team, so every UI_SESSION_TOKEN_TEAM_ID goes. proxy_enums/tests.rs gains `ui_team_and_proxy_budget_keep_litellms_values`, which compares each new const with LiteLLM's literal text. .ast-grep/rules/no-proxy-identity-literals.yml widens its regex to `^(default_user_id|litellm_proxy_master_key|litellm-dashboard|litellm-proxy-budget)$`, and its message names all four consts and their module.


  The dashboard team. In betterlite-auth, agent_permission_handler/get_allowed_agents_for_team.rs drops UI_TEAM_ID and its comment (L20-L21), auth_policy_support/team.rs drops its pub UI_TEAM_ID (L13) and session_token_codec/builders.rs drops its UI_TEAM_ID (L22); all three import the home's const and keep their uses (L44, L105, L152). ui_session_identity.rs drops UI_SESSION_TOKEN_TEAM_ID and its comment (L11-L12) and compares team_id with UI_TEAM_ID (L28). betterlite-server's key_query_plan/filters.rs drops its pub UI_SESSION_TOKEN_TEAM_ID and its comment (L7-L8) and pushes UI_TEAM_ID (L117), and search_tool_routes/list.rs imports the home instead of filters (L20) and compares with UI_TEAM_ID (L171). betterlite-mcp adds `betterlite-error = { path = "../betterlite-error" }` to [dependencies] in name order. Its server_grants.rs (L4, L141), server_grants/team.rs (L1, L11) and server_grants/user.rs (L1, L8) import UI_TEAM_ID where they import betterlite_auth's UI_SESSION_TOKEN_TEAM_ID, and auth/object_permission_hydration/principal.rs drops the alias `const UI_TEAM_ID: &str = UI_SESSION_TOKEN_TEAM_ID;` (L11) and imports the home's UI_TEAM_ID in place of L4. B3884, running now, reads UI_SESSION_TOKEN_TEAM_ID for its exclude_team_id in betterlite-server's prometheus_budget_refresh; whatever it imports or spells there moves onto UI_TEAM_ID too.


  The proxy budget user. betterlite-db's identity_budget_reset/global_proxy.rs drops PROXY_BUDGET_USER_ID and its comment (L6-L7) and compares with LITELLM_PROXY_BUDGET_NAME (L14). spend_writer/settings.rs drops DEFAULT_PROXY_BUDGET_NAME and its comment (L3-L4) and fills its default from the home (L22), and betterlite-server's spend/runtime.rs imports the home instead (L29, L81). betterlite-auth's auth_model_budgets/rows.rs reads the budget row by LITELLM_PROXY_BUDGET_NAME where B753 writes the literal, as user_api_key_auth.py L748 reads it by the constant. The betterlite crate adds betterlite-error to [dependencies] in name order, and startup_checks/proxy_budget.rs drops its pub const and comment (L13-L14) and passes the home's const at L70 and L84. betterlite-db reaches betterlite-error through the edge B10207 adds, and betterlite-error still depends only on betterlite-redact, so the two new edges, betterlite-mcp and betterlite to betterlite-error, make no cycle.


  Tests keep the literal values where they spell them, as in B10207, since they assert what LiteLLM stores. A test that imports a moved name changes its import, and for UI_SESSION_TOKEN_TEAM_ID its name too: auth's auth_policy_support/tests.rs (L23), ui_session_identity/tests.rs (L17) and session_auth/tests.rs (L25), core's api/managed_store_access/tests.rs (L21) and api/vector_store_access/tests.rs (L16), server's api/vector_management_boundaries/tests.rs (L19), db's identity_budget_reset/global_proxy/tests.rs (L5) and the betterlite crate's startup_checks/tests.rs (L47).


  What users see: nothing. The same team id marks dashboard session keys, and the same user row carries the proxy budget.
