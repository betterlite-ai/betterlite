    why: UI_TEAM_ID "litellm-dashboard", the name the home keeps.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1725
    why: UI_SESSION_TOKEN_TEAM_ID, LiteLLM's second name for the same value, which betterlite drops.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1739
    why: LITELLM_PROXY_BUDGET_NAME "litellm-proxy-budget".
