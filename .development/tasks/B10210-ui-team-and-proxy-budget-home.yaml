    why: startup seeds the proxy budget user under LITELLM_PROXY_BUDGET_NAME, which startup_checks/proxy_budget.rs ports.
dod:
  - text: special_proxy_strings holds UI_TEAM_ID and LITELLM_PROXY_BUDGET_NAME with LiteLLM's values, and a test pins both.
    proof: [home-values]
  - text: No production Rust file outside the home spells either value, UI_SESSION_TOKEN_TEAM_ID, PROXY_BUDGET_USER_ID, DEFAULT_PROXY_BUDGET_NAME and principal.rs's alias are gone, and only the home defines UI_TEAM_ID and LITELLM_PROXY_BUDGET_NAME.
    proof: [no-copies]
  - text: Dashboard session keys are still recognized by auth's team lookup, agent grants, session minting and UI session identity, core's store access, server's key and search tool lists, and MCP's server grants and permission hydration.
    proof: [no-copies, auth-tests, server-tests, mcp-tests]
  - text: The proxy budget still lives on the litellm-proxy-budget user at startup, in the spend writer's default and in the global budget reset.
    proof: [no-copies, budget-tests]
  - text: The ast-grep rule refuses both new values as whole string literals in production Rust outside the home.
    proof: [proxy-literal-rule]
checks:
  optional: []
  commands:
    - id: no-copies
      why: a production file still spells one of the two values, an old name is left, or a crate defines its own UI_TEAM_ID or LITELLM_PROXY_BUDGET_NAME
      run: test -z "$(grep -rnE --include='*.rs' --exclude=tests.rs --exclude-dir=tests '"(litellm-dashboard|litellm-proxy-budget)"' crates | grep -v '^crates/betterlite-error/src/proxy_enums/special_proxy_strings.rs:')" && test -z "$(grep -rnwE --include='*.rs' 'UI_SESSION_TOKEN_TEAM_ID|PROXY_BUDGET_USER_ID|DEFAULT_PROXY_BUDGET_NAME' crates)" && test -z "$(grep -rnE --include='*.rs' 'const (UI_TEAM_ID|LITELLM_PROXY_BUDGET_NAME)\b' crates | grep -v '^crates/betterlite-error/src/proxy_enums/special_proxy_strings.rs:')"
    - id: proxy-literal-rule
      why: the rule does not name the two new values, or production Rust outside the home still spells one of the four
      run: grep -q 'litellm-dashboard' .ast-grep/rules/no-proxy-identity-literals.yml && grep -q 'litellm-proxy-budget' .ast-grep/rules/no-proxy-identity-literals.yml && ast-grep scan --rule .ast-grep/rules/no-proxy-identity-literals.yml crates
    - id: home-values
      why: a new const is missing or no longer holds LiteLLM's text
      run: cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^proxy_enums::tests::ui_team_and_proxy_budget_keep_litellms_values$/)'
    - id: auth-tests
      why: auth or core no longer treats litellm-dashboard as the dashboard team
      run: grep -q special_proxy_strings crates/betterlite-auth/src/ui_session_identity.rs && grep -q special_proxy_strings crates/betterlite-auth/src/auth_policy_support/team.rs && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^(agent_permission_handler|auth_policy_support|session_token_codec|ui_session_identity|session_auth|auth_model_budgets)::/) - test(/replays_the_/)' && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(managed_store_access|vector_store_access)::/)'
    - id: server-tests
      why: the key list, the search tool list, the spend runtime or the budget refresh lost the dashboard team or the budget user
      run: grep -q special_proxy_strings crates/betterlite-server/src/key_query_plan/filters.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^(key_query_plan|search_tool_routes|api::vector_management_boundaries|spend::runtime|prometheus_budget_refresh)::/) - test(/replays_the_/)'
    - id: mcp-tests
      why: MCP server grants or permission hydration stopped skipping the dashboard team
      run: grep -q special_proxy_strings crates/betterlite-mcp/src/server_grants.rs && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^(server_grants|auth::object_permission_hydration)::/)'
    - id: budget-tests
      why: startup, the spend writer or the global reset no longer uses the litellm-proxy-budget user
      run: grep -q special_proxy_strings crates/betterlite-db/src/spend_writer/settings.rs && grep -q special_proxy_strings crates/betterlite/src/startup_checks/proxy_budget.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^(identity_budget_reset|spend_writer)::/)' && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^startup_checks::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "\"litellm-dashboard\" in tools/dashboard and in oracle case YAML: there it names LiteLLM's UI package or is case data, not a Rust copy, and the rule scans only Rust under crates."
  - "Other LiteLLM constants copied the same way: ALL_PROXY_MODELS \"all-proxy-models\" (betterlite-auth auth_model_patterns.rs L13, betterlite-server lens_access/model.rs L10, a literal in betterlite-router model_group_usage/access_filter.rs L83) and NO_MCP_SERVERS \"no-mcp-servers\" (betterlite-mcp server_grants.rs L27, betterlite-server mcp_permission_ids/cleanup.rs L6)."
pitfalls:
  - "UI_SESSION_TOKEN_TEAM_ID is LiteLLM's second name for \"litellm-dashboard\"; rename every use to UI_TEAM_ID, tests included, since no-copies refuses the old name as a whole word anywhere in crates."
  - "principal.rs's `const UI_TEAM_ID: &str = UI_SESSION_TOKEN_TEAM_ID;` is a copy under a new name; delete it and import the home's const, or the `const UI_TEAM_ID` grep fails."
  - "global_proxy.rs's PROXY_BUDGET_USER_ID was pub(crate) and its test compares it with the literal (global_proxy/tests.rs L16); keep that assertion on the home's const so the literal stays in the test."
  - "betterlite-mcp and the betterlite crate gain betterlite-error under [dependencies] only; betterlite-error must gain no betterlite crate but betterlite-redact."
review_level: standard
budget:
  max_changed_lines: 200
  max_new_expects: 0
