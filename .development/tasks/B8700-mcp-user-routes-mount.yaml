deviations: []
out_of_scope:
  - "Route behavior: B4723 and B4724. Storage: B4713 and B4714."
  - "The other /v1/mcp routes: B8625, B8627, B8701 and B8702."
pitfalls:
  - The env var cache drop happens only after a successful write or delete; dropping it on a failed write changes what the next tool call sees.
  - Use the UserTokenCaches in McpState, not a new one, or the cache drop misses the store the tool calls read.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
