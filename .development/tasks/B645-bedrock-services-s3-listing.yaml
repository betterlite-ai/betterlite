    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_listing*")"
      && grep -lq 'bedrock_services_s3_listing' tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_listing*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_s3_listing$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_s3_listing)"
      && grep -q 'decode_s3_listing' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_s3_listing.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_s3_listing_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_s3_listing_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_s3_listing_secret_safe_failure$/)'
  - id: case-delete-response-context
    why: Only HTTP204 is deletion success. Other statuses raise B682 with original status when >=400, otherwise502;
      message is truthy response.text or S3 file deletion returned HTTP {status}, and headers are preserved. After204,
      validate logging_obj.model_call_details.additional_args as _S3DeleteContext with required nonempty string
      file_id, retaining validation errors; return FileDeleted id from that logging context,deleted=True,object=file.
      Do not infer the ID from response URL/body.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_listing_cases::case_[0-9]+_delete_response_context$/)'
  - id: case-s3-request-target
    why: Merge as {litellm_params, then optional_params}, so request keys win here; this differs from B644 upload's
      B596 deployment-authoritative merge. Validate as _BedrockS3RequestParams/AwsAuthParams with optional s3_region_name,s3_endpoint_url,s3_access_key_id,s3_secret_access_key
      default None. Choose truthy s3_region_name then aws_region_name, pass that preference to B591 _get_aws_region_name
      with model empty string, then truthy s3_endpoint_url or https://s3.{region}.{B198 DNS suffix}, stripping trailing
      slashes. Bucket authorization runs before this credential/endpoint selection on content/delete requests. Reuse
      B590/B644 config-loader cases.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_listing_cases::case_[0-9]+_s3_request_target$/)'
  - id: case-bodiless-s3-signature
    why: Resolve B594 S3 credentials from request_params.model_dump(exclude_none=True) and selected region. Create
      an AWS request with the supplied GET/DELETE method, URL and only initial x-amz-content-sha256 equal to SHA256
      of empty bytes, then S3SigV4Auth service=s3 using the region directly. Return an immutable snapshot of signed
      headers. Unlike the PUT signer, no Content-Type,Content-Language,Cache-Control,KMS/owner headers or non-LLM
      region rewrite is added. Missing Python boto3 message remains Missing boto3 to call bedrock. Run 'pip install
      boto3'.; reuse the compiled signing library.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_listing_cases::case_[0-9]+_bodiless_s3_signature$/)'
  - id: xml-hardening
    why: The documented bounded XML rejection is missing.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_listing_rejects_dtd_and_limits$/)'
