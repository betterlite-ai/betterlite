id: B645
title: Bedrock managed file listing and lifecycle
description: >-
  Implement native S3 ListObjectsV2 pagination, authorized content GET and DELETE plans, and deletion responses.
  Metadata retrieval is unsupported at this pin. Preserve input/output bucket walking, exact purpose filters and
  silent omission of unauthorized keys; use a bounded namespace-aware XML decoder with a named DTD-rejection deviation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  _managed_listing_prefix L294-L298; _listing_query L301-L305; _requested_listing_purpose L308-L310; _walked_listing_purpose
  L313-L315; _output_location_still_unlisted L318-L321; _listing_bucket_name L324-L332; _listed_object_created_at
  L335-L339; _listed_managed_file L342-L372; BedrockFilesConfig.transform_retrieve_file_request L1268-L1274; BedrockFilesConfig.transform_retrieve_file_response
  L1276-L1282; BedrockFilesConfig.transform_delete_file_request L1284-L1292; BedrockFilesConfig.transform_delete_file_response
  L1294-L1307; BedrockFilesConfig.transform_list_files_request L1309-L1317; BedrockFilesConfig.transform_list_files_next_request
  L1319-L1335; BedrockFilesConfig._signed_listing_request L1337-L1361; BedrockFilesConfig.transform_list_files_response
  L1363-L1391; BedrockFilesConfig.transform_file_content_request L1393-L1412; BedrockFilesConfig._transform_s3_file_request
  L1414-L1432; BedrockFilesConfig._s3_request_target L1434-L1457; BedrockFilesConfig._sign_s3_request_without_body
  L1459-L1488.


  Use quick-xml NsReader for namespace handling and reject DTD/external entity expansion; plain Reader does not
  resolve prefixes. Limit total response bytes through B173 and preserve continuation-token fields.


  Named case contracts: list_purpose_prefix: Use requested purpose from _s3_list_files_purpose only when a string,
  otherwise None; walked purpose from string _s3_list_files_location, otherwise requested purpose. Query for None/empty
  purpose uses common prefix litellm-, batch uses litellm-bedrock-files, and batch_output uses litellm-batch-outputs/,
  prepending configured prefix plus slash. Unknown truthy purpose uses only list-type=2,max-keys=0. Known/default
  prefix queries contain list-type=2,prefix={value}. The initial request writes both internal purpose/location keys,
  including None. input_output_bucket_walk: For batch_output choose truthy trusted s3_output_bucket_name, AWS_S3_OUTPUT_BUCKET_NAME,
  then B643 input bucket; other purposes use B643 input bucket directly. A second output location remains only when
  walked purpose is None and output/input configured bucket strings differ, including differing prefixes on the
  same bucket. After finishing the first location, set _s3_list_files_location=batch_output before signing its first
  page. Explicit empty-string purpose behaves differently from None: it uses the broad query but never walks output
  and filters every returned purpose out. pagination_continuation: Next-request returns None immediately for status>=400
  without parsing. Otherwise parse XML and use a truthy direct-child NextContinuationToken regardless of IsTruncated,
  keeping the walked purpose. If no token, switch to output only when still unlisted; otherwise None. Sign URL {endpoint}/{bucket}/
  plus ? and urlencode of ordered listing query then continuation-token, using quote with safe empty, so spaces
  are %20 rather than plus and slash is escaped. Return base URL and the unencoded query mapping separately; store
  signed headers under _s3_signed_request_headers for B644 validate_environment. namespace_xml_list: decode_s3_listing
  handles ElementTree wildcard-namespace behavior for direct-child Name,Contents,Key,Size,LastModified,NextContinuationToken:
  prefixed, default and absent namespaces all work, but nested Contents do not become top-level entries. Use truthy
  Name text as the listed bucket, otherwise the configured bucket without its prefix; do not override a foreign
  XML Name with the configured bucket. At status>=400 raise B682 preserving status,text,headers,response before
  parsing; lower statuses still parse, including empty204 bodies that fail XML parsing. unmanaged_key_filter: A
  missing/empty Key silently omits its entry. Build raw file_id=s3://{XML_or_config_bucket}/{raw_key}, then B2208
  authorize with configured bucket/prefix, the three managed prefixes and trusted legacy flag. Any authorization
  ValueError silently omits the entry, without a warning/debug diagnostic. Authorized entries retain the raw key
  and file_id rather than the validator's decoded return. Compute relative_key by raw configured-prefix length;
  purpose=batch_output only when it starts literal litellm-batch-outputs/, otherwise batch. Final filtering uses
  the originally requested purpose: None accepts both; every other string must exactly match. last_modified_and_size:
  For authorized entries use int(Size text or0), permitting source signed-integer syntax and preserving conversion
  failures. Missing/empty LastModified yields0; otherwise replace every Z by +00:00, parse fromisoformat and truncate
  timestamp to int. Pin the oracle timezone for naive ISO timestamps, preserving offset behavior and pre-epoch truncation.
  Invalid date/size errors propagate instead of silently omitting an authorized entry. filename is POSIX basename
  of raw key, object=file,status=uploaded; trailing slash can produce an empty filename. file_retrieve_delete: Both
  metadata retrieve request and response raise NotImplementedError BedrockFilesConfig does not support file retrieval.
  DELETE first uses B643 _resolve_managed_s3_object, then target selection, then B2208 key encoding and S3 signature;
  store signed headers under _s3_signed_request_headers and return URL with empty query. Content GET follows the
  same path but first requires a truthy file_content_request.file_id or ValueError file_id is required for Bedrock
  file content retrieval. No HEAD implementation is added. invalid_xml: Malformed/truncated XML propagates the parser
  failure from both listing transforms, without an invented BedrockError status. Use the production namespace-aware
  decoder for both paths and replay its corpus. Standalone Rust rejection cases cover DTD/internal-entity declarations
  and configured byte/depth limits; those hardening cases are not claimed as successful Python equivalence. delete_response_context:
  Only HTTP204 is deletion success. Other statuses raise B682 with original status when >=400, otherwise502; message
  is truthy response.text or S3 file deletion returned HTTP {status}, and headers are preserved. After204, validate
  logging_obj.model_call_details.additional_args as _S3DeleteContext with required nonempty string file_id, retaining
  validation errors; return FileDeleted id from that logging context,deleted=True,object=file. Do not infer the
  ID from response URL/body. s3_request_target: Merge as {litellm_params, then optional_params}, so request keys
  win here; this differs from B644 upload's B596 deployment-authoritative merge. Validate as _BedrockS3RequestParams/AwsAuthParams
  with optional s3_region_name,s3_endpoint_url,s3_access_key_id,s3_secret_access_key default None. Choose truthy
  s3_region_name then aws_region_name, pass that preference to B591 _get_aws_region_name with model empty string,
  then truthy s3_endpoint_url or https://s3.{region}.{B198 DNS suffix}, stripping trailing slashes. Bucket authorization
  runs before this credential/endpoint selection on content/delete requests. Reuse B590/B644 config-loader cases.
  bodiless_s3_signature: Resolve B594 S3 credentials from request_params.model_dump(exclude_none=True) and selected
  region. Create an AWS request with the supplied GET/DELETE method, URL and only initial x-amz-content-sha256 equal
  to SHA256 of empty bytes, then S3SigV4Auth service=s3 using the region directly. Return an immutable snapshot
  of signed headers. Unlike the PUT signer, no Content-Type,Content-Language,Cache-Control,KMS/owner headers or
  non-LLM region rewrite is added. Missing Python boto3 message remains Missing boto3 to call bedrock. Run 'pip
  install boto3'.; reuse the compiled signing library.


  Write standalone Rust test s3_listing_rejects_dtd_and_limits through decode_s3_listing; assert rejection of DTD/internal
  entities and existing configured bounds, separately from Python oracle cases.


  Implement crates/betterlite-bedrock/src/s3_listing.rs with adjacent tests under s3_listing/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function s3_listing_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  list_purpose_prefix, input_output_bucket_walk, pagination_continuation, namespace_xml_list, unmanaged_key_filter,
  last_modified_and_size, file_retrieve_delete, invalid_xml, delete_response_context, s3_request_target, bodiless_s3_signature.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_listing* using HelperCase:
  kind: helper and the externally tagged bedrock_services_s3_listing variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_s3_listing that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Outside-byte boundary: decode_s3_listing consumes S3 XML response bytes including namespaced elements in crates/betterlite-bedrock/src/s3_listing.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_s3_listing.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_s3_listing.
  The adjacent test replays_the_bedrock_services_s3_listing_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_s3_listing_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_services_s3_listing_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 270 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 300 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
