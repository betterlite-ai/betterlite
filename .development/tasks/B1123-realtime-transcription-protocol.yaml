id: B1123
title: Realtime transcription protocol
description: >-
  Decode typed transcription session updates and PCM16 append payloads, normalize beta/GA audio formats and construct
  transcription events.


  Implement crates/betterlite-core/src/api/realtime_transcription_protocol.rs. Use RealtimeTranscriptionPInput and
  RealtimeTranscriptionPResult with typed nested records; inject only the clock, repositories, transports and resolved
  settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment
  or duplicate credential resolution.


  Write adjacent tests.rs behavior functions ga_transcription_update, beta_transcription_update under api::realtime_transcription_protocol::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::realtime_transcription_protocol::decode_realtime_transcription(bytes:
  &[u8], limits: &ApiLimits), for base64.b64decode input audio at litellm/llms/base_llm/realtime/transcription_protocol.py:181.
  Place its implementation in crates/betterlite-core/src/api/realtime_transcription_protocol.rs and call it from
  the actual boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/realtime_transcription_protocol.rs
  passes arbitrary bounded bytes to that exact decoder; api::realtime_transcription_protocol::tests::replays_corpus
  replays newly committed seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::RealtimeTranscriptionProtocol in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns
  the re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_transcription_protocol:
  <typed input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this
  production service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare
  values and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/llms/base_llm/realtime/transcription_protocol.py: TranscriptionAudioFormat.is_pcm16
  (L43-L44); litellm/llms/base_llm/realtime/transcription_protocol.py: TranscriptionSessionUpdate.turn_detection_type
  (L58-L59); litellm/llms/base_llm/realtime/transcription_protocol.py: json_object (L65-L72); litellm/llms/base_llm/realtime/transcription_protocol.py:
  json_mapping (L75-L82); litellm/llms/base_llm/realtime/transcription_protocol.py: json_string (L85-L92); litellm/llms/base_llm/realtime/transcription_protocol.py:
  json_integer (L95-L102); litellm/llms/base_llm/realtime/transcription_protocol.py: new_event_id (L105-L106); litellm/llms/base_llm/realtime/transcription_protocol.py:
  parse_transcription_session_update (L109-L141); litellm/llms/base_llm/realtime/transcription_protocol.py: _parse_audio_format
  (L144-L168); litellm/llms/base_llm/realtime/transcription_protocol.py: decode_pcm16_append (L171-L186); litellm/llms/base_llm/realtime/transcription_protocol.py:
  _transcription_settings (L189-L194); litellm/llms/base_llm/realtime/transcription_protocol.py: transcription_session
  (L197-L213); litellm/llms/base_llm/realtime/transcription_protocol.py: transcription_session_created_event (L216-L224);
  litellm/llms/base_llm/realtime/transcription_protocol.py: error_event (L227-L232); litellm/llms/base_llm/realtime/transcription_protocol.py:
  speech_event (L235-L243); litellm/llms/base_llm/realtime/transcription_protocol.py: delta_event (L246-L254); litellm/llms/base_llm/realtime/transcription_protocol.py:
  completed_event (L257-L270); litellm/llms/base_llm/realtime/transcription_protocol.py: duration_usage (L273-L275).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 230 owned nonblank/non-comment/non-docstring Python lines (230 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 250 implementation,
  52 behavior tests, 24 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 506 total within the 510-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
