id: B1123
title: Realtime transcription protocol
description: >-
  Build the complete base realtime transcription_protocol.py in
  betterlite-core::api::transcription_protocol. It parses beta/GA session updates, validates
  PCM16 append payloads and constructs OpenAI-compatible transcription events. Keep parsing separate
  from provider-specific model, sample-rate, language and VAD support checks. Supported transcription
  keys here are model and language; return every other key sorted, without dropping or rejecting it.
  The caller selects an error type; preserve RealtimeTranscriptionProtocolError messages verbatim.

  parse_transcription_session_update(bytes,limits) and decode_pcm16_append(value,max_encoded_bytes)
  are the production decoders. A single transcription_protocol fuzz input selects JSON with byte 0
  or a bounded base64 string with byte 1; replay both through those functions. B1087 supplies general
  allocation limits, while max_encoded_bytes=None means no additional four-second cap in this helper.
  Event IDs use event_ plus 32 lowercase UUID hex digits; inject a UUID source for deterministic native
  tests and compare ID shape/relationships in oracle fixtures. There is no provider transport here.

  Register HelperCall::RealtimeTranscriptionProtocol in B171 and a typed operation for parse, audio
  decode or event construction. Tests use api::transcription_protocol::tests. Source has
  230 nonblank/non-comment lines including imports; budget 190 implementation,130 tests,105 fixtures,
  85 adapters,65 fuzz/replay and 25 wiring, 600 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/transcription_protocol.rs
  - crates/betterlite-core/src/api/transcription_protocol/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/transcription_protocol.rs
  - crates/betterlite-core/fuzz/corpus/transcription_protocol/**
  - tools/oracle/src/helpers/core_ops/transcription_protocol.rs
  - tools/oracle/src/helpers/core_ops/transcription_protocol/**
  - tools/oracle/helpers/realtime_transcription_protocol.py
  - tools/oracle/helpers/realtime_transcription_protocol/**
  - tools/oracle/cases/helpers/realtime-transcription-protocol/**
  - tools/oracle/fuzz/corpus/helper_case/realtime-transcription-protocol-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/realtime/transcription_protocol.py#L1-L275
  why: Entire protocol module, including strict integer validation, layout conflicts, PCM sample alignment and event constructors.
dod:
- text: >-
    transcription_session_layouts accepts session.update and transcription_session.update. Flat
    input_audio_format=pcm16 gives layout=beta,encoding=pcm16,rate=null,channels=null; GA audio.input.format
    {type:audio/pcm,rate:24000,channels:1} gives those values with layout=ga. GA string format=custom stays
    custom. Only pcm16/audio/pcm make is_pcm16 true. Missing audio format returns None; model/language
    default None. Keys prompt and temperature return unsupported_transcription_keys=[prompt,temperature].
    Missing turn_detection gives disabled=false; explicit null gives disabled=true; flat turn_detection
    wins over nested, including null. {type:server_vad} gives turn_detection_type=server_vad.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    transcription_protocol_errors checks malformed JSON -> "invalid JSON object"; [] -> "message must
    be a JSON object"; type=other -> "expected session.update"; missing/empty session -> "session.update
    requires a session object". Nonobjects at session,session.audio,session.audio.input,input audio
    transcription,turn_detection,session.audio.input.format give "<name> must be an object". Nonstring
    session.type,transcription model,language,session.input_audio_format,session.audio.input.format.type
    give "<name> must be a string". Boolean, float or string rate/channels give "<name> must be an integer";
    integers including zero/negative pass this layer. Simultaneously nonnull beta/GA transcription or
    format gives "input transcription must use either beta or GA layout" or "input audio format must
    use either beta or GA layout". Null optional values pass. Repeat with a caller-supplied error type.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    pcm16_append_validation decodes AAAA to three bytes then rejects "PCM16 audio must contain complete
    samples"; AAA= decodes two zero bytes; empty string decodes empty bytes. Nonstrings fail "Audio must
    be a base64 string"; whitespace, bad alphabet, invalid padding and non-ASCII fail "Audio must be
    valid base64". At max_encoded_bytes=4, AAA= passes, AAAAAAAA fails "Audio append exceeds the
    four-second backlog limit" before decoding. The limit counts encoded characters, not decoded samples.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    transcription_event_shapes builds session id=s,model=m,sample_rate=16000,language=en,server_vad=true:
    object=realtime.transcription_session,type=transcription,audio.input.format={type:audio/pcm,rate:16000},
    transcription={model:m,language:en},turn_detection={type:server_vad}. language=None omits language;
    server_vad=false emits null turn_detection. Created event type=session.created wraps that session.
    Speech started/stopped keep item_id=i; delta and completed use their full conversation.item.input_audio_transcription
    event names, content_index=0 and event IDs. Completed usage=None omits usage, duration_usage(1.25)
    is {type:duration,seconds:1.25}; token usage is retained unchanged. error_event(denied) emits
    {type:error,error:{type:server_error,message:denied}} with no code or event_id.
  proof: [behavior-tests, oracle, helper-python]
- text: Newly committed JSON/base64 and helper seeds reach the exact production decoders and independent source adapter.
  proof: [decoder-corpus, helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Layout precedence, exact failure messages and event omissions must each be asserted.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::transcription_protocol::tests::/) - test(/::replays_corpus$/)'
  - id: decoder-corpus
    why: Both untrusted JSON and encoded audio need bounded panic-free parsing.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/transcription_protocol)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::transcription_protocol::tests::replays_corpus$/)'
  - id: helper-python
    why: Protocol helpers need checked independent Python calls for their strict failure contract.
    run: test -f tools/oracle/helpers/realtime_transcription_protocol.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The protocol operation tag must have a fresh helper parser seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime-transcription-protocol-*)" && grep -qE '^[[:space:]]+realtime_transcription_protocol:' tools/oracle/fuzz/corpus/helper_case/realtime-transcription-protocol-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Each protocol operation needs a newly added parity fixture.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-transcription-protocol)"
oracle_cases:
- tools/oracle/cases/helpers/realtime-transcription-protocol/transcription-session-layouts.yaml
- tools/oracle/cases/helpers/realtime-transcription-protocol/transcription-protocol-errors.yaml
- tools/oracle/cases/helpers/realtime-transcription-protocol/pcm16-append-validation.yaml
- tools/oracle/cases/helpers/realtime-transcription-protocol/transcription-event-shapes.yaml
deviations: []
out_of_scope:
- No functions in transcription_protocol.py remain unowned; provider restrictions and actual streaming backends stay with their provider tasks.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_transcription_protocol in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/transcription_protocol.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_transcription_protocol.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Python bool is an int subclass, but json_integer explicitly rejects true and false.
- Explicit null turn_detection disables VAD; an omitted key does not.
- Audio backlog validation runs before strict base64 decoding and before complete-sample validation.
review_level: standard
budget:
  max_changed_lines: 600
  max_new_expects: 0
