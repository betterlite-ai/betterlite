checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_transcription_protocol::/)
      - test(/::replays_corpus$/)'
  - id: case-ga-transcription-update
    why: the ga-transcription-update behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_transcription_protocol::tests::ga_transcription_update($|::)/)'
  - id: case-beta-transcription-update
    why: the beta-transcription-update behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_transcription_protocol::tests::beta_transcription_update($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/realtime_transcription_protocol)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/realtime_transcription_protocol.rs && grep -qF "decode_realtime_transcription"
      crates/betterlite-core/fuzz/fuzz_targets/realtime_transcription_protocol.rs && cargo nextest run --locked
      -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_transcription_protocol::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/realtime_transcription_protocol.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime_transcription_protocol-*)"
      && grep -qE "^[[:space:]]+realtime_transcription_protocol:" tools/oracle/fuzz/corpus/helper_case/realtime_transcription_protocol-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-transcription-protocol)"
oracle_cases:
- tools/oracle/cases/helpers/realtime-transcription-protocol/ga-transcription-update.yaml
- tools/oracle/cases/helpers/realtime-transcription-protocol/beta-transcription-update.yaml
deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- TranscriptionSessionUpdate.turn_detection_type uses self.turn_detection.get('type'); retain its missing-value
  behavior and field spelling in the typed projection.
- Within json_object\'s not isinstance(value, dict) branch, preserve raise error('message must be a JSON object')
  and its nested guards.
