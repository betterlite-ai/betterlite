id: B855
title: Authenticated request admission and budget handoff
description: >-
  Compose authenticated admission in its actual order: B883 should_call_route, B881 Claude-model
  normalization, B881 router-settings alias normalization, then the protected managed-actor/common-check
  block. The first three calls are OUTSIDE its try/except; failures there do not invoke this block's
  B757 authentication error handler. force_virtual_key_checks defaults False and is forwarded unchanged
  to B1221 _run_centralized_common_checks exactly once. Prefetch, temporary budgets, zero-cost skipping
  and reservations belong to B1221's dependencies; do not execute them twice in this stage.

  Inside the try block, create a managed identity store only when DB exists, admit a non-null agent_id,
  then reject a non-null managed_agent_policy on a disallowed route/method with HTTPException 403
  'Agent identities can only access inference and agent discovery routes'. For managed policies build
  authorized_data with settings, CLI model, path model OR path model_name, and query model; ordinary
  keys retain request_data. Resolve an invocation target for every caller; a non-null target prepares
  invocation before common checks. billable is true only when original request_data.method is absent/
  None, message/send, message/stream, SendMessage or SendStreamingMessage. Other methods are nonbillable.
  Common checks consume authorized_data, but an exception handler receives ORIGINAL request_data,
  route, API key, parent span and resolved identity. Return its recovered identity immediately; do not
  continue end-user fallback. B757 preserves ProxyException, maps HTTP errors to auth_error with their
  status and default param string 'None', BudgetExceededError to budget_exceeded/429 with null param,
  and ordinary errors to 401 auth_error prefixed 'Authentication Error, '. Its DB-outage recovery and
  callback transformation remain B757; test delegation rather than copying that mapper.

  Managed implementations belong to the later B141 agent service, and telemetry implementations to
  B124/B110 integration services. Define the required ManagedAdmission and TenantDestinations ports
  here, with methods matching these calls and typed outcomes; those higher services install concrete
  implementations. No direct dependency on B141/B124 (which depend on B052 and this stage) and no
  allow-all/no-op stub for a configured capability. B732 server construction rejects a configured
  capability without its port. B855 owns only ordering and exception boundaries, not agent policy,
  registry lookups, pricing or exporter construction; use injected failure/results for native tests.

  After successful common checks only, if end_user_id is None, call B880 extraction with B1100 safe
  request headers; a non-null raw id is resolved/validated through B880 with B739's key budget id.
  Assign only a non-null result. Existing ids (including empty string) skip fallback. These failures
  occur AFTER the protected block and are not recovered by it. B880 owns validate_end_user_id_in_db
  and its loader. Normal success returns None, meaning the caller retains its existing auth object.

  Principal projection obtains B743 trusted CIDRs, trusts X-Forwarded-For only when that tuple is
  nonempty, and resolves network context once. Truthy jwt_claims chooses BEARER_JWT, otherwise API_KEY.
  Call B870 _principal_from_key with token as subject_fallback and CredentialRef.token_id; never infer
  identity from client metadata. _spend_counter_redis_cache returns the injected cache's optional Redis
  backend, without constructing another cache. Destination seeding defaults request=None, resolves
  tenant destinations from safe headers (including x-litellm-disable-callbacks), filters through the
  current fan-out provider's deliverable destinations, then sets request context. Any failure logs
  debug 'OTel V2: tenant destination resolution failed: %s' and is swallowed. No destination is set
  after an earlier resolution failure, and auth must proceed. The calling auth span inherits these
  destinations; earlier DB spans are not retroactively moved.


  Build the production auth_admission module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _resolve_request_principal (L3224-L3245; 21 source lines), _authorize_authenticated_request (L3248-L3355;
  92 source lines), _spend_counter_redis_cache (L3358-L3361; 3 source lines), _seed_request_destinations
  (L3395-L3429; 30 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  These functions read request/runtime state and perform asynchronous admission; do not register a
  helper operation for them. Native tests assert ordered collaborator calls and mutations, while B001
  HTTP cases exercise the installed production stage. Postgres uses POSTGRES_TEST_URL, otherwise B860
  testcontainers, with connection/startup failures failing the check.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Four functions contain 108 nonblank noncomment lines excluding docstrings. Allow 180 composition/
  ports, 340 ordered and HTTP tests and 65 server wiring lines, 585 within 650.


  Server wiring tests live under betterlite-server::auth::auth_admission::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
