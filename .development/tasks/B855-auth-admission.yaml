pitfalls:
  - Model normalization and end-user fallback lie on opposite sides of the protected block; neither uses its local error recovery.
  - The recovered identity return skips fallback, and common checks receive transformed data while error hooks receive original data.
  - Any non-null agent_id triggers admission, including an empty string.
