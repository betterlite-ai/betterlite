dod:
  - text: 'Native cases route_then_normalization, pre_try_errors_bypass_handler, managed_store_optional,
      actor_admit_before_route_gate, managed_input_precedence, target_before_common_checks,
      billable_method_literals, common_checks_once_force_flag, original_data_on_error,
      recovered_identity_returns_early, existing_end_user_skips, null_resolution_no_assignment,
      fallback_error_outside_catch, cidrs_gate_forwarded_for, jwt_claims_truthiness,
      token_principal_fallback, optional_redis_backend, destinations_resolve_filter_set,
      disabled_callback_destination and telemetry_failure_debug_only cover the owned order.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_admission::tests::/)
        - test(/replays_the_/)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_admission::tests::/)
        - test(/replays_the_/)'
