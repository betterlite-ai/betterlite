id: B529
title: Azure configuration and credential selection
description: >-
  Compose AzureSettings, credential selection and the per-identity token cache over B673 client secret, B675 username/password,
  B677 default/deployment chains and B530 OIDC. Own get_azure_ad_token and its env reads at the config boundary:
  explicit litellm_params values precede AZURE_AD_TOKEN, AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
  AZURE_USERNAME, AZURE_PASSWORD and AZURE_SCOPE. Scope defaults to https://cognitiveservices.azure.com/.default;
  enable_azure_ad_token_refresh defaults false. Callable providers arrive from B165 as injected inputs. Preserve
  provider-return TypeError and wrapped RuntimeError behavior, cache expiry and full credential-identity separation.
  Create the crate only through the foundational grant/settings parts; do not use azure_identity as a complete credential
  implementation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  process_azure_headers L66-L78; _cached_azure_ad_token_refresh_provider L99-L101; _resolve_azure_ad_token L418-L424;
  get_azure_request_auth_headers L427-L439; redact_azure_auth_headers L442-L446; get_azure_ad_token L299-L411.


  Reuse get_azure_ad_token_provider from B677 (litellm/secret_managers/get_azure_ad_token_provider.py); its implementation
  remains with that prerequisite.


  Named case contracts: static_ad_token: Get azure_ad_token through truthy explicit value then secret-resolved AZURE_AD_TOKEN.
  A truthy callable provider is invoked at the end and overrides a static token; its empty-string return is accepted.
  Non-string returns raise TypeError Azure AD token must be a string, got <type>; provider TypeError propagates,
  other exceptions become RuntimeError Failed to get Azure AD token: <error>. client_secret_precedence: With provider=None
  and truthy tenant/client/secret resolve B673 before username/password; these fields use truthy explicit values
  then AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET. Existing static tokens do not suppress provider creation.
  username_password: With provider still None and truthy azure_username/azure_password/client_id use B675; username/password
  resolve through AZURE_USERNAME/AZURE_PASSWORD and do not forward tenant_id in this call. refresh_fallback: Resolve
  azure_scope through truthy explicit value then AZURE_SCOPE, default https://cognitiveservices.azure.com/.default;
  an empty environment scope is retained. OIDC exchange requires truthy client_id/tenant_id and oidc/ token and
  runs even alongside an existing provider. Otherwise enable_azure_ad_token_refresh is True and provider=None enables
  B677: swallow ValueError with debug logging, rethrow other exceptions; try its default credential provider only
  when provider and token are both None. Cache the SDK-refresh provider separately by scope with maxsize=128. header_case_insensitive_preservation:
  get_azure_request_auth_headers preserves the whole input if any name case-insensitively equals api-key or authorization.
  Otherwise prefer nonempty string azure_ad_token, then a callable producing a nonempty string, then nonempty string
  api_key; provider failures propagate and invalid/empty outputs fall through. redacted_auth_headers: redact_azure_auth_headers
  replaces only case-insensitive api-key/authorization values with ***REDACTED*** while preserving original header
  names and other values. azure_response_headers: Prefix every upstream header with llm_provider- and also copy
  x-ratelimit-limit-requests, x-ratelimit-remaining-requests, x-ratelimit-limit-tokens, x-ratelimit-remaining-tokens
  unprefixed. Plain dict lookup remains case-sensitive; httpx.Headers lookup is case-insensitive.


  The memory-only DualCache get/set path is B2226, below this provider; the provider-specific cache key, credential
  lifetime and single-flight policy stay here. B173 remains the outbound HTTP/client pool only.


  Implement crates/betterlite-azure/src/credentials.rs with adjacent tests under credentials/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_credentials in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function credentials_cases in betterlite-azure with these exact named cases (one per oracle file):
  static_ad_token, client_secret_precedence, username_password, refresh_fallback, header_case_insensitive_preservation,
  redacted_auth_headers, azure_response_headers. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_credentials* using HelperCase: kind: helper
  and the externally tagged azure_credentials variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_credentials that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/credentials.rs
  and its loader wiring: AZURE_SCOPE, enable_azure_ad_token_refresh, AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
  AZURE_USERNAME, AZURE_PASSWORD, AZURE_AD_TOKEN. Module-level settings enter litellm_settings; deployment settings
  enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above and in
  the linked branches; existing key owners remain unchanged. Write config rstest azure_credentials_config_cases
  with named cases loads_azure_scope, loads_enable_azure_ad_token_refresh, loads_azure_tenant_id, loads_azure_client_id,
  loads_azure_client_secret, loads_azure_username, loads_azure_password, loads_azure_ad_token, plus rejects_unrelated_key.
  Each loads case calls the real config loader with that key and asserts the resolved value, default, precedence
  and secret redaction where applicable. Seed B002 config_yaml with new azure_credentials* files for every key;
  reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_credentials_credential_identity_isolation in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_credentials_secret_safe_failure in betterlite-azure for this Rust-specific invariant; it
  is not a Python oracle case.


  Budget from 132 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 170 production lines, 280 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 49 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 649 planned, 650 maximum changed lines.
