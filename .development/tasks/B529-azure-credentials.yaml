      provider is invoked at the end and overrides a static token; its empty-string return is accepted. Non-string
      returns raise TypeError Azure AD token must be a string, got <type>; provider TypeError propagates, other
      exceptions become RuntimeError Failed to get Azure AD token: <error>.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_static_ad_token$/)'
  - id: case-client-secret-precedence
    why: With provider=None and truthy tenant/client/secret resolve B673 before username/password; these fields
      use truthy explicit values then AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET. Existing static tokens
