dod:
  - text: 'patch_merge cases cover omitted_secret, supplied_string_encrypted, non_string_param,
      encryption_failure, complexity_config_merge, empty_name_preserved, stale_cost_map_echo,
      edited_pricing_retained, clear_credential, clear_mirrored_prices_after_merge, clear_compression,
      protected_team_id_null, ptu_clear_and_reprice, datetime_iso and blocked_omitted_or_false.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'postgres_pinned_rows covers encrypted_create, actor_fallback, dry_run_no_slot,
      capability_slot_create, no_team_no_create, team_public_name_before_internal_name,
      empty_public_name_no_grant, team_move_new_internal_name, same_team_keeps_internal_name,
      sibling_db_grant_retained, first_public_name_add, unchanged_name_no_op and multi_team_delete_ids.
      postgres_failure_effects covers cipher_failure_no_write, write_failure_no_grant,
      grant_failure_keeps_row, add_before_delete_failure, missing_db_warn_skip_rename,
      delete_transaction_rollback, publish_failure_after_commit and reconcile_lock_before_router_removal.'
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_team_assignment::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/model_team_assignment.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/model-team-assignment-*")"
        && grep -rlq "model_team_assignment" tools/oracle/fuzz/corpus/helper_case/model-team-assignment-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/model_team_assignment::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/model_team_assignment::tests::postgres_failure_effects$/)'
