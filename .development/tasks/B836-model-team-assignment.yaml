id: B836
title: Team-specific model names and deployment ownership
description: >-
  Implement TeamModelAssignment and the stored-model patch merge used by it. Move update_db_model here
  from B835 so both create/update helpers sit below their route callers. Use B814's real team_model_add,
  team_model_delete and append_team_models services, including their authorization and cache effects;
  do not substitute a direct array write for these calls. No route is registered in this task.

  _add_model_to_db encrypts EVERY non-null litellm_params value with B2303.encrypt_value_helper and the
  optional new_encryption_key, not just api_key. Non-string values follow that helper's unchanged-value
  behavior; encryption errors abort before insertion. It mutates the supplied deployment, serializes
  both JSON blobs, uses model_info.id and sets created_by/updated_by to user_id or LITELLM_PROXY_ADMIN_NAME.
  should_create_model_in_db=false returns the encrypted row without writing or entering a slot; otherwise
  write through the supplied capability slot, or the ordinary model table if no slot was supplied.

  _add_team_model_to_db returns None without a team ID. Otherwise capture the original public model_name,
  put a truthy name in model_info.team_public_model_name and replace the database name with
  model_name_<team_id>_<uuid>. Write the deployment before append_team_models adds that public name.
  A failed append leaves the model row; an empty original name still creates the row but adds no grant.

  update_db_model keeps a falsey incoming name from clearing the old name. Start from stored non-null
  params and model_info. Strip echoed cost-map pricing fields from stored model_info and filter incoming
  display-only pricing through B014's echoed_cost_map_fields/without_server_derived_pricing, consulting
  B833's live and loaded catalog entries. Encrypt supplied non-null params; complexity_router_config
  instead uses B1213's merge. After both merges, explicit null clears the mirrored pricing fields,
  cache_control_injection_points and litellm_credential_name from both blobs. Null
  auto_router_routing_compression/auto_router_model_compression clears only params; arbitrary privileged
  model_info fields cannot be cleared through this path. Then clear explicit PTU fields, validate the
  merged PTU configuration, apply B833's pricing delta/releases to both blobs, encode datetimes as ISO
  strings and serialize JSON. Include blocked only when not None. An omitted secret stays unchanged;
  a failed encryption never silently writes plaintext here.

  _update_team_model_in_db first invokes B832.allow_team_model_action and B1213/B833's merged PTU
  checks. No patch team_id means merge and write only. A patch team_id selects a public name in this
  order: a truthy incoming model_name that is neither the current DB name nor prefixed
  model_name_<team_id>_, then the existing truthy team_public_model_name, then the old DB name. Ignore
  the incoming model_info.team_public_model_name when choosing it. A new/changed team gets a fresh
  internal UUID name; the same team keeps its internal name. Write_row completes before the setup or
  existing-assignment service touches team grants. Do not clean the old team's grant on a move unless
  another explicitly owned source helper does so.

  For an existing team rename, only a truthy old public name different from the new name triggers the
  sibling query. If the DB handle is absent, warn and skip the entire grant update. Query B1230's DB
  team deployments; retain the old grant when another row with a different internal model_name has
  that public name. This particular helper does not inspect configured siblings. Add the new grant
  first, then delete the old one only with no surviving DB sibling. A missing old public name merely
  adds a truthy new name; an unchanged name does nothing. Preserve a completed add if the later delete
  fails. B1230 separately owns configured-sibling cleanup used by other deletion paths.

  delete_team_models reads and deletes exact model IDs for all team_ids in one transaction through
  B1230's prefix-and-model_info filter. After commit, publish a config change with object_type
  litellm_proxymodeltable only when IDs were deleted. Then under B124's MODEL_RECONCILE_LOCK remove
  those IDs from the auto-router catalog and, if a router exists, call B302.delete_deployment for each.
  A publish failure leaves rows deleted and prevents the later local removal. A database rollback
  prevents both publication and router removal. Return the deleted IDs, including an empty list.


  Build the production model_team_assignment module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  update_db_model (L975-L1085; 89 source lines), _add_model_to_db (L1495-L1525; 30 source lines),
  _add_team_model_to_db (L1528-L1580; 38 source lines),
  _update_team_model_in_db (L1583-L1669; 62 source lines), _get_public_model_name (L1672-L1715; 37 source
  lines), _setup_new_team_model_assignment (L1718-L1731; 14 source lines), delete_team_models (L1769-L1809;
  32 source lines), _update_existing_team_model_assignment (L1910-L1980; 60 source lines).


  The model_team_assignment operation under B856 Management::teams calls only the pure
  _get_public_model_name predicate. Its cases compare the chosen string, including stale/internal-name
  dashboard echoes. Database, crypto and handlers called transitively by assignment use native Postgres
  tests and B835/B1215's real HTTP cases; a Python helper must not invoke those handlers. Seed B171's
  existing HelperCase decoder with the predicate operation. Typed settings for cipher, PTU and team
  policy remain with B2303, B1213 and B814; this component reads no additional config/env value.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 362 nonblank, noncomment pinned source lines including docstrings; allow 330 production,
  310 behavior/Postgres tests, 65 helper adapters, 45 wiring and no new config/decoder lines,
  750 changed lines estimated within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Passing premium_user to B832 is not a separate license branch here; B832 owns that policy and its
  deviation tests. Keep this component's outcomes in the corresponding compatible/native fixtures.
