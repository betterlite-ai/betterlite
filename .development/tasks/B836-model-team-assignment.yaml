pitfalls:
  - 'The oracle helper for this task is pre-registered as model_team_assignment in the server group. Replace the stub Op in tools/oracle/src/helpers/server/model_team_assignment.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/model_team_assignment.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A team model's UUID-based internal name must never replace its public grant after a dashboard echo.
  - A new team assignment writes the model before updating grants and does not undo it when grant work fails.
  - _update_existing_team_model_assignment looks only at DB siblings, unlike B1230's broader cleanup path.
