id: B4307
title: Describe cache settings and return redacted effective values
description: >-
  Serve GET /cache/settings from crates/betterlite-server. The response has three members: "fields", the catalog of 27 cache
  settings the admin UI renders; "current_values", the effective cache settings with every credential replaced by the
  marker ***REDACTED***; and "redis_type_descriptions", the three texts for node, cluster and sentinel. The route is
  authenticated with the same dependency as the other management routes (user_api_key_auth; at the pin its route check, route_checks.py non_proxy_admin_allowed_routes_check L268-L365, refuses a non-admin key, since /cache/settings is in no non-admin route list).

  Put the catalog in crates/betterlite-server/src/cache_settings_read/fields.rs. It ports CacheSettingsField and the lists
  CACHE_SETTINGS_FIELDS and REDIS_TYPE_DESCRIPTIONS from litellm/types/management_endpoints/cache_settings_endpoints.py. A field
  has field_name, field_type, field_value, field_description, field_default, options, ui_field_name, link and redis_type, and all
  nine are always serialized (null when unset, as pydantic does). Copy names, types, descriptions, defaults, options and order
  exactly from the Python file, in that order: redis_type, url, host, port, db, password, username, ssl, namespace, ttl,
  max_connections, redis_startup_nodes, sentinel_nodes, service_name, sentinel_password, similarity_threshold,
  redis_semantic_cache_embedding_model, semantic_cache_scope, gcp_service_account, gcp_ssl_ca_certs, ssl_cert_reqs,
  ssl_check_hostname, aws_iam_auth, aws_iam_user_name, aws_iam_cache_name, aws_iam_region, aws_iam_serverless. That is 27 fields. The catalog is
  a function that returns a fresh Vec each call, so filling field_value for one request never leaks into the next.

  Build the effective values in crates/betterlite-server/src/cache_settings_read/view.rs, in this order, as LiteLLM does:
  1. Load the stored settings. With no database connection the stored map is empty. Otherwise read the row with id "cache_config"
     through B726's cache config repository. When the row exists and its cache_settings is not empty, parse it with B4306's
     parse_stored_settings (JSON string or already-parsed object; anything that is not an object becomes an empty map), then decrypt
     every value as B1600's decrypt_value_helper does with return_original_value true: a string that decrypts becomes the
     plaintext, a string that does not decrypt stays as stored, and a non-string value (a port number, a node list) passes through.
  2. Overlay the environment (overlay.rs). Only these 17 setting names are read from REDIS_<NAME IN UPPER CASE>: url, host, port,
     db, password, username, ssl, max_connections, gcp_service_account, gcp_ssl_ca_certs, ssl_cert_reqs, ssl_check_hostname,
     aws_iam_auth, aws_iam_user_name, aws_iam_cache_name, aws_iam_region, aws_iam_serverless (REDIS_SSL_CERT_REQS, REDIS_HOST and so
     on). They are the intersection of LiteLLM's Redis environment variables with the catalog names, so namespace, ttl, the
     startup and sentinel node lists, service_name and sentinel_password are never taken from the environment here. A variable that
     is unset is skipped; a set one keeps its raw string (REDIS_PORT gives "6379", not 6379). Stored keys win: a key present in the
     stored map, even with a null value, is not replaced. When at least one of the 17 was found, "type" is set to "redis" unless the
     stored map already has a "type" key.
  3. Apply B4306's resolve_cache_url_precedence, so a non-empty url drops host, port, db, password and username unless
     redis_startup_nodes is set.
  4. When "type" equals "redis", add "redis_type": "cluster" if redis_startup_nodes is truthy, else "sentinel" if sentinel_nodes is
     truthy, else "node". Truthy means not null, not false, not 0, not "", not [] and not {}.
  5. Redact with B4306's redact_credentials. The redacted map is current_values.
  6. For each catalog field whose field_name is a key of current_values, set field_value to that (already redacted) value.

  Any error while reading, parsing or decrypting answers HTTP 500 with the JSON body {"detail": "Error fetching cache settings: <error text>"}.
  Take the environment through B4321's EnvironmentLookup trait (betterlite-redis) so a test passes a BTreeMap and the server passes
  the process environment; if betterlite-server cannot depend on that crate, say so in a blocker and do not copy the trait.

  The route handler lives in cache_settings_read/route.rs and exposes pub fn router(state) -> axum::Router for B8650 to
  merge. Do not register the route anywhere else and do not touch lib.rs.
scope:
  paths:
  - crates/betterlite-server/src/cache_settings_read.rs
  - crates/betterlite-server/src/cache_settings_read/**
  - tools/oracle/cases/cache_settings_read/**
  - tools/oracle/helpers/b4307.py
  - tools/oracle/helpers/b4307/**
  - tools/oracle/src/helpers/server/b4307.rs
  - tools/oracle/src/helpers/server/b4307/**
  lint_tables: false

