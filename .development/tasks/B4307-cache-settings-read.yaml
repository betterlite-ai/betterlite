dod:
- text: The handler tests call tower's oneshot on cache_settings_read's own Router with fake ports; B8650 runs the HTTP cases through the booted proxy.
  proof: [route-tests]
- text: The catalog has every field of CACHE_SETTINGS_FIELDS in the same order with the same names, types, defaults, options, descriptions and redis_type, and REDIS_TYPE_DESCRIPTIONS has its three texts.
  proof: [fields-tests]
- text: Each catalog field serializes all nine keys, null when unset, and two calls return independent catalogs.
  proof: [fields-tests]
- text: With no stored row and none of the 17 REDIS_ variables set, current_values is empty and no field has a field_value. B8650 proves it over HTTP.
  proof: [overlay-tests]
- text: Set REDIS_ variables among the 17 names fill current_values as raw strings and add type "redis"; REDIS_ variables outside the 17 (such as REDIS_SOCKET_TIMEOUT) change nothing. B8650 proves it over HTTP.
  proof: [overlay-tests]
- text: A stored key, including one holding null, wins over the environment, and a stored "type" is kept.
  proof: [overlay-tests, oracle, helper-python]
- text: A non-empty url (stored or from the environment) drops host, port, db, password and username from current_values unless redis_startup_nodes is set.
  proof: [view-tests, oracle, helper-python]
- text: redis_type is cluster, sentinel or node by the order above, and only when type is redis.
  proof: [view-tests, oracle, helper-python]
- text: password, sentinel_password, url and any key B4306's classifier flags appear as ***REDACTED*** in current_values and in field_value, and a null credential stays null.
  proof: [view-tests, oracle, helper-python]
- text: Stored values are decrypted before the overlay, a value that does not decrypt is returned as stored, and non-string values pass through.
  proof: [stored-read-tests]
- text: >-
    A repository error, invalid stored JSON or a decrypt failure answers 500 with a detail that starts with "Error fetching cache settings: " and no partial body.
  proof: [stored-read-tests]
- text: GET /cache/settings answers 401 without a valid key, the admin-only route error for a non-admin key, and 200 for a proxy admin key, with fields, current_values and redis_type_descriptions in the body. B8650 proves it over HTTP.
  proof: [route-tests]
- text: Settings are read at request time, so a changed environment shows on the next call.
  proof: [route-tests]
- text: The oracle adapter for the helper cases passes ruff and basedpyright.
  proof: [helper-python]
- text: Every mutant in the overlay, view and redaction wiring is caught by a test.
  proof: [mutants]

checks:
  optional: [mutants]
  commands:
  - id: fields-tests
    why: the field catalog or the redis type descriptions differ from LiteLLM's or are missing
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_read::fields::/)'
  - id: overlay-tests
    why: the environment overlay reads the wrong variables or overrides stored keys
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_read::overlay::/)'
  - id: view-tests
    why: url precedence, redis_type derivation or credential redaction is wrong in the effective values
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_read::view::/)'
  - id: stored-read-tests
    why: the stored row is not parsed, decrypted or turned into a 500 on failure
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_read::stored::/)'
  - id: route-tests
    why: the route does not serve the body, require a key or read the environment per request
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_read::route::/)'
  - id: helper-python
    why: strict oracle adapter lint or type checks fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4307)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4307 &&
      uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4307/pyrightconfig.json

oracle_cases:
- tools/oracle/cases/cache_settings_read/view-stored-wins.yaml
- tools/oracle/cases/cache_settings_read/view-stored-null-wins.yaml
- tools/oracle/cases/cache_settings_read/view-redis-type-cluster.yaml
- tools/oracle/cases/cache_settings_read/view-redis-type-sentinel.yaml
- tools/oracle/cases/cache_settings_read/view-type-not-redis.yaml
- tools/oracle/cases/cache_settings_read/view-classifier-key.yaml
- tools/oracle/cases/cache_settings_read/view-url-with-cluster.yaml

deviations:
- what: >-
    The text after the "Error fetching cache settings" prefix in a 500 body is betterlite error text, not the Python exception text.
  why: Python exception strings (repr of a KeyError, a prisma error) have no Rust equivalent; status and the prefix match.

out_of_scope:
- POST /cache/settings/test and the saved-secret merge it uses; B4308 owns them.
- POST /cache/settings, encryption of the saved row, the audit log row and CacheSettingsManager (init_cache_settings_in_db, update_cache_params); B8502 owns them, and B4308 owns the test route.
- parse_stored_settings, resolve_cache_url_precedence, redact_credentials, is_credential_field; B4306 owns them and this task calls them.
- Reading REDIS_ variables through a secret manager (get_secret); B4321 owns the lookup, this task only passes it a lookup.
- The CacheConfigRepository table adapter itself; B726 owns it.
- Building the cache from the settings (redis clients, semantic caches); B4299 and B5630 own that.

pitfalls:
- "Only 17 REDIS_ variables are overlaid. REDIS_NAMESPACE, REDIS_TTL, REDIS_SENTINEL_PASSWORD, REDIS_SERVICE_NAME and REDIS_SENTINEL_NODES are Redis client settings elsewhere but never show up in this response."
- "The overlay keeps raw strings. REDIS_PORT=6379 appears as the string \"6379\" and REDIS_SSL=true as the string \"true\", with no coercion."
- "A stored key set to null still blocks the environment value for that key; check key presence, not value."
- "type defaults to redis only when the overlay found something; an empty environment and empty store give no type key and no redis_type key."
- "Url precedence runs after the overlay, so REDIS_URL from the environment removes a stored host and port, and REDIS_HOST from the environment is removed by a stored url."
- "redis_type is a UI-only key in current_values and in the redis_type field's field_value; it is never stored."
- "field_value gets the redacted value, so the password field in fields also reads ***REDACTED***."
- "A stored non-string value such as the integer 6379 or a node list must not be run through string decryption."
- "The admin gate comes from the shared key check's route rules, as in LiteLLM; do not add a second role check in the handler."
- "Redaction treats url as a credential even though its name is not sensitive, because Redis URLs can carry a password."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 1
