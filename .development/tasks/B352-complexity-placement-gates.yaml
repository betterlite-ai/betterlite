id: B352
title: Image and health gates for complexity placement
description: Finish the post-placement modality and speculative health gates around B334/B335. Reuse the
  actual eligibility service for speculative checks with immutable request snapshots and bounded fan-out;
  do not duplicate authentication, budget, rate-limit or context checks. Keep the stored session pin separate
  from this turn's replacement and restamp the final model in decision attribution. Use the existing Rust
  crate boundaries from B004 and B008; integrate through the server when the provider dispatcher or callbacks
  live in another core crate. This task's source slices are the linked ranges, not a port of their Python
  classes. Add the listed oracle cases and the matching adapters to B301's component runner where state
  is not observable over HTTP; adapters call production logic and never reproduce it. Use deterministic
  candidate sets or supplied random samples for comparisons, and separate seeded distribution tests for
  random choices. Extend the existing config_yaml fuzz target and committed corpus for every newly accepted
  config form; unsupported keys still fail by full path. Keep the implementation, adapters and tests within
  800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/complexity-placement-gates/**
  - tools/oracle/src/router_probes/complexity_placement_gates/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/complexity_placement_gates.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L3500-L3892
  why: Image capability checks, same-tier recovery, upward fit search and default eligibility.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the complexity_placement_gates prefix so the
    required filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(complexity_placement_gates)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/complexity-placement-gates/image-upward-only.yaml
- tools/oracle/cases/routing/complexity-placement-gates/image-pin-retained.yaml
- tools/oracle/cases/routing/complexity-placement-gates/image-pin-override-without-repin.yaml
- tools/oracle/cases/routing/complexity-placement-gates/no-vision-candidate-400.yaml
- tools/oracle/cases/routing/complexity-placement-gates/same-tier-health-recovery.yaml
- tools/oracle/cases/routing/complexity-placement-gates/context-upward-known-fit-only.yaml
- tools/oracle/cases/routing/complexity-placement-gates/plugin-rejects-default.yaml
- tools/oracle/cases/routing/complexity-placement-gates/plan-floor-rejects-default.yaml
- tools/oracle/cases/routing/complexity-placement-gates/health-probe-keeps-retry-bookkeeping.yaml
- tools/oracle/cases/routing/complexity-placement-gates/unknown-probe-failure-still-final-checks.yaml
- tools/oracle/cases/routing/complexity-placement-gates/native-input-context-probe.yaml
deviations: []
out_of_scope:
- Classifier algorithms, session pin storage or provider health-check workers.
pitfalls:
- Unknown speculative health failures may read as capacity, but the final dispatch still runs all mandatory
  checks.
- A default model has no tier guarantee and cannot bypass a plan floor or a plugin policy.
- Probe fan-out must use an explicit semaphore and the caller's remaining deadline.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
