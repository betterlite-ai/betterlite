id: B341
title: Adaptive learning persistence in the existing Postgres schema
description: Add the B051 repository adapters for LiteLLM_AdaptiveRouterState and LiteLLM_AdaptiveRouterSession
  and connect B340's bounded update queue. Load stored deltas on top of cold priors, atomically increment
  cells across writers and write session snapshots without changing their compound key. Use server-owned
  periodic flush/shutdown tasks. Keep failures observable and requeue failed rows within bounded capacity
  rather than dropping drained updates; the explicit difference from the pin requires architect acknowledgement.
  Use B051's schema unchanged, including conversion at existing numeric database columns. Use the existing
  Rust crate boundaries from B004 and B008; integrate through the server when the provider dispatcher
  or callbacks live in another core crate. This task's source slices are the linked ranges, not a port
  of their Python classes. Add the listed oracle cases and the matching adapters to B301's component runner
  where state is not observable over HTTP; adapters call production logic and never reproduce it. Use
  deterministic candidate sets or supplied random samples for comparisons, and separate seeded distribution
  tests for random choices. Extend the existing config_yaml fuzz target and committed corpus for every
  newly accepted config form; unsupported keys still fail by full path. Keep the implementation, adapters
  and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/adaptive-persistence/**
  - tools/oracle/src/router_probes/adaptive_persistence/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/adaptive_persistence.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/update_queue.py#L41-L212
  why: Delta aggregation and session upserts.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L126-L165
  why: Reload adds deltas to priors.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/schema.prisma#L1595-L1635
  why: The unchanged adaptive-state and adaptive-session compound-key tables.
dod:
- text: Every listed case compares production behavior against pinned LiteLLM; any declared difference
    asserts exact reference and Rust outcomes through B361 instead of ignoring the difference.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the adaptive_persistence prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(adaptive_persistence)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/adaptive-persistence/cold-prior-plus-one-sided-delta.yaml
- tools/oracle/cases/routing/adaptive-persistence/atomic-two-writer-deltas.yaml
- tools/oracle/cases/routing/adaptive-persistence/session-last-snapshot.yaml
- tools/oracle/cases/routing/adaptive-persistence/primary-key-not-updated.yaml
- tools/oracle/cases/routing/adaptive-persistence/restart-restores-selection.yaml
- tools/oracle/cases/routing/adaptive-persistence/flush-empty.yaml
- tools/oracle/cases/routing/adaptive-persistence/snapshot-private-fields-absent.yaml
deviations:
- what: Failed adaptive-state flush rows are retained for bounded retry instead of discarded after logging.
  why: The no-silent-drops and bounded-queue rules require an explicit failure path without losing drained
    learning state.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/update_queue.py#L95-L201
out_of_scope:
- Creating new database tables or silently changing numeric column types.
- Rolling schema migrations (B051).
pitfalls:
- The architect must approve retrying failed learning writes and choose the queue-full policy before dispatch;
  the proposed policy is bounded backpressure with a timeout error.
- A retry after an ambiguous database commit can duplicate deltas, so B051 must provide transaction outcome
  handling or an idempotent batch mechanism without schema changes.
- If B051 repository implementations live outside server, add their exact module paths before dispatch.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
