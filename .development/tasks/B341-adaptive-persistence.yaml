id: B341
title: Adaptive learning persistence in the existing Postgres schema
description: 'Implement B051 repository adapters for LiteLLM_AdaptiveRouterState and LiteLLM_AdaptiveRouterSession
  using B340 typed deltas/snapshots and the existing compound keys. Load persisted deltas over cold priors
  and atomically increment rows in sorted order. Flush every 10 seconds, matching _ADAPTIVE_ROUTER_FLUSH_INTERVAL_SECONDS
  (no env override); log and discard failed drained rows, without retrying an ambiguous commit. Use server-owned
  shutdown and bounded aggregators. No schema change or deduplication protocol is needed. Cap each state/session
  aggregator at 1024 distinct keys. An existing key still coalesces at capacity; for a new key flush once
  within the active deadline, then warn/drop it on failure without failing a served provider response.
  Nonmonetary statistical arithmetic uses f64 only in learning_math; put one module-level #[expect(clippy::float_arithmetic,
  reason = "pinned statistical routing arithmetic")] there, counted in this task budget. Money, prices,
  spend and budgets stay rust_decimal::Decimal, including database and wire boundaries. Reject nonfinite
  statistical input. Assert selected model/tier exactly; any opt-in tolerance is for diagnostic scores
  only, never a different selection. Learning alpha/beta and samples follow the existing schema; only
  posterior statistics may use f64. Monetary columns stay Decimal. Use a 5-second shutdown drain deadline
  matching CACHE_WRITE_SHUTDOWN_FLUSH_TIMEOUT_SECONDS for owned cache writes; a remaining failed batch
  is warned and discarded. Implement the owned native service in crates/betterlite-router/src/adaptive_persistence.rs.
  Add ProbeOperation::AdaptivePersistence in tools/oracle/src/router_probes/mod.rs and the corresponding B341 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/adaptive_router/adaptive_router.py:
  AdaptiveRouter.load_state_from_db (L126-L165). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Function coverage in litellm/router_strategy/adaptive_router/update_queue.py: AdaptiveRouterUpdateQueue.__init__
  (L41-L46), AdaptiveRouterUpdateQueue.add_state_delta (L50-L72), AdaptiveRouterUpdateQueue.add_session_state
  (L76-L91), AdaptiveRouterUpdateQueue.flush_state_to_db (L95-L149), AdaptiveRouterUpdateQueue.flush_session_to_db
  (L151-L201), AdaptiveRouterUpdateQueue.queue_size (L205-L212). Implement these behaviors through the
  typed Rust services above; synchronous facades and structural accessors reuse the same primitive instead
  of separate ports. If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001
  only on its explicitly named score/probability pointer. Selection, tie order, counts, statuses, money
  and provider requests remain exact. Six-decimal wire signals are compared after the source rounding,
  without widening tolerance.'
