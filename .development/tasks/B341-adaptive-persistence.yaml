deviations:
- what: Adaptive state/session aggregators each hold at most 1024 distinct keys; overflow attempts one
    bounded flush then warns and drops the new observation.
  why: The pinned dictionaries are unbounded. Keep failure recovery and 10-second cadence while bounding
    memory.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/update_queue.py#L41-L96
out_of_scope:
- Creating new database tables or silently changing numeric column types.
- Rolling schema migrations (B051).
- 'litellm/router_strategy/adaptive_router/adaptive_router.py: B339 owns: _default_prefs (L70-L72), AdaptiveRouter.__init__
  (L89-L115), AdaptiveRouter._init_cold_start_cells (L119-L124), AdaptiveRouter.async_pre_routing_hook
  (L169-L218), AdaptiveRouter.pick_model (L222-L239), AdaptiveRouter.get_state_snapshot (L241-L278), AdaptiveRouter._extract_min_quality_tier
  (L281-L309), AdaptiveRouter._eligible_models (L311-L318).'
- 'litellm/router_strategy/adaptive_router/adaptive_router.py: B340 owns: AdaptiveRouter.get_or_create_session_state
  (L322-L347), AdaptiveRouter._evict_expired_session_states (L349-L355), AdaptiveRouter.record_turn (L357-L487),
  AdaptiveRouter._persistable_session_snapshot (L490-L499), AdaptiveRouter._compute_bandit_delta (L502-L515).'
pitfalls:
- A retry after an ambiguous database commit can duplicate deltas, so B051 must provide transaction outcome
  handling or an idempotent batch mechanism without schema changes.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
