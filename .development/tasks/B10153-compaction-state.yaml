dod:
  - text: compaction_pending is true only for an existing armed state on a request client_managed lets through, and false for an absent or unarmed state and for each client-managed key, input item kind, encrypted_content item and encrypted_content block.
    proof: [pending-tests, oracle, helper-python]
  - text: initialize_compaction_state hands back the existing handle with its surface, or a new state holding only the surface, and a write through one clone is read through the other.
    proof: [initialize-tests]
  - text: The router_compaction section gives None without complexity_router_config, On with LiteLLM's defaults for a missing key, Off for false and null, and a load error naming the path for an out-of-bounds value, an empty model, an unknown key or true.
    proof: [config-tests]
  - text: New router-compaction config seeds with context_compaction replay through the bounded config parser.
    proof: [config-corpus]
  - text: New compaction-state seeds for b10153 replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: pending-tests
      why: compaction_pending ignores the state or misses one of LiteLLM's client-managed exclusions.
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^compaction_state::tests::pending_/)'
    - id: initialize-tests
      why: initialize_compaction_state copies or replaces an existing state, or a write does not reach every clone.
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^compaction_state::tests::initialize_/)'
    - id: config-tests
      why: context_compaction is not loaded, keeps the wrong default, or accepts a value LiteLLM refuses.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::router_compaction::/)'
    - id: config-corpus
      why: The new router-compaction seeds are missing, lack context_compaction, or do not replay.
      run: >-
        test -f crates/betterlite-config/fuzz/corpus/config_yaml/router-compaction-valid.yaml &&
        test -f crates/betterlite-config/fuzz/corpus/config_yaml/router-compaction-invalid.yaml &&
        git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml | grep -Fq "/router-compaction-" &&
        grep -Fq 'context_compaction' crates/betterlite-config/fuzz/corpus/config_yaml/router-compaction-valid.yaml &&
        test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: The b10153 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10153.py tools/oracle/helpers/b10153)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10153 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/compaction-state-*")" &&
        grep -lE '^[[:space:]]+b10153:' tools/oracle/fuzz/corpus/helper_case/compaction-state-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/compaction-state/armed-chat-request.yaml
  - tools/oracle/cases/helpers/compaction-state/unarmed-state.yaml
  - tools/oracle/cases/helpers/compaction-state/no-state.yaml
  - tools/oracle/cases/helpers/compaction-state/null-client-fields.yaml
