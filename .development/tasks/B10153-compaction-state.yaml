  - tools/oracle/cases/helpers/compaction-state/encrypted-content-block.yaml
  - tools/oracle/cases/helpers/compaction-state/string-input.yaml
deviations: []
out_of_scope:
  - "context_compaction.py: B336 owns surface_for_call (L68-L69), arm_compaction (L99-L123), _has_compactor (L126-L138), reject_recursive_compactor (L157-L159), _reject (L167-L170), _generate_summary (L317-L336), compact_to_fit (L360-L371), _check_client_managed_admission (L374-L387) and _compact_to_fit (L416-L515). It arms this state, picks the Summary handle, fills it and reads the config."
  - "context_compaction.py: B385 owns _unavailable (L173-L176), _blocks (L179-L181), _tool_ids (L184-L202), _history (L205-L232), _count (L235-L241), _budget (L244-L263), _compactor_model (L266-L297), _native_prefix (L300-L314), _compactor_input (L339-L357) and _portable_history (L390-L413)."
  - "context_compaction.py: B10084 owns CompactionExecutor.__call__ (L51-L53), native_compaction_call (L79-L86), native_compaction_parent (L89-L91) and is_native_compaction_call (L153-L154)."
  - "config.py: every other model and validator has the owner B332's out_of_scope names."
  - "Creating the state on each gateway call: B9810. Arming it in the pre-routing hook: B021 through B336. Asking the predicate in cache-aware routing: B3124."
  - "The pre-call checks and the context-window placement already take a plain compaction_pending bool (static_eligibility's RequestFacts and context_placement's request); whoever builds those records fills it from this predicate."
pitfalls:
  - "A missing `context_compaction` key means compaction on with every default, since the field's default_factory builds a ContextCompactionConfig; only `false` or `null` turns it off."
  - "client_managed reads only the `input` list, never `messages`: a chat request with encrypted or thinking blocks in its messages is still pending."
  - "The top-level checks are `is not None`, so `previous_response_id: null` or `conversation: null` leaves the request pending."
  - "initialize_compaction_state must hand back the same Arc; a fallback hop that gets a fresh state loses the first attempt's arming and summary."
  - "Keep each lock inside one function and never hand out a guard: B336 awaits the summary handle, and a guard held across that await blocks every other attempt of the call."
  - "trigger_ratio is open at both ends (0 and 1 are refused), max_tokens accepts 512 itself, and timeout_seconds refuses 0."
  - "An `input` entry or content block that is not an object matches nothing; LiteLLM raises a ValidationError there, which docs/compatibility.md covers as a value outside the declared type, so no case sends one."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
