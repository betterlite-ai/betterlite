id: B10153
title: Context compaction config and the pending compaction state
description: >-
  LiteLLM keeps one CompactionState per routed call in the request kwargs under `_context_compaction_state`. The router
  creates it when the call starts (router.py L7547-L7552), the pre-routing hook arms it with the complexity router's
  `context_compaction` settings, and three readers ask `compaction_pending(kwargs)` before they count or move a prompt:
  the router's pre-call checks, the complexity router's context-window placement and the proxy's cache-aware routing
  (cache_aware_routing.py L253). B336 arms the state and runs the summary; B3124's cache-aware routing needs only the
  predicate. This task builds the state, the config it holds and the predicate below both, so B3124 stops waiting for
  B336's summary work and B336 builds on the same state instead of a second one.


  The config. `context_compaction` sits in a deployment's `complexity_router_config` (config.py L844-L850 and
  L1335-L1343). Parse it in betterlite-config's section `router_compaction`
  (crates/betterlite-config/src/sections/router_compaction.rs, a stub already in the sections! list), reading
  `litellm_params.complexity_router_config` from every model_list entry the way sections::cache_cost_routing does.
  Settings are index-aligned with model_list: None for a deployment without complexity_router_config, otherwise
  `ContextCompaction::Off` for `false` or `null` (the `_normalize_context_compaction` validator turns null into False)
  and `ContextCompaction::On(ContextCompactionConfig)` for an object or a missing key, because the field's
  default_factory builds a config, so a complexity router compacts unless told not to. `ContextCompactionConfig` has
  `model: Option<String>` (default None, at least one character), `trigger_ratio: f64` (default 0.9, above 0 and below
  1), `max_tokens: i64` (default 4096, at least 512) and `timeout_seconds: f64` (default 120, above 0). An unknown key
  inside the object (extra="forbid"), `true`, or a value outside a bound is a load error naming its path, for example
  `model_list.0.litellm_params.complexity_router_config.context_compaction.trigger_ratio`, as cache_cost_routing does for
  its timeout. Resolve `os.environ/` values with the same resolve helpers cache_cost_routing uses.


  The state. Module compaction_state in betterlite-router: crates/betterlite-router/src/compaction_state.rs, tests in
  compaction_state/tests.rs; the file is an empty stub lib.rs already declares. `CompactionState<Summary>` has LiteLLM's
  five fields (L59-L65): `config: Option<ContextCompactionConfig>`, `candidates: Vec<String>`, `summary: Option<(String,
  Summary)>`, `parent_model: Option<String>` and `surface: Option<Surface>`, where Surface is B385's
  `compaction_history::contracts::Surface`. `Summary` is the handle B336 stores for the call's one summary task (the
  asyncio.Task[str] next to the history hash). Its error carries the router error that B3545's CompactionRouter leaves as
  an associated type, so this module takes the handle as a type parameter and never reads it. betterlite's request
  kwargs are a typed JSON map (`router_predicates::JsonMap`) that cannot hold the state, so it travels beside them as
  `SharedCompactionState<Summary>`, an `Arc<std::sync::Mutex<CompactionState<Summary>>>`. Every fallback hop and attempt
  of one call holds a clone, so B336's arming and summary writes reach all of them, as LiteLLM's writes to the shared
  object do. Take a poisoned lock back with PoisonError::into_inner, as latency_observations does.


  The functions. `initialize_compaction_state(existing: Option<&SharedCompactionState<Summary>>, surface: Surface) ->
  SharedCompactionState<Summary>` (L94-L96) returns a clone of the existing handle with nothing changed, its surface
  included, and otherwise a new state with only the surface set. `client_managed(payload: &JsonMap) -> bool`
  (L141-L150) is true when `previous_response_id`, `conversation`, `context_management` or `compaction` is present and
  not null, or when an item of the `input` list has `type` reasoning, compaction or item_reference, a non-null
  `encrypted_content`, or a `content` block whose `type` is encrypted_content. It is public because B336's
  arm_compaction and compact_to_fit call it as well. `compaction_pending(state: Option<&SharedCompactionState<Summary>>,
  payload: &JsonMap) -> bool` (L162-L164) is true only when the state exists, its config is Some and client_managed is
  false. Read string fields with B385's `compaction_history::blocks::field_text`.


  Oracle helper b10153. Its input has `state` (absent, unarmed or armed) and a request `payload`, and it answers
  `{pending: bool}`. The Python side copies the payload, puts `CompactionState(config=ContextCompactionConfig() if armed
  else None)` under the literal key `_context_compaction_state` unless the state is absent, and calls LiteLLM's public
  compaction_pending. The Rust side builds the same state with `ContextCompactionConfig`'s defaults and `Summary = ()`
  and calls compaction_pending here.


  Tests. compaction_state::tests::pending_* cover the predicate: absent, unarmed and armed states, and each
  client_managed exclusion, each top-level key with a value and with null, each input item kind, an encrypted_content
  item and an encrypted_content block, a string `input`, and an encrypted block inside `messages` that still leaves the
  request pending. compaction_state::tests::initialize_* cover the handle: Arc::ptr_eq on reuse, the existing surface
  kept, a fresh state's empty fields, and a write through one clone read through another. sections::router_compaction
  tests load each form: no complexity_router_config, a missing key, false, null, a full object, each bound just inside
  and just outside, an empty model, an unknown key, `true` and an os.environ/ value.
