id: B629
title: Bedrock TwelveLabs Marengo 2.7 embeddings
description: >-
  Add MarengoInput/Reply and async wrapper with explicit video/audio/text/image inputs, bucket-owner metadata, timed
  media options and billed-unit usage projection. Parse dimensions and vectors through existing exact embedding
  types; provider usage counts are retained for cost accounting without prices.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/twelvelabs_marengo_transformation.py:
  MarengoInvokeResponse.vectors L48-L53; _billed_units L74-L89; _billed_usage L92-L101; drop_params_enabled L119-L120;
  TwelveLabsMarengoEmbeddingConfig.__init__ L135-L136; TwelveLabsMarengoEmbeddingConfig.get_supported_openai_params
  L138-L141; TwelveLabsMarengoEmbeddingConfig.map_openai_params L143-L170; TwelveLabsMarengoEmbeddingConfig._extract_bucket_owner_from_params
  L172-L176; TwelveLabsMarengoEmbeddingConfig._is_s3_url L178-L180; TwelveLabsMarengoEmbeddingConfig._transform_request
  L182-L272; TwelveLabsMarengoEmbeddingConfig._wrap_async_invoke_request L274-L308; TwelveLabsMarengoEmbeddingConfig._transform_response
  L310-L319; TwelveLabsMarengoEmbeddingConfig._transform_async_invoke_response L321-L367.


  Reuse build_marengo_3_request from B630 (litellm/llms/bedrock/embed/twelvelabs_marengo_3_transformation.py); its
  implementation remains with that prerequisite.


  Reuse is_marengo_3_model from B630 (litellm/llms/bedrock/embed/twelvelabs_marengo_3_transformation.py); its implementation
  remains with that prerequisite.


  Named case contracts: marengo_text_input: Construction detects B630 marker marengo-embed-3- anywhere, case-sensitively.
  Supported params are encoding_format,embeddingOption,startSec,input_type,endSec,segmentation,embeddingType,embeddingScope,inferenceId,media_source,media_sources,
  with textTruncate,lengthSec,useFixedLengthSec,minClipSec appended for 2.7 only. Map encoding_format=float to embeddingOption=[visual-text,visual-image]
  only for 2.7; other encodings are ignored. Map input_type to inputType, and pass through textTruncate,embeddingOption,startSec,lengthSec,useFixedLengthSec,minClipSec,endSec,segmentation,embeddingType,embeddingScope,inferenceId,media_source,media_sources.
  Mapping preserves order, so a later embeddingOption overrides the synthesized value. Choose truthy inputType then
  input_type then text; 2.7 text emits inputText and default textTruncate=end only when absent. marengo_s3_video_owner:
  Video/audio require async_invoke_route or raise ValueError Input type '{input_type}' requires async_invoke route.
  Use model format: 'bedrock/async_invoke/model_id'. This guard precedes the Marengo 3 builder. For 2.7 image/video/audio,
  exact s3:// input produces mediaSource.s3Location.uri; add bucketOwner only when truthy, with absent default empty
  string. Despite the docstring, S3 images are allowed on the synchronous route. Unknown 2.7 input types pass through
  without a core input payload. marengo_image_input: For non-S3 2.7 media, data: strings containing a comma retain
  everything after the first comma; data: without a comma passes unchanged. Other strings call B183 get_base64_str,
  which keeps only the second component when commas occur. Emit mediaSource.base64String without decoding or URL
  downloads. Copy all inference fields except inputType,input_type,inputText,mediaSource,bucketOwner, so core fields
  cannot be overridden; output_s3_uri is not filtered here. Marengo 3 delegates B630 building before optional wrapping.
  marengo_async_output_wrapper: Wrap only when both async_invoke_route and model_id are truthy. Percent-decode model,
  then if it starts async_invoke/ remove every occurrence of that substring. Missing, empty or whitespace-only output_s3_uri
  raises ValueError output_s3_uri cannot be empty for async invoke requests. Keep a nonempty URI exactly, including
  surrounding whitespace, without scheme validation. Emit modelId,modelInput,outputDataConfig.s3OutputDataConfig.s3Uri.
  Async response mirrors B628: one empty index-0 object=embedding, zero prompt/total tokens, unchanged model and
  HiddenParams._invocation_arn from invocationArn default empty string, with None preserved. marengo_segments_vector_list:
  Validate response_list as a tuple of frozen extra-ignore MarengoInvokeResponse records: data and embeddings default
  empty tuples; embedding defaults None; nested items default embedding None. Coerce numeric vector items as source
  Pydantic float validation does and preserve validation failures. For each response, nonempty data wins even if
  every item embedding is None; otherwise direct embedding wins when not None, including an empty vector; otherwise
  use embeddings. Filter only None vectors, flatten in order, assign contiguous indices/object=embedding and preserve
  model. marengo_billed_units: Validate batch_data or empty tuple as extra-ignore records with inputType optional
  enum text,image,video,audio,text_image,multi_input and optional multi_input record; its inputText defaults None
  and mediaSources empty. text contributes (query=1,image=0), image (0,1), text_image (1,1); multi_input contributes
  one query only for truthy inputText and len(mediaSources) images; video/audio/None contribute zero. Invalid enums
  or nested shapes preserve Pydantic errors. Usage prompt/completion/total tokens are zero; details are None if
  both sums are zero, otherwise query_count and image_count each use None for zero. Counts do not depend on vector
  count. drop_unsupported_param: drop_params_enabled is true only when global litellm.drop_params is literally True
  or the deployment mapping drop_params is literally True; truthy strings and integer 1 are not enough. Reuse B2201/B176
  configuration ownership. This helper chooses a flag; B630 owns the rejection/drop outcomes and does not warn on
  a drop.


  Implement crates/betterlite-bedrock/src/marengo_embeddings.rs with adjacent tests under marengo_embeddings/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_marengo_embeddings in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function marengo_embeddings_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): marengo_text_input, marengo_s3_video_owner, marengo_image_input, marengo_async_output_wrapper, marengo_segments_vector_list,
  marengo_billed_units, drop_unsupported_param. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_marengo_embeddings* using HelperCase:
  kind: helper and the externally tagged bedrock_other_marengo_embeddings variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_marengo_embeddings that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 221 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 250 production lines, 270 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 655 planned, 675 maximum changed lines.
