id: B1015
title: File contracts
description: >-
  Define typed file upload/list/object/content operation records and base provider preparation, plus MIME/file-extension
  tables and batch-file detection. Reuse B010/B004 wire types, preserve typed binary content streams and list pagination,
  and expose configured transport plans to later file calls.


  Implement crates/betterlite-core/src/api/file_contracts.rs, crates/betterlite-openai/src/api/file_contracts.rs,
  crates/betterlite-provider/src/api/file_contracts.rs. Use FileContractsInput and FileContractsResult with typed
  nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions batch_jsonl_purpose, list_next_page, file_content_stream_contract,
  upload_method_capability under api::file_contracts::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-openai::api::file_contracts::decode_file_contracts(bytes: &[u8],
  limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/file_contracts.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-openai/fuzz/fuzz_targets/file_contracts.rs passes arbitrary bounded bytes to that exact decoder;
  api::file_contracts::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  Register HelperCall::FileContracts in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_contracts: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/files/utils.py: FilesAPIUtils.is_batch_jsonl_file (L29-L37); litellm/files/utils.py:
  FilesAPIUtils.is_batch_jsonl_request (L40-L49); litellm/files/utils.py: FilesAPIUtils.valid_content_type (L52-L57);
  litellm/llms/base_llm/files/transformation.py: BaseFileUploadStream.iter_bytes (L51-L51); litellm/llms/base_llm/files/transformation.py:
  BaseFilesConfig.custom_llm_provider (L57-L58); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.file_upload_http_method
  (L61-L68); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.get_supported_openai_params (L71-L72);
  litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.get_complete_file_url (L74-L89); litellm/llms/base_llm/files/transformation.py:
  BaseFilesConfig.transform_create_file_request (L92-L106); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_create_file_response
  (L109-L116); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_retrieve_file_request (L119-L125);
  litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_retrieve_file_response (L128-L134); litellm/llms/base_llm/files/transformation.py:
  BaseFilesConfig.transform_delete_file_request (L137-L143); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_delete_file_response
  (L146-L152); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_list_files_request (L155-L161);
  litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_list_files_next_request (L163-L170);
  litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_list_files_response (L173-L179); litellm/llms/base_llm/files/transformation.py:
  BaseFilesConfig.transform_file_content_request (L182-L188); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_file_content_response
  (L191-L197); litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_file_content_stream (L199-L209);
  litellm/llms/base_llm/files/transformation.py: BaseFilesConfig.transform_request (L211-L221); litellm/llms/base_llm/files/transformation.py:
  BaseFilesConfig.transform_response (L223-L239); litellm/llms/base_llm/files/transformation.py: BaseFileEndpoints.acreate_file
  (L244-L252); litellm/llms/base_llm/files/transformation.py: BaseFileEndpoints.afile_retrieve (L255-L261); litellm/llms/base_llm/files/transformation.py:
  BaseFileEndpoints.afile_list (L264-L273); litellm/llms/base_llm/files/transformation.py: BaseFileEndpoints.afile_delete
  (L276-L283); litellm/llms/base_llm/files/transformation.py: BaseFileEndpoints.afile_content (L286-L293). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 257 owned nonblank/non-comment/non-docstring Python lines (302 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 277 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  46 wiring; 585 total within the 590-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B010 (Provider framework, provider resolution
  and parameter mapping), B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B1128 (File
  type and MIME records). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
