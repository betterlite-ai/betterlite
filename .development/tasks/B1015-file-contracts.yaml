deviations: []
out_of_scope:
- B1128 owns the imported files/types.py and types/files.py DTO declarations, upload plans and streaming records; B1015 only consumes those typed values.
- B2202 owns BaseConfig.get_complete_url at chat/transformation.py:292-310. B1015 forwards api_base, api_key, model, optional_params and litellm_params and preserves its ValueError("api_base is required") for api_base=None; it does not reimplement URL construction.
- BaseFilesConfig.transform_request and transform_response are inherited chat-interface stubs with no file-operation caller at the pin; they are out of scope because there is no caller at the pin, including their literal AudioTranscriptionConfig NotImplementedError messages.
- BaseFileEndpoints.acreate_file's absent-hook call site belongs to B1032, afile_content's call site belongs to B1033, and afile_retrieve and afile_list call sites belong to B1034; the B087 task composes those route factories. No B1031 or B1027 task owns these specific BaseFileEndpoints calls.
- Provider-specific implementations of the abstract file transforms and OpenAI wire decoding belong to the provider leaves and file route tasks; this task defines only the shared method surface and executable base defaults.
- The abstract BaseFileEndpoints methods have no MIT implementation and therefore have no base error response, database write or warning to reproduce here; caller-specific behavior stays with B1032, B1033, B1034 and B087.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_contracts in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/file_contracts.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_contracts.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- MIME comparison uses the six literal strings without lowercasing or stripping parameters, so "TEXT/PLAIN" and "application/json;charset=utf-8" are rejected.
- Both batch predicates test is not None rather than truthiness, so b"" counts as present content and an empty file value counts as present metadata.
- is_batch_jsonl_request only inspects the file field and never reads a lazy handle; consuming it in the predicate changes the contract.
- get_complete_file_url accepts data but deliberately omits it from B2202's get_complete_url call; forwarding data changes the spy-visible argument set.
- transform_file_content_stream also accepts request_url, logging_obj and litellm_params but returns only the original stream_iterator and headers, without eager reads or transformation.
- transform_list_files_next_request returns None even when the response advertises has_more=true; pagination is an override supplied by a provider.
- iter_bytes must create an independent iterator on each call because retrying an exhausted iterator yields no upload bytes.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
