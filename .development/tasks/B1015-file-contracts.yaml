id: B1015
title: File provider contracts and batch detection
description: >-
  Add the file-provider contract types in betterlite-provider::api::file_contracts and the
  FilesAPIUtils predicates in betterlite-core::api::file_contracts. Keep the public inputs as
  the existing OpenAI file DTOs, TwoStepFileUploadConfig, FileContentStreamingResult,
  UserAPIKeyAuth, LlmProviders and provider operation types from B010; do not add a JSON record
  type, a second decoder, a route, or a network client. B1128 remains the owner of the upload
  plans and streaming records consumed by these contracts.

  Implement BaseFileUploadStream.iter_bytes as a replayable capability: every call returns a
  fresh Iterator[bytes]. Implement BaseFilesConfig.custom_llm_provider,
  get_supported_openai_params, transform_create_file_request/response,
  transform_retrieve_file_request/response, transform_delete_file_request/response,
  transform_list_files_request/response and transform_file_content_request/response as typed
  provider hooks. Its executable defaults are file_upload_http_method -> "POST",
  transform_list_files_next_request -> None for every response, and
  transform_file_content_stream -> FileContentStreamingResult containing the supplied
  stream_iterator and headers unchanged. get_complete_file_url passes api_base, api_key, model,
  optional_params and litellm_params to B2202's BaseConfig.get_complete_url exactly once and
  does not pass its data argument. BaseFileEndpoints exposes typed abstract hooks for create,
  retrieve, list, delete and content; it does not instantiate an enterprise hook.

  Port FilesAPIUtils.valid_content_type, is_batch_jsonl_file and is_batch_jsonl_request with the
  exact six accepted MIME strings: application/jsonl, application/json, application/octet-stream,
  application/x-ndjson, application/x-jsonlines and text/plain. Matching is exact and
  case-sensitive. The extracted predicate requires purpose == "batch", an accepted content_type,
  and content is not None; the metadata-only predicate requires purpose == "batch", an accepted
  content_type, and file is not None, without reading the file. The owned code has no environment
  variable, config key, query parameter, status/type/message/param/code error, database write or
  warn-and-drop branch. Register only pure helper cases; no byte decoder, HTTP case or provider
  call is needed. Count the 193 nonblank, non-comment source lines in the two pinned ranges and
  allow 190 implementation, 110 tests, 80 cases, 80 adapters and 40 operation-wiring lines.
