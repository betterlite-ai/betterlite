checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai -p betterlite-provider --no-tests=fail
      -E 'test(/^api::file_contracts::/) - test(/::replays_corpus$/)'
  - id: case-batch-jsonl-purpose
    why: the batch-jsonl-purpose behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_contracts::tests::batch_jsonl_purpose($|::)/)'
  - id: case-list-next-page
    why: the list-next-page behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_contracts::tests::list_next_page($|::)/)'
  - id: case-file-content-stream-contract
    why: the file-content-stream-contract behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_contracts::tests::file_content_stream_contract($|::)/)'
  - id: case-upload-method-capability
    why: the upload-method-capability behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_contracts::tests::upload_method_capability($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/file_contracts)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/file_contracts.rs && grep -qF "decode_file_contracts"
      crates/betterlite-openai/fuzz/fuzz_targets/file_contracts.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::file_contracts::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_contracts.py && uv run --locked --project tools/oracle/litellm ruff check
      tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_contracts-*)"
      && grep -qE "^[[:space:]]+file_contracts:" tools/oracle/fuzz/corpus/helper_case/file_contracts-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-contracts)"
