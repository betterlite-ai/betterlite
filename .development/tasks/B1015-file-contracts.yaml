  why: These three predicates define the purpose, MIME and non-None presence checks.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/files/transformation.py#L38-L209
  why: BaseFileUploadStream and BaseFilesConfig contain the file hook signatures and the POST, no-next-page and stream/header pass-through defaults.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/files/transformation.py#L242-L293
