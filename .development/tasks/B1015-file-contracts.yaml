- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/chat/transformation.py#L292-L310
  why: B2202 owns the BaseConfig.get_complete_url primitive forwarded by get_complete_file_url, including ValueError("api_base is required") when api_base is None.
dod:
- text: >-
    batch_extracted_predicate sends purpose="batch" with each accepted MIME literal and
    content=b"": is_batch_jsonl_file returns true for all six. The same six inputs with
    content=None return false. purpose="assistants", purpose="Batch", purpose=None, or an
    absent purpose returns false even with content_type="text/plain" and content=b"". MIME
    values None, "text/csv", "TEXT/PLAIN" and "application/json;charset=utf-8" return false.
  proof: [case-batch-extracted, oracle, behavior-tests, helper-python]
- text: >-
    batch_metadata_predicate sends purpose="batch" and content_type="text/plain": file=b""
    and file="upload.bin" each return true, while file=None and an absent file return false.
    A lazy file sentinel whose read method would fail is accepted without calling read. Any
    absent or non-batch purpose or the MIME values "text/csv", "TEXT/PLAIN" and
    "application/json;charset=utf-8" returns false.
  proof: [case-batch-metadata, oracle, behavior-tests, helper-python]
- text: >-
    base_defaults constructs a concrete BaseFilesConfig with its abstract hooks implemented:
    file_upload_http_method is exactly "POST". Calling transform_list_files_next_request with
    a response whose JSON contains {"has_more": true}, optional_params={"after": "f"} and
    litellm_params={"cursor": "c"} returns None and performs no second request.
  proof: [case-base-defaults, oracle, behavior-tests]
- text: >-
    file_url_forwarding calls get_complete_file_url with api_base="https://mock.invalid/v1",
    api_key="sk-test", model="file-model", optional_params={"purpose": "batch"},
    litellm_params={"custom_llm_provider": "openai"} and data={"filename": "ignored"}.
    The B2202 URL spy receives the first five values exactly once, receives no data argument,
    and its return value "https://mock.invalid/v1/files" is returned unchanged. With
    api_base=None, B2202's ValueError message is exactly "api_base is required".
  proof: [case-file-url-forwarding, oracle, behavior-tests]
- text: >-
    stream_passthrough_and_replay supplies an async stream yielding b"a" then b"\x00\xff",
    headers={"content-type": "text/plain", "x-provider": "test"}, request_url="u",
    logging_obj="log" and litellm_params={"k": "v"}; transform_file_content_stream returns
    FileContentStreamingResult with the same stream sequence and header values and does not
    eagerly consume the stream. A concrete BaseFileUploadStream yielding b"abc" returns a new
    iterator on each iter_bytes call; consuming the first iterator does not move the second.
  proof: [case-stream-passthrough, oracle, behavior-tests]
- text: >-
    contract_surface compiles the BaseFilesConfig and BaseFileEndpoints abstract surfaces with
    the exact file request/response argument and return types, including FileDeleted,
    FileListPage, OpenAIFileObject and FileContentStreamingResult. The concrete fixture cannot
    omit any abstract hook, while the abstract endpoint fixture creates no hook instance.
  proof: [case-contract-surface, behavior-tests]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: A file-contract production behavior test or its typed contract assertions are absent.
    run: cargo nextest run --locked -p betterlite-provider -p betterlite-core --no-tests=fail -E 'test(/^api::file_contracts::/) - test(/::replays_corpus$/)'
  - id: case-batch-extracted
    why: The extracted-content purpose, MIME and non-None behavior is absent or changed.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_contracts::tests::batch_extracted_predicate($|::)/)'
  - id: case-batch-metadata
    why: The metadata-only file presence behavior is absent or reads the lazy file.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_contracts::tests::batch_metadata_predicate($|::)/)'
  - id: case-base-defaults
    why: POST or the no-next-page default is absent or changed.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::file_contracts::tests::base_defaults($|::)/)'
  - id: case-file-url-forwarding
    why: The file URL forwarder drops an argument, forwards data, or changes the B2202 error.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::file_contracts::tests::file_url_forwarding($|::)/)'
  - id: case-stream-passthrough
    why: The stream/header pass-through or fresh upload iterator behavior is absent or changed.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::file_contracts::tests::stream_passthrough_and_replay($|::)/)'
  - id: case-contract-surface
    why: A required abstract file hook or return type is missing.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::file_contracts::tests::contract_surface($|::)/)'
  - id: helper-python
    why: The independent pinned helper adapter is missing or fails its strict Python checks.
    run: test -f tools/oracle/helpers/file_contracts.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: No added file-contract helper seed reaches the shared helper-case replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_contracts-*)" && grep -qE '^[[:space:]]+file_contracts:' tools/oracle/fuzz/corpus/helper_case/file_contracts-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: The named batch and base-contract parity fixtures were not added.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-contracts)"
