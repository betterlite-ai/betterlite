id: B7740
title: Swagger UI, ReDoc and OAuth2 redirect pages with the bundled swagger assets
description: >-
  Serve LiteLLM's interactive API docs from betterlite. Today the proxy builds a FastAPI app with
  `docs_url=_get_docs_url()`, `redoc_url=_get_redoc_url()` and `openapi_url=_get_openapi_url()`, mounts the folder
  `litellm/proxy/swagger` at `/swagger`, and replaces FastAPI's `get_swagger_ui_html` so the page loads the bundled
  `swagger-ui-bundle.js`, `swagger-ui.css` and `favicon.png` from `<server_root_path>/swagger/` instead of a CDN.
  This task builds the same pages and the same static mount. It does not build the schema that `/openapi.json` returns
  (B123 does) and it does not register `/openapi.json`.


  Part 1, library code in the existing crate betterlite-openapi, two new modules. Module `docs_settings`: a plain struct
  `DocsEnv { docs_url, redoc_url, openapi_url, no_docs, no_redoc, no_openapi, root_redirect_url }`, all `Option<String>`,
  which the server wiring fills from the process environment (`DOCS_URL`, `REDOC_URL`, `OPENAPI_URL`, `NO_DOCS`,
  `NO_REDOC`, `NO_OPENAPI`, `ROOT_REDIRECT_URL`), and `DocsEnv::resolve(&self) -> DocsUrls` with `DocsUrls { docs_url,
  redoc_url, openapi_url, root_redirect_url }` (all `Option<String>`). The rule for each of the three urls is the one in
  `_get_docs_url`, `_get_redoc_url` and `_get_openapi_url`: a non-empty explicit value wins (an empty string counts as
  unset, because the source uses `if value := os.getenv(...)`); otherwise, if the matching `NO_*` value is a true boolean
  string, the url is None; otherwise the default (`/` for docs, `/redoc`, `/openapi.json`). The boolean string follows
  `str_to_bool`: trim, lowercase, and only `true` or `false` are recognized, anything else counts as false here.
  Module `docs_pages`: pure functions that return the page bodies as `String`, and the embedded assets. `swagger_ui_page(
  &SwaggerPageInputs) -> String` renders the page FastAPI's `get_swagger_ui_html` renders (read it in the FastAPI
  version pinned by the oracle environment, tools/oracle/litellm/.venv/lib/python3.13/site-packages/fastapi/openapi/docs.py)
  with `swagger_js_url`, `swagger_css_url` and `swagger_favicon_url` set to `<swagger_base>/swagger-ui-bundle.js`,
  `<swagger_base>/swagger-ui.css` and `<swagger_base>/favicon.png`, then applies LiteLLM's one text edit: the first
  occurrence of `const ui = SwaggerUIBundle({` becomes `const ui = SwaggerUIBundle({tagsSorter:"alpha",`. `SwaggerPageInputs
  { title, openapi_url, oauth2_redirect_url: Option<String>, swagger_base }`, where openapi_url is already prefixed with the
  root path by the caller. `redoc_page(title, openapi_url) -> String` renders `get_redoc_html` with its default CDN urls
  and Google Fonts on. `oauth2_redirect_page() -> &'static str` is the fixed body of
  `get_swagger_ui_oauth2_redirect_html`. `swagger_asset(name: &str) -> Option<SwaggerAsset>` returns the embedded bytes
  and content type for exactly the four names `swagger-ui-bundle.js`, `swagger-ui.css`, `favicon.png` and `favicon.ico`;
  any other name, including paths with `/` or `..`, returns None. The four files are copied byte for byte from LiteLLM
  into crates/betterlite-openapi/assets/swagger/ and embedded with `include_bytes!`. Content types are what Python's
  `mimetypes` gives Starlette's StaticFiles: `text/javascript`, `text/css`, `image/png`, `image/vnd.microsoft.icon`.


  Part 2, routes, in betterlite-server: module `docs_routes` with `docs_router(config: DocsRouteConfig) -> axum::Router`.
  `DocsRouteConfig { urls: DocsUrls, title: String, server_root_path: String }`. The router follows FastAPI's rules for
  `FastAPI.setup()`: the swagger page is a GET at `docs_url` only when both `openapi_url` and `docs_url` are Some; the
  OAuth2 redirect page is a GET at `/docs/oauth2-redirect` only when the swagger page is registered (that is FastAPI's
  default `swagger_ui_oauth2_redirect_url`); the ReDoc page is a GET at `redoc_url` only when both `openapi_url` and
  `redoc_url` are Some. The swagger page title is `<title> - Swagger UI`, the ReDoc title is `<title> - ReDoc`, and the
  page's `openapi_url` is `<server_root_path with trailing / removed><openapi_url>`; the OAuth2 redirect url handed to the
  page is `<same prefix>/docs/oauth2-redirect`. `swagger_base` is `<server_root_path>/swagger` where the root path gets a
  trailing `/` first when it lacks one (`mount_swagger_ui`: an empty root path gives `/swagger`, `/api` gives `/api/swagger`).
  The static mount serves GET and HEAD at `/swagger/<name>` from `swagger_asset`, and a miss is a 404 in Starlette's plain-text shape (see pitfalls). Last, proxy_server.py L2563-L2569: when `docs_url` is not `/` and `root_redirect_url` is Some, `GET /` redirects to it with
  status 307. None of these routes asks for authentication. This task builds them in docs_router; B8681 mounts it and owns their HTTP
  oracle cases. The server's Cargo.toml needs `betterlite-openapi` as a path dependency; the architect adds that line in
  the skeleton, so it is not in the scope below.
