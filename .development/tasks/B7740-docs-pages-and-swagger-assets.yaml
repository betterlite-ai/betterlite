dod:
  - text: >-
      The four swagger files under crates/betterlite-openapi/assets/swagger/ are byte-identical to LiteLLM's
      (sha256 of swagger-ui-bundle.js bd2c846c71b05d9147f51a5b42a51e300ea7319be5c6709e95b6d04094ada51f, swagger-ui.css
      8f33d996025317049d4a9864f421eab2b2a247872f388026fa94c654913259e7, favicon.png
      dfffbe29386e7b1d3c4f01706c835236b815d5b3aeb00d32e1a15eb51d697646, favicon.ico
      1ca8443fd2c22c0b250857cbc29907cb39fe39589b36280a08f4ff386b9299ac).
    proof: [swagger-asset-hashes]
  - text: >-
      DocsEnv::resolve picks an explicit non-empty DOCS_URL, REDOC_URL or OPENAPI_URL first, then None for a true NO_DOCS,
      NO_REDOC or NO_OPENAPI ("True", " true " count; "yes", "1" and "" do not), then the defaults "/", "/redoc" and
      "/openapi.json". An empty DOCS_URL with NO_DOCS=true gives None.
    proof: [docs-settings-tests]
  - text: >-
      swagger_ui_page output equals FastAPI's get_swagger_ui_html output with the three asset urls under the swagger base
      and the tagsSorter edit applied once, for an empty root path and for root path /api (assets under /api/swagger,
      openapi url /api/openapi.json, oauth2 redirect url window.location.origin + '/api/docs/oauth2-redirect').
    proof: [docs-pages-tests, oracle]
  - text: >-
      redoc_page and oauth2_redirect_page match FastAPI's bodies, and swagger_asset returns None for any name other than
      the four files (including "../x", "a/b", "" and "SWAGGER-UI.CSS").
    proof: [docs-pages-tests, oracle]
  - text: >-
      docs_router answers GET / with the swagger page (200, text/html; charset=utf-8), GET /redoc with the ReDoc
      page, GET /docs/oauth2-redirect with the redirect page, and GET /swagger/swagger-ui.css with the CSS bytes and
      content type text/css; a missing /swagger file is a 404, a POST to a docs page is 405.
    proof: [docs-routes-tests]
  - text: >-
      With NO_DOCS=true the swagger and OAuth2 redirect routes are absent (404), with NO_REDOC=true the ReDoc route is
      absent, with NO_OPENAPI=true none of the three pages exist, and with DOCS_URL=/docs plus ROOT_REDIRECT_URL set,
      GET / answers 307 with that location while /docs serves the page.
    proof: [docs-routes-tests]
  - text: docs_router is tested with tower's oneshot over its own Router; B8681 mounts it through app::edge::mount_public and proves the HTTP answers with the oracle cases moved there.
    proof: [docs-routes-tests]
checks:
  optional: []
  commands:
    - id: swagger-asset-hashes
      why: the embedded assets must be LiteLLM's files, byte for byte
      run: >-
        printf '%s\n'
        'bd2c846c71b05d9147f51a5b42a51e300ea7319be5c6709e95b6d04094ada51f  crates/betterlite-openapi/assets/swagger/swagger-ui-bundle.js'
        '8f33d996025317049d4a9864f421eab2b2a247872f388026fa94c654913259e7  crates/betterlite-openapi/assets/swagger/swagger-ui.css'
        'dfffbe29386e7b1d3c4f01706c835236b815d5b3aeb00d32e1a15eb51d697646  crates/betterlite-openapi/assets/swagger/favicon.png'
        '1ca8443fd2c22c0b250857cbc29907cb39fe39589b36280a08f4ff386b9299ac  crates/betterlite-openapi/assets/swagger/favicon.ico'
        | sha256sum -c -
    - id: docs-settings-tests
      why: url resolution tests fail or are missing
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^docs_settings::/)'
    - id: docs-pages-tests
      why: page rendering and asset lookup tests fail or are missing
      run: cargo nextest run --locked -p betterlite-openapi --no-tests=fail -E 'test(/^docs_pages::/)'
    - id: docs-routes-tests
      why: route registration rules (which routes exist under which settings) fail or are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^docs_routes::/)'
oracle_cases:
  - tools/oracle/cases/helpers/docs-pages/swagger-page-root-path.yaml
  - tools/oracle/cases/helpers/docs-pages/docs-url-resolution.yaml
deviations:
  - what: The Swagger page has no LazyLoadPlugin and POST /lazy/warm/<tag> does not exist. The page keeps only the `tagsSorter:"alpha"` edit.
    why: LiteLLM loads some route groups on first use and the plugin warms them from the browser. betterlite registers every route at startup, so there is nothing to warm and no "(expand to load routes)" hint to show.
  - what: Responses for /swagger files carry content-type and content-length but no last-modified, etag or accept-ranges headers, and a conditional request always gets the full body.
    why: The files are embedded in the binary, so there is no file time to report. The oracle cases ignore those three headers.
  - what: The OpenAPI url, asset urls and OAuth2 redirect url use the scalar SERVER_ROOT_PATH, not the per-request prefix that SERVER_ROOT_PATHS picks.
    why: FastAPI reads scope root_path, which the per-request middleware rewrites. This task has no access to that value; the open question is in the planner notes and for now the scalar value is used.
out_of_scope:
  - "B123 owns the schema document served at openapi_url, its route and the root-path `servers` entry. This task never registers openapi_url."
  - "The filesystem mount in mount_swagger_ui (os.path.join(current_dir, \"swagger\") and StaticFiles) becomes the embedded swagger_asset lookup."
  - "DOCS_TITLE and DOCS_DESCRIPTION branding in proxy_server.py L1044-L1051 apply only when premium_user is true (enterprise license); betterlite has no license check, so the title is the fixed LiteLLM API title B123 passes in."
  - "_get_docs_url, _get_redoc_url and _get_openapi_url have no Rust owner at the pin of this plan (no crate on main has them); this task builds them in docs_settings, so a later task must not build them again."
pitfalls:
  - An empty DOCS_URL, REDOC_URL or OPENAPI_URL is unset, because the source tests the walrus value for truth. DOCS_URL="" with NO_DOCS=true still gives None.
  - NO_DOCS, NO_REDOC and NO_OPENAPI go through str_to_bool, which only knows "true" and "false" after trim and lowercase. NO_DOCS=1 or NO_DOCS=yes does not disable the page.
  - The default docs_url is "/", not "/docs". The OAuth2 redirect page is still at "/docs/oauth2-redirect" because FastAPI's swagger_ui_oauth2_redirect_url defaults to that.
  - FastAPI registers the OAuth2 redirect route only when the swagger route exists, and the ReDoc route needs openapi_url too, so NO_OPENAPI=true removes all three pages.
  - The asset urls inside the page get a trailing-slash join (`/` + `swagger`, or `/api` becomes `/api/` + `swagger`), while the openapi url strips the trailing slash of the root path before adding `/openapi.json`. A root path of `/api/` must give `/api/swagger` and `/api/openapi.json`.
  - The replace edit hits only the first `const ui = SwaggerUIBundle({`, and a page with that text missing is returned unchanged, not an error.
  - Starlette's mount answers `/swagger` (no slash) with a 307 redirect to `/swagger/`, `/swagger/` itself with 404, and a path with `..` or a nested `/` with 404; mirror those with oracle cases, not guesses.
  - A missing static file is Starlette's plain 404 with body `Not Found` and content-type text/plain, not the proxy's JSON error shape. A POST to a file is 405 with `Method Not Allowed` and an allow header of GET, HEAD.
  - favicon.ico is in the swagger folder but the page links only favicon.png; both are still served.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
