id: B547
title: Azure container video and vector-store endpoints
description: >-
  Add Azure resource URL policy overrides over the already typed OpenAI container/video/vector operations. Preserve
  api-version extraction from config/query, normalized OpenAI prefixes and model fields; these adapters reuse request/response
  parsers rather than adding parallel schemas.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/containers/transformation.py:
  AzureContainerConfig.validate_environment L27-L35; AzureContainerConfig._normalize_api_base L38-L47; AzureContainerConfig._extract_api_version
  L50-L54; AzureContainerConfig.get_complete_url L56-L83. litellm/llms/azure/videos/transformation.py: AzureVideoConfig.__init__
  L28-L29; AzureVideoConfig.get_supported_openai_params L31-L43; AzureVideoConfig.map_openai_params L45-L52; AzureVideoConfig.validate_environment
  L54-L75; AzureVideoConfig.get_complete_url L77-L91. litellm/llms/azure/vector_stores/transformation.py: AzureOpenAIVectorStoreConfig.get_complete_url
  L7-L16; AzureOpenAIVectorStoreConfig.validate_environment L18-L19.


  Reuse BaseAzureLLM._base_validate_azure_environment from B531 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse BaseAzureLLM._get_base_azure_url from B531 (litellm/llms/azure/common_utils.py); its implementation remains
  with that prerequisite.


  Implement crates/betterlite-azure/src/resource_urls.rs with adjacent tests under resource_urls/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_resource_urls in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function resource_urls_cases in betterlite-azure with these exact named cases (one per oracle file):
  container_api_version_query, container_normalized_base, video_supported_fields, video_auth_and_url, vector_search_azure_base.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_resource_urls* using HelperCase: kind:
  helper and the externally tagged azure_resource_urls variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_resource_urls that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 116 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 145 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 335 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - crates/betterlite-azure/src/resource_urls.rs
  - crates/betterlite-azure/src/resource_urls/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_resource_urls.rs
  - tools/oracle/src/helpers/azure_resource_urls/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_resource_urls.py
  - tools/oracle/cases/helpers/providers/azure-resource-urls/**
  - tools/oracle/fuzz/corpus/helper_case/azure_resource_urls*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/containers/transformation.py#L27-L83
  why: >-
    Own AzureContainerConfig.validate_environment, AzureContainerConfig._normalize_api_base, AzureContainerConfig._extract_api_version,
    AzureContainerConfig.get_complete_url. Other functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/videos/transformation.py#L28-L91
  why: >-
    Own AzureVideoConfig.__init__, AzureVideoConfig.get_supported_openai_params, AzureVideoConfig.map_openai_params,
    AzureVideoConfig.validate_environment, AzureVideoConfig.get_complete_url. Other functions in this file remain
    with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/vector_stores/transformation.py#L7-L19
  why: >-
    Own AzureOpenAIVectorStoreConfig.get_complete_url, AzureOpenAIVectorStoreConfig.validate_environment. Other
    functions in this file remain with the owners listed below.
dod:
- text: >-
    container api version query: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-resource-urls/container-api-version-query.yaml.
  proof:
  - case-container-api-version-query
  - oracle
  - helper-python
- text: >-
    container normalized base: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-resource-urls/container-normalized-base.yaml.
  proof:
  - case-container-normalized-base
  - oracle
  - helper-python
- text: 'video supported fields: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-resource-urls/video-supported-fields.yaml.'
  proof:
  - case-video-supported-fields
  - oracle
  - helper-python
- text: 'video auth and url: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-resource-urls/video-auth-and-url.yaml.'
  proof:
  - case-video-auth-and-url
  - oracle
  - helper-python
- text: >-
    vector search azure base: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-resource-urls/vector-search-azure-base.yaml.
  proof:
  - case-vector-search-azure-base
  - oracle
  - helper-python
- text: New azure_resource_urls seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-container-api-version-query
    why: The container-api-version-query behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_container_api_version_query$/)'
  - id: case-container-normalized-base
    why: The container-normalized-base behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_container_normalized_base$/)'
  - id: case-video-supported-fields
    why: The video-supported-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_video_supported_fields$/)'
  - id: case-video-auth-and-url
    why: The video-auth-and-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_video_auth_and_url$/)'
  - id: case-vector-search-azure-base
    why: The vector-search-azure-base behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_vector_search_azure_base$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_resource_urls.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_resource_urls*")"
      && grep -lq 'azure_resource_urls' tools/oracle/fuzz/corpus/helper_case/azure_resource_urls* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_resource_urls$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
