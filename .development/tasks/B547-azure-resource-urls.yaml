id: B547
title: Azure container video and vector-store endpoints
description: >-
  Add Azure resource URL policy overrides over the already typed OpenAI container/video/vector operations. Preserve
  api-version extraction from config/query, normalized OpenAI prefixes and model fields; these adapters reuse request/response
  parsers rather than adding parallel schemas.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/containers/transformation.py:
  AzureContainerConfig.validate_environment L27-L35; AzureContainerConfig._normalize_api_base L38-L47; AzureContainerConfig._extract_api_version
  L50-L54; AzureContainerConfig.get_complete_url L56-L83. litellm/llms/azure/videos/transformation.py: AzureVideoConfig.__init__
  L28-L29; AzureVideoConfig.get_supported_openai_params L31-L43; AzureVideoConfig.map_openai_params L45-L52; AzureVideoConfig.validate_environment
  L54-L75; AzureVideoConfig.get_complete_url L77-L91. litellm/llms/azure/vector_stores/transformation.py: AzureOpenAIVectorStoreConfig.get_complete_url
  L7-L16; AzureOpenAIVectorStoreConfig.validate_environment L18-L19.


  Reuse BaseAzureLLM._base_validate_azure_environment from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse BaseAzureLLM._get_base_azure_url from B2200 (litellm/llms/azure/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: container_api_version_query: Extract the first api-version using parse_qs (blank values
  ignored). A truthy URL version overwrites litellm_params.api_version in a copied mapping before B2200 route=/openai/containers
  with default v1; preserve the original params mapping. container_normalized_base: Normalize only a path ending
  /openai/responses after trimming trailing slash; remove that suffix and discard params/query/fragment. /openai/v1/responses
  is not in the suffix list and remains unchanged. Falsy base remains unchanged. video_supported_fields: Azure video
  advertises model,prompt,input_reference,seconds,size,user,extra_headers, excluding characters. map_openai_params
  nevertheless copies every supplied key regardless of drop_params. video_auth_and_url: For video create GenericLiteLLMParams
  only when None; a truthy positional api_key fills a falsy params.api_key, mutating the supplied params. Containers
  pass just GenericLiteLLMParams(api_key=api_key); vector stores pass the original params. All three use B2200 exact-case
  api-key auth. Video URL is /openai/v1/videos with default version empty; explicit versions still enter query.
  vector_search_azure_base: Vector-store root uses B2200 /openai/vector_stores without a default version. All inherited
  request/response shapes remain B522/B525/B527, including assistants-v2 beta behavior where the OpenAI operation
  adds it; do not add that header in this Azure validate_environment override.


  Write standalone Rust test azure_resources_credential_identity_isolation in betterlite-azure: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test azure_resources_secret_safe_failure in betterlite-azure: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-azure/src/resource_urls.rs with adjacent tests under resource_urls/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_resource_urls in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function resource_urls_cases in betterlite-azure with these exact named cases (one per oracle file):
  container_api_version_query, container_normalized_base, video_supported_fields, video_auth_and_url, vector_search_azure_base.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_resource_urls* using HelperCase: kind:
  helper and the externally tagged azure_resource_urls variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_resource_urls that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 116 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 145 production lines, 185 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 450 planned, 450 maximum changed lines.
