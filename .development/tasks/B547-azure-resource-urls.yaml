checks:
  optional:
  - mutants
  commands:
  - id: case-container-api-version-query
    why: Extract the first api-version using parse_qs (blank values ignored). A truthy URL version overwrites litellm_params.api_version
      in a copied mapping before B2200 route=/openai/containers with default v1; preserve the original params mapping.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_container_api_version_query$/)'
  - id: case-container-normalized-base
    why: Normalize only a path ending /openai/responses after trimming trailing slash; remove that suffix and discard
      params/query/fragment. /openai/v1/responses is not in the suffix list and remains unchanged. Falsy base remains
      unchanged.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_container_normalized_base$/)'
  - id: case-video-supported-fields
    why: Azure video advertises model,prompt,input_reference,seconds,size,user,extra_headers, excluding characters.
      map_openai_params nevertheless copies every supplied key regardless of drop_params.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_video_supported_fields$/)'
  - id: case-video-auth-and-url
    why: For video create GenericLiteLLMParams only when None; a truthy positional api_key fills a falsy params.api_key,
      mutating the supplied params. Containers pass just GenericLiteLLMParams(api_key=api_key); vector stores pass
      the original params. All three use B2200 exact-case api-key auth. Video URL is /openai/v1/videos with default
      version empty; explicit versions still enter query.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_video_auth_and_url$/)'
  - id: case-vector-search-azure-base
    why: Vector-store root uses B2200 /openai/vector_stores without a default version. All inherited request/response
      shapes remain B522/B525/B527, including assistants-v2 beta behavior where the OpenAI operation adds it; do
      not add that header in this Azure validate_environment override.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::resource_urls_cases::case_[0-9]+_vector_search_azure_base$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_resource_urls.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_resource_urls*")"
      && grep -lq 'azure_resource_urls' tools/oracle/fuzz/corpus/helper_case/azure_resource_urls* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_resource_urls$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_resources_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_resources_secret_safe_failure$/)'
