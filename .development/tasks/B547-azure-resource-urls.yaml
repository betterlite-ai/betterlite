out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_resource_urls in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/resource_urls.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_resource_urls.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Only /openai/responses is normalized; recognizing /openai/v1/responses as well would change the pinned route.
- Video key fallback uses truthiness, while Azure image-edit B536 checks params.api_key is None.
