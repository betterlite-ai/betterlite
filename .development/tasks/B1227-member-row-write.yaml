  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - An empty upsert update can become a racy SELECT then INSERT; retain the user_id assignment.
  - The membership update is empty, so resolving a fresh budget does not replace an existing membership's budget_id.
  - A returned existing user is the snapshot from before teams is appended.
