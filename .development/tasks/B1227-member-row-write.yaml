id: B1227
title: Shared user and membership row writes
description: >-
  Implement add_new_member and native typed user/membership row operations using the caller-owned writer
  transaction when supplied. Preserve email lookup, upsert-on-conflict semantics, append-team-if-absent
  and existing-user defaults. B862 provides shared/default member budget selection; do not check out another
  pool connection while the caller holds the roster lock.


  Build the production member_row_write module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/utils.py:
  _user_table (L112-L113; 2 source lines), _budget_table (L116-L117; 2 source lines), _team_membership_table
  (L120-L121; 2 source lines), _find_users_by_email (L124-L134; 11 source lines), _upsert_user_row (L137-L150;
  13 source lines), _create_user_row (L153-L158; 6 source lines), get_new_internal_user_defaults (L161-L177;
  15 source lines), _append_team_id_if_absent (L393-L408; 15 source lines), add_new_member (L411-L500;
  76 source lines), _PrismaRecord.model_dump (L47-L47; 1 source lines), _PrismaUserRecord.model_dump (L55-L55;
  1 source lines), _PrismaBudgetRecord.model_dump (L63-L63; 1 source lines), _PrismaBudgetTable.create
  (L69-L69; 1 source lines), _PrismaBudgetTable.find_unique (L71-L71; 1 source lines), _PrismaUserTable.update_many
  (L77-L77; 1 source lines), _PrismaUserTable.upsert (L79-L81; 3 source lines), _PrismaUserTable.find_many
  (L83-L83; 1 source lines), _PrismaTeamMembershipTable.upsert (L89-L91; 3 source lines), MemberWriteTx.litellm_usertable
  (L102-L103; 2 source lines), MemberWriteTx.litellm_budgettable (L105-L106; 2 source lines), MemberWriteTx.litellm_teammembership
  (L108-L109; 2 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.default_internal_user_params=None;
  litellm_settings.max_internal_user_budget=None; litellm_settings.internal_user_budget_duration=None.


  Add the member_row_write operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a member-row-write-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::member_row_write::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 161 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  161 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 457 changed lines estimated within a 475-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
