id: B1227
title: Shared user and membership row writes
description: >-
  Implement add_new_member and its user, budget and membership table accessors with the caller's transaction
  when provided; otherwise use B723/B724/B725 repositories. _find_users_by_email uses an exact email predicate
  on that transaction, or B124 get_data(table_name=user, query_type=find_all), normalizing None to an empty
  sequence. _create_user_row uses jsonify_object plus _upsert_user_row in a transaction, or B124 insert_data
  without one. Upsert by user_id with create defaults and update={user_id}; the nonempty update must compile
  to PostgreSQL ON CONFLICT, preserving all other existing fields under concurrent provisioning.


  get_new_internal_user_defaults uses default_internal_user_params or {}. models uses its truthy value or
  []; max_budget and budget_duration use their global defaults only when the corresponding dict key is
  absent, not when null. A truthy supplied email wins over the configured user_email. Always use the supplied
  user_id and literal internal_user role, ignoring configured user_id/user_role; remove only None values,
  retaining zero and empty arrays. The global max_internal_user_budget/internal_user_budget_duration defaults
  are None. This helper does not calculate a user budget reset timestamp or enroll configured default teams.


  A non-null member.user_id wins over email, including an empty ID: derive defaults without forwarding the
  member email, upsert with teams=[team_id], then append only where user_id matches and NOT teams has team_id.
  Return the row captured before that append, so an existing user's returned teams may lag the database.
  Email-only enrollment generates a UUID for potential creation before exact lookup. Zero matching rows
  inserts with teams=[team_id]; one row appends and returns the earlier snapshot; multiple rows raise
  HTTPException 400 with detail.error Multiple users with this email found in db. Please use 'user_id' instead.
  There is no case-folding or email uniqueness guarantee. Concurrent email creation can yield distinct users.


  After user provisioning call B862 _resolve_member_budget_id with auth/admin name, explicit budget including
  zero, allowed_models including [], duration, team default and the same transaction. Do so even if no user
  row was returned or no identity was supplied. For a returned user ID, upsert membership on user_id_team_id,
  create a budget_id link only if resolution is non-null, update={} and include litellm_budget_table. Existing
  memberships retain their budget link; a newly resolved budget can therefore be unused. Convert both returned
  rows through B720's user model and B859's membership model and return the pair. A missing returned user raises Exception Unable to update
  user table with membership information! after budget resolution. Preserve operation order and propagate
  repository/model failures. Without a caller transaction, earlier user/append/budget writes survive a later
  failure; with one, all operations use that connection and caller rollback. Never invent an inner transaction.


  Build the production member_row_write module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/utils.py:
  _user_table (L112-L113; 2 source lines), _budget_table (L116-L117; 2 source lines), _team_membership_table
  (L120-L121; 2 source lines), _find_users_by_email (L124-L134; 11 source lines), _upsert_user_row (L137-L150;
  13 source lines), _create_user_row (L153-L158; 6 source lines), get_new_internal_user_defaults (L161-L177;
  15 source lines), _append_team_id_if_absent (L393-L408; 15 source lines), add_new_member (L411-L500;
  76 source lines), _PrismaRecord.model_dump (L47-L47; 1 source lines), _PrismaUserRecord.model_dump (L55-L55;
  1 source lines), _PrismaBudgetRecord.model_dump (L63-L63; 1 source lines), _PrismaBudgetTable.create
  (L69-L69; 1 source lines), _PrismaBudgetTable.find_unique (L71-L71; 1 source lines), _PrismaUserTable.update_many
  (L77-L77; 1 source lines), _PrismaUserTable.upsert (L79-L81; 3 source lines), _PrismaUserTable.find_many
  (L83-L83; 1 source lines), _PrismaTeamMembershipTable.upsert (L89-L91; 3 source lines), MemberWriteTx.litellm_usertable
  (L102-L103; 2 source lines), MemberWriteTx.litellm_budgettable (L105-L106; 2 source lines), MemberWriteTx.litellm_teammembership
  (L108-L109; 2 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.default_internal_user_params=None;
  litellm_settings.max_internal_user_budget=None; litellm_settings.internal_user_budget_duration=None.


  Put only get_new_internal_user_defaults under B856 Management::teams with B171 helper_case seeds.
  Database operations require native PostgreSQL tests with the real repositories and B862 budget selection;
  a recorded table fake cannot establish concurrency, row snapshots or rollback behavior.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  B002 loader tests defaults_absent, per_user_key_overrides_global, explicit_null_suppresses_global,
  falsey_models_and_email, zero_budget_preserved and identity_role_not_overridden must feed the production
  defaults function. Type errors in the resulting B720 user row propagate rather than warn-and-fallback. Seed
  config_yaml with these three nested litellm_settings keys and normal os.environ/ resolution; there is no
  dedicated environment variable for this helper.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 161 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  161 production, 280 behavior/Postgres tests, 45 pure-helper adapters, 30 wiring, 0 decoder/fuzz
  and 55 config lines, 571 changed lines estimated within a 600-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
