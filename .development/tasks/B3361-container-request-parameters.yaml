id: B3361
title: Container request parameters and provider selection
description: >-
  Build betterlite-core container parameter filtering, managed-ID decoding and conditional
  response-ID encoding, plus the three-provider selector. Preserve the explicit-provider
  override rule, an already supplied model ID, and the difference between routing metadata
  and an ordinary direct SDK call.

  Owned functions: decode_managed_container_id_for_request decodes a LiteLLM-managed
  container ID (with routing metadata for provider and model_id) and returns the original
  container_id, resolved custom_llm_provider, and updated litellm_params. Decoding extracts
  response_id, custom_llm_provider and model_id from the managed ID; the provider override
  applies only when input provider is "openai" and decoded provider is non-null; model_id
  is filled only when not already set in litellm_params.

  ContainerRequestUtils.get_requested_container_create_optional_param extracts valid
  creation parameters from passed_params: expires_after, file_ids, extra_headers, extra_body.
  Null values are dropped. get_optional_params_container_create filters extracted creation
  params through the provider's supported_params and maps them. Mapping uses
  map_openai_params with drop_params=False.

  ContainerRequestUtils.get_requested_container_list_optional_param extracts valid list
  parameters from passed_params: after, limit, order, extra_headers, extra_query. Null
  values are dropped.

  ContainerRequestUtils.encode_container_id_in_response encodes response_obj.id with
  provider/model metadata when routing metadata is present: either litellm_metadata contains
  model_info.id (router/proxy usage) OR extra_body contains target_model_names (model-specific
  routing). Direct SDK calls with explicit custom_llm_provider and no routing hints return
  raw IDs. When encoding, extract model_id from litellm_metadata["model_info"]["id"] if
  present; if not present but target_model_names exists, use first model name (string split
  on comma or list element) as model_id. Encoding uses B903's _build_container_id with
  provider, model_id, and container_id.

  ProviderConfigManager.get_provider_container_config returns the appropriate provider
  config: OpenAIContainerConfig for LlmProviders.OPENAI, AzureContainerConfig for
  LlmProviders.AZURE or LlmProviders.AZURE_TEXT, or None for other providers.
