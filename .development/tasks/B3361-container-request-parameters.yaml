dod:
  - text: >-
      decode_managed_container_id_for_request decodes managed container IDs: provider-prefixed
      IDs from router usage return (original_id, provider, updated_params); non-encoded IDs
      return (input_id, input_provider, input_params). Provider override applies only when
      input provider is "openai" and decoded provider is non-null. Model ID is added only
      when not already set in litellm_params.
    proof: [decode-container-id]
  - text: >-
      get_requested_container_create_optional_param extracts only valid creation parameters
      (expires_after, file_ids, extra_headers, extra_body) and drops null values.
    proof: [extract-create-params]
  - text: >-
      get_optional_params_container_create filters creation params through provider's
      supported params and maps them via map_openai_params.
    proof: [filter-create-params]
  - text: >-
      get_requested_container_list_optional_param extracts only valid list parameters
      (after, limit, order, extra_headers, extra_query) and drops null values.
    proof: [extract-list-params]
  - text: >-
      encode_container_id_in_response encodes response IDs with provider/model metadata
      when routing metadata is present (model_info.id or target_model_names). Direct SDK
      calls without routing metadata return raw IDs. First model from target_model_names
      is used as model_id when model_info.id is absent.
    proof: [encode-response-id]
  - text: >-
      get_provider_container_config returns OpenAIContainerConfig for openai, AzureContainerConfig
      for azure/azure_text, and None for other providers.
    proof: [provider-config]
checks:
  optional: []
  commands:
    - id: decode-container-id
      why: managed container IDs are not decoded correctly or routing metadata is lost
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^container_request_parameters::decode_managed_container_id/)'
    - id: extract-create-params
      why: creation parameters are not extracted correctly or invalid params are included
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^container_request_parameters::(extract_create|get_requested_container_create)/)'
    - id: filter-create-params
      why: creation parameters are not filtered or mapped through provider config
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^container_request_parameters::filter_create_params/)'
    - id: extract-list-params
      why: list parameters are not extracted correctly or invalid params are included
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^container_request_parameters::(extract_list|get_requested_container_list)/)'
    - id: encode-response-id
      why: response IDs are not encoded with metadata or routing detection is incorrect
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^container_request_parameters::encode_container_id/)'
    - id: provider-config
      why: provider config selection does not return correct type or fails on invalid provider
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^container_request_parameters::provider_config/)'
