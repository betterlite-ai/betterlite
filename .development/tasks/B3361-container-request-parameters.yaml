deviations:
  - what: >-
      Rust implementation uses owned types and Option instead of Python's None values
      and dict access. Provider config returns Option<Box<dyn BaseContainerConfig>> instead
      of None.
    why: Rust type system requires explicit nullable representation and owned data.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9728-L9743
out_of_scope:
  - "litellm/responses/utils.py: B903 owns ResponsesAPIRequestUtils._decode_container_id and _build_container_id."
  - "litellm/llms/base_llm/containers/transformation.py: B522 owns OpenAIContainerConfig and B547 owns AzureContainerConfig implementations; B3360 owns the abstract interface."
  - "litellm/containers/__init__.py: B3368 owns the package exports and initialization."
pitfalls:
  - Provider override only applies when input provider is "openai" and decoded provider is non-null; other providers reject the override and use input provider.
  - Model ID is filled only when the input litellm_params does not already have a "model_id" key; pre-set model IDs are never overwritten by decoded values.
  - Container ID encoding requires both a routing hint (model_info.id or target_model_names) to activate; direct SDK calls with explicit provider and no routing hints skip encoding entirely.
  - target_model_names in extra_body must be split on comma if string (with strip applied to each part) or treated as list; the first element becomes model_id.
  - Null and empty string provider/model values in decoded metadata are preserved in encoding (no special handling); they encode as "None" and empty strings respectively in the encoded ID.
