id: B3515
title: Decisions and SystemOne public call entrypoints
description: >-
  Implement the native Decisions and SystemOne entrypoint operations sharing
  preparation and sending stages. These are the public async and sync APIs
  that field HTTP requests after routing and validation.

  Decisions module provides `adecisions()` and `decisions()` as public
  entrypoints that accept OpenAI-style input/questions, detect the deprecated
  state parameter with a warning, build request fields and dispatch through
  the shared prepare/send pipeline.

  SystemOne module provides `asystemone()` and `systemone()` as public
  entrypoints that accept SystemOne-style state/questions, reject the invalid
  input parameter, build request fields and dispatch through the shared pipeline.

  Both modules are pure operation wrappers with no route registration; routes
  live in B099 and call these functions via the @client decorator through
  B014's existing call-lifecycle executor.

  Functions to port:

  Decisions module:
  - _request_fields: multiplex OpenAI vs. SystemOne request formats, emit
    deprecation warning for state parameter
  - _prepare_decisions_call: forward common parameters and filter state from
    kwargs before calling B3513's prepare_call
  - adecisions: @client-decorated async function that prepares and sends,
    returning OpenAI or SystemOne response
  - decisions: @client-decorated sync wrapper that calls _systemone_response
    on the result

  SystemOne module:
  - _prepare_systemone_call: validate that input parameter is not present,
    build request fields and call prepare_call
  - _systemone_response: assert response type safety and return it
  - asystemone: @client-decorated async function that prepares and sends
  - systemone: @client-decorated sync wrapper calling _systemone_response

  Preserve the `decisions(state=...)` deprecation warning with stacklevel=5,
  the rejection of `systemone(input=...)`, and the native lifecycle integration
  that lets sync callers run async sends without nesting a fresh runtime.

  Module exports in decisions/__init__.py and systemone/__init__.py list only
  the four public functions adecisions, decisions, asystemone, systemone.
  Router registration at litellm/router.py:2089-2097 is pure Python and not
  ported; native lifecycle dispatch happens via B014.

scope:
  paths:
    - crates/betterlite-core/src/decisions.rs
    - crates/betterlite-core/src/decisions/**
    - crates/betterlite-core/src/systemone.rs
    - crates/betterlite-core/src/systemone/**
  lint_tables: false

