id: B3776
title: HiddenLayer v1 and v2 evaluation
description: >-
  Implement HiddenLayer's distinct v1 and v2 request/response evaluation contracts and version dispatch logic. V1 scans the last user message
  and returns evaluation actions (Block, Redact) with analysis results and modified data. V2 evaluates complete request/response payloads
  including structured messages, tools and tool calls, returning modified output and block signals via response headers.
  Both versions handle JWT refresh when 401 response indicates token expiry; is_saas and _get_jwt are provided by B3775.
  Build helper functions _proxy_request_headers and _logged_request_headers to extract hl-* metadata headers from request and logging objects,
  _scannable_text to flatten structured message content for v1 scanning, _interaction_body to decode v1 response JSON, _proxy_server_request
  to access proxy request headers and _header_value to read response headers with defaults. Implement version dispatch via initialize_guardrail
  that selects v1 or v2 based on version config parameter (default v1). Both versions build Authorization Bearer header from jwt_token
  and retry with token refresh on 401 response. V2's config model accessor remains with B107 to keep this part bounded.
