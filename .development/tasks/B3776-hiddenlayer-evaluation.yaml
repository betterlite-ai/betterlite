dod:
  - text: HiddenlayerGuardrail v1 scans only the last user message via _scannable_text from structured_messages or texts.
    proof: [oracle]
  - text: V1 returns Block action with 400 status, threat_level and detected analysis when evaluation returns action Block.
    proof: [oracle]
  - text: V1 returns Redact action by modifying inputs structured_messages and texts when evaluation returns action Redact.
    proof: [oracle]
  - text: V1 forwards hl-requester-id and hl-project-id headers from request or logging object, using default requester_id LiteLLM.
    proof: [oracle]
  - text: V1 sends model name as metadata to the detection endpoint, extracted from logging object or falling back to unknown.
    proof: [oracle]
  - text: V1 calls /detection/v1/interactions endpoint with input or output payload based on input_type.
    proof: [oracle]
  - text: V2 evaluates complete request payloads including structured_messages, model and tools; evaluates response texts, tool_calls or choices.
    proof: [oracle]
  - text: V2 returns Block action with 400 status when response hl-runtime-action header equals block (case-insensitive).
    proof: [oracle]
  - text: V2 updates structured_messages and texts with modified output from v2/request-evaluations response.
    proof: [oracle]
  - text: V2 updates texts with modified content from v2/response-evaluations when input_type is response and texts present.
    proof: [oracle]
  - text: V2 updates tool_calls with response output when input_type is response and tool_calls present.
    proof: [oracle]
  - text: V2 extracts hl-* headers from request headers, preserves case-insensitive matching and injected roundtrip-id via _proxy_server_request.
    proof: [oracle]
  - text: V2 injects hl-roundtrip-id into proxy_server_request headers when not already present and proxy_server_request exists.
    proof: [oracle]
  - text: V2 calls /detection/v2/request-evaluations or /detection/v2/response-evaluations based on input_type.
    proof: [oracle]
  - text: Both v1 and v2 catch HTTPStatusError with 401 status, call refresh_jwt_func and retry with new Authorization Bearer token.
    proof: [oracle]
  - text: V1 includes hl-runtime-edge-provider litellm and hl-runtime-edge-provider-version 1 headers in requests.
    proof: [oracle]
  - text: V2 includes hl-runtime-edge-provider litellm and hl-runtime-edge-provider-version 2 headers in requests.
    proof: [oracle]
  - text: Both set HL-Project-Id request header when project_id is present.
    proof: [oracle]
  - text: Both set Authorization header to Bearer {jwt_token} when jwt_token is present.
    proof: [oracle]
