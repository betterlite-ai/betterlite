deviations:
  - what: V1 and V2 both use case-insensitive header key matching for hl-* metadata headers extracted from request.
    why: LiteLLM HTTP header lookup uses exact case-insensitive matching via dict.get; betterlite normalizes to lowercase for consistent access patterns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L286-L291
  - what: V2 block signal check on hl-runtime-action header uses case-insensitive comparison.
    why: HTTP headers are case-insensitive per RFC 7230; betterlite normalizes header value comparison to lowercase for robustness.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L536
  - what: Both v1 and v2 use AsyncHTTPHandler.post (missing owner H) for HTTP requests instead of the native httpx client.
    why: Shared transport layer provides pooled httpx clients with consistent timeout and error handling across all guardrails; this task does not own the transport.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L385-L407
  - what: V2 reads response body via response.json() directly without struct deserialization.
    why: V2 endpoints return untyped JSON that varies by request type; betterlite defers schema validation to the guardrail logic rather than pre-parsing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L531-L534
out_of_scope:
  - HiddenLayer SaaS detection and JWT token acquisition (is_saas, _get_jwt, JWT refresh lambda storage) provided by B3775.
  - ">-
    CustomGuardrail base class lifecycle (CustomGuardrail.__init__, log_guardrail_information decorator, supported_event_hooks):
    Framework base class for guardrail integration; no assigned task owner yet (B104 outline has no task file). Required for initialization and lifecycle; infrastructure dependency."
  - ">-
    HTTP client management (AsyncHTTPHandler, get_async_httpx_client): Infrastructure layer that provides pooled httpx clients with timeout handling;
    no assigned task owner yet. Injected as dependency rather than constructed here."
  - ">-
    Guardrail callback registration (add_litellm_callback): Callback pipeline registration; no assigned task owner yet.
    Used as injected dependency from logging callback manager."
  - V2 config model accessor that determines which HiddenlayerGuardrailConfigModel to return based on request context; owned by B107.
pitfalls:
  - ">-
    V1 scans only the last message from structured_messages (role and content flattened via _scannable_text) or texts array.
    Earlier messages in the conversation are not evaluated, only the final user input."
  - ">-
    V2 evaluates the complete request or response payload; request evaluation includes model and tools fields alongside messages,
    while response evaluation handles texts, tool_calls, or choices depending on what is present in inputs."
  - ">-
    V1 Block action raises HTTPException with 400 status and detail dict containing error, hiddenlayer_guardrail_response,
    block_reasons and threat_level fields. V2 Block action raises HTTPException with 400 status but only error and hiddenlayer_guardrail_response fields."
  - ">-
    V1 Redact action updates both structured_messages and texts independently, extracting text from content which may be a string or list of dicts with type field.
    Empty text lists result in [empty string] fallback."
  - ">-
    V2 hl-roundtrip-id is injected into proxy_server_request headers directly when _proxy_server_request returns a request dict with headers field.
    If proxy_server_request is None or missing headers field, the ID is not injected."
  - ">-
    V2 hl-* header extraction uses lowercase key normalization from the original request headers, preserving only headers that start with hl- prefix.
    Case-insensitive matching allows clients to send headers with any casing and still be matched."
  - ">-
    JWT refresh on 401 only happens in the except HTTPStatusError handler; other status codes (403, 404, 500, etc.) are not retried
    and raise immediately."
  - ">-
    Both versions default hl-requester-id to LiteLLM if the header is not present in the request or logging metadata.
    Explicit empty string in headers overrides the default."
review_level: security
