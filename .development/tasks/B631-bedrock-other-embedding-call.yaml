out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- >-
  litellm/llms/bedrock/embed/embedding.py: BedrockEmbedding._get_async_invoke_status L587-L667 belong to B632; reuse
  that implementation or its injected typed boundary.
- >-
  litellm/llms/bedrock/embed/embedding.py: _sign_get_request L51-L62; BedrockEmbedding._load_credentials L67-L71;
  BedrockEmbedding._load_credentials L74-L78; BedrockEmbedding._load_credentials L80-L106; BedrockEmbedding._make_sync_call
  L111-L142; BedrockEmbedding._make_async_call L144-L176; BedrockEmbedding._transform_response L178-L252 belong
  to B693; reuse that implementation or its injected typed boundary.
- 'litellm/llms/bedrock/embed/embedding.py: BedrockEmbedding.async_embeddings L108-L109 have no caller at the pin;
  do not port them.'
pitfalls:
- Cohere batches inputs while Titan sends per-input calls; preserving order requires indexing results before fanout.
