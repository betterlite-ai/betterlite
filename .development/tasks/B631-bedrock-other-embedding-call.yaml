id: B631
title: Bedrock embedding request fanout and replies
description: >-
  Execute prepared embedding batches with ordered outputs, one typed async send path and shared signing. Preserve
  family request fanout and source input validation; bound concurrent work to the existing configured deployment
  concurrency and cancel owned requests on failure/disconnect. Async invocation status retrieval is embedding_jobs,
  not inline polling here.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/embedding.py:
  BedrockEmbedding._single_func_embeddings L254-L320; BedrockEmbedding._async_single_func_embeddings L322-L391;
  BedrockEmbedding.embeddings L393-L585.


  B693 owns HTTP response parsing and individual embedding calls; this slice owns fanout and result ordering.


  Implement crates/betterlite-bedrock/src/embedding_call.rs with adjacent tests under embedding_call/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_embedding_call in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function embedding_call_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): embedding_family_selection, ordered_multi_input_result, cohere_batched_input, titan_per_item_input, nova_async_invoke_start,
  signing_auth_isolation, embedding_transport_error. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and
  captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_call* using HelperCase:
  kind: helper and the externally tagged bedrock_other_embedding_call variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_embedding_call that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 302 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 320 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 536 planned, 550 maximum changed lines.
