  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/embedding_call.rs
  - crates/betterlite-bedrock/src/embedding_call/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_other_embedding_call.rs
  - tools/oracle/src/helpers/bedrock_other_embedding_call/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_other_embedding_call.py
  - tools/oracle/cases/helpers/providers/bedrock-other-embedding-call/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_call*
  lint_tables: false
