id: B631
title: Bedrock embedding request ordering and replies
description: >-
  Execute prepared embedding inputs sequentially with ordered outputs, one typed async send path and shared signing.
  Preserve family selection and caller-option mutations; do not parallelize the per-input loop, because source failure
  order and partial upstream effects are observable. Async invocation status retrieval is embedding_jobs, not inline
  polling here.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/embedding.py:
  BedrockEmbedding._single_func_embeddings L254-L320; BedrockEmbedding._async_single_func_embeddings L322-L391;
  BedrockEmbedding.embeddings L393-L585.


  B693 owns HTTP response parsing and individual embedding calls; this slice owns sequential batching and result
  ordering.


  Named case contracts: embedding_family_selection: First load credentials through B693 using B590 bedrock_bearer_token(api_key),
  then pop model_id and use its truthy value or model; percent-encode every non-unreserved character with B171 quote
  safe empty. Resolve B591 region from the already chosen credential region plus original model and unencoded model
  ID. Detect async_invoke/ anywhere in model and remove only its first occurrence before B591 provider selection.
  If no provider is found raise generic Exception Unable to determine bedrock embedding provider for model: {model}.
  Supported providers: ['cohere', 'amazon', 'twelvelabs', 'nova']. Deep-copy the remaining options, remove authentication
  keys case-insensitively using B590 catalog, and remove user only by exact key. Do not mutate unrelated original
  options. ordered_multi_input_result: Both sync and async per-input loops sign and send one request at a time in
  input order, append each parsed reply, and transform only after every call succeeds. A failure stops later calls;
  no rollback or concurrent fanout is added. Empty batch still calls B693 result transformation. Pass only a matching
  sync/async handler, otherwise None, and preserve timeout. The async path runs each signature through B595 run_aws_signing;
  sync signs directly. cohere_batched_input: Cohere sends all inputs in one B627 transformed body. Merge default
  Content-Type=application/json with extra_headers, where an exact key overrides the default, then B595 get_request_headers
  signs json.dumps(data). Convert prepared headers to a plain mapping or empty mapping when absent. Delegate native
  B037 cohere_embedding with prepared URL/headers, data, original input/model/response/encoding/timeout/client/aembedding
  and the mutated original optional_params; api_key is explicitly None. This branch signs directly even for aembedding=true.
  titan_per_item_input: Only exact amazon.titan-embed-image-v1, amazon.titan-embed-text-v1, amazon.titan-embed-text-v2:0
  and amazon.titan-embed-g1-text-02 are accepted under provider amazon. Build one B627 request per input in order.
  The inner Unmapped model branch is unreachable under this exact outer list and needs no fabricated case; another
  amazon model reaches Unable to map Bedrock request to provider. Response model is the async-prefix-stripped model,
  not the optional model_id. nova_async_invoke_start: TwelveLabs and Nova build one B629/B628 request per input,
  receiving has_async_invoke, the percent-encoded model ID and inference_params.output_s3_uri. TwelveLabs also receives
  B629 drop_params_enabled(litellm_params). Resolve B591 runtime endpoint after body construction by popping aws_bedrock_runtime_endpoint
  from original options; use endpoint_url and ignore proxy_endpoint_url. Append /async-invoke for any detected async
  marker, otherwise /model/{encoded_model_id}/invoke, without trimming an existing trailing slash. The encoded model
  ID was computed before removing the async marker from model. signing_auth_isolation: For every per-input request,
  start Content-Type=application/json, merge extra headers, sign exact JSON bytes through B595, and forward the
  prepared URL and plain header map. Emit B249 pre_call with input=data, api_key empty and complete_input_dict/api_base/headers;
  post_call uses parsed reply and complete_input_dict. Preserve custom headers and the shared B595 bearer/non-AWS
  Authorization precedence cases without cross-request credential reuse. embedding_transport_error: B693 HTTP, timeout
  and decode failures stop the sequential loop unchanged. After a sync batch result, None causes generic Exception
  Unable to map Bedrock request to provider; async returns its delegated result without that extra check. A nonbatch
  branch with data=None raises the same message. Reuse exact B693 status/header/error cases and assert later requests
  were not sent.


  Write standalone Rust test embedding_call_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test embedding_call_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/embedding_call.rs with adjacent tests under embedding_call/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function embedding_call_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): embedding_family_selection, ordered_multi_input_result, cohere_batched_input, titan_per_item_input, nova_async_invoke_start,
  signing_auth_isolation, embedding_transport_error. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_call* using HelperCase:
  kind: helper and the externally tagged bedrock_other_embedding_call variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_embedding_call that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 302 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 285 production lines, 275 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 700 planned, 700 maximum changed lines.
