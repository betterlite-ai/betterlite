checks:
  optional:
  - mutants
  commands:
  - id: case-embedding-family-selection
    why: The embedding-family-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_call_cases::case_[0-9]+_embedding_family_selection$/)'
  - id: case-ordered-multi-input-result
    why: The ordered-multi-input-result behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_call_cases::case_[0-9]+_ordered_multi_input_result$/)'
  - id: case-cohere-batched-input
    why: The cohere-batched-input behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_call_cases::case_[0-9]+_cohere_batched_input$/)'
  - id: case-titan-per-item-input
    why: The titan-per-item-input behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_call_cases::case_[0-9]+_titan_per_item_input$/)'
  - id: case-nova-async-invoke-start
    why: The nova-async-invoke-start behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_call_cases::case_[0-9]+_nova_async_invoke_start$/)'
  - id: case-signing-auth-isolation
    why: The signing-auth-isolation behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_call_cases::case_[0-9]+_signing_auth_isolation$/)'
  - id: case-embedding-transport-error
    why: The embedding-transport-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_call_cases::case_[0-9]+_embedding_transport_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_embedding_call.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_call*")"
      && grep -lq 'bedrock_other_embedding_call' tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_call*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_embedding_call$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
