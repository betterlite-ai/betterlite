out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- 'litellm/llms/bedrock/embed/embedding.py: BedrockEmbedding.async_embeddings L108-L109 have no caller at the pin;
  do not port them.'
- 'Function ownership inventory litellm/llms/bedrock/embed/embedding.py: BedrockEmbedding._get_async_invoke_status
  L587-L667 belong to B632.'
- 'Function ownership inventory litellm/llms/bedrock/embed/embedding.py: _sign_get_request L51-L62; BedrockEmbedding._load_credentials
  L66-L71; BedrockEmbedding._load_credentials L73-L78; BedrockEmbedding._load_credentials L80-L106; BedrockEmbedding.async_embeddings
  L108-L109; BedrockEmbedding._make_sync_call L111-L142; BedrockEmbedding._make_async_call L144-L176; BedrockEmbedding._transform_response
  L178-L252 belong to B693.'
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_other_embedding_call in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/other_embedding_call.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_other_embedding_call.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The async marker is removed after modelId is encoded, so the URL and provider-selection model intentionally differ.
- AWS_REGION overrides AWS_REGION_NAME in embedding credential loading, unlike the general region resolver.
