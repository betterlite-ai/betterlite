  - 'litellm/proxy/management_endpoints/common_utils.py::_has_non_empty_value: no production caller at
    the pinned commit; repository-wide identifier search finds only this definition.'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
