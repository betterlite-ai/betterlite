id: B863
title: Management administrator and invitation scope
description: >-
  Resolve administrator and invitation scope from live organization memberships and team roles using injected
  UserLookup and TeamRoleLookup ports. Invite targets must share an administered organization or team.
  Preserve exception-to-false fallback and no-user/no-database refusal. The lower-level policy accepts
  typed role snapshots; B736 and B800 implement the read ports after their services exist, avoiding a
  dependency back to key or user endpoints.


  Injected port instead of a reverse dependency on B736: UserLookup::load(UserId)->Result<UserRow,AuthError>;
  B736 installs the lookup. A configured but unregistered implementation is a named startup error, never
  a success stub.


  Injected port instead of a reverse dependency on B800: TeamRoleLookup::is_admin(Caller,TeamRow)->bool;
  B800 implements the policy over typed snapshots. A configured but unregistered implementation is a named
  startup error, never a success stub.


  Build the production management_admins module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/common_utils.py:
  _user_has_admin_privileges (L224-L287; 46 source lines), _org_admin_can_invite_user (L290-L317; 26 source
  lines), _team_admin_can_invite_user (L320-L356; 34 source lines), admin_can_invite_user (L359-L429;
  61 source lines).


  Add the management_admins operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a management-admins-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 167 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  167 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 407 changed lines estimated within a 425-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
