  - 'litellm/proxy/management_endpoints/common_utils.py: B800 owns _team_member_has_permission (L208-L221).'
  - 'litellm/proxy/management_endpoints/common_utils.py: B861 owns validate_finite_spend (L13-L24), validate_budget_duration
    (L27-L41), validate_team_model_max_budget (L77-L123), require_caller_user_id_for_non_admin (L126-L150),
    _check_passthrough_routes_caller_permission (L153-L177), _check_disable_global_guardrails_caller_permission
    (L180-L205), _set_object_metadata_field (L432-L456), _update_metadata_field (L639-L661), _update_metadata_fields
    (L675-L688).'
  - 'litellm/proxy/management_endpoints/common_utils.py: B862 owns _prisma_value (L488-L489), member_budget_patch
    (L492-L501), _is_set_budget_value (L504-L509), _has_meaningful_budget_limit (L512-L515), _upsert_budget_and_membership
    (L518-L636).'
  - 'litellm/proxy/management_endpoints/common_utils.py::_has_non_empty_value: no production caller at
    the pinned commit; repository-wide identifier search finds only this definition.'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as management_admins in the server group. Replace the stub Op in tools/oracle/src/helpers/server/management_admins.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/management_admins.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A proxy admin can invite a nonexistent target without any lookup; ordinary callers cannot.
  - The direct team helper propagates errors, while its two outer policy callers log and return False.
  - Team administration comes from an exact roster user id and role, never a matching email.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
