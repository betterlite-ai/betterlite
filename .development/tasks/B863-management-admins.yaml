    why: Own admin_can_invite_user; preserve caller-visible values and failure ordering.
dod:
  - text: 'Native/Postgres cases proxy_admin_before_missing_db, viewer_not_bypass, no_user_no_db,
      empty_user_id_lookup, user_upsert_disabled, fresh_cache_when_absent, same_cache_two_reads,
      admin_read_before_target, missing_user_denies, org_short_circuits_team_query,
      team_query_exact_ids, direct_team_error_propagates, admin_lookup_error_debug_false,
      invite_lookup_error_debug_false, invalid_team_row_denies and self_invite_needs_scope prove policy composition.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Implement the owned behavior and ordered failure effects; named tests: proxy_admin, shared_org,
      shared_team, unrelated_target, lookup_failure_denies.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: postgres-tests
      why: Team membership scope must be checked against real rows with no mutation.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/management_admins::tests::team_query_exact_ids$/)'
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^management_admins::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/management_admins.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/management-admins-*")"
        && grep -rlq "management_admins" tools/oracle/fuzz/corpus/helper_case/management-admins-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
