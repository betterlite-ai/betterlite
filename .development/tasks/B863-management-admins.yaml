id: B863
title: Management administrator and invitation scope
description: >-
  Build administrator and invitation scope with distinct read and pure-policy layers. Exact proxy_admin
  returns True before requiring a database, user id or target; proxy_admin_viewer does not. Otherwise
  missing DB or user_id=None returns False; empty user_id still reaches lookup. _user_has_admin_privileges
  calls B736 UserLookup with user_id_upsert=False and supplied logger, using the passed
  cache or a fresh B2226 DualCache. A missing user returns False. Any organization_memberships row
  with user_role='org_admin' returns True without team reads; otherwise a nonempty teams list triggers
  one B724 query where team_id in that list, validates each B859 team and checks is_team_admin. First
  match wins. Lookup, validation and policy exceptions are caught, debug-logged as 'Error checking admin
  privileges for user %s: %s', and return False. No DB creation/update or role elevation occurs.

  _org_admin_can_invite_user returns True only for intersection of caller org ids with role org_admin
  and ANY target organization membership, regardless of target role. None/empty memberships return
  False. _team_admin_can_invite_user first rejects empty caller or target teams without querying;
  otherwise fetch caller teams, validate them, collect actual roster-admin team ids and intersect
  with target teams. It has no local catch, so direct repository/validation errors propagate to its
  caller. No organization or team is inferred from the key's org_id/team_id alone.

  admin_can_invite_user uses the same proxy-admin/no-DB/no-user short circuits, creates one cache for
  both reads, loads caller first and target second with user_id_upsert=False, and returns False for
  either missing row. Org intersection wins before any team query. Team intersection follows. Any
  error in that block logs debug 'Error checking invite permission for user %s: %s' and returns False;
  a self-invite is not automatically allowed. No exception is converted into a public 401/403 here:
  route callers decide what a False result means.

  Lower is_team_admin from management/teams/access.py L47-L51 into this task so B800 can call it
  without a reverse dependency. It returns any members_with_roles entry with non-null user_id equal
  to caller.user_id AND role exactly 'admin'. No email match, proxy role shortcut, team_id shortcut
  or None==None match exists; empty-string ids may match. Keep the remaining TeamAccess policy in B800.


  B736 is a direct dependency for user lookup; deterministic test injection must retain its email/ID
  lookup behavior and upsert=false argument. is_team_admin is owned locally, so the higher B800
  TeamAccess policy is not imported by these helpers.


  Build the production management_admins module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/common_utils.py:
  _user_has_admin_privileges (L224-L287; 46 source lines), _org_admin_can_invite_user (L290-L317; 26 source
  lines), _team_admin_can_invite_user (L320-L356; 34 source lines), admin_can_invite_user (L359-L429;
  61 source lines).


  Management::models.management_admins contains only pure org-intersection and roster-admin cases;
  Python calls the actual helpers. Async policy/order tests run natively with typed injected user
  reads and B724 against Postgres through POSTGRES_TEST_URL, else B860 testcontainers. Failure to
  provision fails. Assert the two distinct debug messages and zero writes, not imaginary HTTP errors.


  The four helpers contain 122 nonblank noncomment lines excluding docstrings; lowered is_team_admin
  adds five. Allow 150 production, 250 tests, 80 adapters and 30 wiring lines, 510 within 600.
