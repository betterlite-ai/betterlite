id: B3859
title: Legacy OTel inference and guardrail lifecycle
description: >-
  Choose the request tracer and execute the legacy success/failure lifecycle, including dynamic credentials, raw-request child spans and exactly-once proxy-span closure. Build guardrail spans from their recorded execution windows and propagate the pinned failure/status behavior.

  The request lifecycle calls `log_success_event`, `log_failure_event` and their async counterparts, which route through `_handle_success` and `_handle_failure`. The success path creates a primary litellm_request span (child of the proxy span opened by auth), logs raw-request attributes in a subspan (if enabled), emits guardrail spans, records metrics, and closes the proxy span. The failure path creates a primary ERROR span, appends guardrail spans, and closes the proxy span itself (unconditionally when the span is named LITELLM_PROXY_REQUEST_SPAN_NAME with no is_recording guard); `async_post_call_failure_hook` independently calls .end() on the same proxy span after appending a "Failed Proxy Server Request" child, so the worker replicates this double-close rather than a single hand-off. Both paths dedupe via `_emit_once` to prevent sync/async handler collisions in streaming contexts.

  The tracer is selected by `get_tracer_to_use_for_request`, which first checks for a full per-request `OpenTelemetryConfig` override from `construct_dynamic_otel_config`, then per-request headers from `construct_dynamic_otel_headers`, then falls back to the global tracer or headers-only dynamic tracer. Dynamic configs and headers come from `standard_callback_dynamic_params` and are constructed by subclass overrides (Arize, Langfuse, etc.) for team/key-scoped credentials. Base implementations return None.

  Guardrail spans are created from entries in `standard_logging_object.guardrail_information`, a list of dicts each carrying guardrail_name, guardrail_mode, start_time/end_time (float seconds), guardrail_status (success / guardrail_intervened / guardrail_failed_to_respond / not_run), guardrail_response, masked_entity_count, guardrail_action, violation_categories, usage, and cost. Each guardrail invocation becomes a span with recorded execution windows (start_time/end_time as float seconds converted to datetime then nanoseconds). Dedupe keys use guardrail name/mode/start-time so one real guardrail invocation produces exactly one span per emission point (_handle_success, _handle_failure, async_post_call_failure_hook emit_guardrail_spans_from_request_data). Guardrail spans are stamped with OpenInference kind=GUARDRAIL, team attributes, and status attributes so dashboards can group and filter by violation category, cost and outcome without parsing the redacted response blob.

  The proxy span (opened in auth with name LITELLM_PROXY_REQUEST_SPAN_NAME, kind SERVER, traceparent context from headers) is closed: on success by `_end_proxy_span_from_kwargs` after all children, on failure both in `_handle_failure` unconditionally (without is_recording guard) and again in `async_post_call_failure_hook` after the "Failed Proxy Server Request" child (double-close replicates LiteLLM behavior). Team attributes are stamped on the proxy span at close time on success, and by the hook on both paths, so the trace root is team-filterable. Raw-request spans are created only when capture is enabled and not under semconv mode; they are named from generation_name or RAW_REQUEST_SPAN_NAME.

