deviations:
  - what: Guardrail start_time and end_time are float seconds (Unix timestamps); both are converted to datetime and then to nanoseconds for OTel span timing.
    why: LiteLLM populates guardrail_information with float seconds; datetime.fromtimestamp() handles the conversion, and _to_ns() standardizes all timestamps to nanoseconds as required by the OTel SDK.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L2022-L2044
  - what: Guardrail spans are named exactly "guardrail" (not derived from guardrail_name or mode) so dashboards can filter by span name before opening attributes.
    why: LiteLLM stamps all guardrail invocations with the same span name so they appear as a queryable class; individual guardrails are distinguished by the guardrail_name and guardrail_mode attributes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L2047
  - what: Both _handle_failure (L2203-2208) and async_post_call_failure_hook (L988-989) call .end() on the same proxy span; the worker replicates this double-close rather than a single hand-off between them.
    why: _handle_failure unconditionally closes the proxy span when its name is LITELLM_PROXY_REQUEST_SPAN_NAME (with no is_recording guard), and async_post_call_failure_hook independently closes it after appending the "Failed Proxy Server Request" child, so both functions call .end() on the same span object.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L2203-L2208
  - what: Guardrail violation_categories and usage are serialized to JSON via safe_dumps before being set as span attributes (OTel span attributes must be homogeneous primitives or JSON strings).
    why: These fields are lists or dicts; OTel SDKs do not accept nested sequences or mappings directly as attribute values, so JSON serialization is required to preserve the structure in the span.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L2105
  - what: The raw-request span is skipped entirely in semconv mode (when _gen_ai_semconv_latest_experimental is true); it is not replaced by a different structure, just omitted.
    why: Semconv mode uses OpenInference span kinds and attributes; raw request data goes into the primary span attributes instead of a separate child span, so creating a raw_gen_ai_request span would duplicate information.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L1467-L1469

