id: B4123
title: Prompt cache dialect selection and breakpoint accounting
description: >-
  Build lower cache-policy helpers and records in `betterlite-prompts`, using injected
  model/config inputs rather than reading globals or environment in provider code.
  Preserve GPT version/model-map overrides, OpenAI host selection, external-breakpoint
  census, four-slot accounting and dialect/external-count stamps.

  This task owns the module-level validators, checks and counters that probe model metadata
  and configuration to select cache dialect and measure breakpoints outside message bodies.
  The `AnthropicCacheControlHook` class methods here decide whether Anthropic's `cache_control`
  or OpenAI's `prompt_cache_breakpoint` dialect applies, perform census operations and stamp
  those decisions onto injection points so later passes see them. No round-trip reads of
  globals are allowed; all inputs come through constructor/method parameters.

  Build in `betterlite-prompts::cache_accounting` and `betterlite-prompts::cache_accounting/**`.
  Preserve the exact GPT version pattern (gpt-N or gpt-N.M), minimum version (5, 6),
  model-cost catalog lookup (full name then suffix), and explicit `prompt_cache_options`
  detection. The OpenAI API host check reads `api_base` parameter, then global `litellm.api_base`,
  then environment variables `OPENAI_BASE_URL` and `OPENAI_API_BASE` in order, defaulting
  to OpenAI's public host. The `anthropic_prompt_caching_ttl` setting accepts only "5m" or "1h",
  defaulting to "ephemeral" (5-minute cache). The injection-point types and stamping functions
  are designed so a later task (B4125) can thread provider-capability predicates through them
  without reading globals. The maximum cache control blocks is 4 per
  Anthropic and Bedrock limits; track reserved blocks from external (tool, top-level cache_control,
  tool_config point) and internal census independently. Two message-list passes (one with full
  role-targeted points, one deferred to skip unless the first list changes shape) depend on
  the `_litellm_carry_unmatched_cache_control_points` flag and the Responses route's `instructions`
  becoming a system message later. The module also records the injection stamps (`_litellm_openai_dialect`,
  `_litellm_external_breakpoints`) read by downstream tasks.

  Load config through `betterlite-config` and pass the typed TTL policy to the consuming
  `betterlite-anthropic` (B568) and `betterlite-models` (B193) callees; these features are
  injected contracts, not new reads from globals.

