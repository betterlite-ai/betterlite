pitfalls:
  - 'targets_openai_api checks api_base as the parameter first, before fallback to globals. The None-handling
    order matters: if api_base is an empty string, globals are checked; if explicitly None, the check stops.'
  - 'The GPT version tuple comparison requires both major and minor components; gpt-5 becomes (5, 0) and
    gpt-4.5 becomes (4, 5), so the minimum version (5, 6) rejects gpt-5.0.'
  - 'Model map lookup by suffix can match a different model alias than the input name (e.g., "gpt-4-turbo-2024-04-09"
    matches "gpt-4-turbo" via suffix); the implementation reflects LiteLLM behavior exactly.'
  - 'Tools in extra_body["tools"] replace the direct tools parameter in the external count census; the max
    is taken to ensure neither envelope variant can exceed the cap by undefining one side.'
  - 'Carried message points are forwarded only when carry_unmatched flag is set; role-targeted points
    with no ordinal index are held back unless the flag indicates a later pass will complete the message list.'
  - 'The oracle helper for this task is pre-registered as b4123 in the prompts group. Replace the
    stub Op in tools/oracle/src/helpers/prompts/b4123.rs with an impl Helper whose Input is the
    typed input, and write run in tools/oracle/helpers/b4123.py. The registry files (helpers/mod.rs,
    the group files, dispatch.py) are not this task''s to edit.'
review_level: standard
