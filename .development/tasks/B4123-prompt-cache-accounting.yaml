dod:
  - text: >-
      Validators reject non-dict/non-list objects and preserve successful validation results.
      GPT version parsing handles no-dot (gpt-5) and single-dot (gpt-4.5) formats; versions
      compare as tuples (5,6) >= (5,6). Model map lookup checks full name first, then
      model.rsplit("/",-1)[-1] suffix; missing entries return None. OpenAI API checks
      `api_base` parameter, then `litellm.api_base`, then OPENAI_BASE_URL and OPENAI_API_BASE
      environment variables in order, defaulting to api.openai.com; hostname match checks
      exact equality and subdomain containment.
    proof: [behavior-tests]
  - text: >-
      Cache-control carriers are any dict holding "cache_control" or "prompt_cache_breakpoint" key
      (not necessarily non-null). Tools carry at top level (Anthropic) or in "function" (OpenAI).
      Chat transform drops tool cache control only for search/video tool types. OpenAI accepts
      cache breakpoints only on text, image, image_url, file, input_audio, input_text, input_image,
      input_file content types (a closed set). Breakpoint counts recurse into message content arrays
      and system blocks; top-level message carries one, each content block carries at most one.
    proof: [behavior-tests]
  - text: >-
      Request methods extract nested values through validated mapping, preserving original structure.
      User-Agent lookup is case-insensitive across header dict keys. System extraction handles both
      string and list forms. Provider resolution returns None on BadRequestError without raising.
    proof: [behavior-tests]
  - text: >-
      Breakpoint census counts client marks (messages, system, tools, top-level cache_control) and
      config marks (cache_control_injection_points). External count includes tool marks, top-level
      cache_control presence (0 or 1), envelope messages/system via extra_body, and tool_config points.
      The Messages-route variant compares direct and envelope counts, returning the larger to reserve
      capacity. Reserved blocks subtract external count and tool_config points from the 4-block maximum
      when targeting Anthropic (0 for OpenAI). Points carry stamp key copies so downstream passes see
      them without re-reading globals.
    proof: [behavior-tests]
  - text: >-
      Default control builds `ChatCompletionCachedContent` with type "ephemeral", reading TTL from
      `anthropic_prompt_caching_ttl` config and accepting only "5m" or "1h"; any other value
      defaults to 5-minute ephemeral. The helper is called only after all gating checks pass
      (model support, client marks present, one-shot suppression).
    proof: [behavior-tests, config-tests]
  - text: >-
      Injection-point stamping preserves input sequences and creates copies when adding dialect
      or external-breakpoint stamps; config-owned points are not mutated. Stamps record the result
      of dialect detection and the client's external breakpoint count so later passes do not re-read
      them. Request-cache-control gating suppresses defaults (not configured injection) when any
      client mark is detected, on either the message list or in extra_body.
    proof: [behavior-tests]
  - text: Config loader exercises all valid and invalid TTL values and the default case.
    proof: [config-tests, config-corpus]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case seed replays.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Dialect detection, breakpoint counting and stamping must not read globals and must preserve LiteLLM semantics.
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^cache_accounting::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4123.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/cache-accounting-*)" && grep -rlq "cache_accounting" tools/oracle/fuzz/corpus/helper_case/cache-accounting-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves the TTL setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::prompt_cache_accounting::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/prompt-cache-*)" && grep -rlq "anthropic_prompt_caching_ttl" crates/betterlite-config/fuzz/corpus/config_yaml/prompt-cache-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
