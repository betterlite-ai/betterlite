deviations:
  - what: >-
      Cursor handler logs all requests with zero cost and extracts metadata from response body fields (id, name, status)
      rather than separately managing agent costs.
    why: Cursor API does not publish pricing; logging zero cost preserves request context without inferring charges.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/cursor_passthrough_logging_handler.py#L82-L110
  - what: >-
      Cursor unmatched requests fall back to the literal format cursor:<method>:<path> (lowercase method, normalized path).
    why: This fallback enables logging of custom or future Cursor endpoints without explicit handler updates, matching the source behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/cursor_passthrough_logging_handler.py#L60
  - what: >-
      TypeSafe returns zero-cost pricing with no warning logged when response/request model cost is not found in litellm.model_cost
      or when Pydantic parsing fails.
    why: Unlike Cursor and Comprehend Medical, TypeSafe has no try/except block or exception logging; validation failures silently produce
      default zero-token, zero-cost payloads matching the source behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/typesafe_passthrough_logging_handler.py#L37-L54
  - what: >-
      TypeSafe handler honors response.usage.cost when custom_llm_provider is openrouter; other providers price from token counts
      and litellm.model_cost lookup using response_model or request_model as the key.
    why: OpenRouter returns provider-calculated costs in the response; other services price from tokens using the model catalog.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/typesafe_passthrough_logging_handler.py#L84-L89
  - what: >-
      Comprehend Medical rounds text length up to the nearest 100-character unit, with a 1-unit minimum. Unknown operations
      return zero cost with a warning instead of raising an error.
    why: AWS charges per started unit; LiteLLM uses the same rounding and fallback on unsupported operations.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/comprehend_medical_passthrough_logging_handler.py#L37-L42
out_of_scope:
  - HTTP routing and passthrough request forwarding. B102 owns route registration.
  - Cost accounting, budgets and spend tracking. B190 provides logging payloads that downstream tasks record.
  - Provider authentication, request validation and upstream error handling.
  - Batch operations and async polling. These service handlers only process single synchronous calls.
pitfalls:
  - >-
    Cursor endpoint patterns include path parameters like {id}; classification must match these with wildcards
    while preserving operation names that distinguish different HTTP methods on the same path.
  - >-
    Cursor unmatched requests fall back to the literal format cursor:<method>:<path> where method is lowercased
    and path has trailing slashes stripped; this format enables logging of custom or future endpoints without handler updates.
  - >-
    TypeSafe ValidationError in _parse_typesafe_response returns _TypeSafeResponse() with model=None and usage=None
    silently without logging or exception handling, producing zero tokens and zero cost.
  - >-
    TypeSafe pricing lookup tries model_keys in order (response_model first, then request_model) and catches
    ValidationError when unpacking cost dictionaries; missing keys or invalid schemas default to zero cost per token.
  - >-
    Comprehend Medical requires x-amz-target header with format like "ComprehendMedical_V20181030.DetectPHI".
    Operation is the rightmost dot-separated component; missing/malformed header returns empty operation and zero cost.
  - >-
    Text length for Comprehend Medical is measured in Unicode characters, not bytes. UTF-8 encoding or API-side decoding
    changes never affect the billing unit calculation, which runs on raw request.Text after JSON parsing.
  - >-
    OpenRouter is the only provider that sends back a cost field in usage; all other providers in the TypeSafe handler
    use token multiplication against litellm.model_cost. Fallback pricing is 0.0 when the model/key is absent.
review_level: security
