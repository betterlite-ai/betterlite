id: B3651
title: Cursor TypeSafe and Comprehend Medical logging
description: >-
  Implement three small service-specific passthrough logging handlers that transform provider
  responses into standardized logging payloads. Each handler classifies requests, extracts
  response data, calculates costs according to provider pricing models, and enriches the
  logging payload with operation names and model identifiers.

  Cursor handler maps API endpoints to readable operation summaries and logs all requests
  with zero cost, extracting agent ID/name/status from responses. Unmatched requests fall back
  to the literal format cursor:<method>:<path> (lowercase method, normalized path). The handler
  wraps its body in try/except, logs warnings via verbose_proxy_logger.exception on failure,
  and returns an intact payload with the original response and kwargs. TypeSafe handler parses
  response body and request model to determine a logged model name; when custom_llm_provider is
  "openrouter" and response.usage.cost is present, that field becomes response_cost; otherwise
  response_cost is input_tokens × input_cost_per_token + output_tokens × output_cost_per_token
  via litellm.model_cost lookup. TypeSafe has no exception handler or logging; ValidationError
  or missing model keys silently return zero-cost, zero-token defaults with no warning logged.
  Comprehend Medical measures request text length, charges per started 100-character unit
  (minimum 1 unit) using provider-specific tariffs, and extracts operation names from x-amz-target
  headers. The handler wraps its body in try/except, logs warnings via verbose_proxy_logger.exception
  on failure, and returns an intact payload with the original response and kwargs.

  Each handler shares the get_standard_logging_object_payload API from B190 and receives
  request/response bodies, timing, HTTP metadata and kwargs through a standard interface.
  Cursor and Comprehend Medical preserve LiteLLM's warn-and-return fallback when pricing or
  parsing fails; TypeSafe silently defaults to zero cost on validation failure. Implement
  these three handlers in separate domain modules under betterlite-core::api::passthrough_logging,
  reusing wire format types and injected logging state.
