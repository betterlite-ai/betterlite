dod:
  - text: Cursor handler classifies requests into operation names from CURSOR_AGENT_ENDPOINTS and falls back to cursor:<method>:<path> for unmatched endpoints.
    proof: [passthrough-tests]
  - text: Cursor handler extracts agent metadata (id, name, status) from response body and logs zero cost for all requests.
    proof: [passthrough-tests]
  - text: Cursor handler exception catches errors during classification or logging, logs warnings via verbose_proxy_logger.exception, and returns an intact payload.
    proof: [passthrough-tests]
  - text: TypeSafe handler parses response and usage records via Pydantic ValidationError fallback to empty defaults with no logging.
    proof: [passthrough-tests]
  - text: TypeSafe handler looks up model prices in litellm.model_cost using response model then request model as keys; missing models default to zero cost per token silently.
    proof: [passthrough-tests]
  - text: TypeSafe handler honors response.usage.cost when custom_llm_provider is openrouter and cost is not None; otherwise calculates response_cost from token counts and per-token rates.
    proof: [passthrough-tests]
  - text: TypeSafe handler always returns a successful payload with the relayed result unchanged, even when parsing, validation, or cost lookup fails.
    proof: [passthrough-tests]
  - text: Comprehend Medical handler extracts operation from x-amz-target header by splitting on the last dot and taking the final component.
    proof: [passthrough-tests]
  - text: Comprehend Medical handler calculates cost as character count rounded up to the nearest 100-character unit (minimum 1 unit) times the per-operation tariff, returning zero cost for unknown operations.
    proof: [passthrough-tests]
  - text: Comprehend Medical handler exception catches errors during operation/cost calculation, logs warnings via verbose_proxy_logger.exception, and returns an intact payload.
    proof: [passthrough-tests]
  - text: All handlers use get_standard_logging_object_payload to emit their payloads and set model, custom_llm_provider and response_cost in both kwargs and logging_obj.model_call_details.
    proof: [passthrough-tests]
