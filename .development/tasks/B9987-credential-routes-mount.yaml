id: B9987
title: Mount the credential routes over the shared database
description: >-
  B1601 built the credential registry, the handlers and a router builder over two ports (a credential store and the
  deployment lookup by model id), and B1100 left crates/betterlite-server/src/routes/credentials.rs and
  state/credentials.rs as stubs that routes.rs already merges. This task backs the ports with the shared state, fills
  both stubs, seeds credential rows in the Postgres fixture and proves the routes over HTTP. Read B1601's trait
  definitions on the branch and implement exactly those signatures.


  1. The store. Implement B1601's credential store over B725's CredentialsRepository on `shared.db` (B8610's
  Option<Arc<PostgresStore>>). When `shared.db` is None the state holds no store, so B1601's handlers keep LiteLLM's
  500 db_not_connected answer. Never open a second pool.


  2. The lookup. Implement the deployment lookup over B8610's `shared.router`, the way LiteLLM reads
  llm_router.get_deployment(model_id). With no router installed the route answers 500 "LLM router not found", as
  LiteLLM does when llm_router is None.


  3. The slot and the router. state/credentials.rs holds `shared.credentials` (B8610's one CredentialRegistry, loaded
  at boot through B8590's credential_list step; never build a second registry) with the store and the lookup.
  routes/credentials.rs returns B1601's router builder over that state. Leave routes.rs and state.rs as they are.


  4. Fixture rows. cold-patch.yaml needs a credential row in Postgres that is not in memory. Add a credentials seed to
  tools/postgres-fixture the way the search_tools seed is laid out: its own module (credentials.rs) with the rows and
  their insert into LiteLLM_CredentialsTable, its `pub mod` line in lib.rs, a `credentials` field in FixtureSeed in
  seed.rs, its error variant in error.rs, the insert call in seed_sql.rs, and `credentials: None` in the existing
  FixtureSeed literals in daily_usage/tests.rs, dashboard/tests.rs and dashboard_governance/tests/support.rs. Seed the
  values encrypted the way B1600 stores them, so both gateways decrypt the same row.


  5. Oracle cases. Exercise every method through B860's independent database-backed HTTP proxies, with LiteLLM booted
  through B5076's prisma toolchain, comparing status, error type/param/code and content-type and ignoring only
  /error/message wording. Permission answers come from the auth layer in front of the routes.
scope:
  paths:
    - crates/betterlite-server/src/routes/credentials.rs
    - crates/betterlite-server/src/routes/credentials/**
    - crates/betterlite-server/src/state/credentials.rs
    - crates/betterlite-server/src/state/credentials/**
    - tools/postgres-fixture/src/credentials.rs
    - tools/postgres-fixture/src/credentials/**
    - tools/postgres-fixture/src/lib.rs
    - tools/postgres-fixture/src/seed.rs
    - tools/postgres-fixture/src/error.rs
    - tools/postgres-fixture/src/seed_sql.rs
    - tools/postgres-fixture/src/daily_usage/tests.rs
    - tools/postgres-fixture/src/dashboard/tests.rs
    - tools/postgres-fixture/src/dashboard_governance/tests/support.rs
    - tools/oracle/cases/management/credentials/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/credential_endpoints/endpoints.py#L32-L400
    why: The decorated routes, their auth dependency, the prisma_client None answers and the llm_router lookup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/credential_accessor.py#L10-L36
    why: Ordered lookup and upsert behavior the booted cases observe.
dod:
  - text: The store, the lookup and the slot back B1601's router with shared.db, shared.credentials and shared.router, with no second registry or pool.
    proof: [credential-mount-tests]
  - text: Credential HTTP methods answer like LiteLLM through the booted proxies for success, missing-target, duplicate, invalid-body, permission and no-database requests.
    proof: [credential-mount-tests, oracle]
  - text: The Postgres fixture seeds encrypted credential rows that both gateways read.
    proof: [fixture-credential-tests, oracle]
checks:
  optional: []
  commands:
    - id: credential-mount-tests
      why: A port is backed by a fake or a second copy of shared state, or the router is not built over the slot.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^state::credentials::/) | test(/^routes::credentials::/)'
    - id: fixture-credential-tests
      why: The fixture cannot seed credential rows, or seeds them in a shape LiteLLM cannot decrypt.
      run: cargo nextest run --locked -p betterlite-postgres-fixture --no-tests=fail -E 'test(/^credentials::/)'
oracle_cases:
  - tools/oracle/cases/management/credentials/create-and-duplicate.yaml
  - tools/oracle/cases/management/credentials/model-id-precedence.yaml
  - tools/oracle/cases/management/credentials/list-memory-masking.yaml
  - tools/oracle/cases/management/credentials/name-with-slashes.yaml
  - tools/oracle/cases/management/credentials/model-lookup-missing.yaml
  - tools/oracle/cases/management/credentials/patch-rename-and-empty-info.yaml
  - tools/oracle/cases/management/credentials/cold-patch.yaml
  - tools/oracle/cases/management/credentials/delete-twice.yaml
  - tools/oracle/cases/management/credentials/missing-database.yaml
  - tools/oracle/cases/management/credentials/auth-and-invalid-body.yaml
deviations: []
out_of_scope:
  - "The registry, the handlers, the ports, the decoder and the credential_list section: B1601. Shared and its fields: B8610. The boot step that loads credential_list: B8590."
  - B785 owns the static /credentials/migrate-encryption and /credentials/migrate-encryption/check paths; compose them without a duplicate wildcard registration.
pitfalls:
  - A PATCH of a DB row absent from credential_list deliberately leaves the GET list unchanged until refresh, so cold-patch.yaml compares the GET after the PATCH too.
  - The fixture's credential values must be encrypted with the same key both gateways get from the case config, or the masked GET answers differ.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
