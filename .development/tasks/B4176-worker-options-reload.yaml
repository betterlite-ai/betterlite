      run: >-
        ! grep -rq "std::env::set_var" crates/betterlite-server/src/worker_options.rs crates/betterlite-server/src/worker_options crates/betterlite-config/src/sections/worker_options_reload.rs crates/betterlite-config/src/sections/worker_options_reload 2>/dev/null
oracle_cases: []
deviations:
  - what: betterlite runs on axum/tokio and does not use uvicorn, so timeout_worker_healthcheck and limit_max_requests_jitter are never honored, only warned about and ignored.
    why: betterlite cannot introspect an installed uvicorn package; it accepts these flags for compatibility but has no effect to apply. The warnings use literal flag names from LiteLLM without version checks.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L316-L353
  - what: Native settings do not mutate the process environment. LITELLM_DEV_ENV_HOT_RELOAD setting stays in a config field, not in std::env.
    why: In Python, os.environ.set_var affects the reloader's subprocess. Rust cannot safely mutate the process environment, and the setting can be passed as a data structure instead. When B4175 wires the CLI to B003, it supplies the resolved settings as arguments, not by mutating globals.
out_of_scope:
  - Worker process forking and subprocess lifecycle. That belongs to B4177.
  - Calling uvicorn or other worker frameworks directly. Settings construction stays pure and framework-independent.
  - The full CLI handler for reload/worker flags. B4175 constructs the settings from user input, not this task.
  - Request logging or any logger/backend integration. Those come from B012 and later tasks.
pitfalls:
  - LiteLLM's reload options use basename-only patterns for uvicorn's glob resolution, so absolute paths are rejected by watchfiles. Use pathlib to resolve to absolute for the extra-paths set, but pass only basenames to uvicorn's reload_includes.
  - Max requests jitter only applies when max_requests_before_restart is set; the warning still fires if only jitter is provided.
  - Uvicorn's StatReload.iter_py_files is monkey-patched idempotently in LiteLLM; subsequent calls accumulate paths in a mutable set on the class.
  - Reload watches the config parent directory only if it is distinct from the current working directory; same-directory config is not added twice.
  - When config_path is not provided, reload watches only the current directory and ["*.py", ".env"] (no config basename).
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
