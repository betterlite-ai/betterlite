id: B4176
title: HTTP worker options and development reload
description: >-
  Build typed listener, recycle and reload settings in betterlite-config consumed by the server adapter,
  and keep option construction below the CLI dispatcher so tests can compare settings without starting
  workers. Host defaults to 0.0.0.0, port to 4000, keepalive_timeout to 30 seconds,
  timeout_worker_healthcheck to 30 seconds, max_requests_before_restart to absent. Implement reload
  development mode with watch directories and includes mirroring LiteLLM's uvicorn reload kwargs
  (*.py, .env, config basename), fallback to polling with extra paths, and a .env override warning.
  Warn when unsupported Uvicorn options appear on the CLI (timeout_worker_healthcheck,
  limit_max_requests_jitter), but accept them without mutation of process environment. Preserve option
  precedence: explicit flag, then environment variable, then default. Server header is always false,
  log_config precedence is explicit, then JSON_LOGS, then LITELLM_LOG. Max requests jitter only applies
  when max_requests is set. From LiteLLM's ProxyInitializationHelpers class methods, extract pure
  settings builders: resolve_uvicorn_settings, apply_max_requests_jitter, resolve_reload_options,
  patch_reload_extra_paths, configure_dev_reload, and resolve_loop_type. Reload watches current
  directory, config parent if distinct, plus *.py, .env and config basename. Never mutate std::env;
  native settings build data structures the caller passes to the worker process.
scope:
  paths:
    - crates/betterlite-server/src/worker_options.rs
    - crates/betterlite-server/src/worker_options/**
    - crates/betterlite-config/src/sections/worker_options_reload.rs
    - crates/betterlite-config/src/sections/worker_options_reload/**
  lint_tables: false
