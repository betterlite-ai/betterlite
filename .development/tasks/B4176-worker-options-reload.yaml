  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L327-L353
    why: _apply_uvicorn_max_requests_jitter, the max_requests and jitter handler.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L355-L374
    why: _get_reload_options, the reload file watch configuration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L376-L415
    why: _patch_statreload_extra_paths, the StatReload monkey patch for .env and config watches.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L417-L433
    why: _configure_dev_reload, the full reload setup with LITELLM_DEV_ENV_HOT_RELOAD and .env warning.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L653-L658
    why: _get_loop_type, the platform-dependent event loop selection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_logging.py#L632-L655
    why: resolve_log_level, the log level parser called by _get_default_unvicorn_init_args.
dod:
  - text: UvicornSettings, ReloadSettings and LoopType types exist in betterlite-config and are loaded from config sections worker_options and dev_reload.
    proof: [config-types]
  - text: resolve_uvicorn_settings builds settings with precedence log_config > JSON_LOGS env > LITELLM_LOG, server_header always false, and applies timeout_worker_healthcheck when set, warning on unsupported uvicorn versions.
    proof: [uvicorn-settings-tests]
  - text: apply_max_requests_jitter applies limit_max_requests_jitter when max_requests is set, warns when max_requests is absent; limit_max_requests_jitter is accepted, warned about by literal flag name, and ignored (betterlite has no uvicorn to introspect).
    proof: [jitter-warning-tests]
  - text: resolve_reload_options watches the current directory, config parent if distinct, *.py, .env, and the config basename.
    proof: [reload-options-tests]
  - text: patch_reload_extra_paths patches StatReload.iter_py_files and is idempotent.
    proof: [reload-patch-tests]
  - text: configure_dev_reload logs the .env override warning without mutating process environment, and accepts reload with development overrides applied.
    proof: [dev-reload-tests]
  - text: resolve_loop_type returns None on Windows/Cygwin/CLI and "uvloop" elsewhere.
    proof: [loop-type-tests]
  - text: No native code mutates std::env or process environment variables in the worker_options module or the worker_options_reload config section.
    proof: [environment-immutable-check]
