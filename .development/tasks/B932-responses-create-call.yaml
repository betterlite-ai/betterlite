id: B932
title: Responses asynchronous create entry point
description: >-
  Implement only the whole aresponses function in api/responses_create_call. The entire synchronous
  responses function now belongs to B1078, including its execution tail. The async entry preserves
  call context, converts text_format through B905 and performs eligible asynchronous prompt
  management through B117. B931 supplies provisional bridge context, credential-safe provider
  swaps and the one-shot _AsyncPromptManagementOutcome. B174 resolves the initial provider for
  exception attribution; B904 updates returned IDs and B185/B186 classify errors.

  All named optional arguments default null, including stream,background,store,parallel_tool_calls,
  include,instructions,max_output_tokens,prompt,metadata,previous_response_id,reasoning,temperature,
  text,text_format,tool_choice,tools,top_p,truncation,user,service_tier,safety_identifier,extra_headers,
  extra_query,extra_body,timeout and custom_llm_provider. Set trusted aresponses=true before the
  sync handoff. When the async prompt hook ran, remove prompt_id and carry merged optional params
  plus valid deployment metadata to B1078; never rerun the synchronous prompt hook. Forward the
  converted text rather than text_format. Await a returned coroutine once, leave iterators intact
  and reject a null final response with the exact source error below.

  Add SdkHttpCall::ResponsesAsyncCreate to B2401. The pinned adapter calls litellm.aresponses with
  no replacement SDK functions and its real HTTP base set to the mock. Native invokes this service.
  Prompt hooks are scripted dependency outcomes and provider responses still cross HTTP. B1078
  owns native/chat execution and B927 stream parsing; this wrapper adds no decoder. The complete
  function has 158 nonblank/non-comment lines; budget 170 implementation, 120 tests, 90 fixtures,
  90 adapters and 25 wiring, 495 under 540.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_create_call.rs
  - crates/betterlite-core/src/api/responses_create_call/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/responses_async_create.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/responses_async_create.py
  - tools/oracle/cases/sdk-http/responses-async-create/**
  - tools/oracle/fuzz/corpus/sdk_http_case/responses-async-create-*
  - Cargo.lock
  - tools/oracle/helpers/b932.py
  - tools/oracle/helpers/b932/**
  - tools/oracle/src/helpers/core_ops/b932.rs
  - tools/oracle/src/helpers/core_ops/b932/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L575-L761
  why: The complete decorated async wrapper, async-only prompt hook and final response/ID checks.
dod:
- text: >-
    async_create_parameter_handoff sends input=hello,model=openai/gpt-4o,text_format={type:json_object},
    instructions=short,temperature=0,parallel_tool_calls=false,store=false,background=false,
    service_tier=flex,safety_identifier=user-a,extra_headers={X-Trace:a}. Expect one POST /v1/responses
    with each supplied provider field preserved, text.format.type=json_object and the trace header;
    omitted null options are absent. Native capture checks every named argument listed above,
    trusted aresponses=true and preserved call context. text_format itself is absent from the
    sync handoff because its converted text already carries it. Extra query/body/timeout retain
    B1078's execution semantics rather than being independently interpreted here.
  proof: [handoff, oracle, python-adapter]
- text: >-
    asynchronous_prompt_runs_once uses prompt_id=p,prompt_label=production,prompt_version=2,
    prompt_variables={name:Ada} and an async hook returning a prefixed system message, model
    openai/gpt-4o-mini and temperature=0.2. Expect that model and one prefix upstream, temperature=0.2,
    one async hook and zero sync hooks. Remove prompt_id; consume the one-shot optional outcome.
    No eligible logging object means no hook. Same-model result avoids re-resolution; changed
    provider drops deployment metadata, and B931 rejects a cross-provider swap with resolved
    credentials before HTTP. Bridged prompt hooks observe the temporary cache-control signal;
    native hooks do not acquire it, and errors still remove the bridged signal.
  proof: [async-prompt, oracle, python-adapter]
- text: >-
    async_create_result_identity returns mock complete response id=resp_a and metadata model_id=deployment_a.
    Decode the result ID to provider=openai,model_id=deployment_a,response_id=resp_a, with hidden
    custom_llm_provider=openai; do not double-encode an already encoded response. A live mock SSE
    returns an async iterator, consumed through B927 with no typed-response rewrite in this wrapper.
    A truthy SDK mock_response bypass from B1078 is still stamped/encoded here, unlike the direct
    sync shortcut. Native tests cover already completed versus coroutine outcomes and await exactly once.
  proof: [result-identity, oracle, python-adapter]
- text: >-
    async_create_failure_attribution injects a null execution outcome and gets cause
    "Got an unexpected None response from the Responses API: None", mapped as APIConnectionError,
    status=500,type=null,param=null,code=null. Initial provider detection uses model and api_base=null
    from the absent local base_url and records the resolved provider in error context. Mock HTTP
    401 {error:{message:bad key,type:invalid_api_key,param:null,code:invalid_api_key}} becomes SDK
    AuthenticationError,status=401,type=null,param=null,code=null. Preserve the shared redacted
    public message policy and exact typed local cause, without copying provider error body fields.
  proof: [async-errors, oracle, python-adapter]
- text: New async-create SDK-case seeds prove actual HTTP execution and pass the existing case decoder.
  proof: [sdk-corpus, oracle, python-adapter]
checks:
  optional: []
  commands:
  - id: handoff
    why: an async-only named option is dropped or converted text_format is applied twice
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create_call::tests::async_create_parameter_handoff($|::)/)'
  - id: async-prompt
    why: asynchronous prompt management is skipped or the synchronous hook runs again
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create_call::tests::asynchronous_prompt_runs_once($|::)/)'
  - id: result-identity
    why: response IDs nest or iterators are treated as completed responses
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create_call::tests::async_create_result_identity($|::)/)'
  - id: async-errors
    why: null outcomes escape or provider detection is absent from error context
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_create_call::tests::async_create_failure_attribution($|::)/)'
  - id: python-adapter
    why: async create comparison calls a helper instead of the decorated HTTP SDK
    run: test -f tools/oracle/sdk_http/responses_async_create.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: async create has no newly added SDK input seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/responses-async-create-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/responses-async-create/async-create-parameter-handoff.yaml
- tools/oracle/cases/sdk-http/responses-async-create/asynchronous-prompt-runs-once.yaml
- tools/oracle/cases/sdk-http/responses-async-create/async-create-result-identity.yaml
- tools/oracle/cases/sdk-http/responses-async-create/async-create-failure-attribution.yaml
deviations:
- what: The null-result failure keeps APIConnectionError/status=500 but uses the existing bounded error message instead of traceback text.
  why: Shared SDK diagnostics follow B184/B187; the literal local cause is still asserted.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L749-L761
out_of_scope:
- B1078 owns the entire synchronous responses function, predicate and mock builder; no execution tail remains in this task.
- B931 owns selection/prompt helper functions; B955 owns MCP/file-search dispatch; B1116/B933/B934 lifecycle calls and B943 websocket calls retain their whole functions.
- B117 owns prompt backend I/O and hook eligibility; this task consumes its typed asynchronous port.
pitfalls:
- Async prompt management removes prompt_id and carries merged options through a private one-shot outcome.
- The initial resolver gets no api_base from kwargs because it reads a nonexistent local base_url.
- The async wrapper stamps a mock response that the synchronous shortcut returned before stamping.
review_level: security
budget:
  max_changed_lines: 540
  max_new_expects: 0
