dod:
  - text: >-
      Blocking POST /v1/automation/run returns the terminal run response and bills synchronously from the parsed response body.
    proof: [blocking-run-tests]
  - text: >-
      Async POST /v1/automation/run-async spawns a detached billing poller that polls GET /v1/runs/{run_id} until terminal or budget exhausted.
    proof: [async-polling-tests]
  - text: >-
      SSE POST /v1/automation/run-sse starts an at-most-one poller that runs to terminal before logging; if poller is already spawned, the fallback makes one fetch.
    proof: [sse-polling-tests]
  - text: >-
      Polling uses a 5-second interval, 3600-second deadline and 12-consecutive-failure cutoff; failure count resets on successful fetch.
    proof: [polling-budget-tests]
  - text: >-
      Terminal status detection checks if run status is in [COMPLETED, FAILED, CANCELLED]; non-terminal or missing status continues polling.
    proof: [terminal-detection-tests]
  - text: >-
      Missing run_id in async/SSE responses logs a warning and continues polling with None; billing skips the run if fetch fails or times out.
    proof: [missing-runid-tests]
  - text: >-
      HTTP GET includes X-API-Key header from passthrough_endpoint_router.get_credentials and screenshots=none query parameter.
    proof: [fetch-request-tests]
  - text: >-
      Run_id validation rejects IDs containing /, \, #, ?, or the sequence ..; invalid IDs log a warning and return None cost.
    proof: [runid-validation-tests]
  - text: >-
      Polling tasks are registered with weak reference cleanup and cancellation logging; they do not block the relayed response.
    proof: [task-registration-tests]
  - text: >-
      SSE run_id extraction uses B3648's _run_id_from_sse_chunks; fallback makes one fetch if sse_poller_spawned flag is not set.
    proof: [sse-fallback-tests]
  - text: >-
      Logging payload includes model, custom_llm_provider, response_cost and litellm_call_id preserved from initial request or polling state.
    proof: [payload-preservation-tests]
  - text: >-
      All exceptions in polling and logging paths are caught and logged; they never break the relayed response.
    proof: [exception-handling-tests]

checks:
  optional: []
  commands:
    - id: blocking-run-tests
      why: Blocking run handling does not parse response or bill synchronously.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(blocking_run|passthrough_handler)/)'
    - id: async-polling-tests
      why: Async polling does not spawn task or extract run_id from pending response.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(async_polling|start_async)/)'
    - id: sse-polling-tests
      why: SSE polling does not start poller or set spawned flag correctly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(sse_polling|start_sse)/)'
    - id: polling-budget-tests
      why: Polling does not use correct interval, deadline or failure-count reset logic.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(polling_budget|poll_until|deadline|failure)/)'
    - id: terminal-detection-tests
      why: Terminal status detection does not recognize COMPLETED/FAILED/CANCELLED or continues on non-terminal.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(terminal_detection|terminal_status)/)'
    - id: missing-runid-tests
      why: Missing run_id does not log warning or fallback to None cost.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(missing_runid|no_runid)/)'
    - id: fetch-request-tests
      why: HTTP GET does not include X-API-Key header or screenshots=none parameter.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(fetch_request|headers|credentials)/)'
    - id: runid-validation-tests
      why: Run_id validation does not reject disallowed characters or .. sequence.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(runid_validation|safe_runid)/)'
    - id: task-registration-tests
      why: Polling tasks are not registered, cleaned up, or do not log cancellation.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(task_registration|background_task)/)'
    - id: sse-fallback-tests
      why: SSE fallback does not extract run_id or does not respect sse_poller_spawned flag.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(sse_fallback|collected_chunks)/)'
    - id: payload-preservation-tests
      why: Logging payload does not preserve model, custom_llm_provider, response_cost or litellm_call_id.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(payload_preservation|build_logging_payload)/)'
    - id: exception-handling-tests
      why: Exceptions in polling or logging paths break the relayed response or are not caught.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(exception|error|fallback)/)'

