deviations:
  - what: "Polling tasks run asynchronously and are not awaited by the relayed response handler. Both blocking-run and async-run paths are non-blocking except blocking-run processes the response body synchronously."
    why: "Blocking requests poll synchronously; async requests spawn a task so the relayed response returns immediately. SSE polling also runs detached. This preserves LiteLLM's async pattern and non-blocking relayed responses."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L191-L201
  - what: "The task lifetime is server-owned and persists across client disconnects for SSE and async runs. Tasks are registered in a global set and removed on completion or cancellation."
    why: "Polling must survive client disconnect for cost measurement. Weak reference cleanup ensures tasks are properly freed when done. This keeps billing from leaking tasks or stopping on disconnect."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L55-L62

out_of_scope:
  - B3648 owns run parsing, endpoint validation, API base resolution, cost-per-step parsing, and the logging payload record type. This task calls those functions and uses their records.
  - B173 owns the async HTTP client and credential lookup through passthrough_endpoint_router.get_credentials.
  - The framework's PassThroughEndpointLogging._handle_logging sink and passthrough_endpoint_router service are unresolved dependencies per the outline.
  - HTTP routing and request forwarding belong to the unresolved B102 route handler.
  - "B3648 owns SSE frame parsing via _run_id_from_sse_chunks, which parses each data: line as a TinyfishRun and extracts the first run_id; this task dispatches that extraction to polling and billing."

pitfalls:
  - "Polling deadline is absolute monotonic time (now + 3600 seconds); it does not reset on retries and stopping at deadline returns the last polled run (not None)."
  - "Consecutive failure count is scoped to one polling operation. A successful fetch (even if it returns None due to parsing) resets the counter."
  - "The SSE poller is started before the handler finishes collecting chunks; it runs to terminal in background. The fallback checks if a poller was already spawned and makes one fetch if not."
  - "HTTP status codes outside [200, 300) log a warning and return None, not raise. Timeout and network errors are caught and also return None."
  - "Missing run_id from the submitted/pending response logs a warning and starts polling with None; None is passed through to _poll_until_terminal, which returns None and logs no cost."
  - "Terminal status is checked against the TinyfishRun status field after polling; an absent or unknown status does not terminate polling early."
  - "Payload building computes response_cost by calling _run_cost on the polled run; if the run is None or non-COMPLETED, cost is None."
  - "The model name 'tinyfish/automation-run' and custom_llm_provider 'tinyfish' must be preserved in model_call_details and the logging kwargs."
  - "Task cancellation fires both the removal callback and _warn_if_cancelled; do not duplicate the warning logic or the removal."
  - "SSE stream collection is synchronous; the poller is spawned after chunks are fully collected, not during streaming."

review_level: security

