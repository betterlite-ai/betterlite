id: B3649
title: TinyFish terminal run polling and billing
description: >-
  Implement terminal-run billing, async run polling and SSE stream fallback over B3648's run records and constants.

  Build handlers for three run-submission paths: blocking POST /v1/automation/run returns the terminal run object immediately and bills synchronously; POST /v1/automation/run-async returns a pending run and spawns a detached billing poller; POST /v1/automation/run-sse returns SSE frames and starts an at-most-one poller that runs to terminal before logging.

  The async poller and SSE poller both poll GET /v1/runs/{run_id} using the same credentials lookup and HTTP transport as B3648's request routing, with a 5-second interval and 3600-second deadline. Stop polling when the run status reaches a terminal state (COMPLETED, FAILED, or CANCELLED), or after 12 consecutive fetch failures (reset to zero on successful fetch). Keep the last run even if polling fails, and log the request with cost None when the deadline passes or all fetches fail.

  The SSE fallback makes one fetch if no poller was spawned (from the collected chunks SSE operation), extracting the run_id from the first data frame in the stream using B3648's SSE parser.

  Both async and SSE paths dispatch through the injected PassThroughEndpointLogging._handle_logging sink once the run is terminal or the polling budget exhausted. Preserve model, custom_llm_provider, response_cost and litellm_call_id in the logged payload, and survive all billing failures without breaking the relayed response.

  Build in crates/betterlite-server as the pass_through_logging::tinyfish module, extending B3648's implementation.

