  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/daily_activity_repository.py#L212-L223
    why: export_rows, built by B729; pages of USAGE_EXPORT_BATCH_SIZE rows yielded in order, and a later page failure after earlier rows were yielded.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/daily_activity_scopes.py#L358-L396
    why: USER_RESOLVER and TEAM_RESOLVER; each resolver's entity name, route prefixes, tags and export operation name.
  - url: https://docs.python.org/3/library/csv.html#csv.writer
    why: Default dialect, QUOTE_MINIMAL and the lineterminator argument that _csv_row sets to CRLF.
dod:
  - text: Every prefix of the six resolvers (7 paths, /end_user included) answers GET `{prefix}/daily/activity/export`, and /end_user is hidden from /openapi.json.
    proof: [oracle, routes-tests]
  - text: >-
      The default export is CSV with media type "text/csv; charset=utf-8", `Cache-Control: no-store` and
      `Content-Disposition: attachment; filename="<entity>-usage-<start>-<end>-daily.csv"`; format=json gives
      application/json and the .json name, and export_type changes the name's last part.
    proof: [oracle, routes-tests, filename-tests]
  - text: An export with no rows is the CSV header line of the 17 field names ending in CRLF, or exactly `[]` for JSON.
    proof: [oracle, encode-tests]
  - text: >-
      CSV cells follow csv.writer: commas, quotes, CR and LF force quoting with doubled quotes, None is empty, CRLF ends every row,
      and string cells starting with =, +, -, @, TAB or CR get a leading single quote while numbers do not.
    proof: [csv-tests, helper-case-corpus]
  - text: JSON rows are compact objects with the 17 fields in order and null for None, joined by commas inside one array.
    proof: [encode-tests]
  - text: An export_type or format outside the listed values answers 422 instead of falling back to a default.
    proof: [oracle, routes-tests]
  - text: A missing database answers 500 with the db_not_connected_error text before a 422 for export_type or format.
    proof: [oracle, routes-tests]
  - text: A missing or non-canonical date, a reversed range and a range over 400 days answer 400 with detail.error before the scope resolver runs, and a denied scope answers 403 or 404 with detail.error.
    proof: [oracle, routes-tests]
  - text: >-
      A failure while reading the first row answers 500 with detail.error starting "Failed to fetch analytics" and logs "Daily activity export failed";
      a failure after the first row ends the body with an error and logs "Daily activity export stream failed".
    proof: [failure-tests]
  - text: The stream sends at most EXPORT_MAX_ROWS rows; with one more row available it logs and ends the body with an error without closing the JSON array, and with exactly EXPORT_MAX_ROWS rows it finishes normally.
    proof: [limit-tests]
  - text: Rows are sent one at a time without collecting the export, and dropping the response body stops reading from the repository.
    proof: [limit-tests]
checks:
  optional: []
  commands:
    - id: routes-tests
      why: the export route set, parameter validation, date check order, database check or headers are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_export::tests::route_/)'
    - id: filename-tests
      why: export_filename or content_disposition build another name than LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_export::tests::filename_/)'
    - id: csv-tests
      why: csv_cell or csv_row quote, terminate or guard cells differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_export::tests::csv_/)'
    - id: encode-tests
      why: the CSV header, the JSON array framing or the field order of a row are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_export::tests::encode_/)'
    - id: failure-tests
      why: repository errors before or after the first row are not handled and logged as LiteLLM does
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_export::tests::failure_/)'
    - id: limit-tests
      why: the row limit is missing, off by one, closes a truncated JSON array, or the stream buffers rows
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_export::tests::limit_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3098)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3098 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3098/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added export cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/daily-activity-export-*")" &&
        grep -lE '^[[:space:]]+b3098:' tools/oracle/fuzz/corpus/helper_case/daily-activity-export-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
