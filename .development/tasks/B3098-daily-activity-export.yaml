id: B3098
title: Stream scoped daily activity exports as CSV or JSON
description: >-
  Build the module `daily_activity_export` in betterlite-server. It serves GET `{prefix}/daily/activity/export` for
  every entity that has daily activity routes and streams the rows of the caller's scope as a CSV or JSON download.
  The scope of the caller (which users, teams, tags and so on they may see) is decided before any row is read, by
  B3094 and B3095. This task does not touch daily_activity_routes (B3096 owns that module); it imports that module's
  helpers `resolved_scope`, `get_daily_activity_prisma_client` and `get_daily_activity_repository`.

  Routes. For each prefix of an entity's resolver (`route_prefixes`: /user, /team, /tag, /organization, /customer and
  /end_user, /agent) register one GET route `{prefix}/daily/activity/export`. That makes 7 routes. /end_user is an alias of
  /customer that LiteLLM leaves out of /openapi.json; keep it out of the schema too. Each route is authenticated by
  B052, carries the resolver's tags and the `export` operation name from B3094's `OperationNames`, and runs inside
  B865's management completion wrapper, like `@management_endpoint_wrapper`. The wrapper sees the response when the
  handler returns it, before the body streams, so a failure inside the body never reaches it. Expose one public
  function `export_routes(resolver)` that returns the axum routes for one resolver; B8482 composes them and this task
  adds no loop over all entities. The OpenAPI entry lists a 200 response with the description "Streamed daily
  activity export" and two content types, text/csv (schema string) and application/json (array of objects).

  Query parameters. The entity's own parameters come from B3094 and B3095 types, and this task turns the query string
  into them (a malformed timezone or boolean answers 422 in the envelope B003 uses for query validation errors, like
  B3096). Added by this task: `export_type` (daily, daily_with_keys, daily_with_models or daily_with_users, default
  daily; B2312's `ExportType`) and `format` (csv or json, default csv; the Rust field is `file_format` and the query
  name is `format`). Any other value answers 422, never a fallback.

  Order inside the handler. First the dependencies run in this order: the entity query, the caller (B052), the daily
  activity repository, the database handle. A missing database stops there with HTTP 500 and detail
  `{"error": <CommonProxyErrors.db_not_connected_error text>}`, before any 422 for `export_type` or `format`. Then
  `resolved_scope` runs with user_aggregated=false (400-day cap included; a bad range is 400, a denied scope 403 or
  404, detail `{"error": <reason>}`). Then the handler calls the repository's `export_rows(scope, export_type)` (B729)
  and reads its first row before it builds the response. A failure of that first read, or any other error that is
  not already an HTTP error, answers 500 with detail `{"error": "Failed to fetch analytics: <error text>"}` and logs
  at error level "Daily activity export failed: %s". An HTTP error from the scope step passes through unchanged.

  Response. Status 200, media type text/csv for csv (with "; charset=utf-8" appended, as Starlette does for any text/*
  type) or application/json for json (no charset), and two headers: `Cache-Control: no-store` and
  `Content-Disposition: attachment; filename="<name>"`. The name is
  `{entity}-usage-{start_date}-{end_date}-{export_type}.{csv|json}`, where entity is the resolver's entity name
  (user, team, tag, organization, customer, agent), the two dates are the scope's dates parsed as ISO dates and
  printed back, and export_type is the wire spelling. Functions `export_filename` and `content_disposition` build
  them. A scope date that is not YYYY-MM-DD is a 500 through the generic error path above, as in LiteLLM.

  Body. `ExportRow` (B2312) has 17 fields in this order: date, entity_id, entity_alias, api_key, key_alias, user_id,
  user_email, model, spend, flat_cost, prompt_tokens, completion_tokens, api_requests, successful_requests,
  failed_requests, cache_read_input_tokens, cache_creation_input_tokens. CSV: the first chunk is the header row of
  the field names, then one chunk per row. Every row ends with CRLF. Cells follow Python's csv.writer with default
  dialect and quoting minimal: a cell containing a comma, a double quote, CR or LF is wrapped in double quotes with
  inner quotes doubled; None is an empty cell; integers print in plain decimal; floats print as the shortest text
  that reads back to the same number (a deviation from Python's repr is listed below). `csv_cell` guards against
  spreadsheet formula injection: a string cell that starts with one of `=`, `+`, `-`, `@`, TAB or CR gets a leading
  single quote, before quoting. The guard applies to strings only, so a negative number is not changed. It also
  applies to the header row (field names never start with these characters). Use the `csv` crate's writer with
  those settings if it matches byte for byte (check the CRLF terminator and the quoting of fields with a bare CR);
  otherwise write the small quoting function in `csv_row`. JSON: an empty export is exactly `[]`; otherwise `[`,
  the first row object, then `,` plus each later row object, then `]`. Each object lists the 17 fields in order with
  None as null, and is compact (separators "," and ":", no spaces). With no rows, csv still sends the header row.

  Limits. LiteLLM streams every row the repository returns, which has no upper bound (B729 reads pages of 1000 until
  a short page). rules.yaml bounded-inputs requires a limit, so this task adds one: `pub const EXPORT_MAX_ROWS:
  usize = 1_000_000`, a fixed constant and not an env setting. The stream counts rows as it sends them. When it has
  sent EXPORT_MAX_ROWS rows and the repository still has a next row, it stops, logs at error level "Daily activity
  export stopped at %s rows" and ends the body with an I/O error so the connection is cut and the client sees a
  failed download. It does not close a JSON array or send a short CSV as if it were complete. If the repository
  ends right at the limit, the export finishes normally. No row is buffered: each row is encoded and handed to the
  body before the next one is read, and when the client disconnects the stream is dropped so B729 stops its page
  queries.

  Mid-stream failure. After the headers are sent a repository error cannot change the status. The stream logs at
  error level "Daily activity export stream failed: %s" and ends the body with an I/O error, as above; rows already
  sent stay sent.

  HTTP oracle cases are in this task. The seeded database holds users, keys and teams but no daily spend rows, so
  the cases cover empty exports (the CSV header line, `[]`), headers, parameter validation, date errors, access
  errors, the route set per prefix and the missing database. Row encoding, the row limit and mid-stream failure are
  covered by native tests with a stub repository and by helper cases for the pure functions.
