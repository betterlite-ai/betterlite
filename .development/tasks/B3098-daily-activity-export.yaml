deviations:
  - what: >-
      The export stops at EXPORT_MAX_ROWS (1,000,000) rows. When more rows exist, the body ends with an I/O error and the connection drops
      instead of the export running on; LiteLLM has no limit.
    why: rules.yaml bounded-inputs requires a cap on a stream. A hard error is used because status 200 and headers are already sent, and a quiet cut would hand the client an export that looks complete.
  - what: 'A repository failure after the first row is logged ("Daily activity export stream failed: %s") by the stream itself.'
    why: LiteLLM leaves the log to the ASGI server when a generator raises mid-body; betterlite has no such server log, and a failed export must not be silent.
  - what: Float cells in CSV print with Rust's shortest round-trip text, so very small or large values (1e-05, 1e16) can read differently from Python's repr; JSON floats use serde_json's text for the same reason.
    why: Python repr text is not ported (docs/compatibility.md); every value reads back to the same number.
  - what: 'A repository failure answers 500 with "Failed to fetch analytics: " followed by the display text of the Rust error.'
    why: Python exception text cannot be matched; the prefix, status and detail.error shape are kept.
  - what: The six resolver callables become a match on B3094's Entity enum, so the route function takes the entity and calls B3095's dispatch.
    why: rules.yaml requires an exhaustive enum in place of a registry of callables.
out_of_scope:
  - "B3096 owns resolved_scope, date_range_error, get_daily_activity_prisma_client, get_daily_activity_repository and the key report routes (L63-L162, L313-L353, L405-L452, L516-L557)."
  - "B3097 owns the aggregated and search routes and _sum_metrics, _fold_key_metrics and _search_rows (L97-L116, L187-L200, L240-L310, L356-L402)."
  - "B8482 composes the routes of B3096 to B3098 and owns register_daily_activity_routes with its loop over the six resolvers (L560-L579); this task only exposes export_routes."
  - "B729 owns DailyActivityRepository.export_rows and its keyset paging; B2312 owns ExportType and ExportRow; B3094 and B3095 own the resolvers and query shapes."
  - "B3090 owns ScopeDenied, InvalidDateRange and raise_public; B815 owns aggregated_date_range_error."
  - "Registering these routes in the app router is done by B8482, which merges them in the spend area's mount, not by this task."
pitfalls:
  - The query parameter is `format`, not `file_format`; Python renames it with alias="format", and `?file_format=json` must be ignored and give CSV.
  - The first row is read before the response is built, so an empty or failing first page is decided while a normal 500 is still possible; later pages cannot change the status.
  - csv_cell guards strings only, and the check runs before quoting, so "=1,2" becomes the quoted cell "'=1,2" and a float -0.5 is left alone.
  - The CSV terminator is CRLF on every row including the last, and the header row is built with the same writer, so a bare LF never appears.
  - An empty JSON export is the two bytes `[]` and an empty CSV is still one header row; neither is an empty body.
  - The JSON stream writes "[" with the first row and "," before each later row, so a stream cut after row N is invalid JSON and must not receive "]".
  - format and export_type are validated after the missing-database check, so a case with no database and `format=xml` answers 500, not 422.
  - /end_user and /customer share one handler set, so the filename entity for /end_user is "customer" (the resolver's name), not "end_user".
  - The Content-Disposition dates come from the resolved scope, not the raw query strings, so they are always printed as YYYY-MM-DD.
  - Starlette adds "; charset=utf-8" to text/csv but not to application/json; the header values differ in that way and the oracle compares them.
  - The cap counts rows and not bytes, and each row is written to the body as it is read; nothing may collect the rows into a Vec, since that would defeat the cap.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
