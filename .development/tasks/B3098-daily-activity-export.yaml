    - "tools/oracle/fuzz/corpus/helper_case/daily-activity-export-*"
    - tools/oracle/helpers/b3098.py
    - tools/oracle/helpers/b3098/**
    - tools/oracle/src/helpers/server/b3098.rs
    - tools/oracle/src/helpers/server/b3098/**
  lint_tables: false
