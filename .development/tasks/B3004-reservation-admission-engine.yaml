out_of_scope:
- "Reservation lease renewal (B071) and unbound-request cleanup."
- "Settlement and release of reservations (B3003)."
- "Reading current spend from cache and database (B3014, B3015)."
pitfalls:
- "fail_closed_budget_enforcement on a counter that fails to initialize raises 503, while one that fails to reserve during the pipeline call depends on partial-group success."
- "Throttle release exemption applies only to the key's own max_budget counter, not team/window/entity caps; window caps always hard-block."
- "Grouped reservation order is critical: batch read of all counters, then charge in groups so early rejections do not modify later counters."
- "Partial headroom resizing requires checking remaining budget before and after the reservation in the same counter, not after other counters are charged."
- "A counter that is read but fails to initialize is skipped (not charged), but if fail_closed enforcement is on, the request is rejected with 503 instead."
