id: B3004
title: Reserve counters and apply over-budget admission policy
description: Build the admission engine in betterlite-auth::reservation_admission to initialize counters, handle grouped reservations with partial rollback, and enforce over-budget policy. Preserve the distinction between throttled key caps (which release the key's own max_budget counter to the rate limiter) and hard-block window/tenant/entity caps. Preserve partial headroom resizing when remaining budget is positive but insufficient, and fail_closed_budget_enforcement rejecting estimates that do not fit within the present counter state. Initialize counters by loading their current spend and writing to Redis through the pipeline; charge counter groups such that one counter failing does not touch later groups, and settle the over-budget policy per group before moving to the next. Implement the owned native service in crates/betterlite-auth/src/reservation_admission.rs.
