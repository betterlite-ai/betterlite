dod:
  - text: Config section agent_search loads litellm_settings.agent_search_embedding_model (absent by default) and the two health env vars with defaults 5.0 and 30.0, and a non-numeric env value is a typed startup error naming the variable.
    proof: [config-tests]
  - text: agent_search_text joins the name, the card description and one line per skill with newlines, skips empty parts, and builds a skill line from its name, description and tags with single spaces.
    proof: [search-tests, oracle, helper-python, helper-case-corpus]
  - text: agent_search_result projects only agent_id, agent_name, description, the skills' name, description and tags, and the score.
    proof: [search-tests, oracle, helper-python, helper-case-corpus]
  - text: The index returns the top_k hits by descending score with ties in input order, and an empty agent list gives empty Hits.
    proof: [search-tests, oracle, helper-python, helper-case-corpus]
  - text: search_agents checks the embedding model before the router and returns the two exact NotConfigured reasons, without calling any embedder.
    proof: [search-tests, oracle, helper-python, helper-case-corpus]
  - text: A failed embedding is the EmbeddingFailed outcome with its reason, and an HTTP error from the embedder is passed up as AgentSearchError::Http and not turned into an outcome.
    proof: [search-tests, oracle, helper-python, helper-case-corpus]
  - text: rank_agents_by_query returns clones with search_score set in rank order, maps NotConfigured to 400 agent_search_not_configured and EmbeddingFailed to 503 agent_search_unavailable, and leaves its input unchanged.
    proof: [search-tests]
  - text: A repeated search embeds only the query, because unchanged agent texts come from the index cache, and two embedding models keep separate cached vectors.
    proof: [search-tests]
  - text: An agent with no card url or an empty one is healthy without a request, a status of 500 or more is unhealthy with `HTTP <status>`, any lower status is healthy, and a transport error is unhealthy with its message.
    proof: [health-tests]
  - text: filter_healthy_agents probes the agents with a url concurrently, returns the healthy ones in input order followed by the agents without a url, and marks every probed agent unhealthy with `Health check timed out` when the gather timeout fires.
    proof: [health-tests]
checks:
  optional: [mutants]
  commands:
    - id: config-tests
      why: the agent_search config section is missing or does not load its key, env vars and defaults
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::agent_search::/)'
    - id: search-tests
      why: agent search text, projection, ranking, outcomes, error mapping or cache reuse is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::search::/) - test(/replays_corpus$/)'
    - id: health-tests
      why: the agent health probe or the healthy-agent filter is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::health::/)'
    - id: helper-python
      why: the strict oracle adapter for agent search is missing or fails lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4783)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4783 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4783/pyrightconfig.json
    - id: helper-case-corpus
      why: the agent search helper cases are absent or do not replay through the shared parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/agent_search-*")" &&
        grep -lE '^[[:space:]]+b4783:' tools/oracle/fuzz/corpus/helper_case/agent_search-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/agent-search/search-text.yaml
  - tools/oracle/cases/helpers/agent-search/result-projection.yaml
  - tools/oracle/cases/helpers/agent-search/rank-ties-and-top-k.yaml
  - tools/oracle/cases/helpers/agent-search/model-before-router.yaml
  - tools/oracle/cases/helpers/agent-search/failed-embeddings.yaml
deviations:
  - what: The agent card is already a typed AgentCard (B4770), so LiteLLM's fallback to an empty searchable card when agent_card_params fails validation has no input in betterlite. A card that does not parse is rejected when the agent is stored or read.
    why: The typed boundary; the fallback only hid a malformed dict.
  - what: Concurrent searches take turns on one mutex around the index, so two requests do not embed at the same time. Results are the same.
    why: SemanticTextIndex::scores takes &mut self, and LiteLLM's single-threaded event loop has no such lock.
  - what: search_score is a Decimal built from the f64's shortest round-trip text. A score under 1e-4 in magnitude prints as plain digits here, where Python prints an exponent (1e-05). The JSON numbers are equal.
    why: B4770 stores search_score as Decimal; the clients parse both forms to the same number.
  - what: The health check error text for a transport failure is betterlite's own message, not httpx's str(exc).
    why: The text is only used to mark the agent unhealthy and is never returned to a client.
out_of_scope:
  - "The GET /v1/agents handler, its query parameters, the spend and key attach, is_public injection and the redaction call (redact_sensitive_agent_fields from B4775) belong to B4784. It calls filter_healthy_agents first, then rank_agents_by_query, and redacts the survivors last."
  - "handle_agent_search and the agent_search virtual tool belong to B4686 and B4684. They call search_agents and agent_search_result."
  - "router_embedder and embedding_spend_metadata in semantic_text_index.py build the real AgentEmbedders. No task at the pin owns them: B4261 injects the embedder, B4684 and B1505 name each other. The planner report lists this as an open owner."
  - "SemanticTextIndex, Embedder, EmbeddingFailed and cosine_similarity are B4261. get_async_httpx_client and the pooled client are B173."
  - "accessible_agents and agent permission checks are B4780. check_feature_access_for_user is B864."
  - "A2A agent URL validation and SSRF checks for registered agents are not part of the health probe; LiteLLM does none here."
pitfalls:
  - search_agents tests the embedding model before the router, so with both missing the reason is the model one; the reason strings are returned to clients verbatim.
  - The hits sort is stable and descending, so equal scores keep input order. An unstable sort or sorting ascending then reversing flips ties.
  - top_k is applied after sorting. rank_agents_by_query copies each hit's score into search_score on a clone, so the stored agent never carries a score.
  - An embedding HTTP error (budget, rate limit, guardrail) must not become EmbeddingFailed; only the Failed variant does, with status 503.
  - The 503 body key is `agent_search_unavailable` and the 400 body key is `agent_search_not_configured`, both under `detail.error`, with the reason under `detail.message`.
  - A skill with no tags adds no trailing space, and a card with no description adds no blank line, because empty parts are filtered before joining.
  - Only a status of 500 or more is unhealthy. A 404 or 401 from the agent url still counts as healthy.
  - An agent with an empty-string url is treated like one with no url, since LiteLLM tests the url for truthiness.
  - The gather timeout covers the whole group of probes, not each probe, and the per-probe timeout is separate (5.0 and 30.0 seconds by default).
  - health_check runs before ranking and before redaction in the route, so ranking only sees reachable agents. Do not move the order.
  - agent_search_text must not read litellm_params or kill_switch, since those hold secrets that would go to the embedding provider.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
