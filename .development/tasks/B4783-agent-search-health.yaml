id: B4783
title: Rank agent search results and probe agent health
description: >-
  Build two modules in betterlite-server, agent_endpoints::search and agent_endpoints::health, and one config section, agent_search, in betterlite-config. They hold everything GET /v1/agents does with `?query=` and `?health_check=true` and everything the MCP agent_search tool does to rank agents. No route is registered here. B4784 owns the GET /v1/agents handler and calls these functions, and B4686 owns handle_agent_search and calls search_agents and agent_search_result. Agent records are AgentResponse from betterlite_core::agents (B4770). Embedding vectors and the cached index are betterlite_semantic (B4261): `SemanticTextIndex::new(DEFAULT_MAX_CACHED_VECTORS)`, the `Embedder` trait, `EmbeddingFailed` and `SemanticError`.

  1. Config section agent_search (crates/betterlite-config/src/sections/agent_search.rs). It parses its own view of the whole file and its settings reach other crates as config.sections.agent_search. Fields: `embedding_model: Option<String>` from `litellm_settings.agent_search_embedding_model` (default absent), `health_check_timeout_seconds: f64` from env `LITELLM_AGENT_HEALTH_CHECK_TIMEOUT` (default 5.0), `health_check_gather_timeout_seconds: f64` from env `LITELLM_AGENT_HEALTH_CHECK_GATHER_TIMEOUT` (default 30.0). LiteLLM reads both env vars with float() when endpoints.py is imported, so a value that is not a number is a startup error here too, with a typed config error that names the env var. Read the env through the injected environment map the loader already passes, never std::env. Nothing else in the repo reads these three settings.

  2. Search records and text, in agent_endpoints/search.rs. `DEFAULT_AGENT_SEARCH_TOP_K: usize = 5`. `AgentSearchHit { agent: AgentResponse, score: f64 }`. `AgentSearchOutcome` is an enum: `Hits(Vec<AgentSearchHit>)`, `NotConfigured { reason: String }`, `EmbeddingFailed { reason: String }`. `agent_search_text(agent: &AgentResponse) -> String` joins with a newline, in this order, the parts that are non-empty strings: agent_name, the card description, then one line per card skill. A skill line joins with a single space its non-empty name, non-empty description and the tags joined with a single space (so a skill with no tags and no description is just its name, and a skill with nothing is an empty line that is then skipped). The card fields are Option in the B4770 record, and an absent field counts as an empty string. `AgentSearchResult { agent_id, agent_name, description, skills: Vec<SearchableSkill>, score: f64 }` derives Serialize; `SearchableSkill { name, description, tags }` carries only those three fields of a skill (examples, input_modes, output_modes and security are dropped). `agent_search_result(hit: &AgentSearchHit) -> AgentSearchResult` takes agent_id and agent_name from the agent and description and skills from the card. This is the only projection MCP clients see, so it never copies litellm_params, headers, keys, kill_switch or identity.

  3. The index, in agent_endpoints/search/index.rs. `AgentSearchIndex` wraps a `tokio::sync::Mutex<SemanticTextIndex>` built with DEFAULT_MAX_CACHED_VECTORS and is created once by the server's constructor and passed in (no static; LiteLLM's `global_agent_search_index` becomes one instance in app state). `async fn search(&self, query: &str, agents: &[AgentResponse], top_k: usize, embedder: &dyn Embedder, embedding_model: &str) -> Result<AgentSearchOutcome, AgentSearchError>`: build agent_search_text for every agent, call `scores(query, &texts, embedder, embedding_model)`, and map `SemanticError::Failed(EmbeddingFailed { reason })` to `AgentSearchOutcome::EmbeddingFailed { reason }`. `SemanticError::Http { status_code, detail }` is LiteLLM's HTTPException from the embedding pre-call hooks and goes up unchanged as `AgentSearchError::Http { status_code, detail }`. On success pair each agent with its score, sort by score descending with a stable sort (equal scores keep the registry order), keep the first top_k and return Hits. With no agents the result is Hits with an empty list.

  4. Entry point `search_agents(query, agents, top_k, embedding_model: Option<&str>, embedders: &dyn AgentEmbedders, index: &AgentSearchIndex, caller: &AuthContext) -> Result<AgentSearchOutcome, AgentSearchError>` in agent_endpoints/search.rs. `AgentEmbedders` is a trait defined here: `fn embedder_for(&self, embedding_model: &str, caller: &AuthContext) -> Option<Box<dyn Embedder>>`, returning None when the proxy has no model_list router. AuthContext is B732's, from crate::auth::auth_identity. Order of checks, the same as LiteLLM: embedding_model None gives NotConfigured with the reason `agent search needs litellm_settings.agent_search_embedding_model set to an embedding model from model_list`; then a None embedder gives NotConfigured with the reason `agent search needs a model_list so the embedding model can be called`; then index.search. The two reason strings are shown to clients, so copy them exactly. Building the real AgentEmbedders (LiteLLM's router_embedder, which runs the key rate-limit, budget and guardrail pre-call hooks with call type aembedding and then calls the router) is not this task; no task owns it at the pin and the trait is the seam (see notes in the planner report).

  5. HTTP error mapping and ranking for the route, in agent_endpoints/search/rank.rs. `AgentSearchHttpError { status_code: u16, error: String, message: String }` renders as the JSON body `{"detail":{"error":<error>,"message":<message>}}`. `rank_agents_by_query(query, agents: &[AgentResponse], top_k, embedding_model, embedders, index, caller) -> Result<Vec<AgentResponse>, AgentSearchRouteError>` calls search_agents and maps the outcome: Hits become clones of the agents with `search_score` set to the hit score (a Decimal, built from the f64's shortest round-trip text), in rank order; NotConfigured gives status 400 with error `agent_search_not_configured`; EmbeddingFailed gives status 503 with error `agent_search_unavailable`; the message is the outcome's reason in both. `AgentSearchRouteError` is `Http(AgentSearchHttpError)` or `Embedding { status_code, detail }` for the passed-through embedding HTTP error. The input list is not changed. B4784 passes the already redacted and permission-filtered list.

  6. Health probes, in agent_endpoints/health.rs. `AgentHealthResult { agent_id: String, healthy: bool, error: Option<String> }`. Trait `AgentHealthTransport` with `async fn get_status(&self, url: &str, timeout: Duration) -> Result<u16, String>`; the production implementation sends one GET through the pooled client from B173 (look in crates/betterlite-http/src/proxy.rs for its client type) with the timeout as the whole-request deadline, follows redirects (LiteLLM's AsyncHTTPHandler default) and reads no body. `check_agent_url_health(agent, transport, timeout) -> AgentHealthResult`: an agent whose card url is absent or an empty string is healthy with no error and no request; a status of 500 or more is unhealthy with error `HTTP <status>`; any other status, 404 and 401 included, is healthy; a transport Err(message) is unhealthy with that message as the error. The probe is a plain GET of the stored url, with no SSRF validation and no auth header, exactly like LiteLLM.

  7. The filter the route runs, in agent_endpoints/health.rs. `async fn filter_healthy_agents(agents: Vec<AgentResponse>, transport, settings: &AgentSearchSettings) -> Vec<AgentResponse>`: split the agents into those with a non-empty card url and those without, probe all of the first group concurrently with `futures_util::future::join_all`, and wrap the whole group in `tokio::time::timeout(gather_timeout)`. When the gather timeout fires, log a warning `Agent health check gather timed out after <seconds> seconds` and treat every agent in the group as unhealthy with the error `Health check timed out`. Return the healthy agents of the first group in their input order, followed by the agents without a url in their input order. The route calls this after redaction and before ranking, so an unhealthy agent never reaches the ranker.
