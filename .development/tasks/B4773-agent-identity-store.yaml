dod:
  - text: AgentIdentityStore holds typed repositories for agents, identities, verified subjects, retired identities and retired agents, plus optional cache, initialized from client via from_client or constructor.
    proof: [initialization-tests]
  - text: agent method finds agent by agent_id with identity and object_permission includes, returns AgentResponse or policy_unavailable on exception, None if missing.
    proof: [agent-tests]
  - text: unbound_client checks retired identities table for composite key (provider, tenant_id, client_id), returns failure if found, None otherwise, skipping check if retired repo is None.
    proof: [unbound-tests]
  - text: bound_agent_id caches agent_id lookups by (tenant_id, client_id) with json key format and get_management_object_ttl duration, returning cached string or None on type mismatch.
    proof: [cache-tests]
  - text: bound_agent_id queries identities table with composite key (provider="microsoft_entra", tenant_id, client_id), returns agent_id, policy_unavailable on exception or unbound_client result.
    proof: [binding-tests]
  - text: resolve_verified_claims extracts iss, tid, azp from claims, returns None if any non-string, calls bound_agent_id and validates agent state (enabled, identity_managed, identity.active).
    proof: [resolve-tests]
  - text: resolve_verified_claims calls classify_agent_subject and handles application subjects, enrolling human subjects via subject lookup and sso_interactive validation.
    proof: [resolve-tests]
  - text: subject method looks up verified humans by composite key (issuer, tenant_id, oid), returns the row or policy_unavailable on exception, None if missing.
    proof: [subject-tests]
  - text: retired_agent returns bool or policy_unavailable, checking original_agent_id in retired_agents table, raising failure if repo is None.
    proof: [retired-tests]
  - text: record_authentication raises failure "Agent authentication requires a binding revision" when context.binding_revision is None.
    proof: [auth-record-tests, auth-record-none-revision]
  - text: record_authentication updates identities with where clause requiring agent_id, binding_revision and active=true, plus nested agent filter requiring agent.enabled=True and agent.identity_managed=True, setting last_authenticated_at. Returns failure if count != 1.
    proof: [auth-record-tests, auth-record-agent-filter]
  - text: record_authentication with disabled or non-identity-managed agent returns failure "Agent identity changed during authentication; retry" due to zero matches from the agent filter.
    proof: [auth-record-tests, auth-record-disabled-agent]
  - text: enroll_interactive_human upserts verified subject with issuer, tenant_id, oid, where create data contains issuer, tenant_id, oid, user_id, and verified_via="sso_interactive", and update is the empty dict.
    proof: [enrollment-tests, enrollment-create-data]
  - text: enroll_interactive_human validates post-upsert record that kind="human", user_id matches, verified_via="sso_interactive", raising failure if not.
    proof: [enrollment-tests]

