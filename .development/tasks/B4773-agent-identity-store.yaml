id: B4773
title: Authoritative agent identity and verified human storage
description: >-
  Implement AgentIdentityStore to retrieve and maintain agent identities, verified human subjects, and authentication state from the database with optional caching. Preserve cache invalidation on identity changes, find-unique cardinality, exception-to-failure mapping (policy_unavailable versus missing), retirement and binding status checks, and the classification-and-store flow for interactive human enrollment.

  AgentIdentityStore holds five typed repositories (agents, identities, humans, retired, retired_agents) and an optional shared cache. Methods provide read-only access to agent state including identity and permissions (agent), check whether an unbound client identity is retired (unbound_client), resolve an application client to its bound agent_id with caching (bound_agent_id, private), classify JWT claims and retrieve the effective agent context including optional human subject verification (resolve_verified_claims), look up a verified human subject by issuer/tenant/oid (subject), check if an agent_id belongs to a retired agent (retired_agent), record an authentication event with binding revision check (record_authentication), and enroll an interactive human by issuing a VerifiedSubject (enroll_interactive_human).

  Resolve_managed_agent wraps the store to raise on identity failures, returning ManagedAgentContext or None for unbound claims.

  Cache key format for agent_id lookup: "agent_identity:{json.dumps((tenant_id, client_id))}", using the shared get_management_object_ttl for cache duration. Cache stores the resolved agent_id as a string, returning None on cache miss or type mismatch (cached non-string is treated as miss).

  Identity binding lookup: find_unique on identities table using provider="microsoft_entra", tenant_id, client_id as composite key. On exception, raise code=policy_unavailable. Missing binding goes to unbound_client check; retiring a binding does not delete, it marks in a separate table.

  Human subject lookup: find_unique on verified subjects using issuer, tenant_id, oid. Missing subject returns None (unverified). Exception becomes policy_unavailable.

  Authentication record: If context.binding_revision is None, raise failure "Agent authentication requires a binding revision". Otherwise, update_many on identities with where clause requiring agent_id, binding_revision and active=true, plus the nested agent filter requiring agent.enabled=True and agent.identity_managed=True. Set last_authenticated_at to utc now. If count != 1 (missing, inactive, agent disabled/not identity-managed or changed during update), raise failure "Agent identity changed during authentication; retry".

  Human enrollment: upsert on humans using issuer, tenant_id, oid. Create data carries issuer, tenant_id, oid, user_id, and verified_via="sso_interactive"; update is the empty dict. Post-upsert, check that kind="human", user_id matches, verified_via="sso_interactive"; if not, raise "Microsoft subject is already bound to another local identity". This read-after-write validates isolation from concurrent enrollment.

  Retired agent check: find_unique on retired_agents with original_agent_id; returns bool or policy_unavailable, never missing.

  Keep each method under 40 lines. Async throughout. Classification happens via B4772 classify_agent_subject; this store never classifies, only retrieves. Exceptions during DB operations become policy_unavailable unless already a typed failure (missing returns None, not an error).

