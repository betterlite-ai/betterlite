oracle_cases: []

deviations:
  - what: Cache key format uses json.dumps of (tenant_id, client_id) tuple to create a single string key, matching LiteLLM's Python JSON serialization.
    why: Rust lacks Python's json.dumps directly; the implementation uses serde_json::to_string to produce identical keys, ensuring cache hit on every call.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/identity_store.py#L94
  - what: record_authentication has an early return guard that raises "Agent authentication requires a binding revision" when context.binding_revision is None, before any database operation.
    why: The binding_revision None check is a distinct guard from the where-clause validation; LiteLLM raises this as a separate early failure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/identity_store.py#L194-195
  - what: Agent authentication record's where clause includes a nested agent filter requiring agent.enabled=True and agent.identity_managed=True, in addition to binding_revision and active=true on the identity.
    why: LiteLLM's update_many filters on the agent's enabled and identity_managed status to ensure only valid agent identities are authenticated; this nested condition is part of the complete where clause.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/identity_store.py#L196-200
  - what: Agent authentication record requires count == 1 from update_many; if count is 0 or > 1, the method raises "Agent identity changed during authentication; retry" without logging the count.
    why: Binding revision and agent state checks happen at the database layer; a race or disabled agent is detectable only by count, and raising the same message as LiteLLM preserves user-facing behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/identity_store.py#L205-207
  - what: Verified human enrollment populates create data with issuer, tenant_id, oid, user_id, and verified_via="sso_interactive", while update is an empty dict (upsert modifies only on create, not update).
    why: LiteLLM's upsert carries enrollment fields in create; the empty update dict ensures that retries do not modify existing records, preserving the original enrollment time.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/identity_store.py#L221-228
  - what: Verified human enrollment reads back the upserted record to validate kind, user_id and verified_via match; LiteLLM relies on Prisma upsert semantics for this.
    why: betterlite uses Prisma-style upsert through the repository, and the read-after-write validation is required to catch concurrent binding to a different user.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/identity_store.py#L229-231

out_of_scope:
  - Binding updates and writes; B4772 (managed_identity.py) owns managed_write_fields and _identity_write that prepare updates for this store.
  - Policy validation and admission; B4772 owns classify_agent_subject, which this store calls but does not implement.
  - Agent registry and model resolution; B4776 owns agent registry reconciliation.
  - Database connection and transaction management; B700 (base_client.py) provides the client and repository abstractions.
  - Cache implementation; B733 (user_api_key_cache.py) provides UserApiKeyCache and get_management_object_ttl.

pitfalls:
  - "Cache key must serialize (tenant_id, client_id) tuple using json.dumps to match LiteLLM; a plain string concatenation breaks cache hits."
  - "Unbound_client returns failure only if retired repo exists and the identity is found; missing retired repo means the check is skipped."
  - "Agent state validation checks identity_managed, enabled, and identity.active; if identity is None, the agent is unbound (not necessarily an error)."
  - "resolve_verified_claims returns None if iss, tid, azp are not all present as strings, allowing JWT-free requests to pass through."
  - "classify_agent_subject is called from resolve_verified_claims; this store retrieves the result and does not perform classification itself."
  - "record_authentication raises 'Agent authentication requires a binding revision' when context.binding_revision is None, before querying the database; this is a distinct guard from the where-clause check."
  - "record_authentication where clause includes nested agent filter (agent.enabled=True, agent.identity_managed=True) in addition to identity conditions; a disabled or non-identity-managed agent causes count=0."
  - "Authentication record update uses update_many, not update; the where clause acts as a final binding revision check (count must be 1)."
  - "enroll_interactive_human create data must contain issuer, tenant_id, oid, user_id, and verified_via='sso_interactive'; the update dict is empty so upserts do not modify existing records."
  - "Human subject enrollment validates the post-upsert record to detect concurrent binding to a different user; the check is not optional."
  - "Retired agent check returns a bool, not an Option; the repo must exist and raise on error, not return None."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 2
