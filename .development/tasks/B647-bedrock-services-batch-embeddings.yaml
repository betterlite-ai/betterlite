id: B647
title: Bedrock batch embedding record conversion
description: >-
  Add BatchRecordKind and Titan-v2 batch embedding projection, preserving URL-before-body classification, registry
  invocation-schema overrides, single-string coercion and unsupported embedding model errors. Do not silently treat
  every input-bearing batch row as embeddings when a route says Responses.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  BedrockFilesConfig._classify_batch_record L575-L614; BedrockFilesConfig._is_titan_v2_embed_model L639-L681; BedrockFilesConfig._lookup_provider_specific_field
  L684-L715; BedrockFilesConfig._coerce_embedding_input_to_string L718-L771; BedrockFilesConfig._map_openai_embedding_to_bedrock_params
  L773-L819.


  Reuse AmazonTitanV2Config.__init__ from B627 (litellm/llms/bedrock/embed/amazon_titan_v2_transformation.py); its
  implementation remains with that prerequisite.


  Named case contracts: url_before_body_classification: Exact /v1/embeddings, /v1/completions and /v1/responses
  select embedding,text_completion,responses respectively regardless of body. Any other URL except None or empty
  string selects chat, including /embeddings, a query suffix, whitespace and a nonstring value; do not normalize
  endpoints. no_url_body_classification: Only absent/None/empty url permits body inspection. A non-Mapping body
  is chat. Key presence messages wins over prompt, which wins over input; null values still count as present. Otherwise
  chat. titan_v2_registry_schema: Read get_model_info(model_id) through the shared lower metadata owner, then require
  dict info, dict provider_specific_entry and a nonempty string bedrock_invocation_schema. Only exact titan_v2 is
  true; any other nonempty string is false without name fallback. Lookup exceptions, nondicts, absent field, empty
  string and nonstring values all return None and permit fallback, despite the comment claiming absent resolved
  schema is authoritative. titan_v2_name_boundary: Lowercase model, remove one leading bedrock/, then inspect the
  FIRST titan-embed-text-v2 substring. Accept only end-of-string or colon/slash immediately after that occurrence.
  Cross-region and ARN forms work; v20 and -experimental fail, even if a later occurrence has a valid boundary.
  single_input_coercion: A string, including empty, returns unchanged. Unwrap exactly one list element once. Missing/None
  raises ValueError Embedding batch record is missing required `input` field: model={model}. A tuple is not an accepted
  list on the SDK seam. invalid_multi_input: A list of length other than one, including empty and multi-token lists,
  first raises ValueError Bedrock batch embedding requires one input per JSONL record. Got a list with {len} items
  for model={model}; emit one JSONL line per input string instead. After one unwrap, any list or int (including
  bool) raises NotImplementedError Bedrock Titan v2 batch embedding does not support pre-tokenized integer inputs.
  Pass `input` as a string (model={model}). Other nonstrings raise ValueError Bedrock batch embedding `input` must
  be a string (or a single-element list of strings). Got type {type_name} for model={model}. dimensions_normalize_fields:
  Remove only model and input before B627 AmazonTitanV2Config.map_openai_params, starting optional_params empty,
  then call its _transform_request with the single string. Exercise the same encoding_format/dimensions/normalize
  defaults, None behavior and binary embeddingTypes mapping as B627; no batch-specific defaults or validation. unsupported_embedding_model:
  Reject non-Titan-v2 before inspecting input with NotImplementedError Bedrock batch embedding currently supports
  only Amazon Titan Text Embeddings V2 (model id contains 'titan-embed-text-v2'). Got model={model!r}. Track other
  embedding models in https://github.com/BerriAI/litellm/issues. No fan-out or synchronous-provider fallback.


  Reuse B2217 _get_model_cost_key and B2219 _get_potential_model_names where called; shared metadata resolution
  is below this provider, never B157.


  The direct get_model_info call is owned by B2225; its full lookup/failure behavior is part of this dependency,
  not the SDK facade.


  Implement crates/betterlite-bedrock/src/batch_embeddings.rs with adjacent tests under batch_embeddings/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_batch_embeddings in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batch_embeddings_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): url_before_body_classification, no_url_body_classification, titan_v2_registry_schema, titan_v2_name_boundary,
  single_input_coercion, invalid_multi_input, dimensions_normalize_fields, unsupported_embedding_model. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_embeddings* using HelperCase:
  kind: helper and the externally tagged bedrock_services_batch_embeddings variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_batch_embeddings that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 179 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 210 production lines, 275 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 625 planned, 625 maximum changed lines.
