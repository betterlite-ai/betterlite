id: B4025
title: Budget threshold and customer spend alerts
description: >-
  Build entity-specific budget labels and IDs, threshold decisions, cached duplicate
  suppression and structured end-user spend notifications. Preserve soft-budget then
  max-budget precedence, the shared threshold cache key for 5% and 15%, and cache
  writes after delivery.

  Implement the budget alert type mapping as an abstract contract: BaseBudgetAlertType
  with get_event_message() and get_id(CallInfo) methods. Supply concrete instances
  for ProxyBudgetAlert, SoftBudgetAlert, UserBudgetAlert, TeamBudgetAlert,
  OrganizationBudgetAlert, TokenBudgetAlert, ProjectedLimitExceededAlert and
  ProjectBudgetAlert. Factory function get_budget_alert_type returns the appropriate
  type by name. Keep entity-specific ID patterns: soft budget routes on team_id when
  event_group is TEAM, otherwise token; user budget uses user_id; team uses team_id;
  token checks TEAM_MEMBER first and builds "team_member:<user_id>:<team_id>".

  Implement budget_alerts entry point: check soft_budget then max_budget, detect soft
  budget crossed, max budget crossed, and percentage thresholds (5% and 15% remaining).
  Soft budget checks first; max budget checks and thresholds follow. When both are
  set, soft-budget crossing takes precedence and is reported before threshold checks.
  Cache the alert by event type and entity ID with budget_alert_ttl; skip if already
  sent. Build WebhookEvent with all present fields and send via send_alert. Later
  send_webhook_alert for webhook delivery.

  Implement failed_tracking_alert: single-use per-model cache with budget_alert_ttl,
  send when cache miss, write cache after send.

  Implement customer_spend_alert: check that webhook alerting is on, end_user_id,
  token and response_cost are present. Build WebhookEvent with spend_tracked event,
  END_USER entity group and customer_id set to end_user_id, then send via
  send_webhook_alert.

