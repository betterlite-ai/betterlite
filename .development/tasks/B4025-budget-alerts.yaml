oracle_cases: []
deviations:
  - what: >-
      The abstract budget alert type contract is built using Rust traits with concrete
      implementations, not Python class inheritance. Trait objects or enums bridge to
      the factory function.
    why: >-
      Rust's type system requires explicit contracts; trait implementations provide
      the same polymorphic interface as Python abstract classes without runtime
      overhead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/budget_alert_types.py#L7-L24

  - what: >-
      Decimal arithmetic is used for budget calculations instead of floats, preserving
      precision through percentage checks and threshold comparisons.
    why: >-
      Float rounding errors can cause alerts to fire at wrong thresholds; Decimal
      arithmetic matches financial precision expectations.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L673-L685

  - what: >-
      Soft budget crossing precedes and overrides max budget threshold checks when both
      are set, preserving LiteLLM's soft-budget-first design. Once soft budget is
      triggered, further max budget checks do not run.
    why: >-
      LiteLLM's source checks soft budget first; preserving this order avoids masking
      soft-budget alerts with threshold messages.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L649-L670

out_of_scope:
  - "send_alert: B4024 owns the shared entry point."
  - "send_webhook_alert: B4021 owns the structured webhook delivery."
  - "DualCache reads and writes: Q4 unresolved; task uses the injected cache passed in construction."
  - "CallInfo and WebhookEvent type definitions: B4020 supplies these."
  - "AlertType enum and EntityType enum: B4020 supplies these."
  - "SLACK_ALERTING_THRESHOLD_5_PERCENT and SLACK_ALERTING_THRESHOLD_15_PERCENT: B4020 supplies these."

pitfalls:
  - "Soft budget checks must run before max budget checks, and soft budget crossing must override subsequent threshold checks. LiteLLM's source has soft budget first; preserve that order to avoid masking alerts."
  - "The cache key for soft_budget_crossed, budget_crossed, threshold_crossed and projected_limit_exceeded must use the same entity ID from get_budget_alert_type; mismatched cache keys lead to duplicate alerts or missed suppression."
  - "TeamBudgetAlert's get_id uses team_id when set, returning \"default_id\" when None. This differs from other types in that it never falls back to token."
  - "TokenBudgetAlert has two paths: when event_group is TEAM_MEMBER, construct \"team_member:<user_id>:<team_id>\"; otherwise use token or \"default_id\". Do not mix the paths."
  - "Percent-of-budget calculation must return 0.0 when max_budget is None or <= 0, not a ratio that would cause later comparisons to fail or panic."
  - "Percentage thresholds (5% and 15%) must be constants from B4020, never hardcoded; using the wrong thresholds breaks duplicate suppression and alert behavior."
  - "customer_spend_alert must return early without sending if any guard condition (webhook in alerting, end_user_id, token, response_cost) fails, matching LiteLLM's all-or-nothing dispatch."
  - "WebhookEvent fields must exclude token from the message string but include it in the event record for backend processing; do not serialize token into alert text."

