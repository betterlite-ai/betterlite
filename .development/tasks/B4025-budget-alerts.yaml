dod:
  - text: BaseBudgetAlertType trait defines abstract get_event_message() and get_id(CallInfo) contract for all budget alert types.
    proof:
      - budget-type-tests

  - text: >-
      ProxyBudgetAlert returns "Proxy Budget: " and "default_id" for all CallInfo.
    proof:
      - budget-type-tests

  - text: >-
      SoftBudgetAlert returns "Soft Budget Crossed: " and team_id when event_group
      is TEAM, otherwise token or "default_id".
    proof:
      - soft-budget-type-tests

  - text: >-
      UserBudgetAlert returns "User Budget: " and user_id or "default_id".
    proof:
      - user-budget-type-tests

  - text: >-
      TeamBudgetAlert returns "Team Budget: " and team_id or "default_id".
    proof:
      - team-budget-type-tests

  - text: >-
      OrganizationBudgetAlert returns "Organization Budget: " and organization_id
      or "default_id".
    proof:
      - org-budget-type-tests

  - text: >-
      TokenBudgetAlert returns "Key Budget: " and "team_member:<user_id>:<team_id>"
      when event_group is TEAM_MEMBER, otherwise token or "default_id".
    proof:
      - token-budget-type-tests

  - text: >-
      ProjectedLimitExceededAlert returns "Key Budget: Projected Limit Exceeded"
      and token or "default_id".
    proof:
      - projected-type-tests

  - text: >-
      ProjectBudgetAlert returns "Project Budget: " and token or "default_id".
    proof:
      - project-budget-type-tests

  - text: get_budget_alert_type factory returns the correct type instance by name literal; returns ProxyBudgetAlert for unknown names.
    proof:
      - budget-factory-tests

  - text: failed_tracking_alert skips when alerting is None, or "failed_tracking_spend" is not in alert_types.
    proof:
      - failed-tracking-tests

  - text: failed_tracking_alert uses cache key "budget_alerts:failed_tracking:<failing_model>" with budget_alert_ttl and sends once per model per 24hr window.
    proof:
      - failed-tracking-tests

  - text: failed_tracking_alert sends alert with "High" level, failed_tracking_spend alert type and empty metadata.
    proof:
      - failed-tracking-tests

  - text: budget_alerts returns without alert when alerting is None or "budget_alerts" is not in alert_types.
    proof:
      - budget-alert-entry-tests

  - text: budget_alerts returns without alert when both max_budget and soft_budget are None.
    proof:
      - budget-alert-entry-tests

  - text: budget_alerts checks soft_budget first; if soft_budget is set and spend >= soft_budget, event is "soft_budget_crossed" and soft_budget value is appended to message.
    proof:
      - soft-budget-threshold-tests

  - text: budget_alerts checks max_budget next; if max_budget is set and spend >= max_budget, event becomes "budget_crossed" overriding soft-budget state.
    proof:
      - max-budget-threshold-tests

  - text: budget_alerts checks max_budget percentage thresholds after crossed check; 5% or less remaining sets event to "threshold_crossed" with message "5% or less of budget remaining".
    proof:
      - threshold-5pct-tests

  - text: budget_alerts checks max_budget percentage thresholds; 15% or less (but more than 5%) sets event to "threshold_crossed" with message "15% or less of budget remaining".
    proof:
      - threshold-15pct-tests

  - text: budget_alerts cache key is "budget_alerts:<event>:<id>" where event is one of budget_crossed, threshold_crossed, soft_budget_crossed or projected_limit_exceeded, and id comes from the budget alert type's get_id method.
    proof:
      - cache-key-tests

  - text: budget_alerts cache uses budget_alert_ttl from alerting_args; multiple alerts of the same type and entity are suppressed within the TTL window.
    proof:
      - cache-ttl-tests

  - text: budget_alerts builds WebhookEvent with all present CallInfo fields (spend, max_budget, soft_budget, token, customer_id, user_id, team_id, team_alias, organization_id, user_email, key_alias, projected_exceeded_date, projected_spend, event_group, alert_emails, max_budget_alert_emails) when event is not None and event_group is not None.
    proof:
      - webhook-event-tests

  - text: budget_alerts skips alert without sending when event is not None but event_group is None, preserving the guard condition in the send check.
    proof:
      - webhook-event-tests

  - text: >-
      budget_alerts forces event_message to "Team Member Budget: " when event_group
      is TEAM_MEMBER, overriding the budget alert type's get_event_message() result.
    proof:
      - team-member-message-tests

  - text: budget_alerts calls send_alert with message, "High" level, budget_alerts alert type, WebhookEvent as user_info and empty metadata.
    proof:
      - budget-alert-send-tests

  - text: _get_event_and_event_message handles soft budget (spend >= soft_budget gives "soft_budget_crossed") and max budget (spend >= max_budget gives "budget_crossed", percent <= 5% gives "threshold_crossed", percent <= 15% gives "threshold_crossed").
    proof:
      - threshold-logic-tests

  - text: _get_percent_of_max_budget_left calculates (max_budget - current_spend) / max_budget; returns 0.0 when max_budget is None or <= 0.
    proof:
      - percent-calc-tests

  - text: _get_user_info_str formats CallInfo fields as key-value pairs excluding token, converting Litellm_EntityType to its string value.
    proof:
      - user-info-str-tests

  - text: customer_spend_alert returns without sending when alerting does not contain "webhook" or any of end_user_id, token, response_cost are None.
    proof:
      - customer-spend-tests

  - text: customer_spend_alert builds WebhookEvent with spend_tracked event, END_USER entity group, customer_id set to end_user_id, and sends via send_webhook_alert.
    proof:
      - customer-spend-tests

