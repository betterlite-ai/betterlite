id: B3788
title: Prisma AIRS legacy and streaming hooks
description: >-
  Build pre/post call hooks and buffered/raw streaming scan paths for Palo Alto Networks Prisma AIRS using the
  shared scan service from B3786 and content extraction from B3787. Preserve scan deduplication via call_id tracking,
  blocking when a raw stream cannot safely apply a returned mask, and exact LiteLLM hook ordering/error behavior.

  Pre-call hook (async_pre_call_hook):
  - Check should_run_guardrail (B3789); if false, return data unmodified.
  - Call _check_and_mark_scanned to deduplicate scans and synthesize call_id if missing (with warning).
  - Extract prompt text via _extract_prompt_from_request (messages list or prompt field).
  - Call _call_panw_api (B3786) with is_response=false, metadata from _prepare_metadata_from_request (B3786).
  - On allow+masked_text and mask_request_content, apply _apply_masking_to_messages or update prompt field.
  - On block, extract error via _build_error_detail (B3786), raise HTTPException(400).
  - On allow or mask, call add_guardrail_to_applied_guardrails_header and return None (allow through).
  - Transient errors call _handle_api_error_with_logging (B3786) and return unmodified (fail-open).
  - Log guardrail information with timestamps and call _record_scan_id (B3786) on allow.

  Post-call hook (async_post_call_success_hook):
  - Check if response is ModelResponse; pass through non-ModelResponse objects unmodified.
  - Check should_run_guardrail; return response unmodified if false.
  - Call _check_and_mark_scanned to deduplicate.
  - Extract response text via _extract_response_text (B3787); warn and return if no content.
  - Call _call_panw_api with is_response=true.
  - On allow+masked_text, apply _apply_masking_to_response (B3787, in-place).
  - On block, extract error, raise HTTPException(400).
  - On block+masked_text and mask_response_content, apply masking instead of blocking, return response.
  - Log success or intervention with duration and scan_id.

  Raw streaming scanner (_scan_raw_streaming_text):
  - Scan text from non-ModelResponse streaming chunks (/v1/messages raw SSE, /v1/responses Pydantic events).
  - Warn and log guardrail information on scan; raise HTTPException(400) on block.
  - Note: response masking is not supported on raw streaming (raw SSE bytes cannot be reliably reconstructed).
    If mask_response_content is configured, log warning and block instead of masking.
  - Transient errors call _handle_api_error_with_logging (B3786) and return (fail-open).
  - Always block errors raise inside _handle_api_error_with_logging.

  Streaming hook (async_post_call_streaming_iterator_hook):
  - Check should_run_guardrail for post_call; if false, pass through unchanged.
  - Call _check_and_mark_scanned to prevent duplicate scans on same call_id.
  - Collect all chunks from the response iterator.
  - If chunks are bytes (Anthropic SSE from /v1/messages), extract text via _extract_text_from_sse_bytes (B3787),
    call _scan_raw_streaming_text and yield original chunks unmodified.
  - If chunks are non-ModelResponse events (from /v1/responses), extract text via _extract_text_from_streaming_events (B3787),
    call _scan_raw_streaming_text and yield original chunks.
  - Otherwise, use stream_chunk_builder (B2227) to assemble complete ModelResponse.
  - Call _scan_and_process_streaming_response to scan assembled response and apply masking.
  - On transient/always-block errors, handle via _handle_api_error_with_logging, yield original chunks and return.
  - On successful scan with content_was_modified=true, use MockResponseIterator to yield reassembled chunks.
  - On successful scan with content_was_modified=false, yield original chunks.
  - On block, build error via _build_error_detail (B3786) and yield as SSE JSON error frame.
  - Catch HTTPException and yield as SSE error; catch generic exceptions and yield generic error frame.

  Helpers:
  - _check_and_mark_scanned: Check litellm_metadata[f"_panw_{scan_type}_scanned_{call_id}"] and mark if not present.
    Synthesize call_id if missing (warn). Return True if already scanned, False otherwise.
  - _extract_prompt_from_request: Extract from messages (chat completion) first, fall back to prompt field
    (text completion, handle string/list forms).
  - _scan_and_process_streaming_response: Scan assembled response, return (content_was_modified, response, scan_result).
    Apply masking if action=allow+masked_text, or block+masked_text+mask_response_content. Return early for
    transient/always-block errors.

