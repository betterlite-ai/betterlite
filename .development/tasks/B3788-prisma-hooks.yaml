deviations:
  - what: >-
      Raw streaming paths (/v1/messages with bytes, /v1/responses with Pydantic events) cannot reliably
      apply response masking because the returned masked text cannot be safely embedded back into raw
      SSE bytes or event structures. When mask_response_content=True, the hook logs warning and blocks instead.
    why: >-
      SSE format does not support arbitrary byte insertion/replacement. Masked content cannot be reliably
      embedded into the stream structure without corrupting frame boundaries or losing subsequent chunks.
      LiteLLM preserves the same behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/panw_prisma_airs/panw_prisma_airs.py#L973-L981

out_of_scope:
  - "B3786 owns _call_panw_api, _build_error_detail, _get_masked_text, _handle_api_error_with_logging, _prepare_metadata_from_request, _record_scan_id and constructor initialization."
  - "B3787 owns content extraction (_extract_text_from_messages, _extract_response_text, _extract_text_from_sse_bytes, _extract_text_from_streaming_events) and masking (_apply_masking_to_messages, _apply_masking_to_response, _apply_mcp_masking)."
  - "B3789 owns should_run_guardrail and unified text/tool selection."
  - "B2227 owns stream_chunk_builder and buffered chunk assembly."
  - "U1 framework contracts (guardrail exceptions, observation/logging, message extraction helpers) and U2 streaming reconstruction (MockResponseIterator, convert_model_response_to_streaming) remain unassigned."

pitfalls:
  - Test names must match the filter patterns (prisma_hooks_*) to be selected; filters use alternation and must
    not break between modules.
  - _check_and_mark_scanned uses a metadata dict key that includes both call_id and scan_type, so pre/post/streaming
    scans are tracked separately on the same call_id.
  - Call_id synthesis happens in _check_and_mark_scanned, not in the hooks themselves; this is called before masking
    decisions to ensure consistent call_id for all scans on a request.
  - Raw streaming paths from /v1/messages (bytes) and /v1/responses (Pydantic events) must be handled separately
    before attempting to assemble as ModelResponse.
  - mask_response_content configured on raw streaming paths logs warning and blocks instead of masking, because
    returned masked text cannot be applied to raw SSE bytes/events.
  - MockResponseIterator must only be used if content_was_modified=true; otherwise yield original chunks to preserve
    streaming timing and semantics.
  - 'SSE error frames in the streaming hook are JSON objects wrapped with "data: " and "\n\n", not raised exceptions.'

