dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports; B8624 mounts the routes and proves the items below over HTTP with the cases that moved there.
    proof: [routes-tests]
  - text: The upstream fetch tries the host candidate then the path candidate, caches a hit for 300 seconds and a miss for 60, raises only when every candidate failed on transport, and reads the cache before and after taking the slot.
    proof: [fetch-tests]
  - text: Each named branch (dcr bridge, pass-through, OBO, gateway-advertised, relay) returns LiteLLM's keys in order, and a pass-through server rewrites resource only when it is not client-forwarded.
    proof: [documents-tests]
  - text: A pass-through server with no upstream answer is 502 and never gets a gateway document; an unknown server and a non-oauth2 server both get the same 404.
    proof: [documents-tests]
  - text: The root, aggregate protected-resource and aggregate authorization-server documents match LiteLLM key for key, with the grant list depending on token exchange.
    proof: [documents-tests]
  - text: The five routes are registered with the root suffix, the aggregate authorization-server route is only the single /mcp segment, and none of B7321's or B4678's paths is registered here.
    proof: [routes-tests]
  - text: The metadata body decoder never panics on any bytes.
    proof: [body-corpus]

checks:
  optional: []
  commands:
    - id: fetch-tests
      why: the upstream metadata fetch has no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_protected::upstream_fetch::/) - test(replays_the_protected_resource_body_corpus)'
    - id: documents-tests
      why: the protected-resource documents or the issuer merge have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_protected::documents::/)'
    - id: routes-tests
      why: the routes have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_protected::routes::/)'
    - id: body-corpus
      why: the fuzz target, its seeds or the corpus replay test are missing
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/protected_resource_body.rs && grep -q protected_resource_body crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/protected_resource_body)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_protected_resource_body_corpus)'

oracle_cases: []

deviations: []

out_of_scope:
  - "The named, standard and legacy authorization-server documents, openid-configuration and jwks.json: B7321. The bare /.well-known/oauth-authorization-server path: B4678."
  - "/authorize, /callback, /register and the browser flow routes: B7971. The gateway token routes: B7321."
  - "The metadata cache type and its invalidation (OAuthMetadataCache, invalidate_oauth_metadata_cache, prune, store, enter_fetch): B6595. The server-side discovery fetch at server load (MCPServerManager): B6761."
  - "The MCPServer record and its properties: B6590. get_request_base_url and well_known_root_suffix: B4654. get_mcp_client_ip: B743. supported_grant_types: B4674. TokenExchangePrerequisites: B4663."
  - "The real UpstreamGet over the pooled client, and the RequestFacts and GatewayFacts adapters: B8624."

pitfalls:
  - The root document puts resource first, while every other protected-resource document puts authorization_servers first; keep each struct's field order.
  - A pass-through server with no upstream document is a 502, never the gateway's own document, since that would point the client at the wrong login.
  - Only the legacy is_oauth_passthrough and the non-forwarded case rewrite resource; true_passthrough and oauth_delegate return the upstream map untouched, because a strict identity provider rejects a token whose audience is the gateway.
  - The 404 text uses the name from the request path, while the 502 texts use server.name.
  - "A cached None is a real answer (the negative entry): return Ok(None) without a request, and do not confuse it with a miss."
  - When every candidate fails on transport the error is returned and nothing is cached, so the next request retries at once.
  - The path candidate keeps the path with trailing slashes removed, so "/mcp/" gives ".../oauth-protected-resource/mcp".
  - The aggregate authorization-server route is exactly one /mcp segment and lists token_endpoint_auth_methods_supported as ["none", "client_secret_post"], unlike B7321's ["client_secret_post"].
  - axum panics on a duplicate route, and "/mcp/{name}" next to "/{name}/mcp" is a shape the router must accept; the routes test builds the merged router to prove it.
  - OBO falls back to the gateway-advertised branch when no issuer is configured, it does not return an empty authorization_servers list.

review_level: standard

