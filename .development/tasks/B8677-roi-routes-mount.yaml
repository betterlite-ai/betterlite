deviations: []
out_of_scope:
  - "The handlers, run_scheduled_sync and next_update: B3158, B3161 and B8588. SyncManager: B3157. SyncStore: B3155."
pitfalls:
  - A second SyncManager in the job would let a scheduled sync run while the routes report idle and accept a manual start.
  - APScheduler's interval job first fires one interval after registration, not at startup.
review_level: security
