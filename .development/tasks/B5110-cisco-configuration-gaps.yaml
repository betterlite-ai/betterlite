id: B5110
title: Close the B3759 Cisco configuration audit gaps
description: >-
  B3759 built the Cisco AI Defense configuration helpers in crates/betterlite-guardrails/src/cisco_configuration/.
  An Opus review after merge found one gap in what Cisco receives and seven tests that can't fail on the
  behavior they name. This task closes them in the same modules. Two more findings are left out, and the
  last paragraph says why.


  Rule names. LiteLLM's _normalize_rule wraps a bare string as {"rule_name": rule} and writes rule_name
  for a dict only when the dict has one
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L905-L944,
  lines 911 to 912 and 930 to 932). So a rule configured as {rule_id: r1} reaches Cisco as
  {"rule_id": "r1"}. In betterlite, B3758's RuleEntry in crates/betterlite-config/src/sections/cisco_verdict_contracts.rs
  defaults a missing rule_name to "", Rule keeps it as a plain String, and payload.rs's normalize_rule
  always sets rule_name: Some(...). The same rule goes out as {"rule_name": "", "rule_id": "r1"}. The fix
  makes rule_name an Option<String> in both RuleEntry and Rule. A bare string becomes Some(name), an entry
  without the key stays None, and normalize_rule passes the Option through unchanged. An explicit "" in an
  entry stays Some("") and is sent as given, as docs/compatibility.md says for explicit values. LiteLLM drops
  it only through truthiness. payload/tests.rs's normalize_rule_passes_through_a_fully_populated_rule pins
  the empty name today (String::new() in, Some(String::new()) out) and changes to a real name such as "PII".


  Metadata keys. LiteLLM's _build_metadata sends user, litellm_call_id as client_transaction_id, and seven
  keys of the request's metadata object: src_app, dst_app, src_ip, dst_ip, dst_host, sni and user_agent
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L859-L889).
  build_chat_payload maps every key, but full_inputs() in payload/tests.rs sets only src_app, and
  build_chat_payload_assembles_messages_and_metadata checks struct fields one at a time. Mapping user_agent
  to None, or filling dst_ip from src_ip, passes every test today. That test becomes
  build_chat_payload_serializes_every_metadata_key. full_inputs() gives each of the seven keys its own
  value, and the test compares the serialized metadata object with a JSON literal.


  Config on the wire. LiteLLM's _build_config adds enabled_rules and the four integration keys only when
  they are set
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L891-L903),
  and _build_chat_payload always sends messages, metadata and config
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L786-L796).
  build_chat_payload_assembles_config never serializes ScanConfig or WireRule, and no test sets
  integration_profile_version, integration_tenant_id or integration_type. Removing a skip_serializing_if, so
  Cisco gets "enabled_rules": [] or "integration_type": null, passes every test. Two tests replace it, and
  both serialize the whole ChatPayload and compare it with a JSON literal.
  build_chat_payload_serializes_the_full_config sets all four integration fields and a rule with only
  rule_name and rule_id. build_chat_payload_serializes_empty_inputs starts from ChatPayloadInputs::default()
  and expects {"messages":[],"metadata":{},"config":{}}.


  Choice order. LiteLLM's _resolve_choice reads the env var only when the config value is None
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L246-L266,
  line 254). An invalid config value goes to the default, not to the env var. No test in choice/tests.rs
  sets both, so reading the env var first passes today. Two new tests set both through temp_env:
  resolve_choice_prefers_the_value_over_the_environment_variable (value "mcp", env var "chat", expects
  InspectionType::Mcp) and resolve_choice_ignores_the_environment_variable_for_an_invalid_value (value
  "bogus", env var "mcp", expects the default InspectionType::Chat).


  Timeout text. LiteLLM's _coerce_timeout calls float(), and float(" 45 ") is 45.0
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L268-L283).
  choice.rs's coerce_timeout trims before it parses, but no case has spaces, so dropping .trim() passes
  every test. A new case text_with_spaces in coerce_timeout_clamps_or_rejects passes
  TimeoutValue::Text(" 45 ") and expects Some(45.0).


  Mode inference. LiteLLM's _infer_inspection_type_from_mode keeps the current surface when the hooks name
  both surfaces or neither
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L643-L664).
  In event_hooks/tests.rs, the mixed case of infer_inspection_from_mode_flips_only_for_exclusive_surfaces
  starts from Chat and expects Chat, and no case has only logging_only. An arm at event_hooks.rs line 88
  that always returns InspectionType::Chat passes today. Two new cases start from Mcp and expect Mcp:
  mixed_keeps_current_mcp with [PreCall, PreMcpCall], and logging_only_keeps_current with [LoggingOnly].


  Mixed-mode warning. LiteLLM's _warn_if_mode_surface_mismatch names the MCP hooks as unused when
  inspection_type is chat and the chat hooks otherwise
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L720-L746,
  line 735). The only warning test runs with InspectionType::Chat, so a warning that always names the MCP
  hooks passes. warn_if_mode_surface_mismatch_names_the_chat_hooks_for_mcp_inspection runs the same mixed
  set with InspectionType::Mcp and asserts the log has "{PreCall}" and no "{PreMcpCall}".


  Config model. LiteLLM's get_config_model returns the CiscoAIDefenseGuardrailConfigModel class
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L2114-L2120).
  cisco_configuration.rs declares CiscoConfigModel as an empty struct with no link to B3758's section,
  and its one test, cisco_config_model_type_id_is_distinct_from_other_types, asserts that its TypeId
  differs from u8's. Any type passes that. CiscoConfigModel becomes pub type CiscoConfigModel = Configured,
  with Configured from betterlite_config::sections::cisco_verdict_contracts, and the comment above it says
  that Configured is betterlite's typed form of LiteLLM's config model. The test becomes
  cisco_config_model_is_the_cisco_section_type and asserts TypeId equality with Configured.


  Left out. The finding that _build_metadata has no port is wrong on today's main: B3762 built it in
  crates/betterlite-guardrails/src/cisco_inspection/chat.rs (request_metadata and text_field). It reads
  user, litellm_call_id and the seven keys from the request body. The NaN timeout finding has no live
  path. coerce_timeout has no caller on main, B3758's resolve.rs resolves the timeout the guardrail uses,
  and B3762's transport.rs turns a NaN into the 10 second default through Duration::try_from_secs_f64,
  so no Cisco call waits without a bound. LiteLLM's own _coerce_timeout lets NaN through as well.
scope:
  paths:
    - crates/betterlite-config/src/sections/cisco_verdict_contracts.rs
    - crates/betterlite-config/src/sections/cisco_verdict_contracts/tests.rs
    - crates/betterlite-guardrails/src/cisco_configuration.rs
    - crates/betterlite-guardrails/src/cisco_configuration/tests.rs
    - crates/betterlite-guardrails/src/cisco_configuration/choice/tests.rs
    - crates/betterlite-guardrails/src/cisco_configuration/event_hooks/tests.rs
    - crates/betterlite-guardrails/src/cisco_configuration/payload.rs
    - crates/betterlite-guardrails/src/cisco_configuration/payload/tests.rs
    - crates/betterlite-guardrails/src/cisco_inspection/chat/tests.rs
  lint_tables: false
