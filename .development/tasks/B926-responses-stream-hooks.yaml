id: B926
title: Preserve Responses stream cache, billing and callback order
description: >-
  Implement api::responses_stream_hooks for all live base methods L534-L799 and L809-L952.
  The two testing-only hook facades are excluded after checking production callers.
  Consume B2413 state/error/task primitives and B928 detached logging/cost helpers; neither
  depends on this task. B250/B251 provide success/failure handlers, B068 cost calculation,
  B125 cache eligibility/writes, B189 callback registry/converted-stream flags, B004 response
  metadata, B157 async_post_call_success_deployment_hook and B198 async/thread execution.
  B125/B068/B157 have no detailed task files yet: consume those exact injected interfaces,
  not local copies of their implementations. Python callbacks remain supported per README.

  Use B171 responses_stream_hooks with recording cache/logging/callback dependencies and
  deterministic barriers. Compare invocation order, arguments, mutations and diagnostics;
  actual provider I/O is B927's HTTP oracle. Do not wait with wall-clock sleeps or conflate
  success-handler scheduling with completion of the callback. Reuse settings from their
  owners, including litellm.cache and callbacks; add no new config key or parser. The live
  methods contain 364 nonblank/non-comment lines. Budget 330 implementation, 190 tests,
  125 fixtures, 95 adapters and 25 wiring lines: 765 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_stream_hooks.rs
  - crates/betterlite-core/src/api/responses_stream_hooks/**
  - tools/oracle/src/helpers/core_ops/responses_stream_hooks.rs
  - tools/oracle/src/helpers/core_ops/responses_stream_hooks/**
  - tools/oracle/helpers/responses_stream_hooks.py
  - tools/oracle/helpers/responses_stream_hooks/**
  - tools/oracle/fuzz/corpus/helper_case/responses_stream_hooks-*
  - tools/oracle/cases/helpers/responses-stream-hooks/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L534-L799
  why: Complete success/cache/header/failure-event and deployment-chunk-hook methods, with no split cache call.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L809-L952
  why: Metadata precedes post-success hooks and failure callbacks run async-before-sync with tracked tasks.
dod:
- text: >-
    terminal_cache_write stores only response.completed with a typed response,cache handler,
    dict request kwargs,global cache and positive eligibility. Require stream exactly true
    OR a truthy _websearch_interception_converted_stream,_compression_interception_converted_stream,
    _headroom_interception_converted_stream or _code_interpreter_interception_converted_stream.
    Copy kwargs,remove custom_llm_provider and null metadata,choose preset_cache_key over
    popped cache_key unless preset is null,then pass that key to eligibility and write.
    Nonnull metadata survives. Serialize the complete response and pass dual_cache as
    dynamic_cache_object. Set cached=true only after sync write or async scheduling;
    skipped/serialization-failed writes remain retryable. Async failure logs
    "Responses stream cache write failed: broken" and does not clear the flag.
  proof: [hook-tests, oracle, hook-adapter]
- text: >-
    completed_logging_once sets logged=true before cache work,then caches,creates a detached
    B928 event,restores headers and dispatches success with start/end/cache_hit. Async uses
    prefer_async_handlers=true; when _on_deferred_stream_complete is nonnull store the
    coroutine in _deferred_stream_complete_args instead of scheduling it. Sync starts
    async_success_handler then submits success_handler. Post-success hooks run after this
    dispatch setup. A second call does nothing even if the first cache operation raised.
    cached_response state skips persistence and passes cache_hit=true.
  proof: [hook-tests, oracle, hook-adapter]
- text: >-
    logging_header_isolation leaves the caller event untouched. If B928 returned that same
    object or nested response is not typed, restoration does nothing. Otherwise source
    hidden additional_headers/headers win when truthy,with iterator processed/raw snapshots
    as fallback; nonmapping candidates become {}. Copy only these header maps,then overlay
    existing target hidden keys,so target headers win. Do not copy source response_cost
    into the logging clone. Mutating restored headers must not mutate client-visible headers.
  proof: [hook-tests, oracle, hook-adapter]
- text: >-
    failed_usage_and_error maps typed/dict usage via B928 then B906 into
    model_call_details.combined_usage_object and records calculator result or 0.0 as
    response_cost before failure handling. Missing/invalid usage skips billing; conversion
    TypeError/ValueError logs "could not record usage for failed responses stream: %s".
    error and response.failed events use B2413 mapping; other types pass. Eligible failures
    raise MidStreamFallbackError carrying original status,generated_content equal to text
    only and is_pre_first_chunk=!yielded_first_chunk; ineligible 400/401/404 raises the mapped
    error directly. A created event already yielded makes is_pre_first_chunk=false even
    though output_started is false. Preserve SDK type/param/code through B011's mapper.
  proof: [hook-tests, oracle, hook-adapter]
- text: >-
    deployment_chunk_hooks uses explicit valid call_type,then valid logging.call_type,
    otherwise null; truthy request_data wins over model_call_details. Run installed hooks
    in order,carry each nonnull replacement forward and ignore null returns. On complete
    hook traversal set _post_streaming_hooks_ran=true if any hook ran. A thrown exception
    stops later hooks and returns the latest chunk silently,without setting that flag;
    test replace a->b then fail then c to expect b and no c invocation.
  proof: [hook-tests, oracle, hook-adapter]
- text: >-
    post_success_metadata overlays logging details onto request_data,ensures litellm_params
    exists and invokes B004 update_response_metadata with include_overhead=false. Metadata
    errors are ignored. Post-success call_type uses valid explicit value or responses,
    not logging.call_type. With a loop,track the spawned task named
    "Responses stream post-call success hook"; without one,run synchronously and swallow
    errors. No completed_response means no effects. Hook return values do not replace
    the completed event here; B157 owns callback-specific exception policy.
  proof: [hook-tests, oracle, hook-adapter]
- text: >-
    failure_callback_order marks failure_handled before any work and dispatches exactly once.
    With a loop,await async_failure_handler then submit failure_handler in finally,even
    when async fails; record task name "Responses stream failure logging". Without a loop,
    swallow async runner failure and still submit sync; submission failures are swallowed.
    Both receive the same exception,traceback,start/end times. Await-pending clears the
    stored tuple before waiting for every task and does not rethrow task exceptions;
    task completion diagnostics remain B2413's responsibility.
  proof: [hook-tests, oracle, hook-adapter]
checks:
  optional: []
  commands:
  - id: hook-tests
    why: cache or callback ordering mutates client output or duplicates side effects
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_hooks::/)'
  - id: hook-adapter
    why: ordered callback/cache effects have no independent pinned execution
    run: test -f tools/oracle/helpers/responses_stream_hooks.py && grep -qE '^[[:space:]]+responses_stream_hooks:' tools/oracle/fuzz/corpus/helper_case/responses_stream_hooks-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-stream-hooks/terminal-cache-write.yaml
- tools/oracle/cases/helpers/responses-stream-hooks/completed-logging-once.yaml
- tools/oracle/cases/helpers/responses-stream-hooks/logging-header-isolation.yaml
- tools/oracle/cases/helpers/responses-stream-hooks/failed-usage-and-error.yaml
- tools/oracle/cases/helpers/responses-stream-hooks/deployment-chunk-hooks.yaml
- tools/oracle/cases/helpers/responses-stream-hooks/post-success-metadata.yaml
- tools/oracle/cases/helpers/responses-stream-hooks/failure-callback-order.yaml
deviations: []
out_of_scope:
- B2413 owns primitives/state L73-L361; B925 _process_chunk L363-L532; B927 live/synthetic iteration L954-L1326; B928 synthetic/billing helpers L1329-L1732; B942-B945 websocket methods after L1732.
- Both call_post_streaming_hooks_for_testing facades L801-L807 and L995-L1006 have no production caller at the pin; their tested live callee remains owned here.
- B125 owns cache backend/eligibility/task creation, B068 the calculator and B157 the shared post-success callback dispatcher; their missing detailed plans are explicit integration seams.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_stream_hooks in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_stream_hooks.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_stream_hooks.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- logged is latched before the cache write, so a failed write must not enable a second success dispatch.
- A chunk hook exception stops the chain silently and keeps any earlier replacement.
- Error-event fallback uses yielded_first_chunk, while transport fallback also considers whether output actually started.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
