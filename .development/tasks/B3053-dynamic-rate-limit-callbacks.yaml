id: B3053
title: Dynamic priority token accounting and headers
description: >-
  Build post-success token accounting for priority-based rate limiting within the shared v3 limiter.
  Add dynamic priority headers to successful responses when rate-limit tracking is active, then
  increment model-wide and priority-specific token counters using the shared rate-limit key format
  and TTL preservation.

  Ownership includes:

  - Response headers: async_post_call_success_hook calls the v3 limiter's post-call hook to add
    standard rate-limit headers. When the response has hidden params (indicating active tracking),
    it adds x-litellm-priority header with value from B3051's priority resolver (team metadata first,
    then key metadata fallback) or "default" if absent. The priority header is skipped and a debug
    message is logged if the string is not Latin-1 encodable. Also adds x-litellm-rate-limiter-version="v3"
    when response has hidden params. Both headers are conditional on response_has_hidden_params(response).
    Preserves response structure and exception handling.

  - Success-event token accounting: async_log_success_event extracts model_group and priority from
    standard_logging_object metadata, resolves token counts by rate_limit_type (output/input/total),
    and creates pipeline operations for two descriptor types: model_saturation_check (model-wide tokens)
    and priority_model (priority-specific tokens with pool key). Calls async_increment_tokens_with_ttl_preservation
    with the pipeline and optional parent OTel span.

  - Priority resolution: Uses key metadata priority from standard_logging_object stored during pre-call,
    checking user_api_key_auth_metadata.priority (not team priority, preserving the pre/post asymmetry).
    Priority values not in SAFE_PRIORITIES {low, medium, high, default} are redacted in debug logs.

  - Latin-1 encoding check: _is_latin1_encodable returns true only when all characters have ord() < 256,
    skipping header insertion for non-encodable priority strings.

  - Descriptor key construction: Uses v3_limiter.create_rate_limit_keys with model_saturation_check
    and priority_model descriptor types and the resolved model/priority scopes, returning keys suitable
    for token increment operations.

