dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: cached_admin, expired_admin_401,
      session_live_grants, ui_blob_disabled, team_cache_refresh, resolved_key_skips_cache,
      prefetch_requires_db, end_user_region_budget, absent_end_user_default_budget,
      end_user_budget_429, end_user_failure_keeps_id, cache_error_blob_fallback,
      cache_restores_provenance, blob_unmarked, sk_prefix_skips_blob, blob_error_401,
      session_without_db_no_refresh, refreshed_role_before_admin,
      admin_naive_utc, admin_expiry_equal_now, admin_no_expiry, expiry_param_abbreviation,
      invalid_admin_expiry, admin_end_user_permissions, admin_returns_before_team,
      dashboard_team_skipped, team_refresh_timestamp_matrix, team_prefix_fields_only,
      team_refresh_error_dropped and master_comparison_failure_false.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_cached_sessions::tests::/)
        - test(/replays_the_/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::auth_cached_sessions::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-cached-sessions-*")"
        && grep -rlq "EXPERIMENTAL_UI_LOGIN" crates/betterlite-config/fuzz/corpus/config_yaml/auth-cached-sessions-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_cached_sessions::tests::/)
        - test(/replays_the_/)'
