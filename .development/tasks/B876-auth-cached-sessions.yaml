pitfalls:
  - Equal or missing refresh timestamps must not overwrite cached team fields; source compares strictly greater only when both exist.
  - End-user lookup failures are swallowed except BudgetExceededError, so replacing that block with a generic fail-closed lookup changes requests that currently proceed.
