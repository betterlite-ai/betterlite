id: B876
title: Cached UI session and administrator authentication
description: >-
  Resolve end-user context, cache-only virtual keys, UI/CLI blob sessions and cached administrators before
  master-key fallback. Preserve trusted via_virtual_key provenance restoration, live session grant refresh,
  cached team last_refreshed_at ordering and expired admin-key eviction. An admin key is expired only
  when expiry is earlier than now. EXPERIMENTAL_UI_LOGIN absent permits attempted blob decryption; explicit
  false disables it, and invalid blobs fail closed.

  Extract the end-user ID through B880 with safe headers from B1100, then resolve/validate it before
  best-effort enrichment. With a DB, B735 prefetches identity cache keys, omitting the key lookup when
  a token is already resolved. A truthy end-user ID enters end_user_params before B739's lookup.
  Copy allowed_model_region and apply the row's budget via B753; only an absent row may use B739's
  default budget when litellm.max_end_user_budget_id is not None. BudgetExceededError escapes as
  429 budget_exceeded/null param; every other enrichment error debug-logs and continues, retaining
  the end-user ID and any fields already set.

  If no token was supplied by an earlier stage, hash the credential through B2314 and resolve it via
  B870 IdentityStore with check_cache_only=true. A trusted cache token restores via_virtual_key=true;
  cache errors are debug-logged and treated as a miss. Attempt B1223 blob decryption only on a miss,
  only for tokens without the literal sk- prefix, and unless EXPERIMENTAL_UI_LOGIN resolves to False.
  Its secret boolean resolver trims/case-folds true and false; unknown strings resolve None and still
  attempt decryption. B002 supplies that resolved setting; there is no separate startup parser here.
  The decrypted blob never gains cache provenance. Refresh is_session_token grants through B738 only
  when a DB exists, before examining the role. There is no credential or callback-variable DB write.

  Cached PROXY_ADMIN expiry accepts a datetime or ISO string, assigning UTC to a naive timestamp.
  Only expiry strictly before now triggers B734 cache deletion, then 401 expired_key; param is B881's
  abbreviate_api_key result (sk-... for short keys, otherwise sk-... plus the last four characters).
  No expiry and equality with now pass. Invalid date parsing propagates as 401 auth_error/param "None".
  An accepted admin receives B753 end-user params, parent span and any end-user object_permission and
  returns before team refresh. For non-admins, refresh only a non-null team other than litellm-dashboard,
  via B737 cache-only lookup. Both timestamps must exist and the team's must be strictly newer. Copy
  only fields whose team_-prefixed name exists on the token, including null values; debug-log/drop
  refresh errors. Finally compare api_key and master_key in constant time, treating comparison errors
  as false; B052 owns what happens with that result.


  Build the production auth_cached_sessions module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _user_api_key_auth_builder.cached_session (L1897-L2076; 149 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): EXPERIMENTAL_UI_LOGIN=None;
  litellm_settings.max_end_user_budget_id=None.


  Session and master-key cases cross the real protected HTTP route after installing this stage in B732.
  B860 seeds equivalent cache backing rows in isolated Postgres schemas, selecting POSTGRES_TEST_URL
  before testcontainers; compare the downstream response as well as each rejected session's error.


  Write betterlite-config::auth_cached_sessions::tests::ui_login_absent_attempts, ui_login_false_skips,
  ui_login_true_attempts, ui_login_secret_bool_conversion and default_budget_id_loads.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  Sizing: 149 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  190 production, 250 behavior/server tests, 65 wiring and 60 config lines, 565 within a 600-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_cached_sessions::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
