id: B3618
title: Pass-through provider route composition helpers
description: >-
  Build the helpers that LiteLLM's provider pass-through routes share, as the module passthrough_route_helpers in crates/betterlite-server.
  The route tasks that follow (B3619 to B3629) call them and register no route here, so this task adds no HTTP route and no HTTP oracle case.
  Every name below is at most 30 characters; LiteLLM's longer names are renamed on purpose.

  Request facts. `RequestCopy` holds method, url, headers (a copy, never the shared cached map), cookies and query_params as a plain string map. `create_request_copy` fills it from the incoming request; headers come from B1100's cached header read.
  `uses_router_model(body, router)` replaces is_passthrough_request_using_router_model. It is true only when the body's `model` is a JSON string and B2400's is_known_model finds it in the router's model names. A missing router, a missing model, a non-string model and any lookup failure give false and never an error.
  `is_streaming_body(body)` replaces is_passthrough_request_streaming. It is true only for a JSON object whose `stream` field is true. A list, a scalar and a missing field give false.
  `request_is_streaming(request)` replaces is_streaming_request_fn. For any method but POST it returns false without reading the body. For a POST with a multipart/form-data content type it reads the form through B1101, otherwise it reads the body through B1100's body read, and it returns is_streaming_body of the result.

  Model groups. `deployment_model_name(litellm_params)` returns the model name that B174's provider resolution gives for the deployment's `model` (default empty string) and its `custom_llm_provider`. Only the resolution's bad-request error is swallowed, and then the raw `model` string is returned. `models_served_by_group(router, group)` returns the set of those names over B844's get_model_list(model_name=group), empty when the list is empty or missing. `RelayRejection` is the record `{error: String}` that routes put in a 400 detail.

  Router metadata. `router_request_metadata(auth)` builds an empty `litellm_metadata` map and calls B1106's add_user_api_key_auth_to_request_metadata for it with the bucket name `litellm_metadata`, then returns that map. It must be that bucket and never `metadata`, because the router hop reads spend attribution only from `litellm_metadata` and `agent_id` and `user_api_end_user_max_budget` would be lost.

  Target URL. `provider_target_url(base, endpoint)` is the block that LiteLLM repeats in the gemini, cohere, mistral and generic routes. Take the path of the endpoint as httpx does: the query and fragment are dropped, and a leading `/` is added when missing. Then join it to the path of the base with B3600's join_base_and_endpoint_path and return the base with that path. The base keeps its scheme, host, port and query. The other route tasks call this function instead of copying the block.

  Generic provider route. `provider_factory_route` replaces llm_passthrough_factory_proxy_route and takes custom_llm_provider, endpoint, the request, the response and the authenticated key. Steps in order:
  1. Get the provider's model info from B2220's factory with model None. A provider with no model info gives HTTP 404 with detail "Provider {custom_llm_provider} not found". A provider name that is not a known provider is an internal error (500), as in LiteLLM.
  2. Call its get_api_base with no argument, so the provider's own env var or default applies. None gives 404 "Provider {custom_llm_provider} api base not found".
  3. Build the target with provider_target_url.
  4. Read the credential with B3602's get_credentials(custom_llm_provider, region_name None).
  5. Call the provider's validate_environment with empty headers, model "", no messages, empty optional_params and litellm_params, that api key and that api base. The returned headers are the custom headers of the call.
  6. For POST only: a body that is not multipart/form-data is read as JSON (B1100), a multipart one through B1101's form read. If the body's `stream` is truthy, the call is streaming. GET, PUT, DELETE and PATCH are never streaming.
  7. Build B3615's create_pass_through_route handler with endpoint, the target, those custom headers and the streaming flag, call it with the request, response and key, and return its result.

  Router relay. `relay_upstream_response` reads the whole upstream body and returns a response with the upstream status and B3600's get_response_headers(headers, custom_headers None). `relay_upstream_bytes` yields the upstream chunks unchanged and always closes the upstream stream afterwards, also when the client goes away or an error stops the loop.
  `relay_router_model` takes the router, the model group, the endpoint, the request, the request body, the streaming flag and the authenticated key. It calls the router's passthrough route with: model, the request method, endpoint, the request query params, the request headers (B1100's cached read), stream flag, content/data/files/params/headers/cookies all None, `json` set to the body only when the request content type is JSON (else None), and litellm_metadata from router_request_metadata. Then:
  - an upstream HTTP status error (the router raises it for 4xx and 5xx) is turned into relay_upstream_response of the error's response, with the upstream status;
  - a non-streaming result goes through relay_upstream_response;
  - a streaming result that is a bare byte stream (no status and no headers) becomes a status 200 streaming response with the single header `content-type: text/event-stream`;
  - any other streaming result carries its own status and headers: the response uses that status and B3600's get_response_headers of its headers.
  Both streaming forms are wrapped in the SSE keepalive wrapper (the SseKeepalive trait that B3613's HandlerDeps already holds; read where it is declared) with ping_interval_seconds from the setting `sse_keepalive_ping_interval_seconds` (B002, default None, which means no pings) and, as upstream headers, the single content-type header or the result's own headers.
  The router is reached through a small trait this module declares, `RouterPassthrough`, with one async method that takes a `RouterPassthroughCall` (the arguments above) and returns `RouterPassthroughReply` (Buffered, ByteStream, or StatusStream with status, headers and byte stream) or `RouterPassthroughError` (UpstreamStatus carrying the upstream response, or Other). The architect wires the real router to it later; tests use a recording fake.
