dod:
  - text: create_request_copy returns method, url, a copied header map, cookies and the query params as a string map, and changing the copy does not change the request.
    proof: [request-copy-tests]
  - text: uses_router_model is true only for a string model that is in the router's model names, and false for a missing router, a missing model, a non-string model and a failing lookup.
    proof: [router-model-tests]
  - text: is_streaming_body is true only for an object with `stream` true, and request_is_streaming reads no body for GET, reads a form for multipart POST and the body for other POSTs.
    proof: [streaming-flag-tests, oracle]
  - text: deployment_model_name strips the provider prefix, falls back to the raw model on a bad-request resolution error and lets other errors through; models_served_by_group collects these names for the group.
    proof: [served-models-tests]
  - text: router_request_metadata returns the user-key attribution inside the litellm_metadata bucket, including agent_id and user_api_end_user_max_budget when the key has them.
    proof: [router-metadata-tests]
  - text: provider_target_url drops the endpoint's query, adds a leading slash, keeps the base path prefix, and falls back to the base path plus a slash when `..` climbs out of it.
    proof: [target-url-tests, oracle]
  - text: provider_factory_route answers 404 for a provider without model info or without an api base, builds the target and auth headers from the provider config and credential, sets streaming only for a POST body with `stream` truthy, and calls B3615's factory handler.
    proof: [factory-route-tests]
  - text: relay_router_model sends the exact router arguments (json only for a JSON content type, metadata from router_request_metadata) and returns the right response for an upstream status error, a buffered result, a bare byte stream and a status-carrying stream.
    proof: [router-relay-tests]
  - text: relay_upstream_bytes closes the upstream stream after the last chunk, after an error and when the consumer drops it, and the SSE keepalive wrapper receives the configured ping interval.
    proof: [upstream-close-tests]
checks:
  optional: []
  commands:
    - id: request-copy-tests
      why: the request copy is missing, shares state with the request, or drops a field
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::request_copy(::|$)/)'
    - id: router-model-tests
      why: uses_router_model accepts a non-string model, errors on a missing router, or misses a known model
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::router_model(::|$)/)'
    - id: streaming-flag-tests
      why: the streaming flag or the POST-only body read is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::streaming_flag(::|$)/)'
    - id: served-models-tests
      why: model-group name resolution or its bad-request fallback is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::served_models(::|$)/)'
    - id: router-metadata-tests
      why: the router metadata is built in the wrong bucket or misses the attribution fields
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::router_metadata(::|$)/)'
    - id: target-url-tests
      why: the provider target URL keeps the query, loses the base path or leaves the base path
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::target_url(::|$)/)'
    - id: factory-route-tests
      why: the generic provider route returns the wrong 404, the wrong headers or the wrong streaming flag
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::factory_route(::|$)/)'
    - id: router-relay-tests
      why: the router relay sends wrong arguments or builds the wrong response for one of the result shapes
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::router_relay(::|$)/)'
    - id: upstream-close-tests
      why: the upstream stream is left open or the keepalive interval is not passed
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_route_helpers::tests::upstream_close(::|$)/)'
