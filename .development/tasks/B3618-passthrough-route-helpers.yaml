deviations:
  - what: A POST body that is not valid JSON on the generic provider route gets B1100's 400 invalid_request_error for the request body, not FastAPI's plain 500 "Internal Server Error".
    why: LiteLLM calls request.json() with no handler, so a bad body is an unhandled JSONDecodeError. betterlite has one body decoder and a 400 tells the client what is wrong. Open question in the notes.
  - what: LiteLLM's helpers _optional_str, _string_keyed_mapping and _json_request_body are not built.
    why: On serde_json values they are as_str, as_object and the B1100 body read, so the route tasks use those directly. Callers are listed in out_of_scope.
  - what: The router is reached through the RouterPassthrough trait, and the three router result shapes are one enum.
    why: Python tells them apart with inspect.isasyncgen and a cast; Rust needs a closed type. What a client sees is the same.
out_of_scope:
  - "Every @router.api_route and @router.websocket in llm_passthrough_endpoints.py, and the module singletons `router`, `vertex_llm_base`, `default_vertex_config`: B3619 to B3629 own their routes, and B3616 registers them."
  - "The vllm route's own router-model branch (L486-L548) builds its response without relay_router_model; B3627 owns it and calls provider_factory_route for the fallback."
  - "_relay_azure_router_model, _relay_azure_body_model_group, get_azure_ai_search_index_from_endpoint and is_azure_ai_search_service_level_index_create: B3624 owns them and calls models_served_by_group and relay_router_model."
  - "relay_nvidia_nim_request and nvidia_nim_proxy_route: B3628 owns them and calls relay_router_model."
  - "_resolve_vertex_model_from_router and _override_vertex_params_from_router_credentials: B3622 and B3623 own them; they use no helper from this task."
  - "_is_bedrock_agent_runtime_route, _is_bedrock_agent_runtime_passthrough_disabled and the Bedrock model helpers: B3620 and B3621 own them."
  - "_join_url_paths (used only by the OpenAI routes at L3144 and L3253): B3628 owns it."
  - "_proxy_general_settings, _resolve_aws_passthrough_region and _get_llm_router: single-route readers of proxy globals; B3621, B3625 and B3629 own them."
  - "The streaming type of Router.allm_passthrough_route (AsyncPassthroughStreamingResponse): B3572 owns it. The Router method itself has no owning task I could find; see the notes."
  - "create_pass_through_route, join_base_and_endpoint_path and get_response_headers: B3615 and B3600 own them; this task only calls them."
pitfalls:
  - "httpx.URL(endpoint).path drops everything after `?` and `#`, so a query string inside `endpoint` never reaches the target; the route's own query forwarding is B3615's job."
  - "provider_factory_route does not pass custom_llm_provider to create_pass_through_route, so a call through it is typed as a generic endpoint for logging and cost."
  - "uses_router_model must not panic on `model` set to a list or an object; Python's set lookup raises TypeError there and the except turns it into false."
  - "The router relay sends `json` only when the request content type is JSON, so a multipart or text body reaches the router as data None and json None."
  - "The bare byte stream branch hard-codes status 200 and `content-type: text/event-stream`; only the other stream branch reads the router's real status and headers."
  - "relay_upstream_bytes must close the upstream in a finally path; a client disconnect stops the loop without an error."
  - "A router 4xx or 5xx arrives as an HTTP status error, not as a result; relay it with the upstream status and body, never as a 500."
  - "provider_factory_route reads the stream flag with truthiness of the body's `stream` while is_streaming_body wants true; for a bool field both agree, so cases use bool."
  - "router_request_metadata starts from `{litellm_metadata: {}}`; B1106's function reads `agent_id` from that same map, so do not seed `metadata`."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
