id: B358
title: Offline learned tier prediction
description: Implement heuristic_v2 as a pure typed artifact predictor over B328's prompt features. Load
  the pinned packaged artifact once, validate it before publishing router state, and expose forecasts
  through B331's common classifier outcome without a network dependency. Use checked Decimal arithmetic
  for posterior statistics, preserve source-data attribution, and fuzz artifact bytes independently of
  network classifier JSON. Use the existing Rust crate boundaries from B004 and B008; integrate through
  the server when the provider dispatcher or callbacks live in another core crate. This task's source
  slices are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the
  matching adapters to B301's component runner where state is not observable over HTTP; adapters call
  production logic and never reproduce it. Use deterministic candidate sets or supplied random samples
  for comparisons, and separate seeded distribution tests for random choices. Extend the existing config_yaml
  fuzz target and committed corpus for every newly accepted config form; unsupported keys still fail by
  full path. Add a cargo-fuzz target tier_artifact under crates/betterlite-router/fuzz and a normal replays_the_tier_artifact_corpus
  test using the production parser. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/tier-artifact-predictor/**
  - tools/oracle/src/router_probes/tier-artifact-predictor/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/tier_artifact_predictor.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/tier_predictor.py#L14-L157
  why: Artifact validation, cohort lookup and monotone posterior.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L1931-L1956
  why: Heuristic-v2 classifier output.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(tier_artifact_predictor)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/tier_artifact.rs && test -n "$(ls -A crates/betterlite-router/fuzz/corpus/tier_artifact)"
      && cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_tier_artifact_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/tier-artifact-predictor/artifact-global-domain-cohort.yaml
- tools/oracle/cases/routing/tier-artifact-predictor/monotonic-tier-probabilities.yaml
- tools/oracle/cases/routing/tier-artifact-predictor/unicode-cohort.yaml
- tools/oracle/cases/routing/tier-artifact-predictor/threshold-last-tier.yaml
- tools/oracle/cases/routing/tier-artifact-predictor/duplicate-artifact-statistic.yaml
- tools/oracle/cases/routing/tier-artifact-predictor/missing-statistic.yaml
- tools/oracle/cases/routing/tier-artifact-predictor/invalid-artifact-rejects-startup.yaml
- tools/oracle/cases/routing/tier-artifact-predictor/threshold-equality.yaml
deviations: []
out_of_scope:
- Training new artifacts, JEV transport or Decisions API support.
pitfalls:
- A changing download cannot replace the pinned packaged artifact.
- Reject duplicate and malformed statistics before any live request uses the artifact.
- The numerical precision chosen for B328 also applies to posterior comparisons.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
