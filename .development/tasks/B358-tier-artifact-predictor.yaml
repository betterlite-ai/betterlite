id: B358
title: Offline learned tier prediction
description: 'Implement heuristic_v2 as a pure typed artifact predictor over B328''s prompt features.
  Load the pinned packaged artifact once, validate it before publishing router state, and expose forecasts
  through B331''s common classifier outcome without a network dependency. Use finite f64 arithmetic for
  posterior statistics, preserve source-data attribution, and fuzz artifact bytes independently of network
  classifier JSON. Nonmonetary statistical arithmetic uses f64 only in posterior_math; put one module-level
  #[expect(clippy::float_arithmetic, reason = "pinned statistical routing arithmetic")] there, counted
  in this task budget. Money, prices, spend and budgets stay rust_decimal::Decimal, including database
  and wire boundaries. Reject nonfinite statistical input. Assert selected model/tier exactly; any opt-in
  tolerance is for diagnostic scores only, never a different selection. Configuration boundary keys introduced
  or consumed here: heuristic_v2_artifact, heuristic_v2_success_threshold. Pinned declaration defaults:
  heuristic_v2_artifact=''ultrafeedback''; heuristic_v2_success_threshold=None. Resolve env values once
  in betterlite-config, never in router code. Implement the owned native service in crates/betterlite-router/src/tier_artifact_predictor.rs.
  Add ProbeOperation::TierArtifactPredictor in tools/oracle/src/router_probes/mod.rs and the corresponding B358 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/tier_predictor.py:
  TierGlobalStatistic._successes_do_not_exceed_observations (L21-L24), TrainedTierArtifact._statistics_are_unique
  (L56-L66), resolve_tier_artifact (L82-L89), similarity_cohort (L92-L101), TierSuccessPredictor.__init__
  (L111-L122), TierSuccessPredictor.routing_threshold (L125-L126), TierSuccessPredictor.predict (L128-L139),
  TierSuccessPredictor._probability (L141-L147), TierSuccessPredictor._posterior_mean (L150-L157). Implement
  these behaviors through the typed Rust services above; synchronous facades and structural accessors
  reuse the same primitive instead of separate ports. Bound the tier_data outside-byte parser to 1048576
  bytes before decoding; on excess use its typed invalid-input outcome (classifier/observation consumers
  keep their pinned warning/fallback path). If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001
  only on its explicitly named score/probability pointer. Selection, tie order, counts, statuses, money
  and provider requests remain exact. Six-decimal wire signals are compared after the source rounding,
  without widening tolerance.'
