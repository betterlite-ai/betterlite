deviations:
- what: The tier_data byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/tier_predictor.py#L14-L157
out_of_scope:
- Training new artifacts, JEV transport or Decisions API support.
pitfalls:
- A changing download cannot replace the pinned packaged artifact.
- Reject duplicate and malformed statistics before any live request uses the artifact.
- The numerical precision chosen for B328 also applies to posterior comparisons.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
