  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gitlab/gitlab_prompt_manager.py#L481-L560
    why: should_run_prompt_management, _compile_prompt_helper, and async_compile_prompt_helper methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gitlab/__init__.py#L1-L33
    why: Imports/globals and set_global_gitlab_config function.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gitlab/__init__.py#L55-L93
    why: _gitlab_prompt_initializer function, prompt_initializer_registry declaration and exports.
dod:
  - text: GitLabPromptManager.__init__ accepts gitlab_config, optional prompt_id, optional ref (git_ref override), and optional gitlab_client; it lazily constructs GitLabTemplateManager only when prompt_manager property is accessed or __init__ sets it immediately if prompt_id is provided.
    proof: [gitlab-compiler-init-tests]
  - text: integration_name property returns "gitlab".
    proof: [gitlab-compiler-init-tests]
  - text: prompt_manager property lazily constructs GitLabTemplateManager if not already set, passing gitlab_config, prompt_id, ref, and injected client if supplied.
    proof: [gitlab-compiler-lazy-tests]
  - text: get_prompt_template(prompt_id, prompt_variables, ref) loads missing prompts, fetches template and metadata from manager, and returns tuple of (rendered_prompt, metadata_dict).
    proof: [gitlab-compiler-get-tests]
  - text: should_run_prompt_management returns true when prompt_id is not None, false otherwise.
    proof: [gitlab-compiler-gate-tests]
  - text: _compile_prompt_helper raises ValueError if prompt_id is None, decodes or uses the prompt_id directly to check cache, fetches from GitLab if not loaded, parses messages, projects five optional params, and returns PromptManagementClient.
    proof: [gitlab-compiler-compile-tests]
  - text: _compile_prompt_helper extracts git_ref from dynamic_callback_params.extra['git_ref'] if present, passes it to _load_prompt_from_gitlab, and uses it in get_prompt_template.
    proof: [gitlab-compiler-ref-tests]
  - text: _compile_prompt_helper projects exactly five optional parameters (temperature, max_tokens, top_p, frequency_penalty, presence_penalty) from template metadata, including null values if present.
    proof: [gitlab-compiler-params-tests]
  - text: async_compile_prompt_helper accepts the same parameters, raises ValueError if prompt_id is None, and delegates to _compile_prompt_helper.
    proof: [gitlab-compiler-async-tests]
  - text: _parse_prompt_to_messages parses the rendered template with case-insensitive role prefixes, accumulates lines under each role, skips blank lines, and returns list of messages with role and content.
    proof: [gitlab-compiler-parse-tests]
  - text: set_global_gitlab_config sets a module-level config that can be retrieved at runtime.
    proof: [gitlab-compiler-global-tests]
  - text: _gitlab_prompt_initializer accepts PromptLiteLLMParams and PromptSpec, extracts gitlab_config and git_ref (optional), raises ValueError if gitlab_config is missing, and returns a GitLabPromptManager instance.
    proof: [gitlab-compiler-init-tests]
  - text: prompt_initializer_registry contains an entry mapping SupportedPromptIntegrations.GITLAB to _gitlab_prompt_initializer.
    proof: [gitlab-compiler-registry-tests]
