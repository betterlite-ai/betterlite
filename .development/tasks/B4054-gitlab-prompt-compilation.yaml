out_of_scope:
  - "GitLabPromptManager.pre_call_hook, post_call_hook, get_available_prompts, reload_prompts: these are defined in the same class but are not part of the compiler contract (B4058 owns the completion hooks)."
  - "GitLabPromptManager.get_chat_completion_prompt (sync version): owned by B4058 as the completion-hook adapter."
  - "GitLabPromptManager.async_get_chat_completion_prompt (async version): owned by B4058 as the completion-hook adapter."
  - "prompt_initializer in litellm/integrations/gitlab/__init__.py (lines 34-52): no caller at the pin; only _gitlab_prompt_initializer is registered and called."
  - "GitLab file fetching and template rendering; those are owned by B4053 (GitLabTemplateManager and GitLabClient)."
pitfalls:
  - GitLabPromptManager.__init__ constructs the template manager immediately if prompt_id is provided (not deferred until property access).
  - The prompt_manager property constructs the manager lazily only if __init__ did not already do so.
  - decode_prompt_id is called to normalize the prompt_id before cache lookup; both encoded and decoded forms can exist.
  - git_ref precedence is prompt_version (from method arg), then dynamic_callback_params.extra.get('git_ref'), then stored _ref_override.
  - _compile_prompt_helper wraps all exceptions in ValueError with the prompt_id in the message.
  - The five optional parameters must include null/None values if they are present in metadata; checking `if param in metadata` before copying.
  - Role prefixes must be case-insensitive; the check uses `.lower()` on the stripped line.
  - _parse_prompt_to_messages skips blank lines entirely; a line that is empty after stripping does not advance the content.
  - The injected gitlab_client is optional and passed through to GitLabTemplateManager if supplied; the lazy constructor uses it for HTTP requests.
  - _gitlab_prompt_initializer must extract both gitlab_config and git_ref from litellm_params; git_ref is optional but gitlab_config is required.
