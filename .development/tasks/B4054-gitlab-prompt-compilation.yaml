id: B4054
title: GitLab prompt compilation and initialization
description: >-
  Build GitLabPromptManager as a compiler for GitLab-hosted prompts, with lazy template
  loading, role parsing and optional parameter projection. The manager construction takes
  prompt ID and git ref override from config; it delegates to GitLabTemplateManager for
  file fetching and rendering. Implement should_run_prompt_management to gate on prompt_id,
  _compile_prompt_helper and async_compile_prompt_helper to fetch, render and transform
  templates into PromptManagementClient. Parse rendered templates into messages by case-insensitive
  role prefixes (System:, User:, Assistant:) and extract five optional parameters
  (temperature, max_tokens, top_p, frequency_penalty, presence_penalty) from template metadata.
  Build the _gitlab_prompt_initializer to construct managers from config and register it in
  prompt_initializer_registry under SupportedPromptIntegrations.GITLAB. Build set_global_gitlab_config
  for runtime config updates.
  Preserve the eager constructor's omission of an injected GitLab client (manager construction
  is lazy), the git_ref precedence (prompt_version override, then extra.git_ref, then stored ref),
  the outer prompt_id use in both initializer calls and compile output, and the decoded-or-encoded
  ID lookup in cache before fetching.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-prompts/src/gitlab_prompt_compiler.rs
    - crates/betterlite-prompts/src/gitlab_prompt_compiler/**
  lint_tables: false
