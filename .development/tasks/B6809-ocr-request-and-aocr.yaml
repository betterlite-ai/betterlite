    why: The request type, connection inputs and their sources.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/core/src/ocr/wire.rs#L1-L206
    why: Wire decoding and the document shape check.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/core/src/ocr/arguments.rs#L1-L122
    why: The consumed option names and the secret option check.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/core/src/ocr/document.rs#L1-L242
    why: File documents, MIME types by extension and the size cap.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/core/src/ocr/prepare.rs#L1-L316
    why: Provider resolution and option mapping into PreparedOcrRequest.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/core/src/ocr/client.rs#L1-L81
    why: OcrRoute execute and the prepare span.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/core/src/ocr/route.rs#L1-L71
    why: The hosted call and the Azure AD token callback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/ocr/dispatch.py#L1-L84
    why: The public ocr and aocr signatures and the provider taken from the model prefix.

dod:
  - text: A wire request decodes model, document, timeout, headers and options, and bad timeout, non-string header values and URL-less documents fail with the stated errors.
    proof: [input-tests, oracle]
  - text: The consumed option list matches arguments.rs for every provider kind, and unknown options go to the provider mapper while consumed ones never do.
    proof: [input-tests]
  - text: File path documents get the MIME type from the extension, an empty file, an over-cap file and a bad MIME type fail with their own errors.
    proof: [prepare-tests]
  - text: prepare_request resolves the provider from custom_llm_provider or the model prefix and produces the same PreparedOcrRequest fields as prepare.rs for each kind.
    proof: [prepare-tests]
  - text: aocr against a mock Mistral server returns the OCRResponse for a document_url call, and the same call with an unsupported provider fails with InvalidProvider.
    proof: [route-tests, oracle]
  - text: A caller_token call asks the host for an Azure AD token once and no other call does.
    proof: [route-tests]

checks:
  optional: [mutants]
  commands:
    - id: input-tests
      why: request decoding or option filtering is missing
      run: cargo nextest run --locked -p betterlite-ocr --no-tests=fail -E 'test(/^ocr_input::tests::/)'
    - id: prepare-tests
      why: file documents or request preparation is missing
      run: cargo nextest run --locked -p betterlite-ocr --no-tests=fail -E 'test(/^ocr_prepare::tests::/)'
    - id: route-tests
      why: the aocr call, route machine or token callback is missing
      run: cargo nextest run --locked -p betterlite-ocr --no-tests=fail -E 'test(/^ocr_route::tests::/)'

oracle_cases:
  - tools/oracle/cases/ocr/request/mistral-aocr-call.yaml
  - tools/oracle/cases/ocr/request/wire-decoding-errors.yaml

deviations: []

out_of_scope:
  - Provider code is B6801 to B6807 and provider choice is B6808. The HTTP route, request parsing for the proxy and response header handling are B3300 and B092.
  - The health probe trait OcrProbeCall is defined in B4449. This task owns the aocr function it calls, which no earlier task owned.
  - Python ocr and aocr keyword binding errors (TypeError text) belong to the Python SDK and have no native form.

pitfalls:
  - A bare relative file path in a document is read from disk, so the proxy must never pass untrusted paths. B3300 already rejects file documents in proxy JSON. Keep path inputs out of the wire decoder.
  - Keep secret options out of every log line and error text.
  - Provider chosen from the model prefix keeps the rest of the model string for the config, split on the first "/" only.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
