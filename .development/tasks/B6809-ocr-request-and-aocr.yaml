id: B6809
title: OCR request types, document intake and the aocr entry
description: >-
  Add four modules to betterlite-ocr that finish the SDK side of OCR, porting litellm-rust
  core/src/ocr (types, wire, arguments, document, prepare, client, route) and the public functions in
  litellm/ocr/dispatch.py. `ocr_input` holds `LiteLLMOcrRequest<D>` (model, document, api_key, api_base,
  timeout, custom_llm_provider, extra_headers, the remaining options, azure_ad_token_provider),
  `OcrDocumentInput` (an OcrDocument or a file path), `OcrConnectionInputs` with the source of each
  input (request, environment or host), `OcrWireRequest` and the decoders `decode_request`,
  `decode_request_input` and `decode_document`. A document with type document_url or image_url but
  no matching URL field fails with MissingDocumentUrl. timeout accepts seconds as a float and a
  negative or non-finite one fails with RequestField. max_response_bytes is read from the options and
  removed from the pass-through options. extra_headers values must be strings, else RequestField.
  `ocr_input` also holds the option filter from arguments.rs: the names consumed by the call itself
  are req_format, extra_body and max_response_bytes, the Azure AD names (azure_ad_token, tenant_id,
  client_id, client_secret, azure_scope, azure_authority_host, azure_credential,
  azure_federated_token_file, enable_azure_ad_token_refresh), the AWS names (aws_access_key_id,
  aws_secret_access_key, aws_session_token, aws_region_name, aws_session_name, aws_profile_name,
  aws_role_name, aws_web_identity_token, aws_sts_endpoint, aws_external_id) and the Vertex names
  (vertex_credentials, vertex_ai_credentials, vertex_project, vertex_ai_project, vertex_location,
  vertex_ai_location). Add the provider's supported options from B6808's kind. Export
  `is_supported_request(model, provider)`, `consumed_optional_params`, `consumed_optional_param_names`
  and `is_secret_param`. Secret option values are never logged.
  `ocr_prepare` holds `prepare_document` (path input to OcrDocument), `read_path_document`,
  `encode_file_document` and `mime_type_for_name` (pdf, png, jpg and jpeg, gif, webp, tiff and tif, bmp),
  with EmptyFile, InlineDocumentTooLarge and InvalidMimeType failures, and `prepare_request`, which
  resolves the provider through B6808, maps the options and builds `PreparedOcrRequest`.
  `ocr_route` holds `OcrRoute` (new(OcrClient), execute), `OcrCall`, `OcrOp::AcquireAzureAdToken` and
  the machine that runs a call with a caller-supplied Azure AD token callback. File reading happens
  in a blocking task and its join failure is DocumentTask. Wrap the prepare step in a debug span named
  litellm.prepare. The module also exports the two public calls: `ocr` and `aocr`. Both take a model, a
  document and optional api_key, api_base, timeout, custom_llm_provider, extra_headers and other
  options, and both return the OCRResponse from B3300. The native version has one function, `aocr`.
  The route context provider is custom_llm_provider, else the model prefix before the first "/".
  Name the function `aocr` so B4449's `OcrProbeCall` can call it for health probes.

scope:
  paths:
    - Cargo.lock
    - crates/betterlite-ocr/Cargo.toml
    - crates/betterlite-ocr/src/ocr_input.rs
    - crates/betterlite-ocr/src/ocr_input/**
    - crates/betterlite-ocr/src/ocr_prepare.rs
    - crates/betterlite-ocr/src/ocr_prepare/**
    - crates/betterlite-ocr/src/ocr_route.rs
    - crates/betterlite-ocr/src/ocr_route/**
    - tools/oracle/cases/ocr/request/**
    - tools/oracle/helpers/b6809.py
    - tools/oracle/helpers/b6809/**
    - tools/oracle/src/helpers/ocr/b6809.rs
    - tools/oracle/src/helpers/ocr/b6809/**
  lint_tables: false

references:
