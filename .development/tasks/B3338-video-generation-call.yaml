id: B3338
title: Video generation call and option precedence
description: >-
  Build the video generation entry points in betterlite-core::api: the async avideo_generation, the sync video_generation
  and the request-option projection from litellm/videos/utils.py. Plain words first: the caller passes prompt, model,
  input_reference, seconds, size, user, timeout, custom_llm_provider, extra_headers, extra_query, extra_body and loose
  keyword arguments. This task decides which of those reach the provider as request options, in what order they win,
  picks the provider, and hands one prepared request to the transport that B3333 owns.

  Option projection (module video_generation_call::options, two functions). requested_optional_params takes the call's
  named arguments merged with its loose keyword arguments and returns a VideoCreateOptionalRequestParams (B3330's type).
  Rules, in order. (1) Take every entry of the merged call data except the keys kwargs, extra_body, prompt and model, and
  drop entries whose value is null. (2) Remove LiteLLM-owned names from that set with B2228's is_litellm_owned_kwarg
  (api_base, client, mock_response, litellm_call_id, custom_llm_provider and the rest of that registry). (3) Take the
  nested loose-keyword map, drop null values, remove owned names the same way, and lay it over the result from step 2, so
  a loose keyword wins over a named argument of the same name. (4) Merge extra_body: first the top-level extra_body, then
  the extra_body found inside the loose-keyword map, each only if it is a map, skipping null values; the later one wins.
  Remove owned names from the merged map. If anything is left, store it as the extra_body option and also copy its
  entries flat into the options, where they win over everything from steps 1 to 3. (5) Remove the timeout option last, so
  timeout never reaches the provider as a request option. The nested loose-keyword map loses its extra_body entry during
  this step, and the caller sees that removal afterwards (the logging update later in video_generation reads the same
  map). Do not reproduce this by cloning; take the map by &mut and remove the key, as LiteLLM does.

  provider_request_params runs the provider config's map_openai_params (B3331 trait) with the options, the model and the
  drop_params setting from CoreSettings (B198, default false), then lets extra_body override the mapped result key by
  key when it is a non-empty map, and removes extra_body from the mapped result. An empty or non-map extra_body is ignored.

  video_generation (sync). Steps in this order: take the logging object and the call id out of the loose keywords, and
  read async_call (true only when it is exactly true). If mock_response is present, JSON-decode it when it is a string,
  build a VideoObject from it and return at once, with no provider lookup and no logging; an async caller gets the object
  directly. Otherwise build GenericLiteLLMParams from the remaining loose keywords, resolve (model, custom_llm_provider)
  with B174's get_llm_provider using model or "sora-2" (DEFAULT_VIDEO_ENDPOINT_MODEL) and the given custom_llm_provider,
  select the video config with B3332, and fail with the error text "video generation is not supported for <provider>" when
  the selector returns none. Build the options with the two functions above, then call B247's update_from_kwargs on the
  logging object with kwargs, the resolved model, user, the mapped params as optional_params, litellm_params holding
  litellm_call_id plus the mapped params, and the provider. Set the logging call type to create_video. Then call B3333's
  video_generation_handler with the resolved model, prompt, config, mapped params, provider, litellm params, logging
  object, extra_headers, extra_body (the original argument, not the merged one), timeout and the client loose keyword.
  timeout is `timeout or DEFAULT_REQUEST_TIMEOUT`: the default argument is 600, and 0 or none falls back to B198's
  request_timeout (REQUEST_TIMEOUT env var, default 6000 seconds). extra_query is accepted but never forwarded to the
  handler; it only becomes an option through step 1. Any failure goes through B185/B186's exception_type with model or
  "sora-2", the provider, the original error, the call's locals and the loose keywords.

  avideo_generation (async). Set async_call to true in the loose keywords. When custom_llm_provider is absent, resolve it
  with get_llm_provider on model or "sora-2"; api_base is read from the function's locals, which never hold it, so it is
  always none here even when the caller passed api_base as a loose keyword. Run video_generation on a worker with the
  caller's context copied (B198's call context, no global state), await the result when it is a future, and return it.
  Errors go through exception_type with the original model (possibly none) and the provider found so far.

  The Python overloads (avideo_generation flag true or false) are typing only. In Rust, expose two entry points that share
  one private implementation, and no flag argument.
