dod:
  - text: >-
      requested_optional_params removes kwargs, extra_body, prompt, model and null entries, then removes owned names.
      Example: seconds "8", size null, mock_response set gives only seconds.
    proof: [option-tests, oracle]
  - text: >-
      A loose keyword beats a named argument of the same name, and a flat entry from extra_body beats both.
      Example: size "720x1280" named, size "1080x1920" loose, extra_body size "480x854" gives size "480x854".
    proof: [option-tests, oracle]
  - text: >-
      extra_body from the top level and from the loose keywords are merged with the loose one winning, nulls skipped,
      owned names removed, and the result is stored under extra_body and also flat.
    proof: [option-tests, oracle]
  - text: >-
      The timeout option is removed last and the loose-keyword map loses its extra_body entry as a side effect.
    proof: [option-tests]
  - text: >-
      provider_request_params passes drop_params from CoreSettings, lets a non-empty map extra_body override mapped keys,
      removes extra_body from the result, and ignores an empty or non-map extra_body.
    proof: [option-tests, oracle]
  - text: >-
      video_generation returns a VideoObject built from mock_response (string or map) before any provider lookup or logging.
    proof: [call-tests, oracle]
  - text: >-
      video_generation resolves the provider with model "sora-2" when model is none, fails with
      "video generation is not supported for <provider>" when the selector returns none, and sets call type create_video.
    proof: [call-tests]
  - text: >-
      The handler gets timeout `timeout or request_timeout`, the original extra_body argument, the client keyword and
      the async flag; extra_query is not forwarded.
    proof: [call-tests]
  - text: >-
      avideo_generation infers the provider from model or "sora-2" with api_base always none, runs the sync path with the
      caller's context, and maps errors through exception_type with the original model.
    proof: [call-tests]
checks:
  optional: []
  commands:
    - id: option-tests
      why: the option projection or the provider mapping tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_generation_call::options::/) - test(/replays_the_/)'
    - id: call-tests
      why: the generation call tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_generation_call::call::/) - test(/replays_the_/)'
    - id: helper-python
      why: the b3338 helper adapter is missing or strict Python checking fails
      run: test -f tools/oracle/helpers/b3338.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/helpers/core/video-generation-call/options-drop-null-and-owned.yaml
  - tools/oracle/cases/helpers/core/video-generation-call/options-loose-keyword-beats-named.yaml
  - tools/oracle/cases/helpers/core/video-generation-call/options-extra-body-merge-flat.yaml
  - tools/oracle/cases/helpers/core/video-generation-call/options-timeout-removed.yaml
  - tools/oracle/cases/helpers/core/video-generation-call/provider-params-extra-body-override.yaml
  - tools/oracle/cases/helpers/core/video-generation-call/mock-response-string.yaml
deviations:
  - what: Python's typing overloads for video_generation are not ported; Rust has separate sync and async entry points.
    why: The overloads only describe the return type for the avideo_generation flag and change no behavior.
  - what: Worker-thread execution with a copied contextvars context is replaced by B198's explicit call context passed to the sync path.
    why: betterlite keeps no ContextVars; the context is a value the caller passes.
out_of_scope:
  - "The @client wrapper that creates litellm_logging_obj, fills litellm_call_id and applies caching and retries belongs to the SDK wrapper tasks; this task receives the logging object as an argument."
  - "video_content, video_remix, video_list, video_status, character, edit and extension calls in litellm/videos/main.py belong to B3339, B3340, B3341 and B3342."
  - "filter_out_litellm_params itself belongs to B5362; this task applies B2228's is_litellm_owned_kwarg."
  - "The three request paths, HTTP send and response conversion in video_generation_handler belong to B3333."
  - "ProviderConfigManager.get_provider_video_config belongs to B3332, and each provider's map_openai_params to its provider task."
  - "litellm/videos/__init__.py re-exports are not code to port; module wiring belongs to B093."
pitfalls:
  - A loose keyword and a named argument with the same name both land in the options and the loose one wins, because cleaned_kwargs is spread after base_params.
  - extra_body entries are copied flat into the options after the other merges, so they beat named and loose values; the mapped result then also takes extra_body again and drops the extra_body key.
  - get_requested_video_generation_optional_param pops extra_body out of the caller's loose-keyword map, so the logging update that follows sees kwargs without extra_body.
  - extra_headers and extra_query pass step 1 (they are not owned names), so they appear in the options as ordinary entries as well as being used elsewhere.
  - mock_response is checked after the logging object is popped but before the provider lookup, and a sync call with async_call true still returns the VideoObject directly, so the async caller must accept both a value and a future.
  - avideo_generation reads api_base from its own locals, which never contain it, so a loose api_base does not influence provider inference there (it still reaches GenericLiteLLMParams in the sync path).
  - The timeout argument defaults to 600 but the handler gets `timeout or DEFAULT_REQUEST_TIMEOUT`, so 0 and none become 6000 seconds (REQUEST_TIMEOUT env var), not 600.
  - The sync path passes the original extra_body argument to the handler, not the merged map from the options.
  - The error text for an unknown provider is "video generation is not supported for <provider>", with the resolved provider string and no model.
  - The exception model is `model or "sora-2"` in the sync path but the raw model (possibly none) in the async path.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
