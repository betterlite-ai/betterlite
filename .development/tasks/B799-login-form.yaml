id: B799
title: Local UI login form and credential hint
description: >-
  Implement login_form in betterlite-server from build_ui_login_form (ui_login.py L14-L278) and
  should_hide_default_credentials_hint (default_credentials_hint.py L5-L10). Retain the MIT form,
  styling, inline SVG, required username/password fields, autocomplete=username/current-password,
  Login submit button and show-password checkbox toggling the input type between password and text.
  Rebrand visible LiteLLM product text to betterlite. The hint still explains admin, MASTER_KEY and
  UI credential/SSO configuration, and keeps the documentation link. This is rendering, not credential
  verification: B899 accepts POST /login and B788 authenticates it; neither is called by this helper.

  At initialization, read PROXY_BASE_URL and SERVER_ROOT_PATH with empty-string defaults. The form
  action concatenates base + nonempty root + /login literally; do not normalize double slashes.
  The new-login link instead calls B124.get_custom_url("", "ui/login") once at initialization,
  preserving its join_paths/root selection. show_deprecation_banner and the renderer argument
  hide_default_credentials_hint both default false. The banner appears only for the first argument
  and contains the new-login link. The helper hides the hint if LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT
  (default "false") lowercases to exactly "true", OR general_settings.hide_default_credentials_hint
  is the boolean True, OR UI_PASSWORD is nonempty. Empty UI_PASSWORD does not hide it; " TRUE " and
  "1" in the environment are false, and a string "true" in general_settings is not boolean True.
  A false explicit setting cannot override either true environment branch. Never render UI_PASSWORD.

  Add typed config bindings with named loader tests below and seeds in B002's config_yaml corpus.
  These string reads have no parse exception or invalid_value_fallback. No new byte decoder is added.
  Register login_form under B856 Management::models; the Python adapter invokes only these pure
  rendering/policy helpers, with isolated environment/module initialization for each case. Compare
  the DOM form action, link, field attributes, hint/banner presence, password-toggle script and
  retained style literals. Ignore only the explicitly rebranded text nodes, not the entire HTML.
  Native tests prove context-correct quoted-attribute/text escaping of configured URLs; this form
  has no interpolated JSON, JWT claims or textContent assignments to port. No HTTP route or auth
  rejection belongs to this task.

  The owned 244 nonblank, noncomment lines are mostly retained HTML/CSS. Budget 245 renderer/policy,
  180 tests, 75 oracle adapters, 55 config and 35 wiring lines, 590 within 625. Keep domain Rust
  modules below 300 lines and reuse the existing helper/config decoders and fuzz workspaces.
scope:
  paths:
    - crates/betterlite-server/src/login_form.rs
    - crates/betterlite-server/src/login_form/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/src/helpers/server/login_form.rs
    - tools/oracle/src/helpers/server/login_form/**
    - tools/oracle/helpers/login_form.py
    - tools/oracle/helpers/login_form/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/login-form/**
    - tools/oracle/fuzz/corpus/helper_case/login-form-*
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/fuzz/corpus/config_yaml/login-form-*
    - crates/betterlite-config/src/sections/login_form.rs
    - crates/betterlite-config/src/sections/login_form/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/ui_login.py#L6-L278
    why: Own initialization URL reads and the complete retained form renderer.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/default_credentials_hint.py#L5-L10
    why: Exact hint predicate, setting identity test and environment defaults.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8287-L8347
    why: B124 owns join_paths, get_custom_url and get_proxy_base_url used for the banner link.
dod:
  - text: 'Renderer tests default_form, banner_link, hidden_hint, form_fields, toggle_password and
      retained_styles compare source markup contracts. Native tests rebranded_login and escaped_urls
      prove the two declared differences without suppressing unrelated DOM comparisons.'
    proof: [behavior-tests]
  - text: 'Config loader tests empty_url_defaults, raw_url_concatenation, nonempty_password,
      empty_password, env_true_casefold, env_whitespace_false, env_numeric_false,
      literal_boolean_only and hide_sources_or exercise B002 and then the production helper.'
    proof: [config-tests, config-corpus]
  - text: The pure Python renderer and native operation agree on retained fields, hint decisions and URLs.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Renderer and deviation assertions must exist and pass.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^login_form::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: The named environment and general_settings bindings must reach the renderer.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::login_form::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The independent helper adapter must exist and pass strict checking.
      run: test -f tools/oracle/helpers/login_form.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Require a newly added login_form operation seed before replaying the shared decoder corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/login-form-*")" && grep -rlq "login_form" tools/oracle/fuzz/corpus/helper_case/login-form-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-corpus
      why: A new general_settings hint seed and the production configuration decoder must pass.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/login-form-*")" && grep -rlq "hide_default_credentials_hint" crates/betterlite-config/fuzz/corpus/config_yaml/login-form-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/login-form/default-form.yaml
  - tools/oracle/cases/helpers/login-form/banner-and-hint.yaml
  - tools/oracle/cases/helpers/login-form/form-fields-toggle-styles.yaml
  - tools/oracle/cases/helpers/login-form/url-concatenation.yaml
  - tools/oracle/cases/helpers/login-form/password-empty-nonempty.yaml
  - tools/oracle/cases/helpers/login-form/env-boolean-spelling.yaml
  - tools/oracle/cases/helpers/login-form/setting-identity-and-or.yaml
deviations:
  - what: Login product text says betterlite and configured URL attributes are HTML-escaped.
    why: README retains and rebrands the MIT UI; a quote in configuration must not inject markup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/ui_login.py#L14-L278
out_of_scope:
  - B124 supplies get_custom_url and its root-path collaborators; B899 registers login handlers and
    B788 owns password authentication. Neither covered form file has another function.
pitfalls:
  - 'The oracle helper for this task is pre-registered as login_form in the server group. Replace the stub Op in tools/oracle/src/helpers/server/login_form.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/login_form.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The form action uses literal concatenation while the banner URL uses join_paths, so slash behavior differs.
  - A present but empty UI_PASSWORD must still display the default-credential hint.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
