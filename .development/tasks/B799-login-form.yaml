id: B799
title: Local UI login form and credential hint
description: >-
  Render the retained MIT UI login form with escaped base/root paths and configured visibility. Preserve
  PROXY_BASE_URL and SERVER_ROOT_PATH defaults empty, hide_default_credentials_hint=false and LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT=false;
  UI_PASSWORD presence suppresses the default-credential hint. Rebrand product text only, serve assets
  locally and route form submissions through PasswordLogin. Native-only deviation tests (not oracle equality
  cases): escaped-form-values. Escape HTML text and quoted attributes in their own context. For JSON embedded
  inside script, use a serializer plus escaping of <, >, &, U+2028 and U+2029 so </script> in a claim
  cannot end the element; HTML entities are not a substitute for JSON escaping. Keep existing DOM textContent
  assignment. Native renderer tests must include closing-script and quoted-attribute payloads.


  Build the production login_form module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/html_forms/ui_login.py:
  build_ui_login_form (L14-L278; 238 source lines). litellm/proxy/common_utils/html_forms/default_credentials_hint.py:
  should_hide_default_credentials_hint (L5-L10; 6 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.hide_default_credentials_hint=False;
  UI_PASSWORD=None; LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT='false'; hide_default_credentials_hint=False.


  Add the login_form operation under B856 Management::models. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a login-form-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::login_form::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 244 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  244 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 534 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_retained_mit_login_jwt_template_branding_says_betterlite_and_interpola.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
scope:
  paths:
    - crates/betterlite-server/src/login_form.rs
    - crates/betterlite-server/src/login_form/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/src/helpers/login_form.rs
    - tools/oracle/src/helpers/login_form/**
    - tools/oracle/helpers/login_form.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/models.rs
    - tools/oracle/helpers/management/models.py
    - tools/oracle/cases/helpers/login-form/**
    - tools/oracle/fuzz/corpus/helper_case/login-form-*
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/config.rs
    - crates/betterlite-config/src/login_form.rs
    - crates/betterlite-config/src/login_form/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/login-form-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/ui_login.py#L1-L278
    why: Pinned implementation and exact ownership boundary for login_form.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/default_credentials_hint.py#L1-L10
    why: Pinned implementation and exact ownership boundary for login_form.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/ui_login.py#L14-L278
    why: Own build_ui_login_form; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/default_credentials_hint.py#L5-L10
    why: Own should_hide_default_credentials_hint; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/default_credentials_hint.py#L8-L10
    why: general_settings.hide_default_credentials_hint default and read site.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/default_credentials_hint.py#L9-L10
    why: UI_PASSWORD default and read site.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/default_credentials_hint.py#L7-L10
    why: LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT default and read site.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/ui_login.py#L1-L6
    why: hide_default_credentials_hint default and read site.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: default_hint, configured_password_hides_hint,
      explicit_hide_hint, root_path, login_submit.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_retained_mit_login_jwt_template_branding_says_betterlite_and_interpola.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^login_form::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/login_form.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/login-form-*")"
        && grep -rlq "login_form" tools/oracle/fuzz/corpus/helper_case/login-form-* && cargo nextest run
        --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^login_form::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/login-form-*")"
        && grep -rlq "hide_default_credentials_hint" crates/betterlite-config/fuzz/corpus/config_yaml/login-form-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/login-form/default-hint.yaml
  - tools/oracle/cases/helpers/login-form/configured-password-hides-hint.yaml
  - tools/oracle/cases/helpers/login-form/explicit-hide-hint.yaml
  - tools/oracle/cases/helpers/login-form/root-path.yaml
  - tools/oracle/cases/helpers/login-form/login-submit.yaml
deviations:
  - what: Retained MIT login/JWT template branding says betterlite, and interpolated identity/configuration
      text uses context-specific HTML/attribute escaping and script-safe JSON serialization.
    why: README Decisions retains and rebrands the MIT UI; unescaped caller text must not become executable
      markup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/html_forms/ui_login.py#L1-L278
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - UI_PASSWORD presence hides the default-credential hint independently of the explicit hide switch.
budget:
  max_changed_lines: 550
  max_new_expects: 0
review_level: security
