id: B684
title: Azure base chat parameter and content policy
description: >-
  Port AzureOpenAIConfig base parameter mapping, API-version response-format gates, message/tool sanitation and
  provider header/region projections. GPT-5 and o-series extensions in B532 reuse this policy.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/chat/gpt_transformation.py:
  sanitized_tools_update L43-L53; AzureOpenAIConfig.__init__ L83-L99; AzureOpenAIConfig.get_config L102-L103; AzureOpenAIConfig.get_supported_openai_params
  L105-L137; AzureOpenAIConfig.requires_max_completion_tokens L140-L147; AzureOpenAIConfig._is_response_format_supported_model
  L149-L166; AzureOpenAIConfig._is_response_format_supported_api_version L168-L186; AzureOpenAIConfig.map_openai_params
  L188-L269; AzureOpenAIConfig.transform_request L271-L294; AzureOpenAIConfig.get_mapped_special_auth_params L314-L315;
  AzureOpenAIConfig.map_special_auth_params L317-L321; AzureOpenAIConfig.get_eu_regions L323-L327; AzureOpenAIConfig.get_us_regions
  L329-L344; AzureOpenAIConfig.get_error_class L346-L347;.


  Named case contracts: api_version_response_format: Native response_format support requires normalized model not
  containing gpt-3.5 (regex (\d)-(\d) -> \1.\2) and original model not containing gpt-35, plus API year>2024 or
  year=2024/month>=8. Empty/short API versions have no date gate; dates with at least three hyphen components parse
  year/month as integers here and can fail. Do not infer model capability from a catalog. Use B2214 JSON-tool emulation
  otherwise; unsupported empty schema silently adds nothing. max_completion_tokens: Any case-sensitive gpt-5 or
  gpt-6 substring or gpt5_series triggers max_tokens -> setdefault(max_completion_tokens,value), including gpt-5-chat
  models excluded from reasoning routing. Existing max_completion_tokens wins; nonmatching names retain max_tokens.
  Mapping order matters if the explicit completion field appears later. azure_message_content: With litellm.openai_system_messages_first
  default False, preserve order; when True call B219 ordering first. Then drop tool_reference parts, hoist tool
  images (B219), convert Azure tool/image/file messages (B182). Assemble model/messages, optional-parameter overlay
  and finally sanitized tools; optional model/messages can overwrite the generated fields. sanitized_tool_schema:
  A list-valued tools always produces a replacement tools list, including []; dictionaries use B178 tool_with_sanitized_parameters
  plus flatten_combinators_and_drop_non_python_regex_patterns, non-dictionaries remain unchanged. Non-list tools
  yields no update. Preserve input records and apply sanitized tools after other optional values. unsupported_param:
  Supported list is temperature,n,stream,stream_options,stop,max_tokens,max_completion_tokens,tools,tool_choice,presence_penalty,frequency_penalty,logit_bias,user,function_call,functions,tools,tool_choice,top_p,logprobs,top_logprobs,response_format,seed,extra_headers,parallel_tool_calls,prediction,modalities,audio,web_search_options,prompt_cache_key,store,
  including duplicate tools/tool_choice. Unknown names silently disappear; this mapper does not generically reject
  them. azure_tool_choice_date_gate: For a date with at least three components, compare year/month/day as STRINGS:
  before 2023-12-01 tool_choice raises UnsupportedParamsError status400 with the exact API-version-upgrade message
  at L232, unless either global or per-call drop_params is literal True, then omit silently. Invalid/short dates
  bypass this gate. Include 2023-2-01 to expose string comparison. azure_required_tool_choice: For tool_choice=required,
  only year==2024 and month string<=05 rejects/drops, using the exact L242 message containing litellm.drop_params=True,
  litellm_settings/drop_params:true and the Azure chat-completions reference. Version 2023-12-01 passes this second
  test despite the comment; 2024-06-01 passes. Empty/False values forward when otherwise allowed. azure_parameter_shapes:
  List tools extend existing optional tools instead of replacing; malformed existing non-list tools fails. A non-list
  tools value passes through the supported-name branch. Dict response_format uses B2214; non-dict response_format
  passes through without validation. Retain None values for supported names. azure_tool_choice_without_tools: During
  request assembly drop tool_choice unless optional tools or functions is truthy; []/None/empty mapping count absent,
  a truthy malformed value keeps choice. Sanitation still runs using the original optional tools value. azure_class_defaults:
  Constructor frequency_penalty,function_call,functions,logit_bias,max_tokens,n,presence_penalty,stop,temperature,top_p
  all default None and only non-None values update class configuration; do not infer numeric zero from docstrings.
  B2202 get_config supplies the inherited class projection. Public Python class-setting behavior belongs B159; native
  resolved configuration retains defaults and explicit values. azure_special_auth_regions: get_mapped_special_auth_params
  returns token->azure_ad_token; mapping overwrites only azure_ad_token when input key token exists, including None,
  retaining unrelated optional entries. EU prefixes exactly europe,sweden,switzerland,france,uk; US exactly us,eastus,eastus2,eastus2euap,eastus3,southcentralus,westus,westus2,westus3,westus4.
  azure_error_factory: get_error_class forwards message/status/headers to B673 AzureOpenAIError without rewrite.
  This helper assigns no new param or code.


  The tool_choice errors have type UnsupportedParamsError/status400 and inherit unset param/code from B184. Preserve
  the full literal messages in L232/L242, including newlines and URLs, in the named date-gate fixtures. Shared drop_params
  defaults False (B176 config policy) and openai_system_messages_first defaults False (B503 loader); use their lower
  config records. No new environment variables are read.


  The old-version tool_choice error message is Azure does not support 'tool_choice', for api_version={api_version}.
  Bump your API version to '2023-12-01-preview' or later. This parameter requires 'api_version="2023-12-01-preview"'
  or later. Azure API Reference: https://learn.microsoft.com/en-us/azure/ai-services/openai/reference#chat-completions.
  The required-choice message is Azure does not support '{value}' as a {param} param, for api_version={api_version}.
  To drop 'tool_choice=required' for calls with this Azure API version, set `litellm.drop_params=True` or for proxy:\n\n`litellm_settings:\n
  drop_params: true`\nAzure API Reference: https://learn.microsoft.com/en-us/azure/ai-services/openai/reference#chat-completions.
  The named date-gate/required-choice cases assert these exact messages; prose terminal punctuation is not part
  of the source URL.


  Implement crates/betterlite-azure/src/azure_chat_base_policy.rs with adjacent tests under azure_chat_base_policy/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_chat_base_policy in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_chat_base_policy_cases in betterlite-azure with these exact named cases (one per oracle
  file): api_version_response_format, max_completion_tokens, azure_message_content, sanitized_tool_schema, unsupported_param,
  azure_tool_choice_date_gate, azure_required_tool_choice, azure_parameter_shapes, azure_tool_choice_without_tools,
  azure_class_defaults, azure_special_auth_regions, azure_error_factory. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_chat_base_policy* using HelperCase: kind:
  helper and the externally tagged azure_chat_base_policy variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_chat_base_policy that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 229 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 315 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 750 planned, 750 maximum changed lines.
