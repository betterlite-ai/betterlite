id: B684
title: Azure base chat parameter and content policy
description: >-
  Port AzureOpenAIConfig base parameter mapping, API-version response-format gates, message/tool sanitation and
  provider header/region projections. GPT-5 and o-series extensions in B532 reuse this policy.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/chat/gpt_transformation.py:
  sanitized_tools_update L43-L53; AzureOpenAIConfig.__init__ L83-L99; AzureOpenAIConfig.get_config L102-L103; AzureOpenAIConfig.get_supported_openai_params
  L105-L137; AzureOpenAIConfig.requires_max_completion_tokens L140-L147; AzureOpenAIConfig._is_response_format_supported_model
  L149-L166; AzureOpenAIConfig._is_response_format_supported_api_version L168-L186; AzureOpenAIConfig.map_openai_params
  L188-L269; AzureOpenAIConfig.transform_request L271-L294; AzureOpenAIConfig.transform_response L296-L312; AzureOpenAIConfig.get_mapped_special_auth_params
  L314-L315; AzureOpenAIConfig.map_special_auth_params L317-L321; AzureOpenAIConfig.get_eu_regions L323-L327; AzureOpenAIConfig.get_us_regions
  L329-L344; AzureOpenAIConfig.get_error_class L346-L347; AzureOpenAIConfig.validate_environment L349-L361.


  Implement crates/betterlite-azure/src/azure_chat_base_policy.rs with adjacent tests under azure_chat_base_policy/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_chat_base_policy in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_chat_base_policy_cases in betterlite-azure with these exact named cases (one per oracle
  file): api_version_response_format, max_completion_tokens, azure_message_content, sanitized_tool_schema, unsupported_param.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_chat_base_policy* using HelperCase: kind:
  helper and the externally tagged azure_chat_base_policy variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_chat_base_policy that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 259 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 485 planned, 500 maximum changed lines.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - crates/betterlite-azure/src/azure_chat_base_policy.rs
  - crates/betterlite-azure/src/azure_chat_base_policy/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_chat_base_policy.rs
  - tools/oracle/src/helpers/azure_chat_base_policy/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_chat_base_policy.py
  - tools/oracle/cases/helpers/providers/azure-chat-base-policy/**
  - tools/oracle/fuzz/corpus/helper_case/azure_chat_base_policy*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/chat/gpt_transformation.py#L43-L53
  why: Own sanitized_tools_update. Other functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/chat/gpt_transformation.py#L83-L361
  why: >-
    Own AzureOpenAIConfig.__init__, AzureOpenAIConfig.get_config, AzureOpenAIConfig.get_supported_openai_params,
    AzureOpenAIConfig.requires_max_completion_tokens, AzureOpenAIConfig._is_response_format_supported_model, AzureOpenAIConfig._is_response_format_supported_api_version,
    AzureOpenAIConfig.map_openai_params, AzureOpenAIConfig.transform_request, AzureOpenAIConfig.transform_response,
    AzureOpenAIConfig.get_mapped_special_auth_params, AzureOpenAIConfig.map_special_auth_params, AzureOpenAIConfig.get_eu_regions,
    AzureOpenAIConfig.get_us_regions, AzureOpenAIConfig.get_error_class, AzureOpenAIConfig.validate_environment.
    Other functions in this file remain with the owners listed below.
dod:
- text: >-
    api version response format: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-base-policy/api-version-response-format.yaml.
  proof:
  - case-api-version-response-format
  - oracle
  - helper-python
- text: >-
    max completion tokens: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-base-policy/max-completion-tokens.yaml.
  proof:
  - case-max-completion-tokens
  - oracle
  - helper-python
- text: >-
    azure message content: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-base-policy/azure-message-content.yaml.
  proof:
  - case-azure-message-content
  - oracle
  - helper-python
- text: >-
    sanitized tool schema: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-base-policy/sanitized-tool-schema.yaml.
  proof:
  - case-sanitized-tool-schema
  - oracle
  - helper-python
- text: 'unsupported param: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-base-policy/unsupported-param.yaml.'
  proof:
  - case-unsupported-param
  - oracle
  - helper-python
- text: New azure_chat_base_policy seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-api-version-response-format
    why: The api-version-response-format behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_chat_base_policy_cases::case_[0-9]+_api_version_response_format$/)'
  - id: case-max-completion-tokens
    why: The max-completion-tokens behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_chat_base_policy_cases::case_[0-9]+_max_completion_tokens$/)'
  - id: case-azure-message-content
    why: The azure-message-content behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_chat_base_policy_cases::case_[0-9]+_azure_message_content$/)'
  - id: case-sanitized-tool-schema
    why: The sanitized-tool-schema behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_chat_base_policy_cases::case_[0-9]+_sanitized_tool_schema$/)'
  - id: case-unsupported-param
    why: The unsupported-param behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_chat_base_policy_cases::case_[0-9]+_unsupported_param$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_chat_base_policy.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_chat_base_policy*")"
      && grep -lq 'azure_chat_base_policy' tools/oracle/fuzz/corpus/helper_case/azure_chat_base_policy* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_chat_base_policy$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/azure-chat-base-policy/api-version-response-format.yaml
- tools/oracle/cases/helpers/providers/azure-chat-base-policy/max-completion-tokens.yaml
- tools/oracle/cases/helpers/providers/azure-chat-base-policy/azure-message-content.yaml
- tools/oracle/cases/helpers/providers/azure-chat-base-policy/sanitized-tool-schema.yaml
- tools/oracle/cases/helpers/providers/azure-chat-base-policy/unsupported-param.yaml
deviations: []
out_of_scope: []
