checks:
  optional:
  - mutants
  commands:
  - id: case-bedrock-embedding-dispatch
    why: Install B631 text and image embedding operations and B632 asynchronous embedding job calls. Exercise sequential
      text inputs (stop on the first failed request), Titan G1/V2 float and binary vectors, Cohere input_type, Nova
      text/image/video and Marengo 2.7/3 media payloads through their installed leaves. Preserve per-input indices,
      usage and original provider failures; asynchronous job status lookup does not read S3 or poll.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_embedding_dispatch$/)'
  - id: case-bedrock-rerank-dispatch
    why: Install B639 rerank, retaining Bedrock agent-runtime service signing, numbered documents and original result
      indices, top_n-or-document-count and return_documents behavior. Assert the result shape and the leaf error,
      not just the selected enum.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_rerank_dispatch$/)'
  - id: case-bedrock-count-dispatch
    why: Install B641 CountTokens with B640 request conversion. Missing/empty messages or an unavailable handler
      yields None; transport/parse failures yield TokenCountResponse.error=True. No local tokenizer fallback is
      added by this dispatcher.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_count_dispatch$/)'
  - id: case-bedrock-transcription-dispatch
    why: Install B642 native Nova transcription with typed file/multipart inputs, region/credential selection and
      language/duration usage projection. Python oracle captures the pinned NO_PYTHON binding seam; separate Rust
      fixture transport tests verify the actual native HTTP request and decoded reply. Keep B642 local URL/model
      policy, which differs from general Bedrock policy.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_transcription_dispatch$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_other_endpoints.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_other_endpoints*")"
      && grep -lq 'bedrock_other_other_endpoints' tools/oracle/fuzz/corpus/helper_case/bedrock_other_other_endpoints*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_other_endpoints$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-bedrock-image-composition
    why: Install B679 generation and edit composition alongside the non-image operations, and exercise one Canvas
      generation and edit round trip through the shared operation enum. Preserve base64 results, first-image behavior
      and leaf provider errors without duplicate route registration.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_image_composition$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_secret_safe_failure$/)'
