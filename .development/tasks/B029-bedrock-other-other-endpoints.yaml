id: B029
title: Bedrock non-chat operation composition
description: >-
  Install Bedrock embeddings, rerank, CountTokens and transcription in the B678 dispatcher. B679 installs images
  and edits; exercise each remaining family through a fixture transport and preserve exact leaf errors.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Implement crates/betterlite-provider/src/bedrock_other_dispatch.rs with adjacent tests under bedrock_other_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation bedrock_other_other_endpoints in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_other_dispatch_cases in betterlite-provider with these exact named cases (one per
  oracle file): bedrock_embedding_dispatch, bedrock_rerank_dispatch, bedrock_count_dispatch, bedrock_transcription_dispatch.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_other_endpoints* using HelperCase:
  kind: helper and the externally tagged bedrock_other_other_endpoints variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_other_endpoints that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 145 production lines, 81 behavior/config-test lines, 101 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 352 planned, 400 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
scope:
  paths:
  - crates/betterlite-provider/Cargo.toml
  - crates/betterlite-provider/src/lib.rs
  - crates/betterlite-provider/src/error.rs
  - crates/betterlite-provider/src/bedrock_other_dispatch.rs
  - crates/betterlite-provider/src/bedrock_other_dispatch/**
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-provider/src/provider.rs
  - crates/betterlite-provider/src/operation.rs
  - crates/betterlite-core/src/dispatch.rs
  - crates/betterlite-core/src/operation.rs
  - crates/betterlite-core/Cargo.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_other_other_endpoints.rs
  - tools/oracle/src/helpers/bedrock_other_other_endpoints/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_other_other_endpoints.py
  - tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_other_endpoints*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L6775-L6797
  why: Bedrock embeddings dispatch.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rerank_api/main.py#L372-L398
  why: Bedrock rerank dispatch.
dod:
- text: >-
    bedrock embedding dispatch: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-embedding-dispatch.yaml.
  proof:
  - case-bedrock-embedding-dispatch
  - oracle
  - helper-python
- text: >-
    bedrock rerank dispatch: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-rerank-dispatch.yaml.
  proof:
  - case-bedrock-rerank-dispatch
  - oracle
  - helper-python
- text: >-
    bedrock count dispatch: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-count-dispatch.yaml.
  proof:
  - case-bedrock-count-dispatch
  - oracle
  - helper-python
- text: >-
    bedrock transcription dispatch: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-transcription-dispatch.yaml.
  proof:
  - case-bedrock-transcription-dispatch
  - oracle
  - helper-python
- text: New bedrock_other_other_endpoints seeds parse as the intended call variant and replay through the shared
    production parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-bedrock-embedding-dispatch
    why: The bedrock-embedding-dispatch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_embedding_dispatch$/)'
  - id: case-bedrock-rerank-dispatch
    why: The bedrock-rerank-dispatch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_rerank_dispatch$/)'
  - id: case-bedrock-count-dispatch
    why: The bedrock-count-dispatch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_count_dispatch$/)'
  - id: case-bedrock-transcription-dispatch
    why: The bedrock-transcription-dispatch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_other_dispatch_cases::case_[0-9]+_bedrock_transcription_dispatch$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_other_endpoints.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_other_endpoints*")"
      && grep -lq 'bedrock_other_other_endpoints' tools/oracle/fuzz/corpus/helper_case/bedrock_other_other_endpoints*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_other_endpoints$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-embedding-dispatch.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-rerank-dispatch.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-count-dispatch.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-other-endpoints/bedrock-transcription-dispatch.yaml
deviations: []
out_of_scope:
- >-
  B080-B099 own public endpoint routes and resource lifecycles; this task installs typed provider dispatch only.
  B157-B166 own Python SDK facades, callable hooks and SDK module globals.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Keep opaque provider job and usage metadata available to endpoint tasks, without implementing proxy storage or
  asynchronous batch scheduler.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: standard
