id: B029
title: Bedrock non-chat operation composition
description: >-
  Install Bedrock embeddings, rerank, CountTokens and transcription in the B678 dispatcher. B679 installs images
  and edits; exercise each remaining family through a fixture transport and preserve exact leaf errors.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Named case contracts: bedrock_embedding_dispatch: Install B631 text and image embedding operations and B632 asynchronous
  embedding job calls. Exercise sequential text inputs (stop on the first failed request), Titan G1/V2 float and
  binary vectors, Cohere input_type, Nova text/image/video and Marengo 2.7/3 media payloads through their installed
  leaves. Preserve per-input indices, usage and original provider failures; asynchronous job status lookup does
  not read S3 or poll. bedrock_rerank_dispatch: Install B639 rerank, retaining Bedrock agent-runtime service signing,
  numbered documents and original result indices, top_n-or-document-count and return_documents behavior. Assert
  the result shape and the leaf error, not just the selected enum. bedrock_count_dispatch: Install B641 CountTokens
  with B640 request conversion. Missing/empty messages or an unavailable handler yields None; transport/parse failures
  yield TokenCountResponse.error=True. No local tokenizer fallback is added by this dispatcher. bedrock_transcription_dispatch:
  Install B642 native Nova transcription with typed file/multipart inputs, region/credential selection and language/duration
  usage projection. Python oracle captures the pinned NO_PYTHON binding seam; separate Rust fixture transport tests
  verify the actual native HTTP request and decoded reply. Keep B642 local URL/model policy, which differs from
  general Bedrock policy. bedrock_image_composition: Install B679 generation and edit composition alongside the
  non-image operations, and exercise one Canvas generation and edit round trip through the shared operation enum.
  Preserve base64 results, first-image behavior and leaf provider errors without duplicate route registration.


  Write standalone Rust test bedrock_other_dispatch_credential_identity_isolation in betterlite-provider: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test bedrock_other_dispatch_secret_safe_failure in betterlite-provider: Debug and owned
  failure paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-provider/src/bedrock_other_dispatch.rs with adjacent tests under bedrock_other_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  leaf crates remain below this dispatcher and never import it. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_other_dispatch_cases in betterlite-provider with these exact named cases (one per
  oracle file): bedrock_embedding_dispatch, bedrock_rerank_dispatch, bedrock_count_dispatch, bedrock_transcription_dispatch,
  bedrock_image_composition. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_other_endpoints* using HelperCase:
  kind: helper and the externally tagged bedrock_other_other_endpoints variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_other_endpoints that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 175 production lines, 240 behavior/config-test lines, 135 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 585 planned, 600 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
