deviations: []
out_of_scope:
- B080-B099 own public endpoint routes and resource lifecycles; this task installs typed provider dispatch only.
  B157-B166 own Python SDK facades, callable hooks and SDK module globals.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_other_other_endpoints in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/bedrock_other_other_endpoints.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_other_other_endpoints.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Embedding inputs run sequentially, so a failure prevents later upstream calls.
- CountTokens failures do not trigger a local tokenizer in this composition.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
