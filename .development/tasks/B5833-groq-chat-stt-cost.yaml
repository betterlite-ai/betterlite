dod:
  - text: The Groq key and base, the supported option list with its two independent capability lookups, and the compound-model rule match GroqChatConfig.
    proof: [groq-chat-tests, helper-python, groq-cases]
  - text: Response formats become the json_tool_call workaround, pass through natively, or fail with the tools conflict error exactly as LiteLLM does, and fake_stream follows response_format.
    proof: [groq-chat-tests, helper-python, groq-cases]
  - text: web_search_options adds one browser_search tool for a non-compound model without duplicating it, and max_completion_tokens becomes max_tokens.
    proof: [groq-chat-tests, helper-python, groq-cases]
  - text: Assistant messages lose their null members before the shared message transform.
    proof: [groq-chat-tests, groq-cases]
  - text: Replies get a mapped service tier and browser search and open counts from executed_tools, and a malformed list bills nothing.
    proof: [groq-chat-tests, helper-python, groq-cases]
  - text: Stream error chunks fail with the chunk's own code and message, and delta.reasoning becomes reasoning_content.
    proof: [groq-chat-tests, groq-cases]
  - text: Transcription options, response formats and the unsupported-format error match GroqSTTConfig.
    proof: [groq-stt-tests, helper-python, groq-cases]
  - text: Search and browser-open charges are exact decimals and zero without server tool use.
    proof: [groq-cost-tests, helper-python, groq-cases]
  - text: The new oracle cases exist and call this task's helper.
    proof: [groq-cases]
checks:
  optional: [mutants]
  commands:
    - id: groq-chat-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^groq_chat::/)'
      why: A plain OpenAI chat passthrough has no tool workaround for response_format, no browser_search tool and no executed_tools counts.
    - id: groq-stt-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^groq_stt::/)'
      why: Without these the four-option list, the three formats and the drop-or-fail rule are unchecked.
    - id: groq-cost-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^groq_cost::/)'
      why: A generic token calculator never charges the 0.001 browser open or the medium search rate.
    - id: helper-python
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5833)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5833 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5833/pyrightconfig.json
      why: The Python adapter must call the pinned Groq classes and cost function directly.
    - id: groq-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/groq-chat)" && /usr/bin/grep -rlE '^  b5833:' tools/oracle/cases/helpers/groq-chat
      why: Without cases that call the b5833 helper nothing compares these transforms with LiteLLM.
