  - tools/oracle/cases/helpers/groq-chat/supported-params-capabilities.yaml
  - tools/oracle/cases/helpers/groq-chat/supported-params-compound-model.yaml
  - tools/oracle/cases/helpers/groq-chat/supported-params-reasoning-lookup-failure.yaml
  - tools/oracle/cases/helpers/groq-chat/assistant-null-members.yaml
  - tools/oracle/cases/helpers/groq-chat/response-format-tool-workaround.yaml
