deviations:
  - what: Costs are exact Decimal values, so web_search_cost can differ from LiteLLM's binary float in the last digits.
    why: B204 forbids binary floating point in prices. Oracle cases compare the two as decimal numbers rounded to 12 places.
  - what: A stream error chunk whose code is missing or not an integer gets status 500. LiteLLM passes the raw value on.
    why: Statuses are integers in betterlite and 500 is what the base chunk parser uses for the same input.
  - what: The Groq STT drop_params global is an explicit bool argument, not read from a process global.
    why: Provider modules take settings from the caller, so tests need no process state.
out_of_scope:
  - B041 owns _complete_groq in litellm/main.py (L2111-L2170) including litellm.api_base, litellm.groq_key and the GroqChatConfig.get_config merge, registering these modules in dispatch and the HTTP oracle cases.
  - B668, B503, B504 and B1425 own every inherited method (base supported list, base option mapping, content transform, reply conversion, base chunk parser, OpenAI-like reply cleanup). B2202 owns _add_tools_to_optional_params.
  - B2221 owns supports_web_search, supports_reasoning and supports_response_schema. Their catalog reads are not repeated here.
  - B010 owns iterator framing, DONE handling and close semantics. get_model_response_iterator is only a parser choice that B010 and B041 wire.
  - B1428 owns the OpenAI-like request execution and the fake-stream replay that reads optional_params.fake_stream.
  - litellm/llms/groq/chat/handler.py (GroqChatCompletion) is out of scope, no caller at the pin. main.py L303 builds groq_chat_completions and nothing calls it; Groq requests run through base_llm_http_handler with GroqChatConfig, and the null-stripping in its completion() is already covered by transform_messages above.
  - B5362 owns get_optional_params_transcription (utils.py L3571) that calls the STT config. B1686 and B1687 own the cost dispatch in litellm/llms/__init__.py (L74-L78) that calls groq_cost.
  - GroqChatConfig.__init__, get_config and the matching GroqSTTConfig members only hold Python SDK class-level defaults and have no yaml surface.
pitfalls:
  - The Groq signature of map_openai_params defaults replace_max_completion_tokens_with_max_tokens to False with the comment that Groq supports max_completion_tokens, but the call to super passes only four arguments, so the OpenAI-like default of true wins and max_tokens is what goes out.
  - response_format is removed from non_default_params only when the tool workaround is used, and the removal mutates the caller's map. A native-schema model, a plain json_object format and a non-object value all leave it in place.
  - 'fake_stream is set from response_format before the schema is looked at, so a json_object response_format also forces fake streaming even though no tool is added.'
  - The workaround overwrites optional_params.tools with a single entry. It does not append.
  - web_search_options is popped before the base mapper runs, so it is never copied even on a model that lists it, and it is dropped silently when the value is null.
  - A non-compound model gets the browser_search tool even when web_search_options is an empty object, and a compound model never gets it.
  - The supported-list web search lookup is unguarded while the reasoning lookup is guarded, so only a reasoning failure is swallowed.
  - A bad executed_tools shape anywhere in any choice voids the whole count, not just that choice, and the reply is still returned.
  - web_search_requests is set to the search count even when it is 0 and only browser.open ran, and "browser.search" and "browser_search" both count as searches.
  - Service tier is replaced by "auto" for any value outside auto, default and flex, and for null, so a reply that had none now reports "auto".
  - The Groq stream error check runs before the base parser, so an error chunk with a non-integer code is not clamped to the 400 to 599 range the base parser applies.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
