id: B5833
title: Groq chat options, browser-search billing, transcription options and search cost
description: >-
  Build the Groq provider's pure transforms in betterlite-openai as three modules: groq_chat
  (litellm/llms/groq/chat/transformation.py), groq_stt (litellm/llms/groq/stt/transformation.py) and groq_cost
  (litellm/llms/groq/cost_calculator.py). No network call and no config section: the API key and base URL are plain
  arguments the caller has already read. GroqChatConfig sits on the OpenAI-like chat config, so this task calls the shared
  pieces and adds only what Groq overrides: B668 for the base supported list and option mapping and OpenAiError, B503 for
  the message transform, B504 for reply conversion and the stream chunk parser, B1425 for the OpenAI-like option mapper
  (it swaps max_completion_tokens for max_tokens) and reply conversion, and B2202 base_helpers::append_tools for
  _add_tools_to_optional_params. Reach them through the same injected calls B6080 and B6120 use, so this module never
  imports their internals. An empty string counts as unset in every "a or b" chain below, as in LiteLLM.


  groq_chat, credentials. get_openai_compatible_provider_info(api_base, api_key) returns (api_base or GROQ_API_BASE or
  "https://api.groq.com/openai/v1", api_key or GROQ_API_KEY). GROQ_API_BASE and GROQ_API_KEY arrive as plain optional
  arguments. The key can stay None. The longer chain in main.py (litellm.api_base, litellm.groq_key) is B041's.


  groq_chat, supported options. get_supported_openai_params(model) starts from B668's base list and removes
  "max_retries". It removes "web_search_options" unless the model is a compound model or the web search capability lookup
  says yes for the pair (model, "groq"). A compound model is one whose name, after removing one leading "groq/", is
  "compound" or "compound-mini". Last, "reasoning_effort" is appended when the reasoning lookup says yes. The base list
  never holds reasoning_effort, so it appears at most once, at the end. A failed reasoning lookup is logged at debug and
  counts as no. The web search lookup has no guard, so its error propagates. The lookups come in through a small trait the
  caller implements (B2221 owns supports_web_search, supports_reasoning and supports_response_schema); do not read the
  catalog from inside this module.


  groq_chat, messages. transform_messages(messages, model) rebuilds every assistant message as a new object holding only
  its top-level members that are not null (so an assistant tool-call message loses a null "content" key, and nested nulls
  stay), leaves every other role untouched, then hands the list to the shared message transform (B503). It is the hook
  B503's transform_request calls, so the Groq tweak runs on each chat request.


  groq_chat, options. map_openai_params(non_default_params, optional_params, model, drop_params) keeps LiteLLM's order.
  (1) Read response_format from non_default_params. When it is not null, write fake_stream = true into optional_params,
  whether or not the call streams. (2) When response_format is an object, take its schema from "response_schema" if that key
  is present, else from "json_schema" then "schema". When a schema was found and the (model, "groq") response-schema lookup
  says no: if non_default_params has a "tools" key (even null) fail with a 400 BadRequestError for model and provider
  groq, text "Groq model '{model}' does not support native structured outputs. LiteLLM uses a tool-calling workaround for
  structured outputs on this model, which is incompatible with user-provided tools. Either use a model that supports
  native structured outputs (e.g., gpt-oss-120b, llama-4, kimi-k2), or remove the tools parameter. See:
  https://console.groq.com/docs/structured-outputs#supported-models"; otherwise set optional_params.tools to exactly one
  tool {type: function, function: {name: json_tool_call, parameters: schema}} (replacing any tools there), tool_choice to
  {type: function, function: {name: json_tool_call}} and json_mode to true, and remove response_format from
  non_default_params. A model with native schema support keeps response_format and it reaches the base mapping. (3) Remove
  web_search_options from non_default_params and remember its value. (4) Run the OpenAI-like mapper with the Groq
  signature's default left alone: LiteLLM's call passes only four arguments, so the OpenAI-like default (replace
  max_completion_tokens with max_tokens) applies and max_completion_tokens never reaches Groq. (5) When web_search_options was
  not present or null, return. When it is non-empty, log at info "Groq web search enabled; ignoring unsupported
  web_search_options fields: {sorted keys}". When the model is a compound model, return. Otherwise add the tool
  {type: browser_search} through append_tools unless a tool in optional_params.tools already has type browser_search. An
  empty object still adds the tool, only the log line is skipped. should_fake_stream(optional_params) is true when
  response_format is not null. The Python class also has a no-op get_config and a constructor that sets class attributes;
  those serve only the Python SDK and are not built.


  groq_chat, reply. transform_response runs the OpenAI-like reply conversion (B1425, then B504), then sets service_tier to
  "auto" when the reply's value is null or not one of "auto", "default", "flex", else keeps it. After that it counts browser
  actions. For every choice in order, read message.executed_tools from the raw reply JSON (the same body B1425 converted).
  Each entry is an object with optional string name and string type; the action is name when truthy, else type. An entry
  that is not an object, or a name or type that is neither a string nor null, makes the whole list invalid: log at info
  "Groq executed_tools entries did not match the expected shape; not billed: {error}" and count nothing. Only a reply with
  usage is touched. searches = count of "browser.search" plus count of "browser_search"; opens = count of "browser.open". When
  both are zero leave usage alone. Otherwise replace usage.server_tool_use with web_search_requests = searches and
  browser_open_requests = opens, even when searches is 0 and a server_tool_use was already there. The current typed chat
  reply has no server_tool_use field, so the function returns the two counts next to the converted reply and the caller
  attaches them; do not edit the reply type, that file is B004's.


  groq_chat, stream. chunk_parser takes one parsed chunk. A chunk whose "error" is truthy fails with OpenAiError whose
  status is error.code, message error.message and body the error object. Then every choice's delta.reasoning is renamed to
  delta.reasoning_content, and the chunk goes to B504's stream chunk parser. A missing or non-integer error.code uses status
  500, the base parser's choice, because Rust statuses are integers. get_model_response_iterator only selects this parser
  for B010's iterator lifecycle, so B010 and B041 wire it and no iterator is built here.


  groq_stt. GroqSTTConfig.get_supported_openai_params_stt returns prompt, response_format, temperature, language in that
  order. get_supported_openai_response_formats_stt returns json, verbose_json, text. map_openai_params_stt copies every
  non-default param into optional_params in input order. A response_format outside the three formats is dropped when either
  the global drop_params flag (litellm.drop_params) or the call's drop_params is true; otherwise it fails with
  UnsupportedParamsError, status 400, "Groq doesn't support response_format={value}. To drop unsupported openai params from the
  call, set `litellm.drop_params = True`". Both flags come in as plain bools.


  groq_cost. web_search_cost(server_tool_use, search_context_cost_per_query) returns an exact Decimal (B204). The caller
  (B1687's dispatch, which replaces llms/__init__.py) passes the resolved model_info's search_context_cost_per_query as an
  Option of SearchContextPricing from betterlite-models, and the two counts; there is no billing instant because Groq has no
  off-peak pricing. The rate is search_context_size_medium, or 0 when the pricing is absent or has no medium value. Cost =
  web_search_requests * rate + browser_open_requests * 0.001, where each count is 0 when null and the whole answer is 0
  when server_tool_use is absent. 0.001 is GROQ_BROWSER_VISIT_WEBSITE_COST_PER_CALL (litellm/constants.py L471). This task
  only returns the value; B1686 and B1687 own dispatch and recording.


  The pinned source holds about 400 nonblank, non-comment lines once handler.py is dropped. Plan 330 transform lines, 330
  test lines and 100 helper adapter lines, under 1500. Helper b5833 (named by the skeleton) runs the pinned GroqChatConfig,
  GroqChatCompletionStreamingHandler, GroqSTTConfig and cost_per_web_search_request on fixture input, so a case can compare
  mapped options, supported lists, converted usage, chunks and costs. The capability trait gets fixed answers per case, and
  the Python side patches litellm.supports_web_search, supports_reasoning and supports_response_schema to the same answers.
scope:
  paths:
    - crates/betterlite-openai/src/groq_chat.rs
    - crates/betterlite-openai/src/groq_chat/**
    - crates/betterlite-openai/src/groq_stt.rs
    - crates/betterlite-openai/src/groq_stt/**
    - crates/betterlite-openai/src/groq_cost.rs
    - crates/betterlite-openai/src/groq_cost/**
    - tools/oracle/cases/helpers/groq-chat/**
    - tools/oracle/helpers/b5833.py
    - tools/oracle/helpers/b5833/**
    - tools/oracle/src/helpers/openai/b5833.rs
    - tools/oracle/src/helpers/openai/b5833/**
  lint_tables: false
