id: B786
title: Password strength, breach checks and compatible hashes
description: >-
  Implement PasswordPolicy, ScryptPassword and BreachCheck using maintained scrypt/hash crates with the
  pinned scrypt:base64 format, 16-byte salt, N=16384,r=8,p=1,32-byte output and legacy SHA256 verification.
  Execute expensive hashing on a bounded blocking executor. Strength defaults are min length 12, floor
  8 and all four character classes required, with Unicode-aware classifications. HIBP uses configured
  fixed https://api.pwnedpasswords.com/range, 5-second timeout and only the five-character SHA1 prefix;
  outage or malformed response warns and allows as upstream does.


  Build the production password_policy module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/password_policy.py:
  _has_uppercase (L34-L35; 2 source lines), _has_lowercase (L38-L39; 2 source lines), _has_digit (L42-L43;
  2 source lines), _has_special_character (L46-L51; 6 source lines), _configured_min_length (L63-L70;
  8 source lines), get_password_policy (L73-L82; 10 source lines), _policy_violations (L85-L93; 9 source
  lines), validate_password_policy (L96-L107; 12 source lines), get_hibp_client (L110-L114; 5 source lines),
  _is_suffix_in_range_response (L117-L122; 6 source lines), _is_password_breached (L125-L142; 17 source
  lines), is_breach_check_enabled (L145-L146; 2 source lines), is_password_breached (L149-L158; 10 source
  lines), breached_password_error (L161-L169; 9 source lines), validate_password_not_breached (L172-L182;
  10 source lines), _strength_verdict (L185-L190; 6 source lines), validate_passwords_bulk (L193-L218;
  25 source lines). litellm/proxy/utils.py: hash_password (L7128-L7136; 8 source lines), verify_password
  (L7139-L7156; 16 source lines), migrate_passwords_to_scrypt_async (L7159-L7185; 24 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.password_policy_min_length=None;
  general_settings.password_policy_require_uppercase=True; general_settings.password_policy_require_lowercase=True;
  general_settings.password_policy_require_numbers=True; general_settings.password_policy_require_special_characters=True;
  general_settings.password_policy_check_breached_passwords=True; password_policy_min_length=None; password_policy_check_breached_passwords=True;
  password_policy_require_uppercase=True; password_policy_require_lowercase=True; password_policy_require_numbers=True;
  password_policy_require_special_characters=True.


  Add the password_policy operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a password-policy-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::password_policy::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 189 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  189 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 485 changed lines estimated within a 500-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
