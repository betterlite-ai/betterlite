      or stream, including explicit None; stream is a local dispatch input and is not passed to create_and_poll.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::thread_runs_cases::case_[0-9]+_instructions_tools_overrides$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_thread_runs.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
