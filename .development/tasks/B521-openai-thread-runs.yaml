  - id: case-run-poll-completion
    why: Both buffered paths return create_and_poll results unchanged, including completed, requires_action and
      failed states; preserve SDK errors and per-request timeout via B519 without inventing a caller-deadline cutoff.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::thread_runs_cases::case_[0-9]+_run_poll_completion$/)'
  - id: case-requires-action
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-thread-runs/requires-action.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::thread_runs_cases::case_[0-9]+_requires_action$/)'
  - id: case-failed-run
