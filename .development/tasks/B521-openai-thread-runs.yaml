pitfalls:
- 'The oracle helper for this task is pre-registered as openai_thread_runs in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/thread_runs.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_thread_runs.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- async_run_thread_stream is a regular function returning a manager, so awaiting it changes the SDK seam.
- The stream parameter is accepted by arun_thread but never forwarded to create_and_poll.
