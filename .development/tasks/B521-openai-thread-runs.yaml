id: B521
title: OpenAI thread runs and run streams
description: >-
  Add typed RunRequest/RunReply and run event decoding. Represent run-and-poll, create-stream, and caller handler
  callbacks as transport/protocol primitives; B161 bridges Python event handlers. Retain SDK polling semantics and
  run status/errors/terminal events; the source adds no whole-run polling deadline. Rust task ownership and cancellation
  are standalone resource-lifecycle tests.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/openai.py: OpenAIAssistantsAPI.arun_thread
  L2965-L3001; OpenAIAssistantsAPI.async_run_thread_stream L3003-L3035; OpenAIAssistantsAPI.run_thread_stream L3037-L3069;
  OpenAIAssistantsAPI.run_thread L3074-L3093; OpenAIAssistantsAPI.run_thread L3096-L3115; OpenAIAssistantsAPI.run_thread
  L3119-L3207.


  Named case contracts: run_poll_completion: Both buffered paths return create_and_poll results unchanged, including
  completed, requires_action and failed states; preserve SDK errors and per-request timeout via B519 without inventing
  a caller-deadline cutoff. instructions_tools_overrides: Pass thread_id, assistant_id, additional_instructions,
  instructions, metadata, model and tools to create_and_poll or stream, including explicit None; stream is a local
  dispatch input and is not passed to create_and_poll. run_dispatch: arun_thread=True selects async; stream=True
  selects stream managers, not a run coroutine. False, None and non-boolean truthy values take the non-stream/sync
  paths because both tests use is True. stream_event_handler: Only include event_handler when it is not None; preserve
  the supplied handler identity. Return the sync/async SDK stream manager without entering or consuming it in these
  wrappers. assistants_beta_default: The SDK beta.threads.runs namespace supplies OpenAI-Beta: assistants=v2 for
  polling and stream requests, with the same header contract as the assistant/thread/vector-store siblings.


  Implement crates/betterlite-openai/src/thread_runs.rs with adjacent tests under thread_runs/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function thread_runs_cases in betterlite-openai with these exact named cases (one per oracle file):
  run_poll_completion, requires_action, failed_run, stream_incremental_events, instructions_tools_overrides, run_dispatch,
  stream_event_handler, assistants_beta_default. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_thread_runs* using HelperCase: kind: helper
  and the externally tagged openai_thread_runs variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_thread_runs that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_run_event consumes run SSE event data bytes in crates/betterlite-openai/src/thread_runs.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_thread_runs.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_thread_runs.
  The adjacent test replays_the_openai_thread_runs_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 227 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 180 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 600 planned, 600 maximum changed lines.
