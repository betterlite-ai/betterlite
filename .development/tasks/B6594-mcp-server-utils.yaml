id: B6594
title: MCP server utils for tool names, env references and headers
description: >-
  Build the small pure functions of litellm/proxy/_experimental/mcp_server/utils.py that no other task owns: tool-name prefixing and matching, the allowlist switch, the tool-result error text, the ${NAME} env var helpers for static headers, the header merge, and the synthetic request that carries an MCP connection's headers. Nothing here touches a database, the network or the process environment. B4716 took the base validators of that file, B4682 the header sanitizing and the server-local prefix copy that stays in betterlite-server, B4726 the header lookup, B3818 the result-content rewriting, and B4741 strip_auth_scheme (it lives in experimental_mcp_client/client.py and is already on main in crates/betterlite-mcp/src/credentials.rs).


  Put the code in the new module server_utils of betterlite-mcp: crates/betterlite-mcp/src/server_utils.rs with the submodules names, prefixes, allowlist, env_vars, headers and synthetic, each with a tests.rs beside it. Add regex and percent-encoding (both workspace dependencies) to crates/betterlite-mcp/Cargo.toml. B6590 adds betterlite-db there, which gives MCPInfo (betterlite_db::mcp_stored_contracts::pinned::MCPInfo).


  Values LiteLLM reads from the environment at call time come in as arguments, and B8620 reads them once at startup. These are MCP_TOOL_PREFIX_SEPARATOR (default "-"), LITELLM_USE_SHORT_MCP_TOOL_PREFIX and PROXY_BASE_URL. Rust names are shortened to 30 characters, so the mapping is: is_short_mcp_tool_prefix_enabled is short_tool_prefix_enabled, is_server_tool_allowlist_enforced is allowlist_enforced, extract_mcp_tool_result_error_message is tool_result_error_message. All other names stay as in LiteLLM.


  names. add_server_prefix_to_name(name, server_name, separator) returns normalize_server_name(server_name) + separator + name, where normalize_server_name is B4716's (server_payload::names) and replaces each space with an underscore. The tool name itself is not normalized. short_tool_prefix_enabled(raw: Option<&str>) -> bool is true when the trimmed, lowercased text is one of 1, true, yes or on; absent, empty and every other text is false (no error). known_tool_name_spellings(tool_name, known_prefixes: &[String], separator) is LiteLLM's iter_known_tool_name_spellings: the bare name first, then add_server_prefix_to_name(tool_name, prefix, separator) for each prefix. The caller passes the server's known prefixes (iter_known_server_prefixes from the prefixes submodule below). openapi_tool_name(operation_id) replaces every space with an underscore and lowercases. match_known_tool_name(tool_name, is_openapi, known_prefixes, names: impl IntoIterator<Item = &str>) -> Option<&str> builds the set of normalized spellings, where the normalizer is openapi_tool_name when the server has a spec_path (is_openapi) and the identity otherwise, and returns the first entry of names whose normalized form is in the set, in the order names are given. It returns the entry as written in names, so a caller can tell an empty allowed_params list from nothing configured. is_tool_name_prefixed uses match_known_server_prefix from the prefixes submodule (one copy, no private duplicate here). is_tool_name_prefixed(tool_name, known_server_prefixes: Option<&BTreeSet<String>>, separator) -> bool is false when the separator is not in the name; when a prefix set is given it is match_known_server_prefix(...).is_some(); when no set is given it is true (the legacy rule, which wrongly treats "text-to-speech" as prefixed).


  prefixes. B4682's crates/betterlite-server/src/mcp/catalog_guard/prefix.rs holds these as pub(super) over a server-local MCPServer view, so code in this crate cannot call them. Port them as pub functions of crates/betterlite-mcp/src/server_utils/prefixes.rs over B6590's MCPServer, with the same behavior and constants (base62 and base52 alphabets, SHORT_PREFIX_LENGTH 3, sha2 over server_id, "#attempt" seed), together with PrefixPolicy { separator: String, short_prefix_enabled: bool } (default separator "-", short prefix off) and PrefixError { EmptyServerId, IndexOverflow }. Signatures: compute_short_server_prefix(server_id: &str, attempt: u32) -> Result<String, PrefixError>; get_server_prefix(server: &MCPServer, policy: &PrefixPolicy) -> String; iter_known_server_prefixes(server: &MCPServer, policy: &PrefixPolicy) -> Vec<String>; match_known_server_prefix(name: &str, known_prefixes: &[String], policy: &PrefixPolicy) -> Option<(String, String)>. The last one replaces each space with an underscore, drops empty and duplicate prefixes, sorts longest first and returns (prefix, rest) for the first one where name starts with prefix + policy.separator. Read the merged file for the bodies. Add sha2 and thiserror to the Cargo.toml only if they are missing (both are already there).


  allowlist. allowlist_enforced(mcp_info: Option<&MCPInfo>) -> bool serializes the MCPInfo to a JSON object with serde_json::to_value and is true only when the key tool_allowlist_enforced is the JSON value true; no mcp_info, a missing key or any other value is false. server_applies_tool_allowlist(mcp_info, allowed_tools: Option<&[String]>) -> bool is allowlist_enforced(mcp_info) or allowed_tools is present and non-empty. LiteLLM also accepts mcp_info as a JSON string; the record types it as MCPInfo, so that form is not built.


  tool results. tool_result_error_message(result: &serde_json::Value) -> Option<String>. A JSON object reports an error when its isError value, or its is_error value when isError is absent or null, is the JSON value true; any other value, a non-object result and a result that is not an error return None. For an error, return the first text of the content array: the first item that is an object whose text is a non-empty string. With no such item, or when content is missing or not an array, return the fixed text "MCP tool call returned isError=true".


  env_vars. parse_admin_env_vars(env_vars: Option<&[serde_json::Value]>) -> (BTreeMap<String, String>, Vec<UserEnvSpec>) with UserEnvSpec { name: String, description: Option<String> }. B6590 stores the entries as JSON values when B858 has not defined a typed row, so the input is JSON. Skip an entry that is null or not an object, or whose name is missing, not a string or empty. The scope is the entry's scope when present and non-empty, else "global". Scope "user" appends a UserEnvSpec in input order; every other scope text puts name into the map with value (null or missing becomes "", a string as is, any other JSON type its JSON text), and a later entry with the same name replaces an earlier one. None input returns an empty map and an empty list. find_env_var_references(value) returns the set of NAME from every ${NAME} match of the regex \$\{([A-Za-z_][A-Za-z0-9_]*)\} (ASCII only), and the empty set for empty text. collect_env_var_references(strings: impl IntoIterator<Item = &str>) is the union over the strings. interpolate_env_vars(value, variables: &BTreeMap<String, String>) replaces each ${NAME} whose name is a key with its value and leaves an unknown reference untouched. It makes one pass, so a replacement that contains ${OTHER} is not expanded again, and empty input is returned as is. interpolate_headers(headers, variables) returns a new map with the same keys and every value interpolated. build_env_var_setup_url(proxy_base_url: Option<&str>, server_id) is "/ui/mcp-servers?fill_env_vars=" + the server id percent-encoded with every byte outside A-Z a-z 0-9 - . _ ~ escaped (Python quote with safe=""), prefixed by the base url with trailing slashes removed when the base is present and non-empty. MCPMissingUserEnvVarsError is a thiserror struct with server_id, server_name: Option<String>, missing: Vec<String> and setup_url. Its Display text is exactly: Cannot connect to MCP server "<label>". then a blank line, then "Your administrator configured this server to require per-user variables, but you haven't set the following yet:", a newline, one "- NAME" line per missing name, a blank line, "Set your credentials here:", a newline and the setup url. The label is server_name when it is present and non-empty, else server_id.


  headers. merge_mcp_headers(extra_headers: Option<&BTreeMap<String, String>>, static_headers: Option<&BTreeMap<String, String>>) -> Option<BTreeMap<String, String>> starts from extra_headers, overlays static_headers (static wins on an equal key, compared exactly, so X-Api and x-api both stay), and returns None when the result is empty.


  synthetic. build_synthetic_mcp_request(path, raw_headers: Option<&[(String, String)]>, client_ip: Option<&str>, extra_excluded: &[String]) -> SyntheticMcpRequest. LiteLLM builds a FastAPI Request from an ASGI scope; betterlite returns the scope as data: SyntheticMcpRequest { method: "POST", path, scheme: "http", server: ("127.0.0.1", 4000), query_string: empty, root_path: empty, headers: Vec<(Vec<u8>, Vec<u8>)>, client: Option<(String, u16)> }. The header list is, in order, (b"content-type", b"application/json"), then every raw header whose lowercased name is not excluded (lowercased name encoded as Latin-1 with characters above U+00FF replaced by b"?", value as UTF-8, original order kept), then (b"x-forwarded-for", client_ip) when client_ip is present. client is (client_ip, 0) when client_ip is present. The excluded names are the hop-by-hop headers content-length, transfer-encoding, connection, keep-alive, upgrade, te and trailer, plus content-type, host and x-forwarded-for, plus extra_excluded (lowercased by the function). The caller fills extra_excluded with B4682's upstream_credential_headers for these header names and the lowercased custom litellm_key_header_name when the deployment sets one; this crate cannot reach that code, and the Python side reads proxy_server settings that betterlite passes in.


  Tests are named per module: names (every function above, with a space in a server name, an OpenAPI server where "Get Pets" matches "get_pets", an empty allowed_params list that returns None, a prefix that contains the separator winning over its leading segment, and the legacy true), allowlist, env_vars, headers and synthetic. They live under server_utils::<module>::tests. Add oracle helper cases for the pure functions; no route reaches this code yet, so there are no HTTP cases.

