deviations:
  - what: The short-prefix flag, the tool prefix separator and PROXY_BASE_URL are read once at startup and passed in, where LiteLLM reads them from the environment at call time.
    why: Library code reads no environment (rule on constructor wiring); a change to those variables takes effect on restart.
  - what: is_mcp_available is not built; the MCP code is compiled in, so the proxy_server gates on it (utils.py lines 133-141, callers at proxy_server.py 8916, 8967, 20129, 20152) are always open.
    why: LiteLLM tests whether the optional mcp package imports. betterlite has no such optional package.
  - what: build_synthetic_mcp_request returns the request scope as data (SyntheticMcpRequest) instead of a FastAPI Request.
    why: There is no FastAPI Request in Rust; the fields are the ones LiteLLM puts in its ASGI scope, so the caller that builds the http request sees the same method, path, headers and client.
  - what: The credential and key-header exclusions of the synthetic request come in as extra_excluded, where LiteLLM computes them inside the function from proxy_server settings and the MCP server manager.
    why: That code is B4682's in betterlite-server, which this crate cannot depend on; the caller passes the same lowercased names.
  - what: allowlist_enforced reads mcp_info as the typed MCPInfo and does not accept a JSON string.
    why: LiteLLM's server record types mcp_info as MCPInfo; the string form exists for untyped rows only.

out_of_scope:
  - "split_server_prefix_from_name, strip_known_server_prefix, upstream_credential_headers and logging_safe_mcp_headers with their private helpers: B4682, in betterlite-server."
  - "normalize_server_name, validate_mcp_server_name, validate_tool_display_names and validate_and_normalize_mcp_server_payload: B4716."
  - "lookup_mcp_server_auth_in_headers, sanitize_mcp_alias_for_header and the header-key helpers: B4726."
  - "mcp_tool_result_content_list, mcp_content_item_text, with_mcp_content_item_text, json_string_leaves, with_json_string_leaves, json_unrewritable_labels, mcp_tool_result_structured_content and set_mcp_tool_result_structured_content: B3818."
  - "strip_auth_scheme: not in utils.py. It is in experimental_mcp_client/client.py, owned by B4741 and already on main in crates/betterlite-mcp/src/credentials.rs."
  - "The constants LITELLM_MCP_SERVER_NAME, LITELLM_MCP_SERVER_VERSION, LITELLM_MCP_SERVER_DESCRIPTION and MCP_TOOL_PREFIX_FORMAT: the first three describe the served MCP endpoint and belong to the task that builds that endpoint; the format is inlined in add_server_prefix_to_name."
  - "The callers: MCPServerManager and operations.py decide when to call these functions (B6763, B6764 and the tool-call tasks)."

pitfalls:
  - "add_server_prefix_to_name normalizes only the server part; a tool name with a space keeps it, and get_server_prefix output is normalized a second time by this call."
  - "known_tool_name_spellings must keep the bare name first and the caller must include every historical prefix, or a tool called by an old alias stops matching its allowed_tools entry."
  - "On an OpenAPI server both the configured entry and the spelling go through openapi_tool_name, so 'Get Pets' in allowed_tools matches the tool 'get_pets'; on any other server the compare is exact and case-sensitive."
  - "match_known_tool_name returns the entry from names, not the tool name; an explicitly empty allowed_params list gives None, not an empty match."
  - "The real iter_known_server_prefixes also yields the 3-character hash of server_id in every mode, so oracle cases must not use that spelling; the Rust adapter takes alias, server_name and server_id only."
  - "is_tool_name_prefixed with no prefix set is true for 'text-to-speech'; only a passed set makes it exact, and the set must hold normalized prefixes."
  - "A prefix that itself contains the separator (a UUID server_id, a legacy hyphenated alias) must win over its leading segment, so candidates are sorted longest first before the starts-with test."
  - "The ${NAME} pattern is ASCII only, needs braces and cannot start with a digit; $NAME, ${1A} and ${A-B} are not references."
  - "interpolate_env_vars is one pass: a value that contains ${OTHER} is inserted as text and not expanded, and an unknown ${NAME} stays literally in the header."
  - "parse_admin_env_vars sends only the exact scope text user to the per-user list; a missing, empty or unknown scope text is global."
  - "merge_mcp_headers compares keys exactly, so Authorization from extra_headers and authorization from static_headers both survive."
  - "The synthetic request drops host and x-forwarded-for from the caller and takes x-forwarded-for from the resolved client ip only, so a client cannot spoof either."
  - "The synthetic header names are lowercased before the Latin-1 encode, while the excluded check lowercases the original name; both give the same result for ASCII names."
  - "B6594 does not edit crates/betterlite-server/src/mcp/catalog_guard/prefix.rs; the server keeps its pub(super) copy, so a change to the prefix rules has to land in both files."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
