dod:
  - text: add_server_prefix_to_name normalizes spaces in the server name only and joins with the given separator; short_tool_prefix_enabled is true only for 1, true, yes and on after trim and lowercase; openapi_tool_name replaces spaces and lowercases.
    proof: [names-tests, oracle]
  - text: match_known_tool_name matches the bare name and every prefixed spelling, normalizes both sides with openapi_tool_name only for an OpenAPI server, and returns the entry as written in names or None.
    proof: [names-tests, oracle]
  - text: is_tool_name_prefixed returns false without the separator, checks the longest known prefix first when a set is given, and returns true for any separator hit when no set is given.
    proof: [names-tests, oracle]
  - text: compute_short_server_prefix, get_server_prefix, iter_known_server_prefixes and match_known_server_prefix are public in server_utils::prefixes over MCPServer with PrefixPolicy and PrefixError, behave like the merged server copy (longest prefix first, same short-prefix hash), and crates/betterlite-server/src/mcp/catalog_guard/prefix.rs is untouched.
    proof: [prefixes-tests]
  - text: allowlist_enforced is true only for the JSON value true under tool_allowlist_enforced, and server_applies_tool_allowlist also turns on for a non-empty allowed_tools.
    proof: [allowlist-tests, oracle]
  - text: tool_result_error_message returns None unless isError (or is_error when isError is absent or null) is true, then the first non-empty text of content, else the fixed text.
    proof: [allowlist-tests, oracle]
  - text: parse_admin_env_vars splits global values from user specs, skips malformed entries and defaults the scope to global.
    proof: [env-tests, oracle]
  - text: find_env_var_references and collect_env_var_references read only well-formed ${NAME} references with an ASCII identifier.
    proof: [env-tests, oracle]
  - text: interpolate_env_vars and interpolate_headers replace known names in a single pass and leave unknown references untouched.
    proof: [env-tests, oracle]
  - text: build_env_var_setup_url percent-encodes the server id like Python quote with safe empty, trims trailing slashes from the base url and returns the bare path when there is no base.
    proof: [env-tests, oracle]
  - text: The MCPMissingUserEnvVarsError Display text matches LiteLLM's message for one and several missing names, with the server name or the id as label.
    proof: [env-tests, oracle]
  - text: merge_mcp_headers lets static headers win on an exactly equal key and returns None for an empty result.
    proof: [headers-tests, oracle]
  - text: build_synthetic_mcp_request builds the fixed scope, drops hop-by-hop, host, content-type, x-forwarded-for and the extra excluded names case-insensitively, keeps the other headers in order, and adds x-forwarded-for and client from the resolved client ip.
    proof: [synthetic-tests, oracle]
  - text: The oracle helper adapter passes strict Python checks and the new helper cases replay through the shared parser.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: names-tests
      why: the tool-name prefixing, matching or prefix check is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_utils::names::tests::/)'
    - id: prefixes-tests
      why: the ported prefix derivation or the known-prefix match is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_utils::prefixes::tests::/)'
    - id: allowlist-tests
      why: the allowlist predicates or the tool-result error text is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_utils::allowlist::tests::/)'
    - id: env-tests
      why: the env var parsing, interpolation, setup url or missing-variables error is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_utils::env_vars::tests::/)'
    - id: headers-tests
      why: the header merge is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_utils::headers::tests::/)'
    - id: synthetic-tests
      why: the synthetic request scope or its header filtering is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_utils::synthetic::tests::/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        git diff --name-only "$GATE_BASE" -- tools/oracle/helpers | grep -q b6594 &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-server-utils-*')" &&
        grep -lE '^[[:space:]]+b6594:' tools/oracle/fuzz/corpus/helper_case/mcp-server-utils-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

