  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/auto_router_access.py
  - tools/oracle/cases/routing/auto-router-access/**
  - tools/oracle/helpers/b343.py
