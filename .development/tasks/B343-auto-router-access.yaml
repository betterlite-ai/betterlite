id: B343
title: Auto-router identity, member permissions and inference checks
description: Implement the MIT auto-router naming/dependency analysis and connect member-created router
  permissions to B052/B060. Validate ownership, team membership, allowed configuration fields and every
  classifier/embedding/evaluation/model dependency on both writes and inference. Revalidate stored routers
  after membership or access changes. Preserve configuration placement checks while omitting capability-count
  and tuning-license limits per the accepted product decision. This task provides the shared service used
  by the later preview and availability endpoints. Use the existing Rust crate boundaries from B004 and
  B008; integrate through the server when the provider dispatcher or callbacks live in another core crate.
  This task's source slices are the linked ranges, not a port of their Python classes. Add the listed
  oracle cases and the matching adapters to B301's component runner where state is not observable over
  HTTP; adapters call production logic and never reproduce it. Use deterministic candidate sets or supplied
  random samples for comparisons, and separate seeded distribution tests for random choices. Extend the
  existing config_yaml fuzz target and committed corpus for every newly accepted config form; unsupported
  keys still fail by full path. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/auto-router-access/**
  - tools/oracle/src/router_probes/auto-router-access/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/auto_router_access.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/auto_router_model_naming.py#L68-L221
  why: Router identity and dependency graph.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/auto_router_model_naming.py#L347-L453
  why: Config placement validation and license-gate boundaries.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/auto_router_permissions.py#L109-L370
  why: Member write and dependency permissions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auto_router_checks.py#L26-L159
  why: Inference-time revalidation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/auto_router_tuning_baseline.py#L147-L174
  why: License quotas deliberately omitted.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(auto_router_access)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/auto-router-access/member-own-router.yaml
- tools/oracle/cases/routing/auto-router-access/cross-team-denied.yaml
- tools/oracle/cases/routing/auto-router-access/ownership-fields-rejected.yaml
- tools/oracle/cases/routing/auto-router-access/dependency-model-denied.yaml
- tools/oracle/cases/routing/auto-router-access/member-revoked-after-create.yaml
- tools/oracle/cases/routing/auto-router-access/blocked-team.yaml
- tools/oracle/cases/routing/auto-router-access/database-unavailable.yaml
- tools/oracle/cases/routing/auto-router-access/misplaced-router-config.yaml
deviations:
- what: Auto-router capability counts and tuning quotas do not restrict configuration.
  why: The accepted product decision enables all MIT features without a paid tier.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/auto_router_tuning_baseline.py#L147-L174
out_of_scope:
- Python plugin installation or execution.
- Management route handlers, planned separately.
pitfalls:
- Removing licensing gates does not remove team opt-in, ownership or model access checks.
- Inference must recheck access rather than trusting a previously valid saved router.
- The source's tuning baseline exists to enforce a license limit and needs no parallel quota database
  in betterlite.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
