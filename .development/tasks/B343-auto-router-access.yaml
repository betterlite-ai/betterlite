id: B343
title: Auto-router identity, member permissions and inference checks
description: 'Revalidate B377 automatic-router dependencies at inference using B378 MemberRouterAccess
  and B052/B060 public services. Reject revoked members, blocked teams and unavailable ownership data
  before any classifier or selected-model call. Reuse configuration-write policy; no duplicate quota or
  authorization engine is introduced. Implement the owned native service in crates/betterlite-server/src/auto_router_access.rs.
  Add ProbeOperation::AutoRouterAccess in tools/oracle/src/router_probes/mod.rs and the corresponding B343 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/proxy/auth/auto_router_checks.py: _mapping
  (L16-L20), authorize_member_auto_router_inference (L23-L136). Implement these behaviors through the
  typed Rust services above; synchronous facades and structural accessors reuse the same primitive instead
  of separate ports.'
