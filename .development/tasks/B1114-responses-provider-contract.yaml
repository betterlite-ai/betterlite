checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::responses_provider_contract::/)
      - test(/::replays_corpus$/)'
  - id: case-base-response-capabilities
    why: the base-response-capabilities behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_provider_contract::tests::base_response_capabilities($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_provider_contract.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_provider_contract-*)"
      && grep -qE "^[[:space:]]+responses_provider_contract:" tools/oracle/fuzz/corpus/helper_case/responses_provider_contract-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-provider-contract)"
oracle_cases:
- tools/oracle/cases/helpers/responses-provider-contract/base-response-capabilities.yaml
