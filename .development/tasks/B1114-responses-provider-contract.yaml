id: B1114
title: Responses provider contract
description: >-
  Define the Responses operation variants and capability defaults in betterlite-provider::api::responses_provider_contract.
  Translate BaseResponsesAPIConfig's abstract signatures into closed typed operations for create, stream,
  get, delete, input-items, cancel and compact. Reuse B010's provider enum, B902's output records,
  B1138's response/optional-parameter records and B1113's events. Concrete provider transformations
  remain with their provider tasks. Own all substantive default methods in the referenced file;
  B2202's zero-state __init__ remains its initialization concern.

  No network or bytes are parsed here. A responses_provider_contract helper adapter invokes a
  concrete test subclass whose abstract transformations capture their inputs; inherited default
  methods are the pinned implementation under comparison. Tests belong to the provider crate,
  with full names base_capabilities, signing_passthrough, websocket_url, request_normalization,
  async_request_forwarding and base_error_fields. The class-local get_config helper has no
  caller at the pin and is excluded rather than exposed as a new configuration API.

  The owned ranges have 265 nonblank, non-comment lines, mostly abstract signatures. Reserve 250 lines
  for native contracts/defaults, 135 tests, 85 adapters, 90 fixtures and 30 wiring: 590 total.
scope:
  paths:
  - crates/betterlite-provider/Cargo.toml
  - crates/betterlite-provider/src/api.rs
  - crates/betterlite-provider/src/api/**
  - crates/betterlite-provider/src/api/responses_provider_contract.rs
  - crates/betterlite-provider/src/api/responses_provider_contract/**
  - crates/betterlite-provider/src/provider.rs
  - crates/betterlite-provider/src/provider/**
  - crates/betterlite-provider/src/operation.rs
  - crates/betterlite-provider/src/operation/**
  - crates/betterlite-provider/src/prepared.rs
  - crates/betterlite-provider/src/prepared/**
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/provider/responses_provider_contract.rs
  - tools/oracle/src/helpers/provider/responses_provider_contract/**
  - tools/oracle/helpers/responses_provider_contract.py
  - tools/oracle/helpers/responses_provider_contract/**
  - tools/oracle/fuzz/corpus/helper_case/responses_provider_contract-*
  - tools/oracle/cases/helpers/responses-provider-contract/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/responses/transformation.py#L34-L37
  why: Provider identity is an abstract property rather than a mutable request setting.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/responses/transformation.py#L58-L385
  why: Complete operation signatures and live default capability, URL, signing, normalization and error methods.
dod:
- text: >-
    base_capabilities expects native_file_search=false,encrypted_agent_messages=false,
    native_websocket=false,model_in_websocket_url=true and should_fake_stream=false even with
    stream=true. The input-items contract defaults after/before/include=null,limit=20,order=desc.
  proof: [contract-tests, oracle, contract-adapter]
- text: >-
    signing_passthrough sends headers={Authorization:"Bearer test"},request_data={input:hi},
    optional_params={stream:true}; expect the identical headers and signed_body=null. extra_body
    {custom:7} returns unchanged. Calling the base validate_environment body returns {}.
  proof: [contract-tests, oracle, contract-adapter]
- text: >-
    websocket_url maps https://example.test/responses to wss://example.test/responses and
    http://example.test/responses to ws://example.test/responses, preserving query strings.
    get_complete_url returns an explicitly supplied empty string unchanged; null raises
    ValueError with message "api_base is required". Replacement is the pinned string replace,
    including an embedded http:// substring, not a newly introduced URL-normalization policy.
  proof: [contract-tests, oracle, contract-adapter]
- text: >-
    request_normalization sends input=[{type:custom_tool_call,namespace:ns,name:edit,input:x},
    {type:function_call,namespace:ns,name:f}] and expects only the custom-call namespace removed.
    Non-list input="hello", absent input and unrelated top-level keys survive without mutation.
    async_request_forwarding passes model=m,input=hi,optional={store:false},headers={x-test:yes}
    and the supplied litellm_params exactly once to the synchronous transformation and returns its result.
  proof: [contract-tests, oracle, contract-adapter]
- text: >-
    base_error_fields passes message=bad,status_code=429,headers={retry-after:3}; expect a raised
    BaseLLMException carrying status_code=429,message=bad,headers unchanged, with no invented
    error type,param or code. The method raises instead of returning an exception value.
  proof: [contract-tests, oracle, contract-adapter]
checks:
  optional: []
  commands:
  - id: contract-tests
    why: a base contract default, normalization or error propagation is unimplemented
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::responses_provider_contract::/)'
  - id: contract-adapter
    why: the subclass fixture bypasses the pinned default methods or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_provider_contract.py && grep -qE '^[[:space:]]+responses_provider_contract:' tools/oracle/fuzz/corpus/helper_case/responses_provider_contract-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-provider-contract/base-capabilities.yaml
- tools/oracle/cases/helpers/responses-provider-contract/signing-passthrough.yaml
- tools/oracle/cases/helpers/responses-provider-contract/websocket-url.yaml
- tools/oracle/cases/helpers/responses-provider-contract/request-normalization.yaml
- tools/oracle/cases/helpers/responses-provider-contract/async-request-forwarding.yaml
- tools/oracle/cases/helpers/responses-provider-contract/base-error-fields.yaml
deviations: []
out_of_scope:
- BaseResponsesAPIConfig.get_config L39-L56 has no caller at the pin; no helper operation or cases expose it.
- B2202 owns BaseResponsesAPIConfig.__init__ L31-L32; it has no state or observable operation.
- Provider overrides execute through their provider tasks, including OpenAI B508/B509; this task's test subclass does no provider I/O.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_provider_contract in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/responses_provider_contract.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_provider_contract.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- sign_request's null signed body means the finalized request still needs ordinary serialization; it is not an empty body.
- Namespace removal is shallow and matches only type=custom_tool_call; function_call.namespace remains.
- get_websocket_url calls the provider's complete-URL override before replacing scheme strings.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 1
