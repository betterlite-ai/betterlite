out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
- 'litellm/llms/base_llm/responses/transformation.py: BaseResponsesAPIConfig.__init__ L31-L32 belongs to B2202;
  use its zero-state initialization.'
pitfalls:
- Within BaseResponsesAPIConfig.get_complete_url\'s api_base is None branch, preserve raise ValueError('api_base
  is required') and its nested guards.
- Within BaseResponsesAPIConfig.strip_custom_tool_call_namespace_from_responses_input\'s not isinstance(input, list)
  branch, preserve return input and its nested guards.
