id: B1114
title: Responses provider contract
description: >-
  Define Responses provider capability/preparation contracts and base transformations over the shared OpenAI records.
  Abstract Python methods become exhaustive operation variants and typed capability facts.


  Implement crates/betterlite-core/src/api/responses_provider_contract.rs, crates/betterlite-provider/src/api/responses_provider_contract.rs.
  Use ResponsesProviderContrInput and ResponsesProviderContrResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions base_response_capabilities under api::responses_provider_contract::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesProviderContract in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_provider_contract: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/llms/base_llm/responses/transformation.py: BaseResponsesAPIConfig.custom_llm_provider
  (L36-L37); litellm/llms/base_llm/responses/transformation.py: BaseResponsesAPIConfig.get_config (L40-L56); litellm/llms/base_llm/responses/transformation.py:
