id: B928
title: Response synthetic events
description: >-
  Create deterministic synthetic Responses streams from a completed typed response, including content part completion
  and estimated usage. Inject clock/IDs and B013 token counting, and carry B068 billing metadata without recomputing
  spend; provide the common replay source for mocks and cache hits.


  Implement crates/betterlite-core/src/api/response_synthetic_events.rs. Use ResponseSyntheticEventInput and ResponseSyntheticEventResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions text_output_synthetic_order, refusal_output_events, tool_output_events,
  estimated_usage, billed_terminal_fields under api::response_synthetic_events::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponseSyntheticEvents in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_synthetic_events: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/streaming_iterator.py: _HasModelDump.model_dump (L1331-L1331); litellm/responses/streaming_iterator.py:
  _HasModelDumpJson.model_dump_json (L1336-L1336); litellm/responses/streaming_iterator.py: _dump_response_object
  (L1339-L1344); litellm/responses/streaming_iterator.py: _build_response_status_event (L1347-L1361); litellm/responses/streaming_iterator.py:
  _build_content_part_done_event (L1364-L1403); litellm/responses/streaming_iterator.py: _add_text_like_part_events
  (L1406-L1473); litellm/responses/streaming_iterator.py: _billed_terminal_response (L1476-L1490); litellm/responses/streaming_iterator.py:
  _dump_json_safely (L1493-L1498); litellm/responses/streaming_iterator.py: _logging_copy (L1501-L1511); litellm/responses/streaming_iterator.py:
  _detached_shallow_copy (L1514-L1518); litellm/responses/streaming_iterator.py: _usage_as_model (L1521-L1529);
  litellm/responses/streaming_iterator.py: _estimate_usage_from_text (L1541-L1561); litellm/responses/streaming_iterator.py:
  _estimate_usage_safely (L1564-L1579); litellm/responses/streaming_iterator.py: _stamp_responses_usage_cost (L1582-L1598);
  litellm/responses/streaming_iterator.py: build_synthetic_response_events (L1601-L1732). Abstract/protocol declarations
  map to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 361 owned nonblank/non-comment/non-docstring Python lines (365 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 381 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 631 total within the 640-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B013 (Model cost map, provider capability data and token counting), B068 (Cost calculation
  for every call type), B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B1087 (Api boundaries),
  B925 (Responses stream events), B909 (Responses input messages). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
