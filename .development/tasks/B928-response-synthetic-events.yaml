checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_synthetic_events::/)
      - test(/::replays_corpus$/)'
  - id: case-text-output-synthetic-order
    why: the text-output-synthetic-order behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_synthetic_events::tests::text_output_synthetic_order($|::)/)'
  - id: case-refusal-output-events
    why: the refusal-output-events behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_synthetic_events::tests::refusal_output_events($|::)/)'
  - id: case-tool-output-events
    why: the tool-output-events behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_synthetic_events::tests::tool_output_events($|::)/)'
  - id: case-estimated-usage
    why: the estimated-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_synthetic_events::tests::estimated_usage($|::)/)'
  - id: case-billed-terminal-fields
    why: the billed-terminal-fields behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_synthetic_events::tests::billed_terminal_fields($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/response_synthetic_events.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/response_synthetic_events-*)"
      && grep -qE "^[[:space:]]+response_synthetic_events:" tools/oracle/fuzz/corpus/helper_case/response_synthetic_events-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/response-synthetic-events)"
