id: B928
title: Build synthetic Responses events and isolate billing copies
description: >-
  Implement api::response_synthetic_events for every function/protocol/constant L1329-L1732.
  Build complete event lists from decoded Responses records and provide terminal usage,
  logging-copy and safe-serialization helpers to B925/B926. Depend on B2413's shape/type
  primitives, never on those callers. B909 converts request input to messages, B196 counts
  tokens and B068 supplies the injected cost calculator. B1113/B1138 define event/usage
  defaults; no new byte decoder or transport belongs here.

  Register response_synthetic_events with B171 using typed output records and deterministic
  token/cost seams. Compare every event field and mutation of the input response. Record
  logging-only copies separately to prove callbacks cannot rewrite client usage. Source
  count is 367 nonblank/non-comment lines. Budget 325 implementation, 185 tests, 130
  fixtures, 90 adapters and 25 wiring lines: 755 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/response_synthetic_events.rs
  - crates/betterlite-core/src/api/response_synthetic_events/**
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/response_synthetic_events.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/response_synthetic_events.py
  - tools/oracle/fuzz/corpus/helper_case/response_synthetic_events-*
  - tools/oracle/cases/helpers/response-synthetic-events/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L1329-L1732
  why: Whole synthetic builders and billing/copy helpers preserve content-specific events and the terminal event type.
dod:
- text: >-
    synthetic_text_sequence with response resp_a,message msg_a,text=abcdef,chunk_size=5
    emits created,in_progress,item.added,part.added,text.delta=abcde,text.delta=f,
    text.done=abcdef,part.done,item.done,completed. Status events are deep copies with
    status=in_progress,output=[] and all other original fields retained,including usage/error.
    Added item/part payloads already contain complete original content,not empty placeholders.
    Text annotations emit annotation.added after all deltas and before text.done,indices
    starting 0. Part done defaults annotations=[] and logprobs=null; empty text emits done
    without deltas. Split by Unicode characters,not bytes. chunk_size=0 raises ValueError
    "range() arg 3 must not be zero"; negative sizes emit no deltas but retain done events.
  proof: [synthetic-tests, oracle, synthetic-adapter]
- text: >-
    refusal_and_unknown_parts emits refusal.delta chunks then refusal.done then part.done
    for refusal text. reasoning_text gets part.done with reasoning string but no delta/done
    text pair. Unknown part types still get part.added but no part.done. Non-list message
    content becomes empty. Falsy text/refusal/reasoning becomes ""; truthy values stringify.
    Unsupported objects project to {},while dict/model_dump objects retain all fields.
    Missing/falsy item id uses response id for event references without inserting it into
    the added/done item payload. Output/content indices preserve source positions.
  proof: [synthetic-tests, oracle, synthetic-adapter]
- text: >-
    function_and_reasoning_events chunks function_call.arguments by 5 and emits arguments.done
    even for empty arguments. custom_tool_call receives only item.added/item.done,with no
    custom input deltas. Reasoning summaries must be lists; each summary emits text deltas,
    summary_text.done and summary_part.done with its original summary_index. Shared sequence
    starts 0 and increments only for those two reasoning done events and each item.done;
    other event constructors keep B1113 defaults. Final event is always response.completed,
    even when response.status is incomplete or failed,with the original transformed response.
  proof: [synthetic-tests, oracle, synthetic-adapter]
- text: >-
    billed_response_and_estimate preserves a typed response with nonnull usage by identity;
    absent usage plus estimator returns a shallow copy with its result. Dict response uses
    unchecked model construction and preserves existing usage,including {},otherwise the
    estimate. Nonresponse values yield null. Estimation passes B909 messages to the input
    token counter and generated text to the output counter with count_response_tokens=true;
    counters 3 and 4 yield input_tokens=3,output_tokens=4,total_tokens=7. Any exception logs
    "Could not estimate usage from stream text, billing $0: %s" and returns null,not zero usage.
  proof: [synthetic-tests, oracle, synthetic-adapter]
- text: >-
    usage_cost_stamping ignores missing response/logger or invalid usage. Valid dict usage
    becomes a B1138 usage model on the response. Existing int/float cost,including 0 and
    Python bool,prevents recalculation; a cost dictionary does not. A calculator result
    0.25 is attached as usage.cost; 0,-1,null,nonnumeric or a thrown error leaves cost
    absent/unchanged. Stamping happens before synthetic lifecycle copies,so their usage
    carries that cost too. No spend-log write or usage estimate is performed by the builder.
  proof: [synthetic-tests, oracle, synthetic-adapter]
- text: >-
    detached_logging_and_safe_dump returns nonmodel events unchanged; a model round-trips
    through dump/validate,and validation failure falls back to separate shallow copies
    of event and nested model response. Rebinding logging_copy.response.usage cannot alter
    the original event's usage; other nested objects may still be shared in the fallback.
    Valid usage models pass through,valid dicts validate,malformed/non-dict usage returns
    null. JSON serialization failure logs
    "could not serialize completed response for cache: %s" and returns null.
  proof: [synthetic-tests, oracle, synthetic-adapter]
checks:
  optional: []
  commands:
  - id: synthetic-tests
    why: synthetic event fields or billing/copy semantics differ
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_synthetic_events::/)'
  - id: synthetic-adapter
    why: full synthetic event sequences lack independent pinned comparison
    run: test -f tools/oracle/helpers/response_synthetic_events.py && grep -qE '^[[:space:]]+response_synthetic_events:' tools/oracle/fuzz/corpus/helper_case/response_synthetic_events-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/response-synthetic-events/synthetic-text-sequence.yaml
- tools/oracle/cases/helpers/response-synthetic-events/refusal-and-unknown-parts.yaml
- tools/oracle/cases/helpers/response-synthetic-events/function-and-reasoning-events.yaml
- tools/oracle/cases/helpers/response-synthetic-events/billed-response-and-estimate.yaml
- tools/oracle/cases/helpers/response-synthetic-events/usage-cost-stamping.yaml
- tools/oracle/cases/helpers/response-synthetic-events/detached-logging-and-safe-dump.yaml
deviations: []
out_of_scope:
- B2413 owns primitives/state L73-L361,B925 event processing L363-L532,B926 callbacks/cache L534-L952,and B927 drivers L954-L1326; testing-only hook facades are excluded.
- B942-B945 own websocket code after L1732. _HasModelDumpJson is a structural serialization protocol,not an extra runtime operation.
- B196 owns tokenization and any Hugging Face loading policy; B068 owns price calculation. This task invokes those seams without downloading or changing their current policy.
pitfalls:
- Added events expose full stored content before deltas,so replacing their content with an empty shell changes replay behavior.
- A synthetic failed response still ends with response.completed rather than response.failed.
- Logging fallback detaches the usage attribute but does not promise a recursive deep copy.
review_level: security
budget:
  max_changed_lines: 755
  max_new_expects: 1
