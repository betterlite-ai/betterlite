id: B884
title: Request credential destination and metadata safety
description: >-
  Implement request-body safety over the pinned banned field table, nested request/config/metadata and
  fallback values. Reject every URL-valued banned field by field name regardless of allow_client_side_credentials
  or per-model opt-in: api_base, base_url, aws_sts_endpoint, aws_bedrock_runtime_endpoint, s3_endpoint_url,
  sagemaker_base_url, deployment_url and every observability host. Preserve 401 auth_error through the
  real auth exception handler. Non-URL credentials still follow MIT opt-in. Copy a source-pinned fixed
  table from B2360 RequestBanCatalog, including pricing inheritance and callback exceptions.
  The only supported dict-form per-param matcher is api_base regex, whose URL opt-in
  remains overridden by the security decision. decode_request_metadata(&[u8]) parses stringified metadata
  JSON and is fuzzed.

  Match model opt-ins through B302 get_model_group_info for the requested model, falling back to its
  provider prefix only when the full name is unknown and B174's provider list contains that prefix.
  No router, no model info or no configurable_clientside_auth_params denies the field. A string item
  allows only that exact parameter; dict items are considered only for api_base and require their
  api_base key. check_regex_or_str_match uses beginning-of-string regex matching before exact equality;
  malformed regex, missing dict key or incompatible input raises rather than silently allowing.

  Root model_list is rejected before all opt-ins. Scan the B2360 banned names in their fixed order,
  checking presence even for null/empty values. Literal True in general_settings.allow_client_side_credentials
  allows the remaining non-URL banned fields in that container; a per-model grant skips only its own
  field, so another banned field still fails. Rejecting a field raises ValueError describing the field
  and explicit admin opt-ins; B757 projects it to 401 auth_error, param "None", code 401. Credentials
  are never echoed. Do not use the stale docstring's 400 or resurrect check_complete_credentials.

  Traverse root, then litellm_embedding_config and extra_body, then metadata and litellm_metadata,
  including bracket-form metadata[...] via B1101 extract_nested_form_metadata, then fallback targets,
  then litellm_params.metadata. Each container can be a dict or a JSON string; malformed JSON and
  nonobject values become None. This is a single-level scan, not arbitrary recursion into config.
  B192 supplies safe JSON parsing; only the wrapper's bound/typed projection belongs here.

  Fallback traversal reads fallbacks, context_window_fallbacks and content_policy_fallbacks from root
  and a mapping router_settings_override. Only list values are traversed. Yield strings; yield a mapping
  unless it has nonempty values that are all lists. A mapping with string model recurses only through
  its three fallback fields; other mappings recurse through all values. Check depth before type and
  fail only when depth > 2*litellm.ROUTER_MAX_FALLBACKS, default 5 from int(ROUTER_MAX_FALLBACKS).
  Therefore a scalar at excessive depth also fails. Use B009 provider_url_destination_candidates;
  HTTP/HTTPS candidates, case-insensitively, are refused under the existing destination deviation even
  when provider_url_destination_allowed_hosts would allow them in LiteLLM. Other model strings pass.
  Dict targets undergo the banned scan using the original request model's opt-ins, then their model
  string gets the URL check. Successful traversal returns True and performs no network or DB action.


  Build the production request_body_safety module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  check_regex_or_str_match (L159-L165; 7 source lines), _is_param_allowed (L168-L189; 20 source lines),
  _allow_model_level_clientside_configurable_parameters (L192-L220; 24 source lines),
  _check_banned_params (L380-L420; 33 source lines), _iter_fallback_field_values
  (L430-L435; 6 source lines), _iter_fallback_targets (L438-L455; 18 source lines), iter_request_fallback_targets
  (L458-L460; 3 source lines), _reject_url_valued_fallback_target (L463-L474; 12 source lines), is_request_body_safe
  (L477-L539; 60 source lines), _coerce_metadata_to_dict (L542-L559; 16 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.allow_client_side_credentials=None;
  litellm_settings.provider_url_destination_allowed_hosts=[]; model_info.configurable_clientside_auth_params=None;
  ROUTER_MAX_FALLBACKS=5, also exposed as litellm.ROUTER_MAX_FALLBACKS. The allowed-host setting loads
  for compatibility but cannot authorize request destinations in betterlite.


  Add the request_body_safety operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a request-body-safety-*
  seed to B171 helper_case, which already owns this decoder.


  Send forbidden request fields through the existing inference route with B732's safety stage installed;
  assert rejection before provider dispatch and compare the complete public error. Pure traversal cases
  separately establish which nested field caused the denial, using B2360's actual catalog.


  Write betterlite-config::request_body_safety::tests::credential_opt_in_default_and_literal_true,
  model_param_grants_load, allowed_hosts_load_without_bypass, fallback_depth_default_override,
  fallback_depth_bad_integer_startup and fallback_depth_nonpositive. The env uses int() with no fallback
  for invalid text; do not silently clamp zero or negative values.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary request_body_safety::decode_request_metadata(&[u8]) -> Result<TypedValue,DecodeError>
  for request metadata accepted as an object or JSON string. Production calls this decoder before its
  typed policy functions; the cargo-fuzz target request_body_safety calls that same function. Seed valid,
  truncated, malformed, duplicate-field and limit-boundary inputs and add request_body_safety::tests::replays_the_request_body_safety_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B733 owns crates/betterlite-auth/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  Sizing: 199 original source lines after moving the 21-line catalog builder to B2360; allow
  240 production, 280 behavior tests, 65 adapters, 65 wiring, 55 decoder/fuzz and 65 config lines,
  770 within an 800-line gate. The larger static catalog is budgeted only in B2360. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: destination_opt_in_still_denied,
  fallback_allowlisted_host_denied, metadata_byte_limit and metadata_depth_limit. Exercise the precise
  changed setting/output branch and assert its configured status/error/side effects; do not add these
  differing results to oracle equality cases.


  Server wiring tests live under betterlite-server::auth::request_body_safety::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
