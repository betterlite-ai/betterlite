deviations:
  - what: Every banned destination/observability URL field is rejected by name with 401 auth_error regardless
      of credential opt-in; URL fallback destinations also remain rejected.
    why: 'Architect security decision: requests cannot retarget credentials or payloads.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L306-L539
  - what: New otherwise unbounded byte decoders reject over 1048576 bytes or JSON depth 64, respecting
      smaller inherited limits.
    why: Bound the specific outside-byte decoder named in this task; typed helpers inherit no artificial
      parser behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L159-L165
