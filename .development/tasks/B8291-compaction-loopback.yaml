id: B8291
title: Native compaction loopback executor
description: >-
  Port litellm/proxy/native_compaction.py (90 lines). When a request asks for native compaction, the router needs a
  summary from a model, and LiteLLM gets it by sending a second, child request to its own proxy over an in-memory ASGI
  client. The file builds that executor. B336 owns the router side: the executor trait (LiteLLM's `CompactionExecutor`),
  `native_compaction_call` and the code that asks the executor for a summary. This task builds the executor that answers.

  Code goes in crates/betterlite-server/src/compaction_loopback.rs and compaction_loopback/. Files: executor.rs (the
  struct and the trait impl), target.rs (the child path and URL), headers.rs (the header filter) and error.rs.
  `LoopbackError` is a thiserror enum with `ChildFailed { status: u16 }`, `InvalidChildBody` and `MissingModel`.
  Each maps to HTTP 400 with the type `invalid_request_error`, like LiteLLM's BadRequestError.

  `LoopbackExecutor` holds the app service to call (the same axum router the gateway serves, taken as a tower
  `Service` the caller passes in, so no network is used), the parent request's URL, its `root_path` (the mount
  prefix, empty by default), its headers and its peer address. The caller builds it once for each client request
  (B100's `executor_for`). It holds no privacy flag: LiteLLM's execute reads `turn_off_message_logging` from the
  inherited privacy context variable each time it is called (native_compaction.py L42), and B336 sets that variable
  right before the summary call. So the flag is an argument of each call.

  Its `execute(protocol, payload, parent_model, logging_disabled)` method implements B336's executor trait: `protocol`
  is `chat` or `messages`, `payload` is a JSON object, `parent_model` is an optional string and `logging_disabled` is the
  bool B336 decided for this summary call. It does this:
  1. The child path is `/v1/chat/completions` for chat and `/v1/messages` for messages. The URL is the parent URL with
     its path replaced by `root_path` (trailing slashes cut) plus the child path, and with the query and fragment removed.
  2. The child headers are every parent header except `content-length`, `x-litellm-call-id`,
     `x-litellm-num-retries`, `x-litellm-timeout` and `x-litellm-stream-timeout`. When `logging_disabled` is true,
     `litellm-disable-message-redaction` is dropped too. Names compare in lowercase. Header order and repeated headers
     stay as they were. LiteLLM decodes the name as latin-1 for the second list, and HTTP names are ASCII, so a plain
     lowercase compare is the same.
  3. The model name is `payload["model"]` as text. A missing or non-string model is `MissingModel`. LiteLLM raises a
     KeyError there.
  4. Around the call, B336's `native_compaction_call(parent_model, model)` scope is held, and the message logging
     privacy flag (B188's PrivacyContext) is set to the call's `logging_disabled`. B336 already ORed in what the parent
     inherited, and LiteLLM runs the child in a fresh context, so nothing else is inherited. Both scopes must also be on
     the task that runs the child request, because LiteLLM starts it with a fresh context copy and the scopes were set
     inside that task. Spawn the child as its own tokio task and set the scopes inside it.
  5. The child sends POST to the URL with the headers and the payload as JSON, with the parent's peer address on the
     request. Use the service in memory.
  6. A status outside 200 to 299 gives `ChildFailed` with text "Native compaction child request failed (HTTP <status>)".
     The model is "context_compaction" and the provider is the empty string.
  7. The body is read in full, then parsed as one JSON object. Anything else (an array, a number, bad JSON) gives
     `InvalidChildBody` with text "Native compaction child returned an invalid JSON object". The result is the parsed map.

  `with_proxy_compaction_executor` in LiteLLM puts the executor into a context variable for the length of one call and
  resets it. A Rust call cannot read a context variable, so this task builds only the executor. B100 builds one per
  client request, and B9810 passes it to B336's compact_to_fit on the gateway's chat, messages and responses routes.

scope:
