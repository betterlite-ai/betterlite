    why: The five removed header names.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/native_compaction.py#L38-L84
    why: The executor, the child path, the header filter, the child call and both error messages.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/native_compaction.py#L86-L90
    why: Installing the executor for one call. That stays with the request pipeline.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/context_compaction.py#L40-L60
    why: The executor protocol and its context variable. B336 turns them into a trait.
