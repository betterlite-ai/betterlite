    why: UNTRUSTED_REQUEST_HEADER_CONTROL_FIELDS holds the one name, litellm-disable-message-redaction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/initialize_dynamic_callback_params.py#L15-L21
    why: inherit_message_logging_privacy ORs the new flag into the inherited one.

dod:
  - text: The child path and URL follow the protocol and root_path rules, with the query and fragment removed and trailing slashes on root_path cut.
    proof: [target-tests]
  - text: The header filter drops the five names always and litellm-disable-message-redaction only when logging is disabled, in any letter case, and keeps order and duplicates.
    proof: [header-tests]
  - text: A non-2xx child gives ChildFailed with the status in the text, and a body that is not a JSON object gives InvalidChildBody.
    proof: [executor-tests]
  - text: A successful child returns the parsed object, and the call runs in its own task with the compaction and privacy scopes set inside it.
    proof: [executor-tests]
  - text: A payload without a string model gives MissingModel and sends no request.
    proof: [executor-tests]
  - text: Every LoopbackError maps to HTTP 400 with the type invalid_request_error.
    proof: [error-tests]

checks:
  optional: [mutants]
  commands:
    - id: target-tests
      why: the child path or URL rules are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^compaction_loopback::target::tests::/)'
    - id: header-tests
      why: the header filter drops or keeps the wrong names
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^compaction_loopback::headers::tests::/)'
    - id: executor-tests
      why: the child call, its status handling, its body parse or its scopes are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^compaction_loopback::executor::tests::/)'
    - id: error-tests
      why: an error maps to the wrong HTTP status or type
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^compaction_loopback::error::tests::/)'

oracle_cases: []

deviations:
  - what: logging_disabled is passed in when the executor is built. LiteLLM reads turn_off_message_logging from a context variable when the child is sent.
    why: Rust has no context variables, and the value cannot change during one client request.
  - what: A missing or non-string model is MissingModel (HTTP 400). LiteLLM raises KeyError and the proxy turns it into a 500.
    why: B336 always sets a model, so only a bug reaches this, and a typed error is clearer.
  - what: The child request goes through the tower service in memory. LiteLLM uses its own ASGI client (litellm/llms/custom_httpx/asgi_handler.py).
    why: Same effect, no socket, and axum already serves a tower service.

out_of_scope:
  - "CompactionExecutor, native_compaction_call, the compaction state and the summary request: B336."
  - "The privacy scope itself (inherit_message_logging_privacy): B188."
  - "The call site that wraps the model call (common_request_processing.py L2626): the request pipeline."
  - "get_async_asgi_client (litellm/llms/custom_httpx/asgi_handler.py): B171 inventory, replaced here by the tower service."

pitfalls:
  - "The child must carry the parent's Authorization header, so the filter must not drop it. Only the five names and the redaction opt-out go."
  - "Drop the redaction opt-out header only when logging is disabled. When logging is on, the child keeps it."
  - "root_path may be empty or end in a slash. Cut trailing slashes before adding /v1/chat/completions."
  - "The scopes must be set inside the spawned task. Setting them in the caller does not reach the child."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
