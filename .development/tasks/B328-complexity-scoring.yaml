id: B328
title: Local complexity scoring and default tiers
description: Introduce the default complexity_router marker and typed baseline configuration in betterlite-config.
  Implement the seven local dimensions, keyword customization, score-to-tier boundaries and reasoning
  override using checked Decimal scoring. Keep request extraction behind a typed prompt input for B330.
  Add baseline tier-to-model mapping sufficient for a single configured model per tier, and record the
  typed decision through B012. Carry pinned keyword/default data as reviewed fixtures where large; do
  not train a new classifier. Use the existing Rust crate boundaries from B004 and B008; integrate through
  the server when the provider dispatcher or callbacks live in another core crate. This task's source
  slices are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the
  matching adapters to B301's component runner where state is not observable over HTTP; adapters call
  production logic and never reproduce it. Use deterministic candidate sets or supplied random samples
  for comparisons, and separate seeded distribution tests for random choices. Extend the existing config_yaml
  fuzz target and committed corpus for every newly accepted config form; unsupported keys still fail by
  full path. Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle
  cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/complexity-scoring/**
  - tools/oracle/src/router_probes/complexity-scoring/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/complexity_scoring.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L1555-L1803
  why: Exact dimension computation, user-only scoring and boundaries.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L44-L95
  why: Default tier ordering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L853-L1015
  why: Base configuration keys and defaults.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/README.md#L1-L72
  why: Baseline configuration examples.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(complexity_scoring)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/complexity-scoring/seven-dimension-vectors.yaml
- tools/oracle/cases/routing/complexity-scoring/system-text-does-not-score.yaml
- tools/oracle/cases/routing/complexity-scoring/negative-simple-indicator.yaml
- tools/oracle/cases/routing/complexity-scoring/threshold-equality.yaml
- tools/oracle/cases/routing/complexity-scoring/reasoning-override-floor.yaml
- tools/oracle/cases/routing/complexity-scoring/explicit-zero-override.yaml
- tools/oracle/cases/routing/complexity-scoring/custom-keywords.yaml
- tools/oracle/cases/routing/complexity-scoring/default-tier-model.yaml
deviations: []
out_of_scope:
- Advanced tier schema and custom dimensions (B329).
- External classifiers (B331-B333), session controls and adaptive routing.
pitfalls:
- The scorer's token estimate is its pinned heuristic, not B013's tokenizer.
- Do not clamp negative scores to zero.
- Boundary cases must report any Decimal-versus-float difference rather than hiding a route mismatch.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
