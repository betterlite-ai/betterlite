id: B328
title: Local complexity scoring and default tiers
description: 'Introduce the default complexity_router marker and typed baseline configuration in betterlite-config.
  Implement the seven local dimensions, keyword customization, score-to-tier boundaries and reasoning
  override using the pinned statistical score arithmetic. Keep request extraction behind a typed prompt
  input for B330. Add baseline tier-to-model mapping sufficient for a single configured model per tier,
  and record the typed decision through B012. Carry pinned keyword/default data as reviewed fixtures where
  large; do not train a new classifier. Nonmonetary statistical arithmetic uses f64 only in complexity_math;
  put one module-level #[expect(clippy::float_arithmetic, reason = "pinned statistical routing arithmetic")]
  there, counted in this task budget. Money, prices, spend and budgets stay rust_decimal::Decimal, including
  database and wire boundaries. Reject nonfinite statistical input. Assert selected model/tier exactly;
  any opt-in tolerance is for diagnostic scores only, never a different selection. Configuration boundary
  keys introduced or consumed here: tier_models, complexity_thresholds, dimension_weights, code_keywords,
  reasoning_keywords, technical_keywords, custom_technical_keywords, simple_keywords, default_model. Pinned
  declaration defaults: dimension_weights=lambda: DEFAULT_DIMENSION_WEIGHTS.copy(); code_keywords=None;
  reasoning_keywords=None; technical_keywords=None; custom_technical_keywords=None; simple_keywords=None;
  default_model=None. Resolve env values once in betterlite-config, never in router code. Implement the
  owned native service in crates/betterlite-router/src/complexity_scoring.rs. Add ProbeOperation::ComplexityScoring
  in tools/oracle/src/router_probes/mod.rs and the corresponding B328 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/complexity_router.py:
  _tier_name (L151-L153), _built_in_tier_or_none (L156-L158), DimensionScore.__init__ (L1028-L1031), _allowed
  (L1222-L1223), _RequestContextFit.accepts (L1251-L1252), ComplexityRouter._estimate_tokens (L1555-L1560),
  ComplexityRouter._score_token_count (L1562-L1572), ComplexityRouter._keyword_matches (L1574-L1593),
  ComplexityRouter._score_keyword_match (L1595-L1625), ComplexityRouter._count_custom_hits (L1627-L1632),
  ComplexityRouter._score_custom_dimensions (L1634-L1647), ComplexityRouter._score_multi_step (L1649-L1654),
  ComplexityRouter._score_question_complexity (L1656-L1661), ComplexityRouter.classify (L1663-L1670),
  ComplexityRouter._score_and_classify (L1672-L1769), ComplexityRouter._is_near_tier_boundary (L1771-L1778),
  ComplexityRouter._effective_reasoning_override_min_score (L1780-L1790), ComplexityRouter._effective_tier_boundaries
  (L1792-L1803), ComplexityRouter._build_routing_decision (L1805-L1890). Implement these behaviors through
  the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. Function coverage in litellm/router_strategy/complexity_router/config.py:
  tier_severity_order (L87-L88). Implement these behaviors through the typed Rust services above; synchronous
  facades and structural accessors reuse the same primitive instead of separate ports. If floating diagnostics
  differ, a case may use absolute_tolerance=0.000000000001 only on its explicitly named score/probability
  pointer. Selection, tie order, counts, statuses, money and provider requests remain exact. Six-decimal
  wire signals are compared after the source rounding, without widening tolerance.'
