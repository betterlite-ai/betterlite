id: B4579
title: CLI key management and encryption migration commands
description: >-
  Build the keys and encryption command groups of betterlite-management-cli in Rust, ported from LiteLLM's litellm/proxy/client/cli/commands/keys.py and encryption.py. The keys group lives in tools/management-cli/src/commands/keys.rs and keys/**, the encryption group in tools/management-cli/src/commands/encryption.rs and encryption/**. Each group is a clap Subcommand enum with LiteLLM's command names (keys list, generate, delete and import; encryption migrate), option names, defaults and help texts, so the CLI root can mount it. Each command takes B4560's context values (base_url and the optional api_key), a betterlite_redact::secret::Redactor and two injected writers for stdout and stderr, and returns Ok or its module's own error enum. That enum has an Aborted variant for click.Abort (the root prints "Aborted!" to stderr and exits 1), a Usage variant for click.BadParameter (the root reports it on stderr and exits 2), and variants for everything else (the root prints the text on one line to stderr and exits 1, where Python printed a traceback and exited 1).

  docs/compatibility.md decides what is ported. Command and option names, the requests sent (paths, query, body fields, headers), pagination at 100, the two created_since formats, the lines the commands print, the exit codes and the streams stay LiteLLM's. Python's truthiness, str() and repr text and json.dumps formatting are not copied: a field that is absent or null takes its default, an explicit value is used as given, and a value outside LiteLLM's declared type is an error that names the field. Error texts are betterlite's own words, as rule errors-match-litellm says.

  HTTP. LiteLLM's KeysManagementClient and HTTPClient sit in the Python client package (B169), so this task carries the requests these commands send, in keys/** and encryption/**, on the shared client B4580 builds in tools/management-cli/src/commands.rs: reqwest, rustls, a current-thread tokio runtime, 30-second connect and read timeouts, the base URL with its trailing slashes stripped, and Authorization: Bearer {api_key} added when a key is given. Key requests always send Content-Type: application/json, including the GET requests the shared client otherwise sends with no body header, so keys.rs sets that header itself on every call. The keys client sends GET {base}/key/list with a query parameter only for each option given (page, size, user_id, team_id, organization_id, key_hash, key_alias, return_full_object, include_team_keys, booleans as "true" or "false"), POST {base}/key/generate with a JSON object of only the fields given (models, aliases, spend, duration, key_alias, team_id, user_id, budget_id, config), and POST {base}/key/delete with {"keys": ..., "key_aliases": ...}, null for a list not given. A status from 400 to 599 is an HTTP error that keeps the status and the body, and its text is "HTTP {status} {reason} for {method} {url}" with the status's standard reason phrase and the full request URL. In the keys client a 401 is Unauthorized instead (UnauthorizedError), with that same text passed through Redactor::redact_string; HTTPClient has no 401 case and redacts nothing. Any other status parses the body as JSON, and a body that isn't JSON is an error that names the URL. Tests build the Redactor with betterlite_redact::secret::MINIMUM_CUSTOM_KEY_LENGTH (16), the default of LiteLLM's MINIMUM_CUSTOM_KEY_LENGTH env var.

  Output. Where LiteLLM calls rich.print_json, betterlite writes the parsed response as standard JSON, pretty-printed with a two-space indent (serde_json::to_writer_pretty on a serde_json::Value), and a newline. Object keys come out in serde_json's map order, sorted by key since no crate turns on preserve_order, and numbers as serde_json writes them. docs/compatibility.md puts key order and 300 against 300.0 outside the contract, so tests parse stdout back to a Value, compare it with the expected value and check the text equals serde_json::to_string_pretty of it plus "\n". "Generated key: {response}" prints the response as compact one-line JSON (serde_json::to_string). Table cells are plain text: a string as it is, a number as its JSON text, and "" when the field is absent or null. Tables are drawn with comfy-table, default features off, and have no color.

  keys list takes --page and --size (integers), --user-id, --team-id, --organization-id, --key-hash, --key-alias, --return-full-object (a flag whose default is already true, so it is always sent as true), --include-team-keys (a flag, sent as false when absent) and --format table|json (default table). A response that is not a JSON object is an error in both formats (LiteLLM asserts a dict before it branches). With json it prints the response. With table it reads the response typed: keys is a list of objects (absent or null is an empty list) with token, key_alias, user_id and team_id as strings and spend as a number, each one allowed to be absent or null, and total_count is an integer that shows 0 when absent or null. It prints "Showing {n} keys out of {total}", then a table titled "API Keys" with the columns Key Hash, Alias, User ID, Team ID and Spend filled from token, key_alias, user_id, team_id and spend. A keys entry that is not an object, or a field of another type, is an error that names it. list has no error handler, so every client error goes back to the root unchanged.

  keys generate splits --models on commas and trims each part (empty parts stay, "a,,b" gives ["a", "", "b"]), reads --aliases as a JSON object of strings and --config as a JSON object (the types KeysManagementClient.generate declares), and takes --spend as a float and --duration, --key-alias, --team-id, --user-id and --budget-id as text. An option given empty is used as given: --models "" sends [""], --aliases "" and --config "" fail as invalid JSON, and an empty text option sends "". Text that doesn't parse returns Usage with "Invalid JSON: {serde_json's error}" before any request, and JSON of another type returns Usage with a message that names the option. The response prints as JSON. keys delete splits --keys and --key-aliases the same way. Both commands catch only an HTTP error, not Unauthorized and not a transport or JSON error: they print "Error: HTTP {status}" to stderr, then the error body as JSON to stdout when it parses as JSON or the raw body text to stderr when it doesn't, and return Aborted.

  keys import takes --source-base-url (required), --source-api-key, --dry-run and --created-since. It parses --created-since first, with chrono: a value with "_" in it must match %Y-%m-%d_%H:%M, any other value %Y-%m-%d, and a failure (an empty value included) prints "Error: Invalid date format '{value}'. Use YYYY-MM-DD_HH:MM or YYYY-MM-DD" to stderr and returns Aborted before any request. Then it prints "Fetching keys from source server: {source_base_url}" with the value as given and pages through the source's /key/list with a keys client built from --source-base-url and --source-api-key, sending page 1, 2 and on, size=100 and return_full_object=true. Each page must be a JSON object, and its keys read typed as source keys: models a JSON array, aliases and config JSON objects, spend a number, key_alias, team_id, user_id and budget_id strings, created_at a string, each one allowed to be absent or null, other fields ignored. A page that is not an object, or a field of another type, is an error that names the page and the field. The loop stops on an empty, absent or null keys list, prints "Fetched page {page}: {n} keys" for each page with keys, and stops after a page with fewer than 100.

  With --created-since given, import keeps only keys whose created_at is at or after the filter time; a key whose created_at is absent or null is left out. A created_at string is a date-time the way LiteLLM's API writes one, YYYY-MM-DDTHH:MM:SS with an optional fraction and an optional Z or +HH:MM offset. The offset is dropped without converting, as LiteLLM does, so the comparison uses the wall time as written. Any other string is an error that names created_at. Then it prints "Filtered {before} keys to {after} keys created since {created_since}". When no keys are left it prints "No keys found in source instance." and ends with success; otherwise it prints "Found {n} keys in source instance.". A dry run then prints "\n--- DRY RUN MODE ---" and a table titled "Keys that would be imported" with the columns Key Alias, User ID and Created, where Created is the created_at wall time as %Y-%m-%d %H:%M ("" when absent or null, the same error when it doesn't parse), and ends with no request to the destination.

  Otherwise each key goes to the destination's /key/generate (the context's base_url and api_key) with every one of models, aliases, spend, key_alias, team_id, user_id, budget_id and config that is present and not null, sent as given. So a spend of 0, an empty models list, empty aliases and config objects and an empty string id are sent, where LiteLLM's truthiness check left them out. docs/compatibility.md says an explicit value is used as given, and for most fields the key that gets created comes out the same: the destination's defaults are spend 0, models [], aliases {} and config {}, and it reads team_id "" as unset. A key_alias, user_id or budget_id of "" reaches the destination as "". false, or any other value outside a field's declared type, never reaches a request, because reading the page already failed on it. A success prints "Generated key: {response}" and then "Imported key: {alias}"; any error for that key, HTTP errors and Unauthorized included, prints "Failed to import key {alias}: {error}" to stderr and the loop goes on. alias is key_alias, "N/A" when it is absent or null. The command ends with "\nImport completed:", "  Successfully imported: {imported}", "  Failed to import: {failed}" and "  Total keys processed: {n}". Around the fetch, the filter and the import, an HTTP error prints the way generate prints it and returns Aborted, and any other error (Unauthorized, a bad page or field, a bad created_at, a transport or JSON error) prints "Error: {error}" to stderr and returns Aborted.

  encryption migrate with --check sends GET {base}/credentials/migrate-encryption/check; without it, POST {base}/credentials/migrate-encryption with the JSON body {} and the query dry_run=true only when --dry-run is set (--check wins when both are given). It sends through HTTPClient's rules: Content-Type only on the POST because of its JSON body, Bearer when a key is given, and no error handler, so every error goes back to the root unchanged. The response prints as JSON. Then the response must be an object; its report counts as an empty object when absent or null and is an error that names report when it is not an object. report's residual_legacy is an integer (MigrationReport.residual_legacy): above 0 prints "Residual legacy values remaining: {residual}", 0 prints "No legacy values remaining (residual_legacy == 0).", and absent, null or below 0 prints nothing. A residual_legacy that is not an integer is an error that names it. These errors come after the JSON print. Both lines go to stdout without color.

  Tests. Test functions live in tests.rs files under keys/ and encryption/ with the name prefixes the checks select: list_, generate_, delete_, import_, dates_, client_ and output_ under commands::keys, and migrate_ under commands::encryption. They run each command against a local HTTP server on 127.0.0.1:0 (axum is in Cargo.lock) that records the method, path, decoded query pairs, headers and body of every request and answers canned statuses and bodies. They compare the exact stdout and stderr bytes for the lines LiteLLM prints, and assert the returned error variant and the field or option its message names for betterlite's own error texts.
scope:
  paths:
    - tools/management-cli/Cargo.toml
    - Cargo.lock
    - tools/management-cli/src/commands/keys.rs
    - tools/management-cli/src/commands/keys/**
    - tools/management-cli/src/commands/encryption.rs
    - tools/management-cli/src/commands/encryption/**
  lint_tables: false
