dod:
  - text: >-
      keys list sends LiteLLM's query, prints the JSON or the "Showing" line and the API Keys table with str() cells, fails on a non-object response and passes client errors through.
    proof: [keys-list, python-text]
  - text: >-
      keys generate splits and parses its options like LiteLLM, fails bad JSON with "Invalid JSON", sends only the given fields, prints the response and handles HTTP errors with "Error: HTTP {status}", the body and Aborted, while Unauthorized passes through.
    proof: [keys-generate]
  - text: >-
      keys delete sends both lists with nulls kept, prints the response and handles HTTP errors like generate.
    proof: [keys-delete]
  - text: >-
      keys import validates --created-since first, pages the source at 100, filters by created_at, prints the dry-run table or imports truthy fields key by key with LiteLLM's messages and summary, and aborts with "Error: HTTP" or "Error: {error}".
    proof: [keys-import]
  - text: >-
      The created_since and created_at parsers accept and reject what strptime and Python 3.13 fromisoformat do, drop offsets without converting and give fromisoformat's error texts.
    proof: [keys-dates]
  - text: >-
      The key requests strip the base URL, send Content-Type and the Bearer header only with a non-empty key, use 30-second connect and read timeouts, give raise_for_status texts and redact the 401 text.
    proof: [keys-client]
  - text: >-
      JSON output is json.dumps with indent 2 in the server's key order with Python's number forms, and str() and repr follow Python for every JSON value.
    proof: [python-text]
  - text: >-
      encryption migrate sends the check GET or the migrate POST with dry_run only when asked, prints the response and the residual_legacy line by Python's comparisons, and passes every error through.
    proof: [encryption-migrate]
checks:
  optional: []
  commands:
    - id: keys-list
      why: the keys list tests are missing or the query, table or JSON output differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::list_/)'
    - id: keys-generate
      why: the keys generate tests are missing or the body, output or error path differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::generate_/)'
    - id: keys-delete
      why: the keys delete tests are missing or the body, output or error path differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::delete_/)'
    - id: keys-import
      why: the keys import tests are missing or a message, page request, filter or summary differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::import_/)'
    - id: keys-dates
      why: the date tests are missing or a created_since or created_at value parses differently from Python
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::dates_/)'
    - id: keys-client
      why: the request tests are missing or a URL, header, timeout or error text differs from LiteLLM's client
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::client_/)'
    - id: python-text
      why: the Python text tests are missing or JSON, str() or repr output differs from Python
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::python_text_/)'
    - id: encryption-migrate
      why: the encryption tests are missing or a request, output line or error path differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::encryption::.*tests::migrate_/)'
oracle_cases: []
deviations:
  - what: >-
      Tables are drawn with comfy-table (default features off). The title, column headers, row order and cell text are LiteLLM's, but borders, column widths and wrapping differ from rich's, and cell text is never read as rich markup.
    why: >-
      rich's table layout is a large port for output people read, and B4578 draws its tables the same way. Scripts use --format json, and that output matches byte for byte.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L97-L112
  - what: >-
      Where LiteLLM lets an exception out of a command (list's assert, Unauthorized or a transport error in generate and delete, every encryption error), Python prints a traceback and exits 1. betterlite returns the error, and the root prints its text on one line and exits 1.
    why: A traceback names Python files betterlite doesn't have; the exception text and the exit code stay.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L79-L90
  - what: >-
      A JSON parse error shows serde_json's description where Python shows its json module's ("Expecting value: line 1 column 1 (char 0)"), in "Invalid JSON: {error}", "Error: {error}" and "Failed to import key {alias}: {error}". The prefix, the stream and the exit code are LiteLLM's.
    why: The text describes the parser, and betterlite's parser is serde_json.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L145-L150
  - what: >-
      A refused connection, DNS failure, TLS failure or timeout shows reqwest's text where LiteLLM shows requests' and urllib3's ("HTTPConnectionPool(host=..., port=...): Max retries exceeded with url: ...").
    why: Those texts name urllib3's connection pool, which betterlite doesn't have; where the line goes and the exit code stay.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L410-L420
  - what: >-
      Option errors come from clap. A bad --page, --size or --spend, an unknown option or a missing --source-base-url exits 2 as in click, with clap's wording.
    why: The CLI root parses arguments with clap, the parser the betterlite binary already uses.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L350-L365
out_of_scope:
  - The CLI root mounts both groups and prints "Aborted!", usage errors and error texts (main.py L153 and L160); that is B134's.
  - The context values base_url and api_key and the config file they come from are B4560's.
  - KeysManagementClient and HTTPClient as an importable Python API are B169's (the M12 Python package); this task ports only the requests these commands send.
  - >-
    The /key/list, /key/generate and /key/delete routes are B055's, and /credentials/migrate-encryption and /credentials/migrate-encryption/check (key_management_endpoints.py L5379 and L5419) are B785's.
  - The credentials, users, teams and model-groups groups are B4580's, and models is B4578's.
pitfalls:
  - >-
    A 401 from the keys client is Unauthorized, not an HTTP error, so generate and delete print no "Error: HTTP 401" line and import prints "Error: 401 Client Error: Unauthorized for url: ..." after redaction.
  - >-
    generate prints the whole response and import prints "Generated key: {...}", so the new key's secret reaches stdout on purpose; the api_key itself stays in a SecretString and is never printed.
  - >-
    requests encodes query values like urllib's quote_plus (a space becomes "+", "~" stays and "*" becomes %2A), so the URL inside an error text differs from the url crate's form encoder for those characters.
  - >-
    keys list always sends return_full_object=true and include_team_keys, while import's page requests send only page, size and return_full_object.
  - >-
    "Filtered {before} keys to {after} ..." counts before the filter, and a filter that leaves nothing still ends with "No keys found in source instance.".
  - >-
    A --created-since of "" counts as unset, so no filter runs and no date error prints.
  - >-
    A numeric created_at is dropped by the filter but still shown through str() in the dry-run table.
  - >-
    The error body of "Error: HTTP {status}" goes to stdout through print_json while the status line goes to stderr, and only a body that isn't JSON goes to stderr.
  - >-
    residual_legacy of 0.0 or false prints the "No legacy values remaining" line, and true prints "Residual legacy values remaining: True".
  - >-
    Python's float repr uses exponent form below 1e-4 and from 1e16 ("1e-05", "1e+16"), and Rust's Display never does.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
