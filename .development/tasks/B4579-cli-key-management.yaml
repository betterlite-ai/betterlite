      why: the request tests are missing or a URL, header, timeout, error text or redaction differs from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^commands::keys::.*tests::client_/)'
    - id: keys-output
      why: the output tests are missing or the JSON text, the one-line JSON or a table cell differs from the description
