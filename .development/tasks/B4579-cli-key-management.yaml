oracle_cases: []
deviations:
  - what: >-
      Tables are drawn with comfy-table (default features off). The title, column headers, row order and cell text are as the description says, but borders, column widths and wrapping differ from rich's, there is no color, and cell text is never read as rich markup.
    why: >-
      rich's table layout is a large port for output people read, and B4578 draws its tables with a Rust table crate too. Scripts use --format json.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L97-L112
out_of_scope:
  - The CLI root mounts both groups and turns Aborted, Usage and every other error into "Aborted!", usage output, one-line errors and exit codes (main.py L153 and L160); B134 covers main.py.
  - tools/management-cli/src/commands.rs declares the keys and encryption modules and holds the shared client this task's requests go through; B4580 owns that file.
  - The context values base_url and api_key and the config file they come from are B4560's.
  - KeysManagementClient and HTTPClient as an importable Python API are B169's (the M12 Python package); this task ports only the requests these commands send, on the shared client B4580 builds.
  - >-
    The /key/list, /key/generate and /key/delete routes are B055's, and /credentials/migrate-encryption and /credentials/migrate-encryption/check (key_management_endpoints.py L5378 and L5418) are B785's.
  - The credentials, users, teams and model-groups groups are B4580's, and models is B4578's.
pitfalls:
  - >-
    A 401 from the keys client is Unauthorized, not an HTTP error, so generate and delete print no "Error: HTTP 401" line, and import prints "Error: {redacted text}" for a 401 from the source and "Failed to import key {alias}: {redacted text}" for one from the destination.
  - >-
    The per-key handler in import catches HTTP errors too, so a 422 from the destination's /key/generate prints "Failed to import key {alias}: ..." and counts as failed; only the source fetch's HTTP errors reach "Error: HTTP {status}".
  - >-
    generate prints the whole response and import prints "Generated key: {...}", so the new key's secret reaches stdout on purpose; the api_key itself stays in a SecretString and is never printed.
  - >-
    keys list always sends return_full_object=true and include_team_keys, while import's page requests send only page, size and return_full_object.
  - >-
    "Filtered {before} keys to {after} ..." counts before the filter, and a filter that leaves nothing still ends with "No keys found in source instance." and exit 0.
  - >-
    The error body of "Error: HTTP {status}" goes to stdout as JSON while the status line goes to stderr, and only a body that isn't JSON goes to stderr.
  - >-
    "2024-05-01T23:30:00-02:00" compares as 23:30 on May 1, not as 01:30 UTC on May 2, because the offset is dropped, not applied.
  - >-
    The migrate POST carries Content-Type: application/json only because it has the body {}, and the check GET carries no Content-Type at all.
  - >-
    reqwest's query encoder and requests' quote_plus differ on characters such as "*" and "~", so tests compare decoded query pairs, not raw query strings.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
