id: B4579
title: CLI key management and encryption migration commands
description: >-
  Build the keys and encryption command groups of betterlite-management-cli in Rust, ported from LiteLLM's litellm/proxy/client/cli/commands/keys.py and encryption.py. The keys group lives in tools/management-cli/src/commands/keys.rs and keys/**, the encryption group in tools/management-cli/src/commands/encryption.rs and encryption/**. Each group is a clap Subcommand enum with LiteLLM's command names (keys list, generate, delete and import; encryption migrate), option names, types and help texts, so the CLI root can mount it. Each command takes B4560's context values (base_url and the optional api_key), a betterlite_redact::secret::Redactor and two injected writers for stdout and stderr, and returns Ok or its module's own error enum. click.Abort becomes an Aborted variant, and the root prints "Aborted!" to stderr and exits 1 the way click does. Every other error's Display is the text the Python exception shows (str(e)), and the root prints it and exits 1.


  HTTP. LiteLLM's KeysManagementClient and HTTPClient sit in the Python client package (B169), so this task carries the requests these commands send, in keys/** and encryption/**. Use reqwest 0.13.5 (already in Cargo.lock through betterlite-http) with default features off and rustls, async on a current-thread tokio runtime, with connect_timeout and read_timeout of 30 seconds each: requests' timeout=30 bounds the connect and every read, and reqwest's blocking client only has a total timeout. The base URL loses its trailing slashes. Key requests always send Content-Type: application/json, and both clients add Authorization: Bearer {api_key} only when the key is set and not empty. The keys client sends GET {base}/key/list with a query parameter only for each option given, in the order page, size, user_id, team_id, organization_id, key_hash, key_alias, return_full_object, include_team_keys, booleans as "true" or "false"; POST {base}/key/generate with a JSON object of only the fields given, in the order models, aliases, spend, duration, key_alias, team_id, user_id, budget_id, config; and POST {base}/key/delete with {"keys": ..., "key_aliases": ...}, nulls included. A status from 400 to 599 is an HTTP error whose text is requests' raise_for_status line, "{status} Client Error: {reason} for url: {url}" below 500 and "{status} Server Error: {reason} for url: {url}" from 500, with the status's standard reason phrase and the full request URL. In the keys client a 401 becomes Unauthorized instead, with that same line passed through Redactor::redact_string (UnauthorizedError in exceptions.py); HTTPClient has no 401 case and redacts nothing. Any other status parses the body as JSON. Tests build the Redactor with betterlite_redact::secret::MINIMUM_CUSTOM_KEY_LENGTH (16), the default of LiteLLM's MINIMUM_CUSTOM_KEY_LENGTH env var.


  Python text. rich.print_json(data=...) writes json.dumps(value, indent=2, ensure_ascii=False) and a newline to stdout. Keep object keys in the server's order with the last duplicate's value (OrderedJson in crates/betterlite-harness/src/payloads/python_json.rs shows the pattern with indexmap), and print numbers the way Python reads and writes them: an integer literal stays an integer ("-0" prints 0), and any other number is a float printed with Python's repr (1E5 prints 100000.0, 0.00001 prints 1e-05). serde_json is built with arbitrary_precision in this workspace (betterlite-redact turns it on), so a Number keeps the server's text and needs this conversion. "Generated key: {response}" and every table cell use Python's str() of the value: a string as is, None, True and False for null and booleans, and repr for numbers, lists and dicts, with Python's quote rules for strings inside them.


  keys list takes --page and --size (integers), --user-id, --team-id, --organization-id, --key-hash, --key-alias, --return-full-object (a flag whose default is already true, so it is always sent as true), --include-team-keys (a flag, sent as false when absent) and --format table|json (default table). With json it prints the response with print_json. With table it prints "Showing {n} keys out of {total}", where n is the length of keys and total is total_count, 0 when the key is missing and None when it is null, then a table titled "API Keys" with the columns Key Hash, Alias, User ID, Team ID and Spend filled from token, key_alias, user_id, team_id and spend, each cell str() of the value or "" when the field is missing. A response that is not a JSON object fails (LiteLLM's assert), and list has no error handler, so every client error goes back to the caller unchanged.


  keys generate splits --models on commas and strips each part (empty parts stay, "a,,b" gives ["a", "", "b"]), reads --aliases and --config with json.loads semantics (any JSON value), and takes --spend as a float, --duration, --key-alias, --team-id, --user-id and --budget-id as text; an empty option counts as absent. A JSON parse error fails before any request with a bad-parameter error "Invalid JSON: {error}", which the root reports as a usage error with exit 2 (click prints "Error: Invalid value: Invalid JSON: ..." after the usage line). The response prints with print_json. keys delete splits --keys and --key-aliases the same way. Both commands catch only an HTTP error, not Unauthorized and not a transport or JSON error: they print "Error: HTTP {status}" to stderr, then the error body with print_json to stdout when it parses as JSON or the raw body text to stderr when it doesn't, and return Aborted.


  keys import takes --source-base-url (required), --source-api-key, --dry-run and --created-since. It parses --created-since first: with "_" in it the value must match %Y-%m-%d_%H:%M, otherwise %Y-%m-%d, by strptime rules (a four-digit year, one- or two-digit fields, a real calendar date), and any failure prints "Error: Invalid date format '{value}'. Use YYYY-MM-DD_HH:MM or YYYY-MM-DD" to stderr and aborts before any request. Then it prints "Fetching keys from source server: {source_base_url}" with the value as given and pages through the source's /key/list with page 1, 2 and on, size=100 and return_full_object=true. It stops on an empty or missing keys list, prints "Fetched page {page}: {n} keys" for each page with keys, and stops after a page with fewer than 100. A page that is not a JSON object fails with "Expected dict response from list API". With --created-since set it keeps only keys whose created_at is a non-empty string at or after the filter time and prints "Filtered {before} keys to {after} keys created since {created_since}". When no keys are left it prints "No keys found in source instance." and ends with success; otherwise it prints "Found {n} keys in source instance.". A dry run then prints "\n--- DRY RUN MODE ---" and a table titled "Keys that would be imported" with the columns Key Alias, User ID and Created, and ends. Otherwise each key goes to the destination's generate with only the truthy fields among models, aliases, spend, key_alias, team_id, user_id, budget_id and config (Python truthiness, so 0, 0.0, "", [], {}, false and null are left out). A success prints "Generated key: {response}" and then "Imported key: {alias}"; any error prints "Failed to import key {alias}: {error}" to stderr and the loop goes on. alias is key_alias, "N/A" when the field is missing and None when it is null. The command ends with "\nImport completed:", "  Successfully imported: {imported}", "  Failed to import: {failed}" and "  Total keys processed: {n}". Around the fetch, filter and import, an HTTP error prints the way generate prints it and aborts, and any other error (Unauthorized, a bad created_at, a non-object page, a transport or JSON error) prints "Error: {error}" to stderr and aborts.


  Dates. A created_at string that holds "T" has every "Z" replaced by "+00:00" first, then both kinds parse with the rules of Python 3.13's datetime.fromisoformat (the Python the oracle runs), and a parsed offset is dropped without converting, so the comparison uses the wall time as written. A bad value gives fromisoformat's ValueError text, "Invalid isoformat string: '{value}'" for a shape it can't read and the range texts such as "month must be in 1..12" for a bad field. The dry-run Created cell formats a string that holds "T" as %Y-%m-%d %H:%M from those wall-time fields, shows any other string as it is, shows "" when the field is missing and str() of any other value. A created_at with "T" that doesn't parse fails the dry run with "Error: {error}" too.


  encryption migrate with --check sends GET {base}/credentials/migrate-encryption/check; without it, POST {base}/credentials/migrate-encryption with the JSON body {} and the query dry_run=true only when --dry-run is set (--check wins when both are given). It sends through HTTPClient rules: no Content-Type on the GET, Bearer only with a non-empty key and no error handling, so every error goes back unchanged. The response prints with print_json. Then, when the response is an object, report is its "report" value, an empty object when the key is missing; a report that is null or not an object fails after the print, the way Python's AttributeError does. residual_legacy above 0 prints "Residual legacy values remaining: {residual}", equal to 0 prints "No legacy values remaining (residual_legacy == 0).", and missing, null or negative prints nothing. Python compares true as 1 and false as 0, and a string residual fails with a TypeError after the print. Both lines go to stdout without color.


  Tests. Test functions live in tests.rs files under keys/ and encryption/ with the name prefixes the checks select: list_, generate_, delete_, import_, dates_, client_ and python_text_ under commands::keys, and migrate_ under commands::encryption. They run each command against a local HTTP server on 127.0.0.1:0 (axum is in Cargo.lock) that records the method, path, query, headers and body of every request and answers canned statuses and bodies, and they compare the exact stdout and stderr bytes with the LiteLLM texts above.
scope:
  paths:
    - tools/management-cli/Cargo.toml
    - tools/management-cli/src/commands/keys.rs
    - tools/management-cli/src/commands/keys/**
    - tools/management-cli/src/commands/encryption.rs
    - tools/management-cli/src/commands/encryption/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L35-L112
    why: The keys group and list, with the option defaults, the "Showing" line, the API Keys table and the dict assert.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L115-L171
    why: generate, with the comma split, the "Invalid JSON" BadParameter and the HTTP error handler that aborts.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L174-L194
    why: delete, with the same split and error handler.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/keys.py#L197-L274
    why: The created_since parse and its error text, pagination at 100 and the created_at filter.
