out_of_scope:
  - KeysManagementClient and HTTPClient implementation (B169 manages the client library).
  - The actual /credentials/migrate-encryption and /credentials/migrate-encryption/check server endpoints (B785 implements the HTTP migration/attestation handlers).
  - Advanced filtering, sorting, or field selection beyond what the listed options provide.
  - Multi-page streaming or incremental display; pagination is load-all-at-once.
pitfalls:
  - Pagination is fixed at 100 records per page in import, not configurable; iteration stops when fewer than 100 records are returned on a page.
  - Timestamp filtering parses created_since as a user-supplied string in YYYY-MM-DD_HH:MM or YYYY-MM-DD format and compares it against key created_at as an ISO 8601 datetime string; handle both timezone-aware and naive datetimes.
  - Truthy-only field copying means only include a field in import_data if key.get(field) evaluates to True; do not copy empty strings, zero, False, or None.
  - Per-key failure continuation in import_keys means one exception does not stop the loop; catch and log each error and continue with the next key.
  - The import command shows total_count from the list response, and the import summary counts attempted keys (sum of imported plus failed), not the total_count from the gateway.
  - Residual-legacy reporting uses response.get("report", {}) and then report.get("residual_legacy"); neither the report key nor residual_legacy is guaranteed, so compare with None and format accordingly.
  - --return-full-object default is True in the CLI options but is passed explicitly to the client; --include-team-keys default is False.
  - KeysManagementClient is initialized with base_url and api_key from the click context (ctx.obj); HTTPClient follows the same pattern.
review_level: security
