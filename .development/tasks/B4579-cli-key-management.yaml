id: B4579
title: CLI key management, migration and encryption commands
description: >-
  Build key list/generate/delete, cross-gateway key recreation, and encryption migration/check
  output for betterlite-management-cli. The keys command manages API keys: list by user/team/
  organization/hash/alias with optional team-keys inclusion and full-object return, display as
  table or JSON output; generate with models/spend/duration/team/user/budget constraints; delete
  by hash or alias; and import keys from another gateway with optional creation-date filtering
  and dry-run preview. Preserve pagination at 100 records per page, naive timestamp filtering on
  YYYY-MM-DD_HH:MM or YYYY-MM-DD format, truthy-only field copying (only copy key fields that
  have a truthy value), per-key failure continuation (one failed import does not stop the rest),
  and residual-legacy reporting in encryption output. The encryption command executes migration
  or attestation: GET /credentials/migrate-encryption/check reports remaining legacy values,
  and POST /credentials/migrate-encryption with dry_run true/false performs or simulates the
  migration. Encryption output displays the residual_legacy count in the response and renders it
  as a colored message. Every HTTP operation (list, generate, delete, import, migrate, check) is
  backed by management client calls to KeysManagementClient or HTTPClient, injected for
  testability; error responses are parsed and displayed to stderr.
