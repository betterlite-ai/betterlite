dod:
  - text: >-
      The keys list command accepts page, size, user-id, team-id, organization-id, key-hash,
      key-alias, --include-team-keys (toggle, default False), and --return-full-object (toggle,
      default True) filters; returns full key objects by default; displays a table with key hash,
      alias, user ID, team ID and spend; and outputs JSON on --format json.
    proof: [list-command]
  - text: >-
      The keys generate command accepts models (comma-separated), aliases (JSON), spend,
      duration, key-alias, team-id, user-id, budget-id and config (JSON) parameters; parses
      JSON fields with BadParameter error handling; calls the client; and outputs the response
      or prints HTTP errors to stderr with the response body.
    proof: [generate-command]
  - text: >-
      The keys delete command accepts keys (comma-separated list of key hashes) and key-aliases
      (comma-separated list of aliases), calls the client with both, and handles HTTP errors.
    proof: [delete-command]
  - text: >-
      The keys import command fetches all keys from a source gateway using pagination (100 per
      page), filters by created-since date if provided (format YYYY-MM-DD_HH:MM or YYYY-MM-DD),
      displays a dry-run table with key alias, user ID and created date, imports keys to the
      destination by calling generate with only truthy fields from the source, continues
      importing remaining keys even if one fails, and reports counts of successfully imported
      and failed keys.
    proof: [import-command]
  - text: >-
      The encryption migrate command with --check sends GET /credentials/migrate-encryption/check,
      without --check sends POST /credentials/migrate-encryption with dry_run query parameter
      true when --dry-run is set, outputs the JSON response, and displays residual_legacy count
      from the response with green text if zero and yellow if greater than zero.
    proof: [encryption-command]
  - text: Created-since filtering parses both YYYY-MM-DD_HH:MM and YYYY-MM-DD formats and filters keys by comparing parsed timestamp against key created_at field.
    proof: [timestamp-parsing-both-formats]
  - text: Key import continues importing remaining keys even when one key import fails, and reports the total count including failed attempts.
    proof: [import-failure-continuation]
