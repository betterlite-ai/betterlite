      why: keys list command does not accept all options or does not pass them to the client
      run: grep -qF '@keys.command()' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF -- '--include-team-keys' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF -- '--return-full-object' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'client.list' tools/management-cli/litellm/proxy/client/cli/commands/keys.py
    - id: generate-command
      why: keys generate command does not handle JSON parsing or pass all parameters to the client
      run: grep -qF 'def generate' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'json.loads' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'BadParameter' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'client.generate' tools/management-cli/litellm/proxy/client/cli/commands/keys.py
    - id: delete-command
      why: keys delete command does not parse comma-separated lists or pass them to the client
      run: grep -qF 'def delete' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'split' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'client.delete' tools/management-cli/litellm/proxy/client/cli/commands/keys.py
    - id: import-command
      why: keys import command does not fetch all keys, filter, display dry-run table, or handle per-key failures
      run: grep -qF 'def import_keys' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF '_fetch_keys_paginated' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF '_filter_keys_by_created_since' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF '_display_dry_run_table' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF '_import_keys_to_destination' tools/management-cli/litellm/proxy/client/cli/commands/keys.py
    - id: encryption-command
      why: encryption migrate command does not send the correct request or handle the response
      run: grep -qF 'def migrate' tools/management-cli/litellm/proxy/client/cli/commands/encryption.py && grep -qF '/credentials/migrate-encryption/check' tools/management-cli/litellm/proxy/client/cli/commands/encryption.py && grep -qF 'dry_run' tools/management-cli/litellm/proxy/client/cli/commands/encryption.py && grep -qF 'residual_legacy' tools/management-cli/litellm/proxy/client/cli/commands/encryption.py
    - id: timestamp-parsing-both-formats
      why: created-since filtering does not parse both YYYY-MM-DD_HH:MM and YYYY-MM-DD formats correctly
      run: grep -qF 'def _parse_created_since_filter' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF '%Y-%m-%d_%H:%M' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF '%Y-%m-%d' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && test "$(grep -c '%Y-%m-%d' tools/management-cli/litellm/proxy/client/cli/commands/keys.py)" -ge 2
    - id: import-failure-continuation
      why: key import does not continue after a failure or does not report counts correctly
      run: grep -qF 'except Exception as e:' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'failed_count' tools/management-cli/litellm/proxy/client/cli/commands/keys.py && grep -qF 'imported_count' tools/management-cli/litellm/proxy/client/cli/commands/keys.py
