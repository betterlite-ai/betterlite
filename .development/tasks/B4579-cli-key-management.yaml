dod:
  - text: >-
      keys list sends LiteLLM's query, fails on a non-object response in both formats, prints the JSON or the "Showing" line and the API Keys table with plain cells, rejects a field of another type by name and passes client errors through.
    proof: [keys-list, keys-output]
  - text: >-
      keys generate splits and parses its options, uses empty options as given, returns Usage for bad or wrongly typed JSON, sends only the given fields, prints the response and handles HTTP errors with "Error: HTTP {status}", the body and Aborted, while Unauthorized passes through.
    proof: [keys-generate]
  - text: >-
      keys delete sends both lists with nulls kept, prints the response and handles HTTP errors like generate.
    proof: [keys-delete]
  - text: >-
      keys import checks --created-since first, pages the source at 100, reads source keys typed, filters by created_at, prints the dry-run table or copies every present non-null field key by key with LiteLLM's messages and summary, and aborts with "Error: HTTP" or "Error: {error}".
    proof: [keys-import]
  - text: >-
      The created_since parser takes the two formats and rejects anything else with LiteLLM's line, and the created_at parser takes the API's date-time forms, drops the offset without converting and rejects any other string by name.
    proof: [keys-dates]
  - text: >-
      The requests strip the base URL, send Content-Type and Bearer by the two clients' rules, use 30-second connect and read timeouts, give betterlite's HTTP error text and redact the 401 text in the keys client only.
    proof: [keys-client]
  - text: >-
      JSON output is standard JSON with a two-space indent and a newline, "Generated key" carries one-line JSON, and table cells show strings and numbers as plain text and "" for absent or null.
    proof: [keys-output]
  - text: >-
      encryption migrate sends the check GET or the migrate POST with dry_run only when asked, prints the response, prints the residual_legacy line for an integer report value, rejects a non-object report or a non-integer residual by name and passes every client error through.
    proof: [encryption-migrate]
