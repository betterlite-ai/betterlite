id: B245
title: OpenAI-like provider error classification
description: >-
  Implement _map_openai_like_exception (732-851) over B236 facts, preserving message and status precedence and source
  status semantics. Each predicate gets a separate helper case. Budget 160 classifier, 100 adapters, 260 tests and
  40 wiring (560 total). Write the behavior rstest functions openai_like_errors_behavior_tests_behavior in adjacent tests.rs files,
  with a named case for each behavior and failure in the DoD; corpus replay tests have separate names. Register
  helper operations openai_like_errors in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-error/Cargo.toml
  - crates/betterlite-error/src/lib.rs
  - crates/betterlite-error/src/error.rs
  - crates/betterlite-error/src/openai_like.rs
  - crates/betterlite-error/src/openai_like/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/openai-like-errors/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L732-L851
  why: OpenAI-like classifier.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/::openai_like_errors_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'openai_like_errors' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/openai-like-errors/context.yaml
- tools/oracle/cases/helpers/openai-like-errors/auth.yaml
- tools/oracle/cases/helpers/openai-like-errors/rate-limit.yaml
- tools/oracle/cases/helpers/openai-like-errors/not-found.yaml
- tools/oracle/cases/helpers/openai-like-errors/server.yaml
- tools/oracle/cases/helpers/openai-like-errors/unknown-status.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B185 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
