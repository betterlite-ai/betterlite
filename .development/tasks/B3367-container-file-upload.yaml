deviations:
  - what: extra_body is accepted as an optional parameter in the operation signature but is not forwarded to the executor.
    why: The LiteLLM source accepts extra_body but does not pass it to the generic container handler, so this implementation matches that behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/containers/main.py#L1264

out_of_scope:
  - B3360 owns ContainerFileObject and upload contract validation; this task uses them without modification.
  - B3361 owns decode_managed_container_id_for_request and ProviderConfigManager.get_provider_container_config; this task calls them to resolve provider and ID.
  - B3363 owns GenericContainerHandler and handle method; this task delegates file execution to it.
  - B247 owns Logging.update_from_kwargs and call-type state; this task calls update_from_kwargs and sets the upload call type.
  - B185 owns exception_type dispatch; this task calls it to convert all exceptions.

pitfalls:
  - Mock response parsing at lines 1308-1314 checks mock_response before validating the file or looking up a provider, so mock short-circuits file upload entirely.
  - Container ID decoding happens early and uses the decoded original ID for the handler call, not the input managed ID.
  - Named credentials (api_key, api_base, api_version) are explicit parameters, not extracted from kwargs; they must be built into GenericLiteLLMParams before provider config lookup.
  - Provider config lookup at line 1333 may return None for unsupported providers; the code at lines 1337-1338 explicitly raises ValueError.
  - The call type must be set to upload_container_file through the logging object's call_type field after logging update.
  - The file parameter is passed directly to the handler without Python file-object normalization or adaptation; that remains the SDK boundary.
  - extra_body is accepted to match the operation signature but must not be forwarded to the handler.
  - "The upload_container_file overloads define different return types: Coroutine when aupload_container_file=True (line 1229), direct ContainerFileObject otherwise (line 1245)."
  - All exceptions from provider config lookup, credential building, and handler delegation are caught at line 1367 and re-raised through exception_type at line 1368, preserving original errors.

