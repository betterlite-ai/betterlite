id: B3367
title: Explicit container file upload
description: >-
  Build the explicit top-level upload operation in betterlite-core, preserving named
  credential arguments, mock-response short circuit, managed-ID decoding and upload
  call-type logging. The async wrapper aupload_container_file runs the sync variant
  through asyncio while preserving call context. The sync function accepts a container ID,
  file, timeout (default 600), optional named credentials (api_key, api_base, api_version),
  custom_llm_provider override, optional headers and query additions, and control flags
  in kwargs. It checks for mock_response first and returns a parsed ContainerFileObject;
  otherwise, it builds GenericLiteLLMParams from named credentials, decodes any managed
  container ID to recover the original ID and provider metadata, retrieves the provider
  config using that provider, updates logging with the upload call type, and delegates
  file normalization and HTTP execution to the generic executor with the decoded container
  ID and file passed through. Both handlers support sync and async execution: the sync
  variant dispatches to async when _is_async=True, while the async handler awaits the
  operation. The implementation reuses B3361's managed ID decoder and provider config
  manager, B3363's generic container handler, B247's logging state update, and B185's
  exception dispatching. Do not forward extra_body to the executor; it is accepted
  by the operation signature but not passed to the handler.

