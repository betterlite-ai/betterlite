budget:
  max_changed_lines: 625
  max_new_expects: 0
checks:
  commands:
  - id: helper-python
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_mantle_inputs.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
    why: The operation adapter is absent, unchanged or fails strict Python checks.
  - id: helper-case-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_inputs*")"
      && grep -lq 'bedrock_mantle_inputs' tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_inputs* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_mantle_inputs$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
  - id: case-mantle-bearer-precedence
    why: Resolve the first truthy value from explicit api_key, B129 get_secret_str(BEDROCK_MANTLE_API_KEY), then
      B129 get_secret_str(AWS_BEARER_TOKEN_BEDROCK). Empty explicit strings do not suppress environment fallback,
      unlike B590 bedrock_bearer_token. Missing all sources returns None without an error. The mixin _resolve_bearer_token
      delegates identically.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_inputs_cases::case_[0-9]+_mantle_bearer_precedence$/)'
  - id: case-mantle-region-prefix
    why: Split only the first slash, and recognize the head only if it is an exact member of the B2203 full Bedrock
      region catalog. A recognized prefix returns that region and the rest (including empty); unknown prefix or
      no slash returns None and the entire model. Do not strip bedrock_mantle/ or dot cross-region prefixes here.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_inputs_cases::case_[0-9]+_mantle_region_prefix$/)'
  - id: case-mantle-region-resolution
    why: Use a nonempty string params.aws_region_name first, validating it through B591; ignore empty/nonstring
      values. Otherwise choose a string params.api_base or resolved BEDROCK_MANTLE_API_BASE by truthiness. Match
      its rstripped value against case-insensitive ^https?://bedrock-mantle\.([^/.]+)\.api\.aws(?=/|$); return the
      captured region unchanged without validating it. Ports and an immediate query suffix do not match; path suffixes
      do. Then use truthy resolved BEDROCK_MANTLE_REGION,AWS_REGION_NAME,AWS_REGION, finally us-east-1; these fallback
      values are not validated by this helper. The mixin _resolve_region delegates identically.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_inputs_cases::case_[0-9]+_mantle_region_resolution$/)'
  - id: case-mantle-model-capabilities
    why: For a truthy model, look up exactly bedrock_mantle/ plus its region-stripped model in the supplied model_cost
      map; absent/falsey model uses {}. mantle_supports_responses returns true for /v1/responses membership in supported_endpoints
      or [], else only mode==responses. mantle_base_segment returns openai/v1 only when use_openai_responses_path
      is literal True, otherwise v1. Preserve Python membership behavior for malformed-but-accepted string endpoint
      lists; do not infer support from gpt-oss,GPT or Gemma names. Missing entries are false/v1.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_inputs_cases::case_[0-9]+_mantle_model_capabilities$/)'
  - id: case-mantle-chat-endpoint-inputs
    why: 'The chat info helper has a distinct region order: truthy litellm_params.aws_region_name, recognized model
      region prefix, BEDROCK_MANTLE_REGION,AWS_REGION_NAME,AWS_REGION,us-east-1. Always validate that chosen region
      through B591, even when explicit api_base wins, and do not derive region from the supplied hostname here.
      Choose truthy explicit api_base, BEDROCK_MANTLE_API_BASE, then https://bedrock-mantle.{region}.api.aws/{mantle_base_segment(base_model,litellm.model_cost)}.
      Preserve slash/path spelling of explicit bases. Return the bearer helper result with the base; do not construct
      a client or emit headers.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_inputs_cases::case_[0-9]+_mantle_chat_endpoint_inputs$/)'
  - id: config-bedrock-mantle-api-base
    why: BEDROCK_MANTLE_API_BASE lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_inputs_config_cases::case_[0-9]+_loads_bedrock_mantle_api_base$/)'
  - id: config-bedrock-mantle-api-key
    why: BEDROCK_MANTLE_API_KEY lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_inputs_config_cases::case_[0-9]+_loads_bedrock_mantle_api_key$/)'
  - id: config-bedrock-mantle-region
    why: BEDROCK_MANTLE_REGION lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_mantle_inputs_config_cases::case_[0-9]+_loads_bedrock_mantle_region$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_inputs_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_inputs_secret_safe_failure$/)'
  optional:
  - mutants
description: >-
  Resolve Mantle credential, region, endpoint and model-capability inputs below provider resolution, cost calculation
  and the transport adapters. Use the same production helpers from all callers; B625 owns signing and adapter composition
  after these inputs are selected.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock_mantle/common_utils.py:
  resolve_mantle_bearer_token L37-L38; split_mantle_region_prefix L41-L45; resolve_mantle_region L48-L64; BedrockMantleAuthMixin._resolve_bearer_token
  L70-L72; BedrockMantleAuthMixin._resolve_region L74-L76; mantle_supports_responses L130-L145; mantle_base_segment
  L148-L160. litellm/llms/bedrock_mantle/chat/transformation.py: BedrockMantleChatConfig._get_openai_compatible_provider_info
  L58-L84.


  Named case contracts: mantle_bearer_precedence: Resolve the first truthy value from explicit api_key, B129 get_secret_str(BEDROCK_MANTLE_API_KEY),
  then B129 get_secret_str(AWS_BEARER_TOKEN_BEDROCK). Empty explicit strings do not suppress environment fallback,
  unlike B590 bedrock_bearer_token. Missing all sources returns None without an error. The mixin _resolve_bearer_token
  delegates identically. mantle_region_prefix: Split only the first slash, and recognize the head only if it is
  an exact member of the B2203 full Bedrock region catalog. A recognized prefix returns that region and the rest
  (including empty); unknown prefix or no slash returns None and the entire model. Do not strip bedrock_mantle/
  or dot cross-region prefixes here. mantle_region_resolution: Use a nonempty string params.aws_region_name first,
  validating it through B591; ignore empty/nonstring values. Otherwise choose a string params.api_base or resolved
  BEDROCK_MANTLE_API_BASE by truthiness. Match its rstripped value against case-insensitive ^https?://bedrock-mantle\.([^/.]+)\.api\.aws(?=/|$);
  return the captured region unchanged without validating it. Ports and an immediate query suffix do not match;
  path suffixes do. Then use truthy resolved BEDROCK_MANTLE_REGION,AWS_REGION_NAME,AWS_REGION, finally us-east-1;
  these fallback values are not validated by this helper. The mixin _resolve_region delegates identically. mantle_model_capabilities:
  For a truthy model, look up exactly bedrock_mantle/ plus its region-stripped model in the supplied model_cost
  map; absent/falsey model uses {}. mantle_supports_responses returns true for /v1/responses membership in supported_endpoints
  or [], else only mode==responses. mantle_base_segment returns openai/v1 only when use_openai_responses_path is
  literal True, otherwise v1. Preserve Python membership behavior for malformed-but-accepted string endpoint lists;
  do not infer support from gpt-oss,GPT or Gemma names. Missing entries are false/v1. mantle_chat_endpoint_inputs:
  The chat info helper has a distinct region order: truthy litellm_params.aws_region_name, recognized model region
  prefix, BEDROCK_MANTLE_REGION,AWS_REGION_NAME,AWS_REGION,us-east-1. Always validate that chosen region through
  B591, even when explicit api_base wins, and do not derive region from the supplied hostname here. Choose truthy
  explicit api_base, BEDROCK_MANTLE_API_BASE, then https://bedrock-mantle.{region}.api.aws/{mantle_base_segment(base_model,litellm.model_cost)}.
  Preserve slash/path spelling of explicit bases. Return the bearer helper result with the base; do not construct
  a client or emit headers.


  Load BEDROCK_MANTLE_API_BASE, BEDROCK_MANTLE_API_KEY, BEDROCK_MANTLE_REGION through betterlite-config, with injected
  environment lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs
  use litellm_settings. Add config rstest bedrock_mantle_inputs_config_cases; each named loads_<key> case invokes
  the real B002 loader, checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated
  keys.


  The three Mantle-specific environment/config values default to None; us-east-1 is a resolver fallback, not a replacement
  for an absent configured value. B590/B591/B129 own existing api_key,aws_region_name,AWS_BEARER_TOKEN_BEDROCK,AWS_REGION_NAME,AWS_REGION
  and secret-resolution fields. B193 supplies the model map, and B2203 supplies the full region catalog. Reuse those
  actual loaders and direct helpers.


  Write standalone Rust test mantle_inputs_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test mantle_inputs_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/mantle_inputs.rs with adjacent tests under mantle_inputs/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_mantle_inputs in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function mantle_inputs_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  mantle_bearer_precedence, mantle_region_prefix, mantle_region_resolution, mantle_model_capabilities, mantle_chat_endpoint_inputs.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_inputs* using HelperCase: kind:
  helper and the externally tagged bedrock_mantle_inputs variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_mantle_inputs that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 81 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 170 production lines, 245 behavior/config-test lines, 110 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 65 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.
