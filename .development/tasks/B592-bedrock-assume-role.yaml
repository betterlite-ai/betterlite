checks:
  optional:
  - mutants
  commands:
  - id: case-assumed-role-arn-matching
    why: Split ARN on colons; require at least6 components and exact initial arn, but do not validate service, region,
      account digits or partition. Rejoin resource colons. role/ uses final slash segment (empty allowed); assumed-role/
      uses first segment after prefix even without session suffix. Return partition,account,role; other resource
      prefixes return None. Compare paths, partitions/accounts, malformed strings and empty role names.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::assume_role_cases::case_[0-9]+_assumed_role_arn_matching$/)'
  - id: case-already-role-no-second-assume
    why: Invalid target ARN returns false before environment/STS access. If both AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE
      are truthy, compare full role ARN strings exactly and return, even if mismatch; do not probe STS or read the
      token file. Otherwise GetCallerIdentity via default sts client with only B590 verify; parse identity Arn defaultempty
      and compare partition/account/role. Same final role name across IAM paths counts equal only in STS branch.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::assume_role_cases::case_[0-9]+_already_role_no_second_assume$/)'
  - id: case-different-account-role-chain
    why: The identity probe returns false on a different account or partition, even if final role names match. It
      never calls AssumeRole; B594 acts on that result.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::assume_role_cases::case_[0-9]+_different_account_role_chain$/)'
  - id: case-returned-expiration-ttl
    why: Require Credentials.AccessKeyId,SecretAccessKey,SessionToken,Expiration, preserving missing-key errors.
      Build credentials and compute int((Expiration-now using Expiration.tzinfo).total_seconds()-60), truncating
      towardzero, with no lower bound. Already expired returns zero/negative TTL; naive datetime uses naive injected
      now. B594 non-IRSA path retains fractional TTL and has its own case.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::assume_role_cases::case_[0-9]+_returned_expiration_ttl$/)'
  - id: case-sts-error
    why: 'Any GetCallerIdentity/client/parsing exception is caught, debug Could not determine current role identity:
      <error> and false; a missing/unparseable Arn is false without exception. Successful match may debug Current
      identity already matches target role: <role>. Do not invent an auth rejection/status on probe failure.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::assume_role_cases::case_[0-9]+_sts_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_assume_role.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_assume_role*")"
      && grep -lq 'bedrock_assume_role' tools/oracle/fuzz/corpus/helper_case/bedrock_assume_role* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_assume_role$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_assume_role_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_assume_role_secret_safe_failure$/)'
