pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_assume_role in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/assume_role.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_assume_role.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The IRSA shortcut compares the entire ARN string and never falls through to the looser role-name comparison.
- assumed-role/ without a session segment can still parse; validation is deliberately narrower than an AWS ARN validator.
