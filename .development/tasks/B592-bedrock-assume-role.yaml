id: B592
title: AWS role identity probes and credential expiry
description: >-
  Implement AwsRoleIdentity and STS expiry extraction below credential resolution. This slice checks whether the
  ambient identity matches a requested role and projects returned credentials; B594 owns role assumption, session-name
  generation and fallback, and B593 owns IRSA chaining. Use injected SDK transport and clock without logging response
  credentials.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/base_aws_llm.py:
  BaseAWSLLM._parse_arn_account_and_role_name L875-L910; BaseAWSLLM._is_already_running_as_role L912-L969; BaseAWSLLM._extract_credentials_and_ttl
  L1193-L1214.


  Named case contracts: assumed_role_arn_matching: Split ARN on colons; require at least6 components and exact initial
  arn, but do not validate service, region, account digits or partition. Rejoin resource colons. role/ uses final
  slash segment (empty allowed); assumed-role/ uses first segment after prefix even without session suffix. Return
  partition,account,role; other resource prefixes return None. Compare paths, partitions/accounts, malformed strings
  and empty role names. already_role_no_second_assume: Invalid target ARN returns false before environment/STS access.
  If both AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE are truthy, compare full role ARN strings exactly and return,
  even if mismatch; do not probe STS or read the token file. Otherwise GetCallerIdentity via default sts client
  with only B590 verify; parse identity Arn defaultempty and compare partition/account/role. Same final role name
  across IAM paths counts equal only in STS branch. different_account_role_chain: The identity probe returns false
  on a different account or partition, even if final role names match. It never calls AssumeRole; B594 acts on that
  result. returned_expiration_ttl: Require Credentials.AccessKeyId,SecretAccessKey,SessionToken,Expiration, preserving
  missing-key errors. Build credentials and compute int((Expiration-now using Expiration.tzinfo).total_seconds()-60),
  truncating towardzero, with no lower bound. Already expired returns zero/negative TTL; naive datetime uses naive
  injected now. B594 non-IRSA path retains fractional TTL and has its own case. sts_error: Any GetCallerIdentity/client/parsing
  exception is caught, debug Could not determine current role identity: <error> and false; a missing/unparseable
  Arn is false without exception. Successful match may debug Current identity already matches target role: <role>.
  Do not invent an auth rejection/status on probe failure.


  Implement crates/betterlite-bedrock/src/assume_role.rs with adjacent tests under assume_role/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function assume_role_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  assumed_role_arn_matching, already_role_no_second_assume, different_account_role_chain, returned_expiration_ttl,
  sts_error. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_assume_role* using HelperCase: kind:
  helper and the externally tagged bedrock_assume_role variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_assume_role that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_assume_role_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_assume_role_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 92 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 130 production lines, 195 behavior/config-test lines, 95 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 445 planned, 450 maximum changed lines.
