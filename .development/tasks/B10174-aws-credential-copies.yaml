dod:
  - text: betterlite_bedrock::credentials::CredentialSource is the only trait with the resolve(settings, region) contract, it has one impl for AwsCredentialResolver, and every user in betterlite-bedrock, betterlite-bedrock-guardrails, betterlite-guardrails, betterlite-provider and the oracle helpers names it.
    proof: [no-copies, bedrock-tests, guardrail-tests, provider-tests, oracle-bedrock-cases, oracle-guardrail-cases]
  - text: SecretLookup, ManagerState, SecretManagerClient and SecretManagerSettings are Clone, a clone carries the manager and the OIDC tokens, and neither owned_secret_lookup copy is left.
    proof: [no-copies, secret-lookup-tests, overlay-tests]
  - text: or_bearer_token is the one or-chain for the Responses and Mantle tokens, an all-empty chain still signs SigV4 on Responses, and the Mantle cases match LiteLLM.
    proof: [no-copies, bedrock-tests, oracle-bedrock-cases]
checks:
  optional: []
  commands:
    - id: no-copies
      why: one of the six credential traits, an owned secret lookup copy or a second bearer chain is still in place
      run: |-
        test ! -e crates/betterlite-bedrock/src/mantle_inputs/credentials.rs &&
        test -z "$(grep -rnE 'trait (CredentialSource|CountTokensCredentials|SagemakerCredentials)\b|fn (owned_secret_lookup|owned_manager|owned_manager_state|resolve_bearer_token)\b' crates/betterlite-bedrock/src crates/betterlite-bedrock-guardrails/src crates/betterlite/src | grep -v '^crates/betterlite-bedrock/src/credentials.rs:')" &&
        test "$(grep -c 'pub trait CredentialSource: Send + Sync' crates/betterlite-bedrock/src/credentials.rs)" = 1
    - id: bedrock-tests
      why: a merged trait user, the moved bearer chain or the owned lookup changed what a Bedrock call resolves, signs or reads
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E '(test(/^(credentials|aws_settings|batch_call|converse_call|count_call|embedding_call|embedding_jobs|image_call|image_edits|rerank|sagemaker_runtime|bedrock_embedding_io|responses|mantle_inputs|mantle_responses|mantle_settings)::/)) - test(/replays_the_/)'
    - id: guardrail-tests
      why: the Bedrock guardrail calls lost their credential bound
      run: cargo nextest run --locked -p betterlite-bedrock-guardrails --no-tests=fail -E 'test(/^bedrock_transport::/)' && cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^bedrock_(apply|checks|incremental_guardrail)::/)'
    - id: provider-tests
      why: the SageMaker and Bedrock image dispatch lost their credential seam
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^(enterprise_ml_dispatch|bedrock_image_dispatch)::/)'
    - id: secret-lookup-tests
      why: the Clone impl drops the manager or the tokens, or shares the token cache with the original
      run: grep -rq 'fn secret_lookup_clone_keeps_the_manager_and_the_tokens' crates/betterlite-secret-managers/src/secret_lookup && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_lookup::/)'
    - id: overlay-tests
      why: the config overlay reload lost its OIDC tokens after the switch to clone
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^db_config_overlay::/)'
    - id: oracle-bedrock-cases
      why: a bedrock oracle helper does not build against the merged trait, or the Mantle bearer cases no longer match LiteLLM
      run: cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-bedrock -- tools/oracle/cases/helpers/providers/bedrock-mantle-inputs
    - id: oracle-guardrail-cases
      why: the Bedrock guardrail helpers do not build against the merged trait or their cases changed
      run: cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-guardrails -- tools/oracle/cases/guardrails/bedrock-apply
oracle_cases: []
deviations: []
out_of_scope:
  - "The production credential chain that implements the merged trait: B10175."
  - "B10166's BedrockSdkCall bound: B10166 depends on this task and names the merged trait."
  - "betterlite-provider's object-safe AwsCredentials and the region-less, Option-answering and borrowed-settings traits listed above: different contracts."
  - "Transcribe's own `CredentialSource` (crates/betterlite-transcribe/src/live/signing.rs L30-L33), an async_trait over a region only, and the betterlite-logging `CredentialSource` traits (sqs_logging, s3_transport, legacy_s3), which answer their own credential types."
  - "The three env-only SecretLookup literals in the server (app/spend.rs L45-L51, jobs/ptu/attribution.rs L33, shadow_eval_lifecycle/postgres.rs L52-L58): struct literals over the same NoOidc stub, not hand-written clones."
pitfalls:
  - "B679 is running on crates/betterlite-provider/src/bedrock_image_dispatch and imports image_call::plan::CredentialSource; this task starts after it lands and moves its four files too."
  - "Generic bounds like `Source: CredentialSource + Sync` still compile under the new supertraits; drop the redundant part so clippy stays quiet, and don't widen any other bound."
  - "OidcTokenCache is a Mutex, so SecretLookup cannot derive Clone: the impl locks the original once (PoisonError::into_inner, as environ.rs does) and builds a new Mutex from the copied map."
  - "or_bearer_token returns the last operand unchanged when nothing is truthy, so Mantle's `empty_last_operand_cases` and the oracle's bearer_precedence keep answering Some(\"\"); every caller that sends the token filters empties, as mantle_responses/auth.rs L28 does."
  - "bedrock_bearer_token and or_bearer_token disagree on an empty explicit key on purpose; their tests pin both and neither calls the other."
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
