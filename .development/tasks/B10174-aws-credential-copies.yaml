id: B10174
title: One AWS credential source trait, one owned secret lookup and one bearer or-chain
description: >-
  Three copies sit next to betterlite's AWS credential code, and each goes in this task so B10175's credential chain has one seam to implement.


  One credential source trait. Six traits in two crates are the same contract word for word, `fn resolve(&self, settings: AwsSettings, region: String) -> impl Future<Output = Result<Credentials, CredentialError>> + Send`: `CredentialSource` in crates/betterlite-bedrock/src/embedding_call.rs L64-L70, image_call/plan.rs L61-L67 and rerank/plan.rs L59-L65 (no supertraits; callers add `+ Sync`), `CountTokensCredentials` in count_call/handler.rs L73-L79 and `SagemakerCredentials` in sagemaker_runtime/runtime.rs L87-L93 (both `Send + Sync`), and `CredentialSource` in crates/betterlite-bedrock-guardrails/src/bedrock_credentials.rs L38-L44 (`Send + Sync`). They become one, `pub trait CredentialSource: Send + Sync` in crates/betterlite-bedrock/src/credentials.rs beside `AwsCredentialResolver`, with the same method. Its one impl for `AwsCredentialResolver<'_>` is the body both count_call (handler.rs L81-L89) and sagemaker_runtime (runtime.rs L95-L103) have today, `self.resolve_credentials(&settings, Some(&region)).await`, and both of those impls go. Every user imports `betterlite_bedrock::credentials::CredentialSource` (or `crate::credentials::CredentialSource`) instead: betterlite-bedrock's batch_call (async_status.rs, cancel.rs, client.rs, status.rs, tests/fixture.rs), converse_call (converse_call.rs, prepare.rs, target.rs, tests/fixtures/transport.rs), count_call (factory.rs, handler.rs, tests/support.rs), embedding_call (embedding_call.rs, plan.rs, execute.rs, execute/bridge.rs, tests/fixture.rs), embedding_jobs (status.rs, tests/fixture.rs), image_call (plan.rs, tests/fixture.rs), image_edits (prepare.rs, tests/fixture.rs), rerank (plan.rs, execute.rs, tests/fixture.rs) and sagemaker_runtime (runtime.rs, chat.rs, completion.rs, embedding.rs, runtime/tests.rs, tests/integration.rs); betterlite-bedrock-guardrails' `load_credentials` (bedrock_credentials.rs L46) and bedrock_transport/tests/support.rs; betterlite-guardrails' bedrock_apply.rs, bedrock_apply/tests.rs, bedrock_checks/request.rs, bedrock_checks/tests/support.rs, bedrock_incremental_guardrail/batch.rs, scan.rs and tests/support.rs; betterlite-provider's enterprise_ml_dispatch/transport.rs, whose `SharedCredentials` (L85-L96) implements the merged trait, and B679's bedrock_image_dispatch (execute.rs, execute/edit.rs, execute/generate.rs, test_support.rs); and the oracle helpers tools/oracle/src/helpers/bedrock/b3726/support.rs, b5840.rs, other_count_call/script.rs, other_embedding_call/fixtures/source.rs, other_embedding_jobs/fixture.rs, other_image_call/fixtures.rs, other_image_edits/fixtures/support.rs, other_rerank/fixtures.rs and services_batch_call/fixtures.rs, and tools/oracle/src/helpers/guardrails/b3724.rs and b3725.rs. A redundant `+ Sync` or `+ Send + Sync` beside the new bound goes. No alias stays at an old path: a `pub use` of a merged trait is the copy this removes.


  Not merged, with the reason in the report: betterlite-provider's `AwsCredentials` (enterprise_ml_dispatch/transport.rs L79-L84) is an `#[async_trait]` object-safe trait the merged one, with its `impl Future` return, cannot stand in for as `&dyn`; `RealtimeCredentials` (realtime_transport/prepare.rs L55-L61) answers an Option, `ChainCredentials` (transcription/auth.rs L57-L62) takes no region, and vertex's `AwsCredentialsResolver` (crates/betterlite-vertex/src/aws_federation.rs L112-L117) and rag's `RagCredentialResolver` (crates/betterlite-rag/src/bedrock_ingestion/client/credentials.rs L9-L15) take borrowed settings and call get_credentials or a different region rule.


  One owned secret lookup. `owned_secret_lookup` and `owned_manager` in crates/betterlite/src/db_config_overlay/environ.rs L157-L168 and L180-L205, and `owned_secret_lookup` and `owned_manager_state` in crates/betterlite-bedrock/src/bedrock_embedding_io/credentials.rs L158-L203, are two hand-written clones of betterlite-secret-managers' `SecretLookup` (secret_lookup.rs L29-L35). The manager halves are identical. `SecretManagerClient` (secret_read_dispatch.rs L37-L48; every variant holds an Arc), `SecretManagerSettings` (secret_read_dispatch/settings.rs L3-L8) and `ManagerState` (secret_lookup/manager.rs L12-L18) derive Clone. `SecretLookup` gets `impl Clone` in secret_lookup.rs that clones the manager and the four Arcs and copies the current OIDC tokens into a new cache, as environ.rs does. environ.rs loses both functions, and reload.rs L84 calls `state.secrets.lookup.clone()`; `restore_oidc_tokens` stays. bedrock_embedding_io/credentials.rs loses both functions, and L147 passes `secrets.clone()`. The one difference: bedrock's copy started with an empty token cache, and the clone carries the tokens already fetched. The region lookup reads AWS_REGION_NAME and AWS_REGION through the lookup (L139-L156), so a carried token can only save a second fetch of the same `oidc/` secret, as LiteLLM's process-wide token cache does.


  One bearer or-chain. LiteLLM's Responses and Mantle helpers are the same Python `or` chain over two and three operands: `resolve_bedrock_bearer_token` returns `api_key or get_secret_str("AWS_BEARER_TOKEN_BEDROCK")` (bedrock/responses/transformation.py L84-L85) and `resolve_mantle_bearer_token` adds BEDROCK_MANTLE_API_KEY in the middle (bedrock_mantle/common_utils.py L37-L38). betterlite has both: `resolve_bearer_token` in crates/betterlite-bedrock/src/responses/auth.rs L36-L47 (first non-empty, else None) and in mantle_inputs/credentials.rs L3-L15 (first non-empty, else the last operand, as Python does). They become one `pub fn or_bearer_token(tokens: &[Option<&SecretString>]) -> Option<SecretString>` in crates/betterlite-bedrock/src/aws_settings.rs beside `bedrock_bearer_token`, with Mantle's behavior and its one-line comment. mantle_inputs/credentials.rs and its `pub mod credentials;` line (mantle_inputs.rs L3) go, and its callers pass a slice: mantle_inputs/chat_endpoint.rs L35, mantle_responses/auth.rs L23, mantle_settings/auth.rs L51, mantle_settings/passthrough.rs L63, mantle_inputs/tests.rs, mantle_inputs/tests/bearer_cases.rs and tools/oracle/src/helpers/bedrock/mantle_inputs/ops.rs L64. Responses' function goes, and its two callers keep only a non-empty token, as LiteLLM's do (`if not bearer`, transformation.py L229; `if resolve_bedrock_bearer_token(api_key)`, L244): `validate_environment` (responses/auth.rs L54) sets no Authorization header and `sign_request` (L70) signs SigV4 when the chain answers an empty token. `bedrock_bearer_token` (aws_settings.rs L125-L136) stays: it ports a different rule, `api_key if api_key is not None else get_secret_str(...)` then `token or None` (base_aws_llm.py L192-L194), so an empty explicit key disables the token there and falls through here.


  Tests. credentials/tests gains `credential_source_resolves_at_the_region`: the resolver fixture (credentials/tests/support.rs L349-L392) with static keys in the settings answers them through `CredentialSource::resolve` at the region passed. secret_lookup/tests gains `secret_lookup_clone_keeps_the_manager_and_the_tokens`: a lookup with a manager and one cached OIDC token clones into one that reads the same managed secret and has that token, and a token fetched later into the clone does not reach the original. responses/tests/auth_cases.rs `token_selection` (L119-L141) moves to aws_settings' tests as or-chain cases for two operands, where an all-empty pair answers `Some("")`; `header_override` gains the empty pair and checks that no Authorization header is set, and `bearer_signing` checks that the empty pair signs SigV4. The existing Mantle bearer cases, `empty_last_operand_cases` included, keep their expectations.


  What users see: nothing. A Bedrock Responses call with an empty api_key and an empty AWS_BEARER_TOKEN_BEDROCK still signs SigV4.
