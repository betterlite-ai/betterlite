dod:
  - text: BitBucketClient accepts workspace, repository and access_token as required config; branch defaults to "main", base_url defaults to "https://api.bitbucket.org/2.0".
    proof: [bitbucket-client-config-tests]
  - text: BitBucketClient auth_method defaults to "token" (Bearer auth) or "basic" (with username); basic auth encodes username:access_token in base64.
    proof: [bitbucket-client-auth-tests]
  - text: _sanitize_file_path rejects ".." segments and "?" and "#" characters, then URL-encodes each segment separately with safe="".
    proof: [bitbucket-client-path-tests]
  - text: BitBucketClient.get_file_content constructs the correct src endpoint URL and distinguishes 404/401/403 errors from other HTTP errors.
    proof: [bitbucket-client-error-tests]
  - text: get_file_content returns text when content-type starts with "text/", else attempts base64 decode with UTF-8 fallback to raw text.
    proof: [bitbucket-client-content-tests]
  - text: BitBucketPromptTemplate stores template_id, content, metadata, model (from config or metadata), temperature, max_tokens, input schema and optional_params.
    proof: [bitbucket-template-tests]
  - text: BitBucketTemplateManager respects "prompts_path" config key, scoped relative to repository root.
    proof: [bitbucket-manager-path-tests]
  - text: >-
      _parse_prompt_file splits frontmatter on --- delimiters (at start), parses YAML or falls back to _parse_yaml_basic,
      treats empty/invalid YAML as empty metadata.
    proof: [bitbucket-parse-tests]
  - text: >-
      _parse_yaml_basic parses key: value lines, handles true/false/numeric/string values,
      and rejects comments and malformed lines.
    proof: [bitbucket-yaml-tests]
  - text: BitBucketTemplateManager.render_template uses ImmutableSandboxedEnvironment with Jinja2 syntax, autoescape for HTML/XML, and returns rendered string.
    proof: [bitbucket-render-tests]
  - text: BitBucketTemplateManager.get_template returns the cached BitBucketPromptTemplate or None.
    proof: [bitbucket-load-tests]
  - text: BitBucketTemplateManager.list_templates returns a list of all cached template IDs.
    proof: [bitbucket-list-tests]
  - text: Base URL override uses config key "" (empty string), not "base_url"; the override value replaces the default API endpoint.
    proof: [bitbucket-base-url-empty-key]
  - text: Client config with auth_method=basic requires username; missing username falls back to bearer auth.
    proof: [bitbucket-auth-config-tests]
