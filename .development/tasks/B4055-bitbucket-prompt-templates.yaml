oracle_cases: []
deviations:
  - what: >-
      YAML parsing errors (invalid syntax, missing dependencies) result in empty metadata rather than
      failing the prompt load. Invalid YAML in _parse_yaml_basic silently skips malformed lines instead of stopping.
    why: LiteLLM does the same to make repository corruption non-fatal; it falls back to empty metadata and continues.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L129-L137
  - what: Role prefixes in templates (System:, User:, Assistant:) are matched case-insensitively during message parsing.
    why: LiteLLM uses case-insensitive prefix matching; line.lower().startswith() at the pinned commit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L341-L370
  - what: Blank lines in template content are skipped during message parsing (stripped lines that are empty are skipped).
    why: LiteLLM treats blank lines as separators and skips them during parsing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_prompt_manager.py#L335-L338
  - what: >-
      Base URL override is read from config key "" (empty string), not "base_url" as documented;
      betterlite preserves this as-is without correction.
    why: LiteLLM behavior at the pinned commit; this is a quirk in the source code that users have adapted to.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_client.py#L79
  - what: >-
      Basic auth requires both auth_method="basic" and a non-empty username;
      if username is missing, falls back to bearer token auth.
    why: LiteLLM checks both conditions before applying basic auth; missing username silently uses bearer auth instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/bitbucket/bitbucket_client.py#L92
out_of_scope:
  - >-
    BitBucketClient.list_files, get_repository_info, test_connection, get_branches,
    get_file_metadata, close: no caller at the pin in the prompt compilation flow.
  - >-
    BitBucketPromptTemplate.__repr__: no caller at the pin in runtime paths.
  - >-
    BitBucketPromptManager and all its methods (integration_name, prompt_manager,
    get_prompt_template, pre_call_hook, post_call_hook, get_available_prompts, reload_prompts,
    should_run_prompt_management, _compile_prompt_helper, async_compile_prompt_helper,
    get_chat_completion_prompt, async_get_chat_completion_prompt, _parse_prompt_to_messages):
    owned by B4056 (the Bitbucket compiler task), not this transport task.
pitfalls:
  - >-
    _sanitize_file_path must reject ALL occurrences of "..", not just one;
    it splits on "/" and checks each part for equality with the literal string "..".
  - >-
    _sanitize_file_path must also reject any path containing "?" or "#" characters
    before processing; these are URL special characters that cannot be safely encoded.
  - >-
    _sanitize_file_path encodes each segment separately using urllib.parse.quote with safe="",
    so "/" itself gets encoded in segments (e.g., "a/b" encodes to "a%2Fb").
  - >-
    get_file_content checks content-type header: if it starts with "text/", return response.text directly;
    otherwise attempt base64 decode with UTF-8 fallback to raw text.
  - >-
    BitBucketClient.__init__ reads base_url from config key "" (empty string), not "base_url";
    the override completely replaces the default "https://api.bitbucket.org/2.0".
  - >-
    Basic auth requires auth_method="basic" AND a non-empty username;
    if either is missing, bearer token auth is used instead.
  - >-
    Basic auth encodes the string "username:access_token" in base64,
    then sets Authorization header to "Basic <encoded>".
  - >-
    Bearer auth sets Authorization header to "Bearer <access_token>"
    (default when auth_method is not "basic" or username is missing).
  - >-
    ImmutableSandboxedEnvironment from jinja2.sandbox blocks attribute traversal and __class__ access;
    normal {{ var }} substitution works but RCE payloads are caught.
  - >-
    _parse_prompt_file checks frontmatter start with --- and splits on the second ---,
    preserving content after it exactly; missing second --- treats the whole file as template content.
  - >-
    _parse_yaml_basic splits on ":" character only once per line (split(':', 1)),
    so keys or values with colons work correctly.
  - >-
    Role prefix matching uses case-insensitive comparison (.lower());
    System:, system:, SYSTEM: all match; blank lines (after strip()) are skipped.
review_level: standard
