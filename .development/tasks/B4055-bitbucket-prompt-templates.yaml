id: B4055
title: Bitbucket prompt transport and templates
description: >-
  Build Bitbucket client for file acquisition and template manager for prompt loading and rendering.
  The client handles app-password and bearer-token authentication, path validation, response fallback
  (text or base64 decoded), and status code distinctions. The template manager loads .prompt files,
  parses YAML frontmatter, and renders templates in a sandboxed Jinja2 environment. Keep Bitbucket's
  behavior distinct from dotprompt: YAML parsing errors erase metadata rather than failing, role prefixes
  are case-insensitive, and blank lines in templates are dropped during parsing. Preserve branch default "main",
  non-text base64-or-text fallback, and 404/401/403 distinctions. Implement list_templates to enumerate cached
  templates. Reject ".." path segments and "?" and "#" characters; then quote path segments separately.
  The default API base is "https://api.bitbucket.org/2.0", but the override uses config key "" (empty string),
  not the documented "base_url". Basic auth requires both auth_method and username; otherwise bearer auth is used.
  Fuzz these external bytes and the YAML parser; do not silently fix the empty-key behavior.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-prompts/src/bitbucket_client.rs
    - crates/betterlite-prompts/src/bitbucket_client/**
    - crates/betterlite-prompts/src/bitbucket_prompt_manager.rs
    - crates/betterlite-prompts/src/bitbucket_prompt_manager/**
  lint_tables: false
