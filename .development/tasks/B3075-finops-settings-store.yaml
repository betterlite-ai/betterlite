id: B3075
title: Persist FinOps settings and detect configured exporters
description: >-
  Build typed CloudZero/Vantage config-row access in betterlite-db::finops and setup detection in betterlite-server::finops.
  Store encrypted API keys and credentials in the database through ConfigRepository, supporting both JSON-string and Mapping config values.
  For CloudZero: encrypt api_key, store connection_id and timezone as plaintext.
  For Vantage: encrypt api_key and integration_token, store base_url as plaintext.
  Decryption errors raise HTTPException with error detail, never silently fail.
  The setup-detection functions check both database (whether settings exist and have non-None value) and config callbacks separately, so callers can distinguish database-only from config-only setup.
  Preserve CloudZero's string-only config access pattern (checks if "cloudzero" is in litellm.callbacks)
  and Vantage's string-or-instance pattern (checks callback name or isinstance(cb, VantageLogger)).
  Build helpers in dedicated modules, not in the endpoint files B3076 and B3077 claim.
