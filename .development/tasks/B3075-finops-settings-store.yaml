dod:
  - text: CloudZero settings store and retrieve api_key encrypted, connection_id and timezone plaintext, matching both string and Mapping config values on read.
    proof: [finops-settings-tests]
  - text: Vantage settings store and retrieve api_key and integration_token encrypted, base_url plaintext, matching both string and Mapping config values.
    proof: [finops-settings-tests]
  - text: Setup detection distinguishes between database and config callback sources, and correctly composes them to report overall setup state.
    proof: [finops-settings-tests]
  - text: Decryption failures raise an error visible to the caller; missing or malformed salt configuration does not silently return None.
    proof: [finops-settings-tests]
  - text: Every stored and retrieved credential is encrypted using B1600 helpers with appropriate key/exception_type parameters.
    proof: [finops-settings-tests]
checks:
  optional: []
  commands:
    - id: finops-settings-tests
      why: Encryption, decryption, storage retrieval or setup detection fail or do not exist.
      run: cargo nextest run --locked -p betterlite-db -p betterlite-server --no-tests=fail -E 'test(/^finops::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - ConfigRepository and the table protocol are owned by B725; this task uses them through the repository.
  - The encrypt_value_helper and decrypt_value_helper functions are owned by B1600; this task calls them with appropriate key names.
  - B189 owns the CustomLogger interface and callback registry that these setup checks query.
  - B3067 owns VantageLogger and its registration; this task only detects its presence in the callback registry.
  - HTTP routes for CloudZero settings are owned by B3076; HTTP routes for Vantage settings are owned by B3077.
  - The request/response types are owned by B3079; this task uses them for validation but does not define them.
pitfalls:
  - param_value from the config row can be a JSON string, a Mapping (dict), or None; the code must handle all three cases after deserialization.
  - CloudZero checks for the string "cloudzero" in callbacks, not isinstance; Vantage checks both string and instance, so the two patterns are different.
  - Decryption key names must match the source's expectations (cloudzero_api_key, vantage_api_key, vantage_integration_token); mismatched keys fail decryption.
  - A setup check for the database must return false, not raise, if prisma_client is None or the query fails; config checks always work.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
