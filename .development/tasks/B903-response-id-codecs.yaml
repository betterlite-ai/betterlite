id: B903
title: Response id codecs
description: >-
  Build bounded typed codecs for response IDs, encrypted-item IDs, wrapped encrypted content and container IDs.
  Export decoded provider/deployment/original-ID records for routing without treating any encoded ID as authorization.
  Preserve diagnostic levels and unchanged-input outcomes where decoding falls back; a source debug diagnostic does
  not become a warning.


  ResponsesAPIRequestUtils.decode_container_id_to_original (litellm/responses/utils.py:L790-L797) has no MIT runtime
  caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior case
  exercises that unused entry point.


  Implement crates/betterlite-core/src/api/response_id_codecs.rs. Use ResponseIdCodecsInput and ResponseIdCodecsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions response_id_roundtrip, malformed_base64_original, item_id_missing_padding,
  container_semicolon, empty_provider_model under api::response_id_codecs::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  The production external-byte decoder is betterlite-core::api::response_id_codecs::decode_response_id_codecs(bytes:
  &[u8], limits: &ApiLimits), for base64.b64decode input cleaned.encode('utf-8') at litellm/responses/utils.py:409;
  base64.b64decode input metadata_b64.encode('utf-8') at litellm/responses/utils.py:460; base64.b64decode input
  cleaned_id.encode('utf-8') at litellm/responses/utils.py:636; base64.b64decode input cleaned_id.encode('utf-8')
  at litellm/responses/utils.py:747. Place its implementation in crates/betterlite-core/src/api/response_id_codecs.rs
  and call it from the actual boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/response_id_codecs.rs
  passes arbitrary bounded bytes to that exact decoder; api::response_id_codecs::tests::replays_corpus replays newly
  committed seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponseIdCodecs in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_id_codecs: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/utils.py: ResponsesAPIRequestUtils._build_encrypted_item_id (L385-L392);
  litellm/responses/utils.py: ResponsesAPIRequestUtils._decode_encrypted_item_id (L395-L418); litellm/responses/utils.py:
  ResponsesAPIRequestUtils._wrap_encrypted_content_with_model_id (L421-L431); litellm/responses/utils.py: ResponsesAPIRequestUtils._unwrap_encrypted_content_with_model_id
  (L434-L464); litellm/responses/utils.py: ResponsesAPIRequestUtils._build_responses_api_response_id (L611-L621);
  litellm/responses/utils.py: ResponsesAPIRequestUtils._decode_responses_api_response_id (L624-L674); litellm/responses/utils.py:
  ResponsesAPIRequestUtils._is_litellm_encoded_response_id (L677-L682); litellm/responses/utils.py: ResponsesAPIRequestUtils.get_model_id_from_response_id
  (L685-L690); litellm/responses/utils.py: ResponsesAPIRequestUtils.decode_previous_response_id_to_original_previous_response_id
  (L693-L710); litellm/responses/utils.py: ResponsesAPIRequestUtils._build_container_id (L713-L727); litellm/responses/utils.py:
  ResponsesAPIRequestUtils._decode_container_id (L730-L787). Abstract/protocol declarations map to native types
  and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 167 owned nonblank/non-comment/non-docstring Python lines (208 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 187 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 497 total within the 500-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
