id: B903
title: Response id codecs
description: >-
  Implement response, container, encrypted-item and encrypted-content codecs in
  betterlite-core::api::response_id_codecs. These values carry routing metadata, never
  ownership authorization. Own the eleven complete methods in the references: builders,
  decoders, _is_litellm_encoded_response_id, get_model_id_from_response_id and
  decode_previous_response_id_to_original_previous_response_id. Use B902's DecodedResponseId.
  Preserve Python's permissive base64 decoding, UTF-8 failures and each codec's distinct
  fallback. No URL fetching, credential access or provider request occurs here.

  Expose decode_response_id_codecs(kind, bytes, ApiLimits); fuzz input byte 0 selects
  response/container/item/content and the remaining bytes are the actual untrusted string.
  Fuzz and replays_corpus call that production entry. Register response_id_codecs with B171;
  compare decoded fields and diagnostic level, not Python traceback wording. In fixtures,
  b64(x) means standard padded UTF-8 base64 computed by fixture preparation, with the
  resulting literal string committed in YAML. It is not a provider or helper expected-value shortcut.
  The owned ranges contain 208 nonblank, non-comment lines. Budget 220 codecs, 145 tests,
  95 fixtures, 80 adapters, 60 fuzz/replay and 20 wiring: 620 changed lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/response_id_codecs.rs
  - crates/betterlite-core/src/api/response_id_codecs/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/response_id_codecs.rs
  - crates/betterlite-core/fuzz/corpus/response_id_codecs/**
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/response_id_codecs.rs
  - tools/oracle/src/helpers/core_ops/response_id_codecs/**
  - tools/oracle/helpers/response_id_codecs.py
  - tools/oracle/helpers/response_id_codecs/**
  - tools/oracle/fuzz/corpus/helper_case/response_id_codecs-*
  - tools/oracle/cases/helpers/response-id-codecs/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L384-L464
  why: Item/content wrappers restore missing padding and preserve the first-semicolon remainder.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L610-L787
  why: Response/container envelopes differ in null handling, prefix validation and delimiter parsing.
dod:
- text: >-
    response_roundtrip builds openai,dep_a,resp_native and expects
    resp_ + b64("litellm:custom_llm_provider:openai;model_id:dep_a;response_id:resp_native").
    Decode yields openai,dep_a,resp_native; is_encoded=true and previous-id restoration
    yields resp_native. Null provider/model encode the literal "None" and decode as strings.
    Empty provider/model decode as empty strings, is_encoded=true, while model lookup returns null.
    A null lookup input returns null. Original id="a;b" is truncated to "a" on response decode.
  proof: [codec-tests, oracle, codec-adapter]
- text: >-
    response_fallback sends resp_! and resp_ + b64("one;two"); expect null provider/model
    and unchanged input. Invalid padding/UTF-8 emits debug "Error decoding response_id" and
    returns the original; a decoded string without semicolons falls back without that diagnostic.
    b64("a;b;c") is accepted as provider=a,model=b,response_id=c despite missing field prefixes.
    Literal resp_ occurrences are removed by replace, not only from the start.
  proof: [codec-tests, oracle, codec-adapter]
- text: >-
    encrypted_item_roundtrip builds model=dep_a,item=rs_a;b and expects encitem_ +
    b64("litellm:model_id:dep_a;item_id:rs_a;b"). Missing base64 padding is restored and
    the entire rs_a;b suffix survives. Wrong prefix, invalid UTF-8 or no semicolon returns
    null without an error; decoded "a;b" returns model_id=a,item_id=b. Prefix tokens are
    removed throughout each part by replace, including embedded item_id: text.
  proof: [codec-tests, oracle, codec-adapter]
- text: >-
    content_wrapper sends content="cipher;a",model=dep_a; expect
    litellm_enc: + b64("model_id:dep_a") + ";cipher;a" and unwrap=(dep_a,"cipher;a").
    Missing padding works. Unwrapped input, absent delimiter and malformed UTF-8 return
    (null,original input) silently. An empty encoded metadata segment returns model="".
  proof: [codec-tests, oracle, codec-adapter]
- text: >-
    container_delimiters builds null,null,"c;a" as cntr_ +
    b64("litellm:custom_llm_provider:;model_id:;container_id:c;a") and decodes null,null,"c;a".
    Legacy provider/model="None" also become null. Wrong cntr_ prefix, missing litellm:,
    malformed labels and empty container_id return the original with null routing metadata.
    Invalid base64/UTF-8 additionally emits debug "Error decoding container_id". Container
    decoding does not repair missing padding, unlike encrypted-item/content decoding.
  proof: [codec-tests, oracle, codec-adapter]
- text: Codec fuzzing covers all four selectors, invalid UTF-8 and the exact byte limit through the production entry.
  proof: [codec-corpus]
checks:
  optional: []
  commands:
  - id: codec-tests
    why: an ID format, delimiter rule or fallback changes routing metadata
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::/) - test(/::replays_corpus$/)'
  - id: codec-adapter
    why: codec fixtures do not call independently checked pinned helpers
    run: test -f tools/oracle/helpers/response_id_codecs.py && grep -qE '^[[:space:]]+response_id_codecs:' tools/oracle/fuzz/corpus/helper_case/response_id_codecs-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: codec-corpus
    why: untrusted base64 decoding has no new replayable corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/response_id_codecs)" && grep -qF decode_response_id_codecs crates/betterlite-core/fuzz/fuzz_targets/response_id_codecs.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/helpers/response-id-codecs/response-roundtrip.yaml
- tools/oracle/cases/helpers/response-id-codecs/response-fallback.yaml
- tools/oracle/cases/helpers/response-id-codecs/encrypted-item-roundtrip.yaml
- tools/oracle/cases/helpers/response-id-codecs/content-wrapper.yaml
- tools/oracle/cases/helpers/response-id-codecs/container-delimiters.yaml
deviations: []
out_of_scope:
- utils.py L790-L797 decode_container_id_to_original has no caller at the pin; do not build or test that unused facade.
- B904 owns ID traversal/restoration and reasoning stripping; B905 owns parameter helpers and shape predicates; B906 owns usage conversion, all in responses/utils.py.
- B929 signs/encrypts owner-bearing public IDs; base64 metadata here supplies no access control.
pitfalls:
- 'The oracle helper for this task is pre-registered as response_id_codecs in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/response_id_codecs.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/response_id_codecs.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Response IDs serialize missing routing fields as "None", while container IDs serialize empty strings and normalize legacy "None" back to null.
- Container and item decoders preserve semicolons in the provider ID, but the response decoder reads only the third split segment.
- A syntactically decoded response need not have the documented labels to count as encoded.
review_level: security
budget:
  max_changed_lines: 620
  max_new_expects: 1
