checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::/) -
      test(/::replays_corpus$/)'
  - id: case-response-id-roundtrip
    why: the response-id-roundtrip behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::tests::response_id_roundtrip($|::)/)'
  - id: case-malformed-base64-original
    why: the malformed-base64-original behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::tests::malformed_base64_original($|::)/)'
  - id: case-item-id-missing-padding
    why: the item-id-missing-padding behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::tests::item_id_missing_padding($|::)/)'
  - id: case-container-semicolon
    why: the container-semicolon behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::tests::container_semicolon($|::)/)'
  - id: case-empty-provider-model
    why: the empty-provider-model behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_codecs::tests::empty_provider_model($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/response_id_codecs)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/response_id_codecs.rs && grep -qF "decode_response_id_codecs"
      crates/betterlite-core/fuzz/fuzz_targets/response_id_codecs.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::response_id_codecs::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/response_id_codecs.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/response_id_codecs-*)"
      && grep -qE "^[[:space:]]+response_id_codecs:" tools/oracle/fuzz/corpus/helper_case/response_id_codecs-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/response-id-codecs)"
