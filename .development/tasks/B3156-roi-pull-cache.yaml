id: B3156
title: ROI cache records and partial-source handling
description: >-
  Build cache identities, reusable report-record conversion and source-failure
  helpers in crates/betterlite-server::roi_cache. Keep successful per-pull
  writes before final report publication, refresh cached identity evidence,
  retain the previous report on total source failure, and preserve partial-repository
  warnings.

  The cache_key function returns a SHA256 hexdigest of a JSON tuple containing
  "pull-v1", github_api_url rstripped, cache context, repo casefolded, pull
  number, head SHA, title, body (or empty string), and login casefolded. It
  returns None when head.sha is absent or empty string, when body is not in
  model_fields_set, or when login is absent or empty string; these checks catch
  incomplete metadata before hashing.

  The settings_fingerprint function returns a SHA256 hexdigest of the settings'
  github_api_url rstripped, repos tuple, estimator_model and estimator_prompt,
  and backfill_days. Rstrip('/') makes the fingerprint insensitive to trailing
  slashes.

  The _estimate_with_fallback helper catches SourceError from the estimator and
  returns a fallback estimate with status "error" and the error message as
  reasoning, or passes through a successful estimate.

  The _unavailable_record helper builds a complete ROIPullRecord from GitHub
  pull metadata, profile email lookup and an error message, when evidence
  collection failed. When user or user.login is absent or falsy (including
  empty string), login falls back to "deleted-user". The estimate carries
  status "needs_review", None hours, and a formatted message.

  The _read_repository function calls github.pulls for a single repository and
  date range. If it raises SourceError, it returns a _RepositoryPulls with
  unavailable=True and no pulls.

  The _read_repositories function gathers all repository reads in parallel,
  detects fully unavailable cases (raises SourceError when all repos fail or
  only unavailable repos + no pulls from accessible ones), and returns a
  _RepositoryBatch with the flattened queue, unavailable repos and partial-read
  warning message.

  The _processed_records function validates that at least one PR was processed
  and at least one estimate succeeded (not all metadata_unavailable, not all
  estimator errors). It returns an immutable mapping of position to ROIPullRecord.

  The _cache_estimated_pull helper writes an estimated pull to the report
  repository only when the key is non-None, the estimate succeeded, and either
  there is no previous record or the profile/commit emails changed.

  The three SyncManager helpers _previous_report, _cached_record and
  _report_record extract and transform pull records without mutating state.
  _previous_report reads the cached report, returns None on missing or
  validation error. _cached_record adds cached=True to the estimate and
  returns a new ROIPullRecord with the same evidence. _report_record
  constructs a complete ROIPullRecord from evidence, estimate and cache key.

  Expose cache_key and settings_fingerprint; the helpers and SyncManager methods
  are private to the runner task B3157.

