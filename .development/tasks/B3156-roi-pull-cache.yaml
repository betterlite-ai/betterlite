dod:
  - text: cache_key returns None when head.sha is absent or empty string, body is not in model_fields_set, or login is absent or empty string.
    proof: [cache-key-none-cases]
  - text: cache_key returns a SHA256 hexdigest of a JSON tuple including pull number, title, body, and casefolded login.
    proof: [cache-key-hash]
  - text: settings_fingerprint includes github_api_url rstripped, repos, estimator_model, estimator_prompt and backfill_days.
    proof: [settings-fingerprint-includes]
  - text: settings_fingerprint makes fingerprints insensitive to URL trailing slashes via rstrip('/').
    proof: [settings-fingerprint-slash-insensitive]
  - text: _estimate_with_fallback catches SourceError and returns an estimate with status "error" and error message as reasoning.
    proof: [fallback-estimate-error]
  - text: _unavailable_record builds a complete ROIPullRecord when user or user.login is falsy, falling back to "deleted-user".
    proof: [unavailable-record-deleted-user]
  - text: _unavailable_record estimate carries status "needs_review", None hours, and a formatted metadata-error message.
    proof: [unavailable-record-estimate]
  - text: _read_repository calls github.pulls and returns _RepositoryPulls with unavailable=True on SourceError.
    proof: [read-repository-error]
  - text: _read_repositories raises SourceError when all repos are unavailable or only unavailable repos exist with no accessible pulls.
    proof: [repos-total-failure, repos-no-pulls-failure]
  - text: _read_repositories returns partial-read warning message when some repos are unavailable but pulls exist.
    proof: [repos-partial-warning]
  - text: _processed_records raises SourceError when all processed items have metadata_unavailable=True.
    proof: [records-all-unavailable]
  - text: _processed_records raises SourceError when no estimates have status "estimated" and at least one has status "error".
    proof: [records-estimator-failure]
  - text: _processed_records returns an immutable mapping of position to ROIPullRecord for valid batches.
    proof: [records-mapping]
  - text: _cache_estimated_pull does not write when key is None, estimate status is not "estimated", or profile/commit emails unchanged.
    proof: [cache-no-write-conditions]
  - text: _cache_estimated_pull writes the ROIPullRecord when key is non-None, estimate succeeded, and emails changed or no previous.
    proof: [cache-write-condition]
  - text: _previous_report reads the cached report and returns None on missing or validation error.
    proof: [previous-report-read]
  - text: _cached_record adds cached=True to the estimate and preserves all other fields exactly.
    proof: [cached-record-transform]
  - text: _report_record constructs ROIPullRecord from evidence, estimate and cache key with all fields populated.
    proof: [report-record-construct]

