oracle_cases: []

deviations:
  - what: Head SHA emptiness detection treats empty string and None identically, both returning None from cache_key.
    why: Missing data and zero-length data cannot be distinguished in the hash; both are incomplete metadata.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/roi_calculator/pull_cache.py#L15-L18

out_of_scope:
  - "B3150 owns the ROI record types, settings validators and email normalization."
  - "B3152 owns github.pulls, github.profile_email and the GitHub client initialization."
  - "B3153 owns github.evidence and all pull metadata collection."
  - "B3154 owns the Estimator and its estimate method."
  - "B3155 owns read_spend, SyncStore and all database operations."
  - "B3157 owns SyncManager.__init__, .status, .start, .cancel, .heartbeat and ._run; this task owns only ._previous_report, ._cached_record and ._report_record."
  - "B725 owns ConfigRepository.get_param and .set_param contracts."

pitfalls:
  - "cache_key returns None when head.sha is empty string, same as when pull.head is None; both paths represent incomplete metadata."
  - "login fallback to 'deleted-user' triggers for any falsy login, including empty string, not just missing user."
  - "settings_fingerprint rstrips('/') from github_api_url, so identical settings with different trailing slashes produce the same fingerprint."
  - "_estimate_with_fallback converts only SourceError to a fallback estimate; other exceptions propagate."
  - "_unavailable_record uses the profile email from github.profile_email lookup, which may return empty string; the emails tuple is (profile,) if profile is truthy, else ()."
  - "_read_repositories flattens (repo, pull) pairs from all group.pulls into a single queue; order is (all pulls from repo1, then all from repo2, ...)."
  - "_processed_records raises SourceError on total metadata failure or estimator failure; it validates only that at least one PR was processed and at least one succeeded."
  - "_cache_estimated_pull compares (profile_email, emails) tuples to detect changes; the comparison includes the field itself, not just the set of emails."
  - "_cached_record creates a new TypeAdapter(ROIEstimate) with cached=True added to the estimate mapping; it preserves all evidence fields from the original pull."
  - "_report_record and _cached_record both copy all ROIPullRecord fields; they differ in the estimate treatment (fresh vs cached)."

