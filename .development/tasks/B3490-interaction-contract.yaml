id: B3490
title: Select interaction providers and prepare optional fields
description: >-
  Define the Rust contract for the Google Interactions API and implement provider selection and optional-field preparation.
  Build crates/betterlite-core with two new modules: betterlite_core::api::interactions::contract for the base interaction provider interface, and betterlite_core::api::interactions::utils for provider selection and optional-field extraction.
  The Interactions API lets callers specify a provider (Gemini API via 'gemini' or Vertex AI via 'vertex_ai' and 'vertex_ai_beta') and create interactions (asynchronous conversations that may be resumed with previous_interaction_id). The contract defines the methods each provider implementation must provide: validation, URL construction, request transformation, response transformation, error conversion, and lifecycle operations (get, delete, cancel).
  Provider selection matches the provider string against the literal identifiers 'gemini', 'vertex_ai' (LlmProviders.VERTEX_AI.value), and 'vertex_ai_beta' (LlmProviders.VERTEX_AI_BETA.value), returning GoogleAIStudioInteractionsConfig for 'gemini', VertexAIInteractionsConfig for the two Vertex values, and None for all other inputs including empty string or None. No default fallback to Gemini happens in this function; the HTTP handler tasks and route tasks decide what default to use when the selection returns None. The None signal is also consumed by the Responses compatibility bridge in B3498 to synthesize interaction records from the OpenAI SDK instead of calling the native API.
  Optional-field extraction filters parameters to include only the named fields from the OpenAPI spec (tools, system_instruction, generation_config, stream, store, background, environment, response_modalities, response_format, response_mime_type, previous_interaction_id, agent_config), keeps explicitly passed false and empty values (they are not the same as unspecified None), and drops provider-specific defaults without encoding the provider name in the extraction logic.
  PreProcessNonDefaultParams.base_pre_process_non_default_params (a shared utility that filters params by comparing to defaults) is the extraction implementation; this task calls it with the named optional-field set and a default_param_values dict that maps each field to None, then returns the filtered result to callers that decide which optional fields to include in provider requests.
