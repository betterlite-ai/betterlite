pitfalls:
- 'The oracle helper for this task is pre-registered as model_metadata_resolution in the models group. Replace the stub Op in tools/oracle/src/helpers/models/model_metadata_resolution.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/model_metadata_resolution.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A provider-mismatched exact catalog entry still blocks generalization fallback.
- Dynamic metadata can return an empty dict and bypass all static defaults.
- The config fetch maps every failure (a non-200 status, a transport error, a timeout, bad JSON, a missing key)
  to the same None; nothing distinguishes a gated repo from a model that does not exist.
