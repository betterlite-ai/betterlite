id: B2219
title: Provider-aware model metadata resolution
description: >-
  Resolve shared provider-aware model metadata below capability gates. This is the helper path deliberately separated
  from get_model_info to avoid recursive supported-parameter queries; never call the upper public SDK B157 or full
  parameter-query wrapper from this implementation. Use B2220 metadata adapters, B2217 names/keys, B2229 generalizations
  and B2218 projection.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/utils.py: _get_model_info_from_generalization
  L5742-L5777; _strip_mantle_region_prefix L5780-L5783; _get_potential_model_names L5786-L5844; _get_max_position_embeddings
  L5847-L5867; _model_not_mapped_message L5921-L5925; _get_model_info_helper entry/selection L5928-L6110 and error
  boundary L6373-L6377.


  Named case contracts: potential_names: With provider None try B174 inference; on any error leave split_model=original
  and provider unchanged. Combined/provider-prefixed names remain original; strip the original using B2217. With
  a truthy explicit provider already prefixing the model, split once, keep combined=original, strip the suffix,
  and form provider/stripped plus provider/original (which can repeat the prefix). Otherwise split=original, combined=provider/model
  and combined_stripped=provider/stripped. For bedrock/bedrock_converse strip routing only from split_model. For
  bedrock_mantle strip region from split_model and recompute combined_stripped as bedrock_mantle/stripped_region_free_name.
  A truthy metadata-adapter cost key overrides only provider_prefixed_model_name; Fireworks uses B2222. provider_aliases:
  Merge azure_llms then azure_embedding_models, so embedding aliases override chat aliases; rewrite a matching model
  once. vertex_ai_beta becomes vertex_ai. For Vertex, add meta/ when that candidate belongs to vertex_llama3_models;
  otherwise append @latest when that candidate belongs to vertex_mistral_models or vertex_ai_ai21_models. Pass explicit
  provider or B209 declared_authenticating_provider to potential-name resolution. dynamic_provider_metadata: For
  a known provider select B2220 using the rewritten model; call a callable get_model_info with model, api_base and
  api_key before static lookup. Any non-None return is authoritative, including an empty dict, and bypasses fixed-field
  projection. Exceptions warn Could not get dynamic model info for model={model}, provider={provider}; falling back
  to the static cost map: {error}, then continue. B2223/B2224 implement the actual Ollama/Lemonade methods; no guessed
  dynamic query is added for other adapters. ordered_exact_lookup: Try combined_model_name, rewritten original model,
  split_model, combined_stripped_model_name, stripped_model_name, provider_prefixed_model_name in that order, using
  B2217 case-insensitive cost keys. A found entry must pass B2217 provider matching or continue. First compatible
  entry wins; do not sort candidates or generalize before exhausting them. fill_missing_exact_entry: For an exact
  matched entry whose mode is chat/responses (absent mode defaults chat, explicit None does not), call B2229 fill
  rules using the actual matched key and entry provider (absent becomes empty string). Fill only keys absent from
  the original entry; explicit None/False/zero remain. Preserve original values and do not mutate the shared catalog.
  generalization_only_unknown: If no compatible exact entry exists, first test whether any of the same six candidate
  keys exists at all. Even a provider-mismatched exact entry blocks generalizations. Otherwise the first candidate
  with a non-None capability-rule result wins; an empty dict counts as a match. If requested provider is None retain
  the rule provider; otherwise overwrite litellm_provider with the requested provider. Then B2218 projects the result.
  unmapped_error_boundary: If no entry/rule remains, raise ModelNotMappedError with This model isn't mapped yet.
  model={model}, custom_llm_provider={provider}. Add it here - https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json.
  Preserve that exception type. Any other outer error logs Error getting model info: {error} and raises a generic
  Exception with the same formatted unmapped message. Preserve source model/provider values after the mutations
  completed before the failure. huggingface_config_metadata: For provider huggingface return key=model, provider=huggingface,
  mode=chat, input/output token prices 0, max_tokens equal to config max_position_embeddings or None; max_input_tokens/max_output_tokens
  and supports_system_messages, supports_response_schema, supports_function_calling, supports_tool_choice, supports_assistant_prefill,
  supports_prompt_caching, supports_prompt_cache_breakpoint, supports_thinking_cache_preservation, supports_computer_use,
  supports_pdf_input all None. The config helper GETs https://huggingface.co/{model}/raw/main/config.json through
  B173's shared client, the way B5084 fetches Hugging Face files for chat templates, with timeout literal HF_CONFIG_FETCH_TIMEOUT_SECONDS=10.0
  seconds. It returns the provided max_position_embeddings value without coercion and catches read, status, JSON
  and missing-shape failures to None. Native production and the oracle fixture transport share this decoder and
  this pinned URL and timeout; production builds its client from B173, and an oracle case points the client's base
  URL at a local server instead of huggingface.co.


  Hugging Face fetch: take the client as a constructor field with an overridable base URL, so tests point it at
  a local server. A non-200 status, a transport error, a body over B173's buffered-body limit, and a JSON body missing
  or wrong-shaped for max_position_embeddings all map to None, the same as LiteLLM's blanket except clause. Add
  test model_metadata_resolution::hf_config::tests::fetch_follows_litellm against a local server covering a 200
  status, a non-200 status, a bad JSON body and a timeout past HF_CONFIG_FETCH_TIMEOUT_SECONDS. LiteLLM caches the
  full model info lookup through _cached_get_model_info_helper, not this fetch on its own; that lru cache sits one
  layer up and stays out of scope under B2225, so this task adds no cache of its own.


  Outside-byte boundary: decode_hf_model_config consumes the bounded config.json response body bytes; the same
  decoder serves the fetch's success path, the fixture transport oracle seam and the cargo-fuzz target, and returns
  max_position_embeddings without implicit coercion, in crates/betterlite-models/src/model_metadata_resolution.rs
  or its scoped child module. Use that production decoder from the request path, Rust oracle adapter and cargo-fuzz
  target crates/betterlite-models/fuzz/fuzz_targets/hf_model_config.rs. Add valid, malformed, truncated and boundary
  corpus inputs and adjacent test replays_the_hf_model_config_corpus that checks outcome categories through this
  decoder. The B171 HelperCase parser is a separate boundary.


  Implement crates/betterlite-models/src/model_metadata_resolution.rs with adjacent tests under model_metadata_resolution/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function model_metadata_resolution_cases in betterlite-models with these exact named cases (one per
  oracle file): potential_names, provider_aliases, dynamic_provider_metadata, ordered_exact_lookup, fill_missing_exact_entry,
  generalization_only_unknown, unmapped_error_boundary, huggingface_config_metadata. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/model_metadata_resolution* using HelperCase:
  kind: helper and the externally tagged model_metadata_resolution variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_model_metadata_resolution that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 286 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 340 production lines, 330 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 65 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 900 planned, 925 maximum changed lines. Raised from 775/775 for the real Hugging Face fetch: a client
  wired through B173, the new local-server fetch test, and the oracle adapter change from an injected-bytes seam
  to a fixture transport at the client's call seam.
