checks:
  optional:
  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_file_content.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_file_content*")"
      && grep -lq 'bedrock_services_file_content' tools/oracle/fuzz/corpus/helper_case/bedrock_services_file_content*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_file_content$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-raw-binary-reply
    why: For raw_response.status_code<400, return B004 HttpxBinaryResponseContent wrapping the original response,
      including its exact bytes,status,headers and request metadata, with the wrapper's fresh empty hidden_params.
      Do not UTF-8-decode, JSONL-transform, infer a filename/purpose or replace content-type with application/octet-stream.
      Test invalid UTF-8, NUL bytes, JSON-looking content and nondefault content-type/disposition headers.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::file_content_cases::case_[0-9]+_raw_binary_reply$/)'
  - id: case-empty-binary-reply
    why: An empty successful response is valid and remains empty, with its original headers/status. No synthetic
      JSON object or batch-output record is created. The wrapper uses B004 binary summary/stream behavior; body
      consumption and cancellation remain owned by the shared API transport.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::file_content_cases::case_[0-9]+_empty_binary_reply$/)'
  - id: case-failed-binary-reply
    why: For status>=400 raise B682 BedrockError preserving original status,raw_response.text,headers and response.
      Binary-error text decoding follows the shared HTTP response library rather than a new provider decoder. Empty
      error text remains empty; do not substitute a status message or parse an embedded JSON error.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::file_content_cases::case_[0-9]+_failed_binary_reply$/)'
  - id: case-non-error-statuses
    why: This transform tests only >=400, so informational,redirect and204 responses are wrapped rather than rejected
      here. The generic transport may independently enforce its status contract before calling the transform. The
      Python oracle calls this exact production transform on supplied responses; it does not monkeypatch the registry
      to make the dead boto3 branch reachable.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::file_content_cases::case_[0-9]+_non_error_statuses$/)'
