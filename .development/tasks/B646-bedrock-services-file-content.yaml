pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_file_content in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_file_content.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_file_content.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The legacy boto3 file-content branch has a textual caller but is bypassed by unconditional provider-config selection.
- Binary content may look like JSONL and must still be returned byte-for-byte.
