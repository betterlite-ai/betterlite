- text: 'non_error_statuses: This transform tests only >=400, so informational,redirect and204 responses are wrapped
    rather than rejected here. The generic transport may independently enforce its status contract before calling
    the transform. The Python oracle calls this exact production transform on supplied responses; it does not monkeypatch
    the registry to make the dead boto3 branch reachable.'
  proof:
