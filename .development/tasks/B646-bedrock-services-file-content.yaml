id: B646
title: Bedrock binary file content results
description: >-
  Wrap native Bedrock file-content HTTP responses without parsing or rewriting their bytes. The live files path
  selects BedrockFilesConfig through ProviderConfigManager and uses generic content transport with B645 request
  preparation; it returns before the older boto3 BedrockFilesHandler branch. Exclude that unreachable branch and
  the unused BedrockJsonlFilesTransformation subtree instead of creating a second download or batch-conversion path.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  BedrockFilesConfig.transform_file_content_response L1490-L1503.


  Named case contracts: raw_binary_reply: For raw_response.status_code<400, return B004 HttpxBinaryResponseContent
  wrapping the original response, including its exact bytes,status,headers and request metadata, with the wrapper's
  fresh empty hidden_params. Do not UTF-8-decode, JSONL-transform, infer a filename/purpose or replace content-type
  with application/octet-stream. Test invalid UTF-8, NUL bytes, JSON-looking content and nondefault content-type/disposition
  headers. empty_binary_reply: An empty successful response is valid and remains empty, with its original headers/status.
  No synthetic JSON object or batch-output record is created. The wrapper uses B004 binary summary/stream behavior;
  body consumption and cancellation remain owned by the shared API transport. failed_binary_reply: For status>=400
  raise B682 BedrockError preserving original status,raw_response.text,headers and response. Binary-error text decoding
  follows the shared HTTP response library rather than a new provider decoder. Empty error text remains empty; do
  not substitute a status message or parse an embedded JSON error. non_error_statuses: This transform tests only
  >=400, so informational,redirect and204 responses are wrapped rather than rejected here. The generic transport
  may independently enforce its status contract before calling the transform. The Python oracle calls this exact
  production transform on supplied responses; it does not monkeypatch the registry to make the dead boto3 branch
  reachable.


  Implement crates/betterlite-bedrock/src/file_content.rs with adjacent tests under file_content/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function file_content_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  raw_binary_reply, empty_binary_reply, failed_binary_reply, non_error_statuses. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_file_content* using HelperCase:
  kind: helper and the externally tagged bedrock_services_file_content variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_file_content that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 14 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 60 production lines, 165 behavior/config-test lines, 95 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 350 planned, 400 maximum changed lines.
