id: B646
title: Bedrock file content and S3 result conversion
description: >-
  Add authorized file content streaming and result-file conversion, preserving S3 metadata, content bytes and OpenAI
  file object fields. The unused BedrockJsonlFilesTransformation helpers are excluded; live content transforms use
  B648 batch-record callbacks. Use per-operation byte/line limits from the shared transport and release every upstream
  body on cancellation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  BedrockFilesConfig.transform_file_content_response L1490-L1503; BedrockJsonlFilesTransformation._transform_openai_jsonl_content_to_bedrock_jsonl_content
  L1530-L1537; BedrockJsonlFilesTransformation._get_s3_object_name L1539-L1553; BedrockJsonlFilesTransformation._get_content_from_openai_file
  L1555-L1590. litellm/llms/bedrock/files/handler.py: BedrockFilesHandler.afile_content L69-L132; BedrockFilesHandler.file_content
  L134-L173.


  Implement crates/betterlite-bedrock/src/file_content.rs with adjacent tests under file_content/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_file_content in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function file_content_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  authorized_file_content, file_content_binary, empty_file_content, foreign_id_before_network. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_file_content* using HelperCase:
  kind: helper and the externally tagged bedrock_services_file_content variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_file_content that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_file_content_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_services_file_content_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 149 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 180 production lines, 111 behavior/config-test lines,
  71 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 387 planned, 400 maximum changed lines.
