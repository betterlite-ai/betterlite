id: B1019
title: File and batch routing id codecs
description: >-
  Implement common_utils.py L38-L59 and L83-L309 in betterlite-core::api::file_routing_ids.
  Own validate_file_list_limit, ManagedResourceAccessChecker's typed protocol, the file-prefix
  detector/converter, managed-output model selection, target-model and batch-id extraction,
  executed-batch detection, encode_file_id_with_model, encode_batch_response_ids, model/original-id
  decoding and is_model_embedded_id. B1035 supplies the batch response DTO and B732 the principal
  contract. Do not grant access merely because an id decodes.

  There are two distinct formats here. Legacy ids decode to a string starting litellm_proxy, with
  no colon required. New routing ids encode litellm:<original>;model,<name> as URL-safe base64
  without padding, with an outer file- or batch_ prefix. Use decode_file_routing_ids(bytes, limits)
  at the external id boundary, preserving Python's permissive base64 behavior and nullable/pass-through
  outcomes. Add a fuzz target and replays_corpus for that function. There are no settings or env vars.

  The file_routing_ids helper invokes pure Python functions and native equivalents; comparisons of
  encoding use deterministic literal decoded payloads, not invented UUIDs. Add adjacent domain tests
  named below. The spans contain 190 nonblank, non-comment lines. Budget 175 implementation, 125 tests,
  100 fixtures, 80 adapters, 55 fuzz/replay and 35 wiring lines: 570 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/file_routing_ids.rs
  - crates/betterlite-core/src/api/file_routing_ids/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/file_routing_ids.rs
  - crates/betterlite-core/fuzz/corpus/file_routing_ids/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/file_routing_ids.rs
  - tools/oracle/src/helpers/core_ops/file_routing_ids/**
  - tools/oracle/helpers/file_routing_ids.py
  - tools/oracle/helpers/file_routing_ids/**
  - tools/oracle/fuzz/corpus/helper_case/file_routing_ids-*
  - tools/oracle/cases/helpers/file-routing-ids/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L38-L59
  why: Owns file-list limit validation and the continuation/executed-batch literals exported to callers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L83-L309
  why: Owns complete legacy and model-embedded id helpers, including in-place batch response mutation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L73-L73
  why: MAX_FILE_LIST_LIMIT is 10000, not the 500-record continuation fetch size.
dod:
- text: >-
    list_limit_bounds accepts null, 1 and 10000. Zero gives ProxyException type=invalid_request_error,
    param=limit, code="400", openai_code=integer_below_min_value and source message "Invalid 'limit':
    integer below minimum value. Expected a value >= 1, but got 0 instead." 10001 uses
    integer_above_max_value and "Invalid 'limit': integer above maximum value. Expected a value
    <= 10000, but got 10001 instead." Export continuation size 500 and batch_create hidden key.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    legacy_prefix_and_targets encodes litellm_proxy;model_id:m;llm_batch_id:b and expects successful
    file-prefix detection, while B1016's colon detector returns false. Encoded litellm_proxyjunk also
    passes this startswith check. Malformed base64, invalid UTF-8 and non-string values return false;
    converter returns the original input on failure. Target text target_model_names,a, b,,a yields
    [a,b,"",a]; absent/empty/non-string yields []. Output model selection returns a,b,,a for those
    targets, otherwise the supplied fallback (including null). It decodes first; the extractor alone does not.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    batch_identifier_fields reads model_id:m as m even without a proxy prefix; missing/non-string
    yields null and model_id:; yields "". llm_batch_id:b;other and generic_response_id:g,other yield
    b and g. Non-string batch input yields ""; a string with neither field raises IndexError.
    is_litellm_executed_batch is true only when the suffix after llm_batch_id: starts litellm_batch_.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    model_embedded_roundtrip encodes file-a/model=public, batch_a/model=public and numeric 123 with
    id_type=batch. Outer prefixes are file-, batch_ and batch_; decoded payloads are respectively
    litellm:file-a;model,public, litellm:batch_a;model,public and litellm:123;model,public.
    A recognized input prefix wins over a conflicting id_type. Bare encoded payloads also decode.
    Model values are stripped but original ids are not; malformed ids return model=null, original
    unchanged and is_model_embedded_id=false. An empty model can still recover an original id while
    is_model_embedded_id=false; repeated model fields use the first nonempty match.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    batch_response_encoding mutates id=b, output_file_id=o, error_file_id=e, input_file_id=i into
    batch_-prefixed b and file--prefixed o/e/i encodings for model=m; unrelated fields remain unchanged.
    Null/empty id prevents every mutation, and absent/empty secondary ids remain untouched. A second
    encoding call wraps the already encoded ids again; do not silently make it idempotent.
  proof: [behavior-tests, oracle, helper-python]
- text: Id decoders share newly added malformed and legacy corpus inputs with production and helper adapters.
  proof: [parser-corpus, helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: routing id or list-limit tests are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_routing_ids::/) - test(/::replays_corpus$/)'
  - id: parser-corpus
    why: id decoding lacks a connected fuzz target and fresh corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/file_routing_ids)" && grep -qF decode_file_routing_ids crates/betterlite-core/fuzz/fuzz_targets/file_routing_ids.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_routing_ids::tests::replays_corpus$/)'
  - id: helper-python
    why: the id comparison adapter is missing or fails typing
    run: test -f tools/oracle/helpers/file_routing_ids.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the helper decoder has no new file_routing_ids input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_routing_ids-*)" && grep -qE '^[[:space:]]+file_routing_ids:' tools/oracle/fuzz/corpus/helper_case/file_routing_ids-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no routing-id parity cases were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-routing-ids)"
oracle_cases:
- tools/oracle/cases/helpers/file-routing-ids/list-limit-bounds.yaml
- tools/oracle/cases/helpers/file-routing-ids/legacy-prefix-and-targets.yaml
- tools/oracle/cases/helpers/file-routing-ids/batch-identifier-fields.yaml
- tools/oracle/cases/helpers/file-routing-ids/model-embedded-roundtrip.yaml
- tools/oracle/cases/helpers/file-routing-ids/batch-response-encoding.yaml
deviations: []
out_of_scope:
- validate_file_list_purpose, is_gemini_supported_mime_type, get_content_type_from_file_object, map_raw_file_ids_to_unified and apply_unified_file_ids have no MIT runtime caller at the pin; no cases activate them.
- B1020 owns credential/model-routing functions L317-L709; B1021 owns creation/managed-requirement functions L889-L1130. The MIME inference/normalization functions L772-L830 serve only unused wrappers and have no live caller.
- B1041 owns all batch-response/database functions from _batch_response_model_id_candidates through update_batch_in_database (L1138-L1549), except the two unused mapping functions above.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_routing_ids in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_routing_ids.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_routing_ids.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- openai_code records the bound-specific reason, but ProxyException.code remains the string "400".
- A model-embedded id with an empty model can decode its original id without being considered model-embedded.
- The legacy batch parser throws when neither batch nor generic-response marker exists; do not turn that branch into an empty successful id.
review_level: security
budget:
  max_changed_lines: 570
  max_new_expects: 0
