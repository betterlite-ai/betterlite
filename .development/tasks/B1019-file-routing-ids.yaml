id: B1019
title: File routing ids
description: >-
  Implement legacy file/batch ID codecs, list limit/purpose validation and managed-output model hints. Export typed
  addressed FileId/BatchId views and encode_batch_response_ids for B086; keep encoded routing hints separate from
  managed-resource-access authorization.


  SpecialEnums file format is litellm_proxy:{};unified_id,{};target_model_names,{};llm_output_file_id,{};llm_output_file_model_id,{}.
  Batch format is litellm_proxy;model_id:{};llm_batch_id:{}. Fine-tuning format is litellm_proxy;model_id:{};generic_response_id:{}.
  The common file detector accepts litellm_proxy; batches; B1016 colon detector does not.


  validate_file_list_purpose (litellm/proxy/openai_files_endpoints/common_utils.py:L62-L80) has no MIT runtime caller
  at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior case exercises
  that unused entry point.


  Implement crates/betterlite-core/src/api/file_routing_ids.rs. Use FileRoutingIdsInput and FileRoutingIdsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): common_utils.py:53 type='invalid_request_error', param='limit', code=400, openai_code=openai_code.
  Compare the actual source status, error type, param and code; ignore only error wording except in message-extraction
  tests.


  Write adjacent tests.rs behavior functions list_limit_bounds, invalid_purpose, file_model_encoding, batch_id_model_extraction,
  native_file_id, encoded_output_file_id, unified_batch_id, batch_prefix_detector_dif_49f6 under api::file_routing_ids::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::file_routing_ids::decode_file_routing_ids(bytes:
  &[u8], limits: &ApiLimits), for base64.urlsafe_b64decode input padded at litellm/proxy/openai_files_endpoints/common_utils.py:106;
  base64.urlsafe_b64decode input padded at litellm/proxy/openai_files_endpoints/common_utils.py:264; base64.urlsafe_b64decode
  input padded at litellm/proxy/openai_files_endpoints/common_utils.py:293. Place its implementation in crates/betterlite-core/src/api/file_routing_ids.rs
  and call it from the actual boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/file_routing_ids.rs
  passes arbitrary bounded bytes to that exact decoder; api::file_routing_ids::tests::replays_corpus replays newly
  committed seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::FileRoutingIds in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_routing_ids: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/openai_files_endpoints/common_utils.py: validate_file_list_limit (L44-L59);
  litellm/proxy/openai_files_endpoints/common_utils.py: ManagedResourceAccessChecker.can_user_call_unified_file_id
  (L85-L89); litellm/proxy/openai_files_endpoints/common_utils.py: ManagedResourceAccessChecker.can_user_call_unified_object_id
  (L91-L95); litellm/proxy/openai_files_endpoints/common_utils.py: _is_base64_encoded_unified_file_id (L98-L112);
  litellm/proxy/openai_files_endpoints/common_utils.py: convert_b64_uid_to_unified_uid (L115-L120); litellm/proxy/openai_files_endpoints/common_utils.py:
  resolve_managed_output_file_model_name (L123-L131); litellm/proxy/openai_files_endpoints/common_utils.py: get_models_from_unified_file_id
  (L134-L152); litellm/proxy/openai_files_endpoints/common_utils.py: get_model_id_from_unified_batch_id (L155-L168);
  litellm/proxy/openai_files_endpoints/common_utils.py: get_batch_id_from_unified_batch_id (L171-L180); litellm/proxy/openai_files_endpoints/common_utils.py:
  is_litellm_executed_batch (L183-L185); litellm/proxy/openai_files_endpoints/common_utils.py: encode_file_id_with_model
  (L188-L229); litellm/proxy/openai_files_endpoints/common_utils.py: encode_batch_response_ids (L232-L243); litellm/proxy/openai_files_endpoints/common_utils.py:
  decode_model_from_file_id (L246-L272); litellm/proxy/openai_files_endpoints/common_utils.py: get_original_file_id
  (L275-L302); litellm/proxy/openai_files_endpoints/common_utils.py: is_model_embedded_id (L305-L309). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 144 owned nonblank/non-comment/non-docstring Python lines (187 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 164 implementation,
  88 behavior tests, 96 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 528 total within the 530-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1015 (File contracts), B1016 (Managed
  resource ids), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the
  external B500-B859 ids retain ownership on the provider and keys/data branches.
