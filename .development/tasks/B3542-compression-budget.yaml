id: B3542
title: Token-budget compression and retrieval tool generation
description: >-
  Implement the compress orchestrator that combines normalized messages, relevance
  scores, protected history and token counting to return compressed messages,
  the original-content cache and schema-appropriate retrieval tools. This is
  the core compression engine in betterlite-compression crate, layered above
  B3540's message normalization and B3541's scoring.

  Functions to port:
  - build_retrieval_tool: build OpenAI-format tool definition with enum parameter
    for available keys.
  - _build_retrieval_tools: convert to target schema (OpenAI function tool or
    Anthropic custom tool) by calling AnthropicConfig._map_tools when needed.
  - _select_kept_indices_for_budget: fill token budget greedily from highest-scoring
    units (single messages or atomic Anthropic tool exchanges). Truncate single
    messages only when >= 100 tokens remain in budget. Preserve exact token
    accounting per message and per span.
  - _get_dropped_tool_span_indices: mark all indices in completely dropped
    Anthropic exchanges (spans with no kept indices).
  - compress: the main orchestrator. Normalize messages by call type, count
    original tokens, skip compression if below compression_trigger, score messages,
    select kept messages within token budget, stub dropped non-exchange messages,
    build cache and retrieval tools, count compressed tokens, return CompressedResult.

  Also own the retrieval tool name constant ('litellm_content_retrieve') and the
  CompressedResult TypedDict fields.

  Default compression_target is compression_trigger * 7 // 10 when not supplied.
  Compression ratio is rounded to 4 decimal places. The target is not enforced
  as a hard bound: if protected content alone exceeds it, the result can be larger.
  Messages below the trigger pass through unchanged with compression_skipped_reason.
  Invalid Anthropic tool sequences return original messages with
  invalid_anthropic_tool_sequence reason (after scoring has completed).
  Dropped Anthropic exchanges are omitted entirely (not stubbed); only non-exchange
  messages are replaced with stubs.

  Scope:
  - betterlite-compression: message budgeting, tool building, retrieval cache, result type
  - betterlite-compression imports from B3540 (normalization), B3541 (scoring),
    B196 (token_counter), and B575 (AnthropicConfig._map_tools)

