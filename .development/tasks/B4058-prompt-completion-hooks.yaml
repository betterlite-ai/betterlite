id: B4058
title: Prompt compilation orchestration and completion hooks
description: >-
  Build the sync and async orchestration for prompt compilation and completion hooks across all prompt backends.
  Add compile_prompt and async_compile_prompt methods to coordinate template compilation with client message appending
  and result population. Implement get_chat_completion_prompt and async_get_chat_completion_prompt completion hooks
  for dotprompt, gitlab, bitbucket and generic backends, each delegating to the orchestration methods.

  The orchestration flow is: check if prompt_id is None (short-circuit in sync path), verify backend eligibility,
  call the backend's _compile_prompt_helper or async_compile_prompt_helper, append client messages after compiled
  template messages, and populate completed_messages. In async path, check should_run_prompt_management;
  in sync path, short-circuit before checking. For gitlab and bitbucket sync completions, forward prompt_spec
  unchanged but omit the ignore_prompt_manager_model and ignore_prompt_manager_optional_params arguments,
  so the base method uses its False defaults for those two while resolve_prompt_manager_ignore_flags still runs
  against the real prompt_spec. Merge template optional params over request params, apply model override, and
  ensure backend-specific initialization hooks are kept separate from these upper orchestration adapters.
scope:
  paths:
    - crates/betterlite-prompts/src/orchestration.rs
    - crates/betterlite-prompts/src/orchestration/**
  lint_tables: false
