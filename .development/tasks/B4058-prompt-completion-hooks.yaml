    why: Generic prompt API completion hooks delegating to base orchestration.
dod:
  - text: compile_prompt calls the backend's _compile_prompt_helper, appends client messages to compiled template messages, and populates completed_messages in the returned PromptManagementClient.
    proof: [orchestration-tests]
  - text: async_compile_prompt calls async_compile_prompt_helper, appends messages and populates completed_messages the same way.
    proof: [orchestration-tests]
  - text: get_chat_completion_prompt short-circuits returning (model, messages, params) when prompt_id is None, before checking eligibility.
    proof: [orchestration-tests]
  - text: get_chat_completion_prompt checks should_run_prompt_management and returns (model, messages, params) unchanged if false.
    proof: [orchestration-tests]
  - text: get_chat_completion_prompt calls compile_prompt, then post_compile_prompt_processing with resolved ignore flags, and returns the processed result.
    proof: [orchestration-tests]
  - text: async_get_chat_completion_prompt does not short-circuit on None prompt_id; it checks should_run_prompt_management first, then calls async_compile_prompt.
    proof: [orchestration-tests]
  - text: async_get_chat_completion_prompt returns (model, messages, params) when should_run returns false before any async work.
    proof: [orchestration-tests]
  - text: GitLabPromptManager get_chat_completion_prompt and async_get_chat_completion_prompt delegate to PromptManagementBase, forwarding prompt_spec but omitting the ignore-flag parameters in sync.
    proof: [orchestration-tests]
  - text: BitBucketPromptManager get_chat_completion_prompt and async_get_chat_completion_prompt delegate similarly, forwarding prompt_spec but omitting sync ignore flags.
    proof: [orchestration-tests]
  - text: DotpromptManager completion hooks call PromptManagementBase methods with all parameters.
    proof: [orchestration-tests]
  - text: GenericPromptManager completion hooks call PromptManagementBase methods with all parameters.
    proof: [orchestration-tests]
  - text: Compile errors are caught and wrapped with a message naming the prompt_id.
    proof: [orchestration-tests]
  - text: Message appending raises ValueError wrapped with error context if concatenation fails.
    proof: [orchestration-tests]
checks:
  optional: []
  commands:
    - id: orchestration-tests
      why: orchestration and completion hook tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^prompt_orchestration::|^completion_hooks::/)'
oracle_cases: []
deviations:
  - what: GitLab and Bitbucket sync completion hooks forward prompt_spec unchanged but omit the ignore_prompt_manager_model and ignore_prompt_manager_optional_params parameters when calling PromptManagementBase.get_chat_completion_prompt. These parameters default to False in the base method, while resolve_prompt_manager_ignore_flags still runs unconditionally with the real prompt_spec.
    why: LiteLLM's GitLabPromptManager and BitBucketPromptManager sync methods omit the ignore-flag parameters while forwarding the real prompt_spec; the base method still calls resolve_prompt_manager_ignore_flags with the real spec and False defaults.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gitlab/gitlab_prompt_manager.py#L576-L587
  - what: Async get_chat_completion_prompt does not short-circuit on None prompt_id; it checks should_run_prompt_management before any compilation.
    why: LiteLLM's async method always gates on should_run_prompt_management; only the sync path short-circuits None.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prompt_management_base.py#L228-L233
out_of_scope:
  - Backend implementation details (B4052 dotprompt, B4054 gitlab, B4056 bitbucket, B4057 generic); those own their should_run_prompt_management and _compile_prompt_helper/_async_compile_prompt_helper overrides.
  - Initialization or registry-entry code; prompt_initializer and registration logic remain in B4050-B4057.
  - Request-body validation, error conversion beyond wrapping compile errors, or integration with external logging (Langfuse, Arize); those tasks use this orchestration but are not called by it.
  - The merge_messages helper function (lines 74-79); it is not called at the pinned commit in open-source LiteLLM runtime code.
pitfalls:
  - Sync get_chat_completion_prompt short-circuits on None prompt_id before any other checks; this is the only path that does.
  - Async get_chat_completion_prompt does not short-circuit on None; it checks should_run_prompt_management first and returns if false.
  - Compile errors are caught at message concatenation (the attempt to append compiled template to client messages), not at compile completion; only that join point is wrapped.
  - GitLab and Bitbucket sync completions omit forwarding the two ignore-flag parameters to the base method, but the base method still unconditionally calls resolve_prompt_manager_ignore_flags with the real prompt_spec (using OR logic to merge spec and parameter flags).
  - The PromptManagementClient is a dict-like record (TypedDict); completed_messages is populated in place, not in a new returned value.
  - Template optional params fully override request params in post_compile_prompt_processing; this is a dict spread, not a merge of individual keys.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
