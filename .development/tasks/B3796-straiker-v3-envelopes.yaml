deviations:
  - what: Token decoding uses tiktoken with text-davinci-003 when available; absent tokenizer returns None and the raw prompt is relayed untouched instead of raising.
    why: LiteLLM's token decoder gracefully falls back when tiktoken is unavailable. betterlite preserves this fallback to relay unscreened prompts rather than fail the request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/straiker/straiker.py#L500-L508
  - what: Placeholder identities (default_user_id and litellm_proxy_master_key) are filtered out of the user identity, returning None so they are not recorded as Straiker identities.
    why: LiteLLM's proxy does not identify the admin/proxy itself to downstream services; betterlite follows this convention to avoid master-key calls being scored under proxy admin identity.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/straiker/straiker.py#L381-L388
  - what: Conversation prefix hashing uses SHA256 with UTF-8 JSON encoding and a 0x1E separator byte between messages, matching LiteLLM's approach.
    why: LiteLLM's stable prefix hashing is the contract with Straiker for replay detection. betterlite replicates the exact encoding and separator to maintain compatibility.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/straiker/straiker.py#L654-L675

