pitfalls:
  - "Credential redaction is one level deep on purpose: a function schema that defines a `token` or `headers` property lives under `parameters` and must be relayed as sent."
  - "_v3_prompt_texts returns None when decoding fails; the caller must check None and relay the untouched prompt instead of assuming success."
  - "Token lists that decode to None are indistinguishable from no tokens; check the return value, never assume all-or-nothing success."
  - "_v3_conversation_prefixes returns one hash for plain prompt/input, one hash per message in sequences; the list length differs based on input shape."
  - "Conversation prefixes include all messages in order, including system/developer preamble; the hash is a fingerprint of the exact sequence, not user turns only."
  - "Session ID derivation hashes both the user principal and the conversation preamble+first user text; two users who open with the same words are two sessions."
  - "_v3_system_text finds the system field first, then instructions, then a leading system/developer message; it never returns None when any of these are present."
  - "First user message text skips system/developer roles and returns the first role=user message; it never includes the system preamble."
  - "_v3_user filters placeholder identities and returns None for proxy-admin calls; the None return means the principal was masked, not that identity is unknown."
  - "User-Agent recognition returns only (client, agent name) pairs from the allowlist; unrecognized agents return None and the client header is omitted."
  - "_v3_headers returns a frozen mapping with only present-valued fields; all four routing hints are optional."
  - "_v3_decision reads permissionDecision first from nested hook output, then action from the verdict; reading only one envelope would miss block decisions."
  - "_v3_blocked_by returns a sorted tuple; the order is stable across runs and skips duplicate controls."
  - "_v3_response returns None for undecided/ask decisions with no blocked_by controls; the None means no action, not that Straiker was silent."
  - "The v3 response decision defaults to 'NONE' (allow) when Straiker gives no verdict; an absent verdict is treated as allow, not fail-open deny."

