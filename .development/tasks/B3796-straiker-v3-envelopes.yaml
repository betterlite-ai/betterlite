id: B3796
title: Straiker v3 provider envelopes and sessions
description: >-
  Build credential-filtered v3 payloads, client/session headers and v3 response decisions for chat,
  text and Anthropic calls. The task builds the unified Kong plugin's contract for request and
  response phases, including one-level credential removal from tool and MCP server schemas,
  stable conversation-prefix hashing from prompt or message sequences, and session derivation
  from principal identity and conversation content. Message text extraction handles both string
  and list-of-blocks content. Preserve User-Agent identity recognition for Claude Code sessions,
  stable conversation-prefix hashing on the full request payload after credential scrubbing,
  and the three-tier session resolution: client-supplied header, LiteLLM metadata session, or
  a derived hash of user identity and conversation preamble. Token decoding uses tiktoken with
  text-davinci-003; absent tokenizer returns None to relay the raw prompt untouched.

