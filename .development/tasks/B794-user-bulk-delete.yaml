    (L193-L196).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as user_bulk_delete in the server group. Replace the stub Op in tools/oracle/src/helpers/server/user_bulk_delete.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/user_bulk_delete.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Organization authority comes from membership rows, and an orgless target fails even for an org admin.
  - Only the transaction is caught as row errors; a failed postcommit broadcast can leave deletion committed.
budget:
