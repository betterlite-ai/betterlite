id: B794
title: Bulk user deletion and membership cleanup
description: >-
  Implement BulkUserDeletion and BulkTeamRemoval over writer transactions, scoped organization authority
  and exact user/email identity matching. Remove key, invitation and membership references in source order,
  return per-row failures and publish invalidations after commit.


  Build the production user_bulk_delete module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/bulk_user_deletion.py:
  _UserBatchDeletion.deleted_key_tokens (L110-L111; 2 source lines), _invitation_tx_db (L169-L170; 2 source
  lines), _org_membership_tx_db (L173-L174; 2 source lines), _error_message (L199-L206; 8 source lines),
  _bounded (L209-L216; 6 source lines), _caller_admin_org_ids (L368-L376; 9 source lines), _scope_error
  (L379-L385; 7 source lines), _delete_user_rows (L388-L419; 32 source lines), _delete_users_tx (L422-L461;
  40 source lines), _delete_users (L464-L510; 47 source lines), bulk_delete_users (L513-L596; 78 source
  lines).


  Add the user_bulk_delete operation under B856 Management::users. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a user-bulk-delete-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 233 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  233 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 473 changed lines estimated within a 475-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
