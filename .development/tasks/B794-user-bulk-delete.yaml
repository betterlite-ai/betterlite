    row projection; B738 owns JWT cache-key snapshots; B734 owns token cache eviction;
    B784/B797 own key/user audit sinks. B1202 owns shared team records and the transaction timeout.
  - 'litellm/proxy/management_helpers/bulk_user_deletion.py: B1202 owns _TeamRemoval.deleted_key_tokens
    (L99-L100), _team_not_found (L120-L128), _team_tx_db (L153-L154), _membership_tx_db (L161-L162), _same_email
    (L177-L178), _addresses_member (L181-L184), _with_row_email (L187-L190), _remove_members_from_team
    (L219-L288), _emit_team_members_metric (L291-L298), _duplicate_member_indexes (L301-L310), bulk_remove_team_members
    (L313-L365), _forbidden (L131-L134), _in_filter (L137-L138), _eq_filter (L141-L142), _team_users_filter
