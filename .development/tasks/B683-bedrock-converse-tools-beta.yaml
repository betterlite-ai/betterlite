pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_converse_tools_beta in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/converse_tools_beta.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_converse_tools_beta.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A systemTool key is sufficient for pass-through even when its value is None.
- Computer beta values may duplicate a caller value, while eager, effort and compact beta additions explicitly deduplicate.
