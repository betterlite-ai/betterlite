id: B683
title: Converse tool and beta request preparation
description: >-
  Port _process_tools_and_beta over typed tool/options records, preserving output_config and anthropic_beta composition
  and unsupported parameter drops. This prepares data only; B604 assembles messages and cache points.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig._process_tools_and_beta L1686-L1827; AmazonConverseConfig._filter_context_management_for_bedrock_converse
  L1830-L1859.


  Named case contracts: anthropic_beta_fields: B599 reads exact anthropic-beta header (headers=None ->{}), preserving
  list members/duplicates and comma/JSON-array rules. On Anthropic base, B568 eager_input_streaming detection over
  filtered tools adds fine-grained-tool-streaming-2025-05-14 only if absent. Computer beta appends without deduplication.
  Effort beta adds effort-2025-11-24 only when output_config isdict with effortnon-None and B688 model is notadaptive,
  regardless of whether effort is recognized; avoid duplicate effort beta. Return beta list for allmodels, but write
  additional_request_params.anthropic_beta only if listnonempty and base startsanthropic. Preexisting anthropic_beta
  remains when this condition fails. tool_name_map: Partition tools first: any systemTool key passes unchanged and
  is appended after all converted tools, even valueNone. Drop exact type tool_search_tool_regex_20251119 and tool_search_tool_bm25_20251119
  silently; other versions are not dropped here. Remaining tools use B231 _bedrock_tools_pt and its sanitizer/reverse
  mapping, not a new tool converter. output_config_tools: This helper only adds effort beta and filters context;
  output_config itself is not normalized or dropped here. B604 owns effort capability gates and B690 normalization.
  _parallel_tool_use_config and tool_choice conflicts belong B602/B604, not an extra branch in this helper. computer_use_beta_versions:
  B601 detector/partition decides hosted computer tools. Regular tools go B231; computer tools go B601 and overwrite
  additional_request_params.tools, rather than toolConfig. Casefolded model substrings opus4.7,opus4.6,sonnet4.6,opus4.5
  with each spelling family-(major.minor),family_(major.minor),family-major-minor,family_major_minor ->computer-use-2025-11-24.
  Otherwise sonnet4.5,haiku4.5,opus4.1,sonnet3.7 with same four spellings, or sonnet-4/sonnet_4/opus-4/opus_4 ->computer-use-2025-01-24.
  Allothers ->computer-use-2024-10-22. Preserve first branch priority and duplicate existing computer beta. context_management_filter:
  Called only for Anthropic base. Non-dict context_management or edits notlist -> remove field. Keep only dict edits
  type=compact_20260112, preserving order/duplicates and all fields of each edit; with any survivors replace edits
  while retaining other context fields and append compact-2026-01-12 only if absent. No survivors -> remove field.
  No warning on any drop. For non-Anthropic base this helper is not called and preexisting context_management remains.


  Implement crates/betterlite-bedrock/src/bedrock_converse_tools_beta.rs with adjacent tests under bedrock_converse_tools_beta/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_converse_tools_beta_cases in betterlite-bedrock with these exact named cases (one
  per oracle file): anthropic_beta_fields, tool_name_map, output_config_tools, computer_use_beta_versions, context_management_filter.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_tools_beta* using HelperCase:
  kind: helper and the externally tagged bedrock_converse_tools_beta variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_tools_beta that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 138 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 200 production lines, 240 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 565 planned, 575 maximum changed lines.
