id: B4683
title: OpenAPI specs to MCP tool schemas and upstream tool calls
description: >-
  Build the OpenAPI side of the MCP gateway in betterlite-mcp, module openapi_tools. It reads an OpenAPI or Swagger JSON document, turns each operation into an MCP tool name, description and input schema, and later runs a tool call as one HTTP request to the described API.
  LiteLLM keeps this in openapi_to_mcp_generator.py. Callers on the manager side (registering tools, the preview route) are other tasks; this one gives them the functions.

  Spec loading. load_openapi_spec_async(location, max_bytes) takes a location. If it starts with "http://" or "https://", fetch it with betterlite_http::user_url::fetch::UserUrlFetcher::fetch (LiteLLM's async_safe_get) through the pooled betterlite_http::proxy::ProxiedClient, read the body with StreamResponse::buffered(limit) where the limit is max_bytes or, when absent, the client's own body limit, fail on a status of 400 or more (httpx raise_for_status) and parse the body as JSON. Anything else is a local file: if it does not exist, fail with "OpenAPI spec not found at {location}", otherwise read it as UTF-8 and parse JSON. YAML is not accepted, as in LiteLLM. Add the betterlite-http dependency and the tokio fs feature to crates/betterlite-mcp/Cargo.toml.
  parse_openapi_document(bytes) is the decoder for bytes from outside. It returns a typed OpenApiDocument (servers, host, schemes, basePath, paths in file order, components.parameters). Keep paths and the methods inside a path item in file order, since tool order follows the file; indexmap with serde is already in the workspace.

  get_base_url(spec, spec_path). OpenAPI 3: when servers is present and non-empty, take servers[0].url. If that url starts with "/" and spec_path is an http(s) URL, return scheme://netloc of spec_path plus the url (log at info). Otherwise return the url as written, so a relative url with a local spec_path stays relative. Swagger 2: when host is present, return "{schemes[0] or https}://{host}{basePath or empty}". Otherwise, for an http(s) spec_path ending in /openapi.json, /openapi.yaml, /swagger.json or /swagger.yaml (checked in that order), cut the suffix; else if the last path segment ends in .json, .yaml or .yml, drop that segment; else return "". Server variables like {region} are not expanded.

  sanitize_openapi_tool_name(raw): empty stays empty; every character outside [a-zA-Z0-9_-] becomes "_", then lowercase, then keep at most 128 characters (OPENAPI_TOOL_NAME_MAX_LEN).

  resolve_operation_params(operation, path_item, components) returns a copy of the operation whose parameters are path-level plus operation-level, with refs resolved. A parameter whose $ref starts with "#/components/parameters/" is replaced by components.parameters[last segment]; a missing target, or a resolved parameter with an empty or absent name, is dropped. A $ref with another prefix is kept as is and then dropped if it has no name. Path-level parameters whose (name, in) pair also appears at operation level are removed; the result is the remaining path-level ones first, then every operation-level one. The copy always carries a parameters list, even when empty.

  extract_parameters(operation) returns three name lists. Parameters without a name are skipped. in=path, in=query and in=body go to their lists; any other "in" (header, cookie, missing) lands in none. A requestBody, even an empty one, appends "body" to the body list.

  build_input_schema(operation) returns {"type":"object","properties":...,"required":[...]}, with "required" always present (empty list when nothing is required). Every named parameter becomes properties[name] = {"type": schema.type or "string", "description": description or ""} (header and cookie parameters included), and a parameter with required=true appends its name. A requestBody whose content has the exact key "application/json" adds properties["body"] = {"type":"object","description": requestBody.description or "Request body","properties": schema.properties or {}}, and requestBody.required=true appends "body". Other content types (including "application/json; charset=utf-8" and "*/*") add nothing.

  Calling a tool. OpenApiTool::new(path, method, operation, base_url, headers, server_label, relays_upstream_auth, auth_type, upstream_token_header) keeps the extracted parameter lists, the lowercase method and the static headers. OpenApiTool::call(arguments, context, transport) runs one call and returns Result<OpenApiToolOutput, OpenApiToolError>. LiteLLM passes per-request values through four ContextVars; here OpenApiCallContext carries them explicitly: auth_header (the BYOK Authorization override), extra_headers (caller headers allowed by the server's extra_headers list), resolved_auth_headers (the gateway-resolved upstream credential). No global state.
  Step 1, merge headers (merge_request_headers). Start from extra_headers minus any name that case-insensitively equals a static header name, then add all static headers. If auth_header is set and non-empty, remove every header named authorization (any case) and set "Authorization" to it. Then for each resolved header, remove every header with the same name ignoring case and set it. Precedence from lowest to highest is extra, static, BYOK, resolved.
  Step 2, when auth_type is set, run betterlite-mcp's validate_static_credential (B4667) on the merged headers with upstream_token_header and the static header names; on an error return OpenApiToolError::Credential before anything is sent.
  Step 3, URL. url = base_url + path. For each path parameter whose argument is present and truthy (not null, "", false, 0, empty list or object), sanitize it and replace "{name}" and then "{{name}}" in the url. Sanitize: str() of the value, replace "\" with "/", reject any "/" with the error text "Path parameter '{name}' must not contain path separators", reject a ".." segment with "Path parameter '{name}' cannot include '.' or '..' segments", then percent-encode everything except letters, digits, "_", ".", "-" and "~" (Python quote with safe=""). A rejected value does not fail the call: return OpenApiToolOutput::Text("Invalid path parameter: " + message). A missing or falsy path argument leaves the placeholder in the url.
  Step 4, query: every query parameter whose argument is truthy is sent under its own name.
  Step 5, body, only when the body list is non-empty: take argument "body"; if it is falsy, try each name in the body list in order and take the first truthy one. A JSON object is the body. A string is parsed as JSON and the parsed value is the body (any JSON type); when parsing fails the body is {"data": the string}. Any other truthy value becomes {"data": value}. A falsy value sends no body.
  Step 6, send. GET and DELETE send no body; POST, PUT and PATCH send the JSON body when there is one. Any other method returns Text("Unsupported HTTP method: {method}"). Requests go through the injected transport (the OpenApiTransport trait, with the real implementation over ProxiedClient::send_buffered). Redirects are followed by the transport implementation up to 20 hops (httpx default), because the pooled client never follows them. When resolved_auth_headers carries a credential outside Authorization (credential_slot: first resolved header name that is not "Authorization" ignoring case), build betterlite_mcp::client::sessions::factory::RedirectGuard::new(url, slot) and apply it to the headers on every hop; Authorization is already stripped across origins by redirect_headers in betterlite-http.
  Step 7, classify the response (raise_for_upstream_failure): status below 400 is fine; 401 with relays_upstream_auth=true gives OpenApiToolError::UpstreamAuth {status, www_authenticate (the www-authenticate response header), server}; every other 400+ gives OpenApiToolError::UpstreamStatus {status, server} and never carries the upstream body. server is server_label, or "{METHOD} {path}" in uppercase when there is no label.
  Step 8, a 2xx body goes through parse_http_body: blank or whitespace-only text, invalid JSON, and the JSON value null all give OpenApiToolOutput::Text(body); any other valid JSON gives OpenApiToolOutput::Json {value, original_text}.

  Tests live in crates/betterlite-mcp/src/openapi_tools/tests.rs and tests/. Use module names naming, spec_loading, base_url, parameters, input_schema, path_values, request_headers, tool_call and upstream_errors under openapi_tools::, and a corpus replay test named replays_the_openapi_spec_corpus that feeds every file in fuzz/corpus/openapi_spec through parse_openapi_document, get_base_url and the tool derivation without a panic. Add the cargo-fuzz target crates/betterlite-mcp/fuzz/fuzz_targets/openapi_spec.rs with its [[bin]] entry and a committed corpus.
scope:
  paths:
    - crates/betterlite-mcp/Cargo.toml
    - crates/betterlite-mcp/src/openapi_tools.rs
    - crates/betterlite-mcp/src/openapi_tools/**
    - crates/betterlite-mcp/fuzz/Cargo.toml
    - crates/betterlite-mcp/fuzz/fuzz_targets/openapi_spec.rs
    - crates/betterlite-mcp/fuzz/corpus/openapi_spec/**
    - tools/oracle/cases/helpers/mcp-openapi/**
    - tools/oracle/fuzz/corpus/helper_case/mcp-openapi-*
    - tools/oracle/helpers/b4683.py
    - tools/oracle/helpers/b4683/**
    - tools/oracle/src/helpers/mcp/b4683.rs
    - tools/oracle/src/helpers/mcp/b4683/**
  lint_tables: false
