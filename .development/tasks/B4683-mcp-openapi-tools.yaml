  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/openapi_to_mcp_generator.py#L187-L235
    why: get_base_url for OpenAPI 3 servers, Swagger 2 host, and the spec_path fallbacks.
