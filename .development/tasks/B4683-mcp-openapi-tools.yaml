dod:
  - text: parse_openapi_document and load_openapi_spec_async read a local JSON file, report a missing file with "OpenAPI spec not found at {location}", fetch http(s) locations through UserUrlFetcher with the max_bytes limit and fail on a 400 or higher status.
    proof: [openapi-tools-tests]
  - text: get_base_url follows servers[0].url, the relative-url rule with an http(s) spec_path, the Swagger 2 host form and both spec_path fallbacks, and returns "" when nothing applies.
    proof: [openapi-tools-tests, oracle]
  - text: sanitize_openapi_tool_name replaces invalid characters with "_", lowercases and cuts to 128 characters, and leaves an empty name empty.
    proof: [openapi-tools-tests, oracle]
  - text: resolve_operation_params resolves component refs, drops unresolvable or nameless parameters, lets operation-level parameters win on (name, in) and keeps path-level ones first; extract_parameters and build_input_schema give LiteLLM's lists and schema for the same operations.
    proof: [openapi-tools-tests, oracle]
  - text: merge_request_headers applies the order extra, static, BYOK Authorization, resolved credential, comparing names without case.
    proof: [openapi-tools-tests, oracle]
  - text: >-
      A call rejects path values with separators or ".." segments as Text("Invalid path parameter: ..."), percent-encodes the rest, sends truthy query values, builds the body from "body" or the body parameter names, and refuses an unusable static credential before sending.
    proof: [openapi-tools-tests, oracle]
  - text: A 401 with relays_upstream_auth gives UpstreamAuth with the www-authenticate value, any other 400+ gives UpstreamStatus without the body, and a 2xx body becomes Text or Json by parse_http_body.
    proof: [openapi-tools-tests, oracle]
  - text: A credential in a custom header slot is dropped when a redirect hop leaves the origin of the request url, and redirects stop after 20 hops.
    proof: [openapi-tools-tests]
  - text: The spec decoder has a cargo-fuzz target with a committed corpus that replays without a panic.
    proof: [openapi-fuzz]
  - text: The oracle helper adapter passes strict Python checks and its seeds replay.
    proof: [helper-python, helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: openapi-tools-tests
      why: the openapi_tools behavior tests fail, do not exist, or the filter selects nothing
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^openapi_tools::/) - test(replays_the_openapi_spec_corpus)'
    - id: openapi-clippy
      why: clippy catches issues in the new module and its fuzz target
      run: cargo clippy --locked -p betterlite-mcp --all-targets -- -D warnings
    - id: openapi-fuzz
      why: the fuzz target, its added corpus or its replay test is missing or fails
      run: test -f crates/betterlite-mcp/fuzz/fuzz_targets/openapi_spec.rs && grep -q openapi_spec crates/betterlite-mcp/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/openapi_spec)" && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(replays_the_openapi_spec_corpus)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4683.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-openapi-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/mcp-openapi/tool-name.yaml
  - tools/oracle/cases/helpers/mcp-openapi/base-url-servers.yaml
  - tools/oracle/cases/helpers/mcp-openapi/base-url-swagger2.yaml
  - tools/oracle/cases/helpers/mcp-openapi/base-url-spec-path.yaml
  - tools/oracle/cases/helpers/mcp-openapi/resolve-params.yaml
  - tools/oracle/cases/helpers/mcp-openapi/extract-params.yaml
  - tools/oracle/cases/helpers/mcp-openapi/input-schema.yaml
  - tools/oracle/cases/helpers/mcp-openapi/merge-headers.yaml
  - tools/oracle/cases/helpers/mcp-openapi/call-path-values.yaml
  - tools/oracle/cases/helpers/mcp-openapi/call-query-body.yaml
  - tools/oracle/cases/helpers/mcp-openapi/call-methods.yaml
  - tools/oracle/cases/helpers/mcp-openapi/call-static-credential.yaml
  - tools/oracle/cases/helpers/mcp-openapi/call-upstream-errors.yaml
  - tools/oracle/cases/helpers/mcp-openapi/call-result-parse.yaml
deviations:
  - what: The per-request header values travel in an OpenApiCallContext argument, not in module-level context variables.
    why: The repository forbids module-level state. The merge order and results are the same.
  - what: Redirects on a tool call are followed by the OpenApiTransport implementation, up to 20 hops, not by the HTTP client.
    why: The pooled ProxiedClient never follows redirects. httpx follows up to 20 by default, and the credential guard needs to see each hop.
out_of_scope:
  - "register_tools_from_openapi, load_openapi_spec (the sync wrapper) and the module constants BASE_URL and HEADERS: no caller at the pin outside tests, since the manager at mcp_server_manager.py:2745 does its own registration. Their cases are not written."
  - "Registering tools in the local tool registry, server name prefixes, openapi_tool_name and the manager's header building (strip_auth_scheme, to_basic_credentials): B4680 owns the registry, the rest belongs to the B136 manager parts."
  - "Setting the four per-request values from the MCP request (operations.py and mcp_server_manager.py:6629): B136 manager parts. This task only reads them from OpenApiCallContext."
  - "The preview route in rest_endpoints.py:1625: B4730 calls the functions built here."
  - "validate_static_credential, CredError and raise_public: B4667. The user URL fetcher: B5082. The pooled client: B173. RedirectGuard: B4744."
  - "MCP result conversion (result_conversion.py, WireCompat): B136 manager parts. This task returns OpenApiToolOutput and the manager part converts it."
pitfalls:
  - >-
    A path value of "." is accepted. Python's PurePosixPath(".").parts is empty, so only ".." is rejected, and quote keeps "." as is.
  - >-
    Replacing "{name}" first turns "{{name}}" into "{value}" (the inner pair matches), so the second replace for "{{name}}" never matches. Keep both replaces in this order and keep the leftover braces.
  - >-
    A rejected path value returns a normal Text result "Invalid path parameter: ..." and the call carries on as a success. It is not an error.
  - >-
    Header and cookie parameters appear in the input schema but are never sent, because extract_parameters only knows path, query and body.
  - >-
    A requestBody with only a non-"application/json" content key adds no "body" property, yet the call still reads the "body" argument and sends it, since extract_parameters adds "body" for any requestBody.
  - >-
    build_input_schema copies only the top-level "properties" of the body schema. $ref, allOf, items and required inside the body schema are dropped.
  - >-
    Truthiness decides what is sent. An argument of 0, false, "" or an empty list is treated as absent for path, query and body alike.
  - >-
    A string body is parsed as JSON, so "[1,2]" is sent as the array [1,2] and "5" as the number 5. Only a failed parse wraps the string as {"data": ...}.
  - >-
    The static headers beat the caller's forwarded headers on a name clash, compared without case. The resolved credential beats everything, including BYOK. Never let a forwarded header replace an operator header.
  - >-
    The 401 relay applies only when relays_upstream_auth is true. Without it a 401 is an UpstreamStatus with no challenge.
  - >-
    The upstream response body must never reach the error or the logs for a 400+ status. Only the status code and the server label are kept.
  - >-
    Swagger 2 "in: body" parameters count as body parameters, so "body" may be missing from the arguments while the parameter's own name carries the body.
  - >-
    A relative servers[0].url with a local spec path is returned relative, and the call then builds a URL with no host. Do not invent a base.
  - >-
    Log the spec-derived base url at info only when it is derived from spec_path, as LiteLLM does; never log header values.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
