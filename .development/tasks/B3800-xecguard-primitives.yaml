    why: Redaction before recording scan results. Chains redact_nested_match_and_regex_keys and mask_credentials_in_payload.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/xecguard/xecguard.py#L275-301
    why: "Sync logging_hook: asyncio.get_event_loop/new_event_loop, early return when the loop is running, exception swallowing mirrored from async_logging_hook."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/xecguard/xecguard.py#L307-379
    why: HTTP helpers. _call_scan and _call_grounding build request bodies; _post sends them and handles API errors.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/xecguard/xecguard.py#L385-504
    why: Message assembly and history extraction. Full conversation forwarding and multimodal content flattening.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/xecguard/xecguard.py#L510-579
    why: Grounding document extraction and block message formatting. Validate document structure; construct error strings with violated policies/rules and trace IDs.

