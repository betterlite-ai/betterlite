id: B3800
title: XecGuard scan and grounding primitives
description: >-
  Build XecGuard scan/grounding payloads, history extraction and block diagnostics.
  Retain source redaction before recording scan results and separate scan from grounding requests.
  Implement the sync `logging_hook` that surfaces scans in logging-only mode with event-loop awareness and exception swallowing.

  The scan payload builder (`_call_scan`, `_call_grounding`) and message assembly helpers construct inputs from chat/Responses/request data.
  Message normalization flattens multimodal content to plain text for the XecGuard API, and history synthesis ensures the full conversation is visible to the policy engine.
  Grounding document extraction reads metadata and validates document structure before sending to the `/grounding` endpoint.

  Both scan and grounding block responses include error detail formatting (trace_id, violated policies/rules, rationale) that the caller renders to the client.

scope:
  paths:
    - crates/betterlite-guardrails/src/xecguard_primitives.rs
    - crates/betterlite-guardrails/src/xecguard_primitives/**
  lint_tables: false

