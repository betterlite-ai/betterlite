oracle_cases: []

deviations: []

out_of_scope:
  - The __init__ constructor, apply_guardrail method, async_logging_hook, and initialize_guardrail initialization belong to B3820 (hooks and orchestration).
  - Guardrail framework base contracts (CustomGuardrail, GuardrailEventHooks, log_guardrail_information) are inherited interfaces, not built here.
  - The pooled httpx client (get_async_httpx_client, httpxSpecialProvider.GuardrailCallback) is owned by B173.

pitfalls:
  - asyncio.get_event_loop() raises RuntimeError if no event loop exists in the thread. Catch it, create a new loop, and set it as the thread's default.
  - asyncio.set_event_loop() may fail if the loop is already running. Check loop.is_running() before run_until_complete and return early if true.
  - Exception swallowing in logging_hook is intentional; every exception is caught and logged at debug level without re-raising. This mirrors the Presidio guardrail pattern.
  - Message normalization must handle both dict and object interfaces (checking hasattr for .choices, .message, .content attributes alongside dict.get calls).
  - Grounding document validation requires both document_id and context to be present and non-empty strings. Malformed documents are logged and dropped, never raising.
  - Block message rationale is truncated to _RATIONALE_TRUNCATE_CHARS (200) characters to prevent oversized error responses. Truncation happens during formatting, not during scan result storage.

review_level: standard

budget:
