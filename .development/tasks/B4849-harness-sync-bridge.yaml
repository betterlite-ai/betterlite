oracle_cases: []
deviations:
  - what: The runtime that replaces the shared loop thread is an object, `SyncRuntime`, that the caller creates and passes in. Python's one process-wide thread, started on first use, has no Rust equivalent.
    why: The rules ban module-level state and detached tasks. The caller owns the runtime, so it can drop it and everything it started stops. The Python package that wraps the Rust core can hold one per process and keep LiteLLM's one-thread behavior.
  - what: There is no Ctrl-C handling in the blocking call.
    why: Python cancels the future on KeyboardInterrupt. A Rust caller cancels through `SyncEventStream::cancel`, or drops the runtime.
  - what: There are no `with` blocks and no `__enter__` or `__exit__`; callers call `start`, `close` and `SyncEventStream::close`.
    why: Rust has no context manager. Dropping a stream closes its channel, but the session is only closed by its `close`, `detach` or `stop`, since Drop cannot wait for async work.
  - what: The `aio` property (the underlying async session) is not exposed.
    why: The session moves into the runtime while a stream runs, so a second handle to it cannot exist. B4848's async API is the way to get an async session.
  - what: The `cost`, `usage` and `results` methods of a `SyncSession` fail with TurnRunning while a stream owns the session. Python lets them be read mid-stream.
    why: Rust cannot share the session with the task that runs the turn without a lock held across await.
  - what: The `agent(stream=...)` function returns an `AgentOutput` enum, and `run_agent` and `stream_agent` are public as well.
    why: Rust has no function that returns either of two types by a flag.
  - what: A one-shot stream holds back `Done` until the turn stream has ended, then closes the session, then yields `Done` and any trailing error.
    why: The turn stream borrows the session, so it cannot be closed while the stream is alive. The reader sees the same order and the session is closed before it gets `Done`, as in LiteLLM.
out_of_scope:
  - "AsyncEventStream, _one_shot, astream, arun, aagent_session, arun_agent, astream_agent and aagent_resume (runtime.py L544-L1028) are B4848's. This task calls them and builds its own driver only because the turn stream in Rust cannot outlive the borrow of its session."
  - "TurnControl and turn_events (runtime.py L259-L541, L732-L741) are B4847's; B4846 owns AsyncSession and its busy flag and permit."
  - "The Python wrapper that exposes litellm.agent and friends over the Rust core is the M12 package work, not this crate."
  - "Re-exports in litellm/harness/__init__.py (L30-L60) have no Rust code."
pitfalls:
  - >-
    Handle::try_current() must be checked before Runtime::block_on, because block_on panics when called from a tokio task; the same call from a plain thread, a std thread or a blocking pool thread is fine.
  - >-
    The in-loop message says "litellm." and "await litellm.a<name>", with the name passed by each caller ("agent", "agent_session", "agent_resume"), so the text stays LiteLLM's for every caller.
  - >-
    Python's validation error for stream=True is raised when agent() is called, not at the first next(); stream_agent builds the session before it starts the driver for that reason.
  - >-
    EventStream.result is set only when Done passes through next(), so a stream that was closed early or ended on an error has result None.
  - >-
    B4847 yields Done first and the OutputInvalid error right after it; a reader must see Done before that error, so the stream must stay open after an Err item and only end when the channel closes.
  - >-
    Dropping a SyncEventStream drops its Receiver, and the driver must treat a failed send as the signal to stop, close the turn stream and hand the session back; aborting the task would lose the session and leave the slot empty forever.
  - >-
    The slot lock is a std Mutex taken only to move the session in or out; holding it while awaiting would block the runtime thread, and the rules ban a lock held across an await.
  - >-
    Calling close on the stream waits for `finished`, which only fires after the session is back in the slot or closed, so the next session call does not see a false TurnRunning.
  - >-
    The bounds `S`, `H` and `E` must be `Send + 'static` for the futures to be spawned; the sync functions state them, and tests use fakes that meet them.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
