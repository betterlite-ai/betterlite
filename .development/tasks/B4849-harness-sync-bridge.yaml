id: B4849
title: Bridge synchronous harness streams and sessions to owned async work
description: >-
  Port LiteLLM's sync API for the harness (litellm/harness/sync.py, 440 lines) into a new module `sync_bridge` of the crate betterlite-harness. LiteLLM runs
  every sync call on one daemon thread that owns an asyncio loop, and blocks the caller until the coroutine finishes. This task gives Rust callers the same
  thing: a blocking `run_agent`, a blocking `Iterator` of events, and a blocking multi-turn session, all driven by async code that betterlite owns and can stop.
  The async runtime itself is B4846 (session), B4847 (turn) and B4848 (public async entry points). Read these on main first and use their exact Rust names:
  crates/betterlite-harness/src/session_runtime.rs (B4846: `AsyncSession<S, H, E>`, `SessionRuntimeError` with its `TurnRunning` variant, `start`, `close`,
  `detach`, `stop`, `history`, `cost`, `usage`, `session_id`, `results`), turn_runtime.rs and turn_runtime/control.rs (B4847: `TurnControl`, `turn_events`), the
  B4848 module that exposes `arun_agent`, `aagent_session`, `aagent_resume`, `AsyncSession::arun` and `astream_agent`, events.rs (`Event`, `RunResult`) and
  state.rs (`State`). If B4848 names something differently, use B4848's name and say so in your report. The sync functions take B4848's `SessionArgs`, `RunArgs`, `ResumeArgs` and `StateInput` (each generic over `S`, `H`, `E`) and the
  same handler and endpoint injection that B4848's async functions take, because the handler traits have associated types and cannot be picked at run time.


  Owned runtime (`_LoopThread`, `_LOOP`, L45-L69). `SyncRuntime` in `sync_bridge/runtime.rs` owns a `tokio::runtime::Runtime` built with
  `Builder::new_multi_thread().worker_threads(1).thread_name("litellm-harness-loop").enable_all()` and a `std::sync::Mutex<tokio::task::JoinSet<()>>` of the tasks it
  has started. `SyncRuntime::new() -> Result<Self, SyncBridgeError>` builds it; callers share it as `Arc<SyncRuntime>` and pass it to every sync function and
  session. There is no process-wide static: Python's `_LOOP` singleton becomes an object the caller creates once and holds (see deviations). `SyncRuntime::spawn`
  locks the set only to reap finished tasks (`try_join_next` in a loop, logging a `tracing::warn!` for each `JoinError`, which is a task panic) and to call
  `JoinSet::spawn_on(future, self.runtime.handle())`; the lock is never held across an `.await`. Dropping the set aborts anything still running.


  Blocking call (`_ensure_sync_context` L72-L77, `run_sync` L80-L92). `SyncRuntime::run<T: Send + 'static>(&self, name: &'static str, future: impl Future<Output = T> + Send + 'static)
  -> Result<T, SyncBridgeError>` first calls `ensure_sync_context(name)`: when `tokio::runtime::Handle::try_current().is_ok()` the caller is inside an async runtime, and the
  result is `SyncBridgeError::InRunningLoop { name }`, displayed exactly as "litellm.{name}() cannot be called from a running event loop; use `await litellm.a{name}(...)` instead".
  The check runs before anything else, so no future is started (Python closes the coroutine). Then `run` starts the future with `spawn`, with a
  `tokio::sync::oneshot` sender carrying the output back, and blocks on the receiver with `Runtime::block_on`. A closed oneshot (the task panicked or was
  aborted) is `SyncBridgeError::LoopLost` ("the harness loop stopped before the call finished"). All async work therefore runs on the one runtime thread, and the
  caller thread only waits. There is no Ctrl-C hook: Python's `except KeyboardInterrupt: future.cancel()` has no Rust counterpart (see deviations).


  Event stream (`EventStream` L106-L148, `_anext` L95-L99, `_aclose_stream` L102-L103, `sync_bridge/stream.rs`). `SyncEventStream` implements
  `Iterator<Item = Result<Event, SyncBridgeError>>`. Behind it sits a driver future (below) that runs on the runtime and sends each item through a
  `tokio::sync::mpsc::channel(1)`, so a slow reader pauses the handler (that is the backpressure of Python's one-event-at-a-time hand off). Fields: the
  `Arc<SyncRuntime>`, the `mpsc::Receiver`, a `oneshot::Receiver<()>` named `finished` that the driver fires when it is completely done, the `TurnControl` clone,
  `result: Option<RunResult>` and `done: bool`. `next()`: when `done` is true, return `None`. Otherwise the receiver must move into the future the runtime runs, so take it out of the struct with `Option::take`, run an async block that calls `recv` and returns the receiver together with the item through `runtime.run("stream", ..)`, and put the receiver back. `None` (channel closed) sets `done` and returns `None`.
  `Some(Ok(Event::Done { result }))` stores a clone of the result in `self.result` before returning the event. `Some(Err(e))` returns `Err(SyncBridgeError::Session(e))`; the
  stream is not marked done, because B4847 yields the trailing `OutputInvalid` error after `Done` and the channel then closes by itself. `result(&self) -> Option<&RunResult>`
  is set once `Done` has been seen. `cancel(&self)` calls `TurnControl::cancel` (it is `Arc` based, so no hop to the runtime thread is needed); iteration still ends with
  `Done` whose stop reason is `Cancelled`. `close(&mut self) -> Result<(), SyncBridgeError>`: does nothing when `done` is true; otherwise sets `done`, drops the receiver
  so the driver sees a closed channel, and waits for `finished` through `runtime.run("stream", ..)`. Dropping a stream without `close` also drops the receiver, and the
  driver winds down on its own on the runtime thread.


  Driver (`sync_bridge/driver.rs`). `drive_turn(session, prompt, control, close_after, sender, slot, finished)` is one async function used by both streams. It
  builds `session.turn_events(prompt, control, true)` (B4847), pins it, and forwards each item with `sender.send(item).await`; a failed send (reader gone) ends the loop. Then it
  drops the turn stream, which frees the turn permit. With `close_after == false` (a stream from a `SyncSession`) it puts the session back into the shared slot (below). With
  `close_after == true` (the one-shot `stream_agent`, Python's `_one_shot` L573-L581 in runtime.py) it must close the session before `Done` reaches the reader, as
  LiteLLM does. Rust cannot close a session while its turn stream still borrows it, so in that mode the driver holds back every item from the first `Done` on, lets the turn stream
  run to its end (only the trailing error can follow `Done`), drops it, awaits `session.close()`, and only then sends the held items in order. It also closes the session when the
  reader went away early. Last, it sends on `finished`.


  Sync session (`Session` L151-L206, `sync_bridge/session.rs`). `SyncSession` holds the `Arc<SyncRuntime>`, the session id copied at construction, and a shared
  `Arc<std::sync::Mutex<Option<Box<AsyncSession<S, H, E>>>>>` named `slot`. A call that needs the session takes it out of the slot (the lock is held only for the take), moves it
  into the future it runs, and the future puts it back before it returns, also when the call failed. When the slot is empty a turn stream owns the session, and the call returns
  `SyncBridgeError::TurnRunning` ("a turn is already running on this session", the text B4846 uses). That keeps LiteLLM's rule that one turn runs at a time. Methods:

  - `start(&self)` runs `AsyncSession::start` (L162-L164).

  - `run(&self, prompt) -> Result<RunResult, SyncBridgeError>` runs B4848's `AsyncSession::arun` (L172-L173); its `AgentRunError` becomes `SyncBridgeError::Run`.

  - `stream(&self, prompt) -> Result<SyncEventStream, _>` takes the session, makes a `TurnControl::default()`, starts `drive_turn` with `close_after == false` through `spawn`, and returns the stream (L175-L176).

  - `close(&self)`, `detach(&self) -> Result<State, _>`, `stop(&self) -> Result<State, _>` and `history(&self)` run the matching `AsyncSession` method (L178-L190). `close` is safe to call twice because B4846's close is.

  - `cost(&self)`, `usage(&self)` and `results(&self) -> Vec<RunResult>` read the session under the lock without moving it out (L192-L203); `results` returns a copy. They fail with `TurnRunning` while a stream owns the session.

  - `session_id(&self)` returns the stored copy and never fails (L204-L206).


  Entry points (`_run` L209-L253, `_stream` L256-L299, `agent_session` L302-L344, `agent_resume` L347-L389, `agent` L392-L440, `sync_bridge/entry.rs`). Each is a plain
  function taking `runtime: &Arc<SyncRuntime>` and the B4848 argument type named in its bullet, with B4848's generic handler and endpoint parameters.

  - `run_agent(runtime, args: RunArgs<S, H, E>) -> Result<RunResult, SyncBridgeError>` calls `ensure_sync_context("agent")`, then `runtime.run("agent", arun_agent(args))`. B4848's `AgentRunError` comes back as `SyncBridgeError::Run`.

  - `stream_agent(runtime, args: RunArgs<S, H, E>) -> Result<SyncEventStream, SyncBridgeError>` calls `ensure_sync_context("agent")`, then builds the session synchronously with B4848's `aagent_session(args.session)` (an `AgentBuildError` becomes `SyncBridgeError::Build`), so a validation or option error is returned before any thread work, as the test `test_sync_validation_errors_raise_eagerly` expects. It then starts `drive_turn` with `close_after == true` and returns the stream.

  - `agent_session(runtime, args: SessionArgs<S, H, E>) -> Result<SyncSession<S, H, E>, SyncBridgeError>` calls `ensure_sync_context("agent_session")` and wraps B4848's `aagent_session` result in a `SyncSession`. It does not start it.

  - `agent_resume(runtime, args: ResumeArgs<S, H, E>) -> Result<SyncSession<S, H, E>, SyncBridgeError>` calls `ensure_sync_context("agent_resume")` and wraps B4848's `aagent_resume`. `ResumeArgs.state` is B4848's `StateInput`, so it accepts a `State` or bytes, since LiteLLM passes it straight through.

  - `agent(runtime, args: RunArgs<S, H, E>, stream: bool) -> Result<AgentOutput, SyncBridgeError>` returns `AgentOutput::Result(RunResult)` or `AgentOutput::Stream(SyncEventStream)` by the flag (L392-L440), by calling the two functions above.


  Errors (`sync_bridge/error.rs`). `SyncBridgeError` derives `thiserror::Error` and has `InRunningLoop { name: &'static str }`, `LoopLost`, `TurnRunning`, `RuntimeStart(std::io::Error)`
  (from `Builder::build`), `Session(#[from] SessionRuntimeError)`, `Build(#[from] AgentBuildError)` and `Run(#[from] AgentRunError)`, both B4848 errors (transparent). `Build` is what `stream_agent`, `agent_session` and `agent_resume` return for a bad argument, and `Run` is what `run_agent` and `SyncSession::run` return, since `AsyncSession::arun` gives `AgentRunError`.
  Display text for the first three is given above. No `unwrap` or `expect` outside tests.
