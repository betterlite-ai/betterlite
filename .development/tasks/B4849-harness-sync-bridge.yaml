dod:
  - text: SyncRuntime::new starts one runtime thread named "litellm-harness-loop"; two sync calls on the same runtime run their futures on that same thread, and no second thread with that name exists.
    proof: [runtime-tests]
  - text: Any blocking call made from inside a running tokio runtime returns InRunningLoop with the exact LiteLLM message for its name (agent, agent_session, agent_resume, stream, run) and starts no future.
    proof: [runtime-tests]
  - text: A future that panics on the runtime makes the blocking call return LoopLost, and the runtime still serves the next call.
    proof: [runtime-tests]
  - text: Iterating a SyncEventStream gives the handler's events in order and ends with Done; result() is None before Done and holds the run result after it; iterating again gives nothing.
    proof: [stream-tests]
  - text: A reader that is slower than the handler pauses it, since the channel holds one item; the handler is never read ahead by more than one event.
    proof: [stream-tests]
  - text: cancel ends iteration with Done whose stop reason is Cancelled, also when it is called before the first next(); close before the end stops the turn, lets the driver finish, and a second close does nothing.
    proof: [stream-tests]
  - text: An approval event can be answered by the reader between two next() calls and the handler sees that answer; dropping a stream without close frees the turn so the session can run again.
    proof: [stream-tests]
  - text: A SyncSession runs several turns, returns the same session id each time, reports cost and usage as the sum of its results, returns history, and detach or stop gives a State that agent_resume turns back into a working session.
    proof: [session-tests]
  - text: A session call made while a SyncEventStream still owns the session returns TurnRunning, and works again after the stream ended or was closed.
    proof: [session-tests]
  - text: stream_agent closes the session before the reader gets Done and also closes it when the reader stops early; a validation error from the argument value is returned by stream_agent itself, before any event.
    proof: [entry-tests]
  - text: agent returns a RunResult with stream false and a SyncEventStream with stream true, and run_agent returns the same result text and stop reason as the async path.
    proof: [entry-tests]
