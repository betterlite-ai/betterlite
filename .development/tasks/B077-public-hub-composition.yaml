deviations:
  - what: GET /public/model_hub/info keeps litellm_version as the field name but returns the running betterlite version.
    why: Reporting LiteLLM's package version as the native server's version would be false; the compatibility pin remains separate from executable versioning.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_endpoints.py#L378-L382
out_of_scope:
  - "public_endpoints.py L48-L66 and L101-L210: B3190 owns provider/endpoint records, metadata, _clean_display_name, _build_endpoints and _load_endpoints; get_supported_providers, get_provider_fields and get_supported_endpoints also remain B3190. Its data fragments are B3180-B3189. B8676/B8681 already own the provider mount and must be reconciled by the architect."
  - "public_endpoints.py L69-L94 and L268-L359: B3194 owns _PluginRow's properties, _PluginTableActions.find_many, _plugin_table, get_agents, get_mcp_servers and public_skill_hub; only their production adapter composition and HTTP cases are here."
  - "public_endpoints.py L216-L265: B3193 owns public_model_hub; it also owns every function/protocol in public_v1/model_hub.py and the exports/prefix in both public_endpoints/__init__.py and public_v1/__init__.py."
  - "public_endpoints.py L422-L449 and L495-L572: B3192 owns get_complexity_scorer_defaults, get_public_fuse_presets, _load_bundled_autorouter_presets, _fetch_remote_autorouter_presets, _resolve_autorouter_presets, _AutoRouterPresetsCache, get_autorouter_presets and get_public_autorouter_presets."
  - "public_endpoints.py L593-L639: B3191 owns get_agent_fields and its agent credential projection; B8647 owns its existing mount and HTTP coverage."
  - "types/proxy/public_endpoints/public_endpoints.py: B3190 owns ProviderCredentialField, ProviderCreateInfo, EndpointProvider, SupportedEndpoint and SupportedEndpointsResponse; B3191 owns AgentCredentialField and AgentCreateInfo; B3192 owns AutoRouterPresetTiers, AutoRouterPresetConfig, AutoRouterPresetRecord and ComplexityScorerDefaults. B7947 owns the separate Python exports. Only the native PublicModelHubInfo is added here."
  - B9300 owns all get_blog_posts.py functions, production BlogPost/BlogPostsResponse, settings defaults and RSS decoding; B193/B194 own catalog loading, finalization, serialization retention and adoption, which must be corrected before this task runs.
  - B8610 owns the shared server inputs and aggregate mount calls, B8611 router views, B8612 agent read-through, B8614 MCP boot registries, B8647 the live public-agent holder, B8380 settings snapshots and B839 model/link writes; this task implements only the adapters into the already owned handlers.
  - The import of EnterpriseProxyConfig.get_custom_docs_description has no open-source implementation and is not built; the reachable exception fallback is custom_docs_description null.
pitfalls:
  - A v1 path in B868's public set still executes user_api_key_auth, so moving it wholly outside auth silently bypasses custom auth.
  - public_model_groups controls the hub listings but never filters /public/litellm_model_cost_map.
  - Serving a newly loaded bundled map hides runtime registrations and every later successful reload.
  - The blog handler retries local loading after a feed-service exception, but its final five-post projection is outside that catch.
  - A providers_routes merge here would duplicate the mounts already assigned to B8676/B8681 and can panic during application construction.
  - The useful-link update publishes after save_config, so reading an unrelated startup clone makes a successful admin update invisible.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
