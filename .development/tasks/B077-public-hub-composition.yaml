  paths:
    - crates/betterlite-server/src/public_endpoints/hub_surface.rs
    - crates/betterlite-server/src/public_endpoints/hub_surface/**
    - crates/betterlite-server/src/app/admin/public_hubs.rs
    - crates/betterlite-server/src/app/admin/public_hubs/**
    - tools/oracle/cases/public/hub-composition/**
    - tools/oracle/cases/public/model-hub/**
    - tools/oracle/cases/public/resource-hubs/**
    - tools/oracle/cases/public/autorouter-presets.yaml
    - tools/oracle/cases/public/scorer-defaults.yaml
    - tools/oracle/cases/public/fuse-presets.yaml
  lint_tables: false
