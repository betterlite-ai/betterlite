dod:
  - text: The information, model-cost and blog handlers preserve the pinned response shapes, current-state reads, error boundaries and double fallback order.
    proof: [surface-tests, oracle, http-cases]
  - text: The actual application reaches every remaining public route exactly once and preserves v1 auth execution without key-gating the legacy hub or other unkeyed routes.
    proof: [composition-tests, oracle, http-cases]
  - text: Model, agent, MCP, plugin and settings adapters read the shared live services, so late installation and successful updates are visible without rebuilding the app.
    proof: [composition-tests, oracle]
  - text: The preset, model-hub and resource-hub HTTP cases transferred from the parts run through both booted proxies, including real Postgres fixtures where required.
    proof: [oracle, http-cases]
checks:
  optional: []
  commands:
    - id: surface-tests
      why: A remaining handler changes its wire projection, captures stale data or hides a fallback failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^public_endpoints::hub_surface::/)'
    - id: composition-tests
      why: The real application omits a mount, duplicates a route, bypasses v1 auth or reads a second registry/settings instance.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::admin::public_hubs::/)'
    - id: http-cases
      why: No new booted-proxy fixtures prove the remaining route contracts.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/public/hub-composition)" && test -f tools/oracle/cases/public/autorouter-presets.yaml && test -f tools/oracle/cases/public/model-hub/legacy-route-basic.yaml && test -f tools/oracle/cases/public/resource-hubs/skill-hub-basic-manifest-parsing.yaml
