id: B077
title: Complete the public hub routes and their production composition
description: >-
  Finish the public-endpoints umbrella after its fifteen existing parts. The remaining
  handlers are public_model_hub_info, get_litellm_model_cost_map and
  get_litellm_blog_posts. Build them in betterlite-server::public_endpoints::hub_surface,
  with typed responses and its own error enum. Build the composition in
  betterlite-server::app::admin::public_hubs. B9300 provides discovery settings and a
  native blog feed; B3192, B3193 and B3194 keep their own handlers and router constructors.
  This task merges those routers once and never registers their paths again.

  GET /public/model_hub/info returns PublicModelHubInfo with docs_title from
  config.sections.public_discovery, custom_docs_description null because the enterprise
  import is absent, litellm_version containing the native package version, and
  useful_links from the current public_model_groups_links setting. Default title is
  LiteLLM API and default links is {}. Keep the litellm_version wire name. Both legacy
  string-valued links and object-valued links survive, including index and extra members;
  never fetch their URLs. DOCS_TITLE is enabled without licensing by B9300's recorded
  deviation. DOCS_DESCRIPTION must not populate the missing enterprise description.

  GET /public/litellm_model_cost_map returns the current adopted model-cost mapping as
  the top-level object, with no data or models envelope, no paging and no filtering to
  configured/public model groups. Read B194's live catalog service per request, not
  a second bundled catalog or a startup-only copy. Use the lossless public serialization
  supplied by the catalog prerequisite: preserve explicit null and absent members,
  sample_spec, expanded aliases and runtime price registrations, while
  fallback_generalizations and aliases directives have already been consumed by
  finalization. Prices remain exact decimals serialized as JSON numbers. Do not
  reconstruct this response by serializing ModelFields and PriceFields: today's
  ModelCatalog discards sample_spec and input-member presence and those serializers
  inject default fields. The architect must correct B193/B194's public snapshot
  contract and arrange the shared handoff before dispatch, as detailed in the report.
  Catalog read/serialization failures take the existing HTTPException-style 500
  boundary; there is no request-triggered reload and no new failure code.

  GET /public/litellm_blog_posts calls B9300's one BlogFeed instance. If that call
  raises, warn and try its local-post source again, matching the endpoint's outer
  fallback in addition to the feed service's inner fallback. Validate the final posts
  as BlogPost and return {"posts": the first at most five}. A failing second backup
  load or final response validation propagates through the server's existing 500
  handling. Do not swallow it as an empty success or retry the network. Constructor
  inputs include the shared outbound client and resolved B9300 settings, so two
  requests to one app share the feed cache and two apps do not.

  public_hubs::mount_public(router, state) builds the adapters from Config and B8610's
  Shared. It merges hub_surface's three GET routes, B3192's preset router for
  /public/autorouter_presets, /public/complexity_router/scorer_defaults and
  /public/complexity_router/fuse_presets, B3193's legacy /public/model_hub router,
  and B3194's /public/agent_hub, /public/mcp_hub and /public/skill_hub router.
  These routes have no user_api_key_auth dependency at the pin. All are GET-only;
  there are no /v1, /openai/v1 or provider-prefix aliases for them.

  B3193's other router supplies GET /public/v1/model_hub and
  /public/v1/model_hub/{facet}, with providers, modes and features the accepted facets.
  Pass that router through B8610's routes::with_key_auth exactly once before merging
  it into the public tree. Its declared auth dependency still runs custom auth and
  pre-auth checks before B868's built-in public-path shortcut, even though the four
  recognized paths allow a missing or invalid bearer. Do not exempt /public/v1/* as
  a wildcard: an unknown facet without a key is not in that public set. The legacy
  hub does not acquire this dependency. B3193 owns facet validation and problem
  responses; the planning report corrects its unsupported 400 deviation to the
  pinned 422 validation response for an authenticated unknown facet.

  Supply the model hub with Shared's live RouterHandle through B8611's views, and
  the existing health-store adapters over shared.db; never freeze a missing router
  at mount time. Read public lists and useful links from B8380's live litellm settings
  snapshot, using B839's public_model_groups view and B9300's useful-link view.
  A successful B839 update must be visible on the next hub request without restart;
  reuse its saved-state/publication path and preserve its write order. Pass
  shared.agents.registry from B8612 together with B8647's one PublicAgentGroups
  holder to the agent projection; the holder used by make_public must be shared
  with this reader, as the report's B8647/B8610 correction specifies. Pass
  shared.mcp_registry from B8614 to the MCP projection and use its live
  RegistrySettings.public_mcp_servers for the explicit flag, since B8627's
  PublicServerSetting writes that value. Pass shared.db to B3194's plugin repository.
  B3194 owns agent stable/legacy-id intersection, the request-base URL projection,
  MCP public/explicit flags and the enabled-plugin query. No second registry or
  database pool is created. Constructor adapters live under public_hubs/ and call
  the merged part APIs, rather than copying filters, SQL or list-framework code.

  The architect adds the public_hubs module declaration and exactly one call from
  app::admin::mount_public; neither that aggregator nor app.rs/routes.rs is in scope.
  Shared must expose the SAME catalog service used by startup, reloads and runtime
  registrations. B8676/B8681 already claim provider metadata mounts and B8647 owns
  /public/agents/fields, so none of those routers is merged here. No router returned
  here carries a fallback. The duplicate provider mount in the other tasks is an
  architect prerequisite, not permission to register a third copy.

  Native hub_surface tests cover exact response shape, links read again after an
  update, live catalog replacement, outer blog fallback warning/order, five-post
  slicing and a failing second backup load. public_hubs tests boot the real
  application constructor, so they fail if the architect's call is absent. Cover
  every listed path, v1 custom_auth_runs_once, legacy_skips_custom_auth,
  unknown_facet_requires_auth, late_router_installation, shared_registry_updates,
  useful_links_after_save and no_duplicate_route_or_fallback. Reuse B860's equivalent
  Postgres fixtures for plugin and health rows. Do not call FastAPI handlers through
  a helper adapter: they depend on proxy globals.

  B3192-B3194's planned HTTP cases move here, since those tasks cannot pass a
  booted-server gate before this composition exists. Keep their native handler
  tests with the parts. Add the following cases in public/hub-composition with a
  configured master key and no bearer unless specified. info-defaults checks all
  four fields, ignoring only /body/litellm_version with the version deviation;
  info-mixed-links configures both useful-link variants. cost-map-local sets
  LITELLM_LOCAL_MODEL_COST_MAP=true and compares the whole mapping, with no broad
  body ignore. blog-local uses LITELLM_LOCAL_BLOG_POSTS=true; blog-rss points
  litellm_settings.blog_posts_url at the mock RSS endpoint and returns only the
  first valid item; blog-http-fallback and blog-malformed-fallback return bundled
  posts after a 503 or broken XML. blog-cache uses an HTTP case with two steps in
  one process and one upstream answer, and blog-fallback-retries uses a failing
  answer then valid RSS and proves a second GET. Do not compare the automatic
  HTTP client's User-Agent as a product header. info-post-method sends POST with
  the master key and compares the pinned method error. The v1-no-key and
  v1-invalid-key cases reach the list handler with an empty published set;
  v1-unknown-facet-no-key compares the auth failure, and
  v1-unknown-facet-with-key compares the 422 validation envelope.

  presets-remote-fetch configures litellm_settings.autorouter_presets_url to the
  mock provider and returns a valid catalog with all four required tiers;
  presets-http-fallback returns 503 there and checks the bundled catalog.
  mcp-nonstrict-public reuses B3194's configured-server fixture, sets
  public_mcp_hub_strict_whitelist=false with no explicit public_mcp_servers, and
  gives that server available_on_public_internet=true; the public hub must keep
  it with mcp_info.is_public=true and is_public_explicit=false. Preserve the
  response's declared timestamp fields, without a separate oracle comparison
  of Python str(datetime) formatting.

  Compare status, content-type, null/member presence and error type/param/code;
  ignore /error/message only for errors that use that envelope, with the project
  wording reason. Keep problem-document details and FastAPI validation locations
  distinct from that error format. Existing part cases cover default paging,
  health enrichment/failure, list filtering, explicit agent/MCP publication and
  plugin manifests. For a real health database failure, v1-list-health-lookup-failure-empty
  expects an otherwise successful list without enrichment: B7640's
  fetch_latest_health_checks_for_models logs and returns an empty tuple. A raised
  enrichment callback still becomes a problem document in B3193's native unit
  tests, but a booted database-failure case cannot manufacture that exception.
  Register no new byte decoder: the routes consume parsed
  records, B9300 owns RSS/settings decoding and the existing list framework owns
  query parsing. The unassigned handlers occupy 46 nonblank noncomment source
  lines including decorators and excluding docstrings; composition and native/HTTP tests
  bring this to roughly 700 changed non-fixture lines, below the fixed budget.
