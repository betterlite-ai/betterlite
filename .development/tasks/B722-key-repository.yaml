id: B722
title: Verification token repository and archived keys
description: >-
  Expose typed verification-token and deleted-token table access used by production call sites, plus BaseRepository
  find_many_in and row conversion. Define KeyHash in crates/betterlite-db/src/key_hash.rs as SHA256 hex
  of a presented LiteLLM token. Raw bearer tokens never cross the repository interface. Callers own their
  domain policy and archive transactions; this task supplies both tables and a writer-pinned session.


  Build the production key_repository module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/verification_token_repository.py:
  _VerificationTokenTables.litellm_verificationtoken (L34-L34; 1 source lines), _VerificationTokenTables.litellm_deletedverificationtoken
  (L37-L37; 1 source lines), _VerificationTokenTransactionManager.__aenter__ (L41-L41; 1 source lines),
  _VerificationTokenTransactionManager.__aexit__ (L43-L48; 6 source lines), _PrismaVerificationTokenDb.tx
  (L52-L52; 1 source lines), _PrismaClientView.db (L57-L57; 1 source lines), VerificationTokenRepository._db
  (L77-L79; 3 source lines), VerificationTokenRepository.table (L82-L83; 2 source lines), VerificationTokenRepository.deleted_table
  (L86-L87; 2 source lines), VerificationTokenRepository.model_class (L90-L91; 2 source lines), VerificationTokenRepository._to_model
  (L93-L109; 15 source lines), VerificationTokenRepository.find_by_id (L111-L112; 2 source lines).


  Add the key_repository operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-repository-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 37 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  65 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 311 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
