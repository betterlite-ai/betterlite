id: B4591
title: CLI token records, private files and freshness
description: >-
  Own crates/betterlite-cli/src/token_records.rs, the record model, private file and freshness
  layer underneath B4592's vault orchestration. Define CliTokenRecord, the stored CLI credential:
  base_url, user_id, user_email and user_role default to empty strings, auth_header_name defaults
  to "Authorization", jwt_token is a secret string that defaults to empty, timestamp is a number
  defaulting to 0, and key, expires_at and refresh_token are optional (key and refresh_token carry
  secret material). The record also carries client_id, token_endpoint, revocation_endpoint,
  resource and team_id as explicit optional fields: LiteLLM's record lets a sibling record's extra
  keys ride along on every stored and loaded credential through dynamic field passthrough, and
  every one of those keys is written to and read from the same token.json in practice, so this
  task declares them rather than dropping that behavior.

  Define CliTokenSecret, the keychain blob: a required base_url plus key, jwt_token, refresh_token
  and timestamp, the only fields the OS keychain ever holds. encode_secret builds one from a
  record's secret fields and serializes it; decode_secret parses a blob back and returns nothing
  when the JSON is invalid or its base_url does not match the record it is being paired against.
  holds_secret reports whether a record carries anything that would sign someone in (key, a
  non-empty jwt_token or refresh_token); without_secret returns a copy with those three cleared,
  leaving every other field, including the five pass-through fields, untouched.

  token_file_path joins a caller-supplied home directory with .litellm/token.json; this task never
  resolves the home directory itself. read_token_file parses the file at that path into a
  CliTokenRecord and returns nothing for a missing file, an unreadable one, or JSON the record
  cannot parse: a corrupt or absent file means "not logged in," never a panic or a raised error.
  stage_token_file, commit_token_file and write_token_file call B192's private-file staging,
  commit and write operations so the file lands owner-only inside an owner-only directory;
  overwrite_token_file_secret calls B192's in-place rewrite to strip the secret from an existing
  file when no replacement can be staged. Every one of these returns this task's own typed error
  on failure, with the underlying I/O error as its source; none of them panics or returns another
  task's outcome type.

  The freshness buffer is 360 seconds, never read from the environment. is_token_fresh takes a
  CliTokenRecord plus the caller's current wall-clock seconds and its resolved session-expiration
  hours, both passed in rather than read from a clock or a config section inside this module: when
  expires_at is present, the record is fresh while now is more than 360 seconds before it;
  otherwise it falls back to the record's timestamp and is fresh while its age in hours is below
  the expiration hours minus 0.1 hours. Both comparisons are strict, so a token at exactly the
  buffer boundary is stale, not fresh.
