  - tools/oracle/cases/helpers/aws-secret-reads/primary-map-hit-and-miss.yaml
  - tools/oracle/cases/helpers/aws-secret-reads/primary-empty-and-failed.yaml
  - tools/oracle/cases/helpers/aws-secret-reads/primary-invalid-json-raises.yaml
