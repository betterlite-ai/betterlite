id: B4414
title: Read AWS secrets and primary secret maps
description: >-
  Build the read half of the AWS Secrets Manager client: read one secret by name, on an async path and a sync path, and read one key out of a JSON map kept in a single "primary" secret. LiteLLM's AWSSecretsManagerV2 does this in async_read_secret, sync_read_secret, _parse_primary_secret, sync_read_secret_from_primary_secret and async_read_secret_from_primary_secret. Users turn the primary form on with key_management_settings.primary_secret_name, so one AWS secret can hold many gateway secrets. B4415 later implements BaseSecretManager for the client on top of these reads, and B4421 calls sync_read_secret with the configured primary name.

  All product code goes in the new module crates/betterlite-secret-managers/src/aws_secret_reads.rs and crates/betterlite-secret-managers/src/aws_secret_reads/**, apart from one method in crates/betterlite-secret-managers/src/aws/request_signing/post_action.rs. The skeleton declares the module in lib.rs. B4413 already built AwsSecretsManager<Resolver, Transport> in src/aws.rs and prepare_request, async_post_action, AwsTransport, CredentialResolver, ActionRequest, NoBody, TransportRequest, TransportResponse, TransportError, AwsOptionalParams and AwsRequestError in src/aws/request_signing.rs and its children. Add the reads as inherent methods on AwsSecretsManager, with bounds Resolver: CredentialResolver + Sync and Transport: AwsTransport. Read the environment through the public dependencies.environment map, never std::env.

  The public surface is exact, because B4415 and B4421 call it. async_read_secret(&self, secret_name: &str, optional_params: Option<&mut AwsOptionalParams>, timeout: Option<SecretTimeout>, primary_secret_name: Option<&str>) and sync_read_secret with the same arguments both return Result<Option<SecretString>, AwsReadError<Resolver::Error, Transport::Error>>. async_read_from_primary(&self, secret_name: &str, primary_secret_name: &str) and sync_read_from_primary return the same type. parse_primary_secret(primary_text: Option<&SecretString>) -> Result<BTreeMap<String, SecretString>, PrimarySecretError> is a public free function so the fuzz target can reach it. AwsReadError has two variants, Request(AwsRequestError<ResolverError, TransportFailure>) and Primary(PrimarySecretError).

  The sync methods need a blocking transport, and AwsTransport::post is async only. Define pub trait AwsBlockingTransport: AwsTransport in aws_secret_reads.rs with one method, fn post_blocking(&self, request: TransportRequest<'_>) -> Result<TransportResponse, TransportError<Self::Error>>, and bound the sync methods with it. Then add pub fn blocking_post_action<Body, Reply> to post_action.rs, in a second impl block bound by Transport: AwsBlockingTransport, with the arguments and return type of async_post_action. Move what follows the transport call (the TransportError mapping, the size check, the status check, the JSON decode) into private functions both methods call, so the two can't drift. request_timeout, MAX_RESPONSE_BYTES and DEFAULT_TIMEOUT stay as they are, and async_post_action keeps its behavior.

  sync_read_secret opens with a guard. When secret_name is AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION_NAME, AWS_REGION or AWS_BEDROCK_RUNTIME_ENDPOINT, it returns that name's value from dependencies.environment (None when unset) and sends nothing, whatever primary_secret_name says. LiteLLM needs this because signing reads those names through get_secret, and fetching them from AWS would loop forever. After the guard, both reads send a non-empty primary_secret_name to the primary read. An empty one means no primary, so the read goes straight to AWS.

  A direct read posts ActionRequest { action: "GetSecretValue", secret_name, request_data: None } with NoBody as the body type, passing optional_params and timeout on to async_post_action or blocking_post_action. The reply type is BTreeMap<String, SecretField>, where SecretField is a private #[serde(untagged)] enum with no Debug: Text(String) and Other(serde::de::IgnoredAny). The read returns the Text under the key SecretString as a SecretString. A missing key or an entry that isn't text gives Ok(None) plus a log line. A reply of {"SecretBinary": "..."} is one of those.

  Failures split in two. Everything before the HTTP call raises in LiteLLM, because _prepare_request sits outside its try block, so the AwsRequestError variants Credentials, Body, SigningParams, Signing, HeaderName and HeaderValue come back as Err(AwsReadError::Request(..)). Everything after it is swallowed by LiteLLM's except Exception, so Http, Timeout, Transport, ResponseTooLarge, ErrorText and Response log one tracing::error! line and return Ok(None). Write the split as one private exhaustive match with no wildcard arm, used by both paths. The log line carries the secret name and a fixed word for the kind of failure, and never the error's Display, because Http carries the reply text and Response carries serde text.

  sync_read_from_primary calls sync_read_secret(primary_secret_name, None, None, None), so the primary name itself passes through the guard. async_read_from_primary reads the primary through a private direct read with no optional params and no timeout, since an async fn can't call itself without boxing. Both then call parse_primary_secret and remove secret_name from the map, and a missing key gives Ok(None). The caller's optional_params and timeout never reach the primary read, because LiteLLM's primary methods don't take them.

  parse_primary_secret treats None and empty text as an empty map. That covers a failed primary read too: the caller gets Ok(None), not an error. Text that isn't JSON, or whose top level isn't an object, gives PrimarySecretError, and the read returns Err(AwsReadError::Primary(..)). That matches the JSONDecodeError and AttributeError LiteLLM lets out of these methods. Parse with serde_json::from_str into BTreeMap<String, SecretField>, keep the Text entries as SecretString and drop the rest, so a number or list under another key can't break the read, and asking for such a key gives None. LiteLLM would hand back the raw value there, but its declared return type is str | None and get_secret turns a non-string into None, so docs/compatibility.md asks for no case. Duplicate keys resolve to the last one, as json.loads does.

  PrimarySecretError keeps only serde_json::error::Category from Error::classify, plus the line and column. It never keeps the serde_json::Error or its text. Add a one-line comment saying why.

  Add the cargo-fuzz target crates/betterlite-secret-managers/fuzz/fuzz_targets/aws_primary_secret.rs with its [[bin]] entry in crates/betterlite-secret-managers/fuzz/Cargo.toml and seeds in crates/betterlite-secret-managers/fuzz/corpus/aws_primary_secret/. It takes the fuzz bytes, skips input that isn't UTF-8, wraps the text in SecretString and calls parse_primary_secret. Seeds cover an object of text, mixed value types, a top-level string, array and null, truncated JSON, NaN, deep nesting, duplicate keys and empty text.

  Native tests go in src/aws_secret_reads/tests.rs, opened with #![cfg(test)] and declared with a plain mod tests;. The fakes in src/aws/request_signing/aws_request_signing/support.rs are private to that module, so write small ones here. The checks name these test functions. credential_failure_reaches_the_caller: the resolver fails, and both paths return Err(AwsReadError::Request(AwsRequestError::Credentials(..))). request_failure_reads_as_none: an rstest over timeout, failed transport, oversize reply, error status with non-UTF-8 text, and a reply that isn't JSON, each giving Ok(None) on both paths. primary_error_hides_the_value: parsing the JSON string "sk-primary-value" fails, and neither Display nor Debug of the error holds sk-primary-value. read_failure_log_hides_the_reply: a 200 reply that is the bare JSON string "sk-reply-value" reads as None, and the captured tracing output doesn't hold sk-reply-value. each_path_uses_its_own_post: a counting fake shows async reads call post only and sync reads call post_blocking only. blocking_post_matches_async_post: the same replies and failures give the same outcome through async_post_action and blocking_post_action. replays_the_aws_primary_secret_corpus: every file in fuzz/corpus/aws_primary_secret goes through parse_primary_secret without a panic.

  Oracle cases go under tools/oracle/cases/helpers/aws-secret-reads/, with at least one seed at tools/oracle/fuzz/corpus/helper_case/aws-secret-reads-seed.yaml. Shape the input like the CyberArk helper in tools/oracle/src/helpers/secret_managers/b4418.rs: env, scripted replies per route, and a list of steps naming the read, the path (async or sync), the secret name, the primary name and the optional params. Each step reports the value, None, or that the call raised, plus the requests sent. Compare the URL, the X-Amz-Target header, the JSON body and the result, never the signature or date. Set static AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_REGION_NAME values in the case env. On the Python side, keep LiteLLM's real handlers in the path: build HTTPHandler(client=httpx.Client(transport=mock)) and AsyncHTTPHandler(transport=mock) on one httpx.MockTransport, and patch _get_httpx_client and get_async_httpx_client in litellm.secret_managers.aws_secret_manager_v2 to return them. The timeout case raises httpx.ReadTimeout from the mock. The Rust adapter implements CredentialResolver, AwsTransport and AwsBlockingTransport over the same script.

scope:
  paths:
    - crates/betterlite-secret-managers/src/aws_secret_reads.rs
    - crates/betterlite-secret-managers/src/aws_secret_reads/**
    - crates/betterlite-secret-managers/src/aws/request_signing/post_action.rs
    - crates/betterlite-secret-managers/fuzz/Cargo.toml
    - crates/betterlite-secret-managers/fuzz/fuzz_targets/aws_primary_secret.rs
    - crates/betterlite-secret-managers/fuzz/corpus/aws_primary_secret/**
    - tools/oracle/cases/helpers/aws-secret-reads/**
    - tools/oracle/fuzz/corpus/helper_case/aws-secret-reads-*
  lint_tables: false

references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L124-L171
    why: async_read_secret. The primary branch, then _prepare_request outside the try, then the post and the except blocks. No bootstrap guard here.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L173-L232
    why: sync_read_secret. The five bootstrap names come first, then the same flow as the async read.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L234-L260
    why: _parse_primary_secret and the two primary readers. Note the "or '{}'" and that neither reader takes optional_params or timeout.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L799-L871
    why: AsyncHTTPHandler.post turns httpx.TimeoutException into litellm.Timeout before the secret manager sees it, and retries once on httpx.RemoteProtocolError and httpx.ConnectError.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1471-L1526
    why: HTTPHandler.post does the same timeout conversion, and its raise_for_status is what makes a sync error status a failed read.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/secret_manager_handler.py#L156-L171
    why: The only caller that passes primary_secret_name, from key_management_settings.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L316-L350
    why: get_secret logs a raised read and falls back to os.getenv, and drops a non-string secret. Shows why a raised primary error and a None differ for users.
  - url: https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
    why: The reply fields, and the SecretString limit of 65,536 bytes.
  - url: https://docs.rs/serde_json/latest/serde_json/struct.Error.html#method.classify
    why: The Category and position to keep in PrimarySecretError instead of the error text.
  - url: https://serde.rs/enum-representations.html#untagged
    why: How SecretField tries Text and then Other.
  - url: https://docs.rs/serde/latest/serde/de/struct.IgnoredAny.html
    why: Skips any JSON value without keeping it, so serde_json::Value isn't needed.

dod:
  - text: Both reads post GetSecretValue with the secret name and return the reply's SecretString, and optional_params such as aws_region_name change the request as they do in LiteLLM.
    proof:
      - oracle
      - reads-behavior
  - text: sync_read_secret returns the environment value of the five bootstrap names without a request, also when a primary name is set, while async_read_secret posts those names to AWS.
    proof:
      - oracle
      - reads-behavior
  - text: An error status, a timeout, a failed transport, an oversize reply, a reply that isn't JSON and a reply without text under SecretString each log one line and read as Ok(None) on both paths.
    proof:
      - oracle
      - request-failure-reads-none
  - text: A failure while preparing the request, such as a credential error, reaches the caller as Err on both paths and is not turned into None.
    proof:
      - prepare-failure-propagates
  - text: Primary reads return the requested key, give None for a missing key and for a missing, empty or failed primary, raise on text that isn't a JSON object, read directly for an empty primary name, and leave optional_params and timeout out of the primary request.
    proof:
      - oracle
      - reads-behavior
  - text: No secret value reaches PrimarySecretError or the failure log, even when serde quotes the input in its own error.
    proof:
      - secret-text-stays-hidden
  - text: blocking_post_action behaves like async_post_action, each read path uses only its own transport method, and the existing async post and prepare tests still pass.
    proof:
      - blocking-post
      - post-action-regression
  - text: parse_primary_secret has a cargo-fuzz target over its input, and a normal test replays the committed corpus.
    proof:
      - primary-fuzz-corpus
  - text: The helper runs LiteLLM's real reads through its real HTTP handlers, and the new helper seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus

checks:
  optional:
    - mutants
  commands:
    - id: reads-behavior
      why: The read module has no tests, or a direct or primary read misbehaves.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secret_reads::/) - test(/replays_the_/)'
    - id: prepare-failure-propagates
      why: A credential failure is swallowed into None, or its test is missing.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secret_reads::(.*::)?credential_failure_reaches_the_caller/)'
    - id: request-failure-reads-none
      why: A failure after the request was built raises instead of reading as None, or its test is missing.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secret_reads::(.*::)?request_failure_reads_as_none/)'
    - id: secret-text-stays-hidden
      why: The primary error or the failure log repeats a secret that serde quoted, or a test for it is missing.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secret_reads::(.*::)?primary_error_hides_the_value/)' && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secret_reads::(.*::)?read_failure_log_hides_the_reply/)'
    - id: blocking-post
      why: A read path uses the wrong transport method, or blocking_post_action differs from async_post_action, or a test for it is missing.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secret_reads::(.*::)?each_path_uses_its_own_post/)' && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secret_reads::(.*::)?blocking_post_matches_async_post/)'
    - id: post-action-regression
      why: blocking_post_action is missing, or sharing its code broke the async post or request signing tests.
      run: grep -q 'fn blocking_post_action' crates/betterlite-secret-managers/src/aws/request_signing/post_action.rs && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws::request_signing::aws_request_signing::/) - test(/replays_the_/)'
    - id: primary-fuzz-corpus
      why: The fuzz target, its manifest entry or its corpus is missing, or replaying the corpus panics.
      run: test -f crates/betterlite-secret-managers/fuzz/fuzz_targets/aws_primary_secret.rs && grep -q 'aws_primary_secret' crates/betterlite-secret-managers/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-secret-managers/fuzz/corpus/aws_primary_secret)" && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(replays_the_aws_primary_secret_corpus)'
    - id: helper-python
      why: The Python helper was not written, or strict Python checking fails.
      run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4414.py)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The helper has no seed naming its operation, or the HelperCase decoder fails on replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/aws-secret-reads-*")" && grep -qE '^[[:space:]]+b4414:' tools/oracle/fuzz/corpus/helper_case/aws-secret-reads-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

