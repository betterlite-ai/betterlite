deviations:
  - what: A GetSecretValue reply past 1 MiB logs a failure and reads as None. LiteLLM has no size limit and would parse it.
    why: B4413's post path caps every reply (rule bounded-inputs). AWS limits SecretString to 65,536 bytes, so a real reply stays far below the cap.
    link: https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
  - what: Primary text that json.loads accepts and serde_json refuses raises PrimarySecretError. That covers NaN, Infinity, numbers past the f64 range, lone surrogates and nesting deeper than 128.
    why: None of these is valid JSON a secret map needs, and serde_json's depth limit keeps a stored secret from exhausting the stack.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L234-L244
  - what: A failed read logs the secret name and the kind of failure. LiteLLM also logs the exception text, and on the sync path the reply text and status.
    why: Reply text and serde messages can repeat the secret, so they stay out of logs (rule secrets-stay-secret).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L219-L231

out_of_scope:
  - B4413 owns __init__, validate_environment, load_aws_secret_manager, _prepare_request and _async_post_action.
  - B4415 owns async_write_secret, _async_create_or_restore_secret, _async_is_scheduled_for_deletion, async_replicate_secret, async_put_secret_value, async_rotate_secret, async_delete_secret and the BaseSecretManager impl for AwsSecretsManager.
  - B4421 owns the dispatch shim, including passing key_management_settings.primary_secret_name into sync_read_secret.
  - B129 owns get_secret in litellm/secret_managers/main.py, including its os.getenv fallback after a raised read.
  - The resolve_native_provider_reader branches at L144-L146 and L199-L201 aren't built, since .development/litellm.yaml excludes litellm/rust_bridge/**.
  - The one retry AsyncHTTPHandler.post makes on httpx.RemoteProtocolError and httpx.ConnectError sits below AwsTransport and belongs to whatever implements that trait in production.

pitfalls:
  - The except httpx.TimeoutException blocks at L163 and L217 that raise ValueError never run, because both HTTP handlers already turned the timeout into litellm.Timeout, a subclass of openai.APITimeoutError and not of httpx.TimeoutException. A read timeout lands in except Exception and returns None, so do not raise on it.
  - serde_json's data errors quote the input, as in invalid type string "sk-...", expected a map. A primary secret that is a bare JSON string would put the whole secret in the error text.
  - async_read_secret has no bootstrap guard, so async_read_secret("AWS_REGION") really posts to AWS. Copying the guard into the shared direct read would change that.
  - AWS_DEFAULT_REGION is not on the bootstrap list and goes to AWS like any other name.
  - The guard runs before the primary branch, so sync_read_secret("AWS_REGION", None, None, Some("map")) returns the environment value and never reads the map.
  - The names sync_read_secret_from_primary_secret and async_read_secret_from_primary_secret are past the 30 characters .ast-grep/rules/no-long-names.yml allows, so this task uses sync_read_from_primary and async_read_from_primary.
  - .ast-grep/rules/no-custom-serde.yml refuses a deserialize_with function, the workspace's secrecy has no serde feature, and clippy.toml bans serde_json::Value and serde_json::Map. That leaves SecretField holding a plain String that turns into SecretString right after the decode, so SecretField must not derive Debug.
  - Use the map for the GetSecretValue reply too, not a derived struct. A derived struct also accepts a JSON array by position, so a reply of ["x"] would read as a secret where LiteLLM's lookup fails and returns None.
  - Parsing the primary into BTreeMap<String, String> fails the whole read when any other key holds a number or a list. LiteLLM still returns the requested key in that case.
  - Keep AwsBlockingTransport out of src/aws/request_signing.rs. A new required method on AwsTransport would break the fakes in B4413's tests, and that parent module is not in this task's scope.
  - The primary read returning None on an HTTP failure and raising on bad JSON are two different outcomes for users, since get_secret falls back to os.getenv only after a raise. Keep them apart.
  - A stubbed client in the Python helper hides the timeout conversion and makes the timeout case raise where real LiteLLM returns None, so the mock belongs under HTTPHandler and AsyncHTTPHandler.

budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
