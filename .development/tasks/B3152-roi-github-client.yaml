      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^roi_github::request_retry_behavior($|::)/)' - test(/replays_the_/)
    - id: request-no-retry
      why: _request retries non-GET methods or non-retryable status codes
