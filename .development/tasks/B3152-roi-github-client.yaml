dod:
  - text: _request retries GET requests exactly once on 429/502/503/504, sleeps for 0.5 then 1.0 seconds on first and second attempts, never retries other methods, and converts httpx.RequestError to SourceError with the exact message.
    proof: [request-retry, request-no-retry]
  - text: _fetch_page detects Link-header pagination ('rel="next"' substring), parses JSON through the passed TypeAdapter, validates all required fields and ignores extras, and returns the tuple and has-next flag.
    proof: [pagination-link-header, pagination-parsing, pagination-extra-fields]
  - text: _pages yields pages up to the limit, raises SourceError with exact message when limit is reached, and stops when hasNextPage is false.
    proof: [pages-limit, pages-stop]
  - text: GitHub.__init__ accepts ROISettings, timeout 45, follow_redirects False, and optionally an httpx transport; the Authorization header includes the Bearer token when token is present; get_async_httpx_client is called with llm_provider ROICalculator and the configured parameters.
    proof: [github-init-timeout, github-init-redirects, github-init-token, github-init-httpx-client]
  - text: GitHub.repositories without query returns user repos sorted by updated, and with query filters by case-insensitive substring match across up to ten GitHub pages.
    proof: [repositories-list, repositories-search, repositories-search-depth]
  - text: GitHub.test_repositories calls GET /repos/{repo} and GET /repos/{repo}/pulls with per_page=1 and state=closed for each repository in order.
    proof: [test-repositories]
  - text: GitHub.profile_email caches results in MappingProxyType, returns the fallback when cached as None, fetches from /users/{login} using normalize_email on the response email, and handles HTTP errors by returning None.
    proof: [profile-email-cache, profile-email-fetch, profile-email-errors]
  - text: HTTP errors match LiteLLM's labeled messages for 401, 403, 404 and 429, with fallback for others, all suffixed with the status code in parentheses.
    proof: [http-errors]
  - text: Helper adapters _repository_values, _PullFile.evidence, _rest_commit_evidence and _graphql_commit_evidence construct ROI records with exact fields matching LiteLLM's model structure.
    proof: [helper-adapters]

