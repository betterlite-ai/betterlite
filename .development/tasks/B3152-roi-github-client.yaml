id: B3152
title: ROI GitHub transport and repository discovery
description: >-
  Build the GitHub client foundation in crates/betterlite-server::roi_github,
  backed by B173's injected client pool. Preserve per-request credentials from
  ROISettings.github_token, 45-second timeout, disabled redirects, GET-only
  retries for 429/502/503/504, Link-header pagination, repository search across
  ten upstream pages, profile-email caching and source-error conversion.

  The HTTP client construction takes timeout: 45, follow_redirects: False and an
  injected transport from B173's get_async_httpx_client for the ROICalculator
  provider. The _request function retries failed GET requests up to once more on
  429/502/503/504 status codes after a 0.5 second base delay, never retries
  other methods, and converts httpx.RequestError to SourceError with the message
  'Could not reach GitHub. Check the API URL and network connection.' HTTP
  errors map to status-specific labels (401: 'Authentication failed...', 403:
  'GitHub denied access...', 404: 'GitHub repository or organization not
  found...', 429: 'GitHub rate limit reached...') with fallback 'GitHub returned
  an error.' Page fetching uses Link-header pagination detection ('rel="next"'
  in response headers); limit is 10 pages for repository search and 3 for
  unauthenticated REST commits, raising SourceError 'GitHub's pagination limit
  was reached. Narrow the date range.' when exceeded. Repository search queries
  the user's owned, collaborated and organization repositories, filters by
  case-insensitive substring match within ten GitHub pages, caches profile
  emails by login in a MappingProxyType, and test_repositories validates read
  access to a repository and its closed pulls endpoint. Every response body is
  parsed through a TypeAdapter matching LiteLLM's exact field names and nesting
  structure, with extra fields ignored.

