deviations:
  - what: Timeout is a concrete 45 seconds rather than a configurable parameter.
    why: B173 wraps timeout in a shared transport contract; ROI GitHub sets it explicitly for this provider.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/roi_calculator/github.py#L332

out_of_scope:
  - "GitHub.pulls, GitHub.evidence, GitHub._commit_metadata and GitHub._graphql_commits are built by B3153; B3152 owns only the pagination and request infrastructure they consume."
  - "The nested pull_pages, matching_pulls and file_pages generators inside pulls and evidence belong to B3153."
  - "Enforce pagination limits of 3 pages REST vs 100 pages GraphQL (both raising the pagination-limit SourceError) — owned by B3153."
  - "_commit_metadata's conditional selection of REST vs GraphQL is owned by B3153 along with its entire function body."

pitfalls:
  - "The Link-header detection checks for the exact substring 'rel=\"next\"' in the link header value, not just its presence."
  - "Repository search's recursion wraps around the GitHub page boundary: first_github_page = (page - 1) * 10 + 1 carries the client's page number through the recursive depth limit."
  - "_request's retry recursion passes the attempt count explicitly and increments it; the first attempt is 0, the second is 1, and anything beyond fails."
  - "Normalize_email is called on profile email fetch result and imported from roi_calculator.analytics; it handles None gracefully."
  - "MappingProxyType is immutable; each cache update creates a new MappingProxyType with the updated mapping."

review_level: standard
