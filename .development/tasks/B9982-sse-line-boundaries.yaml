dod:
- text: >-
    A recorded Responses SSE data line whose JSON string holds raw U+0085, U+2028 or U+2029 keeps its event: the
    output item is recovered with the string intact, and a response.completed holding one ends recovery with its
    output. The recovery corpus has a seed with such a recording.
  proof: [recovery-item-separators, recovery-completed-separators, recovery-corpus]
- text: >-
    Recovery splits a recording only at LF, CRLF and CR, so VT, FF, U+001C to U+001F, U+0085, U+2028 and U+2029
    between two data lines leave them on one line, and B2412's other recovery tests and oracle cases still pass.
  proof: [recovery-line-ends, changed-modules, oracle]
- text: >-
    The Anthropic stream restamper, the guardrail stream-event scan, the Google GenAI guardrail SSE scan and the
    TinyFish run_id scan keep a data line holding raw U+0085, U+2028 or U+2029 whole and read its JSON, and their
    other tests and oracle cases still pass.
  proof: [restamp-separators, guardrail-separators, google-guardrail-separators, tinyfish-separators, changed-modules, oracle]
- text: >-
    LineDecoder ends a line only at LF, CRLF and CR, and the aleph_alpha, codestral and other streams that read
    through it still pass their tests.
  proof: [line-decoder-separators, changed-modules, decoder-callers]
- text: >-
    None of the six splitters keeps the Python separator set: no \u{85}, \u{2028} or \u{2029} literal and no
    is_line_boundary in the changed recovery, guardrail, TinyFish and LineDecoder files, and no LINE_BREAKS or
    splitlines_keepends in the restamp files.
  proof: [python-breaks-gone]
- text: >-
    docs/deviations/B9982.yaml lists the six fixes with their pinned LiteLLM links, and the restamp kept_bugs row is
    gone from docs/deviations/B980.yaml.
  proof: [deviation-rows]
checks:
  optional: []
  commands:
  - id: recovery-item-separators
    why: Recovery still drops an output item whose JSON string holds U+0085, U+2028 or U+2029.
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail
      -E 'test(/^api::responses_sse_recovery::tests::recovery_keeps_unicode_separators_in_an_item$/)'
  - id: recovery-completed-separators
    why: Recovery still skips a response.completed whose JSON string holds U+0085, U+2028 or U+2029.
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail
      -E 'test(/^api::responses_sse_recovery::tests::a_completed_event_with_unicode_separators_ends_recovery$/)'
  - id: recovery-corpus
    why: The recovery corpus has no recording with a separator inside a JSON string, or its replay broke.
    run: >-
      test -f crates/betterlite-core/fuzz/corpus/responses_sse_recovery/recording-unicode-separators
      && cargo nextest run --locked -p betterlite-core --no-tests=fail
      -E 'test(/^api::responses_sse_recovery::tests::replays_corpus$/)'
  - id: recovery-line-ends
    why: Recovery still splits at a separator other than LF, CRLF and CR, or no longer splits at one of those.
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail
      -E 'test(/^api::responses_sse_recovery::tests::recovery_splits_only_on_sse_line_ends::/)'
  - id: restamp-separators
    why: A message_start line holding U+0085, U+2028 or U+2029 is still not restamped.
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail
      -E 'test(/^api::messages_stream_restamp::tests::a_start_line_with_unicode_separators_is_restamped$/)'
  - id: guardrail-separators
    why: The guardrail stream-event scan still drops an event holding U+0085, U+2028 or U+2029.
    run: >-
      cargo nextest run --locked -p betterlite-guardrails --no-tests=fail
      -E 'test(/^guardrail_message_scope::stream_chunk_events::tests::keeps_unicode_separators_inside_a_json_string$/)'
  - id: google-guardrail-separators
    why: The Google GenAI guardrail SSE scan still drops text holding U+0085, U+2028 or U+2029.
    run: >-
      cargo nextest run --locked -p betterlite-vertex --no-tests=fail
      -E 'test(/^google_genai_guardrail::records::tests::unicode_separators_inside_a_json_string_keep_the_text$/)'
  - id: tinyfish-separators
    why: The TinyFish run_id scan still misses a run frame holding U+0085, U+2028 or U+2029.
    run: >-
      cargo nextest run --locked -p betterlite-server --no-tests=fail
      -E 'test(/^pass_through_logging::tinyfish::sse_extraction::a_run_id_holding_unicode_separators_is_read$/)'
  - id: line-decoder-separators
    why: LineDecoder still ends a line at U+0085, U+2028 or U+2029.
    run: >-
      cargo nextest run --locked -p betterlite-openai --no-tests=fail
      -E 'test(/^aleph_alpha::tests::line_decoder_splits_on_sse_line_ends::.*unicode_separators_stay_in_the_line$/)'
  - id: changed-modules
    why: A test of a changed splitter broke, or a test that pinned the Python split was not flipped.
    run: >-
      cargo nextest run --locked -p betterlite-core -p betterlite-guardrails -p betterlite-vertex -p betterlite-server
      -p betterlite-openai --no-tests=fail
      -E 'test(/^api::responses_sse_recovery::/) | test(/^api::messages_stream_restamp::/) | test(/^guardrail_message_scope::stream_chunk_events::/) | test(/^google_genai_guardrail::/) | test(/^pass_through_logging::tinyfish::/) | test(/^aleph_alpha::/) | test(/^codestral_call::/)'
  - id: decoder-callers
    why: A stream that reads its lines through LineDecoder broke.
    run: >-
      cargo nextest run --locked -p betterlite-core -p betterlite-anthropic -p betterlite-provider -p betterlite-foundry
      -p betterlite-vertex --no-tests=fail
      -E 'test(/^api::interactions::streaming::/) | test(/^google_genai::/) | test(/^anthropic_http_stream::/) | test(/^compatible_chat_call::/) | test(/^langgraph_stream::/) | test(/^adapters::vertex_agent_stream::/) | test(/^agent_results::/) | test(/^gemini_http::/)'
  - id: python-breaks-gone
    why: A changed splitter still carries the Python separator set.
    run: >-
      test -f crates/betterlite-core/src/api/responses_sse_recovery.rs
      && test -f crates/betterlite-core/src/api/responses_sse_recovery/lines.rs
      && test -f crates/betterlite-core/src/api/messages_stream_restamp/python_text.rs
      && test -f crates/betterlite-core/src/api/messages_stream_restamp/restamp.rs
      && test -f crates/betterlite-guardrails/src/guardrail_message_scope/stream_chunk_events.rs
      && test -f crates/betterlite-vertex/src/google_genai_guardrail/sse.rs
      && test -f crates/betterlite-server/src/pass_through_logging/tinyfish/sse.rs
      && test -f crates/betterlite-openai/src/aleph_alpha/lines.rs
      && ! grep -n -E 'u\{0*(85|2028|2029)\}|is_line_boundary'
      crates/betterlite-core/src/api/responses_sse_recovery.rs
      crates/betterlite-core/src/api/responses_sse_recovery/lines.rs
      crates/betterlite-guardrails/src/guardrail_message_scope/stream_chunk_events.rs
      crates/betterlite-vertex/src/google_genai_guardrail/sse.rs
      crates/betterlite-server/src/pass_through_logging/tinyfish/sse.rs
      crates/betterlite-openai/src/aleph_alpha/lines.rs
      && ! grep -n -E 'LINE_BREAKS|splitlines_keepends'
      crates/betterlite-core/src/api/messages_stream_restamp/python_text.rs
      crates/betterlite-core/src/api/messages_stream_restamp/restamp.rs
  - id: deviation-rows
    why: A fix is not listed as a deviation with its LiteLLM link, or B980 still lists the restamp split as a kept bug.
    run: >-
      grep -q -F 'transformation.py#L843' docs/deviations/B9982.yaml
      && grep -q -F 'streaming_model_restamp.py#L55' docs/deviations/B9982.yaml
      && grep -q -F 'guardrail_translation/utils.py#L25' docs/deviations/B9982.yaml
      && grep -q -F 'guardrail_translation/handler.py#L122' docs/deviations/B9982.yaml
      && grep -q -F 'tinyfish_passthrough_logging_handler.py#L83' docs/deviations/B9982.yaml
      && grep -q -F 'openai_like/chat/handler.py#L68' docs/deviations/B9982.yaml
      && test -f docs/deviations/B980.yaml
      && ! grep -q -F 'universal line breaks' docs/deviations/B980.yaml
