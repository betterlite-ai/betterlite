  stream_chunk_events.rs is_blank and the google sse.rs payload trim must match '\u{1c}'..='\u{1f}', or
  anthropic-sse-multiline-blocks.yaml, whose third chunk is \u001cdata: {...}\u001d, loses its output_tokens 9.
