  why: _recover_output_items_from_raw_sse loops over raw_sse.splitlines() and drops a line that does not parse.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/anthropic_endpoints/streaming_model_restamp.py#L54-L59
  why: _restamped_frame cuts a frame with splitlines(keepends=True) and leaves a line it cannot parse as it was.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/guardrail_translation/utils.py#L13-L38
  why: _anthropic_stream_chunk_events splits each block with splitlines and strips each line.
