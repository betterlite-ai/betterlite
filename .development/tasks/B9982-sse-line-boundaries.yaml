id: B9982
title: SSE and JSON line splitters break only at CR, LF and CRLF
description: >-
  Fix the events lost by every SSE or JSON line splitter that copies Python's str.splitlines separators. B2412
  (https://github.com/betterlite-ai/betterlite/pull/2305) splits a recorded Responses SSE string with
  is_line_boundary in crates/betterlite-core/src/api/responses_sse_recovery/lines.rs. It breaks at LF, CR, VT, FF,
  U+001C to U+001E, U+0085, U+2028 and U+2029, as splitlines does. JSON allows U+0085, U+2028 and U+2029 unescaped
  inside a string, and serde_json and Python's json.dumps(ensure_ascii=False) write them raw. So a recorded data line
  whose item text holds one is cut into fragments, none of them parses, and the event is dropped: an output item goes
  missing, or the response.completed that should end recovery is skipped. LiteLLM loses the same events, since
  _recover_output_items_from_raw_sse loops over raw_sse.splitlines() (transformation.py L843). B2412's test
  recovery_splits_python_line_boundaries pins the loss.


  Five more splitters on main use the same set and drop the same lines. In betterlite-core,
  src/api/messages_stream_restamp/python_text.rs has LINE_BREAKS and splitlines_keepends, and restamp.rs cuts an
  Anthropic frame with them before it restamps the message_start model (LiteLLM streaming_model_restamp.py L55), so a
  message_start line holding one keeps the deployment's model name. In betterlite-guardrails,
  src/guardrail_message_scope/stream_chunk_events.rs splits with the is_line_break closure in events_from_text
  (LiteLLM base_llm/guardrail_translation/utils.py L25), so the stream usage scan skips such an event. In
  betterlite-vertex, src/google_genai_guardrail/sse.rs splits with LINE_BOUNDARIES in decode_google_guardrail_sse
  (LiteLLM gemini/google_genai/guardrail_translation/handler.py L122), so the guardrail never sees that chunk's text.
  In betterlite-server, src/pass_through_logging/tinyfish/sse.rs has split_lines (LiteLLM
  tinyfish_passthrough_logging_handler.py L83), so a run frame holding one loses its run_id and the request is logged
  without cost. In betterlite-openai, src/aleph_alpha/lines.rs has LINE_BREAKS in LineDecoder, the port of httpx
  0.28.1's LineDecoder behind iter_lines and aiter_lines. Every stream that reads lines through it loses such a line:
  aleph_alpha and codestral_call in betterlite-openai, compatible_chat_call, langgraph_stream and
  adapters::vertex_agent_stream in betterlite-provider, gemini_http in betterlite-vertex, anthropic_http_stream in
  betterlite-anthropic, agent_results in betterlite-foundry, and api::interactions::streaming and google_genai in
  betterlite-core. LiteLLM loses them through httpx too, for example in the OpenAI-compatible handler's
  response.aiter_lines() (openai_like/chat/handler.py L68).


  The fix: each of the six splits only at the SSE line ends, CRLF, LF and CR, as the WHATWG event-stream format
  defines them, and leaves VT, FF, U+001C to U+001E, U+0085, U+2028 and U+2029 inside the line. JSON forbids a raw CR
  or LF inside a string, so those two never cut a JSON value. There is no shared helper to write: std's char-array
  pattern ['\r', '\n'] does a stateless split, and the three splitters that fold CRLF or keep line ends keep their
  loop with the shorter set. Nothing else in these files changes, and no crate gains a dependency.


  Site by site. lines.rs deletes is_line_boundary and its comment, and recover_recorded_output in
  responses_sse_recovery.rs splits with text.split(['\r', '\n']); its comment stops saying splitlines. A CRLF pair
  leaves an empty piece between \r and \n, and decode_recovery_line already returns None for an empty line, so no
  folding is needed. python_text.rs deletes LINE_BREAKS, and splitlines_keepends becomes sse_lines_keepends, breaking
  only at '\r', '\n' and the '\r\n' pair and still keeping each line's end; restamp.rs and tests.rs call the new
  name. stream_chunk_events.rs deletes the is_line_break closure and splits with chunk.split(['\r', '\n']), and
  is_blank also matches '\u{1c}'..='\u{1f}'. Python's strip removes U+001C to U+001F, and those characters now reach
  the trim instead of being split away; the comment above events_from_text says so. google_genai_guardrail/sse.rs
  deletes LINE_BOUNDARIES, splits joined with ['\r', '\n'], and its payload trim also matches '\u{1c}'..='\u{1f}'.
  The line itself is still not trimmed before the data: check, as LiteLLM's line.startswith does. tinyfish/sse.rs
  keeps split_lines with its CR arm and CRLF fold, and its other arm matches only '\n'. aleph_alpha/lines.rs keeps
  LineDecoder's trailing_cr handling and CRLF fold, and LINE_BREAKS holds '\n' and '\r' only. Each comment that says
  Python's splitlines or httpx's LineDecoder now says the split follows SSE line ends.


  docs/deviations/B980.yaml lists the restamp split as a kept bug ("A restamped frame is split on Python's universal
  line breaks ..."). Delete that kept_bugs row. docs/deviations/B9982.yaml gets the six rows listed under deviations
  below, each with its pinned LiteLLM link.


  Tests in betterlite-core. In src/api/responses_sse_recovery/tests.rs, recovery_splits_python_line_boundaries
  becomes recovery_splits_only_on_sse_line_ends, an rstest over the separator and the expected output. Its
  line_feed, carriage_return_line_feed and carriage_return cases recover both items as today. Its vertical_tab,
  form_feed, file_separator, group_separator, record_separator, unit_separator, next_line, line_separator and
  paragraph_separator cases leave the two events on one line that is no JSON object, so nothing is recovered, and
  recovery_does_not_split_on_the_unit_separator folds into it. recovery_keeps_unicode_separators_in_an_item recovers
  an output_item.done whose item id is a, U+0085, b, U+2028, c, U+2029, d, written raw inside the JSON string, with
  that id intact. a_completed_event_with_unicode_separators_ends_recovery records a response.completed whose output
  holds an item with that id, then an output_item.done for another item, and gets the completed output alone. Add
  the corpus seed fuzz/corpus/responses_sse_recovery/recording-unicode-separators: the odd selector byte "1", then
  those two data lines joined by \n. In src/api/messages_stream_restamp/tests.rs, splitlines_keeps_python_line_endings
  becomes sse_lines_keep_their_line_ends: its source now gives "one\r\n", "two\n", "three\r" and one last line
  holding everything from four to twelve, and its other two asserts stay.
  a_start_line_with_unicode_separators_is_restamped runs restamp_messages_stream on a message_start frame whose
  message id holds raw U+0085, U+2028 and U+2029 and gets the frame back with REQUESTED_MODEL as the model and the id
  unchanged.


  Tests in the other crates. In betterlite-guardrails' src/guardrail_message_scope/stream_chunk_events/tests.rs, the
  unicode_line_separator, next_line_separator, file_separator and record_separator_between_events cases of
  text_chunks_yield_their_json_objects now expect no event, and leading_file_separator and trailing_group_separator
  still expect ["a"] through the wider trim. keeps_unicode_separators_inside_a_json_string parses one event whose text
  field holds raw U+0085, U+2028 and U+2029 and checks the text. In betterlite-vertex's
  src/google_genai_guardrail/records/tests.rs, python_splitlines_boundaries_end_a_data_line keeps only its lone_cr
  case and becomes a_lone_cr_ends_a_data_line; its other eight cases move to
  other_breaks_keep_two_frames_on_one_line, which expects no text. unicode_separators_inside_a_json_string_keep_the_text
  decodes a chunk whose part text holds raw U+0085, U+2028 and U+2029 and gets that text back. In betterlite-server's
  src/pass_through_logging/tinyfish/tests/sse_extraction.rs, splits_lines_like_python becomes splits_sse_lines and its
  a_line_separator case expects the one line "a\u{2028}b". a_run_id_holding_unicode_separators_is_read gives
  run_id_from_sse_frames a data line whose run_id holds raw U+0085, U+2028 and U+2029 and gets that run_id back. In
  betterlite-openai's src/aleph_alpha/tests.rs, line_decoder_follows_httpx becomes line_decoder_splits_on_sse_line_ends,
  and its unicode_separator case becomes unicode_separators_stay_in_the_line: the UTF-8 bytes of a, U+0085, b,
  U+2028, c, U+2029, d and \n give that one line without the \n.
