id: B3678
title: Bedrock passthrough guardrail translation and event streams
description: >-
  Build the guardrail handler for Bedrock Converse passthrough calls: scan the text of a Converse request, scan the text of a Converse response, and rewrite a buffered Converse event stream after the post call hook has run on it. LiteLLM's `BedrockPassthroughGuardrailHandler` does all three. Like the other translation handlers (B5820, B3677) the Rust version is a set of plain async functions in betterlite-server, not a trait impl, because `BaseTranslation` is not implemented in Rust. The provider table (`provider "bedrock"` to this handler) and `LlmPassthroughRouteHandler` belong to B3574. Nothing here is registered or reached from a route yet.

  Types: request bodies are `BTreeMap<String, GuardrailValue>` and `GuardrailValue` comes from `betterlite_config::sections::guardrail_identity::item`. `GuardrailApiInputs`, `GuardrailContract`, `GuardrailFailure`, `GuardrailInputType` and `GuardrailLogTarget` come from B5471's `guardrail_base`, as in B5820. The guardrail is a generic `G: GuardrailContract`. Every module that can fail owns its error enum.

  All files sit under crates/betterlite-server/src/guardrails/bedrock_passthrough/ (the parent file bedrock_passthrough.rs only declares them): `routing.rs`, `text_paths.rs`, `request.rs`, `output.rs`, `event_stream.rs` and, if event_stream.rs grows past 300 lines, a folder event_stream/ with `frames.rs`, `groups.rs` and `hook.rs`.

  routing.rs. `is_converse_endpoint(endpoint: &str) -> bool` strips trailing `/` characters, splits on `/` and is true when the last part is exactly `converse` or `converse-stream`. `is_event_stream_content_type(content_type: &str) -> bool` is true when the text contains `vnd.amazon.eventstream` anywhere (substring, not equality). `EVENT_STREAM_MEDIA_TYPE` is the constant `application/vnd.amazon.eventstream`. `event_stream_endpoint_is_de_anonymizable(endpoint)` is `is_converse_endpoint`.

  The generic fallback. For an endpoint that is not Converse (invoke, invoke-with-response-stream and the rest) LiteLLM hands the call to the generic `PassThroughEndpointHandler`, which B3573 builds in betterlite-core. This task does not call it. `request::process_input_messages` and `output::process_output_response` return `Routed::Generic` for those endpoints and change nothing, and the caller (B3574) runs B3573's handler. `Routed` is `enum Routed { Handled, Generic }`, defined in routing.rs.

  text_paths.rs holds the one piece of shared mechanics. LiteLLM collects `(container, key)` references into the JSON and later writes through them. Rust has no such reference that survives a call, so collection records a path instead: `TextPath(Vec<PathStep>)` with `PathStep::Key(String)` and `PathStep::Index(usize)`. `collect_request_texts(body: &GuardrailValue, skip_system: bool, skip_tool: bool) -> Vec<(TextPath, String)>`, `collect_output_texts(content_blocks: &[GuardrailValue]) -> Vec<(TextPath, String)>` (paths start at the block index inside the list) and `write_back_texts(root: &mut GuardrailValue, holders: &[TextPath], returned: &[String])`. Write-back sets the text at `holders[i]` to `returned[i]` for every `i` below `returned.len()`. When `returned.len() < holders.len()` it first logs at warn `BedrockPassthroughGuardrailHandler: guardrail returned {} texts for {} extracted fields; the unreturned fields keep their original text` with the two counts, and the extra holders keep their text. A returned list longer than the holders drops the extras. A path that no longer reaches a text value (the guardrail changed the body) is skipped.

  What the request collector gathers, in this order. (1) Unless `skip_system`, every element of `system` that is an object with a non-empty text `text`. (2) For each element of `messages` that is an object, each element of its `content` that is an object: when `skip_tool` is true and the block has a `toolUse` or `toolResult` key, skip the whole block. Otherwise its own non-empty `text`; then, when `toolUse` is an object, every non-empty string found anywhere under `toolUse.input` (the deep walk below); then, when `toolResult` is an object, for each object in `toolResult.content` its non-empty `text` and every non-empty string under its `json`. (3) Every non-empty string found anywhere under `additionalModelRequestFields`. `toolConfig.tools` is never scanned. Tool definitions are app configuration, and scanning them would send each schema word to the guardrail as its own text. `additionalModelRequestFields` is scanned on purpose, because it is free-form and a caller could route blocked content through it. An empty string is never collected, and a non-object where an object is expected is skipped.

  The deep walk (`_collect_strings`) takes a node. A node that is a bare string yields nothing, so a plain-string `toolUse.input` is not scanned. For an object or array, the walk is iterative with a stack: the non-empty string children come first in their order, and the container children are pushed in order and popped last first, so the last child container is walked before earlier ones. Numbers, booleans and nulls are ignored. Do not recurse. Because `GuardrailValue::Object` is a `BTreeMap`, string siblings inside one JSON object come out in sorted key order, and the order of a multi-key object differs from LiteLLM, which keeps insertion order (see deviations).

  What the output collector gathers, in block order, for each block that is an object: its non-empty `text`; the deep walk under `toolUse.input`; the non-empty `reasoningContent.reasoningText.text`; and the non-empty `text` of each object in `citationsContent.content`. Reasoning signatures, redacted content and citation sources are never collected.

  request.rs. `process_input_messages(data: &mut BTreeMap<String, GuardrailValue>, guardrail: &G, skip_system: bool, skip_tool: bool, logging_obj: Option<&mut GuardrailLogTarget>) -> Result<Routed, RequestTranslationError>`. The caller computes `skip_system` and `skip_tool` with B3663's `effective_skip_system_message_for_guardrail` and `effective_skip_tool_message_for_guardrail`, so this task needs neither. `endpoint` is `data["endpoint"]` (empty text when absent). A non-Converse endpoint returns `Routed::Generic`. Otherwise, when `data["data"]` is not an object or its `messages` is not an array, return `Handled` with no call. Collect the texts; none means no call. Else call the guardrail once with `texts` and `model` (only when `data["model"]` is non-empty text), `request_data` the whole `data`, input type `Request`, and write the returned texts back into `data["data"]` when the returned `texts` is present and non-empty. Failures from the guardrail are returned in the error enum's one variant and never caught.

  output.rs. `process_output_response(response: &mut GuardrailValue, guardrail: &G, logging_obj: Option<&mut GuardrailLogTarget>, user_metadata: BTreeMap<String, GuardrailValue>, request_data: Option<&BTreeMap<String, GuardrailValue>>) -> Result<Routed, OutputTranslationError>`. `endpoint` is `request_data["endpoint"]`, empty when there is no request data. A non-empty endpoint that is not Converse returns `Routed::Generic`; an empty endpoint is treated as Converse. A response that is not an object, or has no array at `output.message.content`, returns `Handled` with no call. No collected text means no call. Otherwise build the request data for the call as a copy of `request_data` (an empty map when `None`); when the copy has no `litellm_metadata` key and `user_metadata` is not empty, insert it as `litellm_metadata`. `user_metadata` is the result of B3661's `transform_user_api_key_dict_to_metadata`, which the caller computes (empty when there is no key). The caller's own request data is not changed. Call the guardrail once with `texts` and `model` (the request data's `model` when it is non-empty text, not the response's), input type `Response`, and write the returned texts back into the response content when present and non-empty.

  event_stream.rs rewrites a whole buffered Bedrock event stream (`application/vnd.amazon.eventstream`) so masked tokens come back as the original text. It does not talk to a guardrail. It sends one synthetic response through the post call hook and puts the hook's answer back into the frames. The hook is injected: `trait PostCallSuccessHook: Sync { type Error: std::error::Error + Send + Sync + 'static; fn post_call_success_hook(&self, data: &BTreeMap<String, GuardrailValue>, user_api_key_dict: &BTreeMap<String, GuardrailValue>, response: GuardrailValue) -> impl Future<Output = Result<GuardrailValue, Self::Error>> + Send; }` stands in for `ProxyLogging.post_call_success_hook`, and the proxy wiring task implements it.

  Frame reading is sync and pure. Decode frames with the `aws-smithy-eventstream` crate (`frame::read_message_from`, which checks both CRCs, the same job as botocore's `EventStreamBuffer`); add `aws-smithy-eventstream = "=0.61.6"`, `aws-smithy-types = "=1.9.1"`, `bytes` and `crc32fast` to crates/betterlite-server/Cargo.toml at the versions betterlite-bedrock already pins, if they are not there yet. `parse_event_stream(body: &[u8]) -> ParsedStream { frames: Vec<Frame>, trailing: Vec<u8> }` and `Frame { raw: Vec<u8>, texts: Vec<(GroupKey, String)> }`. Walk from offset 0 while `offset + 16 <= len`: read the big-endian u32 total length at the offset; stop when it is below 16 or runs past the end. Everything from the stopping offset is `trailing`. Each frame's `raw` is its exact bytes. A frame that fails to decode keeps `texts` empty and is forwarded as is (log at debug `could not decode event-stream frame, forwarding it unmodified`). Only a frame whose `:event-type` header is the string `contentBlockDelta` is read further: parse its payload as JSON, and when that fails or the payload is not an object, keep `texts` empty (debug log `could not parse contentBlockDelta payload, forwarding frame unmodified`). Otherwise `texts` comes from `delta_text_cells(payload["delta"])`, in order: `delta.text` (group `Text`), `delta.toolUse.input` (group `Tool`), `delta.reasoningContent.text` (group `Reasoning`), and for each element of `delta.citationsContent.content` at its position `i` the `text` of that element (group `Citation(i)`). Each is taken only when the value is a string; an empty string counts. `GroupKey` is `enum { Text, Tool, Reasoning, Citation(usize) }`. A delta that is not an object gives no cells.

  Groups. Fragments of one logical text arrive split over many frames, so they are joined before the hook sees them. `group_texts(frames: &[Frame]) -> Groups` lists groups in order of first appearance, with each group's members as `(frame_index, cell_index)` pairs and its fragment strings. A group is active when its joined text is not empty. With no active group, `de_anonymize_event_stream` returns the input bytes unchanged. The synthetic response is `{"output": {"message": {"role": "assistant", "content": [{"text": <joined text of group>} ...one per active group, in order]}}, "stopReason": "end_turn"}`.

  `de_anonymize_event_stream<H: PostCallSuccessHook>(body: &[u8], hook: &H, user_api_key_dict: &BTreeMap<String, GuardrailValue>, data: &BTreeMap<String, GuardrailValue>) -> Result<Vec<u8>, EventStreamError<H::Error>>` calls the hook once with `data`, `user_api_key_dict` and the synthetic response. A hook error is returned in the error enum's `Hook` variant. When the answer is not an object, return the input bytes unchanged (debug log `post_call_success_hook returned {type}, leaving event stream unmodified`). When `output.message.content[i].text` is missing or not text for any `i` below the active group count, return the input bytes unchanged. Otherwise take the returned text of each active group, in order.

  `redistribute(groups: &Groups, returned: &[String]) -> BTreeMap<(usize, usize), String>` (`returned[j]` belongs to the j-th active group) splits a returned text back over the members of its group. With `orig` the fragment lengths and `total = max(sum(orig), 1)`, `new_len` the returned text's length, `pos = 0`: for every member except the last, `end = pos + round_half_even(new_len * orig[k] / total)`, the member gets `returned[pos..end]` and `pos = end`; the last member gets `returned[pos..]`. All lengths and slices count Unicode characters, never bytes, an `end` past the end is clamped, and the division is floating point. Python's `round` rounds halves to even, so use `f64::round_ties_even`; 2.5 gives 2 and 3.5 gives 4. A group of one member gets the whole returned text. Members of inactive groups get no entry and keep their text.

  `rebuild_event_stream(parsed: &ParsedStream, new_texts: &BTreeMap<(usize, usize), String>) -> Vec<u8>` is the output. A frame with no texts is copied as is. For a frame with texts: take its header bytes and payload from the frame layout (headers start at byte 12 and are `headers_length` long, read from bytes 4 to 8; the payload runs to `total_length - 4`), parse the payload JSON again, set each cell `i` of `delta_text_cells` to `new_texts[(frame_index, i)]` when there is one, and re-serialize the payload compactly (no spaces). On any failure the original frame is copied. The new frame is: `new_total = 12 + headers_length + payload_len + 4` and `headers_length` as big-endian u32s, the CRC32 of those 8 bytes, the original header bytes, the new payload, and a last CRC32 over everything before it (prelude, prelude CRC, headers, payload). Use `crc32fast`. The `trailing` bytes are appended last. The frame's header bytes are never re-encoded.

  The async path is `parse_event_stream`, then `group_texts`, the hook call, `redistribute`, `rebuild_event_stream`. Keep the first, `redistribute` and the last as sync pure functions, since the fuzz target and the helper cases call them without a hook.

  Fuzz target: add `bedrock_event_stream` to crates/betterlite-server/fuzz (Cargo.toml bin entry, fuzz_targets/bedrock_event_stream.rs, corpus folder crates/betterlite-server/fuzz/corpus/bedrock_event_stream/). The decoder is `parse_event_stream` and its input is arbitrary bytes. The target also runs `group_texts`, `redistribute` with every group's text uppercased, and `rebuild_event_stream`, and must never panic. Seed the corpus with a valid multi-frame stream, a truncated frame, a frame with a bad CRC, a frame whose payload is not JSON, a contentBlockDelta with each of the four delta shapes, and a stream with trailing garbage. A native test `replays_the_bedrock_event_stream_corpus` in the event_stream tests replays every file in that corpus folder and asserts the folder is not empty.

  Oracle. No route reaches this code yet, so there are no HTTP cases, and B3574 adds them. The helper operation `b3678` (skeleton creates it) runs the same input through LiteLLM's `BedrockPassthroughGuardrailHandler` and the Rust functions. The case input is `call: {b3678: {function: <name>, ...}}` with these functions. `input_texts`: `endpoint`, `data`, `skip_system`, `skip_tool`, `returned_texts` (what a scripted guardrail answers, absent for "no answer"); the output is the texts the guardrail received, the `model` it received and the resulting `data`. `output_texts`: `endpoint`, `response`, `request_data`, `returned_texts`; the same output shape. `stream`: `frames` (a list of `{event_type, payload}` that the adapter encodes as real event-stream frames), `replace` (a map from a text to its replacement, which the scripted hook applies to every synthetic content block) and `trailing_hex`; the output is the decoded frames (headers and payload) and the trailing bytes after rewriting, with CRCs checked. `routing`: `endpoint`, `content_type`. The Python adapter builds a `CustomGuardrail` subclass with a scripted `apply_guardrail` for the first two, and a fake `proxy_logging_obj` with a scripted `post_call_success_hook` for the third. Cases keep multi-key nested objects in alphabetical key order, so the key-order deviation does not show.

