deviations:
  - what: Texts that sit in one JSON object with several string keys (inside toolUse.input, toolResult json or additionalModelRequestFields) reach the guardrail in sorted key order, and a rewritten frame's payload keys are written in sorted order.
    why: Request bodies are BTreeMap values in betterlite and keep no insertion order. The write back stays consistent with the order sent, so the result is the same except for the order of texts.
  - what: Non-Converse endpoints return Routed::Generic instead of calling the generic passthrough handler inside this module.
    why: The generic handler is B3573's, and B3574 owns the dispatcher that already depends on it. The caller makes the same call LiteLLM makes.
  - what: The event-stream rewrite takes its frame reader from the aws-smithy-eventstream crate, not botocore.
    why: Same CRC checks and header parsing, from a maintained crate that betterlite-bedrock already uses.

out_of_scope:
  - "litellm/proxy/guardrails/tool_name_extraction.py (extract_request_tool_names, the standalone Gemini and MCP extractors, TOOL_CAPABLE_CALL_TYPES) is not built here. B888 covers it and moves it into betterlite-auth, because the key allowlist check lives there and auth cannot depend on betterlite-server."
  - "PassThroughEndpointHandler (the generic fallback) belongs to B3573. LlmPassthroughRouteHandler, the provider table and the is_event_stream_response, event_stream_media_type, supports_event_stream_de_anonymization and de_anonymize_event_stream dispatchers belong to B3574, which calls the statics in routing.rs and event_stream.rs."
  - "The proxy side of the event stream (common_request_processing.py L2736, L3251-L3273, L3305-L3380) belongs to the passthrough route tasks. The PostCallSuccessHook implementation over the real post call hooks belongs to the hook wiring task."
  - "effective_skip_system_message_for_guardrail and effective_skip_tool_message_for_guardrail belong to B3663, and transform_user_api_key_dict_to_metadata belongs to B3661. The caller computes all three inputs."
  - "BaseTranslation and the provider mapping tables are not built. Handlers are plain functions chosen by the dispatcher (B3679, B3680)."
  - "HTTP oracle cases for Bedrock passthrough routes come with B3574, since no route reaches this handler yet."

pitfalls:
  - A bare string root in the deep walk yields nothing, so a toolUse.input that is a plain string is never sent to the guardrail, and so is a string passed directly as additionalModelRequestFields.
  - The deep walk pops its stack last in first out, so with two nested objects under one parent the second one is walked before the first. Direct string children always come before any nested container.
  - skip_tool drops the whole block when it has a toolUse or toolResult key, including any text key the same block carries. The text of a plain block next to it is still scanned.
  - Request text skips empty strings, but stream cells keep them. A stream group becomes active only when its joined text is not empty.
  - A citation group key is the position in the content list including elements that are not objects, so a skipped element still advances the index.
  - In streams the reasoning text is at delta.reasoningContent.text, one level shallower than the non-streaming reasoningContent.reasoningText.text.
  - Python's round() rounds halves to even and Rust's f64::round rounds them away from zero. Use round_ties_even, or a 2.5 character share comes out one character off.
  - The proportional split counts characters, not bytes, and the last member takes the remainder. If the returned text is shorter than the shares ask for, slices are clamped, not an error.
  - The frame CRCs are plain CRC32. The message CRC covers the prelude, the prelude CRC, the headers and the payload, and the total length field changes with the new payload size.
  - A frame is rewritten whenever it had text cells, even when no text changed, and its payload is re-serialized without spaces.
  - process_output_response takes the model from the request data, not from the response, and builds litellm_metadata on a copy, so the caller's request data never gains the key.
  - An empty endpoint on the output side counts as Converse, while on the input side an empty endpoint is not Converse and goes to the generic handler.
  - toolConfig.tools stays unscanned on purpose. A change that adds it makes every schema word its own guardrail text.

