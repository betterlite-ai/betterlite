dod:
  - text: is_converse_endpoint is true only when the last path part, after trailing slashes are removed, is converse or converse-stream. is_event_stream_content_type matches by substring, and the media type constant is application/vnd.amazon.eventstream.
    proof: [routing-tests, oracle, helper-python]
  - text: A non-Converse endpoint returns Routed::Generic from both process functions, with no guardrail call and no change to the data or response.
    proof: [request-tests, output-tests]
  - text: The request collector gathers system text (unless skipped), message text, toolUse.input strings, toolResult text and json strings, and additionalModelRequestFields strings, in LiteLLM's order, and never toolConfig.tools. skip_tool skips whole toolUse and toolResult blocks.
    proof: [request-tests, oracle, helper-python]
  - text: The deep walk visits direct strings first and then containers last to first, ignores empty strings and a bare string root, and does not recurse.
    proof: [request-tests, oracle, helper-python]
  - text: process_input_messages calls the guardrail once with texts, model only when non-empty text, input type Request, and the whole data as request_data; no texts or a body without a messages array means no call.
    proof: [request-tests]
  - text: Returned texts are written back by position. A shorter reply writes only the first holders and logs the warning, and a longer reply drops the extras.
    proof: [request-tests, oracle, helper-python]
  - text: The output collector gathers text, toolUse.input strings, reasoningContent.reasoningText.text and citationsContent.content[].text, and skips signatures and sources.
    proof: [output-tests, oracle, helper-python]
  - text: process_output_response adds user_metadata as litellm_metadata to a copy of the request data only when the key is absent and the metadata is not empty, takes model from the request data, and leaves the caller's request data unchanged.
    proof: [output-tests]
  - text: parse_event_stream stops at a bad length, keeps trailing bytes, forwards frames that fail to decode, and reads text cells only from contentBlockDelta frames whose payload is a JSON object, with the four delta shapes in order.
    proof: [stream-tests, oracle, helper-python]
  - text: Citation group keys use the position in the content list, and reasoning deltas read reasoningContent.text, not reasoningText.text.
    proof: [stream-tests, oracle, helper-python]
  - text: de_anonymize_event_stream joins fragments per group, sends one synthetic response to the hook, returns the input unchanged when no group has text, when the answer is not an object or when a block text is missing, and returns the hook's error otherwise.
    proof: [stream-tests]
  - text: redistribute splits a returned text over a group's frames in proportion to the original fragment lengths, with round-half-even, character counts, a floating point ratio and the whole remainder on the last member.
    proof: [stream-tests, oracle, helper-python]
  - text: Rebuilt frames keep the original header bytes, carry a compact payload, and have a correct total length, prelude CRC and message CRC. Frames without texts and the trailing bytes are copied as they were.
    proof: [stream-tests, oracle, helper-python]
  - text: The fuzz target and its committed corpus exist and the corpus replays without a panic.
    proof: [stream-corpus]
  - text: New helper cases replay through the shared helper-case parser, and the adapter passes its lint and type checks.
    proof: [helper-case-corpus, helper-python]

checks:
  optional: [mutants]
  commands:
    - id: routing-tests
      why: the endpoint and content type checks are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::bedrock_passthrough::routing::/)'
    - id: request-tests
      why: request collection, deep walk, write back or the input handler tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::bedrock_passthrough::(text_paths|request)::/)'
    - id: output-tests
      why: output collection or the output handler tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::bedrock_passthrough::output::/)'
    - id: stream-tests
      why: frame parsing, grouping, redistribution, rebuilding or the hook flow tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::bedrock_passthrough::event_stream::/) - test(replays_the_bedrock_event_stream_corpus)'
    - id: stream-corpus
      why: the event stream fuzz target or its fresh seeds are missing, or replay fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/bedrock_event_stream.rs &&
        grep -q 'name = "bedrock_event_stream"' crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/bedrock_event_stream)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_bedrock_event_stream_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3678)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3678 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3678/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added Bedrock passthrough cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_passthrough_guardrail-*")" &&
        grep -lE '^[[:space:]]+b3678:' tools/oracle/fuzz/corpus/helper_case/bedrock_passthrough_guardrail-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

