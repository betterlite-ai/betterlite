id: B948
title: Responses mcp selection
description: >-
  Select Responses MCP tools through B136's registered server/toolset view, enforce B137 permission context and
  normalize/deduplicate allowed tools. A request server_url only identifies an already configured gateway server
  and is never an outbound destination; return a typed selected-tool set.


  Implement crates/betterlite-core/src/api/responses_mcp_selection.rs. Use ResponsesMcpSelectionInput and ResponsesMcpSelectionResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions registered_gateway_url, unknown_server_no_fetch, toolset_permissions,
  allowed_tools_filter, duplicate_tool_names under api::responses_mcp_selection::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesMcpSelection in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_mcp_selection: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/mcp/litellm_proxy_mcp_handler.py: _mcp_server_url (L66-L70); litellm/responses/mcp/litellm_proxy_mcp_handler.py:
  _names_gateway_explicitly (L73-L74); litellm/responses/mcp/litellm_proxy_mcp_handler.py: _proxy_path_mcp_name
  (L77-L80); litellm/responses/mcp/litellm_proxy_mcp_handler.py: _registered_mcp_servers (L83-L88); litellm/responses/mcp/litellm_proxy_mcp_handler.py:
  _registry_serves (L91-L97); litellm/responses/mcp/litellm_proxy_mcp_handler.py: _toolset_exists (L100-L112); litellm/responses/mcp/litellm_proxy_mcp_handler.py:
  _gateway_served_names (L115-L121); litellm/responses/mcp/litellm_proxy_mcp_handler.py: _served_mcp_path_names
  (L124-L128); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._get_parent_request_tags
  (L139-L150); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._should_use_litellm_mcp_gateway
  (L153-L156); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._parse_mcp_tools (L159-L163);
  litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._split_mcp_tools (L166-L179); litellm/responses/mcp/litellm_proxy_mcp_handler.py:
  LiteLLM_Proxy_MCP_Handler.routes_through_gateway (L182-L188); litellm/responses/mcp/litellm_proxy_mcp_handler.py:
  LiteLLM_Proxy_MCP_Handler._apply_toolset_permissions (L191-L232); litellm/responses/mcp/litellm_proxy_mcp_handler.py:
  LiteLLM_Proxy_MCP_Handler._deduplicate_mcp_tools (L355-L386); litellm/responses/mcp/litellm_proxy_mcp_handler.py:
  LiteLLM_Proxy_MCP_Handler._filter_mcp_tools_by_allowed_tools (L389-L414). Abstract/protocol declarations map to
  native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 171 owned nonblank/non-comment/non-docstring Python lines (188 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 191 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 441 total within the 450-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B136 (MCP gateway server, transports and server registry), B137 (MCP auth, OAuth flows,
  BYOK and outbound credentials), B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B1087
  (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
