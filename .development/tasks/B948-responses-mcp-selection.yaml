checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_selection::/)
      - test(/::replays_corpus$/)'
  - id: case-registered-gateway-url
    why: the registered-gateway-url behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_selection::tests::registered_gateway_url($|::)/)'
  - id: case-unknown-server-no-fetch
    why: the unknown-server-no-fetch behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_selection::tests::unknown_server_no_fetch($|::)/)'
  - id: case-toolset-permissions
