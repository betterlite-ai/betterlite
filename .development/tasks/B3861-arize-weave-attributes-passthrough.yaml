id: B3861
title: Arize and Weave attributes and passthrough projection
description: >-
  Port the rest of LiteLLM's Arize attribute code and the Weave attribute setters: the `set_attributes` flow that fills one span for an LLM call, the session, user and cost extras, the passthrough input and output projection, the MCP tool projection, and Weave's own message and span attributes. Arize code goes under `crates/betterlite-logging/src/otel/integrations/arize_attributes.rs` and its folder, Weave code under `weave_attributes.rs` and its folder. Nothing calls it yet: B3862 (Arize and Phoenix), B3863 (Weave) and the Langfuse OTel attributes task call it from their callbacks.


  Reuse what earlier tasks built, and do not copy it. B3844 gives `SafeSetAttribute::safe_set_attribute(&mut self, key: &str, value: &OtelModelValue)` on every `opentelemetry::trace::Span`, the `LLMObsAttributes` trait and `OtelModelValue` (with `as_object`, `as_array`, `as_str`, `as_bool`). `MetadataMap` is `BTreeMap<String, OtelModelValue>`. B3860 gives, in `otel/integrations/arize_messages`, the `keys` submodule of attribute names, `ArizeOtelAttributes` (the `LLMObsAttributes` impl that writes input messages), `coerce_text(&OtelModelValue) -> Option<String>` and `set_response_attributes(span, response: &OtelModelValue)`. B3846 gives, in `otel/integrations/arize_span_kind.rs`, the Rust forms of `_infer_open_inference_span_kind` and `_set_tool_attributes`. Read the exact pub names and signatures of those three modules on main before you start, and call them as they are. Use `keys` from B3860 for `input.value`, `output.value`, `llm.input_messages`, `llm.output_messages`, `message.role` and `message.content`. Put the other attribute names this task needs in your own `arize_attributes/keys.rs` as public `&str` constants: `metadata`, `llm.model_name`, `llm.provider`, `llm.invocation_parameters`, `user.id`, `session.id`, `tool.name`, `input.mime_type`, `output.mime_type`, `openinference.span.kind`, `llm.request.type`, `llm.request.max_tokens`, `llm.request.temperature`, `llm.request.top_p`, `llm.is_streaming`, `llm.user`, `llm.response.id`, `llm.response.model`, `litellm.trace_id`, `litellm.team_id`, `litellm.team_alias`, `litellm.key_alias`, `llm.cost.total`, `llm.response.cost`, and the two mime values `application/json` and `text/plain`.


  Python reads dicts with `.get` and truthiness. Rust reads `OtelModelValue` only, so every function takes `&MetadataMap` or `&OtelModelValue`, and a missing key and a null value read the same unless a rule below says otherwise. Write one small `is_truthy(&OtelModelValue) -> bool` in `arize_attributes/truthy.rs` for the "when truthy" rules: null and false are not, a number is when it is not zero, a string, array or object is when it is not empty. Every function takes the span as `&mut S` with `S: opentelemetry::trace::Span`. The Python `_safe_emit` only swallows exceptions, and nothing in this task can fail, so it has no Rust form. `_coerce_response_obj_for_attrs` also has none: it turns a Pydantic model or an `httpx.Response` into a dict, and betterlite already holds every response as a JSON value, so the response is used as it is. LiteLLM's `safe_dumps` becomes `serde_json::to_string` of the `OtelModelValue`.


  `set_attributes<A: LLMObsAttributes, S: Span>(span: &mut S, kwargs: &MetadataMap, response: &OtelModelValue, redact_messages: bool)` is `_utils.set_attributes`. `redact_messages` is LiteLLM's `should_redact_message_logging(kwargs)`; the logger that calls this works it out once with the logging privacy code (B188) and passes the answer, so this task never reads redaction settings. The steps run in this order.


  First, the early span kind: `slp` is `kwargs["standard_logging_object"]`, `call_type` is its `call_type` when `slp` is an object, and `openinference.span.kind` is written with the B3846 span kind function applied to `call_type`. Second, the main block. When `slp` is not an object, log `[Arize/Phoenix] Failed to set OpenInference span attributes: standard_logging_object not found in kwargs` with `tracing::error!`, add a span event named `exception` with the attributes `exception.type` = `ValueError` and `exception.message` = `standard_logging_object not found in kwargs`, and skip the rest of this block. Otherwise run these in order. (a) `metadata` is `slp["metadata"]`: when present and not null, write `metadata` with its JSON text. (b) `optional_params` is `kwargs["optional_params"]` when it is an object and an empty object otherwise. `litellm_params` is `kwargs["litellm_params"]` or an empty object. (c) The request attributes, in this order: `llm.model_name` from `kwargs["model"]` when truthy; `llm.request.type` from `slp["call_type"]`; `llm.provider` from `litellm_params["custom_llm_provider"]`, or `Unknown` when the key is absent; `llm.request.max_tokens`, `llm.request.temperature` and `llm.request.top_p` from the same names in `optional_params`, each only when truthy; `llm.is_streaming` as the text `True` or `False` of `optional_params["stream"]` (`False` when absent, `None` when null); `llm.user` from `optional_params["user"]` when truthy. Then, only when `response` is an object: `llm.response.id` and `llm.response.model` from its `id` and `model`, each when truthy. (d) The B3846 tool attributes function, with `optional_params["tools"]` and the metadata tools, which are `slp["metadata"]["llm"]["tools"]` when `metadata` and `llm` are objects and nothing otherwise. (e) `A::set_messages(span, kwargs)`. (f) `model_parameters` is `slp["model_parameters"]`; when it is truthy write `llm.invocation_parameters` with its JSON text, and when its `user` is truthy write `user.id` from it. (g) B3860's `set_response_attributes(span, response)`. Third, after the main block whatever happened in it, the four extra emitters in this order: session and user, response cost, passthrough, MCP.


  `identity.rs` holds the first two extras. Session and user (`_set_session_and_user_attrs`): nothing unless `slp` is an object, and `metadata` is `slp["metadata"]` or an empty object, and nothing again unless that is an object. `user_api_key_end_user_id`, when truthy, writes `session.id`. `slp["trace_id"]`, when truthy, writes `litellm.trace_id`. If neither `optional_params["user"]` (the unsanitized `kwargs["optional_params"]` object) nor `slp["model_parameters"]["user"]` is truthy, `metadata["user_api_key_user_id"]` when truthy writes `user.id`. Then `user_api_key_team_id`, `user_api_key_team_alias` and `user_api_key_alias`, each when truthy, write `litellm.team_id`, `litellm.team_alias` and `litellm.key_alias`. Values are declared strings and are written as they are. Response cost (`_set_response_cost_attr`): nothing unless `slp` is an object with a `response_cost` that is not null. A number, or a string that `str::parse::<f64>` accepts after trimming, becomes an `f64`; a bool becomes 1.0 or 0.0; any other value, and any value that is not a finite float, writes nothing. The float is written to `llm.cost.total` and then `llm.response.cost`. Build the attribute number with `serde_json::Number::from_f64`, never from an integer, so a cost of `1` is still the float `1.0`.


  `passthrough.rs` is `_maybe_normalize_passthrough` and its three helpers. It runs only when `slp` is an object and its `call_type` lowercased contains `passthrough` or `pass_through`; an absent or empty `call_type` does not. When `redact_messages` is true it returns at once, so neither input nor output is written. Input: `kwargs["additional_args"]["complete_input_dict"]` must be an object, and its `messages` must be a non-empty array. `input.value` is written first, and only when a text is found: walk the messages from last to first, skip non-objects, and the first one whose `coerce_text(content)` is a non-empty string gives the text. Then for each message at `idx`, skipping non-objects, with `prefix = "llm.input_messages.{idx}"`: write `{prefix}.message.role` when `role` is truthy, and write `{prefix}.message.content` when `coerce_text(content)` is not None (an empty string is written). Output: the parsed response comes from `parse_passthrough_response(response, kwargs)`, which is `_parse_passthrough_response` with raw and coerced response being the same value. If `response` is an object: when it has a `response` key and neither a `content` nor a `choices` key, look at `response["response"]`. A string that parses with `serde_json::from_str` into an object is the answer, and a string that does not parse, or parses into anything else, ends the search for this candidate. An object value is the answer, and any other value ends the search for this candidate. An object `response` with a `content` or a `choices` key, or with no `response` key, is itself the answer. If there is still no answer, use `kwargs["original_response"]`: an object is the answer, a string that parses into an object is the answer, and anything else gives None. With None, stop. With an answer, run two independent steps in this order. Step one: `content` must be a non-empty array. Collect each object entry's `text` when it is a string, drop empty ones, and join the rest with two newlines. When the result is not empty, write `output.value`, `llm.output_messages.0.message.role` from the answer's `role` (`assistant` when the key is absent) and `llm.output_messages.0.message.content`, both with the joined text. Step two: `choices` must be a non-empty array whose first entry is an object with an object `message`. When `coerce_text(message["content"])` is a non-empty string, write `output.value`, `llm.output_messages.0.message.role` from the message's `role` (`assistant` when absent) and `llm.output_messages.0.message.content`. Step two runs even after step one wrote, and its `output.value` replaces it.


  `mcp.rs` is `_maybe_set_mcp_tool_attrs`, `_has_only_text_parts` and `_set_mcp_tool_output`. It runs only when `slp` is an object with `call_type` equal to `call_mcp_tool`, and `slp["metadata"]["mcp_tool_call_metadata"]` is an object (nothing when `metadata` is not an object or the key is absent or null). `tool.name` is written from its `name`, else its `namespaced_tool_name`, when that is truthy. When `redact_messages` is true, stop here. If `arguments` is not null, write `input.value` with its JSON text and `input.mime_type` = `application/json`. Then the output, which needs the response to be an object. `content` is `response["content"]` and `text` is `coerce_text(content)`. When `text` is a non-empty string and `content` is either not an array or an array where every entry has `coerce_text` of that one-entry array not None, write `output.value` = the text and `output.mime_type` = `text/plain`, and stop. Otherwise `structured` is `response["structured_content"]` when that key exists (even if null), else `response["structuredContent"]`. The payload is `content` when `content` is truthy, else `structured` when it is not null, else `content`. A null or absent payload stops. Otherwise write `output.value` with the payload's JSON text and `output.mime_type` = `application/json`. So an empty `content` array with no structured value still writes `[]`.


  Weave. `weave_attributes.rs` holds `WeaveSpanAttributes` as public constants in a `keys` submodule: `wandb.display_name`, `wandb.thread_id`, `wandb.is_turn`. `WeaveOtelAttributes` is a unit struct that implements `LLMObsAttributes`; its `set_messages` writes `input.value` as the JSON text of an object with `messages` first (`kwargs["messages"]` when it is an array, else an empty array), then `functions` and then `tools` from `kwargs["optional_params"]`, each only when present and not null. `set_weave_specific_attributes<S: Span>(span, kwargs: &MetadataMap, response: &OtelModelValue)` is `_set_weave_specific_attributes`. `metadata` is `kwargs["metadata"]` or an empty object, `model` is `kwargs["model"]` or the empty string, and the provider is `kwargs["litellm_params"]["custom_llm_provider"]` or the empty string. `display_name` is `metadata["display_name"]` when truthy; otherwise, when `model` is not empty, it is `{provider}/{model}` with a non-empty provider and `model` alone without one. When there is a display name, every `/` in it becomes `__` and it is written to `wandb.display_name`. When `metadata["session_id"]` is present and not null, an array or object value is first replaced by its JSON text, then `wandb.thread_id` is written with it and `wandb.is_turn` with `true`. Last, when `response` is an object that is not empty, `output.value` is written with its JSON text, replacing the value from the earlier steps. `set_weave_otel_attributes<S: Span>(span, kwargs, response, redact_messages)` runs `set_attributes::<WeaveOtelAttributes, S>` and then `set_weave_specific_attributes`. `WeaveOtelLogger`, `get_weave_otel_config`, `weave_otel_endpoint`, `WeaveOtelConfig` and the auth header are not this task's, see out_of_scope.


  Tests sit in `arize_attributes/tests.rs` and `weave_attributes/tests.rs`, declared with `#[path]`. They read attributes back through `opentelemetry_sdk::trace::InMemorySpanExporter`, as B3844's tests do. Test names in the Arize file start with `attributes_`, `session_`, `cost_`, `passthrough_` and `mcp_`, and in the Weave file with `weave_`. Use rstest tables where several inputs share one assertion. The oracle adapter is operation `b3861`. Tagged inputs: `{"function": "set_attributes", "kwargs": {...}, "response": ..., "redact_messages": false}` runs the Arize flow with `ArizeOTELAttributes`, and `{"function": "set_weave_attributes", "kwargs": {...}, "response": ..., "redact_messages": false}` runs `set_weave_otel_attributes`. Both answer `{"result": {"attributes": {key: value}, "exceptions": [{"type": "...", "message": "..."}]}}`, where `exceptions` lists what `record_exception` received. On both sides a value stored under `output.value`, `input.value`, `metadata` or `llm.invocation_parameters` is replaced by its parsed JSON when it parses, so spacing and key order in `json.dumps` text never matter. For a message whose `content` is an array, both sides drop `input.value` and `llm.input_messages.{n}.message.content`, since LiteLLM writes Python's list repr there (B3860 has the same rule). The Python adapter calls the real `_utils.set_attributes` and `set_weave_otel_attributes` with a recording span that keeps what `set_attribute` receives and what `record_exception` receives. When `redact_messages` is true it sets `kwargs["litellm_params"]["metadata"]["headers"]["x-litellm-enable-message-redaction"] = True` first, creating the dicts if they are missing, so the real `should_redact_message_logging` answers true, and cases that set it must not also carry a `turn_off_message_logging` value. As in the B3860 adapter, Responses `output` items become `SimpleNamespace` objects before the call.

