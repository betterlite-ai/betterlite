dod:
  - text: set_attributes writes the early span kind, the request attributes with their truthy and default rules, the metadata and invocation parameter JSON, the tool attributes, the messages and the response attributes in LiteLLM's order.
    proof: [attribute-flow, oracle, helper-python]
  - text: A missing standard_logging_object logs an error, adds the exception event, writes only the early span kind and the extras, and does not stop the extras.
    proof: [attribute-flow, oracle, helper-python]
  - text: Session, user, team and key alias attributes follow the has-user rule and are skipped when empty, and response cost writes both cost keys as floats and nothing for an unparsable value.
    proof: [identity-extras, oracle, helper-python]
  - text: Passthrough input and output are projected only for passthrough call types and never when redaction is on, including the wrapper response, the original_response fallback and the content then choices override.
    proof: [passthrough-projection, oracle, helper-python]
  - text: MCP tool spans get tool.name always, and arguments and output only without redaction, with the text, structured and empty content rules and the matching mime types.
    proof: [mcp-projection, oracle, helper-python]
  - text: Weave writes the prompt JSON, the display name with slashes replaced, the thread id and is_turn flag, and the response JSON as output.value.
    proof: [weave-attributes, oracle, helper-python]

checks:
  optional: []
  commands:
    - id: attribute-flow
      why: the set_attributes tests are missing or an attribute, its order, a default or the missing-payload path differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::arize_attributes::tests::attributes_/)'
    - id: identity-extras
      why: the session, user, team or cost tests are missing or a key, the has-user rule or the float rule differs
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::arize_attributes::tests::(session|cost)_/)'
    - id: passthrough-projection
      why: the passthrough tests are missing or the call type test, the response search, the redaction stop or an output key differs
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::arize_attributes::tests::passthrough_/)'
    - id: mcp-projection
      why: the MCP tests are missing or the tool name, arguments, text, structured or mime rules differ
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::arize_attributes::tests::mcp_/)'
    - id: weave-attributes
      why: the Weave tests are missing or the prompt JSON, display name, thread id or output override differs
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::weave_attributes::tests::weave_/)'
    - id: helper-python
      why: the oracle adapter is untouched or fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3861.py tools/oracle/helpers/b3861)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json

