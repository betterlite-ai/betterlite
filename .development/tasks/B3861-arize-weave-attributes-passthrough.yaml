deviations:
  - what: Every JSON text written to an attribute (`metadata`, `llm.invocation_parameters`, the MCP arguments and payload, Weave's prompt and output) comes from `serde_json::to_string`. It has no spaces after `:` and `,`, it sorts object keys, it keeps NUL characters, and it has no depth limit with a `MaxDepthExceeded` marker.
    why: >-
      Spacing is a json.dumps habit that docs/compatibility.md leaves out of the contract. Key order is a BTreeMap detail of OtelModelValue. The NUL strip exists for PostgreSQL columns and the depth marker for Python object graphs, and neither applies to a span attribute built from parsed JSON.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/safe_json_dumps.py#L12-L93
  - what: A response cost that is NaN or infinite (a string such as `nan`) writes no cost attributes. LiteLLM writes the float.
    why: >-
      OtelModelValue holds a serde_json number, which cannot carry a non-finite float. A real response_cost is never one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/arize/_utils.py#L886-L905
  - what: The `exception` span event written for a missing standard_logging_object has `exception.type` and `exception.message` only, with no `exception.stacktrace`.
    why: >-
      There is no Python traceback to record, and the message names the same cause. The oracle compares type and message.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/arize/_utils.py#L413-L486

out_of_scope:
  - _infer_open_inference_span_kind and _set_tool_attributes (_utils.py L307-L410) belong to B3846. This task calls them.
  - ArizeOTELAttributes.set_messages, _set_response_attributes and its six writers, _safe_get, _set_usage_outputs, _coerce_text, _to_plain_dict, the tool call helpers and _emit_input_message_extras (_utils.py L33-L304 and L620-L833) belong to B3860. This task calls set_messages, set_response_attributes and coerce_text.
  - _safe_emit (L570-L577) and _coerce_response_obj_for_attrs (L591-L617) are not built. One only swallows exceptions and the other converts Python objects, and betterlite has neither problem.
  - The `secret_fields` pop in _sanitize_optional_params changes the caller's dict in place, which docs/compatibility.md leaves out. Nothing in this task reads `secret_fields`, so the Rust code simply never reads it.
  - safe_set_attribute, cast_as_primitive_value_type and the LLMObsAttributes trait belong to B3844. should_redact_message_logging belongs to B188 and the caller passes its answer in.
  - WeaveOtelLogger, _get_weave_authorization_header, weave_otel_endpoint, get_weave_otel_config and WeaveOtelConfig (weave_otel.py L109-L331, types L1-L14) belong to B3850 (settings) and B3863 (the logger class).
  - Arize and Phoenix callbacks that call set_attributes belong to B3862. The branch in opentelemetry.py that picks set_weave_otel_attributes by callback name belongs to B3856.

pitfalls:
  - The early span kind is written before the standard_logging_object check, so a missing payload still leaves `openinference.span.kind` on the span, and the extras after the main block still run.
  - '`llm.provider` defaults to `Unknown` only when `custom_llm_provider` is absent. A null value goes through safe_set_attribute and becomes the empty string.'
  - '`llm.request.max_tokens`, `temperature` and `top_p` are skipped at 0, so a temperature of 0 writes nothing, while `llm.request.type` is written even when `call_type` is missing (as the empty string).'
  - '`llm.is_streaming` is Python''s `str(bool)`, so the text is `True` or `False` with a capital letter.'
  - '`user.id` can be written by the model_parameters step and by the key metadata step. The metadata step runs only when neither `optional_params.user` nor `model_parameters.user` is truthy, so it never overwrites.'
  - Passthrough input writes `llm.input_messages.*` after `ArizeOTELAttributes.set_messages` already did from `kwargs["messages"]`. The later write wins on shared keys, and a role that is falsy is not written at all, unlike set_messages which writes the empty string.
  - A wrapper `response` string that does not parse into an object gives no answer, and the `original_response` fallback then runs. The fallback runs only when the wrapper gave nothing.
  - The passthrough output has two independent steps. A response with both `content` and `choices` writes `output.value` twice and the `choices` text wins, while the Anthropic step joins parts with two newlines and `coerce_text` joins with one.
  - '`coerce_text` treats a part with `text: ""` and no `input_text` as having no text, so an MCP content array holding one makes the whole array not text-only and sends the output down the JSON path.'
  - MCP `structured_content` counts as present when the key exists with a null value, and then `structuredContent` is not looked at.
  - MCP `tool.name` is written before the redaction check, so a redacted MCP span keeps its tool name but has no input or output.
  - Weave's `set_messages` does not touch `llm.input_messages.*`, and its `output.value` replaces the one the shared flow wrote. A response that is an empty object writes no Weave output.
  - The display name replaces `/` with `__` after the provider prefix is added, so `openai/gpt-4o` becomes `openai__gpt-4o`, and a name taken from `metadata.display_name` is changed the same way.

