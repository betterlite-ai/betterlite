id: B7840
title: Python Responses types, the mock response and the response-format class helper
description: >-
  The Python Responses functions (B7841 and B7842) return objects, and `text_format` takes a pydantic class. This task writes
  those pieces in plain Python so the functions only move JSON. It is Python only: no Rust file changes. The wheel depends
  only on python-dotenv, so nothing here imports pydantic or openai. Use B5657's `ResponseObject` base (read it in
  `python/betterlite/types/utils/`) for every class below. It gives item access, `get`, `model_dump`, `__eq__` and extra
  fields kept as attributes.


  Types, in `python/betterlite/types/responses/`. `main.py` follows litellm/types/responses/main.py L1-L173 and
  `__init__.py` has an explicit `__all__`. The classes are `GenericResponseOutputItemContentAnnotation`, `OutputText`,
  `OutputFunctionToolCall` (its `phase` defaults to None), `OutputImageGenerationCall`, `OutputCodeInterpreterCallLog`,
  `OutputCodeInterpreterCall`, `CustomToolCallOutputItem` (`id` and `status` default to None), `GenericResponseOutputItem`,
  `DeleteResponseResult` (with `_hidden_params`, a new dict per object) and the `DecodedResponseId` TypedDict (`total=False`).
  `build_code_interpreter_log_outputs(content)` returns None unless `content` is a dict. It joins `stdout` with `"STDERR: "`
  plus `stderr` and returns one `OutputCodeInterpreterCallLog(type="logs", logs=...)`, or None when the joined text is empty.
  `build_web_search_call(tool_id, tool_input, result, status=None)` returns a plain `ResponseObject` with the OpenAI
  `ResponseFunctionWebSearch` shape. Its `id` is `ws_<tool_id>`, its `type` is `web_search_call`, and its `status` is the
  argument, else "failed" when `result["content"]` is a dict whose `type` is `web_search_tool_result_error`, else "completed".
  Its `action` has `type` "search", `query` (the string from `tool_input["query"]`, "" otherwise), `queries` (`[query]` when
  the query is a non-empty string, else `[]`) and `sources`: one `{"type": "url", "url": ...}` for each item of
  `result["content"]` that is a dict with `type` `web_search_result` and a string `url`. Content that is a string or bytes
  counts as no items.


  The classes litellm/types/llms/openai.py L1339-L1507 define for a Responses result have no other Python owner at this pin,
  and the functions need them, so they are built here in `types/responses/api_response.py`: `ResponseAPIUsage`,
  `WebSearchToolUsage`, `ResponsesToolUsage` and `ResponsesAPIResponse`. `ResponseAPIUsage` has `input_tokens`, `output_tokens`
  and `total_tokens` (ints), the two details fields and `cost`, and a `cost` given as a dict becomes its `total_cost`.
  `ResponsesAPIResponse` keeps every field and default of the source. A `usage` dict becomes a `ResponseAPIUsage`, and a
  `reasoning` value with `model_dump` becomes a dict. `model_dump` drops `status`, `content` and `encrypted_content` when
  they are None, from output items of type `reasoning` only (L1451-L1475). The `output_text` property joins the `text` of every
  `output_text` content item of every `message` output item, for dict items and for object items. `_hidden_params` is a new
  dict per object. `ResponsesAPIStatus` is the `Literal` of L1385.


  `mock_responses_api_response(mock_response=...)` (litellm/responses/main.py L105-L154) goes in `types/responses/mock.py` and
  returns a `ResponsesAPIResponse` built from the same literal dict, with the default text of the source. Copy that literal
  value for value.


  Response-format helper, `python/betterlite/llms/base_llm/base_utils.py`, from litellm/llms/base_llm/base_utils.py
  L140-L212. `_dict_to_response_format_helper(response_format, ref_template=None)` returns the dict unchanged unless
  `ref_template` is set and `type` is "json_schema". Then it deep-copies the dict and rewrites every `$ref` inside
  `json_schema.schema` to `ref_template.format(model=<last path part>)`. The source walks with an explicit stack and a
  visited set of `id()` values, so a shared sub-dict is rewritten once. Keep that. `type_to_response_format_param(response_format,
  ref_template=None)` returns None for None, uses the dict helper for a dict, and for a class calls `model_json_schema` on it.
  The source calls openai's `to_strict_json_schema` when `ref_template` is None and `model_json_schema(ref_template=...)`
  otherwise. The result is `{"type": "json_schema", "json_schema": {"schema": schema, "name": cls.__name__, "strict": True}}`.
  A value that is not a class with a callable `model_json_schema` raises `TypeError(f"Unsupported response_format type -
  {response_format}")`. The class check reads the attribute through a `typing.Protocol`, since pydantic is no dependency of the
  wheel. openai is not one either, and no maintained crates.io or PyPI package outside openai has the function, so port
  `_ensure_strict_json_schema` and `resolve_ref` from openai/lib/_pydantic.py L35-L135 (about 70 lines, listed under
  deviations). The port covers `$defs`, `definitions`, `additionalProperties: false` on objects, `required` set to every
  property, `items`, `anyOf`, a single-entry `allOf` that is merged in, a `None` default that is dropped, and a `$ref` next to
  other keys that is inlined. Write it with plain loops and no recursion helper beyond the function itself.


  Tests build each class from both packages with the same arguments and compare `model_dump()`. The strict-schema test uses a
  pydantic model of its own (pydantic comes with the LiteLLM side of the test environment) with a nested model, a list of
  models, an Optional field with a None default and a field with a description next to a `$ref`.
scope:
  paths:
  - crates/betterlite-python/python/betterlite/types/responses/**
  - crates/betterlite-python/python/betterlite/llms/base_llm/base_utils.py
  - crates/betterlite-python/tests/test_responses_types.py
  - crates/betterlite-python/tests/test_response_format_helper.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/responses/main.py#L1-L173
  why: The output item classes, the two builders, DeleteResponseResult and DecodedResponseId.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L1339-L1507
  why: ResponseAPIUsage, the tool usage classes and ResponsesAPIResponse with its validators and output filter.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L105-L154
  why: The mock response literal.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/base_utils.py#L140-L212
  why: The ref-template helper and the class branch of type_to_response_format_param.
- url: https://github.com/openai/openai-python/blob/main/src/openai/lib/_pydantic.py
  why: The strict schema function that LiteLLM calls and this task ports.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L1036-L1067
