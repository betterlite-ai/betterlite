dod:
- text: Every class and builder in types/responses/main.py builds and dumps as in LiteLLM, including the web search and code interpreter builders.
  proof: [responses-types]
- text: "`ResponsesAPIResponse` and `ResponseAPIUsage` dump, coerce `usage`, `reasoning` and `cost`, filter reasoning nulls and compute `output_text` as in LiteLLM."
  proof: [responses-api-response]
- text: "`mock_responses_api_response` gives the same `model_dump()` as LiteLLM for the default and a custom text."
  proof: [responses-mock]
- text: "`type_to_response_format_param` gives LiteLLM's dict for None, a dict, a dict with a ref template, a class, and a class with a ref template, and refuses anything else with the same message."
  proof: [response-format]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: responses-types
    why: A class default or a builder field differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_types.py -k "output_item or builder or delete_result"
  - id: responses-api-response
    why: A response drops its usage object, keeps reasoning nulls or returns the wrong output_text.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_types.py -k "api_response or usage or output_text"
  - id: responses-mock
    why: The mock literal differs by one value.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_types.py -k mock
  - id: response-format
    why: A pydantic class turns into a different schema, or a ref template is skipped.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_response_format_helper.py
  - id: python-lint
    why: The shared types are where an untyped dict would creep in.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: The classes are not pydantic models, so `model_validate`, `model_fields` and `model_json_schema` are missing on them.
  why: The wheel depends only on python-dotenv. They keep attributes, item access, `model_dump` and the defaults.
- what: "`build_web_search_call` returns a `ResponseObject`, where LiteLLM returns openai's `ResponseFunctionWebSearch`."
  why: The wheel does not depend on the openai package. The dumped dict is the same.
- what: The strict schema function is ported into `base_utils.py` and does not import openai.
  why: openai is not a wheel dependency, no other package carries this function, and it is about 70 lines.
- what: "`type_to_response_format_param` accepts any class with a callable `model_json_schema`, where LiteLLM requires a pydantic `BaseModel` subclass."
  why: The wheel cannot import pydantic. A pydantic model passes either check.
out_of_scope:
- litellm/types/responses/streaming_websocket.py has Protocol classes and `ResponsesWebSocketRequestDefaults` for the proxy websocket relay. No Python user code calls them at the pin, and B943 owns the websocket relay in Rust.
- The Responses event classes and the other types in litellm/types/llms/openai.py are B167. This task builds only the four result classes above, and B167 should import them from `betterlite.types.responses`.
- The None branch and dict branch of the Rust `type_to_response_format_param` are B2202. This file is their Python twin for callers in the wheel.
- '`BaseLiteLLMOpenAIResponseObject` (types/llms/base.py) is B167. `ResponseObject` from B5657 stands in for it.'
pitfalls:
- '`_hidden_params` must be a fresh dict per object, as `PrivateAttr(default_factory=dict)` makes it, and `DeleteResponseResult` has one too.'
- 'The reasoning filter removes a key only when its value is None and its name is `status`, `content` or `encrypted_content`, and only for output items whose `type` is `reasoning`. Other None values stay.'
- 'A `ref_template` rewrite works on a deep copy, so the caller''s dict must stay unchanged after the call.'
- 'The strict-schema rule that unravels `$ref` next to other keys must run again on the merged schema, or the inlined object lacks `additionalProperties: false`.'
- '`output_text` has to read both dict items and object items, since a provider response arrives as dicts and a mock arrives as classes.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
