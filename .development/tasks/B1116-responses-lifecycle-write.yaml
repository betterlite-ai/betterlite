id: B1116
title: Responses delete and cancel SDK calls
description: >-
  Implement adelete_responses, delete_responses, acancel_responses and cancel_responses as complete
  functions in betterlite-core api/responses_lifecycle_write. Preserve both SDK modes over B2417's
  real write transport. B903 decodes response IDs; a nonempty embedded provider and ID override
  explicit arguments. B010 supplies GenericLiteLLMParams, B157 the provider config lookup for
  model=null, B247 logging updates and B185/B186 exception mapping. B198 supplies the imported
  REQUEST_TIMEOUT setting (6000 seconds by default); no new configuration owner is created here.

  Async entry points decode first, mark their own mode flag true, propagate call context into the
  sync entry and await a returned coroutine once. The sync entry pops that flag using identity
  with true. Update logging only after provider/config validation: model=null,
  optional_params={response_id:decoded_id},litellm_params={litellm_call_id:call_id}, provider=resolved.
  local_vars is overlaid by kwargs before logging. Neither operation re-encodes returned IDs.
  extra_query is accepted but dropped; extra_body reaches B2417 and is ignored there. timeout=0
  falls back to REQUEST_TIMEOUT, whereas a negative nonzero value is forwarded to transport.

  Register SdkHttpCall::ResponsesLifecycleWrite in B2401. Python invokes the decorated SDK methods
  with its provider base set to the mock; native uses the production SDK service. Compare provider
  requests and returned/error fields. Pure native tests assert mode/context/logging effects; no
  helper oracle is involved. Resource decoding remains B509 through B2417. The four functions
  contain 234 nonblank/non-comment lines; estimate 220 implementation, 125 tests, 100 fixtures,
  90 adapters and 30 wiring, 565 total under 600.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_lifecycle_write.rs
  - crates/betterlite-core/src/api/responses_lifecycle_write/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/responses_lifecycle_write.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/responses_lifecycle_write.py
  - tools/oracle/cases/sdk-http/responses-lifecycle-write/**
  - tools/oracle/fuzz/corpus/sdk_http_case/responses-lifecycle-write-*
  - Cargo.lock
  - tools/oracle/helpers/b1116.py
  - tools/oracle/helpers/b1116/**
  - tools/oracle/src/helpers/core_ops/b1116.rs
  - tools/oracle/src/helpers/core_ops/b1116/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L1461-L1610
  why: Full delete pair including decorators, encoded-provider precedence and dropped extra_query.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L1928-L2077
  why: Full cancel pair returns the provider response without the retrieve/create ID rewrite.
dod:
- text: >-
    delete_and_cancel_encoded_provider supplies a B903 ID encoding provider=openai,response_id=resp/a,
    with explicit custom_llm_provider=anthropic. Both modes contact the OpenAI mock: DELETE
    /v1/responses/resp%2Fa without a body or POST /v1/responses/resp%2Fa/cancel with {}. Delete returns
    {id:resp_a,object:response,deleted:true}; cancel returns a complete response with id=resp_a,status=cancelled.
    Even with litellm_metadata.model_info.id=deployment_a, both returned IDs remain raw resp_a.
    A raw resp_a with explicit openai also succeeds; empty decoded provider/ID fall back to the arguments.
  proof: [encoded-provider, oracle, python-adapter]
- text: >-
    lifecycle_write_ignored_extras sends extra_query={trace:ignored},extra_body={reason:ignored},
    extra_headers={X-Trace:kept}. The mock sees X-Trace=kept, no trace query, no DELETE body and {}
    for cancel. Native capture observes timeout=null and 0 become 6000 with default settings;
    injected REQUEST_TIMEOUT=17 changes both to 17, while timeout=7 remains 7. The configuration
    loader/default/invalid-number contract is B198's existing test, not a second environment read.
  proof: [extras-timeout, oracle, python-adapter]
- text: >-
    lifecycle_write_rejections sends raw resp_a without a provider: no HTTP request and source
    ValueError "custom_llm_provider is required but passed as None". Provider=anthropic with no
    Responses config similarly emits "DELETE responses is not supported for anthropic" or
    "CANCEL responses is not supported for anthropic". B185/B186 map these to APIConnectionError,
    status=500,type=null,param=null,code=null at the SDK boundary. Assert the source message in
    the typed cause; the public message uses the shared redacted wording deviation. Mock HTTP
    404 {error:{message:gone,type:invalid_request_error,param:response_id,code:not_found}} remains
    status=404,class=NotFoundError,type=null,param=null,code=null because the mapper does not pass
    the upstream body into that exception. There is one request, not a successful deletion.
  proof: [rejections, oracle, python-adapter]
- text: >-
    lifecycle_write_context records call_id=call-a through async-to-sync handoff and logging.
    True selects async; 1 and "true" do not satisfy the identity check in the sync methods.
    Provider/config rejection occurs before update_from_kwargs. Successful calls log decoded ID,
    null model and only litellm_call_id in the logging parameter map; cancel has no follow-up GET.
  proof: [context]
- text: New lifecycle-write cases seed B2401's typed decoder and exercise both public SDK variants.
  proof: [sdk-corpus, oracle, python-adapter]
checks:
  optional: []
  commands:
  - id: encoded-provider
    why: explicit provider wins over an encoded ID or cancelled response IDs are rewritten
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_write::tests::delete_and_cancel_encoded_provider($|::)/)'
  - id: extras-timeout
    why: ignored extras leak upstream or zero timeout bypasses the shared default
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_write::tests::lifecycle_write_ignored_extras($|::)/)'
  - id: rejections
    why: unsupported writes reach HTTP or change normalized error facts
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_write::tests::lifecycle_write_rejections($|::)/)'
  - id: context
    why: async context, logging order or exact-boolean dispatch is lost
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_lifecycle_write::tests::lifecycle_write_context($|::)/)'
  - id: python-adapter
    why: the SDK write driver is missing or replaces real requests with fixtures
    run: test -f tools/oracle/sdk_http/responses_lifecycle_write.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: write SDK input has no new replay seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/responses-lifecycle-write-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/responses-lifecycle-write/delete-and-cancel-encoded-provider.yaml
- tools/oracle/cases/sdk-http/responses-lifecycle-write/lifecycle-write-ignored-extras.yaml
- tools/oracle/cases/sdk-http/responses-lifecycle-write/lifecycle-write-rejections.yaml
deviations:
- what: Local SDK failure messages use bounded shared error wording instead of Python tracebacks; status=500 and exception classification remain APIConnectionError.
  why: B184/B187 require redacted client diagnostics; retain the exact source message as a typed cause for tests.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2692-L2709
out_of_scope:
- B933 owns retrieve/input-items and B934 compact; B1078 owns create, B932 async create and B931 shared selection helpers.
- B955 owns MCP/file-search dispatch, B943 websocket SDK functions and B938 proxy lifecycle routes in their separate files.
- B2417 owns actual delete/cancel sends and B509 their provider transformations.
pitfalls:
- Cancel returns a provider response directly; the proxy polling route's re-read belongs to B938, not this SDK call.
- An embedded provider wins even when the caller explicitly supplied a different provider.
- extra_query disappears before the HTTP handler and extra_body disappears inside it.
review_level: security
budget:
  max_changed_lines: 600
  max_new_expects: 0
