dod:
  - text: >-
      `open_async` connects a `Direct` and a `Url` record to the host, port, db,
      username and password they carry, with defaults `localhost`, 6379 and db 0.
      A server that never answers fails at the configured response timeout. No
      `socket_timeout` gives 5 seconds, not redis-rs's 500 ms. A negative or NaN
      timeout and a port above 65535 return `InvalidSetting` without a panic. A
      dropped connection reconnects on the next command, and `max_connections`
      reaches the concurrency limit.
    proof: [standalone-tests]
  - text: >-
      `open_async` connects a `Cluster` record through two fake nodes, routes keys
      to the node owning their slot, returns MGET values in input order across
      slots, and keeps response and connection timeouts. `read_from_replicas`
      passthrough reaches the builder.
    proof: [cluster-tests]
  - text: >-
      `resolve_master` skips a dead monitor and a nil answer, and returns
      `NoSentinelMaster` when no monitor knows the service. A monitor sees
      `monitor_password` and never the injected credential. After a dropped
      connection or a READONLY reply, the next command asks the monitors again and
      lands on the new master. A monitor that never answers is bounded by the
      timeouts.
    proof: [sentinel-tests]
  - text: >-
      A real TLS handshake succeeds against the fake with `ssl_ca_certs`, fails
      against an untrusted certificate, and succeeds with `ssl_cert_reqs` none.
      `ssl_check_hostname` false accepts a certificate for another name. The same
      keys work in a `rediss` URL query. A client certificate reaches the server. A
      missing file gives `TlsFile`. An unmapped passthrough key logs its name once.
    proof: [tls-tests]
  - text: >-
      An injected source's token is the AUTH sent at connect, for Standalone,
      Cluster and Sentinel data nodes. A new token is sent on the open connection
      after `refresh_after`. A source with no username sends `default`. A server
      answering the wrong-number-of-arguments error gets `AUTH <token>` alone. A
      record that needs a source and has none fails with `CredentialSourceMissing`.
    proof: [credentials-tests]
  - text: >-
      Every `AsyncRedisCommands` method sends the expected command and maps the
      reply: PING to a bool, DEL, TTL and RPUSH to integers, EXPIRE to a bool, LPOP
      with and without a count, EVAL with numkeys. `RedisScalar` text, bytes and
      float arguments arrive unchanged.
    proof: [commands-tests]
  - text: >-
      `pipeline(true)` sends MULTI and EXEC. `pipeline(false)` sends no MULTI.
      `execute` returns the first error. `execute_settled` keeps one result per
      command with failures in place. On Cluster with `transaction` false, commands
      across slots all run and replies keep command order.
    proof: [pipeline-tests]
  - text: >-
      `blocking_endpoint` returns usable clients with the same timeouts as
      `open_async`, fetches the credential at call time so two calls can carry two
      tokens, and returns the resolved master as `LiveTarget::Standalone` for a
      `Sentinel` record.
    proof: [endpoint-tests]
  - text: >-
      No `LiveClientError` display or debug text and no log line holds a URL with
      its password, a password, a token or a passthrough value. This holds for
      failures at parse, connect, AUTH and TLS.
    proof: [secrets-tests]

checks:
  optional: []
  commands:
    - id: standalone-tests
      why: Standalone connect, defaults, timeout conversion or reconnect is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::standalone::/)'
    - id: cluster-tests
      why: Cluster connect, slot routing or cross-slot MGET is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::cluster::/)'
    - id: sentinel-tests
      why: Monitor walk, monitor auth or failover after a lost master is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::sentinel::/)'
    - id: tls-tests
      why: A real handshake or a mapped TLS key is missing, or the rustls provider panics
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::tls::/)'
    - id: credentials-tests
      why: Token AUTH, refresh, the default username or the missing source error is absent
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::credentials::/)'
    - id: commands-tests
      why: An AsyncRedisCommands method sends the wrong command or maps the reply wrongly
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::commands::/)'
    - id: pipeline-tests
      why: Transaction wrapping, settled results or the Cluster per-command path is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::pipeline::/)'
    - id: endpoint-tests
      why: The blocking endpoint for sync and pubsub callers is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::endpoint::/)'
    - id: secrets-tests
      why: A secret reaches an error text or a log line
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_live_client::tests::secrets::/)'

oracle_cases: []

deviations:
  - what: >-
      One multiplexed connection replaces redis-py's BlockingConnectionPool, and
      Cluster keeps one per node. `max_connections` caps commands in flight rather
      than sockets, `CLIENT LIST` shows one connection, and a command waiting for a
      slot ends in a response timeout rather than "No connection available" after
      `REDIS_CONNECTION_POOL_TIMEOUT`. With no limit configured, 1024 commands may be
      in flight.
    why: redis-rs pipelines commands over a shared connection and has no blocking pool.
  - what: A connection with no `socket_timeout` times out after 5 seconds. redis-py waits forever.
    why: The bounded-inputs rule requires a timeout on every outbound call.
  - what: >-
      `health_check_interval` has no effect, including the value LiteLLM defaults
      for Cluster.
    why: redis-rs has no periodic check. Response timeouts and TCP keepalive find a dead connection.
  - what: >-
      Passthrough keys other than `ssl_ca_certs`, `ssl_certfile`, `ssl_keyfile`,
      `ssl_cert_reqs`, `ssl_check_hostname` and `read_from_replicas` log a warning
      with the key's name and have no effect.
    why: The others are redis-py constructor options with no redis-rs equivalent.
  - what: >-
      Cluster node failures follow redis-rs's recovery, so the `IsolationConfig`
      values from B4323 have no effect. A dead node still fails only the commands
      routed to it.
    why: The driver owns its node connections and slot refresh, and exposes no per-node state to drive.
  - what: >-
      A record with `credential_provider_settings` fails at open with a typed error
      until a `RedisCredentialSource` is injected.
    why: No production token fetcher exists yet, and connecting without AUTH would hide the problem.
  - what: >-
      The GCP connect function's fallback to the static password after a
      wrong-number-of-arguments reply is not built.
    why: GCP sends one-argument AUTH, and Redis doesn't answer that form with this error.

out_of_scope:
  - Client reuse, cache keys, sync connections and pubsub clients; B4325 owns them on top of this module.
  - Redis config records and client selection (`get_redis_client`, `get_redis_async_client`, `get_redis_connection_pool`, `init_redis_cluster`, `_init_redis_sentinel`, `_init_async_redis_sentinel`, `_get_redis_sentinel_connection_kwargs`, `_sentinel_auth_kwargs`, `_credential_provider_auth_kwargs`, `_credential_provider_from_connect_func`); B4323 built their record side, and this task only opens the records.
  - Settings resolution, env lookups and URL handling in `litellm/_redis.py`; B4321 owns them.
  - Cloud token providers and connect functions in `litellm/_redis.py`; B4320 owns their logic, and this task only consumes a credential through `RedisCredentialSource`.
  - Circuit breaking and failure logging around commands; B393 owns them.

pitfalls:
  - >-
    rustls panics at `ClientConfig::builder()` when both crypto providers are
    enabled and none is installed, and `ring` is already in Cargo.lock. Keep the
    workspace's aws-lc-rs setting, run `cargo tree -p betterlite-redis -e features
    -i ring`, and treat the `tls` group as the proof that the handshake runs.
  - >-
    `ConnectionManager` reconnects to the same address, so it can't follow a
    Sentinel failover. That is why `Sentinel` has its own variant.
  - Never hold the `SentinelConnection` mutex across `.await`, and never use `tokio::sync::Mutex` to get around that.
  - A hand-built fake must answer the `CLIENT SETINFO` commands redis-rs pipelines at connect, or every test hangs until the timeout.
  - >-
    `redis::parse_redis_value` reads a full frame, so the fake needs no RESP parser
    of its own. Replies are plain RESP2 text.
  - Keep each file under 300 lines. `redis_live_client.rs` holds the types and `query`; `connection_info`, `tls`, `credentials`, `open`, `sentinel`, `commands` and `pipeline` are separate files.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
