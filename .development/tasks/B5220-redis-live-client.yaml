id: B5220
title: Open live Redis, Sentinel and Cluster connections
description: >-
  No betterlite code talks to a Redis server yet. B4323 stopped at config
  records: `redis_client_factories::RedisClient` (variants `Direct`, `Url`,
  `Sentinel`, `Cluster`) and `redis_client_factories::pool::PoolConfig`. The
  trait `cache_primitives::protocol::AsyncRedisCommands` has no implementer.
  This task adds the module `redis_live_client` to betterlite-redis. It turns
  those records into live connections with the `redis` crate (redis-rs) and
  implements the trait. B4325 caches what this module opens, and B4326 to B4331
  and B4144 send their commands through it.

  Dependencies. Add `redis` to `[workspace.dependencies]` and to
  `crates/betterlite-redis/Cargo.toml` with `default-features = false` and the
  features `tokio-rustls-comp`, `tls-rustls-insecure`, `cluster-async`,
  `connection-manager` and `token-based-authentication`. Take the newest release
  at least 7 days old; this text was written against 1.7.0. The `sentinel`
  feature stays off (see Sentinel below). The crate's normal dependencies also
  gain `tokio` with `rt` and `time`, `tracing`, `socket2` and `futures-util`, all
  from the versions already in Cargo.lock. Dev dependencies gain `rcgen`,
  `tokio-rustls`, `rustls`, and `tokio` with `net`, `io-util` and `time`.

  Public API, all in `redis_live_client`:
  `LiveClientFactory::new(credentials: Option<Arc<dyn RedisCredentialSource>>)`;
  `async fn open_async(&self, client: &RedisClient, pool: Option<&PoolConfig>) ->
  Result<LiveAsyncClient, LiveClientError>`;
  `fn blocking_endpoint(&self, client: &RedisClient) -> Result<LiveEndpoint,
  LiveClientError>`. `LiveAsyncClient` is a public `Clone` enum with the variants
  `Standalone(redis::aio::ConnectionManager)`,
  `Cluster(redis::cluster_async::ClusterConnection)` and
  `Sentinel(SentinelConnection)`, so callers can test the kind with `matches!`.
  `LiveAsyncClient::query<T: redis::FromRedisValue>(&self, command: &redis::Cmd)
  -> Result<T, LiveClientError>` is the one place that sends a command, because
  the trait covers only a few of the commands later tasks need.
  `LiveEndpoint { target: LiveTarget, connect_timeout: Duration, response_timeout:
  Duration }` has public fields, and `LiveTarget` is `Standalone(redis::Client)`
  or `Cluster(redis::cluster::ClusterClient)`. `blocking_endpoint` is for sync
  call sites and for pubsub in B4325: it blocks on file reads, the credential
  fetch and the Sentinel lookup, and it puts a freshly fetched credential into the
  connection info. `open_async` runs the same file reads and lookup through an
  awaited `tokio::task::spawn_blocking`, never directly on the async thread.

  Connection info. For `Direct` and the Sentinel `connection_kwargs`, build
  `redis::ConnectionInfo` from `ConnectionFields`: host `localhost` when absent,
  port 6379 when absent, db 0 when absent, plus username and password. For `Url`,
  parse the secret URL with `redis::IntoConnectionInfo`, then apply the record's
  `username`. Convert ports with `u16::try_from` and limits with
  `usize::try_from`, and return `LiveClientError::InvalidSetting { field }` on
  failure. `socket_keepalive: Some(true)` becomes
  `redis::io::tcp::TcpSettings::set_keepalive(socket2::TcpKeepalive::new())`.

  Timeouts. Always set both timeouts by hand, since redis-rs defaults to a 500 ms
  response timeout and a 1 s connection timeout (client.rs L180-L182). The
  response timeout is `socket_timeout`. The connection timeout is
  `socket_connect_timeout`, then `socket_timeout`. Either one absent falls to 5
  seconds. Convert with `Duration::try_from_secs_f64` and return
  `InvalidSetting` on a negative or NaN value, because `Duration::from_secs_f64`
  panics on those.

  Standalone. `Direct` and `Url` open
  `redis::Client::get_connection_manager_with_config` with
  `ConnectionManagerConfig`, setting the two timeouts, a concurrency limit and the
  credentials provider. The concurrency limit is `PoolConfig.max_connections`, then
  the record's `max_connections`, then 1024.

  Cluster. Build `redis::cluster::ClusterClientBuilder` from
  `ClusterClient.startup_nodes` with username, password, TLS, `connection_timeout`,
  `response_timeout`, `tcp_settings`, `connection_concurrency_limit` and
  `set_credentials_provider`, and call `read_from_replicas()` when the passthrough
  key is true. Open it with `get_async_connection`. The driver splits MGET per
  slot, follows MOVED and ASK and keeps one connection per node. Ignore
  `ClusterClient.isolation`: the state
  machine from B4322 was built for redis-py's node objects and the driver does
  this recovery itself.

  Sentinel. redis-rs's Sentinel client has no timeout on its sync lookup, so the
  file `redis_live_client/sentinel.rs` does the lookup itself, once, for both
  paths. `resolve_master` walks `SentinelClient.sentinel_nodes` in order, connects
  with `Client::get_connection_with_timeout`, sets read and write timeouts, sends
  `SENTINEL GET-MASTER-ADDR-BY-NAME <service_name>`, and takes the first non-nil
  answer. A monitor that fails or answers nil logs a warning with its host and
  port, and the walk moves on. No answer gives
  `LiveClientError::NoSentinelMaster { service_name }`. Monitors get the username
  and TLS from `connection_kwargs` and `monitor_password` as their password, and
  never the credential source: a data node's token must not reach a monitor.
  `SentinelConnection` holds the record and an
  `Arc<std::sync::Mutex<Option<redis::aio::MultiplexedConnection>>>`. Clone the
  connection out and release the lock before any `.await`. When the slot is empty,
  resolve the master and open a multiplexed connection with
  `get_multiplexed_async_connection_with_config`. When a command fails with
  `is_connection_dropped()` or a READONLY server error, clear the slot and return
  the error, so the next command resolves the master again. `blocking_endpoint`
  returns a `Sentinel` record as `LiveTarget::Standalone` for the resolved master.

  Credentials. Add `RedisCredentials { username: Option<String>, password:
  SecretString }` and `trait RedisCredentialSource: Send + Sync + 'static { fn
  fetch(&self) -> Result<RedisCredentials, RedisCredentialError>; fn
  refresh_after(&self) -> Duration; }`. The trait is sync because the B4320
  providers are sync. An adapter implements `redis::StreamingCredentialsProvider`
  with `futures_util::stream::unfold`: the first item comes at once, each later
  item comes after `tokio::time::sleep(refresh_after)`, and every fetch runs in an
  awaited `spawn_blocking`. `redis::BasicAuth::new` needs a username, so a source
  without one sends `default`, since `AUTH "" <token>` is invalid. Any record with
  `credential_provider: true` or `credential_provider_settings: Some(_)` needs a
  source; without one, open fails with
  `LiveClientError::CredentialSourceMissing`.

  TLS. `ssl: Some(true)` or a `rediss` URL turns TLS on. Read these passthrough
  keys, and for `Url` the same names in the URL query: `ssl_ca_certs` (read the
  file into `TlsCertificates.root_cert`), `ssl_certfile` with `ssl_keyfile` (read
  both into `TlsCertificates.client_tls`), `ssl_cert_reqs` equal to `none`
  (`ConnectionAddr::TcpTls { insecure: true, .. }`), and `ssl_check_hostname` equal
  to false (`set_danger_accept_invalid_hostnames`). Use `Client::build_with_tls`
  when certificates are present. A file that can't be read gives
  `LiveClientError::TlsFile { key }`. Any other passthrough key logs one warning
  with the key's name, never its value, and has no effect.

  Commands. Implement `AsyncRedisCommands` for `LiveAsyncClient` with `type Error =
  LiveClientError`, `type Reply = redis::Value` and `type Pipeline = LivePipeline`.
  `RedisScalar::Text`, `Bytes` and `Float` become command arguments as they are.
  `LivePipeline` has the public field `commands: redis::Pipeline`, so callers use
  the crate's own builder. `pipeline(true)` calls `.atomic()`. `async fn
  execute(self) -> Result<Vec<redis::Value>, LiveClientError>` matches redis-py's
  `pipe.execute()`. `async fn execute_settled(self) ->
  Result<Vec<Result<redis::Value, LiveClientError>>, LiveClientError>` matches
  `pipe.execute(raise_on_error=False)` from redis_batch.py and uses
  `Pipeline::ignore_errors`. On a `Cluster` client with `transaction` false, run
  every command on its own with `futures_util::future::join_all` over the commands
  from `Pipeline::cmd_iter`, keep reply order, and let `execute` return the first
  error after all commands finish. redis-rs refuses a cross-slot cluster pipeline
  while redis-py splits it per node. A cluster pipeline with `transaction` true
  goes through `query_async` unchanged, because its one caller uses a single key.

  Errors. `LiveClientError` is a `thiserror` enum owned by this module. Its
  variants are `Redis(#[from] redis::RedisError)`, `InvalidSetting { field:
  &'static str }`, `CredentialSourceMissing`, `Credential(RedisCredentialError)`,
  `TlsFile { key: &'static str }`, `NoSentinelMaster { service_name: String }` and
  `Join(#[from] tokio::task::JoinError)`. Call `expose_secret` only at the call
  that hands the value to redis-rs.

  Tests. CI has no Redis service and the worker sandbox has no Docker, so every
  test talks to an in-process fake on a `tokio::net::TcpListener`. Declare
  `#[cfg(test)] pub(crate) mod tests;` and put the fake in
  `redis_live_client/tests/fake_server.rs` as `pub(crate)`, because B4325 reuses it
  at `crate::redis_live_client::tests::fake_server`. It replies from a script keyed
  by command name, records every command and every accepted connection, and has
  built-in answers for `CLIENT SETINFO`, `AUTH`, `SELECT`, `PING`, `CLUSTER SLOTS`
  and `SENTINEL GET-MASTER-ADDR-BY-NAME`. It can run as two listeners for Cluster
  and can wrap its listener in `tokio_rustls::TlsAcceptor` with an `rcgen`
  certificate. Each test group below is a file under `redis_live_client/tests/`, so
  test paths read `redis_live_client::tests::<group>::<name>`.

scope:
  paths:
    - crates/betterlite-redis/src/redis_live_client.rs
    - crates/betterlite-redis/src/redis_live_client/**
  lint_tables: false

