dod:
  - text: 'Cases flag_absent_or_false_allows_authenticated_search, cached_truthy_flag_consumed,
      admin_and_viewer_bypass_scope, any_membership_role_scopes_all_orgs, memberships_precede_query_team,
      user_value_error_falls_back_to_team, other_user_error_propagates, query_team_before_key_team,
      empty_query_team_uses_key_team, four_exact_scope_forbidden_details, team_http_error_maps_to_not_found,
      missing_database_before_scope, no_match_empty_array, contains_insensitive_and_combined_or,
      empty_search_no_predicate, page_defaults_bounds_and_offset, created_desc_without_tiebreaker,
      response_only_id_and_nullable_email, outage_chain_503 and other_exception_500 cover the owned branches.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Postgres fixtures prove stored UI-setting consumption, organization-membership predicates, paging and error order.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_search_scope::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Real stored settings or membership filters produce the wrong search result or error.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_search_scope::tests::postgres_/)'
