id: B1203
title: Organization-scoped UI user search
description: >-
  Implement GET /user/filter/ui and reusable organization-enrollment/search scope helpers. Preserve scope_user_search_to_org=false
  and caller/team organization boundaries; the supplied organization filter is intersected with caller
  authority before querying.


  Build the production user_search_scope module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _resolve_org_filter_for_user_search (L2653-L2716; 52 source lines), _resolve_team_org_filter (L2719-L2754;
  33 source lines), ui_view_users (L2766-L2860; 77 source lines), _user_search_where (L2205-L2215; 11
  source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): scope_user_search_to_org=False.


  general_settings.scope_user_search_to_org=false; invalid/missing organization context follows the pinned
  branch, not an unfiltered search.


  Register these actual HTTP routes and aliases exactly once: GET /user/filter/ui -> ui_view_users. For
  each route send a typed successful request, an invalid or missing target, and a caller lacking that
  route permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::user_search_scope::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 173 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  173 production, 142 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 430 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
