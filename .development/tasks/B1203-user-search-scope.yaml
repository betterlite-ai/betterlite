id: B1203
title: Organization-scoped UI user search
description: >-
  Register GET /user/filter/ui once, authenticated by B052 and hidden from the API schema. Its optional
  user_id, user_email, search and team_id query parameters default None; page defaults 1 with minimum 1,
  and page_size defaults 50 with range 1..100. There is no organization-filter query parameter. This is
  case-insensitive substring search, not an email-prefix lookup. Own the three-line LiteLLM_UserTableFiltered
  projection at _types.py L3789-L3791 below B124: output only user_id and user_email (default null), never
  other columns or a pagination envelope.

  Call B066 get_ui_settings_cached and read scope_user_search_to_org with default false. This is stored
  in litellm_uisettings, row id ui_settings, not general_settings or a dedicated environment variable.
  B066 owns cache key ui_settings:settings_dict, TTL 600, stored-JSON decoding and allowed-field filtering.
  A falsey value permits any authenticated caller to search all users. A truthy value first permits B2314
  admin-view roles proxy_admin and proxy_admin_viewer without scoping. Otherwise fetch a non-null caller
  user_id through B736 with user_id_upsert=false, swallowing only ValueError. Collect ALL organization
  memberships in their existing order, regardless of role or duplicates. A nonempty list takes precedence
  over the supplied team. With no memberships, choose truthy query team_id before the key's team_id; if
  the result is non-null resolve it through B737. Do not infer a team from the requested user/email.

  Every HTTPException from team lookup becomes 403 with detail.error scope_user_search_to_org is enabled
  but team '<id>' was not found. Other lookup errors propagate. Then require B800 is_team_admin; false
  gives 403 with scope_user_search_to_org is enabled. You must be an admin of this team to search users.
  A truthy team.organization_id becomes the single filter ID. Otherwise return 403 with
  scope_user_search_to_org is enabled and this team is not part of an organization. Contact your proxy
  admin to adjust this setting. With no caller organizations or resolved team, return 403 with
  scope_user_search_to_org is enabled. Only proxy admins, organization admins, or team admins can search
  users. Keep this last message even though ordinary organization members pass the actual membership check.

  Reject a missing database before the try block with HTTPException 500 and detail.error No db connected.
  Inside the try block, scope first, then compute skip=(page-1)*page_size. Truthy user_id and user_email
  each add an insensitive contains condition, combined with AND. Truthy search adds an OR of those same
  two contains predicates, ANDed with the individual filters. Empty strings add nothing. A non-null org
  list adds organization_memberships.some.organization_id.in. Drop None-valued predicates and call B790's
  user-table accessor once with take=page_size and created_at descending, without a tiebreaker or count.
  No rows returns []; populated rows validate through the two-field response projection.

  The route's own except HTTPException rethrows unchanged. Its other except branch asks B1217 to classify
  the complete error chain: database unavailability warns Database unavailable during user search: <class>
  and raises the shared 503 ProxyException, type no_db_connection, param string "None", code 503, with
  the pinned transient retry or permanent-deployment message. Other failures log Error searching users
  and raise HTTPException 500 with string detail Error searching users: <exception>. This route never
  calls handle_exception_on_proxy. HTTPException branches set no type/param/code themselves; compare the
  booted B003 handler's full wire body rather than inventing an auth error envelope.


  Build the production user_search_scope module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _resolve_org_filter_for_user_search (L2653-L2716; 52 source lines), _resolve_team_org_filter (L2719-L2754;
  33 source lines), ui_view_users (L2766-L2860; 77 source lines), _user_search_where (L2205-L2215; 11
  source lines).


  B001 HTTP cases run this route through the actual authenticated proxy. Seed B066's persisted UI settings
  and cache state, then prove absent/false/true flag behavior and cached-setting consumption. Missing bearer
  exercises B052's rejection; an unrelated authenticated user is allowed when the flag is off. An unknown
  searched user produces [] rather than an invalid-target error. No cookies, redirects or changed-by header
  are read or set by this GET. Compare response field omissions, null email, status, error body and content type.


  Use POSTGRES_TEST_URL when supplied, otherwise testcontainers via betterlite-postgres-fixture. Native
  Postgres tests inspect the actual predicates, page offsets and response redaction, plus failures from UI
  settings/cache/user/team loading and user queries. An unavailable selected fixture fails the test. The
  flag's stored-data and cache boundary belongs to B066, so do not add a fake config-loader acceptance test.


  Sizing starts with 173 helper/route lines before docstring exclusion and the response projection:
  allow 210 production, 380 behavior/Postgres tests and 100 HTTP integration/wiring lines, totaling 690
  within 750. B003 parses query parameters; B066 decodes stored settings. Neither decoder is duplicated.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
