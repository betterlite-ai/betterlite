id: B379
title: Automatic router validation and availability endpoints
description: 'Implement POST /auto_router/validate_complexity_router_config and /auto_router/availability
  with typed responses, B343 access checks and immutable B329 config parsing. Resolve saved-router ownership
  without registering live routers. Retain placement/ownership checks and return unlimited capability/tuning
  allowances as the accepted product deviation. Implement the owned native service in crates/betterlite-server/src/router_preview_validation.rs.
  Add ProbeOperation::RouterPreviewValidation in tools/oracle/src/router_probes/mod.rs and the corresponding B379 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/proxy/management_endpoints/auto_router_endpoints.py:
  _authorize_router_dry_run (L211-L257), _authorize_member_dry_run_config (L260-L283), _models_this_test_can_call
  (L286-L302), _authorize_models_this_test_can_call (L305-L351), validate_complexity_router_config (L361-L387),
  get_auto_router_availability (L395-L435). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Function coverage in litellm/proxy/management_helpers/auto_router_availability.py: _catalog_field (L47-L50),
  build_auto_router_catalog (L53-L80), auto_router_availability (L83-L148). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. Bound the preview_config outside-byte parser to 1048576 bytes before decoding;
  on excess use its typed invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback
  path).'
