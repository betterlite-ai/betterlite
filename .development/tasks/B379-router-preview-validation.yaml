dod:
- text: Write tests named router_preview_validation_behaviors and router_preview_validation_boundaries under router_preview_validation::tests. The
    first asserts the listed successful and warning/fallback outcomes; the second asserts error fields,
    bounds, cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay
    cannot satisfy either check.
  proof:
  - router-preview-validation-behaviors
  - router-preview-validation-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-server/fuzz/corpus/preview_config/router-preview-validation-valid.json and crates/betterlite-server/fuzz/corpus/preview_config/router-preview-validation-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target preview_config and normal replays_the_preview_config_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - router-preview-validation-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: router-preview-validation-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::router_preview_validation_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: router-preview-validation-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::router_preview_validation_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/router_preview_validation.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/router_preview_validation.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-server/fuzz/corpus/preview_config/router-preview-validation-valid.json && test -f crates/betterlite-server/fuzz/corpus/preview_config/router-preview-validation-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/preview_config
      | grep -Fq "/router-preview-validation-" && test -f crates/betterlite-server/fuzz/fuzz_targets/preview_config.rs && cargo
      nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_preview_config_corpus)'
