  - id: config-global-amazon-nova-api-key
    why: amazon_nova_api_key lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_nova_chat_config_cases::case_[0-9]+_loads_global_amazon_nova_api_key$/)'
