checks:
  optional:
  - mutants
  commands:
  - id: case-nova-inline-cache-points
    why: Process blocks in order. A block is a standalone point only when cachePoint is not None and it is the sole
      key. Remove such a point and attach its value to the nearest prior block containing text, searching across
      intervening images/toolUse/toolResult; no prior text means discard the point. Later points overwrite an existing
      cachePoint on that anchor. Mixed-key blocks and cachePoint=None remain unchanged. Apply to system and each
      message content independently; reconstruct message records with only required role/content, dropping extra
      message fields.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_nova_inline_cache_points$/)'
  - id: case-nova-filter-allowed-fields
    why: Run B604 Converse transformation on the copied options, then inline cache points, remove system only when
      it is an empty list, and retain exactly messages,inferenceConfig,system,toolConfig,guardrailConfig. Drop additionalModelRequestFields,performanceConfig,requestMetadata,outputConfig
      and every other top-level key without a warning. Missing system/messages become empty lists during inlining;
      system is then removed but messages remains [].
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_nova_filter_allowed_fields$/)'
  - id: case-nova-tool-config-injection
    why: Copy optional_params. If cache_control_injection_points is None or fails validation as a tuple of mapping
