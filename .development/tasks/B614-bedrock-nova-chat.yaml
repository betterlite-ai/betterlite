checks:
  optional:
  - mutants
  commands:
  - id: case-nova-inline-cache-points
    why: The nova-inline-cache-points behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_nova_inline_cache_points$/)'
  - id: case-nova-filter-allowed-fields
    why: The nova-filter-allowed-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_nova_filter_allowed_fields$/)'
  - id: case-nova-tool-config-injection
    why: The nova-tool-config-injection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_nova_tool_config_injection$/)'
  - id: case-empty-system-removed
    why: The empty-system-removed behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_empty_system_removed$/)'
  - id: case-nova-response-output
    why: The nova-response-output behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_nova_response_output$/)'
  - id: case-direct-nova-endpoint
    why: The direct-nova-endpoint behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::nova_chat_cases::case_[0-9]+_direct_nova_endpoint$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_nova_chat.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_nova_chat*")"
      && grep -lq 'bedrock_nova_chat' tools/oracle/fuzz/corpus/helper_case/bedrock_nova_chat* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_nova_chat$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-amazon-nova-api-base
    why: The AMAZON_NOVA_API_BASE setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_nova_chat_config_cases::case_[0-9]+_loads_amazon_nova_api_base$/)'
      && grep -lq 'AMAZON_NOVA_API_BASE' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_nova_chat*
  - id: config-amazon-nova-api-key
    why: The AMAZON_NOVA_API_KEY setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_nova_chat_config_cases::case_[0-9]+_loads_amazon_nova_api_key$/)'
      && grep -lq 'AMAZON_NOVA_API_KEY' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_nova_chat*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_nova_chat_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_nova_chat*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
