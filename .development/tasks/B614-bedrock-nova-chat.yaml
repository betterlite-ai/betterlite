id: B614
title: Bedrock and direct Amazon Nova chat
description: >-
  Add Nova Invoke and direct Amazon Nova configuration using existing Converse wire blocks. Preserve inline cache
  points, allowed fields, empty-system removal and protection against toolConfig injection. Direct Nova auth/base
  configuration remains operator supplied and uses the existing OpenAI-compatible transport path. Direct Nova base
  precedence is explicit api_base, AMAZON_NOVA_API_BASE, then https://api.nova.amazon.com/v1; key precedence is
  explicit api_key, litellm.amazon_nova_api_key, AMAZON_NOVA_API_KEY, then litellm.api_key.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_nova_transformation.py:
  _without_tool_config_injection_points L37-L51; _system_block_with_cache_point L54-L55; _content_block_with_cache_point
  L58-L59; _inline_block_cache_points L62-L75; AmazonInvokeNovaConfig.__init__ L83-L84; AmazonInvokeNovaConfig.get_supported_openai_params
  L86-L87; AmazonInvokeNovaConfig.map_openai_params L89-L96; AmazonInvokeNovaConfig.transform_request L98-L119;
  AmazonInvokeNovaConfig.transform_response L121-L148; AmazonInvokeNovaConfig._inline_cache_points L151-L166; AmazonInvokeNovaConfig._filter_allowed_fields
  L168-L173; AmazonInvokeNovaConfig._remove_empty_system_messages L175-L183. litellm/llms/amazon_nova/chat/transformation.py:
  AmazonNovaChatConfig.__init__ L32-L44; AmazonNovaChatConfig.custom_llm_provider L47-L48; AmazonNovaChatConfig.get_config
  L51-L52; AmazonNovaChatConfig._get_openai_compatible_provider_info L54-L62; AmazonNovaChatConfig.get_supported_openai_params
  L64-L77; AmazonNovaChatConfig.transform_response L79-L110.


  Named case contracts: nova_inline_cache_points: Process blocks in order. A block is a standalone point only when
  cachePoint is not None and it is the sole key. Remove such a point and attach its value to the nearest prior block
  containing text, searching across intervening images/toolUse/toolResult; no prior text means discard the point.
  Later points overwrite an existing cachePoint on that anchor. Mixed-key blocks and cachePoint=None remain unchanged.
  Apply to system and each message content independently; reconstruct message records with only required role/content,
  dropping extra message fields. nova_filter_allowed_fields: Run B604 Converse transformation on the copied options,
  then inline cache points, remove system only when it is an empty list, and retain exactly messages,inferenceConfig,system,toolConfig,guardrailConfig.
  Drop additionalModelRequestFields,performanceConfig,requestMetadata,outputConfig and every other top-level key
  without a warning. Missing system/messages become empty lists during inlining; system is then removed but messages
  remains []. nova_tool_config_injection: Copy optional_params. If cache_control_injection_points is None or fails
  validation as a tuple of mapping records, preserve it unchanged. On successful validation of a list or tuple,
  remove points whose location equals tool_config, preserve all other points and their fields/order, and write a
  list even if empty. Perform this before B604 so unsupported tool caching is never credited in gateway attribution.
  direct_nova_endpoint: Direct Nova reports provider amazon_nova. Resolve base by truthy explicit api_base, B129
  get_secret_str(AMAZON_NOVA_API_BASE), then https://api.nova.amazon.com/v1; do not trim its slash here. Resolve
  key by truthy explicit api_key, litellm.amazon_nova_api_key, B129 get_secret_str(AMAZON_NOVA_API_KEY), then litellm.api_key.
  Global key settings are used as values, not resolved a second time. Missing keys yield None without an error in
  this helper. nova_converse_delegation: Bedrock Nova initializes B2205, takes supported options from B600 and mapping
  from B602, and delegates the entire buffered response to B607 with all original arguments including api_key/json_mode.
  Use those same option and response cases, including reasoning, cache, citations, error boundaries and response
  metadata; do not introduce a second Nova response parser. direct_nova_defaults: AmazonNovaChatConfig constructor
  fields max_completion_tokens,max_tokens,temperature,top_p,tools,reasoning_effort start None and persist only non-None
  assignments. The metadata class field also defaults None but is not a constructor argument. get_config delegates
  through B038 OpenAILikeChatConfig to B2202 BaseConfig. Supported options are exactly top_p,temperature,max_tokens,max_completion_tokens,metadata,stop,stream,stream_options,tools,tool_choice,reasoning_effort.
  direct_nova_response_model: Call B038 OpenAILikeChatConfig.transform_response with the source arguments, then
  replace model with amazon-nova/ plus the requested model, even when already prefixed. Other response fields and
  parent failures are preserved; the hyphenated response prefix differs from provider amazon_nova.


  Load AMAZON_NOVA_API_BASE, AMAZON_NOVA_API_KEY, amazon_nova_api_key, AmazonNovaChatConfig.max_completion_tokens,
  AmazonNovaChatConfig.max_tokens, AmazonNovaChatConfig.temperature, AmazonNovaChatConfig.top_p, AmazonNovaChatConfig.tools,
  AmazonNovaChatConfig.reasoning_effort, AmazonNovaChatConfig.metadata through betterlite-config, with injected
  environment lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs
  use litellm_settings. Add config rstest bedrock_nova_chat_config_cases; each named loads_<key> case invokes the
  real B002 loader, checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Reuse B002 explicit api_base/api_key and global api_key settings. Unset Nova base and keys are None until the
  precedence above supplies the endpoint default. The Nova class fields are configuration record fields, not new
  API credential names.


  Write standalone Rust test nova_chat_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test nova_chat_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Name the global litellm_settings.amazon_nova_api_key loader case loads_global_amazon_nova_api_key, distinct from
  loads_amazon_nova_api_key for AMAZON_NOVA_API_KEY environment lookup. Test their precedence together as well as
  independently.


  Implement crates/betterlite-bedrock/src/nova_chat.rs with adjacent tests under nova_chat/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation bedrock_nova_chat in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function nova_chat_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  nova_inline_cache_points, nova_filter_allowed_fields, nova_tool_config_injection, direct_nova_endpoint, nova_converse_delegation,
  direct_nova_defaults, direct_nova_response_model. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_nova_chat* using HelperCase: kind: helper
  and the externally tagged bedrock_nova_chat variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_nova_chat that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/nova_chat.rs
  and its loader wiring: AMAZON_NOVA_API_BASE, AMAZON_NOVA_API_KEY. Module-level settings enter litellm_settings;
  deployment settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified
  above and in the linked branches; existing key owners remain unchanged. Write config rstest bedrock_nova_chat_config_cases
  with named cases loads_amazon_nova_api_base, loads_amazon_nova_api_key, plus rejects_unrelated_key. Each loads
  case calls the real config loader with that key and asserts the resolved value, default, precedence and secret
  redaction where applicable. Seed B002 config_yaml with new bedrock_nova_chat* files for every key; reuse its parser/fuzz
  target.


  Budget from 190 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 280 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 85 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 725 planned, 725 maximum changed lines.
