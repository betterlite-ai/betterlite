id: B614
title: Bedrock and direct Amazon Nova chat
description: >-
  Add Nova Invoke and direct Amazon Nova configuration using existing Converse wire blocks. Preserve inline cache
  points, allowed fields, empty-system removal and protection against toolConfig injection. Direct Nova auth/base
  configuration remains operator supplied and uses the existing OpenAI-compatible transport path. Direct Nova base
  precedence is explicit api_base, AMAZON_NOVA_API_BASE, then https://api.nova.amazon.com/v1; key precedence is
  explicit api_key, resolved amazon_nova_api_key, AMAZON_NOVA_API_KEY, then resolved global api_key.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_nova_transformation.py:
  _without_tool_config_injection_points L37-L51; _system_block_with_cache_point L54-L55; _content_block_with_cache_point
  L58-L59; _inline_block_cache_points L62-L75; AmazonInvokeNovaConfig.__init__ L83-L84; AmazonInvokeNovaConfig.get_supported_openai_params
  L86-L87; AmazonInvokeNovaConfig.map_openai_params L89-L96; AmazonInvokeNovaConfig.transform_request L98-L119;
  AmazonInvokeNovaConfig.transform_response L121-L148; AmazonInvokeNovaConfig._inline_cache_points L151-L166; AmazonInvokeNovaConfig._filter_allowed_fields
  L168-L173; AmazonInvokeNovaConfig._remove_empty_system_messages L175-L183. litellm/llms/amazon_nova/chat/transformation.py:
  AmazonNovaChatConfig.__init__ L32-L44; AmazonNovaChatConfig.custom_llm_provider L47-L48; AmazonNovaChatConfig.get_config
  L51-L52; AmazonNovaChatConfig._get_openai_compatible_provider_info L54-L62; AmazonNovaChatConfig.get_supported_openai_params
  L64-L77; AmazonNovaChatConfig.transform_response L79-L110.


  Implement crates/betterlite-bedrock/src/nova_chat.rs with adjacent tests under nova_chat/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation bedrock_nova_chat in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function nova_chat_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  nova_inline_cache_points, nova_filter_allowed_fields, nova_tool_config_injection, empty_system_removed, nova_response_output,
  direct_nova_endpoint. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_nova_chat* using HelperCase: kind: helper
  and the externally tagged bedrock_nova_chat variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_nova_chat that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/nova_chat.rs
  and its loader wiring: AMAZON_NOVA_API_BASE, AMAZON_NOVA_API_KEY. Module-level settings enter litellm_settings;
  deployment settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified
  above and in the linked branches; existing key owners remain unchanged. Write config rstest bedrock_nova_chat_config_cases
  with named cases loads_amazon_nova_api_base, loads_amazon_nova_api_key, plus rejects_unrelated_key. Each loads
  case calls the real config loader with that key and asserts the resolved value, default, precedence and secret
  redaction where applicable. Seed B002 config_yaml with new bedrock_nova_chat* files for every key; reuse its parser/fuzz
  target.


  Budget from 190 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 113 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 0 parser target/replay lines, 31 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 463 planned, 475 maximum changed lines.
