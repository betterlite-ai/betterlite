deviations: []
out_of_scope:
- remove_sensitive_info_from_deployment in openai_endpoint_utils.py remains B124; these API routes do not call it.
- Other utils.py functions retain existing owners; B124 owns the remaining proxy lifecycle and PrismaClient.recreate_read_only_writer.
- B4170 owns bug-report rendering and B4171 the proxy configuration report; this task uses its diagnostic interface.
- B3046 owns the limiter's disconnect release and B3035 its slot accounting; this task owns only ProxyLogging's hook selection and await.
- B087, B086, B1032-B1034, B1050-B1051, B1133 and B1075 own their route-specific provider precedence.
pitfalls:
- 'The oracle helper for this task is pre-registered as proxy_endpoint_support in the server group. Replace the stub Op in tools/oracle/src/helpers/server/proxy_endpoint_support.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/proxy_endpoint_support.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- HTTPException(404) becomes internal_server_error here; the Responses request processor uses a different mapper.
- An empty provider field is returned unchanged; only the calling route decides whether to fall through.
- Reusing ProxyException preserves its original x-litellm-call-id even when another id is supplied.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
