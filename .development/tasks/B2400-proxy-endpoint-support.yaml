  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/openai_endpoint_utils.py#L52-L81
  why: Own the three provider accessors; header spelling differs from the query/body key and precedence belongs to callers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8199-L8237
  why: Own exception conversion and recovery submission, including HTTPException's internal_server_error type.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/openai_error_payload.py#L55-L83
  why: B003 normalizes param and adds call ids without overwriting an existing header.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8260-L8274
  why: File-upload load balancing asks this exact-name predicate, not a general model resolver.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L4134-L4156
  why: Realtime disconnect cleanup awaits only the v3 limiter hook; absent or differently typed hooks do nothing.
dod:
- text: >-
    provider_hint_sources returns null for absent keys and "" for empty strings. Header custom-llm-provider=azure,
    query custom_llm_provider=openai and body custom_llm_provider=bedrock remain independent results. Uppercase
    CUSTOM-LLM-PROVIDER matches azure; a custom_llm_provider header does not match. The body accessor does not
    validate its field type: null remains null and 123 remains 123 for the caller's subsequent validation.
  proof: [provider-hints, oracle, helper-python]
- text: >-
    proxy_error_records maps HTTPException(404,detail="missing") to 404/internal_server_error/param=null/code="404";
    a generic failure without status to 500/internal_server_error/null/"500"; status_code=429,param="file" to
    429/internal_server_error/"file"/"429". Param="None" becomes null on new records. An existing ProxyException
    with type=invalid_request_error,param="purpose",code=400 retains these fields and code="400".
  proof: [exception-records, oracle, helper-python]
- text: >-
    call_id_precedence preserves an existing x-litellm-call-id=original when supplied new; inserts new if absent;
    and adds no header when no call id is supplied. Other headers survive all three cases.
  proof: [call-id, oracle, helper-python]
- text: >-
    recovery_and_body_reuse submits one postgres_read_only_transaction recovery for a classified read-only failure
    with a database, zero without a database or for another failure. Mapping completes before recovery; shutdown
    joins recovery work. Reading an already decoded custom_llm_provider=openai body causes no second byte read;
    malformed JSON preserves B1100's decoding error.
  proof: [integration-tests]
- text: >-
    diagnostics_order records exception logging before classification and recovery before conversion. Only the generic
    exception branch asks the bug-report service; false skips its notice, true logs it at error level before message
    stripping. Existing ProxyException bypasses that service and preserves its message.
  proof: [diagnostics, oracle, helper-python]
- text: A new proxy_endpoint_support seed executes both adapters and replays through B171's helper decoder.
  proof: [helper-corpus, oracle, helper-python]
- text: >-
    known_upload_model receives catalog [model_a,model_a] and returns true for model_a, false for Model_A,
    openai/model_a and absent model. An absent router returns false even for model_a. Each non-null lookup
    calls the catalog once; the pure helper projection compares the returned boolean from the same catalog.
  proof: [known-model, oracle, helper-python]
- text: >-
    disconnect_limiter_hook with a v3 parallel_request_limiter and principal key_a awaits one release(key_a)
    before completing. Missing/v2 hooks cause zero releases. A failing release propagates the failure; this
    adapter does not retry and cannot double-decrement the acquisition. Native tests use a controlled pending
    release future, not sleeps or helper calls that perform I/O.
  proof: [limiter-release]
checks:
  optional: []
  commands:
  - id: provider-hints
    why: source spelling, absence or empty values changed
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::proxy_endpoint_support::tests::provider_hint_sources($|::)/)'
  - id: exception-records
    why: exception classes no longer select the prescribed error fields
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::proxy_endpoint_support::tests::proxy_error_records($|::)/)'
  - id: call-id
    why: forwarding an exception overwrites its existing call id
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::proxy_endpoint_support::tests::call_id_precedence($|::)/)'
  - id: integration-tests
    why: recovery detaches from shutdown or provider hints consume the body twice
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::proxy_endpoint_support::tests::recovery_and_body_reuse($|::)/)'
  - id: diagnostics
    why: generic and existing proxy exceptions take the same diagnostic path
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::proxy_endpoint_support::tests::diagnostics_order($|::)/)'
  - id: helper-python
    why: the endpoint-support adapter is absent or untyped
    run: test -f tools/oracle/helpers/proxy_endpoint_support.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: known-model
    why: upload routing resolves prefixes instead of checking the catalog names
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::proxy_endpoint_support::tests::known_upload_model($|::)/)'
  - id: limiter-release
    why: realtime disconnect cleanup releases an unsupported limiter or returns before release completes
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::proxy_endpoint_support::tests::disconnect_limiter_hook($|::)/)'
  - id: helper-corpus
    why: the new helper tag has no branch-added seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/proxy-endpoint-support-*)" && grep -qE '^[[:space:]]+proxy_endpoint_support:' tools/oracle/fuzz/corpus/helper_case/proxy-endpoint-support-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
