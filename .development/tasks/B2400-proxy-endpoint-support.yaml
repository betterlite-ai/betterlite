id: B2400
title: Shared endpoint provider hints and exception handling
description: >-
  Implement get_custom_llm_provider_from_request_headers, get_custom_llm_provider_from_request_query,
  get_custom_llm_provider_from_request_body, handle_exception_on_proxy and
  _recreate_writer_on_read_only_transaction in betterlite-server::api::proxy_endpoint_support.
  The provider header is custom-llm-provider; query/body use custom_llm_provider. Accessors return
  their individual optional value, including empty strings. Routes retain responsibility for truthy
  path/header/query/body/default precedence. B1100 supplies cached body decoding and its errors.

  Also own is_known_model (utils.py:8260-8274) and ProxyLogging._arelease_max_parallel_requests_on_disconnect
  (4134-4156). The first returns false for an absent model/router and otherwise tests exact membership in
  B844's get_model_names result; it does not resolve aliases or provider prefixes. The second obtains the
  parallel_request_limiter hook and awaits B3046's v3 disconnect release (async_release_max_parallel_requests_on_disconnect) only when that hook is the v3 limiter.
  A missing or older hook is a no-op. Keep this small adapter below B1125 so disconnect cleanup has one owner.

  Log the exception before using B872's read-only-transaction classifier. With a database, enqueue
  recovery with reason=postgres_read_only_transaction without awaiting recovery. Use an injected
  recovery-submission interface backed by the server's tracked work queue; shutdown joins its work.
  B124 owns PrismaClient.recreate_read_only_writer and reconnect execution. A missing database is a no-op.

  HTTPException becomes internal_server_error at its original status, with B003's normalized nullable
  param. Existing ProxyException retains its fields and headers; a supplied x-litellm-call-id fills only
  an absent header. Other exceptions use status_code or 500, internal_server_error, normalized param,
  and B4170's strip_bug_report_notice for the message. B4170 also owns should_report_bug
  and bug_report_notice, including LITELLM_DISABLE_BUG_REPORT_LINK, and B4171 owns build_proxy_bug_report;
  inject their diagnostic service. ProxyException serializes code as a string. No request credentials enter logs.

  Register HelperCall::ProxyEndpointSupport and Python proxy_endpoint_support. The helper adapters
  compare pure projections from decoded records and exception values; they never call FastAPI handlers.
  Body-read caching and recovery scheduling have native integration tests. Route owners exercise the
  resulting HTTP behavior. No byte decoder is added. The owned spans contain 92 nonblank/non-comment
  Python lines including docstrings; allow 145 implementation, 175 tests, 100 adapters, 90 fixtures and
  30 wiring lines, 540 total.
scope:
  paths:
  - crates/betterlite-server/src/api/proxy_endpoint_support.rs
  - crates/betterlite-server/src/api/proxy_endpoint_support/**
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/Cargo.toml
  - tools/oracle/src/helpers/server/proxy_endpoint_support.rs
  - tools/oracle/src/helpers/server/proxy_endpoint_support/**
  - tools/oracle/helpers/proxy_endpoint_support.py
  - tools/oracle/helpers/proxy_endpoint_support/**
  - tools/oracle/cases/helpers/proxy-endpoint-support/**
  - tools/oracle/fuzz/corpus/helper_case/proxy-endpoint-support-*
