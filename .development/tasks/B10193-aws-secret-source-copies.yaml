id: B10193
title: One environment-only secret lookup, one CLI writer store and one set of native AWS sources
description: >-
  Three copies sit around the AWS credential chain once B10175 has landed, and each goes here. This task lands before B10176, so the Python sessions take the shared lookup from the start.


  One environment-only SecretLookup. Six places write the same five-field literal with no manager and stub OIDC ports, each with its own stub type: crates/betterlite-server/src/app/spend.rs L45-L51, jobs/ptu/attribution.rs L33-L39 and shadow_eval_lifecycle/postgres.rs L52-L58 over the server's `NoOidc` (attribution.rs L44-L72); B10175's server/shared_state.rs over the same `NoOidc`; betterlite-python's `secret_lookup` (crates/betterlite-python/src/decision_calls/core.rs L183-L230) over `NoOidcHttp`, `NoAzureTokens` and `FixedClock`; and betterlite-logging's PointFive service (finops/pointfive/logger/client.rs L54-L60) over its own `NoOidc` (L148-L174). All three crates depend on betterlite-secret-managers, so the one builder goes there: `#[must_use] pub fn environment_only() -> Self` on `SecretLookup` in crates/betterlite-secret-managers/src/secret_lookup.rs, with `manager: None`, an empty `OidcTokenCache` and one private `NoOidcSources` in a new file secret_lookup/no_oidc.rs (declared `mod no_oidc;` in secret_lookup.rs) for the three ports: `OidcHttp::get` fails with "this secret lookup has no OIDC provider", `AzureOidcTokens::token` answers Ok(None), and `OidcClock` reads the system clock as attribution.rs L61-L72 does. Its one-line comment says that an `os.environ/` name reads the given environment and an `oidc/` name fails. Every site above calls `SecretLookup::environment_only()`; both NoOidc types and python's `secret_lookup` with its three stub types go, and its caller decision_calls/core/sandbox.rs L21 calls the builder. B10176 then passes the builder to the two Python sessions.


  One CLI writer store. `store_from_state` in shadow_eval_lifecycle/postgres.rs L50-L89 repeats `cli_writer_store` (app/spend.rs L44-L67) line for line: the lookup, cli_writer_url, the same match and the pool build. It becomes `cli_writer_store(state).map(|store| PostgresShadowLifecycleStore { store: PostgresStore::clone(&store) })`, as shadow_eval_results/postgres.rs L76-L81 already does. The two shadow-eval error log texts give way to cli_writer_store's.


  One set of native AWS sources. betterlite-http's MCP signer keeps `AwsSources` (crates/betterlite-http/src/mcp_sigv4.rs L37-L44), the same six fields as betterlite-bedrock's `NativeSources` (aws_settings/sources.rs L43-L50) with a HashMap for the environment, and its `loader` (mcp_sigv4/credentials.rs L16-L28) is the first six builder calls of `NativeSources::loader` (sources.rs L53-L81). betterlite-bedrock depends on betterlite-http, and betterlite-http already carries aws-config, aws-types and aws-smithy-async, so the shared type moves down into crates/betterlite-http/src/aws_sources.rs, the empty module the plan declares in betterlite-http's lib.rs. It holds `SourceError` (sources.rs L16-L28, texts unchanged), `NativeSources` with its BTreeMap environment, `pub fn sdk_loader(&self, environment: HashMap<String, String>) -> ConfigLoader` with the six settings both copies set (env from the given map, filesystem, HTTP client, clock, sleep, operation timeout), `loader` (Bedrock's: the profile key filter, `sdk_loader`, then RetryConfig::disabled, the region and the profile) and `load`, which answers `betterlite_sigv4::credentials::Credentials` (betterlite-http adds betterlite-sigv4). The MCP signer takes `NativeSources` in `McpSigV4Auth::new`, and its `loader` calls `sdk_loader` with the whole map, so MCP keeps the SDK's default retries. `AwsSources` and bedrock's copies go, and every importer of `aws_settings::sources::{NativeSources, SourceError}` imports `betterlite_http::aws_sources` instead, with no `pub use` left at the old path: in betterlite-bedrock assume_role.rs, claude_platform/native.rs, credentials.rs, credentials/role.rs, credentials/role/aws_role.rs, credentials/chain.rs (B10175), credentials/cache.rs, credentials/error.rs, aws_settings/credential_cache.rs, web_identity/auth.rs, web_identity/irsa.rs, web_identity/sts.rs, realtime_transport/prepare.rs, sagemaker_runtime/error.rs and their tests; betterlite-rag's bedrock_ingestion/client/tests.rs; betterlite-server's bucket_config/s3_reader.rs; betterlite-python's mcp/setup.rs L118-L125; and the oracle helpers under tools/oracle/src/helpers/bedrock (assume_role.rs, aws_settings, credentials/fixtures.rs, mantle_settings/outcomes.rs, services_claude_platform/fixture.rs, web_identity) and tools/oracle/src/helpers/http/b4742.rs. `resolve_local_credentials`, `ResolvedCredentials` and `auth_selector_presence` stay in betterlite-bedrock.


  Tests. secret_lookup/tests gains `environment_only_reads_the_environment_and_refuses_oidc`: the lookup reads `os.environ/NAME` and a plain name from the given map, has no manager, and an `oidc/google/aud` read fails with the new text. aws_sources gets no unit test of its own beyond what moved: the resolver, web identity, assume role and MCP acquisition tests and the bedrock and http helper cases check the moved code, and must pass unchanged. The decision-call, PointFive and shadow-eval tests keep passing on the builder; the PTU flag has no tests of its own and only changes its literal.


  What users see: nothing. The only text that changes is an `oidc/` read through one of these lookups, which now says "this secret lookup has no OIDC provider", and the shadow-eval pool's error log lines.
