references: []
dod:
  - text: SecretLookup::environment_only is the only environment-only lookup in betterlite-server, betterlite-python and betterlite-logging; no NoOidc type or OidcHttp stub is left there, and an oidc/ read through it fails with its one text.
    proof: [no-copies, secret-lookup-tests, caller-tests]
  - text: The shadow-eval store comes from cli_writer_store.
    proof: [no-copies, caller-tests]
  - text: NativeSources and SourceError live in betterlite_http::aws_sources, the MCP signer takes NativeSources, AwsSources is gone, and Bedrock credential resolution, web identity, assume role and MCP signing still pass their tests and helper cases.
    proof: [no-copies, bedrock-tests, http-tests, oracle-cases]
checks:
  optional: []
  commands:
    - id: no-copies
      why: a SecretLookup literal or OIDC stub, the shadow-eval pool copy, AwsSources or bedrock's NativeSources is still in place
      run: |-
        test -z "$(grep -rnE 'SecretLookup \{|impl OidcHttp for' crates/betterlite-server/src crates/betterlite-python/src crates/betterlite-logging/src | grep -v '/tests')" &&
        test -z "$(grep -n 'NoOidcHttp\|NoAzureTokens' crates/betterlite-python/src/decision_calls/core.rs)" &&
        grep -q 'cli_writer_store' crates/betterlite-server/src/shadow_eval_lifecycle/postgres.rs &&
        grep -q 'pub struct NativeSources' crates/betterlite-http/src/aws_sources.rs &&
        test -z "$(grep -rnE 'pub struct (NativeSources|AwsSources)|aws_settings::sources::\{?[^}]*(NativeSources|SourceError)' crates tools --include=*.rs | grep -v '^crates/betterlite-http/src/aws_sources.rs:')"
    - id: secret-lookup-tests
      why: the builder reads a manager, the wrong map, or answers an oidc/ name
      run: grep -rq 'fn environment_only_reads_the_environment_and_refuses_oidc' crates/betterlite-secret-managers/src/secret_lookup && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_lookup::/)'
    - id: caller-tests
      why: a caller of the builder lost its lookup, or the shadow-eval store changed
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_eval_lifecycle::/) | test(/^shadow_eval_results::/)' && cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^decision_calls::/)' && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^finops::pointfive::/)'
    - id: bedrock-tests
      why: the moved sources changed what Bedrock resolves through profiles, roles, web identity or the SDK chain
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E '(test(/^(credentials|aws_settings|assume_role|web_identity|claude_platform|realtime_transport|sagemaker_runtime|s3_signing|mantle_settings)::/)) - test(/replays_the_/)'
    - id: http-tests
      why: the MCP signer lost a source or its retries changed after the move
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^mcp_sigv4::/)' && cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^mcp::setup::/)'
    - id: oracle-cases
      why: a helper no longer builds against the moved type or its cases changed
      run: cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-bedrock -- tools/oracle/cases/helpers/providers/bedrock-credentials tools/oracle/cases/helpers/providers/bedrock-web-identity tools/oracle/cases/helpers/providers/bedrock-assume-role tools/oracle/cases/helpers/providers/bedrock-aws-settings && cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-http -- tools/oracle/cases/helpers/mcp-sigv4
oracle_cases: []
deviations: []
out_of_scope:
  - "Test fixtures with their own OIDC stubs (crates/betterlite-bedrock/src/embedding_call/tests/fixture.rs L389-L420, bedrock_embedding_io/tests/fixture.rs L238 and the oracle helpers' secrets() builders): they script OIDC answers or sit outside these crates."
  - "Replacing the server's environment-only lookups with the production one: B8612 builds production_secret_lookup and B8610 puts it into Shared; those sites move to it then."
  - "The SigV4 signing steps in mcp_sigv4/signing.rs and the other signers: B10190 and B10191 move them onto betterlite-sigv4."
  - "What the S3 module reader resolves (it keeps calling NativeSources::load here, only its import changes)."
pitfalls:
  - "B10175 writes one of the six literals; read server/shared_state.rs on main when this task starts."
  - "NativeSources' loader removes AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN from the map only when a profile is set, and only Bedrock's loader disables retries; MCP's sdk_loader call keeps both as they are today."
  - "bucket_config/s3_reader.rs imports SourceError and NativeSources; it changes only its import line."
  - "OidcTokenCache is a Mutex, so environment_only builds a fresh one per call; never share one cache between two lookups through a static."
  - "Find each importer with `grep -rn 'aws_settings::sources' crates tools` before editing: some import Credentials too, which stays at the bedrock path through B10173's pub use."
review_level: standard
budget:
  max_changed_lines: 900
  max_new_expects: 0
