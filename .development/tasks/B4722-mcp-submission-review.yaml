dod:
  - text: >-
      GET /v1/mcp/server/submissions rejects every role except the two admin roles with the 403 text, answers the 500 database text before reading, returns the summary with counts and redacted items,
      and additionally sanitizes the items for the view-only admin without recomputing the counts.
    proof: [submissions-tests, oracle]
  - text: >-
      POST /v1/mcp/server/{server_id}/pin admits only PROXY_ADMIN, answers 404 when the row or the registry record is missing, 400 when the fetched catalog is empty,
      and otherwise stores the catalog, calls the registry update then reload in that order and returns the pinned map.
    proof: [pinning-tests, oracle]
  - text: >-
      DELETE /v1/mcp/server/{server_id}/pin admits only PROXY_ADMIN, answers 404 when the row is missing, stores None through the same step as pin, and returns {"server_id", "status": "unpinned"}.
      The store step answers 404 when the write finds no row.
    proof: [pinning-tests, oracle]
  - text: >-
      PUT /v1/mcp/server/{server_id}/approve admits only PROXY_ADMIN, answers 404 for a missing row and 400 for an already active one, approves any other status,
      invalidates the submitter cache for submitted_by, reloads the registry and returns the redacted row.
    proof: [review-tests, oracle]
  - text: >-
      PUT /v1/mcp/server/{server_id}/reject admits only PROXY_ADMIN, validates its body before the role check (422), answers 404 for a missing row and 400 for an already rejected one,
      passes review_notes through, reloads the registry only when the row was active and returns the redacted row.
    proof: [review-tests, oracle]
  - text: >-
      POST /v1/mcp/server/register answers 403 for a proxy admin, 400 for a key without a team and for a stdio transport, creates the row as pending_review with submitted_by and submitted_at set, returns 201 with the redacted row
      and does not touch the live registry.
    proof: [submissions-tests, oracle]
  - text: >-
      Every route answers the 500 database text on a proxy without a database, after the role check and before any lookup.
    proof: [oracle, review-tests]
  - text: The module is registered through routes() with the six method and path pairs and no other route, so axum has no duplicate.
    proof: [module-tests]

checks:
  optional: [mutants]
  commands:
    - id: module-tests
      why: the route table, the shared error mapping or the request type is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::submission_review::tests::/)'
    - id: submissions-tests
      why: the submissions route, its role gate, its redaction or its view-only sanitizing is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::submission_review::submissions::/)'
    - id: pinning-tests
      why: the pin route, the unpin route or the shared store step is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::submission_review::pinning::/)'
    - id: review-tests
      why: the approve route, the reject route or their database check is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::submission_review::review::/)'

