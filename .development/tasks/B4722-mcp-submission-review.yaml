deviations:
  - what: The catalog fetch, the registry update and reload, and the submitter cache invalidation are reached through ports, not through a global manager and module imports.
    why: LiteLLM reads global_mcp_server_manager and imports rest_endpoints inside the handler; betterlite has no globals, and the owners are B4727, B6765 and B6591.

out_of_scope:
  - "get_prisma_client_or_throw, get_mcp_server, approve_mcp_server, reject_mcp_server, get_mcp_submissions and set_mcp_server_pinned_tools: owned by B4711; this task calls them."
  - "_redact_mcp_credentials, _redact_mcp_credentials_list, _sanitize_mcp_server_list_for_non_admin and _user_is_full_admin: owned by B4717."
  - "fetch_pinnable_tool_catalog and the tool scan it runs: owned by B4727. get_mcp_server_by_id: owned by B4731."
  - "update_server and reload_servers_from_database: owned by B6765. invalidate_byom_submitted_servers_cache: owned by B6591."
  - "management_endpoint_wrapper: owned by B865. PinnedMCPTool and parse_pinned_tools: owned by B2305."
  - "validate_and_normalize_mcp_server_payload, stamp_omitted_oauth2_flow, _validate_mcp_required_fields and raise_mcp_identifier_conflict: owned by B4716. create_mcp_server_if_identifier_free: owned by B4712."
  - "The other routes in mcp_management_endpoints.py: catalog and health views belong to B4720, create, import, edit and delete to B4721, credentials to B4723, env vars to B4724, toolsets and sessions to B4725, preview and test routes to B4729 and the temporary OAuth session routes to B4718."

pitfalls:
  - GET /v1/mcp/server/submissions and GET /v1/mcp/server/{server_id} (B4720 route 7) overlap in shape; the static segment must win, so register this route with the literal path and do not let the id route swallow "submissions".
  - Pin and unpin accept only PROXY_ADMIN, while the submissions list also accepts PROXY_ADMIN_VIEW_ONLY; do not reuse one admin predicate for all five.
  - Pin looks the server up twice, in the database and in the live registry, and both misses share the text "not found in the database."; approve and reject use the shorter "MCP server '<id>' not found." with no such suffix.
  - Unpin stores the JSON text "{}" through the same write as pin, not NULL; the registry record reads it back as no pin because the parser turns an empty map into none.
  - Pin passes the registry record to the fetcher, not the table row, and the fetcher itself strips existing pins and description overrides first, so pin never reads what is already pinned.
  - Approve accepts a draft or a rejected row and a row with a null status, and only "active" is refused; a row already "approved" (the legacy spelling) is approved again.
  - Approve calls the submitter cache invalidation with submitted_by even when it is null (the call then does nothing), and always reloads; reject reloads only when the row was active.
  - Reject keeps the stored review_notes when the body note is null or the body is empty, because B4711 writes the field only for a non-null value.
  - The reject body is parsed before the role check, so a non-admin with a bad body sees 422, and a non-admin with a good body sees 403.
  - get_mcp_submissions counts only rows with submitted_at set, so an admin-created server never shows up, and the counts cover the 500-row cap, not the table.
  - "POST /v1/mcp/server/register and GET /v1/mcp/server/submissions share a prefix; register is a POST with a literal path and must not be treated as an id route."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
