id: B4722
title: MCP submission review and pinned tool catalogs
description: >-
  Build the six routes of the MCP management router that submit servers for review, review user-submitted servers and pin a server's tool catalog, in betterlite-server module mcp::submission_review.
  All six sit under the router prefix /v1/mcp (LiteLLM mounts this router with that prefix only, so there is no /mcp/... or /openai/v1/... alias).
  Errors are FastAPI HTTPException values with an object detail, so every error body here is {"detail": {"error": "..."}}. The one exception is a body that fails validation (route 4), which is FastAPI's 422 list.
  Every route needs a valid key (the user_api_key_auth dependency) and is wrapped by B865's management completion wrapper, like @management_endpoint_wrapper. Read B865 for its Rust names.


  Layout. crates/betterlite-server/src/mcp/submission_review.rs holds SubmissionReview (a struct whose fields are the ports the routes need, built by the composition root with a struct literal), the ReviewError enum (thiserror, one variant per failure, a status mapping used by the routes), the RejectMcpServerRequest type and `routes()` which returns the axum router with the six routes.
  The files beside it, each with a tests.rs: submissions.rs (route 1), pinning.rs (routes 2 and 3 and the shared store step) and review.rs (routes 4 and 5).
  No global state. The LiteLLM globals become fields: the database port, the registry, the registry mutator, the BYOM cache invalidator and the catalog fetcher.
  Ports (traits defined in submission_review.rs, implemented by the composition root over the crates named in brackets):
  a DbReads and writes port with get_mcp_server(server_id), get_mcp_submissions(), approve_mcp_server(server_id, touched_by), reject_mcp_server(server_id, touched_by, review_notes) and set_mcp_server_pinned_tools(server_id, pinned_tools: Option<BTreeMap<String, PinnedMCPTool>>, touched_by) [B4711, the Rust names are B4711's];
  a RegistryView port with server_by_id(server_id) that passes no client ip [B4731];
  a RegistryReload port with update(record) and reload() [B6765, update_server and reload_servers_from_database];
  a SubmitterCache port with invalidate_submitted(user_id) [B6591, invalidate_byom_submitted_servers_cache];
  a CatalogFetcher port with fetch_pinnable(server, request, auth) -> Result<BTreeMap<String, PinnedMCPTool>, CatalogFetchError> [B4727, fetch_pinnable_tool_catalog].
  The database port is optional: a proxy started without a database makes every route answer the 500 below. The redact and sanitize functions come from B4717 (mcp::management_visibility), PinnedMCPTool and the approval status enum from B2305 and B858, the table row LiteLLM_MCPServerTable and MCPSubmissionsSummary from B858 and B4711, and UserApiKeyAuth and the role enum from B2314.


  The database check. Every route gets its database from get_prisma_client_or_throw (B4711): with no database it raises 500 {"detail": {"error": "Database not connected. Connect a database to your proxy"}}. It runs after the role check and before any lookup.
  touched_by in the write calls is the caller's user_id, else the constant LITELLM_PROXY_ADMIN_NAME (the string "default_user_id" in LiteLLM's constants; read it at constants.py and keep the value).


  Route 1. GET /v1/mcp/server/submissions. Role check first: PROXY_ADMIN and PROXY_ADMIN_VIEW_ONLY pass, any other role gets 403 {"error": "Admin access required to view MCP server submissions."}.
  Then the database check, then get_mcp_submissions, which returns MCPSubmissionsSummary {total, pending_review, active, rejected, items}: every row with submitted_at set, newest first, at most 500, and the three counts taken over the rows that were read.
  Then items are replaced by B4717's _redact_mcp_credentials_list(items). A caller that is not a full admin (B4717's _user_is_full_admin is false, so the view-only admin) also gets _sanitize_mcp_server_list_for_non_admin(items). The counts are not recomputed. The body is the summary with every row field serialized, nulls included.

  Route 2. POST /v1/mcp/server/{server_id}/pin. Only PROXY_ADMIN passes (view-only admin is rejected too): 403 {"error": "Admin access required to pin MCP server tools."}.
  Then the database check. Then two lookups: get_mcp_server(server_id) from the database and the registry's server_by_id(server_id). If either is missing the answer is 404 {"error": "MCP server '<id>' not found in the database."}, the same text for both cases.
  Then CatalogFetcher.fetch_pinnable(registry record, request, auth). An empty result is 400 {"error": "MCP server '<id>' exposes no tools that pass the guardrails; nothing to pin."}. A non-empty result goes to the store step and is returned as the body: an object from tool name to {"description": string, "input_schema": object}, in the order the fetcher gave it, with description "" when the upstream had none.

  Route 3. DELETE /v1/mcp/server/{server_id}/pin. Only PROXY_ADMIN: 403 {"error": "Admin access required to unpin MCP server tools."}. Database check, then get_mcp_server; a missing row is 404 with the same "not found in the database" text as route 2. Registry membership is not required. Then the store step with None. The body is {"server_id": "<id>", "status": "unpinned"}.

  Store step (_store_pinned_tools), shared by routes 2 and 3. It calls set_mcp_server_pinned_tools(server_id, tools, touched_by). A None result (the row vanished between the lookup and the write) is 404 with the same text. Otherwise it calls the registry's update(record) with the returned row, then reload(), in that order. Both run before the response is built, so a reload failure is a 500 after the row was already written.
  Unpin passes None, and B4711 stores that as the JSON text "{}" (not SQL NULL); parse_pinned_tools (B2305) reads "{}" back as no pin. Do not rewrite that here.

  Route 4. PUT /v1/mcp/server/{server_id}/approve. No body. Only PROXY_ADMIN: 403 {"error": "Admin access required to approve MCP server submissions."}. Database check, then get_mcp_server: a missing row is 404 {"error": "MCP server '<id>' not found."} (no "in the database" here), and a row whose approval_status is already "active" is 400 {"error": "MCP server is already active."}.
  Any other status (pending_review, rejected, draft, null, "approved") is approved: approve_mcp_server sets active. Then SubmitterCache.invalidate_submitted(row.submitted_by) (a null submitted_by does nothing), then reload(). The body is _redact_mcp_credentials(approved row), the admin view with admin-config credential keys kept.

  Route 5. PUT /v1/mcp/server/{server_id}/reject. Body RejectMcpServerRequest {review_notes: Option<String>}, default null. The body is validated before the handler runs, so a bad body gives 422 even for a caller who would get 403.
  Only PROXY_ADMIN: 403 {"error": "Admin access required to reject MCP server submissions."}. Database check, then get_mcp_server: missing row 404 {"error": "MCP server '<id>' not found."}, approval_status already "rejected" 400 {"error": "MCP server is already rejected."}.
  Remember was_active = (status was "active"). Then reject_mcp_server(server_id, touched_by, review_notes), where B4711 writes review_notes only when it is not null (an omitted or null note keeps the stored note). Then reload() only when was_active is true; a pending row, a draft or a null status skips the reload and does not touch the submitter cache. The body is _redact_mcp_credentials(rejected row).

  Route 6. POST /v1/mcp/server/register, handler register_mcp_server (mcp_management_endpoints.py L1373-L1447, 75 lines). The body NewMCPServerRequest (B858) is parsed before anything else, so a bad body gives 422 even for a proxy admin. Any valid key may call it, and the checks run in this order: PROXY_ADMIN gets 403 {"error": "PROXY_ADMIN users should use POST /v1/mcp/server to create servers directly instead of the submission workflow."}; a key without team_id gets 400 {"error": "Registration requires an API key associated with a team. Use a team-scoped key."}; transport stdio gets 400 with the stdio text at L1397-L1405 (copy it exactly).
  Then the database check, then B4716's validate_and_normalize_mcp_server_payload, stamp_omitted_oauth2_flow and _validate_mcp_required_fields in that order. The handler sets approval_status to pending_review, submitted_by to the caller's user_id and submitted_at to now (UTC), then calls B4712's create_mcp_server_if_identifier_free with touched_by set to the caller's user_id, else the team_id. A McpIdentifierConflict goes to B4716's raise_mcp_identifier_conflict. Any other write failure is a 500 {"error": "Error registering mcp server: <error>"} after an error log. The new row is not added to the live registry. The answer is status 201 with _redact_mcp_credentials(row).

  Tests use synthetic servers (ids like test-srv-1, names like test-server) and in-memory fakes for the five ports. Cover every branch above: the role gate of each route with all four roles that matter (proxy admin, view-only admin, internal user, no role), the check order (role, database, lookup, state), the call order of the store step and the approve and reject steps recorded by the fakes, and the exact error texts.


