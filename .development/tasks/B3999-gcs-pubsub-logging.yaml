    why: publish_message base64-encodes message JSON, constructs request, POSTs to Pub/Sub REST API.

dod:
  - text: GcsPubSubLogger.__init__ requires both project_id and topic_id, raising ValueError if either is missing.
    proof: [pubsub-tests]
  - text: Missing project_id and topic_id are resolved from GCS_PUBSUB_PROJECT_ID and GCS_PUBSUB_TOPIC_ID environment variables.
    proof: [pubsub-tests]
  - text: Service account credentials path is resolved from constructor parameter or GCS_PATH_SERVICE_ACCOUNT environment variable.
    proof: [pubsub-tests]
  - text: construct_request_headers calls _ensure_access_token_async with custom_llm_provider="vertex_ai" to obtain an access token.
    proof: [pubsub-tests]
  - text: construct_request_headers calls _get_token_and_url with model="pub-sub" and custom_llm_provider="vertex_ai" to construct the final bearer Authorization header value.
    proof: [pubsub-tests]
  - text: Authorization header in construct_request_headers has format "Bearer {token}".
    proof: [pubsub-tests]
  - text: async_log_success_event reads kwargs["standard_logging_object"] when gcs_pub_sub_use_v1 is false.
    proof: [pubsub-tests]
  - text: async_log_success_event calls get_logging_payload (B1716) to obtain v1 spend projection when gcs_pub_sub_use_v1 is true.
    proof: [pubsub-tests]
  - text: async_log_success_event enqueues the selected payload to the log_queue.
    proof: [pubsub-tests]
  - text: async_log_success_event calls async_send_batch when log_queue length reaches batch_size threshold.
    proof: [pubsub-tests]
  - text: async_log_success_event exceptions are caught and logged at exception level without propagating to caller.
    proof: [pubsub-tests]
  - text: async_send_batch returns early if log_queue is empty.
    proof: [pubsub-tests]
  - text: async_send_batch calls publish_message for each message in the queue.
    proof: [pubsub-tests]
  - text: async_send_batch clears log_queue in finally block, even if publish_message raises an exception.
    proof: [pubsub-tests]
  - text: publish_message converts message to JSON using json.dumps with default=str.
    proof: [pubsub-tests]
  - text: publish_message base64-encodes the JSON message string.
    proof: [pubsub-tests]
  - text: >-
      publish_message constructs POST body with format {"messages": [{"data": encoded_message}]}.
    proof: [pubsub-tests]
  - text: >-
      publish_message POSTs to https://pubsub.googleapis.com/v1/projects/{project_id}/topics/{topic_id}:publish
      with Authorization and Content-Type headers.
    proof: [pubsub-tests]
  - text: publish_message only accepts HTTP 200 and 202 responses; other status codes are logged as errors.
    proof: [pubsub-tests]
  - text: publish_message exceptions are caught and logged at error level, returning None without propagating.
    proof: [pubsub-tests]

