deviations:
  - what: _premium_user_check() calls are removed from __init__ and async_log_success_event.
    why: Project decision to omit paid-tier restrictions from the MIT implementation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gcs_pubsub/pub_sub.py#L47-L49
  - what: Bearer token construction delegates to B1303 (_ensure_access_token_async) and B1304 (_get_token_and_url) from the Vertex AI module.
    why: These are external SDK functions with concrete contracts provided by those tasks; betterlite reuses the authenticated token path rather than duplicating credential handling.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gcs_pubsub/pub_sub.py#L72-L88

out_of_scope:
  - Vertex AI SDK implementation and token lifecycle management (owned by B1303, B1304).
  - HTTP client initialization (owned by B173).
  - Batch logger parent class and periodic flush timer (owned by B256).
  - get_logging_payload v1 spend projection logic (owned by B1716).

pitfalls:
  - "Bearer token is obtained via Vertex AI auth (_ensure_access_token_async and _get_token_and_url), not direct service-account key parsing. The token path requires passing the service account JSON path to both functions."
  - "Message encoding is base64(json.dumps(message)) with default=str to serialize non-JSON types; the request body expects a dict with messages list, each having a data field."
  - "gcs_pub_sub_use_v1 flag gates selection: when false, read kwargs[\"standard_logging_object\"] for the standard payload; when true, call get_logging_payload for v1 spend projection."
  - "Queue is cleared in finally block of async_send_batch even if publish_message raises, so failed publishes do not accumulate in the queue."
  - "One message per event; async_send_batch publishes each message individually with separate POST requests, not batched in a single API call."
  - "HTTP status 200 and 202 are the only accepted responses; other codes are logged as errors and treated as publish failures."

review_level: security

