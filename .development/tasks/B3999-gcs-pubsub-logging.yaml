id: B3999
title: Publish standard and legacy spend logs to Google PubSub
description: >-
  Implement Google Cloud Pub/Sub logger for publishing spend and standard logging payloads.
  The logger authenticates with Pub/Sub using Vertex AI bearer tokens (via _ensure_access_token_async and _get_token_and_url),
  selects between standard logging payloads and v1 spend projections based on the gcs_pub_sub_use_v1 flag,
  and publishes each message as base64-encoded JSON to the configured project and topic.

  Require both project_id and topic_id at construction, resolving missing values from GCS_PUBSUB_PROJECT_ID and GCS_PUBSUB_TOPIC_ID
  environment variables (B002 loader provides these). Accept service-account credentials path from constructor or GCS_PATH_SERVICE_ACCOUNT.

  Publish messages via REST API with base64 encoding: POST to
  https://pubsub.googleapis.com/v1/projects/{project_id}/topics/{topic_id}:publish
  with Bearer token header. Accept only 200 and 202 status codes.

  Clear the log queue in the finally block of async_send_batch, after attempted publication of all messages,
  so failed publishes do not retain messages. Log exceptions from publish attempts at debug/error level without blocking
  the caller. Do not route through the GCS bucket client; its per-credential/bucket settings and project selection are different.

