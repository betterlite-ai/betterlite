id: B571
title: Anthropic history cleanup and cache portability
description: >-
  Add ReplayMessages transformations for advisor blocks, invalid encrypted/thinking blocks, empty content, tool-use
  id sanitation and portable cache controls. Preserve the source-specific signed-content rules and source order;
  expose mutation explicitly for advisor and request-dict repair, and copy for the other transforms. B081 will reuse
  this native-message preparation; it does not require that public API here.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  strip_advisor_blocks_from_messages L1216-L1299; is_anthropic_invalid_thinking_block_error L1302-L1320; strip_thinking_blocks_from_anthropic_messages
  L1323-L1346; _without_encrypted_reasoning_blocks L1349-L1360; strip_encrypted_reasoning_blocks_from_anthropic_messages
  L1363-L1372; strip_thinking_blocks_from_anthropic_messages_request_dict L1375-L1385; strip_empty_content_blocks_from_anthropic_messages
  L1388-L1428; _is_empty_text_block L1431-L1435; is_empty_thinking_block L1438-L1450; is_empty_unsigned_thinking_block
  L1453-L1469; normalize_anthropic_tool_use_id L1472-L1482; _sanitize_tool_use_id_content_block L1485-L1501; sanitize_tool_use_ids_in_anthropic_messages
  L1504-L1526; _without_provider_specific_fields L1681-L1684; _strip_provider_specific_fields_in_message L1687-L1691;
  strip_provider_specific_fields_from_anthropic_messages L1694-L1697; _normalized_cache_control L1700-L1704; _with_portable_cache_control
  L1707-L1712; _with_portable_cache_control_in_blocks L1715-L1718; _with_portable_cache_control_in_content_block
  L1721-L1730; _with_portable_cache_control_in_message L1733-L1742; _with_portable_cache_control_in_messages L1745-L1748;
  _with_portable_cache_control_in_scoped_value L1751-L1758; normalize_cache_control_in_anthropic_payload L1761-L1780.


  Named case contracts: advisor_block_removal: Only assistant dict messages with list content are changed in place.
  First collect truthy ids from server_tool_use name=advisor; without such ids even orphan advisor_tool_result stays
  untouched. Drop only matching uses/results, preserve other blocks and allow empty content. With replace_with_text=True
  collect string advice or first text block, last matching result wins; emit <advisor_feedback>\n<advice>\n</advisor_feedback>
  at the use position only for truthy advice, dropping results regardless. invalid_thinking_error_match: Case-fold
  text; require thinking plus signature and either invalid or valid string, OR thinking plus must contain thinking.
  Empty text/unrelated errors fail. Request repair removes every thinking/redacted_thinking block from dict list
  content regardless of signature, deep-copies dict messages, drops messages whose filtered list is empty (including
  initially empty), and removes top-level thinking even if messages is not a list. encrypted_reasoning_removal:
  Delegate B220 encrypted-reasoning predicate; only removed encrypted blocks trigger copying/dropping messages.
  Native signed reasoning, unchanged messages, non-list content and initially empty lists remain unchanged. empty_thinking_signed_versus_unsigned:
  Inbound empty-thinking predicate matches missing/nonstring/whitespace thinking regardless of signature; redacted_thinking
  never matches. Emit-side empty-unsigned predicate additionally requires falsey signature, so a truthy signature-only
  block survives output. Empty text uses the analogous type=text predicate. empty_text_content: Remove only empty
  text/thinking blocks from list content, preserve block order and originals, drop messages emptied by removal but
  retain an initially empty list (length unchanged). Non-dict messages/non-list content pass through. tool_use_id_rewrite:
  Strip at first __thought__, replace every character outside ASCII a-zA-Z0-9_- with _, use tool_use_id when empty.
  Rewrite only string id on tool_use/server_tool_use and string tool_use_id on tool_result, in immediate list content;
  no max length, deduplication or recursive application. Preserve original messages and untouched values. strip_provider_specific_fields:
  Strip provider_specific_fields only from immediate dict blocks in list message.content; retain message-level fields,
  nested values, non-dict blocks and other content forms. portable_cache_control: Copy payload; mapping cache_control
  becomes only {type:<existing string or ephemeral>} (empty string retained), nonmapping cache_control disappears.
  Apply at request level, system/tools blocks, message content blocks and one level of tool_result.content; do not
  change message-level cache_control, tool_use.input, input_schema, nested application data or unrelated keys. Drop
  ttl/scope and unknown cache keys, preserve sequence order and strings.


  Implement crates/betterlite-anthropic/src/message_replay.rs with adjacent tests under message_replay/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_message_replay in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function message_replay_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): advisor_block_removal, invalid_thinking_error_match, encrypted_reasoning_removal, empty_thinking_signed_versus_unsigned,
  empty_text_content, tool_use_id_rewrite, strip_provider_specific_fields, portable_cache_control. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_message_replay* using HelperCase: kind:
  helper and the externally tagged anthropic_message_replay variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_message_replay that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 349 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 355 production lines, 260 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 770 planned, 775 maximum changed lines.
