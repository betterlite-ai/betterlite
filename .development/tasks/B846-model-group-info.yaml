id: B846
title: Aggregate model group metadata
description: >-
  Implement ModelGroupInfo aggregation from deployment metadata, retaining capability, limit, cost and
  provider fields with source merge rules and Decimal money. B847 caches this result; B844 invalidates
  that cache when deployments change.


  Use B844 get_model_list, B845 get_deployment_model_info, B367 pattern_router.route, B174 provider
  resolution, B175 supported OpenAI parameters, local cost normalization, B323 deployment mapping and
  reasoning-effort intersection, B2216 Anthropic fast-mode capability and B301 LiteLLM_Params. Own all
  ModelGroupInfo fields L785-L817: model_group/providers required; token limits, costs (including
  input_cost_per_pixel), tpm/rpm/itpm/otpm and configurable_clientside_auth_params default None; mode
  defaults "chat"; seven supports_* booleans default false and explicit None becomes false;
  supported_reasoning_efforts defaults None and supported_openai_params defaults an empty list.
  _resolved_annotations is constructor plumbing for that null-to-false behavior, not a runtime registry.

  Move _cost_value_as_float (router.py L391-L397) here: its only callers are in this aggregation.
  Null returns None; numeric text and booleans convert with Python float semantics, while TypeError
  or ValueError returns None silently. Preserve finite values through the existing checked Decimal
  boundary. cost_scalar_conversion tests null, zero, negative, exponent text, bool and invalid text;
  the native numeric boundary retains its existing nonfinite/out-of-range rejection.


  Resolve aliases before aggregation: string targets are followed with the original user-facing name;
  mapping hidden=true returns None, other mappings require model, and unsupported alias types return
  None. A missing hidden/model key propagates its source error. For each looked-up row require a
  model_name equal to the resolved group or a non-null pattern route; unmatched rows are ignored.
  None/empty lookup yields None. Parse params, overwriting the pending clientside-auth value on every
  matched row, including None. Each rate limit selects top-level, params, then model_info, treating
  zero as present. Sum non-null limits separately, preserving None when no values exist.


  Deployment-info lookup happens only for a non-null id, and any lookup exception silently falls back
  to missing metadata. Capture deployment_is_catalog_mapped before constructing fallback metadata.
  Provider BadRequestError logs an error and continues with empty model/provider strings; other errors
  escape. Missing metadata calls get_supported_openai_params, turns None into [], and builds metadata
  from model_info's costs and mode (missing mode becomes "chat", explicit null stays null), with unknown
  input/output token maxima and supports_system_messages=None. Do not lose configured Decimal costs.


  First metadata initializes the group, including mode and pixel cost; later rows add each new provider
  once in encounter order, widen non-null input/output token maxima and take larger non-null per-token
  prices. Later true values enable parallel_function_calling, vision, function_calling, web_search,
  url_context and reasoning; false never removes a true capability. The last non-null
  supported_openai_params replaces the list, including an empty list; it is not a union. Mode and
  input_cost_per_pixel remain the first row's values. Metadata tpm/rpm fallback applies only to later
  rows and only if none of the three configured locations supplied a value; there is no analogous
  metadata fallback for itpm/otpm. Preserve that first-row asymmetry.


  supports_fast_mode starts true for aggregation and becomes the conjunction of B2216 capability for
  every matched deployment. Resolve reasoning efforts per deployment: one unknown result makes the
  final result None permanently; otherwise initialize from the first known tuple and intersect later
  tuples through B323, retaining a known empty tuple. Apply totals at the end and assign clientside-auth
  params only if the final matched row's value is non-null. No settings, database writes or secret
  storage occur here. The helper oracle supplies catalog/provider metadata snapshots and compares
  every field, null/empty distinction and error-log event; it never calls a provider network endpoint.


  Build the production model_group_info module in betterlite-router; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/router.py:
  Router._set_model_group_info (L10909-L11169; 218 source lines), Router.get_model_group_info (L11171-L11198;
  23 source lines). litellm/types/router.py: _resolved_annotations (L780-L782; 3 source lines), ModelGroupInfo.__init__
  (L813-L817; 5 source lines).


  Add the model_group_info operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a model-group-info-*
  seed to B171 helper_case, which already owns this decoder.


  The two router ranges contain 229 lines excluding blanks/comments/docstrings, plus 34 type/constructor
  and seven cost-helper lines. Allow 270 production, 330 tests, 105 adapters and 35 wiring lines,
  740 within 775. Metadata
  decoder/schema validation belongs to the listed dependencies; no new byte boundary is introduced.
