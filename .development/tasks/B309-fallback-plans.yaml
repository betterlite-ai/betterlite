id: B309
title: Resolve fallback chains and attempt identities
description: Add typed ordinary, context-window and content-policy fallback plans, including request-local
  overrides and parameterized targets. Resolve lookup names and wildcard chains, validate bounded configuration
  and track canonical attempted targets in one request-owned set. This part returns a plan and successor
  targets; B310 makes provider calls. Use B013 facts where capacity fallback selection needs model limits.
  Use the existing Rust crate boundaries from B004 and B008; integrate through the server when the provider
  dispatcher or callbacks live in another core crate. This task's source slices are the linked ranges,
  not a port of their Python classes. Add the listed oracle cases and the matching adapters to B301's
  component runner where state is not observable over HTTP; adapters call production logic and never reproduce
  it. Use deterministic candidate sets or supplied random samples for comparisons, and separate seeded
  distribution tests for random choices. Extend the existing config_yaml fuzz target and committed corpus
  for every newly accepted config form; unsupported keys still fail by full path. Keep the implementation,
  adapters and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
  Extend B004's typed chat request fields only for the routing controls this task consumes, and extend
  its existing chat_request fuzz corpus; router-only fields never reach the provider body.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - crates/betterlite-openai/**
  - tools/oracle/cases/routing/fallback-plans/**
  - tools/oracle/src/router_probes/fallback_plans/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/fallback_plans.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/fallback_event_handlers.py#L157-L480
  why: Target identity, disable flags and lookup precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L7272-L7540
  why: Ordinary, context and content-policy chain selection.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the fallback_plans prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
- text: Routing controls have valid and invalid chat parser corpus seeds and are consumed before upstream
    serialization.
  proof:
  - chat-corpus
  - oracle
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(fallback_plans)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
  - id: chat-corpus
    why: routing request controls lack chat parser corpus coverage or replay fails
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
oracle_cases:
- tools/oracle/cases/routing/fallback-plans/exact-before-wildcard.yaml
- tools/oracle/cases/routing/fallback-plans/preselected-tier-before-alias.yaml
- tools/oracle/cases/routing/fallback-plans/provider-stripped-name.yaml
- tools/oracle/cases/routing/fallback-plans/empty-chain-disables.yaml
- tools/oracle/cases/routing/fallback-plans/request-override.yaml
- tools/oracle/cases/routing/fallback-plans/parameterized-target-identity.yaml
- tools/oracle/cases/routing/fallback-plans/cycle-and-depth.yaml
- tools/oracle/cases/routing/fallback-plans/context-versus-content-chain.yaml
deviations: []
out_of_scope:
- Executing the plan or checking per-target authorization.
pitfalls:
- A wildcard must not shadow a later specifically keyed chain.
- The same model with different target parameters can be a distinct attempt.
- Validate graph size and request overrides before traversal.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
