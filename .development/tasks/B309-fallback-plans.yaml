deviations: []
out_of_scope:
- Executing the plan or checking per-target authorization.
- B399 owns fallback category and successor decisions; consume its tested public interface.
- 'litellm/router_utils/fallback_event_handlers.py: B308 owns: _trigger_cooldown_for_failed_deployment
  (L46-L154).'
- 'litellm/router_utils/fallback_event_handlers.py: B310 owns: _get_fallback_target_model_group (L498-L502),
  _is_fallback_target_authorized (L505-L526), _is_fallback_target_within_budget (L529-L545), references_provider_scoped_resource
  (L548-L567), creates_provider_scoped_resource (L570-L579), run_async_fallback (L582-L719), _check_non_standard_fallback_format
  (L778-L802), run_non_standard_fallback_format (L805-L806).'
- 'litellm/router_utils/fallback_event_handlers.py: B398 owns: log_success_fallback_event (L722-L747),
  log_failure_fallback_event (L750-L775).'
pitfalls:
- A wildcard must not shadow a later specifically keyed chain.
- The same model with different target parameters can be a distinct attempt.
- Validate graph size and request overrides before traversal.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
