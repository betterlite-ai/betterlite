id: B309
title: Resolve fallback chains and attempt identities
description: 'Add typed ordinary, context-window and content-policy fallback plans, including request-local
  overrides and parameterized targets. Resolve lookup names and wildcard chains, validate bounded configuration
  and track canonical attempted targets in one request-owned set. This part returns a plan and successor
  targets; B310 makes provider calls. Use B013 facts where capacity fallback selection needs model limits.
  Configuration boundary keys introduced or consumed here: fallbacks, context_window_fallbacks, content_policy_fallbacks,
  default_fallbacks, max_fallbacks, ROUTER_MAX_FALLBACKS. Pinned declaration defaults: fallbacks=[]; context_window_fallbacks=[].
  Resolve env values once in betterlite-config, never in router code. max_fallbacks defaults to ROUTER_MAX_FALLBACKS=5
  from the environment; fallbacks/context_window_fallbacks/content_policy_fallbacks default to empty lists
  and default_fallbacks is absent. Preserve empty per-request chains and the pinned depth counter. Consume
  B399 category/successor contracts and implement only chain lookup and canonical target identity. Implement
  the owned native service in crates/betterlite-router/src/fallback_plans.rs. Add ProbeOperation::FallbackPlans
  in tools/oracle/src/router_probes/mod.rs and the corresponding B309 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_utils/fallback_event_handlers.py:
  fallback_attempt_key (L157-L179), AttemptedFallbackTargets.__contains__ (L196-L197), AttemptedFallbackTargets.record
  (L199-L200), has_unattempted_fallback_target (L203-L212), _check_stripped_model_group (L215-L237), _provider_prefixed_model_group
  (L240-L244), record_pre_routing_selection (L251-L268), clear_pre_routing_selection (L271-L285), get_pre_routing_selection
  (L288-L292), carry_over_pre_routing_selection (L295-L304), per_request_fallback_controls (L332-L335),
  mid_stream_fallback_hop_kwargs (L338-L362), record_disable_fallbacks (L368-L385), fallbacks_disabled_for_request
  (L388-L394), fallback_lookup_groups (L397-L413), _resolved_a_specific_chain (L416-L423), get_fallback_model_group_for_lookup_groups
  (L426-L438), get_fallback_model_group (L441-L480). Implement these behaviors through the typed Rust
  services above; synchronous facades and structural accessors reuse the same primitive instead of separate
  ports.'
