pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_agentcore_request in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_agentcore_request.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_agentcore_request.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
