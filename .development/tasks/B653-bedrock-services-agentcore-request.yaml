      Expected format: ''model=bedrock/agentcore/arn:aws:bedrock-agentcore:region:account:runtime/runtime_id''.
      Returned remainder is otherwise unvalidated. Region extraction requires at least four colon pieces and returns
      fourth including empty; fewer -> ValueError Invalid ARN format: {arn}. No ARN service/account or region-regex
      validation.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_request_cases::case_[0-9]+_runtime_arn_required$/)'
  - id: case-arn-region
    why: URL uses optional_params.aws_bedrock_runtime_endpoint when truthy, else https://bedrock-agentcore.{arn_region}.{B198
      partition DNS}. Ignore api_base and AWS region override for URL selection; do not call B591 runtime endpoint
      resolver. Append /runtimes/{quote(full_arn,safe="")}/invocations without trimming an endpoint trailing slash.
      Signing region still follows B595 inputs, so may differ from ARN URL region.
