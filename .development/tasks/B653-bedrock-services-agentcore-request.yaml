      Always overwrite X-Amzn-Bedrock-AgentCore-Runtime-Session-Id in supplied headers. Inject UUID and preserve
      short caller IDs.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_request_cases::case_[0-9]+_runtime_session_id$/)'
  - id: case-runtime-user-id
    why: Return optional runtimeUserId including None/empty; only a truthy value overwrites X-Amzn-Bedrock-AgentCore-Runtime-User-Id.
      An existing caller header remains when runtimeUserId is absent/falsey. Neither identifier is added to request
      payload.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_request_cases::case_[0-9]+_runtime_user_id$/)'
  - id: case-multimodal-forwarding
