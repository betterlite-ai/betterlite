id: B653
title: Bedrock AgentCore invocation preparation
description: >-
  Add AgentCoreRequest with runtime ARN, qualifier, session/user identifiers and explicit multimodal forwarding
  policy. Preserve percent-encoded runtime paths, region-from-ARN and bedrock-agentcore signing service. Stream
  capability is separate from the stream flag in the body.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/agentcore/transformation.py:
  AmazonAgentCoreConfig.__init__ L55-L57; AmazonAgentCoreConfig.get_supported_openai_params L59-L63; AmazonAgentCoreConfig.map_openai_params
  L65-L75; AmazonAgentCoreConfig.get_complete_url L77-L114; AmazonAgentCoreConfig.sign_request L116-L156; AmazonAgentCoreConfig._get_agent_runtime_arn
  L158-L169; AmazonAgentCoreConfig._extract_region_from_arn L171-L180; AmazonAgentCoreConfig._get_runtime_session_id
  L182-L194; AmazonAgentCoreConfig._get_runtime_user_id L196-L203; AmazonAgentCoreConfig.transform_request L205-L271;
  AmazonAgentCoreConfig._should_forward_multimodal_content L274-L292; AmazonAgentCoreConfig.has_custom_stream_wrapper
  L974-L976; AmazonAgentCoreConfig.supports_stream_param_in_request_body L979-L984; AmazonAgentCoreConfig.validate_environment
  L1053-L1063; AmazonAgentCoreConfig.get_error_class L1065-L1066; AmazonAgentCoreConfig.should_fake_stream L1068-L1075.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: runtime_arn_required: Split model once on slash; require prefix agentcore and two pieces
  or ValueError Invalid model format. Expected format: 'model=bedrock/agentcore/arn:aws:bedrock-agentcore:region:account:runtime/runtime_id'.
  Returned remainder is otherwise unvalidated. Region extraction requires at least four colon pieces and returns
  fourth including empty; fewer -> ValueError Invalid ARN format: {arn}. No ARN service/account or region-regex
  validation. arn_region: URL uses optional_params.aws_bedrock_runtime_endpoint when truthy, else https://bedrock-agentcore.{arn_region}.{B198
  partition DNS}. Ignore api_base and AWS region override for URL selection; do not call B591 runtime endpoint resolver.
  Append /runtimes/{quote(full_arn,safe="")}/invocations without trimming an endpoint trailing slash. Signing region
  still follows B595 inputs, so may differ from ARN URL region. runtime_session_id: Truthy runtimeSessionId is returned
  unchanged with no 33-character minimum check; otherwise litellm-session-{uuid4}. Always overwrite X-Amzn-Bedrock-AgentCore-Runtime-Session-Id
  in supplied headers. Inject UUID and preserve short caller IDs. runtime_user_id: Return optional runtimeUserId
  including None/empty; only a truthy value overwrites X-Amzn-Bedrock-AgentCore-Runtime-User-Id. An existing caller
  header remains when runtimeUserId is absent/falsey. Neither identifier is added to request payload. multimodal_forwarding:
  Base payload always prompt = B218 convert_content_list_to_str(last message); empty messages retains indexing error.
  forward_multimodal_content defaultsFalse; inspect optional_params then litellm_params, skip nondicts/None, first
  supplied value wins. Trim/lower string true only 1,true,yes,on; other values use Python truthiness. Only when
  enabled AND last content is a list with a dict whose type is neither None nor text, add a shallow copy of the
  entire content list, including text/unknown blocks. Empty, text-only, missing-type lists do not add content. Forward
  URL descriptors unchanged without downloading. qualifier_query: If qualifier key exists append ?qualifier={Python
  string value}, including empty or None -> None; no URL encoding or truthiness check. Other optional fields do
  not appear in payload. Preserve raw query characters at the URL construction seam. stream_body_policy: Supported
  OpenAI params [], mapping returns original optional map unchanged; has_custom_stream_wrapper=True,supports_stream_param_in_request_body=False,should_fake_stream=False.
  validate_environment returns headers; error factory B682 preserves input values. Initialize BaseConfig B2202 and
  BaseAWS B590. agentcore_bearer_signing: Always overwrite Accept with application/json, text/event-stream. Choose
  truthy explicit api_key then optional_params.api_key; if truthy overwrite Content-Type application/json and Authorization
  Bearer {token}, serialize request_data to UTF-8 JSON, and skip AWS credentials/signing. Explicit empty key permits
  optional fallback. The source debug log exposes token[:50]; betterlite emits only the authentication mode per
  the deviation. agentcore_iam_signing: Without a truthy selected JWT, delegate B595 _sign_request service_name
  bedrock-agentcore with all original args, including api_key and fake_stream, after setting Accept. Preserve shared
  AWS header precedence and credential selection; do not force a second regional policy or drop caller session/user
  headers.


  Load forward_multimodal_content, runtimeSessionId, runtimeUserId, qualifier through betterlite-config, with injected
  environment lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs
  use litellm_settings. Add config rstest agentcore_request_config_cases; each named loads_<key> case invokes the
  real B002 loader, checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  These deployment fields default respectively False,None,None,None; they have no dedicated environment variables.
  Reuse B591 aws_bedrock_runtime_endpoint, B590 AWS credentials and the existing api_key config owner; forward_multimodal_content
  strings are interpreted by the policy above, not bool(nonempty string).


  Implement crates/betterlite-bedrock/src/agentcore_request.rs with adjacent tests under agentcore_request/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agentcore_request_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): runtime_arn_required, arn_region, runtime_session_id, runtime_user_id, multimodal_forwarding, qualifier_query,
  stream_body_policy, agentcore_bearer_signing, agentcore_iam_signing. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_agentcore_request* using HelperCase:
  kind: helper and the externally tagged bedrock_services_agentcore_request variant inside call. Do not put the
  Python stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_agentcore_request
  that parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on
  zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_agentcore_request_credential_identity_isolation in betterlite-bedrock for this
  Rust-specific invariant; it is not a Python oracle case.


  Write standalone bedrock_services_agentcore_request_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 208 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 285 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 100 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 770 planned, 775 maximum changed lines.
