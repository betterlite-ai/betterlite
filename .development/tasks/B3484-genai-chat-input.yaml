id: B3484
title: Translate GenAI input to chat messages and options
description: >-
  Build the input adapter in crates/betterlite-core::api, translating native Google GenAI
  generate_content request contents, system instructions, function declarations and generation
  options into chat completion messages and parameters. Preserve schema alias precedence,
  provider capability checks, first-system-part selection, inline_data spelling for base64
  images, unknown-mode default to auto, dropped topK, and caller-independent schema cleanup.

  The adapter receives Google GenAI request parameters (model, contents, systemInstruction,
  tools, toolConfig, generationConfig with temperature/maxOutputTokens/topP/topK/stopSequences,
  plus custom parameters). It constructs an OpenAI-format completion request with messages,
  temperature, max_tokens, top_p, stop, tools, tool_choice, and response_format (when
  supported). Schema fields propertyOrdering and property_ordering are always removed from
  JSON schemas as Gemini-only extensions. Tools transformation preserves the first-system-part
  selection: if systemInstruction exists and has parts with text, the first such text becomes
  the OpenAI system message, and all messages after include the system message index. Response
  format checks model capability and drops it if the provider does not support response_format.
  Unknown tool_config modes default to auto, and topK in generationConfig is never forwarded.

  Owned implementation:
  - Request-side constants and private records (TypedDict definitions for GenAI structures,
    empty-mapping constant, response mime type keys, schema keys, tool parameter keys,
    Gemini-only schema keys, validators for configs and JSON objects, string mappings).
  - Helper functions for validation: first present in config keys, validated pydantic adapter
    wrapping, response format translation with schema normalization, provider response_format
    support check.
  - Adapter constructor and main entry point translate_generate_content_to_completion, which
    orchestrates the entire input transformation.
  - Generic parameter forwarding from litellm_params to the completion request.
  - Tool transformation: Google GenAI tools to OpenAI format, including function name,
    description and JSON schema parameters, then schema normalization.
  - Tool config transformation: Google GenAI functionCallingConfig modes (AUTO/ANY/NONE) to
    OpenAI tool_choice values (auto/required/none).
  - Contents to messages transformation: Google GenAI contents list to OpenAI messages list,
    handling user messages with text/inline_data parts and functionResponse parts,
    model (assistant) messages with text and functionCall parts, system instruction extraction,
    role mapping, and part assembly into multimodal or string-only formats.

  Reuse existing validation: B200 provides normalize_json_schema_types and normalize_tool_schema
  for schema cleanup and tool normalization; B175 provides get_supported_openai_params for the
  provider capability check; B174 provides get_llm_provider for model and provider resolution;
  B219 provides filter_value_from_dict for removing Gemini-only keys from schemas.

  JSON/schema byte decoding must use bounded existing parsers and receive replay cases where
  this slice adds accepted shapes (e.g., malformed inline_data, malformed tool arguments).

