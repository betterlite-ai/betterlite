id: B071
title: Verify budgets, reservation cleanup and scheduled resets through the proxy
description: >-
  Finish the budget umbrella with the integration evidence its lower parts could
  not provide. B9240 supplies the missing reset-job coordinator. B8481 builds the
  budget services, B8610 shares them, B8660 connects auth and reservation inputs,
  B8662 starts settlement, B8680 installs release middleware and B8372 schedules
  resets. Use those production paths once each. This task adds HTTP oracle cases
  and a stateful HTTP test driver inside betterlite-oracle; it registers no route,
  callback, middleware or scheduler job and reimplements none of the budget engines.

  Put the driver in tools/oracle/src/budget_http.rs and budget_http/tests/ with its
  tests in tests.rs. The skeleton declares the module; do not edit the oracle's
  lib.rs or any shared registry. Reuse gateway::start, process::Gateway, http::send,
  the comparison/artifact functions, B860's PostgresFixture and B1690's OracleRedis.
  Existing tokio-postgres dev support can seed additional pinned columns in each
  isolated database using parameterized fixture SQL, without extending the shared
  fixture schema. Launch the actual betterlite binary and MIT LiteLLM, each with
  its own database, Redis and mock-provider transcript. Always compare different
  implementations, never --self-check. Cleanup must stop both gateways before
  dropping fixtures, including after a failed assertion. No helper calls FastAPI
  or patches proxy globals. No new byte decoder or dependency is needed.

  Static cases are kind: http under tools/oracle/cases/http/budget-lifecycle/. Use
  their existing steps/captures support to POST /key/generate with the master key,
  capture the returned secret, and call POST /v1/chat/completions with that key.
  These are existing paths, with no new aliases. Use a configured OpenAI gpt-4o-mini
  deployment and the local mock provider, fixed messages and usage. Choose a
  positive max_budget below the estimate for max_tokens 1000 but above zero, with
  initial spend zero so ordinary read-time admission passes. strict-estimate-blocked
  enables general_settings.fail_closed_budget_enforcement and must reject before
  any provider request. partial-headroom-served uses the default false and serves
  the same request after reservation resizing. unbilled-model-list uses the same
  key and strict config for GET /v1/models; no reservation is taken. These cases
  complement B1225's flag/handoff cases and B8660's zero-model-cap cases rather
  than duplicating them. Preserve full status, error type, param, code and
  content-type; ignore /error/message only for betterlite's wording. The default
  BudgetExceededError status is 422 by default, from
  litellm.budget_exceeded_status_code; it is not the session hook's HTTP 429.

  session-zero-cap and session-without-id configure a registry agent with
  litellm_params.max_budget_per_session equal to zero and create a key whose agent_id
  identifies it. Both call the normal chat route, not an A2A invocation: the hook
  reads the authenticated agent_id, not invoked_agent_id. With metadata.session_id
  present, the first returns the pinned 429 budget rate-limit envelope with no
  upstream call; with that field absent, the second reaches the mock provider.
  Keep the registry's normal AgentResponse config shape. B3007 supplies the hook,
  B8613 supplies the config registry and B8742/B8399 register it. Its TTL defaults
  to LITELLM_MAX_BUDGET_PER_SESSION_TTL=3600; this task does not add another parser.

  Timing-dependent comparisons belong in the stateful driver, using the same real
  HTTP requests and ordinary oracle comparison. Write named tests under
  budget_http::tests::reservations, ::models, ::fallbacks and ::resets. Test support
  owns a bounded observation loop, at most 30 seconds per transition and 100 ms
  between observations, and fails with the two peer transcripts when the expected
  state never arrives. Do not compare asynchronous intermediate states or sleep a
  fixed amount and assume settlement completed. Observe counters read-only through
  the isolated Redis and persisted rows through the fixture connections. Driver
  observations must never repair a counter or invoke the reset job themselves.

  Reservations: reservation_success_http reserves a much larger output ceiling
  than the mock response uses, waits for settlement, and compares the next chat
  response plus GET /key/info?key=<captured-key> and the counter value. The spent
  amount must be actual response cost once, not the reservation, zero, or twice
  the cost. reservation_failure_http makes the provider refuse a first call
  with retries disabled, then succeeds on a second request using the same key;
  compare both responses and verify the failed reservation left no spend. Run
  both with Redis and memory-only, using SQL/key info for observations in the latter.
  unbound_release_adapters composes the production B8270 layer, B1225 handoff and
  B8481 releaser over real counter services with an inner service that produces
  no logged LLM call: only the handler is a test double, never the release port.
  Prove it releases after both an ordinary result and an error, and that an actual
  callback-bound reservation is left for settlement. This internal layer test
  supplements HTTP failure cleanup without inventing a public test endpoint.
  unbound_cancel_http exercises the real unbound route as well: POST to B086's
  /batches/{batch_id}/cancel, /v1/batches/{batch_id}/cancel and
  /{provider}/v1/batches/{batch_id}/cancel aliases, with provider openai, a
  B1019 model-encoded batch ID and a JSON model matching the priced deployment.
  The auth body supplies the reservation estimate; cancellation routes by the ID.
  A test-owned upstream barrier holds the cancellation response until a read-only
  Redis observation proves the reservation exists, then returns the same valid
  cancelling Batch response on each peer. After the response, observe zero spend
  and compare a subsequent chat; this must fail if the installed release layer
  is omitted. Do not use an executed-batch ID, whose MIT path requires an
  unavailable enterprise managed-store hook.

  Models: model_charge_http uses a positive model_max_budget and
  positive mock usage. Await the real success callback's counter write, then send
  a second request that the shared limiter refuses. Compare the refusal, upstream
  call count and /key/info model_max_budget_usage with the reference, proving that
  B3005/B3006/B3016 and the auth slots share counters and do not double-register
  charging. session_charge_http uses an agent key and a positive
  session budget smaller than one completion's cost; after charging, the same
  session is refused and a different session passes. The native layer test and
  these two HTTP tests must fail if the relevant shared adapter is replaced by a
  fresh limiter or a no-op, even when ordinary successful chat still works.

  Fallbacks: fallback_paid_target_http seeds a key already at its max_budget and
  configures a zero-priced primary with a paid fallback. The primary is permitted
  by auth and the mock makes it fail; the paid target must not be contacted. The
  fallback_policy_disabled_http case makes exactly that request with
  general_settings.enforce_fallback_budget=false and compares the successful paid
  fallback and provider transcript. The default is true. Use B310's real fallback
  stage and B3008's predicate, including its request auth metadata. Both startup
  and a router first created by deployment sync must install that predicate;
  their owners are B8613 and B8381, whose prerequisite corrections are recorded
  in the planning report. This task does not silently install a test-only predicate.

  Resets: scheduled_reset_http has named rstest cases key, user, team,
  linked_tier and key_window, each seeding one exhausted budget with an already
  due timestamp and a valid positive duration. Start with a bounded scheduler
  interval using general_settings.proxy_budget_rescheduler_min_time=1 and
  proxy_budget_rescheduler_max_time=1,
  general_settings.scheduled_job_stagger.enabled=false, rollover false,
  and seed future reset times for unrelated budgets. The real B8372 tick calls
  B9240, advances the row/window and invalidates the old counters; poll those
  effects, then compare a paid chat and /key/info against LiteLLM. Check all five
  cases independently so omitting any phase fails. A reset_foreign_lease_http test seeds
  another owner's cronjob_lock:reset_budget_job with a long TTL in each fixture,
  verifies the exhausted request stays refused across two observed scheduler
  ticks, then removes that test-owned lease, waits for reset and verifies admission
  opens. reset_disabled_http uses general_settings.disable_reset_budget=true and a
  due row: it remains unchanged across the same bounded observation period.
  These tests exercise the scheduled job, not POST /reset_budget or the manual
  /key/{key}/reset_spend endpoint, which have different owners and semantics.

  No new config keys are supported here. Use existing sections and fail if the
  booted config cannot consume one. The driver may keep test-only lifecycle helpers
  under tests/ so they are not exported as a second runtime. Keep ordinary source
  files below 300 lines; reuse the existing fixture lifecycle to keep this near
  200 case lines and 600 test/support lines, without porting the already-owned
  1700-line reservation engine again.
scope:
  paths:
    - tools/oracle/src/budget_http.rs
    - tools/oracle/src/budget_http/**
    - tools/oracle/cases/http/budget-lifecycle/**
  lint_tables: false
references:
