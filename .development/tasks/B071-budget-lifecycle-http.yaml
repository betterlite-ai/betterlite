    why: Integration specification only; B3004 and B8480 own throttle policy, resizing, strict admission and reservation construction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/budget_reservation.py#L350-L478
    why: B3003's settlement, finalized and callback_bound decisions whose real HTTP composition is missing.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/budget_reservation_release_middleware.py#L19-L33
    why: B8270 owns this layer; B8680 installs it, and the integration test must call its real release adapter.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/batches_endpoints/endpoints.py#L1017-L1142
    why: B086's existing cancel route decorators and model-encoded dispatch supply the unbound-reservation HTTP test, not another route registration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/reset_budget_job.py#L454-L552
