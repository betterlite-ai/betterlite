  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L10628-L10645
    why: B8372's scheduled caller, distinct from the manual reset routes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/max_budget_per_session_limiter.py#L86-L206
    why: B3007's agent/session lookup, zero-cap refusal and positive-cost callback need booted coverage.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/model_max_budget_limiter.py#L298-L340
    why: B3006's shared limiter state and auth-time read use the callback's cache.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/fallback_budget.py#L75-L166
    why: B3008's live enforcement setting, free-target exception and fail-closed budget predicate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6992-L7003
    why: Context for B8613's required startup installation of the existing fallback budget predicate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7480-L7494
