  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_exception_handler.py#L47-L57
    why: Existing auth error translation retains the budget error status and emits budget_exceeded with null param.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L407-L409
    why: The pinned budget_exceeded_status_code default is 422.
dod:
  - text: The five new kind-http cases compare strict versus resized admission, unbilled model listing and session zero-cap versus missing-session behavior through actual protected routes.
    proof: [http-cases, oracle]
  - text: Reservation success/failure HTTP transcripts and the native unbound-layer test prove actual-cost settlement, retry after release and callback-bound ownership over the production adapters.
    proof: [reservation-tests]
  - text: A successful completion changes the model and session limits enforced by the next HTTP request, with one charge and the reference usage report.
    proof: [model-tests]
  - text: A free primary cannot spend on a paid fallback under the default policy, and the explicit enforcement switch restores the pinned fallback behavior.
    proof: [fallback-tests]
  - text: Every scheduled reset phase restores HTTP admission, an observed foreign lease suppresses the tick, removing it permits a reset, and disable_reset_budget suppresses resets.
    proof: [reset-tests]
checks:
  optional: []
  commands:
    - id: http-cases
      why: No new booted HTTP cases were added, or the files are helper cases in disguise.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/budget-lifecycle)"
        && grep -rlq '^kind: http$' tools/oracle/cases/http/budget-lifecycle
    - id: reservation-tests
      why: The real gateways or the production unbound release composition leave reserved spend behind or settle it twice.
      run: cargo build --locked -p betterlite && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::reservation_success_http(::|$)/) | test(/::reservation_failure_http(::|$)/) | test(/::unbound_release_adapters(::|$)/) | test(/::unbound_cancel_http(::|$)/)'
    - id: model-tests
      why: Model/session callbacks and the next auth check use different counters or charging is missing.
      run: cargo build --locked -p betterlite && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::model_charge_http(::|$)/) | test(/::session_charge_http(::|$)/)'
    - id: fallback-tests
      why: The booted router omits its budget predicate or ignores the configured enforcement setting.
      run: cargo build --locked -p betterlite && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::fallback_paid_target_http(::|$)/) | test(/::fallback_policy_disabled_http(::|$)/)'
    - id: reset-tests
      why: A reset phase is never scheduled, never changes admission, ignores contention or runs despite disable_reset_budget.
      run: cargo build --locked -p betterlite && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::scheduled_reset_http(::|$)/) | test(/::reset_foreign_lease_http(::|$)/) | test(/::reset_disabled_http(::|$)/)'
oracle_cases:
  - tools/oracle/cases/http/budget-lifecycle/strict-estimate-blocked.yaml
  - tools/oracle/cases/http/budget-lifecycle/partial-headroom-served.yaml
  - tools/oracle/cases/http/budget-lifecycle/unbilled-model-list.yaml
  - tools/oracle/cases/http/budget-lifecycle/session-zero-cap.yaml
  - tools/oracle/cases/http/budget-lifecycle/session-without-id.yaml
deviations: []
out_of_scope:
  - "budget_reservation.py L47-L70 and L1695-L1716: B3000 owns _BudgetCounter, entity names, _to_float, _to_int and _get_value."
  - "budget_reservation.py L73-L97, L151-L222 and L910-L1095: B3004 owns BudgetReservationUnavailableError, _raise_reservation_unavailable, _key_reservation_should_release_for_throttle, _apply_over_budget_reservation_policy, _raise_counter_budget_exceeded, _initialize_reservation_counters, _loaded_reservation_counters, _reservation_counter_loaded, _initialize_reservation_counter, _reserve_reservable_counters, _reservation_groups, _reserve_counters and _get_current_counter_value."
  - "budget_reservation.py L100-L106, L350-L478 and L1098-L1265: B3003 owns get_reserved_counter_keys, reconcile_budget_reservation, stamp_budget_reservation_actual_cost, release_budget_reservation, release_budget_reservation_on_cancel, invalidate_budget_reservation_counters, release_or_invalidate_budget_reservation, release_unbound_budget_reservation, _counters_batch_scope, _EntryAdjustment, _entry_adjustment, _set_reserved_entries_actual_cost, _reseed_reserved_entry, _counter_can_apply_adjustment, _release_applied_entries_best_effort, _resize_applied_reservation, _counter_to_reservation_entry and _get_entry_reserved_cost."
  - "budget_reservation.py L109-L148 and L225-L347: B8480 owns _start_reservation_lease_renewal, _renew_reservation_lease, _is_token_counting_route, _is_unbilled_route and reserve_budget_for_request."
  - "budget_reservation.py L481-L891: B3002 owns _get_budget_counters, _get_end_user_budget_counter, _get_tag_budget_counters, _get_model_access_group_budget_counters, _model_access_group_counter, _dedupe_tags, _get_team_member_budget_counter, _get_org_budget_counter, _get_project_budget_counter and _get_budget_limit_counters."
  - "budget_reservation.py L894-L907 and L1268-L1296: merged B2325 owns _coerce_window, get_budget_window_start and _coerce_datetime; B2361 also claims them and needs the architect's duplicate-ownership correction."
  - "budget_reservation.py L1299-L1692: B3001 owns estimate_request_max_cost, estimate_request_input_cost, _estimate_request_input_cost_for_model, _input_cost_for_cost_info, _estimate_request_max_cost_for_model, _max_cost_for_cost_info, _estimate_image_generation_cost, _get_model_cost_info, _get_model_cost_infos, _deployment_tiered_pricing_table, _get_deployment_tiered_pricing_tables, _get_request_models, count_request_input_tokens, _estimate_input_tokens, _estimate_output_tokens, _requested_output_tokens, _get_output_multiplier and _is_input_only_route."
  - "budget_reservation_release_middleware.py: both __init__ and __call__ are B8270; B8680 owns installation. B8481 owns its concrete releaser and settlement adapters, and B8660 supersedes B732's old BudgetAdmission handoff by removing that unused port."
  - "reset_budget_job.py is assigned to B9240 and B3009-B3013, including every phase and helper; B8372 owns the scheduled caller. B071 writes only their integration tests."
  - "Model budget algorithms and increments are B3005/B3006/B3016; session algorithms and rate-limit context are B3007/B3017; fallback policy is B3008, execution B310, router construction B8613/B8381."
  - "B773 and B778 own /key/generate and /key/info, B003/B8630 own chat routing, and B8660 already owns the three HTTP zero-model-cap cases. No existing route or case file moves here."
  - "B086 owns cancel_batch and its three route aliases, and B1019 owns the model-encoded ID codec. This task only supplies the missing reservation lifecycle comparison through them."
pitfalls:
  - A cap of zero is skipped by reservation counter collection, so use a positive cap to prove estimate-versus-headroom admission.
  - Invoking an A2A agent sets invoked_agent_id, whereas MaxBudgetPerSessionHandler reads the key's agent_id.
  - The fixed reset lease lasts 900 seconds; do not confuse its TTL with the scheduler interval configured to one second for tests.
  - Successful HTTP delivery can precede the asynchronous charge; wait for an observed state transition before asserting the next refusal.
  - The model limiter and session limiter produce different error paths, so compare their actual envelopes rather than normalizing both to one budget error.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
