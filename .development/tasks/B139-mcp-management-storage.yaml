dod:
  - text: A server created through the admin route is what the catalog, health, access groups and registry.json read back, and update, public, unpin and delete each show in those reads.
    proof: [server-lifecycle-case, oracle]
  - text: A team member's submission stays out of the live lists while pending, holds its name against an admin create, and appears for its submitter only after approval.
    proof: [submission-review-case, oracle]
  - text: Deleting a BYOK server removes its stored user keys, so the same id created again starts with none.
    proof: [byok-delete-cleanup-case, oracle]
  - text: Only a mint-relevant server edit purges stored OAuth tokens, and the purge keeps BYOK keys.
    proof: [oauth-token-purge-case, oracle]
  - text: Per-user env var values written for a server show in its status until the server is deleted, and not after it is created again.
    proof: [env-var-cleanup-case, oracle]
  - text: An OAuth session draft feeds access groups but stays out of the server list and submissions, holds no name, and leaves a saved server it re-authorizes unchanged.
    proof: [oauth-session-draft-case, oracle]
checks:
  optional: []
  commands:
    - id: server-lifecycle-case
      why: each mount's own cases never read one family's write back through another family
      run: test -f tools/oracle/cases/http/mcp-management-storage/server-lifecycle.yaml && grep -q '^database:' tools/oracle/cases/http/mcp-management-storage/server-lifecycle.yaml && grep -qF '/v1/mcp/registry.json' tools/oracle/cases/http/mcp-management-storage/server-lifecycle.yaml
    - id: submission-review-case
      why: no mount has a register case, and review cases stop at the missing database
      run: test -f tools/oracle/cases/http/mcp-management-storage/submission-review.yaml && grep -q '^database:' tools/oracle/cases/http/mcp-management-storage/submission-review.yaml && grep -qF '/v1/mcp/server/register' tools/oracle/cases/http/mcp-management-storage/submission-review.yaml
    - id: byok-delete-cleanup-case
      why: a stale BYOK row after delete would hand an old key to a new server with the same id
      run: test -f tools/oracle/cases/http/mcp-management-storage/byok-delete-cleanup.yaml && grep -q '^database:' tools/oracle/cases/http/mcp-management-storage/byok-delete-cleanup.yaml && grep -qF '/user-credentials' tools/oracle/cases/http/mcp-management-storage/byok-delete-cleanup.yaml
    - id: oauth-token-purge-case
      why: the purge spans an admin write and a per-user read that live in different mounts
      run: test -f tools/oracle/cases/http/mcp-management-storage/oauth-token-purge.yaml && grep -q '^database:' tools/oracle/cases/http/mcp-management-storage/oauth-token-purge.yaml && grep -qF '/oauth-user-credential/status' tools/oracle/cases/http/mcp-management-storage/oauth-token-purge.yaml
    - id: env-var-cleanup-case
      why: env var cleanup on delete is only visible through the user routes after a re-create
      run: test -f tools/oracle/cases/http/mcp-management-storage/env-var-lifecycle.yaml && grep -q '^database:' tools/oracle/cases/http/mcp-management-storage/env-var-lifecycle.yaml && grep -qF '/v1/mcp/user-env-vars/status' tools/oracle/cases/http/mcp-management-storage/env-var-lifecycle.yaml
    - id: oauth-session-draft-case
      why: draft rows share the server table with saved and submitted rows and must not leak into them
      run: test -f tools/oracle/cases/http/mcp-management-storage/oauth-session-draft.yaml && grep -q '^database:' tools/oracle/cases/http/mcp-management-storage/oauth-session-draft.yaml && grep -qF '/v1/mcp/server/oauth/session' tools/oracle/cases/http/mcp-management-storage/oauth-session-draft.yaml
oracle_cases:
  - tools/oracle/cases/http/mcp-management-storage/server-lifecycle.yaml
  - tools/oracle/cases/http/mcp-management-storage/submission-review.yaml
  - tools/oracle/cases/http/mcp-management-storage/byok-delete-cleanup.yaml
  - tools/oracle/cases/http/mcp-management-storage/oauth-token-purge.yaml
  - tools/oracle/cases/http/mcp-management-storage/env-var-lifecycle.yaml
  - tools/oracle/cases/http/mcp-management-storage/oauth-session-draft.yaml
deviations: []
out_of_scope:
  - "B4711 builds _get_prisma_client_or_none and get_prisma_client_or_throw."
  - "B4716 builds _HasServerId and does_mcp_server_exist (only tests call it at the pin), the validate_tool_name fallback, _validate_mcp_server_name_fields, _validate_upstream_token_header, validate_and_normalize_mcp_server_payload, mcp_identifier_conflict_message, raise_mcp_identifier_conflict, warn_if_id_jag_server_outruns_sso, stamp_omitted_oauth2_flow, _VALID_MCP_REQUIRED_FIELDS and _validate_mcp_required_fields."
  - "B4717 builds _redact_mcp_credentials, _preserved_admin_config_credentials, _redact_mcp_credentials_list, _user_is_full_admin, _resolve_credential_target_user_id, _is_restricted_virtual_key_request, _sanitize_mcp_server_for_non_admin, _sanitize_mcp_server_list_for_non_admin, _sanitize_mcp_server_for_virtual_key, _sanitize_mcp_server_list_for_virtual_key, _INHERITED_CREDENTIAL_FIELDS, _has_non_admin_config_credentials, _inherit_credentials_from_existing_server, _get_user_mcp_management_mode, _resolve_accessible_mcp_servers and _authorize_and_fetch_mcp_server."
  - "B4718 builds TEMPORARY_MCP_SERVER_TTL_SECONDS, TEMPORARY_MCP_SERVER_REDIS_KEY_PREFIX, _TemporaryMCPServerEntry, _prune_expired_temporary_mcp_servers, _cache_temporary_mcp_server, _cache_temporary_mcp_server_in_redis, _get_temporary_mcp_server_from_redis, _persist_draft_mcp_server, _get_draft_mcp_server_as_mcp_server, get_cached_temporary_mcp_server, _resolve_session_server_id, _build_temporary_mcp_server_record, add_session_mcp_server and _get_cached_temporary_mcp_server_or_404."
  - "B4719 builds _mcp_oauth_user_api_key_auth, mcp_authorize, mcp_token and mcp_register."
  - "B4720 builds DEFAULT_MCP_REGISTRY_VERSION, _is_public_registry_enabled, _build_registry_remote_url, _build_mcp_registry_server_name, _McpRegistryRemote, _McpRegistryEntry, _build_mcp_registry_entry_for_server, _build_builtin_registry_entry, get_mcp_tools, get_mcp_access_groups, get_client_ip, get_mcp_registry, _mcp_server_display_order, _get_team_scoped_mcp_server_list, _connected_app_reachable_server_ids, fetch_all_mcp_servers, _mcp_health_status_for_response, health_check_servers, fetch_mcp_server, _MCP_REGISTRY_PATH, _load_mcp_registry, discover_mcp_servers and get_openapi_registry. B4231 (done) built _OPENAPI_REGISTRY_PATH and _load_openapi_registry."
  - "B4721 builds add_mcp_server, import_mcp_servers with its nested _classify and _create, remove_mcp_server, edit_mcp_server and make_mcp_servers_public."
  - "B4722 builds register_mcp_server, get_mcp_server_submissions, pin_mcp_server_tools, unpin_mcp_server_tools, _store_pinned_tools, approve_mcp_server_submission and reject_mcp_server_submission."
  - "B4723 builds store_mcp_user_credential, delete_mcp_user_credential, store_mcp_oauth_user_credential, delete_mcp_oauth_user_credential, get_mcp_oauth_user_credential_status, list_mcp_user_credentials with its nested helpers, and list_mcp_server_user_credentials."
  - "B4724 builds _compute_user_env_var_status, get_mcp_user_env_vars, store_mcp_user_env_vars, clear_mcp_user_env_vars and list_mcp_user_env_var_status."
  - "B4725 builds get_mcp_gateway_sessions, delete_mcp_gateway_sessions, add_mcp_toolset, fetch_mcp_toolsets, fetch_mcp_toolset, edit_mcp_toolset and remove_mcp_toolset."
  - "The /v1/mcp router and every route registration: B8625 catalog and review, B8627 server writes, B8700 user routes, B8701 toolsets and gateway sessions, B8702 OAuth routes and the session route. This task registers none of them again."
  - "MCP_AVAILABLE and the mcp import guard only protect a Python optional import; betterlite has no such import, so nothing is ported."
  - "Single-family behavior and error paths stay with each mount's own cases; toolsets, gateway sessions, import and the OAuth browser legs get no transcript here."
  - "A successful pin needs a live MCP upstream that answers tools/list; it stays with B4722 and B8625, and this task only unpins and checks the pin refusals."
  - "The db.py storage functions these routes call belong to B4710 to B4715."
pitfalls:
  - Point every stored server at http://127.0.0.1:9 so health is unhealthy on both gateways; a mock upstream or a public host makes status and health_check timing differ.
  - server_name and alias may not contain "-" (validate_and_normalize_mcp_server_payload), so names use underscores while server_id keeps hyphens.
  - NewMCPServerRequest and UpdateMCPServerRequest default transport to sse, so a body without transport http stores a different row.
  - Pending and rejected rows hold server_name and alias against a later create; only approval_status draft is skipped by _identifier_where.
  - An admin GET /v1/mcp/server/storage-sub before approval loads the pending row into the live registry (fetch_mcp_server L1777), so pin and the member list stop showing the pending state.
  - Approve clears the submitter's 60 second cache of active submissions and reject does not; the member's list empties after reject only because the reload drops the row from the registry.
  - Without LITELLM_ENABLE_MCP_STDIO=true the stdio register step answers 422 from the body check instead of the handler's 400.
  - Re-sending the same client_id and client_secret in a PUT is not a mint-relevant change and must not purge tokens.
  - DELETE /v1/mcp/server/{server_id} and PUT /v1/mcp/server answer 202, and the delete body is empty.
  - The storage_draft session id is a fresh uuid on each gateway, so ignore it and never feed it into a later URL.
