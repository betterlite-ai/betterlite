id: B139
title: Prove MCP server management and its storage across route families through the booted proxy
description: >-
  This task closes the MCP management umbrella over mcp_management_endpoints.py. Every function in that file
  already has a builder: B4711 the database handle, B4716 payload validation, B4717 redaction and access, B4718
  temporary OAuth sessions, B4719 the OAuth browser legs, B4720 the catalog reads, B4721 server writes, B4722
  submission review and pins, B4723 per-user credentials, B4724 per-user env vars, B4725 toolsets and gateway
  sessions, and B4231 the OpenAPI registry loader. Every route already has a mount: B8625 the catalog and review
  routes, B8627 the server writes, B8700 the credential and env var routes, B8701 toolsets and gateway sessions,
  and B8702 the OAuth browser routes plus POST /v1/mcp/server/oauth/session. Each mount proves its own family.
  None of them proves that a write through one family is what the next family reads back from the same database
  and live registry. This task adds six database-backed HTTP transcripts for exactly that. It registers no
  route, writes no product code and adds no helper adapter.

  Put the six cases in tools/oracle/cases/http/mcp-management-storage. Each is an ordinary case with steps, no
  kind field, `upstream: []` and its own `database:` block. Seed users, keys, teams and memberships with B860's
  fixture rows (keys take the raw token and a role); a case that only needs the master key keeps an empty seed.
  Give every case its own general_settings.master_key (sk-mcp-lifecycle, sk-mcp-review, sk-mcp-byok,
  sk-mcp-purge, sk-mcp-env, sk-mcp-draft) so no two stateful cases ever share a process. Do not set
  database_url and do not turn off schema setup: the runner injects the database, B5076 boots LiteLLM on it with
  Prisma, and both gateways create the MCP tables themselves. Set env PROXY_BASE_URL=https://gateway.example.test
  in every case, so registry urls and setup_url come out fixed. Every stored server points at
  http://127.0.0.1:9/mcp and every OAuth server at http://127.0.0.1:9/oauth/authorize and
  http://127.0.0.1:9/oauth/token. Nothing listens on port 9, so every health probe reports unhealthy on both
  gateways. Every create, register, update and session body states transport http. LiteLLM mounts all of these
  routes lazily under /v1/mcp/ only, so there is no unversioned or provider alias to cover, and the role route
  check lets every key reach them, so each handler does its own authorization.

  server-lifecycle.yaml (master key sk-mcp-lifecycle, general_settings.enable_mcp_registry true). POST
  /v1/mcp/server creates storage-alpha (server_name storage_alpha, a description, auth_type api_key,
  credentials auth_value plus upstream_resource https://api.example.test, mcp_access_groups [storage-readers]):
  201, and the answer keeps only upstream_resource in credentials. Then GET /v1/mcp/server/storage-alpha, GET
  /v1/mcp/server/storage_alpha (name lookup; its health lookup misses, so status differs), GET /v1/mcp/server,
  GET /v1/mcp/server/health?server_ids=storage-alpha, GET /v1/mcp/access_groups, and GET /v1/mcp/registry.json
  with no key (the builtin entry plus storage_alpha at https://gateway.example.test/storage_alpha/mcp). POST
  /v1/mcp/make_public with mcp_server_ids [storage-alpha] (202), then GET by id shows mcp_info.is_public and
  is_public_explicit true. DELETE /v1/mcp/server/storage-alpha/pin answers {"server_id", "status": "unpinned"}
  with no upstream call. PUT /v1/mcp/server with server_id, a new description and mcp_access_groups
  [storage-editors] (202), then GET /v1/mcp/access_groups shows storage-editors and no storage-readers. DELETE
  /v1/mcp/server/storage-alpha (202, empty body). Repeat GET by id (404), the list, registry.json and
  access_groups: the row is gone from every one.

  submission-review.yaml (master key sk-mcp-review). Seed team storage-team, users storage-member and
  storage-loner, a membership of storage-member in storage-team, key sk-storage-member (internal_user, team
  storage-team) and key sk-storage-loner (internal_user, no team). POST /v1/mcp/server/register with the master
  key gets 403, with the loner key 400, and with the member key and transport stdio (command npx, args
  [-y, storage-mcp]) 400 with the stdio text. This case sets env LITELLM_ENABLE_MCP_STDIO=true (B4716's
  mcp_env_values section reads it), so the stdio body passes the body check and reaches the handler's own
  refusal. The member registers storage-sub (server_name storage_sub, auth_type none): 201 with approval_status
  pending_review and submitted_by storage-member. The member's GET /v1/mcp/server is [] and its POST
  /v1/mcp/server/storage-sub/pin is 403. The admin's POST /v1/mcp/server for storage-other with server_name
  storage_sub gets the identifier conflict 400, the admin's POST pin on storage-sub gets 404 because the row is
  not in the live registry, and GET /v1/mcp/server/submissions counts one pending item. PUT approve on an unknown
  id gets 404, on storage-sub 200 active, and again 400 "MCP server is already active.". The member's list now
  shows storage-sub in its non-admin form, and the admin's list shows it in full. PUT reject with review_notes
  gets 200 rejected, and again 400. The member's list is [] again and submissions count one rejected item.

  byok-delete-cleanup.yaml (master key sk-mcp-byok, user storage-byok-user with key sk-storage-byok-user,
  internal_user). The admin creates storage-byok with is_byok true, allow_all_keys true and auth_type api_key.
  The user POSTs /v1/mcp/server/storage-byok/user-credential {credential: byok-secret} and gets has_credential
  true; the user's GET /v1/mcp/server shows has_user_credential true; the admin's GET
  /v1/mcp/server/storage-byok/user-credentials lists one row for storage-byok-user. The admin DELETEs the
  server and creates it again with the same body. The admin's credential list is now [] and the user's
  has_user_credential is false: the delete removed the credential rows, so the new server with the old id
  starts clean.

  oauth-token-purge.yaml (master key sk-mcp-purge, users storage-oauth-user and storage-key-user with keys
  sk-storage-oauth-user and sk-storage-key-user, internal_user). The admin creates storage-oauth with auth_type
  oauth2, authorization_url, token_url, credentials client_id, client_secret and scopes, is_byok true and
  allow_all_keys true. The OAuth user POSTs /v1/mcp/server/storage-oauth/oauth-user-credential (access_token,
  expires_in 3600, scopes) and the key user POSTs user-credential. GET .../oauth-user-credential/status shows
  has_credential true. A PUT that changes only description keeps it true. A PUT that sends the same credentials
  again keeps it true, since the decrypted client_id and client_secret did not change. A PUT with url
  http://127.0.0.1:9/mcp-moved purges the token: status turns false and the OAuth user's GET
  /v1/mcp/user-credentials is []. The admin's GET /v1/mcp/server/storage-oauth/user-credentials still lists the
  key user's BYOK row, since the purge removes only rows that decode as OAuth tokens.

  env-var-lifecycle.yaml (master key sk-mcp-env, user storage-env-user with key sk-storage-env-user,
  internal_user). The admin creates storage-env with auth_type none, allow_all_keys true, env_vars
  [{name: STORAGE_REGION, value: eu-test, scope: global}, {name: STORAGE_TOKEN, scope: user, description}] and
  static_headers {x-storage-region: "${STORAGE_REGION}", x-storage-token: "${STORAGE_TOKEN}"}. The admin's GET by
  id shows the global value in clear; the user's GET /v1/mcp/server shows env_vars null. The user's GET
  /v1/mcp/user-env-vars/status shows STORAGE_TOKEN not set, missing_count 1 and setup_url
  https://gateway.example.test/ui/mcp-servers?fill_env_vars=storage-env. The user POSTs values
  {STORAGE_TOKEN: token-one} to /v1/mcp/server/storage-env/user-env-vars and the answer and a following GET of
  the same path show is_set true. The admin deletes the server and creates it again with the same body; the
  user's GET of the per-server path and the status list both show the variable unset again.

  oauth-session-draft.yaml (master key sk-mcp-draft). The admin creates storage-saved (server_name
  storage_saved, auth_type oauth2, authorization_url, token_url, credentials client_id, client_secret, scopes
  and upstream_resource https://api.example.test, mcp_access_groups [saved-readers]). POST
  /v1/mcp/server/oauth/session with server_name storage_draft, the same OAuth endpoints, credentials client_id,
  client_secret and scopes, and mcp_access_groups [draft-readers]: 200 with a generated server_id and only
  scopes left in credentials. GET /v1/mcp/access_groups now lists draft-readers, because it reads every row
  including drafts; GET /v1/mcp/server lists only storage-saved; GET /v1/mcp/server/submissions counts nothing.
  POST /v1/mcp/server for storage-late with server_name storage_draft gets 201, since a draft holds no name. A
  second session with server_id storage-saved, server_name storage_saved and no credentials keeps that id and
  answers with the inherited upstream_resource, and GET /v1/mcp/server/storage-saved afterwards still shows the
  saved row unchanged: the draft write skips an existing id.

  Compare status, body and content-type on every step. Error bodies are FastAPI detail objects, compared whole.
  Ignore only generated leaves, each with its own why: created_at, updated_at, submitted_at, reviewed_at,
  last_health_check and health_check_error on server rows; connected_at, updated_at and expires_at on credential
  rows; and the generated server_id of the storage_draft session. Keep status, approval_status, submitted_by,
  review_notes, created_by, credentials, mcp_info, env_vars, has_credential, has_user_credential, is_set,
  missing_count and setup_url compared. Never seed MCP rows through the fixture or add a test-only hook: every
  row comes from an HTTP step. About 700 to 900 fixture lines are expected. A mismatch goes with its transcript
  to the owner of the step that differs (the list above), not into a looser comparison.
scope:
  paths:
    - tools/oracle/cases/http/mcp-management-storage/**
  lint_tables: false
