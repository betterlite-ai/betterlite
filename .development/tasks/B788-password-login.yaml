dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: env_admin_login, database_email_login,
      same_error_unknown_and_wrong_password, sso_gate, rehash_legacy, breach_reset_session, session_expiry.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^password_login::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/password_login.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/password-login-*")"
        && grep -rlq "password_login" tools/oracle/fuzz/corpus/helper_case/password-login-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^password_login::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/password-login-*")"
        && grep -rlq "UI_USERNAME" crates/betterlite-config/fuzz/corpus/config_yaml/password-login-* &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/password-login/env-admin-login.yaml
  - tools/oracle/cases/helpers/password-login/database-email-login.yaml
  - tools/oracle/cases/helpers/password-login/same-error-unknown-and-wrong-password.yaml
  - tools/oracle/cases/helpers/password-login/sso-gate.yaml
  - tools/oracle/cases/helpers/password-login/rehash-legacy.yaml
  - tools/oracle/cases/helpers/password-login/breach-reset-session.yaml
  - tools/oracle/cases/helpers/password-login/session-expiry.yaml
deviations:
  - what: License checks and paid-tier quotas are absent; the MIT behavior is available without a premium_user
      entitlement.
    why: README Decisions specifies no paid tier and no user/team cap.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_utils.py#L1-L530
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - UI login creation tests EXPERIMENTAL_UI_LOGIN truthiness while auth blob fallback tests is not False.
budget:
  max_changed_lines: 700
  max_new_expects: 0
review_level: security
