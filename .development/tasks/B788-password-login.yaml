id: B788
title: Authenticate UI credentials and mint session keys
description: >-
  Implement PasswordLogin and UiSessionToken over existing key creation and user repository services.
  Keep UI_USERNAME=admin, UI_PASSWORD optional master-key fallback, PROXY_ADMIN_ID, LITELLM_UI_SESSION_DURATION=24h
  and disable_env_credential_login/disable_password_login_when_sso_enabled gates. Preserve breach recheck
  every 24 hours, legacy hash rehash on login and reset-required session route restrictions. Inject SSO-enabled
  state without importing B063 handlers.


  PasswordLogin implements B899 PasswordAuthenticator. This task owns credential/session logic; B899 owns
  HTTP form/JSON/cookie behavior.


  Build the production password_login module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/login_utils.py:
  _breach_recheck_due (L64-L72; 9 source lines), screen_login_password_for_breach (L75-L105; 31 source
  lines), _rehash_password_if_needed (L108-L118; 10 source lines), get_ui_credentials (L121-L145; 22 source
  lines), _matches_env_credentials (L148-L152; 5 source lines), _admin_credentials_match (L155-L160; 6
  source lines), _invalid_credentials_message (L163-L167; 5 source lines), is_env_credential_login_enabled
  (L170-L183; 13 source lines), LoginResult.__init__ (L196-L210; 15 source lines), authenticate_user (L213-L280;
  60 source lines), _sign_in (L283-L475; 169 source lines), _ui_session_exp_timestamp (L478-L485; 8 source
  lines), encode_ui_session_jwt (L488-L498; 10 source lines), create_ui_token_object (L501-L530; 27 source
  lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): UI_USERNAME='admin';
  UI_PASSWORD=None; general_settings.disable_env_credential_login=None; general_settings.disable_password_login_when_sso_enabled=None;
  PROXY_ADMIN_ID=LITELLM_PROXY_ADMIN_NAME; EXPERIMENTAL_UI_LOGIN=None; DATABASE_URL=None; LITELLM_UI_SESSION_DURATION='24h';
  litellm_settings.max_ui_session_budget=1.0; general_settings.litellm_key_header_name='Authorization';
  disable_env_credential_login=None; disable_password_login_when_sso_enabled=None; litellm_key_header_name='Authorization'.


  litellm_settings.max_ui_session_budget=1.0 USD (Decimal); EXPERIMENTAL_UI_LOGIN defaults absent, which
  does not enable experimental session creation here, unlike the auth blob-decryption check that tests
  is not False. UI_USERNAME=admin, UI_PASSWORD defaults master-key fallback, LITELLM_UI_SESSION_DURATION=24h;
  experimental token expiry stays 10 minutes.


  Add the password_login operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a password-login-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::password_login::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 390 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  390 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 686 changed lines estimated within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
