id: B788
title: Authenticate UI credentials and mint session keys
description: >-
  Implement PasswordLogin and UiSessionToken over existing key creation and user repository services.
  Keep UI_USERNAME=admin, UI_PASSWORD optional master-key fallback, PROXY_ADMIN_ID, LITELLM_UI_SESSION_DURATION=24h
  and disable_env_credential_login/disable_password_login_when_sso_enabled gates. Preserve breach recheck
  every 24 hours, legacy hash rehash on login and reset-required session route restrictions. Inject SSO-enabled
  state without importing B063 handlers.

  The SSO gate requires setting disable_password_login_when_sso_enabled exactly true AND B881's
  fully configured provider predicate. It runs before the required non-null master key, which runs
  before B787 throttle.attempt and all credential comparisons. Even env-admin credentials are
  throttled. Gate denial is 403 auth_error,param disable_password_login_when_sso_enabled; absent
  master key is 500 auth_error,param master_key. Codes equal statuses. Cases sso_complete_gate,
  sso_incomplete_keeps_password, master_missing_even_with_ui_password and
  blocked_admin_before_password establish ordering; no bearer authorization is added to login.

  get_ui_credentials defaults UI_USERNAME to admin only when absent; UI_PASSWORD falls back to
  string master_key only when absent, not when empty. Without either password source raise
  500 auth_error,param UI_PASSWORD. Compare UTF-8 username and password with constant-time
  equality, without trim/case normalization. Only boolean true disable_env_credential_login
  disables that comparison; a truthy string does not. Cases ui_credential_absent_vs_empty,
  ui_exact_unicode_comparison and env_disable_exact_bool cover it. Read the user row by
  case-insensitive email whenever a DB client exists, even when env credentials already match;
  query failures propagate. env_admin_still_queries_email verifies that ordering.

  Env admin sets returned user_id=default_user_id and user_role=proxy_admin, but the user row
  and generated key use PROXY_ADMIN_ID (default default_user_id; empty is retained). Invoke
  B792's user-update SERVICE with that ID/role and synthetic proxy-admin authority before checking
  DATABASE_URL presence. The source directly calls its handler; native code must reuse the service,
  not execute a FastAPI wrapper. A present empty DATABASE_URL still selects key generation; absent
  raises 500 auth_error,param DATABASE_URL. B893 generates a request_type key with llm_router=null,
  duration from LITELLM_UI_SESSION_DURATION, key_max_budget from max_ui_session_budget, models=[],
  aliases={},config={},spend=0,team_id=litellm-dashboard. Cases admin_return_id_vs_key_owner,
  admin_user_write_before_database_check and admin_key_arguments pin all fields and partial writes.

  A true EXPERIMENTAL_UI_LOGIN replaces the returned key AFTER generating the ordinary virtual
  key, without deleting it. B1223 mints its opaque encrypted token, not a JWT, from the looked-up
  user row or a synthetic default_user_id/proxy_admin/models=[]/max_budget row. Its ten-minute
  expiry and key precedence belong to B1223. The unreachable-with-normal-admin-state missing-user
  guard is HTTPException 401 detail.error, not ProxyException. Cases experimental_mints_after_key,
  experimental_prefers_email_row and experimental_disabled_default cover reachable branches.
  Env-admin LoginResult has email=null, login_method=username_password, password_reset_required=false;
  this key-generation branch does NOT add the password-session metadata used by database logins.

  Database users use row attributes, with fallback user_id/email/password='unknown' and role
  internal_user_viewer only for missing attributes, not explicit nulls. Null password raises
  401 auth_error,param password without recording a failed attempt. Wrong password and unknown
  username both record one failure then raise 401 auth_error,param invalid_credentials with
  the SAME message: mention env credentials only when env login is enabled, otherwise user password.
  Cases no_password_not_counted, missing_attribute_vs_null, unknown_and_wrong_same_error and
  invalid_message_matches_env_policy prevent enumeration and accidental throttling changes.

  Successful verification rehashes any stored value not starting scrypt: using B786; skip if no
  active global DB client, otherwise update password and let write errors propagate. Then, if
  breach checking is enabled and last_breach_check_at is null or at least 24 hours old, call B786
  screening. Naive timestamps mean UTC, future timestamps are not due. Stamp a fresh UTC
  last_breach_check_at, setting password_reset_required=true only for a breach; never clear an
  existing true flag on a clean result. Stamp errors warn but return the breach verdict. Cases
  rehash_prefix_skip, rehash_write_failure_stops_login, breach_due_boundary,
  breach_naive_and_future_time, breach_stamp_warning and breach_clean_does_not_clear_flag cover it.

  Database-user key arguments are router=null,request_type=key,role,duration,budget,spend=0,
  user_id,team_id=litellm-dashboard and metadata.login_method=username_password. If breached now
  or row.password_reset_required is exactly true, additionally set metadata.password_reset_required=true
  and allowed_routes exactly [/user/password/change,/session/logout]; otherwise allowed_routes=null.
  Rehash and breach writes precede the DATABASE_URL guard and session insertion. Call attempt.succeeded
  only after session/token minting succeeds. Cases database_session_arguments,
  reset_required_allowed_routes, password_writes_before_missing_database and
  session_failure_does_not_clear_attempt preserve partial effects and success accounting.

  LoginResult defaults login_method=username_password and reset_required=false. create_ui_token_object
  copies all identity/key fields, supplied premium_user (a projection, not a license gate), header
  name from general_settings.litellm_key_header_name default Authorization (explicit null retained),
  B124 get_server_root_path and reset flag. Move the tiny ui_sso.get_disabled_non_admin_personal_key_creation
  L1744-L1750 here to avoid depending on later SSO handlers: null key_generation_settings returns
  false; use personal_key_generation or {}, allowed_user_roles or [], then return whether literal
  proxy_admin occurs, even alongside other roles. Cases ui_token_fields,
  personal_key_flag_membership and personal_key_flag_falsey_defaults prove the projection.

  encode_ui_session_jwt signs HS256 with the master key, copying the UI object and overwriting exp
  with integer UTC Unix seconds at now + B199-parsed LITELLM_UI_SESSION_DURATION. Unlike B1223's
  experimental bearer blob, this outer UI cookie IS a JWT. Cases cookie_hs256_signature,
  cookie_exp_overwrites_and_truncates and cookie_duration_parse_failure pin it; bad duration fails
  when used, not import-time int parsing or fallback. Never expose passwords in diagnostics.


  PasswordLogin implements B899 PasswordAuthenticator. This task owns credential/session logic; B899 owns
  HTTP form/JSON/cookie behavior.


  Build the production password_login module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/login_utils.py:
  _breach_recheck_due (L64-L72; 9 source lines), screen_login_password_for_breach (L75-L105; 31 source
  lines), _rehash_password_if_needed (L108-L118; 10 source lines), get_ui_credentials (L121-L145; 22 source
  lines), _matches_env_credentials (L148-L152; 5 source lines), _admin_credentials_match (L155-L160; 6
  source lines), _invalid_credentials_message (L163-L167; 5 source lines), is_env_credential_login_enabled
  (L170-L183; 13 source lines), LoginResult.__init__ (L196-L210; 15 source lines), authenticate_user (L213-L280;
  60 source lines), _sign_in (L283-L475; 169 source lines), _ui_session_exp_timestamp (L478-L485; 8 source
  lines), encode_ui_session_jwt (L488-L498; 10 source lines), create_ui_token_object (L501-L530; 27 source
  lines).


  B002 resolves UI_USERNAME=admin, UI_PASSWORD absent, PROXY_ADMIN_ID=default_user_id,
  EXPERIMENTAL_UI_LOGIN absent, DATABASE_URL presence, LITELLM_UI_SESSION_DURATION=24h,
  litellm_settings.max_ui_session_budget=1.0 USD and key_generation_settings=None. Both general
  disable flags default absent; litellm_key_header_name defaults Authorization. Secret booleans
  use trimmed case-insensitive true/false with unknown strings null; duration remains a string.


  litellm_settings.max_ui_session_budget=1.0 USD (Decimal); EXPERIMENTAL_UI_LOGIN defaults absent, which
  does not enable experimental session creation here, unlike the auth blob-decryption check that tests
  is not False. UI_USERNAME=admin, UI_PASSWORD defaults master-key fallback, LITELLM_UI_SESSION_DURATION=24h;
  experimental token expiry stays 10 minutes.


  Add the password_login operation under B856 Management::models. Python calls owned MIT logic
  with injected clock/cache/DB/network and user-mutation collaborators; replace the user_update
  call boundary with that dependency's typed effect port, never call its FastAPI handler.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a password-login-*
  seed to B171 helper_case, which already owns this decoder.


  Config cases credential_empty_precedence, exact_boolean_disable_flags, experimental_boolean_values,
  session_budget_and_duration and ui_projection_settings load every listed setting through B002
  and assert actual service consumption. Native Postgres cases use POSTGRES_TEST_URL or
  testcontainers and fail on infrastructure errors; B899 owns full HTTP login integration.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: login_utils has 369 nonblank, noncomment lines excluding leading docstrings, including imports;
  add seven shared SSO-helper lines. Allow 340 production, 315 parameterized behavior/Postgres tests,
  65 helper adapters, 30 wiring and 50 config lines, 800 changed lines. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


