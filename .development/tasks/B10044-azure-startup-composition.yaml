id: B10044
title: The server builds the Azure composition once at startup from config, and the provider crate never reads the process environment
description: >-
  Follow-up to B025's review (inject-dependencies), moved here by the architect so B025 could finish. B025's
  Provider::from_slug in crates/betterlite-provider/src/provider.rs builds the Azure adapter's Composition with
  Composition::from_environment(process_environment()) on every request. So the provider crate reads the process
  environment itself, copies it per call, and the Composition's Globals (LiteLLM's litellm.api_base, api_version,
  api_key, azure_key, headers and AZURE_DEFAULT_API_VERSION) stay empty in production, though the proxy sets them from
  litellm_settings.


  Build the Azure composition once at startup from config alone. A new config section,
  crates/betterlite-config/src/sections/azure_provider_globals.rs (registered in sections.rs), resolves at config
  load, through the loader's lookup like bedrock_services_search.rs does: the litellm_settings globals api_base,
  api_version, api_key, azure_key and headers, and the variables the Azure adapter reads (AZURE_API_BASE,
  AZURE_API_VERSION, AZURE_API_KEY, AZURE_OPENAI_API_KEY, AZURE_AD_TOKEN, AZURE_API_TYPE). A Slot in a new
  crates/betterlite-server/src/state/azure_runtime.rs builds the Composition from that section, and state.rs
  registers it beside anthropic_runtime. Provider::from_deployment and from_slug take the composition from their
  caller, and the server passes it in the five places that call them today: server/chat_setup.rs,
  server/chat_setup/provider_call.rs, server/chat_setup/provider_call/embedding.rs, routes/completions/streaming.rs
  and routes/chat/streaming.rs where it hands provider_call its runtimes. The Python binding
  (crates/betterlite-python/src/completion/calls.rs) builds the composition at the call from process_environment(),
  since an SDK user can set os.environ after import and LiteLLM reads it at call time; its SDK module globals stay
  with B157-B166. AzureOpenAIConfig and AzureOpenAIO1Config defaults keep their LiteLLM defaults here, since only
  SDK code sets them.


  After this task no file under crates/betterlite-provider/src calls process_environment, and the tests that build a
  Provider for azure or azure_text pass an injected composition.
