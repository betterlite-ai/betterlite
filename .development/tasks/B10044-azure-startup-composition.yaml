references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L1367-L1388
  why: Azure chat takes api_base, api_version, the key and headers from the call, then litellm's globals, then the environment.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6594
  why: The proxy sets each litellm_settings key as a litellm global.
dod:
- text: >-
    A server whose config sets litellm_settings.api_base and api_version, with no AZURE_API_BASE in its environment,
    sends an Azure chat to that base and version; an AZURE_API_KEY in the startup environment still reaches the call.
  proof: [azure-tests]
- text: >-
    No file under crates/betterlite-provider/src calls process_environment, and the server builds the Azure
    composition once at startup.
  proof: [no-env-read, azure-tests]
checks:
  optional: []
  commands:
  - id: azure-tests
    why: The Azure composition does not reach the provider from startup, or another Azure behavior broke.
    run: cargo nextest run --locked -p betterlite-provider -p betterlite-config -p betterlite-server --no-tests=fail -E 'test(/azure/)'
  - id: no-env-read
    why: The provider crate still reads the process environment itself.
    run: >-
      ! git grep -n -F 'process_environment(' -- crates/betterlite-provider/src
oracle_cases: []
deviations: []
out_of_scope:
- Python SDK module globals (litellm.api_base set from Python), which B157-B166 own.
- Setting AzureOpenAIConfig or AzureOpenAIO1Config defaults from config; LiteLLM's proxy has no key for them.
pitfalls:
- The server never calls process_environment() for Azure. The section resolves every Azure variable at config load, and no request reads the environment.
review_level: security
budget:
  max_changed_lines: 900
  max_new_expects: 0
