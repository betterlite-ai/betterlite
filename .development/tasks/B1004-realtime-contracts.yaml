  close_after_upstream_handshake_refusal (L62-L71); litellm/proxy/common_utils/realtime_utils.py: _realtime_request_body
  (L7-L12); litellm/litellm_core_utils/realtime_streaming.py: _decode_json_object (L106-L108). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 279 owned nonblank/non-comment/non-docstring Python lines (373 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 299 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  46 wiring; 589 total within the 590-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B171 (Direct helper oracle and URL path encoding),
  B1087 (Api boundaries), B1123 (Realtime transcription protocol). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
