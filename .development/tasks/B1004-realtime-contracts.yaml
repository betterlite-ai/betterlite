id: B1004
title: Realtime contracts
description: >-
  Define typed realtime events, provider HTTP/WebSocket operation contracts, transcription protocol normalization
  and close/error mapping. Extend B009 with a configured WebSocket transport using maintained protocol libraries,
  preserving TLS/proxy/deadline policy; no endpoint may open a request-supplied destination.


  Implement crates/betterlite-core/src/api/realtime_contracts.rs, crates/betterlite-openai/src/api/realtime_contracts.rs,
  crates/betterlite-provider/src/api/realtime_contracts.rs. Use RealtimeContractsInput and RealtimeContractsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions transcription_session_schema, backend_close_error, realtime_auth_headers
  under api::realtime_contracts::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-openai::api::realtime_contracts::decode_realtime_contracts(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/realtime_contracts.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-openai/fuzz/fuzz_targets/realtime_contracts.rs passes arbitrary bounded bytes to that
  exact decoder; api::realtime_contracts::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  Register HelperCall::RealtimeContracts in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_contracts: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


