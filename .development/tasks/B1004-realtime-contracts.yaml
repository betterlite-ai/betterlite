  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/realtime_contracts.rs
  - crates/betterlite-core/src/api/realtime_contracts/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/realtime_contract.rs
  - crates/betterlite-core/fuzz/corpus/realtime_contract/**
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/realtime_contracts.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/realtime_contracts.py
  - tools/oracle/cases/helpers/realtime-contracts/**
  - tools/oracle/fuzz/corpus/helper_case/realtime-contracts-*
