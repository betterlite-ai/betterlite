id: B1004
title: Realtime contracts and close errors
description: >-
  Define realtime records, BaseRealtimeConfig/BaseRealtimeHTTPConfig interfaces and their concrete
  defaults in betterlite-core::api::realtime_contracts. Own all five referenced small modules, plus
  realtime_streaming.py's BackendClose, backend_close_from, ClientLoopExit, socket/logging/normalizer
  protocols and _decode_json_object. Session state and relay methods stay in later tasks. The HTTP
  interface's credential methods are abstract; their documented precedence is not executable fallback
  logic here. The WebSocket base error method raises BaseLLMException; the HTTP base method returns it.

  Preserve unknown fields in RealtimeSessionConfig, transcription request/response and raw session
  records; top-level client-secret request/response and expires_after use Pydantic's default extra-ignore.
  Optional fields default None except expires_after.anchor="created_at". The required client-secret
  response value is a string. No protocol conversion happens in these types. B1123 owns the separate
  transcription protocol parser, which does not depend on these interfaces.

  decode_realtime_frame(bytes,limits) accepts any bounded JSON value as the source json.loads does;
  callers decide whether an object is required. decode_realtime_contract(bytes,kind,limits) validates
  the HTTP records. One realtime_contract fuzz target uses a leading kind byte to reach both decoders.
  Pure B171 cases cover URL/default/error/value helpers; native injected socket tests cover refusal
  send/close effects without treating a socket writer as a pure helper. No provider I/O is implemented.
  Source count is 370 nonblank/non-comment lines across the five modules plus 49 declarations/helpers
  in realtime_streaming.py; budget 210 types/defaults,150 tests,115 fixtures,90 adapters,70 fuzz/replay
  and 35 wiring, 670 changed lines.
scope:
