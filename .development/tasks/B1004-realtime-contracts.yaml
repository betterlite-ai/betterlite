checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai -p betterlite-provider --no-tests=fail
      -E 'test(/^api::realtime_contracts::/) - test(/::replays_corpus$/)'
  - id: case-transcription-session-schema
    why: the transcription-session-schema behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_contracts::tests::transcription_session_schema($|::)/)'
  - id: case-backend-close-error
    why: the backend-close-error behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_contracts::tests::backend_close_error($|::)/)'
  - id: case-realtime-auth-headers
    why: the realtime-auth-headers behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_contracts::tests::realtime_auth_headers($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/realtime_contracts)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/realtime_contracts.rs && grep -qF "decode_realtime_contracts"
      crates/betterlite-openai/fuzz/fuzz_targets/realtime_contracts.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::realtime_contracts::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/realtime_contracts.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime_contracts-*)"
      && grep -qE "^[[:space:]]+realtime_contracts:" tools/oracle/fuzz/corpus/helper_case/realtime_contracts-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-contracts)"
