  why: Backend protocol and all optional hook defaults, including no-op pacing and deferred setup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/realtime/http_transformation.py#L1-L117
  why: HTTP URL suffix handling and ephemeral Authorization header differ from WebSocket defaults.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/realtime.py#L1-L187
  why: Session and expiry defaults, extra-field policies, usage variants and resolved_model precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_errors.py#L1-L71
  why: Error-event keys, byte-limited close reasons, legal close codes and refusal ordering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/realtime_utils.py#L1-L12
  why: Cached authentication body uses raw interpolation rather than JSON escaping.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L38-L114
  why: Close records and transport protocols sit below session state; the frame decoder is shared by every relay.
dod:
- text: >-
    realtime_contract_defaults constructs an empty expiry as {anchor:created_at,seconds:null}; explicit
    anchor=null remains null. Empty session has type,model,instructions,audio,include,max_output_tokens,
    output_modalities,tool_choice,tools,tracing,truncation,prompt all None; unknown session field future=1
    survives. Unknown top-level client-secret field is ignored. Missing response value fails validation;
    empty string is accepted. Transcription resolved_model chooses nonempty top-level model before nested
    input_audio_transcription.model, then None; an empty top-level string falls through. Unknown transcription
    fields survive. Usage variants preserve tokens with text_tokens/audio_tokens or duration seconds.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    realtime_base_hooks returns None for session_configuration_request,unbilled_usage_on_session_close,
    open_backend,transform_session_created_event and pacing; is_setup_message,is_content_message,
    requires_session_configuration are false. A concrete test subclass calling the base complete URL
    gets supplied base or "". Error message=bad,status=429,headers={retry-after:2} are retained;
    WebSocket get_error_class raises, HTTP get_error_class returns the exception. Abstract transforms
    remain required implementations rather than invented identity transforms.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    realtime_http_url_defaults sends bases None,https://host,https://host/v1/ and expects transcription
    URLs /v1/realtime/transcription_sessions,https://host/v1/realtime/transcription_sessions,
    https://host/v1/realtime/transcription_sessions. Calls URLs are /v1/realtime/calls,
    https://host/v1/realtime/calls,https://host/v1/v1/realtime/calls: this base method does not remove /v1.
    Model and api_version do not change these defaults. Ephemeral key=ep-test produces only
    Authorization="Bearer ep-test", including "Bearer " for the empty key.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    realtime_error_and_close_helpers emits {type:error,error:{type:server_error,message:bad}} with no
    param/code. Close reason lengths 122/123/124 ASCII bytes preserve/preserve/truncate to123; a split
    multibyte character is removed. Empty message returns fallback unchanged, even over 123 bytes.
    Codes1000,1001,1002,1003,1007,1008,1009,1010,1011,1012,1013,1014,3000,4999 survive; 1005,1006,1015,
    2999,5000 become1011. Handshake401/403 ->1008,429 ->1013,other ->1011. Native refusal tests send
    server_error with "Upstream realtime handshake rejected with HTTP 429" before close 1013; a failed
    send still attempts close, and a failed close propagates. BackendClose(1006,"") has message
    "upstream websocket closed with code 1006"; reason=gone appends ": gone". Missing received close
    uses1006 and str(exception); received close uses its code/reason.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    realtime_cached_body_and_frame_values expects model=None or "" -> bytes {"model": ""}, model=m ->
    {"model": "m"}; embedded quotes/newlines are interpolated without escaping, preserving even invalid
    JSON. LRU capacity is1000 and eviction never changes bytes. Frame decoder accepts {},[],null and
    scalar JSON values; malformed UTF-8/JSON fails without a panic. HTTP record validation remains
    distinct from this permissive frame decoder.
  proof: [behavior-tests, oracle, helper-python]
- text: Contracts have newly added helper cases plus HTTP-record/frame corpus seeds.
  proof: [decoder-corpus, helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Default records, error methods and close effects require tests beyond decoder replay.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_contracts::tests::/) - test(/::replays_corpus$/)'
  - id: decoder-corpus
    why: Shared frame and HTTP-record decoders must consume newly committed adversarial bytes.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/realtime_contract)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_contracts::tests::replays_corpus$/)'
  - id: helper-python
    why: The pure contract adapter compares base methods and typed records from the pin.
    run: test -f tools/oracle/helpers/realtime_contracts.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: Realtime contract operations require new external helper tags.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime-contracts-*)" && grep -qE '^[[:space:]]+realtime_contracts:' tools/oracle/fuzz/corpus/helper_case/realtime-contracts-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: URL, record and close behavior need independent new source fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-contracts)"
oracle_cases:
- tools/oracle/cases/helpers/realtime-contracts/realtime-contract-defaults.yaml
- tools/oracle/cases/helpers/realtime-contracts/realtime-base-hooks.yaml
- tools/oracle/cases/helpers/realtime-contracts/realtime-http-url-defaults.yaml
- tools/oracle/cases/helpers/realtime-contracts/realtime-error-and-close-helpers.yaml
- tools/oracle/cases/helpers/realtime-contracts/realtime-cached-body-and-frame-values.yaml
deviations: []
out_of_scope:
- All callables in the five small referenced modules are owned here. B1123 owns transcription_protocol.py separately.
- In realtime_streaming.py B1006 owns __init__ and 236-425; B1110 sends/enforcement at 427-547,655-706,723-735; B1124 buffering549-653; B2455 policy708-721,737-784,798-807; B1007 runner809-941; B1008 backend943-1154; B1005 beta1156-1307,1592-1594; B1009 client1309-1589. _has_realtime_guardrails786-796 has no caller at the pin.
pitfalls:
- websocket_close_reason truncates the message but returns an empty-message fallback without truncating it.
- The cached authentication body does not escape a model string; using a general JSON serializer changes its bytes.
- BaseRealtimeHTTPConfig appends /v1 twice for calls when the base already ends with /v1.
review_level: security
budget:
  max_changed_lines: 700
  max_new_expects: 0
