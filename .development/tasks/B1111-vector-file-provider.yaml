id: B1111
title: Vector file provider defaults and registry credentials
description: >-
  Build vector_file_provider in betterlite-core for the two small helpers preceding the vector-file SDK
  operations. _ensure_provider returns custom_llm_provider or "openai" without parsing provider prefixes.
  _prepare_registry_credentials asks B1062's registry for vector_store_id and overlays a nonempty result
  on the operation's kwargs. A missing registry, an empty result or any lookup exception leaves kwargs
  alone. Exceptions are swallowed without logging, not turned into failed file operations.

  Represent the optional registry as an injected lookup. Add HelperCall::VectorFileProvider in B171,
  with typed provider input, initial kwargs and scripted registry result/error; project the selected
  provider, final kwargs and ordered lookup calls from both implementations. This seam is a credential
  lookup, not HTTP. Real file requests are tested by B1072-B1074. Keep credentials secret in Debug output.
  The two whole functions contain 15 nonblank/non-comment lines; estimate 40 implementation, 100 tests,
  85 adapters, 60 fixtures and 35 wiring/corpus lines within the minimum 400-line budget.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_file_provider.rs
  - crates/betterlite-core/src/api/vector_file_provider/**
  - tools/oracle/src/helpers/core_ops/vector_file_provider.rs
  - tools/oracle/src/helpers/core_ops/vector_file_provider/**
  - tools/oracle/helpers/vector_file_provider.py
  - tools/oracle/helpers/vector_file_provider/**
  - tools/oracle/fuzz/corpus/helper_case/vector_file_provider-*
  - tools/oracle/cases/helpers/vector-file-provider/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_store_files/main.py#L35-L51
  why: Both complete helpers establish falsey provider defaults and credential overlay with silent exception fallback.
dod:
- text: >-
    provider_defaults passes null and "" and expects "openai"; "azure", "openai/gpt-4o" and
    "unknown" are returned unchanged. These helpers neither validate the name nor access environment variables.
  proof: [provider-tests, oracle, helper-python]
- text: >-
    registry_overwrites_caller passes vs_a and kwargs={api_key:caller,api_base:old,timeout:7} to a registry
    returning {api_key:registry,api_base:new,custom_llm_provider:azure}. Expect one lookup(vs_a) and final
    kwargs={api_key:registry,api_base:new,custom_llm_provider:azure,timeout:7}. An explicitly null returned
    api_key overwrites caller too. No HTTP or secondary lookup occurs.
  proof: [provider-tests, oracle, helper-python]
- text: >-
    registry_failure_keeps_arguments tests an absent registry, a null/empty result and a lookup raising
    ValueError("store missing") or RuntimeError("unavailable"). Expect original {api_key:caller,timeout:7}
    in every case, zero lookup for the absent registry and one otherwise, and no warning or error record.
    Debug formatting of the native input/result must not reveal caller or registry credential values.
  proof: [provider-tests, oracle, helper-python]
- text: Added vector_file_provider seeds are accepted by B171's existing helper-case decoder and replay test.
  proof: [helper-corpus]
checks:
  optional: []
  commands:
  - id: provider-tests
    why: file credential lookup rejects a swallowed failure or gives caller kwargs the wrong precedence
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_provider::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: the independently invoked LiteLLM helper is absent or untyped
    run: test -f tools/oracle/helpers/vector_file_provider.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: no new vector_file_provider input exercises the shared parser
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_file_provider-*)" && grep -qE '^[[:space:]]+vector_file_provider:' tools/oracle/fuzz/corpus/helper_case/vector_file_provider-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vector-file-provider/provider-defaults.yaml
- tools/oracle/cases/helpers/vector-file-provider/registry-overwrites-caller.yaml
- tools/oracle/cases/helpers/vector-file-provider/registry-failure-keeps-arguments.yaml
deviations: []
out_of_scope:
- B1072 owns create/acreate/list/alist in vector_store_files/main.py, B1073 retrieve/aretrieve/retrieve_content/aretrieve_content, and B1074 update/aupdate/delete/adelete.
- B1062 owns get_credentials_for_vector_store and config/database registry loading; this task consumes that lookup without changing its policy.
pitfalls:
- 'The oracle helper for this task is pre-registered as vector_file_provider in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/vector_file_provider.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vector_file_provider.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An empty provider string defaults to openai, but an unknown nonempty string survives until the SDK operation validates it.
- Registry credentials replace explicit caller credentials; an exception during lookup is silently ignored.
review_level: security
budget:
  max_changed_lines: 400
  max_new_expects: 0
