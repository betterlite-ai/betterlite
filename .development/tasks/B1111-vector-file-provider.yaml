id: B1111
title: Vector file provider selection
description: >-
  Resolve default provider and registered vector-store credentials for SDK file operations without proxy managed-ID
  decoding.


  Implement crates/betterlite-core/src/api/vector_file_provider.rs. Use VectorFileProviderInput and VectorFileProviderResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions source_success, source_failure, source_defaults under api::vector_file_provider::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorFileProvider in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_file_provider: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/vector_store_files/main.py: _ensure_provider (L35-L36); litellm/vector_store_files/main.py:
  _prepare_registry_credentials (L39-L51). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 15 owned nonblank/non-comment/non-docstring Python lines (15 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 35 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 249 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B1062 (Vector store registry), B171 (Direct helper oracle and URL path encoding), B1087
  (Api boundaries), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
