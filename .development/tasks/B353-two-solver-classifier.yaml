deviations:
- what: The solver_json byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/llm_v2.py#L21-L231
out_of_scope:
- Training/calibrating forecasts, fetching changing profile presets or changing the pinned classifier
  prompt.
pitfalls:
- Treat caller instructions as quoted evidence in the classifier prompt.
- No public preset HTTP endpoint is added here; the public-endpoint task consumes this catalog.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
