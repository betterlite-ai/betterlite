id: B353
title: Two-solver forecasts and Fuse profile presets
description: 'Add classifier_type llm_v2 to B331''s classifier transport and B330''s context builder.
  Parse the strict two-solver verdict, resolve the pinned bundled model/harness profiles, and produce
  a typed efficient-versus-capable decision with provenance. Use f64 ln/exp calibration with the pinned
  clipping and epsilon; no hand-written transcendental approximation. Keep all prompt/verdict bodies out
  of telemetry. Nonmonetary statistical arithmetic uses f64 only in solver_math; put one module-level
  #[expect(clippy::float_arithmetic, reason = "pinned statistical routing arithmetic")] there, counted
  in this task budget. Money, prices, spend and budgets stay rust_decimal::Decimal, including database
  and wire boundaries. Reject nonfinite statistical input. Assert selected model/tier exactly; any opt-in
  tolerance is for diagnostic scores only, never a different selection. Configuration boundary keys introduced
  or consumed here: llm_v2_config. Pinned declaration defaults: llm_v2_config=None. Resolve env values
  once in betterlite-config, never in router code. Implement the owned native service in crates/betterlite-router/src/two_solver_classifier.rs.
  Add ProbeOperation::TwoSolverClassifier in tools/oracle/src/router_probes/mod.rs and the corresponding B353 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/fuse_presets.py:
  get_fuse_presets (L38-L41), resolve_fuse_profile (L44-L52). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports. Function coverage in litellm/router_strategy/complexity_router/llm_v2.py: LLMV2ProbabilityCalibration.calibrate
  (L120-L126), LLMV2Config.validate_profiles (L155-L157), LLMV2Config._profile_texts (L159-L169), LLMV2Config.system_prompt
  (L171-L184), LLMV2Config.classify (L186-L195), LLMV2Decision.use_efficient (L207-L208), LLMV2Decision.signals
  (L211-L224), llm_v2_response_format (L227-L231). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Bound the solver_json outside-byte parser to 1048576 bytes before decoding; on excess use its typed
  invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback path). If
  floating diagnostics differ, a case may use absolute_tolerance=0.000000000001 only on its explicitly
  named score/probability pointer. Selection, tie order, counts, statuses, money and provider requests
  remain exact. Six-decimal wire signals are compared after the source rounding, without widening tolerance.'
