dod:
- text: Write tests named two_solver_classifier_behaviors and two_solver_classifier_boundaries under two_solver_classifier::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - two-solver-classifier-behaviors
  - two-solver-classifier-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/two-solver-classifier-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/two-solver-classifier-invalid.yaml;
    the valid seed contains llm_v2_config. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - two-solver-classifier-boundaries
- text: Add crates/betterlite-router/fuzz/corpus/solver_json/two-solver-classifier-valid.json and crates/betterlite-router/fuzz/corpus/solver_json/two-solver-classifier-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target solver_json and normal replays_the_solver_json_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - two-solver-classifier-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: two-solver-classifier-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::two_solver_classifier_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: two-solver-classifier-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::two_solver_classifier_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/two_solver_classifier.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/two_solver_classifier.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/two-solver-classifier-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/two-solver-classifier-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/two-solver-classifier-" && grep -Fq 'llm_v2_config' crates/betterlite-config/fuzz/corpus/config_yaml/two-solver-classifier-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-router/fuzz/corpus/solver_json/two-solver-classifier-valid.json && test -f crates/betterlite-router/fuzz/corpus/solver_json/two-solver-classifier-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/solver_json
      | grep -Fq "/two-solver-classifier-" && test -f crates/betterlite-router/fuzz/fuzz_targets/solver_json.rs && cargo
      nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_solver_json_corpus)'
