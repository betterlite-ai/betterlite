id: B528
title: OpenAI realtime connection and session requests
description: >-
  Add RealtimeConnect settings and typed HTTP session/call/transcription-session request preparation. Expose the
  connection URL, headers, TLS policy and handshake-failure mapping as a provider result consumed by B084; actual
  bidirectional websocket pumping and its RealTimeStreaming implementation are B084. Compare connection preparation
  by intercepting the Python connect seam, never opening a live socket.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/realtime/handler.py:
  OpenAIRealtime._get_default_api_base L35-L40; OpenAIRealtime._get_additional_headers L42-L59; OpenAIRealtime._get_ssl_config
  L61-L83; OpenAIRealtime._construct_url L85-L99; OpenAIRealtime._make_event_normalizer L101-L107; OpenAIRealtime.async_realtime
  L109-L190. litellm/llms/openai/realtime/http_transformation.py: OpenAIRealtimeHTTPConfig.get_api_base L9-L10;
  OpenAIRealtimeHTTPConfig.get_api_key L12-L13; OpenAIRealtimeHTTPConfig.get_complete_url L15-L18; OpenAIRealtimeHTTPConfig.get_realtime_calls_url
  L20-L23; OpenAIRealtimeHTTPConfig.get_transcription_session_url L25-L28; OpenAIRealtimeHTTPConfig.validate_environment
  L30-L40.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Named case contracts: ws_wss_scheme: Default websocket base is https://api.openai.com/. Replace https:// with
  wss:// and http:// with ws://, then replace the entire path with /v1/realtime; preserve existing query only when
  the supplied query mapping is empty. query_model_or_explicit: query_params=None becomes {model:<requested model>};
  any supplied mapping, including {}, suppresses that fallback. A truthy mapping replaces the whole original query.
  intent=transcription passes the requested model as force_transcription_model; other intents pass None. beta_header_only_when_client_sends:
  Send Authorization: Bearer <api_key>; add OpenAI-Beta: realtime=v1 only when B1004 client_sent_openai_beta_realtime_header
  reports it. The default normalizer is None. Websocket api_key=None raises ValueError api_key is required for OpenAI
  realtime calls before the connection try; empty key is permitted. http_session_paths: HTTP base resolves explicit
  api_base, litellm.api_base, OPENAI_API_BASE, then https://api.openai.com (not OPENAI_BASE_URL). Strip trailing
  slashes and one trailing /v1, then append /v1/realtime/client_secrets, /v1/realtime/calls or /v1/realtime/transcription_sessions.
  api_version/model do not affect these paths. redacted_close_reason: Other connection/forwarding exceptions close
  with code 1011 and redacted reason Internal server error: <error>. Ignore RuntimeError close failures containing
  already completed or websocket.close; otherwise raise Exception Unexpected error while closing WebSocket: <close_error>.
  Handshake InvalidStatus instead delegates its response.status_code to the existing refusal helper. realtime_ssl_and_size:
  ws:// uses no TLS context; wss delegates to the shared realtime SSL context, translating False to websockets ssl=True
  as the source library requires. Connect receives max_size from REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES, parsed
  as int when set and None/unlimited otherwise; invalid numeric environment text fails loading. realtime_http_auth:
  HTTP key resolves explicit api_key, litellm.api_key, litellm.openai_key, OPENAI_API_KEY, then empty string. Validation
  returns copied headers overwritten with Authorization: Bearer <key-or-empty> and Content-Type: application/json.


  Load REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES through betterlite-config, with injected environment lookup and
  the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest openai_realtime_config_cases; each named loads_<key> case invokes the real B002 loader, checks
  explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Apply the same 16 MiB Rust websocket default as Azure B545; REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES explicitly
  overrides it. The pinned None/unlimited default is reference behavior, not the Rust default. Compare connect fixtures
  with an explicit size setting; add standalone Rust message_cap_closes_1009 for the default and override, never
  an oracle case for the differing default.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-openai/src/realtime.rs with adjacent tests under realtime/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation openai_realtime in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_cases in betterlite-openai with these exact named cases (one per oracle file):
  ws_wss_scheme, replace_path_with_v1_realtime, query_model_or_explicit, beta_header_only_when_client_sends, http_session_paths,
  missing_api_key, handshake_refusal, redacted_close_reason, realtime_ssl_and_size, realtime_http_auth. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_realtime* using HelperCase: kind: helper
  and the externally tagged openai_realtime variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_openai_realtime that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 154 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 195 production lines, 240 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 45 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.
