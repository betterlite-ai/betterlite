id: B528
title: OpenAI realtime connection and session requests
description: >-
  Add RealtimeConnect settings and typed HTTP session/call/transcription-session request preparation. Expose the
  connection URL, headers, TLS policy and handshake-failure mapping as a provider result consumed by B084; actual
  bidirectional websocket pumping and its RealTimeStreaming implementation are B084. Compare connection preparation
  by intercepting the Python connect seam, never opening a live socket.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/realtime/handler.py:
  OpenAIRealtime._get_default_api_base L35-L40; OpenAIRealtime._get_additional_headers L42-L59; OpenAIRealtime._get_ssl_config
  L61-L83; OpenAIRealtime._construct_url L85-L99; OpenAIRealtime._make_event_normalizer L101-L107; OpenAIRealtime.async_realtime
  L109-L190. litellm/llms/openai/realtime/http_transformation.py: OpenAIRealtimeHTTPConfig.get_api_base L9-L10;
  OpenAIRealtimeHTTPConfig.get_api_key L12-L13; OpenAIRealtimeHTTPConfig.get_complete_url L15-L18; OpenAIRealtimeHTTPConfig.get_realtime_calls_url
  L20-L23; OpenAIRealtimeHTTPConfig.get_transcription_session_url L25-L28; OpenAIRealtimeHTTPConfig.validate_environment
  L30-L40.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Implement crates/betterlite-openai/src/realtime.rs with adjacent tests under realtime/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation openai_realtime in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_cases in betterlite-openai with these exact named cases (one per oracle file):
  ws_wss_scheme, replace_path_with_v1_realtime, query_model_or_explicit, beta_header_only_when_client_sends, http_session_paths,
  missing_api_key, handshake_refusal, redacted_close_reason. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_realtime* using HelperCase: kind: helper
  and the externally tagged openai_realtime variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_openai_realtime that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 154 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 180 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 409 planned, 425 maximum changed lines.
