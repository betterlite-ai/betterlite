    OpenAIRealtimeHTTPConfig.get_realtime_calls_url, OpenAIRealtimeHTTPConfig.get_transcription_session_url, OpenAIRealtimeHTTPConfig.validate_environment.
    Other functions in this file remain with the owners listed below.
