  commands:
  - id: case-ws-wss-scheme
    why: The ws-wss-scheme behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_ws_wss_scheme$/)'
  - id: case-replace-path-with-v1-realtime
    why: The replace-path-with-v1-realtime behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::realtime_cases::case_[0-9]+_replace_path_with_v1_realtime$/)'
  - id: case-query-model-or-explicit
