  why: >-
    Own OpenAIRealtime._get_default_api_base, OpenAIRealtime._get_additional_headers, OpenAIRealtime._get_ssl_config,
    OpenAIRealtime._construct_url, OpenAIRealtime._make_event_normalizer, OpenAIRealtime.async_realtime. Other functions
