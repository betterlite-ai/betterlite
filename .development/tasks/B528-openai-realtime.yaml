deviations:
- what: Websocket messages are capped at 16 MiB by default; REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES overrides
    the cap. LiteLLM defaults this variable to None, allowing unlimited frames; excess messages close with websocket
    code 1009.
  why: Bounded external buffers are required; this names the visible default difference rather than assuming LiteLLM
    already caps messages.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L336-L339
out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as openai_realtime in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/realtime.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_realtime.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- timeout and client are accepted but not passed to websockets.connect; adding either as an oracle-visible connect
  option changes the pin.
- Empty query_params preserves an existing base query while suppressing the model fallback.
