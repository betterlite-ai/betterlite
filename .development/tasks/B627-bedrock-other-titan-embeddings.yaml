out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- 'litellm/llms/bedrock/embed/cohere_transformation.py: BedrockCohereEmbeddingConfig._is_v3_model L30-L31 have no
  caller at the pin; do not port them.'
pitfalls:
- The AWS documentation defaults for Titan V2 are not LiteLLM constructor defaults; injecting them changes the request.
- A nonempty mixed Cohere input list is classified by its last item by the delegated native implementation.
