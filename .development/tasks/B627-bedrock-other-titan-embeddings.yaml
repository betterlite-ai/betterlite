id: B627
title: Bedrock Titan and Cohere embeddings
description: >-
  Add typed Titan/Cohere embedding maps over the existing exact-decimal embedding wire records. Preserve v1/v2 dimensions/normalize/binary
  embedding variants, multimodal image/text inputs and Cohere input_type/truncate fields. Reuse the bounded media
  helper without fetching request URLs.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/amazon_titan_g1_transformation.py:
  AmazonTitanG1Config.__init__ L27-L33; AmazonTitanG1Config.get_config L36-L51; AmazonTitanG1Config.get_supported_openai_params
  L53-L54; AmazonTitanG1Config.map_openai_params L56-L57; AmazonTitanG1Config._transform_request L59-L60; AmazonTitanG1Config._transform_response
  L62-L82. litellm/llms/bedrock/embed/amazon_titan_v2_transformation.py: AmazonTitanV2Config.__init__ L33-L37; AmazonTitanV2Config.get_config
  L40-L55; AmazonTitanV2Config.get_supported_openai_params L57-L58; AmazonTitanV2Config.map_openai_params L60-L74;
  AmazonTitanV2Config._transform_request L76-L77; AmazonTitanV2Config._transform_response L79-L117. litellm/llms/bedrock/embed/amazon_titan_multimodal_transformation.py:
  AmazonTitanMultimodalEmbeddingG1Config.__init__ L30-L31; AmazonTitanMultimodalEmbeddingG1Config.get_supported_openai_params
  L33-L34; AmazonTitanMultimodalEmbeddingG1Config.map_openai_params L36-L40; AmazonTitanMultimodalEmbeddingG1Config._transform_request
  L42-L53; AmazonTitanMultimodalEmbeddingG1Config._transform_response L55-L93. litellm/llms/bedrock/embed/cohere_transformation.py:
  BedrockCohereEmbeddingConfig.__init__ L14-L15; BedrockCohereEmbeddingConfig.get_supported_openai_params L17-L18;
  BedrockCohereEmbeddingConfig.map_openai_params L20-L28; BedrockCohereEmbeddingConfig._transform_request L33-L43.


  Named case contracts: titan_g1_request: G1 construction has no side effects, supported parameters are [], map_openai_params
  returns the same optional record unchanged, and request construction emits only inputText, ignoring all inference
  parameters. G1 get_config and V2 get_config inspect only own-class attributes, exclude dunder names, function/builtin/class/static
  methods and None, but retain single-underscore attributes. titan_v2_dimensions_normalize: V2 normalize and dimensions
  class settings default to None, not the AWS documentation defaults true/1024. Constructor non-None values persist
  in class configuration; None never resets a prior setting. Supported parameters are dimensions,encoding_format
  in that order. Mapping copies dimensions and maps float to embeddingTypes=[float], base64 to [binary], and every
  other supplied encoding including None to [float]. Request emits inputText plus inference parameters verbatim;
  duplicate inputText raises the source keyword-collision TypeError rather than overriding. titan_v2_binary_embedding:
  For each V2 reply prefer embeddingsByType.binary by key presence, including an empty vector, then embeddingsByType.float,
  then legacy embedding. The choice is independent of the requested encoding; binary remains an integer vector,
  not a base64 string. If none exists raise ValueError with No embedding data found in response: {response}. Preserve
  malformed nested-record failures and required inputTextTokenCount failures. titan_multimodal_image: The no-op
  multimodal constructor supports only dimensions, mapped to embeddingConfig.outputEmbeddingLength. B183 is_base64_encoded
  selects inputImage containing B183 get_base64_str; otherwise use inputText, including malformed data URLs and
  raw base64 strings. Copy every inference key afterward so callers can overwrite inputImage/inputText or add both.
  No URL is downloaded or treated specially. cohere_v3_input_type: The no-op Cohere constructor supports encoding_format,dimensions.
  Map a list of encodings elementwise, otherwise treat the value as a singleton: only base64 becomes float, all
  other values survive; dimensions becomes output_dimension. Delegate B037 CohereEmbeddingConfig._transform_request,
  then require input_type and retain only texts,images,input_type,truncate,embedding_types,output_dimension. Drop
  model and other extra fields. Exercise the parent last-input-only image classification, text default COHERE_DEFAULT_EMBEDDING_INPUT_TYPE=search_document,
  image default image, and inference overrides; B037 owns that global loader. token_count_response: G1, V2 and multimodal
  emit object=embedding and contiguous zero-based indices in response order; preserve model, sum required inputTextTokenCount
  into prompt_tokens and total_tokens, and set completion_tokens=0. Empty responses produce empty data and zero
  usage. TypedDict construction does not validate required keys or ignore extras: missing accessed fields fail at
  access. Multimodal counts every batch_data record containing inputImage, including a None value, independently
  of response count; set prompt_tokens_details.image_count only for a positive count and otherwise leave details
  None.


  Load normalize, dimensions through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest titan_embeddings_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  The normalize and dimensions loader cases target the AmazonTitanV2Config class configuration only; both default
  to None and are distinct from request dimensions mapping. B037 owns the shared Cohere embedding input-type setting
  and its loader; do not duplicate it here.


  Implement crates/betterlite-bedrock/src/titan_embeddings.rs with adjacent tests under titan_embeddings/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_titan_embeddings in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function titan_embeddings_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): titan_g1_request, titan_v2_dimensions_normalize, titan_v2_binary_embedding, titan_multimodal_image, cohere_v3_input_type,
  token_count_response. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_titan_embeddings* using HelperCase:
  kind: helper and the externally tagged bedrock_other_titan_embeddings variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_titan_embeddings that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 189 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 235 production lines, 245 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 45 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines.
