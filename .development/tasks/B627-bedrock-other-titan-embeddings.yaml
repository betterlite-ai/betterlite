checks:
  optional:
  - mutants
  commands:
  - id: case-titan-g1-request
    why: The titan-g1-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::titan_embeddings_cases::case_[0-9]+_titan_g1_request$/)'
  - id: case-titan-v2-dimensions-normalize
    why: The titan-v2-dimensions-normalize behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::titan_embeddings_cases::case_[0-9]+_titan_v2_dimensions_normalize$/)'
  - id: case-titan-v2-binary-embedding
    why: The titan-v2-binary-embedding behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::titan_embeddings_cases::case_[0-9]+_titan_v2_binary_embedding$/)'
  - id: case-titan-multimodal-image
    why: The titan-multimodal-image behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::titan_embeddings_cases::case_[0-9]+_titan_multimodal_image$/)'
  - id: case-cohere-v3-input-type
    why: The cohere-v3-input-type behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::titan_embeddings_cases::case_[0-9]+_cohere_v3_input_type$/)'
  - id: case-token-count-response
    why: The token-count-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::titan_embeddings_cases::case_[0-9]+_token_count_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_titan_embeddings.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_titan_embeddings*")"
      && grep -lq 'bedrock_other_titan_embeddings' tools/oracle/fuzz/corpus/helper_case/bedrock_other_titan_embeddings*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_titan_embeddings$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
