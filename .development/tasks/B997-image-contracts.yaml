references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/image_generation/transformation.py#L22-L109
  why: Generation's empty-header and URL defaults, JSON transport preference and inherited exception behavior.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/image_edit/transformation.py#L33-L161
  why: Edit class configuration, async mapping copies, identity finalization and multipart preference.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/image_variations/transformation.py#L28-L133
  why: Variation requires image-specific transforms and refuses the generic chat transform methods.
dod:
- text: >-
    image_transport_defaults gives generation and variation api_base=None,"",https://mock/v1 and expects
    "","",https://mock/v1. validate_environment with Authorization=secret returns {}. Edit's inherited URL
    default raises ValueError("api_base is required") for None and returns "" unchanged for an empty base.
    Generation use_multipart_form_data=false; edit=true. An edit finalizer receives {prompt:p} and any resolved
    URL and returns exactly {prompt:p}, without injecting the URL.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    edit_async_transform_copy passes prompt=None,image=None,options={n:2},headers={x:a}; the synchronous
    override sees those values once. Mutating its copied option/header mappings leaves the originals intact.
    Its returned data/files pair is the async result; a raised provider exception propagates unchanged.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    edit_class_configuration includes own values n=0,enabled=false,label="",none=None,__private=1,_abc_x=2,
    method,classmethod,staticmethod,property and a callable object plus an inherited size. get_config keeps
    n,enabled,label,property and the callable object only. Project descriptor kinds to tagged helper values;
    never serialize executable objects or accidentally use BaseConfig's stricter callable filter.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    image_base_errors supplies status=429,message="slow",headers={retry-after:2} to generation/edit error
    constructors and expects a raised BaseLLMException retaining all three. Generic variation transform_request
    raises NotImplementedError with source message "ImageVariationConfig implementa 'transform_request_image_variation'
    for image variation models"; generic transform_response uses "ImageVariationConfig implements
    'transform_response_image_variation' for image variation models". Generation's unimplemented request/response
    defaults use those same respective messages, including the source's variation wording and implementa typo.
    These are SDK exceptions, without an invented HTTP error type/param/code.
  proof: [behavior-tests, oracle, helper-python]
- text: New image_contracts seeds reach the native provider defaults and independently invoke the pinned base methods.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Interface defaults and leaf representations must be tested in both implementing crates.
    run: cargo nextest run --locked -p betterlite-provider -p betterlite-openai --no-tests=fail -E 'test(/^api::image_contracts::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: Base-method adapters must remain typed and invoke source behavior.
    run: test -f tools/oracle/helpers/image_contracts.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The parser must recognize the new image_contracts case variant.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/image_contracts-*)" && grep -qE '^[[:space:]]+image_contracts:' tools/oracle/fuzz/corpus/helper_case/image_contracts-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Default tests require new base-contract fixtures, independent of provider request cases.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/image-contracts)"
oracle_cases:
- tools/oracle/cases/helpers/image-contracts/image-transport-defaults.yaml
- tools/oracle/cases/helpers/image-contracts/edit-async-transform-copy.yaml
- tools/oracle/cases/helpers/image-contracts/edit-class-configuration.yaml
- tools/oracle/cases/helpers/image-contracts/image-base-errors.yaml
deviations: []
out_of_scope:
- B2202 owns BaseImageEditConfig.__init__ and BaseLLMException construction. All other methods in the three referenced classes belong here.
- B1120 owns every function in images/utils.py and the image request TypedDicts in types/images/main.py.
- B175 owns unsupported variation options; that provider-specific check was not behavior of these base classes.
pitfalls:
- 'The oracle helper for this task is pre-registered as image_contracts in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/image_contracts.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/image_contracts.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Edit accepts api_base="" although it rejects None; generation and variation collapse both to "".
- Edit get_config retains property descriptors and callable objects, unlike the shared chat base filter.
- Generation defaults to JSON while edit defaults to multipart; a shared true default breaks generation providers.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
