dod:
- text: 'variation unsupported param: the named production behavior test asserts the result and effects described
    above.'
  proof:
  - case-variation-unsupported-param
  - oracle
- text: The independent Rust/Python helper adapter and the externally tagged case seed execute through B171.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: Every listed case is a newly added parity fixture and compares independent native and pinned results.
  proof:
  - new-oracle-cases
  - oracle
  - helper-python
  - helper-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai -p betterlite-provider --no-tests=fail
      -E 'test(/^api::image_contracts::/) - test(/::replays_corpus$/)'
  - id: case-variation-unsupported-param
    why: the variation-unsupported-param behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_contracts::tests::variation_unsupported_param($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/image_contracts.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/image_contracts-*)"
      && grep -qE "^[[:space:]]+image_contracts:" tools/oracle/fuzz/corpus/helper_case/image_contracts-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/image-contracts)"
