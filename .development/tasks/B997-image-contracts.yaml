id: B997
title: Image provider contracts
description: >-
  Define the generation, edit and variation provider interfaces under betterlite-provider::api::image_contracts,
  using leaf records in betterlite-openai rather than depending on core. Own the three linked base classes
  except the no-op edit constructor assigned to B2202. Abstract methods become required enum dispatch methods;
  their Python pass bodies are not successful empty provider responses. Keep the inherited concrete defaults
  where provider implementations use them, including edit's identity finalization and sync-to-async mapping copy.

  Generation and variation base URLs use api_base or an empty string; edit rejects only None, not an empty
  string. Generation and variation environment defaults return a new empty header mapping, not their input.
  Generation defaults to JSON while edit defaults to multipart. Base error construction delegates to B2202's
  BaseLLMException projection. Edit get_config inspects only its class dictionary, excludes __ and _abc names,
  functions, builtins, classmethods, staticmethods and None; unlike BaseConfig it does not exclude properties
  or every callable. Model these descriptors in adapter fixtures rather than executing arbitrary Python.

  The helper operation image_contracts invokes concrete base defaults through a minimal test subclass. It
  performs no network operation and parses no outside bytes. All 289 nonblank/non-comment source lines include
  many signatures and abstract declarations; budget 150 interfaces/defaults, 125 tests, 95 cases, 100 adapters
  and 45 wiring lines, 515 total. B1120 owns edit records/MIME and B175 owns option capability enforcement.
