    why: Resolve B591 get_runtime_endpoint with api_base=None, kwargs.aws_bedrock_runtime_endpoint and the explicit
      aws_region_name argument; ignore the returned proxy endpoint. Strip trailing endpoint slashes and append /async-invoke/{quote(invocation_arn,safe=empty)}
