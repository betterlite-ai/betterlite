id: B632
title: Bedrock asynchronous embedding job status
description: >-
  Add one signed GetAsyncInvoke request and return its decoded status body unchanged. This helper does not poll,
  inspect job state, authorize output buckets or read S3 objects; B651 owns output retrieval. Preserve the exact
  URL, status check, logging and failure behavior below.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/embedding.py:
  BedrockEmbedding._get_async_invoke_status L587-L667.


  Named case contracts: async_invoke_status_url: Resolve B591 get_runtime_endpoint with api_base=None, kwargs.aws_bedrock_runtime_endpoint
  and the explicit aws_region_name argument; ignore the returned proxy endpoint. Strip trailing endpoint slashes
  and append /async-invoke/{quote(invocation_arn,safe=empty)} using B171 encoding. Start Content-Type=application/json.
  Inside B595 run_aws_signing, call B693 _load_credentials(kwargs) without a bearer, then B693 _sign_get_request
  with the explicit method region, ignoring the region returned by credential loading. No api_key bearer shortcut
  is applied. status_body_passthrough: Use the B173 async BEDROCK client with no per-call timeout/client override
  and GET the prepared URL/headers. Only status exactly 200 returns decode_async_embedding_status(response bytes).
  Preserve arbitrary parsed JSON, including InProgress,Completed,Failed states, unknown keys, malformed metadata
  shapes, nonobject JSON and any S3 URI without fetching it. Empty/malformed JSON propagates a decoder error. Job
  failure in a 200 body is not converted into an exception. status_http_failure: Every non-200 status, including
  other successful statuses such as 201/204, raises generic Exception Failed to get async invoke status: {status_code}
  - {response.text}. Transport and signing failures propagate unchanged; no 408 or BedrockError conversion is added
  here. Log the received response before testing its status. status_logging: When logging_obj is supplied, use B249
  _get_masked_headers for the curl-only view, retaining iteration order. Construct request_str with two leading
  newlines, GET Request Sent from LiteLLM:, then curl -X GET plus backslash-newline, prepared URL plus backslash-newline,
  space-joined -H '{key}: {value}' fragments and a final newline. pre_call input is invocation_arn, api_key empty,
  and additional_args contains complete_input_dict={invocation_arn},api_base,headers,request_str. post_call uses
  the raw HTTP response and complete_input_dict. With no logging object, neither callback nor header masking runs.


  Write standalone Rust test embedding_jobs_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test embedding_jobs_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/embedding_jobs.rs with adjacent tests under embedding_jobs/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_embedding_jobs in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function embedding_jobs_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): async_invoke_status_url, status_body_passthrough, status_http_failure, status_logging. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_jobs* using HelperCase:
  kind: helper and the externally tagged bedrock_other_embedding_jobs variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_embedding_jobs that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Outside-byte boundary: decode_async_embedding_status consumes async-invoke JSON reply bytes in crates/betterlite-bedrock/src/embedding_jobs.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_embedding_jobs.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_other_embedding_jobs.
  The adjacent test replays_the_bedrock_other_embedding_jobs_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 60 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 115 production lines, 190 behavior/config-test lines, 80 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 465 planned, 475 maximum changed lines.
