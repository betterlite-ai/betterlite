    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_cases::case_[0-9]+_status_logging$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_credential_identity_isolation$/)'
