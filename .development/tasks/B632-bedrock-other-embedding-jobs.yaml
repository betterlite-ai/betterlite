id: B632
title: Bedrock asynchronous embedding job status
description: >-
  Add AsyncEmbeddingStatus retrieval for signed invocation ARN/status and configured S3 outputs, preserving provider-native
  job metadata and result selection. Consume the S3 authorization primitive from the file-service split, never fetch
  arbitrary URLs embedded in a job response. Forward status and explicitly bounded reads without creating an unowned
  polling task.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/embed/embedding.py:
  BedrockEmbedding._get_async_invoke_status L587-L667.


  Implement crates/betterlite-bedrock/src/embedding_jobs.rs with adjacent tests under embedding_jobs/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_embedding_jobs in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function embedding_jobs_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): async_invoke_status_url, in_progress_status, completed_output_location, failed_job, configured_s3_output_read,
  foreign_output_bucket. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_jobs* using HelperCase:
  kind: helper and the externally tagged bedrock_other_embedding_jobs variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_embedding_jobs that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Outside-byte boundary: decode_async_embedding_status consumes async-invoke JSON reply bytes in crates/betterlite-bedrock/src/embedding_jobs.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_embedding_jobs.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_other_embedding_jobs.
  The adjacent test replays_the_bedrock_other_embedding_jobs_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 60 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 95 production lines, 99 behavior/config-test lines, 79 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 353 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/embedding_jobs.rs
  - crates/betterlite-bedrock/src/embedding_jobs/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_other_embedding_jobs.rs
  - tools/oracle/src/helpers/bedrock_other_embedding_jobs/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_other_embedding_jobs.py
  - tools/oracle/cases/helpers/providers/bedrock-other-embedding-jobs/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_jobs*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_embedding_jobs.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_other_embedding_jobs/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/embed/embedding.py#L587-L667
  why: Own BedrockEmbedding._get_async_invoke_status. Other functions in this file remain with the owners listed
    below.
dod:
- text: >-
    async invoke status url: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-embedding-jobs/async-invoke-status-url.yaml.
  proof:
  - case-async-invoke-status-url
  - oracle
  - helper-python
- text: >-
    in progress status: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-embedding-jobs/in-progress-status.yaml.
  proof:
  - case-in-progress-status
  - oracle
  - helper-python
- text: >-
    completed output location: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-embedding-jobs/completed-output-location.yaml.
  proof:
  - case-completed-output-location
  - oracle
  - helper-python
- text: 'failed job: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-embedding-jobs/failed-job.yaml.'
  proof:
  - case-failed-job
  - oracle
  - helper-python
- text: >-
    configured s3 output read: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-embedding-jobs/configured-s3-output-read.yaml.
  proof:
  - case-configured-s3-output-read
  - oracle
  - helper-python
- text: >-
    foreign output bucket: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-embedding-jobs/foreign-output-bucket.yaml.
  proof:
  - case-foreign-output-bucket
  - oracle
  - helper-python
- text: New bedrock_other_embedding_jobs seeds parse as the intended call variant and replay through the shared
    production parser.
  proof:
  - helper-case-corpus
- text: decode_async_embedding_status has newly committed malformed and boundary inputs replayed through production
    parsing.
  proof:
  - parser-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-async-invoke-status-url
    why: The async-invoke-status-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_cases::case_[0-9]+_async_invoke_status_url$/)'
  - id: case-in-progress-status
    why: The in-progress-status behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_cases::case_[0-9]+_in_progress_status$/)'
  - id: case-completed-output-location
    why: The completed-output-location behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_cases::case_[0-9]+_completed_output_location$/)'
  - id: case-failed-job
    why: The failed-job behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_cases::case_[0-9]+_failed_job$/)'
  - id: case-configured-s3-output-read
    why: The configured-s3-output-read behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_cases::case_[0-9]+_configured_s3_output_read$/)'
  - id: case-foreign-output-bucket
    why: The foreign-output-bucket behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::embedding_jobs_cases::case_[0-9]+_foreign_output_bucket$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_embedding_jobs.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_jobs*")"
      && grep -lq 'bedrock_other_embedding_jobs' tools/oracle/fuzz/corpus/helper_case/bedrock_other_embedding_jobs*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_embedding_jobs$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_other_embedding_jobs)"
      && grep -q 'decode_async_embedding_status' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_embedding_jobs.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_other_embedding_jobs_corpus$/)'
