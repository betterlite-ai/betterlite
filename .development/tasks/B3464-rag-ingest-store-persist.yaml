id: B3464
title: Persist RAG ingestion store rows and file metadata
description: >-
  Add the module `rag_ingest_store` to betterlite-server (crates/betterlite-server/src/rag_ingest_store.rs and
  the folder beside it). It is what LiteLLM does after a successful `/v1/rag/ingest` call: it records the
  vector store in the database, or appends the new file to the metadata of a store that is already there. It
  owns `_build_file_metadata_entry` (endpoints.py:205-254) and `_save_vector_store_to_db_from_rag_ingest`
  (endpoints.py:257-388). It lives in the top crate because the row creation, `create_vector_store_in_db`, is
  B1069's code in betterlite-server and no lower crate may call it. B3465 calls this module from the ingest
  route after the ingest call returns, and only when a database is attached and the ingest call returned a
  response. That outer condition is B3465's, not this task's.

  Types. `IngestedFile` holds `file_id: Option<String>` and `vector_store_id: Option<String>`, the two fields
  LiteLLM reads from the ingest response. B3465 builds it from B3460's response, so this task depends on no
  B3460 type. `UploadedFileInfo` holds `filename: String`, `size: u64` (the byte length of the content) and
  `content_type: String`. `FileMetadataEntry` is serde-serializable with `file_id: Option<String>`,
  `filename: Option<String>`, `file_url: Option<String>`, `ingested_at: String` and, only when present,
  `file_size: u64` and `content_type: String` (skipped when None, never written as null). The four first
  fields are always present in the JSON, null when empty, in that order.

  `build_file_metadata_entry(file_id: Option<&str>, file: Option<&UploadedFileInfo>, file_url: Option<&str>, now:
  DateTime<Utc>) -> FileMetadataEntry` is pure. The time is passed in; read it from the clock B198 provides,
  never call `Utc::now()` in this module. `ingested_at` copies Python's `datetime.isoformat()` for a UTC
  datetime: `YYYY-MM-DDTHH:MM:SS.ffffff+00:00`, and the `.ffffff` part is left out when the microsecond is zero.
  An empty `filename` or `content_type` string is still written (Python tests the tuple, not the strings).

  Persistence. `RagIngestStore` is built with its dependencies: a `VectorStoreRows` trait object (the database
  port) and the clock. `VectorStoreRows` has three async methods: `find(vector_store_id) -> Result<Option<
  StoredVectorStore>, RowError>`, `create(NewVectorStoreRow) -> Result<(), RowError>` and
  `replace_metadata(vector_store_id, metadata_json: String) -> Result<(), RowError>`. `StoredVectorStore`
  carries `vector_store_metadata: Option<StoredMetadata>`, where `StoredMetadata` is `Text(String)` or
  `Object(serde_json::Map)`, because the column can hold either (B858's row type decides how it arrives; map
  it into these two). The real implementation, `PostgresVectorStoreRows`, uses B726's managed-vector-store
  repository for `find` (find_unique by vector_store_id) and `replace_metadata` (update of only
  `vector_store_metadata`), and B1069's `create_vector_store_in_db` for `create`, public at `betterlite_server::api::vector_management_write::create_vector_store_in_db`. Read the merged code of both
  to get the exact names; if `create_vector_store_in_db` is private to its module, stop and say so.

  `RagIngestStore::save(&self, ingested: &IngestedFile, options: &RAGIngestOptions, auth: &AuthIdentity, file:
  Option<&UploadedFileInfo>, file_url: Option<&str>, store_is_managed: bool)` follows this order, which is
  LiteLLM's:
  1. `vector_store_id` None: log warning "Vector store ID is None or not a string, skipping database save" and
  return. (Python's second warning, "Unable to extract vector_store_id from response type", is for objects with
  no such attribute; the typed input makes that case impossible.)
  2. Read `custom_llm_provider`, and `vector_store_name` and `vector_store_description` from
  `litellm_vector_store_params`, from the options (B3450 and B5134 own that type; a record without a provider
  is the openai variant).
  3. Build `provider_specific_params`: every field of the vector_store record except `custom_llm_provider` and
  `vector_store_id` whose value is not null, as a JSON object. The api_key is a SecretString elsewhere; here
  it must be written out as the real value, because LiteLLM stores it in litellm_params and redacts it only
  when it returns rows. Use an explicit expose call and never log the params.
  4. Build the file entry with `build_file_metadata_entry`.
  5. `find` the row. Row absent and `store_is_managed`: log info "Vector store %s is config-registered,
  skipping database save" and return. Row absent otherwise: `create` with metadata `{"ingested_files":
  [entry]}`, name `vector_store_name` or, when that is None or empty, "RAG Vector Store - " plus the first 8
  characters of the id; description likewise or "Created via RAG ingest endpoint"; provider `custom_llm_provider`
  or "openai" when None or empty; `litellm_params` the params object, or None when it is empty; team_id and
  user_id from the auth identity. `create` goes through B1069's function, which does the safe_dumps of the
  metadata.
  6. Row present: stored metadata is `Text` -> parse as a JSON object; `Object` -> use it; None or an empty text
  or empty object -> an empty object (Python's `or {}`). Take `ingested_files`: when it is an array, the new
  array is its items plus the entry; any other value, or no key, gives a one-item array. Set it back, keep every
  other metadata key, serialize with B192's safe_dumps rule (NUL removal, depth 100) and call
  `replace_metadata`. Log info "Added file %s to vector store %s metadata" with the filename, else the file_url,
  else "Unknown" (a null filename falls to the url; an empty filename also falls through, as Python's `or` does).
  7. Any error from `find`, `create`, `replace_metadata`, the metadata parse or the serializer is logged at error
  level with "Failed to save vector store %s to database: %s" and swallowed. The ingest already succeeded, so
  `save` returns `()`. This includes a duplicate-id 400 or a config-owned 400 coming out of
  `create_vector_store_in_db`. Do not swallow task cancellation.

  The info logs keep LiteLLM's texts: "Saving newly created vector store %s to database", "Vector store %s saved
  to database successfully", "Vector store %s already exists, appending file to metadata".

  Do not claim atomicity: find, then create or update, is a read-modify-write with no lock, so two concurrent
  ingests into one store can lose a file entry, exactly as in LiteLLM. Keep that order of writes.

  Tests. Native tests in `rag_ingest_store::tests` use an in-memory `VectorStoreRows` fake that records calls
  and can be told to fail. One named test per DoD item. `PostgresVectorStoreRows` gets tests under
  `rag_ingest_store::postgres_tests` that use POSTGRES_TEST_URL or testcontainers, like B726's, and fail when
  the database is unavailable. Oracle helper cases cover only `build_file_metadata_entry`; they strip
  `ingested_at` from both sides after checking it matches the isoformat pattern, since the two sides read
  different clocks. Size: about 110 LiteLLM lines, 170 implementation, 260 test, 80 adapters.

scope:
