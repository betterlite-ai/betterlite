id: B019
title: Input and output token reservations and reconciliation
description: 'Integrate B365 IoReservation into B016 pre-call checks and B017 retry ownership. Reconcile
  normalized B014 final usage, refund failed/stale attempts against the original minute, retain reservations
  when usage is absent, and publish ITPM/OTPM remaining headers. B319 supplies independent model RPM/TPM
  checks; this task composes them without adding any selector. Implement the owned native service in crates/betterlite-router/src/io_token_limits.rs.
  Add ProbeOperation::IoTokenLimits in tools/oracle/src/router_probes/mod.rs and the corresponding B019 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_utils/pre_call_checks/io_token_rate_limit_check.py:
  io_token_reconcile_success (L528-L576), async_io_token_reconcile_success (L579-L637), io_token_refund_failure
  (L640-L661), refund_stale_reservation_before_retry (L664-L688), async_io_token_refund_failure (L691-L716),
  build_io_token_rate_limit_headers (L719-L738). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
scope:
