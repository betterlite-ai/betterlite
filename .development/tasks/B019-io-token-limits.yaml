out_of_scope:
- Key/team budgets and account rate limits.
- Provider-specific usage parsing, which remains in B014 and endpoint adapters.
- B365 owns input and output token reservation primitives; consume its tested public interface.
- 'litellm/router_utils/pre_call_checks/io_token_rate_limit_check.py: B365 owns: set_io_token_rate_limit_request_kwargs
  (L48-L62), get_io_token_rate_limit_request_kwargs (L65-L66), seconds_until_minute_reset (L69-L71), get_deployment_io_token_limits
  (L74-L89), deployment_has_io_token_limits (L92-L94), _get_cache_keys (L97-L106), _estimate_input_tokens
  (L109-L122), _model_max_output_tokens (L125-L133), _resolve_max_tokens (L136-L153), _get_usage_tokens
