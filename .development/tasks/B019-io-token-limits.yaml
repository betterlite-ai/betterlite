  (L203-L234), _stash_reservation_in_metadata (L237-L258), _extract_reservation (L261-L269), _as_mutable_mapping
  (L272-L274), _reservation_channels (L277-L290), _read_reservation_from_kwargs (L293-L297), _clear_reservation_from_kwargs
  (L300-L309), _reservation_value (L312-L322), _rate_limit_error (L325-L343), _sync_increment_with_rollback
  (L346-L367), _increment_with_rollback (L370-L394), io_token_pre_call_check (L397-L456), async_io_token_pre_call_check
  (L459-L525).'
pitfalls:
- Missing usage retains the reservation rather than assuming zero consumption.
- Refund against the original reservation's minute key even after the clock advances.
- Do not silently substitute model TPM for input/output-specific limits.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
