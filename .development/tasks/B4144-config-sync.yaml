  - text: The subscriber backoffs exponentially from 5s to 60s on subscription failures and resets on success.
    proof: [config-sync-unit-tests]
  - text: The subscriber debounces inbound messages by 1.0 second, adds jitter up to 5.0 seconds, and enforces a 10 second minimum interval between resyncs.
    proof: [config-sync-unit-tests]
  - text: The subscriber drains pending messages when one arrives and runs each resync callback, logging a warning if any callback fails.
