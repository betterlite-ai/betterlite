checks:
  optional: []
  commands:
    - id: config-sync-unit-tests
      why: the config sync module tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/^config_sync::/)'
oracle_cases: []
deviations:
  - what: betterlite skips parsing and validation of the published pubsub message body, matching LiteLLM's behavior.
    why: At the pinned commit, LiteLLM's ConfigSyncSubscriber._consume (line 244-253) never parses or decodes the message body; it only checks that the message is not None before proceeding. Neither side validates the message content.
out_of_scope:
  - Table write filtering or hooks beyond the synced table list.
  - Per-deployment or per-fleet config versions.
  - Conflict resolution when multiple instances publish concurrent changes.
pitfalls:
  - The constants CONFIG_SYNC_DEBOUNCE_SECONDS, CONFIG_SYNC_JITTER_MAX_SECONDS and CONFIG_SYNC_MIN_RESYNC_INTERVAL_SECONDS are in seconds as floats. Tokio asyncio.sleep takes a Duration; use Duration::from_secs_f64.
  - The backoff calculation doubles the previous backoff each time; use min(backoff * 2, _BACKOFF_MAX_SECONDS) to cap it.
  - A failed resync callback must not stop the subscriber loop. Catch exceptions on each callback, log and continue.
  - The minimum resync interval check uses monotonic time, not wall clock time. Use a clock trait argument for testability.
  - LiteLLM's jitter is uniform(0, max); do not accidentally use a normal distribution.
  - Drain and subscribe messages both return on timeout (1 second in LiteLLM); a None timeout means "no message", not "error".
  - The subscriber task must be cancelled cleanly on shutdown. Hold it in a JoinSet the server drains, not a detached spawn.
review_level: standard
budget:
