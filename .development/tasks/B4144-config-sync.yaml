id: B4144
title: Publish config changes and coordinate subscriber reloads
description: >-
  Add config change publishing and subscriber coordination for fleet-wide config resyncing via Redis pubsub.
  When a database table betterlite syncs (litellm_proxymodeltable, litellm_credentialstable, litellm_guardrailstable, litellm_policytable, litellm_policyattachmenttable, litellm_managedvectorstorestable, litellm_managedvectorstoreindextable, litellm_mcpservertable, litellm_agentstable, litellm_prompttable, litellm_searchtoolstable, litellm_ssoconfig, litellm_cacheconfig, litellm_configoverrides, litellm_uisettings) changes, a message publishes to the Redis channel litellm_proxy.config_change (or {namespace}:litellm_proxy.config_change if coordination_redis has a namespace).
  The published message is a JSON object with an object_type field set to the table name.
  Subscribers listen on that channel with a debounce of 1.0 second, jitter up to 5.0 seconds, and a minimum resync interval of 10 seconds to cap the fleet-wide reload rate.
  When a message arrives, the subscriber drains pending messages, sleeps for debounce plus random jitter, waits for the minimum resync interval to pass since the last resync, then runs a list of resync callbacks.
  If any callback fails, the subscriber logs a warning but continues with the next callback.
  Subscribe failures backoff exponentially: 5 seconds initially, doubling up to 60 seconds, resetting when subscription succeeds.
  The subscriber is an async task the server owns and stops on shutdown.
  Dependencies are injected through constructors: a RedisCache from coordination_redis config (B360), a time source (time.monotonic for production, testable through a clock argument), a random source (for jitter), and a list of async resync callbacks the server provides.
  A helper publishes on behalf of table writes: wrap_table_actions_for_config_sync intercepts Prisma create, create_many, update, update_many, upsert, delete and delete_many calls and publishes after each write completes.
