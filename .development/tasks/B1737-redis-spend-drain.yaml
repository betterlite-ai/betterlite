    why: Log codecs, entity map merge, constructor and enable policy.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/redis_update_buffer.py#L546-L587
    why: Bounded parked logs and destructive row drain.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/redis_update_buffer.py#L674-L768
    why: Fixed seven-slot pipeline decoding and padding.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/redis_update_buffer.py#L786-L801
    why: Live daily-tag reader's lower pop operation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/redis_update_buffer.py#L903-L977
    why: Daily-tag aggregate, entity decode/merge and owned queue event.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L386-L398
    why: Redis buffer names, count environment binding and fixed log caps.
dod:
  - text: Redis drains preserve queue order, None/empty distinctions and post-pop parse failure behavior.
    proof: [redis-drain-tests, spend-buffer-corpus, oracle, redis-codec-python, redis-codec-corpus]
  - text: Spend-log parking obeys enable policy, trims oldest rows and returns false on failure for memory fallback.
    proof: [redis-drain-tests, redis-settings, redis-config-corpus, oracle, redis-codec-python]
checks:
  optional: [mutants]
  commands:
    - id: redis-drain-tests
      why: Redis buffer draining, trimming or failure behavior is absent.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^redis_spend::/) - test(replays_the_spend_buffer_corpus)'
    - id: redis-settings
      why: Redis spend enable/count settings are not loaded by config.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(loads_redis_spend_settings)'
    - id: redis-config-corpus
      why: Buffer policy has no new configuration-parser seed.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/redis-spend-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: spend-buffer-corpus
      why: Redis JSON variants lack a replayed byte-parser corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/spend_buffer)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_spend_buffer_corpus)'
    - id: redis-codec-python
      why: Redis row/merge adapters are absent or fail strict checking.
      run: test -f tools/oracle/helpers/redis_spend_codec.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: redis-codec-corpus
      why: Redis codec operations have no tagged helper input.
      run: grep -rlq 'redis_spend_codec:' tools/oracle/fuzz/corpus/helper_case/redis-spend-codec-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/redis-spend-codec/datetime-nul-and-nonobject-rows.yaml
  - tools/oracle/cases/helpers/redis-spend-codec/eleven-maps-missing-nonmapping-and-sums.yaml
  - tools/oracle/cases/helpers/redis-spend-codec/scalar-list-and-invalid-json.yaml
deviations:
  - what: A Redis spend record over 64 MiB fails decoding with a typed limit error and follows the caller's existing parse-failure path.
    why: Buffer records are external bytes and must have a finite allocation bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/redis_update_buffer.py#L923-L933
out_of_scope:
  - B1738 owns transaction publishing/restoration and daily-tag publication in redis_update_buffer.py.
  - _number_of_transactions_to_store_in_redis, _remove_prefix_from_keys, get_all_update_transactions_from_redis_buffer and the individual daily user/team/org/end-user/agent getters have no caller at the pin and are not built.
pitfalls:
  - 'The oracle helper for this task is pre-registered as redis_spend_codec in the db group. Replace the stub Op in tools/oracle/src/helpers/db/redis_spend_codec.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/redis_spend_codec.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The daily-tag queue is deliberately absent from the main seven-slot pipeline.
  - Malformed JSON is discovered after destructive LPOP and cannot be treated as a harmless cache miss.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
