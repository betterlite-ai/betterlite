    - crates/betterlite-db/src/redis_spend.rs
    - crates/betterlite-db/src/redis_spend/**
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/spend_storage.rs
    - crates/betterlite-config/src/spend_storage/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/redis-spend-*
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/spend_buffer.rs
    - crates/betterlite-db/fuzz/corpus/spend_buffer/**
    - tools/oracle/src/helpers/db/redis_spend_codec.rs
    - tools/oracle/src/helpers/db/redis_spend_codec/**
    - tools/oracle/helpers/redis_spend_codec.py
    - tools/oracle/helpers/redis_spend_codec/**
    - tools/oracle/cases/helpers/redis-spend-codec/**
    - tools/oracle/fuzz/corpus/helper_case/redis-spend-codec-*
