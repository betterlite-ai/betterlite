id: B1737
title: Decode Redis spend batches and park capped request logs
description: >-
  Add betterlite-db::redis_spend for the buffer constructor, enable policy, serialization,
  entity merge helpers, seven-queue pipeline drain, daily-tag drain and spend-log parking.
  Load general_settings.use_redis_transaction_buffer (default false): strings trim/lower
  and recognize only true/false; null or unrecognized strings disable it. Load integer
  MAX_REDIS_BUFFER_DEQUEUE_COUNT from the environment, default 100, preserving Redis's
  handling of zero/negative counts rather than inventing a minimum. A named config test
  loads both settings and exercises reload snapshots without process-environment mutation.
  Keep the pinned Redis key literals for main, daily user/team/org/end-user/agent/tag,
  window and spend-log buffers. A pipeline destructively pops at most the configured count
  from seven queues in that order, excluding daily tags. Pad short result arrays with None
  and ignore extra results. Entity results accept one JSON string or a string list and
  combine all eleven maps; absent/nonmapping entity fields contribute nothing. Daily and
  window slots retain their list-of-strings contract and use B1733/B1734 aggregation.
  None stays None rather than an empty aggregate. Decode errors propagate after the pop;
  do not pretend the Redis read and database write form one transaction. The separate
  daily-tag reader uses the same count and daily parser. Retain _lpop_daily_spend_transactions
  as the shared operation only where this live caller needs it.
  Park spend-log rows only when enabled, attached to Redis and nonempty. JSON datetime
  fallback uses isoformat, other foreign values stringify; unlike transaction safe_dumps,
  this row encoder does not strip NULs. RPUSH-and-trim keeps the newest 100000 rows and
  logs the number of oldest rows discarded; this cap is a fixed constant, not an env var.
  Any parking exception returns false for the caller's memory fallback. Draining accepts
  a scalar or list result, drops decoded nonobjects and propagates malformed JSON. Return
  an empty tuple when disabled/unattached. Transaction encoding reuses B192 safe_dumps.
  Expose the queue-size event emitter through B1690's owned service sink, retaining the
  source call_type label and gauge service/value. Define decode_spend_buffer(kind,bytes)
  for entity/daily/window/log records with typed Decimal/counters and a 64 MiB byte ceiling;
  fuzz every kind and distinguish nonobject log rows from malformed records. Emit a typed
  limit failure, caught only by the same callers that catch an ordinary parse failure.
  Pure redis_spend_codec oracle cases test row encoding/decoding and entity merges. Native
  Redis tests prove destructive reads, missing slots, trimming, cap warnings and parser
  failures. The live read/codec/config/event cohort is about 290 source lines, budgeted
  at 800 with configuration and byte-decoder checks.
scope:
