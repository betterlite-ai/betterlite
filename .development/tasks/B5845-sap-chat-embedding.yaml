dod:
  - text: The supported parameter list follows the model prefix rules for response_format and tool_choice.
    proof: [sap-chat-tests, sap-chat-python, oracle]
  - text: Chat requests build the orchestration body with the dropped keys, the module layout, stream options and placeholder values.
    proof: [sap-chat-tests, oracle]
  - text: Fallback modules are built from their own params and the missing model error matches LiteLLM.
    proof: [sap-chat-tests, oracle]
  - text: Tool, response format, grounding, masking, filtering and translation parameters land in the right module position.
    proof: [sap-chat-tests, oracle]
  - text: Chat responses parse final_result and strip Markdown fences only for Anthropic JSON replies.
    proof: [sap-chat-tests, oracle]
  - text: Environment setup turns credential errors into status 400 and returns only the four SAP headers.
    proof: [sap-chat-tests, oracle]
  - text: Embedding requests, limits, parameters, URL and response match LiteLLM.
    proof: [sap-embedding-tests, oracle]
  - text: New chat and embedding seeds replay through the helper case parser.
    proof: [sap-chat-seeds]
checks:
  optional: [mutants]
  commands:
    - id: sap-chat-tests
      why: the supported list, request layout, fallback handling, response parsing or header rules are missing
      run: >-
        cargo nextest run --locked -p betterlite-provider --no-tests=fail
        -E 'test(/^sap_chat::/)'
    - id: sap-embedding-tests
      why: embedding parameters, request limits, URL or response parsing are missing
      run: >-
        cargo nextest run --locked -p betterlite-provider --no-tests=fail
        -E 'test(/^sap_embedding::/)'
    - id: sap-chat-python
      why: the strict oracle adapter fails lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5845)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5845 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5845/pyrightconfig.json
    - id: sap-chat-seeds
      why: new helper seeds are missing or do not select this helper operation
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/sap_chat-*")" &&
        grep -lE '^[[:space:]]+b5845:' tools/oracle/fuzz/corpus/helper_case/sap_chat-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/sap-chat/supported-params-by-model.yaml
  - tools/oracle/cases/helpers/sap-chat/request-basic-and-dropped-keys.yaml
  - tools/oracle/cases/helpers/sap-chat/request-stream-options-and-placeholders.yaml
  - tools/oracle/cases/helpers/sap-chat/request-tools-and-response-format.yaml
  - tools/oracle/cases/helpers/sap-chat/request-optional-modules.yaml
  - tools/oracle/cases/helpers/sap-chat/request-fallback-modules.yaml
  - tools/oracle/cases/helpers/sap-chat/response-anthropic-json-fence.yaml
  - tools/oracle/cases/helpers/sap-chat/environment-api-key-and-400.yaml
  - tools/oracle/cases/helpers/sap-chat/embedding-request-and-limits.yaml
  - tools/oracle/cases/helpers/sap-chat/embedding-params-url-response.yaml
deviations:
  - what: Config objects are built from plain arguments (token, base URL, resource group, deployment URL). LiteLLM's lazy `run_env_setup` and `cached_property` caching belong to the caller that holds the config.
    why: These modules are pure. B8331 builds one config per call and keeps its deployment URL for that call.
  - what: The Markdown fence strip uses the Rust regex crate with the same pattern.
    why: Rust and Python regex engines agree on this pattern. Cases with a fence, no fence and a `json` tag confirm it.
out_of_scope:
  - OpenAIGPTConfig members the SAP config inherits and does not override (map_openai_params, the error class for chat, `_transform_messages`); B668 owns them.
  - '`_SAP_MODEL_PARAMS_EXCLUDED_KEYS` and `_tools_response_format_and_stream` in transformation.py have no caller at the pin.'
  - EmbeddingsResponse, FinalResult, EmbeddingItem and Usage in embed/transformation.py have no caller at the pin (the response is read straight from `final_result`).
  - The class-level settings of `GenAIHubOrchestrationConfig.__init__` and `get_config`, which main.py:2363 merges into optional_params for keys not already set; B8331 owns `_complete_sap` and that merge. `model_version = "latest"` is always part of that merge.
  - Provider selection for `sap/`, ProviderConfigManager entries and utils.py:3990 embedding mapping; B2230 owns the chat config selection, B8331 the SAP embedding config branch and B157 the utils.py:3990 mapping.
  - Real HTTP, the dispatch wiring, the route cases through the booted proxy and `sap_gen_ai_hub_emb`; B8331 owns them.
pitfalls:
  - '`tool_choice` is in the supported list for most models but `transform_request` pops it, so it never reaches SAP.'
  - '`validate_environment` returns SAP''s headers and drops the caller''s headers, so `extra_headers` do not reach SAP.'
  - The `api_key` argument is a service key (a JSON string), not a bearer token.
  - '`get_complete_url` keeps a trailing slash on the deployment URL, while the embedding URL trims it.'
  - The embedding `map_openai_params` ignores `encoding_format` and `dimensions`, so they are never sent. Only `parameters`, `version`, `timeout`, `max_retries`, `type` and `masking` reach the body.
  - Fallback `messages` are passed as given and are only checked by the final request validation, not by the role switch.
  - 'An assistant message with `content: null` and tool calls fails B5951''s content check. Do not special-case it.'
  - Only `strict` is dropped for `gpt` models, and only from the model params, not from tool definitions.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
