id: B5845
title: SAP chat and embedding request and response transforms
description: >-
  Add `sap_chat` and `sap_embedding` to betterlite-provider. They port litellm/llms/sap/chat/transformation.py
  (`GenAIHubOrchestrationConfig`) and litellm/llms/sap/embed/transformation.py (`GenAIHubEmbeddingConfig`) as pure
  transforms. Credentials, the token and the deployment URL come from B5950 (`sap_auth`), the wire validation from B5951
  (`sap_models`), and the error type and stream iterators from B5952 (`sap_stream`). Inputs from the running
  config (token, base URL, resource group, deployment URL) are plain arguments. Nothing here sends a request.

  Chat, supported parameters. `get_supported_openai_params(model)` returns, in this order, frequency_penalty, logit_bias,
  logprobs, top_logprobs, max_tokens, max_completion_tokens, prediction, n, presence_penalty, seed, stop, stream,
  stream_options, temperature, top_p, tools, tool_choice, function_call, functions, extra_headers, parallel_tool_calls,
  response_format, timeout. `response_format` is removed for models starting with `amazon`, `cohere` or `alephalpha` and for
  the exact name `gpt-4`. `tool_choice` is removed for models starting with `gemini` or `amazon`. The inherited
  `map_openai_params` (B668 owns it) takes this list as its allowlist.

  Chat, environment and URL. `validate_environment(api_key)` sets up credentials with the api_key as a service key when it
  is truthy (`run_env_setup(service_key)`), and returns exactly the four headers from B5950's `orchestration_headers`.
  The caller's `headers` argument is ignored. A credentials `ValueError` becomes `SapOrchestrationError` with status 400 and the first
  message arg; other failures are not wrapped. `get_complete_url` is `<deployment_url>/v2/completion` with no trailing slash trimming.

  Chat, request. `transform_request(model, messages, optional_params)` works on a copy. Drop `deployment_url`. Convert each
  message with `_messages_to_sap_template`: role user, assistant and tool use SAPUserMessage, SAPAssistantMessage and
  SAPToolChatMessage, every other role uses SAPMessage, each through B5951's validators. Pop `placeholder_values` (kept
  only when not null), `fallback_sap_modules` (default empty), `stream` and `tool_choice` (dropped, never sent). Pop
  `stream_options` and keep only `chunk_size` and `delimiters` for `config.stream`. Build the main module with
  `_build_prompt_module(model, template, copy of the remaining params)`, then one more module per fallback entry: copy the entry,
  pop `model` (missing or null is the error "Each entry in `fallback_sap_modules` must include a 'model' key."), remove a
  leading `sap/`, pop `messages` (default empty, passed unvalidated to this step), and use the rest as that module's params.
  `config.modules` is the single module when there is one and the list otherwise; `config.stream` is added only when
  `stream_options` supplied a key. The body is `{"config": ..., "placeholder_values": ...}` run through
  `validate_orchestration_request`.

  `_build_prompt_module`: for model names starting with `gpt`, drop `strict`. Pop `model_version` (default `latest`).
  Pop `tools` (default empty) and validate each as ChatCompletionTool (full dump); write `tools` only when non-empty. Pop
  `response_format` (default empty); when its `type` is truthy, `json_schema` goes through ResponseFormatJSONSchema and any
  other type through ResponseFormat, and it is written only then. Pop `placeholder_defaults` and write it as `defaults` only
  when non-empty. Move `grounding`, `masking`, `filtering` and `translation` out of the params to the module level when they are
  not null. What is left is `model.params`, with `model.name` and `model.version`. The module shape is
  `{"prompt_templating": {"prompt": {template, defaults?, tools?, response_format?}, "model": {name, params, version}}, grounding?, masking?, filtering?, translation?}`.

  Chat, response. `transform_response` calls the post-call logging sink with the messages, api key, raw response text and
  request body (the injected sink pattern B668 uses), parses the body's `final_result` with B004's chat response record, and
  when the request's `response_format.type` is `json_object` or `json_schema` and the model starts with `anthropic`
  strips a surrounding Markdown fence from every non-empty choice message content: trim the content, and when it
  matches ``^```(?:json)?\s*\n?(.*?)\n?```$`` with dot-matches-newline, replace the content with the trimmed capture.
  `get_model_response_iterator` returns B5952's Sync or Async iterator by the `sync_stream` flag.

  Embedding. `get_supported_openai_params(model)` is `encoding_format` and `dimensions` when the model contains
  `text-embedding-3`, else `encoding_format`. `map_openai_params` returns `optional_params` unchanged and ignores the
  mapped parameters. `validate_environment` returns the four headers and ignores its arguments. `get_complete_url` is the
  deployment URL with trailing slashes trimmed plus `/v2/embeddings`. `get_error_class` returns `SapOrchestrationError` with the status and
  message; headers are ignored. `transform_embedding_request(model, input, optional_params)` builds
  `config.modules.embeddings.model` with `name`, `version` (optional_params `version`, default `latest`), `params`
  (optional_params `parameters`, default empty) and, when not null, `timeout` and `max_retries`; adds `masking` when
  not null; sets `input.text` to the input and `input.type` when not null; then validates with the embedding models
  below. `timeout` is 1 to 600 and `max_retries` is 0 to 5. `type` is `text`, `document` or `query`. `text` is a string or
  a list of strings, so token-id inputs fail validation. `masking` validates with B5951's masking validator. The response is
  `EmbeddingResponse` parsed from the body's `final_result` (B006's embedding response record).

  Port the embedding request models (EmbeddingModel, EmbeddingsModelConfig, EmbeddingsModules, EmbeddingInput,
  EmbeddingConfig, EmbeddingRequest) with the same unset-key dump rule as B5951: only keys present in the input are
  written. The constructor of the embedding config resolves credentials at creation, so a missing credential fails when the config is built.
  Helper cases call the real configs with token creation and `deployment_url` replaced by fixtures. About 330 nonblank,
  noncomment lines in transformation.py and 130 in embed/transformation.py.
