  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_split::/)
      - test(/::replays_corpus$/)'
  - id: case-mixed-thinking-text
    why: the mixed-thinking-text behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_split::tests::mixed_thinking_text($|::)/)'
  - id: case-mixed-tool-text
    why: the mixed-tool-text behavior or its assertions are absent
