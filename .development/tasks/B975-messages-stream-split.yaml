id: B975
title: Messages stream split
description: >-
  Split chat chunks carrying mixed text, thinking and tool payloads into Anthropic-compatible ordered chunks, normalize
  reasoning fields and attach usage only once. Export a typed chunk splitter independent of the terminal-event state
  machine.


  Implement crates/betterlite-core/src/api/messages_stream_split.rs. Use MessagesStreamSplitInput and MessagesStreamSplitResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions mixed_thinking_text, mixed_tool_text, usage_only_chunk, reasoning_signature_split,
  error_sse_event under api::messages_stream_split::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesStreamSplit in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_stream_split: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: _ChunkStream.__iter__
  (L51-L51); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: _ChunkStream.__aiter__ (L53-L53);
  litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: _optional_attr (L56-L57); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _optional_attr_sequence (L60-L62); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: _error_status_and_message
  (L65-L68); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: _mid_stream_error_sse_event (L71-L77);
  litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: _delta_payload_field (L80-L91); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter.__init__ (L114-L118); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter.chunks (L121-L124); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter.messages (L127-L130); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter._is_combined (L133-L154); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter._clear_usage (L163-L168); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter._split_by_payload_kind (L171-L214); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter._normalize_reasoning_fields (L217-L238); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter._split (L241-L261); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter.__iter__ (L263-L264); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter.__next__ (L266-L277); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter.__aiter__ (L279-L280); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  _CombinedChunkSplitter.__anext__ (L282-L293). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 166 owned nonblank/non-comment/non-docstring Python lines (205 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 186 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 436 total within the 440-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B005 (Streaming chat completions), B171 (Direct helper oracle and URL path encoding),
  B966 (Messages chat output), B1087 (Api boundaries), B958 (Messages errors), B963 (Messages options). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.
