id: B975
title: Split combined chat chunks before Messages event conversion
description: >-
  Own adapters/streaming_iterator.py L43-L293: stream protocol, attribute/error/delta helpers and the entire
  _CombinedChunkSplitter. Implement api::messages_stream_split over B005's typed chat chunks. B958 supplies
  Anthropic error frames and B963 refusal extraction. Peel finish/usage from a chunk first, then split reasoning,
  text and named tool calls in that order. Leave argument continuations and multi-choice payloads unsplit.
  The downstream event driver is B977 and its sync part; this leaf cannot depend on it or B966.

  HelperCall::MessagesStreamSplit drives parsed finite chunk sequences in sync or async mode, never a live
  provider stream. Compare every projected field, source-object immutability, upstream pull count and terminal
  error. HTTP integration is tested by the consuming stream driver. No external-byte decoder is added.
  Own 209 nonblank/non-comment lines including protocol and delta declarations. Budget 200 implementation, 135 tests,
  135 fixtures, 90 adapters and 30 wiring, 590 total; tests use api::messages_stream_split.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_stream_split.rs
  - crates/betterlite-core/src/api/messages_stream_split/**
  - tools/oracle/src/helpers/core_ops/messages_stream_split.rs
  - tools/oracle/src/helpers/core_ops/messages_stream_split/**
  - tools/oracle/helpers/messages_stream_split.py
  - tools/oracle/helpers/messages_stream_split/**
  - tools/oracle/cases/helpers/messages-stream-split/**
  - tools/oracle/fuzz/corpus/helper_case/messages_stream_split-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py#L43-L91
  why: Closed delta payload mapping, optional attributes and error status/message fallback.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py#L94-L293
  why: Own the full splitter, including no-split exceptions and usage placement before payload subdivision.
dod:
- text: >-
    finish_and_content_split sends choice0 delta.content=Hello,finish_reason=stop,usage=5/2 and hidden usage.
    Produce content copy with finish_reason=null and usage=null, removing only hidden usage; then finish copy
    with stop and original usage, content/tool_calls/reasoning_content/thinking_blocks cleared to null.
    Empty payload or null finish stays one chunk. Nonempty refusal also qualifies as combined, but refusal is
    not cleared on the finish copy at the pin. Other choices are copied unchanged in both finish-split pieces.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    payload_order_and_roles sends one choice with reasoning_content=R,content=T,named tool call lookup and
    role=assistant. Produce reasoning,text,tool pieces in that order, each with only its group's fields; only
    the first piece keeps role=assistant. Non-group delta fields including refusal are not copied into rebuilt
    deltas. Metadata,finish and usage outside the delta survive; if no finish was present, usage is not cleared
    by payload splitting alone. With finish present it appears only in the peeled finish piece.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    continuation_and_multichoice_passthrough sends zero/two choices, missing delta, or only one truthy payload
    group and expects one unchanged payload chunk. Tool calls with no truthy function.name prevent payload
    splitting even alongside text/reasoning. One named tool among several enables splitting. Payload checks use
    truthiness, so content="" and empty tool arrays are absent; finish_reason="" is still non-null and may split.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    unsigned_thinking_normalization sends two thinking blocks A,B without truthy signatures alongside text T.
    The reasoning piece becomes reasoning_content=AB, removing thinking_blocks and any prior reasoning_content.
    Any dict block with a truthy signature preserves the original fields, even if its type is not thinking.
    No nonempty thinking text leaves fields unchanged; non-dict blocks are ignored. This normalization happens
    only when payload groups split, not to an otherwise single-group chunk.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    splitter_pull_and_attributes drains all buffered pieces before another upstream pull, in both modes, and
    forwards chunks/messages attributes or null. Optional_attr gives null if absent; optional_attr_sequence gives
    an empty tuple for any falsey value. Source chunks remain unmodified and two splitter instances have separate
    buffers. Exhaustion remains StopIteration/StopAsyncIteration and source exceptions propagate. An instance
    is used in one iteration mode only, matching the documented contract.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    delta_and_error_literals maps text_delta->text,input_json_delta->partial_json,thinking_delta->thinking,
    signature_delta->signature. BaseLLMException and MidStreamFallbackError use their own status_code/message,
    even an empty message; unrelated exception with status_code=429 still maps to 500. Empty str(exception)
    uses "Upstream stream ended before completion". B958 emits event:error with api_error for500 or
    rate_limit_error for429 and that message, without proxy param/code fields or a synthetic success terminator.
  proof: [behavior-tests, oracle, helper-python]
- text: New parsed-chunk cases and a messages_stream_split seed exercise both iteration forms without network I/O.
  proof: [new-cases, corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: payload order, finish placement or error conversion lacks a production assertion
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_split::/)'
  - id: helper-python
    why: the chunk splitter is not compared with checked pinned code
    run: test -f tools/oracle/helpers/messages_stream_split.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: corpus
    why: splitter sequences cannot be selected through the oracle enum
    run: grep -qE '^[[:space:]]+messages_stream_split:' tools/oracle/fuzz/corpus/helper_case/messages_stream_split-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no new split/continuation/error scenarios exist
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-stream-split)"
oracle_cases:
- tools/oracle/cases/helpers/messages-stream-split/finish-and-content-split.yaml
- tools/oracle/cases/helpers/messages-stream-split/payload-order-and-roles.yaml
- tools/oracle/cases/helpers/messages-stream-split/continuation-and-multichoice-passthrough.yaml
- tools/oracle/cases/helpers/messages-stream-split/unsigned-thinking-normalization.yaml
- tools/oracle/cases/helpers/messages-stream-split/splitter-pull-and-attributes.yaml
- tools/oracle/cases/helpers/messages-stream-split/delta-and-error-literals.yaml
deviations: []
out_of_scope:
- B976 owns AnthropicStreamWrapper state/usage helpers L310-L546,L1046-L1201; B977 and its sync part own iteration/SSE L548-L1044 and AnthropicSSEStream L1212-L1233.
- B005 owns chat SSE decoding and provider reads; this task never creates an HTTP client or parses SSE bytes.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_stream_split in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_stream_split.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_stream_split.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The finish splitter clears four payload fields but leaves refusal, which must remain visible in the parity projection.
- Tool-argument continuation chunks cannot be split into separate payload groups without closing the active tool block.
- Signature-less thinking becomes reasoning_content only during a multi-payload split.
review_level: standard
budget:
  max_changed_lines: 620
  max_new_expects: 0
