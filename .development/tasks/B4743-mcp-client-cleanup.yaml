id: B4743
title: MCP HTTP failure propagation and bounded cleanup
description: >-
  Build cancellation-safe HTTP cleanup and preserve the original stream/operation failure when
  transport teardown also fails. Implement _first_non_cancelled_cause to walk an exception tree
  and find the first non-CancelledError cause, excluding errors already recorded during cleanup.
  Implement as_mcp_read_timeout to normalize SDK-generated read timeouts (REQUEST_TIMEOUT in
  MCPError with a TimeoutError context) for diagnostics, while keeping relayed application errors
  with the same numeric code distinct from SDK timeouts. Implement _run_bounded_cleanup to run
  an operation within a deadline while being cancellation-safe: isolate the task, shield cleanup
  from caller cancellation, drain and re-raise caller's cancellation only after cleanup completes,
  and avoid repeated cancellation from abandoning the cleanup task.

  Implement _MCPResponseStream, a wrapper around httpx2.AsyncByteStream that records errors during
  streaming through an injected callback. When iteration or close fails, call the error recorder
  before re-raising. Implement _MCPHTTPClient, an httpx2.AsyncClient subclass that adds MCP-specific
  failure handling: _record_cleanup_error stores errors from POST failures and stream teardown when
  inside a cleanup scope; send() treats DELETE requests as terminal cleanup (consuming the response
  before returning) under bounded cleanup with the scope's deadline, treats POST errors as fatal
  (closing and raising for all non-404 statuses), wraps streamed responses in _MCPResponseStream,
  and records other exceptions during send. Clean up scope and errors are mutable class variables
  (not instance variables) since the client is reused across sessions.

  Direct dependency on B173 for outbound send, response body iteration/read and aclose operations.
  B4744 calls these cleanup primitives; rest_endpoints.py:1612 also calls as_mcp_read_timeout. Do
  not turn caller cancellation into an error result or let repeated cancellation abandon the cleanup
  task. A terminal DELETE consumes its response before returning (aread() not just close). The bound
  is hardcoded to 5 seconds for session/transport cleanup and 1 second for the final HTTP close; the
  caller supplies the deadline to _run_bounded_cleanup.
