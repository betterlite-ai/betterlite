deviations:
  - what: >-
      When a POST request returns an error status (4xx or 5xx), the response is closed and raise_for_status()
      is called. The 404 status is explicitly excluded; LiteLLM treats 404 as a non-error response for POST.
    why: >-
      MCP servers may return 404 for unsupported endpoints. Treating it as success allows graceful fallback;
      other error codes indicate real failures that should be surfaced immediately.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L249-L251
  - what: >-
      When the caller is cancelled, _run_bounded_cleanup re-raises the cancellation after allowing the
      operation to complete, rather than immediately propagating the cancellation.
    why: >-
      Cleanup operations must complete even under cancellation. Storing cancellation separately and re-raising
      after ensures the operation finishes before cancellation propagates upstream.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L176-L197
  - what: >-
      The exception tree walk in _first_non_cancelled_cause uses identity (is) comparison rather than
      equality (==) when filtering cleanup_errors, matching only the exact exception objects recorded.
    why: >-
      Cleanup errors are tracked by identity to avoid false matches when different exceptions have the same
      message or type. Only the exact objects recorded during cleanup are excluded.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L145-L146
out_of_scope:
  - Tool schema conversion and pagination (B4740).
  - Credential header construction and discovery fingerprinting (B4741).
  - AWS SigV4 credential acquisition and request signing (B4742).
  - Session transport lifecycle and HTTP session establishment (B4744).
  - Tool listing and execution (B4745).
  - Prompts and resources operations (B4746).
  - Integration with chat and Responses calls (B140).
  - HTTP client pooling, reuse and limits (B173).
pitfalls:
  - >-
      The cleanup_scope and cleanup_errors are mutable class variables on _MCPHTTPClient, not instance variables,
      so they persist across method calls on the same client instance and across different sessions if the client
      is reused. The caller must set these appropriately for each cleanup context.
  - >-
      _run_bounded_cleanup creates an asyncio.create_task to run the operation, and repeatedly awaits
      asyncio.shield(task) inside a loop within a shielded anyio.CancelScope, catching CancelledError each
      iteration without abandoning the task. The comment at lines 181-182 mentions why a single shield is
      insufficient when an asyncio.gather elsewhere in the codebase keeps retrying Task.cancel; this function
      itself uses create_task and shield, not gather.
  - >-
      as_mcp_read_timeout uses __context__ to discriminate SDK-generated timeouts from relayed application errors.
      The SDK raises its own timeout from inside an except TimeoutError, leaving the TimeoutError on the context chain.
      A relayed error from a message has no such chain, even if it carries REQUEST_TIMEOUT as its code.
  - >-
      The terminal DELETE response must be consumed (aread) before being returned or closed, not just closed without
      reading. This ensures the connection is fully drained before the HTTP client shuts down.
  - >-
      _MCPResponseStream does not suppress exceptions; it records them and then re-raises, so the caller sees all
      streaming errors.
  - >-
      When _record_cleanup_error is called outside a cleanup scope (cleanup_scope is None), nothing is recorded.
      The errors list only grows during active cleanup, not during normal operation.
