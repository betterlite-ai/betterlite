dod:
  - text: >-
      _first_non_cancelled_cause walks exception.exceptions (or getattr for compatibility) breadth-first
      using a FIFO queue (pop(0) to dequeue, extend() to enqueue nested exceptions), returns the first non-CancelledError
      not in cleanup_errors by identity, and returns None if only cancelled errors and cleanup errors are found.
    proof: [cleanup-tests]
  - text: >-
      as_mcp_read_timeout returns TimeoutError when exc is MCPError with code REQUEST_TIMEOUT and
      __context__ is TimeoutError; returns None otherwise. The returned TimeoutError carries exc.error.message.
    proof: [cleanup-tests]
  - text: >-
      _run_bounded_cleanup runs the operation inside anyio.fail_after with the remaining deadline,
      shielded from the caller's cancellation. Repeated cancellations do not abandon the task. After
      the task completes or stalls, re-raise the caller's cancellation if it was caught; otherwise
      return the operation result or propagate an exception.
    proof: [cleanup-tests]
  - text: >-
      _MCPResponseStream forwards chunks from the wrapped stream, calls record_error(exc) when iteration
      fails, then re-raises. aclose() forwards the call, calls record_error(exc) when close fails, then
      re-raises.
    proof: [cleanup-tests]
  - text: >-
      _MCPHTTPClient.send() with DELETE request inside cleanup_scope runs terminate under _run_bounded_cleanup
      with the scope's deadline, consuming the response (aread) before returning. On success returns the response.
    proof: [cleanup-tests]
  - text: >-
      _MCPHTTPClient.send() with POST request closes the response and calls raise_for_status() when status
      is 4xx or 5xx (all errors except 404). On 404 or success, returns the response unchanged.
    proof: [cleanup-tests]
  - text: >-
      _MCPHTTPClient.send() with stream=True wraps response.stream in _MCPResponseStream before returning.
    proof: [cleanup-tests]
  - text: >-
      _MCPHTTPClient._record_cleanup_error adds the error to cleanup_errors tuple only when cleanup_scope
      is not None and cleanup_scope.shield is True.
    proof: [cleanup-tests]
  - text: >-
      Any exception from _MCPHTTPClient.send() (outside the terminate closure) is recorded before re-raising.
    proof: [cleanup-tests]
