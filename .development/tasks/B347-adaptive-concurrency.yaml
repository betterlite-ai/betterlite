id: B347
title: Adaptive concurrency permits
description: 'Implement the reusable additive-increase/multiplicative-decrease concurrency limiter using
  owned permits, bounded waiter storage and injected outcomes. Keep it separate from B303 deployment hard
  caps and B022''s global admission controls; expose it to existing integration callbacks through the
  server. Preserve the pinned floor, ceiling and clean-streak transitions, and supply a caller deadline
  for every wait. Set the waiter cap to 1024 with a typed overload result for callers. Initial, floor
  and ceiling are required constructor arguments, not env defaults; enforce 1 <= floor <= ceiling and
  clamp initial. Cap waiters at 1024 with caller deadline; return typed Overloaded before enqueueing a
  1025th waiter. Implement the owned native service in crates/betterlite-router/src/adaptive_concurrency.rs.
  Add ProbeOperation::AdaptiveConcurrency in tools/oracle/src/router_probes/mod.rs and the corresponding B347 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/integrations/adaptive_concurrency.py: AdaptiveConcurrencyLimiter.__init__
  (L25-L33), AdaptiveConcurrencyLimiter.limit (L36-L37), AdaptiveConcurrencyLimiter.__aenter__ (L39-L55),
  AdaptiveConcurrencyLimiter._grant (L57-L63), AdaptiveConcurrencyLimiter.__aexit__ (L65-L67), AdaptiveConcurrencyLimiter.record
  (L69-L78). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
scope:
