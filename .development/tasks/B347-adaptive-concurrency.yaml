  - crates/betterlite-router/src/adaptive_concurrency/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/mod/**
  - crates/betterlite-server/src/routing/adaptive_concurrency.rs
  - crates/betterlite-server/src/routing/adaptive_concurrency/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/strategy/**
  - crates/betterlite-router/src/context.rs
  - crates/betterlite-router/src/context/**
  - tools/oracle/src/router_probes/adaptive_concurrency.rs
  - tools/oracle/src/router_probes/adaptive_concurrency/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/adaptive_concurrency.py
  - tools/oracle/cases/routing/adaptive-concurrency/**
  - tools/oracle/helpers/b347.py
  - tools/oracle/helpers/b347/**
  - tools/oracle/src/helpers/router/b347.rs
  - tools/oracle/src/helpers/router/b347/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/adaptive_concurrency.py#L18-L78
  why: Limit transitions, cancellation race and waiter grants.
dod:
- text: Write tests named adaptive_concurrency_behaviors and adaptive_concurrency_boundaries under adaptive_concurrency::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - adaptive-concurrency-behaviors
  - adaptive-concurrency-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: adaptive-concurrency-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::adaptive_concurrency_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: adaptive-concurrency-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::adaptive_concurrency_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/adaptive_concurrency.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/adaptive_concurrency.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/adaptive-concurrency/initial-clamped.yaml
- tools/oracle/cases/routing/adaptive-concurrency/invalid-floor-ceiling.yaml
- tools/oracle/cases/routing/adaptive-concurrency/clean-streak-adds-one.yaml
- tools/oracle/cases/routing/adaptive-concurrency/throttle-halves-to-floor.yaml
- tools/oracle/cases/routing/adaptive-concurrency/fixed-width-mode.yaml
- tools/oracle/cases/routing/adaptive-concurrency/cancel-before-grant.yaml
- tools/oracle/cases/routing/adaptive-concurrency/cancel-after-grant.yaml
- tools/oracle/cases/routing/adaptive-concurrency/ceiling-no-growth.yaml
- tools/oracle/cases/routing/adaptive-concurrency/waiter-cap.yaml
- tools/oracle/cases/routing/adaptive-concurrency/waiter-deadline.yaml
deviations:
- what: Adaptive concurrency waits are bounded by a deadline and a 1024-waiter capacity.
  why: The pinned deque is unbounded, contrary to async-hygiene and bounded-inputs.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/adaptive_concurrency.py#L23-L69
out_of_scope:
- Attaching adaptive limits to unrelated storage integrations before their own tasks exist.
- CPU or latency-driven adaptation; the source responds to explicit throttle samples.
pitfalls:
- Reducing the limit does not cancel calls already in flight.
- Cancellation after a grant must return the reserved slot exactly once.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
