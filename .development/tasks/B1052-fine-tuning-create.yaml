id: B1052
title: Create fine-tuning jobs through provider SDKs
description: >-
  Implement _prepare_azure_extra_body, _build_fine_tuning_job_data and complete sync/async create functions
  in core::api::fine_tuning_create. B2487 owns _resolve_fine_tuning_timeout and the loaded settings view;
  call B518 OpenAI, B542 Azure or B1384 Vertex execution directly. GenericLiteLLMParams is B010 and
  client/logging integration B012. Register FineTuningCreate in B2401 so actual SDK calls send HTTP to a
  mock provider. Pure helper behavior has native tests and is also observed in those request bodies.
  model/training_file are required, hyperparameters defaults {}, all suffix/validation_file/integrations/
  seed/extra_headers/extra_body default null, custom_llm_provider defaults openai. Only true async flag
  chooses async execution; preserve context across the blocking preparation step.

  Own 237 nonblank/non-comment lines at main.py:38-137,153-330 plus the three-line permissive
  OpenAIFineTuningHyperparameters compatibility declaration. Reuse B518's leaf job/hyperparameter contracts
  for that declaration; do not make the Vertex provider depend on this SDK dispatcher. B2487 owns all
  environment/global defaults and loader tests; their selection must still be observed at outgoing HTTP.
  Estimate 230 code, 175 tests, 120 adapters, 170 fixtures and 60 wiring, 755 total. B518/B1384 own response
  byte decoding; extend B2401's case corpus without introducing a second job decoder.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/fine_tuning_create.rs
  - crates/betterlite-core/src/api/fine_tuning_create/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/fine_tuning_create.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/fine_tuning_create.py
  - tools/oracle/cases/sdk-http/fine-tuning-create/**
  - tools/oracle/fuzz/corpus/sdk_http_case/fine-tuning-create-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/fine_tuning/main.py#L38-L137
  why: Whole Azure extra-body helper, async wrapper and job-data constructor establish mutation and default behavior.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/fine_tuning/main.py#L153-L330
  why: Complete create dispatch includes all three provider branches and its literal unsupported-provider error.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/fine_tuning.py#L1-L5
  why: The response hyperparameter compatibility type allows extra keys; it is not a closed three-field record.
dod:
- text: >-
    openai_tuning_body calls both modes with model=gpt-4o-mini,training_file=file_train. POST
    /v1/fine_tuning/jobs has model,training_file,hyperparameters={} and omits null suffix/validation_file/
    integrations/seed. Explicit hyperparameters=null also becomes {}. Supplied batch_size=auto,n_epochs=3,
    learning_rate_multiplier=0.5,extra_flag=x survive; suffix="",validation_file="",integrations=[],seed=0
    are retained. extra_headers={X-Ignored:x} and explicit extra_body={ignored:true} are not forwarded.
    Mock queued job ft_a is returned with provider fields intact and no additional route envelope.
  proof: [create-tests, oracle, python-adapter]
- text: >-
    azure_training_parameters sends hyperparameters={n_epochs:2,prompt_loss_weight:0.25},trainingType=2
    and explicit extra_body={trainingType:9,ignored:true,azure_ad_token:secret}. Source pops prompt_loss_weight
    from the caller's original nonempty hyperparameter map, sends n_epochs in hyperparameters and root
    prompt_loss_weight=0.25,trainingType=2 through Azure SDK extra_body. The explicit extra_body argument is
    discarded when reassigned from GenericLiteLLMParams. Omitted trainingType becomes 1 in B542; 0 stays 0.
    Native _prepare_azure_extra_body mutates an existing map, kwargs.trainingType wins its prior value, then
    extracted Azure hyperparameters win collisions. No azure_ad_token reaches provider JSON.
  proof: [create-tests, oracle, python-adapter]
- text: >-
    vertex_tuning_dispatch uses model=gemini-1.5-pro,training_file=gs://bucket/train.jsonl,
    hyperparameters={n_epochs:2,adapter_size:4},validation_file=gs://bucket/valid.jsonl,suffix=custom.
    Pass typed job plus original hyperparameters and kwargs to B1384; mock HTTP observes baseModel,
    supervisedTuningSpec.training_dataset_uri and adapter_size conversion, and returns mapped queued job.
    Assert B1384's regional tuningJobs destination, never an arbitrary supplied api_base as final URL.
    The closed Vertex test transport records that resolved regional URL, then redirects only its origin
    to B2401's bound loopback mock while preserving method/path/query/body; it sends real HTTP and never
    manufactures a provider response. Supply access token=vertex-test through B1384's credential seam,
    so neither ADC discovery nor token exchange contacts Google. No case can supply an arbitrary target.
    OpenAIFineTuningHyperparameters retains a response extra adapter_size=4 through B518's extensible record.
  proof: [create-tests, oracle, python-adapter]
- text: >-
    tuning_credentials_and_timeout exercises B2487's complete OpenAI base/key/organization and Azure
    base/version/key chains with distinct request/global/env sentinels, removing each winner successively.
    Include OPENAI_BASE_URL before OPENAI_API_BASE, AZURE_OPENAI_API_KEY before AZURE_API_KEY, empty strings
    falling through, and Vertex project/location/credentials fallback with api_base default "". Outgoing
    Authorization/api-key, OpenAI-Organization, api-version and mock target prove selection; native transport
    capture proves timeout=600 by default, timeout=0/request_timeout=7->7, "7.5"->7.5, structured OpenAI/Azure
    timeout preserved and Vertex read-only timeout. Only OpenAI receives supplied client; Azure/Vertex ignore it.
    max_retries request override is passed to OpenAI/Azure; disable retries in oracle scenarios.
  proof: [create-tests, oracle, python-adapter]
- text: >-
    unsupported_tuning_create sends anthropic and gets BadRequestError,status=400,type/param/code=null,
    source message="LiteLLM doesn't support anthropic for 'create_batch'. Only 'openai' is supported.".
    The source response body is "Unsupported provider", method=create_thread. No HTTP is sent. A provider
    HTTP 400 with error={message:bad,type:invalid_request_error,param:training_file,code:invalid_file} retains
    those fields through the SDK. Invalid timeout="bad" fails before provider construction. Log creation
    exceptions once at this layer and never raw kwargs secrets. Commit SDK seeds for all three providers.
  proof: [create-tests, oracle, python-adapter, sdk-corpus]
checks:
  optional: []
  commands:
  - id: create-tests
    why: a complete fine-tuning provider branch or Azure parameter mutation is missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::fine_tuning_create::tests::/) - test(/::replays_corpus$/)'
  - id: python-adapter
    why: create cases do not independently execute the pinned SDK through mock HTTP
    run: test -f tools/oracle/sdk_http/fine_tuning_create.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: fine-tuning create's typed operation has no new case-parser input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/fine-tuning-create-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/fine-tuning-create/openai-tuning-body.yaml
- tools/oracle/cases/sdk-http/fine-tuning-create/azure-training-parameters.yaml
- tools/oracle/cases/sdk-http/fine-tuning-create/vertex-tuning-dispatch.yaml
- tools/oracle/cases/sdk-http/fine-tuning-create/tuning-credentials-and-timeout.yaml
- tools/oracle/cases/sdk-http/fine-tuning-create/unsupported-tuning-create.yaml
deviations:
- what: Debug logging of acreate kwargs redacts credential values; source prints the kwargs representation.
  why: Credential output is forbidden by repository policy; preserve the diagnostic event without secret bytes.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/fine_tuning/main.py#L96-L96
out_of_scope:
- B2487 owns the complete timeout helper at 140-150 and all settings loading; its finite-duration deviation applies here.
- B1053 owns list/retrieve, B1141 cancellation. B518/B542/B1384 own provider transports and wire contracts; HTTP routes are B088/B1054 and its create split.
pitfalls:
- Azure removes prompt_loss_weight from the caller's hyperparameters map before constructing OpenAI-style data.
- The public extra_body parameter is overwritten on Azure and ignored on OpenAI.
- Vertex is supported for create even though the unsupported-provider message says only openai is supported.
review_level: security
budget:
  max_changed_lines: 790
  max_new_expects: 0
