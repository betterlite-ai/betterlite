id: B1052
title: Fine tuning create
description: >-
  Implement typed fine-tuning create preparation and provider call through B010, including Azure extra_body, training/validation
  file IDs, hyperparameters and source timeout precedence. credentials and base URLs come from configured models
  only.


  Managed file resolution belongs to B088 routes, not this SDK call. Unsupported provider returns 400 BadRequestError.
  Config resolves OPENAI_BASE_URL, OPENAI_API_BASE, OPENAI_ORGANIZATION, OPENAI_API_KEY, AZURE_API_BASE, AZURE_API_VERSION,
  AZURE_OPENAI_API_KEY, AZURE_API_KEY and VERTEXAI_* using B500/B529/provider settings; the default OpenAI base
  is https://api.openai.com/v1.


  Implement crates/betterlite-core/src/api/fine_tuning_create.rs. Use FineTuningCreateInput and FineTuningCreateResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions fine_tuning_training_file, validation_file, azure_extra_body, timeout_precedence,
  create_provider_error, unsupported_finetune_provider under api::fine_tuning_create::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.api_base
  defaults to None; env.OPENAI_BASE_URL defaults to unset (None); env.OPENAI_API_BASE defaults to unset (None);
  litellm_settings.organization defaults to None; env.OPENAI_ORGANIZATION defaults to None; litellm_settings.api_key
  defaults to None; litellm_settings.openai_key defaults to None; env.OPENAI_API_KEY defaults to unset (None); env.AZURE_API_BASE
  defaults to unset (None); litellm_settings.api_version defaults to None; env.AZURE_API_VERSION defaults to unset
  (None); litellm_settings.azure_key defaults to None; env.AZURE_OPENAI_API_KEY defaults to unset (None); env.AZURE_API_KEY
  defaults to unset (None); litellm_settings.vertex_project defaults to None; env.VERTEXAI_PROJECT defaults to unset
  (None); litellm_settings.vertex_location defaults to None; env.VERTEXAI_LOCATION defaults to unset (None); env.VERTEXAI_CREDENTIALS
  defaults to unset (None). No environment reads occur outside betterlite-config. Test api::fine_tuning_create::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FineTuningCreate in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {fine_tuning_create: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/fine_tuning/main.py: _prepare_azure_extra_body (L38-L73); litellm/fine_tuning/main.py:
  acreate_fine_tuning_job (L77-L125); litellm/fine_tuning/main.py: _build_fine_tuning_job_data (L128-L137); litellm/fine_tuning/main.py:
  _resolve_fine_tuning_timeout (L140-L150); litellm/fine_tuning/main.py: create_fine_tuning_job (L154-L330). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 230 owned nonblank/non-comment/non-docstring Python lines (251 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 250 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 87 config tests/seeds and
  30 wiring; 605 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B1087 (Api boundaries), B518 (OpenAI fine-tuning jobs), B002 (Load LiteLLM config.yaml
  into typed config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
