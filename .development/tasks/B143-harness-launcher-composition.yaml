dod:
  - text: Claude Code, Codex and OpenCode take their base URL from the sandbox's host_url of the session endpoint port and their token from the endpoint, fail with LiteLLM's messages when the endpoint or the OpenCode model is missing, and no provider source or deviation log mentions the gateway stand-in any more.
    proof: [endpoint-wiring, stand-ins-removed]
  - text: An Arc of any sandbox is a sandbox that forwards every method, including is_container and host_url, and its clones share one sandbox.
    proof: [shared-sandbox]
  - text: In gateway mode a session opened through the launcher runs each fake CLI against its own endpoint with a scoped token, and the gateway gets the gateway key, the harness tag, the metadata and the routed model, while the CLI never sees the gateway key.
    proof: [launcher-gateway]
  - text: In SDK mode the same CLIs reach the SDK caller with the session model and key, and the result carries the SDK usage and hidden cost.
    proof: [launcher-sdk]
  - text: The launcher picks the handler per harness for open, resume from bytes, one-shot run and stream, and the sync runtime. It checks capabilities and state before anything runs, closes one-shot sessions, and builds a Docker session without starting it.
    proof: [launcher-lifecycle]
  - text: B4840's Deep Agents handler runs a turn through the launcher with a fake graph, and fails at start with the install hint when no runtime is wired in.
    proof: [deep-agents-launch]
checks:
  optional: []
  commands:
    - id: endpoint-wiring
      why: The providers do not read the session endpoint yet, or the provider, CLI handler and session tests no longer pass after the change.
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::.*::endpoint_/)' && cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::/) | test(/^cli_handler::/) | test(/^session_runtime::/)'
    - id: stand-ins-removed
      why: A provider source still reads SessionSettings.gateway or a deviation log still describes the stand-in.
      run: test -z "$(grep -rl --include='*.rs' --exclude=tests.rs -e 'settings\.gateway' -e GatewayTarget crates/betterlite-harness/src/providers)" && test -z "$(grep -l 'SessionSettings\.gateway' docs/deviations/B4834.yaml docs/deviations/B4835.yaml docs/deviations/B4836.yaml)"
    - id: shared-sandbox
      why: The Arc sandbox is missing or drops a method.
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^sandbox::shared::/)'
    - id: launcher-gateway
      why: The gateway-mode end-to-end tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^launcher::tests::gateway::/)'
    - id: launcher-sdk
      why: The SDK-mode end-to-end tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^launcher::tests::sdk::/)'
    - id: launcher-lifecycle
      why: The open, resume, one-shot, sync, Docker and Deep Agents launcher tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^launcher::tests::lifecycle::/)'
    - id: deep-agents-launch
      why: The real Deep Agents handler is not shown to run through the launcher.
      run: cargo nextest run --locked -p betterlite-deepagents-harness --no-tests=fail -E 'test(/^launch::tests::/)'
oracle_cases: []
deviations:
  - what: >-
      betterlite's Python package does not expose litellm.agent, aagent, agent_session, aagent_session, agent_resume,
      aagent_resume, agent_capabilities, Harness or the four *Options classes, nor the litellm.harness module and the
      harness names in litellm.sandbox. Looking one up raises AttributeError. Rust callers start a harness through
      betterlite_harness::launcher::LaunchedSession.
    why: >-
      No backlog entry builds the Python binding for the harness yet, and no proxy route reaches it at the pin. The
      planner notes for B143 ask the architect for those entries.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L2314-L2368
out_of_scope:
  - "sync.py (_LoopThread, run_sync, EventStream, Session, _run, _stream, agent_session, agent_resume, agent) is B4849's sync_bridge; this task only runs run_once on B4849's SyncRuntime in one test."
  - "litellm/harness/__init__.py and litellm/harness/sandbox/__init__.py hold re-exports and no functions; B4830 owns them, and the Rust crate exposes the same names through its public modules."
  - "get_harness_config, harness_capabilities, uses_model_endpoint, validate_for and handler_kind are B4846's registry in session_runtime; this task only constructs the handler get_harness_handler returns."
  - "The AsyncSession lifecycle is B4846, the turn loop B4847, the async entry points B4848, and the endpoint primitives, relay and endpoint server B4841, B4842 and B4843. None is rebuilt, and no endpoint route is registered again."
  - "The production SDK callers behind LiteLlmSdk (B1134, B5656 and B932 through B4842) and reading ProxySettings from LITELLM_PROXY_API_BASE, LITELLM_PROXY_API_KEY and litellm.use_litellm_proxy belong to whoever builds LaunchArgs; the launcher takes them as values."
  - "A production Deep Agents AgentRuntime: B4840 ships MissingRuntime only, so outside tests a Deep Agents launch fails at start with the install hint."
  - "Starting and stopping a Docker container is B4833's DockerSandbox; the launcher test builds one without starting it."
  - "The Python import surface named in the deviation (litellm/__init__.py _AGENT_EXPORTS and __getattr__, litellm/sandbox/__init__.py) has no owner yet; see the planner notes."
pitfalls:
  - Use `context.sandbox.host_url(endpoint.port)`, never `EndpointAccess.url`, because the url field is always 127.0.0.1 and a Docker sandbox needs `http://host.docker.internal:<port>`.
  - Codex and OpenCode trim trailing slashes and append `/v1`, while ANTHROPIC_BASE_URL stays the bare host URL since the Anthropic client adds `/v1/messages` itself.
  - Claude Code rejects an endpoint whose token is empty, Codex and OpenCode only a missing endpoint, and OpenCode checks the endpoint before the model.
  - The trait's default `is_container` returns false, so an Arc impl that forgets to forward it makes a shared DockerSandbox look local.
  - The one-shot `run_once` must call `arun_agent`, not `aagent_session` and `arun`, because only `arun_agent` builds with interactive false and rejects the ask permission mode without an approval callback.
  - The harness of a resumed session comes from the state, so `resume` loads the state before it picks a variant.
  - A record folder inside the sandbox workdir makes the fakes' records show up as created files in `RunResult.files`.
  - The CLI handler links its resume cache under `${HOME:-/tmp}/.cache/litellm-harness`, so the sandbox HOME must be a temp folder.
  - Build the sandbox env map from scratch, so a developer's `http_proxy` or a real ANTHROPIC_API_KEY never reaches a fake's curl.
  - A fake that exits before reading stdin to the end makes the CLI handler's prompt write fail with a broken pipe.
  - The forged x-litellm-tags header and the `cli-chosen-model` body model are what prove the endpoint strips and rewrites; a fake that sends neither proves nothing.
  - The fakes are .sh files, so they pass shellcheck with every optional check and `shfmt -i 2 -sr -ci` like every shell file in the repo.
