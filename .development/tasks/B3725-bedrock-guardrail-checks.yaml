dod:
  - text: Messages with more than ten content blocks are split across multiple messages
      without truncating any block.
    proof: [checks-tests, checks-oracle]
  - text: All INPUT content is retagged as user role; OUTPUT is assistant.
    proof: [checks-tests, checks-oracle]
  - text: Three check types (contentFilter, promptAttack, sensitiveInformation) are
      evaluated against their respective thresholds; truncated PII counts as violation.
    proof: [checks-tests, checks-oracle]
  - text: PII location offsets are stripped from logged responses.
    proof: [checks-tests, checks-oracle]
  - text: Violations block with HTTPException (400) or ModifyResponseException depending
      on disable_exception_on_block.
    proof: [checks-tests, checks-oracle]
  - text: Malformed 200 responses raise HTTPException (500) with validation error detail.
    proof: [checks-tests, checks-oracle]
checks:
  optional: []
  commands:
    - id: checks-tests
      why: The message chunking, role tagging, threshold evaluation or response parsing
        is broken or incomplete.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^bedrock_checks::tests::/) - test(/replays_the_/)'
    - id: checks-oracle
      why: The HTTP request/response shape or threshold logic does not match the booted
        proxy.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/guardrails/bedrock-checks/**)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
