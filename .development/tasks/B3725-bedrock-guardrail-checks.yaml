out_of_scope:
  - B3720 owns all checks request/response records (BedrockChecksMessage, BedrockChecksViolation,
    BedrockGuardrailChecksResponse) and empty BedrockGuardrailResponse; B3721 owns _create_bedrock_output_content_request
    and get_content_items_for_message used to extract response text; B3723 owns _load_credentials,
    _prepare_request, _sign_and_post and _parse_bedrock_guardrail_error_response for HTTP transport.
  - CustomGuardrail.add_standard_logging_guardrail_information_to_request_data is called at L1935, L1951, L1969
    in _make_invoke_guardrail_checks_request (within this task's owned range L1877-L2090), owned by B164.
  - ModifyResponseException is constructed at L2078 in _get_block_exception_for_checks (within this task's
    owned range L2068-L2090), owned by B184 (litellm/exceptions.py).
pitfalls:
  - Truncated sensitiveInformation result must be recorded as a violation even without
    individual entries, because omitted detections were never scored.
  - PII location offsets (beginOffset, endOffset, messageIndex, contentIndex) are stripped
    before logging but evaluated during collection; a deepcopy is necessary.
  - INPUT messages are retagged as user regardless of original role to prevent prompt-injection
    bypass through system/developer tagging.
  - None threshold makes a check detect-only and never contributes violations.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
