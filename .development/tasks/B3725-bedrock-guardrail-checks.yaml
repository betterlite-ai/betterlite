id: B3725
title: Bedrock resource-less guardrail checks
description: >-
  Build InvokeGuardrailChecks request shaping, score thresholds and malformed-response
  handling. This resource-less API detects violations without guardrail resources; it
  never blocks/masks/rewrites content. Retag all INPUT text as user content (security
  measure against prompt-injection bypass), split messages after ten content blocks,
  and treat truncated sensitiveInformation results as violations when that check has a
  threshold.

  InvokeGuardrailChecks accepts three check types: contentFilter (severityScore/category),
  promptAttack (severityScore/category) and sensitiveInformation (confidenceScore/type).
  Score thresholds (content_filter_threshold, prompt_attack_threshold, pii_confidence_threshold)
  determine blocking; None means detect-only. Violations are only over-threshold results
  or truncated PII (fail closed: omitted detections were never scored).

  Log a copy with PII location offsets (beginOffset, endOffset, messageIndex, contentIndex)
  stripped so the detected PII span cannot be reconstructed. Build tracing detail with
  violation categories and action. On violations, raise HTTPException (status 400) or
  ModifyResponseException depending on disable_exception_on_block. Returns empty
  BedrockGuardrailResponse on pass.
scope:
  paths:
    - crates/betterlite-guardrails/src/bedrock_checks.rs
    - crates/betterlite-guardrails/src/bedrock_checks/**
    - tools/oracle/helpers/b3725.py
    - tools/oracle/helpers/b3725/**
    - tools/oracle/src/helpers/guardrails/b3725.rs
    - tools/oracle/src/helpers/guardrails/b3725/**
  lint_tables: false
