pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_dispatch_contract in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/bedrock_dispatch_contract.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_dispatch_contract.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The dispatcher contract cannot depend on completed chat composition or it recreates the Bedrock batch dependency
  cycle.
