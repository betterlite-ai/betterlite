dod:
- text: 'invoke_plan: Call B598 route selection and B591 endpoint planning with a legacy Invoke model; preserve
    selected operation, model and resolved region without installing chat completion here.'
  proof:
  - case-invoke-plan
  - oracle
  - helper-python
- text: 'converse_plan: Call the same helpers with a Converse model and assert the distinct typed plan. Catalog/helper
    errors propagate unchanged.'
  proof:
  - case-converse-plan
  - oracle
  - helper-python
- text: 'operation_error_propagation: An invalid model/region input reaches the called lower helper and preserves
    its exact error; unsupported native variants use the separate Rust-only check.'
  proof:
  - case-operation-error-propagation
  - oracle
  - helper-python
- text: New bedrock_dispatch_contract seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: unsupported operation holds at this task’s owned boundary.
  proof:
  - unsupported-operation
checks:
  optional:
  - mutants
  commands:
  - id: case-invoke-plan
    why: Call B598 route selection and B591 endpoint planning with a legacy Invoke model; preserve selected operation,
      model and resolved region without installing chat completion here.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_dispatch_contract_cases::case_[0-9]+_invoke_plan$/)'
  - id: case-converse-plan
    why: Call the same helpers with a Converse model and assert the distinct typed plan. Catalog/helper errors propagate
      unchanged.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_dispatch_contract_cases::case_[0-9]+_converse_plan$/)'
  - id: case-operation-error-propagation
    why: An invalid model/region input reaches the called lower helper and preserves its exact error; unsupported
      native variants use the separate Rust-only check.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_dispatch_contract_cases::case_[0-9]+_operation_error_propagation$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_dispatch_contract.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_dispatch_contract*")"
      && grep -lq 'bedrock_dispatch_contract' tools/oracle/fuzz/corpus/helper_case/bedrock_dispatch_contract* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_dispatch_contract$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_dispatch_contract_unsupported_operation$/)'
