id: B678
title: Bedrock operation dispatcher foundation
description: >-
  Introduce the closed Bedrock operation and prepared-operation variants plus provider-independent dispatcher extension
  points. The skeleton owns shared enum/export wiring only; B028, B029 and B030 install their executable matches
  independently. Test typed fixture adapters through the dispatcher, including unsupported operations as Rust-only
  checks; no synthetic LiteLLM endpoint is invented.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Install these completed leaf operations: B591 Bedrock model identifiers regions and endpoints; B598 Bedrock model
  capabilities and route selection. Each dispatch fixture must reach its leaf with a fake transport and assert the
  resulting request or reply; accept already normalized settings and reuse leaf errors.


  Named case contracts: invoke_plan: Call B598 route selection and B591 endpoint planning with a legacy Invoke model;
  preserve selected operation, model and resolved region without installing chat completion here. converse_plan:
  Call the same helpers with a Converse model and assert the distinct typed plan. Catalog/helper errors propagate
  unchanged. operation_error_propagation: An invalid model/region input reaches the called lower helper and preserves
  its exact error; unsupported native variants use the separate Rust-only check.


  Each named composition case uses separate fixture rows for its operations, invokes the existing native dispatcher
  and then the actual leaf prepare/send/project functions, and asserts captured upstream request and returned typed
  result. Include a leaf failure per family to detect accidental error rewriting. This composition reads no new
  config/env values and registers no HTTP route; defaults, headers, warnings and parsers remain with the named leaves.


  Implement crates/betterlite-provider/src/bedrock_dispatch_contract.rs with adjacent tests under bedrock_dispatch_contract/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_dispatch_contract_cases in betterlite-provider with these exact named cases (one
  per oracle file): invoke_plan, converse_plan, operation_error_propagation. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_dispatch_contract* using HelperCase:
  kind: helper and the externally tagged bedrock_dispatch_contract variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_dispatch_contract that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone bedrock_dispatch_contract_unsupported_operation in betterlite-provider for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 155 production lines, 210 behavior/config-test lines, 130 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 535 planned, 550 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
