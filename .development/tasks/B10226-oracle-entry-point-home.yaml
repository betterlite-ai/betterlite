dod:
  - text: betterlite-oracle-helper-api's entry_point module holds the one EntryPoint, Sync and Async with the serde names "sync" and "async" and Sync as the default, and its tests pass.
    proof: [entry-point-home, entry-point-serde-tests]
  - text: None of the 34 adapters declares a Sync and Async enum of its own, each one names the home instead, and no re-export, alias or type alias keeps an old name.
    proof: [entry-point-copies]
  - text: Every helper and sdk_http corpus case of the groups the move touches still decodes, and those modules' own tests pass with only the type changed.
    proof: [entry-point-group-replays, entry-point-group-tests, entry-point-root-tests]
checks:
  optional: []
  commands:
    - id: entry-point-home
      why: the home is missing, lost its snake_case serde names or no longer defaults to Sync
      run: |-
        grep -qxF 'pub enum EntryPoint {' tools/oracle/helper-api/src/entry_point.rs &&
        grep -qxF '#[serde(rename_all = "snake_case")]' tools/oracle/helper-api/src/entry_point.rs &&
        grep -qxF '    #[default]' tools/oracle/helper-api/src/entry_point.rs &&
        grep -qxF '    Sync,' tools/oracle/helper-api/src/entry_point.rs &&
        grep -qxF '    Async,' tools/oracle/helper-api/src/entry_point.rs
    - id: entry-point-serde-tests
      why: the home no longer reads and writes "sync" and "async", accepts another spelling, or defaults to Async
      run: cargo nextest run --locked -p betterlite-oracle-helper-api --no-tests=fail -E 'test(/^entry_point::/)'
    - id: entry-point-copies
      why: an adapter still declares its own two-variant Sync and Async enum, does not name the home, or keeps an old name through a re-export or alias
      run: |-
        test -z "$(grep -lPz '\benum \w+ \{\s*(#\[[^\]]*\]\s*)*(Sync|Async|Asynchronous),\s*(#\[[^\]]*\]\s*)*(Sync|Async|Asynchronous),\s*\}' tools/oracle/src/helpers/bedrock/invoke_stream/types.rs tools/oracle/src/helpers/bedrock/other_transcription/input.rs tools/oracle/src/helpers/bedrock/request_policy.rs tools/oracle/src/helpers/core_ops/b3487.rs tools/oracle/src/helpers/core_ops/b3488.rs tools/oracle/src/helpers/core_ops/b3491.rs tools/oracle/src/helpers/core_ops/b4305/fixtures/input.rs tools/oracle/src/helpers/core_ops/messages_stream_split.rs tools/oracle/src/helpers/foundry/agent_runs/input.rs tools/oracle/src/helpers/http/openai_mock_transport.rs tools/oracle/src/helpers/logging/b3962.rs tools/oracle/src/helpers/logging/b3997/cases.rs tools/oracle/src/helpers/logging/success/input.rs tools/oracle/src/helpers/router/b4381/input.rs tools/oracle/src/helpers/sdk/b5368/input.rs tools/oracle/src/helpers/secret_managers/b4414.rs tools/oracle/src/helpers/vertex/legacy_prediction_result/input.rs tools/oracle/src/router_probes/least_busy.rs tools/oracle/src/sdk_http/assistant_create.rs tools/oracle/src/sdk_http/assistant_messages.rs tools/oracle/src/sdk_http/assistant_threads.rs tools/oracle/src/sdk_http/chat_response_stream/call.rs tools/oracle/src/sdk_http/image_generation_plan.rs tools/oracle/src/sdk_http/rerank_http.rs tools/oracle/src/sdk_http/responses_chat_call/call.rs tools/oracle/src/sdk_http/responses_compact.rs tools/oracle/src/sdk_http/responses_lifecycle_write.rs tools/oracle/src/sdk_http/transcription_call.rs tools/oracle/src/sdk_http/transcription_http.rs tools/oracle/src/sdk_http/vector_file_create_list.rs tools/oracle/src/sdk_http/vector_file_read.rs tools/oracle/src/sdk_http/vector_file_write.rs tools/oracle/src/sdk_http/vector_store_read.rs tools/oracle/src/sdk_http/vector_store_write.rs)" &&
        test -z "$(grep -LwF EntryPoint tools/oracle/src/helpers/bedrock/invoke_stream/types.rs tools/oracle/src/helpers/bedrock/other_transcription/input.rs tools/oracle/src/helpers/bedrock/request_policy.rs tools/oracle/src/helpers/core_ops/b3487.rs tools/oracle/src/helpers/core_ops/b3488.rs tools/oracle/src/helpers/core_ops/b3491.rs tools/oracle/src/helpers/core_ops/b4305/fixtures/input.rs tools/oracle/src/helpers/core_ops/messages_stream_split.rs tools/oracle/src/helpers/foundry/agent_runs/input.rs tools/oracle/src/helpers/http/openai_mock_transport.rs tools/oracle/src/helpers/logging/b3962.rs tools/oracle/src/helpers/logging/b3997/cases.rs tools/oracle/src/helpers/logging/success/input.rs tools/oracle/src/helpers/router/b4381/input.rs tools/oracle/src/helpers/sdk/b5368/input.rs tools/oracle/src/helpers/secret_managers/b4414.rs tools/oracle/src/helpers/vertex/legacy_prediction_result/input.rs tools/oracle/src/router_probes/least_busy.rs tools/oracle/src/sdk_http/assistant_create.rs tools/oracle/src/sdk_http/assistant_messages.rs tools/oracle/src/sdk_http/assistant_threads.rs tools/oracle/src/sdk_http/chat_response_stream/call.rs tools/oracle/src/sdk_http/image_generation_plan.rs tools/oracle/src/sdk_http/rerank_http.rs tools/oracle/src/sdk_http/responses_chat_call/call.rs tools/oracle/src/sdk_http/responses_compact.rs tools/oracle/src/sdk_http/responses_lifecycle_write.rs tools/oracle/src/sdk_http/transcription_call.rs tools/oracle/src/sdk_http/transcription_http.rs tools/oracle/src/sdk_http/vector_file_create_list.rs tools/oracle/src/sdk_http/vector_file_read.rs tools/oracle/src/sdk_http/vector_file_write.rs tools/oracle/src/sdk_http/vector_store_read.rs tools/oracle/src/sdk_http/vector_store_write.rs)" &&
        test -z "$(grep -rnE 'pub(\([a-z]+\))? use [^;]*\bEntryPoint\b|\bEntryPoint as \w|\btype \w+ = [^;]*\bEntryPoint\b' tools/oracle/src --include=*.rs)"
    - id: entry-point-group-replays
      why: a helper corpus case of a group the move touches no longer decodes, so a helper reads another name for sync or async
      run: |-
        grep -qxF 'pub enum EntryPoint {' tools/oracle/helper-api/src/entry_point.rs &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-bedrock,betterlite-oracle-groups/betterlite-oracle-core-ops,betterlite-oracle-groups/betterlite-oracle-foundry,betterlite-oracle-groups/betterlite-oracle-http,betterlite-oracle-groups/betterlite-oracle-logging,betterlite-oracle-groups/betterlite-oracle-sdk,betterlite-oracle-groups/betterlite-oracle-secret-store,betterlite-oracle-groups/betterlite-oracle-vertex --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: entry-point-group-tests
      why: a group helper's own tests fail after its enum moved to the home
      run: |-
        grep -qxF 'pub enum EntryPoint {' tools/oracle/helper-api/src/entry_point.rs &&
        cargo nextest run --locked -p betterlite-oracle-bedrock -p betterlite-oracle-foundry -p betterlite-oracle-http -p betterlite-oracle-logging -p betterlite-oracle-vertex --no-tests=fail -E 'test(/^(invoke_stream|other_transcription|request_policy|agent_runs|openai_mock_transport|b3997|legacy_prediction_result)::/)'
    - id: entry-point-root-tests
      why: an sdk_http case or a router helper case no longer decodes, or assistant_messages' tests fail after the move
      run: |-
        grep -qxF 'pub enum EntryPoint {' tools/oracle/helper-api/src/entry_point.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(/^sdk_http::assistant_messages::/) | test(replays_the_helper_case_corpus)'
