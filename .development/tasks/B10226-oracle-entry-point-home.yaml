deviations: []
out_of_scope:
  - "B10220 and B10221: the 25 Sync and Async wire enums whose value becomes betterlite-http's ClientKind, and that home itself."
  - "openai's files/input.rs Supplied and redis' b4321.rs ClientKindWire, two-variant enums for a client class rather than an entry point."
  - "The product crates' own entry-point enums (foundry's AgentRunMode, betterlite-router's EmbeddingMode, betterlite-logging's CallbackPath, openai's codestral_call Mode and the others B10221 lists): the oracle keeps its converters into them."
  - "The enums with a third variant, a payload or Sync as one tag among others, listed in the description."
pitfalls:
  - "sdk_http's vector_file_create_list.rs, vector_file_read.rs, vector_file_write.rs, vector_store_read.rs and vector_store_write.rs also declare an `Operation` enum, and sdk's b5368 a `Step` enum, that are not copies; rename only users of the enum the description names in each file."
  - "Keep every field name: the cases send `mode`, `path`, `method`, `steps`, `wrapper`, `operation`, `kind`, `callback`, `entry`, `calls` and `modes` as keys, and a renamed field fails `deny_unknown_fields` on each case that uses it."
  - "The nine sdk_http `Asynchronous` variants become `EntryPoint::Async`; the wire name stays \"async\" through `rename_all`, so the `#[serde(rename = \"async\")]` goes with each enum and nothing on the home spells \"asynchronous\"."
  - "`#[default]` stays on Sync: a messages_stream_split case leaves `mode` out and runs the sync iterator today, and b5368 and assistant_create read their field with `#[serde(default)]` too."
  - "least_busy's `Callback` is read only on the Python side, since `Step::Success { call_id, .. }` skips it, so the field stays on Success and Failure or the probe cases stop parsing under deny_unknown_fields."
  - "Line numbers are main's at e34d392e793; B10200, B10216, B10220 and B10224 rewrite some of these files first, so find each enum and each use by name."
  - "No `pub use`, `use ... as Mode` or `type Mode = EntryPoint;` keeps an old name: each file imports betterlite_oracle_helper_api::entry_point::EntryPoint itself."
review_level: standard
budget:
  max_changed_lines: 900
  max_new_expects: 0
