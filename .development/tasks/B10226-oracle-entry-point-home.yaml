id: B10226
title: One EntryPoint in betterlite-oracle-helper-api for the oracle's 34 Sync and Async entry-point enums
description: >-
  Thirty-four oracle adapters under tools/oracle/src declare their own enum with two unit variants, Sync and Async, read from a case's "sync" or "async" to pick which LiteLLM entry point the case calls: completion or acompletion, success_handler or async_success_handler, sync_read_from_primary or async_read_from_primary, an iterator's `__next__` or `__anext__`. Copied code is not allowed, so this task writes one `EntryPoint` into the empty module tools/oracle/helper-api/src/entry_point.rs (the stub and its `pub mod entry_point;` line in helper-api's lib.rs are on main) and moves every copy onto it. betterlite-oracle-helper-api is the oracle's bottom crate: the eight group crates that hold a copy (bedrock, core_ops, foundry, http, logging, sdk, secret_managers, vertex) and the top betterlite-oracle crate (sdk_http, router_probes and its own router group) already depend on it, and it depends on no other oracle crate, so no Cargo.toml changes, no new crate edge and no cycle. It is a refactor: every case reads, runs and answers the same.


  The home. `use serde::{Deserialize, Serialize};`, a one-line comment saying the value picks the LiteLLM entry point a case calls, then `#[derive(Debug, Clone, Copy, Default, PartialEq, Eq, Deserialize, Serialize)]` and `#[serde(rename_all = "snake_case")]` over `pub enum EntryPoint { #[default] Sync, Async }`, and `mod tests;` at the end. The serde names are "sync" and "async", the names every copy reads and every case sends. The derives are what the copies need between them: Serialize because sdk_http's calls, least_busy's steps, request_policy's Iterate input and openai_mock_transport's scenarios derive it on the struct that holds the value; PartialEq for comparisons like invoke_stream's `run.wrapper == Wrapper::Sync`; and Default with Sync, because messages_stream_split's SplitStep, sdk b5368's Input and assistant_create's Call read an absent field as sync through `#[serde(default)]` (one messages_stream_split case leaves `mode` out). The tests go in entry_point/tests.rs, plain `#[test]` functions as in error/tests.rs: both variants serialize with serde_json to "sync" and "async" and read back, "Sync" and "asynchronous" are refused, and `EntryPoint::default()` is Sync.


  The copies, by shape. Sync and Async under `rename_all = "snake_case"` (24): bedrock's invoke_stream/types.rs `Wrapper` L41-L44, other_transcription/input.rs `Mode` L14-L17 and request_policy.rs `IteratorCall` L53-L56; core_ops' b3487.rs `Mode` L36-L39, b3488.rs `Mode` L59-L62, b3491.rs `Mode` L10-L13, b4305/fixtures/input.rs `Operation` L31-L34 and messages_stream_split.rs `Mode` L58-L62; foundry's agent_runs/input.rs `Mode` L22-L25; http's openai_mock_transport.rs `SelectionKind` L41-L44; logging's b3962.rs `Path` L31-L34 and success/input.rs `Mode` L78-L81; the top crate's router b4381/input.rs `Method` L28-L31; sdk's b5368/input.rs `Mode` L7-L11; secret_managers' b4414.rs `Path` L33-L36; vertex's legacy_prediction_result/input.rs `Step` L12-L15; router_probes' least_busy.rs `Callback` L51-L54; and sdk_http's assistant_create.rs `Entry` L38-L42, assistant_messages.rs `Mode` L26-L29, assistant_threads.rs `Mode` L36-L39, chat_response_stream/call.rs `ChatRunMode` L30-L33, responses_chat_call/call.rs `Mode` L10-L13, responses_compact.rs `Mode` L53-L56 and transcription_call.rs `Mode` L40-L43. Sync and `#[serde(rename = "async")] Asynchronous` (9), all in sdk_http: image_generation_plan.rs `SyncMode` L22-L26, and the `Mode` of rerank_http.rs L19-L23, responses_lifecycle_write.rs L20-L24, transcription_http.rs L21-L25, vector_file_create_list.rs L26-L30, vector_file_read.rs L36-L40, vector_file_write.rs L26-L30, vector_store_read.rs L26-L30 and vector_store_write.rs L26-L30. And one with no derives: logging's b3997/cases.rs `HeaderMode` L27-L30, which b3997.rs L39-L40 builds from `Action::AsyncHeaders` and `Action::SyncHeaders`. Each enum goes with its derive, serde and comment lines.


  The users. Each field that holds one keeps its name (mode, path, method, steps, wrapper, operation, kind, callback, entry, calls, modes), since the name is the key the cases send, and takes `EntryPoint`. Every `::Async` or `::Asynchronous` of a copy reads `EntryPoint::Async`, and every `::Sync` reads `EntryPoint::Sync`. Each file imports `betterlite_oracle_helper_api::entry_point::EntryPoint` from the crate that defines it, as shared oracle code is imported today. Beside the defining files, the users are bedrock's invoke_stream/run.rs and other_transcription/ops.rs; core_ops' b3491/runner.rs, b4305/fixtures.rs, b4305/fixtures/request.rs, b4305/scenario.rs and messages_stream_split/split_step.rs; foundry's agent_runs/runs.rs; logging's b3997.rs and success/handler.rs; router's b4381.rs; sdk's b5368/fixture.rs and b5368/target.rs; vertex's legacy_prediction_result/ops.rs and tests.rs; and in sdk_http assistant_messages/execute.rs and tests.rs, chat_response_stream/run.rs, image_generation_plan/native.rs, rerank_http/native.rs, responses_chat_call.rs, responses_compact/support.rs, responses_lifecycle_write/native.rs, transcription_call/call.rs, transcription_http/fixtures/source.rs, the native.rs of the five vector modules, and responses_create/ports.rs L2 and L27, which build a responses_chat_call call with `Mode::Sync`. The scope lists each file, and the whole module where B10200, B10216, B10220 or B10224 rewrite it first, since their workers may move these lines.


  Converters that stay. foundry's agent_runs/runs.rs L56-L57 turns the value into betterlite-foundry's AgentRunMode, router's b4381.rs L75-L76 into betterlite-router's EmbeddingMode, logging's b3962.rs L196-L201 into betterlite-logging's CallbackPath and core_ops' b4305/fixtures/request.rs L22-L27 into AsyncSupport. Those product types have no serde and belong to their crates, so each match stays and only its left side reads EntryPoint. rerank_http.rs L25-L33 `impl Mode { request_flag }` can't stay on a type another crate owns; its one caller, rerank_http/native.rs L102, writes `is_async: Json::Bool(mode == EntryPoint::Async),` with the impl's comment on the line above. b4305/fixtures.rs L12 re-exports Operation; the re-export drops it, and scenario.rs and request.rs import the home.


  Not merged. B10220 and B10221 own the 25 Sync and Async wire enums whose value becomes a client class: B10220 the twelve sdk_http transport `Mode`s, file_http_upload's `RunMode`, image_edit_call's `Client`, image_edit_http's `Mode`, bedrock other_rerank's `Supplied` and soniox_pipeline's `Mode`, which take betterlite-http's ClientKind; B10221 azure's four `KindName`s, openai's assistants `KindName`, image_variations `Kind` and speech `SuppliedKind`, and foundry embeddings' `ModeName`. The line between them is where the value goes: into a ClientKind or a client constructor's is_async is theirs, a pick of which LiteLLM function, method or handler runs is this task's. Two more two-variant enums name a client class and stay: openai's files/input.rs `Supplied` L23-L26 is the class of the pre-built client files.rs hands to get_openai_client as is_async, and redis' b4321.rs `ClientKindWire` L19-L23 mirrors betterlite-redis's ClientKind, the redis-py client class. The rest have a third variant or a payload, or use Sync as one tag among others: bedrock's embedding_io/input.rs, other_embedding_call/input.rs, other_image_call/calls.rs and other_image_edits/input.rs `Supplied` and invoke_stream/types.rs `Client` (None, Sync, Async); sdk_http's assistant_read_delete.rs `EntrySet` (Both, Sync, Async) and file_http_content.rs `Mode` (Sync, Asynchronous, Streaming); core_ops' b3488.rs `Outcome`, b3491/runner.rs `Streams` and messages_stream_split/split_step.rs `Run`, sdk_http's messages_chat_transform_stream/steps.rs `Pump` and response_chat_dispatch/fixtures/execution.rs `ExecutionFailure`, which carry results or streams; and models' ocr_pricing.rs `Input`, server's b3672.rs `Function` and the `StepKind`s of router_probes' routing_budget_state, routing_state and usage_v2_accounting.


  Tests. The home's tests.rs is the only new test. The helper corpus replays decode every helper corpus case through each group's inputs, and the sdk_http corpus replay decodes the sdk_http cases, so they prove the cases still read the same names. The modules' own tests (bedrock's invoke_stream, other_transcription and request_policy, foundry's agent_runs, http's openai_mock_transport, logging's b3997, vertex's legacy_prediction_result and sdk_http's assistant_messages) pass with only the type changed. No case file changes.


  What users see: nothing.
