id: B10181
title: Response text decodes like httpx where ten copies cut, drop or re-read bytes
description: >-
  Ten readers port httpx's `Response.text` (or, in the CLI, requests' `Response.text`) but decode an invalid byte differently from LiteLLM. httpx 0.28.1 decodes the body with the declared charset or UTF-8 and errors="replace", so each invalid sequence becomes one U+FFFD and the rest of the body stays. B10180 put that decoder in one place, `betterlite_models::utf8_text::decode_replacing_invalid`. This task deletes the ten readers, points their callers at it and updates the tests and deviation rows that pinned the old answers. Every crate touched already depends on betterlite-models.


  Cut at the first invalid byte, so the rest of the text is lost. (1) betterlite-core api/runway/video_lifecycle/content.rs L76-L84 `error_text`, used at L88: LiteLLM's _handle_error reads e.response.text (llm_http_handler.py L6082-L6083). (2) betterlite-http gigachat_tokens/authenticator.rs L202-L213 `rejected` builds the Rejected body from a cut prefix: GigaChat's authenticator puts e.response.text into its message (gigachat/authenticator.py L184-L188). (3) betterlite-http interactions/agents_delete_versions.rs L197-L204 `reply_text`, used at L193 for the error body and L207 for post_call's original_response: LiteLLM logs response.text (interactions/agents/http_handler.py L332) and its _handle_error passes e.response.text (interactions/http_handler.py L46-L51). (4) betterlite-logging mavvrik_delivery/transport.rs L43-L56 `text_prefix`: the Mavvrik destination formats resp.text[:200] and [:400] (focus/destinations/mavvrik_destination.py L159, L180, L221, L260, L294, L319); the decode changes and the byte limit with its floor_char_boundary stays, as B3063's row allows. (5) betterlite-logging zerobus/client/failure.rs L15-L22 `body_text`, used by status_failure at L7: `_status_failure` formats error.response.text and cuts the whole detail to 500 characters (zerobus/client.py L84-L89), and the chars().take(500) stays. (6) betterlite-vertex vertex_batch_create/execution.rs L176-L184 `body_text`, used at L162 and L207: the batch handler reads response.text in the fine-tuned endpoint lookup and e.response.text in the create (vertex_ai/batches/handler.py L235, L268). (7) betterlite-vertex vertex_batch_lifecycle/execution.rs L76-L84 `body_text`, imported by page.rs L7 (L18), cancel.rs L22 (L117, L156) and retrieve.rs L19 (L80): the same handler's retrieve, list and cancel paths (handler.py L391, L445, L517, L544, L625, L638, L642, L671).


  Other readers. (8) betterlite-http interactions/agents_create_read.rs L147-L153 `body_text` falls back to Latin-1, so b"a\xff" reads "a\u{ff}" where httpx gives "a\u{FFFD}"; its callers are create_call.rs L9, L85, L128, read_call.rs L8, L92 and tests/support.rs L13, L86, and LiteLLM logs response.text (agents/http_handler.py L85, L130). (9) betterlite-cli commands/debug/fetch.rs L105-L110 keeps only the valid chunks, so an invalid byte disappears; LiteLLM's _transport_failure shows error.response.text[:500] (proxy/client/cli/commands/debug.py L137-L140). The body becomes `decode_replacing_invalid(&response.body).chars().take(TRANSPORT_BODY_CHARS).collect()`. (10) betterlite-openai image_variations/request.rs L75-L76 calls encoding_rs's `UTF_8.decode`, which sniffs a byte order mark: it drops a leading UTF-8 BOM and decodes a body that starts with FF FE or FE FF as UTF-16, where httpx's UTF-8 decoder keeps the BOM as U+FEFF and replaces those bytes. LiteLLM's message is the masked e.text, which _raise_masked_sync_error fills from response.text (custom_httpx/http_handler.py L474-L479, L526-L529; image_variations/handler.py L103-L110).


  Tests. Rename and re-pin the tests that held the old answers. core api/runway/video_lifecycle/tests.rs `content_keeps_the_valid_prefix_of_a_non_utf8_failure_body` becomes `content_replaces_invalid_bytes_in_a_failure_body` with message "bad \u{FFFD} bytes". http gigachat_tokens/tests/oauth_request.rs `oauth_request_keeps_the_text_up_to_an_invalid_byte` becomes `oauth_request_replaces_an_invalid_byte` with body "denied\u{FFFD}more". http agents_delete_versions/tests/delete.rs `delete_agent_records_a_reply_that_is_not_text` becomes `delete_agent_replaces_bytes_that_are_not_text` and logs "deleted \u{FFFD}". http agents_create_read/tests/create_tests.rs `body_text_reads_non_utf8_bytes_as_latin1` (L275-L278) goes, and `create_agent_replaces_bytes_that_are_not_text` sends a reply body b"a\xffb" through the create call and finds "a\u{FFFD}b" in post_call's original_response, the way the delete test reads it. vertex vertex_batch_create/execution/tests.rs `an_error_body_keeps_the_text_before_its_first_invalid_byte` becomes `an_error_body_replaces_invalid_bytes` with the create case ending ": bad \u{FFFD} job" and the lookup case ": gone \u{FFFD}". vertex vertex_batch_lifecycle/execution/tests.rs (L171-L180) gets the same rename with ": bad \u{FFFD} job", and page/tests.rs `a_refused_page_keeps_the_text_before_its_first_invalid_byte` becomes `a_refused_page_replaces_invalid_bytes` with ": page \u{FFFD} gone". cli commands/debug/fetch/tests.rs `fetch_drops_bytes_that_are_not_text_from_the_status_body` becomes `fetch_replaces_bytes_that_are_not_text_in_the_status_body` with body "o\u{FFFD}k". New: `an_error_body_replaces_invalid_bytes` in logging mavvrik_delivery/tests/mavvrik_delivery/error_handling.rs (an API failure whose body is b"bad \xff body" reports "bad \u{FFFD} body"), `an_insert_rejection_replaces_invalid_bytes` in logging zerobus/client/tests/zerobus/ingest_status.rs (an insert answered 400 with b"bad \xff row" fails with detail "insert returned 400: bad \u{FFFD} row") and `an_error_body_keeps_its_byte_order_mark` in openai image_variations/tests.rs (an error body b"\xef\xbb\xbfbad" gives message "\u{feff}bad").


  Deviation rows. Five owners logged the old answer on purpose under the refuse-instead-of-mangle reading of clippy.toml, and the row goes or loses that clause. docs/deviations/B1538.yaml L9 becomes "An artifact error body is decoded as UTF-8 with one U+FFFD per invalid sequence, whatever charset its Content-Type declares, where LiteLLM's response.text honours a declared charset." with the same link. docs/deviations/B3503.yaml L30 becomes "A reply body is decoded as UTF-8 with one U+FFFD per invalid sequence, in post_call's original_response and in the provider error message; a charset the Content-Type declares is not honoured." docs/deviations/B3502.yaml L15 becomes "The response text a stage records is the body decoded as UTF-8 with one U+FFFD per invalid sequence; a charset the Content-Type declares is not honoured." docs/deviations/B3063.yaml L6 keeps only "the 200 and 400 limits count bytes" and its why loses the lossy-decoding reason. docs/deviations/B1372.yaml L9 and docs/deviations/B1373.yaml L3 drop the "keeps the text before its first invalid byte" clause from what and the "httpx decodes response.text with replacement characters" clause from why, and keep the rest. Each why says only what still differs.
