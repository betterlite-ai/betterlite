    why: The batch create failure reads e.response.text; the retrieve, list and cancel paths at L391-L671 read response.text the same way.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/debug.py#L137-L140
    why: _transport_failure shows error.response.text[:500] from requests.
