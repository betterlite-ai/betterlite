    why: requests decodes with errors="replace" in the encoding the headers name, UTF-8 for application/json.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L474-L529
    why: _safe_get_response_text returns response.text, which _raise_masked_sync_error puts into the error's text for the image variation handler.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/image_variations/handler.py#L103-L110
    why: The image variation failure raises OpenAIError with that text as its message.
dod:
  - text: The RunwayML artifact error, the GigaChat OAuth rejection, the agent delete error and log, the Mavvrik and Zerobus failure details and the Vertex batch create, retrieve, list, cancel and page errors keep the whole body with one U+FFFD per invalid sequence.
    proof: [runway-tests, gigachat-tests, agent-delete-tests, mavvrik-tests, zerobus-tests, batch-create-tests, batch-lifecycle-tests]
  - text: Agent create and read log U+FFFD where they read Latin-1, the CLI debug failure keeps a replaced byte instead of dropping it, and an image variation error keeps a leading byte order mark.
    proof: [agent-create-tests, cli-debug-tests, image-variation-tests]
  - text: None of the ten readers is left, and each caller calls betterlite_models::utf8_text::decode_replacing_invalid.
    proof: [no-copies]
  - text: The six deviation rows no longer claim a cut or a Latin-1 fallback, and B3063's row keeps its byte limits.
    proof: [deviation-rows]
checks:
  optional: []
  commands:
    - id: runway-tests
      why: The RunwayML artifact error still cuts at the first invalid byte, or another lifecycle test broke.
      run: grep -q 'fn content_replaces_invalid_bytes_in_a_failure_body' crates/betterlite-core/src/api/runway/video_lifecycle/tests.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::runway::video_lifecycle::/)'
    - id: gigachat-tests
      why: The GigaChat rejection body is still cut, or an OAuth request test broke.
      run: grep -q 'fn oauth_request_replaces_an_invalid_byte' crates/betterlite-http/src/gigachat_tokens/tests/oauth_request.rs && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^gigachat_tokens::/)'
    - id: agent-delete-tests
      why: The agent delete log or error still holds a cut body.
      run: grep -q 'fn delete_agent_replaces_bytes_that_are_not_text' crates/betterlite-http/src/interactions/agents_delete_versions/tests/delete.rs && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^interactions::agents_delete_versions::/)'
    - id: agent-create-tests
      why: Agent create or read still reads an invalid byte as Latin-1.
      run: grep -q 'fn create_agent_replaces_bytes_that_are_not_text' crates/betterlite-http/src/interactions/agents_create_read/tests/create_tests.rs && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^interactions::agents_create_read::/)'
    - id: mavvrik-tests
      why: A Mavvrik failure body is still cut where the valid text ends.
      run: grep -q 'fn an_error_body_replaces_invalid_bytes' crates/betterlite-logging/src/mavvrik_delivery/tests/mavvrik_delivery/error_handling.rs && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^mavvrik_delivery::/)'
    - id: zerobus-tests
      why: A Zerobus failure detail is still cut at the first invalid byte.
      run: grep -q 'fn an_insert_rejection_replaces_invalid_bytes' crates/betterlite-logging/src/zerobus/client/tests/zerobus/ingest_status.rs && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^zerobus::/)'
    - id: batch-create-tests
      why: A Vertex batch create or lookup error is still cut.
      run: grep -q 'fn an_error_body_replaces_invalid_bytes' crates/betterlite-vertex/src/vertex_batch_create/execution/tests.rs && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^vertex_batch_create::/)'
    - id: batch-lifecycle-tests
      why: A Vertex batch retrieve, list, cancel or page error is still cut.
      run: grep -q 'fn an_error_body_replaces_invalid_bytes' crates/betterlite-vertex/src/vertex_batch_lifecycle/execution/tests.rs && grep -q 'fn a_refused_page_replaces_invalid_bytes' crates/betterlite-vertex/src/vertex_batch_lifecycle/page/tests.rs && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^vertex_batch_lifecycle::/)'
    - id: cli-debug-tests
      why: The debug command still drops an invalid byte from a failure body.
      run: grep -q 'fn fetch_replaces_bytes_that_are_not_text_in_the_status_body' crates/betterlite-cli/src/commands/debug/fetch/tests.rs && cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands::debug::/)'
    - id: image-variation-tests
      why: An image variation error still drops a byte order mark or decodes a UTF-16 mark.
      run: grep -q 'fn an_error_body_keeps_its_byte_order_mark' crates/betterlite-openai/src/image_variations/tests.rs && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^image_variations::/)'
    - id: no-copies
      why: One of the ten readers or its cut, Latin-1 or BOM-sniffing decode is still in place.
      run: >-
        test -z "$(grep -nE 'fn (error_text|reply_text|body_text)[(]|valid_up_to|UTF_8[.]decode|chunk[.]valid[(][)][.]chars'
        crates/betterlite-core/src/api/runway/video_lifecycle/content.rs
        crates/betterlite-http/src/gigachat_tokens/authenticator.rs
        crates/betterlite-http/src/interactions/agents_delete_versions.rs
        crates/betterlite-http/src/interactions/agents_create_read.rs
        crates/betterlite-logging/src/mavvrik_delivery/transport.rs
        crates/betterlite-logging/src/zerobus/client/failure.rs
        crates/betterlite-vertex/src/vertex_batch_create/execution.rs
        crates/betterlite-vertex/src/vertex_batch_lifecycle/execution.rs
        crates/betterlite-cli/src/commands/debug/fetch.rs
        crates/betterlite-openai/src/image_variations/request.rs)"
        && grep -q 'decode_replacing_invalid' crates/betterlite-logging/src/mavvrik_delivery/transport.rs
        && grep -q 'decode_replacing_invalid' crates/betterlite-cli/src/commands/debug/fetch.rs
        && grep -q 'decode_replacing_invalid' crates/betterlite-openai/src/image_variations/request.rs
    - id: deviation-rows
      why: A deviation row still says a body is cut or read as Latin-1, or B3063 lost its byte limits.
      run: >-
        test -z "$(grep -nE 'first invalid byte|valid text ends|Latin-1 when that fails|refuse lossy decoding'
        docs/deviations/B1538.yaml docs/deviations/B3503.yaml docs/deviations/B3502.yaml
        docs/deviations/B3063.yaml docs/deviations/B1372.yaml docs/deviations/B1373.yaml)"
        && grep -q 'count bytes' docs/deviations/B3063.yaml
        && grep -q 'U+FFFD' docs/deviations/B1538.yaml
        && grep -q 'U+FFFD' docs/deviations/B3503.yaml
        && grep -q 'U+FFFD' docs/deviations/B3502.yaml
oracle_cases: []
deviations: []
out_of_scope:
  - "The 33 copies that already decode like Python, the home and its tests: B10180."
  - "A charset the Content-Type declares: httpx and requests honour it, while the home and every caller decode UTF-8; the rows above keep saying so where they did."
  - "The 'N bytes that are not UTF-8' readers that refuse a body instead of decoding it keep their own deviation rows."
  - "cli's pkce_login/wire.rs response_text reads requests' Latin-1 fallback for an undeclared charset on purpose and is not one of these readers."
  - "Mavvrik's limits stay in bytes, as B3063's row says; only the decode changes."
pitfalls:
  - "Zerobus cuts the formatted detail, not the body, to 500 characters, so the replacement character counts as one of the 500."
  - "Mavvrik's floor_char_boundary must run on the decoded text, since U+FFFD is three bytes and a limit can fall inside it."
  - "The debug command's take(TRANSPORT_BODY_CHARS) counts characters after decoding, like Python's [:500] on the decoded text."
  - "requests decodes text/* without a charset as ISO-8859-1, so UTF-8 with replacement is right only for the proxy's JSON error bodies the debug command reads; say so in a one-line comment above the decode."
  - "agents_create_read's body_text is pub(crate) and imported by create_call.rs, read_call.rs and tests/support.rs, so all three switch in the same change."
  - "vertex_batch_lifecycle's body_text has importers in page.rs, cancel.rs and retrieve.rs; deleting it without them breaks the crate."
  - "image_variations' existing case with b\"bad \\xFF body\" already expects U+FFFD and keeps passing; only the byte order mark case shows the fix."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
