references:
  - url: https://github.com/encode/httpx/blob/0.28.1/httpx/_models.py#L641-L672
    why: Response.text decodes with the declared charset or UTF-8 through TextDecoder; nothing is cut and no Latin-1 fallback exists.
  - url: https://github.com/encode/httpx/blob/0.28.1/httpx/_decoders.py#L306-L318
    why: TextDecoder's errors="replace", the one U+FFFD per invalid sequence the home gives.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6052-L6111
    why: _handle_error reads e.response.text for the RunwayML artifact error.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/authenticator.py#L184-L188
    why: The GigaChat OAuth failure message quotes e.response.text whole.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/agents/http_handler.py#L80-L135
    why: Agent create and read log response.text as original_response; delete does the same at L332.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/http_handler.py#L46-L53
    why: The interactions _handle_error hands e.response.text to the provider error class.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/destinations/mavvrik_destination.py#L155-L182
    why: The Mavvrik register and signed URL failures slice resp.text by characters.
