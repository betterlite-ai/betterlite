    - crates/betterlite-guardrails/src/agent_365.rs
    - crates/betterlite-guardrails/src/agent_365/**
    - tools/oracle/cases/guardrails/agent-365/**
    - tools/oracle/helpers/b3742.py
    - tools/oracle/helpers/b3742/**
    - tools/oracle/src/helpers/guardrails/b3742.rs
    - tools/oracle/src/helpers/guardrails/b3742/**
  lint_tables: false
