id: B3742
title: Agent 365 tool evaluation and enforcement
description: >-
  Build the pre-MCP evaluator hook and verdict/error handling, completing Agent 365 guardrail
  enforcement for tool calls. Decode the evaluation response, enforce allow/block decisions,
  and route four error shapes from token endpoint failures through distinct outcomes: agent-owned
  gateway failures and reachability errors apply unreachable_fallback (fail_open/fail_closed),
  caller-owned token rejections (non-assertion AADSTS codes) return 401 without evicting the
  cached token, endpoint throttling (408/429) blocks regardless of fail_open, and malformed or
  unevaluated allow verdicts follow unavailability fallback. When allowed=true and
  defender.status != "Evaluated", treat the Defender skipped evaluation as unavailable rather
  than authorizing silently. Rejected tool calls include the tool name, HTTP status, and Defender
  correlation ID in error details. Caller-supplied bearer token and authenticated key alias go
  into the evaluation payload; agent_id is omitted when missing.
scope:
