    why: _DefenderResult, _EvaluateResponse, _UnavailableDetail, _BlockedDetail response/detail records.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L191-L276
    why: async_pre_call_hook orchestration and error routing from token/evaluation endpoints.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L278-L384
    why: _handle_evaluate_error and _enforce_verdict; 401 evicts token immediately, malformed/unevaluated allow follows unavailability.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L511-L556
    why: _handle_caller_fault and _handle_throttled with verdict recording.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L563-L604
    why: _handle_unavailable with fail_open/fail_closed branching and verdict recording.
dod:
  - text: Evaluation response types and error detail records match the Defender contract and HTTP contract for blocked/rejected/unavailable outcomes.
    proof: [agent-365-enforcement-types, agent-365-enforcement-oracle]
  - text: Caller-supplied bearer token must be present; 401 on token exchange evicts the cached assertion without re-throwing to the caller.
    proof: [agent-365-enforcement-tests, agent-365-enforcement-oracle]
  - text: Tool evaluation verdicts are enforced; allowed=false raises 400 with blocked details, unevaluated allowed=true falls through to unavailability.
    proof: [agent-365-enforcement-tests, agent-365-enforcement-oracle]
  - text: Gateway-owned token failures (client credentials, scope, resource) apply unreachable_fallback; caller-owned failures (assertion rejection) return 401.
    proof: [agent-365-enforcement-tests, agent-365-enforcement-oracle]
  - text: Endpoint throttling (408/429) blocks with 503 regardless of unreachable_fallback; reachability failures respect fail_open.
    proof: [agent-365-enforcement-tests, agent-365-enforcement-oracle]
  - text: Evaluation verdicts (Allow, Block, Rejected, Throttled, Unavailable, Unscanned) are recorded with defender status, correlation ID, latency and reason.
    proof: [agent-365-enforcement-tests, agent-365-enforcement-oracle]
checks:
  optional: []
  commands:
    - id: agent-365-enforcement-types
      why: Evaluation and error detail records lack required fields or wrong types.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^agent_365::enforcement_types(::|$)/)'
    - id: agent-365-enforcement-tests
      why: Caller authentication, token eviction, verdict enforcement, error routing or logging are incorrect.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^agent_365::enforcement(::|$)/) - test(replays_agent_365_corpus)'
    - id: agent-365-enforcement-oracle
      why: The oracle harness does not match LiteLLM enforcement behavior.
      run: cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/guardrails/agent-365
