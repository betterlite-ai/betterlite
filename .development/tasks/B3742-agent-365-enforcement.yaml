out_of_scope:
  - B3741 owns _evict_obo_token, _get_obo_token, async_pre_call_hook's token-exchange path before _handle_evaluate_error, Agent365TokenExchangeError, Agent365MalformedResponseError, Agent365ThrottledError, _post_allowing_error_status and _build_evaluate_payload.
  - B104 owns should_run_guardrail, log_guardrail_information, standard guardrail logging, the concrete MCP hook caller that supplies incoming_bearer_token, and the framework response/error dispatch.
pitfalls:
  - A 401 evaluation response (not token-exchange 401) does not evict the token; only the token-exchange endpoint's 401 does. The cached OBO token is valid for subsequent evaluations until explicitly evicted by another exchange failure.
  - An allowed=true evaluation with defender.status != "Evaluated" is treated as unavailable, not silently authorized, because the Defender skipped evaluation and no threat assessment was made.
  - Malformed or non-JSON evaluation responses from HTTP 200 endpoints fall through to unavailability, not caller fault, because the gateway's own response decoding failed.
  - Throttling (408/429) from the evaluation endpoint blocks with 503 regardless of unreachable_fallback, but throttling from the token endpoint still respects fail_open/fail_closed.
