deviations:
  - what: >-
      Repeated cursors in pagination return partial results with a warning instead
      of raising an error. LiteLLM logs and returns, preserving buggy server behavior
      gracefully on the client side.
    why: Partial results are more useful than a hard failure when a server loops.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L976-L977
  - what: >-
      Page exhaustion (reaching 1,000 pages) returns partial results with a warning
      instead of raising. LiteLLM logs and returns.
    why: A complete catalog later than 1,000 pages is rare; returning what arrived avoids cascading failures.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L980-L982
  - what: >-
      Deadline expiration in pagination returns partial results with a warning.
      LiteLLM logs and returns what arrived.
    why: >-
      A slow MCP server returning partial results is better than a timeout error
      stalling the chat. The effective_deadline is max(client_timeout, listing_timeout)
      to preserve the guarantee that a single page slower than listing_timeout but
      within client_timeout succeeds.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L963-L967
  - what: >-
      Method-not-found errors on the first page of a list operation return an empty
      list instead of raising. LiteLLM treats unsupported operations gracefully. On
      later pages, method-not-found errors propagate as a hard failure.
    why: >-
      Treating missing methods as empty results on first page avoids blocking a chat
      when the server lacks an optional operation. Hard failure on later pages detects
      when the server capabilities changed during pagination.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L1000-L1007

out_of_scope:
  - All upper composition and gateway routing. B140 will orchestrate these operations with the wider session and request flow.
  - HTTP client construction and credential headers. B4741 handles client settings and prepared auth; B4744 handles the session and transport lifecycle.
  - Tool conversion and pagination helpers. B4740 handles schema conversion and the paginated listing framework that _list_optional_pages builds on.
  - Session initialization and transport management. B4744 handles run_with_session and transport lifecycle.

pitfalls:
  - >-
      The effective_deadline for _list_optional_pages is max(self.timeout, MCP_TOOL_LISTING_TIMEOUT),
      not listing_timeout alone. This preserves the guarantee that a single page slower than
      listing_timeout but within client_timeout will succeed.
  - >-
      Capability checking compares the exact field name in server_capabilities: prompts for
      list_prompts, resources for both list_resources and list_resource_templates. A capability
      that is None means the feature is unsupported; an absent capability field means the server
      did not advertise support, which is also treated as None.
  - >-
      Method-not-found errors are only handled gracefully (as empty list) on the first page.
      A method-not-found on page 2 or later means the server capabilities changed mid-pagination
      and should propagate as an error.
  - >-
      CancelledError always propagates without recovery or logging the full traceback, only
      the timeout context. This is expected control flow, not a failure to surface with a stack
      trace.
  - >-
      Broken-stream detection uses substring matching on exception type names from the MCP SDK.
      Types like BrokenResourceError or connection-related exceptions should be caught and logged
      separately. Verify the pinned SDK exception types match the patterns used in list_prompts
      and other list operations.
  - >-
      raise_on_error distinguishes two failure paths for list operations: when True, re-raise
      immediately with no logging; when False, log at error because this is the only error surface.
      get_prompt and read_resource always raise. They log the traceback at debug level but log
      the failure message and broken-stream detection at error level.

review_level: standard
budget:
