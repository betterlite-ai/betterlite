dod:
  - text: >-
      _list_optional_pages pages through results by following nextCursor, stops on
      repeated cursors with a warning, stops at the 1,000-page limit with a warning,
      returns partial results on deadline expiration with a warning, and succeeds when
      a single page succeeds even if slower than the listing timeout. Raises on
      method-not-found only after the first page.
    proof: [list-prompts-behavior-tests, oracle-mcp-resources]

  - text: >-
      list_prompts and list_resources check server_capabilities for their respective
      capability field; if absent, return an empty list. If present, use _list_optional_pages.
      On first-page method-not-found, return an empty list. On later-page method-not-found,
      let _list_optional_pages raise. When raise_on_error=False, catch exceptions and
      return an empty list with error-level logging. When True, re-raise immediately with no logging.
    proof: [list-prompts-behavior-tests, list-resources-behavior-tests, oracle-mcp-resources]

  - text: >-
      list_resource_templates checks the resources capability (same field as list_resources)
      and uses _list_optional_pages with the same error handling as list_resources.
    proof: [list-templates-behavior-tests, oracle-mcp-resources]

  - text: >-
      get_prompt and read_resource always raise on error. Log the full traceback at debug level
      and the failure message with broken-stream detection at verbose_logger.error level.
      Propagate cancellation without recovery.
    proof: [get-prompt-behavior-tests, read-resource-behavior-tests, oracle-mcp-resources]

  - text: >-
      All operations use run_with_session to establish and cleanup the session. The
      _list_optional_pages deadline is max(self.timeout, MCP_TOOL_LISTING_TIMEOUT)
      matching the B4740 pagination deadline.
    proof: [deadline-tests, cancellation-tests]

  - text: Every mutant in the capability checking and pagination logic is caught by a test.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: list-prompts-behavior-tests
      why: list_prompts capability checking, raise_on_error behavior, and broken-stream detection are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::mcp_client_resources::list_prompts_tests::/)
        - test(/replays_the_/)'
    - id: list-resources-behavior-tests
      why: list_resources capability checking, error handling, and pagination are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::mcp_client_resources::list_resources_tests::/)
        - test(/replays_the_/)'
    - id: list-templates-behavior-tests
      why: list_resource_templates capability checking and error handling are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::mcp_client_resources::list_templates_tests::/)
        - test(/replays_the_/)'
    - id: get-prompt-behavior-tests
      why: get_prompt exception handling and broken-stream detection are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::mcp_client_resources::get_prompt_tests::/)
        - test(/replays_the_/)'
    - id: read-resource-behavior-tests
      why: read_resource exception handling and broken-stream detection are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::mcp_client_resources::read_resource_tests::/)
        - test(/replays_the_/)'
    - id: deadline-tests
      why: deadline calculation and the max(timeout, listing_timeout) behavior are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::mcp_client_resources::deadline_tests::/)
        - test(/replays_the_/)'
    - id: cancellation-tests
      why: Cancellation and timeout handling do not propagate correctly or log unexpectedly.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::mcp_client_resources::cancellation_tests::/)
        - test(/replays_the_/)'
    - id: oracle-mcp-resources
      why: The HTTP oracle does not replay prompts and resources behavior with real or scripted MCP peers.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-client-resources)" &&
        ls tools/oracle/cases/helpers/mcp-client-resources/*.yaml >/dev/null &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

