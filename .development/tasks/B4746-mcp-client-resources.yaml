id: B4746
title: MCP client prompts and resources
description: >-
  Build optional prompt and resource operations over the initialized session runner.
  Preserve unsupported-capability empty lists, first-page method-not-found fallback,
  strict later-page pagination failure, and raised get/read errors.

  Implement MCPClient._list_optional_pages to handle pagination with capability absence,
  cursor-loop detection, page-limit enforcement, and deadline exhaustion. Accept a fetch_page
  callable and an items_of callable that extracts items from a page result. Return partial
  results with a warning on repeated cursors, page exhaustion at the 1,000-page limit, or
  deadline expiration; raise RuntimeError on method-not-found only after the first page.
  The effective deadline is max(self.timeout, MCP_TOOL_LISTING_TIMEOUT) matching the B4740
  pagination deadline. Store stripped initialization instructions and use run_with_session
  (owned by B4744) to manage session lifecycle.

  Implement MCPClient.list_prompts with capability checking: if server_capabilities exists
  and prompts capability is None, return an empty list without calling the server. Otherwise
  use _list_optional_pages with the session.list_prompts call. On MCPError with code
  METHOD_NOT_FOUND on the first page, return an empty list; on later pages, let the error
  propagate from _list_optional_pages. When raise_on_error is False, catch exceptions,
  log at error level with broken-stream detection, and return an empty list. When True,
  re-raise immediately with no logging.

  Implement MCPClient.get_prompt with a nested _get_prompt_operation that calls
  session.get_prompt with the name and arguments from GetPromptRequestParams. Always raise
  on error. Log the full traceback at debug level and the failure message with broken-stream
  detection at verbose_logger.error level when an exception occurs.

  Implement MCPClient.list_resources and MCPClient.list_resource_templates with the same
  capability checking and error handling as list_prompts, using session.list_resources
  and session.list_resource_templates respectively. Both use _list_optional_pages and
  respect raise_on_error.

  Implement MCPClient.read_resource with a nested _read_resource_operation that calls
  session.read_resource with the URL. Always raise on error. Log the full traceback at debug
  level and the failure message with broken-stream detection at verbose_logger.error level.

  Load LITELLM_MCP_TOOL_LISTING_TIMEOUT (default 30.0 seconds) from B002 configuration
  for the _list_optional_pages deadline calculation. CancelledError and timeout always
  propagate without recovery; broken-stream detection uses exception type substring matching
  on exception type names from the MCP SDK.

