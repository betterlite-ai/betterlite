deviations:
  - what: Suppressed compression guardrails are stored in a ContextVar, not in request metadata.
    why: Suppression state is internal request routing state, not metadata a caller can read or replay to disable guardrails.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/auto_router_compression.py#L27-L31
  - what: The armed model-hop flag uses a ContextVar because only the proxy path arms guardrails; the SDK path never compresses at model hop.
    why: Arming is pre-call proxy state; the SDK does not invoke arm_pre_call, so routing compression is never applied.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/auto_router_compression.py#L39-L43
  - what: Routing message compression reads the live request messages, never a pre-guardrail copy.
    why: Routing on a pre-masking snapshot would leak what other guardrails stripped; routing must see the same text that reaches the model.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/auto_router_compression.py#L207-L220
  - what: The throwaway stats sink in routing guardrail execution prevents double-counting token savings.
    why: apply_guardrail writes compression metrics to request_data; routing must not contribute to extract_compression_saved_tokens.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/auto_router_compression.py#L245-L258
out_of_scope:
  - B3682/B3683 own guardrail_class_registry (guardrail_registry.py) and the active guardrail enumeration contract from LoggingCallbackManager.
  - B3664/B3665/B3666 own CustomGuardrail class definition and apply_guardrail method.
  - B124 owns get_initialized_guardrail_with_read_through (registry_read_through.py) used to fetch the routing guardrail by name.
  - B189 owns LoggingCallbackManager.get_custom_loggers_for_type callback enumeration.
  - B302 owns deployment_catalog and Router.deployments_for_request.
  - B321 owns tag_routing and _get_tags_from_request_kwargs.
  - B206 owns call_helpers and get_or_create_metadata_bucket for metadata mutation.
  - The UNTRUSTED_REQUEST_HEADER_CONTROL_FIELDS and header-filtering constants used by other tasks are out of scope.
pitfalls:
  - ContextVars are request-scoped and must be reset at the start of arm_pre_call, not at the end, so nested calls start fresh.
  - Tag matching returns tag-matched deployments first, then untagged markers; the order of markers within each group is deployment resolution order, not marker registration order.
  - A guardrail named in the policy might not be registered or active; arm_pre_call warns but does not fail.
  - Routing-guardrail apply_guardrail receives a fresh copy of messages as structured_messages, not the live list, so mutations do not affect the original.
  - The suppressed_guardrails accessor name is 19 characters (suppressed_guardrails), not the LiteLLM function name (suppressed_compression_guardrails at 33 characters), to stay under the 30-character identifier limit.
