id: B3546
title: Auto-router compression policy and guardrail execution
description: >-
  Build the auto-router compression policy resolver, which decouples compression
  decisions between routing and model hops through a marker deployment. Resolve the
  marker's routing and model compression choices from its litellm_params, suppress
  other compression guardrails in trusted request context, and execute the routing
  guardrail over the live request messages.

  Implement in betterlite-router (Rust wrapper) with Python oracle adapters. The
  auto router instructs the proxy which guardrail (if any) compresses for its
  routing decision and model-side deployment; both hops must be consistent to avoid
  double-counting saved tokens or restoring content dropped by another guardrail.

  Policy resolution: read auto_router_routing_compression and auto_router_model_compression
  from the marker's litellm_params in the resolved deployment. Normalize empty strings
  and the sentinel "none" (case/whitespace insensitive) to None; all other non-empty
  strings are guardrail names. Both unset keys mean no routing compression; a configured
  value of "none" disables that hop. Tag-matched deployments (request tags that match
  deployment tags) win over untagged markers; the first policy found stops the search.

  Pre-call arming: when arm_pre_call runs, resolve the policy for the model alias
  against the router's candidate deployments, set the suppressed guardrails in request
  context (not replayable metadata), and arm the model-side guardrail if any by appending
  it to metadata["guardrails"]. An armed guardrail is executed even if not default_on.
  Suppress every other active compression guardrail so routing compression cannot restore
  text removed by Headroom/Typesafe/Compresr.

  Routing-message compression: when messages_for_routing runs, apply the routing
  guardrail (if named in the policy) over the live request messages, never a
  pre-guardrail snapshot, so the routing sees what masking guardrails stripped.
  Call the initialized guardrail through the read-through lookup and invoke its
  apply_guardrail method with structured_messages and a throwaway stats sink
  (routing never double-counts into compression savings).

  is_same property: true when both routing and model are equal (including both None),
  false otherwise. Model-hop compression armed property: true only when the model-side
  guardrail was actually found and added to metadata["guardrails"] during arming.

  Own provider/sentinel/context declarations at auto_router_compression.py:24-31,41-43,
  and the policy fields at 51-56. Counted span 24-258: 178 lines.

