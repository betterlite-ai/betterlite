dod:
  - text: Policy normalization returns None for empty strings, missing keys, and the "none" sentinel (case/whitespace insensitive), and a guardrail name for all other non-empty strings.
    proof: [policy-normalization-tests]
  - text: is_same property returns true when routing and model are equal (including both None), false otherwise.
    proof: [is-same-tests]
  - text: Policy resolution uses tag-matched deployments first, then untagged markers, in resolved order; the first policy found stops the search.
    proof: [policy-resolution-tests]
  - text: Compression guardrail class detection identifies instances of registry-provided classes by provider name (headroom, compresr, typesafe).
    proof: [guardrail-detection-tests]
  - text: Pre-call arming sets suppressed guardrails in context (not metadata), arms the model-side guardrail by appending to metadata["guardrails"], and warns when the named guardrail is not active.
    proof: [pre-call-arming-tests]
  - text: Routing-message compression applies the routing guardrail over live messages and returns the guardrail's structured_messages output or the input unchanged if guardrail is not found or is not a compression type.
    proof: [routing-compression-tests]
  - text: Every mutant in the auto-router compression policy functions is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: policy-normalization-tests
      why: Policy normalization from raw litellm_params values must handle empty, None, and sentinel values correctly
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^auto_router_compression_policy::test_normalization/)'
    - id: is-same-tests
      why: is_same property must return true when routing and model match (including both None)
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^auto_router_compression_policy::test_is_same/)'
    - id: policy-resolution-tests
      why: Policy resolution must prioritize tag-matched deployments over untagged and stop at the first policy found
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^auto_router_compression_policy::test_policy_for_model/)'
    - id: guardrail-detection-tests
      why: Guardrail type detection must identify compression guardrail instances by provider name from the registry
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^auto_router_compression::test_guardrail_detection/)'
    - id: pre-call-arming-tests
      why: Pre-call arming must set suppressed guardrails in context, arm the model guardrail via metadata, and warn on missing active guardrails
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^auto_router_compression::test_arm_pre_call/)'
    - id: routing-compression-tests
      why: Routing-message compression must apply the routing guardrail over live messages and fallback to uncompressed messages on error
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^auto_router_compression::test_messages_for_routing/)'
