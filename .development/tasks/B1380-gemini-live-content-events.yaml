id: B1380
title: Build Gemini Live content event sequences and caller state updates
description: >-
  Implement gemini_live_content for realtime/transformation.py L213-L242, L689-L913,
  L968-L1032 and L1099-L1212, 396 nonblank noncomment lines. These pure transforms use
  B1004 realtime records, B1378 setup decoding and an injected UUID source. Classify a
  modelTurn from its first part, preferring text over inlineData; warn unless there is
  exactly one part and preserve the empty-parts failure. generationComplete requires a
  prior text/audio delta type. Event mapping examines only the current top-level key/value,
  prioritizes truthy modelTurn then generationComplete, and otherwise matches the ordered
  setupComplete, generationComplete, turnComplete, interrupted and toolCall mapping by
  non-None nested presence. Do not let a sibling serverContent classify toolCall.
  Starting content emits response.created, response.output_item.added,
  conversation.item.added and response.content_part.added in that order. Reuse a present
  response/item/conversation ID; generate missing IDs with the exact resp_/item_/conv_
  prefixes. Setup contributes lowered modalities and nullable temperature/max_output_tokens.
  Concatenate every modelTurn part's text or inlineData.data into one output_text.delta
  or output_audio.delta according to the chosen type. A done event joins supplied text
  delta chunks, or emits audio done without accumulated bytes. Follow it with content_part.done
  and output_item.done; reuse any fallback IDs generated by the first done event. Preserve
  the source quirk that empty completed text yields an audio content part with empty
  transcript. Return completed-event IDs without retroactively replacing the caller-state
  IDs when that branch did not assign them.
  For update_current_delta_chunks, a list replaces prior state with only output_text.delta
  events, becoming None if none; a single text delta appends, and any other single event
  clears it. update_current_item_chunks follows the same rule for output_item.done. Audio
  payloads are never accumulated. Expose gemini_live_content helper cases first_part_warning,
  sibling_event_isolation, false_nested_presence, start_event_order, mixed_part_concatenation,
  empty_text_done_audio_part, fallback_done_ids, list_replaces_deltas and item_list_reset.
  All inputs are decoded records except setup, whose decoder stays B1378; this task adds
  no byte parser. Budget 330 implementation, 230 behavior tests and 140 adapter/seed lines
  within 750.
scope:
  paths:
    - crates/betterlite-vertex/src/{lib,gemini_live_content}.rs
    - crates/betterlite-vertex/src/gemini_live_content/**
    - tools/oracle/src/helpers/vertex/gemini_live_content.rs
    - tools/oracle/src/helpers/vertex/gemini_live_content/**
    - tools/oracle/helpers/gemini_live_content.py
    - tools/oracle/helpers/gemini_live_content/**
    - tools/oracle/cases/helpers/gemini-live-content/**
    - tools/oracle/fuzz/corpus/helper_case/gemini_live_content*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/realtime/transformation.py#L213-L242
    why: First-part modality classification and generation-complete mapping.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/realtime/transformation.py#L689-L913
    why: Ordered content start/delta/done events and empty-text completion behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/realtime/transformation.py#L968-L1032
    why: Nested lookup and replace-versus-append caller-state updates.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/realtime/transformation.py#L1099-L1212
    why: Modality transitions reuse resolved done IDs and scope event detection to each key.
dod:
  - text: Content event sequences preserve exact ordering, identifiers and source completion edge cases.
    proof: [live-content-tests, live-content-python, oracle]
  - text: Chunk-list updates replace previous state while single matching events append.
    proof: [live-content-tests, live-content-python, oracle]
  - text: New helper seeds are decoded as the content-transition operation.
    proof: [live-content-seeds]
checks:
  optional: []
  commands:
    - id: live-content-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_live_content::/)'
      why: Ordered fixtures compare all events and resulting caller-state fields with fixed UUIDs.
    - id: live-content-python
      run: test -f tools/oracle/helpers/gemini_live_content.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Helpers invoke individual pinned content transforms rather than copying the state-transition logic.
    - id: live-content-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/gemini_live_content*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::vertex::gemini_live_content::/)'
      why: Shared corpus assertions require the call.gemini_live_content variant on added cases.
oracle_cases:
  - tools/oracle/cases/helpers/gemini-live-content/first-part-warning.yaml
  - tools/oracle/cases/helpers/gemini-live-content/sibling-event-isolation.yaml
  - tools/oracle/cases/helpers/gemini-live-content/false-nested-presence.yaml
  - tools/oracle/cases/helpers/gemini-live-content/start-event-order.yaml
  - tools/oracle/cases/helpers/gemini-live-content/mixed-part-concatenation.yaml
  - tools/oracle/cases/helpers/gemini-live-content/empty-text-done-audio-part.yaml
  - tools/oracle/cases/helpers/gemini-live-content/fallback-done-ids.yaml
  - tools/oracle/cases/helpers/gemini-live-content/list-replaces-deltas.yaml
  - tools/oracle/cases/helpers/gemini-live-content/item-list-reset.yaml
deviations: []
out_of_scope:
  - _is_new_content_delta at L679-L687 has no caller at the pin and receives no implementation or cases.
  - B1378 owns setup/session creation; B1379 owns client parsing/state; B1381 owns tool and usage helpers; B1382 owns transform_realtime_response.
pitfalls:
  - 'The oracle helper for this task is pre-registered as gemini_live_content in the vertex group. Replace the stub Op in tools/oracle/src/helpers/vertex/gemini_live_content.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/gemini_live_content.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - conversation.item.added must precede content_part.added; the source does not emit conversation.item.created.
  - An explicit false generationComplete still matches the fallback presence-based event mapping.
  - List-based state updates discard earlier text deltas rather than retaining a whole-turn transcript.
budget: {max_changed_lines: 750, max_new_expects: 1}
review_level: standard
