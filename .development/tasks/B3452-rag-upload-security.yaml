deviations:
  - what: >-
      Byte classification is pure Rust matching the pinned Python byte inspection
      without a live antivirus engine. The EICAR test signature verification is
      compiled into the default scanner, and custom MalwareScanner implementations
      are injected at call sites, never loaded from config or environment.
    why: >-
      This task builds byte inspection and scanner injection, not antivirus
      integration. Production deployment pairs this with a real scanning service
      provided at initialization time.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/upload_security.py#L97-L110
out_of_scope:
  - B1076 owns the two complete download-header helpers at upload_security.py:278-289 (_sanitize_header_filename and safe_download_headers), which handle Content-Disposition and X-Content-Type-Options header construction for safe file downloads.
pitfalls:
  - 'Archive detection for ASCII-ambiguous magic (bzip2 BZh) requires UTF-8 validation to distinguish from text; the order of classification matters, with shebang checked before PDF detection.'
  - 'Shebang detection removes UTF-8 BOM and leading whitespace before checking for #!; naked shebangs without actual script content pass the check.'
  - 'Safe filename generation calls the injected UUID provider exactly once per accepted upload, returning a hex string with the detected format extension.'
  - 'The architect adds `pub mod rag;` to crates/betterlite-core/src/lib.rs before this task runs, declaring the upload_security submodule within that parent, since the skeleton writes lib.rs once and module tasks never edit it.'
  - 'The oracle helper operation for this task (b3452) is automatically registered in the core_ops helper group belonging to betterlite-core, the first crate in scope. The skeleton creates tools/oracle/src/helpers/core_ops/b3452.rs with an Op stub; the worker replaces it with an impl Helper and writes the Python adapter in tools/oracle/helpers/b3452.py. No manual pre-registration, new group, or mod.rs edits are needed.'
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
