id: B3452
title: RAG upload inspection and safe download headers
description: >-
  Build byte-inspected PDF and UTF-8 text upload validation, an injected
  scanner protocol contract, deterministic safe filenames using UUID, and
  Content-Disposition headers that reject header injection. Preserve the 512
  MiB size limit, PDF/text detection order, ASCII-ambiguous archive magic
  handling, shebang/BOM removal before shebang detection, exact rejection
  reason messages, and EICAR-only default scanner.

  Owned whole functions in `litellm/proxy/rag_endpoints/upload_security.py`:

  - `:94-94` — `MalwareScanner.scan` protocol declaration.
  - `:107-110` — `EicarTestMalwareScanner.scan`.
  - `:157-158` — `_starts_with_any`; `:161-167` — `_is_archive`; `:170-177` — `_is_utf8_text`; `:180-183` — `_is_executable_binary`; `:186-188` — `_looks_like_shebang`.
  - `:191-202` — `inspect_content`; `:205-206` — `generate_safe_filename`.
  - `:209-226` — `_reject_disallowed`; `:229-244` — `_scan_rejection`; `:247-275` — `validate_upload`.

  Own the entire file's records, enums, constants and imports. Direct dependency:
  **B198**, injected UUID generation for `generate_safe_filename` (the source calls
  standard-library `uuid.uuid4`). The task provides no new config parsing; byte
  classification produces no signed wire format or database schema changes.

  Build the upload_security module in betterlite-core::rag; reuse typed
  dependencies. Keep Rust implementation under 300 lines by extracting helper
  submodules with adjacent tests.rs files for clarity. Fuzz actual byte
  classification; do not describe the EICAR placeholder as a production antivirus
  engine. Every format detection case from the LiteLLM test suite gets a corpus
  seed and a behavior case, exercising empty files, size limits, archive/executable
  rejection, valid PDF and text, EICAR handling, and header sanitization.

