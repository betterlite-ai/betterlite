id: B3240
title: Policy values, conditions and inheritance
description: >-
  Build the value layer of the policy engine in betterlite-policy. Later tasks (registry, attachment
  matching, records, validation, pipeline execution, routes) all import these types and functions, so
  this task has no registry, no database and no route. Everything here is pure.

  Types, one module each. `values` holds PolicyCondition (`model` is one string or a list of strings,
  or absent), PolicyScope (`teams`, `keys`, `models`, `tags`, each an optional list of strings),
  PolicyGuardrails (`add`, `remove`, optional lists), Policy (`inherit`, `description`, `guardrails`
  defaulting to empty PolicyGuardrails, `condition`, `pipeline`), PolicyAttachment (`policy`, `scope`,
  `teams`, `keys`, `models`, `tags`, `priority` as i32, `default` false) and PolicyConfig (a map of
  policy name to Policy, in a BTreeMap). `pipeline` holds the pipeline types: PipelineStep (`guardrail`,
  `on_fail` "block", `on_pass` "allow", `on_error` absent, `pass_data` false, `modify_response_message`
  absent), GuardrailPipeline (`mode`, `steps`), PipelineStepResult and PipelineExecutionResult. `context`
  holds PolicyMatchContext (`team_alias`, `key_alias`, `model`, `tags`, all optional) and ResolvedPolicy
  (`policy_name`, `guardrails`, `inheritance_chain`). Every struct derives serde Serialize and
  Deserialize and refuses unknown fields, as LiteLLM's `extra="forbid"` does. Optional fields default to
  absent when missing. Actions and modes are enums (PipelineAction: allow, block, next, modify_response;
  PipelineMode: pre_call, post_call) that serialize to those exact lowercase words. A bad action fails
  with the text `Invalid action 'x'. Must be one of: ['allow', 'block', 'modify_response', 'next']` and a
  bad mode with `Invalid mode 'x'. Must be one of: ['post_call', 'pre_call']`. A pipeline with no steps
  is rejected, and so is a priority outside the i32 range. `on_error` absent means "use on_fail" and
  stays absent in the value; the executor (B3247) applies that rule. PipelineStepResult has an outcome
  enum pass, fail, error. PipelineExecutionResult keeps `original_exception` as an optional boxed error
  that is skipped when serializing.

  The accessors keep Python truthiness for lists: `PolicyScope::get_teams`, `get_keys`, `get_models`
  return `["*"]` when the list is absent or empty, `get_tags` returns an empty list in both cases, and
  `PolicyGuardrails::get_add` and `get_remove` return an empty list. `PolicyAttachment::is_global` is
  true only when `scope == "*"`. `to_policy_scope` returns teams, keys and models all `["*"]` and no tags
  for a global attachment, and otherwise copies teams, keys, models and tags (the `scope` string is
  ignored then).

  `condition` holds `evaluate_condition(condition: Option<&PolicyCondition>, context:
  &PolicyMatchContext) -> bool`. No condition is true. A condition with no `model` is true. Otherwise a
  context model of None is false, and the condition matches when any pattern (a single string counts as
  a list of one) matches. A pattern matches when it equals the model exactly, or when it compiles as a
  regex and matches the whole model (Python `re.fullmatch`). Use fancy-regex, the engine the other
  guardrail tasks use, and wrap the pattern so it must cover the whole value, for example
  `\A(?:pattern)\z`. A pattern that does not compile, or whose match fails at run time, is a plain
  non-match. An empty list of patterns never matches. Log a debug line `Condition failed: model=%s did
  not match %s` when the model check fails, with tracing.

  `scope` holds two functions moved here from LiteLLM's PolicyMatcher because the registry task calls
  them: `matches_pattern(value: Option<&str>, patterns: &[String]) -> bool` and `scope_matches(scope:
  &PolicyScope, context: &PolicyMatchContext) -> bool`. A value of None matches only when a pattern is
  exactly `*`. Otherwise a pattern matches through B882's `route_matches_wildcard_pattern` in
  betterlite-auth (a final `*` is a raw prefix match, anything else is equality). `scope_matches`
  requires team_alias against the teams, key_alias against the keys and model against the models, each
  after the `["*"]` default. Tags are checked only when the scope has tags: then the context needs a
  non-empty tag list and at least one context tag must match one scope pattern.

  `inheritance` holds `resolve_inheritance_chain(policy_name, policies: &BTreeMap<String, Policy>) ->
  Vec<String>` and `resolve_policy_guardrails(policy_name, policies, context:
  Option<&PolicyMatchContext>) -> ResolvedPolicy`. The chain runs from the root ancestor to the policy.
  An unknown name gives an empty chain. An empty `inherit` string means no parent. The visited set is
  shared down the recursion and a repeat gives an empty chain for that step and a warning `Circular
  inheritance detected for policy '%s'`, so a cycle a to b to a gives `[b, a]` for a, and a policy that
  inherits itself gives `[a]`. A missing parent contributes nothing. Resolution walks the chain root
  first, skips a policy whose condition fails for the context (only when a context was passed, debug line
  `Policy '%s' condition did not match, skipping guardrails`), adds its `add` names to a set, then
  discards its `remove` names. The result lists the set sorted ascending, because the Python set order is
  random per process and the callers treat it as a set.

  Cargo: add betterlite-auth, fancy-regex, serde, serde_json, thiserror and tracing to
  crates/betterlite-policy/Cargo.toml with the workspace versions. Each module with a failing step owns
  its error enum (`PipelineError` for bad action, bad mode and empty steps).

  Tests live in `values::tests`, `pipeline::tests`, `condition::tests`, `scope::tests` and
  `inheritance::tests`. Name one test per branch listed in the DoD. Helper cases call the operation
  `b3240` with a `function` field (`evaluate_condition`, `matches_pattern`, `scope_matches`,
  `inheritance_chain`, `resolve_policy_guardrails`, `attachment_scope`, `validate_pipeline`), build the
  LiteLLM pydantic objects from the case input, and print guardrails sorted.
scope:
  paths:
    - crates/betterlite-policy/src/values.rs
    - crates/betterlite-policy/src/values/**
    - crates/betterlite-policy/src/pipeline.rs
    - crates/betterlite-policy/src/pipeline/**
    - crates/betterlite-policy/src/context.rs
    - crates/betterlite-policy/src/context/**
    - crates/betterlite-policy/src/condition.rs
    - crates/betterlite-policy/src/condition/**
    - crates/betterlite-policy/src/scope.rs
    - crates/betterlite-policy/src/scope/**
    - crates/betterlite-policy/src/inheritance.rs
    - crates/betterlite-policy/src/inheritance/**
    - crates/betterlite-policy/Cargo.toml
    - tools/oracle/cases/helpers/policy-values/**
    - "tools/oracle/fuzz/corpus/helper_case/policy-values-*"
  lint_tables: false
