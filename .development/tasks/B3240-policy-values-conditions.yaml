    why: PolicyCondition and PolicyScope with the get_* defaults; tags default differs from the other three.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/policy_engine/policy_types.py#L133-L244
    why: PolicyGuardrails and Policy, including the empty-guardrails default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/policy_engine/policy_types.py#L247-L332
    why: PolicyAttachment (priority range, default flag), is_global, to_policy_scope, PolicyConfig.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/policy_engine/pipeline_types.py#L13-L105
    why: Action and mode sets, the two validators with their exact messages, step and result types.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/policy_engine/resolver_types.py#L14-L63
    why: PolicyMatchContext and ResolvedPolicy. B3242 owns the rest of this file from L66.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/condition_evaluator.py#L27-L107
    why: Condition evaluation, list handling, exact-then-fullmatch pattern rule.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_matcher.py#L30-L94
    why: matches_pattern and scope_matches. B3241 owns the rest of the file from L96.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_resolver.py#L31-L127
    why: resolve_inheritance_chain and resolve_policy_guardrails. B3241 owns the rest of the file from L129 except get_all_resolved_policies.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/route_checks.py#L557-L584
    why: The wildcard rule that matches_pattern calls (already built by B882).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/attachment_registry.py#L155-L200
    why: Call sites of scope_matches and matches_pattern, to see the argument shapes B3241 will pass.
dod:
  - text: >-
      Policy, PolicyScope, PolicyGuardrails, PolicyCondition and PolicyAttachment deserialize with their
      defaults, refuse unknown fields, and reject a priority outside the i32 range.
    proof: [behavior-tests]
  - text: >-
      The scope and guardrail accessors treat an empty list like an absent one: teams, keys and models give
      ["*"], tags and add and remove give an empty list.
    proof: [behavior-tests, oracle]
  - text: >-
      A global attachment (scope "*") converts to a scope with teams, keys and models ["*"] and no tags,
      and a non-global one copies its own lists.
    proof: [behavior-tests, oracle]
  - text: >-
      Pipeline validation rejects an unknown action on on_fail, on_pass or on_error, an unknown mode, and an
      empty steps list, with LiteLLM's message text, and accepts the defaults block and allow.
    proof: [behavior-tests, oracle]
  - text: >-
      evaluate_condition is true for no condition and for a condition without model, false for a missing
      model, and matches by exact string, by whole-value regex, and by any entry of a list.
    proof: [behavior-tests, oracle]
  - text: >-
      A regex that only matches part of the model does not match, an invalid regex falls back to exact
      equality, and an empty list of patterns never matches.
    proof: [behavior-tests, oracle]
  - text: >-
      matches_pattern gives true for None only when "*" is in the list, uses the trailing-star prefix rule
      otherwise, and scope_matches checks tags only when the scope has tags (requires a non-empty context tag
      list and one matching tag).
    proof: [behavior-tests, oracle]
  - text: >-
      resolve_inheritance_chain returns root first, an empty chain for an unknown policy, and the cycle and
      self-inheritance results described above with a warning log.
    proof: [behavior-tests, oracle]
  - text: >-
      resolve_policy_guardrails applies add then remove root first, skips a chain policy whose condition
      fails only when a context is passed, lets a child remove an inherited guardrail, and returns the
      guardrails sorted.
    proof: [behavior-tests, oracle]
  - text: The b3240 helper operation matches the production functions on every case, and the seed corpus replays.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The value, condition, scope or inheritance tests are missing or a pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^(values|pipeline|context|condition|scope|inheritance)::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The b3240 adapter is missing or the strict Python checks fail.
      run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No seed was added or the helper case decoder fails the replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/policy-values-*")" && grep -rlq '"b3240' tools/oracle/fuzz/corpus/helper_case/policy-values-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
