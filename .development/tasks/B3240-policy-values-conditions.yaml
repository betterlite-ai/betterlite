deviations:
  - what: resolve_policy_guardrails returns the guardrail names sorted ascending.
    why: LiteLLM returns list(set), whose order changes between Python processes, so no caller can depend on it. A fixed order keeps tests and responses stable. Oracle cases compare the names as a set.
  - what: Condition regexes run on fancy-regex, not Python re. A pattern fancy-regex cannot compile, or a match that exceeds its backtrack limit, counts as no match.
    why: Python re has no maintained Rust twin. Python would raise re.error for an invalid pattern (same non-match result here) and would run on without a limit for a catastrophic pattern.
out_of_scope:
  - "B3241 owns the registries, PolicyMatcher.get_matching_policies, policy_applies, get_policies_with_matching_conditions, resolve_guardrails_for_context, resolve_pipelines_for_context and get_pipeline_managed_guardrails. It calls the functions of this task."
  - "B3242 owns resolver_types.py from PolicyScopeResponse (L66) on: response records, DB responses, request bodies."
  - "B3250 owns PolicyResolver.get_all_resolved_policies."
  - "B3241 parses raw config dicts and legacy guardrail lists into these types; B3247 owns running a pipeline and the on_error-falls-back-to-on_fail rule."
  - "B079 owns the package re-exports in litellm/types/proxy/policy_engine/__init__.py."
pitfalls:
  - "PolicyScope get_tags returns an empty list for an absent or empty list and that means 'skip the tag check', while the other three getters turn the same input into ['*']."
  - "A condition `model: []` is not 'no condition': the model key is present, any() over nothing is false, so the policy never applies."
  - "The condition is checked with `is not None`, so an empty-string model pattern is still evaluated; only a missing context model fails outright."
  - "re.fullmatch is anchored at both ends: pattern `gpt-4` as regex does not match `gpt-4-turbo`, but `gpt-4.*` does. Exact equality is tried first, so `gpt-4.*` also matches the literal string `gpt-4.*`."
  - "A final `*` in matches_pattern is a raw prefix match with no slash boundary, so `gpt-*` matches `gpt-`; a `*` in the middle is a literal character."
  - "matches_pattern(None, ...) checks for the exact entry `*`; a pattern like `team-*` does not match a missing value."
  - "Pydantic only validates on_error when it is given; a missing on_error stays None and does not become 'block' in the value."
  - "The visited set in resolve_inheritance_chain is shared across the whole recursion and never cleared, so a diamond is not possible (inherit is single) but a cycle returns the partial chain, not an empty one."
  - "A chain policy whose condition fails is skipped entirely, including its `remove` list, so a child's remove of an inherited name does nothing when the child's condition fails."
  - "Policy.inherit is tested by truthiness: an empty string is no parent, and a name missing from the map ends the chain silently."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
