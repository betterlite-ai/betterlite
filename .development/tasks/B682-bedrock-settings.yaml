  commands:
  - id: case-deployment-before-env
    why: The deployment-before-env behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_settings_cases::case_[0-9]+_deployment_before_env$/)'
  - id: case-empty-bearer
    why: The empty-bearer behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_settings_cases::case_[0-9]+_empty_bearer$/)'
  - id: case-session-tags
