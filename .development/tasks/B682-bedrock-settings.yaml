id: B682
title: AWS deployment settings and environment snapshot
description: >-
  Create betterlite-bedrock and AwsSettings records and resolve the AWS deployment/environment inputs once through
  betterlite-config. Preserve missing versus empty values, explicit deployment precedence, static/session/profile/role/IRSA
  fields, session tags and separate bearer credentials. Credential acquisition and caching remain B590.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  BedrockError.__init__ L79-L102.


  Implement crates/betterlite-bedrock/src/bedrock_settings.rs with adjacent tests under bedrock_settings/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_settings in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_settings_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): deployment_before_env, empty_bearer, session_tags, irsa_config. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_settings* using HelperCase: kind: helper
  and the externally tagged bedrock_settings variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_settings that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/bedrock_settings.rs
  and its loader wiring: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION_NAME, AWS_SESSION_NAME,
  AWS_PROFILE_NAME, AWS_ROLE_NAME, AWS_WEB_IDENTITY_TOKEN, AWS_STS_ENDPOINT, AWS_EXTERNAL_ID, AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE,
  AWS_BEARER_TOKEN_BEDROCK, aws_session_tags. Module-level settings enter litellm_settings; deployment settings
  enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above and in
  the linked branches; existing key owners remain unchanged. Write config rstest bedrock_settings_config_cases with
  named cases loads_aws_access_key_id, loads_aws_secret_access_key, loads_aws_session_token, loads_aws_region_name,
  loads_aws_session_name, loads_aws_profile_name, loads_aws_role_name, loads_aws_web_identity_token, loads_aws_sts_endpoint,
  loads_aws_external_id, loads_aws_role_arn, loads_aws_web_identity_token_file, loads_aws_bearer_token_bedrock,
  loads_aws_session_tags, plus rejects_unrelated_key. Each loads case calls the real config loader with that key
  and asserts the resolved value, default, precedence and secret redaction where applicable. Seed B002 config_yaml
  with new bedrock_settings* files for every key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_settings_credential_identity_isolation in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone bedrock_settings_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 24 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 60 production lines, 209 behavior/config-test lines, 71 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 67 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 447 planned, 450 maximum changed lines.
