deviations: []
out_of_scope:
  - "Route behavior: B4721."
  - "The other /v1/mcp routes: B8625, B8700, B8701 and B8702."
pitfalls:
  - PublicServerSetting must change the live registry settings, not a copy, or make_public answers 200 and the public hub keeps the old list.
  - ConfigStore saves with include_env_vars false; true would rewrite the environment_variables section on every make_public.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
