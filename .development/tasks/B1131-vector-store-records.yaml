id: B1131
title: Vector store and knowledge-base wire records
description: >-
  Add the records in types/vector_stores.py and types/integrations/rag/bedrock_knowledgebase.py to
  betterlite-openai::api::vector_store_records. Preserve absent versus null TypedDict fields; total=False
  does not make every field required and annotations alone do not validate a runtime dictionary. Pydantic
  request models do validate their required fields, default their optional fields to null and ignore extras.
  Implement VectorStoreToolParams.to_dict as the only executable function in these files.

  Keep the leaf crate independent of core. decode_vector_store_records(kind,bytes,WireDecodeLimits) selects
  a closed record kind and reads bounded JSON; its caller supplies limits. Fuzz input starts with a record-kind
  byte and the remaining bytes are JSON for that same decoder. Replay committed corpus cases in replays_corpus.
  HelperCall::VectorStoreRecords compares model validation/dumps and to_dict directly against pinned types,
  using TypeAdapter only where the production caller actually validates a TypedDict. Do not introduce a
  blanket rejection of provider extension fields through a stronger oracle-only schema.

  Native domain tests named below cover every record field and enum, with named rstest inputs for variants.
  Scores use B204 exact decimals and its numeric boundary, not binary floats. These files have 319
  nonblank/non-comment lines including docstrings. Budget 300 records/decoder, 190 tests, 85 adapters,
  80 fixtures, 60 fuzz/replay and 35 wiring lines, 750 total under 780.
scope:
  paths:
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/vector_store_records.rs
  - crates/betterlite-openai/src/api/vector_store_records/**
  - crates/betterlite-openai/fuzz/Cargo.toml
  - crates/betterlite-openai/fuzz/fuzz_targets/vector_store_records.rs
  - crates/betterlite-openai/fuzz/corpus/vector_store_records/**
  - tools/oracle/src/helpers/openai/vector_store_records.rs
  - tools/oracle/src/helpers/openai/vector_store_records/**
  - tools/oracle/helpers/vector_store_records.py
  - tools/oracle/helpers/vector_store_records/**
  - tools/oracle/fuzz/corpus/helper_case/vector_store_records-*
  - tools/oracle/cases/helpers/vector-store-records/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/vector_stores.py#L1-L343
  why: Request model defaults, optional TypedDict fields, the discovery-search field sets and tool parameter null removal.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/rag/bedrock_knowledgebase.py#L1-L146
  why: Knowledge-base request and response spelling, optional nested records and required row/user context fields.
dod:
- text: >-
    tool_params_omit_only_null builds defaults and expects {}. filters={},max_num_results=0,ranking_options={}
    produces all three fields unchanged; null fields disappear. rewrite_query is not a VectorStoreToolParams
    field, although filters,max_num_results,ranking_options,rewrite_query are all search optional parameters.
    Search requests preserve query="q" versus query=["q","r"], false rewrite_query and null/absent filters.
  proof: [record-tests, oracle, helper-python]
- text: >-
    management_record_defaults validates update {vector_store_id:vs_a,unknown:1} as id=vs_a and four null
    fields custom_llm_provider,vector_store_name,vector_store_description,vector_store_metadata, without unknown.
    Delete/info require only vector_store_id; missing it gives validation type=missing,loc=[vector_store_id],
    message="Field required". IndexCreateRequest requires index_name and litellm_params with vector_store_index
    and vector_store_name; index_info defaults null. Managed index requires id,index_name,litellm_params;
    index_info,created_at,created_by,updated_at,updated_by default null. IndexListResponse requires data,
    defaults object="list", and rejects object="other" with literal_error. Valid UTC timestamps round-trip.
  proof: [record-tests, oracle, helper-python]
- text: >-
    vector_records_round_trip sends a managed store with vector_store_id=vs_a,custom_llm_provider=openai,
    vector_store_name=notes,vector_store_description=d,vector_store_metadata={tag:x},litellm_credential_name=c,
    litellm_params={api_base:url},team_id=t,user_id=u,is_config=true and created_at/updated_at timestamps.
    Preserve each field; string metadata="raw" is also legal. Config records carry vector_store_name and
    nullable litellm_params. Managed lists retain object=list,data,total_count=1,current_page=1,total_pages=1.
    SupportedVectorStoreIntegrations accepts bedrock/ragflow; VectorStoreIndexType accepts read/write.
    Index endpoints retain read/write tuples with GET,POST,PUT,DELETE,PATCH and paths, while auth records
    retain headers and query_params without adding either absent map.
  proof: [record-tests, oracle, helper-python]
- text: >-
    create_and_search_records round-trips name=null,file_ids=[file_a],expires_after={anchor:last_active_at,days:3},
    chunking_strategy={type:static,static:{max_chunk_size_tokens:800,chunk_overlap_tokens:400}},metadata={tag:x}.
    Also cover type=auto and omitted static. Responses retain id,object=vector_store,created_at=1,name,bytes=2,
    file_counts={in_progress:1,completed:2,failed:3,cancelled:4,total:10},status=expired/in_progress/completed,
    expires_after,expires_at,last_active_at,metadata. Search output object=vector_store.search_results.page,
    search_query=q,data=[{score:0.125,content:[{type:text,text:hello}],file_id:file_a,filename:a,attributes:{x:1}}]
    preserves values and nulls. Failure records require vector_store_id,nullable custom_llm_provider,error;
    failure mode is annotate or error. No integer range constraint is invented from a descriptive comment.
  proof: [record-tests, oracle, helper-python]
- text: >-
    discovery_extra_body_fields preserves query,pageSize,pageToken,offset,oneBoxPageSize,pageCategories,
    imageQuery,filter,canonicalFilter,orderBy,userInfo,languageCode,facetSpecs,boostSpec,params,
    queryExpansionSpec,spellCorrectionSpec,userPseudoId,contentSearchSpec,rankingExpression,
    rankingExpressionBackend,safeSearch,userLabels,naturalLanguageQueryUnderstandingSpec,searchAsYouTypeSpec,
    displaySpec,crowdingSpecs,relevanceThreshold,relevanceScoreSpec,customRankingParams. Use query=q,
    integer fields=1,safeSearch=false,string fields=x,sequence fields=[],map fields={} and userLabels={a:b}.
    Engine records additionally retain dataStoreSpecs=[{dataStore:s}],numResultsPerDataStore=2.
    TypedDict annotations do not themselves reject servingConfig; provider transformations own that rejection.
  proof: [record-tests, oracle, helper-python]
- text: >-
    knowledge_base_records preserves request retrievalQuery={text:q},nextToken=n,userContext={userId:u},
    guardrailConfiguration={guardrailId:g,guardrailVersion:1}, and retrievalConfiguration.vectorSearchConfiguration
    containing filter={equals:{key:k,value:v}},numberOfResults=3,overrideSearchType=HYBRID,
    implicitFilterConfiguration={modelArn:a,metadataAttributes:[{description:d,key:k,type:STRING}]},
    rerankingConfiguration={type:BEDROCK_RERANKING_MODEL,bedrockRerankingConfiguration:{modelConfiguration:{modelArn:a}}}.
    Model configuration also retains additionalModelRequestFields; metadata configuration retains selectionMode
    and selectiveModeConfiguration={}. Responses retain guardrailAction=INTERVENED/NONE,nextToken=n,
    retrievalResults with score=0.5,metadata={k:v},content={type:TEXT,text:t,byteContent:b,row:[{columnName:c,columnValue:v,type:STRING}]}.
    Location preserves type and each nullable s3Location,webLocation,kendraDocumentLocation,salesforceLocation,
    sharePointLocation,confluenceLocation,customDocumentLocation,sqlLocation map. Row fields and userId remain required
    when validated; every other declared optional field has absent and explicit-null cases.
  proof: [record-tests, oracle, helper-python]
- text: >-
    score_numeric_boundary accepts 0.125 exactly and exercises B204 rejection of 1e100 and nonfinite scores.
    Native tests assert the deviation below; malformed JSON and all record-kind bytes replay through the
    production decoder. New helper seeds use the vector_store_records tag.
  proof: [record-tests, parser-corpus, helper-corpus]
checks:
  optional: [mutants]
  commands:
  - id: record-tests
    why: a wire field, default or optional/null distinction is absent from the leaf records
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::vector_store_records::tests::/) - test(/::replays_corpus$/)'
  - id: parser-corpus
    why: record selection and external JSON decoding bypass the fuzzed production decoder
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/vector_store_records.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/vector_store_records)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::vector_store_records::tests::replays_corpus$/)'
  - id: helper-python
    why: model validation and tool conversion have no checked Python comparator
    run: test -f tools/oracle/helpers/vector_store_records.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: new record operations do not reach B171's typed input decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_store_records-*)" && grep -qE '^[[:space:]]+vector_store_records:' tools/oracle/fuzz/corpus/helper_case/vector_store_records-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vector-store-records/tool-params-omit-only-null.yaml
- tools/oracle/cases/helpers/vector-store-records/management-record-defaults.yaml
- tools/oracle/cases/helpers/vector-store-records/vector-records-round-trip.yaml
- tools/oracle/cases/helpers/vector-store-records/create-and-search-records.yaml
- tools/oracle/cases/helpers/vector-store-records/discovery-extra-body-fields.yaml
- tools/oracle/cases/helpers/vector-store-records/knowledge-base-records.yaml
deviations:
- what: Provider scores outside exact decimal representation return 502, type bad_gateway, param score, code decimal_out_of_range; nonfinite scores are rejected at the same numeric boundary.
  why: The repository forbids floats; preserve the already planned exact-score policy instead of silently rounding Python floats.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/vector_stores.py#L83-L91
out_of_scope:
- Provider search transforms own interpretation and rejection of extra_body target fields; these declarations perform no HTTP or provider routing.
- B1058 owns provider contracts and parameter filtering; B1062 owns registry loading and B1070 management behavior.
pitfalls:
- 'The oracle helper for this task is pre-registered as vector_store_records in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/vector_store_records.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vector_store_records.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- total=False means a missing score or content is allowed, not a numeric zero or an empty list inserted by deserialization.
- IndexListResponse defaults object to list, whereas a TypedDict object annotation does not insert that field.
- VectorStoreToolParams preserves zero and empty maps and has no rewrite_query member.
review_level: standard
budget:
  max_changed_lines: 780
  max_new_expects: 0
