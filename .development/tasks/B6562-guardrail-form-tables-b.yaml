deviations:
  - what: Provider settings are written as data tables and no longer read off the classes.
    why: Rust has no annotation reflection, and the oracle cases compare each table to the real class.
out_of_scope:
  - "The types and the projection function: B6560. The first 25 providers: B6561."
  - "The settings structs the guardrails use at run time: the provider tasks own them. A table here lists form fields only."
  - "bedrock, presidio, lakera_v2 and hide-secrets: they are fixed entries of the route and B6560 owns them."
pitfalls:
  - "DeepKeep, Lasso and Pillar each have two classes with similar names (litellm/types/guardrails.py and the hook types file); only the one `get_config_model` returns counts."
  - "A secret flag in `json_schema_extra` (straiker) is not a key the projection reads, so it adds nothing to the output."
  - "A model that lists two parents (enkryptai) takes fields from both, with the child's declaration winning on a name clash."
  - "A model with a `Generic[T]` parent whose argument is a real optional-params class gets that class as a nested model under `optional_params`; check the output with the oracle instead of guessing."
  - "Registry keys differ from folder names (ibm_guardrails registers its detector under its own key), so read each `__init__.py`."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
