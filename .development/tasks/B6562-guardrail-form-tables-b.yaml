    why: The registry loop and the dictionary assignment that lets a registry entry replace an earlier one with the same key.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/straiker.py#L178-L200
    why: A model with a nested optional params class, and a secret flag in json_schema_extra.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/cisco_ai_defense.py#L119-L146
    why: Optional params class used as the generic argument.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/enkryptai.py#L142-L145
    why: A model that inherits fields from a second class.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/compresr.py#L105-L135
    why: Largest remaining model with nested optional params.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/custom_code/custom_code_guardrail.py#L100-L130
    why: CustomCodeGuardrailConfigModel, the one model defined in a hook file in this group.
dod:
  - text: Every provider listed in this task has an entry under its registry key, and the entry projects to the same JSON as LiteLLM's class, ui_friendly_name included.
    proof: [tables-b-tests, oracle, helper-python]
  - text: Nested optional params, inherited fields and json_schema_extra settings of the group are in the tables.
    proof: [tables-b-tests, oracle]
  - text: The new helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: tables-b-tests
      why: a table is missing, has a wrong key or does not project to the expected JSON
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::form_tables_b::tests::/)'
    - id: helper-python
      why: the oracle adapter is missing or fails strict lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b6562)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no new helper case was added or the shared parser fails on one
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/guardrail-form-tables-b-*)" &&
        grep -lE '^[[:space:]]+b6562:' tools/oracle/fuzz/corpus/helper_case/guardrail-form-tables-b-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
