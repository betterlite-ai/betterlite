id: B6562
title: Guardrail provider form tables, second group
description: >-
  Write the form field tables for the remaining 24 providers whose guardrail class returns a settings model, in crates/betterlite-server/src/guardrails/form_tables_b.rs and form_tables_b/. B6560 defines `FormModel`, `FormField` and `project_model` (read `provider_forms/spec.rs` first), and B6561 does the first 25 providers. The route /guardrails/ui/provider_specific_params serves all of them from one map keyed by registry name.

  Expose `pub fn tables_b() -> Vec<(&'static str, FormModel)>`, each pair being the registry key from the hook folder's `__init__.py` and the model with its `ui_friendly_name`. Keep every file under 250 lines, for example `form_tables_b/identity.rs`, `form_tables_b/network.rs`, `form_tables_b/vendors.rs`, with `form_tables_b/tests.rs` for the checks.

  The providers, by hook folder under litellm/proxy/guardrails/guardrail_hooks/: agent_365, deepkeep, vigil_guard, cato_networks, custom_code (CustomCodeGuardrailConfigModel, defined in custom_code_guardrail.py), repelloai, aporia_ai, tool_permission, ibm_guardrails (ibm_detector.py), pangea, prompt_security, enkryptai, straiker, cisco_ai_defense, aim, singulr, onyx, akto, pillar, lasso, generic_guardrail_api, ovalix, compresr and model_armor. Their model classes are in litellm/types/proxy/guardrails/guardrail_hooks/<name>.py, except two. DeepKeep, Lasso and Pillar have an older class in litellm/types/guardrails.py with the same name as the hook model, so open the hook class's `get_config_model` and write what it returns. For generic_guardrail_api, read the class `get_config_model` returns and the nested optional params it uses (its default is built with `default_factory`, L113 of generic_guardrail_api.py in the types folder).

  `tool_permission` is also built by B6560's core tables for the route's fixed first step. The registry loop replaces that entry, so write it here from the class `get_config_model` returns, and B3684 puts these tables after the core ones so this version wins.

  Oracle: the helper operation takes `provider`, a registry key from the list above. The Python side looks the class up in `guardrail_class_registry`, calls `get_config_model()`, runs `_get_fields_from_model` and adds `ui_friendly_name`. The Rust side projects its table and adds the same entry.
