id: B304
title: Router counters, callback state and batched reads
description: 'Implement RouterCounters and batched delta synchronization over B360, with B012 success/failure
  callbacks and server-owned retirement/shutdown. Preserve LiteLLM merge arithmetic and failure recovery:
  log a failed flush and discard its detached deltas, without replay after an ambiguous response. B382
  owns read prefetch; this task owns counter lifetime and writes. Resolve default_sync_interval with Python
  truthiness against DEFAULT_REDIS_SYNC_INTERVAL (environment variable, default 1 second). Drain at most
  1024 queued deltas per owner; when full, flush synchronously within the caller deadline, and if unavailable
  warn/drop the new observation without changing the provider result. Configuration boundary keys introduced
  or consumed here: DEFAULT_REDIS_SYNC_INTERVAL. Implement the owned native service in crates/betterlite-router/src/routing_state.rs.
  Add ProbeOperation::RoutingState in tools/oracle/src/router_probes/mod.rs and the corresponding B304 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/base_routing_strategy.py:
  BaseRoutingStrategy.__init__ (L17-L29), BaseRoutingStrategy.setup_sync_task (L31-L41), BaseRoutingStrategy.cancel_sync_task
  (L43-L45), BaseRoutingStrategy.retire (L47-L55), BaseRoutingStrategy.cleanup (L57-L64), BaseRoutingStrategy._increment_value_list_in_current_window
  (L66-L76), BaseRoutingStrategy._increment_value_in_current_window (L78-L100), BaseRoutingStrategy.periodic_sync_in_memory_spend_with_redis
  (L102-L119), BaseRoutingStrategy._push_in_memory_increments_to_redis (L121-L166), BaseRoutingStrategy.add_to_in_memory_keys_to_update
  (L168-L169), BaseRoutingStrategy.get_key_pattern_to_sync (L171-L175), BaseRoutingStrategy.get_in_memory_keys_to_update
  (L177-L178), BaseRoutingStrategy.get_and_reset_in_memory_keys_to_update (L180-L184), BaseRoutingStrategy.reset_in_memory_keys_to_update
  (L186-L187), BaseRoutingStrategy._sync_in_memory_spend_with_redis (L189-L245). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. Function coverage in litellm/router_utils/router_callbacks/track_deployment_metrics.py:
  find_deployment_metadata (L27-L29), get_counted_usage_tokens (L32-L42), increment_deployment_successes_for_current_minute
  (L45-L59), increment_deployment_failures_for_current_minute (L62-L75), get_deployment_successes_for_current_minute
  (L78-L94), get_deployment_failures_for_current_minute (L97-L113). Implement these behaviors through
  the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
