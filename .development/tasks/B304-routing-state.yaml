dod:
- text: Write tests named routing_state_behaviors and routing_state_boundaries under routing_state::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - routing-state-behaviors
  - routing-state-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/routing-state-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/routing-state-invalid.yaml;
    the valid seed contains DEFAULT_REDIS_SYNC_INTERVAL. The cargo-fuzz target config_yaml and normal
    replays_the_config_yaml_corpus test call the production bounded parser. Both new files must be added
    relative to GATE_BASE.
  proof:
  - config-corpus
  - routing-state-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-state-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::routing_state_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: routing-state-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::routing_state_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/routing_state.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/routing_state.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/routing-state-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/routing-state-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/routing-state-" && grep -Fq 'DEFAULT_REDIS_SYNC_INTERVAL' crates/betterlite-config/fuzz/corpus/config_yaml/routing-state-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/routing-state/counter-expiry.yaml
- tools/oracle/cases/routing/routing-state/success-counted-once.yaml
- tools/oracle/cases/routing/routing-state/failed-flush-warns-and-discards.yaml
- tools/oracle/cases/routing/routing-state/retire-drains.yaml
- tools/oracle/cases/routing/routing-state/counter-queue-full.yaml
- tools/oracle/cases/routing/routing-state/default-sync-env.yaml
deviations:
- what: Counter queues are capped at 1024 pending deltas; overflow flushes within the caller deadline,
    then warns and drops an observation if storage remains unavailable.
  why: LiteLLM has an unbounded delta list; the bound is required by async-hygiene and does not add failure
    retries.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L78-L119
out_of_scope:
- Response caching, cluster discovery and Valkey platform configuration (B125/B126).
- Strategy-specific ranking and budget decisions.
- Store implementation and state codecs (B360).
- B382 owns request-scoped routing read batches; consume its tested public interface.
- B397 owns router success and failure callback integration; consume its tested public interface.
pitfalls:
- No lock may be held across a Redis await.
- Test Redis behind an injected store and include a real local Redis smoke test with a bounded test-owned
  subprocess.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
