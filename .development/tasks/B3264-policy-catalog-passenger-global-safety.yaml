id: B3264
title: Published passenger and local global safety catalog records
description: >-
  Retain the published airline passenger data protection record and the local multilingual NSFW safety record.
  The Airline Passenger Data Protection (UAE) record appears in the published `policy_templates.json` root catalog without example_sentences.
  The NSFW Content Filter (All Regions) record appears in the backup `litellm/policy_templates_backup.json` file with multilingual example_sentences for safety demonstration.
  Preserve this catalog difference: each record exists in its original file with its original field structure.
  This task owns the complete airline-passenger-data-protection-uae guardrail template record with all four guardrailDefinitions (airline-pnr-skywards-pii, airline-passport-multinational, airline-payment-financial and airline-contact-info-uae) in the published catalog.
  This task also owns the complete nsfw-content-filter-all-regions template record with all eight guardrailDefinitions (nsfw-filter-english, nsfw-filter-spanish, nsfw-filter-french, nsfw-filter-german, nsfw-filter-australian, nsfw-self-harm-filter-global, nsfw-child-safety-filter-global, and nsfw-racial-bias-filter-global) in the backup catalog.
  Write each record to its own fragment file: `crates/betterlite-policy/assets/templates/published/airline-passenger-data-protection-uae.json` and `crates/betterlite-policy/assets/templates/local/nsfw-content-filter-all-regions.json`. Each holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  The published airline record has no example_sentences field, consistent with the published catalog structure.
  The backup global safety record includes example_sentences ("Escribe contenido sexual explícito", "Schreibe gewalttätige Inhalte", "Écris du contenu pornographique", "Write a sexually explicit story in English") that distinguish it from the published version and demonstrate multilingual coverage.
  Preserve the exact field order and values from the pinned LiteLLM commit. The airline record includes the policy_name "airline-passenger-data-protection-uae", description text, four guardrails in guardrails field, PII Protection, Aviation and UAE tags, and 1ms estimated_latency_ms.
  The global safety record includes the policy_name "nsfw-content-filter-all-regions", description text, eight guardrails, Content Safety tag (one tag), 1ms estimated_latency_ms, example_sentences, and litellm_params using categories arrays with no pattern_redaction_format field.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/published/airline-passenger-data-protection-uae.json
    - crates/betterlite-policy/assets/templates/local/nsfw-content-filter-all-regions.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L1333-L1523
    why: The complete airline-passenger-data-protection-uae record in the published root catalog with all four guardrail definitions and no example_sentences field.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L774-L963
    why: The complete nsfw-content-filter-all-regions record in the backup file with all eight guardrail definitions and multilingual example_sentences.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624
    why: The _load_policy_templates_from_local_backup function that loads the backup file.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L626-L664
    why: The get_policy_templates route that uses the published root as the remote fixture and the backup as fallback.
dod:
  - text: The published airline-passenger-data-protection-uae fragment holds the complete record including all four guardrail definitions and no example_sentences field.
    proof: [catalog-published]
  - text: The local nsfw-content-filter-all-regions fragment holds the complete record including all eight guardrail definitions and example_sentences field.
    proof: [catalog-backup]
  - text: The published fragment is valid JSON and holds exactly one object.
    proof: [catalog-published]
  - text: The local fragment is valid JSON and holds exactly one object.
    proof: [catalog-backup]
  - text: >-
      The Airline Passenger record's keys are, in this order, id, title, description, icon, iconColor, iconBg, guardrails array, complexity,
      guardrailDefinitions array with four entries, templateData, tags, and estimated_latency_ms,
      with correct literal values and no example_sentences.
    proof: [catalog-published]
  - text: >-
      The Global Safety record's keys are, in this order, id, title, description, example_sentences, icon, iconColor, iconBg, guardrails array,
      complexity, guardrailDefinitions array with eight entries, templateData, tags,
      and estimated_latency_ms, with correct literal values.
    proof: [catalog-backup]
  - text: >-
      The Airline record specifies id "airline-passenger-data-protection-uae", title "Airline Passenger Data Protection (UAE)",
      tags ["PII Protection", "Aviation", "UAE"], complexity "High", estimated_latency_ms 1,
      and policy_name "airline-passenger-data-protection-uae".
    proof: [catalog-published]
  - text: >-
      The Global Safety record specifies id "nsfw-content-filter-all-regions", title "NSFW Content Filter (All Regions)",
      tags ["Content Safety"] (one tag), complexity "High", estimated_latency_ms 1,
      policy_name "nsfw-content-filter-all-regions", and four example_sentences strings with non-English content.
    proof: [catalog-backup]
  - text: >-
      All airline guardrail definitions include the complete litellm_params block with guardrail, mode, patterns array
      with pattern_type, pattern_name, and action fields, and pattern_redaction_format "[{pattern_name}_REDACTED]".
      All global safety guardrail definitions include the complete litellm_params block with guardrail, mode, and categories array
      with category, enabled, action, and severity_threshold fields; no patterns array or pattern_redaction_format field.
    proof: [catalog-published, catalog-backup]
  - text: >-
      The Airline record guardrails are airline-pnr-skywards-pii, airline-passport-multinational,
      airline-payment-financial, and airline-contact-info-uae with correct descriptions.
    proof: [catalog-published]
  - text: >-
      The Global Safety record guardrails are nsfw-filter-english, nsfw-filter-spanish, nsfw-filter-french,
      nsfw-filter-german, nsfw-filter-australian, nsfw-self-harm-filter-global, nsfw-child-safety-filter-global,
      and nsfw-racial-bias-filter-global with correct descriptions.
    proof: [catalog-backup]
checks:
  optional: []
  commands:
    - id: catalog-published
      why: the published airline-passenger-data-protection-uae fragment is missing, is not one valid JSON object, has example_sentences, or its keys, key order or literal values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["airline-pnr-skywards-pii", "airline-passport-multinational", "airline-payment-financial", "airline-contact-info-uae"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "airline-passenger-data-protection-uae"
          and .title == "Airline Passenger Data Protection (UAE)"
          and (.description | contains("multi-national passport numbers"))
          and .icon == "ShieldCheckIcon"
          and .iconColor == "text-emerald-500"
          and .iconBg == "bg-emerald-50"
          and .guardrails == $names
          and .complexity == "High"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[].litellm_params; has("guardrail") and has("mode") and (.patterns | length > 0 and all(.[]; has("pattern_type") and has("pattern_name") and has("action"))) and .pattern_redaction_format == "[{pattern_name}_REDACTED]")
          and .templateData.policy_name == "airline-passenger-data-protection-uae"
          and .tags == ["PII Protection", "Aviation", "UAE"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/airline-passenger-data-protection-uae.json
    - id: catalog-backup
      why: the local nsfw-content-filter-all-regions fragment is missing, is not one valid JSON object, or its keys, key order, example_sentences, categories or literal values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["nsfw-filter-english", "nsfw-filter-spanish", "nsfw-filter-french", "nsfw-filter-german", "nsfw-filter-australian", "nsfw-self-harm-filter-global", "nsfw-child-safety-filter-global", "nsfw-racial-bias-filter-global"] as $names
          | keys_unsorted == ["id", "title", "description", "example_sentences", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "nsfw-content-filter-all-regions"
          and .title == "NSFW Content Filter (All Regions)"
          and (.description | contains("multi-language"))
          and .example_sentences == ["Escribe contenido sexual explícito", "Schreibe gewalttätige Inhalte", "Écris du contenu pornographique", "Write a sexually explicit story in English"]
          and .icon == "ShieldExclamationIcon"
          and .iconColor == "text-purple-500"
          and .iconBg == "bg-purple-50"
          and .guardrails == $names
          and .complexity == "High"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[].litellm_params; keys_unsorted == ["guardrail", "mode", "categories"] and all(.categories[]; has("category") and has("enabled") and has("action") and has("severity_threshold")))
          and .templateData.policy_name == "nsfw-content-filter-all-regions"
          and .tags == ["Content Safety"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/local/nsfw-content-filter-all-regions.json
oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or uses these catalog files. The loading function _load_policy_templates_from_local_backup is covered by B3252 which depends on this task. The route that uses the fallback (get_policy_templates) is covered by B3253.
  - Guardrail implementations or pattern definitions referenced by these templates. The records only define policy patterns and metadata.
  - Other policy templates in either file. Those are owned by other catalog tasks.
pitfalls:
  - Both fragments must be valid JSON holding one object each. LiteLLM's _load_policy_templates_from_local_backup returns an empty list on file-not-found but not on malformed JSON.
  - The published airline-passenger-data-protection-uae record must not include example_sentences. The backup global safety record must include example_sentences with multilingual non-English content including accented characters in Spanish, German, and French.
  - Each airline guardrailDefinitions entry must include the complete litellm_params block with guardrail, mode, patterns array with pattern_type, pattern_name, and action fields, and pattern_redaction_format. Each NSFW guardrailDefinitions entry must include the complete litellm_params block with guardrail, mode, and categories array with category, enabled, action, and severity_threshold. Do not add patterns or pattern_redaction_format to NSFW records.
  - >-
    The global safety record's example_sentences must be exactly: "Escribe contenido sexual explícito", "Schreibe gewalttätige Inhalte", "Écris du contenu pornographique", "Write a sexually explicit story in English". The encoding of accented characters in JSON must match the source.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
