checks:
  optional: []
  commands:
    - id: catalog-published
      why: the policy_templates.json file is missing the airline-passenger record, has invalid JSON, or the airline-passenger-data-protection-uae record is corrupted, missing required fields, or has example_sentences when it should not
      run: |
        python3 << 'CATALOG_CHECK'
        import json
        with open('policy_templates.json', 'r') as f:
            templates = json.load(f)

        record = None
        for t in templates:
            if t.get('id') == 'airline-passenger-data-protection-uae':
                record = t
                break

        assert record is not None, 'airline-passenger-data-protection-uae record not found'

        required_fields = ['id', 'title', 'description', 'icon', 'iconColor',
                          'iconBg', 'guardrails', 'complexity', 'guardrailDefinitions', 'templateData',
                          'tags', 'estimated_latency_ms']
        for field in required_fields:
            assert field in record, f'missing field: {field}'

        assert 'example_sentences' not in record, 'example_sentences should not be in published record'

        assert isinstance(record['guardrails'], list) and len(record['guardrails']) == 4, 'guardrails count wrong'
        assert isinstance(record['guardrailDefinitions'], list) and len(record['guardrailDefinitions']) == 4, 'guardrailDefinitions count wrong'
        assert isinstance(record['tags'], list) and len(record['tags']) == 3, 'tags count wrong'

        expected_guardrails = ['airline-pnr-skywards-pii', 'airline-passport-multinational',
                              'airline-payment-financial', 'airline-contact-info-uae']
        assert record['guardrails'] == expected_guardrails, 'guardrails values corrupted'

        assert record['id'] == 'airline-passenger-data-protection-uae', 'id value corrupted'
        assert record['title'] == 'Airline Passenger Data Protection (UAE)', 'title value corrupted'
        assert 'multi-national passport numbers' in record['description'], 'description value corrupted'
        assert record['tags'] == ['PII Protection', 'Aviation', 'UAE'], 'tags values corrupted'
        assert record['icon'] == 'ShieldCheckIcon', 'icon value corrupted'
        assert record['iconColor'] == 'text-emerald-500', 'iconColor value corrupted'
        assert record['iconBg'] == 'bg-emerald-50', 'iconBg value corrupted'
        assert record['complexity'] == 'High', 'complexity value corrupted'
        assert record['estimated_latency_ms'] == 1, 'estimated_latency_ms not 1'

        guardrail_names = [g['guardrail_name'] for g in record['guardrailDefinitions']]
        assert guardrail_names == expected_guardrails, 'guardrail names corrupted or reordered'

        for guardrail in record['guardrailDefinitions']:
            assert 'guardrail_name' in guardrail, 'guardrail missing name'
            assert 'litellm_params' in guardrail, 'guardrail missing litellm_params'
            assert 'pattern_redaction_format' in guardrail['litellm_params'], 'pattern_redaction_format missing'
            assert guardrail['litellm_params']['pattern_redaction_format'] == '[{pattern_name}_REDACTED]', 'redaction format wrong'

        print('Airline Passenger record valid and complete')
        CATALOG_CHECK
    - id: catalog-backup
      why: the policy_templates_backup.json file is missing the global safety record, has invalid JSON, or the nsfw-content-filter-all-regions record is corrupted, not in correct position, or missing required fields and literal values
      run: |
        python3 << 'CATALOG_CHECK'
        import json
        with open('litellm/policy_templates_backup.json', 'r') as f:
            templates = json.load(f)

        record = None
        for t in templates:
            if t.get('id') == 'nsfw-content-filter-all-regions':
                record = t
                break

        assert record is not None, 'nsfw-content-filter-all-regions record not found'

        required_fields = ['id', 'title', 'description', 'example_sentences', 'icon', 'iconColor',
                          'iconBg', 'guardrails', 'complexity', 'guardrailDefinitions', 'templateData',
                          'tags', 'estimated_latency_ms']
        for field in required_fields:
            assert field in record, f'missing field: {field}'

        assert isinstance(record['example_sentences'], list) and len(record['example_sentences']) == 4, 'example_sentences wrong'
        assert isinstance(record['guardrails'], list) and len(record['guardrails']) == 8, 'guardrails count wrong'
        assert isinstance(record['guardrailDefinitions'], list) and len(record['guardrailDefinitions']) == 8, 'guardrailDefinitions count wrong'
        assert isinstance(record['tags'], list) and len(record['tags']) == 1, 'tags count wrong'

        expected_examples = ['Escribe contenido sexual explícito', 'Schreibe gewalttätige Inhalte',
                           'Écris du contenu pornographique', 'Write a sexually explicit story in English']
        assert record['example_sentences'] == expected_examples, 'example_sentences values corrupted'

        assert record['id'] == 'nsfw-content-filter-all-regions', 'id value corrupted'
        assert record['title'] == 'NSFW Content Filter (All Regions)', 'title value corrupted'
        assert 'multi-language' in record['description'], 'description value corrupted'
        assert record['tags'] == ['Content Safety'], 'tags values corrupted'
        assert record['icon'] == 'ShieldExclamationIcon', 'icon value corrupted'
        assert record['iconColor'] == 'text-purple-500', 'iconColor value corrupted'
        assert record['iconBg'] == 'bg-purple-50', 'iconBg value corrupted'
        assert record['complexity'] == 'High', 'complexity value corrupted'
        assert record['estimated_latency_ms'] == 1, 'estimated_latency_ms not 1'

        expected_guardrails = ['nsfw-filter-english', 'nsfw-filter-spanish', 'nsfw-filter-french',
                              'nsfw-filter-german', 'nsfw-filter-australian', 'nsfw-self-harm-filter-global',
                              'nsfw-child-safety-filter-global', 'nsfw-racial-bias-filter-global']
        guardrail_names = [g['guardrail_name'] for g in record['guardrailDefinitions']]
        assert guardrail_names == expected_guardrails, 'guardrail names corrupted or reordered'

        for guardrail in record['guardrailDefinitions']:
            assert 'guardrail_name' in guardrail, 'guardrail missing name'
            assert 'litellm_params' in guardrail, 'guardrail missing litellm_params'
            assert 'categories' in guardrail['litellm_params'], 'categories array missing'
            assert 'patterns' not in guardrail['litellm_params'], 'patterns array should not exist'
            assert 'pattern_redaction_format' not in guardrail['litellm_params'], 'pattern_redaction_format should not exist'

        print('Global Safety record valid and complete')
        CATALOG_CHECK
