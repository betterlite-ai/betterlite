deviations: []
out_of_scope:
  - Code that loads or uses these catalog files. The loading function _load_policy_templates_from_local_backup is covered by B3252 which depends on this task. The route that uses the fallback (get_policy_templates) is covered by B3253.
  - Guardrail implementations or pattern definitions referenced by these templates. The records only define policy patterns and metadata.
  - Other policy templates in either file. Those are owned by other catalog tasks.
pitfalls:
  - Both files must be valid JSON. Any syntax errors prevent loading by _load_policy_templates_from_local_backup, which returns an empty list on file-not-found but not on malformed JSON.
  - The published airline-passenger-data-protection-uae record must not include example_sentences. The backup global safety record must include example_sentences with multilingual non-English content including accented characters in Spanish, German, and French.
  - Each airline guardrailDefinitions entry must include the complete litellm_params block with guardrail, mode, patterns array with pattern_type, pattern_name, and action fields, and pattern_redaction_format. Each NSFW guardrailDefinitions entry must include the complete litellm_params block with guardrail, mode, and categories array with category, enabled, action, and severity_threshold. Do not add patterns or pattern_redaction_format to NSFW records.
  - >-
    The global safety record's example_sentences must be exactly: "Escribe contenido sexual explícito", "Schreibe gewalttätige Inhalte", "Écris du contenu pornographique", "Write a sexually explicit story in English". The encoding of accented characters in JSON must match the source.
