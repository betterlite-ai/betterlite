oracle_cases: []

deviations:
  - what: The separate metrics listener has no authentication middleware, unlike the main
      port /metrics endpoint which requires the master key by default.
    why: The metrics listener is designed to aggregate worker samples without contention,
      and exposing it to the network is a deployment choice, not a gateway security boundary.
      Deploy network policy or a firewall if the metrics endpoint should not be public.
  - what: An external PROMETHEUS_MULTIPROC_DIR that cannot be consumed (e.g., permission denied
      or invalid format) is an explicit startup error, not a warning or fallback.
    why: Failing silently would cause metrics to be lost or duplicated, with no visibility
      into the broken configuration. A loud error at startup is the right behavior.
  - what: The metrics server subprocess uses the same HTTPHandler.get polling as the main
      gateway, with a 1-second timeout and 0.1-second poll interval.
    why: Match LiteLLM's simple sync polling instead of waiting for the async runtime.

out_of_scope:
  - Multiprocess collector internals and .db file format. That is prometheus_client's responsibility.
  - Gunicorn worker hooks or uvicorn configuration. Those are caller responsibilities.
  - Hot reload of PROMETHEUS_MULTIPROC_DIR. Changing it at runtime requires a restart.
  - Metrics aggregation strategy or deduplication. MultiProcessCollector handles that.
  - Oracle cases for the separate metrics listener endpoints. The oracle harness cannot spawn a second process or probe a second port; listener-tests exercises the separate listener directly as a subprocess.

pitfalls:
  - wipe_directory logs a warning for each file it cannot delete but continues; do not
    raise or abort on individual failures.
  - mark_dead_workers uses glob.glob to find gauge_live*_*.db files; an empty multiproc_dir
    returns an empty list, not an error.
  - _is_running uses os.kill(pid, 0) which is POSIX-only; on Windows, PermissionError means
    the process exists. Treat both success and PermissionError as running.
  - metrics_url must handle IPv6 addresses with colons by wrapping them in brackets,
    e.g., [::1]:9090, so the result parses as a valid URL.
  - _wait_until_serving must check both process.poll() (exit code) and _answered_by (ready
    on port), and give up cleanly with process.terminate() if either fails.
  - The subprocess receives no stdin, stdout or stderr redirection; uvicorn writes logs to
    the proxy's stderr. Do not assume it is silent.
  - The parent-exit watchdog must use os.getppid() not a stored parent PID, since the proxy
    process can be reparented.

