id: B3887
title: Prometheus dedicated listener and worker cleanup
description: >-
  Build a separate metrics listener that aggregates per-worker Prometheus samples
  in a subprocess so large scrapes do not block inference tasks. The listener runs
  on a configurable port, answers /metrics with no auth (unlike the main port), and
  exposes its process ID in the x-litellm-metrics-pid response header so clients
  can detect a process restart.

  When PROMETHEUS_MULTIPROC_DIR is set, wipe all .db files at startup so workers
  start with a clean slate. After each worker dies (via gunicorn child_exit hook or
  uvicorn replacement), mark it as dead so its live-gauge series are dropped from
  the aggregate; a replacement worker calls mark_dead_workers at startup to clean
  up crashed workers without exit hooks.

  The metrics server is a subprocess that runs the separate listener. start_metrics_server_process
  spawns it with sys.executable -m litellm.proxy.prometheus_metrics_server,
  waits up to 30 seconds for it to answer on its port, and raises MetricsServerStartupError
  if startup fails or the port is already in use. The subprocess runs _exit_when_parent_dies
  in a daemon thread so it exits when the proxy dies.

  Owned ranges are prometheus_cleanup.py (cleanup utilities), prometheus_metrics_server.py
  (app builder, subprocess launcher and CLI), tested by cleanup-tests and listener-tests cargo tests.

