id: B3965
title: Galileo callback records and queue admission
description: >-
  Build Galileo success-event callback handling with record construction, queue admission and batch-threshold
  triggering. Convert successful callbacks to Galileo LLMResponse records with latency and token normalization.
  Use standard_logging_object startTime/endTime when present, fall back to callback start_time/end_time
  parameters as naive datetimes (applying local timezone before UTC conversion). Normalize token counts from
  standard_logging_object with zero-fallback, computing total_tokens when missing. Construct LLMResponse
  records with required fields (latency_ms, status_code, input_text, output_text, node_type, model,
  num_input_tokens, num_output_tokens, num_total_tokens, created_at) and optional cost field, using
  B3963's _get_galileo_input_output_content for input/output extraction.

  Enforce the 1,000-record drop-oldest cap (GALILEO_MAX_IN_MEMORY_RECORDS) by removing oldest records and
  logging a warning when exceeded. Trigger flush_in_memory_records when in_memory_records length reaches or
  exceeds batch_size (default 1). Skip callback processing when not configured or when standard_logging_object
  is missing; return silently without queueing a record. The failure callback remains diagnostic-only: log at
  debug level and return without queueing or calling flush. Queue lifecycle is caller-owned: success callback
  appends and triggers flushes; delivery layer (B3964) removes the flushed prefix on success and retains the
  buffer on failure.
scope:
