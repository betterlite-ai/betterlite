deviations: []
out_of_scope:
- Payload projection and content extraction; owned by B3963.
- Authentication, health checking and buffered delivery; owned by B3964.
- Configuration and environment variable loading beyond standard_logging_object and time parameters.
- HTTP pooling and request execution.
- Callback registration and lifecycle management.
- Timer installation and flush scheduling.
pitfalls:
- >-
  The standard_logging_object time path uses Unix timestamps (float seconds); fallback path uses datetime
  objects with naive datetime handling requiring local timezone conversion before UTC.
- >-
  Token count zero-fallback requires checking individual counts and summing them only when total_tokens is
  zero or missing.
- >-
  Buffer bounding must remove oldest records (by slice) and emit the warning with dropped count and advice;
  the GALILEO_MAX_IN_MEMORY_RECORDS constant is 1000.
- >-
  Batch triggering compares in_memory_records length to batch_size after appending; default batch_size is 1
  so every record triggers on initial append.
- >-
  The failure callback is diagnostic-only; it logs at debug level and must not queue records or trigger flush.
- >-
  Exception handling in async_log_success_event must catch all exceptions and log at exception level, then
  return silently without propagating.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
