dod:
- text: Implement async_log_success_event and _async_log_success_event_impl entry points, with exception
    handling that logs unexpected errors at exception level and returns silently.
  proof:
  - admission-control-tests
  - oracle
- text: Check _is_configured before processing; skip silently if not configured. Require standard_logging_object;
    skip silently if missing.
  proof:
  - admission-control-tests
  - oracle
- text: Use standard_logging_object startTime/endTime when both are present (as Unix timestamps); fall back
    to start_time/end_time parameters (as datetime objects) when missing. For fallback path, apply local
    timezone to naive datetimes, then convert to UTC.
  proof:
  - admission-control-tests
- text: Normalize token counts from standard_logging_object (prompt_tokens, completion_tokens, total_tokens)
    with zero-fallback and compute total_tokens from sum when total is zero but components are present.
  proof:
  - admission-control-tests
- text: Construct LLMResponse record with required fields (latency_ms, status_code, input_text, output_text,
    node_type, model, num_input_tokens, num_output_tokens, num_total_tokens, created_at), optional cost
    field, and optional messages field when present in kwargs.
  proof:
  - admission-control-tests
  - oracle
- text: Append record to in_memory_records. Enforce 1,000-record cap by removing oldest records when exceeded,
    log a warning naming the dropped count and advising to check connectivity/credentials.
  proof:
  - admission-control-tests
- text: Trigger flush_in_memory_records when in_memory_records length reaches or exceeds batch_size (default 1).
  proof:
  - admission-control-tests
  - oracle
- text: >-
    Implement async_log_failure_event as diagnostic-only (log at debug level and return without queueing
    or calling flush).
  proof:
  - admission-control-tests
- text: Every oracle case exercises success/failure callback paths with standard-payload time availability,
    fallback time handling, token normalization, buffer bounding and batch triggering.
  proof:
  - galileo-admission-cases
