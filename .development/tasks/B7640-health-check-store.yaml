  paths:
    - crates/betterlite-server/src/health_persistence.rs
    - crates/betterlite-server/src/health_persistence/**
    - crates/betterlite-db/src/health_check_rows.rs
    - crates/betterlite-db/src/health_check_rows/**
    - tools/oracle/cases/helpers/health-persistence/**
    - "tools/oracle/fuzz/corpus/helper_case/health_persistence-*"
    - tools/oracle/helpers/b7640.py
    - tools/oracle/helpers/b7640/**
    - tools/oracle/src/helpers/server/b7640.rs
    - tools/oracle/src/helpers/server/b7640/**
  lint_tables: false

