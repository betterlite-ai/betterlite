id: B7640
title: Health check table store and changed-result persistence
description: >-
  Build the database half of LiteLLM's model health history and the logic that decides which cycle results get written.
  Two modules: `health_check_rows` in betterlite-db (the table store) and `health_persistence` in betterlite-server
  (aggregate, compare, write). B4445 builds the routes and the live /health writer on top of both. Nothing here
  registers a route.

  Store, `health_check_rows` in betterlite-db. It wraps B700's `PostgresStore` and reads and writes the table
  "LiteLLM_HealthCheckTable" (B703 created it, B706 added the per-model index). `HealthCheckRow` holds the 13 columns:
  health_check_id String, model_name String, model_id Option<String>, status String, healthy_count i32, unhealthy_count i32,
  error_message Option<String>, response_time_ms Option<f64>, details Option<serde_json::Value>, checked_by Option<String>,
  checked_at, created_at and updated_at as chrono DateTime<Utc>. The columns are `timestamp without time zone`, so read them
  as naive values and treat them as UTC (LiteLLM's `_assume_utc`). If `details` comes back as a JSON string, parse that
  string as JSON and use the result (LiteLLM's `_decode_json_text`); a string that is not valid JSON fails the whole read.
  `HealthCheckRowsError` is the module's error enum and keeps the driver error as its source. `HealthCheckRows` is built
  with a `PostgresStore`. Its methods:
  `query_latest() -> Result<Vec<HealthCheckRow>, HealthCheckRowsError>` runs LATEST_HEALTH_CHECKS_SQL and returns the error.
  `fetch_latest() -> Vec<HealthCheckRow>` calls it and, on any error, logs at error level "Error getting all latest health
  checks: {err}" and returns an empty list. `fetch_latest_for_models(model_names: &[String]) -> Vec<HealthCheckRow>` returns an
  empty list at once for an empty slice, otherwise runs LATEST_HEALTH_CHECKS_FOR_MODELS_SQL with the names bound as one text
  array and on error logs "Error getting latest health checks for models: {err}" and returns an empty list. Copy both SQL
  strings from health_check_latest.py exactly: `SELECT DISTINCT ON ("model_id", "model_name")` ordered by model_id ASC,
  model_name ASC, checked_at DESC, the second with `WHERE "model_name" = ANY($1)`. The result order is the SQL order.
  `history(model_name: Option<&str>, status_filter: Option<&str>, limit: i64, offset: i64) -> Vec<HealthCheckRow>` is
  PrismaClient.get_health_check_history: a falsy (None or empty) filter is dropped, the rest are equality filters on
  model_name and status joined with AND, ordered by checked_at DESC, with LIMIT and OFFSET. On any error it logs "Error getting
  health check history: {err}" and returns an empty list. `save_result(NewHealthCheck) -> Option<HealthCheckRow>` is
  PrismaClient.save_health_check_result: it inserts one row and returns it, and on any error logs "Error saving health check
  result for model {model_name}: {err}" at error level and returns None. `NewHealthCheck` has model_name, status,
  healthy_count, unhealthy_count, error_message, response_time_ms, checked_by and model_id. The row id is a fresh UUID v4 string
  made by the caller side of the store (an injected id source, not a global). error_message is stored only when non-empty and is
  cut to its first 500 characters. checked_by and model_id are stored only when non-empty. response_time_ms is stored only when
  it is a finite number (NaN and infinity become NULL, with no warning). `details` is never written: both callers in LiteLLM
  pass None, so the column stays NULL and `_clean_details` is not built.

  Persistence, `health_persistence` in betterlite-server. Inputs are the deployment list the cycle ran on and the cycle's
  endpoint results. Read crates/betterlite-server/src/health_cycle.rs (B4443) for the healthy and unhealthy endpoint record
  types and use them; this task adds no second endpoint type. It only reads two things from an endpoint: `model` (the
  litellm_params.model string, may be absent) and, for unhealthy ones, `error` (any value, stringified). Deployments come from
  B401's Deployment type: model_name, model_info.id and litellm_params.model.
  `model_param_index(deployments) -> ModelParamIndex` is `_build_model_param_to_info_mapping`: a map from the litellm_params.model
  string to a list of (model_name, model_id) in list order. A deployment with an empty or missing model string or an empty
  model_name is skipped. model_id is None when model_info has no id.
  `aggregate_results(index, healthy, unhealthy) -> Vec<AggregatedHealthResult>` is `_aggregate_health_check_results`. The key is
  (model_id, model_name). For each healthy endpoint whose `model` is in the index, every (model_name, model_id) listed for that
  string gets healthy_count + 1. Then, for each unhealthy endpoint whose `model` is in the index, every listed model gets
  unhealthy_count + 1, and error_message is set to the first non-empty error seen for that key, stringified and cut to 500
  characters. The result keeps first-insertion order (healthy pass first, then new keys from the unhealthy pass). An endpoint
  with no `model`, or a model not in the index, counts for nobody. Entries start at 0, 0 and no error.
  `new_status(result)` is "healthy" when healthy_count > 0 else "unhealthy".
  `should_persist(result, latest_by_key, now) -> bool` is `_should_persist_health_check_result`. The lookup key is model_id when
  it is non-empty, else model_name. It is true when there is no previous row, when the previous row's status differs from
  `new_status`, or when `now - checked_at` is 3600 seconds or more (the comparison is >=). `now` comes from an injected clock.
  `save_changed(rows, results, latest_by_key, start_time, checked_by) -> bool` is `_save_health_check_results_if_changed`. It
  first picks the results that need writing, then builds one `save_result` call per pick (response_time_ms is the clock now minus
  `start_time`, in milliseconds, taken once per pick as the calls are built), then awaits all of them together. It returns true
  when every call returned a row, and also true when nothing needed writing; one None makes it false. The other writes still
  happen.
  `save_background(rows: Option<&HealthCheckRows>, deployments, healthy, unhealthy, start_time, checked_by) -> bool` is
  `_save_background_health_checks_to_db`. With no store it returns false. Otherwise: build the index, aggregate, call
  `query_latest` (the erroring form, not `fetch_latest`), build the latest map (key = model_id if non-empty else model_name; the
  first row for a key wins), then `save_changed`. Any error in those steps logs at warning level "Failed to save background
  health checks to database: {err}" and returns false; it never fails the caller.
  `save_single(rows, model_name, healthy, unhealthy, start_time, user_id, model_id)` is `_save_health_check_to_db`, used by
  B4445's /health route: status is "healthy" when the healthy list is non-empty, counts are the list lengths, error_message is the
  stringified `error` of the first unhealthy endpoint when it has a non-empty one (cut to 500 characters), response_time_ms is
  clock now minus start_time in milliseconds, checked_by is user_id. It calls `save_result` once and ignores the returned row.

  The caller that runs `save_background` after a cycle (the window gate and the pod lock in proxy_server.py) is not part of this
  task. The functions take their clock and id source by constructor injection and read no environment variable.

  Tests. Store tests live in `health_check_rows::tests` and use B860's Postgres fixture (POSTGRES_TEST_URL, else testcontainers)
  in a unique schema with the real table DDL from B703 and B706. Name prefixes: `latest_` (one row per model_id and model_name
  pair, newest wins, model_id NULL pairs, naive timestamps read as UTC, details string decoded), `models_` (the name filter and the
  empty slice), `save_` (truncation, empty-string fields stored as NULL, non-finite time stored as NULL, failure returns None),
  `history_` (filters, order, limit, offset). Persistence tests live in `health_persistence::tests` with prefixes `index_`,
  `aggregate_`, `decision_` (should_persist), `changed_` (save_changed with a recording fake store) and `background_`
  (save_background with a fake store, including the failure paths). The oracle helper cases drive Python's pure functions
  (`_build_model_param_to_info_mapping`, `_aggregate_health_check_results`, `_new_health_status`,
  `_should_persist_health_check_result`, `PrismaClient._validate_response_time`) with fixed inputs. The Python adapter replaces
  the `datetime` name in _health_endpoints.py with a subclass whose `now` returns the case's fixed time.

