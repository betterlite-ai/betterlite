dod:
  - text: query_latest and fetch_latest return one row per (model_id, model_name) pair with the newest checked_at, in the SQL order, with naive timestamps read as UTC and a JSON-string details column decoded.
    proof: [latest-tests]
  - text: fetch_latest and fetch_latest_for_models return an empty list and log the exact message on a driver error, and the for-models form returns an empty list for an empty slice and filters by name otherwise.
    proof: [latest-tests, models-tests]
  - text: save_result stores the 500-character error cut, stores empty strings and non-finite times as NULL, leaves details NULL, sets updated_at, and returns None with the logged message when the insert fails.
    proof: [save-tests]
  - text: history filters by non-empty model_name and status, orders newest first and honours limit and offset.
    proof: [history-tests]
  - text: The model index skips deployments without a model string or model_name, and aggregation counts each endpoint for every model listed under its model string, in the LiteLLM insertion order, with the first non-empty error cut to 500 characters.
    proof: [index-tests, aggregate-tests, oracle, helper-python]
  - text: should_persist is true for no previous row, a changed status, or an age of 3600 seconds or more, and false otherwise, using model_id before model_name as the lookup key.
    proof: [decision-tests, oracle, helper-python]
  - text: save_changed writes only the picked results, awaits them together, and returns false when any write returns nothing while the other writes still happen.
    proof: [changed-tests]
  - text: save_background returns false without a store, reads the erroring latest query, uses the first row per key, and returns false with the warning instead of failing when any step errors.
    proof: [background-tests]
  - text: save_single derives status, counts and the first error from the endpoint lists and writes one row.
    proof: [single-tests]
  - text: Helper corpus cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: latest-tests
      why: the latest-per-model read, UTC handling, details decoding or the error-to-empty result is missing
      run: >-
        cargo nextest run --locked -p betterlite-db --no-tests=fail
        -E 'test(/^health_check_rows::tests::latest_/)'
    - id: models-tests
      why: the name-filtered latest read or its empty-slice shortcut is missing
      run: >-
        cargo nextest run --locked -p betterlite-db --no-tests=fail
        -E 'test(/^health_check_rows::tests::models_/)'
    - id: save-tests
      why: the row insert, its field rules or its failure result is missing
      run: >-
        cargo nextest run --locked -p betterlite-db --no-tests=fail
        -E 'test(/^health_check_rows::tests::save_/)'
    - id: history-tests
      why: history filters, order or paging are missing
      run: >-
        cargo nextest run --locked -p betterlite-db --no-tests=fail
        -E 'test(/^health_check_rows::tests::history_/)'
    - id: index-tests
      why: the model-param index is missing or keeps skipped deployments
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_persistence::tests::index_/)'
    - id: aggregate-tests
      why: per-model counts, key order or the error rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_persistence::tests::aggregate_/)'
    - id: decision-tests
      why: the status-change or one-hour persist rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_persistence::tests::decision_/)'
    - id: changed-tests
      why: the picked writes, the joint await or the all-succeeded result is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_persistence::tests::changed_/)'
    - id: background-tests
      why: the background entry point, its latest map or its never-raise handling is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_persistence::tests::background_/)'
    - id: single-tests
      why: the single-model writer is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_persistence::tests::single_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b7640)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b7640 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b7640/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added persistence cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/health_persistence-*")" &&
        grep -lE '^[[:space:]]+b7640:' tools/oracle/fuzz/corpus/helper_case/health_persistence-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/health-persistence/model-param-index.yaml
  - tools/oracle/cases/helpers/health-persistence/aggregate-results.yaml
  - tools/oracle/cases/helpers/health-persistence/persist-decision.yaml
  - tools/oracle/cases/helpers/health-persistence/response-time.yaml

deviations:
  - what: The `details` argument of save_health_check_result and _clean_details are not built.
    why: Both callers pass details=None, so the column is always NULL and the code has no caller at the pin.
  - what: Timestamps come back as UTC values from naive columns, with no Prisma client in between.
    why: The native driver has no Prisma adapter; the stored values and the UTC rule are the same as LiteLLM's.
  - what: The aggregate and persist functions take typed endpoint records and deployments, not Python dicts.
    why: Rust has no untyped dict; the fields read are the same ones LiteLLM reads.

out_of_scope:
  - "The routes /health, /health/history and /health/latest, _perform_health_check_and_save, _convert_health_check_to_dict, _check_prisma_client and _health_endpoint_resolve_target_model_name: B4445."
  - "perform_health_check and the endpoint record types: B4443. The window gate, pod lock and fire-and-forget scheduling in _schedule_background_health_check_db_save: B4444 and the proxy_server owner (B124)."
  - "The HealthCheckRepository table binding in table_repositories.py: B726. This task writes plain statements through PostgresStore."
  - "Prisma client lifecycle, reconnect and every other PrismaClient method in utils.py: B124 parts. The health methods L6893-L6990 are built here, since nothing else calls them; B124 must not plan them again."

pitfalls:
  - "`updated_at` has no database default (Prisma fills it on create), so the insert must set it, or it fails with a NOT NULL error."
  - "The persist decision compares >= 3600 seconds, not > 3600, and a status change writes at once however young the previous row is."
  - "The lookup key is model_id only when it is non-empty; a row or result with model_id \"\" falls back to model_name."
  - "One endpoint can feed several models: a litellm_params.model string shared by two deployments counts for both, with each model's own name and id."
  - "save_background must use the erroring query_latest. The fetch_latest form hides the error and the 'Failed to save background health checks' warning would never fire."
  - "error_message in aggregation takes the first non-empty error for the key, but unhealthy_count still goes up for every unhealthy endpoint."
  - "A model_id that is absent and a model_id that is None are the same key part; (None, name) and (id, name) are different keys."
  - "Writes in save_changed are built before any is awaited, so every response_time_ms measures from start_time to the build moment, not to its own finish."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
