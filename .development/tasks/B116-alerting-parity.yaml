  - tools/oracle/cases/alerting/composed/slack-no-key.yaml
  - tools/oracle/cases/alerting/composed/slack-disabled.yaml
  - tools/oracle/cases/alerting/composed/slack-budget-alias-disabled.yaml
  - tools/oracle/cases/alerting/composed/slack-missing-url.yaml
  - tools/oracle/cases/alerting/composed/slack-empty-map.yaml
  - tools/oracle/cases/alerting/composed/slack-inactive-map.yaml
  - tools/oracle/cases/alerting/composed/slack-daily-string.yaml
  - tools/oracle/cases/alerting/composed/slack-daily-list.yaml
  - tools/oracle/cases/alerting/composed/slack-batch-rejection.yaml
  - tools/oracle/cases/alerting/composed/teams-daily-card.yaml
  - tools/oracle/cases/alerting/composed/teams-disabled.yaml
  - tools/oracle/cases/alerting/composed/slack-digest-admission.yaml
  - tools/oracle/cases/alerting/composed/webhook-budget.yaml
  - tools/oracle/cases/alerting/composed/webhook-missing-url.yaml
  - tools/oracle/cases/alerting/composed/webhook-budget-filtered.yaml
  - tools/oracle/cases/alerting/composed/email-disabled.yaml
  - tools/oracle/cases/alerting/composed/email-missing-sender.yaml
  - tools/oracle/cases/alerting/composed/settings-configured.yaml
  - tools/oracle/cases/alerting/composed/pagerduty-noop.yaml
deviations: []
out_of_scope:
  - "email_footer.py, key_created_email.py, key_rotated_email.py and user_invitation_email.py contain constants, not functions, and have no open-source caller at the pin; only enterprise email implementations use this template family, so no renderer or cases are built for it."
  - "pagerduty.py's LinkDict, ImageDict, PagerDutyPayload, PagerDutyRequestBody, AlertingConfig and PagerDutyInternalEvent are Python public types owned by B7939; no open-source PagerDuty transport consumes them, and B8741 owns the no-op logger fallback."
  - "Within slack_alerting.py, B8890 supplies __init__ and update_values, B4020 supplies _all_possible_alert_types, and B4021 supplies _ensure_periodic_flush_task, send_webhook_alert, _enqueue_ms_teams_alert, async_send_batch, _flush_digest_buckets and periodic_flush."
  - "The same class delegates _check_if_using_premium_email_feature and send_email_alert_using_smtp to B4022, _construct_user_invitation_link and send_key_created_or_user_invited_email to B4023, and send_alert to B4024; B8891 only binds their production dependencies."
  - "B4025 implements failed_tracking_alert, budget_alerts, _get_event_and_event_message, _get_percent_of_max_budget_left, _get_user_info_str and customer_spend_alert; B4026 implements _prepare_outage_value_for_cache, _restore_outage_value_from_cache, _count_outage_alerts, _outage_alert_msg_factory, region_outage_alerts and outage_alerts."
  - "B4027 owns _response_taking_too_long_callback_helper, _get_deployment_latencies_to_alert, response_taking_too_long_callback and response_taking_too_long; B4028 owns async_update_daily_reports, send_daily_reports, async_log_success_event, _run_scheduler_helper and _run_scheduled_daily_report, with B8656's async_log_failure_event and success-event composition and B8891's logger binding."
  - "B4029 builds send_weekly_spend_report, send_monthly_spend_report and send_user_spend_alerts; B4030 builds model_added_alert, _deprecation_alerts_enabled, send_model_deprecation_alert, _claimed_deprecation_alert_window, _deprecation_alert_sent_within_a_day, _run_deprecation_alert_pass, run_scheduled_deprecation_check, send_fallback_stats_from_prometheus and send_virtual_key_event_slack, replacing _proxy_llm_router with its injected getter."
  - "No caller at the pin reaches deployment_in_cooldown, deployment_removed_from_cooldown, model_removed_alert or _request_is_completed; their empty/unused implementations add no remainder."
  - "B8399 retains ProxyLogging and its registration/startup policies; B8656 retains outage/spend ports, B8372 retains scheduler registration, B8540/B8675 retain all health/admin mounts, and B8610 retains application composition."
  - "B898 schedules key-created email, B797 schedules invitation email and creates invitations, B1228 maps management events to B4030, and B069 calls B4025 customer_spend_alert; their old B116 mentions do not transfer those implementations here."
pitfalls:
  - "The HTTP oracle compares upstream bodies directly, so use daily_reports for timestamp-free positive Slack/Teams captures instead of ignoring all alert text."
  - "The per-type digest window is alert_type_config.daily_reports.digest_interval, independently of the global alerting_args.digest_interval fallback."
  - "Setting a per-type Slack URL to [] still admits Teams before the empty Slack enqueue and gives a deterministic single-card capture."
  - "The webhook service probe answers JSON null on success, while the email probe answers success even when its producer returns false."
  - "Configuring email alone does not create the enterprise budget-email logger; legacy budget mail is reachable through send_alert when its Slack/Teams/webhook caller runs."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
