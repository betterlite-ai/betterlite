id: B3332
title: Video provider selection
description: >-
  Implement the video-specific closed provider selection in betterlite-core (api::video_selection, beside its callers B3338 to B3342; betterlite-core already depends on betterlite-provider, so the selector can't live there and reach the Runway and Fal configs in betterlite-core), retaining
  the model-sensitive hosted-vLLM selection seam and the unsupported-provider None outcome.
  Build a function in the ProviderConfigManager that maps each provider enum member to its
  corresponding video operation contract, returning None for providers without a video
  implementation at this pin. This task owns the whole selector function. RUNWAYML takes B1537's Runway video config, FAL_AI B1532's Fal config, HOSTED_VLLM B8151's model-sensitive hosted vLLM selection and EDENAI B5838's Eden AI video config.


  Owned function: litellm/utils.py:9690-9725, ProviderConfigManager.get_provider_video_config.
  This function selects among OPENAI, AZURE, GEMINI, VERTEX_AI, RUNWAYML, FAL_AI, HOSTED_VLLM
  and EDENAI, returning their typed video operation contracts or None.


  Direct dependencies with existing task files: B3331 supplies the selected BaseVideoConfig
  type and async fallback trait; B525 owns OpenAI video config and is the concrete
  provider constructor/operation owner; B547 owns Azure video config constructor and URL
  generation; B1361 owns Vertex video config constructor; B1363 owns Gemini video config
  constructor. These are concrete constructor owners, not provider umbrellas. RunwayML is B1537, Fal is B1532, hosted vLLM is B8151 and Eden AI is B5838.


scope:
  paths:
    - crates/betterlite-core/src/api/video_selection.rs
    - crates/betterlite-core/src/api/video_selection/**
    - crates/betterlite-core/Cargo.toml
  lint_tables: false

references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9690-L9725
    why: Video provider selector. Own this function exactly; match all eight branches and
      the None fallback, preserving the call pattern for hosted-vLLM's model parameter.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/videos/transformation.py#L1-L30
    why: BaseVideoConfig base type that concrete selectors return; imported and re-exported
      by B3331.

dod:
  - text: "get_provider_video_config takes a model name (String or None) and a Provider enum
      member, and returns the correct typed video operation contract or None."
    proof: [selector-function-exists]
  - text: "Selecting OPENAI returns OpenAI's video config from B525; the call is delegated
      to that concrete constructor."
    proof: [openai-branch]
  - text: "Selecting AZURE returns Azure's video config from B547; the call is delegated
      to that concrete constructor."
    proof: [azure-branch]
  - text: "Selecting GEMINI returns Gemini's video config from B1363; the call is delegated
      to that concrete constructor."
    proof: [gemini-branch]
  - text: "Selecting VERTEX_AI returns Vertex's video config from B1361; the call is delegated
      to that concrete constructor."
    proof: [vertex-branch]
  - text: "Selecting RUNWAYML, FAL_AI, HOSTED_VLLM or EDENAI returns the video config that B1537, B1532, B8151 or B5838 builds; hosted vLLM picks its config from the model the way get_hosted_vllm_video_config does."
    proof: [leaf-branches]
  - text: "The function signature matches LiteLLM's contract: it takes an optional model
      parameter (used only for HOSTED_VLLM) and a provider identifier."
    proof: [signature-match]
  - text: "All eight provider branches, the None fallback and error cases are reachable."
    proof: [branch-coverage]

checks:
  optional: []
  commands:
    - id: selector-function-exists
      why: The provider selector function is not defined or does not match the signature
      run: grep -q 'fn get_provider_video_config' crates/betterlite-core/src/api/video_selection.rs
    - id: openai-branch
      why: OpenAI branch is missing or does not delegate to B525
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_selection::(openai|provider_selection)/)'
    - id: azure-branch
      why: Azure branch is missing or does not delegate to B547
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_selection::(azure|provider_selection)/)'
    - id: gemini-branch
      why: Gemini branch is missing or does not delegate to B1363
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_selection::(gemini|provider_selection)/)'
    - id: vertex-branch
      why: Vertex branch is missing or does not delegate to B1361
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_selection::(vertex|provider_selection)/)'
    - id: leaf-branches
      why: RunwayML, Fal, hosted vLLM or Eden AI does not return its leaf video config
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_selection::(runway|fal|hosted_vllm|edenai)/)'
    - id: signature-match
      why: Function signature does not match LiteLLM contract
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_selection::signature/)'
    - id: branch-coverage
      why: Not all eight provider branches and fallback are reachable
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_selection::branch_coverage/)'

oracle_cases: []

deviations: []

out_of_scope:
  - "B525 owns OpenAI video config constructor (__init__) and all OpenAI video operation
    transforms; reuse its public implementation."
  - "B547 owns Azure video config constructor and URL generation; reuse its public
    implementation."
  - "B1361 owns Vertex video config constructor; reuse its public implementation."
  - "B1363 owns Gemini video config constructor; reuse its public implementation."
  - "B3331 defines BaseVideoConfig and the trait this selector returns; do not duplicate
    the type."
  - "Provider dispatches and routing logic at higher layers remain outside this selector;
    the selector only maps names to constructors."

pitfalls:
  - "The hosted-vLLM branch passes the model parameter to get_hosted_vllm_video_config;
    other branches ignore it."
  - "LiteLLM's EDENAI branch constructs litellm.EdenAIVideoConfig() directly; the Rust
    equivalent must invoke the matching concrete constructor when its task arrives."
  - "The None fallback in LiteLLM is reached when no branch matches; preserve this
    behavior for truly unknown providers, distinct from unimplemented known ones."
  - "Matching on the Provider enum must be exhaustive; the Rust compiler will reject
    any unreachable pattern."

budget:
  max_changed_lines: 1500
  max_new_expects: 0

review_level: standard
