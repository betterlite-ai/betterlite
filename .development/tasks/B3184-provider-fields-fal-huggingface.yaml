id: B3184
title: Provider form catalog from Fal AI through Hugging Face
description: >-
  Create the ordered catalog fragment for the public provider form endpoint, covering thirteen provider definitions from FalAI through HUGGINGFACE.
  FalAI's flux image generation model identifier and GigaChat's scope selection mechanism are distinct to this range, alongside generic two-field and single-field credential patterns used by nine other providers in the interval.
  Preserve every credential field name, label, placeholder, tooltip, required flag, field_type, options and default_value exactly as LiteLLM defines them at the pinned commit.
  Include FalAI's distinctive model placeholder for flux image generation, GigaChat's five credential fields with scope selection and OAuth tooltip, Google AI Studio's versioned API guidance, and GradientAI's custom endpoint/key labels.
  Store this fragment in its own asset path crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json; parallel workers do not rewrite this isolated fragment and B3190 later assembles all fragments in the pinned source order.
scope:
  paths:
    - crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/provider_create_fields.json#L1426-L1793
    why: The complete provider record definitions for FalAI through HUGGINGFACE with their credential fields, labels, tooltips and default model placeholders, including GigaChat's scope field and Google AI Studio's API version guidance.
dod:
  - text: All thirteen provider records (FalAI through HUGGINGFACE) match LiteLLM's exact data at the pinned commit, with every field including litellm_provider, provider_display_name, default_model_placeholder and all credential field properties preserved precisely for every provider.
    proof: [provider-records-deep-equality, provider-litellm-display-names]
  - text: Each of the thirteen providers has the correct litellm_provider identifier and provider_display_name as defined in LiteLLM.
    proof: [provider-litellm-display-names]
  - text: FalAI preserves its distinctive model placeholder "fal_ai/fal-ai/flux-pro/v1.1-ultra" for flux image generation, not a generic chat model name.
    proof: [falai-flux-placeholder]
  - text: GigaChat has exactly five credential fields in order (api_base, api_key, gigachat_scope, gigachat_auth_url, gigachat_access_token) with scope as a select field and access_token including its OAuth tooltip.
    proof: [gigachat-five-fields]
  - text: GigaChat's scope field includes the three options "GIGACHAT_API_PERS", "GIGACHAT_API_B2B", "GIGACHAT_API_CORP" with "GIGACHAT_API_PERS" as the default_value.
    proof: [gigachat-scope-options]
  - text: Google AI Studio's api_base field includes the full tooltip about v1alpha for Gemini 3+ models, version prefix guidance, and LiteLLM's automatic selection behavior.
    proof: [google-ai-api-version-guidance]
  - text: GradientAI's custom labels are "GradientAI Endpoint" and "GradientAI API Key" (not generic "API Base" and "API Key"), with api_base placeholder "https://..." and api_key required.
    proof: [gradient-ai-custom-labels]
  - text: FireworksAI, Groq and all other single-field providers have field_type, label, required and placeholder preserved exactly from LiteLLM.
    proof: [remaining-providers-exact-fields]
  - text: All thirteen providers preserve the exact field order, with credentials appearing in their LiteLLM order and never reordered.
    proof: [provider-field-order-all-thirteen]
  - text: The JSON file is a JSON array of thirteen provider records in the expected order.
    proof: [provider-json-parses]
checks:
  optional: []
  commands:
    - id: provider-records-deep-equality
      why: the provider records differ from LiteLLM in any field including litellm_provider, provider_display_name, or default_model_placeholder
      run: |
        jq -e 'all(has("credential_fields")) and map({provider, litellm_provider, provider_display_name, default_model_placeholder}) == [
          {"provider": "FalAI", "litellm_provider": "fal_ai", "provider_display_name": "Fal AI", "default_model_placeholder": "fal_ai/fal-ai/flux-pro/v1.1-ultra"},
          {"provider": "FEATHERLESS_AI", "litellm_provider": "featherless_ai", "provider_display_name": "Featherless Ai", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "FireworksAI", "litellm_provider": "fireworks_ai", "provider_display_name": "Fireworks AI", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "FRIENDLIAI", "litellm_provider": "friendliai", "provider_display_name": "Friendliai", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "GALADRIEL", "litellm_provider": "galadriel", "provider_display_name": "Galadriel", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "GIGACHAT", "litellm_provider": "gigachat", "provider_display_name": "GigaChat", "default_model_placeholder": "GigaChat-2"},
          {"provider": "GITHUB", "litellm_provider": "github", "provider_display_name": "Github", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "GITHUB_COPILOT", "litellm_provider": "github_copilot", "provider_display_name": "Github Copilot", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "Google_AI_Studio", "litellm_provider": "gemini", "provider_display_name": "Google AI Studio", "default_model_placeholder": "gemini-pro"},
          {"provider": "GradientAI", "litellm_provider": "gradient_ai", "provider_display_name": "GradientAI", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "Groq", "litellm_provider": "groq", "provider_display_name": "Groq", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "HEROKU", "litellm_provider": "heroku", "provider_display_name": "Heroku", "default_model_placeholder": "gpt-3.5-turbo"},
          {"provider": "HUGGINGFACE", "litellm_provider": "huggingface", "provider_display_name": "Huggingface", "default_model_placeholder": "gpt-3.5-turbo"}
        ]' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: provider-litellm-display-names
      why: litellm_provider or provider_display_name values differ from LiteLLM for any of the thirteen providers
      run: |
        jq -e '{
          "FalAI": ["fal_ai", "Fal AI"],
          "FEATHERLESS_AI": ["featherless_ai", "Featherless Ai"],
          "FireworksAI": ["fireworks_ai", "Fireworks AI"],
          "FRIENDLIAI": ["friendliai", "Friendliai"],
          "GALADRIEL": ["galadriel", "Galadriel"],
          "GIGACHAT": ["gigachat", "GigaChat"],
          "GITHUB": ["github", "Github"],
          "GITHUB_COPILOT": ["github_copilot", "Github Copilot"],
          "Google_AI_Studio": ["gemini", "Google AI Studio"],
          "GradientAI": ["gradient_ai", "GradientAI"],
          "Groq": ["groq", "Groq"],
          "HEROKU": ["heroku", "Heroku"],
          "HUGGINGFACE": ["huggingface", "Huggingface"]
        } as $expected | length == 13 and all(.[]; [.litellm_provider, .provider_display_name] == $expected[.provider])' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: falai-flux-placeholder
      why: FalAI model placeholder is not the flux model identifier
      run: jq -e '.[] | select(.provider == "FalAI") | .default_model_placeholder == "fal_ai/fal-ai/flux-pro/v1.1-ultra"' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: gigachat-five-fields
      why: GigaChat is missing a field or fields are out of order
      run: |
        jq -e '.[] | select(.provider == "GIGACHAT") | [.credential_fields[].key] == ["api_base", "api_key", "gigachat_scope", "gigachat_auth_url", "gigachat_access_token"]' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json &&
        jq -e '.[] | select(.provider == "GIGACHAT") | .credential_fields[] | select(.key == "gigachat_access_token") | .tooltip == "Disable OAuth, provide value to authorization."' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: gigachat-scope-options
      why: GigaChat scope field options or default are missing or incorrect
      run: >-
        jq -e '.[] | select(.provider == "GIGACHAT") | .credential_fields[] | select(.key == "gigachat_scope") | .options == ["GIGACHAT_API_PERS", "GIGACHAT_API_B2B", "GIGACHAT_API_CORP"] and .default_value == "GIGACHAT_API_PERS"'
        crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: google-ai-api-version-guidance
      why: Google AI Studio api_base tooltip does not include API version guidance
      run: >-
        jq -e '.[] | select(.provider == "Google_AI_Studio") | .credential_fields[] | select(.key == "api_base") | .placeholder == "https://generativelanguage.googleapis.com/v1beta" and (.tooltip | contains("v1alpha for Gemini 3+ models") and contains("include the version prefix") and contains("but not the trailing slash") and contains("/models/{model}:generateContent"))'
        crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: gradient-ai-custom-labels
      why: GradientAI labels or placeholders do not match LiteLLM's custom values
      run: |
        jq -e '.[] | select(.provider == "GradientAI") | .credential_fields[] | select(.key == "api_base") | .label == "GradientAI Endpoint" and .placeholder == "https://..."' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json &&
        jq -e '.[] | select(.provider == "GradientAI") | .credential_fields[] | select(.key == "api_key") | .label == "GradientAI API Key" and .required == true' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: remaining-providers-exact-fields
      why: One or more providers are missing fields or field properties (type, label, required) do not match LiteLLM
      run: |
        jq -e '[.[] | select(.provider | IN("FireworksAI", "Groq")) | .credential_fields | map(.key) == ["api_key"] and .[0].required == true and .[0].field_type == "password" and .[0].label == "API Key"] == [true, true]' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json &&
        jq -e '[.[] | select(.provider | IN("FEATHERLESS_AI", "FRIENDLIAI", "GALADRIEL", "GITHUB", "GITHUB_COPILOT", "HEROKU", "HUGGINGFACE")) | .credential_fields | map(.key) == ["api_base", "api_key"] and .[0].field_type == "text" and .[0].label == "API Base" and .[0].required == false and .[1].field_type == "password" and .[1].label == "API Key" and .[1].required == false] == [true, true, true, true, true, true, true]' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: provider-field-order-all-thirteen
      why: One or more providers have fields out of order or missing credential field metadata
      run: |
        jq -e '(map({(.provider): [.credential_fields[].key]}) | add) == {
          "FalAI": ["api_key"],
          "FEATHERLESS_AI": ["api_base", "api_key"],
          "FireworksAI": ["api_key"],
          "FRIENDLIAI": ["api_base", "api_key"],
          "GALADRIEL": ["api_base", "api_key"],
          "GIGACHAT": ["api_base", "api_key", "gigachat_scope", "gigachat_auth_url", "gigachat_access_token"],
          "GITHUB": ["api_base", "api_key"],
          "GITHUB_COPILOT": ["api_base", "api_key"],
          "Google_AI_Studio": ["api_base", "api_key"],
          "GradientAI": ["api_base", "api_key"],
          "Groq": ["api_key"],
          "HEROKU": ["api_base", "api_key"],
          "HUGGINGFACE": ["api_base", "api_key"]
        }' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json &&
        jq -e '(map(select(.provider != "GIGACHAT") | {(.provider): [.credential_fields[].required]}) | add) == {
          "FalAI": [true],
          "FEATHERLESS_AI": [false, false],
          "FireworksAI": [true],
          "FRIENDLIAI": [false, false],
          "GALADRIEL": [false, false],
          "GITHUB": [false, false],
          "GITHUB_COPILOT": [false, false],
          "Google_AI_Studio": [false, true],
          "GradientAI": [false, true],
          "Groq": [true],
          "HEROKU": [false, false],
          "HUGGINGFACE": [false, false]
        }' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
    - id: provider-json-parses
      why: the JSON file does not parse or does not yield thirteen records
      run: jq -e 'type == "array" and length == 13' crates/betterlite-server/assets/provider_create_fields_fal_huggingface.json
oracle_cases: []
deviations: []
out_of_scope:
  - Loading or assembling the catalog in B3190 through get_provider_fields; this task provides only the data fragment.
  - Validating credentials against provider APIs or checking endpoint connectivity; metadata only is preserved.
  - Routing requests to providers or executing models; form definitions do not run any provider integration.
pitfalls:
  - >-
    FalAI's default_model_placeholder is "fal_ai/fal-ai/flux-pro/v1.1-ultra", a function identifier for image generation, not a text model name; changing it to a generic placeholder breaks the model lookup.
  - >-
    GigaChat's five credential fields include three text fields (api_base, api_key, gigachat_auth_url), one select field (gigachat_scope with three options and a default), and one password field with a tooltip explaining OAuth behavior; omitting the scope select or its options changes the UI control type.
  - >-
    Google AI Studio's api_base tooltip documents behavior specific to Gemini versioning: v1alpha for 3+ models, the version prefix requirement, and LiteLLM's automatic selection; truncating or paraphrasing this guidance breaks the user's ability to override the API version correctly.
  - >-
    GradientAI's api_base and api_key labels are provider-specific ("GradientAI Endpoint" and "GradientAI API Key"), not generic labels; api_base also has a distinctive "https://..." placeholder unlike most other providers.
  - >-
    GigaChat's gigachat_access_token tooltip "Disable OAuth, provide value to authorization." is distinct; this is the only place the OAuth disabling behavior is documented.
  - >-
    The JSON file must remain an array, not an object with a provider key; B3190's loader expects JSON.load() to yield a list directly.
  - >-
    Every null value in placeholder, tooltip, options or default_value must be preserved exactly; writing an empty string instead changes how the form renders or the LLM interprets the default.
review_level: standard
budget:
  max_changed_lines: 625
  max_new_expects: 0
