id: B780
title: Reset key spend and budget windows
description: >-
  Implement POST /key/{key:path}/reset_spend with the source's separate writes, not an encompassing
  transaction. B124 ResetSpendRequest requires reset_to and rejects booleans before float coercion
  with 422. The helper accepts numbers, rejects nonnumbers with 400, negative values with 400,
  values greater than (current spend or 0.0) with 400, then values above the lower non-null key or
  related-budget maximum with 400. Equality is allowed. Validation happens before authorization:
  only proxy admins or admins of the existing key team may proceed, never an ordinary owner.
  Cases reset_required_field, reset_bool_422, reset_number_coercion, reset_negative,
  reset_above_current, reset_lower_budget_ceiling, reset_equal_boundary,
  reset_validation_before_permission, reset_proxy_admin, reset_team_admin and reset_owner_denied
  pin those branches. Error messages identify the numeric constraint and relevant limit, or
  proxy/team-admin requirement; use betterlite wording as permitted by README Decisions.


  The path is hashed when it contains the substring sk anywhere, not just an sk- prefix;
  otherwise it is already the stored hash. Query the key including its budget relation.
  The route's explicit HTTPExceptions escape unchanged: absent database 500, missing key 404,
  invalid reset 400, denied role 403 and a null update result 500 use the standard detail.error
  envelope without OpenAI type/param/code. Its final except maps other failures through B124
  handle_exception_on_proxy to 500 internal_server_error with openai_error_param/code 500.
  Cases reset_substring_hash, reset_database_absent, reset_key_absent,
  reset_null_update and reset_unexpected_error compare the exact envelope distinction.


  First write spend=reset_to, then set lifetime counter spend:key:<hash> to that value. Set local
  counter TTL 60; try Redis with TTL 60, warn and continue on Redis failure. Set local
  spend_db_floor:<counter> with B734 SPEND_DB_FLOOR_CACHE_TTL_SECONDS=5. Publish the counter
  then floor values with their respective TTLs through B878; do not delete them. Cases
  reset_partial_lifetime_value, reset_counter_floor_ttls, reset_redis_warning_continues and
  reset_broadcast_order capture both effects and warning.


  Parse budget_limits with B770's shared decoder. Empty windows cause no window write. For each
  nonempty string duration, use B199 duration_in_seconds and a fresh aware UTC now plus duration,
  storing its ISO reset_at; preserve other fields and leave missing/empty/non-string durations
  unchanged. These are floating windows, not calendar reset boundaries. Persist the whole JSON
  window array before setting each valid window counter spend:key:<hash>:window:<duration> to
  0.0 with its floor and broadcasts. Only after all writes call B734 _delete_cache_key_object.
  Cases reset_windows_floating, reset_windows_invalid_duration_unchanged,
  reset_empty_windows_no_write, reset_window_persist_before_counters and reset_auth_eviction_last
  prove the order. Invalid duration parsing propagates, not warn-and-drop. Return key_hash,
  spend, previous_spend, max_budget and budget_reset_at from the first updated key, without
  changing the lifetime reset timestamp or returning new per-window reset times.


  Postgres cases reset_spend_write_failure, reset_window_write_failure,
  reset_broadcast_failure and reset_auth_eviction_failure inspect all preceding durable effects:
  a failed later step never rolls back the initial spend update. The optional litellm-changed-by
  header is accepted for the wrapper but unused in this handler; reset_changed_by_no_extra_write
  checks it does not add an audit database mutation.


  Reuse B895 trailing /key/{*tail} dispatcher; strip only the final /reset_spend suffix and keep the same
  decoder and authorization as the explicit reset handler.


  Build the production key_spend_reset module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _check_proxy_or_team_admin_for_key (L5989-L6015; 25 source lines), _validate_reset_spend_value (L6018-L6053;
  30 source lines), _set_spend_counter_with_floor_and_broadcast (L6056-L6087; 28 source lines),
  _advance_one_key_budget_window (L6107-L6131; 24 source lines), _reset_key_budget_windows
  (L6134-L6172; 33 source lines), reset_key_spend_fn (L6181-L6278; 77 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Route cases use B001 HTTP, including slash-containing keys and dispatcher suffix precedence.
  Counter failure cases inject the production counter/publication ports; no adapter calls the
  FastAPI handler outside a running proxy.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 217 nonblank, noncomment pinned source lines including docstrings before Rust translation;
  allow 217 production, 350 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 632 changed lines estimated within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
