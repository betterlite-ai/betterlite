  - 'The oracle helper for this task is pre-registered as auth_errors in the server group. Replace the stub Op in tools/oracle/src/helpers/server/auth_errors.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/auth_errors.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
