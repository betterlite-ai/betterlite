id: B757
title: Authentication error envelopes and sanitized diagnostics
description: >-
  Map AuthError/DbError into B003 error bodies with the pinned status/type/param/code and custom messages.
  Preserve malformed-body timing and received-at metadata, trace causality and invalid-key provenance.
  Logs escape control characters and redact secrets before attaching IP/user-agent context; do not echo
  token hashes.


  Own the post_call_failure_hook transformation of auth exceptions (auth_exception_handler.py:240-249),
  using an injected AuthFailureHook supplied by B012. Hook failure must not leak secrets. The restricted
  outage identity is not an administrator and still passes route policy.


  Preserve conversion order. BudgetExceededError uses its message, budget_exceeded, null param and
  status_code (normally the global default 422; 429 only if the attribute is absent). ModelAccessDenied
  HTTP errors retain the private internal_message while exposing str(detail), auth_error, string None
  param and their status. Other HTTP errors preserve detail, param if present else string None, and
  status; ProxyException is unchanged. B872 classifies database-unavailable errors into its 503; every
  other exception becomes 401 auth_error, Authentication Error, followed by str(error), and the same
  param fallback. Preserve B732 ProxyException wire normalization and headers, not an invented mapper.


  Outage bypass requires both B872's enabled setting and a connection-error classification. First emit
  DB service_failure_hook(get_key_object, duration=0.0), then WARN, then return the synthetic identity
  with request_route unchanged. Other database failures do not bypass. It does not execute the normal
  auth failure hook or seed the trace on this branch. Otherwise B744 extracts the request IP and this
  task reads user-agent only if scope has headers. litellm_metadata wins by key presence over metadata;
  use a mapping or empty base, and fill only falsey requester_ip_address/user_agent from truthy values.
  Return the original request-data object when nothing is stamped; otherwise shallow-copy it and its
  selected metadata. There is no mutation of the original payload.


  Log before seeding identity or invoking callbacks, so callback failure cannot erase the diagnostic.
  B744's invalid-key provenance plus log_client_error_tracebacks=false selects stdout WARNING; all
  others use ERROR. Include a traceback only when enabled or B206 says this is not an expected client
  error. Optional identity suffix lists nonempty key_alias, user_id, user_email, team_id, team_alias in
  that order, escaping every nonprintable character via unicode_escape; absent identity or disabled
  log_auth_failure_key_identity yields no suffix. Both switches default false. Copy resolved identity,
  set parent span, normalize route through B741, retain an existing api_key or use B732's hashed form
  of the supplied key, then B110 seeds the span with the body model. Budget errors lacking llm_provider
  call B2327's rate-limit provider resolver with the string model or null before the failure hook.


  The injected B012 hook receives client context, original exception, copied identity, auth_error and
  route. A nonnull transformed exception replaces the original; a raising hook propagates. Convert the
  resulting exception and preserve the original invalid-key marker. If the earlier log was quiet but
  the final code string is not 401, add an ERROR log. Raise the final exception. The separate malformed
  body logging helper instead catches every callback failure, logs an exception and leaves the caller's
  original 400 intact; it supplies empty request_data and bad_request_error to that hook.


  received_at returns an existing nonnull state value, otherwise UTC now; state-assignment errors are
  silently ignored. Span setup first stamps time, then skips absent logger or an existing span. B110
  creates the span with received-at and B1100 headers; only legacy non-v2 logging with the setter adds
  B741 path/template attributes. Body parsing detects B1100 opaque audio, caches an empty parsed body
  and returns it without reading bytes. Otherwise catch only ProxyException from B1100 reading and
  return empty body plus that deferred error; successful parsing receives B1102 path parameters.
  Path-population errors occur outside that catch. No database writes or secret storage occur here.


  Build the production auth_errors module in betterlite-auth; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_exception_handler.py:
  _as_proxy_exception (L47-L80; 34 source lines), _get_user_agent (L83-L86; 4 source lines), _with_client_context
  (L89-L104; 16 source lines), _escape_control_chars (L107-L108; 2 source lines), _identity_log_suffix
  (L111-L123; 13 source lines), UserAPIKeyAuthExceptionHandler._handle_authentication_error (L128-L260;
  98 source lines). litellm/proxy/auth/user_api_key_auth.py: _ensure_litellm_received_at_on_request_state
  (L1310-L1327; 18 source lines), _ensure_parent_otel_span_on_request_state (L1330-L1359; 25 source lines),
  _read_request_body_deferring_parse_failure (L1362-L1381; 19 source lines), _record_unparsable_body_failure
  (L1384-L1406; 21 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.log_auth_failure_key_identity=False;
  litellm_settings.log_client_error_tracebacks=False; general_settings.use_x_forwarded_for=None.


  general_settings.allow_requests_on_db_unavailable=false; on a classified DB connection error true creates
  key_name/token failed-to-connect-to-db, user_id __db_unavailable_fallback__, role INTERNAL_USER. Retain
  use_x_forwarded_for from B744 and litellm_settings.log_auth_failure_key_identity=false / litellm_settings.log_client_error_tracebacks=false
  switches.


  Add the auth_errors operation under B856 Management::auth. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-errors-*
  seed to B171 helper_case, which already owns this decoder.


  B732 error integration on POST /v1/chat/completions compares each exception category's exact
  status/type/message/param/code and headers. Script callback transformation/failure separately from
  the early outage return; capture log level, traceback decision and identity seeding order.


  Database outage cases use B860 on POSTGRES_TEST_URL or testcontainers and distinguish transport
  failure from missing rows and policy errors. The synthetic outage identity cannot acquire admin grants.


  Write betterlite-config::auth_errors::tests::log_switches_default_false,
  identity_and_traceback_switches_consumed, forwarded_for_requires_exact_true,
  outage_default_false_and_enabled and invalid_boolean_rejected.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  B1100 owns body decoding; this task only defers its ProxyException and controls diagnostic timing.
  Parser failures and callback failures must not expose the credential or request-body contents.


  Sizing: allow 250 production, 300 table-driven tests, 80 helper adapters, 90 wiring and 60 config
  lines, 780 changed lines within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_errors::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
