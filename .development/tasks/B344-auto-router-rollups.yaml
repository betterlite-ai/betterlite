deviations: []
out_of_scope:
- Benchmark and session HTTP response aggregation (B355).
- Changing the established Prisma schema.
pitfalls:
- Do not cast monetary sums through a Rust float to match the source SQL float8 casts.
- A read-then-write update loses concurrent turns.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
