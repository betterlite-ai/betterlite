id: B344
title: Atomic auto-router session rollups
description: 'Use B051/B070 repository and write-queue infrastructure to persist B342 evidence and B012
  routing decisions in the existing LiteLLM_AutoRouterSession and LiteLLM_AutoRouterUserSession tables.
  Implement bounded session identity, turn classification and ordered per-session drains with atomic row
  updates. Store costs as Decimal at the Rust boundary and reuse B051''s approved conversion for the unchanged
  database schema. Add real Postgres integration cases for concurrent and out-of-order turns; typed repository
  probes also compare the pinned transaction builder. Implement the owned native service in crates/betterlite-server/src/auto_router_rollups.rs.
  Add ProbeOperation::AutoRouterRollups in tools/oracle/src/router_probes/mod.rs and the corresponding B344 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/models/autorouter_session.py: LiteLLM_AutoRouterSession.baseline_model
  (L36-L45). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports. Function coverage in litellm/proxy/db/autorouter_session_rollup.py:
  turn_cache_facts (L154-L165), _turn_time_utc (L168-L175), _write_ttl_seconds (L178-L197), bounded_session_id
  (L203-L209), build_autorouter_turn_transaction (L212-L283), _p (L289-L292), _session_upsert_sql (L323-L391),
  _as_sql_param (L405-L410), _upsert_params (L413-L414), write_autorouter_turn (L417-L422), _upsert_turn_with_retry
  (L425-L439), _session_partition (L442-L444), _drain_session_partition (L447-L466), _flush_session_partition
  (L469-L491), flush_autorouter_turn_transactions (L494-L520). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports. Function coverage in litellm/repositories/autorouter_session_repository.py: AutoRouterSessionRepository.table
  (L17-L18), AutoRouterSessionRepository.model_class (L21-L22), AutoRouterSessionRepository.find_latest_for_key
  (L24-L34). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
