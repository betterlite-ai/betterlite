dod:
  - text: CustomLoggerOptions defaults to turn_off_message_logging false and message_logging true, reads both from a map that also holds unrelated keys, and treats a null turn_off_message_logging as false.
    proof: [options-tests, oracle, helper-python]
  - text: A string field longer than 10,000 characters in error_str, messages or response is cut to its first 10,000 characters plus the exact suffix, a field of exactly 10,000 characters is kept, and the input payload is not changed.
    proof: [truncate-tests, oracle, helper-python]
  - text: Truncation counts Unicode characters, leaves absent, null and empty fields and short list or object fields with their original type, and cuts a long list or object field to a string.
    proof: [truncate-tests]
  - text: select_metadata_field returns None for no kwargs, litellm_metadata when that key exists (even null), and metadata otherwise.
    proof: [metadata-field-tests, oracle, helper-python]
  - text: Redaction returns Unchanged when turn_off_message_logging is false and no fields are excluded, and when there is no standard_logging_object.
    proof: [redact-tests, oracle, helper-python]
  - text: Excluded fields are removed from the copied standard_logging_object, and with turn_off_message_logging the classifier_input and originating_request_masked keys are removed as well.
    proof: [redact-tests, oracle, helper-python]
  - text: With turn_off_message_logging, messages become the one-item placeholder list and a chat response becomes the placeholder ModelResponse dump built from the stamp; null and excluded fields are left alone.
    proof: [redact-tests, oracle, helper-python]
  - text: With turn_off_message_logging, a Responses API response keeps its structure and only the "text" of the content items inside output items becomes redacted-by-litellm.
    proof: [redact-tests, oracle, helper-python]
  - text: A callback that redacts messages itself keeps its messages and response, but its proxy_server_request still loses the two classifier audit keys.
    proof: [redact-tests, oracle, helper-python]
  - text: Base64 data URIs in message content and other message keys become [BASE64_REDACTED], file items and non-text typed items are dropped, non-object messages are dropped, and untyped or text items are kept.
    proof: [base64-tests, oracle, helper-python]
  - text: A value deeper than max_depth becomes [MAX_DEPTH_REACHED], and a payload whose messages is missing, empty or not a list comes back unchanged.
    proof: [base64-tests, oracle, helper-python]
  - text: handle_callback_failure increments only the first counter in list order, does nothing for an empty list, and never fails.
    proof: [failure-counter-tests, oracle, helper-python]
  - text: IntegrationHealthStatus serializes to {"status":"healthy","error_message":null} and {"status":"unhealthy","error_message":"<text>"}.
    proof: [health-tests, oracle, helper-python]
  - text: litellm_settings.standard_logging_payload_excluded_fields loads as a list of strings (default empty), DEFAULT_MAX_RECURSE_DEPTH_SENSITIVE_DATA_MASKER defaults to 10, and a non-integer value or a non-list key is a config error that names it.
    proof: [config-tests]
  - text: The config YAML fuzz corpus holds new seeds for the excluded-fields key and replays without a panic.
    proof: [config-yaml-corpus]
  - text: Every oracle case has a newly committed seed that the shared helper-case parser replays.
    proof: [helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: options-tests
      why: the logger option tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^exporter_options::tests::options_/)'
    - id: truncate-tests
      why: the truncation tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^exporter_options::tests::truncate_/)'
    - id: metadata-field-tests
      why: the metadata field tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^exporter_options::tests::metadata_field_/)'
    - id: redact-tests
      why: the redaction tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^exporter_options::tests::redact_/)'
    - id: base64-tests
      why: the base64 strip tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^exporter_options::tests::base64_/)'
    - id: failure-counter-tests
      why: the callback failure count tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^exporter_options::tests::failure_counter_/)'
    - id: health-tests
      why: the health payload tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^exporter_options::tests::health_/)'
    - id: config-tests
      why: the payload_exclusions section tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::payload_exclusions::/)'
    - id: config-yaml-corpus
      why: no new seed for the excluded-fields key, or corpus replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/payload-exclusions-*")"
        && grep -rlq 'standard_logging_payload_excluded_fields' crates/betterlite-config/fuzz/corpus/config_yaml
        && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: the oracle adapter fails strict Python checks or does not exist
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3931.py)"
        && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3931.py
        && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json tools/oracle/helpers/b3931.py
    - id: helper-case-corpus
      why: new helper seeds are missing or fail replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/exporter_options-*")"
        && grep -lE '^[[:space:]]+b3931:' tools/oracle/fuzz/corpus/helper_case/exporter_options-*
        && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
