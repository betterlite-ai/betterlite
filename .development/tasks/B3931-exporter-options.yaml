    - crates/betterlite-logging/src/exporter_options.rs
    - crates/betterlite-logging/src/exporter_options/**
    - crates/betterlite-config/src/sections/payload_exclusions.rs
    - crates/betterlite-config/src/sections/payload_exclusions/**
    - "crates/betterlite-config/fuzz/corpus/config_yaml/payload-exclusions-*"
    - tools/oracle/cases/helpers/exporter-options/**
    - "tools/oracle/fuzz/corpus/helper_case/exporter_options-*"
    - tools/oracle/helpers/b3931.py
    - tools/oracle/helpers/b3931/**
    - tools/oracle/src/helpers/logging/b3931.rs
    - tools/oracle/src/helpers/logging/b3931/**
  lint_tables: false
