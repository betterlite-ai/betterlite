deviations:
  - what: For a list or object field (messages as a list, a dict response), the length test and the cut use the field's compact JSON text, not Python's str() text. A short field is unchanged either way.
    why: docs/compatibility.md leaves out repr text. The two texts differ in quote style and spacing, so the cut point of a very long list differs; oracle cases use string fields only.
  - what: strip_base64_from_messages returns a new payload and leaves the caller's payload and its message objects as they were, and one function serves LiteLLM's async and sync variants.
    why: docs/compatibility.md excludes changes made in place to the caller's dict, and the async variant awaits nothing.
  - what: The placeholder ModelResponse takes its id and created values from the caller instead of generating them inside the function.
    why: A pure function is testable, and the oracle cases ignore those two values because LiteLLM generates them fresh.
  - what: A null turn_off_message_logging in an exporter's init params reads as false.
    why: LiteLLM's field is bool or None, and None behaves like false in every branch of the redaction except for a harmless extra copy.
out_of_scope:
  - "The hook methods of CustomLogger (custom_logger.py L141-L835: pre and post call hooks, log_* events, agentic loop hooks, deployment hooks) are the extension surface. B189 owns the native phases and B6030 the Python class."
  - "AgenticLoopPlan, AgenticLoopRequestPatch, AgenticLoopSafetyError and the interception key helpers in litellm/types/integrations/custom_logger.py L1-L55 and L65-L88 are owned by B189 according to B2419 and B3544."
  - "get_callback_env_vars (custom_logger.py L102-L139) has no caller at the pin."
  - "get_proxy_server_request_from_cold_storage_with_object_key (L976-L982) only returns None in the base class. Exporters that override it own their versions."
  - "All of litellm_logging.py belongs to B247 to B253. Its _handle_callback_failure (L3579-L3599) is B250, and the call to the redaction hook at L3483 is made by B250 and B251 using the function built here."
  - "redact_streaming_responses_for_custom_logger and the other functions of redact_messages.py are B080, B188 and B190. The classifier audit module is B021, so this task holds its own two-name constant for the audit keys."
  - "The Prometheus implementation of increment_callback_logging_failure and its metric litellm_callback_logging_failures_metric are B3881."
  - "The exporter-specific health checks (Datadog dummy payload, SQS, GCS and the rest) call IntegrationHealthStatus but belong to the exporter tasks. The AdditionalLoggingUtils interface is B191."
  - "Reading turn_off_message_logging from litellm_settings is the logging_privacy config section (B188)."
pitfalls:
  - "Truncation measures and cuts in Unicode characters. Slicing a Rust String by byte index at 10,000 can split a character and panic, so cut with chars()."
  - "The suffix is joined to the cut text with no space: the first 10,000 characters, then \"...truncated by litellm, this logger does not support large content\"."
  - "error_str, messages and response are the only truncated fields. A field that is falsy in Python (null, empty string, empty list, empty object, 0) counts as empty text and stays as it is."
  - "select_metadata_field tests for the key litellm_metadata, not for a non-null value. A request with litellm_metadata: null still selects litellm_metadata."
  - "The early return needs turn_off_message_logging to be exactly false and the excluded list to be empty. Setting only excluded fields still builds the copy."
  - "Classifier audit keys (classifier_input, originating_request_masked) are dropped from the standard_logging_object only when turn_off_message_logging is true, never for excluded_fields alone."
  - "The proxy_server_request cleanup in rule 5 happens even when the callback redacts messages itself, and it is skipped when standard_logging_object is missing (rule 2 returns first)."
  - "In a Responses API response only the \"text\" key of content items changes. The refusal text and the reasoning summary text that B190's payload redaction handles are left alone here."
  - "Do not reuse the private base64 redaction in crates/betterlite-logging/src/s3_v2/redact.rs. It works on S3's own payload struct. Write the shared version on the Json type from betterlite_models::decisions and leave the s3_v2 files alone."
  - "The base64 pattern is compiled once and matches across whitespace, so a data URI that spans a newline is replaced as a whole. The depth check is depth > max_depth, so depth equal to max_depth is still walked."
  - "max_depth can be configured to a negative number, because Python's int() accepts it. Then even depth 0 is over the limit and every value becomes [MAX_DEPTH_REACHED]. Do not clamp it."
  - "handle_callback_failure stops after the first counter, and the order is callbacks, success_callback, failure_callback, _async_success_callback, _async_failure_callback. A later counter must not be incremented."
  - "The Message placeholder dump is not the same as the ModelResponse placeholder. The messages list holds Message dumps; the response holds the full ModelResponse dump with choices, id, created and object chat.completion. ModelResponse.model_dump uses exclude_unset, so read the oracle output for the exact keys."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
