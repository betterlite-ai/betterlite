id: B3931
title: Native exporter options, truncation and health payloads
description: >-
  Build the shared helpers that every native exporter calls on LiteLLM's CustomLogger base class: the two logger options, the payload
  truncation, the privacy redaction, the base64 strip, the metadata field choice, the callback failure count and the health payload.
  Put them in betterlite-logging under a new module exporter_options (files: options.rs, truncation.rs, redaction.rs, base64_strip.rs,
  metadata_field.rs, failure_counter.rs, health.rs, tests.rs, one concern per file). All text and field names below come from
  litellm/integrations/custom_logger.py unless another file is named.

  Options. CustomLoggerOptions has turn_off_message_logging (bool, default false) and message_logging (bool, default true; deprecated
  in LiteLLM, kept because redact_messages.py and the Datadog LLM exporter still read it). Other exporters' init params extend this
  record (StandardCustomLoggerInitParams in litellm/types/integrations/custom_logger.py), so it must deserialize from a map that
  also holds unrelated keys and ignore them, as pydantic does. A null turn_off_message_logging reads as false.

  Truncation. truncate_standard_logging_payload_content(payload) takes the typed StandardLoggingPayload from B254 and returns a
  new payload. The input is never changed, because every callback of a request shares one payload object. For each of error_str,
  messages and response in that order: take the field's text; when it is longer than 10,000 characters (counted in Unicode
  characters, not bytes) replace the field with a string holding the first 10,000 characters followed by exactly
  "...truncated by litellm, this logger does not support large content". A field that is absent, null, empty or not longer than
  10,000 characters stays as it was, with its original type (a short messages list stays a list). The text of a string field is the
  string itself. The text of a list or object field is its compact JSON text (see deviations).

  Metadata field. select_metadata_field(request_kwargs) returns None when no kwargs map is given, MetadataField::LitellmMetadata
  ("litellm_metadata") when that key is present in the map (even with a null value), and MetadataField::Metadata ("metadata")
  otherwise. The router's lowest-latency strategy calls it.

  Redaction. redact_standard_logging_payload(details, policy, stamp) ports redact_standard_logging_payload_from_model_call_details.
  details is a small struct holding the optional standard_logging_object (Json map) and the optional
  litellm_params.proxy_server_request (Json map). policy holds turn_off_message_logging, excluded_fields (litellm_settings
  standard_logging_payload_excluded_fields, default none) and callback_redacts_itself (the redacts_messages_itself answer, false
  in the base class). stamp holds the id and created values for the generated placeholder response, because LiteLLM builds a
  fresh ModelResponse (id "chatcmpl-" plus a uuid4, created = current Unix seconds) and a pure function must not read the clock.
  The result is an enum: Unchanged, or Redacted with the new standard_logging_object and proxy_server_request. Rules, in order:
  (1) turn_off_message_logging false and no excluded fields: Unchanged. (2) no standard_logging_object: Unchanged.
  (3) Copy the object without every key in excluded_fields, and when turn_off_message_logging is true also without the keys
  classifier_input and originating_request_masked. (4) When turn_off_message_logging is true and callback_redacts_itself is false:
  if "messages" is not excluded and its value is not null, set it to a one-item list holding the dump of Message(content="redacted-by-litellm")
  (content, role "assistant", tool_calls null, function_call null; the oracle case shows the exact keys). If "response" is not
  excluded and its value is not null: when it is an object with an "output" key (a Responses API response), deep copy it and
  replace "text" with "redacted-by-litellm" in every object inside every list "content" of every object in a list "output", and
  leave the rest; otherwise replace it with the dump of ModelResponse(choices=[Choices(message=Message(content="redacted-by-litellm"))])
  built from stamp. (5) When turn_off_message_logging is true and the proxy_server_request is an object, return it without
  classifier_input and originating_request_masked, whether or not the callback redacts itself and even when nothing else was
  redacted.

  Base64 strip. strip_base64_from_messages(payload, max_depth) ports _strip_base64_from_messages, its sync twin and the helpers
  _redact_base64, _should_keep_content and _process_messages as one function, since the async version awaits nothing. SQS and
  the legacy S3 logger call it. When messages is not a non-empty list the payload is returned as it is. Otherwise messages becomes
  a new list: entries that are not objects are dropped; for an object whose content is a list, keep an item when it is not an object,
  or it has no "file" key and its "type" is not a string different from "text"; then redact each kept item. A content that is not a
  list is redacted as a whole. Every other key of the message is redacted too. Redaction walks strings, lists and objects; in a
  string it replaces every match of
  data:(?:application|image|audio|video)/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+ with "[BASE64_REDACTED]". Depth starts at 0 for
  each value; at depth greater than max_depth the value becomes the string "[MAX_DEPTH_REACHED]" and a warning is logged. The
  response field is not touched, although the docstring says it is.

  max_depth comes from the env var DEFAULT_MAX_RECURSE_DEPTH_SENSITIVE_DATA_MASKER (default 10, read as an integer). Own the
  config section crates/betterlite-config/src/sections/payload_exclusions.rs. It parses litellm_settings.standard_logging_payload_excluded_fields
  (list of strings, default empty) and reads that env var through the loader's EnvironmentLookup. A value that is not an integer
  is a config error that names the variable (LiteLLM fails on import). Settings reach other crates as config.sections.payload_exclusions
  with fields excluded_fields and max_redaction_depth.

  Failure count. handle_callback_failure(callback_name, counters) takes the registered callbacks in LiteLLM's order (callbacks, then
  success_callback, failure_callback, async success, async failure) as a slice of &dyn CallbackFailureCounter. The trait has one
  method, increment_callback_logging_failure(&self, callback_name: &str). The first element is incremented and the rest are not.
  An empty slice logs at debug level and does nothing. It never returns an error and never panics. Callers build the slice from the
  B189 registry; the Prometheus implementation of the trait belongs to the Prometheus task.

  Health payload. IntegrationHealthStatus has status (HealthState::Healthy or Unhealthy, serialized "healthy" and "unhealthy")
  and error_message (Option<String>, serialized as null when absent), with the two constructors healthy() and unhealthy(message).
  It matches IntegrationHealthCheckStatus in litellm/types/integrations/base_health_check.py. Datadog, New Relic and the other
  exporters build their async_health_check results with it.

  Test names. Behavior tests live under exporter_options::tests with the prefixes options_, truncate_, metadata_field_, redact_,
  base64_, failure_counter_ and health_, as rstest cases with one named case per DoD line below. The config section has its own
  tests.rs, anchored on sections::payload_exclusions::.
scope:
