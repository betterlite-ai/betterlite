id: B10196
title: The router runs the Google generate content calls, and the call steps route through the production router for any route type
description: >-
  LiteLLM's route_request sends agenerate_content and agenerate_content_stream to `llm_router.agenerate_content(**data)` when a router exists (route_llm_request.py L545-L716), and the Router runs them through `_dispatch_generic_call_type` and `_ageneric_api_call_with_fallbacks` with litellm.agenerate_content as the callable (router.py L1915, L2068-L2072, L6884-L6918). B6021 builds that engine in betterlite-sdk and takes its executors from the constructor, B8631 builds the production RouterGeneric with its executor list in betterlite-server, and B8354's table already routes both names to B6021's dispatch. Nothing registers an executor for them, so the router answers UnknownCallType. B6021 cannot take this: its scope is betterlite-sdk's router_generic, and betterlite-sdk does not depend on betterlite-vertex, where B10183 puts the GenAI session. The call steps also need a router-backed MessagesRouting, and the only one planned was B8804's for /v1/messages, so the Google routes (B10178) would need a copy. This task builds the GenAI SDK call once, registers its two executors in B8631's list, and builds one route-neutral router routing that B8804 uses for /v1/messages and B10178 for the Google routes.


  SDK call. Module `app::inference::google_sdk_call` (crates/betterlite-server/src/app/inference/google_sdk_call.rs and google_sdk_call/: adapter.rs, executors.rs, tests.rs). Main already declares `pub mod google_sdk_call;` in app/inference.rs over an empty file. `GoogleSdkCall::new(state: &Arc<ServerState>, environment: &BTreeMap<String, String>) -> Self` builds one B10183 `GenaiSession` from `config.sections.studio_identity`, `vertex_credential_sources` and `vertex_schema_shaping` (already resolved at load), a RequestTimeout with the seconds and explicitly_set of `config.sections.routing_timeouts.global` (LiteLLM's litellm.request_timeout), `state.shared.bundled_catalog`, `NativeClients::new(state.shared.client.clone(), betterlite_config::tls::user_agent(environment))`, SystemClock, a redactor with MINIMUM_CUSTOM_KEY_LENGTH, `Arc::new(state.shared.aws_credentials.clone())` (B10175's chain; a clone shares its cache) as the AWS source, and `environment` as the resolution environment. `pub fn session(&self) -> &GenaiSession` hands that session to B10197's countTokens translator. `pub async fn call(&self, data: JsonMap, logging: &mut LoggingState, entry: Entry) -> Result<MessagesOutcome, MessagesCallError>` splits the data into B10183's GenaiCall the way `litellm.agenerate_content(**data)` binds keyword arguments: model, contents, config, tools, extra_headers, extra_query, extra_body, timeout and custom_llm_provider are taken out by name, and every other key (litellm_metadata, metadata, proxy_server_request, litellm_call_id, stream, vertex_project and the rest) goes into kwargs. It runs `session.run(&call.request(timeout), &adapter, &mut log, entry)` with a LogContext over the given LoggingState and B10183's logging_env with betterlite-logging's TracingSink. The answer becomes a MessagesOutcome: Mock, Adapter Response and Native or AsyncNative Response become `Message { body, hidden }` with the JSON object as body; AsyncNative Stream becomes `Stream { source: SharedSource { items, snapshot: None, buffered: None }, hidden }` where each event is `StreamItem::Bytes` and an event error is a StreamFailure with kind Other and its message; Adapter Stream does the same over its byte items. The hidden params carry model_id from the data's litellm_metadata.model_info.id when it is set, since LiteLLM's proxy reads the id the router wrote into the shared metadata dict and a JSON map does not share it back. A GenerateContentFailure becomes `MessagesCallError::Call(CallFailure)` with the class's status (default 500), message and error type from B3489's ErrorClass.


  Chat adapter (adapter.rs). LiteLLM converts a model with no GenAI config (an `openai/` deployment, say) to a chat completion and calls `litellm.acompletion` (google_genai/adapters/handler.py L57-L104). `ChatAdapter` implements B3489's CompletionExecutor (crates/betterlite-core/src/api/genai/chat_call.rs L59) over `state.executor` and the ChatDeployment whose model_id is the data's litellm_metadata.model_info.id, which B303's request update writes on the router path. acompletion sends `call.request` with `ChatExecutor::send(deployment, &request)` (crates/betterlite-openai/src/chat/execution.rs L93) and answers the outcome's ChatResponse, or with `ChatExecutor::stream` when the request streams, parsing its SSE with SseParser and Chunk::parse as the chat relay does (routes/chat/streaming/relay.rs L50-L68) and ending the Chunk stream at [DONE], at the end of the body, or at the first read or parse error, which it logs at warn. completion, the blocking form, is never called by the async entries and answers the adapter error. With no deployment both answer `AdapterError::NoDeployment`, which B3489 wraps in LiteLLM's "Error calling litellm.acompletion for generate_content: ..." text.


  Router executors (executors.rs). `genai_executors(call: Arc<GoogleSdkCall>) -> Vec<(String, Arc<dyn GenericCallExecutor>)>` answers two B10154 executors, "agenerate_content" with Entry::Await and "agenerate_content_stream" with Entry::AwaitStream. Each takes the GenericRequest's argument map as the data (B6021's generic attempt already merged the deployment's litellm_params under the request, with `model` set to the deployment's model, router.py L5359-L5377, so vertex_project, vertex_location, vertex_credentials and api_base arrive without a merge here), makes a fresh per-call logging state the way B8691's executor does (B247's constructor as function_setup builds one when the kwargs carry no logging object: the call type from the request's name, the call id from litellm_call_id, metadata from litellm_metadata), and runs `call`. A Message answers `GenericOutcome::Json` with the body and its hidden params under `_hidden_params`, the JSON dump a response object carries; a Stream answers `GenericOutcome::Stream` with a B10154 GenericStream over the source's items and hidden params; a failure answers `GenericError::Failed` with FailureCause::Class, as B8631 maps a LiteLLM exception. In crates/betterlite-server/src/app/inference/router_calls.rs put `genai_executors(Arc::new(GoogleSdkCall::new(state, &environment)))` in RouterGeneric's executor list in front of B8691's passthrough executors, with the same environment map those take; B7430's and B6460's lists keep their place in front.


  Router routing. Module `app::inference::router_routing` (crates/betterlite-server/src/app/inference/router_routing.rs and router_routing/tests.rs). Main already declares `pub mod router_routing;` in app/inference.rs over an empty file. `router_routing(route_type: &'static str, router: Arc<RouterHandle>, generic: Arc<RouterGeneric>) -> Arc<dyn MessagesRouting>` is route_request's router branch (route_llm_request.py L545-L716) for any route type, the counterpart of B9800's standalone_routing. It holds `state.shared.router` and reads the current router on every call, the way B8631's adapters do. The router facts answer from that router's services: all_blocked is _raise_if_model_fully_blocked's check, then map_team_model, is_recognized_model, model_names_has, team_public_model_names_has, pass_through_all_models (router_general_settings), has_default_or_pattern (a default deployment or any pattern route), is_deployment_name, and DeploymentLookup over B844's model list as B8611's RouterView answers it. `route_call(data, specific_deployment)`, which is `getattr(llm_router, route_type)(**data)` for the route type it was built with, calls RouterGeneric's `dispatch_generic_call_type` with that name and the data as the GenericRequest, with `specific_deployment` set when asked. GenericOutcome::Json becomes `Message` with `_hidden_params` taken out of the body as the hidden params, and GenericOutcome::Stream becomes `Stream` over a SharedSource of its items; GenericError::Failed becomes `MessagesCallError::Call(CallFailure)` with the failure's status, message, type and headers, and UnknownCallType a CallFailure with status 500 and its text. `a2a_agent` answers a model name that starts with "a2a/" with an error that names A2A agent routing as not built, the way catalog/arize.rs answers CatalogError::Unavailable, and never sends it on to the router; B4788 replaces that answer. The CallFailure it builds sets `cooldown` (the field B10183 adds) from a RouterRateLimitError's cooldown_time when B10154's failure names that class and None otherwise, so _handle_llm_api_exception's retry-after (B10178) sees it. Rename B9800's `MessagesRouting::anthropic_messages` to `route_call`, since the router routing serves any route type with it: the trait method (messages_call/outcome.rs L55), StandaloneRouting's impl (standalone.rs L90), the caller in messages_call.rs (L157), and the fake and the callers in messages_call/tests.rs (L148) and tests/standalone.rs. Nothing else on main implements or calls it.


  Tests. google_sdk_call::tests build a ServerState without a database from a config whose model_list has a `gemini/gemini-2.0-flash` deployment with api_base on a betterlite_http_fixture mock upstream and an `openai/oracle-model` deployment on another mock. They check: `call` with a gemini data map reaches the mock at the Gemini path and answers its JSON as a Message; the stream entry answers the mock's frames byte for byte; a data map whose litellm_metadata.model_info.id names the openai deployment answers from a chat completion in Google's shape, and a streamed one ends when the chat stream ends; with no model id the adapter answers the 500 with "Error calling litellm.acompletion for generate_content"; a provider 401 is a CallFailure with status 401; `genai_executors` answers the two names in that order, and the agenerate_content executor answers GenericOutcome::Json with `_hidden_params.model_id` from the arguments' litellm_metadata. router_routing::tests build a real Router from a two-deployment config.yaml against a local mock upstream and B8631's RouterCalls, as B8631's tests do, and check each router fact against that config, a call built with "agenerate_content" reaching the upstream through RouterGeneric and answering a Message with the deployment's model_id, the same call falling back to the second deployment on a 500, a router rate limit answering a CallFailure with its cooldown, and an "a2a/" model answering the not-built error with no upstream request.
