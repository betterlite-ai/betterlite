    why: The per-config credential cache the deviation below names.
dod:
  - text: GoogleSdkCall runs one generate content call from a data map, natively or through the chat adapter, streamed or not, and answers a MessagesOutcome with the router's model_id in the hidden params.
    proof: [sdk-call-tests]
  - text: RouterGeneric holds executors for agenerate_content and agenerate_content_stream, and a router call reaches the deployment with its litellm_params.
    proof: [sdk-call-tests, router-list, routing-tests]
  - text: router_routing answers route_request's router facts from the current router and sends the call for the route type it was built with through RouterGeneric, falling back on a 500.
    proof: [routing-tests]
  - text: A router rate limit's cooldown reaches CallFailure.cooldown.
    proof: [routing-tests]
  - text: MessagesRouting's call method is route_call, and /v1/messages chooses and answers as before.
    proof: [messages-tests]
  - text: docs/deviations/B10196.yaml lists this task's rows.
    proof: [deviation-rows]
checks:
  optional: [mutants]
  commands:
    - id: sdk-call-tests
      why: the data split loses a field, the adapter is not used, the answer shape is wrong or an executor answers the wrong outcome
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::google_sdk_call::/)'
    - id: routing-tests
      why: a router fact answers wrong, the call goes to the wrong call type or skips the fallback, the cooldown is lost, or an a2a model reaches the router
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::router_routing::/)'
    - id: router-list
      why: the executors are not in RouterGeneric's list or broke B8631's router calls
      run: grep -q 'genai_executors' crates/betterlite-server/src/app/inference/router_calls.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::router_calls::/)'
    - id: messages-tests
      why: the rename changed what the messages steps choose or answer, or the old name is left
      run: test -z "$(grep -rn 'fn anthropic_messages(' crates/betterlite-server/src/messages_call.rs crates/betterlite-server/src/messages_call)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^messages_call::/)'
    - id: deviation-rows
      why: this task's deviations are not recorded
      run: test -s docs/deviations/B10196.yaml && grep -q 'logging' docs/deviations/B10196.yaml
oracle_cases: []
deviations:
  - what: On the router path the GenAI SDK call writes its pre-call records into a fresh logging state, not the proxy's logging object for the request.
    why: B10154's GenericRequest is a JSON map with no slot for the logging object LiteLLM passes in kwargs; B8691's pass-through executor makes a fresh state the same way.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L5334-L5414
  - what: >-
      The chat adapter reaches a model_list deployment through the OpenAI-compatible chat executor only, so a chat-only deployment the executor cannot send (an Anthropic or Azure one, say) fails with the executor's error, and a call with no deployment (the direct branch) answers a 500. A chat stream that breaks midway ends the Google stream instead of raising.
    why: The server has no general litellm.acompletion; B3489's CompletionExecutor answers a stream of plain chunks with no error item.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/handler.py#L57-L104
  - what: Vertex credentials are loaded again on every generation call, where LiteLLM's GenAI config caches them per credentials and project.
    why: B10183's session keeps B7844's lookup; the server's credential cache lives inside the Vertex embedding executor.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L470-L520
out_of_scope:
  - "The Google routes' pipeline, its direct-branch dispatch and the exception handling: B10178."
  - "/v1/messages' switch from standalone routing to this router routing, its hooks adapter and B312's header refresh: B8804."
  - "A2A agent routing behind a2a_agent: B4788."
  - "B6021's engine, B10154's contract and B8631's other executors and adapters: their tasks."
pitfalls:
  - "Build router_routing per request from state.shared.router, never from a startup router snapshot, so a config reload reaches the next call."
  - "`stream` stays in the SDK call's kwargs, as **data passes it to agenerate_content_stream; GenaiCall has no stream field."
  - "The genai stream frames are already SSE text from the provider; wrap them as StreamItem::Bytes so B6370's guardrail wrapper sees raw bytes, as LiteLLM's iterator hook does (google_endpoints/endpoints.py L109-L112)."
  - "B10183 adds the route type and CallFailure.cooldown to messages_call.rs, standalone.rs and their tests first; read them on main before the rename."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
