dod:
  - text: _resolve_secret expands os.environ/ string values through B002 environment lookup and returns None for non-string or non-matching values.
    proof: [oracle, helper-python, databricks-oauth-tests]
  - text: _token_url_from_workspace normalizes workspace URLs by stripping trailing slashes and removing /serving-endpoints suffix before building the token endpoint.
    proof: [oracle, helper-python, databricks-oauth-tests]
  - text: parse_databricks_oauth_config validates presence of client_id, client_secret and workspace_url after resolution, raising ValueError with the missing field names.
    proof: [oracle, helper-python, databricks-oauth-tests]
  - text: DatabricksAppOAuthConfig.cache_key includes a 16-character SHA256 digest of the client_secret so rotated secrets yield distinct cache entries.
    proof: [oracle, helper-python, databricks-oauth-tests]
  - text: DatabricksAppOAuthTokenCache holds per-key asyncio.Lock instances and cleans them up when tokens are removed, keeping the locks dict bounded.
    proof: [oracle, databricks-oauth-tests]
  - text: async_get_token uses double-check locking to coalesce concurrent token requests for the same credential into a single network fetch.
    proof: [oracle, databricks-oauth-tests]
  - text: _fetch_token POSTs to the token endpoint with grant_type=client_credentials and scope, using a Basic auth header and the pooled HTTP client.
    proof: [oracle, databricks-oauth-tests]
  - text: _fetch_token parses the response JSON for access_token and expires_in, accepting any value int() parses and defaulting unparseable values to 3600 seconds, computing TTL as max(expires_in - 60, 0).
    proof: [oracle, helper-python, databricks-oauth-tests]
  - text: _fetch_token raises ValueError for missing access_token, HTTP errors, non-dict JSON and any other httpx exception.
    proof: [oracle, databricks-oauth-tests]
  - text: async_get_token skips caching and removes the lock when TTL is zero, preventing stale short-lived tokens from being served.
    proof: [oracle, databricks-oauth-tests]
  - text: resolve_oauth_header returns None when no databricks_oauth block is present, or a dict with Authorization header set to "Bearer <token>" when OAuth is configured.
    proof: [oracle, databricks-oauth-tests]
