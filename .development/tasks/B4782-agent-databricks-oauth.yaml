deviations: []
out_of_scope:
  - Environment-reference resolution beyond os.environ/ expansion (get_secret_str with secret-manager dispatch) is owned by B002; this task handles environment lookups only.
  - B173 provides the pooled asyncio HTTP client and POST transport; this task calls it without implementing transport logic.
  - B2226 provides InMemoryCache with default TTL and get_cache/set_cache/_remove_key; this task extends it with per-key locking and adds flush_cache for test cleanup.
  - Databricks workspace OIDC and OAuth specifications are implemented as documented in the source comments; no provider-specific overrides.
pitfalls:
  - The double-check locking pattern must check the cache again inside the lock; the first check avoids lock contention on cache hits.
  - The secret digest in cache_key must use base64-decoded bytes for hashing, not the string representation, so secret rotations are properly detected.
  - Expires_in values are parsed with int(), which accepts numeric strings ("120"), floats (120.5), and integers; only values int() cannot parse (non-numeric strings like "abc", dicts) default to 3600 seconds.
  - TTL must never go negative; max(expires_in - 60, 0) ensures uncached short-lived tokens do not fail.
  - The per-key lock must be popped from _locks when a token is not cached (ttl=0), or _locks grows unbounded with short-lived token keys.
  - os.environ/ references that fail resolution must return None, not raise; missing required fields are caught by parse_databricks_oauth_config.
  - The module-level singleton oauth_token_cache must be initialized once at import time, not per-request, to maintain the shared lock dict.
  - flush_cache clears both the cache and the locks dict; test cases that share the singleton must call flush_cache between cases to reset lock state.
review_level: security
budget:
