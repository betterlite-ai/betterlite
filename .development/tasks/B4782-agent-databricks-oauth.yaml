id: B4782
title: Fetch and cache Databricks agent OAuth tokens
description: >-
  Implement client-credentials token fetching and per-credential request coalescing using
  the pooled HTTP client and local TTL cache. Agents registered with a databricks_oauth block
  in litellm_params fetch workspace OIDC tokens, cache them until 60 seconds before expiry,
  and attach them as Bearer authorization on every call to the agent.

  _resolve_secret expands os.environ/ references through B002's environment lookup, returning
  the plaintext string or None. _token_url_from_workspace strips the workspace URL, removes
  /serving-endpoints suffix, and returns the /oidc/v1/token endpoint. parse_databricks_oauth_config
  reads client_id, client_secret, and workspace_url from the databricks_oauth block in litellm_params,
  validates that all three are present, resolves their os.environ/ references, and builds DatabricksAppOAuthConfig
  with token_url computed from workspace_url and scope defaulting to all-apis. Raise ValueError
  with the list of missing required fields if any are absent after resolution.

  DatabricksAppOAuthConfig is a frozen dataclass with client_id, client_secret, token_url and scope
  fields. Its cache_key property includes a SHA256 digest of the client_secret (first 16 hex chars)
  so a rotated secret yields a new cache entry and prevents serving stale tokens. DatabricksAppOAuthTokenCache
  extends InMemoryCache with a default TTL of 3600 seconds and maintains a dict of asyncio.Lock
  instances keyed by cache_key. __init__ calls super().__init__(default_ttl=3600) and initializes
  _locks. _get_lock returns the lock for a cache_key, creating it if absent. _remove_key calls
  super()._remove_key and pops the lock for that key so the locks dict stays bounded by live keys.
  flush_cache clears both the cache and the locks dict at once, used by tests to reset state between cases.

  async_get_token takes a DatabricksAppOAuthConfig, checks the cache and returns a cached token
  immediately. If not cached, acquires the per-key lock, checks the cache again inside the lock,
  fetches the token if still not cached, and handles short-lived tokens: if the token's TTL
  (expires_in minus 60 seconds, minimum 0) is greater than zero, cache it; otherwise skip caching
  and pop the lock since no _remove_key call will clean it up. _fetch_token calls get_async_httpx_client
  with llm_provider=httpxSpecialProvider.A2A, constructs a Basic auth header by base64-encoding
  client_id:client_secret, POSTs to the token endpoint with grant_type=client_credentials and
  scope in the form data, and parses the JSON response.

  On HTTP success, extract access_token and expires_in from the response body. If access_token
  is missing or falsy, raise ValueError. If expires_in is present, int() parses it: any value int()
  accepts (numeric string, float, integer) converts successfully; only values int() cannot parse
  (non-numeric strings, non-scalars) default to 3600 seconds. Compute TTL as max(expires_in - 60, 0).
  On HTTP error, raise ValueError with the status code. On any other httpx exception, raise ValueError
  with the message. Return the tuple (access_token, ttl).

  resolve_oauth_header takes litellm_params, calls parse_databricks_oauth_config,
  and returns None if no databricks_oauth block is present. Otherwise, gets a token from oauth_token_cache,
  and returns {"Authorization": "Bearer <token>"}. This function is the entry point called by A2A
  forwarding (B4788) before sending an outbound request to the agent.

  A module-level oauth_token_cache singleton holds the shared in-memory cache across
  all agents. Every fetch that would repeat the same client_credentials request within the lock window
  coalesces into a single network request through the asyncio.Lock, and every unique credential
  rotates its cache independently through the secret digest in the cache key.

  Write the behavior rstest functions databricks_oauth_tests_behavior in adjacent tests.rs files,
  with a named case for each behavior and failure in the DoD.
