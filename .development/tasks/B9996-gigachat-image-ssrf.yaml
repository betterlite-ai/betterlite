id: B9996
title: GigaChat image upload fetches internal addresses for a client
description: >-
  Fix the SSRF bug B8178 copied from LiteLLM in crates/betterlite-openai/src/gigachat_files.rs. When a chat message
  carries an image_url that isn't a base64 data URL, GigachatFileUploader::download_image parses it, builds a bare GET
  with a 600 second deadline and hands it to GigachatFileTransport::download. The trait comment says that download
  skips certificate checks and follows redirects like LiteLLM's client. Nothing checks the host first. A client that
  can send a GigaChat chat request can point image_url at 127.0.0.1, 169.254.169.254 or a host inside the network, and
  the gateway fetches it and uploads the body to GigaChat as the message's attachment. LiteLLM's _download_image_sync
  does the same with client.get(url) on a client built with ssl_verify False and follow_redirects True.
  owned-behavior-is-built lists SSRF as a bug to fix without asking, no working setup relies on the gateway fetching
  internal hosts for a client, and the architect confirmed the fix on 2026-11-19. So this task routes the download
  through the shared guard in crates/betterlite-http/src/user_url and logs a deviation.


  Two wirings were compared. The first keeps GigachatFileTransport::download and puts a UrlValidator in front of it.
  validate_url checks the address, and the uploader sends the pinned URL with its Host header to the transport. That
  checks the first hop only. The transport follows redirects, and ProxiedClient::send_following re-checks only the
  proxy route on each hop (proxy/redirect.rs), so a public host that answers 302 with Location
  http://169.254.169.254/ still gets through. Closing that gap means refusing every 3xx, and then images behind a CDN
  redirect stop working although LiteLLM fetches them today. The other way is to re-validate each hop in the uploader,
  and that copies the loop in UserUrlFetcher::fetch. The guard can't sit on the transport either. The uploader gets a
  generic T: GigachatFileTransport, the only implementation is the test Fake, B8312 writes the real one later, and
  UserUrlFetcher::fetch takes a concrete &ProxiedClient, not a trait.


  The second wiring is the one to build. It takes the download out of the trait and gives the uploader the pair the
  guard needs: a UserUrlFetcher<R> and the ProxiedClient the download goes out on. vertex's SafeGet and the prompts
  media Fetcher hold the same pair. fetch validates the start URL and every redirect hop, sends plain http to the
  checked address with the original Host header and honors user_url_allowed_hosts. With its validation flag false it
  follows redirects the httpx way with no check. So the download keeps following redirects and nothing is copied. The
  cost is in the tests, where the downloads move from the Fake to a local listener. The upload stays on
  GigachatFileTransport::upload, since it goes to the operator's GigaChat base with certificate checks on, never to a
  client URL.


  The change. Add crates/betterlite-openai/src/gigachat_files/download.rs and declare it with pub mod download; in
  gigachat_files.rs. It holds pub struct ImageDownloader<R> with pub fields urls: UserUrlFetcher<R> and client:
  ProxiedClient, and an impl<R: Resolve> with pub(super) async fn download(&self, image_url: &str) -> Result<Image,
  UploadError>. download runs self.urls.fetch(&self.client, image_url, &HeaderMap::new()) and then
  fetched.buffered(self.client.limits.body_bytes), both inside one tokio::time::timeout(DOWNLOAD_TIMEOUT, ...) the way
  SafeGet does it. After that it keeps today's steps: a status of 400 or more is UploadError::DownloadStatus, a
  missing content-type is image/jpeg and the extension comes from extension_of. DEFAULT_CONTENT_TYPE moves with it;
  DOWNLOAD_TIMEOUT and Image stay in gigachat_files.rs. GigachatFileTransport loses download and keeps upload, and its
  comment keeps only the upload's certificate rule. GigachatFilesConfig becomes GigachatFilesConfig<R> with pub
  downloader: ImageDownloader<R>, GigachatFileUploader<T> becomes GigachatFileUploader<T, R> and holds it, and image
  calls self.downloader.download(image_url) where it called download_image. UploadError gains Download(#[source]
  UserUrlError), shown as "the image download failed: {0}", and DownloadTimeout. A failed body read stays Transport
  with step "download". The Url error with what "image" goes away, since the guard parses the URL now.


  What a caller sees. An image_url whose host resolves to a blocked address, that redirects to one, or whose scheme
  isn't http or https sends no request. The existing "Error uploading file to GigaChat" line logs the guard's message,
  upload returns None, and the chat message goes to GigaChat without that image, as after any failed upload. A public
  URL downloads as before, redirects included, up to the client body limit (16 MiB by default); a larger body
  returns None like any failed download. B8312's wiring builds the ImageDownloader from
  config.sections.user_url_policy, so user_url_allowed_hosts and user_url_validation apply here as on every other user
  URL. This task changes no wiring.


  Tests in gigachat_files/tests.rs. Replace the Fake's download half (SeenDownload, download_replies, seen_download and
  the download method) with a local HTTP/1.1 listener on 127.0.0.1. It records each request line and Host header and
  answers with the next scripted download reply (status, headers, body, content-length, connection close), or closes
  the connection without an answer for Scripted::Fail. Keep script_download and downloads, so the existing tests read
  the same. The fixture builds the ProxiedClient from ProxyPolicy::resolve(&ProxyTrust::default(), &env), where env
  holds only HTTP_PROXY=http://127.0.0.1:<listener port>, as the otlp_client tests do. Every request that leaves the
  client then lands on the listener, whatever address it names. The UserUrlFetcher gets UrlValidator::new(FakeResolver,
  &[], &Verification::Enabled) and validation true. FakeResolver passes IP literals through, maps img.test and cdn.test
  to 93.184.216.34 and intranet.test to 10.0.0.5, and fails any other name. IMAGE_URL and every https://img.test URL in
  the file become http.


  New and renamed tests. an_internal_image_url_is_refused_before_any_request is an #[rstest] #[tokio::test] with the
  cases loopback ("http://127.0.0.1/a.png", 127.0.0.1), link_local ("http://169.254.169.254/latest/meta-data/",
  169.254.169.254) and private_range ("http://intranet.test/a.png", 10.0.0.5). Each case calls try_upload, asserts
  UploadError::Download(UserUrlError::Ssrf(SsrfError::BlockedAddress { address })) with the case's address, and asserts
  that the listener saw no request and the Fake saw no upload. a_remote_image_is_downloaded_and_uploaded becomes
  a_public_image_url_still_downloads: http://img.test/a.png returns the file id, the listener saw one request with the
  line "GET http://93.184.216.34/a.png HTTP/1.1" and Host img.test, and the upload part carries the body and content
  type as before. Drop its deadline assertion. a_redirected_download_checks_the_next_hop is an rstest whose first
  scripted download reply is a 302 with a Location. In to_link_local the Location is
  http://169.254.169.254/latest/meta-data/, and upload returns None after one request and no upload. In to_public_host
  it is http://cdn.test/b.png, and the second scripted reply is uploaded after two requests, the second one to
  http://93.184.216.34/b.png with Host cdn.test. a_stalled_download_gives_up_at_the_download_timeout runs under
  #[tokio::test(start_paused = true)] against a listener that accepts and never answers, and asserts that try_upload
  returns UploadError::DownloadTimeout.


  The three data URL tests that expect a download (a_data_url_without_the_base64_marker_is_downloaded,
  a_data_url_parameter_before_the_marker_is_downloaded and a_data_url_with_an_empty_mime_is_downloaded) become one
  rstest, a_data_url_the_decoder_skips_is_refused, with the cases no_base64_marker ("data:image/png,xyz"),
  parameter_before_marker ("data:image/png;charset=x;base64,QUJD") and empty_mime ("data:;base64,QUJD"). Each asserts
  that upload returns None, the listener saw no request and the Fake saw no upload. LiteLLM's httpx fails these with
  UnsupportedProtocol, so the caller sees the same None and no deviation is needed. The other download tests keep their
  assertions.


  Deviations. Write docs/deviations/B9996.yaml (task: B9996, then deviations, then kept_bugs: []) with the row under
  deviations below.
scope:
  paths:
    - crates/betterlite-openai/src/gigachat_files.rs
    - crates/betterlite-openai/src/gigachat_files/download.rs
    - crates/betterlite-openai/src/gigachat_files/tests.rs
    - docs/deviations/B9996.yaml
  lint_tables: false
