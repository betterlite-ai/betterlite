dod:
  - text: >-
      An image_url on a loopback, link-local or private address sends no request. try_upload fails with the guard's
      BlockedAddress and the Fake sees no upload.
    proof: [blocked-hosts]
  - text: >-
      A redirect to a blocked address is refused at the next hop, and a redirect to a public host is still followed and
      uploaded.
    proof: [blocked-hosts]
  - text: >-
      A public image URL still downloads, from the checked address with its original Host header, and is uploaded as
      before.
    proof: [public-download]
  - text: The response and the body read together still end at DOWNLOAD_TIMEOUT.
    proof: [download-timeout]
  - text: >-
      A data URL the decoder doesn't match stops at the guard without a request, and no test still expects it
      downloaded.
    proof: [data-urls]
  - text: >-
      GigachatFileTransport has no download method, ImageDownloader in download.rs calls UserUrlFetcher, and the other
      gigachat_files tests pass over the listener.
    proof: [module-tests]
  - text: docs/deviations/B9996.yaml lists the fix with the pinned LiteLLM link.
    proof: [deviation-row]
checks:
  optional: []
  commands:
    - id: blocked-hosts
      why: An image_url on a blocked address, or a redirect to one, still sends a request, or a redirect to a public host is no longer followed.
      run: >-
        cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^gigachat_files::tests::(an_internal_image_url_is_refused_before_any_request|a_redirected_download_checks_the_next_hop)::case_/)'
    - id: public-download
      why: A public image URL no longer downloads, or goes out to the hostname instead of the checked address.
      run: >-
        cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^gigachat_files::tests::a_public_image_url_still_downloads$/)'
    - id: download-timeout
      why: The download lost its 600 second deadline over the response and the body.
      run: >-
        cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^gigachat_files::tests::a_stalled_download_gives_up_at_the_download_timeout$/)'
    - id: data-urls
      why: A data URL the decoder skips still reaches a request, or a test still expects it or a remote image to go out unchecked.
      run: >-
        ! git grep -n -E 'fn (a_data_url_without_the_base64_marker_is_downloaded|a_data_url_parameter_before_the_marker_is_downloaded|a_data_url_with_an_empty_mime_is_downloaded|a_remote_image_is_downloaded_and_uploaded)[(]'
        -- crates/betterlite-openai/src/gigachat_files
        && cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^gigachat_files::tests::a_data_url_the_decoder_skips_is_refused::case_/)'
    - id: module-tests
      why: The download still goes through the transport trait, or the move broke another gigachat_files test.
      run: >-
        grep -q -F 'UserUrlFetcher' crates/betterlite-openai/src/gigachat_files/download.rs
        && ! git grep -n -F 'fn download(' -- crates/betterlite-openai/src/gigachat_files.rs
        && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^gigachat_files::/)'
    - id: deviation-row
      why: The fix has no deviations row, or the row lacks the pinned LiteLLM link or the allowlist a blocked host needs.
      run: >-
        grep -q -F 'file_handler.py#L61-L70' docs/deviations/B9996.yaml
        && grep -q -F 'user_url_allowed_hosts' docs/deviations/B9996.yaml
oracle_cases: []
deviations:
  - what: >-
      The GigaChat image uploader fetches a chat message's image_url through betterlite's user URL guard. A URL whose
      host resolves to a loopback, link-local, private or other non-global address, a redirect to one, or a scheme
      other than http and https sends no request. The uploader logs "Error uploading file to GigaChat" with the guard's
      message and returns None, so the message goes to GigaChat without that image, as after any failed upload. Hosts
      listed in user_url_allowed_hosts still download, user_url_validation false turns the check off, and a plain http
      URL is fetched from the checked address with its original Host header. A body over the download client body
      limit (16 MiB by default) returns None, where LiteLLM reads any size.
    why: >-
      LiteLLM's _download_image_sync sends client.get(url) with certificate checks off and redirects on, and never
      checks the host. Any client that can send a GigaChat chat request can make the gateway fetch an internal address,
      and the body is uploaded to GigaChat and attached to that client's message. No working setup relies on the gateway
      fetching internal hosts for a client, and an internal image host can be added to user_url_allowed_hosts. The
      body limit keeps one image URL from filling the gateway's memory.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/file_handler.py#L61-L70
out_of_scope:
  - >-
    B8312 builds the ImageDownloader, with a UserUrlFetcher from config.sections.user_url_policy and a download
    ProxiedClient that skips certificate checks, and picks the Verification its UrlValidator gets. This task changes no
    wiring.
  - The upload to the GigaChat base stays on GigachatFileTransport::upload with certificate checks on, since its URL comes from the operator's config.
  - The guard's rules (blocked ranges, allowlist matching, redirect limits, the validation switch) belong to crates/betterlite-http/src/user_url and its tests.
  - upload_file_async and _download_image_async have no caller at the pin, as B8178 found.
  - The data URL decoder in data_url.rs, the id cache and the multipart upload don't change.
pitfalls:
  - Call UserUrlFetcher::fetch for the download. validate_url followed by send_following checks the first hop only, since send_following re-checks just the proxy route.
  - Put fetch and buffered inside one timeout(DOWNLOAD_TIMEOUT, ...). fetch returns at the response head, and its own request deadline is client.limits.read_timeout, 100 minutes by default.
  - Read the body with buffered(self.client.limits.body_bytes), as SafeGet does, so one image URL can't fill memory.
  - SsrfError holds an io::Error and has no PartialEq, so the tests match UploadError::Download by pattern and compare only the address.
  - Every test URL is http. Through the HTTP_PROXY route the listener gets each request in absolute form, and an https URL would need a CONNECT tunnel and TLS on the listener.
  - The FakeResolver's public address must be global, like 93.184.216.34. 192.0.2.0/24, 198.51.100.0/24 and 203.0.113.0/24 are documentation ranges that is_blocked_ip refuses.
  - Keep fixture() synchronous so its 37 call sites stay as they are. Bind a std TcpListener on 127.0.0.1:0, call set_nonblocking(true), wrap it with tokio::net::TcpListener::from_std and tokio::spawn the accept loop, since every test already runs inside a tokio runtime.
  - In the paused-clock test, give that test's client a connect_timeout and read_timeout above DOWNLOAD_TIMEOUT. The paused clock jumps to the next timer whenever the runtime idles, and reqwest's 10 second connect timeout would fire first.
  - gigachat_files.rs counts 296 of its 300 lines (mod lines are free), so the download code moves to download.rs instead of growing the parent.
  - tests.rs has 801 of its 1000 lines, so the listener replaces the Fake's download half instead of sitting next to it.
  - Look for the host header case-insensitively in the listener; hyper writes header names in lowercase.
review_level: security
budget:
  max_changed_lines: 250
  max_new_expects: 0
