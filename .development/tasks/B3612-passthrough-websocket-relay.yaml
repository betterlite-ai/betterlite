id: B3612
title: Pass-through WebSocket relay lifecycle
description: >-
  Build LiteLLM's websocket_passthrough_request in betterlite-server, in the new module websocket
  (crates/betterlite-server/src/pass_through_lifecycle/websocket.rs and its folder; the folder exists, add `pub mod websocket;` next to B6510's request_prep and B3613's handler).
  It accepts the client socket, opens one upstream socket, copies frames both ways until one side ends, relays an upstream close, logs the session and reports failures.
  The routes that call it are B3628 (OpenAI, Deepgram, Nvidia) and B3629 (Vertex Live), so this task registers no route and adds no HTTP or WebSocket oracle case.
  Every test is a native test with fake sockets. LiteLLM's create_websocket_passthrough_route (L2159-L2207) is not built, see out_of_scope.

  Entry point. `WebSocketRelay::new(deps: WebSocketDeps)` and `relay(&self, args: &WebSocketArgs, client: &dyn ClientSocket, auth: &UserApiKeyAuth) -> Result<(), WebSocketRelayError>`.
  `WebSocketArgs` holds target (String, the ws or wss URL), custom_headers (indexmap::IndexMap<String,String>), forward_headers (bool, default false), endpoint (Option<String>, only a label for logs and the "/vertex_ai/live" test),
  cost_per_request (Option<f64>), accept_websocket (bool, default true) and setup_model_rewriter (Option of the rewriter type B3611 takes; read its merged name). `WebSocketRelayError` is a thiserror enum with three variants,
  Accept(String), PreCallHook(PassThroughError) and FailureHook(PassThroughError), and nothing else: every other problem is handled inside, as the Python does. `WebSocketDeps` holds hooks (`Arc<dyn ProxyHooks>`, B6510 declares the trait and its pre_call_hook,
  post_call_success_hook and post_call_failure_hook; do not edit it), logs (B247's logging object factory, the same handle B6510's PassThroughDeps uses), worker (the B191 handle), completion (`Arc<PassThroughSuccessCompletion>`, B3607),
  binder (`Arc<dyn ReservationBinder>`, declared by B3607) and connector (`Arc<dyn UpstreamConnector>`, declared here).

  Socket seams, declared here so tests use fakes. `ClientSocket` has `&self` methods: accept, receive (returns `ClientFrame`: Text(String), Binary(Bytes), Disconnect, or Other for a message with neither text nor bytes),
  send_text, send_bytes, close(code: u16, reason: &str), headers (the client's `http::HeaderMap`) and the two state reads that B3611's client_socket_is_open needs (client side and application side, each connected or disconnected; read B3611's merged signature and implement
  its trait if it declared one instead of adding a second). `UpstreamConnector::connect(&self, target: &url::Url, headers: &IndexMap<String,String>) -> Result<Box<dyn UpstreamSocket>, ConnectError>`.
  `ConnectError` is Rejected { status: u16 } (the upstream answered the upgrade with a non-101 status; LiteLLM's InvalidStatus) or Failed(String) (DNS, TLS, timeout, bad URL or scheme, anything else). `UpstreamSocket` has `&self` methods:
  send_text, send_bytes, recv (returns `UpstreamEvent`: Text, Binary, or Closed(Option<CloseFrame>) for a clean or error close the peer announced, with the received code and reason, or an Err for any other failure) and close.
  CloseFrame is B3611's close record if it has one, else a struct of code (u16) and reason (String). A production adapter over axum's WebSocket and tokio-tungstenite is not part of this task (B8642 builds it); the contract an adapter must keep is what websockets 15.0.1 does at the pin:
  open timeout 10 seconds, ping interval 20 seconds, ping timeout 20 seconds, largest incoming message 1048576 bytes (a larger one closes the socket with 1009 and the relay sees Closed(None)), permessage-deflate on.

  Flow of `relay`, in this order.
  (1) start_time = now, a fresh call id (uuid v4 string), an empty `websocket_messages` list of JSON objects. Log at info "WebSocket passthrough (<endpoint>): Starting WebSocket connection to <target>" (an absent endpoint prints as None).
  (2) When accept_websocket is true, call client.accept() and log at debug that the connection was accepted. An accept error is returned at once as Accept with nothing else run, since LiteLLM raises there before any logging object exists.
  (3) upstream headers = custom_headers, then, only when forward_headers is true, every client header whose lowercase name is "x-goog-user-project" (plain string keys, so a custom "X-Goog-User-Project" and the forwarded lowercase one both stay), then B3610's with_trace_context with the auth record's parent span.
  (4) Team callbacks with B3610's resolve_team_callback_wiring, route description "websocket_passthrough".
  (5) Create the logging object with B247: model "unknown", messages one user message with content "WebSocket connection", stream true, call_type "pass_through_endpoint", start_time, the call id, function_id "websocket_passthrough", and the team callbacks' success, failure and kwargs.
  Unlike the HTTP path, passthrough_guardrails_config is not set.
  (6) Build B3600's PassthroughStandardLoggingPayload: url = target, request_body = empty map, request_method "WEBSOCKET", cost_per_request. The request stand-in for kwargs has url = target, method "WEBSOCKET" (an extension `http::Method`) and the client headers, no scope and no state.
  kwargs = B3610's init_kwargs_for_pass_through_endpoint with the auth record, an empty body, the payload, the call id, that stand-in and the logging object. Because the stand-in has no scope, request_dispatched_to_pass_through_endpoint is false for it,
  so the four model max budget keys are stamped into metadata. Call it with that flag false; do not treat a WebSocket as a user-defined route.
  (7) Call the logging object's update_environment_variables with model "unknown", user "unknown", optional_params empty, the kwargs' litellm_params and call_type "pass_through_endpoint", then set model_call_details["litellm_call_id"] to the call id.
  (8) Call the logging object's pre_call (B249) with input one user message "WebSocket connection", api_key "", and additional_args complete_input_dict (empty), api_base (target) and headers (the upstream headers).
  (9) Call hooks.pre_call_hook with an empty body, call_type "pass_through_endpoint" and B3600's Generic endpoint type. Its returned map is not used. LiteLLM does not put the logging object into this body; B6510's PreCallInput carries the handle as a field, so pass it (see deviations).
  An Err here is returned at once as PreCallHook and nothing is closed: this call sits outside the try block, and the `finally` close does not run.
  (10) The try block. Connect with the connector (debug log "WebSocket passthrough (<endpoint>): Establishing upstream connection to <target>"), then log at info "WebSocket passthrough (<endpoint>): Upstream connection established successfully".
  (11) Run two loops at the same time on the same task, for example with `tokio::select!` with `biased;` so the client loop is polled first, and stop when the first one finishes; the other loop is dropped (LiteLLM cancels it). Both loops touch kwargs, the logging object and websocket_messages,
  so keep those in one shared session struct behind a `std::sync::Mutex` that is never held across an await.

  Client loop (forward_client_to_upstream). Repeat: receive a client frame. Disconnect: close the upstream and end the loop with Ok. Text: when the endpoint contains "/vertex_ai/live" (substring test), log at debug, then try to read the model from the frame.
  Parse the text as JSON; when it is an object with a "setup" key, and setup is an object with a "model" key, call B3611's resolved_vertex_live_setup (with the rewriter) and B3611's extract_model_from_vertex_ai_setup on the result.
  A model found: kwargs["model"] = it, kwargs["custom_llm_provider"] = "vertex_ai-language-models" (hyphens), logging_obj.model and model_call_details["model"] = it, model_call_details["custom_llm_provider"] = "vertex_ai", info log "WebSocket passthrough (<endpoint>): Successfully extracted model '<m>' and set provider to 'vertex_ai' from client setup message".
  No model found: warn "WebSocket passthrough (<endpoint>): Failed to extract model from client setup data: <setup>". Setup without "model": debug "Setup data does not contain model field". Message without setup: debug "Client message does not contain setup data". A parse failure or wrong shape: debug "Client message is not a valid setup message: <error>" and go on.
  Then send B3611's rewrite_vertex_live_setup_model(text, rewriter) upstream (this runs for every text frame, with or without a vertex endpoint, and returns the text unchanged when there is no rewriter). Binary: send the bytes upstream. Other: do nothing and read the next frame.
  Any error in this loop (client receive error, upstream send error): log at error "WebSocket passthrough (<endpoint>): error forwarding client message" with the error, close the upstream (ignore a close error), and end the loop with Ok. This loop never reports an Err.

  Upstream loop (forward_upstream_to_client). Repeat: recv one event. Closed(close): log at debug "Upstream WebSocket connection closed: <close>" and end with Ok(close). Text or Binary: send it to the client with send_text or send_bytes first, then B3611's json_object_frame on it;
  not a JSON object: nothing more. For the endpoint containing "/vertex_ai/live", the first JSON object frame of the session (count only JSON object frames; non-JSON and non-object frames do not count) is the setup response: call B3611's extract_model_from_vertex_ai_setup on it;
  a model found: kwargs["model"] = it, kwargs["custom_llm_provider"] = "vertex_ai_language_models" (underscores), logging_obj.model, model_call_details["model"] = it and model_call_details["custom_llm_provider"] = "vertex_ai_language_models";
  none found: warn "WebSocket passthrough (<endpoint>): Failed to extract model from server setup response: <frame>". That first frame is never added to websocket_messages. Every other JSON object frame is appended to websocket_messages.
  Any other error (recv failure, client send failure): debug "Exception in forward_upstream_to_client: <error>", error log "WebSocket passthrough (<endpoint>): error forwarding upstream message" with the error, and end the loop with Err(error).

  After the first loop ends. If the finished loop returned Err, that error goes to the unexpected-error arm below. Otherwise take the upstream close: B3611's upstream_close_to_relay over the finished loop's value (the client loop's Ok gives none). When it is Some and B3611's client_socket_is_open is true,
  call client.close(code, B3611's truncated_close_reason(reason)). A close error goes to the unexpected-error arm. Then end_time = now, payload.response_body = websocket_messages, payload.end_time = end_time.
  Success logging: build an UpstreamExchange (B3607) with status 200, empty response headers, request_method WEBSOCKET, request_url = target, request_headers = the upstream headers and body Text("WebSocket connection successful").
  Enqueue one event on the B191 worker that runs `completion.complete` with CompletionInput: upstream = that exchange, response_body = Some(List(websocket_messages)) (B3606's PassThroughResponseBody), url_route = endpoint or "", result "websocket_connection_successful", start_time, end_time,
  the logging object, cache_hit false, request_body empty, custom_llm_provider None (the provider rides inside kwargs, as in LiteLLM's **success_kwargs), the request state (B3607's PassThroughRequestState from B3605's default PassThroughCallState and the payload) and the kwargs.
  Right after an accepted enqueue call the binder with the logging object's litellm_params. A rejected enqueue binds nothing (B3607's deviation). Then call hooks.post_call_success_hook with an empty body, the auth record and the JSON object {"status": "websocket_connection_successful"}; its result is ignored and an Err goes to the unexpected-error arm.

  Failure arms, matched in this order. (a) The connector returned Rejected: log the error with its trace at error level "WebSocket passthrough (<endpoint>): upstream rejected WebSocket connection". (b) Any other error, from connect, a loop, the close or the success hook: error log
  "WebSocket passthrough (<endpoint>): unexpected error while proxying WebSocket". Both arms then build request_payload with B3610's build_passthrough_failure_request_payload (empty body, kwargs, logging object, no provider, no upstream usage; that is exactly LiteLLM's kwargs copy plus "litellm_logging_obj"),
  call hooks.post_call_failure_hook with FailureCause::Other(text) (text for (a) is "server rejected WebSocket connection: HTTP <status>"; for (b) the error's text), the payload and the trace cut to MAXIMUM_TRACEBACK_LINES_TO_LOG (default 100, env var of the same name; read how B3613 cuts it),
  then close the client if B3611's client_socket_is_open is true: (a) with code 1011 and reason "Upstream connection rejected", (b) with code 1011 and reason "WebSocket passthrough error". The carry_guardrail_logging_info step of the HTTP path is not run here.
  Finally, always: when the client is still open, client.close(1000, ""). If the failure hook itself returned an Err, run this final close first and then return FailureHook(error).

  The model and provider a Vertex frame sets in kwargs are what the failure payload and the success completion read later, so write them under the same lock the loops use.
scope:
  paths:
    - crates/betterlite-server/src/pass_through_lifecycle/websocket.rs
    - crates/betterlite-server/src/pass_through_lifecycle/websocket/**
  lint_tables: false
