    why: bind_budget_reservation_to_callbacks, which the ReservationBinder wraps.
dod:
  - text: With accept_websocket true the client is accepted before anything else, with false it is not accepted, and the upstream headers hold custom_headers, x-goog-user-project only when forward_headers is true, and the trace context.
    proof: [accept-tests]
  - text: The logging object, kwargs, update_environment_variables, pre_call and the pre-call hook run in the stated order with the WebSocket values, and a pre-call hook error is returned as PreCallHook without closing the client.
    proof: [setup-tests]
  - text: Text and binary client frames reach the upstream, a client disconnect closes the upstream, and a client loop error is logged, closes the upstream and does not fail the session.
    proof: [client-tests]
  - text: Upstream text and binary frames reach the client unchanged, JSON object frames are kept in order, other frames are not kept, and a send failure ends the session through the unexpected-error arm.
    proof: [upstream-tests]
  - text: The Vertex Live setup frame is rewritten and read on the client side and on the server side with the two different provider strings, and the first JSON object frame of the session is not kept in the message list.
    proof: [vertex-tests]
  - text: An upstream close is relayed to the client only when it is not a plain 1000 with an empty reason and the client is still open, with the reason cut to the close frame limit, and a client disconnect relays nothing.
    proof: [close-tests]
  - text: A finished session enqueues one completion with the stand-in WebSocket exchange and the collected messages, binds the reservation only after an accepted enqueue, and then calls the success hook.
    proof: [success-tests]
  - text: A rejected upgrade and any other error call the failure hook with the merged payload, close the client with 1011 and the matching reason, always end with a close of an open client, and return a failure hook error as FailureHook after that final close.
    proof: [fail-tests]
checks:
  optional: []
  commands:
    - id: accept-tests
      why: the accept flag, the header merge or the trace context is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::accept_/)'
    - id: setup-tests
      why: the logging setup order, the stand-in request values or the pre-call hook error path is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::setup_/)'
    - id: client-tests
      why: client frames are not forwarded, a disconnect does not close the upstream, or a client loop error fails the session
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::client_/)'
    - id: upstream-tests
      why: upstream frames are changed, the message list keeps the wrong frames, or a send failure is not routed to the failure arm
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::upstream_/)'
    - id: vertex-tests
      why: the Vertex Live model read, the rewrite or the two provider strings are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::vertex_/)'
    - id: close-tests
      why: the upstream close is relayed in the wrong cases, with the wrong reason, or to a closed client
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::close_/)'
    - id: success-tests
      why: the completion event, the reservation bind order or the success hook call is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::success_/)'
    - id: fail-tests
      why: the failure payload, the close codes, the final close or the failure hook error return is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::websocket::tests::fail_/)'
oracle_cases: []
deviations:
  - what: Errors the Python lets escape are returned as WebSocketRelayError (an accept error, a pre-call hook error, a failure hook error) instead of raised.
    why: Rust has no exceptions. The route task that calls the relay gets the same error at the same point.
  - what: The pre-call hook input carries the logging object handle as a field, where LiteLLM's WebSocket call passes a body without it.
    why: B6510 declares PreCallInput with the handle for the HTTP path, and the handle is not part of any upstream message. A guardrail that reads it sees one it would not see in LiteLLM.
  - what: When both loops are ready at the same instant, only the client loop's result is looked at.
    why: asyncio.wait can report both tasks done and LiteLLM then checks both for errors. A single select cannot, and the dropped loop's error would be lost only in a race that has no observable order.
out_of_scope:
  - "create_websocket_passthrough_route (L2159-L2207) is not built: its only caller is create_generic_websocket_passthrough_endpoint in llm_passthrough_endpoints.py, which nothing calls at the pin. No caller at the pin."
  - "rewrite_vertex_live_setup_model, resolved_vertex_live_setup, json_object_frame, truncated_close_reason, SENDABLE_CLOSE_CODES, client_socket_is_open, upstream_close_to_relay and extract_model_from_vertex_ai_setup belong to B3611; with_trace_context, resolve_team_callback_wiring, init_kwargs_for_pass_through_endpoint and build_passthrough_failure_request_payload to B3610. This task only calls them."
  - "The success completion, UpstreamExchange, PassThroughRequestState, ReservationBinder and PassThroughSuccessCompletion belong to B3607; PassThroughCallState to B3605; the ProxyHooks trait, FailureCause and PassThroughError to B6510."
  - "The route functions, their auth (user_api_key_auth_websocket), model allowlists, the Vertex Live credentials and upstream URL belong to B3628 and B3629, and the registration to B3616."
  - "ProxyLogging.pre_call_hook, post_call_success_hook and post_call_failure_hook are reached through B6510's trait. Their real implementations have no owner in this task."
  - "The production ClientSocket (axum) and UpstreamConnector (tokio-tungstenite) adapters are not built here; B8642 builds them."
pitfalls:
  - "The two Vertex provider strings differ on purpose: the client setup read writes kwargs custom_llm_provider as vertex_ai-language-models (hyphens) and model_call_details as vertex_ai, the server setup response read writes vertex_ai_language_models (underscores) to both. Keep both, because the later one wins."
  - "The first JSON object frame from the upstream is consumed as the setup response for a /vertex_ai/live endpoint and is not in websocket_messages. The counter counts only JSON object frames, so a leading binary or non-JSON frame does not use it up."
  - "The frame is sent to the client before it is parsed, so a frame that fails to parse still reaches the client."
  - "websockets 15.0.1 InvalidStatus has a response and no status_code attribute, so LiteLLM's getattr(exc, 'status_code', 1011) always gives 1011. Close with 1011 for a rejected upgrade, whatever the upstream status was."
  - "The failure hook runs before the failure close. If the hook fails, the close with 1011 never happens and only the final close(1000) runs, and the hook error still comes out."
  - "The final close uses code 1000 and an empty reason, and only when the client is still open. B3611's open test needs both the client-side and the application-side state to be connected, so a socket that is already closed on either side is not closed again."
  - "A client disconnect ends the client loop first, so the upstream loop is dropped and its Closed value is never looked at. No close is relayed to a client that is gone."
  - "A plain upstream close (code 1000, empty reason) is not relayed, so the client is closed by the final close(1000) instead. An upstream close with code 1005, 1006 or 1015 is not relayed either; a code from 3000 to 4999 is."
  - "The pre-call hook runs outside the try block. An error from it leaves the client open and unclosed, and no failure hook runs."
  - "The success hook runs after the completion is enqueued and the reservation bound. If the hook fails, the failure arm also runs, so a session can log a success and a failure."
  - "The stand-in response has no custom_llm_provider argument; the provider lives in the kwargs the completion gets. Passing it as the argument too would change which value B3606 reads."
  - "The upstream headers are a plain dict with exact-case keys, so merge them without case folding. Only the x-goog-user-project test lowercases the incoming name."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
