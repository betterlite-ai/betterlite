deviations:
  - what: The text after "Syntax error in custom code:", "Failed to compile custom code:", "Execution error:" and "Unexpected error:" is the sandbox's own message, not Python's.
    why: The sandbox has no CPython traceback or exception repr to quote; the prefixes, success and error_type are the contract (docs/compatibility.md says messages are betterlite's own).
  - what: The Python type name in the non-object warning is derived from the JSON kind of the result (`NoneType`, `bool`, `int`, `float`, `str`, `list`).
    why: Results reach the route as JSON values, so `tuple`, `set` and other Python-only types cannot appear.
out_of_scope:
  - "The sandbox, the primitives and the deadline code: B3802 and B3801."
  - "CustomCodeGuardrail (the live guardrail that compiles stored code and processes allow, block, flag and modify results): B3803."
  - "Team submissions, approval and rejection (L647-L1126): B3686."
  - "apply_guardrail and its logging helpers `_resolve_guardrail_input_type`, `_GuardrailLoggingObj`, `_GuardrailProxyLogging`, `_patch_logging_obj_for_guardrail` and `_emit_guardrail_success_logs` (L2241-L2457): B3687, whose route is the only caller."
pitfalls:
  - "The admin check compares the role with proxy_admin exactly, so a proxy_admin_viewer key gets 403 here even though it can read every list route."
  - "Compiling and running the module body share the first 5 second budget, so `while True: pass` at module level times out in step 1 with the timeout text, not a compile error."
  - "`\"apply_guardrail\" not in exec_globals` is a name check on the globals that hold the primitives, so source that only defines a helper such as `def check(...)` gets the missing function text."
  - "`test_inputs[\"texts\"] = []` is set on the caller's own dict before the call, so the function sees `texts` even when the request did not send it."
  - "`mock_request_data.get(\"model\", \"test-model\")` only defaults when the key is absent, so `{\"model\": null}` stays null and `metadata: null` stays null."
  - "An `async def` function is detected by its result being a coroutine, so the awaited part gets only the time that is left of the 5 seconds."
  - "The response is HTTP 200 for every failure after the role check; only the 403 and the 422 are errors at the HTTP level."
  - "`input_type` is not checked against `request` and `response`; the function receives whatever text was sent."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
