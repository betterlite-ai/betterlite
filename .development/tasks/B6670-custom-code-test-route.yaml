id: B6670
title: Bounded custom-code guardrail test route
description: >-
  Build `POST /guardrails/test_custom_code` in betterlite-server: an admin sends guardrail source and a test input, the proxy compiles the source in the custom-code sandbox, runs `apply_guardrail` once with a 5 second budget and reports what happened. Nothing is stored and no guardrail is created. Everything goes in crates/betterlite-server/src/guardrails/custom_code_test.rs and custom_code_test/. Expose `pub fn routes()` the way the sibling modules in crates/betterlite-server/src/guardrails/ do; the architect's skeleton mounts it, so do not touch app.rs. Team submissions are B3686 and the apply route is B3687; neither lives here.

  The sandbox is B3802's: `compile_sandboxed`, `build_sandbox_globals`, `call_off_loop_with_timeout`, `await_with_timeout` and `ExecutionTimeoutError` (betterlite-guardrails, custom_code_execution). Read B3802's stubs for the exact signatures and call them as they are; this task adds no sandbox code. The primitives that custom code calls (`allow`, `block`, `modify`, `regex_match` and the rest) come through `build_sandbox_globals`.

  Files, each below 300 lines: `error.rs` (`TestRouteError`, a thiserror enum), `body.rs`, `report.rs`, `run.rs`, `route.rs`, `tests.rs`.

  `body.rs` holds `TestCustomCodeRequest` with `custom_code: String` (required), `test_input: BTreeMap<String, GuardrailValue>` (required), `input_type: String` (default `request`, any text is accepted and passed on unchanged) and `request_data: Option<BTreeMap<String, GuardrailValue>>`. `GuardrailValue` is B3660's. Unknown body keys are ignored. The byte decoder is `decode_test_request(body: &[u8]) -> Result<TestCustomCodeRequest, TestRouteError>` through `serde_path_to_error` over `serde_json::Deserializer::from_slice`, and it is the only place the route reads body bytes. A body that does not decode answers the same 422 validation body the other server routes give for a bad JSON body, and it does so before the admin check, because FastAPI validates the body first.

  `report.rs` holds `TestCustomCodeResponse { success: bool, result: Option<BTreeMap<String, GuardrailValue>>, error: Option<String>, error_type: Option<ErrorType> }` and `ErrorType` (`compilation`, `execution`). The body always has all four keys, with null for the unset ones, and the status is always 200 once the caller is an admin. Two constructors only: `failure(error, error_type)` and `success(result)`.

  `route.rs` checks the caller first. Any valid key passes the normal key check, then the caller's role must be exactly `proxy_admin` (B732's role predicate). `proxy_admin_viewer` and every other role get 403 with detail "Admin access required to test custom code guardrails". This route has no database and no team lookup.

  `run.rs` holds `run_test(request: TestCustomCodeRequest, sandbox: &dyn CodeSandbox) -> TestCustomCodeResponse`, following test_custom_code L2038-L2222 step by step. `CodeSandbox` is a trait in this module with the calls the route needs (compile and load, then call), implemented over B3802 in `route.rs` and by a fake in tests. The budget `EXECUTION_TIMEOUT_SECONDS` is 5.
  1. Build the globals with `build_sandbox_globals`, then compile and load the source with `compile_sandboxed` and run the module body, both inside one `call_off_loop_with_timeout(.., 5, label "test:load")`. A syntax error (a source the sandbox refuses counts too: import, exec, dunder names) gives `failure("Syntax error in custom code: {error}", compilation)`. A timeout gives the timeout failure below. Any other error gives `failure("Failed to compile custom code: {error}", compilation)`.
  2. No `apply_guardrail` name in the globals gives `failure("Custom code must define an 'apply_guardrail' function. Expected signature: apply_guardrail(inputs, request_data, input_type)", compilation)`. A name that is not callable gives `failure("'apply_guardrail' must be a callable function", compilation)`.
  3. `test_input` gets `texts: []` when it has no `texts` key. The request data given to the function has exactly five keys: `model` (the given value, "test-model" only when the key is absent), `user_id`, `team_id`, `end_user_id` (each null when absent) and `metadata` (`{}` when absent). Nothing else from `request_data` is passed on.
  4. Call `apply_guardrail(test_input, request_data, input_type)` with `call_off_loop_with_timeout(.., 5, label "test")`. When the call returns an awaitable (an `async def` guardrail), await it with `await_with_timeout` for the time that is left of the same 5 seconds (never below zero), so the whole run shares one deadline. A timeout gives the timeout failure. Any other error gives `failure("Execution error: {error}", execution)`.
  5. A result that is an object gives `success(result)` as it is. Any other result gives `success({"action": "allow", "warning": "Expected dict result, got {type}. Treating as allow."})` with `{type}` the Python type name of the value (`NoneType`, `bool`, `int`, `float`, `str`, `list`). For a list the warning reads exactly "Expected dict result, got list. Treating as allow.".
  6. An error that none of the steps caught gives `failure("Unexpected error: {error}", execution)` and logs "Error testing custom code guardrail: {error}" at error level.
  The timeout failure is `failure("Execution timeout: code took longer than 5 seconds", execution)`; LiteLLM formats the number with `{:g}`, so 5 prints as "5".

  Oracle: HTTP cases boot LiteLLM and betterlite with the master key (a proxy admin) and no database, which is all this route needs. Error text from the sandbox is betterlite's own, so cases for compile and run errors ignore the `error` string and compare `success` and `error_type`. A non-admin 403 needs a virtual key, which no oracle case here can have, so named Rust tests with a fake sandbox cover the role check.
