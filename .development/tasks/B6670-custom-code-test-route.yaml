dod:
  - text: Only a caller whose role is exactly proxy_admin reaches the sandbox; proxy_admin_viewer and other roles get 403 with the exact text, and a request without a valid key gets the usual 401 body.
    proof: [test-route-access-tests, oracle]
  - text: The request body decodes with its defaults (`input_type` request, no request_data), ignores unknown keys, and a body missing `custom_code` or `test_input` answers 422 before the role check.
    proof: [test-route-body-tests, oracle]
  - text: A source with a syntax error or a refused construct, a source that fails while loading, a missing `apply_guardrail` and a non-callable one each give success false with error_type compilation and LiteLLM's text prefix.
    proof: [test-route-compile-tests, oracle]
  - text: A passing run returns the function's object result as it is, for allow, block and modify results, with success true and null error fields, for both a plain and an `async def` function.
    proof: [test-route-run-tests, oracle]
  - text: The request data given to the function has exactly the five keys with their defaults, `texts` is added to a test input that lacks it, and a runtime error gives success false with error_type execution and the prefix "Execution error".
    proof: [test-route-run-tests, oracle]
  - text: A non-object result becomes allow with the warning text and the Python type name, and a run past 5 seconds, including a source that loops while loading, gives the exact timeout text with error_type execution.
    proof: [test-route-result-tests, oracle]
  - text: The body decoder survives arbitrary bytes and its seed corpus replays.
    proof: [test-route-corpus]
checks:
  optional: []
  commands:
    - id: test-route-access-tests
      why: the role check lets a non-admin through or answers with another text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::custom_code_test::tests::access_/)'
    - id: test-route-body-tests
      why: the body defaults, the unknown-key rule or the 422 order are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::custom_code_test::tests::body_/)'
    - id: test-route-compile-tests
      why: a compile or load failure gives another message prefix or error_type
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::custom_code_test::tests::compile_/)'
    - id: test-route-run-tests
      why: the call arguments, an async function or a runtime error are handled differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::custom_code_test::tests::run_/)'
    - id: test-route-result-tests
      why: a non-object result or a timeout is reported differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::custom_code_test::tests::result_/)'
    - id: test-route-corpus
      why: the fuzz target, its seeds or the replay test are missing
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/custom_code_test_body)"
        && test -f crates/betterlite-server/fuzz/fuzz_targets/custom_code_test_body.rs
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_custom_code_test_body_corpus)'
