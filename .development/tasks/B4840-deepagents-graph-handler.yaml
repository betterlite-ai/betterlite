dod:
  - text: >-
      start validates the environment, computes the blocked tools, sets backend `writable` false when any of
      write_file, edit_file or delete is blocked and `allow_execute` false when execute is blocked, and passes a tool filter only
      when something is blocked. The agent spec carries the instructions, the `interrupt_on` policy and the output schema.
    proof: [handler-build]
  - text: >-
      The general-purpose subagent is added with the filter only when tools are blocked and the user has no subagent named
      the same; user subagents follow it unchanged.
    proof: [handler-build]
  - text: >-
      With skills, they are copied under `{workdir}/.deepagents/skills` and the spec gets `["/.deepagents/skills/"]`; with
      none, skills is absent and nothing is copied.
    proof: [handler-build, handler-skills-export]
  - text: >-
      A missing runtime fails start with InstallFailed carrying the install hint. The thread id defaults to the session id on
      the first start and survives a second start; resume replaces it; native_session_id returns it; stop twice is fine.
    proof: [handler-build]
  - text: >-
      history returns the runtime's OpenAI form of the state messages, an empty list when there are none, and fails with
      SessionClosed before start.
    proof: [handler-history]
  - text: >-
      A turn yields events only from model-node messages, yields update events with the skip-tools set, passes the thread id,
      recursion limit and a usage callback to the graph, and sets final_text and, with an output schema, output_json.
    proof: [handler-turn]
  - text: >-
      An interrupt yields one Approval per action request with the normalized tool name and its args, then resumes the graph
      with the allow or deny decisions in order under the interrupt id, and repeats until a pass ends with no interrupts.
    proof: [handler-turn]
  - text: >-
      A denied approval resumes with a reject decision whose message is the reason, or "The user denied this tool call."
      when the reason is empty; an allowed one resumes with approve.
    proof: [handler-turn]
  - text: The handler never yields Event::Done, and a turn before start fails with SessionClosed.
    proof: [handler-turn]
  - text: copy_skills is public and cli_handler::setup is a public module.
    proof: [handler-skills-export]
checks:
  optional: []
  commands:
    - id: handler-build
      why: start, the agent spec, subagent selection, skills, install failure, resume or stop is missing or wrong
      run: cargo nextest run --locked -p betterlite-deepagents-harness --no-tests=fail -E 'test(/^handler::tests::build_/)'
    - id: handler-history
      why: history is missing or wrong
      run: cargo nextest run --locked -p betterlite-deepagents-harness --no-tests=fail -E 'test(/^handler::tests::history_/)'
    - id: handler-turn
      why: the turn loop, approvals, resume payloads or the final outcome is missing or wrong
      run: cargo nextest run --locked -p betterlite-deepagents-harness --no-tests=fail -E 'test(/^handler::tests::turn_/)'
    - id: handler-skills-export
      why: copy_skills is still private to the CLI handler
      run: grep -q 'pub async fn copy_skills' crates/betterlite-harness/src/cli_handler/setup.rs && grep -q 'pub mod setup' crates/betterlite-harness/src/cli_handler.rs
oracle_cases: []
deviations:
  - what: The agent graph is reached through the `AgentRuntime` and `Graph` traits, not through the Python deepagents, langgraph and langchain-litellm imports.
    why: There is no Python in the gateway. `MissingRuntime` gives the same install failure when no runtime is wired in.
  - what: The in-memory checkpointer is owned by the runtime value, not a module-level singleton.
    why: The rules forbid module-level state. One runtime shared by sessions gives the same cross-session resume.
  - what: A call on a session that was never started fails with `HarnessError::SessionClosed`, not HarnessError("Deep Agents session is not started").
    why: SessionClosed is the existing error for this case and the CLI handler uses it.
  - what: The structured-output tool that update events skip is named by the output schema's `title`, not by the Python class `__name__`.
    why: SessionSettings holds a JSON schema, not a class. A pydantic model's schema title is its class name.
out_of_scope:
  - Choosing the handler for a harness (`get_harness_handler`) and building sessions (B4846).
  - Message, update, tool-name, policy and recursion helpers, ToolFilterMiddleware and UsageCallback (B4837).
  - SandboxBackend and its file and shell operations (B4838).
  - Copying skill files (B4839's `copy_skills`, only made public here).
  - A production AgentRuntime that really runs the agent loop; this task ships the traits, `MissingRuntime` and test fakes only.
  - Custom Python tools (`ctx.tools`), since SessionSettings has no such field.
pitfalls:
  - "Interrupts found in an `updates` part are collected before that part's update events are yielded, and the approvals are asked only after the whole pass ends."
  - "Each interrupt gets its own `{decisions: [...]}` entry keyed by its id, and one resume map holds all interrupts of a pass."
  - "`messages` parts are filtered by node name `model`; tool-node and subagent nodes would otherwise echo their text twice."
  - "`output_json` is set only when an output schema is set, even if the state has a structured_response."
  - "`start` runs again after an interrupt, so it must keep `thread_id` and may build a second graph."
  - "The default general-purpose subagent is added only when tools are blocked, because without a filter the library already provides it."
  - "The skills path handed to the graph starts with a slash and ends with a slash, while the copy target is `{workdir}/.deepagents/skills` with no leading slash."
  - "An unanswered Approval blocks the stream; waiting on `Approval.decision` (a tokio SetOnce) is the only suspension point, so do not poll."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
