id: B4840
title: Run Deep Agents graphs with approvals, skills and resumable history
description: >-
  Port LiteLLM's `DeepAgentsHandler` (litellm/harness/handlers/deepagents_handler.py, 261 lines). It is the
  BaseHarnessHandler for the Deep Agents harness. Deep Agents is a Python library and betterlite has no LangGraph, so the
  handler talks to the agent graph through traits and a fake graph stands in for it in every test. Read these on main
  first: crates/betterlite-harness/src/handlers.rs (the `BaseHarnessHandler` trait), crates/betterlite-harness/src/cli_handler.rs
  (a finished handler to copy the shape of), crates/betterlite-harness/src/deepagents/transformation.rs and
  deepagents/sandbox_backend.rs (B4837: the pure helpers and the tool filter and usage callback), and
  crates/betterlite-deepagents-harness/src/sandbox_backend.rs (B4838: `SandboxBackend` and `Permissions`). Use their exact Rust
  names and types. This task rebuilds none of them.


  The handler lives in the crate betterlite-deepagents-harness, not in betterlite-harness, because the sandbox backend is in
  that crate and it already depends on betterlite-harness. Put it in crates/betterlite-deepagents-harness/src/handler.rs and
  src/handler/. Use four files: `handler/graph.rs` for the traits and plain types, `handler/build.rs` for `start`, the agent
  spec, subagents and skills, `handler/turn.rs` for the turn loop, and `handler/tests.rs`. Add `async-stream`, `futures-core`
  and whatever else the crate needs to Cargo.toml, with the same versions crates/betterlite-harness/Cargo.toml uses.


  Skills are copied with B4839's `copy_skills` in crates/betterlite-harness/src/cli_handler/setup.rs. It is `pub(super)` now
  and `mod setup;` in cli_handler.rs is private. Make `setup` a `pub mod` and `copy_skills` `pub`, and change nothing else in
  those two files.


  Graph traits (`handler/graph.rs`). `AgentRuntime` stands for the optional Python imports of `load_deps` (L71-L91). It has
  `build_agent(AgentSpec) -> Result<Graph, HarnessError>`, `general_subagent() -> JsonObject` (deepagents'
  GENERAL_PURPOSE_SUBAGENT, whose `name` the handler compares with) and `openai_messages(&[Message]) -> Vec<JsonObject>`
  (LangChain's `convert_to_openai_messages`). `Message` and the update chunk are the types B4837's `stream_events`,
  `update_events` and `final_ai_text` take; use those. The `Graph` trait is `stream(GraphInput, RunConfig)`, returning a
  boxed stream of `StreamPart`, and `state(RunConfig) -> GraphState`. `GraphInput` is `Messages(user message)` or
  `Resume(map of interrupt id to decisions)`. `StreamPart` is `Message { message, node: String }` (LangGraph's
  `messages` mode) or `Update(chunk)` (its `updates` mode). `GraphState` holds `messages` and an optional
  `structured_response` JSON value. `RunConfig` holds `thread_id`, `recursion_limit` and an optional `UsageCallback`
  (B4837). `AgentSpec` holds what `create_deep_agent` gets at L130-L141: the chat model arguments from B4837's
  `chat_model_kwargs`, `system_prompt` (the session instructions), an optional B4837 `ToolFilterMiddleware`, the subagent
  list, the skills list, the backend `Permissions`, the `interrupt_on` policy and the output schema. A unit struct
  `MissingRuntime` implements `AgentRuntime` and fails `build_agent` with `HarnessError::InstallFailed` carrying B4837's
  `INSTALL_HINT`, as `load_deps` raises `HarnessInstallFailed` when the imports fail. The checkpointer is the runtime's own
  state, so one runtime value shared by sessions keeps `resume` working across sessions as LiteLLM's process-wide
  `_SHARED_CHECKPOINTER` does. There is no module-level state.


  `DeepAgentsHandler<C, R>` holds the config `C`, the runtime `R`, the graph (`Option`), `thread_id: Option<String>` and
  `skip_tools: BTreeSet<String>`, and implements `BaseHarnessHandler`.


  start (L119-L144). Call `config.validate_environment`. Compute `blocked = blocked_tools(permissions, disable_tools)`.
  Backend permissions: `writable` when `WRITE_TOOLS` and `blocked` share nothing, `allow_execute` when `EXECUTE_TOOLS` and
  `blocked` share nothing. The filter middleware exists only when `blocked` is not empty. Custom tools are not passed, since
  SessionSettings has no tools field (docs/deviations/B4830.yaml). Build the agent through the runtime. `skip_tools` becomes
  the output schema's `title` when an output schema is set and has a string `title`, else empty. If `thread_id` is unset,
  set it to the session id; a second `start` after an interrupt keeps the thread id and rebuilds the graph.


  Subagents (L243-L254). The user's list is `DeepAgentsOptions.subagents`, or empty. The default general-purpose subagent
  (the runtime's `general_subagent()` with the tool filter added) goes first, and only when `blocked` is not empty and no
  user subagent has the same `name`. User subagents come after it, unchanged.


  Skills (L257-L261). With no skills, pass `None`. Otherwise `copy_skills(sandbox, skills, "{workdir}/{SKILLS_DIR}")` and
  pass `["/{SKILLS_DIR}/"]`. `SKILLS_DIR` is B4837's constant (".deepagents/skills").


  stop sets the graph to `None` and is safe twice. `native_session_id` returns `thread_id`. `resume` sets `thread_id`. A
  call that needs the graph before `start` (turn, history) fails with `HarnessError::SessionClosed`.


  history (L155-L164). Read the graph state under a run config with no usage callback and return
  `openai_messages(messages)`, with an empty list when the state has none. Requires the history capability that
  B4837's config already declares.


  turn (L166-L222), in `handler/turn.rs`, as an `async_stream` stream. Build the run config with the thread id (or the
  session id), `recursion_limit(ctx)` and a `UsageCallback` for the session. Loop: stream one pass over the graph and
  handle each part. A `Message` part from node "model" yields the events of `stream_events`; any other node is skipped. An
  `Update` part first appends the chunk's `interrupts_in` to the pass's interrupt list and then yields `update_events(chunk,
  skip_tools)`. When the pass ends with no interrupts, leave the loop. Otherwise, for each interrupt in order, for each
  `approval_requests(interrupt value)` entry, yield `Event::Approval` with `tool = normalized_tool_name(name)` and `input`
  the entry's `args` (empty when absent), then wait on that approval's decision. `Decision::Allow` becomes `decision(true,
  "")` and `Decision::Deny { reason }` becomes `decision(false, reason)`. Decisions of one interrupt are collected in
  order and stored under the interrupt id. The next pass starts with `GraphInput::Resume` of that map. After the loop,
  read the state: `outcome.final_text = final_ai_text(messages)`, and when an output schema is set,
  `outcome.output_json = structured_json(structured_response)`. The stream never yields `Event::Done`.
scope:
  paths:
    - crates/betterlite-deepagents-harness/Cargo.toml
    - Cargo.lock
    - crates/betterlite-deepagents-harness/src/handler.rs
    - crates/betterlite-deepagents-harness/src/handler/**
    - crates/betterlite-harness/src/cli_handler.rs
    - crates/betterlite-harness/src/cli_handler/setup.rs
  lint_tables: false
