id: B10043
title: An unknown or unconfigured provider on video status, content, remix, list and character calls answers 400, not 500
description: >-
  LiteLLM bug, decided "fix it" with B10039 (https://github.com/betterlite-ai/betterlite/pull/2966), which fixes the
  same answer for video edit and extension. B3339, B3340 and B3341 landed with it. A video_status, video_content,
  video_remix, video_list, video_create_character or video_get_character call whose custom_llm_provider is unknown
  ("bogus") or known without a video config fails with an error that goes through exception_type's ValueError path,
  so it comes out as ErrorClass::ApiConnection with status 500. The provider name is the caller's input and the call
  can never succeed, so a 500 tells the client the server broke when its own request was wrong.


  These arms answer ErrorClass::BadRequest (status 400) with the message they have today, model "" and the caller's
  provider, built with ResponseDetails::for_provider from B10039 (crates/betterlite-error/src/error/details.rs):
  VideoStatusCallError::UnknownProvider and ::Unsupported, and VideoStatusError::UnknownProvider in status_failure,
  in crates/betterlite-core/src/api/video_status_call/error.rs; VideoContentCallError::UnknownProvider and
  ::Unsupported in crates/betterlite-core/src/api/video_content_call/error.rs; VideoCallError::UnknownProvider,
  ::Unsupported and ::ConfigMissing, and VideoRemixListTransportError::UnknownProvider in transport_class, in
  crates/betterlite-core/src/api/video_remix_call/error.rs (video_list shares it); CharacterCallError::UnknownProvider,
  ::CreateUnsupported and ::GetUnsupported in crates/betterlite-core/src/api/video_character_calls/error.rs. A Selection
  error answers 400 only where it means the provider has no video config, the case the unsupported_provider tests
  drive; any other selection failure keeps its class. Every other arm keeps its class too.


  The tests that assert the 500 today assert ErrorClass::BadRequest, status 400, the unchanged message, model "" and
  the provider after this task: video_status_call/tests/unknown_provider.rs and unsupported_provider.rs, the same two
  files under video_content_call/tests, video_remix_call/tests/remix_provider.rs and unsupported_provider.rs,
  video_list_call/tests/unsupported_provider.rs, and create_a_provider_without_a_video_config_is_unsupported and
  get_a_provider_without_a_video_config_is_unsupported under video_character_calls/tests. If the character calls have
  no unknown-name case, add one to those two files. Add a row to docs/deviations/B3339.yaml, B3340.yaml and
  B3341.yaml for the calls each task built, saying they answer 400 where LiteLLM answers 500, with the pinned links
  below, and rewrite any row there that says these failures answer 500.
