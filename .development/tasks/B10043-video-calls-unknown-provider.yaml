  - crates/betterlite-core/src/api/video_status_call/error.rs
  - crates/betterlite-core/src/api/video_status_call/tests/**
  - crates/betterlite-core/src/api/video_content_call/error.rs
  - crates/betterlite-core/src/api/video_content_call/tests/**
  - crates/betterlite-core/src/api/video_remix_call/error.rs
  - crates/betterlite-core/src/api/video_remix_call/tests/**
  - crates/betterlite-core/src/api/video_list_call/tests/**
  - crates/betterlite-core/src/api/video_character_calls/error.rs
  - crates/betterlite-core/src/api/video_character_calls/tests/**
  - docs/deviations/B3339.yaml
  - docs/deviations/B3340.yaml
  - docs/deviations/B3341.yaml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L1033-L1037
  why: video_status raises ValueError for an unknown provider or one without a video config, and exception_type turns it into a 500.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L331-L335
  why: video_content does the same.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L600-L604
  why: video_remix does the same.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L812-L816
  why: video_list does the same.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L1174-L1178
  why: video_create_character does the same.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L1299-L1303
  why: video_get_character does the same.
dod:
- text: >-
    A video status, content, remix, list, create-character or get-character call with an unknown provider or one
    without a video config answers ErrorClass::BadRequest with status 400, its message, model "" and the caller's
    provider, and every other failure keeps its class.
  proof: [error-tests, call-tests]
- text: >-
    The four video error modules build that answer with ResponseDetails::for_provider.
  proof: [one-constructor]
- text: >-
    docs/deviations/B3339.yaml, B3340.yaml and B3341.yaml record the 400 with the pinned LiteLLM links.
  proof: [deviation-rows]
checks:
  optional: []
  commands:
  - id: error-tests
    why: An unknown or unconfigured provider still answers 500 on one of these calls.
    run: >-
      grep -q -F 'ErrorClass::BadRequest' crates/betterlite-core/src/api/video_status_call/tests/unknown_provider.rs
      && grep -q -F 'ErrorClass::BadRequest' crates/betterlite-core/src/api/video_content_call/tests/unknown_provider.rs
      && grep -q -F 'ErrorClass::BadRequest' crates/betterlite-core/src/api/video_remix_call/tests/unsupported_provider.rs
      && grep -q -F 'ErrorClass::BadRequest' crates/betterlite-core/src/api/video_list_call/tests/unsupported_provider.rs
      && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_(content|status)_call::(.*::)?(unknown|unsupported)_provider_/) | test(/^api::video_remix_call::(remix_provider|unsupported_provider)/) | test(/^api::video_list_call::unsupported_provider/) | test(/^api::video_character_calls::tests::.*a_provider_without_a_video_config_is_unsupported$/)'
  - id: call-tests
    why: The change broke another behavior of these video calls.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_(status|content|remix|list)_call::/) | test(/^api::video_character_calls::tests::/)'
  - id: one-constructor
    why: A video error module still writes its own details for the provider mistake instead of the shared constructor.
    run: >-
      grep -q -F 'ResponseDetails::for_provider(' crates/betterlite-core/src/api/video_status_call/error.rs
      && grep -q -F 'ResponseDetails::for_provider(' crates/betterlite-core/src/api/video_content_call/error.rs
      && grep -q -F 'ResponseDetails::for_provider(' crates/betterlite-core/src/api/video_remix_call/error.rs
      && grep -q -F 'ResponseDetails::for_provider(' crates/betterlite-core/src/api/video_character_calls/error.rs
  - id: deviation-rows
    why: A deviation row for the 400 is missing its pinned link.
    run: >-
      perl -0ne 'exit !(m{- what:(?:(?!- what:).)*?400(?:(?!- what:).)*?videos/main[.]py[#]L1033-L1037}s
      && m{- what:(?:(?!- what:).)*?400(?:(?!- what:).)*?videos/main[.]py[#]L331-L335}s)' docs/deviations/B3339.yaml
      && perl -0ne 'exit !(m{- what:(?:(?!- what:).)*?400(?:(?!- what:).)*?videos/main[.]py[#]L600-L604}s
      && m{- what:(?:(?!- what:).)*?400(?:(?!- what:).)*?videos/main[.]py[#]L812-L816}s)' docs/deviations/B3340.yaml
      && perl -0ne 'exit !(m{- what:(?:(?!- what:).)*?400(?:(?!- what:).)*?videos/main[.]py[#]L1174-L1178}s
      && m{- what:(?:(?!- what:).)*?400(?:(?!- what:).)*?videos/main[.]py[#]L1299-L1303}s)' docs/deviations/B3341.yaml
oracle_cases: []
deviations:
- what: >-
    A video status or content call with an unknown provider or one without a video config answers 400 BadRequest.
  why: >-
    LiteLLM raises a ValueError that exception_type turns into a 500, though the caller's provider name is the
    mistake.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L1033-L1037
- what: >-
    A video remix or list call with an unknown provider or one without a video config answers 400 BadRequest.
  why: >-
    LiteLLM raises a ValueError that exception_type turns into a 500, though the caller's provider name is the
    mistake.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L600-L604
- what: >-
    A video create or get character call with an unknown provider or one without a video config answers 400
    BadRequest.
  why: >-
    LiteLLM raises a ValueError that exception_type turns into a 500, though the caller's provider name is the
    mistake.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L1174-L1178
out_of_scope:
- Video edit and extension, which B10039 fixes.
- Video generation, which has no unsupported-provider arm on main yet.
pitfalls:
- A mock_response still wins over an unsupported provider (mock_response_wins_over_an_unsupported_provider), so that test keeps its answer.
review_level: standard
budget:
  max_changed_lines: 450
  max_new_expects: 0
