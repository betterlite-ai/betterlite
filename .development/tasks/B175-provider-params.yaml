id: B175
title: Provider parameter capabilities and mapping
description: >-
  Add typed parameter classification and capability dispatch under betterlite-provider/params, reusing B004/B006's
  chat/embedding wire fields and B174's identity. Expose supported OpenAI parameter queries for implemented adapters
  and a common mapping result separating standard parameters, provider passthrough fields and explicit drop outcomes.
  Keep omission distinct from an explicit value where provider defaults matter; numeric wire parameters use exact
  decimal types. Consume B212 reasoning-budget, service-tier and logging projection helpers. B010's final dispatcher
  will call these functions; do not add endpoints or claim capabilities for unimplemented adapters. A requested
  drop_params or additional_drop_params policy must report the removed field names through a typed mapping outcome
  so the caller can record the decision without logging values. Add parameter helper cases and existing HTTP chat
  regression cases; extend the existing chat/config parsers and their corpora as fields become supported.  Seed
  B171's shared helper_case corpus with every added operation and replay it through the common typed parser. Name
  the result ParameterMapping {standard, provider_fields, dropped_fields} in params.rs. Add request reasoning_effort,
  thinking, service_tier, drop_params, additional_drop_params and allowed_openai_params; support litellm_params.drop_params/additional_drop_params
  and litellm_settings.drop_params. allowed_openai_params extends the supported list before unsupported-field rejection,
  without altering credential provenance. B176 exclusively owns trusted ControlOptions. Budget 250 mapping/types,
  100 wire/config, 100 adapters and 300 tests/fuzz (750 total). Write the behavior rstest functions b175_provider_params_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. Register helper operations provider_params in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-provider/Cargo.toml
  - crates/betterlite-provider/src/lib.rs
  - crates/betterlite-provider/src/error.rs
  - crates/betterlite-provider/src/params.rs
  - crates/betterlite-provider/src/params/**
  - crates/betterlite-openai/**
  - crates/betterlite-config/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/provider-params/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_supported_openai_params.py#L9-L135
  why: Call-type/provider capability dispatch.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/model_param_helper.py#L25-L185
  why: Standard API parameters and excluded content/metadata fields.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/reasoning_effort_utils.py#L12-L26
  why: Thinking budget thresholds.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/service_tier_utils.py#L18-L70
  why: Served, requested and logging service-tier selection.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/chat/transformation.py#L99-L164
  why: Shared thinking, token and developer-role hooks.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4535-L4560
  why: allowed_openai_params extends supported names.
dod:
- text: >-
    Parameter defaults, explicit values, supported names, reasoning boundaries, served tier and content-free projections
    match listed helper cases.
  proof:
  - oracle
  - helper-python
- text: >-
    Unsupported fields fail by name unless an explicit drop policy applies, and each intentional drop is returned
    as a field name without its value.
  proof:
  - provider-params-tests
- text: Passthrough values cannot overwrite standard typed fields or trusted control fields.
  proof:
  - provider-params-tests
- text: The extended chat and config parsers replay their corpus under normal tests.
  proof:
  - chat-request-corpus
  - config-yaml-corpus
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: provider-params-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-provider -p betterlite-openai -p betterlite-config --no-tests=fail
      -E 'test(/::b175_provider_params_tests_behavior($|::)/) - test(/replays_the_/)'
  - id: chat-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'drop_params' crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq 'additional_drop_params'
      crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'provider_params' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/provider-params/supported-chat.yaml
- tools/oracle/cases/helpers/provider-params/supported-embedding.yaml
- tools/oracle/cases/helpers/provider-params/absent-null-zero.yaml
- tools/oracle/cases/helpers/provider-params/unsupported-param.yaml
- tools/oracle/cases/helpers/provider-params/drop-params.yaml
- tools/oracle/cases/chat/openai-tools.yaml
- tools/oracle/cases/chat/openai-extra-param.yaml
- tools/oracle/cases/helpers/provider-params/allowed-openai-params.yaml
- tools/oracle/cases/helpers/provider-params/o-series-supported.yaml
- tools/oracle/cases/helpers/provider-params/gpt5-supported.yaml
deviations: []
out_of_scope:
- Provider-specific mapping tables are extended by the corresponding provider tasks.
- Actual routing, spend calculations and execution are outside this part.
- >-
  ModelParamHelper, service-tier and reasoning-budget helpers are B212; get_supported_openai_params branches for
  other providers are implemented by B024-B050.
pitfalls:
- Do not confuse an absent capability result with an empty supported-parameter list.
- A JSON passthrough field is an explicit narrow exception, not permission to make the whole request untyped.
- An opt-in drop policy is observable; a silently ignored field still violates the rules.
- >-
  OpenAI chat capability selection uses ProviderConfigManager and varies for o-series and gpt-5; request_type=embeddings
  returns OpenAI chat parameter names at the pin.
- B190 calls service-tier helpers with plain fields; do not introduce a payload-type dependency back to logging.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
